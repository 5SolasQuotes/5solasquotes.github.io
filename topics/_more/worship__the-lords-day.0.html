<figure class="quote" id="q-69fe63c79b" data-kw="">
<blockquote><p>3. Labour or pains for the enjoyment of the benefit and advantage of the solemn assemblies of the church, and in them of the appointed worship of God, is so far from entrenching on the rest of this day that it belongs unto its due observance. A mere bodily rest is no part of religious worship in itself; nor does it belong unto the sanctification of this day any farther than as it is a means for the due performance of the other duties belonging to it. We have no bounds under the gospel for a Sabbath-day’s journey, provided it be for Sabbath ends. In brief, all pains or labour that our station and condition in this world, that our troubles which may befall us, or any thing else, make necessary, as that without which we cannot enjoy the solemn ends and uses of this holy day of rest, are no way inconsistent with the due observance of it. It may be the lot of one man to take so much pains and to travel so far for, and in the due celebration of the Lord’s day, as if another should do the like without his occasions and circumstances, it would be a profanation of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitation XL, ‘The Practical Observance of the Lord’s Day’ in Commentary on Hebrews (d. 1683), vol. 1 (of 4)</cite>, p. 749</span></figcaption>

</figure><figure class="quote" id="q-87ad15d57f" data-kw="">
<blockquote><p>I do highly approve the distinction following of things commanded, and things permitted on the Lord’s Day, and the explication of each member; the object of the one, all actions advancing God’s service; the object of the other, such things as are no hindrance thereunto; As in the first place works of necessity; then works of charity; yet the permitting of these, is rightly to be understood; not so as if the works of necessity here mentioned, were in such sort permitted as left to a man’s liberty, whether he will perform them or no. For undoubtedly we are bound as much as lies in our power, to quench a dangerous fire kindled in a town, on the Sabbath day, it being a work of mercy, necessarily required. For if to return a pledge ere the poor pawner of it went to his bed, in case it were his covering, were a work of mercy, how much more to save a man’s house from burning, how much more to save a whole town from being consumed, whereby many might be driven to lie without doors, void of all comfort to the body? So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641)</cite>, p. 241</span></figcaption>

<blockquote><p>1. That we are to spend the whole time in public and private exercises of God’s worship. 2. Except so much as it be taken up in the works of necessity and mercy. The former directs us to that which is the main work of the Day, the latter to that which is subordinate and occasional. …we are therefore to keep it [the Day] holy, as we are enjoined in the body of the [4th] Command, which we observed, includes in it something positive. 2. The duties of worship to be attended by us on this Day, are either Natural or Instituted… 1. The duties of natural worship, are such as are suited to the nature of man, and flow from the great End he was made for, viz. actively to glorify God. And therefore the light of Nature directs men to practice them on all occasions, certainly then these are fitted for the Sabbath, according to the End and usefulness of it… 2. The duties of instituted worship. And under these are contained all the positive ordinances and sacred ceremonies of God’s appointment. In the days of the Law there were sacrifices appointed to be offered on these days… But all these are not out of doors under the Gospel, being to give place to a more spiritual worship, which is adapted thereunto. Nevertheless, there are appointments under the Gospel, which are positive, and these are either the way and manner, in which the duties of natural worship are to be attended, in the public assemblies, and the ministration of the Word, and preaching of it, which is also required on the Sabbath; or the dispensation of the sacraments of the Gospel, which we have before taken notice of, as belonging to the Sabbath. … 4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: Nevertheless because this is the principal and direct business of the Day, it is to have a very great regard had to it in all that we do. And here I shall only offer a few general rules: … 2. It is not necessary that all the duties of worship be solemnly attended on every Sabbath. Though there are none that belong to, and are proper for that day, yet there is no obligation lying upon us to go through them all every time the Sabbath recurs; but there is a prudence to be used by the people of God on this account, though still there are some which should be more constantly attended, and others more intermittedly. And here observe, that there are the duties of natural worship, which challenge the first place and more constant attendance, viz. prayer, and the dispensation of the Word of God, and holy meditation: whereas those which are ceremonial may have their particular times to be attended… 3. That the public and private duties of worship, ought so to be ordered, that they may help and not thrust out one the other. The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… the seasons of public worship must be ordered for edification, which naturally requires that all are agreed in it, else there will be no avoiding of confusion. … 5. That whatsoever they do on that Day, ought to be with a suitable regard to the holiness of the time… (2.) There is an exception made of so much time, as is to be taken up, in works of necessity and mercy: i.e. These may and must interrupt the other duties, so far as they do intervene. And for a right understanding of this, let these things be observed: 1. That the Sabbath was appointed for man’s good, and not for his harm. This is a general rule, but may be particularly accommodated with due caution. Our Savior makes use of it, in reflecting upon the unjust censures of the Pharisees cast upon his disciples, for gathering and eating ears of corn on the Sabbath Day, Mk. 2:27, “And He said unto them, The Sabbath was made for man, and not man for the Sabbath.” It was indeed to advance man’s spiritual interest, in giving him opportunity to sequester himself for communion with God in the way of mediate worship, but was never intended to hurt any of his interests in this world. 2. That as there are duties of worship to be performed on our days, so there are duties of righteousness to be done on God’s Day. These duties, though they differ in the next object and end, the one belonging to the First, the other to the Second Table, yet they agree on the ultimate object and end, which is God and his glory; for this as well as that is to be done in obedience to Him; and when they are so done sincerely, we have communion with God in them: The one belongs to our duty to man, but it is in order of serving God, and so they do not necessarily thwart one the other… In like manner there are Second Table duties that may or ought to be done on Holy Time; and are either stated duties of the Day, or are occasionally called for by the circumstances: what these are will be presently considered. 3. In the doing of the duties of the Sabbath, we are to employ our body as well as our soul… Nor can God’s people hold visible communion one with another, without the using of their bodies in it: We are therefore commanded, 1 Cor. 6:20, “Glorify God in your body, and in your spirit, which are God’s. And the reason for it is cogent, viz. Christ has redeemed the whole man; and indeed the body is necessarily the soul’s organ in the working of its imperate [commanded] acts in which all outward worship of God is to be performed by man; and therefore a pretense to a spiritual communion to exclude the other is Enthusiastical. 4. Hence that the body may be fit to discharge these duties aright, there is something to be done for it on that Day. The body has a dependence on means for the maintaining of the vigor and activity of it, whereby it may be fit to attend the service it is appointed to, without tiring, fainting or giving in: and it stands in need of this as well for Sabbath service, as for the business of this life; for we are to do these with our might, as well as the other: whatsoever is requisite for this, must be very proper for the Day… 5. And there are duties which we owe to our neighbor on the Sabbath, as well as at any other time. The duty of loving our neighbor as ourselves is an abiding duty, and uninterrupted: It is not only a Week Day duty, and to be omitted on the Sabbath; though that be to govern us in the right discharge of it: And he may, and very often does, stand in need of our affording it to him, not only for his soul, by counseling and instructing him in the things of God; but also in regard of his bodily and outward concerns, which are not in themselves the acts of worship, but of charity; but yet are not to be omitted, till this Day be over. 6. These duties are usually distributed into the works of necessity and mercy. It is true, the works of mercy here called for, are such as have a moral necessity on them, arising from the physical necessity of the subject, which makes it our duty, if we will not bring guilt of sin upon ourselves, to attend on: And the works of necessity here intended, may in a sense be called the works of mercy, because they succour the subject against that misery which they must otherwise undergo: But we look upon them under this distinct consideration. And then: (1.) Under the head of Necessity we rank two sorts, viz. 1. Such as are of Ordinary necessity or convenience. For we are not to think the Precept is here tied up to things absolutely necessary; as if nothing might be done, but what the creature could not subsist without, but such things as are needful, for the comfortable serving of God. … 2. Such as fall out Extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.’ (2.) To quench fires that break forth, which otherwise would lay all waste before them. That is a sudden emergency, and was not to be seen before, and calls for speed and expedition, and the least hindrance will soon make all attempts too late, for miracles are not in this case to be expected. And hence any other thing of like importance, that falls out in the Day, and may not be delayed, comes within this verge. (2.) Under the head of mercy, these things more especially do come; (1.) To visit the sick. That is in itself a duty of Christians, appears in that it is referred to Pure Religion, James 1:27. And the reason of this is, because their necessity calls for it, and it is a work of mercy to do it, and to neglect it when needed is inhumane: and there are cases in which that will stand, Mt. 9:13, “I will have mercy, and not sacrifice.</p></blockquote>

ises.+That+it+cannot+all+of+it+be+actually+so+attended%2C+will+be+considered+afterwards%3A+Nevertheless+because+this+is+the+principal+and+direct+business+of+the+Day%2C+it+is+to+have+a+very+great+regard+had+to+it+in+all+that+we+do.+And+here+I+shall+only+offer+a+few+general+rules%3A+%E2%80%A6+2.+It+is+not+necessary+that+all+the+duties+of+worship+be+solemnly+attended+on+every+Sabbath.+Though+there+are+none+that+belong+to%2C+and+are+proper+for+that+day%2C+yet+there+is+no+obligation+lying+upon+us+to+go+through+them+all+every+time+the+Sabbath+recurs%3B+but+there+is+a+prudence+to+be+used+by+the+people+of+God+on+this+account%2C+though+still+there+are+some+which+should+be+more+constantly+attended%2C+and+others+more+intermittedly.+And+here+observe%2C+that+there+are+the+duties+of+natural+worship%2C+which+challenge+the+first+place+and+more+constant+attendance%2C+viz.+prayer%2C+and+the+dispensation+of+the+Word+of+God%2C+and+holy+meditation%3A+whereas+those+which+are+ceremonial+may+have+their+particular+times+to+be+attended%E2%80%A6+3.+That+the+public+and+private+duties+of+worship%2C+ought+so+to+be+ordered%2C+that+they+may+help+and+not+thrust+out+one+the+other.+The+whole+Sabbath+is+not+to+be+spent+in+public%2C+nor+yet+in+private+ordinarily%2C+except+when+the+providence+of+God+prevents+the+opportunity+of+public+assemblies%2C+which+is+wont+%5Baccustomed%5D+to+fall+out+in+times+of+persecution%E2%80%A6+the+seasons+of+public+worship+must+be+ordered+for+edification%2C+which+naturally+requires+that+all+are+agreed+in+it%2C+else+there+will+be+no+avoiding+of+confusion.+%E2%80%A6+5.+That+whatsoever+they+do+on+that+Day%2C+ought+to+be+with+a+suitable+regard+to+the+holiness+of+the+time%E2%80%A6+%282.%29+There+is+an+exception+made+of+so+much+time%2C+as+is+to+be+taken+up%2C+in+works+of+necessity+and+mercy%3A+i.e.+These+may+and+must+interrupt+the+other+duties%2C+so+far+as+they+do+intervene.+And+for+a+right+understanding+of+this%2C+let+these+things+be+observed%3A+1.+That+the+Sabbath+was+appointed+for+man%E2%80%99s+good%2C+and+not+for+his+harm.+This+is+a+general+rule%2C+but+may+be+particularly+accommodated+with+due+caution.+Our+Savior+makes+use+of+it%2C+in+reflecting+upon+the+unjust+censures+of+the+Pharisees+cast+upon+his+disciples%2C+for+gathering+and+eating+ears+of+corn+on+the+Sabbath+Day%2C+Mk.+2%3A27%2C+%E2%80%9CAnd+He+said+unto+them%2C+The+Sabbath+was+made+for+man%2C+and+not+man+for+the+Sabbath.%E2%80%9D+It+was+indeed+to+advance+man%E2%80%99s+spiritual+interest%2C+in+giving+him+opportunity+to+sequester+himself+for+communion+with+God+in+the+way+of+mediate+worship%2C+but+was+never+intended+to+hurt+any+of+his+interests+in+this+world.+2.+That+as+there+are+duties+of+worship+to+be+performed+on+our+days%2C+so+there+are+duties+of+righteousness+to+be+done+on+God%E2%80%99s+Day.+These+duties%2C+though+they+differ+in+the+next+object+and+end%2C+the+one+belonging+to+the+First%2C+the+other+to+the+Second+Table%2C+yet+they+agree+on+the+ultimate+object+and+end%2C+which+is+God+and+his+glory%3B+for+this+as+well+as+that+is+to+be+done+in+obedience+to+Him%3B+and+when+they+are+so+done+sincerely%2C+we+have+communion+with+God+in+them%3A+The+one+belongs+to+our+duty+to+man%2C+but+it+is+in+order+of+serving+God%2C+and+so+they+do+not+necessarily+thwart+one+the+other%E2%80%A6+In+like+manner+there+are+Second+Table+duties+that+may+or+ought+to+be+done+on+Holy+Time%3B+and+are+either+stated+duties+of+the+Day%2C+or+are+occasionally+called+for+by+the+circumstances%3A+what+these+are+will+be+presently+considered.+3.+In+the+doing+of+the+duties+of+the+Sabbath%2C+we+are+to+employ+our+body+as+well+as+our+soul%E2%80%A6+Nor+can+God%E2%80%99s+people+hold+visible+communion+one+with+another%2C+without+the+using+of+their+bodies+in+it%3A+We+are+therefore+commanded%2C+1+Cor.+6%3A20%2C+%E2%80%9CGlorify+God+in+your+body%2C+and+in+your+spirit%2C+which+are+God%E2%80%99s.+And+the+reason+for+it+is+cogent%2C+viz.+Christ+has+redeemed+the+whole+man%3B+and+indeed+the+body+is+necessarily+the+soul%E2%80%99s+organ+in+the+working+of+its+imperate+%5Bcommanded%5D+acts+in+which+all+outward+worship+of+God+is+to+be+performed+by+man%3B+and+therefore+a+pretense+to+a+spiritual+communion+to+exclude+the+other+is+Enthusiastical.+4.+Hence+that+the+body+may+be+fit+to+discharge+these+duties+aright%2C+there+is+something+to+be+done+for+it+on+that+Day.+The+body+has+a+dependence+on+means+for+the+maintaining+of+the+vigor+and+activity+of+it%2C+whereby+it+may+be+fit+to+attend+the+service+it+is+appointed+to%2C+without+tiring%2C+fainting+or+giving+in%3A+and+it+stands+in+need+of+this+as+well+for+Sabbath+service%2C+as+for+the+business+of+this+life%3B+for+we+are+to+do+these+with+our+might%2C+as+well+as+the+other%3A+whatsoever+is+requisite+for+this%2C+must+be+very+proper+for+the+Day%E2%80%A6+5.+And+there+are+duties+which+we+owe+to+our+neighbor+on+the+Sabbath%2C+as+well+as+at+any+other+time.+The+duty+of+loving+our+neighbor+as+ourselves+is+an+abiding+duty%2C+and+uninterrupted%3A+It+is+not+only+a+Week+Day+duty%2C+and+to+be+omitted+on+the+Sabbath%3B+though+that+be+to+govern+us+in+the+right+discharge+of+it%3A+And+he+may%2C+and+very+often+does%2C+stand+in+need+of+our+affording+it+to+him%2C+not+only+for+his+soul%2C+by+counseling+and+instructing+him+in+the+things+of+God%3B+but+also+in+regard+of+his+bodily+and+outward+concerns%2C+which+are+not+in+themselves+the+acts+of+worship%2C+but+of+charity%3B+but+yet+are+not+to+be+omitted%2C+till+this+Day+be+over.+6.+These+duties+are+usually+distributed+into+the+works+of+necessity+and+mercy.+It+is+true%2C+the+works+of+mercy+here+called+for%2C+are+such+as+have+a+moral+necessity+on+them%2C+arising+from+the+physical+necessity+of+the+subject%2C+which+makes+it+our+duty%2C+if+we+will+not+bring+guilt+of+sin+upon+ourselves%2C+to+attend+on%3A+And+the+works+of+necessity+here+intended%2C+may+in+a+sense+be+called+the+works+of+mercy%2C+because+they+succour+the+subject+against+that+misery+which+they+must+otherwise+undergo%3A+But+we+look+upon+them+under+this+distinct+consideration.+And+then%3A+%281.%29+Under+the+head+of+Necessity+we+rank+two+sorts%2C+viz.+1.+Such+as+are+of+Ordinary+necessity+or+convenience.+For+we+are+not+to+think+the+Precept+is+here+tied+up+to+things+absolutely+necessary%3B+as+if+nothing+might+be+done%2C+but+what+the+creature+could+not+subsist+without%2C+but+such+things+as+are+needful%2C+for+the+comfortable+serving+of+God.+%E2%80%A6+2.+Such+as+fall+out+Extraordinarily%2C+or+on+special+occasions%2C+which+put+unavoidable+necessity+of+intermitting+the+proper+duties+of+the+Day%3B+and+if+we+do+not+attend+them%2C+we+shall+be+further+exposed.+And+of+this+sort+are%3A+%281.%29+To+fight+or+fly+from+an+invading+enemy%3A+if+not+to+be+aggressors+on+such+a+Day%2C+yet+to+stand+on+their+own+defense%2C+when+assaulted.+The+law+of+self-preservation+calls+for+it%2C+and+the+thing+itself+puts+by+duties+of+worship%2C+and+if+this+were+not+a+duty%2C+but+unlawful%2C+we+should+by+it+become+a+prey+to+them+that+hate+us.+And+as+to+flying%2C+when+oppressed+on+a+Sabbath+by+a+prevailing+foe%2C+against+whom+we+cannot+defend+ourselves%2C+our+Savior+supposes+it+lawful%2C+though+afflictive%2C+in+Mt.+24%3A20%2C+%E2%80%98Pray+that+your+flight+be+not+on+the+Sabbath+Day.%E2%80%99+%282.%29+To+quench+fires+that+break+forth%2C+which+otherwise+would+lay+all+waste+before+them.+That+is+a+sudden+emergency%2C+and+was+not+to+be+seen+before%2C+and+calls+for+speed+and+expedition%2C+and+the+least+hindrance+will+soon+make+all+attempts+too+late%2C+for+miracles+are+not+in+this+case+to+be+expected.+And+hence+any+other+thing+of+like+importance%2C+that+falls+out+in+the+Day%2C+and+may+not+be+delayed%2C+comes+within+this+verge.+%282.%29+Under+the+head+of+mercy%2C+these+things+more+especially+do+come%3B+%281.%29+To+visit+the+sick.+That+is+in+itself+a+duty+of+Christians%2C+appears+in+that+it+is+referred+to+Pure+Religion%2C+James+1%3A27.+And+the+reason+of+this+is%2C+because+their+necessity+calls+for+it%2C+and+it+is+a+work+of+mercy+to+do+it%2C+and+to+neglect+it+when+needed+is+inhumane%3A+and+there+are+cases+in+which+that+will+stand%2C+Mt.+9%3A13%2C+%E2%80%9CI+will+have+mercy%2C+and+not+sacrifice.%E2%80%9D%0A%0A%E2%80%94+Samuel+Willard%2C+A+Complete+Body+of+Divinity%E2%80%A6+%28Boston%2C+1726%29%2C+Sermon+172%2C+Q.+60%2C+pp.+584-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa27b0f61c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a27b0f61c7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=1.%20That%20we%20are%20to%20spend,will%20have%20mercy%2C%20and%20not%20sacrifice&amp;text=1.%20That%20we%20are%20to%20spend%20the%20whole&amp;text=9%3A13%2C%20%E2%80%9CI%20will%20have%20mercy%2C%20and%20not%20sacrifice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[Rutherford’s] Answer: [William] Whittaker says indeed universal synods are not simply necessary ([On Scripture] Controversy 1, question 1, pp. 22-23); and [Matthew] Parker [an Anglican] says no more: they are not absolutely necessary, necessitate medii [by a necessity of means], but they are necessary, necessitate praecepti [by a necessity of precept], and conditionally, if some politic-union were amongst all national churches; But hence it follows not that they are not Christ’s ordinances, because they are not this way necessary, necessitate medii; for then baptism and the Lord’s Supper, public preaching of the Word, perfect discipline were not Christ’s ordinances, because in time of persecution, or universal apostasy, many, yea even whole Churches may be saved without these.</p></blockquote>

<blockquote><p>Direction 13. Remember that whatever duty you seem obliged to perform, the obligation still supposes that it is not naturally impossible to you, and therefore you are bound to do it as well as you can. And when other men’s force or your natural disability hinders you from doing it as you would, you are not therefore disobliged from doing it at all: but the total omission is worse than the defective performance of it, as the defective performance is worse than doing it more perfectly.ª And in such a case the defects which are utterly involuntary are none of yours imputatively at all, but his that hinders you (unless as some other sin might cause that). ª See Mr. Truman’s book of Natural and Moral Imptency.</p></blockquote>

<blockquote><p>4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: … 3. …The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… … 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.&#x27;</p></blockquote>

<blockquote><p>‘Such things’ (says Aaron) ‘have befallen me, and if I had eaten the sin-offering to day, should it have been good in the eyes of the Lord?’ [Lev. 10:19] In these words Aaron excuses himself, by reason of his sorrow, which made him unfit and unworthy to eat of those holy things. Dt. 12:7 &amp; 26:14; Hos. 9:4. The [Romanist] Douay divines, somewhat to the same purpose: ‘Natural grief of mind made Aaron both unwilling to eat, and less apt to complete all the ceremonies: so without sin he omitted that pertained to his own commodity, offering it unto God.’ The Geneva notes, ‘Moses bare with his infirmity, considering his great sorrow, but does not leave an example to forgive them that maliciously transgress the commandment of God.’… The conclusions from this text of Scripture may be such as these, that oftentimes the letter of the Law gives place to great necessities…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam… (London: R.B., 1642), ch. 1, section 4</cite>, p. 52</span></figcaption>

<blockquote><p>…the great rule of Gospel administrations is that all things be done to edification. This is the main end of the ministry itself, in all the duties thereof, that are purely evangelical. For this end was the office of the ministry instituted, for this end are ministerial gifts dispensed, for this end were the sacraments appointed, and all Church assemblies, Church power, and whatever else belongs to Churches; it is all ordained for this end that the Body of Christ may be edified and increased with the increase of God, Eph. 4:7-15; Col. 2:19; Acts 9:31; Rom. 14:15, 19; 1 Cor. 10:23; ch. 14:3-5; 12:26; 2 Cor. 12:19; 1 Tim. 1:4. The full and adaequate rule of all Church-order and duties is that all things be done to edification. It does not hence ensue that whatever men shall judge to conduce to edification, may be used by themselves or imposed on others in the worship of God. Christ Himself, the onely wise and competent Judge in such cases…</p></blockquote>

<blockquote><p>Thesis 12… If any work be done for any worldly gain, profit or livelihood, to acquire and purchase the things of this life by (which is the principal end of week-day labor, Eph. 4:28; 1 Thess. 4:12), this is a servile work, all one with what the commandment calls ‘thy work’. Hence buying, selling, sowing, reaping, which are done for worldly gain, are unlawful on this day, being therefore servile works… [Buying and selling not done for worldly gain would not then be a servile work or prohibited, if this might not be done before or after the Sabbath, per the following section.] hence also such works as are done only for the preservation of the creatures… to keep fire in the iron mills, to sit at stern and guide the ship, and a thousand such like actions (being not done properly for worldly gain) are not unlawful; God Himself not ceasing from works of preservation…</p></blockquote>

<blockquote><p>The central thesis of North’s critique is that there are certain industries that are crucial to [taking] dominion and the well-being of civilization that cannot be completely shut down on the sabbath. Therefore, if sabbatarians were to be consistent they would have to abandon modern culture with its comforts… we will see that North misunderstands sabbatarianism…</p></blockquote>

</figure><figure class="quote" id="q-378a173592" data-kw="">
<blockquote><p>If the smelter in a foundry takes several days to reach its proper temperature, then it cannot be shut down every Lord’s day without shutting down the whole steel industry. Thus, at least a minimal crew is needed to keep the operation running through Sunday. But the benefits of steel for mankind (e.g., safer cars and buildings, the need for steel for the military) render it a necessity (wooden sailing ships would not have fared well against Japanese destroyers in the battles of the Pacific). Another example would be certain types of shipping. An oil tanker could not reach Japan from a port in Alaska in less than a week and thus would be in transit on the Sabbath (the shipping of oil is a necessity, since energy is needed for large populations to heat buildings and for generating electricity). God does not require people to deforest the countryside or freeze to death in order to keep the Sabbath. Power and electric utilities and telephone companies must maintain service on the Lord’s day. Hospitals, churches, homes, retirement communities and nursing homes need heat and electricity to preserve life and minister to the sick… The percentage of people working on the Lord’s day should be very small compared to those who work on a given week day. The vast majority of economic activities on the Sabbath in America are totally unnecessary and sinful (e.g., shopping malls, sporting events, restaurants, movie complexes, newspapers, retail outlets). Those industries which require sabbath labor should rotate staff…</p></blockquote>

<blockquote><p>The daring attack that is now made by some of the directors of the Edinburgh and Glasgow Railway on the law of God and the peace of our Scottish Sabbath – the blasphemous motion which they mean to propose to the shareholders in February next – and the wicked pamphlets which are now being circulated in thousands, full of all manner of lies and impieties- call loudly for the calm, deliberate testimony of all faithful ministers and private Christians in behalf of God’s holy day. … (1) The keeping open of Reading-Rooms – In this town, and in all the large towns of Scotland, I am told, you may find in the public reading-rooms many of our men of business turning over the newspapers and magazines at all hours of the Lord’s day… (2) The keeping open Public-Houses – Public-houses are the curse of Scotland. I never see a sign, “Licensed to sell spirits,” without thinking that it is a licence to ruin souls. (3) Sunday Trains upon the Railway – A majority of the directors of the Edinburgh and Glasgow Railway have shown their determination, in a manner that has shocked all good men, to open the railway on the Lord’s day.</p></blockquote>

%99s%20day" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9b5478b31f" data-kw="">
<blockquote><p>The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)”

— James Dennison, The Market Day of the Soul: the Puritan Doctrine of the Sabbath in England, 1532-1700 (RHB, 2008), pp. 133-34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Puritan+doctrine+generally+opposed+the+extreme+strictness+which+some+accorded+the+Sabbath.+Some+%5Bextreme+persons%5D+argued+that%3A+%281%29+Ex.+16%3A23+prohibited+all+baking+and+cooking+on+the+Sabbath%3B+%282%29+Ex.+16%3A29+forbade+all+walking+on+the+Sabbath%3B+%283%29+Ex.+20%3A10+prohibited+all+work+of+any+kind+on+the+Sabbath+%5Beven+acts+of+necessity%5D%3B+%284%29+Ex.+31%3A14-15%3B+35%3A3%3B+Num.+15%3A35+forbade+all+work%2C+even+the+gathering+of+sticks+for+a+fire%2C+on+the+Sabbath.+%28Cf.+George+Walker%2C+The+Doctrine+of+the+Holy+Weekly+Sabbath+%281641%29+pp.+117-19%29+The+puritan+answer+to+this+excessive+strictness+was+to+direct+attention+to+the+context+of+each+Biblical+reference%E2%80%A6+Ex.+20%3A10+was+never+intended+to+forbid+works+of+necessity+and+charity%2C+as+Christ+Himself+makes+clear+when+He+shows+that+it+was+lawful+to+pull+a+beast+out+of+a+pit+on+the+Sabbath+%28Lk.+14%3A5%29%2C+to+lead+a+beast+to+water+on+the+Sabbath+%28Lk.+13%3A15%29+and+to+circumcise+a+man+on+the+Sabbath+%28Jn.+7%3A22-23%29.+%28Ibid.%2C+p.+121%29+Ex.+35%3A3+forbade+the+kindling+of+a+fire+on+the+Sabbath%2C+but+the+context+makes+it+clear+that+fires+in+general+were+not+prohibited%3B+rather+fires+for+work+on+the+Tabernacle+were+forbidden.+%28Ibid.%2C+p.+121%29+Ex.+31%3A14-15+and+Num.+15%3A35+make+work+on+the+Sabbath+punishable+by+death%3B+however%2C+Walker+argues+that+it+is+work+done+presumptuously+%28cf.+Num.+15%3A30-31%29%2C+i.e.+by+contemptuously+despising+the+commandment+of+God%2C+which+incurs+the+death+penalty.+%28Ibid.+p.+122%29%E2%80%9D%0A%0A%E2%80%94+James+Dennison%2C+The+Market+Day+of+the+Soul%3A+the+Puritan+Doctrine+of+the+Sabbath+in+England%2C+1532-1700+%28RHB%2C+2008%29%2C+pp.+133-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b5478b31f.html&amp;via=5Solas" ta <blockquote><p>Privately the Sabbath is sanctified by our preparation to God’s public service, which chiefly consists in meditation and prayer, and after the public service, by meditating on the Word heard, and applying it to our own use, and by holy conferences with others. Unto which duties respecting the public worship we are to add and use these other means of sanctifying the remainder of the Lord’s Day: Reading of the Scriptures or other religious and holy writings, meditation on God’s Word and works, especially of creation, preservation and redemption, invocation by prayer, thanksgiving and singing of psalms, and finally godly conferences upon some fit subiect, which best sorts to the present occasion and tends to the use of edification: Unto which means we must add the private works of sanctification, which are the works of mercy, and appertain chiefly either to the body, as the giving of alms, visiting the sick and prisoners, curing diseases, etc. or else to the soul, as, teaching the ignorant, reclaiming those who are seduced by error, admonishing those who fail of their duty by frailty and infirmity, rebuking the scandalous and wilfull offender, exhorting the backward and sluggish, comforting the distressed, counseling them for the good of their souls that need counsel, and reconciling those whom we know to be at variance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life… (London: Kingstone, 1622), bk. 2, ch. 8, section 5, ‘Of the Spiritual Sanctification, &amp; the Outward Rest’</cite>, pp. 132-33</span></figcaption>

<blockquote><p>47. The rest of the day is to be spent in pious activity. Formerly there was an offering peculiar to the sabbath, but the continued or daily offering with its drink offering was not to be omitted, Num. 28:10. 48. Public worship, which is to be celebrated most solemnly, necessarily requires Scripture reading, meditation, prayer, holy discourse, and contemplation of the works of God wherein we may be more open to public worship and worship may become truly effective in us.</p></blockquote>

<blockquote><p>…as to the duties wherein the Sabbath is to be spent, which are shortly, all duties of immediate worship, whether they be inward, as meditation, self-examination, heart-prayer, either ejaculatory or more continued, heart-sorrow for sins, etc. or outward, as vocal prayer and singing of psalms, reading the Scriptures and other pious books, hearing the Word, etc.; or whether they be secret which may be both inward and outward, or private in families, as reading of the Word, confering on it, repeating sermons, praying together, etc. or public, as joining with the congregation in prayers and praises, hearing the Word read and the sense given, hearing of sermons, participating of the sacraments when dispensed, joining in solemn humiliations and thanksgivings when they fall necessarily or more conveniently to be on the Sabbath; All which and such like are proper duties for that day; to which liberal laying up and giving for the relief of the poor according to ability and as God blesses every man would be added as a suitable duty of it, though it be no duty of immediate worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments… (London: Newman, 1675), 4th Commandment, Sanctification of</cite>, pp. 289-90</span></figcaption>

gh%20it%20be%20no%20duty%20of%20immediate%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§20. For private duties, both personal and domestic, they are either antecedent or consequent to the solemn public worship, as usually for time it is celebrated amongst us. These consisting in the known religious exercises of prayer, reading the Scripture, meditation, family instructions from the advantage of the public ordinances, they are to be recommended unto every one’s conscience, ability, and opportunity, as they shall find strength and assistance for them.</p></blockquote>

<blockquote><p>2. The duties of worship to be attended by us on this Day, are either Natural or Instituted… 1. The duties of natural worship, are such as are suited to the nature of man and flow from the great end he was made for, viz. actively to glorify God. And therefore the light of Nature directs men to practice them on all occasions, certainly then these are fitted for the Sabbath, according to the end and usefulness of it… 2. The duties of instituted worship. And under these are contained all the positive ordinances and sacred ceremonies of God’s appointment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity… (Boston, 1726), Sermon 172, Q. 60</cite>, pp. 584-88</span></figcaption>

<blockquote><p>And Nehemiah, which is the Tirshatha, and Ezra the priest the scribe, and the Levites that taught the people, said unto all the people, ‘This day is holy unto the Lord your God; mourn not, nor weep.’ For all the people wept, when they heard the words of the law. Then he said unto them: ‘Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the Lord is your strength.’ So the Levites stilled all the people, saying, ‘Hold your peace, for the day is holy; neither be ye grieved.’ And all the people went their way to eat, and to drink, and to send portions, and to make great mirth, because they had understood the words that were declared unto them.</p></blockquote>

<blockquote><p>And it came to pass, as He went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched Him… 7 And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them. 8 When thou art bidden of any man to a wedding, sit not down in the highest room; lest a more honourable man than thou be bidden of him… 12 Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee. 13 But when thou makest a feast, call the poor, the maimed, the lame, the blind… 15 And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God. 16 Then said he unto him, A certain man made a great supper, and bade many: 17 And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready… 23 And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. 24 For I say unto you, That none of those men which were bidden shall taste of my supper.</p></blockquote>

</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath… (Amsterdam, 1638), ch. 21 Westminster divine</cite>, p. 152</span></figcaption>

</figure><figure class="quote" id="q-de0aa54e5c" data-kw="">
<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641)</cite>, p. 241</span></figcaption>

<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</cite></span></figcaption>

</figure><figure class="quote" id="q-4bc153b4ac" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water [Lk. 13:16], which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears [Mt. 12:1], and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now;</p></blockquote>

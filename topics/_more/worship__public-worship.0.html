<figure class="quote" id="q-1e1e0634df" data-kw="">
<blockquote><p>Secondly, the farther that the members or Churches, either congregational, presbyterial, or national, are removed in local distance one from another, the less is the visible and external communion of rebuking, comforting, and admonishing one another; yet the power and obligation of these duties are not removed. So though the national Churches be locally distant one from another, yet their power of exercising duties… is not from thence concluded to be null. Yea, national duties upon occasion are still obligatory, and communion of men of sundry nations is clear to me, Isa. 2:3, ‘many nations shall flow unto the mountain of the Lord’s House,’ Zech. 8:23, ‘Ten men shall take hold out of all languages of the nations, they even shall take hold of the skirt of him that is a Jew, saying, we will go with you, for we have heard that God is with you.’ …the places [of Scripture] do well prove the power-lawful of performing duties, whereas the exercise of them in one place is not hic &amp; nunc, in ordinary providence, possible. And so this consequence must be weak: the whole catholic visible Churches in their principal guides cannot ordinarily and constantly meet, hic &amp; nunc, for the exercise of their power; Therefore they have no such power. For if the power be exercised in parts, which, through occurrences of providence and the corruption of men’s nature, cannot be exercised in whole at once, yet it’s not hence evinced [proven] to be a power not given of Christ for edification;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 300-301</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/public-worship.html">Public Worship</a></span></div>

44%29%2C+pt.+1%2C+pp.+300-301&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e1e0634df.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1e1e0634df.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-holding-public-worship-church-courts-by-distance-though-technology-on-using-satellite-campuses-under-necessity-for-edification/#:~:text=Secondly%2C%20the%20farther%20that%20the%20members,not%20given%20of%20Christ%20for%20edification&amp;text=Secondly%2C%20the%20farther%20that%20the%20members%20or%20Churches&amp;text=a%20power%20not%20given%20of%20Christ%20for%20edification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-858b283c85" data-kw="">
<blockquote><p>[Margin Note:] These of sundry congregations have as visible a communion, and so make up as visible a body as those of the same congregation that meet within the same walls. If the faithful scattered in sundry congregations have an invisible communion only by faith, and so make up an invisible communion, and an invisible, mystical-Body, then two sister-churches that cannot meet in one place, though they may do all the duties of Church-gaining one another, as Mt. 18, yet are not a visible body, not their acts, acts of Church-profession, not are they visible members of the same Body of Christ, because they partake not of the ordinances within the same walls as do members of the same single congregation: so there is no visible communion, but within the walls of one church, which is absurd and repugnant to common sense. 2. It is uncharitable and against the Word to teach that when a church is dissolved by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though [they are] both real and visible converts, have no right to the ordinances [as the Independents appear to teach]: for if the formal cause, to wit, their confederacy into one visible-body, as Mr. Hooker [an Independent] says, be removed, their visible and external right is removed.</p></blockquote>

<blockquote><p>For the essence and lawful constitution of a church depends not on the outward circumstance of place, but on a due profession of faith, and bond of holy communion. For as [William] Ames says, ‘that same in profession does constitute a Church-visible, which in reality and its internal nature constitutes the Church-mystical, that is, faith.’ Marrow of Theology, bk. 1, ch. 32, thesis 7.</p></blockquote>

</figure><figure class="quote" id="q-60e1f0859c" data-kw="">
<blockquote><p>There is now no national membership in the Church of Christ, limited to one hereditary family or favored race; but in the fellowship of one faith and one spirit, all, of whatever tribe or tongue or nation, are one with Christ, and one with each other… Earthly and outward causes of separation are overborne and controlled by this higher principle of unity. Separation in race or tongue is no separation to be accounted of among the followers of Christ, who are joined together in that one Spirit. Distance on the earth is no distance to be regarded between those who are partakers together of the same Holy Ghost. Local churches or societies, divided in place and outward worship, become merged in the oneness of a higher fellowship. Separated in the outward act of worship, they are joined in the communion of the same Spirit. The assemblies of Christians in every quarter of the globe, who worship God in sincerity and truth, are one in such a sense as their distance from one another admits of; and they must all be regarded as branches of the universal Church of Christ throughout the world, the great community of believers, separated by distance and kindred and tongue, who cannot meet together in the body, but who really meet together in the Spirit. The invisible Church of Christ on earth is local, but it is also catholic.</p></blockquote>

</figure><figure class="quote" id="q-64accecdb3" data-kw="">
<blockquote><p>That all the members of the catholic Church are united in this profession [of the Christian faith] is very true; but this is not all, they are bound to more than this, viz. to the exercise of the same specifical ordinances, to subjection to the same discipline, as also to love to one another, and where it is possible, to the celebrating together of the same numerical worship. And in any of these, to make any differences, is a breach of that union, that ought to be among the members of the catholic visible Church. … For when Christ has instituted that every church meeting together, and every member of the catholic Church, should exercise the same specifical ordinances, is not this a Church union, or union of Churches? And let it then be considered, that if every member of the Church catholic may be a member of any or every particular church, where providence may cast him (being rightly qualified thereunto), having right first to the same specifical ordinances as a member of the catholic, and then to the same numerical ordinances, where he comes and finds them (as some of his own way [that is congregationalism] do grant, and cannot well be denied), then the denial of such a person to join in those numerical ordinances [such as congregationalists practice] is a breach of that union and love which ought to be between the members of the catholic Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved Against Dr</cite>, [John] Owen… (London, 1657), ch. 5; pp. 93-4</span></figcaption>

</figure><figure class="quote" id="q-08bff57bc3" data-kw="">
<blockquote><p>…they [the apostolic Church] practiced all the ordinances directed, though they had no written directory¹ in a formal contexture or frame: for prayers, preaching, praising, sacraments and censures never Church wanted [lacked] in some one order or other, though we cannot say that the apostolic Church had this same very order and form: But a liturgy which is a commanded, imposed, stinted form, in such words and no other, is another thing than a directory, as an unlawful thing is different from a lawful: [¹ While Rutherford is speaking of directories in general, yet this section may have some reference to Westminster’s Directory for the Public Worship of God, as the Church of Scotland had adopted it in 1645, a year before this book of Rutherford’s was published.] 2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal, in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture, as was the [Anglican] Service-Book; and the pastor or people in these are not properly moral agents, nor do we press that Scripture should regulate men in these.</p></blockquote>

</figure><figure class="quote" id="q-904755a747" data-kw="">
<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London, 1649), pp. 372-3</span></figcaption>

<blockquote><p>1. A stinted liturgy is in it self lawful.

2. A stinted liturgy in some parts of public holy service is ordinarily necessary.

3. In the parts where it is not of necessity, it may not only be submitted to, but desired when the peace of the Church requires it.

4. There is so great difference between ministers and people, and times, that it may be convenient and eligible to some, at some times, and unfit and not eligible to others, and at other times.

5. The ministers and Churches that earnestly desire it, should not by the magistrate be generally or absolutely forbidden the use of a convenient prescribed liturgy.

6. To prescribe a frame of stinted service, or prayer, etc. and lay a necessity, or the peace of the Church upon it, and to punish, silence, suspend, excommunicate, or reproach the able, peaceable, godly ministers, or people that (justly or unjustly) scruple the using of it, is so great a sin that no conscionable ministers should attempt it or desire it, nor any godly magistrate suffer it.

7. The safest way of composing such a public form is to take it all, for matter and words, out of the Holy Scriptures.

8. Yet is not this of such necessity, but that we may join in it, or use it, if the form of words be not from Scripture.

9. The matter of a common liturgy, in which we expect any general concord, should not be any unnecessary things, much less things doubtfull, or forbidden.

10. Forms of public prayer should not be constantly used by ministers that are able to pray without them: and none else should be admitted ordinarily to the ministry, but such as are able competently to pray without such forms; unless in great necessities of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, Question 4, ‘Whether a stinted Liturgy, or form of worship, be a desirable means for the peace of these churches?’ in Five Disputations of Church-Government &amp; Worship (London, 1659) Note this was published the year before Charles II returned, as persons were contemplating seeking to unify the nation in a form of church government and worship. | Baxter seeks to prove in his treatment ten propositions:</span></figcaption>

<blockquote><p>Where these Forms are contended for by men, with respect unto their own use and practice only, as suitable to their experience, and judged by them a serving of God with the best that they have; I shall not take the least notice of them, nor of any dissent about them. But whereas a persuasion not only of their lawfulness but of their necessity is made use of unto other ends and purposes, wherein the peace and edification of believers is highly concerned, it is necessary we should make some inquiry thereinto.</p></blockquote>

<blockquote><p>There be so many other things that are a pouring out of the soul in prayer, as groaning, sighing, looking up to heaven, breathing, weeping, that it cannot be imagined how far short printed and read prayers comes of vehement praying; for you cannot put sighs, groans, tears, breathing, and such heart messengers down in a printed book, nor can paper and ink lay your heart in all its sweet affections out before God; the Service-book then must be toothless and spirit-less talk.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trial &amp; Triumph of Faith</cite>, p. 61</span></figcaption>

</figure><figure class="quote" id="q-034818ef77" data-kw="">
<blockquote><p>Certainly in Christ’s time both liturgies by forms and also prayers by habit were used [Lk. 18:11-13]. And yet Christ never interposed in the controversy, so as to condemn the one or the other. He condemns the Pharisees for making long prayers to cover their devouring widows’ houses, and for their praying to be seen of men: But whether their prayers were a liturgy and set form, or whether they were extemporary, He takes no notice, as telling us that He condemned neither! (And it’s likely the Pharisees’ long liturgy was in many things worse than ours, though the psalms were a great part of it: and yet Christ and his apostles oft joined with them, and never condemned them). Nay as far as I can find, the Pharisees and other Jews were not in this so blind and quarrelsome as we; nor never made a controversy of it, nor ever presumed to condemn either liturgies or prayers by habit.</p></blockquote>

<blockquote><p>I could heartily wish that we could say that all ministers (of any party) were such as were wholly above the need of forms. Or at least such whose own composures were better for the Church than any that could be offered them by others.</p></blockquote>

</figure><figure class="quote" id="q-ce2e126e9d" data-kw="">
<blockquote><p>The famousest divines in the Church of God, even Luther, Zwingli, Melancthon, Calvin, Perkins, Sibbes and abundance of nonconformists of greatest name in England did ordinarily use a form of prayer of their own before their sermons in the pulpit, and some of them in their families too. Now these men did it not through idleness or through temporizing, but because some of them found it best for the people to have oft the same words: and some of them found such a weakness of memory that they judged it the best improvement of their own gifts. Now besides the first composure of these prayers (which perhaps was done 20 years before) none of these men did use their own gifts, any more than if they had used a form composed by another. For the memory and utterance is the same of both. … And in some ordinances as baptism and the Lord’s Supper, etc. the same things must be daily prayed for: And he that thinks he must not frequently speak the same things, will quite corrupt the ordinance of Christ. And he that will imagine that he must have always new words will at last have new things or worse than nothing. If then it be meet to use often the same words, why may not a weak minister use the better words of others when he has none merely of his own that are so fit? Nay is it not the duty of such to do it? Every man is bound to do God’s service in the best manner that he can: ‘Cursed be the deceiver that hath a better in his flock, and bringeth that which is corrupt.’ But to utter prayers and praise to God in a full, methodical and congruous manner, and in words suitable to the majesty of the worship of God, is better (to the people and to the honor of religion) than to do it in a more confused, disorderly, broken manner, with barrenness and incongruity of speech. But this l […]st is the best that many honest ministers can do by their own gifts, when they may do it in the former better manner, by making use of the words and gifts of others. Therefore it is a duty for such men so far to use others’ gifts of inventing words before their own. And among us there is no man forbidden in the pulpit to use his own gifts to the utmost and pray without any set form of his own or other men’s. And I would at last desire any of the objectors but to name that text of Scripture which directly or indirectly commands every minister to use his gift of inventing words and method, or his gift of extemporary prayer, every time that he prays to God: Or which forbids to use the gifts of others though better than his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 32, pp. 183-85</span></figcaption>

</figure><figure class="quote" id="q-15e6da6b8b" data-kw="">
<blockquote><p>Thirteenthly, [it is superstition] that it is simply unlawful to use a form of prayer or to read a prayer on a book. Fourteenthly, that if a school-master impose a form upon a scholar, or a parent on a child, it makes it become unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 58, p. 290</span></figcaption>

</figure><figure class="quote" id="q-18af1dae4c" data-kw="">
<blockquote><p>When as God has neither tied us to set forms, nor from them, save only as unsuitableness to any particular persons may make one less edifying than the other: And both free prayers and set forms, studied prayers and sudden prayers are all the work of man (as to man’s part): and therefore they must needs be imperfect and faulty as man is: And yet in both we may pray by the Spirit, even with the holy and fervent desires which the Spirit excites in us: And the Spirit may ordinarily be a Spirit of supplication in us and help our infirmities in the one way and in the other: And therefore, though I will not equal them (for I prefer some men’s free praying before any forms, and I prefer the Common prayers before some men’s free prayers), yet I may say that I will neither assent and consent to every word in the one, nor in the other, no not of any man that ever I heard: And yet I will not take it for unlawful to join with Church, or family, or person in the one or in the other: yea, upon long experience, if I had fully my own choice and liberty, I would use free prayer one part of the day (or one day) and a well composed form another part, because I see commodities by both, and such inconveniences of either way alone, as are, if possible to be avoided. But when the mind has received a prejudice against either way, by education, custom, or former distastes, no reason how clear soever will overcome it, till age and experience do mellow green and sour spirits and teach them to judge of things soberly and impartially, not as others judge of them, but as indeed they are.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“When as God has neither tied us to set forms, nor from them, save only as unsuitableness to any particular persons may make one less edifying than the other: And both free prayers and set forms, studied prayers and sudden prayers are all the work of man (as to man’s part): and therefore they must needs be imperfect and faulty as man is: And yet in both we may pray by the Spirit, even with the holy and fervent desires which the Spirit excites in us: And the Spirit may ordinarily be a Spirit of supplication in us and help our infirmities in the one way and in the other: And therefore, though I will not equal them (for I prefer some men’s free praying before any forms, and I prefer the Common prayers before some men’s free prayers), yet I may say that I will neither assent and consent to every word in the one, nor in the other, no not of any man that ever I heard: And yet I will not take it for unlawful to join with Church, or family, or person in the one or in the other: yea, upon long experience, if I had fully my own choice and liberty, I would use free prayer one part of the day (or one day) and a well composed form another part, because I see commodities by both, and such inconveniences of either way alone, as are, if possible to be avoided. But when the mind has received a prejudice against either way, by education, custom, or former distastes, no reason how clear soever will overcome it, till age and experience do mellow green and sour spirits and teach them to judge of things soberly and impartially, not as others judge of them, but as indeed they are.”

<blockquote><p>1. The benefits of a sound liturgy are: 1. to keep out heresy and ill words from public worship, 2. to be a help to men of unready utterance, 3. that the people may know beforehand what they join in. The inconveniences are: 1. the dulling of affection in hearing still the same words, 2. the tempting of slothful worldly candidates and ministers to learn no other way of praying when this will serve all their worldly turns. But I must add that this follows not from the imposing of a liturgy, but from the exclusion of other prayer and taking up with this alone.

2. The conveniences of praying from a habit are: 1. a just variation, as occasions vary, 2. help to fresh affection, 3. forcing ministers to get ability for utterance. The inconveniences are:

1. That the people know not till the words are past whether they may own them, and so hardly try all and follow with just consent.

2. That abundance of young, raw, unskillful men do ordinarily disgrace prayer by their unskillful methods and expressions.

3. That heretics and erroneous men have great opportunity to put their sins into their prayer, which yet the people should by joining in make their own were they sound (which they are not bound to do by sermons): And no man of understanding can choose, but suspect that weak ignorant ministers will be showing their weakness in the highest duties, and so must suspend their consent till late.

4. That less care will be taken in speaking to God than in speaking to men, while most sober ministers study their sermons.

5. That when to avoid disgraceful words and manner of praying, men must decree that no such weak or unready men shall be ministers, the number that can do it better will be so small as that most churches on earth must be so deprived of ministers and all public worship if that take place.

6. That by this means young ignorant men that by use can speak fluently and fervently in prayer shall be followed by the people when many great divines, judicious and holy that have not that readiness of utterance, shall be rejected as having not the Spirit.

7. That as all men’s bodies and minds be not in the like quickness and fitness at all times, but sometimes clouded by fumes or weakness, the public worship shall be as mutable, uncertain and various as men’s tempers are. All these on both sides are so great inconveniences that though both Formalists and Fanatics have derided me for it, I have formerly said, and still say that I believe that the best way to avoid both sorts of evils is to have meet set forms, which shall be owned by the Church as their professed desires, not being so long as to take up too much time from freer prayer, much less to forbid it, which Calvin wisely ordered for France and Geneva.</p></blockquote>

</figure><figure class="quote" id="q-749ffbefe0" data-kw="">
<blockquote><p>As to praying a written prayer out of a book, it is a habit I cannot commend. If we can tell our doctors the state of our bodies without a book, we ought to be able to tell the state of our souls to God. I have no objection to a man using crutches, when he is first recovering from a broken limb. It is better to use crutches than not to walk at all. But if I saw him on crutches all his life, I would not consider it a matter for praise. I would like to see him strong enough to throw his crutches away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer’ in Practical Religion</cite>, (Evangelical Press), pp. 97-98</span></figcaption>

<blockquote><p>This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wallace-d-kornahrens.html">Wallace D. Kornahrens</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eucharistic Doctrine in Scottish Episcopacy</cite>, 1620-1875 Download (2008) PhD thesis 300 pp. | Abstract:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.”

<blockquote><p>XIV… Now follows the third section [of the beginning of Colossians], namely, the Salutation. ‘Grace be to you, and peace from God our Father and the Lord Jesus Christ.’ With this greeting, Paul prays for the greatest and necessary blessings for the Christians, and the salutation contains two parts: 1. The blessings he prays for, 2. From whom. The blessings he wishes are Grace and Peace… XV… 1. As the holy blessing, whose formula is found in Numbers 6, is an invocation of God, from whom all good things are desired for those who receive the blessing, so too is the Christian salutation a prayer, a form of invocation, through which, by faith and charity, we earnestly pray for the best things for others.</p></blockquote>

<blockquote><p>Fifthly, says the Author [Thomas Hooker, a congregationalist], ‘The elders have power to dismiss the people or Church, and that with a blessing, Num. 6:23-26, which is an act of superiority, Heb. 7:7. [Rutherford’s] Answer: This [his use of ‘elders’] is but an empty title also. For:

1. The pastor, only and one, dismisses doctor, elders, deacons and the whole congregation…

2. A majority or superiority [by the pastor, in some sense] is one thing, and a power of jurisdiction is another. Blessing of the Church at their dismission is nothing but a prayer of the whole Church (the minister being [the] mouth) who blesses all, and is no act of superiority of jurisdiction… And I much doubt if the priest’s blessing of the people, Num. 6, was moral, and if it was not typical, he not taking in himself but as a type of Christ [in] pronouncing the whole visible Church blessed, so typifying Christ our Priest, in whom all the nations of the earth are blessed, Gal. 3:8,14…</p></blockquote>

<blockquote><p>The main body of the thesis explores the practice and experience of faith in the North East between 1560 and 1610 using three main themes. The first studies the Sabbath, the weekly fixture that was the heart of public worship and observance in the parish. Sacramental practice is the second theme with an in-depth study of the annual administration of Communion, which reinforced temporal and spiritual bonds among Kirk adherents and starkly exposed non-adherents and recusants. The final theme considers the role and position of ministers and readers in religious practice and investigates the relationship between them and their parishioners. From detailed analysis of these three themes, it is concluded that the North East as a whole was transformed into the general mould of Scottish Reformed Protestantism by 1610, but that there was a spectrum of practices and experiences of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/catherine-mcmillan.html">Catherine McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Keeping the Kirk</cite>, 1560-1610 (2016) PhD dissertation, Univ. of Edinburgh This has been published in book form. | Abstract:</span></figcaption>

<blockquote><p>In the Middle Ages Thomas not only asserted that as rational beings human beings can—without supernatural grace—know natural truths but also testifies that it is impossible for there to be “some knowledge which is totally false without any admixture of some truth” and in this connection appeals to the words of Beda and Augustine: “There is no false doctrine which does not at some time mix some truth with falsehoods.” The Reformed theologians were even better positioned to recognize this by their doctrine of common grace. By it they were protected, on the one hand, from the Pelagian error, which taught the sufficiency of natural theology and linked salvation to the sufficiency of natural theology, but could, on the other hand, recognize all the truth, beauty, and goodness that is present also in the pagan world. Science, art, moral, domestic, and societal life, etc., were derived from that common grace and acknowledged and commended with gratitude. As a rule this operation of common grace, though perceived in the life of morality and intellect, society and state, was less frequently recognized in the religions of pagans. In the latter context the Reformed only spoke of natural religion, innate and acquired, but the connection between this natural religion and the [pagan] religions was not developed. The religions were traced to deception or demonic influences. However, an operation of God’s Spirit and of his common grace is discernible not only in science and art, morality and law, but also in the religions. Calvin rightly spoke of a “seed of religion,” a “sense of divinity.” Founders of religion, after all, were not impostors or agents of Satan but men who, being religiously inclined, had to fulfill a mission to their time and people and often exerted a beneficial influence on the life of peoples. The various religions, however mixed with error they may have been, to some extent met people’s religious needs and brought consolation amidst the pain and sorrow of life. What comes to us from the pagan world are not just cries of despair but also expressions of confidence, hope, resignation, peace, submission, patience, etc. All the elements and forms that are essential to religion (a concept of God, a sense of guilt, a desire for redemption, sacrifice, priesthood, temple, cult, prayer, etc.), though corrupted, nevertheless do also occur in pagan religions. Here and there even unconscious predictions and striking expectations of a better and purer religion are voiced. Hence Christianity is not only positioned antithetically toward paganism; it is also paganism’s fulfillment. Christianity is the true religion, therefore also the highest and purest; it is the truth of all religions. What in paganism is the caricature, the living original is here. What is appearance there is essence here. What is sought there can be found here. Christianity is the explanation of “ethnicism.” Christ is the Promised One to Israel and the desire of all the Gentiles. Israel and the church are elect for the benefit of humankind. In Abraham’s seed all the nations of the earth will be blessed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, trans. John Bolt, and John Vriend (Grand Rapids, MI: Baker Academic, 2003), 1.319–20.</span></figcaption>

og.net/2016/03/bavinck-antithesis-common-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-7998dc18ef" data-kw="">
<blockquote><p>It is asserted in the first chapter of this Confession, and vindicated in this exposition, that the Scriptures of the Old and New Testaments, having been given by inspiration of God, are, for man in his present state, the only and the all-sufficient rule of faith and practice. All that man is to believe concerning God, and the entire duty which God requires of man, are revealed therein, and are to be believed and obeyed because contained therein, because it is the Word of God. This Divine Word, therefore, is the only standard of doctrine which has intrinsic authority binding the conscience of men. And all other standards are of value or authority only in proportion as they teach what the Scriptures teach.

While, however, the Scriptures are from God, the understanding of them belongs to the part of men. Men must interpret to the best of their ability each particular part of Scripture separately, and then combine all that the Scriptures teach upon every subject into a consistent whole, and then adjust their teachings upon different subjects in mutual consistency as parts of a harmonious system. Every student of the Bible must do this; and all make it obvious that they do it, by the terms they use in their prayers and religious discourse, whether they admit or deny the propriety of human creeds and confessions.

If they refuse the assistance afforded by the statements of doctrine slowly elaborated and defined by the Church, they must make out their own creed by their own unaided wisdom. The real question is not, as often pretended, between the Word of God and the creed of man, but between the tried and proved faith of the collective body of God’s people, and the private judgment and the unassisted wisdom of the repudiator of creeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ed. William H. Goold (British edn, London: T. Nelson and Sons, 1870), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-0884aece0a" data-kw="">
<blockquote><p>I next refer to the Spirit’s work in connection with Christ’s priestly oblation: “Who, through the eternal Spirit, offered Himself without spot to God” (Heb. 9.14). The expression: “the eternal Spirit,” can only mean the Holy Spirit according to the usual acceptation of the term — not the divine nature of Christ, as too many expositors have understood it. The meaning is, that the Son of God, moved and animated by the Holy Ghost, offered Himself without spot as an atoning sacrifice.

The Spirit rendered Him an unspotted sacrifice. The Spirit discovered to Him the inflexible claims of God as well as inflamed Him with such love to man and zeal for God as prompted Him to go forward in spite of every hindrance, pain, and difficulty, to effect the world’s redemption, and thus fitted Him as man for His work The Holy Spirit, in a word, filled His mind with the unflagging ardour, zeal, and love which led Him to complete the sacrifice.

To explain the text as if it described the divine nature as priest and the human nature as the sacrifice, is inadmissible. The WHOLE PERSON is priest and victim; for all done by either nature belongs to the Person: HE offered HIMSELF, says the apostle.

In this view of the matter, it would be a mere tautology — if the eternal Spirit is interpreted of the divine nature — to say He offered Himself through the divine nature. It would on that principle be but a repetition of the same thing. If we take it, however, as intimating the action of the Holy Spirit, it will vividly represent the holy fire by which the sacrifices were consumed. One does not find, except on this interpretation, anything in the sacrifice of Christ that could be adduced as the antitype of the holy fire employed in the sacrifice.

Nor are the objections to the view which we have propounded of any weight. When it is objected that the Holy Spirit was not the Priest who offered the sacrifice, the obvious answer is that Christ as Priest offered Himself a sacrifice possessed of infinite value and excellence in consideration of His divine Person, and of the additional fact that it was unspotted and offered through the Holy Spirit. Because the Spirit was in Him as a Spirit of faith and zeal and love — the Redeemer took upon Him with the utmost alacrity all that was to be performed and endured for man’s redemption.

The Holy Spirit, which framed the Redeemer’s mind as well as body, perpetually rested upon Him during all His earthly sojourn, imparting to Him the full consciousness of His Sonship in the highest sense, and prompting Him to execute the mediatorial work imposed on Him (Isa. 42.1-4). That our Saviour was also raised from the dead by the Holy Ghost, is clearly taught by Peter, when he affirms that He was put to death in the flesh, but quickened by the Spirit (1 Pet. 3.18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 132-33.</span></figcaption>

The Holy Spirit, which framed the Redeemer’s mind as well as body, perpetually rested upon Him during all His earthly sojourn, imparting to Him the full consciousness of His Sonship in the highest sense, and prompting Him to execute the mediatorial work imposed on Him (Isa. 42.1-4). That our Saviour was also raised from the dead by the Holy Ghost, is clearly taught by Peter, when he affirms that He was put to death in the flesh, but quickened by the Spirit (1 Pet. 3.18).”

<blockquote><p>And howsoever, some doubt whether Athanasius were the author of that Creed which bears his name, yet the greater number of the learned of latter ages entitle him to it; and though peradventure he framed it not himself, yet it is most agreeable to his doctrine, and seemeth to be drawn out of his works, and in that regard may be rightly termed his Creed. And for the third Creed, although I believe not, that either the Apostles jointly or severally dictated it: yet I subscribe to Calvin’s judgement, who saith, that it was a summary of the Christian Faith, extant in the Apostles’ days, and approved of by them. …

The exceptions against the matter or doctrine of the Creeds, either concern the first Article, God of God, or the Article about the descent into hell. For the first, there can be no doubt at all of it, for the Son is of the Father, and therefore the Father and Son being God, it must needs follow, that Christ is God of God, neither will it hence follow, that the Deity of the Son is of the Deity of the Father. For the argument holdeth not a concreto ad abstractum, verbi gratiâ, it will not follow, Deus passus est, ergo deitas passa est, God suffered, ergo the deity suffered: nor this, Maria est mater Dei, ergo est mater deitatis; Mary is the mother of God, ergo she is mother of the Deity.

Yea but Calvin saith, Christ is autotheos, God of himself; the answer is easy, Christ is God of himself, ratione essentiae; but God of God, ratione personae. And whereas it is objected, that if he be Deus de Deo, it must be either per productionem essentiae, or communicationem; by the production, or communication of the essence: though Beza, and other of our Divines stick not at the latter phrase, yet it followeth not; for it is sufficient to prove him God of God, that his person is generated of the Father, and it is safer to say that he hath communem essentiam cum patre, then communicatam, rather common then communicated.

For the latter, concerning descent into Hell, all the Christians in the world acknowledge, that CHRIST some way descended into hell, either locally, as many of the ancient fathers, [Hugh] Latimer the martyr, [Thomas] Bilson and [Lancelot] Andrews, and [Alexander] Noel in his catechism (commanded to be taught in all Schools, soon after the publishing the 39 Articles expound it) or virtually as Durand, or metaphorically as Calvin, or metonymically as [Daniel] Tilenus,[1] [William] Perkins, and this Assembly; and therefore no man need to make scruple of subscribing to the Article, as it stands in the creed, seeing it is capable of so many orthodoxal explications, and therein I desire that this Assembly in their aspersions would (after the example of the harmony of confessions) content themselves with branding only the popish exposition of this Article, which taketh hell for limbus patrum, or purgatory (Netherland regions, extra anni solisquevias) for any of the other four interpretations, they are so far from being Heretical, that it hath not been proved that any of them is erroneous.</p></blockquote>

<blockquote><p>Marcus Dods (the younger) of the Free Church of Scotland later verged off into liberal views of biblical inspiration. In his younger days, however, he was more orthodox and contributed to a book on scripture alongside the likes of Patrick Fairbairn. In the below extract, Dods pointed out that opposition to systematic theology underlay the modern discontent with creeds and confessions:

One of the most pronounced characteristics of the times is disparagement of theological science, and distaste for fixed and final opinions on points of faith. To have a mind made up on questions of theology, is considered to be evidence of a want of the more delicate perception of modern criticism, and of ignorance of the advance that is really being made in the study of Scripture. To explain how this revulsion from systematic theology has arisen would occupy more time than can now be spared.

The main sources of it seem to be these: the consciousness of our being much better furnished for the accurate critical analysis of the teaching of Scripture, than that age was in which the leading systems of theology were framed, and the consequent expectation that we, with all these new helps, should be able to discover more in Scripture than has yet been discovered.

Again, there is the idea that we, being in an age which is unable to sympathise with the seventeenth century in many other matters, ought not to be expected to sympathise with it in its theology. And then, in our own country, there is a feeling which may do more than any other for the promotion of this anti-systematic tendency, and that is the feeling, that as the preaching of doctrine has so often been associated with tedium and lifelessness, there may really be some necessary connection between theological science and spiritual death.

But whencesoever this tendency has sprung, here among us it unmistakably is. And because creeds are simply the expression of the results of systematic theology — because creeds bind us to hold one system of truth and not another — because creeds are the form in which theological science meets every church office-bearer, therefore it is against creeds the assault is primarily made.

And as to the attitude the Church should hold herself in towards her Confession, we find among us every grade of dissatisfaction or doubt, from the proud reluctance of the youth who indignantly asks, “Why should I take my opinions at other men’s hands, and be merged in the common rank and file that have believed these things? Have I nothing individual and characteristic; can I strike out no new religious truth?” — from this youthful recalcitration to the prudent scruple of the matured ecclesiastic, who fears lest some weak brother be offended by an unimportant clause in the Confession, and who sees in the prospect of union with other churches, a reason for being very careful how he records a belief which may unnecessarily separate him from other Christians.

One of the most startling forms which this repugnance to creeds has taken in our day, is the refusal of those who have subscribed a creed to acknowledge that this, their signature, gives any guarantee that they believe the articles subscribed. The time has come when we can no longer disguise or evade the unwelcome fact, that there are men in our land, of undoubted integrity in all other points, and who are exerting influence which men of high moral character can alone exert, who yet sign as the confession of their faith, what they do not believe.

They avow that they do so, and endeavour to justify such subscription mainly by this same assertion, that the present age is an age of transition — that opinions long held as true are becoming doubtful, and that new truths are presenting themselves, and that in such a state of matters it is right that the Church should not be so rigidly bound to her old creed as she has hitherto been — that she should be left free to make progress with the age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/marcus-dods.html">Marcus Dods</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation of God in Scripture, viewed in respect both to Theological Science and to the Proper use of Creeds in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

One of the most startling forms which this repugnance to creeds has taken in our day, is the refusal of those who have subscribed a creed to acknowledge that this, their signature, gives any guarantee that they believe the articles subscribed. The time has come when we can no longer disguise or evade the unwelcome fact, that there are men in our land, of undoubted integrity in all other points, and who are exerting influence which men of high moral character can alone exert, who yet sign as the confession of their faith, what they do not believe.

They avow that they do so, and endeavour to justify such subscription mainly by this same assertion, that the present age is an age of transition — that opinions long held as true are becoming doubtful, and that new truths are presenting themselves, and that in such a state of matters it is right that the Church should not be so rigidly bound to her old creed as she has hitherto been — that she should be left free to make progress with the age.”

— Marcus Dods, The Revelation of God in Scripture, viewed in respect both to Theological Science and to the Proper use of Creeds in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMarcus+Dods+%28the+younger%29+of+the+Free+Church+of+Scotland+later+verged+off+into+liberal+views+of+biblical+inspiration.+In+his+younger+days%2C+however%2C+he+was+more+orthodox+and+contributed+to+a+book+on+scripture+alongside+the+likes+of+Patrick+Fairbairn.+In+the+below+extract%2C+Dods+pointed+out+that+opposition+to+systematic+theology+underlay+the+modern+discontent+with+creeds+and+confessions%3A%0A%0AOne+of+the+most+pronounced+characteristics+of+the+times+is+disparagement+of+theological+science%2C+and+distaste+for+fixed+and+final+opinions+on+points+of+faith.+To+have+a+mind+made+up+on+questions+of+theology%2C+is+considered+to+be+evidence+of+a+want+of+the+more+delicate+perception+of+modern+criticism%2C+and+of+ignorance+of+the+advance+that+is+really+being+made+in+the+study+of+Scripture.+To+explain+how+this+revulsion+from+systematic+theology+has+arisen+would+occupy+more+time+than+can+now+be+spared.%0A%0AThe+main+sources+of+it+seem+to+be+these%3A+the+consciousness+of+our+being+much+better+furnished+for+the+accurate+critical+analysis+of+the+teaching+of+Scripture%2C+than+that+age+was+in+which+the+leading+systems+of+theology+were+framed%2C+and+the+consequent+expectation+that+we%2C+with+all+these+new+helps%2C+should+be+able+to+discover+more+in+Scripture+than+has+yet+been+discovered.%0A%0AAgain%2C+there+is+the+idea+that+we%2C+being+in+an+age+which+is+unable+to+sympathise+with+the+seventeenth+century+in+many+other+matters%2C+ought+not+to+be+expected+to+sympathise+with+it+in+its+theology.+And+then%2C+in+our+own+country%2C+there+is+a+feeling+which+may+do+more+than+any+other+for+the+promotion+of+this+anti-systematic+tendency%2C+and+that+is+the+feeling%2C+that+as+the+preaching+of+doctrine+has+so+often+been+associated+with+tedium+and+lifelessness%2C+there+may+really+be+some+necessary+connection+between+theological+science+and+spiritual+death.%0A%0ABut+whencesoever+this+tendency+has+sprung%2C+here+among+us+it+unmistakably+is.+And+because+creeds+are+simply+the+expression+of+the+results+of+systematic+theology+%E2%80%94+because+creeds+bind+us+to+hold+one+system+of+truth+and+not+another+%E2%80%94+because+creeds+are+the+form+in+which+theological+science+meets+every+church+office-bearer%2C+therefore+it+is+against+creeds+the+assault+is+primarily+made.%0A%0AAnd+as+to+the+attitude+the+Church+should+hold+herself+in+towards+her+Confession%2C+we+find+among+us+every+grade+of+dissatisfaction+or+doubt%2C+from+the+proud+reluctance+of+the+youth+who+indignantly+asks%2C+%E2%80%9CWhy+should+I+take+my+opinions+at+other+men%E2%80%99s+hands%2C+and+be+merged+in+the+common+rank+and+file+that+have+believed+these+things%3F+Have+I+nothing+individual+and+characteristic%3B+can+I+strike+out+no+new+religious+truth%3F%E2%80%9D+%E2%80%94+from+this+youthful+recalcitration+to+the+prudent+scruple+of+the+matured+ecclesiastic%2C+who+fears+lest+some+weak+brother+be+offended+by+an+unimportant+clause+in+the+Confession%2C+and+who+sees+in+the+prospect+of+union+with+other+churches%2C+a+reason+for+being+very+careful+how+he+records+a+belief+which+may+unnecessarily+separate+him+from+other+Christians.%0A%0AOne+of+the+most+startling+forms+which+this+repugnance+to+creeds+has+taken+in+our+day%2C+is+the+refusal+of+those+who+have+subscribed+a+creed+to+acknowledge+that+this%2C+their+signature%2C+gives+any+guarantee+that+they+believe+the+articles+subscribed.+The+time+has+come+when+we+can+no+longer+disguise+or+evade+the+unwelcome+fact%2C+that+there+are+men+in+our+land%2C+of+undoubted+integrity+in+all+other+points%2C+and+who+are+exerting+influence+which+men+of+high+moral+character+can+alone+exert%2C+who+yet+sign+as+the+confession+of+their+faith%2C+what+they+do+not+believe.%0A%0AThey+avow+that+they+do+so%2C+and+endeavour+to+justify+such+subscription+mainly+by+this+same+assertion%2C+that+the+present+age+is+an+age+of+transition+%E2%80%94+that+opinions+long+held+as+true+are+becoming+doubtful%2C+and+that+new+truths+are+presenting+themselves%2C+and+that+in+such+a+state+of+matters+it+is+right+that+the+Church+should+not+be+so+rigidly+bound+to+her+old+creed+as+she+has+hitherto+been+%E2%80%94+that+she+should+be+left+free+to+make+progress+with+the+age.%E2%80%9D%0A%0A%E2%80%94+Marcus+Dods%2C+The+Revelation+of+God+in+Scripture%2C+viewed+in+respect+both+to+Theological+Science+and+to+the+Proper+use+of+Creeds+in+Patrick+Fairbairn+et+al.%2C+Divine+Revelation+Explained+and+Vindicated%3A+A+Course+of+Lectures+for+the+Times%2C+Delivered+in+Glasgow+in+the+Spring+of+1866&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd93802a641.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d93802a641.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/26/marcus-dods-on-opposition-to-systematic-theology-and-creeds/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-79b6badac1" data-kw="">
<blockquote><p>If someone asks how can men daily repeat the same form of words, as they do in the reading of public prayer, without being cold and so abominable to God, I answer that it is not frequently praying for the same things that is odious to God, but when this is done with an irreverent, unprepared, and corrupt heart – when it is done for custom, rather than fervently and in faith.

For do not the best people pray daily for faith, meekness, humility, peace, and such things (seeing we have daily need of them), and yet without weariness? To further satisfy them, they may know that in all churches, even the best reformed churches, there is a prescribed form of prayer used. Therefore, those who are of the mind that this should not be must separate themselves from all churches. Furthermore, if a set form of prayer were unlawful, then even the Lord’s Prayer (which is a set form of prayer prescribed by our Saviour Himself) should not be used.</p></blockquote>

<blockquote><p>Saying AMEN, audibly to all. Neh. 8. 6. […]

As for an audible pronouncing of Amen, if the mind of them that pronounce it, have been upon that which the Minister uttered, and their heart have given consent thereto, it compriseth altogether as much as the Minister hath uttered. This is the only warranteable means for people to utter their mind in a Congregation. It must therefore be uttered by every one, altogether, so loud, as well as they hear what he hath uttered in their name. For the one is as requisite as the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (London, 1641), p. 5.</span></figcaption>

<blockquote><p>When we were sat in Assembly, the three creeds were read, and many debates were held upon them, but especially about this word, in the eighth article, “they ought thoroughly to be received,” as if it set them in too high a place, in an equality with Scripture. At last it was resolved, that that article should be tendered to the Parliament, by way of humble advice, to be read thus, ‘The Creeds that go under the name of the Nice Creed, Athanasian Creed, and that which is commonly called the Apostles’ Creed, are thoroughly to be received and believed, for that the matter of them may be proved by most certain warrants of holy Scripture.’ Then was there a long agitation about translating the creeds anew, and about setting some gloss upon the preface and conclusion of Athanasius’ Creed, which seems to be something harsh; but at last it was concluded, that the creeds should be printed, at the end of the thirty-nine articles; so the determining of these matters referred thither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Journal of the Proceedings of the Assembly of Divines, from July 1, 1643, to December 31, 1644</cite>, ed. John Rogers Pitman (London: J. F. Dove, 1824), 18 August 1643, p. 10.</span></figcaption>

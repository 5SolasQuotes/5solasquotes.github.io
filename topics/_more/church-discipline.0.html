<figure class="quote" id="q-f5f7f2e614" data-kw="">
<blockquote><p>4. But if we were malicious in offending at the ceremonies as things unlawful, and in urging of non-conformity as necessary, should they [the prelates] therefore contemn our being scandalized? Those that would have Titus circumcised, were they not malicious? [Gal. 2:3-5] Did they not urge circumcision as necessary? Held they it not unlawful, not to circumcise Titus? Yet did the apostle abstain, because they were to be scandalized, that is, made worse and more wicked calumniators by the circumcising of Titus, as I have showed (above, ch. 8, section 6); So that albeit we are not to care for the displeasing of men that malitiously and contumaciously urge (as necessary) abstaining from that which is lawful to be done, yet must we care for scandalizing them and making them worse: rather ere that be, we ought to abstain from the use of our liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 45</span></figcaption>

</figure><figure class="quote" id="q-bda28d4fcf" data-kw="">
<blockquote><p>IX. Neither can the indifferency or lawfulness of the thing done, nor the ordinance of authority commanding the use of it, make the scandal following upon it to be only passive [and hence the commanders would be innocent], which otherwise, i.e. in case the thing were neither lawful, nor ordained by authority, should be active. Not the former; for our divines teach (Hemmings., Enchir. Theol., class 3, ch. 17; Magdeburg, Century 1, bk. 2, ch. 4, cols. 448-449) that scandalum datum [scandal given] rises sometimes, ex facto-in se adiaphoro [out of the fact in itself by the thing indifferent] when it is done intempessive, contra charitatis regulam [unseasonably contra the rule of charity]. Not the latter; for no human authority can take away the condition of scandal from that which otherwise should be scandal, because nullum homo potist vel charitati, vel conscientiis nostris imperare, vel periculum scandali d•…ti prestar•…, says a learned casuist (Ames, bk. 5, de Consc., ch. 11, q. 6). . ch. 9, p. 41 ” If this be not taken well from us, let one of our opposites speak for us, who aknowledges that human power cannot make us do that which we cannot do without giving of scandal, and that in this case, the pretext of obedience to superiors shall not excuse us at the hands of the Supreme Judge. (Dr. [John] Forbes, Iren., bk. 2, ch. 20, num. 19)</p></blockquote>

</figure><figure class="quote" id="q-e3be58e389" data-kw="">
<blockquote><p>Thirdly, If an occasional offence of weaker brethren may be a ground for restraining Christian liberty, then much more may commands from lawful authority do it; but the offence of weaker brethren may restrain Christian liberty, as to the exercise of it, as appears by the apostle’s discourse, Rom. 14:21. The reason of the consequence lies here, that a case of mere offence, which is here pleaded towards weak brethren, cannot have that obligation upon conscience which a known duty of obeying lawful authority, in things in themselves lawful, has. Nay further, insisting only on the law of scandal, I would fain know whether it be a greater offence and scandal to Christians’ consciences to infringe the lawful authority of the magistrate and to deny obedience to his commands, in things undetermined by the Law of God, or else to offend the consciences, that is, go against the judgements of some well-meaning, but less-knowing Christians. Or thus, whether in the matter of scandal, it be a greater offence to go against the judgments of the weaker and more ignorant, or the more knowing and able, when the one have only their own weak apprehension to bias them, the other are backed by and grounded upon an established law. And whether it be not a greater scandal to religion to disobey a Christian magistrate than it is to offend some private Christians. Let these things be examined, and then let us see whether the argument will not hold à majori; if the law of scandal as to private Christians may restrain liberty, then may a command from the magistrate do it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thirdly, If an occasional offence of weaker brethren may be a ground for restraining Christian liberty, then much more may commands from lawful authority do it; but the offence of weaker brethren may restrain Christian liberty, as to the exercise of it, as appears by the apostle’s discourse, Rom. 14:21. The reason of the consequence lies here, that a case of mere offence, which is here pleaded towards weak brethren, cannot have that obligation upon conscience which a known duty of obeying lawful authority, in things in themselves lawful, has. Nay further, insisting only on the law of scandal, I would fain know whether it be a greater offence and scandal to Christians’ consciences to infringe the lawful authority of the magistrate and to deny obedience to his commands, in things undetermined by the Law of God, or else to offend the consciences, that is, go against the judgements of some well-meaning, but less-knowing Christians. Or thus, whether in the matter of scandal, it be a greater offence to go against the judgments of the weaker and more ignorant, or the more knowing and able, when the one have only their own weak apprehension to bias them, the other are backed by and grounded upon an established law. And whether it be not a greater scandal to religion to disobey a Christian magistrate than it is to offend some private Christians. Let these things be examined, and then let us see whether the argument will not hold à majori; if the law of scandal as to private Christians may restrain liberty, then may a command from the magistrate do it.”

</figure><figure class="quote" id="q-9f643623cd" data-kw="">
<blockquote><p>Not just Paul, but the apostles and elders at the synod in Jerusalem, bindingly (Acts 15:28; 16:4) laid some of these beggarly, burdensome ceremonies on the whole regional Church (Acts 15:23, 41; 16:4), as “it seemed good to the Holy Ghost” (Acts 15:28), yet not for the formal reason of service to that law of bondage. Rather, the circumstances made it necessary (Acts 15:28), to prevent the greater scandal of erring (Jewish) unbelievers and weak Christians (who expected the observance of such carnal and false, material ordinances), and for the spread of the Gospel amongst them. In the case of Paul, he had his reasons for keeping the ceremonies in each instance, though they are not always told to us or onlookers. But each time his necessity (Acts 16:1–5; 18:21) was less than ministerial deprivation. Sometimes it was simply to prevent unnecessary conflict.</p></blockquote>

</figure><figure class="quote" id="q-96301fde29" data-kw="">
<blockquote><p>But there is one principle [George] Gillespie’s fore-analyzed rule did not allow him to adequately address.¹ [John] Sprint affirmed the principle of, regarding things not inherently wrong, avoiding the greater hurt and scandal, which is a form of the fundamental natural law of avoiding evil and doing the greatest good attainable. ¹ Gillespie acknowledges “in evils of punishment, we may choose a lesser” (Dispute, pt. 2, ch. 1, p. 10); cf. 2 Sam. 24:10–14. Yet the ethical issues of the permissibility of choosing material evils in justified circumstances go far deeper and wider than being limited to punishments. See Fentiman, ‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ throughout at ‘On Voting’ (RBO) and ‘An Extended Introduction’ at ‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’ (RBO). If God may graciously choose for us the lesser miserable evil, may not we concur (2 Chron. 12:5–8), when He reasons with us to do so (Jer. 27:12–13)?</p></blockquote>

<blockquote><p>What leadership virtue are we mistaking bullying for? Which trait is such a priority that we aren’t even aware when it is deployed in an ungodly, and biblically prohibited, way?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/sam-allberry.html">Sam Allberry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How Do Churches End Up with Domineering Bullies for Pastors?’</cite>, (2019) 17 paragrpahs</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>
<div class="actions"><button class="copy" data-copy="“What leadership virtue are we mistaking bullying for? Which trait is such a priority that we aren’t even aware when it is deployed in an ungodly, and biblically prohibited, way?”

— Sam Allberry, ‘How Do Churches End Up with Domineering Bullies for Pastors?’, (2019) 17 paragrpahs">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+leadership+virtue+are+we+mistaking+bullying+for%3F+Which+trait+is+such+a+priority+that+we+aren%E2%80%99t+even+aware+when+it+is+deployed+in+an+ungodly%2C+and+biblically+prohibited%2C+way%3F%E2%80%9D%0A%0A%E2%80%94+Sam+Allberry%2C+%E2%80%98How+Do+Churches+End+Up+with+Domineering+Bullies+for+Pastors%3F%E2%80%99%2C+%282019%29+17+paragrpahs&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcaf43006e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/caf43006e7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=What%20leadership%20virtue%20are%20we%20mistaking,an%20ungodly%2C%20and%20biblically%20prohibited%2C%20way&amp;text=What%20leadership%20virtue%20are%20we%20mistaking%20bullying%20for&amp;text=deployed%20in%20an%20ungodly%2C%20and%20biblically%20prohibited%2C%20way" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-49413ac06b" data-kw="">
<blockquote><p>There is obviously much to be learned from both successful CEOs and also great generals, but both models can quickly become toxic. When either becomes the primary model for Christian leadership, is it any wonder that domineering pastors result? The pastor-as-CEO approach might foster entrepreneurialism and risk-taking, but it easily becomes results-oriented. The pastor-as-general approach might foster perseverance and grit, but it easily becomes task-oriented. One produces swagger: Their word is law because they’re economically indispensable to the church. The other produces presumption: Orders must be followed because the general ‘knows’ what is best for every person. In each case we either tolerate or fail to see traits of bullying, because ministry ends justify ministry means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/sam-allberry.html">Sam Allberry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How Do Churches End Up with Domineering Bullies for Pastors?’</cite>, (2019) 17 paragrpahs</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There is obviously much to be learned from both successful CEOs and also great generals, but both models can quickly become toxic. When either becomes the primary model for Christian leadership, is it any wonder that domineering pastors result? The pastor-as-CEO approach might foster entrepreneurialism and risk-taking, but it easily becomes results-oriented. The pastor-as-general approach might foster perseverance and grit, but it easily becomes task-oriented. One produces swagger: Their word is law because they’re economically indispensable to the church. The other produces presumption: Orders must be followed because the general ‘knows’ what is best for every person. In each case we either tolerate or fail to see traits of bullying, because ministry ends justify ministry means.”

— Sam Allberry, ‘How Do Churches End Up with Domineering Bullies for Pastors?’, (2019) 17 paragrpahs">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+obviously+much+to+be+learned+from+both+successful+CEOs+and+also+great+generals%2C+but+both+models+can+quickly+become+toxic.+When+either+becomes+the+primary+model+for+Christian+leadership%2C+is+it+any+wonder+that+domineering+pastors+result%3F+The+pastor-as-CEO+approach+might+foster+entrepreneurialism+and+risk-taking%2C+but+it+easily+becomes+results-oriented.+The+pastor-as-general+approach+might+foster+perseverance+and+grit%2C+but+it+easily+becomes+task-oriented.+One+produces+swagger%3A+Their+word+is+law+because+they%E2%80%99re+economically+indispensable+to+the+church.+The+other+produces+presumption%3A+Orders+must+be+followed+because+the+general+%E2%80%98knows%E2%80%99+what+is+best+for+every+person.+In+each+case+we+either+tolerate+or+fail+to+see+traits+of+bullying%2C+because+ministry+ends+justify+ministry+means.%E2%80%9D%0A%0A%E2%80%94+Sam+Allberry%2C+%E2%80%98How+Do+Churches+End+Up+with+Domineering+Bullies+for+Pastors%3F%E2%80%99%2C+%282019%29+17+paragrpahs&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F49413ac06b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49413ac06b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=There%20is%20obviously%20much%20to%20be,because%20ministry%20ends%20justify%20ministry%20means&amp;text=There%20is%20obviously%20much%20to%20be%20learned%20from&amp;text=of%20bullying%2C%20because%20ministry%20ends%20justify%20ministry%20means" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2c52200069" data-kw="">
<blockquote><p>People who find themselves at odds with a spiritually abusive pastor, will often feel isolated, shamed, ostracized, silenced, and made to feel like they are unsubmissive, insubordinate, and one who undermines the church’s God-given leadership. … Spiritual Abuse Is Often Used to Achieve Godly, Biblical Goals… abuse usually happens because a pastor is desperately trying to control his situation. He wants to control his staff, control the vision, control the direction of the church. Loyalty must be maintained at all costs. Nothing can be allowed to derail the ministry. And when people fall out of line (which tends to happen with human beings) then he cracks the whip… …when the abuse is uncovered, people often refuse to believe it. To allow such a possibility will wreck the tidy world they have built around that spiritual leader. So, the abusive pastor can often provide what seems to be credible ‘explanations’ for everything, while he is backed up by supporters who don’t want to see a successful ministry come to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/michael-j-kruger.html">Michael J. Kruger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What is Spiritual Abuse?’</cite>, (2021) 14 paragraphs</span></figcaption>

<blockquote><p>…the victims of abuse usually don’t speak out for fear of reprisal. They just leave, and the abusive pastor remains. And if the abusive pastor remains, then he gets to control the narrative… But, there is a difference with abusive pastors. The “relational debris field” of an abusive pastor is not only different in regard to volume of conflicts, but the depth of those conflicts. The lives in his wake are genuinely destroyed… On top of this, abusive pastors often have unresolved conflict. They are typically estranged from many… At this point, the leaders of the church just need to do the math. There is a common denominator in all these different conflicts, namely the pastor…. …the pattern of relational wreckage is often not recognized because spiritually abusive pastors don’t abuse everyone. They are selective in who they treat this way. In fact, there are other people whom the abusive pastor treats remarkably well. In other words, abusive pastors almost always have two sides. One side is domineering, heavy-handed and threatening. The other side is charming, gracious, and even flattering. The tragic implications of this reality is that abusive pastors will almost always have avid defenders who insist that this pastor is the greatest guy in the world. And, to them, that pastor probably has been great. And such defenders will inevitably use the same logic: “He’s never treated me this way.” In other words, they form their judgment entirely on their personal experience… not everyone is in a position to see this track record.</p></blockquote>

hub.io%2Fquote%2F4690e89c7e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4690e89c7e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=the%20victims%20of%20abuse%20usually%20don%E2%80%99t,position%20to%20see%20this%20track%20record&amp;text=the%20victims%20of%20abuse%20usually%20don%E2%80%99t%20speak%20out&amp;text=in%20a%20position%20to%20see%20this%20track%20record" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-69e13bf0f0" data-kw="">
<blockquote><p>The chief desire of abusive individuals and organizations is to attain or retain power… abusive pastors often create an entire church culture that perpetually affirms and protects their authority—a culture designed to shield them from criticism, and punish anyone who dares challenge them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/michael-j-kruger.html">Michael J. Kruger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Key Signs of An Abusive Pastor #2</cite>, (2021) 18 paragraphs</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>
<div class="actions"><button class="copy" data-copy="“The chief desire of abusive individuals and organizations is to attain or retain power… abusive pastors often create an entire church culture that perpetually affirms and protects their authority—a culture designed to shield them from criticism, and punish anyone who dares challenge them.”

— Michael J. Kruger, ‘Key Signs of An Abusive Pastor #2, (2021) 18 paragraphs">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+chief+desire+of+abusive+individuals+and+organizations+is+to+attain+or+retain+power%E2%80%A6+abusive+pastors+often+create+an+entire+church+culture+that+perpetually+affirms+and+protects+their+authority%E2%80%94a+culture+designed+to+shield+them+from+criticism%2C+and+punish+anyone+who+dares+challenge+them.%E2%80%9D%0A%0A%E2%80%94+Michael+J.+Kruger%2C+%E2%80%98Key+Signs+of+An+Abusive+Pastor+%232%2C+%282021%29+18+paragraphs&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69e13bf0f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69e13bf0f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=The%20chief%20desire%20of%20abusive%20individuals,punish%20anyone%20who%20dares%20challenge%20them&amp;text=The%20chief%20desire%20of%20abusive%20individuals%20and%20organizations&amp;text=criticism%2C%20and%20punish%20anyone%20who%20dares%20challenge%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d312505452" data-kw="">
<blockquote><p>A clear indicator of shunning is that the evidence of the ‘sins’ of the shunned person will be thin. Instead, insinuations will be made about a person’s character and rarely will there be something concrete. If there is, it won’t rise to the level of a chargeable offense, although the leadership may greatly exaggerate it. The ‘sin’ actually consists of disagreement with the leadership… Shunning at its root is a ‘good riddance.’ It is to discard someone. The coldness of it will be evident over time with repetition of occurrences. Rather than the love which ‘always hopes,’ there is a sentiment more like, ‘you have to be willing to pull the trigger.’… …with shunning, often there will be no church discipline involved; a process demanding the rigor of due process, true shepherding, time, and layers of accountability due to the gravity of what is at stake… the leadership simply communicates to the church in various ways that certain people are to be totally avoided because they pose a ‘danger’ to the church. People disappear with little discussion or invitation for questions, except for insinuation about them… First, those who are perceived as a ‘threat’ to power and control of the spiritually abusive leadership are marked… It may take place in the context of a controversy where leadership is domineering and anyone who questions is therefore marked… Second, the abusive leadership moves to push out the perceived threat… It can be as simple as a cold shoulder: the person receives nonverbal cues that they are not wanted by the leadership. Exclusion may be accomplished by veiled references with criticisms from the pulpit where the victim and others know who is being described… Pastoral knowledge of their lives or weaknesses may be marshaled against them abusively… Victims may find themselves berated, facing tremendous anger and rage designed to cow them into submission… the collective power of a body of complicit leaders may convince them that the problem is indeed themselves. This may be the worst scenario, as the victim finds himself under the terror of condemnation, believing that the anger he is receiving is the anger of God… The psychological toll is terrible. But this tactic is effective: such persons are neutralized as a ‘threat’… Third, in order to minimize any potential damage to the leadership’s reputation and maintain control, individuals must be discredited. Here is where the real work must be done upon a congregation to get them on board. Those who have been marked and excluded continue to pose a threat because they may speak with persons in the congregation. The more godly and mature the excluded person is, the more intently the leadership will have to work to discredit them. This results in demonization. The words of the Pharisees whose control was challenged by the formerly blind man are pertinent: “You were born in utter sin, and would you teach us?” And they cast him out (John 9:34)… Full Shunning… It takes place incrementally, with exhortations of ‘protecting the flock from dangerous people,’… ‘exerting tough love toward unrepentant people,’ and ‘not allowing Satan a foothold’ at the forefront. These are convincing themes for biblical Christians who trust their leaders. Although there may be no formal discipline, the character of the person is so slandered that others conclude they have reason to withdraw from them, and even a moral obligation… The pulpit, private conversations, committee meetings, and public prayers become useful for insinuations… …the pattern will easily be replicated and expanded. The leader therefore begins with strong pressure on the other leaders to do this. Other involved members will pick up on the practice as it is now reinforced from multiple people. Once the principles are inculcated with a core, it will spread. It becomes a powerful tool for control as well as instilling fear of disagreeing and being among ‘those compromised people’ whose eternal destiny is called into question. When it is leaders who step out of line and are excluded, they will quickly be erased… Long standing close relationships are ruptured… The closer the remaining individuals are to the core leadership, the more severe the pressure will be. Victims multiply. In biblically orthodox contexts, often at the root of abusive leadership and shunning is the sort of self-idolatry commonly described as narcissism. This takes the shape again and again of a charismatic figure, compelling in his leadership, capable in his use of scripture, remarkably gifted in different ways, yet underneath gripped by sins of great spiritual pride and need for control. He labors to hide these from all people and especially from himself with ministerial activity and forms of piety. He views himself as fundamentally different and above others and unable to begin to consider the possibility of something being so wrong within. This leaves him with great insecurity and unable to receive criticism or be questioned in his judgment. He excels in gathering others around him by flattery to serve as supporters, training and convincing them of his ways, but will swiftly crush them if he detects disloyalty… If you have concerns that such tendencies may be present in your church, read further resources on the topic and seek objective counsel and prayer from other Christians outside of your church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/steven-light.html">Steven Light</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Unmasking Abusive Spiritual Leadership Part I: Shunning’</cite>, (2023) 23 paragraphs at Aquila Report</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

se eternal destiny is called into question. When it is leaders who step out of line and are excluded, they will quickly be erased… Long standing close relationships are ruptured… The closer the remaining individuals are to the core leadership, the more severe the pressure will be. Victims multiply. In biblically orthodox contexts, often at the root of abusive leadership and shunning is the sort of self-idolatry commonly described as narcissism. This takes the shape again and again of a charismatic figure, compelling in his leadership, capable in his use of scripture, remarkably gifted in different ways, yet underneath gripped by sins of great spiritual pride and need for control. He labors to hide these from all people and especially from himself with ministerial activity and forms of piety. He views himself as fundamentally different and above others and unable to begin to consider the possibility of something being so wrong within. This leaves him with great insecurity and unable to receive criticism or be questioned in his judgment. He excels in gathering others around him by flattery to serve as supporters, training and convincing them of his ways, but will swiftly crush them if he detects disloyalty… If you have concerns that such tendencies may be present in your church, read further resources on the topic and seek objective counsel and prayer from other Christians outside of your church.”

— Steven Light, ‘Unmasking Abusive Spiritual Leadership Part I: Shunning’, (2023) 23 paragraphs at Aquila Report">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+clear+indicator+of+shunning+is+that+the+evidence+of+the+%E2%80%98sins%E2%80%99+of+the+shunned+person+will+be+thin.+Instead%2C+insinuations+will+be+made+about+a+person%E2%80%99s+character+and+rarely+will+there+be+something+concrete.+If+there+is%2C+it+won%E2%80%99t+rise+to+the+level+of+a+chargeable+offense%2C+although+the+leadership+may+greatly+exaggerate+it.+The+%E2%80%98sin%E2%80%99+actually+consists+of+disagreement+with+the+leadership%E2%80%A6+Shunning+at+its+root+is+a+%E2%80%98good+riddance.%E2%80%99+It+is+to+discard+someone.+The+coldness+of+it+will+be+evident+over+time+with+repetition+of+occurrences.+Rather+than+the+love+which+%E2%80%98always+hopes%2C%E2%80%99+there+is+a+sentiment+more+like%2C+%E2%80%98you+have+to+be+willing+to+pull+the+trigger.%E2%80%99%E2%80%A6+%E2%80%A6with+shunning%2C+often+there+will+be+no+church+discipline+involved%3B+a+process+demanding+the+rigor+of+due+process%2C+true+shepherding%2C+time%2C+and+layers+of+accountability+due+to+the+gravity+of+what+is+at+stake%E2%80%A6+the+leadership+simply+communicates+to+the+church+in+various+ways+that+certain+people+are+to+be+totally+avoided+because+they+pose+a+%E2%80%98danger%E2%80%99+to+the+church.+People+disappear+with+little+discussion+or+invitation+for+questions%2C+except+for+insinuation+about+them%E2%80%A6+First%2C+those+who+are+perceived+as+a+%E2%80%98threat%E2%80%99+to+power+and+control+of+the+spiritually+abusive+leadership+are+marked%E2%80%A6+It+may+take+place+in+the+context+of+a+controversy+where+leadership+is+domineering+and+anyone+who+questions+is+therefore+marked%E2%80%A6+Second%2C+the+abusive+leadership+moves+to+push+out+the+perceived+threat%E2%80%A6+It+can+be+as+simple+as+a+cold+shoulder%3A+the+person+receives+nonverbal+cues+that+they+are+not+wanted+by+the+leadership.+Exclusion+may+be+accomplished+by+veiled+references+with+criticisms+from+the+pulpit+where+the+victim+and+others+know+who+is+being+described%E2%80%A6+Pastoral+knowledge+of+their+lives+or+weaknesses+may+be+marshaled+against+them+abusively%E2%80%A6+Victims+may+find+themselves+berated%2C+facing+tremendous+anger+and+rage+designed+to+cow+them+into+submission%E2%80%A6+the+collective+power+of+a+body+of+complicit+leaders+may+convince+them+that+the+problem+is+indeed+themselves.+This+may+be+the+worst+scenario%2C+as+the+victim+finds+himself+under+the+terror+of+condemnation%2C+believing+that+the+anger+he+is+receiving+is+the+anger+of+God%E2%80%A6+The+psychological+toll+is+terrible.+But+this+tactic+is+effective%3A+such+persons+are+neutralized+as+a+%E2%80%98threat%E2%80%99%E2%80%A6+Third%2C+in+order+to+minimize+any+potential+damage+to+the+leadership%E2%80%99s+reputation+and+maintain+control%2C+individuals+must+be+discredited.+Here+is+where+the+real+work+must+be+done+upon+a+congregation+to+get+them+on+board.+Those+who+have+been+marked+and+excluded+continue+to+pose+a+threat+because+they+may+speak+with+persons+in+the+congregation.+The+more+godly+and+mature+the+excluded+person+is%2C+the+more+intently+the+leadership+will+have+to+work+to+discredit+them.+This+results+in+demonization.+The+words+of+the+Pharisees+whose+control+was+challenged+by+the+formerly+blind+man+are+pertinent%3A+%E2%80%9CYou+were+born+in+utter+sin%2C+and+would+you+teach+us%3F%E2%80%9D+And+they+cast+him+out+%28John+9%3A34%29%E2%80%A6+Full+Shunning%E2%80%A6+It+takes+place+incrementally%2C+with+exhortations+of+%E2%80%98protecting+the+flock+from+dangerous+people%2C%E2%80%99%E2%80%A6+%E2%80%98exerting+tough+love+toward+unrepentant+people%2C%E2%80%99+and+%E2%80%98not+allowing+Satan+a+foothold%E2%80%99+at+the+forefront.+These+are+convincing+themes+for+biblical+Christians+who+trust+their+leaders.+Although+there+may+be+no+formal+discipline%2C+the+character+of+the+person+is+so+slandered+that+others+conclude+they+have+reason+to+withdraw+from+them%2C+and+even+a+moral+obligation%E2%80%A6+The+pulpit%2C+private+conversations%2C+committee+meetings%2C+and+public+prayers+become+useful+for+insinuations%E2%80%A6+%E2%80%A6the+pattern+will+easily+be+replicated+and+expanded.+The+leader+therefore+begins+with+strong+pressure+on+the+other+leaders+to+do+this.+Other+involved+members+will+pick+up+on+the+practice+as+it+is+now+reinforced+from+multiple+people.+Once+the+principles+are+inculcated+with+a+core%2C+it+will+spread.+It+becomes+a+powerful+tool+for+control+as+well+as+instilling+fear+of+disagreeing+and+being+among+%E2%80%98those+compromised+people%E2%80%99+whose+eternal+destiny+is+called+into+question.+When+it+is+leaders+who+step+out+of+line+and+are+excluded%2C+they+will+quickly+be+erased%E2%80%A6+Long+standing+close+relationships+are+ruptured%E2%80%A6+The+closer+the+remaining+individuals+are+to+the+core+leadership%2C+the+more+severe+the+pressure+will+be.+Victims+multiply.+In+biblically+orthodox+contexts%2C+often+at+the+root+of+abusive+leadership+and+shunning+is+the+sort+of+self-idolatry+commonly+described+as+narcissism.+This+takes+the+shape+again+and+again+of+a+charismatic+figure%2C+compelling+in+his+leadership%2C+capable+in+his+use+of+scripture%2C+remarkably+gifted+in+different+ways%2C+yet+underneath+gripped+by+sins+of+great+spiritual+pride+and+need+for+control.+He+labors+to+hide+these+from+all+people+and+especially+from+himself+with+ministerial+activity+and+forms+of+piety.+He+views+himself+as+fundamentally+different+and+above+others+and+unable+to+begin+to+consider+the+possibility+of+something+being+so+wrong+within.+This+leaves+him+with+great+insecurity+and+unable+to+receive+criticism+or+be+questioned+in+his+judgment.+He+excels+in+gathering+others+around+him+by+flattery+to+serve+as+supporters%2C+training+and+convincing+them+of+his+ways%2C+but+will+swiftly+crush+them+if+he+detects+disloyalty%E2%80%A6+If+you+have+concerns+that+such+tendencies+may+be+present+in+your+church%2C+read+further+resources+on+the+topic+and+seek+objective+counsel+and+prayer+from+other+Christians+outside+of+your+church.%E2%80%9D%0A%0A%E2%80%94+Steven+Light%2C+%E2%80%98Unmasking+Abusive+Spiritual+Leadership+Part+I%3A+Shunning%E2%80%99%2C+%282023%29+23+paragraphs+at+Aquila+Report&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd312505452.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d312505452.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=A%20clear%20indicator%20of%20shunning%20is,other%20Christians%20outside%20of%20your%20church&amp;text=A%20clear%20indicator%20of%20shunning%20is%20that%20the&amp;text=prayer%20from%20other%20Christians%20outside%20of%20your%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Jesus [in Mt. 18] is not addressing public sins or scandalous matters that the whole church would already be aware of. If that were the case, gross and explicit sins would then be drug into secrecy, to be resolved in secret. May it never be! And yet, sadly, it often is. The church frequently colludes to protect the group, and scandalous sin is quickly covered up and dealt with secretly… Jesus addresses public persons publicly. Recall his scathing condemnation of Herod (Luke 13:32), or his many public “woes” (i.e. “curses”) pronounced upon the pharisees (cf. Matt 23:13-39). We can almost hear the modern Christian retort: “Yes, Jesus, but did you confront all of them privately first?!… Matthew 18 is not speaking of abusers and oppressors. Jesus is speaking of “brothers”, not wolves. Would we ask Christ’s most tender and trodden upon lambs to go alone, and speak alone, with her predator before we can properly confront his sin?! Again, may it never be!</p></blockquote>

<blockquote><p>Some Imperious Presbyterians are known for high-handed and arbitrary uses of church discipline. What is the status of a congregation that doles out ecclesiastical discipline in a tyrannical manner? Such an assembly is unhealthy or corrupt, regardless of whether it has an outward form of Presbyterian polity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/kevin-reed.html">Kevin Reed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Imperious Presbyterianism</cite>, (Unicoi, TN: Trinity Foundation, 2008), p. 18</span></figcaption>

<blockquote><p>What are the sins forbidden in the eighth commandment? The sins forbidden in the eighth commandment, besides the neglect of the duties required, are, theft, robbery, man-stealing, and receiving anything that is stolen; fraudulent dealing, false weights and measures, removing landmarks, injustice and unfaithfulness in contracts between man and man, or in matters of trust; oppression, extortion, usury, bribery, vexatious lawsuits, unjust enclosures and depredation; engrossing commodities to enhance the price; unlawful callings, and all other unjust or sinful ways of taking or withholding from our neighbor what belongs to him, or of enriching ourselves; covetousness; inordinate prizing and affecting worldly goods; distrustful and distracting cares and studies in getting, keeping, and using them; envying at the prosperity of others; as likewise idleness, prodigality, wasteful gaming; and all other ways whereby we do unduly prejudice our own outward estate, and defrauding ourselves of the due use and comfort of that estate which God hath given us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism</cite>, 142, 1648</span></figcaption>

</figure><figure class="quote" id="q-c6b1fb719e" data-kw="">
<blockquote><p>We think it of great consequence, that all these sceptical and latitudinarian views with regard to church discipline, should be made to cease. We believe, that there is a power in the church as such, independently of the mere weight it might have as an ordinary society among men, which is capable of being used in this way, for Christian purposes, with very great effect.

This power, like the word of God itself and the holy sacraments, is of a spiritual force, working far deeper and more efficiently than appears to common reason, and in a way not to be measured therefore by its calculations. To judge of it, as a man would judge of the authority and influence of a mere human organization, without taking into view the divinity which lies hidden within it, is to err in the same way as if anyone should think to estimate the power of the Bible by the same considerations, to which it is common to recur in weighing the eloquence or reasonings of men.

The word of God is quick and powerful, far beyond its outward show; and so also is the discipline of his church, administered according to his own appointment, and in the spirit of sincere piety. It is in itself eminently adapted to take hold of the conscience and heart, with quickening and convincing power; and were it only faithfully employed, as it ought to be, it might be relied upon for the accomplishment of the most difficult ends, where the more plausible methods of this world’s policy are trusted in vain. It is no objection at all to the worth of this agency that it may appear weak or unwise to common reason.

We know, that the wisdom of God is in other cases foolishness with men; and it belongs to that faith, by which the church should be led, to confide in his appointments, even where the power of them is not at once manifest, rather than in any rules of action suggested by the philosophy of man, however profound and comprehensive that philosophy may claim to be.

In every case in which the church is bold enough to commit her cause in this way, with godly simplicity, to the experiment of faith, it will be found that the foolishness of God is wiser than men, and his weakness stronger than their strength; and that it is better to trust his counsel, even against hope, than to put confidence in the most princely show of reason arrayed against it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/the-presbytery-of-ohio.html">The Presbytery of Ohio</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Claims of the Christian Sabbath; A Report Read and Adopted April 21, 1836, at a Meeting of the Presbytery, held at Raccoon Church</cite>, (Pittsburgh PA: William Allinder, 1836), pp 9-10.</span></figcaption>

</figure><figure class="quote" id="q-9a0844b443" data-kw="">
<blockquote><p>In administering discipline. Overseers have the task of seeing that Christian discipline is correctly exercised. You see, in Scripture, true believers are called not only sons and daughters of God but also children — even little children (1 John 2:1). We know that in a well-ordered household in which God’s ordinances are followed, not only are children admonished but a rod is also prepared for those who fail to heed the warnings (Prov. 2:15; 13:24). God has ordered his house in the same way (1 Tim. 3:15) and regulates matters in such a way that in addition to his Word of admonition, there is also the rod of his discipline (1 Cor. 4:21).

Discipline must be applied with discrimination and care, according to the nature of the offense and the persistence of sinning, if we wish to maintain good order in God’s house and advance godliness among believers. Moses says of the law he was given that the word was not a vain thing for the people (Deut. 32:47). Likewise, we also say that the rod of discipline was not a vain thing. Our wise and good God and Savior has not instituted discipline for us for any reason other than that it is highly necessary for the welfare of his Christian flock, even under the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/willem-teellinck.html">Willem Teellinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Path of True Godliness</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke, Classics of Reformed Spirituality (1636; Grand Rapids MI: Reformation Heritage Books, 2003), p. 163.</span></figcaption>

a class="src" href="https://reformedcovenanter.wordpress.com/2023/12/12/willem-teellinck-on-administering-church-discipline/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-c3672a3c3e" data-kw="">
<blockquote><p>How idle it is to laud the Reformers and to emphasize their teaching as to the marks of the true Church, if we forget that, in addition to the preaching of the Word and the administration of the sacraments, they emphasized the vital importance also of the exercise of discipline. And what object had they in view in drawing up their confessions and catechisms save the exercise of discipline?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martyn-lloyd-jones.html">Martyn Lloyd-Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Maintaining the Evangelical Faith Today</cite>, (London: Inter-Varsity Fellowship, 1952), p. 15.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“How idle it is to laud the Reformers and to emphasize their teaching as to the marks of the true Church, if we forget that, in addition to the preaching of the Word and the administration of the sacraments, they emphasized the vital importance also of the exercise of discipline. And what object had they in view in drawing up their confessions and catechisms save the exercise of discipline?”

<blockquote><p>The word here usually translated Offence, is not meant so much, sin in it self, as commonly they are called Offences, as they are indeed against both God and man. But the word offence is here taken for a peculiar effect or fruit that follows on the evil behaviour of men; and therefore is well translated Scandals, it being the Greek word here used, and it properly signifies that crooked piece of wood, to the which the bait in a Trap is fastened, which while the Mouse or other thing doth gnaw or move, it pulls the Trap on it self. It is also any block that is cast in one’s way, whereby one may be endangered to stumble and fall, and so figuratively it is used in Scripture for every public and open evil and sin, whither word or deed which while others do endeavour to follow by his example and authority, that did it or spake it, being allured, as with a bait, they entangle themselves in the Devil’s trap or snare; or thereby they are made to stand still or fall in the right way. And therefore this word is interpreted, by a departing as may appear by comparing, Math. 13.21. With Luke, 8.13. For that which in the one place is called a Scandalizing, in the other is called a Falling away: And Rom. 14.13. It is directly called a stumbling-block, whence a Scandal may be defined to be any word or deed, giving occasion to any of falling into sin, or of falling away from the received truth or practice of Piety, or doth cause a negligence in the same.

Now these Scandals are of two sorts. First, given. Second, taken. Scandals given, are all wicked sayings, and deeds, repugning the love of God and of our neighbour, and whereby the former effects are occasioned, and these are either in matters of Doctrine, or in life and manners. Thus all false and erroneous Doctrines, as of Jews, Turks, Infidels, and Papists, are great means whereby many are with-held from the right way to Salvation; but especially the Papists are hereby a great scandal unto the Jews who live among them; for they seeing Idols so usual in their Churches and Practices, which they justly abhor; they are made thereby to loath Christian Religion. Again, all prophane and irreligious speeches of God and his worship, are of this kind, as Mal. 3.14. All blasphemous contumelies and reproaches of the truth of Paul’s Doctrine was Scandalized, Rom. 3. at the beginning, Rom. 6. and Rom. 7. And our Doctrine of Justification, Free-will, with other necessary truths, are so perverted by the Papists to their followers, that thereby great offense is given to the ignorant.

So for wicked actions, they are Scandals, for thereby other are encouraged to evil, or made not so much to fear them (Math. 16.17.) Thus the incest of the Corinth. 1 Cor. 5. For the Scandal of the contagion is called a Leaven. And so scandals given are by all sorts of wicked men professing Christ but especially by such who being forward and zealous in Religion, do either grow unsound, decaying or dissolute. The neglect also of good things, whither private, or such as belong to publique callings, whether Civil or Ecclesiastical. As the Magistrate’s Scandal is, when he doth not his duty in punishing wickedness and cherishing the good; the scandal of Ministers is, when they are negligent and careless in their Ministry: and here chiefly, Nonresidency and unsufficiency are grievous scandals; for hereby men are exceedingly weakened in the course of Piety, by the example of such as are counted wise and learned, and so such as whose example might safely be followed. And thus were the Pharisees a great Scandal to the common people of the Jews, as Christ charges them. Math. 23 They would not let the people enter into Heaven:

There are also Scandals given, not only in doing things unlawful in themselves, but in things indifferent, which are not evil in themselves. Thus Peter was a great Scandal, by his eating and living as the Jews, so that Barnabas was stumbled by it; and this Paul teaches plainly. Rom. 14.13, 14, 15, 16. 1 Cor. 8. and 9. chap. For though the nature and use of these things be always lawful in themselves, yet it may be offended in the external usage of them; for thereby another may be hindered, either from the truth or Piety, as is seen, 1 Cor. 6.12.

The second sort of Scandals, are such as are taken, not given. That is, that are of such nature of themselves as might incite to Piety, and might confirm in truth, but yet are abused to the contrary. And thus every word or action, good in it self, may be the matter of Scandal, being taken to be evil, whither it be done slanderously out of malice, or out of weakness through ignorance. And that these are not to be blamed, it may appear, for even the most holy things are within this compass: All these Scandals may be referred to three chief heads. First, the word of God. Second, the works of God. Third, the godly, their sayings and doings. For the first, the word of God is a Scandal, in either part of it, whither the Law or the Gospel. The Law is to many a Scandal, either through ignorance or wilfulness. Thus the Jews were Scandalized through a carnal zeal they bare to the Lord; thus Rom. 9. The Law is a Scandal to out corruption, which while the Law restrains, it rages more and takes occasion to work Concupiscence and death. Thus also the impossibility of the Law is a great Scandal to ignorant men, they not conceiving how it should be just with God to command things impossible, to corrupt nature.</p></blockquote>

<blockquote><p>We see, secondly, in these verses [John 9:26-41], how cruelly and unjustly unconverted men will sometimes treat those who disagree with them. When the Pharisees could not frighten the blind man who had been cured, they expelled him from the Jewish Church. Because he manfully refused to deny the evidence of his own senses, they excommunicated him, and put him to an open shame. They cast him out “as a heathen man and a publican [tax-collector].”

The temporal injury that such treatment did to a poor Jew was very great indeed. It cut him off from the outward privileges of the Jewish Church. It made him an object of scorn and suspicion among all true Israelites. But it could do no harm to his soul. That which wicked men bind on earth is not bound in heaven. “The curse causeless shall not come.” (Prov. 26:2.)

The children of God in every age have only too frequently met with like treatment. Excommunication, persecution, and imprisonment have generally been favourite weapons with ecclesiastical tyrants. Unable, like the Pharisees, to answer arguments, they have resorted to violence and injustice. Let the child of God console himself with the thought that there is a true Church out of which no man can cast him, and a Church-membership which no earthly power can take away. He only is blessed whom Christ calls blessed; and he only is accursed whom Christ shall pronounce accursed at the last day.

We see, thirdly, in these verses, how great is the kindness and condescension of Christ. No sooner was this poor blind man cast out of the Jewish Church than Jesus finds him and speaks words of comfort. He knew full well how heavy an affliction excommunication was to an Israelite, and at once cheered him with kind words. He now revealed Himself more fully to this man than He did to any one except the Samaritan woman. In reply to the question, “Who is the Son of God?” He says plainly, “Thou hast both seen Him, and it is He that talketh with thee.”

We have here one among many beautiful illustrations of the mind of Christ. He sees all that His people go through for His sake, and feels for all, from the highest to the lowest. He keeps account of all their losses, crosses, and persecutions. “Are they not all written in His book?” (Psalm. 56:8.) He knows how to come to their hearts with consolation in their time of need, and to speak peace to them when all men seem to hate them. The time when men forsake us is often the very time when Christ draws near, saying, “Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee: yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.” (Isaiah. 41:10.)</p></blockquote>

<blockquote><p>In the next place, let us consider such grounds and reasons as the Scriptures lead us unto, why the Lord in the course of his administration and providence, doth cause such great shakings of Nations before he doth reform and refine his Church, and we shall find these three in special. …

That he may take away the scandal of great sins: The visible Church is like a draw-net, that takes in Fishes good and bad, it so falls out often times, that this Church is filled with gross sins committed and permitted, with blasphemy, swearing cursing, lying stealing, profanation of God’s Ordinances and Sabbaths persecutions of the godly, and all kinds of licentiousness, open sins against the very letter of the Law; and these lived in against the express doctrine which the committers of them know and profess:

Now for these sins the name of the Lord lies under much pollution and dishonour; Heathens and Turks [Muslims] can pull Christians by the sleeve and accuse them for them and wonder why they do things so contrary to their profession: A man would certainly think that wicked men had a dispensation for these sins, or that God himself did not much dislike them, and would never punish them:

Well, the Lord will not always suffer this reproach though he forbear a long time; no (nor never did always in any Nation) he will make blasphemers know at length that he will not hold them guiltless that take his name in vain, and so for the rest. The Land shall mourn for these things at last, Hos. 4.3. He will have it appear that he allows not his to commit such sins; the Lord will have the scandal of sin taken away.</p></blockquote>

</figure><figure class="quote" id="q-aff01ced2f" data-kw="">
<blockquote><p>In case of undue exclusion from Church Ordinances, of such as Christ would not have excluded. Our Lord Jesus hath foretold, that the power of the keys should fall (sometimes) into such hands, as would so diametrically pervert the use of them, as that oft-times none should be excluded, but whom Christ would have admitted; nor admitted, but such as Christ would have shut out.

They shall put You out of their Synagogues, i. e. Excommunicate you: You, my Disciples; you, my Friends. Hard measure! I, but here is comfort; the time is coming, wherein all the Elect shall be Congregated into one universal Assembly, never to suffer exclusion or ejectment any more to all Eternity. And then their unrighteous Excommunicators shall be righteously Excommunicated.

Yea they shall be Excommunicated with the highest sort of Excommunication, (higher than any Church of Christ ever used) Excommunicated for ever; delivered unto Satan, not for the destruction of the flesh only, but to be punished with everlasting destruction from the presence of the Lord, and from the glory of his Power; (when he shall come to be glorified in his Saints): That’s a dreadful Excommunication indeed; the Anathema Maranatha in the highest sense: quum Dominus venit: quia Do∣mino quasi in manus citra veniae spem dedentur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mount Pisgah, or, A prospect of heaven being an exposition on the fourth chapter of the first epistle of St. Paul to the Thessalonians, from the 13th verse, to the end of the chapter, divided into three parts</cite>, (London: Dorman Newman, 1670), pp 117-18.</span></figcaption>

</figure><figure class="quote" id="q-8d342de849" data-kw="">
<blockquote><p>In the first place, we may learn the great importance of ecclesiastical discipline, and of preserving it. in its scriptural purity and primitive vigour. Evangelical and vital religion cannot flourish generally or permanently in any church where this is neglected.

Discipline is to the church of Christ what a wall is to a city, when an enemy has taken the field. It serves the same purpose that a fence does to a garden: if it be broken down, or suffered to fall into disrepair, the boar from the forest, and the wild beast of the field, will enter, and devour all that is beautiful or productive within.

This is a subject which ought to come home with peculiar force to the consciences and feelings of all Christians dwelling in this favoured land. As marks of the true church, the reformers on the continent specified the pure preaching of the word, and administration of the sacraments; but, in addition to these, our reformers of Scotland, in their first Confession of Faith, described “discipline executed according to the word of God, as a certain and infallible sign of the true church.” The establishment of a scriptural and efficient discipline in the church of Scotland, at the very beginning of the Reformation, was her distinguishing glory, on account of which she was lauded and felicitated by foreigners, who desired to possess that blessing, but could not obtain it.

As the want of this ordinance of the church’s Head has produced the most mournful consequences abroad, so to the neglect or perversion of it at home may be ascribed, in a high degree, those corruptions as to faith, worship, and morals which have spread among ourselves, and which, more than once, have threatened to lay waste all our pleasant things. “Purity of doctrine and discipline,” says one of our religious patriots, who “stood in the gap” at a critical period of our ecclesiastical history, “are like the twins of Hippocrates, who always sickened and recovered at the same time, and at last twined and died together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Judgment. Delivered at the opening of the Synod of Original Seceders, Edinburgh, September, 1829 in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

<blockquote><p>In these gross offences the Spirit of God doth not only forsake him in respect of Consolation, but it’s a Command laid upon the Church-Officers, to cast such an one out of their society, as 1 Cor. 5. neither may the people of God have any familiar communion or acquaintance with such: now what horror and trembling may justly arise in such a man’s heart, who shall thus be cast out of all gracious Privileges, and that by God’s appointment?

What darkness must this work in his heart, when he shall argue thus with himself; It’s God’s command I should not be admitted to the Seals of his love; he hath given his Officers charge to pour no oil in my wounds; how can I plead for the grace signified, when he denieth me the Seals thereof? God hath shut me out like the unclean leper, and whither shall I go? Now then, if the Church of God make such a vast difference between him and others, and that following the directions of Christ. Ought not the person offending also to judge the same things about himself?</p></blockquote>

<blockquote><p>Neo. I pray you, sir, proceed to the affirmative part, and tell us what the Lord requires in this commandment.

Evan. The Lord in this commandment requires purity of heart, (1 Thess. 4:5); and he also requires speeches savouring of sobriety and chastity, (Col. 4:6, Gen. 4:1); and he also requires that we keep our eyes from beholding vanity and lustful objects, (Psa. 119:37, Job 31:1); and he also requires that we be temperate in our diet, in our sleep, and in our recreations, (Luke 21:34); and he also requires that we possess our vessels in holiness and honour, (1 Thess. 4:9); and if we have not the gift of chastity, he requires that we take the benefit of holy marriage, (1 Cor. 7:29); and that the man and wife do in that estate render due benevolence each towards the other, (1 Cor. 7:5).</p></blockquote>

<blockquote><p>There have been many heresies before them [the Arians], which, venturing further than they ought, have fallen into folly; but these men by endeavouring in all their cavils to overthrow the Divinity of the Word, have justified the other in comparison of themselves, as approaching nearer to Antichrist. Wherefore they have been excommunicated and anathematized by the Church.

We grieve for their destruction, and especially because, having once been instructed in the doctrines of the Church, they have now sprung away. Yet we are not greatly surprised, for Hymenaeus and Philetus did the same, and before them Judas, who followed the Saviour, but afterwards became a traitor and an apostate.</p></blockquote>

</figure><figure class="quote" id="q-212037016b" data-kw="">
<blockquote><p>Let men and devils curse the bride of Christ, he will bless her. Let her be excommunicate, or cast out of the Church unto the devil’s common, Christ will not affirm, but make void such sentences. In the ninth chapter of John, we read of a poor man born blind, whose eyes Christ had opened upon the Sabbath day, by making a little clay, and putting it upon his eyes. The Jewish Sanhedrin met; and under a very religious pretence of zeal for the Sabbath day, they convene the man before them, who professed Christ, in as far as he knew him; and thereupon they excommunicate him, and cast him out of the church, and held him as a Heathen man and a Publican.

Well, was this sentence bound in heaven? No; so far from that, that ver. 35. when Christ heard they had cast him out (or excommunicated him, as in the margin), Christ seeks him out, and finds him, and manifests himself the more to him, as you may see, ver. 35 — 38.: and, in the 39th verse, he passes a heavy doom and sentence upon them that had cast him out: “For judgement I am come into this world, that they who see not might see, and that they who see (or imagine that they are the only men that see things, or know them in a better light), might be made blind.” Thus Christ will take up and defend his bride, to the confusion of them that do her hurt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wise virgins going forth to meet the bridegroom in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

</figure><figure class="quote" id="q-540660b917" data-kw="">
<blockquote><p>But they are confident that they have invincible objections for excommunicating the calling of princes from the church and from all hope of salvation in citing several passages, badly misunderstood, which they imprudently turn in their favour. First of all, they cite that our Lord Jesus did not order that the woman who was caught in adultery be stoned to death, as the law of God requires. Rather He had mercy on her, saying, “Go and sin no more” (John 8:11).

Before replying, I ask but one question. They say that the ban has replaced the temporal sword in the Christian church, so much so that in place of punishing a crime by death as was formerly done, today we must punish the delinquent by depriving him of the fellowship of believers. Thus I ask them, how do they excuse Jesus Christ for what He has done? For He did not observe their rule. For He neither condemned the woman by banishing her from the fellowship of believers nor condemned her to death. Thereby we already see what poor scatterbrains they are, speaking without reason.

Now I come to the true solution that is quite easy. It is to note that these poor fools in this passage follow that exposition with which the papal priests feather their nests. For since marriage was prohibited them, they wanted as a recompense a licence to commit adultery. Thus they borrowed the wives of their neighbours. Now in order for it not to appear that adultery was such a great sin, they said that we should be under the law of grace of Jesus Christ in anything, they said adulterers should go unpunished.

These poor people, as I have said, follow them. And thus they experience what Jesus Christ said, that “if a blind man leads another, both fall into the pit” (Matt. 15:14; Luke 6:39). …

In sum, the action which our Lord Jesus took toward the adulteress is nothing other than what His servants and ministers of His Word take today toward all malefactors. For they only try to exhort them to repent and to turn around on the right road. Then they comfort their consciences by presenting them with the grace of our Lord Jesus and by assuring them of the remission of sins. They do not attempt to punish them. Such does not belong to them. But they do not stand in the way of justice doing what it must.

In summary, let us understand the office of our Lord Jesus, and we will surmount any difficulties. His office is to forgive sins and to address His Word to the consciences of sinners. To mete out corporal punishments is not His task, but He leaves these to those to whose authority it belongs and to whom the charge has been commissioned, according to what He says in another text: “Render to Caesar the things that are Caesar’s” (Matt. 22:21).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But they are confident that they have invincible objections for excommunicating the calling of princes from the church and from all hope of salvation in citing several passages, badly misunderstood, which they imprudently turn in their favour. First of all, they cite that our Lord Jesus did not order that the woman who was caught in adultery be stoned to death, as the law of God requires. Rather He had mercy on her, saying, “Go and sin no more” (John 8:11).

Before replying, I ask but one question. They say that the ban has replaced the temporal sword in the Christian church, so much so that in place of punishing a crime by death as was formerly done, today we must punish the delinquent by depriving him of the fellowship of believers. Thus I ask them, how do they excuse Jesus Christ for what He has done? For He did not observe their rule. For He neither condemned the woman by banishing her from the fellowship of believers nor condemned her to death. Thereby we already see what poor scatterbrains they are, speaking without reason.

Now I come to the true solution that is quite easy. It is to note that these poor fools in this passage follow that exposition with which the papal priests feather their nests. For since marriage was prohibited them, they wanted as a recompense a licence to commit adultery. Thus they borrowed the wives of their neighbours. Now in order for it not to appear that adultery was such a great sin, they said that we should be under the law of grace of Jesus Christ in anything, they said adulterers should go unpunished.

These poor people, as I have said, follow them. And thus they experience what Jesus Christ said, that “if a blind man leads another, both fall into the pit” (Matt. 15:14; Luke 6:39). …

<blockquote><p>As with all the Reformers, Martin Bucer recognised that care for the poor was part the external observance of true religion and thus fell within the realm of the civil magistrate’s just and legal authority (Isaiah 49:23; 60:1-22). Nowadays, such teaching is caricatured as “socialism” and “statism” by Kuyperians, Libertarians and the devotees of American morality. Such perspectives, however, have little to do with historic Reformed political theology and will only serve provoke the wrath of God against such injustice:

And indeed we must be ashamed and grieve when the right care of the poor has already been restored in very many regions which still serve Antichrist, whereas the very ones who glory in the reception of the gospel and the Kingdom of Christ, although they are not unaware how necessary this practice is, and how much it is a part of the salutary religion of Christ, still fail to reestablish it.</p></blockquote>

</figure><figure class="quote" id="q-9ce77a13e3" data-kw="">
<blockquote><p>Nor was discipline overlooked in the Covenants. This was regarded as an ordinance of God for preserving the purity of the church and for doing good to the soul that was dealt with. And here also it was the hand of the Lord that was looked for, and guidance was sought from the Word of God. The Covenanters saw clearly that there was no authority in Scripture for throwing open membership in the Church to all who chose to claim it. They saw, too, what so many of the modern sects have failed to see at the beginning of their career, but what all have been before long compelled to admit, and what many who have begun by opposing have ended by abusing – that no church can live without discipline. Errors must be extirpated, and offenders must be excluded. Ecclesiastical “malignants, incendiaries, and evil instruments” must be discovered and brought to trial. And what is it that most of all mars the good name of the church in the world now? It is not the dulness of her worship, nor the rigidity of her government, nor the sterness of her doctrine. It is the fact that so many of her members are the veriest hypocrites, and by their actions wholly belie their profession. It is the lack of discipline that most of all gives the adversary occasion to blaspheme. A wholesome, just and impartial church discipline is one of the crying needs of the present day. And the message of the Covenants is an exactly suitable message.</p></blockquote>

<blockquote><p>Neo-Confederate mythology would have us believe that the only people who opposed Southern slavery were Unitarians, Jacobins and infidels. Historical reality is rather different, as the American Covenanters’ debarred slaveholders. Here is an extract from the minutes of the Reformed Presbytery in 1800:

In the Fall of 1800. — A call was made on Mr. McLeod to the pastoral charge of the united congregations of the city of New York and Coldenham. Mr. McLeod demurred to the call, on the ground that there were slaveholders among the subscribers to the call. The subject of slaveholding being now before the Presbytery, it was enacted that no slaveholder should be allowed the communion of the Church.</p></blockquote>

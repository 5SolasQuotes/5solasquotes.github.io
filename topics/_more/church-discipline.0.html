<figure class="quote" id="q-f5f7f2e614" data-kw="">
<blockquote><p>4. But if we were malicious in offending at the ceremonies as things unlawful, and in urging of non-conformity as necessary, should they [the prelates] therefore contemn our being scandalized? Those that would have Titus circumcised, were they not malicious? [Gal. 2:3-5] Did they not urge circumcision as necessary? Held they it not unlawful, not to circumcise Titus? Yet did the apostle abstain, because they were to be scandalized, that is, made worse and more wicked calumniators by the circumcising of Titus, as I have showed (above, ch. 8, section 6); So that albeit we are not to care for the displeasing of men that malitiously and contumaciously urge (as necessary) abstaining from that which is lawful to be done, yet must we care for scandalizing them and making them worse: rather ere that be, we ought to abstain from the use of our liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 45</span></figcaption>

</figure><figure class="quote" id="q-bda28d4fcf" data-kw="">
<blockquote><p>IX. Neither can the indifferency or lawfulness of the thing done, nor the ordinance of authority commanding the use of it, make the scandal following upon it to be only passive [and hence the commanders would be innocent], which otherwise, i.e. in case the thing were neither lawful, nor ordained by authority, should be active. Not the former; for our divines teach (Hemmings., Enchir. Theol., class 3, ch. 17; Magdeburg, Century 1, bk. 2, ch. 4, cols. 448-449) that scandalum datum [scandal given] rises sometimes, ex facto-in se adiaphoro [out of the fact in itself by the thing indifferent] when it is done intempessive, contra charitatis regulam [unseasonably contra the rule of charity]. Not the latter; for no human authority can take away the condition of scandal from that which otherwise should be scandal, because nullum homo potist vel charitati, vel conscientiis nostris imperare, vel periculum scandali d•…ti prestar•…, says a learned casuist (Ames, bk. 5, de Consc., ch. 11, q. 6). . ch. 9, p. 41 ” If this be not taken well from us, let one of our opposites speak for us, who aknowledges that human power cannot make us do that which we cannot do without giving of scandal, and that in this case, the pretext of obedience to superiors shall not excuse us at the hands of the Supreme Judge. (Dr. [John] Forbes, Iren., bk. 2, ch. 20, num. 19)</p></blockquote>

</figure><figure class="quote" id="q-e3be58e389" data-kw="">
<blockquote><p>Thirdly, If an occasional offence of weaker brethren may be a ground for restraining Christian liberty, then much more may commands from lawful authority do it; but the offence of weaker brethren may restrain Christian liberty, as to the exercise of it, as appears by the apostle’s discourse, Rom. 14:21. The reason of the consequence lies here, that a case of mere offence, which is here pleaded towards weak brethren, cannot have that obligation upon conscience which a known duty of obeying lawful authority, in things in themselves lawful, has. Nay further, insisting only on the law of scandal, I would fain know whether it be a greater offence and scandal to Christians’ consciences to infringe the lawful authority of the magistrate and to deny obedience to his commands, in things undetermined by the Law of God, or else to offend the consciences, that is, go against the judgements of some well-meaning, but less-knowing Christians. Or thus, whether in the matter of scandal, it be a greater offence to go against the judgments of the weaker and more ignorant, or the more knowing and able, when the one have only their own weak apprehension to bias them, the other are backed by and grounded upon an established law. And whether it be not a greater scandal to religion to disobey a Christian magistrate than it is to offend some private Christians. Let these things be examined, and then let us see whether the argument will not hold à majori; if the law of scandal as to private Christians may restrain liberty, then may a command from the magistrate do it.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thirdly, If an occasional offence of weaker brethren may be a ground for restraining Christian liberty, then much more may commands from lawful authority do it; but the offence of weaker brethren may restrain Christian liberty, as to the exercise of it, as appears by the apostle’s discourse, Rom. 14:21. The reason of the consequence lies here, that a case of mere offence, which is here pleaded towards weak brethren, cannot have that obligation upon conscience which a known duty of obeying lawful authority, in things in themselves lawful, has. Nay further, insisting only on the law of scandal, I would fain know whether it be a greater offence and scandal to Christians’ consciences to infringe the lawful authority of the magistrate and to deny obedience to his commands, in things undetermined by the Law of God, or else to offend the consciences, that is, go against the judgements of some well-meaning, but less-knowing Christians. Or thus, whether in the matter of scandal, it be a greater offence to go against the judgments of the weaker and more ignorant, or the more knowing and able, when the one have only their own weak apprehension to bias them, the other are backed by and grounded upon an established law. And whether it be not a greater scandal to religion to disobey a Christian magistrate than it is to offend some private Christians. Let these things be examined, and then let us see whether the argument will not hold à majori; if the law of scandal as to private Christians may restrain liberty, then may a command from the magistrate do it.”

— Edward Stillingfleet, Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined, … (London: 1662), pt. 1, ch. 2, pp. 55-56">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+If+an+occasional+offence+of+weaker+brethren+may+be+a+ground+for+restraining+Christian+liberty%2C+then+much+more+may+commands+from+lawful+authority+do+it%3B+but+the+offence+of+weaker+brethren+may+restrain+Christian+liberty%2C+as+to+the+exercise+of+it%2C+as+appears+by+the+apostle%E2%80%99s+discourse%2C+Rom.+14%3A21.+The+reason+of+the+consequence+lies+here%2C+that+a+case+of+mere+offence%2C+which+is+here+pleaded+towards+weak+brethren%2C+cannot+have+that+obligation+upon+conscience+which+a+known+duty+of+obeying+lawful+authority%2C+in+things+in+themselves+lawful%2C+has.+Nay+further%2C+insisting+only+on+the+law+of+scandal%2C+I+would+fain+know+whether+it+be+a+greater+offence+and+scandal+to+Christians%E2%80%99+consciences+to+infringe+the+lawful+authority+of+the+magistrate+and+to+deny+obedience+to+his+commands%2C+in+things+undetermined+by+the+Law+of+God%2C+or+else+to+offend+the+consciences%2C+that+is%2C+go+against+the+judgements+of+some+well-meaning%2C+but+less-knowing+Christians.+Or+thus%2C+whether+in+the+matter+of+scandal%2C+it+be+a+greater+offence+to+go+against+the+judgments+of+the+weaker+and+more+ignorant%2C+or+the+more+knowing+and+able%2C+when+the+one+have+only+their+own+weak+apprehension+to+bias+them%2C+the+other+are+backed+by+and+grounded+upon+an+established+law.+And+whether+it+be+not+a+greater+scandal+to+religion+to+disobey+a+Christian+magistrate+than+it+is+to+offend+some+private+Christians.+Let+these+things+be+examined%2C+and+then+let+us+see+whether+the+argument+will+not+hold+%C3%A0+majori%3B+if+the+law+of+scandal+as+to+private+Christians+may+restrain+liberty%2C+then+may+a+command+from+the+magistrate+do+it.%E2%80%9D%0A%0A%E2%80%94+Edward+Stillingfleet%2C+Irenicum%3A+a+Weapon-Salve+for+the+Church%E2%80%99s+Wounds%2C+or+the+Divine+Right+of+particular+forms+of+Church-Government+Discussed+%26+Examined+according+to+the+principles+of+the+Law+of+Nature%E2%80%A6+%28London%3A+1662%29%2C+pt.+1%2C+ch.+2%2C+pp.+55-56&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe3be58e389.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e3be58e389.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=Thirdly%2C%20If%20an%20occasional%20offence%20of,command%20from%20the%20magistrate%20do%20it&amp;text=Thirdly%2C%20If%20an%20occasional%20offence%20of%20weaker%20brethren&amp;text=may%20a%20command%20from%20the%20magistrate%20do%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9f643623cd" data-kw="">
<blockquote><p>Not just Paul, but the apostles and elders at the synod in Jerusalem, bindingly (Acts 15:28; 16:4) laid some of these beggarly, burdensome ceremonies on the whole regional Church (Acts 15:23, 41; 16:4), as “it seemed good to the Holy Ghost” (Acts 15:28), yet not for the formal reason of service to that law of bondage. Rather, the circumstances made it necessary (Acts 15:28), to prevent the greater scandal of erring (Jewish) unbelievers and weak Christians (who expected the observance of such carnal and false, material ordinances), and for the spread of the Gospel amongst them. In the case of Paul, he had his reasons for keeping the ceremonies in each instance, though they are not always told to us or onlookers. But each time his necessity (Acts 16:1–5; 18:21) was less than ministerial deprivation. Sometimes it was simply to prevent unnecessary conflict.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 30</span></figcaption>

</figure><figure class="quote" id="q-96301fde29" data-kw="">
<blockquote><p>But there is one principle [George] Gillespie’s fore-analyzed rule did not allow him to adequately address.¹ [John] Sprint affirmed the principle of, regarding things not inherently wrong, avoiding the greater hurt and scandal, which is a form of the fundamental natural law of avoiding evil and doing the greatest good attainable. ¹ Gillespie acknowledges “in evils of punishment, we may choose a lesser” (Dispute, pt. 2, ch. 1, p. 10); cf. 2 Sam. 24:10–14. Yet the ethical issues of the permissibility of choosing material evils in justified circumstances go far deeper and wider than being limited to punishments. See Fentiman, ‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ throughout at ‘On Voting’ (RBO) and ‘An Extended Introduction’ at ‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’ (RBO). If God may graciously choose for us the lesser miserable evil, may not we concur (2 Chron. 12:5–8), when He reasons with us to do so (Jer. 27:12–13)?</p></blockquote>

</figure><figure class="quote" id="q-caf43006e7" data-kw="">
<blockquote><p>What leadership virtue are we mistaking bullying for? Which trait is such a priority that we aren’t even aware when it is deployed in an ungodly, and biblically prohibited, way?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/sam-allberry.html">Sam Allberry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How Do Churches End Up with Domineering Bullies for Pastors?’</cite>, (2019) 17 paragrpahs</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>
<div class="actions"><button class="copy" data-copy="“What leadership virtue are we mistaking bullying for? Which trait is such a priority that we aren’t even aware when it is deployed in an ungodly, and biblically prohibited, way?”

— Sam Allberry, ‘How Do Churches End Up with Domineering Bullies for Pastors?’, (2019) 17 paragrpahs">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+leadership+virtue+are+we+mistaking+bullying+for%3F+Which+trait+is+such+a+priority+that+we+aren%E2%80%99t+even+aware+when+it+is+deployed+in+an+ungodly%2C+and+biblically+prohibited%2C+way%3F%E2%80%9D%0A%0A%E2%80%94+Sam+Allberry%2C+%E2%80%98How+Do+Churches+End+Up+with+Domineering+Bullies+for+Pastors%3F%E2%80%99+%282019%29+17+paragrpahs&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcaf43006e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/caf43006e7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=What%20leadership%20virtue%20are%20we%20mistaking,an%20ungodly%2C%20and%20biblically%20prohibited%2C%20way&amp;text=What%20leadership%20virtue%20are%20we%20mistaking%20bullying%20for&amp;text=deployed%20in%20an%20ungodly%2C%20and%20biblically%20prohibited%2C%20way" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-49413ac06b" data-kw="">
<blockquote><p>There is obviously much to be learned from both successful CEOs and also great generals, but both models can quickly become toxic. When either becomes the primary model for Christian leadership, is it any wonder that domineering pastors result? The pastor-as-CEO approach might foster entrepreneurialism and risk-taking, but it easily becomes results-oriented. The pastor-as-general approach might foster perseverance and grit, but it easily becomes task-oriented. One produces swagger: Their word is law because they’re economically indispensable to the church. The other produces presumption: Orders must be followed because the general ‘knows’ what is best for every person. In each case we either tolerate or fail to see traits of bullying, because ministry ends justify ministry means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/sam-allberry.html">Sam Allberry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How Do Churches End Up with Domineering Bullies for Pastors?’</cite>, (2019) 17 paragrpahs</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>
<div class="actions"><button class="copy" data-copy="“There is obviously much to be learned from both successful CEOs and also great generals, but both models can quickly become toxic. When either becomes the primary model for Christian leadership, is it any wonder that domineering pastors result? The pastor-as-CEO approach might foster entrepreneurialism and risk-taking, but it easily becomes results-oriented. The pastor-as-general approach might foster perseverance and grit, but it easily becomes task-oriented. One produces swagger: Their word is law because they’re economically indispensable to the church. The other produces presumption: Orders must be followed because the general ‘knows’ what is best for every person. In each case we either tolerate or fail to see traits of bullying, because ministry ends justify ministry means.”

</figure><figure class="quote" id="q-2c52200069" data-kw="">
<blockquote><p>People who find themselves at odds with a spiritually abusive pastor, will often feel isolated, shamed, ostracized, silenced, and made to feel like they are unsubmissive, insubordinate, and one who undermines the church’s God-given leadership. … Spiritual Abuse Is Often Used to Achieve Godly, Biblical Goals… abuse usually happens because a pastor is desperately trying to control his situation. He wants to control his staff, control the vision, control the direction of the church. Loyalty must be maintained at all costs. Nothing can be allowed to derail the ministry. And when people fall out of line (which tends to happen with human beings) then he cracks the whip… …when the abuse is uncovered, people often refuse to believe it. To allow such a possibility will wreck the tidy world they have built around that spiritual leader. So, the abusive pastor can often provide what seems to be credible ‘explanations’ for everything, while he is backed up by supporters who don’t want to see a successful ministry come to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/michael-j-kruger.html">Michael J. Kruger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What is Spiritual Abuse?’</cite>, (2021) 14 paragraphs</span></figcaption>

</figure><figure class="quote" id="q-4690e89c7e" data-kw="">
<blockquote><p>…the victims of abuse usually don’t speak out for fear of reprisal. They just leave, and the abusive pastor remains. And if the abusive pastor remains, then he gets to control the narrative… But, there is a difference with abusive pastors. The “relational debris field” of an abusive pastor is not only different in regard to volume of conflicts, but the depth of those conflicts. The lives in his wake are genuinely destroyed… On top of this, abusive pastors often have unresolved conflict. They are typically estranged from many… At this point, the leaders of the church just need to do the math. There is a common denominator in all these different conflicts, namely the pastor…. …the pattern of relational wreckage is often not recognized because spiritually abusive pastors don’t abuse everyone. They are selective in who they treat this way. In fact, there are other people whom the abusive pastor treats remarkably well. In other words, abusive pastors almost always have two sides. One side is domineering, heavy-handed and threatening. The other side is charming, gracious, and even flattering. The tragic implications of this reality is that abusive pastors will almost always have avid defenders who insist that this pastor is the greatest guy in the world. And, to them, that pastor probably has been great. And such defenders will inevitably use the same logic: “He’s never treated me this way.” In other words, they form their judgment entirely on their personal experience… not everyone is in a position to see this track record.</p></blockquote>

rd+of+Broken+Relationships%E2%80%99+%282021%29+22+paragraphs&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4690e89c7e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4690e89c7e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=the%20victims%20of%20abuse%20usually%20don%E2%80%99t,position%20to%20see%20this%20track%20record&amp;text=the%20victims%20of%20abuse%20usually%20don%E2%80%99t%20speak%20out&amp;text=in%20a%20position%20to%20see%20this%20track%20record" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-69e13bf0f0" data-kw="">
<blockquote><p>The chief desire of abusive individuals and organizations is to attain or retain power… abusive pastors often create an entire church culture that perpetually affirms and protects their authority—a culture designed to shield them from criticism, and punish anyone who dares challenge them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/michael-j-kruger.html">Michael J. Kruger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Key Signs of An Abusive Pastor #2: Hyper Defensive About Their Own Authority’</cite>, (2021) 18 paragraphs</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>
<div class="actions"><button class="copy" data-copy="“The chief desire of abusive individuals and organizations is to attain or retain power… abusive pastors often create an entire church culture that perpetually affirms and protects their authority—a culture designed to shield them from criticism, and punish anyone who dares challenge them.”

— Michael J. Kruger, ‘Key Signs of An Abusive Pastor #2: Hyper Defensive About Their Own Authority’, (2021) 18 paragraphs">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+chief+desire+of+abusive+individuals+and+organizations+is+to+attain+or+retain+power%E2%80%A6+abusive+pastors+often+create+an+entire+church+culture+that+perpetually+affirms+and+protects+their+authority%E2%80%94a+culture+designed+to+shield+them+from+criticism%2C+and+punish+anyone+who+dares+challenge+them.%E2%80%9D%0A%0A%E2%80%94+Michael+J.+Kruger%2C+%E2%80%98Key+Signs+of+An+Abusive+Pastor+%232%3A+Hyper+Defensive+About+Their+Own+Authority%E2%80%99+%282021%29+18+paragraphs&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69e13bf0f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69e13bf0f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=The%20chief%20desire%20of%20abusive%20individuals,punish%20anyone%20who%20dares%20challenge%20them&amp;text=The%20chief%20desire%20of%20abusive%20individuals%20and%20organizations&amp;text=criticism%2C%20and%20punish%20anyone%20who%20dares%20challenge%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d312505452" data-kw="">
<blockquote><p>A clear indicator of shunning is that the evidence of the ‘sins’ of the shunned person will be thin. Instead, insinuations will be made about a person’s character and rarely will there be something concrete. If there is, it won’t rise to the level of a chargeable offense, although the leadership may greatly exaggerate it. The ‘sin’ actually consists of disagreement with the leadership… Shunning at its root is a ‘good riddance.’ It is to discard someone. The coldness of it will be evident over time with repetition of occurrences. Rather than the love which ‘always hopes,’ there is a sentiment more like, ‘you have to be willing to pull the trigger.’… …with shunning, often there will be no church discipline involved; a process demanding the rigor of due process, true shepherding, time, and layers of accountability due to the gravity of what is at stake… the leadership simply communicates to the church in various ways that certain people are to be totally avoided because they pose a ‘danger’ to the church. People disappear with little discussion or invitation for questions, except for insinuation about them… First, those who are perceived as a ‘threat’ to power and control of the spiritually abusive leadership are marked… It may take place in the context of a controversy where leadership is domineering and anyone who questions is therefore marked… Second, the abusive leadership moves to push out the perceived threat… It can be as simple as a cold shoulder: the person receives nonverbal cues that they are not wanted by the leadership. Exclusion may be accomplished by veiled references with criticisms from the pulpit where the victim and others know who is being described… Pastoral knowledge of their lives or weaknesses may be marshaled against them abusively… Victims may find themselves berated, facing tremendous anger and rage designed to cow them into submission… the collective power of a body of complicit leaders may convince them that the problem is indeed themselves. This may be the worst scenario, as the victim finds himself under the terror of condemnation, believing that the anger he is receiving is the anger of God… The psychological toll is terrible. But this tactic is effective: such persons are neutralized as a ‘threat’… Third, in order to minimize any potential damage to the leadership’s reputation and maintain control, individuals must be discredited. Here is where the real work must be done upon a congregation to get them on board. Those who have been marked and excluded continue to pose a threat because they may speak with persons in the congregation. The more godly and mature the excluded person is, the more intently the leadership will have to work to discredit them. This results in demonization. The words of the Pharisees whose control was challenged by the formerly blind man are pertinent: “You were born in utter sin, and would you teach us?” And they cast him out (John 9:34)… Full Shunning… It takes place incrementally, with exhortations of ‘protecting the flock from dangerous people,’… ‘exerting tough love toward unrepentant people,’ and ‘not allowing Satan a foothold’ at the forefront. These are convincing themes for biblical Christians who trust their leaders. Although there may be no formal discipline, the character of the person is so slandered that others conclude they have reason to withdraw from them, and even a moral obligation… The pulpit, private conversations, committee meetings, and public prayers become useful for insinuations… …the pattern will easily be replicated and expanded. The leader therefore begins with strong pressure on the other leaders to do this. Other involved members will pick up on the practice as it is now reinforced from multiple people. Once the principles are inculcated with a core, it will spread. It becomes a powerful tool for control as well as instilling fear of disagreeing and being among ‘those compromised people’ whose eternal destiny is called into question. When it is leaders who step out of line and are excluded, they will quickly be erased… Long standing close relationships are ruptured… The closer the remaining individuals are to the core leadership, the more severe the pressure will be. Victims multiply. In biblically orthodox contexts, often at the root of abusive leadership and shunning is the sort of self-idolatry commonly described as narcissism. This takes the shape again and again of a charismatic figure, compelling in his leadership, capable in his use of scripture, remarkably gifted in different ways, yet underneath gripped by sins of great spiritual pride and need for control. He labors to hide these from all people and especially from himself with ministerial activity and forms of piety. He views himself as fundamentally different and above others and unable to begin to consider the possibility of something being so wrong within. This leaves him with great insecurity and unable to receive criticism or be questioned in his judgment. He excels in gathering others around him by flattery to serve as supporters, training and convincing them of his ways, but will swiftly crush them if he detects disloyalty… If you have concerns that such tendencies may be present in your church, read further resources on the topic and seek objective counsel and prayer from other Christians outside of your church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/steven-light.html">Steven Light</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Unmasking Abusive Spiritual Leadership Part I: Shunning’</cite>, (2023) 23 paragraphs at Aquila Report</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

se eternal destiny is called into question. When it is leaders who step out of line and are excluded, they will quickly be erased… Long standing close relationships are ruptured… The closer the remaining individuals are to the core leadership, the more severe the pressure will be. Victims multiply. In biblically orthodox contexts, often at the root of abusive leadership and shunning is the sort of self-idolatry commonly described as narcissism. This takes the shape again and again of a charismatic figure, compelling in his leadership, capable in his use of scripture, remarkably gifted in different ways, yet underneath gripped by sins of great spiritual pride and need for control. He labors to hide these from all people and especially from himself with ministerial activity and forms of piety. He views himself as fundamentally different and above others and unable to begin to consider the possibility of something being so wrong within. This leaves him with great insecurity and unable to receive criticism or be questioned in his judgment. He excels in gathering others around him by flattery to serve as supporters, training and convincing them of his ways, but will swiftly crush them if he detects disloyalty… If you have concerns that such tendencies may be present in your church, read further resources on the topic and seek objective counsel and prayer from other Christians outside of your church.”

— Steven Light, ‘Unmasking Abusive Spiritual Leadership Part I: Shunning’, (2023) 23 paragraphs at Aquila Report">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+clear+indicator+of+shunning+is+that+the+evidence+of+the+%E2%80%98sins%E2%80%99+of+the+shunned+person+will+be+thin.+Instead%2C+insinuations+will+be+made+about+a+person%E2%80%99s+character+and+rarely+will+there+be+something+concrete.+If+there+is%2C+it+won%E2%80%99t+rise+to+the+level+of+a+chargeable+offense%2C+although+the+leadership+may+greatly+exaggerate+it.+The+%E2%80%98sin%E2%80%99+actually+consists+of+disagreement+with+the+leadership%E2%80%A6+Shunning+at+its+root+is+a+%E2%80%98good+riddance.%E2%80%99+It+is+to+discard+someone.+The+coldness+of+it+will+be+evident+over+time+with+repetition+of+occurrences.+Rather+than+the+love+which+%E2%80%98always+hopes%2C%E2%80%99+there+is+a+sentiment+more+like%2C+%E2%80%98you+have+to+be+willing+to+pull+the+trigger.%E2%80%99%E2%80%A6+%E2%80%A6with+shunning%2C+often+there+will+be+no+church+discipline+involved%3B+a+process+demanding+the+rigor+of+due+process%2C+true+shepherding%2C+time%2C+and+layers+of+accountability+due+to+the+gravity+of+what+is+at+stake%E2%80%A6+the+leadership+simply+communicates+to+the+church+in+various+ways+that+certain+people+are+to+be+totally+avoided+because+they+pose+a+%E2%80%98danger%E2%80%99+to+the+church.+People+disappear+with+little+discussion+or+invitation+for+questions%2C+except+for+insinuation+about+them%E2%80%A6+First%2C+those+who+are+perceived+as+a+%E2%80%98threat%E2%80%99+to+power+and+control+of+the+spiritually+abusive+leadership+are+marked%E2%80%A6+It+may+take+place+in+the+context+of+a+controversy+where+leadership+is+domineering+and+anyone+who+questions+is+therefore+marked%E2%80%A6+Second%2C+the+abusive+leadership+moves+to+push+out+the+perceived+threat%E2%80%A6+It+can+be+as+simple+as+a+cold+shoulder%3A+the+person+receives+nonverbal+cues+that+they+are+not+wanted+by+the+leadership.+Exclusion+may+be+accomplished+by+veiled+references+with+criticisms+from+the+pulpit+where+the+victim+and+others+know+who+is+being+described%E2%80%A6+Pastoral+knowledge+of+their+lives+or+weaknesses+may+be+marshaled+against+them+abusively%E2%80%A6+Victims+may+find+themselves+berated%2C+facing+tremendous+anger+and+rage+designed+to+cow+them+into+submission%E2%80%A6+the+collective+power+of+a+body+of+complicit+leaders+may+convince+them+that+the+problem+is+indeed+themselves.+This+may+be+the+worst+scenario%2C+as+the+victim+finds+himself+under+the+terror+of+condemnation%2C+believing+that+the+anger+he+is+receiving+is+the+anger+of+God%E2%80%A6+The+psychological+toll+is+terrible.+But+this+tactic+is+effective%3A+such+persons+are+neutralized+as+a+%E2%80%98threat%E2%80%99%E2%80%A6+Third%2C+in+order+to+minimize+any+potential+damage+to+the+leadership%E2%80%99s+reputation+and+maintain+control%2C+individuals+must+be+discredited.+Here+is+where+the+real+work+must+be+done+upon+a+congregation+to+get+them+on+board.+Those+who+have+been+marked+and+excluded+continue+to+pose+a+threat+because+they+may+speak+with+persons+in+the+congregation.+The+more+godly+and+mature+the+excluded+person+is%2C+the+more+intently+the+leadership+will+have+to+work+to+discredit+them.+This+results+in+demonization.+The+words+of+the+Pharisees+whose+control+was+challenged+by+the+formerly+blind+man+are+pertinent%3A+%E2%80%9CYou+were+born+in+utter+sin%2C+and+would+you+teach+us%3F%E2%80%9D+And+they+cast+him+out+%28John+9%3A34%29%E2%80%A6+Full+Shunning%E2%80%A6+It+takes+place+incrementally%2C+with+exhortations+of+%E2%80%98protecting+the+flock+from+dangerous+people%2C%E2%80%99%E2%80%A6+%E2%80%98exerting+tough+love+toward+unrepentant+people%2C%E2%80%99+and+%E2%80%98not+allowing+Satan+a+foothold%E2%80%99+at+the+forefront.+These+are+convincing+themes+for+biblical+Christians+who+trust+their+leaders.+Although+there+may+be+no+formal+discipline%2C+the+character+of+the+person+is+so+slandered+that+others+conclude+they+have+reason+to+withdraw+from+them%2C+and+even+a+moral+obligation%E2%80%A6+The+pulpit%2C+private+conversations%2C+committee+meetings%2C+and+public+prayers+become+useful+for+insinuations%E2%80%A6+%E2%80%A6the+pattern+will+easily+be+replicated+and+expanded.+The+leader+therefore+begins+with+strong+pressure+on+the+other+leaders+to+do+this.+Other+involved+members+will+pick+up+on+the+practice+as+it+is+now+reinforced+from+multiple+people.+Once+the+principles+are+inculcated+with+a+core%2C+it+will+spread.+It+becomes+a+powerful+tool+for+control+as+well+as+instilling+fear+of+disagreeing+and+being+among+%E2%80%98those+compromised+people%E2%80%99+whose+eternal+destiny+is+called+into+question.+When+it+is+leaders+who+step+out+of+line+and+are+excluded%2C+they+will+quickly+be+erased%E2%80%A6+Long+standing+close+relationships+are+ruptured%E2%80%A6+The+closer+the+remaining+individuals+are+to+the+core+leadership%2C+the+more+severe+the+pressure+will+be.+Victims+multiply.+In+biblically+orthodox+contexts%2C+often+at+the+root+of+abusive+leadership+and+shunning+is+the+sort+of+self-idolatry+commonly+described+as+narcissism.+This+takes+the+shape+again+and+again+of+a+charismatic+figure%2C+compelling+in+his+leadership%2C+capable+in+his+use+of+scripture%2C+remarkably+gifted+in+different+ways%2C+yet+underneath+gripped+by+sins+of+great+spiritual+pride+and+need+for+control.+He+labors+to+hide+these+from+all+people+and+especially+from+himself+with+ministerial+activity+and+forms+of+piety.+He+views+himself+as+fundamentally+different+and+above+others+and+unable+to+begin+to+consider+the+possibility+of+something+being+so+wrong+within.+This+leaves+him+with+great+insecurity+and+unable+to+receive+criticism+or+be+questioned+in+his+judgment.+He+excels+in+gathering+others+around+him+by+flattery+to+serve+as+supporters%2C+training+and+convincing+them+of+his+ways%2C+but+will+swiftly+crush+them+if+he+detects+disloyalty%E2%80%A6+If+you+have+concerns+that+such+tendencies+may+be+present+in+your+church%2C+read+further+resources+on+the+topic+and+seek+objective+counsel+and+prayer+from+other+Christians+outside+of+your+church.%E2%80%9D%0A%0A%E2%80%94+Steven+Light%2C+%E2%80%98Unmasking+Abusive+Spiritual+Leadership+Part+I%3A+Shunning%E2%80%99+%282023%29+23+paragraphs+at+Aquila+Report&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd312505452.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d312505452.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spiritual-abuse/#:~:text=A%20clear%20indicator%20of%20shunning%20is,other%20Christians%20outside%20of%20your%20church&amp;text=A%20clear%20indicator%20of%20shunning%20is%20that%20the&amp;text=prayer%20from%20other%20Christians%20outside%20of%20your%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Jesus [in Mt. 18] is not addressing public sins or scandalous matters that the whole church would already be aware of. If that were the case, gross and explicit sins would then be drug into secrecy, to be resolved in secret. May it never be! And yet, sadly, it often is. The church frequently colludes to protect the group, and scandalous sin is quickly covered up and dealt with secretly… Jesus addresses public persons publicly. Recall his scathing condemnation of Herod (Luke 13:32), or his many public “woes” (i.e. “curses”) pronounced upon the pharisees (cf. Matt 23:13-39). We can almost hear the modern Christian retort: “Yes, Jesus, but did you confront all of them privately first?!… Matthew 18 is not speaking of abusers and oppressors. Jesus is speaking of “brothers”, not wolves. Would we ask Christ’s most tender and trodden upon lambs to go alone, and speak alone, with her predator before we can properly confront his sin?! Again, may it never be!</p></blockquote>

<blockquote><p>Some Imperious Presbyterians are known for high-handed and arbitrary uses of church discipline. What is the status of a congregation that doles out ecclesiastical discipline in a tyrannical manner? Such an assembly is unhealthy or corrupt, regardless of whether it has an outward form of Presbyterian polity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/kevin-reed.html">Kevin Reed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Imperious Presbyterianism</cite>, (Unicoi, TN: Trinity Foundation, 2008), p. 18</span></figcaption>

<blockquote><p>What are the sins forbidden in the eighth commandment? The sins forbidden in the eighth commandment, besides the neglect of the duties required, are, theft, robbery, man-stealing, and receiving anything that is stolen; fraudulent dealing, false weights and measures, removing landmarks, injustice and unfaithfulness in contracts between man and man, or in matters of trust; oppression, extortion, usury, bribery, vexatious lawsuits, unjust enclosures and depredation; engrossing commodities to enhance the price; unlawful callings, and all other unjust or sinful ways of taking or withholding from our neighbor what belongs to him, or of enriching ourselves; covetousness; inordinate prizing and affecting worldly goods; distrustful and distracting cares and studies in getting, keeping, and using them; envying at the prosperity of others; as likewise idleness, prodigality, wasteful gaming; and all other ways whereby we do unduly prejudice our own outward estate, and defrauding ourselves of the due use and comfort of that estate which God hath given us.</p></blockquote>

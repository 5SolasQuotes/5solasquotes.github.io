tflow+and+inflow%2C+we+cannot+predicate+these+things+of+anything+that+is+incorporeal.%E2%80%9D120+The+most+striking+analogy+of+divine+generation+is+thought+and+speech%2C+and+Scripture+itself+suggests+this+when+it+calls+the+Son+%E2%80%9CLogos%E2%80%9D+%5BSpeech%2C+Word%2C+Reason%5D.+Just+as+the+human+mind+objectivizes+itself+in+speech%2C+so+God+expresses+his+entire+being+in+the+Logos+%5BChrist%5D.+But+here%2C+too%2C+we+must+note+the+difference.+Humans+need+many+words+to+express+their+ideas.+These+words+are+sounds+and+therefore+material%2C+sense-related.+They+have+no+existence+by+themselves.+But+when+God+speaks%2C+he+totally+expresses+himself+in+the+one+person+of+the+Logos%2C+whom+he+also+%E2%80%9Cgranted+to+have+life+in+himself%E2%80%9D+%28John+5%3A26+NIV%29.+In+the+second+place%2C+therefore%2C+divine+generation+implies+that+the+Father+begets+the+Son+out+of+the+being+of+the+Father%2C+%E2%80%9CGod+of+God%2C+Light+of+Light%2C+very+God+of+very+God%3B+begotten%2C+not+made%2C+being+of+one+substance+with+the+Father%2C%E2%80%9D+as+the+Nicene+symbol+has+it.+The+Arians%2C+by+contrast%2C+contended+that+the+Son+had+been+brought+forth+by+the+will+of+the+Father+out+of+nothing.+This%2C+however%2C+is+not+generation+but+creation%2C+as+John+of+Damascus+points+out.+Creation+is+%E2%80%9Cthe+bringing+into+being%2C+from+the+outside+and+not+from+the+substance+of+the+Creator%2C+of+something+created+and+made+entirely+dissimilar+%5Bin+substance%5D%2C%E2%80%9D+while+%E2%80%9Cbegetting%E2%80%9D+means+%E2%80%9Cproducing+of+the+substance+of+the+begetter+an+offspring+similar+in+substance+to+the+begetter.%E2%80%9D+The+Son+is+not+a+creature+but+he+is+%E2%80%9CGod+over+all%2C+forever+praised%21%E2%80%9D+%28Rom.+9%3A5+NIV%29.+Accordingly%2C+he+was+not+brought+forth+by+the+will+of+the+Father+out+of+nothing+and+in+time.+Rather%2C+he+is+generated+out+of+the+being+of+the+Father+in+eternity.+Hence%2C+instead+of+viewing+%E2%80%9Cgeneration%E2%80%9D+as+an+actual+work%2C+a+performance+%28%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%CE%B5%CE%B9%CE%B1%29%2C+of+the+Father%2C+we+should+ascribe+to+the+Father+%E2%80%9Ca+generative+nature%E2%80%9D+%28%CF%86%CF%85%CF%83%CE%B9%CF%82+%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%84%CE%B9%CE%BA%CE%B7%29.+This+is+not+to+say%2C+of+course%2C+that+the+generation+is+an+unconscious+and+unwilled+emanation%2C+occurring+apart+from+the+will+and+power+of+the+Father.+It+is+not+an+act+of+an+antecedent+decreeing+will%2C+like+creation%2C+but+one+that+is+so+divinely+natural+to+the+Father+that+his+concomitant+will+takes+perfect+delight+in+it.+It+is+a+manifestation+of+what+is+truly+expressive+of+his+nature+and+essence%2C+and+therefore+also+of+his+knowledge%2C+will%2C+and+power%2C+in+fact+of+all+his+virtues.+In+the+third+place%2C+therefore%2C+the+church+confesses+its+belief+in+the+eternal+character+of+this+generation.+The+Arians+said+that+there+was+a+time+when+the+Son+did+not+exist+%28%E1%BC%A0%CE%BD+%CF%80%CE%BF%CF%84%CE%B5+%E1%BD%81%CF%84%CE%B5+%CE%BF%E1%BD%90%CE%BA+%E1%BC%A0%CE%BD%29.+They+appealed+especially+to+the+words+%E2%80%9Che+brought+me+forth%2C%E2%80%9D+or+%E2%80%9Ccreated+me%E2%80%9D+in+Proverbs+8%3A22%2C+and+pointed+out+the+antinomy+between+the+terms+%E2%80%9Ceternal%E2%80%9D+%28%CE%B1%E1%BC%B0%CF%89%CE%BD%CE%BF%CF%82%29+and+%E2%80%9Cbegetting%E2%80%9D+%28%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%83%CE%B9%CF%82%29.+But+if+the+%E2%80%9CFather%E2%80%9D+and+the+%E2%80%9CSon%E2%80%9D+bear+their+names+in+a+metaphysical+sense%2C+as+Scripture+incontrovertibly+teaches%2C+it+follows+that+the+generation+in+question+has+to+be+eternal+as+well.+For+if+the+Son+is+not+eternal%2C+then+of+course+God+is+not+the+eternal+Father+either.+In+that+case+he+was+God+before+he+was+Father%2C+and+only+later%E2%80%94in+time%E2%80%94became+Father.+Hence%2C+rejection+of+the+eternal+generation+of+the+Son+involves+not+only+a+failure+to+do+justice+to+the+deity+of+the+Son%2C+but+also+to+that+of+the+Father.+It+makes+him+changeable%2C+robs+him+of+his+divine+nature%2C+deprives+him+of+the+eternity+of+his+fatherhood%2C+and+leaves+unexplained+how+God+can+truly+and+properly+be+called+%E2%80%9CFather%E2%80%9D+in+time+if+the+basis+for+calling+him+%E2%80%9CFather%E2%80%9D+is+not+eternally+present+in+his+nature.+We+must%2C+accordingly%2C+conceive+that+generation+as+being+eternal+in+the+true+sense+of+the+word.+It+is+not+something+that+was+completed+and+finished+at+some+point+in+eternity%2C+but+an+eternal+unchanging+act+of+God%2C+at+once+always+complete+and+eternally+ongoing.+Just+as+it+is+natural+for+the+sun+to+shine+and+for+a+spring+to+pour+out+water%2C+so+it+is+natural+for+the+Father+to+generate+the+Son.+The+Father+is+not+and+never+was+ungenerative%3B+he+begets+everlastingly.+%E2%80%9CThe+Father+did+not+by+a+single+act+beget+the+Son+and+then+release+him+from+his+%E2%80%98genesis%2C%E2%80%99+but+generates+him+perpetually.%E2%80%9D+For+God+to+beget+is+to+speak%2C+and+his+speaking+is+eternal.+God%E2%80%99s+offspring+is+eternal.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+transl.+John+Bolt%2C+and+John+Vriend+%28Grand+Rapids%2C+MI%3A+Baker+Academic%2C+2004%29%2C+2.308%E2%80%93310.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb6cb6008b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb6cb6008b.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/08/bavinck-on-eternal-generation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-8f063fc02f" data-kw="">
<blockquote><p>For the letter (i.e. the law) killeth, but the spirit (i.e. the gospel) giveth life. This is the reason why God hath made Paul the minister of the spirit. ‘God had made us able ministers not of the law but of the gospel, for the law kills, but the gospel gives life.’ This passage and the following context present two important questions. First, in what sense does the law kill? And second, How is it that the apostle attributes to the Mosaic system this purely legal character, when he elsewhere so plainly teaches that the gospel was witnessed or taught both in the law and the prophets? As to the former of these questions, the answer furnished by the Scriptures is plain. The law demands perfect obedience. It says, “Do this and live,” Rom. 10:5; Gal. 3:12, and “Cursed is every one who continueth not in all things written in the book of the law to do them,” Gal. 3:10. As no man renders this perfect obedience, the law condemns him. It pronounces on him the sentence of death. This is one way in which it kills. In the second place, it produces the knowledge or consciousness of sin, and of course of guilt, that is, of just exposure to the wrath of God. Thus again it slays. And thirdly, by presenting the perfect standard of duty, which cannot be seen without awakening the sense of obligation to be conformed to it, while it imparts no disposition or power to obey, it exasperates the soul and thus again it brings forth fruit unto death. All these effects of the law are systematically presented by the apostle in the 6th and 7th chapters of his epistle to the Romans, and in the 3d chapter of the epistle to the Galatians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, (New York: A. C. Armstrong &amp; Son, 1891), 56.</span></figcaption>

</figure><figure class="quote" id="q-ab89a2523d" data-kw="">
<blockquote><p>Those who so cry up the Spirit as to cry down ordinances and the ministry do not have the Spirit of God. In the NT, when vision and inspiration were in use, the Spirit did not teach men immediately, but referred them to an outward ministry. A famous instance you have hereof in the Ethiopian eunuch who, reading in his chariot the prophecy of Isaiah, the Spirit did not interpret to him the meaning hereof but bid Philip go and expound it. So, when Christ revealed himself to Paul, He did not teach him Himself, but bid him go to Damascus and there it should be told him what he should do. We have the like example in Cornelius. The Spirit did not teach him immediate, but bid him send for Peter, and he should tell him what he ought to do. By these examples we see how the Lord has honored the ministry. And, therefore, those who cry up the Spirit so as to cry down the ministry, as expecting to have the immediate teaching of the Spirit, doubtless have not the Spirit of God. . . . Those who pretend to the Spirit, and yet boast of the effects of the Spirit, in future revelations rather than in present motions to holy duties, are deceived by a satanic delusion. There are many in these days who will take upon them to tell you future contingent events, but this can be nothing else but a delusion of the devil, because the gifts of the Spirit in foretelling future events is now ceased and does not remain the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The works of Christoper Love</cite>, 1, 115-116.</span></figcaption>

</figure><figure class="quote" id="q-c9ff42a636" data-kw="">
<blockquote><p>At the same time, as he works not effectually in all, but only where the Spirit, the inward teacher, illuminates the heart, he subjoins, to every one who believes. The gospel is indeed offered to all for their salvation but the power of it appears not everywhere: and that it is the savor of death to the ungodly, does not proceed from what it is, but from their own wickedness. By setting forth but one salvation he cuts off every other trust. When men withdraw themselves from this one salvation, they find in the gospel a sure proof their own ruin. Since then the gospel invites all to partake of salvation without any difference, it is rightly called the doctrine of salvation: for Christ is there offered, whose peculiar office is to save that which was lost; and those who refuse to be saved by him, shall find him a judge. But everywhere in Scripture the word salvation is simply set in opposition to the word destruction: and hence we must observe, when it is mentioned, what the subject of the discourse is. Since then the gospel delivers from ruin and the curse of endless death, its salvation is eternal life.</p></blockquote>

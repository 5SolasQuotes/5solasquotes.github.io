<blockquote><p>Q. What is God?

A. He is a Spirit, having his being of himself.

Expos. 9. God is a spiritual, invisible, and immaterial substance. 1. Tim. 1. 17. Luk. 24. 39.

10. God is without beginning, Psal. 90. 2. and 93. 2. Esa. 43. 10. and 44. 6. and without cause, Apoc. 1. 8. Esa. 41. 4. and 43. 10. and 48. 12. and so he is without composition, infinite, Psa. 147. 5. &amp; 145. 3. Exod. 3. 14. eternal, Prov. 8. 22, 23. Rom. 16. 26. incomprehensible, Exod. 33. 22. 23. 1. Tim. 6. 16. 1. Kin. 8. 27. Esa. 66. 1. and unchangeable, Jam. 1. 17. Mal. 3. 6.

Q. How many Gods be there?

A. Only one God and three Persons, the Father, Son, and Holy Ghost.

Expos. 11. There can be but one Omnipotent, Dan. 4. 35. infinite, eternal, most perfect first cause, and director of all things; all things are referred to one first, Rom. 11. 35. Apocal. 1. 8. and 4. 11.

12. A person generally taken, is one entire substance, not common to many, endued with life and understanding, will, and power. A person in the Godhead, is the Godhead restrained, or distinguished by his personal property. Joh. 14. 16. and 15. 1. The whole divine nature being indivisible, 1. Cor. 8. 6. is common to all three persons, Father, Son, and Holy Ghost. Act. 4. 24. 2. Cor. 1. 3. Joh. 1. 1. Rom. 9. 5. Heb. 1. 8. Numb. 12. 6. 7. with Act. 1. 16. 1. Pet. 1. 11. Heb. 1. 1. Act. 4. 25. with 2. Pet. 1. 21. and therefore whatsoever doth absolutely agree to the divine nature, or is spoken of the divine nature by relation unto the creatures, that doth agree likewise to every person in Trinity. Joh. 1. 1. Prov. 8. 22. Apoc. 1. 8. Matth. 18. 20. Joh. 3. 13. Job 26. 13. and 33. 4. Joh. 14. 26. Luk. 1. 35. Every person in Trinity, is equal in glory and eternity. Joh. 10. 30. Joh. 17. 5. Phil. 2. 6. Eph. 1. 17. with Joh. 12. 41. and there is a most near communion and union between them, by which each one is in the rest, and with the rest. Joh. 14. 10. 11. Io. 1. 1. and every one doth possess, love, and glorify each other. Prov. 8. 22. 30. v. Joh. 17. 5. working the same things. Joh. 5. 19. But the Godhead considered with the personal property of begetting, is the Father, &amp;c.

Q. What is the property of the Father?

A. To be of himself, and to beget his Son.

Expos. 13. The divine nature doth neither beget, nor is begotten: but the Father doth beget his Son by an eternal and necessary communication of his essence, wholly and indivisibly to his Son, which yet he wholly retaineth in himself. Joh. 1. 1. Pro. 8. 22, 23.

Q. What is the property of the Son?

A. To be begotten of the Father.

Q. What is the property of the Holy Ghost?

A. To proceed from the Father, and the Son.</p></blockquote>

<blockquote><p>To all the three persons in the Trinity prayer is due. That it is so to the Father, nobody doubts. That it is due to Christ, the Son, appears from Stephen’s calling upon him in his last moments, and saying, “Lord Jesus, receive my spirit,” Acts vii. 59.

Even Christ the Mediator is to be worshipped, though his divine nature is the reason why he is worshipped, Heb. i. 6, “And let all the angels of God worship him.” The Holy Ghost also is to be worshipped, as appears from the apostolical benediction, 2 Cor. xiii. 14, “The communion of the Holy Ghost be with you all.”

In respect of the object of worship, people would do well to satisfy themselves, in their addresses to God, with the belief of the Trinity of persons in the Godhead, who are but one object of worship, and not think to comprehend God, but to make use of the names and titles he has taken to himself in the word. Beware of imaginations of God or the three persons, and of dividing the object of worship, as if praying to the Father, you did not also pray to the Son and the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses on Prayer</cite>, (1727) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 9-10.</span></figcaption>

<blockquote><p>By confused and involved expressions the heretics very frequently elude the truth and secure the ears of the unwary by the mere sound of common words, such as the titles Father and Son, which they do not truthfully utter to express a natural and genuine community of essence: for they are aware that God is called the Father of all creation, and remember that all the saints are named sons of God.

In like manner they declare that the relationship between the Father and the Son resembles that between the Father and the universe, so that the names Father and Son are rather titular than real. For the names are titular if the Persons have a distinct nature of a different essence, since no reality can be attached to the name of father unless it be based on the nature of his offspring. So the Father cannot be called Father of an alien substance unlike His own, for a perfect birth manifests no diversity between itself and the original substance.

Therefore we repudiate all the impious assertions that the Father is Father of a Son begotten of Himself and yet not of His own nature. We shall not call God Father for having a creature like Him in might and activity, but for begetting a nature of an essence not unlike or alien to Himself: for a natural birth does not admit of any dissimilarity with the Father’s nature.

Therefore those are anathema who assert that the Father is Father of a nature unlike Himself, so that something other than God is born of God, and who suppose that the essence of the Father degenerated in begetting the Son. For so far as in them lies they destroy the very birthless and changeless essence of the Father by daring to attribute to Him in the birth of His Only-begotten an alteration and degeneration of His natural essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 20 in Nicene and Post-Nicene Fathers 2, 9: 9.</span></figcaption>

<blockquote><p>God. This refers to one eternal, infinite, unchangeable, spiritual being who is distinguished in three separate persons: Father, Son, and Holy Ghost. Deuteronomy 6:4 says, “Hear, O Israel, the LORD our God is one LORD.” “There is one God, and one mediator,” says 1 Timothy 2:5. But Isaiah 61:1 refers to God as more than one person, saying, “The Spirit of the Lord GOD is upon me, because the LORD hath anointed me.” One person anoints, another is being anointed, and the object of the anointing is still another person. One person of the Godhead prays, He prays to another person, and still another person is sent; yet there is only one God. Therefore, we apply the word God to the Father, the Son, and the Holy Spirit.</p></blockquote>

</figure><figure class="quote" id="q-c5ec5c7477" data-kw="">
<blockquote><p>The grand heresy, which might be said to have overspread the church for many centuries, was in substance this,—that the salvation of sinful men, in so far as they might need salvation, was to be ascribed, not to the one true God, the Father, the Son, and the Holy Ghost, but to men themselves and to what they could do, or to what could be done for them by their fellow-men and other creatures. This, more or less fully developed, was the great heresy which lay under the whole elaborate externalism of the mediaeval and Romish religion. Almost everything that is distinctive, either in the specific tenets and practices, or in the more general features and tendencies, of the full-blown popery with which the Reformers had to contend, might be traced back, more or less directly, to this great principle; while, on the other hand, almost all the particular features of the system tended to deepen and strengthen in men’s minds the comprehensive heresy in which they had their root and origin.

Calvin saw that the only effectual way of dealing with this great perversion of the way of salvation, — so well fitted to lead men to build upon a false foundation their hopes of heaven, — the only way to overturn it root and branch, to demolish at once the whole height of the superstructure and the whole depth of the foundation, — was to bring out fully and definitely the whole doctrine of Scripture concerning the place held in the salvation of sinners by the Father, by the Son, and by the Holy Ghost. He made it his great object to bring out and to embody the whole doctrine of Scripture upon these subjects, and accordingly Calvinism is just a full exposition and development of the sum and substance of what is represented in Scripture as done for the salvation of sinners by the three persons of the Godhead.

It represents the Father as arranging, in accordance with all the perfections of His nature and all the principles of His moral government, and at the same time, with due regard to the actual capacities and obligations of men, the whole provisions of the scheme of redemption, choosing some men to grace and glory, and sending His Son to seek and to save them. It represents the Son as assuming human nature, and suffering and dying as the Surety and Substitute of His chosen people, — of those whom the Father had given Him in covenant, — of an innumerable multitude out of every kindred and nation and tongue, — as bearing their sins in His own body, and bearing them away, — as doing and bearing everything necessary for securing their eternal salvation.

It represents the Holy Spirit as taking of the things of Christ and showing them to men’s souls, as taking up His abode in all whom Christ redeemed with His precious blood, effectually and infallibly determining them to faith and holiness; and thus applying the blessings of redemption to all for whom Christ purchased them, and finally preparing them fully for the inheritance of the saints.

These are in substance the views given us in Scripture of the way in which sinners of the human race are saved. They are views which, as experience fully proves, are most offensive to the natural tendencies and inclinations of men’s hearts; and plainly as they are taught in Scripture, there is a constant and powerful disposition, — especially when true religion is in a low or languishing condition, — to reject them or explain them away, and to substitute in their room notions which, more or less directly, exclude or contradict them. They certainly had been thoroughly excluded from the practical teaching, and from the whole plans and arrangements of the church, at the period of the Reformation; while it is true, on the other hand, — and it is this with which at present we have more immediately to do, — that these views, and these alone, overturn from the foundation the whole system of notions which then generally prevailed, and which so fearfully perverted the way of salvation.

We believe that it is impossible to bring out accurately, fully, and definitely, the sum and substance of what is taught in Scripture concerning the place which the Father, the Son, and the Holy Ghost hold in the salvation of sinners, without taking up Calvinistic ground, — without being in a manner necessitated to assert the fundamental principles of the Calvinistic system of theology. It is, we believe, impossible otherwise to do full justice, and to give full effect, to what Scripture teaches, concerning the sovereign supremacy of the Father in determining the everlasting destiny of His creatures, — concerning the death and righteousness of Christ, as of infinite worth and value, and as infallibly efficacious for securing all the great objects to which they are directed, — and concerning the agency of the Holy Spirit in certainly and infallibly uniting to Christ through faith all whom the Father had given to Him, and preserving them in safety unto His eternal kingdom.

Those who reject or put aside the peculiar doctrines of Calvinism can, we think, be shown to be practically, and by fair construction, withholding from God, the Father, the Son, and the Holy Ghost, more or less of the place and influence which the Scripture assigns to them in the salvation of sinners; and to be giving to men themselves, or at least to creatures, a share in effecting their salvation which the Scripture does not sanction. And when Calvinistic principles are rejected or thrown into the background, not only is something, more or less, of necessity taken from the Creator and assigned to the creature, but an opening is made, — an opportunity is left, — for carrying on this process of transferring to man what belongs to God to almost any extent, until the scriptural method of salvation is wholly set aside or overturned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Calvin in The Reformers and the Theology of the Reformation</cite></span></figcaption>

We believe that it is impossible to bring out accurately, fully, and definitely, the sum and substance of what is taught in Scripture concerning the place which the Father, the Son, and the Holy Ghost hold in the salvation of sinners, without taking up Calvinistic ground, — without being in a manner necessitated to assert the fundamental principles of the Calvinistic system of theology. It is, we believe, impossible otherwise to do full justice, and to give full effect, to what Scripture teaches, concerning the sovereign supremacy of the Father in determining the everlasting destiny of His creatures, — concerning the death and righteousness of Christ, as of infinite worth and value, and as infallibly efficacious for securing all the great objects to which they are directed, — and concerning the agency of the Holy Spirit in certainly and infallibly uniting to Christ through faith all whom the Father had given to Him, and preserving them in safety unto His eternal kingdom.

Those who reject or put aside the peculiar doctrines of Calvinism can, we think, be shown to be practically, and by fair construction, withholding from God, the Father, the Son, and the Holy Ghost, more or less of the place and influence which the Scripture assigns to them in the salvation of sinners; and to be giving to men themselves, or at least to creatures, a share in effecting their salvation which the Scripture does not sanction. And when Calvinistic principles are rejected or thrown into the background, not only is something, more or less, of necessity taken from the Creator and assigned to the creature, but an opening is made, — an opportunity is left, — for carrying on this process of transferring to man what belongs to God to almost any extent, until the scriptural method of salvation is wholly set aside or overturned.”

<blockquote><p>To the first, we answer, That now nature being corrupted, it can be no good rule to try what is truth concerning God by it; it can hardly be denied, if nature be considered as in Adam at the beginning, but to him there was clearness in this mystery, there being express mention of the blessed Trinity in his creation, as the word, Let Us make man according to Our Image, doth import: which is not for nought mentioned then, more than formerly, especially, considering that excellent knowledge that Adam was furnished with, which was a part of the Image of that One God, who is Father, Son, and Spirit.

But, not to insist in this, we say, secondly, That if by nature, as it is now corrupted, what is tolerable or intolerable in the matters of Religion were to be tried, then were the whole Doctrine of the Gospel and Redemption through the Mediator, to be accounted no fundamental thing; and consequently, no Error, destroying it, were to be restrained, because nature hath not discovered that. That therefore must be an unsafe rule to walk by.

And indeed if a master of a family and father, who yet, as such, is (to say so) a servant of nature, is not by that exempted from the obligation of bringing up his children and servants in the knowledge of God according to the Gospel; but is notwithstanding to exercise his authority in the restraining of every thing contrary thereunto according to his station. Can it be thought, that a Magistrate, who must count for his Authority over a people, as a master must do for his, over a family, is less obliged thereunto? For, Christians are to be Christians in their stations, as in their personal carriage; and so to seek the promoving of the Gospel, and the restraining of what may mar it according to their station.

Thirdly, we answer, That even this may be drawn from the Moral Law of God; wherein not only the true God is alone to be worshipped, as in the first Command; but also accordingly as he hath prescribed and revealed in His Word, which is the sum of the second Command. Now, this being true, that the Lord hath thus revealed Himself to be worshipped according to the Gospel, it becomes no less necessary to Worship God in that manner, than to Worship Him, who is the true God; and so, is by the first Command, and according to the light of nature, Magistrates should restrain, and not suffer what is inconsistent with the worshipping of the One true and living God, so is he, by the second Command and that same light of nature, obliged to restrain all manner of Doctrine and Worship, that is inconsistent with what he hath revealed, according to the second.</p></blockquote>

<blockquote><p>The operation of the Holy Spirit, although indescribable, is very remote from enthusiasm. In enthusiasm the objects which are impressed on the mind, do not come from without, but are inwardly suggested by the mind itself. But in the Spirit’s operations the object is always understood to make its approach from without, and to be derived from the word. Enthusiasm takes place by sudden motions, which go before reason itself, and often exclude it altogether; the operation of the Spirit draws along with it the cordial consent of the will. Once more, enthusiasm affects the mind, while the will often remains unchanged; and hence it is found even in the ungodly; whereas the operations of divine grace necessarily include a change of the heart.

Although we cannot explain the operation of grace, yet we may make a few remarks upon it. We believe, then, that this divine work exercises an immediate influence on the body and on the soul, in order that the passions may not pervert our reason and judgment. It also prevents such motions from being excited within the brain, as would excite evil thoughts in the mind. It calls off the mind from all those ideas and thoughts which would divert it from holiness.

It prevents those objects from fastening on the mind, which have a tendency to corrupt it. It induces such attention, during the reading or hearing of the word, as prevents the mind from forming a hasty or wrong judgment. It very often suggests and brings to remembrance the truths which we have heard or read. It fills the mind with great delight, either when we read the word, or are desirous of reducing it to practice. Lastly, it increases this sacred pleasure more and more, so as to overcome the pleasures of sin.</p></blockquote>

ct+Pictet%2C+Christian+Theology%2C+trans.+Frederick+Reyroux+%281696%3B+London%2C+1834%29%2C+7.3%2C+p.+342.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf72e01c3d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af72e01c3d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/23/benedict-pictet-on-enthusiasm-and-the-operation-of-the-holy-spirit/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Q. 1. Is there but one God to whom these properties do belong?

A. One only, in respect of his essence and being, but one in three distinct persons, of Father, Son, and Holy Ghost. Deut. vi. 4; Matt. xix. 17; Eph. iv. 5, 6. Gen. i. 26; 1 John v. 7; Matt. xxviii. 19.

Q. 2. What mean you by person?

A. A distinct manner of subsistence or being, distinguished from the other persons by its own properties. John v. 17; Heb. i. 3.

Q. 3. What is the distinguishing property of the person of the Father?

A. To be of himself only the fountain of the Godhead. John v. 26, 27; Eph. i. 3.

Q. 4. What is the property of the Son?

A. To be begotten of his Father from eternity. Ps. ii. 7; John i. 14, iii. 16.

Q. 5. What of the Holy Ghost?

A. To proceed from the Father and the Son. John xiv. 17, xvi. 14, xv. 26, xx. 22.

Q. 6. Are these three one?

A. One every way, in nature, will, and essential properties, distinguished only in their personal manner of subsistence. John x. 30; Rom. iii. 30. John xv. 26; 1 John v. 7.

Q. 7. Can we conceive these things as they are in themselves?

A. Neither we nor yet the angels of heaven are at all able to dive into these secrets, as they are internally in God; but in respect of the outward dispensation of themselves to us by creation, redemption, and sanctification, a knowledge may be attained of these things, saving and heavenly. 1 Tim. vi. 16. Isa. vi. 2, 3. Col. i. 11–14.</p></blockquote>

<blockquote><p>In brief therefore, here it is said, that in the unity of the Godhead there be three Persons; that is, though there be but one living and true God, yet there are three Persons, who are that one living and true God. Though the true God be but one in substance, yet he is three in subsistence; and so three in subsistence, as still to be but one in substance. And these three Persons, every one of which is God, and yet all three but one God, are really related to one another: as they are termed in the scripture, one is a Father, the other a Son, the other an Holy Ghost.

The first is Father to the second; the second is Son to the first; the third is neither Father nor Son, but the issue or Spirit of both. The first was a Father from eternity, as well as God; the second was God from eternity, as well as a Son; the third was both Holy Ghost and God from eternity, as well as either of them. The Father is the first person in the Deity; not begotten, nor proceeding, but begetting: the Son the second person; not begetting nor proceeding, but begotten: the Holy Ghost the third; not begotten, nor begetting, but proceeding. The first is called the Father, because he begot the second; the second is called the Son, because he is begotten of the Father; the third is called the Holy Ghost, because breathed both from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 60-61.</span></figcaption>

</figure><figure class="quote" id="q-a01af3c2e7" data-kw="">
<blockquote><p>The promise embodied in these words [John 7:37-39] refers to the Holy Ghost, whose living waters could be imparted in only a stinted measure, under the Old Testament, seeing the Saviour was not yet glorified. Accordingly, it is observed by Dr [John] Owen, that those passages in the prophetic Scriptures which speak of the Spirit being “poured out,” always refer to New Testament times — the term “pouring out” indicating an exuberant abundance, such as could not be granted till the great sacrifice was offered. The increased measures of spiritual influence attest God’s acceptance of Christ’s expiation. A holy God granted straitened supplies under the legal system, to intimate that the great atonement was not offered; and then, after it was presented, to show it was embued with infinite intrinsic merit, his gifts and graces were showered down in unrestricted copiousness.

When it is said, “the Holy Ghost was not yet given,” this does not mean that his sanctifying influences were never diffused over the hearts of men. Christ uses similar phraseology, when, in his parting address to his disciples, he says (John xvi. 16, 17), “I will pray the Father, and he will give you another Comforter, even the spirit of truth,” &amp;c.: “but ye know him, for he dwelleth in you, and shall be in you.”

What he did when inspiring the prophets, and imparting gifts and graces in former times, was ascribed to Jehovah; but after Christ left the world, and he remained the only person of the Godhead, immediately working in the Church, all his operations were attributed to himself, as the Third Person of the glorious Trinity. He was to step forth with a kind of visible pomp, to manifest himself as the agent who was to apply to the Church what Christ had purchased; and we are, therefore, to expect from him such an effusion of living water, as will constitute an unequivocal evidence that Christ is now seated at God’s right hand.

The words of the text imply, not only the communication of the Spirit’s influence, as the sun’s beams animate the earth, though the residence is aloft in the firmament above our heads — they imply the inhabitation of the Divine agent himself — the Sun as well as the sunbeams must be introduced into the soul. The Spirit is the well, and his quickening and sanctifying operations, creating the virtues of the Christian character in us, are the waters bubbling up in us. No stock of grace in a saint has such elements of durability, as that it could be called a perennial spring. Our heavenly frames, on a Sabbath or Sacramental season would be succeeded by blighting worldliness, or utter decay, were it not that the Spirit, with his vital energy, abides in us — the fountain is ever flowing, because the Spirit is ever abiding in the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-cumming.html">Alexander Cumming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dispensation of the Spirit in Gospel Times. (Preached before the Free Synod of Perth, 15th October 1844, and published at their request.) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

mained+the+only+person+of+the+Godhead%2C+immediately+working+in+the+Church%2C+all+his+operations+were+attributed+to+himself%2C+as+the+Third+Person+of+the+glorious+Trinity.+He+was+to+step+forth+with+a+kind+of+visible+pomp%2C+to+manifest+himself+as+the+agent+who+was+to+apply+to+the+Church+what+Christ+had+purchased%3B+and+we+are%2C+therefore%2C+to+expect+from+him+such+an+effusion+of+living+water%2C+as+will+constitute+an+unequivocal+evidence+that+Christ+is+now+seated+at+God%E2%80%99s+right+hand.%0A%0AThe+words+of+the+text+imply%2C+not+only+the+communication+of+the+Spirit%E2%80%99s+influence%2C+as+the+sun%E2%80%99s+beams+animate+the+earth%2C+though+the+residence+is+aloft+in+the+firmament+above+our+heads+%E2%80%94+they+imply+the+inhabitation+of+the+Divine+agent+himself+%E2%80%94+the+Sun+as+well+as+the+sunbeams+must+be+introduced+into+the+soul.+The+Spirit+is+the+well%2C+and+his+quickening+and+sanctifying+operations%2C+creating+the+virtues+of+the+Christian+character+in+us%2C+are+the+waters+bubbling+up+in+us.+No+stock+of+grace+in+a+saint+has+such+elements+of+durability%2C+as+that+it+could+be+called+a+perennial+spring.+Our+heavenly+frames%2C+on+a+Sabbath+or+Sacramental+season+would+be+succeeded+by+blighting+worldliness%2C+or+utter+decay%2C+were+it+not+that+the+Spirit%2C+with+his+vital+energy%2C+abides+in+us+%E2%80%94+the+fountain+is+ever+flowing%2C+because+the+Spirit+is+ever+abiding+in+the+soul.%E2%80%9D%0A%0A%E2%80%94+Alexander+Cumming%2C+The+Dispensation+of+the+Spirit+in+Gospel+Times.+%28Preached+before+the+Free+Synod+of+Perth%2C+15th+October+1844%2C+and+published+at+their+request.%29+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa01af3c2e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a01af3c2e7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/26/alexander-cumming-on-christs-death-and-the-spirits-outpouring/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-9162d78371" data-kw="">
<blockquote><p>Consider those men who are devoted to horse racing. They are named after the colours and the sides on which they have placed themselves. You know the names without my mentioning them. If it is thus that you have got the name of Christian, the mere title is a very small thing even though you pride yourself upon it. But if it is because you believe Him to be God, shew your faith by your works. If the Son is a creature, even now also you are worshipping the creature instead of the Creator. If the Holy Ghost is a creature, you are baptized in vain, and are only sound on two sides, or rather not even on them; but on one you are altogether in danger.

Imagine the Trinity to be a single pearl, alike on all sides and equally glistening. If any part of the pearl be injured; the whole beauty of the stone is gone. So when you dishonour the Son in order to honour the Father, He does not accept your honour. The Father doth not glory in the dishonour of the Son. If a wise Son maketh a glad Father, how much more doth the honour of the Son become that of the Father! And if you also accept this saying, My Son, glory not in the dishonour of thy Father, similarly the Father doth not glory in the Son’s dishonour. If you dishonour the Holy Ghost, the Son receiveth not your honour. For though He be not of the Father in the same way as the Son, yet He is of the same Father.

Either honour the whole or dishonour the whole, so as to have a consistent mind. I cannot accept your half piety. I would have you altogether pious, but in the way that I desire. Pardon my affection: I am grieved even for those who hate me. You were one of my members, even though you are now cut off: perhaps you will again become a member; and therefore I speak kindly. Thus much for the sake of the Eunuchs, that they may be chaste in respect of the Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oration XXXVII. On the Words of the Gospel, “When Jesus had finished these sayings,” etc. – S. Matt. XIX. I.</cite>, (n.d.), 6-7 in Nicene and Post-Nicene Fathers 2, 7: 343.</span></figcaption>

</figure><figure class="quote" id="q-c49cf11a3d" data-kw="">
<blockquote><p>Without believing this mystery of the Trinity, we cannot be saved, and it is therefore utterly ungodly, damning, and atheistic to maintain with the Remonstrants that it is not absolutely necessary to believe that God is a triune God. If it is not necessary unto salvation to believe that God is a triune God, then it is also not necessary unto salvation to believe that there is a God.

For he who believes that God is who He is must acknowledge and embrace Him as He is, namely, one in essence and three in persons. Otherwise, such a person will deny the true God and believe an idol that is a fabrication of his own imagination—an idol that is a nonentity in this world.

Therefore, he who does not wholeheartedly believe and confess that God is a triune God has never seen nor known God. He is a public denier of God, because He fully denies the true triune God, and apart from Him, there is no God. He is one who is openly wicked and entirely estranged from God and His blessed communion, for we can have communion only with a God who is triune.

Our approach unto God the Father must take place in and through God the Son as the only way to the Father; and unto God the Son we must be brought and led by God the Holy Spirit. Therefore, he who does not wholeheartedly believe in a triune God is guilty of not accepting the testimony that God has given of Himself, but rather, he makes God to be a liar, denies Him, and neither can have communion with Him to all eternity nor enter into the kingdom of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 135.</span></figcaption>

</figure><figure class="quote" id="q-5f98552738" data-kw="">
<blockquote><p>Next he comes to the Father, and he says, and God our Father. There then the two persons which are the two fountains of all grace that comes to man in the world. Mark here a double honour given to Christ. First he is joined with the Father as a fountain of all grace, and next he is first named: for he says, I pray the Lord Jesus: and then he says, and God our Father. He puts the Father in the second room, albeit in other places he puts God the father in the first room, as ye may find in all his salutations. Now what must follow on this? Even this, that Jesus Christ is very God, as he is very man, coessential of the same nature with God, coequal, of the same dignity and majesty with the Father, and coeternal with him; if this were not, he could not have given him such a style without blasphemy against God.

The old Heretics thought they got a great advantage of such places of the Scripture that placed the Father in the first room, to conclude that Jesus Christ was not only inferior, but far unequal to God the Father, and especially they gather it out of these words, I baptise thee in the name of the Father, and of the Son, &amp;c. Ergo, say they, the Son is inferior. But look here and ye will find that Christ is named in the first room.

That old doctor Chrysostom when he has reasoned against this fond opinion, at last he concludes. They are equal in eternity, dignity and in every thing, that is, or may be called truly God. Indeed the Father is the first person, but that makes not that the Father is above the Son; for there is equality in dignity and essence, and therefore he whiles puts the one before the other, and that not in respect of any supremacy, but to testify that Jesus Christ our Saviour and the Father is one, and equal in every respect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), Part II, p. 109.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-060c269f8a" data-kw="">
<blockquote><p>For some in their lack of understanding do bring down the Only-Begotten Word of God from His Supreme Excellence and lower Him from Equality with God the Father, affirming that He is not Consubstantial, nor liking to crown Him with an Identity Exact and of Nature: others going as it were along the same road with these and falling into the snare of death and pitfall of Hades turn aside the mystery of the Economy with flesh of the Only-Begotten and pursue a folly fraternal (so to speak) with the former.

For the one will be caught dragging down as it were (so far as in them lies) from the heights of His Godhead the Word sprung of God the Father ere yet Incarnate; the others have elected to make war with Him Incarnate, well-nigh finding fault (daring ones!) with His Pitying grace, maintaining forsooth that it counselled not well for that He underwent flesh and the measures of our emptiness, i. e. was made man and was seen on earth and conversed with men though God by Nature and co-seated with the Father. …

God-inspired Scripture therefore will cry out against the unlearning of them both, setting forth to us the truth and shewing that feeble and of none account is their speech, and establishing on the path of the Godhead them who are used to view with subtil and accurate eye of understanding the Mystery thereof.</p></blockquote>

</figure><figure class="quote" id="q-dab59be31f" data-kw="">
<blockquote><p>The expression, “whom the Father hath sanctified,” [John 10:36] must mean, “whom the Father hath set apart, and appointed from all eternity in the covenant of grace, as a priest is sanctified and set apart for the service of the temple.” It cannot mean literally “made holy.” It implies eternal dedication and appointment to a certain office.

This is one of the places which teach the eternal generation of Christ. Long before He came into the world, “the Father” (not God, observe) had sanctified and appointed the Son. He did not become the Son when He entered the world: He was the Son from all eternity.

The expression, “sent into the world,” means that mission of Christ’s to be the Saviour, which took place when he became incarnate, and came among us in the form of a man. He was the Father’s “sent One,” the “Apostle” of our profession. (See Heb. iii. 1; John iii. 17; and 1 John iv. 14.) He that was so “sanctified” and “sent,” might well speak of Himself as the Son of God, and equal with God.</p></blockquote>

<blockquote><p>10 The doctrine concerning the Essence of God, is absolved in this question, What God is: to wit, Jehovah Elohim, One in Essence, three in Persons.

11 For God hath so manifested him self; that in the divine Essence being but one, and that undivided, there are three Persons, neither more nor less; to wit, the Father, the Son, and the Holy Ghost.

12 The Father is the first Person, [n]either made, nor created, nor begotten, nor proceeding.

13 The Son is the second Person, not made, nor created, but begotten of the Father from all eternity.

14 Who in the fullness of time took upon him our human nature, in which and through which he paid the price of our redemption.

15 The Holy Ghost is the third person, not made, nor created, nor begotten; but proceeding from the Father and the Son from all eternity.</p></blockquote>

</figure><figure class="quote" id="q-8544c5a7ec" data-kw="">
<blockquote><p>For those are anathematized who say that there are three Gods: because according to God’s true nature His substance does not admit a number of applications of the title, except as it is given to individual men and angels in recognition of their merit, though the substance of their nature and that of God is different. In that sense there are consequently many gods. Furthermore in the nature of God, God is one, yet in such a way that the Son also is God, because in Him there is not a different nature: and since He is God of God, both must be God, and since there is no difference of kind between them there is no distinction in their essence.

A number of titular Gods is rejected; because there is no diversity in the quality of the divine nature. Since therefore he is anathema who says there are many Gods and he is anathema who denies that the Son is God; it is fully shewn that the fact that each has one and the same name arises from the real character of the similar substance in each: since in confessing the Unborn God the Father, and the Only-begotten God the Son, with no dissimilarity of essence between them, each is called God, yet God must be believed and be declared to be one. …

Yet to prevent the declaration of one God seeming to affirm that God is a solitary monad without offspring of His own, it immediately condemns the rash suggestion that because God is one, therefore God the Father is one and solitary, having in Himself the name of Father and of Son: since in the Father who begets and the Son who comes to birth one God must be declared to exist on account of the substance of their nature being similar in each.

The faith of the saints knows nothing of the Son being incapable of birth: because the nature of the Son only draws its existence from birth. But the nature of the birth is in Him so perfect that He who was born of the substance of God is born also of His purpose and will. For from His will and purpose, not from the process of a corporeal nature, springs the absolute perfection of the essence of God born from the essence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 36-37 in Nicene and Post-Nicene Fathers 2, 9: 14.</span></figcaption>

<blockquote><p>The agent in, and chief author of, this great work of our redemption is the whole blessed Trinity; for all the works which outwardly are of the Deity are undivided and belong equally to each person, their distinct manner of subsistence and order being observed. It is true, there were sundry other instrumental causes in the oblation, or rather passion of Christ but the work cannot in any sense be ascribed unto them; — for in respect of God the Father, the issue of their endeavours was exceeding contrary to their own intentions, and in the close they did nothing but what the “hand and counsel of God had before determined should be done,” Acts iv. 28; and in respect of Christ they were no way able to accomplish what they aimed at, for he himself laid down his life, and none was able to take it from him, John x. 17, 18: so that they are to be excluded from this consideration.

In the several persons of the holy Trinity, the joint author of the whole work, the Scripture proposeth distinct and sundry acts or operations peculiarly assigned unto them; which, according to our weak manner of apprehension, we are to consider severally and apart; which also we shall do, beginning with them that are ascribed to the Father.

1. Two peculiar acts there are in this work of our redemption by the blood of Jesus, which may be and are properly assigned to the person of the Father:— First, The sending of his Son into the world for this employment. Secondly, A laying the punishment due to our sin upon him.

The Father loves the world, and sends his Son to die: He “sent his Son into the world that the world through him might be saved,” John iii. 16, 17. He “sending his Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh, that the righteousness of the law might be fulfilled in us,” Rom. viii. 3, 4. He “set him forth to be a propitiation through faith in his blood,” chap. iii. 25. For “when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law, to redeem them that were under the law, that we might receive the adoption of sons,” Gal. iv. 4, 5. So more than twenty times in the Gospel of John there is mention of this sending; and our Saviour describes himself by this periphrasis, “Him whom the Father hath sent,” John x. 36; and the Father by this, “He who sent me,” chap. v. 37.

So that this action of sending is appropriate to the Father, according to his promise that he would “send us a Saviour, a great one, to deliver us,” Isa. xix. 20; and to the profession of our Saviour, “I have not spoken in secret from the beginning; from the time that it was, there am I: and now the Lord God, and his Spirit, hath sent me,” Isa. xlviii. 16. Hence the Father himself is sometimes called our Saviour: 1 Tim. i. 1, “According to the commandment Θεοῦ σωτῆρος ἡμῶν,” — “of God our Saviour.” Some copies, indeed, read it, Θεοῦ καὶ σωτῆρος ἡμῶν, — “of God and our Saviour;” but the interposition of that particle καὶ arose, doubtless, from a misprision that Christ alone is called Saviour. But directly this is the same with that parallel place of Tit. i. 3, Κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν Θεοῦ, — “According to the commandment of God our Saviour,” where no interposition of that conjunctive particle can have place; the same title being also in other places ascribed to him, as Luke i. 47, “My spirit hath rejoiced in God my Saviour.” As also 1 Tim. iv. 10, “We trust in the living God, who is the Saviour of all men, specially of them that believe;” though in this last place it be not ascribed unto him with reference to his redeeming us by Christ, but his saving and preserving all by his providence.</p></blockquote>

<blockquote><p>The Lord our God is but one God. In which Indivisible Unity notwithstanding, we adore the Father, as being altogether of himself;[1] we glorify that Consubstantial Word which is the Son; we bless and magnify that Co-essential Spirit eternally proceeding from both, which is the Holy Ghost. Seeing therefore the Father is of none, the Son is of the Father, and the Spirit is of both, they are by these their several Properties really distinguishable each from other. For the Substance of God, with this property to be of none, doth make the Person of the Father; the very self-same Substance in number with this property to be of the Father, maketh the Person of the Son; the same Substance having added unto it, the property of proceeding from the other two, maketh the Person of the Holy Ghost. So that in every Person, there is implied both the Substance of God, which is one; and also, that property which causeth the same Person really and truly to differ from the other two.

Every Person hath his own subsistence, which no other besides hath, although there be others besides that are of the same Substance. As no man but Peter can be the person which Peter is, yet Paul hath the self-same Nature which Peter hath. Again, Angels have every of them the Nature of pure and Invisible Spirits, but every Angel, is not that Angel which appeared in a Dream to Joseph. Now when God became Man, lest we should err in applying this to the Person of the Father, or of the Spirit, St. Peter’s confession unto Christ was, Thou art the Son of the Living God; and St. John’s Exposition thereof was made plain, That it is the Word which was made Flesh. The Father, and the Holy Ghost (saith Damascen [John of Damascus]) have no Communion with the Incarnation of the Word, otherwise then only by approbation and assent.

Notwithstanding, for as much as the Word and Deity are one Subject, we must beware we exclude not the Nature of God from Incarnation, and so make the Son of God incarnate, not to be very God. For undoubtedly, even the Nature of God it self, in the only Person of the Son, is incarnate, and hath taken to it self Flesh. Wherefore, Incarnation may neither be granted to any Person, but only One, nor yet denied to that Nature which is common unto all Three. Concerning the cause of which incomprehensible Mystery, for as much as it seemeth a thing unconsonant, That the World should honour any other as the Saviour, but him whom it honoureth as the Creator of the World, and in the Wisdom of God, it hath not been thought convenient to admit any way of saving man, but by man himself, though nothing should be spoken of the Love and Mercy of God towards Man; which this way are become such a Spectacle, as neither Men nor Angels can behold without a kind of Heavenly astonishment, we may hereby perceive there is cause sufficient, why Divine Nature should assume Human, that so God might be in Christ, reconciling to himself the World.

And if some cause be likewise required, why rather to this end and purpose the Son, then either the Father, or the Holy Ghost, should be made man, Could we which are born the children of wrath, be adopted the Sons of God, through Grace, any other then by the Natural Son of God, being Mediator between God and us? It became therefore him, by whom all things are to be the Way of Salvation to all, that the Institution and Restitution of the World might be both wrought by one hand. The World’s Salvation was without the Incarnation of the Son of God, a thing impossible; not simply impossible, but impossible, it being presupposed, That the Will of God, was no otherwise to have it saved, then by the Death of his own Son.

Wherefore taking to himself our Flesh, and by his Incarnation, making it his own Flesh, he had now of his own, although from us, what to offer unto God for us. And as Christ took Manhood, that by it he might be capable of death, whereunto he humbled himself; so because Manhood is the proper subject of compassion and feeling pity, which maketh the Sceptre of Christ’s Regency even in the Kingdom of Heaven be amiable; he which without our Nature could not on Earth suffer for the sins of the World, doth now also by means thereof, both make intercession to God for sinners, and exercise dominion over all men with a true, a natural, and a sensible touch of Mercy.</p></blockquote>

Notwithstanding, for as much as the Word and Deity are one Subject, we must beware we exclude not the Nature of God from Incarnation, and so make the Son of God incarnate, not to be very God. For undoubtedly, even the Nature of God it self, in the only Person of the Son, is incarnate, and hath taken to it self Flesh. Wherefore, Incarnation may neither be granted to any Person, but only One, nor yet denied to that Nature which is common unto all Three. Concerning the cause of which incomprehensible Mystery, for as much as it seemeth a thing unconsonant, That the World should honour any other as the Saviour, but him whom it honoureth as the Creator of the World, and in the Wisdom of God, it hath not been thought convenient to admit any way of saving man, but by man himself, though nothing should be spoken of the Love and Mercy of God towards Man; which this way are become such a Spectacle, as neither Men nor Angels can behold without a kind of Heavenly astonishment, we may hereby perceive there is cause sufficient, why Divine Nature should assume Human, that so God might be in Christ, reconciling to himself the World.

And if some cause be likewise required, why rather to this end and purpose the Son, then either the Father, or the Holy Ghost, should be made man, Could we which are born the children of wrath, be adopted the Sons of God, through Grace, any other then by the Natural Son of God, being Mediator between God and us? It became therefore him, by whom all things are to be the Way of Salvation to all, that the Institution and Restitution of the World might be both wrought by one hand. The World’s Salvation was without the Incarnation of the Son of God, a thing impossible; not simply impossible, but impossible, it being presupposed, That the Will of God, was no otherwise to have it saved, then by the Death of his own Son.

Wherefore taking to himself our Flesh, and by his Incarnation, making it his own Flesh, he had now of his own, although from us, what to offer unto God for us. And as Christ took Manhood, that by it he might be capable of death, whereunto he humbled himself; so because Manhood is the proper subject of compassion and feeling pity, which maketh the Sceptre of Christ’s Regency even in the Kingdom of Heaven be amiable; he which without our Nature could not on Earth suffer for the sins of the World, doth now also by means thereof, both make intercession to God for sinners, and exercise dominion over all men with a true, a natural, and a sensible touch of Mercy.”

— Richard Hooker, the Laws of Ecclesiastical Polity, Book 5.51 in The works of Mr. Richard Hooker (that learned and judicious divine), in eight books of ecclesiastical polity compleated out of his own manuscripts, never before published. With an account of his life and death (London: Andrew Crook, 1666), pp 207-08.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Lord+our+God+is+but+one+God.+In+which+Indivisible+Unity+notwithstanding%2C+we+adore+the+Father%2C+as+being+altogether+of+himself%3B%5B1%5D+we+glorify+that+Consubstantial+Word+which+is+the+Son%3B+we+bless+and+magnify+that+Co-essential+Spirit+eternally+proceeding+from+both%2C+which+is+the+Holy+Ghost.+Seeing+therefore+the+Father+is+of+none%2C+the+Son+is+of+the+Father%2C+and+the+Spirit+is+of+both%2C+they+are+by+these+their+several+Properties+really+distinguishable+each+from+other.+For+the+Substance+of+God%2C+with+this+property+to+be+of+none%2C+doth+make+the+Person+of+the+Father%3B+the+very+self-same+Substance+in+number+with+this+property+to+be+of+the+Father%2C+maketh+the+Person+of+the+Son%3B+the+same+Substance+having+added+unto+it%2C+the+property+of+proceeding+from+the+other+two%2C+maketh+the+Person+of+the+Holy+Ghost.+So+that+in+every+Person%2C+there+is+implied+both+the+Substance+of+God%2C+which+is+one%3B+and+also%2C+that+property+which+causeth+the+same+Person+really+and+truly+to+differ+from+the+other+two.%0A%0AEvery+Person+hath+his+own+subsistence%2C+which+no+other+besides+hath%2C+although+there+be+others+besides+that+are+of+the+same+Substance.+As+no+man+but+Peter+can+be+the+person+which+Peter+is%2C+yet+Paul+hath+the+self-same+Nature+which+Peter+hath.+Again%2C+Angels+have+every+of+them+the+Nature+of+pure+and+Invisible+Spirits%2C+but+every+Angel%2C+is+not+that+Angel+which+appeared+in+a+Dream+to+Joseph.+Now+when+God+became+Man%2C+lest+we+should+err+in+applying+this+to+the+Person+of+the+Father%2C+or+of+the+Spirit%2C+St.+Peter%E2%80%99s+confession+unto+Christ+was%2C+Thou+art+the+Son+of+the+Living+God%3B+and+St.+John%E2%80%99s+Exposition+thereof+was+made+plain%2C+That+it+is+the+Word+which+was+made+Flesh.+The+Father%2C+and+the+Holy+Ghost+%28saith+Damascen+%5BJohn+of+Damascus%5D%29+have+no+Communion+with+the+Incarnation+of+the+Word%2C+otherwise+then+only+by+approbation+and+assent.%0A%0ANotwithstanding%2C+for+as+much+as+the+Word+and+Deity+are+one+Subject%2C+we+must+beware+we+exclude+not+the+Nature+of+God+from+Incarnation%2C+and+so+make+the+Son+of+God+incarnate%2C+not+to+be+very+God.+For+undoubtedly%2C+even+the+Nature+of+God+it+self%2C+in+the+only+Person+of+the+Son%2C+is+incarnate%2C+and+hath+taken+to+it+self+Flesh.+Wherefore%2C+Incarnation+may+neither+be+granted+to+any+Person%2C+but+only+One%2C+nor+yet+denied+to+that+Nature+which+is+common+unto+all+Three.+Concerning+the+cause+of+which+incomprehensible+Mystery%2C+for+as+much+as+it+seemeth+a+thing+unconsonant%2C+That+the+World+should+honour+any+other+as+the+Saviour%2C+but+him+whom+it+honoureth+as+the+Creator+of+the+World%2C+and+in+the+Wisdom+of+God%2C+it+hath+not+been+thought+convenient+to+admit+any+way+of+saving+man%2C+but+by+man+himself%2C+though+nothing+should+be+spoken+of+the+Love+and+Mercy+of+God+towards+Man%3B+which+this+way+are+become+such+a+Spectacle%2C+as+neither+Men+nor+Angels+can+behold+without+a+kind+of+Heavenly+astonishment%2C+we+may+hereby+perceive+there+is+cause+sufficient%2C+why+Divine+Nature+should+assume+Human%2C+that+so+God+might+be+in+Christ%2C+reconciling+to+himself+the+World.%0A%0AAnd+if+some+cause+be+likewise+required%2C+why+rather+to+this+end+and+purpose+the+Son%2C+then+either+the+Father%2C+or+the+Holy+Ghost%2C+should+be+made+man%2C+Could+we+which+are+born+the+children+of+wrath%2C+be+adopted+the+Sons+of+God%2C+through+Grace%2C+any+other+then+by+the+Natural+Son+of+God%2C+being+Mediator+between+God+and+us%3F+It+became+therefore+him%2C+by+whom+all+things+are+to+be+the+Way+of+Salvation+to+all%2C+that+the+Institution+and+Restitution+of+the+World+might+be+both+wrought+by+one+hand.+The+World%E2%80%99s+Salvation+was+without+the+Incarnation+of+the+Son+of+God%2C+a+thing+impossible%3B+not+simply+impossible%2C+but+impossible%2C+it+being+presupposed%2C+That+the+Will+of+God%2C+was+no+otherwise+to+have+it+saved%2C+then+by+the+Death+of+his+own+Son.%0A%0AWherefore+taking+to+himself+our+Flesh%2C+and+by+his+Incarnation%2C+making+it+his+own+Flesh%2C+he+had+now+of+his+own%2C+although+from+us%2C+what+to+offer+unto+God+for+us.+And+as+Christ+took+Manhood%2C+that+by+it+he+might+be+capable+of+death%2C+whereunto+he+humbled+himself%3B+so+because+Manhood+is+the+proper+subject+of+compassion+and+feeling+pity%2C+which+maketh+the+Sceptre+of+Christ%E2%80%99s+Regency+even+in+the+Kingdom+of+Heaven+be+amiable%3B+he+which+without+our+Nature+could+not+on+Earth+suffer+for+the+sins+of+the+World%2C+doth+now+also+by+means+thereof%2C+both+make+intercession+to+God+for+sinners%2C+and+exercise+dominion+over+all+men+with+a+true%2C+a+natural%2C+and+a+sensible+touch+of+Mercy.%E2%80%9D%0A%0A%E2%80%94+Richard+Hooker%2C+the+Laws+of+Ecclesiastical+Polity%2C+Book+5.51+in+The+works+of+Mr.+Richard+Hooker+%28that+learned+and+judicious+divine%29%2C+in+eight+books+of+ecclesiastical+polity+compleated+out+of+his+own+manuscripts%2C+never+before+published.+With+an+account+of+his+life+and+death+%28London%3A+Andrew+Crook%2C+1666%29%2C+pp+207-08.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F54afc96bae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/54afc96bae.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/30/richard-hooker-on-the-trinity-and-christs-person/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ce1d6874c7" data-kw="">
<blockquote><p>We readily allow that there are mysteries in scripture which surpass our comprehension, and which we shall not perfectly understand even in heaven. At the same time, we maintain, that we have as much of these mysteries taught us, as is useful and necessary to be known. For instance, we do not comprehend the mysteries of the Incarnation and the Trinity — that is, how it can be, that there are three persons in one essence, and how God assumed human nature: but though the manner is unknown, the thing itself is plainly taught; which is all that is necessary to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 1.10, p. 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-6d892cd305" data-kw="">
<blockquote><p>We must know God as the Father of Christ; we must know him in that relation to Christ, without which knowledge we can have no right conceptions of the economy of redemption, because all proceeds from the Father through the Son. That which is the greatest stumbling-block in the text is that clause, ‘thee the only true God,’ whereby some would exclude the deity of Christ.

Christ prays to the Father, and acknowledgeth him the only true God; if the Father therefore, say some, be the only true God, then Christ is not God, and they tell us that Christ is Deus factus, Deus constitutus. But to say a made God, is as great nonsense as to say an uncreated creature. Both carry a contradiction in the terms. The Scripture doth frequently and plainly assert the deity of Christ: no creature can be equal with God. But Christ was ‘in the form of God,’ and ‘thought it no robbery to be equal with God,’ Philip, ii. 6.

He was equal to God in his deity, though inferior to God in his humanity; the form of God stooped to the form of a servant, but the form of a servant despoiled him of nothing essential to the form of God; he ceased not to be what he was before, when he became in the womb of the virgin what he was not before. ‘All things that the Father hath are mine,’ saith Christ, John xvi. 15; what is more the Father’s than his essence and deity? The essence, therefore, and deity of the Father is the essence and deity of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-1d94800242" data-kw="">
<blockquote><p>What we believe, reduces it self to two Heads: First, That the Persons of the Trinity are really distinct from one another: the Father is not the Son, and the Holy Spirit is neither the Father nor the Son. The other, That neither of these Persons is really distinguished from the Divine Essence which they possess:

That the Father is God, the Son God, and the Holy Ghost God; and what is more, That the Father, Son and Holy Ghost are but one God, possessing only one Divinity; so that the Divinity of the Father is the same with that of the Son; and that of the Father and the Son is not different from that of the Holy Ghost. …</p></blockquote>

</figure><figure class="quote" id="q-32c6f6906d" data-kw="">
<blockquote><p>It does not follow that a doctrine is untrue because it is incomprehensible. The Bible teaches the doctrine of the Trinity. The rationalist denies it. It is a contradiction, he says. But it is not a contradiction, for the human mind cannot believe a contradiction, and the doctrine of the trinity is a cardinal one in the Christian’s creed. Incomprehensible it undoubtedly is, but this is no argument against it, unless, indeed, the man who makes it is omniscient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-l-patton.html">Francis L. Patton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Summary of Christian Doctrine</cite>, (Philadelphia: The Westminster Press, 1901), p. 19.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It does not follow that a doctrine is untrue because it is incomprehensible. The Bible teaches the doctrine of the Trinity. The rationalist denies it. It is a contradiction, he says. But it is not a contradiction, for the human mind cannot believe a contradiction, and the doctrine of the trinity is a cardinal one in the Christian’s creed. Incomprehensible it undoubtedly is, but this is no argument against it, unless, indeed, the man who makes it is omniscient.”

</figure><figure class="quote" id="q-8a2877e5ef" data-kw="">
<blockquote><p>It is a pious saying that the Father is not limited by times: for the true meaning of the name of Father which He bore before time began surpasses comprehension. Although religion teaches us to ascribe to Him this name of Father through which comes the impassible origin of the Son, yet He is not bound in time, for the eternal and infinite God cannot be understood as having become a Father in time, and according to the teaching of the Gospel the Only-begotten God the Word is recognized even in the beginning rather to be with God than to be born. …

The essential likeness conformed to the Father’s essence in kind is also taught to be identical in time: lest He who is the image of God, who is the Word, who is God with God in the beginning, who is like the Father, by the insertion of times between Himself and the Father should not have in Himself in perfection that which is both image, and Word, and God. For if He be proclaimed to be younger in time, He has lost the truth of the image and likeness: for that is no longer likeness which is found to be dissimilar in time. For that very fact that God is Father prevents there being any time in which He was not Father: consequently there can be no time in the Son’s existence in which He was not Son. Wherefore we must neither call the Father older than the Son nor the Son younger than the Father: for the true meaning of neither name can exist without the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 24-25 in Nicene and Post-Nicene Fathers 2, 9: 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-3d64d40d2a" data-kw="">
<blockquote><p>As the Head of his Church, Christ is its source of spiritual influence. In him, for the use of his Church, the Spirit dwells in immeasurable degree. For the “Father giveth not the Spirit by measure unto his Son.” It has thus pleased the Father, that in him all fulness should dwell; and the conclusion is clear — Out of his fulness may we all receive, even grace upon grace. Oh, it was no scanty supply of the Spirit Christ ensured for his Church. There is no risk of soon draining this fountain dry. Believe it, it is inexhaustible. Hither may you repair, and drink of the water of life as largely as your finite capacities will admit of, and yet leave it undiminished.

Mark well, for it is important, the encouragement afforded us by the death of Christ to expect free and full communications of the Holy Spirit. Had Christ not died, the Spirit could in no degree — not even in the smallest —have been sent forth to enlighten, and sanctify, and save; for the justice of God, unpropitiated and unappeased, would have stood immoveably in the way of this. But now Christ having died, and justice being satisfied, and every obstacle on God’s part removed, what hinders that the Spirit be now shed forth through Christ, and that not grudgingly and sparingly, but cheerfully and abundantly?

It is now not merely consistent with the Divine character that the Spirit may be obtained. The glory of the Divine character requires that what Christ died for be accomplished — that what he purchased be bestowed. To imagine that Christ has obtained by his death only a small measure of spiritual influence for the Church, is virtually to detract from the merit and efficacy of his death. To go to God with doubting, confused, straitened desires for the Spirit, is virtually to deny that the Spirit is the purchase of Christ for his Church, and to insinuate that something yet remains to be done to entitle us to receive him, at least so fully as we need.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-l-r-foote.html">Alexander L. R. Foote</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of the Lord not Straitened in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-ddf8585ebc" data-kw="">
<blockquote><p>Glorify thy Son. Glorify him in his death, by accepting it as the death of thy Son for the sins of the world; glorify him in his death, by manifesting at that time that I am thy Son. God did so by miraculous testimonies of his innocency in the time of his passion, by rending of the temple’s veil, obscurity of the sun, quaking of the earth, and the cleaving of the rocks, which made the centurion that guarded him pronounce him to be ‘truly the Son of God,’ Mat. xxvii. 54.

Glorify him in a resurrection; glorify thy Son in his deity, by a manifestation of it; glorify thy Son in his humanity, by conferring new endowments of honour and immortality upon it. He prays here for a manifestation of the glory of his deity, which had been obscured, for an addition of glory to his humanity, which had not been yet enjoyed, by a resurrection and exaltation of it to the right hand of the Father. He prays for a manifestation of his deity: ‘Glorify thy Son.’

He was the Son of God by eternal generation; it is the glory of his deity therefore which is here desired by him. Not the essential glory of the Deity, for that could not be interrupted; not any addition to it, for, being infinite, he was not capable of it, but a manifestation of it; not simply in itself, but in his humanity, which had been veiled by the flesh ever since he emptied himself into it. He prays to be glorified in that state wherein he prays, which was a state of union with the human nature. His essential glory could suffer no detriment, his manifestative did.

As the sins of men are said to dishonour God, not that they detract from the glory of his essence, which cannot suffer any diminution by the sins of men, but as they deny and obscure the manifestation of his glory; the sun suffers no loss of light in its body by the veil of a thick cloud, but the brightness of his beams is masked. As the Father was to be glorified by Christ, so was Christ to be glorified by the Father. Now, the Father could not be glorified by the Son in a way of addition, but manifestation, causing the glory of God to break out upon the world, which had so long been obscured by an universal idolatry. He glorified the Father by a manifestation of his name, ver. 4; and in like manner is glorified by the Father in the manifestation of his deity.

That Christ prays here for the glory of his deity as well as of his humanity is evident, because he prays as mediator and priest, desiring a mediatory glory; but he was mediator and priest according to his divine as well as human nature, and therefore desires that he might be known to the world, not only to be a just and innocent man, but the eternal Son of God, the Redeemer of the world, the expiator of sins, and in that work infinitely delightful to the Father.

Glorify thy Son. Glorify him as thy Son, that as thy Son he may glorify thee. The Son of God was in the world as a great light in a dark lantern, clouded and covered with clay, that though the candle burned, it did not appear, but through some crannies. He desires that this thick mist might be dispersed, that the glory of his divinity might shine forth in his humanity, as a candle through polished glass.

The glory of Christ was to be manifested to be the Son of God: John i. 14, ‘We beheld his glory, the glory as of the only begotten of the Father;’ a glory in his resurrection, his ascension, in the” mission of the Spirit, which declared him to be no other than the only Son of God; and so verse 22 of this chapter is to be understood, ‘The glory which thou gavest me I have given them.’ As it is my glory to be the Son of God, so I have given them this glory, to be the sons of God by adoption, ‘that they may be one, as we are one;’ in the same relation of sonship, though in a different manner.

His petition for this glory he urgeth by two arguments :

(1.) One in ver. 1, ‘That thy Son also may glorify thee.’ The glory of the Father was concerned in it, whose justice, wisdom, love (and all the attributes so signally manifested in redemption), had lain under as great a disguise without the glory of Christ, as the deity of the Son did under the veil of his flesh.

(2.) Another, taken from the happiness and salvation of the elect, ver. 2, ‘As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him.’ Unless the humanity had been glorified by a resurrection, there would have been no assurance that the debt had been satisfied, and no sure ground of faith; unless he had been exalted to the right hand of God as an advocate, there had been no security for our debts.

His resurrection was necessary to make men believers for what was passed, his exaltation was necessary to make them comfortable believers for the time to come; and unless his divine nature had been manifested in the mission of the Spirit, and the collation of miraculous gifts, there had been no foundation for the propagation of the doctrine of redemption, and so that glorious work had lain wrapped up from human view.

The other was necessary as a ground of faith, and this was necessary to the declaration of the doctrine of faith, and an incentive to the embracing of it. Since he was shortly to die, and be executed under the notion of a criminal, a blasphemer, and a wicked man, if he were not raised again, not one would believe in him as mediator, and so the glory of the Father, and the salvation of the elect, had sunk with the glory of the Son.</p></blockquote>

Glorify him in a resurrection; glorify thy Son in his deity, by a manifestation of it; glorify thy Son in his humanity, by conferring new endowments of honour and immortality upon it. He prays here for a manifestation of the glory of his deity, which had been obscured, for an addition of glory to his humanity, which had not been yet enjoyed, by a resurrection and exaltation of it to the right hand of the Father. He prays for a manifestation of his deity: ‘Glorify thy Son.’

He was the Son of God by eternal generation; it is the glory of his deity therefore which is here desired by him. Not the essential glory of the Deity, for that could not be interrupted; not any addition to it, for, being infinite, he was not capable of it, but a manifestation of it; not simply in itself, but in his humanity, which had been veiled by the flesh ever since he emptied himself into it. He prays to be glorified in that state wherein he prays, which was a state of union with the human nature. His essential glory could suffer no detriment, his manifestative did.

As the sins of men are said to dishonour God, not that they detract from the glory of his essence, which cannot suffer any diminution by the sins of men, but as they deny and obscure the manifestation of his glory; the sun suffers no loss of light in its body by the veil of a thick cloud, but the brightness of his beams is masked. As the Father was to be glorified by Christ, so was Christ to be glorified by the Father. Now, the Father could not be glorified by the Son in a way of addition, but manifestation, causing the glory of God to break out upon the world, which had so long been obscured by an universal idolatry. He glorified the Father by a manifestation of his name, ver. 4; and in like manner is glorified by the Father in the manifestation of his deity.

That Christ prays here for the glory of his deity as well as of his humanity is evident, because he prays as mediator and priest, desiring a mediatory glory; but he was mediator and priest according to his divine as well as human nature, and therefore desires that he might be known to the world, not only to be a just and innocent man, but the eternal Son of God, the Redeemer of the world, the expiator of sins, and in that work infinitely delightful to the Father.

Glorify thy Son. Glorify him as thy Son, that as thy Son he may glorify thee. The Son of God was in the world as a great light in a dark lantern, clouded and covered with clay, that though the candle burned, it did not appear, but through some crannies. He desires that this thick mist might be dispersed, that the glory of his divinity might shine forth in his humanity, as a candle through polished glass.

The glory of Christ was to be manifested to be the Son of God: John i. 14, ‘We beheld his glory, the glory as of the only begotten of the Father;’ a glory in his resurrection, his ascension, in the” mission of the Spirit, which declared him to be no other than the only Son of God; and so verse 22 of this chapter is to be understood, ‘The glory which thou gavest me I have given them.’ As it is my glory to be the Son of God, so I have given them this glory, to be the sons of God by adoption, ‘that they may be one, as we are one;’ in the same relation of sonship, though in a different manner.

His petition for this glory he urgeth by two arguments :

(1.) One in ver. 1, ‘That thy Son also may glorify thee.’ The glory of the Father was concerned in it, whose justice, wisdom, love (and all the attributes so signally manifested in redemption), had lain under as great a disguise without the glory of Christ, as the deity of the Son did under the veil of his flesh.

(2.) Another, taken from the happiness and salvation of the elect, ver. 2, ‘As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him.’ Unless the humanity had been glorified by a resurrection, there would have been no assurance that the debt had been satisfied, and no sure ground of faith; unless he had been exalted to the right hand of God as an advocate, there had been no security for our debts.

His resurrection was necessary to make men believers for what was passed, his exaltation was necessary to make them comfortable believers for the time to come; and unless his divine nature had been manifested in the mission of the Spirit, and the collation of miraculous gifts, there had been no foundation for the propagation of the doctrine of redemption, and so that glorious work had lain wrapped up from human view.

The other was necessary as a ground of faith, and this was necessary to the declaration of the doctrine of faith, and an incentive to the embracing of it. Since he was shortly to die, and be executed under the notion of a criminal, a blasphemer, and a wicked man, if he were not raised again, not one would believe in him as mediator, and so the glory of the Father, and the salvation of the elect, had sunk with the glory of the Son.”

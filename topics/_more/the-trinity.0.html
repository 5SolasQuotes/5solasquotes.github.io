<blockquote><p>24. III. And the existence of this divine essence must be known by us in this gradual threefold conception: 1. In virtute (vel potentia) [in virtue or power], 2. In actu immanente [in an immanent act], 3. In actione transeunte [in a transitive action]. Of the first I shall say no more than what is said before. By the second I mean God’s own most perfect essence as active in itself, without extrinsic effect or object. By the third, I mean not the creature, or the divine action ut recipitur in passo [as it is received in the patient], or the effect, but the divine essence itself in the state of agency ad extra [toward what is outside]; which the schools conclude to be eternal, though the effect is but in time. Yet if any will call this a free and not a necessary state of the divine essence, I contend not.

25. IV. The essential immanent acts of God are three:

1. Sibi vivere [to live to Himself], or to be essential active life in Himself;

2. Se intelligere [to understand Himself], to know Himself;

3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

<blockquote><p>In the first book-length treatment of this doctrine, Adonis Vidu… engaging with recent and historical objections. Taking aim at a common ‘soft’ interpretation of the inseparability rule, according to which the divine persons merely cooperate and work in concert with one another, Vidu argues for the retrieval of ‘hard inseparability,’ which emphasizes the unity of divine action, primarily drawing from the patristic and medieval traditions. Having probed the biblical foundations of the rule and recounted the story of its emergence in nascent Trinitarianism and its neglect in modern theology, Vidu builds a constructive case for its retrieval. The rule is then tested precisely on the battlegrounds that were thought to have witnessed its defeat: the doctrines of creation, incarnation, atonement, ascension, and the indwelling of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/adonis-vidu.html">Adonis Vidu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Same God Who Works All Things</cite></span></figcaption>

<blockquote><p>For the works of the sacred Trinity are inseparable. When the Father is said to have created all things, the Word ought not to be excluded, by which, nor the Holy Spirit, with whom all things have been created. When we say that the sun cherishes and illuminates the earth (that I may speak by way of similitude) we exclude neither its heat, nor its splendor, without which it perfects not its work.</p></blockquote>

<blockquote><p>VII. The efficient cause of justification is God, considered both οὐσιωδῶς [ousiōdōs, essentially] and ὑπαρκτικῶς [hyparktikōs, subsistentially/personally]. Essentially, with respect to the whole complex — which, as a work ad extra [external work], is common to the three Persons of the Holy Trinity as to the ἀποτέλεσμα [apotelasma, effect] itself, yet remains distinct both in order and in mode of operation. Subsistentially, with respect to the parts of the complex: and thus to the Father is attributed the διακριτικός [diakritikos, distinguishing/decisive] act of justification, Rom. III.25; VIII.33; to the Son, the merit of justification, Isa. LIII.11; Matt. IX.6; and to the Holy Spirit, its application, 1 Cor. VI.11.</p></blockquote>

<blockquote><p>That man’s glorification shifts [the Christian’s] participation [in grace] towards perichoresis, or theosis, seals the Eastern Orthodox emphasis… In this paper I will argue that, from a Reformed perspective, man’s glorification through his communion and participation in the Trinity does lead to a oneness that is not perichoretic but is still advanced and fuller than earthly communion.</p></blockquote>

<blockquote><p>Prestige finds Christological perichoresis is no more than a“verbal formality,” adding nothing, and positively tending to monophysitism. My purpose hereis to propose the opposite view: Contra Prestige, Christology in the Damascene is actually anti-monophysite by design. Prestige on perichoresis is no longer tenable on three crucial points: 1) the meaning of perichoresis, 2) the philosophic background of perichoresis, and 3) the provenance of trinitarian perichoresis. None of these contentions is new, yet the implications of them taken together have not been fully realized in regards to the Damascene’s Christology. Contra Prestige, 1) the meaning “interpenetration” is early, not late, 2) the philosophic milieu is predominantly Stoic, not Aristotelian, and 3) the progenitor of trinitarian perichoresis is John of Damascus, not Pseudo-Cyril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/scott-ables.html">Scott Ables</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Anti-Monophysite Trinitarian Christology of John of Damascus’ a paper read at NAPS, Annual Meeting, Chicago</cite>, (2010), pp. 1-2</span></figcaption>

</figure><figure class="quote" id="q-698d53b4a3" data-kw="">
<blockquote><p>The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-persons.html">The Persons</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.”

— Andreas Beck, Other citations (work not named), ch. 13, ‘God, Creation, and Providence in Post-Reformation Reformed Theology’, p. 205 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformed+orthodox+did+not+only+deal+with+the+internal+distinguishing+marks+of+the+Trinitarian+persons%2C+but+also+with+their+outward+marks%2C+the+%E2%80%98oecumenical+offices+of+the+three+persons%2C%E2%80%99+as+Mastricht+labeled+them+%28Mastricht+1699%2C+238-40%3B+Neele+2009%2C+245-78%29.+These+outward+marks+concern+works+that+are+appropriated+to+specific+persons%2C+like+creation+preeminently+to+the+Father%2C+redemption+to+the+incarnate+Son%2C+and+sanctification+to+the+Holy+Spirit+%28Te+Velde+et+al.+2014%2C+192-93%29.+This+was+not+meant+to+deny+that+ultimately+all+Trinitarian+persons+participate+in+these+works%2C+in+accordance+with+the+rule+that+the+externally+directed+works+of+the+Trinity+are+undivided+%28opera+trinitatis+ad+extra+indivisa+sunt%29+%28Mastricht+1699%2C+239%29.+To+be+sure%2C+this+rule+applies+to+immanent+acts+that+are+directed+ad+extra%2C+like+the+divine+decrees+or+decisions%2C+just+as+to+the+external+divine+works+ad+extra%2C+like+creation+and+providence.%E2%80%9D%0A%0A%E2%80%94+Andreas+Beck%2C+Other+citations+%28work+not+named%29%2C+ch.+13%2C+%E2%80%98God%2C+Creation%2C+and+Providence+in+Post-Reformation+Reformed+Theology%E2%80%99%2C+p.+205+in+eds.+Lehner%2C+Muller%2C+Roeber%2C+The+Oxford+Handbook+of+Early+Modern+Theology%2C+1600-1800+%28Oxford%2C+2016%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F698d53b4a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/698d53b4a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-doctrine-of-appropriations/#:~:text=The%20Reformed%20orthodox%20did%20not%20only,ad%20extra%2C%20like%20creation%20and%20providence&a <blockquote><p>The will of God as to the peculiar actings on the Father in this matter [the eternal Trinitarian covenant] is the will of the Father, and the will of God with regard unto the peculiar acts of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son. And in this respect the covenant whereof we treat differs from a pure decree; for from these distinct actions of the will of God in the Father and the Son there does arise a new habitude or relation which is not natural or necessary unto them, but freely taken on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite></span></figcaption>

<blockquote><p>This union [of the person of the Son with the human nature in the inarnation] can be viewed either in respect of the principle or in respect of the terminus. In the former sense, it is attributed to the whole Trinity, by the power of which such union is made (to wit, by a transient action of God by which he united in the person of the Logos, the humanity of Christ). In the latter, it belongs to the Logos alone because it is terminated on him. Although the person of the Logos may well be said to have been incarnate, yet the Trinity itself may not because the incarnation is not terminated on the divine nature absolutely, but on the person of the Logos relatively.</p></blockquote>

</figure><figure class="quote" id="q-82f50666e6" data-kw="">
<blockquote><p>It is by means of the gospel that the Holy Spirit continues to apply Christ, with His righteousness and fullness, to the hearts of believers for increasing their sanctification and consolation. They are said in Scripture to be sanctified “through thy truth” (John 17:17–19), to be clean through the word that Christ has spoken to them (John 15:3), and to have their hearts purified by faith (Acts 15:9). The apostle Paul presented this prayer for the saints at Ephesus: “That Christ may dwell in your hearts by faith…that ye might be filled with all the fulness of God” (Eph. 3:17, 19). And he informed them that they were “built upon the foundation of the apostles and prophets” (Eph. 2:20). It is in proportion, then, as the saints are enabled to believe with application to themselves the offers and promises of the gospel and to trust in Jesus Christ for salvation that they advance in holiness and comfort. And it is “in the unity of the faith, and of the knowledge of the Son of God” that they all come “unto a perfect man, unto the measure of the stature of the fullness of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 110-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-3064968522" data-kw="">
<blockquote><p>In the course of time, then, the Father forsooth was born, and the Father suffered,—God Himself, the Lord Almighty, whom in their preaching they declare to be Jesus Christ. We, however, as we indeed always have done (and more especially since we have been better instructed by the Paraclete, who leads men indeed into all truth), believe that there is one only God, but under the following administration, or οἰκονομία, as it is called, that this one only God has also a Son, His Word, who proceeded from Himself, by whom all things were made, and without whom nothing was made. Him we believe to have been sent by the Father into the Virgin, and to have been born of her—being both Man and God, the Son of Man and the Son of God, and to have been called by the name of Jesus Christ; we believe Him to have suffered, died, and been buried, according to the Scriptures, and, after He had been raised again by the Father and taken back to heaven, to be sitting at the right hand of the Father, and that He will come to judge the quick and the dead; who sent also from heaven from the Father, according to His own promise, the Holy Spirit, the Paraclete, the sanctifier of the faith of those who believe in the Father, and in the Son, and in the Holy Spirit. That this rule of faith has come down to us from the beginning of the gospel, even before any of the older heretics, much more before Praxeas, a pretender of yesterday, will be apparent both from the lateness of date which marks all heresies, and also from the absolutely novel character of our new-fangled Praxeas. In this principle also we must henceforth find a presumption of equal force against all heresies whatsoever—that whatever is first is true, whereas that is spurious which is later in date. But keeping this prescriptive rule inviolate, still some opportunity must be given for reviewing (the statements of heretics), with a view to the instruction and protection of divers persons; were it only that it may not seem that each perversion of the truth is condemned without examination, and simply prejudged; especially in the case of this heresy, which supposes itself to possess the pure truth, in thinking that one cannot believe in One Only God in any other way than by saying that the Father, the Son, and the Holy Spirit are the very selfsame Person. As if in this way also one were not All, in that All are of One, by unity (that is) of substance; while the mystery of the dispensation is still guarded, which distributes the Unity into a Trinity, placing in their order the three Persons—the Father, the Son, and the Holy Spirit: three, however, not in condition, but in degree; not in substance, but in form; not in power, but in aspect; yet of one substance, and of one condition, and of one power, inasmuch as He is one God, from whom these degrees and forms and aspects are reckoned, under the name of the Father, and of the Son, and of the Holy Spirit. How they are susceptible of number without division, will be shown as our treatise proceeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Praxeas. in Latin Christianity</cite>, ed. Alexander Roberts, James Donaldson, and A. Cleveland Coxe, trans. Peter Holmes, vol. 3, The Ante-Nicene Fathers (Buffalo, NY: Christian Literature Company, 1885), 7 (p. 598).</span></figcaption>

ter+of+our+new-fangled+Praxeas.+In+this+principle+also+we+must+henceforth+find+a+presumption+of+equal+force+against+all+heresies+whatsoever%E2%80%94that+whatever+is+first+is+true%2C+whereas+that+is+spurious+which+is+later+in+date.+But+keeping+this+prescriptive+rule+inviolate%2C+still+some+opportunity+must+be+given+for+reviewing+%28the+statements+of+heretics%29%2C+with+a+view+to+the+instruction+and+protection+of+divers+persons%3B+were+it+only+that+it+may+not+seem+that+each+perversion+of+the+truth+is+condemned+without+examination%2C+and+simply+prejudged%3B+especially+in+the+case+of+this+heresy%2C+which+supposes+itself+to+possess+the+pure+truth%2C+in+thinking+that+one+cannot+believe+in+One+Only+God+in+any+other+way+than+by+saying+that+the+Father%2C+the+Son%2C+and+the+Holy+Spirit+are+the+very+selfsame+Person.+As+if+in+this+way+also+one+were+not+All%2C+in+that+All+are+of+One%2C+by+unity+%28that+is%29+of+substance%3B+while+the+mystery+of+the+dispensation+is+still+guarded%2C+which+distributes+the+Unity+into+a+Trinity%2C+placing+in+their+order+the+three+Persons%E2%80%94the+Father%2C+the+Son%2C+and+the+Holy+Spirit%3A+three%2C+however%2C+not+in+condition%2C+but+in+degree%3B+not+in+substance%2C+but+in+form%3B+not+in+power%2C+but+in+aspect%3B+yet+of+one+substance%2C+and+of+one+condition%2C+and+of+one+power%2C+inasmuch+as+He+is+one+God%2C+from+whom+these+degrees+and+forms+and+aspects+are+reckoned%2C+under+the+name+of+the+Father%2C+and+of+the+Son%2C+and+of+the+Holy+Spirit.+How+they+are+susceptible+of+number+without+division%2C+will+be+shown+as+our+treatise+proceeds.%E2%80%9D%0A%0A%E2%80%94+Tertullian%2C+Against+Praxeas.+in+Latin+Christianity%2C+ed.+Alexander+Roberts%2C+James+Donaldson%2C+and+A.+Cleveland+Coxe%2C+trans.+Peter+Holmes%2C+vol.+3%2C+The+Ante-Nicene+Fathers+%28Buffalo%2C+NY%3A+Christian+Literature+Company%2C+1885%29%2C+7+%28p.+598%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3064968522.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a c <blockquote><p>How can the Father send the Son, considering they are both one? Answer. In the doctrine touching the Trinity, nature and person must be distinguished. Nature is a substance common to many, as the Godhead. A person is that which subsists of itself and has a proper manner of subsisting, as the Father begetting, the Son begotten, the Holy Ghost proceeding. Now the Father and the Son are one indeed for nature or Godhead, but they are not one for person. Nay thus they are really distinct. The Father is not the Son, nor the Son the Father. And thus does the Father send the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 246.</span></figcaption>

<blockquote><p>Why is the Son so called? Answer. Because He was begotten of the Father by a perfect and eternal generation, not to be uttered of man or conceived. And we must be warned not to conceive it in any carnal or human manner. For an earthly father is in time before his son, and the son after. But God the Father and the Son are coeternal, and not one before or after the other for time. An earthly father is forth of [i.e., separate from] the son, and the son forth of the father. But God the Father is in the Son, and the Son in the Father. An earthly child is from his father by propagation, but the Son is from the heavenly Father not by propagation, but by communication of substance. Lastly, the heavenly Father begets the Son by communication of His whole substance, and so does no earthly father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 246.</span></figcaption>

</figure><figure class="quote" id="q-fde3152e82" data-kw="">
<blockquote><p>We shouldn’t doubt that the Holy Spirit lives in us, but we should certainly recognize that we are temples of the Holy Spirit, as Paul says in 1 Corinthians 6:19. If someone feels a love for God’s Word and gladly hears, speaks, thinks, teaches, and writes about Christ, you should know that this comes, not from a person’s will or reason, but from the Holy Spirit. It’s impossible for this to happen without the Holy Spirit. On the other hand, where there is hatred and contempt for the Word, we should know that the devil, the ruler of this world, blinds the hearts of the people and holds them captive so that the light of the gospel, the glory of Christ, can’t shine on them. We see this today in the masses who are not moved by the Word but despise it as if it has nothing to do with them. But those who have any kind of love and desire for the Word should gratefully acknowledge that these attitudes are poured into them by the Holy Spirit. For we are not born with these attitudes and cannot acquire them through the law. This transformation rests completely and absolutely in the hand of the Almighty. So when we eagerly listen to preaching about Jesus Christ, the Son of God—who for our sakes became a human being and subjected himself to the law to save us—then God sends the Holy Spirit into our hearts through this preaching. Therefore, it’s very useful for us to remember that we have the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone: A Daily Devotional</cite>, (p. 292). Zondervan. Kindle Edition.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-39ac191455" data-kw="">
<blockquote><p>What the New Testament ordinarily does is to state parts of the doctrine, so that when we put those parts together, and when we summarize them, we have the great doctrine of the three persons and one God. For example, all passages in the New Testament where the deity of Jesus Christ is set forth are, when taken in connection with passages setting forth the deity and personality of the Holy Spirit, passages supporting the doctrine of the Trinity. But what needs to be observed now is that although by far the larger part of the Biblical teaching about the Trinity is given in that incidental and partial way – presupposing the doctrine rather than formally enunciating it as a whole – yet there are some passages where the doctrine is definitely presented by the mention, together, of Father, Son and Holy Spirit.</p></blockquote>

<blockquote><p>CANON 4. If anyone maintains that God awaits our will to be cleansed from sin, but does not confess that even our will to be cleansed comes to us through the infusion and working of the Holy Spirit, he resists the Holy Spirit himself who says through Solomon, “The will is prepared by the Lord” (Prov. 8:35, LXX), and the salutary word of the Apostle, “For God is at work in you, both to will and to work for his good pleasure” (Phil. 2:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange</cite>, (AD 529)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“CANON 4. If anyone maintains that God awaits our will to be cleansed from sin, but does not confess that even our will to be cleansed comes to us through the infusion and working of the Holy Spirit, he resists the Holy Spirit himself who says through Solomon, “The will is prepared by the Lord” (Prov. 8:35, LXX), and the salutary word of the Apostle, “For God is at work in you, both to will and to work for his good pleasure” (Phil. 2:13).”

— Second Council of Orange, Canons And Decrees Of The Second Council Of Orange, (AD 529)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCANON+4.+If+anyone+maintains+that+God+awaits+our+will+to+be+cleansed+from+sin%2C+but+does+not+confess+that+even+our+will+to+be+cleansed+comes+to+us+through+the+infusion+and+working+of+the+Holy+Spirit%2C+he+resists+the+Holy+Spirit+himself+who+says+through+Solomon%2C+%E2%80%9CThe+will+is+prepared+by+the+Lord%E2%80%9D+%28Prov.+8%3A35%2C+LXX%29%2C+and+the+salutary+word+of+the+Apostle%2C+%E2%80%9CFor+God+is+at+work+in+you%2C+both+to+will+and+to+work+for+his+good+pleasure%E2%80%9D+%28Phil.+2%3A13%29.%E2%80%9D%0A%0A%E2%80%94+Second+Council+of+Orange%2C+Canons+And+Decrees+Of+The+Second+Council+Of+Orange%2C+%28AD+529%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F795d750eda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/795d750eda.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/09/second-council-of-orange-on-the-work-of-the-holy-spirit/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>XXVIII. This, then, is my position with regard to these things, and I hope it may be always my position, and that of whosoever is dear to me; to worship God the Father, God the Son, and God the Holy Ghost, Three Persons, One Godhead, undivided in honour and glory and substance and kingdom, as one of our own inspired philosophers not long departed shewed. Let him not see the rising of the Morning Star, as Scripture saith,2 nor the glory of its brightness, who is otherwise minded, or who follows the temper of the times, at one time being of one mind and of another at another time, and thinking unsoundly in the highest matters. For if He is not to be worshipped, how can He deify me by Baptism? but if He is to be worshipped, surely He is an Object of adoration, and if an Object of adoration He must be God; the one is linked to the other, a truly golden and saving chain. And indeed from the Spirit comes our New Birth, and from the New Birth our new creation, and from the new creation our deeper knowledge of the dignity of Him from Whom it is derived. XXIX. This, then, is what may be said by one who admits the silence of Scripture. But now the swarm of testimonies shall burst upon you from which the Deity of the Holy Ghost shall be shewn to all who are not excessively stupid, or else altogether enemies to the Spirit, to be most clearly recognized in Scripture. Look at these facts:—Christ is born; the Spirit is His Forerunner. He is baptized; the Spirit bears witness. He is tempted; the Spirit leads Him up.4 He works miracles; the Spirit accompanies them. He ascends; the Spirit takes His place. What great things are there in the idea of God which are not in His power? What titles which belong to God are not applied to Him, except only Unbegotten and Begotten? For it was needful that the distinctive properties of the Father and the Son should remain peculiar to Them, lest there should be confusion in the Godhead Which brings all things, even disorder itself, into due arrangement and good order. Indeed I tremble when I think of the abundance of the titles, and how many Names they outrage who fall foul of the Spirit. He is called the Spirit of God, the Spirit of Christ, the Mind of Christ, the Spirit of The Lord, and Himself The Lord, the Spirit of Adoption, of Truth, of Liberty; the Spirit of Wisdom, of Understanding, of Counsel, of Might, of Knowledge, of Godliness, of the Fear of God. For He is the Maker of all these, filling all with His Essence, containing all things, filling the world in His Essence, yet incapable of being comprehended in His power by the world; good, upright, princely, by nature not by adoption; sanctifying, not sanctified; measuring, not measured; shared, not sharing; filling, not filled; containing, not contained; inherited, glorified, reckoned with the Father and the Son; held out as a threat; the Finger of God; fire like God; to manifest, as I take it, His consubstantiality); the Creator-Spirit, Who by Baptism and by Resurrection creates anew; the Spirit That knoweth all things, That teacheth, That bloweth where and to what extent He listeth; That guideth, talketh, sendeth forth, separateth, is angry or tempted; That revealeth, illumineth, quickeneth, or rather is the very Light and Life; That maketh Temples; That deifieth; That perfecteth so as even to anticipate Baptism,8 yet after Baptism to be sought as a separate gift; That doeth all things that God doeth; divided into fiery tongues; dividing gifts; making Apostles, Prophets, Evangelists, Pastors, and Teachers; understanding manifold, clear, piercing, undefiled, unhindered, which is the same thing as Most wise and varied in His actions; and making all things clear and plain; and of independent power, unchangeable, Almighty, all-seeing, penetrating all spirits that are intelligent, pure, most subtle (the Angel Hosts I think); and also all prophetic spirits and apostolic in the same manner and not in the same places; for they lived in different places; thus showing that He is uncircumscript. XXX. They who say and teach these things, and moreover call Him another Paraclete in the sense of another God, who know that blasphemy against Him alone cannot be forgiven, and who branded with such fearful infamy Ananias and Sapphira for having lied to the Holy Ghost, what do you think of these men?11 Do they proclaim the Spirit God, or something else? Now really, you must be extraordinarily dull and far from the Spirit if you have any doubt about this and need some one to teach you. So important then, and so vivid are His Names. Why is it necessary to lay before you the testimony contained in the very words? And whatever in this case also is said in more lowly fashion, as that He is Given, Sent, Divided; that He is the Gift, the Bounty, the Inspiration, the Promise, the Intercession for us, and, not to go into any further detail, any other expressions of the sort, is to be referred to the First Cause, that it may be shewn from Whom He is, and that men may not in heathen fashion admit Three Principles. For it is equally impious to confuse the Persons with the Sabellians, or to divide the Natures with the Arians. XXXI. I have very carefully considered this matter in my own mind, and have looked at it in every point of view, in order to find some illustration of this most important subject, but I have been unable to discover any thing on earth with which to compare the nature of the Godhead. For even if I did happen upon some tiny likeness it escaped me for the most part, and left me down below with my example. I picture to myself an eye, a fountain, a river, as others have done before, to see if the first might be analogous to the Father, the second to the Son, and the third to the Holy Ghost. For in these there is no distinction in time, nor are they torn away from their connexion with each other, though they seem to be parted by three personalities. But I was afraid in the first place that I should present a flow in the Godhead, incapable of standing still; and secondly that by this figure a numerical unity would be introduced. For the eye and the spring and the river are numerically one, though in different forms. XXXII. Again I thought of the sun and a ray and light. But here again there was a fear lest people should get an idea of composition in the Uncompounded Nature, such as there is in the Sun and the things that are in the Sun. And in the second place lest we should give Essence to the Father but deny Personality to the Others, and make Them only Powers of God, existing in Him and not Personal. For neither the ray nor the light is another sun, but they are only effulgences from the Sun, and qualities of His essence. And lest we should thus, as far as the illustration goes, attribute both Being and Not-being to God, which is even more monstrous. I have also heard that some one has suggested an illustration of the following kind. A ray of the Sun flashing upon a wall and trembling with the movement of the moisture which the beam has taken up in mid air, and then, being checked by the hard body, has set up a strange quivering. For it quivers with many rapid movements, and is not one rather than it is many, nor yet many rather than one; because by the swiftness of its union and separating it escapes before the eye can see it. XXXIII. But it is not possible for me to make use of even this; because it is very evident what gives the ray its motion; but there is nothing prior to God which could set Him in motion; for He is Himself the Cause of all things, and He has no prior Cause. And secondly because in this case also there is a suggestion of such things as composition, diffusion, and an unsettled and unstable nature … none of which we can suppose in the Godhead. In a word, there is nothing which presents a standing point to my mind in these illustrations from which to consider the Object which I am trying to represent to myself, unless one may indulgently accept one point of the image while rejecting the rest. Finally, then, it seems best to me to let the images and the shadows go, as being deceitful and very far short of the truth; and clinging myself to the more reverent conception, and resting upon few words, using the guidance of the Holy Ghost, keeping to the end as my genuine comrade and companion the enlightenment which I have received from Him, and passing through this world to persuade all others also to the best of my power to worship Father, Son, and Holy Ghost, the One Godhead and Power. To Him belongs all glory and honour and might for ever and ever. Amen.</p></blockquote>

hem.+He+ascends%3B+the+Spirit+takes+His+place.+What+great+things+are+there+in+the+idea+of+God+which+are+not+in+His+power%3F+What+titles+which+belong+to+God+are+not+applied+to+Him%2C+except+only+Unbegotten+and+Begotten%3F+For+it+was+needful+that+the+distinctive+properties+of+the+Father+and+the+Son+should+remain+peculiar+to+Them%2C+lest+there+should+be+confusion+in+the+Godhead+Which+brings+all+things%2C+even+disorder+itself%2C+into+due+arrangement+and+good+order.+Indeed+I+tremble+when+I+think+of+the+abundance+of+the+titles%2C+and+how+many+Names+they+outrage+who+fall+foul+of+the+Spirit.+He+is+called+the+Spirit+of+God%2C+the+Spirit+of+Christ%2C+the+Mind+of+Christ%2C+the+Spirit+of+The+Lord%2C+and+Himself+The+Lord%2C+the+Spirit+of+Adoption%2C+of+Truth%2C+of+Liberty%3B+the+Spirit+of+Wisdom%2C+of+Understanding%2C+of+Counsel%2C+of+Might%2C+of+Knowledge%2C+of+Godliness%2C+of+the+Fear+of+God.+For+He+is+the+Maker+of+all+these%2C+filling+all+with+His+Essence%2C+containing+all+things%2C+filling+the+world+in+His+Essence%2C+yet+incapable+of+being+comprehended+in+His+power+by+the+world%3B+good%2C+upright%2C+princely%2C+by+nature+not+by+adoption%3B+sanctifying%2C+not+sanctified%3B+measuring%2C+not+measured%3B+shared%2C+not+sharing%3B+filling%2C+not+filled%3B+containing%2C+not+contained%3B+inherited%2C+glorified%2C+reckoned+with+the+Father+and+the+Son%3B+held+out+as+a+threat%3B+the+Finger+of+God%3B+fire+like+God%3B+to+manifest%2C+as+I+take+it%2C+His+consubstantiality%29%3B+the+Creator-Spirit%2C+Who+by+Baptism+and+by+Resurrection+creates+anew%3B+the+Spirit+That+knoweth+all+things%2C+That+teacheth%2C+That+bloweth+where+and+to+what+extent+He+listeth%3B+That+guideth%2C+talketh%2C+sendeth+forth%2C+separateth%2C+is+angry+or+tempted%3B+That+revealeth%2C+illumineth%2C+quickeneth%2C+or+rather+is+the+very+Light+and+Life%3B+That+maketh+Temples%3B+That+deifieth%3B+That+perfecteth+so+as+even+to+anticipate+Baptism%2C8+yet+after+Baptism+to+be+sought+as+a+separate+gift%3B+That+doeth+all+things+that+G st+important+subject%2C+but+I+have+been+unable+to+discover+any+thing+on+earth+with+which+to+compare+the+nature+of+the+Godhead.+For+even+if+I+did+happen+upon+some+tiny+likeness+it+escaped+me+for+the+most+part%2C+and+left+me+down+below+with+my+example.+I+picture+to+myself+an+eye%2C+a+fountain%2C+a+river%2C+as+others+have+done+before%2C+to+see+if+the+first+might+be+analogous+to+the+Father%2C+the+second+to+the+Son%2C+and+the+third+to+the+Holy+Ghost.+For+in+these+there+is+no+distinction+in+time%2C+nor+are+they+torn+away+from+their+connexion+with+each+other%2C+though+they+seem+to+be+parted+by+three+personalities.+But+I+was+afraid+in+the+first+place+that+I+should+present+a+flow+in+the+Godhead%2C+incapable+of+standing+still%3B+and+secondly+that+by+this+figure+a+numerical+unity+would+be+introduced.+For+the+eye+and+the+spring+and+the+river+are+numerically+one%2C+though+in+different+forms.+XXXII.+Again+I+thought+of+the+sun+and+a+ray+and+light.+But+here+again+there+was+a+fear+lest+people+should+get+an+idea+of+composition+in+the+Uncompounded+Nature%2C+such+as+there+is+in+the+Sun+and+the+things+that+are+in+the+Sun.+And+in+the+second+place+lest+we+should+give+Essence+to+the+Father+but+deny+Personality+to+the+Others%2C+and+make+Them+only+Powers+of+God%2C+existing+in+Him+and+not+Personal.+For+neither+the+ray+nor+the+light+is+another+sun%2C+but+they+are+only+effulgences+from+the+Sun%2C+and+qualities+of+His+essence.+And+lest+we+should+thus%2C+as+far+as+the+illustration+goes%2C+attribute+both+Being+and+Not-being+to+God%2C+which+is+even+more+monstrous.+I+have+also+heard+that+some+one+has+suggested+an+illustration+of+the+following+kind.+A+ray+of+the+Sun+flashing+upon+a+wall+and+trembling+with+the+movement+of+the+moisture+which+the+beam+has+taken+up+in+mid+air%2C+and+then%2C+being+checked+by+the+hard+body%2C+has+set+up+a+strange+quivering.+For+it+quivers+with+many+rapid+movements%2C+and+is+not+one+rather+than+it+is+many%2C+nor+yet+many+rather+than+one%3B+because+by+the+swiftness+of+its+union+and+separating+it+escapes+before+the+eye+can+see+it.+XXXIII.+But+it+is+not+possible+for+me+to+make+use+of+even+this%3B+because+it+is+very+evident+what+gives+the+ray+its+motion%3B+but+there+is+nothing+prior+to+God+which+could+set+Him+in+motion%3B+for+He+is+Himself+the+Cause+of+all+things%2C+and+He+has+no+prior+Cause.+And+secondly+because+in+this+case+also+there+is+a+suggestion+of+such+things+as+composition%2C+diffusion%2C+and+an+unsettled+and+unstable+nature+%E2%80%A6+none+of+which+we+can+suppose+in+the+Godhead.+In+a+word%2C+there+is+nothing+which+presents+a+standing+point+to+my+mind+in+these+illustrations+from+which+to+consider+the+Object+which+I+am+trying+to+represent+to+myself%2C+unless+one+may+indulgently+accept+one+point+of+the+image+while+rejecting+the+rest.+Finally%2C+then%2C+it+seems+best+to+me+to+let+the+images+and+the+shadows+go%2C+as+being+deceitful+and+very+far+short+of+the+truth%3B+and+clinging+myself+to+the+more+reverent+conception%2C+and+resting+upon+few+words%2C+using+the+guidance+of+the+Holy+Ghost%2C+keeping+to+the+end+as+my+genuine+comrade+and+companion+the+enlightenment+which+I+have+received+from+Him%2C+and+passing+through+this+world+to+persuade+all+others+also+to+the+best+of+my+power+to+worship+Father%2C+Son%2C+and+Holy+Ghost%2C+the+One+Godhead+and+Power.+To+Him+belongs+all+glory+and+honour+and+might+for+ever+and+ever.+Amen.%E2%80%9D%0A%0A%E2%80%94+Gregory+of+Nazianzus%2C+%E2%80%9COration+31%E2%80%9D+in+Select+Orations+of+Saint+Gregory+Nazianzen%2C+ed.+Philip+Schaff+and+Henry+Wace%2C+trans.+Charles+Gordon+Browne+and+James+Edward+Swallow%2C+vol.+7%2C+A+Select+Library+of+the+Nicene+and+Post-Nicene+Fathers+of+the+Christian+Church%2C+Second+Series+%28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F611adfb2af.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/611adfb2af.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/05/gregory-of-nazianzus-on-the-deity-of-the-holy-spirit-and-against-analogies-for-the-trinity/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-d403a142c2" data-kw="">
<blockquote><p>The Word is that through which the Holy Spirit commences and confirms faith in us, and for this reason, should go before the sacraments. The sacraments are means through which the Holy Spirit confirms faith already called into exercise, and for this reason ought to follow the Word. The reason of this difference is that the sacraments do not exert any influence unless they be understood. There is no desire for that which is unknown. There must, therefore, necessarily be some explanation of the sacraments out of the Word before they are observed. The case is different, however, in regard to the infants of the church: for in them the Holy Spirit neither begins, nor confirms faith by means of the Word; but by an inward working; and that because they are also included in the covenant and promise of God, being born in the Church.</p></blockquote>

</figure><figure class="quote" id="q-18a8af8811" data-kw="">
<blockquote><p>No amount of mere external evidence can produce genuine faith. The Israelites, who had seen a long succession of wonders in the land of Egypt, who had passed through the divided waters of the Red Sea, who were daily receiving by miracle food from heaven, who had trembled at the manifestations of the Divine majesty on Mount Sinai, within sight of that mountain made a golden calf their god. The men who saw the miracles of Christ performed almost daily in their presence, cried out, ‘Crucify him! Crucify him!’ Hence our Saviour said, that those who hear not ‘Moses and the prophets, neither will they be persuaded, though one rose from the dead.’ We may confidently conclude, therefore, that those who now believe not the gospel, would not be persuaded had they seen all the miracles which Christ performed. It is important that the attention of the doubting should be directed to the fact, that their want of faith is to be attributed to their own moral state, and not to any deficiency in the evidence of the truth. ‘If the gospel be hid,’ says the apostle, ‘it is hid to them that are lost: in whom the god of this world hath blinded the minds of them which believe not, lest the light of the glorious gospel of Christ, who is the image of God, should shine unto them’ (2 Cor. 4:3, 4).</p></blockquote>

</figure><figure class="quote" id="q-e039eac94b" data-kw="">
<blockquote><p>This righteousness then, which God communicates to man, and accepts alone, and owns as righteousness, has been revealed, he says, without the law, that is, without the aid of the law; and the law is to be understood as meaning works; for it is not proper to refer this to its teaching, which he immediately adduces as bearing witness to the gratuitous righteousness of faith. Some confine it to ceremonies; but this view I shall presently show to be unsound and frigid. We ought then to know, that the merits of works are excluded. We also see that he blends not works with the mercy of God; but having taken away and wholly removed all confidence in works, he sets up mercy alone. It is not unknown to me, that Augustine gives a different explanation; for he thinks that the righteousness of God is the grace of regeneration; and this grace he allows to be free, because God renews us, when unworthy, by his Spirit; and from this he excludes the works of the law, that is, those works, by which men of themselves endeavour, without renovation, to render God indebted to them. (Deum promereri—to oblige God.) I also well know, that some new speculators proudly adduce this sentiment, as though it were at this day revealed to them. But that the Apostle includes all works without exception, even those which the Lord produces in his own people, is evident from the context.</p></blockquote>

elblog.net/2017/05/calvin-paul-excludes-all-works-even-those-wrought-by-the-spirit/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>We may now readily perceive the difference between the Essence of God, and the Persons, subsisting in the divine essence. By the term, Essence, we are to understand, in reference to this subject, that which the eternal Father, Son, and Holy Spirit are considered, and declared to be, singly and absolutely in themselves, and which is common to the three. By the term, Person, however, we are to understand that which the three persons of the Godhead are considered and declared to be individually and relatively, or as compared with each other, and which they are according to the mode of existence peculiar to each. Or, we may define Essence as the very being of God—the very, eternal, and only Deity—whilst the term Person refers to the mode, or manner, in which the being of God, or the divine essence, subsists in each of these three. God the Father is that Being who is of himself, and not from another. The Son is that self-same Being, or essence, not of himself, but of the Father. The Holy Spirit is in like manner the self-same Being, not of himself, but from the Father and the Son. Thus the Being, or divine essence, of there persons of the Godhead is one and the same in number. But to be of himself, or from another—from one, or from two; that is, to have this one divine essence of himself, or to have it communicated from another—from one or from two, expresses the mode of existence which is three-fold and distinct; to wit, to be of himself, to be begotten or generated, and to proceed; and hence, the three persons which are expressed by the term, Trinity.</p></blockquote>

<blockquote><p>Question 24. How are these articles divided? Answer. Into three parts: the first is of God the Father, and our creation; the second of God the Son, and our redemption; the third of God the Holy Spirit, and our sanctification. Exposition There are three principal parts included in the Apostles’ creed: The first treats of God the Father and our creation; The second of God the Son, and our redemption; The third of God the Holy Ghost, and our sanctification. Objection.

1. Creation is here attributed to the Father, redemption to the Son, and sanctification to the Holy Spirit. Therefore the Son and the Holy Spirit did not create heaven and earth; neither did the Father and the Holy Spirit redeem the human race; nor do the Father and the Son sanctify the faithful. Answer. We deny the consequence which is here deduced, because the creed attributes creation to the Father, redemption to the Son, and sanctification to the Holy Spirit, not exclusively, or in such a manner as that these works do not belong to all the persons of the God head. For the Father also redeems us, because “he delivered up his Son for us;” “sent his son into the world, that the world through him might be saved.” (Rom. 8:32. John 3:17.) The Father also sanctifies us according to what Paul says: “God hath sent the Spirit of his Son into your hearts, crying, Abba, Father.” “The very God of peace sanctify you wholly.” (Gal. 4:6. 1 Thes. 5:23.) So the Son creates us, for “all things were made by him.” (John 1:3.) He also sanctifies us, because “he is made unto us, of God, sanctification.” (1 Cor. 1:30.) He “sanctifies and cleanses the church with the washing of water, by the word.” (Eph. 5:26.) He gives the Holy Spirit, for he says: “I will send the comforter,” etc. “He hath shed forth this which you now see and hear.” (Acts. 2:33.) The same thing is also to be said of the Holy Spirit, for he also created the heavens and the earth. “The Spirit of God moved upon the face of the waters.” “By the word of the Lord were the heavens made, and all the hosts of them, by the breath of his mouth.” (Gen. 1:2. Ps. 33:6.) In making this distinction, however, we must not overlook the distinction and the order of working which is peculiar to the persons of the Godhead. The work of creation is attributed to the Father, not exclusively, nor to him alone, but because he is the fountain of Divinity, and of all divine works, and so of creation; for he created of himself all things by the Son and Holy Spirit. Redemption is attributed to the Son, not exclusively, nor to him alone, but because the Son is that person who immediately performs the work of redemption; for the Son alone was made a ransom for our sins. It was the Son, and not the Father, or the Holy Spirit, that purchased us by his death upon the cross. So in like manner sanctification is attributed to the Holy Spirit, not exclusively, nor to him alone, but because the Holy Spirit is that person who immediately sanctifies us, or because it is through him that our sanctification is immediately effected. Objection.

2. The works which the persons of the Godhead perform out of themselves, that is, such as they perform in reference to creatures, are indivisible, that is, they cannot be attributed to any one person of the Trinity without respect to the other persons. Creation, redemption, and sanctification, are works which are external to the Godhead. Therefore they are indivisible, and consequently there is no need of this distinction. Answer. We reply to the major proposition: The works of the Trinity are indivisible, but not in such a sense as to destroy the order and manner of working peculiar to each person of the Godhead. All the persons of the Godhead perform certain works in reference to creatures, but yet this order is preserved, that the Father does all things of himself through the Son and Holy Spirit; the Son does all things of the Father through the Holy Spirit; and the Holy Spirit does all things of the Father and the Son through himself. In this way, therefore, all the persons of the Godhead create, redeem, and sanctify; the Father mediately through the Son and Holy Spirit; the Son mediately through the Holy Spirit; and the Holy Spirit immediately through himself, but mediately through the Son, as he is the Mediator. But the works of the Godhead, which are called works ad extra and ad intra, will be explained under the seventh division of the doctrine concerning God.</p></blockquote>

ere+is+no+need+of+this+distinction.+Answer.+We+reply+to+the+major+proposition%3A+The+works+of+the+Trinity+are+indivisible%2C+but+not+in+such+a+sense+as+to+destroy+the+order+and+manner+of+working+peculiar+to+each+person+of+the+Godhead.+All+the+persons+of+the+Godhead+perform+certain+works+in+reference+to+creatures%2C+but+yet+this+order+is+preserved%2C+that+the+Father+does+all+things+of+himself+through+the+Son+and+Holy+Spirit%3B+the+Son+does+all+things+of+the+Father+through+the+Holy+Spirit%3B+and+the+Holy+Spirit+does+all+things+of+the+Father+and+the+Son+through+himself.+In+this+way%2C+therefore%2C+all+the+persons+of+the+Godhead+create%2C+redeem%2C+and+sanctify%3B+the+Father+mediately+through+the+Son+and+Holy+Spirit%3B+the+Son+mediately+through+the+Holy+Spirit%3B+and+the+Holy+Spirit+immediately+through+himself%2C+but+mediately+through+the+Son%2C+as+he+is+the+Mediator.+But+the+works+of+the+Godhead%2C+which+are+called+works+ad+extra+and+ad+intra%2C+will+be+explained+under+the+seventh+division+of+the+doctrine+concerning+God.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Body+of+Orthodox+Doctrine+of+the+Explication+of+the+Catechism%2C+on+Q.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff3d4ab9a37.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f3d4ab9a37.html">Permalink</a><a class="src" href="https://heidelblog.net/2017/02/ursinus-on-the-persons-works-and-unity-of-the-trinity/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>As we said above, so now we repeat, that the divine generation must not be compared to the nature of men, nor the Son considered to be part of God, nor the generation to imply any passion whatever; God is not as man; for men beget passibly, having a transitive nature, which waits for periods by reason of its weakness. But with God this cannot be; for He is not composed of parts, but being impassible and simple, He is impassibly and indivisibly Father of the Son.</p></blockquote>

<blockquote><p>As to the eternal generation of the Son, it is generally explained in this manner. The Father is called by some, ‘the fountain of the Godhead,’ an expression taken from some of the fathers who defended the Nicene faith. But others, of late, have rather chosen to call the Father the fountain of the Trinity; and he is said to be of himself, or unbegotten. This they state as his personal character, distinct from that of the Son. On the other hand, the Son, as to his personality, is generally described as being from the Father. Many choose to express themselves about this mystery in these terms,—‘the Father communicated the divine essence to the Son.’ This is the most common mode of speaking; though others think it safer to say, that he communicated the divine personality to him. I cannot tell, however, which is least exceptionable. But when I find others using the phrase, ‘the Father gave the divine essence to the Son,’ their mode of speaking being founded, as they apprehend, on that scripture, ‘As the Father hath life in himself, so hath he given to the Son to have life in himself,’ I cannot but think it is an unguarded expression, and foreign to the design of the Holy Ghost in that scripture, as will be hereafter considered. The Arians are ready to insult us upon such modes of speaking, and suppose us to conclude that the Son receives his divine perfections, and therefore cannot be God equal with the Father. None of those, however, who use such expressions, suppose that the Son’s deity is founded on the arbitrary will of the Father; for they all assert that the divine nature is communicated necessarily, and from all eternity, as the sun communicates its rays necessarily, which are of equal duration with it. Hence, while they make use of a word which, according to its most known acceptation, seems subversive of the truth, they happily, for truth’s sake, explain away the proper sense of it; so that all they can be blamed for by the adversary, is an impropriety of expression. Again, others speak a little more exceptionably, when, explaining the eternal generation of the Son, they say that the Father produced him. But this idea they also happily explain away; saying that the production of which they speak, is not such as in the case of the cause producing the effect. Some of the fathers, indeed, who have been in the Trinitarian scheme, have unwarily called the Father the cause of the Son. Yet our modern divines seldom or never use that expression; or, if they speak of an eternal production, they suppose it to differ vastly from the production of creatures, or from production in that sense in which the Arians suppose the Son to be produced. The expression, however, had certainly better be laid aside, lest it should be thought that we conclude the Son not equally necessary, and, from all eternity, co-existent with the Father; which our divines, how unwarily soever in other respects they may express themselves, are very far from denying,</p></blockquote>

<blockquote><p>c. The eternal generation of the Son. The personal property of the Son is that He is eternally begotten of the Father (briefly called “filiation”), and shares with the Father in the spiration of the Spirit. The doctrine of the generation of the Son is suggested by the Biblical representation of the first and second persons of the Trinity as standing in the relation of Father and Son to each other. Not only do the names “Father” and “Son” suggest the generation of the latter by the former, but the Son is also repeatedly called “the only-begotten,” John 1:14, 18; 3:16, 18; Heb. 11:17; 1 John 4:9. Several particulars deserve emphasis in connection with the generation of the Son: (1) It is a necessary act of God. Origen, one of the very first to speak of the generation of the Son, regarded it as an act dependent on the Father’s will and therefore free. Others at various times expressed the same opinion. But it was clearly seen by Athanasius and others that a generation dependent on the optional will of the Father would make the existence of the Son contingent and thus rob Him of His deity. Then the Son would not be equal to and homoousios with the Father, for the Father exists necessarily, and cannot be conceived of as non-existent. The generation of the Son must be regarded as a necessary and perfectly natural act of God. This does not mean that it is not related to the Father’s will in any sense of the word. It is an act of the Father’s necessary will, which merely means that His concomitant will takes perfect delight in it. (2) It is an eternal act of the Father. This naturally follows from the preceding. If the generation of the Son is a necessary act of the Father, so that it is impossible to conceive of Him as not generating, it naturally shares in the eternity of the Father. This does not mean, however, that it is an act that was completed in the far distant past, but rather that it is a timeless act, the act of an eternal present, an act always continuing and yet ever completed. Its eternity follows not only from the eternity of God, but also from the divine immutability and from the true deity of the Son. In addition to this it can be inferred from all those passages of Scripture which teach either the pre-existence of the Son or His equality with the Father, Mic. 5:2; John 1:14, 18; 3:16; 5:17, 18, 30, 36; Acts 13:33; John 17:5; Col. 1:16; Heb. 1:3. The statement of Ps. 2:7, “Thou art my Son; this day have I begotten thee,” is generally quoted to prove the generation of the Son, but, according to some, with rather doubtful propriety, cf. Acts 13:33; Heb. 1:5. They surmise that these words refer to the raising up of Jesus as Messianic King, and to the recognition of Him as Son of God in an official sense, and should probably be linked up with the promise found in 2 Sam. 7:14, just as they are in Heb. 1:5. (3) It is a generation of the personal subsistence rather than of the divine essence of the Son. Some have spoken as if the Father generated the essence of the Son, but this is equivalent to saying that He generated His own essence, for the essence of both the Father and the Son is exactly the same. It is better to say that the Father generates the personal subsistence of the Son, but thereby also communicates to Him the divine essence in its entirety. But in doing this we should guard against the idea that the Father first generated a second person, and then communicated the divine essence to this person, for that would lead to the conclusion that the Son was not generated out of the divine essence, but created out of nothing. In the work of generation there was a communication of essence; it was one indivisible act. And in virtue of this communication the Son also has life in Himself. This is in agreement with the statement of Jesus, “For as the Father hath life in Himself, even so gave He to the Son also to have life in Himself,” John 5:26. (4) It is a generation that must be conceived of as spiritual and divine. In opposition to the Arians, who insisted that the generation of the Son necessarily implied separation or division in the divine Being, the Church Fathers stressed the fact that this generation must not be conceived in a physical and creaturely way, but should be regarded as spiritual and divine, excluding all idea of division or change. It brings distinctio and distributio, but no diversitas and divisio in the divine Being. (Bavinck) The most striking analogy of it is found in man’s thinking and speaking, and the Bible itself seems to point to this, when it speaks of the Son as the Logos. (5) The following definition may be given of the generation of the Son: It is that eternal and necessary act of the first person in the Trinity, whereby He, within the divine Being, is the ground of a second personal subsistence like His own, and puts this second person in possession of the whole divine essence, without any division, alienation, or change</p></blockquote>

of an eternal present, an act always continuing and yet ever completed. Its eternity follows not only from the eternity of God, but also from the divine immutability and from the true deity of the Son. In addition to this it can be inferred from all those passages of Scripture which teach either the pre-existence of the Son or His equality with the Father, Mic. 5:2; John 1:14, 18; 3:16; 5:17, 18, 30, 36; Acts 13:33; John 17:5; Col. 1:16; Heb. 1:3. The statement of Ps. 2:7, “Thou art my Son; this day have I begotten thee,” is generally quoted to prove the generation of the Son, but, according to some, with rather doubtful propriety, cf. Acts 13:33; Heb. 1:5. They surmise that these words refer to the raising up of Jesus as Messianic King, and to the recognition of Him as Son of God in an official sense, and should probably be linked up with the promise found in 2 Sam. 7:14, just as they are in Heb. 1:5. (3) It is a generation of the personal subsistence rather than of the divine essence of the Son. Some have spoken as if the Father generated the essence of the Son, but this is equivalent to saying that He generated His own essence, for the essence of both the Father and the Son is exactly the same. It is better to say that the Father generates the personal subsistence of the Son, but thereby also communicates to Him the divine essence in its entirety. But in doing this we should guard against the idea that the Father first generated a second person, and then communicated the divine essence to this person, for that would lead to the conclusion that the Son was not generated out of the divine essence, but created out of nothing. In the work of generation there was a communication of essence; it was one indivisible act. And in virtue of this communication the Son also has life in Himself. This is in agreement with the statement of Jesus, “For as the Father hath life in Himself, even so gave He to the Son also to have life in Himself,” John 5:26. (4) It is a generation that must be conceived of as spiritual and divine. In opposition to the Arians, who insisted that the generation of the Son necessarily implied separation or division in the divine Being, the Church Fathers stressed the fact that this generation must not be conceived in a physical and creaturely way, but should be regarded as spiritual and divine, excluding all idea of division or change. It brings distinctio and distributio, but no diversitas and divisio in the divine Being. (Bavinck) The most striking analogy of it is found in man’s thinking and speaking, and the Bible itself seems to point to this, when it speaks of the Son as the Logos. (5) The following definition may be given of the generation of the Son: It is that eternal and necessary act of the first person in the Trinity, whereby He, within the divine Being, is the ground of a second personal subsistence like His own, and puts this second person in possession of the whole divine essence, without any division, alienation, or change”

— Louis Berkhof, Systematic Theology, (Grand Rapids, MI: Wm. B. Eerdmans publishing co., 1938), 93–94">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cc.+The+eternal+generation+of+the+Son.+The+personal+property+of+the+Son+is+that+He+is+eternally+begotten+of+the+Father+%28briefly+called+%E2%80%9Cfiliation%E2%80%9D%29%2C+and+shares+with+the+Father+in+the+spiration+of+the+Spirit.+The+doctrine+of+the+generation+of+the+Son+is+suggested+by+the+Biblical+representation+of+the+first+and+second+persons+of+the+Trinity+as+standing+in+the+relation+of+Father+and+Son+to+each+other.+Not+only+do+the+names+%E2%80%9CFather%E2%80%9D+and+%E2%80%9CSon%E2%80%9D+suggest+the+generation+of+the+latter+by+the+former%2C+but+the+Son+is+also+repeatedly+called+%E2%80%9Cthe+only-begotten%2C%E2%80%9D+John+1%3A14%2C+18%3B+3%3A16%2C+18%3B+Heb.+11%3A17%3B+1+John+4%3A9.+Several+particulars+deserve+emphasis+in+connection+with+the+generation+of+the+Son%3A+%281%29+It+is+a+necessary+act+of+God.+Origen%2C+one+of+the+very+first+to+speak+of+the+generation+of+the+Son%2C+regarded+it+as+an+act+dependent+on+the+Father%E2%80%99s+will+and+therefore+free.+Others+at+various+times+expressed+the+same+opinion.+But+it+was+clearly+seen+by+Athanasius+and+others+that+a+generation+dependent+on+the+optional+will+of+the+Father+would+make+the+existence+of+the+Son+contingent+and+thus+rob+Him+of+His+deity.+Then+the+Son+would+not+be+equal+to+and+homoousios+with+the+Father%2C+for+the+Father+exists+necessarily%2C+and+cannot+be+conceived+of+as+non-existent.+The+generation+of+the+Son+must+be+regarded+as+a+necessary+and+perfectly+natural+act+of+God.+This+does+not+mean+that+it+is+not+related+to+the+Father%E2%80%99s+will+in+any+sense+of+the+word.+It+is+an+act+of+the+Father%E2%80%99s+necessary+will%2C+which+merely+means+that+His+concomitant+will+takes+perfect+delight+in+it.+%282%29+It+is+an+eternal+act+of+the+Father.+This+naturally+follows+from+the+preceding.+If+the+generation+of+the+Son+is+a+necessary+act+of+the+Father%2C+so+that+it+is+impossible+to+conceive+of+Him+as+not+generating%2C+it+naturally+shares+in+the+eternity+of+the+Father.+This+does+not+mean%2C+however%2C+that+it+is+an+act+that+was+completed+in+the+far+distant+past%2C+but+rather+that+it+is+a+timeless+act%2C+the+act+of+an+eternal+present%2C+an+act+always+continuing+and+yet+ever+completed.+Its+eternity+follows+not+only+from+the+eternity+of+God%2C+but+also+from+the+divine+immutability+and+from+the+true+deity+of+the+Son.+In+addition+to+this+it+can+be+inferred+from+all+those+passages+of+Scripture+which+teach+either+the+pre-existence+of+the+Son+or+His+equality+with+the+Father%2C+Mic.+5%3A2%3B+John+1%3A14%2C+18%3B+3%3A16%3B+5%3A17%2C+18%2C+30%2C+36%3B+Acts+13%3A33%3B+John+17%3A5%3B+Col.+1%3A16%3B+Heb.+1%3A3.+The+statement+of+Ps.+2%3A7%2C+%E2%80%9CThou+art+my+Son%3B+this+day+have+I+begotten+thee%2C%E2%80%9D+is+generally+quoted+to+prove+the+generation+of+the+Son%2C+but%2C+according+to+some%2C+with+rather+doubtful+propriety%2C+cf.+Acts+13%3A33%3B+Heb.+1%3A5.+They+surmise+that+these+words+refer+to+the+raising+up+of+Jesus+as+Messianic+King%2C+and+to+the+recognition+of+Him+as+Son+of+God+in+an+official+sense%2C+and+should+probably+be+linked+up+with+the+promise+found+in+2+Sam.+7%3A14%2C+just+as+they+are+in+Heb.+1%3A5.+%283%29+It+is+a+generation+of+the+personal+subsistence+rather+than+of+the+divine+essence+of+the+Son.+Some+have+spoken+as+if+the+Father+generated+the+essence+of+the+Son%2C+but+this+is+equivalent+to+saying+that+He+generated+His+own+essence%2C+for+the+essence+of+both+the+Father+and+the+Son+is+exactly+the+same.+It+is+better+to+say+that+the+Father+generates+the+personal+subsistence+of+the+Son%2C+but+thereby+also+communicates+to+Him+the+divine+essence+in+its+entirety.+But+in+doing+this+we+should+guard+against+the+idea+that+the+Father+first+generated+a+second+person%2C+and+then+communicated+the+divine+essence+to+this+person%2C+for+that+would+lead+to+the+conclusion+that+the+Son+was+not+generated+out+of+the+divine+essence%2C+but+created+out+of+nothing.+In+the+work+of+generation+there+was+a+communication+of+essence%3B+it+was+one+indivisible+act.+And+in+virtue+of+this+communication+the+Son+also+has+life+in+Himself.+This+is+in+agreement+with+the+statement+of+Jesus%2C+%E2%80%9CFor+as+the+Father+hath+life+in+Himself%2C+even+so+gave+He+to+the+Son+also+to+have+life+in+Himself%2C%E2%80%9D+John+5%3A26.+%284%29+It+is+a+generation+that+must+be+conceived+of+as+spiritual+and+divine.+In+opposition+to+the+Arians%2C+who+insisted+that+the+generation+of+the+Son+necessarily+implied+separation+or+division+in+the+divine+Being%2C+the+Church+Fathers+stressed+the+fact+that+this+generation+must+not+be+conceived+in+a+physical+and+creaturely+way%2C+but+should+be+regarded+as+spiritual+and+divine%2C+excluding+all+idea+of+division+or+change.+It+brings+distinctio+and+distributio%2C+but+no+diversitas+and+divisio+in+the+divine+Being.+%28Bavinck%29+The+most+striking+analogy+of+it+is+found+in+man%E2%80%99s+thinking+and+speaking%2C+and+the+Bible+itself+seems+to+point+to+this%2C+when+it+speaks+of+the+Son+as+the+Logos.+%285%29+The+following+definition+may+be+given+of+the+generation+of+the+Son%3A+It+is+that+eternal+and+necessary+act+of+the+first+person+in+the+Trinity%2C+whereby+He%2C+within+the+divine+Being%2C+is+the+ground+of+a+second+personal+subsistence+like+His+own%2C+and+puts+this+second+person+in+possession+of+the+whole+divine+essence%2C+without+any+division%2C+alienation%2C+or+change%E2%80%9D%0A%0A%E2%80%94+Louis+Berkhof%2C+Systematic+Theology%2C+%28Grand+Rapids%2C+MI%3A+Wm.+B.+Eerdmans+publishing+co.%2C+1938%29%2C+93%E2%80%9394&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F710c8b7e2a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/710c8b7e2a.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/06/berkhof-on-the-eternal-generation-of-the-son/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Now, over against all those who want to base the doctrine of the Trinity on rational grounds, we must undoubtedly maintain that we owe our knowledge of this doctrine solely to God’s special revelation. Scripture alone is the final ground for the doctrine of the Trinity. Reason can at most somewhat clarify this doctrine a posteriori. Nevertheless, the arguments advanced to shed light on the dogma of the Trinity are not devoid of all value. In the first place, Scripture itself gives us the freedom to use them when it says that the entire creation and especially humankind is a work of the triune God. Certainly, all God’s works ad extra are undivided and common to all three persons. Prominent in these works, therefore, is the oneness of God rather than the distinction of the persons. In this unity, however, the diversity cannot be lacking. For Scripture itself points to this truth by saying that all created beings will show these imprints and human beings will exhibit the image of the triune God. Hence, however much the revelation of God in his works has been shrouded and our mind’s eye has been darkened by sin, it cannot a priori be denied that the mind, illumined by revelation, can discover in nature the imprints of the God whom it has come to know from Scripture as triune in his mode of existence and actions. Furthermore, though none of these arguments is capable of proving the dogma of the Trinity, and none can or may be the basis for our faith (we would be abandoning the truth to the ridicule of our opponents if we accepted it on such feeble grounds as reason can produce), yet these arguments can serve to refute various objections that have been lodged against the dogma.214 They can show that what Scripture teaches us is neither impossible nor absurd and demonstrate that the belief of our opponents is ill-grounded and contrary to reason itself.</p></blockquote>

<blockquote><p>XIX. The glory of his Person may be considered, partly in reference to the divine nature; partly, to the human. The former is nothing else than a most illustrious assertion, vindication, and display of the Divine majesty of Christ, reflected from the glory of the human nature. During his abode on the earth, the Son of God had so concealed his glory under the vail of his humbled flesh, that only a few faint rays, despised by the generality of spectators, appeared. But now, in his glorified humanity, he shines forth like the sun, having, by his bright and exalted lustre, dispelled the clouds of his obscure and debased condition; and declares, in a striking and glorious manner, that the Son of man is the Son of God, and truly God. This was the matter of his request in the following solemn prayer: “And now, O Father, glorify thou me with thine own self, with the glory which I had with thee, before the world was.” That is, “Gloriously declare that I am thine eternal and only-begotten Son:”—which the Father has done chiefly by setting him at his right hand, as the place of the highest dignity and glory.</p></blockquote>

<blockquote><p>[226] The special qualification of the second person in the Trinity is filiation. In Scripture he bears several names that denote his relation to the Father, such as word, wisdom, logos, son, the firstborn, only-begotten and only son, the image of God, image (εἱκων), substance (ὑποστασις), stamp (χαρακτηρ) [cf. Heb. 1:3]. The doctrine of “eternal generation” (αἰωνος γεννησις), so called for the first time by Origen, was based on these names and a few texts cited above. In using these terms we are of course speaking in a human and hence an imperfect language, a fact that makes us cautious. Yet we have the right to speak this language. For just as the Bible speaks analogically of God’s ear, eye, and mouth, so human generation is an analogy and image of the divine deed by which the Father gives the Son “to have life in himself.” But when we resort to this imagery, we must be careful to remove all associations with imperfection and sensuality from it. The generation of a human being is imperfect and flawed. A husband needs a wife to bring forth a son. No man can ever fully impart his image, his whole nature, to a child or even to many children. A man becomes a father only in the course of time and then stops being a father, and a child soon becomes wholly independent from and self-reliant vis-à-vis his or her father. But it is not so with God. Generation occurs also in the divine being. God’s fecundity is a beautiful theme, one that frequently recurs in the church fathers. God is no abstract, fixed, monadic, solitary substance, but a plenitude of life. It is his nature (οὐσια) to be generative (γεννητικη) and fruitful (καρπογονος). It is capable of expansion, unfolding, and communication. Those who deny this fecund productivity fail to take seriously the fact that God is an infinite fullness of blessed life. All such people have left is an abstract deistic concept of God, or to compensate for this sterility, in pantheistic fashion they include the life of the world in the divine being. Apart from the Trinity even the act of creation becomes inconceivable. For if God cannot communicate himself, he is a darkened light, a dry spring, unable to exert himself outward to communicate himself to creatures. Still, that generation is to be conceived in divine terms. In the first place, it is spiritual The Arians, in opposing the idea of divine generation, objected that all generation necessarily brings along with it separation (τομη) and division (διαιρεσις), passion (παθος) and emanation (ἀπορροια). And that would be correct if it were physical, sensual, and creaturely. But it is spiritual, divine, and therefore simple, without division (ἀρρευστως) or separation (ἀδιαιρετως). It occurs without flux and division. While giving rise to distinction and distribution in the divine being, it does not create divergence and division. Athanasius writes: “Inasmuch as God is simple, the Father of the Son is indivisible and without passion, for although in the case of humans we speak of outflow and inflow, we cannot predicate these things of anything that is incorporeal.”120 The most striking analogy of divine generation is thought and speech, and Scripture itself suggests this when it calls the Son “Logos” [Speech, Word, Reason]. Just as the human mind objectivizes itself in speech, so God expresses his entire being in the Logos [Christ]. But here, too, we must note the difference. Humans need many words to express their ideas. These words are sounds and therefore material, sense-related. They have no existence by themselves. But when God speaks, he totally expresses himself in the one person of the Logos, whom he also “granted to have life in himself” (John 5:26 NIV). In the second place, therefore, divine generation implies that the Father begets the Son out of the being of the Father, “God of God, Light of Light, very God of very God; begotten, not made, being of one substance with the Father,” as the Nicene symbol has it. The Arians, by contrast, contended that the Son had been brought forth by the will of the Father out of nothing. This, however, is not generation but creation, as John of Damascus points out. Creation is “the bringing into being, from the outside and not from the substance of the Creator, of something created and made entirely dissimilar [in substance],” while “begetting” means “producing of the substance of the begetter an offspring similar in substance to the begetter.” The Son is not a creature but he is “God over all, forever praised!” (Rom. 9:5 NIV). Accordingly, he was not brought forth by the will of the Father out of nothing and in time. Rather, he is generated out of the being of the Father in eternity. Hence, instead of viewing “generation” as an actual work, a performance (ἐνεργεια), of the Father, we should ascribe to the Father “a generative nature” (φυσις γεννητικη). This is not to say, of course, that the generation is an unconscious and unwilled emanation, occurring apart from the will and power of the Father. It is not an act of an antecedent decreeing will, like creation, but one that is so divinely natural to the Father that his concomitant will takes perfect delight in it. It is a manifestation of what is truly expressive of his nature and essence, and therefore also of his knowledge, will, and power, in fact of all his virtues. In the third place, therefore, the church confesses its belief in the eternal character of this generation. The Arians said that there was a time when the Son did not exist (ἠν ποτε ὁτε οὐκ ἠν). They appealed especially to the words “he brought me forth,” or “created me” in Proverbs 8:22, and pointed out the antinomy between the terms “eternal” (αἰωνος) and “begetting” (γεννησις). But if the “Father” and the “Son” bear their names in a metaphysical sense, as Scripture incontrovertibly teaches, it follows that the generation in question has to be eternal as well. For if the Son is not eternal, then of course God is not the eternal Father either. In that case he was God before he was Father, and only later—in time—became Father. Hence, rejection of the eternal generation of the Son involves not only a failure to do justice to the deity of the Son, but also to that of the Father. It makes him changeable, robs him of his divine nature, deprives him of the eternity of his fatherhood, and leaves unexplained how God can truly and properly be called “Father” in time if the basis for calling him “Father” is not eternally present in his nature. We must, accordingly, conceive that generation as being eternal in the true sense of the word. It is not something that was completed and finished at some point in eternity, but an eternal unchanging act of God, at once always complete and eternally ongoing. Just as it is natural for the sun to shine and for a spring to pour out water, so it is natural for the Father to generate the Son. The Father is not and never was ungenerative; he begets everlastingly. “The Father did not by a single act beget the Son and then release him from his ‘genesis,’ but generates him perpetually.” For God to beget is to speak, and his speaking is eternal. God’s offspring is eternal.</p></blockquote>

<blockquote><p>That Christ is Deus de Deo, God of God, is thus clearly proved out of Scripture; whosoever is God and the Son of God, must needs be God of God; but Christ is God and the Son of God, ergo &amp;c. But it hath been objected, if he be God of God, then he must have his essence communicated to him from the Father, and so be essentiatus a patre, essentiated, or natured from the Father: this will not follow, no more then that Socrates is essentiatus a Sophronisco, but only that he is genitus a patre, begotten of his Father, and so is recipiens essentiam, or habens essentiam communicatam a patre; which manner of speech is approved of by Beza, filius est a patre per ineffabilem totius essentiae communicationem ab aeterno: the Son is from the Father by an unspeakable communication of his whole essence from eternity: and Symlerus, non negamus silium haberea essentiam a Deo patre, sed essentiam genitam negamus: we do not deny that the Son hath his essence from God the Father, but we deny that the essence is begotten, and why should we boggle at this phrase, when our Lord himself acknowledgeth, Ioh. 5.26. omnia mihi data sunt a patre meo, &amp; pater dedit filio habere vitam in se, all things are given me of my Father?

Neither doth this any way contradict Calvin his autotheos, God of himself; which form of expression, though some protestants as well as papists have excepted against, yet I am of [William] Whitaker’s mind, in his answer to the 7th reason of Campian, that it is verissime &amp; sanstissime dictum, most truly and religiously spoken; nam si ex se Deus non est, omnino Deus non est: for if he be not God of himself, he is not God at all: let St Augustine be the umpire, and reconcile both, Christus ad se Deus, dicitur ad patrem filius; Christ may be considered two ways, either absolutely, and so he is Deus ex se, God of himself, as the Father is and the holy Spirit; or relatively, as filius, and so he is Deus de Deo, as he is the Son, so he is God of God: yea but these phrases may be taken in an ill sense, and so may all the Articles of the Creed, as you may see in the Parisian censure set out by the Jesuits; nay so may the whole Scripture, as St Peter teacheth us, which … the ignorant &amp; unstable pervert: what then, must we weed up all the flowers of Paradise, because heretics, like spiders, suck such juice out of them which they turn into poison?</p></blockquote>

<blockquote><p>If, then, the Holy Spirit is truly, and not in name only, called Divine both by Scripture and by our Fathers, what ground is left for those who oppose the glory of the Spirit? He is Divine, and absolutely good, and Omnipotent, and wise, and glorious, and eternal; He is everything of this kind that can be named to raise our thoughts to the grandeur of His being. The singleness of the subject of these properties testifies that He does not possess them in a measure only, as if we could imagine that He was one thing in His very substance, but became another by the presence of the aforesaid qualities.

That condition is peculiar to those beings who have been given a composite nature; whereas the Holy Spirit is single and simple in every respect equally. This is allowed by all; the man who denies it does not exist. If, then, there is but one simple and single definition of His being, the good which He possesses is not an acquired good; but, whatever He may be besides, He is Himself Goodness, and Wisdom, and Power, and Sanctification, and Righteousness, and Everlastingness, and Imperishability, and every name that is lofty, and elevating above other names.

What, then, is the state of mind that leads these men, who do not fear the fearful sentence passed upon the blasphemy against the Holy Ghost, to maintain that such a Being does not possess glory? For they clearly put that statement forward; that we ought not to believe that He should be glorified: though I know not for what reason they judge it to be expedient not to confess the true nature of that which is essentially glorious.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If, then, the Holy Spirit is truly, and not in name only, called Divine both by Scripture and by our Fathers, what ground is left for those who oppose the glory of the Spirit? He is Divine, and absolutely good, and Omnipotent, and wise, and glorious, and eternal; He is everything of this kind that can be named to raise our thoughts to the grandeur of His being. The singleness of the subject of these properties testifies that He does not possess them in a measure only, as if we could imagine that He was one thing in His very substance, but became another by the presence of the aforesaid qualities.

That condition is peculiar to those beings who have been given a composite nature; whereas the Holy Spirit is single and simple in every respect equally. This is allowed by all; the man who denies it does not exist. If, then, there is but one simple and single definition of His being, the good which He possesses is not an acquired good; but, whatever He may be besides, He is Himself Goodness, and Wisdom, and Power, and Sanctification, and Righteousness, and Everlastingness, and Imperishability, and every name that is lofty, and elevating above other names.

What, then, is the state of mind that leads these men, who do not fear the fearful sentence passed upon the blasphemy against the Holy Ghost, to maintain that such a Being does not possess glory? For they clearly put that statement forward; that we ought not to believe that He should be glorified: though I know not for what reason they judge it to be expedient not to confess the true nature of that which is essentially glorious.”

<blockquote><p>The Father, Son, and Spirit, (betwixt whom was the council of peace) work out their design in a perfect harmony and consent: as there was no jar in their council, so there can be none in the execution of it: those whom the Father, before all time, did chose; they, and they only, are the persons, whom the Son, when the fulness of time for the execution of that decree was come, died for, John xvii. 6. “I have manifested thy name unto the men, which thou gavest me out of the world; thine they were, and thou gavest them me;” and ver. 19. “For their sakes I sanctify myself;” i.e. consecrate, devote, or set myself apart for a sacrifice for them.

And those for whom Christ died, are the persons to whom the Spirit effectually applies the benefits and purchases of his blood: he comes in the name of the Father and Son. “But the world cannot receive him, for it neither sees, nor knows him,” John xiv. 17. “They that are not of Christ’s sheep, believe not,” John x. 26.</p></blockquote>

<blockquote><p>IV. The essential proprieties in God do not in very deed differ from the essence.

For we acknowledge that in God for his singleness the essential proprieties do not in deed differ from the essence and therefore they without this cannot be communicated to any creature, and therefore no creature can be or can be said to be (for example sake) omnipotent simply, just, wise or such like. Even as our Lord Jesus speaking of one propriety, teacheth of them all saying: ‘None is good (simply) but God’.

V. That nothing is or can be made simply such as God is, unless the same might simply be God.

Wherefore, they which will affirm that any created substance ever could or can be made partaker of those divine proprieties whereby it should be such as God is, as simply omnipotent and such like, they must needs then confess that the same is or that it can be ὁμοούσιον, of the same substance with God, forasmuch as neither the Son himself is simply omnipotent, but as he is ὁμοούσιον, consubstantial with the Father, nor yet the Holy Spirit.

VI. A confirmation of the former opinion.

Whereupon we also understand, how it is that sith the Son is no less omnipotent then the Father and so likewise the Holy Ghost, yet we do not say that they are three almighties, but we confess with Athanasius and the whole church, that they are one only almighty, because indeed of them all there is but one and the self same substance. Therefore seeing no creature hath one and the self same essence with God, but a far other and diverse, and if the same by communication of the divine omnipotency could also be made omnipotent, then it must follow that there might be more almighties then one, which we believe can not without blasphemy be affirmed.

VII. Errors.

Wherefore we condemn and detest all heresies, which have risen against this first article of our faith or have sprong from hell and been condemned by the holie fathers in their lawful councils, as those of Cerinthus, Ebion, Valentinus, Marcion, Manichaeus, Arius, Eunomius, Sabellius, Praxea, Fotinus and such like as Servetus and Tritheitae, also the blasphemies of Jews and Turks [Muslims].

And lastly all heresies which have been invented by the devil, either against the unity of the divine essence or against the true Trinity of persons. Yea, and those therefore which deny either the Son to be true and everlasting God or the Holie ghost to be so, or which do confound these persons and say they bee one and the self same existence, which for divers respects is called by diverse names of Father, Son, and Holy Ghost.

We also condemn all those errors which do separate the essential proprieties of God from the divine essence, which it seemeth unto us that these men very unadvisedly do, which teach that those essential proprieties in very deed may be communicated or rather are already communicated to creatures without communication of the essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), II.IV-VII, 1: 131-37.</span></figcaption>

<blockquote><p>Humility.—A measure of this grace is to be expected in every true Christian: but it can only appear in proportion to the knowledge they have of Christ and of their own hearts. It is a part of C’s [1] daily employment to look back upon the way by which the Lord has led him; and while he reviews the Ebenezers he has set up all along the road, he sees, in almost an equal number, the monuments of his own perverse returns, and how he has in a thousand instances rendered to the Lord evil for good. Comparing these things together, he can without affectation adopt the Apostle’s language, and style himself “less than the least of all saints, and of sinners the chief.”

A and B know that they ought to be humbled; but C is truly so, and feels the force of that text which I mentioned in my last; Ezek. xvi. 63. Again, as he knows most of himself, so he has seen most of the Lord. The apprehension of infinite Majesty combined with infinite Love, makes him shrink into the dust. From the exercise of this grace he derives two others, which are exceedingly ornamental, and principal branches of the mind which was in Christ.

The one is, submission to the will of God. The views he has of his own vileness, unworthiness, and ignorance, and of the Divine sovereignty, wisdom, and love, teach him to be content in every state, and to bear his appointed lot of suffering with resignation, according to the language of David in a time of affliction, “I was dumb, and opened not my mouth, because thou didst it.”

The other is, tenderness of spirit towards his fellow-Christians. He cannot but judge of their conduct according to the rule of the word. But his own heart, and the knowledge he has acquired of the snares of the world, and the subtilty of Satan, teach him to make all due allowances, and qualify him for admonishing and restoring, in the spirit of meekness, those who have been overtaken in a fault. Here A is usually blameable; the warmth of his zeal, not being duly corrected by a sense of his own imperfections, betrays him often into a censorious spirit. But C can bear with A likewise, because he has been so himself, and he will not expect green fruit to be ripe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-newton.html">John Newton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter XII, Forty-One Letters on Religious Subjects</cite></span></figcaption>

<blockquote><p>If any should wrangle for the expressions that are used by Divines in this Mystery; we confess that many of the Schoolmen have exceeded, and have taken too much liberty in this wonderful Mystery; yet, it is the thing that we especially should be established into, and from Scripture that is clear, that there is but One God, and yet Three, who being denominated in the concrete, must imply three different real Relations, or Subsistences, or Persons: and this Essence being infinite and communicable, there is no warrant to bound it to the rules and properties of created beings, who are but finite; and in that respect also incommunicable:

And we conceive that the names here given (and elsewhere in Scripture) will amount clearly to the equivalent of Essence and Persons, which are most obviously made use of in this matter: for, what is that, I am Alpha and Omega, who was, is, and is to come, but that same, Exod. 3. I AM THAT I AM, which denoteth His Being or Essence, as that which is ever a Being: and Idols, being differenced from the true. God by this, that they are by Nature no gods, Gal. 4.8. it implies on the contrary, that by Nature He is God, and so God in respect of His Essence: and therefore that God may be essentially considered, and in that respect of His Essence.

Again, these expressions, that the one is called the Father, and the other the Son, and yet both One God, do clearly hold forth that there are real relations in that Godhead, subsisting in a distinct manner; and so there must be Persons, as Heb. 1. the Son, is called the express Image of the Father’s Person, which plainly says, that the Father, considered as distinguished from the Son, is a Person, and subsists; and that the Son, as distinguished from the Father, and as so lively and expressly representing His Person, must be a Person also, having this from the Father: and what is said of the Father and Son, must also be true of the holy Ghost, who is God equal with both, yet different from Them both, as They differ from each other, though not in respect of that same incommunicable property, yet he who proceedeth, must differ from those from whom he proceeds, as he who is begotten, must differ from him that begat him.

For Their operations, we may find here, that in some things They concur jointly, yet some way differently. Some things again are attributed to one, which cannot be to another, as their personal properties; the Son is begotten, and not the Father or the Spirit: therefore He is allanerly [only] the Son: the Father begets; and the Spirit proceeds. These are called Their personal properties, and Their works ad intra, or amongst, or in reference to Themselves: of this kind is the incarnation of the Son, which can neither be said of the Father, nor of the holy Ghost.

Again, in things ad extra, or that relate to the Creatures simply, whether in making, or governing of the World, They jointly concur: the Father createth all, so doth the Son and holy Ghost; the Son, from the Father, by the holy Ghost; the holy Ghost, from the Father and the Son, as those expressions of God, sending His Son, the Son’s sending the Spirit from the Father, &amp;c. do declare, Joh. 14.26. and 16.7. Gal. 4.6.</p></blockquote>

<blockquote><p>The redemption of sinners originated in the free and sovereign love of God, the Father, Son and Holy Spirit, whose love is one, though exerted variously, according to the order of their subsistence, in the voluntarily established economy of grace. The love of the Father has been justly called “the eternal disposing cause of redemption,” and to it accordingly is ascribed in Scripture the purpose of saving sinners, the selection of the objects of mercy, the appointment of the means, and the predestinating of the elect, in the Mediator, to the enjoyment of eternal life.

The love of the Son is the eternal spring of all that God did in the impetration of redemption; as the love of the Spirit is the spring of its application. And in the manifestation of the love of Christ we see also that of the Father and of the Spirit. While we are warranted to take a distinct view of divine love as displayed by each person of the adorable Trinity, we can thus view it as the love of one glorious being. We do not detract from the love of the Father and Spirit, when we say, “Unto him that loved us, and washed us from our sins in his own blood—be glory and dominion for ever and ever. Amen.</p></blockquote>

<blockquote><p>There are three distinct Persons of the blessed Trinity, the Father, Son, and Spirit, who are the same one God: in the Name of these Three, is Baptism administrated; and from Them, Grace is wished and prayed for, 2 Cor, 13.14. For, 1. That there are Three, who are distinctly mentioned here, cannot be denied; that the first is the Father; and the third, Jesus Christ, really distinct from the Father, is clear: for, the Son, and not the Father, was incarnate: and therefore the like must be said of the seven Spirits, that they set forth the Holy Ghost personally, seeing it is He who in the like places useth to be joined in with the Father and the Son, as 2 Cor. 13.13. 1 Joh. 5.7, 8. and therefore it’s said in the seven Epistles, to be what the Spirit saith. These Seven Spirits therefore, is that one Spirit, and He a person that speaketh to the Churches.

Secondly, That each of these Three must be God, appears, 1. Because the last Two are both joined as equal with the Father, of whom there can be no question. 2. Because the Son, Jesus Christ, afterward hath the same Title attributed to Him, which is here given to the Father. 3. Because the same one suit, is prayed for from all of them; and, it being Grace and Peace, which only God can give, suppones [supposes] divine essential Attributes to be in those from whom they are wished: yea, They are named here, as joint Senders of this Epistle, and Authorizers of this Word; therefore is it so often afterward said, Let him that hath ears, hear what the Spirit saith: and there can no Authority but what is divine, be sufficient here. Hence also, Thus saith the Lord, and, thus saith the Holy Ghost, are frequently put for one another: each one therefore of these Three must be God. 3. It may appear from this also, that all these Three are One God, thus, This Revelation and Salutation cometh from one God, chap. 1. ver. 1. and 22. 18, 19. and yet this Revelation and Salutation cometh from the Father, Son, and Spirit: therefore They are that One God.

Again, If the Grace and Peace proceed from one Essence, which is common to all, then they are the same God essentially, though distinct Persons; but Grace and Peace looks to the same Godhead and Essence, though it be wished for from all, for the effect, Grace and Peace, is but one, it doth therefore suppose an unity in the fountain from which it comes, to wit, these Three Persons of the glorious Godhead, who are named distinctly, not to shew a different effect from the Father, which is not from the Son; but to shew the concurrence of these blessed Three in an united way for bringing forth of these; so that what cometh from the Father, cometh also from the Son and Spirit.

These essential Attributes, and that most simple and infinite Essence, being common to all the Three Persons, it rests therefore that they are Three distinct Persons, and yet of the same infinite Godhead. Neither will that which the Socinians and others oppose to this place, have weight. Say they, Christ is spoken of here, as dead; Therefore cannot be God. For, it’s one thing to speak of Him who was dead, another to say that it speaks of Him as such. He that died was God, but He died not as God: and therefore this can only prove, that Jesus Christ, as to His Person, is man; but by it, we can no more deny Him to be the second Person of the Godhead, than afterward when He is called the first and the last, by that, we can deny Him to be man. And that the Son, and the Holy Ghost, are equal with the Father, appeareth also in this, That they are both equally with Him, the object of divine Worship here, to wit, of Invocation and Prayer, which could not otherwise be.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“There are three distinct Persons of the blessed Trinity, the Father, Son, and Spirit, who are the same one God: in the Name of these Three, is Baptism administrated; and from Them, Grace is wished and prayed for, 2 Cor, 13.14. For, 1. That there are Three, who are distinctly mentioned here, cannot be denied; that the first is the Father; and the third, Jesus Christ, really distinct from the Father, is clear: for, the Son, and not the Father, was incarnate: and therefore the like must be said of the seven Spirits, that they set forth the Holy Ghost personally, seeing it is He who in the like places useth to be joined in with the Father and the Son, as 2 Cor. 13.13. 1 Joh. 5.7, 8. and therefore it’s said in the seven Epistles, to be what the Spirit saith. These Seven Spirits therefore, is that one Spirit, and He a person that speaketh to the Churches.

Secondly, That each of these Three must be God, appears, 1. Because the last Two are both joined as equal with the Father, of whom there can be no question. 2. Because the Son, Jesus Christ, afterward hath the same Title attributed to Him, which is here given to the Father. 3. Because the same one suit, is prayed for from all of them; and, it being Grace and Peace, which only God can give, suppones [supposes] divine essential Attributes to be in those from whom they are wished: yea, They are named here, as joint Senders of this Epistle, and Authorizers of this Word; therefore is it so often afterward said, Let him that hath ears, hear what the Spirit saith: and there can no Authority but what is divine, be sufficient here. Hence also, Thus saith the Lord, and, thus saith the Holy Ghost, are frequently put for one another: each one therefore of these Three must be God. 3. It may appear from this also, that all these Three are One God, thus, This Revelation and Salutation cometh from one God, chap. 1. ver. 1. and 22. 18, 19. and yet this Revelation and Salutation cometh from the Father, Son, and Spirit: therefore They are that One God.

Again, If the Grace and Peace proceed from one Essence, which is common to all, then they are the same God essentially, though distinct Persons; but Grace and Peace looks to the same Godhead and Essence, though it be wished for from all, for the effect, Grace and Peace, is but one, it doth therefore suppose an unity in the fountain from which it comes, to wit, these Three Persons of the glorious Godhead, who are named distinctly, not to shew a different effect from the Father, which is not from the Son; but to shew the concurrence of these blessed Three in an united way for bringing forth of these; so that what cometh from the Father, cometh also from the Son and Spirit.

These essential Attributes, and that most simple and infinite Essence, being common to all the Three Persons, it rests therefore that they are Three distinct Persons, and yet of the same infinite Godhead. Neither will that which the Socinians and others oppose to this place, have weight. Say they, Christ is spoken of here, as dead; Therefore cannot be God. For, it’s one thing to speak of Him who was dead, another to say that it speaks of Him as such. He that died was God, but He died not as God: and therefore this can only prove, that Jesus Christ, as to His Person, is man; but by it, we can no more deny Him to be the second Person of the Godhead, than afterward when He is called the first and the last, by that, we can deny Him to be man. And that the Son, and the Holy Ghost, are equal with the Father, appeareth also in this, That they are both equally with Him, the object of divine Worship here, to wit, of Invocation and Prayer, which could not otherwise be.”

— James Durham, A commentary upon the book of the Revelation Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfille, (Edinburgh: Christopher Higgins, 1658), pp 5-6.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+are+three+distinct+Persons+of+the+blessed+Trinity%2C+the+Father%2C+Son%2C+and+Spirit%2C+who+are+the+same+one+God%3A+in+the+Name+of+these+Three%2C+is+Baptism+administrated%3B+and+from+Them%2C+Grace+is+wished+and+prayed+for%2C+2+Cor%2C+13.14.+For%2C+1.+That+there+are+Three%2C+who+are+distinctly+mentioned+here%2C+cannot+be+denied%3B+that+the+first+is+the+Father%3B+and+the+third%2C+Jesus+Christ%2C+really+distinct+from+the+Father%2C+is+clear%3A+for%2C+the+Son%2C+and+not+the+Father%2C+was+incarnate%3A+and+therefore+the+like+must+be+said+of+the+seven+Spirits%2C+that+they+set+forth+the+Holy+Ghost+personally%2C+seeing+it+is+He+who+in+the+like+places+useth+to+be+joined+in+with+the+Father+and+the+Son%2C+as+2+Cor.+13.13.+1+Joh.+5.7%2C+8.+and+therefore+it%E2%80%99s+said+in+the+seven+Epistles%2C+to+be+what+the+Spirit+saith.+These+Seven+Spirits+therefore%2C+is+that+one+Spirit%2C+and+He+a+person+that+speaketh+to+the+Churches.%0A%0ASecondly%2C+That+each+of+these+Three+must+be+God%2C+appears%2C+1.+Because+the+last+Two+are+both+joined+as+equal+with+the+Father%2C+of+whom+there+can+be+no+question.+2.+Because+the+Son%2C+Jesus+Christ%2C+afterward+hath+the+same+Title+attributed+to+Him%2C+which+is+here+given+to+the+Father.+3.+Because+the+same+one+suit%2C+is+prayed+for+from+all+of+them%3B+and%2C+it+being+Grace+and+Peace%2C+which+only+God+can+give%2C+suppones+%5Bsupposes%5D+divine+essential+Attributes+to+be+in+those+from+whom+they+are+wished%3A+yea%2C+They+are+named+here%2C+as+joint+Senders+of+this+Epistle%2C+and+Authorizers+of+this+Word%3B+therefore+is+it+so+often+afterward+said%2C+Let+him+that+hath+ears%2C+hear+what+the+Spirit+saith%3A+and+there+can+no+Authority+but+what+is+divine%2C+be+sufficient+here.+Hence+also%2C+Thus+saith+the+Lord%2C+and%2C+thus+saith+the+Holy+Ghost%2C+are+frequently+put+for+one+another%3A+each+one+therefore+of+these+Three+must+be+God.+3.+It+may+appear+from+this+also%2C+that+all+these+Three+are+One+God%2C+thus%2C+This+Revelation+and+Salutation+cometh+from+one+God%2C+chap.+1.+ver.+1.+and+22.+18%2C+19.+and+yet+this+Revelation+and+Salutation+cometh+from+the+Father%2C+Son%2C+and+Spirit%3A+therefore+They+are+that+One+God.%0A%0AAgain%2C+If+the+Grace+and+Peace+proceed+from+one+Essence%2C+which+is+common+to+all%2C+then+they+are+the+same+God+essentially%2C+though+distinct+Persons%3B+but+Grace+and+Peace+looks+to+the+same+Godhead+and+Essence%2C+though+it+be+wished+for+from+all%2C+for+the+effect%2C+Grace+and+Peace%2C+is+but+one%2C+it+doth+therefore+suppose+an+unity+in+the+fountain+from+which+it+comes%2C+to+wit%2C+these+Three+Persons+of+the+glorious+Godhead%2C+who+are+named+distinctly%2C+not+to+shew+a+different+effect+from+the+Father%2C+which+is+not+from+the+Son%3B+but+to+shew+the+concurrence+of+these+blessed+Three+in+an+united+way+for+bringing+forth+of+these%3B+so+that+what+cometh+from+the+Father%2C+cometh+also+from+the+Son+and+Spirit.%0A%0AThese+essential+Attributes%2C+and+that+most+simple+and+infinite+Essence%2C+being+common+to+all+the+Three+Persons%2C+it+rests+therefore+that+they+are+Three+distinct+Persons%2C+and+yet+of+the+same+infinite+Godhead.+Neither+will+that+which+the+Socinians+and+others+oppose+to+this+place%2C+have+weight.+Say+they%2C+Christ+is+spoken+of+here%2C+as+dead%3B+Therefore+cannot+be+God.+For%2C+it%E2%80%99s+one+thing+to+speak+of+Him+who+was+dead%2C+another+to+say+that+it+speaks+of+Him+as+such.+He+that+died+was+God%2C+but+He+died+not+as+God%3A+and+therefore+this+can+only+prove%2C+that+Jesus+Christ%2C+as+to+His+Person%2C+is+man%3B+but+by+it%2C+we+can+no+more+deny+Him+to+be+the+seco <blockquote><p>They accuse us of profanity for entertaining lofty conceptions about the Holy Spirit. All that we, in following the teachings of the Fathers, confess as to the Spirit, they take in a sense of their own, and make it a handle against us, to denounce us for profanity. We, for instance, confess that the Holy Spirit is of the same rank as the Father and the Son, so that there is no difference between them in anything, to be thought or named, that devotion can ascribe to a Divine nature.

We confess that, save His being contemplated as with peculiar attributes in regard of Person, the Holy Spirit is indeed from God, and of the Christ, according to Scripture, but that, while not to be confounded with the Father in being never originated, nor with the Son in being the Only-begotten, and while to be regarded separately in certain distinctive properties, He has in all else, as I have just said, an exact identity with them.</p></blockquote>

<blockquote><p>Grace and Peace, two words, which comprehend all good: Grace, is the fountain of Gods free love; and Peace, the effect of that free love: which being here put together, is love, vented in its precious effects. The Persons from whom, are Three, or, the Three Persons of the Trinity, 1. From the Father, which is, which was, and which is to come, that is, from God the Father, described from His eternal being, without all beginning or ending.

And this description of the Father, relates to that of Exod. 3.14. I AM THAT I AM, hath sent me unto you: and it is a name that God often taketh to Himself, The first and the last, the beginning and the ending: and the Title JEHOVAH taketh up these three; JE, the future time; HO, the time present; VAH, the time past. In a word, it’s the paraphrase of the word JEHOVAH: and this title is attributed to the Father, not secluding the Son and Holy Ghost; but the Father, being the fountain of the Godhead, when He is joined with the Son and Spirit, those things that are essential to God, are ordinarily attributed to Him.</p></blockquote>

<blockquote><p>What do you call Persons in the Godhead?

Ans. Such as having one Essence or being equally common, are distinguished (not divided) one from another by some incommunicable property.

How cometh it to pass that there should be this diversity of Persons in the Godhead?

Ans. Though the Essence or being of the Godhead be the same, and most simply as hath been declared; yet the manner of this being is not the same, and hence ariseth the distinction of persons, in that beside the being which is common to all, and the self-same in all, they have every one some especial property which cannot be common to the rest.

Which are these persons, and what are these personal Properties?

Ans. The first Person in order is the Father, who begetteth the Son. The second is, the Son begotten of the Father. The third is, the Holy-Ghost, proceeding from the Father and the Son.

Doth the Godhead of the Father beget the God-head of the Son?

Ans. No, but the Person of the Father begetteth the Person of the Son.</p></blockquote>

— James Ussher, The Principles of Christian Religion Summarily set down according to the Word of God: together with A Brief Epitome of the Body of Divinity, (London: Geo. Badger, 1645), pp 55-57.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+do+you+call+Persons+in+the+Godhead%3F%0A%0AAns.+Such+as+having+one+Essence+or+being+equally+common%2C+are+distinguished+%28not+divided%29+one+from+another+by+some+incommunicable+property.%0A%0AHow+cometh+it+to+pass+that+there+should+be+this+diversity+of+Persons+in+the+Godhead%3F%0A%0AAns.+Though+the+Essence+or+being+of+the+Godhead+be+the+same%2C+and+most+simply+as+hath+been+declared%3B+yet+the+manner+of+this+being+is+not+the+same%2C+and+hence+ariseth+the+distinction+of+persons%2C+in+that+beside+the+being+which+is+common+to+all%2C+and+the+self-same+in+all%2C+they+have+every+one+some+especial+property+which+cannot+be+common+to+the+rest.%0A%0AWhich+are+these+persons%2C+and+what+are+these+personal+Properties%3F%0A%0AAns.+The+first+Person+in+order+is+the+Father%2C+who+begetteth+the+Son.+The+second+is%2C+the+Son+begotten+of+the+Father.+The+third+is%2C+the+Holy-Ghost%2C+proceeding+from+the+Father+and+the+Son.%0A%0ADoth+the+Godhead+of+the+Father+beget+the+God-head+of+the+Son%3F%0A%0AAns.+No%2C+but+the+Person+of+the+Father+begetteth+the+Person+of+the+Son.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+The+Principles+of+Christian+Religion+Summarily+set+down+according+to+the+Word+of+God%3A+together+with+A+Brief+Epitome+of+the+Body+of+Divinity%2C+%28London%3A+Geo.+Badger%2C+1645%29%2C+pp+55-57.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b6bb4e4ba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1b6bb4e4ba.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/29/james-ussher-on-the-persons-in-the-godhead/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-785861c5de" data-kw="">
<blockquote><p>Again they who labour under the frenzy of Sabellius and the craze of Arius, have both fallen from a sound faith for want of observing a middle course. The name of Christian is applied to both these heretics; but if any one examines their doctrines, he will find the one sect not much better than the Jews, and differing from them only in name, and the other very nearly holding the heresy of Paul of Samosata, and that both are very wide of the truth. Great, therefore, is the danger in such cases, and the way of orthodoxy is narrow and hemmed in by threatening crags on either side, and there is no little fear lest when intending to strike at one enemy we should be wounded by the other.

For if any one assert the unity of the Godhead, Sabellius straightway turns that expression to the advantage of his own mental vagary, and if he distinguish the Persons, and say that the Father is one, and the Son another, and the Holy Spirit a third, up gets Arius, ready to wrest that distinction of Persons into a difference of substance; so we must turn and flee both from the impious confounding of the Persons by the one, and the senseless division of the substance by the other, confessing, indeed, that the Godhead of the Father and of the Son and of the Holy Ghost, is all one, while we add thereunto a Trinity of Persons. For then we shall be able to fortify ourselves against the attacks of both heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Priesthood</cite>, (c. 381-85), 4.4 in Nicene and Post Nicene Fathers 1, 9: 66.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

medcovenanter.wordpress.com/2019/08/28/john-chrysostom-on-fleeing-from-anti-trinitarian-heresies/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-78a7232971" data-kw="">
<blockquote><p>All that Christ does in this great affair as mediator, in any of his offices, either of prophet, priest, or king; either when he was in this world, in his human nature, or before or since; and not only what Christ the mediator has done, but also what the Father and the Holy Ghost, have done, as united or confederated in this design of redeeming sinful men; or, in one word, all that is wrought in execution of the eternal covenant of redemption; this is what I call the work of redemption in the doctrine; for it is all but one work, one design.

The various dispensations or works that belong to it, are but the several parts of one scheme. It is but one design that is formed to which all the offices of Christ do directly tend, and in which all the persons of the Trinity do conspire, and all the various dispensations that belong to it are united; and the several wheels are one machine, to answer one end, and produce one effect. …

Some things were done before the world was created, yea from all eternity. The persons of the Trinity were as it were confederated in a design and covenant of redemption; in which covenant the Father had appointed the Son, and the Son had undertaken the work; and all things to be accomplished in the work were stipulated and agreed. … God’s electing love, and the covenant of redemption, never had a beginning; so the fruits of this work, that shall be after the end of the world, never will have an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), pp 10, 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-43b8e22d5f" data-kw="">
<blockquote><p>These [Christians] I call by name (for they are not nameless like the stars which are numbered and have names), and they follow me, for I rear them up beside the waters of rest; and they follow every such shepherd, whose voice they love to hear, as you see; but a stranger they will not follow, but will flee from him, because they have a habit of distinguishing the voice of their own from that of strangers. They will flee from Valentinus with his division of one into two, refusing to believe that the Creator is other than the Good. They will flee from Depth and Silence, and the mythical Æons, that are verily worthy of Depth and Silence.

They will flee from Marcion’s god; compounded of elements and numbers; from Montanus’ evil and feminine spirit; from the matter and darkness of Manes; from Novatus’ boasting and wordy assumption of purity; from the analysis and confusion of Sabellius, and if I may use the expression, his absorption, contracting the Three into One, instead of defining the One in Three Personalities; from the difference of natures taught by Arius and his followers, and their new Judaism, confining the Godhead to the Unbegotten; from Photinus earthly Christ, who took his beginning from Mary.

But they worship the Father and the Son and the Holy Ghost, One Godhead; God the Father, God the Son and (do not be angry) God the Holy Ghost. One Nature in Three Personalities, intellectual, perfect, Self-existent, numerically separate, but not separate in Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Arians</cite>, (380), XVI in Nicene and Post-Nicene Fathers 2, 7: 333-34.</span></figcaption>

</figure><figure class="quote" id="q-a8b60674fd" data-kw="">
<blockquote><p>For in proportion as God is harder to trace out than man, so is the heavenly Generation harder to comprehend than your own. But if you assert that because you cannot comprehend it, therefore He cannot have been begotten, it will be time for you to strike out many existing things which you cannot comprehend; and first of all God Himself. … The Begetting of God must be honoured by silence. It is a great thing for you to learn that He was begotten. But the manner of His generation we will not admit that even Angels can conceive, much less you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Five Theological Orations</cite>, (379), 3.8 in Nicene and Post-Nicene Fathers 2, 7: 303.</span></figcaption>

</figure><figure class="quote" id="q-de1035d158" data-kw="">
<blockquote><p>True it is that if we respect him in his human nature, his Father is greater than he; and he is his Father’s servant: yet in that he said, and most truly said, that God was his Father, the Jews did rightly infer from thence, that he thereby made himself equal with God; and the Lord of hosts himself hath proclaimed him to be the man that is his fellow. Being such a man therefore, and so highly borne; by the privilege of his birth-right, he might have claimed an exemption from the ordinary service whereunto all other men are tied: and by being the King’s Son, have freed himself from the payment of that tribute which was to be exacted at the hands of Strangers.

When the Father brought this his first-begotten into the world, he said; Let all the Angels of God worship him: and at the very instant wherein the Son advanced our nature into the highest pitch of dignity, by admitting it into the unity of his sacred person, that nature so assumed was worthy to be crowned with all glory and honour: and he in that nature might then have set himself down at the right hand of the throne of God; tied to no other subjection than now he is, or hereafter shall be, when after the end of this world he shall have delivered up the kingdom to God the Father. For then also, in regard of his assumed nature, he shall be subject unto him that put all other things under him.

Thus the Son of God, if he had minded only his own things, might at the very first have attained unto the joy that was set before him: but looking on the things of others, he chose rather to come by a tedious way, and wearisome journey unto it; not challenging the privilege of a Son, but taking upon him the form of a mean servant.

Whereupon in the days of his flesh, he did not serve as an honourable Commander in the Lords host, but as an ordinary soldier: he made himself of no reputation, for the time as it were emptying himself of his high state and dignity; he humbled himself, and became obedient until his death being content all his life long to be made under the Law: yea so far, that as he was sent in the likeness of sinful flesh, so he disdained not to subject himself unto that Law, which properly did concern sinful flesh.

And therefore howsoever Circumcision was by right applicable only unto such as were dead in their sins, and the uncircumcision of their flesh; yet he, in whom there was no body of the sins of the flesh to be put off, submitted himself notwithstanding thereunto: not only to testify his communion with the Fathers of the old Testament; but also by this means to tender unto his Father a bond, signed with his own blood, whereby he made himself in our behalf a debtor unto the whole Law. For I testify (saith the Apostle) to every man that is circumcised, that he is a debtor to the whole Law.

In like manner Baptism appertained properly unto such as were defiled, and had need to have their sins washed away: and therefore when all the land of Judea, and they of Jerusalem went out unto John, they were all baptized of him in the river Jordan, confessing their sins. Among the rest came our Saviour also: but the Baptist considering that he had need to be baptized by Christ, and Christ no need at all to be baptized by him, refused to give way unto that action; as altogether unbefitting the state of that immaculate Lamb of God, who was to take away the sin of the World. Yet did our Mediator submit himself to that ordinance of God also: not only to testify his communion with the Christians of the new Testament; but especially (which is the reason yielded by himself) because it became him thus to fulfil all righteousness.

And so having fulfilled all righteousness, whereunto the meanest man was tied, in the days of his pilgrimage (which was more than he needed to have undergone, if he had respected only himself:) the works which he performed were truly works of supererogation, which might be put upon the account of them whose debt he undertook to discharge; and being performed by the person of the Son of God, must in that respect not only be equivalent, but infinitely overvalue the obedience of Adam and all his posterity, although they had remained in their integrity, &amp; continued until this hour instantly serving God day &amp; night. And thus for our main and principal debt of Obedience, hath our Mediator given satisfaction unto the Justice of his Father; with good measure, pressed down, shaken together, &amp; running over.</p></blockquote>

</figure><figure class="quote" id="q-c4af89eb80" data-kw="">
<blockquote><p>The Father’s appointing him to be a sacrifice, doth not impair his own willingness in undertaking. The Father is said to send him and deliver him, John iii. 84, Rom. viii. 32; not that the Son was over-persuaded, or came only out of obedience, without any inclination of his own. The Father being the root and fountain of the deity, all actions are originally ascribed to him, though common to all; so he is first in order of being, as he is first in order of working.

The Father is said to deliver him, because the first motion of redemption is supposed to arise from the will and motion of the Father; yet the love of Christ was the spring of all mediatory actions, and his taking our nature on him; and therefore he is no less said to give himself, than the Father is said to give him to us and for us. God is said to set him forth, Rom. iii. 25; yet he is said to come, Mat. xx. 28, not thrust out or forced to come. God lays our sins upon him, yet Christ is said to bear them.

His engagement was an act of choice, liberty, and affection. He could not be constrained by his Father to undertake it; his will was as free in consenting, as his Father was in proposing. The Spirit is said to be sent by the Father and the Son, to take of Christ’s and show it to us, to fit those for heaven that are given to Christ; yet his distributions are according to his own will: 1 Cor. xii. 11, ‘Dividing to every man according as he will.’

If you consider Christ as one God with the Father, there is but one and the same will in both. Will belongs to essence or nature; the essence of God being one, there are not in God divers wills, though the Godhead be in divers persons, because the power of willing is the nature, not a personal propriety.

The decree of redemption was joint in Father and Son. What Christ decreed as God, he executed as man; and what he willed from eternity, he began in time to will as man, Christ, as God, gave himself to death with the same will and’ by the same action as the Father gave him; but as man he gave himself by a will inspired by the Father.

Yet for our conception’s sake the Scripture represents things so as if they were distinct wills, which yet we must not imagine, any more than because the Scripture, in condescension to our weakness, represents God with eyes, and ears, and hands, we must conceive God to have a fleshly body like ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Voluntariness of Christ’s Death</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 543-44.</span></figcaption>

<blockquote><p>In the Divine Essence we are to consider two things: First, The diverse manner of being therein; secondly, The attributes thereof.

The diverse manner of being therein, are called Persons (Heb. i. 3.)

A person is a distinct subsistence of the whole Godhead (John i. 1; v. 31, 37; xiv. 16; Col. ii. 9; John xiv. 9.)

There are Three Divine Persons, the Father, the Son, and the Holy Ghost (Gen. i. 26; iii. 22; xi. 7; Exod. xx. 2; Hos. i. 4, 7; Isa. lxiii. 9, 10; Zech. iii. 2; Hag. ii. 5, 6; 1 John v. 7; Matt. iii. 16, 17; xxviii. 19; John xiv. 26; 2 Cor. xiii. 13.) These three persons are not three several substances, but three distinct subsistences; or three diverse manner of beings, of one and the same substance and divine essence. So that a person in the Godhead is an individual Understanding and incommunicable subsistence, living of itself, and not sustained by another.

In the unity of the Godhead there is a plurality which is not accidental (Gen. i. 26; iii. 22; xi. 7; Isa. vi. 8), for God is a most pure act, and admits no accidents; nor essential, for God is one essence only—but personal.

The persons in this one essence are but three. In this mystery there is alius et alius, another and another; but not aliud et aliud, another thing and another thing. The Divine Essence in itself is neither divided nor distinguished, but the three Persons in the Divine Essence are distinguished amongst themselves three manner of ways: 1. By their Names. 2. By their Order. 3. By their Actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 3-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

In the unity of the Godhead there is a plurality which is not accidental (Gen. i. 26; iii. 22; xi. 7; Isa. vi. 8), for God is a most pure act, and admits no accidents; nor essential, for God is one essence only—but personal.

The persons in this one essence are but three. In this mystery there is alius et alius, another and another; but not aliud et aliud, another thing and another thing. The Divine Essence in itself is neither divided nor distinguished, but the three Persons in the Divine Essence are distinguished amongst themselves three manner of ways: 1. By their Names. 2. By their Order. 3. By their Actions.”

— Lewis Bayly, The Practice of Piety: Directing a Christian to walk, that he may please God, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 3-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+Divine+Essence+we+are+to+consider+two+things%3A+First%2C+The+diverse+manner+of+being+therein%3B+secondly%2C+The+attributes+thereof.%0A%0AThe+diverse+manner+of+being+therein%2C+are+called+Persons+%28Heb.+i.+3.%29%0A%0AA+person+is+a+distinct+subsistence+of+the+whole+Godhead+%28John+i.+1%3B+v.+31%2C+37%3B+xiv.+16%3B+Col.+ii.+9%3B+John+xiv.+9.%29%0A%0AThere+are+Three+Divine+Persons%2C+the+Father%2C+the+Son%2C+and+the+Holy+Ghost+%28Gen.+i.+26%3B+iii.+22%3B+xi.+7%3B+Exod.+xx.+2%3B+Hos.+i.+4%2C+7%3B+Isa.+lxiii.+9%2C+10%3B+Zech.+iii.+2%3B+Hag.+ii.+5%2C+6%3B+1+John+v.+7%3B+Matt.+iii.+16%2C+17%3B+xxviii.+19%3B+John+xiv.+26%3B+2+Cor.+xiii.+13.%29+These+three+persons+are+not+three+several+substances%2C+but+three+distinct+subsistences%3B+or+three+diverse+manner+of+beings%2C+of+one+and+the+same+substance+and+divine+essence.+So+that+a+person+in+the+Godhead+is+an+individual+Understanding+and+incommunicable+subsistence%2C+living+of+itself%2C+and+not+sustained+by+another.%0A%0AIn+the+unity+of+the+Godhead+there+is+a+plurality+which+is+not+accidental+%28Gen.+i.+26%3B+iii.+22%3B+xi.+7%3B+Isa.+vi.+8%29%2C+for+God+is+a+most+pure+act%2C+and+admits+no+accidents%3B+nor+essential%2C+for+God+is+one+essence+only%E2%80%94but+personal.%0A%0AThe+persons+in+this+one+essence+are+but+three.+In+this+mystery+there+is+alius+et+alius%2C+another+and+another%3B+but+not+aliud+et+aliud%2C+another+thing+and+another+thing.+The+Divine+Essence+in+itself+is+neither+divided+nor+distinguished%2C+but+the+three+Persons+in+the+Divine+Essence+are+distinguished+amongst+themselves+three+manner+of+ways%3A+1.+By+their+Names.+2.+By+their+Order.+3.+By+their+Actions.%E2%80%9D%0A%0A%E2%80%94+Lewis+Bayly%2C+The+Practice+of+Piety%3A+Directing+a+Christian+to+walk%2C+that+he+may+please+God%2C+%281612%3B+Grand+Rapids+MI%3A+Soli+Deo+Gloria%2C+2019%29%2C+pp+3-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F106c272b30.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/106c272b30.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/30/lewis-bayly-on-the-trinity-and-pure-actuality/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-1b480310f1" data-kw="">
<blockquote><p>The catholic church sees nothing clearer in the divine books than that God, just as surely as he is the one and only God, is also three in number, and that the Father, Son and Holy Spirit are not only one essence, but are one God, and one only, and that man, having become an enemy of God, and hated on account of his sins, could not return to his holy and worthy communion with God, except through the bloody death of the Son, and that this death can save no one who is not gifted and filled with the breath of the Holy Spirit. But this goddess Reason is in no way willing or able to swallow and stomach. The mystery of the Father, the Son, and the Holy Spirit, and the mystery that rests on it, that of redemption, of Christ, she mocks as stupidity – to her it is a perpetual stumbling-block.</p></blockquote>

</figure><figure class="quote" id="q-af00f9cc84" data-kw="">
<blockquote><p>I. That there is one only God, distinct in three persons.

As we are taught therefore by the holy scriptures, which are his own word, we believe that there is only one God, that is, one simple, indivisible, eternal, living and most perfect essence in three existences, or (as the church useth to speak) persons, namely subsisting of the eternal Father, the eternal Son, and the eternal Holy spirit, truly distinct among themselves, yet without all division; being both beginning and cause of all things.

II. That so every person by it self is true God, that yet there be not three Gods.

For so we do believe and have learned out of the holy scriptures that the Father by himself is true and perfect God, the Son by himself is God and the Holie spirit by himself is God. And yet that they are not many, but one only God almighty, of whom all things, by whom all things, and for whom all things are.

III. One person to be distinct from another in personal proprieties, but in essential they differ from every creature.

And because the holy scriptures do so speak of God, that they attribute unto him many proprieties, both essential and personal, and they teach that in the essential he differeth from all things created, but in the personal one person to be distinguished from another, we therefore doe so believe, that as to beget the Son is such a propriety of the Father as can agree neither with the Son nor the Holy spirit, and again to be begotten can agree to none but the Son, and so of the rest; so likewise to be most pure, eternal, immeasurable, present every where, simply knowing all things, simply almighty, simply good and such like are in such sort the very proprieties of God, that they can by no means be communicated to any creature, so as it should be good (for example sake) in that immeasurable goodness or omnipotent in the same omnipotency, that God is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), II.I-III, 1: 129, 131.</span></figcaption>

<blockquote><p>For it is not sufficient for us to know God as we can conceive of him in our own imagination: but we must know him as he hath revealed himself in his word. And it is not sufficient to salvation to believe in God confusedly, but we must believe in one God distinct into three persons, the Father, the Son, the Holy Ghost: yea and more then this, we must hold and believe that God the Father is our father, the Son our redeemer, the Holy Ghost our sanctifier and comforter.</p></blockquote>

</figure><figure class="quote" id="q-316322e3fb" data-kw="">
<blockquote><p>Arminians may talk of the power of their own will, as they have a mind, to convert themselves; the Scriptures of truth inform us, that the power of a whole Trinity is employed in the work of a sinner’s conversion. The power of the Father is put forth in it, as Christ declares, John vi. 44, “No man can come to me, except the Father which hath sent me draw him.” The power of the eternal Son is exerted, John xii. 32, “And I, if I be lifted up from the earth, will draw all men unto me.”

The power of the Father and the Son is exerted by the Holy Ghost, the third Person of the Trinity. Hence, Tit. iii. 5, we are said to be “saved by the washing of regeneration, and the renewing of the Holy Ghost.” So that Arminians, who talk of the power of their own will to convert, believe, to repent, &amp;c., they invade the prerogative of a whole Trinity, and contradict the record or of him that runneth, but of God that sheweth mercy;” and that “it is God which worketh in us, both to will and to do, of his own good pleasure.” So that it is a divine power.</p></blockquote>

</figure><figure class="quote" id="q-50a02e49bd" data-kw="">
<blockquote><p>These persons are so distinct in their peculiar subsistence that distinct actings and operations are ascribed unto them. And these actings are of two sorts:—1. Ad intra, which are those internal acts in one person whereof another person is the object. And these acts ad invicem, or intra, are natural and necessary, inseparable from the being and existence of God. So the Father knows the Son and loveth him, and the Son seeth, knoweth, and loveth the Father.

In these mutual actings, one person is the object of the knowledge and love of the other: John iii. 35, “The Father loveth the Son, and hath given all things into his hand.” Chap. v. 20, “The Father loveth the Son.” Matt. xl 27, “No man knoweth the Son, but the Father; neither knoweth any man the Father, save the Son.” John vi. 46, “None hath seen the Father, save he which is of God, he hath seen the Father.” This mutual knowledge and love of Father and Son is expressed at large, Prov. viii. 22-31; which place I have opened and vindicated elsewhere. And they are absolute, infinite, natural, and necessary unto the being and blessedness of God. So the Spirit is the mutual love of the Father and the Son, knowing them as he is known, and “searching the deep things of God.” And in these mutual, internal, eternal actings of themselves, consists much of the infinite blessedness of the holy God.

Again, 2. There are distinct actings of the several persons ad extra; which are voluntary, or effects of will and choice, and not natural or necessary. And these are of two sorts: — (1.) Such as respect one another; for there are external acts of one person towards another: but then the person that is the object of these actings is not considered absolutely as a divine person, but with respect unto some peculiar dispensation and condescension. So the Father gives, sends, commands the Son, as he had condescended to take our nature upon him, and to be the mediator between God and man. So the Father and the Son do send the Spirit, as he condescends in an especial manner to the office of being the sanctifier and comforter of the church. Now, these are free and voluntary acts, depending upon the sovereign will, counsel, and pleasure of God, and might not have been, without the least diminution of his eternal blessedness.

(2.) There are especial acts, ad extra, towards the creatures.1 This the whole Scripture testifieth unto, so that it is altogether needless to confirm it with particular instances. None who have learned the first principles of the doctrine of Christ, but can tell you what works are ascribed peculiarly to the Father, what to the Son, and what to the Holy Ghost. Besides, this will be manifested afterward in all the distinct actings of the Spirit; which is sufficient for our purpose.</p></blockquote>

med Covenanter</a></div>

<blockquote><p>(2) To begin with the first work, we can consider the work of creation (a) either as it has become known to us from revelation that occurred by the Word of God, or (b) as it could become known from right reason’s use, if one has brought himself well and fittingly to contemplate this subject absent any help from revelation. If we consider the work of creation in the first way, we can easily discern the following.

First, the world was created by the Father, seeing that he, having been stirred forth out of his good will, undertook to donate existence to the world, existence it didn’t have before. Second, we note the world was framed by the Son, inasmuch as he’s the Father’s eternal Wisdom, whose council—like in leadership and administration—on the world to be framed was both wisely taken and fittingly ordered for execution. Finally, we discern the Holy Spirit was so skilled in his creation that the Spirit’s infinite force and power actually brought into effect the counsel arranged and administrated by Wisdom.

The Father’s work in that admirable, incomprehensible dispensation was such that it’s fitting we consider him as principium and first cause, the origin these things flow forth from. Solomon witnesses the Son’s work was what it was, when he called him “Wisdom” (Proverbs 8)—as it were, he who presided over the framing of all things. The apostle John witnessed likewise; obviously considering the beginning of Genesis so frequently reminds us God spoke so that this or that came to be, John termed the Son the λόγος, without whom absolutely nothing was made that’s said to be made.

Finally, it’s plainly the case the Holy Spirit’s work in creation was such because (a) he’s said to move about over the waters like birds who nest their eggs usually do and because (b) all the extraordinary, miraculous works and those in which some unusual, infinite power bares itself—all these the Scripture throughout attributes to the Spirit of God as their cause, by whose assistance God works all things.</p></blockquote>

</figure><figure class="quote" id="q-0a4b69cfda" data-kw="">
<blockquote><p>We must observe also that the mode of this generation is not to be estimated by the laws of human nativity, or of any created thing, for not so wide is the heaven from the earth, as the generation of the Son is from other generations; for in this divine generation the Father is not older than the Son, nor the Son younger than the Father; both are eternal, and this generation took place without any change. Here the understanding not only of men, but of angels, is at a loss; here we must lay our hands upon our lips, and be silent.</p></blockquote>

<blockquote><p>The debate over Remonstrant Arminianism involved more than a dispute over soteriology. The Scottish Covenanter and Commissioner to the Westminster Assembly, Robert Baillie reminds us that the original Arminians were also suspect on the doctrines of the Trinity and divine simplicity:

<blockquote><p>The point of the Trinity it is a speculative point, and it tends to practice. First, to be a foundation of our worship, that we worship one God in three persons. And then it tends to shew the unity among Christians, that God will work among Christians at length, that they shall be all one in some sort, as the Father, Son, and Holy Ghost are one: which, though it be a point of high and deep speculation, yet it tends to practice.</p></blockquote>

<blockquote><p>Therefore the Scripture calleth him the only begotten son of God, that he may put a necessary difference between Christ and all the faithful. For Christ is called, and indeed is the only everlasting son of the everlasting father, begotten of the substance of the father before all world’s: and therefore is every God in who[m] we ought to believe. Pro. 8. Joh. 1.

Now we are called and are the sons of God, not by nature, but by adoption and grace, through which, God hath vouchsafed to adopt us to be his children, whilst he hath made us through faith engrafted into his son, his true and lively members, who otherwise were the members of Satan, and by nature the sons of wrath. Joh. 8. Ephes. 2. But in the mean time, that same adoption, and name of the sons of God, is not only an empty title; but when we are in truth members of the son of God, we have by his grace a true communion and fellowship with him, in respect of which he is called the first begotten amongst many brethren. Rom. 8.</p></blockquote>

</figure><figure class="quote" id="q-d3c4cc2eb6" data-kw="">
<blockquote><p>By the Godhead is meant the divine nature. A person in the Godhead, is the Godhead distinguished by personal properties. The Godhead is one only in number: But the persons in the Godhead are three; and they are the Father, the Son, and the Holy Ghost … Jesus Christ is the second of these persons, namely, the Son. And the Father is true God: the Son is true God: and the Holy Ghost is true God. Yet they are not three Gods, but one God …

Howbeit, the Godhead neither is, nor can be divided into parts: but each of the three persons hath the one whole indivisible Godhead. They are not then of a like substance only, but the very same in substance. But they are distinguished by their personal properties. And it is the personal property of the Father, to beget the Son … And it is the personal property of the Son, to be begotten of the Father … And it is the personal property of the Holy Ghost, to proceed from the Father and the Son … The Son and the Holy Ghost are not below the Father, but equal with him: They are all equally powerful and glorious. So the personal properties make no inequality among them; forasmuch as these properties are not temporary and accidental, but eternal and necessary, and could not but be: and every one of the three persons, is the eternal, the supreme, the most high God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the First Part of the Assembly’s Shorter Catechism</cite>, (1727) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 15-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-83ef30fcf6" data-kw="">
<blockquote><p>Now, the Son is able to be called the Word of God metonymically: whether by metonymy of the adjunct in place of the subject, because He is the principal argument/subject of the divine Word, both the prophetic Word formerly, and also the evangelical Word afterward under the New Testament; or by metonymy of the effect in the place of the cause, because God sets forth unto men His entire Word through the Son as the supreme and divine Prophet, not only under the New Testament, Hebrews 1:1, but also under the Old, 1 Peter 1:11.

Yet far more preferably by the name of the Λόγου/Logos/Word the person of the Son and His eternal subsistence is declared to us metaphorically, as we hold against the Socinians who deny it: for, α. this name is attributed to the Son, when mention is made, on the one side of Jehovah or the Father, on the other side of the Spirit, as of divine persons distinguished among themselves by these names; whence the middle name of the Word shall be of the same, rather than of a different, order.

β. This name is also substituted for the name of the Son, which is in Matthew 28:19, just as also John attributed to the incarnate Word the glory as of the Only Begotten of the Father, John 1:14, and he adds that God set forth to us, not the Word, but the Only Begotten Son of God, τὸν ὄντα εἰς τὸν κόλπον τοῦ πατρός, which is in the bosom of the Father, John 1:18. γ. This name is attributed to Christ, when there is regard, not to the Gospel, which was proclaimed after the Fall, but to the first Creation: whence also then it is evident that it is actually applicable to Him with respect to His eternal subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, §3, p. 56.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-feb4f173a4" data-kw="">
<blockquote><p>But that which abides always is certainly not changed, therefore if it suffers no change it is eternal. And so the Holy Spirit is eternal, but the creature is liable to fault, and therefore subject to change. But that which is subject to change cannot be eternal, and there cannot therefore be anything in common between the Spirit and the creature, because the Spirit is eternal, but every creature is temporal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit</cite>, (381), 3.11.80 in Nicene and Post-Nicene Fathers 2, 10: 106.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-5f2ddee527" data-kw="">
<blockquote><p>Our God is one, or rather He is Oneness itself, a unity which has nothing in itself but itself, not consisting of many things, as everything else does. In this essential Unity of God, a hypostatic Trinity subsists in a way that far exceeds the imagination of men. The external operations of God in time and history are such that, even though He is one, each hypostasis does something particular and appropriate.

For since they are Three and subsist in the essence of one Deity, it can truly be said that all things are from the Father, by the Son, and through the Holy Spirit. What the Son hears from the Father, and what the Spirit receives from the Father and the Son, we come to receive at the hands of the Spirit (John 16:13-15), and therefore He is the last and nearest to us in order, although in power He is equal to the Second and First.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Law and Human Nature: Book I of Hooker’s Laws: A Modernization</cite>, ed. W. Bradford Littlejohn et al. (Lincoln NE: The Davenant Press, Kindle Edition, 2017), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our God is one, or rather He is Oneness itself, a unity which has nothing in itself but itself, not consisting of many things, as everything else does. In this essential Unity of God, a hypostatic Trinity subsists in a way that far exceeds the imagination of men. The external operations of God in time and history are such that, even though He is one, each hypostasis does something particular and appropriate.

For since they are Three and subsist in the essence of one Deity, it can truly be said that all things are from the Father, by the Son, and through the Holy Spirit. What the Son hears from the Father, and what the Spirit receives from the Father and the Son, we come to receive at the hands of the Spirit (John 16:13-15), and therefore He is the last and nearest to us in order, although in power He is equal to the Second and First.”

</figure><figure class="quote" id="q-55d2b5f415" data-kw="">
<blockquote><p>TWENTY-FOURTH QUESTION

Is the mystery of the Trinity a fundamental article of faith? We affirm against the Socinians and Remonstrants [Arminians].

I. Before discussing the truth of the mystery of the Trinity, we must premise some things concerning its necessity, not only against the Socinians (who directly deny it to be an article of faith), but also on account of the Remonstrants (who, although seeming to profess their belief of it, still deny it a place among the fundamental articles, so that the ignorance of it does not bring salvation into peril … Thus they would secretly subvert the truth of Christian doctrines oftentimes begin by agitating the question concerning their importance and necessity so that men, lulled into the sleep of security, may the more easily suffer themselves to be robbed of the truth and refuse to contend for the faith once delivered to the saints. …

IV. The question does not concern the full and perfect comprehension of this mystery; nor does it concern an intuitive knowledge of it. The former belongs to the glorified saints alone; the latter belongs to the Trinity alone … Rather the question is only whether the knowledge and confession of the three divine persons is required for the catholic faith and necessary to all who would be saved. …

VI. Thus the question comes to this: whether the mystery of the Trinity is a fundamental article, necessary to the faith of all believers, so that not only the denial, but even the ignorance of it cannot consist with salvation. …</p></blockquote>

C+3.24.4%2C+7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F55d2b5f415.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55d2b5f415.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/09/19/francis-turretin-on-the-knowledge-of-the-trinity-as-essential-to-salvation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-6636989924" data-kw="">
<blockquote><p>The purpose of all the Catholic commentators I have been able to read on the divine books of both testaments, who have written before me on the trinity which God is, has been to teach that according to the scriptures Father and Son and Holy Spirit in the inseparable equality of one substance present a divine unity; and therefore there are not three gods but one God; although indeed the Father has begotten the Son, and therefore he who is the Father is not the Son; and the Son is begotten by the Father, and therefore he who is the Son is not the Father; and the Holy Spirit is neither the Father nor the Son, but only the Spirit of the Father and of the Son, himself coequal to the Father and the Son, and belonging to the threefold unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trinity</cite>, trans. Edmund Hill, ed. J. E. Rotelle (420; New York: New City Press, 1991), 1.2.7, p. 69.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity.html">The Trinity</a></span></div>

<blockquote><p>Wherefore seeing that in the holy scriptures, in the Trinity the unity of the Deity is plainly and clearly taught, it is meet that we do simply rest therein, and not curiously to search nor lust after any further knowledge in this life, then it which God hath revealed. Wherefore Christian Emperors a thousand years past did very well enact the pain of death against such as should spread abroad any new doctrine as concerning this Article, as reproachful to Godward should teach the contrary. For God doubtless would not be seen of Moses, &amp; yet is seen in Christ Exo. 33 and 34. 2 Cor. 4. And moreover God hath in his Law decreed, that every one that hath sacrificed unto gods, besides the only God, should be slain, and as blasphemous towards God, should be taken out of the way [Exod. 22; Levit. 24].</p></blockquote>

<blockquote><p>Q. 2. Is this doctrine of the Trinity, then; a fundamental article, upon the belief of which our salvation depends?

</figure><figure class="quote" id="q-bc59f70763" data-kw="">
<blockquote><p>See hence the true spring of reformation in a church or land, and the true spring also of defection and backsliding. Why, when the Spirit of the Lord erects the kingdom of God within, especially in the hearts of magistrates or ministers, men of power and influence; then reformation work goes on apace, men then put to their hands heartily to the building up of Zion; every one then is ready to lend a lift to help up with the Head-stone of the corner. But when the kingdom of God is not within, men lose heart and hand to the work of the Lord, and fall a-work to daub with carnal wisdom and policy, which quite spoils and mars the building, instead of furthering it. What was it that made parliaments, and assemblies, and people of all ranks go so clean to work about the year 1638, and the year that followed it, to advance a work of reformation, and to engage themselves by solemn covenant to maintain it? And what makes the work go on so slowly now? Why, if folk, especially men of influence and power, had the kingdom of God within them, which, alas is much wanting now-a-days, otherwise there would not be so much daubing with untempered mortar as there is. O Sirs, if ever ye would see the Lord’s work thrive again in the land, pray that the foundation of the work by setting up his kingdom in the heart of kings, nobles, gentry, ministers, elders, and all ranks of people in the land; and then the hearts of the children will be turned to their fathers, and we may expect to see the church of Christ in this land, “looking forth as the morning, fair as the moon, clear as the sun, and terrible as an army with banners,” Cant. vi. 10.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“See hence the true spring of reformation in a church or land, and the true spring also of defection and backsliding. Why, when the Spirit of the Lord erects the kingdom of God within, especially in the hearts of magistrates or ministers, men of power and influence; then reformation work goes on apace, men then put to their hands heartily to the building up of Zion; every one then is ready to lend a lift to help up with the Head-stone of the corner. But when the kingdom of God is not within, men lose heart and hand to the work of the Lord, and fall a-work to daub with carnal wisdom and policy, which quite spoils and mars the building, instead of furthering it. What was it that made parliaments, and assemblies, and people of all ranks go so clean to work about the year 1638, and the year that followed it, to advance a work of reformation, and to engage themselves by solemn covenant to maintain it? And what makes the work go on so slowly now? Why, if folk, especially men of influence and power, had the kingdom of God within them, which, alas is much wanting now-a-days, otherwise there would not be so much daubing with untempered mortar as there is. O Sirs, if ever ye would see the Lord’s work thrive again in the land, pray that the foundation of the work by setting up his kingdom in the heart of kings, nobles, gentry, ministers, elders, and all ranks of people in the land; and then the hearts of the children will be turned to their fathers, and we may expect to see the church of Christ in this land, “looking forth as the morning, fair as the moon, clear as the sun, and terrible as an army with banners,” Cant. vi. 10.”

— Ebenezer Erskine, Fourth sermon on Luke 17:21 in The works of Ebenezer Erskine">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSee+hence+the+true+spring+of+reformation+in+a+church+or+land%2C+and+the+true+spring+also+of+defection+and+backsliding.+Why%2C+when+the+Spirit+of+the+Lord+erects+the+kingdom+of+God+within%2C+especially+in+the+hearts+of+magistrates+or+ministers%2C+men+of+power+and+influence%3B+then+reformation+work+goes+on+apace%2C+men+then+put+to+their+hands+heartily+to+the+building+up+of+Zion%3B+every+one+then+is+ready+to+lend+a+lift+to+help+up+with+the+Head-stone+of+the+corner.+But+when+the+kingdom+of+God+is+not+within%2C+men+lose+heart+and+hand+to+the+work+of+the+Lord%2C+and+fall+a-work+to+daub+with+carnal+wisdom+and+policy%2C+which+quite+spoils+and+mars+the+building%2C+instead+of+furthering+it.+What+was+it+that+made+parliaments%2C+and+assemblies%2C+and+people+of+all+ranks+go+so+clean+to+work+about+the+year+1638%2C+and+the+year+that+followed+it%2C+to+advance+a+work+of+reformation%2C+and+to+engage+themselves+by+solemn+covenant+to+maintain+it%3F+And+what+makes+the+work+go+on+so+slowly+now%3F+Why%2C+if+folk%2C+especially+men+of+influence+and+power%2C+had+the+kingdom+of+God+within+them%2C+which%2C+alas+is+much+wanting+now-a-days%2C+otherwise+there+would+not+be+so+much+daubing+with+untempered+mortar+as+there+is.+O+Sirs%2C+if+ever+ye+would+see+the+Lord%E2%80%99s+work+thrive+again+in+the+land%2C+pray+that+the+foundation+of+the+work+by+setting+up+his+kingdom+in+the+heart+of+kings%2C+nobles%2C+gentry%2C+ministers%2C+elders%2C+and+all+ranks+of+people+in+the+land%3B+and+then+the+hearts+of+the+children+will+be+turned+to+their+fathers%2C+and+we+may+expect+to+see+the+church+of+Christ+in+this+land%2C+%E2%80%9Clooking+forth+as+the+morning%2C+fair+as+the+moon%2C+clear+as+the+sun%2C+and+terrible+as+an+army+with+banners%2C%E2%80%9D+Cant.+vi.+10.%E2%80%9D%0A%0A%E2%80%94+Ebenezer+Erskine%2C+Fourth+sermon+on+Luke+17%3A21+in+The+works+of+Ebenezer+E

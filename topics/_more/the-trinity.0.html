tflow+and+inflow%2C+we+cannot+predicate+these+things+of+anything+that+is+incorporeal.%E2%80%9D120+The+most+striking+analogy+of+divine+generation+is+thought+and+speech%2C+and+Scripture+itself+suggests+this+when+it+calls+the+Son+%E2%80%9CLogos%E2%80%9D+%5BSpeech%2C+Word%2C+Reason%5D.+Just+as+the+human+mind+objectivizes+itself+in+speech%2C+so+God+expresses+his+entire+being+in+the+Logos+%5BChrist%5D.+But+here%2C+too%2C+we+must+note+the+difference.+Humans+need+many+words+to+express+their+ideas.+These+words+are+sounds+and+therefore+material%2C+sense-related.+They+have+no+existence+by+themselves.+But+when+God+speaks%2C+he+totally+expresses+himself+in+the+one+person+of+the+Logos%2C+whom+he+also+%E2%80%9Cgranted+to+have+life+in+himself%E2%80%9D+%28John+5%3A26+NIV%29.+In+the+second+place%2C+therefore%2C+divine+generation+implies+that+the+Father+begets+the+Son+out+of+the+being+of+the+Father%2C+%E2%80%9CGod+of+God%2C+Light+of+Light%2C+very+God+of+very+God%3B+begotten%2C+not+made%2C+being+of+one+substance+with+the+Father%2C%E2%80%9D+as+the+Nicene+symbol+has+it.+The+Arians%2C+by+contrast%2C+contended+that+the+Son+had+been+brought+forth+by+the+will+of+the+Father+out+of+nothing.+This%2C+however%2C+is+not+generation+but+creation%2C+as+John+of+Damascus+points+out.+Creation+is+%E2%80%9Cthe+bringing+into+being%2C+from+the+outside+and+not+from+the+substance+of+the+Creator%2C+of+something+created+and+made+entirely+dissimilar+%5Bin+substance%5D%2C%E2%80%9D+while+%E2%80%9Cbegetting%E2%80%9D+means+%E2%80%9Cproducing+of+the+substance+of+the+begetter+an+offspring+similar+in+substance+to+the+begetter.%E2%80%9D+The+Son+is+not+a+creature+but+he+is+%E2%80%9CGod+over+all%2C+forever+praised%21%E2%80%9D+%28Rom.+9%3A5+NIV%29.+Accordingly%2C+he+was+not+brought+forth+by+the+will+of+the+Father+out+of+nothing+and+in+time.+Rather%2C+he+is+generated+out+of+the+being+of+the+Father+in+eternity.+Hence%2C+instead+of+viewing+%E2%80%9Cgeneration%E2%80%9D+as+an+actual+work%2C+a+performance+%28%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%CE%B5%CE%B9%CE%B1%29%2C+of+the+Father%2C+we+should+ascribe+to+the+Father+%E2%80%9Ca+generative+nature%E2%80%9D+%28%CF%86%CF%85%CF%83%CE%B9%CF%82+%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%84%CE%B9%CE%BA%CE%B7%29.+This+is+not+to+say%2C+of+course%2C+that+the+generation+is+an+unconscious+and+unwilled+emanation%2C+occurring+apart+from+the+will+and+power+of+the+Father.+It+is+not+an+act+of+an+antecedent+decreeing+will%2C+like+creation%2C+but+one+that+is+so+divinely+natural+to+the+Father+that+his+concomitant+will+takes+perfect+delight+in+it.+It+is+a+manifestation+of+what+is+truly+expressive+of+his+nature+and+essence%2C+and+therefore+also+of+his+knowledge%2C+will%2C+and+power%2C+in+fact+of+all+his+virtues.+In+the+third+place%2C+therefore%2C+the+church+confesses+its+belief+in+the+eternal+character+of+this+generation.+The+Arians+said+that+there+was+a+time+when+the+Son+did+not+exist+%28%E1%BC%A0%CE%BD+%CF%80%CE%BF%CF%84%CE%B5+%E1%BD%81%CF%84%CE%B5+%CE%BF%E1%BD%90%CE%BA+%E1%BC%A0%CE%BD%29.+They+appealed+especially+to+the+words+%E2%80%9Che+brought+me+forth%2C%E2%80%9D+or+%E2%80%9Ccreated+me%E2%80%9D+in+Proverbs+8%3A22%2C+and+pointed+out+the+antinomy+between+the+terms+%E2%80%9Ceternal%E2%80%9D+%28%CE%B1%E1%BC%B0%CF%89%CE%BD%CE%BF%CF%82%29+and+%E2%80%9Cbegetting%E2%80%9D+%28%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%83%CE%B9%CF%82%29.+But+if+the+%E2%80%9CFather%E2%80%9D+and+the+%E2%80%9CSon%E2%80%9D+bear+their+names+in+a+metaphysical+sense%2C+as+Scripture+incontrovertibly+teaches%2C+it+follows+that+the+generation+in+question+has+to+be+eternal+as+well.+For+if+the+Son+is+not+eternal%2C+then+of+course+God+is+not+the+eternal+Father+either.+In+that+case+he+was+God+before+he+was+Father%2C+and+only+later%E2%80%94in+time%E2%80%94became+Father.+Hence%2C+rejection+of+the+eternal+generation+of+the+Son+involves+not+only+a+failure+to+do+justice+to+the+deity+of+the+Son%2C+but+also+to+that+of+the+Father.+It+makes+him+changeable%2C+robs+him+of+his+divine+nature%2C+deprives+him+of+the+eternity+of+his+fatherhood%2C+and+leaves+unexplained+how+God+can+truly+and+properly+be+called+%E2%80%9CFather%E2%80%9D+in+time+if+the+basis+for+calling+him+%E2%80%9CFather%E2%80%9D+is+not+eternally+present+in+his+nature.+We+must%2C+accordingly%2C+conceive+that+generation+as+being+eternal+in+the+true+sense+of+the+word.+It+is+not+something+that+was+completed+and+finished+at+some+point+in+eternity%2C+but+an+eternal+unchanging+act+of+God%2C+at+once+always+complete+and+eternally+ongoing.+Just+as+it+is+natural+for+the+sun+to+shine+and+for+a+spring+to+pour+out+water%2C+so+it+is+natural+for+the+Father+to+generate+the+Son.+The+Father+is+not+and+never+was+ungenerative%3B+he+begets+everlastingly.+%E2%80%9CThe+Father+did+not+by+a+single+act+beget+the+Son+and+then+release+him+from+his+%E2%80%98genesis%2C%E2%80%99+but+generates+him+perpetually.%E2%80%9D+For+God+to+beget+is+to+speak%2C+and+his+speaking+is+eternal.+God%E2%80%99s+offspring+is+eternal.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+transl.+John+Bolt%2C+and+John+Vriend+%28Grand+Rapids%2C+MI%3A+Baker+Academic%2C+2004%29%2C+2.308%E2%80%93310.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb6cb6008b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb6cb6008b.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/08/bavinck-on-eternal-generation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-8f063fc02f" data-kw="">
<blockquote><p>For the letter (i.e. the law) killeth, but the spirit (i.e. the gospel) giveth life. This is the reason why God hath made Paul the minister of the spirit. ‘God had made us able ministers not of the law but of the gospel, for the law kills, but the gospel gives life.’ This passage and the following context present two important questions. First, in what sense does the law kill? And second, How is it that the apostle attributes to the Mosaic system this purely legal character, when he elsewhere so plainly teaches that the gospel was witnessed or taught both in the law and the prophets? As to the former of these questions, the answer furnished by the Scriptures is plain. The law demands perfect obedience. It says, “Do this and live,” Rom. 10:5; Gal. 3:12, and “Cursed is every one who continueth not in all things written in the book of the law to do them,” Gal. 3:10. As no man renders this perfect obedience, the law condemns him. It pronounces on him the sentence of death. This is one way in which it kills. In the second place, it produces the knowledge or consciousness of sin, and of course of guilt, that is, of just exposure to the wrath of God. Thus again it slays. And thirdly, by presenting the perfect standard of duty, which cannot be seen without awakening the sense of obligation to be conformed to it, while it imparts no disposition or power to obey, it exasperates the soul and thus again it brings forth fruit unto death. All these effects of the law are systematically presented by the apostle in the 6th and 7th chapters of his epistle to the Romans, and in the 3d chapter of the epistle to the Galatians.</p></blockquote>

</figure><figure class="quote" id="q-ab89a2523d" data-kw="">
<blockquote><p>Those who so cry up the Spirit as to cry down ordinances and the ministry do not have the Spirit of God. In the NT, when vision and inspiration were in use, the Spirit did not teach men immediately, but referred them to an outward ministry. A famous instance you have hereof in the Ethiopian eunuch who, reading in his chariot the prophecy of Isaiah, the Spirit did not interpret to him the meaning hereof but bid Philip go and expound it. So, when Christ revealed himself to Paul, He did not teach him Himself, but bid him go to Damascus and there it should be told him what he should do. We have the like example in Cornelius. The Spirit did not teach him immediate, but bid him send for Peter, and he should tell him what he ought to do. By these examples we see how the Lord has honored the ministry. And, therefore, those who cry up the Spirit so as to cry down the ministry, as expecting to have the immediate teaching of the Spirit, doubtless have not the Spirit of God. . . . Those who pretend to the Spirit, and yet boast of the effects of the Spirit, in future revelations rather than in present motions to holy duties, are deceived by a satanic delusion. There are many in these days who will take upon them to tell you future contingent events, but this can be nothing else but a delusion of the devil, because the gifts of the Spirit in foretelling future events is now ceased and does not remain the Church.</p></blockquote>

</figure><figure class="quote" id="q-c9ff42a636" data-kw="">
<blockquote><p>At the same time, as he works not effectually in all, but only where the Spirit, the inward teacher, illuminates the heart, he subjoins, to every one who believes. The gospel is indeed offered to all for their salvation but the power of it appears not everywhere: and that it is the savor of death to the ungodly, does not proceed from what it is, but from their own wickedness. By setting forth but one salvation he cuts off every other trust. When men withdraw themselves from this one salvation, they find in the gospel a sure proof their own ruin. Since then the gospel invites all to partake of salvation without any difference, it is rightly called the doctrine of salvation: for Christ is there offered, whose peculiar office is to save that which was lost; and those who refuse to be saved by him, shall find him a judge. But everywhere in Scripture the word salvation is simply set in opposition to the word destruction: and hence we must observe, when it is mentioned, what the subject of the discourse is. Since then the gospel delivers from ruin and the curse of endless death, its salvation is eternal life.</p></blockquote>

<blockquote><p>Is this difference [of personal properties] rational, essential, or real?

It is not essential, as in the creatures, where every one hath his proper essence or being, defined and circumscribed: for the essence of the Father is not one, and the essence of the son another, and of the holy Ghost another: but one and the same, which the Father doth wholly communicate to the Son; the Father and the Son to the holy Ghost. Not only in reason, because not in notion, or mind, or only in word is he called Father, Son, and holy Ghost: neither respectively or by relation: as one man may both be, and be called a father and a son. But it is real, yet altogether incomprehensible, because each person hath his own peculiar definition, or his essential and incommunicable propriety, and differs from another not in essence, but in the manner of subsisting.

What is the outward difference?

It is taken from the works of God that be without, as that the Father sends the Son, the Son is sent as the Redeemer: the holy Ghost is the sanctifier. As in the Creed, the Father is distinguished from the Son by the work of creation: the Son by his incarnation, the holy Ghost from them both, by the work of sanctification and regeneration as where he appeared like a Dove, (Mat. 3.) and in cloven tongues, Act. 2. although all these things be effected by one and the self same God. As we use to say, the works of the Trinity without are indivisible: therefore here let us remember the saying of Gregory Nazianzen: I cannot imagine one, but presently I am compassed about on every side with the brightnesses of three: neither can I distinguish three, but forthwith I am brought again to one. Further, in the persons of the Deity there is an order, but there is none inequality: there is a distinction, but no diversity.</p></blockquote>

<blockquote><p>For what reason does God send the Spirit of his Son into our hearts after we have become children of God? He does this in order to reveal to our hearts that we are indeed his children, in order to confirm and make us certain of that fact, in order to bear witness to it, in order to expel every doubt and uncertainty and in order to seal us in our sonship and inheritance. For this reason Scripture calls the Holy Spirit the first fruits of our inheritance. Note that the invocation of God the Father that comes from the heart is the expression of a mind that the Holy Spirit has made sure and certain of the fact that the Father has been placated by Christ the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 138.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-a5eeac7eee" data-kw="">
<blockquote><p>The faith which the holy patriarchs and prophets received from God before the Incarnation of the Son of God, the faith which the holy Apostles too heard from the Lord himself, living in the flesh, and, instructed by the teaching of the Holy Spirit, not only preached orally but also left behind instilled in their writings for the salutary instruction of posterity—this faith proclaims one God, the Trinity, i.e., Father, Son, and Holy Spirit. But it would not be a real Trinity if one and the same person were called Father and Son and Holy Spirit. For, if, just as there is one substance of the Father and the Son and the Holy Spirit, so there would be one person, then there would be no way at all in which it could truly be called a Trinity.

Again, it would be a real Trinity, but that Trinity would not be one God if, just as Father, Son, and Holy Spirit are distinct from one another by what is proper to their persons, so likewise they would be different by a diversity of natures. But, since in that one true God, the Trinity, not only because God is one but also because he is a Trinity, it is naturally true therefore that the true God is in himself a Trinity of persons but in nature is one.

Through this unity of nature, the whole of the Father is in the Son and the Holy Spirit, and the whole of the Son in the Father and the Holy Spirit, and, as well, the whole of the Holy Spirit in the Father and the Son. No one of these is outside of any of the others, because none either precedes the others in eternity, or exceeds them in greatness, or overcomes them in power; because the Father is neither prior to nor greater than the Son or the Holy Spirit, in so far as it pertains to the unity of the divine nature.

Neither is the eternity nor the immensity of the Son either prior to or greater than; nor does it by nature either precede or exceed the eternity or the immensity of the Holy Spirit. Just as the Son is neither later nor less than the Father, so neither is the Holy Spirit later or less than the Son. And the Son is eternal and without beginning, because the Son, born from the nature of the Father, has always existed. And the Holy Spirit is eternal and without beginning, because the Holy Spirit proceeds from the nature of the Father and the Son. So, therefore, rightly do we believe and say that the three are one God, because there is a single eternity, a single immensity, a single divinity by nature of three persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To Peter on the Faith</cite>, in Selected Works, trans. Robert B. Enos, The Fathers of the Church: A New Translation, vol. 95 (Washington D.C.: The Catholic University of America Press, 1997), 4, pp 61-63.</span></figcaption>

</figure><figure class="quote" id="q-235d18e0d8" data-kw="">
<blockquote><p>20. Q. Doth the Holy Ghost proceed only from the Father?

A. No: But also from the Son, he is therefore called the Spirit of Christ. Rom. 8.9. But ye are not in the Flesh, but in the Spirit, if so be that the Spirit of God dwell in you. Now if any Man have not the Spirit of Christ, he is none of his. AND THE SPIRIT OF THE SON. Gal. 4.6. And because ye are Sons, God hath sent forth the Spirit of his Son into your Hearts, crying, Abba, Father.

21. Q. Is not the Holy Ghost, only a Power, or Attribute of God?

A. No: But an actual Person, having Understanding and Will. 1 Cor. 2.10. For the Spirit searcheth all Things, yea the deep Things of God. Chap. 12.11. But all these worketh that one and the self-same Spirit, dividing to every Man severally as he will. He also appeared at the Baptism of Christ, Matt. 3.16. And Jesus when he was baptized, went up straightway out of the Water: And lo, the Heavens were opened unto him, and be saw the SPIRIT of GOD descending like a Dove, and lighting upon him.

22. Q. Is he also a distinct Person?

A. Yes; He is expressly called, another, John 14.16, 17. And I will pray the Father, and he shall give you another Comforter that he may abide with you for ever; even the Spirit of Truth.</p></blockquote>

<blockquote><p>Christ, as God the Son, is of one substance, power, and eternity with God the Holy Spirit. Christ also, as the Son of man, had the Spirit bestowed on him without measure. His human nature was formed, in body and soul, and sanctified from the first, by the special operation of the Spirit. He was anointed with the immeasurable plenitude of the Spirit. By the light of the Spirit, the Man Christ Jesus thought all his thoughts; by the grace of the Spirit, willed all his purposes; by the strength of the Spirit wrought all his works; till finally he, “through the eternal Spirit, offered himself without spot to God,” thereafter rising from the dead by the Spirit of holiness, and ascending to pour out that Spirit of truth and consolations which he had promised so graciously to his disciples. In his Godhead, our Lord is one with the Spirit; and as man, – by the Spirit he was what he was.

When Christ, therefore, sends his Spirit, not to speak of himself, but to take of what is Christ’s and show it unto us; to create us again in Christ and like Christ; to dwell in us as in a living temple, as ourselves living spirits to which he has given a new and Christ-like life; – can we fail to see that there is something here which in no respect falls short even of the great marvel of our text, “Christ living in us?” Christ, the eternal Son, liveth in us, when the Spirit liveth in us; for the Spirit and the Son with the Father are inseparable in their joint possession of the all-fulness of the Godhead. And Christ, as God-man, the Son of man, the very Christ that tabernacled with men upon the earth, liveth in us, when the Spirit living in us confines himself to revealing Christ as the God-man, whose glory his disciples saw in human flesh, as the glory of the Only-begotten of the Father, full of grace and truth.

It is as the agent and ambassador of the God-man that the Spirit is given in the Church; it is the God-man whom the Spirit reveals and glorifies in the Church; it is within the limits of what he himself revealed and wrought in the God-man that he restricts himself in working in the Church or body of the faithful. He lives in them as he lived in him. He works to reveal in them progressively the truth which he implanted and developed in unclouded spiritual splendour in the mind of the Man Christ Jesus; to establish in them progressively the grace with which he replenished the heart of the Man Christ Jesus; – to conform them, in a word, to the “Firstborn of many brethren.” And how then can his in-dwelling, in-working, in-living in them be other than most adequately expressed by the doctrine that “Christ liveth in them?”

Christ, by his Spirit, liveth in them. By his Spirit he quickens them to new and spiritual life; and by his Spirit he takes possession of them as his living temple. As a living temple, he always regards them and acts in them. Their faculties as living men-alive from the dead-he animates and controls. Whatever in their thoughts, affections, purposes, actions, is opposed to his own, he sets himself to suppress; and the faculties themselves he undertakes to sanctify, – to form, and mould, and guide into harmony with his own. Nay; their whole character, their very natures, as living men, – spiritually living, he works by his Spirit to assimilate unto his own.

So far as this work advances, the very thoughts that he thinks they think; the affections he entertains they entertain; the purposes of his mind are theirs also; his work is their work; his nature theirs. And up to the limit to which this blessed result has in its onward progress been achieved, how can a better, a briefer, a more perfect expression be found for it, than to say that, to this extent, “Christ liveth in them?” It is, then, literally, profoundly true that Christ liveth in his people. He liveth in them by his Spirit which he hath given them.</p></blockquote>

<blockquote><p>Some hold that the name HOLY SPIRIT refers exclusively to His office in man’s salvation. But it is necessary to distinguish when truth and error are confusedly put together. The designation SPIRIT OF GOD is the distinctive name of the third person of the Godhead, denoting a divine subsistent, with intelligence and will, proceeding from another. The epithet HOLY, frequently conjoined with the term SPIRIT, gives us a nearer view of the Spirit’s SPECIAL WORK in connection with man’s salvation, and suggests an antithesis to every unholy spirit, whether human or Satanic. The procession of the Spirit is spoken of by our Lord in connection with a reference to the covenant of grace, and doubtless the reason is to show that the natural order in the Godhead is also the order in the execution of the covenant of grace.

Had we no other word of Scripture through which to think on this matter, the single title “THE SPIRIT of GOD” shows the relation of two Persons, the one proceeding from the other, just as the title “the Son of God” proves the eternal Sonship. He is called — (1) the Spirit of the Lord (Isa. 11.2); (2) the Spirit of God (Rom. 8.9); (3) the Spirit that proceedeth from the Father (John 15.26); (4) the Spirit of His Son (Gal. 4.6); and we should grievously err if we believed that these phrases have no significance. We ascribe no such procession to Him as is in any way associated with the idea of imperfection. We acknowledge, however, something fitly represented by the analogy of respiration, for it would be irreverence to imagine that there is no analogy in the terms employed.

The more the matter is discussed, the more is Scripture found to warrant the position that, in the scheme of grace, the acts of the Persons of the Trinity are found to be according to their order of subsistence in the Godhead, and are but the visible manifestation of that order in the divine essence. The Spirit could not be called the Spirit of the Father, or the Spirit of Him who raised up Christ from the dead (Rom. 8.11), unless He proceeded from the Father. He could not be called the Spirit of His Son (Gal. 4.6), or the Spirit of Christ (Rom. 8.9), because He replenished the humanity of Jesus.

Nor does it appear how the Spirit could be sent by Him except upon the footing of that procession by which He is the Spirit of the Son as well as the Spirit of the Father, and which is eternally continued without a past and without a future. The question is important in every respect, because it lies at the foundation of the MISSION OF THE COMFORTER. And as to its practical results, Church history informs us that it is in the last degree calamitous to ignore it.</p></blockquote>

ssed%2C+the+more+is+Scripture+found+to+warrant+the+position+that%2C+in+the+scheme+of+grace%2C+the+acts+of+the+Persons+of+the+Trinity+are+found+to+be+according+to+their+order+of+subsistence+in+the+Godhead%2C+and+are+but+the+visible+manifestation+of+that+order+in+the+divine+essence.+The+Spirit+could+not+be+called+the+Spirit+of+the+Father%2C+or+the+Spirit+of+Him+who+raised+up+Christ+from+the+dead+%28Rom.+8.11%29%2C+unless+He+proceeded+from+the+Father.+He+could+not+be+called+the+Spirit+of+His+Son+%28Gal.+4.6%29%2C+or+the+Spirit+of+Christ+%28Rom.+8.9%29%2C+because+He+replenished+the+humanity+of+Jesus.%0A%0ANor+does+it+appear+how+the+Spirit+could+be+sent+by+Him+except+upon+the+footing+of+that+procession+by+which+He+is+the+Spirit+of+the+Son+as+well+as+the+Spirit+of+the+Father%2C+and+which+is+eternally+continued+without+a+past+and+without+a+future.+The+question+is+important+in+every+respect%2C+because+it+lies+at+the+foundation+of+the+MISSION+OF+THE+COMFORTER.+And+as+to+its+practical+results%2C+Church+history+informs+us+that+it+is+in+the+last+degree+calamitous+to+ignore+it.%E2%80%9D%0A%0A%E2%80%94+George+Smeaton%2C+The+Doctrine+of+the+Holy+Spirit.+The+Ninth+Series+of+the+Cunningham+Lectures%2C+1882%2C+%28Edinburgh%3A+T.+%26+T.+Clark%2C+1882%29%2C+pp+105-06.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7a006bceb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7a006bceb9.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/06/03/george-smeaton-on-the-holy-spirit-and-the-order-of-the-trinity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>This Truth concerning the blessed and glorious Trinity, being so often insisted on here, and coming so near to the nature of God Himself, it cannot but be exceedingly necessary for Christians to be through in the faith thereof: yet it is questioned of late, whether it be to be accompted a fundamental point of Faith or not?

I say, this of late is questioned by Socinus, and the favourers of a boundless untolerable Toleration: for, of old it was most sacredly received as such, amongst the Ancients, as the Creeds that are called Apostolic, Nicene, and that of Athanasius, do manifest: But this Engine the Devil drives, first, to make the most necessary Truths indifferent, that then he may the more easily engage opposers to quarrel the very Truth of them it self; but we conceive, whatever it was of old before Christ, yet now it is to be looked on, not only as a Truth, which is clear from the Word, but also as a fundamental Truth; which being shaken, would overturn Christianity, and the way of Salvation that the Lord hath revealed in His Gospel.

This is not to be extended to a rigid degree of knowledge in this wonderful Mystery, but to so much clearness in this Truth from the Word, as may be a ground to Faith in the thing it self. And that this is necessary, as a fundamental, we think ariseth clearly from these three grounds. 1. That Truth, without which the true God cannot be taken up, believed in, and worshipped, is a fundamental Truth; but, this Truth of the Trinity of Persons, and Unity of the Godhead, is such, that without it, that God, which is proposed in the Word, and is the only true God, and the object of all Worship, can neither be taken up, believed in, nor worshipped rightly: Ergo, &amp;c. because the true God is One, and yet Three Persons; and as such, hath proposed Himself to be known and worshipped.

2. That Truth without which the work of Redemption would be overturned, is fundamental; But this is such: for, by taking away the Mystery of the Trinity, they take away the Godhead and Personality of the Mediator, and so do enervate His satisfaction. And, as on the former accompt, the true God is otherwise conceived than He is in Himself; so, in this respect, the Mediator is made a quite other thing. And, can any thing be fundamental, if this be not?

3. The way that God hath laid down in His Worship, requireth this, seeing in Baptism there is particular and express mentioning of these Three, the Father, Son and Spirit, as the Superior, to whom they that are Christian Soldiers, should be lifted and enrolled: and so we may accompt of all after-worship; seeing God requires us to honour the Son, as we honour the Father; and seeing these Three equally witness from Heaven, 1 Joh. 5. the Father, Word, and Spirit; all which Three, are One: can their Testimony be received as of Three, or can they be accompted as One God without this? And yet there can neither be one, in Faith, engaged unto in Baptism, or one, whose Testimony we may receive, but He who is God: and can any think but it’s necessary for a Christian, and that, fundamentally, to know to whom they are devoted, whom they are to worship, whose Testimony it is that they receive, whose operations they feel, whom they are to make use of, &amp;c? And therefore it’s necessary to know the Trinity of Persons in that One Godhead.</p></blockquote>

<blockquote><p>From this [popish] bondage we were delivered at the Reformation; but though the Fathers of Protestantism escaped the worst errors of the Church of Rome, they were tempted into an imitation of the exclusive spirit of Popery. Luther himself, when he refused to give the right hand of Christian fellowship to the Fathers of the Swiss Church, upon a point which he had not at first regarded as essential, laid the foundaton of the division between the Lutheran and the Reformed Churches.

The example has been followed in breaking down Churches into minor subdivisions throughout Europe and in the New World; and a want of zeal for external as well as internal unity has hitherto been the weakness and the reproach of Protestantism. It has exhibited itself both in the active and passive forms above referred to; the former being chiefly manifest in powerful communities (especially, though not exclusively, in connection with the State), in laying down conditions of communion upon topics which they own to be indifferent, but which are viewed as sinful by others who are thus thrust forth in segregation.

While the passive form has naturally been resorted to by smaller and less influential sects, in erecting, as they have sometimes silently done, partitions of proud or sullen seclusion. And in this way the Reformed Churches, not only in different countries, but even in the same land, present themselves to the eye, rather as separate and independent kingdoms, than as constituting merely different cantons and dependencies of one confederate commonwealth, the united members of one compact body politic.</p></blockquote>

<blockquote><p>Is this difference rational, essential, or real?

It is not essential, as in the creatures, where every one hath his proper essence or being, defined and circumscribed: for the essence of the Father is not one, and the essence of the son another, and of the holy Ghost another: but one and the same, which the Father doth wholly communicate to the Son; the Father and the Son to the holy Ghost. Not only in reason, because not in notion, or mind, or only in word is he called Father, Son, and holy Ghost: neither respectively or by relation: as one man may both be, and be called a father and a son. But it is real, yet altogether incomprehensible, because each person hath his own peculiar definition, or his essential and incommunicable propriety, and differs from another not in essence, but in the manner of subsisting.

What is the outward difference?

It is taken from the works of God that be without, as that the Father sends the Son, the Son is sent as the Redeemer: the holy Ghost is the sanctifier. As in the Creed, the Father is distinguished from the Son by the work of creation: the Son by his incarnation, the holy Ghost from them both, by the work of sanctification and regeneration as where he appeared like a Dove, (Mat. 3.) and in cloven tongues, Act. 2. although all these things be effected by one and the self same God. As we use to say, the works of the Trinity without are indivisible: therefore here let us remember the saying of Gregory Nazianzen: I cannot imagine one, but presently I am compassed about on every side with the brightness of three: neither can I distinguish three, but forthwith I am brought again to one. Further, in the persons of the Deity there is an order, but there is none inequality: there is a distinction, but no diversity.</p></blockquote>

<blockquote><p>The Spirit. Esa. 11.2. The Spirit with all the gifts thereof are upon him; is sent and given by God the Father, and abide in Christ. Yet it is said upon him because the Spirit came down from heaven and did visibly rest on him. On me, I, that is on my Humanity. Math. 3.16. So that these words signify thus much. The gifts of the Holy Ghost, proceeding from God my Father, doth reside and dwell in this my Humanity, which ye see; by which gifts, I am sanctified to this Office of Reconciliation.

[Object.] But it may be said, what Excellency hath Christ by this, above others; for the Prophet Esay affirms the like of him, and so may other Holy men, that they have the Spirit.

[Answ.] To this, answer is, That that of Esay is chiefly to be understood of Christ, and not of himself; and with great difference the Spirit doth reside in Christ and in others. And this difference appears in two things.

First, in the Universality of the gifts in Christ. Second, in the Perfection of gifts. As touching the first God did not bestow one or two, or more gifts on the Humanity of Christ, but he powered them out most plentifully on him. John 3.34, 35. Col. 2.3.9. It pleased the Father, that all fullness should dwell in him: all gifts are not given to one, but to every member, as much as seems good to the Spirit of God. 1 Cor. 12.11. For as the head is the common receptacle of all the senses, and doth exercise their faculties, when as yet, every Sense hath it distinct Office; In the execution whereof, they are employed. [Simile.] So our head Christ, is most fully furnished with all necessary gifts, to the animating of his body, when as yet the members of his body have their several functions and parts, in which all their faculty or ability is circumscribed.

For the second, all the gifts of Christ were most perfect in him, perfect Wisdom, Knowledge, Justice, Holiness; not inchoate, but in their perfect maturity. There was no defect of any gift, or in any; but all were ministered unto, absolute in all parts and degrees, to the full perfection of his Humanity; and this not only from some time of his Age, but from his first Conception. Luke 1.35. To his Resurrection and Ascension. 2 Cor. 5.21.

Now the gifts, given to the Saints, are only the first fruits, a handful and as earnest-pence. 1 Cor. 13.12. We know but in part, we Love but in part. So that we may easily see, how far the dwelling of the Spirit in holy men, differs from the manner of the same in Christ. In the one without measure, in the other in measure. In Christ full, in us in part; in him Primarily, In us, Secondarily. So that as great difference as there is twixt the spring, and the stream flowing thence. Twixt the light of the Moon and stars, and the Sun. [Simile.] The one being borrowed and imperfect, the other being original, and always equal. So great difference is there twixt Christ and his Saints in regard of gifts. And indeed, this plenitude of gifts, is one of the peculiar Prerogatives, which the Humanity of Christ hath received by the Hypostatical union; neither can they be found in any other person, who is not God and man.</p></blockquote>

<blockquote><p>For, if God granted to temporal and passible things to beget what they are, how much more did He who is eternal and impassible beget no other than He is Himself: one Father an only Son, to our unutterable wonder, since He begot Him with no suffering on His part, and with such complete equality to Himself that the Son does not excel Him either in power or in age!

All He has and can do He attributes to His Father, not to Himself, because He is not of Himself but of the Father. For, He is equal to the Father and this also He received from the Father, but He did not so receive His being equal as if He had previously been unequal and was born equal, but, as He is always born, so He is always equal. Therefore, He did not beget one unequal and add equality to Him at birth, but He gave it to Him in begetting Him because He begot Him equal, not unequal. Therefore, being in the form of God, it was not robbery in Him to be equal to God; since He assumed this at birth, He did not presume it by pride.</p></blockquote>

<blockquote><p>Vers. 5. For unto which of the Angels said he at any time, Thou art my Son, this day have I begotten thee: And again, I will be to him a Father, and he shall be to me a Son? This last Argument the Apostle confirms with eight Reasons, whereof the seven first are taken out of so many places of Scripture.

Reas. 1. From Psal. 2.7. Concerning Christ, saith God the Father, Thou art my Son, this day have I begotten thee. From which place the Deity of Christ is proved, that he after another and higher manner is a Son, than any of the Angels: A Son, to wit, by eternal Generation, which is confirmed out of Act. 3.33. and Rom. 1.4. where this place is applied to the manifestation of the Deity of Christ, which he had from Eternity, before he was manifested in his Resurrection from the dead: For had not Christ been in himself a Son, he could not be declared a Son to the world: And although in Scripture, some things are said to be done when they are manifested:

And so, This day have I begotten thee, will be, This day have I declared thee to the world to be my only begotten Son: Yet [This day] ought not to signify only the time of Christ’s declaration, as a Son, but also his eternal and immutable Generation: For Eternity is very well expressed by This day, whereby the present day is signified, because Eternity is as one day, and always wholly present, wherein there is nothing successive, or one after another, as in our time, but one constant permanency. And here also he uses a word of the Pretertense, that although thou hearest of him as present, yet thou mayest understand his Generation perfectly past, or eternal, as the shining of the Sun is perfect, and yet it continually beams forth from the Sun: Therefore Christ is so much the more excellent above Angels, by how much a Son is more excellent than a Messenger.</p></blockquote>

<blockquote><p>But he is called the Father of Christ also in respect of each of his natures. For the Father by an eternal and ineffable generation hath communicated to his Son his Divine essence. I say by an eternal generation : because we must not think in divine things that God the Father is prior to his Son, as among creatures the father always is.

Well spake Damascenus [John of Damascus], … with respect then to the generation of the Son it is impious to say that there was interval of time. For the Son is not brought into existence from a state of non-existence, but always was with the Father, and in him from all eternity, and without beginning begotten by him.</p></blockquote>

</figure><figure class="quote" id="q-aba4ef230c" data-kw="">
<blockquote><p>But such reasoning [that there is only one divine person, not three], if it is approved, is really the heresy of Sabellius. For if we also affirm of the other person everything we affirm of one person, since the two persons are one thing, then Son and Word and begotten should be affirmed of the Father in the same way that these things are affirmed of the Son. And both Father and begetter and unbegotten should be affirmed of the Son in the same way that the Father is such. But if this is so, the Father does not differ from the Son, nor the Son from the Father. Therefore, there is one person, not two.

For although God will be Father and Son, we affirm two persons because we believe the Father and the Son to be distinct from one another. For a father is always the father of someone, and a son the son of someone, nor is a father ever the father of his very self, or a son the son of his very self; rather, a father is one person, and his son another person, and a son is likewise one person, and his father another person.

Therefore, if the Father in God is not one person, and the one of whom he is the Father another person, and if the Son is not one person, and the one of whom he is the Son another person, we falsely call God a Father or a Son. For there can be no Father in God if the one of whom the Father is supposed to be the Father is not distinct from the Father. And likewise, there can be no Son in God if the one of whom the Son is supposed to be the Son is not distinct from the Son. Therefore, there will be no grounds for us to affirm that there are two persons in God, which we affirm because God is Father, and God is Son, and the Father is ever one person, and the Son another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anselm-of-canterbury.html">Anselm of Canterbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incarnation of the Word</cite>, (c. 1090), 3 in Anselm of Canterbury: The Major Works, eds Brian Davies and Gillian Evans, Oxford World’s Classics (Oxford: Oxford University Press, 1998), p. 242.</span></figcaption>

<blockquote><p>Doctrine. Christ did not of his own swing and Counsel leap into the Office of Reconciliation, but by the Authority and Ordination of God and the Holy Spirit. So that whatsoever was done by Christ in that Office, was done by the will and common consent of the Trinity. Heb. 5. chap. 4, and 5. verses.

So that whosoever embraces Christ, he doth by the same means and at the same time come into favour with the whole Trinity, who committed this Office to Christ; as on the contrary, they that despise Christ the Anointed of God, in vain do they boast of God; when as together with Christ, they reject the Father and the Spirit. And hence appears the miserable Condition of the Jews, Turks, and all Infidels, who refuse to hearken to the Anointed of God.</p></blockquote>

<blockquote><p>Some at the first may possibly say, that this [the Trinity] cannot stand, because it is against all reason that one should be three, or three one. The answer is, that indeed if one and the same respect be kept it is not possible, but in divers [various] considerations and respects it may. And thus the Father, the Son, and the Holy Ghost are three, namely in person; and again, they three are one, not in person but in nature.</p></blockquote>

</figure><figure class="quote" id="q-acac1af563" data-kw="">
<blockquote><p>Who then, who can declare the Father by number, so as to discover the powers of His Word? For like as He is the Father’s Word and Wisdom, so too condescending to created things, He becomes, to impart the knowledge and apprehension of Him that begot Him, His very Brightness and very Life, and the Door, and the Shepherd, and the Way, and King and Governor, and Saviour over all, and Light, and Giver of Life, and Providence over all. Having then such a Son begotten of Himself, good, and Creator, the Father did not hide Him out of the sight of His creatures, but even day by day reveals Him to all by means of the organisation and life of all things, which is His work.

But in and through Him He reveals Himself also, as the Saviour says: “I in the Father and the Father in Me:” so that it follows that the Word is in Him that begat Him, and that He that is begotten lives eternally with the Father. But this being so, and nothing being outside Him, but both heaven and earth and all that in them is being dependent on Him, yet men in their folly have set aside the knowledge and service of Him, and honoured things that are not instead of things that are: and instead of the real and true God deified things that were not, “serving the creature rather than the Creator,” thus involving themselves in foolishness and impiety.

For it is just as if one were to admire the works more than the workman, and being awestruck at the public works in the city, were to make light of their builder, or as if one were to praise a musical instrument but to despise the man who made and tuned it. Foolish and sadly disabled in eyesight! For how else had they known the building, or ship, or lyre, had not the ship-builder made it, the architect built it, or the musician fashioned it?

As then he that reasons in such a way is mad, and beyond all madness, even so affected in mind, I think, are those who do not recognise God or worship His Word, our Lord Jesus Christ the Saviour of all, through Whom the Father orders, and holds together all things, and exercises providence over the Universe; having faith and piety towards Whom, my Christ-loving friend, be of good cheer and of good hope, because immortality and the kingdom of heaven is the fruit of faith and devotion towards Him, if only the soul be adorned according to His laws. For just as for them who walk after His example, the prize is life everlasting, so for those who walk the opposite way, and not that of virtue, there is great shame, and peril without pardon in the day of judgment, because although they knew the way of truth their acts were contrary to their knowledge.</p></blockquote>

</figure><figure class="quote" id="q-6edaff04ca" data-kw="">
<blockquote><p>Hearken and consider. Jehovah our God is one Lord. Besides him there is not any other God. He is one. But in this one Jehovah, you are to reckon One, Two, Three, and no more. There are three, each of whom is Jehovah, yet Jehovah is one. These three are quite equal to each other, because every one of them is the one Jehovah.

Their names are, the Father, the Son, the Holy Spirit. The Father is the first who is Jehovah, the Son is the second who is also the same Jehovah, the Holy Spirit is the third who is likewise the same Jehovah. This is our God, The one Jehovah, the Father, the Son, and the Holy Spirit, whom the angels of heaven worship for ever and ever.</p></blockquote>

</figure><figure class="quote" id="q-30ee656407" data-kw="">
<blockquote><p>Great indeed is He Who deserves to be called the Son of the Most High. Is not He great whose immensity knows no limitation? Who is great as the Lord our God? It is He Who is as great as He is high yea, Who is Most High. As “Son of the Most High,” He thought it not robbery to equal Himself to the Most High. Satan, indeed, meditated robbery. Though made out of nothing in angelic form, he compared himself with his Maker, and arrogated to himself what belonged of right to the Son of the Most High, the Son not made by God, but begotten of Him.

For the Most High God the Father, though Omnipotent, could not make a creature equal to Himself, nor beget a Son who was not His equal. He made the angel great, but not as Himself, therefore not Most High. In one alone did He think it no robbery that He should equal Himself with Him in all things; the only-begotten Son, Who was not made, but begotten, by the Omnipotent, Omnipotent; by the Most High, Most High; by the Eternal, Co-eternal. Rightly, then, shall He be great Who shall be called the Son of the Most High.</p></blockquote>

</figure><figure class="quote" id="q-b4bd1e65b6" data-kw="">
<blockquote><p>So what ensures then that his judgment is true, other than the fact that he is truly the Son? That, after all, is what he said, And if I do pass judgment, my judgment is true, because I am not alone, but it is I and the Father who sent me, as if to say, “My judgment is true, because I am the Son of God.”

How do you prove that you are the Son of God?

Because I am not alone, but it is I and the Father who sent me.

Blush for shame, Sabellian; you hear “Son,” you hear “Father.” The Son is Son, the Father is Father. He did not say, “I am the Father, and I am the same as the Son,” but I am not alone is what he said.

Why are you not alone?

“Because the Father is with me”

It is I and the Father who sent me is what you hear; “it is I and the one who sent me.” Do not jettison a person, distinguish persons. Distinguish intelligently; do not separate them perfidiously, lest, after steering clear of Charybdis, you crash on Scylla. The whirlpool of Sabellian impiety, you see, was about to suck you into saying the Father is the same as the Son; just now you have learned that I am not alone, but it is I and the Father who sent me. You acknowledge that the Father is Father and the Son is Son. You do well to acknowledge this; but do not go on to say, “The Father is greater, the Son is less.” Do not say, “The Father is gold, the Son is silver.” There is one substance, one godhead, one coeternity, perfect equality, not the least unlikeness. I mean, if you only believe that Christ is another, and that he is not the Father, yet you still think that he differs in nature, you have indeed avoided Charybdis but have wrecked yourself on Scylla’s rocks.

Navigate down the middle, avoid each dangerous shore. The Father is Father, the Son is Son. You are now saying, “The Father is Father, the Son is Son”; you have truly avoided the danger of being sucked into the whirlpool. Why do you want to go to the other side, and say, “The Father is one thing, the Son another”? One person, another person, yes, that is right; one thing and another thing, that is wrong. The Son, after all, is another person, because he is not who the Father is; and the Father is another person, because he is not who the Son is; not, however, another thing, but both Father and Son are the very same. What does that mean, the very same? It is one God.

You have heard, I am not alone, but it is I and the Father who sent me; now hear what you must believe about Father and Son; listen to the Son: I and the Father are one (Jn 10:30). He did not say, “I am the Father,” or, “I and the Father are one person;” but when he said, I and the Father are one, you must hear and listen to both one and we are, and you will deliver yourself from both Scylla and Charybdis. Of these two words that he used, one delivers you from Arius; we are delivers you from Sabellius. If one, then not different things; if we are, then both Father and Son. After all, he would not say we are of one person; but neither would he say one of different things.

So then, he says in a word, My judgment is true, so that you may hear, “I am God’s Son.” “But I am persuading you,” he goes on, “that I am God’s Son in such a way that you should understand that the Father is with me; I am not his Son in such a way that I have left him behind; I am not here in such a way that I am not also with him; he is not there in such a way that he is not also with me. I have taken on the form of a slave, but I have not lost the form of God (Phil 2:7).” So then, I am not alone, he says, but it is I and the Father who sent me.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“So what ensures then that his judgment is true, other than the fact that he is truly the Son? That, after all, is what he said, And if I do pass judgment, my judgment is true, because I am not alone, but it is I and the Father who sent me, as if to say, “My judgment is true, because I am the Son of God.”

How do you prove that you are the Son of God?

Because I am not alone, but it is I and the Father who sent me.

Blush for shame, Sabellian; you hear “Son,” you hear “Father.” The Son is Son, the Father is Father. He did not say, “I am the Father, and I am the same as the Son,” but I am not alone is what he said.

Why are you not alone?

“Because the Father is with me”

It is I and the Father who sent me is what you hear; “it is I and the one who sent me.” Do not jettison a person, distinguish persons. Distinguish intelligently; do not separate them perfidiously, lest, after steering clear of Charybdis, you crash on Scylla. The whirlpool of Sabellian impiety, you see, was about to suck you into saying the Father is the same as the Son; just now you have learned that I am not alone, but it is I and the Father who sent me. You acknowledge that the Father is Father and the Son is Son. You do well to acknowledge this; but do not go on to say, “The Father is greater, the Son is less.” Do not say, “The Father is gold, the Son is silver.” There is one substance, one godhead, one coeternity, perfect equality, not the least unlikeness. I mean, if you only believe that Christ is another, and that he is not the Father, yet you still think that he differs in nature, you have indeed avoided Charybdis but have wrecked yourself on Scylla’s rocks.

Navigate down the middle, avoid each dangerous shore. The Father is Father, the Son is Son. You are now saying, “The Father is Father, the Son is Son”; you have truly avoided the danger of being sucked into the whirlpool. Why do you want to go to the other side, and say, “The Father is one thing, the Son another”? One person, another person, yes, that is right; one thing and another thing, that is wrong. The Son, after all, is another person, because he is not who the Father is; and the Father is another person, because he is not who the Son is; not, however, another thing, but both Father and Son are the very same. What does that mean, the very same? It is one God.

You have heard, I am not alone, but it is I and the Father who sent me; now hear what you must believe about Father and Son; listen to the Son: I and the Father are one (Jn 10:30). He did not say, “I am the Father,” or, “I and the Father are one person;” but when he said, I and the Father are one, you must hear and listen to both one and we are, and you will deliver yourself from both Scylla and Charybdis. Of these two words that he used, one delivers you from Arius; we are delivers you from Sabellius. If one, then not different things; if we are, then both Father and Son. After all, he would not say we are of one person; but neither would he say one of different things.

So then, he says in a word, My judgment is true, so that you may hear, “I am God’s Son.” “But I am persuading you,” he goes on, “that I am God’s Son in such a way that you should understand that the Father is with me; I am not his Son in such a way that I have left him behind; I am not here in such a way that I am not also with him; he is not there in such a way that he is not also with me. I have taken on the form of a slave, but I have not lost the form of God (Phil 2:7).” So then, I am not alone, he says, but it is I and the Father who sent me.”

— Augustine of Hippo, Homilies on the Gospel of John 1-40, (c. 406-20), trans. Edmund Hill, ed. Allan D. Fitzgerald, The Works of Saint Augustine: A Translation for the 21st Century, Volume 12 (Hyde Park NY: New City Press, 2009), 36.9, pp 560-62.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+what+ensures+then+that+his+judgment+is+true%2C+other+than+the+fact+that+he+is+truly+the+Son%3F+That%2C+after+all%2C+is+what+he+said%2C+And+if+I+do+pass+judgment%2C+my+judgment+is+true%2C+because+I+am+not+alone%2C+but+it+is+I+and+the+Father+who+sent+me%2C+as+if+to+say%2C+%E2%80%9CMy+judgment+is+true%2C+because+I+am+the+Son+of+God.%E2%80%9D%0A%0AHow+do+you+prove+that+you+are+the+Son+of+God%3F%0A%0ABecause+I+am+not+alone%2C+but+it+is+I+and+the+Father+who+sent+me.%0A%0ABlush+for+shame%2C+Sabellian%3B+you+hear+%E2%80%9CSon%2C%E2%80%9D+you+hear+%E2%80%9CFather.%E2%80%9D+The+Son+is+Son%2C+the+Father+is+Father.+He+did+not+say%2C+%E2%80%9CI+am+the+Father%2C+and+I+am+the+same+as+the+Son%2C%E2%80%9D+but+I+am+not+alone+is+what+he+said.%0A%0AWhy+are+you+not+alone%3F%0A%0A%E2%80%9CBecause+the+Father+is+with+me%E2%80%9D%0A%0AIt+is+I+and+the+Father+who+sent+me+is+what+you+hear%3B+%E2%80%9Cit+is+I+and+the+one+who+sent+me.%E2%80%9D+Do+not+jettison+a+person%2C+distinguish+persons.+Distinguish+intelligently%3B+do+not+separate+them+perfidiously%2C+lest%2C+after+steering+clear+of+Charybdis%2C+you+crash+on+Scylla.+The+whirlpool+of+Sabellian+impiety%2C+you+see%2C+was+about+to+suck+you+into+saying+the+Father+is+the+same+as+the+Son%3B+just+now+you+have+learned+that+I+am+not+alone%2C+but+it+is+I+and+the+Father+who+sent+me.+You+acknowledge+that+the+Father+is+Father+and+the+Son+is+Son.+You+do+well+to+acknowledge+this%3B+but+do+not+go+on+to+say%2C+%E2%80%9CThe+Father+is+greater%2C+the+Son+is+less.%E2%80%9D+Do+not+say%2C+%E2%80%9CThe+Father+is+gold%2C+the+Son+is+silver.%E2%80%9D+There+is+one+substance%2C+one+godhead%2C+one+coeternity%2C+perfect+equality%2C+not+the+least+unli <blockquote><p>Ob. The Son and holy Ghost are not without beginning, therefore they are not eternal.

Answ. This is not a beginning of time or continuance, but only of order and offspring: but the Sabellian here cavil, viz. Christ saith, He that seeth me, seeth the Father: and believest thou not that I am in the Father, and the Father in me? Joh. 14.9.10. therefore the Father and the Son are one person. Ans. Indeed he that seeth the Son seeth the Father, because the Son hath the same essence with the Father, and being manifested in the flesh, hath delivered to us the whole will of God, Joh. 1.18.

Ob. 2. That which is one in number, cannot without contradiction be said to be three in persons: but God is one in number, (Deut. 6.4.) ergo.

Ans. That unity doth signify God’s simple essence, not the manner by which that simple essence subsisteth. Therefore God absolutely according to his essence is one, because he is indivisible: and only in respect of inward relation, I meane the reason of subsisting, is three.

Ob. 3. If there be one being of the Father, another of the Son, and another of the holy Ghost: it followeth, that in God there are three divers beings, and consequently three divers persons.

Ans. The being of the Father doth not signify that essence by which he is absolutely God, but by which he is Father, that is, in that he otherwise subsisteth then doth the Son: therefore the being of the Father is one thing, and the being of the Son is another, and yet both of them have the same essence.

Ob. 4. If there be three Persons truly distinguished, and one only essence, then is there a quaternity in God.

Ans. Not so: for the essence differeth from Person only in reason: but the Persons differ each from other both in reason and in being.

Ob. 5. The Father begot his Son either existing or not existing, to say either of these is absurd.

Ans. We may well say, that the Father begat his Son already existing, because the Father was never without the Son, even as the sun was never without his light. Again, it may be as well said, that he begat him not existing, in that his generation, although it be eternal, yet in order goeth before existence, as the sun is before his light.</p></blockquote>

<blockquote><p>A person of the Deity, is a subsistence in the Deity, having such properties, as cannot be communicated from one to another. There are three persons in the Deity, the Father, the Son, &amp; the holy ghost. Mat. 3.16. &amp; 28.19. 1. John. 5.7. Ephes. 2.18. Gene. 1.26. and 18.2. Exod. 3.6. and 15.16. Psal. 33.6. Esa. 6.3.

These are coeternal, and equal, of one, &amp; the self same simple essence, distinct one from another by an incommunicable propriety. And those are distinguished one from another, not essentially, because the essence of them is but one, yet notwithstanding really: they differ from the essence of God, not in deed, but by respect or by relation only.

The Father, is the first in the Godhead, which hath begot the Son from everlasting. Psal. 2. 2. Cor. 13. The Son, is the second in the Godhead, which is begotten of the Father, by an eternal communicating of the whole essence. John. 1.14.18.34. and 3.16. Mat. 3.17. 2. Cor. 1.19. Hose. 11.3. Luke. 1.31. Rom. 1.4.

The divine essence neither doth beget, neither is begotten: because that which doth beget is in very deed, distinguished from that which is begotten: now the divine essence, being but one, and most simple, it cannot be distinguished from it self.

The Son, is begotten of the essence of the Father: and hath the whole essence of the Father not by flowing from, neither by cutting out of the Father, neither by propagation, (for the essence of the Son, doth not flow from the essence of the Father, neither is it propagated or cut out of it) but by communicating. And the Son is not in deed the Son of himself, because he is the Son of the Father: yet notwithstanding he is God of himself, that is to say, that essence which is in the Son, is not of another, but of it self, seeing the essence of the Father, and the Son, is one and self same.

The essence of the Father, is of it self, without all beginning: but the essence of the Son, is the essence of the Father. For the Godhead, by which the Son is God, is that same by which the Father is God: therefore the essence of the Son is of it self and without beginning. Therefore Christ is God of himself. For except he be God of himself, he certainly cannot be God at all. For that he be God, God hath it of himself naturally. He cannot be God whose essence is not of it self.

But it is one thing for the essence to be begotten, and another thing to be begotten of the essence. The essence is not begotten of the essence, the essence is without generation. Therefore the Son also as he is God, is not begotten. But the Son is begotten of the essence of the Father. Wherefore Christ as he is God is of himself, as he is the Son, he is of the Father.

The holy Spirit is the third person in the Godhead, which proceedeth from the Father and the Son. John. 15.25.26. and 20.22. Rom. 8.9. Esa. 6.8.9. Acts. 28.25.26. &amp; 5.3.4. 1. Cor. 3.6. and 19.20. 2. Cor. 6.16.

Therefore God is one in essence. Exod. 3.14. Deut. 4.35. and 6.4. and 7.9. and 10.17. and 32.39. 1. Cor. 12.6. Gal. 3.20. Ephes. 4.6. 1. Tim. 2.5. But three in persons, whereupon we worship the reverend Trinity, or Trinity in unity. Genes. 1.26. and 18.2. 1. John. 5.7. Ephes. 2.18. Rom. 9 5. 1. Timot. 3.16. Acts. 5.3.4.</p></blockquote>

But it is one thing for the essence to be begotten, and another thing to be begotten of the essence. The essence is not begotten of the essence, the essence is without generation. Therefore the Son also as he is God, is not begotten. But the Son is begotten of the essence of the Father. Wherefore Christ as he is God is of himself, as he is the Son, he is of the Father.

The holy Spirit is the third person in the Godhead, which proceedeth from the Father and the Son. John. 15.25.26. and 20.22. Rom. 8.9. Esa. 6.8.9. Acts. 28.25.26. &amp; 5.3.4. 1. Cor. 3.6. and 19.20. 2. Cor. 6.16.

Therefore God is one in essence. Exod. 3.14. Deut. 4.35. and 6.4. and 7.9. and 10.17. and 32.39. 1. Cor. 12.6. Gal. 3.20. Ephes. 4.6. 1. Tim. 2.5. But three in persons, whereupon we worship the reverend Trinity, or Trinity in unity. Genes. 1.26. and 18.2. 1. John. 5.7. Ephes. 2.18. Rom. 9 5. 1. Timot. 3.16. Acts. 5.3.4.”

— Amandus Polanus, The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal pointes whereof are contain, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 12-14.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+person+of+the+Deity%2C+is+a+subsistence+in+the+Deity%2C+having+such+properties%2C+as+cannot+be+communicated+from+one+to+another.+There+are+three+persons+in+the+Deity%2C+the+Father%2C+the+Son%2C+%26+the+holy+ghost.+Mat.+3.16.+%26+28.19.+1.+John.+5.7.+Ephes.+2.18.+Gene.+1.26.+and+18.2.+Exod.+3.6.+and+15.16.+Psal.+33.6.+Esa.+6.3.%0A%0AThese+are+coeternal%2C+and+equal%2C+of+one%2C+%26+the+self+same+simple+essence%2C+distinct+one+from+another+by+an+incommunicable+propriety.+And+those+are+distinguished+one+from+another%2C+not+essentially%2C+because+the+essence+of+them+is+but+one%2C+yet+notwithstanding+really%3A+they+differ+from+the+essence+of+God%2C+not+in+deed%2C+but+by+respect+or+by+relation+only.%0A%0AThe+Father%2C+is+the+first+in+the+Godhead%2C+which+hath+begot+the+Son+from+everlasting.+Psal.+2.+2.+Cor.+13.+The+Son%2C+is+the+second+in+the+Godhead%2C+which+is+begotten+of+the+Father%2C+by+an+eternal+communicating+of+the+whole+essence.+John.+1.14.18.34.+and+3.16.+Mat.+3.17.+2.+Cor.+1.19.+Hose.+11.3.+Luke.+1.31.+Rom.+1.4.%0A%0AThe+divine+essence+neither+doth+beget%2C+neither+is+begotten%3A+because+that+which+doth+beget+is+in+very+deed%2C+distinguished+from+that+which+is+begotten%3A+now+the+divine+essence%2C+being+but+one%2C+and+most+simple%2C+it+cannot+be+distinguished+from+it+self.%0A%0AThe+Son%2C+is+begotten+of+the+essence+of+the+Father%3A+and+hath+the+whole+essence+of+the+Father+not+by+flowing+from%2C+neither+by+cutting+out+of+the+Father%2C+neither+by+propagation%2C+%28for+the+essence+of+the+Son%2C+doth+not+flow+from+the+essence+of+the+Father%2C+neither+is+it+propagated+or+cut+out+of+it%29+but+by+communicating.+And+the+Son+is+not+in+deed+the+Son+of+himself%2C+because+he+is+the+Son+of+the+Father%3A+yet+notwithstanding+he+is+God+of+himself%2C+that+is+to+say%2C+that+essence+which+is+in+the+Son%2C+is+not+of+another%2C+but+of+it+self%2C+seeing+the+essence+of+the+Father%2C+and+the+Son%2C+is+one+and+self+same.%0A%0AThe+essence+of+the+Father%2C+is+of+it+self%2C+without+all+beginning%3A+but+the+essence+of+the+Son%2C+is+the+essence+of+the+Father.+For+the+Godhead%2C+by+which+the+Son+is+God%2C+is+that+same+by+which+the+Father+is+God%3A+therefore+the+essence+of+the+Son+is+of+it+self+and+without+beginning.+Therefore+Christ+is+God+of+himself.+For+except+he+be+God+of+himself%2C+he+certainly+cannot+be+God+at+all.+For+that+he+be+God%2C+God+hath+it+of+himself+naturally.+He+cannot+be+God+whose+essence+is+not+of+it+self.%0A%0ABut+it+is+one+thing+for+the+essence+to+be+begotten%2C+and+another+thing+to+be+begotten+of+the+essence.+The+essence+is+not+begotten+of+the+essence%2C+the+essence+is+without+generation.+Therefore+the+Son+also+as+he+is+God%2C+is+not+begotten.+But+the+Son+is+begotten+of+the+essence+of+the+Father.+Wherefore+Christ+as+he+is+God+is+of+himself%2C+as+he+is+the+Son%2C+he+is+of+the+Father.%0A%0AThe+holy+Spirit+is+the+third+person+in+the+Godhead%2C+which+proceedeth+from+the+Father+and+the+Son.+John.+15.25.26.+and+20.22.+Rom.+8.9.+Esa.+6.8.9.+Acts.+28.25.26.+%26+5.3.4.+1.+Cor.+3.6.+and+19.20.+2.+Cor.+6.16.%0A%0ATherefore+God+is+one+in+essence.+Exod.+3.14.+Deut.+4.35.+and+6.4.+and+7.9.+and+10.17.+and+32.39.+1.+Cor.+12.6.+Gal.+3.20.+Ephes.+4.6.+1.+Tim.+2.5.+But+three+in+persons%2C+whereupon+we+worship+the+reverend+Trinity%2C+or+Trinity+in+unity.+Genes.+1.26.+and+18.2.+1.+John.+5.7.+Ephes.+2.18.+Rom.+9+5.+1.+Timot.+3.16.+Acts.+5.3.4.%E2%80%9D%0A%0A%E2%80%94+Amandus+Polanus%2C+The+substance+of+Christian+religion+soundly+set+forth+in+two+books%2C+by+definitions+and+partitions%2C+framed+ac <blockquote><p>Ma. Seeing there is but one God, tell me, Why in the confession of the Christian Faith, thou rehearsest three, the Father, the Son, and the holy Ghost.

Sch. Those be not the names of sundry Gods, but of three distinct Persons in the Godhead. For God the Father, God the Son, and God the holy Ghost, being three persons, are one only God, as we are taught by the holy Scriptures; which we ought readily to believe, rather than curiously to search the infinite depth of so secret and hidden a mystery.

Ma. Thou sayest true. Go forward therefore, why callest thou God, Father?

Sch. First and principally, for that the is the natural Father of his only son Jesus Christ. Secondly, for that he is our Father, both for that he created us, and gave life unto us all, and also for that he hath heavenly begotten us again through the holy Ghost; and by faith in his true and natural Son Jesus Christ, he hath elected, and adopted us his children; and through the same Christ hath given us his Kingdom, and the inheritance of everlasting life.</p></blockquote>

<blockquote><p>For as there are three persons, as I have formerly shewed, who have a joint hand in that work of salvation, the subject of the gospel, so the whole story of the gospel hath three parts also, in every of which some one of them bears an especial part.

The first part God the Father had the chiefest hand in, who drew the platform of this great work, contrived it, made the motion first to his Son, as you shall see anon.

The second, God the Son, when he came down and took flesh, and, clothing himself in the habit of a servant, transacted the redemption of the world according to that draft.

As after him, when he was off the stage, came the Spirit, to apply what he had done, and all the benefits of it, whose work makes up the third part.</p></blockquote>

<blockquote><p>The eternal Sonship of Christ, or that he is the Son of God by eternal generation, or that he was the Son of God before he was the son of Mary, even from all eternity, which is denied by the Socinians, and others akin to them, was known by the saints under the Old Testament; by David (Ps. 2:7, 12); by Solomon (Prov. 8:22, 30), by the prophet Micah, chapter 5, verse 2.

His Sonship was known by Daniel, from whom it is probable Nebuchadnezzar had it (Dan. 3:25), from which it appears he was, and was known to be, the Son of God before he was born of the virgin, or before his incarnation, and therefore not called so on that account. This truth is written as with a sun-beam in the New Testament …</p></blockquote>

<blockquote><p>Of the Trinity.

How many Persons be there in that one Essence of God?

Three, and those both in number, and in very deed distinguished, the Father, Son, and the holy Ghost: which have their subsisting in one divine essence: whereupon it comes to passe, that there be not many Gods, but one God, and the same eternal, infinite, and omnipotent, who is named Jehovah in the Scriptures: and is said to be most simple by reason of essence, and three by reason of Persons.

By what testimonies of Scripture do you prove the Trinity?

Genes. 1.1. God or Elohim created the heaven and the earth. In which place the verb being of the singular number doth signify the most simple essence of God: and the substantive Elohim being the plural number, doth note out the three Persons. Also in the creation of man, God as it were taking counsel with his eternal wisdom, that is, the Son and the holy Ghost, saith thus: vers. 26. Let vs make man after our image. Where he saith, Let us make, because of the number of the persons, and after our image, because of the unity of the essence. Gen. 19.24. The Lord rained from the Lord brimstone and fire upon Sodom and Gomorrah: in which place the person sending the rain, and the person from whom it was sent, (that is the Son) is distinguished from the Father.

Have you any more pregnant proofs out of the new Testament?

1. In the baptism of Christ, Math. 3.16. and Joh. 1.32. the voice of the Father is heard from heaven, This is my beloved Son: in the same place there stands the Son by the river Jordan, the holy Ghost descends in the form of a Dove and sits on Christ.

2. Again, in the transfiguration, there is the Son, and the voice of God the Father is heard from heaven, and Christ is shadowed with a cloud which doth signify the holy Ghost. And further Mat. 28.19. Baptize all nations in the name of the Father, of the Son, and of the holy Ghost: he saith not in names, but in the name, to shew the unity of the three Persons. 2. Cor. 13.13. The grace of our Lord Jesus Christ, and the love of God, and the communion of the holy Ghost be with you all.

Seeing the Scripture doth not use the name of the Trinity, doth the Church well to retain the same?

Yea, no doubt: for the thing it self is found in the Scriptures two manner of ways:

Now sith that the sense of it and the very thing it self is found in the Scriptures, the Church hath liberty to use such words as may familiarly express the thing it self. Moreover, we call the three Persons in God, the Trinity, not because the Scripture calls them so, but because the Scripture saith nothing against it. Yet this word three, whereof this word Trinity is derived, is expressly set down, 1. Joh. 5.7. There be three that bear witness, &amp;c. Whence we argue, that as from one comes Unity, so from three comes Trinity.</p></blockquote>

Three, and those both in number, and in very deed distinguished, the Father, Son, and the holy Ghost: which have their subsisting in one divine essence: whereupon it comes to passe, that there be not many Gods, but one God, and the same eternal, infinite, and omnipotent, who is named Jehovah in the Scriptures: and is said to be most simple by reason of essence, and three by reason of Persons.

By what testimonies of Scripture do you prove the Trinity?

Genes. 1.1. God or Elohim created the heaven and the earth. In which place the verb being of the singular number doth signify the most simple essence of God: and the substantive Elohim being the plural number, doth note out the three Persons. Also in the creation of man, God as it were taking counsel with his eternal wisdom, that is, the Son and the holy Ghost, saith thus: vers. 26. Let vs make man after our image. Where he saith, Let us make, because of the number of the persons, and after our image, because of the unity of the essence. Gen. 19.24. The Lord rained from the Lord brimstone and fire upon Sodom and Gomorrah: in which place the person sending the rain, and the person from whom it was sent, (that is the Son) is distinguished from the Father.

Have you any more pregnant proofs out of the new Testament?

1. In the baptism of Christ, Math. 3.16. and Joh. 1.32. the voice of the Father is heard from heaven, This is my beloved Son: in the same place there stands the Son by the river Jordan, the holy Ghost descends in the form of a Dove and sits on Christ.

2. Again, in the transfiguration, there is the Son, and the voice of God the Father is heard from heaven, and Christ is shadowed with a cloud which doth signify the holy Ghost. And further Mat. 28.19. Baptize all nations in the name of the Father, of the Son, and of the holy Ghost: he saith not in names, but in the name, to shew the unity of the three Persons. 2. Cor. 13.13. The grace of our Lord Jesus Christ, and the love of God, and the communion of the holy Ghost be with you all.

Seeing the Scripture doth not use the name of the Trinity, doth the Church well to retain the same?

Yea, no doubt: for the thing it self is found in the Scriptures two manner of ways:

Now sith that the sense of it and the very thing it self is found in the Scriptures, the Church hath liberty to use such words as may familiarly express the thing it self. Moreover, we call the three Persons in God, the Trinity, not because the Scripture calls them so, but because the Scripture saith nothing against it. Yet this word three, whereof this word Trinity is derived, is expressly set down, 1. Joh. 5.7. There be three that bear witness, &amp;c. Whence we argue, that as from one comes Unity, so from three comes Trinity.”

— Guillaume Bucanus, Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), pp 7-8.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+the+Trinity.%0A%0AHow+many+Persons+be+there+in+that+one+Essence+of+God%3F%0A%0AThree%2C+and+those+both+in+number%2C+and+in+very+deed+distinguished%2C+the+Father%2C+Son%2C+and+the+holy+Ghost%3A+which+have+their+subsisting+in+one+divine+essence%3A+whereupon+it+comes+to+passe%2C+that+there+be+not+many+Gods%2C+but+one+God%2C+and+the+same+eternal%2C+infinite%2C+and+omnipotent%2C+who+is+named+Jehovah+in+the+Scriptures%3A+and+is+said+to+be+most+simple+by+reason+of+essence%2C+and+three+by+reason+of+Persons.%0A%0ABy+what+testimonies+of+Scripture+do+you+prove+the+Trinity%3F%0A%0AGenes.+1.1.+God+or+Elohim+created+the+heaven+and+the+earth.+In+which+place+the+verb+being+of+the+singular+number+doth+signify+the+most+simple+essence+of+God%3A+and+the+substantive+Elohim+being+the+plural+number%2C+doth+note+out+the+three+Persons.+Also+in+the+creation+of+man%2C+God+as+it+were+taking+counsel+with+his+eternal+wisdom%2C+that+is%2C+the+Son+and+the+holy+Ghost%2C+saith+thus%3A+vers.+26.+Let+vs+make+man+after+our+image.+Where+he+saith%2C+Let+us+make%2C+because+of+the+number+of+the+persons%2C+and+after+our+image%2C+because+of+the+unity+of+the+essence.+Gen.+19.24.+The+Lord+rained+from+the+Lord+brimstone+and+fire+upon+Sodom+and+Gomorrah%3A+in+which+place+the+person+sending+the+rain%2C+and+the+person+from+whom+it+was+sent%2C+%28that+is+the+Son%29+is+distinguished+from+the+Father.%0A%0AHave+you+any+more+pregnant+proofs+out+of+the+new+Testament%3F%0A%0A1.+In+the+baptism+of+Christ%2C+Math.+3.16.+and+Joh.+1.32.+the+voice+of+the+Father+is+heard+from+heaven%2C+This+is+my+beloved+Son%3A+in+the+same+place+there+stands+th <blockquote><p>How many ways is the name of God taken in the Scriptures?

Two ways: properly for the substance, essence, and nature: and improperly. Now it is taken properly, or for the essence, when it is taken without the distinction of any one of the persons, as Joh. 4.24. God is a spirit, where God is taken for the whole essence of the Deity, as is also the name Jehovah.

Or else, personally, when there is joined unto the name of God the name of the person: as God the Father, God the Son, God the holy Ghost. Or when the Father is opposed to the Son, who is very God, and the second Person in the Trinity, as Rom. 7.25. I thank God by Jesus Christ. So Rom. 8.3 the Father is called God, the word Father being used personally, because the Person sending is opposed to the Person sent.

Improperly, when it is attributed to Angels or men: and truly, either in regard of their office, or else in respect of the revealing of the will of God, and of their reverence: falsely, either by error; or else by usurpation and custom, as 1. Cor. 8.5. or else by worshipping them. 2. Cor. 4.4. Phil. 3.19.</p></blockquote>

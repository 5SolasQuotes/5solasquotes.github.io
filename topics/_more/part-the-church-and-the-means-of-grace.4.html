<blockquote><p>Sundry of the better sort among us are prone to think that testimonies are of no value without that they be carried to great heights. Hence I pointed them to a notable instance we have have upon record concerning Joseph of Arimathea, to whom the Spirit of God has given a great character, Lk. 23:50-51. He was a good man and just, he consented not to the horrid deed of the murderers of our Lord. Some of note in our day would have said, That was not enough, he ought to have made a more resolute appearance; but we read not that the Lord said so. In several cases the current may be so very strong, that there’s access for no more than through grace to guard against the being carried down with it; ‘Thou shalt not follow a multitude to do evil,” Ex. 23:2.</p></blockquote>

<blockquote><p>This separation in Corinth was in a Church from the idolatry in it; which separation we allow, but not a separation out of a Church, else the words would bear that Paul will have them to forsake the Church of Corinth for idolatrous tables in it and set up a new Church of their own, which the Separatists dare not say, and is contrary to other places, 1 Cor. 5:4; chs. 11 &amp; 14, where he commands and allows their meetings and public Church-communion: Therefore this place proves not their point. What logic is this? Separate from idols, therefore separate from a Church where the true worship of God is professed and taught.</p></blockquote>

</figure><figure class="quote" id="q-be7807c081" data-kw="">
<blockquote><p>It is very much abused, if it be offered to any such thing as that we must come out from among the ministers, and be separated from them, for:

1. This separation here commanded is from infidels, unrighteousness, darkness, Belial, idols. The Corinthians did very ill in eating and sitting at the idols’ tables of the gentiles, which gave great offense to the weak, 1 Cor. 10:17, 20.

2. This was not a separation from the Church of Corinth, nor from the ministers thereof; though there were many corruptions entertained among them, yet they were to have communion in public ordinances, as is proved above: Only it is a separation from the idolatry in it. There may be a separation from the corruptions of a Church, very well consistent with abiding in the communion of that Church.</p></blockquote>

</figure><figure class="quote" id="q-3d1ed319fc" data-kw="">
<blockquote><p>It is one thing to withdraw from civil conversing with particular wicked men, and another thing to separate from God’s Church for its defects. There is therefore this observable in separating and withdrawing, that we are to keep less fellowship in civil things with a brother that is a Church-member and is gross, than with one that is without and not a member; as the apostle writes, 2[?***] Cor. 5:10. But we may and should on the other side keep Church fellowship with a true Church, though in many things faulty and corrupt, whereas we may not at all with an idolatrous company in their worship. Hence in that same epistle to the Corinthians, going to and eating in idols’ temples or at their feasts was so much condemned; yet communicating with the Church of Corinth or living as a member of it (though corrupt both in doctrine and practice) was never found fault with as to worship: For it is clear that that of not eating with an offending brother looks only to civil fellowship, because it is such a fellowship that is condemned with them, as is allowed to heathens, which certainly is such. If our churches therefore be Christ’s churches, as sometimes the favorers of separation grant, there can be no separation from them without turning to a schism.</p></blockquote>

</figure><figure class="quote" id="q-8b60e1e0ff" data-kw="">
<blockquote><p>That Scripture, Rom. 16:17, does not command us to avoid everyone that causes divisions and offenses occasionally and passively, by giving the first rise to divisions by offensive courses; for that way divisions may be caused by infirmities and a man’s using his own light, and by the offense of others, whom upon that account to avoid, were contrary to the same apostle’s doctrine in that same epistle, chs. 14 and 15. But it commands us to avoid them which cause divisions and offenses actively, designedly and purposely, and do promote and abet a downright schism, and will not be persuaded to let divisions fall, though it may be done without prejudice to truth. Next, to “avoid,” there is the same with the duty of turning away, 2 Tim. 3:5, extended there to self-lovers, covetous proud, unholy, having a form of godliness without the power. This cannot be interpreted always and only of withdrawing from Church-communion; for then we must withdraw from all that are self-lovers, from all that are unholy, from all that are hypocrites, which none will affirm: But we may avoid men several other ways, by withdrawing from personal communion with them, or familiar converse, and from communion in their corrupt designs and courses.</p></blockquote>

<blockquote><p>But yet let me freely tell you, that there is one step in Mr. Erskine’s conduct that I am not able to justify; it is, When the synod of Perth and Stirling resolved to give him a modest rebuke, he did not silently receive it. I should never have advised my worthy brother Mr. Erskine to have made any confession of a fault even in his expressions, when his conscience justified him in the same; but I cannot think that his silence at the time that either the synod or General Assembly rebuked him, when they resolved thereby to finish the process, would be construed an acknowledgment of a fault: I am sure that the history of our blessed Lord’s sufferings bears expressly, that, when He was accused of many things before Pilate, He answered nothing; and when he was urged by the self-condemned heathen judge, He still continued silent; and I am persuaded that no good Christian can allege that his silence did import any confession of a fault, yea, it was a fulfilling of the Scripture, Isa. 53:7.</p></blockquote>

<blockquote><p>While that act stands unrepealed, or not annulled, it remains an act and rule of this Church still, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature.’ Now, as to the Brethren: [1] I cannot see any ground to say the sentenced anent them are not materially rescinded, seeing as the Assembly 1733 and their commission did cast them out from this Church, so the Assembly 1734 gave the synod of Perth power and full authority to restore and unite them again to the communion thereof, and to their ministerial charges, which accordingly was done by that synod: And this, in my opinion, was a material condemning of the sentences of the former Assembly and commission that had been pronounced against them. (2) But, whereas ’tis said the act of Assembly 1733 against them, while unrepealed, ‘It still remains an act and rule of this Church, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature,’ and therefore they cannot accede to the judicatories till that act is rescinded, lest they homologate that sinful deed or sentence. Now if this argument prove anything, it proves too much; for it says we are never to join with a Church which has made any unjust or sinful act till repealed: And so the Brethren could never be justified for joining formerly with the Church of Scotland when such unaccountable acts as that of the Assembly 1638, sessions 23-24, was unrepealed: which discharges all persons of whatever quality, ministers or others, to speak or write against that Assembly, or any act of that Assembly, under pain of the censures of the Church: A very bad precedent! And so the Assembly 1642, session 7, enjoins that every presbytery proceed against non-communicants, whether Papists or others, according to the act of parliament, which looks too like the English Sacramental Test: And also the above-cited act of Assembly 1648, anent deposing all suspended ministers who do not submit to the sentences of Church judicatories, and so of other bad acts of Assembly from 1638 to 1649 inclusive. And, if an act in a particular case is a rule in a way of precedent in similar cases, or cases of the like nature, then the instance of overturning the settlement made by the Commission at Auchtermuchty, and the repeated instances of our late General Assemblies in allowing the people of Stow, Troqueir, Dennie, etc. the privilege of sealing ordinances, are good precedents to plead in like cases where ministers are intruded upon Christian congregations. 4thly, They say: “Seeing an accession to a Church cannot be made but in the situation in which that Church is when the accession is made unto her; therefore any accession to her in that situation so far approves of her, as to submit it to her authority what is to be counted defections, and what not; and, if that Church maintain not that testimony which they that accede to her maintain, then they fall from their testimony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-36242d952b" data-kw="">
<blockquote><p>Union may also be consistent with many particular failings and defects in the exercise of government; and possibly the sparing of so corrupt officers and members, yea, the censuring of some unjustly, or the admission of some that are unfit for the ministry, and such like. These indeed are faults, but they are not such as make a Church to be no Church. And though these have sometimes been pretended to be the causes of schisms and divisions in the Church in practice, yet were they never defended to be just grounds of schisms and divisions, but were ever condemned by all councils and fathers, and cannot be in reason sustained. Sure there were such corrupt acts of all kinds among the Jews’ Church officers: Yet is it clear that Nicodemus and Joseph of Arimathea did continue to govern jointly notwithstanding thereof, who yet cannot be counted accessory to any of their deeds, because (which is a third reason) men in such cases have access, even when they are present, to discountenance such corrupt acts by not consenting thereto, and testifying against the same; yea, they may by so doing stand in the way of many wicked acts, which by dividing they cannot do, which is sufficient for their exoneration both before God and men: As we may see in the instances of Joseph and Nicodemus mentioned, who continued united in the government, kept the meetings even when sentences pass against those who will acknowledge Christ, and orders for persecuting Him and them. And yet they are declared free, because they dissented from, and testified against the same: Yea, their freedom and exoneration, by virtue of their dissent, being present, is more solemnly recorded to their honor in the Gospel, than if they had divided.</p></blockquote>

<blockquote><p>To treat with us upon that posture, or upon such terms, is a treatment neither scriptural, reasonable, just nor fair; nor is it the habile way to get grievances redressed. If this be the condition of union, it can never take place in our day, nor in any other period for what I know; at this rate ye proclaim a perpetual war. Nor is there any condescension here; for we might return to the Church of Rome, would they redress just grievances, and return to their happy state wherein they were when the apostle Paul wrote his epistle to the Romans. But, to make Church communion necessarily depend on such a redress in every part, is both destitute of a necessary warrant from the Word, and requires a standing-out until the Churches of Christ be brought to such a state as we are never like to see, nor for what I know is contained within the verge of the Lord’s gracious promises unto his Church.</p></blockquote>

<blockquote><p>You must do it in a peaceable way, so as to manifest that you desire peace, and not to be the least disturbance to the peace of the Church, but that the peace of it is dear and precious to you; therefore, when ye have witnessed the truth, and discharged your conscience in it, you must then be content to sit down quiet: For so the rule is, ‘That the spirits of the prophets must be subject to the prophets,’ in that case. But if it should prove that the Church should continue, if the evil be notorious and great as requires departing, and the Church, after all means used, and all patience, should continue in it; in such a case you may desire to be dismissed from it and depart, but in as peaceable a way as possibly can be; yet continuing in due respect unto the Church for all that, though you should depart, only leaving your witness behind you.</p></blockquote>

</figure><figure class="quote" id="q-8ce7ded970" data-kw="">
<blockquote><p>The committee of the Assembly of Westminster, in their Reply to the Independents, said, If the Church impose anything that is sinful, we must forbear to comply, yet without separation, as was the practice of the puritans in the late times. As to the charge of schism, they admit that difference in judgment, in some particular points, is not schism; nor does an inconformity to some things enjoined deserve that name. But our [Independent] Brethren desire further to set up separate communions, which is a manifest rupture of our societies into others; and is therefore a schism in the Body. This is a setting up altar against altar, allowing our churches, as Independents do, to be true churches.</p></blockquote>

</figure><figure class="quote" id="q-cd9c648b65" data-kw="">
<blockquote><p>So that it would not be a sufficient reason for forsaking the communion of a Church, only to allege a general depravation of manners, even when it should be true, that it did reign therein: But it is no less certain, that when it falls out, that one party of the Church… should confirm itself in errors, and in practices contrary to the service of God, and the salvation of men; and that not only it rejects the instructions given it upon that occasion, but would even force all others to be of the same sentiments, and to practice the same worship, the separation of the other party is just, necessary and indispensable: It is just, for everywhere where there can be nothing else but an unjust communion, there is justice in a separation from it: But there can be nothing else, but unjust communion with a party, which essentially destroys the true worship of God, which shuts up itself in errors, directly contrary to men’s salvation, and which, through an intolerable tyrrany, would constrain all those who live in it, to make a profession of the same errors, it is then just for a man to separate himself from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

</figure><figure class="quote" id="q-b869d84c47" data-kw="">
<blockquote><p>We hold all who profess faith in Christ to be members of the visible Church, though they be not members of a visible congregation, and that the seals of the Covenant [of Grace] should not be denied to them. And for [the] more full clearing of the question, let these considerations be observed: First Distinction: All believers, as believers, in foro Dei, ‘before God’ have right to the seals of the Covenant [of Grace], these to whom the Covenant and body of the Charter belongs, to these the seal belongs, but in foro Ecclesiastico [in the sight of the Church], and in an orderly Church-way, the seals are not to be conferred by the Church upon persons because they believe, but because they profess their believing: therefore the apostles never baptized pagans, but upon profession of their faith. Second Distinction: Faith in Christ truly gives right to the seals of the Covenant [of Grace], and in God’s intention and decree, called voluntas beneplaciti [will of good-pleasure], they belong only to the invisible Church; but the orderly way of the Churches’ giving the seals is because such a society is a professing or visible Church, and [the] orderly giving of the seals according to God’s approving will, called, voluntas signi et revelata [the signified and revealed will], belongs to the visible Church. Third Distinction: The Church may orderly and lawfully give the seals of the Covenant to those to whom the Covenant and promises of grace do not belong in God’s decree of election. Fourth Distinction: The Church may lawfully add to the Church visible such as God adds not to the Church invisible, as they may add Simon Magus; and the Church may lawfully cast out of the visible Church, such as Christ has not cast out of the invisible Church, as the Church may excommunicate regenerate persons for scandalous sins. Fifth Distinction: Then the regenerate-excommunicated have right to the seals of the Covenant, as they have to the Covenant, and yet the Church does lawfully debar them, hic et nunc [here and now], in such a scandalous case, from the seals of the Covenant. We hold that those who are not members of a particular congregation may lawfully be admitted to the seals of the Covenant: First, Because those to whom the promises are made, and profess the Covenant, these should be baptized. But men of approved piety are such, though they be not members of a particular parish. The proposition is Peter’s argument, Acts 2:38. Secondly, Those who are not members of a particular church may be visible professors, and so members of a visible Church. Therefore, the seals of the Covenant belong to them. Thirdly, The contrary opinion has no warrant in God’s Word. Fourthly, The apostles required no more of those whom they baptized but profession of belief, as Acts 10:47, ‘Can any forbid water that these should not be baptized, who have received the Holy Ghost, as well as we?’ Acts 8:37, ‘If thou believest with all thy heart, thou mayest be baptized:’ no more is sought of the jailor, Acts 16:31,34.</p></blockquote>

ion.+Fourth+Distinction%3A+The+Church+may+lawfully+add+to+the+Church+visible+such+as+God+adds+not+to+the+Church+invisible%2C+as+they+may+add+Simon+Magus%3B+and+the+Church+may+lawfully+cast+out+of+the+visible+Church%2C+such+as+Christ+has+not+cast+out+of+the+invisible+Church%2C+as+the+Church+may+excommunicate+regenerate+persons+for+scandalous+sins.+Fifth+Distinction%3A+Then+the+regenerate-excommunicated+have+right+to+the+seals+of+the+Covenant%2C+as+they+have+to+the+Covenant%2C+and+yet+the+Church+does+lawfully+debar+them%2C+hic+et+nunc+%5Bhere+and+now%5D%2C+in+such+a+scandalous+case%2C+from+the+seals+of+the+Covenant.+We+hold+that+those+who+are+not+members+of+a+particular+congregation+may+lawfully+be+admitted+to+the+seals+of+the+Covenant%3A+First%2C+Because+those+to+whom+the+promises+are+made%2C+and+profess+the+Covenant%2C+these+should+be+baptized.+But+men+of+approved+piety+are+such%2C+though+they+be+not+members+of+a+particular+parish.+The+proposition+is+Peter%E2%80%99s+argument%2C+Acts+2%3A38.+Secondly%2C+Those+who+are+not+members+of+a+particular+church+may+be+visible+professors%2C+and+so+members+of+a+visible+Church.+Therefore%2C+the+seals+of+the+Covenant+belong+to+them.+Thirdly%2C+The+contrary+opinion+has+no+warrant+in+God%E2%80%99s+Word.+Fourthly%2C+The+apostles+required+no+more+of+those+whom+they+baptized+but+profession+of+belief%2C+as+Acts+10%3A47%2C+%E2%80%98Can+any+forbid+water+that+these+should+not+be+baptized%2C+who+have+received+the+Holy+Ghost%2C+as+well+as+we%3F%E2%80%99+Acts+8%3A37%2C+%E2%80%98If+thou+believest+with+all+thy+heart%2C+thou+mayest+be+baptized%3A%E2%80%99+no+more+is+sought+of+the+jailor%2C+Acts+16%3A31%2C34.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Other+citations+%28work+not+named%29%2C+pp.+185-6+of+%E2%80%98Whether+the+Seals+of+the+Covenant+can+be+Denied+to+Professors+of+Approved+Piety%2C+because+they+are+Not+Members+of+a+Particular+Visible+Church%2C+in+the+New+Testament%3F%E2%80%99+in+The+Due+Right+of+Presbyteries%E2%80%A6+%281644%29%2C+p <blockquote><p>The communion of saints signifies both that same outward fellowship, whereby the people as members of the visible Church through the ministry of the doctrine both of the prophets and apostles, and also of the sacraments, are called into one body… Concerning that same outward union we must know that the truth of the prophetical, and apostolical doctrine is an undoubted token of the visible Church, 1 Tim. 3. Besides all that profess that same truth, wheresoever they shall come in the world to any visible company of the Church, they have right to communicate in hearing the word, in prayers, and receiving of the sacraments, Isa. 2:2-3…</p></blockquote>

<blockquote><p>For Rom. 4:11, Abraham is there called the father of all them that believe, whether they were members of a particular visible Church or not. And for ought we find in the holy story, there might be some believers even in Abraham’s own time that were neither members of Abraham’s family, nor yet under the government or guidance of any particular church. If a son or bond-servant of Ephron the Hittite, or of any other Amorite or Canaanite were then brought unto the knowledge of the true God, and to wait for the promise, why might not the infant of such an one have then been circumcised, though not living in a visible Church? … 3. Those that for the present live not under the discipline and a particular Church, and yet make profession of true religion with the true visible Churches, and bring their children to them to be baptised, making solemn promise to bring up their children in the faith that is professed in those Churches; of which sort there are a great number in these Low-countries [the Netherlands], because none here are compelled to the sacraments, nor to subjection under the discipline: These in special are the persons that in our question are ‘without’ [the Church in a certain sense]. These parents, though in regard of that Church where they received their own baptism, and in regard of that Church whereunto they bring their infants to be baptized, they profess and practice some imperfect communion therewith, and therefore in some sense may be said to be of such Churches; yet because for the present they live not within the pale of any ecclesiastical government, neither are subject unto the discipline, either of one or other Church, in this regard are such here commonly said to be ‘without’. Now how Mr. Davenport will deduct and infer from the place alleged [1 Cor. 5:12] that these kind of parents are not to have the privilege of Christians, so far that their infants may be baptized, that cannot I comprehend: this remains to be manifested by him. Those only, according to the order of these Reformed Churches, are admitted for complete members of the Church, who bringing testimony of their good conversation, after examination and profession of their agreement with us in the same faith and religion, and after solemn covenant and promise of submission unto that discipline and government exercised amongst them, have their names published before the whole congregation the Lord’s-Day following, and when no just exception comes against them, are then received and confirmed for members of such particular churches. But that the children of these only are to be baptized, that is not made to appear from the sentence of Paul, 1 Cor. 5:12. For this third sort of persons without, though their fault be great in not joining unto some particular church when opportunity permits, though some through ignorance and error, and some for their carnal case and other sinister respects, do abstain from joining themselves unto the church: yet even among these also some have more knowledge of the truth and are more frequent in attending upon the public worship of God, and are otherwise more unblameable in their conversation than some of those…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-paget.html">John Paget</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to the Unjust Complaints of William Best &amp; of such Other as have Subscribed Thereunto. Also an Answer to Mr. John Davenport</cite>, [a congregationalist]… his Allegations of Scripture Against the Baptizing of Some Kind of Infants (Amsterdam, 1635), ‘An Answer to the Allegations of Scripture brought by Mr. Davenport, Against the Baptizing of such Infants whose Parents Appear to be Christians…’, p. 141 ff. Paget (c.1574–1638 or 1640) was an English puritan and presbyterian minister in Amsterdam, firmly opposed to the English separatistic and Independent churches that had magnetized to Amsterdam.</span></figcaption>

+in+their+conversation+than+some+of+those%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Paget%2C+An+Answer+to+the+Unjust+Complaints+of+William+Best+%26+of+such+Other+as+have+Subscribed+Thereunto.+Also+an+Answer+to+Mr.+John+Davenport%2C+%5Ba+congregationalist%5D%E2%80%A6+his+Allegations+of+Scripture+Against+the+Baptizing+of+Some+Kind+of+Infants+%28Amsterdam%2C+1635%29%2C+%E2%80%98An+Answer+to+the+Allegations+of+Scripture+brought+by+Mr.+Davenport%2C+Against+the+Baptizing+of+such+Infants+whose+Parents+Appear+to+be+Christians%E2%80%A6%E2%80%99%2C+p.+141+ff.+Paget+%28c.1574%E2%80%931638+or+1640%29+was+an+English+puritan+and+presbyterian+minister+in+Amsterdam%2C+firmly+opposed+to+the+English+separatistic+and+Independent+churches+that+had+magnetized+to+Amsterdam.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4bd629bc5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4bd629bc5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=For%20Rom.%204%3A11%2C%20Abraham%20is%20there,their%20conversation%20than%20some%20of%20those&amp;text=For%20Rom.%204%3A11%2C%20Abraham%20is%20there%20called%20the&amp;text=unblameable%20in%20their%20conversation%20than%20some%20of%20those" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Question 3: Whether do you not hold all visible believers to be within the visible Church as members thereof, and not ‘without’, in the apostle’s sense, 1 Cor. 5, and therefore ought so to be acknowledged and accepted in all congregations wheresoever they shall come, and are so known: and ought (if they desire and be not otherwise unfit) of right to be permitted to partake in all God’s ordinances and Church privileges there, so far as they personally concern themselves, although they be not as yet fixed members in particular covenant, either with that congregation where for the present they reside, nor with any other? Question 4: Whether you do not hold that baptism rightly (for substance) partaked does make them that are so baptized, members of the visible Church: and so to have right (at least quoad nos [as far as to us]) to all the privileges thereof (so far as they are otherwise fit) until they be cast out (if they so deserve) by excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 32 Questions (1639) in Richard Mather, Church-Government &amp; Church-Covenant Discussed, in an Answer of the Elders of the Several Churches in New-England to Two &amp; Thirty Questions Sent Over to Them by Diverse Ministers in England, to Declare their Judgments Therein… (London, 1643) Bernard was an English puritan. These questions were answered by the New England congregationalists, but it does not appear that Bernard ever published a response (at least that is on the internet) to those answers.</span></figcaption>

</figure><figure class="quote" id="q-92cc8cff8f" data-kw="">
<blockquote><p>Objection [of a congregationalist]: The union betwixt Christ and his Church is as strait and immediate, as the union betwixt the vine and the branches, betwixt the head and the body, betwixt the Husband and the Wife. Therefore every true Church of Christ has direct and immediate interest in, and title to Christ Himself, and the whole New Testament, and every ordinance of it. Answer: The strait union betwixt Christ and the Church, expressed by these comparisons, cannot be understood of the Church taken politically: for then the union betwixt Christ and the Church might be dissolved as often as the Church ceases to be ordered and governed as an Ecclesiastical republic. It is therefore to be understood either of the invisible Church, or at most of the visible Church taken metaphysically or entitatively. But I add withal, it is to be likewise understood of every faithful Christian: so that not only every true Church, but every true member thereof, by virtue of this union, has direct and immediate title to Christ, and to the benefit of all his ordinances for his edification and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, … (Edinburgh, 1641) | pt. 2, ch. 11, ‘Objections…’, pp. 201-2</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>…therefore all who would be saved, must join to a visible independent congregation [a congregationalist’s arguments conclude]; hence no Church has title and due right to the Word and sacraments but members of such a congregation: this is the reason why men of approved piety are denied the seales of the covenant, and their children excluded from baptism and themselves debarred from the Lord’s Supper, because they are not members of your congregation; and members they cannot be, because they find no warrant from God’s Word, to swear your church-covenant, and to your [congregationalist] church-government, which is so far against the Word of God: the seals of the covenant belong to all professing believers, as God’s Word says, Acts 10:47; 8:37; 16:31-33; 1 Cor. 11:28. Whether he be a member of a particular independent Church, or not, God the Lawgiver makes not this exception, neither should man do it.</p></blockquote>

<blockquote><p>John Baptist and the apostles, Acts 8; Jn. 3, after a confession never asked for their conversion, but baptized, for straightway without delay, even in the night (for so the Word notes, Mt. 21:19; Luke 4:39 &amp; 5:25 &amp; 8:44) the jailor and his house, Acts 16, Cornelius and his house, Acts 10, the eunuch, the multitude of John Baptist’s hearers were baptized members of the universal Church, 1 Cor. 12:12-13, where there was no particular congregation to receive and admit them as members, as Mr. Richard Baxter solidly observes. Nor is it worthy the refuting that the apostles, by an extraordinary power, might baptize them, though to no certain church, but pastors now have not that power: for the apostles baptizing and preaching, and administering the other seal differ not. The apostles preached and baptized in all places as ordinary officers by the same command, Mt. 28:19, by which we teach and baptize in species and nature, from the ordinary pastoral acts of an ordinary minister; they speak with tongues, [and] work miracles as apostles, but they preach and baptize hic &amp; nunc as ordinary officers.</p></blockquote>

<blockquote><p>11. This [church] covenant (thus distinguished from the Covenant of Grace) they hold to be that covenant which is sealed by the sacraments, and for the sealing and ratifying of which the sacraments were principally ordained of God, and therefore to be administered only to such as are first entered into this covenant, as seals thereof. Apology, p. 15, 19, 31; Answer to 9; pos. pp. 63 &amp; 66. And therefore, that such persons as (by their condition) cannot join in church covenant, nor live in church fellowship with a set society, are not bound to partake in sacraments. Apology, pp. 39 &amp; 41. See [John] Robinson, Justification, pp. 80 &amp; 110, though I do not find the Brownists so solicitously to distinguish between the church covenant and the Covenant of Grace as these our [Independent and congregationalist] brethren do.</p></blockquote>

<blockquote><p>14. I would willingly inquire of the Independents, to what church were added so many thousands that were baptized by the apostles and added unto the Church in one day? Whether to a particular congregation, or to a greater ecclesiastical consociation? It could not be to a particular congregation:

1. For the reasons I have already produced.

2. Because the apostles were not particular, but universal ministers, set over the universal militant Church; and therefore, in virtue of their charge, admitted them to be members of all the Churches, whereof they were ministers.

3. Because they were of diverse and sundry countries: neither is it credible that to be a member of the Church, they were bound to quit their countries and to stay at Jerusalem, howsoever so long as they did stay there, they might participate as well of all the rest of God’s ordinances, as of baptism: Ergo, they were added to some greater consociation, viz. to that, and to all those, whereof the apostles were ministers; for out of all doubt, the apostles who baptized them could not refuse to admit them unto the Lord’s Table wherever they celebrated the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/adam-steuart.html">Adam Steuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations</cite>, The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations… (London, 1644), p. 92 Steuart (1591–1654) was a Scottish presbyterian, philosopher, controversialist and professor in both France and the Netherlands.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>…that such who were known to be godly might not come to the sacrament of the Lord’s Supper, unless they were members of some particular congregation, and so, in their partaking with you, they must yield that grand Brownistical principle, the foundation of other errors among the Separatists, namely, that sacraments belong not to visible believers, but as they are members of some particular congregation… And let me entreat you, in your reply you [will] give to this answer, to give me a Scripture to prove that all men who come to the Lord’s Supper must profess their membership and their retaining to such a particular congregation: I profess myself of another judgement, and cast the glove to any of you five, or to you all; That it is lawful for the ministers of Christ to receive such whom they know to be godly to the Lord’s Supper, though they be not members of a particular church, and to receive those who are members without any [of them] professing themselves to be so: Suppose some godly merchants or marriners, who all their days travel and never stay long in any one place, yet in all places where they come, desire to join in the ordinances, ought not such to be received? The standing rule of coming to the Lord’s Supper will be found to be faith and godliness shown forth, rather than the formality of membership: …so I find Mr. Batchelour (one of you) writing from Rotterdam of your churches, that they will not keep back the sacrament from any of the godly of such churches in England, as Mr. Goodwin’s and Mr. Calamy’s are (always provided that their own pastors do consent unto it). Now the godly who are gone into Holland, and especially to New-England, not finding any such word in Scripture of bringing a ticket from their ministers, and so coming into those countries without it, may be long kept from the sacrament of the Lord’s Supper till they either go [back] into England and fetch it, or till they send for it over, and have a return back of the consent of their own pastors (which may be, was the reason, that though you offered to receive into the Communion of the Lord’s Supper some godly that came to visit you in your exile, yet for want of bringing their pastor’s consent unto it, returned into England without partaking in the Lord’s Supper with you). Which (by the way) will be a good warning for all that henceforth go over into Holland or New-England, to carry their minister’s consents over with them, lest otherwise they be not admitted to the Lord’s Supper…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…that such who were known to be godly might not come to the sacrament of the Lord’s Supper, unless they were members of some particular congregation, and so, in their partaking with you, they must yield that grand Brownistical principle, the foundation of other errors among the Separatists, namely, that sacraments belong not to visible believers, but as they are members of some particular congregation… And let me entreat you, in your reply you [will] give to this answer, to give me a Scripture to prove that all men who come to the Lord’s Supper must profess their membership and their retaining to such a particular congregation: I profess myself of another judgement, and cast the glove to any of you five, or to you all; That it is lawful for the ministers of Christ to receive such whom they know to be godly to the Lord’s Supper, though they be not members of a particular church, and to receive those who are members without any [of them] professing themselves to be so: Suppose some godly merchants or marriners, who all their days travel and never stay long in any one place, yet in all places where they come, desire to join in the ordinances, ought not such to be received? The standing rule of coming to the Lord’s Supper will be found to be faith and godliness shown forth, rather than the formality of membership: …so I find Mr. Batchelour (one of you) writing from Rotterdam of your churches, that they will not keep back the sacrament from any of the godly of such churches in England, as Mr. Goodwin’s and Mr. Calamy’s are (always provided that their own pastors do consent unto it). Now the godly who are gone into Holland, and especially to New-England, not finding any such word in Scripture of bringing a ticket from their ministers, and so coming into those countries without it, may be long kept from the sacrament of the Lord’s Supper till they either go [back] into England and fetch it, or till they send for it over — Thomas Edwards, Antapologia, or a Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, … (London, 1644), p. 52">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6that+such+who+were+known+to+be+godly+might+not+come+to+the+sacrament+of+the+Lord%E2%80%99s+Supper%2C+unless+they+were+members+of+some+particular+congregation%2C+and+so%2C+in+their+partaking+with+you%2C+they+must+yield+that+grand+Brownistical+principle%2C+the+foundation+of+other+errors+among+the+Separatists%2C+namely%2C+that+sacraments+belong+not+to+visible+believers%2C+but+as+they+are+members+of+some+particular+congregation%E2%80%A6+And+let+me+entreat+you%2C+in+your+reply+you+%5Bwill%5D+give+to+this+answer%2C+to+give+me+a+Scripture+to+prove+that+all+men+who+come+to+the+Lord%E2%80%99s+Supper+must+profess+their+membership+and+their+retaining+to+such+a+particular+congregation%3A+I+profess+myself+of+another+judgement%2C+and+cast+the+glove+to+any+of+you+five%2C+or+to+you+all%3B+That+it+is+lawful+for+the+ministers+of+Christ+to+receive+such+whom+they+know+to+be+godly+to+the+Lord%E2%80%99s+Supper%2C+though+they+be+not+members+of+a+particular+church%2C+and+to+receive+those+who+are+members+without+any+%5Bof+them%5D+professing+themselves+to+be+so%3A+Suppose+some+godly+merchants+or+marriners%2C+who+all+their+days+travel+and+never+stay+long+in+any+one+place%2C+yet+in+all+places+where+they+come%2C+desire+to+join+in+the+ordinances%2C+ought+not+such+to+be+received%3F+The+standing+rule+of+coming+to+the+Lord%E2%80%99s+Supper+will+be+found+to+be+faith+and+godliness+shown+forth%2C+rather+than+the+formality+of+membership%3A+%E2%80%A6so+I+find+Mr.+Batchelour+%28one+of+you%29+writing+from+Rotterdam+of+your+churches%2C+that+they+will+not+keep+back+the+sacrament+from+any+of+the+godly+of+such+churches+in+England%2C+as+Mr.+Goodwin%E2%80%99s+and+Mr.+Calamy%E2%80%99s+are+%28always+provided+that+their+own+pastors+do+consent+unto+it%29.+Now+the+godly+who+are+gone+into+Holland%2C+and+especially+to+New-England%2C+not+finding+any+such+word+in+Scripture+of+bringing+a+ticket+from+their+ministers%2C+and+so+coming+into+those+countries+without+it%2C+may+be+long+kept+from+the+sacrament+of+the+Lord%E2%80%99s+Supper+till+they+either+go+%5Bback%5D+into+England+and+fetch+it%2C+or+till+they+send+for+it+over%2C+and+have+a+return+back+of+the+consent+of+their+own+pastors+%28which+may+be%2C+was+the+reason%2C+that+though+you+offered+to+receive+into+the+Communion+of+the+Lord%E2%80%99s+Supper+some+godly+that+came+to+visit+you+in+your+exile%2C+yet+for+want+of+bringing+their+pastor%E2%80%99s+consent+unto+it%2C+returned+into+England+without+partaking+in+the+Lord%E2%80%99s+Supper+with+you%29.+Which+%28by+the+way%29+will+be+a+good+warning+for+all+that+henceforth+go+over+into+Holland+or+New-England%2C+to+carry+their+minister%E2%80%99s+consents+over+with+them%2C+lest+otherwise+they+be+not+admitted+to+the+Lord%E2%80%99s+Supper%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+Antapologia%2C+or+a+Full+Answer+to+the+Apologetical+Narration+of+Mr.+Goodwin%2C+Mr.+Nye%2C+Mr.+Sympson%2C+Mr.+Burroughs%2C+Mr.+Bridge%2C+%E2%80%A6+%28London%2C+1644%29%2C+p.+52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb884325095.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b884325095.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=that%20such%20who%20were%20known%20to,not%20admitted%20to%20the%20Lord%E2%80%99s%20Supper&amp;text=that%20such%20who%20were%20known%20to%20be%20godly&amp;text=they%20be%20not%20admitted%20to%20the%20Lord%E2%80%99s%20Supper" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-916cd650fe" data-kw="">
<blockquote><p>Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed</cite>, (London, 1645), pp. 16-17</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.”

get="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/916cd650fe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=Also%20it%20is%20said%2C%20Acts%202%3A47,they%20are%20all%20one%20visible%20Church&amp;text=Also%20it%20is%20said%2C%20Acts%202%3A47%2C%20%E2%80%98God%20added&amp;text=receive%3B%20therefore%20they%20are%20all%20one%20visible%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-42dc7236d2" data-kw="">
<blockquote><p>Fourthly, the signs that difference a true Church from a false, do not primarily belong to a particular congregation, but to the Church-catholic-visible, viz. profession of the true faith, the administration of the true ordinances of God, the Word and sacraments; for therein all the whole Church agree, and is thereby distinguished from those that are without, not from those that are within. This is no note to know this or that particular church by, from another, for it is common to the universal Church, it distinguishes not among themselves, but from the general common opposite: the heathen, or the gross heretic. A man being lead into a vault where were the skulls of many dead men, and understanding that Alexander’s skull was there, desired his guide to show him that; his guide told him it was that skull with the hollow eye holes and with the gristly nose, and with futures crossing the brain pan, and when the man replied that they had all so, yea says his guide, there is no difference between kings and other men’s skulls when they are dead. So if any man should ask you or me which is the church of Ipswich, Dedham or Colchester, it were a folly to say it is the Church where the word of God is preached and sacraments administered, and that profess Jesus Christ to be crucified, dead and buried, risen again, and ascended into Heaven, for so do all the Church catholic, but I must give some other notes to distinguish any of them, for these are not distinctive, because common. Therefore the signs of the true Church belong primarily to the whole, secondarily to particular parts thereof, and are therefore not distinctive to the parts. That which is primary to any thing is distinctive to that thing, but that which is secondary and common is not distinctive from other particulars of the like kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed</cite>, (London, 1645), p. 29</span></figcaption>

</figure><figure class="quote" id="q-33602b5782" data-kw="">
<blockquote><p>If they be converted from heathens, they are not first converted into this or that particular church, but converted first into the Church catholic, and then secondarily admitted members of this or that particular congregation… They are made members of the whole, by conversion to the faith, and initiated by the sacrament of baptism externally, but are secondarily made members of a particular congregation, by cohabitation, or consociation. Suppose a man had abundance of sheep as Abraham, Isaac, Jacob, and Job, who had 14,000, and these sheep had all one brand of the owners upon them, and these sheep were divided into several flocks, under several shepherds, in several sheep-walks, of the same owners, according to his appointment: the primary consideration of any of these sheep or flocks is not that they are under such a keeper, in such a sheep walk, but the first consideration of them is that they are such a man’s sheep, either bought or bred etc. bearing his brand and fed by his servants, on his ground; and then the more particular and secondary consideration and notion is that they are under such a particular shepherd in such a particular walk. And so the first consideration of any part of Gods flock, whether person or congregation is that they are God’s people, born or converted to Him, fed and nourished by his ordinances and ministers, and then the particular secondary notion is that they are fed by such a pastor in such a place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed</cite>, (London, 1645), pp. 30-31</span></figcaption>

</figure><figure class="quote" id="q-71c04a633c" data-kw="">
<blockquote><p>Sixthly, the ministers are primarily ministers of the Church catholic; secondarily, of this or that particular flock or congregation: and therefore the catholic is the prime Church. And this appears by this demonstration: That Church to the which the donation of the ministry was first made, is the first subject thereof, but that was the Church catholic, therefore. For proof hereof see 1 Cor. 12:28-29, ‘God hath set some in the Church, first apostles, secondarily prophets, thirdly teachers.’ Now this Church was the Church catholic, and not any particular congregation, for it is the Church to which the Lord gave apostles. Note also from hence, that the same Church to which God gave apostles, and prophets, to the same He gave teachers also. Bishop and pastor may seem to be in respect to the particular relation to some particular place, wherein by the polity of the Church a particular minister is set, but presbyter, minister, and teacher, more general, extending to the whole Church catholic. Paul an apostle calls himself a teacher and preacher, 2 Tim. 1:11. Peter also and John the apostles call themselves presbyters, 1 Pet. 5:1-2; Ep. John 1; 3 John 1, we find also that ministers are in Scripture spoken of under a general notion. They are called ministers of the Word, Luke 1:2, and ministers of God, 2 Cor. 6:4, and ministers of Christ, 1 Cor. 4:1, and ministers of the New Testament, 2 Cor. 3:6, and ministers of the Gospel, 1 Thess. 3:2, and ministers of the Lord, Eph. 6:21, where the ministerial office is noted by the reference thereof to the author that employs them, and the subject about which they are employed, and not by the object to whom they preached; They are not called ministers of the people, but their teachers, rulers, pastors, overseers, or ministers for them, Col. 1:7. And if a minister of this or that congregation were not a minister of the Church catholic visible, then he were no minister out of his own congregation, and therefore could not preach, or administer any sacrament, as a minister, out of his own congregation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed</cite>, (London, 1645), pp. 32-33</span></figcaption>

<blockquote><p>A man may administer sacraments where he preaches not, as the apostles baptized, but Christ only preached there. And he that baptized Cornelius and his company, did not preach unto them, but Peter only preached. We read not that the [Greek] or minister, which Paul and Barnabas carried about with them, did preach. A minister may both preach and administer sacraments where he rules not, as Philip to the eunuch, the apostles and the 70 in Christ’s time: and ministers that preach abroad in a journey, or at a lecture.</p></blockquote>

<blockquote><p>In the sacrament of baptism the Independents lay a pathway to Anabaptism, for first they come close up to the most rigid Brownists, denying baptism to the most part of Christian infants; yea they will grant it to a very few: to these alone whose immediate parents are members of their congregation, who are a wonderful poor handful: all other infants they will have unbaptized till they come to the years of understanding and declare not only their actual faith and holiness, but their subjection to the Kingdom of Christ, that is to their Independency: they will have no stipulation made for the infants’ education… … Secondly, they esteem not baptized infants to be members of their church before they have entered into their [church] covenant; till then they hold them from the Lord’s Table and all the acts of discipline, as people without the Church and not members of it: If it be so, their baptism was of so small use that well they might have wanted it to the time of their admission to be members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), ch. 6, pp. 119-20</span></figcaption>

<blockquote><p>2. We deny also that by such a church-covenant [of the Independents] that right is obtained which the members of a Church in ecclesiastical communion have to the sacraments of grace, the privileges of the ecclesiastical ministry and other benefits which Christ has given to his Churches. The reasons of our denial are these:

1. Because the apostles have not ordained any such church-covenant between the members and the pastors of a church; neither in the admission of members into the Church did require such a covenant as necessary: but by the sacrament of baptism they received such as professed the truth and holiness into the Church-visible, and joined in the same exercises of divine worship with those who were without any such covenant received into an ecclesiastical body with themselves. See Acts 2:42,47; 5:13; 8:12; 9:6 &amp; 18:8.

2. Under the Old Testament the particular churches in the synagogues entered not into any solemn church-covenant in the admission of members: but only on extraordinary occasions, when they had made defection from God, all the faithful of the whole national Church renewed their Covenant with God, for restoring the decayed worship of God; or when they were by some other necessity called upon for renewing such a covenant.

3. No man can enjoin anything upon the consciences of men (as absolutely necessary to enjoying the sacraments of divine grace and the benefits of the ministry of the Church) which God hath not enjoined; without damnable will-worship. But God has not enjoined such a Covenant on the consciences of men as absolutely necessary: for there is no law of God wherein He has enjoined a necessity of this covenant as the essential form of Church-communion, so as that without it no man can be [a] member of a visible Church, or have right to the seals of the Covenant: Therefore the necessity of this covenant is a will-worship and so to be rejected.

4. The means whereby the members of a Church-visible are associated and united into external ecclesiastical communion, are baptism under the New Testament, as circumcision was under the Old Testament, 1 Cor. 12:13, as Cornelius, Acts 10:47, Lydia, Acts 16:15 and others, were by baptism engrafted into the body of the Church visible: which in those of years is joined with an embracing and profession of sound doctrine and subjection to the ordinances of God; as appears in the believers, Acts 2:41, the Bereans, Acts 17:10, and by Christ’s commandment, Mt. 28:19. Hence say the Professors of Leiden, that beside the primary uses of the sacrament of baptism, there are other secondary uses of it: to wit, the external engrafting them into a particular visible Church, Acts 2:41, the uniting of Christs members amongst themselves and into one body: 1 Cor. 12:12, and consequently upon these, a signification of our profession; and a distinction and separation from all other assemblies of unbelievers. This Church-covenant therefore is not the formal reason of our ecclesiastical communion in the Church-visible. Hence also our churches of the Netherlands in admitting of pastors or Church members do not enter into any such Church-covenant: which yet are true visible Churches of God; whose members have all essential requisites necessary to Church communion in the visible-Church. … 3. We reject also the opinion of those who affirm that the sacraments of the Old and New Testament are signs and seals to confirm this Church-covenant, and so instituted by God for the ratifying of it; that they are to be administered to those only, who are by such a Church-covenant united amongst themselves; but to be denied to others, though known to be godly, who be not in such a Church-communion and strict fellowship. Whereas it does most clearly appear out of the holy Scriptures that the sacraments were instituted by God in his Church, chiefly and in the first place to be signs and seals of the Covenant of Grace, and of the benefits promised in the Covenant of Grace, and of salvation procured by Christ for us, as is manifest by the sacrament of circumcision, Gen. 17:7,10; Rom. 4:11, of the Passover, 1 Cor. 5, of Baptism, Mark 1:4; Acts 2:38-39 and 22:16; Rom. 6:3-4; Titus 3:5, and of the Lord’s Supper, Mt. 26:26-28; 1 Cor. 11:24-26. But in a secondary respect we acknowledge the Sacraments to be seals of our outward engrafting into the Church-visible, and our conjunction into one body of the Church, Acts 2:41; 1 Cor. 12:12-13, and that, as we conceive, of the catholic Church; so that he that is baptized is not baptized into the communion only of this or that particular, or parochial Church, but is joined into that one body of the Church catholic and universal: as the whole ministry of the Church is given by Christ to men, to bring them to the unity and conjunction of the Church catholic and universal, and to engraft them as members into it, Eph. 4:11-12; 1 Cor. 12:28; Rom. 12:5-7. And as by Excommunication duly performed the person excommunicate is not cast out of this or that particular Church only, but is bound all the world over, and shut out from the brotherly communion of the Church universal, Mt. 18:17-18, so the sacraments of baptism and the Lord’s Supper are seals to a man of ecclesiastical communion, not only in a particular Church, but in the Church universal. And therefore we hold that these sacraments are to be administered not to those only who by a Church Covenant have joined themselves to some particular Church, but to all the members of the Church catholic, who have duly prepared themselves for the partaking of them. Thus our Belgic churches deny not the seal of Baptism to the children of those parents, who have not by a confession of faith and submission to ecclesiastical discipline, joined themselves to any particular church; according to the practice of the Jewish Church, Josh. 5:4-6, as neither do we deny the participation of the Lord’s Supper to those who by reason of the necessity of their calling cannot join themselves to any particular Church, but are forced to travel through diverse parochial churches.</p></blockquote>

of Grace, and of the benefits promised in the Covenant of Grace, and of salvation procured by Christ for us, as is manifest by the sacrament of circumcision, Gen. 17:7,10; Rom. 4:11, of the Passover, 1 Cor. 5, of Baptism, Mark 1:4; Acts 2:38-39 and 22:16; Rom. 6:3-4; Titus 3:5, and of the Lord’s Supper, Mt. 26:26-28; 1 Cor. 11:24-26. But in a secondary respect we acknowledge the Sacraments to be seals of our outward engrafting into the Church-visible, and our conjunction into one body of the Church, Acts 2:41; 1 Cor. 12:12-13, and that, as we conceive, of the catholic Church; so that he that is baptized is not baptized into the communion only of this or that particular, or parochial Church, but is joined into that one body of the Church catholic and universal: as the whole ministry of the Church is given by Christ to men, to bring them to the unity and conjunction of the Church catholic and universal, and to engraft them as members into it, Eph. 4:11-12; 1 Cor. 12:28; Rom. 12:5-7. And as by Excommunication duly performed the person excommunicate is not cast out of this or that particular Church only, but is bound all the world over, and shut out from the brotherly communion of the Church universal, Mt. 18:17-18, so the sacraments of baptism and the Lord’s Supper are seals to a man of ecclesiastical communion, not only in a particular Church, but in the Church universal. And therefore we hold that these sacraments are to be administered not to those only who by a Church Covenant have joined themselves to some particular Church, but to all the members of the Church catholic, who have duly prepared themselves for the partaking of them. Thus our Belgic churches deny not the seal of Baptism to the children of those parents, who have not by a confession of faith and submission to ecclesiastical discipline, joined themselves to any particular church; according to the practice of the Jewish Church, Josh. 5:4-6, as neither do we deny the participation of the Lord’s Supper to — Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God. Written at the Command and appointment of the, [Dutch] Walachrian Classis [Presbytery] (London, 1645), ch. 2, ‘Of a Church Covenant’, pp. 17-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+We+deny+also+that+by+such+a+church-covenant+%5Bof+the+Independents%5D+that+right+is+obtained+which+the+members+of+a+Church+in+ecclesiastical+communion+have+to+the+sacraments+of+grace%2C+the+privileges+of+the+ecclesiastical+ministry+and+other+benefits+which+Christ+has+given+to+his+Churches.+The+reasons+of+our+denial+are+these%3A+1.+Because+the+apostles+have+not+ordained+any+such+church-covenant+between+the+members+and+the+pastors+of+a+church%3B+neither+in+the+admission+of+members+into+the+Church+did+require+such+a+covenant+as+necessary%3A+but+by+the+sacrament+of+baptism+they+received+such+as+professed+the+truth+and+holiness+into+the+Church-visible%2C+and+joined+in+the+same+exercises+of+divine+worship+with+those+who+were+without+any+such+covenant+received+into+an+ecclesiastical+body+with+themselves.+See+Acts+2%3A42%2C47%3B+5%3A13%3B+8%3A12%3B+9%3A6+%26+18%3A8.+2.+Under+the+Old+Testament+the+particular+churches+in+the+synagogues+entered+not+into+any+solemn+church-covenant+in+the+admission+of+members%3A+but+only+on+extraordinary+occasions%2C+when+they+had+made+defection+from+God%2C+all+the+faithful+of+the+whole+national+Church+renewed+their+Covenant+with+God%2C+for+restoring+the+decayed+worship+of+God%3B+or+when+they+were+by+some+other+necessity+called+upon+for+renewing+such+a+covenant.+3.+No+man+can+enjoin+anything+upon+the+consciences+of+men+%28as+absolutely+necessary+to+enjoying+the+sacraments+of+divine+grace+and+the+benefits+of+the+ministry+of+the+Church%29+which+God+hath+not+enjoined%3B+without+damnable+will-worship.+But+God+has+not+enjoined+such+a+Covenant+on+the+consciences+of+men+as+absolutely+necessary%3A+for+there+is+no+law+of+God+wherein+He+has+enjoined+a+necessity+of+this+covenant+as+the+essential+form+of+Church-communion%2C+so+as+that+without+it+no+man+can+be+%5Ba%5D+member+of+a+visible+Church%2C+or+have+right+to+the+seals+of+the+Covenant%3A+Therefore+the+necessity+of+this+covenant+is+a+will-worship+and+so+to+be+rejected.+4.+The+means+whereby+the+members+of+a+Church-visible+are+associated+and+united+into+external+ecclesiastical+communion%2C+are+baptism+under+the+New+Testament%2C+as+circumcision+was+under+the+Old+Testament%2C+1+Cor.+12%3A13%2C+as+Cornelius%2C+Acts+10%3A47%2C+Lydia%2C+Acts+16%3A15+and+others%2C+were+by+baptism+engrafted+into+the+body+of+the+Church+visible%3A+which+in+those+of+years+is+joined+with+an+embracing+and+profession+of+sound+doctrine+and+subjection+to+the+ordinances+of+God%3B+as+appears+in+the+believers%2C+Acts+2%3A41%2C+the+Bereans%2C+Acts+17%3A10%2C+and+by+Christ%E2%80%99s+commandment%2C+Mt.+28%3A19.+Hence+say+the+Professors+of+Leiden%2C+that+beside+the+primary+uses+of+the+sacrament+of+baptism%2C+there+are+other+secondary+uses+of+it%3A+to+wit%2C+the+external+engrafting+them+into+a+particular+visible+Church%2C+Acts+2%3A41%2C+the+uniting+of+Christs+members+amongst+themselves+and+into+one+body%3A+1+Cor.+12%3A12%2C+and+consequently+upon+these%2C+a+signification+of+our+profession%3B+and+a+distinction+and+separation+from+all+other+assemblies+of+unbelievers.+This+Church-covenant+therefore+is+not+the+formal+reason+of+our+ecclesiastical+communion+in+the+Church-visible.+Hence+also+our+churches+of+the+Netherlands+in+admitting+of+pastors+or+Church+members+do+not+enter+into+any+such+Church-covenant%3A+which+yet+are+true+visible+Churches+of+God%3B+whose+members+have+all+essential+requisites+necessary+to+Church+communion+in+the+visible-Church.+%E2%80%A6+3.+We+reject+also+the+opinion+of+those+who+affirm+that+the+sacraments+of+the+Old+and+New+Testament+are+signs+and+seals+to+confirm+this+Church-covenant%2C+and+so+instituted+by+God+for+the+ratifying+of+it%3B+that+they+are+to+be+administered+to+those+only%2C+who+are+by+such+a+Church-covenant+united+amongst+themselves%3B+but+to+be+denied+to+others%2C+though+known+to+be+godly%2C+who+be+not+in+such+a+Church-communion+and+strict+fellowship.+Whereas+it+does+most+clearly+appear+out+of+the+holy+Scriptures+that+the+sacraments+were+instituted+by+God+in+his+Church%2C+chiefly+and+in+the+first+place+to+be+signs+and+seals+of+the+Covenant+of+Grace%2C+and+of+the+benefits+promised+in+the+Covenant+of+Grace%2C+and+of+salvation+procured+by+Christ+for+us%2C+as+is+manifest+by+the+sacrament+of+circumcision%2C+Gen.+17%3A7%2C10%3B+Rom.+4%3A11%2C+of+the+Passover%2C+1+Cor.+5%2C+of+Baptism%2C+Mark+1%3A4%3B+Acts+2%3A38-39+and+22%3A16%3B+Rom.+6%3A3-4%3B+Titus+3%3A5%2C+and+of+the+Lord%E2%80%99s+Supper%2C+Mt.+26%3A26-28%3B+1+Cor.+11%3A24-26.+But+in+a+secondary+respect+we+acknowledge+the+Sacraments+to+be+seals+of+our+outward+engrafting+into+the+Church-visible%2C+and+our+conjunction+into+one+body+of+the+Church%2C+Acts+2%3A41%3B+1+Cor.+12%3A12-13%2C+and+that%2C+as+we+conceive%2C+of+the+catholic+Church%3B+so+that+he+that+is+baptized+is+not+baptized+into+the+communion+only+of+this+or+that+particular%2C+or+parochial+Church%2C+but+is+joined+into+that+one+body+of+the+Church+catholic+and+universal%3A+as+the+whole+ministry+of+the+Church+is+given+by+Christ+to+men%2C+to+bring+them+to+the+unity+and+conjunction+of+the+Church+catholic+and+universal%2C+and+to+engraft+them+as+members+into+it%2C+Eph.+4%3A11-12%3B+1+Cor.+12%3A28%3B+Rom.+12%3A5-7.+And+as+by+Excommunication+duly+performed+the+person+excommunicate+is+not+cast+out+of+this+or+that+particular+Church+only%2C+but+is+bound+all+the+world+over%2C+and+shut+out+from+the+brotherly+communion+of+the+Church+universal%2C+Mt.+18%3A17-18%2C+so+the+sacraments+of+baptism+and+the+Lord%E2%80%99s+Supper+are+seals+to+a+man+of+ecclesiastical+communion%2C+not+only+in+a+particular+Church%2C+but+in+the+Church+universal.+And+therefore+we+hold+that+these+sacraments+are+to+be+administered+not+to+those+only+who+by+a+Church+Covenant+have+joined+themselves+to+some+particular+Church%2C+but+to+all+the+members+of+the+Church+catholic%2C+who+have+duly+prepared+themselves+for+the+partaking+of+them.+Thus+our+Belgic+churches+deny+not+the+seal+of+Baptism+to+the+children+of+those+parents%2C+who+have+not+by+a+confession+of+faith+and+submission+to+ecclesiastical+discipline%2C+joined+themselves+to+any+particular+church%3B+according+to+the+practice+of+the+Jewish+Church%2C+Josh.+5%3A4-6%2C+as+neither+do+we+deny+the+participation+of+the+Lord%E2%80%99s+Supper+to+those+who+by+reason+of+the+necessity+of+their+calling+cannot+join+themselves+to+any+particular+Church%2C+but+are+forced+to+travel+through+diverse+parochial+churches.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England%2C+concerning+the+Government+of+the+Church+of+God.+Written+at+the+Command+and+appointment+of+the%2C+%5BDutch%5D+Walachrian+Classis+%5BPresbytery%5D+%28London%2C+1645%29%2C+ch.+2%2C+%E2%80%98Of+a+Church+Covenant%E2%80%99%2C+pp.+17-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7cce06371c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7cce06371c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=2.%20We%20deny%20also%20that%20by,to%20travel%20through%20diverse%20parochial%20churches&amp;text=2.%20We%20deny%20also%20that%20by%20such%20a&amp;text=are%20forced%20to%20travel%20through%20diverse%20parochial%20churches" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ddc2983088" data-kw="">
<blockquote><p>1. But come we to your [congregationalist] particulars: First, ‘by way of participation of the Lord’s Supper, the members of one church coming to another church, etc.’ But: 1. Why do you instance in this ordinance only? Have not their children, occasionally born there, a liberty also of baptisme? The rather, because baptism is not administred with respect to this or that church, but to the general visible Church: Unless you hold that a man or child is baptized to no church but that particular, and [is] an infidel to all the rest. Yet some of your brethren will hardly baptize a child of any but a member of their own church, which is next door to Anabaptism. … …4. But your reason I like very well: ‘For we receive the Lord’s Supper, not only as a seal of our communion with the Lord Jesus, and with his members in our own church, but also in all the churches of the saints’: Whence I infer, then, it is not any favour dispensed by you to a member of another church, but a dignity or privilege common to every member of that body, by virtue of that membership, and not with respect to his particular church membership. And I pray, is not baptism also a seal of our communion with all the members of Christ’s body? Why then may you not admit the children of the members of any church to be baptized by your pastors upon just occasion, as well as to admit the parents to the Lord’s Supper? Nay further: If the sacraments be seals of our communion with all the members of Christ, why do you not admit any true Christian, and his children, to the communion of the sacraments, though they be not as yet admitted members of any particular congregation? How dare you deny any member of that Body communion with its fellow-members, when it has union and communion with the Head? Consider it.</p></blockquote>

+any+church+to+be+baptized+by+your+pastors+upon+just+occasion%2C+as+well+as+to+admit+the+parents+to+the+Lord%E2%80%99s+Supper%3F+Nay+further%3A+If+the+sacraments+be+seals+of+our+communion+with+all+the+members+of+Christ%2C+why+do+you+not+admit+any+true+Christian%2C+and+his+children%2C+to+the+communion+of+the+sacraments%2C+though+they+be+not+as+yet+admitted+members+of+any+particular+congregation%3F+How+dare+you+deny+any+member+of+that+Body+communion+with+its+fellow-members%2C+when+it+has+union+and+communion+with+the+Head%3F+Consider+it.%E2%80%9D%0A%0A%E2%80%94+Daniel+Cawdrey%2C+Vindici%C3%A6+Clavium%3A+or%2C+A+Vindication+of+the+Keys+of+the+Kingdom+of+Heaven%2C+into+the+Hands+of+the+Right+Owners.+Being+some+Animadversions+upon+a+Tract+of+Mr.+John+Cotton%E2%80%99s+Called%2C+%E2%80%98The+Keys+of+the+Kingdom+of+Heaven%E2%80%99.+As+also+upon+Another+Tract+of+his+Called%2C+%E2%80%98The+Way+of+the+Churches+of+New+England%E2%80%99.+Manifesting%3A+1.+The+Weakness+of+his+Proofs.+2.+The+Contradictions+to+Himself+%26+Others.+3.+The+Middle-Way%2C+%E2%80%A6+%281645%29%2C+ch.+4%2C+pp.+39-41+Cawdrey+was+an+English+presbyterian+and+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fddc2983088.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ddc2983088.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=1.%20But%20come%20we%20to%20your,communion%20with%20the%20Head%3F%20Consider%20it&amp;text=1.%20But%20come%20we%20to%20your%20%5Bcongregationalist%5D%20particulars&amp;text=union%20and%20communion%20with%20the%20Head%3F%20Consider%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6cbd577fcb" data-kw="">
<blockquote><p>That all the members of the catholic Church should meet together to hear one sermon, to partake of one sacrament, etc. as it was possible once, when their number was but an 120, Acts 1, so they are bound still, but that the multitude makes it impossible. That the particular congregations should join together in the same specifical ordinances, and have officers over them alike, is certainly an institution of Jesus Christ, as well, as to make the same profession of faith, and hope. Indeed, that, being so numerous, they should have one officer over them all, and join to hear one sermon, or receive the same sacrament numerical (as he [Owen] speaks) is a ridiculous fancy; and not only false, but impossible. But I would gladly know a reason why 40 or more members of no particular church, but only of the catholic, meeting together, and having a minister among them, may not join together to worship God in prayer, preaching and partaking of the sacrament, as well as the members of several particular churches, and himself [Owen] among them, may do the same; as they do often at London and Oxford when he preaches, unless he will count those ordinances then and there administered no acts of instituted worship; And if he grant them to be worship, how can he deny [on his principles] that assembly to be a particular church, though it be not fixed nor gathered and united by any explicit covenant, or consent to live and die together [as congregationalists held]. I shall only note again, that herein he deserts his [congregationalist] friends in New England…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“That all the members of the catholic Church should meet together to hear one sermon, to partake of one sacrament, etc. as it was possible once, when their number was but an 120, Acts 1, so they are bound still, but that the multitude makes it impossible. That the particular congregations should join together in the same specifical ordinances, and have officers over them alike, is certainly an institution of Jesus Christ, as well, as to make the same profession of faith, and hope. Indeed, that, being so numerous, they should have one officer over them all, and join to hear one sermon, or receive the same sacrament numerical (as he [Owen] speaks) is a ridiculous fancy; and not only false, but impossible. But I would gladly know a reason why 40 or more members of no particular church, but only of the catholic, meeting together, and having a minister among them, may not join together to worship God in prayer, preaching and partaking of the sacrament, as well as the members of several particular churches, and himself [Owen] among them, may do the same; as they do often at London and Oxford when he preaches, unless he will count those ordinances then and there administered no acts of instituted worship; And if he grant them to be worship, how can he deny [on his principles] that assembly to be a particular church, though it be not fixed nor gathered and united by any explicit covenant, or consent to live and die together [as congregationalists held]. I shall only note again, that herein he deserts his [congregationalist] friends in New England…”

— Daniel Cawdrey, Independency a Great Schism, Proved Against Dr, [John] Owen… (London, 1657), ch. 5, pp. 89-90">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+all+the+members+of+the+catholic+Church+should+meet+together+to+hear+one+sermon%2C+to+partake+of+one+sacrament%2C+etc.+as+it+was+possible+once%2C+when+their+number+was+but+an+120%2C+Acts+1%2C+so+they+are+bound+still%2C+but+that+the+multitude+makes+it+impossible.+That+the+particular+congregations+should+join+together+in+the+same+specifical+ordinances%2C+and+have+officers+over+them+alike%2C+is+certainly+an+institution+of+Jesus+Christ%2C+as+well%2C+as+to+make+the+same+profession+of+faith%2C+and+hope.+Indeed%2C+that%2C+being+so+numerous%2C+they+should+have+one+officer+over+them+all%2C+and+join+to+hear+one+sermon%2C+or+receive+the+same+sacrament+numerical+%28as+he+%5BOwen%5D+speaks%29+is+a+ridiculous+fancy%3B+and+not+only+false%2C+but+impossible.+But+I+would+gladly+know+a+reason+why+40+or+more+members+of+no+particular+church%2C+but+only+of+the+catholic%2C+meeting+together%2C+and+having+a+minister+among+them%2C+may+not+join+together+to+worship+God+in+prayer%2C+preaching+and+partaking+of+the+sacrament%2C+as+well+as+the+members+of+several+particular+churches%2C+and+himself+%5BOwen%5D+among+them%2C+may+do+the+same%3B+as+they+do+often+at+London+and+Oxford+when+he+preaches%2C+unless+he+will+count+those+ordinances+then+and+there+administered+no+acts+of+instituted+worship%3B+And+if+he+grant+them+to+be+worship%2C+how+can+he+deny+%5Bon+his+principles%5D+that+assembly+to+be+a+particular+church%2C+though+it+be+not+fixed+nor+gathered+and+united+by+any+explicit+covenant%2C+or+consent+to+live+and+die+together+%5Bas+congregationalists+held%5D.+I+shall+only+note+again%2C+that+herein+he+deserts+his+%5Bcongregationalist%5D+friends+in+New+England%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Daniel+Cawdrey%2C+Independency+a+Great+Schism%2C+Proved+Against+Dr%2C+%5BJohn%5D+Owen%E2%80%A6+%28London%2C+1657%29%2C+ch.+5%2C+pp.+89-90&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6cbd577fcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6cbd577fcb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=That%20all%20the%20members%20of%20the,his%20%5Bcongregationalist%5D%20friends%20in%20New%20England&amp;text=That%20all%20the%20members%20of%20the%20catholic%20Church&amp;text=he%20deserts%20his%20%5Bcongregationalist%5D%20friends%20in%20New%20England" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…these… truths are most certainly evident out of the Scripture. All Christians in the Church of Jerusalem were admitted into Church-fellowship upon their repenting, believing and being baptized, without any other conditions, and that upon offering themselves… But it will farther more illustriously yet appear, if we consider the diverse other additions of believers, and that daily unto the Church of Jerusalem: for in the last verse of this chapter it is said that the Lord added daily unto the Church such as should be saved; here we find additions upon additions of believers, and that daily, indefinitely set down, as if they could not easily have been told, which adds no small emphasis unto the expression; and all these were admitted into Church-fellowship without any of those conditions the Independents require of all their members in these our times; for it is said the Lord added daily unto the Church such as should be saved; and therefore He did it only upon his own terms of repentance, faith and baptism.</p></blockquote>

<blockquote><p>…for all argument they come at last to this,’By what authority doest thou these things; and who gave thee this authority?’ where the Lord answering for Himself, then, and for us now in the like case, most plainly and at length shows that, howsoever in the ordinary course of a constitute Church, a careful regard must be had to the ordinary calling, yet when (as sometime it falls) that the ordinary husband-men become murderers, and the ordinary builders become destroyers, there God extraordinarily stirs up men whose ministry proves itself to be from Heaven and not from men, even by this, that they come in the way of righteousness: and sinners are converted by them, that, so the Lord of the vineyard may report fruit thereof, even when the ordinary husbandmen rebel, and that the stone, rejected, even of the ordinary builders, may yet be made the head of the corner: which, howsoever it be marvelous in our eyes, yet it is the Lord his doing.</p></blockquote>

ks Online</a></div>

<blockquote><p>3rd Distinction. There is a formal ordinary power, and there is a virtual or extraordinary power. 1st Conclusion. Christ Jesus has immediately Himself, without the intervening power of the Church or men, appointed offices and officers in his house, and the office of a pastor, and elder is no less immediately from Christ (for men as Christ’s vicars and instruments can appoint no new office in the Church) than the office of the apostles, Eph. 4:11; 1 Cor. 12:28; Mt. 28:19. The offices are all given to the Church immediately, and so absolutely, and so the power of the keys, is given to the Church the same way. But the officers and key-bearers now are given mediately and conditionally, by the intervening mediation of the ruling and ministerial Church, that she shall call such and such, as have the conditions required to the office by God’s Word, 1 Tim. 3:1-3… 2nd Conclusion. I deny not but there is a power virtual, not formal in the Church of believers, to supply the want of ordination of pastors or some other acts of the keys simply necessary, hic &amp; nunc [here and now]; this power is virtual, not formal, and extraordinary not ordinary, not official, not properly authoritative, as in a Church in an island, where the pastors are dead or taken away by pest[ilence] or otherways; the people may ordain pastors or rather do that which may supply the defect of ordination, as David without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread; So is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity to the good of the Church; so Thomas, Molina, Suarez, Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel; and consider what the learned Voetius says in this: What if in an extreme case of necessity, a private man, endued with gifts and zeal should teach publicly, after the example of the faithful at Samosaten. Yea and Flavianus and Diodorus preached in Antioch, as Theodoret says; yea, says Voetius, an ordinary ministry might be imposed on a laic, or private person by the Church, though the presbytery consent not, in case of necessity. God (says Gerson) may make an immediate intermission of a calling by bishops; yea (says Anton. speaking of necessity’s law) the Pope may commit power of excommunication, quia est de jure positive, pure laico &amp; mulieri, to one mere laic, or a woman; though we justify not this, yet it is hence concluded that God has not tied Himself to one set rule of ordinary, positive laws: a captive woman (as Socrates says) preached the Gospel to the king and queen of Iberranes, and they to the people of the land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 8</span></figcaption>

<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 3rd Distinction. Public preaching, as it is the ordinary mean of saving such as believe, is proper and peculiar to the Church, both subjectively, as being only in the Church, and objectively as being only exercised on the Church members per se, but upon pagans by accident. 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are. 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another;

4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office.

5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>

</figure><figure class="quote" id="q-f1ba55c5d5" data-kw="">
<blockquote><p>Hence our Fifth Conclusion: when there is an equal rupture in the body, nothing extraordinary would be attempted if ordinary ways can be had: if Saul the ordinary magistrate had at God’s commandment killed Hagag, Samuel the prophet should not have drawn his sword; And therefore in this case [of a major and irresolvable rupture in the Church] the magistrate would first seek help from other Churches, as that learned Apollonius says. But if that cannot be conveniently had, as in a national Church it may fall out, then the magistrate, as a preserver of peace and truth, may command the sincerer part [of the ministry] to convene in a synod, and do their duty, as the good kings of the people of God did: 2 Chron. 15. Asa gathered together a people who entered in Covenant to seek the Lord God with all their heart, and laid an obligation of punishment to death on the rest, vv. 12-13, and Jehoshaphat, 2 Chron. 23:4, he laid charge on Hilkiah the High Priest, and the priests of the second order, whom he knew to be better affected to the work, to bring out the vessels made for Baal; which proves that the king should put the sincerest to do that, which in common belongs to the whole; In which case of the erring of the most part of the Church, the prince indirectly condemns the erring part of the synod, because it is his place to forbid and to punish with the sword, the transgressors of God’s Law. But because his power is accumulative, not privative, under that pretense he has not power to hinder the sincerer part to meet and determine according to the Word of God.</p></blockquote>

<blockquote><p>Mr. Hooker [wrote]: ”An eminently gifted man in an island, where no pastors are, is no less (says Mr. Rutherford) tied in conscience in the extraordinary employment of his calling than if he were formally ordained and chosen their pastor. In some extraordinary cases a gift and Christian love ties even as much to onerousness [difficulty] in using means to save as the office itself.’ See what I add in that place,’ (Mr. Hooker says) ‘then this gifted man in an island, in using his general calling as a Christian, destroys his particular [calling] as a merchant, and turn[s] minister. 2. This is to confound the general and particular calling.’ [Rutherford’s] Answer: Not at all, for in this case, the extraordinary necessity of gaining souls, when other pastors cannot be had, and ordination and election by that means are invincibly wanting hic &amp; nunc [hear and now], turns his Christian calling in place and room of the particular calling of a pastor; and so Mr. Rutherford said well, that in some extraordinary case like this, ‘The naked relation of jurisdiction adds nothing to [the] care and onerousness in point of labor by preaching the Gospel.&#x27;</p></blockquote>

<blockquote><p>2. No man may take this honour to himself, unless he be called of God, and sent to preach his Word in the Name of God, Rom. 10:14-15. But all who have the gifts of preaching the Word are not called and sent of God. For those who are sent of God are sent either by an immediate and extraordinary call, or by a mediate call by the Church: but whereas now an extraordinary mission or sending is ceased in the Church, those are therefore by the ordinary ecclesiastical call separated to the office of preaching, who may lawfully undertake it. 1 Tim. 4:14 &amp; 5:22; 2 Tim. 2:2-3. … We reject therefore the contrary assertion of those [congregationalists] who affirm this to be an ordinance perpetual and ordinary in the Church, that a private Christian endued with gifts, either ordinarily or upon occasion, being thought fit in the judgment of those to whom it belongs, may (by the Word of God) preach publicly in the church-assembly with all authority, though he bear no Church office. But to us it’s certain that even under the Old Testament in the Jewish Church, every one was not admitted to speak publicly in the synagogues, but that it was the ordinary function of those that are called scribes and lawyers (the Levites being also for this cause distributed into many places), whereupon they are said to sit on Moses’s chair. If any were endued with extraordinary gifts of prophecy, as the prophets in Israel, this was permitted and enjoyned him by the Word of God, publicly to preach in God’s Name. When the prophet Amos was forbidden by the Chief Priest to prophecy at Bethel, he does not challenge this liberty to the Israelites, that they might publicly preach the Word of God in God’s Name in the holy assemblies, but pleads his extraordinary mission, whereby he was sent of God to preach this word, Amos 7:14-15. And so perhaps was it permitted to the sons of the prophets, who were fitted, educated, and set apart for the ecclesiastical ministry, 1 Sam. 19:20. In the synagogues, after the reading of Moses and the prophets was ended, there were exhortations added; which exhortations if at any time occasion required, and it so seemed good to the rulers of the synagogue, in corrupt times especially, it was indeed permitted to some, out of order, to teach and exhort; but they were always such as had testimony of their gifts, and of whom there was a general opinion of their mission extraordinary or ordinary, by reason of the doctrine they preached, and the works they did. Thus at Nazareth Christ was permitted in the synagogue to read and explain the writings of the prophets, Lk. 4:16, as one who by reason of his majesty and miracles did everywhere obtain audience, as reverend Beza here notes; by which right he taught both in the Temple and everywhere: wherefore also the ordinary doctors demanded of him by what authority he did it, Mt. 21:23. So we find that Paul and Barnabas were allowed, Acts 13:15, publicly to speak and exhort in the synagogue at Antioch; as being such whose fame was already known to those of Antioch: for they had, before this time, for a whole year preached the Word of God to many there, and brought many to the faith of Christ; and Agabus who was joined with them, did by an extraordinary gift of prophesy foretell to those of Antioch the famine approaching; where were also many other prophets and doctors, who preached the Word of God both to Jews and Greeks: See Acts 11:19-21, 25-28, and 13:1-2, etc. But in the practice of the New Testament, none but prophets by gift and office, either extraordinary or ordinary, were permitted publicly in the assembly of believers to preach the Word of God in Christ’s Name, as appears, 1 Cor. 14:29-31, etc. The apostle speaks not of any in the congregation promiscuously, but of prophets lawfully called to instruct the Church of God (says Beza on this place) and therefore they are not to be hearkened to [namely the congregationalists], who from hence gather that any of the assembly may speak in the Church, and who reprehend the custom of having only a sermon preached by one.</p></blockquote>

<blockquote><p>[On Acts 8:4] And suppose they preached the Word without mission or ordination, this is but like that which Chrysostom, Lib: ad eos qui scandalisati sunt, ch. 19, records as a marvelous extraordinary benefit which did accrue from the bloody persecutions of those ancient times, viz. That in such times the sheep acted the parts of shepherds, being driven away to deserts and mountains, where (by the Spirit of God speaking in them) they converted unbelievers, and gathered Churches: Which concludes nothing against the necessity of ordination in constituted and reformed Churches, for they who were scattered abroad, being driven away in the heat of persecution, might not have the opportunity of ordination, and they went forth to gather Christians to plant Churches, to lay foundations where Christ was not known. Such cases were in the beginning excepted from the state of our present question.</p></blockquote>

<blockquote><p>Controversy 3 – Did the first reformers, Luther, Calvin and others, have a legitimate calling? We affirm against the Papists. Arguments 1. They were qualified, called by the Church, approved by the magistrate, and, originally, appointed by the Roman Church itself to teach. Objections 1. Then the Roman Church is a true Church. Reply: Originally, it was, and later it became impure, however, it did perform this according to the Word of God, that it called ministers. 2. They were not confirmed by bishops following the ordinary rituals. Reply: It was not necessary. But their calling can be called extraordinary: a. Insofar as God gave them extraordinary gifts. b. From an extraordinary impulse of the Holy Spirit. c. Insofar as God used them for an extraordinary work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 16, ‘The Church’, p. 214</span></figcaption>

<blockquote><p>Is not a current, uncontroverted custom equivalent to a law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (London, 1681), p. 69</span></figcaption>

<blockquote><p>All courts are governed, and should, to a great extent, be governed by precedent. Long-established usage has the authority of law. People have the right to depend upon it. It works manifest injustice, when a party avails himself of a remedy, which a court for years and generations has recognized as appropriate, and he is suddenly and unexpectedly, by a new construction of the constitution, refused a hearing because he has put his case in a wrong form.</p></blockquote>

</figure><figure class="quote" id="q-4a26fef0a7" data-kw="">
<blockquote><p>Our judgment is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our judgment is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4.”

— Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+judgment+is+that+none+may+publicly+in+the+church+assembly+of+the+faithful+preach+the+Word+of+God+in+the+Name+of+Christ+and+of+God%2C+but+he+who+is+sent+by+a+divine+calling+for+that+work%3B+as+the+Protestants+demonstrate+against+the+Socinians+and+Anabaptists+from+Rom.+10%3A14-15%3B+Heb.+5%3A4-5%3B+Acts+13%3A1-2+%26+14%3A22%3B+Tit.+1%3A5%3B+2+Tim.+2%3A2%2C+and+other+places+and+arguments%3B+and+from+the+examples+of+all+those%2C+who+either+in+an+extraordinary+or+ordinary+manner+were+sent+to+preach+the+Word.+Which+mission%2C+or+sending%2C+consists+not+only+in+conferring+gifts%2C+whereby+an+ability%2C+%5BGreek%5D%2C+is+given+by+God%3B+but+in+conferring+a+power%2C+whereby+is+given+an+authority%2C+%5BLatin%5D%2C+to+preach+the+Word+of+God%3B+which+authority+is+oft-times+not+conferred+on+those%2C+on+whom+yet+God+bestows+gifts+and+ability.+For+it+is+by+the+Word+of+God+denied+to+women%2C+in+whose+lips+is+the+Law+of+God%2C+Prov.+31%3A26%2C+and+a+fitness+to+teach+the+yonger+women%2C+Tit.+2%3A3-4.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England+concerning+the+Government+of+the+Church+of+God%2C+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+pp.+75-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a26fef0a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4a26fef0a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=Our%20judgment%20is%20that%20none%20may,teach%20the%20yonger%20women%2C%20Tit.%202%3A3%2D4&amp;text=Our%20judgment%20is%20that%20none%20may%20publicly%20in&amp;text=fitness%20to%20teach%20the%20yonger%20women%2C%20Tit.%202%3A3%2D4" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3a7d9dbe59" data-kw="">
<blockquote><p>2. Because when the Church is overgone with heresy and apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; And suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 126-7</span></figcaption>

</figure><figure class="quote" id="q-bea6e2c2af" data-kw="">
<blockquote><p>Nor will it follow that it is intrinsically unlawful for a synod of New England [who were congregationalists] to send 24 gracious youths understanding in the language, ordain them pastors by laying on of hands of the elders, and by fasting and praying, instruct them to go and act as pastors among the savages, preaching and baptizing; and their warrant is Acts 13; and here are pastors without certain flocks [contra congregationalism]. If any (Acts 13) say [that] the Spirit gives a special command there, and names Saul and Barnabas, but its not so here: I answer, there is without question something extraordinary in Acts 13, nor are we with Seekers (too much fortified in their way by our [congregationalist] Brethren’s doctrine) to wait for the Lord’s naming from heaven John, Thomas, to be preachers in such a place. But to me: 1. The nearness to the savages, 2. The knowledge of their language (as I suppose), 3. Their weak desire, or the professed not hating of the Gospel [by the savages], were equivalent to a command from heaven, ‘Go preach to the Americans’, and that in the capacity as proper pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), pp. 421-3</span></figcaption>

<blockquote><p>…I believe it is generally allowed that the choice and call of the people, in certain extraordinary cases, forms a valid and sufficient warrant for exercising the pastoral office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Right of Females to Vote in the Election of Ministers and Elders’</cite>, p. 5 from Miscellaneous Writings, Chiefly Historical (1841), pp. 669-76</span></figcaption>

<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London, 1644) | pt. 2, p. 272</span></figcaption>

<blockquote><p>2. That private Christians in an extraordinary case, in a Church to be erected or that is decayed and ruined, may sometimes publicly preach the Word of God for the planting a Church when there are not such as by God’s ordinary call have received from God power to preach the Word. For the positive ritual law of God gives place to the moral law of God when necessity requires it.

3. We grant also that private Christians in some special cases, and upon a particular occasion, may sometimes speak the Word of God in public by a special calling from God: as martyrs are called to a public confession of the faith. But all this does not infer that there is an exercise of prophesy constantly and ordinarily to be observed in the Church, whereby the Word should by private Christians in the Name of Christ and with all authority be publicly preached for the edification of the Church. And therefore we maintain the negative of the question proposed, and deny that there is such an exercise to be perpetually retained in the Church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

That%20private%20Christians%20in%20an,retained%20in%20the%20Church%20of%20Christ&amp;text=2.%20That%20private%20Christians%20in%20an%20extraordinary%20case&amp;text=be%20perpetually%20retained%20in%20the%20Church%20of%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4th Conclusion is this… Now if a church should be in a remote island, not consociate with other churches, and yet wanting guides [officers], our [congregationalist] brethren say in this case, the power of the keys should be seen to be in believers, and they might choose and ordain their own officers. I grant they have great [Romanist] schoolmen to say with them… But I say in this case necessity is an unbooked and naughty lawyer, and God extraordinarily should supply the want of ordination, as He can do the defect of second causes: so that if God send some pastors to a congregation that were unwilling to choose their own eldership, pastors might ordain themselves pastors in that case to these people, and God should supply their want of popular election…</p></blockquote>

<blockquote><p>Answer. Suppose in this or that Church all the ministers should die, yet it follows not that a ministry can utterly fail in the Church: It is contrary to Eph. 4:11 and to the perpetuity of Christ’s kingly government and throne, which shall endure as the days of heaven: And what if God extraordinarily supply the want of ordination in this or that particular church? A ministerial power is conferred in that case immediately upon some in a Church removed from any Church-consociation from other Churches, and so Christ’s ministerial power dies not.</p></blockquote>

<blockquote><p>But you [a congregationalist] will say, in a church in an island, one may be a pastor without any ordination if the people elect him and there be no elders to ordain. I answer: it is true: but so many pastors send a pastor to be a pastor to a congregation, though that congregation never choose him, as possibly they be for the most part Popish or unwilling; yet both cases are extraordinary and the Church [is in the case of] not [being] constituted and established.</p></blockquote>

<blockquote><p>4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644) | pt. 2, p. 272</span></figcaption>

</figure><figure class="quote" id="q-eb61100438" data-kw="">
<blockquote><p>2. A calling is extraordinary, either in habit or in exercise; in habit, as to be an apostle and have the gift of miracles: Thus our reformers calling was not extraordinary, they were not immediately called by God from Heaven; for they would not have concealed such a calling, if they had had any such: Or a calling is extraordinary in the exercise, and that two ways; either in the principle moving them to teach, or, 2. in the manner of teaching and efficacy; a calling extraordinary in the principle moving is twofold: Either a mere prophetical impulsion of revelation stirring them up to such an act, as the Spirit of the Lord came upon Saul and he prophesied; this our reformers had not because we never find that they allege it. 2. A more than ordinary motion with illumination by God’s Spirit speaking in the Scriptures, in which motions they were not subordinate in the exercise of their ministry to the Church of pastors, but immediately in that subordinated to God; and in this I prove that our reformers were extraordinary doctors.

1. Because Eze. 34, in a universal apostasy of the prophets and shepherds, the Lord extraordinarily works, v. 11, ‘For thus saith the Lord God, behold I, even I will both search my sheep, and seek them out.’ Now this is by pastors, when the ordinary pastors are all failed. So Rev. 11, in that universal apostasy under Antichrist, when the gentiles tread upon the outer court of the Temple and the holy City, God stirs up two witnesses to prophesy in sackcloth; that is, some few pastors (for two is the smallest number) and they prophesy and are slain, and yet they rise again. We need not apply this to men in particular, as to John Huss and Jerome of Prague; but certainly, some few spake against Babylon and they were borne down and oppressed and killed, and men of that same spirit rose and spake that same truth as if the very two men who were slain had risen within three days again.

2. Because when the Church is overgone with heresy and Apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; and suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. A calling is extraordinary, either in habit or in exercise; in habit, as to be an apostle and have the gift of miracles: Thus our reformers calling was not extraordinary, they were not immediately called by God from Heaven; for they would not have concealed such a calling, if they had had any such: Or a calling is extraordinary in the exercise, and that two ways; either in the principle moving them to teach, or, 2. in the manner of teaching and efficacy; a calling extraordinary in the principle moving is twofold: Either a mere prophetical impulsion of revelation stirring them up to such an act, as the Spirit of the Lord came upon Saul and he prophesied; this our reformers had not because we never find that they allege it. 2. A more than ordinary motion with illumination by God’s Spirit speaking in the Scriptures, in which motions they were not subordinate in the exercise of their ministry to the Church of pastors, but immediately in that subordinated to God; and in this I prove that our reformers were extraordinary doctors.

1. Because Eze. 34, in a universal apostasy of the prophets and shepherds, the Lord extraordinarily works, v. 11, ‘For thus saith the Lord God, behold I, even I will both search my sheep, and seek them out.’ Now this is by pastors, when the ordinary pastors are all failed. So Rev. 11, in that universal apostasy under Antichrist, when the gentiles tread upon the outer court of the Temple and the holy City, God stirs up two witnesses to prophesy in sackcloth; that is, some few pastors (for two is the smallest number) and they prophesy and are slain, and yet they rise again. We need not apply this to men in particular, as to John Huss and Jerome of Prague; but certainly, some few spake against Babylon and they were borne down and oppressed and killed, and men of that same spirit rose and spake that same truth as if the very two men who were slain had risen within three days again.

2. Because when the Church is overgone with heresy and Apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; and suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.”

— Samuel Rutherford, A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland, (1642), pp. 126-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+A+calling+is+extraordinary%2C+either+in+habit+or+in+exercise%3B+in+habit%2C+as+to+be+an+apostle+and+have+the+gift+of+miracles%3A+Thus+our+reformers+calling+was+not+extraordinary%2C+they+were+not+immediately+called+by+God+from+Heaven%3B+for+they+would+not+have+concealed+such+a+calling%2C+if+they+had+had+any+such%3A+Or+a+calling+is+extraordinary+in+the+exercise%2C+and+that+two+ways%3B+either+in+the+principle+moving+them+to+teach%2C+or%2C+2.+in+the+manner+of+teaching+and+efficacy%3B+a+calling+extraordinary+in+the+principle+moving+is+twofold%3A+Either+a+mere+prophetical+impulsion+of+revelation+stirring+them+up+to+such+an+act%2C+as+the+Spirit+of+the+Lord+came+upon+Saul+and+he+prophesied%3B+this+our+reformers+had+not+because+we+never+find+that+they+allege+it.+2.+A+more+than+ordinary+motion+with+illumination+by+God%E2%80%99s+Spirit+speaking+in+the+Scriptures%2C+in+which+motions+they+were+not+subordinate+in+the+exercise+of+their+ministry+to+the+Church+of+pastors%2C+but+immediately+in+that+subordinated+to+God%3B+and+in+this+I+prove+that+our+reformers+were+extraordinary+doctors.+1.+Because+Eze.+34%2C+in+a+universal+apostasy+of+the+prophets+and+shepherds%2C+the+Lord+extraordinarily+works%2C+v.+11%2C+%E2%80%98For+thus+saith+the+Lord+God%2C+behold+I%2C+even+I+will+both+search+my+sheep%2C+and+seek+them+out.%E2%80%99+Now+this+is+by+pastors%2C+when+the+ordinary+pastors+are+all+failed.+So+Rev.+11%2C+in+that+universal+apostasy+under+Antichrist%2C+when+the+gentiles+tread+upon+the+outer+court+of+the+Temple+and+the+holy+City%2C+God+stirs+up+two+witnesses+to+prophesy+in+sackcloth%3B+that+is%2C+some+few+pastors+%28for+two+is+the+smallest+number%29+and+they+prophesy+and+are+slain%2C+and+yet+they+rise+again.+We+need+not+apply+this+to+men+in+particular%2C+as+to+John+Huss+and+Jerome+of+Prague%3B+but+certainly%2C+some+few+spake+against+Babylon+and+they+were+borne+down+and+oppressed+and+killed%2C+and+men+of+that+same+spirit+rose+and+spake+that+same+truth+as+if+the+very+two+men+who+were+slain+had+risen+within+three+days+again.+2.+Because+when+the+Church+is+overgone+with+heresy+and+Apostasy%2C+our+reformers%2C+in+the+exercise+of+their+ministry%2C+were+not+to+keep+a+certain+flock+as+in+a+constitute%5Bd%5D+Church%2C+and+suppose+they+had+no+calling+but+eminent+gifts%2C+they+were+to+spread+the+Gospel+to+nations%2C+as+Luther+did%3B+and+suppose+the+people+should+resist+them%2C+as+in+many+places+they+did%3B+yet+God+called+them%2C+and+they+were+not+to+expect+election+from+people%3A+So+%5Bmen+of%5D+Cyprus+and+Cyrenus+preached%2C+Acts+11+and+18%2C+and+we+read+of+no+vocation+that+they+had+from+either+people+or+apostle.+So+Origen+preached+to+a+people+in+a+certain+town+where+there+was+not+one+Christian%2C+and+afterwards+he+was+chosen+their+pastor.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+for+Paul%E2%80%99s+Presbytery+in+Scotland%2C+%281642%29%2C+pp.+126-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb61100438.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb61100438.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=2.%20A%20calling%20is%20extraordinary%2C%20either,afterwards%20he%20was%20chosen%20their%20pastor&amp;text=2.%20A%20calling%20is%20extraordinary%2C%20either%20in%20habit&amp;text=Christian%2C%20and%20afterwards%20he%20was%20chosen%20their%20pastor" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. Mr. Hooker [a congregationalist] will not say all that were scattered, Acts 8[:4] (for they were all scattered, except the apostles, verse 1) did preach the Gospel, for there were of them women, verse 3; then some of them only preached. And if Mr. Hooker say they were not officers, Mr. Rutherford says they were officers, and that the extraordinariness of their condition supplied the want of a Church-calling, and let Mr. Hooker but attempt to bring a proof for it.

<blockquote><p>The third [sort of Anabaptists, after the two from the Early Church] broached theirs in the year 1525, which was this, (3) that baptism ought to be administred to none, but such as can give a good account of their faith; and in case any have been baptized in their infancy, that they ought to be re-baptized after they come to years of discretion, before they are to be admitted to the church of Christ. … For the third sort of Anabaptists, they have sunk deeper in the former quagmire… For they not only nullify all baptism administered either by Romish priests, or orthodox Protestants, but condemn [the] baptizing of children simply, which neither the first nor the second sort of Anabaptists [in the Early Church] did; for both the Novatians and Donatists, yea, and Pelagians too, though they denied original sin, yet they all allowed and practised the baptism of infants. The author of this third and worst sect of Anabaptists, was, as some say Muncerus; as others, Balthasar Pacimontanus, against whom Zwingli wrote; as others, Carolstadius; but I subscribe to Melancthou, who lived in those times… And he affirms, as I said before, that Nicholas Stock was the first that broached Anabaptism in Germany. This Stock affirmed, that God spake to him by an angel, and revealed his will to him in dreams, promising him the place of the angel Gabriel: in this man’s school was Thomas Muncer bred…</p></blockquote>

<blockquote><p>First, their ecclesiasticall errors, such as peculiarly concern the doctrine or discipline of the Church are: First, that Christ took not flesh from the Virgin Mary, but that he passed through her as the sun beams do through glass, or rain through a spout. Secondly, that there is no original sin. Thirdly, that children ought not to be baptized. Fourthly, that such as have been baptized in their infancy ought to be re-baptized when they come to years of discretion. Fifthly, that lay-people may preach and administer the sacraments… Sixthly, that men have free will, not only in natural and moral, but also in spiritual actions. Seventhly, that absolution and the church-peace ought to be denied to such who are fallen into any grievous sin; yea, though they repent of it. Eighthly, that Luther’s doctrine is worse than the Pope’s. Secondly, their politicall errors, or in matter of state, are: First, that the people may depose their magistrates and chief rulers… Secondly, that a Christian with a good conscience may not take upon him, or bear the office of a magistrate, or keep any court of justice. Thirdly, that none may administer an oath to another. Fourthly, that no malefactors ought to be put to death. Thirdly, their economical errors [about the family] are: First, that no man has a propriety in his goods, but that all things ought to be held in common. Secondly, that it is lawful to have more wives than one at once. Thirdly, that a man may put away his wife if she differ from him in point of religion, and be not of their sect. … All the errors of the Anabaptists are of two sorts: First, such as they hold in common with other heretics. Secondly, such as are peculiar to their sect. First, concerning the common errors [not mentioned above]… First, with the Millenaries and their joint issue is, that Christ before the day of judgement shall come down from Heaven, and reign with the saints upon earth a thousand years; in which time they shall destroy all the wicked, binding their kings in chains, and their nobles in links of iron. … Thirdly, with the Donatists and their joynt issue is that in the true church there are no scandals, or lewd and vicious livers; that the church of Christ is confined to their sect; that we ought to separate from all assemblies of Christians wherein there are any abuses or scandals, yea, though the church allows them not, but seeks to reform them; that all such as have been baptized by any other than those of their sect, ought to be rebaptized. … Seventhly, with the Enthusiasts and their joint issue is that the Scripture is not our only rule of faith and manners, but that God reveals his will to his children at this day by visions and dreams… … Ninthly, with the Arminians and their joint issue is, that there is no original sin, or at least, that none is damned for it alone; that election is upon foreseen faith and repentance; that God gives all men sufficient grace to be saved; that man has free-will of himself either to accept or refuse God’s grace; that Christ died indifferently for all; that a true beleever, who is in the state of grace, may fall away totally and finally. Tenthly, with the Brownists or Barrowists and their joint issue is, that there ought to be a parity in the church… that in regard of these and such like abuses and corruptions [in ceremonies and governemnt] the church of England is no true Church of Christ, and consequently, that all that have a care of their soules must of necessity separate from her. Eleventhly, with a peculiar sect, called the Separati and their joint issue is, that no Christian may go to law, or in any case to right himself by arms or violent means. Secondly, such [errors] as are peculiar to their sect, and these are six: … Thirdly, that there ought to be no set form of Liturgy or prayer by the book, but only by the Spirit. Fourthly, that there ought to be no distinction by the Word of God between the clery and the laity, but that all who are gifted may preach the Word and administer the sacraments. Fifthly, that it is not lawful to take an oath at all, no, not though it be demanded by the magistrate…</p></blockquote>

<blockquote><p>…for rulers in making laws, and creating by their sole pleasure goodness-moral, in particular matters without the Word of God, are not God’s servants, nor is human authority as human, the nearest cause of obligation of conscience, instamped in these laws, nor is it the cause at all, and therefore to resist them, is not to resist God. They be God’s instruments and ministers in:

1. Propounding and expounding God’s laws.

2. In executing them and defending them from the violence of men.

3. In making positive and directory civil laws for civil government that are laws improperly so called, which bind the conscience as above is said, insofar as they have dependence upon God’s Law; For James says, ‘There is but one Lawgiver’ [James 4:12]. As for Church-canons, all, except physical circumstances in them, are to be warranted by the Word.</p></blockquote>

</figure><figure class="quote" id="q-8b4283b22d" data-kw="">
<blockquote><p>If the Church prescribe anything lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant given for the satisfaction of tender consciences… It becomes not the spouse of Christ, endued with the spirit of meekness, to command anything imperiously, and without a reason given… Tertullian’s testimony is known (in Apologet.): Nulla lex, etc. ‘No law (says he) owes to itself alone the conscience of its equity, but to those from whom it expects obedience. Moreover, it is a suspected law which will not have itself to be proved, but a wicked law, which not being proved, yet bears rule.’… Neither can the Church prescribe anything lawfully which she shows not to have been convenient, even before her determination. … If the ceremonies be lawful to us because the law and ordinance of the Church prescribes them, then either the bare and naked prescription of the Church, having no other warrant than the Church’s own authority, make them to be thus lawful; or else the law of the Church, as grounded upon and warranted by the law of God and nature… If they take them (as needs they must) to the latter part, then let them either say that the ceremonies are lawful unto us, because the Church judges them to be agreeable to the law of God and nature, or because the Church proves unto us, by evident reasons, that they are indeed agreeable unto these laws. If they yield us the latter, then it is not the Church’s law, but the Church’s reasons given for her law, which can warrant the lawfulness of them unto us; which does elude and elide all that which they allege for the lawfulness of them from the power and authority of the Church. And further, if any such reasons be to be give forth for the ceremonies, why are they so long kept up from us?… It will be answered (I know), that if they Church command anything repugnant to God’s Word we are not bound to do it, nor to receive it as lawful, though the Church judge so of it; but otherwise, if that which the Church judges to be agreeable to the law of God and nature (and in that respect prescribes) be not repugnant to the Word of God, but in itself indifferent, then are we to embrace it as convenient, and consonant to the law of God and nature, neither ought we to call in question the lawfulness of it. But I reply, that [in this case] either we must judge a thing to be repugnant or not repugnant to the Word, to be indifferent or not indifferent in itself, [merely] because the Church judges so of it [which is insufficient to conscience], or else because the Church proves unto us by an evident reason that it is so… the argument is still set afoot [incomplete]; then we must receive everything (be it ever so bad) as indifferent, if only the Church happen so to judge of it; for quod competit alicui qua tale, etc. So that if we receive anything as indifferent, for this respect, because the Church judges it to be so, then shall we receive everything for indifferent which the Church shall so judge of [which is absurd].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), Pt. 3, Ch. 7, Sections 7, pp. 131-3</span></figcaption>

<div class="actions"><button class="copy" data-copy="“If the Church prescribe anything lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant given for the satisfaction of tender consciences… It becomes not the spouse of Christ, endued with the spirit of meekness, to command anything imperiously, and without a reason given… Tertullian’s testimony is known (in Apologet.): Nulla lex, etc. ‘No law (says he) owes to itself alone the conscience of its equity, but to those from whom it expects obedience. Moreover, it is a suspected law which will not have itself to be proved, but a wicked law, which not being proved, yet bears rule.’… Neither can the Church prescribe anything lawfully which she shows not to have been convenient, even before her determination. … If the ceremonies be lawful to us because the law and ordinance of the Church prescribes them, then either the bare and naked prescription of the Church, having no other warrant than the Church’s own authority, make them to be thus lawful; or else the law of the Church, as grounded upon and warranted by the law of God and nature… If they take them (as needs they must) to the latter part, then let them either say that the ceremonies are lawful unto us, because the Church judges them to be agreeable to the law of God and nature, or because the Church proves unto us, by evident reasons, that they are indeed agreeable unto these laws. If they yield us the latter, then it is not the Church’s law, but the Church’s reasons given for her law, which can warrant the lawfulness of them unto us; which does elude and elide all that which they allege for the lawfulness of them from the power and authority of the Church. And further, if any such reasons be to be give forth for the ceremonies, why are they so long kept up from us?… It will be answered (I know), that if they Church command anything repugnant to God’s Word we are not bound to do it, nor to receive it as lawful, though the Church judge so of it; but otherwise, if that which the Church judges to be agreeable to the law of God and nature (and in that respect prescribes) be not repugnant to the Word of God, but in itself indifferent, then are we to embrace it as convenient, and consonant to the law of God and nature, neither ought we to call in question the lawfulness of it. But I reply, that [in this case] either we must judge a thing to be repugnant or not repugnant to the Word, to be indifferent or not indifferent in itself, [merely] because the Church judges so of it [which is insufficient to conscience], or else because the Church proves unto us by an evident reason that it is so… the argument is still set afoot [incomplete]; then we must receive everything (be it ever so bad) as indifferent, if only the Church happen so to judge of it; for quod competit alicui qua tale, etc. So that if we receive anything as indifferent, for this respect, because the Church judges it to be so, then shall we receive everything for indifferent which the Church shall so judge of [which is absurd].”

— George Gillespie, English Popish Ceremonies, (1637), Pt. 3, Ch. 7, Sections 7, pp. 131-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+the+Church+prescribe+anything+lawfully%2C+so+that+she+prescribe+no+more+than+she+has+power+given+her+to+prescribe%2C+her+ordinance+must+be+accompanied+with+some+good+reason+and+warrant+given+for+the+satisfaction+of+tender+consciences%E2%80%A6+It+becomes+not+the+spouse+of+Christ%2C+endued+with+the+spirit+of+meekness%2C+to+command+anything+imperiously%2C+and+without+a+reason+given%E2%80%A6+Tertullian%E2%80%99s+testimony+is+known+%28in+Apologet.%29%3A+Nulla+lex%2C+etc.+%E2%80%98No+law+%28says+he%29+owes+to+itself+alone+the+conscience+of+its+equity%2C+but+to+those+from+whom+it+expects+obedience.+Moreover%2C+it+is+a+suspected+law+which+will+not+have+itself+to+be+proved%2C+but+a+wicked+law%2C+which+not+being+proved%2C+yet+bears+rule.%E2%80%99%E2%80%A6+Neither+can+the+Church+prescribe+anything+lawfully+which+she+shows+not+to+have+been+convenient%2C+even+before+her+determination.+%E2%80%A6+If+the+ceremonies+be+lawful+to+us+because+the+law+and+ordinance+of+the+Church+prescribes+them%2C+then+either+the+bare+and+naked+prescription+of+the+Church%2C+having+no+other+warrant+than+the+Church%E2%80%99s+own+authority%2C+make+them+to+be+thus+lawful%3B+or+else+the+law+of+the+Church%2C+as+grounded+upon+and+warranted+by+the+law+of+God+and+nature%E2%80%A6+If+they+take+them+%28as+needs+they+must%29+to+the+latter+part%2C+then+let+them+either+say+that+the+ceremonies+are+lawful+unto+us%2C+because+the+Church+judges+them+to+be+agreeable+to+the+law+of+God+and+nature%2C+or+because+the+Church+proves+unto+us%2C+by+evident+reasons%2C+that+they+are+indeed+agreeable+unto+these+laws.+If+they+yield+us+the+latter%2C+then+it+is+not+the+Church%E2%80%99s+law%2C+but+the+Church%E2%80%99s+reasons+given+for+her+law%2C+which+can+warrant+the+lawfulness+of+them+unto+us%3B+which+does+elude+and+elide+all+that+which+they+allege+for+the+lawfulness+of+them+from+the+power+and+authority+of+the+Church.+And+further%2C+if+any+such+reasons+be+to+be+give+forth+for+the+ceremonies%2C+why+are+they+so+long+kept+up+from+us%3F%E2%80%A6+It+will+be+answered+%28I+know%29%2C+that+if+they+Church+command+anything+repugnant+to+God%E2%80%99s+Word+we+are+not+bound+to+do+it%2C+nor+to+receive+it+as+lawful%2C+though+the+Church+judge+so+of+it%3B+but+otherwise%2C+if+that+which+the+Church+judges+to+be+agreeable+to+the+law+of+God+and+nature+%28and+in+that+respect+prescribes%29+be+not+repugnant+to+the+Word+of+God%2C+but+in+itself+indifferent%2C+then+are+we+to+embrace+it+as+convenient%2C+and+consonant+to+the+law+of+God+and+nature%2C+neither+ought+we+to+call+in+question+the+lawfulness+of+it.+But+I+reply%2C+that+%5Bin+this+case%5D+either+we+must+judge+a+thing+to+be+repugnant+or+not+repugnant+to+the+Word%2C+to+be+indifferent+or+not+indifferent+in+itself%2C+%5Bmerely%5D+because+the+Church+judges+so+of+it+%5Bwhich+is+insufficient+to+conscience%5D%2C+or+else+because+the+Church+proves+unto+us+by+an+evident+reason+that+it+is+so%E2%80%A6+the+argument+is+still+set+afoot+%5Bincomplete%5D%3B+then+we+must+receive+everything+%28be+it+ever+so+bad%29+as+indifferent%2C+if+only+the+Church+happen+so+to+judge+of+it%3B+for+quod+competit+alicui+qua+tale%2C+etc.+So+that+if+we+receive+anything+as+indifferent%2C+for+this+respect%2C+because+the+Church+judges+it+to+be+so%2C+then+shall+we+receive+everything+for+indifferent+which+the+Church+shall+so+judge+of+%5Bwhich+is+absurd%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29%2C+Pt.+3%2C+Ch.+7%2C+Sections+7%2C+pp.+131-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b4283b22d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b4283b22d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=If%20the%20Church%20prescribe%20anything%20lawfully,so%20judge%20of%20%5Bwhich%20is%20absurd&amp;text=If%20the%20Church%20prescribe%20anything%20lawfully%2C%20so%20that&amp;text=Church%20shall%20so%20judge%20of%20%5Bwhich%20is%20absurd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

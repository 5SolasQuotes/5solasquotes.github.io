<blockquote><p>Verse 4. That the righteousness of the law might be fulfilled in us, &amp;c. This verse expresses the design of God in sending his Son, and in condemning sin the flesh. He did thus condemn it, ἵνα, in order that the righteousness of the law might be fulfilled. The meaning, therefore, of this passage is determined by the view taken of ver.

3. If that verse means, that God, by sending his Son, destroyed sin us, then of course this verse must mean, ‘He destroyed sin, in order that we should fulfil the law;’ i.e. that we should be holy. But if ver. 3 is understood of the sacrificial death of Christ, and of the condemnation of sin him as the substitute of sinners, then this verse must be understood of justification, and not of sanctification. He condemned sin, in order that the demands of the law might be satisfied. This is the view of the passage given even by the majority of the early Fathers, and by almost all evangelical interpreters, including the Reformers. “Qui intelligunt Spiritu Christi renovatos legem implere, commentum a sensu Pauli penitus alienum afferunt; neque enim eo usque proficiunt fideles, quamdia peregrinantur in mundo, ut justificatio legis in illis plena sit, vel integra. Ergo hoc ad veniam referre necesse est; quia, dum nobis accepta fertur Christi obedientia, legi satisfactum est, ut pro justis censeamur.” That this is the true meaning of the passage appears not only from the connection and the course of the argument, but also from the following considerations:

1. It is consistent with the strict and natural meaning of the words. The word δικαίωμα, here used, means, first, something righteous, and then, second, something declared to be righteous and obligatory, an ordinance or precept; and, third, a righteous decision, a just judgment, as when in Rom. 1:29, the heathen are said to know the δικαίωμα, the righteous judgment of God; and, fourth, the act of declaring righteous, justification. In this sense δικαίωμα is antithetical to κατάκριμα. The δικαίωμα τοῦ νόμου, therefore, may mean, the righteous requirement of the law, that which satisfies its demands. In strict accordance therefore with the sense of the words, we may explain the passage to mean, ‘that the demands of the law might be satisfied in us.’ That is, that we might be justified. Christ was condemned, that to us there might be no condemnation. He was made sin, that we might be made righteousness, 2 Cor. 5:21. Or, if we take δικαίωμα in the sense of (Rechtfertigungsurtheil) a declaration of righteousness, an act of justification, the same idea is expressed: ‘Sin was condemned in Christ, in order that the sentence of justification might be fulfilled, or carried into effect in us.’ This is the explanation which Eckermann, Köllner, Philippi, and other modern interpreters adopt.

2. The analogy of Scripture. To make this passage teach the doctrine of subjective justification, that we are freed from condemnation or delivered from the law by our inward sanctification, is to contradict the plain teaching of the Bible, and the whole drift and argument of this epistle.

3. The concluding clause of the verse, (who walk not after the flesh, &amp;c.) demands the interpretation given above. In the other view of the passage, the latter clause is altogether unnecessary. Why should Paul say, that Christ died in order that they should be holy who are holy, i.e. those who walk not after the flesh? On the other hand, the second clause of the verse is specially pertinent, if the first treats of justification. The benefits of Christ’s death are experienced only by those who walk not after the flesh. The gospel is not antinomian. Those only are justified who are also sanctified. Holiness is the fruit and evidence of reconciliation with God. There is no condemnation to those who walk after the Spirit; and the righteousness of the law is fulfilled by those who walk after the Spirit. In both cases, the latter clause is designed to describe the class of persons who are entitled to appropriate to themselves the promise of justification in Christ.

4. Finally, as intimated in the above quotation from Calvin, it is not true that the righteousness of the law, in the sense of complete obedience, is fulfilled in believers. The interpretation which makes the apostle say, that we are delivered from the law by the work of Christ, in order that the complete obedience which the law demands might be rendered by us, supposes what all Scripture and experience contradicts. For an exposition of the last clause of the verse, see ver. 1.</p></blockquote>

<blockquote><p>In this way we can admit not only that there is a partial righteousness in works (as our adversaries maintain), but that they are approved by God as if they were absolutely perfect. If we remember on what foundation this is rested, every difficulty will be solved. The first time when a work begins to be acceptable is when it is received with pardon. And whence pardon, but just because God looks upon us and all that belongs to us as in Christ? Therefore, as we ourselves when ingrafted into Christ appear righteous before God, because our iniquities are covered with his innocence; so our works are, and are deemed righteous, because every thing otherwise defective in them being buried by the purity of Christ is not imputed. Thus we may justly say, that not only ourselves, but our works also, are justified by faith alone. Now, if that righteousness of works, whatever it be, depends on faith and free justification, and is produced by it, it ought to be included under it and, so to speak, made subordinate to it, as the effect to its cause; so far is it from being entitled to be set up to impair or destroy the doctrine of justification. Thus Paul, to prove that our blessedness depends not on our works, but on the mercy of God, makes special use of the words of David, “Blessed is he whose transgression is forgiven, whose sin is covered;” “Blessed is the man unto whom the Lord imputeth not iniquity.” Should any one here obtrude the numberless passages in which blessedness seems to be attributed to works, as, “Blessed is the man that feareth the Lord;” “He that has mercy on the poor, happy is he;” “Blessed is the man that walketh not in the counsel of the ungodly,” and “that endureth temptation;” “Blessed are they that keep judgment,” that are “pure in heart,” “meek,” “merciful,”, they cannot make out that Paul’s doctrine is not true. For seeing that the qualities thus extolled never all so exist in man as to obtain for him the approbation of God, it follows, that man is always miserable until he is exempted from misery by the pardon of his sins. Since, then, all the kinds of blessedness extolled in the Scripture are vain so that man derives no benefit from them until he obtains blessedness by the forgiveness of sins, a forgiveness which makes way for them, it follows that this is not only the chief and highest, but the only blessedness, unless you are prepared to maintain that it is impaired by things which owe their entire existence to it. There is much less to trouble us in the name of righteous which is usually given to believers. I admit that they are so called from the holiness of their lives, but as they rather exert themselves in the study of righteousness than fulfill righteousness itself, any degree of it which they possess must yield to justification by faith, to which it is owing that it is what it is.</p></blockquote>

</figure><figure class="quote" id="q-3c498b72ff" data-kw="">
<blockquote><p>Grant, Almighty God, that as thou dost train us up with so much diligence and assiduous care, and regard us as dear and precious like an hereditary vine, – O grant, that we may not bring forth wild grapes, and that our fruit may not be bitter and unpleasant to thee, but that we may strive so to form our whole life in obedience to thy law, that all our actions and thoughts may be pleasant and sweet fruits to thee. And as there is ever some sin mixed up with our works, even when we desire to serve thee sincerely and from the heart, grant that all stains in our works may be so cleansed and washed away by the sacrifice of thy Son, that they may be to thee sacrifices of sweet odour, through the same, even Christ Jesus, who has so reconciled us to thee, as to obtain pardon even for our works. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prayers of John Calvin</cite>, (from his Commentary on Hosea)</span></figcaption>

</figure><figure class="quote" id="q-a17a5aad48" data-kw="">
<blockquote><p>Now he could not mean to contradict himself in saying, “The doers of the law shall be justified,” as if their justification came through their works, and not through grace; since he declares that a man is justified freely by His grace without the works of the law, intending by the term “freely” nothing else than that works do not precede justification. For in another passage he expressly says, “If by grace, then is it no more of works; otherwise grace is no longer grace.” But the statement that “the doers of the law shall be justified” must be so understood, as that we may know that they are not otherwise doers of the law, unless they be justified, so that justification does not subsequently accrue to them as doers of the law, but justification precedes them as doers of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De spiritu et littera</cite>, 26.45; “A Treatise on the Spirit and the Letter,” in Saint Augustin: Anti-Pelagian Writings, ed. Philip Schaff, trans. Peter Holmes, NPNF 5.102.</span></figcaption>

</figure><figure class="quote" id="q-7aee18ce20" data-kw="">
<blockquote><p>That they indeed quote Paul in the same sense does them very little good: “The doers of the law, not the hearers, are justified” [Rom. 2:13 p.]. I do not intend to evade the question through Ambrose’s solution: that this was said because fulfillment of the law is faith in Christ.15 For I see this as a mere evasion, quite needless where the way lies open. Here the apostle is casting down the foolish confidence of the Jews, who claimed for themselves the sole knowledge of the law, even while they were its greatest despisers. Lest, then, mere skill in the law should please them so much, he warns that if righteousness be sought from the law, not knowledge but observance of it is sought. We assuredly do not question that the righteousness of the law consists in works, and not even that righteousness consists in the worth and merits of works. But it has not yet been proved that we are justified by works unless they produce some one man who has fulfilled the law. That Paul meant precisely this is sufficiently attested by the context of his utterance. After having condemned Gentiles and Jews together for their unrighteousness, he then gets down to details and says: “Those who have sinned without law will perish without law,” which has reference to the Gentiles; and “those who have sinned in the law will be judged by the law” [Rom. 2:12], which concerns the Jews. Now, since they, winking at their own shortcomings, plumed themselves on the law alone, Paul adds something especially fitting: the law was not laid down merely that men might be made righteous by hearing its voice; but only if and when they obeyed it. It is as if he said: “Do you seek righteousness in the law? Do not claim to have heard it, something of little weight in itself, but bring works whereby you may declare that the law was not laid down for you in vain.” Since they were all lacking in these works, it followed that they were bereft of boasting about the law. Paul’s meaning, then, requires us, rather, to frame the opposite argument: the righteousness of the law lies in perfection of works; no one can boast that he has fulfilled the law through works; consequently, there is no righteousness arising from the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Ford Lewis Battles, 3.17.12.</span></figcaption>

</figure><figure class="quote" id="q-dbc3440c80" data-kw="">
<blockquote><p>VERSE 13. For not the hearers of the law. This verse is connected with the last clause of the preceding, and assigns the reason why the Jews shall be judged or punished according to the law; the mere possession or knowledge of the law would not avail, for it is not the hearers, but the doers of the law that are just before God. The expression hearers instead of readers, is explained by the fact that the law was read in the presence of the people, and by hearing rather than by reading, their knowledge of it was obtained. Comp. Matt. 5:21, John 12:34, Gal. 4:21, James 1:22. To be just before God, and to be justified, are the same thing. They are both forensic expressions, and indicate the state rather than the character of those to whom they refer. Those are just in the sight of God, or are justified, who have done what the law requires, and are regarded and treated accordingly; that is, are declared to be free from condemnation, and entitled to the favour of God. In obvious allusion to the opinion, that being a Jew was enough to secure admission to heaven, the apostle says, It is not the hearers but the doers of the law that are justified. He is not speaking of the method of justification available for sinners, as revealed in the gospel, but of the principles of justice which will be applied to all who look to the law for justification. If men rely on works, they must have works; they must be doers of the law; they must satisfy its demands, if they are to be justified by it. For God is just and impartial; he will, as a judge administering the law, judge every man, not according to his privileges, but according to his works and the knowledge of duty which he has possessed. On these principles, it is his very design to show that no flesh living can be justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, (Grand Rapids, MI: Louis Kregel, 1882), 81–82.</span></figcaption>

— Charles Hodge, Commentary on Romans, (Grand Rapids, MI: Louis Kregel, 1882), 81–82.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVERSE+13.+For+not+the+hearers+of+the+law.+This+verse+is+connected+with+the+last+clause+of+the+preceding%2C+and+assigns+the+reason+why+the+Jews+shall+be+judged+or+punished+according+to+the+law%3B+the+mere+possession+or+knowledge+of+the+law+would+not+avail%2C+for+it+is+not+the+hearers%2C+but+the+doers+of+the+law+that+are+just+before+God.+The+expression+hearers+instead+of+readers%2C+is+explained+by+the+fact+that+the+law+was+read+in+the+presence+of+the+people%2C+and+by+hearing+rather+than+by+reading%2C+their+knowledge+of+it+was+obtained.+Comp.+Matt.+5%3A21%2C+John+12%3A34%2C+Gal.+4%3A21%2C+James+1%3A22.+To+be+just+before+God%2C+and+to+be+justified%2C+are+the+same+thing.+They+are+both+forensic+expressions%2C+and+indicate+the+state+rather+than+the+character+of+those+to+whom+they+refer.+Those+are+just+in+the+sight+of+God%2C+or+are+justified%2C+who+have+done+what+the+law+requires%2C+and+are+regarded+and+treated+accordingly%3B+that+is%2C+are+declared+to+be+free+from+condemnation%2C+and+entitled+to+the+favour+of+God.+In+obvious+allusion+to+the+opinion%2C+that+being+a+Jew+was+enough+to+secure+admission+to+heaven%2C+the+apostle+says%2C+It+is+not+the+hearers+but+the+doers+of+the+law+that+are+justified.+He+is+not+speaking+of+the+method+of+justification+available+for+sinners%2C+as+revealed+in+the+gospel%2C+but+of+the+principles+of+justice+which+will+be+applied+to+all+who+look+to+the+law+for+justification.+If+men+rely+on+works%2C+they+must+have+works%3B+they+must+be+doers+of+the+law%3B+they+must+satisfy+its+demands%2C+if+they+are+to+be+justified+by+it.+For+God+is+just+and+impartial%3B+he+will%2C+as+a+judge+administering+the+law%2C+judge+every+man%2C+not+according+to+his+privileges%2C+but+according+to+his+works+and+the+knowledge+of+duty+which+he+has+possessed.+On+these+principles%2C+it+is+his+very+design+to+show+that+no+flesh+living+can+be+justified.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Commentary+on+Romans%2C+%28Grand+Rapids%2C+MI%3A+Louis+Kregel%2C+1882%29%2C+81%E2%80%9382.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdbc3440c80.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dbc3440c80.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/06/charles-hodge-on-romans-213/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-a556d3b901" data-kw="">
<blockquote><p>…they gloried in the mere knowledge of it: to obviate this mistake, he declares that the hearing of the law or any knowledge of it is of no such consequence, that any one should on that account lay claim to righteousness, but that works must be produced, according to this saying, “He who will do these shall live in them.” The import then of this verse is the following, — “That if righteousness be sought from the law, the law must be fulfilled; for the righteousness of the law consists in the perfection of works.” They who pervert this passage for the purpose of building up justification by works, deserve most fully to be laughed at even by children. It is therefore improper and beyond what is needful, to introduce here a long discussion on the subject, with the view of exposing so futile a sophistry: for the Apostle only urges here on the Jews what he had mentioned, the decision of the law, — That by the law they could not be justified, except they fulfilled the law, that if they transgressed it, a curse was instantly pronounced on them. Now we do not deny but that perfect righteousness is prescribed in the law: but as all are convicted of transgression, we say that another righteousness must be sought. Still more, we can prove from this passage that no one is justified by works; for if they alone are justified by the law who fulfill the law, it follows that no one is justified; for no one can be found who can boast of having fulfilled the law.</p></blockquote>

log.net/2014/05/calvin-on-romans-213/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>13. But the doers of the Law will be justified. This passage is interpreted in a twofold way by blessed Augustine in chapter 26 of On the Spirit and the Letter. First in this way:The doers of the Law will be justified means that through justification they will become, will be made, what they were not before, doers. Second, and in a better way, will be justified means that they will be looked upon and thought of as righteous, as stated in the gloss. It is sufficiently clear from the preceding (the period 13), “for not the hearers of the Law are righteous before God,” that, if you should ask who else is righteous before God except the hearers, the answer would be: “The doers will be righteous, that is, they will be justified and looked upon as righteous.” Thus Ps. 143:2 says, “for no man living is righteous before Thee,” that is, he is not looked upon as righteous. And below, in Rom. 3:20, we read: “No human being will be justified in his sight by works of the law.” And again Luke 10:29: “And he, desiring to justify himself” (that is, he wanted to declare or to state that he was righteous, and he wanted to absolve himself of sin, as though he did not know who was his neighbor whom he was commanded to love), and similarly in many other places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, 25.184–85.</span></figcaption>

<blockquote><p>How then can his repentance atone for his iniquities, or entitle him to the favour of God and to the happiness of heaven? How can that evangelical repentance, which he is incapable of exercising till after his sins be all forgiven on the ground of an infinite atonement imputed to him, make atonement for them? How can that true repentance, which he cannot exercise until in justification he be already entitled to eternal life, entitle him to eternal life? Does not the consummate righteousness of Jesus Christ, imputed for justification, entitle the believer fully to it? What need is there, then, that his repentance should entitle him? How can that exercise of repentance which is the consequence of pardon, afford a previous title to pardon? or that which is a part of eternal life be a ground of right to eternal life?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Repentance</cite>, (pp. 103–04). Monergism Books. Kindle Edition.</span></figcaption>

<blockquote><p>XVII. Further, if it is asked here whether the sins of the pious equally as well as of the wicked will be revealed, we answer that the negative seems more probable to us. (1) On account of the judge, who since he has been most fully satisfied for us and now intercedes for us in heaven, will then come as their Redeemer and Savior, not to reproach them for their sins, but to fulfill his promises in them and to manifest the wonders of his grace. (2) The process of the judgment is such that mention may indeed be made of good works, but not of their evil works (Matt 25:31–40). The pious will not hear the publication of their sins, but the reward of their love and benevolence. (3) The gratuitous mercy of Christ does not wish our sins to be remembered anymore, but casts them behind it’s back. Now what God has once wish to be covered in this life, he will not reveal in the other. (4) If their sins were to be made known, it would lead to the disgrace and confusion of the pious, from which they ought to be free. For Christ will return for this end—that he may be glorious in his saints and be admired in all believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, question six.</span></figcaption>

</figure><figure class="quote" id="q-07fd5129bb" data-kw="">
<blockquote><p>Therefore, as regards the primary points or articles of faith, man is bound to believe them, just as he is bound to have faith; but as to other points of faith, man is not bound to believe them explicitly, but only implicitly, or to be ready to believe them, in so far as he is prepared to believe whatever is contained in the Divine Scriptures. Then alone is he bound to believe such things explicitly, when it is clear to him that they are contained in the doctrine of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, 2a2ae 2.5, resp. dic.</span></figcaption>

<blockquote><p>It is a great sin to think any sin little; but it is a greater sin to think the righteousness of Christ is not above all sin. Our disobedience is the disobedience of man; but Christ’s obedience is the obedience of God: therefore, our believing in Christ doth please God better than if we had continued innocency, and never sinned. The least sin is unpardonable without this obedience and righteousness of Christ; and the greatest is pardonable by it. Therefore, O seek in to Christ, to be clothed upon with this righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“And Walking in Him, Opened”</cite></span></figcaption>

</figure><figure class="quote" id="q-127407a87b" data-kw="">
<blockquote><p>CHAP. XXXVII. CONCERNING THE SECOND DEGREE OF THE DECLARATION OF GODS LOVE. The second degree, is Justification, whereby such as believe, are accounted just before God, through the obedience of Christ Jesus. 2. Cor. 5. 21. He has made him to be sin for us, who knew no sin: that we should be made the righteousness of God in him. 1. Cor. 1. 30. Rom. 5. 19. As by one man’s disobedience many were made sinners, so by the obedience of one (that is, Jesus Christ) shall many also be made righteous. Quest. Whether did Christ perform full obedience to the Law, for us men alone, or for himself also? Answ.

I. Not for himself, as some not rightly would have him: for the flesh of Christ being hypostatically united to the Word, and so in it self fully sanctified, was even from the first moment of conception, most worthy to be blessed with eternal life. Therefore, by all that obedience which he performed after his conception, Christ merited nothing for himself.

II. For us, namely, for the faithful, he fulfilled all the righteoussness of the law and hence it is, that he is called the end of the law unto righteousness, to every one who believes, Rom. 10. 4. Here may be objected:

I. Christ as he is man, is bound to perform obedience to the law for himself. Answ. He is not bound by nature, but of his own accord: for he was not a mere man, but God and man. And albeit Christ did never suffer nor fulfill the law, but in that flesh which he took upon him; yet by reason of the hypostatical union, this his passion and obedience has respect unto the whole person, considered as God and man, and therefore his obedience was not due on his part, and so was without merit to himself yea, in that the flesh of Christ is united to the person of the Word, and so exalted in dignity and sanctity, above all angels, it may seem to be exempted from this natural obligation of performing the law.

II. Object. If then Christ performed the law for us, we are no more bound to the observance of the same: as we do not undergo eternal punishments for our sins, the which Christ in his person did bear upon the cross. Answer. If we keep the same respect of performing obedience to the law, the consequence is very true, otherwise it is not so: for Christ performed obedience to the law for us, as it is the satisfaction of the law: but the faithful they are bound to obedience, not as it is satisfactory, but as it is a document of faith, and a testimony of their gratitude towards God, or a means to edify their neighbours: even as Christ suffering eternal punishments for our sins, we also suffer punishments, as they are either trials, or chastisments unto us.

III. Object. The law and justice of God do not togither exact both, namely obedience, and punishment. Answ. In man’s perfect estate, the justice of God requires only obedience: but in his estate corrupted, he requires both obedience, and punishment. Punishment, as the law is violated: Obedience, that legal justice may be performed. Gal. 3. 10. It is therefore plain, that not only Christ’s passion, but also his legal obedience, is our righteousness before God. Justification hath two parts: Remission of sins, and imputation of Christs righteoussness. Remission of sins, is that part of justification, whereby he that believeth, is freed from the guilt and punishment of sin, by the passion of Christ. Col. 1. 21, 22. You has he now reconciled in the body of his flesh thorough death, to make you holy and blameless, and without fault in his sight. 1. Pet. 2. 24. Who, in his own flesh, bore our sins in his body, on the tree, that we being delivered from sin, should live in righteousness, by whose stripes you are healed. Imputation of righteousness, is the other part of justification, whereby such as believe, having the guilt of their sins covered, are accounted just in the sight of God, through Christ’s righteousness. 2. Cor. 5. 21. Psal. 32. 1. Blessed is he, whose wickedness is forgiven, and whose sin is covered. Rom. 4. the whole chapter, where the Apostle repeats imputation eleven times. Phil. 3. 8, 9. I have counted all things loss, and do judge them to be dung, that I might win Christ, and might be found in him, that is, not having my own righteousness that is by the law, but that which is through the faith of Christ, even the righteousness [note] which is of faith. The form of justification, is, as it were, a kind of translation of the believer’s sins to Christ, and again Christ’s righteousness unto the believer, by a reciprocal or mutual imputation. As is apparent in this picture following.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine</cite>, (1590; 1616 edition) (spelling and punctuation modernized; emphasis added).</span></figcaption>

<blockquote><p>1.2.1 We are all, by nature, void of all strength and ability to perform acceptably that holiness and righteousness which the law requires, and are dead in trespasses and sins, and children of wrath, by the sin of our first father, Adam, as the Scripture witnesses (Rom. 5:12, 15, 18, 19; Eph. 2: 1-3; Rom. 8:7, 8). This doctrine of original sin, which Protestants generally profess, is a firm basis and groundwork to the assertion now to be proved, and to many other assertions in this whole discourse. If we believe it to be true, we cannot rationally encourage ourselves to attempt a holy practice, until we are acquainted with some powerful and effectual means to enable us to do it. While man continued upright, in the image of God, as he was at first created (Eccles. 7:29; Gen. 1:27), he could do the will of God sincerely, as soon as he knew it; but, when he was fallen, he was quickly afraid, because of his nakedness; but could not help it at all, until God discovered to him the means of restoration (Gen. 3:10, 15). Say to a strong healthy servant, ‘Go’, and he goes; ‘Come’, and he comes; ‘Do this’, and he does it; but a bedridden servant must know first how he may be enabled. No doubt the fallen angels knew the necessity of holiness, and trembled at the guilt of their sin; but they knew of no means for them to attain to holiness effectually, and so continue still in their wickedness. It was in vain for Samson to say, ‘I will go out as at other times before, and shake myself,’ when he had sinned away his strength (Judg. 16:20). Men show themselves strangely forgetful, or hypocritical, in professing original sin their prayers, catechisms and confessions of faith, and yet urging on themselves and others the practice of the law, without the consideration of any strengthening, enlivening means – as if there were no want of ability, but only of activity.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1.2.1 We are all, by nature, void of all strength and ability to perform acceptably that holiness and righteousness which the law requires, and are dead in trespasses and sins, and children of wrath, by the sin of our first father, Adam, as the Scripture witnesses (Rom. 5:12, 15, 18, 19; Eph. 2: 1-3; Rom. 8:7, 8). This doctrine of original sin, which Protestants generally profess, is a firm basis and groundwork to the assertion now to be proved, and to many other assertions in this whole discourse. If we believe it to be true, we cannot rationally encourage ourselves to attempt a holy practice, until we are acquainted with some powerful and effectual means to enable us to do it. While man continued upright, in the image of God, as he was at first created (Eccles. 7:29; Gen. 1:27), he could do the will of God sincerely, as soon as he knew it; but, when he was fallen, he was quickly afraid, because of his nakedness; but could not help it at all, until God discovered to him the means of restoration (Gen. 3:10, 15). Say to a strong healthy servant, ‘Go’, and he goes; ‘Come’, and he comes; ‘Do this’, and he does it; but a bedridden servant must know first how he may be enabled. No doubt the fallen angels knew the necessity of holiness, and trembled at the guilt of their sin; but they knew of no means for them to attain to holiness effectually, and so continue still in their wickedness. It was in vain for Samson to say, ‘I will go out as at other times before, and shake myself,’ when he had sinned away his strength (Judg. 16:20). Men show themselves strangely forgetful, or hypocritical, in professing original sin their prayers, catechisms and confessions of faith, and yet urging on themselves and others the practice of the law, without the consideration of any strengthening, enlivening means – as if there were no want of ability, but only of activity.”

— Walter Marshall, The Gospel Mystery of Sanctification, (1692)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.2.1+We+are+all%2C+by+nature%2C+void+of+all+strength+and+ability+to+perform+acceptably+that+holiness+and+righteousness+which+the+law+requires%2C+and+are+dead+in+trespasses+and+sins%2C+and+children+of+wrath%2C+by+the+sin+of+our+first+father%2C+Adam%2C+as+the+Scripture+witnesses+%28Rom.+5%3A12%2C+15%2C+18%2C+19%3B+Eph.+2%3A+1-3%3B+Rom.+8%3A7%2C+8%29.+This+doctrine+of+original+sin%2C+which+Protestants+generally+profess%2C+is+a+firm+basis+and+groundwork+to+the+assertion+now+to+be+proved%2C+and+to+many+other+assertions+in+this+whole+discourse.+If+we+believe+it+to+be+true%2C+we+cannot+rationally+encourage+ourselves+to+attempt+a+holy+practice%2C+until+we+are+acquainted+with+some+powerful+and+effectual+means+to+enable+us+to+do+it.+While+man+continued+upright%2C+in+the+image+of+God%2C+as+he+was+at+first+created+%28Eccles.+7%3A29%3B+Gen.+1%3A27%29%2C+he+could+do+the+will+of+God+sincerely%2C+as+soon+as+he+knew+it%3B+but%2C+when+he+was+fallen%2C+he+was+quickly+afraid%2C+because+of+his+nakedness%3B+but+could+not+help+it+at+all%2C+until+God+discovered+to+him+the+means+of+restoration+%28Gen.+3%3A10%2C+15%29.+Say+to+a+strong+healthy+servant%2C+%E2%80%98Go%E2%80%99%2C+and+he+goes%3B+%E2%80%98Come%E2%80%99%2C+and+he+comes%3B+%E2%80%98Do+this%E2%80%99%2C+and+he+does+it%3B+but+a+bedridden+servant+must+know+first+how+he+may+be+enabled.+No+doubt+the+fallen+angels+knew+the+necessity+of+holiness%2C+and+trembled+at+the+guilt+of+their+sin%3B+but+they+knew+of+no+means+for+them+to+attain+to+holiness+effectually%2C+and+so+continue+still+in+their+wickedness.+It+was+in+vain+for+Samson+to+say%2C+%E2%80%98I+will+go+out+as+at+other+times+before%2C+and+shake+myself%2C%E2%80%99+when+he+had+sinned+away+his+strength+%28Judg.+16%3A20%29.+Men+show+themselves+strangely+forgetful%2C+or+hypocritical%2C+in+professing+original+sin+their+prayers%2C+catechisms+and+confessi </figure><figure class="quote" id="q-dcc5968ccd" data-kw="">
<blockquote><p>I do not want to pursue the individual testimonies that the stupid Sorbonnists of today have groundlessly torn from Scripture—whatever first came to hand—to fling at us. For some are so ridiculous that I could not mention them unless I wished to be justly accounted foolish. I shall terminate this matter after I have explained a statement of Christ’s, in which they take marvelous pleasure. For he answers the lawyer who asks him what is needed for salvation, “If you would enter into life, keep the commandments.” What more do we want, they ask, when we are bidden by the Author of grace to attain God’s Kingdom by observing the commandments? As if it were not evident that Christ did not accommodate his replies to those with whom he saw that he had to deal! Here a doctor of law asks about the manner of obtaining blessedness—and not simply that but by what deeds men may arrive at it. And the person of the speaker and the question itself prompted the Lord to answer thus. The lawyer, accustomed to the persuasion of law righteousness, blinded himself with confidence in works. Then he sought only what were works of righteousness whereby salvation is acquired. Therefore he is rightly sent back to the law wherein there is a perfect mirror of righteousness. With a clear voice we too proclaim that these commandments are to be kept if one seeks life in works. And Christians must know this doctrine, for how could they flee to Christ unless they recognized that they had plunged from the way of life over the brink of death? How could they realize how far they had wandered from the way of life unless they first understood what that way is like? Only, therefore, when they distinguish how great is the difference between their life and divine righteousness that consists in accepting the law are they made aware that, in order to recover salvation, their refuge is in Christ. To sum up, if we seek salvation in works, we must keep the commandments by which we are instructed unto perfect righteousness. But we must not stop here unless we wish to fail in mid-course, for none of us is capable of keeping the commandments. Therefore, since we are barred from law righteousness, we must betake ourselves to another help, that is, to faith in Christ. For this reason, as the Lord in this passage recalls to the law a teacher of the law whom he knew to be puffed up with empty confidence in works, in order that he may learn he is a sinner, subject to the dreadful judgment of eternal death, so elsewhere he comforts with the promise of grace without any mention of the law others who have already been humbled by this sort of knowledge: “Come to me all who labor and are heavy-laden, and I will refresh you… and you will find rest for your souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.9 (Battles edition)</span></figcaption>

</figure><figure class="quote" id="q-6805f5aea8" data-kw="">
<blockquote><p>It is natural that those who have experienced the agitations which frequently attend upon conversion, and have felt the peace which flows from a hope of acceptance with God, to imagine that the conflict is over, the victory won, and the work of religion accomplished. This imagination is soon dissipated. Birth is not the whole of life; neither is conversion the whole of religion. A young mother may, in the fullness of her joy, forget for a moment that her vocation as a mother is but just begun; but when she looks upon her infant, so wonderful in its organization and instinct with an immortal spirit, the sight of its helplessness makes her feel how great a work she has still to do. An hour’s neglect might prove the ruin of her hopes. Thus the young Christian, although at first disposed to think that his work is finished, soon finds that the feeble principle of spiritual life needs to be watched and nourished with ceaseless care. If abandoned at its birth, it must perish as certainly and as speedily as an exposed infant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Way of Life</cite>, (Philadelphia: American Sunday School Union, 1893), 286.</span></figcaption>

<blockquote><p>This union is not the subsequent fruit of a higher degree of holiness, but coincides with the first exercise of faith. Faith which does not live in Christ is no faith, but its counterfeit. Genuine faith is wrought in us by the Holy Ghost, and all that he imparts to us he draws from Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/abraham-kuyper.html">Abraham Kuyper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Work of the Holy Spirit</cite>, 336.</span></figcaption>

<blockquote><p>I.I.XV. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore man’s glorying is not excluded, but he may glory as a faithful servant may do upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man in himself ungodly is considered in the covenant, as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. I.IX.XVI. The second thing, which we said, § II. was immutable in the covenant of works, was this; that eternal life was not obtainable on any other condition but that of perfect obedience: as may thus be invincibly proved: for, by virtue of this general rule, it was necessary for Christ to be made under the law, Gal. iv. 4. and fulfil all righteousness, and that for this end, that the righteousness of the law might be fulfilled, Rom. viii. 4. But if this righteousness had not been sacred and inviolable, Christ would have been under no necessity to submit to the covenant of the law, in order to merit eternal life for his people. This therefore is evident, that there ought to be a merit of perfect obedience on which a right to eternal life may be founded. Nor is it material whether that perfect obedience be performed by man himself, or by his surety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“I.I.XV. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore man’s glorying is not excluded, but he may glory as a faithful servant may do upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man in himself ungodly is considered in the covenant, as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. I.IX.XVI. The second thing, which we said, § II. was immutable in the covenant of works, was this; that eternal life was not obtainable on any other condition but that of perfect obedience: as may thus be invincibly proved: for, by virtue of this general rule, it was necessary for Christ to be made under the law, Gal. iv. 4. and fulfil all righteousness, and that for this end, that the righteousness of the law might be fulfilled, Rom. viii. 4. But if this righteousness had not been sacred and inviolable, Christ would have been under no necessity to submit to the covenant of the law, in order to merit eternal life for his people. This therefore is evident, that there ought to be a merit of perfect obedience on which a right to eternal life may be founded. Nor is it material whether that perfect obedience be performed by man himself, or by his surety.”

— Herman Witsius, The Economy of the Covenants between God and Man">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.I.XV.+In+the+covenant+of+works%2C+man+is+considered+as+working%2C+and+the+reward+to+be+given+as+of+debt%3B+and+therefore+man%E2%80%99s+glorying+is+not+excluded%2C+but+he+may+glory+as+a+faithful+servant+may+do+upon+the+right+discharge+of+his+duty%2C+and+may+claim+the+reward+promised+to+his+working.+In+the+covenant+of+grace%2C+man+in+himself+ungodly+is+considered+in+the+covenant%2C+as+believing%3B+and+eternal+life+is+considered+as+the+merit+of+the+mediator%2C+and+as+given+to+man+out+of+free+grace%2C+which+excludes+all+boasting%2C+besides+the+glorying+of+the+believing+sinner+in+God%2C+as+his+merciful+Saviour.+I.IX.XVI.+The+second+thing%2C+which+we+said%2C+%C2%A7+II.+was+immutable+in+the+covenant+of+works%2C+was+this%3B+that+eternal+life+was+not+obtainable+on+any+other+condition+but+that+of+perfect+obedience%3A+as+may+thus+be+invincibly+proved%3A+for%2C+by+virtue+of+this+general+rule%2C+it+was+necessary+for+Christ+to+be+made+under+the+law%2C+Gal.+iv.+4.+and+fulfil+all+righteousness%2C+and+that+for+this+end%2C+that+the+righteousness+of+the+law+might+be+fulfilled%2C+Rom.+viii.+4.+But+if+this+righteousness+had+not+been+sacred+and+inviolable%2C+Christ+would+have+been+under+no+necessity+to+submit+to+the+covenant+of+the+law%2C+in+order+to+merit+eternal+life+for+his+people.+This+therefore+is+evident%2C+that+there+ought+to+be+a+merit+of+perfect+obedience+on+which+a+right+to+eternal+life+may+be+founded.+Nor+is+it+material+whether+that+perfect+obedience+be+performed+by+man+himself%2C+or+by+his+surety.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd3d133a57a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d3d133a57a.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/07/witsius-on-merit/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-146d9af93b" data-kw="">
<blockquote><p>For the [Mosiac] covenant was a legal covenant solemnly agreed, by which the people were obligated to present, by their own strength, perfect obedience to the Law (Matthew 22). Since the Law is the eternal rule of righteousness in the divine mind to which he wills all rational creatures to be conformed, and eternal life was promised by God to the servants who perfectly obeyed, truly the curse is pronounced upon transgressors. …For this reason also the Apostle says in Romans 10 that the goal of this legal covenant was Christ. And he withdrew nothing from the divine justice expressed in the sanction of the law, already before the same through the Prophet he promised a Mediator, God and Man, who by the his merit the memory of sin will be destroyed and by his efficacy the laws will be inscribed on our hearts. Because the knowledge of him will have been given to us by means of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia foederis gratuiti inter deum et electos</cite>, 1.1.9 and 11. | Translation by R. Scott Clark.</span></figcaption>

</figure><figure class="quote" id="q-4f9c8beedf" data-kw="">
<blockquote><p>First, that we may put a difference between Christian and heathen virtues. For, howbeit the same virtues in kind and name are and may be found both in those that profess Christ and those also that are ignorant of the true God. Yet they are in them after a divers manner. For in heathen men they are the gifts of God, but not parts of regeneration and new birth. But in those that be true Christians they are indeed not only the gifts of God’s Spirit but also essential parts of regeneration. That we may better yet conceive this difference we must understand that the grace of God in man is twofold: restraining and renewing. Restraining [grace] is that which bridles and restrains the corruption of men’s hearts from breaking forth into outward actions, for the common good, that societies may be preserved and one man may live orderly with another. Renewing grace is that which not only restrains corruption but also mortifies sin and renews the heart daily more and more. The former of these is incident to heathen men and the virtues which they have. It serves only to repress the act of sin their outward actions. But in Christians, they are graces of God, not only bridling and restraining the affection, but renewing the heart, and mortifying all corruption. And though those virtues of the heathen be graces of God, yet they are but general and common to all. Whereas the virtues of Christians, are special graces of the Spirit, sanctifying and renewing the mind, will, and affections. For example, chastity in Joseph was a grace of God’s Spirit, renewing his heart. But chastity in Xenocrates was a common grace serving only to curb and restrain the corruption of his heart. And the like may be said of the justice of Abraham, a Christian, and of Aristides, a heathen.</p></blockquote>

</figure><figure class="quote" id="q-6d217371a9" data-kw="">
<blockquote><p>Sanctification is a work of the Triune God, that is ascribed more particularly to the Holy Spirit in Scripture. It is particularly important in our day, with its emphasis on the necessity of approaching the study of theology anthropologically and its one-sided call to service in the kingdom of God, to stress the fact that God, and not man, is the author of sanctification. Especially in view of the Activism that is such a characteristic feature of American religious life, and which glorifies the work of man rather than the grace of God, it is necessary to stress the fact over and over again that sanctification is the fruit of justification, that the former is simply impossible without the latter, and that both are the fruits of the grace of God in the redemption of sinners. Though man is privileged to cooperate with the Spirit of God, he can do this only in virtue of the strength which the Spirit imparts to him from day to day. The spiritual development of man is not a human achievement, but a work of divine grace. Man deserves no credit whatsoever for that which he contributes to it instrumentally… A man may boast of great moral improvement, and yet be an utter stranger to sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, 535.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification.html">Sanctification</a></span></div>

<blockquote><p>Since, then, in the Articles of the Faith, which contain a summary of the gospel, Christ the King Himself offers to us that kingdom of His; and since He effectually confederates us to Himself through faith by the power of His Spirit so that He might rule in us, let us briefly explain what faith is. Once we know the will of God, faith is to assent to Him in the whole of His Word as one who is true and omnipotent. It is thus to give Him glory and not to give consideration to anything in ourselves or other creatures that appears contrary to His Word. The primary goal of faith is to look in this Word at the promise of the gospel, the promise that the Father truly presents Himself to us in Christ and through the Holy Spirit graciously justifies those engrafted into Christ, sanctifies us more and more, and preserves us by that same power by which Christ was raised from the dead and had all things subjected to Him. This is so that the hope of eternal life that is grounded in this truth and power might be most certain (p. 16 This article concerning Christ’s person — which consists of two natures, human and divine, joined together in an eternal personal union while the properties of each nature are preserved forever — contains the foundation and basis of the royal priesthood of Christ, and consequently of the eternal covenant between God and humanity. Human happiness is to be united with God, the source of all good (1 John 1[:3]). By contrast, the greatest unhappiness is to be separated from God. Humanity, however, had separated itself from God through sin and had entered into a covenant with the devil. In the same way, therefore, that there was a certain person through whom sin entered the world, and death through sin, and who thus became the cause and, as it were, foundation of the defection from God and of the covenant with the devil, so also there ought to be a certain person designated by God as the foundation and cause of an indestructible union with God, the source of all happiness (p. 67). Moreover, the human Christ could not be a Savior by His power unless the divine nature were joined to Him in the unity of His person, from which, as from the Father at the same time, the Holy Spirit proceeds, who leads us into possession of Christ, engrafts us into Christ, and regenerates us unto eternal life (1 Cor. 15:21, 45; Rom. 8:8–9). Indeed, so that those who have once truly been engrafted into Christ by the Holy Spirit can never again be cut off from eternal life, the λογον Himself — the eternal Son of God, consubstantial with the Father, namely, the very fountain of life, in which there was life from the beginning (John 1[:4]) — must dwell σωματκως, that is, personally, in His assumed human nature for all eternity (p.72). Our entering into covenant and reconciliation with God required that both of these natures in the Mediator be true and intact, with their properties preserved. In the same way, since the covenant and union must last for all eternity, so that even after the resurrection our true flesh and bones might enjoy happiness (Phil. 3[:21]), it is also necessary in the foundation, namely, in the Mediator, upon whom the task of saving us forever was placed, that tremaintact forever — body and soul, flesh and bones. (p. 73) Vivification, therefore, is the second fruit of the resurrection of Christ because Christ Himself, who is always living, is our life through faith, and because, by the power that we draw from Christ our Head, we arise in this life to newness of life through the Spirit of faith. This is so that by living pure and holy lives, we might wholly consecrate ourselves to the will of God. That is what the apostle teaches in Colossians 3[:1–2]: “If then you were raised with Christ, seek those things which are above, where Christ is, sitting at the right hand of God. Set your mind on things above, not on things on the earth.” That is also why he says in Romans 6[:4–5] that we were engrafted into the likeness of Christ’s death so that, as participants in His resurrection, we might walk in newness of life. With these words he is not only offering the resurrection of Christ as an example for us to imitate; he is also, and especially, teaching that this is brought about in us by the power of Christ’s resurrection so that we are able to rise again to a new life (p. 97) Third, the ascension is the progression and continuation of His righteousness. This is primarily because He could not ascend into heaven, into that great glory, in His own body accursed in our sins, unless He had been fully justified for our sins and faith (Heb. 1:7) (p. 104). The second fruit is that by His ascension Christ makes us to sit with Him in heavenly places (Eph. 2[:6]), so that we do not simply anticipate heaven in mere hope but already possess it in Christ our Head and Brother. This is because after full expiation for our sins had been made, the Pledge, in the earthly and bodily form that He received from us, now possesses heaven on our behalf. It is also because we possess a spiritual and heavenly pledge received, in turn, from Him, namely, the Spirit of Christ dwelling in us. So we are engrafted into Him by the power of the Holy Spirit through faith in the promise of the gospel (p. 105). His operations are many and diverse. First, He is given so that He might bear witness in our hearts to the love of the Father (Gal. 4[:6]) and illumine the eyes of our minds with the knowledge of Christ. Thus, He engrafts me into Christ through faith, as a branch into the vine, and makes me a partaker of Christ and all His benefits (John 15[:1ff.]). The union with Christ and His benefits that the Holy Spirit brings about in us is powerfully expressed in Scripture when it says that the Holy Spirit sprinkles us with the blood of Christ (1 Peter 1[:2]), makes us “members of Christ” (1 Cor. 6[:15]), feeds us with Christ (John 6[:50–58]), gives us Christ to drink (1 Cor. 10[:4, 16]; 12),1 and builds us on Christ (Eph. 2[:20]). Here the office and purpose of the Holy Spirit given to us is shown, namely, that through faith the Spirit might unite us to Christ as closely as possible and might achieve similar results in both members and Head, seeing as it is the same Spirit, the same life and glory (Rom. 8[:1–26]) (p. 124). The communion of saints signifies first that outward fellowship by which members of the visible church are called into one body of people through the ministry of the teaching of the prophets and apostles, and through the sacraments. It also signifies that inward union by which those whom the Lord has forever chosen to be a part of this visible assembly, that is, those who truly believe, are united by the same Spirit with the Father, His Son Jesus Christ, and with each other (p. 131-132) I believe that whatever is and is called sin — whether it be original sin the form of that transgression in Adam’s loins and the consequent corruption that I carry around in the flesh, or actual sin the form of the wicked thoughts, words, and deeds that arise out of original sin — I believe, I say, that through faith, by which I am and remain engrafted into Christ, all of that is forgiven me by the gracious goodness of God. God does this in such a way that He erases all memory of both guilt and punishment, just as if I had never sinned or had no sin. Therefore, I trust that already now I am blessed (p. 133-134). For those of us who are truly engrafted into Christ through faith begin to possess—in addition to that benefit of forgiveness with which the image of Satan is covthe restoration of the image of God… (p. 134-35)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Since, then, in the Articles of the Faith, which contain a summary of the gospel, Christ the King Himself offers to us that kingdom of His; and since He effectually confederates us to Himself through faith by the power of His Spirit so that He might rule in us, let us briefly explain what faith is. Once we know the will of God, faith is to assent to Him in the whole of His Word as one who is true and omnipotent. It is thus to give Him glory and not to give consideration to anything in ourselves or other creatures that appears contrary to His Word. The primary goal of faith is to look in this Word at the promise of the gospel, the promise that the Father truly presents Himself to us in Christ and through the Holy Spirit graciously justifies those engrafted into Christ, sanctifies us more and more, and preserves us by that same power by which Christ was raised from the dead and had all things subjected to Him. This is so that the hope of eternal life that is grounded in this truth and power might be most certain (p. 16 This article concerning Christ’s person — which consists of two natures, human and divine, joined together in an eternal personal union while the properties of each nature are preserved forever — contains the foundation and basis of the royal priesthood of Christ, and consequently of the eternal covenant between God and humanity. Human happiness is to be united with God, the source of all good (1 John 1[:3]). By contrast, the greatest unhappiness is to be separated from God. Humanity, however, had separated itself from God through sin and had entered into a covenant with the devil. In the same way, therefore, that there was a certain person through whom sin entered the world, and death through sin, and who thus became the cause and, as it were, foundation of the defection from God and of the covenant with the devil, so also there ought to be a certain person designated by God as the foundation and cause of an indestructible union with God, the source of all happiness (p. 67). Moreover, the human Christ could not be a Savior by His power unless the divine nature were joined to Him in the unity of His person, from which, as from the Father at the same time, the Holy Spirit proceeds, who leads us into possession of Christ, engrafts us into Christ, and regenerates us unto eternal life (1 Cor. 15:21, 45; Rom. 8:8–9). Indeed, so that those who have once truly been engrafted into Christ by the Holy Spirit can never again be cut off from eternal life, the λογον Himself — the eternal Son of God, consubstantial with the Father, namely, the very fountain of life, in which there was life from the beginning (John 1[:4]) — must dwell σωματκως, that is, personally, in His assumed human nature for all eternity (p.72). Our entering into covenant and reconciliation with God required that both of these natures in the Mediator be true and intact, with their properties preserved. In the same way, since the covenant and union must last for all eternity, so that even after the resurrection our true flesh and bones might enjoy happiness (Phil. 3[:21]), it is also necessary in the foundation, namely, in the Mediator, upon whom the task of saving us forever was placed, that tremaintact forever — body and soul, flesh and bones. (p. 73) Vivification, therefore, is the second fruit of the resurrection of Christ because Christ Himself, who is always living, is our life through faith, and because, by the power that we draw from Christ our Head, we arise in this life to newness of life through the Spirit of faith. This is so that by living pure and holy lives, we might wholly consecrate ourselves to the will of God. That is what the apostle teaches in Colossians 3[:1–2]: “If then you were raised with Christ, seek those things which are above, where Christ is, sitting at the right hand of God. Set your mind on things above, not on things on the earth.” That is also why he says in Romans 6[:4–5] that we were engrafted into the likeness of Christ’s death so that, as participants in His resurrection, we might walk in newness of life. With these words he is not only offering the resurrection of Christ as an example for us to imitate; he is also, and especially, teaching that this is brought about in us by the power of Christ’s resurrection so that we are able to rise again to a new life (p. 97) Third, the ascension is the progression and continuation of His righteousness. This is primarily because He could not ascend into heaven, into that great glory, in His own body accursed in our sins, unless He had been fully justified for our sins and faith (Heb. 1:7) (p. 104). The second fruit is that by His ascension Christ makes us to sit with Him in heavenly places (Eph. 2[:6]), so that we do not simply anticipate heaven in mere hope but already possess it in Christ our Head and Brother. This is because after full expiation for our sins had been made, the Pledge, in the earthly and bodily form that He received from us, now possesses heaven on our behalf. It is also because we possess a spiritual and heavenly pledge received, in turn, from Him, namely, the Spirit of Christ dwelling in us. So we are engrafted into Him by the power of the Holy Spirit through faith in the promise of the gospel (p. 105). His operations are many and diverse. First, He is given so that He might bear witness in our hearts to the love of the Father (Gal. 4[:6]) and illumine the eyes of our minds with the knowledge of Christ. Thus, He engrafts me into Christ through faith, as a branch into the vine, and makes me a partaker of Christ and all His benefits (John 15[:1ff.]). The union with Christ and His benefits that the Holy Spirit brings about in us is powerfully expressed in Scripture when it says that the Holy Spirit sprinkles us with the blood of Christ (1 Peter 1[:2]), makes us “members of Christ” (1 Cor. 6[:15]), feeds us with Christ (John 6[:50–58]), gives us Christ to drink (1 Cor. 10[:4, 16]; 12),1 and builds us on Christ (Eph. 2[:20]). Here the office and purpose of the Holy Spirit given to us is shown, namely, that through faith the Spirit might unite us to Christ as closely as possible and might achieve similar results in both members and Head, seeing as it is the same Spirit, the same life and glory (Rom. 8[:1–26]) (p. 124). The communion of saints signifies first that outward fellowship by which members of the visible church are called into one body of people through the ministry of the teaching of the prophets and apostles, and through the sacraments. It also signifies that inward union by which those whom the Lord has forever chosen to be a part of this visible assembly, that is, those who truly believe, are united by the same Spirit with the Father, His Son Jesus Christ, and with each other (p. 131-132) I believe that whatever is and is called sin — whether it be original sin the form of that transgression in Adam’s loins and the consequent corruption that I carry around in the flesh, or actual sin the form of the wicked thoughts, words, and deeds that arise out of original sin — I believe, I say, that through faith, by which I am and remain engrafted into Christ, all of that is forgiven me by the gracious goodness of God. God does this in such a way that He erases all memory of both guilt and punishment, just as if I had never sinned or had no sin. Therefore, I trust that already now I am blessed (p. 133-134). For those of us who are truly engrafted into Christ through faith begin to possess—in addition to that benefit of forgiveness with which the image of Satan is covthe restoration of the image of God… (p. 134-35)”

— Caspar Olevianus, An Exposition of the Apostles’ Creed, trans. Lyle Bierma, Classic Reformed Theology, vol. 2, ed. R. Scott Clark (Grand Rapids: Reformation Heritage Books, 2009).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSince%2C+then%2C+in+the+Articles+of+the+Faith%2C+which+contain+a+summary+of+the+gospel%2C+Christ+the+King+Himself+offers+to+us+that+kingdom+of+His%3B+and+since+He+effectually+confederates+us+to+Himself+through+faith+by+the+power+of+His+Spirit+so+that+He+might+rule+in+us%2C+let+us+briefly+explain+what+faith+is.+Once+we+know+the+will+of+God%2C+faith+is+to+assent+to+Him+in+the+whole+of+His+Word+as+one+who+is+true+and+omnipotent.+It+is+thus+to+give+Him+glory+and+not+to+give+consideration+to+anything+in+ourselves+or+other+creatures+that+appears+contrary+to+His+Word.+The+primary+goal+of+faith+is+to+look+in+this+Word+at+the+promise+of+the+gospel%2C+the+promise+that+the+Father+truly+presents+Himself+to+us+in+Christ+and+through+the+Holy+Spirit+graciously+justifies+those+engrafted+into+Christ%2C+sanctifies+us+more+and+more%2C+and+preserves+us+by+that+same+power+by+which+Christ+was+raised+from+the+dead+and+had+all+things+subjected+to+Him.+This+is+so+that+the+hope+of+eternal+life+that+is+grounded+in+this+truth+and+power+might+be+most+certain+%28p.+16+This+article+concerning+Christ%E2%80%99s+person+%E2%80%94+which+consists+of+two+natures%2C+human+and+divine%2C+joined+together+in+an+eternal+personal+union+while+the+properties+of+each+nature+are+preserved+forever+%E2%80%94+contains+the+foundation+and+basis+of+the+royal+priesthood+of+Christ%2C+and+consequently+of+the+eternal+covenant+between+God+and+humanity.+Human+happiness+is+to+be+united+with+God%2C+the+source+of+all+good+%281+John+1%5B%3A3%5D%29.+By+contrast%2C+the+greatest+unhappiness+is+to+be+separated+from+God.+Humanity%2C+however%2C+had+separated+itself+from+God+through+sin+and+had+entered+into+a+covenant+with+the+devil.+In+the+same+way%2C+therefore%2C+that+there+was+a+certain+person+through+whom+sin+entered+the+world%2C+and+death+through+sin%2C+and+who+thus+became+the+cause+and%2C+as+it+were%2C+foundation+of+the+defection+from+God+and+of+the+covenant+with+the+devil%2C+so+also+there+ought+to+be+a+certain+person+designated+by+God+as+the+foundation+and+cause+of+an+indestructible+union+with+God%2C+the+source+of+all+happiness+%28p.+67%29.+Moreover%2C+the+human+Christ+could+not+be+a+Savior+by+His+power+unless+the+divine+nature+were+joined+to+Him+in+the+unity+of+His+person%2C+from+which%2C+as+from+the+Father+at+the+same+time%2C+the+Holy+Spirit+proceeds%2C+who+leads+us+into+possession+of+Christ%2C+engrafts+us+into+Christ%2C+and+regenerates+us+unto+eternal+life+%281+Cor.+15%3A21%2C+45%3B+Rom.+8%3A8%E2%80%939%29.+Indeed%2C+so+that+those+who+have+once+truly+been+engrafted+into+Christ+by+the+Holy+Spirit+can+never+again+be+cut+off+from+eternal+life%2C+the+%CE%BB%CE%BF%CE%B3%CE%BF%CE%BD+Himself+%E2%80%94+the+eternal+Son+of+God%2C+consubstantial+with+the+Father%2C+namely%2C+the+very+fountain+of+life%2C+in+which+there+was+life+from+the+beginning+%28John+1%5B%3A4%5D%29+%E2%80%94+must+dwell+%CF%83%CF%89%CE%BC%CE%B1%CF%84%CE%BA%CF%89%CF%82%2C+that+is%2C+personally%2C+in+His+assumed+human+nature+for+all+eternity+%28p.72%29.+Our+entering+into+covenant+and+reconciliation+with+God+required+that+both+of+these+natures+in+the+Mediator+be+true+and+intact%2C+with+their+properties+preserved.+In+the+same+way%2C+since+the+covenant+and+union+must+last+for+all+eternity%2C+so+that+even+after+the+resurrection+our+true+flesh+and+bones+might+enjoy+happiness+%28Phil.+3%5B%3A21%5D%29%2C+it+is+also+necessary+in+the+foundation%2C+namely%2C+in+the+Mediator%2C+upon+whom+the+task+of+saving+us+forever+was+placed%2C+that+tremaintact+forever+%E2%80%94+body+and+soul%2C+flesh+and+bones.+%28p.+73%29+Vivification%2C+therefore%2C+is+the+second+fruit+of+the+resurrection+of+Christ+because+Christ+Himself%2C+who+is+always+living%2C+is+our+life+through+faith%2C+and+because%2C+by+the+power+that+we+draw+from+Christ+our+Head%2C+we+arise+in+this+life+to+newness+of+life+through+the+Spirit+of+faith.+This+is+so+that+by+living+pure+and+holy+lives%2C+we+might+wholly+consecrate+ourselves+to+the+will+of+God.+That+is+what+the+apostle+teaches+in+Colossians+3%5B%3A1%E2%80%932%5D%3A+%E2%80%9CIf+then+you+were+raised+with+Christ%2C+seek+those+things+which+are+above%2C+where+Christ+is%2C+sitting+at+the+right+hand+of+God.+Set+your+mind+on+things+above%2C+not+on+things+on+the+earth.%E2%80%9D+That+is+also+why+he+says+in+Romans+6%5B%3A4%E2%80%935%5D+that+we+were+engrafted+into+the+likeness+of+Christ%E2%80%99s+death+so+that%2C+as+participants+in+His+resurrection%2C+we+might+walk+in+newness+of+life.+With+these+words+he+is+not+only+offering+the+resurrection+of+Christ+as+an+example+for+us+to+imitate%3B+he+is+also%2C+and+especially%2C+teaching+that+this+is+brought+about+in+us+by+the+power+of+Christ%E2%80%99s+resurrection+so+that+we+are+able+to+rise+again+to+a+new+life+%28p.+97%29+Third%2C+the+ascension+is+the+progression+and+continuation+of+His+righteousness.+This+is+primarily+because+He+could+not+ascend+into+heaven%2C+into+that+great+glory%2C+in+His+own+body+accursed+in+our+sins%2C+unless+He+had+been+fully+justified+for+our+sins+and+faith+%28Heb.+1%3A7%29+%28p.+104%29.+The+second+fruit+is+that+by+His+ascension+Christ+makes+us+to+sit+with+Him+in+heavenly+places+%28Eph.+2%5B%3A6%5D%29%2C+so+that+we+do+not+simply+anticipate+heaven+in+mere+hope+but+already+possess+it+in+Christ+our+Head+and+Brother.+This+is+because+after+full+expiation+for+our+sins+had+been+made%2C+the+Pledge%2C+in+the+earthly+and+bodily+form+that+He+received+from+us%2C+now+possesses+heaven+on+our+behalf.+It+is+also+because+we+possess+a+spiritual+and+heavenly+pledge+received%2C+in+turn%2C+from+Him%2C+namely%2C+the+Spirit+of+Christ+dwelling+in+us.+So+we+are+engrafted+into+Him+by+the+power+of+the+Holy+Spirit+through+faith+in+the+promise+of+the+gospel+%28p.+105%29.+His+operations+are+many+and+diverse.+First%2C+He+is+given+so+that+He+might+bear+witness+in+our+hearts+to+the+love+of+the+Father+%28Gal.+4%5B%3A6%5D%29+and+illumine+the+eyes+of+our+minds+with+the+knowledge+of+Christ.+Thus%2C+He+engrafts+me+into+Christ+through+faith%2C+as+a+branch+into+the+vine%2C+and+makes+me+a+partaker+of+Christ+and+all+His+benefits+%28John+15%5B%3A1ff.%5D%29.+The+union+with+Christ+and+His+benefits+that+the+Holy+Spirit+brings+about+in+us+is+powerfully+expressed+in+Scripture+when+it+says+that+the+Holy+Spirit+sprinkles+us+with+the+blood+of+Christ+%281+Peter+1%5B%3A2%5D%29%2C+makes+us+%E2%80%9Cmembers+of+Christ%E2%80%9D+%281+Cor.+6%5B%3A15%5D%29%2C+feeds+us+with+Christ+%28John+6%5B%3A50%E2%80%9358%5D%29%2C+gives+us+Christ+to+drink+%281+Cor.+10%5B%3A4%2C+16%5D%3B+12%29%2C1+and+builds+us+on+Christ+%28Eph.+2%5B%3A20%5D%29.+Here+the+office+and+purpose+of+the+Holy+Spirit+given+to+us+is+shown%2C+namely%2C+that+through+faith+the+Spirit+might+unite+us+to+Christ+as+closely+as+possible+and+might+achieve+similar+results+in+both+members+and+Head%2C+seeing+as+it+is+the+same+Spirit%2C+the+same+life+and+glory+%28Rom.+8%5B%3A1%E2%80%9326%5D%29+%28p.+124%29.+The+communion+of+saints+signifies+first+that+outward+fellowship+by+which+members+of+the+visible+church+are+called+into+one+body+of+people+through+the+ministry+of+the+teaching+of+the+prophets+and+apostles%2C+and+through+the+sacraments.+It+also+signifies+that+inward+union+by+which+those+whom+the+Lord+has+forever+chosen+to+be+a+part+of+this+visible+assembly%2C+that+is%2C+those+who+truly+believe%2C+are+united+by+the+same+Spirit+with+the+Father%2C+His+Son+Jesus+Christ%2C+and+with+each+other+%28p.+131-132%29+I+believe+that+whatever+is+and+is+called+sin+%E2%80%94+whether+it+be+original+sin+the+form+of+that+transgression+in+Adam%E2%80%99s+loins+and+the+consequent+corruption+that+I+carry+around+in+the+flesh%2C+or+actual+sin+the+form+of+the+wicked+thoughts%2C+words%2C+and+deeds+that+arise+out+of+original+sin+%E2%80%94+I+believe%2C+I+say%2C+that+through+faith%2C+by+which+I+am+and+remain+engrafted+into+Christ%2C+all+of+that+is+forgiven+me+by+the+gracious+goodness+of+God.+God+does+this+in+such+a+way+that+He+erases+all+memory+of+both+guilt+and+punishment%2C+just+as+if+I+had+never+sinned+or+had+no+sin.+Therefore%2C+I+trust+that+already+now+I+am+blessed+%28p.+133-134%29.+For+those+of+us+who+are+truly+engrafted+into+Christ+through+faith+begin+to+possess%E2%80%94in+addition+to+that+benefit+of+forgiveness+with+which+the+image+of+Satan+is+covthe+restoration+of+the+image+of+God%E2%80%A6+%28p.+134-35%29%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+An+Exposition+of+the+Apostles%E2%80%99+Creed%2C+trans.+Lyle+Bierma%2C+Classic+Reformed+Theology%2C+vol.+2%2C+ed.+R.+Scott+Clark+%28Grand+Rapids%3A+Reformation+Heritage+Books%2C+2009%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcec190dc7a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cec190dc7a.html">Permalink</a><a class="src" href="https://heidelblog.net/2010/05/union-with-christ-in-caspar-olevianus-exposition-of-the-apostles-creed/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>For the hearers of the law,” etc. This anticipates an objection which the Jews might have adduced. As they had heard that the law was the rule of righteousness, (Deuteronomy 4:1) they gloried in the mere knowledge of it: to obviate this mistake, he declares that the hearing of the law or any knowledge of it is of no such consequence, that any one should on that account lay claim to righteousness, but that works must be produced, according to this saying, “He who will do these shall live in them.” The import then of this verse is the following, — “That if righteousness be sought from the law, the law must be fulfilled; for the righteousness of the law consists in the perfection of works.” They who pervert this passage for the purpose of building up justification by works, deserve most fully to be laughed at even by children. It is therefore improper and beyond what is needful, to introduce here a long discussion on the subject, with the view of exposing so futile a sophistry: for the Apostle only urges here on the Jews what he had mentioned, the decision of the law, — That by the law they could not be justified, except they fulfilled the law, that if they transgressed it, a curse was instantly pronounced on them. Now we do not deny but that perfect righteousness is prescribed in the law: but as all are convicted of transgression, we say that another righteousness must be sought. Still more, we can prove from this passage that no one is justified by works; for if they alone are justified by the law who fulfill the law, it follows that no one is justified; for no one can be found who can boast of having fulfilled the law.</p></blockquote>

<blockquote><p>It avails not, indeed, a little to increase our confidence, that we are united to the Son of God by a bond so close, that we can find in our nature that holiness of which we are in want; for he not only as God sanctifies us, but there is also the power of sanctifying in his human nature; not that it has it from itself, but that God had poured upon it a perfect fulness of holiness, so that from it we may all draw. And to this point this sentence refers, “For their sakes I sanctify myself.” (John 17:19.) If, then, we are sinful and unclean, we have not to go far to seek a remedy; for it is offered to us in our own flesh. If any one prefers to regard as intended here that spiritual unity which the godly have with the Son of God, and which differs much from that which men commonly have among themselves, I offer no objection, though I am disposed to follow what is more commonly received, as it is not inconsistent with reason</p></blockquote>

</figure><figure class="quote" id="q-b4ca5cc1fe" data-kw="">
<blockquote><p>A twofold trial can be entered into by God with man: either by the law (inasmuch as he is viewed as guilty of violating the law by sin and thus comes under the accusation and condemnation of the law); or by the gospel (inasmuch as he is accused by Satan of having violated the gospel covenant and so is supposed to be an unbeliever and impenitent or a hypocrite, who has not testified by works the faith he has professed with his mouth). Now to this twofold trial a twofold justification ought to answer; not in the Romish sense, but in a very different sense. The first is that by which man is absolved from the guilt of sin on account of the righteousness of Christ imputed to us and apprehended by faith; the other is that by which he is freed from the charge of unbelief and hypocrisy and declared to be a true believer and child of God; one who has fulfilled the gospel covenant (if not perfectly as to degree, still sincerely as to parts) and answered to the divine call by the exercise of faith and piety. The first is justification properly so called; the other is only a declaration of it. That is justification of cause a priori; this is justification of sign or of effect a posteriori, declaratively. In that, faith alone can have a place because it alone apprehends the righteousness of Christ, by whose merit we are freed from the condemnation of the law; in this, works also are required as the effects and signs of faith, by which its truth and sincerity are declared against the accusation of unbelief and hypocrisy. For as faith justifies a person, so works justify faith.</p></blockquote>

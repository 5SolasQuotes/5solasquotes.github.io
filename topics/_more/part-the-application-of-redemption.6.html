<figure class="quote" id="q-ee76f0e995" data-kw="">
<blockquote><p>Now take both Laws, the Ceremonial Law and the Moral Law or the Decalog. Imagine that by the merit of congruity you have made so much progress that the Spirit has been granted to you and that you have love. Of course, all this would be a monstrosity and cannot be found anywhere in the nature of things. But imagine, I say, that, by doing what lies within you, you acquire grace, are righteous, and have the Spirit. On what basis? On the basis of the merit of congruity? Then you do not need Christ, but He has become useless to you and died to no purpose.</p></blockquote>

<blockquote><p>I. As in the chain of salvation justification follows calling (Rom. 8:30) and is everywhere set forth as the primary effect of faith, the topic concerning calling and faith begets the topic concerning justification. This must be handled with the greater care and accuracy as this saving doctrine is of the greatest importance in religion. It is called by Luther “the article of a standing and a falling church” (Articulus stantis, et cadentis Ecclesiae).1 By other Christians, it is termed the characteristic and basis of Christianity—not without reason—the principal rampart of the Christian religion. This being adulterated or subverted, it is impossible to retain purity of doctrine in other places. Hence Satan in every way has endeavored to corrupt this doctrine in all ages, as has been done especially in the papacy. For this reason, it is deservedly placed among the primary causes of our secession from the Roman church and of the Reformation. 1 Luther said things like this but in this form, the saying has been traced to the Reformed theologian J. H. Alsted (1618).</p></blockquote>

ine · Heidelblog</a></div>
</figure><figure class="quote" id="q-510febd34b" data-kw="">
<blockquote><p>Now Faith.” Faith in the word of God is specially of three sorts: historical, miraculous, [and] justifying or saving faith. First, historical faith is not only a knowledge of the word, but an assent of the heart to the truth of it. And this faith is general not only to all men, good and bad, but even to the devils themselves: “Thou believest there is one God, thou doest well: the devils also believe it, and tremble” (James 2:19), Now he that will believe out of the Scripture there is one God, he will believe historically anything in the Scriptures. Second, miraculous, or the faith of miracles, which is an inward persuasion of the heart wrought by some special instinct of the Holy Ghost in some man, whereby he is truly persuaded that God will use him as His instrument for the working of some miracles. This is also general, both to elect and reprobate. Judas had it with the rest of the apostles. Thirdly, (commonly called justifying) faith, which is a special persuasion wrought by the Holy Ghost in the heart of the those that are effectually called concerning their reconciliation and salvation by Christ. Of these three sorts sof faith, the third is principally meant in this place….</p></blockquote>

/perkins-on-faith-in-hebrews-11/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-324aa28444" data-kw="">
<blockquote><p>Sanctification is a work of the triune God, but is ascribed more particularly to the Holy Spirit in Scripture, Rom. 8:11; 15:16; 1 Pet. 1:2. It is particularly important in our day, with its emphasis on the necessity of approaching the study of theology anthropologically and its one-sided call to service in the kingdom of God, to stress the fact that God, and not man, is the author of sanctification. Especially in view of the Activism that is such a characteristic feature of American religious life, and which glorifies the work of man rather than the grace of God, it is necessary to stress the fact over and over again that sanctification is the fruit of justification, that the former is simply impossible without the latter, and that both are the fruits of the grace of God in the redemption of sinners. Though man is privileged to co-operate with the Spirit of God, he can do this only in virtue of the strength which the Spirit imparts to him from day to day. The spiritual development of man is not a human achievement, but a work of divine grace. Man deserves no credit whatsoever for that which he contributes to it instrumentally. In so far as sanctification takes place in the subconscious life, it is effected by the immediate operation of the Holy Spirit. But as a work in the conscious life of believers it is wrought, by several means, which the Holy Spirit employs.</p></blockquote>

t="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-e7fac7e276" data-kw="">
<blockquote><p>Take note, therefore, of a new righteousness and a new definition of righteousness. For one usually says: “Righteousness is the virtue that renders to everyone his due.” Here it is stated that righteousness is faith in Jesus Christ or the virtue by which one believes in Jesus Christ, as in Rom. 10:10: “With the heart man believes unto righteousness”; that is, if anyone wants to be righteous, it is necessary for him to believe in Christ with his heart. And in the third chapter St. Jerome says: “Well put is that true statement of a wise man that the believer does not live as the result of righteousness but is righteous by faith.” A beautiful statement indeed! It follows now that the man who is righteous through faith does not through himself give to anyone what is his; he does this through Another, namely, Jesus Christ, who alone is so righteous as to render to all what should be rendered them. As a matter of fact, they owe everything to Him. But he who believes in Christ and by the spirit of faith has become one with Him not only renders satisfaction now to all but also brings it about that they owe everything to him, since he has all things in common with Christ. His sins are no longer his; they are Christ’s. But in Christ sins are unable to overcome righteousness. In fact, they themselves are overcome. Hence they are destroyed in him. Again, Christ’s righteousness now belongs not only to Christ; it belongs to His Christian. Therefore the Christian cannot owe anything to anyone or be oppressed by his sins, since he is supported by such great righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 27: Lectures on Galatians, 1535, Chapters 5-6; 1519, Chapters 1-6, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 27 (Saint Louis: Concordia Publishing House, 1999), 240–41.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Take note, therefore, of a new righteousness and a new definition of righteousness. For one usually says: “Righteousness is the virtue that renders to everyone his due.” Here it is stated that righteousness is faith in Jesus Christ or the virtue by which one believes in Jesus Christ, as in Rom. 10:10: “With the heart man believes unto righteousness”; that is, if anyone wants to be righteous, it is necessary for him to believe in Christ with his heart. And in the third chapter St. Jerome says: “Well put is that true statement of a wise man that the believer does not live as the result of righteousness but is righteous by faith.” A beautiful statement indeed! It follows now that the man who is righteous through faith does not through himself give to anyone what is his; he does this through Another, namely, Jesus Christ, who alone is so righteous as to render to all what should be rendered them. As a matter of fact, they owe everything to Him. But he who believes in Christ and by the spirit of faith has become one with Him not only renders satisfaction now to all but also brings it about that they owe everything to him, since he has all things in common with Christ. His sins are no longer his; they are Christ’s. But in Christ sins are unable to overcome righteousness. In fact, they themselves are overcome. Hence they are destroyed in him. Again, Christ’s righteousness now belongs not only to Christ; it belongs to His Christian. Therefore the Christian cannot owe anything to anyone or be oppressed by his sins, since he is supported by such great righteousness.”

— Martin Luther, Luther’s Works, Vol. 27: Lectures on Galatians, 1535, Chapters 5-6; 1519, Chapters 1-6, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 27 (Saint Louis: Concordia Publishing House, 1999), 240–41.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTake+note%2C+therefore%2C+of+a+new+righteousness+and+a+new+definition+of+righteousness.+For+one+usually+says%3A+%E2%80%9CRighteousness+is+the+virtue+that+renders+to+everyone+his+due.%E2%80%9D+Here+it+is+stated+that+righteousness+is+faith+in+Jesus+Christ+or+the+virtue+by+which+one+believes+in+Jesus+Christ%2C+as+in+Rom.+10%3A10%3A+%E2%80%9CWith+the+heart+man+believes+unto+righteousness%E2%80%9D%3B+that+is%2C+if+anyone+wants+to+be+righteous%2C+it+is+necessary+for+him+to+believe+in+Christ+with+his+heart.+And+in+the+third+chapter+St.+Jerome+says%3A+%E2%80%9CWell+put+is+that+true+statement+of+a+wise+man+that+the+believer+does+not+live+as+the+result+of+righteousness+but+is+righteous+by+faith.%E2%80%9D+A+beautiful+statement+indeed%21+It+follows+now+that+the+man+who+is+righteous+through+faith+does+not+through+himself+give+to+anyone+what+is+his%3B+he+does+this+through+Another%2C+namely%2C+Jesus+Christ%2C+who+alone+is+so+righteous+as+to+render+to+all+what+should+be+rendered+them.+As+a+matter+of+fact%2C+they+owe+everything+to+Him.+But+he+who+believes+in+Christ+and+by+the+spirit+of+faith+has+become+one+with+Him+not+only+renders+satisfaction+now+to+all+but+also+brings+it+about+that+they+owe+everything+to+him%2C+since+he+has+all+things+in+common+with+Christ.+His+sins+are+no+longer+his%3B+they+are+Christ%E2%80%99s.+But+in+Christ+sins+are+unable+to+overcome+righteousness.+In+fact%2C+they+themselves+are+overcome.+Hence+they+are+destroyed+in+him.+Again%2C+Christ%E2%80%99s+righteousness+now+belongs+not+only+to+Christ%3B+it+belongs+to+His+Christian.+Therefore+the+Christian+cannot+owe+anything+to+anyone+or+be+oppressed+by+his+sins%2C+since+he+is+supported+by+such+great+righteousn <blockquote><p>1. The first thing to know is that there are no good works except those works God has commanded, just as there is no sin except that which God has forbidden. Therefore, whoever wants to know what good works are as well as doing them needs to know nothing more than God’s commandments. Thus in Matthew 19[:17] Christ says, “If you would enter life, keep the commandments.” And when the young man in Matthew 19[:16–22] asks what he should do to inherit eternal life, Christ sets before him nothing else but the Ten Commandments. Accordingly, we have to learn to recognize good works from the commandments of God, and not from the appearance, size, or number of the works themselves, nor from the opinion of men or of human law or custom, as we see has happened and still happens because of our blindness and disregard of the divine commandments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann (Philadelphia: Fortress Press, 1999), 44.23.</span></figcaption>

<blockquote><p>Ver. 5. “For Moses,” he says, “describeth the righteousness which is of the Law.” What he means is this. Moses showeth us the righteousness ensuing from the Law, what sort it is of, and whence. What sort is it then of, and what does it consist in? In fulfilling the commandments. “He (R. T. the man), that doeth these things,” He says, “shall live by (or in), them.” (Lev. 18:5.) And there is no other way of becoming righteous in the Law save by fulfilling the whole of it. But this has not been possible for any one, and therefore this righteousness has failed them. (διαπέπτωκεν). But tell us, Paul, of the other righteousness also, that which is of grace. What is that then, and of what does it consist? Hear the words in which he gives a clear sketch of it. For after he had refuted the other, he next goes on to this, and says, Ver. 6, 7, 8, 9. “But the righteousness which is of faith speaketh on this wise, Say not in thine heart, Who shall ascend into heaven (that is, to bring Christ down from above): or, Who shall descend into the deep? (that is, to bring up Christ again from the dead.) But what saith it? The word is nigh thee, even in thy mouth, and in thy heart, that is, the word of faith which we preach. That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised Him from the dead, thou shalt be saved. To prevent the Jews then from saying, How came they who had not found the lesser righteousness to find the greater? he gives a reason there was no answering, that this way was easier than that. For that requires the fulfilment of all things (for when thou doest all, then thou shalt live); but the righteousness which is of faith doth not say this, but what? “If thou confess with thy mouth the Lord Jesus, and believe in thy heart that God hath raised Him from the dead, thou shalt be saved.” Then again that we may not seem to be making it contemptible by showing it to be easy and cheap, observe how he expands his account of it. For he does not come immediately to the words just given, but what does he say? “But the righteousness which is of faith saith on this wise; Say not in thine heart, Who shall go up into heaven? (that is, to bring Christ down); or, Who shall descend into the deep? (that is, to bring up Christ again from the dead.”) For as to the virtue manifested in works there is opposed a listlessness, which relaxeth our labors,3 and it requireth a very wakeful soul not to yield to it: thus, when one is required to believe, there are reasonings which confuse and make havoc of the minds of most men, and it wants a soul of some vigor to shake them thoroughly off. And this is just why he brings the same before one. And as he did in Abraham’s case, so he does here also. For having there shown that he was justified by faith, lest he should seem to have gotten so great a crown by a mere chance, as if it were a thing of no account, to extol the nature of faith, he says, “Who against hope believed in hope, that he might become the father of many nations. And being not weak in faith, he considered his own body now dead, and the deadness of Sarah’s womb. He staggered not at the promise of God through unbelief; but was strong in faith, giving glory to God; and being fully persuaded that what He had promised He was able also to perform” (Rom. 4:18–21): so he showed that there is need of vigor, and a lofty soul, that takes in things beyond expectation, and stumbles not at appearances. This then he does here also, and shows that it requires a wise mind, and a spirit heavenly (Gr. heaven-reaching) and great. And he does not say merely, “Say not,” but, “Say not in thine heart,” that is, do not so much as think of doubting and saying with thyself, And how can this be? You see that this is a chief characteristic of faith, to leave all the consequences of this lower world, and so to seek for that which is above nature, and to cast out the feebleness of calculation, and so to accept everything from the Power of God. The Jews, however, did not merely assert this, but that it was not possible to be justified by faith. But himself turns even what had taken place to another account, that having shown the thing to be so great, that even after it had taken place it required faith, he might seem with good reason to bestow a crown on these: and he uses the words which are found in the Old Testament, being always at pains to keep quite clear of the charges of love of novelties, and of opposition to it. For this, which he here says of faith, Moses says to them of the commandment, so showing that they had enjoyed at God’s hand a great benefit. For there is no need to say, he means, that one must go up to heaven, or cross a great sea, and then receive the commandments, but things so great and grand hath God made of easy access to us. And what meaneth the phrase, “The Word is nigh thee?” That is, It is easy. For in thy mind and in thy tongue is thy salvation. There is no long journey to go, no seas to sail over, no mountains to pass, to get saved. But if you be not minded to cross so much as the threshold, you may even while you sit at home be saved. For “in thy mouth and in thy heart” is the source of salvation. And then on another score also he makes the word of faith easy, and says, that “God raised Him from the dead.” For just reflect upon the worthiness of the Worker, and you will no longer see any difficulty in the thing. That He is Lord then, is plain from the resurrection. And this he said at the beginning even of the Epistle. “Which was declared to be the Son of God with power … by the resurrection from the dead.” (Rom. 1:4.) But that the resurrection is easy too, has been shown even to those who are very unbelieving, from the might of the Worker of it. Since then the righteousness is greater, and light and easy to receive, is it not a sign of the utmost contentiousness to leave what is light and easy, and set about impossibilities? For they could not say that it was a thing they declined as burdensome. See then how he deprives them of all excuse. For what do they deserve to have said in their defence, who choose what is burdensome and impracticable, and pass by what is light, and able to save them, and to give them those things which the Law could not give? All this can come only from a contentious spirit, which is in a state of rebellion against God. For the Law is galling (ἐπαχθὴς), but grace is easy. The Law, though they dispute never so much, does not save; Grace yieldeth the righteousness resulting from itself, and that from the Law likewise. What plea then is to rescue them, since they are disposed to be contentious against this, but cling to that to no purpose whatever? Then, since he had made a strong assertion, he again confirms it from the Scripture.</p></blockquote>

+the+lesser+righteousness+to+find+the+greater%3F+he+gives+a+reason+there+was+no+answering%2C+that+this+way+was+easier+than+that.+For+that+requires+the+fulfilment+of+all+things+%28for+when+thou+doest+all%2C+then+thou+shalt+live%29%3B+but+the+righteousness+which+is+of+faith+doth+not+say+this%2C+but+what%3F+%E2%80%9CIf+thou+confess+with+thy+mouth+the+Lord+Jesus%2C+and+believe+in+thy+heart+that+God+hath+raised+Him+from+the+dead%2C+thou+shalt+be+saved.%E2%80%9D+Then+again+that+we+may+not+seem+to+be+making+it+contemptible+by+showing+it+to+be+easy+and+cheap%2C+observe+how+he+expands+his+account+of+it.+For+he+does+not+come+immediately+to+the+words+just+given%2C+but+what+does+he+say%3F+%E2%80%9CBut+the+righteousness+which+is+of+faith+saith+on+this+wise%3B+Say+not+in+thine+heart%2C+Who+shall+go+up+into+heaven%3F+%28that+is%2C+to+bring+Christ+down%29%3B+or%2C+Who+shall+descend+into+the+deep%3F+%28that+is%2C+to+bring+up+Christ+again+from+the+dead.%E2%80%9D%29+For+as+to+the+virtue+manifested+in+works+there+is+opposed+a+listlessness%2C+which+relaxeth+our+labors%2C3+and+it+requireth+a+very+wakeful+soul+not+to+yield+to+it%3A+thus%2C+when+one+is+required+to+believe%2C+there+are+reasonings+which+confuse+and+make+havoc+of+the+minds+of+most+men%2C+and+it+wants+a+soul+of+some+vigor+to+shake+them+thoroughly+off.+And+this+is+just+why+he+brings+the+same+before+one.+And+as+he+did+in+Abraham%E2%80%99s+case%2C+so+he+does+here+also.+For+having+there+shown+that+he+was+justified+by+faith%2C+lest+he+should+seem+to+have+gotten+so+great+a+crown+by+a+mere+chance%2C+as+if+it+were+a+thing+of+no+account%2C+to+extol+the+nature+of+faith%2C+he+says%2C+%E2%80%9CWho+against+hope+believed+in+hope%2C+that+he+might+become+the+father+of+many+nations.+And+being+not+weak+in+faith%2C+he+considered+his+own+body+now+dead%2C+and+the+deadness+of+Sarah%E2%80%99s+womb.+He+staggered+not+at+the+promise+of+God+through+unbelief%3B+but+was+strong+in+faith%2C+giving+glory+to+God%3B+and+being+fully+persuaded+that+what+He+had+promised+He+was+able+also+to+perform%E2%80%9D+%28Rom.+4%3A18%E2%80%9321%29%3A+so+he+showed+that+there+is+need+of+vigor%2C+and+a+lofty+soul%2C+that+takes+in+things+beyond+expectation%2C+and+stumbles+not+at+appearances.+This+then+he+does+here+also%2C+and+shows+that+it+requires+a+wise+mind%2C+and+a+spirit+heavenly+%28Gr.+heaven-reaching%29+and+great.+And+he+does+not+say+merely%2C+%E2%80%9CSay+not%2C%E2%80%9D+but%2C+%E2%80%9CSay+not+in+thine+heart%2C%E2%80%9D+that+is%2C+do+not+so+much+as+think+of+doubting+and+saying+with+thyself%2C+And+how+can+this+be%3F+You+see+that+this+is+a+chief+characteristic+of+faith%2C+to+leave+all+the+consequences+of+this+lower+world%2C+and+so+to+seek+for+that+which+is+above+nature%2C+and+to+cast+out+the+feebleness+of+calculation%2C+and+so+to+accept+everything+from+the+Power+of+God.+The+Jews%2C+however%2C+did+not+merely+assert+this%2C+but+that+it+was+not+possible+to+be+justified+by+faith.+But+himself+turns+even+what+had+taken+place+to+another+account%2C+that+having+shown+the+thing+to+be+so+great%2C+that+even+after+it+had+taken+place+it+required+faith%2C+he+might+seem+with+good+reason+to+bestow+a+crown+on+these%3A+and+he+uses+the+words+which+are+found+in+the+Old+Testament%2C+being+always+at+pains+to+keep+quite+clear+of+the+charges+of+love+of+novelties%2C+and+of+opposition+to+it.+For+this%2C+which+he+here+says+of+faith%2C+Moses+says+to+them+of+the+commandment%2C+so+showing+that+they+had+enjoyed+at+God%E2%80%99s+hand+a+great+benefit.+For+there+is+no+need+to+say%2C+he+means%2C+that+one+must+go+up+to+heaven%2C+or+cross+a+great+sea%2C+and+then+receive+the+commandments%2C+but+things+so+great+and+grand+hath+God+made+of+easy+access+to+us.+And+what+meaneth+the+phrase%2C+%E2%80%9CThe+Word+is+nigh+thee%3F%E2%80%9D+That+is%2C+It+is+easy.+For+in+thy+mind+and+in+thy+tongue+is+thy+salvation.+There+is+no+long+journey+to+go%2C+no+seas+to+sail+over%2C+no+mountains+to+pass%2C+to+get+saved.+But+if+you+be+not+minded+to+cross+so+much+as+the+threshold%2C+you+may+even+while+you+sit+at+home+be+saved.+For+%E2%80%9Cin+thy+mouth+and+in+thy+heart%E2%80%9D+is+the+source+of+salvation.+And+then+on+another+score+also+he+makes+the+word+of+faith+easy%2C+and+says%2C+that+%E2%80%9CGod+raised+Him+from+the+dead.%E2%80%9D+For+just+reflect+upon+the+worthiness+of+the+Worker%2C+and+you+will+no+longer+see+any+difficulty+in+the+thing.+That+He+is+Lord+then%2C+is+plain+from+the+resurrection.+And+this+he+said+at+the+beginning+even+of+the+Epistle.+%E2%80%9CWhich+was+declared+to+be+the+Son+of+God+with+power+%E2%80%A6+by+the+resurrection+from+the+dead.%E2%80%9D+%28Rom.+1%3A4.%29+But+that+the+resurrection+is+easy+too%2C+has+been+shown+even+to+those+who+are+very+unbelieving%2C+from+the+might+of+the+Worker+of+it.+Since+then+the+righteousness+is+greater%2C+and+light+and+easy+to+receive%2C+is+it+not+a+sign+of+the+utmost+contentiousness+to+leave+what+is+light+and+easy%2C+and+set+about+impossibilities%3F+For+they+could+not+say+that+it+was+a+thing+they+declined+as+burdensome.+See+then+how+he+deprives+them+of+all+excuse.+For+what+do+they+deserve+to+have+said+in+their+defence%2C+who+choose+what+is+burdensome+and+impracticable%2C+and+pass+by+what+is+light%2C+and+able+to+save+them%2C+and+to+give+them+those+things+which+the+Law+could+not+give%3F+All+this+can+come+only+from+a+contentious+spirit%2C+which+is+in+a+state+of+rebellion+against+God.+For+the+Law+is+galling+%28%E1%BC%90%CF%80%CE%B1%CF%87%CE%B8%E1%BD%B4%CF%82%29%2C+but+grace+is+easy.+The+Law%2C+though+they+dispute+never+so+much%2C+does+not+save%3B+Grace+yieldeth+the+righteousness+resulting+from+itself%2C+and+that+from+the+Law+likewise.+What+plea+then+is+to+rescue+them%2C+since+they+are+disposed+to+be+contentious+against+this%2C+but+cling+to+that+to+no+purpose+whatever%3F+Then%2C+since+he+had+made+a+strong+assertion%2C+he+again+confirms+it+from+the+Scripture.%E2%80%9D%0A%0A%E2%80%94+John+Chrysostom%2C+%E2%80%9CHomilies+of+St.+John+Chrysostom%2C+Archbishop+of+Constantinople%2C+on+the+Epistle+of+St.+Paul+to+the+Romans%2C%E2%80%9D+in+Saint+Chrysostom%2C+ed.+Philip+Schaff%2C+trans.+J.+B.+Morris%2C+W.+H.+Simcox%2C+and+George+B.+Stevens%2C+vol.+11%2C+A+Select+Library+o&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fecd40ba603.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ecd40ba603.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/09/chrysostom-leviticus-185-is-law-and-impossible-for-us-sinners/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>3. In the promises. The law promises life to those who are righteous in themselves, or on the condition of righteousness, and perfect obedience. “He that doeth them, shall live in them.” “If thou wilt enter into life, keep the commandments.” (Lev. 18:5. Matt. 19:17.) The gospel, on the other hand, promises life to those who are justified by faith in Christ, or on the condition of the righteousness of Christ, applied unto us by faith. The law and gospel are, however, not opposed to each other in these respects: for although the law requires us to keep the commandments if we would enter into life, yet it does not exclude us from life if another perform these things for us. It does indeed propose a way of satisfaction, which is through ourselves, but it does not forbid the other, as has been shown.</p></blockquote>

<blockquote><p>LEV. 18:5. Ye shall therefore keep my statutes. Although Moses introduces this passage, where he exhorts the Israelites to cultivate chastity in respect to marriage, and not to fall into the incestuous pollutions of the Gentiles, yet, as it is a remarkable one, and contains general instruction, from whence Paul derives his definition of the righteousness of the Law, (Rom. 10:5,) it seems to me to come in very appropriately here, inasmuch as it sanctions and confirms the Law by the promise of reward. The hope of eternal life is, therefore, given to all who keep the Law; for those who expound the passage as referring to this earthly and transitory life are mistaken.1 The cause of this error was, because they feared that thus the righteousness of faith might be subverted, and salvation grounded on the merit of works. But Scripture does not therefore deny that men are justified by works, because the Law itself is imperfect, or does not give instructions for perfect righteousness; but because the promise is made of none effect by our corruption and sin. Paul, therefore, as I have just said, when he teaches that righteousness is to be sought for in the grace of Christ by faith, (Rom. 10:4,) proves his statement by this argument, that none is justified who has not fulfilled what the Law commands. Elsewhere also he reasons by contrast, where he contends that the Law does not accord with faith as regards the cause of justification, because the Law requires works for the attainment of salvation, whilst faith directs us to Christ, that we may be delivered from the curse of the Law. Foolishly, then, do some reject as an absurdity the statement, that if a man fulfils the Law he attains to righteousness; for the defect does not arise from the doctrine of the Law, but from the infirmity of men, as is plain from another testimony given by Paul. (Rom. 8:3.) We must observe, however, that salvation is not to be expected from the Law unless its precepts be in every respect complied with; for life is not promised to one who shall have done this thing, or that thing, but, by the plural word, full obedience is required of us. The pratings of the Popish theologians about partial righteousness are frivolous and silly, since God embraces at once all the commandments; and who is there that can boast of having thoroughly fulfilled them? If, then, none was ever clear of transgression, or ever will be, although God by no means deceives us, yet the promise becomes ineffectual, because we do not perform our part of the agreement.</p></blockquote>

en%2C+do+some+reject+as+an+absurdity+the+statement%2C+that+if+a+man+fulfils+the+Law+he+attains+to+righteousness%3B+for+the+defect+does+not+arise+from+the+doctrine+of+the+Law%2C+but+from+the+infirmity+of+men%2C+as+is+plain+from+another+testimony+given+by+Paul.+%28Rom.+8%3A3.%29+We+must+observe%2C+however%2C+that+salvation+is+not+to+be+expected+from+the+Law+unless+its+precepts+be+in+every+respect+complied+with%3B+for+life+is+not+promised+to+one+who+shall+have+done+this+thing%2C+or+that+thing%2C+but%2C+by+the+plural+word%2C+full+obedience+is+required+of+us.+The+pratings+of+the+Popish+theologians+about+partial+righteousness+are+frivolous+and+silly%2C+since+God+embraces+at+once+all+the+commandments%3B+and+who+is+there+that+can+boast+of+having+thoroughly+fulfilled+them%3F+If%2C+then%2C+none+was+ever+clear+of+transgression%2C+or+ever+will+be%2C+although+God+by+no+means+deceives+us%2C+yet+the+promise+becomes+ineffectual%2C+because+we+do+not+perform+our+part+of+the+agreement.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Four+Last+Books+of+Moses+%28Harmony%29%2C+Commentaries+on+the+Four+Last+Books+of+Moses+Arranged+in+the+Form+of+a+Harmony%2C+trans.+Charles+William+Bingham+%28repr.+Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2010%29%2C+3.203%E2%80%9305.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2bd704484e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2bd704484e.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/09/calvin-on-leviticus-185-a-general-statement-of-the-law-that-offers-reward-to-those-who-obey-perfectly/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-63888d76cf" data-kw="">
<blockquote><p>Whether good or bad. That is, whether he did good or evil. Each person will receive according to his deeds, whether good or bad. It is from passages such as this that some American theologians have inferred that the only benefit the believer receives from Christ is the forgiveness of sin, and that being pardoned he is dealt with according to the principles of justice. Others, especially in Germany, have drawn from the same source the conclusion that the doctrine of Paul is that the merit of Christ cleanses only from the sins committed before conversion. If a Jew or Gentile became a Christian, his sins were blotted out, and then he was rewarded or punished, saved or lost, according to his works. The merit of Christ did not bring pardon for sin committed after conversion. This is very much the ancient doctrine that there is no forgiveness for post-baptismal sins. The benefits of Christ’s work, according to many of the ancients, are conveyed to the soul in baptism, but if once forfeited by sin can never be reapplied. This gloomy doctrine, which belonged to the transition period that preceded the full development of theology of the papal church, has been revived by the Roman Catholics of the present day. But according to the Scriptures, the blood of Jesus Christ cleanses from all sin, whether committed before or after baptism or conversion. It is a fountain to which we may come every day for cleansing. He is a priest who lives forever to make intercession for us and who always presents before God the merit of his sacrifice as a perpetual offering, typified by the morning and evening sacrifice under the law. According to the anti-scriptural views mentioned above, when a person first comes to Christ his sins are forgiven, and he then begins afresh under the covenant of works and stands in the same relationship to God as Adam did before the fall. The condition of salvation is to him as it was to our first parent: “Do this and live.” Christ is of no use to him from now on. See Romans 6:14. But in truth, because of the one offering of Christ, by which those who believe are sanctified forever (that is, they are atoned for), God does not impute the penitent believer’s sins to him and condemn him. He is not judged by the law or treated according to its principles, for then no one could be saved. But he is treated as someone for all whose sins—past, present, and future—an infinite satisfaction has been made and who has a perpetual claim to that satisfaction as long as he is united to Christ by faith and the indwelling of his Spirit.</p></blockquote>

</figure><figure class="quote" id="q-fcc316f7a2" data-kw="">
<blockquote><p>And what is the reason for denying that sanctification is a mystery, i.e., the content of a dogma? The supposition that it is of human origin, that man is not totally unable, and that sanctification is betterment of character and life. Hence it is tantamount to (1) a lowering of holiness to the human standpoint; (2) an opposing sanctification as a work of God. And this is a very serious matter. We should again become clearly conscious of the fact that the holiness without which no man shall see God is not attained by the departing from some evil and the habitual doing of some good. The demand of sanctification belongs to the Covenant of Works; sanctification itself to the Covenant of Grace. This makes the difference very obvious. Not as tho the Covenant of Works commanded man to sanctify himself; given to holy men, it excluded sanctification. But God gave the Covenant of Grace to unholy men. And the only connection between the demand for sanctification and the Covenant of Works is, that the latter ever pursues fallen man with this demand, and with the terror of Horeb. Unholiness destroys the foundation of the Covenant of Works and renders compliance with its conditions impossible. Hence the absolute contradiction between it and the sinner’s personal life. The one must make room for the other; they can not stand together. In this painful conflict we are often tempted to ask whether God is not unjust in His law to demand of us the impossible, and to lay the blame on Him; for did He not make us so? And from this difficulty the Arminian in our own heart seeks to escape, either by denying that there ever was a Covenant of Works, or by substituting the fulfilment of the law for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/abraham-kuyper.html">Abraham Kuyper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Work of the Holy Spirit</cite>, (New York; London: Funk &amp; Wagnalls, 1900), 438–39</span></figcaption>

<blockquote><p>The Protestant doctrine affirms that a sinner is made or constituted righteous by having Christ’s righteousness imputed to him; and that, being thus justified actually, he is also justified declaratively, when his acceptance is proved or attested, so as to be made manifest to his own conscience, or to his fellow-men. In both cases it is one and the same Justification that is spoken of,—his acceptance as righteous in the sight of God; but, in the one, it is considered simply as a fact, in the other, as a fact that is attested and proved. Actual Justification comes first, and is necessarily presupposed in that which is declarative; and hence, if any one is declared to have been justified, we conclude that he was actually justified, or accepted as righteous in the sight of God. …And on that solemn occasion, just as in the case of the woman that was a sinner, the acquittal and acceptance of the believer will not only be authoritatively declared by the sentence of the Judge, but that sentence will refer to the fruits of his faith, and especially to his love to Christ, as manifested by love to His afflicted people: ‘Inasmuch as ye did it to one of these my brethren, ye did it unto me.’ Justification, considered as the pardon of a sinner and his acceptance as righteous in the sight of God, is by faith; but judgment is according to works; and it is not a second Justification,—as if there might be two—the one by faith, the other by works—it is one and the same Justification, which is actually bestowed in the present life, and authoritatively declared and attested at the judgment-seat. …From the age of Augustine downwards, the most various and conflicting interpretations have been proposed. Recourse has been had to each of the principal terms in succession,—Justification,—Faith,—Works,—with the view of finding, in one or other of them, a means of harmonizing the teaching of the two Apostles. Some have founded their theory on the first of these terms, and have contended for a first and second, or an initial and final, Justification,—not in the sense of the one being actual, and the other declarative merely,—but in the sense of both being actual, while the one is by faith, and the other by works. Others have founded on the second term, and have attempted to show that, if every believer is actually justified in the present life, it can only be because faith is considered as the germ of personal holiness, and as comprehensive of all the other graces, and acts of new obedience, which spring from it. Others still have founded on the third term, and have endeavoured to show, that the works which are excluded from the ground of our Justification, are—either mere ceremonial observances such as were enjoined in that part of the Mosaic law which is now abolished,—or moral duties such as the heathen practised, which were done in the unaided strength of nature, without grace, and before faith in Christ,—or perfect obedience to the divine law, such as no man in his own strength can possibly accomplish, but not that sincere, though imperfect, obedience which every Christian is enabled by the grace of the Spirit to render to its requirements. …Paul, in his Epistles to the Romans and Galatians, treats at great length, and with much earnestness, the question of a sinner’s actual Justification, or acceptance in the sight of God. He states the conclusion of his whole argument, when he says, ‘Therefore by the deeds of the law shall no flesh be justified in His sight: for by the law is the knowledge of sin;’ and again, ‘Therefore we conclude that a man is justified by faith, without the deeds of the law.’ …So that man’s righteousness arising from his works of obedience to the divine Law, is excluded from the ground of his Justification on two distinct grounds,—first, on the ground of God’s Law, which convicts and condemns every sinner;—and secondly, on the ground of God’s method of redeeming mercy, which brings in another righteousness altogether,—the righteousness of Him who ‘became obedient unto death, even the death of the Cross.’ It is manifest from the whole course of his argument, that Paul’s design was to explain the method and ground, and even, to some extent, the rationale, of the actual justification of a sinner in the sight of God,—to show how, and why, he may be forgiven and accepted as righteous,—and to set forth this as the immediate privilege of every believer, as soon as he renounces all confidence in his own righteousness, and submits ‘to the righteousness of God.’ …It is equally clear, that the Apostle James, while he refers incidentally, or by necessary implication, to the actual justification of sinners in the sight of God, is not engaged in expounding either the nature, or grounds, of that great Gospel privilege, but rather in illustrating the declarative justification of believers, or the practical evidence by which their actual justification is attested and proved. He refers to the same justification of a sinner in the sight of God, which is more fully expounded by Paul; for he speaks, like Paul, of the justification of Abraham, which was evidently, in the first instance, that of a sinner before God; and for this reason, it is a defective statement to say that he speaks only of justification before men. But actual justification is necessarily presupposed in that which is declarative; for the latter is the mere evidence, manifestation, or proof the former; and the Apostle proves the actual justification of Abraham, first, from the testimony of God Himself, as it is recorded in Scripture, ‘which saith, Abraham believed in God, and it was imputed unto him for righteousness: and he was called the Friend of God;’ and secondly, from the practical fruits or manifestations of his faith in works of holy obedience: ‘For was not Abraham our father justified by works, when he had offered Isaac his son upon the altar?’</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Protestant doctrine affirms that a sinner is made or constituted righteous by having Christ’s righteousness imputed to him; and that, being thus justified actually, he is also justified declaratively, when his acceptance is proved or attested, so as to be made manifest to his own conscience, or to his fellow-men. In both cases it is one and the same Justification that is spoken of,—his acceptance as righteous in the sight of God; but, in the one, it is considered simply as a fact, in the other, as a fact that is attested and proved. Actual Justification comes first, and is necessarily presupposed in that which is declarative; and hence, if any one is declared to have been justified, we conclude that he was actually justified, or accepted as righteous in the sight of God. …And on that solemn occasion, just as in the case of the woman that was a sinner, the acquittal and acceptance of the believer will not only be authoritatively declared by the sentence of the Judge, but that sentence will refer to the fruits of his faith, and especially to his love to Christ, as manifested by love to His afflicted people: ‘Inasmuch as ye did it to one of these my brethren, ye did it unto me.’ Justification, considered as the pardon of a sinner and his acceptance as righteous in the sight of God, is by faith; but judgment is according to works; and it is not a second Justification,—as if there might be two—the one by faith, the other by works—it is one and the same Justification, which is actually bestowed in the present life, and authoritatively declared and attested at the judgment-seat. …From the age of Augustine downwards, the most various and conflicting interpretations have been proposed. Recourse has been had to each of the principal terms in succession,—Justification,—Faith,—Works,—with the view of finding, in one or other of them, a means of harmonizing the teaching of the two Apostles. Some have founded their theory on the first of these terms, and have contended for a first and second, or an initial and final, Justification,—not in the sense of the one being actual, and the other declarative merely,—but in the sense of both being actual, while the one is by faith, and the other by works. Others have founded on the second term, and have attempted to show that, if every believer is actually justified in the present life, it can only be because faith is considered as the germ of personal holiness, and as comprehensive of all the other graces, and acts of new obedience, which spring from it. Others still have founded on the third term, and have endeavoured to show, that the works which are excluded from the ground of our Justification, are—either mere ceremonial observances such as were enjoined in that part of the Mosaic law which is now abolished,—or moral duties such as the heathen practised, which were done in the unaided strength of nature, without grace, and before faith in Christ,—or perfect obedience to the divine law, such as no man in his own strength can possibly accomplish, but not that sincere, though imperfect, obedience which every Christian is enabled by the grace of the Spirit to render to its requirements. …Paul, in his Epistles to the Romans and Galatians, treats at great length, and with much earnestness, the question of a sinner’s actual Justification, or acceptance in the sight of God. He states the conclusion of his whole argument, when he says, ‘Therefore by the deeds of the law shall no flesh be justified in His sight: for by the law is the knowledge of sin;’ and again, ‘Therefore we conclude that a man is justified by faith, without the deeds of the law.’ …So that man’s righteousness arising from his works of obedience to the divine Law, is excluded from the ground of his Justification on two distinct grounds,—first, on the ground of God’s Law, which convicts and condemns every sinner;—and secondly, on the ground of God’s method of redeeming mercy, which brings in another righteousness altogether,—the righteousness of Him who ‘became obedient unto death, even the death of the Cross.’ It is manifest from the whole course of his argument, that Paul’s design was to explain the method and ground, and even, to some extent, the rationale, of the actual justification of a sinner in the sight of God,—to show how, and why, he may be forgiven and accepted as righteous,—and to set forth this as the immediate privilege of every believer, as soon as he renounces all confidence in his own righteousness, and submits ‘to the righteousness of God.’ …It is equally clear, that the Apostle James, while he refers incidentally, or by necessary implication, to the actual justification of sinners in the sight of God, is not engaged in expounding either the nature, or grounds, of that great Gospel privilege, but rather in illustrating the declarative justification of believers, or the practical evidence by which their actual justification is attested and proved. He refers to the same justification of a sinner in the sight of God, which is more fully expounded by Paul; for he speaks, like Paul, of the justification of Abraham, which was evidently, in the first instance, that of a sinner before God; and for this reason, it is a defective statement to say that he speaks only of justification before men. But actual justification is necessarily presupposed in that which is declarative; for the latter is the mere evidence, manifestation, or proof the former; and the Apostle proves the actual justification of Abraham, first, from the testimony of God Himself, as it is recorded in Scripture, ‘which saith, Abraham believed in God, and it was imputed unto him for righteousness: and he was called the Friend of God;’ and secondly, from the practical fruits or manifestations of his faith in works of holy obedience: ‘For was not Abraham our father justified by works, when he had offered Isaac his son upon the altar?’”

<blockquote><p>‘Who hath anointed us, and sealed us.’ Anointing and sealing go together. The same God anoints us doth also seal us. Both are to secure us of our happy condition. Now Christ is the first sealed: John 6:27, ‘Him hath the father sealed.’ God hath set Christ apart from others, hath distinguished him, and set a stamp upon him to be the Messiah by the graces of the Spirit, whereof he was richly beautified, and by many miracles, whereby he shewed that he was the Son of God; by his resurrection from the dead, by his calling of the Gentiles, and many other things. Christ being sealed himself, he sealed all that he did for our redemption with his blood, and hath added for the strengthening of our faith outward seals, the sacraments, to secure his love more firmly to us. But in this place another manner of sealing is to be understood. For here is not meant the sealing of Christ, but the sealing of us that have communion with him. The same Spirit that seals the Redeemer seals the redeemed. Quest. What is the manner of our sealing by the Spirit? Ans. (1.) Sealing we know hath divers uses. First of all, it doth imprint a likeness of him that doth seal. When the king’s image is stamped upon the wax, everything in the wax answers to that in the seal, face to face, eye to eye, body to body. So we are said to be sealed when we carry in our souls the image of the Lord Jesus; for the Spirit sets the stamp of Christ upon every true convert. There is the likeness of Christ in all things to be found in him. As the child answers the father, foot for foot, finger for finger in proportion, but not in quantity, so it is in the sealing of a believer. There is a likeness in the soul that is sealed by the Spirit to the Lord Jesus. There is understanding of the same heavenly supernatural truths; there is a judging of things as Christ judgeth, a loving of that which he loves, and a hating of that which he hates; a rejoicing to do that which he delights in, and a grief to commit anything that displeaseth his majesty. Every affection of the soul is carried that way that the affections of our blessed Saviour are carried, in proportion; everything in the soul is answerable to him in its degree. There is no grace in Christ, but there is the like in every Christian in some measure. The obedience of Christ to his Father, even to the death, is to be found in every true Christian. The humility whereby Christ abased himself, it is in every renewed heart. Christ works in the soul that receives him a conformity to himself. The soul that believes that Christ hath loved him, and done such great things for him, is ambitious to express Christ in all his ways. Being once in Christ, we shall delight to be transformed more and more unto him. To bear the image of the ‘second Adam’ upon our breasts, to make it appear that Jesus Christ lives in us, and that we ‘live not to ourselves, but to him that died for us,’ 2 Cor. 5:15; to be meek and heavenly-minded as he was, talking and discoursing of spiritual things, going about doing good everywhere; active for God, fruitful in holiness, doing and receiving all the good we are able, drawing others from this world to meditate of a better estate, labouring for the advancement of God’s kingdom, and approving ourselves to him. This is one use of sealing, to imprint a likeness. (2.) A second use of the seal is distinction. Sealing is a stamp upon one thing among many. It distinguisheth Christians from others, as we shall see after. (3.) Again, it serves for appropriation. Men seal those things that are their own. Merchants, we see, set their stamp on those wares which they have or mean to have a right unto. It pleaseth God thus to condescend unto us, by applying himself to human contracts. He appropriates his own to shew that he hath chosen and singled them out for himself to delight in. (4.) Sealing further serves to make things authentical, to give authority and excellency. The seal of the prince is the authority of the prince. This gives validity to things, answerable to the dignity and esteem of him that seals. These are the four principal uses of sealing; and God by his Spirit doth all these to his. He stamps his own image upon us; he distinguisheth us from others, even from the great refuse of the world. God by his Spirit appropriates us to himself; he makes us to be his, and shews that we are his. He likewise authoriseth us, and puts an excellency upon us, to secure us against all temptations. When we have God’s seal on us, we stand firm in the greatest trial. ‘Who shall separate us from the love of God?’ Rom. 8:35. We dare defy all objections of Satan, and accusations of conscience whatsoever. A man that hath God’s seal stands impregnable in the most tempestuous season; for it is given for our assurance, and not for God’s. The Lord knows who are his. He seals not because he is ignorant, but for our comfort and establishment.</p></blockquote>

<blockquote><p>[The Galatians] joined the works of the law with Christ and his grace in the cause of their justification and salvation. Here it must be observed that they which make a union of grace and works in the cause of justification are separated from the grace of God. Grace admits no partner or fellow. Grace must be freely given every way, or it is no way grace.</p></blockquote>

<blockquote><p>XXVII. The grace of God and the merit of Christ are not opposed, but subordinated because they are viewed here in different respects (kat’ allo kai allo): grace in respect of us, both in the giving of the surety and in the acceptance of his satisfaction for our justification; but merit in respect of God’s justice, which could not leave sin unpunished (which the apostle asserts are in the highest degree consistent with each other, Rom. 3:24, 25). XXVIII. Although the remission of God and of men are similar in various points as to the thing (and most especially in the sincere and genuine pardon offenses), it does not follow that they are exactly similar. Men are private persons to whom the right of punishment does not necessarily belong, but God is a Judge whose prerogative it is to punish sinners. XXIX. If God promises remission of sins in the new covenant, this does not deny but supposes the satisfaction of Christ because it is promised in the name of Christ (Acts 10:43), i.e., through his virtue and merit. Nor is there any remission without the shedding of blood (haimatekchysia, Heb. 9:22). And if the elders are said to have obtained pardon by faith (Heb. 11), Christ is necessarily included (whom faith regards as its proper object); indeed inasmuch as he was crucified who ought to lay down his life as a sacrifice for sin (Is. 53:10) and to be made a sin offering (2 Cor. 5:21) and a curse (katara, Gal. 3:13). For other matters bearing upon this point, see Volume I, Topic III, Question 19; and Disputation 1 and 2, on the Necessity of Satisfaction (De Satisfactionis Christi Necessitate, in Opera [1848], 4:385–435).</p></blockquote>

<blockquote><p>XV. Although we acknowledge the necessity of good works against the Epicureans, we do not on this account confound the law and the gospel and interfere with gratuitous justification by faith alone. Good works are required not for living according to the law, but because we live by the gospel; not as the causes on account of which life is given to us, but as effects which testify that life has been given to us.</p></blockquote>

<blockquote><p>45. Without a doubt, He has spoken this comforting word also for the fainthearted, who, though they are godly and prepared for the Last Day, are yet filled with great anxiety and [thus] hinder their desire for this coming, which is especially found at the end of the world; therefore, He calls it their redemption. For at the end of the world, when sin will so terribly hold sway, and along with sin the second part (the punishment for sin with pestilence, war, and famine) will also hold sway, it is necessary that believers have a strong confidence and comfort against both afflictions: sin and its punishment. Therefore, He uses the sweet word “redemption,” which all hearts gladly hear. What is redemption? Who would not gladly be redeemed? Who would desire to remain such a desert, both of sin and of punishment? Who would not wish an end to such misery, such danger for souls, such ruin for man—especially when Christ so sweetly allures, invites, and comforts us?

46. The godless preachers of dreams [cf. Jer. 23:25–28] should be censured; in their sermons they hide these words of Christ from the hearts of people and turn faith away from them, who want to make people godly by terrifying them, and who afterward prepare [people] for this day with their own good works and satisfaction for their sins. Here despair, fear, and terror must remain and grow—and with it, hatred, aversion, and abhorrence for the coming of the Lord—and enmity against God must be established in the heart. Meanwhile, they teach people to picture Christ as nothing but a stern judge whom they are to appease and expiate by their works, and never regard [Him] as the Redeemer, as He calls and offers Himself, of whom we are to expect in firm faith that out of pure grace He will redeem us from sin and all evil.

47. See, this is the way it always happens. When people do not preach the Gospel correctly, and only pursue hearts with commands and threats, they only drive them farther from God and only make them angry at God. They ought to terrify, but only the obstinate and hardened; but afterward, when people have become fearful and fainthearted, they are to strengthen and comfort them again.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“45. Without a doubt, He has spoken this comforting word also for the fainthearted, who, though they are godly and prepared for the Last Day, are yet filled with great anxiety and [thus] hinder their desire for this coming, which is especially found at the end of the world; therefore, He calls it their redemption. For at the end of the world, when sin will so terribly hold sway, and along with sin the second part (the punishment for sin with pestilence, war, and famine) will also hold sway, it is necessary that believers have a strong confidence and comfort against both afflictions: sin and its punishment. Therefore, He uses the sweet word “redemption,” which all hearts gladly hear. What is redemption? Who would not gladly be redeemed? Who would desire to remain such a desert, both of sin and of punishment? Who would not wish an end to such misery, such danger for souls, such ruin for man—especially when Christ so sweetly allures, invites, and comforts us?

46. The godless preachers of dreams [cf. Jer. 23:25–28] should be censured; in their sermons they hide these words of Christ from the hearts of people and turn faith away from them, who want to make people godly by terrifying them, and who afterward prepare [people] for this day with their own good works and satisfaction for their sins. Here despair, fear, and terror must remain and grow—and with it, hatred, aversion, and abhorrence for the coming of the Lord—and enmity against God must be established in the heart. Meanwhile, they teach people to picture Christ as nothing but a stern judge whom they are to appease and expiate by their works, and never regard [Him] as the Redeemer, as He calls and offers Himself, of whom we are to expect in firm faith that out of pure grace He will redeem us from sin and all evil.

47. See, this is the way it always happens. When people do not preach the Gospel correctly, and only pursue hearts with commands and threats, they only drive them farther from God and only make them angry at God. They ought to terrify, but only the obstinate and hardened; but afterward, when people have become fearful and fainthearted, they are to strengthen and comfort them again.”

— Martin Luther, “Gospel for the Second Sunday in Advent,” in Luther’s Works: Church Postil I, ed. Benjamin T. G. Mayes, James L. Langebartels, and Christopher Boyd Brown, vol. 75 (Saint Louis, MO: Concordia Publishing House, 2013), 105–06.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C45.+Without+a+doubt%2C+He+has+spoken+this+comforting+word+also+for+the+fainthearted%2C+who%2C+though+they+are+godly+and+prepared+for+the+Last+Day%2C+are+yet+filled+with+great+anxiety+and+%5Bthus%5D+hinder+their+desire+for+this+coming%2C+which+is+especially+found+at+the+end+of+the+world%3B+therefore%2C+He+calls+it+their+redemption.+For+at+the+end+of+the+world%2C+when+sin+will+so+terribly+hold+sway%2C+and+along+with+sin+the+second+part+%28the+punishment+for+sin+with+pestilence%2C+war%2C+and+famine%29+will+also+hold+sway%2C+it+is+necessary+that+believers+have+a+strong+confidence+and+comfort+against+both+afflictions%3A+sin+and+its+punishment.+Therefore%2C+He+uses+the+sweet+word+%E2%80%9Credemption%2C%E2%80%9D+which+all+hearts+gladly+hear.+What+is+redemption%3F+Who+would+not+gladly+be+redeemed%3F+Who+would+desire+to+remain+such+a+desert%2C+both+of+sin+and+of+punishment%3F+Who+would+not+wish+an+end+to+such+misery%2C+such+danger+for+souls%2C+such+ruin+for+man%E2%80%94especially+when+Christ+so+sweetly+allures%2C+invites%2C+and+comforts+us%3F+46.+The+godless+preachers+of+dreams+%5Bcf.+Jer.+23%3A25%E2%80%9328%5D+should+be+censured%3B+in+their+sermons+they+hide+these+words+of+Christ+from+the+hearts+of+people+and+turn+faith+away+from+them%2C+who+want+to+make+people+godly+by+terrifying+them%2C+and+who+afterward+prepare+%5Bpeople%5D+for+this+day+with+their+own+good+works+and+satisfaction+for+their+sins.+Here+despair%2C+fear%2C+and+terror+must+remain+and+grow%E2%80%94and+with+it%2C+hatred%2C+aversion%2C+and+abhorrence+for+the+coming+of+the+Lord%E2%80%94and+enmity+against+God+must+be+established+in+the+heart.+Meanwhile%2C+they+teach+people+to+picture+Christ+as+nothing+b </figure><figure class="quote" id="q-2e4b47f56e" data-kw="">
<blockquote><p>The next thing to be considered, is the trial of the righteous, who are said to stand before Christ’s judgment-seat. Here it may be observed that no indictment shall be brought against them, at least, with the Judge’s approbation; for they were acquitted and discharged, when brought into a justified state; and as the consequence of their having been so, ‘none,’ as the apostle says, ‘shall lay any thing to their charge,’ since ‘it is God that justifieth.’ If any thing be alleged against them by the enemies of God, who loaded them with reproach, and laid many things to their charge in this world of which some have been just, and others unjust and malicious, the great and merciful Judge will appear as an advocate on their behalf, and will vindicate them from those charges which are ungrounded, and will farther allege, as a foundation of their discharge from the guilt of all others, that he has made a full atonement for them. Hence, when their sins are sought for, they shall not be found in judgment, or charged upon them to their shame, confusion, or condemnation; but they shall be pronounced righteous, as interested in Christ’s righteousness. The great Judge shall evince that they are so, by producing those graces which were wrought in them, which are inseparably connected with their justification, though not the foundation of it, that so the method of the divine proceedings may be vindicated, and it may appear that, as ‘without holiness no one shall see the Lord,’ so they are holy, and accordingly possess that internal quality which denotes them to be persons whom God designed to save. This I take to be the meaning of our Saviour’s address to the righteous, when he pronounces them ‘blessed,’ and invites them to ‘come and inherit the kingdom prepared for them from the foundation of the world; for I was an hungered, and ye gave me meat; I was thirsty, and ye gave me drink,’ &amp;c. Here the word ‘for’ is taken demonstratively, and not causally; and denotes that they were such as might expect to be admitted to this honour and blessedness, having those marks and characters of his children upon them to which the promise of salvation was annexed; not as though any thing done by them was the cause of their salvation. It hence appears that the graces of God’s people shall be published before angels and men, to the praise of the glory of him who was the author of them. But there is a difficult question proposed by some, namely, Whether shall the sins of God’s people be published in the great day; though it is certain they shall not be alleged against them to their condemnation? This is one of the secret things which belong to God, which he has not so fully or clearly revealed to us in his word; so that we can say little more about it than what is matter of conjecture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, vol. 2 (New York: Robert Carter &amp; Brothers, 1855), 277–78.</span></figcaption>

<blockquote><p>X. The making of the charge is described by the metaphor of books or records in which the actions of the person who are being judged are written down. Revelation 20:12 ‘And the books were opened.’ By the word ‘books’ is to be understood both God’s omniscience and man’s conscience. XI.The wicked will be judged in accordance with their works and on account of their works; the righteousness according to the works of faith but not on account of their works. Thus in Revelation 20:12 it is said the that another book, the book of life, was opened, so that we may know that the salvation of the righteous depends not on works but on the eternal grace of God, through which they have been entered into the book of life.</p></blockquote>

<blockquote><p>To say that our faith saves us means that we do not save ourselves even in the slightest measure. Very different would be the case if our salvation was said to be through love….</p></blockquote>

</figure><figure class="quote" id="q-ad601a4a8b" data-kw="">
<blockquote><p>Disputing in his Panstrat. vol. iii. book xv. chap. iii. against Bellarmine, [Chamier] teaches that the true and determinate difference between the law of works and that of faith, is the condition of works and of faith; that is, that the law of works proposes salvation, upon condition of performing the law. But the law of faith proposes it, upon condition only of believing in Christ. Lest, however he should leave any thing unexplained, he observes, that conditions in contracts are of two kinds; some of which may be called antecedent, others consequent. He calls these antecedent, which give rise to the contract, according to the maxim, I give, that thou mayest give, as when one sells a field for a certain sum of money. But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only: so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete. This distinction that very learned divine applies to the present purpose, in the following manner: The law of works requires the fulfilling of the law as an antecedent condition, without which, not only no man can enter upon the possession of eternal life, but cannot so much as have a right to it. But the law of faith does not admit of works as a condition p 151 in this sense, but only in the other: viz. that by virtue of the life already given through faith, works are necessary, so that he who shows no works, falls from every right which he had, or rather seemed to have, on account of his external vocation; although otherwise, works are not the causes of the life to be given. Thus far Chamier: compare Tuckney in his Theological Prelections, p. 233.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, trans. Thomas Bell (Glasgow: W. Lang, 1807), 149–51.</span></figcaption>

— Herman Witsius, Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain, trans. Thomas Bell (Glasgow: W. Lang, 1807), 149–51.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDisputing+in+his+Panstrat.+vol.+iii.+book+xv.+chap.+iii.+against+Bellarmine%2C+%5BChamier%5D+teaches+that+the+true+and+determinate+difference+between+the+law+of+works+and+that+of+faith%2C+is+the+condition+of+works+and+of+faith%3B+that+is%2C+that+the+law+of+works+proposes+salvation%2C+upon+condition+of+performing+the+law.+But+the+law+of+faith+proposes+it%2C+upon+condition+only+of+believing+in+Christ.+Lest%2C+however+he+should+leave+any+thing+unexplained%2C+he+observes%2C+that+conditions+in+contracts+are+of+two+kinds%3B+some+of+which+may+be+called+antecedent%2C+others+consequent.+He+calls+these+antecedent%2C+which+give+rise+to+the+contract%2C+according+to+the+maxim%2C+I+give%2C+that+thou+mayest+give%2C+as+when+one+sells+a+field+for+a+certain+sum+of+money.+But+the+consequent+conditions+are+added+to+the+antecedent%2C+as+following+from+them%3A+which+indeed+are+mutual+between+the+parties%2C+but+oblige+the+one+only%3A+so+that+the+other+is+bound+to+do+no+more+on+their+account%3A+As+if+one+having+given+or+sold+a+plot+of+ground%2C+should+assign+an+annuity+to+be+laid+out+upon+the+poor.+Now+conditions+of+that+kind%2C+when+not+performed%2C+usually+disannul+the+contract%3A+and+yet+they+do+not+constitute+it.+Nay%2C+there+would+be+no+annuity%2C+except+the+sale+were+already+full+and+complete.+This+distinction+that+very+learned+divine+applies+to+the+present+purpose%2C+in+the+following+manner%3A+The+law+of+works+requires+the+fulfilling+of+the+law+as+an+antecedent+condition%2C+without+which%2C+not+only+no+man+can+enter+upon+the+possession+of+eternal+life%2C+but+cannot+so+much+as+have+a+right+to+it.+But+the+law+of+faith+does+not+admit+of+works+as+a+condition+p+151+in+this+sense%2C+but+only+in+the+other%3A+viz.+that+by+virtue+of+the+life+already+given+through+fa <blockquote><p>1. That justifying faith, or that faith whereby we are justified, is our receiving of Christ as our Lord and Saviour, trusting in him and yielding obedience to him.

2. That faith, in justifying, is not to be considered as a hand whereby we lay hold on the righteousness of another, or as an instrument, as though righteousness were provided for us and tendered unto us; which would overthrow all necessity of being righteous in ourselves.

3. Nor yet doth faith, repentance, or obedience, procure our justification, or is the efficient or meritorious cause thereof.

4. But the true use of our faith (and repentance), as to our justification before God, is that they are the “causa sine qua non,” or the condition whereby, according to the appointment of God, we come to be justified; and so is imputed to us.

5. That our justification is our absolution from the guilt of sin, and freedom from obnoxiousness unto punishment for it, and nothing else. Our regeneration is the condition of our absolution, and in them both, in several respects, is our righteousness.

6. That the way whereby we come to obtain this absolution is this: Jesus Christ, the only Son of God, being sent by him to reveal his love and grace to lost, sinful mankind, in that work yielding obedience unto God even unto death, was, for a reward of that obedience, exalted, and had divine authority over them for whom he died committed to him to pardon and save them; which accordingly he doth, upon the performance of the condition of faith and obedience by him prescribed to them, at once effecting a universal conditional application of all actually justifying every individual upon the performance of the condition.

7. That as to good works, and their place in this business, Paul speaks of the perfect works of the law and legal manner of justifying, which leave no place for grace or pardon; James, of gospel works of new obedience, which leave place for both.

8. That the denial of our faith and obedience to be the condition of our justification, or the asserting that we are justified by the obedience of Christ imputed to us, is the ready way to overthrow all obedience, and drive all holiness and righteousness out of the world.

9. That, as the beginning, so the continuance of our justification depends on the condition of our faith, repentance, and obedience, which are not fruits consequent of it, but conditions antecedent to it, Socin. Thes. de Justificat. p. 18; Fragm. de Justificat. p. 113. And therefore, in the first place, we are to be solicitous about what is within us, about our sanctification, before our absolution or justification, Socin. Ep. ad Ch. MN. de Fide et Operibus.

10. As to the death of Christ, our sins were the impulsive cause of it, and it was undergone for the forgiveness of sins, and occasioned by them only, and is in some sense the condition of our forgiveness.

11. That absolution and pardon of sin are by no means the immediate effects of the death of Christ.</p></blockquote>

<blockquote><p>God requires humiliation indeed afore, because men will not believe else; and he requires obedience after, as that which necessarily follows upon faith, so as a man cannot truly believe but it will follow, as heat follows light. Yet, upon believing, the bargain is struck up; and though faith be the great instrument, yet we say withal, that works are necessary to be in the person justified, yet not to justify. Thus heat is as necessarily in the sun as light; yet it makes not day by its heat, but by its light. Works of new obedience are required as necessary to the possession of salvation, but faith is that alone which puts us into a condition of having the title and right to it, by the blood and righteousness of Christ. Obedience is necessarily required in all that are made sons, and so cry, ‘Abba, Father;’ for if he be a father, where is his honour? But it is faith alone that makes us sons, Gal. 3:26. And though we are as necessarily ordained to sanctification, as to faith and to salvation through both, 2 Thes. 2:13, by which, as the necessary way, we come and are brought to salvation as the goal, yet it is by faith alone that we are put into that estate: Eph. 2:8, 9, ‘By grace ye are saved through faith, and that not of works,’ etc. Then might some say, works are not required; yes, says the apostle, as a necessary means you are ordained to come to salvation by, which is the end of your faith, and which are a necessary condition of that estate, though faith alone puts us into it; for he adds, ver. 10, ‘We are his workmanship, created to good works, which God hath ordained we should walk in.’ They are the condition of the subject that shall be saved, who must be made meet, not the condition of the promise of salvation itself. They are the condition of faith, or of the person believing; but as sight is that which saves us in heaven, by which we have all our happiness communicated to us, so is it faith that saves us here.</p></blockquote>

<blockquote><p>Nothing within man, and nothing that man can do, either in nature, or by grace, concurreth to the act of justification before God, as any cause thereof, either efficient, material, formal, or final, but faith alone; all other gifts and graces, as hope, love, the fear of God, are necessary to salvation, as signs thereof, and consequents of faith. Nothing in any man concurres to any cause of this work but faith alone. And faith itself is no principal but only an instrumental cause whereby we receive, apprehend, and apply Christ and his righteousness for our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, (1616 edition), 572. Emphasis added.</span></figcaption>

</figure><figure class="quote" id="q-3dcf2df3aa" data-kw="">
<blockquote><p>For because Paul had taught, that a man is justified by faith without works, hence some inferred, that in whatever manner a man live, it, equally suffices, that he persuade himself that Christ is his Saviour. Which they could have inferred with no plausibility, if that had been evident which the very learned man will have to be so, viz. That Paul, by faith understood evangelical godliness. But because Paul’s words evidently bore that sense, that faith was a thing distinct from all the works of holiness, as in reality it is, hence arose the pretext of calumny. I say, of calumny: for though Paul taught, that works contribute nothing to justification, or to procure a man’s title to salvation; yet he always taught, that they were not only useful, but also necessary to salvation, and that it is impossible, that sanctification should be separated from justification. James treads in the same path, and teaches that it is necessary that he who is justified by faith, should also be justified by works: that is, perform these works which are the evidences and effects of righteousness, and by which it is demonstrated not only before men, but also before God, that he is righteous: according to that of John, “He who doeth righteousness is righteous,” 1 John 3:7. Indeed there is a double justification: one of a man sinful in himself, whereby he is absolved from sin, and declared to have a title to eternal life, on account of Christ’s righteousness apprehended by faith, which Paul inculcated: another of a man, righteous already, sanctified by the Spirit of Christ, and who is declared to be such, by his words and actions. James teaches, that this is so necessary, and so connected with the former, that he is deceived who boasts of that and is destitue of this.</p></blockquote>

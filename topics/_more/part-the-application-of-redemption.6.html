</figure><figure class="quote" id="q-f0f38d607e" data-kw="">
<blockquote><p>You see that a person is justified by works and not by faith alone.”— James 2:24 It’s not uncommon to hear some people appeal to James 2:24 in order to argue that God saves people by faith plus works. In particular, some argue against the doctrine of justification by faith alone by appealing to this verse. They tend to pit Paul, who writes that we are justified by faith and not works, against James, who apparently writes that we are justified by faith plus works. This raises the question, who is right? What are we to believe? Are Paul and James actually at odds with each other? No, they are not. What Are Paul and James Saying about Justification? Simply put, although they are using the same verb, justification (in Greek it is also the same verb, dikaioō), they are using it differently. Paul is using it in its legal declarative sense, but James is using it in an evidential sense. They are complementing each other, not opposing each other. Questions concerning Paul and James begin with Paul writing in Romans 3–5 about justification as a declarative act of God grounded in the work of Christ and received by faith. James, on the other hand, is writing about sanctification—the gracious work of God that necessarily follows from justification. James’ primary concern is that a person who has been justified will have good works that demonstrate their faith. True saving faith—the instrument of justification (e.g., Rom. 5:1; Eph. 2:8)—necessarily leads to sanctification, and sanctification is evidence of saving faith versus merely a faith that believes in mere knowledge (see James 2:19). Justification and Sanctification—Two Benefits of Salvation in Christ In order to help understand how Paul and James complement one another, there are two important terms to define: justification and sanctification. The Westminster Shorter Catechism provides good and concise definitions of each one.</p></blockquote>

<blockquote><p>6. What condition is attached to the covenant of grace? The condition attached to the covenant of grace is faith in Jesus Christ.

13. Why Should a Christian want to obey the law of God as an evidence of the truth of his faith and thankfulness to God. A Christian should want to obey the law of God as an evidence of the truth of his faith and thankfulness to God.

14. What other reason is there why a Christian should want to obey the law of God? A Christian should want to obey because that is “the way which God hath appointed to salvation.” This does not mean that obeying God’s law is any part of the ground of our salvation, but that being saved from sin unto righteousness, obedience to the law is the way that God has appointed for a saved person to walk in, and the person who is saved will want to forsake sin and follow righteousness more and more.</p></blockquote>

</figure><figure class="quote" id="q-9422a48ce2" data-kw="">
<blockquote><p>But let us leave the philosophers aside. The law itself, which contains the most perfect rule of life, could not, as we said, confer righteousness. Not that there was anything lacking in the law; Moses declared that he set before the people good and evil, life and death. But because of the corruption of our nature, the law was not enough to insure righteousness. Even as Paul taught (Rom. 8:3), the defect was in our flesh, not in the law. When the law speaks, nature drives us in the opposite direction, and our desires break out with the greater force, like untamed wild elephants, against God’s command. Thus the law works wrath rather than righteousness. The law holds all guilty, and by exposing sin takes away from men every excuse. Therefore we must seek another way to righteousness: the way which is in Christ, whom the law itself set forth as its fulfillment. The righteousness of the law said, Who does these commandments, shall live in them (Lev. 18:5). But none did them. Therefore there had to be another righteousness; one that Paul taught, from Moses himself: The word is near, in your mouth and in your heart; this is the word of faith which we preach (Rom. 10:8). It is this doctrine that justifies us—not the bare doctrine, but because it offers us the fruit of Christ’s death, by which our sins are forgiven and we are reconciled to God. For if by faith we grasp this gift, we are counted as righteous before God.</p></blockquote>

— John Calvin, Other citations (work not named), trans. Joseph Haroutunian and Louise Pettibone Smith (Philadelphia: Westminster Press, 1958), 156.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+let+us+leave+the+philosophers+aside.+The+law+itself%2C+which+contains+the+most+perfect+rule+of+life%2C+could+not%2C+as+we+said%2C+confer+righteousness.+Not+that+there+was+anything+lacking+in+the+law%3B+Moses+declared+that+he+set+before+the+people+good+and+evil%2C+life+and+death.+But+because+of+the+corruption+of+our+nature%2C+the+law+was+not+enough+to+insure+righteousness.+Even+as+Paul+taught+%28Rom.+8%3A3%29%2C+the+defect+was+in+our+flesh%2C+not+in+the+law.+When+the+law+speaks%2C+nature+drives+us+in+the+opposite+direction%2C+and+our+desires+break+out+with+the+greater+force%2C+like+untamed+wild+elephants%2C+against+God%E2%80%99s+command.+Thus+the+law+works+wrath+rather+than+righteousness.+The+law+holds+all+guilty%2C+and+by+exposing+sin+takes+away+from+men+every+excuse.+Therefore+we+must+seek+another+way+to+righteousness%3A+the+way+which+is+in+Christ%2C+whom+the+law+itself+set+forth+as+its+fulfillment.+The+righteousness+of+the+law+said%2C+Who+does+these+commandments%2C+shall+live+in+them+%28Lev.+18%3A5%29.+But+none+did+them.+Therefore+there+had+to+be+another+righteousness%3B+one+that+Paul+taught%2C+from+Moses+himself%3A+The+word+is+near%2C+in+your+mouth+and+in+your+heart%3B+this+is+the+word+of+faith+which+we+preach+%28Rom.+10%3A8%29.+It+is+this+doctrine+that+justifies+us%E2%80%94not+the+bare+doctrine%2C+but+because+it+offers+us+the+fruit+of+Christ%E2%80%99s+death%2C+by+which+our+sins+are+forgiven+and+we+are+reconciled+to+God.+For+if+by+faith+we+grasp+this+gift%2C+we+are+counted+as+righteous+before+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Other+citations+%28work+not+named%29%2C+trans.+Joseph+Haroutunian+and+Louise+Pettibone+Smith+%28Philadelphia%3A+Westminster+Press%2C+1958%29%2C+156.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9422a48ce2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9422a48ce2.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/09/calvin-leviticus-185-is-law-not-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-9ebceb1df3" data-kw="">
<blockquote><p>THE historical source from which the main streams of Perfectionist doctrine that have invaded modern Protestantism take their origin, is the teaching of John Wesley. But John Wesley did not first introduce Perfectionism into Protestantism, nor can all the Perfectionist tendencies which have shown themselves in Protestantism since his day be traced to him. Such tendencies appear constantly along the courses of two fundamental streams of thought. Wherever Mysticism intrudes, it carries a tendency to Perfectionism with it. On Mystical ground—as, for example, among the Quakers—a Perfectionism has been developed to which that taught by Wesley shows such similarity, even in details and modes of expression, that a mistaken attempt has been made to discover an immediate genetic connection between them. Wherever again men lapse into an essentially Pelagian mode of thinking concerning the endowments of human nature and the conditions of human action, a Perfectionism similar to that taught by Pelagius himself tends to repeat itself. That is to say, history verifies the correlation of Perfectionism and Libertarianism, and wherever Libertarianism rules the thoughts of men, Perfectionism persistently makes its appearance. It is to this stream of influence that Wesleyan Perfectionism owes its own origin. Its roots are set historically in the Semi-Pelagian Perfectionism of the Dutch Remonstrants, although its rise was not unaffected by influences of a very similar character and ultimate source which came to it through the channels of Anglo-Catholicism. Its particular differentiation is determined by the supernaturalization which it shares with the whole body of modifications introduced by Wesley into his fundamental Arminianism, from which Wesleyanism, in distinction from the underlying Remonstrantism, has acquired its Evangelical character.</p></blockquote>

<blockquote><p>Those attributes which God accounts his greatest riches and greatest glory, Rom. 9:23, even his mercy and free grace, which he intends most to exalt, never saw light till now; the doctrine of salvation by Christ being the stage, wherein only it is represented, and elsewhere it is not to be seen, and upon it acts the greatest part, for all passages in it tend to this, to shew, as Eph. 2:5, that ‘by grace we are saved;’ and therefore, 1 Peter 2:10, the whole work of salvation is called ‘mercy,’ all God’s ways to his people are mercy, Ps. 25:10, the whole plot and frame of it is made of mercy, and therefore the doctrine of the gospel is called grace, Titus 2:10, 11. Mercy manageth the plot, gives all other attributes, as it were, their parts to act; mercy enters in at the beginning, acts the prologue in election; and, giving Christ, continues every part of it, sets all a-work, ends the whole in glory…</p></blockquote>

<blockquote><p>[God] himself took on him the burden of our iniquities, he gave his own Son as a ransom for us, the Holy One for transgressors, the blameless one for the wicked, the righteous one for the unrighteous, the incorruptible one for the corruptible, the immortal one for them that are mortal. For what other thing was capable of covering our sins than his righteousness? By what other one was it possible that we, the wicked and ungodly, could be justified, than by the only Son of God? O sweet exchange! O unsearchable operation! O benefits surpassing all expectation! — that the wickedness of many should be hid in a single Righteous One, and that the righteousness of one should justify many transgressors!’</p></blockquote>

</figure><figure class="quote" id="q-64836131a7" data-kw="">
<blockquote><p>I do not make void the grace of God; for if righteousness is through the law, then Christ died in vain” (Galatians 2:21) “I do not make void the grace of God,” says Paul in concluding the report of his speech to Peter; “for if righteousness is through the law, then Christ died in vain.” The “for” here gives a reason for the use of the harsh word “make void”–” ‘make void,’ I say; for that is just the right word, since if Judaizers say, justification comes even in part through our obedience to the law, then Christ died in vain.” This verse is the key verse of the Epistle to the Galatians; it expresses the central thought of the Epistle. The Judiazers attempted to supplement the saving work of Christ by the merit of their own obedience to the law. “That,” says Paul, “is impossible; Christ will do everything or nothing: earn your salvation if your obedience to the law is perfect, or else trust wholly to Christ’s completed work; you cannot do both; you cannot combine merit and grace; if justification even in slightest measure, is through human merit, then Christ died in vain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on Galatians</cite>, 161.</span></figcaption>

<blockquote><p>CHAPTER 31: THE MEANS BY WHICH OBTAIN DIVINE BLESSING Let us cleave then to His blessing, and consider what are the means of possessing it. Let us think over the things which have taken place from the beginning. For what reason was our father Abraham blessed? Was it not because he wrought righteousness and truth through faith? Isaac, with perfect confidence, as if knowing what was to happen, cheerfully yielded himself as a sacrifice. Jacob, through reason of his brother, went forth with humility from his own land, and came to Laban and served him; and there was given to him the scepter of the twelve tribes of Israel. CH 32: WE ARE JUSTIFIED NOT BY OUR OWN WORKS, BUT BY FAITH Whosoever will candidly consider each particular, will recognize the greatness of the gifts which were given by him. For from him have sprung the priests and all the Levites who minister at the altar of God. From him also [was descended] our Lord Jesus Christ according to the flesh. From him [arose] kings, princes, and rulers of the race of Judah. Nor are his other tribes in small glory, inasmuch as God had promised, “Thy seed shall be as the stars of heaven.” All these, therefore, were highly honored, and made great, not for their own sake, or for their own works, or for the righteousness which they wrought, but through the operation of His will. And we, too, being called by His will in Christ Jesus, are not justified by ourselves, nor by our own wisdom, or understanding, or godliness, or works which we have wrought in holiness of heart; but by that faith through which, from the beginning, Almighty God has justified all men; to whom be glory for ever and ever. Amen.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“CHAPTER 31: THE MEANS BY WHICH OBTAIN DIVINE BLESSING Let us cleave then to His blessing, and consider what are the means of possessing it. Let us think over the things which have taken place from the beginning. For what reason was our father Abraham blessed? Was it not because he wrought righteousness and truth through faith? Isaac, with perfect confidence, as if knowing what was to happen, cheerfully yielded himself as a sacrifice. Jacob, through reason of his brother, went forth with humility from his own land, and came to Laban and served him; and there was given to him the scepter of the twelve tribes of Israel. CH 32: WE ARE JUSTIFIED NOT BY OUR OWN WORKS, BUT BY FAITH Whosoever will candidly consider each particular, will recognize the greatness of the gifts which were given by him. For from him have sprung the priests and all the Levites who minister at the altar of God. From him also [was descended] our Lord Jesus Christ according to the flesh. From him [arose] kings, princes, and rulers of the race of Judah. Nor are his other tribes in small glory, inasmuch as God had promised, “Thy seed shall be as the stars of heaven.” All these, therefore, were highly honored, and made great, not for their own sake, or for their own works, or for the righteousness which they wrought, but through the operation of His will. And we, too, being called by His will in Christ Jesus, are not justified by ourselves, nor by our own wisdom, or understanding, or godliness, or works which we have wrought in holiness of heart; but by that faith through which, from the beginning, Almighty God has justified all men; to whom be glory for ever and ever. Amen.”

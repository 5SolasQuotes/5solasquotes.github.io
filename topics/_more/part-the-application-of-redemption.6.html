<blockquote><p>The doctrine of perseverance may also be proved in an inferential way. a. From the doctrine of election. Election does not merely mean that some will be favored with certain external privileges and may be saved, if they do their duty, but that they who belong to the number of the elect shall finally be saved and can never fall short of perfect salvation. It is an election unto an end, that is, unto salvation. In working it out God endows believers with such influences of the Holy Spirit as to lead them, not only to accept Christ, but to persevere unto the end and to be saved unto the uttermost. b. From the doctrine of the covenant of redemption. In the covenant of redemption God gave His people to His Son as the reward for the latter’s obedience and suffering. This reward was fixed from eternity and was not left contingent on any uncertain faithfulness of man. God does not go back on His promise, and therefore it is impossible that they who are reckoned as being in Christ, and as forming a part of His reward, can be separated from Him (Rom. 8:38, 39), and that they who have entered the covenant as a communion of life should fall out. c. From the efficacy of the merits and intercession of Christ. In His atoning work Christ paid the price to purchase the sinner’s pardon and acceptance. His righteousness constitutes the perfect ground for the justification of the sinner, and it is impossible that one who is justified by the payment of such a perfect and efficacious price should again fall under condemnation. Moreover, Christ makes constant intercession for those who are given Him of the Father, and His intercessory prayer for His people is always efficacious, John 11:42; Heb. 7:25. d. From the mystical union with Christ. They who are united to Christ by faith become partakers of His Spirit, and thus become one body with Him, pulsating with the life of the Spirit. They share in the life of Christ, and because He lives they live also. It is impossible that they should again be removed from the body, thus frustrating the divine ideal. The union is permanent, since it originates in a permanent and unchangeable cause, the free and eternal love of God. e. From the work of the Holy Spirit in the heart. Dabney correctly says: “It is a low and unworthy estimate of the wisdom of the Holy Spirit and of His work in the heart, to suppose that He will begin the work now, and presently desert it; that the vital spark of heavenly birth is an ignis fatuus, burning for a short season, and then expiring in utter darkness; that the spiritual life communicated in the new birth, is a sort of spasmodic or galvanic vitality, giving the outward appearance of life in the dead soul, and then dying.” According to Scripture the believer is already in this life in possession of salvation and eternal life, John 3:36; 5:24; 6:54. Can we proceed on the assumption that eternal life will not be everlasting? f. From the assurance of salvation. It is quite evident from Scripture that believers can in this life attain to the assurance of salvation, Heb. 3:14; 6:11; 10:22; 2 Pet. 1:10. This would seem to be entirely out of the question, if it were possible for believers to fall from grace at any moment. It can be enjoyed only by those who stand in the firm conviction that God will perfect the work which He has begun. …The denial of the doctrine of perseverance virtually makes the salvation of man dependent on the human will rather than on the grace of God. This consideration will, of course, have no effect on those who share the Pelagian conception of salvation as autosoteric—and their numbers are great—but certainly ought to cause those to pause who glory in being saved by grace. The idea is that, after man is brought to a state of grace by the operation of the Holy Spirit alone, or by the joint operation of the Holy Spirit and the will of man, it rests solely with man to continue in faith or to forsake the faith, just as he sees fit. This renders the cause of man very precarious and makes it impossible for him to attain to the blessed assurance of faith.</p></blockquote>

<blockquote><p>The seducers that had infiltrated the Galatians and corrupted the purity of the gospel…Paul stops here, and says that if we are being forced and obliged to perform this task for God and to enter into this covenant with him, Jesus Christ will not profit us. …Why? Because they look no further than the external act…making us think that we are obliged to do it to be acceptable to God; we have entered into a covenant with him based upon doing our duty. Whoever has fulfilled his duty has made God his debtor, according to the devilish doctrines…We can only obtain grace by our merits, and the memory of our sins and iniquities can be wiped out by making our own satisfaction for sin and thereby appeasing God’s wrath. We see, therefore, that if we can obtain our own pardon, Jesus Christ is made of no value and cannot profit us at all. Why? Because Jesus Christ is not our righteousness if we do not seek remission of our sins through the sacrifice of his death. We need to be sure that God is our Father, and that we can call upon him with a peaceful conscience, having been adopted through the Lord Jesus Christ. …We need the assurance that he accepts us as his children and supports us so compassionately that he approves of what we do, though it is worthless, because of the fatherly love he bears us. If we do not have this assurance, the thought of serving God will make us grind our teeth. If, however, we are persuaded that God looks upon us favourably; if, though we are weak and can do nothing worthy of his approval, he accepts us in the name of the Lord Jesus Christ, then we will surely be filled with courage. We will be like a ship’s sail that has been stretched and filled by the breeze! Thus, our hearts will run to obey him, like a ship driven along by its sail, when we know that God delights in us and accepts our works, not wanting us to be compelled into servitude. He is happy for us to be his children, and that we desire to obey him. Knowing this, we can serve our God with all the more zeal. With his grace as our foundation, we are so filled with his joy that we can offer the sacrifice of praise. Likewise, having sought him in prayer, we can know that he will answer us and, in return, we can thank him for the priceless gifts that he communicates to us every day.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The seducers that had infiltrated the Galatians and corrupted the purity of the gospel…Paul stops here, and says that if we are being forced and obliged to perform this task for God and to enter into this covenant with him, Jesus Christ will not profit us. …Why? Because they look no further than the external act…making us think that we are obliged to do it to be acceptable to God; we have entered into a covenant with him based upon doing our duty. Whoever has fulfilled his duty has made God his debtor, according to the devilish doctrines…We can only obtain grace by our merits, and the memory of our sins and iniquities can be wiped out by making our own satisfaction for sin and thereby appeasing God’s wrath. We see, therefore, that if we can obtain our own pardon, Jesus Christ is made of no value and cannot profit us at all. Why? Because Jesus Christ is not our righteousness if we do not seek remission of our sins through the sacrifice of his death. We need to be sure that God is our Father, and that we can call upon him with a peaceful conscience, having been adopted through the Lord Jesus Christ. …We need the assurance that he accepts us as his children and supports us so compassionately that he approves of what we do, though it is worthless, because of the fatherly love he bears us. If we do not have this assurance, the thought of serving God will make us grind our teeth. If, however, we are persuaded that God looks upon us favourably; if, though we are weak and can do nothing worthy of his approval, he accepts us in the name of the Lord Jesus Christ, then we will surely be filled with courage. We will be like a ship’s sail that has been stretched and filled by the breeze! Thus, our hearts will run to obey him, like a ship driven along by its sail, when we know that God delights in us and accepts our works, not wanting us to be compelled into servitude. He is happy for us to be his children, and that we desire to obey him. Knowing this, we can serve our God with all the more zeal. With his grace as our foundation, we are so filled with his joy that we can offer the sacrifice of praise. Likewise, having sought him in prayer, we can know that he will answer us and, in return, we can thank him for the priceless gifts that he communicates to us every day.”

<blockquote><p>We certainly admit that so long as we dwell as strangers in the world there is such a thing as implicit faith; not only because many things are as yet hidden from us, but because surrounded by many clouds of errors we do not comprehend everything. The height of wisdom for the most perfect is to go forward and, quietly and humbly, to strive still further. Therefore Paul exhorts believers that, if some disagree with others in any matter, they should wait for revelation [Phil. 3:15]. Experience obviously teaches that until we put off the flesh we attain less than we should like. And in our daily reading of Scripture we come upon many obscure passages that convict us of ignorance. With this bridle God keeps us within bounds, assigning to each his “measure of faith” [Rom. 12:3] so that even the best teacher may be ready to learn.</p></blockquote>

<blockquote><p>Our predestination is not wrought in ourselves, but in secret with Him, in His foreknowledge. But we are called by the preaching of repentance. We are justified in the calling of mercy and fear of judgment. He feareth not judgment, who hath previously attained salvation. Being called, we renounce the devil by repentance, that we may not continue under his yoke: being justified, we are healed by mercy, that we may not fear judgment: being glorified, we pass into everlasting life, where we praise God without end.… The verse wherewith this Psalm concludeth is the voice of life everlasting.</p></blockquote>

<blockquote><p>I. Just as the passion of Christ it Is necessary for the expiation of sin, so his active obedience and righteousness are necessary for the gaining of eternal life. The reasons are: (1) The law binds us both to punishment and to obedience. To punishment, because it places a curse on anyone who does not perform all the words of the law (Deut 27:6). To obedience because it promises life only to those who keep it completely (Lev. 18:5: “Whosever does these things shall live by them”; Lk 10:28: “Do this and live”). The distinction between legal and evangelical righteousness does not invalidate the statement, for the gospel, in Christ, exhibits the same righteousness that the law demands. (2) This twofold satisfaction corresponds to our twofold misery; namely, the guilt of sin and damnation, and the absence of righteousness (Rom. 3:23; “All have sinned and fall short of the glory of God”). (3) Righteousness, in the true and accurate meaning of the word, consists of actual obedience (Deut. 6:25; “it will be righteousness for us, if we observe these precepts in their entirety before Jehovah”). (4) Christ fulfilled this actual obedience either for himself or in our place [nostro loco]. But it was not for himself; Therefore, it was in our place. This is evident from Christ’s relation to us. Whatever he was or did in the course of his complete obedience, he was an did in our place. [Some theologians] object to this statement on the ground that only Christ’s passive obedience contributes to satisfaction and merit. They grant that the active obedience has a place in our redemption and salvation, but only as something required [of Christ] and necessary for his work. It was required for two reasons: the law of creation, and the need for his sacrifice to be acceptable to God and for him to be a holy priest. The first element in this conception is false because at this point Christ is not to be compared to other men, life, just as the Son of God was made a creature not for his sake but for ours, So also he was subjected to the law not for his own sake but for ours. The second element in the above conception confuses holiness or innocence with obedience or actual righteousness, which differ no less than do privation [privatio] and [positive] disposition [habitus]. Innocence is indeed a necessary condition for Christ sacrifice, but actual obedience is not only a necessary condition of the Christ as priest, but also a part of his satisfaction and marriage. If the actual disobedience of Adam is a cause of meriting damnation, why is not the actual obedience of the second Adam a cause of meriting salvation? The conclusion that we reject would only be possible if we were willing to say that the first Adam is more important for our damnation than is the second for our salvation.

II. The commandment of the Father, which Christ obeyed, was both special and general. It was special with respect to its purpose, in that he obeyed not for himself but for us. It was general with respect to the object: he was subject to the same law which was prescribed for us, and in all those matters to which the law bound us. Those who teach that only the passive obedience of Christ has merit, maintained that his obedience was only to a special commandment of the Father to die for us. However, this was not a special commandment, but part of the commandment; in fact the obedience of Christ extends to all the requirements of the law. Therefore, since the law bound us to both punishment and obedience he satisfied each of its requirements.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, (1626), transl. John W. Beardslee in John W. Beardslee, Reformed Dogmatics (New York: Oxford University Press, 1965), 106–08.</span></figcaption>

place+in+our+redemption+and+salvation%2C+but+only+as+something+required+%5Bof+Christ%5D+and+necessary+for+his+work.+It+was+required+for+two+reasons%3A+the+law+of+creation%2C+and+the+need+for+his+sacrifice+to+be+acceptable+to+God+and+for+him+to+be+a+holy+priest.+The+first+element+in+this+conception+is+false+because+at+this+point+Christ+is+not+to+be+compared+to+other+men%2C+life%2C+just+as+the+Son+of+God+was+made+a+creature+not+for+his+sake+but+for+ours%2C+So+also+he+was+subjected+to+the+law+not+for+his+own+sake+but+for+ours.+The+second+element+in+the+above+conception+confuses+holiness+or+innocence+with+obedience+or+actual+righteousness%2C+which+differ+no+less+than+do+privation+%5Bprivatio%5D+and+%5Bpositive%5D+disposition+%5Bhabitus%5D.+Innocence+is+indeed+a+necessary+condition+for+Christ+sacrifice%2C+but+actual+obedience+is+not+only+a+necessary+condition+of+the+Christ+as+priest%2C+but+also+a+part+of+his+satisfaction+and+marriage.+If+the+actual+disobedience+of+Adam+is+a+cause+of+meriting+damnation%2C+why+is+not+the+actual+obedience+of+the+second+Adam+a+cause+of+meriting+salvation%3F+The+conclusion+that+we+reject+would+only+be+possible+if+we+were+willing+to+say+that+the+first+Adam+is+more+important+for+our+damnation+than+is+the+second+for+our+salvation.+II.+The+commandment+of+the+Father%2C+which+Christ+obeyed%2C+was+both+special+and+general.+It+was+special+with+respect+to+its+purpose%2C+in+that+he+obeyed+not+for+himself+but+for+us.+It+was+general+with+respect+to+the+object%3A+he+was+subject+to+the+same+law+which+was+prescribed+for+us%2C+and+in+all+those+matters+to+which+the+law+bound+us.+Those+who+teach+that+only+the+passive+obedience+of+Christ+has+merit%2C+maintained+that+his+obedience+was+only+to+a+special+commandment+of+the+Father+to+die+for+us.+However%2C+this+was+not+a+special+commandment%2C+but+part+of+the+commandment%3B+in+fact+the+obedience+of+Christ+extends+to+all+the+requirements+of+the+law.+Therefore%2C+since+the+law+bound+us+to+both+punishment+and+obedience+he+satisfied+each+of+its+requirements.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology%2C+%281626%29%2C+transl.+John+W.+Beardslee+in+John+W.+Beardslee%2C+Reformed+Dogmatics+%28New+York%3A+Oxford+University+Press%2C+1965%29%2C+106%E2%80%9308.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F643498ce55.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/643498ce55.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/wollebius-christ-merited-our-salvation-by-his-active-obedience-as-the-second-adam/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The Testament is no Testament, nor valid in Law, except the Testatator be dead. No man can sue by Law tested goods, if the Testator himself be living. Nor can we have right to a new heart, forgiveness, perseverance, eternal life, to grace and glory, except Christ our Testator had died. But because the Tested goods are more then goods left to us in Testament; they are left to us by such a Testament as is both a Testament and a death perfectly meritorious (this is superadded to the nature of a Testament, and beyond all Testaments) yea a death which is a price to ransom us from the wrath to come; Therefore Christ so dying in our stead, of justice meriteth that the friends should have these goods, though they belong by mere grace and free promise, to the friends. Now this is a most clear ground: Christ hath a well purchased right, by giving a condign price for the goods, and blessings promised in the Covenant of Grace to us: This right he hath by paying a price, laying down his life for us. This buying is not by necessity of nature, of justice but by a voluntary, free and uncompessed agreement and Covenant, John 10. 18. Isaiah 53. 6. No man can exact upon him Psal. 89. 22. (2.) If the Old Testament was confirmed by the blood of beasts, then must the New Testament be confirmed by the blood of Christ prefigured in these. But the Old Testament was so confirmed, Heb. 9. v. 18, 19 20 21, 22, [23.] Ergo now neither Testament nor Covenant was confirmed by blood simply, but by the blood of a living creature slain. 3. Hence the making of a Covenant was by cutting a calf or a beast in twain, and passing between the parts thereof, Jer. 34. 18. and so they entered into a curse, Nehem. 10. 29. devoted themselves to destruction, wishing they might be cut in twain (which is a strange kind of death, Mat. 24. 51. if they should break the Covenant. Hence the Phrase of striking a Covenant. So the Romans slew a Sow: So the Romans and Albani made a Covenant, as Livius. A Herald or Officer at Arms slew the beast, and prayed a curse on the people of Rome, that they might the same way be stricken, if they should break the Covenant. Its like they had it from the Jews. So Christ died to ratify and confirm the Covenant, Exod. 24. 6. This is the blood of the Covenant. Now the Covenant hath no blood, this blood of slain beasts (for it is a figurative speech) is a sign confirming the Covenant that believers shall have remission of sins in that blood of Christ which is shaddowed forth by the blood of these beasts. So Christ the great Shepherd of the flock Heb. 10. 13. is said to be brought from the dead, ἐν αἵματι by the blood of the everlasting Covenant. Junius the Article is understood: Or as the Hebrew Phrase, ב is put for ἐν, as Calvin and Piscator. The question may be, How did God bring Christ again from the death by the blood of the everlasting Covenant, had the blood of Christ any influence to bring himself back from the dead? Or did he, by dying, merit his own resurrection? Ans. Some read the word thus, and shun the Question, The God of peace who brought again from the dead the great sheepherd of the sheep: Understanding, ὀντα, being the great sheepherd or feeder, by the blood of the everlasting Covenant. So Beza, who makes these words ἐν ἅιματι, to be referred to ποιμένα: So as Christs right to be Pastor is in, and by his blood and suffering. And the words, ἐν ἅιματι, so is not to be constructed with the particle, ἀναγαγὼν: But Beza confesseth, that he changed the situation of the words. But if Christ be made a Pastor and feeder of the sheep by the blood of the eternal Covenant: then is he called to be a Pastor by Covenant. And what influence hath his death in his Pastoral Office? Is it by way of merit? Or did Christ merit to himself? Hardly, if not curiously can we say that, though I nothing doubt but Christ gave perfect obedience as man to the Covenant of Works, and he did merit as man, iure operum [by the law of works], life eternal, the way that Adam should have merited life eternal, so he had never fallen….</p></blockquote>

rticle%2C+%E1%BC%80%CE%BD%CE%B1%CE%B3%CE%B1%CE%B3%E1%BD%BC%CE%BD%3A+But+Beza+confesseth%2C+that+he+changed+the+situation+of+the+words.+But+if+Christ+be+made+a+Pastor+and+feeder+of+the+sheep+by+the+blood+of+the+eternal+Covenant%3A+then+is+he+called+to+be+a+Pastor+by+Covenant.+And+what+influence+hath+his+death+in+his+Pastoral+Office%3F+Is+it+by+way+of+merit%3F+Or+did+Christ+merit+to+himself%3F+Hardly%2C+if+not+curiously+can+we+say+that%2C+though+I+nothing+doubt+but+Christ+gave+perfect+obedience+as+man+to+the+Covenant+of+Works%2C+and+he+did+merit+as+man%2C+iure+operum+%5Bby+the+law+of+works%5D%2C+life+eternal%2C+the+way+that+Adam+should+have+merited+life+eternal%2C+so+he+had+never+fallen%E2%80%A6.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+or+A+Treatise+of+the+Covenant+of+Grace%2C+%281654%3B+republished+1655%29%2C+318%E2%80%9320.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56cb530525.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56cb530525.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/rutherford-meritorious-works-for-adam-and-christ-but-grace-for-us/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>As to the relation of good works to rewards, it may be observed—(1.) The word merit, in the strict sense of the term, means that common quality of all actions or services to which a reward is due in strict justice on account of their intrinsic value or worthiness. It is evident that, in this strict sense, no work of any creature can in itself merit any reward from God, because (a) all the faculties he possesses were originally granted and are continuously sustained by God, so that he is already so far in debt to God that he can never bring God in debt to him. (b.) Nothing the creature can do can be a just equivalent for the incomparable favour of God and its consequences. There is another sense of the word, however, in which it may be affirmed that if Adam had in his original probation yielded the obedience required, he would have “merited” the reward conditioned upon it, not because of the intrinsic value of that obedience, but because of the terms of the covenant which God had graciously condescended to form with him. By nature, the creature owed the Creator obedience, while the Creator owed the creature nothing. But by covenant the Creator voluntarily bound himself to owe the creature eternal life, upon the condition of perfect obedience.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As to the relation of good works to rewards, it may be observed—(1.) The word merit, in the strict sense of the term, means that common quality of all actions or services to which a reward is due in strict justice on account of their intrinsic value or worthiness. It is evident that, in this strict sense, no work of any creature can in itself merit any reward from God, because (a) all the faculties he possesses were originally granted and are continuously sustained by God, so that he is already so far in debt to God that he can never bring God in debt to him. (b.) Nothing the creature can do can be a just equivalent for the incomparable favour of God and its consequences. There is another sense of the word, however, in which it may be affirmed that if Adam had in his original probation yielded the obedience required, he would have “merited” the reward conditioned upon it, not because of the intrinsic value of that obedience, but because of the terms of the covenant which God had graciously condescended to form with him. By nature, the creature owed the Creator obedience, while the Creator owed the creature nothing. But by covenant the Creator voluntarily bound himself to owe the creature eternal life, upon the condition of perfect obedience.”

— A. A. Hodge, A Commentary on the Confession of Faith, (Philadelphia: Presbyterian Board of Publication and Sabbath-School Work, 1869), 307–08.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+to+the+relation+of+good+works+to+rewards%2C+it+may+be+observed%E2%80%94%281.%29+The+word+merit%2C+in+the+strict+sense+of+the+term%2C+means+that+common+quality+of+all+actions+or+services+to+which+a+reward+is+due+in+strict+justice+on+account+of+their+intrinsic+value+or+worthiness.+It+is+evident+that%2C+in+this+strict+sense%2C+no+work+of+any+creature+can+in+itself+merit+any+reward+from+God%2C+because+%28a%29+all+the+faculties+he+possesses+were+originally+granted+and+are+continuously+sustained+by+God%2C+so+that+he+is+already+so+far+in+debt+to+God+that+he+can+never+bring+God+in+debt+to+him.+%28b.%29+Nothing+the+creature+can+do+can+be+a+just+equivalent+for+the+incomparable+favour+of+God+and+its+consequences.+There+is+another+sense+of+the+word%2C+however%2C+in+which+it+may+be+affirmed+that+if+Adam+had+in+his+original+probation+yielded+the+obedience+required%2C+he+would+have+%E2%80%9Cmerited%E2%80%9D+the+reward+conditioned+upon+it%2C+not+because+of+the+intrinsic+value+of+that+obedience%2C+but+because+of+the+terms+of+the+covenant+which+God+had+graciously+condescended+to+form+with+him.+By+nature%2C+the+creature+owed+the+Creator+obedience%2C+while+the+Creator+owed+the+creature+nothing.+But+by+covenant+the+Creator+voluntarily+bound+himself+to+owe+the+creature+eternal+life%2C+upon+the+condition+of+perfect+obedience.%E2%80%9D%0A%0A%E2%80%94+A.+A.+Hodge%2C+A+Commentary+on+the+Confession+of+Faith%2C+%28Philadelphia%3A+Presbyterian+Board+of+Publication+and+Sabbath-School+Work%2C+1869%29%2C+307%E2%80%9308.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffd85c6ad04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fd85c6ad04.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/a-a-hodge-adam- <blockquote><p>The condition of the covenant of grace, so far as adults are concerned, is faith in Christ. That is, in order to partake of the benefits of this covenant we must receive the Lord Jesus Christ as the Son of God in whom and for whose sake its blessings are vouchsafed to the children of men. Until we thus believe we are aliens and strangers from the covenant of promise, without God and without Christ. We must acquiesce in this covenant, renouncing all other methods of salvation, and consenting to be saved on the terms which it proposes, before we are made partakers of its benefits. The word “condition,” however, is used in two senses. Sometimes it means the meritorious consideration on the ground of which certain benefits are bestowed. In this sense perfect obedience was the condition of the covenant originally made with Adam. Had he retained his integrity he would have merited the promised blessing. For to him that worketh the reward is not of grace but of debt. In the same sense the work of Christ is the condition of the covenant of redemption. It was the meritorious ground, laying a foundation in justice for the fulfillment of the promises made to Him by the Father. But in other cases, by condition we merely mean a sine qua non. A blessing may be promised on condition that it is asked for; or that there is a willingness to receive it. There is no merit in the asking or in the willingness, which is the ground of the gift. It remains a gratuitous favour; but it is, nevertheless, suspended upon the act of asking. It is in this last sense only that faith is the condition of the covenant of grace. There is no merit in believing. It is only the act of receiving a proffered favour. In either case the necessity is equally absolute. Without the work of Christ there would be no salvation; and without faith there is no salvation. He that believeth on the Son hath everlasting life. He that believeth not, shall not see life, but the wrath of God abideth on him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 2.364–65.</span></figcaption>

<blockquote><p>9.3 The Covenant Of Works The covenant of works is the pact of God initiated with the uncorrupted Adam, as head of the whole human race, in which He stipulated from man perfect obedience to the law, promised eternal, heavenly life for the same obedience, but threatened eternal death for transgression, and in turn man promised perfect obedience to God who stipulated, which having furnished, he could expect eternal, heavenly life. Scripture testifies that such a covenant existed with Adam. “They…(like Adam) transgressed the covenant” (Hos. 6:7). And God established the sacrament of the same covenant, “the tree of life” (Gen. 2:9). (VII). 9.4. God And Adam Covenanted They were covenanted, God as the Creator, Law-giver, and Rewarder, and Adam as the first man, uncorrupt, and head of the human race. For Adam was the “one blood” in which the whole posterity lay hidden (Acts 17:26), and he was “the first Adam,” equally representing those to be born from his blood, and “the second Adam” represents the faithful; indeed, he is a “type of” the one “to come” (Rom. 5:14). And since the remaining words concern the whole human race, the human race cannot be secluded from the covenant initiated with him. (VIII). 9.10. The Promise Of Heavenly And Eternal Life The promise of the covenant of works was eternal and heavenly life. This sacrament of it, “the tree of life,” by all means true and…(eternal) (Gen. 2:9), sanctioned not only for animals, and the earthly blessings that he already possessed, in which there was no διαθήκη (covenant), but there was προσθήκη (an accession) to the covenant. And when Christ, fulfilling the law in our place, merited eternal and heavenly life for us, He obtained the fulfillment of the same law by merit for us. Indeed, God promised something more in the covenant of works than that of whom could be a sharer outside of that. And it was not other than the translation into heavenly Paradise. (XXIII–XXVI). 10.4. The Stipulation Of God And The Promise Of The Son In this singular pact God the Father demanded from the Son, as Mediator, vicarious obedience to the law for man the sinner, and the Son promised it in turn. “Behold, I come. In the scroll of the book it has been written about me, that I shall do Your will” (Ps. 40:8–9). “Where He placed His soul as sacrifice, He will see a seed” (Isa. 53:10). “This commandment I have received from the Father, that I may place My soul” (John 10:17, 18). “He was born from a woman, gενόμενος ὑπὸ νόμον (born under the law) (Gal. 4:4). Therefore, everywhere Christ comes in the name br[ ἐγτύου and παρακλήτου (of advocate, guarantor), by guaranteeing and promising for another, of the one who receives Him in his faith (Job 33:23, Jer. 30:21, Isa. 38:14, Heb. 7:22). This Sponsor is at the same time is called “Mediator” (1 Tim. 2:5, Heb. 8:6), “Testator” (Heb. 9:15, 16), “High Priest” (Heb. 7:26), “Vindicator” (Job 19:25, Heb 2:16), etc. (VII–XIV). 10.5. The Demand Of The Son The demand of the same Son follows the promise. For as God the Father demanded payment from the Son and promised inheritance for paying, so the Son by promising and furnishing it, acquired the right to claim an inheritance, church, people of His own possession. “Demand from Me, and I will give you the nations as Your inheritance, and the ends of the earth as Your possession” (Ps. 2:8). “Surely My judgment is before the Lord, and…(My works) are a price before My God” (Isa. 49:4). For the promise and obedience of the Son had reason of true merit, even from condignity, for which nothing could be lacking (XIV).</p></blockquote>

ows+the+promise.+For+as+God+the+Father+demanded+payment+from+the+Son+and+promised+inheritance+for+paying%2C+so+the+Son+by+promising+and+furnishing+it%2C+acquired+the+right+to+claim+an+inheritance%2C+church%2C+people+of+His+own+possession.+%E2%80%9CDemand+from+Me%2C+and+I+will+give+you+the+nations+as+Your+inheritance%2C+and+the+ends+of+the+earth+as+Your+possession%E2%80%9D+%28Ps.+2%3A8%29.+%E2%80%9CSurely+My+judgment+is+before+the+Lord%2C+and%E2%80%A6%28My+works%29+are+a+price+before+My+God%E2%80%9D+%28Isa.+49%3A4%29.+For+the+promise+and+obedience+of+the+Son+had+reason+of+true+merit%2C+even+from+condignity%2C+for+which+nothing+could+be+lacking+%28XIV%29.%E2%80%9D%0A%0A%E2%80%94+Johann+Heinrich+Heidegger%2C+The+Concise+Marrow+of+Christian+Theology%2C+%281697%29.+Trans.+Casey+Carmichael.+%C2%A9R.+Scott+Clark+and+Casey+Carmichael+2015.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc047bece1d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c047bece1d.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/j-h-heidegger-christ-condignly-merited-as-the-second-adam/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>If Adam had remained upright and done everything which God required of him, he would indeed have merited his reward, but not condignly, as if either his own person or his works were equal in value to the reward. For no creature, no matter how perfect, can merit anything from God in that sense. […] Rather he would have merited ex pacto, according to the stipulation of the covenant—that is, according to God’s good pleasure.*</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doctrina Foederum</cite>, (1688; republished 1702), 259–260. Translated by Aaron Denlinger.</span></figcaption>

— Johannes Braun, Doctrina Foederum, (1688; republished 1702), 259–260. Translated by Aaron Denlinger.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+Adam+had+remained+upright+and+done+everything+which+God+required+of+him%2C+he+would+indeed+have+merited+his+reward%2C+but+not+condignly%2C+as+if+either+his+own+person+or+his+works+were+equal+in+value+to+the+reward.+For+no+creature%2C+no+matter+how+perfect%2C+can+merit+anything+from+God+in+that+sense.+%5B%E2%80%A6%5D+Rather+he+would+have+merited+ex+pacto%2C+according+to+the+stipulation+of+the+covenant%E2%80%94that+is%2C+according+to+God%E2%80%99s+good+pleasure.%2A%E2%80%9D%0A%0A%E2%80%94+Johannes+Braun%2C+Doctrina+Foederum%2C+%281688%3B+republished+1702%29%2C+259%E2%80%93260.+Translated+by+Aaron+Denlinger.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F842e2e7138.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/842e2e7138.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/johannes-braun-adam-would-have-merited-his-reward/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-13d65c2e21" data-kw="">
<blockquote><p>1. Because we are justified by the object of faith alone, that is by the merits of Christ only, without which we can have no righteousness whatever: for we are justified for Christ’s sake. Nothing but the merit of Christ can be our righteousness in the sight of God, either as a whole, or a part only. We are justified only by believing, and receiving the righteousness of another, and not by our own works, or merit. All works are excluded from, our justification, yea even faith itself in as far as it is a virtue, or work.

2. Because the act which belongs properly to faith is to apprehend, and apply to itself the righteousness of Christ; indeed, faith is nothing else than the acceptance itself, or the apprehension of the merits of Christ.

3. Because faith alone is the instrument which apprehends the satisfaction of Christ. Hence it is plain, why the exclusive particle only should be added, as it is in the Catechism, and be maintained against the Papist. It is done, 3.1. For the purpose of expressing what Paul affirms when he says: “We are justified freely by his grace, without the deeds of the laws:” And what Christ says; “only believe.” (Rom. 4:24, 28. Mark. 5:36.) 3.2. That all our own works, and merits, as well as those of others, may be excluded as being the cause of our justification, that faith may be understood correlatively. We are justified by faith only, that is, by the merits of Christ alone. 3.3. That not only all our merits, but that even faith itself may be excluded from that which is received by faith; so that when we say, we are justified by faith only, the sense is, that it is not by meriting, but only by receiving; as when it is said, This beggar is enriched only by receiving alms, all works and merits are excluded there from, yea, even the very acceptance of alms, in as far as it is viewed as a merit. It is for this reason, that Paul always says, that we are justified by faith, and through faith, as by an instrument; and never on account of faith, as the Papists will have it, who indeed admit both forms of expression, as if faith might be the application of Christ’s righteousness, and be also at the same time a certain work, or merit, by which we are counted worthy of being declared righteous, which is directly opposed to the very nature of faith. For if we were justified on account of our faith, then faith would no longer be the acceptance of the righteousness of another, but it would be the merit, and cause of our own righteousness; neither would it receive the satisfaction of another, for it would no longer stand in need of it. 3.4. That we may understand the necessity of faith for our justification, and may know that we are justified, not by the merit of faith, but yet just as little without faith, to receive the righteousness of Christ; because it is the province of faith to appropriate this to itself. 3.5. The orthodox Fathers often use the same form of speech, by faith only. Origen writes: “The Apostles say, that the justification OF FAITH ONLY is sufficient, so that if any one ONLY BELIEVES, he may be justified, even though he does not perform any works.” Ambrose says: “They are justified freely, who, with out working or rendering any thing in turn, are justified BY FAITH ONLY as the gift of God.” Again; “How can the Jews suppose that they are justified by the works of the law, seeing they have the justification of Abraham set before them, who was justified, not by the works of the law, but BY FAITH ONLY. The law, therefore, is not necessary, when the sinner is justified before God by FAITH ONLY.” And again. “God has decreed that he who believes in Christ, should be saved without works, receiving the remission of sins freely BY FAITH ONLY.” We are therefore justified by faith only, which means that it is by the merits of Christ alone, apprehended by faith. This we must firmly maintain, and believe: 3.5.1. For the glory of God, that so the sacrifice of Christ may not be impaired. 3.5.2. For our consolation, that we may be assured that our righteousness does not depend upon our works, (for if this were the case we should lose it thousands of times,) but upon the sacrifice and merit of Christ alone.</p></blockquote>

+ONLY.%E2%80%9D+And+again.+%E2%80%9CGod+has+decreed+that+he+who+believes+in+Christ%2C+should+be+saved+without+works%2C+receiving+the+remission+of+sins+freely+BY+FAITH+ONLY.%E2%80%9D+We+are+therefore+justified+by+faith+only%2C+which+means+that+it+is+by+the+merits+of+Christ+alone%2C+apprehended+by+faith.+This+we+must+firmly+maintain%2C+and+believe%3A+3.5.1.+For+the+glory+of+God%2C+that+so+the+sacrifice+of+Christ+may+not+be+impaired.+3.5.2.+For+our+consolation%2C+that+we+may+be+assured+that+our+righteousness+does+not+depend+upon+our+works%2C+%28for+if+this+were+the+case+we+should+lose+it+thousands+of+times%2C%29+but+upon+the+sacrifice+and+merit+of+Christ+alone.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Compendium+of+Orthodox+Doctrine%2C+%28on+Heidelberg+Catechism+61%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F13d65c2e21.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/13d65c2e21.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/ursinus-on-christs-merits-and-sola-fide/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The doctrine of justification, which now follows, is one of the chief articles of our faith, not only because it treats of those things which are fundamental, but also because it is most frequently called in question by heretics. The controversies between the church and heretics have respect principally to two points: the one is concerning God, and the other concerning the justification of man in the sight of God. And such is the importance of these doctrines that if either one of them be overthrown, the other parts of our faith easily fall to pieces. Hence it becomes necessary for us, to fortify and establish ourselves, especially in these doctrines, against all the assaults of heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Orthodox Doctrine of the Explication of the Catechism, on Q. 7</cite></span></figcaption>

</figure><figure class="quote" id="q-8a8b5c53aa" data-kw="">
<blockquote><p>Christ was given to us by God’s generosity, to be grasped and possessed by us in faith. By partaking of him, we principally receive a double grace: namely, that being reconciled to God through Christ’s blamelessness, we may have in heaven instead of a Judge a gracious Father; and secondly, that sanctified by Christ’s spirit we may cultivate blamelessness and purity of life. Of renewal,1 indeed, the second of these gifts, I have said what seemed sufficient. The theme of justification was therefore more lightly touched upon because it was more to the point to understand first how little devoid of good works is the faith, through which alone we obtain free righteousness by the mercy of God; and what is the nature of the good works of the saints, with which part of this question is concerned. Therefore we must now discuss these matters thoroughly. And we must so discuss them as to bear in mind that this is the main axis (praecipuum…cardinem) on which religion turns,2 so that we devote the greater attention and care to it. For unless you first of all grasp what your relationship to God is, and the nature of his judgment concerning you, you have neither a foundation on which to establish your salvation nor one on which to build piety toward God. But the need to know this will better appear from the knowledge itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.1 (Battles Edition)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/justification.html">Justification</a></span></div>

an-religion/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-c57218b272" data-kw="">
<blockquote><p>1. This whole matter of sanctification and holiness is peculiarly joined with and limited unto the doctrine, truth, and grace of the gospel; for holiness is nothing but the implanting, writing, and realizing of the gospel in our souls. Hence it is termed Ὁσιότης τῆς ἀληθείας, Eph. 4:24,—“The holiness of truth;” which the truth of the gospel ingenerates, and which consists in a conformity thereunto. And the gospel itself is ἀληθείας τῆς κατ᾿ εὐσέβειαν, Tit. 1:1,—“The truth which is according unto godliness;” which declares that godliness and holiness which God requireth. The prayer, also, of our Saviour for our sanctification is conformed thereunto: John 17:17, “Sanctify them in” (or by) “thy truth: thy word is truth.” And he sanctified himself for us to be a sacrifice, that “we might be sanctified in the truth.” This alone is that truth which makes us free, John 8:32,—that is, from sin and the law, unto righteousness in holiness. It belongs neither to nature nor the law, so as to proceed from them or to be effected by them. Nature is wholly corrupted and contrary unto it. The “law,” indeed, for certain ends, “was given by Moses,” but all “grace and truth came by Jesus Christ.” There neither is, nor ever was, in the world, nor ever shall be, the least dram of holiness, but what, flowing from Jesus Christ, is communicated by the Spirit, according to the truth and promise of the gospel. There may be something like it as to its outward acts and effects (at least some of them), something that may wear its livery in the world, that is but the fruit of men’s own endeavours in compliance with their convictions; but holiness it is not, nor of the same kind or nature with it. And this men are very apt to deceive themselves withal. It is the design of corrupted reason to debase all the glorious mysteries of the gospel, and all the concernments of them. There is nothing in the whole mystery of godliness, from the highest crown of it, which is the person of Christ, “God manifested in the flesh,” unto the lowest and nearest effect of this grace, but it labours to deprave, dishonour, and debase. The Lord Christ, it would have in his whole person to be but a mere man, in his obedience and suffering to be but an example, in his doctrine to be confined unto the capacity and comprehension of carnal reason, and the holiness which he communicates by the sanctification of his Spirit to be but that moral virtue which is common among men as the fruit of their own endeavours. Herein some will acknowledge that men are guided and directed to a great advantage by the doctrine of the gospel, and thereunto excited by motions of the Holy Ghost himself, put forth in the dispensation of that truth; but any thing else in it more excellent, more mysterious, they will not allow. But these low and carnal imaginations are exceedingly unworthy of the grace of Christ, the glory of the gospel, the mystery of the recovery of our nature, and healing of the wound it received by the entrance of sin, with the whole design of God in our restoration unto a state of communion with himself. Moral virtue is, indeed, the best thing amongst men that is of them. It far exceeds in worth, use, and satisfaction, all that the honours, powers, profits, and pleasures of the world can extend unto. And it is admirable to consider what instructions are given concerning it, what expressions are made of its excellency, what encomiums of its use and beauty, by learned contemplative men among the heathen; the wisest of whom did acknowledge that there was yet something in it which they could only admire, and not comprehend. And very eminent instances of the practice of it were given in the lives and conversations of some of them; and as the examples of their righteousness, moderation, temperance, equanimity, in all conditions, rise up at present unto the shame and reproach of many that are called Christians, so they will be called over at the last day as an aggravation of their condemnation. But to suppose that this moral virtue, whatever it be really in its own nature, or however advanced in the imaginations of men, is that holiness of truth which believers receive by the Spirit of Christ, is to debase it, to overthrow it, and to drive the souls of men from seeking an interest in it. And hence it is that some, pretending highly a friendship and respect unto it, do yet hate, despise, and reproach what is really so, pleasing themselves with the empty name or withered carcass of virtue, every way inferior, as interpreted in their practice, to the righteousness of heathens. And this, in the first place, should stir up our diligence in our inquiries after its true and real nature, that we deceive not ourselves with a false appearance of it, and that unto our ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 3 (Edinburgh: T&amp;T Clark, n.d.), 370.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

leasures+of+the+world+can+extend+unto.+And+it+is+admirable+to+consider+what+instructions+are+given+concerning+it%2C+what+expressions+are+made+of+its+excellency%2C+what+encomiums+of+its+use+and+beauty%2C+by+learned+contemplative+men+among+the+heathen%3B+the+wisest+of+whom+did+acknowledge+that+there+was+yet+something+in+it+which+they+could+only+admire%2C+and+not+comprehend.+And+very+eminent+instances+of+the+practice+of+it+were+given+in+the+lives+and+conversations+of+some+of+them%3B+and+as+the+examples+of+their+righteousness%2C+moderation%2C+temperance%2C+equanimity%2C+in+all+conditions%2C+rise+up+at+present+unto+the+shame+and+reproach+of+many+that+are+called+Christians%2C+so+they+will+be+called+over+at+the+last+day+as+an+aggravation+of+their+condemnation.+But+to+suppose+that+this+moral+virtue%2C+whatever+it+be+really+in+its+own+nature%2C+or+however+advanced+in+the+imaginations+of+men%2C+is+that+holiness+of+truth+which+believers+receive+by+the+Spirit+of+Christ%2C+is+to+debase+it%2C+to+overthrow+it%2C+and+to+drive+the+souls+of+men+from+seeking+an+interest+in+it.+And+hence+it+is+that+some%2C+pretending+highly+a+friendship+and+respect+unto+it%2C+do+yet+hate%2C+despise%2C+and+reproach+what+is+really+so%2C+pleasing+themselves+with+the+empty+name+or+withered+carcass+of+virtue%2C+every+way+inferior%2C+as+interpreted+in+their+practice%2C+to+the+righteousness+of+heathens.+And+this%2C+in+the+first+place%2C+should+stir+up+our+diligence+in+our+inquiries+after+its+true+and+real+nature%2C+that+we+deceive+not+ourselves+with+a+false+appearance+of+it%2C+and+that+unto+our+ruin.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+3+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+370.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc57218b272.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c57218b272.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/02/owen-the-least-dram-of-holine <blockquote><p>Sanctification, as here described, is the immediate work of God by his Spirit upon our whole nature, proceeding from the peace made for us by Jesus Christ, whereby, being changed into his likeness, we are kept entirely in peace with God, and are preserved unblamable, or in a state of gracious acceptation with him, according to the terms of the covenant, unto the end.</p></blockquote>

</figure><figure class="quote" id="q-3cbe9194c7" data-kw="">
<blockquote><p>Question 36. But how are we justified by faith? Answer: Not because of the worthiness of our faith, as if God justifies us because of it, as the Remonstrants would have it, and [as if] faith is here reckoned as a virtue and a remarkable good work, and therefore as the meritorious cause of the same [i.e. of justification]. …Question 38. How should faith here then be understood? Answer: As a hand or instrument, whereby we grab and take hold of the righteousness of the Redeemer, hence the sayings ‘take hold of God’s strength’ Is. 27:5; ‘receiving Jesus’ Jn. 1:12; ‘receiving the gift of righteousness’ Rom 5:17 and Acts 26:18. Question 39. By which analogy do you clear this up? Answer: Of the beggar who would receive alms of the generosity of a rich man, to which he must stretch out the hand, in which case it [i.e. the hand] deserves nothing, but is only the means by which he receives the gift; or alternatively, of one who in the navigation of the sea capsizes and sees a plank, grabs hold of it, and hauls himself onto it, thereby to be spared.</p></blockquote>

<blockquote><p>The Reformed churches have ever considered Christ and justification by faith in his merits, as the great centre of the Christian system. The Oxford Tract writers make the church the main point; the church as an ordinance for conveying life to all its members by means of the sacraments. The church, with them, is the great mediator between God and man, the only authorized channel of divine communication.</p></blockquote>

<blockquote><p>[399] But a great many Reformed theologians believed otherwise and answered the above question in the affirmative. In their opinion, the answer to Christ’s prayer (John 11:42; Heb. 5:7) and especially the entire state of exaltation from the resurrection to his coming again for judgment is a reward for the work that he accomplished as the Servant of the Lord in the days of his humiliation. And, given the teaching of Scripture, no other answer is possible. For over and over it presents the state of humiliation as the way and the means by which alone Christ can attain his exaltation (Isa. 53:10–12; Matt. 23:12; Luke 24:26; John 10:17; 17:4–5; Phil. 2:9; Heb. 2:10; 12:2). The preposition διο (therefore) in Philippians 2:9 refers not to the order and logic but specifically to the meritorious cause of the exaltation. Because Christ humbled himself so deeply, therefore God has so highly exalted him. Especially the Letter to the Hebrews repeatedly puts a heavy accent on this meritorious connection between Christ’s humiliation and exaltation (1:3; 2:9–10; 5:7–10; 10:12; 12:2). Christ himself was “sanctified” by suffering. This does not mean that he was consecrated to God or made morally perfect; it means “perfected, brought to full wisdom and maturity,” made τελειος, which consists in his now being crowned with honor and glory (2:9), being seated as high priest at the right hand of Majesty in the highest heaven (8:1), having attained the joy for which he endured the cross and despised the shame (12:2), and becoming the source of eternal salvation to all who obey him (5:9).</p></blockquote>

<blockquote><p>2. He infers a general conclusion, “That a man is justified by faith, without the works of the law,” chap. 3:28. What is meant by “the law,” and what by “the works of the law,” in this discourse of the apostle about our justification, hath been before declared. And if we are justified freely through faith in the blood of Christ, that faith which hath the propitiation of Christ for its especial object, or as it hath so, can take no other grace nor duty into partnership with itself therein; and being so justified as that all such boasting is excluded as necessarily results from any differencing graces or works in ourselves, wherein all the works of the law are excluded, it is certain that it is by faith alone in Christ that we are justified. All works are not only excluded, but the way unto their return is so shut up by the method of the apostle’s discourse, that all the reinforcements which the wit of man can give unto them will never introduce them into our justification before God.

3. He asserts from hence, that we “do not make void the law through grace,” but establish it, verse 31; which, how it is done, and how alone it can be done, hath been before declared. This is the substance of the resolution the apostle gives unto that great inquiry, how a guilty convinced sinner may come to be justified in the sight of God?—“The sovereign grace of God, the mediation of Christ, and faith in the blood of Christ, are all that he requireth thereunto.” And whatever notions men may have about justification in other respects, it will not be safe to venture on any other resolution of this case and inquiry; nor are we wiser than the Holy Ghost. Rom. chap.

4. In the beginning of the fourth chapter he confirms what he had before doctrinally declared, by a signal instance; and this was of the justification of Abraham, who being the father of the faithful, his justification is proposed as the pattern of ours, as he expressly declares, verses 22–24. And some few things I shall observe on this instance in our passage unto the fifth verse, where I shall fix our discourse. 1. He denies that Abraham was justified by works, verse 2. And,—(1.) These works were not those of the Jewish law, which alone some pretend to be excluded from our justification in this place; for they were the works he performed some hundreds of years before the giving of the law at Sinai: wherefore they are the works of his moral obedience unto God that are intended. (2.) Those works must be understood which Abraham had then, when he is said to be justified in the testimony produced unto that purpose; but the works that Abraham then had were works of righteousness, performed in faith and love to God, works of new obedience under the conduct and aids of the Spirit of God, works required in the covenant of grace. These are the works excluded from the justification of Abraham. And these things are plain, express, and evident, not to be eluded by any distinctions or evasions. All Abraham s evangelical works are expressly excluded from his justification before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 5 (Edinburgh: T&amp;T Clark, n.d.), 313–314.</span></figcaption>

g</a></div>

<blockquote><p>The sum and whole cause of the writing of this epistle is to prove that a man is justified by faith only; which proposition whoso denieth, to him is not only this epistle and all that Paul writeth, but also the whole Scripture, so locked up, that he shall never understand it to his soul’s health…And by justifying understand no other thing than to be reconciled to God, and to be restored unto his favor, and to have thy sins forgiven thee. And when I say, God juistifieth us, understand thereby that God for Christ’s sake, merits, and deservings only, receiveth us unto His mercy, favour, and grace, and forgiveth us our sins. And when I say, Christ justifieth us, understand thereby that Christ only hath redeemed us, bought, and delivered us out of the wrath of God and damnation, and hath with his works only purchased us the mercy, the favor, and the grace of God, and the forgiveness of our sins. And when I say that faith justified, understand thereby that faith and trust in the truth God and in the mercy promised us for Christ’s sake, and for His deserving and works only, doth quiet the conscience and certify her that our sins be forgiven, and we in the favour of God. Furthermore we set before thine eyes Christ’s own works and thine own works. Christ’s works only justify thee and make satisfaction for thy sin, and not thine own works…For the promise of mercy is made thee for Christ’s work’s sake, and not for thine works’s sake…Finally, that we say, faith only justified, ought to offend no man. for if this be true, that Christ only redeemed us, Christ only bare our sins, make satisfaction for them and purchased us the favor of God; then it must it must needs be true that the trust only in Christ’s deservings and in the promises of God the Father, made to us for Christ’s sake, doth alone quiet the conscience and certify it that the sins are forgiven.</p></blockquote>

<blockquote><p>…The lawyer, accustomed to the persuasion of law righteousness, blinded himself with confidence in works. Then he sought only what were works of righteousness whereby salvation is acquired. Therefore he is rightly sent back to the law wherein there is a perfect mirror of righteousness. With a clear voice we too proclaim that these commandments are to be kept if one seeks life in works. And Christians must know this doctrine, for how could they flee to Christ unless they recognized that they had plunged from the way of life over the brink of death? How could they realize how far they had wandered from the way of life unless they first understood what that way is like? Only, therefore, when they distinguish how great is the difference between their life and divine righteousness that consists in accepting the law are they made aware that, in order to recover salvation, their refuge is in Christ. To sum up, if we seek salvation in works, we must keep the commandments by which we are instructed unto perfect righteousness. But we must not stop here unless we wish to fail in mid-course, for none of us is capable of keeping the commandments. Therefore, since we are barred from law righteousness, we must betake ourselves to another help, that is, to faith in Christ. For this reason, as the Lord in this passage recalls to the law a teacher of the law whom he knew to be puffed up with empty confidence in works, in order that he may learn he is a sinner, subject to the dreadful judgment of eternal death, so elsewhere he comforts with the promise of grace without any mention of the law others who have already been humbled by this sort of knowledge: “Come to me all who labor and are heavy-laden, and I will refresh you… and you will find rest for your souls</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…The lawyer, accustomed to the persuasion of law righteousness, blinded himself with confidence in works. Then he sought only what were works of righteousness whereby salvation is acquired. Therefore he is rightly sent back to the law wherein there is a perfect mirror of righteousness. With a clear voice we too proclaim that these commandments are to be kept if one seeks life in works. And Christians must know this doctrine, for how could they flee to Christ unless they recognized that they had plunged from the way of life over the brink of death? How could they realize how far they had wandered from the way of life unless they first understood what that way is like? Only, therefore, when they distinguish how great is the difference between their life and divine righteousness that consists in accepting the law are they made aware that, in order to recover salvation, their refuge is in Christ. To sum up, if we seek salvation in works, we must keep the commandments by which we are instructed unto perfect righteousness. But we must not stop here unless we wish to fail in mid-course, for none of us is capable of keeping the commandments. Therefore, since we are barred from law righteousness, we must betake ourselves to another help, that is, to faith in Christ. For this reason, as the Lord in this passage recalls to the law a teacher of the law whom he knew to be puffed up with empty confidence in works, in order that he may learn he is a sinner, subject to the dreadful judgment of eternal death, so elsewhere he comforts with the promise of grace without any mention of the law others who have already been humbled by this sort of knowledge: “Come to me all who labor and are heavy-laden, and I will refresh you… and you will find rest for your souls”

— John Calvin, Institutes of the Christian Religion, 3.18.9 (Battles edition)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6The+lawyer%2C+accustomed+to+the+persuasion+of+law+righteousness%2C+blinded+himself+with+confidence+in+works.+Then+he+sought+only+what+were+works+of+righteousness+whereby+salvation+is+acquired.+Therefore+he+is+rightly+sent+back+to+the+law+wherein+there+is+a+perfect+mirror+of+righteousness.+With+a+clear+voice+we+too+proclaim+that+these+commandments+are+to+be+kept+if+one+seeks+life+in+works.+And+Christians+must+know+this+doctrine%2C+for+how+could+they+flee+to+Christ+unless+they+recognized+that+they+had+plunged+from+the+way+of+life+over+the+brink+of+death%3F+How+could+they+realize+how+far+they+had+wandered+from+the+way+of+life+unless+they+first+understood+what+that+way+is+like%3F+Only%2C+therefore%2C+when+they+distinguish+how+great+is+the+difference+between+their+life+and+divine+righteousness+that+consists+in+accepting+the+law+are+they+made+aware+that%2C+in+order+to+recover+salvation%2C+their+refuge+is+in+Christ.+To+sum+up%2C+if+we+seek+salvation+in+works%2C+we+must+keep+the+commandments+by+which+we+are+instructed+unto+perfect+righteousness.+But+we+must+not+stop+here+unless+we+wish+to+fail+in+mid-course%2C+for+none+of+us+is+capable+of+keeping+the+commandments.+Therefore%2C+since+we+are+barred+from+law+righteousness%2C+we+must+betake+ourselves+to+another+help%2C+that+is%2C+to+faith+in+Christ.+For+this+reason%2C+as+the+Lord+in+this+passage+recalls+to+the+law+a+teacher+of+the+law+whom+he+knew+to+be+puffed+up+with+empty+confidence+in+works%2C+in+order+that+he+may+learn+he+is+a+sinner%2C+subject+to+the+dreadful+judgment+of+eternal+death%2C+so+elsewhere+he+comforts+with+the+promise+of+grace+without+any+mention+of+the+law+others+who+have+already+been+humbled+by+this+sort+of+knowledge%3A+%E2%80%9CCome+to+me+all+who+labor+and+are+heavy-laden%2C+and+I+will+refresh+you%E2%80%A6+and+you+will+find+rest+for+your+souls%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.18.9+%28Battles+edition%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9705ea056a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9705ea056a.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/10/calvin-what-the-law-requires-the-gospel-gives-freely/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>When I was a monk, I thought by and by that I was utterly cast away, if at any time I felt the lust of the flesh; that is to say, if I felt any evil motion, fleshly lust, wrath, hatred, or envy against any brother. I assayed many ways to help quieten my conscience but it would not be; for the concupiscence and lust of my flesh did always return, so that I could not rest, but was continually vexed with these thoughts: this without sin though has committed: though are infected with envy, with impatience, and with such other symptoms: therefore thou art entered into this whole order in vain, and all thy good works are unprofitable. If, then, I had rightly understood these sentences of Paul, “The flesh lusteth contrary to the Spirit, and the Spirit contrary to the Flesh, and these two are one against another, so that ye cannot do the things that ye would do;” I should not have so miserably tormented myself, but should have thought and said to myself, as now commonly I do: “Martin, thou shalt not utterly be without sin, for thous hast flesh; thous halt, therefore, feel the battle thereof according to that saying of Paul: ‘The flesh resisteth the Spirit.’ Despair not, therefore, but resist it strongly, and fulfill not the lust thereof. Thus doing, thou are not under the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, (Philadelphia, 1860)</span></figcaption>

<blockquote><p>Vs. 8, 9. These verses confirm the preceding declaration. The manifestation of the grace of God is the great end of redemption. This is plain, for salvation is entirely of grace. Ye are saved by grace; ye are saved by faith and not by works; and even faith is not of yourselves, it is the gift of God. We have then here a manifold assertion, affirmative and negative, of the gratuitous nature of salvation. It is not only said in general, ‘ye are saved by grace,’ but further that salvation is by faith, i. e. by simply receiving or apprehending the offered blessing. From the very nature of faith, as an act of assent and trust, it excludes the idea of merit. If by faith, it is of grace; if of works, it is of debt; as the apostle argues in Rom. 4:4, 5. Faith, therefore, is the mere causa apprehendens, the simple act of accepting, and not the ground on which salvation is bestowed. Not of works. The apostle says works, without qualification or limitation. It is not, therefore, ceremonial, as distinguished from good works; or legal, as distinguished from evangelical or gracious works; but works of all kinds as distinguished from faith, which are excluded. Salvation is in no sense, and in no degree, of works; for to him that worketh the reward is a matter of debt. But salvation is of grace and therefore not of works lest any man should boast. That the guilty should stand before God with self-complacency, and refer his salvation in any measure to his own merit, is so abhorrent to all right feeling that Paul assumes it (Rom. 4:2) as an intuitive truth, that no man can boast before God. And to all who have any proper sense of the heavens of God and of the evil of sin, it is an introduction and therefore a gratuitous salvation, a salvation which excludes with works all ground of boasting, is the only salvation suited to the relation of guilty men to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, (New York: Robert Carter and Brothers, 1858), 117–19.</span></figcaption>

</figure><figure class="quote" id="q-157d80b1c4" data-kw="">
<blockquote><p>It must not be omitted, that if any article is stated as necessary to be known, which cannot be understood, unless some other article shall have been previously understood and believed; that other article must also rank among those which are necessary. For example; it is necessary to know that we are saved only by the grace of our Lord Jesus Christ; for the Apostle Paul says, “If any man preach any other gospel unto you than that which we have preached unto you, let him be accursed.” But this can be neither understood nor believed, unless we know that sin has plunged us into so deep an abyss of misery, that our deliverance surpassed our own power, and even the united exertions of all creatures. Thus, from the necessity of the article respecting our deliverance, we strongly infer the necessity of the article respecting our misery. …When any thing, in fine, the necessity of which must have been more doubtful, is expressly represented as necessary to be known; it follows, that a doctrine will also be necessary, the necessity of which we should have been less, or at least not more, disposed to question. To give an instance of this: the Apostle teaches that the article regarding justification by faith in Christ without the works of the law, is necessary, when he asserts that they who are “ignorant of God’s righteousness, and going about to establish their own righteousness, have not submitted themselves to the righteousness of God.” The necessity of this article being thus demonstrated; it unavoidably follows, that it is necessary for us to know also, that, considered in ourselves, we are obnoxious to condemnation and wrath: for this last article is much more evident than the former, and more obvious to every one that is willing to examine himself; nor, without the knowledge of it, can we be induced to seek that righteousness which is in Christ.</p></blockquote>

</figure><figure class="quote" id="q-6167a2af9c" data-kw="">
<blockquote><p>Redemption is a real deliverance from the evils of punishment, which is actually nothing but the carrying out of the sentence of justification. For in justification we are pronounced just and awarded the judgement of life. In glorification the life that results from the pronouncement and award is given to us: We have it in actual possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, 1.30.4</span></figcaption>

<blockquote><p>For God in his mercy has permitted the powers of the intellect to remain, though differing greatly from what was in man before the fall. God commands us to cultivate our natural talents, and meanwhile adds both gifts and success. And it is obvious that we make no progress in all the arts without God’s blessing. In any case, Scripture refers all the arts to God; and, indeed, the heathen trace the origin of the arts to the gods who invented them.</p></blockquote>

<blockquote><p>16. For God so loved the world. Christ opens up the first cause, and, as it were, the source of our salvation, and he does so, that no doubt may remain; for our minds cannot find calm repose, until we arrive at the unmerited love of God. As the whole matter of our salvation must not be sought any where else than in Christ, so we must see whence Christ came to us, and why he was offered to be our Saviour. Both points are distinctly stated to us: namely, that faith in Christ brings life to all, and that Christ brought life, because the Heavenly Father loves the human race, and wishes that they should not perish. And this order ought to be carefully observed; for such is the wicked ambition which belongs to our nature, that when the question relates to the origin of our salvation, we quickly form diabolical imaginations about our own merits. Accordingly, we imagine that God is reconciled to us, because he has reckoned us worthy that he should look upon us. But Scripture everywhere extols his pure and unmingled mercy, which sets aside all merits.</p></blockquote>

</figure><figure class="quote" id="q-4320a15932" data-kw="">
<blockquote><p>Where sanctification is enjoined us as our duty, it is prescribed under this notion of cleansing ourselves from sin: “Wash you, make you clean,” Isaiah 1:16. “O Jerusalem, wash thine heart from wickedness, that thou mayest be saved,” Jeremiah 4:14. “Having therefore these promises, let us cleanse ourselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God”… Nothing do they more earnestly labor after in their prayers and supplications than a cleansing from it by the blood of Christ, nor are any promises more precious unto them than those which express their purification and purging from it; for these are they which, next unto their interest in the atonement made by the sacrifice of Christ, give them boldness in their approaches unto God. So our apostle fully expresseth it, Hebrews 10:19-22: “Having therefore boldness to enter into the holiest by the blood of Jesus, by a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh; and having an high priest over the house of God; let us draw near with a true heart in full assurance of faith, having our hearts sprinkled from an evil conscience, and our bodies washed with pure water…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pneumatologia</cite></span></figcaption>

</figure><figure class="quote" id="q-960975c5ef" data-kw="">
<blockquote><p>Since Paul knew that justification of faith is a refuge for those who lack righteousness of their own [cf. Romans chapter 5], he boldly infers that all who are justified by faith are excluded from works righteousness. But since it is certain that this is common to all believers, from this fact Paul with equal assurance determines that no one is justified by works [cf. Romans 3:20]—on the contrary, that men are justified without any help from our works. But it is one thing to discuss what value works have of themselves, another, to weigh in what place they are to be held after faith righteousness has been established. If we are to determine a price for works according to their worth, we say that they are unworthy to come before God’s sight; that man, accordingly, has no works in which to glory before God; that hence, stripped of all help from works, he is justified by faith alone. But we define justification as follows: the sinner, received into communion with Christ, is reconciled to God by his grace, while, cleansed by Christ’s blood, he obtains forgiveness of sins, and clothed with Christ’s righteousness as if it were his own, he stands confident before the heavenly judgment seat. After forgiveness of sins is set forth, the good works that now follow are appraised otherwise than on their own merit. For everything imperfect in them is covered by Christ’s perfection, every blemish or spot is cleansed away by his purity in order not to be brought in question at the divine judgment. Therefore, after the guilt of all transgressions that hinder man from bringing forth anything pleasing to God has been blotted out, and after the fault of imperfection, which habitually defiles even good works, is buried, the good works done by believers are accounted righteous, or, what is the same thing, are reckoned as righteousness [Romans 4:22].</p></blockquote>

<blockquote><p>verse 4. That the justification of the law might be fulfilled, etc. They who understand that the renewed, by the Spirit of Christ, fulfil the law, introduce a gloss wholly alien to the meaning of Paul; for the faithful, while they sojourn in this world, never make such a proficiency, as that the justification of the law becomes in them full or complete. This then must be applied to forgiveness; for when the obedience of Christ is accepted for us, the law is satisfied, so that we are counted just. For the perfection which the law demands was exhibited in our flesh, and for this reason — that its rigor should no longer have the power to condemn us. But as Christ communicates his righteousness to none but to those whom he joins to himself by the bond of his Spirit, the work of renewal is again mentioned, lest Christ should be thought to be the minister of sin: for it is the inclination of many so to apply whatever is taught respecting the paternal kindness of God, as to encourage the lasciviousness of the flesh; and some malignantly slander this doctrine, as though it extinquished the desire to live uprightly.</p></blockquote>

<figure class="quote" id="q-f8f191fe0f" data-kw="">
<blockquote><p>All the Reformed agree in this, that there is such a great value and price in the death of Christ, from the infinite dignity of the person, that it could be sufficient for saving each and every person, but because neither the Father nor the Son willed that death to be destined for redeeming each and every person, it cannot be fittingly said that Christ died for each and every person…</p></blockquote>

</figure><figure class="quote" id="q-49b66891f4" data-kw="">
<blockquote><p>This deed of gift and grant, or authentic gospel-offer is expressed in so many words, ‘For God so loved the world, that he gave his only begotten Son, that whosoever believes in Him should not perish, but have everlasting life’ (John 3:16). Where the gospel comes, this grant is published, and the ministerial offer made, and there is no exception of any of all mankind in the grant. If there was, no ministerial offer of Christ could be warrantably made to the party excepted, more than to the fallen angels; and without question, the publishing and proclaiming of heaven’s grant unto any, by way of ministerial offer, presupposes the grant, in the first place, to be made to them: otherwise, it would be of no more value than a crier’s offering of the king’s pardon to one who is not comprehended in it. This is the good old way of discovering to sinners their warrant to believe in Christ; and it does indeed bear the sufficiency of the sacrifice of Christ for all, and that Christ crucified is the ordinance of God for salvation unto all mankind, in the use-making of which only they can be saved; but not an universal atonement or redemption.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

redemption&amp;text=This%20deed%20of%20gift%20and%20grant%2C%20or%20authentic&amp;text=saved%3B%20but%20not%20an%20universal%20atonement%20or%20redemption" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-01d73992a9" data-kw="">
<blockquote><p>We no more need to know specifically for whom Christ died than we need to know specifically who has been ordained to eternal life. The calling indeed rests on a particular basis, for it belongs to and proceeds from the covenant, but it is addressed in keeping with God’s revealed will and with the inherently all-sufficient value of Christ’s sacrifice – also to those who are outside the covenant in order that they too may be incorporated into that covenant and in faith itself receive the evidence of their election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Backer Academic, 2004), 3:246</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-2a4490c1ea" data-kw="">
<blockquote><p>It follows from this view that, as the atonement of Christ was, in itself, sufficient, had God so pleased, to ground the salvation of all men, it is sufficient to ground the universal offer of salvation. Men are invited to stand on a platform which is broad enough to hold them all, to rest upon a foundation which is strong enough to support them all, to partake of provisions which are abundant enough to supply them all. When, therefore, God invites all men to seek salvation in Christ, He is not insincere in offering them a platform too narrow to hold them, a foundation too weak to sustain them, provisions too meagre to supply them. Were they all to accept the invitation, they would all be saved. So much for the intrinsic sufficiency of the remedy for human sin and misery. So far the Calvinist is not chargeable with representing God as insincere in the matter of the gospel offer. It will be urged, however, that notwithstanding his admission of the absence of limitation, as to the intrinsic sufficiency of the atonement, the difficulty remains in view of his doctrine that there is limitation, as to its extrinsic design and application. It was not rendered for all, it is not intended to be effectually applied to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism &amp; Evangelical Arminianism, pt. 1</cite>, Section 3, Objections [to Election and Reprobation] from the Moral Attributes of God Answered; 4. Objection from Divine Veracity, pp. 359-93</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

rmalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=It%20follows%20from%20this%20view%20that,to%20be%20effectually%20applied%20to%20all&amp;text=It%20follows%20from%20this%20view%20that%2C%20as%20the&amp;text=not%20intended%20to%20be%20effectually%20applied%20to%20all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c608953fb1" data-kw="">
<blockquote><p>It must be granted, however, that, altogether apart from the exegesis of these passages, some sort of reference of the atonement to every man may be affirmed… The Bible gives us no right to say that Christ in His atoning work acted as the legal substitute of every individual human being. But certainly neither does it require us to assert that for the non-elect the atonement is void of all benefit or significance. Every man is indebted for great privileges to the cross of Christ. The continued existence of the race in spite of sin, but for it [the cross of Christ], would have been impossible. The atonement by its universal sufficiency renders the gospel a message which can be preached to every human being, and the offer of the gospel illumines the entire earthly existence of every one to whom it comes by the hope that he may find himself through faith one of the actual heirs of redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review</cite>, (1902), 13:1-37, p. 19</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It must be granted, however, that, altogether apart from the exegesis of these passages, some sort of reference of the atonement to every man may be affirmed… The Bible gives us no right to say that Christ in His atoning work acted as the legal substitute of every individual human being. But certainly neither does it require us to assert that for the non-elect the atonement is void of all benefit or significance. Every man is indebted for great privileges to the cross of Christ. The continued existence of the race in spite of sin, but for it [the cross of Christ], would have been impossible. The atonement by its universal sufficiency renders the gospel a message which can be preached to every human being, and the offer of the gospel illumines the entire earthly existence of every one to whom it comes by the hope that he may find himself through faith one of the actual heirs of redemption.”

</figure><figure class="quote" id="q-926982d7c8" data-kw="">
<blockquote><p>‘Christ died for all sufficiently, for the elect alone efficiently: that is, He indeed satisfied for all, but only the elect apply His satisfaction to themselves.’ Response: We have said above that the death of Christ is in itself sufficient for the redemption of all, yet destined only for the elect. But that He died sufficiently for all, and efficiently for the elect, can in no way be said:

I. Because the division of efficiency and sufficiency implies a contradiction with the thing divided. For if He died for all, it follows that He willed by His death to expiate the sins of all, and to obtain their remission. For this the particle for (pro) requires, indicating the end, as does the very phrase. But if He willed to expiate, then certainly He also actually expiated. The reason is that whatever He ever willed to effect, He brought to effect; whether as the omnipotent God, or as the faithful servant of the Father, whom the Father always heard. If He actually expiated the sins of all individuals, therefore He died efficiently for all and each individual; which nevertheless this distinction denies.

II. A distinction that removes theological principles is faulty. The distinction of sufficiency and efficiency removes theological principles. The reason is that it separates those things which God has joined in the covenant Jer. 31:33–34. For those whose Savior Christ is, He is their Savior both by merit and by efficacy together, not by one only. Therefore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Logical &amp; Theological Exegesis of the Augsburg Confession</cite>, (Amsterdam: Janssonius, 1647), Syllabus of Controversies with Lutherans, Controversy 4, on Predestination, Question 3, 4. ‘Whether for All &amp; Every Person Christ Died’, p. 237 trans. AI</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>VII. When the Scripture then says that Christ died for all, that He gave Himself a ransom for all, that He died for all, that He is a propitiation for the sins of the whole world: this is necessarily understood, either of the greatness of the price, or of the sufficiency of his merit for all men, or of the effectual redemption of all Jews and Gentiles that embrace by faith the benefits of his death: For in these, says Ambrose, a certain kind of universality is conceived [see footnote]. And this is no more repugnant [as the adversaries claim it is] to the doctrine of the Gospel than if some [adversaries] should say that Christ by his death did indifferently redeem and reconcile to God faithful Christians, and faithless Turks, heathens, Epicures, hypocrites, etc. although they receive not the merit of Christ by faith: which [latter] opinion [of the adversaries] is both impious, and repugnant to God’s Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>VIII. Hence is that received and fit distinction, that Christ died for all men, in respect of the sufficiency of his merit, or the greatness of the price: but in respect of the efficacy and fruit of his death, he died for all, and only for the believers; seeing not all, but only the faithful receive him: but the rest reject him through infidelity.</p></blockquote>

<blockquote><p>IX. Thus, besides the Schoolmen, the orthodox fathers also teach: so Prosper Aquitanicus, in the year of Christ 460, Response to the Objections of Vincent., Objection 1: Whereas it is rightly said that our Savior was crucified for the redemption of all the world, for undertaking the affairs of human nature, and for the common loss in Adam: yet it may be said that He died only for these to whom his death was profitable. And Cyril on John l. 11, ch. 19, says, That Christ is an advocate for the sins of all the world: that is, not only for the Jews, but also for other nations; or, for all who, being called by faith, attain to righteousness and sanctification; so that the benefit of a mediator, not without cause, belongs only to them whose mediator and high-priest He is.

X. But, of all men, Augustine speaks most clearly, whose opinion (because it is altogether ours) I thought to set in opposition to some sycophants. Thus he speaks (tome 1, ad Art. falso imp., article 1): If we consider the greatness and power of the price, and that it belongs to the only cause of mankind, the blood of Christ is the redemption of the whole world; but they that pass out of this life without faith and the sacrament of regeneration, they are not partakers of redemption. Whereas then by reason of that one nature of all, and the one cause of all, undertaken by our Lord truly, all are said to be redeemed, and yet not all are delivered from captivity, doubtless the property of redemption is in them out of whom the prince of this world is ejected: and now they are no more the vessels of Satan, but the members of Christ. Whose death is not so spent upon mankind that they also who are not regenerated should appertain to his redemption; but so, that what by one example is done for all, by a particular sacrament should be celebrated in each one: for that cup of immortality, which was composed of our infirmity, and of our verity, and of divine verity, it has in itself that which may benefit all, but if it be not drunk, it does not cure.</p></blockquote>

</figure><figure class="quote" id="q-f271ecd378" data-kw="">
<blockquote><p>As early as 1595 Piscator, the longtime professor of theology at Herborn whose commentaries on Scripture were generally admired by the Reformed, argued that Christ in no way died for the reprobate. In England, the controversial Peter Baro picked up on this teaching and publicly rejected it in his sermon on the Lambeth Articles in January 1596. Baro had good reason to be alarmed for, in 1594, a Church of England minister named William Burton similarly denied that the death of Christ was sufficient for the nonelect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-baro.html">Peter Baro</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Michael Lynch, John Davenant’s Hypothetical Universalism</cite>, (Oxford Univ. Press, 2021), p. 57</span></figcaption>

<blockquote><p>Secondly I answer that we do acknowledge with glad minds that Christ died for all (the scripture averring so much): but we utterly deny that He died for all and everyone alike in respect of God, or, as well for the damned as elect, and that effectually on God’s part. … Again, if all and every one be effectually redeemed, all and every one are reconciled unto God, because that the forgiveness of sins and the satisfaction for the same are inseparably joined together. Yea and Paul places redemption in the remission of sins where he says: ‘By whom we have redemption through his blood, even the forgiveness of sins.’ (Eph. 1:7 &amp; Col. 1:14).</p></blockquote>

<blockquote><p>II. Whether Christ died for all men universally? Arminians. Christ underwent death for all individuals both of the perishing and of those to be saved, as to the obtaining of salvation, as much for Cain and Judas, as for Abel and Peter: not however for the former, as such or about to perish, nor for the latter, as believers; but indiscriminately for these and those considered in the common lot of the fall and sin.. Censure. Christ is the expiation for the sins of the whole world, as to the worth and sufficiency of the λύτρον [ransom]. But by reason of efficacy, and the application of faith by him, according to the gratuitous election of God, He is the Savior of the elect only. Jn. 10:15. But in Scripture Christ is said to have died for all, 1 Tim. 2:6, Heb. 2:9, and for many, namely the elect, sons of God and believers. Mt. 20:28, Jn. 17:9, 19, Rom. 3:22. Which ἐναντιοφανές [seeming contradiction] that it may be taken away, it is to be held, that Christ is said to have died for all in three ways: In the beginning He died efficaciously for all his sheep. Jn. 10:15. And in these all and alone there is a certain special universality, as is in Ambrose, bk. 1, Of the Calling of the Gentiles, ch. 3. The Apostle expresses that universality of believers in Rom. 3:22. Then in certain places of Scripture by the word “all” is understood the indeterminate and universal object of the death of Christ: which are all men, without exception of peoples, condition and sex: so that by this phrase the amplitude of grace in the New Testament is signified. Finally Christ is said to have died for all, if the sufficiency or magnitude of the price is regarded. For indeed the death of the Son of God, and of the immaculate lamb, is the one, perfect, and sufficient λύτρον [ransom], sufficient for expiating and deleting all the sins of the whole world: by which sufficiency all the reprobate are rendered inexcusable.</p></blockquote>

</figure><figure class="quote" id="q-2217e3fe57" data-kw="">
<blockquote><p>It was in itself of infinite value and sufficiency to have been made a price to have bought and purchased all and every man in the world. That it did formally become a price for any is solely to be ascribed to the purpose of God, intending their purchase and redemption by it. The intention of the offerer and accepter that it should be for such, some, or any, is that which gives the formality of a price unto it; this is external. But the value and fitness of it to be made a price arises from its own internal sufficiency. Hence may appear what is to be thought of… [the statement] “The blood of Christ was a sufficient price for the sins of all the world;” –which last expression is corrected by some, and thus asserted, “That the blood of Christ was sufficient to have been made a price for all;” which is most true, as was before declared: for its being a price for all or some does not arise from its own sufficiency, worth, or dignity, but from the intention of God and Christ using it to that purpose, as was declared; and, therefore, it is denied that the blood of Christ was a sufficient price and ransom for all and every one, not because it was not sufficient, but because it was not a ransom. And so it easily appears what is to be owned in the [Lombardian] distinction itself before expressed. If it intend no more but that the blood of our Savior was of sufficient value for the redemption of all and every one, and that Christ intended to lay down a price which should be sufficient [emphasis added; note this is consistent with being in the realm of hypothesis] for their redemption, it is acknowledged as most true.</p></blockquote>

</figure><figure class="quote" id="q-04e73746c9" data-kw="">
<blockquote><p>There is such a fulness in the satisfaction of Christ, as is sufficient for the salvation of the whole world, were the whole world to believe in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John</cite>, (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | “Christ died for sinners. But everything turns on the significance of the preposition. What is meant by “Christ died for sinners”? To answer that Christ died in order to make it possible for God to righteously receive sinners who come to Him through Christ, is only saying what many a Socinian has affirmed. The testing of a man’s orthodoxy on this vital truth of the atonement requires something far more definite than this. The saving efficacy of the atonement lies in the vicarious nature of Christ’s death, in his representing certain persons, in his bearing their sins, in his being made a curse for them, in his purchasing them, spirit and soul and body. It will not do to evade this by saying</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-2382ecf531" data-kw="">
<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John</cite>, (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>Second, He did not offer Himself for angels, because He is not the epilēptōr (ἐπιλήπτωρ), the undertaker and redeemer of angels (Heb. 2:16). Therefore, we think it imprudently said that Christ’s blood suffices to redeem demons (Cornelius Jansen, Augustinus, tome 3, p. 382). Third, Christ sanctified and offered Himself for the seed of Abraham, whose epilēptōr He is (Heb. 2:16).</p></blockquote>

<blockquote><p>2. Nor do we want to absolutely reject that judgment which distinguishes between the sufficiency and efficacy of Christ’s death, so that it extends to individuals; [but] here it [1 Tim. 2:6] is restricted to only the elect and believing. We know indeed this distinction was constantly received in the schools from the time of Lombard (Sentences, bk. 3, distinction 20, letter ‘c’) and Pope Innocent III (On the Mystical Mass, bk. 2, ch. 41), in which things already has shined not only Primasius, Prosper and others of the ancients, but even so at some time Augustine himself, To the false articles imputed to himself, article 1… Indeed the Synod of Dort itself evidently intimates that in the Second Head of Doctrine, sections 3 &amp; 8… But yet we choose fairly enough not to bring this distinction to the place of Paul upon which we treat. That is to be demonstrated shortly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative</cite>, A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious… (Groningen, 1658) | Exercitation 2. Places customarily used to support universal redemption are weighed: 1 Tim. 2:6, the distinction between the sufficiency and efficacy of the death of Christ; Rom. 5:18; Heb. 2:9, ‘every man’, what it is; Jn. 1:9 &amp; 1 Jn. 2:2, in which the true sense is propounded and vindicated: other testimonies on the term ‘world’ 58-102</span></figcaption>

<blockquote><p>Let us remember, on the other hand, that while life is promised universally to all who believe in Christ, still faith is not common to all. For Christ is made known and held out to the view of all, but the elect alone are they whose eyes God opens, that they may seek him by faith. Here, too, is displayed a wonderful effect of faith; for by it we receive Christ such as he is given to us by the Father—that is, as having freed us from the condemnation of eternal death, and made us heirs of eternal life, because, by the sacrifice of his death, he has atoned for our sins, that nothing may prevent God from acknowledging us as his sons. Since, therefore, faith embraces Christ, with the efficacy of his death and the fruit of his resurrection, we need not wonder if by it we obtain likewise the life of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, vol. 1 (Bellingham, WA: Logos Bible Software, 2010), 125.</span></figcaption>

<blockquote><p>But in some places “the cross” also indicates the doctrine that Christ died for sinners on the cross – the atonement that He made for sinners by His suffering for them on the cross, the complete and perfect sacrifice for sin that He offered when He gave His own body to be crucified. In short, this one word, the cross, stands for Christ crucified, the only Savior. This is the meaning in which Paul used the expression when he told the Corinthians the word of the cross is foolishness to those that perish (1 Corinthians 1:18). This is the meaning in which he wrote to the Galatians, God forbid that I should glory, save in the cross. He simply meant, “I glory in nothing but Christ crucified as the salvation of my soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross: Crucified with Christ, and Christ Alive in Me</cite>, (Abbotsford, Wisconsin: Aneko Press, 2019), 12–13, Kindle Edition.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-dcbce42157" data-kw="">
<blockquote><p>If Christ died for each and every person, then he even died for those who were already at that time in hell, as Esau, Saul, Ahitophel, and even for those also whom he certainly knew would be going there. But, [he did not die] for those who were already at that time in hell, because there is no liberation from hell (Luke 16); Nor also for those whom he certainly knew would be going there, seeing that all those to be damned will have the same condition (excepting the gradation of penalties, which is disparate). Therefore, Christ did not die for each and every person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exegesis Logica et Theologica Augustanae Confessionis</cite>, (Amsterdam: Johannes Janssonius, 1652), pp 134-35. Quoted in Michael J. Lynch, John Davenant’s Hypothetical Universalism: A Defense of Catholic and Reformed Orthodoxy (New York: Oxford University Press, 2021), p. 111.</span></figcaption>

</figure><figure class="quote" id="q-c342d9a693" data-kw="">
<blockquote><p>It is God that we have to deal withal in Ordinances, that sheds a glory, casts a Majesty, and puts an efficacy into all the Ordinances we have to deal withal: It is he who makes the Promises of the Word rocks of stay and support, that makes the commands of the Word full of authority, that makes the threatenings of the Word exceeding terrible[.]

It is he that we have to deal withal, that makes a little handful of water, a little bit of bread, and sup of wine, exceeding glorious and efficacious. What empty, what poor, what contemptible things would these be (and are to unbelieving men) if we had not to do with God in them? It is this God we have to do withal, that casts a Majesty upon, and puts an efficacy into every Ordinance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is God that we have to deal withal in Ordinances, that sheds a glory, casts a Majesty, and puts an efficacy into all the Ordinances we have to deal withal: It is he who makes the Promises of the Word rocks of stay and support, that makes the commands of the Word full of authority, that makes the threatenings of the Word exceeding terrible[.]

It is he that we have to deal withal, that makes a little handful of water, a little bit of bread, and sup of wine, exceeding glorious and efficacious. What empty, what poor, what contemptible things would these be (and are to unbelieving men) if we had not to do with God in them? It is this God we have to do withal, that casts a Majesty upon, and puts an efficacy into every Ordinance.”

<blockquote><p>Doct. That Christ is set forth in the gospel, as having all men’s sins laid upon him. The word carrieth it in such a general way, that none is excepted, and there are very many other places to confirm it, where Christ is said to reconcile the world: 2 Cor. 5:19, ‘God was in Christ, reconciling the world to himself;’ and to ‘taste death for every man,’ Heb. 2:9; and to ‘die for all.’ It is good to mark that: 2 Cor. 5:14, ‘If one died for all.’ I shall come to the reasons why Christ is proposed so generally.

1. Because all men in some sort have benefit by him. So far Christ suffered his Father’s wrath that was due to all men’s sins, that in a large sense they have benefit by him. All the common mercies we enjoy we have by virtue of Christ’s death. You know how the threatening ran, ‘In the day thou eatest thereof, thou shalt die,’ Gen. 2:17; nay, it is ‘surely die.’ And all mankind might have been lost; but yet you see the absolute accomplishment of the sentence, even to wicked men, is referred to the day of judgment. The worst, at least, enjoy a reprieve by Christ.

In this sense it is said, 1 Tim. 4:10, ‘We trust in the living God, who is the Saviour of all men, especially of them that believe.’ Such as is spoken of, Ps. 36:6, ‘O Lord, thou preservest man and beast;’ by a common salvation and preservation. And the word σωτὴρ which is usually applied to Christ as Mediator, is used there to hint that it cometh by Christ; though it be a common mercy, it is from him. Thus it is said, Eph. 1:10, ‘That in the dispensation of the fulness of time he might gather together in one all, things in Christ, both which are in heaven, and which are on earth, even in him.’

Some understand it of collecting the scattered parts of the world, and renewing the creature, which, had it not been for Christ, would have been lost. As an orator collects the heads of a discourse, that nothing be lost, and bringeth it into one sum. So the heathens, all their mercies come to them swimming in the blood of Christ; so. the word, ordinances, covenant, and outward graces to the church. Thus he suffered for the sins of the whole world, that the whole should enjoy these common favours and blessings by him.

2. Because there is a sufficiency in the merits of Christ for all, so that if it had pleased God to give Christ to all mankind, his justice had been sufficiently satisfied. For there is no defect in the Redeemer, and therefore there are so many general expressions in scripture to set out the value of Christ’s sacrifice; so that if there were ten thousand times more sins committed than there are, here is enough to expiate them all, the person that suffered being so eminent, and the sufferings so great and infinite. Those that perish do not perish out of any defect or insufficiency in the merit of Christ, as if enough were not done to save them; but out of their own fault, because they did not believe it.

Thus it is said, 1 Cor. 15:22, ‘For as in Adam all die, so in Christ shall all be made alive;’ that is, as there was a sufficiency in Adam, the first common person, to ruin all his posterity, so there was a sufficiency in Christ to save all that Adam ruined; for it must needs be understood so, for take it literally and it is against all common experience. Many know not Christ, many hate him and will not come unto him: “Ye will not come unto me, that ye may have life;’ Rom. 5:18, ‘Therefore, as by the offence of one judgment came upon all to condemnation; even so by the righteousness of one the free gift came upon all men to justification of life.’ The text proveth nothing but that there was as much sufficiency in Christ to justify, as there was in Adam to condemn. That we may not have too low and undervaluing thoughts of Christ’s sufferings, the scripture speaks thus generally: there is enough for me and thee, and all the world. It is a great injury done to Christ to lessen and extenuate him beneath Adam, as if he were not as able to recover as the other to ruin us.

3. Therefore it is expressed thus generally, that all conditions of men might be included. God would not have any enclosure of his mercy within the bounds of any nation, persons, and conditions of men, that he might take off all outward exceptions, and comprise every believer, of what condition and rank soever; and therefore he expresseth himself promiscuously to all of every state, every nation, every order. It is the nature of man to confine privileges to their own nation and order. We would be singular and shine alone, and have none share with us; envy, I say, grudgeth at the commonest mercies. We see in common things nothing is so welcome to us as that which we enjoy alone. The Romans would be the only civil nation, all else were barbarians. The Romish clergy would have all learning and knowledge confined within their function; and the Jews could not endure to hear of a general salvation for other nations.

It was the harshest note that could be sounded in their ears, that Christ died for all. It is much urged by the apostle, because of the rage of the Jews, for the enlargement of the pale of God’s church. Therefore I conceive the apostle did inculcate, and so largely insist upon it, to meet with this perverseness of the Jews, as that which they would never hear of. In this sense it is said, Heb. 2:9, he ‘tasted death for every man;’ and so 1 John 2:2, ‘And he is the propitiation for our sins, and not for ours only, but also for the sins of the whole world;’ that is, not only for us Jews, but for all the world, even of all places, orders, and ranks. God would not have the creatures envy it to any man, he proposeth it so generally to take away that Jewish indignation against the Gentiles. Therefore the apostles do so plentifully abound in these expressions.

4. That no man might accuse God as if he had not made sufficient provision for, his soul. Men are apt to transfer their guilt; though they will not charge Christ with it in a way of faith, they will charge God with it in a way of censure; as Prov. 19:3, ‘The foolishness of man perverteth his way, and his heart fretteth against the Lord.’ It is their own folly and unbelief, and we are apt to impute it to God, as if he did not intend Christ to us. Now there would be more occasion offered, if the Lord should have pointed out by name those to whom he intended Christ. God keepeth it secret what he will do with men, that he may provoke them to endeavours after duty, leaving themselves to his good pleasure.

No man can plead now, as an excuse for his negligence, that God left him out; it is we leave out ourselves; and therefore the proposal and offer of Christ is general. God hath expressed enough of his will to show man his duty, though not enough of his will to tell man his pleasure and secret intention. Now the will of God concerning any particular person is hidden. Men would fain excuse themselves of duty by prying into God’s secrets. God giveth a check to such curious impudence, by making the proposal and offer of Christ general, though his intentions to give Christ may be particular; yet we must not meddle with that. Foolish curiosity proceeds from an innate desire in the creature to charge God with all its miscarriages: Deut. 29:29, ‘Secret things belong unto the Lord, but those things which are revealed belong to us, and our children for ever.’ The proposal of Christ in the gospel, that is a revealed thing, and it belongeth to the creatures. God would have it carried so as rather typing out duty to them than revealing his own purposes; he would not give the creature such an occasion to murmur.

5. To denote the multitude that should come into Christ, especially in the latter times; they are as good as a whole world: he ‘so loved the world,’ John 3:16. It is understood by many of mundus credentium; they were but a world when Christ saved them. God’s elect, compared with the wicked world, are but a little flock by themselves, but they are accounted in the scripture as innumerable: Rev. 7:9, ‘I beheld, and lo, a great multitude, which no man could number, of all nations, and kindreds, and people, and tongues, stood before the throne, and before the Lamb, clothed with white robes, and palms in their hands.’ Mark, it is a multitude which none can number; the sheep of Christ’s flock are so many that it is innumerable: in a sort especially, there shall be a great increase in the last times. And thus you may expound that place: Heb. 2:9, ‘He tasted death for every man.’

In the next verse it is so intended, ‘in bringing many sons unto glory.’ So Ps. 2:8, ‘Ask of me, and I will give thee the heathen for an inheritance, and the uttermost parts of the earth for thy possession.’ The gospel shall then be spread far and near. God hath given Christ to have and to hold all the world: Heb. 1:3, ‘Whom he hath appointed heir of all things.’ And it is said in the 10th verse of this Isa. 53, that ‘the pleasure of the Lord shall prosper in his hands.’ Therefore the scripture speaketh this generally, to comprise the vast multitude that should embrace the doctrine of Christ.

6. To denote the oneness, or the one way by which all are reconciled to God: all that have it have it by Christ. I say, many times the expressions are general, to show that God disposeth of the sins of all his people one way. Such expressions are rather exclusive of other ways, than inclusive and comprising all persons. God is said to lay the iniquities of us all upon Christ, because all those whose iniquities are disposed in a merciful way, they are disposed this way.

Let me exemplify this a little: —The philosophers define good thus … good is that which all things desire. It is not to be understood as if all things in the world did desire good; for stones and timber, and many other things, have no appetite. The meaning is, all things that desire, desire that which is good. But I will give you instances in scripture: Col. 1:20, ‘And having made peace through the blood of his cross, by him to reconcile all things unto himself.’ Not that everything is reconciled, but everything that is reconciled, is reconciled this way, by the blood of Christ’s cross. So Titus 2:11, ‘The grace of God that bringeth salvation hath appeared to all men;’ that is, to all to whom salvation is brought, it is brought by the grace of God; it rather noteth Christ’s merits than the persons that enjoy it.

Divers such expressions there are in scripture. Thus, John 1:9, ‘That was the true light which lighteth every man that cometh into the world.’ Not that every man that cometh into the world is enlightened, there are many that perish and die in their ignorance: the meaning is, every man that is enlightened, is enlightened by him. As, for example, such a man cured all the city; not that every particular man was cured, but all that were cured were cured by him: so Christ is the Saviour of all men, that is, of all that are saved. These expressions are exclusive of all other ways, not inclusive of every person. Thus you have the reasons.</p></blockquote>

+common+mercy%2C+it+is+from+him.+Thus+it+is+said%2C+Eph.+1%3A10%2C+%E2%80%98That+in+the+dispensation+of+the+fulness+of+time+he+might+gather+together+in+one+all%2C+things+in+Christ%2C+both+which+are+in+heaven%2C+and+which+are+on+earth%2C+even+in+him.%E2%80%99%0A%0ASome+understand+it+of+collecting+the+scattered+parts+of+the+world%2C+and+renewing+the+creature%2C+which%2C+had+it+not+been+for+Christ%2C+would+have+been+lost.+As+an+orator+collects+the+heads+of+a+discourse%2C+that+nothing+be+lost%2C+and+bringeth+it+into+one+sum.+So+the+heathens%2C+all+their+mercies+come+to+them+swimming+in+the+blood+of+Christ%3B+so.+the+word%2C+ordinances%2C+covenant%2C+and+outward+graces+to+the+church.+Thus+he+suffered+for+the+sins+of+the+whole+world%2C+that+the+whole+should+enjoy+these+common+favours+and+blessings+by+him.%0A%0A2.+Because+there+is+a+sufficiency+in+the+merits+of+Christ+for+all%2C+so+that+if+it+had+pleased+God+to+give+Christ+to+all+mankind%2C+his+justice+had+been+sufficiently+satisfied.+For+there+is+no+defect+in+the+Redeemer%2C+and+therefore+there+are+so+many+general+expressions+in+scripture+to+set+out+the+value+of+Christ%E2%80%99s+sacrifice%3B+so+that+if+there+were+ten+thousand+times+more+sins+committed+than+there+are%2C+here+is+enough+to+expiate+them+all%2C+the+person+that+suffered+being+so+eminent%2C+and+the+sufferings+so+great+and+infinite.+Those+that+perish+do+not+perish+out+of+any+defect+or+insufficiency+in+the+merit+of+Christ%2C+as+if+enough+were+not+done+to+save+them%3B+but+out+of+their+own+fault%2C+because+they+did+not+believe+it.%0A%0AThus+it+is+said%2C+1+Cor.+15%3A22%2C+%E2%80%98For+as+in+Adam+all+die%2C+so+in+Christ+shall+all+be+made+alive%3B%E2%80%99+that+is%2C+as+there+was+a+sufficiency+in+Adam%2C+the+first+common+person%2C+to+ruin+all+his+posterity%2C+so+there+was+a+sufficiency+in+Christ+to+save+all+that+Adam+ruined%3B+for+it+must+needs+be+understood+so%2C+for+take+it+literally+and+it+is+against+all+common+experience.+Many+know+not+Christ%2C+many+hate+him+and+will+not+come+unto+him%3A+%E2%80%9CYe+will+not+come+unto+me%2C+that+ye+may+have+life%3B%E2%80%99+Rom.+5%3A18%2C+%E2%80%98Therefore%2C+as+by+the+offence+of+one+judgment+came+upon+all+to+condemnation%3B+even+so+by+the+righteousness+of+one+the+free+gift+came+upon+all+men+to+justification+of+life.%E2%80%99+The+text+proveth+nothing+but+that+there+was+as+much+sufficiency+in+Christ+to+justify%2C+as+there+was+in+Adam+to+condemn.+That+we+may+not+have+too+low+and+undervaluing+thoughts+of+Christ%E2%80%99s+sufferings%2C+the+scripture+speaks+thus+generally%3A+there+is+enough+for+me+and+thee%2C+and+all+the+world.+It+is+a+great+injury+done+to+Christ+to+lessen+and+extenuate+him+beneath+Adam%2C+as+if+he+were+not+as+able+to+recover+as+the+other+to+ruin+us.%0A%0A3.+Therefore+it+is+expressed+thus+generally%2C+that+all+conditions+of+men+might+be+included.+God+would+not+have+any+enclosure+of+his+mercy+within+the+bounds+of+any+nation%2C+persons%2C+and+conditions+of+men%2C+that+he+might+take+off+all+outward+exceptions%2C+and+comprise+every+believer%2C+of+what+condition+and+rank+soever%3B+and+therefore+he+expresseth+himself+promiscuously+to+all+of+every+state%2C+every+nation%2C+every+order.+It+is+the+nature+of+man+to+confine+privileges+to+their+own+nation+and+order.+We+would+be+singular+and+shine+alone%2C+and+have+none+share+with+us%3B+envy%2C+I+say%2C+grudgeth+at+the+commonest+mercies.+We+see+in+common+things+nothing+is+so+welcome+to+us+as+that+which+we+enjoy+alone.+The+Romans+would+be+the+only+civil+nation%2C+all+else+were+barbarians.+The+Romish+clergy+would+have+all+learning+and+knowledge+confined+within+their+function%3B+and+the+Jews+could+not+endure+to+hear+of+a+general+salvation+for+other+nations.%0A%0AIt+was+the+harshest+note+that+could+be+sounded+in+their+ears%2C+that+Christ+died+for+all.+It+is+much+urged+by+the+apostle%2C+because+of+the+rage+of+the+Jews%2C+for+the+enlargement+of+the+pale+of+God%E2%80%99s+church.+Therefore+I+conceive+the+apostle+did+inculcate%2C+and+so+largely+insist+upon+it%2C+to+meet+with+this+perverseness+of+the+Jews%2C+as+that+which+they+would+never+hear+of.+In+this+sense+it+is+said%2C+Heb.+2%3A9%2C+he+%E2%80%98tasted+death+for+every+man%3B%E2%80%99+and+so+1+John+2%3A2%2C+%E2%80%98And+he+is+the+propitiation+for+our+sins%2C+and+not+for+ours+only%2C+but+also+for+the+sins+of+the+whole+world%3B%E2%80%99+that+is%2C+not+only+for+us+Jews%2C+but+for+all+the+world%2C+even+of+all+places%2C+orders%2C+and+ranks.+God+would+not+have+the+creatures+envy+it+to+any+man%2C+he+proposeth+it+so+generally+to+take+away+that+Jewish+indignation+against+the+Gentiles.+Therefore+the+apostles+do+so+plentifully+abound+in+these+expressions.%0A%0A4.+That+no+man+might+accuse+God+as+if+he+had+not+made+sufficient+provision+for%2C+his+soul.+Men+are+apt+to+transfer+their+guilt%3B+though+they+will+not+charge+Christ+with+it+in+a+way+of+faith%2C+they+will+charge+God+with+it+in+a+way+of+censure%3B+as+Prov.+19%3A3%2C+%E2%80%98The+foolishness+of+man+perverteth+his+way%2C+and+his+heart+fretteth+against+the+Lord.%E2%80%99+It+is+their+own+folly+and+unbelief%2C+and+we+are+apt+to+impute+it+to+God%2C+as+if+he+did+not+intend+Christ+to+us.+Now+there+would+be+more+occasion+offered%2C+if+the+Lord+should+have+pointed+out+by+name+those+to+whom+he+intended+Christ.+God+keepeth+it+secret+what+he+will+do+with+men%2C+that+he+may+provoke+them+to+endeavours+after+duty%2C+leaving+themselves+to+his+good+pleasure.%0A%0ANo+man+can+plead+now%2C+as+an+excuse+for+his+negligence%2C+that+God+left+him+out%3B+it+is+we+leave+out+ourselves%3B+and+therefore+the+proposal+and+offer+of+Christ+is+general.+God+hath+expressed+enough+of+his+will+to+show+man+his+duty%2C+though+not+enough+of+his+will+to+tell+man+his+pleasure+and+secret+intention.+Now+the+will+of+God+concerning+any+particular+person+is+hidden.+Men+would+fain+excuse+themselves+of+duty+by+prying+into+God%E2%80%99s+secrets.+God+giveth+a+check+to+such+curious+impudence%2C+by+making+the+proposal+and+offer+of+Christ+general%2C+though+his+intentions+to+give+Christ+may+be+particular%3B+yet+we+must+not+meddle+with+that.+Foolish+curiosity+proceeds+from+an+innate+desire+in+the+creature+to+charge+God+with+all+its+miscarriages%3A+Deut.+29%3A29%2C+%E2%80%98Secret+things+belong+unto+the+Lord%2C+but+those+things+which+are+revealed+belong+to+us%2C+and+our+children+for+ever.%E2%80%99+The+proposal+of+Christ+in+the+gospel%2C+that+is+a+revealed+thing%2C+and+it+belongeth+to+the+creatures.+God+would+have+it+carried+so+as+rather+typing+out+duty+to+them+than+revealing+his+own+purposes%3B+he+would+not+give+the+creature+such+an+occasion+to+murmur.%0A%0A5.+To+denote+the+multitude+that+should+come+into+Christ%2C+especially+in+the+latter+times%3B+they+are+as+good+as+a+whole+world%3A+he+%E2%80%98so+loved+the+world%2C%E2%80%99+John+3%3A16.+It+is+understood+by+many+of+mundus+credentium%3B+they+were+but+a+world+when+Christ+saved+them.+God%E2%80%99s+elect%2C+compared+with+the+wicked+world%2C+are+but+a+little+flock+by+themselves%2C+but+they+are+accounted+in+the+scripture+as+innumerable%3A+Rev.+7%3A9%2C+%E2%80%98I+beheld%2C+and+lo%2C+a+great+multitude%2C+which+no+man+could+number%2C+of+all+nations%2C+and+kindreds%2C+and+people%2C+and+tongues%2C+stood+before+the+throne%2C+and+before+the+Lamb%2C+clothed+with+white+robes%2C+and+palms+in+their+hands.%E2%80%99+Mark%2C+it+is+a+multitude+which+none+can+number%3B+the+sheep+of+Christ%E2%80%99s+flock+are+so+many+that+it+is+innumerable%3A+in+a+sort+especially%2C+there+shall+be+a+great+increase+in+the+last+times.+And+thus+you+may+expound+that+place%3A+Heb.+2%3A9%2C+%E2%80%98He+tasted+death+for+every+man.%E2%80%99%0A%0AIn+the+next+verse+it+is+so+intended%2C+%E2%80%98in+bringing+many+sons+unto+glory.%E2%80%99+So+Ps.+2%3A8%2C+%E2%80%98Ask+of+me%2C+and+I+will+give+thee+the+heathen+for+an+inheritance%2C+and+the+uttermost+parts+of+the+earth+for+thy+possession.%E2%80%99+The+gospel+shall+then+be+spread+far+and+near.+God+hath+given+Christ+to+have+and+to+hold+all+the+world%3A+Heb.+1%3A3%2C+%E2%80%98Whom+he+hath+appointed+heir+of+all+things.%E2%80%99+And+it+is+said+in+the+10th+verse+of+this+Isa.+53%2C+that+%E2%80%98the+pleasure+of+the+Lord+shall+prosper+in+his+hands.%E2%80%99+Therefore+the+scripture+speaketh+this+generally%2C+to+comprise+the+vast+multitude+that+should+embrace+the+doctrine+of+Christ.%0A%0A6.+To+denote+the+oneness%2C+or+the+one+way+by+which+all+are+reconciled+to+God%3A+all+that+have+it+have+it+by+Christ.+I+say%2C+many+times+the+expressions+are+general%2C+to+show+that+God+disposeth+of+the+sins+of+all+his+people+one+way.+Such+expressions+are+rather+exclusive+of+other+ways%2C+than+inclusive+and+comprising+all+persons.+God+is+said+to+lay+the+iniquities+of+us+all+upon+Christ%2C+because+all+those+whose+iniquities+are+disposed+in+a+merciful+way%2C+they+are+disposed+this+way.%0A%0ALet+me+exemplify+this+a+little%3A+%E2%80%94The+philosophers+define+good+thus+%E2%80%A6+good+is+that+which+all+things+desire.+It+is+not+to+be+understood+as+if+all+things+in+the+world+did+desire+good%3B+for+stones+and+timber%2C+and+many+other+things%2C+have+no+appetite.+The+meaning+is%2C+all+things+that+desire%2C+desire+that+which+is+good.+But+I+will+give+you+instances+in+scripture%3A+Col.+1%3A20%2C+%E2%80%98And+having+made+peace+through+the+blood+of+his+cross%2C+by+him+to+reconcile+all+things+unto+himself.%E2%80%99+Not+that+everything+is+reconciled%2C+but+everything+that+is+reconciled%2C+is+reconciled+this+way%2C+by+the+blood+of+Christ%E2%80%99s+cross.+So+Titus+2%3A11%2C+%E2%80%98The+grace+of+God+that+bringeth+salvation+hath+appeared+to+all+men%3B%E2%80%99+that+is%2C+to+all+to+whom+salvation+is+brought%2C+it+is+brought+by+the+grace+of+God%3B+it+rather+noteth+Christ%E2%80%99s+merits+than+the+persons+that+enjoy+it.%0A%0ADivers+such+expressions+there+are+in+scripture.+Thus%2C+John+1%3A9%2C+%E2%80%98That+was+the+true+light+which+lighteth+every+man+that+cometh+into+the+world.%E2%80%99+Not+that+every+man+that+cometh+into+the+world+is+enlightened%2C+there+are+many+that+perish+and+die+in+their+ignorance%3A+the+meaning+is%2C+every+man+that+is+enlightened%2C+is+enlightened+by+him.+As%2C+for+example%2C+such+a+man+cured+all+the+city%3B+not+that+every+particular+man+was+cured%2C+but+all+that+were+cured+were+cured+by+him%3A+so+Christ+is+the+Saviour+of+all+men%2C+that+is%2C+of+all+that+are+saved.+These+expressions+are+exclusive+of+all+other+ways%2C+not+inclusive+of+every+person.+Thus+you+have+the+reasons.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Practical+Exposition+upon+the+Fifty-Third+Chapter+of+Isaiah%2C+%281703%29+in+The+Complete+Works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%3A+James+Nisbet+%26+Co.%2C+1871%29%2C+3%3A+328-31.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F790d309c32.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/790d309c32.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/06/thomas-manton-on-the-infinite-sufficiency-of-christs-death/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The current of sin dries not up, but runs constantly while we are in this life. It is true, it is much diminished in a believer, and it runs not in such an universal flood over the whole man as it is in the unbeliever. Yet there is a living spring of sin within the godly, which is never ceasing to drop out pollution and defilement, either upon their whole persons, or, at least, to intermingle it with their good actions.

Now, there is no comfort for this, but this one, that there is another stream of the blood of Jesus Christ that never dries up, is never exhausted, never emptied, but flows as full and as free, as clear and fresh as ever it did: and this is so great, and of so great virtue, that it is able to swallow up the stream of our pollutions, and to take away the daily filth of a believer’s conversation.

Now indeed, though the blood of Jesus Christ be of such infinite virtue and efficacy, that it were sufficient to cleanse the sins of the whole world, it would be an over-ransom for the souls of all men, there is so much worth in it. That flood of guiltiness that hath drowned the world, — this flood of Christ’s blood that gushed out of his side, is of sufficient virtue to cleanse it perfectly away.

Notwithstanding of this absolute universal sufficiency, yet certain it is, that it is not actually applied unto the cleansing of all men’s sins, but yet the most part of men are still drowned in the deluge of their own wickedness, and lie entombed in darkness; therefore it concerns us to know the way of the application of this blood to the cleansing of sinners; and this way is set down in this verse, “If we confess our sins, he is just to forgive.</p></blockquote>

</figure><figure class="quote" id="q-87827b9e38" data-kw="">
<blockquote><p>Nor do they speak in a satisfactory manner who annul by the sacraments the operation of the internal influence in the soul, and yet suppose that these same sacraments, whatever are the causes, do infallibly produce grace—God uniformly operating in virtue of a certain law or covenant, whereon the sacraments are observed. For although these persons ascribe the whole influence to God, and not to the sacraments, yet they do not avoid the other mischiefs of the opinion formerly mentioned (that which ascribes to the sacraments an influence of a physical kind). For they connect the divine influence with these signs, as if it could operate only when they are present, which is altogether false, since even before the sacraments are partaken of, God is accustomed to bestow his grace, of the acceptance of which these are but the signs and tokens.

And, indeed, their opinion differs but little from the superstitious notion of magical incantations by signs and words—just as Scripture frequently gives the name of sorcerers to those corrupters of religion who attach importance in sacred matters only to external words and signs. And besides, they fix the minds of believers far too strongly upon these mere external symbols, so that they are apt to imagine that, apart from them, the grace of God and eternal life can scarcely be bestowed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-burman.html">Francis Burman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis theologiæ, &amp; speciatim oeconomiæ foederum</cite>, Dei (Amsterdam, 1699), Bk VII, chap. iv, sect. 28. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 181-82.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-cd865c3ee5" data-kw="">
<blockquote><p>As for the universal Redemption of all and every man, it is no better then a forgery of man’s brain. There shall be many in the day of judgement of whom Christ shall say, that he never knew them. Again he saith, He which believeth not is already judged, and the wrath of God abides upon him. But if all were effectually redeemed, &amp; only condemned for not believing in Christ, it should have been said that they are already judged, and that the wrath of God not abides but returns upon them. Christ makes no intercession for the world: and therefore his redemption is not effectual to all men. For the intercession is the means of applying the satisfaction.

If it be said that by the world is meant only contemners of grace, it appears to be otherwise in that Christ opposeth the world to them which are the fathers, and are given to Christ by him: thereby signifying that by the world he means all such as are not the fathers, and were never given to Christ. And he lays down his life for his sheep: now the sheep have all these brands or marks; they hear his voice, they know him, they follow him, they shall not perish, none shall pluck them out of Christs hands: and these are only such of whom Paul saith; Who shall lay any thing to the charge of Gods elect: it is God that justifieth who shall condemn? And if this should be true, that Christ was crucified and died no less to make satisfaction for the sins of the damned, then for the sins of Peter and Paul and the rest of the Saints, it follows necessarily that all their sins are forgiven: considering that remission of sin depends inseparably upon satisfaction made to Gods justice for sin: and satisfaction doth necessarily abolish all fault.

We grant that Christ’s death is sufficient to save many thousand worlds: we grant again it is every way most effectual in it self: but that it is effectual in, or unto the person of every man, that we deny. For if it were thus effectual, then it should be applied to the person of every man, as to Cain, Judas, Nero, Heliogabalus, &amp;c. even as the plaster is laid to the sore: being applied, Christs righteousness should be imputed for the justification and sanctification of all and every man: and thus some justified before God and sanctified should after go to hell and be damned, whereas David, never so much as dreaming of this divinity saith, that they are blessed which have the pardon of their sins: and Paul, that they which are justified have peace with God.</p></blockquote>

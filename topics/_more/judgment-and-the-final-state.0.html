</figure><figure class="quote" id="q-d3ee86e352" data-kw="">
<blockquote><p>We learn, lastly, how dreadful is the end to which unbelief can bring man. Our Lord says to his enemies, “If ye believe not that I am He, ye shall die in your sins.”

These solemn words are invested with peculiar solemnity when we consider from whose lips they came. Who is this that speaks of men dying “in their sins,” unpardoned, unforgiven, unfit to meet God – of men going into another world with all their sins upon them? He that says this is no other than the Saviour of mankind, who laid down His life for His sheep – the loving, gracious, merciful, compassionate Friend of sinners. It is Christ Himself! Let this simple fact not be overlooked.

They are greatly mistaken who suppose that it is harsh and unkind to speak of hell and future punishment. How can such people get over such language as that which is before us? How can they account for many a like expression which our Lord used, and specially for such passages as those in which He speaks of the “worm that dieth not, and the fire that is not quenched”? (Mark 9:46.) They cannot answer these questions. Misled by a false charity and a morbid amiability, they are condemning the plain teaching of the Scripture, and are wise above that which is written.

Let us settle it in our minds, as one of the great foundation truths of our faith, that there is a hell. Just as we believe firmly that there is an eternal heaven for the godly, so let us believe firmly that there is an eternal hell for the wicked. Let us never suppose that there is any lack of charity in speaking of hell. Let us rather maintain that it is the highest love to warn men plainly of danger, and to beseech them to “flee from the wrath to come.” It was Satan, the deceiver, murderer, and liar, who said to Eve in the beginning, “Ye shall not surely die.” (Gen. 3:4.) To shrink from telling men, that except they believe they will “die in their sins,” may please the devil, but surely it cannot please God.

Finally, let us never forget that unbelief is the special sin that ruins men’s souls. Had the Jews believed on our Lord, all manner of sin and blasphemy might have been forgiven them. But unbelief bars the door in mercy’s face, and cuts off hope. Let us watch and pray hard against it. Immorality slays its thousands, but unbelief its tens of thousands. One of the strongest sayings ever used by our Lord was this–“He that believeth not shall be damned.” (Mark 16:16.)</p></blockquote>

</figure><figure class="quote" id="q-fcb03157a9" data-kw="">
<blockquote><p>To move them to this purpose to pray for him, or rather for the Gospel, he brings in their own example and experience. Thessalonians. I wish you not to pray for another thing but that ye have experimented your selves; see whether or not the Gospel be glorified among you? yea it is glorified. Ye are not bare professors of it: then are ye not bound to pray the Lord to communicate to other that grace that is bestowed on you? So they who finds the Gospel glorified in themselves, and finds her powerful in their hearts to a sanctified life, are bound to wish and crave this blessing to every soul. if it were possible. Wherefore shall I have a grace if I pray not to God to communicate that grace to another?

Wherefore should I enter in Heaven and not put out my hand to help others to that kingdom, if it be possible? Wherefore should I not pray, thy kingdom come? which is nothing in effect, but, Lord, open Heaven to thy people, and let many enter in, that thou may be glorified. And it is most certain, that, if a man have entered himself in Heaven, he will not inuy [sic] to have others with him; but he will strive to make room, if it were to all the world, that they may enter in. He will not be like the Pharisees that will not enter in Heaven themselves, neither yet will let others enter in it. A man that is once in the light he would have all in the light. As a man that is in darkness would have all in darkness with him.</p></blockquote>

<blockquote><p>The finally lost are not to be conceived of as having faint desires and aspirations for a holy and heavenly state, and as feebly but really inclined to sorrow for their sin, but are kept in hell contrary to their yearning and petition. They are sometimes so described by the opponent of the doctrine, or at least so thought of.

There is not a single throb of godly sorrow, or a single pulsation of holy desire, in the lost spirit. The temper toward God in the lost is angry and defiant. “They hate both me and my father,” says the Son of God, “without a cause” (John 15:24, 25). Satan and his followers “love darkness rather than light,” hell rather than me heaven, “ because their deeds are evil ” (John 3:19). Sin ultimately assumes a fiendish form, and degree. It is pure wickedness without regret or sorrow, and with a delight in evil for evil’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Endless Punishment</cite>, (New York: Charles Scribner’s Sons, 1886), p. 155.</span></figcaption>

</figure><figure class="quote" id="q-59faa2a41f" data-kw="">
<blockquote><p>Finally, in the Difference of the Definition is mentioned its End; the supreme End of Revealed Theology is the Glory of God; which He set before Himself in all His works, Proverbs 16:4, but especially in Redemption, 1 Peter 2:9, and its doctrine, Ephesians 3:10, even as Redemption and its doctrine show forth most perfectly the Glory of God, through a demonstration of His highest attributes.

The subordinate End is the Salvation of the Elect, John 20:31; Titus 1:2. Because, of course, in the Salvation of the Elect the Attributes of God shall be most gloriously manifested, and shall be most perfectly acknowledged and celebrated forever by Those Saved, 2 Thessalonians 1:10; hence the Salvation of the Elect shall be as advantageous as possible to the Glory of God as the supreme End; and hence the whole work of Redemption has subordinate End, the leading of the Elect unto Salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 36, p. 243.</span></figcaption>

e-salvation-of-gods-elect/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-3e5e06c825" data-kw="">
<blockquote><p>Men may deny that there is a God, or that they have souls, or that there is a world external to themselves. The zeal and persistency with which they endeavour to prove that there is no hell is no argument against the reality of it; rather the contrary. …

There are many methods of assault upon the doctrine. One is to admit that the Bible teaches it clearly, and then to make this fact a proof against the Bible’s inspiration and authority, the doctrine itself being too absurd and monstrous to be believed. Another is to admit the inspiration and authority of the Bible, and upon this ground to argue that it cannot teach the doctrine, and that the places which seem to teach it must receive some other interpretation.

These two methods are the same in principle. In both the reason of man is made the judge as to what a revelation from God ought to contain. A third method, near akin to the last, if it can be called a method, feeling rather than logic being judge, is simply to take one’s stand on the goodness of God, and say it cannot be. …

A very striking confirmation of this is seen in the effect of the pagan and papal doctrine of purgatory. Purgatory, according to the Roman doctors, is not a place of discipline, but of true and proper punishment, to all intents and purposes a temporary hell. Yet how many thousands and millions prefer the prospect of it to the pains and self-denials of a life of repentance and holiness here!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Probation after Death (1889) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><figure class="quote" id="q-2f7cfa4eb3" data-kw="">
<blockquote><p>Familists make God in his nature and essence to dwell and work in all creatures, especially in the regenerate. But these are but fancies. 1. Because after Christ was raised from the dead to the glory of the Father and so entered into his glory, there is evidence that his manhead was entered in no degrees of communion in the essence power and glory of God equally with God; because there remaineth a body with flesh and bones that may be touched and handled. Luk. 24.36.37, 38, 39, 40. with the print of the nails in his hands and sides Joh. 20 27. now there is nothing of the nature, essential honour, and glory of God an infinite Spirit, that fills heaven and earth yea or of any spirit, in a body of bones flesh hands and feet and having in it such material and sensible qualities as the impression of wounds.

… Christ did eat with his disciples after his resurrection. Joh. 21.12, 13, 14, and so after he was entered in some degrees of glory and was seen of five hundred brethren at once 1 Cor. 15.6. Of Cleophas, of the twelve Apostles, of Paul also, now what ever partaketh of the essence of a Spirit, cannot eat, nor be seen with bodily eyes, and the disciples with their bodily eyes saw him ascend to heaven even till the clouds took him out of their sight. Acts 1. (3) The eyes of all believers and reprobates, even his enemies that pierced him, in the general Judgement shall see him: in which state Swenckefeldius dreams that the manhood is fully changed in the essence of God Rev. 1.7. now that the bodily eyes of men, and of Reprobate men, shall see the essence of God, who is invisible 1 Tim. 1.17. is a dream, for He dwells in light which no man can approach unto, though we nothing doubt but the man Christ, as man, is elevated now in heaven, to our uncomparable comfort, to such eminency of glory, above Men and Angels, as the capacity of a created thing can receive.

… [T]he Manhood of Christ is a creature, having beginning and a cause of being in time Mat. 1. Luk. 2 in the fullness of time Gal. 4. 4 was borne of a woman. Now what is man born of a woman that he should be equal in essence and nature with God? who is like unto God? Angels and created powers, cannot answer the question. God is essentially eternal, and eternity differenceth him from all things beside himself; Esay. 9.6. chap. 43.10. Before me there was no God, neither shall there be after me c. 40.28. Psal. 99.1, 2. Psal. 102.26.27. 1 Tim. 1.17. it’s then an everlasting contradiction, that a creature in time, can be a creator and a God before time, or partake of the essence of the eternal God, for God must then create another God, different in number from himself, our bodies shall be made conform to the glorious body of Christ. Phil. 3.21.

If the Manhood of Christ, and so his body, which is a part thereof, be changed into the essence of God, we must be like the very invisible and eternal essence of an infinite Spirit, and there is no glorifying of our bodies then, nor any resurrection, nor any caughting up of our bodies to the air to be ever with the Lord, but an utter extinction and an annihilation of our bodies and the body of Christ. Hence the flesh profiteth not, then the manhood does not spiritually quicken, give the Holy Ghost, justify, as Swenckefield says, but Christ God doth these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.5, pp 17-18.</span></figcaption>

evated+now+in+heaven%2C+to+our+uncomparable+comfort%2C+to+such+eminency+of+glory%2C+above+Men+and+Angels%2C+as+the+capacity+of+a+created+thing+can+receive.%0A%0A%E2%80%A6+%5BT%5Dhe+Manhood+of+Christ+is+a+creature%2C+having+beginning+and+a+cause+of+being+in+time+Mat.+1.+Luk.+2+in+the+fullness+of+time+Gal.+4.+4+was+borne+of+a+woman.+Now+what+is+man+born+of+a+woman+that+he+should+be+equal+in+essence+and+nature+with+God%3F+who+is+like+unto+God%3F+Angels+and+created+powers%2C+cannot+answer+the+question.+God+is+essentially+eternal%2C+and+eternity+differenceth+him+from+all+things+beside+himself%3B+Esay.+9.6.+chap.+43.10.+Before+me+there+was+no+God%2C+neither+shall+there+be+after+me+c.+40.28.+Psal.+99.1%2C+2.+Psal.+102.26.27.+1+Tim.+1.17.+it%E2%80%99s+then+an+everlasting+contradiction%2C+that+a+creature+in+time%2C+can+be+a+creator+and+a+God+before+time%2C+or+partake+of+the+essence+of+the+eternal+God%2C+for+God+must+then+create+another+God%2C+different+in+number+from+himself%2C+our+bodies+shall+be+made+conform+to+the+glorious+body+of+Christ.+Phil.+3.21.%0A%0AIf+the+Manhood+of+Christ%2C+and+so+his+body%2C+which+is+a+part+thereof%2C+be+changed+into+the+essence+of+God%2C+we+must+be+like+the+very+invisible+and+eternal+essence+of+an+infinite+Spirit%2C+and+there+is+no+glorifying+of+our+bodies+then%2C+nor+any+resurrection%2C+nor+any+caughting+up+of+our+bodies+to+the+air+to+be+ever+with+the+Lord%2C+but+an+utter+extinction+and+an+annihilation+of+our+bodies+and+the+body+of+Christ.+Hence+the+flesh+profiteth+not%2C+then+the+manhood+does+not+spiritually+quicken%2C+give+the+Holy+Ghost%2C+justify%2C+as+Swenckefield+says%2C+but+Christ+God+doth+these.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+survey+of+the+spiritual+antichrist%2C+%28London%3A+Andrew+Crooke%2C+1648%29%2C+Part+1.5%2C+pp+17-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f7cfa4eb3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f7cfa4eb3.html">Permalink</a><a c <blockquote><p>I come now to a second motive, to stir us up to look after heavenly treasure, and not immoderately to love the world, and worldly vanities, because we are pilgrims here, and therefore must leave them in our passage, so we are Citizens of heaven, the new Jerusalem: the Apostle saith, we having through Christ an entrance unto the father by one spirit, are now no more strangers and foreigners, but Citizens with the Saints, and of the household of God: and speaking of Abraham the father of the faithful, he saith, That he abode in the land of promise, as in a strange country, and as one that dwelt in tents, because he looked for a City not made with hands, having a foundation whose builder and maker is God; neither was this peculiar to him alone, but general to all his Children, who followed him in the saith: of whom it is said, that they have here no continuing City, but seek one to come, Heb. 11. 6, 9, 10.

And the reason is apparent, for we are Citizens, and subjects of that Kingdom, whereof our Lord Jesus Christ is King, but he himself hath plainly told us, that his kingdom is not of this world, but that he reigneth and ruleth in that kingdom of eternal glory: and therefore whosoever are subjects unto him, they cannot be free denizens of the world, but Citizens of heaven.

It is no marvel that heretofore we living in ignorance, did not esteem of those divine excellencies, but preferred before them these worldly vanities: because they are subject to our selves, for there is no desire of that which is not known, and that bright sunshine day is all alike to him, who is stark-blind unto the darkest night. But now after that the grace of God which bringeth salvation unto all men, hath appeared, and taught us that we should deny ungodliness and worldly lusts, and that we should live soberly, righteously, and godly in this present world, looking for the blessed hope and appearing of the glory of the mighty God, and of our Saviour Jesus Christ, Titus 2. 11, 12, 13.

It were more then madness, if we should suffer our selves still to be transported with worldly concupiscence, and prefer the present satisfying of our carnal desires before the eternal fruition of our heavenly joys: we should not be always children wanting wit and experience in heavenly affairs, it is time now to put away childish things.

Whilst we remained in the state of slaves, and were the devoted vassals of sin and Satan, our base desires did well agree with our base condition, whilst we were Citizens of the world, and children of the earth, it might suit with our calling to desire earthly commodities, and esteem the riches, pleasures, and preferments of the place whereof we were inhabitants at high rates, but now that God hath dignified us with most royal privileges, and made us Citizens of heaven; and of the slaves of Satan, hath made us his own children by adoption and grace, yea heirs apparent of his glorious kingdom:

O let us, remembering this high calling, for shame forsake our base desires, not suffering our hearts to lie grovelling on the earth, wallowing in carnal pleasures, and worldly delights, but raising them up to the height of our hopes, let us aim at no less then crowns and kingdoms, and those not momentary, and of this world, seeing they are vain and of little worth, but those which are most glorious and eternal in the world to come.</p></blockquote>

<blockquote><p>It is therefore a great practical doctrine—that Jesus is not simply a Redeemer from sin, but the Founder and Head of a Kingdom. He has not only taught men a system of opinions concerning God, but instituted also, and rules over, a community. He hath given not simply a precept to be obeyed—a rule for the government of life—an opinion to be held by each individual separately—the body of his followers, like those of Socrates or Plato, combining merely by accidental agreement in opinion: far beyond all this.

He hath constructed a Society; his followers are made members of a community with new social relations. To believe in Jesus is not merely the adoption of an opinion. The very act of faith whereby his followers receive his doctrine, unites them also to Him as members of his mystical body, and through Him to one another. They become a combination of men who are members of one spiritual body—brethren of one holy family. And this is the Kingdom of Heaven.</p></blockquote>

<blockquote><p>The bodies of the wicked shall rise at the last day, but it shall be to their everlasting shame, ruin and confusion. They shall be immortal, but they shall be immortal fuel to immortal flames. The bodies of the wicked shall come out of their graves as out of their prisons, and as so many malefactors to appear before an angry Judge.

They shall come out of their graves as the chief Baker did out of prison, to be hung in chains in hell for ever, where they shall endure all kind of extremities figured out unto us by the sad condition of Dives, who could not get a drop of water to cool his tongue.

The bodies of the wicked shall be as ugly, loathsome carcasses to look upon, and their faces shall gather blackness and darkness, Isa. 66. 24. They shall arise with great fear and trembling, and shall call to the hills and mountains to cover and hide them from the presence of the Lamb. Oh the horror and astonishment that shall be at that day, when the foul of a wicked man shall come out of hell, and be again united to the body: How will the body curse the soul, and the soul the body? How will they befool one another? Certainly this greeting will be very terrible; the Lord grant we may never come to have experience of it.</p></blockquote>

<blockquote><p>The first [evidence of scripture’s divinity listed in the Westminster Confession] is, “the heavenliness of the matter.” The matter of the Scriptures, or the various subjects there treated of, have all a reference, more or less direct, to things celestial and divine. They are connected throughout with God, the unseen world, and the eternal destinies of man. No merely human or temporal object seems to be aimed at or attended to.

Everything is connected, more or less directly and palpably, with Him whose throne is in the heavens; with the celestial origin and dignity of his intelligent creatures; with their relations to heaven; and with the end and the means of restoring to heaven those who had forfeited their birthright. Everything connected with this world is represented in the aspect in which it is seen from heaven, and in the light of a higher world. There is nothing that is of the earth earthy.

All breathes of heaven, and tends to lead the thoughts and desires to things unseen and eternal. The guilt and depravity of men are indeed set forth in glowing colours, and exhibited in fearful specimens of what man is and has done. But it is held forth as rebellion against the God of heaven. It is represented in the light in which it usually appears, not so much to men themselves as to the purer inhabitants of a higher and a holier region; and it is unfolded for the purpose of shewing men what they have lost, and what difficulties stand in the way of their restoration to heaven and happiness, and in order to lead them to turn their thoughts to that state where there is no more sin and no more sorrow.

The Bible indeed shews that God has been pleased to make revelations of his will, conveying regulations about temporal and earthly things, especially in connection with that remarkable people whom he selected to put his name in them. And many of these regulations, though in some respects intended to serve temporary purposes, and not now fitted to effect all the same ends as they once did for a season, are recorded in the same Scriptures, and form a part of the word of God.

But even these things were all written for our instruction, on whom the ends of the world have come; they were all fitted and intended to have some reference to the heavenly as well as the earthly Canaan; and they are still found, under the guidance of God’s Spirit, to minister instruction that is profitable for guiding and directing men in their journey to the Jerusalem that is above. Such books, containing such matter, and so free from everything that indicates an earthly origin, must have come from God</p></blockquote>

</figure><figure class="quote" id="q-f7beaa23eb" data-kw="">
<blockquote><p>God will punish our original and actual sins both temporally and eternally. God punishes sin temporally with all manner of general and specific maladies of both soul and body, pouring out His just wrath upon sinners. God’s Word, and sooner or later our experience, yields thousands upon thousands of examples of what God does; and when we consider this rightly and reflect upon it, we clearly observe God’s hatred and wrath toward sin.

The nature of sinful men, however, is that their dreadful hardness of heart and perseverance in sin is such that they neither acknowledge nor feel God’s manifold punishments and judgments. As Scripture teaches, the more they are stricken, the more they revolt (Isa. 1:5).

However, due to His holiness and spotless righteousness, God will not only punish sin temporally, but also eternally. He is an eternally living and unchangeable God, and thus if the sinner is not converted during this life, he will eternally and unchangeably remain God’s enemy and will continue to sin against Him.

God must therefore of necessity continue to punish the sinner as being His enemy eternally, doing so with the most severe punishments and judgments in soul and body. The Holy Scriptures teach this very clearly and abundantly, describing for us the punishments of the damned and ungodly as an “eternal fire” (Matt. 25:46) “where their worm dieth not” (Mark 9:44) and as a smoke of torment that ascends forever and ever (Rev. 14:11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 52.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><figure class="quote" id="q-0b96ce840b" data-kw="">
<blockquote><p>It is a vain speculation, contrary to the analogy of faith, and destructive or the true nature of the oblation of Christ, and inconsistent with the dignity of his person, that he should carry with him into heaven a part of that material blood which was shed for us on the earth. This some have invented, to maintain a comparison in that wherein is none intended.

The design of the apostle is only to declare by virtue of what he entered as a priest into the holy place. And this was by virtue of his own blood when it was shed, when he offered himself unto God. This was that which the foundation of, and gave him right unto the administration of his priestly office in heaven. And hereby were all those good things procured which he effectually communicates unto us in and by that administration.</p></blockquote>

<blockquote><p>Q. 5. Can none enjoy him [God] in heaven, who do not glorify him on earth?

A. No adult person can scripturally expect happiness in heaven without holiness on earth; Heb. xii. 14. And holiness, without which no man shall see the Lord. Rom. viii. 30. Whom he justified, them he also glorified.</p></blockquote>

<blockquote><p>[The saints] in heaven will behold an outward glory as they [behold] the human nature of Christ, which is united to the Godhead, as it is the body of that person that is God. And there will doubtless be appearances of a divine and inimitable glory and beauty in Christ’s glorified body, which it will indeed be a ravishing and blessed sight to see.

But the beauty of Christ’s body that will be beheld with bodily eyes will be ravishing and delighting chiefly as it will express his spiritual glories. The majesty that will appear in Christ’s body will express and show forth the spiritual greatness and majesty of the divine nature. The pureness and beauty of that light and glory will express the perfection of the divine holiness. The sweetness and ravishing mildness of his countenance will express his divine and spiritual love and grace.

Thus it was, when the three disciples beheld Christ at his transfiguration upon the mount. They beheld a wonderful, outward glory in Christ’s body, an inexpressible beauty in his countenance; but that outward glory and beauty delighted them principally as it was an expression or signification of the divine excellencies of his mind, as we may see by their manner of speaking of it.

It was the sweet mixture there was of majesty and grace in his countenance that ravished them; 2 Peter 1:16–18, “We were eyewitnesses of his majesty. For he received from God the Father honour and glory, when there came such a voice to him from the excellent glory, This is my beloved Son, in whom I am well pleased. And this voice we heard when we were with him in the holy mount.”

But especially by the account that John gives of it; John 1:14, “And the Word was made flesh and dwelt among us (and we beheld his glory, the glory as of the only begotten of the Father), full of grace and truth,” where John very probably had in his mind what he had seen in the mount at the Transfiguration. Grace and truth are not outward but spiritual glories.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Pure in Heart Blessed</cite>, (1730) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 62-63.</span></figcaption>

</figure><figure class="quote" id="q-946a473912" data-kw="">
<blockquote><p>Opening heaven for us. What is this life but a wallowing in a sink, a converse in the dregs of creation, in an earth polluted by the sin of man, wherein we every day, behold fresh affronts of God, and find motions in us dishonourable to ourselves? But Christ by his death hath provided a better place than this, yea, a place more glorious than Adam’s paradise, which was designed for our habitation by the first creation; a place not only built by the word of God, but cemented and prepared by the blood of Christ.

By the law against sin we were to have our bodies reduced to dust, and our souls lie under the sentence of the wrath of God. But our crucified Saviour hath purchased the redemption of our body, to be evidenced by a resurrection, Rom. viii. 28, and a standing security of our souls in a place of bliss, to which believers shall have a real ascent, and in which they shall have a local residence, which is called the purchased possession. As Adam brought in the empire of death, so Christ hath brought in the empire of life: Rom. v. 17, ‘Shall reign in life by one Jesus Christ.’

He hath not purchased for us a paradisaical life, or restored us to the mutable state wherein Adam was created; he hath not linked us for ever to the earth, and the use of the creatures for our support; he hath purchased for us an eternal life, and prepared for us eternal mansions, not only to have the company of men, or the society of the blessed angels, but to be blessed with the vision of God, to reside in the same place where his glorified person is adored by the happy spirits, to ‘live with him,’ Rom. vi. 8, a life wherein our understandings shall be freed from mists, and our wills from spots, and our affections from disorder.

We lost a paradise by sin, and have gained a heaven by the cross. And should not this crucified Christ be studied, who hath settled the regions above for our reception, and procured an entrance into that place which justice, by reason of our sins, had else made for ever inaccessible to us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 503.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-966a4f12a7" data-kw="">
<blockquote><p>We have been taught too long, that we are saved by faith, without the works of the law; which doctrine, though it be most true, and most soundly proved, and flatly concluded, Rom. iii. 28; yet being understood amiss, as Paul’s writings sometimes are, 2 Peter iii. 16, it hath been the decay of all good deeds, and brought in epicurism and all ungodliness. It is true indeed that ‘eternal life is the gift of God through Jesus Christ,’ Rom. vi. 23; but yet this gift is bestowed only upon those ‘for whom it is prepared,’ Mat. xx. 23, which have exercised themselves in the works of mercy, Mat. xxv. 35.

In respect of God, our election standeth certain from all eternity; for ‘it hath this seal, the Lord knoweth them that are his,’ 2 Tim. ii. 1 9, and ‘I know whom I have chosen,’ John xiii. 18. But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter i. 10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.

If God have predestinate any to eternal life, he hath also predestinated them to the means whereby they must attain eternal life, that is, ‘faith and a good conscience,’ 1 Tim. iii. 9. Therefore it is certain, that whosoever is to be saved, shall at one time or other, before they depart out of this life, be called truly to believe, and shall endeavour by all means, as Paul did, ‘to keep a good conscience both toward God and toward men,’ Acts xxiv. 16. For that which is spoken of Christ in special, Ps. xlv. 7, ‘Thou hast loved righteousness, and hated iniquity,’ must be verified, and in some measure accomplished in all the members of Christ; they must love righteousness, and hate iniquity. And this is the difference that the apostle putteth between the children of God and the children of the devil; that the children of God both love and do righteousness, and the children of the devil love sin, and do it, 1 John iii. 7, 8.

Let no man, therefore, think that he is predestinate to salvation, unless he find and feel in himself the effects and fruits of predestination. For ‘those whom God hath predestinate, them also in his good time he calleth,’ Rom. viii. 30; ‘not to uncleanness, but unto holiness,’ 1 Thes. iv. 7; ‘and whom he calleth, them also he justifieth,’ and endueth with the grace of sanctification, Rom. vi. 2, &amp;c.; ‘and whom he justifieth, them also he glorifieth.’

If any be engrafted into Christ by a lively faith, he cannot but bring forth the fruit of good life, John xv. 2, 5; and whosoever doth not bring forth such fruit, it is certain that he is not yet engrafted into Jesus Christ. Let us not therefore, I say, flatter nor deceive ourselves, as though we had true faith, when we have not the true fruits of faith; for as the sun cannot be without light, nor the fire without heat, no more can a saving faith be without good -works, which are the fruits and effects thereof.

The penitent thief had but a short time of repentance, yet in that short time he wanted not good works to declare his faith, Luke xxiii. 40-42; for no sooner was it given him to believe in Christ, but that presently he maketh answer on the behalf of Christ, and cleareth him of all amiss; he rebuketh his fellow for his incredulity; he confesseth the greatness of their sin, and their just punishment for the same; he acknowledgeth Christ to be the Lord, and calleth upon him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lawyer’s Question: In Three Sermons</cite>, (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 107-09.</span></figcaption>

<blockquote><p>VII. It is also absurd, yea impious to affirm that God, to whom all things from eternity are not only foreseen, but also provided for, should intend any thing that from eternity he knew would not come to pass, and to have propounded an end to himself, to which he knew he should not attain; as if one should level at a mark which is not, nor ever will be:

For if God from eternity knoweth that this man shall be damned, in vain doth he wish from eternity, that he should be saved: and he doth from eternity know that he shall not be partaker of his natural desire, and his antecedent will.</p></blockquote>

</figure><figure class="quote" id="q-cddc80d1d5" data-kw="">
<blockquote><p>Who is there amongst you, honourable brethren, who would not lament with me because of the sad state of our churches today, or rather about this frightening transformation itself, about which the entire Calvinistic Christendom is dismayed; about which heaven and earth are startled; about which the angels descending daily unto us from heaven are extremely sorrowful; about which finally the pulpits and the pews of the churches and academics shudder and become very devastated?

Who is there amongst you to be sent to the people of Zion as ministers of this prophecy of Isaiah of peace and salvation, which Paul says must be understood to be the preachers of the New Testament (Rom. 10)? Who, considering this prophecy with me, does not burst out in this lament: Where, O Isaiah, is your promise of the very glad coming of the shepherds who preach peace, good, salvation, and the kingdom of God? Where are their lovely, sincere, and beautiful feet, radiating before God and His people through the rays of the truth, through clear manifestation of a lawful calling, and through the clarity of a guiltless association.

Is it not so on the other hand that very many black, crooked, deformed feet are seen, those which are not sent of God, but have entered into the sheepfold of Christ from somewhere other than through the true door, and, contaminated with evil morals, much rather introduce their good thoughts than Christ’s gospel, much prefer their corrupt disputes than the beneficial peace of Christ?

I exhort you that you no longer permit, through more delay, the weeds of errors, strifes, and disagreements to be spread along with the serving of the good seed of the gospel in our Netherlands, through the secret and crafty practices of the devil, but, earnestly paying attention to a capable remedy for the healing of the wounds of our churches, that you labour in every possible way to that end, that you, with me, satisfy the great expectations, commands, and desires of all pious hearts who confess the same religion with us. We must rescue the healthy doctrine of our old Reformed churches. Let us take away the rising differences amongst us, not according to our own intelligence, but according to the mind of the Holy Spirit, revealed to us in His Holy Word.

The synod must chase away these three armourbearers sent from hell by the prince of darkness, namely, false human tradition, discord, and the freedom of all to teach and to present God’s Word as everyone sees fit, by which they have disturbed and almost overthrown the churches up until now. When you will return home from this synod, the whole multitude of these consistories and of the citizens of Dordrecht and your fellow citizens and brothers in Christ will call you together and congratulate you, to have finished so weighty and great a matter. All will say, “How lovely are the feet of those who have now restored again to the Dutch churches peace, salvation, and the wholesome rest of the kingdom of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-polyander.html">Johannes Polyander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>How beautiful are the feet: Sermon on Isaiah 52:7 before the delegates at the Synod of Dort, 31 December 1618 , trans. Majorie Kamps in The Standard Bearer</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

ank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-96dca2c838" data-kw="">
<blockquote><p>Finally, neither the Majesty of God, nor a regard to his glory, would allow him to permit men to continue in a state of ignorance, with respect to him, and to suffer the mean workmanship of his hands to receive the tribute of religious homage due unto himself. For, among all the nations destitute of revelation, scarcely any traces could be perceived of their believing in the government of God. They were, as the scriptures speak, “the empire of darkness” they were the empire of Satan and of death – The Deity, for a time, permitted this to happen, for reasons justified by his wisdom.

But, at last, it became him to resume the government snatched the influence of his authority, and, through the various nations of the world, to recall mankind to the acknowledgement of their sovereign and to the obedience of his laws. Hence the Psalmist, “Jehovah reigns, let the earth be glad.” Ps. xcvii. And, the kingdom of God, “or, the kingdom of heaven” is perceived to be established by the preaching of Christ.</p></blockquote>

</figure><figure class="quote" id="q-bdb46a00cd" data-kw="">
<blockquote><p>Strong efforts have been used by hell and earth in all ages, to put out the lamp of God’s Anointed, that his soul-captivating glory might not be seen by the sons of men. This is, and has been, the design of all the errors that were ever broached since the Christian church and the gospel-lamp was set up in the world.

The Arian heresy is designed to darken the glory of his supreme Deity. The Socinian error agrees with the Arians, and also overclouds, or rather obliterates, his satisfaction. The Arminian error darkens the freedom and efficacy of his grace, by exalting the freedom of man’s will in his depraved state. Papists and Legalists, of whatever denomination, they impugn and disparage his everlasting righteousness, by substituting something of their own legal workings, doings, or personal qualifications, in the room of it.

And now-a-days, the idol of self-love is substitute in the room of the glory of God, &amp;c. All these, and the like errors, are just like so many damps or mists cast out of hell, through the malice and subtlety of the old serpent, in order to darken and obscure the lamp of gospel-light, that men may not perceive the glory, fulness, and suitableness of Christ, and so believe in him, to the salvation of their souls.

However, through the over-ruling hand of God, these mists and clouds have only served in the issue to make the gospel-lamp, and the glory of God’s Anointed, to shine with the greater lustre; like the clouds in the air, which you observe have just now overcast the sun in the firmament, they obscure his light for a while, and yet serve only, in the event, as a foil to set off the glory of the sun, when he breaks through these clouds, and darts his beams down upon this earth among the children of men, &amp;c.</p></blockquote>

<blockquote><p>The good that springs forth from this peace [of the gospel] means blessedness. Philosophers have tried in different ways to find this good, though they have never been able to, because they, being devoid of the light of the gospel and the eyes of faith, have neither been able to recognize in themselves the supreme good of the eternal inheritance obtained through Christ’s blood, nor their original leprosy, nor the guilt of eternal death, two distinct evil diseases in contrast with this supreme good, nor have been able to find the right remedy for both diseases outside of themselves in the atoning offering of Christ for our sins.</p></blockquote>

<blockquote><p>Wherefore, since the Word Himself has come to us from heaven, we need not, I reckon, go any more in search of human learning to Athens and the rest of Greece, and to Ionia. For if we have as our teacher Him that filled the universe with His holy energies in creation, salvation, beneficence, legislation, prophecy, teaching, we have the Teacher from whom all instruction comes; and the whole world, with Athens and Greece, has already become the domain of the Word.</p></blockquote>

</figure><figure class="quote" id="q-107238b3e6" data-kw="">
<blockquote><p>They who say that Adam was so formed that he would even without any demerit of sin have died, not as the penalty of sin, but from the necessity of his being, endeavour indeed to refer that passage in the law, which says: “On the day ye eat thereof ye shall surely die,” not to the death of the body, but to that death of the soul which takes place in sin. It is the unbelievers who have died this death, to whom the Lord pointed when He said, “Let the dead bury their dead.” Now what will be their answer, when we read that God, when reproving and sentencing the first man after his sin, said to him, “Dust thou art, and unto dust shalt thou return?” For it was not in respect of his soul that he was “dust,” but clearly by reason of his body, and it was by the death of the self-same body that he was destined to “return to dust.”

Still, although it was by reason of his body that he was dust, and although he bare about the natural body in which he was created, he would, if he had not sinned, have been changed into a spiritual body, and would have passed into the incorruptible state, which is promised to the faithful and the saints, without the peril of death. And for this issue we not only are conscious in ourselves of having an earnest desire, but we learn it from the apostle’s intimation, when he says: “For in this we groan, longing to be clothed upon with our habitation which is from heaven; if so be that being clothed we shall not be found naked. For we that are in this tabernacle do groan, being burdened; not for that we would be unclothed, but clothed upon, that mortality may be swallowed up of life.” Therefore, if Adam had not sinned, he would not have been divested of his body, but would have been clothed upon with immortality and incorruption, that “mortality might have been swallowed up of life;” that is, that he might have passed from the natural body into the spiritual body. …

Now previous to the change into the incorruptible state which is promised in the resurrection of the saints, the body could be mortal (capable of dying), although not destined to die (moriturus); just as our body in its present state can, so to speak, be capable of sickness, although not destined to be sick. For whose is the flesh which is incapable of sickness, even if from some accident it die before it ever is sick? In like manner was man’s body then mortal; and this mortality was to have been superseded by an eternal incorruption, if man had persevered in righteousness, that is to say, obedience: but even what was mortal (mortale) was not made dead (mortuum), except on account of sin.

For the change which is to come in at the resurrection is, in truth, not only not to have death incidental to it, which has happened through sin, but neither is it to have mortality, [or the very possibility of death,] which the natural body had before it sinned. He does not say: “He that raised up Christ Jesus from the dead shall quicken also your dead bodies” (although he had previously said, “the body is dead”); but his words are: “He shall quicken also your mortal bodies;” so that they are not only no longer dead, but no longer mortal [or capable of dying], since the natural is raised spiritual, and this mortal body shall put on immortality, and mortality shall be swallowed up in life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 1.2, 5 in NPNF1, 5: 15-16, 16-17.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

— Augustine of Hippo, A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants, (412), 1.2, 5 in NPNF1, 5: 15-16, 16-17.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+who+say+that+Adam+was+so+formed+that+he+would+even+without+any+demerit+of+sin+have+died%2C+not+as+the+penalty+of+sin%2C+but+from+the+necessity+of+his+being%2C+endeavour+indeed+to+refer+that+passage+in+the+law%2C+which+says%3A+%E2%80%9COn+the+day+ye+eat+thereof+ye+shall+surely+die%2C%E2%80%9D+not+to+the+death+of+the+body%2C+but+to+that+death+of+the+soul+which+takes+place+in+sin.+It+is+the+unbelievers+who+have+died+this+death%2C+to+whom+the+Lord+pointed+when+He+said%2C+%E2%80%9CLet+the+dead+bury+their+dead.%E2%80%9D+Now+what+will+be+their+answer%2C+when+we+read+that+God%2C+when+reproving+and+sentencing+the+first+man+after+his+sin%2C+said+to+him%2C+%E2%80%9CDust+thou+art%2C+and+unto+dust+shalt+thou+return%3F%E2%80%9D+For+it+was+not+in+respect+of+his+soul+that+he+was+%E2%80%9Cdust%2C%E2%80%9D+but+clearly+by+reason+of+his+body%2C+and+it+was+by+the+death+of+the+self-same+body+that+he+was+destined+to+%E2%80%9Creturn+to+dust.%E2%80%9D%0A%0AStill%2C+although+it+was+by+reason+of+his+body+that+he+was+dust%2C+and+although+he+bare+about+the+natural+body+in+which+he+was+created%2C+he+would%2C+if+he+had+not+sinned%2C+have+been+changed+into+a+spiritual+body%2C+and+would+have+passed+into+the+incorruptible+state%2C+which+is+promised+to+the+faithful+and+the+saints%2C+without+the+peril+of+death.+And+for+this+issue+we+not+only+are+conscious+in+ourselves+of+having+an+earnest+desire%2C+but+we+learn+it+from+the+apostle%E2%80%99s+intimation%2C+when+he+says%3A+%E2%80%9CFor+in+this+we+groan%2C+longing+to+be+clothed+upon+with+our+habitation+which+is+from+heaven%3B+if+so+be+that+being+clothed+we+shall+not+be+found+naked.+For+we+that+are+in+this+tabernacle+do+groan%2C+being+burdened%3B+not+for+that+we+would+be+unclothed%2C+but+clothed+upon%2C+that+mortality+may+be+swallowed+up+of+life.%E2%80%9D+Therefore%2C+if+Adam+had+not+sinned%2C+he+would+not+have+been+divested+of+his+body%2C+but+would+have+been+clothed+upon+with+immortality+and+incorruption%2C+that+%E2%80%9Cmortality+might+have+been+swallowed+up+of+life%3B%E2%80%9D+that+is%2C+that+he+might+have+passed+from+the+natural+body+into+the+spiritual+body.+%E2%80%A6%0A%0ANow+previous+to+the+change+into+the+incorruptible+state+which+is+promised+in+the+resurrection+of+the+saints%2C+the+body+could+be+mortal+%28capable+of+dying%29%2C+although+not+destined+to+die+%28moriturus%29%3B+just+as+our+body+in+its+present+state+can%2C+so+to+speak%2C+be+capable+of+sickness%2C+although+not+destined+to+be+sick.+For+whose+is+the+flesh+which+is+incapable+of+sickness%2C+even+if+from+some+accident+it+die+before+it+ever+is+sick%3F+In+like+manner+was+man%E2%80%99s+body+then+mortal%3B+and+this+mortality+was+to+have+been+superseded+by+an+eternal+incorruption%2C+if+man+had+persevered+in+righteousness%2C+that+is+to+say%2C+obedience%3A+but+even+what+was+mortal+%28mortale%29+was+not+made+dead+%28mortuum%29%2C+except+on+account+of+sin.%0A%0AFor+the+change+which+is+to+come+in+at+the+resurrection+is%2C+in+truth%2C+not+only+not+to+have+death+incidental+to+it%2C+which+has+happened+through+sin%2C+but+neither+is+it+to+have+mortality%2C+%5Bor+the+very+possibility+of+death%2C%5D+which+the+natural+body+had+before+it+sinned.+He+does+not+say%3A+%E2%80%9CHe+that+raised+up+Christ+Jesus+from+the+dead+shall+quicken+also+your+dead+bodies%E2%80%9D+%28although+he+had+previously+said%2C+%E2%80%9Cthe+body+is+dead%E2%80%9D%29%3B+but+his+words+are%3A+%E2%80%9CHe+shall+quicken+also+your+mortal+bodies%3B%E2%80%9D+so+that+they+are+not+only+no+longer+dead%2C+but+no+longer+mortal+%5Bor+capable+of+dying%5D%2C+since+the+natural+is+raised+spiritual%2C+and+this+mortal+body+shall+put+on+immortality%2C+and+mortality+shall+be+swallowed+up+in+life.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+A+Treatise+on+the+Merits+and+Forgiveness+of+Sins.+And+on+the+Baptism+of+Infants%2C+%28412%29%2C+1.2%2C+5+in+NPNF1%2C+5%3A+15-16%2C+16-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F107238b3e6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/107238b3e6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/25/augustine-of-hippo-eternal-heavenly-life-was-the-reward-for-adams-obedience/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-bf2ceb2252" data-kw="">
<blockquote><p>However long our stay here below may be, it consists almost entirely of a continual revolution between evils and deliverances. These two things take each other by the hand; the end of the one is the beginning of the other. And this is one of the principal differences that distinguish heaven and hell from life on earth. In heaven there is nothing other than eternal happiness, and in hell there is nothing but eternal misery. But on earth rest is followed by trouble and trouble by rest. I assure you that this is a truth that is borne out by the experience of saints from all ages.

Scripture doesn’t stop drawing our attention to it for two reasons: First, because it is one of the most important lessons of religion and serves as a base and foundation for our wisdom. And the other is because it is the habit of humans only to cling to the present, only to think of the future as something far away, about which they don’t need to be concerned. They are proud in prosperity and cowardly in adversity. Good puffs them up, and bad wipes them out. David himself, although accustomed to changes in his circumstances, always recognized that he had fallen into this kind of excess. He says, “When I was in my prosperity, I said, ‘I will never be disturbed’, but when you hid your face, I became completely despairing.” It is therefore extremely necessary for us not to lose our ability to understand both of these days (the good and the bad), and it is for this reason that the Scripture speaks to us about it so often.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jean-claude.html">Jean Claude</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon on Ecclesiastes 7:14: Delivered during a Fast Day at The Hague, the Netherlands, on November 21, 1681 , trans. Charles K. Telfer in Mid-American Journal of Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><figure class="quote" id="q-ba6e2956fd" data-kw="">
<blockquote><p>Christ and the church are clearly distinguished; she is subject to him. This is so because she has been gathered and joined together from among sinful people who have received their sanctification and life from him. He is both true God and righteous man seated at the right hand of his Father, the Almighty One. As with Joseph and his brothers, the glory of Christ will appear with an even greater sheen when, without any mediation, divine majesty is revealed in full splendour. …

To the degree that the majesty and glory of Christ, who together with us is the Son of man united with the Son of God, will be greater, to that extent will the church be happier and more glorious. Christ with the Father and the Holy Spirit, the one only God, will sparkle in divine majesty. And the consequence of this is that our greatest blessedness will consist in contemplating this glory of Christ. …

But beyond this, how much more will this joy be increased because of the joy, the blessedness, and the glory of Jesus Christ. For he is God’s elect in whom we have been elected and who, having died for the elect, has also sanctified, protected, and taken them up into heaven and has placed them in possession of this salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marks of God’s Children</cite>, trans. Peter Y. De Jong, ed. James A. De Jong (1588; Grand Rapids MI: Reformation Heritage Books, 2003), pp 30, 31.</span></figcaption>

n-taffin-on-the-church-reigning-with-christ-in-glory/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>People often object to reprobation on the basis that it makes no sense for God to create men in order to damn them. W. G. T. Shedd argued that this objection has missed the point because God’s ultimate end in election and reprobation was his own glory:

When God saves a sinner, the attribute of mercy is glorified. When he leaves a sinner in sin and punishes him, the attribute of justice is glorified. Neither salvation nor damnation are ultimate ends, but means to an ultimate end; namely, the manifested glory of the triune God. To exhibit justice is honourable to God, as well as to exhibit mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (Edinburgh: T &amp; T Clark, 1889), 1: 448.</span></figcaption>

<blockquote><p>Critics of eternal punishment not only fail to do justice to the doom-worthiness of sin, the rigorousness of divine justice; they also infringe on the greatness of God’s love and the salvation that is in Christ. If the object had not been salvation from eternal destruction, the price of the blood of God’s own Son would have been much too high. The heaven that he won for us by his atoning death presupposes a hell from which he delivered us. The eternal life he imparted to us presupposes an eternal death from which he saved us. The grace and good pleasure of God in which he makes us participants forever presuppose a wrath into which we would otherwise have had to be plunged forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed</cite>, Dogmatics, trans. John Vriend, ed. John Bolt (4 vols, Grand Rapids, 2003-08), iv, 713.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Critics of eternal punishment not only fail to do justice to the doom-worthiness of sin, the rigorousness of divine justice; they also infringe on the greatness of God’s love and the salvation that is in Christ. If the object had not been salvation from eternal destruction, the price of the blood of God’s own Son would have been much too high. The heaven that he won for us by his atoning death presupposes a hell from which he delivered us. The eternal life he imparted to us presupposes an eternal death from which he saved us. The grace and good pleasure of God in which he makes us participants forever presuppose a wrath into which we would otherwise have had to be plunged forever.”

</figure><figure class="quote" id="q-dccece3332" data-kw="">
<blockquote><p>Moreover, in the blessed after the Resurrection of the Body there shall also be a Vision of the Son of God Incarnate, in His human nature assumed and now for some time glorified, with the eyes of their bodies; concerning whom John speaks the words in 1 John 3:2, and whom already formerly Holy Job was awaiting, Job 19:26, 27. With respect to the present life Job had entirely cast away all hope of restoration; compare Job 6:11; 7:5, 7, 8, 15, 16; 16:16; 17:1, 14, 15; 19:10. But after death he was certain that he was going to see God, at the time when after his skin they had some time ago pierced this very thing, and his Redeemer in the end would stand upon the earth.</p></blockquote>

</figure><figure class="quote" id="q-7c64a93bd8" data-kw="">
<blockquote><p>As many professing Christians in the United States are about to reject the crown rights of Jesus Christ over them at the ballot-box in order to vote for a Mormon anti-christ (on the pretext that he is the lesser of two evils), Samuel Rutherford gives us the following timely reminder of the need for civil rulers to bow before the King of kings:

Then grace makes rich men parliament men, and there is a wide difference between a public man, and a public spirit. All parliament men are public men, but they are not all public spirits, else so many of them would not have deserted the public, and run away from Christ’s colours, to seek their own private idols. Men void of grace make an idol of themselves; every wicked man is wholly himself, and wholly his own; they all seek their own, not the things of Jesus Christ (Phil. 2:21). He who is for the Bridegroom, cannot be against the Bride, nor against the commonwealth. He who is a statesman of heaven, and knows savingly the fundamental laws of Jesus Christ, the power, and prerogative royal of the King of Kings; he who is acquainted with the frame and constitution of the kingdom of sin, in his own heart; he who fears God, who fears his own light, and is awed with the decrees and laws of an enlightened conscience, shall be fast for the public. And the man who sells his religion and his soul for his private ends, will soon sell his country, his parliament, the laws and liberties of the kingdom. Will he put the law of God, and the crown and sceptre of that princely Lord Jesus to the market, and will he stick, for his court and honour, to sell the laws of England, and will he forfeit heaven, and will he not forfeit you all, and your Parliament and liberties?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached to the honourable House of Commons at their late solemn fast, Wednesday, January 31, 1643/44 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish commissioners to the Westminster Assembly of divines</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-98ca2dcf7c" data-kw="">
<blockquote><p>But many will say, “We know He will be exalted at the last and great day when He shall have all the wicked on His left hand.” Yes; but he says, “I will be exalted in the earth.” He has been exalted on the earth; but the most wonderfully exalting of His works we have not yet seen. The people of God have been right high already. Oh, but the Church of the Jews was sometimes very high, and sometimes the Christian Church! In the time of Constantine she was high. Yea, the Church of Scotland has been very high, “Fair as the moon, clear as the sun; and terrible as an army with banners.” The day has been when Zion was stately in Scotland. The terror of the Church of Scotland once took hold of all the kings and great men that passed by. Yea; the terror of it took hold on Popish princes; nay, on the Pope himself. But all this exalting that we have yet seen is nothing to what is to come. The Church was high, but it shall be yet much higher. “There is none like the God of Jeshurun.” The Church of Christ is to be so exalted that its members shall be made ride upon the high places of the earth.

Let us not be judged to be of the opinion of some men in England called the Fifth-Monarchy men, who say that, before the great day, Christ shall come in person from heaven with all the saints and martyrs and reign a thousand years on earth. But we are of the opinion that the Church shall yet be more high and glorious, as appears from the book of Revelation, and the Church shall have more power than ever she had before; and therefore we declare avowedly in opposition to all tyrannical magistrates over Protestants, and over Presbyterians – magistrates that are open enemies to God – we declare we will have none such acknowledged as lawful magistrates over us. We will have none but such as are for the advancement of piety and the suppression of impiety and wickedness.

Let all the world say as they will, we have the word of God for it. The work begun shall be carried on in spite of all opposition. Our Lord shall be exalted on earth; and we do not question much but that He shall be exalted on earth; and we do not question much but that He shall be exalted in Scotland. But I assure you that we in Scotland have need to take heed to ourselves. I am very much afraid that we may even have done with good days in Scotland for all this. But let us stir up ourselves, and take hold of Him by faith. For I assure you, if ye be not delivered and made a free and purified people, we shall no more be a free corporation, nation, or embodied people, than the Jews are at this day. I say not this to disquiet you, but to stir you up to take hold of Christ and His standard, on which it shall be written, “LET CHRIST REIGN.” Let us study to have it set up amongst us.

It is hard to tell where it shall be first erected, but our Lord is to set up a standard; and oh, that it may be carried to Scotland? When it is set up it shall be carried through the nations, and it shall go to Rome, and the gates of Rome shall be burned with fire. It is a standard that shall overthrow the throne of Britain, and all the thrones in Europe, that will not “kiss the Son lest he be angry; and in his anger they perish from the way.” “Be still and know that I am God. I will be exalted among the heathen; I will be exalted in the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Psalm 46:10 in Sermons in times of persecution in Scotland, by sufferers for the royal prerogatives of Jesus Christ</cite></span></figcaption>

Let all the world say as they will, we have the word of God for it. The work begun shall be carried on in spite of all opposition. Our Lord shall be exalted on earth; and we do not question much but that He shall be exalted on earth; and we do not question much but that He shall be exalted in Scotland. But I assure you that we in Scotland have need to take heed to ourselves. I am very much afraid that we may even have done with good days in Scotland for all this. But let us stir up ourselves, and take hold of Him by faith. For I assure you, if ye be not delivered and made a free and purified people, we shall no more be a free corporation, nation, or embodied people, than the Jews are at this day. I say not this to disquiet you, but to stir you up to take hold of Christ and His standard, on which it shall be written, “LET CHRIST REIGN.” Let us study to have it set up amongst us.

It is hard to tell where it shall be first erected, but our Lord is to set up a standard; and oh, that it may be carried to Scotland? When it is set up it shall be carried through the nations, and it shall go to Rome, and the gates of Rome shall be burned with fire. It is a standard that shall overthrow the throne of Britain, and all the thrones in Europe, that will not “kiss the Son lest he be angry; and in his anger they perish from the way.” “Be still and know that I am God. I will be exalted among the heathen; I will be exalted in the earth.”

— Richard Cameron, Sermon on Psalm 46:10 in Sermons in times of persecution in Scotland, by sufferers for the royal prerogatives of Jesus Christ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+many+will+say%2C+%E2%80%9CWe+know+He+will+be+exalted+at+the+last+and+great+day+when+He+shall+have+all+the+wicked+on+His+left+hand.%E2%80%9D+Yes%3B+but+he+says%2C+%E2%80%9CI+will+be+exalted+in+the+earth.%E2%80%9D+He+has+been+exalted+on+the+earth%3B+but+the+most+wonderfully+exalting+of+His+works+we+have+not+yet+seen.+The+people+of+God+have+been+right+high+already.+Oh%2C+but+the+Church+of+the+Jews+was+sometimes+very+high%2C+and+sometimes+the+Christian+Church%21+In+the+time+of+Constantine+she+was+high.+Yea%2C+the+Church+of+Scotland+has+been+very+high%2C+%E2%80%9CFair+as+the+moon%2C+clear+as+the+sun%3B+and+terrible+as+an+army+with+banners.%E2%80%9D+The+day+has+been+when+Zion+was+stately+in+Scotland.+The+terror+of+the+Church+of+Scotland+once+took+hold+of+all+the+kings+and+great+men+that+passed+by.+Yea%3B+the+terror+of+it+took+hold+on+Popish+princes%3B+nay%2C+on+the+Pope+himself.+But+all+this+exalting+that+we+have+yet+seen+is+nothing+to+what+is+to+come.+The+Church+was+high%2C+but+it+shall+be+yet+much+higher.+%E2%80%9CThere+is+none+like+the+God+of+Jeshurun.%E2%80%9D+The+Church+of+Christ+is+to+be+so+exalted+that+its+members+shall+be+made+ride+upon+the+high+places+of+the+earth.%0A%0ALet+us+not+be+judged+to+be+of+the+opinion+of+some+men+in+England+called+the+Fifth-Monarchy+men%2C+who+say+that%2C+before+the+great+day%2C+Christ+shall+come+in+person+from+heaven+with+all+the+saints+and+martyrs+and+reign+a+thousand+years+on+earth.+But+we+are+of+the+opinion+that+the+Church+shall+yet+be+more+high+and+glorious%2C+as+appears+from+the+book+of+Revelation%2C+and+the+Church+shall+have+more+power+than+ever+she+had+before%3B+and+therefore+we+declare+avowedly+in+opposition+to+all+tyrannical+magistrates+over+Protestants%2C+and+over+Presbyterians+%E2%80%93+magistrates+that+are+open+enemies+to+God+%E2%80%93+we+declare+we+will+have+none+such+acknowledged+as+lawful+magistrates+over+us.+We+will+have+none+but+such+as+are+for+the+advancement+of+piety+and+the+suppression+of+impiety+and+wickedness.%0A%0ALet+all+the+world+say+as+they+will%2C+we+have+the+word+of+God+for+it.+The+work+begun+shall+be+carried+on+in+spite+of+all+opposition.+Our+Lord+shall+be+exalted+on+earth%3B+and+we+do+not+question+much+but+that+He+shall+be+exalted+on+earth%3B+and+we+do+not+question+much+but+that+He+shall+be+exalted+in+Scotland.+But+I+assure+you+that+we+in+Scotland+have+need+to+take+heed+to+ourselves.+I+am+very+much+afraid+that+we+may+even+have+done+with+good+days+in+Scotland+for+all+this.+But+let+us+stir+up+ourselves%2C+and+take+hold+of+Him+by+faith.+For+I+assure+you%2C+if+ye+be+not+delivered+and+made+a+free+and+purified+people%2C+we+shall+no+more+be+a+free+corporation%2C+nation%2C+or+embodied+people%2C+than+the+Jews+are+at+this+day.+I+say+not+this+to+disquiet+you%2C+but+to+stir+you+up+to+take+hold+of+Christ+and+His+standard%2C+on+which+it+shall+be+written%2C+%E2%80%9CLET+CHRIST+REIGN.%E2%80%9D+Let+us+study+to+have+it+set+up+amongst+us.%0A%0AIt+is+hard+to+tell+where+it+shall+be+first+erected%2C+but+our+Lord+is+to+set+up+a+standard%3B+and+oh%2C+that+it+may+be+carried+to+Scotland%3F+When+it+is+set+up+it+shall+be+carried+through+the+nations%2C+and+it+shall+go+to+Rome%2C+and+the+gates+of+Rome+shall+be+burned+with+fire.+It+is+a+standard+that+shall+overthrow+the+throne+of+Britain%2C+and+all+the+thrones+in+Europe%2C+that+will+not+%E2%80%9Ckiss+the+Son+lest+he+be+angry%3B+and+in+his+anger+they+perish+from+the+way.%E2%80%9D+%E2%80%9CBe+still+and+know+that+I+am+God.+I+will+be+exalted+among+the+heathen%3B+I+will+be+exalted+in+the+earth.%E2%80%9D%0A%0A%E2%80%94+Richard+Cameron%2C+Sermon+on+Psalm+46%3A10+in+Sermons+in+times+of+persecution+in+Scotland%2C+by+sufferers+for+the+royal+prerogatives+of+Jesus+Christ&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F98ca2dcf7c.h

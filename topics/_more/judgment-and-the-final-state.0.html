<figure class="quote" id="q-74c05d4fd3" data-kw="">
<blockquote><p>For as at the bar of an earthly judge, the malefactor is brought out of prison and set before the judge, and there examined: even so in that great day shall every man without exception be brought before the Lord to be tried. But how shall this trial be made? Answer: By works, as the apostle says: ‘We must all appear before the judgment seat of Christ, that every man may receive the things which are done in his body according to that He has done, whether it be good or evil.’ (2 Cor. 5:10) And the reason is, because works are the outward signs of inward grace and godliness. And though we be justified by faith alone without works, yet may we be judged both by faith and works. For the Last Judgment does not serve to make men just that are not, but only to manifest them to be just indeed, which were just before and in this life truly justified. The consideration of this very point should move us all to repent us of our sins past and to reform ourselves throughout, and to be plentiful in all good works. And undoubtedly if we seriously think upon it, it will hold us more straightly to all good duties than if with the Papists we held justification by works.</p></blockquote>

rthly&amp;text=with%20the%20Papists%20we%20held%20justification%20by%20works" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The reason of this calling [into God’s eternal kingdom], is taken from works as from signs, in these words, ‘For I was hungry and ye gave Me meat, etc. when He says, ‘For I was hungry,’… We are not to do them [works of mercy] of any sinister respect, as for praise of men or commodity, but we must propound unto ourselves the party to whom we do any good, and in him look on Christ, and so do it as unto Christ and for Christ’s sake only; and this is a good work indeed. Christ says, ‘Whosoever shall give a cup of cold water to a disciple in the name of a disciple, shall not loose his reward.’ (Mk. 10:42) It is but a small gift, but yet the manner of doing it, namely in the name of a disciple, that is, in respect that he is a member of Christ, does make it an excellent work of mercy. It is a special mark of a child of God to show mercy on a Christian because he is a Christian.</p></blockquote>

</figure><figure class="quote" id="q-a4c340efd8" data-kw="">
<blockquote><p>The question remains whether Christ will in the future, on the day of judgment, justify those who have believed in this life? And if so, is it not true that justification is actually perfected in the life to come rather than in this life? I respond that Christ will not, on that day of judgment, justify believers. He will, rather, declare on the basis of their works that they have believed and have been justified in this life. Indeed, the verb “justify” sometimes has the meaning of “declare justified.” James uses the word in this very sense when he speaks of the man who is justified according to his works. … But justification, someone will say, is a judicial sentence of life. And life is not perfected until Christ’s second coming. Is it not the case, therefore, that justification itself will not be perfected until Christ’s second coming? I respond that it is one thing for the judicial sentence of life to be complete, and another thing for life itself to be perfected. The sentence of life is surely complete already in this life, but life itself will not be perfected until Christ’s second coming. This argument, therefore, is fallacious and captious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a></span></div>

</figure><figure class="quote" id="q-397a529116" data-kw="">
<blockquote><p>And doubtless when the business of the Last Judgment is not to examine whether Christ has satisfied for us or not, but whether we have performed the conditions on our part, on which the benefits of his satisfaction, especially eternal life, were promised; it must needs follow that so far our iustitia causae [our righteousness of the cause] in that trial will lie in our actual performance of those conditions, which is our personal evangelical righteousness; and according thereto we shall be justified; that is, adjudged to be the heirs of life, and not of damnation.</p></blockquote>

<blockquote><p>[3] But if we take justification in a judiciary sense, as it is used in courts of justice and judgment, for proving, declaring, and pronouncing men righteous: then not only faith and actual believing, but also repentance, amendment of life, and all holy Christian duties, and good works of piety, mercy, and charity must necessarily go before as evidences, testimonies, and proofs by which men must be justified, that is, judged, declared, and pronounced righteous. First, in the court of their own conscience, so often as sin and Satan stand up against them to accuse them. Secondly, in the common judgment of men. Thirdly, in the general judgment at the last day. … Of the third [justification, “in a judiciary sense”] Saint James speaks, where he says that Abraham was justified by works, Jm. 2:21; and Job 13:18, where he says, “Behold now I have ordered my cause, I know that I shall be justified”; and this St. Paul calls ‘justification of life’, Rom. 5:18, because it is an adjudging of men to eternal life, according to the evidence of their works, as our Savior shows, Mt. 24:35.</p></blockquote>

<blockquote><p>Secondly, by the doctrine of faith we are bound to acknowledge and confess that Christ Jesus by his eternal priesthood is not only the sole meritorious cause of all grace or righteousness inherent, requisite to final absolution; but these presupposed in the party to be absolved, He is likewise the sole immediate cause of final absolution or justification. Without observation in some measure to all the commandments of God, we cannot enter into the kingdom of heaven: but we enter not for the obedience we have performed. To what use then does our inherent righteousness or observance of God’s commandments serve us? If it has been sincere and unfeigned, though imperfect, yet the faith that brought it forth will make a sincere and faithful plea for mercy in the day of trial, in which he that has been a hearer only, and no doer of the law, or has done in part what God would have done, but not sincerely nor faithfully, shall not be heard. Our imperfect obedience then is not the immediate cause of our absolution, but the obedience and righteousness of Christ. By the immediate and next cause we understand such a cause as is necessarily accompanied by the effect, and without whose participation the effect never does, nor can befall any: such a cause as whosoever is partaker of, is by participation of it forthwith absolved; such a cause as whoso can probably hope to be partaker of, he may upon the same degrees of probability hope for final absolution; such a cause as whoso doubts or fears lest he shall never be partaker of in this life, must upon the same terms doubt or despair of his absolution or salvation. But if works be accounted for the exact righteousness of the law unto us, not the obedience of Christ received by faith, but the works of holiness in us are the absolute cause of remission of sins and acceptance unto life. And what else do the words sound, as they are interpreted, but that as exact obedience to the law should have been the matter or cause of justification from justice, so sincere obedience by the estimation of grace is the matter of justification by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645) | ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, pp. 69-70</span></figcaption>

</figure><figure class="quote" id="q-e1868f5d7a" data-kw="">
<blockquote><p>And in this judgment of God’s Church, the ground of the condemnation of Hypocrites, is the default of good works is the ground of the condemnation of hypocrites, because that thereby is shown the falsity of their faith and profession: and contrariwise the practice of them, is the true proof of a lively faith, and the accomplishment of the duties of the evangelical covenant, on the believer’s behalf; and the beginning of the spiritual life, which shall never be perfected in Heaven unless it be begun in this world. See concerning this judgment, Ps. 50:4; Eze. 34:17; Heb. 10:30; Jam. 2:24. And as the life everlasting is altogether holiness and charity, so Christ represents the disposition which is necessary unto it, by the pureness of the sheep, and by spiritual charity practiced towards his as towards Himself.</p></blockquote>

<blockquote><p>…he [James] prosecutes to the end of the [second] chapter… 3. That every man’s faith (and so together therewith every man that professes himself to have true faith) must one day be put to an open trial, to justify the truth of itself, and of his profession, and this afore all the world. And the believer also will be put upon the justification of his having had such a faith as God (ex consequenti, or ‘in the sequel’) professes only to justify man upon; for at the latter day it is faith [that] is the grace that must be tried and found unto honor and glory, 1 Peter 1:7. And the man that shall plead justification by faith alone (which James contradicts not), and that he had a saving faith, must undergo this examination, whether his faith produced such works, yea or no, as the nature of true faith, with difference from false and unfeigned faith (which James disputes against), does note.</p></blockquote>

<blockquote><p>And does by the Spirit of adoption assure us more and more of the pardon of our sins: but more solemnly at the Last Day, when the Judge does, sitting upon the throne, pronounce and declare us righteous before all the world, and as those who are accepted unto life, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord.’ Then the sentence is solemnly pronounced by the Judge sitting on the throne; and we are justified before God, men and angels. There are two parts of judgment, to condemn, and to absolve or justify: Mt. 12:36-37: ‘But I say unto you that for every idle word that a man shall speak, he shall give account thereof at the Day of Judgment; for by thy words thou shalt be justified, and by thy words thou shalt be condemned;’ then every man’s doom [verdict] shall be pronounced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (London: Astwood, 1684) | Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 334</span></figcaption>

<blockquote><p>(j) That James expressly teaches that a person is justified by works, not by faith alone (James 2:14, 17–18, 20–26). I respond: (i) The passage has nothing about merits. (ii) It clearly is discussing a sterile faith, or one which is constantly devoid of works, the sort that does not justify, as we freely acknowledge with Paul (Gal. 5:6). (iii) The passage also could be understood about the justification that will happen in the last judgment, insofar as that will require the presence of good works. Not to mention that (iv) the passage could be understood about the justification or declaration of faith before God and men (v. 18).</p></blockquote>

<blockquote><p>8. The good works performed by the gentiles [unbelievers] are pleasing to God in so far as because of them, He will partially but not totally justify them in the last judgment; secondly, because He will remunerate them with temporary goods [in this life]. In hell, therefore, they will bear lighter punishments; they will also be remunerated with temporary goods, as is evident from the midwives in Ex. 1 [v. 21].</p></blockquote>

<blockquote><p>14. Some of the reprobate will be partly justified. I.e. they will be freed from punishment, yet not absolutely, for all reprobate are to be condemned: but in respect of degree. Consequently, in Mt. 11:24, it is said that for the inhabitants of Sodom the circumstances will be more tolerable than for others in Judgment Day.</p></blockquote>

</figure><figure class="quote" id="q-1d42c671d0" data-kw="">
<blockquote><p>But Paul would say all his excellency was from free grace. Were any indifferent beholder up in the highest Jerusalem after the Day of Judgement to see the company of the Lamb and his court, so many thousand pieces of clay then clothed with highest grace smiling on the face of Him that sits on the throne, made eternal kings, that for glory and robes of grace and the weighty crown you cannot see a bit of clay, and yet originally all these are but glistering bits of clay and graced dust; it should tire the beholder with admiration. O but the second Creation is a rare piece of workmanship. But again come and see that heaven of wonders, the Man-Christ, who as man has: 1. Flesh and blood, and a man’s soul as we have; but O so incomparably wonderful, as the grace of God without merit has made the man-Christ. Grace has exalted this man to a high throne, the Godhead, in person dwells in this clay tent of endless glory and God speaks personally out of this man; and this Emmanuel is God, and the man is so weighted with glory as all that are there (and they be a fair and numerous company) are upon one continued act of admiring, enjoying, praising, loving Him for no less date than endless eternity, and they can never be able to pull their eyes off Him. And then grace seen, enjoyed as it grows at the well-head up in Emmanuel’s highest and newest land is of another strain, sweeter and more glorious than down here in the earth, which is not the element of grace, they are but glimpses, borrowed shaddows, chips and drops of grace that are here. That is a world of nothing but graoe;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But Paul would say all his excellency was from free grace. Were any indifferent beholder up in the highest Jerusalem after the Day of Judgement to see the company of the Lamb and his court, so many thousand pieces of clay then clothed with highest grace smiling on the face of Him that sits on the throne, made eternal kings, that for glory and robes of grace and the weighty crown you cannot see a bit of clay, and yet originally all these are but glistering bits of clay and graced dust; it should tire the beholder with admiration. O but the second Creation is a rare piece of workmanship. But again come and see that heaven of wonders, the Man-Christ, who as man has: 1. Flesh and blood, and a man’s soul as we have; but O so incomparably wonderful, as the grace of God without merit has made the man-Christ. Grace has exalted this man to a high throne, the Godhead, in person dwells in this clay tent of endless glory and God speaks personally out of this man; and this Emmanuel is God, and the man is so weighted with glory as all that are there (and they be a fair and numerous company) are upon one continued act of admiring, enjoying, praising, loving Him for no less date than endless eternity, and they can never be able to pull their eyes off Him. And then grace seen, enjoyed as it grows at the well-head up in Emmanuel’s highest and newest land is of another strain, sweeter and more glorious than down here in the earth, which is not the element of grace, they are but glimpses, borrowed shaddows, chips and drops of grace that are here. That is a world of nothing but graoe;”

hub.io%2Fquote%2F1d42c671d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d42c671d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-renovation-new-heavens-earth-believers-eternal-home/#:~:text=But%20Paul%20would%20say%20all%20his,a%20world%20of%20nothing%20but%20graoe&amp;text=But%20Paul%20would%20say%20all%20his%20excellency%20was&amp;text=That%20is%20a%20world%20of%20nothing%20but%20graoe" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David B. MacKinnon</cite>, ed., Refreshment for the Soul: A Year of Daily Readings From ‘The Heavenly Doctor’ Richard Sibbes (The Banner of Truth, 2022), 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>Next we must consider the general organization of Israel that originated in this berith. This is usually designated as ‘theocracy’. This name for it is not found in the Scriptures, although it admirably describes what the Biblical account represents Israel’s constitution to have been. Probably the term was coined by Josephus. He observes in regard to the governments of other nations, that some of these were monarchies, others oligarchies, still others democracies; what God set up among Israel was a theocracy. Obviously Josephus finds in this something distinctive and unique. This is correct as far as the great systems of civilization of that day were concerned. But it is not quite correct, if Israel be compared with other Shemitic tribes. The theocratic principle, i.e., the principle of the deity being the supreme authority and power in national life, seems to have been not uncommon among the Shemites. We may infer as much from the observation that Melekh, ‘King’, is a frequent Shemitic name for the deity. But while under ordinary circumstances this was a mere belief, it proved among Israel an undoubted reality. The laws under which Israel lived not merely had the divine sanction behind them in the general sense in which all law and order ultimately derives from God through general revelation by way of the conscience, but in the specific sense, that Jehovah had directly revealed the law. In other words Jehovah in person performed the task usually falling to a human king. And in the sequel also, Jehovah by supernatural interposition, when necessary, continued to act the role of King of the nation. This fact was so deeply embedded in the consciousness of the leaders of Israel that still in the time of Gideon and Samuel it was felt to forbid the setting up of a purely human kingdom. The union of the religious lordship and the national kingship in the one Person of Jehovah involved that among Israel civil and religious life were inextricably interwoven. If the union had happened to exist in any other person but God, a division of the two spheres of relationship might have been conceivable. The bond to God is so one and indivisible that no separation of the one from the other can be conceived. Hence the later prophetic condemnation of politics, not merely wicked politics, but politics per se, as derogatory to the royal prerogative of Jehovah. Further it ought to be noticed that between these two concentric spheres the religious one has the pre-eminence. It is that for the sake of which the other exists. For our system of political government such an interrelation would, of course, seen a serious, intolerable defect. Not so among Israel. The chief end for which Israel had been created was not to teach the world lessons in political economy, but in the midst of a world of paganism to teach true religion, even at the sacrifice of much secular propaganda and advantage. Nor was it merely a question of teaching religion for the present world. A missionary institution theocracy never was intended to be in its Old Testament state. The significance of the unique organization of Israel can be rightly measured only by remembering that theocracy typified nothing short of the perfected kingdom of God, the consummate state of Heaven. In this ideal state there will be no longer any place for the distinction between church and state. The former will have absorbed the latter. In a rough way the principle involved was already apprehended by Josephus. In the passage introducing the word ‘theocracy’ he observes that Moses, by giving such a constitution to the Israelites, did not make religion a part of virtue, but made all other virtues to be a part of religion. The fusion between the two spheres of secular and religious life is strikingly expressed by the divine promise that Israel will be made ‘a kingdom of priests and an holy nation’ [Ex. 19:6]. As priests they are in, nay, constitute the kingdom.</p></blockquote>

deon+and+Samuel+it+was+felt+to+forbid+the+setting+up+of+a+purely+human+kingdom.+The+union+of+the+religious+lordship+and+the+national+kingship+in+the+one+Person+of+Jehovah+involved+that+among+Israel+civil+and+religious+life+were+inextricably+interwoven.+If+the+union+had+happened+to+exist+in+any+other+person+but+God%2C+a+division+of+the+two+spheres+of+relationship+might+have+been+conceivable.+The+bond+to+God+is+so+one+and+indivisible+that+no+separation+of+the+one+from+the+other+can+be+conceived.+Hence+the+later+prophetic+condemnation+of+politics%2C+not+merely+wicked+politics%2C+but+politics+per+se%2C+as+derogatory+to+the+royal+prerogative+of+Jehovah.+Further+it+ought+to+be+noticed+that+between+these+two+concentric+spheres+the+religious+one+has+the+pre-eminence.+It+is+that+for+the+sake+of+which+the+other+exists.+For+our+system+of+political+government+such+an+interrelation+would%2C+of+course%2C+seen+a+serious%2C+intolerable+defect.+Not+so+among+Israel.+The+chief+end+for+which+Israel+had+been+created+was+not+to+teach+the+world+lessons+in+political+economy%2C+but+in+the+midst+of+a+world+of+paganism+to+teach+true+religion%2C+even+at+the+sacrifice+of+much+secular+propaganda+and+advantage.+Nor+was+it+merely+a+question+of+teaching+religion+for+the+present+world.+A+missionary+institution+theocracy+never+was+intended+to+be+in+its+Old+Testament+state.+The+significance+of+the+unique+organization+of+Israel+can+be+rightly+measured+only+by+remembering+that+theocracy+typified+nothing+short+of+the+perfected+kingdom+of+God%2C+the+consummate+state+of+Heaven.+In+this+ideal+state+there+will+be+no+longer+any+place+for+the+distinction+between+church+and+state.+The+former+will+have+absorbed+the+latter.+In+a+rough+way+the+principle+involved+was+already+apprehended+by+Josephus.+In+the+passage+introducing+the+word+%E2%80%98theocracy%E2%80%99+he+observes+that+Moses%2C+by+giving+such+a+constitution+to+the+Israelites%2C+did+not+make+religion+a+part+of+virtue%2C+but+made+all+other+virtues+to+be+a+part+of+religion.+The+fusion+between+the+two+spheres+of+secular+and+religious+life+is+strikingly+expressed+by+the+divine+promise+that+Israel+will+be+made+%E2%80%98a+kingdom+of+priests+and+an+holy+nation%E2%80%99+%5BEx.+19%3A6%5D.+As+priests+they+are+in%2C+nay%2C+constitute+the+kingdom.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+Biblical+Theology%3A+Old+and+New+Testaments%2C+%28Eugene%2C+OR%3A+Wipf+%26+Stock+Publishers%2C+2003%29%2C+124%E2%80%9326.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56ef4b4cff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56ef4b4cff.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/08/vos-the-israelite-theocracy-was-a-type-and-shadow-of-heaven/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The Limbus Patrum. The Latin word limbus (fringe) was used in the Middle Ages to denote two places on the fringe or outskirts of hell, namely, the Limbus Patrum and the Limbus Infantum. The former is the place where, according to the teachings of Rome, the souls of the Old Testament saints were detained in a state of expectation until the Lord’s resurrection from the dead. After His death on the cross Christ is supposed to have descended into the abode of the fathers, to release them from their temporary confinement and to carry them in triumph to heaven. This is the Roman Catholic interpretation of Christ’s descent into hades. Hades is regarded as the dwelling place of the departed spirits, having two divisions, one for the righteous and one for the wicked. The division inhabited by the spirits of the righteous was the Limbus Patrum, known to the Jews as Abraham’s bosom, Luke 16:23, and paradise, Luke 23:43. It is maintained that heaven was not open to any man until Christ had actually made propitiation for the sin of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids: Wm. B. Eerdmans Publishing Co., 1938), 687.</span></figcaption>

<blockquote><p>VII. Third, the thief is admitted into paradise before the ascension of Christ according to his promise, “Today shalt thou be with me in paradise” (Lk. 23:43). Nor should it be said here that “today” must be construed with the preceding verb (“I say”) and not with what follows (“shalt thou be with me”) so that the meaning is “today I say unto thee, thou shalt be with me in paradise” (to wit, at the last judgment) because the construction will not suffer this. In vain would this be added because no one speaks except in the present time and it is clear that Christ refers to the words of the thief, “Remember me when thou comest into thy kingdom” (v. 42). Nor should it be said that paradise is limbo (as Maldonatus holds), because it appears from Scripture that paradise is located in heaven as a place of delight and of eternal happiness (2 Cor. 12:2, 4; Rev. 2:7). Nor should it be said that the thief requested only this—that Christ should remember him in paradise—because it is not absurd to say that Christ gave more to him than he asked, as the most kind Father is accustomed to do above what we seek. Nor is this a privilege peculiar to the thief and not common to others since faith and repentance (to whom this is given by Christ) is common to all true believers. Hence Bellarmine rightly proves from this passage that the saints immediately after death enjoy the vision of God (“De Sanctorum Beatitudine,” 1.7 Opera [1857], 2:437–38).

VIII. Fourth, Enoch and Elijah were translated to heaven (Heb. 11:5; 2 K. 2:11). For although this was peculiar to them that they were bodily whirled into heaven, it was not singular that they were spiritually admitted into it; yea, they were the solemn pledges to the pious of the heavenly glory to be at length obtained. Nor if the letter said to have been written from Elijah to Jehoram (2 Ch. 21:12) was handed to the king only after Elijah’s death, does it follow that it was written after his translation. It is one thing for it to have been written after his translation; another to have been given only then. The emptiness of the figment concerning the translation of Enoch and Elijah to a terrestrial paradise, also concerning their return to war against Antichrist has been elsewhere exposed (Volume I, Topic VIII, Question 7, Section 9).

IX. Fifth, the ancient believers waited for a heavenly city (Heb. 11:10) and had a great consolation and certain hope of glory in death (which would not have been the case if they had as yet to be hurled into hell). How could Jacob have testified that he waited with such earnestness the salvation of the Lord (Gen. 49:18) and David that he committed his spirit into the hand of the Lord (Ps. 31:5), if they should still be far off from the face of God and were to be glorified only after many ages? Nor can it be said that David thus commended to God the perfection of life because the words can bear no other meaning according to the style of Scripture than to deliver the soul to God (as is evident from the example of Stephen, Acts 7:59).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.11.7–9;, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 259–60.</span></figcaption>

<blockquote><p>The reasons are: (1) the formula of the covenant of grace under which the fathers lived does not suffer them to be hurled into a limbo, but demands that they should be admitted into heaven. For since God promised that he would be their God, not temporarily, but eternally (nor is he the God of the dead, but of the living)—the fathers must necessarily still live even after death, at least as to some part of them (i.e., as to the soul), not with any kind of life, but with a happy and heavenly life, necessarily included in this promise (as has been proved before, Question 2). Christ expressly teaches this. When speaking of the dead fathers he says “All live unto him” (pantes autō zōsi, Lk. 20:38), not only in the mind and power of God because he can recall them to life and was really about to do this according to his decree; but they live because they are before him always and enjoy a divine life. This is both “from him” (as the beginning) and terminates “on him” (as its object and end). Now who would say that they live in God who being thrust into hell are without the vision of God and feel the punishment of loss (at least the temporal).

V. Second, the ancients immediately after death were received into the bosom of Abraham, as appears from the example of Lazarus (Lk. 16:22, 23). Therefore they were also received into heavenly joy. For “the bosom of Abraham” can be referred to no other thing than to eternal life; this is shadowed forth under the symbol of a sumptuous feast, in allusion to a custom of the ancients in which they were accustomed so to recline at their feasts that the one rested his head on the bosom of the other. This is said of John, because Christ reclining upon the higher part of the couch had John next to him, who is therefore said to have leaned upon his bosom (Jn. 13:23). Thus nothing is more natural than that it should be said here that Lazarus was to Abraham what John was to the Lord; in the heavenly feast especially since Christ elsewhere clearly unfolds this mystery when he says, “Many shall come from the east and the west, and shall sit down with Abraham, and Isaac, and Jacob, in the kingdom of heaven” (Mt. 8:11), i.e., shall enjoy with him the celestial banquet. “To sit down with Abraham” and “to be in the bosom of Abraham” are the same except that to be in the bosom is a mark of greater love because not all shall recline upon his bosom, as Maldonatus aptly remarks on this passage (Commentaria in quatuor evangelistas [1863], 2:287–88 on Lk. 16:22). Now mention is made of Abraham rather than of Jacob or any other saint; both because he was the father of believers in whose bosom (i.e., most loving embrace) they are collected who partake of the fruit of the same faith with him, as sons come together in the bosom of their father when they are graciously received by him; and also on account of his liberal hospitality during life, so that the hospitality of the good but wealthy Abraham may be opposed to the inhospitality of the wealthy provider of the feast.

VI. Hence it is evident that to no purpose does Bellarmine maintain that the bosom of Abraham is nothing else than limbo and that the souls of Abraham and of Lazarus were in the same abyss with the soul of the provider of the feast, distinct indeed from each other, but having nothing solid interposed, but only a great gulf (mega chasma) (“De Purgatorio,” 2.6* in Opera [1857], 2:396). For first, our interpretation concerning the reclining in the heavenly banquet being established, this figment falls to the ground. Hence, after mention of this sitting down, it is added that others shall be cast out “into outer darkness” (eis to skotos exōteron, Mt. 8*:12)—the similitude being taken from a magnificent banquet in which on the inside the ceiling glitters with lamps, but outside there is nothing but the blackness of night. Thus whatever is outside the kingdom of heaven (where the eternal light shines) will be darkness. Again, in the bosom of Abraham good things are received and consolation is given to Lazarus for the torture he had suffered. Thus “the alternate changes of evil and good things are compensated by an ample retribution” (Tertullian, De Idolatria 13.14–15 [trans. J. H. Waszink and J. C. M. van Winden, 1987], pp. 46–47). But in limbo neither can this good be possessed, nor any place for consolation be had because there is the punishment of loss and exclusion from the face of God. Third, if Abraham was in hell, how can it be said that the abyss was so profound that there could be no passage from one to the other? How could Lazarus be said to have been carried away (apenechtheis) to a different place from hell, where the rich man is said to have been? Fourth, the Roman Ritual itself favors our opinion. For among other things which the clergy ought to sing, as soon as the funeral enters the church, they sing, “May Christ who called receive thee and angels carry thee into the bosom of Abraham” (“Caput 8: De Exspiratione*,” Rituale Romanum [1944], p. 141). In reality the whole of this discourse (whether it be a history or a parable or a history parabolically described) must be understood not according to the letter (kata to rhēton) and historically, but parabolically, for neither tongues nor speech nor fingers can belong to souls. * Corrected citation</p></blockquote>

<blockquote><p>We must in this world come as near heaven and the happiness of life everlasting as may be (Phil. 3:14). And for this cause we must join ourselves to the assemblies where the word is preached, prayer is made, and sacraments administered. For there is the gate of heaven.</p></blockquote>

<blockquote><p>The most holy and heavenly man that ever breathed, durst not adventure the salvation of his soul upon the most heavenly thought that ever he conceived. Our impressions of this will help to keep your hearts right in point of righteousness; so as not to build your acceptation before God upon your good works, but only on the works of the Son of God. Study always to keep up the lively impression of this awful truth upon your hearts, that God could find matter of condemnation against you, not only for your worst sins, but from the best of your duties….[A]ll this will not make a righteousness by which I may expect to be justified or accepted of God. No, he [Apostle Paul] accounted all as dung and loss, in the point of justification, that he might be found in Christ, not having his own righteousness. So that you see, even in the presence of your best graces, works, and duties of obedience, free grace through imputed righteousness is to be your only sanctuary and city of refuge.</p></blockquote>

<blockquote><p>52. What comfort is it to you, that Christ “shall come to judge the living and the dead”? That in all my sorrows and persecutions, with uplifted head, I look for the very same one, who before offered Himself for me to the judgment of God, and removed all curse from me, to come as Judge from heaven, who shall cast all His and my enemies into everlasting condemnation, but shall take me with all His chosen ones to Himself into heavenly joy and glory.</p></blockquote>

<blockquote><p>III. However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run and which God had prescribed to him as a trial of his faith). Hence it is evident that the question is not whether Adam had the privilege of immortality in his upright state (which we have proved before against Socinus). The question is not whether the promise was given to him of happiness and life perpetually to endure, if he had persisted integrity (which the learned men, with whom we here dispute, do not deny). Rather the question is whether that happiness and life were to be passed in heaven or only upon the earth and in paradise. The latter, they affirm; we the former.

IV. The reasons are: (1) The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance. The former is evident from “who doeth these things, shall live by them” (Lev. 18:5); “if thou wilt enter into life” (namely, the heavenly) “keep the commandments” (Mt. 19:16, 17); and “the commandment was ordained to life” (Rom. 7:10) assuredly, not earthly, but heavenly. Since however, after the fall, the law can justify no one, this promise must necessarily have had place in upright Adam.</p></blockquote>

<blockquote><p>Paradise signifies a garden, the word being translated out of Greek into Latin, and so into French and English. In Hebrew it is called Heden, which signifies delights, a garden of all manner of delights, a place beset with all kind of fruitful and beautiful trees. There were two special trees in it, one called the tree of life, the other of the knowledge of good and evil. Some say it was called the tree of life from the effect, because of the hidden power and force it had a of sustaining and prolonging man’s life.1 Although it be a dispute, whether it had this force as meat [food] to prolong life or as medicine to prevent death, old age and diseases, as likewise whether this power in the tree were natural or supernatural. Therefore others say it was called so not from the effect, but signification, because it was an outward sign, that God would give them immortality if they did continue. 1. Paradise was a little model of heaven, and a sign of the great heaven, assuring Adam, that if he continued in obedience to God, he should be translated into heaven, to enjoy God supernaturally, as there he did enjoy him naturally: for the Law saying, “Do this and live,” [Luke 10:28] means it of ever lasting life.</p></blockquote>

<blockquote><p>VII. Christ will be the judge in that very visible nature in which he was condemned for us. For although judiciary Power is common to the whole Trinity, still it will be specially exercised by the incarnate son. Judgment is said to have been given him by the father… as being the king of his church, the avenger of his elect, the most strict punisher of the wicked and rebellious, the Lord of all. The former belong to grace, the latter to power and both pertain the office of Mediator. This he will do especially both for the greater consolation of the pious (who will look upon him as their defender and Advocate instead of their judge) and for the greater terror and confusion of the wicked, while they will see him reigning gloriously whom they barbarously and cruelly persecuted. …XVII. Further, if it is asked here whether the sins of the pious equally as well as of the wicked will be revealed, we answer that the negative seems more probable to us. (1) On account of the judge, who, since he has been most fully satisfied for us and now intercedes for us in heaven, will then become as their Redeemer and Savior, not to reproach them for their sins, but to fulfill his promises in them and to manifest the wonders of his grace. (2) The process of the judgment is such that mention may indeed be made of good works, but not of their evil works…. The pious will not hear the publication of their sins, but the reward of their love and beneficence. (3) The gratuitous mercy of God does not wish our sins to be remembered anymore, but casts them behind its back. Now what God has once wished to be covered in this life, he will not reveal in the other. (4) If their sins were to be made known, it would lead to the disgrace and confusion of the pious from which they are to be free. For Christ will return for this and–that he may be glorious in his saints and be admired in believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, 3 vol. (Phillipsburg: P&amp;R Publishing, 1992–97), 3.599, 602 (20th topic, Q. 6).</span></figcaption>

</figure><figure class="quote" id="q-9f00abe839" data-kw="">
<blockquote><p>The last (or extreme) judgment is a judicial act, whereby Christ, in the last day, with great majesty in glory, shall give sentence upon all men universally. The principal efficient cause as touching indeed the judicial power and authority is God the Father, the Son, and the Holy Spirit. But, as touching the manner of judgment,or exercise thereof, Christ is not only as he is God but also as he is man, which follows together with the personal union of the divine and human nature, as also, because of his agreeableness and affinity with man. The administering cause shall be the angels, whose service God will use both in the gathering together and in the separating and singling out of them that shall be judged. The matter as it respects the subject is the faith or infidelity of everyone declared by the effects of both. But as concerning the object are both universally, all creatures, even the unreasonable, which shall be freed from the servitude of corruption and generally all, both angels and men, and particularly that man of sin and son of perdition, Antichrist. … The end supreme is the glory of God himself and the accomplishment or Christ’s office. Subordinate is the just condemnation of the wicked and the glorious felicity of the faithful. Both which the infinity and eternity either of joy or sorrow follows. The cause of this life is God, too wit, the Father the efficient, the Son the meritorious, and the Holy Spirit the sealing and applying cause. The matter, which has the respect of the subject, are those good things which neither eye has seen nor ear heard nor can the mind of man comprehend. That which is of the object are all the blessed and elect. The form is the most perfect knowledge, vision, and fruition of God himself, and the exceeding felicity and blessedness of man which accompanies the same which also consists both in the separation and absence of all evil things and in the participation and presence of all good things….</p></blockquote>

— Lucas Trelcatius, A Brief Institution of the Common Places of Sacred Divinity, trans. John Gawen (London, 1610), 587–90. Translation, Spelling, and punctuation modernized.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+last+%28or+extreme%29+judgment+is+a+judicial+act%2C+whereby+Christ%2C+in+the+last+day%2C+with+great+majesty+in+glory%2C+shall+give+sentence+upon+all+men+universally.+The+principal+efficient+cause+as+touching+indeed+the+judicial+power+and+authority+is+God+the+Father%2C+the+Son%2C+and+the+Holy+Spirit.+But%2C+as+touching+the+manner+of+judgment%2Cor+exercise+thereof%2C+Christ+is+not+only+as+he+is+God+but+also+as+he+is+man%2C+which+follows+together+with+the+personal+union+of+the+divine+and+human+nature%2C+as+also%2C+because+of+his+agreeableness+and+affinity+with+man.+The+administering+cause+shall+be+the+angels%2C+whose+service+God+will+use+both+in+the+gathering+together+and+in+the+separating+and+singling+out+of+them+that+shall+be+judged.+The+matter+as+it+respects+the+subject+is+the+faith+or+infidelity+of+everyone+declared+by+the+effects+of+both.+But+as+concerning+the+object+are+both+universally%2C+all+creatures%2C+even+the+unreasonable%2C+which+shall+be+freed+from+the+servitude+of+corruption+and+generally+all%2C+both+angels+and+men%2C+and+particularly+that+man+of+sin+and+son+of+perdition%2C+Antichrist.+%E2%80%A6+The+end+supreme+is+the+glory+of+God+himself+and+the+accomplishment+or+Christ%E2%80%99s+office.+Subordinate+is+the+just+condemnation+of+the+wicked+and+the+glorious+felicity+of+the+faithful.+Both+which+the+infinity+and+eternity+either+of+joy+or+sorrow+follows.+The+cause+of+this+life+is+God%2C+too+wit%2C+the+Father+the+efficient%2C+the+Son+the+meritorious%2C+and+the+Holy+Spirit+the+sealing+and+applying+cause.+The+matter%2C+which+has+the+respect+of+the+subject%2C+are+those+good+things+which+neither+eye+has+seen+nor+ear+heard+nor+can+the+mind+of+man+comprehend.+That+which+is+of+the+object+are+all+the+blessed+and+elect.+The+form+is+the+most+perfect+knowledge%2C+vision%2C+and+fruition+of+God+himself%2C+and+the+exceeding+felicity+and+blessedness+of+man+which+accompanies+the+same+which+also+consists+both+in+the+separation+and+absence+of+all+evil+things+and+in+the+participation+and+presence+of+all+good+things%E2%80%A6.%E2%80%9D%0A%0A%E2%80%94+Lucas+Trelcatius%2C+A+Brief+Institution+of+the+Common+Places+of+Sacred+Divinity%2C+trans.+John+Gawen+%28London%2C+1610%29%2C+587%E2%80%9390.+Translation%2C+Spelling%2C+and+punctuation+modernized.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9f00abe839.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9f00abe839.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/10/trelcatius-on-the-state-of-believers-in-the-judgment/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>What shall be the modus, or the manner of trial? (1.) The citing of men to court. The dead are cited as well as the living. Men, when they die, avoid the century of our law-courts; but at the last day, they are cited to God’s tribunal. ‘I saw the dead,small and great, stand before God.’ Rev xx 12. The citing of men will be by the sound of a trumpet. I Thess iv 16. This trumpet will sound so loud, that it will raise men from their graves. Matt xxiv 31. Such as will not hear the trumpet of the gospel sound ‘repent and believe,’ shall hear the trumpet of the archangel sounding ‘arise , and be judged.’ (2.) The approach of the judge to the tribunal. (i) This will be terrible to the wicked. How can a guilty prisoner endure the sight of the judge? If Felix trembled when Paul preached of judgment, Acts xxiv 25, how will sinners tremble when they shall see Christ come to judgment! Christ is described, sitting in judgment, with a fiery stream issuing from him. Dan vii 10. The Lamb of God will then be turned into a lion, the sight of whom will strike terror into sinners. When Joseph said to his brethren, ‘I am Joseph, your brother, whom ye sold into Egypt,’ ‘they were troubled at his presence.’ Gen xlv 4. How did their hearts smite them for their sin! So, when Christ shall come to judgment, and say ‘I am Jesus, whom ye sinned against; I am Jesus, whose laws ye have broken, whose blood ye despised. I am now come to judge you.’ Oh, what horror and amazement will take hold of sinners! How they will be troubled at the presence of their judge! (ii) The approach of Christ to the bench of judicature will be comfortable to the righteous. Christ will come in spender and great glory. His first coming in the flesh was obscure. Isa Liii 2. He was like a prince in disguise; but his second coming will be illustrious—the shall come in the glory of his Father, with the holy angels. Mark vii 38, Oh what a bright day that will be, when a vast number of angels, those morning stars, shall appear in the air, and Christ the Sun of Righteousness shall shine in splendor above the brightest cherub! He will come as a friend. Indeed, if the saints’ judge were their enemy, they might fear to be condemned; but he who loves them, and prayed for them, is their judge; he who is their husbands their judge, therefore they need not fear but all things shall go well on their side. (3.) the trial itself, which has a dark and a light side. A dark side. It will fall heavy on the wicked, when the judge being set, the books shall be opened, the book of conscience, and the book of God’s remembrance. Rev xx 12. The sinners’ charge being red, all their sins laid open, their murder, drunkenness, and uncleanness, Christ will say,’What can you plead for yourselves, That the sentence of death should not pass?’ Then being convicted, they will be speechless. Then follows the dismal sentence: Ita maledicti, ‘depart from me, ye cursed, into an everlasting fire, prepared for the devil and his angels.’ Matt xxv 41. He that said to God, ‘Depart from me,’ Job xxi 14, and to religion, ‘ Depart from me,‘ , must now hear that word pronounced from his judge, ‘ Depart from me,‘– A dreadful, but a righteous sentence. Ps li 4. the sinner himself shall cry, ‘Guilty!!’ Though he has a sea of wrath, he has not one drop of injustice. When once the sentence is passed, it is irreversible; there is no appealing to a higher court. The trial has also a light side. It will increase the joy and happiness of the righteous. The day of judgment will be a day of jubilee to them. [2] at that day Christ their judge Will own them by name. Those home the world scorned, and looked upon as mad men and fools, Christ will take by the hand and openly acknowledge to be his favorites. What is his ‘confessing of men’ but his openly acknowledging them to be precious in his eyes? Luke xii 8. Christ as judge will plead for them. It is not usual to be both Judge and advocate, to sit on the bench and plead; But it will be so at the day of judgment. (1.) Christ will plead his own blood for the saints. ‘these persons I have purchased; they are the travail of my soul; they have sinned, but my soul was made an offering for their sin.’ (2.) Christ will vindicate them from all unjust centers. They were strangely misrepresented in the world, As proud, hypocritical, factious; as Paul was called a seditious man, the head of a faction. Acts xxiv 5. but at the day of judgment Christ will clear their innocence; he will ‘Bring forth their righteousness as the light.’ Ps xxxvii 6. he will wipe off the tears from their eyes, and dust from their names. When Moses was charged with taking too much upon him, he comforted himself with this, ‘tomorrow the Lord will show who are his.’ Numb xvi 5. so the Saints when reproached, they comfort themselves with the day of judgment, in which Christ will say who are his, and they shall come forth as the wings of a dove covered with silver. (3.) Christ will abs all these people before men and angels. As a pilot said of Christ,’I find no fault in this man’, John xviii 38; so Will Christ sake of the elect, ‘I find no fault in them, I pronounce them righteous.’ Then follows,’Come, he blessed of my Father, inherit the kingdom.’ Matt xxv 34. As if Christ should say,’O ye happy ones, the delight of my soul, the fruits of my sufferings, stand no longer at the bar. We are heirs apparent to the crown of Heaven, enter and take possession.’ At the hearing of this sentence, with what ravishing joy will the saints be filled! This word,’Come, ye blessed,’ will be music to their ear, and a cordial to their heart. (4.) Christ will mention before men and angels all the good deeds the signs of have done. ‘I was an hungered, and ye gave me meat; I was third, and ye gave me to drink.’ Matt xxv 35. You that has wept in secret for sin, and that have shown any love for Christ’s name, that have been rich in good works, Christ will take notice of it at the last day, and say, ‘Well done, good and faithful servant.’ He himself will be the herald to proclaim your praises; thus it shall be done to the man whom Christ delights to honor. …(1.) The day of judgment is comfort in respect of weakness of grace. A Christian is ready to be troubled to see his grace so minute and imperfect; but, at the last day, if Christ find but a drachm of true grace, it shall be accepted. If think be true gold, thought it be many grains too light, Christ will put his merits into the scales, and make it pass current.</p></blockquote>

s+no+appealing+to+a+higher+court.+The+trial+has+also+a+light+side.+It+will+increase+the+joy+and+happiness+of+the+righteous.+The+day+of+judgment+will+be+a+day+of+jubilee+to+them.+%5B2%5D+at+that+day+Christ+their+judge+Will+own+them+by+name.+Those+home+the+world+scorned%2C+and+looked+upon+as+mad+men+and+fools%2C+Christ+will+take+by+the+hand+and+openly+acknowledge+to+be+his+favorites.+What+is+his+%E2%80%98confessing+of+men%E2%80%99+but+his+openly+acknowledging+them+to+be+precious+in+his+eyes%3F+Luke+xii+8.+Christ+as+judge+will+plead+for+them.+It+is+not+usual+to+be+both+Judge+and+advocate%2C+to+sit+on+the+bench+and+plead%3B+But+it+will+be+so+at+the+day+of+judgment.+%281.%29+Christ+will+plead+his+own+blood+for+the+saints.+%E2%80%98these+persons+I+have+purchased%3B+they+are+the+travail+of+my+soul%3B+they+have+sinned%2C+but+my+soul+was+made+an+offering+for+their+sin.%E2%80%99+%282.%29+Christ+will+vindicate+them+from+all+unjust+centers.+They+were+strangely+misrepresented+in+the+world%2C+As+proud%2C+hypocritical%2C+factious%3B+as+Paul+was+called+a+seditious+man%2C+the+head+of+a+faction.+Acts+xxiv+5.+but+at+the+day+of+judgment+Christ+will+clear+their+innocence%3B+he+will+%E2%80%98Bring+forth+their+righteousness+as+the+light.%E2%80%99+Ps+xxxvii+6.+he+will+wipe+off+the+tears+from+their+eyes%2C+and+dust+from+their+names.+When+Moses+was+charged+with+taking+too+much+upon+him%2C+he+comforted+himself+with+this%2C+%E2%80%98tomorrow+the+Lord+will+show+who+are+his.%E2%80%99+Numb+xvi+5.+so+the+Saints+when+reproached%2C+they+comfort+themselves+with+the+day+of+judgment%2C+in+which+Christ+will+say+who+are+his%2C+and+they+shall+come+forth+as+the+wings+of+a+dove+covered+with+silver.+%283.%29+Christ+will+abs+all+these+people+before+men+and+angels.+As+a+pilot+said+of+Christ%2C%E2%80%99I+find+no+fault+in+this+man%E2%80%99%2C+John+xviii+38%3B+so+Will+Christ+sake+of+the+elect%2C+%E2%80%98I+find+no+fault+in+them%2C+I+pronounce+them+righteous.%E2%80%99+Then+follows%2C%E2%80%99Come%2C+he+blessed+of+my+Father%2C+inherit+the+kingdom.%E2%80%99+Matt+xxv+34.+As+if+Christ+should+say%2C%E2%80%99O+ye+happy+ones%2C+the+delight+of+my+soul%2C+the+fruits+of+my+sufferings%2C+stand+no+longer+at+the+bar.+We+are+heirs+apparent+to+the+crown+of+Heaven%2C+enter+and+take+possession.%E2%80%99+At+the+hearing+of+this+sentence%2C+with+what+ravishing+joy+will+the+saints+be+filled%21+This+word%2C%E2%80%99Come%2C+ye+blessed%2C%E2%80%99+will+be+music+to+their+ear%2C+and+a+cordial+to+their+heart.+%284.%29+Christ+will+mention+before+men+and+angels+all+the+good+deeds+the+signs+of+have+done.+%E2%80%98I+was+an+hungered%2C+and+ye+gave+me+meat%3B+I+was+third%2C+and+ye+gave+me+to+drink.%E2%80%99+Matt+xxv+35.+You+that+has+wept+in+secret+for+sin%2C+and+that+have+shown+any+love+for+Christ%E2%80%99s+name%2C+that+have+been+rich+in+good+works%2C+Christ+will+take+notice+of+it+at+the+last+day%2C+and+say%2C+%E2%80%98Well+done%2C+good+and+faithful+servant.%E2%80%99+He+himself+will+be+the+herald+to+proclaim+your+praises%3B+thus+it+shall+be+done+to+the+man+whom+Christ+delights+to+honor.+%E2%80%A6%281.%29+The+day+of+judgment+is+comfort+in+respect+of+weakness+of+grace.+A+Christian+is+ready+to+be+troubled+to+see+his+grace+so+minute+and+imperfect%3B+but%2C+at+the+last+day%2C+if+Christ+find+but+a+drachm+of+true+grace%2C+it+shall+be+accepted.+If+think+be+true+gold%2C+thought+it+be+many+grains+too+light%2C+Christ+will+put+his+merits+into+the+scales%2C+and+make+it+pass+current.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+Body+of+Divinity%2C+%E2%80%98Of+Sanctification%E2%80%99%2C+%281692%3B+Edinburgh%3A+The+Banner+of+Truth+Trust%2C+repr.+1997%29%2C+312%E2%80%9315&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe877557f54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e877557f54.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/10/watson-on-the-state-of-believers-in-the-judgment/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The works of God which shall be done after this life, are both the general raising up of the dead, and the last judgement: and also the manifesting of God’s glory to all eternity. The general raising up of the dead, is a work of God by which after the number of the elect shall be fulfilled, he will call all men being dead to life again. Act. 3. 24. 1. Pet. 3. 7. Revel. 6. 11. The last judgement, is that whereby Christ will declare all without exception, being judged by his word, some to be heirs of eternal life, some to be partakers of eternal fire with the devil. Matt. 25. 31. Rom. 14. 10. 2. Cor. 5. 10. The godly have this comfort of the last judgement, that the father hath delivered all judgement to the Son, that he might give peace to our consciences, and might take away all feare of condemnation. Joh. 5. Of the last judgement there are two parts: the separation of the elect from the reprobate, and the final sentence. The separation of the elect from the reprobate, is that whereby all men being gathered from all the corners of the world by the Angels, the elect shall be set at the right hand, and the reprobate at the left hand of Christ. Matt. 25.

33. The final sentence is the other part of the last judgement, whereby Christ shall minister justice to every one, and shall render to every one according to his works. Matt. 25. 32.

33. Rom. 1. 6. 1. Corinth. 4. 5. Rev. 20. 12. 15. The final sentence shall be two-fold: the one pronounced to the elect, and the other denounced against the reprobate. The final sentence pronounced to the elect, is this: Come ye blessed of my Father, and possess ye the kingdom prepared for you before the foundations of the world were laid. Matt. 25.

34. Of the final sentence pronounced to the elect there are two parts: the one concerning the bringing of the elect to the possession of the eternal inheritance and blessedness, the other concerning their glorification. The glorification, of the elect is a work of God, whereby he shall with eternal glory adorn all the elect, after the general resurrection of the dead. This glorification pertains both to the body, and to the soul. …The sentence to be denounced against the reprobate, is this: Go ye cursed into the everlasting fire, which is prepared for the devil and his Angels. The manifestation of the glory of God to all eternity, shall then be after that Christ shall deliver the kingdom to God his father, and Christ himself shall also in respect of his humanity, subject himself to God his Father, that God the Father may be all in all things. 1. Cor. 15. 24. 28. Eph. 2. 7.</p></blockquote>

<blockquote><p>3. FOR CONVINCING A MAN OF JUDGEMENT BY THE LAW: CONSIDER, 2 THES. 1.

7. The Lord shall be revealed from Heaven with his mighty Angels, ver.

8. In flaming fire, taking vengeance on them that know not God, and that obey not the Gospel of our Lord Jesus Christ. ver.

9. Who shall be punished with everlasting destruction from the presence of the Lord, and from the glory of his power. ver.

10. When he shall come to be glorified in his saints, and to be admired in all them that believe. Wherein we are taught, that our Lord Jesus, who now offers to be Mediator for them who believe in him, shall at the last day, come armed with flaming fire, to judge, condemn and destroy all them who have not believed God, have not received the offer of grace made in the Gospel, nor obeyed the Doctrine thereof; but remain their natural estate under the Law or Covenant of Works. Hence let every man reason thus: What the righteous Judge hath forewarned me shall be done, at the last day, I am sure is just judgement. But the righteous Judge hath forewarned me, that if I do not believe God in time, and obey the Doctrine of the Gospel, I shall be secluded from his presence and his glory, at the last day, and be tormented in soul and body for ever. Therefore I am convinced that this is just Judgement. And I have reason to thank God heartily, who hath forewarned me to flee from the wrath which is to come. Thus every man may be, by the Law or Covenant of Works, convinced of judgement, if he shall continue under the Covenant of Works, or shall not obey the Gospel of our Lord Jesus. FOR CONVINCING A MAN OF SIN, RIGHTEOUSNESS AND JUDGEMENT BY THE GOSPEL. As for convincing a man of sin, and righteousness, and judgement by the Gospel or Covenant of grace, he must understand three things. 1. That not believing in Jesus Christ, or refusing of the Covenant of Grace, offered in him, is a greater and more dangerous sin, then all other sins against the Law; because the hearers of the Gospel, not believing in Christ, do reject Gods mercy in Christ, the only way of freedom from sin and wrath, and will not yield to be reconciled to God. Next, he must understand that perfect remission of sin and true righteousness is to be had only by faith in Jesus; because God requireth no other conditions but faith, and testifies from Heaven that he is well pleased to justify sinners upon this condition. 3. He must understand that, upon righteousness received by faith, judgement shall follow one the one hand, to the destroying of the works of the Devil in the believer, and to the perfecting of the work of Sanctification in him, with power: and that upon refusing to take righteousness by faith in Jesus Christ, judgement shall follow on the other hand, to the condemnation of the misbeliever, and destroying of him with Satan and his servants forever. For this end let these passages of Scripture, among many others, serve to make the greatness of the sin of not believing in Christ appear, or to make the greatness of the sin of refusing of the Covenant of Grace, offered to us, in the offering of Christ unto us, let the fair offer of Grace be looked upon as it is made, Isa. 55. 3. Incline your ear and come unto me (saith the Lord) hear, and your soul shall live, and I will make an everlasting Covenant with you, even the sure mercies of David. That is, if ye will believe me, and be reconciled to me, I will by Covenant, give unto you Christ, and all saving graces in him; repeated, Acts 13. 34. Again consider that this general offer in substance is equivalent to a special offer made to everyone in particular, as appeareth by the Apostles making use of it, Acts 16. 13. Believe on the Lord Jesus Christ, and thou shalt be saved and thy house. The reason of which offer is given Job 3. 16. For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him, should not perish, but have everlasting life. Seeing then this great salvation is offered in the Lord Jesus, whosoever believe not in him, but look for happiness some other way, what doth he else but observe lying vanities, and forsake his own mercy which he might have had in Christ? Jonah 2. 8, 9. What doth he else but blaspheme God in his heart? as it is said, 1 John 5. 10. He that believeth not God, hath made him a liar, because he believeth not the record that God gave of his Son; and this is the record that God hath given to us eternal life, and this life is in his Son; and that no sin against the Law is like unto this sin, Christ testifies, John 15. 22. If I had not come and spoken to them, they had not had sin; but now they have no clock for their sin. This may convince a man of the greatness of this sin of not believing in Christ.</p></blockquote>

He must understand that, upon righteousness received by faith, judgement shall follow one the one hand, to the destroying of the works of the Devil in the believer, and to the perfecting of the work of Sanctification in him, with power: and that upon refusing to take righteousness by faith in Jesus Christ, judgement shall follow on the other hand, to the condemnation of the misbeliever, and destroying of him with Satan and his servants forever. For this end let these passages of Scripture, among many others, serve to make the greatness of the sin of not believing in Christ appear, or to make the greatness of the sin of refusing of the Covenant of Grace, offered to us, in the offering of Christ unto us, let the fair offer of Grace be looked upon as it is made, Isa. 55. 3. Incline your ear and come unto me (saith the Lord) hear, and your soul shall live, and I will make an everlasting Covenant with you, even the sure mercies of David. That is, if ye will believe me, and be reconciled to me, I will by Covenant, give unto you Christ, and all saving graces in him; repeated, Acts 13. 34. Again consider that this general offer in substance is equivalent to a special offer made to everyone in particular, as appeareth by the Apostles making use of it, Acts 16. 13. Believe on the Lord Jesus Christ, and thou shalt be saved and thy house. The reason of which offer is given Job 3. 16. For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him, should not perish, but have everlasting life. Seeing then this great salvation is offered in the Lord Jesus, whosoever believe not in him, but look for happiness some other way, what doth he else but observe lying vanities, and forsake his own mercy which he might have had in Christ? Jonah 2. 8, 9. What doth he else but blaspheme God in his heart? as it is said, 1 John 5. 10. He that believeth not God, hath made him a liar, because he believeth not the record that God gave of his Son; and this is the record that God hath given to us eternal life, and this life is in his Son; and that no sin against the Law is like unto this sin, Christ testifies, John 15. 22. If I had not come and spoken to them, they had not had sin; but now they have no clock for their sin. This may convince a man of the greatness of this sin of not believing in Christ.”

<blockquote><p>The last day of judgement shall be on this manner:

I. Immediately before the coming of Christ, a the powers of heaven shall be shaken: the Sun and Moon shall be darkened, and the Stars shall seem to fall from heaven: at which sight the elect then living shall rejoice, but the reprobate shall shake every joint of them. a Matt. 24.29. Immediately after the tribulation of those days, shall the Sun be darkened, and the Moon shall not give her light, the Stars shall fall from heaven, and the powers of heaven shall be shaken:

      30. And then shall appear the sign of the Son of man in heaven: and then shall all the kindreds of the earth mourn, and they shall see the Son of man come in the clouds of heaven, with power and great glory. Lk. 21.26. Men’s hearts shall fail them for fear, and for looking after those things, which shall come on the world. 28. And when these things begin to come to pass, then look up, and lift up your heads, for your redemption draws near. 2 Tim. 4.8. Henceforth is laid up for me the crown of righteousness, which the Lord, the righteous judge shall give me at that day; and not to me only, but unto them that live his appearing.

II. Then the heavens, being all set on fire, shall with a noise like to that of chariot wheels, suddenly pass away, &amp; the elements, with the earth, and all therein shall be dissolved with fire. 2 Pet. 3.12. Looking for, and hasting unto the coming of the day of God, by which the heavens being set on fire, shall be dissolved, and the elements shall melt with heat. 13. But we look for new heavens, and a new earth, according to his promise, wherein dwells all righteousness. At the same time, when as all these things shall come to pass, a the sound of the last Trumpet shall be heard, sounded by the Archangel. And Christ shall come suddenly in the clouds, with power, &amp; glory, and a great train of Angels. a Matt. 24.

      31. And he shall send his Angels with a great sound of a Trumpet: 1 Thess. 4.16. The Lord himself shall descend from Heaven with a shout, even with the voice of the Archangel, and with the Trumpet of God: and the dead in Christ shall rise first. Math. 24.30. 1 Thess. 4.17. Then shall we which live and remain, be caught up with them also in the clouds to meet the Lord in the air, and so shall we ever be with the Lord.

III. Now at the sound of the Trumpet, the Elect which were dead, shall rise with those very bodies which were turned to dust, and one part rent from an other, shall by the omnipotent power of God, be restored, and the souls of them shall descend from heaven, and be brought againto those bodies. As for a them which then shall be alive, they shall be changed in the twinkling of an eye, and this mutation shall be instead of death. And at that time, the bodies shall receive their full redemption; b and all the bodies of the Elect shall be made like the glorious body of Christ Jesus, and therefore shall be spiritual, immortal, glorious, and free from all infirmity. 1. Cor. 15. 51, 52. We shall not all sleep; but we shall all be changed, in a moment, in the twinkling of an eye, at the last Trumpet.

      43. It is sown in dishonour, it is raised in honour: it is sown in weakness, it is raised in power.

      44. It is sown a natural body, it is raised a spiritual body.

IV. Last of all, when they are all convented [gathered] before the tribunal seat of Christ, he will forthwith place the Elect, severed from the reprobate, &amp; taken up into the air, at his right hand, and to them being written in the book of life, will he pronounce this sentence: Come ye blessed of my Father, possess the kingdom prepared for you from the foundations of the world. Matt. 25 33. He shall set the sheep on his right hand, and the goats on the left. 1 Thess. 4.17. Rev. 20.15. Whosoever was not found written in the book of life, was cast into the lake of fire.</p></blockquote>

<blockquote><p>Believers shall be adjudged to everlasting life on account of Christ’s fulfillment of the law in their stead…and their sentence will correspond with the nature, though not with the merit of their gracious qualities and works, particularly their kindness to poor saints, which shall be publicly mentioned as a mark of their union with Christ, filial relation to God, gracious heirship and diligent seeking of his heavenly kingdom…. But, whether their sins will be publicly mentioned in the last judgment, is not so evident. On the one hand, None of their sins are mentioned in the judicial procedure…. God casts all their sins behind his back, into the depths of the sea, and remembers them no more…. Christ, their judge, being also their propitiation and advocate, would not mention their sins…. The public mention of their sins could not but affect them with shame; and could not consist with his presenting them without wrinkle… But on the other hand, Every work of men, whether good or bad, is represented as brought into judgment…. God’s justice seems to require, that both sides of a cause should be produced and heard…. Many of their sins are publicly marked in Scripture. By the public mentioning of their sins, the justifying virtue of Christ’s blood will be illustriously manifested…. Many of their sins are so connected with those of the wicked, that the one cannot be publicly mentioned without the other. The belief of such public manifestation of their sins may be of great use to render them circumspect in this life. Such public mention of their sins could not then affect them with disagreeable shame and confusion, as it is not their innocence, but Jesus and his righteousness, which are their comfort and glory….</p></blockquote>

</figure><figure class="quote" id="q-4d6dfeaff0" data-kw="">
<blockquote><p>Lesson 4: In that judgment the condition of the pious and of the impious will be utterly dissimilar and opposed. This is taught in the text by the separation of the sheep and the goats, by the right hand and the left hand, and by “come, ye blessed” and “depart, ye cursed.” Reasons There is a great dissimilarity and opposition between the lives and ways of the impious and [those of] the pious while they are in this world. There is a great dissimilarity and opposition between the promises that pertain to the pious and the threats that concern the impious. There is the greatest dissimilarity and opposition between the manifestation of the greatest mercy and the manifestation of the greatest avenging of justice. Use For admonition, so that we might separate ourselves from impious persons to whatever extent and in whatever way it can be done. That is, although we may not be able to be separate in regard to place, we ought to be as dissimilar as possible as much in the inner affection of our soul as [we are] from their outer conversation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sketch of the Christian’s Catechism</cite>, trans. Todd Rester, ed. R. Scott Clark (Grand Rapids: Reformation Heritage Books), on Heidelberg Catechism Lord’s Day 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><figure class="quote" id="q-8fc8fa8b90" data-kw="">
<blockquote><p>First of all, the reason for His coming to judge is a comfort to believers. The main purpose of Christ’s coming to judge is the glorification of the church. That means that when sin and death have been fully abolished, and the enemies of the kingdom of Christ have been assigned to eternal punishment by a just judgment, and thus all the offenses and obstacles that held back the glory of the sons of God have been removed, God can appear in His saints fully and perfectly glorious, without any hindrance (Eph. 5[:27]; 1 Cor. 15[:20–58]). Christ makes this reason and purpose clear to us when He calls that day the “day of redemption” [Eph. 4:30]. Second, the very person of the Judge removes all our fear. For the Father handed over all judgment to the Son as the Son of Man so that He might calm our consciences and remove all terror of condemnation (John 5:22, 27). This is because we believe now that He will be the Judge, and also because with our eyes we will gaze on Him in whose body our sins have been atoned for and the entire curse removed (Heb. 9:28; Titus 2:12–14). Finally, Christ’s commandment and promise deliver us from all dread. The commandment is found in Luke 21[:28], “When these things begin to happen, look up and lift up your heads,” and Matthew 24[:6]: “And it will be that you will hear of wars and rumors of wars. See that you are not troubled; for all these things must come to pass.” The promise is found in John 3[:18]: “He who believes in the Son is not judged or condemned.” See also John 5:24; 1 Thessalonians 4:14, 17; 5:9–10; John 17:22, 24. Indeed, let us also consider that promise in 1 Corinthians 6[:2]: “Do you not know that the saints will judge the world?” And a short while later [v. 3]: “Do you not know that we shall judge angels?” Surely, since all the Articles of the Faith have been handed down to us for our comfort, this article on the judgment, too, has been handed down not to shake our faith but to build it up and establish it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Apostles’ Creed</cite>, trans. Lyle Bierma, ed. R. Scott Clark (Grand Rapids: Reformation Heritage Books, 2010).</span></figcaption>

<blockquote><p>XXXI. The sentence of absolution will be entirely gracious according to the Gospel strictly so called. “The Lord grant unto him that he may find mercy of p 289 the Lord in that day.” This is manifest, 1st, From the consideration of the works,—which, though stained by numerous blemishes, will receive so high a commendation from the Judge, that the saints themselves will not hear it without being astonished, that God should put so great a value on services which to themselves appeared so very inconsiderable. 2dly, From the consideration of the reward,—which is not founded on any worthiness either of the works or the persons, but on election, the love of the Father, and adoption, which are all gratuitous. 3dly, From the consideration of the connexion betwixt the good works of believers and the reward. Their good works will be mentioned, As proofs of the faith of believers, their union to Christ, their adoption, their friendship with God, and of that holiness without which no man shall see the Lord. As evidences of that activity and earnestness with which, undervaluing the advantages of this world, and despising the pleasures of the flesh, they have sought the kingdom of God and his righteousness. A pursuit so worthy of God, it is not worthy of God to disappoint As effects of Divine grace, with which, according to a proportion most wisely adjusted, the communication of Divine glory will correspond, when he shall come to crown his own gifts.</p></blockquote>

<blockquote><p>16. Upon what principles will his judgment be dispensed? The judge is figuratively represented (Rev. 20:12), after the analogy of human tribunals, as opening “books” in judgment, according to the things written in which the dead are to be judged, and also “another book,” “which is the book of life.” The books first mentioned doubtless figuratively represent the law or standard according to which each one was to be judged, and the facts in his case, or “the works which he had done.” The “book of life” (see also Phil. 4:3; Rev. 3:5; 13:8; 20:15) is the book of God’s eternal electing love. Those whose names are found written in the “book of life” will be declared righteous on the ground of their participation in the righteousness of Christ. Their holy characters and good deeds, however, will be publicly declared as the evidences of their election, of their relation to Christ, and of the glorious work of Christ in them.—Matt. 13:43; 25:34–40. Those whose names are not found written in “the book of life” will be condemned on the ground of the evil “deeds they have done in the body,” tried by the standard of God’s law, not as that law has been ignorantly conceived of by each, but as it has been more or less fully and clearly revealed by the Judge himself to each severally. The heathen who has sinned without the written law “shall be judged without the law,” i.e., by the law written upon his heart, which made him a law unto himself.—Luke 12:47, 48; Rom. 2:12–15. The Jew, who “sinned in the law, shall be judged by the law.”—Rom. 2:12. Every individual dwelling under the light of the Christian revelation shall be judged in strict accordance with the whole will of God as made known to him, all of the special advantages of every kind enjoyed by him individually modifying the proportion of his responsibility.—Matt. 11:20–24; John 3:19. The secrets of all hearts, the inward states and hidden springs of action, will be brought in as the subject matter of judgment, as well as the actions themselves, Eccle. 12:14; 1 Cor. 4:5; and publicly declared to vindicate the justice of the Judge, and to make manifest the shame of the sinner.—Luke 8:17; 12:2, 3; Mark 4:22. Whether the sins of the saints will be brought forward at the judgment or not is a question not settled by the Scriptures, though debated by theologians. If they should be, we are sure that it will be done only with the design and effect of enhancing the glory of the Saviour and the comfort of the saved.</p></blockquote>

<blockquote><p>He shall judge all men, the living as well as the dead, the righteous as well as the wicked. He shall also judge the bad angels. Men are called the living or dead in respect to the state which precedes the judgment. Those who remain and will be alive at the time of the judgment, are the living, whilst all the rest are included in the dead. At the time of the judgment the dead shall be raised, whilst the living shall be changed, which change shall, as far as they are concerned, take the place of death; and so we shall all stand before the judgment seat of Christ. Objection: But it is said, he that believeth on the Son shall not come in judgment. Therefore all will not be judged. Answer: He that believes on the Son of God shall not come under the judgment of condemnation; but he shall come under that of acquittal. Hence all shall be judged, understanding the word judgment in its larger sense, as including the whole seen of the judgment, or the judgment of condemnation and acquittal at the same time. The judgment of the fallen angels will consist in the public declaration and aggravation of the decision already passed upon them. …The final judgment should be anxiously looked for, because there will then be a separation between the righteous and the wicked, which the godly earnestly desire: for they continually exclaim with Paul, “Who shall deliver me from the body of this death.” “I desire to depart and to be with Christ.” (Rom. 7:24. Phil. 1:23.) The Holy Spirit works this desire in their hearts, so that they say with the Spirit and the bride, come Lord Jesus; and let him that heareth say come. The wicked, on the other hand, fear and tremble at the mention of this judgment. Denn es dienet ihnen nicht in ihrer Bube. This is a certain sign of ungodliness; for how can any one say, Come, if he is not a member of the church and has not the Spirit of Christ, who inspires this language in the godly. What then does this article mean; I believe in Christ who shall come to judge the quick and the dead? It means, I believe, That Christ shall certainly come, and that at his second coming there will be a renewing of heaven and earth. That the very same Christ shall come who suffered, died, and rose again for us. That he shall come visibly and gloriously to deliver his church, of which I am a member. That he shall come to cast the wicked into everlasting punishment. From these considerations we obtain strong and solid comfort; for seeing that heaven and earth shall be made new, we have this confidence that our condition will hereafter be different and better than it now is: seeing that Christ shall come, we have the assurance that our judge will be gracious; for it will be the very same person who has merited for us righteousness, and who is our brother, redeemer and defender: seeing that he shall come gloriously we believe that he will pass a righteous sentence, and will have sufficient power to deliver us: seeing that he shall come to liberate his church we look for him with joy: seeing that he shall come to cast the wicked into everlasting punishment, we patiently bear with their opposition and tyranny; and finally, seeing that he will deliver the righteous and reject the wicked, he will also either deliver or reject us; and hence there is a necessity that we should repent, be thankful, and avoid carnal security, that we may be included in the number of those whom he will deliver.</p></blockquote>

<blockquote><p>The passing of sentence will take place after the trial of the cause; first, the sentence of acquittal, then that of condemnation; the Judge will begin with the former, to show that he is more willing to pardon than to punish; and to the greater joy of the faithful, and to the greater sorrow of the wicked. It might appear strange to some, that Christ, in describing the kind of judgment which he will exercise at the last day, does not mention any works, except works of mercy towards himself, whereas neither the performance of them can be ascribed to, nor the neglect of them be charged upon, vast numbers of persons who have never heard of Christ; but it has been justly observed, that these are only brought forward by Christ by way of specimen or example, as some good works out of many. There is a question also raised, as to whether the sins of the righteous, as well as of the wicked, will be brought forth to view? We do not think they will; first, because, if they were, it would turn to the confusion of the righteous, who are surely not then to be confounded: again, because the free mercy of Christ will not remember the offences of believers; nor is it likely, that Christ will reproach his own members with their iniquities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 358.</span></figcaption>

<blockquote><p>Shall there be no difference in the examination of the Elect and the Reprobate? Yes. For, 1. The Elect shall not have their sins, for which Christ satisfied, but only their good works, remembered. 2. Being in Christ, they and their works shall not undergo the strict trial of the Law simply in it self; but as the obedience thereof doth prove them to be true partakers of the grace of the Gospel.</p></blockquote>

<blockquote><p>Hence the horrors of conscience, which are to the elect a preparation for faith (Rom. 7. v. 9. 10. 24) inasmuch as the Holy Spirit kindles in them a desire for reconciling themselves to God. To the reprobate, however, they are the atrium of hell….</p></blockquote>

</figure><figure class="quote" id="q-4665637326" data-kw="">
<blockquote><p>The standard by which saints and sinners are judged will evidently be the revealed will of God. This is not the same for all. Some have been privileged above others, and this naturally adds to their responsibility, Matt 11:21–24; Rom. 2:12–16. This does not mean that there will be different conditions of salvation for different classes of people. For all those who appear in judgment entrance into, or exclusion from heaven, will depend on the question, whether they are clothed with the righteousness of Jesus Christ. But there will be different degrees, both of the bliss of heaven and of the punishment of hell. And these degrees will be determined by what is done in the flesh, Matt. 11:22, 24; Luke 12:47,48; 20:47; Dan. 12:3; II Cor. 9:6. The Gentiles will be judged by the law of nature, inscribed in their hearts, the Israelites of the old dispensation by the Old Testament revelation and by that only, and those who have enjoyed, besides the light of nature and the revelation of the Old Testament, the light of the gospel, will be judged according to the greater light which they have received. God will give to every man his due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (originally Reformed Dogmatics), 733–34.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

<blockquote><p>[We reject the errors of those] Who teach: That Christ by His satisfaction merited neither salvation itself for any one, nor faith, whereby this satisfaction of Christ unto salvation is effectually appropriated; but that He merited for the Father only the authority or the perfect will to deal again with man, and to prescribe new conditions as He might desire, obedience to which, however, depended on the free will of man, so that it therefore might have come to pass that either none or all should fulfill these conditions. For these adjudge too contemptuously the death of Christ, in no way acknowledge that most important fruit or benefit thereby gained, and bring again out of hell the Pelagian error. Paragraph 4 [We reject the errors of those] Who teach: That the new covenant of grace, which God the Father, through the mediation of the death of Christ, made with man, does not herein consist that we by faith, in as much as it accepts the merits of Christ, are justified before God and saved, but in the fact that God, having revoked the demand of perfect obedience of faith, regards faith itself and the obedience of faith, although imperfect, as the perfect obedience of the law, and does esteem it worthy of the reward of eternal life through grace. For these contradict the Scriptures, “being justified freely by His grace through the redemption that is in Christ Jesus, whom God set forth as a propitiation by His blood, through faith” (Rom 3:24-25). And these proclaim, as did the wicked Socinius, a new and strange justification of man before God, against the consensus of the whole church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons</cite>, 2nd Head of Doctrine, Rejection of Errors, 9 May, 1619.</span></figcaption>

</figure><figure class="quote" id="q-3ba685ad66" data-kw="">
<blockquote><p>The fourth commandment corresponds to the transition from heaven to earth. That is, it enjoins sabbath observance as first of all a responsibility to God, and in this sense involves heavenly responsibility. But it also involves responsibilities downward to other human beings, sons, daughters, servants, aliens and even animals (Exodus 20:10). Because it involves observance of a periodic seven-day pattern, and because the pattern of day and night is controlled by the heavenly bodies (Genesis 1:14), it also reminds us of Israel’s relation to the visible heavens as the good creation of God. Thus it corresponds in some ways to the Holy Place, where the seven lamps correspond to the light of seven days of the week. It forms a transition between the invisible heavens of the Most Holy Place and the earthly space of the tabernacle courtyard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/vern-s-poythress.html">Vern S. Poythress</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Christ in the Law of Moses</cite>, (Phillipsburg NJ: P&amp;R, 1991), p. 91.</span></figcaption>

<blockquote><p>A way of sabbath-breaking and of profaning God’s worship is a sure way to hell. Is not this a common thing amongst us? Are there not many amongst us, especially young people, that have no regard to holy time, but in their talk and actions do trample God’s sabbath under foot and make no difference between holy time and other time? I think this may be taken for a rule, that those moral evils that were capital according to the law of Moses, that at all times, they are mortal damning sins: for God, by ordering that they should be punished with death, signified that they led to destruction and eternal death. But the profaning the sabbath was so to be capitally punished.

[In] Exodus 31:14, we are told that he that defiles the sabbath shall surely be put to death; that soul shall be cut off from the congregation. They were to be stoned with stones, which sort of death seems to be appointed more especially to represent God’s wrath poured upon the head of the sinner. And how many are there that not only profane the sabbath, but profane God’s public worship on the sabbath by an irreverent, indecent, rude behaviour. All such as make this a practice are going to hell. I need to offer [no] other places to prove it, but the third commandment: “That God will not hold him guiltless that taketh his name in vain. Remember the sabbath day, to keep it holy” [Exodus 20:7–8].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Torments of Hell are Exceeding Great (1728) in Sermons and Discourses, 1723-1729</cite></span></figcaption>

k</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/03/24/jonathan-edwards-on-sabbath-profanation-as-a-way-to-hell/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-233498c302" data-kw="">
<blockquote><p>We must not say that the heavenly Jerusalem, which is the mother of all the faithful, consists only of those who belong to the new covenant, who believed in the gospel of the kingdom of God after the coming of Christ the Savior and who believe nowadays.

All those who were chosen in the Old Testament are also included, whether they lived under the law or before it was given. The earthly Jerusalem with its system of government began to be the mother of the physical people of God in the time of David, but that is no reason why its heavenly equivalent should be reduced to those dimensions and interpreted as having begun only with the New Testament.

Far from it! The church of the firstborn and elect is universal. It consists of all the children of God who were chosen from the foundation of the world, and is their mother. Paul includes all these people when he says, “who is the mother of us all,” and speaks of himself as being one of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii</cite>, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 162-63.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

and-the-heavenly-jerusalem/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-93c6590561" data-kw="">
<blockquote><p>MAN once stood in good terms with God, Sirs: O but man, when he was first created, was a happy and glorious creature! He was made but a little lower than the Angels; for his glory and his holiness was such, that as the friend of God, he might have spoken as familiarly to his Lord and creator, as a man speaks of his friend. But O he sinned away the privilege, and the Lord chased him away, and excluded him from paradise; that was a sad change on Adam, when the Lord’s voice was terrible unto him in the garden; – says, Adam, I heard thy voice in the garden; and I was afraid: what fears thee, Adam? What ails you at my voice? It used not to be a terror unto you: have you sinned? Adam, I am sure something is not right here: what, have ye eaten of the forbidden tree, and sinned against me? No wonder that you are afraid; for I am become your enemy for that: and now begone from my sight and presence, (until ye be reconciled unto me in another way and manner; – and that through the blood on my own Son.)

There was Adam and all his posterity banished forth from the presence of God. Now, what estate is man then in? He is in a estate that he cannot look God in the face, and God cannot look him in the face, but he is a terror unto him. – Now, till he be reconciled by Jesus Christ, he cries nothing but, hide us from the face of him, that sits upon the throne, from the Lamb, &amp;c. Hills and mountains, cover us from his glory; for we cannot endure his spotless holiness; but tho’ this be the case with all mankind, yet bless the Lord, that has found another way, whereby he reconciles him again unto himself; that is, in and through the blood of his own Son, his sent and well beloved Son, to become man; and in that nature to suffer in his merit and mediation for man’s sin and transgression: and thereby to be reconciled unto God again. There man has access unto his holiness; man may come boldly to the throne of his grace, and none to make him afraid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gabriel-semple.html">Gabriel Semple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon IX. On Isaiah lv. 6. A Sermon Preached at Mill-house, in the Parish of Kilbride, March 21, 1679 in A Collection of Very Valuable Sermons Preached on Several Subjects and in Divers Places in the time of the Late Persecution</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><figure class="quote" id="q-1c51b93be9" data-kw="">
<blockquote><p>This blissful sight of God, being quite above our present capacities, we must needs be much in the dark about it. But it seems to be something else, than the fight of that glory, which we will see with our bodily eyes, in the saints and in the man Christ, or any other splendour or refulgence from the Godhead whatsoever; for no created thing can be our chief good and happiness, nor fully satisfy our souls; and it is plain, that these things are somewhat different from God himself. Therefore I conceive, that the souls of the saints shall see God himself: so the scriptures teach us, that we shall see face to face, and know even as we are known, 1 Cor xiii 12. And that we shall see him as he is, 1 John iii. 12.

Howbeit the saints can never have an adequate conception of God; they cannot comprehend that which is infinite. They may touch the mountain, but cannot grasp it in their arms They cannot with one glance of their eye, behold what grows on every side: but the divine perfections will be an unbounded field, in which the glorified shall walk eternally, seeing more and more of God: since they can never come to the end of that which is infinite. They may bring their vessels to this ocean every moment, and fill them with new waters.

What a ravishing sight would it be, to see all the perfections, and lovely qualities, that are scattered here and there among the creatures, gathered together into one! but even such a sight would be infinitely below this blissful sight the saints shall have in heaven. For they shall see God, in whom all these perfections shall eminently appear, with infinitely more; whereof there is no vestige to be found in the creature. In him shall they see every thing desirable, and nothing but what is desirable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa</cite>, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 309.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

— Thomas Boston, Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 309.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+blissful+sight+of+God%2C+being+quite+above+our+present+capacities%2C+we+must+needs+be+much+in+the+dark+about+it.+But+it+seems+to+be+something+else%2C+than+the+fight+of+that+glory%2C+which+we+will+see+with+our+bodily+eyes%2C+in+the+saints+and+in+the+man+Christ%2C+or+any+other+splendour+or+refulgence+from+the+Godhead+whatsoever%3B+for+no+created+thing+can+be+our+chief+good+and+happiness%2C+nor+fully+satisfy+our+souls%3B+and+it+is+plain%2C+that+these+things+are+somewhat+different+from+God+himself.+Therefore+I+conceive%2C+that+the+souls+of+the+saints+shall+see+God+himself%3A+so+the+scriptures+teach+us%2C+that+we+shall+see+face+to+face%2C+and+know+even+as+we+are+known%2C+1+Cor+xiii+12.+And+that+we+shall+see+him+as+he+is%2C+1+John+iii.+12.%0A%0AHowbeit+the+saints+can+never+have+an+adequate+conception+of+God%3B+they+cannot+comprehend+that+which+is+infinite.+They+may+touch+the+mountain%2C+but+cannot+grasp+it+in+their+arms+They+cannot+with+one+glance+of+their+eye%2C+behold+what+grows+on+every+side%3A+but+the+divine+perfections+will+be+an+unbounded+field%2C+in+which+the+glorified+shall+walk+eternally%2C+seeing+more+and+more+of+God%3A+since+they+can+never+come+to+the+end+of+that+which+is+infinite.+They+may+bring+their+vessels+to+this+ocean+every+moment%2C+and+fill+them+with+new+waters.%0A%0AWhat+a+ravishing+sight+would+it+be%2C+to+see+all+the+perfections%2C+and+lovely+qualities%2C+that+are+scattered+here+and+there+among+the+creatures%2C+gathered+together+into+one%21+but+even+such+a+sight+would+be+infinitely+belo <blockquote><p>Another remarkable period is there meeting together at the bar of God’s great justice-court in heaven, within the vail, whither the forerunner hath for us entered, even Jesus, Heb. 6. last. When Christ was upon the cross, the vail of the temple was rent in twain from the top to the bottom, &amp; a way was made for entering into the holy of holies. And as the priests under the law were not only to offer the sacrifice without the camp, but after that were to enter the holiest of all, not without blood, but with the blood of the sacrifice, to sprinkle the mercy seat, Lev. 16.14, 15. Even so Christ, having offered himself a sacrifice, and suffered without the gate, Heb. 13.12. He is entered into the holy place by his own Blood, Heb. 9.12. there to appear as our high priest, in the power and virtue of his blood, to make a full atonement, and sprinkle the mercy-seat. Hence believers are said to be come to Jesus the mediator of the new covenant, and to the blood of sprinkling. And where is this? Even in heaven, as you see in the context, Heb. 12.23, 24.

Now, in this work, Christ carried the price of his blood into the very presence of God for us, Heb. 9.24. and paid it down before him; and, in this act, justice hath its satisfaction brought home; and, by this act, mercy and justice actually are met: For hereby Christ sprinkled the very mercy-seat with blood all over, both upon it, and before it, as the forecited Lev. 16. represents: For the mercy-seat of old stood so, that it could be seen but two ways, namely, upon it, and before it, as a table next to the wall; and so this points out, that whatever way we look to mercy by faith, we may see mercy and blood mixt, mercy and justice met together, and all sorts of mercy conveyed thro’ the blood of Christ, top-mercies, and side-mercies, upper-mercies of a spiritual nature, and lower mercies of a temporal nature; for the mercy-seat is sprinkled with the blood upon it, and before it, and whatever way you look to it.

The sacrifice was finished on the cross, and all sacrifices finished therein; but the blood of the sacrifice behoved also to be carried within the vail in order to the full atonement, that what was written in blood upon the cross, might be sealed in the presence of God at the heavenly bar: And we act not our faith far enough for redemption, unless we follow Christ from the cross to the bar of God’s justice-court in heaven, to see all sealed and secured there within the vail, where this blood is exposed, as it were, and pled at the bar; where mercy and justice meet together, and embrace each other.</p></blockquote>

<blockquote><p>In that we shall see Christ as he is Man, with these eyes. … That we shall see Christ as he is Man with these eyes, Job manifestly testifieth; For I know that my Redeemer liveth, and that he shall stand at the latter day upon the earth, and though after my skin worms destroy this body, yet in my flesh shall I see God, whom I shall see for myself; and mine eyes shall behold him, and not another, cap. 19.25, 26, 27.

The sight of Christ as Man is the next object unto the Beatific Vision itself; as the created grace, which the Man-hood received was out of measure, Joh. 3.34. (yet not simply, for being a creature it is bounded; but respectively, in regard of us, we being unable to measure it;) so the glory of the Manhood is out of measure. The Humanity of Christ, in respect of its personal union, far exceeds all the glory of Angels, and glorified Souls. The glory of the Man-hood, is as much as the Creature is capable of; the glory of the Body is derived both from the Divinity, and the glory of his Soul. The fulness of the God-head dwelling in him bodily, doth as it were radiate through his body; hence there must needs arise great joy unto the beholder, both from the eminency of, and our interest in this object. Christ in glory, and Christ in glory ours; as much of the Creator as is possibly visible in the nature of man, will be to be seen in Christ; as much contentation as the Creature can be made partaker of by the sight of any one visible object, will be the portion of the beholders of Christ, as he is Man.</p></blockquote>

<blockquote><p>If believers as giving Peter’s confession, and as builded upon the rock, Christ, by this place made a ministerial Church, by Christ, and gifted with the power of the keys, then the Ministry &amp; official power of preaching and binding and loosing should be made as stable and firm from defection, as the Church of elect believers, against whom the gates of hell cannot prevail: now besides that this is most untrue since, visible Churches do fall away, as these seven Churches in Asia, the Church of Corinth, Ephesus, Galatia, Thessalonica may prove, when as it is impossible that the elect Believers in Christ can fall away, it shall also give good warrant to Papists, to make such use of this place, as they do, that the Church may err in points of conversation and life, but cannot fall from the rock, nor be overcome by the powers of Hell in the definition of Articles of Faith.

So Gretser, Bellarmine, Suarez, Gregor, de Valent, Cardi, Hosius, Turrecremata, reason from this place; and the connexion must be good, if the Ministerial power not only be given to the Church as to the Object, that is, for the good and salvation of the Church, but also to the Church as to the Subject, who hath all the power of the Keys, and may use it also, because they are believers and builded upon the rock Christ; nothing hindereth, but Ministerial power should be as stable and free from being overcome with the ports of Hell, as the Christian state of perseverance in grace. Now we see, these who have Ministerial power, abuse it, and fall from the rock and perish eternally; which we cannot say of these, who by Faith are builded upon the Rock Christ Jesus.</p></blockquote>

<blockquote><p>Q. What is everlasting blessedness in the world to come?

A. That at my death, my body for a short time shall remain in the grave, as in a sweet bed of rest, but my soul shall go immediately into heaven; and at the day of judgment, my body shall be raised from the dead, and joined to my soul again, and then both my body and soul shall have fellowship with Christ in incomprehensible joy, and everlasting glory.

Proofs.</p></blockquote>

</figure><figure class="quote" id="q-117f61ca3c" data-kw="">
<blockquote><p>Christ could not have warned men so frequently and earnestly as he did against “the fire that never shall be quenched,” and “the worm that dieth not,” had he known that there is no future peril fully corresponding to them. That omniscient Being who made the statements respecting the day of judgment, and the final sentence, that are recorded in Matthew 25:31-46, could neither have believed nor expected that all men without exception will eventually be holy and happy.

To threaten with “everlasting punishment” a class of persons described as “goats upon the left hand” of the Eternal Judge, while knowing at the same time that this class would ultimately have the same holiness and happiness with those described as “sheep upon the right hand” of the judge, would have been both falsehood and folly. The threatening would have been false.

For even a long punishment in the future world would not have justified Christ in teaching that this class of mankind are to experience the same retribution with “the devil and his angels;” for these were understood by the Jews, to whom he spoke, to be hopelessly and eternally lost spirits. And the threatening would have been foolish, because it would have been a brutum fulmen, an exaggerated danger, certainly in the mind of its author. And for the persons threatened, it would have been a terror only because they took a different view of it from what its author did — they believing it to be true, and he knowing it to be false!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Endless Punishment</cite>, (New York: Charles Scribner’s Sons, 1886), pp 13-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><figure class="quote" id="q-7cd6b5913e" data-kw="">
<blockquote><p>There is a Community of Glory betwixt Christ and Us: The Heaven that the Mediator Christ Enjoys, is our Heaven; Our Heaven is to the Man Christ in a Conquest: Heaven was bought with Blood to Him and Us, and to make you Rejoice: None of GOD‘s Children gets a Heaven properly of their own; Why? We got a share and part of Christ‘s Inheritance, He is the Principal Heir, Romans 8.

We are the Conjunct-heirs: Sweet is that Word which He speaks to his Children, Luke 22. 29. And I appoint unto You a Kingdom, as My Father hath appointed unto Me, that ye may Eat and Drink at My Table in My Kingdom, Sitting on Thrones, Judging the Twelve Tribes of Israel. The Meaning is, My Father hath made a Disposition to Me of the Kingdom of GOD, it is Mine and My Dear Children. I will think Heaven uncouth if ye be not with Me. Here I make a Disposition and Resignation of that Kingdom to you; Ye shall Sit at my Table in My Kingdom: Up your Heart, howbeit ye be not Lords in Earth, ye shall be Lords in Heaven; I and Ye shall part Kingdoms and Thrones together.

Secondly, Rejoice in this ye that are in Christ and see your Condition, ye and Christ are Halfers together of Heaven and Glory, O if GOD‘s Children be in a Sweet Case as long as Christ is in Heaven and keeps the Inheritance, as long shall we keep our Right; And who can cause him Flit? The Devil hath made these Enemies of the Grace of GOD to Misken all our communion with Christ, they have put Christ and the Elect together, as a Man in an Inns for a Night, and to go away to Morrow; They have yoked Christ and us together, as if He were one and we another; as if He were His own, and We were our own; as if Christ had no Law and Right to Us, and We had no Law and Right to Christ, but met at a Venture, and sundered at a Venture; as if We had one heaven, and He had another; As if he had his Portion by himself alone, and that he keeps for ever; and that We had our Share be our alone too, to Sell when We pleased.

Sells if we Dispone Heaven, We Dispone not Christ‘s Heaven. In the Fighting he fights all the Battles his alone, We but look on: But when it comes to the Dividing of the Spoil, We get a Rich Share of the Spoil, Yet he gave the Whole Sum for the Inheritance, and We Nothing; yet we are set at his Elbow in a Throne with him, Now seeing our Right is also Good, slip not from them: Do not as some Unworthy Heir, who having a Good Right slips from it for a feckless composition after Drink, quits all, howbeit he should Beg: Indeed the Wicked does this.

The Devil drinks them Blankfull, and fills them with Worldly Pleasures, and gars them Subscribe a Resignation, and gives them an unworthy composition, some present Pleasure. Compone not with the Devil to go to the Law with him, let Christ be your Advocate, Subscribe not a Submission with the Devil, come never in Trysting Terms with him hold you aback from the World, and the Lusts of it, it is the Devil’s Arles that he gives to Silly Drunken Heirs, when they cry Hills and Mountains fall on us: They would fain give back the Arles and Rew, but it is out of time.</p></blockquote>

<blockquote><p>The twelfth subject of Meditation. Meditate of hell. 1. Meditate upon the pain of loss, Mat. 25.10. and the door was shut. To have Christ’s face veiled over, and a perpetual eclipse, and mid-night in the soul, to be cast out of God’s presence, in whose presence is fullness of joy, this doth accent and embitter the condition of the damned; ’tis like mingling gall with wormwood.

2. Meditate upon the pain of sense; the Photinians hold there is no hell, but they speak in a dream, Psalm 9.17. The wicked shall be turned into hell. And here meditate of two things.

1. The place of hell.

2. The company.

1. Meditate of the place of hell. ‘Tis called a place of torment, Luke 16.28. There are two things especially in hell to torment.

2. Fire, Revel. 20.15. ‘Tis called a lake of burning fire, Austin, Peter Lombard, Gregory the Great, say, this fire of hell is a material fire, though they say it is infinitely hotter than any culinary fire; that is but painted fire to this. I wish none of us may know what kind of fire it is, but I rather think, the fire of hell is partly material, and partly spiritual; the material fire is to work upon the body, the spiritual to torture the soul. This is the wrath of God, which is both fire and bellows, who knows the power of thy anger, Psalm 90.11.

But it may be objected, if there be any material fire in hell, it will consume the bodies there? I answer, it shall burn without consuming, as Moses bush did, Ex. 3.2. The power of God silenceth all disputes. If God by his infinite power could make the fire of the three children not to consume, cannot he make the fire of hell burn and not consume? Austin in his book, de civitate Dei, tells us of a strange salt in Sicily, which if it be put in the fire swims; That God which can make salt, contrary to its nature, swim in the fire, can make the bodies of the damned not consume in the fire.

2. The worm, Mark 9.44. Where the worm never dies, Homer in his Odisses fains, that Titius his liver was gnawn by two vultures in hell. This never-dying worm Christ speaks of, is the gnawing of a guilty conscience. Melanchthon calls it Erynnis conscientiae; an hellish fury, Siculi non invenere tyranni tormentum majus,—they that will not hear conscience preaching, shall feel conscience gnawing; and so great is the extremity of these two, the fire which burns, and the worm which bites, that there will follow gnashing of teeth, Mat 8.12. the damned will gnash their teeth for horror and anguish. That must needs be sad cheer (as Latimer saith) where weeping is served in for the first course, and gnashing of teeth for the second: to endure this will be intolerable, to avoid it will be impossible.

3. Meditate of the company in hell, the devil and his Angels, Matth. 25.41. Job complains he was a companion to owls, chap. 30.29. What will it be to be a companion to devils? Consider, 1. Their ghastly deformity, they make hell look blacker. 2. Their deadly antipathy; they are fired with rage against man-kind; first they become tempters, then tormentors.

Meditate much on hell. Let us go into hell by contemplation, that we may not go into hell by condemnation. How restless is the condition of the damned; The ancients fain of Endymion, that he got leave of Jupiter always to sleep. What would the damned in hell give for such a Licence? in their pains is neither intermission, nor mitigation.

The serious meditation of hell, would make us, 1. Fear sin as hell. Sin is hell’s fuel; sin like Sampson’s foxes, carries devouring fire in the tail of it.

2. The meditation of hell would cause rejoicing in a child of God. The Saints fear of hell is like the two Marie’s fear, Matth. 28.8. They departed from the Sepulchre with fear and great joy. A believer may fear to think of the place of torment, but rejoice to think he shall not come into this place. When a man stands upon a high rock, he trembles to look down into the sea, yet he rejoiceth that he is not there struggling with the waves. A child of God, when he thinks of hell, he rejoiceth with trembling. A Prison is not made for the King’s sons to be put in.

A great Naturalist observes that nothing will so soon quench fire as salt and blood; sure I am, the salt brinish tears of repentance, and the blood of Christ will quench the fire of hell to a believer. Christ himself hath felt the pains of hell for you. The Lamb of God being roasted in the fire of God’s wrath, by this burnt-offering the Lord is now appeased towards his people. Oh how may the godly rejoice. There’s no condemnation to them that are in Christ, Rom. 8.1. When the Son of God was in the furnace, Dan. 3.25. the fire did the three children no hurt; so Christ being for a time in the fiery furnace of God’s wrath, that fire can do a believer no hurt. The Saints have the garment of Christ’s righteousness upon them, and the fire of hell can never singe this garment.</p></blockquote>

<blockquote><p>A single remark remains to be made respecting the extent and scope of hell. It is only a spot in the universe of God. Compared with heaven, hell is narrow and limited. The kingdom of Satan is insignificant in contrast with the kingdom of Christ. In the immense range of God’s dominion, good is the rule, and evil is the exception. Sin is a speck upon the infinite azure of eternity; a spot on the sun. Hell is only a corner of the universe. The Gothic etymon (Höhle, Hölle) denotes a covered-up hole. In Scripture, hell is a “pit,” a “lake”; not an ocean. It is “bottomless,” but not boundless. The Gnostic and Dualistic theories, which make God, and Satan, or the Demiurge, nearly equal in power and dominion, find no support in Revelation.

The Bible teaches that there will always be some sin, and some death, in the universe. Some angels and men will forever be the enemies of God. But their number, compared with that of unfallen angels and redeemed men, is small. They are not described in the glowing language and metaphors by which the immensity of the holy and blessed is delineated. “The chariots of God are twenty thousand, and thousands of angels” (Ps. 68:17). “The Lord came from Sinai, and shined forth from mount Paran, and he came with ten thousands of his saints” (Deut. 22:2). “The Lord hath prepared his throne in the heavens, and his kingdom ruleth over all” (Ps. 103:21). “Thine is the kingdom, and the power, and the glory” (Matt. 6:13). The Lord Christ “must reign till he hath put all enemies under his feet” (1 Cor. 15:25). St. John “heard a voice from heaven as the voice of many waters, and as the voice of a great thunder” (Rev. 14:1).

The New Jerusalem “lieth four square, the length is as large as the breadth; the gates of it shall not be shut at all by day; the kings of the earth do bring their honor into it” (Rev. 21:16, 24, 25). The number of the lost spirits is never thus emphasized, and enlarged upon. The brief, stern statement is, that “the fearful and unbelieving shall have their part in the lake that burneth with fire and brimstone” (Rev. 21:8). No metaphors and amplifications are added, to make the impression of an immense “multitude which no man can number.</p></blockquote>

</figure><figure class="quote" id="q-6176d5352a" data-kw="">
<blockquote><p>The happiness of God consists in the knowledge of himself, his own perfections, and delight in them. God is the object of his own happiness. The knowledge of God himself is the felicity of God. No being is really happy without reflection upon, and knowledge of, that happiness. If God should be happy by the knowledge of anything else but himself, that which he did contemplate and know would be greater and better than God, because his happiness would depend upon it. Felicity can never be in anything inferior. God hath nothing higher and better than himself to contemplate.

This gave him a satisfaction before the world was, and this would still be his blessedness, if all things should be reduced to the depths of nothing. Since, therefore, he created the world, to communicate himself and his own happiness to the rational creature, felicity cannot be attained by anything less than the knowledge of the supreme good according to the creature’s measures. The angels themselves are only blessed in the contemplation of him, and affection to him. In being encompassed with his bright rays, and having their affections inflamed by him. Mat. xviii. 10, ‘they behold the face of God.’ As God’s knowledge and fruition of himself makes up his felicity, so the knowledge and fruition of God composeth our happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 24.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><figure class="quote" id="q-4ad15fa0e7" data-kw="">
<blockquote><p>Heaven is that place alone where is to [be] obtained our highest end, and highest good. God hath made us for himself: “of God, and through God, and to God are all things” (Romans 11:36). Therefore then do we attain to our highest end, when we are brought to God. But that is by being brought to heaven, for that is God’s throne; that is the place of his special presence, and of his glorious residence. There is but a very imperfect union with God to be had in this world: a very imperfect knowledge of God in the midst of abundance of darkness, a very imperfect conformity to God, mingled with abundance of enmity and estrangement. Here we can serve and glorify God but in an exceeding imperfect manner, our service being mingled with much sin and dishonouring to God.

But when we get to heaven, if ever that be, there we shall be brought to a perfect union with God. There we shall have the clear views of God’s glory: we shall see face to face, and know as we are known [1 Corinthians 13:12]. There we shall be fully conformed to God, without any remains of sin: “we shall be like him; for we shall see him as he is” [1 John 3:2]. There we shall serve God perfectly. We shall glorify him in an exalted manner, and to the utmost of the powers and capacity of our nature. Then we shall perfectly give up ourselves to God; then will our hearts be wholly a pure and holy offering to God, offered all in the flame of divine love.

In heaven alone is attainment of our highest good. God is the highest good of the reasonable creature. The enjoyment of him is our proper happiness, and is the only happiness with which our souls can be satisfied. To go to heaven, fully to enjoy God, is infinitely better than the most pleasant accommodations here: better than fathers and mothers, husbands, wives, or children, or the company of any or all earthly friends. These are but shadows; but God is the substance. These are but scattered beams; but God is the sun. These are but streams; but God is the fountain. These are but drops; but God is the ocean.

Therefore, it becomes us to spend this life only as a journey towards heaven, as it becomes us to make the seeking of our highest end, and proper good, the whole work of our lives; and we should subordinate all the other concerns of life to it. Why should we labour for anything else, or set our hearts on anything else, but that which is our proper end, and true happiness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Christian’s Life a Journey Towards Heaven</cite>, (1734) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 437-38.</span></figcaption>

</figure><figure class="quote" id="q-fc149ce3ee" data-kw="">
<blockquote><p>And although there be many curious persons which think those times to be most happy, in the which God by so many ways spake unto the fathers, and doe affirm that they would more willingly believe the word of God, if so be it would please him to talk with them after that fashion. Notwithstanding, if we well consider of the matter, now that Christ is come, and hath published his Gospel throughout the whole world, we must needs confess, that the times are much more happy, than they were in times past. For God hath spoken with us, not by Angel, not by dreams, or visions, but by his own son our Lord, and Saviour Jesus Christ, who by his divine majesty excelleth all Angels. Whereupon in the Epistle to the Hebrews it is written. In these last days God hath spoken unto us by his son, whom he hath appointed heir of all things.

And Christ himself saith: Blessed are the eyes which see those things that ye see. And straight after he addeth saying: many have desired to see those things that ye see, and have not seen them. And the Apostle Paul saith: Now salvation is nearer unto us than it was then. For seeing that the son of God is commended unto us by the voice of God from heaven, saying: This is my beloved son, hear him. He is most happy which so heareth him by his Gospel, that by faith he comprehendeth the same, &amp; obeyeth his calling. For whosoever he be that believeth not this son of God, he will not believe, though all the Angels in heaven, all the Patriarchs, all the Prophets and fathers stood before him to testify of the word of God. Wherefore, let us not neglect the felicity and happiness of our time, but let us attend and give ear to the voice of the son of God, whereby we may obtain everlasting salvation.</p></blockquote>

<blockquote><p>Obedience is Heaven begun, and the sons of God rejoice to see him take his honour, and call all worlds around him to esteem and love him, as most worthy. They are not under the law in whole or part, so far as it has sanctions, threats, or promises. But let us hear in mind — for there may he ere long another Antinomian outbreak — that in the measure in which we win Christ, it will be our meat to do the Father’s will as it was his beforehand. Our willingness to obey just shows how far we have tasted the sweetness of the promises, how far we have apprehended Christ.</p></blockquote>

<blockquote><p>Now ye may say, how can this stand with God’s justice, to repay a thing infinite for a finite thing; to render infinite affliction for finite affliction; to render the pains of Hell for a short temporal pain? I answer, God in repaying wrong to them that has done wrong, looks not so much to the wrong that one man does to another, as to the wrong done to his own Majesty that is infinite. Thou oppressed thy neighbour, thou troublest a brother. The Lord when he comes to judge, he looks not so much to the wrong thou hast done to thy neighbour, or to thy brother, as to the wrong done to himself: He respects the wrong done to him who is infinite, and therefore, thou shalt be repaid with an infinite pain. This is God’s justice.

Then again. Never a man that did wrong, and that has taken pleasure to do wrong, did ever the wrong, nor was able to do so great wrong, as he would have done, if he had gotten his will fulfilled in doing wrong, there would never be an end of his wrong: If the troubler had his will in troubling, no end of his trouble: If the murderer had his will in murdering his bloody sword would never be put up, but he would ever be murdering, he would be ever oppressing. And therefore, God in his judgment looks not so much to the thing thou doest, to the stroke of thy hand, to the word of thy mouth, as he looks to the thought and will of thy mind. It has no end of evil. The Lord for thy endless evil will in heart, will render thee an endless pain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), Part II, pp 20-21.</span></figcaption>

<blockquote><p>The heavens declare the glory of God. I have already said, that this psalm consists of two parts, in the first of which David celebrates the glory of God as manifested in his works; and, in the other, exalts and magnifies the knowledge of God which shines forth more clearly in his word. He only makes mention of the heavens; but, under this part of creation, which is the noblest, and the excellency of which is more conspicuous, he doubtless includes by synecdoche the whole fabric of the world.

There is certainly nothing so obscure or contemptible, even in the smallest corners of the earth, in which some marks of the power and wisdom of God may not be seen; but as a more distinct image of him is engraven on the heavens, David has particularly selected them for contemplation, that their splendour might lead us to contemplate all parts of the world. When a man, from beholding and contemplating the heavens, has been brought to acknowledge God, he will learn also to reflect upon and to admire his wisdom and power as displayed on the face of the earth, not only in general, but even in the minutest plants. In the first verse, the Psalmist repeats one thing twice, according to his usual manner.

He introduces the heavens as witnesses and preachers of the glory of God, attributing to the dumb creature a quality which, strictly speaking, does not belong to it, in order the more severely to upbraid men for their ingratitude, if they should pass over so clear a testimony with unheeding ears. This manner of speaking more powerfully moves and affects us than if he had said, The heavens show or manifest the glory of God. It is indeed a great thing, that in the splendour of the heavens there is presented to our view a lively image of God; but, as the living voice has a greater effect in exciting our attention, or at least teaches us more surely and with greater profit than simple beholding, to which no oral instruction is added, we ought to mark the force of the figure which the Psalmist uses when he says, that the heavens by their preaching declare the glory of God.

The repetition which he makes in the second clause is merely an explanation of the first. David shows how it is that the heavens proclaim to us the glory of God, namely, by openly bearing testimony that they have not been put together by chance, but were wonderfully created by the supreme Architect. When we behold the heavens, we cannot but be elevated, by the contemplation of them, to Him who is their great Creator; and the beautiful arrangement and wonderful variety which distinguish the courses and station of the heavenly bodies, together with the beauty and splendour which are manifest in them, cannot but furnish us with an evident proof of his providence.

Scripture, indeed, makes known to us the time and manner of the creation; but the heavens themselves, although God should say nothing on the subject, proclaim loudly and distinctly enough that they have been fashioned by his hands: and this of itself abundantly suffices to bear testimony to men of his glory. As soon as we acknowledge God to be the supreme Architect, who has erected the beauteous fabric of the universe, our minds must necessarily be ravished with wonder at his infinite goodness, wisdom, and power.

… Day unto day uttereth speech. Philosophers, who have more penetration into those matters than others, understand how the stars are arranged in such beautiful order, that notwithstanding their immense number there is no confusion; but to the ignorant and unlettered, the continual succession of days is a more undoubted proof of the providence of God. David, therefore, having spoken of the heavens, does not here descend from them to other parts of the world; but, from an effect more sensible and nearer our apprehension, he confirms what he has just now said, namely, that the glory of God not only shines, but also resounds in the heavens.

The words may be variously expounded, but the different expositions which have been given of them make little difference as to the sense. Some explain them thus, that no day passes in which God does not show some signal evidence of his power. Others are of opinion that they denote the augmentations of instruction and knowledge, – that every succeeding day contributes something new in proof of the existence and perfections of God. Others view them as meaning that the days and nights talk together, and reason concerning the glory of their Creator’, but this is a somewhat forced interpretation. David, I have no doubt, here teaches, from the established alternations of days and nights, that the course and revolutions of the sun, and moon, and stars, are regulated by the marvellous wisdom of God.

Whether we translate the words Day after day, or one day to another day, is of little consequence; for all that David means is the beautiful arrangement of time which the succession of days and nights effects. If, indeed, we were as attentive as we ought to be, even one day would suffice to bear testimony to us of the glory of God, and even one night would be sufficient to perform to us the same office. But when we see the sun and the moon performing their daily revolutions, — the sun by day appearing over our heads, and the moon succeeding in its turns — the sun ascending by degrees, while at the same time he approaches nearer us, — and afterwards bending his course so as to depart from us by little and little; — and when we see that by this means the length of the days and nights is regulated, and that the variation of their length is arranged according to a law so uniform, as invariably to recur at the same points of time in every successive year, we have in this a much brighter testimony to the glory of God.

David, therefore, with the highest reason, declares, that although God should not speak a single word to men, yet the orderly and useful succession of days and nights eloquently proclaims the glory of God, and that there is now left to men no pretext for ignorance; for since the days and nights perform towards us so well and so carefully the office of teachers, we may acquire, if we are duly attentive, a sufficient amount of knowledge under their tuition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms</cite>, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 308-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

David, therefore, with the highest reason, declares, that although God should not speak a single word to men, yet the orderly and useful succession of days and nights eloquently proclaims the glory of God, and that there is now left to men no pretext for ignorance; for since the days and nights perform towards us so well and so carefully the office of teachers, we may acquire, if we are duly attentive, a sufficient amount of knowledge under their tuition.”

— John Calvin, Commentary on the Book of Psalms, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 308-11.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+heavens+declare+the+glory+of+God.+I+have+already+said%2C+that+this+psalm+consists+of+two+parts%2C+in+the+first+of+which+David+celebrates+the+glory+of+God+as+manifested+in+his+works%3B+and%2C+in+the+other%2C+exalts+and+magnifies+the+knowledge+of+God+which+shines+forth+more+clearly+in+his+word.+He+only+makes+mention+of+the+heavens%3B+but%2C+under+this+part+of+creation%2C+which+is+the+noblest%2C+and+the+excellency+of+which+is+more+conspicuous%2C+he+doubtless+includes+by+synecdoche+the+whole+fabric+of+the+world.%0A%0AThere+is+certainly+nothing+so+obscure+or+contemptible%2C+even+in+the+smallest+corners+of+the+earth%2C+in+which+some+marks+of+the+power+and+wisdom+of+God+may+not+be+seen%3B+but+as+a+more+distinct+image+of+him+is+engraven+on+the+heavens%2C+David+has+particularly+selected+them+for+contemplation%2C+that+their+splendour+might+lead+us+to+contemplate+all+parts+of+the+world.+When+a+man%2C+from+beholding+and+contemplating+the+heavens%2C+has+been+brought+to+acknowledge+God%2C+he+will+learn+also+to+reflect+upon+and+to+admire+his+wisdom+and+power+as+displayed+on+the+face+of+the+earth%2C+not+only+in+general%2C+but+even+in+the+minutest+plants.+In+the+first+verse%2C+the+Psalmist+repeats+one+thing+twice%2C+according+to+his+usual+manner.%0A%0AHe+introduces+the+heavens+as+witnesses+and+preachers+of+the+glory+of+God%2C+attributing+to+the+dumb+creature+a+quality+which%2C+strictly+speaking%2C+does+not+belong+to+it%2C+in+order+the+more+severely+to+upbraid+men+for+their+ingratitude%2C+if+they+should+pass+over+so+clear+a+testimony+with+unheeding+ears.+This+manner+of+speaking+more+powerfully+moves+and+affects+us+than+if+he+had+said%2C+The+heavens+show+or+manifest+the+glory+of+God.+It+is+indeed+a+great+thing%2C+that+in+the+splendour+of+the+heavens+there+is+presented+to+our+view+a+lively+image+of+God%3B+but%2C+as+the+living+voice+has+a+greater+effect+in+exciting+our+attention%2C+or+at+least+teaches+us+more+surely+and+with+greater+profit+than+simple+beholding%2C+to+which+no+oral+instruction+is+added%2C+we+ought+to+mark+the+force+of+the+figure+which+the+Psalmist+uses+when+he+says%2C+that+the+heavens+by+their+preaching+declare+the+glory+of+God.%0A%0AThe+repetition+which+he+makes+in+the+second+clause+is+merely+an+explanation+of+the+first.+David+shows+how+it+is+that+the+heavens+proclaim+to+us+the+glory+of+God%2C+namely%2C+by+openly+bearing+testimony+that+they+have+not+been+put+together+by+chance%2C+but+were+wonderfully+created+by+the+supreme+Architect.+When+we+behold+the+heavens%2C+we+cannot+but+be+elevated%2C+by+the+contemplation+of+them%2C+to+Him+who+is+their+great+Creator%3B+and+the+beautiful+arrangement+and+wonderful+variety+which+distinguish+the+courses+and+station+of+the+heavenly+bodies%2C+together+with+the+beauty+and+splendour+which+are+manifest+in+them%2C+cannot+but+furnish+us+with+an+evident+proof+of+his+providence.%0A%0AScripture%2C+indeed%2C+makes+known+to+us+the+time+and+manner+of+the+creation%3B+but+the+heavens+themselves%2C+although+God+should+say+nothing+on+the+subject%2C+proclaim+loudly+and+distinctly+enough+that+they+have+been+fashioned+by+his+hands%3A+and+this+of+itself+abundantly+suffices+to+bear+testimony+to+men+of+his+glory.+As+soon+as+we+acknowledge+God+to+be+the+supreme+Architect%2C+who+has+erected+the+beauteous+fabric+of+the+universe%2C+our+minds+must+necessarily+be+ravished+with+wonder+at+his+infinite+goodness%2C+wisdom%2C+and+power.%0A%0A%E2%80%A6+Day+unto+day+uttereth+speech.+Philosophers%2C+who+have+more+penetration+into+those+matters+than+others%2C+understand+how+the+stars+are+arranged+in+such+beautiful+order%2C+that+notwithstanding+their+immense+number+there+is+no+confusion%3B+but+to+the+ignorant+and+unlettered%2C+the+continual+succession+of+days+is+a+more+undoubted+proof+of+the+providence+of+God.+David%2C+therefore%2C+having+spoken+of+the+heavens%2C+does+not+here+descend+from+them+to+other+parts+of+the+world%3B+but%2C+from+an+effect+more+sensible+and+nearer+our+apprehension%2C+he+confirms+what+he+has+just+now+said%2C+namely%2C+that+the+glory+of+God+not+only+shines%2C+but+also+resounds+in+the+heavens.%0A%0AThe+words+may+be+variously+expounded%2C+but+the+different+expositions+which+have+been+given+of+them+make+little+difference+as+to+the+sense.+Some+explain+them+thus%2C+that+no+day+passes+in+which+God+does+not+show+some+signal+evidence+of+his+power.+Others+are+of+opinion+that+they+denote+the+augmentations+of+instruction+and+knowledge%2C+%E2%80%93+that+every+succeeding+day+contributes+something+new+in+proof+of+the+existence+and+perfections+of+God.+Others+view+them+as+meaning+that+the+days+and+nights+talk+together%2C+and+reason+concerning+the+glory+of+their+Creator%E2%80%99%2C+but+this+is+a+somewhat+forced+interpretation.+David%2C+I+have+no+doubt%2C+here+teaches%2C+from+the+established+alternations+of+days+and+nights%2C+that+the+course+and+revolutions+of+the+sun%2C+and+moon%2C+and+stars%2C+are+regulated+by+the+marvellous+wisdom+of+God.%0A%0AWhether+we+translate+the+words+Day+after+day%2C+or+one+day+to+another+day%2C+is+of+little+consequence%3B+for+all+that+David+means+is+the+beautiful+arrangement+of+time+which+the+succession+of+days+and+nights+effects.+If%2C+indeed%2C+we+were+as+attentive+as+we+ought+to+be%2C+even+one+day+would+suffice+to+bear+testimony+to+us+of+the+glory+of+God%2C+and+even+one+night+would+be+sufficient+to+perform+to+us+the+same+office.+But+when+we+see+the+sun+and+the+moon+performing+their+daily+revolutions%2C+%E2%80%94+the+sun+by+day+appearing+over+our+heads%2C+and+the+moon+succeeding+in+its+turns+%E2%80%94+the+sun+ascending+by+degrees%2C+while+at+the+same+time+he+approaches+nearer+us%2C+%E2%80%94+and+afterwards+bending+his+course+so+as+to+depart+from+us+by+little+and+little%3B+%E2%80%94+and+when+we+see+that+by+this+means+the+length+of+the+days+and+nights+is+regulated%2C+and+that+the+variation+of+their+length+is+arranged+according+to+a+law+so+uniform%2C+as+invariably+to+recur+at+the+same+points+of+time+in+every+successive+year%2C+we+have+in+this+a+much+brighter+testimony+to+the+glory+of+God.%0A%0ADavid%2C+therefore%2C+with+the+highest+reason%2C+declares%2C+that+although+God+should+not+speak+a+single+word+to+men%2C+yet+the+orderly+and+useful+succession+of+days+and+nights+eloquently+proclaims+the+glory+of+God%2C+and+that+there+is+now+left+to+men+no+pretext+for+ignorance%3B+for+since+the+days+and+nights+perform+towards+us+so+well+and+so+carefully+the+office+of+teachers%2C+we+may+acquire%2C+if+we+are+duly+attentive%2C+a+sufficient+amount+of+knowledge+under+their+tuition.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Book+of+Psalms%2C+%281557%29%2C+trans.+James+Anderson+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+4b%3A+308-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F996accfb7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/996accfb7d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/23/john-calvin-the-heavens-declare-the-glory-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>51 To be for ever deprived of the beatifical vision of God, goes beyond all the Punishments in Hell.

52 Being squeezed under the unsupportable weight of Punishments, they shall wish they had no being: but it shall be all in vain. They shall desire to die; but death shall flee from them. Revel. 9.6.

53 They shall roar for the very disquietness of heart; they shall rage for madness, and gnash their teeth: There shall be weeping for grief, and gnashing of teeth for madness. Bern. Ser. 8. in Psal. 91.

54 Of all which some have a taste even in this Life.

55 The Company of the Devils, and the Quality of the Place do exceedingly increase the Torments of the Damned.

56 Neither shall the torments of the Damned be only Eternal, but they shall also be Without all intermission at any time. The smoke of their Torments ascendeth up for ever and ever. Revel. 14.11.

57 As in Heaven one is more glorious then another: So likewise in Hell one shall be more miserable then another. August. in Enchirid. Cap. 3.

58 We are very curious to know where Hell is: But we are not so careful to learn how we may escape it. Our thoughts were better spent in meditating upon it.

59 When we sit down to eat and drink, and when we rise from table again, when we lie down to sleep, and when we rise up again: at all times, and in all places, it is very good to think upon Hell.

60 For, To think upon Hell preserves a man from falling into it. Chrysost, Hom. 44 in Matth.

61 Dost thou think to quench the flames of Hell by not speaking of it or, Dost thou think thou kindlest the flame thereof by speaking of it? Whether thou speakest of it or no, the flame is always there alike. Idem in Homil. 2. in 2. Thess.

62 He deliver us from eternal death, who himself died for us: He bring us unto eternal Life, who himself is the Prince of Life blessed for ever. To whom with the Father and the Holy Spirit be all honour and glory World without end. Amen.</p></blockquote>

</figure><figure class="quote" id="q-e90e3fb79f" data-kw="">
<blockquote><p>God causes to be proclaimed to us that there is nothing the corrupt intellect of man—an intellect fully darkened by sin and increasingly blinded by Satan—more readily does than carelessly and erroneously trust in the mere external proclamation of the gospel. Such a man considers it to be sufficient unto salvation that he has intellectually comprehended the gospel, and therefore, he has truly believed and will certainly procure eternal salvation and deliverance through Christ and by God’s grace.

This is the lamentable and wretched faith of almost all our Reformed lip confessors, who stake their immortal souls on such a faith and thus enter into eternity with a mere intellectual and superficial affirmation that Christ is their saviour and that they will certainly be delivered and saved by Him. Sadly, the majority of them will not discover their grievous error and dreadful self-deceit until, being actually in hell, they then find it to be eternally impossible for them to retrace their steps and to restore what is amiss.</p></blockquote>

</figure><figure class="quote" id="q-fc90e42efd" data-kw="">
<blockquote><p>He gives grace; and having given grace as the pledge, he will undoubtedly give, in fulfilment of the pledge, glory, as the promised possession. For grace and glory differ not in kind, but in degree. Grace is the bud, glory is the sweet, unwithering blossom — grace is the precious seed, glory is the golden harvest — grace is the dawn, the purple streakings of the sky, the orient tints of the morning; glory is the light, the splendour, the bright effulgence of the perfect day — grace is the might, the armour, the valour in the day of battle; glory is the shout of victory, the song of triumph, the dividing of the spoil, the crowning of the conqueror, the peace and rest and blessedness that await the people of God.</p></blockquote>

<blockquote><p>Why does the [Larger] Catechism place glorifying God before enjoying God?

Because the most important element in the purpose of human life is glorifying God, while enjoying God is strictly subordinate to glorifying God. In our religious life, we should always place the chief emphasis on glorifying God. The person who does this will truly enjoy God, both here and hereafter.

But the person who thinks of enjoying God apart from glorifying God is in danger of supposing that God exists for man instead of man for God. To stress enjoying God more than glorifying God will result in a falsely mystical or emotional type of religion.</p></blockquote>

<blockquote><p>How much of spiritual meaning and significance is revealed to the eye of faith, in that great truth “He inhabiteth eternity.” From eternity did God exist, and infinitely happy in his own glory. His being is underived, and never had a beginning; before angel and arch-angel were called into being to celebrate his praises, did our God exist in his own uncreated glory. The blessed spirits of heaven, who, as they receive their existence from the “high and lofty One,” derive also their happiness from the infinite happiness which resides in his perfections, and delight to magnify his glory, and to do his will. Their fervid praises ascend to him, who has given them all their powers of serving him, and their capacities of enjoying him. In the immediate dwelling place of God are the souls of the redeemed, who “have passed beyond tribulation, and who, clothed with white robes and palms in their hands,” cry with a loud voice, saying, “Salvation to our God which sitteth upon the throne, and unto the Lamb.”

Infinite happiness is in the immediate dwelling-place of him who inhabits eternity; unutterable glory is also around the God of our salvation. The Word of God elevates our faith, and calls upon us to entertain devout and adoring views of the glory of him, who is holy in his nature, and holy and righteous in all his ways. Yet, though thus glorious and exalted, though infinite in his own happiness, though inconceivably pure and holy in his essence, though requiring no services of any created beings that rejoices in the excellence of his will, to add to his internal and infinite happiness and complacency, yet, amazing truth of God’s own grace and condescension, he delights to come forth from the glory which he inhabits in eternity, and to dwell with them, who in the depths of humility and self-abasement, feel their own guilt and unworthiness in his holy and omniscient view, and in faith and love acknowledge him as their God in Christ.

What a precious revelation does the Prophet give of the grace of God! What a consolatory representation of his unsearchable condescension! While God dwells in the heavens, and praises of eternity — while he dwells in the “high and holy place” — a heavenly temple—the grandeur, the purity, the glory of which befit the blessed perfections of his nature — yet he dwells also with him who is of a contrite and humble spirit — God dwells with such for a blessed and gracious purpose — “to revive the spirit of the humble, and to revive the heart of the contrite ones.” In his wisdom and grace, he has devised a glorious plan of salvation, through which he can hold communion with those in whom these spiritual qualities reside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/mungo-fairlie-parker.html">Mungo Fairlie Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Dwelling with the Humble and Contrite, the Source of their Revival’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>Finally, “Why will ye die?” Are ye, after mature deliberation, finally and firmly resolved to reject all that can make you happy, and to court all that can make you miserable? Are you resolved to be Satan’s slaves rather than Jesus’ freemen? Have you made up your minds that the vials of that wrath which agonizes soul and body through eternity, are preferable to that cup of salvation which the Gospel invites you to drink? Are you resolved that Christ and salvation shall never be yours? Are you resolved that those healthful countenances shall. through eternity, be writhed in unutterable anguish?

Are you resolved that the voices which have been mingled to-day in the songs of Zion, shall be ultimately and for ever spent in the hideous wailings and lamentations of those who are consigned to the lake that burneth? Have the shrieks of eternal despair more charms than the new and ceaseless song of ransomed, happy Zion? Are you resolved to dwell with devouring flames, and to lie down in everlasting burnings, rather than in good earnest seek an entrance into that blessed abode where there is fulness of joy, and where there are pleasures for evermore? Are you resolved to cast away eternal life, with all the glory and the happiness it implies, and to prefer the second death with all the unmitigated agonies it ensures? Eternal Spirit! draw nigh in preventing grace, touch and soften every heart, that all may listen to the affecting question, “Why will ye die?</p></blockquote>

<blockquote><p>HEAVEN is the Lot of the Righteous; where the absence of all Evil, an unspeakable fulness of Blessings, both for Body and Soul, and a perfect fruition of GOD, shall make up our Happiness. JESUS CHRIST, the Bridegroom, will there give Consummation to our Joys.

NO more Temptations, no more Sins, no more Sufferings, no more Fears; But Light in the Mind, Comforts in the Heart, Peace in the Conscience, a perfect Union of the Faithful in giving Eternal Thanks to God, in the enjoyment of Felicity that shall have no end.

What ought not we to do; what Miseries should not we be content to suffer, to secure the hope of this Glory God has promised to us? What Terror ought to seize us, when we reflect upon our Sins, which (if not repented of) will deprive us of it for ever?</p></blockquote>

<blockquote><p>What should the old Creature do in Heaven? Heaven would be no Heaven to him: the Heavenly Jerusalem is another kind of thing then most take it to be. What wild, bald Conceptions have sensual Sots of Heaven? as though it were Mahomet‘s Paradise, or Heathens Elysian Fields, wherein Men may only gratify their Senses, or wallow in Pleasures: Alas, a Man may say to these ignorant Souls, as our Lord to Zebedee‘s Children, You know not what you ask. You would go to Heaven, yes, fain you would be saved, but do you know what Heaven is? I will tell you briefly, Heaven consists in a freedom from all Sin, a perfection of Grace, enjoyment of God, employment in divine Praises, love, delight in God, meditation on God, Ecstasies and Ravishment of all the Soul’s Faculties in immediate communion with him:

And what awkward Conceptions hath a carnal Heart of these blessed Privileges? They would be no advantage to him at all, but a torment, to him that hates God, runs from him, cannot abide to come near him in any Duty, likes not the Society of God’s Saints, delights in sinful Practices, dallies with Satan’s Temptations: Can men imagine they shall take Cards and Dice, Cups and Queens with them to Heaven? Nay, can Men take fair Houses, full Bags, or worldly Business into another world? Can men make great Purchases, gather great Rents, or break Jests with their Companions in a future state?

Alas, a poor carnal heart is weary of Duties, much more will he be in Heaven; Sermon is too long, Prayer is tedious, when will the Sabbath be gone? Can these be fit to enjoy God in an eternal Sabbath of rest? nay, the poor guilty Sinner cares not for coming near to God, the Sight of God is terrible to him, as it was to fallen Adam: indeed without converting Grace, introducing this New Creature and Divine Nature, the Soul would be altogether strange to God, and any converse with an holy, glorious God; yea, even the sanctified themselves, by reason of the Remainders of Corruption in them, have much ado to bring their Hearts to converse with God, especially when they lie under the sense of Guilt, even a Godly Peter then crys out, Depart from me, for I am a sinful man, O Lord, Luk. 5.8.

Much more will a graceless Soul not dare to come near to God; an Hypocrite shall not come before him Job 13.16. He will not, and God will not suffer him: but a gracious Heart can truly say, It is good for me to draw nigh to God, Psal. 73.28. Communion with God is his Heaven upon Earth: Therefore this God will be his Salvation, himself is his best Heaven: but a carnal Heart knows not what this means, and is therefore uncapable of Heaven.</p></blockquote>

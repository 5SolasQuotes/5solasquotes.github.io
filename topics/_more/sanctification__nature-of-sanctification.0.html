<figure class="quote" id="q-734562b80d" data-kw="">
<blockquote><p>O take a look of Him in his perfection. He is without measure and limits – without beginning and ending. He is one and the same in his nature, in his counsels, and in his love. He perfectly knoweth Himself, and all things that are possible. He can do all things that do not imply a contradiction, and argue imperfection.

He is good and doeth good; He is righteous in Himself, and equal in all his ways of dealing with his creatures. He is true without and dissimulation; He is holy, and delighteth in his own holiness, and in every resemblance of it, in his angels and in his saints.

O! who can think of Him and who can speak of Him aright? He is infinite in all his attributes; and every perfection hath a perfect meeting in Him. Albeit some of his attributes are in some degree communicable to his creatures, yet they are in Him in an altogether incommunicable manner and measure. There is nothing in God but what is God; for this is his name – “I am that I am.”

Again I say, Who can think of Him, and who can speak of Him aright? Who can comprehend Him, or compass Him about? Who by understanding can search out God? Humble and believing ignorance is better than curious and prying knowledge: for all that we can know of Him, is to know that we cannot know him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Honourable Societies of Strangers at Lewarden, in Friesland, 18 February 1686 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh</cite></span></figcaption>

</figure><figure class="quote" id="q-c796423fd6" data-kw="">
<blockquote><p>The historical source from which the main streams of Perfectionist doctrine that have invaded modern Protestanism take their origin, is the teaching of John Wesley. But John Wesley did not first introduce Perfectionism into Protestantism, nor can all the Perfectionist tendencies which have shown themselves in Protestantism since his day be traced to him. Such tendencies appear constantly along the courses of two fundamental streams of thought. Wherever Mysticism intrudes, it carries a tendency to Perfectionism with it.

On Mystical ground—as for example among the Quakers—a Perfectionism has been developed to which that taught by Wesley shows such similarity, even in details and modes of expression, that a mistaken attempt has been made to discover an immediate genetic connection between them. Wherever again men lapse into an essentially Pelagian mode of thinking concerning the endowments of human nature and the conditions of human action, a Perfectionism similar to that taught by Pelagius himself tends to repeat itself. That is to say, history verifies the correlation of Perfectionism and Libertarianism, and wherever Libertarianism rules the thoughts of men. Perfectionism persistently makes its appearance.

It is to this stream of influence that Wesleyan Perfectionism owes its own origin. Its roots are set historically in the Semi-Pelagian Perfectionism of the Dutch Remonstrants, although its rise was not unaffected by influences of a very similar character and ultimate source which came to it through the channels of Anglo-Catholicism. Its particular differentiation is determined by the supernaturalization which it shares with the whole body of modifications introduced by Wesley into his fundamental Arminianism, from which Wesleyanism, in distinction from the underlying Remonstrantism, has acquired its Evangelical character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Albrecht Ritschl and his Doctrine of Christian Perfection in Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-f15bda121d" data-kw="">
<blockquote><p>For while there remains any remnant of the lust of the flesh, to be kept in check by the rein of continence, God is by no means loved with all one’s soul. For the flesh does not lust without the soul; although it is the flesh which is said to lust, because the soul lusts carnally. In that perfect state the just man shall live absolutely without any sin, since there will be in his members no law warring against the law of his mind, but wholly will he love God, with all his heart, with all his soul, and with all his mind which is the first and chief commandment.</p></blockquote>

<blockquote><p>The most usual word to signify, either the upright is Tham, or Thamim, which commonly is translated perfect, as Gen. 17.1. Deut. 18.13. Ps. 15.2.37.37.119.1. or uprightness, is Thom or thamim, which usually is translated perfection whereby not legal perfection is meant (which is absolute and complete, not only in respect of the parts, but also of degrees) but evangelical, according to the covenant of grace; which is nothing else (the Lord accepting in his children the will for the deed) but integrity or uprightness; and is so expounded Ps. 25.21. Jos. 24.14. Job. 1.1.; 2.3. Ps. 27.7. For very many in the scriptures have this perfection attributed to them, who notwithstanding had their imperfections. as Noah, Gen. 6.9. Job. 1.1.8.2.3. Jacob, Gen. 25.27. &amp;c. of Asa it is said 2. Chro. 15.17. that his heart was perfect all his days: and yet in the next Chapter there are recorded three foul sins, which he committed. 2. Chron. 16.7.10.12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 122-23.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The most usual word to signify, either the upright is Tham, or Thamim, which commonly is translated perfect, as Gen. 17.1. Deut. 18.13. Ps. 15.2.37.37.119.1. or uprightness, is Thom or thamim, which usually is translated perfection whereby not legal perfection is meant (which is absolute and complete, not only in respect of the parts, but also of degrees) but evangelical, according to the covenant of grace; which is nothing else (the Lord accepting in his children the will for the deed) but integrity or uprightness; and is so expounded Ps. 25.21. Jos. 24.14. Job. 1.1.; 2.3. Ps. 27.7. For very many in the scriptures have this perfection attributed to them, who notwithstanding had their imperfections. as Noah, Gen. 6.9. Job. 1.1.8.2.3. Jacob, Gen. 25.27. &amp;c. of Asa it is said 2. Chro. 15.17. that his heart was perfect all his days: and yet in the next Chapter there are recorded three foul sins, which he committed. 2. Chron. 16.7.10.12.”

</figure><figure class="quote" id="q-6700a17bc9" data-kw="">
<blockquote><p>What spirit shall we think they have, that will unchurch churches, because they have some defilement and unbrotherly brethren, accounting them no churches, no brethren, because they have some imperfections? Why hath not Christ a quarrel to the church then? is he blind? doth his love make him blind? No; he seeth corruption, but he seeth better things; somewhat of his own, that makes him overlook those imperfections, because they are such as he means to mortify, subdue, wear away, and to fire out by the power of his Spirit, which as fire shall waste all those corruptions in time. So it is with the church. Put the case, she hath some corruptions: that it be not with her as it should be, yet she is a church notwithstanding. The church of Corinth, we see, Paul styles them saints and brethren, with all those sweet names (1 Cor. 1:1, 2), notwithstanding they had many corruptions among them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), pp 149-50.</span></figcaption>

</figure><figure class="quote" id="q-77a37dace4" data-kw="">
<blockquote><p>The purposes of Deity are not lawless and arbitrary. His will is determined by the perfections of His nature. To say, therefore, that there are things which He cannot do, is simply to affirm that He cannot will them, and to say that He cannot will them, is just to assert that they are inconsistent with the perfections of His Being. In such cases, consequently, we do not limit, we only define the power of God …

It is His glory to be what He is. The possession of infinite perfections and the enjoyment within Himself of unchanging blessedness, independence and self-sufficiency, are characteristics of the Deity which render it impossible that His manifold works should spring from any other motive but the counsel of His Own will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of the Atonement</cite>, (Columbia SC: Samuel Weir, 1845), pp 11, 28.</span></figcaption>

</figure><figure class="quote" id="q-8e1dd6ba7a" data-kw="">
<blockquote><p>The Westminster divines worked on what might have been called “The Medium Catechism” before scrapping it and writing the Shorter and Larger Catechisms. The minutes of the Assembly give us some insight into what this catechism would have looked like had it been published:

Q. 6. What doe the Scriptures teach us to conceive of God?

A. God is a most glorious being, infinite in all perfections. …

Q. 15. What are we to believe concerning the holiness of God?

A. God is most perfectly holy, and neither causeth nor alloweth any to sin. …

Q. 19. Is God subject to any change or changeableness?

A. God is always the same unchangeably notwithstanding the changes in all others things.

Q. 20. What are we to believe concerning the truth of God?

A. God is most true in all his words, particularly in his promises and threatenings, and it is not possible for him to lie.

Q. 21. What are we to believe concerning the blessedness of God?

A. God is in himself most blessed, every way, and for ever, neither can any creature add to his happiness or take anything from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 708, 711, 15, 17 Sep. 1646, pp 283, 285.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

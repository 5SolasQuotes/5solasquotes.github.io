</figure><figure class="quote" id="q-ccdb759494" data-kw="">
<blockquote><p>But first of all, it is necessary to consider certain changes which took place in Christian thought on this subject during the preceding centuries. Be the origin of the doctrine in the attempt to smooth the rough places of law for the sake of the weak or tender conscience, or in the practical necessity for a guiding principle of division as a kind of ready reckoner for pastoral purposes, or in both these causes, a change of deep significance came about in its structure. At first, and up to the close of the patristic era, the key-note of the distinction was oþjectivity. The external act is the criterion, so that there is a regular tabula of sins, the commission of any of which involves the sinner in mortal sin. But by the time of the Schoolmen, and notably, of in the works of St. Thomas Aquinas, a tremendous ethical course, change in the idea has come about. There are still sins which are reckoned as mortal, suo genere [in its genera], but the governing factor is no longer the external act. It is the deliberateness with which the act is committed. In other words, intention or motive is receiving recognition as the determining element in assessing the gravity of sin. It was to Peter Abelard [c. 1079–1142)] that Aquinas and his fellows were indebted for this improved idea: In the Scito Te Ipsum [Know Yourself, by Abelard] the discussion of sin moves forward out of the realm of externals. Consequent on this stressing of deliberateness at the expense of drawing a clear line between what was mortal and what venial. This indeterminacy. inevitably paved the way for laxity in the computation of the guiltiness of certain sinful acts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-r-mcadoo.html">Henry R. McAdoo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 4, ‘Mortal &amp; Venial Sin: the Reforming Strain’ in The Structure of Caroline Moral Theology (Longmans, Green, 1949)</cite>, pp. 98-119</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-73711eb6d7" data-kw="">
<blockquote><p>There are some of our party who think the distinction of mortal and venial sin can be retained in this sense [as in Rom. 7], as Robert Baron, following the theologians of Great Britain, in his Judicio de Perseverantia, although it does not seem sufficiently appropriate on account of our opponents; the distinction of heavy and light sins is better. The question simply concerns the nature of sins in themselves according to the strictness of the law. We think all are mortal, none truly venial.</p></blockquote>

<blockquote><p>Those, then, who hold the Calvinistic view of the state of the case with respect to the moral character and condition of men, may not unreasonably be asked whether they can give any other account of the origin, or any explanation of the cause, of this fearful state of things. Now, in the history of the discussions which have taken place upon this subject, we can trace four pretty distinct courses which have been taken by theologians who all admitted the total native depravity of mankind: First, some have refused to attempt any explanation of the state of the case, beyond the general statement that Scripture represents it as in some way or other connected with, and resulting from, the fall of Adam, and have denied, expressly or by plain implication, the common Calvinistic doctrine of imputation. A second class, comprehending the great body of Calvinistic divines, have regarded it as, in some measure and to some extent, explained by the principle of its being a penal infliction upon men, resulting from the imputation to them of the guilt of Adam’s first sin. A third class, while refusing to admit in words the doctrine of imputation, as commonly stated by orthodox divines, have yet put forth such views of the connection between Adam and his posterity, and of the bearing of his first sin upon them, as embody the sum and substance of all, or almost all, that the avowed defenders of the doctrine of imputation intend by it. And, lastly, there is a fourth class, who, while professing in words to hold the doctrine of the imputation of Adam’s sin, yet practically and substantially neutralize it or explain it away, especially by means of a distinction they have devised between immediate or antecedent, and mediate or consequent imputation—denying the former, which is the only true and proper imputation, and admitting only the latter. It is quite plain that it is only the first two of these four divisions of theological opinion that can be regarded as important, or even real and substantial. For, on the one hand, those who belong to the third class… may yet be really ranked under the second class, because they admit the whole substance of what the doctrine of imputation is usually understood to include or involve; while, on the other hand, those who belong to the fourth class, admitting imputation in words, but denying it in reality and substance, belong properly to the first class.</p></blockquote>

</figure><figure class="quote" id="q-3d9cea5587" data-kw="">
<blockquote><p>La Place’s innovation was as a matter of course condemned by the Reformed world, formally at the Synod of Charenton (1644-1645) and in the Helvetic Consensus (1675) and by argument at the hands of the leading theologians — Rivetus, Turretin, Maresius, Driessen, Leydecker, and Marck. But the tendencies of the time were in its favor and it made its way. It was adopted by theologians like Wyttenbach, Endemann, Stapfer, Roell, Vitringa, Venema; and after a while it found its way through Britain to America, where it has had an interesting history — forming one of the stages through which the New England Theology (q.v.) passed on its way to its ultimate denial of the quality of sin involving guilt to anything but the voluntary acts of a free agent; and finally becoming one of the characteristic tenets of the so-called “New School Theology” of the Presbyterian Churches. Thus it has come about that there has been much debate in America upon “imputation,” in the sense of the imputation of Adam’s sin, and diverse types of theology have been framed, especially among the Congregationalists and Presbyterians, centering in differences of conception of this doctrine. Among the Presbyterians, for example, four such types are well marked, each of which has been taught by theologians of distinction. These are (1) the ‘Federalistic,’ characterized by its adherence to the doctrine of ‘immediate imputation,’ represented, for example, by Dr. Charles Hodge; (2) the ‘New School,’ characterized by its adherence to the doctrine of ‘mediate imputation,’ represented, for example, by Dr. Henry B. Smith; (3) the ‘Realistic,’ which teaches that all mankind were present in Adam as generic humanity, and sinned in him, and are therefore guilty of his and their common sin, represented, for example, by Dr. W. G. T. Shedd; and (4) one which may be called the ‘Agnostic,’ characterized by an attempt to accept the fact of the transmission of both guilt and depravity from Adam without framing a theory of the mode of their transmission or of their relations one to the other, represented, for example, by Dr. R. W. Landis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Imputation’, ‘6. La Place &amp; Later Theologians &amp; Schools’</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“La Place’s innovation was as a matter of course condemned by the Reformed world, formally at the Synod of Charenton (1644-1645) and in the Helvetic Consensus (1675) and by argument at the hands of the leading theologians — Rivetus, Turretin, Maresius, Driessen, Leydecker, and Marck. But the tendencies of the time were in its favor and it made its way. It was adopted by theologians like Wyttenbach, Endemann, Stapfer, Roell, Vitringa, Venema; and after a while it found its way through Britain to America, where it has had an interesting history — forming one of the stages through which the New England Theology (q.v.) passed on its way to its ultimate denial of the quality of sin involving guilt to anything but the voluntary acts of a free agent; and finally becoming one of the characteristic tenets of the so-called “New School Theology” of the Presbyterian Churches. Thus it has come about that there has been much debate in America upon “imputation,” in the sense of the imputation of Adam’s sin, and diverse types of theology have been framed, especially among the Congregationalists and Presbyterians, centering in differences of conception of this doctrine. Among the Presbyterians, for example, four such types are well marked, each of which has been taught by theologians of distinction. These are (1) the ‘Federalistic,’ characterized by its adherence to the doctrine of ‘immediate imputation,’ represented, for example, by Dr. Charles Hodge; (2) the ‘New School,’ characterized by its adherence to the doctrine of ‘mediate imputation,’ represented, for example, by Dr. Henry B. Smith; (3) the ‘Realistic,’ which teaches that all mankind were present in Adam as generic humanity, and sinned in him, and are therefore guilty of his and their common sin, represented, for example, by Dr. W. G. T. Shedd; and (4) one which may be called the ‘Agnostic,’ characterized by an attempt to accept the fact of the transmission of both guilt and depravity from Adam without framing a theory of the mode of their transmission or of their relations one to the other, represented, for example, by Dr. R. W. Landis.”

<blockquote><p>That man was the first Adam, who was as a certain common mass or lump, wherein was contained all mankind: which lump being corrupted, we cannot be brought forth into this world, but with corruption and uncleanness. And although Eve transgressed before the man, yet the beginning of sinning is ascribed unto Adam: for that succession is attributed unto men, and not unto women… But this is now the scope of the apostle, to teach out of what thing as from the ground and beginning sin was by propagation traduced into mankind. … For in every sin are two things to be considered. The action or wicked affection, which is as it were the matter: and the offense or obligation to punishment, which they call reatus, that is, guiltiness. And original sin herein differs from those sins which they call actuall, for that in them [actual sins] the matter abides not still. For so soon as a man has either committed adultery, or spoken blasphemy, those actions straightway as soon as the thing is done cease to be, neither are any more extant. Only there remains the offence against God and guiltiness. Wherefore seeing by faith and repentance the obligation unto punishement, or offence against God is remitted, we will easily grant that the whole sin is abolished. But in original sin the consideration is far otherwise: for the matter thereof passes not away. For every one of us has experience in himself, that corruption of nature remains in us: seing that yet also we continually fall into sins, and are both in body and mind untoward to things pertaining to God: which sin yet unto the faithful are not imputed. For the guiltiness and offense against God is in baptism through faith in Christ forgiven, although the matter of sin do still remain. Which matter, although in holy men it be broken and weakened, yet we shall not be perfectly rid thereof, till we be dead. And forasmuch as men-regenerate beget children, not by that they are regenerate, but by nature and the flesh, thereof it comes that the children also of the believers are born obnoxious unto original sin. For into them is poured the same vitiate and corrupt nature that is in the parents: when as yet on the other side, forgivenees or imputation, which are apprehended by faith, cannot be poured into them. For the better explication hereof, Augustine brings two similitudes: One is of grains of corn: which although they are sown into the ground being purged of their leaves, stalks, chaff and ears, yet they spring up again with all these things: which hereof comes to pass, for that that cleansing comes not to those grains by nature, but by the art and industry of men. And forasmuch as the corn springs not of these principles of art and industry, but of nature, it must needs be that when they are sprung up, they follow the order not of human industry but of their own nature. The second similitude is of a man, y• is circumcised: who notwithstanding begets a son with his foreskin. And this hereof comes, for that circumcision was not in the father by nature, but by a certain force added from without. And seing that children are not procreated by that outward force, but by an inward strength of nature, it is of necessity that when they are begotten they follow the order of nature. And therfore we bring forth no other children, but such as we are ourselues. Wherefore seeing we have in us the contagiousness of original sin, they undoubtedly also cannot be without it. But we cannot communicate unto our children the remission and forgiveness of that sin. For, that is to be hoped for at God’s hands only. … Now seeing I have declared what the apostle means by sin, and by which one man, it entered into the world, there remains to consider by what means it was spread abroad. This is a matter obscure and very hard, and therefore I do not think to stand long about it. But forasmuch as the word of God most plainly teaches that such a sin there is, and that it descends into our posterity, although we understand not the manner and way, how it is poured into them, yet we ought to give place unto the truth and not to be too much careful or to trouble ourselues more than needs touching the way and manner, which is hard to be known, and may with out danger be unknown. Howbeit I think it not amiss to declare those ways and means which I have observed amongst the ecclestical writers: whose opinions touching this matter are four in number. The first is of those which thought that we receive of our parents the souls together with the bodies, that even as God by human seed creates the body, so also of the same creates He the soul… Whose arguments… I judge indeed probable: but yet not of necessity… [The second view is not labeled and might be another form of traducianism.] The third way is that God therfore creates the soul with such a sin or defect, for that it shall be the soul of a man now damned, and set under the curse. Such a soul say they, God creates as is required to such a man… this fond device is of every man rejected: lest we should seem to make God absolutely the author of sins. The fourth maner is by the consents of many men received, and seems very likely to be true: namely, that the soul is not created with some [sin], but straightway draws unto it sin so soon as ever it is adjoined unto the body derived from Adam… … ‘For that all men have sinned.’ This might have seemed very sharp and hard, that for the sin only of the first man all men should die. But Paul shows that this is justly done, because all men have sinned. About this particle ᾧ [which is neuter or masculine] which properly signifies in quo, that is, ‘in which,’ and is englished, ‘For that,’ is no small controversy how it ought to be taken. Some will haue it to be referred unto ‘sin’ [previously in Rom. 5:12, namely Adam’s first actual sin, which interpretation lends itself to an immediate imputation]. But the Greek word ἁμαρτία [sin] which went before it, seems to be against that. For it is [in] the feminine gender. Howbeit, it may be that Paul had a respect unto the other word παράπτωμα [offense, in v. 15 ff.], which is [in] the neuter gender, which word he afterward oftentimes uses, although it be counted a fault in speach to refer the relative to things coming after… …[Vermigli discusses the translation “in whom”.] But touching this matter, I will not much contend. For I think that ᾧ is a particle-causal, so that the sense is, Therefore has death gone over all men, because all men have sinned. For Chrisostom says: That when Adam fell, all other men also, which did not eat of the fruit were touched. And he thinks that Paul, as a wise physician, having the disease set before him, abides not in those things which be circumstances about it, or do follow it, but comes to the principal ground and first cause thereof. Therefore do all men die, because all men have sinned. Neither ought we to think that here is meant that all men do sin by some certain action: for that can have no place in children. But it is all one as if he had said, Now they are bondslaves unto sin, and are counted guilty thereof… By those things also which are written unto the Hebrews may be declared, how we have sinned in the fall of Adam. For there we read that Levi paid tenths in the loins of Abraham. After the selfsame manner also may here be understood that we were polluted in the loins and in the mass of Adam… …These things… in very deed… wholly confirm our sentence: wherein we say that Paul in this place takes sin most amply, so that it comprehends both the root, and all the fruits thereof. But I marvel how these men [who advocate for orginal sin being propagated from children’s imitation of their parents] go about to pluck away original vice from the nature of sin. For sin according to the common definition, they say, is whatsoever is spoken, done or thought against the Law of God, and this can have no place in children. But they consider not that in this definition is not all sin uniuersally contained. And therefore we before signified that sin is otherwise to be defined: so that that is said to be sin which any manner of way is against the Law and will of God… But to this we answered before: that the guiltyness indeed is forgiven unto the believers, howbeit the corrupt substance remains: which, if Christ were not a helper unto us, should of his own nature condemn us. For seeing it turns us away from the rule of the Law of God, it ought to be taken to be in very deed sin… ‘Where no law is, sin is not imputed.’ …This imputation or reputation is to be referred unto men, which were so miserable and blind that of themselves they could not so much as know sins, so far were they of that they could beware of sins, so utterly obscure was at that time the light of nature: but God imputed those sins unto them, and that not unworthily: for that blindness happened through their own default. And that God imputed those sins unto them, He Himself many ways declared. For He both by the flood destroyed the whole world, and complained unto Noah that all flesh had corrupted their way, and that the heart of man was prone unto sin even from his childhood. He reproved Cain of murder: and took vengeance upon the Sodomites… ‘That death reigned’ …And he therefore added that ‘death reigned from Adam even to Moses,’ to declare that there was sin in the world. For death and sin follow one the other inseperably: and sin and death infer and bring in one the other. Hereby are confuted those which contend that infants are without sin: and say that for that cause they die, for that by reason of the sin of Adam they are under the condition of mortality, being otherwise themselves innocent and clean from sin.</p></blockquote>

faith+in+Christ+forgiven%2C+although+the+matter+of+sin+do+still+remain.+Which+matter%2C+although+in+holy+men+it+be+broken+and+weakened%2C+yet+we+shall+not+be+perfectly+rid+thereof%2C+till+we+be+dead.+And+forasmuch+as+men-regenerate+beget+children%2C+not+by+that+they+are+regenerate%2C+but+by+nature+and+the+flesh%2C+thereof+it+comes+that+the+children+also+of+the+believers+are+born+obnoxious+unto+original+sin.+For+into+them+is+poured+the+same+vitiate+and+corrupt+nature+that+is+in+the+parents%3A+when+as+yet+on+the+other+side%2C+forgivenees+or+imputation%2C+which+are+apprehended+by+faith%2C+cannot+be+poured+into+them.+For+the+better+explication+hereof%2C+Augustine+brings+two+similitudes%3A+One+is+of+grains+of+corn%3A+which+although+they+are+sown+into+the+ground+being+purged+of+their+leaves%2C+stalks%2C+chaff+and+ears%2C+yet+they+spring+up+again+with+all+these+things%3A+which+hereof+comes+to+pass%2C+for+that+that+cleansing+comes+not+to+those+grains+by+nature%2C+but+by+the+art+and+industry+of+men.+And+forasmuch+as+the+corn+springs+not+of+these+principles+of+art+and+industry%2C+but+of+nature%2C+it+must+needs+be+that+when+they+are+sprung+up%2C+they+follow+the+order+not+of+human+industry+but+of+their+own+nature.+The+second+similitude+is+of+a+man%2C+y%E2%80%A2+is+circumcised%3A+who+notwithstanding+begets+a+son+with+his+foreskin.+And+this+hereof+comes%2C+for+that+circumcision+was+not+in+the+father+by+nature%2C+but+by+a+certain+force+added+from+without.+And+seing+that+children+are+not+procreated+by+that+outward+force%2C+but+by+an+inward+strength+of+nature%2C+it+is+of+necessity+that+when+they+are+begotten+they+follow+the+order+of+nature.+And+therfore+we+bring+forth+no+other+children%2C+but+such+as+we+are+ourselues.+Wherefore+seeing+we+have+in+us+the+contagiousness+of+original+sin%2C+they+undoubtedly+also+cannot+be+without+it.+But+we+cannot+communicate+unto+our+children+the+remission+and+forgiveness+of+that+sin.+For%2C+that+is+to+be+hoped+for+at+God%E2%80%99s+hands+only.+%E2%80%A6+Now+seeing+I+have+declared+what+the+apostle+means+by+sin%2C+and+by+which+one+man%2C+it+entered+into+the+world%2C+there+remains+to+consider+by+what+means+it+was+spread+abroad.+This+is+a+matter+obscure+and+very+hard%2C+and+therefore+I+do+not+think+to+stand+long+about+it.+But+forasmuch+as+the+word+of+God+most+plainly+teaches+that+such+a+sin+there+is%2C+and+that+it+descends+into+our+posterity%2C+although+we+understand+not+the+manner+and+way%2C+how+it+is+poured+into+them%2C+yet+we+ought+to+give+place+unto+the+truth+and+not+to+be+too+much+careful+or+to+trouble+ourselues+more+than+needs+touching+the+way+and+manner%2C+which+is+hard+to+be+known%2C+and+may+with+out+danger+be+unknown.+Howbeit+I+think+it+not+amiss+to+declare+those+ways+and+means+which+I+have+observed+amongst+the+ecclestical+writers%3A+whose+opinions+touching+this+matter+are+four+in+number.+The+first+is+of+those+which+thought+that+we+receive+of+our+parents+the+souls+together+with+the+bodies%2C+that+even+as+God+by+human+seed+creates+the+body%2C+so+also+of+the+same+creates+He+the+soul%E2%80%A6+Whose+arguments%E2%80%A6+I+judge+indeed+probable%3A+but+yet+not+of+necessity%E2%80%A6+%5BThe+second+view+is+not+labeled+and+might+be+another+form+of+traducianism.%5D+The+third+way+is+that+God+therfore+creates+the+soul+with+such+a+sin+or+defect%2C+for+that+it+shall+be+the+soul+of+a+man+now+damned%2C+and+set+under+the+curse.+Such+a+soul+say+they%2C+God+creates+as+is+required+to+such+a+man%E2%80%A6+this+fond+device+is+of+every+man+rejected%3A+lest+we+should+seem+to+make+God+absolutely+the+author+of+sins.+The+fourth+maner+is+by+the+consents+of+many+men+received%2C+and+seems+very+likely+to+be+true%3A+namely%2C+that+the+soul+is+not+created+with+some+%5Bsin%5D%2C+but+straightway+draws+unto+it+sin+so+soon+as+ever+it+is+adjoined+unto+the+body+derived+from+Adam%E2%80%A6+%E2%80%A6+%E2%80%98For+that+all+men+have+sinned.%E2%80%99+This+might+have+seemed+very+sharp+and+hard%2C+that+for+the+sin+only+of+the+first+man+all+men+should+die.+But+Paul+shows+that+this+is+justly+done%2C+because+all+men+have+sinned.+About+this+particle+%E1%BE%A7+%5Bwhich+is+neuter+or+masculine%5D+which+properly+signifies+in+quo%2C+that+is%2C+%E2%80%98in+which%2C%E2%80%99+and+is+englished%2C+%E2%80%98For+that%2C%E2%80%99+is+no+small+controversy+how+it+ought+to+be+taken.+Some+will+haue+it+to+be+referred+unto+%E2%80%98sin%E2%80%99+%5Bpreviously+in+Rom.+5%3A12%2C+namely+Adam%E2%80%99s+first+actual+sin%2C+which+interpretation+lends+itself+to+an+immediate+imputation%5D.+But+the+Greek+word+%E1%BC%81%CE%BC%CE%B1%CF%81%CF%84%CE%AF%CE%B1+%5Bsin%5D+which+went+before+it%2C+seems+to+be+against+that.+For+it+is+%5Bin%5D+the+feminine+gender.+Howbeit%2C+it+may+be+that+Paul+had+a+respect+unto+the+other+word+%CF%80%CE%B1%CF%81%CE%AC%CF%80%CF%84%CF%89%CE%BC%CE%B1+%5Boffense%2C+in+v.+15+ff.%5D%2C+which+is+%5Bin%5D+the+neuter+gender%2C+which+word+he+afterward+oftentimes+uses%2C+although+it+be+counted+a+fault+in+speach+to+refer+the+relative+to+things+coming+after%E2%80%A6+%E2%80%A6%5BVermigli+discusses+the+translation+%E2%80%9Cin+whom%E2%80%9D.%5D+But+touching+this+matter%2C+I+will+not+much+contend.+For+I+think+that+%E1%BE%A7+is+a+particle-causal%2C+so+that+the+sense+is%2C+Therefore+has+death+gone+over+all+men%2C+because+all+men+have+sinned.+For+Chrisostom+says%3A+That+when+Adam+fell%2C+all+other+men+also%2C+which+did+not+eat+of+the+fruit+were+touched.+And+he+thinks+that+Paul%2C+as+a+wise+physician%2C+having+the+disease+set+before+him%2C+abides+not+in+those+things+which+be+circumstances+about+it%2C+or+do+follow+it%2C+but+comes+to+the+principal+ground+and+first+cause+thereof.+Therefore+do+all+men+die%2C+because+all+men+have+sinned.+Neither+ought+we+to+think+that+here+is+meant+that+all+men+do+sin+by+some+certain+action%3A+for+that+can+have+no+place+in+children.+But+it+is+all+one+as+if+he+had+said%2C+Now+they+are+bondslaves+unto+sin%2C+and+are+counted+guilty+thereof%E2%80%A6+By+those+things+also+which+are+written+unto+the+Hebrews+may+be+declared%2C+how+we+have+sinned+in+the+fall+of+Adam.+For+there+we+read+that+Levi+paid+tenths+in+the+loins+of+Abraham.+After+the+selfsame+manner+also+may+here+be+understood+that+we+were+polluted+in+the+loins+and+in+the+mass+of+Adam%E2%80%A6+%E2%80%A6These+things%E2%80%A6+in+very+deed%E2%80%A6+wholly+confirm+our+sentence%3A+wherein+we+say+that+Paul+in+this+place+takes+sin+most+amply%2C+so+that+it+comprehends+both+the+root%2C+and+all+the+fruits+thereof.+But+I+marvel+how+these+men+%5Bwho+advocate+for+orginal+sin+being+propagated+from+children%E2%80%99s+imitation+of+their+parents%5D+go+about+to+pluck+away+original+vice+from+the+nature+of+sin.+For+sin+according+to+the+common+definition%2C+they+say%2C+is+whatsoever+is+spoken%2C+done+or+thought+against+the+Law+of+God%2C+and+this+can+have+no+place+in+children.+But+they+consider+not+that+in+this+definition+is+not+all+sin+uniuersally+contained.+And+therefore+we+before+signified+that+sin+is+otherwise+to+be+defined%3A+so+that+that+is+said+to+be+sin+which+any+manner+of+way+is+against+the+Law+and+will+of+God%E2%80%A6+But+to+this+we+answered+before%3A+that+the+guiltyness+indeed+is+forgiven+unto+the+believers%2C+howbeit+the+corrupt+substance+remains%3A+which%2C+if+Christ+were+not+a+helper+unto+us%2C+should+of+his+own+nature+condemn+us.+For+seeing+it+turns+us+away+from+the+rule+of+the+Law+of+God%2C+it+ought+to+be+taken+to+be+in+very+deed+sin%E2%80%A6+%E2%80%98Where+no+law+is%2C+sin+is+not+imputed.%E2%80%99+%E2%80%A6This+imputation+or+reputation+is+to+be+referred+unto+men%2C+which+were+so+miserable+and+blind+that+of+themselves+they+could+not+so+much+as+know+sins%2C+so+far+were+they+of+that+they+could+beware+of+sins%2C+so+utterly+obscure+was+at+that+time+the+light+of+nature%3A+but+God+imputed+those+sins+unto+them%2C+and+that+not+unworthily%3A+for+that+blindness+happened+through+their+own+default.+And+that+God+imputed+those+sins+unto+them%2C+He+Himself+many+ways+declared.+For+He+both+by+the+flood+destroyed+the+whole+world%2C+and+complained+unto+Noah+that+all+flesh+had+corrupted+their+way%2C+and+that+the+heart+of+man+was+prone+unto+sin+even+from+his+childhood.+He+reproved+Cain+of+murder%3A+and+took+vengeance+upon+the+Sodomites%E2%80%A6+%E2%80%98That+death+reigned%E2%80%99+%E2%80%A6And+he+therefore+added+that+%E2%80%98death+reigned+from+Adam+even+to+Moses%2C%E2%80%99+to+declare+that+there+was+sin+in+the+world.+For+death+and+sin+follow+one+the+other+inseperably%3A+and+sin+and+death+infer+and+bring+in+one+the+other.+Hereby+are+confuted+those+which+contend+that+infants+are+without+sin%3A+and+say+that+for+that+cause+they+die%2C+for+that+by+reason+of+the+sin+of+Adam+they+are+under+the+condition+of+mortality%2C+being+otherwise+themselves+innocent+and+clean+from+sin.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Most+Learned+%26+Fruitful+Commentaries+of+Dr.+Peter+Martyr+Vermilius...+%28d.+1562%3B+London%3A+1568%29%2C+Commentary+on+Romans%2C+ch.+5+%7C+On+Rom.+5%3A12%2C+pp.+110-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F158d671e11.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/158d671e11.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-mediate-imputation-of-adams-original-sin/#:~:text=That%20man%20was%20the%20first%20Adam,themselves%20innocent%20and%20clean%20from%20sin&amp;text=That%20man%20was%20the%20first%20Adam%2C%20who%20was&amp;text=being%20otherwise%20themselves%20innocent%20and%20clean%20from%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>11. There are two parts of this [original] sin: the former is the defection from God in the loins of Adam; the latter is the pravitas (depravity) that followed that defection. Hence it happens that original sin is said to be both inherent and imputed. 12. Imputed sin is that disobedience or defection of Adam, which was imputed to all his posterity who were in his loins, because they were in Adam as in their stock and root. For it is most just before God, and indeed it is received among all nations, that what the head does is deservedly imputed to the whole body, and that children are despoiled of all paternal goods on account of the father’s rebellion. But the case is not the same for other sins of parents, which, because they are truly personal, are therefore not transfused into their children. 13. The sin of Adam in the very act of his sinning is indeed alien from us, because we were not yet in act, but only in potentiality (δυνάμει) and originally in his loins; but with respect to the nature common to us and to him, it is proper to each. Therefore, we are punished not on account of the sin of Adam, but on account of our own which is in reality inherent in us. Just as someone infected in a time of contagion infects others, and the infected die; he who dies, dies not on account of the plague of another, but on account of his own. … 23. As to the mode by which this sin is derived into posterity, we confess that this cannot be explained with sufficient precision. Augustine advises that nothing should be rashly asserted in such a question; and certainly, one should rather ask by what way we can escape from that evil, than how it has come down to us. 24. It must be known, however, that it is not transferred to us only by custom or by example and imitation of the sin of the first parents, as the Pelagians contended, for those who cannot imitate the sins of others also die and are judged (Rom. 5:14); but by propagation and natural traduction, we who are born such as Adam was after the sin.</p></blockquote>

t+evil%2C+than+how+it+has+come+down+to+us.+24.+It+must+be+known%2C+however%2C+that+it+is+not+transferred+to+us+only+by+custom+or+by+example+and+imitation+of+the+sin+of+the+first+parents%2C+as+the+Pelagians+contended%2C+for+those+who+cannot+imitate+the+sins+of+others+also+die+and+are+judged+%28Rom.+5%3A14%29%3B+but+by+propagation+and+natural+traduction%2C+we+who+are+born+such+as+Adam+was+after+the+sin.%E2%80%9D%0A%0A%E2%80%94+Theodore+Tronchin%2C+Theological+Theses+on+Original+Sin+trans.+AI+%28Geneva%3A+de+la+Planche%2C+1625%29%2C+p.+5+Latin+Tronchin+%281582-1657%29+was+a+professor+of+Hebrew+and+theology+at+Geneva.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F90adf0f7fe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/90adf0f7fe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-mediate-imputation-of-adams-original-sin/#:~:text=11.%20There%20are%20two%20parts%20of,as%20Adam%20was%20after%20the%20sin&amp;text=11.%20There%20are%20two%20parts%20of%20this%20%5Boriginal&amp;text=born%20such%20as%20Adam%20was%20after%20the%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Nor indeed would God impute the sin of Adam to his posterity, unless they had in themselves something that was truly sin, and unless they were by nature evil; for he who was entirely free from sin would be unjustly punished with death. Only then can the sin of another be justly imputed to an innocent person, when he stands as a surety for the sinner.</p></blockquote>

<blockquote><p>Canon 10: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head androot with the whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12,19) and “in Adam all die” (I Cor 15:21–22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty. Canon 11: For a double reason, therefore, man, because of sin, is by nature, and hence from his birth, before committing any actual sin, exposed to God’s wrath and curse; first, on account of the transgression and disobedience which he committed in the loins of Adam; and, secondly, on account of the consequent hereditary corruption implanted to his very conception, whereby his whole nature is depraved and spiritually dead; so that original sin may rightly be regarded as twofold, imputed sin and inherent hereditary sin. Canon 12: Accordingly we can not, without harm to the Divine truth, agree with those who deny that Adam represented his posterity by God’s intention, and that his sin is imputed, therefore, immediately to his posterity; and under this mediate and consequent imputation not only destroy the imputation of the first sin, but also expose the doctrine of hereditary corruption to grave danger.</p></blockquote>

</figure><figure class="quote" id="q-18dace4f5e" data-kw="">
<blockquote><p>Thus it has come about that there has been much debate in America upon ‘imputation,’ in the sense of the imputation of Adam’s sin, and diverse types of theology have been framed, especially among the Congregationalists and Presbyterians, centering in differences of conception of this doctrine. Among the Presbyterians, for example, four such types are well marked, each of which has been taught by theologians of distinction. These are (1) the ‘Federalistic,’ characterized by its adherence to the doctrine of ‘immediate imputation,’ represented, for example, by Dr. Charles Hodge; (2) the ‘New School,’ characterized by its adherence to the doctrine of ‘mediate imputation,’ represented, for example, by Dr. Henry B. Smith; (3) the ‘Realistic,’ which teaches that all mankind were present in Adam as generic humanity, and sinned in him, and are therefore guilty of his and their common sin, represented, for example, by Dr. W. G. T. Shedd; and (4) one which may be called the ‘Agnostic,’ characterized by an attempt to accept the fact of the transmission of both guilt and depravity from Adam without framing a theory of the mode of their transmission or of their relations one to the other, represented, for example, by Dr. R. W. Landis.</p></blockquote>

<blockquote><p>II. And if anyone would exactly view the manner and circumstances of Adam’s sin, he shall find that in every man, the character, and no obscure image, of that first sin, is deeply impressed: for there is engrafted in every man curiosity and desire of knowing those things which pertain nothing to him: and also a distrustful hesitation, and doubting of the Word of God: And as Adam laid the fault upon his wife, and his wife upon the Serpent, so is it natural to every man to cover his fault with another’s fault: Also flight and trembling at the meeting of God, lying, dissembling, and a sense of indecent nakedness are in all men by nature, and are derived into posterity from that fountain; and to these things we are not taught, but made, not instructed, but infected: to these things we do not only not need a master, but contrary to the teaching of masters, and to discipline, all stayes and bars being broken, we return to them, nature being conqueror.</p></blockquote>

<blockquote><p>Here it must be premised that God, thus punishing, must be regarded as acting the part of a supreme Rector and Governor, not as a subordinate Judge constituted under law… God could rightfully covenant with the whole human race in the person of the first-formed man (the protaplast), so that by reason and virtue of that natural conjunction which existed between Adam and his posterity, God could give a precept to Adam, obliging him, not as an individual of human nature, but as the stock and origin of the whole nature; and therefore all posterity in his person; on this condition, that if he kept the precept, his posterity would be born in that original justice in which he himself was first created. But if he transgressed, all who would thereafter be born from him would be contaminated by sin, and indeed, by his sinning, the whole human race would be considered to sin. Now this divine ordinance concerning: 1. The obligation of the human race in the person of Adam; 2. The imputation of his transgression to his posterity; 3. The propagation of his corruption to the same posterity; 4. The punishment of posterity for Adam’s sin, has its principal foundation in the Dominion of God, but it has a congruence of equity in that natural conjunction which exists between Adam and his posterity. Whence God, punishing the connected person, that is, the posterity of Adam sinning in the person of Adam, could most excellently do this by his own right. Hence it is that the apostle, speaking of the first man, Rom. 5:12, says, “in whom all have sinned,” from which place it is rightly inferred that we are all not only born sinners, but have at some time sinned. And the same apostle teaches this in Rom. 3, when he says, “All have sinned, and come short of the glory of God.” But since it is certain that none of us sinned by our own will before we were born, as the apostle himself says in Rom. 9, where it is said of Jacob and Esau that they had not yet done anything good or evil when it was said to their mother, “the elder shall serve the younger,” it follows that we sinned by another’s will; that is, Adam’s, which will, however, unless it had been in some way the will of the whole nature, and therefore also ours, we would in no way be said to have truly sinned. We sinned, therefore, in the first man, when he sinned; and that transgression of his was also our transgression. Adam alone committed that sin with an actual will; but to us it is communicated through generation in the way that what is past can be communicated, namely by imputation; for it is imputed to all who are born of Adam, because we all, existing in the loins of Adam, in him and through him sinned, when he himself sinned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God, in punishing a person connected to the one who sinned, exercises his own right’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 59-65</cite>, pp. 59-61</span></figcaption>

re+all+not+only+born+sinners%2C+but+have+at+some+time+sinned.+And+the+same+apostle+teaches+this+in+Rom.+3%2C+when+he+says%2C+%E2%80%9CAll+have+sinned%2C+and+come+short+of+the+glory+of+God.%E2%80%9D+But+since+it+is+certain+that+none+of+us+sinned+by+our+own+will+before+we+were+born%2C+as+the+apostle+himself+says+in+Rom.+9%2C+where+it+is+said+of+Jacob+and+Esau+that+they+had+not+yet+done+anything+good+or+evil+when+it+was+said+to+their+mother%2C+%E2%80%9Cthe+elder+shall+serve+the+younger%2C%E2%80%9D+it+follows+that+we+sinned+by+another%E2%80%99s+will%3B+that+is%2C+Adam%E2%80%99s%2C+which+will%2C+however%2C+unless+it+had+been+in+some+way+the+will+of+the+whole+nature%2C+and+therefore+also+ours%2C+we+would+in+no+way+be+said+to+have+truly+sinned.+We+sinned%2C+therefore%2C+in+the+first+man%2C+when+he+sinned%3B+and+that+transgression+of+his+was+also+our+transgression.+Adam+alone+committed+that+sin+with+an+actual+will%3B+but+to+us+it+is+communicated+through+generation+in+the+way+that+what+is+past+can+be+communicated%2C+namely+by+imputation%3B+for+it+is+imputed+to+all+who+are+born+of+Adam%2C+because+we+all%2C+existing+in+the+loins+of+Adam%2C+in+him+and+through+him+sinned%2C+when+he+himself+sinned.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98God%2C+in+punishing+a+person+connected+to+the+one+who+sinned%2C+exercises+his+own+right%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%2C+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+59-65%2C+pp.+59-61&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6562a5d83c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6562a5d83c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/original-sin/#:~:text=Here%20it%20must%20be%20premised%20that,him%20sinned%2C%20when%20he%20himself%20sinned&amp;text=Here%20it%20must%20be%20premised%20that%20God%2C%20thus&amp;text=and%20through%20him%20sinned%2C%20when%20he%20himself%20sinned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a1bba9d646" data-kw="">
<blockquote><p>That will [of Adam], therefore, in the first place, and that act of Adam is imputed to us; then from that imputation, the habitual will and the stain of original guilt has adhered to us. You [a Romanist] (I believe) fear the imputation of sin, lest you be forced to concede the imputation of justice. But without it, you will never explain clearly or understand soundly what original guilt is, and how the will of Adam was ours, and how we sinned voluntarily in Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin… against the first three books of Thomas Stapleton… (Cambridge: Legat, 1600) 175 pp.</cite>, p. 35</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/original-sin.html">Original Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“That will [of Adam], therefore, in the first place, and that act of Adam is imputed to us; then from that imputation, the habitual will and the stain of original guilt has adhered to us. You [a Romanist] (I believe) fear the imputation of sin, lest you be forced to concede the imputation of justice. But without it, you will never explain clearly or understand soundly what original guilt is, and how the will of Adam was ours, and how we sinned voluntarily in Adam.”

— William Whitaker, A Treatise on Original Sin… against the first three books of Thomas Stapleton… (Cambridge: Legat, 1600) 175 pp., p. 35">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+will+%5Bof+Adam%5D%2C+therefore%2C+in+the+first+place%2C+and+that+act+of+Adam+is+imputed+to+us%3B+then+from+that+imputation%2C+the+habitual+will+and+the+stain+of+original+guilt+has+adhered+to+us.+You+%5Ba+Romanist%5D+%28I+believe%29+fear+the+imputation+of+sin%2C+lest+you+be+forced+to+concede+the+imputation+of+justice.+But+without+it%2C+you+will+never+explain+clearly+or+understand+soundly+what+original+guilt+is%2C+and+how+the+will+of+Adam+was+ours%2C+and+how+we+sinned+voluntarily+in+Adam.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Treatise+on+Original+Sin%E2%80%A6+against+the+first+three+books+of+Thomas+Stapleton%E2%80%A6+%28Cambridge%3A+Legat%2C+1600%29+175+pp.%2C+p.+35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa1bba9d646.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a1bba9d646.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/original-sin/#:~:text=That%20will%20%5Bof%20Adam%5D%2C%20therefore%2C%20in,how%20we%20sinned%20voluntarily%20in%20Adam&amp;text=That%20will%20%5Bof%20Adam%5D%2C%20therefore%2C%20in%20the%20first&amp;text=ours%2C%20and%20how%20we%20sinned%20voluntarily%20in%20Adam" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5cf0052172" data-kw="">
<blockquote><p>If sin is taken for an action conflicting with the law, original sin is the first disobedience of Adam, committed by Adam himself, not as he was a singular person, but as he bore the person of the whole human race. But if sin is taken for that which remains in a man after the action, and whence the same man is named not sinning but a sinner, original sin is the lack of original justice, together with a habitual aversion and deordination of the will, which can also be called a stain rendering the will hateful to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Original Sin in Works of Samuel Ward: Theological Determinations, a Treatise on Justification, Lectures on Original Sin, ed. Seth Ward (d. 1643; London: Gallibrand, 1658), pp. 392-656 trans. AI Latin | Thus, therefore, if it is asked of us what original sin properly is, we respond with Bellarmine:</cite>, ch. 13, pp. 537-39</span></figcaption>

<blockquote><p>…by reason of original sin it is, that a natural man cannot perform anything in a gracious manner, to wit, for want [lack] of the love of God: Original sin being an habitual aversion from God and conversion unto the creature, or more briefly an inordinate conversing with the creature, either in enjoying it, whereas he should only use it, God alone being to be enjoyed; or in using it, but not in a gracious manner, that is, not for God;s sake; to wit, through want of the love of God, which is brought upon us by the sin of Adam, as whereby our natures were bereaved of the Spirit of God. Thus in prosecuting mine answer unto a devised argument, I have made bold to open my mind concerning original sin: A point that has seemed unto me of such difficulty that I have been wont to range it amongst those three [things] whereabouts I could not expect to be satisfied whilst I lived.</p></blockquote>

</figure><figure class="quote" id="q-b7093a9d35" data-kw="">
<blockquote><p>Now Prosper shows how original sin passes over all, not by the will of God; and secondly, how it passes over all by the will of God: Not by the will of God instituente; but by the will of God judicante: His words are these: Haec servitus non est institutio Dei, sed judicium. This slavery of sin which came upon all by Adam’s sin is not God’s institution but his judgment. As much as to say it came not upon a man by God’s first creation, but by his judgment upon him, because of his first trangression; so that if divine judgment be the will of God; it is apparent Prosper is so far from denying that slavery to have come upon all men by the just will of God, as that he expressly acknowledges it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions</cite>, p. 61</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/original-sin.html">Original Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now Prosper shows how original sin passes over all, not by the will of God; and secondly, how it passes over all by the will of God: Not by the will of God instituente; but by the will of God judicante: His words are these: Haec servitus non est institutio Dei, sed judicium. This slavery of sin which came upon all by Adam’s sin is not God’s institution but his judgment. As much as to say it came not upon a man by God’s first creation, but by his judgment upon him, because of his first trangression; so that if divine judgment be the will of God; it is apparent Prosper is so far from denying that slavery to have come upon all men by the just will of God, as that he expressly acknowledges it.”

</figure><figure class="quote" id="q-201b1eb355" data-kw="">
<blockquote><p>I say indeed the guilt of Adam’s transgression is derived unto us, that is to our persons by imputation; but that very sin of Adam was the sin of our natures, as Augustine speaks: Non modo natura facta est peccatrix, sed et genuit peccatores. ‘Not only our human nature became a sinner, but also begat sinners.’ (De Nuptitis, ch. 34) And accordingly it is justly imputed unto our persons, otherwise how could it be just with God to condemn any man for original sin; which yet is expressly acknowledged by Mr. Hoord. And the apostle says expressly that ‘in Adam all have sinned.’ And Augustine gives the reason of it: De Adamo omnes peccatum originale trahunt, quia omnes unus fuerunt. ‘All draw original sin from Adam, because all were that one.’… And that the corruption consequent is derived to us only by propagation, I think it is without doubt amongst all who concur not with Pelagius in maintaining that it is derived unto us by imitation, and so [by this] only… they proceed from a false ground, supposing that the reason of this imputation of Adam’s sin, and propagation of his corruption unto all his posterity, is merely built upon this foundation, that we were in Adam’s loins when he sinned, which is untrue: 1. In his first reason he does miserably overlash; for we could not be guilty of all the sins which were committed by Adam from his fall to his life’s end, no not upon the ground whereon this authour builds; so long we were not in his Ioines, nor any longer than till he begat Seth; for from Seth sprang Noah, and we all from him. Neither is it credible that Adam continued to beget children till the last yeare, and month, and day of his life. Indeed we no where read that we are guilty of any other of his sins besides the first, the reason whereof shall be given in the next place. 2. Therefore I say, in answer unto them both that the ground of imputing Adam’s sin unto his posterity is not only because we were in Adam’s Ioins, but because the first sin of Adam was it that bereaved his nature of God’s image; and so brought corruption upon himself by an aversion from the Creator and unchangeable good, and conversion unto the creature, wherein the Lord left him, bereaving him of his Spirit; and this nature, by this sin alone so corrupt, is the fountain of all our natures: Like as if Adam had stood, of the same fountain of integrity we had all received incorrupt natures, so that the like cannot be said of any other sin of Adam afterwards committed by him, nor of the sin of any other our progenitors succeeding him. For as for the wicked, they have no such spirit of God to loose; and as for the godly, they have indeed the Spirit of God, but so as not to be taken from them by the sins committed by them, any more than it was from David upon the committing of so foul sins in the matter of Uriah; neither do any godly parents propagate their state of grace to their posterity. And Aquinas is so bold hereupon as to profess that (Summa, pt. 1 of 2, q. 81, art. 2, in the body): Impossibile est, quod aliqua peccata parentum proximorum, vel etiam primi parentis praeter primum, per originem traducantur. ‘It is impossible that the sins of our immediate parents, or of our first parents, besides the first, should be derived unto posterity by propagation.’ For, says he, a man generates the same with himself in kind [or nature] only, not in individual. And therefore those things, which pertain to him as a particular person, as acts personal, he does not propagate unto his children. Now to the nature of man, something may pertain naturally, something by the gift of grace. And this original righteousness as a gift of grace was bestowed on the whole nature of mankind in our first parents, which Adam lost by his first sin; so that like as original righteousness had been propagated to posterity together with the human nature, so also the opposite inordination. But as for other actual sins, either of our first parents, or of others, they do not corrupt the nature of man, as touching that which pertains to nature, but as touching that which pertains to his person; therefore other sins are not propagated unto posterity. And this reason which Aquinas gives, was long before given by Anselm, De Conceptu Virginali et Originali Peccato, ch. 23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions</cite>, p. 140</span></figcaption>

t parents, or of others, they do not corrupt the nature of man, as touching that which pertains to nature, but as touching that which pertains to his person; therefore other sins are not propagated unto posterity. And this reason which Aquinas gives, was long before given by Anselm, De Conceptu Virginali et Originali Peccato, ch. 23.”

+it+credible+that+Adam+continued+to+beget+children+till+the+last+yeare%2C+and+month%2C+and+day+of+his+life.+Indeed+we+no+where+read+that+we+are+guilty+of+any+other+of+his+sins+besides+the+first%2C+the+reason+whereof+shall+be+given+in+the+next+place.+2.+Therefore+I+say%2C+in+answer+unto+them+both+that+the+ground+of+imputing+Adam%E2%80%99s+sin+unto+his+posterity+is+not+only+because+we+were+in+Adam%E2%80%99s+Ioins%2C+but+because+the+first+sin+of+Adam+was+it+that+bereaved+his+nature+of+God%E2%80%99s+image%3B+and+so+brought+corruption+upon+himself+by+an+aversion+from+the+Creator+and+unchangeable+good%2C+and+conversion+unto+the+creature%2C+wherein+the+Lord+left+him%2C+bereaving+him+of+his+Spirit%3B+and+this+nature%2C+by+this+sin+alone+so+corrupt%2C+is+the+fountain+of+all+our+natures%3A+Like+as+if+Adam+had+stood%2C+of+the+same+fountain+of+integrity+we+had+all+received+incorrupt+natures%2C+so+that+the+like+cannot+be+said+of+any+other+sin+of+Adam+afterwards+committed+by+him%2C+nor+of+the+sin+of+any+other+our+progenitors+succeeding+him.+For+as+for+the+wicked%2C+they+have+no+such+spirit+of+God+to+loose%3B+and+as+for+the+godly%2C+they+have+indeed+the+Spirit+of+God%2C+but+so+as+not+to+be+taken+from+them+by+the+sins+committed+by+them%2C+any+more+than+it+was+from+David+upon+the+committing+of+so+foul+sins+in+the+matter+of+Uriah%3B+neither+do+any+godly+parents+propagate+their+state+of+grace+to+their+posterity.+And+Aquinas+is+so+bold+hereupon+as+to+profess+that+%28Summa%2C+pt.+1+of+2%2C+q.+81%2C+art.+2%2C+in+the+body%29%3A+Impossibile+est%2C+quod+aliqua+peccata+parentum+proximorum%2C+vel+etiam+primi+parentis+praeter+primum%2C+per+originem+traducantur.+%E2%80%98It+is+impossible+that+the+sins+of+our+immediate+parents%2C+or+of+our+first+parents%2C+besides+the+first%2C+should+be+derived+unto+posterity+by+propagation.%E2%80%99+For%2C+says+he%2C+a+man+generates+the+same+with+himself+in+kind+%5Bor+nature%5D+only%2C+not+in+individual.+And+therefore+those+things%2C+which+pertain+to+him+as+a+particular+person%2C+as+acts+personal%2C+he+does+not+propagate+unto+his+children.+Now+to+the+nature+of+man%2C+something+may+pertain+naturally%2C+something+by+the+gift+of+grace.+And+this+original+righteousness+as+a+gift+of+grace+was+bestowed+on+the+whole+nature+of+mankind+in+our+first+parents%2C+which+Adam+lost+by+his+first+sin%3B+so+that+like+as+original+righteousness+had+been+propagated+to+posterity+together+with+the+human+nature%2C+so+also+the+opposite+inordination.+But+as+for+other+actual+sins%2C+either+of+our+first+parents%2C+or+of+others%2C+they+do+not+corrupt+the+nature+of+man%2C+as+touching+that+which+pertains+to+nature%2C+but+as+touching+that+which+pertains+to+his+person%3B+therefore+other+sins+are+not+propagated+unto+posterity.+And+this+reason+which+Aquinas+gives%2C+was+long+before+given+by+Anselm%2C+De+Conceptu+Virginali+et+Originali+Peccato%2C+ch.+23.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29%2C+bk.+2%2C+An+Examination+of+Certain+Passages+inserted+into+Mr.+Hord%E2%80%99s+Discourse%2C+Answer+to+the+Additions%2C+p.+140&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F201b1eb355.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/201b1eb355.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/original-sin/#:~:text=I%20say%20indeed%20the%20guilt%20of,Virginali%20et%20Originali%20Peccato%2C%20ch.%2023&amp;text=I%20say%20indeed%20the%20guilt%20of%20Adam%E2%80%99s%20transgression&amp;text=De%20Conceptu%20Virginali%20et%20Originali%20Peccato%2C%20ch.%2023" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Thesis 1… For, as Augustine himself testifies [about original sin] in On the Morals of the Church, “nothing is more known for preaching, nothing more secret for understanding, than original sin.” And how difficult this doctrine of original sin is, the most learned of English theologians warns in bk. 1, On Original Sin, when he says: ‘how it was propagated from Adam to posterity should be believed rather than inquired into; and it can be inquired into more easily than it can be understood; and it is better understood than it is explained.&#x27;</p></blockquote>

<blockquote><p>7. We are all so very much in the dark as to the clear and distinct apprehension of the true nature of original, inherent pravity or sin that we must needs be as much ignorant of the true nature of that inherent sanctity or righteousness which is its contrary, or cure. Learned [Matthew Flacius] Illiricus thought it was a substance, which he has in his Clavis pleaded for at large. Others call it a habit, others a nature, or natural inclination and a privation of a natural inclination to God: others call it an indisposition of the mind and will to holy truth and goodness, and an ill disposition of them to error and evil. Others call it only the inordinate lust of the sensitive faculties, with a debility of reason and will to resist it. And whilst the nature of the soul itself and its faculties are so much unknown to itself, the nature of original pravity and righteousness must needs be very much unknown.</p></blockquote>

<blockquote><p>§44. Four things are commonly acknowledged in Original Sin: 1. The Fuel, which is the proclivity of nature to evils, specifically to sensible and sensual things. Whence Paul in Rom. 8:5, 7 calls τὸ Φρόνημα σαρκός, the “wisdom of the flesh,” that which savors the things of the flesh, and is therefore hostile to God, and not subject to the law of God. In ch. 7:17, 20, it is the “sin that dwelleth in us,” the “evil that is present with us.” Verse 23, “the law which is in my members, warring against the law of my mind, and bringing me into captivity to the law of sin which is in my members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Sin &amp; its Distinctions’ (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’</cite>, p. 16</span></figcaption>

<blockquote><p>Why then do we die for another’s sin? Why is the sin of Adam imputed to us?… What? that the punishment is greater than the sin? For when we sinned in Adam only, in potentia, ‘in power’ and possibility, yet we are punished in actu, ‘in act’: And that seems most cruel, that Adam, which sinned in act is saved [by the promise of the Redeemer, it is held], and for the same sin many are damned, who sinned in Adam only in power and possibility. I answer: [1.] The place in Ezekiel must be taken thus: The innocent son shall not bear the punishment of his father’s sin: So when God says in the Law, that He will visit the iniquity of fathers upon the children, He speaks of children which walk in their father’s steps, and are partakers of the same fault: But the sons of Adam cannot be said to be innocent, as they which not only sinned in Adam, as in the stock and root of mankind, but also themselves are born stained with the same depravation, and prone to the same sin. Secondly, I say that that place in Ezekiel makes nothing to the present matter: for he speaks of the sins of the fathers, whose sins are personal, and who in sinning do not sustain the persons of their children. … Adam receiued gifts, which as he had for himself, so he should have conveyed them to his posterity, which seeing he lost, it justly comes to pass that his posterity should be deprived of those gifts. But my grandfather or great-grandfather received no supernatural gifts from God, which by an hereditary right they should derive to their posterity.</p></blockquote>

<blockquote><p>VII. But to that which was said, that the punishment was greater than the sin, because they which in Adam sinned only in power, are for his sin punished in act; it is easy to answer: For we so sinned in Adam in power, that also the sin was in us [coming into existence in this world] in act: neither do we only bear the punishment of another’s sin, but also of our own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism… (1619; London, 1620), ch. 9</cite>, pp. 63-64</span></figcaption>

</figure><figure class="quote" id="q-d43bc1cc26" data-kw="">
<blockquote><p>From these things, what they object to the contrary can be dealt with easily, namely: (1) The primary-first motions of sins or of concupiscence, although they lack prior consent, nevertheless do not lack all consent. (2) That man is a rational being. For it does not follow from this that all his acts are rational or voluntary. For there are also natural acts, such as falling down, and those things for example that are committed during sleep. I would not say that all acts of the will flow from the prior consent of the will; it is sufficient that they have concomitant consent. This can also be responded regarding original sin: for that also has the concomitant consent of the will, although it does not have antecedent consent.</p></blockquote>

</figure><figure class="quote" id="q-ab3fa7fc2b" data-kw="">
<blockquote><p>That original sin is derived to us, and inheres deeply fixed within us, is more than clear enough; but how it was propagated from Adam to his posterity ought to be believed rather than investigated, and can be investigated more easily than it can be understood, and is better understood than it is explained. It is not so much our concern now to care how we fell into this evil, as to be freed from it; just as Augustine relates of the one who had fallen into a well: to someone admiring how he could have fallen into the well, he said, “You think about how to free me from here, not ask how I fell in here.</p></blockquote>

</figure><figure class="quote" id="q-f942cb16af" data-kw="">
<blockquote><p>VI… And certainly, everything begotten is similar to the one begetting, not only according to essence, but also according to the accidents proper to the species, whether innate or adventitious. But we are all born of corrupt parents; whence Adam is said to have begotten a son in his own likeness (Gen. 5:3). Finally, the actual sins which flourish in all necessarily require some cause: where there are bad fruits, there is a rotten tree (Mt. 7:17). … VIII. Whence it follows that it [original sin] is… an accidental or adventitious contagion adhering in human nature, rendering it both evil and guilty. … XXIII. As to the mode by which this sin is derived into posterity, we confess that this cannot be explained with sufficient precision. Augustine advises that nothing should be rashly asserted in such a question; and certainly, one should rather ask by what way we can escape from that evil, than how it has come down to us.</p></blockquote>

>Read it online · Reformed Books Online</a></div>

<blockquote><p>Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections [properties] of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness.</p></blockquote>

<blockquote><p>But the example of him whose eyes are put out as a punishment for a crime, and who cannot justly be commanded to see, is inept and foreign to the present matter. Because a blind man is not bound to see; but one born in original sin is bound to be just and without sin, for from this obligation a rational creature is never released. Add to this that he who has been deprived of his eyes by a judge is blind involuntarily, and would wish for the recovery of his sight at a great price. But men born in sin are voluntarily evil, and rejoice in their own vice, and hate remedies.</p></blockquote>

<blockquote><p>4. Papists indeed seem to reject the negative [of the question whether original sin exists], yet they foster such opinions concerning this sin as in fact overturn that sin while they teach it to be less than any venial sin, with Aquinas the prince of their school and his other sectaries, and thus not to merit eternal death; indeed they want this to be only punishment, not guilt before the free assent of the will. Add the ὕπουλα [treacherous] dogmas: 1. That concupiscence is not sin formally, but only originally and effectively so called, or terminatively, because it is from sin, and from it sin [comes]. Nor does it have anything of the character of sin formally, except what is voluntary [in persons sinning]. 2. That naturals [natural powers] remained whole after the Fall, and thus free will is given even in the unregenerate in order to spiritual good. See Bellarmine, bk. 1, On the Loss of Grace, ch. 12.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. Papists indeed seem to reject the negative [of the question whether original sin exists], yet they foster such opinions concerning this sin as in fact overturn that sin while they teach it to be less than any venial sin, with Aquinas the prince of their school and his other sectaries, and thus not to merit eternal death; indeed they want this to be only punishment, not guilt before the free assent of the will. Add the ὕπουλα [treacherous] dogmas: 1. That concupiscence is not sin formally, but only originally and effectively so called, or terminatively, because it is from sin, and from it sin [comes]. Nor does it have anything of the character of sin formally, except what is voluntary [in persons sinning]. 2. That naturals [natural powers] remained whole after the Fall, and thus free will is given even in the unregenerate in order to spiritual good. See Bellarmine, bk. 1, On the Loss of Grace, ch. 12.”

— Friedrich Spanheim, Miscellaneous theological Disputations, pt. 1 (d. 1649; Geneva: Chouët, 1652), ‘Disputation on Original Sin’ trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+Papists+indeed+seem+to+reject+the+negative+%5Bof+the+question+whether+original+sin+exists%5D%2C+yet+they+foster+such+opinions+concerning+this+sin+as+in+fact+overturn+that+sin+while+they+teach+it+to+be+less+than+any+venial+sin%2C+with+Aquinas+the+prince+of+their+school+and+his+other+sectaries%2C+and+thus+not+to+merit+eternal+death%3B+indeed+they+want+this+to+be+only+punishment%2C+not+guilt+before+the+free+assent+of+the+will.+Add+the+%E1%BD%95%CF%80%CE%BF%CF%85%CE%BB%CE%B1+%5Btreacherous%5D+dogmas%3A+1.+That+concupiscence+is+not+sin+formally%2C+but+only+originally+and+effectively+so+called%2C+or+terminatively%2C+because+it+is+from+sin%2C+and+from+it+sin+%5Bcomes%5D.+Nor+does+it+have+anything+of+the+character+of+sin+formally%2C+except+what+is+voluntary+%5Bin+persons+sinning%5D.+2.+That+naturals+%5Bnatural+powers%5D+remained+whole+after+the+Fall%2C+and+thus+free+will+is+given+even+in+the+unregenerate+in+order+to+spiritual+good.+See+Bellarmine%2C+bk.+1%2C+On+the+Loss+of+Grace%2C+ch.+12.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim%2C+Miscellaneous+theological+Disputations%2C+pt.+1+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+%E2%80%98Disputation+on+Original+Sin%E2%80%99+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6ea58232d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6ea58232d5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/original-sin/#:~:text=4.%20Papists%20indeed%20seem%20to%20reject,the%20Loss%20of%20Grace%2C%20ch.%2012&amp;text=4.%20Papists%20indeed%20seem%20to%20reject%20the%20negative&amp;text=1%2C%20On%20the%20Loss%20of%20Gr

</figure><figure class="quote" id="q-07f85d4f9d" data-kw="">
<blockquote><p>…before [in 1 Tim. 2] there is an exhortation to pray ‘for all men,’ verse 1, which, although the Arminians make an argument that ‘all men’ is meant of all persons and not only of all sorts, both in that verse and verses 4 &amp; 6, because say they we ought to pray for all men universally pro singulis generum, and not only for all sorts; yet tis indeed an argument for the contrary. For to pray for all men without exception of any person is not commanded, but we find the contrary commanded. Jeremiah was forbidden to pray or make intercession for the obstinate, incorrigible Jews, Jer. 7:16; 11:14; 14:11. God would not have Samuel to mourn for Saul after he was rejected of the Lord, 1 Sam. 16:1, and we ought not to pray for such as sin unto death, i.e. the sin of blasphemy against the Holy Ghost, 1 Jn. 5:16. Paul is so far from praying for Alexander the coppersmith that he imprecates the vengeance of God upon him, 2 Tim. 4:14. We may not pray for the Pope who is the great Antichrist and son of perdition; neither may we pray for, but against Babylon [Romanism], especially after the people of God are out of her. We are bidden pray for our enemies, but not for the malicious incorrigible enemies of Christ. Wherefore when the apostle bids us pray for ‘all men,’ his meaning is that we should exclude no degree nor kind of men, great or small, Jew or Gentile, bound or free, etc.</p></blockquote>

</figure><figure class="quote" id="q-430dc08f14" data-kw="">
<blockquote><p>…the work of the Spirit, or the Holy Ghost, [is] to sanctify. And hereupon some have thought that opposition unto holiness is the sin against the Holy Ghost: But you find here it is a ‘blasphemy,’ therefore not every opposition [is such]. And if you look into Acts 7, you find that Stephen speaking of the Jews says at verse 51, ‘Ye stiff-necked and uncircumcised in heart and ear, ye do always resist the Holy Ghost;’ yet they did not sin this sin against the Holy Ghost. Why? For Stephen prays for them, at the last verse, ‘Lord, lay not this sin to their charge.’ But now says the apostle John, in 1 John, 5:16, ‘There is a sin unto death, I do not say that ye shall pray for it.’ Had they in Stephen’s account sinned this sin unto death, he would not have prayed for them; but he did pray for them. So that this sin against the Holy Ghost does not consist in every opposition unto the work of the Holy Ghost, as it is distinct from the Father and the Son.</p></blockquote>

nd%20the%20Son&amp;text=the%20work%20of%20the%20Spirit%2C%20or%20the%20Holy&amp;text=is%20distinct%20from%20the%20Father%20and%20the%20Son" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>If any man see his brother fall into and continue in such a sin as may be capable of forgiveness, let him earnestly sue unto God, for pardon of that offender; and God, who is great, and infinite in mercy, shall graciously incline his ear to his prayers, give remission and life to such an one. There is indeed a sin unto death, for which there is no forgiveness with God, because there is no capacity of repentance for it in the committer of it; I mean the sin against the Holy Ghost, when a man, having received the knowledge of the Gospel by the illumination of the Holy Spirit, and [has] professed the belief thereof, shall, in a devilish malice, wilfully blaspheme and persecute that known truth: I do not give you allowance to pray for the pardon of this sin.</p></blockquote>

</figure><figure class="quote" id="q-7bdadc8749" data-kw="">
<blockquote><p>Some diseases are opprobria medicorum, the reproaches of physicians; but there’s no immedicabile vulnus, no disease can pose Christ’s skill; He can cure the gangrene of sin when it is come to the heart; He healed Mary Magdalen an unchaste sinner; He healed Paul who breathed out persecution against the Church, insomuch that Paul stands and wonders at the cure, 1 Tim. 1:13, ‘But I obtained mercy〈 Greek 〉; ‘I was bemercied.’ Christ heals head-distempers and heart-distempers which may keep poor trembling souls from despair. ‘O’ says the sinner, ‘never was any so diseased as I!’ But look up to thy Physician Christ, who has healing under his wings; he can melt a heart of stone and wash away black sins in the crimson of his blood; there are no desperate cases with Christ; He has those salves, oils, balsoms which can cure the worst disease. Indeed there is one disease which Christ does not heal, namely the sin against the Holy Ghost; this is called a ‘sin unto death’; if we knew any who had sinned this sin, we were to shut them out of our prayer: ‘There is a sin unto death, I do not say that he shall pray for it,’ 1 Jn. 5:16. There’s no healing for this disease; not but that Christ could cure this, but the sinner will not be cured. The king could pardon a traitor, but if he will have no pardon, he must die. The sin against the Holy Ghost is unpardonable, because the sinner will have no pardon; he scorns Christ’s blood, despites his Spirit, therefore his sin has no sacrifice, Heb. 10:26, 29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes: or a Discourse upon part of Christ’s Famous Sermon on the Mount... (London: Smith, 1660), ‘The Soul’s Malady &amp; Cure,’</cite>, pp. 493-94</span></figcaption>

</figure><figure class="quote" id="q-0a36e6e2dd" data-kw="">
<blockquote><p>‘There is a sin not unto death’ — All sins and blasphemies shall be forgiven unto men, but the blasphemy against the Holy Ghost… But the unpardonable sin is here distinguished from all other sins…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible (d. 1669), on 1 John 5, verse 17</cite></span></figcaption>

</figure><figure class="quote" id="q-837b1deab6" data-kw="">
<blockquote><p>But here arises a doubt: Are we not to pray for wicked men, yea, the impenitent, the persecutors of the Church, contemners of the Word? I answer: … 3… 1 Jn. 5:16: ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death; I do not say that he shall pray for it.’ It is a tempting of God to intercede for that sin, seeing He has declared his will; the irremissible sin, is that sin, though it be hard to be found out. Therefore it is good to keep to the conditional form when a man, after the profession of religion, falls to an utter revolt and deadly hatred of it: it is a shrewd presumption they have committed that sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons Preached… (London: Astwood, 1684), Sermons on John 17, Sermon 12, on Jn. 17:9</cite>, p. 106-7</span></figcaption>

</figure><figure class="quote" id="q-77265b1065" data-kw="">
<blockquote><p>47. Num. 15:30; 1 Sam. 2:25; Mt. 12:31; Heb. 6:4 and 10:26; 2 Pet. 2:20. Viz. A total, malicious apostasy from the faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-clark.html">Samuel Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The New Testament of our Lord and Savior Jesus Christ with Annotations… (London: Simmons, 1683), on 1 John</cite>, 5:16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“47. Num. 15:30; 1 Sam. 2:25; Mt. 12:31; Heb. 6:4 and 10:26; 2 Pet. 2:20. Viz. A total, malicious apostasy from the faith.”

<blockquote><p>I… John speaks of a ‘sin unto death’ (1 Jn. 5:16) for which we are not to pray, which can be no other than a sin against the Holy Spirit… XIII… And for this reason it is called a ‘sin unto death’ (1 Jn. 5:16, 17), not only because it deserves death in its own nature (for so all sins are unto death (which is the case with all the sins of reprobates), but because it is such as to be absolutely unpardonable in itself.</p></blockquote>

<blockquote><p>It is designated under another name as apostasy, that is, not common, but preeminent apostasy (Heb. 6:6). Likewise, the sin unto death (1 John 5:16–17), which in the idea is never forgiven, nor can be. But it is chiefly called blasphemy against the Spirit (Matt. 12:31–32; Mark 3:28–30; Luke 12:10). This is the denomination that is especially proper to it.</p></blockquote>

</figure><figure class="quote" id="q-8f22801caf" data-kw="">
<blockquote><p>In case it should appear that any have committed the irremissible blasphemy against the Holy Ghost, and the total apostasy from the illuminating convictive powers of the Christian religion, it should seem that they are not to be prayed for at all. ‘For what remains but a certain fearful expectation of judgment, to consume such adversaries?’ Hebrews 10:27. And these last seem to be the sins chiefly intended by the apostle by the name of sins unto death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 John, ch. 5, verses 14-17</cite></span></figcaption>

<blockquote><p>29… which is called blasphemy against the Holy Spirit, 1 Jn. 5:16; Mt. 12:31-32; Dt. 29:19. 30… this is the sin unto death, which is not venial; 1 Jn. 5:16.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“29… which is called blasphemy against the Holy Spirit, 1 Jn. 5:16; Mt. 12:31-32; Dt. 29:19. 30… this is the sin unto death, which is not venial; 1 Jn. 5:16.”

— Campegius Vitringa, The Doctrine of the Christian Religion, Summarily Described through Aphorisms, vol. 2 6th ed. Martin Vitringa &amp; Theodore Schelting (d. 1722; Arnheim: Moelemann, 1761), pp. 378 &amp; 381">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C29%E2%80%A6+which+is+called+blasphemy+against+the+Holy+Spirit%2C+1+Jn.+5%3A16%3B+Mt.+12%3A31-32%3B+Dt.+29%3A19.+30%E2%80%A6+this+is+the+sin+unto+death%2C+which+is+not+venial%3B+1+Jn.+5%3A16.%E2%80%9D%0A%0A%E2%80%94+Campegius+Vitringa%2C+The+Doctrine+of+the+Christian+Religion%2C+Summarily+Described+through+Aphorisms%2C+vol.+2+6th+ed.+Martin+Vitringa+%26+Theodore+Schelting+%28d.+1722%3B+Arnheim%3A+Moelemann%2C+1761%29%2C+pp.+378+%26+381&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff1b4d35c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff1b4d35c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=which%20is%20called%20blasphemy%20against%20the,is%20not%20venial%3B%201%20Jn.%205%3A16&amp;text=which%20is%20called%20blasphemy%20against%20the%20Holy%20Spirit&amp;text=death%2C%20which%20is%20not%20venial%3B%201%20Jn.%205%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-97c83eb45a" data-kw="">
<blockquote><p>Between these two texts [at the beginning and ending of 1 Jn. 5], occur the words we wish to explain: ‘There is a sin unto death: I do not say that ye shall pray for it.’ Must not ‘the sin unto death,’ be that against which he wished to fortify the saints; I mean apostasy? What! you will say, is a man lost without remedy who has denied the truth; and is every one in the sad situation of those for whom the apostle prohibits prayer? God forbid, my brethren, that we should preach so strange a doctrine; and once more renew the Novatian severity! There are two kinds of apostates, and two kinds of apostasies: there is one kind of apostasy into which we fall by the fear of punishment, or on the blush of the moment, by the promises Satan makes to his proselytes. There is another, into which we fall by the enmity we have against the truth, by the detestable pleasure we take in opposing its force. It were cruel to account the first of these offenses, ‘a sin unto death;’ but the Spirit of God prompts us to attach this idea to the second. There are likewise two kinds of apostates. There is one class, who have made only small attainments in the knowledge of the truth; weak and imperfect Christians, unacquainted as yet with the joys and transports excited in the soul by a religion, which promises remission of sin, and everlasting felicity. There is another, on the contrary, to whom God has given superior knowledge, to whom He has communicated the gifts of miracles, and whom He has caused to experience the sweetness of his promise. It would be hard to reject the first; but the apostle had regard to the second. Those, according to St. John, who have committed the ‘sin unto death,’ are the persons who abjure Christianity, after the reception of all those gifts. In the primitive church, where some were honoured with the endowment of discerning spirits, there probably were brethren who could discern the latter apostates from the former. … Now, if you have been attentive to all the considerations we have just advanced: if you have understood the explanations we have given of the several texts, you may form a correct idea of the unpardonable sin. You may know what this crime was, at least, in the time of the primitive church. It was denying, hating and maliciously opposing the truth at the moment they were persuaded it proceeded from God. Two classes of men might commit this crime in the apostolic age. First, those who had never embraced Christianity; but opposed its progress in defiance of rational conviction, and the dictates of conscience. This was the sin of the Pharisees, who maliciously ascribed to the devil miracles, which they knew could have God alone for their author. Secondly, those who had embraced the gospel, who had been baptized, who had received the gift of miracles, and experienced all the graces enumerated in the text. This was the sin of those, who, after conversion, abjured the truth, and pronounced against Jesus Christ the anathemas which his enemies, and particularly the Jews, required of apostates. These St. Paul had in view, in the words of our text [Heb. 6:4 ff.], and in the tenth chapter of this epistle. Of this St. John also spake, when he said, ‘there is a sin unto death.’ Hence the sin described in these three passages, and the sin against the Holy Ghost, is the same in quality, if I may so speak, though diversified in circumstances: we have, consequently, comprised the whole under the vague appellation of unpardonable sin.</p></blockquote>

</figure><figure class="quote" id="q-1847491c61" data-kw="">
<blockquote><p>‘There is a sin unto death;’ which is not only deserving of death, as every other sin is, but which certainly and inevitably issues in death in all that commit it, without exception; and that is the sin against the Holy Ghost, which is neither forgiven in this world nor in that to come, and therefore must be unto death; it is a sinning wilfully, not in a practical, but doctrinal way, after a man has received the knowledge of the truth; it is a wilful denial of the truth of the Gospel, particularly that peace, pardon, righteousness, eternal life, and salvation, are by Jesus Christ, contrary to the light of his mind, and this joined with malice and obstinacy; so that there is no more or other sacrifice for such a sin; there is nothing but a fearful looking for of wrath and fury to fall on such opposers of the way of life; and as the presumptuous sinners under Moses’s law died without mercy, so must these despiteful ones under the Gospel; see Mt. 12:31. Some think there is an allusion to one of the kinds of excommunication among the Jews, called “shammatha”, the etymology of which, according to some Jewish writers, is שם מיתה, “there is death”. ‘I do not say that he shall pray for it;’ the apostle does not expressly forbid to pray for the forgiveness of this sin, yet what he says amounts unto it; he gives no encouragement to it, or any hopes of succeeding, but rather the reverse; and indeed where this sin is known, or can be known, it is not to be prayed for, because it is irremissible; but as it is a most difficult point to know when a man has sinned it, the apostle expresses himself with great caution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary (d. 1771), on 1 John 5, v. 16</cite></span></figcaption>

<blockquote><p>Now, if God so readily hear the prayers that are offered to Him with faith in the name of Christ, we ought to pray for forgiveness of sins of every kind to our Christian brethren and fellows of mankind, in hopes of obtaining it; except only the sin against the Holy Ghost, which God has fixed as unpardonable, and infallibly connected with eternal damnation.</p></blockquote>

<blockquote><p>The sin against the Holy Ghost is an universal, final and wilfull falling away of hypocritical professors from the truth and common graces of the Holy Ghost once received and professed, to the blasphemous despiting of the Spirit of Grace, horrid contempt and malice against the Son of God and violent persecution of the way of Christianity.</p></blockquote>

</figure><figure class="quote" id="q-3d3b7daf0e" data-kw="">
<blockquote><p>The sin against the Holy Ghost indeed is distinct and something different from this sin unto death that our apostle speaks of… It is true indeed that a sin in which a man continues unrepenting until his death and in which he dies, may very justly be called ‘a sin to death,’ that is, ‘a sin until his death,’ and it will prove a sin to death eternal, but that the apostle means here a particular sin, and that he estimates it not by its length but by its weight, not by how long the party continues in it, but by how grievous the sin is in itself, will appear as we go along, partly by discovery of the reason of the title he puts upon it, and partly by discovery of the very sin itself that is here intended…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16 (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45</cite>, p. 1094</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

</figure><figure class="quote" id="q-8a728eb99f" data-kw="">
<blockquote><p>And in this they [Jews] speak but the words of the Law, in Num. 15:27-28: ‘If any soul sin through ignorance, he shall bring a she-goat of the first year for a sin offering. And the priest shall make an atonement for him that sins ignorantly. But the soul that does ought presumptuously… the same has reproached the Lord: That soul shall be cut off from among his people.’ Now what is meant by ‘cutting off’?… ask the Jews to and among whom the thing was spoken, what it means in their common speech and acceptation, and they will tell you, ‘cutting off means’ [Hebrew], ‘Death by the hand of Heaven,’ death or destruction by the hand of God. Interpreting the matter to this purpose, that if a person sinned wilfully and presumptuously, there was no sin offering allowed in that case, but the party so offending fell immediately under liableness to divine vengance, to be destroyed or cut off by the hand of Heaven…</p></blockquote>

<blockquote><p>It [Heb. 10:26] tells you what sin it is, viz. ‘sinning wilfully after we have received the knowledge of the truth’: It limits to you why it is called a sin unto death, because there is no other way upon the committing of it, but a certain fearful expectation of judgment and fiery indignation. And it gives you some intimation why no praying for it: because [there is] no sacrifice for it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16 (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45</cite>, p. 1096</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It [Heb. 10:26] tells you what sin it is, viz. ‘sinning wilfully after we have received the knowledge of the truth’: It limits to you why it is called a sin unto death, because there is no other way upon the committing of it, but a certain fearful expectation of judgment and fiery indignation. And it gives you some intimation why no praying for it: because [there is] no sacrifice for it…”

</figure><figure class="quote" id="q-0c3fded103" data-kw="">
<blockquote><p>Every presumptuous sin in the text [that] was cited in Moses, was a sin unto death, in the sense that the Jewish nation understood a sin unto death, viz. that brought to an immediate liableness to cutting off by divine vengeance. Now this was a sin of presumption, and despising the Word of God, as Moses explains what that presumptuous sinning is… But why does not this our apostle speak out, and say, ‘I say he should not pray for it,’ but says only, ‘I do not say that he should.’… He [John] takes care of the consciences of the people of God as well as he shows the two conditions of the sinner he speaks of. There were some that might be in a strait what to do in this case. They were commanded by their Lord and Master to pray for their enemies: these enemies of theirs were become so like their father the Devil that it might pose their consciences whether they should pray for them or no. Therefore this divine apostle uses a happy temper: that he will lay no charge on them, that are so pinched, to pray for them: nor indeed forbid those to pray for them that are more enlarged: for undoubtedly the indifferent expression of the apostle as I may call it, seems plainly to carry with it such a consideration…</p></blockquote>

<blockquote><p>I shall not go about to define or circumscribe exactly the bounds wherin to conclude wilful sinning: I shall not confine this evil spirit with any circle: because I would have every one to look well about, lest the case be his own…</p></blockquote>

</figure><figure class="quote" id="q-cb5e6683ca" data-kw="">
<blockquote><p>But wilful sinner, how actest thou? To oppose the counsel and command of the Lord with all the heart, and mind, and soul. To love and follow and commit wickedness with all the heart, and mind, and soul. If this be not a deadly wound under the fifth rib, a mortal plague at the bottom of the will, what can you call the plague of the heart?… Every wilful sinning does add more hardness and more wilfulness of sinning to the heart still. A hard heart does harden by sinning: and the more the sin is wilful, the more the heart gathers hardness… So do wilful sinnings draw on one another, and from one the heart is emboldened to another.</p></blockquote>

</figure><figure class="quote" id="q-264b86fd28" data-kw="">
<blockquote><p>Whatsoever sin we see in the world, let us pray, and not despair; for God is the God of mercy. But for the sin to death, which is resisting grace, and fighting against mercy, and open blaspheming of the Holy Ghost, affirming that Christ’s miracles are done in Beelzebub, and his doctrine to be of the Devil, I think that no Christian man, if he perceive it, can otherwise pray than as Paul prayed for Alexander the coppersmith (2 Timothy, the last), ‘that God would reward him according unto his works.’ They that go back again after they know the truth, and give themselves willingly to sin for to follow it, and persecute the doctrine of truth by profession to maintain falsehood for their glory and vantage, are remediless: as ye may see: Heb. 6 and 10. Balaam sinned so; the false prophets in the Old Testament sinned so; the Pharisees sinned so; Alexander sinned so; and now many sin so, following their pride and covetousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositions &amp; Notes on Sundry Portions of the Holy Scriptures… (d. 1536; Cambridge: Parker Society, 1849), The Exposition of the First Epistle of St. John, on 1 Jn. 5:16-17</cite>, p. 212</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

<blockquote><p>‘A sin which is not unto death’… For he denies that sins are to death, not only those by which the saints daily offend, but even when it happens that God’s wrath is grievously provoked by them. For as long as room for pardon is left, death does not wholly retain its dominion… What, then, is the meaning of the apostle?… There is a sin unto death; I have already said that the sin to which there is no hope of pardon left, is thus called. But it may be asked, what this is; for it must be very atrocious, when God thus so severely punishes it. It may be gathered from the context, that it is not, as they say, a partial fall, or a transgression of a single commandment, but apostasy, by which men wholly alienate themselves from God. For the apostle afterwards adds that the children of God do not sin, that is, that they do not forsake God, and wholly surrender themselves to Satan, to be his slaves. Such a defection, it is no wonder that it is mortal; for God never thus deprives his own people of the grace of the Spirit; but they ever retain some spark of true religion. They must then be reprobate and given up to destruction, who thus fall away so as to have no fear of God. Were any one to ask, whether the door of salvation is closed against their repentance; the answer is obvious, that as they are given up to a reprobate mind, and are destitute of the Holy Spirit, they cannot do anything else, than with obstinate minds become worse and worse and add sins to sins. Moreover, as the sin and blasphemy against the Spirit ever brings with it a defection of this kind, there is no doubt but that it is here pointed out. But it may be asked again, by what evidences can we know that a man’s fall is fatal; for except the knowledge of this was certain, in vain would the apostle have made this exception, that they were not to pray for a sin of this kind. It is then right to determine sometimes, whether the fallen is without hope, or whether there is still a place for a remedy. This, indeed, is what I allow, and what is evident beyond dispute from this passage; but as this very seldom happens, and as God sets before us the infinite riches of his grace, and bids us to be merciful according to his own example, we ought not rashly to conclude that any one has brought on himself the judgment of eternal death; on the contrary, love should dispose us to hope well. But if the impiety of some appear to us not otherwise than hopeless, as though the Lord pointed it out by the finger, we ought not to contend with the just judgment of God, or seek to be more merciful than He is.</p></blockquote>

<blockquote><p>‘To bind’ is to denounce God’s wrath against impenitent sinners. ‘To loose’ is to pronounce remission of sins to repentant sinners; both which have certain degrees. The degrees of binding are: 1. A severe exhortation and commination, after private admonitions have been rejected; this must be done by the presbytery. (Mt. 18:15-17) 2. A keeping off from the Lord’s Supper. (Mt. 7:6) 3. The greater excommunication, by which the sinner is cast out of the Church, yet not without hope of pardon and return, if he repent. (1 Cor. 5:5) 4. Anathema, or in the Syriac word, Maran-atha, when he is cast out without hope. (1 Cor. 16:22; 1 Jn. 5:16)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity... (d. 1629; London: Mab, 1650), bk. 1, ch. 26, ‘Of the outward administration of the Church,’</cite>, p. 177</span></figcaption>

<blockquote><p>The faithless are the enemies of God and some of them the enemies of our Church and country, and some enemies to ourselves; and shall we pray for such? Although now they be the enemies of God, yet hereafter they may become friends and be reconciled unto Him: whereof our prayer may be a means: And therefore howsoever we are to pray against their wicked practices, we are to pray for their persons, that they of enemies may become friends; of infidels, faithful; of heretics and schismatics, sound Christians; of wicked and profane, religious and holy: ‘for this is good and acceptable in the sight of God our Savior, who wills that all men should be saved and come unto the knowledge of the truth.’ (1 Tim. 2:4) Examples of them who have prayed for the wicked are very many in the Word of God: As of Abraham, for the Sodomites, Gen. 18, Moses, for the rebellious Israelites, Ex. 32, yea, for Pharaoh and the Egyptians; Samuel, for Saul, the man of God for Jerdboam, 1 Kn. 13. But why seek [????] examples? We have a commandment to pray for such as have sinned not unto death, and a promise to procure mercy for them, 1 Jn. 5:16, and a complaint of God when this is not performed, Eze. 22:30. Prayers made for the wicked are many times without fruit. If they be without fruit, though they be to them idle, yet not to thee: Thy prayer shall return into thine own bosom, Ps. 35:13, according to that, Mt. 10:13, ‘When ye come into an house, salute it, or wish peace unto it: if the house be worthy, let your peace come upon it; but if it be not worthy, let your peace return to you.’ As for those that be our enemies, though the Schoolmen teach that we are not, or at least need not, specially to pray for them, yet our Savior Christ has commanded us to love our enemies, to bless them that curse us and to pray for them who despitefully use us and persecute us. So Jer. 29:7; Rom. 12:14. And this was practiced by our Savior, Lk. 13:34, by Stephen, Acts 7:60.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Treatise of Prayer... (Cambridge: 1640), ch. 32, ‘Distinctions of Prayer in regard of the Object,’</cite>, pp. 186-87</span></figcaption>

<blockquote><p>This place, by the confession of saint Augustine (sermon 11, On the Word of the Lord) is one of the hardest of all the Bible: and therefore diverse expositors have expounded it diversely. [1.] Augustine himself, after that he had delivered one exposition, that the sin unto death is the envying of our brother’s grace (Sermon on the Mount, ch. 21), retracts, giving another, that it is the finishing of this life in the wicked perverseness of his mind (Retractions, bk. 1, ch. 19, Siquis in scelerata mentis perversitate hanc vitam finierit.); And this is followed by many, Jerome, on ch. 14, Jeremiah; Ordinary Gloss, interlinear, Lyranus; Magister [Peter Lombard], Sentences, pt. 2, distinction 43. And hereupon some Popish writers infer prayers for the dead, that have not died in obstinacy, but showing penitence before their death. (Lorinus on 1 Jn. 5:16) But this collection is worthily rejected by one of their own side, because it is not spoken as of sins done heretofore, but now in doing, and therefore while a man lives. ‘If any man sees his brother sinning,’ not ‘has seen him to have sinned.’ 2. Some understand by the sin unto death, a mortal sin; by that ‘not unto death,’ a venial [sin], that is, a smaller and lighter offence, such as idle words, vain behavior or wanton looks (Gloss of Cassianus, Coll. 11, ch. 10; Origen, Homily 12 on Exodus): and hereupon the Popish found the distinction of mortal and venial sins, teaching that some grosser sins only deserve death, and that lesser sins do not make the soul subject to death. Now because it is absurd, the sin unto death being thus understood, to expound this sentence, as the words run, the glosses say that common persons are not to pray for such, but the priests only, to whose censure they are to be referred. But this also is worthily rejected by one of their own side (Lorinus on 1 Jn. 5:16), because it is added that he shall give life to those that sin not unto death; whereby is intimated that the sin to be prayed for, makes the sinner subiect to death also. And it is a poor shift to say that the priests might pray for such as sinned unto death, but not the common people, seeing saint John enjoins a vacation from prayer to all in this case. That there are some sins not worthy of death is also contrary to all true divinity: See Jm. 2:10; Dt. 27, verse last; Mt. 5:19; 12:36. 3. Some again understand the sin against the Holy Ghost, which is out of malice to impugne the known truth, when the Spirit enlightening the mind to understand the truth, yet it is of spite and malice impugned, as the scribes and Pharisees, contrary to their knowledge, did maliciously set themselves against Christ: when any commit this sin, they say we are not to pray for it, because our Savior Christ has pronounced that it shall never be forgiven. (Beza, Piscator, Carthus, Faber Stapul) Near unto this exposition comes Hilary [c. 310 – c. 367], expounding it of sin committed out of certain knowledge and malice; and Chrysostom [c. 347 – 407].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastica interpretatio: or the Expositions upon the Difficult &amp; Doubtful Passages of the Seven Epistles called Catholic &amp; the Revelation... (London: Haviland, 1627), on 1 Jn. 5</cite>, p. 218</span></figcaption>

<blockquote><p>2. The apostle, 1 Jn. 5:16, speaks of a sin unto death, that we are not to pray for one guilty of that; This has much troubled the learned; The ancients, they thought it was not an absolute prohibition of all [persons] to pray for such, but only that eminent men might do it; They thought for an ordinary Christian to pray for such sinners, it would be high presumption; As it’s not for everyone in the court to speak for some heinous offender but a special favourite; When God said, though Noah, Job and Daniel should pray for that people, He would not hear them (Eze. 14:14); This implied that they were nearer to God’s ear and might prevail sooner than others; Though this exposition be old, yet the text seems to be absolutely prohibitive; and so Augustine said that if we knew who had sinned that unpardonable sin against the Holy Ghost, we were no more to pray for him than for one damned in hell:</p></blockquote>

<blockquote><p>The recognition of this matter is twofold, one true and certain, by divine revelation given to the Prophets, as often was done in the beginning of the Apostolic Church, as it is evident from Acts; 1 Cor. 12; 1 Tim. 1:20; 2 Tim. 4:14, 15; the other likely and uncertain, through human experience, by a diligent observation of the words and deeds of the impious against Christ (Gomar), when the desperate impiety of some most clearly appears, etc. (Calvin), as formerly it was judged that the Emperor Julian† had sinned, etc. (Gomar). † The Emperor Julian reigned from 361 to 363. Although trained up in the Christian religion, he apostatized from the faith, and endeavored, if unsuccessfully, to restore Rome to its ancient paganism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole, vol. 79, 1, 2, and 3 John, Jude (VA: Master Poole Publishing, 2013), on 1 Jn. 5:16</cite>, pp. 173-74</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The recognition of this matter is twofold, one true and certain, by divine revelation given to the Prophets, as often was done in the beginning of the Apostolic Church, as it is evident from Acts; 1 Cor. 12; 1 Tim. 1:20; 2 Tim. 4:14, 15; the other likely and uncertain, through human experience, by a diligent observation of the words and deeds of the impious against Christ (Gomar), when the desperate impiety of some most clearly appears, etc. (Calvin), as formerly it was judged that the Emperor Julian† had sinned, etc. (Gomar). † The Emperor Julian reigned from 361 to 363. Although trained up in the Christian religion, he apostatized from the faith, and endeavored, if unsuccessfully, to restore Rome to its ancient paganism.”

l="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The sin against the Holy Ghost indeed is distinct and something different from this sin unto death that our apostle [John] speaks of… It is true indeed that a sin in which a man continues unrepenting until his death and in which he dies, may very justly be called ‘a sin to death,’ that is, ‘a sin until his death,’ and it will prove a sin to death eternal, but that the apostle means here a particular sin, and that he estimates it not by its length but by its weight, not by how long the party continues in it, but by how grievous the sin is in itself, will appear as we go along, partly by discovery of the reason of the title he puts upon it, and partly by discovery of the very sin itself that is here intended…</p></blockquote>

<blockquote><p>‘he shall ask,’ i.e. with confidence, as 1 John 5:14. But ‘there is a sin unto death,’ i.e… of such as have apostatized from a former specious profession into heresy and debauchery, and continue obstinate therein, against all methods of recovery; that are, as Jude 1:12, even twice dead, etc. ‘I do not say that he shall pray for it;’ i.e. I do not give that encouragement to pray for such, with that hope and expectation of success, as for others; though he does not simply forbid praying for them neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole, Annotations, on 1 John, ch. 5, verse 16. Poole died previous to completing his Annotations; Howe was the continuator for 1 John.</cite></span></figcaption>

</figure><figure class="quote" id="q-e8ce5f41fe" data-kw="">
<blockquote><p>But it may be said, when the apostle (1 Jn. 5:16) directs to pray for a brother whom we see sinning a sin that is not unto death, and adds, ‘there is a sin unto death, I do not say he shall pray for it,’ is it not implied that it may be known when one sins that sin unto death, not only to himself, but even to others too? I answer it is implied there may be too probable appearances of it, and much ground to suspect and fear it concerning some, in some cases; as when any against the highest evidence of the truth of the Christian religion, and that Jesus is the Christ or the Messiah… do notwithstanding, from that malice which blinds their understanding, persist in infidelity or apostatize and relapse into it from a former profession, there is great cause of suspicion lest such have sinned that sin unto death. Whereupon yet it is to be observed, he does not expresly forbid praying for the persons whose case we may doubt; only he does not enjoin it, as he does for others, but only says, ‘I do not say ye shall pray for it,’ i.e. that in his present direction to pray for others, he did not intend such, but another sort, for whom they might pray remotely from any such suspicion: viz. that he meant now such praying as ought to be interchanged between Christian friends that have reason in the main to be well persuaded concerning one another, in the mean time intending no opposition to what is elsewhere enjoined, the praying for all men, 1 Tim. 2:1, without the personal exclusion of any, as also our Lord Himself prayed indefinitely for his most malicious enemies, ‘Father forgive them they know not what they do,’ though He had formerly said there was such a sin as should never be forgiven, whereof ’tis highly probable some of them were guilty: yet such He does not expressly except; but his prayer being in the indefinite, not the universal form, ’tis to be supposed it must mean such as were within the compass and reach of prayer and capable of benefit by it. Nor does the apostle [John] here [in 1 Jn. 5] direct personally to exclude any, only that indefinitely and in the general such must be supposed [that it was] not meant [of those] as had sinned the sin unto death; or [they] must be conditionally excluded, if they had, without determining who had or had not. To which purpose it is very observable that a more abstract form of expression is used in this latter clause of this verse [1 Jn. 5:16]. For whereas in the former positive part of the direction, he enjoins praying for him, or them that had not sinned unto death (viz. concerning whom there was no ground for any such imagination or suspicion that they had). In the negative part, concerning such as might have sinned it, he does not say for him or them, but for “it” (i.e. concerning, or in reference to it), as if he had said the case in general only is to be excepted, and if persons are to be distinguished (since every sin is someone’s sin, the sin of some person or other), let God distinguish, but do not you: ’tis enough for you to except the sin committed by whomsoever. And though the former part of the verse speaks of a particular person: ‘If a man see his brother sin a sin that is not unto death,’ which is as determinate to a person as the sight of our eye can be, it does not follow the latter part must suppose a like particular determination of any person’s case, that he has sinned it. I may have great reason to be confident such and such have not, when I can only suspect that such a one has. And it is a thing much less unlikely to be certain to oneself [about] than another, for they that have sinned unto death are no doubt so blinded and stupified by it that they are not more apt or competent to observe themselves and consider their case than others may be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears wept over Lost Souls… (London: Astwood, 1684)</cite>, pp. 83-87</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But it may be said, when the apostle (1 Jn. 5:16) directs to pray for a brother whom we see sinning a sin that is not unto death, and adds, ‘there is a sin unto death, I do not say he shall pray for it,’ is it not implied that it may be known when one sins that sin unto death, not only to himself, but even to others too? I answer it is implied there may be too probable appearances of it, and much ground to suspect and fear it concerning some, in some cases; as when any against the highest evidence of the truth of the Christian religion, and that Jesus is the Christ or the Messiah… do notwithstanding, from that malice which blinds their understanding, persist in infidelity or apostatize and relapse into it from a former profession, there is great cause of suspicion lest such have sinned that sin unto death. Whereupon yet it is to be observed, he does not expresly forbid praying for the persons whose case we may doubt; only he does not enjoin it, as he does for others, but only says, ‘I do not say ye shall pray for it,’ i.e. that in his present direction to pray for others, he did not intend such, but another sort, for whom they might pray remotely from any such suspicion: viz. that he meant now such praying as ought to be interchanged between Christian friends that have reason in the main to be well persuaded concerning one another, in the mean time intending no opposition to what is elsewhere enjoined, the praying for all men, 1 Tim. 2:1, without the personal exclusion of any, as also our Lord Himself prayed indefinitely for his most malicious enemies, ‘Father forgive them they know not what they do,’ though He had formerly said there was such a sin as should never be forgiven, whereof ’tis highly probable some of them were guilty: yet such He does not expressly except; but his prayer being in the indefinite, not the universal form, ’tis to be supposed it must mean such as were within the compass and reach of prayer and capable of benefit by it. Nor does the apostle [John] here [in 1 Jn. 5] direct personally to exclude any, only that indefinitely and in the general such must be supposed [that it was] not meant [of those] as had sinned the sin unto death; or [they] must be conditionally excluded, if they had, without determining who had or had not. To which purpose it is very observable that a more abstract form of expression is used in this latter clause of this verse [1 Jn. 5:16]. For whereas in the former positive part of the direction, he enjoins praying for him, or them that had not sinned unto death (viz. concerning whom there was no ground for any such imagination or suspicion that they had). In the negative part, concerning such as might have sinned it, he does not say for him or them, but for “it” (i.e. concerning, or in reference to it), as if he had said the case in general only is to be excepted, and if persons are to be distinguished (since every sin is someone’s sin, the sin of some person or other), let God distinguish, but do not you: ’tis enough for you to except the sin committed by whomsoever. And though the former part of the verse speaks of a particular person: ‘If a man see his brother sin a sin that is not unto death,’ which is as determinate to a person as the sight of our eye can be, it does not follow the latter part must suppose a like particular determination of any person’s case, that he has sinned it. I may have great reason to be confident such and such have not, when I can only suspect that such a one has. And it is a thing much less unlikely to be certain to oneself [about] than another, for they that have sinned unto death are no doubt so blinded and stupified by it that they are not more apt or competent to observe themselves and consider their case than others may be.”

— John Howe, The Redeemer’s Tears wept over Lost Souls… (London: Astwood, 1684), pp. 83-87">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+it+may+be+said%2C+when+the+apostle+%281+Jn.+5%3A16%29+directs+to+pray+for+a+brother+whom+we+see+sinning+a+sin+that+is+not+unto+death%2C+and+adds%2C+%E2%80%98there+is+a+sin+unto+death%2C+I+do+not+say+he+shall+pray+for+it%2C%E2%80%99+is+it+not+implied+that+it+may+be+known+when+one+sins+that+sin+unto+death%2C+not+only+to+himself%2C+but+even+to+others+too%3F+I+answer+it+is+implied+there+may+be+too+probable+appearances+of+it%2C+and+much+ground+to+suspect+and+fear+it+concerning+some%2C+in+some+cases%3B+as+when+any+against+the+highest+evidence+of+the+truth+of+the+Christian+religion%2C+and+that+Jesus+is+the+Christ+or+the+Messiah%E2%80%A6+do+notwithstanding%2C+from+that+malice+which+blinds+their+understanding%2C+persist+in+infidelity+or+apostatize+and+relapse+into+it+from+a+former+profession%2C+there+is+great+cause+of+suspicion+lest+such+have+sinned+that+sin+unto+death.+Whereupon+yet+it+is+to+be+observed%2C+he+does+not+expresly+forbid+praying+for+the+persons+whose+case+we+may+doubt%3B+only+he+does+not+enjoin+it%2C+as+he+does+for+others%2C+but+only+says%2C+%E2%80%98I+do+not+say+ye+shall+pray+for+it%2C%E2%80%99+i.e.+that+in+his+present+direction+to+pray+for+others%2C+he+did+not+intend+such%2C+but+another+sort%2C+for+whom+they+might+pray+remotely+from+any+such+suspicion%3A+viz.+that+he+meant+now+such+praying+as+ought+to+be+interchanged+between+Christian+friends+that+have+reason+in+the+main+to+be+well+persuaded+concerning+one+another%2C+in+the+mean+time+intending+no+opposition+to+what+is+elsewhere+enjoined%2C+the+praying+for+all+men%2C+1+Tim.+2%3A1%2C+without+the+personal+exclusion+of+any%2C+as+also+our+Lord+Himself+prayed+indefinitely+for+his+most+malicious+enemies%2C+%E2%80%98Father+forgive+them+they+know+not+what+they+do%2C%E2%80%99+though+He+had+formerly+said+there+was+such+a+sin+as+should+never+be+forgiven%2C+whereof+%E2%80%99tis+highly+probable+some+of+them+were+guilty%3A+yet+such+He+does+not+expressly+except%3B+but+his+prayer+being+in+the+indefinite%2C+not+the+universal+form%2C+%E2%80%99tis+to+be+supposed+it+must+mean+such+as+were+within+the+compass+and+reach+of+prayer+and+capable+of+benefit+by+it.+Nor+does+the+apostle+%5BJohn%5D+here+%5Bin+1+Jn.+5%5D+direct+personally+to+exclude+any%2C+only+that+indefinitely+and+in+the+general+such+must+be+supposed+%5Bthat+it+was%5D+not+meant+%5Bof+those%5D+as+had+sinned+the+sin+unto+death%3B+or+%5Bthey%5D+must+be+conditionally+excluded%2C+if+they+had%2C+without+determining+who+had+or+had+not.+To+which+purpose+it+is+very+observable+that+a+more+abstract+form+of+expression+is+used+in+this+latter+clause+of+this+verse+%5B1+Jn.+5%3A16%5D.+For+whereas+in+the+former+positive+part+of+the+direction%2C+he+enjoins+praying+for+him%2C+or+them+that+had+not+sinned+unto+death+%28viz.+concerning+whom+there+was+no+ground+for+any+such+imagination+or+suspicion+that+they+had%29.+In+the+negative+part%2C+concerning+such+as+might+have+sinned+it%2C+he+does+not+say+for+him+or+them%2C+but+for+%E2%80%9Cit%E2%80%9D+%28i.e.+concerning%2C+or+in+reference+to+it%29%2C+as+if+he+had+said+the+case+in+general+only+is+to+be+excepted%2C+and+if+persons+are+to+be+distinguished+%28since+every+sin+is+someone%E2%80%99s+sin%2C+the+sin+of+some+person+or+other%29%2C+let+God+distinguish%2C+but+do+not+you%3A+%E2%80%99tis+enough+for+you+to+except+the+sin+committed+by+whomsoever.+And+though+the+former+part+of+the+verse+speaks+of+a+particular+person%3A+%E2%80%98If+a+man+see+his+brother+sin+a+sin+that+is+not+unto+death%2C%E2%80%99+which+is+as+determinate+to+a+person+as+the+sight+of+our+eye+can+be%2C+it+does+not+follow+the+latter+part+must+suppose+a+like+particular+determination+of+any+person%E2%80%99s+case%2C+that+he+has+sinned+it.+I+may+have+great+reason+to+be+confident+such+and+such+have+not%2C+when+I+can+only+suspect+that+such+a+one+has.+And+it+is+a+thing+much+less+unlikely+to+be+certain+to+oneself+%5Babout%5D+than+another%2C+for+they+that+have+sinned+unto+death+are+no+doubt+so+blinded+and+stupified+by+it+that+they+are+not+more+apt+or+competent+to+observe+themselves+and+consider+their+case+than+others+may+be.%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+The+Redeemer%E2%80%99s+Tears+wept+over+Lost+Souls%E2%80%A6+%28London%3A+Astwood%2C+1684%29%2C+pp.+83-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8ce5f41fe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8ce5f41fe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=But%20it%20may%20be%20said%2C%20when,their%20case%20than%20others%20may%20be&amp;text=But%20it%20may%20be%20said%2C%20when%20the%20apostle&amp;text=and%20consider%20their%20case%20than%20others%20may%20be" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(7.) In reference to God as the governor of the world and to his justice in the administration of his government, sins are distinguished into those which call for vengeance from God even in the present life, and into those which God in the exercise of his long-suffering bears, and which he does not punish except in the life to come. The former are so heinous in their character that He cannot extend towards them his forbearance in this world. And hence they are called clamant or crying sins because they as it were call alone for the infliction of the divine vengeance. Some of these are recorded in Scripture. The blood of Abel is represented as crying unto God from the ground, Gen. 4:10. So is th sin of Sodom and Gomorrah, Gen. 18:20-21; the oppression by the Egyptians of the children of Israel, Ex. 3:9; the covetousness of the Chaldeans, Hab. 2:11; and the fraud of those who kept back the hire of their laborers, James 5:4. Among these crying sins may be ranked also those which are committed insolently in the face of a well-known law, and which God will not forgive,Num. 15:30. To the same class belongs that sin which an apostle calls ‘a sin unto death,’ (1 Jn. 5:16). This seems to be plain from the context in which he does not desire us to pray for the forgiveness of such a sin in this life, seeing that God is wont to make a signal display of his vengeance against it even here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-venema.html">Herman Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 30, sect. 7</cite>, p. 505</span></figcaption>

<blockquote><p>Reformers, however, rejected the distinction as incompatible with the Word of God. They did not deny that there are degrees of sin, and while they continued to employ the terms ‘mortal’ and ‘venial sins,’ they attached a different meaning to them. Lutherans to some extent had to take over this distinction, as much as believers could commit some sins without losing the grace of God and [commit] others that cost them that grace. But the Reformed went further and wanted nothing to do with the whole distinction. If they did at times still use the words, they meant by them that all sins, except the sin of blaspheming the Holy Spirit, can be forgiven and are actually forgiven to believers, but that they are all inherently deserving of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 3 (Baker Academic), part 1, ch. 3, ‘The Nature of Sin’, p. 153 Bavinck’s summary lacks significant qualification, as is seen by the rest of the material on this webpage.</cite></span></figcaption>

 Online</a></div>

<blockquote><p>For in every little transgression of the divinely commanded law, God’s authority is set aside… [S]ince God has explained his will in the Law, every thing contrary to the Law is displeasing to Him. Will they feign that the wrath of God is so disarmed that the punishment of death will not forthwith follow upon it? He has declared … “The soul that sinneth it shall die,” (Ezek. 18:20). Again, in the passage lately quoted, “The wages of sin is death.”… [L]et the children of God remember that all sin is mortal, because it is rebellion against the will of God, and necessarily provokes his anger; and because it is a violation of the Law, against every violation of which, without exception, the judgment of God has been pronounced. The faults of the saints are indeed venial, not, however, in their own nature, but because, through the mercy of God, they obtain pardon.</p></blockquote>

<blockquote><p>Forsomuch then as it appears by most substantial reasons that the corrupt lusts which remain in us after baptism are sins; now it rests that we see unto what kind or part of sins they belong. Sin may seem thus to be divided: that there is one thing, which may be forgiven, and another thing, which cannot. Transgression against the law of God, which is never forgiven, is sin against the Holy Ghost. But if sin may be forgiven, that may be two manner of ways: for either it is so forgiven as we must of necessity altogether depart from it; which we see come to pass in sore and grievous sins, which Paul says do separate us from the kingdom of God, and commonly be called mortal: and those be called small or venial sins, without the which man’s life cannot here be led. [Note in margin: 1 Cor. 6:9, or else be so forgiven, as we depart not from them; partly, through ignorance engrafted in us, and partly, by reason of the infirmity, wherewith we be infected.] [Note in margin: Lust and the first motions motions unto evil, be in their own nature mortal] Paul has put a notable difference between these sins, when he exhorts us that we should not suffer sin to reign in us. (Rom. 6:1) And of this third kind of sins the apostle complained, when he said, ‘O unhappy man that I am! Who shall deliver me from the body of this death? (Rom. 7:24)’ And of these sins do we mean, when we teach, that the works of men, notwithstanding they be godly men, be not without deadly sins; for that we do nothing without this kind of defects. And such kind of defects be deadly, because in their own nature they deserve death: for the reward of sin is death. Further also, for that so long as we carry about with us these blemishes of corruption, we cannot enjoy the life eternal: for so long are we excluded from it, until by death we have put off all corruption. Moreover, it is written; ‘Cursed be every one, which abides not in all the things which are written in the words of this law.’ And he which complains with Paul, that he does not the good which he would, does not perform all the things, which the law requires, nor is not utterly without curse: though the same, through the mercy of God, be not imputed unto him unto eternal destruction. [Note in margin: By the mercy of God they be not imputed to damnation]</p></blockquote>

</figure><figure class="quote" id="q-f4bd004173" data-kw="">
<blockquote><p>If we say we have no sin, we deceive ourselves, and the truth is not in us.” “It is no more I that do it, but sin that dwelleth in me.” “There is no condemnation to them that are in Christ Jesus, who walk after the Spirit.” “Who can understand his errors? Cleanse thou me from secret faults.” (1 John 1:8. Rom. 7:18; 8:1. Ps. 19:13.) The common distinction of sin into mortal and venial may be referred to this division. For although every sin in its own nature is mortal, by which we mean, that it deserves eternal death, yet reigning sin may be properly so called, inasmuch as he who perseveres in it will at length be overtaken by destruction. But it becomes venial sin that is, it does not call for eternal death, when it does not reign in the regenerate who resist it by the grace of God; and this takes place, not because it merits pardon in itself, or does not deserve punishment, but because it is freely forgiven those that believe on account of the satisfaction of Christ, and is not imputed to them unto condemnation, as it is said: “There is no condemnation to them that are in Christ Jesus.” (Rom. 8:1) When thus understood, the distinction of mortal and venial sin may be retained; but not when it is understood in the sense in which the Romish priests use it, as if that were mortal sin which deserves eternal death on account of its greatness, and that venial which does not deserve eternal death on account of its smallness, but merely some temporal punishment. Hence we would prefer, in the place of mortal and venial sin, the distinction which we have made of sin into reigning, and not reigning, and that for the following reasons: 1. Because the terms mortal and venial are ambiguous and obscure. All sins are mortal in their own nature. The apostle John also calls the sin against the Holy Ghost mortal, or unto death. 2. Because the Scriptures do not use these terms, especially venial sin. 3. Because of the errors of the Papists, who call those sins venial which are small and do not deserve eternal death, whilst the Scriptures declare: “Cursed be he that confirmeth not all the words of this law to do them.” “Whosoever shall offend in one point, is guilty of all.” “The wages of sin is death.” “Whoso shall break one of these commandments, and shall teach men so, he shall be called the least in the kingdom of God.” (Deut. 27:26; James 2:10; Rom. 6:23; Matt. 5:19) In a word, every sin in its own nature is mortal, and deserves eternal death. But it becomes venial, that is, it does not work eternal death in the regenerate, because their sins have been freely pardoned for the sake of Christ.</p></blockquote>

<blockquote><p>2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10. 3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ.</p></blockquote>

<blockquote><p>Whether the distinction of sin into mortal and venial is able to be tolerated? This distinction is inept. Indeed, all sins merit eternal death; and if it may happen to be remitted, the sins of all the regenerate are of the sort that that is not from the nature of the sin, but out of the grace of God whereby we are embraced in Christ.</p></blockquote>

<blockquote><p>XII. Sin is divided in multiple ways. One kind is the sin of angels, in the heavens; another is the sin of men, on earth. 1 John 3:8 “He who commits sin is of the devil, for the devil has sinned from the beginning.” Of human sin, some is the first or originating from the first: this is either original sin or actual sin. Actual sin is either of omission or commission: the former is against affirmative precepts, which we neglect; the latter is against negative precepts and prohibitions, which by sinning we contravene and oppose. Hence those sins are distinguished by the nature of the precepts, not as different species of sin, but as singular modes. In the one case we do not perform what we ought; in the other, we commit what we ought not. The former is noted in Matthew 25:42 “I was hungry and you gave me no food” and verse 27 “You ought to have invested my money with the bankers.” 1 Samuel 3:13 “He did not rebuke them” – namely Eli did not rebuke his sons. But his sons were committing unspeakable acts of debauchery, chapter 2 verses 22-23. Thus some sinned by omission, and others by commission. XIII. Omission is either of the whole act that ought to have been performed, or of the proper mode in the action: as when you either completely omit a duty like prayer or the like; or do not pray in the way that is fitting. We commit this kind of sin everywhere, even in our best works, in which we never fail to fall short in the required mode of acting, according to Luther’s well-known and very true saying: “The righteous person sins in every good work” – not in the material of the work itself, but in its form; not in reality, but in the mode of acting, the mind, and the end – in which respects we always fall short of the perfection which the law demands from every aspect. XIV. By reason of the subject, sin is distinguished such that some takes place in the soul, while other sin also involves the body: for what is sinned with the body involves the soul too, but not vice versa; for one can sin solely with the soul, without outwardly manifesting anything with the body. “Let us cleanse ourselves from every defilement of body and spirit.” 2 Corinthians 7:1. Bodily sin is perfected through words or deeds. Hence sin is customarily distinguished into that of the heart, the mouth, and the deed; or what is lusted for, said, or done against the law. Matthew 15:19 “For out of the heart come evil thoughts, murder, adultery, fornication, theft, false witness, slander.”</p></blockquote>

<blockquote><p>III. Are there certain sins that are venial by their own nature? No.</p></blockquote>

<blockquote><p>V. (3) The question is not whether a distinction relative to the administration of divine providence in the covenant of grace in punishing the sins of believers can be admitted; whether certain sins in believers can be called mortal because they are grievous and atrocious, which more deeply wound and injure conscience, hinder the act of justifying faith and take away present fitness for the kingdom of heaven (upon which therefore he denounces wrath and indignation; yea, threatens exclusion from the kingdom of heaven and eternal death, like those treated of in 1 Cor, 6:10 and Col. 3:5); whether others, however, may be called venial, which are lighter and of daily commission, not hindering the rule and operation of grace, nor taking away the sense of God’s favor or the confidence of the pardon of sin (such as the rebellious motions of concupiscence, of which Paul complains in Rom. 7–defects and blemishes adhering even to the best works of the renewed). There are some of our party who think the distinction of mortal and venial sin can be retained in this sense, as Robert Baron, following the theologians of Great Britain, in his Judicio de Perseverantia, although it does not seem sufficiently appropriate on account of our opponents; the distinction of heavy and light sins is better. The question simply concerns the nature of sins in themselves according to the strictness of the law. We think all are mortal, none truly venial.</p></blockquote>

<blockquote><p>3. Is there sin that by its own nature does not merit eternal death, or that is venial? XXII. It is asked, third, whether there is sin that by its own nature does not deserve eternal death, or that is venial. The papists, so that they may more effectively run to the help of their purgatory, their indulgences, from which so much is added to their storeroom, and consequently to the dominion of the pope, state that there is venial sin that is beside the law, not contrary to the law, which accordingly does not merit by its own nature eternal death, but only temporal and bodily punishments. The Reformed on the contrary deny that there is any such venial sin, because: (1) God expressly pronounces him cursed who does not continue in all things which are written in the book of the law, to do them (Deut. 27:26; Gal. 3:10). (2) From the thought of James, he who has impinged in one point is guilty of the entire violated law ( James 2:10). (3) Every sin, however trivial it seems, impinges upon the infinite majesty of God, and by its own nature tries as if to cast down God from his own throne. (4) It is said that the wages of all sin altogether is death (Rom. 6:23), and that the one who loosens even one of the least of the commandments, shall be least, that is, not present, in the kingdom of heaven (Matt. 5:19). Objections However, what they object: (1) from Matthew 5:19, “He who is angry with his brother without a cause shall be bound to judgment, whoever shall say ‘Raca’ shall bound to judgment, he who shall say, ‘You fool,’ shall be bound to the Gehenna of fire,” from the style of the Hebrews, taken from tribunals, argues for nothing but that there are diverse degrees of punishments, just as of sins, and not that there are some sins that by their own nature do not deserve eternal punishment. Nor (2) does the Savior’s comparison between the mote and the beam (Matt. 7:3–5) make for any other conclusion than that there are diverse degrees of sins and punishments. Just as also (3) wood, hay, and stubble (1 Cor. 3:12) do not intend so much a comparison of sins as the difference between erroneous dogmas and heretical dogmas, nor in addition do they extend further than to diverse degrees of sins. Nor also (4) in James 1:15 is concupiscence absolved from death, but it is also told of as its cause. Furthermore, (5) in 1 John 5:16 there is indeed taught a sin that does not lead to death, such as is the blasphemy against the Holy Spirit, but there is not by that fact taught a venial sin which by its own nature would not deserve eternal death. And although (6) every offense between men does not take away friendship, yet the same thing must not be immediately said with respect to God, since we are obliged more solemnly by far to God, than is any man to man. I need not add that man properly does not sin against man, nor in that respect does punishing justice properly have a place here.</p></blockquote>

iverse degrees of sins and punishments. Just as also (3) wood, hay, and stubble (1 Cor. 3:12) do not intend so much a comparison of sins as the difference between erroneous dogmas and heretical dogmas, nor in addition do they extend further than to diverse degrees of sins. Nor also (4) in James 1:15 is concupiscence absolved from death, but it is also told of as its cause. Furthermore, (5) in 1 John 5:16 there is indeed taught a sin that does not lead to death, such as is the blasphemy against the Holy Spirit, but there is not by that fact taught a venial sin which by its own nature would not deserve eternal death. And although (6) every offense between men does not take away friendship, yet the same thing must not be immediately said with respect to God, since we are obliged more solemnly by far to God, than is any man to man. I need not add that man properly does not sin against man, nor in that respect does punishing justice properly have a place here.”

— Petrus van Mastricht, Theoretical-Practical Theology (RHB), vol. 3, bk. 4, ch. 3, section XXII">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Is+there+sin+that+by+its+own+nature+does+not+merit+eternal+death%2C+or+that+is+venial%3F+XXII.+It+is+asked%2C+third%2C+whether+there+is+sin+that+by+its+own+nature+does+not+deserve+eternal+death%2C+or+that+is+venial.+The+papists%2C+so+that+they+may+more+effectively+run+to+the+help+of+their+purgatory%2C+their+indulgences%2C+from+which+so+much+is+added+to+their+storeroom%2C+and+consequently+to+the+dominion+of+the+pope%2C+state+that+there+is+venial+sin+that+is+beside+the+law%2C+not+contrary+to+the+law%2C+which+accordingly+does+not+merit+by+its+own+nature+eternal+death%2C+but+only+temporal+and+bodily+punishments.+The+Reformed+on+the+contrary+deny+that+there+is+any+such+venial+sin%2C+because%3A+%281%29+God+expressly+pronounces+him+cursed+who+does+not+continue+in+all+things+which+are+written+in+the+book+of+the+law%2C+to+do+them+%28Deut.+27%3A26%3B+Gal.+3%3A10%29.+%282%29+From+the+thought+of+James%2C+he+who+has+impinged+in+one+point+is+guilty+of+the+entire+violated+law+%28+James+2%3A10%29.+%283%29+Every+sin%2C+however+trivial+it+seems%2C+impinges+upon+the+infinite+majesty+of+God%2C+and+by+its+own+nature+tries+as+if+to+cast+down+God+from+his+own+throne.+%284%29+It+is+said+that+the+wages+of+all+sin+altogether+is+death+%28Rom.+6%3A23%29%2C+and+that+the+one+who+loosens+even+one+of+the+least+of+the+commandments%2C+shall+be+least%2C+that+is%2C+not+present%2C+in+the+king%02dom+of+heaven+%28Matt.+5%3A19%29.+Objections+However%2C+what+they+object%3A+%281%29+from+Matthew+5%3A19%2C+%E2%80%9CHe+who+is+angry+with+his+brother+without+a+cause+shall+be+bound+to+judgment%2C+whoever+shall+say+%E2%80%98Raca%E2%80%99+shall+bound+to+judgment%2C+he+who+shall+say%2C+%E2%80%98You+fool%2C%E2%80%99+shall+be+bound+to+the+Gehenna+of+fire%2C%E2%80%9D+from+the+style+of+the+Hebrews%2C+taken+from+tribunals%2C+argues+for+nothing+but+that+there+are+diverse+degrees+of+punishments%2C+just+as+of+sins%2C+and+not+that+there+are+some+sins+that+by+their+own+nature+do+not+deserve+eternal+punishment.+Nor+%282%29+does+the+Savior%E2%80%99s+comparison+between+the+mote+and+the+beam+%28Matt.+7%3A3%E2%80%935%29+make+for+any+other+conclusion+than+that+there+are+diverse+degrees+of+sins+and+punishments.+Just+as+also+%283%29+wood%2C+hay%2C+and+stubble+%281+Cor.+3%3A12%29+do+not+intend+so+much+a+comparison+of+sins+as+the+difference+between+erroneous+dogmas+and+heretical+dogmas%2C+nor+in+addition+do+they+extend+further+than+to+diverse+degrees+of+sins.+Nor+also+%284%29+in+James+1%3A15+is+concupiscence+absolved+from+death%2C+but+it+is+also+told+of+as+its+cause.+Furthermore%2C+%285%29+in+1+John+5%3A16+there+is+indeed+taught+a+sin+that+does+not+lead+to+death%2C+such+as+is+the+blasphemy+against+the+Holy+Spirit%2C+but+there+is+not+by+that+fact+taught+a+venial+sin+which+by+its+own+nature+would+not+deserve+eternal+death.+And+although+%286%29+every+offense+between+men+does+not+take+away+friendship%2C+yet+the+same+thing+must+not+be+immediately+said+with+respect+to+God%2C+since+we+are+obliged+more+solemnly+by+far+to+God%2C+than+is+any+man+to+man.+I+need+not+add+that+man+properly+does+not+sin+against+man%2C+nor+in+that+respect+does+punishing+justice+properly+have+a+place+here.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology+%28RHB%29%2C+vol.+3%2C+bk.+4%2C+ch.+3%2C+section+XXII&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F171ec21ad1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/171ec21ad1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-distinction-of-venial-mortal-sin/#:~:text=3.%20Is%20there%20sin%20that%20by,justice%20properly%20have%20a%20place%20here&amp;text=3.%20Is%20there%20sin%20that%20by%20its%20own&amp;text=does%20punishing%20justice%20properly%20have%20a%20place%20here" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-252998dfd2" data-kw="">
<blockquote><p>I note in passing that he [a Jesuit] everywhere mentions mortal sin, from the prejudice [meaning] of the Papal distinction, so that he may odiously propose our [Reformed] things as if the sense were that we reckon all, even the lightest movements of concupiscence, among those sins which the Papists call ‘mortal’, and it would make no difference whether someone is tickled by some lust without consent or commits adultery: of which calumny it suffices to remember once, and to admonish, that we indeed acknowledge no sin that is not mortal by its nature: but we distinguish degrees among sins, as we have said in its place.</p></blockquote>

<blockquote><p>Whoever commits even the smallest sins is guilty of all; and whoever commits some other greater and more vituperative, is also guilty of all. One is to a greater extent and the other to a lesser extent; but both are guilty of all, so that in the diversity of sins one need only ask about the more and the less.</p></blockquote>

<blockquote><p>The doctrine of the equality of sins, however, the Stoics alone dared to maintain in opposition to the unanimous sentiments of mankind: an absurd tenet, which in writing against Jovinianus you have most clearly refuted from the Holy Scriptures. In that most delightful and noble dissertation you have made it abundantly plain that it has not been the doctrine of our authors, or rather of the Truth Himself, who has spoken through them, that all sins are equal.</p></blockquote>

</figure><figure class="quote" id="q-7cacec2ae2" data-kw="">
<blockquote><p>Despite that we must we differ with some biased interpretations of this work, it is a unique and greatly erudite work that offers a great quantity of Augustinian sources and exhaustive analysis from the Latin. This work will lead the Reformed Christian to question why it has been taken for granted that Augustine upholds the distinction between mortal and venial sin in the Romanist way. It will also lead to a reflection upon the few secondary sources, Romanist, Lutheran and Reformed, that present an exhaustive study of their distinction and terminology. In fact, perhaps this work from year 1952 is the only one that exhaustively face the topic in Augustine. At the beginning of this work, the methodology with which the author approaches this academic study is presented and an introductory treatment of the predecessors of the pre-Augustinian distinction is made, where they consider themselves fathers, like Saint Cyprian of Carthage. Then, although the author recognizes that Augustine did not use the term peccatum mortale, he addresses the question of deadly sins as mortal sin and speaks of the examples in his works, their nature and consequence. Then he talks about the inevitability of sin and the weakness of human nature. And finally, he talks about the examples, nature and consequences of daily sins in Augustine. The author mentions it as venial sin, but recognizes that venialia was used in an ordinary way by Augustine to refer to both mortifying and daily sins. It is interesting that throughout the book it is extremely noticeable the difference of emphasis and attitude of Saint Augustine with the points of view of medieval theologians, of the counter-reform and current ones on this distinction, especially when speaking of venial sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/eugene-francis-durkin.html">Eugene Francis Durkin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Theological Distinction of Sins in the Writings of St Augustine (St. Mary of the Lake Seminary, 1952) 161 pp. This work is not easy to find. | A review by Andrés E. Garcia G. of AugustinismoProtestante.com</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/concupiscence.html">Concupiscence</a></span></div>
<div class="actions"><button class="copy" data-copy="“Despite that we must we differ with some biased interpretations of this work, it is a unique and greatly erudite work that offers a great quantity of Augustinian sources and exhaustive analysis from the Latin. This work will lead the Reformed Christian to question why it has been taken for granted that Augustine upholds the distinction between mortal and venial sin in the Romanist way. It will also lead to a reflection upon the few secondary sources, Romanist, Lutheran and Reformed, that present an exhaustive study of their distinction and terminology. In fact, perhaps this work from year 1952 is the only one that exhaustively face the topic in Augustine. At the beginning of this work, the methodology with which the author approaches this academic study is presented and an introductory treatment of the predecessors of the pre-Augustinian distinction is made, where they consider themselves fathers, like Saint Cyprian of Carthage. Then, although the author recognizes that Augustine did not use the term peccatum mortale, he addresses the question of deadly sins as mortal sin and speaks of the examples in his works, their nature and consequence. Then he talks about the inevitability of sin and the weakness of human nature. And finally, he talks about the examples, nature and consequences of daily sins in Augustine. The author mentions it as venial sin, but recognizes that venialia was used in an ordinary way by Augustine to refer to both mortifying and daily sins. It is interesting that throughout the book it is extremely noticeable the difference of emphasis and attitude of Saint Augustine with the points of view of medieval theologians, of the counter-reform and current ones on this distinction, especially when speaking of venial sins.”

<blockquote><p>…original sin consists in this, that it opposes the same law as to the inclination or habitude. Consequently this inbred propensity or habit of inordinate concupiscence, which makes man prone to transgress the law of God, is Original Sin. …he who has within him a defect, habit, or propensity contrary to the law of original creation is infected by Original Sin… …we must understand that the word concupiscence sometimes denotes the mere faculty of desire… we grant that it is a good creature of God. Sometimes it denotes the contagion or unruly tendency, which has infected the faculty itself; and this disorder, we say, is formally repugnant to that rectitude which God has impressed upon the same faculty…. …the corrupt disposition, which inclines internally to actual sin, is most properly Original Sin. …so although the faculty of desire itself is not sin, yet the inclination and propensity of it to evil is sin; even in one asleep, when it does not at all actually incline to sin.</p></blockquote>

<blockquote><p>And this also lies in it as it is enmity, that every part and parcel of it, if we may so speak, the least degree of it that can possibly remain in any one, whilst and where there is any thing of its nature, is enmity still. It may not be so effectual and powerful in operation as where it has more life and vigor, but it is enmity still. As every drop of poison is poison, and will infect, and every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, — it is enmity, it will poison, it will burn. That which is any thing in the abstract is still so whilst it has any being at all. Our apostle, who may well be supposed to have made as great a progress in the subduing of it as any one on the earth, yet after all cries out for deliverance, as from an irreconcilable enemy, Rom. 7:24. The meanest acting, the meanest and most imperceptible working of it, is the acting and working of enmity. Mortification abates of its force, but does not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.</p></blockquote>

<blockquote><p>5. Was original righteousness natural to man? The opinion of the papists XLIV. It is asked, fifth, whether original righteousness was natural to man. The Pelagianizing papists—so that they may obtain: (1) that concupiscence, whose second acts only does original righteousness control, and whose first act it does not take away, is not itself sin, and accordingly, if it does not stand in the way, man can be perfect here and now; (2) that man was created in purely natural things, that is, by nature, neither just nor unjust; (3) that the natural things of man survived whole after the fall—admit indeed an original righteousness, but one that is supernatural to man, added to nature, so that it may check the natural discord of the flesh and spirit. Meanwhile, they do not deny that it arose with man, and that it would have helped him even in natural things. And the opinion of the Reformed with their reasons The Reformed, although they do not acknowledge that original righteousness (as Flacius [a radical Lutheran] desired) is the very nature of man, yet do acknowledge that it is natural to man, insofar as it was owed to his integral nature in such a way that it could not be morally whole without it. For if (1) it were supernatural, then its opposite, that is, carnal concupiscence or the discord of flesh and spirit, would be natural to man, and thus good and from God, which is contrary to the Scriptures (Rom. 7:7–8; 1 John 2:16). (2) Thus the rebellion of the flesh against the spirit would be natural to man, without any previous demerit, by the condition of nature that was conferred by God, and accordingly, God would be the author of sin. Then (3) blessedness was the natural end of man, and accordingly, so also was righteousness and holiness, without which he could not have achieved blessedness (Rev. 21:27; 1 Cor. 15:50). Objections The arguments of the papists for the most part coincide with the Socinian arguments against original righteousness. For they allege: (1) that there is a natural contrariety of flesh and spirit, of body and soul, and thus original righteousness was not natural. I respond, We previously denied against the Socinians that this obtained in the state of integrity, where a most perfect harmony thrived until the point of sin. (2) That the gifts conferred upon the first man are called honor and glory (Ps. 8:5), which without a doubt are extrinsic and accessory to man, not natural. I respond: (a) The psalmist calls “honor and glory” not only original righteousness, but also the rule of man over the earthly creatures. Then also (b) in a sound sense, original righteousness is honor and glory (Rom. 3:23), insofar as it is the foundation of all honor and glory, and in that sense it was not something extrinsic to man, but something especially intrinsic. Bellarmine has certain other arguments (vol. 4, bk. 1), but they are of no significance; if anyone desires to know more, he may consult his antagonists: Ames, Pareus, and others.85 85. Bellarmine, De controversiis Christianae Fidei in Opera Omnia (Paris: L. Vivès, 1870–91), 5:169–213; William Ames, Bellarminus Enervatus, 4 vols. (Amsterdam: Joannes Janssonius, 1628–29), 4: 5–12; e.g. David Pareus, Quaestiones controversae theologicae…adversus Bellarminum (Schönfeld, 1612); idem, Rob. Bellarmini de justificatione impii libri explicati et castigati studio Davidis Parei (Heidelberg: Jonah Rosa, 1615).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 3</cite>, bk. 3, ch. 9, section 44</span></figcaption>

<blockquote><p>2. Are the primary-first motions of concupiscence sins? XXI. It is asked, second, whether actual concupiscence toward evil, with respect to its primary-first motion, is sin… The papists, so that they may keep safe the idea of a perfection of every sort in man, at least in the regenerate, since they observe that the primary-first motions obtain even in the most holy persons, conclude that they are not sins, because they are devoid of all consent of the will, that the secondary-first motions are only venial sins, because they lack the full consent of the will, and moreover that only the second motions are mortal sins, because they are perpetrated with full consent. In this sense Bellarmine (vol. 4, bk. 5, “On Sin,” ch. 5–7) upholds that concupiscence, in itself and from its own nature, the sort that is found even in the baptized and justified, is not properly sin. The Reformed on the contrary state that all the acts of concupiscence, even the primary-first, are sins, because the contrary opinion is: (1) contrary to the express words of the apostle (Rom. 7:7); (2) contrary to the express demand of the law (Ex. 20:17); (3) contrary to the force and strictness of the law, which under the penalty of an eternal curse demands the most exact obedience (Matt. 22:37; Deut. 27:26; Gal. 3:10), and therefore condemns all concupiscence. Finally, (4) it is also the cause of all sin (James 1:14–15). Therefore it is sin, for nothing is the cause of sin that does not sin, since the causation of sin, if it is permitted to speak this way, is a transgression of the law. Objections Accordingly, it is not valid to say: (1) it begets sin, therefore it is not sin. For a man, because he begets a man, does not cease to be a man; indeed, as we have said, it is sin by the very fact that it begets sin. And (2) that there is said to be no condemnation (κατάκριμα) in those who are in Christ Jesus (Rom. 8:1) does not argue that there is nothing in them that is condemnable, or sin, but that there is no actual condemnation, as its guilt has been transferred to Christ. Furthermore, (3) that in baptism concupiscence is taken away, as sin. I respond, It is taken away with respect to guilt and dominion… not with respect to its existence.</p></blockquote>

<blockquote><p>Secondly, God put into the soul these faculties, understanding, will, sense and appetite, which are naturally carried to things that are obvious and known, and not to things that are unknown and far removed. … Fifthly, God has put into every man, for his own preservation, a love of himself, which love is naturally good; but does then begin to be morally good, when it does accord[ing] to and help forward the love of God.</p></blockquote>

<blockquote><p>The Jesuit, whose aim is to involve everything, almost never distinguishes, nor explains ambiguous terms, which is nevertheless necessary for him who wishes to proceed in right order in teaching, or disputing. The name of concupiscence here does not signify that natural faculty of desiring as such, or the concupiscible power, as they call it, implanted in the soul by God Himself, to whom injury would be done, if it in itself and as such, were considered a vice, since He is the author of all the faculties and powers of the soul, which pertain to the constitution of nature, apart from the reason of corruption which has been added. Nor also under the name of vicious concupiscence do we understand all the movements and actions of that power [of concupiscence simply], because many are in themselves considered, or in their own kind, good; many indifferent: nor do we deny that that faculty of desiring goods, even sensible ones, was in Adam, in the state of innocence. It is also certain that we are not dealing with spiritual concupiscence, which the apostle mentions saying, “the Spirit desires against the flesh.” For natural concupiscence, when it is carried to the due object and in the due manner, is from God, much more spiritual, which tends to heavenly things. The question is therefore about concupiscence which the Spirit of God calls carnal, indeed flesh [e.g. in Rom. 8].</p></blockquote>

— André Rivet, The Orthodox Catholic Opposite the Papist Catholic (1630), Question 14, ‘On Concupiscence’, pp. 2-3 trans. AI">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Jesuit%2C+whose+aim+is+to+involve+everything%2C+almost+never+distinguishes%2C+nor+explains+ambiguous+terms%2C+which+is+nevertheless+necessary+for+him+who+wishes+to+proceed+in+right+order+in+teaching%2C+or+disputing.+The+name+of+concupiscence+here+does+not+signify+that+natural+faculty+of+desiring+as+such%2C+or+the+concupiscible+power%2C+as+they+call+it%2C+implanted+in+the+soul+by+God+Himself%2C+to+whom+injury+would+be+done%2C+if+it+in+itself+and+as+such%2C+were+considered+a+vice%2C+since+He+is+the+author+of+all+the+faculties+and+powers+of+the+soul%2C+which+pertain+to+the+constitution+of+nature%2C+apart+from+the+reason+of+corruption+which+has+been+added.+Nor+also+under+the+name+of+vicious+concupiscence+do+we+understand+all+the+movements+and+actions+of+that+power+%5Bof+concupiscence+simply%5D%2C+because+many+are+in+themselves+considered%2C+or+in+their+own+kind%2C+good%3B+many+indifferent%3A+nor+do+we+deny+that+that+faculty+of+desiring+goods%2C+even+sensible+ones%2C+was+in+Adam%2C+in+the+state+of+innocence.+It+is+also+certain+that+we+are+not+dealing+with+spiritual+concupiscence%2C+which+the+apostle+mentions+saying%2C+%E2%80%9Cthe+Spirit+desires+against+the+flesh.%E2%80%9D+For+natural+concupiscence%2C+when+it+is+carried+to+the+due+object+and+in+the+due+manner%2C+is+from+God%2C+much+more+spiritual%2C+which+tends+to+heavenly+things.+The+question+is+therefore+about+concupiscence+which+the+Spirit+of+God+calls+carnal%2C+indeed+flesh+%5Be.g.+in+Rom.+8%5D.%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+The+Orthodox+Catholic+Opposite+the+Papist+Catholic+%281630%29%2C+Question+14%2C+%E2%80%98On+Concupiscence%E2%80%99%2C+pp.+2-3+trans.+AI&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc3bb131b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc3bb131b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=The%20Jesuit%2C%20whose%20aim%20is%20to,indeed%20flesh%20%5Be.g.%20in%20Rom.%208&amp;text=The%20Jesuit%2C%20whose%20aim%20is%20to%20involve%20everything&amp;text=calls%20carnal%2C%20indeed%20flesh%20%5Be.g.%20in%20Rom.%208" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Here, however, it should be noted that not all concupiscence is sin; for there is also another concupiscence, a spiritual one, namely when the Spirit desires against the flesh; and a natural one, when a person desires to eat, drink, sleep, etc., neither of which can certainly be numbered among sins.</p></blockquote>

<blockquote><p>201. There is in the very essence of the natural power or faculty, besides the vis vel virtus agendi [power or virtue of acting], a certain natural inclination to some things, which is inseparable from it, from which the [Medieval] Schoolmen say even of the will that it is quaedam natura, et pondus animae [a certain nature and gravitation of the soul]. So the soul is inclined or propense (and not only able) to activity as such, to intellection as such, to volition as such; and objectively to truth as such, and to natural good and felicity as such. And there is an inclination of the soul, which is not essential and inseparable, but is much under the power of the will, and may be got and lost.</p></blockquote>

<blockquote><p>§40. The effects [of original sin] are either moral or physical evils. To the former is to be referred: 1. Concupiscence, not that natural and innate faculty by which, for our ordinate conservation, we desire necessary things like food, drink, sleep, etc.—for this was instilled in man by God—but the pravitious concupiscence derived into posterity through the fall, otherwise called the concupiscence of the flesh (Eph. 2:3; 1 Jn. 2:16; Gen. 8:21), which by its inordinate movements irritates man to evils, and is the cause, fuel, and fodder of sin and of all vices and outrages…</p></blockquote>

</figure><figure class="quote" id="q-8f24577347" data-kw="">
<blockquote><p>If a people trusting in the goodness of their prince, enslave themselves to him, and he shall after turn tyrant; a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium: Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and therefore the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and therefore, when the contract is made for the utility of the one party [only], the law says their place is for after wits, that men may change their mind, and resume their liberty…</p></blockquote>

</figure><figure class="quote" id="q-83c0e1cb6b" data-kw="">
<blockquote><p>1. Because in a question of law all ignorance is moral and culpably evil to any who undertakes actions upon conscience of obedience to others; for to all within the visible Church the Word of God is exactly perfect for faith and manners, and everyone is obliged to know all conclusions of law that are determinable by God’s Word. 2. Every one in his actions is to do out of a plerophory, and a full persuasion, of heart, that what he does pleases God, Rom. 14:14, ‘I know and am persuaded by the Lord Jesus that nothing is unclean of itself.’ 3. We are to do nothing but what is lawful and what in our consciences we are persuaded is lawful, and are to know what is sin and what is no sin… because every one is obliged to know morally what concerns his conscience, that he be not guilty before God…</p></blockquote>

</figure><figure class="quote" id="q-dfac016fde" data-kw="">
<blockquote><p>That a man should duly, and as he ought, believe, and receive the decision of a synod, it must be both true and he must believe and know that it is true; but [on the other hand,] that it may oblige him and does oblige him, whether his conscience be erroneous, or no[t], is as true, for then this Commandment, ‘Thou shalt not kill’, ‘Honor thy father and thy mother’, should lay no obligation on a man that believes it is service to God to kill the apostles, as, John 16, some do. For no man is exempted from an obligation to obey God’s Law because of his own sinful and culpable ignorance, for we speak not now of invincible ignorance of these things which we are not obliged to know or believe. But if our sinful and erroneous conscience free us from actual obligation to be tied by a law, then our erroneous conscience frees us from sinning against a law, and so from punishment; for whatever frees a man from actual obligation frees him also from actual sinning: for all sin is a doing against a Law-obligation; and if so, then are none to be led by any rule but their own conscience: the written Law and Gospel is not henceforth our rule any more.</p></blockquote>

<blockquote><p>If he take vincible, as opposed to invincible ignorance, he Popishly then says that the Scripture offers to us many things whereof we may be invincibly ignorant. Now invincible ignorance, Protestants acknowledge only in matters of fact, or of gospel-truths never so much as in the letter revealed, as heathens may be invincibly ignorant of Christ, and their ignorance not be sinful, as John 15:22, and Jacob was invincibly ignorant in lying with Leah instead of Rachel. There can be no such vincibleness, or invincibleness, in an heretic that hears the Gospel, for whoever hear the Gospel and yet remain ignorant, their ignorance is not invincible, Nulla est invincibilis ignorantia juris [Nothing is invincible ignorance in law].</p></blockquote>

</figure><figure class="quote" id="q-cfce7c195b" data-kw="">
<blockquote><p>‘But for this cause came I to this hour.’ Here is the fifth article in this prayer: a sort of correction, in which Christ does resign his will, as man, to the will of God; as Mt. 26:39; Lk. 22:42. ‘Nevertheless, not my will, but thine be done.’ In this there is offered to us a question, Whether or no there be in this prayer any repugnancy in the human will of Christ to the will of God? For: 1. A correction of the human will seems to import a jarring and a discord; 2. Christ desired that, the contrary whereof He knew was from eternity decreed of God. 3. The Law of God is so spiritual, straight and holy that it requires not only a conformity to it, and our will, actions, words and purposes, but also in all our affections, desires, first-motions and inclinations of our heart, that no unperfect and half-formed lustings arise in us even before the complete consent of the will that may thwart or cross the known Law and command of God; and by this, ‘Thou shalt not lust,’ Rom. 7, and the duty of the highest love we owe to God, to love him with all the heart, soul, mind, and whole strength, Mt. 22:37; Mk. 12:33; Lk. 10:27. Some Arians and Arminians, John Geysteranus at the Synod of Dort, have said blasphemously that there was concupiscence and a will repugnant to God’s will in the second Adam, as in the first. But this they spoke against the consubstantiality and deity of the Son of God. To which we say: Assertion 1. Jesus Christ that holy thing, Lk. 1:35, was a fit high priest, holy, harmless, undefiled, separated from sinners, Heb. 7:26. Which of you (says Christ to the Jews) convinces me of sin, Jn. 8:46. There could not be a spot in this Lamb sacrificed for the sins of the world, no prick in this Rose, no cloud in this fair Sun, no blemish in this beautiful Well-beloved. Assertion 2. An absolute, resolved will or desire of heart to lust after that which God forbids in his Law must be a sinful jarring between the creature’s and the Creator’s will. Now, Christ‘s will was conditional and clearly submissive; it lay ever level with his Father’s holy will. Assertion 3. I shall not with some affirm that which in the general is true, a will contrary to God’s revealed command and will, called voluntas signi, which is our moral rule to oblige us, is a sin [see Assertion 4 below]; but a will contrary to God’s decree, called voluntas beneplaciti, which is not our rule obliging, except the Lord be pleased to impose it on us as a moral Law, is not a sin. Peter and the apostles, after they heard that prophecy of their denying of Christ and their being sinfully scandalized, and their forsaking of Christ when the Shepherd was smitten, were obliged to have a will contrary to that decree and to pray that they might not be led into temptation, but might have grace to confess their Savior before men and not flee, nor be scattered: Here is a resolute will of men lawfully contrary to the revealed decree of God, yet not sinful. But the Lord’s will that Christ should die for man, as it was a decree of the wise and most gracious Lord pitying lost man, so was it also a revealed commandment to Christ, that He should be willing to die and be obedient to the death, even the death of the cross, Phil. 2:8; yea, a rule of such humble obedience as we are obliged to follow, as is said, verse 5, ‘Let this mind be in you, which was also in Christ Jesus,’ etc. If the Lord’s will that Christ should die be nothing but his mere decree, it could not oblige us in the like case to be willing, as John says to lay down our life for the brethren. Yea, Jn. 10:18, Christ has a commandment of God and the revealed will of God to die for us: ‘No man takes it from Me, but I lay it down of myself: I have power to lay it down; I have power to take it again: this commandment have I received of my Father.’ Here is an express commandment given to Christ to die for sinners; and the Father loves Christ for obedience to this commandment. Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations. 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment, for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son, if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did God’s precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination natural in a father to preserve the life of the child.’ So the positive command of the Father that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die. 2. A martyr dying for the truth of Christ may have a natural and conditional desire and inclination to live, though his living be contrary to the Lord’s revealed will commanding him to seal the Gospel with his blood and to confess Christ before men. 3. If the brother, son, daughter, wife or friend that is as a man’s own soul, Dt. 13:6, blaspheme God, yea if father or mother do it, Dt. 33:8-9, yet is a father obliged to stone the son or daughter, the son being a magistrate or a Levite and priest, to judge according to law (the priests’ lips should preserve knowledge, Mal. 2:8) that his father or mother ought to be stoned to death; yet ought not father or son to lay aside that natural desire of being and life to son, father, brother which the law of nature in the Fifth Command does require, especially the desire being conditional, with submission to God’s will, as the desire of Christ is here; and the command to stone the blasphemer, that the father stone the son, the son the father, being positive, and though founded on the law of nature, that a man prefer his Lord Creator and God before son or father and mother, yet are they not precepts of the law of nature such as is the precept of nature that a man desire his own life and being, the father the life and being of the son. Assertion 5. The apparent opposition (for it is not real) is rather between Christ‘s sensitive and his sinless mere natural desire and affection, and his reasonable will, than his [human] will and the will of God: Nor can any say there is a fight or jarring between the conditional desire of Christ subjected in the same act of praying, to the Lord’s decree and the resolute and immutable will of God. The Law of God, because holy and spiritual, does require a conformity between all the inclinations and motions of our soul and the law of nature; but an absolute conformity between all our inclinations and every positive command of God, such as was the Lord’s command that Christ should die for sinners, is not required in the Law of God. If Adam submit his natural hunger or desire to eat of the forbidden tree, to God’s Law, and eat not, there is no sinful jarring between his will and God’s positive Law, ‘Thou shalt not eat of the tree of Knowledge of good and evil.’</p></blockquote>

Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations. 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment, for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son, if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did God’s precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination natural in a father to preserve the life of the child.’ So the positive command of the Father that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die. 2. A martyr dying for the truth of Christ may have a natural and conditional desire and inclination to live, though his living be contrary to the Lord’s revealed will commanding him to seal the Gospel with his blood and to confess Christ before men. 3. If the brother, son, daughter, wife or friend that is as a man’s own soul, Dt. 13:6, blaspheme God, yea if father or mother do it, Dt. 33:8-9, yet is a father obliged to stone the son or daughter, the son being a magistrate or a Levite and priest, to judge according to law (the priests’ lips should preserve knowledge, Mal. 2:8) that his father or mother ought to be stoned to death; yet ought not father or son to lay aside that natural desire of being and life to son, father, brother which the law of nature in the Fifth Command does require, especially the desire being conditional, with submission to God’s will, as the desire of Christ is here; and the command to stone the blasphemer, that the father stone the son, the son the father, being positive, and though founded on the law of nature, that a man prefer his Lord Creator and God before son or father and mother, yet are they not precepts of the law of nature such as is the precept of nature that a man desire his own life and being, the father the life and being of the son. Assertion 5. The apparent opposition (for it is not real) is rather between Christ‘s sensitive and his sinless mere natural desire and affection, and his reasonable will, than his [human] will and the will of God: Nor can any say there is a fight or jarring between the conditional desire of Christ subjected in the same act of praying, to the Lord’s decree and the resolute and immutable will of God. The Law of God, because holy and spiritual, does require a conformity between all the inclinations and motions of our soul and the law of nature; but an absolute conformity between all our inclinations and every positive command of God, such as was the Lord’s command that Christ should die for sinners, is not required in the Law of God. If Adam submit his natural hunger or desire to eat of the forbidden tree, to God’s Law, and eat not, there is no sinful jarring between his will and God’s positive Law, ‘Thou shalt not eat of the tree of Knowledge of good and evil.’”

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself (London: 1647), pp. 138-41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98But+for+this+cause+came+I+to+this+hour.%E2%80%99+Here+is+the+fifth+article+in+this+prayer%3A+a+sort+of+correction%2C+in+which+Christ+does+resign+his+will%2C+as+man%2C+to+the+will+of+God%3B+as+Mt.+26%3A39%3B+Lk.+22%3A42.+%E2%80%98Nevertheless%2C+not+my+will%2C+but+thine+be+done.%E2%80%99+In+this+there+is+offered+to+us+a+question%2C+Whether+or+no+there+be+in+this+prayer+any+repugnancy+in+the+human+will+of+Christ+to+the+will+of+God%3F+For%3A+1.+A+correction+of+the+human+will+seems+to+import+a+jarring+and+a+discord%3B+2.+Christ+desired+that%2C+the+contrary+whereof+He+knew+was+from+eternity+decreed+of+God.+3.+The+Law+of+God+is+so+spiritual%2C+straight+and+holy+that+it+requires+not+only+a+conformity+to+it%2C+and+our+will%2C+actions%2C+words+and+purposes%2C+but+also+in+all+our+affections%2C+desires%2C+first-motions+and+inclinations+of+our+heart%2C+that+no+unperfect+and+half-formed+lustings+arise+in+us+even+before+the+complete+consent+of+the+will+that+may+thwart+or+cross+the+known+Law+and+command+of+God%3B+and+by+this%2C+%E2%80%98Thou+shalt+not+lust%2C%E2%80%99+Rom.+7%2C+and+the+duty+of+the+highest+love+we+owe+to+God%2C+to+love+him+with+all+the+heart%2C+soul%2C+mind%2C+and+whole+strength%2C+Mt.+22%3A37%3B+Mk.+12%3A33%3B+Lk.+10%3A27.+Some+Arians+and+Arminians%2C+John+Geysteranus+at+the+Synod+of+Dort%2C+have+said+blasphemously+that+there+was+concupiscence+and+a+will+repugnant+to+God%E2%80%99s+will+in+the+second+Adam%2C+as+in+the+first.+But+this+they+spoke+against+the+consubstantiality+and+deity+of+the+Son+of+God.+To+which+we+say%3A+Assertion+1.+Jesus+Christ+that+holy+thing%2C+Lk.+1%3A35%2C+was+a+fit+high+priest%2C+holy%2C+harmless%2C+undefiled%2C+separated+from+sinners%2C+Heb.+7%3A26.+Which+of+you+%28says+Christ+to+the+Jews%29+convinces+me+of+sin%2C+Jn.+8%3A46.+There+could+not+be+a+spot+in+this+Lamb+sacrificed+for+the+sins+of+the+world%2C+no+prick+in+this+Rose%2C+no+cloud+in+this+fair+Sun%2C+no+blemish+in+this+beautiful+Well-beloved.+Assertion+2.+An+absolute%2C+resolved+will+or+desire+of+heart+to+lust+after+that+which+God+forbids+in+his+Law+must+be+a+sinful+jarring+between+the+creature%E2%80%99s+and+the+Creator%E2%80%99s+will.+Now%2C+Christ%E2%80%98s+will+was+conditional+and+clearly+submissive%3B+it+lay+ever+level+with+his+Father%E2%80%99s+holy+will.+Assertion+3.+I+shall+not+with+some+affirm+that+which+in+the+general+is+true%2C+a+will+contrary+to+God%E2%80%99s+revealed+command+and+will%2C+called+voluntas+signi%2C+which+is+our+moral+rule+to+oblige+us%2C+is+a+sin+%5Bsee+Assertion+4+below%5D%3B+but+a+will+contrary+to+God%E2%80%99s+decree%2C+called+voluntas+beneplaciti%2C+which+is+not+our+rule+obliging%2C+except+the+Lord+be+pleased+to+impose+it+on+us+as+a+moral+Law%2C+is+not+a+sin.+Peter+and+the+apostles%2C+after+they+heard+that+prophecy+of+their+denying+of+Christ+and+their+being+sinfully+scandalized%2C+and+their+forsaking+of+Christ+when+the+Shepherd+was+smitten%2C+were+obliged+to+have+a+will+contrary+to+that+decree+and+to+pray+that+they+might+not+be+led+into+temptation%2C+but+might+have+grace+to+confess+their+Savior+before+men+and+not+flee%2C+nor+be+scattered%3A+Here+is+a+resolute+will+of+men+lawfully+contrary+to+the+revealed+decree+of+God%2C+yet+not+sinful.+But+the+Lord%E2%80%99s+will+that+Christ+should+die+for+man%2C+as+it+was+a+decree+of+the+wise+and+most+gracious+Lord+pitying+lost+man%2C+so+was+it+also+a+revealed+commandment+to+Christ%2C+that+He+should+be+willing+to+die+and+be+obedient+to+the+death%2C+even+the+death+of+the+cross%2C+Phil.+2%3A8%3B+yea%2C+a+rule+of+such+humble+obedience+as+we+are+obliged+to+follow%2C+as+is+said%2C+verse+5%2C+%E2%80%98Let+this+mind+be+in+you%2C+which+was+also+in+Christ+Jesus%2C%E2%80%99+etc.+If+the+Lord%E2%80%99s+will+that+Christ+should+die+be+nothing+but+his+mere+decree%2C+it+could+not+oblige+us+in+the+like+case+to+be+willing%2C+as+John+says+to+lay+down+our+life+for+the+brethren.+Yea%2C+Jn.+10%3A18%2C+Christ+has+a+commandment+of+God+and+the+revealed+will+of+God+to+die+for+us%3A+%E2%80%98No+man+takes+it+from+Me%2C+but+I+lay+it+down+of+myself%3A+I+have+power+to+lay+it+down%3B+I+have+power+to+take+it+again%3A+this+commandment+have+I+received+of+my+Father.%E2%80%99+Here+is+an+express+commandment+given+to+Christ+to+die+for+sinners%3B+and+the+Father+loves+Christ+for+obedience+to+this+commandment.+Assertion+4.+A+conditional+and+a+submissive+desire%2C+though+not+agreeable+to+a+positive+law+and+commandment+of+God%2C+is+no+sin%2C+nor+does+the+Law+require+a+conformity+in+all+our+inclinations+and+the+first+motions+of+our+desires+to+every+command+of+God%2C+though+most+contrary+to+nature+and+our+natural+and+sinless+inclinations.+1.+If+God+command+Abraham+to+kill+his+only+begotten+son+and+offer+him+in+a+sacrifice+to+God%2C+which+was+a+mere+positive+commandment%2C+for+it%E2%80%99s+not+a+command+of+the+law+of+nature+%28nor+any+other+than+positive%29+for+the+father+to+kill+the+son%2C+if+yet+Abraham+retain+a+natural+inclination+and+love+commanded+also+in+the+law+of+nature+to+save+his+son%E2%80%99s+life+and+to+desire+that+he+may+live%2C+this+desire+and+inclination%2C+though+contradictory+to+a+positive+command+of+God%2C+is+no+sin%3B+because+the+Fifth+Command%2C+grounded+on+the+law+of+nature%2C+does+command+it.+Nor+did+God%E2%80%99s+precept+%28%E2%80%98Abraham%2C+kill+now+thy+son%2C+even+Isaac+thine+only+begotten+son%E2%80%99%29+ever+include+this%2C+%E2%80%98Abraham%2C+root+out+of+thine+heart+all+desire+and+inclination+natural+in+a+father+to+preserve+the+life+of+the+child.%E2%80%99+So+the+positive+command+of+the+Father+that+the+Son+of+God+should+lay+down+his+life+for+his+sheep%2C+did+never+root+out+of+the+sinless+nature+of+the+man-Christ+a+natural+desire+to+preserve+his+own+being+and+life%2C+especially+He+desiring+it+with+special+reservation+of+the+will+of+God+commanding+that+He+should+die.+2.+A+martyr+dying+for+the+truth+of+Christ+may+have+a+natural+and+conditional+desire+and+inclination+to+live%2C+though+his+living+be+contrary+to+the+Lord%E2%80%99s+revealed+will+commanding+him+to+seal+the+Gospel+with+his+blood+and+to+confess+Christ+before+men.+3.+If+the+brother%2C+son%2C+daughter%2C+wife+or+friend+that+is+as+a+man%E2%80%99s+own+soul%2C+Dt.+13%3A6%2C+blaspheme+God%2C+yea+if+father+or+mother+do+it%2C+Dt.+33%3A8-9%2C+yet+is+a+father+obliged+to+stone+the+son+or+daughter%2C+the+son+being+a+magistrate+or+a+Levite+and+priest%2C+to+judge+according+to+law+%28the+priests%E2%80%99+lips+should+preserve+knowledge%2C+Mal.+2%3A8%29+that+his+father+or+mother+ought+to+be+stoned+to+death%3B+yet+ought+not+father+or+son+to+lay+aside+that+natural+desire+of+being+and+life+to+son%2C+father%2C+brother+which+the+law+of+nature+in+the+Fifth+Command+does+require%2C+especially+the+desire+being+conditional%2C+with+submission+to+God%E2%80%99s+will%2C+as+the+desire+of+Christ+is+here%3B+and+the+command+to+stone+the+blasphemer%2C+that+the+father+stone+the+son%2C+the+son+the+father%2C+being+positive%2C+and+though+founded+on+the+law+of+nature%2C+that+a+man+prefer+his+Lord+Creator+and+God+before+son+or+father+and+mother%2C+yet+are+they+not+precepts+of+the+law+of+nature+such+as+is+the+precept+of+nature+that+a+man+desire+his+own+life+and+being%2C+the+father+the+life+and+being+of+the+son.+Assertion+5.+The+apparent+opposition+%28for+it+is+not+real%29+is+rather+between+Christ%E2%80%98s+sensitive+and+his+sinless+mere+natural+desire+and+affection%2C+and+his+reasonable+will%2C+than+his+%5Bhuman%5D+will+and+the+will+of+God%3A+Nor+can+any+say+there+is+a+fight+or+jarring+between+the+conditional+desire+of+Christ+subjected+in+the+same+act+of+praying%2C+to+the+Lord%E2%80%99s+decree+and+the+resolute+and+immutable+will+of+God.+The+Law+of+God%2C+because+holy+and+spiritual%2C+does+require+a+conformity+between+all+the+inclinations+and+motions+of+our+soul+and+the+law+of+nature%3B+but+an+absolute+conformity+between+all+our+inclinations+and+every+positive+command+of+God%2C+such+as+was+the+Lord%E2%80%99s+command+that+Christ+should+die+for+sinners%2C+is+not+required+in+the+Law+of+God.+If+Adam+submit+his+natural+hunger+or+desire+to+eat+of+the+forbidden+tree%2C+to+God%E2%80%99s+Law%2C+and+eat+not%2C+there+is+no+sinful+jarring+between+his+will+and+God%E2%80%99s+positive+Law%2C+%E2%80%98Thou+shalt+not+eat+of+the+tree+of+Knowledge+of+good+and+evil.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+pp.+138-41&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcfce7c195b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cfce7c195b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=But%20for%20this%20cause%20came%20I,of%20Knowledge%20of%20good%20and%20evil&amp;text=But%20for%20this%20cause%20came%20I%20to%20this&amp;text=the%20tree%20of%20Knowledge%20of%20good%20and%20evil" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Night pollutions are not altogether against our will; they are sinful pollutions except concupiscence and lustful habitual day lusts, the cause of them, be not sinful pollutions, yea and forbidden in the Seventh Commandment… …we conceive legal [Mosaic] uncleanness, as the monthly diseases of women, night pollutions, want [lack] of circumcision, did typify much natural and original heart corruption, which cannot be punished by men or the Church…</p></blockquote>

<blockquote><p>XV. The question arises whether sin can also be committed in sleep? The answer is yes, because then it arises from the waking sins of those who sleep, so that we sin even in this state, and sleep as it were continues those sins; for the thoughts and cares of the day supply the material for dreams–not to mention intemperance in food and drink as causes of other sins. There is at least a virtual and original consent of the will, even if an accompanying consent too; and in sleep we perceive ourselves having good thoughts and cherishing virtuous dispositions, so contrariwise the others that diverge must be counted as sinful. Thus in the old law, those who at any time suffered from a gonorrhea discharge were considered unclean, Leviticus 15:2-3. To this point tend the opinions and rescripts of the Ancients concerning nocturnal pollution, whether one had suffered it voluntarily, not from any preceding lust, but spontaneously, as a natural bodily excretion “as superfluous matter”, in which case they judged the man not to be defiled; or whether “desire preceded and the emission followed from that”, or it occurred “from intemperance in food and drink”, in which way Dionysius of Alexandria speaks in his Epistle to Basilides, chapter 4. There were others who counted even the natural flow of semen among sins, against whom John Zonaras argues in “Lest you be Overly Righteous”, in the Greek-Roman Law of Marquard Freher, Book 5 of Responses, page 351, and in Emmingus Bonificius’ Oriental Law, Book 3. “Be not righteous overmuch,” is how he begins his oration, “nor more upright than the rule itself. These are the opinions of the more excellent wisdom, and our own.</p></blockquote>

<blockquote><p>But still the images of such things live in my memory, of which I have spoken much, which my habitual way of life has deeply imprinted there, and they occur to me awake, although lacking strength, but in sleep not only to the point of pleasure, but even to the point of consent and an act very like the reality. And such is the force of illusion in my soul and in my flesh, that false visions persuade my sleeping mind of things which true visions cannot persuade my waking mind. Cannot your hand, O All-Powerful God, heal all the languors of my soul and by a more abundant grace extinguish even the lascivious motions of my sleep? You will increase in me more and more, O Lord, your gifts, that my soul may not be rebellious to itself and that not only in sleep it may not perpetrate those turpitudes of corruptions through animal imaginations even to the flow of the flesh, but may not even consent to them…</p></blockquote>

t, the latter from a nonfederalist perspective.</p></blockquote>

<blockquote><p>IV. We say it is a universal apostasy from true Christianity or of the truth of the gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency. V… it be committed against the knowledge of the truth not only legal, but especially gospel; not only theoretical and historical (for whoever sins against knowledge would sin against the Holy Spirit), but practical and convictive (although not persuasive). Conviction is when anyone knows the truth of the gospel, but is also convinced in his own mind of its goodness, so that he cannot even mutter against it (although he may wish to)… IX. Second, to constitute this sin is required a total defection from the truth and its wicked rejection and denial; not from fear simply and the weakness of the flesh… that denial of the truth should proceed from pure wickedness and petulance (arising from deadly hatred and obstinate contempt of it)… XI. The third mark is not only the denial of the recognized truth, but also a pertinacious opposition to it. For as they persecute it with the deepest hatred, it is no wonder that they endeavor with all their might to overturn it… This is evident in the Pharisees… XII. Finally, the fourth mark is stubbornness of mind and perseverance in wickedness even unto the end… XIII. And hence the unpardonableness of that sin, which is its inseparable adjunct… XV… it rises from the very nature of the sin, which is such that it excludes the very condition requisite to pardon (viz., repentance…</p></blockquote>

nd%E2%80%A6+XIII.+And+hence+the+unpardonableness+of+that+sin%2C+which+is+its+inseparable+adjunct%E2%80%A6+XV%E2%80%A6+it+rises+from+the+very+nature+of+the+sin%2C+which+is+such+that+it+excludes+the+very+condition+requisite+to+pardon+%28viz.%2C+repentance%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+tr.+George+M.+Giger%2C+ed.+James+Dennison+Jr.+%281679%E2%80%931685%3B+P%26R%2C+1992%29%2C+vol.+1%2C+9th+Topic%2C+%E2%80%98In+what+consists+the+formal+reason+of+the+sin+against+the+Holy+Spirit%3F+Also+why+is+it+unpardonable%3F%E2%80%99%2C+sections+4-5%2C+9%2C+11-12%2C+15%2C+pp.+647-50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe084c3061a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e084c3061a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/of-the-sin-against-the-holy-spirit/#:~:text=IV.%20We%20say%20it%20is%20a,condition%20requisite%20to%20pardon%20%28viz.%2C%20repentance&amp;text=IV.%20We%20say%20it%20is%20a%20universal%20apostasy&amp;text=the%20very%20condition%20requisite%20to%20pardon%20%28viz.%2C%20repentance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Concerning the sin against the Holy Ghost, obstinate and final impenitence is a stubborn froward persisting of an hard hearted heart in willful malice by which a man becomes and is made impenitent (Heb. 6:4-6).</p></blockquote>

</figure><figure class="quote" id="q-e4e257a4d2" data-kw="">
<blockquote><p>Hence also is the difference between sin pardonable and unpardonable, whereof the one is said to be a sin which is committed against the Father and the Son, that is every transgression of God’s law, whereunto repentance belongs, and therefore that which is pardonable not by the properties of it own nature, but by the grace and mercy of him against whom it is committed; the other is said to be a sin which is committed against the Holy Ghost, and therefore is called by an excellency in Scriptures the blasphemy of the Spirit and a sin unto death. Now, for the making of this sin, three things concur: First, the denial of the truth against knowledge and conscience. Secondly, a universal backsliding from God, and not a particular sin against the first or second table of the law. Thirdly, a rebellion sprung from a hatred of the truth, conjoined with a tyrannical, sophistical, and hypocritical oppugning (or withstanding). And of these conditions, there is a mutual knitting and sequel of the one with, and after the other. Further, it is called a sin against the Holy Ghost, not in respect of the divine essence, and person of the Spirit, but in respect of his office – that is, of grace, and illumination – whereof the Holy Ghost is properly the worker (or effecter); but it is said to be unpardonable for three causes: first, because of the just judgment of God, who suffers not his Spirit, which is the Spirit of truth, to be reproved of a lie. Secondly, because of impenitency, or the hardness to repent. Thirdly, because of the truth and the dignity of redemption, purchased by Christ. For there remains no other sacrifice after men have forsaken the sacrifice of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite></span></figcaption>

</figure><figure class="quote" id="q-41308f88c5" data-kw="">
<blockquote><p>John does not, indeed, wish us to be rash in judging who has committed such a sin; rather, he the more inflames us to pray for all, because it is not easy to say of whom God is unwilling to forgive. But this sin is without doubt the hatred of the gospel on account of lusts, after someone has heard it, been convinced of its truth, and even rejoiced because of that hearing. John does not reproach compassion toward those who perish, but he wishes the godly finally to rest content with the judgments of God, and not to grieve and labor in vain. Yet he does not wish them to desist from praying, until that bitter root of an evil conscience—blessing itself, opposing the truth of the gospel, and attempting to drag back those who have been delivered into bondage—has manifested itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All the Works, 3rd ed. (d. 1669; Amsterdam, 1701), vol. 6, separate pagination, on 1 John 5, sect. 18 on v. 16</cite>, pp. 10-11 Trans. Chatgpt-5</span></figcaption>

</figure><figure class="quote" id="q-ca7db8ecf7" data-kw="">
<blockquote><p>But here arises a doubt: Are we not to pray for wicked men, yea, the impenitent, the persecutors of the Church, contemners of the Word? I answer: 1. Yea, partly because we know not the secret purposes of God’s grace. Christ in the light of his divinity, knew the elect and the reprobate, but we know not, therefore we are to pray for them that persecute, Mt. 5:44. Paul once breathed out threatenings against the Church; Christ received gifts for the rebellious; partly because many wicked men are considerable in their station, therefore, at least, we pray for temporal blessings for them, though we have little hopes that ever they shall be gained to the knowledge of the truth. Thus we are to pray for wicked rulers, for the conservation of human society, they may serve as a thorn hedge about a garden of roses. Thus it is said, Ezra 6:10, that in the Temple they should pray for the life of the king and of his sons, meaning the King of Babylon, Darius, at least for temporal favors. 2. We have not such encouragement to pray for them as for the saints: For the saints we pray out of the unity of the Spirit, for wicked men, out of common charity: for the saints we pray out of a delight in their graces; for wicked men, out of a loose possible hope. Heb. 13:18, ‘Pray for us, for we trust that we have a good conscience in all things, willing to live honestly.’ These should have the greatest share of our prayers; we have the more encouragements and hopes of them, which should be an engagement to us to pray for them. 3. Conditionally we may pray against the obstinate and them that sin of malicious wickedness. There are many imprecations in Ps. 109 which are not to serve our private revenge, but by us to be conceived conditionally: Those curses are uttered against Judas in a prophetical spirit, and therefore not to be drawn into example, to justify any heats of revenge and private passion. 1 Jn. 5:16: ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death; I do not say that he shall pray for it.’ It is a tempting of God to intercede for that sin, seeing He has declared his will; the irremissible sin, is that sin, though it be hard to be found out. Therefore it is good to keep to the conditional form when a man, after the profession of religion, falls to an utter revolt and deadly hatred of it: it is a shrewd presumption they have committed that sin. 4. We feel sometimes a restraint upon our prayers. God by oracle forbade the prophet to pray for the people; Jer. 7:16: ‘Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to Me, for I will not hear thee.’ When He was resolved to put his wrath in execution, He would not have his people’s prayers lost; and still the same Spirit that stirs up to prayer searches out the deep counsels of God. So that there is a kind of prophetical light in prayers; God [at times] suspends the servency and actual assistance, by which we are carried on at other times. I would not justify every private passionate conceit, but yet we must look upon the Spirit of God as the interpreter of God’s counsel, and that He will not stir up prayers to no purpose. Yea, sometimes we feel that after much striving, we have no heart to pray for them, which is a very great mark of God’s displeasure upon any person, when God’s people, yea, even after much struggling with themselves, have no heart to pray for him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons Preached… (d. 1677; London: Astwood, 1684), Sermons on John 17, Sermon 12, on Jn. 17:9</cite>, p. 106-7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But here arises a doubt: Are we not to pray for wicked men, yea, the impenitent, the persecutors of the Church, contemners of the Word? I answer: 1. Yea, partly because we know not the secret purposes of God’s grace. Christ in the light of his divinity, knew the elect and the reprobate, but we know not, therefore we are to pray for them that persecute, Mt. 5:44. Paul once breathed out threatenings against the Church; Christ received gifts for the rebellious; partly because many wicked men are considerable in their station, therefore, at least, we pray for temporal blessings for them, though we have little hopes that ever they shall be gained to the knowledge of the truth. Thus we are to pray for wicked rulers, for the conservation of human society, they may serve as a thorn hedge about a garden of roses. Thus it is said, Ezra 6:10, that in the Temple they should pray for the life of the king and of his sons, meaning the King of Babylon, Darius, at least for temporal favors. 2. We have not such encouragement to pray for them as for the saints: For the saints we pray out of the unity of the Spirit, for wicked men, out of common charity: for the saints we pray out of a delight in their graces; for wicked men, out of a loose possible hope. Heb. 13:18, ‘Pray for us, for we trust that we have a good conscience in all things, willing to live honestly.’ These should have the greatest share of our prayers; we have the more encouragements and hopes of them, which should be an engagement to us to pray for them. 3. Conditionally we may pray against the obstinate and them that sin of malicious wickedness. There are many imprecations in Ps. 109 which are not to serve our private revenge, but by us to be conceived conditionally: Those curses are uttered against Judas in a prophetical spirit, and therefore not to be drawn into example, to justify any heats of revenge and private passion. 1 Jn. 5:16: ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death; I do not say that he shall pray for it.’ It is a tempting of God to intercede for that sin, seeing He has declared his will; the irremissible sin, is that sin, though it be hard to be found out. Therefore it is good to keep to the conditional form when a man, after the profession of religion, falls to an utter revolt and deadly hatred of it: it is a shrewd presumption they have committed that sin. 4. We feel sometimes a restraint upon our prayers. God by oracle forbade the prophet to pray for the people; Jer. 7:16: ‘Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to Me, for I will not hear thee.’ When He was resolved to put his wrath in execution, He would not have his people’s prayers lost; and still the same Spirit that stirs up to prayer searches out the deep counsels of God. So that there is a kind of prophetical light in prayers; God [at times] suspends the servency and actual assistance, by which we are carried on at other times. I would not justify every private passionate conceit, but yet we must look upon the Spirit of God as the interpreter of God’s counsel, and that He will not stir up prayers to no purpose. Yea, sometimes we feel that after much striving, we have no heart to pray for them, which is a very great mark of God’s displeasure upon any person, when God’s people, yea, even after much struggling with themselves, have no heart to pray for him.”

e+our+private+revenge%2C+but+by+us+to+be+conceived+conditionally%3A+Those+curses+are+uttered+against+Judas+in+a+prophetical+spirit%2C+and+therefore+not+to+be+drawn+into+example%2C+to+justify+any+heats+of+revenge+and+private+passion.+1+Jn.+5%3A16%3A+%E2%80%98If+any+man+see+his+brother+sin+a+sin+which+is+not+unto+death%2C+he+shall+ask%2C+and+he+shall+give+him+life+for+them+that+sin+not+unto+death.+There+is+a+sin+unto+death%3B+I+do+not+say+that+he+shall+pray+for+it.%E2%80%99+It+is+a+tempting+of+God+to+intercede+for+that+sin%2C+seeing+He+has+declared+his+will%3B+the+irremissible+sin%2C+is+that+sin%2C+though+it+be+hard+to+be+found+out.+Therefore+it+is+good+to+keep+to+the+conditional+form+when+a+man%2C+after+the+profession+of+religion%2C+falls+to+an+utter+revolt+and+deadly+hatred+of+it%3A+it+is+a+shrewd+presumption+they+have+committed+that+sin.+4.+We+feel+sometimes+a+restraint+upon+our+prayers.+God+by+oracle+forbade+the+prophet+to+pray+for+the+people%3B+Jer.+7%3A16%3A+%E2%80%98Therefore+pray+not+thou+for+this+people%2C+neither+lift+up+cry+nor+prayer+for+them%2C+neither+make+intercession+to+Me%2C+for+I+will+not+hear+thee.%E2%80%99+When+He+was+resolved+to+put+his+wrath+in+execution%2C+He+would+not+have+his+people%E2%80%99s+prayers+lost%3B+and+still+the+same+Spirit+that+stirs+up+to+prayer+searches+out+the+deep+counsels+of+God.+So+that+there+is+a+kind+of+prophetical+light+in+prayers%3B+God+%5Bat+times%5D+suspends+the+servency+and+actual+assistance%2C+by+which+we+are+carried+on+at+other+times.+I+would+not+justify+every+private+passionate+conceit%2C+but+yet+we+must+look+upon+the+Spirit+of+God+as+the+interpreter+of+God%E2%80%99s+counsel%2C+and+that+He+will+not+stir+up+prayers+to+no+purpose.+Yea%2C+sometimes+we+feel+that+after+much+striving%2C+we+have+no+heart+to+pray+for+them%2C+which+is+a+very+great+mark+of+God%E2%80%99s+displeasure+upon+any+person%2C+when+God%E2%80%99s+people%2C+yea%2C+even+after+much+struggling+with+themselves%2C+have+no+heart+to+pray+for+him.%E2%80%9D%0A%0A% <blockquote><p>Bridgnorth had made me resolve that I would never go among a people that had been hardened in unprofitableness under an awakening ministry; but either to such as had never had any convincing preacher, or to such as had profited by him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquae, I.i.29</cite></span></figcaption>

</figure><figure class="quote" id="q-4a3de6de98" data-kw="">
<blockquote><p>It is good for us to mind what Christ says of great sinners, Mt. 12:31-32, ‘I say unto you, all manner of sin and blasphemy shall be forgiven unto men.’ When Christ says, ‘all manner of sin and blasphemy shall be forgiven unto men,’ and excepts none but the blasphemy against the Holy Ghost, no, not a word spoken against the Son of Man Himself, we may well think a word spoken or a deed done against ourselves may be pardoned; and that it may be so, [we] should pray for it; and we may hope for a good effect of it. Stephen’s prayer, when he was stoned (Acts 7:60), probably had an influence on Paul’s conversion. St. John tells us, 1 John 5:16, ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death.’ So that unless a man could be assured that another has sinned that sin which is unto death, he may, nay, he ought to pray for him: ‘He shall ask, etc.’ In any case where there is but an ‘if so be,’ or a ‘who can tell,’ or a ‘perhaps,’ there is room left for prayer. In that mighty tempest that arose in the sea to arrest Jonah as he was going to Tarshish, which was like to have broken the ship, he is called on to arise and call upon his God, Jon. 1:6, ‘If so be that God will think upon us, that we perish not.’ Their case was very doubtful, yet they pray. So when Jonah had delivered his message to the Ninevites, ‘Yet forty days and Nineveh shall be overthrown,’ they cry mightily unto God, saying, ‘Who can tell if God will turn and repent?’ Jon. 3.9. Simon Magus was in a very bad state, in the gall of bitterness and the bond of iniquity, and Peter perceived it; yet he bids him repent and pray, if perhaps the thoughts of his heart might be forgiven him; and can we think, that he who put him upon praying for himself, would not pray for him too, especially considering Simon requested it of him? Acts 8:21, 24. Calvin in location: Si fieri possit, ab ipsis inferis extrahendi nobis sunt homines. [“If it were possible, men ought to be drawn by us even from the very depths of hell.”]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-millward.html">John Millward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuation of Morning-Exercise Questions &amp; Cases of Conscience Practicaly Resolved... (London: Dunton, 1683), Sermon 19, ‘How ought we to do our Duty towards others, though they do not theirs towards us?’, p. 564 Millward (d. 1684) was an English puritan put out at the Great Ejection.</cite></span></figcaption>

</figure><figure class="quote" id="q-394dd02b63" data-kw="">
<blockquote><p>We find three old opinions concerning the sin against the Holy-Ghost, but they were long since exploded; I will but only name them: First, saint Origen thought all sins committed after baptism, to be sins against the Holy Ghost: his reason was only a witty conceit of his own, that God the Father is in all things, the Son is only in all reasonable creatures, the Holy Ghost is only in all regenerate men; therefore when men sin against that divine Person that is in them, if they be heathens, they sin against God the Father or the Son; if they be Christians, they sin against the Holy Ghost. The Novatian heretics agreed with Origen in opinion, for they denied remission of sins to any that fell, thinking all falls of Christians to be the sin against the Holy Ghost: but this opinion is false; For else all sins were unpardonable to Christians: yet we find saint Paul remit the sin of the incestuous Corinthian; also our Savior charges the Pharisees with this sin, who were no Christians. Secondly, saint Augustine thought [after a revision of his earlier view] final impenitency to be the sin against the Holy Ghost; but final impenitency is no blasphemy, but only a general circumstance that may accompany any sin. Besides, our Savior intends that this sin may be found in this life, for he says it shall not be forgiven in this life, and the Pharisees were alive when they were accused of it. Thirdly, Peter Lombard and Thomas Aquinas thought sins of malice to be the sin against the Holy Ghost, and sins of infirmity against the Father, and sins of ignorance against the Son. This opinion is false, because the sin against the Holy Ghost must be a sin of some certain blasphemy; but malice is no certain sin, but a general [sin], and it is not always a blasphemy. The six differences the Schoolmen make of the sin against the Holy Ghost are: first, envying of our brother’s grace: secondly, impugning the known truth: thirdly, desperation, fourthly, presumption: fifthly, obstinacy: sixthly, final impenitency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-hales.html">John Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Blasphemy against the Holy Ghost (London: 1646)</cite>, pp. 20-21</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We find three old opinions concerning the sin against the Holy-Ghost, but they were long since exploded; I will but only name them: First, saint Origen thought all sins committed after baptism, to be sins against the Holy Ghost: his reason was only a witty conceit of his own, that God the Father is in all things, the Son is only in all reasonable creatures, the Holy Ghost is only in all regenerate men; therefore when men sin against that divine Person that is in them, if they be heathens, they sin against God the Father or the Son; if they be Christians, they sin against the Holy Ghost. The Novatian heretics agreed with Origen in opinion, for they denied remission of sins to any that fell, thinking all falls of Christians to be the sin against the Holy Ghost: but this opinion is false; For else all sins were unpardonable to Christians: yet we find saint Paul remit the sin of the incestuous Corinthian; also our Savior charges the Pharisees with this sin, who were no Christians. Secondly, saint Augustine thought [after a revision of his earlier view] final impenitency to be the sin against the Holy Ghost; but final impenitency is no blasphemy, but only a general circumstance that may accompany any sin. Besides, our Savior intends that this sin may be found in this life, for he says it shall not be forgiven in this life, and the Pharisees were alive when they were accused of it. Thirdly, Peter Lombard and Thomas Aquinas thought sins of malice to be the sin against the Holy Ghost, and sins of infirmity against the Father, and sins of ignorance against the Son. This opinion is false, because the sin against the Holy Ghost must be a sin of some certain blasphemy; but malice is no certain sin, but a general [sin], and it is not always a blasphemy. The six differences the Schoolmen make of the sin against the Holy Ghost are: first, envying of our brother’s grace: secondly, impugning the known truth: thirdly, desperation, my.+The+six+differences+the+Schoolmen+make+of+the+sin+against+the+Holy+Ghost+are%3A+first%2C+envying+of+our+brother%E2%80%99s+grace%3A+secondly%2C+impugning+the+known+truth%3A+thirdly%2C+desperation%2C+fourthly%2C+presumption%3A+fifthly%2C+obstinacy%3A+sixthly%2C+final+impenitency.%E2%80%9D%0A%0A%E2%80%94+John+Hales%2C+Of+the+Blasphemy+against+the+Holy+Ghost+%28London%3A+1646%29%2C+pp.+20-21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F394dd02b63.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/394dd02b63.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/of-the-sin-against-the-holy-spirit/#:~:text=We%20find%20three%20old%20opinions%20concerning,presumption%3A%20fifthly%2C%20obstinacy%3A%20sixthly%2C%20final%20impenitency&amp;text=We%20find%20three%20old%20opinions%20concerning%20the%20sin&amp;text=desperation%2C%20fourthly%2C%20presumption%3A%20fifthly%2C%20obstinacy%3A%20sixthly%2C%20final%20impenitency" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>14. The inward offer is a spiritual enlightening, whereby those promises are propounded to the hearts of men, as it were by an inward word. John 6:45, Whosoever has heard of the Father and has learned, comes to me. Eph. 1:17. That He might give unto you the spirit of wisdom and revelation, the eyes of your mind being enlightened, that ye may know what is that hope of your calling. 15. This also is sometime, and in a certain manner granted to those that are not elected. Hebrews 6:4 &amp; 10:29; Mat. 13:20. 16. If anyone oppose himself out of malice to this illumination, he commits a sin against the Holy Ghost, which is called unpardonable, or unto death. Heb.6:6 &amp; 10:29; 1 John 5:16; Matt 12:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof (d. 1633), bk 1, ch. 26</cite></span></figcaption>

</figure><figure class="quote" id="q-2c7ef78fc9" data-kw="">
<blockquote><p>Thus you have heard the nature and specifications of injustice; now look upon the continuance of it; for so much the word imports. God will not cast all sinners into Hell, who then should go to heaven? but ‘the unjust’: such as practice unrighteousness without any recovery of repentance. ‘The unrighteous shall not enter into the kingdom of heaven’ (1 Cor. 6:9; Eph. 5:6): it is the continuance in sin that excludes from mercy. Two things throw men to perdition without the intervention of extraordinary favor: malice in sin and utter apostasy. These be the symptoms of that endangered disease for which there is no balm in Gilead; we call it the sin of the Holy Ghost. Not that it is against the third Person, as He is the third Person, more than against the first or second: but because it is against the function or operation of that Person, whose office is to illuminate the mind and mollify the heart with love: therefore Himself is called love. (Heb. 10:26) If men sin wilfully after that they have received the knowledge of the truth, there remains no more sacrifice for their sins: because they maliciously have sacrificed their sacrifice and split the only vessel that should save them. The iniquity of Eli’s house shall not be purged with sacrifice forever (1 Sam. 3:14): never expiated. There is a sin unto death, I do not say he shall pray for it. (1 Jn. 5:16) Every sin is unto death, but this emphatically, with a prohibition of interceeding set upon it, like the flaming sword that kept Paradise; Pray not for it. Schoolmen give this reason why the sinne of malice is unpardonable: The defect may find remission where the will may pretend fear of excess. A sin of ignorance is often forgiven, as was Paul’s (1 Tim. 1:16), because a man may affect too much knowledge, as Adam did. A sin of infirmity is oft forgiven because a man may affect too much power and dominion, as did the angels. A sin of carnal fear is often forgiven because a man may affect too much zeal; as did two of the apostles. A sin of partiality is oft forgiven because a man may affect too much justice. (Eccl. 7:14) But not a sin of malice, because a man can never affect too much charity. No less does apostasy and falling off from God; Totus, a toto, in totum. A man may sin beyond all comfort in his own conscience, till he cannot hope for himself, as did Judas. Beyond all interest in the Church’s devotion, till their prayers cannot help them: ‘Pray not thou for this people.’ (Jer. 7:16) Beyond all claim to Christ’s satisfaction; the blood of the Lamb shall not help them, Mt. 12:31. That which makes this sin past all cure is because it strives against the cure: as a mad man wounded will not suffer his wounds to be bound up, but rather seeks to wound the surgeon, God has mercy upon sinners, Christ came to call and die for sinners, there be none now in heaven but they were once sinners; which of all the holy patriarchs, blessed apostles, can excuse themselves that they never did act unjustly? But injustice was none of their trade; they did not live in it, not die in it. Zacheus was once unjust, but he testified his repentance by charity and restitution. But they that practise unrighteousness to the end, in the end shall find judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition upon the Divine Second Epistle General... (London: Badger, 1633), on 2 Pet. 2:9, “to reserve the unjust unto the day of judgment to be punished”</cite>, pp. 709-10</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus you have heard the nature and specifications of injustice; now look upon the continuance of it; for so much the word imports. God will not cast all sinners into Hell, who then should go to heaven? but ‘the unjust’: such as practice unrighteousness without any recovery of repentance. ‘The unrighteous shall not enter into the kingdom of heaven’ (1 Cor. 6:9; Eph. 5:6): it is the continuance in sin that excludes from mercy. Two things throw men to perdition without the intervention of extraordinary favor: malice in sin and utter apostasy. These be the symptoms of that endangered disease for which there is no balm in Gilead; we call it the sin of the Holy Ghost. Not that it is against the third Person, as He is the third Person, more than against the first or second: but because it is against the function or operation of that Person, whose office is to illuminate the mind and mollify the heart with love: therefore Himself is called love. (Heb. 10:26) If men sin wilfully after that they have received the knowledge of the truth, there remains no more sacrifice for their sins: because they maliciously have sacrificed their sacrifice and split the only vessel that should save them. The iniquity of Eli’s house shall not be purged with sacrifice forever (1 Sam. 3:14): never expiated. There is a sin unto death, I do not say he shall pray for it. (1 Jn. 5:16) Every sin is unto death, but this emphatically, with a prohibition of interceeding set upon it, like the flaming sword that kept Paradise; Pray not for it. Schoolmen give this reason why the sinne of malice is unpardonable: The defect may find remission where the will may pretend fear of excess. A sin of ignorance is often forgiven, as was Paul’s (1 Tim. 1:16), because a man may affect too much knowledge, as Adam did. A sin of infirmity is oft forgiven because a man may affect too much power and dominion, as did the angels. A sin of carnal fear is often forgiven because a man may affect too much zeal; as did two of the apostles. A sin of partiality is oft forgiven because a man may affect too much justice. (Eccl. 7:14) But not a sin of malice, because a man can never affect too much charity. No less does apostasy and falling off from God; Totus, a toto, in totum. A man may sin beyond all comfort in his own conscience, till he cannot hope for himself, as did Judas. Beyond all interest in the Church’s devotion, till their prayers cannot help them: ‘Pray not thou for this people.’ (Jer. 7:16) Beyond all claim to Christ’s satisfaction; the blood of the Lamb shall not help them, Mt. 12:31. That which makes this sin past all cure is because it strives against the cure: as a mad man wounded will not suffer his wounds to be bound up, but rather seeks to wound the surgeon, God has mercy upon sinners, Christ came to call and die for sinners, there be none now in heaven but they were once sinners; which of all the holy patriarchs, blessed apostles, can excuse themselves that they never did act unjustly? But injustice was none of their trade; they did not live in it, not die in it. Zacheus was once unjust, but he testified his repentance by charity and restitution. But they that practise unrighteousness to the end, in the end shall find judgment.”

— Thomas Adams, A Commentary or Exposition upon the Divine Second Epistle General... (London: Badger, 1633), on 2 Pet. 2:9, “to reserve the unjust unto the day of judgment to be punished”, pp. 709-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+you+have+heard+the+nature+and+specifications+of+injustice%3B+now+look+upon+the+continuance+of+it%3B+for+so+much+the+word+imports.+God+will+not+cast+all+sinners+into+Hell%2C+who+then+should+go+to+heaven%3F+but+%E2%80%98the+unjust%E2%80%99%3A+such+as+practice+unrighteousness+without+any+recovery+of+repentance.+%E2%80%98The+unrighteous+shall+not+enter+into+the+kingdom+of+heaven%E2%80%99+%281+Cor.+6%3A9%3B+Eph.+5%3A6%29%3A+it+is+the+continuance+in+sin+that+excludes+from+mercy.+Two+things+throw+men+to+perdition+without+the+intervention+of+extraordinary+favor%3A+malice+in+sin+and+utter+apostasy.+These+be+the+symptoms+of+that+endangered+disease+for+which+there+is+no+balm+in+Gilead%3B+we+call+it+the+sin+of+the+Holy+Ghost.+Not+that+it+is+against+the+third+Person%2C+as+He+is+the+third+Person%2C+more+than+against+the+first+or+second%3A+but+because+it+is+against+the+function+or+operation+of+that+Person%2C+whose+office+is+to+illuminate+the+mind+and+mollify+the+heart+with+love%3A+therefore+Himself+is+called+love.+%28Heb.+10%3A26%29+If+men+sin+wilfully+after+that+they+have+received+the+knowledge+of+the+truth%2C+there+remains+no+more+sacrifice+for+their+sins%3A+because+they+maliciously+have+sacrificed+their+sacrifice+and+split+the+only+vessel+that+should+save+them.+The+iniquity+of+Eli%E2%80%99s+house+shall+not+be+purged+with+sacrifice+forever+%281+Sam.+3%3A14%29%3A+never+expiated.+There+is+a+sin+unto+death%2C+I+do+not+say+he+shall+pray+for+it.+%281+Jn.+5%3A16%29+Every+sin+is+unto+death%2C+but+this+emphatically%2C+with+a+prohibition+of+interceeding+set+upon+it%2C+like+the+flaming+sword+that+kept+Paradise%3B+Pray+not+for+it.+Schoolmen+give+this+reason+why+the+sinne+of+malice+is+unpardonable%3A+The+defect+may+find+remission+where+the+will+may+pretend+fear+of+excess.+A+sin+of+ignorance+is+often+forgiven%2C+as+was+Paul%E2%80%99s+%281+Tim.+1%3A16%29%2C+because+a+man+may+affect+too+much+knowledge%2C+as+Adam+did.+A+sin+of+infirmity+is+oft+forgiven+because+a+man+may+affect+too+much+power+and+dominion%2C+as+did+the+angels.+A+sin+of+carnal+fear+is+often+forgiven+because+a+man+may+affect+too+much+zeal%3B+as+did+two+of+the+apostles.+A+sin+of+partiality+is+oft+forgiven+because+a+man+may+affect+too+much+justice.+%28Eccl.+7%3A14%29+But+not+a+sin+of+malice%2C+because+a+man+can+never+affect+too+much+charity.+No+less+does+apostasy+and+falling+off+from+God%3B+Totus%2C+a+toto%2C+in+totum.+A+man+may+sin+beyond+all+comfort+in+his+own+conscience%2C+till+he+cannot+hope+for+himself%2C+as+did+Judas.+Beyond+all+interest+in+the+Church%E2%80%99s+devotion%2C+till+their+prayers+cannot+help+them%3A+%E2%80%98Pray+not+thou+for+this+people.%E2%80%99+%28Jer.+7%3A16%29+Beyond+all+claim+to+Christ%E2%80%99s+satisfaction%3B+the+blood+of+the+Lamb+shall+not+help+them%2C+Mt.+12%3A31.+That+which+makes+this+sin+past+all+cure+is+because+it+strives+against+the+cure%3A+as+a+mad+man+wounded+will+not+suffer+his+wounds+to+be+bound+up%2C+but+rather+seeks+to+wound+the+surgeon%2C+God+has+mercy+upon+sinners%2C+Christ+came+to+call+and+die+for+sinners%2C+there+be+none+now+in+heaven+but+they+were+once+sinners%3B+which+of+all+the+holy+patriarchs%2C+blessed+apostles%2C+can+excuse+themselves+that+they+never+did+act+unjustly%3F+But+injustice+was+none+of+their+trade%3B+they+did+not+live+in+it%2C+not+die+in+it.+Zacheus+was+once+unjust%2C+but+he+testified+his+repentance+by+charity+and+restitution.+But+they+that+practise+unrighteousness+to+the+end%2C+in+the+end+shall+find+judgment.%E2%80%9D%0A%0A%E2%80%94+Thomas+Adams%2C+A+Commentary+or+Exposition+upon+the+Divine+Second+Epistle+General...+%28London%3A+Badger%2C+1633%29%2C+on+2+Pet.+2%3A9%2C+%E2%80%9Cto+reserve+the+unjust+unto+the+day+of+judgment+to+be+punished%E2%80%9D%2C+pp.+709-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c7ef78fc9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c7ef78fc9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=Thus%20you%20have%20heard%20the%20nature,in%20the%20end%20shall%20find%20judgment&amp;text=Thus%20you%20have%20heard%20the%20nature%20and%20specifications&amp;text=the%20end%2C%20in%20the%20end%20shall%20find%20judgment" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘there is a sin unto death’ that is, which certainly brings death with it, which is, the blasphemy against the holy Ghost, when any one denies the truth of the Christian doctrine, whereby he was enlightened and convinced by the Holy Ghost, and maliciously blasphemeth and persecuteth the same.</p></blockquote>

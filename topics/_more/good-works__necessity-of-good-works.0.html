<div class="actions"><button class="copy" data-copy="“VIII. New Obedience; Good Works New obedience is exercised through good works. Moreover, there are good works, voluntary actions of the sanctified, which come from a pure heart, love of God, true faith in Christ, according to the law of God, for His glory, one’s own salvation, and the usefulness of neighbor. For in order that a work be good, concursus of all causes is required. This includes its beginning which is the disposition of the will or the “treasure of a good heart” (Matt. 12:35), “a good tree” (Matt. 12:7, 17), a “pure heart” (1 Tim. 1:5), conformity with the law of God because those things “must be done” which “God commands” (Deut. 12:32), and also rectitude of circumstances because goods are necessary to be conducted well. Moreover, love of God is introduced because “love is the fulfillment of the law” (Rom. 13:10) and the root of good works (1 Cor. 13:4). Faith is also introduced because “whatever is not from faith is sin” (Rom. 14:23), and “love from faith is not feigned” (1 Tim. 1:5). The end is intention of right which the person who wills orders to the glory of God and salvation of neighbor, according to His Word. “If your eye is simple, the whole body will be lucid” (Matt. 6:22). But the good works noted in the latter are distinguished from the works of the unregenerate, Gentiles, and hypocrites. Moreover, the works exacted even of the regenerate for the rigor of the same bring forth their imperfection in this life, so that none can be found without adhering vice. (XXII–XXX). IX. The Necessity of Those Good works of adults and of those who can produce them are in a sense as necessary as sanctification itself. For although they do not justify, they are nevertheless fruits of justifying faith. They do not indeed serve the interests of meriting salvation, but taking possession of it. They are a consequence of the adjoined antecedent, faith. “Let your light so shine before men, that they may see your good works, and glorify your Father, who is in heaven” (Matt. 5:16). (XXX). X. They Do Not Effect or Merit Salvation Yet good works neither effect nor merit eternal life. For “eternal life” is “a gift of God” (Rom. 6:23), opposed “to debt” (ὀφειλήματι) (Rom. 4:4). Moreover, it depends on Christ alone and faith in Him (John 17:3, Acts 4:12), and it is given as “an inheritance” (Matt. 25:34, Rom. 8:17, Eph. 1:18). For all boasting must be excluded from salvation. “Where is boasting? It is excluded through the law of faith” (Rom. 3:27). But the one who merits can boast. Yet it is “not from works, lest anyone boast” (Eph. 2:9). Finally, works merit neither from condignity, nor from pact, nor from congruency. They do not merit from condignity because not even “our sufferings,” still less actions, “are worthy of the glory of God to be revealed in us” (Rom. 8:18), and we are debtors of doing those things for God by right of creation and redemption. God has no profit when “we render our ways perfect” (Job 22:2, 3), and “we are the workmanship of God, created in Christ Jesus for good works” (Eph. 2:10). They do not merit from pact because God nowhere promised life to one meriting it, and legal sin cannot be entered from pact. They do not merit from congruity because God promised the reward of merit not apart from perfect obedience, as from merit. (XXXI–XXXVII).”

— Johann Heinrich Heidegger, The Concise Marrow of Theology, (1697), vol. 4. Classic Reformed Theology, trans. Casey Carmichael (Grand Rapids: Reformation Heritage Books, 2019), 163–64.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVIII.+New+Obedience%3B+Good+Works+New+obedience+is+exercised+through+good+works.+Moreover%2C+there+are+good+works%2C+voluntary+actions+of+the+sanctified%2C+which+come+from+a+pure+heart%2C+love+of+God%2C+true+faith+in+Christ%2C+according+to+the+law+of+God%2C+for+His+glory%2C+one%E2%80%99s+own+salvation%2C+and+the+usefulness+of+neighbor.+For+in+order+that+a+work+be+good%2C+concursus+of+all+causes+is+required.+This+includes+its+beginning+which+is+the+disposition+of+the+will+or+the+%E2%80%9Ctreasure+of+a+good+heart%E2%80%9D+%28Matt.+12%3A35%29%2C+%E2%80%9Ca+good+tree%E2%80%9D+%28Matt.+12%3A7%2C+17%29%2C+a+%E2%80%9Cpure+heart%E2%80%9D+%281+Tim.+1%3A5%29%2C+conformity+with+the+law+of+God+because+those+things+%E2%80%9Cmust+be+done%E2%80%9D+which+%E2%80%9CGod+commands%E2%80%9D+%28Deut.+12%3A32%29%2C+and+also+rectitude+of+circumstances+because+goods+are+necessary+to+be+conducted+well.+Moreover%2C+love+of+God+is+introduced+because+%E2%80%9Clove+is+the+fulfillment+of+the+law%E2%80%9D+%28Rom.+13%3A10%29+and+the+root+of+good+works+%281+Cor.+13%3A4%29.+Faith+is+also+introduced+because+%E2%80%9Cwhatever+is+not+from+faith+is+sin%E2%80%9D+%28Rom.+14%3A23%29%2C+and+%E2%80%9Clove+from+faith+is+not+feigned%E2%80%9D+%281+Tim.+1%3A5%29.+The+end+is+intention+of+right+which+the+person+who+wills+orders+to+the+glory+of+God+and+salvation+of+neighbor%2C+according+to+His+Word.+%E2%80%9CIf+your+eye+is+simple%2C+the+whole+body+will+be+lucid%E2%80%9D+%28Matt.+6%3A22%29.+But+the+good+works+noted+in+the+latter+are+distinguished+from+the+works+of+the+unregenerate%2C+Gentiles%2C+and+hypocrites.+Moreover%2C+the+works+exacted+even+of+the+regenerate+for+the+rigor+of+the+same+bring+forth+their+imperfection+in+this+life%2C+so+that+none+can+be+found <blockquote><p>These fruits, when they are brought forth, God approveth of, accepteth, and further blesseth them that bear them; which is the last thing in the words. Some think there is no use of these fruits, unless they are meritorious of grace and glory. But God’s acceptation of them here is called his benediction, his blessing of them that bring them forth. Now a blessing cannot be merited; it is an act of bounty and authority, and hath the nature of a free gift, that cannot be deserved. What doth a field merit of him by whom it is watered and tilled, when it bringeth forth herbs meet for his use? they are all but the fruits of his own labour, cost, and pains. The field is only the subject that he hath wrought upon, and it is his own. All the fruits of our obedience are but the effects of his grace in us. We are a subject that he hath graciously been pleased to work upon. Only he is pleased, in a way of infinite condescension, to own in us what is his own, and to pardon what is ours. Wherefore the blessing of God on fruit-bearing believers consists in three things:—[1.] His approbation and gracious acceptance of them. So it is said that “he had respect unto Abel and to his offering,” Gen. 4:4. He graciously accepted both of his person and of his sacrifice, owning and approving of him, when Cain and his were rejected. So “he smelled a savour of rest” from the sacrifice of Noah, Gen. 8:21. And to testify his being well pleased therewith, he thence took occasion to renew and establish his covenant with him and his seed. [2.] It is by increasing their fruitfulness. “Every branch” in the vine “that beareth fruit, he purgeth it, that it may bring forth more fruit,” John 15:2. He “multiplieth the seed that is sown,” and “increaseth the fruits of their righteousness,” 2 Cor. 9:10. This is the constant way of God in his covenant-dealings with thriving, fruitful Christians; he so blesseth them as that their graces and fruits shall more and more abound, so as that they shall be flourishing even in old age, and bring forth more fruit unto the end. [3.] He blesseth them in the preparation he hath made for to give them an everlasting reward. A reward it is, indeed, of grace and bounty, but it is still a reward, “a recompence of reward.” For although it be no way merited or deserved, and although there be no proportion between our works, duties, or fruits, and it, yet, because they shall be owned in it, shall not be lost nor forgotten, and God therein testifies his acceptance of them, it is their reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 22, Works of John Owen (Edinburgh: Johnstone and Hunter, 1855), 113–14.</span></figcaption>

<blockquote><p>Objection 4. Faith does not justify without that which is required in those who are justified. Good works are required in those who are justified. Therefore, faith is not without good works, and so does not justify alone. Answer: There is here the same fallacy to which reference has just been made, on account of the doubtful construction of the particle without. Faith does not, indeed, justify without those things which are required in those who are justified. But although it never exists alone, and is always joined with love, by which it works, yet it alone justifies—is the act of embracing and applying to itself the merits of Christ. The minor also must be more fully explained; for faith and good works are not required in the same sense in those who are justified. Faith, with its own peculiar act, (without which it cannot be considered) is required as the necessary instrument, by which we apply to ourselves the merits of Christ. Good works, on the other hand, are not required that by them we may apprehend the merits of Christ, much less that we may be justified on account of them; but that we may thereby prove our faith, which without good works is dead, and can only be known by their presence. Good works are required as the fruits of our faith, and as the evidences of our gratitude to God. That is not always necessary for the accomplishment of a certain result, which is necessarily connected with the cause of the same thing. So good works, although they are necessarily connected with faith, are nevertheless not necessary for the apprehension of the merits of Christ.</p></blockquote>

</figure><figure class="quote" id="q-d87f55c427" data-kw="">
<blockquote><p>Q. 154 Therefore, you say that good works are necessary to salvation? A: If faith is necessary to salvation, and works necessarily flow out of true faith, (as that which cannot be idle), certainly also it follows, that good works are necessary to salvation, yet not as the cause of salvation (for we are justified, and thus live, by faith alone in Christ), but as something necessarily attached to true faith. Just as Paul says, they are God’s children, who are led by the Spirit of God; and John, that he is righteous who works righteousness; and James also, explaining not by what method we are justified, but, from whence true faith and justification are known, proves by the example of Abraham that they are not justified who demonstrate no works of faith. For in this way James is reconciled with Paul, so that it is plain that they are contentious who condemn the necessity of good works as a false doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Book of Christian Questions and Responses</cite>, ed. Dikran Y. Hadidian, trans. Kirk M. Summers, vol. 9, Princeton Theological Monograph Series (Eugene, OR: Pickwick Publications, 2009), 61.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-ea9846d89b" data-kw="">
<blockquote><p>3. THE NECESSITY OF GOOD WORKS. There can be no doubt about the necessity of good works properly understood. They cannot be regarded as necessary to merit salvation, nor as a means to retain a hold on salvation, nor even as the only way along which to proceed to eternal glory, for children enter salvation without having done any good works. The Bible does not teach that no one can be saved apart from good works. At the same time good works necessarily follow from the union of believers with Christ. “He that abideth in me and I in him, the same beareth much fruit,” John 15:5. They are also necessary as required by God, Rom. 7:4; 8:12, 13; Gal. 6:2, as the fruits of faith, Jas. 2:14, 17, 20–22. as expressions of gratitude, 1 Cor. 6:20 unto the assurance of faith, 2 Peter 1:5–10, and to the glory of God, John 15:8; 1 Cor. 10:31. The necessity of good works must be maintained over against the Antinomians, who claim that, since Christ not only bore the penalty of sin but, also met the positive demands of the law, the believer is free from the obligation to observe it, an error that is still with us to-day in some of the forms of dispensationalism. This is a thoroughly false position, for it is only the law as a system of penalty and as a method of salvation that is abolished in the death of Christ. The law as the standard of our moral life is a transcript of the holiness of God and is therefore of permanent validity also for the believer, though his attitude to the law has undergone a radical change. He has received the Spirit of God, which is the Spirit of obedience, so that, without any constraint, he willingly obeys the law. Strong sums it up well, when he says: Christ frees us “(1) from the law as a system of curse and penalty; this He does by bearing the curse and penalty Himself …; (2) from the law with its claims as a method of salvation; this He does by making His obedience and merits ours …; (3) from the law as an outward and foreign compulsion; this He does by giving us the spirit of obedience and sonship, by which the law is progressively realized within.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids, MI: Wm. B. Eerdmans publishing co., 1938), 543.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-7f3c1f8af4" data-kw="">
<blockquote><p>1. The first thing to know is that there are no good works except those works God has commanded, just as there is no sin except that which God has forbidden. Therefore, whoever wants to know what good works are as well as doing them needs to know nothing more than God’s commandments. Thus in Matthew 19[:17] Christ says, “If you would enter life, keep the commandments.” And when the young man in Matthew 19[:16–22] asks what he should do to inherit eternal life, Christ sets before him nothing else but the Ten Commandments. Accordingly, we have to learn to recognize good works from the commandments of God, and not from the appearance, size, or number of the works themselves, nor from the opinion of men or of human law or custom, as we see has happened and still happens because of our blindness and disregard of the divine commandments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann (Philadelphia: Fortress Press, 1999), 44.23.</span></figcaption>

<blockquote><p>XV. Although we acknowledge the necessity of good works against the Epicureans, we do not on this account confound the law and the gospel and interfere with gratuitous justification by faith alone. Good works are required not for living according to the law, but because we live by the gospel; not as the causes on account of which life is given to us, but as effects which testify that life has been given to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 705. (17.3.15)</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 705. (17.3.15)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXV.+Although+we+acknowledge+the+necessity+of+good+works+against+the+Epicureans%2C+we+do+not+on+this+account+confound+the+law+and+the+gospel+and+interfere+with+gratuitous+justification+by+faith+alone.+Good+works+are+required+not+for+living+according+to+the+law%2C+but+because+we+live+by+the+gospel%3B+not+as+the+causes+on+account+of+which+life+is+given+to+us%2C+but+as+effects+which+testify+that+life+has+been+given+to+us.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+705.+%2817.3.15%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f7d5f0070.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4f7d5f0070.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/10/turretin-we-do-good-works-because-we-live-by-the-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ad601a4a8b" data-kw="">
<blockquote><p>Disputing in his Panstrat. vol. iii. book xv. chap. iii. against Bellarmine, [Chamier] teaches that the true and determinate difference between the law of works and that of faith, is the condition of works and of faith; that is, that the law of works proposes salvation, upon condition of performing the law. But the law of faith proposes it, upon condition only of believing in Christ. Lest, however he should leave any thing unexplained, he observes, that conditions in contracts are of two kinds; some of which may be called antecedent, others consequent. He calls these antecedent, which give rise to the contract, according to the maxim, I give, that thou mayest give, as when one sells a field for a certain sum of money. But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only: so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete. This distinction that very learned divine applies to the present purpose, in the following manner: The law of works requires the fulfilling of the law as an antecedent condition, without which, not only no man can enter upon the possession of eternal life, but cannot so much as have a right to it. But the law of faith does not admit of works as a condition p 151 in this sense, but only in the other: viz. that by virtue of the life already given through faith, works are necessary, so that he who shows no works, falls from every right which he had, or rather seemed to have, on account of his external vocation; although otherwise, works are not the causes of the life to be given. Thus far Chamier: compare Tuckney in his Theological Prelections, p. 233.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Disputing in his Panstrat. vol. iii. book xv. chap. iii. against Bellarmine, [Chamier] teaches that the true and determinate difference between the law of works and that of faith, is the condition of works and of faith; that is, that the law of works proposes salvation, upon condition of performing the law. But the law of faith proposes it, upon condition only of believing in Christ. Lest, however he should leave any thing unexplained, he observes, that conditions in contracts are of two kinds; some of which may be called antecedent, others consequent. He calls these antecedent, which give rise to the contract, according to the maxim, I give, that thou mayest give, as when one sells a field for a certain sum of money. But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only: so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete. This distinction that very learned divine applies to the present purpose, in the following manner: The law of works requires the fulfilling of the law as an antecedent condition, without which, not only no man can enter upon the possession of eternal life, but cannot so much as have a right to it. But the law of faith does not admit of works as a condition p 151 in this sense, but only in the other: viz. that by virtue of the life already given through faith, works are necessary, so that he who shows no works, falls from every right which he had, or rather seemed to have, on account of his external vocation; although otherwise, works are not the causes of the life to be given. Thus far Chamier: compare Tuckney in his Theological Prelections, p. 233.”

— Herman Witsius, Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain, trans. Thomas Bell (Glasgow: W. Lang, 1807), 149–51.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDisputing+in+his+Panstrat.+vol.+iii.+book+xv.+chap.+iii.+against+Bellarmine%2C+%5BChamier%5D+teaches+that+the+true+and+determinate+difference+between+the+law+of+works+and+that+of+faith%2C+is+the+condition+of+works+and+of+faith%3B+that+is%2C+that+the+law+of+works+proposes+salvation%2C+upon+condition+of+performing+the+law.+But+the+law+of+faith+proposes+it%2C+upon+condition+only+of+believing+in+Christ.+Lest%2C+however+he+should+leave+any+thing+unexplained%2C+he+observes%2C+that+conditions+in+contracts+are+of+two+kinds%3B+some+of+which+may+be+called+antecedent%2C+others+consequent.+He+calls+these+antecedent%2C+which+give+rise+to+the+contract%2C+according+to+the+maxim%2C+I+give%2C+that+thou+mayest+give%2C+as+when+one+sells+a+field+for+a+certain+sum+of+money.+But+the+consequent+conditions+are+added+to+the+antecedent%2C+as+following+from+them%3A+which+indeed+are+mutual+between+the+parties%2C+but+oblige+the+one+only%3A+so+that+the+other+is+bound+to+do+no+more+on+their+account%3A+As+if+one+having+given+or+sold+a+plot+of+ground%2C+should+assign+an+annuity+to+be+laid+out+upon+the+poor.+Now+conditions+of+that+kind%2C+when+not+performed%2C+usually+disannul+the+contract%3A+and+yet+they+do+not+constitute+it.+Nay%2C+there+would+be+no+annuity%2C+except+the+sale+were+already+full+and+complete.+This+distinction+that+very+learned+divine+applies+to+the+present+purpose%2C+in+the+following+manner%3A+The+law+of+works+requires+the+fulfilling+of+the+law+as+an+antecedent+condition%2C+without+which%2C+not+only+no+man+can+enter+upon+the+possession+of+eternal+life%2C+but+cannot+so+much+as+have+a+right+to+it.+But+the+law+of+faith+does+not+admit+of+works+as+a+condition+p+151+in+this+sense%2C+but+only+in+the+other%3A+viz.+that+by+virtue+of+the+life+already+given+through+faith%2C+works+are+necessary%2C+so+that+he+who+shows+no+works%2C+falls+from+every+right+which+he+had%2C+or+rather+seemed+to+have%2C+on+account+of+his+external+vocation%3B+although+otherwise%2C+works+are+not+the+causes+of+the+life+to+be+given.+Thus+far+Chamier%3A+compare+Tuckney+in+his+Theological+Prelections%2C+p.+233.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+Conciliatory+or+Irenical+Animadversions+on+the+Controversies+Agitated+in+Britain%2C+trans.+Thomas+Bell+%28Glasgow%3A+W.+Lang%2C+1807%29%2C+149%E2%80%9351.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fad601a4a8b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ad601a4a8b.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/09/witsius-law-works-law-faith-antecedent-consequent-conditions/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>God requires humiliation indeed afore, because men will not believe else; and he requires obedience after, as that which necessarily follows upon faith, so as a man cannot truly believe but it will follow, as heat follows light. Yet, upon believing, the bargain is struck up; and though faith be the great instrument, yet we say withal, that works are necessary to be in the person justified, yet not to justify. Thus heat is as necessarily in the sun as light; yet it makes not day by its heat, but by its light. Works of new obedience are required as necessary to the possession of salvation, but faith is that alone which puts us into a condition of having the title and right to it, by the blood and righteousness of Christ. Obedience is necessarily required in all that are made sons, and so cry, ‘Abba, Father;’ for if he be a father, where is his honour? But it is faith alone that makes us sons, Gal. 3:26. And though we are as necessarily ordained to sanctification, as to faith and to salvation through both, 2 Thes. 2:13, by which, as the necessary way, we come and are brought to salvation as the goal, yet it is by faith alone that we are put into that estate: Eph. 2:8, 9, ‘By grace ye are saved through faith, and that not of works,’ etc. Then might some say, works are not required; yes, says the apostle, as a necessary means you are ordained to come to salvation by, which is the end of your faith, and which are a necessary condition of that estate, though faith alone puts us into it; for he adds, ver. 10, ‘We are his workmanship, created to good works, which God hath ordained we should walk in.’ They are the condition of the subject that shall be saved, who must be made meet, not the condition of the promise of salvation itself. They are the condition of faith, or of the person believing; but as sight is that which saves us in heaven, by which we have all our happiness communicated to us, so is it faith that saves us here.</p></blockquote>

<blockquote><p>6. What condition is attached to the covenant of grace? The condition attached to the covenant of grace is faith in Jesus Christ. 13. Why Should a Christian want to obey the law of God as an evidence of the truth of his faith and thankfulness to God. A Christian should want to obey the law of God as an evidence of the truth of his faith and thankfulness to God. 14. What other reason is there why a Christian should want to obey the law of God? A Christian should want to obey because that is “the way which God hath appointed to salvation.” This does not mean that obeying God’s law is any part of the ground of our salvation, but that being saved from sin unto righteousness, obedience to the law is the way that God has appointed for a saved person to walk in, and the person who is saved will want to forsake sin and follow righteousness more and more.</p></blockquote>

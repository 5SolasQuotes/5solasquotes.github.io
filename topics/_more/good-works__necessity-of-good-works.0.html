<blockquote><p>Justification is such a work as is at once completed in all the causes, and the whole effect of it, though not as unto the full possession of all that it gives right and title unto.</p></blockquote>

</figure><figure class="quote" id="q-4bfd89dcb1" data-kw="">
<blockquote><p>2. Good works are the way in which God hath appointed us to walk in order to our obtaining eternal life.–They are via ad regnum [the way to the kingdom], the path of life, ‘the way to God’s kingdom,’ the work we are to do ere we receive our reward, the race we are to run ere we be crowned [following Voet &amp; Rutherford, 1 Cor. 9:24-25; Heb. 12:1]. Though God save us not for them as meritorious causes of his saving us, yet those that are capable of doing them he doth not ordinarily save without them: [quotes Eph. 2:10 &amp; Heb. 12:14] Though eternal glory be not, as hath been proved, properly a reward, nor God’s giving it an act of strict justice; yet God hath, we acknowledge, determined to give it, per modum praemii, ‘after the manner of a reward;’ in that he will not give men the glory he intends them till they have done him some service; not treat them as conquerers who never fought his battle; not respect them as faithful servants who have been sluggards or loiterers. The ‘sanctification of the Spirit,’ as well as the ‘belief of the truth,’ must go before salvation, ‘because God hath from the beginning chosen us to salvation’ by the one as well as the other. (2 Thess. 2:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-veal.html">Edward Veal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Good Works of Believers be Meritorious of Salvation: Negatum Est [It is Denied]’, pp. 213-214 in Puritan Sermons, 1659-1689, vol. 6</cite></span></figcaption>

</figure><figure class="quote" id="q-24a4706bdb" data-kw="">
<blockquote><p>From this come three periods of justification that should be diligently observed here, namely 1: The period of establishment, by which man is first justified: in this occasion not only is efficacy of works excluded for acquiring justification, but so is the very presence of these works in so far as God justifies the sinner and the wicked. 2: The period of continuation: in this occasion, although no efficacy of good works is granted for justification, the presence of these same works, nevertheless, is required. And it is probably in this sense that James denies that we are justified by faith along but he requires works in addition. And lastly 3: The period of consummation in which the right unto eternal life, granted under the first period and continued under the second, is advanced even to the possession of eternal life: in this occasion not only is the presence of good works required, but also, in a certain sense, their efficacy, in so far as God, whose law we attain just now through the merit alone of Christ, does not want to grant possession of eternal life, unless [it is] beyond faith with good works previously performed. We received once before the right unto eternal life through the merit of Christ alone. But God does not want to grant possession of eternal life, unless there are, next to faith, also good works which precede this possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As given in Mark Jones, Antinomianism: Reformed Theology’s Unwelcome Guest (P&amp;R, 2013)</cite></span></figcaption>

</figure><figure class="quote" id="q-ba5c800737" data-kw="">
<blockquote><p>II. There are three principal opinions about the necessity of good works…; The third is that of those who (holding the middle ground between these two extremes) neither simply deny, nor simply assert; yet they recognize a certain necessity for them against the Libertines, but uniformly reject the necessity of merit against the Romanists. This is the opinion of the orthodox. III. Hence it is evident that the question here does not concern the necessity of merit, causality, and efficiency—whether good works are necessary to effect salvation or to acquire it by right. (For this belongs to another controversy, of which hereafter). Rather the question concerns the necessity of means, of presence and of connection or order—Are they required as the means and way for possessing salvation? This we hold. IV. Although the proposition concerning the necessity of good works to salvation (which was thrust forward in a former century by the Romanists under the show of a reconciliation in the Intermistic formula, but really that imperceptibly the purity of the doctrine concerning justification might be corrupted) was rejected by various Lutheran theologians as less suitable and dangerous; nay, even by some of our theologians; still we think with others that it can be retained without danger if properly explained. We also hold that it should be pressed against the license of the Epicureans so that although works may be said to contribute nothing to the acquisition of our salvation, still they should be considered necessary to the obtainment of it, so that no one can be saved without them–that thus our religion may be freed from those most foul calumnies everywhere cast mot unjustly upon it by the Romanists (as if it were the mistress of impiety and the cushion of carnal licentiousness and security)… VII. And as to the covenant, everyone knows that it consists of two parts: on the one hand the promise on the part of God; on the other the stipulation of obedience on the part of man…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, vol 2, 17th Topic, Third Question: ‘The Necessity of Good Works; Are good works necessary to salvation? We affirm.’</cite>, p. 703</span></figcaption>

</figure><figure class="quote" id="q-b1e37abc84" data-kw="">
<blockquote><p>We must accurately distinguish between a right to life, and the possession of life. The former must so be assigned to the obedience of Christ, that all the value of our holiness may be entirely excluded. But certainly our works, or rather these, which the Spirit of Christ worketh in us, and by us, contribute something to the latter… III. 1st, Scripture teacheth that man must do something, that he may obtain the possession of the salvation purchased by Christ. “Labour, (said he) for the meat which endureth unto everlasting life,” which indeed he interprets afterwards of faith, but so, that there he plainly reduces it to the catalogue of works; for justification is not the subject, John 6:27-29. And Paul expressly says, “Work out your own salvation with fear and trembling,” Phil. 2:12. And again, “Therefore my beloved brethren, be ye stedfast, immoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.” 1 Cor. 15:58 IV. Neither because Christ is the way to life, is the practice of Christian piety therefore not the way to life. Christ is the way to life, because he purchased us a right to life. The practice of Christian piety is the way to life, because thereby we go to the possession of the right obtained by Christ. For it is more than a hundred times designed by the name of life: again the way of righteousness, the good way, the way of peace; yea, that nothing might be wanting, it is called the way of life and salvation. Prov. 6:23, “The commandment is a lamp, and the law is light, and reproofs of instruction are the way of life.” And 10:17, “He is in the way unto life who keepeth instruction.” 15:24, “The way of life is above to the wise.” Ps. 50:23, “Whoso ordereth his way, I will cause him to enjoy the salvation of God.” And what does Christ himself understand by that narrow way which leadeth unto life, Mt. 7:14, but the strict practice of Christian religion? which is called the way of salvation, Acts 16:17.</p></blockquote>

ligion? which is called the way of salvation, Acts 16:17.”

</figure><figure class="quote" id="q-d21cecd958" data-kw="">
<blockquote><p>But of course good works are necessary as the God-appointed road, on which by grace we are to attain to the possession of eternal life. This naturally can hold not for those elect who die at an age of minority or at the beginning of their rebirth, but only for those who have time and opportunity for good works.</p></blockquote>

</figure><figure class="quote" id="q-bcf1d08e49" data-kw="">
<blockquote><p>…Good works are necessary to salvation, not as a cause to an effect, or as if they merited a reward, but as a part of salvation itself, or as an antecedent to a consequent, or as a means without which we cannot obtain the end. In the same way we may also say, that good works are necessary to righteousness or justification, or in them that are to be justified, viz.: as a consequence of justification, with which regeneration is inseparably connected…. We may more safely and correctly say, That good works are necessary in them that are justified, and that are to be saved…. Augustine has correctly said: Good works do not precede them that are to be justified, but follow them that are justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Why Good Works are to be Done, or why they are Necessary?’, p. 485 in section 5 of Question 91 of the Heidelberg Catechism in The Commentary of Zacharias Ursinus on the Heidelberg Catechism (Cincinnati, 1851)</cite></span></figcaption>

<blockquote><p>Lastly I answer that the ground of the former objection is erroneous, namely that the promise of salvation depends on the condition of our works: because the Scripture says it is made and accomplished on man’s part freely. I grant indeed that to the promise there is annexed a condition of faith: yet faith must not here be considered as a work, but as an instrument apprehending Christ with his benefits: and withal, repentance with the fruits thereof are on our part required, yet no otherwise but as they are necessary consequents of faith and the signs and documents thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Conscience, ch. 3, Of the kinds of conscience: and of conscience-regenerate, p. 880 appended to A Golden Chain... (Cambridge, 1600)</cite></span></figcaption>

</figure><figure class="quote" id="q-f9786c0af2" data-kw="">
<blockquote><p>The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-alsted.html">Henry Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in Part 4, Controversies with the Papists in Polemical Theology… in Seven Parts (Hanau, Germany, 1620)</cite>, p. 496</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing].”

<blockquote><p>But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete.</p></blockquote>

<blockquote><p>Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14.</p></blockquote>

</figure><figure class="quote" id="q-3eddfe8052" data-kw="">
<blockquote><p>XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’ trans. AI (1634)</cite>, p. 9</span></figcaption>

<blockquote><p>3. Good works are necessary as a consequent that follows from its antecedent, not as an effect that follows from its cause. The Holy Spirit teaches this everywhere, because He denies that eternal life is attained by means of our good works. At the same time, He also teaches that it is impossible to see God without holiness, Heb. 12,14. 4. Eternal life will be given to those who are performing good works, but it is not given unto them because of their good works. This is evident from Mt 25,35, where it is said: ‘For I was hungry and you gave me food’ etc.</p></blockquote>

— Johannes Maccovius, ed. van Asselt, Bell, Brink, Ferwerda – Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn) Ch. 16, ‘On Good Works’, p. 136">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Good+works+are+necessary+as+a+consequent+that+follows+from+its+antecedent%2C+not+as+an+effect+that+follows+from+its+cause.+The+Holy+Spirit+teaches+this+everywhere%2C+because+He+denies+that+eternal+life+is+attained+by+means+of+our+good+works.+At+the+same+time%2C+He+also+teaches+that+it+is+impossible+to+see+God+without+holiness%2C+Heb.+12%2C14.+4.+Eternal+life+will+be+given+to+those+who+are+performing+good+works%2C+but+it+is+not+given+unto+them+because+of+their+good+works.+This+is+evident+from+Mt+25%2C35%2C+where+it+is+said%3A+%E2%80%98For+I+was+hungry+and+you+gave+me+food%E2%80%99+etc.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+ed.+van+Asselt%2C+Bell%2C+Brink%2C+Ferwerda+%E2%80%93+Scholastic+Discourse%3A+Johannes+Maccovius+%281588%E2%80%931644%29+on+Theological+and+Philosophical+Distinctions+and+Rules+%28Apeldoorn%29+Ch.+16%2C+%E2%80%98On+Good+Works%E2%80%99%2C+p.+136&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bf641e3b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8bf641e3b4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=3.%20Good%20works%20are%20necessary%20as,and%20you%20gave%20me%20food%E2%80%99%20etc." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8136242b39" data-kw="">
<blockquote><p>We acknowledge that obedience is required in a son before he come to possess his inheritance; yet that obedience, though antecedent to his possessing that inheritance, is only the way in which he is to come to it, and the means whereby he is to be fitted for it; but is not meritorious of it. There is no right to the inheritance acquired by his obedience which before he had not; though farther fitness for, and suitableness to, it there may be. The Israelites were to fight, and subdue their enemies, ere they possessed the promised land; but their right to the possession of it they had before by the promise. And who can say that they were worthy of it merely because they fought for it?</p></blockquote>

</figure><figure class="quote" id="q-d7f9c695a0" data-kw="">
<blockquote><p>And if you please further to infer that, because perseverance in sin of infidelity and impenitency, as they are the meritorious causes of damnation so they are the meritorious causes of the decree of damnation also: I think I may with as good reason take liberty to infer from the former, that seeing faith and repentance, yea and good works also are the disposing causes of salvation, therefore they are to be accounted the disposing causes of the decree of salvation, that is of our election also: And so your opinion shall appear at full and to life in his proper colors, not an hair’s breadth different, either from the Arminian heresy of late, or from the Pelagian heresy of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity (1631)</cite>, pp. 573-74</span></figcaption>

<blockquote><p>for as much as final infidelity and impenitency are the meritorious causes of damnation; but faith, repentance and good works are but the disposing causes of salvation. Yet like as God inflicts not damnation but by way of punishment, so he doth not bestow salvation, on any of ripe years, but by way of reward. Yet here also is a difference; for damnation is inflicted by way of punishment for the evil works’ sake which are committed: but salvation is not conferred by way of reward for the good works’ sake which are performed, but merely for Christ’s sake.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“for as much as final infidelity and impenitency are the meritorious causes of damnation; but faith, repentance and good works are but the disposing causes of salvation. Yet like as God inflicts not damnation but by way of punishment, so he doth not bestow salvation, on any of ripe years, but by way of reward. Yet here also is a difference; for damnation is inflicted by way of punishment for the evil works’ sake which are committed: but salvation is not conferred by way of reward for the good works’ sake which are performed, but merely for Christ’s sake.”

<blockquote><p>Now this object of his [Paul’s] praying, and praising [in Col. 1:12], was not for their justification only, but verse 10, their walking worthy of the Lord unto all well-pleasing, being fruitful in every good work, verse 11, strengthened unto all patience. This was a part of their fitness, and that holy walking conferreth a fitness and disposition for salvation to me is clear, because no unclean thing can enter within the gates of that higher City, and because that love which we have here in our way, being the same in nature, though not in degree, with that which in our country shall remain, as a part of our garland, and crown, the one must be a fit disposition to the other; and when the apostle saith “Follow peace with all men, and holiness, without which no man shall see the Lord.”</p></blockquote>

<blockquote><p>(7.) Sanctification fits for heaven: ‘Who hath called us to glory and virtue.’ 2 Pet i 3. Glory is the throne, and sanctification is the step by which we ascend to it. As you first cleanse the vessel, and then pour in the wine; so God first cleanses us by sanctification, and then pours in the wine of glory. Solomon was first anointed with oil, and then was a king. 1 Kings i 39. First God anoints us with the holy oil of his Spirit, and then sets the crown of happiness upon our head. Pureness of heart and seeing God are linked together. Matt v 8.</p></blockquote>

</figure><figure class="quote" id="q-3a7ce2b2a2" data-kw="">
<blockquote><p>None is in the way to heaven but he who, by a life of faith and the practice of those good works which are the fruits of faith, is advancing toward perfection of holiness. It is the order immutably fixed in the everlasting covenant that a man be made holy in heart and in life before he is admitted to see and enjoy God in His holy place on high. The love and practice of good works, then, in one who has an opportunity of performing them, are necessary as appointed means of disposing or preparing him for the holy enjoyments and employments of the heavenly sanctuary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 327 of Section 2, ‘Of the Necessity of Good Works’ in Ch. 12, ‘Of the Nature, Necessity and Desert of Good Works’, in A Treatise on the Law and the Gospel (Edinburgh, 1819)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-6806e030aa" data-kw="">
<blockquote><p>On the one hand, it was stated that grace only serves to restore human willpower for good and to put humans themselves to work. Good works, in that case, were definitely necessary for salvation, whether by a necessity of merit (Rome) or by a necessity of causality and effectiveness (Remonstrants). And from the antinomian side it was said objectively that the righteousness and holiness of Christ remained completely external to a person, not only in justification but also in sanctification, so that repentance, conversion, prayer for forgiveness, and good works were totally unnecessary, bore a legalistic character, and failed to do justice to the perfect sacrifice of Christ. Lutherans tried to avoid both extremes and conducted a long-lasting and vehement debate on the appropriateness or inappropriateness of the proposition ‘Good works are necessary to salvation.’… The Reformed were more moderate in their judgment, regarded the Lutheran debate as a dispute over words, and could not see the big difference between the rejected formula ‘Good works are necessary to salvation’ and another that some Lutherans (like Quenstedt and Buddeus) had approved: ‘It is impossible to be saved without good works.’ They had no objection to calling good works necessary to salvation provided this did not imply a ‘necessity of causality or merit or effectiveness’ but implied a necessity of presence of the means and ways to obtain eternal salvation. Voetius even believed that in a sense good works can be called ‘the cause of eternal life,’ that is, not a ‘meritorious’ but a ‘preparatory’ and ‘dispositional’ cause. (G. Voetius, Select Disputations, vol 5, 675 ff.) Speaking along these lines, they undoubtedly had Scripture on their side… . Good Works Sanctification manifests itself in good works, which according to the Heidelberg Catechism arise from the principle of a true faith, conform to the law of God, and are done for his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics (Baker, 2008), vol. 4, Part 1, ch. 4, ‘Passive and Active Sanctification’, pp. 254-256 Some footnotes have been omitted.</cite></span></figcaption>

</figure><figure class="quote" id="q-6ec13e2958" data-kw="">
<blockquote><p>Id circo Apostolus aperte ait, vitam aeternam esse donum Dei. Praeterea, etiam si detur, bona opera aliquo modo causas esse, propter quas recipiamur in possessionem aeternae vitae ex Dei liberalitate, quatenus scilicet unum Dei donum causa est alterius, praecedens insequentis (quemadmodum alias declarauimus) ut vocatio iustificationis, iustificatio glorificationis: tamen nullo modo dici possunt causa electionis ac praedestinationis ad aeternam vita: cum sint eius effecta, et cum nullam posterius causa esse possit efficiens prioris.</p></blockquote>

<blockquote><p>Very many passages of Holy Scriptures (of which some are adduced by Bellarmine; but almost numberless others might be added to them, Heb. 10:36; 1 Tim. 2:15; Phil. 2:12… 2 Cor. 7:10 &amp; 4:17… Rom. 8:13,17 &amp; 10:10; Mt. 25:34-35… and in verse 21 of the same chapter according to the vulgate translation… James 1:25 &amp; 2:14; Gal. 6:8… Rev. 7:14-15… most clearly demonstrate that in adult persons good works have to salvation not merely the relation ‘of order’ (as besides others, Paraeus frigidly answers)… but also a causal relation, such as is the relation of a cause efficient or aiding, after its own manner and place, to its effect.</p></blockquote>

</figure><figure class="quote" id="q-935f45ba52" data-kw="">
<blockquote><p>We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>

</figure><figure class="quote" id="q-5972dc39d0" data-kw="">
<blockquote><p>Assertion 5: Good works are understood to have a causative power for eternal life in three ways. 1. As strictly meritorious, which we reject against the papists as blasphemous, as we proved in another place. 2. That they may have an inferior and causal instrumental power conferred upon them by the grace of God, as Gisbertus Voetius says in Thersite Heautontemerumeno, section. 1, ch. 2, just as running is the cause of the attaining of a crown which is received, contending the cause of the victory, and diet is a cause of health [1 Cor. 9:24-25; Heb. 12:1]. Neither may one be said to distinguish accurately here between a means and a cause, or between a way and a cause: for while good works are means, they are not passive, but active: a means here is an inferior cause. Therefore it is said, “For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory”. Κατεργάζεται ἡμῖν, they work, they bring about a cause for us, as the Holy Spirit speaks, 2 Cor. 4:17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 532 of ’10. Whether good works are necessary as causes of justification, and therefore also of salvation? in Ch. 12, ‘On the Justification of Sinners’ in Examination of Arminianism (Utrecht, 1668)</cite></span></figcaption>

</figure><figure class="quote" id="q-555fb85697" data-kw="">
<blockquote><p>When therefore, we say that the faithful are esteemed just even in their deeds this is not stated as a cause of their salvation, and we must diligently notice that the cause of salvation is excluded from this doctrine; for, when we discuss the cause, we must look nowhere else but to the mercy of God, and there we must stop. But although works tend in no way to the cause of justification, yet, when the elect sons of God were justified freely by faith, at the same time their works are esteemed righteous by the same gratuitous liberality. Thus it still remains true, that faith without works justifies, although this needs prudence and a sound interpretation; for this proposition, that faith without works justifies is true and yet false, according to the different senses which it bears. The proposition, that faith without works justifies by itself, is false, because faith without works is void. But if the clause “without works” is joined with the word “justifies,” the proposition will be true. Therefore faith cannot justify when it is without works, because it is dead, and a mere fiction. He who is born of God is just, as John says. (1 John v. 18.) Thus faith can be no more separated from works than the sun from his heat: yet faith justifies without works, because works form no reason for our justification; but faith alone reconciles us to God, and causes him to love us, not in ourselves, but in his only-begotten Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin on Eze. 18:14-17 in Commentaries on the Prophet Ezekiel, Vol. II (Grand Rapids: Baker Book House, 1979)</cite>, p. 238</span></figcaption>

</figure><figure class="quote" id="q-458f992fb8" data-kw="">
<blockquote><p>Concerning this faith and trust, it is earnestly pleaded by many that obedience is included in it [such as Socinians and Papists]… But to suppose that a dead faith, or that faith which is dead, is that faith which is required of us in the gospel in the way of duty, is a monstrous imagination… For how impossible it is, according unto their principles who believe justification by faith alone, that justifying faith should be without a sincere purpose of heart to obey God in all things, I shall briefly declare. For, First… to suppose such a grace dead, inactive, unfruitful, not operative unto the great end of the glory of God, and the transforming of the souls of them that receive it into his image, is a reflection on the wisdom, goodness, and love of God Himself. Secondly, That this grace is in them a principle of spiritual life, which in the habit of it, as resident in the heart, is not really distinguished from that of all other grace whereby we live to God. So, that there should be faith habitually in the heart,–I mean that evangelical faith we inquire after,–or actually exercised, where there is not a habit of all other graces, is utterly impossible. Neither is it possible that there should be any exercise of this faith unto justification, but where the mind is prepared, disposed, and determined unto universal obedience. And therefore, Thirdly, It is denied that any faith, trust, or confidence, which may be imagined, so as to be absolutely separable from, and have its whole nature consistent with, the absence of all other graces, is that faith which is the especial gift of God, and which in the gospel is required of us in a way of duty… Wherefore we say, the faith whereby we are justified, is such as it not found in any but those who are made partakers of the Holy Ghost, and by him united unto Christ; whose nature is renewed, and in whom there is a principle of all grace, and purpose of obedience. Only we say, it is not any other grace, as charity and the like, nor any obedience, that gives life and form unto this faith; but it is this faith that gives life and efficacy unto all other graces, and form unto all evangelical obedience. Neither doth any thing hence accrue unto our adversaries, who would have all those graces which are, in their root and principle, at least, present in all that are to be justified, to have the same influence unto our justification as faith hath… the nature of no other grace is capable of that office which is assigned unto faith in our justification, nor can be assumed into a society in operation with it,–namely, to receive Christ, and the promises of life by him, and to give glory unto God on their account… And this, in particular, is to be affirmed of repentance; concerning which it is most vehemently urged, that it is of the same necessity unto our justification as faith is. For this they say is easily proved, from testimonies of Scripture innumerable, which call all men to repentance that will be saved… But that which they have to prove is not that it is of the same necessity with faith unto them that are to be justified, but that it is of the same use with faith in their justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification by Faith, ch. 2, ‘The Nature of Justifying Faith’</cite>, pp. 103-5 in Works, vol. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Concerning this faith and trust, it is earnestly pleaded by many that obedience is included in it [such as Socinians and Papists]… But to suppose that a dead faith, or that faith which is dead, is that faith which is required of us in the gospel in the way of duty, is a monstrous imagination… For how impossible it is, according unto their principles who believe justification by faith alone, that justifying faith should be without a sincere purpose of heart to obey God in all things, I shall briefly declare. For, First… to suppose such a grace dead, inactive, unfruitful, not operative unto the great end of the glory of God, and the transforming of the souls of them that receive it into his image, is a reflection on the wisdom, goodness, and love of God Himself. Secondly, That this grace is in them a principle of spiritual life, which in the habit of it, as resident in the heart, is not really distinguished from that of all other grace whereby we live to God. So, that there should be faith habitually in the heart,–I mean that evangelical faith we inquire after,–or actually exercised, where there is not a habit of all other graces, is utterly impossible. Neither is it possible that there should be any exercise of this faith unto justification, but where the mind is prepared, disposed, and determined unto universal obedience. And therefore, Thirdly, It is denied that any faith, trust, or confidence, which may be imagined, so as to be absolutely separable from, and have its whole nature consistent with, the absence of all other graces, is that faith which is the especial gift of God, and which in the gospel is required of us in a way of duty… Wherefore we say, the faith whereby we are justified, is such as it not found in any but those who are made partakers of the Holy Ghost, and by him united unto Christ; whose nature is renewed, and in whom there is a principle of all grace, and purpose of obedience. Only we say, it is not any other grace, as charity and the like, nor any obedience, that gives life and form unto this faith; but it is this faith that gives life and efficacy unto all other graces, and form unto all evangelical obedience. Neither doth any thing hence accrue unto our adversaries, who would have all those graces which are, in their root and principle, at least, present in all that are to be justified, to have the same influence unto our justification as faith hath… the nature of no other grace is capable of that office which is assigned unto faith in our justification, nor can be assumed into a society in operation with it,–namely, to receive Christ, and the promises of life by him, and to give glory unto God on their account… And this, in particular, is to be affirmed of repentance; concerning which it is most vehemently urged, that it is of the same necessity unto our justification as faith is. For this they say is easily proved, from testimonies of Scripture innumerable, which call all men to repentance that will be saved… But that which they have to prove is not that it is of the same necessity with faith unto them that are to be justified, but that it is of the same use with faith in their justification.”

— John Owen, Justification by Faith, ch. 2, ‘The Nature of Justifying Faith’, pp. 103-5 in Works, vol. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcerning+this+faith+and+trust%2C+it+is+earnestly+pleaded+by+many+that+obedience+is+included+in+it+%5Bsuch+as+Socinians+and+Papists%5D%E2%80%A6+But+to+suppose+that+a+dead+faith%2C+or+that+faith+which+is+dead%2C+is+that+faith+which+is+required+of+us+in+the+gospel+in+the+way+of+duty%2C+is+a+monstrous+imagination%E2%80%A6+For+how+impossible+it+is%2C+according+unto+their+principles+who+believe+justification+by+faith+alone%2C+that+justifying+faith+should+be+without+a+sincere+purpose+of+heart+to+obey+God+in+all+things%2C+I+shall+briefly+declare.+For%2C+First%E2%80%A6+to+suppose+such+a+grace+dead%2C+inactive%2C+unfruitful%2C+not+operative+unto+the+great+end+of+the+glory+of+God%2C+and+the+transforming+of+the+souls+of+them+that+receive+it+into+his+image%2C+is+a+reflection+on+the+wisdom%2C+goodness%2C+and+love+of+God+Himself.+Secondly%2C+That+this+grace+is+in+them+a+principle+of+spiritual+life%2C+which+in+the+habit+of+it%2C+as+resident+in+the+heart%2C+is+not+really+distinguished+from+that+of+all+other+grace+whereby+we+live+to+God.+So%2C+that+there+should+be+faith+habitually+in+the+heart%2C%E2%80%93I+mean+that+evangelical+faith+we+inquire+after%2C%E2%80%93or+actually+exercised%2C+where+there+is+not+a+habit+of+all+other+graces%2C+is+utterly+impossible.+Neither+is+it+possible+that+there+should+be+any+exercise+of+this+faith+unto+justification%2C+but+where+the+mind+is+prepared%2C+disposed%2C+and+determined+unto+universal+obedience.+And+therefore%2C+Thirdly%2C+It+is+denied+that+any+faith%2C+trust%2C+or+confidence%2C+which+may+be+imagined%2C+so+as+to+be+absolutely+separable+from%2C+and+have+its+whole+nature+consistent+with%2C+the+absence+of+all+other+graces%2C+is+that+faith+which+is+the+especial+gift+of+God%2C+and+which+in+the+gospel+is+required+of+us+in+a+way+of+duty%E2%80%A6+Wherefore+we+say%2C+the+faith+whereby+we+are+justified%2C+is+such+as+it+not+found+in+any+but+those+who+are+made+partakers+of+the+Holy+Ghost%2C+and+by+him+united+unto+Christ%3B+whose+nature+is+renewed%2C+and+in+whom+there+is+a+principle+of+all+grace%2C+and+purpose+of+obedience.+Only+we+say%2C+it+is+not+any+other+grace%2C+as+charity+and+the+like%2C+nor+any+obedience%2C+that+gives+life+and+form+unto+this+faith%3B+but+it+is+this+faith+that+gives+life+and+efficacy+unto+all+other+graces%2C+and+form+unto+all+evangelical+obedience.+Neither+doth+any+thing+hence+accrue+unto+our+adversaries%2C+who+would+have+all+those+graces+which+are%2C+in+their+root+and+principle%2C+at+least%2C+present+in+all+that+are+to+be+justified%2C+to+have+the+same+influence+unto+our+justification+as+faith+hath%E2%80%A6+the+nature+of+no+other+grace+is+capable+of+that+office+which+is+assigned+unto+faith+in+our+justification%2C+nor+can+be+assumed+into+a+society+in+operation+with+it%2C%E2%80%93namely%2C+to+receive+Christ%2C+and+the+promises+of+life+by+him%2C+and+to+give+glory+unto+God+on+their+account%E2%80%A6+And+this%2C+in+particular%2C+is+to+be+affirmed+of+repentance%3B+concerning+which+it+is+most+vehemently+urged%2C+that+it+is+of+the+same+necessity+unto+our+justification+as+faith+is.+For+this+they+say+is+easily+proved%2C+from+testimonies+of+Scripture+innumerable%2C+which+call+all+men+to+repentance+that+will+be+saved%E2%80%A6+But+that+which+they+have+to+prove+is+not+that+it+is+of+the+same+necessity+with+faith+unto+them+that+are+to+be+justified%2C+but+that+it+is+of+the+same+use+with+faith+in+their+justification.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Justification+by+Faith%2C+ch.+2%2C+%E2%80%98The+Nature+of+Justifying+Faith%E2%80%99%2C+pp.+103-5+in+Works%2C+vol.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F458f992fb8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/458f992fb8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Concerning%20this%20faith%20and%20trust%2C%20it,use%20with%20faith%20in%20their%20justification." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-69ed907ca2" data-kw="">
<blockquote><p>…we will prove that subsequent grace exists and that it is necessary for every good work. We presuppose: 1. That grace is a supernatural gift, operation, and work of God. So that it may be distinguished from nature and from natural operation and gift as the author, preserver, and governor of all nature, especially human nature; to which He gives being, which He preserves in being, which He governs by His concurrence and precursive assistance in operating, as the prime cause of all motions and operations. Acts 27:28 “For in Him we live and move and have our being.” And verse 25 “He himself gives to all life and breath and everything.</p></blockquote>

<blockquote><p>First therefore take notice what we mean by good works. We take not good works strictly, for the works of charity or liberality; nor for any external actions of religion, which may be done where the heart is not cleansed; much less for the Popish good works of supererogation: but for the graces of God’s Spirit in us, and the actions flowing from them: For, usually, with the Papists and Popish persons, good works are commonly called those superstitious and supererogant works, which God never commanded: or, if God has commanded them, they mean them as external and sensible; such as coming to church and receiving of sacraments; not internal and spiritual faith, and a contrite spirit, which are the soul of all duties: and if these be not there, the outward duties are like clothes upon a dead man, that cannot warm him, because there is no life within. Therefore much is required even to the essence of a godly work, though it be not perfect in degrees: As: 1. It must be commanded by God. 2. It must be wrought in us by the Spirit of God. All the unregenerate man’s actions, his prayers, and services are sins. 3. It must flow from an inward principle of grace, or a supernatural being in the soul, whereby a man is a new creature. 4. The end must be God’s glory. That which the most refined man can do is but a glow-worm, not a star: So that then only is the work good, when, being answerable to the rule, it’s from God, and through God, and to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants… (London: Young, 1647), Lecture 4</cite>, p. 39</span></figcaption>

d93e854d06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/d93e854d06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-good-works/#:~:text=First%20therefore%20take%20notice%20what%20we,and%20through%20God%2C%20and%20to%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-b9dec4a7a0" data-kw="">
<blockquote><p>As for the state to which sanctification brings us, we thought meet 1. To put down the manner and nature of the inclination itself, in the apostle’s words, ‘zealous of good works,’ lest any should think that the external work is all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’</cite>, p. 25</span></figcaption>

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+for+the+state+to+which+sanctification+brings+us%2C+we+thought+meet+1.+To+put+down+the+manner+and+nature+of+the+inclination+itself%2C+in+the+apostle%E2%80%99s+words%2C+%E2%80%98zealous+of+good+works%2C%E2%80%99+lest+any+should+think+that+the+external+work+is+all.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98A+Brief+Explication+of+some+Passages+in+the+Profession%E2%80%99%2C+p.+25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb9dec4a7a0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b9dec4a7a0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-good-works/#:~:text=As%20for%20the%20state%20to%20which,that%20the%20external%20work%20is%20all." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-757e8a0bda" data-kw="">
<blockquote><p>The righteousness required by the Moral Law is of two sorts: 1. Habitual [an abiding inward disposition], in the inherent holiness of man’s whole person, when such gracious qualities are fixed and planted in every faculty of soul and body: as do dispose and incline the motions of both only unto that which is conformable to the righteousness of the Law. That such righteousness is required by the Law is a plain case and confessed; That which commands the good or forbids the evil action does command the virtuous and forbid the vicious habit too. He that looks for purity in the stream cannot but dislike poison in the fountain: and God that commands us to do good, bids us also to be holy; nor can we do the one, unless we do the other. And therefore the apostle joins both together. The end of the commandment is love, (but where?) out of a pure heart, 1 Tim. 1:5. 2. Actual, in the exercise of all good works enjoined by the Law, and forbearing the contrary evil works. Whether these good or evil works be inward in that spiritual obedience which the Law required; (viz.) in the right ordering of all the motions of our souls, that every one of our thoughts, imaginations, purposes of our mind, and all the secret workings and stirrings of our affections, be altogether employed upon piety and charity, not so much as touching upon any thing that is contrary to the love of God or our neighbor. Or, whether these good and evil works be outward in the bodily obedience unto the Law, in doing all and every external duty of religion towards God: of justice and mercy towards man; and in leaving undone the contrary. Further this actual righteousnesse of the Law is to be considered two ways: 1. As it respects all the commandments, and so that righteousness is only perfect, which fulfils all and every particular precept of the Law. 2. As it respects any one commandment, or any one duty therein contained. And so we may call that righteousness perfect, which exactly performs any one point of the Law, though it fail in others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith… 1st ed. (Oxford, 1625), section 3, ch. 1</cite>, pp. 66-67</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The righteousness required by the Moral Law is of two sorts: 1. Habitual [an abiding inward disposition], in the inherent holiness of man’s whole person, when such gracious qualities are fixed and planted in every faculty of soul and body: as do dispose and incline the motions of both only unto that which is conformable to the righteousness of the Law. That such righteousness is required by the Law is a plain case and confessed; That which commands the good or forbids the evil action does command the virtuous and forbid the vicious habit too. He that looks for purity in the stream cannot but dislike poison in the fountain: and God that commands us to do good, bids us also to be holy; nor can we do the one, unless we do the other. And therefore the apostle joins both together. The end of the commandment is love, (but where?) out of a pure heart, 1 Tim. 1:5. 2. Actual, in the exercise of all good works enjoined by the Law, and forbearing the contrary evil works. Whether these good or evil works be inward in that spiritual obedience which the Law required; (viz.) in the right ordering of all the motions of our souls, that every one of our thoughts, imaginations, purposes of our mind, and all the secret workings and stirrings of our affections, be altogether employed upon piety and charity, not so much as touching upon any thing that is contrary to the love of God or our neighbor. Or, whether these good and evil works be outward in the bodily obedience unto the Law, in doing all and every external duty of religion towards God: of justice and mercy towards man; and in leaving undone the contrary. Further this actual righteousnesse of the Law is to be considered two ways: 1. As it respects all the commandments, and so that righteousness is only perfect, which fulfils all and every particular precept of the Law. 2. As it respects any one commandment, or any one duty therein contained. And so we may call that righteousness perfect, which exactly performs any one point of the Law, though it fail in others.”

<blockquote><p>…you must know therefore that righteousness is no proper real being, but a modus entis, ‘the modification of a being’. The subject of it is: 1. an action, 2. or a person. An action is the primary subject, and so the disposition; and the person secondary, as being therefore righteous, because his disposition and actions are so. Righteousness is the conformity of dispositions and actions, and consequently the person to the rule prescribed. It is not a being distinct therefore from the dispositions and actions, but their just and well being. This [de]finition is only of the creatures’ righteousness. God is the Primum Iustum, and so the rule of righteousness to the creature, and has no rule but Himself for the measuring of his actions. Yet his essence is too far above us, remote and unknown to be this rule to the creature, therefore has He given us his laws, which flow from his perfection, and they are the immediate rule of our dispositions and actions and so of our righteousness. Here carefully observe, that this law has two parts: 1. The precept and prohibition prescribing and requiring duty: 2. The promise and commination [threatening] determining of the reward of obedience, and penalty of disobedience. As the precept is the principal part, and the penalty annexed but for the precept’s sake; so the primary intent of the lawgiver is the obeying of his precepts, and our suffering of the penalty is but a secondary for the attaining of the former. So is there accordingly a two-fold Righteousness or fulfilling of this law, (which is the thing I would have observed): the primary, most excellent and most proper Righteousness lies in the conformity of our actions to the precept: The secondary, less excellent righteousness) yet fitly enough so called) (see Pemble, Of Justification, p. 2) is, when though we have broke the precepts, yet we have satisfied for our breach, either by our own suffering, or some other way.</p></blockquote>

<blockquote><p>Things commanded, in the unregenerate are sins, because although the actions and doings of those things are commanded, yet the person, from whom those actions proceed, pleases not God, neither is reconciled unto God. Further, that which the unregenerate do, they do it not to that end, whereunto they ought, that is, to the glory of God, neither is their action grounded of faith. For they know not whether or no they have God favorable to them, or whether that be pleasing unto Him which they do. But these conditions and circumstances are necessarily required to a good work: for it suffices not to do good works after a civil manner. Those civil works indeed are good, as they proceed from God: but as they are in unregenerate men, they are evil: even as it is sin, when a wicked man gives alms: because it proceeds not from the love of God and therefore not from faith, neither is referred unto God’s glory. But yet those things which men do being forbidden in the Law of God are of themselves and properly sins, because the nature or definition of sin doth properly agree unto them: which is, that they are done against the express commandment of God. And therefore in the Scripture things which are so done of men, are ever called evil, but never good. But those things which are commanded of God, when they are done by the unregenerate, or in hypocrisy, they are so discommended, as yet nevertheless they are counted and praised for good: and that not only in respect of God, who is the efficient of those things in men, in respect of whom all the actions of the wicked are just: but also in respect of the men themselves by whom they are done, so that they also are said to have done well, as 1 Kings 21, ‘Seest thou how Ahab is humbled before me? Because he submits himself before Me, I will not bring that evil in his days. And 2 Kn. 10, ‘The Lord said unto Jehu: Behold, because thou hast diligently executed that which was right in my eyes etc.</p></blockquote>

<blockquote><p>19. In this life they [powers of human choice] avail nothing without the help of God, whether general or special. 20. General help is called the general motion of divine providence by which all things are governed and preserved. Acts 17:28; Heb. 1:3. 21. Special help is called the particular grace that moves, strengthens, and advances unto action. 22. And this is either apart from regenerating grace, by which God distributes moral gifts and moral virtues to whom he wills, even to the reprobate (1 Cor. 12), or it is joined with regenerating grace, that is, the saving grace of Christ, of which it is said in Jn. 15:5 and 1 Cor. 15:10. 23. I say that the powers of human choice (vires humani arbitrii) avail nothing in themselves, neither in earthly matters nor in heavenly matters. 24. I call earthly matters those things which pertain only to earthly life. 25. And these are either natural or moral. 26. Natural things are called those which are common to all living beings, such as eating, drinking, sleeping, walking, procreating, etc. 27. Moral things are called political or civil matters which pertain to establishing and preserving human life, household management, society, and the commonwealth—such as buying, selling, administering justice, serving in the military, cultivating peace, governing a family, learning the sciences and arts whether liberal or mechanical, etc. 28. Heavenly matters are those things which pertain to the heavenly and spiritual life in the kingdom of Christ, such as believing in God, calling upon God, doing the will of God, fulfilling the commandments of God, etc. These are also called spiritual matters, matters pertaining to salvation, pious, Christian, and religious matters. … 38. After the fall, choice, both regenerate and unregenerate, can choose and accomplish no natural things without the general help of God. 39. Much less is it able to choose and pursue political matters without the general help of God. 40. Indeed, it cannot desire and pursue moral virtues, disciplines, and arts without the special help of God, who in his goodness bends the will and supplies strength.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Choice of Man’, pt. 1 &amp; 2 (Basel: Waldkirchius, 1597) trans. at Obedientia Mortis Christi Latin</cite></span></figcaption>

— Amandus Polanus, ‘Theological Theses on the Choice of Man’, pt. 1 &amp; 2 (Basel: Waldkirchius, 1597) trans. at Obedientia Mortis Christi Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C19.+In+this+life+they+%5Bpowers+of+human+choice%5D+avail+nothing+without+the+help+of+God%2C+whether+general+or+special.+20.+General+help+is+called+the+general+motion+of+divine+providence+by+which+all+things+are+governed+and+preserved.+Acts+17%3A28%3B+Heb.+1%3A3.+21.+Special+help+is+called+the+particular+grace+that+moves%2C+strengthens%2C+and+advances+unto+action.+22.+And+this+is+either+apart+from+regenerating+grace%2C+by+which+God+distributes+moral+gifts+and+moral+virtues+to+whom+he+wills%2C+even+to+the+reprobate+%281+Cor.+12%29%2C+or+it+is+joined+with+regenerating+grace%2C+that+is%2C+the+saving+grace+of+Christ%2C+of+which+it+is+said+in+Jn.+15%3A5+and+1+Cor.+15%3A10.+23.+I+say+that+the+powers+of+human+choice+%28vires+humani+arbitrii%29+avail+nothing+in+themselves%2C+neither+in+earthly+matters+nor+in+heavenly+matters.+24.+I+call+earthly+matters+those+things+which+pertain+only+to+earthly+life.+25.+And+these+are+either+natural+or+moral.+26.+Natural+things+are+called+those+which+are+common+to+all+living+beings%2C+such+as+eating%2C+drinking%2C+sleeping%2C+walking%2C+procreating%2C+etc.+27.+Moral+things+are+called+political+or+civil+matters+which+pertain+to+establishing+and+preserving+human+life%2C+household+management%2C+society%2C+and+the+commonwealth%E2%80%94such+as+buying%2C+selling%2C+administering+justice%2C+serving+in+the+military%2C+cultivating+peace%2C+governing+a+family%2C+learning+the+sciences+and+arts+whether+liberal+or+mechanical%2C+etc.+28.+Heavenly+matters+are+those+things+which+pertain+to+the+heavenly+and+spiritual+life+in+the+kingdom+of+Christ%2C+such+as+believing+in+God%2C+calling+upon+God%2C+doing+the+will+of+God%2C+fulfilling+the+commandments+of+God%2C+etc.+These+are+also+called+spiritual+matters%2C+matters+pertaining+to+salvation%2C+pious%2C+Christian%2C+and+religious+matters.+%E2%80%A6+38.+After+the+fall%2C+choice%2C+both+regenerate+and+unregenerate%2C+can+choose+and+accomplish+no+natural+things+without+the+general+help+of+God.+39.+Much+less+is+it+able+to+choose+and+pursue+political+matters+without+the+general+help+of+God.+40.+Indeed%2C+it+cannot+desire+and+pursue+moral+virtues%2C+disciplines%2C+and+arts+without+the+special+help+of+God%2C+who+in+his+goodness+bends+the+will+and+supplies+strength.%E2%80%9D%0A%0A%E2%80%94+Amandus+Polanus%2C+%E2%80%98Theological+Theses+on+the+Choice+of+Man%E2%80%99%2C+pt.+1+%26+2+%28Basel%3A+Waldkirchius%2C+1597%29+trans.+at+Obedientia+Mortis+Christi+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c37598d0b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7c37598d0b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-virtues-good-works-of-unbelievers/#:~:text=19.%20In%20this%20life%20they%20%5Bpowers,bends%20the%20will%20and%20supplies%20strength." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§V. As to liberty itself; there remained in the will of lapsed man: 1. Immunity from the necessity of coaction, or external violence, by reason of elicited acts. 2. Immunity from internal physical necessity. 3. The liberty of exercise or of contradiction, which is between willing or not willing; loving or not loving; acting or not acting. 4. The liberty of specification, by which the will, from two or more things or species which can be recalled to the sphere of doable things in the state of corruption, can choose one and neglect another. §VI. The objects which pertain to the sphere of doable things in the state of reigning corruption, before conversion, are all those things which are subject to the senses and to natural reason, and do not surpass human grasp. And they are: 1. Actions merely natural and animal, e.g., to eat, to drink, to be awake, to sleep, to be moved from a place, to rest. 2. The inventions or apprehensions of sciences and arts, concerning which see Calvin, Institutes, bk. 2, ch. 2, §14. 3. Civil and economic actions, such as to care for a family and the commonwealth, and in them to do or omit one’s duty. 4. Moral actions of the natural order, and those which pertain to common ethics, Rom. 2:14-15… Hence the virtues of the gentiles, produced by the general aid of God, as to their substance, are true moral virtues of the natural order, consisting of the same internal form, object, means and acts; although by reason of their mode, adjuncts, circumstances, and also their end, they often had notable defects, in respect of which Augustine calls them, by a broad signification, ‘sins’, although elsewhere he commends the virtues of the gentiles, as in Of the Spirit &amp; the Letter, ch. 27; Epistle 99 to Evodius; also Epistle 130; and the book, On the Grace of Christ, ch. 24. See Dn. D. Samuel Strimesius, Praxiologia Apodictica, ch. 7, §5; D. Johann Fabricius, Systema Theologicum, locus 3, aphorism 2, p. 277. Nor does the passage Rom. 14:23 stand in the way, for there Paul by ‘faith’ does not understand saving faith, but the dictate of conscience, by which something is judged to be licit or illicit. §VII. But to this sphere in no way pertain spiritual actions, which cannot be elicited and performed except by the Spirit of God vivifying, illuminating, acting, operating, regenerating and sanctifying in certain degrees. In respect of these, we rightly teach that the natural powers of free will are not only bound, attenuated, impeded, wounded and broken, but plainly lost, destroyed, extinguished, and null, against the Pelagians, Semi-Pelagians, Socinians, Remonstrants, Mennonites; and in part also the Greeks, Synergists and Pontificists, of whom see Bellarmine, bk. 6 of On the Loss of Grace &amp; the State of Sin, ch. 16; Coster, Enchiridion, ch. 5, p. 190. §VIII. Against whom we assert that unregenerate man in the state of dominant corruption, or before his conversion, has from himself no natural powers, whether in the intellect or in the will, for… keep[ing] the precepts of God, and do[ing] good works, pleasing to God and saving for himself.</p></blockquote>

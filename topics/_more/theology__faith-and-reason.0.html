<figure class="quote" id="q-1119b32edf" data-kw="">
<blockquote><p>…views like Ockham’s prefigured themes that would come to define modern philosophy, and modern civilization more generally. The idea that only particular individual things exist and share no universal natures in common… Aristotelian metaphysics involves a number of complex distinctions which require for their expression an equally complex technical vocabulary; and this complexity only grew as Aquinas and other Aristotelian Scholastic philosophers of the Middle Ages developed Aristotle’s views further. This is unfortunate for the student of philosophy, but unavoidable given that the real world just is, Aristotelians would say, as complex as the vocabulary needed to describe it. But suppose that we interpreted this vocabulary in terms of a nominalist or conceptualist metaphysics, rather than a realist one. Then all those complicated technicalities would reflect, not objective reality, but only our subjective ideas or the way we decided to use words. The Scholastic philosophy that inherited this terminology would come to seem an exercise in mere wordplay and irrelevant hair-splitting, rather than a serious investigation of the real world. And that is exactly what happened as views like Ockham’s started to proliferate within Scholasticism. The early modern philosophers who rejected Aristotle and his Scholastic successors as mere sophists…</p></blockquote>

ef="https://reformedbooksonline.com/on-metaphysics/#:~:text=views%20like%20Ockham%E2%80%99s%20prefigured%20themes%20that,his%20Scholastic%20successors%20as%20mere%20sophists&amp;text=views%20like%20Ockham%E2%80%99s%20prefigured%20themes%20that%20would%20come&amp;text=Aristotle%20and%20his%20Scholastic%20successors%20as%20mere%20sophists" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Metaphysics is defined as the science of being qua [as] being… Metaphysics can, therefore, be described as the first real speculative science. It is a science because it is a body of demonstrated truths about a single formal object… Insofar as it is a science, metaphysics differs from sacred theology because the latter is not a science in the strict Aristotelian sense for its principles are not evident but revealed. Metaphysics is a real science, as is plain from its definition. For being signifies the same as thing or what actually exists or is at least capable of such existence. Therefore metaphysical notions are first intentions, or concepts that are predicated immediately of things themselves. So metaphysics differs from the logical sciences which deal with second intentions, that is, with concepts that are predicated immediately of other concepts or of beings of reason. Metaphysics indeed is the first or supreme real science, and so differs from other less universal real things, as physics, cosmology, psychology; for it does not just consider one or other part of reality, as these sciences do, but with the totality of things. Therefore, by reason of its material object, metaphysics is equivalent to all the real sciences taken together. Further, it is first by reason of its formal object; for the other sciences consider real things in some narrower respect, as physics considers things as changeable, cosmology things as bodily, etc. But metaphysics considers them precisely as they are real. Hence other real sciences, as cosmology, philosophy of man, presuppose metaphysics and use its conclusions as their principles. But metaphysics does not use the conclusions of any other real science, physics or natural philosophy, as principles. Metaphysics is a speculative and not practical science, because it does not tend toward any other operation but speculation. Hence it differs from ethics, which is practical.</p></blockquote>

<blockquote><p>This way of proceeding [in metaphysics] from what is simply posterior, namely from real being as we experience it, namely as contingent, caused, transient, etc. to things that are necessarily required as conditions sine qua non of its existence, can be called a sort of metaphysical reduction. It is called ‘reduction’ because the mind is as it were led back from the data of immediate experience to the conditions and hidden causes on which they depend. ‘Metaphysical’ is added because this reduction seems to differ from the reduction that the natural sciences use. For a reduction is found in these [sciences] too, namely to theories and hypotheses from which, as from conjectured conditions and causes, the effects that are empirically observed can follow. This method of the natural sciences, which is called hypothetico-deductive insofar as it regards the verification of theories, is also called ‘inventive induction’ insofar as the cultivators of the sciences create a certain theoretical law or explanation from their own mental fertility. But none of their theories is so certain that no other theory or hypothesis can be thought up, and so all such theories, although they are often not far distant from at least a practical certainty, do not go beyond probability. In metaphysics, on the contrary, when once it is conceded, for example, that some finite being is not sufficient to itself for its existence but requires some explanation outside itself, then it follows that no other theoretical explanation can be found save in something non-finite. Likewise, a caused being can be explained only by an uncaused being, a transient being by something permanent, a contingent being by something necessary, and so on through the other disjunctive attributes that are contradictorily opposed with respect to being. For although ‘caused being’ and ‘uncaused being’ are not contradictories (for there could be a third between them, namely ‘non-being’), nevertheless ‘caused’ and ‘uncaused’ are mutually contradictory in respect of the same subject, just as ‘white’ and ‘non-white’ are mutually contradictory in respect of the same man. Hence to deny that all beings are caused is the same as to assert that some being is uncaused. And in this sense there is given by metaphysical reduction not just one theory among many possible explanations, as is the case with the natural sciences, but rather, once the necessity is conceded for some explanation of the existence of observed things in something other than themselves, metaphysical reduction gives, by virtue of the law of contradiction and excluded middle, only one possible theoretical solution. And in this sense metaphysical conclusions exceed the probability found in the theories of the natural sciences. So the certitude that the metaphysician can have seems to be the highest that the human intellect can naturally achieve in any theoretical science about real [i.e. non-mental] things.</p></blockquote>

<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>

</figure><figure class="quote" id="q-9aa90c46db" data-kw="">
<blockquote><p>The quaestio in which this quote appears is ‘whether the divine being is so true that it cannot be thought not to be.’ Bonaventure believes that a condition for the possibility of any intellectual cognition is knowledge of divine esse [being], which is first in the order of concepts. Bonaventure rehearses the below argument not in his own voice, and, in his respondeo, he distinguishes senses in which it is impossible to think that the first truth does not exist.</p></blockquote>

</figure><figure class="quote" id="q-6c602e8f74" data-kw="">
<blockquote><p>Our intellect understands nothing except in virtue of the first light and truth, so every act of the intellect involved in thinking that something does not exist obtains in virtue of the first light. But it is impossible to think in virtue of the first light, that the first light or truth does not exist. Therefore, it is in no way possible to think that the first truth does not exist.</p></blockquote>

<blockquote><p>2 …but the metaphysician proves the principles of the inferior sciences in as much as if those principles are obstinately denied by anyone, he explains their terms, which having been declared and perceived by the adversary, he cannot but assent to the truth of the proposed principles, unless he be completely stripped of reason in the manner of a brute. For nothing conduces more to the confirmation of principles than the perception of the same: and nothing more helps the intellect, that it perceive principles than the understanding of the terms from which the principles are composed. Furthermore, he proves those principles a posteriori [from those things that follow], and indeed by leading the adversary through the impossible, in as much as unless he acknowledge the truth of the principles it will be necessary for him to have acknowledged the greatest absurdity resulting from the denied principles. Thus to one denying that the whole is greater than its part, it will be explained what part, what whole. If he be not yet sufficiently moved, it will be inferred from that negation, the acception of the terms having been presupposed according to the explained way, that the whole would not be whole, nor would the part be part; and thus the same would be and not be at the same time. Which, as most absurd, will not be to be admitted. 5. …All principles, of whatever genus they be, can be called first; and in what way first, in that way also they are indemonstrable. They are therefore first in as much as they do not recognize others through which they are demonstrated a priori [from things prior]. Then they are first in as much as in that science of which they are principles, they do not recognize others prior to themselves through which they are demonstrated. But what principles in their science are first can still in the order of another science be posterior and thus demonstrable, at least a posteriori, if not also a priori.</p></blockquote>

</figure><figure class="quote" id="q-2e92560358" data-kw="">
<blockquote><p>5. …And certainly, the nature of first principles requires that they not be proven, but taken for granted. 6. That habit or natural intellectual power (…since the natural power of the intellect itself, both practical and speculative, suffices [for the innate knowledge of God]; which is to establish its necessity with Thomas Aquinas in his 1st book of the Sentences, dist. 21, ad 1) comprehends the truth of principles immediately, without reasoning or proof, by a kind of simple intuition. It grasps partly theoretical principles and partly practical ones. Among the particular theoretical first principles, I place first and formost: ‘God exists’; and among the practical first principles, first and foremost: ‘God ought to be worshipped.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“5. …And certainly, the nature of first principles requires that they not be proven, but taken for granted. 6. That habit or natural intellectual power (…since the natural power of the intellect itself, both practical and speculative, suffices [for the innate knowledge of God]; which is to establish its necessity with Thomas Aquinas in his 1st book of the Sentences, dist. 21, ad 1) comprehends the truth of principles immediately, without reasoning or proof, by a kind of simple intuition. It grasps partly theoretical principles and partly practical ones. Among the particular theoretical first principles, I place first and formost: ‘God exists’; and among the practical first principles, first and foremost: ‘God ought to be worshipped.&#x27;”

</figure><figure class="quote" id="q-8a2d08d603" data-kw="">
<blockquote><p>I do not think he [the Romanist Leiden philosopher, David Stuart] wanted to stop our theologians, whether his or ours, from dealing with any questions that can be demonstrated not just from God’s Word, the first principle, but also from the light of nature and right reason, the second principle… Our [reformed] theologians should not be excluded from dealing with these same questions, since they never set aside the sciences and arts, especially logic and metaphysics, which they intensely studied in school and at home. Nor do they, above the Papists, become dull to the use of reason and the knowledge of first philosophy out of reverence for and study of the Scriptures.</p></blockquote>

</figure><figure class="quote" id="q-dc78cdef29" data-kw="">
<blockquote><p>A distinction is real (simply real) if it exists between thing and thing, for example between body and soul, between the members of the body, between cause and effect, between a faculty and its operation, between substance and accidents. A thing, at least according to Scotists, is whatever exists or can exist per se (i.e. through its own existence), and hence, if it is created, it can be directly and immediately produced by physical causality. The sign of a real distinction is separability or actual separation. Thomists, on the contrary, deny that separability is required for having a real distinction. So they say, for example, that faculties are really distinct from the soul though they cannot be separated from it. One must say the like of their real distinction between essence and existence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

>
</figure><figure class="quote" id="q-7ab555f220" data-kw="">
<blockquote><p>A distinction is formal (real in a certain respect) according to Scotists and others, if it exists between realities and formalities, for example between the soul and its faculties, between the faculties themselves, between the metaphysical essence and its properties, between the various perfections or metaphysical degrees, between the attributes of God, between the divine nature and the divine Persons, between the principle of individuation and the specific essence. A formality (or reality) is something positive included in a real being which, although it does not and cannot exist by itself, can be conceived in a clear and distinct concept in abstraction from any other formality of the same thing that it belongs to [it]. The sign of a formal distinction includes three things: a) ability to be conceived in a concept that is not only distinct but also complete and exclusive; b) such that what is conceived is not a thing but something of a thing; c) inseparability from the thing it belongs to. A formal distinction is fully defined as “a distinction in the nature of the thing that comes between several formalities identified in reality, one of which can be conceived without the other before any work of the intellect, although it cannot exist without the other even by divine power. … On the Formal Distinction Specifically This distinction is not admitted by everyone, especially among Thomists. Although it is often called a ‘Scotistic’ distinction, such a distinction was not an innovation on the part of Scotus. It is found in the whole Augustinian tradition. It is contained implicitly in the distinction ‘of attribution’ of St. Bonaventure, and explicitly in Olivi, William of Ware, Matthew of Aquasparta, William of Macclesfield, Roger Marston, Alexander of Alexandria, etc.² Scotus himself merely reduced the distinction to a scientific system, and used it as a powerful instrument of metaphysical explication. ² B. Jansen, “Beiträge zür geschichtlichen Entwicklung der Distinctio formalis,” Zeitschrift für katholische Theologie, LIII (1929) 317 ff. M. Grajewski, op. cit. ch. 6. What are the arguments commonly adduced in favor of the formal distinction? The more powerful arguments are drawn from theology. Among philosophical arguments the following can be numbered:

1. Man, on the part of the thing, formally agrees in animality with the brute; the same man, again on the part of the thing, does not agree in rationality with the same brute. Therefore animality and rationality in man, on the part of the thing, is not one and the same undistinguished perfection; otherwise man would, on the part of the thing, agree and not agree with the brute at the same time and according to altogether the same idea, which is absurd. The same argument holds if the comparison is made between man and angel or pure spirit.

2. If animality and rationality, on the part of the thing and intrinsically, were one and the same perfection, they would be absolutely inseparable; for nothing can be separated from itself; hence one would never be found without the other. But in fact they are found separated, for animality is found in the true without rationality; in an angel rationality is found without animality; and in each case formally and on the part of the thing. Therefore even in man they cannot be formally and on the part of the thing one and the same perfection.

3. Animality can be conceived and defined not only distinctly but also completely and exclusively without rationality; the same has to be said of rationality. But if our knowledge is valid and real definitions are possible, that which is conceived, even on the part of the thing, in one concept cannot be identical with what is conceived in another concept; therefore etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“A distinction is formal (real in a certain respect) according to Scotists and others, if it exists between realities and formalities, for example between the soul and its faculties, between the faculties themselves, between the metaphysical essence and its properties, between the various perfections or metaphysical degrees, between the attributes of God, between the divine nature and the divine Persons, between the principle of individuation and the specific essence. A formality (or reality) is something positive included in a real being which, although it does not and cannot exist by itself, can be conceived in a clear and distinct concept in abstraction from any other formality of the same thing that it belongs to [it]. The sign of a formal distinction includes three things: a) ability to be conceived in a concept that is not only distinct but also complete and exclusive; b) such that what is conceived is not a thing but something of a thing; c) inseparability from the thing it belongs to. A formal distinction is fully defined as “a distinction in the nature of the thing that comes between several formalities identified in reality, one of which can be conceived without the other before any work of the intellect, although it cannot exist without the other even by divine power. … On the Formal Distinction Specifically This distinction is not admitted by everyone, especially among Thomists. Although it is often called a ‘Scotistic’ distinction, such a distinction was not an innovation on the part of Scotus. It is found in the whole Augustinian tradition. It is contained implicitly in the distinction ‘of attribution’ of St. Bonaventure, and explicitly in Olivi, William of Ware, Matthew of Aquasparta, William of Macclesfield, Roger Marston, Alexander of Alexandria, etc.² Scotus himself merely reduced the distinction to a scientific system, and used it as a powerful instrument of metaphysical explication. ² B. Jansen, “Beiträge zür geschichtlichen Entwicklung der Distinctio formalis,” Zeitschrift für katholische Theologie, LIII (1929) 317 ff. M. Grajewski, op. cit. ch. 6. What are the arguments commonly adduced in favor of the formal distinction? The more powerful arguments are drawn from theology. Among philosophical arguments the following can be numbered:

1. Man, on the part of the thing, formally agrees in animality with the brute; the same man, again on the part of the thing, does not agree in rationality with the same brute. Therefore animality and rationality in man, on the part of the thing, is not one and the same undistinguished perfection; otherwise man would, on the part of the thing, agree and not agree with the brute at the same time and according to altogether the same idea, which is absurd. The same argument holds if the comparison is made between man and angel or pure spirit.

2. If animality and rationality, on the part of the thing and intrinsically, were one and the same perfection, they would be absolutely inseparable; for nothing can be separated from itself; hence one would never be found without the other. But in fact they are found separated, for animality is found in the true without rationality; in an angel rationality is found without animality; and in each case formally and on the part of the thing. Therefore even in man they cannot be formally and on the part of the thing one and the same perfection.

3. Animality can be conceived and defined not only distinctly but also completely and exclusively without rationality; the same has to be said of rationality. But if our knowledge is valid and real definitions are possible, that which is conceived, even on the part of the thing, in one concept cannot be identical with what is conceived in another concept; therefore etc.”

ibution%E2%80%99+of+St.+Bonaventure%2C+and+explicitly+in+Olivi%2C+William+of+Ware%2C+Matthew+of+Aquasparta%2C+William+of+Macclesfield%2C+Roger+Marston%2C+Alexander+of+Alexandria%2C+etc.%C2%B2+Scotus+himself+merely+reduced+the+distinction+to+a+scientific+system%2C+and+used+it+as+a+powerful+instrument+of+metaphysical+explication.+%C2%B2+B.+Jansen%2C+%E2%80%9CBeitr%C3%A4ge+z%C3%BCr+geschichtlichen+Entwicklung+der+Distinctio+formalis%2C%E2%80%9D+Zeitschrift+f%C3%BCr+katholische+Theologie%2C+LIII+%281929%29+317+ff.+M.+Grajewski%2C+op.+cit.+ch.+6.+What+are+the+arguments+commonly+adduced+in+favor+of+the+formal+distinction%3F+The+more+powerful+arguments+are+drawn+from+theology.+Among+philosophical+arguments+the+following+can+be+numbered%3A+1.+Man%2C+on+the+part+of+the+thing%2C+formally+agrees+in+animality+with+the+brute%3B+the+same+man%2C+again+on+the+part+of+the+thing%2C+does+not+agree+in+rationality+with+the+same+brute.+Therefore+animality+and+rationality+in+man%2C+on+the+part+of+the+thing%2C+is+not+one+and+the+same+undistinguished+perfection%3B+otherwise+man+would%2C+on+the+part+of+the+thing%2C+agree+and+not+agree+with+the+brute+at+the+same+time+and+according+to+altogether+the+same+idea%2C+which+is+absurd.+The+same+argument+holds+if+the+comparison+is+made+between+man+and+angel+or+pure+spirit.+2.+If+animality+and+rationality%2C+on+the+part+of+the+thing+and+intrinsically%2C+were+one+and+the+same+perfection%2C+they+would+be+absolutely+inseparable%3B+for+nothing+can+be+separated+from+itself%3B+hence+one+would+never+be+found+without+the+other.+But+in+fact+they+are+found+separated%2C+for+animality+is+found+in+the+true+without+rationality%3B+in+an+angel+rationality+is+found+without+animality%3B+and+in+each+case+formally+and+on+the+part+of+the+thing.+Therefore+even+in+man+they+cannot+be+formally+and+on+the+part+of+the+thing+one+and+the+same+perfection.+3.+Animality+can+be+conceived+and+defined+not+only+distinctly+but+also+completely+and+exclusively+without+rationality%3B+the+same+has+to+be+said+of+rationality.+But+if+our+knowledge+is+valid+and+real+definitions+are+possible%2C+that+which+is+conceived%2C+even+on+the+part+of+the+thing%2C+in+one+concept+cannot+be+identical+with+what+is+conceived+in+another+concept%3B+therefore+etc.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+Little+Summary+of+Metaphysics%2C+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29%2C+ch.+2%2C+On+the+Attributes+in+General+%26+on+%E2%80%98One%E2%80%9D%2C+Article+4%2C+%E2%80%98On+Identity+%26+Distinction%E2%80%99%2C+pp.+30-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ab555f220.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7ab555f220.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=A%20distinction%20is%20formal%20%28real%20in,conceived%20in%20another%20concept%3B%20therefore%20etc&amp;text=A%20distinction%20is%20formal%20%28real%20in%20a%20certain&amp;text=what%20is%20conceived%20in%20another%20concept%3B%20therefore%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>A distinction after some work of the mind (distinction of reason, logical distinction, mental distinction) is a lack of identity that arises from an operation of the mind, whether with or without a foundation in the thing. Such a distinction flourishes between several concepts of one and the same reality and it is acquired insofar as the mind conceives the same thing according to diverse and distinct concepts each one of which represents the whole reality, but partially and not totally. The concepts are distinct and diverse but incomplete and inclusive. This distinction is either: A. with a foundation in the thing (a distinction of reasoned reason, intentional or virtual distinction), if from the real diversity of the effect that arises from one and the same formal cause the intellect has a reason or a foundation for distinguishing diverse respects in the cause itself. So in the light of the sun, for instance, there is a distinction between the powers of heating, illumining, and liquefying; in the human intellect there is a distinction between the faculties of conceiving, judging, and reasoning. B. without a foundation in the thing (distinction purely mental, distinction of reasoning reason) if the reason for distinguishing is not found in the thing but in some being of reason, for instance the distinction between man and humanity, or between ‘man’ and ‘man’s’.</p></blockquote>

<blockquote><p>A further point to make about cause and effect is that whatever is in some effect must in some way or other be in the cause, even if not always in the same way. For a cause cannot give what it does not have to give. This is sometimes called the principle of proportionate causality. Suppose, for example, that I give you $20. The effect in this case is your having the $20, and I am the cause of this effect. But the only way I can cause that effect is if I have the $20 to give you in the first place. Now there are several ways in which I might have it. I might have a $20 bill in my wallet, or two $10 bills, or four $5 bills. Or I may have no money in my wallet, but do have $20 in my bank account and write you a check. Or I may not even have that, but I am able to borrow the $20 from someone else, or work for it, so that I can go on to give it to you. Or perhaps I have a friend who has a key to the U.S. Treasury printing press and I get him to run off an official $20 bill for me to give to you. Or to take an even more farfetched scenario, suppose that in order to guarantee that you get that $20 I somehow convince Congress to pass a law which permits me personally to manufacture my own $20 bills. These are all various ways in which I might in theory give you $20. But if none of these ways are available to me, then I can’t do it. Again, these are different ways in which the cause may have what is in the effect. When I myself have a $20 bill ready to hand and I cause you to have it, what is in the effect was in the cause formally, to use some traditional jargon. That is to say, I myself was an instance of the form or pattern of having a $20 bill, and I caused you to become another instance of that form or pattern. When I don’t have the $20 bill ready to hand but I do have at least $20 credit in my bank account, you might say that what was in the effect was in that case in the cause virtually. For though I didn’t actually have the $20 on hand, I did have the power to get hold of it. And when I get Congress to grant me the power to manufacture $20 bills, you might say (once again to use some traditional jargon) that I had the $20 eminently. Because in that case, I not only have the power to acquire already existing $20 bills, but the more “eminent” power of causing them to exist in the first place. When it is said, then, that what is in an effect must in some way be in its cause, what is meant is that it must be in the cause at least “virtually” or “eminently” even if not “formally”. … These things [namely all things] thereby exist in that purely actual cause eminently and virtually even if not formally. For the cause of things is not itself a cat or a tree (and cannot be, given that it is immaterial), but it can cause a cat or a tree, or anything else that might exist.</p></blockquote>

<blockquote><p>5. If all mixed perfections are reducible to a plurality of pure perfections existing in limited degree, and if an infinite being possesses all pure perfections, the consequent is that God in some way possesses every positive perfection that is found or can be found in creatures, and indeed possesses it in unlimited degree. Accordingly God seems to differ from creatures by something positive not possessed by creatures. Creatures, by contrast, do not seem, in the ultimate analysis, to differ from God by any positive perfection precisely but rather because they lack some perfection that God has. This notion is also expressed in the theory of participation, according to which creatures are finite or imperfect likenesses of God insofar as any perfection possessed by them is found in God either formally or virtually or eminently.</p></blockquote>

<blockquote><p>We can distinguish between adequate and inadequate distinction. The first is if the things said to be distinct are as it were equal or equivalent, as is the case with all the distinctions above adduced. A distinction is inadequate if the distinct things are not equal, so that one includes the other but not conversely. Such inadequate distinctions flourish, for example, between the whole and its part, or between a subject and its mode, for a mode includes the subject it modifies and the whole includes its parts. These sort of inadequate distinctions, as is plain, can be real (for example between the human body and an arm), or formal (for example between soul and intellect, between animality and sense feeling, between formality and its mode, as between divine wisdom and the same thing’s infinity), or logical (for instance between the rays of the sun and their power of heating). Also here can be added real negative distinctions, which flourish not between thing and thing but between a thing and a negation of it (for example between man and blindness).</p></blockquote>

<blockquote><p>[see p. 75 of Wolter’s Summary]

68. When being is divided through contradictory attributes opposite to each other with respect to being, one of the dividing attributes belongs to a perfection in being and the other to imperfection. The reason is that one extreme of the disjunction formally involves the negation of the other. But both perfections cannot formally be perfections simply or pure perfections, because, from conclusion 62, pure perfections cannot formally exclude each other. Likewise, both extremes cannot formally be imperfections or mixed perfections, otherwise no being could be infinite (against conclusion 65). But a true disjunctive should include under one or other extreme every actual or potential being. Therefore one extreme is a perfection (a pure perfection) and the other an imperfection (a mixed perfection).

69. From this follows a general law of disjunction, namely that in disjunct properties of being, when the extreme that is less noble is posited of any being, the other more noble extreme can be deduced about some other being (see Scotus, Oxon. 1, d. 39, q. un, n. 13). The reason is that the one extreme involves imperfection and is therefore finite, while the other involves perfection simply, or pure perfection. But from conclusion 65, if something is finite, something else is infinite and has all pure perfections in the highest degree.</p></blockquote>

68. When being is divided through contradictory attributes opposite to each other with respect to being, one of the dividing attributes belongs to a perfection in being and the other to imperfection. The reason is that one extreme of the disjunction formally involves the negation of the other. But both perfections cannot formally be perfections simply or pure perfections, because, from conclusion 62, pure perfections cannot formally exclude each other. Likewise, both extremes cannot formally be imperfections or mixed perfections, otherwise no being could be infinite (against conclusion 65). But a true disjunctive should include under one or other extreme every actual or potential being. Therefore one extreme is a perfection (a pure perfection) and the other an imperfection (a mixed perfection).

69. From this follows a general law of disjunction, namely that in disjunct properties of being, when the extreme that is less noble is posited of any being, the other more noble extreme can be deduced about some other being (see Scotus, Oxon. 1, d. 39, q. un, n. 13). The reason is that the one extreme involves imperfection and is therefore finite, while the other involves perfection simply, or pure perfection. But from conclusion 65, if something is finite, something else is infinite and has all pure perfections in the highest degree.”

<blockquote><p>A being is considered as possible, or as actual. When it is considered as possible, it is said to have an essence or nature; such were all things before their creation; When it is considered as actual, then it is said to have existence also; such are all things which are created, and God himself the Creator. Essence, therefore, is but the very nature of any being, whether it be actually existing or not… There is but one Being which includes existence in the very essence of it, and that is God, who therefore actually exists by natural and eternal necessity; but the actual existence of every creature is very distinct from its essence, for it may be, or may not be, as God pleases.</p></blockquote>

<blockquote><p>Material and formal cause, properly so called, does not have place in accidents, although by some all beings promiscuously, whether substances or accidents, are wont to be explained through four kinds of causes. Yet if anyone wishes to form analogical concepts of it [regeneration] after the manner of physical generation, let him consider:

I. The Holy Spirit as the one generating, 1 Jn. 5:1.

II. The transient matter or matter of generation, the Word of God, which is compared to seed, 1 Pet. 1:23.

III. The proximate constituting matter, the intellect.

IV. The form, faith or the new creature.

V. The composite from man’s intellect with will and from the image of God or new creature: let it be the new man, the man of God, the spiritual man.

VI. That introduced form informs and actuates the matter, and thus renders man active for spiritual life; moreover constitutes him in a certain kind of things and distinguishes him from all other men not regenerate; finally renders him fit for every good work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>If there is Anything, the Uncausable is Susbtance [see pp. 56-68 of the Summary] .

48. If something accidental exists, something substantial exists. Proof: An accident depends essentially on its substrate. This dependence is of the same order as that which is found between formal cause and material cause. For substance is as it were the matter of accidents. Hence for any accident that actually exists there is required the simultaneous existence of another being, namely that in which the accident is. If this other is not something substantial but on the contrary an accident, then some third being is required. But there cannot be a regress to infinity, both because there would be at the same time an infinite number and because dependence in any essential order ends in some independent being in the same order. Hence every effect demands an ultimate being that is not an effect; a thing in matter requires eventually a being not in matter, namely prime matter. Likewise a being in another or to which existing in another belongs, involves a being not in another, or to which existing in itself belongs. If you object that some accident, namely quantity, can exist in itself, that is, supernaturally, the objection is not valid; for even in this case God, as first efficient cause, would be making up for the natural, material, secondary causality of the substance. And so, even on this supposition, at least one substance would exist, namely God himself.

49. If there is anything, substance exists. If there is anything, it is either accident or substance. But if it is accident, substance too exists (from conclusion 48). Therefore in either case, if there is anything, there is substance.

50. Being is divided into substance and accident. The existence of accidents must be proved from experience. And on this point one must note that, on the evidence of experience, many things exist that are not only beings but beings in another, as color, shape etc. It does not matter whether these are formally objective or subjective, for in either case they are real modifications of something. One must say the same about our internal acts, as thoughts, affections, volitions; for we experience these beings as empirical modifications of the ‘ego’. — From the fact of actual accident follows the fact of actual substance (from conclusion 48). Thus both accident and substance exist; therefore being is divided into substance and accident. About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such.

51. If something is altogether independent, it must be substance and not accident. Hence the uncausable, for instance, is substance. This conclusion is sufficiently clear from what was said above in proof of conclusion 48. … Proof of God … 11. God’s knowledge is really the same as the divine essence. Plain both from the physical simplicity of God and from the infinite perfection of the divine essence, which is perfectible neither accidentally nor substantially (conclusion 2). [A difference between the divine essence and its knowledge would be a difference between substance and accident.] … 15… Corollary: On a Personal God We show, against those who conceive God to be an impersonal cosmic force, that God is a rational being and hence personal. For a personal God is here understood as a rational supposit, that is, a singular substance simply complete, in its own right, and endowed with reason. God’s simply complete substantiality and singularity, and being in his own right, follow from our principal argument. In the present chapter God’s rationality is proved. Hence everything requisite for a personal being is verified of God. … 29. Every being is good, or being and good convert. … Further, creatures are also good for other creatures; for example, substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Conclusions respecting Reality’</span></figcaption>

t%2C+it+must+be+substance+and+not+accident.+Hence+the+uncausable%2C+for+instance%2C+is+substance.+This+conclusion+is+sufficiently+clear+from+what+was+said+above+in+proof+of+conclusion+48.+%E2%80%A6+Proof+of+God+%E2%80%A6+11.+God%E2%80%99s+knowledge+is+really+the+same+as+the+divine+essence.+Plain+both+from+the+physical+simplicity+of+God+and+from+the+infinite+perfection+of+the+divine+essence%2C+which+is+perfectible+neither+accidentally+nor+substantially+%28conclusion+2%29.+%5BA+difference+between+the+divine+essence+and+its+knowledge+would+be+a+difference+between+substance+and+accident.%5D+%E2%80%A6+15%E2%80%A6+Corollary%3A+On+a+Personal+God+We+show%2C+against+those+who+conceive+God+to+be+an+impersonal+cosmic+force%2C+that+God+is+a+rational+being+and+hence+personal.+For+a+personal+God+is+here+understood+as+a+rational+supposit%2C+that+is%2C+a+singular+substance+simply+complete%2C+in+its+own+right%2C+and+endowed+with+reason.+God%E2%80%99s+simply+complete+substantiality+and+singularity%2C+and+being+in+his+own+right%2C+follow+from+our+principal+argument.+In+the+present+chapter+God%E2%80%99s+rationality+is+proved.+Hence+everything+requisite+for+a+personal+being+is+verified+of+God.+%E2%80%A6+29.+Every+being+is+good%2C+or+being+and+good+convert.+%E2%80%A6+Further%2C+creatures+are+also+good+for+other+creatures%3B+for+example%2C+substance+upholds+accidents%2C+accidents+give+further+perfection+to+substance%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99%2C+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7565f8e859.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/7565f8e859.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=If%20there%20is%20Anything%2C%20the%20Uncausable,give%20further%20perfection%20to%20su <blockquote><p>Potential Being to Something is Pure Act [see pp. 50-55 of the Summary]

40. Act and potency¹ divide being and every kind of being. This Scholastic axiom must be understood of act and potency as disjunctive attributes of being, where its truth is sufficiently plain. The sense is: everything of which the definition of being holds (namely, what existence is not repugnant to) either actually exists or does not actually exist. This disjunctive is valid not only of being as a transcendental but also of categorical being, so that everything of which the definition of substance or any of the accidents is true, either actually exists or is in objective potency to existing.

41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency¹ [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. ¹ [See also ‘On Obediential Potency’.] The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.]

42. Act and potency as constitutive principles involve imperfection insofar as they are mutually perfectible in themselves; for only the imperfect is perfectible.

43. Potential being considered in itself is not simply real, that is, does not really exist, save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason [that which only exists in a mind]; for the idea of a possible quiddity [what-ness or essence] involves the relation of non-repugnance to existence, while the others do not.

44. Therefore that which is a potential being cannot have the reason for its existence in itself but in its cause; so the potential is the causable.

45. If something is a potential being, something else is actual. Potential being does not in fact exist; therefore if it can in fact exist, some being is required that can effect it; therefore (from conclusions 24 and 26) something actually exists, namely at least the first ineffectible efficient cause.

46. If something is in subjective, passive, objective, or obediential potency it is causable. The point is plain from the definitions, at least as concerns the real perfection to which something is in potency.

47. Therefore if something is uncausable, it is not in this sort of potency,¹ but is pure act (from negation of the previous conclusion). ¹ [The importance again, is that the First Cause (i.e. God) can have no passive potency to be acted on (which would be an imperfection), but, in the words of Wolter, has all logical potency, or active potency to cause others (which is no imperfection, but the height of perfection).] … 59. Every composite consists of act and potency. For parts have in their formal concept the idea of mutual perfectibility, and so are in potency to the whole.</p></blockquote>

<blockquote><p>If the changeable [being] is taken strictly [see p. 11], there must be a subject of the change that is relatively permanent; therefore there is something else that is absolutely and independently permanent (from conclusion 2…); therefore there is something that is in itself unchangeable. If the changeable is taken in a broad sense then either it always existed thus or it did not; if it did not it is transient, and then too the unchangeable must exist. If the changeable always existed thus in fact, nevertheless it could not be altogether independent with respect to its persistence, for otherwise it would not be changeable in the broad sense. Therefore it would be dependent as to its persisting; therefore it would, like the relatively persistent, require a first independent thing existing simultaneously that is unchangeable also in the broad sense.” p. 37 12. An eternal being actually exists, or something actually existing is eternal.

13. An unchangeable being actually exists, or something actually existing is unchangeable.

14. Therefore being is divided into temporal and eternal (from conclusions 8, 9, and 10).

15. Therefore being is divided into unchangeable and changeable. If changeable is taken broadly [see p. 11], this conclusion follows from conclusions 8, 9, and 13. If it is taken strictly the existence of the unchangeable follows from what was said above about constant elements of our experience [see p. 33]. The existence of the unchangeable follows from conclusion 13.</p></blockquote>

<blockquote><p>It is the same with the idea of substance, which is but a determination of the idea of being. Substance is being capable of existing in itself and not in something else. The intellect, which at once perceives being underneath the phenomena (something which is), observes that these phenomena are many and variable, while being, on the contrary, is one and the same, and that it exists in itself, and not as an attribute in another. Being considered as such is called substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God: his Existence &amp; his Nature</cite>, vol. 1 (B. Herder: 1945), p. 131</span></figcaption>

</figure><figure class="quote" id="q-584645b8ad" data-kw="">
<blockquote><p>We come now to the principle of substance. It is thus formulated: ‘That which exists as the subject of existence is substance, and is distinct form its accidents or modes.’ Thus in everyday speech we call gold or silver a substance. This principle is derived from the principle of identity, because that which exists as subject of existence is one and the same beneath all its multiple phenomena, permanent or successive. The idea of substance is thus seen to be a mere determination of the idea of being. Inversely, being is now conceived explicitly as substantial. Hence the conclusion: The principle of substance is simply a determination of the principle of identity: accidents then find their raison d’etre in the substance.</p></blockquote>

</figure><figure class="quote" id="q-cf8c8a1fda" data-kw="">
<blockquote><p>Being is what is called in A[ristotelian]-T[homistic] metaphysics a transcendental, something above every genus, common to all beings and thus not restricted to any category or individual. The other transcendentals are thing, one, something, true, and good, and each is ‘convertible’ with being in the sense that each designates one and the same thing—namely being—under a different aspect. (To put the point in terms made familiar by Frege, the transcendentals differ in sense but not in reference, referring to the same thing under different names just as ‘Superman’ and ‘Clark Kent’ do.)</p></blockquote>

</figure><figure class="quote" id="q-44c5e69a32" data-kw="">
<blockquote><p>Thesis VIII: In the meantime, we do not agree with Nominalists who think that universals are purely nominal. For not only do we admit that things exist before the operation of the mind, which are called universals, as they also concede, but we also admit that there is in things the foundation of universality without the operation of the mind, namely, that exact similarity of many individuals of the same species in formal unity, which they do not concede. In this, we also differ from Scotus, who wants that exact similarity of many individuals in formal unity to be true unity, and thus, universal unity itself. However, we assert that, as singular individuals are per se one thing, and this not only by numerical unity but also by formal unity, we genuinely deny that the natures of many individuals without the operation of the mind are one nature. We acknowledge some similarity and agreement but not unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/franco-burgersdijk.html">Franco Burgersdijk</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutionum Metaphysicarum</cite>, ch. 13, “On Universal Unity” tr. T.J. Floyd</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>The telos of a thing or process is the end or goal toward which it points… Naturalists generally hold that teleological descriptions of natural phenomena are either false or, if true, are reducible to descriptions cast in non-teleological terms. Non-naturalists generally hold that at least some natural phenomena exhibit irreducible teleology.</p></blockquote>

</figure><figure class="quote" id="q-7b81d9709e" data-kw="">
<blockquote><p>To summarize the five main approaches to teleology: Teleological eliminativism denies that there is any teleology at all in the natural world. Teleological reductionism allows that there is, but holds that it can be reduced to non-teleological phenomena. Platonic teleological realism holds that there is irreducible teleology in the natural world but only in the sense that an external ordering intellect orders things to certain ends. Aristotelian teleological realism holds that there is irreducible teleology in the natural world and that it is immanent, existing in things simply by virtue of their natures and in no way dependent on an ordering intelligence. Scholastic teleological realism holds that there is irreducible teleology in the natural world and that it is immanent to things given their natures, but also that the fact that they exist with natures directing them to those ends cannot itself ultimately be made sense of apart from a divine ordering intelligence.</p></blockquote>

20intelligence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-181714863e" data-kw="">
<blockquote><p>…there are at least these five levels at which irreducible teleology might be said to exist: in basic causal regularities; in complex inorganic processes; in basic biological phenomena; in distinctively animal life; and in human thought and action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49, pp. 39-40</span></figcaption>

</figure><figure class="quote" id="q-79f7667f22" data-kw="">
<blockquote><p>Is there any other way the end or goal might exist already [as it must]? There would seem to be only four possibilities: It might exist in the natural object itself; it might exist in a Platonic “third realm”; it might exist in some human intellect, or in another intellect within the natural world; or it might exist in an intellect outside the natural world altogether. But it obviously doesn’t exist in the natural object itself; if the form of an oak were already in the acorn itself, it would be an oak, and it’s not. It cannot exist in a Platonic “third realm” either, at least not if one endorses (as the Scholastic teleological realist does) the Aristotelian realist critique of Platonic realism about universals. Nor can it exist in some human or other intellect within the natural order, at least not without a vicious regress. Humans obviously are not the ones directing acorns and other natural objects (including human beings themselves) to their natural ends… The only possibility remaining, then, is the last one: Final causation in the natural world is intelligible because there is an intelligence altogether outside the natural order that directs natural objects to their ends. To the “How can something non-existent be a cause?” objection to final causation, then, the Thomist’s reply is to say “It can’t. That’s why the final cause of a natural object must exist already as an idea or form in an intellect existing altogether outside the natural order.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49, pp. 46-47</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

%E2%80%99+in+Neo-Scholastic+Essays+%28South+Bend%2C+IN%3A+St.+Augustine%E2%80%99s+Press%2C+2015%29%2C+pp.+28-49%2C+pp.+46-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F79f7667f22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/79f7667f22.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=Is%20there%20any%20other%20way%20the,existing%20altogether%20outside%20the%20natural%20order&amp;text=Is%20there%20any%20other%20way%20the%20end%20or&amp;text=an%20intellect%20existing%20altogether%20outside%20the%20natural%20order" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f5c6b28c66" data-kw="">
<blockquote><p>In summary, then, the thrust of the Fifth Way [of Aquinas] is this: (1) Irreducible teleology is immanent to the natural order; (2) But such teleology is unintelligible unless there is an intellect outside the natural order; so (3) There is an intellect outside the natural order. The argument differs from [William] Paley [early-1700’s] style design arguments and the arguments of ID [Intelligent Design] theorists in ways other than those already mentioned. For example, since the entities comprising the natural world have the final causes they have as long as they exist, the intellect in question has to exist as long as the natural world itself does, so as continually to direct things to their ends. The deistic notion that God might have “designed” the world and then left it to run independently is ruled out.</p></blockquote>

</figure><figure class="quote" id="q-e063197d4a" data-kw="">
<blockquote><p>Efficient causality is nothing else but the realization or actualization of something which did not previously exist. It is clear that this realization, defined in terms of its immediate relation to potential and actual being, is perceived by the intellect, the faculty of being, under the appearances of color, heat, etc., which are perceived by the senses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God: his Existence &amp; his Nature</cite>, vol. 1 (B. Herder: 1945), pp. 131-32</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

— Reginald Garrigou-Lagrange, God: his Existence &amp; his Nature, vol. 1 (B. Herder: 1945), pp. 131-32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEfficient+causality+is+nothing+else+but+the+realization+or+actualization+of+something+which+did+not+previously+exist.+It+is+clear+that+this+realization%2C+defined+in+terms+of+its+immediate+relation+to+potential+and+actual+being%2C+is+perceived+by+the+intellect%2C+the+faculty+of+being%2C+under+the+appearances+of+color%2C+heat%2C+etc.%2C+which+are+perceived+by+the+senses.%E2%80%9D%0A%0A%E2%80%94+Reginald+Garrigou-Lagrange%2C+God%3A+his+Existence+%26+his+Nature%2C+vol.+1+%28B.+Herder%3A+1945%29%2C+pp.+131-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe063197d4a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e063197d4a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=Efficient%20causality%20is%20nothing%20else%20but,which%20are%20perceived%20by%20the%20senses&amp;text=Efficient%20causality%20is%20nothing%20else%20but%20the%20realization&amp;text=heat%2C%20etc.%2C%20which%20are%20perceived%20by%20the%20senses" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a2f71214e3" data-kw="">
<blockquote><p>If the [train] car sits on a flat railway, how long will it sit there till it moves down the railroad? Of course not until something else comes and pulls it along. The flatbed has no ability or potential to move itself or to activate its own potentials. Something else has to do that. . 1.3 The Law of Causality Say two train cars sit on the railroad next to each other. Both have the potential to move. Yet the potential of the one never moves the other. Why? Because the one flatbed’s potential to move is not actual; it is not actually moving, and that is what it would take to move the second flatbed, to activate its potential to move. That one thing must be moved by another is not only a common observation all around us, it must be true for everything that has potential, precisely because something not actual cannot do anything. A possibility does not exist as anything but a possibility. These things must be true by what potentiality and actuality must be. The principle is called the Law of Causality: Something potential can only be made actual by something actual. This is not only universally true by empirical experience, but it must be true by definition from the laws that constitute nature, given change. If change occurs, it must be done by something actual. Something must bump into or pull the train car before it will move, because it has no nature or potential to move itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Proof for God’s Existence from Change’</cite>, (2024), 1. Preliminaries to the Proof</span></figcaption>

<blockquote><p>In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.</p></blockquote>

<blockquote><p>To this principle of contradiction or of identity is subordinated the principle of sufficient reason, which in its generality may be formulated thus: ‘Everything that is has its raison d’etre, in itself, if of itself it exists, in something else, if of itself it does not exist.’ But this generality must be understood in senses analogically different. First. [Formal cause] The characteristics of a thing, e.g.: a circle, have their raison d’etre in the essence (nature) of that thing. [In a siimlar way the sufficient reason for God is in Himself] Secondly. [Efficient cause] The existence of an effect has its raison d’etre in the cause which produces and preserves that existence, that is to say, in the cause which is the reason not only of the ‘becoming,’ but also of the continued being of that effect. Thus that which is being by participation has its reason of existence in that which is being by essence [namely God]. Thirdly. [Final cause] Means have their raison d’etre in the end, the purpose, to which they are proportioned. Fourthly, [Material cause] Matter is the raison d’etre of the corruptibility of bodies. This principle, we see, is to be understood analogically, according to the order in which it is found, whether that order is intrinsic (the nature of a circle related to its characteristics [or in something being material and corruptible]): or extrinsic (cause, efficient or final, to its effects). When I ask the reason why, says St. Thomas, I must answer by one of the four causes. Why has the circle these properties? By its intrinsic nature. Why is this iron dilated? Because it has been heated (efficient cause). Why did you come? For such or such a purpose. Why is man mortal? Because he is a material composite, hence corruptible. [Unfallen Adam was capable of dying though He would not have died by the providence of God if he had remained upright.] Thus the raison d’etre, answering the question ‘why’ (propter quid): is manifold in meaning, but these different meanings are proportionally the same, that is, analogically. We stand here at a central point. We see that the efficient cause presupposes the very universal idea of cause, found also in the final cause, and in formal cause, as well as in the agent. Thus the principle of sufficient reason had been formulated long before Leibnitz.</p></blockquote>

<blockquote><p>50. Being is divided into substance and accident. … About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. … Relative Being to Absolute Being [see pp. 69-72 of the Summary]

52. If there is relative being, absolute being must exist. For once the existence of a purely relative being has been admitted, some other beings must exist, namely subject, term and foundation [p. 69]. But all these are as it were the matter of relation and so are not formally the relation, nor formally ‘existing-to’; therefore they are absolute beings. But even on the other opinion, this proposition can in some way be saved. For if relative being is formally a being of reason with a foundation in the thing, something truly real and therefore absolute is required, namely the foundation itself.

53. From the nature of relation, it is plain that relation cannot be found, nor be known, unless subject, term, and foundation are present and known respectively at the same time. And in this sense can the Aristotelian-Scholastic dictum be understood: ‘relatives are simultaneous in nature and in understanding’. … Proof of God … 7. God knows all individuals, not only as absolute beings and in themselves, but also knows them according to all the relations that one has to all the others. This conclusion too is plain from the perfection of God’s knowledge. … Conclusions Respecting Reality … 29. Every being is good, or being and good convert. Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty, or the will…</p></blockquote>

e+saved.+For+if+relative+being+is+formally+a+being+of+reason+with+a+foundation+in+the+thing%2C+something+truly+real+and+therefore+absolute+is+required%2C+namely+the+foundation+itself.+53.+From+the+nature+of+relation%2C+it+is+plain+that+relation+cannot+be+found%2C+nor+be+known%2C+unless+subject%2C+term%2C+and+foundation+are+present+and+known+respectively+at+the+same+time.+And+in+this+sense+can+the+Aristotelian-Scholastic+dictum+be+understood%3A+%E2%80%98relatives+are+simultaneous+in+nature+and+in+understanding%E2%80%99.+%E2%80%A6+Proof+of+God+%E2%80%A6+7.+God+knows+all+individuals%2C+not+only+as+absolute+beings+and+in+themselves%2C+but+also+knows+them+according+to+all+the+relations+that+one+has+to+all+the+others.+This+conclusion+too+is+plain+from+the+perfection+of+God%E2%80%99s+knowledge.+%E2%80%A6+Conclusions+Respecting+Reality+%E2%80%A6+29.+Every+being+is+good%2C+or+being+and+good+convert.+Just+as+ontological+truth+states+the+relation+of+being+to+the+cognitive+faculty%2C+so+goodness+involves+a+relation+to+the+appetitive+faculty%2C+or+the+will%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99%2C+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44e5959ce1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/44e5959ce1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=50.%20Being%20is%20divided%20into%20substance,the%20appetitive%20faculty%2C%20or%20the%20will&amp;text=50.%20Being%20is%20divided%20into%20substance%20and%20accident&amp;text=relation%20to%20the%20appetitive%20faculty%2C%20or%20the%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fa36de1ec1" data-kw="">
<blockquote><p>Cognition, according to St. Thomas, is a form of tendency by which the knower, without ceasing to be himself, becomes something else. A cognitive faculty is a capacity to take on the form of another being. The form received into the intellect is called the intelligible species. By it the knower is given the formal or intelligible determinations of the thing known. Thus informed, the knower actively expresses or acts out the part of the thing known, so that the accidental act of the knower becomes one (in intention) with the act of the thing known… This intention, expressed by the knower and expressing the thing known, has a twofold relation: it is a form or quality perfecting the knower and a relation of likeness to the thing known. Viewed in this latter relation, according to what it expresses, it is essentially the relation of truth, the conformity of intellect to thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-schmidt.html">Robert Schmidt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Domain of Logic according to S. Thomas Aquinas</cite>, (Hague: Martinus Nijhoff, 1966), ‘Conclusion’ | ‘Intention’ 306-8</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Thesis 2. Lest, however, our disputation be forced to wander and err, I will do that which I think ought to be done at the beginning, middle, and end of all disputations: that first, what it is that is being disputed should be defined; then, the common affections should be subjected to the definition; and finally, a division into parts and species should follow. And so our disputation on original sin will present: 1. its Definition, 2. its common Affections, 3. its Distribution.</p></blockquote>

<blockquote><p>1. Theology is usually divided into the Theology of the Laity and the Theology of the Doctors, which they call argumentative and Scholastic. The former is a bare knowledge of the credibilia (as they call them) necessary for salvation. The latter is not a bare knowledge of the credibilia, but is the faculty by which we are able to explain, defend, and confirm the articles of faith, and to instruct others concerning their truth.

2. Argumentative or Scholastic Theology is said to exceed the Theology of the Laity in a twofold respect: first, because it extends itself to more credibilia; for learned men in spiritual matters understand more than the Laity and the simple. Secondly, because it is able to explain to others those things which are to be believed, and to defend and confirm them against Atheists, Jews, Mohammedans, and Pagans.</p></blockquote>

<blockquote><p>…it is impossible for the aforesaid truth of faith to be contrary to those principles which reason knows naturally…. Now, the knowledge of naturally known principles is instilled into us by God, since God himself is the author of our nature. Therefore, the divine wisdom also contains these principles. Consequently, whatever is contrary to these principles is contrary to the divine wisdom. Therefore, it cannot be from God. Therefore, those things which are received by faith from divine revelation cannot be contrary to our natural knowledge… God does not instil into man any opinion or belief contrary to natural knowledge… Yet, because it [the word of faith] surpasses reason, some look upon it as though it were contrary to reason; which is impossible.</p></blockquote>

</figure><figure class="quote" id="q-40e246eff8" data-kw="">
<blockquote><p>Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture</cite>, 12. ‘Gradation of Principles &amp; Practices’ in ‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to [Edward] Feser’ (RBO, 2025)</span></figcaption>

</figure><figure class="quote" id="q-be8b63b848" data-kw="">
<blockquote><p>Asking whether you should listen to God or to reason is like asking whether you should listen to Beethoven’s Fifth Symphony or to the recording you have of it. It’s like asking whether the earth is lit up by the sun or by sunlight. It’s like asking whether you should obey your commanding officer or his commands. The natural law of reason is a participation in the eternal law of God ([Thomas, Summa] I-I,91,2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-kreeft.html">Peter Kreeft</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Theology</cite>, … (Ignatius Press, 2014), ch. 82, ‘Listening to Reason is Listening to God’</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

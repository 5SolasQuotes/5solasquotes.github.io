</figure><figure class="quote" id="q-de69b506c5" data-kw="">
<blockquote><p>Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectarum Disputationum Theologicarum Pars Prima</cite>, (Utrecht: Apud Joannem Waesberge, 1658), pp. 3-4 &amp; 7 as quoted in Johannes Hoornbeeck, ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors (1658) tr. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).”

— Gisbertus Voetius, Selectarum Disputationum Theologicarum Pars Prima, (Utrecht: Apud Joannem Waesberge, 1658), pp. 3-4 &amp; 7 as quoted in Johannes Hoornbeeck, ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors (1658) tr. Charles Johnson">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+our+doctrine+is+that+in+elenctic+theology%2C+or+in+the+refutation+of+falsehood%2C+e.g.+Purgatory%2C+indulgences%2C+etc%2C+discourse+and+consequences+are+to+be+employed.+And+if+it+is+the+case+that+a+resolute+adversary+denies+them%2C+then+the+proving+of+consequences+is+also+to+be+employed%2C+not+only+from+the+Holy+Bible%2C+but+also+from+the+axioms+and+principles+of+the+light+of+nature%2C+known+either+naturally+or+technically%2C+from+Philosophy+and+Logic%2C+so+that+the+suitable+connection+of+the+middle+term+with+the+major+term+is+apparent.+The+truth+of+doctrines%2C+rather%2C+or+of+middle+terms%2C+and+the+connection+of+the+middle+term+with+the+minor%2C+is+to+be+demonstrated+either+from+the+express+words%2C+or+equivalent+ones%2C+or+the+good+consequence%2C+of+Scripture+alone+%28except+if+the+doctrines+belong+to+natural+theology%2C+which+are+proven+from+Scripture+primarily%2C+and+also+from+the+light+of+nature+secondarily%29.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Selectarum+Disputationum+Theologicarum+Pars+Prima%2C+%28Utrecht%3A+Apud+Joannem+Waesberge%2C+1658%29%2C+pp.+3-4+%26+7+as+quoted+in+Johannes+Hoornbeeck%2C+ch.+1%2C+%E2%80%98On+Theology%E2%80%99+in+Institutions+of+Theology+Set+in+Order+from+the+Best+Authors+%281658%29+tr.+Charles+Johnson&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fde69b506c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/de69b506c5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-use-of-reason-in-theology/#:~:text=Therefore%2C%20our%20doctrine%20is%20that%20in,from%20the%20light%20of%20nature%20secondarily&amp;text=Therefore%2C%20our%20doctrine%20is%20that%20in%20elenctic%20theology&amp;text=and%20also%20from%20the%20light%20of%20nature%20secondarily" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cb2eaf7123" data-kw="">
<blockquote><p>When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism</cite>, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.”

</figure><figure class="quote" id="q-0fd57e2451" data-kw="">
<blockquote><p>Having noted these presuppositions, we now say that no human reason can be the principle by which or through which, or else on the ground of which or why we believe, or the foundation, law, or norm for what must be believed, under whose direction we are to judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism</cite>, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 230</span></figcaption>

</figure><figure class="quote" id="q-e41b00c66f" data-kw="">
<blockquote><p>13. Reason is employed on both sides, as an instrument, not a judge or norm. So that neither are they to be listened to who defer to it more than is fair in theological matters, and demand the things of faith from its scales, who are the Socinians; nor those who pointlessly begrudge its use in theological argumentation and forming consequences, which the Verronian Papists do, and some Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors</cite>, (1658) tr. Charles Johnson</span></figcaption>

</figure><figure class="quote" id="q-27f2471d87" data-kw="">
<blockquote><p>Theology is not only intelligible and meaningful, but also discursive. For it employs many arguments for the convincing of opponents, and from its principles, prior, and indemonstrable in themselves, it either draws out conclusions for proving the truth, or solutions for refuting the fallacious objections of sophists. Mt. 22:32-33; 1 Cor. 15:20-22.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-polyander.html">Johannes Polyander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis Purioris Theologiae</cite>, (Leiden: Apud Johannem &amp; Danielem Elsevier, 1652), p. 8 as quoted in ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors (1658) tr. Charles Johnson</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Theology is not only intelligible and meaningful, but also discursive. For it employs many arguments for the convincing of opponents, and from its principles, prior, and indemonstrable in themselves, it either draws out conclusions for proving the truth, or solutions for refuting the fallacious objections of sophists. Mt. 22:32-33; 1 Cor. 15:20-22.”

<blockquote><p>14. What is the legitimate office of reason in the sphere of religion? 1st. Reason is the primary revelation God has made to man, necessarily presupposed in every subsequent revelation of whatever kind. 2d. Hence Reason, including the moral and emotional nature, and experience, must be the organ by means of which alone all subsequent revelations can be apprehended and received. A revelation addressed to the irrational would be as inconsequent as light to the blind. This is the usus organicus [organic use] of reason. 3d. Hence no subsequent revelation can contradict reason acting legitimately within its own sphere. For then (1) God would contradict Himself, and (2) faith would be impossible. To believe is to assent to a thing as true, but to see that it contradicts reason, is to see that it is not true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, 2nd ed., enlarged, (Bible Institute Colportage Association, 1878), ch. 3, ‘The Sources of Theology’, p. 62</span></figcaption>

<blockquote><p>It was a common practise amongst the young students of our universities in the time of the Dunses [after John Duns Scotus] (and is yet amongst too many, whom spots of Dunsery have stained), that if in disputation they were brought to an inconvenience, were it never so absurd, they would haue a distinction, though void of brain and sense, yet a distinction to maintain it. If a man will be perverse, it is no mastery to do it. But as a wise and learned man does say of them, that they are base wits which are so affected, whereas ingenuous minds and natures well-given will rather seek how true that is which they hold than how they may defend it, making greater price of verity than victory: so I may say (yea much more in matters of religion, of faith, of life eternal) a Christian wit and godly mind will search and weigh rather what should be said truly than what may be said probably or colourably at the least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds</cite>, … (London: Bishop, 1584), p. 44</span></figcaption>

</figure><figure class="quote" id="q-e4ffb2adec" data-kw="">
<blockquote><p>6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology.

7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology.

7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).”

<blockquote><p>…it’s possible to articulate Christian doctrine without formally invoking concepts like “essence,” “substance” and so on. Instead of saying, for example, that in the incarnation there is one hypostasis subsisting in two distinct natures, one can say that there is just Jesus and not someone else and that Jesus always remains both truly God and truly human. However, the fact that the use of the metaphysical language is not absolutely necessary does not mean that the metaphysical resources in question are detached from reality. It does not mean that what they offer us is just a set of coherent rules for saying things – rules that we might either take or leave. On the contrary, the classical metaphysical tradition developed by Christian thinkers like John of Damascus, Thomas Aquinas or the early Reformed theologians and philosophers involves a knowledge of how things are. Indeed, it is fundamentally an exposition of things human beings know to be true prior to engaging in any formal academic work. For example, things do have natures by virtue of which they are similar to other things. There really are substances in which accidents inhere… As we seek ways to express what God is like according to scriptural teaching, we should look to this philosophical tradition, not Kant or Hegel, because it sheds light on reality.</p></blockquote>

<blockquote><p>Though Christian dogma cannot be explained in terms of Greek philosophy, it also did not come into being apart from it. There is as yet no dogma and theology, strictly speaking, in Scripture. As long as revelation itself was still in progress, it could not become the object of scientific reflection. Inspiration had to be complete before reflection could begin. To speak of “Mosaic”, “Pauline”, or the “Bible’s” theology and dogmatics therefore, is not advisable; the word theology, for that matter, does not occur in Scripture and has only gradually acquired its present meaning. Theology first arose in the Christian community after the naïveté of childhood lay behind it and the adult thinking mind had awakened. Gradually a need arose to think through the ideas of revelation, to link it with other knowledge and to defend it against various forms of attack. For this purpose people needed philosophy. Scientific theology was born with its help. This did not, however, happen accidentally. The church was not the victim of deception. In the formation and development of the dogmas, the church fathers made generous use of philosophy. They did that, however, in the full awareness of and with clear insight into the dangers connected with that enterprise; they were conscious of the grounds on which they did it with express recognition of the word of the apostles as the only rule of faith and conduct. For that reason also they did not utilize the whole of Greek philosophy but made a choice; they only utilized the philosophy that was most suited to help them think through and defend the truth of God. They went to work eclectically and did not take over any single philosophical system, be it either from Plato or from Aristotle, but with the aid of Greek philosophy produced a Christian philosophy of their own. Furthermore, they only used that philosophy as a means. Just as Hagar was the servant of Sarah, as the treasures of Egypt were employed by the Israelites for the adornment of the tabernacle, as the wise men from the East placed their gifts at the feed of the child in Bethlehem, so, in the opinion of the church fathers, philosophy was the servant of theology. From everything it is clearly evident that the use of philosophy in theology was based, not on a mistake, but on firm and clear conviction. The church fathers knew what they were doing. Mind you, this does not rule out the possibility that at some points the influence of philosophy was too strong. But in that connection we must make a distinction between the theology of the fathers and the dogmas of the church. The church was at all times alert against the misuse of philosophy; it not only rejected Gnosticism but also condemned Origenism. And up until now no one has succeeded in explaining the dogmas materially in terms of philosophy; however often this has been attempted, in the end the scriptural character of orthodoxy has been vindicated. Initially the Reformation assumed a hostile posture toward scholasticism and philosophy. But it soon changed its mind. Because it was not, nor wanted to be, a sect, it could not do without theology. Even Luther and Melanchton, therefore, already resumed the use of philosophy and recognized its usefulness. Calvin assumed this high position from the start, saw in philosophy an “outstanding gift of God”, and was followed in this assessment by all Reformed theologians. The question here is not whether theology should make use of a specific philosophical system. Christian theology has never taken over any philosophical system without criticism and given it the stamp of approval. Neither Plato’s nor Aristotle’s philosophy has been held to be the true one by any theologian. That theologians nevertheless preferred these two philosophical systems was due to the fact that these systems best lent themselves to the development and defense of the truth. Present also was the idea that the Greeks and Romans had been accorded a special calling and gift for the life of culture. Still to this day, in fact, our whole civilization is built upon that of Greece and Rome.</p></blockquote>

<blockquote><p>The theology of Christians approves the teachings of philosophy if they are true, correct, and salutary. It uses them by its own right and makes them catholic. If they are too unclear, it sheds light on them; if they are mixed with harmful errors, it separates the precious from the cheap and keeps the one and destroys the other.</p></blockquote>

<blockquote><p>I subscribe to that of Clement of Alexandrinia: We ought not to swear allegiance to any sect of philosophers, whether Stoics, Epicures, Platonists, or Peripatetics, but we must select and embrace whatsoever is true and faithfully delivered concerning God by any sect; and the Truth selected out of all sects is not vain philosophy, but Natural Divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite></span></figcaption>

<blockquote><p>But the errors of philosophers are not the dictates of philosophy, any more than the mistakes of artificers are to be imputed to the art itself. ‘Philosophy,’ says Clement of Alexandria, ‘is not to be called Stoic, nor Platonic, nor Epicurean, nor Aristotelian, but whatever has been properly spoken by these sects–this, gathered into one whole, is to be called philosophy’ (Stromata 1.7 [ANF 2:308; PG 8.731]).</p></blockquote>

<blockquote><p>15. What is philosophy, and what is its relation to theology ? Philosophy, in its wide sense, embraces all human knowledge, acquired through the use of man’s natural faculties, and consists of that knowledge interpreted and systematized by the reason. Science is more specific, relating to some special department of knowledge thoroughly reduced to system… Philosophy is presupposed, therefore, in science as the first and most general knowledge. It inquires into the soul and the laws of thought, into intuition and ultimate truth, into substance and real being, into absolute cause, the ultimate nature of force and will, into conscience and duty. As to its relations to theology it will be observed — 1st. The first principles of a true philosophy are presupposed in all theology, natural and revealed. 2d. The Holy Scriptures, although not designed primarily to teach philosophy, yet necessarily presuppose and involve the fundamental principles of a true philosophy. Not the inferences of these principles drawn out into a system, but the principles themselves, as to substance and cause, as to conscience and right, etc. … 4th. The devout believer, however, who is assured that the Bible is the very word of God, can never allow his philosophy, derived from human sources, to dominate his interpretation of the Bible, but will seek with a docile spirit and with the assistance of the Holy Spirit, to bring his own philosophy into perfect harmony with that which is implicitly contained in the Word. He will, by all means, seek to realize a philosophy which proves itself to be the genuine and natural handmaid of the religion which the Word reveals.</p></blockquote>

</figure><figure class="quote" id="q-d4371b9201" data-kw="">
<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joel-carini.html">Joel Carini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The Natural Man does Not Accept the Things of the Spirit of God’ – But He Can Accept Natural Theology</cite>, (2024)</span></figcaption>

</figure><figure class="quote" id="q-595686e025" data-kw="">
<blockquote><p>Certainly [James] Arminius… saw that… the novel Pseudo-philosophy of the Jesuits was being confounded with true metaphysics and the Thomistic Scholastics… His disciples—when they perceived that the little pseudo-philosophical reasonings, by which at the beginning, and almost alone, they had assailed the received truth, were no longer a terror but a derision, and that their own theology daily grew worse—began strenuously to declaim against the philosophy of the schools, especially the metaphysical… Solid ratiocinations they call Scholastic subtleties: by this name they pretext their fault. … But [the Arminian] Vorstius, in his writings… in place of the philosophy of Aristotle and of the Scholastics—rightly emended in the reformed schools and accommodated to the truth of religion—substitutes the metaphysics of Taurellus, conjoined with the declamations of Ramus (which they call schools), with Bodin’s Theater [of Nature] from time to time employed… Let now the metaphysics and Triumphus of Taurellus be compared, with some things of Bodin added, and the declamations of Ramus, and let it be judged whether by their help the Atheistic, Epicurean, Ethnic [pagan], Judaic, Muhammadan, Enthusiastico-Libertine, Vorstian, Socinian, etc. [errors] can better be refuted than out of Thomas and the other Scholastics, and the more recent disciples of these, Suárez, Fonseca, etc. Certainly of these it may be said what was once said of Origen: where good, none better; where bad, none worse. When they are not hindered by the prejudices and authority of the corrupted religion and church of their own [communion], they render truly useful service (certain errors, and things too curious, excepted)—e.g. in the defense of the Trinity, of the divine attributes, of Christ the θεάνθρωπος [God-man], of the creation of the world, of the resurrection, of the general theses concerning the end of man, concerning the affections, faculties, etc. Hence it is that our most excellent theologians not unwillingly plow with their heifer [i.e. make use of them]—e.g. Martyr, Zanchi, Danaeus, Franciscus Junius, Ferrius, Molinaeus, Perkins, Twisse, Rutherford, etc. And the [Protestant] philosophers have, in emulation, out of the same—and chiefly out of Suárez, among the more recent—composed their own metaphysics: e.g. Cornelius Martinius, Jacobus Martinius, Combachius, Werenbergius, Scheibler, Jachaeus, Rutgersius, Burgersdicius, Senguerdius, etc. But the virtues and vices of Scholastic Theology we have explained ex professo [expressly, professedly] in the disputation On Scholastic Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-ea060bdf15" data-kw="">
<blockquote><p>Reason cannot and ought not to bring forth any mysteries, as it were, out of its own storehouse; for this is the prerogative of scripture only. Also, that reason is not to be heard when complaining of its incapacity to comprehend the mysteries of faith: for, being finite, it is no wonder that reason should not comprehend many things that relate to what is infinite; and to reject a mystery because it is incomprehensible to reason, is to offend against reason itself. Neither is reason to be listened to whenever, under cover of holding the mysteries of faith, it aims at setting up its own errors. On the very same grounds we can not call philosophy any rule of faith, although we again concede that it is of no little use, provided it assume not to itself the power of dictating in articles of faith. True philosophy indeed serves very much both to convince men and to prepare their minds; and there is a wonderful harmony between sound philosophy and divinity: for truth is not contrary to truth, nor light to light; only we must not imagine that the former is the rule by which the sense of scripture must be tried and examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, p. 54</span></figcaption>

<blockquote><p>1. The medieval scholastics that Roman Catholics turn to for the doctrine of God, such as Thomas Aquinas and Bonaventure, were completely ignorant of Greek and Hebrew, so they are incapable of giving a useful discussion of the names of God. Only one question of Aquinas’s Summa is devoted to the names of God ([pt. 1] q. 13), and it doesn’t actually state what his names are and what they mean, how they are used in Scripture, etc. Instead, it focuses on scholastic questions like “Whether any name can be applied to God substantially?” and “Whether what is said of God and of creatures is univocally predicated of them?” Protestant writers, meanwhile, such as Zanchi, Polanus, etc, give lengthy and profound analyses of the names of God in Greek and Hebrew.” (Charles Johnson, ‘No, Roman Catholic authors are not better on the doctrine of God’) . God’s Attributes Agreements Calvin: “I am that I am</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. The medieval scholastics that Roman Catholics turn to for the doctrine of God, such as Thomas Aquinas and Bonaventure, were completely ignorant of Greek and Hebrew, so they are incapable of giving a useful discussion of the names of God. Only one question of Aquinas’s Summa is devoted to the names of God ([pt. 1] q. 13), and it doesn’t actually state what his names are and what they mean, how they are used in Scripture, etc. Instead, it focuses on scholastic questions like “Whether any name can be applied to God substantially?” and “Whether what is said of God and of creatures is univocally predicated of them?” Protestant writers, meanwhile, such as Zanchi, Polanus, etc, give lengthy and profound analyses of the names of God in Greek and Hebrew.” (Charles Johnson, ‘No, Roman Catholic authors are not better on the doctrine of God’) . God’s Attributes Agreements Calvin: “I am that I am”

<blockquote><p>Objection 5… But sin unto death is sin against the Holy Spirit, as the Master [Peter Lombard] says…. Reply to Objection 5… so also among sins it is only those sins among mortal sins that are called “sins unto death” that, as far as they themselves go, are unforgivable. Therefore, sin is called “mortal” from the first death, but “unto death” because of the second death.” (Sentences, bk. 2, dist. 43, q. 1, art. 2; the ‘Exposition of the Text’ on this Distinction confirms this) For the Reformed: ‘That the Sin unto Death is the Same as the Sin Against the Holy Spirit’. . Disagreements What it is Thomas: “to sin through malice is to sin against the Holy Ghost.” (Summa, pt. 2 of 2, q. 14, art. 1) Turretin: “We say it is a universal apostasy from true Christianity or of the truth of the Gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency.” (1.647) Turretin’s view was the dominant view of the Reformed: ‘Of the Sin Against the Holy Spirit’. . Sin unto Death: Not to be Prayed for Thomas: “‘I do not say that anyone should pray for him.’ [1 Jn. 5:16]… then it must be understood in the sense that not just anyone should pray for such a sinner, since the conversion of these kinds of sinners is, as it were, miraculous. Hence just as not just anyone should pray for miracles to be performed, except great and holy men, neither should just anyone pray for the conversion of these kinds of sinners. Even so, according to the form of the words, it is not forbidden for there to be prayer for such a person.” (Sentences, bk. 2, dist. 43, ‘Exposition of the Text’) WCF 21.4: “Prayer is to be made for things lawful,[n] and for all sorts of men living… but not for… those of whom it may be known that they have sinned the sin unto death.[q] [n] 1 John 5:14 [q] 1 John 5:16</p></blockquote>

<blockquote><p>Thomas Aquinas begins Summa Theologicae Part III with reflections on the Incarnation of Christ… This section of the Summa reinvigorated Chalcedonian Christology in the West… Aquinas repeatedly affirms that Christ remains omnipresent according to his divine nature even while taking to himself a finite and circumscribed human nature, what will come to be known as the extra Calvinisticum in later centuries. Christ’s presence extra carnem, beyond the flesh, in no way separates the person of Christ but rather secures his presence with the Church.” (K.J. Drake, ‘Beyond the Flesh’) . Christ’s Human Nature: an Individual Thing Aquinas: “…although this human nature [of Christ] is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>

<blockquote><p>The mode of giving supernatural grace to nature is, Junius stated, infusion, a term that is strikingly redolent of Aquinas’s conception of the mode of communicating grace.” (Seung J. Lee, Orders of Nature &amp; Grace, p. 60) Gale: “That supernatural good and virtue comes from God by divine infusion is generally asserted and demonstrated by the sectators of Augustin and Aquinas.” (4.496) . No Proper Habitual vs. Actual Grace Distinction On Maresius and Thomas: “Supernatural habits, by contrast [with natural habits], are stirred into action by the Holy Spirit, who dwells in the recipients of habitual grace (Maresius 1646-48, 2:143). Maresius disagrees with some Roman Catholic theologians, who suggest that people imbued with habitual grace require an additional gift of ‘actual grace’ before habitual grace bears fruit. For Maresius, the Spirit’s powerful presence is quite sufficient. As a result, Maresius is suspicious of the distinction between habitual and actual grace—a distinction, he notes, which is not found in Aquinas. That said, if by ‘actual grace’ is meant simply the Spirit’s activity in exciting supernatural habits into action, Maresius does not object, although he prefers the term ‘moving grace’ (Maresius 1646-48, 2:144). And since the Holy Spirit dwells with believers permanently, he argues that moving grace is also permanently present as to the principle of its motion, even if it is not permanently active.” (Stephen Hampton in Oxford Handbook of Early Modern Theology, p. 236) . Deification Thomas: “Now the gift of grace surpasses every capability of created nature, since it is nothing short of a partaking of the Divine Nature, which exceeds every other nature. And thus it is impossible that any creature should cause grace. For it is as necessary that God alone should deify [deificet], bestowing a partaking of the Divine Nature by a participated likeness, as it is impossible that anything save fire should enkindle.</p></blockquote>

<blockquote><p>But you may say that there were musical instruments in the Old Testament, as well as vocal song. Therefore, why does the Church dismiss those but accept these? A twofold mystical meaning is given, because they were figurative. According to this, the reason is that God is praised by mind and voice but not by instruments. Another reason comes from the words of the Philosopher [Aristotle], who said that it is against wisdom that men be instructed in lyric songs and music, since they would occupy their souls in these works, but there should be simple music so that they may be drawn from bodily things and brought to the divine praises.” (On Ps. 32, sect. 308) Beza, at some length, debating with Jacob Andreae (a leading Lutheran theologian), held instruments, as used by the churches in worship, to be essentially indifferent, some of the reformed finding them profitable (and using them), and some not finding them so (and not using them). (Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586, Concordia, 2017, pp. 458, 464, 479-83, 493-95) Leigh, after referencing certain reformed divines and numerous of their arguments for musical instruments in worship, says, “Not only Dr. Ames opposes it, but Aquinas, Rivet, Zanchius, Zepperus, Altingius and others’ dislike of organs and such like music in churches, and they do generally rather hinder edification.” (System of Divinity, p. 610) Ames: “Thomas Aquinas… opposes thus: ‘The Church uses no [instruments of] music for divine praises, lest it should seem to Judaize,’ and answers thus: ‘Musical instruments do more stir up the mind to delight than frame it to a right disposition. In the Old Testament there was some need of them, both, etc. and also because they did figure [signify] out something.&#x27;” (Fresh Suit, p. 405) For more of the Reformed: ‘Musical Instruments in Worship’. . Images Agreements Nature of Idolatry Owen, speaking of idolatry: “We know it to be… ‘Any religious worship of that which by nature is not God;’ and so does your Thomas grant it to be.” (14:216; Turretin, Institutes 2.44) Rutherford, in examining the nature of idolatry, approves of Thomas teaching that “the heathen acknowledged a Godhead to dwell in the images.” (Divine Right, ch. 1, question 5, p. 152) . Disagreements Images of God &amp; Christ are Not to be Made Thomas: “…images of the Trinity and of Christ should be worshiped with the same adoration with which the prototypes are worshiped…” (Summa, pt. 3, q. 25, art. 3) Vermigli: “And Thomas Aquinas is also to be wondered at, who says that God forbade the Jews that they should not make images, because at that time the Word had not taken upon it the nature of man. What is this to the purpose; seeing we speak at this present of the images and pictures of the very nature of God, which by art, colors and lineaments cannot be described? Wherefore there is all one reason, as well of the old Hebrews as of the Christians…” (Common Places, pt. 2, ch. 5, p. 340) For more of the Reformed: ‘Images of God are Forbidden’ ‘Images of Christ’ . Divine Worship Not to be Given to Images Turretin denies Thomas (Summa, pt. 3, q. 25, art. 4) on giving the worship of latria (divine worship) to the cross itself (2:53), saying “the orthodox impugn it.</p></blockquote>

 know it to be… ‘Any religious worship of that which by nature is not God;’ and so does your Thomas grant it to be.” (14:216; Turretin, Institutes 2.44) Rutherford, in examining the nature of idolatry, approves of Thomas teaching that “the heathen acknowledged a Godhead to dwell in the images.” (Divine Right, ch. 1, question 5, p. 152) . Disagreements Images of God &amp; Christ are Not to be Made Thomas: “…images of the Trinity and of Christ should be worshiped with the same adoration with which the prototypes are worshiped…” (Summa, pt. 3, q. 25, art. 3) Vermigli: “And Thomas Aquinas is also to be wondered at, who says that God forbade the Jews that they should not make images, because at that time the Word had not taken upon it the nature of man. What is this to the purpose; seeing we speak at this present of the images and pictures of the very nature of God, which by art, colors and lineaments cannot be described? Wherefore there is all one reason, as well of the old Hebrews as of the Christians…” (Common Places, pt. 2, ch. 5, p. 340) For more of the Reformed: ‘Images of God are Forbidden’ ‘Images of Christ’ . Divine Worship Not to be Given to Images Turretin denies Thomas (Summa, pt. 3, q. 25, art. 4) on giving the worship of latria (divine worship) to the cross itself (2:53), saying “the orthodox impugn it.”

<blockquote><p>Wherefore I say that by that place of the Acts of the Apostles ‘In the name of Jesus Christ,’ is meant, by the guiding, commandment, will and institution of Christ. Wherefore by these words rather it is known that the Apostles did altogether keep the form prescribed by Christ [in Mt. 28]. Otherwise they would not have baptized in the name of Christ, doing otherwise than He had commanded. Neither are we to think that the apostles who spread abroad religion with so great godliness and endeavor, rejected the form of baptizing delivered by Christ. Neither must we pass it over that the Schoolmen (as we read in Thomas) when they agree that the form of baptizing was in a manner changed by the apostles, write that this was done for a time by the dispensation of the Holy Ghost, to the intent the name of Christ might be made the more famous, and that therefore a perpetual law should not be drawn from thence… Neither is this doctrine to be suffered, that it is put in men’s authority to invert either the matter or the words of the Sacraments as these men have most impudently done: who not only have taken away the cup from the common people, but also the words spoken thereat, the which be very comfortable, and do more largely and significantly express the mysteries of our salvation than do the words which be uttered [by the papists at the Supper]…” (Common Places, pt. 4, ch. 11, p. 210) More research on the Reformed needs to be done. . Disagreements John’s Baptism Essentially the Same as Christ’s Turretin: “Was John’s baptism essentially the same as Christ’s baptism? We affirm against the Romanists [including Thomas, Summa, pt. 3, q. 38, art. 6].” (3.398) Voet: “Whether those baptized by John’s baptism afterward ought to have been baptized by Christ’s baptism? It is denied. Whether hence John’s baptism had the same efficacy with the baptism of Christ, the apostles and our baptism? It is affirmed.” (Syllabus, pt. 1, sect. 2, tract 5, appendix 1) . Only Ministers can Baptize, even in “Necessity</p></blockquote>

<blockquote><p>…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.</p></blockquote>

l+fire.%E2%80%9D+%28Sentences%2C+bk.+4%2C+dist.+44%2C+q.+3%2C+art.+2%2C+quaestiuncula+2%29+Voet%3A+%E2%80%9CWhether+true+fire+is+given+in+Hell%2C+or+whether+it+is+only+metaphorical%3F+It+is+not+said+and+it+is+permitted+to+be+inquired+into.+Whether+it+is+corporal+or+rather+spiritual%3F+The+question+is+inept.+Whether+it+is+of+the+same+species+with+our+fire%3F+The+question+is+curious%E2%80%A6+Is+it+an+error+of+the+Faith+to+suppose+an+incorporeal+and+immaterial+infernal+fire%3F+The+question+is+absurd.%E2%80%9D+%28Syllabus%2C+sect.+2%2C+tract+6%2C+title+6%2C+subtitle+2%2C+%E2%80%98Of+Infernal+Fire%E2%80%99%29+.+Heaven+Agreements+Saints+do+Not+See+All+Things+on+Earth+through+God+Turretin+contends+against%2C+%E2%80%9Cas+the+papists+wish%E2%80%A6+the+imaginary+mirror+of+the+Trinity%2C+which+they+feign+%28as+if+saints%2C+seeing+all+things+in+the+essence+of+God+saw+all+things+done+here%29+%5Bto+support+the+intercession+of+the+saints%5D%E2%80%A6+It+displeased+not+a+few+of+the+distinguished+papists%3A+Lombard%2C+Thomas+Aquinas+%5BSumma%2C+suppl.+92%2C+art.+3%5D%E2%80%A6%E2%80%9D+%282.43%29+.+Saints+will+See+Punishment+of+the+Damned+Leigh%3A+%E2%80%9CAquinas+has+this+question%2C+Whether+the+blessed+which+are+in+the+Fatherland+see+the+punishment+of+the+damned%3F+and+resolves+they+shall%2C+because+it+makes+to+the+perfection+of+their+blessedness%2C+%E2%80%98Opposites+placed+next+to+each+other+shine+forth+more+brightly.%E2%80%99+They+shall+perfectly+see+the+punishment+of+the+wicked%2C+that+their+blessedness+may+the+more+content+them+and+they+may+give+more+abundant+thanks+to+God.%E2%80%9D+%28System+of+Divinity%2C+p.+872%29+.+The+Heaven+of+God%E2%80%99s+Throne+Room+will+Not+be+Renovated+with+Fire+Thomas%3A+%E2%80%9C%E2%80%A6the+higher+heavens+will+not+be+cleansed+by+that+fire%E2%80%A6+The+cleansing+of+the+world+will+be+for+the+purpose+of+removing+from+bodies+the+disposition+contrary+to+the+perfection+of+glory%E2%80%A6+Peter+explains+himself+to+which+heavens+he+refers%E2%80%A6+%E2%80%98the+heavens+first%2C+and+the+earth+through+water+perished%2C+which+now+by+the+same+word+are+kept+in+store%2C+reserved+unto+fire+unto+the+day+of+judgment%E2%80%99+%282+Pet+5%3A5%E2%80%937%29%E2%80%A6+Nor+did+the+empyrean+heaven+contract+any+stain%E2%80%A6%E2%80%9D+%28Summa%2C+suppl.%2C+q.+74%2C+art.+4%29+For+the+Reformed%3A+%E2%80%98On+the+Renovation%2C+New+Heavens+%26+Earth%E2%80%99.+.+Mixed+Deification+Thomas+affirmed+a+kind+of+deification+of+heavenly+saints+with+respect+to+the+light+of+glory+and+the+beatific+vision.+Yet+for+Thomas%2C+%E2%80%9Cthe+light+of+glory%2C+like+the+habit+of+grace%2C+is+something+created.+So+in+either+state%2C+pre-+or+post-mortem%2C+deification+is+something+created.%E2%80%9D+%28p.+32%29+This+is+in+contrast+to+deification+being+grounded+in+uncreated+grace%2C+per+the+Eastern+Orthodox%2C+which+entails+the+host+of+problems+often+associated+with+the+term.+See+Richard+Cross%2C+%E2%80%98Deification+in+Aquinas%E2%80%99.+Yet+many+of+the+Reformed+were+hesitant+or+contrary+to+accepting+Thomas%E2%80%99s+exact+method+and+paradigm+of+how+saints+see+God.+See+on+the+Beatific+Vision+below.+Yet%2C+Carl+Mosser+has+found+the+concept+and%2For+terminology+of+deification%2C+in+protestant+senses%2C+in+Martin+Luther%2C+Ulrich+Zwingli%2C+Martin+Bucer%2C+Henry+Bullinger%2C+John+Calvin%2C+Richard+Hooker+and+Jonathan+Edwards%3A+%E2%80%98Deification%3A+a+Truly+Ecumenical+Concept%E2%80%99+and+%E2%80%98Recovering+the+Reformation%E2%80%99s+Ecumenical+Vision+of+Redemption+as+Deification+and+Beatific+Vision%E2%80%99.+Using+the+term+of+deification+for+growing+more+and+more+into+the+image+of+God%2C+through+beholding+Him%2C+for+all+eternity%2C+is+not+to+no+purpose.+2+Pet.+1%3A4+says+%E2%80%9Cthat+by+these%2C%E2%80%9D+including+godliness%2C+all+graces+and+the+promises+of+God%2C+including+that+of+glorification%2C+%E2%80%9Cye+might+be+partakers+of+the+divine+nature%E2%80%9D.+Ps.+17%3A15%3A+%E2%80%9CAs+for+me%2C+I+will+behold+thy+face+in+righteousness%3A+I+shall+be+satisfied%2C+when+I+awake%2C+with+thy+likeness.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+Where+Reformed+Orthodox+Writers+Agreed+%26+Disagreed+with+Aquinas%2C+Purgatory+is+Not+Real%2C+Ussher%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F672ce0b2da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/672ce0b2da.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/where-reformed-orthodox-writers-agreed-disagreed-with-aquinas/#:~:text=this%20being%20a%20case%20with%20them,when%20I%20awake%2C%20with%20thy%20likeness&amp;text=this%20being%20a%20case%20with%20them%20%5B%E2%80%9Cour%20Romanists&amp;text=be%20satisfied%2C%20when%20I%20awake%2C%20with%20thy%20likeness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d1249d1fe4" data-kw="">
<blockquote><p>Fully adequate [exhaustive] knowledge is something of which we possess very little. Everywhere and in every area of life we finally run into mystery. The inner being of things, the thing as such, escapes our perception. We observe phenomena and from them infer the essence of things; we learn to know stable properties and from them we deduce the substance, but this substance itself lies behind the phenomenon and as such is unknown to us. Physics assumes the existence of atoms or electrons or energies as the final components of the material world, but does not have even a smidgen of empirical knowledge of them. Only the most simple things can be defined. As soon as things are of a somewhat higher order, they can no longer be completely captured in a concept. This is already true of the visible world, but it is even more applicable in the world of invisible things. Human beings are corporeal, sense-oriented beings. All their knowledge originates in, and arises from, sense perception. Our thinking is bound up with our senses, just as our soul is with our body. We never perceive spiritual realities directly but only by the medium of material things. We see all things ‘dimly.’ Not only God but also the soul and the entire spiritual world only become known to us through the medium of the world of the senses. This is why we refer to all spiritual matters with names that have their primary reference in the visible world… The same is true in religion and theology. There is no fully adequate knowledge of God. We cannot name him as he is within himself. All his names are derived from the world of creatures. But this does not make them untrue, a product of human imagination. Just as there is resemblance between various parts of the world, making comparison between them a possibility, so also there is kinship between God and his creatures, a kinship that warrants the use of creaturely language in speaking of him. Furthermore, though temporally the natural is prior to the spiritual, logically and ideally the spiritual precedes the natural. The natural could never guide us to the spiritual if it had not itself proceeded from the spiritual.</p></blockquote>

<blockquote><p>…That three things are recorded as created, namely, the heaven, the water, and the earth; and these three received their form from the three days’ work of distinction, so that heaven was formed on the first day; on the second day the waters were separated; and on the third day, the earth was divided into sea and dry land. So also is it in the work of adornment; on the first day of this work, which is the fourth of creation, are produced the lights, to adorn the heaven by their movements; on the second day, which is the fifth, birds and fishes are called into being, to make beautiful the intermediate element, for they move in air and water, which are here taken as one; while on the third day, which is the sixth, animals are brought forth, to move upon the earth and adorn it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, 1a 70.</span></figcaption>

<blockquote><p>It should be carefully noted that our criticism of this procedure does not imply that we hold it to be wrong for the Christian church to make formal use of the categories of thought discovered by Aristotle or any other thinker. On the contrary, we believe that in the Providence of God, Aristotle was raised up of God so that he might serve the church of God by laying at its feet the measures of his brilliant intellect. When Solomon built the temple of God he was instructed to make use of the peculiar skill and the peculiar gifts of the pagan nation that was his neighbor. But this was something quite different than to build together with pagan nations. The Samaritans wanted to help the Jews construct the city and the temple. Hence they were rejected by the true Jews. The Phoenicians merely wanted to bring their treasures to Solomon and let him construct the way he saw fit. Hence they were gladly received by Solomon.</p></blockquote>

<blockquote><p>…those who founded sects committed to erroneous doctrines proceeded in a way that is opposite to this, The point is clear in the case of Muhammad. He seduced the people by promises of carnal pleasure to which the concupiscence of the flesh goads us. His teaching also contained precepts that were in conformity with his promises, and he gave free rein to carnal pleasure. In all this, as is not unexpected, he was obeyed by carnal men. As for proofs of the truth of his doctrine, he brought forward only such as could be grasped by the natural ability of anyone with a very modest wisdom. Indeed, the truths that he taught he mingled with many fables and with doctrines of the greatest falsity. He did not bring forth any signs produced in a supernatural way, which alone fittingly gives witness to divine inspiration; for a visible action that can be only divine reveals an invisibly inspired teacher of truth. On the contrary, Muhammad said that he was sent in the power of his arms—which are signs not lacking even to robbers and tyrants. What is more, no wise men, men trained in things divine and human, believed in him from the beginning, Those who believed in him were brutal men and desert wanderers, utterly ignorant of all divine teaching, through whose numbers Muhammad forced others to become his followers by the violence of his arms. Nor do divine pronouncements on the part of preceding prophets offer him any witness. On the contrary, he perverts almost all the testimonies of the Old and New Testaments by making them into fabrications of his own, as can be seen by anyone who examines his law. It was, therefore, a shrewd decision on his part to forbid his followers to read the Old and New Testaments, lest these books convict him of falsity. It is thus clear that those who place any faith in his words believe foolishly.</p></blockquote>

<blockquote><p>True philosophy, although it also differs very much from the doctrine of the church, yet, it does not array itself against it nor is it a wicked fabrication and device of Satan, as is true of the false doctrines of the sects, but it contains truth and is, as it were, a certain ray of the wisdom of God, impressed upon the mind of man in his creation. It is a doctrine that has respect to God and his creatures and many other things that are good and profitable to mankind and has been drawn out from the light of nature and from principles, in themselves clear and evident, and reduced to a system by wise and earnest men. It follows, therefore, that it is not only lawful but also profitable for Christians to devote themselves to the study of philosophy.</p></blockquote>

<blockquote><p>A controversy respecting the atonement sprang up between Duns Scotus and the followers of Aquinas, which involved fundamental principles in ethics and religion, and divided the Romish Church into two great parties of Thomists and Scotists. Duns Scotus denied the Anselmic doctrine that sin is of infinite demerit, and consequently denied that the suffering of Christ is of infinite value. The relation of the atonement of the Son of God to the sin of mankind, he maintained, is merely an arbitrary and constituted one. The principle upon which he founded his theory was: “Tantum valet omne creatum oblatum, pro quanto acceptat Deus illud, et non plus.” There is no interior fitness and adaptation between Christ’s atonement and man’s sin. God was pleased to accept this particular sacrifice as an offset and equivalent for human transgression, not from any intrinsic value in it, but because he so pleased. He might have accepted any other substitute, or he might have dispensed with accepting any substitute at all. In opposition to this view, the followers of Aquinas maintained the old Anselmic theory of the infinite demerit of sin, and the infinite and objective value of Christ’s satisfaction. In this controversy, the soteriology of the adherents of Aquinas is more in harmony with the Protestant view and feeling; so that we might reverse what Melanchthon remarks of Augustine, and say, that “the opinion of Aquinas is more pertinent, fit and convenient when he disputed than it was when not disputing.” And yet it would be difficult to see how the followers of Aquinas could in the end avoid the conclusions of Duns Scotus, if they started from that doctrine of a relative necessity of satisfying justice which we have seen Aquinas held, in common with all the Schoolmen excepting Anselm. If omnipotence and bare will are more ultimate in the Divine Nature than justice and truth are, then it is difficult to see how Scotus can be censured for holding, that in the last analysis God can dispense with an atonement altogether, and that whatever value the existing judicial provision possesses in the divine plan, it possesses not in itself, but solely by virtue of its optional acceptance by the Omnipotent One who is not limited by anything, not even by his own moral attributes. The controversy, however, ran high between the adherents of Aquinas and Scotus,—the Dominican order generally siding with the former, and the Franciscan with the latter. The Nominalists in philosophy also naturally favoured the views of Scotus, as his theory was that of a nominal and putative satisfaction, in distinction from a real and objective one. The extravagantly speculative minds of the age, those who have given the reputation of hair-splitting and excessive dialectics to Scholasticism, also adopted the positions of Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Theology</cite>, (New York: Scribners) 2.315</span></figcaption>

</figure><figure class="quote" id="q-1a256fba76" data-kw="">
<blockquote><p>That the observances of the old law are better called signs than sacraments. For those things which were instituted only for the sake of signifying are merely signs, and not sacraments; such were the carnal sacrifices and the ceremonial observances of the Old Law, which could never justify those who offered them. As the Apostle says, “the blood of goats and of oxen, and the ashes of an heifer being sprinkled, sanctified such as are defiled, for the cleansing of the flesh,” [Heb 9:13] ‘not of the soul’ [Glossa Ordinaria] because the defilement arose from contact with the dead.—Augustine. Hence Augustine: ‘By that defilement which the Law cleanses, I understand noting other than contact with a dead person; anyone who touched such a person was unclean for seven days; but according to the Law he was purified on the third and seventh day, and was cleansed,’ so that he might enter the Temple. At times, those legal observances also cleansed ‘from bodily leprosy’; but as the Apostle says, no one was ever justified by the words of the Law, even if they were done in faith and charity. Why? —Ambrose, On the Letter to the Hebrews: ‘Because God imposed them for servitude, not for justification, and that they should be a figure of the future, willing them to be offered to himself rather than to idols.’ —And so they were sings; and Scriptures, because they were signs of a sacred thing, which they certainly did not confer. 4. Which things are called works of the Law. The Apostle calls those things the works of the Law which were instituted only for the sake of signifying, or as a burden.</p></blockquote>

</figure><figure class="quote" id="q-51aea02d86" data-kw="">
<blockquote><p>Theology is a discipline, partly theoretical and partly practical, teaching the manner of living well and blessedly for eternity. … We know God and Christ in such a way that this knowledge produces something in us. Thus, when I know that God is all‑knowing, I ascribe to him this praise: that he knows all my defects and the poverty of both my soul and body. From this, I turn to prayer, asking him to pardon the former and graciously supply the latter. Likewise, when I know him to be almighty, I turn to him so that he may bend my heart to his statutes. Therefore, the knowledge of God’s omnipotence, omniscience, and his other attributes is indeed theoretical, yet it produces practice within us. And so theology consists partly in contemplation and partly in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Theologici: Theological Commonplaces</cite>, (Amsterdam, 1658), p. 1. (Translated by Copilot.)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-085c832adc" data-kw="">
<blockquote><p>Nor do I wish the philosophical‑theological exercises to be omitted or neglected by those approaching theology. For although philosophy is often abused — from which the Apostle found it necessary to warn us: “See that no one takes you captive through philosophy and empty deceit” (Col. 2:8) — yet both the ancients and the moderns, by their example and use, have shown that its right use is of great help, not only in all other sciences, arts, and the whole life of man, but also in theological doctrine.

Here, as in all things, there are limits, beyond which or short of which it is not right to stand. He who measures matters of faith by the principles of philosophy, who thinks its rules hold in theology as in nature, or who uses its acuteness, subtleties, and distinctions for barren and cold speculation, for contention and vain glory — such a man, by understanding, comes to understand nothing. Meanwhile, he who does not think the mind ought to be adorned by philosophy as the tongue is by literature, who does not wish the inner speech of the mind, as well as the outward speech of the mouth, to be directed and polished by art, or who thinks something sounds ill merely because it comes from philosophy — such a man seems to me no less in error.

For although philosophy does not have the same rule, dignity, or necessity as theology, yet in forming and expressing concepts, in penetrating the subtleties of things and questions, in refuting the evasions of adversaries, it greatly helps not to be entirely without it. We require a moderate use of philosophy in theological matters; we entirely forbid its dominion.

Luther said aptly in his Disputation on the Simplicity of God and the Trinity of Persons: “When dialectic argues that something does not square with its rules, we must say to it, ‘Let the woman keep silence in the Church.’” The Fathers use a similar image of Hagar the handmaid, who is commanded to be cast out of the house when she behaves too wantonly and wishes to rule her mistress at her own pleasure.

When philosophy rises too imperiously against theology, seeks a dictatorship, or tries to confine the most august truth within its own bars and rules, it must be expelled; and where it tends toward contention, it must be modestly avoided. For truth, wherever it is, has this first: that it is chaste; then that it is peaceable (James 3:17). But that which has bitter zeal and strife may be called “wisdom,” but it is earthly, sensual, and demonic, says the Apostle.</p></blockquote>

</figure><figure class="quote" id="q-5d4f703ef3" data-kw="">
<blockquote><p>Why have any religion at all? Is it not enough to have a good, sensible philosophy?” No. If this had been enough, clericalism would have been driven to the wall long ago. The experiment has been thoroughly tried in France for eighty years, and has failed. The power of the priesthood tends to increase, and the superstitions of the Roman church grow worse and worse.

No doubt atheism in its various forms — materialism, pantheism, positivism has advanced and spread; but the bourgeoisie — the bulk of the well-to-do citizens — have a horror and dread of atheism, and by this very fact are impelled to support the only church they know of; and so superstition is made fashionable. “Man cannot live by bread alone.” All his higher cravings are famished when he attempts to subsist only on what he can find in atheism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/leonard-woolsey-bacon.html">Leonard Woolsey Bacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Wonderful Work in France: An Introduction of the Deputation from the Protestants of France to the American Churches</cite>, (New York: American Tract Society, 1880), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-68d34d71d0" data-kw="">
<blockquote><p>Arius, although he would say that Christ was before the blessed Virgin and that the person of the Father is other than the person of the Son, nevertheless made a three-fold attribution to Christ: first, that the Son of God was a creature; second, that he is not from eternity, but was formed the noblest of all creatures in time by God; third, that God the Son is not of one nature with God the Father, and therefore that he was not true God.

But this too is erroneous and contrary to the teaching of the Holy Scriptures. For it is written: I and the Father are one (John 10:30), that is, in nature; and therefore, just as the Father always existed, so also the Son; and just as the Father is true God, so also is the Son. That Christ is a creature, as said by Arius, is contradicted by the fathers in the Creed: true God of true God; and the assertion that Christ is not from eternity but in time is also contrary to the Creed: begotten not made; and finally, that Christ is not of the same substance as the Father is denied in the Creed: consubstantial with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositio in Symbolum Apostolorum</cite>, (1273), S2.7.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“Arius, although he would say that Christ was before the blessed Virgin and that the person of the Father is other than the person of the Son, nevertheless made a three-fold attribution to Christ: first, that the Son of God was a creature; second, that he is not from eternity, but was formed the noblest of all creatures in time by God; third, that God the Son is not of one nature with God the Father, and therefore that he was not true God.

But this too is erroneous and contrary to the teaching of the Holy Scriptures. For it is written: I and the Father are one (John 10:30), that is, in nature; and therefore, just as the Father always existed, so also the Son; and just as the Father is true God, so also is the Son. That Christ is a creature, as said by Arius, is contradicted by the fathers in the Creed: true God of true God; and the assertion that Christ is not from eternity but in time is also contrary to the Creed: begotten not made; and finally, that Christ is not of the same substance as the Father is denied in the Creed: consubstantial with the Father.”

<blockquote><p>These movements are named as English Methodism and above all in our day the so-called Sanctification-movement. The language in which they are introduced is very carefully guarded, but what is meant is simply that in these two movements, Methodism and what we know as the Higher Life Movement, with its continuations, we have “reactions” from the Reformation doctrine of the “miserable sinner.” And accordingly we are told clearly a page or two later, where the problem of sin in the Christian life is spoken of, that “Methodism and the Sanctification-movement present therefore a reaction from the solution of Christian miserable-sinnerism which is fostered in Lutheran circles.” This representation is true.

The perfectionist teaching of these several movements, whether in its crasser or in its more guarded forms, is a revolt against the Reformation doctrine not only of the continued imperfection of the Christian in this life where he enjoys only the first fruits of salvation, but of sin and grace in general, which constitutes the pivot on which the whole system of Reformation teaching turns.

And we may count it among the most beneficent results of the discussion of the Biblical teaching on the sins of Christians which we have been reviewing, if we can learn from it this fact; and with it this other fact, that the appeal of these movements to the Scripture in behalf of their teaching has, in the most elaborate effort which has yet been made to validate it, completely failed. The most striking thing about the long continued attempt which has been made to prove that to Paul the Christian is a sinless man is the clearness with which it has come out that Paul knows nothing of a sinless man in this life.</p></blockquote>

<blockquote><p>In his twelfth chapter he saith, [That many revolted from the Church of Rome, because the Schoolmen brought in Philosophy, and Aristotle’s doctrine into Religion; whence arose contradictions and absurdities, as brought the Clergy into a reputation of ignorance.] It is strange that Philosophy should make the Clergy reputed ignorant, whereas it contains the knowledge both of divine and human things: and it is one of the chief blessings of Almighty God, bestowed upon mankind, by which his image lost in Adam is repaired; for the understanding is enlightened by the speculative, and the will is regulated by the practical parts thereof: and Philosophy is so far from causing peoples revolt from that Church; that on the contrary, it is one of the main supporters and pillars thereof: I am afraid that it was not Philosophy which brought a reputation of ignorance upon that Church, but rather their want of it, which also will occasion much ignorance, stupidity, and darkness in our Church: And I pray you good Mr. Hobbs, what hurt hath Divinity received from Philosophy, or Aristotle’s doctrine.

Hath it caused contradictions, and absurdities; (as you say) sure, you are widely mistaken: for by Philosophy contradictions and absurdities are avoided, into which those ignorant souls do fall, who want it, as we find at this time by woeful experience, there being more absurd and contradictory opinions among the people of this Nation, now, in a few years since Aristotle’s doctrine hath been discouraged, then were all the time hitherto since Christianity was embraced. And what wonder is it if they that walk in darkness stumble: How should we come to know the heavens, the earth, the seas, the fire, the air, the beasts, fishes, and fowls, the herbs, trees, plants, precious stones, all which physical bodies, with divers others are mentioned in Scripture: besides, Spirits, Angels, and other Metaphysical entities: without Philosophy, how should we define, divide, dispute, speak or write methodically or syllogistically without this.

I will say nothing of the benefit we receive by moral, political, and economical Philosophy: How shall we dispute against Heretics, and refel their subtle arguments without it. Justin Martyr, and many other Greek and Latin Fathers, fought against the Gentles, Jews, and Heretics, with this sword, and beat them with their own weapons; therefore to condemn Philosophy, is to condemn the minister and handmaid of divinity; between which there can be no more repugnancy, then there is between the principal and subordinate cause, between two lights, two truths, or between the body and the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), pp 17-18.</span></figcaption>

<blockquote><p>Moreover, there is yet another reason for which, out of charity, we love more those who are more nearly connected with us, since we love them in more ways. For, towards those who are not connected with us we have no other friendship than charity, whereas for those who are connected with us, we have certain other friendships, according to the way in which they are connected.

Now since the good on which every other friendship of the virtuous is based, is directed, as to its end, to the good on which charity is based, it follows that charity commands each act of another friendship, even as the art which is about the end commands the art which is about the means.

Consequently, this very act of loving someone because he is akin or connected with us, or because he is a fellow-countryman or for any like reason that is referable to the end of charity, can be commanded by charity, so that, out of charity both eliciting and commanding, we love in more ways those who are more nearly connected with us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologica</cite>, (c. 1266-73), II-II, Q. 26, Art. 7, co.</span></figcaption>

</figure><figure class="quote" id="q-8c7592e0f8" data-kw="">
<blockquote><p>Theology in general is teaching or a word about divine things. In this sense, the old Greek writers called those who taught a word about divine things theologians. And since there can be a word about God or divine things from either nature or revelation, the former comes as natural theology and the latter as revealed theology.

Natural theology is a word about God from nature, taught by the dictation of reason alone. For “what can be known about God is manifest in them, for God has manifested it to them. For since the creation of the world His invisible attributes are seen, having been observed in what has been made, His eternal power and divinity”—not unto the end that they may be saved through such knowledge, but “so that they are inexcusable” (Rom. 1:19–20).

Revealed theology is teaching about God, reconciling man, the sinner, to Himself in Christ, and in the same right knowledge and godly worship, revealing it through His word for the salvation of man, the sinner, and the glory of God. For “this is eternal life, that they may know You, the only true God, and the one whom You have sent, Jesus Christ” (John 17:3). “We speak out of sincerity, as from God, before the face of God in Christ” (2 Cor. 2:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), I.I-III, Kindle Locations 562-572.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Theology in general is teaching or a word about divine things. In this sense, the old Greek writers called those who taught a word about divine things theologians. And since there can be a word about God or divine things from either nature or revelation, the former comes as natural theology and the latter as revealed theology.

Natural theology is a word about God from nature, taught by the dictation of reason alone. For “what can be known about God is manifest in them, for God has manifested it to them. For since the creation of the world His invisible attributes are seen, having been observed in what has been made, His eternal power and divinity”—not unto the end that they may be saved through such knowledge, but “so that they are inexcusable” (Rom. 1:19–20).

Revealed theology is teaching about God, reconciling man, the sinner, to Himself in Christ, and in the same right knowledge and godly worship, revealing it through His word for the salvation of man, the sinner, and the glory of God. For “this is eternal life, that they may know You, the only true God, and the one whom You have sent, Jesus Christ” (John 17:3). “We speak out of sincerity, as from God, before the face of God in Christ” (2 Cor. 2:17).”

2e0f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8c7592e0f8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/06/29/johann-heinrich-heidegger-on-theology-natural-and-revealed/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>117. How is systematic theology distinguished, as to its arrangement, or method of conducting it? Ans. Into Positive and Scholastic.

118. What is the Positive? Ans. Such as commentaries on the Scriptures, following the order of the Scriptures, and not the connexion of doctrines — and insulated discourses.

119. What is the Scholastic method? Ans. A method conducted according to the rules of logic, setting forth the doctrines of divine truth in their connexion of matter, and dependencies of one part on another.

120. Is the Scholastic method to be approved? Ans. Yes; it is properly the systematic method, the method of schools, and is commended to us by the schools of the prophets, the creeds and collections of the Fathers, and by the example of the apostle Paul, to the Romans, Galatians, Hebrews, &amp;c.

§ XXVI. 121. What is commonly meant by scholastic theology? Ans. A Popish theology, which was begun about the twelfth century, by Peter Lombard. They divided into sects, called Thomists, Scotists, Realists, Nominalists, &amp;c. They had some good philosophical speculations and expressions, and some clear testimonies to divine truth; but they are justly blamed for the use they make of the authority of the Fathers and Philosophers, leading to neglect the Scriptures, and for their errors, curious and useless questions, barbarous terms, and darkening of the Scriptures by their explanations.</p></blockquote>

<blockquote><p>The mind, let us suppose, first awakened perhaps to the special questions of theology, is further awakened to the wider questions of philosophy. What then is the transition effectively in effect, though only potentially or intensively in relation to time? It does not mean importation of the dogmas of philosophy into theology, so as to displace, or to conceal, the proper matter of theology,—that given in supernatural revelation of God. In every age there has been a process of this sort, always to the detriment both of theology and of philosophy, especially of the former: one might venture to say that in every age the sorest calamities of theology have been occasioned by her adoption of dogmas from the then prevailing philosophy or science.

The legitimate transition here means a man’s bringing to the contemplation of matters properly of theology that refinement which natively results from philosophical culture,—a philosophical manner of looking at every matter, and even of speaking of every matter, such as to give corresponding form to the matter in hand. This philosophical manner, of contemplation and representation, of research and exposition, may, though the philosophy be chronologically after the theology in origin, yet, in effect, continue throughout a theological lifetime to be as a logical or psychological antecedent, a disciplined habit of mind conditioning thought and even utterance, about theology as about everything else.

It thus appears that the transition does not necessarily and ought not to involve abandonment of philosophy. Justin Martyr, when he entered the Christian Church, brought his philosopher’s cloak along with him. So in effect do we all, who have had the cloak, unless we leave an important talent unfruitful of interest. We may not wear it ostentatiously, or even openly: some of us may have it and wear it only, so to speak, as lining for the Geneva gown. But if we ever have had it, we are bound to have it and wear it always.

Thus the theological system of the Church, while the matter of it is or ought to be drawn exclusively from positive revelation, is for its form indebted to Aristotle, and in a higher sense to Plato. The ideal of theological study, a philosophically trained and gifted mind seeking truth only in that revelation, has rarely been realised, perhaps not least rarely in our day, when multitudes are professedly Biblical in their study and philosophical in their preparation for the study. And one reason for the rarity is, that men really either do not attain to the philosopher’s cloak, or cease to have it and to wear it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-macgregor.html">James MacGregor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Transition from Philosophy to Theology in British and Foreign Evangelical Review</cite></span></figcaption>

<blockquote><p>The relation of events, causal and successive, in the pre-millenarian eschatology, while a favourite with many, and to some minds a very fascinating one, is not that usually held among Protestant Christians. It is not the prevalent view among Presbyterians. It is not the view taught in the Catechisms or in the Confession of Faith of our church. On the other hand it is there expressly disavowed. Standard writers on systematic theology, who necessarily take the comprehensive view of God’s gracious plan, almost to a man discard this order as one which cannot be made, in its varied elements, to square with itself or with the most definite teachings of Scripture.

It assumes that the second advent will usher in the millennium, when our Lord will reign on the throne of Israel in Jerusalem as did King David. It foresees a brilliant reign whose splendours are to be sensuous and Jewish. It avoids those passages of Scripture which connect immediately the coming of Christ and the final judgment of all the world, and which affirms that this coming is a coming to judge. It holds to a separate resurrection of the righteous and the wicked, one at either end of the millennium, a doctrine that rests on one verse in the midst of a mysterious and symbolical passage, and on a construction of that verse that is not only not necessary but is in the highest degree improbable; since, in addition to being out of analogy with the rest of Scripture, it assumes without proof that the resurrection of the souls there spoken of is a resurrection of the body, and further, that it is a resurrection of all the righteous dead; a meaning not only not in the passage but expressly precluded by the fact that it is of certain martyrs who had been beheaded for the witness of Jesus that the evangelist in writing.

The theory of two resurrections, that apex upon which the whole millenarian scheme, as an inverted pyramid, rests, is not an affirmation of Scripture but an unwarranted inference. The closing verses of the twentieth chapter of Revelation describe a general judgment of all the dead, small and great, as they stand before God and the great white throne, and a general resurrection of all the dead, to the end that they appear before that august tribunal. Now, I cannot place these events nor can I know what is meant by the last ” great day,” if I postulate the theory of two resurrections as it is usually held.</p></blockquote>

<blockquote><p>Christianity is so perfectly agreeable to the nobler powers of the human soul, that it has with much propriety been called the religion of philosophers. Philosophy is an excellent auxiliary to this divine institution, which draws from it the finest illustrations. Considered merely in this light, it merits from the friends of our religion, particular attention. But, separate philosophy from the Christian system, and, as the sources to mankind of knowledge, of virtue and happiness, they will, not even for a moment, admit of a comparison. In these respects, the latter is infinitely more perfect.</p></blockquote>

</figure><figure class="quote" id="q-9a5a5dc267" data-kw="">
<blockquote><p>The supporters of this Seminary are thorough and sound Presbyterians. No uncertain note is given from the pulpits of the alumni of this institution. The directors believe that the students graduated from this Seminary will be, theologically, largely what you make them. Therefore, we believe your teaching must be dogmatic. Your philosophy and your metaphysics will be great contributions to the power of your teaching. But, after all, our theology is not based on secular philosophy or modern psychology but on the Word of God, as contained in the Holy Scriptures, — described in our Confession as the only infallible rule of faith and practice.

Therefore, we expect the students to be taught with a fire of conviction, which cannot help leaving its impression upon them, so that your teaching will not seem to be the abstract discussion of a man who has only half thought his subject through: “Ever learning, but never coming to a knowledge of the truth”. But rather that kind of teaching which presents the result of the teacher’s own labours as he builds his system of theology on the eternal truth of God, revealed by him in our infallible Scriptures.

Such a teacher translates his theological science for his students — not alone correlating great theological principles or distinguishing the Biblical and professional teaching from erroneous views; but while it will be teaching of the highest scholarship, it will gain power — constructive power — by reason of the teacher’s own experience in the application of these great truths to his own soul. This, I believe, is what makes great theological teachers. It was this that made more than one of your distinguished predecessors what they were, and it is this that produces in our ministry men who are not dabblers in theology, but constructive defenders of our Presbyterian doctrinal heritage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/maitland-alexander.html">Maitland Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charge to Dr. Snowden in Bulletin of the Western Theological Seminary</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-057b1fe018" data-kw="">
<blockquote><p>Accordingly, the best form of government is in a state or kingdom, where one is given the power to preside over all; while under him are others having governing powers: and yet a government of this kind is shared by all, both because all are eligible to govern, and because the rules are chosen by all. For this is the best form of polity, being partly kingdom, since there is one at the head of all; partly aristocracy, in so far as a number of persons are set in authority; partly democracy, i.e. government by the people, in so far as the rulers can be chosen from the people, and the people have the right to choose their rulers.

Such was the form of government established by the divine law. For Moses and his successors governed the people in such a way that each of them was ruler over all; so that there was a kind of kingdom. Moreover, seventy-two men were chosen, who were elders in virtue: for it is written (Dt. 1:15): “I took out of your tribes wise and honorable, and appointed them rulers”: so that there was an element of aristocracy. But it was a democratical government in so far as the rulers were chosen from all the people; for it is written (Ex. 18:21): “Provide out of all the people wise men,” etc.; and, again, in so far as they were chosen by the people; wherefore it is written (Dt. 1:13): “Let me have from among you wise men,” etc. Consequently it is evident that the ordering of the rulers which the Law provided was the best.</p></blockquote>

</figure><figure class="quote" id="q-e0313fd875" data-kw="">
<blockquote><p>This discussion about University education leads up to another view of the transition from philosophy to theology. The Scottish Churches have made statutory the transition, formal and express, as a vital part of the training of young men for the ministry. They will have no one licensed to preach who has not previously undergone a theological curriculum of studies in the Halls; and they will allow no one to enter the Hall as a regular student who has not passed through an arts curriculum distinctively philosophical.

There, then, is the transition from philosophy to theology prescribed by law. It is true that in some cases the law may be obeyed only in form. One student may leave the University without anything perceptible of philosophical culture or attainment. Another may leave the Hall with little or nothing of real theological culture or attainment. Thus the transition may not be a reality in this or that case: either because the student has not philosophy to begin with; or because he does not come to have theology to end with; or both. But what we now look to is the ideal in the mind of the churches as represented by their law. And looking to this we see that the transition from philosophy to theology ought in their judgment to have place in the formative process of preparation for the Christian ministry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-macgregor.html">James MacGregor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Transition from Philosophy to Theology in British and Foreign Evangelical Review</cite></span></figcaption>

terial-training/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Since, therefore, ignorant theology has so many ills, it is easy to judge that the Church has need of many great arts. For in order to judge and to explain correctly and distinctly complicated and obscure things, it is not sufficient to know the common precepts of grammar and dialectic, but varied knowledge is needed; for many things are to be taken from natural philosophy, and many are to be contributed to Christian teaching from moral philosophy.

Furthermore, there are two things for the acquiring of which great and varied knowledge and long practice in many arts are necessary, namely method and style of discourse. For no one can become a master of method, unless he is well and rightly versed in philosophy – indeed in that one kind of philosophy that is alien to sophistry, searches for and discloses truth properly and by the right path. Those who are well versed in these studies, and have obtained for themselves the habit (hexin) of relating to method everything that they want to understand or teach to others, also know how to represent methods in religious discussions, how to clear up what is complicated, pull together what is scattered and shed light on what is obscure and ambiguous.

Great and abundant knowledge is also needed for another purpose, namely for the shaping of a discourse, as all know who have occupied themselves even slightly with literature. No less study is needed in order to acquire this habit (hexin) of shaping method. It cannot be achieved by those who are not versed in most parts of philosophy. Those who have no practice in these would obtain only the shadow of method, even if they acquired dialectic. None produces what is corrupt and sophistic more often than these men. Whereas they consider themselves masters of method, they nevertheless stray from the path, and they are, to use the Homeric word, blind watchmen (alaoskopoi).

Moreover, there is the need for philosophy not only because of method, or, as Plato calls it, inevitable rules for composition (anankēn logographikēn) [Phaedrus 264b7], but, as I said before, the theologian needs to adopt many things from natural philosophy, where the relation of the single parts is such that for those who strive for genuine knowledge it is not sufficient to choose a few aspects, but, as far as possible, the entire art needs to be known. The theologian who does not know of these most learned discussions on the soul, the senses, the causes of desires and emotions, on knowledge and on will, lacks a great tool. And he acts insolently who professes himself a dialectician if he is ignorant of those distinctions between causes that are only taught in natural philosophy and can only be understood by natural philosophers. Doubtless there is a cycle of arts by which they are all bound together and connected, so that in order to grasp individual ones many of the others have to be taken on. Therefore the Church has need of the entire cycle of sciences.

I do not believe that anyone is so foolish as not to notice that those who are versed in moral philosophy can practise more easily many parts of Christian doctrine. For if many things are similar, concerning laws, political morals, contracts and many of life’s affairs, we are helped, not only by the order and method in philosophy, but also by understanding the things themselves carefully. If some things are dissimilar, then a comparison brings much light. Moreover, one who lacks a knowledge of natural philosophy practises moral philosophy like a lame man holding a ball. Again, history and the exact computation of time periods require mathematics, but that part also needs to be joined to natural philosophy, for from the former, as from a source, many things in natural philosophy take their origin. And it is a form of barbarity, to say nothing else, to spurn the most beautiful arts concerned with the motions of the constellations that bring about for us the distinction between the years and seasons, announce many great things that are to come, and warn us in a useful way.

I am not ignorant of the fact that philosophy is one kind of teaching and theology another, nor do I want to mingle them in such a way as a cook mixes together many sauces [Plautus, Ghosts 1.3.120], but I want to help the theologian in the management of method. For he will need to borrow many things from philosophy. If anyone does not trust this oration, let him consider the theology of the ignorant, and let him ponder with himself if he wants to let loose on the world such miscellaneous sophistry, and wants doubtful theology to be brought upon the Church. By ignorant I mean not only those who are unskilled in letters, such as the Anabaptists, but also those impertinent men who, although they may declaim magnificently, nevertheless say nothing true, both because they are not used to the method, and because they do not grasp the origins of things sufficiently. Therefore, because they are not trained in philosophy, they do not understand sufficiently what theology professes, or to what extent it agrees with philosophy.

There is no need to recount here the ancients, who thoroughly overwhelmed Christian doctrine by the most foolish subtleties. I am searching for erudite philosophy, not the sophistries where there is nothing underneath. Therefore I said that one kind of philosophy has to be chosen which has as little as possible of sophistry and which preserves the true method; the teaching of Aristotle is of that kind. Nevertheless it still needs the addition, from elsewhere, of that most excellent part of philosophy that is concerned with the heavenly movements.

For the other philosophical sects are full of sophistry and of absurd and false opinions, which are also harmful to the character. For the exaggerations of the Stoics, namely that good health, riches and similar things are not good, are altogether sophistic. Apatheia, too, a false and dangerous opinion on fate, is imaginary. Epicurus is not philosophising but being facetious when he asserts that everything exists by chance; he takes away the first cause, and disagrees in everything with the true teaching of the physicists. The Academy [of Plato], too, is to be shunned, which does not preserve method, and takes an excessive licence to overturn everything; those who strive to do this must by necessity conclude many things in a sophistic way. However, he who follows mainly Aristotle as a guide, and aspires to one, simple and the least sophistic teaching, can now and then take on something from other authors, too.</p></blockquote>

</figure><figure class="quote" id="q-b5962683e4" data-kw="">
<blockquote><p>But someone will say that it is foolish to believe what is not seen, and that one should not believe in things that he cannot see. I answer by saying that the imperfect nature of our intellect takes away the basis of this difficulty. For if man of himself could in a perfect manner know all things visible and invisible, it would indeed be foolish to believe what he does not see. But our manner of knowing is so weak that no philosopher could perfectly investigate the nature of even one little fly. We even read that a certain philosopher spent thirty years in solitude in order to know the nature of the bee. If, therefore, our intellect is so weak, it is foolish to be willing to believe concerning God only that which man can know by himself alone. And against this it is said: behold, God is great, exceeding our knowledge (Job 36:26).

Second, one can also answer this question by supposing that a certain master had said something concerning his own special branch of knowledge, and some uneducated person would contradict him for no other reason than that he could not understand what the master said! Such a person would be considered very foolish. So, the intellect of the angels as greatly exceeds the intellect of the greatest philosopher as much as that of the greatest philosopher exceeds the intellect of the uneducated man. Therefore, the philosopher is foolish if he refuses to believe what an angel says, and a far greater fool to refuse to believe what God says. Against such are these words: for many things are shown to you above the understanding of men (Sir 3:25).

Third, if one were willing to believe only those things which one knows with certitude, one could not live in this world. How could one live unless one believed others? How could one know that this man is one’s own father? Therefore, it is necessary that one believe others in matters which one cannot know perfectly for oneself. But no one is so worthy of belief as is God, and hence they who do not believe the words of faith are not wise, but foolish and proud. As the Apostle says: he is proud, knowing nothing (1 Tim 6:4). And also: I know whom I have believed; and I am certain (2 Tim 1:12). You who fear the Lord, believe him and your reward shall not be made void (Sir 2:8).</p></blockquote>

</figure><figure class="quote" id="q-6ca89021c0" data-kw="">
<blockquote><p>So that the concord between Reason and Revelation might be evident, and the subordination of the former to the latter, these cautions are able to be set down:

1. What is true in Philosophy, Theology does not overturn, but receives it, either simply, or with some distinction and limitation: for example, the Philosopher says, Man consists of a rational soul and a body: Theology receives this simply. The Philosopher says, From nothing comes nothing: Theology says the same, but with a limitation added, From nothing nothing comes by a finite, natural agent. The Philosopher says, A virgin does not bear: Theology acknowledges the same, but with this limitation: she does not bear by reason of intercourse with a man; but she is able to bear extraordinarily, by the miraculous power of God.

2. Philosophy judges of matters under the purview of the senses, pronounces nothing of matters unknown one way or the other; for example, concerning these truths Philosophy does not judge, whether a man is true God; whether in one divine Essence there are three persons.

3. What is true to the Philosopher is able to be false in Theology, because his Philosophy is able to be Pseudo-philosophy. Thus, to some Philosophers of the Gentiles it was truth that the World is eternal; which is false Theologically, indeed even Philosophically. For it was an error of those Philosophers, which ought to be imputed to Philosophy no further than the faults of artisans to their art. But, as wine, good in itself, easily contracts something of corruption from the fetid vessel into which it is poured; so Reason and Natural Theology easily attract something of error from corrupt man, in whom it dwells.

4. A truth in Philosophy is able to be false in Theology, and vice versa; through circumstance, because of a perverse application, or μετάβασιν εἰς ἄλλο γένος, a shifting unto another relation. Thus substance is said to subsist in the accidents: this is true concerning all created substance; but, if you think it of God, it is false.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 21, p. 165.</span></figcaption>

</figure><figure class="quote" id="q-a89e31e7e5" data-kw="">
<blockquote><p>There is one thing, I cannot help observing, has contributed very much to discourage ordinary people from this useful study: It is that mysterious air of learning, and profound science, which speculative and scholastic writers scatter over their performances on these subjects, as if they scorned to say the most common and familiar things in a way that any but philosophers should understand. Certain it is, that there is not any one thing in the subject itself, but what falls as directly under the observation of a man of the plainest understanding, as of the profoundest philosopher, abating perhaps some refinements, which no man living can ever comprehend.

We propose, therefore, as much as possible, to avoid every thing that lies out of the common road; and endeavour to point out what every man may, by a little reflexion on himself, bring to the only test of truth, observation and experience; and from these attempt to gather up such an account of the human constitution, as may satisfy any plain man where he is to look for his happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Human Nature</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 33-34.</span></figcaption>

nanter</a></div>

<blockquote><p>The Reformed divines who addressed the subjects of lawful civil government and resistance to tyranny often argued that a just ruler governs in the interests of the people, while a tyrant governs in his own interests. We find this very same distinction in the medieval scholastic theologian, Thomas Aquinas:

Fourth, it is necessary that a king have equity, because otherwise he would be a tyrant: for the tyrant turns everything within the kingdom to his own use, but a king orders his kingdom to the common good. Thus Proverbs says: a just king sets up the land; a covetous man destroys it (Prov 29:4). But he [Christ] came not seeking his own use, but yours, because the Son of Man did not come to be ministered to, but to minister (Matt 20:28). And who comes to minister? Surely the one who comes to give his soul for the redemption of many (Matt 20:28), and so that he might lead the redeemed to eternal glory, to which may he lead us, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermo Ecce Rex tuus</cite>, n2.1.4.</span></figcaption>

<blockquote><p>There were others who, although they believed that the Word was not changed into flesh but assumed it, nevertheless said that he assumed flesh without a soul; for if he had assumed flesh with a soul, the Evangelist would have said, the Word was made flesh with a soul. This was the error of Arius, who said that there was no soul in Christ, but that the Word of God was there in place of a soul.

The falsity of this opinion is obvious, both because it is in conflict with Sacred Scripture, which often mentions the soul of Christ, as: my soul is sad, even to the point of death (Matt 26:38), and because certain affections of the soul are observed in Christ which can not possibly exist in the Word of God or in flesh alone: he began to be sorrowful and troubled (Matt 26:37). Also, God cannot be the form of a body. Nor can an angel be united to a body as its form, since an angel, according to its very nature, is separated from body, whereas a soul is united to a body as its form. Consequently, the Word of God cannot be the form of a body.

Furthermore, it is plain that flesh does not acquire the specific nature of flesh except through its soul. This is shown by the fact that when the soul has withdrawn from the body of a man or a cow, the flesh of the man or the cow is called flesh only in an equivocal sense. So if the Word did not assume flesh with a soul, it is obvious that he did not assume flesh. But the Word was made flesh; therefore, he assumed flesh with a soul.</p></blockquote>

<blockquote><p>61. Then he commends his kingdom on its equity when he says, a sceptre of justice is the sceptre of your kingdom.

And this kingdom is fittingly described by the sceptre: for a tyrannical kingdom differs from that of a king because the former exists for the tyrant’s benefit with great harm to the subjects, but a kingdom is particularly ordained to the benefit of the subjects. Consequently, the king is father and shepherd: for a shepherd does not correct with a sword but with a sceptre: I will visit their iniquities with a rod (Ps 89:33). Furthermore, a shepherd uses a rod to direct his flock: feed your people with your rod (Mic 7:14). For a rod sustains the infirm: your rod and your staff have strengthened me (Ps 23:2). Furthermore, it troubles the enemy: a sceptre shall spring up from Israel and shall strike the chiefs of Moab (Num 24:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Hebraeos lectura</cite>, (c. 1273), C. 1, L. 4, 61.</span></figcaption>

</figure><figure class="quote" id="q-b741f69f04" data-kw="">
<blockquote><p>But here peradventure some man may demand of me, whether this my commendation doth extend it self to the Schoolmen, and chiefly unto those which have taken their original from the Master of sentences [Peter Lombard], and whether their writings doo appertain to that good and true part of Logic, which resolveth doubtful arguments? Truly, as I am not willing at this time to set down my absolute opinion (touching so many men) herein: for, for my own part let each one of them have his due reverence for his travail and labour, so am I not afeard to speak both boldly &amp; freely my mind, what I think, always (not withstanding) keeping my self within my compass:

John Duns Scotus (commonly called the subtill Doctor) saith that the Divines have in some places mixed Philosophy with Divinity, &amp; that with great profit: I truly confess that they have mingled it with divinity, yea I add they have therewith confused Divinity, but if he think it was done with any fruit, I beseech master Doctor pardon me if I cannot herein agree with him: for sithen the Schoolmen have not followed that good part of disputing, which giveth true resolutions to arguments (as we shall hereafter declare) but have as it were dallied &amp; sported themselves in probabilities, &amp; being for the most part vain &amp; frivolous arguments, me thinks they have not brought into the Church of God the true use, but rather the abuse of Philosophy: and truly, I say it seemeth to me, that into the midst of the Church, the Schoolmen have brought sophistication and shameless falsehood, decked and adorned with the colour &amp; name of Philosophy, as of an honest matron, to the great detriment &amp; hurt of the Church.

But you will say, they have not gotten this sharp knowledge of disputing without great labour and pains: I grant it to be so: for oftentimes when I see these school men labouring, sweating, and as it were out of breath in these their, subtill disputations, they make me to remember the Trojans, which with great labour and care brought into their City, the counterfeit Grecian Horse, whereby ensued the ruin of the whole Kingdom of Troy. So these schoolmen with great industry and labour, have brought into the church false Philosophie: that there hence, as from the Trojan horse might spring infinite errors: by which, while these who should have ben the watchmen over the Church, were even over whelmed in school ignorance, those errors have crept in, corrupted and wasted the Church of God (so as I may use the saying of Esaias) Except the Lord had left us a small remnant, we had had no church at all.

A proof hereof is the Church of Rome, so depraved and corrupted, that while we seek the Church in the Church, we are constrained, not without great sorrow and tears, only to behold the ashes of the true Church. But because I may not seem here more willing to lament, then to dispute: mark what I say, to wit, that the schoolmen and questionnaire Doctors, have neither followed the true manner of divine disputations, neither lawful use of Logic: &amp; that this may the more evidently appear, out of divers &amp; sundry their errors, I will gather certain, by the which we may plainly see, that they have erred not a little in their disputations, from the true manner of divine Disputing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/antoine-de-chandieu.html">Antoine de Chandieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise touching the Word of God written, against the traditions of men handled both school like, and divine like, where also is set down a true method to dispute divinely and school like</cite>, trans. John Coxe (London: John Harrison, 1583), pp 8-11.</span></figcaption>

<blockquote><p>[T]here were two opinions held by ancient philosophers about the passions. The Stoics said that there was no place in the wise man for sorrow. The Peripatetics said that the wise man is indeed sad, but in sad things he conducts himself with a moderation in accord with reason. This opinion accords with the truth.

For reason does not take away the condition of nature. It is natural to sensible nature to rejoice and be pleased about fitting things, and grieve and feel pain about harmful things. So reason does not take away this natural disposition, but so moderates it, that reason is not deflected from its right course because of sorrow. This opinion also accords with Holy Scripture which places sorrow in Christ, in whom there is every fullness of virtue and wisdom.</p></blockquote>

<blockquote><p>1. WHY THE WOMAN WAS FORMED FROM THE SIDE OF THE MAN. And because she is not given as slave-girl or as one to lord it over him, in the beginning she was not formed either from the highest part, nor from the lowest, but from the side of man, for the sake of conjugal partnership.

If she had been made from the highest, as from the head, she might seem created for domination; but if from the lowest, as from the feet, she might seem to be created for subjection to slavery. But because she is taken neither as mistress, nor as [a] slave-girl, she is made from the middle, that is, from the side, because she is taken for conjugal partnership.</p></blockquote>

</figure><figure class="quote" id="q-b5af543c30" data-kw="">
<blockquote><p>Nor does the tyrant merely oppress his subjects in corporal things but he also hinders their spiritual good. Those who seek more to use, than to be of use to, their subjects prevent all progress, suspecting all excellence in their subjects to be prejudicial to their own evil domination. For tyrants hold the good in greater suspicion than the wicked, and to them the valour of others is always fraught with danger. So, the above-mentioned tyrants strive to prevent those of their subjects who have become virtuous from acquiring valour and high spirit in order that they may not want to cast off their iniquitous domination.

They also see to it that there be no friendly relations among these so that they may not enjoy the benefits resulting from being on good terms with one another, for as long as one has no confidence in the other, no plot will be set up against the tyrant’s domination. Wherefore they sow discords among the people, foster any that have arisen, and forbid anything which furthers society and co-operation among men, such as marriage, banquets, and anything of like character, through which familiarity and confidence are engendered among men.

They moreover strive to prevent their subjects from becoming powerful and rich, since, suspecting these to be as wicked as themselves, they fear their power and wealth; for the subjects might become harmful to them even as they are accustomed to use power and wealth to harm others. Hence Job 15:21 says of the tyrant: The sound of dread is always in his ears and when there is peace, that is, when there is no one to harm him, he always suspects treason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 3.</span></figcaption>

ml&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b5af543c30.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/15/thomas-aquinas-on-the-tyrants-opposition-to-the-spiritual-good-and-happiness-of-the-people/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ab3da6f6b8" data-kw="">
<blockquote><p>It has been no uncommon thing for a certain class of writers upon theological subjects to declaim against systematic theology, and against the works which are classed under the general designation of systems. This dislike of systematic theology and of systems has arisen from ignorance and misconception or unreasonable prejudice, and in some cases we fear from worse motives.

A very large proportion of the systems of theology which, until the rise of infidel neology on the Continent about the middle of last century had been given to the world, were orthodox or Calvinistic, i.e. a large proportion of them gave generally, and in the main, a sound and correct summary of the leading truths contained in the word of God. And this was not by any means an accidental thing. The orthodox or Calvinistic scheme is the most systematic of all systems, possessing the beautiful consistency and harmony of truth, and deriving from its systematic consistency a presumption in favour of its soundness.

On these accounts, a dislike of systematic theology, and a disposition to rail at systems and system-makers, has been with many little else than an indication of a dislike to Calvinism, and to the works in which the Calvinistic system was unfolded. And in so far as this dislike to systematic theology professed to rest upon reasonable considerations, it has usually been alleged that systems of man’s making have a tendency to supersede the word of God, and that the study of them tends to lead men to disregard the word of God as the only standard of truth, and to be less careful about ascertaining accurately the exact import of its statements.

An exclusive devotion to system-making in theology, and the spending a great deal of time in perusing systems, may have some tendency to lead to this abuse. But the abuse may be guarded against, and will be guarded against, by the habitual recollection that the Bible is the only rule or standard according to which both our opinions and our practice ought to be regulated, and that we are to receive no truth or doctrine as a part of our creed merely because it is found in some esteemed system, and seems to be consistent and to fit in well with the other parts of it; and that men are bound to be satisfied themselves, and to be ever ready, if duly called upon, to shew to others, that all the theological opinions they entertain can be established by a rigid and exact investigation of the meaning of the actual statements of God’s word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture II, pp 31-32.</span></figcaption>

</figure><figure class="quote" id="q-c7215b1405" data-kw="">
<blockquote><p>If it be said (as I know it is) that this manner of speaking is only in compliance with the Speech and Notion of the Vulgar, I grant indeed that the Scripture speaks so very often, (as I have elsewhere shewed from several Instances both in the Old and New Testament): yea even when it makes mention of some of the Heavenly Bodies, the Expressions are according to the Capacity and common Apprehension of Men, and not according to the Accuracy of the Thing.

So that I do not think that a Body of Natural Philosophy, or a System of Astronomy, is to be composed out of the Bible; this being designed for a far greater and higher Purpose: Yet this I say that whenever the Scripture speaks after the foresaid manner, concerning these things and several others, it doth it in that manner that we may plainly see that the Words are not to be taken strictly and properly, but only in a popular way, as might be showed in abundant Instances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A demonstration of the existence and providence of God, from the contemplation of the visible structure of the greater and the lesser world in two parts, the first shewing the excellent contrivance of the heavens, earth, sea, &amp;c., the second the wonderful formation of the body of man</cite>, (London: Jonathan Robinson and John Wyat, 1696), 1.2, p. 34.</span></figcaption>

215b1405.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/28/john-edwards-on-the-bible-and-natural-philosophy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-c568a566de" data-kw="">
<blockquote><p>The first thing which must strike any thoughtful reader, after having carefully and studiously perused the Westminster Assembly’s Confession of Faith, is the remarkable comprehensiveness and accuracy of its character, viewed as a systematic exhibition of divine truth, or what is termed a system of theology.

In this respect it may be regarded as almost perfect, both in its arrangement and in its completeness. Even a single glance over its table of contents will show with what exquisite skill its arrangement proceeds from the statement of first principles to the regular development and final consummation of the whole scheme of revealed truth. Nothing essential is omitted; and nothing is extended to a length disproportioned to its due importance.

Nor do we think that a systematic study of theology could be prosecuted on a better plan than that of the Confession of Faith. Too little attention, perhaps, has been shown to the Confession in this respect; and we are strongly persuaded that it might be most advantageously used in our theological halls as a text-book.

This, at least, may be affirmed, that no private Christian could fail to benefit largely from a deliberate and studious perusal and reperusal of the Confession of Faith, for the express purpose of obtaining a clear and systematic conception of sacred truth, both as a whole, and with all its parts so arranged as to display their relative importance, and their mutual bearing upon, and illustration of, each other.

Such a deliberate perusal would also tend very greatly to fortify the mind against the danger of being led astray by crude notions, or induced to attribute undue importance to some favourite doctrine, to the disparagement of others not less essential, and with serious injury to the harmonious analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-hetherington.html">William Hetherington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Essay in Robert Shaw, An Exposition of the Confession of Faith of the Westminster Assembly of Divines</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Since, however, we have frequently to mention the words essence and substance, we must determine the meaning of essence, lest in discussing facts we prove ignorant of the signification of our words. Essence is a reality which is, or the reality of those things from which it is, and which subsists inasmuch as it is permanent. Now we can speak of the essence, or nature, or genus, or substance of anything.

And the strict reason why the word essence is employed is because it is always. But this is identical with substance, because a thing which is, necessarily subsists in itself, and whatever thus subsists possesses unquestionably a permanent genus, nature or substance. When, therefore, we say that essence signifies nature, or genus, or substance, we mean the essence of that thing which permanently exists in the nature, genus, or substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 12 in Nicene and Post-Nicene Fathers 2, 9: 7.</span></figcaption>

</figure><figure class="quote" id="q-338a75a4fe" data-kw="">
<blockquote><p>The philosophy which denies mind a place in the universe ought to be able to support its terrible conclusions by the presentation of evidence. But when asked on what authority they deny the universal beliefs of mankind, these philosophers have very little to say. To be sure, they are able to show that there is an intimate connection between mind and body, and they talk learnedly about nerve-currents and the grey matter of the brain.

But between matter and thought, between nerve-currents and personality, there is a breach which this philosophy does not fill. The belief in mind is a necessity of thought—a necessity felt none the less by those who write books to prove that mind does not exist. The materialist has encountered two barriers which rise mountain-like to dispute his passage into the realm of mind: the one is the mystery of life, and the other is the mystery of personality. The attempt to bring a living thing out of dead matter and to make mind a department of physiology has been a failure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-l-patton.html">Francis L. Patton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Summary of Christian Doctrine</cite>, (Philadelphia: The Westminster Press, 1901), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-c99f9d01df" data-kw="">
<blockquote><p>ENGLISHMEN and Americans frequently use the word “sensualist” to describe one in whom the animal appetites are predominant. We shall see that it is a just charge against the Sensualistic philosophy, that it not seldom inclines its advocates to this dominion of beastly lusts. But it is not from this fact that we draw the phrase by which we name it.

The Sensualistic philosophy is that theory, which resolves all the powers of the human spirit into the functions of the five senses, and modifications thereof. It is the philosophy which finds all its rudiments in sensation. It not only denies to the spirit of man all innate ideas, but all innate powers of originating ideas, save those given us from our senses. It consequently attempts to account for every general and every abstract judgment, as an empirical result of our sensations, and consistently denies the validity of any à priori ideas. Such was the philosophy which was dominant in France at the close of the eighteenth century; and which, untaught by the frightful results it produced there, is now striving again to establish its dominion among us towards the close of the nineteenth age. …

Let it then be understood, that the philosophy which I maintain against the Sensualistic, or exclusively empirical, and which has just been described, shall be called the Rational. It holds that the human intelligence is not a bundle of organs, but a pure spirit; it asserts for man a Reason, and not merely senses and their modifications.

In the eighteenth century, the Sensualistic philosophy appeared under many phases; it does so again in the nineteenth. But it always has its characteristic traits, and carries its own dangers to truth, virtue, and happiness. One attempt of this criticism of it will be to show that it always involves tendencies to erroneous logic, vitiating even the physical sciences, which it is wont to claim as its peculiar clients; to universal scepticism; to idealism; to nihilism; to the obliterating of moral distinctions, and the destruction of moral responsibility; to materialism; to a denial of the supernatural; and thus, to atheism.

Let us be understood: we do not charge that every Sensualistic philosopher holds to all these results, or approves them; we charge that they are all latent in the system, and that one or another of them is continually making itself patent in the outgrowth of this philosophy. Of this, one of the most instructive proofs is the historical; for there “the tree is known by its fruits.” We shall, therefore, prepare the way for the stricter criticism, by a brief, but perspicuous review of the chief movements of Sensualism, especially in our own age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sensualistic Philosophy of the Nineteenth Century, Considered</cite>, (New York: Anson D. F. Randolph &amp; Company, 1875), pp 1, 2-3.</span></figcaption>

<blockquote><p>2. Therefore, after the majority of men asserted the opinion that natural things did not happen by chance, but by providence, because of the order which clearly appears in them, a doubt emerged among most men about the acts of man, as to whether human affairs evolved by chance, or were governed by some kind of providence or a higher ordering.

This doubt was fed especially because there is no sure order apparent in human events. For good things do not always befall the good, nor evil things the wicked. On the other hand, evil things do not always befall the good nor good things the wicked, but good and evil indifferently befall both the good and the wicked. This fact then especially moved the hearts of men to hold the opinion that human affairs are not governed by divine providence. Some said that human affairs proceed by chance, except to the extent that they are ruled by human providence and counsel; others attributed their outcome to a fatalism ruled by the heavens.

3. This idea causes a great deal of harm to mankind. For if divine providence is denied, no reverence or true fear of God will remain among men. Each man can weigh well how great will be the propensity for vice and the lack of desire for virtue which follows from this idea. For nothing so calls men back from evil things and induces them to good as much as the fear and love of God.

For this reason, the first and foremost aim of those who had pursued wisdom inspired by the spirit of God for the instruction of others was to remove this opinion from the hearts of men. So after the promulgation of the Law and the Prophets, the Book of Job occupies first place in the order of Holy Scripture, the books composed by the wisdom of the Holy Spirit for the instruction of men. The whole intention of this book is directed to this: to show that human affairs are ruled by divine providence using probable arguments.

4. The methodology used in this book is to demonstrate this proposition from the supposition that natural things are governed by divine providence. The affliction of just men is what seems especially to impugn divine providence in human affairs. For although it seems irrational and contrary to providence at first glance that good things sometimes happen to evil men, nevertheless this can be excused in one way or another by divine compassion. But that the just are afflicted without cause seems to undermine totally the foundation of providence. Thus, the varied and grave afflictions of a specific just man called Job, perfect in every virtue, are proposed as a kind of theme for the question intended for discussion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositio super Iob ad Litteram</cite>, (1263-65), Pr. 2-4.</span></figcaption>

<blockquote><p>Between theology and philosophy there is a very close and intimate connection. Consequently it becomes a matter of much importance to determine what value is to be attached, in preaching, to those branches of knowledge which belong more especially to the department of speculative thought. Theology begins where philosophy ends, — that which is ultimate to the one is fundamental to the other; of course this can refer only to that true philosophy which has always perfectly harmonized with Christianity, and proved in all ages a powerful auxiliary in the battle with untruth. There can be no doubt, however, that many of these speculations, esteemed eminently philosophical, have proved barren of useful results; and that the great system of Gospel truth exists wholly apart and independent of them.

The pulpit is a field from which Gospel hearers expect to gather the golden grain of living and eternal truth; not an arena to which they resort in order to be delighted by a display of mental gymnastics, or the fierce combats of intellectual gladiators. To feed with the dry husks of metaphysical speculations, those who are hungering and thirsting for the bread and water of life, is to dispense stones instead of bread — to give a serpent instead of a fish. To persons of ardent piety and spirituality of mind, such discussions are cold, cheerless, tasteless, absolutely intolerable — broken cisterns, clouds without rain, pits without water. Attendance upon them is the mere “toil of dropping buckets into empty wells, and drawing nothing up.”

The preacher’s views upon the origin of ideas, the limits of knowledge, the nature of virtue, the foundation of moral obligation, natural ability, freedom of the will, the existence and province of conscience, with many other similar and kindred questions, will necessarily exert a most important influence over his modes of thought and instruction. True it is, as someone has said, “tell me your view of the nature of virtue, and I will tell you to what school of theology you belong.” These topics force themselves upon our consideration. They are worthy of profound attention; but they are seldom, and many of them never, suitable themes for the pulpit. The scribe well instructed will not permit them to usurp the place of those grander and more momentous truths which constitute the burden of his message.

We must, however, be careful to draw the distinction between the use and abuse of metaphysical power and knowledge in the preacher. All truly great preachers, we imagine, have been, to a great extent, metaphysicians; they betray profound acquaintance with the philosophical systems of the day, great knowledge of the human mind, and capacity to turn such knowledge to account in the detection and overthrow of error, and in the elucidation and establishment of truth. Of this Calvin, Howe, Edwards, Hall, Chalmers, are eminent examples.

In this age, when old errors are appearing in so many and varied forms—old, dead, and long-since buried philosophies raised from the grave, their bones scraped, re-washed, and presented anew to the world, —acquaintance with the great systems of speculative thought, both of belief and unbelief, appears an essential element of ministerial qualification.

He who knows little or nothing of Spinoza, Des Cartes, Locke, Hume, Kant, Hamilton, Comte, Fichte, Hickok, &amp;c., may be a very good practical preacher, perhaps—whatever that may mean; but can scarcely be esteemed a competent defender of the faith. Such knowledge, however, will always be held subservient to the one great end—the establishment of the truth, as it is in Christ,—“as the vessels of the Egyptians were dedicated to sacred purposes by the Israelites.”

Philosophy, like science, must wait at wisdom’s gates. “Stand thou here, while I go there and worship.</p></blockquote>

</figure><figure class="quote" id="q-2426e47b58" data-kw="">
<blockquote><p>You must be considerate and thoughtful, and not rash and heedless. To be sober-minded, is to make use of our reason, in reasoning with ourselves and in communing with our own hearts,—to employ those noble powers and capacities, by which we are distinguished from, and dignified above the beasts, for those great ends for which we were endued with them, that we may not receive the grace of God in them in vain, but being rational creatures, may act rationally, as behoves us, as becomes us.

You learned to talk when you were children, when will you learn to think,—to think seriously,—to think to the purpose? Floating thoughts your heads are full of, foreign and impertinent ones, when will you be brought to close and fixed thoughts, to think with concern and application of the great things that belong to your everlasting peace and welfare?

Some have recommended the study of the mathematics, as proper to fix the minds of young people, and bring them to think. I wish anything would do it, but would much rather it were done by a deep concern about the soul and another world, which, if it once prevail, will effectually fix the thoughts, and to the best purpose; for when once you come to see the greatness of that God with whom you have to do, and the weight of that eternity you are standing upon the brink of, you will see it is time to think, high time to look about you.

Learn to think not only of what is just before you, which strikes the senses, and affects the imagination, but of the causes and consequences, and reasons of things; to discover truths, to compare them with one another, to argue upon them and apply them to your selves, and to bring them to a head; not to fasten upon that which doth come first into your minds, but upon that which should come first, and which deserves to be first considered.

Multitudes are undone because they are unthinking; inconsideration is the ruin of thousands, and many a precious soul perisheth through mere carelessness. ‘Now therefore, thus saith the Lord of hosts, consider your ways;’ retire into your own souls, begin an acquaintance with them; it will be the most profitable acquaintance you can fall into, and will turn to the best account. While you are coveting to see the world, and to be acquainted with it, be not strangers at home.

Take time to think, desire to be alone now and then, and let not solitude and retirement be an uneasiness to you, for you have a heart of your own that you may find talk with, and a God nigh unto you, with whom you may have a pleasing Communion.</p></blockquote>

<blockquote><p>[S]ystematic theology has important purposes to secure, not only in testing and guarding purity of doctrine in a church, but in combining the scattered truths of God’s Word, so that we may clearly apprehend them: in exhibiting the unity of the faith; and in facing the misapprehensions, mistakes, and errors which may arise. In particular, great good may be effected by a full display, and a reflective contemplation of the divine character; and in order to this, there must be some order, plan, and division, and the more logical these are the better for every purpose, speculative or practical.

Care must be taken always, in drawing such a portraiture, to shew that the attributes are not distinct parts of the divine essence, but simply different aspects of the one God, viewed separately because of the infirmity of our minds, and the narrowness of our vision, which prevent us from taking in the whole object at once, and constrain us to survey it part after part. As it is not the abstract quality, but the concrete being that calls forth feeling and affection, we must ever contemplate his perfections, as combined in the unity of his living person. It is to be said, in behalf of Charnock, that he never leaves the impression that the attributes are separate existences; they are simply different manifestations presented to us, and views taken by us of the one God, who is at once Great and Good, Holy and Gracious.</p></blockquote>

<blockquote><p>The foundations of modern infidelity may be said to have been laid by [Thomas] Hobbes and [Baruch] Spinoza, both of whom manifested an equally hostile spirit against natural as against revealed religion; and the latter of whom, who has written much more fully and formally against the truth of revelation than Hobbes, and who has always exerted, and continues to the present day to exert, a much greater influence upon the views of infidel writers, is supposed by Professor Dugald Stewart to have “very decidedly indicated a tendency to insanity, a supposition, he adds, by no means incompatible (as will be readily admitted by all who have paid any attention to the phenomena of madness) with that logical acumen which is conspicuous in some of his writings.”

Hobbes’s Leviathan was published in 1651, and Spinoza’s Tractatus Theologico-Politicus in 1670, and to these works the defenders of Christianity generally had reference in dealing with the objections of opponents until the rise of the great band of English deists in the concluding part of the 17th and in the early part of last century. The first English writer of eminence who has written fully and at length in defence of the truth of Christianity, and in opposition to the objections of infidels, is Richard Baxter, so well known and so deservedly esteemed for his numerous and multifarious writings, controversial and practical, and for the extraordinary services, which he has been honoured to render to the cause of religion and piety.

He enters somewhat upon this subject in the second part of his Saints’ Rest, and prosecutes it more fully, first in his Unreasonableness of Infidelity, published in 1655, and afterwards in his Reasons of the Christian Religion, published in 1666, and in an appendix to the latter work entitled More Reasons for the Christian Religion, and no Reason against it, published in 1671. These books of Baxter upon the evidences have not been so much read, and are not so well known, as some of his other works, but they are possessed of great value. It is but lately that I have been led to read them, but I have formed a very high opinion of their value, and I am inclined to think that subsequent writers upon the evidences have been more indebted to them than is generally supposed.

Like most of Baxter’s other works, they were written far too hastily and hurriedly to be well digested or compacted; they present a good many digressions, and much irrelevant matter, by which the continuity of the argument is sometimes broken or hidden; but they contain a great deal of important and valuable discussion which, notwithstanding all that has since been written upon the subject, after the grounds and reasons of infidelity were more fully opened up, and notwithstanding the improvements to which fuller discussions with infidels have led as to the way and manner in which the proofs of the truth of Christianity ought to be expounded, unfolded, and arranged, is still well deserving of perusal and study.

Baxter, though not by any means to be compared, in point of sound-mindedness and judiciousness, with his great cotemporary Dr [John] Owen, and though not nearly so safe a guide in doctrinal matters, was a man of perhaps still greater subtlety and reach of thought, and therefore when he kept the right track, and was not perverted, as was sometimes the case, by his subtlety, he rose more above the ordinary current views of his age than Owen or any of his other great cotemporaries; and has in this, as well as in other ways, sometimes rendered valuable service to truth, and exerted an important influence upon the opinions of men.

We have an illustration of this in his books upon the evidences, where, amid many indications of the fervency of his piety, of his deep sense of spiritual and divine things, and his earnest longing for the salvation of men’s souls, we meet with some argumentative expositions of the rational evidences for the truth of Christianity, as they are sometimes called, which would do no discredit to Dr Samuel Clarke, or to any of the most eminent men of the school of cold rational mere argumentators, who arose in the next generation.

The tendency at that time among Baxter’s friends, in opposition to the other extreme which prevailed among the clergy of the Establishment, was to disregard or despise the rational or external evidences for the truth of Christianity, which are fitted in right reason to convince infidels, and to dwell only on these more spiritual views of the effects of divine truth itself in connection with the work of the Spirit, whereby believers are built up in their most holy faith; and this tendency even Dr Owen has exhibited to an erroneous extent in his Self-evidencing Power of the Bible, and in his Reason of Faith.

Baxter, it may be believed, was not insensible to the more spiritual views of this matter, was not disposed to overlook the agency of the Holy Spirit in the production of faith, or to undervalue the witness of the Spirit; and he has given far more prominence in the works above referred to these important topics than the generality of writers upon the evidences; but he at the same time strenuously vindicated for the rational or external evidence its true place and its rightful authority with reference to its appropriate objects, and he objected to some of the notions that were then current about the witness of the Spirit. This exposed him to some odium, but it was easier to raise a prejudice against him as ascribing too much to human reason, than to answer the arguments by which he defended his views.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XVII, pp 224-27.</span></figcaption>

<blockquote><p>A city which must engage in much trade in order to supply its needs also has to put up with the continuous presence of foreigners. But association with foreigners, according to Aristotle’s Politics, is particularly harmful to civic customs. For it is inevitable that strangers, brought up under other laws and customs, will in many cases act contrary to the citizens’ customs, and thus, since the citizens are drawn by their example to act likewise, their own civic life is upset.</p></blockquote>

<blockquote><p>Objection #3: “Beware lest any man spoil you through philosophy and vain deceit; lest any man should beguile you with enticing words” (Colossians 2:8, 4). To engage in deductive reasoning is the practice of philosophy; we must refrain from making deductions which generate conclusions without substance.

Answer: The apostle warned against the abuse, not the lawful use of all things. Philosophy is the art of reasoning. It is innate in man to acquire knowledge about a certain issue by virtue of the process of reasoning, an ability which he utilizes in all his mental and verbal activities. The ability to reason improves by way of exercise.

The desire to acquire wisdom by way of reasoning is denominated as philosophy, which in itself should not be labelled as vain deceit. Paul does not label philosophy as vain deceit but indicates that deceptive individuals by the use of reason can formulate that which has a semblance of being reasonable, which, however, very easily could beguile, deceive, and mislead the simple.

One should be on guard for such people and their activity, and listen to Scripture rather than reason. All this, however, has nothing in common with the proper use of reason in attempting to understand Scripture — to use it as a means to extract what is concealed in every text, which is but drawing conclusions on the basis of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 48.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Yet, although tyrants desire this very benefit of friendship, they cannot obtain it, for when they seek their own good instead of the common good there is little or no communion between them and their subjects. Now, all friendship is based upon something common among those who are to be friends, for we see that those are united in friendship who have in common either their natural origin, or some similarity in habits of life, or any kind of social interests.

Consequently, there can be little or no friendship between tyrants and their subjects. When the latter are oppressed by tyrannical injustice and feel they are not loved but despised, they certainly do not conceive any love, for it is too great a virtue for the common man to love his enemies and to do good to his persecutors (cf. Matt 5:44). Nor have tyrants any reason to complain of their subjects if they are not loved by them, since they do not act towards them in such a way that they ought to be loved by them.

Good kings, on the contrary, are loved by many when they show that they love their subjects and are studiously intent on the common welfare, and when their subjects can see that they derive many benefits from this zealous care. For to hate their friends and return evil for good to their benefactors—this, surely, would be too great a malice to ascribe fittingly to the generality of men. The consequence of this love is that the government of good kings is stable, because their subjects do not refuse to expose themselves to any danger whatsoever on behalf of such kings.</p></blockquote>

— Thomas Aquinas, De Regno Ad Regem Cypri, (1266-67), Book 1, C. 10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYet%2C+although+tyrants+desire+this+very+benefit+of+friendship%2C+they+cannot+obtain+it%2C+for+when+they+seek+their+own+good+instead+of+the+common+good+there+is+little+or+no+communion+between+them+and+their+subjects.+Now%2C+all+friendship+is+based+upon+something+common+among+those+who+are+to+be+friends%2C+for+we+see+that+those+are+united+in+friendship+who+have+in+common+either+their+natural+origin%2C+or+some+similarity+in+habits+of+life%2C+or+any+kind+of+social+interests.%0A%0AConsequently%2C+there+can+be+little+or+no+friendship+between+tyrants+and+their+subjects.+When+the+latter+are+oppressed+by+tyrannical+injustice+and+feel+they+are+not+loved+but+despised%2C+they+certainly+do+not+conceive+any+love%2C+for+it+is+too+great+a+virtue+for+the+common+man+to+love+his+enemies+and+to+do+good+to+his+persecutors+%28cf.+Matt+5%3A44%29.+Nor+have+tyrants+any+reason+to+complain+of+their+subjects+if+they+are+not+loved+by+them%2C+since+they+do+not+act+towards+them+in+such+a+way+that+they+ought+to+be+loved+by+them.%0A%0AGood+kings%2C+on+the+contrary%2C+are+loved+by+many+when+they+show+that+they+love+their+subjects+and+are+studiously+intent+on+the+common+welfare%2C+and+when+their+subjects+can+see+that+they+derive+many+benefits+from+this+zealous+care.+For+to+hate+their+friends+and+return+evil+for+good+to+their+benefactors%E2%80%94this%2C+surely%2C+would+be+too+great+a+malice+to+ascribe+fittingly+to+the+generality+of+men.+The+consequence+of+this+love+is+that+the+government+of+good+kings+is+stable%2C+because+their+subjects+do+not+refuse+to+expose+themselves+to+any+danger+whatsoever+on+behalf+of+such+kings.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+De+Regno+Ad+Regem+Cypri%2C+%281266-67%29%2C+Book+1%2C+C.+10.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9941f2c6bf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a cla

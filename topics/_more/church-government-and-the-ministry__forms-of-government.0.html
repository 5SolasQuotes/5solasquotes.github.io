</figure><figure class="quote" id="q-6f49634363" data-kw="">
<blockquote><p>There are a great many young men merchants who come from your parts, soberly (I believe) educated &amp; brought up at home, who, when they arrive here, are mere rakes, stop or stand at no sin or vice almost that falls in their way, swearing whoring Sabbath breaking drunkenness are as common vices, with a great many of them, as if they thought there was no evil in the commission of any of these; and as to their countenance of ministers that are of the principles of the church of Scotland, they are so far from it that they carry as if they were ashamed of their mother Church her principles &amp; ways, whatever is the religion of their pot &amp; lascivious companions that is theirs.

So that really a great many of them (yet are some, though very few, exceptions) are a perfect scandal to all religion &amp; a disgrace to that part of the world from whence they come, from which other &amp; better things had been here expected; I am sure if the parents &amp; principals of some of them knew their carriage &amp; behaviour in these parts it would be matter of very great sorrow &amp; grief to them. I propose this not out of any disregard I have to them, I am sure it is out of love to their souls.

I am glad to see my countrymen in these parts, neither do I speak so because of any particular affront or incivility received. I never met with any such, from any of them, but on the contrary, with very much civility &amp; respect, But I propose it, that some method might be fallen upon whereby this dreadful &amp; offensive grievance might be rectified. Query whether or not their parents &amp; employers could not oblige them to bring certificates of their inoffensive behaviour during their abode in these parts from ministers here to their own ministers &amp;c. at home.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-anderson.html">James Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Principal John Sterling, Newcastle upon Delaware, August 1716 in Charles Augustus Briggs, American Presbyterianism: Its Origin and Early History, Together with an Appendix of Letters and Documents of which have been Recently Discovered (New York: Charles Scribner’s Sons, 1885), lxxii-iii.</cite></span></figcaption>

<blockquote><p>The question concerning the true frame of the Lord’s Tabernacle, the New Testament Church, in point of Government, hath been a Ball of dispute long tost in this Island; this Contest might have long since had its exit, and issued in sound and solid Peace, and union upon this head, had we all with a single heart and eye, looked to the Pattern shewed upon the Mount, and listened to the discoveries so often made to us, from the lovely Oracles of the Word, Ezek. chap. 43. v. 11. of the form of the House, and the fashion thereof, and the goings out thereof, and the comings in thereof, &amp; all the forms thereof, and all the Ordinances thereof, and all the forms thereof, and all the Laws thereof, that we might keep the whole form thereof, and all the Ordinances thereof, and do them.

Had we renounced the wisdom of the flesh, and got the penitent heart, and been ashamed for all we have done amiss; and, (as the Author of this Paper well expresses it in his Preface) preferred Religion to Interest, and the power of Godliness to that of Dominion. But restless Ambition, and love of Dominion over the House of God, and over their Brethren, and fellow servants, as they began in the Christian Churches Infancy, and had an early tincture in the Apostles (though our Lord nipt the first buds of this bitter Root, and crushed this Cockatrice in the shell, shewing them, that humble Ministerial Diligence was the apex of their greatness) so the fermentation of this distemper continuing in most men, and by the influence of Satan upon man’s wicked heart, diffusing it self in after Generations, hath been a spreading gangrene, still hindering the reception, and improvement of this Ordinance, of the Gospel Church-Government, whereof Scripture and Experience are irrefragable witnesses.

The Apostle Paul tells us: the mystery of iniquity was working in his time, and the Embryo of the Prelatical Hierarchy, and a Papistical, consequently, then formed; which we find after stirring in the counteractings, and contradiction of a Diotrophes, (that early aspiring Primate,) even unto the Apostle John. Hence the Apostle Peter in his exhortation to Pastors of the Church, doth so [anxiously] dehort them from those two grand &amp; Satanical enchantments, viz. Covetousness, and Lording over God’s Heritage; which no doubt had its influence for checking these evils for a considerable time. But the early-sown tears of the Evil one, did by piece-meal discover themselves, first, in the advance of Beza’s human Episcopacy, the fixt Moderator, or proestos, which was next, (by the influence of the restless temper) screwed up to the Satanical, as he calls it, viz. the Diocesion Prelacy, swallowing up, and enhancing all the decisive Authority and Power of Pastors in Government; then the ascension was made to the Arch-bishops, and Metropolitans’ Office, and Power, and by an inevitable necessity to the Culmen of the Papal Monarchy at last.

The Lord having in this evening of time, and the days of Reformation, by the light of the Gospel, discovered the mystery of iniquity, and of the Papal Hierarchy consequently; and caused his People to hear his call, to come out of Babylon, and be separated from that detestable Synagogue, the Reformed Churches has generally had so deep a sense of the connexion of Popery and Prelacy, that together with the one, they found themselves obliged to reject the other; and in their Confessions, and by the Writings of their most famous, burning and shining Lights, have witnessed against this corruption of Government, as well as against that Synagogue’s errors in point of Doctrine; …</p></blockquote>

<blockquote><p>He who seeth the end from the beginning could tell how the church could best be governed while the world stands: there are no haphazard directions in His statute-book for all its enactments bear the impress of the wisdom of the Divine Lawgiver; and any one who thinks that he can furnish a better code of regulations is puffed up with unutterable presumption.

The Church ceases to be true to its rightful character when it accommodates itself to the capricious fashions of society. It has a higher mission. Instead of seeking to please men, or imitate their policy, it should act towards all as a faithful monitor, warning against defections, protesting against sinful compliances, and exercising over the entire community a purifying and transforming influence. It is safe only so long as it adheres to the instructions of its living Head in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/w-d-killen.html">W. D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>framework of the church. A treatise on church government</cite>, (Edinburgh, 1890), p. 16.</span></figcaption>

</figure><figure class="quote" id="q-6c1e88d86a" data-kw="">
<blockquote><p>While we would not fully agree with all of the Seceder Adam Gib’s sentiments with respect to errors in church government, he was correct to oppose the reductionist notion that the Bible is only concerned with salvation and not with church order. For various reasons, not least the fact that the keys of the kingdom are given to the church, and that there is no ordinary salvation outside the visible church, this idea is highly untenable:

But let us consider of how much Importance the visible Constitution of the Church is unto the Doctrines of Grace and Salvation. The Church is the Pillar and Ground of Truth, I Tim. iii. 15. Not that the Authority of the Church is that which determines the Truth, but the Constitution of the Church is that which maintains the Purity and Publication of the Truth, as Pillars were once used to preserve and expose the Roman Laws. It is of such Use to saving Truth, as a Man’s Feet are unto the rest of his Body, while needful to carry him up out of the Mire, or carry him out unto publick View.

The Manner wherein our catholick Men regard and use the Constitution of the visible Church, is, as if one seeing a Man sit, and rashly thinking all the under Part of his Body useless, should thereupon chop it off, and throw it away; and indeed he might throw away the rest at the same Time, as he’ll soon find it useless too. When Mr. W——d [George Whitefield] backs thro’ the Body of Truth and throws away the Doctrine of Church-Government, the Pillar or Feet whereby the whole is born up and out, it is the same Thing, in its Tendency, as if he should throw away the whole Bible; and thus our present Plea is, indirectly, a Plea for the whole Bible.

The Constitution of the Church, as it provides for the Preservation and Propagation of Truth, is like the Conduct where through Water runs clean into a City: Tho’ the Cistern be presently full, if you break the Conduit, you lay a Foundation for sudden Drought Church-Government is the Vessel wherein the sincere Waters of Truth are preserved, while swimming upon the salt Sea of Error that overflows this Earth if the Vessel be broke, the sweet Water must be lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/adam-gib.html">Adam Gib</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Warning Against Countenancing the Ministrations of Mr. George Whitefield, Published in the New Church at Bristow, upon Sabbath, June 6. 1742</cite>, (Edinburgh: David Duncan, 1742), pp 42-43.</span></figcaption>

+thus+our+present+Plea+is%2C+indirectly%2C+a+Plea+for+the+whole+Bible.%0A%0AThe+Constitution+of+the+Church%2C+as+it+provides+for+the+Preservation+and+Propagation+of+Truth%2C+is+like+the+Conduct+where+through+Water+runs+clean+into+a+City%3A+Tho%E2%80%99+the+Cistern+be+presently+full%2C+if+you+break+the+Conduit%2C+you+lay+a+Foundation+for+sudden+Drought+Church-Government+is+the+Vessel+wherein+the+sincere+Waters+of+Truth+are+preserved%2C+while+swimming+upon+the+salt+Sea+of+Error+that+overflows+this+Earth+if+the+Vessel+be+broke%2C+the+sweet+Water+must+be+lost.%E2%80%9D%0A%0A%E2%80%94+Adam+Gib%2C+A+Warning+Against+Countenancing+the+Ministrations+of+Mr.+George+Whitefield%2C+Published+in+the+New+Church+at+Bristow%2C+upon+Sabbath%2C+June+6.+1742%2C+%28Edinburgh%3A+David+Duncan%2C+1742%29%2C+pp+42-43.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c1e88d86a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6c1e88d86a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/01/16/adam-gib-on-the-importance-of-church-government-to-the-preservation-of-gospel-truth/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-74084b10ea" data-kw="">
<blockquote><p>Again, my friends, we would beseech you all to cultivate a catholic spirit. Think not that merely because you are Presbyterians you are therefore better than others. There are many members of the Independent and Episcopal churches whom the Son of God has delighted to honour, and who shall doubtless shine throughout all eternity, as pearls in his royal diadem. Our forms of government and discipline are but perishable barriers by which the various sections of the church are now separated, but at death these partitions fall asunder, and the faithful in the world above are all one in Christ Jesus for ever.

The Saviour will certainly honour his own ordinances, and, other things being equal, we may expect to find the purest piety where the Redeemer is worshipped according to the purest forms; but still we are not to trust to our privileges — we are not to worship the temple, instead of the God of the temple. Love is the essence of Christianity, and a Presbyterian church, where the life of piety is wanting, is a temple from which the glory has departed. Again, whilst Presbyterians act towards others in a spirit of expansive charity, and whilst they acknowledge that their ecclesiastical arrangements are not of such importance as the more enduring treasures of the new covenant, let them not imagine that they may therefore disregard the peculiarities of their religious system. Everything is precious which the Redeemer has ordained.

As Presbyterians consider that their own church is more perfect than others in her constitution, let them bestow upon her more abundant honour. Let them cleave steadfastly to her ordinances; let them not be seduced from her apostolic forms by the pageantry or the profits of a more gorgeous establishment. A good conscience is a constant feast; and let not Presbyterians sell, for any of the beggarly elements of this world, even the smallest portion of their birth-right as citizens of Zion.</p></blockquote>

</figure><figure class="quote" id="q-7fc03cbdbf" data-kw="">
<blockquote><p>The Presbyterian church, in her accredited standards, acknowledges Jesus as her divine Lord, and proclaims all the great doctrines of Christianity. If, by a church of Christ we understand a collection of his professing people who worship him according to his word, surely Presbyterians may have some claim to the designation. There are some Presbyterians who desire to walk in all the statutes and ordinances of the Lord blameless; and in times past, Presbyterians have often suffered unto death that they might maintain the honour of Christ’s crown and covenant. Jesus said — “Where two or three are gathered together in my name, there am I in the midst of them.” (Mat. xviii, 20.)

Presbyterian congregations meet together in the name of the Redeemer — they have often been blessed with seasons of refreshment and revival; and if their assemblies are honoured by the presence of the Great Shepherd and Bishop of souls — and if the Divine Master himself is pleased to acknowledge them as his followers — and if He condescends to make himself known unto them, not as he doth unto the world — they may well pity the folly and the presumption of those who will venture to affirm that they are not to be esteemed churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-d-killen.html">William D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse I in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-39f230ea36" data-kw="">
<blockquote><p>From the title of this volume the reader will be prepared to find that I take decided views, and vindicate one system of polity in preference to others. It does not follow that I advocate an existing Presbyterianism unqualifiedly and indiscriminately — that I perceive everything among ourselves to be right, and all things in which our neighbours differ from us to be wrong. Such partisanship will never promote the discovery of truth, nor bring our debates by one step nearer to a conclusion.

We are sadly ignorant of ourselves, and frequently we know not what spirit we are of. That I have nowhere in these pages transgressed the laws of Christian charity and courtesy, I dare not assert. But I have certainly aimed to treat opponents respectfully, to meet their arguments fairly, and to offer no reply to the reader which I did not feel, on calm reflection, to be satisfactory to myself.

While I have defended Presbyterianism in the honest belief that it is defensible on good grounds, though admitting in various points of nearer approximation to the primitive model, I have rejoiced to find, that without underestimating a single argument, or compromising one iota of my convictions, I have been induced to moderate, in several important particulars, my estimate of denominational differences; and I would reckon myself favoured beyond expression if this small work should convey to others the same persuasion, and thus advance Christian conciliation and co-operative beneficence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-king.html">David King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition and Defence of the Presbyterian Form of Church Government. In Reply to Episcopal and Independent Writers</cite>, (2nd edn, Edinburgh: Johnstone and Hunter, 1854), vi-vii.</span></figcaption>

nstone+and+Hunter%2C+1854%29%2C+vi-vii.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39f230ea36.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/39f230ea36.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/09/david-king-on-defending-presbyterianism-with-modesty/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-897cf9c1de" data-kw="">
<blockquote><p>I must confess that I can see no way to prevent the growing effects of our fatal distempers, except God so bless the Government by law established, with that spirit of Discretion, of Moderation, of Equity, and of Lowliness in all things which it doth act, that none shall be able to find any just grievance at it.

And to this effect, the less the Classical Presbyteries shall resemble the Civil Courts of Judicature, or the Bishop’s Courts in former time, the more they will be suitable to the end for which they are instituted, which is, to entertain Brotherly conferences and consultations about spiritual matters for mutual assistance and support in the ways of God; and not at all to intermeddle with the Congregations in any of their particular affairs, which are not voluntarily brought unto them as a Case wherein their Judgement is sought unto; for no particular Church, by its subordination to a Classis, is to be deprived of any right which it hath within it self, but is rather thereby to be maintained therein.

The Maxims then of spiritual Communion to be observed in the Classical Presbyteries, that all misconstructions of their ways which occasion jealousies and clamours, may be prevented, ought to be published, to wipe away the fears which ensuare us into distractions against the duties of Love. And it will be necessary not only to publish those Maxims for this end; but three other things more must be satisfactorily, and from the grounds of Scripture cleared, if ever the Government shall prosper, to settle us in Peace.</p></blockquote>

And to this effect, the less the Classical Presbyteries shall resemble the Civil Courts of Judicature, or the Bishop’s Courts in former time, the more they will be suitable to the end for which they are instituted, which is, to entertain Brotherly conferences and consultations about spiritual matters for mutual assistance and support in the ways of God; and not at all to intermeddle with the Congregations in any of their particular affairs, which are not voluntarily brought unto them as a Case wherein their Judgement is sought unto; for no particular Church, by its subordination to a Classis, is to be deprived of any right which it hath within it self, but is rather thereby to be maintained therein.

<blockquote><p>We remember, several years ago, when the question of slavery was keenly agitated, that it was a favourite argument of the upholders of that nefarious traffic, that the slaves in many of the plantations were more comfortably provided for than our operatives at home; that they were very kindly used by their masters, and had, personally, no desire to be liberated. In urging this argument, they altogether forgot or overlooked that the main question was, not whether the slaves were ill-treated, but whether it was right in man to hold property in his fellow-men. So it is in the consideration of the question of Patronage.

We are apt some times to forget that the main question is, not the abuse of power on the part of the patron, in presenting to the Church unworthy and graceless ministers, but the propriety of his possessing such a power at all. It is true that had patrons always exercised their power judiciously, and for the ends for which it is alleged to have been entrusted to them, it might have been very difficult to awaken a general and deep-felt interest in the mere abstract question. The mass of mankind are more easily and universally moved by a felt grievance and the prospect of redress, than by the simple exhibition of truth; and had all our patrons been men of the character described in the above quotation, it might not have been very easy to induce the people to make a united and determined stand against Patronage.

We might have expected, and, no doubt, would have obtained, better results under such a restricted system of Patronage, just as the slaves of a benevolent proprietor would experience the fruits of his kindness and care. But except in this single thing, that we might expect a Christian patron to make conscience of the exercise of his power, does it differ in any respect from the system under which the Church now groans? The thing objected against, is not so much the way in which Patronage has been exercised, as the nature of the power which is implied in it.</p></blockquote>

<blockquote><p>The first Authors of these wicked opinions were N. [John] Wheelwright some adherents to M. Wheelright, and Mistress [Anne] Hutchinson. This woman is called the American Jezebel, she was the wife of M. William Hutchison of Boston, the daughter of M. [Francis] Marbury, sometime preacher in London: She was haughty, bold, active in wit, eloquent, vain, and self-conceited, would not stick to lye, and brought these opinions from old England and so was holden for a time out of Church communion, yet admitted, deceived many with extolling of Christ as working all in the souls of believers, as in dead and passive Organs and depressed sanctification and all qualifications of inherent graces as nothing held union with Christ and justification without faith, she drew to her way many godly people and many loose and prophane by a weekly lecture she held in her house, under pretence of repeating sermons, took on her to sit in a chair and to teach men.

All these foresaid errors were condemned by a general assembly of the Churches of New England, at New-town August 30. 1637. They learned by sad experience of these seducers from that time, as I am informed to remove farther from M. [John] Robinson’s democracy and popular government, and come a little nearer to Presbyterial Government, and while they embrace that Apostolic Government, they shall ever be infested with heresies, as now they are this day with new Bee-hives of Anabaptists, Seekers Enthusiasts, Familists, and Antinomians: they come, blessed bee the Lord, a little nearer to it then they did, M. [John] Cotton in his Treatise of the keys of the kingdom of heaven, set out by M. T[homas]. Goodwin and M. Philip Nye, is well sound in our way, if he had given some more power to assemblies, as is clear Act. 15. and in some lesser points, Though Independents in England oppose that Godly and learned Divine, and as we hear have suppressed his judgement touching constitution of visible Churches, and are not willing that Antinomians, Familists, Socinians, Anabaptists, or other abominable sectaries be brought to the trial of a lawful Church assembly, but plead for a toleration to them, which the Churches of New England deservedly abhor as Atheistical and destructive to the truth, peace and unity of the Church of Christ.

Mistress Hutchison ought to have been convened before this Church-assembly, and M. Wheelright and others were convened before a civil court in Massachusetts. Octo. 2. 1637. For disturbance of the public peace, where in the month of March, M. Wheelright was convict of sedition: upon occasion whereof, a number of Familists gave in a Petition or Remonstrance complaining that their beloved M. Wheelright was condemned for no fault, whereas his doctrine was no other then the very expressions of the holy ghost himself, though he had said expressly, That Magistrates, Ministers, and most of the people were under a Covenant of works, and therefore were enemies to Christ, such as Herod, Pilate, Scribes and Pharisees, and encouraged the people to rise up against them, as Philistims, and pronounced the curse of Meroz on them who would not join with them against the churches of the legalists. And made mention of Moses his killing the Egyptian. Much false doctrine and debates and disputes raised he in the Church there, which were not known before his coming to the Country, where upon he was sentenced to be disfranchised and banished out of their jurisdiction and committed to safe custody till he should find surety to depart before the end of March, upon this he appealed to the Kings Majesty.

Others of his Disciples saying he held forth nothing but the truth of Christ, were censured, some banished, some fined, and imprisoned. Mistress Hutchison boldly justified her self, that she might teach as Priscilla did, reproached the Ministers as Legalists, told by revelation and many misapplied Scriptures that she was forewarned by God, in Old England that she should separate from all Ministers because legal men: except M. Cotton and M. Wheelright; that she should come to New England, suffer for the truth. She said she should be delivered as Daniel was from the Lyons. Such Prophets love to foretell things past and say they knew them before they came to pass.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.16, pp 176-78.</span></figcaption>

<blockquote><p>Our apostles also knew, through our Lord Jesus Christ, and there would be strife on account of the office of the episcopate. For this reason, therefore, inasmuch as they had obtained a perfect fore-knowledge of this, they appointed those [ministers] already mentioned, and afterwards gave instructions, that when these should fall asleep, other approved men should succeed them in their ministry.

We are of opinion, therefore, that those appointed by them, or afterwards by other eminent men, with the consent of the whole Church, and who have blamelessly served the flock of Christ in a humble, peaceable, and disinterested spirit, and have for a long time possessed the good opinion of all, cannot be justly dismissed from the ministry.

For our sin will not be small, if we eject from the episcopate those who have blamelessly and holily fulfilled its duties. Blessed are those presbyters who, having finished their course before now, have obtained a fruitful and perfect departure [from this world]; for they have no fear lest any one deprive them of the place now appointed them. But we see that ye have removed some men of excellent behaviour from the ministry, which they fulfilled blamelessly and with honour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Epistle to the Corinthians</cite>, (90), 38 in Ante-Nicene Fathers, 1: 17.</span></figcaption>

<blockquote><p>PATRONAGE is usually defined to be the exercise of a power of presentation to a Church, which power is held solely in virtue of some secular qualification, such as inheritance or purchase. … In a matter relating to the appointment of the office-bearers of the Church, our ultimate appeal must be “to the law and to the testimony.” Were it true, as some allege, that Scripture lays down no general principles or definite rule, for the guidance of the Church in the election of her office bearers, this matter would fall to be regulated by an enlightened regard to utility; but we trust to make it plain in the course of the following observations, that we are not left by Scripture altogether in the dark, in a matter which so nearly concerns the interests of the Church.

Amid much that is distressing and painful in the circumstances in which the Church of Scotland is now placed in its relations with the Civil Power, it is matter of sincere gratification that these very circumstances are forcing her office-bearers and members back upon first principles—constraining them to abandon all temporizing shifts and expedients, and to take their stand upon the broad and sure basis of the everlasting and unchangeable word of God.

It was a great step in advance towards right principles which the General Assembly made in 1834, when the old doctrine of Non-intrusion was asserted, and effective steps taken to have that principle carried into operation in every case of settlement. It was a still further and more gratifying advance in the same direction, when, five years thereafter, the Assembly took up the language, and resumed the tone of the ancient Assemblies of the Church, and declared the free and unfettered prerogatives which the Lord Jesus Christ, as King and Head of his Church, had conferred upon her.

It is impossible to attach too much importance to this declaration, whether we regard it merely in the light of a testimony in behalf of a great scriptural truth, or as the most healthful indication which could have been afforded, that the Church of Scotland, after a long and dreary period of defalcation, had rid herself of the notion, which lay upon her like an incubus, and paralysed her energies, that she was a mere civil corporation, existing for civil ends.

This idea, fostered under the reign of Moderatism, and forming indeed the very essence of it, had wrought most deadly mischief, not only as regarded the matter of settlement, in which the great thing to be considered was, not the “perfecting of the Saints,” but the following out of the will of the patron; but also as regarded the matter of preaching, in which the great thing to be considered was, not the winning of souls to Christ, but the rearing up of good citizens, on the basis of a cold and secular Morality.

One thing only remains, so far as regards the assertion of principles, to set the Church upon the platform of her ancient standards, and that is, to re-declare the indefeasible right of the members of the Church to elect their own office-bearers. This principle appears necessarily to flow from that of the spiritual independence of the Church, and it is practically one of the most important consequences which result from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), pp 1-2.</span></figcaption>

<blockquote><p>It might be very expedient, upon the principles of Christian prudence, that, where it can be accomplished, every pastor of a large congregation should still have assistant ministers; and some presidents among the pastors of different congregations, when they are meeting about any public business, is what common sense dictates in such circumstances: and if instead of a chair-man chosen for that particular time and occasion, some person, of experienced, approved fidelity and ability, should be appointed to exercise some stated over-fight over a few of the neighbouring congregations, it might perhaps be attended with such consequences, as would render such a sort of discipline not only tolerable, but eligible.

Something of this kind was projected in archbishop Usher’s plan for the reduction of episcopacy, by which he would have moderated it in such a manner, as to have brought it very near the presbyterian government of the Scotch church; the weekly parochial vestry answering to their church-session; the monthly synod, to be held by the Chorepiscopi, answering to their presbyteries; the diocesan synod to their provincial, and the national to their general assembly. The meeting of the dean and chapter, practised in the church of England, is but a faint shadow of the second, the ecclesiastical court of the third, and the convocation of the fourth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/philip-doddridge.html">Philip Doddridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Lectures on the Principal Subjects in Pneumatology, Ethics, and Divinity</cite>, (London: J. Buckland, 1763), Proposition CL, Scholium 3, p. 522.</span></figcaption>

<blockquote><p>The question, whether any particular form of Church Government is so laid down in Scripture, as that the claim of divine right may be advanced on its behalf, and that, of consequence, the Church is bound, in all to adopt and act upon it;- will not now be formally discussed. It has been made the subject of too much extended and ardent controversy, to be brought within the compass of a few sentences, or even a few pages. It may not be improper, however, briefly to say, that it would, indeed, have been singular, if a community, called out of the world, and organized under the peculiar authority of the all-wise Redeemer, had been left entirely without any direction as to its government:

That the Scriptures, undoubtedly, exhibit to us a form of ecclesiastical organization and rule, which was, in fact, instituted by the Apostles, under the direction of infinite Wisdom: That this form was evidently taken, with very little alteration, from the preceding Economy, thus giving additional presumption in its favour: That we find the same plan closely copied by the churches for a considerable time after the apostolic age:- That it continued to be in substance the chosen and universal form of government in the Church, until corruption, both in doctrine and practice, had, through the ambition and degeneracy of ecclesiastics, gained a melancholy prevalence:- And, that the same form was also substantially maintained by the most faithful witnesses for the truth, during the dark ages, until the great body of the Reformers took it from their hands, and established it in their respective ecclesiastical connexions.

These premises would appear abundantly to warrant the conclusion, that the form of Government which answers this description, is the wisest and best; that it is adapted to all ages and states of society; and that it is agreeable to the will of Christ that it be universally received in his Church. All this the writer of the following Essay fully believes may be established in favor of Presbyterianism. There seems no reason, however, to believe, with some zealous votaries of the hierarchy, that any particular form of government is in so rigorous a sense of divine right, as to be essential to the existence of the Church; so that where this form is wanting, there can be no Church. To adopt this opinion, is to take a very narrow and unscriptural view of the covenant of grace.

After yielding to the visible Church and its ordinances, all the importance which the word of God warrants, still it cannot be doubted, that on the one hand, men in regular external membership with the purest Church on earth, may be hypocrites, and perish; and on the other, that all who cordially repent of sin, and receive the Saviour in spirit and in truth, will assuredly obtain eternal life, although they never enjoyed the privilege of a connexion with any portion of the visible Church on earth. The tenor of the Gospel covenant is, He that believeth on the Son of God hath eternal life, and shall not come into condemnation, but is passed from death unto life; but he that believeth not the Son, shall not see life, but the wrath of God abideth on him.

Still it is plain, from the word of God, as well as from uniform experience, that the government of the Church is a matter of great importance; that the form as well as the administration of that government is more vitally connected with the peace, purity and edification of the Church, than many Christians appear to believe; and, of consequence, that it is no small part of fidelity to our Master in heaven to “hold fast” the form of ecclesiastical order, as well as the “form of sound words” which He has delivered to the saints.</p></blockquote>

<blockquote><p>God’s increasing goodness may give some satisfaction to such as make question of Church Governors, proper and peculiar to the Church.

Of such I demand, whether it be a good, useful, and needful thing, for the Church to have Governors of its own; and secondly, whether the Church of the Jews had such Governors, or no. Surely, me thinks neither of these should be denied.

Have not families, schools of learning, Colleges, Universities, Cities, Towns, all manner of Corporations, Companies and Societies, Governors proper and peculiar to themselves: besides the public Magistrates, who are also over them? Is it not by experience found, that such proper and peculiar Governors are needful and useful, and so good in their several spheres? And shall the best Society on earth, the militant Church, be without Ecclesiastical Governors, proper and peculiar to it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), p. 24.</span></figcaption>

</figure><figure class="quote" id="q-1d7adda540" data-kw="">
<blockquote><p>Christ, as king of his church, hath appointed a government in her, and committed to office-bearers, under him, a power to execute his laws, and pronounce judgment according to them, for the preservation of order and peace, and the promoting of the interests of truth and holiness to his glory. …

The overlooking of the important ends to be served by the church as a visible society, is a capital error, or at least has been the source of many hurtful mistakes in our own, as well as in former times. Many seem to confine their views entirely to what is necessary for training up a number of individuals for eternal life; the only wise God hath combined this with the maintenance of a public cause, to the advancement of his glory on earth; and for this purpose has erected and maintains an organized and permanent association, which he has constituted the depositary of his truths, laws, and ordinances.

Those institutions which tend directly to promote personal salvation and holiness, such as the word, sacraments, and prayer, could not be preserved in purity, or practised to edification, without the external administration of laws. Church members are not all true saints; and such of them as are so, being renewed but in part, stand in need of counsel, restraint, and correction.

But there is a higher reason than even this for ecclesiastical judicature; it belongs to the administration of that kingdom which was given to Christ as Mediator, and constitutes an essential part of his glory as the lawgiver, judge, and king of the church. The divine government of the universe is conducted by laws adapted to the various orders of created beings. Though sin had not entered into our world, mankind would have lived under the external regimen of law, if there had been no other reason for it than this, that an exhibition of the moral government of God might be preserved among them.

In our law the sovereign is called the Grand Justiciar, and earthly kings, in general, rule and dispense justice in the remotest parts of their dominions, by means of the subordinate governors and judges whom they appoint. And in like manner, the authority of the church’s king is exercised, and his glory illustrated, by the instrumentality of those who, in his name, dispense his ordinances, and execute his laws. “He that heareth you, heareth me; and he that despiseth you, despiseth me; and he that despiseth me, despiseth him that sent me.</p></blockquote>

2C+mankind+would+have+lived+under+the+external+regimen+of+law%2C+if+there+had+been+no+other+reason+for+it+than+this%2C+that+an+exhibition+of+the+moral+government+of+God+might+be+preserved+among+them.%0A%0AIn+our+law+the+sovereign+is+called+the+Grand+Justiciar%2C+and+earthly+kings%2C+in+general%2C+rule+and+dispense+justice+in+the+remotest+parts+of+their+dominions%2C+by+means+of+the+subordinate+governors+and+judges+whom+they+appoint.+And+in+like+manner%2C+the+authority+of+the+church%E2%80%99s+king+is+exercised%2C+and+his+glory+illustrated%2C+by+the+instrumentality+of+those+who%2C+in+his+name%2C+dispense+his+ordinances%2C+and+execute+his+laws.+%E2%80%9CHe+that+heareth+you%2C+heareth+me%3B+and+he+that+despiseth+you%2C+despiseth+me%3B+and+he+that+despiseth+me%2C+despiseth+him+that+sent+me.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Sr.%2C+The+Spirit+of+Judgment.+Delivered+at+the+opening+of+the+Synod+of+Original+Seceders%2C+Edinburgh%2C+September%2C+1829+in+Sermons&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d7adda540.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1d7adda540.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/08/thomas-mccrie-on-christs-appointment-of-church-government/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>When writing in opposition to the British government’s proposed scheme of National Education in Ireland, The Orthodox Presbyterian periodical, which Henry Cooke (among others) edited, reminded its readers that governments should establish the true religion and refuse to patronise false religion:

We are of that old fashioned school who maintain, that Governments may and should patronize and support true religion, and religious education, and neither must nor should patronize and support a false and unscriptural system. Moreover we do maintain, that when Governments, upon any pretence whatsoever, patronize or establish an unscriptural system, those Governments become partners in the sin, and will be made, if they repent not, “partakers of the plague,” which God will pour out upon every system of error and sin.

Still farther do we assert our conviction, that the people who stupidly or negligently acquiesce in the sins of the Government will, at the bar of providence and judgment, stand chargeable with the guilt. We therefore call upon the people, by respectful, honest, and bold petition, so to express their opinions, that should the Parliament proceed to establish Popery, and re-marry the nation to the long divorced errors and plagues of Rome, the people may stand unconnected with the guilt of the deed.</p></blockquote>

</figure><figure class="quote" id="q-1c702e2485" data-kw="">
<blockquote><p>At the time of the union between the Synod of Ulster and the Seceders in 1840, several Secession ministers remained outside owing to some scruples about what was taking place. One of their scruples was the fact that the new Presbyterian Church in Ireland did not require its members to adhere to the Westminster Confession, only its officers. In response, the General Assembly passed the following resolutions:

The Committee appointed at last Assembly, to confer with certain dissentient brethren, reported, – That certain brethren who have hitherto abstained from entering into the United Church, have signified their willingness to become members, on the Assembly now affirming resolutions, which the Committee have unanimously agreed to recommend for their adoption.

The following resolutions being read and considered, were unanimously adopted:-

I. That a profession of belief, conformable to the Westminster Confession of Faith, be required from intrants to communion, and from parents at the baptism of their children.

II. That the erroneous and immoral be debarred from sealing ordinances.

III. That communicants be admitted to the Lord’s Table by tokens, distributed only by the ministers and elders conjointly.</p></blockquote>

</figure><figure class="quote" id="q-67a90d231a" data-kw="">
<blockquote><p>The Scriptures warrant us to look forward to a period when it [the church] shall resume the appearance of a united and peaceful community. Then shall it be fulfilled as it is written: “The earth shall be full of the knowledge of the Lord, as the waters cover the sea.” [Isaiah 11:9; Habakkuk 2:14] “The Lord shall be King over all the earth; in that day shall there be one Lord, and His name one.” [Zechariah 14:9] But before this consummation can be attained there must be some agreement as to the proper form of ecclesiastical government. And doubtless the Church shall then, in all its arrangements, be a model of symmetry and beauty. There will be no provision made for useless drones or meretricious ornamentations; but all will be taught to look for life and sustentation to the Head; all will be prepared, in some way, to conduce to the promulgation of His glory; all will be encouraged to endeavour to promote the general well-being; and thus all will be builded together for an habitation of God through the Spirit. The framework of the Church throughout will reveal the hand of Him who is excellent in counsel and wonderful in working.</p></blockquote>

<blockquote><p>The following series of resolutions on the subject of National Education were submitted by Mr. Anderson, and unanimously adopted:-

1. That there is a loud call for the establishment in Scotland of a national system of education, based on Scriptural principles, thoroughly imbued with the spirit of the Gospel, and adequate to provide the whole land with sound literary and religious instruction.

2. That it is the duty of the Government and Legislature to establish such a system without delay.

3. That there are remarkable facilities for the accomplishment of this most desirable object, inasmuch as, notwithstanding of existing differences in regard to matters of religion, and even in regard to the duties of Government respecting education, there is an almost universal desire among all classes in Scotland that the Bible and the Shorter Catechism of the Westminster Assembly should be read in every school.

4. That in the Act of the Legislature establishing such a system, there ought to be a distinct recognition of the Word of God, and of the principles of true religion founded on that infallible record; and that provision should be made for teaching in every school the Holy Scriptures, and the doctrines and duties inculcated in the Divine Word, as these are summarily set forth in the Shorter Catechism; that the schools should be open to such well qualified teachers, and to those only, of whatever name or denomination, as give evidence of good moral and religious character, and of cordially believing the Word of God, and holding its precious truths, as these are exhibited in the Shorter Catechism, which it would be their duty to teach; and that local boards should be established everywhere through the land for the election of teachers, and for carrying out the system according to these principles.

5. That, in conviction of this Synod, such a system, if once established and carried into vigorous operation, would be cordially received and practically adopted by Christian men of every denomination, and could not fail, by the blessing of God, to confer incalculable benefits in the advancement throughout Scotland of knowledge, religion, and morality.

6. That the Rev. William Anderson, the Rev. Dr. Goold, and Mr. Matthew Tait, be appointed a committee to take charge of these resolutions – to convey them to the Government of the country, and to Scottish Members of Parliament, and to hold such correspondence with other parties as may appear desirable.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The following series of resolutions on the subject of National Education were submitted by Mr. Anderson, and unanimously adopted:-

1. That there is a loud call for the establishment in Scotland of a national system of education, based on Scriptural principles, thoroughly imbued with the spirit of the Gospel, and adequate to provide the whole land with sound literary and religious instruction.

2. That it is the duty of the Government and Legislature to establish such a system without delay.

3. That there are remarkable facilities for the accomplishment of this most desirable object, inasmuch as, notwithstanding of existing differences in regard to matters of religion, and even in regard to the duties of Government respecting education, there is an almost universal desire among all classes in Scotland that the Bible and the Shorter Catechism of the Westminster Assembly should be read in every school.

4. That in the Act of the Legislature establishing such a system, there ought to be a distinct recognition of the Word of God, and of the principles of true religion founded on that infallible record; and that provision should be made for teaching in every school the Holy Scriptures, and the doctrines and duties inculcated in the Divine Word, as these are summarily set forth in the Shorter Catechism; that the schools should be open to such well qualified teachers, and to those only, of whatever name or denomination, as give evidence of good moral and religious character, and of cordially believing the Word of God, and holding its precious truths, as these are exhibited in the Shorter Catechism, which it would be their duty to teach; and that local boards should be established everywhere through the land for the election of teachers, and for carrying out the system according to these principles.

5. That, in conviction of this Synod, such a system, if once established and carried into vigorous operation, would be cordially received and practically adopted by Christian men of every denomination, and could not fail, by the blessing of God, to confer incalculable benefits in the advancement throughout Scotland of knowledge, religion, and morality.

6. That the Rev. William Anderson, the Rev. Dr. Goold, and Mr. Matthew Tait, be appointed a committee to take charge of these resolutions – to convey them to the Government of the country, and to Scottish Members of Parliament, and to hold such correspondence with other parties as may appear desirable.”

<blockquote><p>1. The effects of slavery on domestic relations.

The system of American Slavery confers upon slaveholders an absolute right of property in their slaves. This sets aside the husband’s interest in his wife, and the wife’s interest in her husband. Although slave-laws do not recognize the relation of marriage between slaves, it is recognized of God — and in his sight the slave is equally entitled with his master to enter into the relation, — and has the same right of protection in its enjoyment. But slavery, in its practical working, steps in between the slave and the enjoyment of his right.

This evil is not merely an abuse of the system; it necessarily flows from it. The right of property claimed by the master, and secured by law, gives him the power of disposing of the slave in anyway, and at any time, that may suit his inclination or his interest; a power which is so commonly used as to approximate very nearly to universality. The husband is torn from his wife; and the wife from her husband. We refer not to the anguish of heart caused by such involuntary separations; nor to the inability thus induced to perform mutually the obligations belonging to the relation. These have already been presented as direct arguments against slavery. At present we refer only to the violation of right which unavoidably follows the system. To secure the right of the slave would affect the master’s claim, therefore his right, however sacred, is cancelled to gratify the avarice of the slaveholder, and to maintain the system of iniquity.

By the law of God, as well as of reason, the husband is bound to protect and support his wife, but slavery denies him the right of doing either, farther than may suit the inclination of his master. His wife may, without crime, or the charge of crime, be flogged most cruelly before his eyes, and slavery does not even permit him to complain; the most wanton outrages may be committed on her person, and he dare not lift his hand to rescue her; nor even open his lips to remonstrate. The law provides no remedy; it does not even admit his right to seek redress; one thing, and only one, the law contemplates:— The absolute right of the master, to the entire exclusion of all right on the part of the slave. Slavery thus, in its practical working, violates rights, which are admitted by reason and guaranteed by the authority of God.</p></blockquote>

<blockquote><p>Commenting on the conduct of the majority Scottish RP Synod (1863) in removing ecclesiastical censure from those who voted in British elections, the London-Scottish Reformed Presbyterian Magazine (which represented the minority who dissented from this) argued that it was a violation of the covenants to admit those who voted to communion:

[W]e cannot refrain from remarking further here, that the Synod and congregations of the majority part of the Reformed Presbyterians do not themselves keep the Covenants. Extending church privileges to such as take part in political action with the British Constitution, they hold fellowship with malignants against the express engagements both of the National and the Solemn League and Covenant. If those who supported popery, prelacy, and arbitrary civil power in the days of the Covenant engagements were malignants, what else are they who now uphold popery, prelacy, and Erastianism, and condemn the Covenants themselves as unlawful deeds? There is need for the Synod and congregations, therefore, to instead of descending to loose and unworthy union, ascending to reformation, by retracing steps of defection already taken, even although this would cost a sacrifice, which few professors in this age of the world are inclined to make.</p></blockquote>

<blockquote><p>Although the Reformed Presbyterian Synod was initially cautiously supportive of what it saw as the good aspects of the 1859 Revival in Ulster, it seems fairly clear that by 1861 they had come to realise that the movement was deeply pernicious (we would have preferred it had they agreed with the PCI’s Isaac Nelson and William Hamilton and completely condemned the movement, but this is still a very strong statement against the fanaticism which manifested itself during the Year of delusion). Here is what the Irish Synod wrote to their American brethren:

The great religious excitement, or, as it has been called, “Revival,” which took place here during the Summer of 1859, was so conducted that we could take very little part therein. As a similar movement took place in your own country a short time previous, it is not necessary that we should now refer particularly to it. Though the whole religious community in the North of Ireland was for a time greatly agitated, our people for the most part kept entirely aloof from those scenes of dangerous and irrational excitement everywhere prevailing.

And now that matters have assumed very much of their wonted aspect, we have no doubt but the “Revival” was overruled by God for the quickening of many of His dear saints, and we hope also leading to the conversion of not a few souls to Christ: but the almost utter annihilation of the distinction between truth and error; the contempt cast upon the instituted ordinances of grace; the substitution of mere excitement and feeling for knowledge and genuine experimental religion; the enthusiasm and presumption engendered in self-styled “converts” and self-constituted preachers; the perversion and corruption of the worship of God, have produced effects which it will require a considerable length of time to counteract and remedy.

But whilst we thus easily discover and point out the evils connected with such “Revivals,” how much more important it is for us to endeavour to obtain a real revival of true religion among ourselves! A revival of religion in our own souls, in our families, in our congregations, and in our churches. Do we not need it? Let us, therefore, strive together in prayer for a more copious effusion of the Holy Spirit, that all sin, self-seeking, pride, formality, hypocrisy, and worldly-mindedness may be put away from us, and that we may be made more holy, more spiritually-minded, more zealous for the Divine glory, and more devoted to His service – that our churches may be more vital, active, and godly, “strengthening the things that remain, that are ready to die.” Let our mutual aim be, that by holy living we may recommend the truth unto others, causing our lights so to shine before men, that others seeing our good works may be led to glorify our Father in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/reformed-presbyterian-synod-of-ireland.html">Reformed Presbyterian Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘John Hart and William McCarroll to American Synod, 18 April 1861’ in Covenanter</cite>, v, no. 8 (Aug. 1861), pp 214-15.</span></figcaption>

And now that matters have assumed very much of their wonted aspect, we have no doubt but the “Revival” was overruled by God for the quickening of many of His dear saints, and we hope also leading to the conversion of not a few souls to Christ: but the almost utter annihilation of the distinction between truth and error; the contempt cast upon the instituted ordinances of grace; the substitution of mere excitement and feeling for knowledge and genuine experimental religion; the enthusiasm and presumption engendered in self-styled “converts” and self-constituted preachers; the perversion and corruption of the worship of God, have produced effects which it will require a considerable length of time to counteract and remedy.

uted+preachers%3B+the+perversion+and+corruption+of+the+worship+of+God%2C+have+produced+effects+which+it+will+require+a+considerable+length+of+time+to+counteract+and+remedy.%0A%0ABut+whilst+we+thus+easily+discover+and+point+out+the+evils+connected+with+such+%E2%80%9CRevivals%2C%E2%80%9D+how+much+more+important+it+is+for+us+to+endeavour+to+obtain+a+real+revival+of+true+religion+among+ourselves%21+A+revival+of+religion+in+our+own+souls%2C+in+our+families%2C+in+our+congregations%2C+and+in+our+churches.+Do+we+not+need+it%3F+Let+us%2C+therefore%2C+strive+together+in+prayer+for+a+more+copious+effusion+of+the+Holy+Spirit%2C+that+all+sin%2C+self-seeking%2C+pride%2C+formality%2C+hypocrisy%2C+and+worldly-mindedness+may+be+put+away+from+us%2C+and+that+we+may+be+made+more+holy%2C+more+spiritually-minded%2C+more+zealous+for+the+Divine+glory%2C+and+more+devoted+to+His+service+%E2%80%93+that+our+churches+may+be+more+vital%2C+active%2C+and+godly%2C+%E2%80%9Cstrengthening+the+things+that+remain%2C+that+are+ready+to+die.%E2%80%9D+Let+our+mutual+aim+be%2C+that+by+holy+living+we+may+recommend+the+truth+unto+others%2C+causing+our+lights+so+to+shine+before+men%2C+that+others+seeing+our+good+works+may+be+led+to+glorify+our+Father+in+heaven.%E2%80%9D%0A%0A%E2%80%94+Reformed+Presbyterian+Synod+of+Ireland%2C+%E2%80%98John+Hart+and+William+McCarroll+to+American+Synod%2C+18+April+1861%E2%80%99+in+Covenanter%2C+v%2C+no.+8+%28Aug.+1861%29%2C+pp+214-15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1bdd639fb1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1bdd639fb1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/04/16/reformed-presbyterian-synod-of-ireland-on-the-evils-of-the-1859-revival-in-ulster/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Writing on behalf of American Synod to the moderator of the remnant of Old Light Reformed Presbyterians in Scotland, Samuel O. Wylie argued that those in the Scottish Synod who had voted for the removal of ecclesiastical censure from those who voted in British elections had defecting from the covenanting position and were guilty of schism:

[…] It is well known to us that for several years past, you have been enduring a great fight of affliction. The conflicts in opinion and judgment that have marked the meetings of your supreme Judicatory, for some time past, have not been unnoticed by us, not have we failed to observe in the published speeches and arguments of many of your ministers and members evidence of a radical and growing dereliction from a Covenanted faith and practice. We have watched with absorbed and painful interest the progress of events among you, and from the first dreaded the result.

The deliverance of your late Synod touching the Overture, and the political relations of its members and the people under its jurisdiction, though anticipated by us, has filled our hearts with unaffected sorrow. We mourn for the division in our Covenanted Zion, and we mourn, most of all, for the falling away of the Covenanted witnesses, and the dishonour done thereby to truth, and to the memory of a faithful and venerated ancestry. The defection scarcely perceptible in its incipient stages, in the progress of a natural development open and manifest of late to all, has culminated in actual schism, and in avowed departure from the distinctive article and feature in the faith and practice of the Reformed Presbyterian Church. Another dark page in Scotland’s history has been written.</p></blockquote>

<blockquote><p>An article in Moses Roney’s Reformed Presbyterian periodical highlights the absurdity of Old and New School Presbyterians tolerating man-stealers in their communion (which also reminds us that the Old-New School split was not merely about slavery):

Add to all this, the exciting subject of slavery creates division in both the Old and New School ranks, and hastens on a subdivision into separate bodies. The anti-slavery men maintain, teach and prove that the holding of unoffending men in bondage as goods and chattels, like beasts of burden, is theft and robbery; while many distinguished pro-slavery men teach, that it is a natural relation, and sanctioned by the gospel of Christ. They farther assert that the doctrine of immediate emancipation is fanatical, incendiary, and seditious; and acting on their principles, they encourage mobs to prevent by violence the discussion of the right of the slave to freedom. We should like to know certainly the ecclesiastical standing of the man that lately murdered the Rev. Mr. Lovejoy, at Alton, Illinois, for his attempt to plead the cause of the trampled down slave. We do know that a clerical brother of the martyr to the cause, of liberty, encouraged the mob that committed the murder; and we know that an elder of the Presbyterian body was in the mob that committed violence on the person of Amos Dresser. Now, how is it possible for men to continue long together in the same communion, when their sentiments are so adverse as that what one party holds to be theft and robbery, the other strenuously maintains to be righteous, and practices accordingly? How can they long continue to meet at the same communion table, whose adverse doctrines and practices have already issued in deeds of violence and blood?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/moses-roney.html">Moses Roney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divisions in the churches in Reformed Presbyterian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-1067607744" data-kw="">
<blockquote><p>Two things have I to remark here with regard to the Church of Scotland. First:- Every one who connects himself with that Church, takes up AN ANTI-COVENANTING POSITION! When King William and his parliament looked into the Statute Book of the Kingdom, they found the obnoxious Acts of Charles II., which rescinded all the laws which had been enacted in favour of the Covenanted Reformation, legibly inscribed therein:- and what did they do with these acts? Repeal them? Not at all? They retained those guilty acts in all their force, and passing over the Second Reformation altogether, they revised the Act of 1592, and constituted it the character of the Church of Scotland? Did the General Assembly of 1690, object to this iniquitous juggling? Not they, indeed. They saw that the rest was good, and the land pleasant, and so, Issachar-like, they bowed the shoulder to bear, and became servants unto tribute. Yes, this they did, although the King plainly told them in his “letter” that “he and his parliament” had enacted such a frame of church government “as was judged to be most agreeable to the inclinations of his subjects.” HE and his PARLIAMENT, you perceive, my reader, did the whole business!! Therefore, it is, that I assert, that every minister and member of the Revolution Church of Scotland, cuts himself off from all participation in the glories of the period between 1638 and 1649. The same, indeed, must be said of the Free Church of Scotland, and also of the Irish Presbyterian Assembly.

The Established Church of Scotland is cut off from all participation in the glories of the Covenanting era, by STATUTE LAW; whereas the Free Church and the Irish Presbyterian Church, have VOLUNTARILY cut themselves off from these glories, by homologating the Revolution Settlement. Aristotle appears to be so much out of date now, that it may it may appear hazardous to venture upon a syllogism; however, let us try one. FIRST, major-premises: – The Revolution Settlement deliberately passed by; utterly repudiated; and placed “the grave-stone” upon the “Covenants and Covenanted Reformation.” SECOND, minor-premises:- Every Church which homologates the Revolution Settlement, deliberately passes by; utterly repudiates; and places the “grave stone” upon the “Covenants and Covenanted Reformation.” THIRD, the conclusion:- But, the Established Church of Scotland, the Free Church, and the Irish Presbyterian Church, do, each and all, homologate the Revolution Settlement; therefore, the Established Church of Scotland, the Free Church, and the Irish Presbyterian Church, do, each and all, deliberately pass by; utterly repudiate; and place the “grave stone” upon the “Covenants and Covenanted Reformation.” Quod crat demonstrandum. It is not my business to attempt to reconcile with honour, or even with common honesty, the conduct of those gentlemen, who, after they have deliberately repudiated the whole Covenanted Reformation, name and thing, can turn round, when the purpose serves, and cry out – often quite snappishly – to real Covenanters, “You are not the real Covenanters; we are the real Covenanters!!” Although I cannot allow that such persons are the real Covenanters, I do most readily grant that they are the real sextons, the real grave-diggers of the Covenanted Reformation, for they have consigned the whole thing to oblivion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Britain</cite>, still a horn of the beast (Banbridge, 1878), pp 23-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

elves+off+from+these+glories%2C+by+homologating+the+Revolution+Settlement.+Aristotle+appears+to+be+so+much+out+of+date+now%2C+that+it+may+it+may+appear+hazardous+to+venture+upon+a+syllogism%3B+however%2C+let+us+try+one.+FIRST%2C+major-premises%3A+%E2%80%93+The+Revolution+Settlement+deliberately+passed+by%3B+utterly+repudiated%3B+and+placed+%E2%80%9Cthe+grave-stone%E2%80%9D+upon+the+%E2%80%9CCovenants+and+Covenanted+Reformation.%E2%80%9D+SECOND%2C+minor-premises%3A-+Every+Church+which+homologates+the+Revolution+Settlement%2C+deliberately+passes+by%3B+utterly+repudiates%3B+and+places+the+%E2%80%9Cgrave+stone%E2%80%9D+upon+the+%E2%80%9CCovenants+and+Covenanted+Reformation.%E2%80%9D+THIRD%2C+the+conclusion%3A-+But%2C+the+Established+Church+of+Scotland%2C+the+Free+Church%2C+and+the+Irish+Presbyterian+Church%2C+do%2C+each+and+all%2C+homologate+the+Revolution+Settlement%3B+therefore%2C+the+Established+Church+of+Scotland%2C+the+Free+Church%2C+and+the+Irish+Presbyterian+Church%2C+do%2C+each+and+all%2C+deliberately+pass+by%3B+utterly+repudiate%3B+and+place+the+%E2%80%9Cgrave+stone%E2%80%9D+upon+the+%E2%80%9CCovenants+and+Covenanted+Reformation.%E2%80%9D+Quod+crat+demonstrandum.+It+is+not+my+business+to+attempt+to+reconcile+with+honour%2C+or+even+with+common+honesty%2C+the+conduct+of+those+gentlemen%2C+who%2C+after+they+have+deliberately+repudiated+the+whole+Covenanted+Reformation%2C+name+and+thing%2C+can+turn+round%2C+when+the+purpose+serves%2C+and+cry+out+%E2%80%93+often+quite+snappishly+%E2%80%93+to+real+Covenanters%2C+%E2%80%9CYou+are+not+the+real+Covenanters%3B+we+are+the+real+Covenanters%21%21%E2%80%9D+Although+I+cannot+allow+that+such+persons+are+the+real+Covenanters%2C+I+do+most+readily+grant+that+they+are+the+real+sextons%2C+the+real+grave-diggers+of+the+Covenanted+Reformation%2C+for+they+have+consigned+the+whole+thing+to+oblivion.%E2%80%9D%0A%0A%E2%80%94+Samuel+Simms%2C+Britain%2C+still+a+horn+of+the+beast+%28Banbridge%2C+1878%29%2C+pp+23-4.&amp;url=https%3A%2F%2F5so <blockquote><p>In the midst of the mindless fanaticism surrounding the current presidential election, James Dick provides us with a sense of perspective that is sadly missing among the pseudo-religious right – who think that you can reform a nation by voting for a Mormon antichrist. It is especially sad that professors at “Puritan Reformed” seminaries ignore the teaching of the Reformed confession in relation to extirpating idolatry and caring for the poor and needy in order to justify supporting the heresy of American conservatism (being “conservative” in America means conserving an atheist, idolatrous, Christ-despising, hell-inspired constitution. It is, therefore, a political heresy to be a conservative in an American context. Why do you think the Libertarians and conservatives slander our Reformed forebears as Statists and socialists? It is because they know that the Reformed position is at odds with their idol of conservatism). I wonder how many Puritans would have voted for Socinians or members of other cults? Seriously, if you were to accept the reasoning in the post linked above, “vote for Mitt Romney because he is against abortion and homosexuality” [which is debatable], you could use it to justify voting for the Pope of Rome! After all, the Pope is against homosexuality and abortion, but no Puritan would ever have voted him or his votaries into civil office because they knew that the spiritual damage popery and false relgion can potentially do is far worse than anything that can be done by abortionists or homosexuals. The reality is that such “conservatism” (a useless term if ever there was one) is of its father the devil. May God deliver us from such folly by returning us to the Old Light Covenanter position:

The Reformed Presbyterian Church exists to keep this Gospel pure and entire. Is there any other Church that does this? If so, we shall be glad to join hand and heart with that Church. We do not know, however, of any Church but our own that openly protests against the nation’s rejection of Christ. We do not know of one single resolution or memorial or action of any Court of the British Presbyterian Churches in which they profess a desire to bring the nation to Christ’s feet. We do not know of a single act in which they denounce the sin of this nation in breaking Christ’s Covenants at the Restoration, and its continued sin in persisting in the breach of those Covenants today.

Yet members of these churches will tell us when we feel constrained to protest against a rebellious nation, and to separate ourselves from it, that they are taking the more excellent way of “voting for good men,” and seeking reform in the direction of which we are speaking. For first, no good man ever yet solicited the votes of the electors in order to advocate the restoration of the nation to Christ’s law. No vote was ever given or received for the purpose of purging the nation from its unholy confederacy with Christ’s enemies. When we find a candidate for Parliamentary honours who will pledge himself heartily and honestly to urge upon the nation the Gospel of our Testimony, and when we find members of other churches willing to vote that the Gospel of our Testimony may be accepted by the nation, it will be time enough for us to consider whether voting side by side with Papists and other enemies of Christ be a more excellent way, or any holy way at all, to seek reform.</p></blockquote>

<blockquote><p>For what purpose, then, does the Reformed Presbyterian Church exist? And what is the advantage of having a Theological Hall in connection with our Church? If we wish only to be Christian in our profession and position as a Church, why not join, or allow ourselves to be absorbed by, some of the Christian Churches around us? Our reply is, We occupy a separate position as a church because we desire, we trust sincerely, to realise a fully Christian ideal of universal subjection to Christ our King on our part, and to extend the knowledge and appreciation of that ideal among the churches around us. We could not join any one of these churches without doing that which would be, from our point of view, equivalent to disobeying some of the Commandments of Christ, or opposing or disregarding some part of His authoritative revelation, and so coming short of the Christian ideal. Not that we charge any of the churches with deliberate or conscious disobedience; but that we find, in point of fact, that some of the most important principles of Christ’s truth – notably the principle of His rightful dominion as Mediator over the Church and over the nation – are allowed to fall into abeyance or into oblivion, at least in all the larger Evangelical Churches.

Passing, in the meantime, the principle of Christ’s absolute authority in His Church – a principle which is being constantly violated by the introduction of audacious inventions of man into Divine worship, and by the pushing of Christ’s own authoritative institutions into a corner – and looking at the principle of His Headship over the nation, we may conclude, without any tedious process of reasoning, that the church which sees Christ’s law set aside by the nation, and His authority rejected, and His Kingly rights trampled in the mire with disdain by every petty enemy, the church that admits and even argues for the principle that enemies of Christ have a right to be constituent members in that society in which God has declared that Christ has a right to be the Head, and in which therefore the will of Christ is the supreme and ultimate authority – the church that sees this monstrous wrong done to Christ, and stands by for generations without uttering one word of fearless denunciation, and without doing one single deed the object of which is to bring the nation back to the throne of Christ in dutiful allegiance, has not, in this respect at least, a broad or intelligent or conscientious conception of Christian duty.

We need, therefore, to maintain our denominational position that we may continue to utter a clear and faithful testimony for Christ the King, and to utter it all the more clearly and faithfully as others continue to become more careless about the fearful rebellion of the nation against Him, or to become more impatient of the restraints of our testimony against their criminal neglect. And as our Church must continue to exist, our Theological Hall must exist, not only that the doctrines of Evangelical Christianity generally may be taught and embraced, but also that the candidates for the ministry on leaving the Hall may go forth under the solemn and joyful conviction that Christ is “King of kings and Lord of lords,” and that minister is the King’s ambassador to be guided by the King’s will, and to labour for the world-wide acknowledgment of the King’s reign.</p></blockquote>

<blockquote><p>And with respect to the government of Christ’s house, alas! the generality of the present age seem to be agreed, that it is a matter of mere indifferency and moonshine, whether a person be of the Episcopalian, Independent, or Presbyterial way of thinking about it; although it is the declared principle of this church, founded on the word of God, solemnly sworn unto and sealed by the blood of many of the Lord’s witnesses, That the spiritual power and authority, is lodged, neither in the hand of the civil magistrate, not in the community of the faithful, as they call them, but in church officers, ministers and elders acting in parity, and judicatories subordinate to one another. Now, we say that a faithful minister of Christ is set for the defence of the gospel, namely, both for the defence of gospel-truth, and likewise of the hedge of government, which the glorious Head hath set about it.</p></blockquote>

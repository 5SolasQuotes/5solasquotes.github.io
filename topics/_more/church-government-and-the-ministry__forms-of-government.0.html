OO%29.+Nothing+more+advances+the+affairs+of+tyrants%2C+then+a+faint+impru%C2%ADdent+and+unsuccessful+resistance%3A+Becold+by+this+unhappy+attempt+of+his+enemies+having+confirmed+his+authority%2C+suborned+one+of+the+prophets+to+preach+to+the+people%2C+that+it+was+the+command+of+God+to+make+Becold+the+king+of+the+whole+earth%2C+promising+that+all+the+kings+and+potentates+of+the+world+should+certainly+be+subdued+by+his+sword%2C+for+he+was+the+man+that+should+rule+all+nations+with+a+rod+of+iron+%28PP%29.+Becold%2C+at+the+hearing+of+these+news%2C+humbled+himself+to+the+ground%2C+adored+the+truth+of+that+prophecy%2C+declared+his+information+thereof+by+God+ten+days+be%C2%ADfore%2C+but+the+matter+concerning+his+own+person+he+had+hitherto+been+silent%2C+yet+all+now+being+made+public+by+the+mouth+of+another+prophet%2C+he+did+submit+himself+to+the+will+of+God.+No+minute+of+time+was+delayed%2C+the+twelve+princes+were+cashie%C2%ADred%2C+the+Catholic+monarch+did+choose+his+chancellor%2C+treasu%C2%ADrer%2C+secretary%2C+and+other+officers+of+state+and+court%2C+a+fair+high+throne+was+set+up+in+the+market-place%2C+and+covered+all+over+with+cloth+of+gold%3B+Becold+made+for+himself%2C+being+a+tailor+by+his+trade%2C+very+royal+suits+of+most+gorgeous+apparel+of+the+priests%E2%80%99+vestments%2C+which+he+had+robbed+in+the+cathedral%3A+a+stately+crown%2C+scepter+and+sword+were+prepared+for+him%2C+his+courtiers+were+all+put+in+most+sumptuous+raiment%2C+no+greater+magnifi%C2%ADcence+was+to+be+seen+at+any+princes+court+in+the+world+%28QQ%29.+Thus+Becold+attained+the+top+of+his+ambition+and+lust%2C+but+the+great+skill+was+how+to+keep+what+was+gotten%3A+for+this+end+twen%C2%ADty+eight+apostles+were+sent+abroad+to+preach+over+the+world+obe%C2%ADdience+to+the+King+of+Munster+the+new+Jerusalem%3B+but+here+was+the+bad+luck%2C+all+of+them+but+one+who+returned+with+the+tidings+were+killed+in+the+places+where+first+they+offered+to+preach.+In+the+meantime+the+town+begun+to+be+pinched+with+famine%2C+one+of+the+king%E2%80%99s+wives+being+reported+for+a+word+of+compassion+upon+the+starving+multitude%2C+was+brought+forth+to+the+marketplace%2C+and+by+Becold%E2%80%99s+own+hand+had+her+head+struck+off+%28RR%29.+All+the+rest+of+his+wives+did+sing+a+psalm+to+God+for+this+so+excellent+an+act+of+justice.+The+King+himself+led+all+fourteen+in+a+dance+%5BPage+11%5D+through+the+streets+of+the+town%3B+it+were+long+to+recite+all+the+acts+of+their+villainous+hypocrisy%2C+at+last+the+patience+of+God+broke+out+upon+them.+One+of+the+king%E2%80%99s+secretaries+undertook+to+bring+into+the+town+a+supply+of+men+and+food%2C+when+he+was+gone.+his+way+was+straight+to+the+enemy%2C+he+guided+his+treason+so+cunningly%2C+that+on+a+certain+night+he+brought+a+party+within+the+town%2C+many+were+put+to+the+edge+of+the+sword%2C+the+king+and+the+principal+mis-leaders+of+the+people+were+taken+alive%3B+the+king+was+brought+to+acknowledge+the+most+of+his+errors+%28SS%29%2C+he+offered+upon+con%C2%ADdition+of+his+life+to+make+all+the+Anabaptists+in+Holland%2C+Friesland%2C+and+England+to+be+quiet+and+give+over+their+way%3A+but+these+vain+promises+were+not+trusted%2C+and+so+after+some+cruel+torture%2C+he+and+Knipperdolling+were+killed%2C+and+hung+up+in+a+cage+of+iron+up%C2%ADon+the+highest+pinnacle+of+the+cathedral+steeple+%28TT%29.+That+same+very+year+1535%2C+Amsterdam+in+hazard+to+be+a+second+Munster%2C+the+Anabaptists+had+a+mighty+design+upon+Amsterdam%2C+and+very+narrowly+did+miss+of+their+intention%2C+to+surprise+that+city%2C+to+be+a+seat+of+as+glorious+a+kingdom+as+had+been+at+Munster.+But+God+assisted+the+citizens+to+prevent+such+a+mischief%2C+albeit+not+without+great+loss%2C+for+some+hundreds+were+killed+on+both+sides+in+these+bloody+uproars+%28VV%29.+All+this+did+not+teach+the+Anabaptists+wisdom.+Still+they+did+expect+a+new+Jerusalem%2C+and+an+earthly+kingdom%2C+their+prophets+filled+the+fancies+of+their+people+with+this+notion+more+than+any+other.+One+of+their+women+at+Apezell+in+Switzerland+gave+her+self+out+for+the+Queen+of+the+world+and+Messiah+for+all+women%2C+sending+out+her+twelve+she-Apostles+for+their+conversion+to+her+way+%28XX%29.+I+read+also+after+the+death+of+Becold+of+a+second+King+in+Utrecht%2C+who+was+no+less+infamous+for+crimes+than+his+predeces%C2%ADsors%2C+by+open+robberies+he+became+rich%2C+with+his+own+hands+he+killed+his+poor+wife+that+he+might+marry+her+daughter+%28YY%29.+However+the+grievous+absurdities+of+the+Anabaptists+both+in+their+doctrine+and+practice%2C+as+also+the+evident+judgments+which+God+and+man+did+pour+upon+them%2C+and+the+very+great+industry+which+all+the+great+and+heroic+divines+of+that+happy+time+of+Reformation+did+use+to+reclaim+them%2C+much+retarded+their+pro%C2%ADgress%3A+yet+it+is+marvelous+to+consider+their+incredible+increase+in+many+parts+of+Germany+and+elsewhere%2C+til+God+of+his+mercy+did+divide+them+among+themselves%2C+and+confound+their+languages%3A+%5BPage+12%5D+their+divisions+and+subdivisions+was+that+which+most+of+all+did+weaken+them+and+stop+their+course.+After+the+taking+of+Munster+one+John+Battenburg+a+bastard+of+a+good+family+born+at+Leiden%2C+made+himself+head+of+a+strong+party%2C+and+pretended+a+divine+mission+to+propagate+that+earthly+kingdom+%28ZZ%29%2C+which+by+the+fatal+calamity+of+his+townsman+Becold%2C+and+his+friends+at+Munster+had+been+a+little+interrupted%3A+between+the+followers+of+this+Battenburg%2C+and+the+remainder+of+the+Monasterian+Anabaptists+arose+the+first+discord.+Their+suffe%C2%ADrings+and+disappointments+made+them+more+sober+and+wary+then+the+zeal+of+Battenburg+could+approve+of%3B+for+he+professed+that+since+the+gospel+preached+by+Becold+had+been+rejected+by+the+world%2C+the+time+of+mercy+was+now+expired%2C+and+nothing+but+wrath+remained%3A+So+that+his+commission+from+God+was+to+kill+all+the+world%2C+only+those+who+did+yield+to+his+way%2C+and+were+rebaptized%2C+he+might+admit+to+be+slaves+as+Israel+did+the+Gibeo%C2%ADnites+%28AAA%29.+Upon+those+grounds+his+followers+where+ever+they+dared+be+bold%2C+did+kill+all+whom+they+met+with+in+the+fields%2C+did+rob+and+steal+what+ever+came+to+their+hand%2C+in+country+villages+broke+in+upon+sleeping+people%2C+pulled+sundry+out+of+their+beds+and+drowned+them+in+the+first+waters%2C+or+hanged+them+upon+the+first+trees+%28BBB%29.+They+of+Munster+did+not+approve+of+all+these+pra%C2%ADctises%2C+therefore+they+were+condemned+as+cold%2C+lukewarm+hin%C2%ADderers+of+the+Kingdom+of+Christ+%28CCC%29.+This+discord+lasted+for+several+years%2C+till+the+Monasterians+expired%2C+and+the+Battenbur%C2%ADgicks+were+also+rooted+out+as+robbers+and+murderers+by+the+sword+of+the+Magistrate.+The+second+division+was+greater%2C+one+Melchior+Hoffman+a+skin%C2%ADner+or+glover+in+Suabland+before+the+tragedy+of+Munster%2C+The+sect+of+the+Hophmanists+was+a+prime+leader+of+the+Anabaptists%3A+In+Strasburg+about+the+year+1529+he+seduced+many%2C+he+leaned+much+upon+Enthusiasms+and+dreams+%28DDD%29%3B+he+fancied+that+Strasburg+was+appointed+of+God+to+be+the+new+Jerusalem%3B+that+himself+and+some+others+were+quickly+to+get+from+heaven+an+extraordinary+calling+to+an+apostleship+%28EEE%29%2C+that+so+from+that+town+they+might+preach+the+gospel+to+all+the+world%2C+which+they+were+assured+would+in+a+short+time+be+subdued+to+Christ+by+the+power+of+the+Spirit+in+their+ministry+without+any+outward+force+%28FFF%29.+The+violent+tu%C2%ADmults+of+Munster%2C+Hofman+did+not+approve%2C+these+were+the+in%C2%ADventions+%5BPage+13%5D+of+his+scholar+Mathie+of+Haarlem+which+he+did+always+dislike+%28GGG%29%2C+albeit+whilst+that+doctrine+of+his+scholar+did+pro%C2%ADsper+in+Munster%2C+he+durst+not+much+contradict+it%3B+but+so+soon+as+Munster+was+taken%2C+and+the+chief+authors+of+these+violent+te%C2%ADnets+were+executed%2C+he+took+then+the+boldness+openly+to+cry+down+much+of+the+way+of+the+Monasterians%2C+he+preached+for+the+office+and+power+of+the+magistrate%2C+and+did+chase+away+polyga%C2%ADmy+%28HHH%29%3B+these+were+the+grounds+of+the+deadly+feud+betwixt+Hoffman+and+Battenburg%2C+and+both+their+followers%2C+which+were+many+thousands+of+poor+seduced+souls.+These+of+Hoffman%E2%80%99s+party+did+not+long+agree+among+them%C2%ADselves%2CWho+were+the+Mennonites.+one+Menno+the+son+of+Simon+a+secular+Priest+%28III%29+in+West+Friesland+turning+Anabaptist%2C+began+to+criticize+sundry+things+in+Hoffman%E2%80%99s+doctrine%3A+he+did+reject+all+extraordinary+and+apostolic+calling+%28KKK%29%2C+also+the+dreams+of+the+saints%E2%80%99+kingdom+upon+earth+%28LLL%29%2C+and+all+enthusiasms+%28MMM%29%2C+but+in+other+things+did+follow+the+worst+of+the+Anabaptists+errors%3A+denying+the+truth+of+Christ%E2%80%99s+humanity%2C+setting+up+Pelagianism+in+man%E2%80%99s+free+will%2C+maintaining+a+perfect+inherent+righteousness+without+sin%2C+and+such+like+conceits+%28NNN%29.+A+Synod+for+union+did+divide+them+a%C2%ADmongst+them%C2%ADselves+more+than+ever.+While+the+pestiferous+vapor+of+this+evil+spirit+was+sensibly+vanishing+by+domestic+divisions%2C+some+of+the+wisest+of+the+sect+found+ways+to+draw+together+the+chief+of+all+the+four+mentioned+factions+to+a+conference+at+Buckholt+in+West%C2%ADphalia.+A+great+synod+of+prime+men+from+all+countries+where+the+Anabaptists+lived+did+meet+there%3B+from+the+most+places+of+lower+Germany%2C+from+Friesland%2C+from+Saxony%2C+from+England+also+some+did+come+%28OOO%29.+Great+debates+were+among+them%2C+especially+between+the+Battenburgicks+and+the+Hoffmanites%2C+the+one+defen%C2%ADding+polygamy+and+their+use+of+the+sword+against+the+world%2C+the+other+opposing+both.+John+Mathie+of+Middleburg+a+great+do%C2%ADctor+of+the+Anabaptists+in+England%2C+was+the+chief+champion+of+the+Hoffmanites+%28PPP%29.+Here+it+was+where+David+George%2C+a+citizen+of+Delph%2C+David+Georgius+labors+for+u%C2%ADnion.+did+first+become+famous%2C+this+man+had+been+a+zealous+opponent+of+pope%C2%ADry%2C+he+had+openly+in+the+streets+upbraided+both+the+priests+and+magistrates+of+Delph%2C+in+the+very+act+of+their+idolatrous+processi%C2%ADon%3A+for+which+bold+zeal+he+was+cast+in+prison%2C+and+had+his+tongue+bored+through%2C+hardly+escaping+with+his+life+%28QQQ%29%3B+these+suf%C2%ADferings+brought+to+him+great+respect+among+the+Protestants+at+%5BPage+14%5D+home%2C+but+thereafter+turning+Anabaptist+he+became+the+greatest+and+worst+heretic+to+my+mind+that+ever+trod+upon+the+earth.+At+the+Synod+of+Buckholt+he+labored+exceeding+much+to+draw+his+brethren+to+concord%3B+the+Battenburgicks+and+Hoffmanites+had+so+sharp+debates+about+the+magistrate%2C+the+earthly+kingdom+of+the+saints+and+polygamy%2C+that+hardly+they+could+be+kept+from+handy+blows+%28RRR%29%3A+David+George+did+mediate+between+them%2C+and+drew+it+to+this+issue%2C+that+a+mutual+toleration+being+granted+in+the+points+controverted%2C+in+all+other+things+they+should+hold+one+another+for+Brethren%2C+and+promote+jointly+the+common+cause+of+Anabaptism+%28SSS%29.+This+syncretism+did+not+long+stand%2C+neither+did+David+get+thanks+from+either+side+for+his+mediation%2C+for+all+did+esteem+him+a+colluder+with+both+sides+only+for+his+own+interests%2C+driving+a+design+of+his+own+apart%2C+differing+from+them+all%2C+which+then+was+scarce+visible+above+the+ground%2C+but+quickly+thereafter+was+apparent.+A+little+after+that+synod+all+the+parties+did+separate+more+then+ever+one+from+another+as+Antichristian+and+false+believers+%28TTT%29%2C+til+the+most+of+their+sects+did+vanish%3A+the+Monasterians+in+a+short+time+were+drowned%3B+of+the+Battenburgicks+none+does+remain%2C+except+it+be+a+handful+in+Moravia%3A+for+after+the+imprisonment+and+execution+of+their+leader+for+his+manifold+robberies+and+murders%2C+his+followers+were+altogether+broken.+The+Hoffmanites+by+the+diligence+of+Bucer+and+Calvin+at+Strasburg+being+convinced+received+satisfaction+and+recanted+their+errors%2C+joining+themselves+again+to+the+Protestant+Churches+%28VVV%29.+The+Georgians+for+a+time+did+flourish%2C+their+leader+David+was+a+man+very+pragmatic%2C+of+a+vehement+and+persuasive+eloquence+in+the+acts+of+devotion%2C+for+show+singular%2C+ardent+and+frequent+in+prayer+%28XXX%29%2C+in+fasting+excessive%2C+abstaining+from+all+meat+and+drink+sometimes+four+whole+days+and+nights+together+%28YYY%29%3A+won%C2%ADderfully+confident+of+the+absolute+truth+of+his+tenets%2C+so+marvel%C2%ADously+bold+that+he+did+write+and+professed+his+hope+by+his+letters+and+books+to+persuade+the+undeniable+certainty+of+his+dictates+to+the+Emperor+Charles+the+fifth%2C+and+to+all+the+estates+of+the+Empire+%28ZZZ%29%2C+especially+to+the+good+Landgrave+of+Hesse%2C+Phi%C2%ADlip%3B+yet+his+absurdi%C2%ADties+were+hor%C2%ADrible.+also+to+Melanchthon%2C+to+Bucer%2C+to+a+Lasco%2C+and+many+more%3A+yet+his+tenets+are+so+horribly+absurd+that+Mohammad+in+his+worst+abo%C2%ADminations+was+far+below+him%2C+for+he+taught+that+in+the+godhead+%5BPage+15%5D+was+no+trinity+of+persons%2C+but+only+three+ways+of+manifestation%2C+one+in+Moses%2C+another+in+Jesus%2C+a+third+in+himself%3B+that+his+person+was+as+far+above+the+person+of+Jesus%2C+as+Jesus+was+above+Moses%3B+that+the+writings+of+the+prophets+and+apostles%2C+that+the+doctrine+of+the+law+and+gospel+was+all+to+be+laid+aside+%28AAAA%29+as+childish+and+imperfect+rudiments%2C+to+be+dispelled+as+the+twilight%2C+by+the+beams+of+his+far+more+perfect+doctrine.+One+of+the+greatest+perfections+and+singularities+I+mark+in+his+doctrine+is+that+which+he+much+insists+upon%2C+the+mortification+of+the+flesh%3B+to+this+he+leads+by+a+singular+method%2C+he+looses+the+bands+of+matrimony%2C+and+all+other+natural+and+civil+relations+as+things+old+and+antiquated%2C+which+did+oblige+only+during+the+time+of+Moses+and+of+Jesus%2C+but+not+under+the+clear+light+which+his+ministry+had+brought+to+the+world%3B+adulteries%2C+fornications%2C+incests%2C+and+most+unspeakable+villainies+were+so+far+from+being+any+sins+to+him%2C+that+he+did+re%C2%ADcommend+them+to+his+most+perfect+scholars+as+acts+of+grace+and+mortification%3A+he+was+given+over+to+be+possessed+with+so+beastly+a+spirit+in+the+justice+of+God+for+a+recompense+of+his+hypocrisy+and+blasphemous+errors+against+the+truth+of+God+%28BBBB%29.+Notwithstanding+of+the+unutterable+absurdity+of+his+way%2C+yet+this+beast+was+confident+that+the+whole+world+would+submit+to+him%2C+and+in+a+short+time+would+put+into+his+hands+without+any+violence+all+their+power+and+wealth%3B+and+indeed+at+the+beginning+he+got+many+families+of+good+note+to+follow+him+with+incredible+zeal%3A+for+all+of+them+were+willing+to+dispose+unto+him+their+whole+estates+%28CCCC%29%2C+and+were+glad+to+seal+his+doctrine+with+their+blood.+In+Delph+when+first+they+were+put+to+a+trial%2C+seven+and+thirty+most+cheerfully+did+offer+themselves+to+the+executioner%E2%80%99s+hands%2C+some+to+be+hanged%2C+some+drowned%2C+some+burnt+%28DDDD%29.+Yet+lest+this+zeal+if+too+much+tempted+should+at+last+succumb%2C+the+hypocritical+heretic+did+alter+one+of+his+principles%2C+and+taught+his+scholars+the+lawfulness+of+dissimulation%2C+permitting+them+for+the+safety+of+their+life+to+deny+and+abjure+what+ever+he+had+taught+them%2C+and+giving+them+free+liberty+to+join+the+public+wor%C2%ADship+with+any+of+what+ever+religion+among+whom+they+li%C2%ADved+%28EEEE%29%3A+by+this+means+they+got+peace%2C+and+were+no+more+any+where+persecuted.+He+himself+retiring+from+Delph+to+Basel%2C+his+strange+end+did+live+there+for+several+years+until+his+death+in+great+wealth+and+case+%28FFFF%29%2C+as+a+fugitive+for+the+true+reformed+religion%3B+he+%5BPage+16%5D+did+so+perfectly+dissemble%2C+that+he+had+the+favor+and+good+opi%C2%ADnion+both+of+the+magistrates+and+ministers%2C+without+the+least+suspicion+of+any+wickedness+in+him+%28GGGG%29%3B+but+three+years+after+his+death+all+his+abominations+were+found+out%3A+and+his+di%C2%ADligence+by+letters%2C+by+secret+conferences+and+messengers+to+propa%C2%ADgate+his+evildoing+way+with+his+whole+strength%2C+whereupon+his+bones+were+dug+up%2C+and+the+remainder+of+his+body+burnt%2C+as+the+relics+of+an+inexpressibly+wicked+villain+%28HHHH%29.+While+all+the+other+factions+of+the+Anabaptists+did+decrease%2C+the+followers+of+the+Priest+Menno+did+much+increase%3A+they+did+reject+the+earthly+kingdom+and+polygamy+of+the+Monasterians+and+Battenburgicks%2C+also+the+revelations+and+extraordinary+calling+of+the+Hoffmanites%2C+with+the+most+of+the+blasphemies+of+David+George%3B+against+all+these+Menno+did+write+with+passion+%28IIII%29%3A+But+to+the+point+of+Anabaptism+and+separation+from+all+other+reformed+Churches+to+independency%2C+and+to+a+number+more+of+the+Anabaptists+tenets+he+did+firmly+adhere%2C+alluring+many+thou%C2%ADsands+to+his+way%2C+who+continue+to+this+day+propagating+their+error+to+many+Countries.+The+wickedness+of+that+spirit+which+reigned+in+Menno%2C+and+yet+rages+in+his+followers%2C+notwithstanding+of+all+their+profession+of+great+piety%2C+of+singular+modesty+and+extreme+detestation+of+all+the+other+sects+of+Anabaptists%2C+is+apparent+in+the+manifold+grievous+heresies+and+gross+schisms%2C+whereinto+they+them%C2%ADselves+have+of+old+broken+out+and+persevere+therein+to+this+day.+Who+are+pleased+to+read+the+late+little+accurate+and+learned+Treatise+of+Clopenburgh%2C+may+perceive+that+the+Mennonite+dip%C2%ADpers+do+oppose+the+truth+of+Christs+human+nature+%28KKKK%29%2C+that+they+were+masters+to+Vorstius+in+his+denial+of+the+omnipre%C2%ADsence+and+simplicity+of+the+divine+essence+and+of+the+unchan%C2%ADgeableness+of+the+divine+decrees+%28LLLL%29%3A+also+that+Armini%C2%ADus+was+their+scholar+in+all+his+errors+concerning+predestination%2C+re%C2%ADdemption%2C+grace%2C+free+will%2C+and+perseverance.+Lastly%2C+that+Swenkfeld%2C+Servetus%2C+and+Socinus+did+learn+from+them+not+only+their+Anabaptism%2C+but+their+denial+of+the+trinity%2C+their+abnegation+of+the+godhead%2C+both+of+the+Son+and+of+the+Holy+Ghost.+%28MMMM%29.+The+Mennonite+schisms+are+no+less+palpable+then+their+heresies%2C+for+however+their+harmony+in+the+most+of+their+errors+be+great+%5BPage+17%5D+enough%2C+as+in+that+confession+of+faith+which+in+the+year+1624.+they+set+out+in+common+it+appears%2C+wherein+with+many+ambiguous+and+deceitful+words+they+cover+many+of+these+tenets+which+in+other+writings+they+expressly+maintain+%28NNNN%29%2C+yet+they+are+not+able+to+cover+their+manifold+schisms%3A+for+it+has+ever+been+their+custom+upon+the+smallest+matters+to+fall+into+so+vehement+discords%2C+as+have+made+them+excommunicate+one+another%2C+and+remain+se%C2%ADparations+refusing+communion+one+to+another+unto+this+day.+Behold+how+small+an+occasion+did+bring+them+to+no+less+then+four+irremediable+fractions+%28OOOO%29%3A+For+a+light+cause+four+late+separa%C2%ADtions+among+them.+one+of+the+Mennonites+at+Franeker+in+a+public+roping+did+seem+to+use+some+cheating+in+buying+of+a+house%2C+preventing+by+some+sleight+of+hand+another+man+who+before+him+had+a+mind+to+the+bargain%3B+this+did+so+much+displease+some+that+they+excommunicated+the+cheater%3B+others+defended+the+honesty+of+the+man+and+did+excommunicate+them+who+for+no+cause+as+they+conceived+had+put+a+censure+upon+him%3B+hence+two+sects+condemning+one+another+to+this+day.+To+recon%C2%ADcile+both%2C+a+third+party+did+arise%2C+avowing+that+however+the+man+in+his+bargain+had+used+some+piece+of+fraud%2C+yet+that+it+was+not+so+gross+as+did+deserve+excommunication.+In+this+accommodation+these+mid+men+proceeded+so+far%2C+that+they+were+excommunicated+by+both+the+dissenting+parties%2C+whereupon+their+passion+was+so+stirred%2C+that+they+did+excommunicate+them+both+also%3B+and+lest+the+number+of+their+schisms+should+be+too+small%2C+there+arose+a+fourth+party%2C+who+being+displeased+with+the+frequency+of+their+brethren%E2%80%99s+censures%2C+did+open+the+doors+of+their+charity+for+all+whom+the+rigor+of+others+had+excommunicated+and+cast+out%3B+by+this+over%C2%ADlashing+of+their+charity+they+did+acquire+from+their+companions+the+infamous+title+of+Hamaxarii+and+Borboritae%2C+as+men+who+were+content+to+take+into+their+society+cart+loads+full+of+polluted+pro%C2%ADfessors+%28PPPP%29.+We+will+say+no+more+of+the+Anabaptists+over+sea%2C+their+number+in+England+till+of+late+was+not+great%3B+and+the+most+of+these+were+not+English+but+Dutch+strangers%3A+for+beside+the+hand+of+the+state+that+ever+lay+heavy+upon+them%2C+the+labors+of+their+children+the+separatists+were+always+great+for+their+reclaiming.+Notwithstan%C2%ADding+of+all+the+contentions+of+the+separatists+among+themselves%2C+yet+all+of+them+did+ever+join+to+write+sharp+and+large+treatises+%5BPage+18%5D+against+the+Anabaptists%3B+In+this+Ainsworth%2C+Johnson%2C+Robinson%2C+Clifton+did+study+who+should+be+most+zealous.+Hence+it+was+that+the+Anabaptists+made+little+noise+in+Eng%C2%ADland%2C+till+of+late+the+Independents+have+corrupted+and+made+worse+the+principles+of+the+old+separatists%2C+proclaiming+for+errors+a+liberty+both+in+church+and+state%3B+under+this+shelter+the+Anabap%C2%ADtists+have+lifted+up+their+head%2C+and+increased+their+numbers%2C+much+above+all+other+sects+of+the+land.+Their+ways+as+yet+are+not+well+known%2C+but+a+little+time+it+seems+will+discover+them%2C+for+their+singular+zeal+to+propagate+their+way+will+not+permit+them+long+to+lurk%3A+only+the+confession+of+faith+which+the+other+year+seven+of+their+congregations+did+put+forth%2CTheir+late+con%C2%ADfession+is+nei%C2%ADther+a+full+nor+a+clear+declara%C2%ADtion+of+their+tenets+and+of+late+again+a+se%C2%ADcond+corrected+edition+have+set+out+with+a+bold+preface+to+both+the+Houses+of+Parliament+may+no+more+be+taken+for+the+measure+of+their+faith%2C+than+that+confession+which+their+elder+brethren+in+Holland+did+print+not+long+ago+in+the+name+of+all+their+compa%C2%ADny+%28QQQQ%29.+For+as+the+Dutch+confession+did+dissemble+a+num%C2%ADber+of+the+gross+heresies+which+some+of+the+very+subscribers+in+their+public+writings+both+before+and+after+did+hold+out%2C+it+is+even+so+with+the+English%2C+for+Hobson%2C+Richardson%2C+and+others+of+the+sub%C2%ADscribers+have+already+printed+several+errors+which+in+that+con%C2%ADfession+do+not+appear.+Moreover+these+seven+congregations+can%C2%ADnot+prescribe%2C+and+are+no+ways+leaders+to+a+great+number+of+Ana%C2%ADbaptist+churches+over+all+the+land%3B+however+I+shall+set+down+so+many+of+their+tenets+as+for+the+time+comes+to+my+thoughts+from+some+little+acquaintance+with+a+few+of+their+writs+that+have+fallen+into+my+hands.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Anabaptism%2C+The+True+Fountain+of+Independency%2C+Brownisme%2C+Antinomy%2C+Familism%2C+and+the+most+of+the+other+Errors+Which+For+The+Time+Do+Trouble+the+Church+of+England%2C+Unsealed%2C+%28London%2C+1647%29%2C+9%E2%80%9318.+NB%3A+For+ease+of+reading+and+because+archaic+words+spelling+tend+to+make+older+writers+seem+unintelligent&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F088cb1ac2b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/088cb1ac2b.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/05/baillie-versus-tombes-4-how-the-particular-baptists-appeared-to-early-presbyterians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-b7442c1df2" data-kw="">
<blockquote><p>This great execution upon them together with the diligence of Luther and other Divines to inform their minds did for some time much compesce [to restrain] that evil spirit and so much fright him out of all the bounds of upper Germany, that he did never since that time stir much in these Quarters: but behold his behavior elsewhere. Being rejected of Luther and his Disciples, he went to try Zwingli and his friends: unaware, and upon a sudden great numbers of Anabaptists did arise in Zurich, Bern, Basle, and many other parts of Switzerland: at the beginning they dissembled [lied about] the worst of their tenets [beliefs], they dealt earnestly with Zwingli to gather out of the churches he had reformed new separate congregations: many remonstrances [complaints] did they make to him against the profanity of the common multitude, and for the holiness that ought to be in every church member; they alleged a necessity for the saints to put themselves in new distinct churches (S). The same things did they press upon Oeco­lampadius at Basle, but when these grave men had rejected their motion, and demonstrated the iniquity of their schismatic way: then without more ado having seduced multitudes by their cor­ner and night sermons, they did themselves erect without any permission either of the magistrates or ministers, their separate congregations (T), and for a visible distinguishing character of their way they publicly anabaptized all who did enter into their society (V). For these insolencies the magistrate was offended and put some of them in prison, presently they cried out loud of persecution for conscience (X), and of unjust condemnation be­fore their cause was tried: hereupon many public disputations were instituted, Zwingli and others in Zurich many days from morning till evening did debate with them in presence of the magistrate and all who pleased at great length upon all their tenets; this same did Oecolampadius in Basle, and others in Bern, the arguments and answers with the consent of both sides were written and published, by this means many received satisfaction, many also remained obstinate in their error and became tumul­tuous in their practices, which caused the most of them to be ba­nished out of these States. To this severity the magistrate was forced by the danger of their principles, and their usual wal­king accordingly, where fear kept them not in order: in Chri­stian Commonwealths they counted magistrates unlawful, they took their enthusiasms and revelations for Gods express commandments, and it was one of their prophets ordinary revela­tions to cut off by the sword all magistrates, and whosoever op­posed their way, though father, mother, brother, or dearest friend, yea so powerfully did Satan insinuate himself in their or­dinary raptures, that no man could be secure from their cruelty, as by this example is visible. At Saint gall in Zwitzerland in the year 1526. Feb. 8. Thomas Skyker having spent the whole night with a company of Ana­baptists in their religious exercises, in the morning he was filled with an enthusiasm, and before his father, mother, and whole company, he commanded in the name of God his German bro­ther Leonard Skyker to kneel before him, and having gotten obe­dience thus far, his next prank was before them all to cut off his brother’s head, avowing he had an express warrant from God so to do (Y). Many such private murders and divers public uproars, made the magistrate every where to keep a severe hand over them; yet for all that could be done, they got into their hands the town of Munster; here the wisdom and patience of God permitted them to act to the full, all their speculations. A Story recorded by many, and needful to be remembered to the world’s end, for a memento unto all men to be very wary of an erroneous spirit, though he do appear at the first in the habit of the greatest piety and innocence; the matter was thus: In the year 1533 and 1534 by the labors of Bernard Rotman and some Hessian Preachers, Munster the greatest and strongest town of Westphalia was persuaded to cast out the Popish cor­ruptions; while the work of Reformation was there going on apace, the Anabaptists came in and mixed themselves according to their custom; for this has ever been the way of schismatics, like drones and wasps to fall upon the labors of others; they use not any where to be the instruments of any Reformation or con­version, but when that work by the labor of others is done, then they come in to spoil all, pressing upon a reformed and a con­verted people their fancies (Z). When the Gospel was flourishing in Munster, a certain Tay­lor of Leiden in Holland, one John Becold did come to Town, who at home in his own country, had drunk in all the Anabaptist ra­very [madness]: the man was of a quick and subtle wit, a great dissembler [liar], insinuating himself in the favor of the ministers, he did propone [put forward] at first only by way of scruple his arguments against infant bap­tism (AA): but in the mean time in his secret conventicles over all the city, he did instill the whole mystery of Anabaptism: The chief Minister Rotman did at the beginning preach zealously against that way (BB), but after that one Stapreda, a violent Anabaptist had eropen [?] in to be his colleague, Rotman was gai­ned to that party, and at a public disputation declared himself for them, notwithstanding the other Ministers did confute so clearly the Anabaptists grounds, that the Town Senate remained satisfied, and by that Edict commanded all the Anabaptists to depart the City (CC). But this Statute was so slackly executed, that the most remained still in Town, and did in their night meetings so diligently advance their cause, that a great many more were conquered; upon which strength waxing confident they defied their opposites, and came to a public insurrecti­on (DD). As yet the orthodox were the greater part, but the schisma­tics were the more witty [intelligent] and industrious, they managed so well their smaller strength, that they became not only considerable, but so formidable, that their adversaries were glad to indulge them their liberty and toleration which they had long desired (EE); but behold the issue of that indulgence. They who of a long time had made it their great work to cry down persecution and up toleration, when they had obtained that desire, they did not stand there, but went on every day to add new members to their society, til at last finding the great increase of their strength within the city, they did invite by messengers and letters their associates abroad from all quarters to join with them. These sum­mons made many strangers to slock [to entice] to the town, upon whose appearance without farther delay a public proclamation was issued for all to be rebaptized, or else immediately to depart the city under the pain of death (FF). Many of the best did flee, whose houses and goods were seized, yet many good people were forced to stay, for the Bishop of Munster had then blocked the City, whereby divers of those who offered to get out were killed and spoiled, and the rest were frighted from attempting any escape to the country. The Anabaptists becoming absolute masters of the town, made it their first care to discharge all the former magistrates, and to substitute in their place a new senate of their own fa­ction (GG), over which they did set two consuls, Knipperdolling and Kippenburgh, two of their most forward friends.They seised on the goods of all and killed whom they would. About that time a certain Baker of Harlem, Jan Mathis did make himself a great prophet among them, this man one day did deliver as a revelation from heaven, that every one should bring together all his books and papers, the Bible only excepted, of all these he made a fair bonfire (HH). His next command was, that every one should bring forth all his money and goods under the pain of death, that all might be common (II): none durst [to dare] be bold to disobey, justice was so quick and severe amongst them. One Truteling a smith for a merry [humorous] word against the prophets was brought forth before the people and shot dead by the Prophet Mathis own hands (KK); after this Mathis pretending a commission from God went out his alone, with confidence to overthrow the whole camp of them who besieged the city, but by the first of the enemy’s soldiers the false prophet was killed (LL).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This great execution upon them together with the diligence of Luther and other Divines to inform their minds did for some time much compesce [to restrain] that evil spirit and so much fright him out of all the bounds of upper Germany, that he did never since that time stir much in these Quarters: but behold his behavior elsewhere. Being rejected of Luther and his Disciples, he went to try Zwingli and his friends: unaware, and upon a sudden great numbers of Anabaptists did arise in Zurich, Bern, Basle, and many other parts of Switzerland: at the beginning they dissembled [lied about] the worst of their tenets [beliefs], they dealt earnestly with Zwingli to gather out of the churches he had reformed new separate congregations: many remonstrances [complaints] did they make to him against the profanity of the common multitude, and for the holiness that ought to be in every church member; they alleged a necessity for the saints to put themselves in new distinct churches (S). The same things did they press upon Oeco­lampadius at Basle, but when these grave men had rejected their motion, and demonstrated the iniquity of their schismatic way: then without more ado having seduced multitudes by their cor­ner and night sermons, they did themselves erect without any permission either of the magistrates or ministers, their separate congregations (T), and for a visible distinguishing character of their way they publicly anabaptized all who did enter into their society (V). For these insolencies the magistrate was offended and put some of them in prison, presently they cried out loud of persecution for conscience (X), and of unjust condemnation be­fore their cause was tried: hereupon many public disputations were instituted, Zwingli and others in Zurich many days from morning till evening did debate with them in presence of the magistrate and all who pleased at great length upon all their tenets; this same did Oecolampadius in Basle, and others in Bern, the arguments and answers with the consent of both sides were written and published, by this means many received satisfaction, many also remained obstinate in their error and became tumul­tuous in their practices, which caused the most of them to be ba­nished out of these States. To this severity the magistrate was forced by the danger of their principles, and their usual wal­king accordingly, where fear kept them not in order: in Chri­stian Commonwealths they counted magistrates unlawful, they took their enthusiasms and revelations for Gods express commandments, and it was one of their prophets ordinary revela­tions to cut off by the sword all magistrates, and whosoever op­posed their way, though father, mother, brother, or dearest friend, yea so powerfully did Satan insinuate himself in their or­dinary raptures, that no man could be secure from their cruelty, as by this example is visible. At Saint gall in Zwitzerland in the year 1526. Feb. 8. Thomas Skyker having spent the whole night with a company of Ana­baptists in their religious exercises, in the morning he was filled with an enthusiasm, and before his father, mother, and whole company, he commanded in the name of God his German bro­ther Leonard Skyker to kneel before him, and having gotten obe­dience thus far, his next prank was before them all to cut off his brother’s head, avowing he had an express warrant from God so to do (Y). Many such private murders and divers public uproars, made the magistrate every where to keep a severe hand over them; yet for all that could be done, they got into their hands the town of Munster; here the wisdom and patience of God permitted them to act to the full, all their speculations. A Story recorded by many, and needful to be remembered to the world’s end, for a memento unto all men to be very wary of an erroneous spirit, though he do appear at the first in the habit of the greatest piety and innocence; the matter was thus: In the year 1533 and 1534 by the labors of Bernard Rotman and some Hessian Preachers, Munster the greatest and strongest town of Westphalia was persuaded to cast out the Popish cor­ruptions; while the work of Reformation was there going on apace, the Anabaptists came in and mixed themselves according to their custom; for this has ever been the way of schismatics, like drones and wasps to fall upon the labors of others; they use not any where to be the instruments of any Reformation or con­version, but when that work by the labor of others is done, then they come in to spoil all, pressing upon a reformed and a con­verted people their fancies (Z). When the Gospel was flourishing in Munster, a certain Tay­lor of Leiden in Holland, one John Becold did come to Town, who at home in his own country, had drunk in all the Anabaptist ra­very [madness]: the man was of a quick and subtle wit, a great dissembler [liar], insinuating himself in the favor of the ministers, he did propone [put forward] at first only by way of scruple his arguments against infant bap­tism (AA): but in the mean time in his secret conventicles over all the city, he did instill the whole mystery of Anabaptism: The chief Minister Rotman did at the beginning preach zealously against that way (BB), but after that one Stapreda, a violent Anabaptist had eropen [?] in to be his colleague, Rotman was gai­ned to that party, and at a public disputation declared himself for them, notwithstanding the other Ministers did confute so clearly the Anabaptists grounds, that the Town Senate remained satisfied, and by that Edict commanded all the Anabaptists to depart the City (CC). But this Statute was so slackly executed, that the most remained still in Town, and did in their night meetings so diligently advance their cause, that a great many more were conquered; upon which strength waxing confident they defied their opposites, and came to a public insurrecti­on (DD). As yet the orthodox were the greater part, but the schisma­tics were the more witty [intelligent] and industrious, they managed so well their smaller strength, that they became not only considerable, but so formidable, that their adversaries were glad to indulge them their liberty and toleration which they had long desired (EE); but behold the issue of that indulgence. They who of a long time had made it their great work to cry down persecution and up toleration, when they had obtained that desire, they did not stand there, but went on every day to add new members to their society, til at last finding the great increase of their strength within the city, they did invite by messengers and letters their associates abroad from all quarters to join with them. These sum­mons made many strangers to slock [to entice] to the town, upon whose appearance without farther delay a public proclamation was issued for all to be rebaptized, or else immediately to depart the city under the pain of death (FF). Many of the best did flee, whose houses and goods were seized, yet many good people were forced to stay, for the Bishop of Munster had then blocked the City, whereby divers of those who offered to get out were killed and spoiled, and the rest were frighted from attempting any escape to the country. The Anabaptists becoming absolute masters of the town, made it their first care to discharge all the former magistrates, and to substitute in their place a new senate of their own fa­ction (GG), over which they did set two consuls, Knipperdolling and Kippenburgh, two of their most forward friends.They seised on the goods of all and killed whom they would. About that time a certain Baker of Harlem, Jan Mathis did make himself a great prophet among them, this man one day did deliver as a revelation from heaven, that every one should bring together all his books and papers, the Bible only excepted, of all these he made a fair bonfire (HH). His next command was, that every one should bring forth all his money and goods under the pain of death, that all might be common (II): none durst [to dare] be bold to disobey, justice was so quick and severe amongst them. One Truteling a smith for a merry [humorous] word against the prophets was brought forth before the people and shot dead by the Prophet Mathis own hands (KK); after this Mathis pretending a commission from God went out his alone, with confidence to overthrow the whole camp of them who besieged the city, but by the first of the enemy’s soldiers the false prophet was killed (LL).”

— Robert Baillie, Anabaptism, The True Fountain of Independency, Brownisme, Antinomy, Familism, and the most of the other Errors Which For The Time Do Trouble the Church of England, Unsealed, (London, 1647), 6–10. NB: For ease of reading and because archaic spelling tend to make older writers seem unintelligent, the s">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+great+execution+upon+them+together+with+the+diligence+of+Luther+and+other+Divines+to+inform+their+minds+did+for+some+time+much+compesce+%5Bto+restrain%5D+that+evil+spirit+and+so+much+fright+him+out+of+all+the+bounds+of+upper+Germany%2C+that+he+did+never+since+that+time+stir+much+in+these+Quarters%3A+but+behold+his+behavior+elsewhere.+Being+rejected+of+Luther+and+his+Disciples%2C+he+went+to+try+Zwingli+and+his+friends%3A+unaware%2C+and+upon+a+sudden+great+numbers+of+Anabaptists+did+arise+in+Zurich%2C+Bern%2C+Basle%2C+and+many+other+parts+of+Switzerland%3A+at+the+beginning+they+dissembled+%5Blied+about%5D+the+worst+of+their+tenets+%5Bbeliefs%5D%2C+they+dealt+earnestly+with+Zwingli+to+gather+out+of+the+churches+he+had+reformed+new+separate+congregations%3A+many+remonstrances+%5Bcomplaints%5D+did+they+make+to+him+against+the+profanity+of+the+common+multitude%2C+and+for+the+holiness+that+ought+to+be+in+every+church+member%3B+they+alleged+a+necessity+for+the+saints+to+put+themselves+in+new+distinct+churches+%28S%29.+The+same+things+did+they+press+upon+Oeco%C2%ADlampadius+at+Basle%2C+but+when+these+grave+men+had+rejected+their+motion%2C+and+demonstrated+the+iniquity+of+their+schismatic+way%3A+then+without+more+ado+having+seduced+multitudes+by+their+cor%C2%ADner+and+night+sermons%2C+they+did+themselves+erect+without+any+permission+either+of+the+magistrates+or+ministers%2C+their+separate+congregations+%28T%29%2C+and+for+a+visible+distinguishing+character+of+their+way+they+publicly+anabaptized+all+who+did+enter+into+their+society+%28V%29.+For+these+insolencies+the+magistrate+was+offended+and+put+some+of+them+in+prison%2C+presently+they+cried+out+loud+of+persecution+for+conscience+%28X%29%2C+and+of+unjust+condemnation+be%C2%ADfore+their+cause+was+tried%3A+hereupon+many+public+disputations+were+instituted%2C+Zwingli+and+others+in+Zurich+many+days+from+morning+till+evening+did+debate+with+them+in+presence+of+the+magistrate+and+all+who+pleased+at+great+length+upon+all+their+tenets%3B+this+same+did+Oecolampadius+in+Basle%2C+and+others+in+Bern%2C+the+arguments+and+answers+with+the+consent+of+both+sides+were+written+and+published%2C+by+this+means+many+received+satisfaction%2C+many+also+remained+obstinate+in+their+error+and+became+tumul%C2%ADtuous+in+their+practices%2C+which+caused+the+most+of+them+to+be+ba%C2%ADnished+out+of+these+States.+To+this+severity+the+magistrate+was+forced+by+the+danger+of+their+principles%2C+and+their+usual+wal%C2%ADking+accordingly%2C+where+fear+kept+them+not+in+order%3A+in+Chri%C2%ADstian+Commonwealths+they+counted+magistrates+unlawful%2C+they+took+their+enthusiasms+and+revelations+for+Gods+express+commandments%2C+and+it+was+one+of+their+prophets+ordinary+revela%C2%ADtions+to+cut+off+by+the+sword+all+magistrates%2C+and+whosoever+op%C2%ADposed+their+way%2C+though+father%2C+mother%2C+brother%2C+or+dearest+friend%2C+yea+so+powerfully+did+Satan+insinuate+himself+in+their+or%C2%ADdinary+raptures%2C+that+no+man+could+be+secure+from+their+cruelty%2C+as+by+this+example+is+visible.+At+Saint+gall+in+Zwitzerland+in+the+year+1526.+Feb.+8.+Thomas+Skyker+having+spent+the+whole+night+with+a+company+of+Ana%C2%ADbaptists+in+their+religious+exercises%2C+in+the+morning+he+was+filled+with+an+enthusiasm%2C+and+before+his+father%2C+mother%2C+and+whole+company%2C+he+commanded+in+the+name+of+God+his+German+bro%C2%ADther+Leonard+Skyker+to+kneel+before+him%2C+and+having+gotten+obe%C2%ADdience+thus+far%2C+his+next+prank+was+before+them+all+to+cut+off+his+brother%E2%80%99s+head%2C+avowing+he+had+an+express+warrant+from+God+so+to+do+%28Y%29.+Many+such+private+murders+and+divers+public+uproars%2C+made+the+magistrate+every+where+to+keep+a+severe+hand+over+them%3B+yet+for+all+that+could+be+done%2C+they+got+into+their+hands+the+town+of+Munster%3B+here+the+wisdom+and+patience+of+God+permitted+them+to+act+to+the+full%2C+all+their+speculations.+A+Story+recorded+by+many%2C+and+needful+to+be+remembered+to+the+world%E2%80%99s+end%2C+for+a+memento+unto+all+men+to+be+very+wary+of+an+erroneous+spirit%2C+though+he+do+appear+at+the+first+in+the+habit+of+the+greatest+piety+and+innocence%3B+the+matter+was+thus%3A+In+the+year+1533+and+1534+by+the+labors+of+Bernard+Rotman+and+some+Hessian+Preachers%2C+Munster+the+greatest+and+strongest+town+of+Westphalia+was+persuaded+to+cast+out+the+Popish+cor%C2%ADruptions%3B+while+the+work+of+Reformation+was+there+going+on+apace%2C+the+Anabaptists+came+in+and+mixed+themselves+according+to+their+custom%3B+for+this+has+ever+been+the+way+of+schismatics%2C+like+drones+and+wasps+to+fall+upon+the+labors+of+others%3B+they+use+not+any+where+to+be+the+instruments+of+any+Reformation+or+con%C2%ADversion%2C+but+when+that+work+by+the+labor+of+others+is+done%2C+then+they+come+in+to+spoil+all%2C+pressing+upon+a+reformed+and+a+con%C2%ADverted+people+their+fancies+%28Z%29.+When+the+Gospel+was+flourishing+in+Munster%2C+a+certain+Tay%C2%ADlor+of+Leiden+in+Holland%2C+one+John+Becold+did+come+to+Town%2C+who+at+home+in+his+own+country%2C+had+drunk+in+all+the+Anabaptist+ra%C2%ADvery+%5Bmadness%5D%3A+the+man+was+of+a+quick+and+subtle+wit%2C+a+great+dissembler+%5Bliar%5D%2C+insinuating+himself+in+the+favor+of+the+ministers%2C+he+did+propone+%5Bput+forward%5D+at+first+only+by+way+of+scruple+his+arguments+against+infant+bap%C2%ADtism+%28AA%29%3A+but+in+the+mean+time+in+his+secret+conventicles+over+all+the+city%2C+he+did+instill+the+whole+mystery+of+Anabaptism%3A+The+chief+Minister+Rotman+did+at+the+beginning+preach+zealously+against+that+way+%28BB%29%2C+but+after+that+one+Stapreda%2C+a+violent+Anabaptist+had+eropen+%5B%3F%5D+in+to+be+his+colleague%2C+Rotman+was+gai%C2%ADned+to+that+party%2C+and+at+a+public+disputation+declared+himself+for+them%2C+notwithstanding+the+other+Ministers+did+confute+so+clearly+the+Anabaptists+grounds%2C+that+the+Town+Senate+remained+satisfied%2C+and+by+that+Edict+commanded+all+the+Anabaptists+to+depart+the+City+%28CC%29.+But+this+Statute+was+so+slackly+executed%2C+that+the+most+remained+still+in+Town%2C+and+did+in+their+night+meetings+so+diligently+advance+their+cause%2C+that+a+great+many+more+were+conquered%3B+upon+which+strength+waxing+confident+they+defied+their+opposites%2C+and+came+to+a+public+insurrecti%C2%ADon+%28DD%29.+As+yet+the+orthodox+were+the+greater+part%2C+but+the+schisma%C2%ADtics+were+the+more+witty+%5Bintelligent%5D+and+industrious%2C+they+managed+so+well+their+smaller+strength%2C+that+they+became+not+only+considerable%2C+but+so+formidable%2C+that+their+adversaries+were+glad+to+indulge+them+their+liberty+and+toleration+which+they+had+long+desired+%28EE%29%3B+but+behold+the+issue+of+that+indulgence.+They+who+of+a+long+time+had+made+it+their+great+work+to+cry+down+persecution+and+up+toleration%2C+when+they+had+obtained+that+desire%2C+they+did+not+stand+there%2C+but+went+on+every+day+to+add+new+members+to+their+society%2C+til+at+last+finding+the+great+increase+of+their+strength+within+the+city%2C+they+did+invite+by+messengers+and+letters+their+associates+abroad+from+all+quarters+to+join+with+them.+These+sum%C2%ADmons+made+many+strangers+to+slock+%5Bto+entice%5D+to+the+town%2C+upon+whose+appearance+without+farther+delay+a+public+proclamation+was+issued+for+all+to+be+rebaptized%2C+or+else+immediately+to+depart+the+city+under+the+pain+of+death+%28FF%29.+Many+of+the+best+did+flee%2C+whose+houses+and+goods+were+seized%2C+yet+many+good+people+were+forced+to+stay%2C+for+the+Bishop+of+Munster+had+then+blocked+the+City%2C+whereby+divers+of+those+who+offered+to+get+out+were+killed+and+spoiled%2C+and+the+rest+were+frighted+from+attempting+any+escape+to+the+country.+The+Anabaptists+becoming+absolute+masters+of+the+town%2C+made+it+their+first+care+to+discharge+all+the+former+magistrates%2C+and+to+substitute+in+their+place+a+new+senate+of+their+own+fa%C2%ADction+%28GG%29%2C+over+which+they+did+set+two+consuls%2C+Knipperdolling+and+Kippenburgh%2C+two+of+their+most+forward+friends.They+seised+on+the+goods+of+all+and+killed+whom+they+would.+About+that+time+a+certain+Baker+of+Harlem%2C+Jan+Mathis+did+make+himself+a+great+prophet+among+them%2C+this+man+one+day+did+deliver+as+a+revelation+from+heaven%2C+that+every+one+should+bring+together+all+his+books+and+papers%2C+the+Bible+only+excepted%2C+of+all+these+he+made+a+fair+bonfire+%28HH%29.+His+next+command+was%2C+that+every+one+should+bring+forth+all+his+money+and+goods+under+the+pain+of+death%2C+that+all+might+be+common+%28II%29%3A+none+durst+%5Bto+dare%5D+be+bold+to+disobey%2C+justice+was+so+quick+and+severe+amongst+them.+One+Truteling+a+smith+for+a+merry+%5Bhumorous%5D+word+against+the+prophets+was+brought+forth+before+the+people+and+shot+dead+by+the+Prophet+Mathis+own+hands+%28KK%29%3B+after+this+Mathis+pretending+a+commission+from+God+went+out+his+alone%2C+with+confidence+to+overthrow+the+whole+camp+of+them+who+besieged+the+city%2C+but+by+the+first+of+the+enemy%E2%80%99s+soldiers+the+false+prophet+was+killed+%28LL%29.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Anabaptism%2C+The+True+Fountain+of+Independency%2C+Brownisme%2C+Antinomy%2C+Familism%2C+and+the+most+of+the+other+Errors+Which+For+The+Time+Do+Trouble+the+Church+of+England%2C+Unsealed%2C+%28London%2C+1647%29%2C+6%E2%80%9310.+NB%3A+For+ease+of+reading+and+because+archaic+spelling+tend+to+make+older+writers+seem+unintelligent%2C+the+s&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb7442c1df2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b7442c1df2.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/05/baillie-versus-tombes-3-how-the- <blockquote><p>When the light of the Gospel from the Lamp of Luther did begin to shine in all the corners of Germany high and low, the aforementioned unhappy men Stock and Müntzer, did begin also to breath out a pestiferous vapor for to overcloud that Golden candlestick. Satan and Antichrist his child got no so powerful assistance against the Spirit of God in Luther from the Emperor Charles, although the far greatest prince who these five hundred years did sway the imperial scepter, nor from all the Bishops of Germany, though the most potent clergy that is or ever has been in Christendom, as from these two obscure and ignorant creatures: for so strong and perverse a Devil did enter into them, as did put them into a very fair way not only to have extingui­shed the candle of Reformation so soon as ever it began to shine, but also to have turned the remainder of light that was in all Christendom into palpable darkness (G). The spirit of Mohammad was no more hellish in setting afoot most gross errors, and countenancing abominable lusts; nor was it any thing so much hellish in making an open trade of bloodshed, robbery, confusion and Catholic oppression through the whole earth, as the spirit of Anabaptism. This great and severe sentence will be made good enough in the following narrative by such abundance of satisfa­ctory testimonies, as may convince the greatest favorers of these men among us. At the beginning the Anabaptists put on the visor of a great deal more then ordinary piety, zeal, and honesty: in prayer and meditation they were very frequent and long, their discourses were only of matters Divine, the errors and superstitions of the time were to them abominations; for life and conversation, they seemed to be composed of all virtue; in their apparel poor and base; in their behavior and speech exceeding humble and grave; for charity towards all in want, singularly liberal (H). The er­rors they had, seemed to be very harmless and innocent; they urged not only a reformation of corruptions, but the building of a church wholly new; they pressed that what ever had been in popery might all be cast away; that new churches might be ga­thered consisting only of saints. Besides the Scripture, they pro­fessed new revelations; they required all their followers to re­nounce their former baptism, and of new to be baptized; they spoke much of patient suffering the crosse, of the unlawfulness to resist injuries, or to punish by the sword any crime; they cried down all wars, yea all magistracy, all judicatories as unjust; they preached much for the liberty of the people, and against the grievous burdens wherewith the great ones did load the backs of the poor commons; they cried up an equality among all the sons of Adam, that none might lord it over his brethren; also that all goods ought to be common among Christians, that none might want, and none be tempted with superfluity. So long as they kept themselves within these bounds, ortho­dox preachers were content to deal with them lovingly by con­ferences and disputations, to keep the sword of the magistrate off them (l), and none was a more diligent solicitor of their indem­nity then Luther with all the princes of his acquaintance (K). But behold the fruits of this indulgence, Stock and Müntzer are encouraged thereby to go on, in the space of three years they did disperse their cockle and tares over all Germany, the people eve­ry where fell in passionate love with their doctrine (L): the masters beholding the unexpected number and zeal of their dis­ciples, without further delay did bring out all their mysteries, and what before they had delivered in corners, and in the night time to handfuls of people apart, being then confident of their strength, they brought it out to the world before the sun, and boldly did begin to put all their speculations in practice. They declared that they were prophets sent by God to teach the world the way to heaven, that after fasting and prayer they were inspired with revelations no less sure then Scripture, which all were to believe and follow under the pain of damnation: that Luther and all the orthodox preachers were false prophets, worse then the Pope and his clergy; that all princes and magi­strates must needs lay down their charges, and become equal with the meanest; that all rich persons behoved to give in their wealth, that all goods might be equally distributed; that the time of the Saints reign upon earth was come; that whosoever refu­sed to enter into their society, to be re-baptized and to become members of their Churches, were without all pity to be killed. That God had revealed all this to them, and much more of this kind; that he had given them a commission to execute presently this his will. Hereupon they did arm and began very nimbly to rob and kill all about them as cursed Canaanites. This leaven did quickly run along many provinces: many thousands, especially of the gentry were massacred and their houses burnt over their heads before they could get themselves in a posture of de­fense. (M) Luther perceiving the horrible and unexpected malignity of that Devil who led this people, began at last to bestirre himself, and to show to the world the abominations of that way which before he had too much neglected; he did then exhort all magistrates and people to defend the gospel, their lives and goods against these wicked hypocrites (N). Incontinent the princes and cities did arm and every where run upon these enraged furies, they recompensed their ways upon their own heads, killing them where ever they could be found. In Suabland, Lor­raine, and Francony, there were in one Summer slain at least 50,000 yeomen (O), and as some authors relate it, a hundred thou­sand (P), yea some report 150,000. (Q), who corrupted with the seditious principles of their false Teachers, made insurrection every where against the magistrate. At that same time Müntzer gathered together 8,000 of the common people in Thuringia, against whom the gracious Princes Johann Frederick Elector Saxony, and Philip of Hesse ddi march: Müntzer persuaded his followers of a most certain victory, assuring that he would inter­cept in his cloak all the bullets of the enemies’ cannon; but when it came to action the vanity of his promises did appear, 5,000 of that misled multitude were killed on the place, the rest fled, Müntzer was taken prisoner, and having confessed his error did suffer death, but in a faithless, faint, and discouraged way (R).</p></blockquote>

and innocent; they urged not only a reformation of corruptions, but the building of a church wholly new; they pressed that what ever had been in popery might all be cast away; that new churches might be ga­thered consisting only of saints. Besides the Scripture, they pro­fessed new revelations; they required all their followers to re­nounce their former baptism, and of new to be baptized; they spoke much of patient suffering the crosse, of the unlawfulness to resist injuries, or to punish by the sword any crime; they cried down all wars, yea all magistracy, all judicatories as unjust; they preached much for the liberty of the people, and against the grievous burdens wherewith the great ones did load the backs of the poor commons; they cried up an equality among all the sons of Adam, that none might lord it over his brethren; also that all goods ought to be common among Christians, that none might want, and none be tempted with superfluity. So long as they kept themselves within these bounds, ortho­dox preachers were content to deal with them lovingly by con­ferences and disputations, to keep the sword of the magistrate off them (l), and none was a more diligent solicitor of their indem­nity then Luther with all the princes of his acquaintance (K). But behold the fruits of this indulgence, Stock and Müntzer are encouraged thereby to go on, in the space of three years they did disperse their cockle and tares over all Germany, the people eve­ry where fell in passionate love with their doctrine (L): the masters beholding the unexpected number and zeal of their dis­ciples, without further delay did bring out all their mysteries, and what before they had delivered in corners, and in the night time to handfuls of people apart, being then confident of their strength, they brought it out to the world before the sun, and boldly did begin to put all their speculations in practice. They declared that they were prophets sent by God to teach the world the way to heaven, that afte <blockquote><p>The late patrons of Anabaptism among us would make the world believe that this Sect had for its Author the famous Berengarius, and for its fomenters four hundred years ago, the old prede­cessors of Protestants, commonly called Albi­genses: but who will be pleased to consult the fountain of this allegation shall find Berengarius absolved from this crime by that very mouth whence alone the slander did proceed. Bishop Guitmund lays on the back of Deacon Beren­garius the load of so many contumelies as he is able to invent, only for his boldness to oppose the common Doctrine of that time, the corporal presence of Christs body in the bread of the Sacrament: among other things he challenges him for the deny­ing baptism to infants, but if any should require a proof this heavy charge, Guitmund professes that none can be given, avow­ing that Berengarius did never bring any such Doctrine in pub­lic, knowing that no Scripture could be alleged for it, and that no creature would take such an absurdity from his hand (A); Ju­stice therefore does require that Berengarius be freed of that crime, since his very adversary confesses that it was never made appear by any known profession; for crimes that appear not are reputed by just men as not existing (M. Tombes, Ex­amin. p. 20, 21). Concerning the Albigenses, the man that lays the slander of Anabaptism upon them is Petrus Cluniacensis, but how unjustly I offer to be considered not only from this general very true and confessed ground, that the Popish Writers of that time do charge these honest and pious men of Albi with many both errors and crimes, whereof all equitable men believe them to have been most innocent; but also from three particular observations: First, they are not challenged by Cluniacensis as direct and express deniers of paedobaptism, but for their affirming the impossibi­lity of infants believing, and of their impossible salvation with­out faith, he alleges upon them by way of consequence, that they did also maintain the Baptism of infants to be unprofitable and null (B). The learned know how much uses to be said against the burdening of men with all the consequents of their tenets, espe­cially when the party rejects them, and the things themselves have no necessary dependence. Secondly, the antecedent where­upon this consequent is builded, we much doubt if ever it came in the thoughts of the Albigenses. That these gracious and ortho­dox men should have been so absurd as to damn absolutely all infants dying in their infancy, which never any of the grossest heretics to this day did affirm; we must be pardoned to deny our belief to ten witnesses of much better faith then the Abbot of Cluny. Thirdly, that which Cassander avows in that same place helps to evidence the slander of Cluniacensis: the Waldenses were the children and immediate successors of the Albigenses, many of their writs yet extant shew how rigid and punctual observers the children were of their Fathers ways: now it is Cassander’s remark verified by the writs and known practice to this day of all the Waldenses that they have been constant paedo­baptists (C). He must therefore be a man of greater authority then any Friar or Monk of these dark times, who shall be able to persuade that their Fathers the Albigenses were against infants baptism. Wherefore notwithstanding of all which is misalleged from Cassander we may safely with all Protestant Writers affirm that the first known Fathers of Anabaptism were Nicholas Stock and Thomas Muntzer, who in the year 1522 began to sow the tares of that sect in Saxony with too great success. Neither Me­lancthon nor Ca­rolostadius did ever favor an­tipaedobaptism. What some allege of Melancthon and Carolostadius their favor towards these men, of Melancthon it is most false as many of his writs declare (D), unless it be understood of his good and extraordinary meek na­ture, whereby he was ever inclined to pity the worst of men so long as there was any hope by loving dealing to do them good. Carolostadius indeed was a rash hot headed man, and at the beginning did give too much countenance to the Anabaptists, albeit not in the point of Antipaedobaptism (E), so far as we can find; but wherein soever he favored these fanatic men, he did quick­ly repent and made his public retractions to the satisfaction of Luther’ss own mind (F). M. Tombs by all his diligence to search for ancient and renow­ned friends to his Clients the Anabaptists, does but raise dust to darken the air about himself: all who will be at the pains to consider these very testimonies which he alleges, shall find that no Divine of good fame did ever join with that sect: for the spirit that did reign therein was so evidently malignant, that a small measure of discretion did ever serve to discover and avoid him.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The late patrons of Anabaptism among us would make the world believe that this Sect had for its Author the famous Berengarius, and for its fomenters four hundred years ago, the old prede­cessors of Protestants, commonly called Albi­genses: but who will be pleased to consult the fountain of this allegation shall find Berengarius absolved from this crime by that very mouth whence alone the slander did proceed. Bishop Guitmund lays on the back of Deacon Beren­garius the load of so many contumelies as he is able to invent, only for his boldness to oppose the common Doctrine of that time, the corporal presence of Christs body in the bread of the Sacrament: among other things he challenges him for the deny­ing baptism to infants, but if any should require a proof this heavy charge, Guitmund professes that none can be given, avow­ing that Berengarius did never bring any such Doctrine in pub­lic, knowing that no Scripture could be alleged for it, and that no creature would take such an absurdity from his hand (A); Ju­stice therefore does require that Berengarius be freed of that crime, since his very adversary confesses that it was never made appear by any known profession; for crimes that appear not are reputed by just men as not existing (M. Tombes, Ex­amin. p. 20, 21). Concerning the Albigenses, the man that lays the slander of Anabaptism upon them is Petrus Cluniacensis, but how unjustly I offer to be considered not only from this general very true and confessed ground, that the Popish Writers of that time do charge these honest and pious men of Albi with many both errors and crimes, whereof all equitable men believe them to have been most innocent; but also from three particular observations: First, they are not challenged by Cluniacensis as direct and express deniers of paedobaptism, but for their affirming the impossibi­lity of infants believing, and of their impossible salvation with­out faith, he alleges upon them by way of consequence, that they did also maintain the Baptism of infants to be unprofitable and null (B). The learned know how much uses to be said against the burdening of men with all the consequents of their tenets, espe­cially when the party rejects them, and the things themselves have no necessary dependence. Secondly, the antecedent where­upon this consequent is builded, we much doubt if ever it came in the thoughts of the Albigenses. That these gracious and ortho­dox men should have been so absurd as to damn absolutely all infants dying in their infancy, which never any of the grossest heretics to this day did affirm; we must be pardoned to deny our belief to ten witnesses of much better faith then the Abbot of Cluny. Thirdly, that which Cassander avows in that same place helps to evidence the slander of Cluniacensis: the Waldenses were the children and immediate successors of the Albigenses, many of their writs yet extant shew how rigid and punctual observers the children were of their Fathers ways: now it is Cassander’s remark verified by the writs and known practice to this day of all the Waldenses that they have been constant paedo­baptists (C). He must therefore be a man of greater authority then any Friar or Monk of these dark times, who shall be able to persuade that their Fathers the Albigenses were against infants baptism. Wherefore notwithstanding of all which is misalleged from Cassander we may safely with all Protestant Writers affirm that the first known Fathers of Anabaptism were Nicholas Stock and Thomas Muntzer, who in the year 1522 began to sow the tares of that sect in Saxony with too great success. Neither Me­lancthon nor Ca­rolostadius did ever favor an­tipaedobaptism. What some allege of Melancthon and Carolostadius their favor towards these men, of Melancthon it is most false as many of his writs declare (D), unless it be understood of his good and extraordinary meek na­ture, whereby he was ever inclined to pity the worst of men so long as there was any hope by loving dealing to do them good. Carolostadius indeed was a rash hot headed man, and at the beginning did give too much countenance to the Anabaptists, albeit not in the point of Antipaedobaptism (E), so far as we can find; but wherein soever he favored these fanatic men, he did quick­ly repent and made his public retractions to the satisfaction of Luther’ss own mind (F). M. Tombs by all his diligence to search for ancient and renow­ned friends to his Clients the Anabaptists, does but raise dust to darken the air about himself: all who will be at the pains to consider these very testimonies which he alleges, shall find that no Divine of good fame did ever join with that sect: for the spirit that did reign therein was so evidently malignant, that a small measure of discretion did ever serve to discover and avoid him.”

— Robert Baillie, Anabaptism, The True Fountain of Independency, Brownisme, Antinomy, Familism, and the most of the other Errors Which For The Time Do Trouble the Church of England, Unsealed, (London, 1647), 2–3. NB: For ease of reading and because archaic spelling tend to make older writers seem unintelligent archaic">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+late+patrons+of+Anabaptism+among+us+would+make+the+world+believe+that+this+Sect+had+for+its+Author+the+famous+Berengarius%2C+and+for+its+fomenters+four+hundred+years+ago%2C+the+old+prede%C2%ADcessors+of+Protestants%2C+commonly+called+Albi%C2%ADgenses%3A+but+who+will+be+pleased+to+consult+the+fountain+of+this+allegation+shall+find+Berengarius+absolved+from+this+crime+by+that+very+mouth+whence+alone+the+slander+did+proceed.+Bishop+Guitmund+lays+on+the+back+of+Deacon+Beren%C2%ADgarius+the+load+of+so+many+contumelies+as+he+is+able+to+invent%2C+only+for+his+boldness+to+oppose+the+common+Doctrine+of+that+time%2C+the+corporal+presence+of+Christs+body+in+the+bread+of+the+Sacrament%3A+among+other+things+he+challenges+him+for+the+deny%C2%ADing+baptism+to+infants%2C+but+if+any+should+require+a+proof+this+heavy+charge%2C+Guitmund+professes+that+none+can+be+given%2C+avow%C2%ADing+that+Berengarius+did+never+bring+any+such+Doctrine+in+pub%C2%ADlic%2C+knowing+that+no+Scripture+could+be+alleged+for+it%2C+and+that+no+creature+would+take+such+an+absurdity+from+his+hand+%28A%29%3B+Ju%C2%ADstice+therefore+does+require+that+Berengarius+be+freed+of+that+crime%2C+since+his+very+adversary+confesses+that+it+was+never+made+appear+by+any+known+profession%3B+for+crimes+that+appear+not+are+reputed+by+just+men+as+not+existing+%28M.+Tombes%2C+Ex%C2%ADamin.+p.+20%2C+21%29.+Concerning+the+Albigenses%2C+the+man+that+lays+the+slander+of+Anabaptism+upon+them+is+Petrus+Cluniacensis%2C+but+how+unjustly+I+offer+to+be+considered+not+only+from+this+general+very+true+and+confessed+ground%2C+that+the+Popish+Writers+of+that+time+do+charge+these+honest+and+pious+men+of+Albi+with+many+both+errors+and+crimes%2C+whereof+all+equitable+men+believe+them+to+have+been+most+innocent%3B+but+also+from+three+particular+observations%3A+First%2C+they+are+not+challenged+by+Cluniacensis+as+direct+and+express+deniers+of+paedobaptism%2C+but+for+their+affirming+the+impossibi%C2%ADlity+of+infants+believing%2C+and+of+their+impossible+salvation+with%C2%ADout+faith%2C+he+alleges+upon+them+by+way+of+consequence%2C+that+they+did+also+maintain+the+Baptism+of+infants+to+be+unprofitable+and+null+%28B%29.+The+learned+know+how+much+uses+to+be+said+against+the+burdening+of+men+with+all+the+consequents+of+their+tenets%2C+espe%C2%ADcially+when+the+party+rejects+them%2C+and+the+things+themselves+have+no+necessary+dependence.+Secondly%2C+the+antecedent+where%C2%ADupon+this+consequent+is+builded%2C+we+much+doubt+if+ever+it+came+in+the+thoughts+of+the+Albigenses.+That+these+gracious+and+ortho%C2%ADdox+men+should+have+been+so+absurd+as+to+damn+absolutely+all+infants+dying+in+their+infancy%2C+which+never+any+of+the+grossest+heretics+to+this+day+did+affirm%3B+we+must+be+pardoned+to+deny+our+belief+to+ten+witnesses+of+much+better+faith+then+the+Abbot+of+Cluny.+Thirdly%2C+that+which+Cassander+avows+in+that+same+place+helps+to+evidence+the+slander+of+Cluniacensis%3A+the+Waldenses+were+the+children+and+immediate+successors+of+the+Albigenses%2C+many+of+their+writs+yet+extant+shew+how+rigid+and+punctual+observers+the+children+were+of+their+Fathers+ways%3A+now+it+is+Cassander%E2%80%99s+remark+verified+by+the+writs+and+known+practice+to+this+day+of+all+the+Waldenses+that+they+have+been+constant+paedo%C2%ADbaptists+%28C%29.+He+must+therefore+be+a+man+of+greater+authority+then+any+Friar+or+Monk+of+these+dark+times%2C+who+shall+be+able+to+persuade+that+their+Fathers+the+Albigenses+were+against+infants+baptism.+Wherefore+notwithstanding+of+all+which+is+misalleged+from+Cassander+we+may+safely+with+all+Protestant+Writers+affirm+that+the+first+known+Fathers+of+Anabaptism+were+Nicholas+Stock+and+Thomas+Muntzer%2C+who+in+the+year+1522+began+to+sow+the+tares+of+that+sect+in+Saxony+with+too+great+success.+Neither+Me%C2%ADlancthon+nor+Ca%C2%ADrolostadius+did+ever+favor+an%C2%ADtipaedobaptism.+What+some+allege+of+Melancthon+and+Carolostadius+their+favor+towards+these+men%2C+of+Melancthon+it+is+most+false+as+many+of+his+writs+declare+%28D%29%2C+unless+it+be+understood+of+his+good+and+extraordinary+meek+na%C2%ADture%2C+whereby+he+was+ever+inclined+to+pity+the+worst+of+men+so+long+as+there+was+any+hope+by+loving+dealing+to+do+them+good.+Carolostadius+indeed+was+a+rash+hot+headed+man%2C+and+at+the+beginning+did+give+too+much+countenance+to+the+Anabaptists%2C+albeit+not+in+the+point+of+Antipaedobaptism+%28E%29%2C+so+far+as+we+can+find%3B+but+wherein+soever+he+favored+these+fanatic+men%2C+he+did+quick%C2%ADly+repent+and+made+his+public+retractions+to+the+satisfaction+of+Luther%E2%80%99ss+own+mind+%28F%29.+M.+Tombs+by+all+his+diligence+to+search+for+ancient+and+renow%C2%ADned+friends+to+his+Clients+the+Anabaptists%2C+does+but+raise+dust+to+darken+the+air+about+himself%3A+all+who+will+be+at+the+pains+to+consider+these+very+testimonies+which+he+alleges%2C+shall+find+that+no+Divine+of+good+fame+did+ever+join+with+that+sect%3A+for+the+spirit+that+did+reign+therein+was+so+evidently+malignant%2C+that+a+small+measure+of+discretion+did+ever+serve+to+discover+and+avoid+him.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Anabaptism%2C+The+True+Fountain+of+Independency%2C+Brownisme%2C+Antinomy%2C+Familism%2C+and+the+most+of+the+other+Errors+Which+For+The+Time+Do+Trouble+the+Church+of+England%2C+Unsealed%2C+%28London%2C+1647%29%2C+2%E2%80%933.+NB%3A+For+ease+of+reading+and+because+archaic+spelling+tend+to+make+older+writers+seem+unintelligent+archaic&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3ff4b5e5eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/3ff4b5e5eb.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/05/baillie-versus-tombes-1-how-the-particular-baptists-appeared-to-early-presbyterians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-80cf1e0a6c" data-kw="">
<blockquote><p>The presbyter is the same as the bishop, and before parties had been raised up in religion by the provocations of Satan, the churches were governed by the Senate of the presbyters. But as each one sought to appropriate to himself those whom he had baptized, instead of leading them to Christ, it was appointed that one of the presbyters, elected by his colleagues, should be set over all the others, and have chief supervision over the general well-being of the community. . . Without doubt it is the duty of the presbyters to bear in mind that by the discipline of the Church they are subordinated to him who has been given them as their head, but it is fitting that the bishops, on their side, do not forget that if they are set over the presbyters, it is the result of tradition, and not by the fact of a particular institution by the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, 1:7</span></figcaption>

<blockquote><p>13 Then Moses said unto God, Behold, when I shall come unto the children of Israel, and shall say unto them, The God of your fathers hath sent me unto you: if they say unto me, What is his Name? what shall I say unto them?. . . What do you learn out of the 13th verse? In the thirteenth verse in the question of Moses two things are to be observed: One, that we be careful to be instructed in all things concerning our calling, thereby to be able to answer all doubts that may be moved. Secondly, that asking any thing concerning God, as of his name or nature, we must aske it of himself, who because now he speaks not but by his ministers, interpreters of the Scriptures, we must have our recourse unto them.</p></blockquote>

<figure class="quote" id="q-8311056f2a" data-kw="">
<blockquote><p>The subordinate public judgment, which is extraordinary, is the judgement of a council, assembled for the more public and effectual establishment and declaration of one or more points of faith and heads of Christian doctrine, and that in opposition to all contrary heresy, or error, which is broached and set a foot in the Church. (M. Ant. De Dom. de Rep. Eccl., bk. 7, ch. 3, n. 32) From which council, no Christian man who is learned in the Scriptures may be excluded, but ought to be admitted to utter his judgement in the same. For in the indagation [investigation] or searching out of a matter of faith, they are not the persons of men which give authority to their sayings, but the reasons and documents which every one brings for his judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies… (1637), Pt. 3, ch. 8 | Digression 3, ‘Of the Judging of Controversies and Questions of Faith’</cite>, p. 176-7</span></figcaption>

<blockquote><p>2. A representative Church may be thought a number sent by a community and elected to give laws absolutely tying, as if believers should say, ‘We resign our faith and conscience to you, to hold good whatever you determine without repeal or trial;’ that is blind faith; that we disclaim: all our rulers’ acts in our assemblies do bind, 1. conditionally, if they be lawful and convenient, 2. matters to be enacted are first to be referred to the congregations and elderships of particular congregations before they be enacted.</p></blockquote>

<blockquote><p>…his [John Robinson’s] answer is that no parish assemblies [under patrons and bishops] have power of right to choose their ministers. Whereas on the contrary it is most evident that every congregation of Christians has right unto this thing from Christ Himself so inseparably annexed unto it that no external oppression by others or abuse of their own can possibly deprive them of this right, so long as they remain a Christian assembly or congregation. Suppose they be in external bondage, and that in some sense spiritual, yet no matter of fact can take away right, while they abide such as Christ has given that right unto. The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed. Even so stands the matter betwixt minister and people in England, they agreeing or contracting betwixt themselves have right one in other: but external legal power or liberty they must receive from others. Another example also I would have considered: the emperor sometime was so subiect unto the pope that he had not liberty of emperial rule until he received his crown from Rome: yet was the emperor then no proper part of the papacy, nor did he take his right from the pope, neither did those that submitted unto him therein communicate with the pope’s authority. So is this in hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr. [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615)</cite>, pp. 12-13</span></figcaption>

<blockquote><p>That the people’s approbation of a king is not necessary, is the saying of Beilarmine and the papists, and that the people choose their ministers in the apostolic church, not by a necessity of a divine commandment, but to conciliate love betwixt pastor and people.</p></blockquote>

<blockquote><p>…an after-acceptance and liking of the minister whom they did at first so unwillingly admit is a manifest confirmation of their minister. For as Jacob, by accepting of Leah the second night, which was thrust upon him the first night, thereby made her his lawful wife that he could not after reject her. So likwise the lawful acceptance of a lawful and able minister makes his ministry lawful, as if his election full which was not so at the first.</p></blockquote>

</figure><figure class="quote" id="q-df82c2191e" data-kw="">
<blockquote><p>This liberty of election is in part prejudged and hindered by patronages and presentations which are still in use there [in Scotland], not by the rules of their discipline, but by toleration of that which they cannot amend, in the mean time procuring, that in the case of presentations by patrons, the examination and trial by the Presbytery, is still the same. The congregation, where he who is presented is to serve, is called, if they have ought to object against his doctrine or life, after they have heard him, or that their consent may be had. And if he be found Reus ambitus, or to have gone about to procure a presentation, he is repelled and declared incapable of that place. No pastor may thrust himself upon a flock, nor after his entry, desert his charge, or remove himself to another congregation at his own pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government &amp; Order of the Church of Scotland (Edinburgh: Bryson, 1641), II. Of their Calling</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“This liberty of election is in part prejudged and hindered by patronages and presentations which are still in use there [in Scotland], not by the rules of their discipline, but by toleration of that which they cannot amend, in the mean time procuring, that in the case of presentations by patrons, the examination and trial by the Presbytery, is still the same. The congregation, where he who is presented is to serve, is called, if they have ought to object against his doctrine or life, after they have heard him, or that their consent may be had. And if he be found Reus ambitus, or to have gone about to procure a presentation, he is repelled and declared incapable of that place. No pastor may thrust himself upon a flock, nor after his entry, desert his charge, or remove himself to another congregation at his own pleasure.”

</figure><figure class="quote" id="q-94c6016077" data-kw="">
<blockquote><p>In England it [civilly] belongs: 1. to the patron to present; 2. to the bishop to ordain and institute, and therefore to approve and invest; 3. to the people jure divino to be free consenters; 4. and to the magistrate to protect and to judge who shall be protected or tolerated under him. If now these four parties be for four ministers or for three, or two several men, and cannot agree in one, the culpable dissenters will be the causes of the schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-2d68b0f711" data-kw="">
<blockquote><p>Here it must be noted that Church history has constrained all that understand it to confess (both Papists, Greeks and Protestants) that: [1.] The ordination of bishops and presbyters was in the power of the bishops, and the election in the power of the people, not only the first 300 years under heathen emperors, but for many hundred years after under Christian emperors and princes. 2. That this was taken for their right given them by God. To cite more proofs, for this would expose us to the reader’s censure as unnecessary tediousness: Many Papists largely prove it, as does David Blondel beyond exception, De jure plebis in regimine Ecclesiastico, with more. 3. That yet we here plead not for the necessity of so much as the people’s election as it signifies the first nomination of the person, but only for the necessity of consent, either explicitly or implicitly expressed. If the senior pastors have the first nomination, or, if it be the magistrate, or patrons, as with us, we quarrel not against it if the flock do but consent. Parents may choose husbands and wives for their children; but they are not such at all till mutual consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6</cite>, pp. 80-81</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

tianism/patronage#:~:text=Here%20it%20must%20be%20noted%20that,such%20at%20all%20till%20mutual%20consent&amp;text=Here%20it%20must%20be%20noted%20that%20Church%20history&amp;text=are%20not%20such%20at%20all%20till%20mutual%20consent" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-17d7cab950" data-kw="">
<blockquote><p>Our English [partially conforming] authors below will make the case for, under necessity, material cooperation with bishops, taking the oath of canonical obedience and yielding to civil patrons in the presentation of ministers to congregations (or patronage). Note that conferring with a bishop and getting the consent and recognition of a civil officer to one’s ministry¹ are not inherently sinful actions. To give further perspective to this, and what is to come, it will be proven in the next section that Church government (albeit of divine law) is not moral law, but is secondary. ¹ Note that having the recognition and approval of the civil government, though it ought to be secondary and consequential rather than primary and immediate, is involved in the Biblical doctrine of circa sacra and of itself is a good thing. On the proper order see Fentiman, Circa Sacra, pp. 49–51. [The book written by Scottish indulged ministers, associated with John] Bairdie poses the question: “Whether it be altogether heterogeneous and incompetent, as well as it may be inconvenient, for the ruler to make civil laws and constitutions about the circumstances, order, and exercise of matters of religion, without the previous cognizance and pre-determination of the Church thereupon, and that even in the most broken and ruined state of the Church when there is no governing-Church existent that can be owned.” Balm from Gilead, pp. 76–77. The answer, at least in the abstract, must be that such an exercise of civil power, however inconvenient and defective in some cases, is not always incompetent and invalid in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction”, “Imposed Erastianism &amp; Episcopacy” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 106</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-38aad02d50" data-kw="">
<blockquote><p>Neither, in this same point of elections, do we homologate [agree] with them [Independents, Anabaptists and Separatists] who give to the collective body of the church (women and children under age only excepted) the power of decisive vote and suffrage in elections, we give the vote only to the eldership or church representative, so that they carry along with them the consent of the major or better part of the congregation… out of Thomas [Aquinas] this difference betwixt consent and election, that though every choosing be a consenting, yet every consenting is not a choosing. [1] The liberty of consent is one thing; [2] counsel or deliberation another thing; [3] the power of a decisive voice in court or judicatory a third thing. I speak of a constituted church (for where there is not yet an eldership there can be no such distinction; yet, however, be there an eldership, or be there none, the church’s consent must be had). The first of these [consent] we ascribe to the whole church, without whose knowledge and consent ministers may not be intruded; the second [counsel &amp; deliberation] to the ablest and wisest men of the congregation, especially to magistrates, with whose special advice, privity and deliberation, the matter ought to be managed; the third [a decisive voice in court], which is the formal and consistorial determination of the case of election, consists in the votes of the eldership. Their way [Independents, etc.] is much different than this, who would have the matter prepared by the conference and deliberation of the eldership (as we used to do in committees),¹ but determined and decided by the votes of the whole congregation. [¹There was a change in the Church of Scotland’s practice on this, probably due to a response to the Independents. See Thomas M’Crie (the younger), p. 232 of The Story of the Scottish Church. See especially the 2nd paragraph of the footnote. The context, from p. 228, is the discussion of patronage.] … I conclude with a passage out of the Ecclesiastical Discipline of the Reformed Churches in France, ch. 1, ‘The silence of the people, none contradicting, shall be taken for an express consent…</p></blockquote>

<blockquote><p>1. It is of absolute necessity that every man consent before another man can do the work of a pastor for his soul: And God in nature and Scripture has ordained that he who must be saved or damned according to the minister’s success, should be the chooser or refuser of that which so unspeakably concerns him and not have his salvation more in another’s power than his own, if he be at age and in his wits. 2. And yet this may be run into extremes; and these are not easily avoided: 1. Infants (that is, all short of an understanding, choosing age) and idiots and madmen, are half-brutes in act, and to be governed accordingly by force, so far as they are incapable of reason. But these are not capable of the Church-communion of the adult. Yea, not only children, but all [civil] subjects who are not communicants, may be forced to hear and learn [Christianity] as catechumens, as is said: And they must not pretend a power to choose their teachers, to excuse them from all learning: But if they say that they can learn better of another than the parish-minister; if they are able, they may remove to another parish: If not, they must give proof that they live as learners under some teacher who is capable to instruct them, approved or tolerated by authority, where rulers own the Truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts... (1684), Unnecessary Separating Disowned</cite>, pp. 4-5</span></figcaption>

<blockquote><p>Last of all, we are to distinguish between the condition of the primitive churches, before the division of parishes, and the state of our churches now after such division. At the first, when the multitude of Christians in those great cities of Rome, Corinth, Ephesus, etc. was not divided into several parishes, the common presbytery in the city did suffice for the government of the whole [as described in the N.T.], and there was no need of a particular consistory [session] of elders for every assembly and congregation of Christians within the city, except perhaps to admonish, rebuke or exhort, or to take notice of such things as were to be brought into the common presbytery. But after that parishes were divided, and Christian congregations planted in the rural villages, as well as in the cities, from henceforth it was necessary that every congregation should have at hand, within itself, a certain consistory, for some acts of church government, though still those of greater importance were reserved to the greater presbytery… If it be said that I seem to deny the divine right of the same, or that they have any warrant from the pattern of the apostolic Church, I answer: I acknowledge the conformity of the same with the pattern thus far: 1. It is to be suposed that in some small cities (especially the same not being wholly converted to the Christian faith) there was but one Christian congregation, the eldership whereof did manage matters of jurisdiction proper thereto. 2. Even in the great cities, at the first there was but one congregation of Christians, and so but one particular eldership. 3. After that the Gospel had spread, and Christians were multiplied in those great cities, it is true, they were all governed by a common presbytery, but that presbytery was not remote, but ready at hand among themselves. Now in this we keep ourselves as close to the pattern, as the alteration of the Church’s condition by the division of parishes will suffer us, that is to say, we have a common presbytery for governing the congregations within a convenient circuit, but withal our congregations have, ad manum, among themselves, an inferior eldership for lesser acts of government; though in respect of the distance of the seat of the common presbytery from sundry of our parishes, they cannot have that ease and benefit of neareness which the apostolic Churches had, yet by the particular elderships they have as great ease of this kind as conveniently can be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland... (Edinburgh: 1641), pt. 2</cite>, ch. 2, 128-30</span></figcaption>

<blockquote><p>§63. As for the Common Prayer itself, I never rejected it because it was a form, nor thought it simply unlawful because it was such a form, but have made use of it and would do again in the like case. But I must needs say: 1. That the shredding it into such abundance of small parcels seems to me very inconvenient. It seems too light and ludicrous to toss sentences so formally between the priest and clerk, and to make such a multitude of prayers consisting but of a sentence, or two at most: And it seems to be tautology and vain repetition to repeat over the same word so oft: and a taking of God’s name in vain, or too unreverently, to begin with his titles and attributes, and end with his name again, and the merits or sake of Christ, and this at almost every sentence: as if we had done with Him and were taking our leave, and had forgot somewhat that called us to begin again: and thus we begin and end, and begin and end again, it may be twenty times together. 2. But the enforcing imposition of these prayers is most to be condemned, of which I have spoken in the former disputation. But for my part, I censure none that use them, nor take them to be therefore men of another religion or worship: It is but a modal difference in the same worship.</p></blockquote>

<blockquote><p>8. The non-necessaries, or such things as need not be in the worship of God, which do bring scandal, must 1. be such as are neither necessary in specie, nor in individuo, in kind, or in specie or nature, or in their individuals and particulars, as the whole category of men’s devices, as: 1. Unwritten traditions—not necessary, not written. 2. Human mystical, symbolical signs and ceremonies—not necessary, not written. 3. Human holy days, crossing, kneeling to elements, altars, crossing, surplice, rochets, etc.—not necessary, not written. 4. This and this human holy day, this crossing—not necessary, not written.</p></blockquote>

<blockquote><p>28. We have, therefore, a most excellent and sure mark to distinguish… the legitimate observances of the Church, if we remember that one of two things, or both together, are always intended, viz., that in the sacred assembly of the faithful, all things may be done decently, and with becoming dignity, and that human society may be maintained. In order by certain bonds, as It were, of moderation and humanity… since nothing here is sought but the maintenance of charity by a common office… 30. …the whole sum of righteousness, and all the parts of divine worship, and everything necessary to salvation, the Lord has faithfully comprehended, and clearly unfolded, in his sacred oracles, so that in them He alone is the only Master to be heard. But as in external discipline and ceremonies [he used as an example bowing in prayer], he has not been pleased to prescribe every particular that we ought to observe, (he foresaw that this depended on the nature of the times, and that one form would not suit all ages, in them we must have recourse to the general rules which he has given, employing them to test whatever the necessity of the Church may require to be enjoined for order and decency. Lastly, as he has not delivered any express command, because things of this nature are not necessary to salvation, and, for the edification of the Church, should be accommodated to the varying circumstances of each age and nation, it will be proper, as the interest of the Church may require, to change and abrogate the old, as well as to introduce new forms. I confess, indeed, that we are not to innovate rashly or incessantly, or for trivial causes. Charity is the best judge of what tends to hurt or to edify: if we allow her to be guide, all things will be safe. 31. Things which have been appointed according to this rule, it is the duty of the Christian people to observe with a free conscience indeed, and without superstition, but also with a pious and ready inclination to obey…</p></blockquote>

</figure><figure class="quote" id="q-bf95d426e2" data-kw="">
<blockquote><p>In making laws, ministers are only heralds and envoys, who promulgate the laws of the prince and enunciate the commands of God, addressing believers in his name; but in constitutions they are directors of external worship in matters pertaining to good order (eutaxian) because although God has prescribed in general that all things should be done decently and in order, still He has sanctioned nothing in particular, but left it to the prudence of pastors, who are able to dispose of them as they see is conducive to edification. For so great is the variety in minds, so great the conflict between judgments and dispositions, that unless they are bound by certain laws as by chains and bits, they would easily disagree with each other and the unity of the church be dissolved. Since about things of this kind there was no special precept, since they are innumerable and mutable depending upon circumstances of times, places and persons, God wishes the rulers of the church to consult for its peace, edification and decorum by determining those things which seem best adapted to the habits of the people and with regard for times and places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3, pp. 285-293</cite>, p. 286</span></figcaption>

<blockquote><p>…if the laws of the Church obliged the conscience in such a [absolute] manner, as that the transgression of them were a sin, the observance of them would then be a good action… …the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men… …ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>

on of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.”

<blockquote><p>18. First there ought to be a greater difference placed between the doctrine of salvation required in the church and those things which they establish only to keep civil order. For doctrine, we also comprehend under this light the sacraments, which teach the conscience and do not depend on man who is bound to maintain it under the pain of damnation without changing, adding to or diminishing anything (in no such way, as we have declared before). But the canonical ordinances concerning the manner of proceeding are all exterior and outward according to the circumstances of places, times and persons, by reason of which they can neither be perpetual nor universal without exception. For such order and fashion may be held in one place which cannot be used in another place. Such a thing also is good in one place or at one time which would be unprofitable or harmful at another. And for this reason, there is often contradiction among the canons, as it is necessary to have with respect to those things which are expedient. Since such ordinances are mutable and made by man, it follows that they do not concern the conscience, especially in cases of slander and disorder–a prohibition of the purpose for which they were established, i.e., the edification and peace of the Church. For example, it was agreed by the council of Jerusalem… that the gentiles should abstain from eating the sacrifice of idols, from blood and beasts that are suffocated or strangled. I say that this is an ordinance distinct from the one before [fornication] (which pertains not to conscience nor to salvation simply, but only to the external and outward life), to attain an end more excellent and perfect, i.e., that the doctrine of salvation may take place among the Jews (Acts 15:19-21). For if it had been otherwise, apostles would have contradicted themselves. In the beginning, they agreed upon this–that grace alone justified by faith without the works of the Law (Acts 15:9-11); and also they would have contradicted the doctrine of Jesus Christ, who witnessed and said that what enters into the mouth does not defile a man; and St. Paul, who was in this council, would have been contrary to himself (Rom. 14:17; 1 Cor. 8:8; Col. 2:16-23; Titus 1:14-15). For shortly afterwards, he wrote that the kingdom of God was not in meat nor drink, and that one might eat of all things without creating any difficulty for conscience sake. Such prohibitions are devilish doctrines (1 Tim. 4:1-3), except when they are used for the liberty of the edification of neighbors. For avoiding slander (Rom. 14:13-19; 1 Cor. 10:23-4), let those then who will not understand this difference declare to us why they have abolished the apostolic ordinance; or whether they have greater power than the apostles; or else whether they will give place to the truth of God and study with us what may serve to the glory of God, instead of serving their own ambition and avarice in falsely abusing the title and authority of the church (Col. 2:8). 19. The second point: since such ordinances and statutes are made to increase the doctrine of the gospel, let them be established and set up in such a way that there is no abuse or any kind of superstition… 20. The third point: since men are so prompt and ready to love their own inventions and to turn the true religion into superstition; and also the times of the shadows of the Law are passed, and that God now ill be served in Spirit and truth and not in outward ceremonies (Jn. 4:23; Gal. 2:4; 5:1; and the whole epistle of the Hebrews); therefore, above all things, special regard must be taken that nothing be brought into the church except what is profitable and especially appropriate and necessary… But certainly the purest simplicity is the best, and the more Jesus Christ is plainly and simply declared, the more it is agreeable to His Word…</p></blockquote>

<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.”

— William Perkins, A Reformed Catholike: or, A Declaration showing how near we may come to the present Church of Rome in sundry points of religion: and wherein we must forever depart from them… ([Cambridge,] 1598), 7th Point, ‘Of Traditions’, pp. 136-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConclusion+3.+We+hold+that+the+Church+of+God+has+power+to+prescribe+ordinances+rules%2C+or+traditions%2C+touching+time+and+place+of+God%E2%80%99s+worship%2C+and+touching+order+and+comeliness+to+be+used+in+the+same%3A+and+in+this+regard%2C+Paul%2C+1+Cor.+11%3A2%2C+commends+the+Church+of+Corinth+for+keeping+his+traditions%2C+and+Acts+15%2C+the+Council+at+Jerusalem+decreed+that+the+Churches+of+the+Gentiles+should+abstain+from+blood+and+from+things+strangled.+This+decree+is+termed+a+tradition%2C+and+it+was+in+force+among+them+so+long+as+the+offence+of+the+Jews+remained.+And+this+kind+of+traditions%2C+whether+made+by+general+councils+or+particular+synods%2C+we+have+care+to+maintain+and+observe%3B+these+caveats+being+remembered%3A+First%2C+that+they+prescribe+nothing+childish+or+absurd+to+be+done%3A+Secondly%2C+that+they+be+not+imposed+as+any+parts+of+God%E2%80%99s+worship%3A+Thirdly%2C+that+they+be+severed+from+superstition+or+opinion+of+merit%3A+Lastly%2C+that+the+Church+of+God+be+not+burdened+with+the+multitude+of+them.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholike%3A+or%2C+A+Declaration+showing+how+near+we+may+come+to+the+present+Church+of+Rome+in+sundry+points+of+religion%3A+and+wherein+we+must+forever+depart+from+them%E2%80%A6+%28%5BCambridge%2C%5D+1598%29%2C+7th+Point%2C+%E2%80%98Of+Traditions%E2%80%99%2C+pp.+136-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88821cf794.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/88821cf794.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-ordinances/#:~:text=Conclusion%203.%20We%20hold%20that%20the,burdened%20with%20the%20multitude%20of%20them&amp;text=Conclusion%203.%20We%20hold%20that%20the%20Church%20of&amp;text=be%20not%20burdened%20with%20the%20multitude%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…he [Paul] speaks of many special positive precepts and rules of policy, as of poor widows, the alms to be given to them; the not rebuking of an elder, the office of elders governing, and of elders laboring in the Word and doctrine, the not receiving an accusation against an elder, but under two or three witnesses, the public rebuking of those who offend publicly, the not admitting to the ministry raw and green soldiers not tried, and many other particulars of policy, of all which he says gravely, [1 Tim. 5] v. 21, ‘I charge thee before God and the Lord Jesus Christ, and the elect angels, that thou observe these things, etc.’ Certainly, [in Greek] these things were not one commandment, but all the precepts of faith and of Church-Government spoken of in this epistle; and truly I shall think that Paul who particularizes that Timothy should not drink water, but a little wine because of his infirmity, and of bringing with him the cloak that he left at Troas, and the parchments, 2 Tim. 4, does far more specify all the positives of policy and writ how all the Timothies and pastors are to behave themselves in the Church of God… … …for other positive things of policy that should be of perpetual use, and not all of the same kind, and of equal necessity…</p></blockquote>

</figure><figure class="quote" id="q-f03e333876" data-kw="">
<blockquote><p>Objection: But we are bound by the canons of the Church which are still in force. Answer: 1. Scripture is the Church’s sufficient rule, and the perfect Law of God. 2. Those things that Scripture has left to occasional determination, no councils must make standing laws for to bind at all times. For if such laws had been fit, God would have made them. 3. It is the present guides of the Church that are upon the place, and see the occasions, that must determine such circumstantials as are of mutable determination. And former Church-governors can no more take away the power of the present, than they can deprive them of their office; it being essential to the office of every pastor to be a guide or ruler of his flock. 4. If you think that all Church canons (yea though it be General Councils) bind, then you are bound to contradictories: for one Council has oft crossed another. And Papists themselves disclaim many things enjoined by canons. The 16th canon of the 4th Council of Carthage requires ministers not to read the books of heathens: Does this bind now? Many the like might be mentioned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite>, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>XX. Although the authority of these constitutions is great in the church, we deny that it is absolute, but limited; or that it is equal with the divine laws; or that it is as great a sin to transgress the former as the latter. We deny that they can change the nature of things, so that what are in themselves indifferent can be made necessary and of perpetual right; or that any part of Christian righteousness is in them, much less any merit with God; or that they can extend themselves beyond ecclesiastical polity or good order (eutaxian), which by themselves are not of piety, but only on account of another thing and by accident. Again, we say that they are not to be measured by themselves, but by divine laws, that they may not in anyway obstruct, but may rather subserve the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</cite></span></figcaption>

<blockquote><p>This I do infinitely grieve at, that many most wholesome precepts of divine Scripture are little regarded, and in the meantime all is so full of many presumption, that he is more grievously found fault with who during this octaves touches the earth with his naked foot than he that shall bury his soul in drunkenness. And after, I cannot approve them, and I think they are to be cut off wheresoever we have power. Many of these things, for fear of scandalizing many holy persons, or provoking those that are turbulent, I dare not freely disallow.</p></blockquote>

<blockquote><p>The ministry is for edification and not for destruction… God has told us that no positive duty is a duty at all times… He gives us all a charge to learn what this means, ‘I will have mercy and not sacrifice,’ which must needs import: I prefer mercy before sacrifice and would have no sacrifice which hinders mercy… as that according to God’s ordinary way of working, it were like to do more hurt than good; it were no duty at that time. Discipline is an ordinance of Christ: But if sound reason tell me that if I publicly call this man to repentance, or excommunicate him, it is like to do much hurt to the church and no good to him, it would be at that time no duty but a sin. As physic [medicine] must be forborne where the disease will but be exasperated by it. Therefore Christ bounds our very preaching and reproof with a ‘Shake off the dust off your feet as a testimony against them.’ And give not that which is holy to dogs, etc. when treading under foot and turning again and rending us, is likest to be the success, the wisdom of Christ and not that of the flesh only requires us to take it for no duty. This is to be observed by them that think that admonitions and excommunications, and exclusion from the sacrament must be used in all places and at all times alike, without respect to the end, come of it what will: Or that will tempt God by presuming that He will certainly either bless or at least justify their unseasonable and imprudent actions as if they were a duty at all times. To be either against the Scripture or against the end is a certain proof that an action is no duty, because no means.</p></blockquote>

<blockquote><p>Question. And if it be questioned how can any truth be kept [back], or any duty forborne? Should not all sin be reproved and can we be truthful to God and the people and not reprove sin or in forbearing any necessary duty, suppose it be to censure and maintaining authority of adjudications? Answer. The question is not wither duty should be forborne or if all sin should be reproved, but of the right means how to get such a sin taken with and how to get such duty done rightly. [2.] The speaking of all truth and doing of all duty is not a duty simply lying on ministers at all times, for that which may not edify is not a duty. Besides that, all ministers know not all truth; therefore speaking of truth and doing of duty must be so gone about as they preach such and such a particular truth, to convince of this or that sin, or bring to the doing of such a duty, principally to edify the body of Christ, [and for] the saving of people’s souls. And if the forbearing of such a truth or the not pressing such a duty for a time gain the soul sooner, is he not bound to make his practice subservient to that end? To clear it in a similitude: a man gets a commission to take in a strong city, but he is not obliged to take it in at such a strong port that is strongly fortified and at no other, but he is left to skill how to go about it or where to assault it. Will not wisdom say it were better to go to a part that is weaker or a part where either is more easy access and entry to be had, his commission being principally to take in the town and not that port now? A minister’s work is to cast out Satan, and all lusts out of the soul, and to bring every thought in subjection to Christ, and whither is it wisdom to batter at one door of the soul that is strongly fortified against such a truth, or to look to win in by another that is less controverted, wisdom would say it is best to labor to win in on the soul by a truth that is less controverted and then it is far more easy to win that sort the sinner, keeps and gains the city. This was the way Paul took, and directs ministers to use this holy wisdom and prudence, not stinting them to one gate [way] of pressing to duty or proponing [setting forth] truths, or convincing of sin, but leaving room to them to follow that way which may most edify, and to choose matter and method of proceeding as may be most subservient to that end. For when folks are confirmed in a thing and have a prejudice at that [which] may be spoken against it, it is a double work to a minister to set on a sin that is both in the affection and judgment. It is far better going in at another port than were the prejudice is fixed. Hence Paul leaves controverted questions of the law and is less preaching down those, but is more in positive truths and sins unquestioned, [and on] principles acknowledged by those he dealt with, and with idolaters and superstitious Samaritans beginning with preaching Christ, and not first falling on their idols, which might mar the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 921-2 of 7. ‘A Sermon on Ephesians 4:11-12’ in Collected Sermons of James Durham…, vol. 1 (Naphtali &amp; RHB, 2017)</cite></span></figcaption>

ich%20might%20mar%20the%20other" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And as touching things of prudence, they are things properly mixed [partly moral and partly positive], as at what hour sermon shall begin in such a church, at eight, or nine or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; for to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12. Not to imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>

<blockquote><p>Again I conceive that there be two sort of positives in the externals of [Church] government or worship: 1. Some divine, as that there be in the public worship, prayers, praising, preaching, sacraments, and these are substantials; that there be such officers, pastors, teachers, elders and deacons; that there be such censures, as rebuking, excommunication and the like, are morally divine, or divinely moral: and when the Church forms a directory for worship and government, the directory itself is in the form not simply divine…. 2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal; in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture as was the [Anglican] Service-Book [which was sought to be imposed on Scotland in 1637]; and the pastor or people in these are not properly moral agents [working things in themselves moral or religious], nor do we press that Scripture should regulate men in these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Intro | Section 5</cite>, pp. 80-81</span></figcaption>

<blockquote><p>27. But ordinances about such circumstances as place, time and the like are rightly said by the best authorities to be partly divine and partly human. They are grounded in part upon the will of God because of their chief and primary purpose, and partly upon man’s prudence, insofar as a special observation agreeable to God’s will is concerned. If no human error is made in this matter, the ordinance is to be held as wholly divine. It is the will of God that the church meet at the most convenient hour of the day, all circumstances considered. If, therefore, no error occurs in estimating the circumstances, the hour assigned for meeting after due consideration must be acknowledged as if appointed by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology tr. John D. Eusden (1623; Baker, 1997), bk. 2, in ch. 14, ‘The Manner of Divine Worship’, section 27</cite>, p. 286</span></figcaption>

<blockquote><p>And here also we consider things circumstantial, as time, place, etc. And circumstances are either merely physical [which are not regulated], or 2. merely moral [which are regulated], or 3. mixed, partly moral, partly physical [which are partly regulated]… … 3. There be some mixed circumstances [of worship], as these same physical circumstances, clothed with their own seasonable conveniences; so time for worship, and due and convenient time is required, there may be some scandalous and superstitious time for worship… a place is required for private worship, and a fit place, such as is not the market-street for private praying; the inconveniency of the circumstance may vitiate the worship.</p></blockquote>

<blockquote><p>…therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God… And as touching things of prudence, they are things properly mixed, as at what hour sermon shall begin in such a church, at eight, or nine, or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; For to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12, not to [the] imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>

<blockquote><p>III. (2) We must distinguish between simple precepts (i.e., merely moral) belonging to natural right and mixed precepts (moral and ceremonial, partly of natural and partly of positive right; as the fourth commandment concerning the Sabbath, which is moral as to the genus of public worship, but ceremonial as to the circumstance of the defined time; and the fifth, which is moral as to the prescribed duty and the promise of longevity, but ceremonial as to the appended promise of the land of Canaan).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes | vol. 2, 11th Topic, The Law of God, 2nd Question, The Nature of the Moral Law, section 3</cite>, p. 8</span></figcaption>

</figure><figure class="quote" id="q-e09ed042bc" data-kw="">
<blockquote><p>III. …acts of divine worship are twofold, some which do not differ from the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded of God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the church has no control or power over them; the latter God has thus far left to the will of the church as means and indifferent, so that a regard be always paid to divine truth., Christian simplicity and public edification. … XIX. The object of this directive power is not the doctrine itself of faith and worship (which rests upon the Word of God alone), but other things concerning which the express Word of God is not given, which are either merely indifferent and free or ambiguous and doubtful, concerning which God has delivered nothing certain in particular, such as was the case about which the apostle speaks in 1 Cor. 7:10,12, or which refer to the mode of external worship, or the determination of the circumstances, without which the precepts of the first table and the public exercises of piety in ecclesiastical assemblies scarcely and not even scarcely can be rightly observed and performed. Here pertain the time, place, form and rule of prayers, addresses, of the administration of the sacraments, fasts, alms-giving: all of which ought to be established and exercised not with confusion, but rightly and decently (euschemonos) for the edification of the church. Since these in themselves are indifferent and do not directly touch the mystery of our salvation, they do not of themselves bind the conscience, nor yet are they so fixed and immovable that they may not be reformed and changed where the use of the church shall demand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes | vol. 3, pp. 286 &amp; 290 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’</cite></span></figcaption>

ine%20worship%20are%20twofold%2C%20some%20which&amp;text=where%20the%20use%20of%20the%20church%20shall%20demand" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7071370bd4" data-kw="">
<blockquote><p>As regards eutaxia [good-order] in matters naturally outward and indifferent she [the Church] sets up those she thinks most likely to further edification, not in order that, as is the vicious way in the Papacy, they may become an essential part of divine worship, the norm of which is to be sought in God’s Word alone; but in order that they may be its supports and instruments suited to persons, times and places, as things concerned solely with the determination of outward circumstances, which may be altered in various ways to meet the exigencies of public edification.</p></blockquote>

<blockquote><p>With this view agrees Calvin. (See Institutes, Bk. 4, ch. 10, pp. 28-31.) The notion of Calvin and our Confession is briefly this: In public worship, indeed in all commanded external actions, there are two elements, a fixed and a variable. The fixed element, involving the essence or the thing, is beyond the discretion of the church. The variable, involving only the ” circumstances” of the action, its separable accidents, may be changed, modified or altered, according to the exigencies of the case. The rules of social intercourse and of grave assemblies in different countries vary. The church accommodates her arrangements so as not to revolt the public sense of propriety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on Ecclesiology (Richmond, 1892), Ch. 12, ‘The Nature &amp; Extent of Church Power’</cite>, p. 118</span></figcaption>

<blockquote><p>‘Ye shall not do’ (says Moses) ‘after all things, which we do here this day, every man, all that is right in his own eyes.’ [Dt. 12:8]… And the speech of Moses seems to mean the true service of God, which was not yet perfected, neither could be in their travels, as it was after in Canaan, vv. 10-11. Not that they sacrificed after their fancy (says the Geneva notes) but that God would be served more purely in the land of Canaan. Junius upon this place notes: ‘Etsi oblationum lex una semper fuit ab initi• praescripta a Deo, non potuit tamen usque adeo in ambulatoriis Israelitarum castris observari, ant summo jure ab illis exigi, prout ostendit; Antithesis, verse 11; vide Num, 28:6.’ The [Romanist] Douay divines, on the place, give this observation, ‘In the desert they could not observe the ceremonies of the Law, but coming to rest, they were bound to keep all one set form of holy rites.’ The conclusion from this text is that God is pleased to dispense with his people in his own prescribed worship, until, if He has appointed, determined, or appropriated a certain form, time and place, they have opportunity to serve Him at that time, in that place, and after that form.</p></blockquote>

<blockquote><p>Rule Two. We must have a respect to the ordinance itself, that it be not made contemptible, that the discipline of Christ’s house be not rendered obnoxious to reproach and contempt; and as in the first reformation of religion, when men were coming out of popery and were ready to fear and spurn at discipline, and knew not the difference between the popish yoke and Christ’s yoke, in that case and in that time there was forbearance on this account. ‘I would they were cut off that trouble you’ (Gal. 5:12). Why then would he not cut them off? Because there was such a distemper among the Galatians, they were so bewitched and led away after the false teachers, and Paul’s authority was questioned; therefore he held himself at a wish and will not put forth the authority he had against those false and corrupt men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 923 of 7. ‘A Sermon on Ephesians 4:11-12’ in Collected Sermons of James Durham…, vol. 1 (Naphtali &amp; RHB, 2017)</cite></span></figcaption>

</figure><figure class="quote" id="q-74c6e5c787" data-kw="">
<blockquote><p>2. I grant the whole, and yet nothing is concluded against us. For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>

<blockquote><p>…but the truth is, neither the king’s judgement, as a certain rule to the representative Church, nor [is] the representative Church’s judgment a rule to the King, but the Word of God [is] the infallible rule to both. Judgment may crook, truth cannot bow; it stands still unmoveable like God, the father of truth; but in this case if both err, excellently says Junius (contra Bellarmine, on Councils, bk.1, ch. 12), the magistrate erring, the Church may do something extraordinarily; and the Church erring the magistrate may do something also in an extraordinary way, as common equity and mutual law requires, that friends with mutual tongues bick [quarrel?] the wounds of friends.</p></blockquote>

<blockquote><p>3. That there is a difference betwixt the essentials and circumstantials of presbyterial government; the one being such as are of divine or scriptural institution, and in themselves unalterable; the other being such as are of positive human institution, which are to be regulated by that great end of edification, and therefore may be altered accordingly as they do or do not contribute for that end. It is observable that the resolution Brethren in this and sundry other of their papers do in many of these challenges which they bring against the protesting Brethren (as proceeding in their planting of churches and ordaining and admitting of [ministers?], and propounding of overtures for purging and planting the Church in such a disorderly way as is destructive to the being of the government, we say, they do confound these things, and oftentimes take circumstantials for essentials: As for instance, that a minister shall be ordained by a plurality of presbyters, we hold with them to [???] of scriptural divine institution, but that he be ordained by such a number, officiating in such bounds, the Scripture has not determined; And therefore, if the major part of a presbytery conspire for keeping out a godly man from the ministry that is lawfully called by the congregation and rightly qualified, because he is not of their judgment in declining courses, it’s no breach upon the being and essentials of the government that he receive his ordination and admission to the ministry from a neighboring presbytery, especially when this conspiracy is generally throughout the country, and no remedy thereof can be had by a superior judicatory: So in the case of the overture in hand, though because of the present condition of synods, and for edification, there be a little alteration of some things from the common way of order, yet does it not involve anything destructive to the being of the government. No persons are desired to be upon these visitations but ministers and elders duly qualified, and members of the respective synods; No power is desired to be given but that which is properly ecclesiastical; Nor is it desired to be derived from any fountain, but from the synod itself; Nor to proceed by any rule but by the Word of God and the acts of uncontroverted [former] General Assemblies [which allowed and executed such]; Nor are they to exercise it independantly, but with subordination unto, and being accomptable to the synod from whence they do receive it… Is it tyrannically to impose, to desire the synod for the better and more unanimous carrying-on the Work of God, to ratify the nomination of some of the choicest of their own members, made by no forinsic persons, or party, or power, but by the intrinsic members of the synod itself, and that in such a distracted condition of the Church, and that they are not comptable [accountable], is alleged gratis [freely without warrant]. The Article, as propounded to our Brethren, does expressly provide that these committees shall in their proceedings be comptable to the synods, nor does that clause of the synods not reversing anything done by these [smaller] committees, without the previous advice and consent of the [larger] general committee of delegates, import anything to the contrary, but that the synod may take an accompt of the proceedings of their own committee, and admonish and rebuke them; yea, and take away their commission and power, in the case of mal-administration, and give it to others of their number, nominated as aforesaid: And for a jurisdiction by this means set up above themselves, we can see no such thing in the Overture, but only a power of advice upon the part of these delegates (which yet the synod are not simply tied by the Overture to follow, as in the case of their advising the synod to reverse the deeds of these Committees) and a brotherly condescension in the synods in the present condition of the Church, not to reverse things done by these committees without the advice and consent of these delegates. Neither will our Brethren’s negative voice prove it; because as these delegates have not a negative voice in all cases, as we have already showed, to wit, in the case of ratifying of the proceedings of these committees, the synod being free, notwithstanding anything in the Overture to ratify, albeit the delegates should not consent, but advise otherwise; So it is a new device to say, that a negative voice infers a superior jurisdiction and power; for, at most it makes but a co-ordinate power: And that there is any absurdity in this, that a committee of delegates, nominated by the common consent of all the synods, should, in this condition of the Church, have such a power (if yet it be a power of jurisdiction) we do not see. 4. This Overture was not propounded as a perpetual standing way, always to be followed and kept up in the Church, as our Brethren are pleased to insinuate, much less was it propounded hereby to lay a way for perpetuating of differences and contentions (a prejudice also they are pleased to load it with) but, as it expressly bears, to continue only till the present differences be healed, or, till the Lord in providence minister some better way for settling peace amongst us. Will the resolution Brethren in this present sickly declining and distracted condition of the Church, allow of no remedy for purging thereof and composing differences, that is in any circumstance out of the common road of the ordinary procedures of presbyteries and synods? We know that they will tell us that the Church is sound and healthy, and sufficiently able by presbyteries and synods to purge herself. But why then (we pray our Brethren to tell us) did the General Assembly, before these differences did arise, unanimously, judge that presbyteries and synods were not sufficiently able to do it, and did, upon conviction hereof, appoint extraordinary commissions and visitations for doing of it? … …but, that by some mean or another that is not sinfull, the House of God might be purged;… Whence it appears, that nothing will please, unless the protesting Brethren condescend, as asses, to bow down under the burden by an absolute submission to presbyteries and synods, as now constituted (that is upon the matter to the Brethren for the public Resolutions, the protesting Brethren being, by their own verdict, a few number in comparison of the body of the ministry of this Church) in their present and future actings, how negligent or corrupt soever, which themselves make evident in the next thing whereupon they impeach them, as projecters against, and subverters of the government of the Church, to wit, their refusing to engage themselves to an absolute submission to the sentences of the Church judicatories.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters… (Edinburgh, 1658)</cite>, pp. 33-34</span></figcaption>

e+alteration+of+some+things+from+the+common+way+of+order%2C+yet+does+it+not+involve+anything+destructive+to+the+being+of+the+government.+No+persons+are+desired+to+be+upon+these+visitations+but+ministers+and+elders+duly+qualified%2C+and+members+of+the+respective+synods%3B+No+power+is+desired+to+be+given+but+that+which+is+properly+ecclesiastical%3B+Nor+is+it+desired+to+be+derived+from+any+fountain%2C+but+from+the+synod+itself%3B+Nor+to+proceed+by+any+rule+but+by+the+Word+of+God+and+the+acts+of+uncontroverted+%5Bformer%5D+General+Assemblies+%5Bwhich+allowed+and+executed+such%5D%3B+Nor+are+they+to+exercise+it+independantly%2C+but+with+subordination+unto%2C+and+being+accomptable+to+the+synod+from+whence+they+do+receive+it%E2%80%A6+Is+it+tyrannically+to+impose%2C+to+desire+the+synod+for+the+better+and+more+unanimous+carrying-on+the+Work+of+God%2C+to+ratify+the+nomination+of+some+of+the+choicest+of+their+own+members%2C+made+by+no+forinsic+persons%2C+or+party%2C+or+power%2C+but+by+the+intrinsic+members+of+the+synod+itself%2C+and+that+in+such+a+distracted+condition+of+the+Church%2C+and+that+they+are+not+comptable+%5Baccountable%5D%2C+is+alleged+gratis+%5Bfreely+without+warrant%5D.+The+Article%2C+as+propounded+to+our+Brethren%2C+does+expressly+provide+that+these+committees+shall+in+their+proceedings+be+comptable+to+the+synods%2C+nor+does+that+clause+of+the+synods+not+reversing+anything+done+by+these+%5Bsmaller%5D+committees%2C+without+the+previous+advice+and+consent+of+the+%5Blarger%5D+general+committee+of+delegates%2C+import+anything+to+the+contrary%2C+but+that+the+synod+may+take+an+accompt+of+the+proceedings+of+their+own+committee%2C+and+admonish+and+rebuke+them%3B+yea%2C+and+take+away+their+commission+and+power%2C+in+the+case+of+mal-administration%2C+and+give+it+to+others+of+their+number%2C+nominated+as+aforesaid%3A+And+for+a+jurisdiction+by+this+means+set+up+above+themselves%2C+we+can+see+no+such+thing+in+the+Overture%2C+but+only+a+power+of+advice+upon+the+part+of+these+delegates+%28which+yet+the+synod+are+not+simply+tied+by+the+Overture+to+follow%2C+as+in+the+case+of+their+advising+the+synod+to+reverse+the+deeds+of+these+Committees%29+and+a+brotherly+condescension+in+the+synods+in+the+present+condition+of+the+Church%2C+not+to+reverse+things+done+by+these+committees+without+the+advice+and+consent+of+these+delegates.+Neither+will+our+Brethren%E2%80%99s+negative+voice+prove+it%3B+because+as+these+delegates+have+not+a+negative+voice+in+all+cases%2C+as+we+have+already+showed%2C+to+wit%2C+in+the+case+of+ratifying+of+the+proceedings+of+these+committees%2C+the+synod+being+free%2C+notwithstanding+anything+in+the+Overture+to+ratify%2C+albeit+the+delegates+should+not+consent%2C+but+advise+otherwise%3B+So+it+is+a+new+device+to+say%2C+that+a+negative+voice+infers+a+superior+jurisdiction+and+power%3B+for%2C+at+most+it+makes+but+a+co-ordinate+power%3A+And+that+there+is+any+absurdity+in+this%2C+that+a+committee+of+delegates%2C+nominated+by+the+common+consent+of+all+the+synods%2C+should%2C+in+this+condition+of+the+Church%2C+have+such+a+power+%28if+yet+it+be+a+power+of+jurisdiction%29+we+do+not+see.+4.+This+Overture+was+not+propounded+as+a+perpetual+standing+way%2C+always+to+be+followed+and+kept+up+in+the+Church%2C+as+our+Brethren+are+pleased+to+insinuate%2C+much+less+was+it+propounded+hereby+to+lay+a+way+for+perpetuating+of+differences+and+contentions+%28a+prejudice+also+they+are+pleased+to+load+it+with%29+but%2C+as+it+expressly+bears%2C+to+continue+only+till+the+present+differences+be+healed%2C+or%2C+till+the+Lord+in+providence+minister+some+better+way+for+settling+peace+amongst+us.+Will+the+resolution+Brethren+in+this+present+sickly+declining+and+distracted+condition+of+the+Church%2C+allow+of+no+remedy+for+purging+thereof+and+composing+differences%2C+that+is+in+any+circumstance+out+of+the+common+road+of+the+ordinary+procedures+of+presbyteries+and+synods%3F+We+know+that+they+will+tell+us+that+the+Church+is+sound+and+healthy%2C+and+sufficiently+able+by+presbyteries+and+synods+to+purge+herself.+But+why+then+%28we+pray+our+Brethren+to+tell+us%29+did+the+General+Assembly%2C+before+these+differences+did+arise%2C+unanimously%2C+judge+that+presbyteries+and+synods+were+not+sufficiently+able+to+do+it%2C+and+did%2C+upon+conviction+hereof%2C+appoint+extraordinary+commissions+and+visitations+for+doing+of+it%3F+%E2%80%A6+%E2%80%A6but%2C+that+by+some+mean+or+another+that+is+not+sinfull%2C+the+House+of+God+might+be+purged%3B%E2%80%A6+Whence+it+appears%2C+that+nothing+will+please%2C+unless+the+protesting+Brethren+condescend%2C+as+asses%2C+to+bow+down+under+the+burden+by+an+absolute+submission+to+presbyteries+and+synods%2C+as+now+constituted+%28that+is+upon+the+matter+to+the+Brethren+for+the+public+Resolutions%2C+the+protesting+Brethren+being%2C+by+their+own+verdict%2C+a+few+number+in+comparison+of+the+body+of+the+ministry+of+this+Church%29+in+their+present+and+future+actings%2C+how+negligent+or+corrupt+soever%2C+which+themselves+make+evident+in+the+next+thing+whereupon+they+impeach+them%2C+as+projecters+against%2C+and+subverters+of+the+government+of+the+Church%2C+to+wit%2C+their+refusing+to+engage+themselves+to+an+absolute+submission+to+the+sentences+of+the+Church+judicatories.%E2%80%9D%0A%0A%E2%80%94+James+Guthrie%2C+Protesters+No+Subverters%E2%80%A6+%28Edinburgh%2C+1658%29%2C+pp.+33-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2496a9a68a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2496a9a68a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-extraordinary-acts-of-church-government-superintendents-assessor-elders-etc/#:~:text=3.%20That%20there%20is%20a%20difference,the%20sentences%20of%20the%20Church%20judicatories&amp;text=3.%20That%20there%20is%20a%20difference%20betwixt%20the&amp;text=submission%20to%20the%20sentences%20of%20the%20Church%20judicatories" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></ <blockquote><p>Those who hold Church government to be of divine right may feel uneasy in calling it positive. Rutherford, who wrote The Book on the subject, The Divine Right of Church Government (1646), did not. One reason why Church government is positive is because it is a special arrangement that does not simply inhere in or derive from nature; rather, it has been appointed in special revelation by the will of Christ about redemption. It is also political, in the sense of binding men in society. Church government could be otherwise (if Christ had so appointed); however the specific form of it, namely classical presbyterianism, is the particular form that Christ has chosen and instituted as the Mediatorial King of the Church, his Kingdom. The form of the government binds not from the nature of it (though it is in accord with the light of nature), but from Christ’s authority alone. Church government was different in the Old Testament, and had changed, developed and progressed numerous times therein. To say that New Testament Church government is positive does not mean that there is not any continuity between it and the Church government of the Old Testament; there is. But there is also not a direct one-to-one correlation between the two either, which some persons find perplexing. On the one hand, as these positive laws of Church government are binding as they are positive (just as the Mosaic ceremonial laws were binding to the Old Testament Church as they were positive), so under the normal circumstances of the Church in the course of history, every last spiritually prescribed detail (however minute) of Biblical, classical presbyterianism is binding by the authority and honor of Christ, the Church’s Lord. However, on the other hand, it is also because the laws of Church government are positive, and as moral obligations (in necessity) override positive ones, that alterations in the regular government of the Church, grounded in natural principles, may, and should, legitimately occur in extraordinary and necessary circumstances (as the Bible and historic presbyterianism teach). Because human, Church government is positive, according to the needs and circumstances of the Church in this age, it will greatly change and fall away with the renovation of all things in the Age to Come, when no teachers will be needed, as we will be beholding God face to face, immediately (Jer. 31:33-34; 1 Cor. 15:28).</p></blockquote>

<blockquote><p>Thus far of ordinary Rules, and course of Ordination, in the ordinary way; that which concerns the extraordinary way, requisite to be now practised, followeth. 1. In these present exigencies, while we cannot have any presbyteries formed up to their whole power and work, and that many ministers are to be ordained for the service of the armies and navy, and to many congregations where there is no minister at all; and where (by reason of the publick troubles) the people cannot either themselves enquire and find out one who may be a faithful minister for them, or have any with safety sent unto them, for such a solemn trial as was before mentioned in the ordinary rules; especially, when there can be no presbytery near unto them, to whom they may address themselves, or which may come or send to them a fit man to be ordained in that congregation, and for that people; and yet notwithstanding, it is requisite that ministers be ordained for them by some, who, being set apart themselves for the work of the ministry, have power to join in the setting apart others, who are found fit and worthy. In those cases, until, by God’s blessing, the aforesaid difficulties may be in some good measure removed, let some godly ministers, in or about the city of London, be designed by publick authority, who, being associated, may ordain ministers for the city and the vicinity, keeping as near to the ordinary rules fore-mentioned as possibly they may; and let this association be for no other intent or purpose, but only for the work of ordination. 2. Let the like association be made by the same authority in great towns, and the neighbouring parishes in the several counties, which are at the present quiet and undisturbed, to do the like for the parts adjacent. 3. Let such as are chosen, or appointed for the service of the armies or navy, be ordained, as aforesaid, by the associated ministers of London, or some others in the country. 4. Let them do the like, when any man shall duly and lawfully be recommended to them for the ministry of any congregation, who cannot enjoy liberty to have a trial of his parts and abilities, and desire the help of such ministers so associated, for the better furnishing of them with such a person as by them shall be judged fit for the service of that church and people.</p></blockquote>

<blockquote><p>Thus far of ordinary Rules, and course of Ordination, in the ordinary way; that which concerns the extraordinary way, requisite to be now practised, followeth.

1. In these present exigencies, while we cannot have any presbyteries formed up to their whole power and work, and that many ministers are to be ordained for the service of the armies and navy, and to many congregations where there is no minister at all; and where (by reason of the publick troubles) the people cannot either themselves enquire and find out one who may be a faithful minister for them, or have any with safety sent unto them, for such a solemn trial as was before mentioned in the ordinary rules; especially, when there can be no presbytery near unto them, to whom they may address themselves, or which may come or send to them a fit man to be ordained in that congregation, and for that people; and yet notwithstanding, it is requisite that ministers be ordained for them by some, who, being set apart themselves for the work of the ministry, have power to join in the setting apart others, who are found fit and worthy. In those cases, until, by God’s blessing, the aforesaid difficulties may be in some good measure removed, let some godly ministers, in or about the city of London, be designed by publick authority, who, being associated, may ordain ministers for the city and the vicinity, keeping as near to the ordinary rules fore-mentioned as possibly they may; and let this association be for no other intent or purpose, but only for the work of ordination.

2. Let the like association be made by the same authority in great towns, and the neighbouring parishes in the several counties, which are at the present quiet and undisturbed, to do the like for the parts adjacent.

3. Let such as are chosen, or appointed for the service of the armies or navy, be ordained, as aforesaid, by the associated ministers of London, or some others in the country.

4. Let them do the like, when any man shall duly and lawfully be recommended to them for the ministry of any congregation, who cannot enjoy liberty to have a trial of his parts and abilities, and desire the help of such ministers so associated, for the better furnishing of them with such a person as by them shall be judged fit for the service of that church and people.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thus far of ordinary Rules, and course of Ordination, in the ordinary way; that which concerns the extraordinary way, requisite to be now practised, followeth.

1. In these present exigencies, while we cannot have any presbyteries formed up to their whole power and work, and that many ministers are to be ordained for the service of the armies and navy, and to many congregations where there is no minister at all; and where (by reason of the publick troubles) the people cannot either themselves enquire and find out one who may be a faithful minister for them, or have any with safety sent unto them, for such a solemn trial as was before mentioned in the ordinary rules; especially, when there can be no presbytery near unto them, to whom they may address themselves, or which may come or send to them a fit man to be ordained in that congregation, and for that people; and yet notwithstanding, it is requisite that ministers be ordained for them by some, who, being set apart themselves for the work of the ministry, have power to join in the setting apart others, who are found fit and worthy. In those cases, until, by God’s blessing, the aforesaid difficulties may be in some good measure removed, let some godly ministers, in or about the city of London, be designed by publick authority, who, being associated, may ordain ministers for the city and the vicinity, keeping as near to the ordinary rules fore-mentioned as possibly they may; and let this association be for no other intent or purpose, but only for the work of ordination.

2. Let the like association be made by the same authority in great towns, and the neighbouring parishes in the several counties, which are at the present quiet and undisturbed, to do the like for the parts adjacent.

3. Let such as are chosen, or appointed for the service of the armies or navy, be ordained, as aforesaid, by the associated ministers of London, or some others in the country.

4. Let them do the like, when any man shall duly and lawfully be recommended to them for the ministry of any congregation, who cannot enjoy liberty to have a trial of his parts and abilities, and desire the help of such ministers so associated, for the better furnishing of them with such a person as by them shall be judged fit for the service of that church and people.”

o+the+like+for+the+parts+adjacent.+3.+Let+such+as+are+chosen%2C+or+appointed+for+the+service+of+the+armies+or+navy%2C+be+ordained%2C+as+aforesaid%2C+by+the+associated+ministers+of+London%2C+or+some+others+in+the+country.+4.+Let+them+do+the+like%2C+when+any+man+shall+duly+and+lawfully+be+recommended+to+them+for+the+ministry+of+any+congregation%2C+who+cannot+enjoy+liberty+to+have+a+trial+of+his+parts+and+abilities%2C+and+desire+the+help+of+such+ministers+so+associated%2C+for+the+better+furnishing+of+them+with+such+a+person+as+by+them+shall+be+judged+fit+for+the+service+of+that+church+and+people.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Form+of+Presbyterial+Church-Government%2C+%E2%80%98The+Directory+for+the+Ordination+of+Ministers%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a46de8e3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4a46de8e3c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-extraordinary-acts-of-church-government-superintendents-assessor-elders-etc/#:~:text=Thus%20far%20of%20ordinary%20Rules%2C%20and,service%20of%20that%20church%20and%20people&amp;text=Thus%20far%20of%20ordinary%20Rules%2C%20and%20course%20of&amp;text=for%20the%20service%20of%20that%20church%20and%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-71da08c643" data-kw="">
<blockquote><p>Article 32. We believe that it is expedient, that they who be chosen superintendents in the Church, should wisely consult among themselves, by what means the whole body may conveniently be ruled, yet so as they do not swerve from that which our Lord Jesus Christ has instituted. And this does not hinder but that in some churches there may be those particular constitutions, which will be more convenient for them than for others.</p></blockquote>

" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-882295aa8e" data-kw="">
<blockquote><p>The Dutch superintendens are as like to English bishops as an emperor in the days of Fabius Maximus, when the senate ruled all, to an emperor in the days of Tiberius or Nero, when an absolute prince, I will not say a tyrant, did govern all at his pleasure. The name is one, but the things are essentially different, and so far distant as the East is from the West.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Historical Vindication of the Government of the Church of Scotland</cite>, … (1646), p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

— Robert Baillie, An Historical Vindication of the Government of the Church of Scotland, … (1646), p. 79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Dutch+superintendens+are+as+like+to+English+bishops+as+an+emperor+in+the+days+of+Fabius+Maximus%2C+when+the+senate+ruled+all%2C+to+an+emperor+in+the+days+of+Tiberius+or+Nero%2C+when+an+absolute+prince%2C+I+will+not+say+a+tyrant%2C+did+govern+all+at+his+pleasure.+The+name+is+one%2C+but+the+things+are+essentially+different%2C+and+so+far+distant+as+the+East+is+from+the+West.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+An+Historical+Vindication+of+the+Government+of+the+Church+of+Scotland%2C+%E2%80%A6+%281646%29%2C+p.+79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F882295aa8e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/882295aa8e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-extraordinary-acts-of-church-government-superintendents-assessor-elders-etc/#:~:text=The%20Dutch%20superintendens%20are%20as%20like,the%20East%20is%20from%20the%20West&amp;text=The%20Dutch%20superintendens%20are%20as%20like%20to%20English&amp;text=distant%20as%20the%20East%20is%20from%20the%20West" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4cf11c097b" data-kw="">
<blockquote><p>As for the prelate, who is pretended to be the pastor of pastors and an ecclesiastical creature, having majority of power, both of order and jurisdiction above the pastor and doctor, the Church of Scotland did ever repute such an one the fifth element, and the sixth finger in the hand, as having no warrant in the Word, and therefore unlawful, Ex. 25:9; Heb. 8:5; 1 Chron. 8. 19. 11, 12, 13; 1 Kings 6:38, as also expressly condemned, Lk 22:24-26; 1 Pet. 5:3-4; Mt. 18:18; 1 Cor. 5:4-6; Acts 1:23; 15:24. In the first constitution and infancy of our Church there were some visitors and superintendents for planting of churches, because breasts and hair of our churches were not grown, after the example of the apostles, who sent such to plant and visit churches, and appoint elders in congregations, Acts 8:14-16; 13:14-16; 14:23; Tit. 1:5-9; 21:17-18, but after the Church was planted there was no need of such. Titular doctors, who were pastors only, and taught not in the schools, but were only previous dispositions to episcopacy, as [the] blue color prepares a cloth for purple, our Church never allowed, upon the grounds allowing lawful doctors, as the Scripture does, Rom. 12:7-8; 1 Cor. 12:28; Eph. 4:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 20, 2nd Article, ‘Officers of the Church’</span></figcaption>

ooksonline.com/on-extraordinary-acts-of-church-government-superintendents-assessor-elders-etc/#:~:text=As%20for%20the%20prelate%2C%20who%20is,12%3A7%2D8%3B%201%20Cor.%2012%3A28%3B%20Eph.%204%3A11&amp;text=As%20for%20the%20prelate%2C%20who%20is%20pretended%20to&amp;text=does%2C%20Rom.%2012%3A7%2D8%3B%201%20Cor.%2012%3A28%3B%20Eph.%204%3A11" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-912ea869d0" data-kw="">
<blockquote><p>2. When we teach, that the pastor or pastors of every particular Church and congregation, with the elders of the same, being met together, have power to bind and loose, we understand this, only of such places wherein a competent number of understanding and qualified men, may be had to make up an eldership: otherwise let there be one eldership made up of two or three of the next adjacent parishes, according as was ordained by the Church of Scotland in the seventh chapter of the Second Book of Discipline [section 10]… …set some bounds to the execution of their power: which bounds we also think good to be kept, viz. that if a Church be so small that it has not so many well qualified men as may be sufficient to assist the pastor in the governement thereof, then let one common eldership be made up out of it and some other neighbor churches…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... (1637), ch. 8, Digression 4, p. 189</span></figcaption>

</figure><figure class="quote" id="q-b5bdf9af74" data-kw="">
<blockquote><p>The Church of Rome did not meet in one place for celebrating the worship of God, there were more holy assemblies there in diverse places; there was a Church in the house of Aquila and Priscilla, Rom. 16:5. Paul when he was at Rome had holy Church assemblies in his own house, Acts 28:23, 30, 31, which yet was not that whole (collectively taken) and famous Church of the believing Romans, whose faith was famous through the whole world, Rom. 1:8. Other examples we meet with in the Scripture of Churches duly constituted according to God’s appointment, which met not in one place for exercising the worship of God, but did in diverse places under a common presbytery of diverse pastors perform holy duties. Hence also in our Belgic Churches in some greater towns, though there be more believers than can celebrate the holy worship of God and exercise other ordinances of Christ together in one place; yet they are not divided into several Churches, but do together make one visible Church, under the common presbytery and government of diverse pastors.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Church of Rome did not meet in one place for celebrating the worship of God, there were more holy assemblies there in diverse places; there was a Church in the house of Aquila and Priscilla, Rom. 16:5. Paul when he was at Rome had holy Church assemblies in his own house, Acts 28:23, 30, 31, which yet was not that whole (collectively taken) and famous Church of the believing Romans, whose faith was famous through the whole world, Rom. 1:8. Other examples we meet with in the Scripture of Churches duly constituted according to God’s appointment, which met not in one place for exercising the worship of God, but did in diverse places under a common presbytery of diverse pastors perform holy duties. Hence also in our Belgic Churches in some greater towns, though there be more believers than can celebrate the holy worship of God and exercise other ordinances of Christ together in one place; yet they are not divided into several Churches, but do together make one visible Church, under the common presbytery and government of diverse pastors.”

<blockquote><p>The most ap­plauded Tenets of our modern Anabaptists, are the self-same with what the old Anabaptists did invent The errors of the Anabaptists and their divisions amongst themselves are so many, that to set them down distinctly in any good order, is a task which I dare not undertake: much less can I give assurance what is common to them all and what pro­per to their several sects: only that I may demonstrate the same very spirit to breath this day in the Anabaptists of Britain, which inspired their fathers of former times in Germany, I will remark what tenets authors of good credit ascribe to both; hoping that this discovery may be a means to bring many simple well-meaning people who are not yet plunged in the deeps of obstinacy to a more accurate trial and greater suspicion of their ways: when they shall see it made visible and palpable upon undeniable evi­dence, that their most beloved tenets and practices which they beleeve to be full of truth and holiness, are no other but the same very singularities which the known event doth now con­vince all who without prejudice can but read unquestionable Hi­stories, to have been the inventions and dictates of the false and unclean spirit which acted and moved in Muntzer, Becold, David George, and such like abominable monsters of mankind. Their first and prime tenet was a necessity of gathering churches out of churches, and of separati­on from the best Reformed in their time, because of mixed communion The first and leading tenet of the old Anabaptists was a neces­sity to gather new Churches out of these which Luther and Zwin­gli and their followers had reformed from popery (A). It is remarkable that these men had never a stomach to trouble them­selves with any labor to make converts from Popery or pro­faneness, only so soon as gracious persons had drawn any ci­ties or countries out of the kingdom of antichrist, then they fell on and every where did much disturb the work of the new Reformation (B). At the beginning they dissembled the grossest of their errors, and their intention to quarrel with infant baptism: they did only press a greater measure of holiness and mortification than was ordinary (C), in this all good men went along with them: but when they began to teach that the church behooved to consist of no other members but such as were not in profession and aim [Page 30] alone, but also visibly and really holy and elect, and therefore that new churches behoved to be gathered, and that all the old any where extant behooved to be separate from as mixed, and so cor­rupted societies; then Luther and Zwingli did oppose them­selves to this schismatic humor (D). When they found themselves disappointed of the assistance of Luther and Zwingli, and all the rest of the orthodox preachers, without more delay they fell upon their intended work them­selves alone, first by private conventicles (E), then by preaching in the open streets they gathered and set up churches after their own mind (F), consisting merely of saints (G), who did forbear communion in religious exercises with all other churches (H), whom they avowed to be for the most part but worldly, carnal, and profane gospellers (I), and their best preachers, especial­ly Luther and Zwingli, to be but scribes and pharisees, false prophets, large as evil as the pope and his anti-Christian priests (K). Antipaedobap­tism became at last their grea­test darling For the stricter ingagement of the Saints and godly party their adherents, and for the clearer distinction of them from the pro­phane multitude of all other Congregations, they thought meet to put upon them the mark and character of a new Baptisme, making them renounce their old as null, because received in their infancy, and in a false Church. At the beginning this re-baptizing was but a secondary and less principal doctrine among them, for Muntzer himself was never re-baptized, neither in his own person did he re-baptize any (L), yet thereafter it became a more essential note of a member of their church, and the cry­ing down of infants baptism came to be a most principal and distinctive doctrine of all in their way (M). They the au­thors of the prophesying and questio­ning of private men in the face of the Church. Unto their new gathered churches of re-baptized and dipped saints, they did ascribe very ample privileges, for first they gave to every one of them a power of questioning in public before the whole congregation any part of their preachers’ do­ctrine (N). Secondly, to every one of their members they gave a power of public preaching (O). Women prea­chers are from them This liberty they gave no less to women then men: for they had among them not only preaching and prophesying women, but also some who took so much upon them, as to profess them­selves to be the Christ and Messiah to all of their own sex (P). Thirdly, to their particular Churches they gave power of ele­cting and ordaining such of their own Prophets whom they thought fittest to be Pastors to the rest: whoever was not elected and ordained, whoever had not their full calling from the people alone, and did not renounce what ever ordination they had from any other, to them were no Pastors at all. Upon this ground among others they refused to hear any of the ministers of the Re­formed Churches, because they did not renounce their former or­dination and calling to the ministry, that they might take it again from the hands of their new gathered and separate congrega­tions (Q). They required no letters in their preachers. Fourthly, in their Pastors they required no secular learning (R), Indeed, to them all secular learning was abominable, they did burn all books but the Bible as impediments and hurtful instruments to the ministry of the gospel (S). Fifthly, they required their illiterate pastors to work with their own hands for their livings (T). Merchandize or any other Cal­ling wherein there was no personall and handy labour to them was unlawfull (V). The crying down of tithes, and all set sti­pends is from them Sixthly, they cried down all tithes (X), indeed, all set stipends for any church officer (Y). But it would be considered that they did avow it was as unlawfull to pay any set rent, or yearly duty to any Landlord as a stipend to a minister (Z). Independency of congregati­ons and the peoples power in Church censures is their invention Seventhly, unto their single congregations they gave a supreme and independent power to judge in all ecclesiastical causes; not only judicially to pronounce all questions about their pastors’ doctrine, but also to proceed to the highest censure of excom­munication, as well against their pastors as others when they found cause (AA). Their excommunications of one another were so frequent and for so light causes, that sundry of them fell to the opinion and practice of those whom we call Seekers, they served God single and alone, without the society of any Church, finding no Churches on earth with whom they could agree (BB).</p></blockquote>

a%C2%ADtest+darling+For+the+stricter+ingagement+of+the+Saints+and+godly+party+their+adherents%2C+and+for+the+clearer+distinction+of+them+from+the+pro%C2%ADphane+multitude+of+all+other+Congregations%2C+they+thought+meet+to+put+upon+them+the+mark+and+character+of+a+new+Baptisme%2C+making+them+renounce+their+old+as+null%2C+because+received+in+their+infancy%2C+and+in+a+false+Church.+At+the+beginning+this+re-baptizing+was+but+a+secondary+and+less+principal+doctrine+among+them%2C+for+Muntzer+himself+was+never+re-baptized%2C+neither+in+his+own+person+did+he+re-baptize+any+%28L%29%2C+yet+thereafter+it+became+a+more+essential+note+of+a+member+of+their+church%2C+and+the+cry%C2%ADing+down+of+infants+baptism+came+to+be+a+most+principal+and+distinctive+doctrine+of+all+in+their+way+%28M%29.+They+the+au%C2%ADthors+of+the+prophesying+and+questio%C2%ADning+of+private+men+in+the+face+of+the+Church.+Unto+their+new+gathered+churches+of+re-baptized+and+dipped+saints%2C+they+did+ascribe+very+ample+privileges%2C+for+first+they+gave+to+every+one+of+them+a+power+of+questioning+in+public+before+the+whole+congregation+any+part+of+their+preachers%E2%80%99+do%C2%ADctrine+%28N%29.+Secondly%2C+to+every+one+of+their+members+they+gave+a+power+of+public+preaching+%28O%29.+Women+prea%C2%ADchers+are+from+them+This+liberty+they+gave+no+less+to+women+then+men%3A+for+they+had+among+them+not+only+preaching+and+prophesying+women%2C+but+also+some+who+took+so+much+upon+them%2C+as+to+profess+them%C2%ADselves+to+be+the+Christ+and+Messiah+to+all+of+their+own+sex+%28P%29.+Thirdly%2C+to+their+particular+Churches+they+gave+power+of+ele%C2%ADcting+and+ordaining+such+of+their+own+Prophets+whom+they+thought+fittest+to+be+Pastors+to+the+rest%3A+whoever+was+not+elected+and+ordained%2C+whoever+had+not+their+full+calling+from+the+people+alone%2C+and+did+not+renounce+what+ever+ordination+they+had+from+any+other%2C+to+them+were+no+Pastors+at+all.+Upon+this+ground+among+others+they+refused+to+hear+any+of+the+ministers+of+the+Re%C2%ADformed+Churches%2C+because+they+did+not+renounce+their+former+or%C2%ADdination+and+calling+to+the+ministry%2C+that+they+might+take+it+again+from+the+hands+of+their+new+gathered+and+separate+congrega%C2%ADtions+%28Q%29.+They+required+no+letters+in+their+preachers.+Fourthly%2C+in+their+Pastors+they+required+no+secular+learning+%28R%29%2C+Indeed%2C+to+them+all+secular+learning+was+abominable%2C+they+did+burn+all+books+but+the+Bible+as+impediments+and+hurtful+instruments+to+the+ministry+of+the+gospel+%28S%29.+Fifthly%2C+they+required+their+illiterate+pastors+to+work+with+their+own+hands+for+their+livings+%28T%29.+Merchandize+or+any+other+Cal%C2%ADling+wherein+there+was+no+personall+and+handy+labour+to+them+was+unlawfull+%28V%29.+The+crying+down+of+tithes%2C+and+all+set+sti%C2%ADpends+is+from+them+Sixthly%2C+they+cried+down+all+tithes+%28X%29%2C+indeed%2C+all+set+stipends+for+any+church+officer+%28Y%29.+But+it+would+be+considered+that+they+did+avow+it+was+as+unlawfull+to+pay+any+set+rent%2C+or+yearly+duty+to+any+Landlord+as+a+stipend+to+a+minister+%28Z%29.+Independency+of+congregati%C2%ADons+and+the+peoples+power+in+Church+censures+is+their+invention+Seventhly%2C+unto+their+single+congregations+they+gave+a+supreme+and+independent+power+to+judge+in+all+ecclesiastical+causes%3B+not+only+judicially+to+pronounce+all+questions+about+their+pastors%E2%80%99+doctrine%2C+but+also+to+proceed+to+the+highest+censure+of+excom%C2%ADmunication%2C+as+well+against+their+pastors+as+others+when+they+found+cause+%28AA%29.+Their+excommunications+of+one+another+were+so+frequent+and+for+so+light+causes%2C+that+sundry+of+them+fell+to+the+opinion+and+practice+of+those+whom+we+call+Seekers%2C+they+served+God+single+and+alone%2C+without+the+society+of+any+Church%2C+finding+no+Churches+on+earth+with+whom+they+could+agree+%28BB%29.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Anabaptism%2C+The+True+Fountain+of+Independency%2C+Brownisme%2C+Antinomy%2C+Familism%2C+and+the+most+of+the+other+Errors+Which+For+The+Time+Do+Trouble+the+Church+of+England%2C+Unsealed%2C+%28London%2C+1647%29%2C+29%E2%80%9331.+NB%3A+For+ease+of+reading+and+because+archaic+words+spelling+tend+to+make+older+writers+seem+unintelligent&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2dc10adcdf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2dc10adcdf.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/06/baillie-versus-tombes-5-how-the-particular-baptists-appeared-to-early-presbyterians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>For all this so strong was the delusion, the blinded people did not open their eyes. Becold and Knipperdolling did daily preach new visions, Becold lying in a trance three days. When he awakened he appeared to be mute, but by writing tables he signi­fied it was the command of God to change yet further the Government of the city, he set down the names of twelve of his greatest confidents to be governors and princes over the twelve Tribes of Israel (MM): This was no sooner proposed then executed. So soon as the holy Prophet got his mouth opened, the first motion he makes, was that the preachers would consider if it were not the will of God for the increase of the holy seed, that every one of the saints should have more wives: at the first, the preachers opposed this abomination, but thereafter by threats and flatteries they were brought to yield. Becold began, and at one time married three, but at once he came to the number of fifteen together (NN). The great prophet’s example was follow­ed by many, and by all that would: many honest matrons were forced to marry with any of these villains who liked them. This unheard of wickedness did so embitter the spirits of the remain­der of ingenuous men, that they rose up in a conspiracy, and laid [Page 10] hold on Becold, Knipperdolling and the rest of their false prophets: but behold, the common people got up in a tumult, rescued the prophets, and killed forty nine of the most honest citizens for their assaying to put some end to their intolerable disorders (OO). Nothing more advances the affairs of tyrants, then a faint impru­dent and unsuccessful resistance: Becold by this unhappy attempt of his enemies having confirmed his authority, suborned one of the prophets to preach to the people, that it was the command of God to make Becold the king of the whole earth, promising that all the kings and potentates of the world should certainly be subdued by his sword, for he was the man that should rule all nations with a rod of iron (PP). Becold, at the hearing of these news, humbled himself to the ground, adored the truth of that prophecy, declared his information thereof by God ten days be­fore, but the matter concerning his own person he had hitherto been silent, yet all now being made public by the mouth of another prophet, he did submit himself to the will of God. No minute of time was delayed, the twelve princes were cashie­red, the Catholic monarch did choose his chancellor, treasu­rer, secretary, and other officers of state and court, a fair high throne was set up in the market-place, and covered all over with cloth of gold; Becold made for himself, being a tailor by his trade, very royal suits of most gorgeous apparel of the priests’ vestments, which he had robbed in the cathedral: a stately crown, scepter and sword were prepared for him, his courtiers were all put in most sumptuous raiment, no greater magnifi­cence was to be seen at any princes court in the world (QQ). Thus Becold attained the top of his ambition and lust, but the great skill was how to keep what was gotten: for this end twen­ty eight apostles were sent abroad to preach over the world obe­dience to the King of Munster the new Jerusalem; but here was the bad luck, all of them but one who returned with the tidings were killed in the places where first they offered to preach. In the meantime the town begun to be pinched with famine, one of the king’s wives being reported for a word of compassion upon the starving multitude, was brought forth to the marketplace, and by Becold’s own hand had her head struck off (RR). All the rest of his wives did sing a psalm to God for this so excellent an act of justice. The King himself led all fourteen in a dance [Page 11] through the streets of the town; it were long to recite all the acts of their villainous hypocrisy, at last the patience of God broke out upon them. One of the king’s secretaries undertook to bring into the town a supply of men and food, when he was gone. his way was straight to the enemy, he guided his treason so cunningly, that on a certain night he brought a party within the town, many were put to the edge of the sword, the king and the principal mis-leaders of the people were taken alive; the king was brought to acknowledge the most of his errors (SS), he offered upon con­dition of his life to make all the Anabaptists in Holland, Friesland, and England to be quiet and give over their way: but these vain promises were not trusted, and so after some cruel torture, he and Knipperdolling were killed, and hung up in a cage of iron up­on the highest pinnacle of the cathedral steeple (TT). That same very year 1535, Amsterdam in hazard to be a second Munster, the Anabaptists had a mighty design upon Amsterdam, and very narrowly did miss of their intention, to surprise that city, to be a seat of as glorious a kingdom as had been at Munster. But God assisted the citizens to prevent such a mischief, albeit not without great loss, for some hundreds were killed on both sides in these bloody uproars (VV). All this did not teach the Anabaptists wisdom. Still they did expect a new Jerusalem, and an earthly kingdom, their prophets filled the fancies of their people with this notion more than any other. One of their women at Apezell in Switzerland gave her self out for the Queen of the world and Messiah for all women, sending out her twelve she-Apostles for their conversion to her way (XX). I read also after the death of Becold of a second King in Utrecht, who was no less infamous for crimes than his predeces­sors, by open robberies he became rich, with his own hands he killed his poor wife that he might marry her daughter (YY). However the grievous absurdities of the Anabaptists both in their doctrine and practice, as also the evident judgments which God and man did pour upon them, and the very great industry which all the great and heroic divines of that happy time of Reformation did use to reclaim them, much retarded their pro­gress: yet it is marvelous to consider their incredible increase in many parts of Germany and elsewhere, til God of his mercy did divide them among themselves, and confound their languages: [Page 12] their divisions and subdivisions was that which most of all did weaken them and stop their course. After the taking of Munster one John Battenburg a bastard of a good family born at Leiden, made himself head of a strong party, and pretended a divine mission to propagate that earthly kingdom (ZZ), which by the fatal calamity of his townsman Becold, and his friends at Munster had been a little interrupted: between the followers of this Battenburg, and the remainder of the Monasterian Anabaptists arose the first discord. Their suffe­rings and disappointments made them more sober and wary then the zeal of Battenburg could approve of; for he professed that since the gospel preached by Becold had been rejected by the world, the time of mercy was now expired, and nothing but wrath remained: So that his commission from God was to kill all the world, only those who did yield to his way, and were rebaptized, he might admit to be slaves as Israel did the Gibeo­nites (AAA). Upon those grounds his followers where ever they dared be bold, did kill all whom they met with in the fields, did rob and steal what ever came to their hand, in country villages broke in upon sleeping people, pulled sundry out of their beds and drowned them in the first waters, or hanged them upon the first trees (BBB). They of Munster did not approve of all these pra­ctises, therefore they were condemned as cold, lukewarm hin­derers of the Kingdom of Christ (CCC). This discord lasted for several years, till the Monasterians expired, and the Battenbur­gicks were also rooted out as robbers and murderers by the sword of the Magistrate. The second division was greater, one Melchior Hoffman a skin­ner or glover in Suabland before the tragedy of Munster, The sect of the Hophmanists was a prime leader of the Anabaptists: In Strasburg about the year 1529 he seduced many, he leaned much upon Enthusiasms and dreams (DDD); he fancied that Strasburg was appointed of God to be the new Jerusalem; that himself and some others were quickly to get from heaven an extraordinary calling to an apostleship (EEE), that so from that town they might preach the gospel to all the world, which they were assured would in a short time be subdued to Christ by the power of the Spirit in their ministry without any outward force (FFF). The violent tu­mults of Munster, Hofman did not approve, these were the in­ventions [Page 13] of his scholar Mathie of Haarlem which he did always dislike (GGG), albeit whilst that doctrine of his scholar did pro­sper in Munster, he durst not much contradict it; but so soon as Munster was taken, and the chief authors of these violent te­nets were executed, he took then the boldness openly to cry down much of the way of the Monasterians, he preached for the office and power of the magistrate, and did chase away polyga­my (HHH); these were the grounds of the deadly feud betwixt Hoffman and Battenburg, and both their followers, which were many thousands of poor seduced souls. These of Hoffman’s party did not long agree among them­selves,Who were the Mennonites. one Menno the son of Simon a secular Priest (III) in West Friesland turning Anabaptist, began to criticize sundry things in Hoffman’s doctrine: he did reject all extraordinary and apostolic calling (KKK), also the dreams of the saints’ kingdom upon earth (LLL), and all enthusiasms (MMM), but in other things did follow the worst of the Anabaptists errors: denying the truth of Christ’s humanity, setting up Pelagianism in man’s free will, maintaining a perfect inherent righteousness without sin, and such like conceits (NNN). A Synod for union did divide them a­mongst them­selves more than ever. While the pestiferous vapor of this evil spirit was sensibly vanishing by domestic divisions, some of the wisest of the sect found ways to draw together the chief of all the four mentioned factions to a conference at Buckholt in West­phalia. A great synod of prime men from all countries where the Anabaptists lived did meet there; from the most places of lower Germany, from Friesland, from Saxony, from England also some did come (OOO). Great debates were among them, especially between the Battenburgicks and the Hoffmanites, the one defen­ding polygamy and their use of the sword against the world, the other opposing both. John Mathie of Middleburg a great do­ctor of the Anabaptists in England, was the chief champion of the Hoffmanites (PPP). Here it was where David George, a citizen of Delph, David Georgius labors for u­nion. did first become famous, this man had been a zealous opponent of pope­ry, he had openly in the streets upbraided both the priests and magistrates of Delph, in the very act of their idolatrous processi­on: for which bold zeal he was cast in prison, and had his tongue bored through, hardly escaping with his life (QQQ); these suf­ferings brought to him great respect among the Protestants at [Page 14] home, but thereafter turning Anabaptist he became the greatest and worst heretic to my mind that ever trod upon the earth. At the Synod of Buckholt he labored exceeding much to draw his brethren to concord; the Battenburgicks and Hoffmanites had so sharp debates about the magistrate, the earthly kingdom of the saints and polygamy, that hardly they could be kept from handy blows (RRR): David George did mediate between them, and drew it to this issue, that a mutual toleration being granted in the points controverted, in all other things they should hold one another for Brethren, and promote jointly the common cause of Anabaptism (SSS). This syncretism did not long stand, neither did David get thanks from either side for his mediation, for all did esteem him a colluder with both sides only for his own interests, driving a design of his own apart, differing from them all, which then was scarce visible above the ground, but quickly thereafter was apparent. A little after that synod all the parties did separate more then ever one from another as Antichristian and false believers (TTT), til the most of their sects did vanish: the Monasterians in a short time were drowned; of the Battenburgicks none does remain, except it be a handful in Moravia: for after the imprisonment and execution of their leader for his manifold robberies and murders, his followers were altogether broken. The Hoffmanites by the diligence of Bucer and Calvin at Strasburg being convinced received satisfaction and recanted their errors, joining themselves again to the Protestant Churches (VVV). The Georgians for a time did flourish, their leader David was a man very pragmatic, of a vehement and persuasive eloquence in the acts of devotion, for show singular, ardent and frequent in prayer (XXX), in fasting excessive, abstaining from all meat and drink sometimes four whole days and nights together (YYY): won­derfully confident of the absolute truth of his tenets, so marvel­ously bold that he did write and professed his hope by his letters and books to persuade the undeniable certainty of his dictates to the Emperor Charles the fifth, and to all the estates of the Empire (ZZZ), especially to the good Landgrave of Hesse, Phi­lip; yet his absurdi­ties were hor­rible. also to Melanchthon, to Bucer, to a Lasco, and many more: yet his tenets are so horribly absurd that Mohammad in his worst abo­minations was far below him, for he taught that in the godhead [Page 15] was no trinity of persons, but only three ways of manifestation, one in Moses, another in Jesus, a third in himself; that his person was as far above the person of Jesus, as Jesus was above Moses; that the writings of the prophets and apostles, that the doctrine of the law and gospel was all to be laid aside (AAAA) as childish and imperfect rudiments, to be dispelled as the twilight, by the beams of his far more perfect doctrine. One of the greatest perfections and singularities I mark in his doctrine is that which he much insists upon, the mortification of the flesh; to this he leads by a singular method, he looses the bands of matrimony, and all other natural and civil relations as things old and antiquated, which did oblige only during the time of Moses and of Jesus, but not under the clear light which his ministry had brought to the world; adulteries, fornications, incests, and most unspeakable villainies were so far from being any sins to him, that he did re­commend them to his most perfect scholars as acts of grace and mortification: he was given over to be possessed with so beastly a spirit in the justice of God for a recompense of his hypocrisy and blasphemous errors against the truth of God (BBBB). Notwithstanding of the unutterable absurdity of his way, yet this beast was confident that the whole world would submit to him, and in a short time would put into his hands without any violence all their power and wealth; and indeed at the beginning he got many families of good note to follow him with incredible zeal: for all of them were willing to dispose unto him their whole estates (CCCC), and were glad to seal his doctrine with their blood. In Delph when first they were put to a trial, seven and thirty most cheerfully did offer themselves to the executioner’s hands, some to be hanged, some drowned, some burnt (DDDD). Yet lest this zeal if too much tempted should at last succumb, the hypocritical heretic did alter one of his principles, and taught his scholars the lawfulness of dissimulation, permitting them for the safety of their life to deny and abjure what ever he had taught them, and giving them free liberty to join the public wor­ship with any of what ever religion among whom they li­ved (EEEE): by this means they got peace, and were no more any where persecuted. He himself retiring from Delph to Basel, his strange end did live there for several years until his death in great wealth and case (FFFF), as a fugitive for the true reformed religion; he [Page 16] did so perfectly dissemble, that he had the favor and good opi­nion both of the magistrates and ministers, without the least suspicion of any wickedness in him (GGGG); but three years after his death all his abominations were found out: and his di­ligence by letters, by secret conferences and messengers to propa­gate his evildoing way with his whole strength, whereupon his bones were dug up, and the remainder of his body burnt, as the relics of an inexpressibly wicked villain (HHHH). While all the other factions of the Anabaptists did decrease, the followers of the Priest Menno did much increase: they did reject the earthly kingdom and polygamy of the Monasterians and Battenburgicks, also the revelations and extraordinary calling of the Hoffmanites, with the most of the blasphemies of David George; against all these Menno did write with passion (IIII): But to the point of Anabaptism and separation from all other reformed Churches to independency, and to a number more of the Anabaptists tenets he did firmly adhere, alluring many thou­sands to his way, who continue to this day propagating their error to many Countries. The wickedness of that spirit which reigned in Menno, and yet rages in his followers, notwithstanding of all their profession of great piety, of singular modesty and extreme detestation of all the other sects of Anabaptists, is apparent in the manifold grievous heresies and gross schisms, whereinto they them­selves have of old broken out and persevere therein to this day. Who are pleased to read the late little accurate and learned Treatise of Clopenburgh, may perceive that the Mennonite dip­pers do oppose the truth of Christs human nature (KKKK), that they were masters to Vorstius in his denial of the omnipre­sence and simplicity of the divine essence and of the unchan­geableness of the divine decrees (LLLL): also that Armini­us was their scholar in all his errors concerning predestination, re­demption, grace, free will, and perseverance. Lastly, that Swenkfeld, Servetus, and Socinus did learn from them not only their Anabaptism, but their denial of the trinity, their abnegation of the godhead, both of the Son and of the Holy Ghost. (MMMM). The Mennonite schisms are no less palpable then their heresies, for however their harmony in the most of their errors be great [Page 17] enough, as in that confession of faith which in the year 1624. they set out in common it appears, wherein with many ambiguous and deceitful words they cover many of these tenets which in other writings they expressly maintain (NNNN), yet they are not able to cover their manifold schisms: for it has ever been their custom upon the smallest matters to fall into so vehement discords, as have made them excommunicate one another, and remain se­parations refusing communion one to another unto this day. Behold how small an occasion did bring them to no less then four irremediable fractions (OOOO): For a light cause four late separa­tions among them. one of the Mennonites at Franeker in a public roping did seem to use some cheating in buying of a house, preventing by some sleight of hand another man who before him had a mind to the bargain; this did so much displease some that they excommunicated the cheater; others defended the honesty of the man and did excommunicate them who for no cause as they conceived had put a censure upon him; hence two sects condemning one another to this day. To recon­cile both, a third party did arise, avowing that however the man in his bargain had used some piece of fraud, yet that it was not so gross as did deserve excommunication. In this accommodation these mid men proceeded so far, that they were excommunicated by both the dissenting parties, whereupon their passion was so stirred, that they did excommunicate them both also; and lest the number of their schisms should be too small, there arose a fourth party, who being displeased with the frequency of their brethren’s censures, did open the doors of their charity for all whom the rigor of others had excommunicated and cast out; by this over­lashing of their charity they did acquire from their companions the infamous title of Hamaxarii and Borboritae, as men who were content to take into their society cart loads full of polluted pro­fessors (PPPP). We will say no more of the Anabaptists over sea, their number in England till of late was not great; and the most of these were not English but Dutch strangers: for beside the hand of the state that ever lay heavy upon them, the labors of their children the separatists were always great for their reclaiming. Notwithstan­ding of all the contentions of the separatists among themselves, yet all of them did ever join to write sharp and large treatises [Page 18] against the Anabaptists; In this Ainsworth, Johnson, Robinson, Clifton did study who should be most zealous. Hence it was that the Anabaptists made little noise in Eng­land, till of late the Independents have corrupted and made worse the principles of the old separatists, proclaiming for errors a liberty both in church and state; under this shelter the Anabap­tists have lifted up their head, and increased their numbers, much above all other sects of the land. Their ways as yet are not well known, but a little time it seems will discover them, for their singular zeal to propagate their way will not permit them long to lurk: only the confession of faith which the other year seven of their congregations did put forth,Their late con­fession is nei­ther a full nor a clear declara­tion of their tenets and of late again a se­cond corrected edition have set out with a bold preface to both the Houses of Parliament may no more be taken for the measure of their faith, than that confession which their elder brethren in Holland did print not long ago in the name of all their compa­ny (QQQQ). For as the Dutch confession did dissemble a num­ber of the gross heresies which some of the very subscribers in their public writings both before and after did hold out, it is even so with the English, for Hobson, Richardson, and others of the sub­scribers have already printed several errors which in that con­fession do not appear. Moreover these seven congregations can­not prescribe, and are no ways leaders to a great number of Ana­baptist churches over all the land; however I shall set down so many of their tenets as for the time comes to my thoughts from some little acquaintance with a few of their writs that have fallen into my hands.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For all this so strong was the delusion, the blinded people did not open their eyes. Becold and Knipperdolling did daily preach new visions, Becold lying in a trance three days. When he awakened he appeared to be mute, but by writing tables he signi­fied it was the command of God to change yet further the Government of the city, he set down the names of twelve of his greatest confidents to be governors and princes over the twelve Tribes of Israel (MM): This was no sooner proposed then executed. So soon as the holy Prophet got his mouth opened, the first motion he makes, was that the preachers would consider if it were not the will of God for the increase of the holy seed, that every one of the saints should have more wives: at the first, the preachers opposed this abomination, but thereafter by threats and flatteries they were brought to yield. Becold began, and at one time married three, but at once he came to the number of fifteen together (NN). The great prophet’s example was follow­ed by many, and by all that would: many honest matrons were forced to marry with any of these villains who liked them. This unheard of wickedness did so embitter the spirits of the remain­der of ingenuous men, that they rose up in a conspiracy, and laid [Page 10] hold on Becold, Knipperdolling and the rest of their false prophets: but behold, the common people got up in a tumult, rescued the prophets, and killed forty nine of the most honest citizens for their assaying to put some end to their intolerable disorders (OO). Nothing more advances the affairs of tyrants, then a faint impru­dent and unsuccessful resistance: Becold by this unhappy attempt of his enemies having confirmed his authority, suborned one of the prophets to preach to the people, that it was the command of God to make Becold the king of the whole earth, promising that all the kings and potentates of the world should certainly be subdued by his sword, for he was the man that should rule all nations with a rod of iron (PP). Becold, at the hearing of these news, humbled himself to the ground, adored the truth of that prophecy, declared his information thereof by God ten days be­fore, but the matter concerning his own person he had hitherto been silent, yet all now being made public by the mouth of another prophet, he did submit himself to the will of God. No minute of time was delayed, the twelve princes were cashie­red, the Catholic monarch did choose his chancellor, treasu­rer, secretary, and other officers of state and court, a fair high throne was set up in the market-place, and covered all over with cloth of gold; Becold made for himself, being a tailor by his trade, very royal suits of most gorgeous apparel of the priests’ vestments, which he had robbed in the cathedral: a stately crown, scepter and sword were prepared for him, his courtiers were all put in most sumptuous raiment, no greater magnifi­cence was to be seen at any princes court in the world (QQ). Thus Becold attained the top of his ambition and lust, but the great skill was how to keep what was gotten: for this end twen­ty eight apostles were sent abroad to preach over the world obe­dience to the King of Munster the new Jerusalem; but here was the bad luck, all of them but one who returned with the tidings were killed in the places where first they offered to preach. In the meantime the town begun to be pinched with famine, one of the king’s wives being reported for a word of compassion upon the starving multitude, was brought forth to the marketplace, and by Becold’s own hand had her head struck off (RR). All the rest of his wives did sing a psalm to God for this so excellent an act of justice. The King himself led all fourteen in a dance [Page 11] through the streets of the town; it were long to recite all the acts of their villainous hypocrisy, at last the patience of God broke out upon them. One of the king’s secretaries undertook to bring into the town a supply of men and food, when he was gone. his way was straight to the enemy, he guided his treason so cunningly, that on a certain night he brought a party within the town, many were put to the edge of the sword, the king and the principal mis-leaders of the people were taken alive; the king was brought to acknowledge the most of his errors (SS), he offered upon con­dition of his life to make all the Anabaptists in Holland, Friesland, and England to be quiet and give over their way: but these vain promises were not trusted, and so after some cruel torture, he and Knipperdolling were killed, and hung up in a cage of iron up­on the highest pinnacle of the cathedral steeple (TT). That same very year 1535, Amsterdam in hazard to be a second Munster, the Anabaptists had a mighty design upon Amsterdam, and very narrowly did miss of their intention, to surprise that city, to be a seat of as glorious a kingdom as had been at Munster. But God assisted the citizens to prevent such a mischief, albeit not without great loss, for some hundreds were killed on both sides in these bloody uproars (VV). All this did not teach the Anabaptists wisdom. Still they did expect a new Jerusalem, and an earthly kingdom, their prophets filled the fancies of their people with this notion more than any other. One of their women at Apezell in Switzerland gave her self out for the Queen of the world and Messiah for all women, sending out her twelve she-Apostles for their conversion to her way (XX). I read also after the death of Becold of a second King in Utrecht, who was no less infamous for crimes than his predeces­sors, by open robberies he became rich, with his own hands he killed his poor wife that he might marry her daughter (YY). However the grievous absurdities of the Anabaptists both in their doctrine and practice, as also the evident judgments which God and man did pour upon them, and the very great industry which all the great and heroic divines of that happy time of Reformation did use to reclaim them, much retarded their pro­gress: yet it is marvelous to consider their incredible increase in many parts of Germany and elsewhere, til God of his mercy did divide them among themselves, and confound their languages: [Page 12] their divisions and subdivisions was that which most of all did weaken them and stop their course. After the taking of Munster one John Battenburg a bastard of a good family born at Leiden, made himself head of a strong party, and pretended a divine mission to propagate that earthly kingdom (ZZ), which by the fatal calamity of his townsman Becold, and his friends at Munster had been a little interrupted: between the followers of this Battenburg, and the remainder of the Monasterian Anabaptists arose the first discord. Their suffe­rings and disappointments made them more sober and wary then the zeal of Battenburg could approve of; for he professed that since the gospel preached by Becold had been rejected by the world, the time of mercy was now expired, and nothing but wrath remained: So that his commission from God was to kill all the world, only those who did yield to his way, and were rebaptized, he might admit to be slaves as Israel did the Gibeo­nites (AAA). Upon those grounds his followers where ever they dared be bold, did kill all whom they met with in the fields, did rob and steal what ever came to their hand, in country villages broke in upon sleeping people, pulled sundry out of their beds and drowned them in the first waters, or hanged them upon the first trees (BBB). They of Munster did not approve of all these pra­ctises, therefore they were condemned as cold, lukewarm hin­derers of the Kingdom of Christ (CCC). This discord lasted for several years, till the Monasterians expired, and the Battenbur­gicks were also rooted out as robbers and murderers by the sword of the Magistrate. The second division was greater, one Melchior Hoffman a skin­ner or glover in Suabland before the tragedy of Munster, The sect of the Hophmanists was a prime leader of the Anabaptists: In Strasburg about the year 1529 he seduced many, he leaned much upon Enthusiasms and dreams (DDD); he fancied that Strasburg was appointed of God to be the new Jerusalem; that himself and some others were quickly to get from heaven an extraordinary calling to an apostleship (EEE), that so from that town they might preach the gospel to all the world, which they were assured would in a short time be subdued to Christ by the power of the Spirit in their ministry without any outward force (FFF). The violent tu­mults of Munster, Hofman did not approve, these were the in­ventions [Page 13] of his scholar Mathie of Haarlem which he did always dislike (GGG), albeit whilst that doctrine of his scholar did pro­sper in Munster, he durst not much contradict it; but so soon as Munster was taken, and the chief authors of these violent te­nets were executed, he took then the boldness openly to cry down much of the way of the Monasterians, he preached for the office and power of the magistrate, and did chase away polyga­my (HHH); these were the grounds of the deadly feud betwixt Hoffman and Battenburg, and both their followers, which were many thousands of poor seduced souls. These of Hoffman’s party did not long agree among them­selves,Who were the Mennonites. one Menno the son of Simon a secular Priest (III) in West Friesland turning Anabaptist, began to criticize sundry things in Hoffman’s doctrine: he did reject all extraordinary and apostolic calling (KKK), also the dreams of the saints’ kingdom upon earth (LLL), and all enthusiasms (MMM), but in other things did follow the worst of the Anabaptists errors: denying the truth of Christ’s humanity, setting up Pelagianism in man’s free will, maintaining a perfect inherent righteousness without sin, and such like conceits (NNN). A Synod for union did divide them a­mongst them­selves more than ever. While the pestiferous vapor of this evil spirit was sensibly vanishing by domestic divisions, some of the wisest of the sect found ways to draw together the chief of all the four mentioned factions to a conference at Buckholt in West­phalia. A great synod of prime men from all countries where the Anabaptists lived did meet there; from the most places of lower Germany, from Friesland, from Saxony, from England also some did come (OOO). Great debates were among them, especially between the Battenburgicks and the Hoffmanites, the one defen­ding polygamy and their use of the sword against the world, the other opposing both. John Mathie of Middleburg a great do­ctor of the Anabaptists in England, was the chief champion of the Hoffmanites (PPP). Here it was where David George, a citizen of Delph, David Georgius labors for u­nion. did first become famous, this man had been a zealous opponent of pope­ry, he had openly in the streets upbraided both the priests and magistrates of Delph, in the very act of their idolatrous processi­on: for which bold zeal he was cast in prison, and had his tongue bored through, hardly escaping with his life (QQQ); these suf­ferings brought to him great respect among the Protestants at [Page 14] home, but thereafter turning Anabaptist he became the greatest and worst heretic to my mind that ever trod upon the earth. At the Synod of Buckholt he labored exceeding much to draw his brethren to concord; the Battenburgicks and Hoffmanites had so sharp debates about the magistrate, the earthly kingdom of the saints and polygamy, that hardly they could be kept from handy blows (RRR): David George did mediate between them, and drew it to this issue, that a mutual toleration being granted in the points controverted, in all other things they should hold one another for Brethren, and promote jointly the common cause of Anabaptism (SSS). This syncretism did not long stand, neither did David get thanks from either side for his mediation, for all did esteem him a colluder with both sides only for his own interests, driving a design of his own apart, differing from them all, which then was scarce visible above the ground, but quickly thereafter was apparent. A little after that synod all the parties did separate more then ever one from another as Antichristian and false believers (TTT), til the most of their sects did vanish: the Monasterians in a short time were drowned; of the Battenburgicks none does remain, except it be a handful in Moravia: for after the imprisonment and execution of their leader for his manifold robberies and murders, his followers were altogether broken. The Hoffmanites by the diligence of Bucer and Calvin at Strasburg being convinced received satisfaction and recanted their errors, joining themselves again to the Protestant Churches (VVV). The Georgians for a time did flourish, their leader David was a man very pragmatic, of a vehement and persuasive eloquence in the acts of devotion, for show singular, ardent and frequent in prayer (XXX), in fasting excessive, abstaining from all meat and drink sometimes four whole days and nights together (YYY): won­derfully confident of the absolute truth of his tenets, so marvel­ously bold that he did write and professed his hope by his letters and books to persuade the undeniable certainty of his dictates to the Emperor Charles the fifth, and to all the estates of the Empire (ZZZ), especially to the good Landgrave of Hesse, Phi­lip; yet his absurdi­ties were hor­rible. also to Melanchthon, to Bucer, to a Lasco, and many more: yet his tenets are so horribly absurd that Mohammad in his worst abo­minations was far below him, for he taught that in the godhead [Page 15] was no trinity of persons, but only three ways of manifestation, one in Moses, another in Jesus, a third in himself; that his person was as far above the person of Jesus, as Jesus was above Moses; that the writings of the prophets and apostles, that the doctrine of the law and gospel was all to be laid aside (AAAA) as childish and imperfect rudiments, to be dispelled as the twilight, by the beams of his far more perfect doctrine. One of the greatest perfections and singularities I mark in his doctrine is that which he much insists upon, the mortification of the flesh; to this he leads by a singular method, he looses the bands of matrimony, and all other natural and civil relations as things old and antiquated, which did oblige only during the time of Moses and of Jesus, but not under the clear light which his ministry had brought to the world; adulteries, fornications, incests, and most unspeakable villainies were so far from being any sins to him, that he did re­commend them to his most perfect scholars as acts of grace and mortification: he was given over to be possessed with so beastly a spirit in the justice of God for a recompense of his hypocrisy and blasphemous errors against the truth of God (BBBB). Notwithstanding of the unutterable absurdity of his way, yet this beast was confident that the whole world would submit to him, and in a short time would put into his hands without any violence all their power and wealth; and indeed at the beginning he got many families of good note to follow him with incredible zeal: for all of them were willing to dispose unto him their whole estates (CCCC), and were glad to seal his doctrine with their blood. In Delph when first they were put to a trial, seven and thirty most cheerfully did offer themselves to the executioner’s hands, some to be hanged, some drowned, some burnt (DDDD). Yet lest this zeal if too much tempted should at last succumb, the hypocritical heretic did alter one of his principles, and taught his scholars the lawfulness of dissimulation, permitting them for the safety of their life to deny and abjure what ever he had taught them, and giving them free liberty to join the public wor­ship with any of what ever religion among whom they li­ved (EEEE): by this means they got peace, and were no more any where persecuted. He himself retiring from Delph to Basel, his strange end did live there for several years until his death in great wealth and case (FFFF), as a fugitive for the true reformed religion; he [Page 16] did so perfectly dissemble, that he had the favor and good opi­nion both of the magistrates and ministers, without the least suspicion of any wickedness in him (GGGG); but three years after his death all his abominations were found out: and his di­ligence by letters, by secret conferences and messengers to propa­gate his evildoing way with his whole strength, whereupon his bones were dug up, and the remainder of his body burnt, as the relics of an inexpressibly wicked villain (HHHH). While all the other factions of the Anabaptists did decrease, the followers of the Priest Menno did much increase: they did reject the earthly kingdom and polygamy of the Monasterians and Battenburgicks, also the revelations and extraordinary calling of the Hoffmanites, with the most of the blasphemies of David George; against all these Menno did write with passion (IIII): But to the point of Anabaptism and separation from all other reformed Churches to independency, and to a number more of the Anabaptists tenets he did firmly adhere, alluring many thou­sands to his way, who continue to this day propagating their error to many Countries. The wickedness of that spirit which reigned in Menno, and yet rages in his followers, notwithstanding of all their profession of great piety, of singular modesty and extreme detestation of all the other sects of Anabaptists, is apparent in the manifold grievous heresies and gross schisms, whereinto they them­selves have of old broken out and persevere therein to this day. Who are pleased to read the late little accurate and learned Treatise of Clopenburgh, may perceive that the Mennonite dip­pers do oppose the truth of Christs human nature (KKKK), that they were masters to Vorstius in his denial of the omnipre­sence and simplicity of the divine essence and of the unchan­geableness of the divine decrees (LLLL): also that Armini­us was their scholar in all his errors concerning predestination, re­demption, grace, free will, and perseverance. Lastly, that Swenkfeld, Servetus, and Socinus did learn from them not only their Anabaptism, but their denial of the trinity, their abnegation of the godhead, both of the Son and of the Holy Ghost. (MMMM). The Mennonite schisms are no less palpable then their heresies, for however their harmony in the most of their errors be great [Page 17] enough, as in that confession of faith which in the year 1624. they set out in common it appears, wherein with many ambiguous and deceitful words they cover many of these tenets which in other writings they expressly maintain (NNNN), yet they are not able to cover their manifold schisms: for it has ever been their custom upon the smallest matters to fall into so vehement discords, as have made them excommunicate one another, and remain se­parations refusing communion one to another unto this day. Behold how small an occasion did bring them to no less then four irremediable fractions (OOOO): For a light cause four late separa­tions among them. one of the Mennonites at Franeker in a public roping did seem to use some cheating in buying of a house, preventing by some sleight of hand another man who before him had a mind to the bargain; this did so much displease some that they excommunicated the cheater; others defended the honesty of the man and did excommunicate them who for no cause as they conceived had put a censure upon him; hence two sects condemning one another to this day. To recon­cile both, a third party did arise, avowing that however the man in his bargain had used some piece of fraud, yet that it was not so gross as did deserve excommunication. In this accommodation these mid men proceeded so far, that they were excommunicated by both the dissenting parties, whereupon their passion was so stirred, that they did excommunicate them both also; and lest the number of their schisms should be too small, there sion did dissemble a num­ber of the gross heresies which some of the very subscribers in their public writings both before and after did hold out, it is even so with the English, for Hobson, Richardson, and others of the sub­scribers have already printed several errors which in that con­fession do not appear. Moreover these seven congregations can­not prescribe, and are no ways leaders to a great number of Ana­baptist churches over all the land; however I shall set down so many of their tenets as for the time comes to my thoughts from some little acquaintance with a few of their writs that have fallen into my hands.”

<div class="actions"><button class="copy" data-copy="“Thus far of ordinary Rules, and course of Ordination, in the ordinary way; that which concerns the extraordinary way, requisite to be now practised, followeth. 1. In these present exigencies, while we cannot have any presbyteries formed up to their whole power and work, and that many ministers are to be ordained for the service of the armies and navy, and to many congregations where there is no minister at all; and where (by reason of the publick troubles) the people cannot either themselves enquire and find out one who may be a faithful minister for them, or have any with safety sent unto them, for such a solemn trial as was before mentioned in the ordinary rules; especially, when there can be no presbytery near unto them, to whom they may address themselves, or which may come or send to them a fit man to be ordained in that congregation, and for that people; and yet notwithstanding, it is requisite that ministers be ordained for them by some, who, being set apart themselves for the work of the ministry, have power to join in the setting apart others, who are found fit and worthy. In those cases, until, by God’s blessing, the aforesaid difficulties may be in some good measure removed, let some godly ministers, in or about the city of London, be designed by publick authority, who, being associated, may ordain ministers for the city and the vicinity, keeping as near to the ordinary rules fore-mentioned as possibly they may; and let this association be for no other intent or purpose, but only for the work of ordination. 2. Let the like association be made by the same authority in great towns, and the neighbouring parishes in the several counties, which are at the present quiet and undisturbed, to do the like for the parts adjacent. 3. Let such as are chosen, or appointed for the service of the armies or navy, be ordained, as aforesaid, by the associated ministers of London, or some others in the country. 4. Let them do the like, when any man shall duly and lawfully be recommended to them for the ministry of any congregation, who cannot enjoy liberty to have a trial of his parts and abilities, and desire the help of such ministers so associated, for the better furnishing of them with such a person as by them shall be judged fit for the service of that church and people.”

— Westminster Assembly, Form of Presbyterial Church-Government | ‘The Directory for the Ordination of Ministers’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+far+of+ordinary+Rules%2C+and+course+of+Ordination%2C+in+the+ordinary+way%3B+that+which+concerns+the+extraordinary+way%2C+requisite+to+be+now+practised%2C+followeth.+1.+In+these+present+exigencies%2C+while+we+cannot+have+any+presbyteries+formed+up+to+their+whole+power+and+work%2C+and+that+many+ministers+are+to+be+ordained+for+the+service+of+the+armies+and+navy%2C+and+to+many+congregations+where+there+is+no+minister+at+all%3B+and+where+%28by+reason+of+the+publick+troubles%29+the+people+cannot+either+themselves+enquire+and+find+out+one+who+may+be+a+faithful+minister+for+them%2C+or+have+any+with+safety+sent+unto+them%2C+for+such+a+solemn+trial+as+was+before+mentioned+in+the+ordinary+rules%3B+especially%2C+when+there+can+be+no+presbytery+near+unto+them%2C+to+whom+they+may+address+themselves%2C+or+which+may+come+or+send+to+them+a+fit+man+to+be+ordained+in+that+congregation%2C+and+for+that+people%3B+and+yet+notwithstanding%2C+it+is+requisite+that+ministers+be+ordained+for+them+by+some%2C+who%2C+being+set+apart+themselves+for+the+work+of+the+ministry%2C+have+power+to+join+in+the+setting+apart+others%2C+who+are+found+fit+and+worthy.+In+those+cases%2C+until%2C+by+God%E2%80%99s+blessing%2C+the+aforesaid+difficulties+may+be+in+some+good+measure+removed%2C+let+some+godly+ministers%2C+in+or+about+the+city+of+London%2C+be+designed+by+publick+authority%2C+who%2C+being+associated%2C+may+ordain+ministers+for+the+city+and+the+vicinity%2C+keeping+as+near+to+the+ordinary+rules+fore-mentioned+as+possibly+they+may%3B+and+let+this+association+be+for+no+other+intent+or+purpose%2C+but+only+for+the+work+of+ordination.+2.+Let+the+like+association+be+made+by+the+same+authority+in+great+towns%2C+and+the+neighbouring+parishes+in+the+several+counties%2C+which+are+at+the+present+quiet+and+undisturbed%2C+to+do+the+like+for+the+parts+adjacent.+3.+Let+such+as+are+chosen%2C+or+appointed+for+the+service+of+the+armies+or+navy%2C+be+ordained%2C+as+aforesaid%2C+by+the+associated+ministers+of+London%2C+or+some+others+in+the+country.+4.+Let+them+do+the+like%2C+when+any+man+shall+duly+and+lawfully+be+recommended+to+them+for+the+ministry+of+any+congregation%2C+who+cannot+enjoy+liberty+to+have+a+trial+of+his+parts+and+abilities%2C+and+desire+the+help+of+such+ministers+so+associated%2C+for+the+better+furnishing+of+them+with+such+a+person+as+by+them+shall+be+judged+fit+for+the+service+of+that+church+and+people.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Form+of+Presbyterial+Church-Government+%7C+%E2%80%98The+Directory+for+the+Ordination+of+Ministers%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a46de8e3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4a46de8e3c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-extraordinary-acts-of-church-government-superintendents-assessor-elders-etc/#:~:text=Thus%20far%20of%20ordinary%20Rules%2C%20and,service%20of%20that%20church%20and%20people&amp;text=Thus%20far%20of%20ordinary%20Rules%2C%20and%20course%20of&amp;text=for%20the%20service%20of%20that%20church%20and%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-71da08c643" data-kw="">
<blockquote><p>Article 32. We believe that it is expedient, that they who be chosen superintendents in the Church, should wisely consult among themselves, by what means the whole body may conveniently be ruled, yet so as they do not swerve from that which our Lord Jesus Christ has instituted. And this does not hinder but that in some churches there may be those particular constitutions, which will be more convenient for them than for others.</p></blockquote>

</figure><figure class="quote" id="q-882295aa8e" data-kw="">
<blockquote><p>The Dutch superintendens are as like to English bishops as an emperor in the days of Fabius Maximus, when the senate ruled all, to an emperor in the days of Tiberius or Nero, when an absolute prince, I will not say a tyrant, did govern all at his pleasure. The name is one, but the things are essentially different, and so far distant as the East is from the West.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Historical Vindication of the Government of the Church of Scotland… (1646)</cite>, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Dutch superintendens are as like to English bishops as an emperor in the days of Fabius Maximus, when the senate ruled all, to an emperor in the days of Tiberius or Nero, when an absolute prince, I will not say a tyrant, did govern all at his pleasure. The name is one, but the things are essentially different, and so far distant as the East is from the West.”

— Robert Baillie, An Historical Vindication of the Government of the Church of Scotland… (1646), p. 79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Dutch+superintendens+are+as+like+to+English+bishops+as+an+emperor+in+the+days+of+Fabius+Maximus%2C+when+the+senate+ruled+all%2C+to+an+emperor+in+the+days+of+Tiberius+or+Nero%2C+when+an+absolute+prince%2C+I+will+not+say+a+tyrant%2C+did+govern+all+at+his+pleasure.+The+name+is+one%2C+but+the+things+are+essentially+different%2C+and+so+far+distant+as+the+East+is+from+the+West.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+An+Historical+Vindication+of+the+Government+of+the+Church+of+Scotland%E2%80%A6+%281646%29%2C+p.+79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F882295aa8e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/882295aa8e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-extraordinary-acts-of-church-government-superintendents-assessor-elders-etc/#:~:text=The%20Dutch%20superintendens%20are%20as%20like,the%20East%20is%20from%20the%20West&amp;text=The%20Dutch%20superintendens%20are%20as%20like%20to%20English&amp;text=distant%20as%20the%20East%20is%20from%20the%20West" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4cf11c097b" data-kw="">
<blockquote><p>As for the prelate, who is pretended to be the pastor of pastors and an ecclesiastical creature, having majority of power, both of order and jurisdiction above the pastor and doctor, the Church of Scotland did ever repute such an one the fifth element, and the sixth finger in the hand, as having no warrant in the Word, and therefore unlawful, Ex. 25:9; Heb. 8:5; 1 Chron. 8. 19. 11, 12, 13; 1 Kings 6:38, as also expressly condemned, Lk 22:24-26; 1 Pet. 5:3-4; Mt. 18:18; 1 Cor. 5:4-6; Acts 1:23; 15:24. In the first constitution and infancy of our Church there were some visitors and superintendents for planting of churches, because breasts and hair of our churches were not grown, after the example of the apostles, who sent such to plant and visit churches, and appoint elders in congregations, Acts 8:14-16; 13:14-16; 14:23; Tit. 1:5-9; 21:17-18, but after the Church was planted there was no need of such. Titular doctors, who were pastors only, and taught not in the schools, but were only previous dispositions to episcopacy, as [the] blue color prepares a cloth for purple, our Church never allowed, upon the grounds allowing lawful doctors, as the Scripture does, Rom. 12:7-8; 1 Cor. 12:28; Eph. 4:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (1642), ch. 20, 2nd Article, ‘Officers of the Church’</cite></span></figcaption>

</figure><figure class="quote" id="q-912ea869d0" data-kw="">
<blockquote><p>2. When we teach, that the pastor or pastors of every particular Church and congregation, with the elders of the same, being met together, have power to bind and loose, we understand this, only of such places wherein a competent number of understanding and qualified men, may be had to make up an eldership: otherwise let there be one eldership made up of two or three of the next adjacent parishes, according as was ordained by the Church of Scotland in the seventh chapter of the Second Book of Discipline [section 10]… …set some bounds to the execution of their power: which bounds we also think good to be kept, viz. that if a Church be so small that it has not so many well qualified men as may be sufficient to assist the pastor in the governement thereof, then let one common eldership be made up out of it and some other neighbor churches…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies... (1637), ch. 8, Digression 4</cite>, p. 189</span></figcaption>

</figure><figure class="quote" id="q-b5bdf9af74" data-kw="">
<blockquote><p>The Church of Rome did not meet in one place for celebrating the worship of God, there were more holy assemblies there in diverse places; there was a Church in the house of Aquila and Priscilla, Rom. 16:5. Paul when he was at Rome had holy Church assemblies in his own house, Acts 28:23, 30, 31, which yet was not that whole (collectively taken) and famous Church of the believing Romans, whose faith was famous through the whole world, Rom. 1:8. Other examples we meet with in the Scripture of Churches duly constituted according to God’s appointment, which met not in one place for exercising the worship of God, but did in diverse places under a common presbytery of diverse pastors perform holy duties. Hence also in our Belgic Churches in some greater towns, though there be more believers than can celebrate the holy worship of God and exercise other ordinances of Christ together in one place; yet they are not divided into several Churches, but do together make one visible Church, under the common presbytery and government of diverse pastors.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Church of Rome did not meet in one place for celebrating the worship of God, there were more holy assemblies there in diverse places; there was a Church in the house of Aquila and Priscilla, Rom. 16:5. Paul when he was at Rome had holy Church assemblies in his own house, Acts 28:23, 30, 31, which yet was not that whole (collectively taken) and famous Church of the believing Romans, whose faith was famous through the whole world, Rom. 1:8. Other examples we meet with in the Scripture of Churches duly constituted according to God’s appointment, which met not in one place for exercising the worship of God, but did in diverse places under a common presbytery of diverse pastors perform holy duties. Hence also in our Belgic Churches in some greater towns, though there be more believers than can celebrate the holy worship of God and exercise other ordinances of Christ together in one place; yet they are not divided into several Churches, but do together make one visible Church, under the common presbytery and government of diverse pastors.”

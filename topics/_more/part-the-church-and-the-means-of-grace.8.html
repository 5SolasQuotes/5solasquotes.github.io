<blockquote><p>Although I shall by Gods gracious assistance keep that station and distance from Popish errors where my judgement and conscience, guided by God’s Word, has set me, yet to leave the Romanists without excuse, as much as in me lies, I do most earnestly desire, and should most industriously promote, such a Christian and catholic accord as were most for the honor of Christ and the peace of Christendom. I know the youthful fervors of some are jealous of all such motions, and for fear of seeming lukewarm they resolve to boil over all bounds till they quench both truth and charity among Christians and make way for atheism, Turkism, confusion and barbarity. These hotter heads possibly dread what I calmly desire, that such a grand catholic convention of able ecclesiastics in these Western Churches might, by the consent of princes and chief magistrates, be so orderly convened with freedom, impartiality and due authority, as might enable them to consent in one canon or rule of Faith and good manners, that the clear and concurrent sense of Scriptures might be owned by all, in which all things necessary are contained either literally, or by just deductions; that what is dark or dubious should be left indifferently to Christians use and judgements; that all would agree in the same ancient fundamental articles of Faith, contained in primitive creeds, also in the same sacraments or holy mysteries, to be devoutly celebrated, so in the same way of good works to be practiced, that we might all have the same catechism, the same public liturgies, so composed that all Christians might with faith and charity say Amen to them and in their several languages understand them; that a commentary on Scriptures, and sermons containing all Christian necessary doctrine might be agreed upon, that neither curiosities nor controversies should be couched in public prayers or preachings, that all might enjoy the same catholic source and course of ecclesiastic ordination, ministry and authority, so tempering government and discipline in the Church, that none should justly think others too much exalted, nor themselves too much depressed, that catholic customs, ancient ceremonies and traditions, truly such, being consonant to God’s Word, and practically interpreting the meaning of it, might be observed by all, leaving yet such freedom in other things to particular Churches as might be most convenient, yet still subordinate to and to be regulated by the judgment of such a general council, contrary to which none should affect extravagant liberty to the ruin of Christian charity. Blessed Lord! What good Christian could be injured by such a Christian accord in the main concernments of religion, which cannot be impossible in the nature of the thing, because it was of old enjoyed, and many hundreds of years generally preserved among all Christians and Churches of any name and repute in all the world? Nor did either the heat of persecution or prosperity (as warm and soultry weather) dispirit this charity of Christians, who might still be as capable subjects of so great a blessing from God on earth, if passion, prejudice, partiality and private interests on all hands were laid aside, without parting with any true and real interest that concerns a wise or good man, either in conscience or honor, in civil or religious regards.</p></blockquote>

<blockquote><p>In this context researchers differentiate the colloquies on inaugurating reform in the early years of the Reformation (which were to prepare for the secular government’s decision to introduce new teaching and ecclesiastical practice or to legitimize such a decision) from the later religious dialogues that ideally aimed at a convergence of two religious parties. Contemporaries hardly noticed this difference… Despite all the parallels with the medieval process of disputation, sixteenth-century religious colloquies differed from the academic model at essential points… The representatives of the Reformation decisively rejected the syllogism of Scholasticism as a relevant structure for argumentation for determining theological truth and untruth. A hermeneutic based upon and drawn from Holy Scripture was to govern the establishing of the truth, not arguments based on major and minor premises.</p></blockquote>

<blockquote><p>The most significant attempts to overcome religious division between the old church and those desiring reformation were those colloquies that the emperor called at the level of the Holy Roman Empire of the German Nation. They took place in a twenty-year period beginning in 1540. Thereafter this type of imperial colloquy faded because the Religious Peace of Augsburg (1555) guaranteed adherents of the Augsburg Confession legal protection within the boundaries of their own territories. This essentially rendered further Catholic-Evangelical colloquies superfluous.</p></blockquote>

<blockquote><p>Bucer believed that in a face-to-face dialogue it would be easierto persuade one’s opponents of the truth… Bucer knew well that written documents were subjected to differing interpretations. His preference for public dialogue also influenced many of his written works, which adopted the literary genre of a fictional dialogue. In these works, he would exemplify how men of differing opinions could peaceably and gradually arrive at agreement on the truth. This gradual approach was illustrative of his pedagogy for persuading and teaching others the truth of God’s word… As Stupperich has asserted, for Bucer unity would result not from compromise but from the clarification of misunderstandings that enable a unity in the truth.</p></blockquote>

</figure><figure class="quote" id="q-517674f604" data-kw="">
<blockquote><p>Now indeed it would be most pleasing to us that the Supper be celebrated every month, provided that the more frequent use does not produce negligence. For while the greater part abstain from communion, the Church is in some measure scattered. Nevertheless, we would rather that the Church be invited monthly than only four times in the year, as is our custom. When I first came here [to Geneva], it was distributed only three times a year—and that so that between the Supper at Pentecost and that at the Nativity of Christ, seven whole months intervened. I preferred a monthly celebration; but since I could by no means persuade them, it seemed better to pardon the weakness of the people than to contend too stubbornly. Yet I took care that it should be entered in the public records that our custom was a faulty one, in order that a correction might be easier and freer for posterity.</p></blockquote>

</figure><figure class="quote" id="q-cfd38b358f" data-kw="">
<blockquote><p>As, then, in civility, there is a respect and reverence different from adoration, so it is in religion also… We neither submit our minds nor humble [bow] our bodies to the sacrament, yet do we render to it veneration (Cartwright on 1 Cor. 11, sect. 18), forasmuch as we esteem highly of it, as a most holy thing, and meddle [handle] reverently with it, without all contempt or unworthy usage. ‘Inanimate things’, says the Archbishop of Spalato, ‘may indeed be as sacred as you please, they do not deserve other honor from us except in a negative sense (Dr Rep. Eccl., bk. 7, ch. 12, num. 50), as that they be not contemned, nor unworthily handled. If it is said that we ought not to contemn the Word, yet has it not that respect given to it which the sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more than [the absence of] profanatio [profanation], I answer, as honor both in the positive and negative sense, has various degrees, and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted… for the greater regard of those things which are more immediately divine, we are not in the usage of them, to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly, divine, and which are not from God so immediately as the other, but more by the intervention of means; and thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking aught from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, ‘nothing here is human, but everything divine’ (Didoclav., ubi supra, p. 808); for Christ’s own words are, or at least should be spoken to us when we receive the sacrament, and the elements also are, by Christ’s own institution, holy symbols of his blessed body and blood; whereas the Word preached to us is but fixedly and mediately divine; and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of god, we are bidden try the spirits, and are required, after the example of the Bereans, to search the Scriptures daily, whether these things which we hear preached be so or not. Now we are not in the like sort to try the elements, and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us, that the sacrament given, according to Christ’s institution, is more merely and immediately divine than is the Word preached…</p></blockquote>

</figure><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (1645), ch. 6</cite>, p. 121</span></figcaption>

<blockquote><p>In the seventeenth century… The intention was to celebrate the eucharist six times a year; however, liturgical freedom led in some cases to an even lower frequency, sometimes only once a year.</p></blockquote>

<blockquote><p>It is so far from being a warrant and satisfying to a man’s conscience for approaching the Lord’s Table because the discipline of the church admits him, that even a man habitually gracious and prepared will not for ordinary adventure to approach it except he has made conscience of getting himself actually prepared and his graces put in exercise, and set apart some considerable time for that purpose.</p></blockquote>

</figure><figure class="quote" id="q-3aa0c37dcc" data-kw="">
<blockquote><p>The communion, or supper of the Lord, is frequently to be celebrated; but how often, may be considered and determined by the ministers, and other church-governors of each congregation, as they shall find most convenient for the comfort and edification of the people committed to their charge. And, when it shall be administered, we judge it convenient to be done after the morning sermon… Where this sacrament cannot with convenience be frequently administered, it is requisite that publick warning be given the sabbath-day before the administration thereof: and that either then, or on some day of that week, something concerning that ordinance, and the due preparation thereunto, and participation thereof, be taught; that, by the diligent use of all means sanctified of God to that end, both in publick and private, all may come better prepared to that heavenly feast.</p></blockquote>

<blockquote><p>Answer: 1. Some parcels of these epistles are written to Timothy and Titus as evangelists, such as none may now do but they only (2 Tim. 4:4; Tit. 1:3; 2 Tim. 1:5) and some other things which they gave in charge to elders. 2. Some things are written to them as Christians, as 1 Tim. 1:19; Tit. 3:3 and finaliter, or objectively, all is written for the Church’s good; but 3. the bulk of the epistle is written to them as elders, and is a rule of perpetual government, and especially, 1 Tim. 5:22; 2 Tim. 2:2, for these and the like they were to do with the presbytery, as is clear, 1 Tim. 4:14.</p></blockquote>

<blockquote><p>3. When God commands such offices to be in his house, which depend immediately upon his own immediate will of giving gifts essentially required to these offices, then these offices are so long in his Church as God is pleased by his immediate will to give these gifts; and when God denies these gifts essentially requisite, sure it is, his immediate will has altered and removed the office, not the will of the Church, so the Lord has altered and removed these offices and gifts of apostles, who could speak with tongues and seal their doctrine with miracles, evangelists, prophets extraordinarily inspired, gifts of healing, etc.</p></blockquote>

</figure><figure class="quote" id="q-1598a035d7" data-kw="">
<blockquote><p>The officers which Christ gave to his church were of two sorts—extraordinary ones advanced to a higher office in the church: such were apostles, prophets, and evangelists. The apostles were chief. These Christ immediately called, furnished them with extraordinary gifts and the power of working miracles, and with infallibility in delivering his truth; and, they having been the witnesses of his miracles and doctrine, he sent them forth to spread the gospel and to plant and govern churches. The prophets seem to have been such as expounded the writings of the Old Testament, and foretold things to come. The evangelists were ordained persons (2 Tim. 1:6 ), whom the apostles took for their companions in travel (Gal. 2:1 ), and sent them out to settle and establish such churches as the apostles themselves had planted (Acts. 19:22 ), and, not being fixed to any particular place, they were to continue till recalled, 2 Tim. 4:9. And then there are ordinary ministers, employed in a lower and narrower sphere; as pastors and teachers…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Eph.</cite>, 4:11</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-2455814659" data-kw="">
<blockquote><p>The apostles have preached the Gospel to us from the Lord Jesus Christ; Jesus Christ [has done so] from God. Christ therefore was sent forth by God, and the apostles by Christ. Both these appointments, then, were made in an orderly way, according to the will of God. Having therefore received their orders, and being fully assured by the resurrection of our Lord Jesus Christ, and established in the Word of God, with full assurance of the Holy Ghost, they went forth proclaiming that the kingdom of God was at hand. And thus preaching through countries and cities, they appointed the firstfruits [of their labours], having first proved them by the Spirit, to be bishops and deacons of those who should afterwards believe. Nor was this any new thing, since indeed many ages before it was written concerning bishops and deacons. For thus saith the Scripture in a certain place, ‘I will appoint their bishops in righteousness, and their deacons in faith.’ [Isa. 60:17 LXX]</p></blockquote>

</figure><figure class="quote" id="q-7bb5dc3c23" data-kw="">
<blockquote><p>Ordination appears to have been performed by apostles, by evangelists, and by a presbytery, Acts 6:6, and 14:23; Tit. 1:5; 1 Tim. 5:22, and 4:14: but never by private Christians. Could these [private Christians] ordain their pastors or other ecclesiastic officers, to what purpose did Paul leave Titus at Crete to ordain elders in every city? Or why did he write never a word about ordination to the people, in any of his epistles, but to their rulers?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters on the Constitution, Government &amp; Discipline of the Christian Church (d. 1787)</cite>, pp. 73-74</span></figcaption>

</figure><figure class="quote" id="q-9ee383f7db" data-kw="">
<blockquote><p>Let there be no strife between us and you, for we be brethren: and is not the Canaanite and the Perizzite yet in the land? O let it not be told in Gath, nor published in the streets of Ashkelon! Let it not be said that there can be no unity in the Church… It shall be no grief of heart to you afterward, that you have pleased others as well as yourselves, and have stretched your principles for an accommodation in Church government, as well as in worship, and that for the Church’s peace and edification; and that the ears of our common enemies may tingle (Act. 9:31) when it shall be said, ‘The Churches of Christ… have rest, and are edified, and walking in the fear of the Lord, and in the joy of the Holy Ghost are multiplied.’ Alas, how shall our divisions and contentions hinder the preaching and learning of Christ, and the edifying one another in love! Is Christ divided? says the apostle. There is but one Christ, yea the Head and the Body makes one Christ, so that you cannot divide the Body without dividing Christ. Is there so much as a seam in all Christ’s garment? Is it not woven throughout from the top to the bottom? Will you have one half of Israel to follow Tibni, and another half to follow Omri? O brethren, we shall be one in heaven, let us pack up differences in this place of our pilgrimage the best way we can. Nay, we will not despair of unity in this world. Has not God promised to give us ‘one heart and one way’? (Jer. 32:39; Eze. 11:19) And that Ephraim shall not envy Judah, and Judah shall not vex Ephraim, but they shall flee upon the shoulders of the Philistines toward the East, they shall spoil them of the East together? Isa. 11:13,14 Has not the Mediator (whom the Father hears always) prayed that all his may be one? (John 17:21) Brethren, it is not impossible, pray for it, endeavor it, press hard toward the mark of accommodation. How much better is it that you be one with the other Reformed Churches, though somewhat straitened and bound up, than to be divided though at full liberty and elbow-room?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty, Appendix</cite></span></figcaption>

</figure><figure class="quote" id="q-a4f0a417ed" data-kw="">
<blockquote><p>It may seem absurd to say that he ‘is in heaven’ while he still lives on earth. If it is answered that this is true about his divine nature, then this expression would mean something else—-namely, that while he was man he was ‘in heaven.’ I could point out that no place is mentioned here and that only Christ is distinguished from everybody else as far as his state is concerned, since he is the heir of the kingdom of God, from which the whole human race is banished. However, as very frequently happens, because of the unity of the person of Christ, what correctly applies to one of his natures is applied to another of his natures, and so we need seek no other solution. So Christ, who ‘is in heaven,’ has clothed himself in our flesh, so that by stretching out his brotherly hand to us he may raise us to heaven with himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John in Crossway Classic Commentaries, eds. Alister McGrath &amp; J. I. Packer (Wheaton, IL: Crossway, 1994), on Jn. 3:13</cite>, pp. 74-75</span></figcaption>

<blockquote><p>This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.</p></blockquote>

<blockquote><p>It appertains to the policy of the church to appoint the times when the sacraments shall be ministered. Baptism may be ministered whensoever the word is preached; but we think it more expedient that it be ministered upon the Sunday, or upon the [mid-week] day of prayers, only after the sermon; partly to remove this gross error by the which many deceived think that children are damned if they die without baptism; and partly to make the people assist the administration of that sacrament with greater reverence than they do. For we do see the people begin already to wax weary by reason of the frequent repetition of those promises.</p></blockquote>

<blockquote><p>But dost thou think that nothing ought to be determined concerning the place [for baptism]? Answer: Yea, seeing all things must be done in the Church comely and in order: and forasmuch as baptism is a part of the ministry of the Gospel, I think that one and the same place is to be used both for the Word and sacraments, so as baptism be ministered in the public congregation of the Church and with common prayer [mid-week], neither will I rashly admit those, I cannot tell what, cases of necessity, that some allege to the contrary.</p></blockquote>

</figure><figure class="quote" id="q-28a371500c" data-kw="">
<blockquote><p>Dr. Forbess goes about to warrant private baptism by Philip’s baptizing the eunuch, there being no greater company present, so far as we can gather from the narration of Luke, Acts 8. As likewise by Paul and Silas, their baptizing the goaler [jailer] and all his in his own private house, Acts 16. Touching the first of those places, we answer: 1. How thinks he that a man of so great authority and charge was alone in his journey? We suppose a great man traveling in a chariot must have some number of attendants, especially having come to a solemn worship at Jerusalem. 2. What Philip then did, the extraordinary direction of the Spirit guided him unto it, vv. 29, 39. As to the other place, there was in that time of persecution no liberty for Christians to meet together in temples and public places as now there is. Wherefore the example of Paul and Silas does prove the lawfulness of the like deed in the like case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies… (1637), pt. 3, ch. 6</cite>, p. 96</span></figcaption>

</figure><figure class="quote" id="q-001baf6d80" data-kw="">
<blockquote><p>Nor is it [baptism] to be administered in private places, or privately, but in the place of public worship, and in the face of the congregation, where the people may most conveniently see and hear; and not in the places where fonts, in the time of Popery, were unfitly and superstitiously placed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/westminster-directory-of-public-worship.html">Westminster Directory of Public Worship</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Administration of the Sacraments: and First, of Baptism</cite></span></figcaption>

</figure><figure class="quote" id="q-c14575093b" data-kw="">
<blockquote><p>But as public baptism is that which is now performed in the public place, where public ordinances are usually administered, the accustomed signs being given for the assembling of the congregation there, at such time when it is to be celebrated, so private baptism, on the contrary, is that which is done either in the place of public assembly when no public notice is duly given for the congregation to resort thither, or in a private house, where although many are present, yet it is not free, or at least its generally supposed it would not be civil for any Christian that will, though uninvited, to come to the ordinance of baptism there administered.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But as public baptism is that which is now performed in the public place, where public ordinances are usually administered, the accustomed signs being given for the assembling of the congregation there, at such time when it is to be celebrated, so private baptism, on the contrary, is that which is done either in the place of public assembly when no public notice is duly given for the congregation to resort thither, or in a private house, where although many are present, yet it is not free, or at least its generally supposed it would not be civil for any Christian that will, though uninvited, to come to the ordinance of baptism there administered.”

— Samuel Langley, ‘Whether (or if at all in what cases) Baptism may be now Administered Privately, not Publicly?’ 20 pp. being the bottom 2/3rds of the Epistle Dedicatory of Suspension Reviewed, Stated, Cleared &amp; Settled upon Plain Scripture-Proof: Agreeable to the former &amp; late constitutions of the Protestant Church of England &amp; other Reformed Churches… (London, 1658) no page numbers">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+as+public+baptism+is+that+which+is+now+performed+in+the+public+place%2C+where+public+ordinances+are+usually+administered%2C+the+accustomed+signs+being+given+for+the+assembling+of+the+congregation+there%2C+at+such+time+when+it+is+to+be+celebrated%2C+so+private+baptism%2C+on+the+contrary%2C+is+that+which+is+done+either+in+the+place+of+public+assembly+when+no+public+notice+is+duly+given+for+the+congregation+to+resort+thither%2C+or+in+a+private+house%2C+where+although+many+are+present%2C+yet+it+is+not+free%2C+or+at+least+its+generally+supposed+it+would+not+be+civil+for+any+Christian+that+will%2C+though+uninvited%2C+to+come+to+the+ordinance+of+baptism+there+administered.%E2%80%9D%0A%0A%E2%80%94+Samuel+Langley%2C+%E2%80%98Whether+%28or+if+at+all+in+what+cases%29+Baptism+may+be+now+Administered+Privately%2C+not+Publicly%3F%E2%80%99+20+pp.+being+the+bottom+2%2F3rds+of+the+Epistle+Dedicatory+of+Suspension+Reviewed%2C+Stated%2C+Cleared+%26+Settled+upon+Plain+Scripture-Proof%3A+Agreeable+to+the+former+%26+late+constitutions+of+the+Protestant+Church+of+England+%26+other+Reformed+Churches%E2%80%A6+%28London%2C+1658%29+no+page+numbers&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc14575093b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c14575093b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=But%20as%20public%20baptism%20is%20that,the%20ordinance%20of%20baptism%20there%20administered." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-1b02549668" data-kw="">
<blockquote><p>No baptism shall be administred but in Church assemblies or where there is a formed public Church. But where there is no public Church and the parents through infirmity are afraid to carry them unto public baptism in the congregation, ministers shall consult how far in prudence they ought to yield unto them. Yet nevertheless there shall be some face of a Church and both exhortation and prayer; but if there be no Church, and a congregation cannot be assembled, the minister shall not make any difficulty to baptize the infants of believing parents tendered to him, with exhortation and prayer.</p></blockquote>

<blockquote><p>As to that question, Whether baptism may be lawfully administred extraordinarily where the child is ready to die? It was resolved that in those places where the Word of God is ordinarily preached, the established order shall be observed; but in such places where sermons are had only extraordinarily, at an undue hour, it is left to the minister’s discretion to accommodate themselves to the infirmities of parents, yet to be very careful that they do not nourish them up in superstition.</p></blockquote>

</figure><figure class="quote" id="q-af723c8aa3" data-kw="">
<blockquote><p>10. On the 6th Article of the 11th Chapter [of The Discipline of the Reformed Chuches of France, 1559], a question was propounded by the Province of Higher Languedoc, Whether in case of grievous sickness, and the child being in apparent danger of death, he might be baptized on lecture-days, before sermon began, and whether baptism might be administred at such times when as there is no sermon preached, but only public common-prayers? It was answered that if the consistory, or any of the elders did attest the malady of the infant, the pastor might do it [the baptism]. And if the observation of this article should beget new difficulties, the provinces were intreated to come prepared unto the next national synod, for their assoiling of them.</p></blockquote>

</figure><figure class="quote" id="q-1709ebcbf5" data-kw="">
<blockquote><p>But since this sacrament [of baptism] is a solemn reception into the church of God, or rather a testimony of burghership in the heavenly city into which are enrolled all those whom God adopts for his children, above all things it is to be observed that it is not lawful to administer it except in the society of professed believers. Not that it is necessary to have a public temple, but assuredly it is indispensable that there should be a certain flock assembled, forming a body constituted as a church, and recognizing for its pastor, the person appointed to baptize. For should a child be baptized in private and without witnesses, the ceremony would in no wise correspond to the ordinance instituted by Jesus Christ, nor to the practice of the Apostles. It is then requisite that the child should be baptized in a society that keeps itself separate from the pollutions of Popery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of John Calvin, vol. 3 ed. Jules Bonnet trans. Marcus Gilchrist (Philadelphia: Presbyterian Board of Publication), Letter 368, ‘To John Paule’</cite>, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“But since this sacrament [of baptism] is a solemn reception into the church of God, or rather a testimony of burghership in the heavenly city into which are enrolled all those whom God adopts for his children, above all things it is to be observed that it is not lawful to administer it except in the society of professed believers. Not that it is necessary to have a public temple, but assuredly it is indispensable that there should be a certain flock assembled, forming a body constituted as a church, and recognizing for its pastor, the person appointed to baptize. For should a child be baptized in private and without witnesses, the ceremony would in no wise correspond to the ordinance instituted by Jesus Christ, nor to the practice of the Apostles. It is then requisite that the child should be baptized in a society that keeps itself separate from the pollutions of Popery.”

</figure><figure class="quote" id="q-128651e0cf" data-kw="">
<blockquote><p>For St. Paul’s baptizing in the house of the jailor had been more fit for him [John Whitgift], for unto his place it may be easily answered that Cornelius, having so great a family, as it is like he had, and besides that diverse soldiors underneath him, and further his friends and his acquaintance which he had called, had a competent number, and as many as would make a congregation, and as could commodiously be preached unto in one place. But the answer to both these examples, and other such like, as that St. Paul baptized in the house of Ananias [Acts 9] is easy. For there being persecutions at that time, so that it was not safe, neither for the minister nor for the people, to be seen, it was meet that they should do it in houses, which otherwise they would have done in open places: and then those houses which receive the congregation are not, as I have showed, for the time to be counted private houses: and further in places where the gospel has not been received, nor no church gathered, but one only household embracing the Gospel, I say in such a case, and especially in the time of persecution, where should the ministers preach, or minister the sacraments more conveniently than in that house where those professors of the gospel be? Now to draw this into our churches, which may safely come into open places, and where the church and congregation stands of diverse households, is a token of greate want of judgment, in shuffling those things together which, for the great diversity of their natures, will not be mingled.</p></blockquote>

<blockquote><p>First ‘private’ signifies that which is done privily in a clanculary [clandestine] manner by stealth, without authority contrary to God’s Word by Jesuits, seminary priests, schismatical teachers, and the like; in which sort, if any of our [antagonist] brethren mean, they prove nothing against us, for our [Anglican] Church generally condemns such conventicles, whether of heretics, or schismatics. Secondly, private baptism signifies in the meaning of the [Prayer] Book, that which is administered by a lawful minister at home, where the child is born, a competent number being assembled, the child being weak, the church or chapel far distant, the season of the year oversharp, the way very inconvenient, all which, or the like occasions, are matters of circumstance; the lawfulness of baptism is no way frustrated, nor made void, nor against God’s Word, nor a private action. For as one well notes, ‘Sacraments though they be in private places administered, yet are public actions.’ ([Andrew Willet] Synopsis Papismi, p. 490)</p></blockquote>

<blockquote><p>…when I preached at court before the [English] Queen’s majesty, and was speaking about the antiquity of the popish religion, I remember that I said this among other things, that our enemies, when they accuse our cause of novelty, both wrong us and deceive the people; for that they approved new things as if they were old and condemned as new things of the greatest antiquity; that their private masses and their mutilated communions, and the natural and real presence and transubstantiation, etc. (in which things the whole of their religion is contained) have no certain and express testimony either of holy scripture or ancient councils, or fathers, or of anything that could be called antiquity.</p></blockquote>

<blockquote><p>Herein now we disprove the papistical doctrine which allows of private masses and teaches that the priest offers up the body and blood of our Lord for the standers by; and that by the mass he applies the merit of redemption unto them that with devotion come to that sacrifice. For as there is no one word of the Lord extant that commands the priests to sacrifice or privately to apply the supper for others, or that promises anything unto them that stand by and look on it (for He says, “Do this; eat ye and drink ye all in the remembrance of me;” He says not, ‘Look upon the priests only while they be eating and drinking for you’)… … Concerning the place where the supper is to be celebrated, I find no contention has been amongst the most ancient ministers of the Church. It is read how that our Lord Jesus used the hall of a certain private man’s house. And also the apostle Paul both preached and brake bread at Troas in a certain dining-place (Acts 20)… At this present there seems no place to be more worthy or more commodious to celebrate the holy supper in, than that which is appointed for doctrine and prayer. For so have we learned of St. Paul, 1 Cor. ch. 11. Howbeit, if tyrannical power will not suffer us to have a church, what shall let us but that we may reverently celebrate the supper in honest private houses?</p></blockquote>

</figure><figure class="quote" id="q-2a35968f71" data-kw="">
<blockquote><p>Secondly, as this sacrament being a communion admonishes that we are all one in Christ: so it teaches that it is to be received of many together in the church, not of one alone, and therefore it overthrows the private masses of the church of Rome, where one partakes all and the rest of the Church nothing at all. There is a flat opposition between these two: so that the communion cannot be a private mass, and private mass cannot be a communion. That which is ordained and prepared for many, delivered unto many, and received of many, cannot stand with the mass, where the priest prepares for himself, not for the people: he speaks to himself, not to the church: he receives himself alone, not with his brethren: all which are directly contrary to the apostles rule, ‘Tarry one for another.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments… (London, 1606), bk. 3, ‘Of the Lord’s Supper’</cite>, p. 206</span></figcaption>

</figure><figure class="quote" id="q-d1233e8e1e" data-kw="">
<blockquote><p>Furthermore, did Christ deliver his Last Supper to all his disciples that were present? Did none stand by, and gaze on while other received? Then hereby fall to the ground the private communions of the popish Church, where all is devoured by the priest, nothing delivered to the people. For whereas the ordinance of Christ and ancient order of the church was for the minister and people to receive the sacrament together: among them the priest accompanied with his boy to make answer, receives the sacrament himself alone, without distribution made to others, yea although the whole congregation be present and look upon him, whereby God is dishonored, the communion is abolished, the people of God are there by deprived and robbed of all comfort. How is this a feast which the priest prepares for himself, not for others: receives by himself, not with his brethren: he speaks to himself, and not to the assembly: he uses a strange tongue, and no man knows what he means: the people is taught nothing, they understand nothing, they hear nothing, they receive nothing; and a few childish, apish, foolish, and unseemly gestures excepted, they see nothing: they taste nothing, they partake nothing, neither comfort of heart, nor memory of Christ, nor benefit of his passion. But Christ in his Last Supper, did not eat up all alone, but after the disciples had supped as Mathew sets it down, He took bread and blessed He brake and gave it to them, saying, ‘Take ye, eat ye:’ neither did He drink alone of the fruit of the vine, but taking the cup He gave thanks, and gave to them all, saying, ‘Drink ye all of this.’ So then, albeit a certain number of communicants are not limited and determined: yet Christ in these words appoints a company to be present, as appears by the number, ‘take ye, eat ye,’ ‘drink ye all,’ ‘divide ye it among yourselves,’ ‘do ye this in my remembrance,’ ‘ye set forth the Lord’s death,’ ‘when ye come together to eat,’ ‘tarry ye one for another,’ ‘as often as ye shall eat this bread.’ These words cannot be understood of one particular man, but necessarily import a greater number of men: nay, the Philosopher teaches that the word ‘all’ must be verified at the least of the number of three, which is the least and lowest number that would be admitted to this supper. Neither do we read that so soon as one was gained to the faith, that the apostles administered this sacrament to him, much less would they minister to themselves alone, when none were converted in a nation or city.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments… (London, 1606), bk. 3, ‘Of the Lord’s Supper’</cite>, pp. 276-77</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-b72f941944" data-kw="">
<blockquote><p>Lastly, the names given to this sacrament, noting the nature thereof, do afford us a good consideration to strike through the heart of this private mass, being called sometimes the Supper of the Lord, and sometimes a Communion among ourselves. If it be an holy supper and spiritual banquet, why are none bidden and called thereunto? If it be a communion, why does the priest uncharitably swallow all alone? whereby they make it a communion, but without company: a supper, but without guests: meat, but without eating: drink, but without drinking: a table, but without sitting down: a participation, but without any that are partakers: a banquet, but without seeding thereat, the people departing as hungry and thirsty as they came. Wherefore, as no man celebrated the Passover aright, or received profit thereby, but such as did eat the flesh thereof: so can none come to the supper of the Lord as he ought, though he look upon others, except he eat of the bread and drink of the cup, according to the commandment of Christ, the author thereof. And thus much of the sole communions and private masses brought into the church against the example of Christ against the use of the apostles, and against the name and nature of the sacrament itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments… (London, 1606), bk. 3, ‘Of the Lord’s Supper’</cite>, pp. 278-79</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

<blockquote><p>The same prelate pleads for the expediency of giving the Communion to the sick in private houses, because he thinks they should not want [lack] this mean of comfort: As if the wanting of the sacramental signs, not procured by a man’s own negligence or contempt, could stop or stay the comforts of the Holy Spirit. Nay, it is not so: we have seen some who received not the Communion in time of their sickness, end more gloriously and comfortably than ever we heard of any who received the sacrament for their viaticum [journey] when they were a dying.</p></blockquote>

<blockquote><p>From baptism, you [Gilbert Burnet] pass to plead for the private administration of the Communion to persons on death-bed, and this you think the seasonableness of its use and the propriety of its ends to such a case do abundantly persuade: To which I answer: 1. That though at no time faith and love need more to be quickened, the death of Christ more to be remembered, nor communion with the Church to be declared, than in the approach of the last pangs, it will not thence follow that therefore the Communion may then be privately administrat[ed]: for, since not the seasonableness of the fruits, but the warrant and rule given unto us is first to be heeded in the going about of holy administrations; nay, since that without this regard duly adhibit the blessing and fruits are but in vain expected, it is evident that barely from the exigence of the fruits to conclude, in any case, the lawfulness of the celebration, is preposterous religion and worse reason: Now 2. That the rule set down to us in this sacrament does reprobate this your observance is evident not only from that connection that there is and ought to be observed betwixt the word and Sacraments: But, 1. From our Lord’s own pattern in the institution, keeping this solemnity with the company of his disciples, making as it were a little Christian Church: 2. Because the apostle in his regulation of this sacrament, according and with respect to his Master’s pattern, does suppose the Church’s coming together into one place, and consequently the ordinary Church assemblies, as a necessary requisite in the free and peaceable times of the Church: 3. Because the very mystery of the Lord’s Supper, representing the union of believers with and their communion in Jesus Christ their Head and the name that it has thence obtained, 1 Cor. 10:16-17, is not well consistent with this private administration: ‘Tis true, the authors of your [Perth] Articles, not being able to decline the convincing evidence of this reason, do, among other preparations, require that there be three or four, free of lawful impediments, present with the sick person to communicate with him; but as such a packed conventicle, beside other inconveniences, has no just resemblance of the Church her ordinary assemblies, much less can communicating with hand-wealed companions be a sign of that free, equable and comprehensive communion signified by this sacrament; so, it is manifest, that the forementioned requisite is only a colorable evasion, manifestly acknowledging the force of our argument, andin fraudem Legis, salvis verbis sententiam ejus circumveniens: But 3. This your private Communion is to be reprobate because, as the decumbent’s faith, love, and other graces in that hour of his need are only best excited by the means at that time allowed and competent, and the sanctified remembrance and improvement of other privileges and ordinances formerly enjoyed, so, it is certain, that this observance has not only been abused by the Papists unto the abomination of their private mass, but is also rejected by the Reformed Churches, not Lutheran, as found to be inductive of vain superstition wherever it is used; and for this I need not go far in search of confirmations, for you yourself in telling us that your practice was very early in the Church, subjoin that Justin Martyr says they sent of the Eucharist to them that were absent, and that the story of Serapion shows how necessary Christians then thought it to be guarded by this holyviaticum[journey], which two instances, whether true or false, being generally held to be an excess, both inclining to and introductive of vain superstition, and therefore, reckoned among the first Naevi [novelties] appearing in the face of the primitive Church, and now generally disused by all the Churches of Christ, as they are by you adduced, do to evidently demonstrate how much both your spirit and customs do bend to a relapse in these evils.</p></blockquote>

<blockquote><p>Controversy 11 – Should the holy Supper for convenience be celebrated by the sick in private dwellings? We deny against the Lutherans. Arguments: 1. Christ only administered the Supper in the assembly of the disciples. 2. Paul wanted us to gather together and to wait on one another (1 Cor. 11:33). 3. The Supper seals communion of many with Christ, because all are partakers of the one bread. Objections: 1. Christ performed it in private houses. Reply: But the Church gathered there. 2. The sick need the confirmation of their faith. Reply: From the Word of God, and they can have that confirmation from a Supper they have taken previously. Controversy 12 – Should the leftover bread and wine from the holy Supper be kept in vases or containers to be solemnly carried around to the sick and for other similar uses? We deny against the Papists. Arguments: 1. The water of baptism cannot be carried around this way, for many were baptized in a river (Acts 8:38); therefore, the bread of the Supper should not be either. 2. It is only a sacrament when it is used, and it has no greater sanctity outside of that use than any other bread. 3. There is no example or institution of it in the Word of God. Objections: 1. It is the body of Christ. Reply: No. The body of Christ is not bread. 2. It is the cup of the New Testament. Reply: Insofar as it is a sign and seal of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 17, ‘The Sacraments’</cite>, p. 238</span></figcaption>

es.github.io%2Fquote%2F873da605b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/873da605b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Controversy%2011%20%E2%80%93%20Should%20the%20holy,a%20sign%20and%20seal%20of%20it." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ae377637cb" data-kw="">
<blockquote><p>Neither can ye also of this matter, or of any my words gather that any part that remains after the receiving of the sacrament should be worshipped. For whatsoever strength the outward signs in the sacraments have, they have it of the Holy Ghost, of the Lord’s words, and of his institution and ordinance. Which things do no longer remain than while the use and receiving of the sacrament does continue. And the promise of God is applied to this sacrament whiles we eat and drink the sacrament. Wherefore that opinion and doctrine of reserving the sacrament was not catholic, nor universally used or received in the Christian congregations… We do not deny but that the leavings of the sacrament were sometimes reserved and kept: but it was done without any worshipping of it, and without any superstitious points of reverence. The leavings of this sacrament were delivered to children and to women to be carried to sick folk, as it is plain in the history of Eusebius and in Jerome, one of the doctors of the Church. And I would somewhat stagger to say the receiving of such leavings being done privately out of the holy company, and without the order and manner of receiving the communion instituted of Christ, was a right, a full and a perfect receiving of the communion or of the sacrament, which receiving of the sacrament among the sick folks I could yet nevertheless grant unto, so that the same do repeat the holy words of Christ and so ye some honest Christians do there among themselves put in use the ordinance of Christ in this behalf. For except more persons than one alone do receive the communion together: the due order and course of receiving this sacrament is not observed and kept. Christ’s words were to more than one, in this sort: Accipe, edite et bibite: that is to say, ‘Take ye, eat ye, and drink ye.’ There is bread broken into sundry pieces, which thing means that it should be dealed about and distributed to more than one. And they speak many things in their canon of the old mass, which unless a number do receive it together, are stark false and very lies. And besides this, it is called of learned men, coena, a supper, communio, a communion, and synaxis, a gathering or coming together: which names do nothing agree with a private action or doing of one person alone by himself. Neither do we in any place read in old writers of any private masses where one alone might receive the sacrament without the company of others. Honorius, bishop of Rome, was the first that made a decree that the sacrament of eucharistia should be reserved and kept and decreed further, that honor and reverence should be done to it, when it was carried abroad any whither. That if this thing had been done of others before his days, it had not belonged unto him to make a decree of any such thing. And to speak in a brief sum, we affirm and hold (as we have before said) that this sacrament has not his full strength and virtue and efficacy but whiles it is in doing and in executing, and whiles it is in receiving: which thing you see also to be done in all the other sacraments [such as the brazen serpent].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse or Treatise… concerning the Sacrament of the Lord’s Supper (London, 1550)</cite>, p. lxxi</span></figcaption>

ne. And they speak many things in their canon of the old mass, which unless a number do receive it together, are stark false and very lies. And besides this, it is called of learned men, coena, a supper, communio, a communion, and synaxis, a gathering or coming together: which names do nothing agree with a private action or doing of one person alone by himself. Neither do we in any place read in old writers of any private masses where one alone might receive the sacrament without the company of others. Honorius, bishop of Rome, was the first that made a decree that the sacrament of eucharistia should be reserved and kept and decreed further, that honor and reverence should be done to it, when it was carried abroad any whither. That if this thing had been done of others before his days, it had not belonged unto him to make a decree of any such thing. And to speak in a brief sum, we affirm and hold (as we have before said) that this sacrament has not his full strength and virtue and efficacy but whiles it is in doing and in executing, and whiles it is in receiving: which thing you see also to be done in all the other sacraments [such as the brazen serpent].”

— Peter Martyr Vermigli, A Discourse or Treatise… concerning the Sacrament of the Lord’s Supper (London, 1550), p. lxxi">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNeither+can+ye+also+of+this+matter%2C+or+of+any+my+words+gather+that+any+part+that+remains+after+the+receiving+of+the+sacrament+should+be+worshipped.+For+whatsoever+strength+the+outward+signs+in+the+sacraments+have%2C+they+have+it+of+the+Holy+Ghost%2C+of+the+Lord%E2%80%99s+words%2C+and+of+his+institution+and+ordinance.+Which+things+do+no+longer+remain+than+while+the+use+and+receiving+of+the+sacrament+does+continue.+And+the+promise+of+God+is+applied+to+this+sacrament+whiles+we+eat+and+drink+the+sacrament.+Wherefore+that+opinion+and+doctrine+of+reserving+the+sacrament+was+not+catholic%2C+nor+universally+used+or+received+in+the+Christian+congregations%E2%80%A6+We+do+not+deny+but+that+the+leavings+of+the+sacrament+were+sometimes+reserved+and+kept%3A+but+it+was+done+without+any+worshipping+of+it%2C+and+without+any+superstitious+points+of+reverence.+The+leavings+of+this+sacrament+were+delivered+to+children+and+to+women+to+be+carried+to+sick+folk%2C+as+it+is+plain+in+the+history+of+Eusebius+and+in+Jerome%2C+one+of+the+doctors+of+the+Church.+And+I+would+somewhat+stagger+to+say+the+receiving+of+such+leavings+being+done+privately+out+of+the+holy+company%2C+and+without+the+order+and+manner+of+receiving+the+communion+instituted+of+Christ%2C+was+a+right%2C+a+full+and+a+perfect+receiving+of+the+communion+or+of+the+sacrament%2C+which+receiving+of+the+sacrament+among+the+sick+folks+I+could+yet+nevertheless+grant+unto%2C+so+that+the+same+do+repeat+the+holy+words+of+Christ+and+so+ye+some+honest+Christians+do+there+among+themselves+put+in+use+the+ordinance+of+Christ+in+this+behalf.+For+except+more+persons+than+one+alone+do+receive+the+communion+together%3A+the+due+order+and+course+of+receiving+this+sacrament+is+not+observed+and+kept.+Christ%E2%80%99s+words+were+to+more+than+one%2C+in+this+sort%3A+Accipe%2C+edite+et+bibite%3A+that+is+to+say%2C+%E2%80%98Take+ye%2C+eat+ye%2C+and+drink+ye.%E2%80%99+There+is+bread+broken+into+sundry+pieces%2C+which+thing+means+that+it+should+be+dealed+about+and+distributed+to+more+than+one.+And+they+speak+many+things+in+their+canon+of+the+old+mass%2C+which+unless+a+number+do+receive+it+together%2C+are+stark+false+and+very+lies.+And+besides+this%2C+it+is+called+of+learned+men%2C+coena%2C+a+supper%2C+communio%2C+a+communion%2C+and+synaxis%2C+a+gathering+or+coming+together%3A+which+names+do+nothing+agree+with+a+private+action+or+doing+of+one+person+alone+by+himself.+Neither+do+we+in+any+place+read+in+old+writers+of+any+private+masses+where+one+alone+might+receive+the+sacrament+without+the+company+of+others.+Honorius%2C+bishop+of+Rome%2C+was+the+first+that+made+a+decree+that+the+sacrament+of+eucharistia+should+be+reserved+and+kept+and+decreed+further%2C+that+honor+and+reverence+should+be+done+to+it%2C+when+it+was+carried+abroad+any+whither.+That+if+this+thing+had+been+done+of+others+before+his+days%2C+it+had+not+belonged+unto+him+to+make+a+decree+of+any+such+thing.+And+to+speak+in+a+brief+sum%2C+we+affirm+and+hold+%28as+we+have+before+said%29+that+this+sacrament+has+not+his+full+strength+and+virtue+and+efficacy+but+whiles+it+is+in+doing+and+in+executing%2C+and+whiles+it+is+in+receiving%3A+which+thing+you+see+also+to+be+done+in+all+the+other+sacraments+%5Bsuch+as+the+brazen+serpent%5D.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+A+Discourse+or+Treatise%E2%80%A6+concerning+the+Sacrament+of+the+Lord%E2%80%99s+Supper+%28London%2C+1550%29%2C+p.+lxxi&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae377637cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae377637cb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Neither%20can%20ye%20also%20of%20this,sacraments%20%5Bsuch%20as%20the%20brazen%20serpent%5D." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8424af3a24" data-kw="">
<blockquote><p>Do you think that the Supper of the Lord ought to be celebrated in any other place than in the common and public congregation? Answer: This was a custom in the beginning of the old Church, that the sacrament should be sent by deacons to the sick that were absent from the public meeting, that is to say, at that time that the mysteries were celebrated of the rest in that meeting, because it was meet that those whom one disease did let [prevent] to be present in body, should be accompted as if they were present: neither do I doubt but that that thing brought great comfort to those that were sick, the which custom I would very gladly [wish it] were restored. But whether it be meet to be celebrated to the sick at that time when the Supper of the Lord is not ministred in the Church, of this I greatly doubt. … Notwithstanding I do acknowledge that in this case it is somewhat diverse. For although it were very meet that these mysteries throughout [the] whole [of] Christendom, albeit in diverse places, yet notwithstanding daily also if it were possible, or at least upon appointed and set days were celebrated, which should profit very much to the witnessing of that same mutual fellowship and consolation in Christ: notwithstanding forasmuch as neither of both can be obtained for many just and necessary causes it seems, I know not in what sort to be contrary to the institution of the Supper of the Lord, that all the rest of the Church omitting it, some one house extraordinarily should celebrate those mysteries. Moreover, unless that were done amongst all those that were sick, how shall the suspicion of partiality in respecting of persons be shunned? Now if the Supper of the Lord be to be ministered amongst all that are sick, let pastors see by what means the profanation thereof may be avoided and how they may satisfy and undergo so great labors. The custom therefore of certain [persons] do nothing at all [to] move me, although that it be very ancient, because the matter is to be judged not by examples, but by reasons… But if a man think that he can shun all these inconveniences, and think that those mysteries may be ministred to a sick man in the congregration, he requiring it, upon these conditions I would not be against this custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 242, ‘Of the Celebration of the Supper of the Lord in Private Houses besides the Time of the Ecclesiastical Meeting’ in The Other Part of Christian Questions &amp; Answers, which is Concerning the Sacraments (London, 1580), no page numbers</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-2a2fa673ee" data-kw="">
<blockquote><p>In the time of Justin the Deacon some did carry that which was left of the Communion, at what time the Lord’s Supper was celebrated, to them which were absent by reason of their disease, from the public assembly or unto strangers, and outlandish bishops into their inn. And as Eusebius reports (Church History, Ch. 5, bk. 24), the bishop of Rome was wont to do so, but without superstition, and for no other end but for a token of concord and consent in doctrine and in the whole profession: but because we say that we must not so much enquire whether those fragments were sent, or but whether they were well sent. And that custom has degenerated into superstition, whereby at this day the host is carried to them alone which are about to die, and that for certain gain and advantage, as also in a vain persuasion of a certain necessary provision for their journey, that custom of carrying the Supper to the absent, is worthily taken away in our Churches. Cyprian in the administration of this sacrament, ‘We ought to do no other thing than that which Christ did.&#x27;</p></blockquote>

<blockquote><p>And those things which are commanded [in the Book of Common Prayer respecting a Communion for the sick, with a minister and three or four Christians] in this behalf do well enough agree with the Holy Scriptures: for to receive the Communion of the Lord, and to be partaker of his Table, does not a little avail unto the comfort of afflicted consciences, if it be received according to the Lord’s institution.</p></blockquote>

<blockquote><p>His second objection is that the Lord’s Supper is not given to the sick at their homes. I wish that they [the Lutherans] had gone before us in this with a purer example. Had they been careful to adapt their practice to the genuine rule of Christ, we would willingly have followed them. But since nothing is less accordant with the doctrine of our heavenly Master than that the bread should be carried about in procession like cakes in a fair, and then that one individual should receive in private and eat apart, disregarding the law of communicating, pious and learned men were from the very first much averse to private dispensations of the Supper. Nothing, therefore, can be more absurd than Westphal’s calumny, that owing to the crafty counsel of Satan, poor souls are deprived of consolation. For we [the Genevan Church] carefully recall to the remembrance of the sick the pledge of life which was once deposited with us, that they may thence confirm their faith, and borrow weapons for the spiritual combat. In short, we herein profit so far that the Supper received in the public assembly, according to the ordinance of Christ, supports them with present consolation not less effectually than if they were to enjoy it privately without communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Defense of the… Sacraments, in Answer to the Calumnies of Joachim Westphal (1556) in Tracts, containing Treatises on the Sacraments… vol. 2 tr. Henry Beveridge (Edinburgh: Calvin Translation Society, 1849)</cite>, pp. 320-21</span></figcaption>

<blockquote><p>Many and weighty reasons move me to think that the Lord’s Supper ought not to be denied to the sick. Meanwhile, I see how very easily this practice has fallen into many abuses, which ought prudently and diligently to be prevented. For unless there be a true communion, it departs wrongly from the sacred institution of Christ. Therefore, there ought to be some gathering of persons — of relatives, friends, and neighbors — so that the distribution may be made according to the command of Christ; then the action should be joined with an explanation of the mystery, and nothing should be done that differs from the ordinary order of the Church. To carry it about here and there indiscriminately is also very dangerous. And here it is most difficult to guard against the danger, lest superstition move some, and ambition or vain display move others, to request it. Therefore there is need of judgment and discretion, that it be given to none except in great peril of life. To bring bread from the temple as if it were sacred is a perverse inversion; and to carry it in procession is in no way to be tolerated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Question of some Ecclesiastical Rites’ (1561) in Opera, vol. 10, pt. 1, Consilia, col. 213 tr. ChatGPT-5</cite></span></figcaption>

0tolerated." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>If any good Christian visited with long sickness and known to the pastor, by reason of his present infirmity [be] unable to resort to the church for receiving of the holy Communion, or being sick shall declare to the pastor upon his conscience that he thinks his sickness to be deadly, and shall earnestly desire to receive the same in his house: The minister shall not deny to him so great a comfort, lawful warning being given to him upon the night before, and that there be three or four [persons] of good religion and conversation, free of lawful impediments, present with the sick person to communicate with him, who must also provide a convenient place in his house and all things necessary for the reverend administration thereof, according to the order prescribed in the Church.</p></blockquote>

<blockquote><p>…nor does the [Westminster] Directory [for the Public Worship of God] anywhere forbid the administering of the Communion unto those that are sick in private houses; though if it had so done, it might have justified itself by the example of many of the best Reformed Churches. Let Mr. [John] Durel when he is at leisure, enquire whether one of the Assembly of divines did not administer the sacrament to captain Hotham when he was just going to be beheaded? or whether he was ever censured for so doing?</p></blockquote>

</figure><figure class="quote" id="q-997e1d62c0" data-kw="">
<blockquote><p>Can these men [dissenters]… prove in this sense we maintain a private Communion? These terms were never known to fit our church doctrine, till those first moniters and the heirs of their scruples… The Gentle Admonition [to the Parliament, 1572, by Cartwright and the presbyterians] that was the first bate for this idle debate, then rawly entered, since over hotly followed (but vainly, and unfruitfully God He knows, and we deplore) makes this an occasion of their lamentable separation. Ye should first prove (say they) that the private communion is agreable to the Word of God. And is it not reason they should first prove that we enjoin a private communion, before they enjoin us to prove what they now reprove?</p></blockquote>

</figure><figure class="quote" id="q-80b701bb47" data-kw="">
<blockquote><p>In the [Scottish] Book of Common Order [‘The Order of Baptism’]… it is said that the sacraments are not ordained of God to be used in private corners, as charmers and sorcerers use[d] to do, but left to the congregation, and necessarily annexed to God’s Word as seals of the same. In the [general] assembly holden at Edinburgh… [Oct. 17,] 1581 [session 3], it was ordained that the sacraments be not ministered in private houses, but solemnly, according to the good order hitherto observed. But in the late pretended assembly holden at Perth, anno 1618, it was ordained [in its Acts] that the minister shall not refuse to baptize infants in private houses when great need compels the parents to crave it, but the great need is not specified, and therefore left to the judgement of every corrupt minister who shall be willing to pleasure his parishoner upon pretence of any alleged necessity, as a rainy day, or the saving of some charges [expenses], as a dinner, etc. Such like the minister must not refuse to administrate the communion in a private house beside him… It is required only that there be three or four of good religion and conversation present to communicate with him. But, which shakes all loose, these must be free of all impediments. What if they be not free? What suppose there were forty, let be four, if it be not celebrated in the congregation, it is but a private communion. … 2. …Because we cannot attain to a visible communion in the holy things of God immediately with the whole Church-militant, we enjoy it mediately by our communion in a particular congregation… … He [Dr. Lindsay] wrests also that place in Matthew [ch. 18], where Christ promised to be in the midst of two or three convened in his name, as if three or four convened to the administration of baptism or the Lord’s Supper, were a sufficient number to make up a lawful assembly… Christ speaks not there, as Master [Thomas] Cartwright has already answered, of the public administering of the Word and sacraments, but of the proceeding in the Church discipline. … It is a sinew of public assemblies, a hedge of our profession, a band of love and representation of our communion and fellowship, which is and ought to be among the members of the congregation. It is not a part, or two, or three, but the whole body of the congregation which is compared to one bread, when the apostle says, ‘We that are many are one bread, and one body, for we are partakers afore bread,’ 1 Cor. 10:17. Because it is not possible to us to celebrate a sacramental union with the whole Church militant, the Lord has appointed us to keep a sacramentall communion with some particular congregation or visible Church. … A company convened apart from the rest to communicate with the sick person is not united by themselves into the body of a Church, far less three of four, as take, the English [Anglican] service book means to be a number sufficient, seeing they allow the communion to be ministred to three or four in the Church, and in the time of plague, sweat, or such other like contagious sicknesses, the minister may communicate with the person diseased alone… says Bullinger (Decade 5, sermon 9). That is, ‘Seeing it is not a public or general meeting, when three or four communicate with the sick, they say nothing to purpose who say, that the supper may be celebrated beside the sick, if others also communicate.’ … The elements were sent to the absents in time, or immediately after the action in Justin Martyr’s time. Which was the first abuse we read of. After followed reservation of the eucharist for the use of the sick, which was a greater abuse, and carrying of it home to their houses. The opinion of the necessity of private communions did grow to such a height…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618… (1636), ‘Of the Administration of the Sacraments in Private Places’</cite>, pp. 221-22, 224-25, 230-33</span></figcaption>

2%80%A6+He+%5BDr.+Lindsay%5D+wrests+also+that+place+in+Matthew+%5Bch.+18%5D%2C+where+Christ+promised+to+be+in+the+midst+of+two+or+three+convened+in+his+name%2C+as+if+three+or+four+convened+to+the+administration+of+baptism+or+the+Lord%E2%80%99s+Supper%2C+were+a+sufficient+number+to+make+up+a+lawful+assembly%E2%80%A6+Christ+speaks+not+there%2C+as+Master+%5BThomas%5D+Cartwright+has+already+answered%2C+of+the+public+administering+of+the+Word+and+sacraments%2C+but+of+the+proceeding+in+the+Church+discipline.+%E2%80%A6+It+is+a+sinew+of+public+assemblies%2C+a+hedge+of+our+profession%2C+a+band+of+love+and+representation+of+our+communion+and+fellowship%2C+which+is+and+ought+to+be+among+the+members+of+the+congregation.+It+is+not+a+part%2C+or+two%2C+or+three%2C+but+the+whole+body+of+the+congregation+which+is+compared+to+one+bread%2C+when+the+apostle+says%2C+%E2%80%98We+that+are+many+are+one+bread%2C+and+one+body%2C+for+we+are+partakers+afore+bread%2C%E2%80%99+1+Cor.+10%3A17.+Because+it+is+not+possible+to+us+to+celebrate+a+sacramental+union+with+the+whole+Church+militant%2C+the+Lord+has+appointed+us+to+keep+a+sacramentall+communion+with+some+particular+congregation+or+visible+Church.+%E2%80%A6+A+company+convened+apart+from+the+rest+to+communicate+with+the+sick+person+is+not+united+by+themselves+into+the+body+of+a+Church%2C+far+less+three+of+four%2C+as+take%2C+the+English+%5BAnglican%5D+service+book+means+to+be+a+number+sufficient%2C+seeing+they+allow+the+communion+to+be+ministred+to+three+or+four+in+the+Church%2C+and+in+the+time+of+plague%2C+sweat%2C+or+such+other+like+contagious+sicknesses%2C+the+minister+may+communicate+with+the+person+diseased+alone%E2%80%A6+says+Bullinger+%28Decade+5%2C+sermon+9%29.+That+is%2C+%E2%80%98Seeing+it+is+not+a+public+or+general+meeting%2C+when+three+or+four+communicate+with+the+sick%2C+they+say+nothing+to+purpose+who+say%2C+that+the+supper+may+be+celebrated+beside+the+sick%2C+if+others+also+communicate.%E2%80%99+%E2%80%A6+The+elements+were+sent+to+the+absents+in+time%2C+or+immediately+after+the+action+in+Justin+Martyr%E2%80%99s+time.+Which+was+the+first+abuse+we+read+of.+After+followed+reservation+of+the+eucharist+for+the+use+of+the+sick%2C+which+was+a+greater+abuse%2C+and+carrying+of+it+home+to+their+houses.+The+opinion+of+the+necessity+of+private+communions+did+grow+to+such+a+height%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+A+Re-examination+of+the+Five+Articles+enacted+at+Perth%2C+anno+1618%E2%80%A6+%281636%29%2C+%E2%80%98Of+the+Administration+of+the+Sacraments+in+Private+Places%E2%80%99%2C+pp.+221-22%2C+224-25%2C+230-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F80b701bb47.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/80b701bb47.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=In%20the%20%5BScottish%5D%20Book%20of%20Common,did%20grow%20to%20such%20a%20height%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>8. In the last rubric after Communion of the Sick, it is said: ‘In the time of the plague, sweat, or such other like contagious times of sicknesses or diseases, when none of the parish, or neighbors, can be gotten to communicate with the sick in their houses, for fear of the infection, upon special request of the diseased, the minister may only communicate with him.’ By this, the minister is bound not only to visit every person sick of the plague, etc. (standing at some distance) but, to administer the Lord’s Supper also to him, if he desire it; and that alone, if none else will join, as it is not to be expected they should. This is no way agreeable to Christianity, or common humanity. Not to Christianity: for, first, the very nature of the sacrament requires a public administration, because there must be a Communion of more than two persons in the receiving of it. This appears plainly by several other rubrics of the same book. For: 1. in the first rubric after the public Communion, it is ordered, that, ‘if there be not above twenty persons in the parish, of discretion to receive the Communion, yet there shall be no Communion, except four, or three at the least communicate with the priest.’ If it be said, this is the order for public Communions; but, it concerns not private Communions of the sick: it is answered, 1. that it appears not by the Word, that there is any warrant, much less necessity for such private Communions: for, the first rubric after Communion of the sick, directs the minister thus: ‘If a man, either by extremity of sickness, or for want of warning in due time to the curate, or for lack of company to receive with him, or by any other just impediment, do not receive the sacrament of Christ’s Body and Blood; then the curate shall instruct him, that if he do truly repent of his sins, and steadfastly believe that Jesus Christ hath suffered death upon the cross for him, and shed his Blood for his Redemption, earnestly remembering the benefits he has thereby, and giving him hearty thanks therefore’ (without all which, what good will be get by receiving the sacrament?) ‘he does eat and drink the body and blood of our Savior Christ profitably to his soul’s health, although he do not receive the sacrament with his mouth.’ 2. In the rubric before the Communion of the sick, this order is given, that the curate having ‘knowledge overnight, or early in the morning,’ of the desire of the sick person to receive the Communion, and being signified ‘also how many be appointed to communicate with him, and having a convenient place in the sick man’s house, where the curate may reverently minister, and a good number to receive the Communion with the sick person, with all things necessary for the same, he shall there minister the holy Communion.’ Therefore by these rubrics, no Communion is to be ministered to the sick, where there be but two to receive it. Secondly, this is also no way agreeable to humanity. Must a minister, who has the charge of many souls, adventure his health, and life, to gratify an infectious person in that which (as by what has been before alleged) is no way of necessity to the sick man’s salvation? Must the minister do this, or be punished with deprivation, or otherwise? What cruelty is this? Nay, the very Canons of 1603, Canon 67, provided more mercifully than so; which runs thus: ‘When any person is dangerously sick in any parish, the minister or curate (having knowledge thereof) shall resort to him or her, (if the disease be not known, or probably suspected to be infectious) to instruct and comfort them,’ etc. Here is a dispensation in case of the plague, or other infectious disease, for so much as visiting the sick: and no word at all of giving the Holy Communion. So much shall at present suffice to be spoken of the rubrics.</p></blockquote>

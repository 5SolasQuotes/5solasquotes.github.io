<blockquote><p>The Propositions agreed on by the Associated Ministers of the County of Worcester and some Adjacent Parts . We ministers of the Gospel whose names are underwritten, after our seeking of God’s direction, and our most serious consultations about the discharge of our duty, for the reforming and right guiding of the congregations committed to our charge, and for the right managing of God’s worship therein, do agree and resolve as follows: 1. In general, we do agree and resolve, not to addict or engage ourselves to any party, nor to set up the dictates of any as such, but at present only to practice unanimously those known truths which the sober and godly of each party are agreed in, as near as possibly we can, that so we may neither give occasion to any such sober and godly persons to divide from us; nor yet proceed ungroundedly, doubtingly, and uncomfortably in our work, nor attempt anything but what we know to be of God, and may cheerfully bear all labor, and sufferings that we may meet with in carrying it on. 2. We agree and resolve by God’s help, that so far as God does make known our duty to us, we will faithfully endeavor to discharge it, and will not desist through any fears of losses in our estates, or the frowns and displeasure of men, or any the like carnal inducements whatsoever. 3. Particularly, we are all convinced that it is the duty of each minister to endeavor to know (if possible) each person of his charge, that so he may know where his special duty lies and how to perform it. 4. We are also convinced that it is the duty of ministers and people, according to their several opportunities, to admonish and reprove those that live in the any known sin, through wilfullness or negligence (laying aside the ordinary infirmities that the most godly are subject to) and this must be with tender love, and yet with great seriousness, and with discretion; and not with malice, bitterness, or disdain, yet variously according to the quality of the person and offence. And if the offender hear not, that is, obey not the admonition, by repenting and reforming, he must be admonished before witness; This therefore we resolve by God’s assistance faithfully to practice according to our opportunity, and to acquaint our people with their duty herein, especially in great congregations, where through the greatness and multitude of other works, less of this can be expected from ministers. 5. If any after this admonition shall yet refuse to repent and reform, those that can prove it, must tell the Church officers, who must hear the case, and admonish them with authority. The like must be done by those that have been oft admonished by others formerly, and not repented and reformed; and those whose sin is notorious, and heinously scandalous. But for private persons to accuse others inthe public conrgegation before the officers have heard the case, may breed dangerous slanders and quarrels. We resolve therefore to appoint some certain times for the hearing of such cases. 6. In corporations or other places that have magistrates, we judge it convenient if we can so far prevail with them, that they would grant us their presence at these meetings, both to be witnesses of our right proceedings, and to countenance them so far as by law they may; and especially because it is necessary that they have the full cognisance of our proceedings, before we can expect they should assist us against any that will violently intrude into our communion or disturb us: and also that they may at the same time first censure offenders according to law, and so we may know their proof of the fact; yet do we judge their presence a matter rather of conveniency than of necessity. 7. If any after this refuse to repent and reform, or if any have sinned heinously with public scandal of the church, it is the duty of ministers to rebuke such before all the church, and to call them publicly to repentance: This therefore we are resolved in both these cases to practice. 8. Yet where any man’s sin is such as to expose him by the law of the land to death, or imprisonment, or great mulcts [fines] or other penalties; We resolve not to anticipate public justice, nor to call out such to accuse themselves by their Church confessions, but shall wait to see what justice will do with them: but after mulcts and corporal penalties imposed by justice upon proof of guilt, we may and must require open repentance, if the person do survive. 9. We resolve (that we wrong not others or ourselves) not to mention any man’s sin publicly (by this personal application) before we have full proof beyond all exception, both of the factsand the faultiness, and not to traduce men in doubtful or controverted cases; and most commonly we must have the parties’ own confession of the matter of fact. 10. If after this public admonition the sinner shall obstinately refuse to manifest repentance, or to reform; it is the duty of the ministers to make a personal application to him of those threatenings which Christ has denounced in Scripture against such as he is; and especially to declare in the name of Christ, that he is one whose communion the church is bound to avoid; and to require him to forbear usurping that communion, and to charge the chuch in Christ’s name to avoid all familiarity with him, not only in God’s worship, but in common conversation, further than natural and civil relations bind us. 11. When the church or officers are orderly acquainted that any man is obstinate in sin, after private and less public admonition, or that his sin is notorious, and of public scandal, it is unmeet to admit him to public communion at the Lord’s Supper while he is under just trial; for while the church is necessarily in doubt whether he be such a scandalous or obstinate sinner or not, and so whether they may lawfully communicate with him or not (being forbidden communion with such) they must needs forbear his communion for that time (till his clearing or repentance resolve their doubt) or else they must act doubtingly and not in faith: Yet this is only a suspension of actual communion at present (no duty being a duty at all times to be performed) and not a proper denial of his right till he be cast out. The trial of his justly questioned right, will not fitly consist with his actual, full and present exerciseand use of such privileges. 12. We are all agreed likewise that were men are thus notoriously scandalous or obstinate in known sin, we may not content ourselves with a mere debarring such from the Lord’s Supper (which multitudes do willingly forbear of themselves, who yet are taken for as good Christians as others, and not avoided in regard of any other communion) but we must proceed to the forementioned public reproof and casting them out of our communion, else the remaining members of our church will harden themselves, offend the godly, occasion the weak to separate, and will be a scandal to our profession, and an offence of God: We resolve therefore to discharge the foresaid duties in faithfulness, as God shall enable us. 13. It must not be a slight, unwilling, mere verbal repentance that must satisfy the church, either for preventing or taking off a censure or casting out, but only such as seems free and serious, answerable in some measure to the quality of the fault. Such therefore we resolve to require and expect that we delude not men’s souls, and provoke not God by making a formality or jest of his ordinances. 14. If after once or twice scandalous or obstinate sinning, a man do once and again profess a serious repentance, we shall admit him to communion: But if after oft professing of repentance he return again to wilfull or scandalous sinning, we shall delay his re-admission till his actual reformation do manifest the truth of his repentance, else God’s ordinances will be frustrated by illusion: Yet cannot we punctually resolve just how oft such men’s professions alone may be taken as satisfactory, nor just how long we must delay his re-admission, if he forbear sinning, seeing these are to be varied accoding to the quality of the sin, and the seeming seriousness of repentance, and therefore must be prudentially determined, when the individual case with its circumstances is considered. 15. Though the people have not miniterial or governing power, yet they are to have a judgment of discretion, and thereby to try and discern, whether they that do cast out, or absolve by ministerial authoritative declaration, do proceed according to God’s Word or not, and are not to obey any sentence or injunction that is contrary to that Word; yet must they not on that pretence disobey or refuse to execute such injunctions and censures without manifesting their proofs of its error. 16. If people will not avoid communion and familiarity with such as are publicly cast out, they are to be dealt with by admonition, as in case of other sins. But if it should be a greater part of the Church that shall obstinately after admonition own and maintain a notorious scandalous sinner in his sin; or so far profess communion with him, that they make his sin their own, and continue obstinate therein, the rest of the church are not only bound nevertheless to shun communion with the offender, but with them that so adhere to him, provided that it be not about lesser sins, or in a disputable, doubtful case, wherein they want full evidence against the offender: Yet do we agree for the avoiding of several dangerous consequents, before we attempt this work, to acquaint our brethren of that association, and hear their judgments. 17. It having been the custom of the Church in the apostles’ days, to have orindarily many officers in a Church, and the private part of the ministerial duty being so exceeding great, and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases, where more may be had; We therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls, and greatness of the word; and if for want of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober orthodox judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning, and less able to publicly teach, and who may leave public speaking to him that is more able, and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments, and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments: also we conceive it meet that where there are fit men, some be ordained to the office of deacons. 18. Because all this forementioned discipline cannot be exercised without the people’s consent (the ministerial power being not compulsive, as by violence, but nunciative, suasory and directive) and we have at present no full discovery of their consent: And because ministers should have a particular knowledge of their charge, which now is uncertain, and for diverse other reasons propounded and debated among us, we judge it very fit, if not of necessity, to desire a more express signification of our people’s consent to our ministry, and ministerial actions; and in particular to submit to this discipline, as the members of that particular church: And because we have reason to suspect that many among us understand not, or believe not the very fundamentals essential to the Christian Faith; We judge it fit withall to require an understanding profession of assent and consent to such fundamentals, except any of us should judge that we can better exercise the forementioned discipline without calling their people to such a profession of consent, in which case we will declare our reasons to our brethren of the ministry in our meetings, and hear their advice when the case is opened. 19. In requiring this express consent, we agree to proceed according to the following rules: Rule 1. We will first instruct our people in diverse sermons about the nature of a church, its constitution and government, the duty and authority of pastors, and the duties of people to God, their ministers, and to each other as members of such a church, and the meaning of each branch of that profession which we call them to, that so they may not do it rashly, ignorantly or formally. R. 2. We shall as exactly as God shall enable us, draw up and agree upon a form of words containing the said profession, witha brief preface concerning the reasons, nature and ends of it; and we will all use the same form of words to a word, except any brother shall think himself bound to differ in any smaller point, where a difference is tolerable; in which case we will give in our reasons at the meeting of our brethren of the ministry, and hear their advice. R. 3. We shall take these professions only in public, and not secretly. R. 4. We shall deliver to our people a copy of this form of profession that they may consider of it before they are called to it. R. 5. We shall first receive the profession of all them that are satisfied and most willing, and wait till the rest are satisfied and will freely consent, and not spur them on to do it ignorantly, rashly or unwillingly. R. 6. If any deny or delay to express their consent, we shall endeavor carefully to discern on what grounds he does it, and whether it be a flat denial of the matter, or only some scruple at the manner at the manner, and accordingly shall distinguish between: 1. Professors of consent, as being members certain. 2. Or deniers of consent as to the matter, as bein no membes of that church; 3. And delayers or deniers to consent to the manner, as being uncetain, or less certain, whether they are members or no, till they further discover it. R. 7. We shall distinguish between infant members, and adult; and for the former we shall take their parents’ profession, and for the latter we shall expect their own: and though it cannot be determined just to a day or year when any is past his infant-church-estate, yet none must be enrolled or accounted among adult and perfect members till they personally and publicly shall make their profession; whether it be only of their faith and obedience to Christ, that they may be esteemed adult members of the universal Church, or also their consent to be members of a particular Church. R. 8. If any at full age do offer their consent to be members of a particular church, and expect to enjoy its privileges, who yet understand not, or believe not the fundamental essential points of the Christian religion, if they be willing to learn, we shall presently instruct them as catecumeni, and admit them when they are fit: But if they refuse to learn, we must take them for such as refuse to be Christians; and therefore where we have just reason to suspect the ignorance or unbelief of any that offer their profession of the form of words, we judge it our duty more particularly to examine them, yet resolve that we will not refuse any for want of fit expressions, who any way discover that they understand the matter. R. 9. Though we shall receive professions only in public for satisfaction of the Church, and other reasons, yet those whose knowledge only is suspected, we may examine in private, because some of understanding are not able in public to express their minds: and afterwards in public we shall receive their profession if they are found fit. R. 10. If any shall publicly offer his profession of consent, who is a confessed or a convicted scandalous or obstinate sinner; we shall immediately require him to profess openly his repentance, for his former scandalous sins before we receive his profession of duty for the future, seeing in order that must go first; and if he refuse, he must suspend our numbering him with the sounder members, and proceed to public admonition and censure if he persevere impenitent. R. 11. If there be not enough in one parish that will consent (after our sufficient waiting) we shall join them to the next parish by consent; yet continuing still our meetings for preaching to the rest that consent not, and not meddling with alterations of the minister’s maintenance; yet in this weighty case, we desire advice may be had from the ministers of that association. 20. Because all churches are parts of the Church-universal, and all true Christians are members of that body, and of Christ, and have one Head, Lord, Faith, baptism, one rule of Faith and life, one Spirit, and one bond, and common cognisance of entire love to Christ, and one another; and have one hope, one end, and must be one in blessed union and communion with Christ everlastingly, we judge it therefore of great and indispensable necessity that we use all good means for the maintaining of this union and communion; and to do as much of our work as we can in concord with one another, and as little as may be dividedly, and by ourselves: And therefore we resolve according to our duty to keep constant communion and correspondence; and to that end to hold certain meetings of the ministry in association, and that according to these following rules: Rule 1. We judge it convenient to meet in five several associations at five several places in this county, viz. at Worcester, Evesham, Upton, Kidderminister, and Bromsgrove, and this once a month on a day to be agreed on (or oftener if need require). R. 2. We shall not by dividing the county presume to limit others to any one of these associations, but let every minister according to his own conveniency choose to which of these associations he will join himself, and accordingly subscribe to a copy of these articles, which shall be kept at the place of meeting for that association; and so may any minister that shall hereafter join with us, who at the present does not. R. 3. We shall give notice to all ministers of piety, and competent ability, who now are not among us, and desire them to join with us, and offer them a free debate of anything which they may scruple, and desire them to adjoin themselves to which association they judge most convenient. R. 4. We shall at these monthly meetings keep up a public lecture for the common benefit. R. 5. At these meetings we shall maintain some disputations or other exercise, which shall be found most useful to our own edification, especially for the younger sort of ministers, or else meet on purpose for this another day. R. 6. We shall here endeavor on consultation to resolve all particular doubts that arise about discipline, or worship, or doctrine, which (for the avoiding of all occasions of division) we have not thought fit to make the matter of this agreement, or which these general rulse suffice not to determine. R. 7. We shall here also produce and propound to consideration any new point of doctrine wherein we differ from the most of the Reformed Churches, before we adventure to teach it our hearers. R. 8. we shall here debate all differences in judgment (fit for debate) that may happen among ourselves or any of our people. R. 9. We shall here receive any complaint that any people have against any member of our association, for scandal, false doctrine, or mal-administration; and we all resolve to give an account of our doctrine and actions, when any offended brother shall so accuse us, both for the satisfaction of the Church and him. R. 10. We shall here make known the names of all those whom we have put out of our communion; and we resolve all of us to refuse communion with such, and not to receive them into one church who are cast out of another, except they have given satisfaction, or we first here prove them unjustly cast out. R. 11. We shall here make it known if any member of another parish shall offer to adjoin themselves to any of our congregations, as members thereof, and we resolve not to receive any such, except we give here sufficient reasons for it; as if they be necessitated through the sin of the minister, or parish where they live, to do it, or the like. R. 12. We shall here make it known if there be any members of another parish (adjoined to no church) who desire either sacrament from us, that we may know from the minister of that place whether they are fit to be admitted or not. R. 13. Those who being sole ministers of particular churches, do doubt whether they alone may judge any man to be unfit for church communion, and so declare him; or may publicly by name rebuke him, they may do well here to take the advice of the association for their proceedings. R. 14. We desire that all young ministers, or any that are not well furnished with discretion and ability to manage those public reproofs and censures, would do nothing in it without first consulting these assemblies, yea in so weighty a case as is excluding from Church communion, we judge it convenient that all ministers advise with their brethren of that association for their safer proceeding. R. 15. We shall here consult about the good of neighbor churches, for helping them where they want teaching, for advising them against errors, seducers, or scandals, and furthering to our power the propagation of the Gospel. R. 16. We do resolve to frequent these meetings as constantly as we can, and not neglect them and frustrate their ends. R. 17. we shall once a quarter (and oftener if emergent occasion require it) send delegates from all these associations to Worcester (not forbidding any other to be there) where we shall hold a more general meeting for the resolving of greatest difficulties, and the more unanimous carrying on the work of the Gospel. R. 18. We shall admit into these our associations the neighbor ministers also of other counties, where no such associations are, or are so remote that they cannot well join in them. R. 19. Before any of us shall forsake this agreement and these resolutions, we shall give our reasons to the association, and hear what they can say against it; and not do it without sufficient cause. R. 20. We resolve in none of our meetings to go beyond the bounds of our calling, in meddling with secular or state affairs, nor do anything injurious to the commonwealth; but maintain all just obedience to authority; and shall direct all our consultations to the good of souls, the propagation of the Gospel, the unity, peace and reformation of the Church, and the glory and pleasing of God in all. Consentimus nos infra scripti.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Propositions agreed on by the Associated Ministers of the County of Worcester and some Adjacent Parts . We ministers of the Gospel whose names are underwritten, after our seeking of God’s direction, and our most serious consultations about the discharge of our duty, for the reforming and right guiding of the congregations committed to our charge, and for the right managing of God’s worship therein, do agree and resolve as follows: 1. In general, we do agree and resolve, not to addict or engage ourselves to any party, nor to set up the dictates of any as such, but at present only to practice unanimously those known truths which the sober and godly of each party are agreed in, as near as possibly we can, that so we may neither give occasion to any such sober and godly persons to divide from us; nor yet proceed ungroundedly, doubtingly, and uncomfortably in our work, nor attempt anything but what we know to be of God, and may cheerfully bear all labor, and sufferings that we may meet with in carrying it on. 2. We agree and resolve by God’s help, that so far as God does make known our duty to us, we will faithfully endeavor to discharge it, and will not desist through any fears of losses in our estates, or the frowns and displeasure of men, or any the like carnal inducements whatsoever. 3. Particularly, we are all convinced that it is the duty of each minister to endeavor to know (if possible) each person of his charge, that so he may know where his special duty lies and how to perform it. 4. We are also convinced that it is the duty of ministers and people, according to their several opportunities, to admonish and reprove those that live in the any known sin, through wilfullness or negligence (laying aside the ordinary infirmities that the most godly are subject to) and this must be with tender love, and yet with great seriousness, and with discretion; and not with malice, bitterness, or disdain, yet variously according to the quality of the person and offence. And if the offender hear not, that is, obey not the admonition, by repenting and reforming, he must be admonished before witness; This therefore we resolve by God’s assistance faithfully to practice according to our opportunity, and to acquaint our people with their duty herein, especially in great congregations, where through the greatness and multitude of other works, less of this can be expected from ministers. 5. If any after this admonition shall yet refuse to repent and reform, those that can prove it, must tell the Church officers, who must hear the case, and admonish them with authority. The like must be done by those that have been oft admonished by others formerly, and not repented and reformed; and those whose sin is notorious, and heinously scandalous. But for private persons to accuse others inthe public conrgegation before the officers have heard the case, may breed dangerous slanders and quarrels. We resolve therefore to appoint some certain times for the hearing of such cases. 6. In corporations or other places that have magistrates, we judge it convenient if we can so far prevail with them, that they would grant us their presence at these meetings, both to be witnesses of our right proceedings, and to countenance them so far as by law they may; and especially because it is necessary that they have the full cognisance of our proceedings, before we can expect they should assist us against any that will violently intrude into our communion or disturb us: and also that they may at the same time first censure offenders according to law, and so we may know their proof of the fact; yet do we judge their presence a matter rather of conveniency than of necessity. 7. If any after this refuse to repent and reform, or if any have sinned heinously with public scandal of the church, it is the duty of ministers to rebuke such before all the church, and to call them publicly to repentance: This therefore we are resolved in both these cases to practice. 8. Yet where any man’s sin is such as to expose him by the law of the land to death, or imprisonment, or great mulcts [fines] or other penalties; We resolve not to anticipate public justice, nor to call out such to accuse themselves by their Church confessions, but shall wait to see what justice will do with them: but after mulcts and corporal penalties imposed by justice upon proof of guilt, we may and must require open repentance, if the person do survive. 9. We resolve (that we wrong not others or ourselves) not to mention any man’s sin publicly (by this personal application) before we have full proof beyond all exception, both of the factsand the faultiness, and not to traduce men in doubtful or controverted cases; and most commonly we must have the parties’ own confession of the matter of fact. 10. If after this public admonition the sinner shall obstinately refuse to manifest repentance, or to reform; it is the duty of the ministers to make a personal application to him of those threatenings which Christ has denounced in Scripture against such as he is; and especially to declare in the name of Christ, that he is one whose communion the church is bound to avoid; and to require him to forbear usurping that communion, and to charge the chuch in Christ’s name to avoid all familiarity with him, not only in God’s worship, but in common conversation, further than natural and civil relations bind us. 11. When the church or officers are orderly acquainted that any man is obstinate in sin, after private and less public admonition, or that his sin is notorious, and of public scandal, it is unmeet to admit him to public communion at the Lord’s Supper while he is under just trial; for while the church is necessarily in doubt whether he be such a scandalous or obstinate sinner or not, and so whether they may lawfully communicate with him or not (being forbidden communion with such) they must needs forbear his communion for that time (till his clearing or repentance resolve their doubt) or else they must act doubtingly and not in faith: Yet this is only a suspension of actual communion at present (no duty being a duty at all times to be performed) and not a proper denial of his right till he be cast out. The trial of his justly questioned right, will not fitly consist with his actual, full and present exerciseand use of such privileges. 12. We are all agreed likewise that were men are thus notoriously scandalous or obstinate in known sin, we may not content ourselves with a mere debarring such from the Lord’s Supper (which multitudes do willingly forbear of themselves, who yet are taken for as good Christians as others, and not avoided in regard of any other communion) but we must proceed to the forementioned public reproof and casting them out of our communion, else the remaining members of our church will harden themselves, offend the godly, occasion the weak to separate, and will be a scandal to our profession, and an offence of God: We resolve therefore to discharge the foresaid duties in faithfulness, as God shall enable us. 13. It must not be a slight, unwilling, mere verbal repentance that must satisfy the church, either for preventing or taking off a censure or casting out, but only such as seems free and serious, answerable in some measure to the quality of the fault. Such therefore we resolve to require and expect that we delude not men’s souls, and provoke not God by making a formality or jest of his ordinances. 14. If after once or twice scandalous or obstinate sinning, a man do once and again profess a serious repentance, we shall admit him to communion: But if after oft professing of repentance he return again to wilfull or scandalous sinning, we shall delay his re-admission till his actual reformation do manifest the truth of his repentance, else God’s ordinances will be frustrated by illusion: Yet cannot we punctually resolve just how oft such men’s professions alone may be taken as satisfactory, nor just how long we must delay his re-admission, if he forbear sinning, seeing these are to be varied accoding to the quality of the sin, and the seeming seriousness of repentance, and therefore must be prudentially determined, when the individual case with its circumstances is considered. 15. Though the people have not miniterial or governing power, yet they are to have a judgment of discretion, and thereby to try and discern, whether they that do cast out, or absolve by ministerial authoritative declaration, do proceed according to God’s Word or not, and are not to obey any sentence or injunction that is contrary to that Word; yet must they not on that pretence disobey or refuse to execute such injunctions and censures without manifesting their proofs of its error. 16. If people will not avoid communion and familiarity with such as are publicly cast out, they are to be dealt with by admonition, as in case of other sins. But if it should be a greater part of the Church that shall obstinately after admonition own and maintain a notorious scandalous sinner in his sin; or so far profess communion with him, that they make his sin their own, and continue obstinate therein, the rest of the church are not only bound nevertheless to shun communion with the offender, but with them that so adhere to him, provided that it be not about lesser sins, or in a disputable, doubtful case, wherein they want full evidence against the offender: Yet do we agree for the avoiding of several dangerous consequents, before we attempt this work, to acquaint our brethren of that association, and hear their judgments. 17. It having been the custom of the Church in the apostles’ days, to have orindarily many officers in a Church, and the private part of the ministerial duty being so exceeding great, and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases, where more may be had; We there rstanding profession of assent and consent to such fundamentals, except any of us should judge that we can better exercise the forementioned discipline without calling their people to such a profession of consent, in which case we will declare our reasons to our brethren of the ministry in our meetings, and hear their advice when the case is opened. 19. In requiring this express consent, we agree to proceed according to the following rules: Rule 1. We will first instruct our people in diverse sermons about the nature of a church, its constitution and government, the duty and authority of pastors, and the duties of people to God, their ministers, and to each other as members of such a church, and the meaning of each branch of that profession which we call them to, that so they may not do it rashly, ignorantly or formally. R. 2. We shall as exactly as God shall enable us, draw up and agree upon a form of words containing the said profession, witha brief preface concerning the reasons, nature and ends of it; and we will all use the same form of words to a word, except any brother shall think himself bound to differ in any smaller point, where a difference is tolerable; in which case we will give in our reasons at the meeting of our brethren of the ministry, and hear their advice. R. 3. We shall take these professions only in public, and not secretly. R. 4. We shall deliver to our people a copy of this form of profession that they may consider of it before they are called to it. R. 5. We shall first receive the profession of all them that are satisfied and most willing, and wait till the rest are satisfied and will freely consent, and not spur them on to do it ignorantly, rashly or unwillingly. R. 6. If any deny or delay to express their consent, we shall endeavor carefully to discern on what grounds he does it, and whether it be a flat denial of the matter, or only some scruple at the manner at the manner, and accordingly shall distinguish between: 1. Professors of consent, as being members certain. 2. Or deniers of consent as to the matter, as bein no membes of that church; 3. And delayers or deniers to consent to the manner, as being uncetain, or less certain, whether they are members or no, till they further discover it. R. 7. We shall distinguish between infant members, and adult; and for the former we shall take their parents’ profession, and for the latter we shall expect their own: and though it cannot be determined just to a day or year when any is past his infant-church-estate, yet none must be enrolled or accounted among adult and perfect members till they personally and publicly shall make their profession; whether it be only of their faith and obedience to Christ, that they may be esteemed adult members of the universal Church, or also their consent to be members of a particular Church. R. 8. If any at full age do offer their consent to be members of a particular church, and expect to enjoy its privileges, who yet understand not, or believe not the fundamental essential points of the Christian religion, if they be willing to learn, we shall presently instruct them as catecumeni, and admit them when they are fit: But if they refuse to learn, we must take them for such as refuse to be Christians; and therefore where we have just reason to suspect the ignorance or unbelief of any that offer their profession of the form of words, we judge it our duty more particularly to examine them, yet resolve that we will not refuse any for want of fit expressions, who any way discover that they understand the matter. R. 9. Though we shall receive professions only in public for satisfaction of the Church, and other reasons, yet those whose knowledge only is suspected, we may examine in private, because some of understanding are not able in public to express their minds: and afterwards in public we shall receive their profession if they are found fit. R. 10. If any shall publicly offer his profession of consent, who is a confessed or a convicted scandalous or obstinate sinner; we shall immediately require him to profess openly his repentance, for his former scandalous sins before we receive his profession of duty for the future, seeing in order that must go first; and if he refuse, he must suspend our numbering him with the sounder members, and proceed to public admonition and censure if he persevere impenitent. R. 11. If there be not enough in one parish that will consent (after our sufficient waiting) we shall join them to the next parish by consent; yet continuing still our meetings for preaching to the rest that consent not, and not meddling with alterations of the minister’s maintenance; yet in this weighty case, we desire advice may be had from the ministers of that association. 20. Because all churches are parts of the Church-universal, and all true Christians are members of that body, and of Christ, and have one Head, Lord, Faith, baptism, one rule of Faith and life, one Spirit, and one bond, and common cognisance of entire love to Christ, and one another; and have one hope, one end, and must be one in blessed union and communion with Christ everlastingly, we judge it therefore of great and indispensable necessity that we use all good means for the maintaining of this union and communion; and to do as much of our work as we can in concord with one another, and as little as may be dividedly, and by ourselves: And therefore we resolve according to our duty to keep constant communion and correspondence; and to that end to hold certain meetings of the ministry in association, and that according to these following rules: Rule 1. We judge it convenient to meet in five several associations at five several places in this county, viz. at Worcester, Evesham, Upton, Kidderminister, and Bromsgrove, and this once a month on a day to be agreed on (or oftener if need require). R. 2. We shall not by dividing the county presume to limit others to any one of these associations, but let every minister according to his own conveniency choose to which of these associations he will join himself, and accordingly subscribe to a copy of these articles, which shall be kept at the place of meeting for that association; and so may any minister that shall hereafter join with us, who at the present does not. R. 3. We shall give notice to all ministers of piety, and competent ability, who now are not among us, and desire them to join with us, and offer them a free debate of anything which they may scruple, and desire them to adjoin themselves to which association they judge most convenient. R. 4. We shall at these monthly meetings keep up a public lecture for the common benefit. R. 5. At these meetings we shall maintain some disputations or other exercise, which shall be found most useful to our own edification, especially for the younger sort of ministers, or else meet on purpose for this another day. R. 6. We shall here endeavor on consultation to resolve all particular doubts that arise about discipline, or worship, or doctrine, which (for the avoiding of all occasions of division) we have not thought fit to make the matter of this agreement, or which these general rulse suffice not to determine. R. 7. We shall here also produce and propound to consideration any new point of doctrine wherein we differ from the most of the Reformed Churches, before we adventure to teach it our hearers. R. 8. we shall here debate all differences in judgment (fit for debate) that may happen among ourselves or any of our people. R. 9. We shall here receive any complaint that any people have against any member of our association, for scandal, false doctrine, or mal-administration; and we all resolve to give an account of our doctrine and actions, when any offended brother shall so accuse us, both for the satisfaction of the Church and him. R. 10. We shall here make known the names of all those whom we have put out of our communion; and we resolve all of us to refuse communion with such, and not to receive them into one church who are cast out of another, except they have given satisfaction, or we first here prove them unjustly cast out. R. 11. We shall here make it known if any member of another parish shall offer to adjoin themselves to any of our congregations, as members thereof, and we resolve not to receive any such, except we give here sufficient reasons for it; as if they be necessitated through the sin of the minister, or parish where they live, to do it, or the like. R. 12. We shall here make it known if there be any members of another parish (adjoined to no church) who desire either sacrament from us, that we may know from the minister of that place whether they are fit to be admitted or not. R. 13. Those who being sole ministers of particular churches, do doubt whether they alone may judge any man to be unfit for church communion, and so declare him; or may publicly by name rebuke him, they may do well here to take the advice of the association for their proceedings. R. 14. We desire that all young ministers, or any that are not well furnished with discretion and ability to manage those public reproofs and censures, would do nothing in it without first consulting these assemblies, yea in so weighty a case as is excluding from Church communion, we judge it convenient that all ministers advise with their brethren of that association for their safer proceeding. R. 15. We shall here consult about the good of neighbor churches, for helping them where they want teaching, for advising them against errors, seducers, or scandals, and furthering to our power the propagation of the Gospel. R. 16. We do resolve to frequent these meetings as constantly as we can, and not neglect them and frustrate their ends. R. 17. we shall once a quarter (and oftener if emergent occasion require it) send delegates from all these associations to Worcester (not forbidding any other to be there) where we shall hold a more general meeting for the resolving of greatest difficulties, and the more unanimous carrying on the work of the Gospel. R. 18. We shall admit into these our associations the neighbor ministers also of other counties, where no such associations are, or are so remote that they cannot well join in them. R. 19. Before any of us shall forsake this agreement and these resolutions, we shall give our reasons to the association, and hear what they can say against it; and not do it without sufficient cause. R. 20. We resolve in none of our meetings to go beyond the bounds of our calling, in meddling with secular or state affairs, nor do anything injurious to the commonwealth; but maintain all just obedience to authority; and shall direct all our consultations to the good of souls, the propagation of the Gospel, the unity, peace and reformation of the Church, and the glory and pleasing of God in all. Consentimus nos infra scripti.”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Propositions+agreed+on+by+the+Associated+Ministers+of+the+County+of+Worcester+and+some+Adjacent+Parts+.+We+ministers+of+the+Gospel+whose+names+are+underwritten%2C+after+our+seeking+of+God%E2%80%99s+direction%2C+and+our+most+serious+consultations+about+the+discharge+of+our+duty%2C+for+the+reforming+and+right+guiding+of+the+congregations+committed+to+our+charge%2C+and+for+the+right+managing+of+God%E2%80%99s+worship+therein%2C+do+agree+and+resolve+as+follows%3A+1.+In+general%2C+we+do+agree+and+resolve%2C+not+to+addict+or+engage+ourselves+to+any+party%2C+nor+to+set+up+the+dictates+of+any+as+such%2C+but+at+present+only+to+practice+unanimously+those+known+truths+which+the+sober+and+godly+of+each+party+are+agreed+in%2C+as+near+as+possibly+we+can%2C+that+so+we+may+neither+give+occasion+to+any+such+sober+and+godly+persons+to+divide+from+us%3B+nor+yet+proceed+ungroundedly%2C+doubtingly%2C+and+uncomfortably+in+our+work%2C+nor+attempt+anything+but+what+we+know+to+be+of+God%2C+and+may+cheerfully+bear+all+labor%2C+and+sufferings+that+we+may+meet+with+in+carrying+it+on.+2.+We+agree+and+resolve+by+God%E2%80%99s+help%2C+that+so+far+as+God+does+make+known+our+duty+to+us%2C+we+will+faithfully+endeavor+to+discharge+it%2C+and+will+not+desist+through+any+fears+of+losses+in+our+estates%2C+or+the+frowns+and+displeasure+of+men%2C+or+any+the+like+carnal+inducements+whatsoever.+3.+Particularly%2C+we+are+all+convinced+that+it+is+the+duty+of+each+minister+to+endeavor+to+know+%28if+possible%29+each+person+of+his+charge%2C+that+so+he+may+know+where+his+special+duty+lies+and+how+to+perform+it.+4.+We+are+also+convinced+that+it+is+the+duty+of+ministers+and+people%2C+according+to+their+several+opportunities%2C+to+admonish+and+reprove+those+that+live+in+the+any+known+sin%2C+through+wilfullness+or+negligence+%28laying+aside+the+ordinary+infirmities+that+the+most+godly+are+subject+to%29+and+this+must+be+with+tender+love%2C+and+yet+with+great+seriousness%2C+and+with+discretion%3B+and+not+with+malice%2C+bitterness%2C+or+disdain%2C+yet+variously+according+to+the+quality+of+the+person+and+offence.+And+if+the+offender+hear+not%2C+that+is%2C+obey+not+the+admonition%2C+by+repenting+and+reforming%2C+he+must+be+admonished+before+witness%3B+This+therefore+we+resolve+by+God%E2%80%99s+assistance+faithfully+to+practice+according+to+our+opportunity%2C+and+to+acquaint+our+people+with+their+duty+herein%2C+especially+in+great+congregations%2C+where+through+the+greatness+and+multitude+of+other+works%2C+less+of+this+can+be+expected+from+ministers.+5.+If+any+after+this+admonition+shall+yet+refuse+to+repent+and+reform%2C+those+that+can+prove+it%2C+must+tell+the+Church+officers%2C+who+must+hear+the+case%2C+and+admonish+them+with+authority.+The+like+must+be+done+by+those+that+have+been+oft+admonished+by+others+formerly%2C+and+not+repented+and+reformed%3B+and+those+whose+sin+is+notorious%2C+and+heinously+scandalous.+But+for+private+persons+to+accuse+others+inthe+public+conrgegation+before+the+officers+have+heard+the+case%2C+may+breed+dangerous+slanders+and+quarrels.+We+resolve+therefore+to+appoint+some+certain+times+for+the+hearing+of+such+cases.+6.+In+corporations+or+other+places+that+have+magistrates%2C+we+judge+it+convenient+if+we+can+so+far+prevail+with+them%2C+that+they+would+grant+us+their+presence+at+these+meetings%2C+both+to+be+witnesses+of+our+right+proceedings%2C+and+to+countenance+them+so+far+as+by+law+they+may%3B+and+especially+because+it+is+necessary+that+they+have+the+full+cognisance+of+our+proceedings%2C+before+we+can+expect+they+should+assist+us+against+any+that+will+violently+intrude+into+our+communion+or+disturb+us%3A+and+also+that+they+may+at+the+same+time+first+censure+offenders+according+to+law%2C+and+so+we+may+know+their+proof+of+the+fact%3B+yet+do+we+judge+their+presence+a+matter+rather+of+conveniency+than+of+necessity.+7.+If+any+after+this+refuse+to+repent+and+reform%2C+or+if+any+have+sinned+heinously+with+public+scandal+of+the+church%2C+it+is+the+duty+of+ministers+to+rebuke+such+before+all+the+church%2C+and+to+call+them+publicly+to+repentance%3A+This+therefore+we+are+resolved+in+both+these+cases+to+practice.+8.+Yet+where+any+man%E2%80%99s+sin+is+such+as+to+expose+him+by+the+law+of+the+land+to+death%2C+or+imprisonment%2C+or+great+mulcts+%5Bfines%5D+or+other+penalties%3B+We+resolve+not+to+anticipate+public+justice%2C+nor+to+call+out+such+to+accuse+themselves+by+their+Church+confessions%2C+but+shall+wait+to+see+what+justice+will+do+with+them%3A+but+after+mulcts+and+corporal+penalties+imposed+by+justice+upon+proof+of+guilt%2C+we+may+and+must+require+open+repentance%2C+if+the+person+do+survive.+9.+We+resolve+%28that+we+wrong+not+others+or+ourselves%29+not+to+mention+any+man%E2%80%99s+sin+publicly+%28by+this+personal+application%29+before+we+have+full+proof+beyond+all+exception%2C+both+of+the+factsand+the+faultiness%2C+and+not+to+traduce+men+in+doubtful+or+controverted+cases%3B+and+most+commonly+we+must+have+the+parties%E2%80%99+own+confession+of+the+matter+of+fact.+10.+If+after+this+public+admonition+the+sinner+shall+obstinately+refuse+to+manifest+repentance%2C+or+to+reform%3B+it+is+the+duty+of+the+ministers+to+make+a+personal+application+to+him+of+those+threatenings+which+Christ+has+denounced+in+Scripture+against+such+as+he+is%3B+and+especially+to+declare+in+the+name+of+Christ%2C+that+he+is+one+whose+communion+the+church+is+bound+to+avoid%3B+and+to+require+him+to+forbear+usurping+that+communion%2C+and+to+charge+the+chuch+in+Christ%E2%80%99s+name+to+avoid+all+familiarity+with+him%2C+not+only+in+God%E2%80%99s+worship%2C+but+in+common+conversation%2C+further+than+natural+and+civil+relations+bind+us.+11.+When+the+church+or+officers+are+orderly+acquainted+that+any+man+is+obstinate+in+sin%2C+after+private+and+less+public+admonition%2C+or+that+his+sin+is+notorious%2C+and+of+public+scandal%2C+it+is+unmeet+to+admit+him+to+public+communion+at+the+Lord%E2%80%99s+Supper+while+he+is+under+just+trial%3B+for+while+the+church+is+necessarily+in+doubt+whether+he+be+such+a+scandalous+or+obstinate+sinner+or+not%2C+and+so+whether+they+may+lawfully+communicate+with+him+or+not+%28being+forbidden+communion+with+such%29+they+must+needs+forbear+his+communion+for+that+time+%28till+his+clearing+or+repentance+resolve+their+doubt%29+or+else+they+must+act+doubtingly+and+not+in+faith%3A+Yet+this+is+only+a+suspension+of+actual+communion+at+present+%28no+duty+being+a+duty+at+all+times+to+be+performed%29+and+not+a+proper+denial+of+his+right+till+he+be+cast+out.+The+trial+of+his+justly+questioned+right%2C+will+not+fitly+consist+with+his+actual%2C+full+and+present+exerciseand+use+of+such+privileges.+12.+We+are+all+agreed+likewise+that+were+men+are+thus+notoriously+scandalous+or+obstinate+in+known+sin%2C+we+may+not+content+ourselves+with+a+mere+debarring+such+from+the+Lord%E2%80%99s+Supper+%28which+multitudes+do+willingly+forbear+of+themselves%2C+who+yet+are+taken+for+as+good+Christians+as+others%2C+and+not+avoided+in+regard+of+any+other+communion%29+but+we+must+proceed+to+the+forementioned+public+reproof+and+casting+them+out+of+our+communion%2C+else+the+remaining+members+of+our+church+will+harden+themselves%2C+offend+the+godly%2C+occasion+the+weak+to+separate%2C+and+will+be+a+scandal+to+our+profession%2C+and+an+offence+of+God%3A+We+resolve+therefore+to+discharge+the+foresaid+duties+in+faithfulness%2C+as+God+shall+enable+us.+13.+It+must+not+be+a+slight%2C+unwilling%2C+mere+verbal+repentance+that+must+satisfy+the+church%2C+either+for+preventing+or+taking+off+a+censure+or+casting+out%2C+but+only+such+as+seems+free+and+serious%2C+answerable+in+some+measure+to+the+quality+of+the+fault.+Such+therefore+we+resolve+to+require+and+expect+that+we+delude+not+men%E2%80%99s+souls%2C+and+provoke+not+God+by+making+a+formality+or+jest+of+his+ordinances.+14.+If+after+once+or+twice+scandalous+or+obstinate+sinning%2C+a+man+do+once+and+again+profess+a+serious+repentance%2C+we+shall+admit+him+to+communion%3A+But+if+after+oft+professing+of+repentance+he+return+again+to+wilfull+or+scandalous+sinning%2C+we+shall+delay+his+re-admission+till+his+actual+reformation+do+manifest+the+truth+of+his+repentance%2C+else+God%E2%80%99s+ordinances+will+be+frustrated+by+illusion%3A+Yet+cannot+we+punctually+resolve+just+how+oft+such+men%E2%80%99s+professions+alone+may+be+taken+as+satisfactory%2C+nor+just+how+long+we+must+delay+his+re-admission%2C+if+he+forbear+sinning%2C+seeing+these+are+to+be+varied+accoding+to+the+quality+of+the+sin%2C+and+the+seeming+seriousness+of+repentance%2C+and+therefore+must+be+prudentially+determined%2C+when+the+individual+case+with+its+circumstances+is+considered.+15.+Though+the+people+have+not+miniterial+or+governing+power%2C+yet+they+are+to+have+a+judgment+of+discretion%2C+and+thereby+to+try+and+discern%2C+whether+they+that+do+cast+out%2C+or+absolve+by+ministerial+authoritative+declaration%2C+do+proceed+according+to+God%E2%80%99s+Word+or+not%2C+and+are+not+to+obey+any+sentence+or+injunction+that+is+contrary+to+that+Word%3B+yet+must+they+not+on+that+pretence+disobey+or+refuse+to+execute+such+injunctions+and+censures+without+manifesting+their+proofs+of+its+error.+16.+If+people+will+not+avoid+communion+and+familiarity+with+such+as+are+publicly+cast+out%2C+they+are+to+be+dealt+with+by+admonition%2C+as+in+case+of+other+sins.+But+if+it+should+be+a+greater+part+of+the+Church+that+shall+obstinately+after+admonition+own+and+maintain+a+notorious+scandalous+sinner+in+his+sin%3B+or+so+far+profess+communion+with+him%2C+that+they+make+his+sin+their+own%2C+and+continue+obstinate+therein%2C+the+rest+of+the+church+are+not+only+bound+nevertheless+to+shun+communion+with+the+offender%2C+but+with+them+that+so+adhere+to+him%2C+provided+that+it+be+not+about+lesser+sins%2C+or+in+a+disputable%2C+doubtful+case%2C+wherein+they+want+full+evidence+against+the+offender%3A+Yet+do+we+agree+for+the+avoiding+of+several+dangerous+consequents%2C+before+we+attempt+this+work%2C+to+acquaint+our+brethren+of+that+association%2C+and+hear+their+judgments.+17.+It+having+been+the+custom+of+the+Church+in+the+apostles%E2%80%99+days%2C+to+have+orindarily+many+officers+in+a+Church%2C+and+the+private+part+of+the+ministerial+duty+being+so+exceeding+great%2C+and+of+indispensible+necessity+where+it+can+be+performed%2C+and+also+because+it+is+less+satisfactory+and+convenient+for+one+minister+alone+to+try+cases%2C+where+more+may+be+had%3B+We+therefore+judge+it+needful+to+use+all+lawful+means+to+procure+more+ministers+or+elders+than+one+in+each+church%2C+even+proportionable+to+the+number+of+souls%2C+and+greatness+of+the+word%3B+and+if+for+want+of+men+or+maintenance%2C+there+cannot+learned+men+be+obtained%2C+we+judge+it+fit+to+take+the+assistance+of+sober+orthodox+judicious+persons+of+competent+ability+for+private+instruction+and+oversight%2C+and+ordained+to+this+work%2C+though+defective+in+learning%2C+and+less+able+to+publicly+teach%2C+and+who+may+leave+public+speaking+to+him+that+is+more+able%2C+and+do+the+more+of+the+less+public+work%2C+and+that+such+if+other+maintenance+be+wanting%2C+may+lawfully+and+fitly+labor+with+their+hands%3A+And+as+long+as+we+agree+that+these+elders+are+ordained+church+officers%2C+and+what+shall+be+their+work%2C+there+needs+to+be+no+breach+among+us%2C+though+we+determined+not+of+their+power+in+sacraments%2C+and+whether+their+office+be+the+same+with+the+teaching+elders%3A+Whilst+we+agree+in+practice%2C+we+may+leave+men%E2%80%99s+several+principles+in+such+a+difficult+controverted+point+to+their+own+judgments%3A+also+we+conceive+it+meet+that+where+there+are+fit+men%2C+some+be+ordained+to+the+office+of+deacons.+18.+Because+all+this+forementioned+discipline+cannot+be+exercised+without+the+people%E2%80%99s+consent+%28the+ministerial+power+being+not+compulsive%2C+as+by+violence%2C+but+nunciative%2C+suasory+and+directive%29+and+we+have+at+present+no+full+discovery+of+their+consent%3A+And+because+ministers+should+have+a+particular+knowledge+of+their+charge%2C+which+now+is+uncertain%2C+and+for+diverse+other+reasons+propounded+and+debated+among+us%2C+we+judge+it+very+fit%2C+if+not+of+necessity%2C+to+desire+a+more+express+signification+of+our+people%E2%80%99s+consent+to+our+ministry%2C+and+ministerial+actions%3B+and+in+particular+to+submit+to+this+discipline%2C+as+the+members+of+that+particular+church%3A+And+because+we+have+reason+to+suspect+that+many+among+us+understand+not%2C+or+believe+not+the+very+fundamentals+essential+to+the+Christian+Faith%3B+We+judge+it+fit+withall+to+require+an+understanding+profession+of+assent+and+consent+to+such+fundamentals%2C+except+any+of+us+should+judge+that+we+can+better+exercise+the+forementioned+discipline+without+calling+their+people+to+such+a+profession+of+consent%2C+in+which+case+we+will+declare+our+reasons+to+our+brethren+of+the+ministry+in+our+meetings%2C+and+hear+their+advice+when+the+case+is+opened.+19.+In+requiring+this+express+consent%2C+we+agree+to+proceed+according+to+the+following+rules%3A+Rule+1.+We+will+first+instruct+our+people+in+diverse+sermons+about+the+nature+of+a+church%2C+its+constitution+and+government%2C+the+duty+and+authority+of+pastors%2C+and+the+duties+of+people+to+God%2C+their+ministers%2C+and+to+each+other+as+members+of+such+a+church%2C+and+the+meaning+of+each+branch+of+that+profession+which+we+call+them+to%2C+that+so+they+may+not+do+it+rashly%2C+ignorantly+or+formally.+R.+2.+We+shall+as+exactly+as+God+shall+enable+us%2C+draw+up+and+agree+upon+a+form+of+words+containing+the+said+profession%2C+witha+brief+preface+concerning+the+reasons%2C+nature+and+ends+of+it%3B+and+we+will+all+use+the+same+form+of+words+to+a+word%2C+except+any+brother+shall+think+himself+bound+to+differ+in+any+smaller+point%2C+where+a+difference+is+tolerable%3B+in+which+case+we+will+give+in+our+reasons+at+the+meeting+of+our+brethren+of+the+ministry%2C+and+hear+their+advice.+R.+3.+We+shall+take+these+professions+only+in+public%2C+and+not+secretly.+R.+4.+We+shall+deliver+to+our+people+a+copy+of+this+form+of+profession+that+they+may+consider+of+it+before+they+are+called+to+it.+R.+5.+We+shall+first+receive+the+profession+of+all+them+that+are+satisfied+and+most+willing%2C+and+wait+till+the+rest+are+satisfied+and+will+freely+consent%2C+and+not+spur+them+on+to+do+it+ignorantly%2C+rashly+or+unwillingly.+R.+6.+If+any+deny+or+delay+to+express+their+consent%2C+we+shall+endeavor+carefully+to+discern+on+what+grounds+he+does+it%2C+and+whether+it+be+a+flat+denial+of+the+matter%2C+or+only+some+scruple+at+the+manner+at+the+manner%2C+and+accordingly+shall+distinguish+between%3A+1.+Professors+of+consent%2C+as+being+members+certain.+2.+Or+deniers+of+consent+as+to+the+matter%2C+as+bein+no+membes+of+that+church%3B+3.+And+delayers+or+deniers+to+consent+to+the+manner%2C+as+being+uncetain%2C+or+less+certain%2C+whether+they+are+members+or+no%2C+till+they+further+discover+it.+R.+7.+We+shall+distinguish+between+infant+members%2C+and+adult%3B+and+for+the+former+we+shall+take+their+parents%E2%80%99+profession%2C+and+for+the+latter+we+shall+expect+their+own%3A+and+though+it+cannot+be+determined+just+to+a+day+or+year+when+any+is+past+his+infant-church-estate%2C+yet+none+must+be+enrolled+or+accounted+among+adult+and+perfect+members+till+they+personally+and+publicly+shall+make+their+profession%3B+whether+it+be+only+of+their+faith+and+obedience+to+Christ%2C+that+they+may+be+esteemed+adult+members+of+the+universal+Church%2C+or+also+their+consent+to+be+members+of+a+particular+Church.+R.+8.+If+any+at+full+age+do+offer+their+consent+to+be+members+of+a+particular+church%2C+and+expect+to+enjoy+its+privileges%2C+who+yet+understand+not%2C+or+believe+not+the+fundamental+essential+points+of+the+Christian+religion%2C+if+they+be+willing+to+learn%2C+we+shall+presently+instruct+them+as+catecumeni%2C+and+admit+them+when+they+are+fit%3A+But+if+they+refuse+to+learn%2C+we+must+take+them+for+such+as+refuse+to+be+Christians%3B+and+therefore+where+we+have+just+reason+to+suspect+the+ignorance+or+unbelief+of+any+that+offer+their+profession+of+the+form+of+words%2C+we+judge+it+our+duty+more+particularly+to+examine+them%2C+yet+resolve+that+we+will+not+refuse+any+for+want+of+fit+expressions%2C+who+any+way+discover+that+they+understand+the+matter.+R.+9.+Though+we+shall+receive+professions+only+in+public+for+satisfaction+of+the+Church%2C+and+other+reasons%2C+yet+those+whose+knowledge+only+is+suspected%2C+we+may+examine+in+private%2C+because+some+of+understanding+are+not+able+in+public+to+express+their+minds%3A+and+afterwards+in+public+we+shall+receive+their+profession+if+they+are+found+fit.+R.+10.+If+any+shall+publicly+offer+his+profession+of+consent%2C+who+is+a+confessed+or+a+convicted+scandalous+or+obstinate+sinner%3B+we+shall+immediately+require+him+to+profess+openly+his+repentance%2C+for+his+former+scandalous+sins+before+we+receive+his+profession+of+duty+for+the+future%2C+seeing+in+order+that+must+go+first%3B+and+if+he+refuse%2C+he+must+suspend+our+numbering+him+with+the+sounder+members%2C+and+proceed+to+public+admonition+and+censure+if+he+persevere+impenitent.+R.+11.+If+there+be+not+enough+in+one+parish+that+will+consent+%28after+our+sufficient+waiting%29+we+shall+join+them+to+the+next+parish+by+consent%3B+yet+continuing+still+our+meetings+for+preaching+to+the+rest+that+consent+not%2C+and+not+meddling+with+alterations+of+the+minister%E2%80%99s+maintenance%3B+yet+in+this+weighty+case%2C+we+desire+advice+may+be+had+from+the+ministers+of+that+association.+20.+Because+all+churches+are+parts+of+the+Church-universal%2C+and+all+true+Christians+are+members+of+that+body%2C+and+of+Christ%2C+and+have+one+Head%2C+Lord%2C+Faith%2C+baptism%2C+one+rule+of+Faith+and+life%2C+one+Spirit%2C+and+one+bond%2C+and+common+cognisance+of+entire+love+to+Christ%2C+and+one+another%3B+and+have+one+hope%2C+one+end%2C+and+must+be+one+in+blessed+union+and+communion+with+Christ+everlastingly%2C+we+judge+it+therefore+of+great+and+indispensable+necessity+that+we+use+all+good+means+for+the+maintaining+of+this+union+and+communion%3B+and+to+do+as+much+of+our+work+as+we+can+in+concord+with+one+another%2C+and+as+little+as+may+be+dividedly%2C+and+by+ourselves%3A+And+therefore+we+resolve+according+to+our+duty+to+keep+constant+communion+and+correspondence%3B+and+to+that+end+to+hold+certain+meetings+of+the+ministry+in+association%2C+and+that+according+to+these+following+rules%3A+Rule+1.+We+judge+it+convenient+to+meet+in+five+several+associations+at+five+several+places+in+this+county%2C+viz.+at+Worcester%2C+Evesham%2C+Upton%2C+Kidderminister%2C+and+Bromsgrove%2C+and+this+once+a+month+on+a+day+to+be+agreed+on+%28or+oftener+if+need+require%29.+R.+2.+We+shall+not+by+dividing+the+county+presume+to+limit+others+to+any+one+of+these+associations%2C+but+let+every+minister+according+to+his+own+conveniency+choose+to+which+of+these+associations+he+will+join+himself%2C+and+accordingly+subscribe+to+a+copy+of+these+articles%2C+which+shall+be+kept+at+the+place+of+meeting+for+that+association%3B+and+so+may+any+minister+that+shall+hereafter+join+with+us%2C+who+at+the+present+does+not.+R.+3.+We+shall+give+notice+to+all+ministers+of+piety%2C+and+competent+ability%2C+who+now+are+not+among+us%2C+and+desire+them+to+join+with+us%2C+and+offer+them+a+free+debate+of+anything+which+they+may+scruple%2C+and+desire+them+to+adjoin+themselves+to+which+association+they+judge+most+convenient.+R.+4.+We+shall+at+these+monthly+meetings+keep+up+a+public+lecture+for+the+common+benefit.+R.+5.+At+these+meetings+we+shall+maintain+some+disputations+or+other+exercise%2C+which+shall+be+found+most+useful+to+our+own+edification%2C+especially+for+the+younger+sort+of+ministers%2C+or+else+meet+on+purpose+for+this+another+day.+R.+6.+We+shall+here+endeavor+on+consultation+to+resolve+all+particular+doubts+that+arise+about+discipline%2C+or+worship%2C+or+doctrine%2C+which+%28for+the+avoiding+of+all+occasions+of+division%29+we+have+not+thought+fit+to+make+the+matter+of+this+agreement%2C+or+which+these+general+rulse+suffice+not+to+determine.+R.+7.+We+shall+here+also+produce+and+propound+to+consideration+any+new+point+of+doctrine+wherein+we+differ+from+the+most+of+the+Reformed+Churches%2C+before+we+adventure+to+teach+it+our+hearers.+R.+8.+we+shall+here+debate+all+differences+in+judgment+%28fit+for+debate%29+that+may+happen+among+ourselves+or+any+of+our+people.+R.+9.+We+shall+here+receive+any+complaint+that+any+people+have+against+any+member+of+our+association%2C+for+scandal%2C+false+doctrine%2C+or+mal-administration%3B+and+we+all+resolve+to+give+an+account+of+our+doctrine+and+actions%2C+when+any+offended+brother+shall+so+accuse+us%2C+both+for+the+satisfaction+of+the+Church+and+him.+R.+10.+We+shall+here+make+known+the+names+of+all+those+whom+we+have+put+out+of+our+communion%3B+and+we+resolve+all+of+us+to+refuse+communion+with+such%2C+and+not+to+receive+them+into+one+church+who+are+cast+out+of+another%2C+except+they+have+given+satisfaction%2C+or+we+first+here+prove+them+unjustly+cast+out.+R.+11.+We+shall+here+make+it+known+if+any+member+of+another+parish+shall+offer+to+adjoin+themselves+to+any+of+our+congregations%2C+as+members+thereof%2C+and+we+resolve+not+to+receive+any+such%2C+except+we+give+here+sufficient+reasons+for+it%3B+as+if+they+be+necessitated+through+the+sin+of+the+minister%2C+or+parish+where+they+live%2C+to+do+it%2C+or+the+like.+R.+12.+We+shall+here+make+it+known+if+there+be+any+members+of+another+parish+%28adjoined+to+no+church%29+who+desire+either+sacrament+from+us%2C+that+we+may+know+from+the+minister+of+that+place+whether+they+are+fit+to+be+admitted+or+not.+R.+13.+Those+who+being+sole+ministers+of+particular+churches%2C+do+doubt+whether+they+alone+may+judge+any+man+to+be+unfit+for+church+communion%2C+and+so+declare+him%3B+or+may+publicly+by+name+rebuke+him%2C+they+may+do+well+here+to+take+the+advice+of+the+association+for+their+proceedings.+R.+14.+We+desire+that+all+young+ministers%2C+or+any+that+are+not+well+furnished+with+discretion+and+ability+to+manage+those+public+reproofs+and+censures%2C+would+do+nothing+in+it+without+first+consulting+these+assemblies%2C+yea+in+so+weighty+a+case+as+is+excluding+from+Church+communion%2C+we+judge+it+convenient+that+all+ministers+advise+with+their+brethren+of+that+association+for+their+safer+proceeding.+R.+15.+We+shall+here+consult+about+the+good+of+neighbor+churches%2C+for+helping+them+where+they+want+teaching%2C+for+advising+them+against+errors%2C+seducers%2C+or+scandals%2C+and+furthering+to+our+power+the+propagation+of+the+Gospel.+R.+16.+We+do+resolve+to+frequent+these+meetings+as+constantly+as+we+can%2C+and+not+neglect+them+and+frustrate+their+ends.+R.+17.+we+shall+once+a+quarter+%28and+oftener+if+emergent+occasion+require+it%29+send+delegates+from+all+these+associations+to+Worcester+%28not+forbidding+any+other+to+be+there%29+where+we+shall+hold+a+more+general+meeting+for+the+resolving+of+greatest+difficulties%2C+and+the+more+unanimous+carrying+on+the+work+of+the+Gospel.+R.+18.+We+shall+admit+into+these+our+associations+the+neighbor+ministers+also+of+other+counties%2C+where+no+such+associations+are%2C+or+are+so+remote+that+they+cannot+well+join+in+them.+R.+19.+Before+any+of+us+shall+forsake+this+agreement+and+these+resolutions%2C+we+shall+give+our+reasons+to+the+association%2C+and+hear+what+they+can+say+against+it%3B+and+not+do+it+without+sufficient+cause.+R.+20.+We+resolve+in+none+of+our+meetings+to+go+beyond+the+bounds+of+our+calling%2C+in+meddling+with+secular+or+state+affairs%2C+nor+do+anything+injurious+to+the+commonwealth%3B+but+maintain+all+just+obedience+to+authority%3B+and+shall+direct+all+our+consultations+to+the+good+of+souls%2C+the+propagation+of+the+Gospel%2C+the+unity%2C+peace+and+reformation+of+the+Church%2C+and+the+glory+and+pleasing+of+God+in+all.+Consentimus+nos+infra+scripti.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb03585f1c4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b03585f1c4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=The%20Propositions%20agreed%20on%20by%20the,Consentimus%20nos%20infra%20scripti." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But as this peace among Protestant Churches is very much to be wished and prayed for, so I despair to see so glorious a work take effect, except the differing parties would resolve to stand to the rules following: 1. That the respective parties which agree in the chief points of religion do not make any of those points they differ in, fundamental, as if the fortune of religion depended upon it, or as if those different points were so many different religions. 2. That the differing parties do not damn one another for those differences, there being nothing that has done religion more hurt than men’s damning one another for things which Christ and his apostles have affixed no damnation to. 3. That notwithstanding the little differences that are among them, they make one Church and endeavour after the welfare and prosperity of it, and join together in public prayer and in the sacrament of the eucharist, which is the badge and symbol of fraternity and amity. 4. That one party be not presently jealous and suspicious of the other, as if the opinion which one party espouses were embraced or maintained in a humor or for worldly ends, but that they charitably believe it’s conscience that puts them upon it, at least till either the party espousing that opinion confesses that conscience is not at the bottom of it or that it appear by undeniable evidences that a worldly or sinister design is the foundation of it. 5. That the differing parties do not multiply the controversies which are amongst them, make them neither more numerous nor greater than really they are, and that they do not interpret an accidental unwary expression that may drop from the pen or mouth of one party as a new controversy. 6. That one party do not charge the other with consequences which they do not own, nor with doctrines and positions which they detest from their hearts. 7. That each party defending or proving their opinion do it with great modesty, without provoking or exasperating or approbrious language and revilings or bitter reflections on the other. 8. That of these differing parties none do vie with the other except it be in living up to the precepts of the Gospel, particularly those of patience, long-suffering and charity. These rules I apprehend to be the foundation of peace and concord of Protestant Churches that differ in points of no great concernment; and were these maxims once put in practice, the particular controversies might soon be compromised. To this purpose is that saying of the apostle: ‘Nevertheless, whereto we have already attained, let’s walk by the same rule, let’s mind the same things; and if any be otherwise minded, God will even reveal that unto you,’ Phil. 3:15-16.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But as this peace among Protestant Churches is very much to be wished and prayed for, so I despair to see so glorious a work take effect, except the differing parties would resolve to stand to the rules following: 1. That the respective parties which agree in the chief points of religion do not make any of those points they differ in, fundamental, as if the fortune of religion depended upon it, or as if those different points were so many different religions. 2. That the differing parties do not damn one another for those differences, there being nothing that has done religion more hurt than men’s damning one another for things which Christ and his apostles have affixed no damnation to. 3. That notwithstanding the little differences that are among them, they make one Church and endeavour after the welfare and prosperity of it, and join together in public prayer and in the sacrament of the eucharist, which is the badge and symbol of fraternity and amity. 4. That one party be not presently jealous and suspicious of the other, as if the opinion which one party espouses were embraced or maintained in a humor or for worldly ends, but that they charitably believe it’s conscience that puts them upon it, at least till either the party espousing that opinion confesses that conscience is not at the bottom of it or that it appear by undeniable evidences that a worldly or sinister design is the foundation of it. 5. That the differing parties do not multiply the controversies which are amongst them, make them neither more numerous nor greater than really they are, and that they do not interpret an accidental unwary expression that may drop from the pen or mouth of one party as a new controversy. 6. That one party do not charge the other with consequences which they do not own, nor with doctrines and positions which they detest from their hearts. 7. That each party defending or proving their opinion do it with great modesty, without provoking or exasperating or approbrious language and revilings or bitter reflections on the other. 8. That of these differing parties none do vie with the other except it be in living up to the precepts of the Gospel, particularly those of patience, long-suffering and charity. These rules I apprehend to be the foundation of peace and concord of Protestant Churches that differ in points of no great concernment; and were these maxims once put in practice, the particular controversies might soon be compromised. To this purpose is that saying of the apostle: ‘Nevertheless, whereto we have already attained, let’s walk by the same rule, let’s mind the same things; and if any be otherwise minded, God will even reveal that unto you,’ Phil. 3:15-16.”

— Anthony Horneck, The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697), pp. 34-37">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+as+this+peace+among+Protestant+Churches+is+very+much+to+be+wished+and+prayed+for%2C+so+I+despair+to+see+so+glorious+a+work+take+effect%2C+except+the+differing+parties+would+resolve+to+stand+to+the+rules+following%3A+1.+That+the+respective+parties+which+agree+in+the+chief+points+of+religion+do+not+make+any+of+those+points+they+differ+in%2C+fundamental%2C+as+if+the+fortune+of+religion+depended+upon+it%2C+or+as+if+those+different+points+were+so+many+different+religions.+2.+That+the+differing+parties+do+not+damn+one+another+for+those+differences%2C+there+being+nothing+that+has+done+religion+more+hurt+than+men%E2%80%99s+damning+one+another+for+things+which+Christ+and+his+apostles+have+affixed+no+damnation+to.+3.+That+notwithstanding+the+little+differences+that+are+among+them%2C+they+make+one+Church+and+endeavour+after+the+welfare+and+prosperity+of+it%2C+and+join+together+in+public+prayer+and+in+the+sacrament+of+the+eucharist%2C+which+is+the+badge+and+symbol+of+fraternity+and+amity.+4.+That+one+party+be+not+presently+jealous+and+suspicious+of+the+other%2C+as+if+the+opinion+which+one+party+espouses+were+embraced+or+maintained+in+a+humor+or+for+worldly+ends%2C+but+that+they+charitably+believe+it%E2%80%99s+conscience+that+puts+them+upon+it%2C+at+least+till+either+the+party+espousing+that+opinion+confesses+that+conscience+is+not+at+the+bottom+of+it+or+that+it+appear+by+undeniable+evidences+that+a+worldly+or+sinister+design+is+the+foundation+of+it.+5.+That+the+differing+parties+do+not+multiply+the+controversies+which+are+amongst+them%2C+make+them+neither+more+numerous+nor+greater+than+really+they+are%2C+and+that+they+do+not+interpret+an+accidental+unwary+expression+that+may+drop+from+the+pen+or+mouth+of+one+party+as+a+new+controversy.+6.+That+one+party+do+not+charge+the+other+with+consequences+which+they+do+not+own%2C+nor+with+doctrines+and+positions+which+they+detest+from+their+hearts.+7.+That+each+party+defending+or+proving+their+opinion+do+it+with+great+modesty%2C+without+provoking+or+exasperating+or+approbrious+language+and+revilings+or+bitter+reflections+on+the+other.+8.+That+of+these+differing+parties+none+do+vie+with+the+other+except+it+be+in+living+up+to+the+precepts+of+the+Gospel%2C+particularly+those+of+patience%2C+long-suffering+and+charity.+These+rules+I+apprehend+to+be+the+foundation+of+peace+and+concord+of+Protestant+Churches+that+differ+in+points+of+no+great+concernment%3B+and+were+these+maxims+once+put+in+practice%2C+the+particular+controversies+might+soon+be+compromised.+To+this+purpose+is+that+saying+of+the+apostle%3A+%E2%80%98Nevertheless%2C+whereto+we+have+already+attained%2C+let%E2%80%99s+walk+by+the+same+rule%2C+let%E2%80%99s+mind+the+same+things%3B+and+if+any+be+otherwise+minded%2C+God+will+even+reveal+that+unto+you%2C%E2%80%99+Phil.+3%3A15-16.%E2%80%9D%0A%0A%E2%80%94+Anthony+Horneck%2C+The+Blessed+Advantages+of+Peace+%26+Peacemakers+In+a+Sermon+preached+at+the+Savoy+in+London+upon+the+Fifth+of+St.+Matthew%2C+verse+9%2C+%E2%80%98Blessed+are+the+Peace-makers%E2%80%A6%E2%80%99+%28London%3A+Aylmer%2C+1697%29%2C+pp.+34-37&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69c3303193.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69c3303193.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=But%20as%20this%20peace%20among%20Protestant,reveal%20that%20unto%20you%2C%E2%80%99%20Phil.%203%3A15%2D16." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>First, that the blessed and long sought for union of Protestant Churches may be recommended unto the public prayers of the Church. And secondly, that either an Evangelical correspondency for mutual edification, for healing of breaches, for taking away of scandals and for the advancement of the Gospel of Jesus Christ amongst Protestants should henceforth be entertained with foreign Churches, by those to whom the care of so blessed a work may be with authority referred: Or that his Majesty, with your Honours’ advice and grave counsel, might be moved to call together a general synod of Protestants in due time, for the better setling of weighty matters in the Church, which now trouble not only the consciences of most men, but disturb the tranquility of publick states and divide the Churches one from another to the great hinderance of Christianity, and the dishonour of religion. All which evils by this means may be taken out of the way, and from hence a great blessing of God, and much honour amongst men will redound to this Church and nation…</p></blockquote>

</figure><figure class="quote" id="q-c6c4db6eae" data-kw="">
<blockquote><p>Seeing the motion of furthering ecclesiastical reconcilement amongst Protestants has been hitherto very favourably entertained by foreign States and Churches… that there is a most laudable purpose intended, and a good inclination expressed towards the furthering of the good of all Protestants, for the preservation of true religion and the union of their Churches with ours in the same cause, against the common enemies, which by our divisions are encouraged to intend, and enabled to work out our destruction; which they will certainly bring to pass if the Fatherly providence of our good God, whose counsels are unsearchable, and his ways past finding out, does not prevent their malice, by our loving concurrence in the ways of brotherly union, for the maintaining of his glorious Gospel… Therefore your petitioner does humbly request, that in the order, which hopefully will be made for the observation of that day of fasting and praying, this purpose of ecclesiastical reconcilement of Protestants by the union of their spirits in the truth of God, and against the adversaries of Christ’s Gospel, may be expressly mentioned to be recommended unto God by the prayers of that public meeting. And also, that some divines may be thought upon and nominated unto your petitioner, to whom he should make his address to begin a spiritual correspondence, which in this purpose is necessary, for the preparing and ripening of such proposals, as by the grace of God will be able to bring the wished for union of Protestants in due time to some perfection.</p></blockquote>

<blockquote><p>England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.”

tians+Disagree%3A+Lessons+from+the+Fractured+Relationship+of+John+Owen+and+Richard+Baxter+%28Crossway%2C+2024%29%2C+pp.+23%2C+91-92%2C+104.+Cooper%3A%2C+p.+23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f8b9a4f73.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f8b9a4f73.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=England%20had%20a%20divided%20church.%20Even,associations%20sprang%20up%20in%20other%20counties." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I. The Articles of the Christian Belief It is a catechism if you prefix to every article the question, ‘What do you believe?’ There is one only God in three persons, the Father, Son and Holy Ghost: who is infinite in being, power, wisdom and goodness: the Creator of all things, our most absolute Lord, most righteous Governor and most gracious Father. God made man for Himself in his own image, with reason and freewill: endued with wisdom and holiness; and put under him the inferior creatures, for his use: and bound him by the Law of Nature to adhere to God his Maker; to believe Him, fear Him, love Him, honor Him and obey Him with all his powers: moreover forbidding Him to eat of the Tree of Knowledge upon pain of death. Man being tempted by Satan, did willfully sin, and so fell from God and happiness, under the wrath of God, the curse of his Law and the power of the Devil: and hence we are all conceived in sin, and prone to evil, and condemnation is passed upon all; and no mere creature is able to deliver us. God so loved the world that He gave his only Son to be their Redeemer; who being God, and one with the Father did take our nature, and become man; being conceived by the Holy Ghost in the Virgin Mary, and born of her, and called Jesus Christ; and being free from sin, He conquered the tempter, fulfilled all righteousness, revealed the Gospel, and confirmed it by miracles; and gave Himself a sacrifice for our sins, and a ransom for us, in suffering death on the cross, to reconcile us unto God; and was buried, and went among the dead) and rose again the third day, having conquered death; and afterward ascended into heaven where he remains God and Man, in one Person, and is Lord of all, in glory with the Father; the chief Priest, and Prophet, and King of his Church; interceding for us; and teaching and ruling us, by his Spirit, ministers, and Word. The Lord Jesus Christ has ordained in his Testament that all they that receive Him by a true effectual faith, and by true repentance do turn from the flesh, the world, and the Devil unto God, shall freely receive the pardon of their sins, and shall become the sons of God, and heirs of everlasting life, and the Spirit of Christ shall dwell within them: and all that overcome and persevere to the death, shall live with Christ in endless glory: But the unbelievers, impenitent and unholy shall be condemned to everlasting fire. And this He has commanded his ministers to preach to all the world: And has told us that, All that are given Him of the Father, shall come to Him, and that he will in no wise cast them out, nor shall any pluck them out of his hands. The Holy Ghost proceeding from the Father and the Son, did inspire and guide the prophets, apostles, and evangelists, that they might truly and fully reveal the doctrine of Christ, and deliver it in Scripture to the Church as the rule of our faith and life: and by abundance of evident uncontrolled miracles, and wonderful gifts, to be the great witness of Christ, and of the truth of his holy Word. Where the Gospel is made known, the Holy Ghost by it does enlighten the minds of all that shall be saved, and opening and softening their hearts, does draw them to believe in Christ and turns them from the power of Satan unto God: Whereupon they are joined to Christ the Head, and into one holy catholic Church which is his Body, consisting of all true believers: and are freely justified, and made the sons of God; and a sanctified peculiar people unto Him, and do love Him above all, and serve Him sincerely in holiness and righteousness, loving and desiring the communion of the saints; overcoming the flesh, the world and the Devil, and hoping for Christ’s second coming, and for everlasting life. At death the souls of the justified go to happiness with Christ, and the souls of the wicked to misery: And at the end of this world the Lord Jesus Christ will come again, and will raise the bodies of all men from the dead; and will judge all according to their works; And the righteous shall go into everlasting life, and the rest into everlasting punishment: All this I do unfeignedly believe. II. Our Consent to the Gospel Covenant, with God the Father, Son and Holy Ghost, by which we are Christians and members of the catholic Church Question: Are you willing and resolved to give up yourself to God the Father, Son and Holy Ghost, according to the Gospel doctrine which your profess? Repenting of my sins and renouncing the flesh, the world and the devil, I do take this one God to be my only God, and do heartily give up myself unto Him; even to the Father, as my Creator and reconciled Father in Christ: And to his Son Jesus Christ, as my Lord, and only Savior, to reconcile and bring me unto God: And to the Holy Ghost as my Sanctifier; that He may further illuminate, sanctify and confirm me, and I may hold fast and obey the doctrine of Christ, which was revealed by his inspiration, and witnessed by his gifts and miracles, and is now contained in the Holy Scriptures; and that he may be in me the earnest of my everlasting happiness with God. III. The Sum of Christian Duty Question: What are [???…] Christ has appointed that fit men shall be ordained his ministers, to preach the Gospel to the nations of the world, and make them his disciples, baptizing them in the name of the Father, Son and Holy Ghost: and to congregate his disciples, and to oversee and guide the several congregations, and each member thereof: particularly, to teach them the Word of God; to pray and praise God with them and for them to administer the Lord’s Supper in remembrance of Him; especially on the Lord’s Day, which He has appointed for holy communion in such works: Also to rebuke with authority the scandalous and unruly; and to bind and reject those that are obstinately impenitent, and unreformed; and to absolve and restore the penitent, and confirm the weak. It is therefore the people’s duty to join with such churches, for the aforesaid worship of God; and to know, hear, submit to, and obey these their guides that are over them in the Lord; and to avoid division and discord, and to live in unity, love and peace. The secret duties of holiness are these: The exercise of faith, repentance, love, hope, delight in God, and all other graces; The mortifying of our sins; especially atheism, unbelief, and unholiness; hardness of heart, disobedience and unthankfulness, flesh-pleasing, covetousness, and pride; The diligent examining of our own hearts, about our estates, our duties, and our sins: meditating upon God, and his Word and works; especially of our redemption by Jesus Christ; and of death, Judgment, heaven, and Hell; watching diligently over our thoughts, affections, words and actions: resisting temptations: And frequent and fervent prayer to God, in the name of Christ, with confession, thanksgiving, and cheerful praises; Parents and masters must diligently teach their children and servants the Word and fear of God, and pray with them and for them, and hinder them from sin, and use all their power that they and their households may serve the Lord: children and servants must willingly learn and obey: We must seek instruction in the matters of our salvation, especially of our teachers: we must take heed of the company of tempting and ungodly persons, and delight in the company and help of the godly: We must lovingly and faithfully give, and thankfully receive admonitions and exhortations: confessing our faults one to another: and by prayer, psalms, and edifying conference, and a holy conversation, provoking one another to love, and to good works. Superiors must rule for God and the common good, with justice and mercy: Inferiors must honor and obey them in the Lord: We must not injure, but preserve the life, chastity, estate, name, and rights of our neighbor: Not seeking our own against his welfare, but doing as we would be done by; forbearing and forgiving; and loving our neighbor as ourselves: Yea loving our enemies; and doing good to all according to our power.</p></blockquote>

ll+that+shall+be+saved%2C+and+opening+and+softening+their+hearts%2C+does+draw+them+to+believe+in+Christ+and+turns+them+from+the+power+of+Satan+unto+God%3A+Whereupon+they+are+joined+to+Christ+the+Head%2C+and+into+one+holy+catholic+Church+which+is+his+Body%2C+consisting+of+all+true+believers%3A+and+are+freely+justified%2C+and+made+the+sons+of+God%3B+and+a+sanctified+peculiar+people+unto+Him%2C+and+do+love+Him+above+all%2C+and+serve+Him+sincerely+in+holiness+and+righteousness%2C+loving+and+desiring+the+communion+of+the+saints%3B+overcoming+the+flesh%2C+the+world+and+the+Devil%2C+and+hoping+for+Christ%E2%80%99s+second+coming%2C+and+for+everlasting+life.+At+death+the+souls+of+the+justified+go+to+happiness+with+Christ%2C+and+the+souls+of+the+wicked+to+misery%3A+And+at+the+end+of+this+world+the+Lord+Jesus+Christ+will+come+again%2C+and+will+raise+the+bodies+of+all+men+from+the+dead%3B+and+will+judge+all+according+to+their+works%3B+And+the+righteous+shall+go+into+everlasting+life%2C+and+the+rest+into+everlasting+punishment%3A+All+this+I+do+unfeignedly+believe.+II.+Our+Consent+to+the+Gospel+Covenant%2C+with+God+the+Father%2C+Son+and+Holy+Ghost%2C+by+which+we+are+Christians+and+members+of+the+catholic+Church+Question%3A+Are+you+willing+and+resolved+to+give+up+yourself+to+God+the+Father%2C+Son+and+Holy+Ghost%2C+according+to+the+Gospel+doctrine+which+your+profess%3F+Repenting+of+my+sins+and+renouncing+the+flesh%2C+the+world+and+the+devil%2C+I+do+take+this+one+God+to+be+my+only+God%2C+and+do+heartily+give+up+myself+unto+Him%3B+even+to+the+Father%2C+as+my+Creator+and+reconciled+Father+in+Christ%3A+And+to+his+Son+Jesus+Christ%2C+as+my+Lord%2C+and+only+Savior%2C+to+reconcile+and+bring+me+unto+God%3A+And+to+the+Holy+Ghost+as+my+Sanctifier%3B+that+He+may+further+illuminate%2C+sanctify+and+confirm+me%2C+and+I+may+hold+fast+and+obey+the+doctrine+of+Christ%2C+which+was+revealed+by+his+inspiration%2C+and+witnessed+by+his+gifts+and+miracles%2C+and+is+now+contained+in+the+Holy+Scriptures%3B+and+that+he+may+be+in+me+the+earnest+of+my+everlasting+happiness+with+God.+III.+The+Sum+of+Christian+Duty+Question%3A+What+are+%5B%3F%3F%3F%E2%80%A6%5D+Christ+has+appointed+that+fit+men+shall+be+ordained+his+ministers%2C+to+preach+the+Gospel+to+the+nations+of+the+world%2C+and+make+them+his+disciples%2C+baptizing+them+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3A+and+to+congregate+his+disciples%2C+and+to+oversee+and+guide+the+several+congregations%2C+and+each+member+thereof%3A+particularly%2C+to+teach+them+the+Word+of+God%3B+to+pray+and+praise+God+with+them+and+for+them+to+administer+the+Lord%E2%80%99s+Supper+in+remembrance+of+Him%3B+especially+on+the+Lord%E2%80%99s+Day%2C+which+He+has+appointed+for+holy+communion+in+such+works%3A+Also+to+rebuke+with+authority+the+scandalous+and+unruly%3B+and+to+bind+and+reject+those+that+are+obstinately+impenitent%2C+and+unreformed%3B+and+to+absolve+and+restore+the+penitent%2C+and+confirm+the+weak.+It+is+therefore+the+people%E2%80%99s+duty+to+join+with+such+churches%2C+for+the+aforesaid+worship+of+God%3B+and+to+know%2C+hear%2C+submit+to%2C+and+obey+these+their+guides+that+are+over+them+in+the+Lord%3B+and+to+avoid+division+and+discord%2C+and+to+live+in+unity%2C+love+and+peace.+The+secret+duties+of+holiness+are+these%3A+The+exercise+of+faith%2C+repentance%2C+love%2C+hope%2C+delight+in+God%2C+and+all+other+graces%3B+The+mortifying+of+our+sins%3B+especially+atheism%2C+unbelief%2C+and+unholiness%3B+hardness+of+heart%2C+disobedience+and+unthankfulness%2C+flesh-pleasing%2C+covetousness%2C+and+pride%3B+The+diligent+examining+of+our+own+hearts%2C+about+our+estates%2C+our+duties%2C+and+our+sins%3A+meditating+upon+God%2C+and+his+Word+and+works%3B+especially+of+our+redemption+by+Jesus+Christ%3B+and+of+death%2C+Judgment%2C+heaven%2C+and+Hell%3B+watching+diligently+over+our+thoughts%2C+affections%2C+words+and+actions%3A+resisting+temptations%3A+And+frequent+and+fervent+prayer+to+God%2C+in+the+name+of+Christ%2C+with+confession%2C+thanksgiving%2C+and+cheerful+praises%3B+Parents+and+masters+must+diligently+teach+their+children+and+servants+the+Word+and+fear+of+God%2C+and+pray+with+them+and+for+them%2C+and+hinder+them+from+sin%2C+and+use+all+their+power+that+they+and+their+households+may+serve+the+Lord%3A+children+and+servants+must+willingly+learn+and+obey%3A+We+must+seek+instruction+in+the+matters+of+our+salvation%2C+especially+of+our+teachers%3A+we+must+take+heed+of+the+company+of+tempting+and+ungodly+persons%2C+and+delight+in+the+company+and+help+of+the+godly%3A+We+must+lovingly+and+faithfully+give%2C+and+thankfully+receive+admonitions+and+exhortations%3A+confessing+our+faults+one+to+another%3A+and+by+prayer%2C+psalms%2C+and+edifying+conference%2C+and+a+holy+conversation%2C+provoking+one+another+to+love%2C+and+to+good+works.+Superiors+must+rule+for+God+and+the+common+good%2C+with+justice+and+mercy%3A+Inferiors+must+honor+and+obey+them+in+the+Lord%3A+We+must+not+injure%2C+but+preserve+the+life%2C+chastity%2C+estate%2C+name%2C+and+rights+of+our+neighbor%3A+Not+seeking+our+own+against+his+welfare%2C+but+doing+as+we+would+be+done+by%3B+forbearing+and+forgiving%3B+and+loving+our+neighbor+as+ourselves%3A+Yea+loving+our+enemies%3B+and+doing+good+to+all+according+to+our+power.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Christian+Religion+expressed%3A+I.+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II.+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1.+the+articles+of+the+Christian+Belief%2C+2.+our+consent+to+the+Gospel+Covenant%2C+3.+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29+%7C+The+Profession+of+the+Christian+Religion.+See+the+original+for+the+Scripture+proofs.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a4aed3395.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a4aed3395.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=I.%20The%20Articles%20of%20the%20Christian,to%20all%20according%20to%20our%20power." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I. We do each one for himself, profess our resolution, in the strength of Christ, to be faithful and diligent in the works of our ministry; and to live an holy and exemplary life, in piety, justice and charity, according to the measure of our abilities: Especially watching against those sins that tend to the corrupting or dividing of the Church, and to the hindering of our ministry; and to the dishonor of the Gospel, and of our holy profession. II. We do profess our agreement and resolution in the strength of Christ, to be faithful and diligent in public preaching the Gospel: And in the personal instructing of all in our parishes, or undertaken limits, that will submit thereto; teaching the ignorant the principles of religion; endeavoring in love, compassion and meekness, and yet with seriousness and zeal, to convince the erroneous and opposers, to awaken the presumptuous and secure, and help them to try the state of their souls, and to see and feel their sin and misery, and return to God by Christ that they may live: to strengthen the weak; to raise the fallen; to edify and confirm the strong; and to comfort such as need consolation; and to help them all to prepare for death and judgment, and for everlasting life: And all this, as frequently, constantly and orderly, as our strength, and time, and greater duties will permit. III. That the churches may be capable of the discipline of Christ, and constituted and ruled according to the Word of God, and the ends of our office and labors may be attained, we are agreed and resolved to take none for adult members of the churches committed to our special charge, nor admit them, as such, to church-communion and privileges, but those that have first made some personal credible profession of true Christianity, that is, of faith and obedience, and as members of those churches, submit to our pastoral oversight according to the Word of God. But all that make this profession of Christianity and consent to live in communion with the church, and under the ministry and discipline of Christ, we shall receive, though they be weak in knowledge, and utterance, and duties; and shall faithfully employ our ministerial abilities and care for their edification and salvation. IV. We are agreed and resolved in the strength of Christ, while we have ability and opportunity, to congregate the people and hold constant assemblies, especially on the Lord’s Days; and therein faithfully to perform the works of our office, in reading the holy Scripture, preaching, praying, baptizing, praising God, celebrating the sacrament of the Lord’s Supper, and guiding the people in the whole public worship of God: And to manage our work with as much prudence, and reverence, and love, and compassion to the people’s souls, and with as much plainness and convincing evidence, authority, seriousness, and zealous importunity as we can: Avoiding as far as we are able, such things as corrupt and dishonor God’s ordinances, and tend to corrupt the people’s minds with error, presumption, deadness, negligence, or other distempers, displeasing to the Lord. V. For the ends of our office, in obedience to the Lord, we agree and resolve in the strength of Christ, to exercise so much of church government and discipline, in the churches committed to our charge, as we discern to be our certain duty; that is, to keep order and decency in the holy assemblies, and see that all be done to edification: convicting seducers, and stopping the mouths of perverse gainsayers; overseeing the several members of our charge; and requiring them to walk obediently to Christ, and do their duties towards each other: to reprove the gross and scandalous offenders: and if they continue impenitent or unreformed, to tell the Church, or rebuke them before all; (and publicly pray for their recovery): And if they hear not the Church, but remain impenitent and unreformed, after sufficient reproof and patience, to put away such persons from among us, declaring against them the threatenings of the Lord, and requiring them to forbear communion with the Church, and requiring the church to avoid them, and have no familiarity or communion with them, as persons unmeet for the communion of saints. And those that credibly profess repentance, we are to absolve ministerially in the name of Christ, and comfort with the promises of grace; receiving them, and requiring the people to receive them, as brethren, into their communion: but warning them to watch and sin so no more, lest worse befall them. This holy discipline, by the help of God, we shall exercise faithfully and impartially, but yet with caution and moderation; neglecting no necessary consultations with other pastors, or concurrence of the Church: and consenting to be responsible for mal-administrations. VI. For the communion of churches, and the strengthening ourselves for the work of God, and helping one another therein, and maintaining unity, love and concord, we do consent to hold a brotherly communion and correspondency: And to that end, when necessity or greater duty hinders us not, we shall meet at such convenient times and places, as shall be appointed or agreed on from time to time; and shall labor to improve these meetings to our mutual edification, in such consultations, conferences or other holy exercises, as our present case shall most require. And we consent to deal faithfully in advising and admonishing one another; and for the satisfaction of the brethren (to the forementioned ends) to be responsible, if any shall charge us with heresy, scandal, schism, or mal-administration: And forbearing matters without our line, to study and endeavor the promoting of truth, and holiness, and unity among ourselves, and with other churches, as we have a call. And also we agree by communicatory letters upon all needful occasions, to certify our brethren and other churches of the state of our affairs, and of particular members, that those that justly have communion in one church, or are excluded, may have communion with other churches, or be refused by them accordingly, when there is just occasion. And if any brethren or Churches be prevailed over so far by temptation, as unjustly to deny us their communion, in this way of Association, assemblies, or correspondency, we shall not therefore deny them to be our brethren, or churches of Christ, but shall love and own them, and have so much communion with them as their distance shall leave them capable of, if they join with us in the profession and practice of true Christianity, and of the points that are necessary to church-constitution and communion, and are not proved guilty of heresy, ungodliness, or such kind of schism or scandalous sins for which the Scripture commands us to reject men and avoid them. But such as are thus guilty (though they offer themselves to associate with us) we shall refuse to hold communion with, till they credibly profess repentance, and manifest a reformation. VII. Because it is a matter of great concernment to the honor of Christ, the propagation of the Gospel, and the increase and welfare of the Church, that there be a provision of able, faithful ministers, and that unworthy persons be kept out; and because deceivers and unworthy men are forward to intrude, and the people ordinarily are insufficient of themselves to make such trial of men’s ability and soundness as is requisite to the safety of the Church; and the Church in all ages has received ministers by the ordination of other ministers of Christ: We do therefore agree to be careful and faithful in the discharge of our duties hereabout, so far as we can discern them, resolving that if any vacant church desire us to recommend a fit person to be their pastor, or to judge of any recommended to them, we will not recommend or approve of any, but such as we judge most agreeable to the will of Christ; nor will we prefer less fit and worthy men, for friendship or any carnal interest or respect. And if any intollerably unworthy person be about to intrude, or have intruded, or any neighbor church be about to choose, or have chosen such, if we have opportunity, we shall faithfully acquaint them with their sin and danger, and persuade them to a better course. And if we shall be called to invest any by solemn ordination in the sacred office of the ministry, we shall perform it, as near as we are able, according to the directions of the Word of God; admitting none that Christ excludes: And if it may be, we shall do it in that congregation which the person is to oversee, that so we may the better discern their mutual consent, inculcate their duties and engage them to a faithful performance thereof. And whereas it is much controverted of late whether the power of Ordination be given to the people or the pastors of a particular church, or the Associated neighbor pastors, and whether a stated president among these should not have a negative voice herein, we are agreed that leaving the people their due liberty of consent in the reception of their proper pastors, we will none of us singly ordain, without the assistance of other pastors: Nor will we join with any heretics or others, in unjust and impious ordinations that tend to the corrupting or dividing of the churches. And to avoid division upon a tolerable difference of opinions, where we may agree in practice, we consent that the Associations that have no stated presidents, or that give not to such a negative voice, shall receive into their communion those that are of the contrary opinion; giving them leave, if they desire it, to profess or record their opinion in that particular, so they will afterward walk among them in love and peace. And that the Associations that choose a stated president, and give him a negative voice in ordination, shall in like manner, and on like terms, receive into their communion, such as dissent in that particular, and having professed or recorded their dissent, will walk submissively in love and peace. Which liberty also of professing and recording their different principles, we desire may be allowed them, that join in synods, as being only for communion of churches, and them that join in them, as having a direct superior governing power over the particular pastors of the churches. VIII. Though it be the surest way to peace and concord to take up with these necessary things, and we cannot approve of the narrow dividing principles of those men that will impose things unnecessary, to the excluding of the necessary, yet if our lawful rulers shall command it, or the peace of the Church through the distempers of the brethren shall require it, we shall obey, and consent in things that God has not forbidden; and if we suffer for well-doing, and for obeying God rather than men, we shall endeavor to imitate our Lord, who being reviled, reviled not again, and when he suffered, threatened not; but committed all to Him that judges righteously, 1 Pet. 2:23.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I. We do each one for himself, profess our resolution, in the strength of Christ, to be faithful and diligent in the works of our ministry; and to live an holy and exemplary life, in piety, justice and charity, according to the measure of our abilities: Especially watching against those sins that tend to the corrupting or dividing of the Church, and to the hindering of our ministry; and to the dishonor of the Gospel, and of our holy profession. II. We do profess our agreement and resolution in the strength of Christ, to be faithful and diligent in public preaching the Gospel: And in the personal instructing of all in our parishes, or undertaken limits, that will submit thereto; teaching the ignorant the principles of religion; endeavoring in love, compassion and meekness, and yet with seriousness and zeal, to convince the erroneous and opposers, to awaken the presumptuous and secure, and help them to try the state of their souls, and to see and feel their sin and misery, and return to God by Christ that they may live: to strengthen the weak; to raise the fallen; to edify and confirm the strong; and to comfort such as need consolation; and to help them all to prepare for death and judgment, and for everlasting life: And all this, as frequently, constantly and orderly, as our strength, and time, and greater duties will permit. III. That the churches may be capable of the discipline of Christ, and constituted and ruled according to the Word of God, and the ends of our office and labors may be attained, we are agreed and resolved to take none for adult members of the churches committed to our special charge, nor admit them, as such, to church-communion and privileges, but those that have first made some personal credible profession of true Christianity, that is, of faith and obedience, and as members of those churches, submit to our pastoral oversight according to the Word of God. But all that make this profession of Christianity and consent to live in communion with the church, and under the ministry and discipline of Christ, we shall receive, though they be weak in knowledge, and utterance, and duties; and shall faithfully employ our ministerial abilities and care for their edification and salvation. IV. We are agreed and resolved in the strength of Christ, while we have ability and opportunity, to congregate the people and hold constant assemblies, especially on the Lord’s Days; and therein faithfully to perform the works of our office, in reading the holy Scripture, preaching, praying, baptizing, praising God, celebrating the sacrament of the Lord’s Supper, and guiding the people in the whole public worship of God: And to manage our work with as much prudence, and reverence, and love, and compassion to the people’s souls, and with as much plainness and convincing evidence, authority, seriousness, and zealous importunity as we can: Avoiding as far as we are able, such things as corrupt and dishonor God’s ordinances, and tend to corrupt the people’s minds with error, presumption, deadness, negligence, or other distempers, displeasing to the Lord. V. For the ends of our office, in obedience to the Lord, we agree and resolve in the strength of Christ, to exercise so much of church government and discipline, in the churches committed to our charge, as we discern to be our certain duty; that is, to keep order and decency in the holy assemblies, and see that all be done to edification: convicting seducers, and stopping the mouths of perverse gainsayers; overseeing the several members of our charge; and requiring them to walk obediently to Christ, and do their duties towards each other: to reprove the gross and scandalous offenders: and if they continue impenitent or unreformed, to tell the Church, or rebuke them before all; (and publicly pray for their recovery): And if they hear not the Church, but remain impenitent and unreformed, after sufficient reproof and patience, to put away such persons from among us, declaring against them the threatenings of the Lord, and requiring them to forbear communion with the Church, and requiring the church to avoid them, and have no familiarity or communion with them, as persons unmeet for the communion of saints. And those that credibly profess repentance, we are to absolve ministerially in the name of Christ, and comfort with the promises of grace; receiving them, and requiring the people to receive them, as brethren, into their communion: but warning them to watch and sin so no more, lest worse befall them. This holy discipline, by the help of God, we shall exercise faithfully and impartially, but yet with caution and moderation; neglecting no necessary consultations with other pastors, or concurrence of the Church: and consenting to be responsible for mal-administrations. VI. For the communion of churches, and the strengthening ourselves for the work of God, and helping one another therein, and maintaining unity, love and concord, we do consent to hold a brotherly communion and correspondency: And to that end, when necessity or greater duty hinders us not, we shall meet at such convenient times and places, as shall be appointed or agreed on from time to time; and shall labor to improve these meetings to our mutual edification, in such consultations, conferences or other holy exercises, as our present case shall most require. And we consent to deal faithfully in advising and admonishing one another; and for the satisfaction of the brethren (to the forementioned ends) to be responsible, if any shall charge us with heresy, scandal, schism, or mal-administration: And forbearing matters without our line, to study and endeavor the promoting of truth, and holiness, and unity among ourselves, and with other churches, as we have a call. And also we agree by communicatory letters upon all needful occasions, to certify our brethren and other churches of the state of our affairs, and of particular members, that those that justly have communion in one church, or are excluded, may have communion with other churches, or be refused by them accordingly, when there is just occasion. And if any brethren or Churches be prevailed over so far by temptation, as unjustly to deny us their communion, in this way of Association, assemblies, or correspondency, we shall not therefore deny them to be our brethren, or churches of Christ, but shall love and own them, and have so much communion with them as their distance shall leave them capable of, if they join with us in the profession and practice of true Christianity, and of the points that are necessary to church-constitution and communion, and are not proved guilty of heresy, ungodliness, or such kind of schism or scandalous sins for which the Scripture commands us to reject men and avoid them. But such as are thus guilty (though they offer themselves to associate with us) we shall refuse to hold communion with, till they credibly profess repentance, and manifest a reformation. VII. Because it is a matter of great concernment to the honor of Christ, the propagation of the Gospel, and the increase and welfare of the Church, that there be a provision of able, faithful ministers, and that unworthy persons be kept out; and because deceivers and unworthy men are forward to intrude, and the people ordinarily are insufficient of themselves to make such trial of men’s ability and soundness as is requisite to the safety of the Church; and the Church in all ages has received ministers by the ordination of other ministers of Christ: We do therefore agree to be careful and faithful in the discharge of our duties hereabout, so far as we can discern them, resolving that if any vacant church desire us to recommend a fit person to be their pastor, or to judge of any recommended to them, we will not recommend or approve of any, but such as we judge most agreeable to the will of Christ; nor will we prefer less fit and worthy men, for friendship or any carnal interest or respect. And if any intollerably unworthy person be about to intrude, or have intruded, or any neighbor church be about to choose, or have chosen such, if we have opportunity, we shall faithfully acquaint them with their sin and danger, and persuade them to a better course. And if we shall be called to invest any by solemn ordination in the sacred office of the ministry, we shall perform it, as near as we are able, according to the directions of the Word of God; admitting none that Christ excludes: And if it may be, we shall do it in that congregation which the person is to oversee, that so we may the better discern their mutual consent, inculcate their duties and engage them to a faithful performance thereof. And whereas it is much controverted of late whether the power of Ordination be given to the people or the pastors of a particular church, or the Associated neighbor pastors, and whether a stated president among these should not have a negative voice herein, we are agreed that leaving the people their due liberty of consent in the reception of their proper pastors, we will none of us singly ordain, without the assistance of other pastors: Nor will we join with any heretics or others, in unjust and impious ordinations that tend to the corrupting or dividing of the churches. And to avoid division upon a tolerable difference of opinions, where we may agree in practice, we consent that the Associations that have no stated presidents, or that give not to such a negative voice, shall receive into their communion those that are of the contrary opinion; giving them leave, if they desire it, to profess or record their opinion in that particular, so they will afterward walk among them in love and peace. And that the Associations that choose a stated president, and give him a negative voice in ordination, shall in like manner, and on like terms, receive into their communion, such as dissent in that particular, and having professed or recorded their dissent, will walk submissively in love and peace. Which liberty also of professing and recording their different principles, we desire may be allowed them, that join in synods, as being only for communion of churches, and them that join in them, as having a direct superior governing power over the particular pastors of the churches. VIII. Though it be the surest way to peace and concord to take up with these necessary things, and we cannot approve of the narrow dividing principles of those men that will impose things unnecessary, to the excluding of the necessary, yet if our lawful rulers shall command it, or the peace of the Church through the distempers of the brethren shall require it, we shall obey, and consent in things that God has not forbidden; and if we suffer for well-doing, and for obeying God rather than men, we shall endeavor to imitate our Lord, who being reviled, reviled not again, and when he suffered, threatened not; but committed all to Him that judges righteously, 1 Pet. 2:23.”

— Richard Baxter, The Christian Religion expressed: I. briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II. more largely in a Profession taken out of the Holy Scriptures, containing 1. the articles of the Christian Belief, 2. our consent to the Gospel Covenant, 3. the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660) | The Agreement of the Associated Pastors">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+We+do+each+one+for+himself%2C+profess+our+resolution%2C+in+the+strength+of+Christ%2C+to+be+faithful+and+diligent+in+the+works+of+our+ministry%3B+and+to+live+an+holy+and+exemplary+life%2C+in+piety%2C+justice+and+charity%2C+according+to+the+measure+of+our+abilities%3A+Especially+watching+against+those+sins+that+tend+to+the+corrupting+or+dividing+of+the+Church%2C+and+to+the+hindering+of+our+ministry%3B+and+to+the+dishonor+of+the+Gospel%2C+and+of+our+holy+profession.+II.+We+do+profess+our+agreement+and+resolution+in+the+strength+of+Christ%2C+to+be+faithful+and+diligent+in+public+preaching+the+Gospel%3A+And+in+the+personal+instructing+of+all+in+our+parishes%2C+or+undertaken+limits%2C+that+will+submit+thereto%3B+teaching+the+ignorant+the+principles+of+religion%3B+endeavoring+in+love%2C+compassion+and+meekness%2C+and+yet+with+seriousness+and+zeal%2C+to+convince+the+erroneous+and+opposers%2C+to+awaken+the+presumptuous+and+secure%2C+and+help+them+to+try+the+state+of+their+souls%2C+and+to+see+and+feel+their+sin+and+misery%2C+and+return+to+God+by+Christ+that+they+may+live%3A+to+strengthen+the+weak%3B+to+raise+the+fallen%3B+to+edify+and+confirm+the+strong%3B+and+to+comfort+such+as+need+consolation%3B+and+to+help+them+all+to+prepare+for+death+and+judgment%2C+and+for+everlasting+life%3A+And+all+this%2C+as+frequently%2C+constantly+and+orderly%2C+as+our+strength%2C+and+time%2C+and+greater+duties+will+permit.+III.+That+the+churches+may+be+capable+of+the+discipline+of+Christ%2C+and+constituted+and+ruled+according+to+the+Word+of+God%2C+and+the+ends+of+our+office+and+labors+may+be+attained%2C+we+are+agreed+and+resolved+to+take+none+for+adult+members+of+the+churches+committed+to+our+special+charge%2C+nor+admit+them%2C+as+such%2C+to+church-communion+and+privileges%2C+but+those+that+have+first+made+some+personal+credible+profession+of+true+Christianity%2C+that+is%2C+of+faith+and+obedience%2C+and+as+members+of+those+churches%2C+submit+to+our+pastoral+oversight+according+to+the+Word+of+God.+But+all+that+make+this+profession+of+Christianity+and+consent+to+live+in+communion+with+the+church%2C+and+under+the+ministry+and+discipline+of+Christ%2C+we+shall+receive%2C+though+they+be+weak+in+knowledge%2C+and+utterance%2C+and+duties%3B+and+shall+faithfully+employ+our+ministerial+abilities+and+care+for+their+edification+and+salvation.+IV.+We+are+agreed+and+resolved+in+the+strength+of+Christ%2C+while+we+have+ability+and+opportunity%2C+to+congregate+the+people+and+hold+constant+assemblies%2C+especially+on+the+Lord%E2%80%99s+Days%3B+and+therein+faithfully+to+perform+the+works+of+our+office%2C+in+reading+the+holy+Scripture%2C+preaching%2C+praying%2C+baptizing%2C+praising+God%2C+celebrating+the+sacrament+of+the+Lord%E2%80%99s+Supper%2C+and+guiding+the+people+in+the+whole+public+worship+of+God%3A+And+to+manage+our+work+with+as+much+prudence%2C+and+reverence%2C+and+love%2C+and+compassion+to+the+people%E2%80%99s+souls%2C+and+with+as+much+plainness+and+convincing+evidence%2C+authority%2C+seriousness%2C+and+zealous+importunity+as+we+can%3A+Avoiding+as+far+as+we+are+able%2C+such+things+as+corrupt+and+dishonor+God%E2%80%99s+ordinances%2C+and+tend+to+corrupt+the+people%E2%80%99s+minds+with+error%2C+presumption%2C+deadness%2C+negligence%2C+or+other+distempers%2C+displeasing+to+the+Lord.+V.+For+the+ends+of+our+office%2C+in+obedience+to+the+Lord%2C+we+agree+and+resolve+in+the+strength+of+Christ%2C+to+exercise+so+much+of+church+government+and+discipline%2C+in+the+churches+committed+to+our+charge%2C+as+we+discern+to+be+our+certain+duty%3B+that+is%2C+to+keep+order+and+decency+in+the+holy+assemblies%2C+and+see+that+all+be+done+to+edification%3A+convicting+seducers%2C+and+stopping+the+mouths+of+perverse+gainsayers%3B+overseeing+the+several+members+of+our+charge%3B+and+requiring+them+to+walk+obediently+to+Christ%2C+and+do+their+duties+towards+each+other%3A+to+reprove+the+gross+and+scandalous+offenders%3A+and+if+they+continue+impenitent+or+unreformed%2C+to+tell+the+Church%2C+or+rebuke+them+before+all%3B+%28and+publicly+pray+for+their+recovery%29%3A+And+if+they+hear+not+the+Church%2C+but+remain+impenitent+and+unreformed%2C+after+sufficient+reproof+and+patience%2C+to+put+away+such+persons+from+among+us%2C+declaring+against+them+the+threatenings+of+the+Lord%2C+and+requiring+them+to+forbear+communion+with+the+Church%2C+and+requiring+the+church+to+avoid+them%2C+and+have+no+familiarity+or+communion+with+them%2C+as+persons+unmeet+for+the+communion+of+saints.+And+those+that+credibly+profess+repentance%2C+we+are+to+absolve+ministerially+in+the+name+of+Christ%2C+and+comfort+with+the+promises+of+grace%3B+receiving+them%2C+and+requiring+the+people+to+receive+them%2C+as+brethren%2C+into+their+communion%3A+but+warning+them+to+watch+and+sin+so+no+more%2C+lest+worse+befall+them.+This+holy+discipline%2C+by+the+help+of+God%2C+we+shall+exercise+faithfully+and+impartially%2C+but+yet+with+caution+and+moderation%3B+neglecting+no+necessary+consultations+with+other+pastors%2C+or+concurrence+of+the+Church%3A+and+consenting+to+be+responsible+for+mal-administrations.+VI.+For+the+communion+of+churches%2C+and+the+strengthening+ourselves+for+the+work+of+God%2C+and+helping+one+another+therein%2C+and+maintaining+unity%2C+love+and+concord%2C+we+do+consent+to+hold+a+brotherly+communion+and+correspondency%3A+And+to+that+end%2C+when+necessity+or+greater+duty+hinders+us+not%2C+we+shall+meet+at+such+convenient+times+and+places%2C+as+shall+be+appointed+or+agreed+on+from+time+to+time%3B+and+shall+labor+to+improve+these+meetings+to+our+mutual+edification%2C+in+such+consultations%2C+conferences+or+other+holy+exercises%2C+as+our+present+case+shall+most+require.+And+we+consent+to+deal+faithfully+in+advising+and+admonishing+one+another%3B+and+for+the+satisfaction+of+the+brethren+%28to+the+forementioned+ends%29+to+be+responsible%2C+if+any+shall+charge+us+with+heresy%2C+scandal%2C+schism%2C+or+mal-administration%3A+And+forbearing+matters+without+our+line%2C+to+study+and+endeavor+the+promoting+of+truth%2C+and+holiness%2C+and+unity+among+ourselves%2C+and+with+other+churches%2C+as+we+have+a+call.+And+also+we+agree+by+communicatory+letters+upon+all+needful+occasions%2C+to+certify+our+brethren+and+other+churches+of+the+state+of+our+affairs%2C+and+of+particular+members%2C+that+those+that+justly+have+communion+in+one+church%2C+or+are+excluded%2C+may+have+communion+with+other+churches%2C+or+be+refused+by+them+accordingly%2C+when+there+is+just+occasion.+And+if+any+brethren+or+Churches+be+prevailed+over+so+far+by+temptation%2C+as+unjustly+to+deny+us+their+communion%2C+in+this+way+of+Association%2C+assemblies%2C+or+correspondency%2C+we+shall+not+therefore+deny+them+to+be+our+brethren%2C+or+churches+of+Christ%2C+but+shall+love+and+own+them%2C+and+have+so+much+communion+with+them+as+their+distance+shall+leave+them+capable+of%2C+if+they+join+with+us+in+the+profession+and+practice+of+true+Christianity%2C+and+of+the+points+that+are+necessary+to+church-constitution+and+communion%2C+and+are+not+proved+guilty+of+heresy%2C+ungodliness%2C+or+such+kind+of+schism+or+scandalous+sins+for+which+the+Scripture+commands+us+to+reject+men+and+avoid+them.+But+such+as+are+thus+guilty+%28though+they+offer+themselves+to+associate+with+us%29+we+shall+refuse+to+hold+communion+with%2C+till+they+credibly+profess+repentance%2C+and+manifest+a+reformation.+VII.+Because+it+is+a+matter+of+great+concernment+to+the+honor+of+Christ%2C+the+propagation+of+the+Gospel%2C+and+the+increase+and+welfare+of+the+Church%2C+that+there+be+a+provision+of+able%2C+faithful+ministers%2C+and+that+unworthy+persons+be+kept+out%3B+and+because+deceivers+and+unworthy+men+are+forward+to+intrude%2C+and+the+people+ordinarily+are+insufficient+of+themselves+to+make+such+trial+of+men%E2%80%99s+ability+and+soundness+as+is+requisite+to+the+safety+of+the+Church%3B+and+the+Church+in+all+ages+has+received+ministers+by+the+ordination+of+other+ministers+of+Christ%3A+We+do+therefore+agree+to+be+careful+and+faithful+in+the+discharge+of+our+duties+hereabout%2C+so+far+as+we+can+discern+them%2C+resolving+that+if+any+vacant+church+desire+us+to+recommend+a+fit+person+to+be+their+pastor%2C+or+to+judge+of+any+recommended+to+them%2C+we+will+not+recommend+or+approve+of+any%2C+but+such+as+we+judge+most+agreeable+to+the+will+of+Christ%3B+nor+will+we+prefer+less+fit+and+worthy+men%2C+for+friendship+or+any+carnal+interest+or+respect.+And+if+any+intollerably+unworthy+person+be+about+to+intrude%2C+or+have+intruded%2C+or+any+neighbor+church+be+about+to+choose%2C+or+have+chosen+such%2C+if+we+have+opportunity%2C+we+shall+faithfully+acquaint+them+with+their+sin+and+danger%2C+and+persuade+them+to+a+better+course.+And+if+we+shall+be+called+to+invest+any+by+solemn+ordination+in+the+sacred+office+of+the+ministry%2C+we+shall+perform+it%2C+as+near+as+we+are+able%2C+according+to+the+directions+of+the+Word+of+God%3B+admitting+none+that+Christ+excludes%3A+And+if+it+may+be%2C+we+shall+do+it+in+that+congregation+which+the+person+is+to+oversee%2C+that+so+we+may+the+better+discern+their+mutual+consent%2C+inculcate+their+duties+and+engage+them+to+a+faithful+performance+thereof.+And+whereas+it+is+much+controverted+of+late+whether+the+power+of+Ordination+be+given+to+the+people+or+the+pastors+of+a+particular+church%2C+or+the+Associated+neighbor+pastors%2C+and+whether+a+stated+president+among+these+should+not+have+a+negative+voice+herein%2C+we+are+agreed+that+leaving+the+people+their+due+liberty+of+consent+in+the+reception+of+their+proper+pastors%2C+we+will+none+of+us+singly+ordain%2C+without+the+assistance+of+other+pastors%3A+Nor+will+we+join+with+any+heretics+or+others%2C+in+unjust+and+impious+ordinations+that+tend+to+the+corrupting+or+dividing+of+the+churches.+And+to+avoid+division+upon+a+tolerable+difference+of+opinions%2C+where+we+may+agree+in+practice%2C+we+consent+that+the+Associations+that+have+no+stated+presidents%2C+or+that+give+not+to+such+a+negative+voice%2C+shall+receive+into+their+communion+those+that+are+of+the+contrary+opinion%3B+giving+them+leave%2C+if+they+desire+it%2C+to+profess+or+record+their+opinion+in+that+particular%2C+so+they+will+afterward+walk+among+them+in+love+and+peace.+And+that+the+Associations+that+choose+a+stated+president%2C+and+give+him+a+negative+voice+in+ordination%2C+shall+in+like+manner%2C+and+on+like+terms%2C+receive+into+their+communion%2C+such+as+dissent+in+that+particular%2C+and+having+professed+or+recorded+their+dissent%2C+will+walk+submissively+in+love+and+peace.+Which+liberty+also+of+professing+and+recording+their+different+principles%2C+we+desire+may+be+allowed+them%2C+that+join+in+synods%2C+as+being+only+for+communion+of+churches%2C+and+them+that+join+in+them%2C+as+having+a+direct+superior+governing+power+over+the+particular+pastors+of+the+churches.+VIII.+Though+it+be+the+surest+way+to+peace+and+concord+to+take+up+with+these+necessary+things%2C+and+we+cannot+approve+of+the+narrow+dividing+principles+of+those+men+that+will+impose+things+unnecessary%2C+to+the+excluding+of+the+necessary%2C+yet+if+our+lawful+rulers+shall+command+it%2C+or+the+peace+of+the+Church+through+the+distempers+of+the+brethren+shall+require+it%2C+we+shall+obey%2C+and+consent+in+things+that+God+has+not+forbidden%3B+and+if+we+suffer+for+well-doing%2C+and+for+obeying+God+rather+than+men%2C+we+shall+endeavor+to+imitate+our+Lord%2C+who+being+reviled%2C+reviled+not+again%2C+and+when+he+suffered%2C+threatened+not%3B+but+committed+all+to+Him+that+judges+righteously%2C+1+Pet.+2%3A23.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Christian+Religion+expressed%3A+I.+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II.+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1.+the+articles+of+the+Christian+Belief%2C+2.+our+consent+to+the+Gospel+Covenant%2C+3.+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29+%7C+The+Agreement+of+the+Associated+Pastors&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb9f6791d87.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b9f6791d87.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=I.%20We%20do%20each%20one%20for,that%20judges%20righteously%2C%201%20Pet.%202%3A23." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The author [Baxter] thought it not unfit here to annex the description of that order and discipline which is exercised by him, with his assistant fellow-pastors, in the parish-church of Kidderminster, in Association with many pastors of those parts who have agreed to exercise so much of the ministerial office as by the consent of the episcopal, presbyterian and congregational [parties] belongs to them. Which, being published: 1. May prevent men’s injurious misreports of our associations and discipline, which they may be drawn to by fallacious fame. 2. And may be an example for those churches that by the magistrates are left at liberty to worship God in that communion and order which they judge most agreeable to the Word of God and the universal consent and practice of the primitive Church. . I. We are willing to teach all in our parish, the doctrine of life, that are willing to learn: and desire them all to hear the Word publicly preached and to come to us to be catechized or instructed. II. We own all those as visible Christians and members of the universal Church that make a credible profession of Christianity and destroy it not by heresy or ungodly lives. III. So many of these as also consent to hold communion with this church as members of it, submitting to the ministers and discipline of Christ, we shall esteem our flock and special charge, and faithfully perform the duties of our office for their good, as we are able. IV. We desire that all the youth of the parish will learn the principles of the Christian religion: and as soon as they understand it, and are heartily resolved to give up themselves to God in Christ through the Spirit, and to lead a holy life, that they will come and acquaint us with their faith and resolution; and before the Church will make a solemn profession thereof, and give up themselves to God in the personal owning their baptismal Covenant; either reciting the foregoing creed or Profession, or, if they are unfit for public speaking, by consenting when we propound it to them, or by any other fit expressions. That so we may publicly pray for their confirmation; and if they consent also to hold communion with this church, we may know them as our charge and register their names. V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold Communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism). VI. If any member of this Church do differ from us about the gesture in the Lord’s Supper (or any such circumstance) we desire them first to come to us and hear our reasons: and if we cannot satisfy them, we will not hinder them from receiving it in any decent gesture they desire. VII. All members of the church must ordinarily hold communion with it in the Lord’s Supper and all ordinances: and if a brother grossly offend, they must orderly and prudently admonish him; and if he hear them not, tell the church [Mt. 18]. VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes. IX. Those that repent not upon public admonition must be cast out of our communion and avoided as heathens: But those that are penitent, must be absolved, and lovingly received. X. If any of our people be offended at anything in our doctrine or life, we desire them before they vent their offense behind our backs, to come and lovingly tell it us, and hear us speak. And if we do not satisfy them, we desire them to open the matter before the ministers of this Association, who are here assembled every month. And we shall before them be responsible for our doctrine, our administrations and our lives. (As we are also willing to be to the magistrate, who only has the power of the sword, even over the pastors of the church, and whom in all things lawful we must obey, and not resist.)</p></blockquote>

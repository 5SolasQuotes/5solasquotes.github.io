</figure><figure class="quote" id="q-321cf00249" data-kw="">
<blockquote><p>We shall here declare what offences are censurable with this greatest and last censure of excommunication, according to the order that is there prescribed, and which, as it requires, ‘that it be inflicted with great and mature deliberation, and after all other good means have been essayed;’ so it appoints in these express words: ‘That such errours in practice as subvert the Faith, or any other errours which overthrow the power of godliness; if the party who holds them spread them, seeking to draw others after him; and such sins in practice as cause the name and truth of God to be blasphemed, cannot stand with the power of godliness; and such practices, as in their own nature manifestly subvert that order, unity and peace which Christ has established in his Church; and particularly all those scandalous sins, for which any person is to be suspended from the sacrament of the Lord’s Supper, obstinately persisted in; these being publicly known, to the just scandal of the Church; The sentence of excommunication may and ought to proceed, according to the directions after following. But the persons that hold other errors in judgment, about which learned and godly men possibly may and do differ, and which subvert not the faith, nor are destructive to godliness, or that be guilty of such sins of infirmity as are commonly found in the children of God: or being otherwise sound in the Faith and holy in life (and so not falling under censure by the former rules) endeavour to keep the unity of the spirit in the bond of peace; and do yet out of conscience not come up to the observation of all those rules which are or shall be established by authority for regulating the outward worship of God and government of his Church; the sentence of excommunication for these causes shall not be denounced against them.&#x27;</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-60809833ad" data-kw="">
<blockquote><p>Let those that agree in fundamentals and have union with the same Head, walk together in love and peace: this we are pressed to Phil. 3:16. Why should there not be a hearty love between those that are of the same Faith?</p></blockquote>

<blockquote><p>1. What is schism from the Church of England? Sure it is not a denying its doctrine, or holding anything contrary thereunto; he that holds perversum Dogma [a perverse dogma] only, is an heretic, no schismatic, as St. Jerome teaches (on Titus 3). Mr. [Matthew] Newcomen, a learned presbyterian, as I observed in my last, lets the Separatists know that their agreeing with us and the Reformed Churches in doctrines that are fundamental, their holding one Head and one Faith, does not excuse them from being guilty of breach of unity, so long as they hold not one Body, one baptism. For he cites Beza, another learned presbyterian (Annotations on 1 Cor. 1:10). So that you may be willing to subscribe to the 39 Articles, and yet be schismatics from the Church of England.</p></blockquote>

<blockquote><p>religious differences should be managed religiously; that is, piously and charitably. This may be; it is possible; for it is prescribed and pressed: ‘Let us not therefore judge one another any more.’ (Rom.14:13) ‘But why dost thou judge thy brother? Or why dost thou set at nought thy brought?’ (Rom. 14:10) and ‘Let us therefore follow after the things which make for peace.’ (Rom. 14:19) And this should be: for charity is a grace of an universal extent; we owe it to all, – to the weak, to the ignorant, to the peevish, to the proud, to the good, and to the bad: ‘Owe no man any thing, but to love one another.’ (Rom. 13:8) And it is of that necessary connection with other saving graces, that we can neither have faith nor hope, unless we have charity; yea, ‘the greatest of these is charity’ (1 Cor. 13:13). And herein the true church of Christ hath ever excelled. The fathers of old, in their dealing with the Donatists, would account them their brethren, when they could not prevail with them for a reciprocation. And it is a golden saying of Bernard: ‘I will cleave to you against your will; I will cleave to you even against my own will: when ye are moved, I will be quiet; I will give place to anger, that I may not give place to the devil.’ And there is great reason for such a temper: for every difference in religion creates not a different religion: while men do hold the Head, they must needs be of the body. Where the same substantial doctrine is avowed, accidental variety is very tolerable, especially where the peace of God’s Church is not infringed. It was worthy bishop [Edward] Reynolds’s conclusion: ‘Where the same straight road to heaven is kept, a small difference of paths hinders not travelers from coming to the same inn at night.’ So neither should they bitterly contest about the next way, who steadily own the same Guide, the same rule, the same end; only, every one has not so clear an eye, nor such opportunity to know the more obscure points pertaining to the Christian religion, which others have. Therefore in these things Luther’s motto is best: ‘Where there is anything of Christ, there is love:’ and this love ‘will cover,’ not one or two, but ‘the multitude of sins’ and infirmities (1 Peter 4:8).</p></blockquote>

</figure><figure class="quote" id="q-a9a7b7065a" data-kw="">
<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession [1530], the former, known specifically as the Reformed, have always tried to reconcile with those [Lutherans] of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups. II. Although these latter ones have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues. III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book Northern Olive Branch, and George Calixtus, professor of theology at the University of Helmstedt, in his book Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), ‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows,’</cite>, pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-38b08187c6" data-kw="">
<blockquote><p>However, most others describe the visible Church as the assembly of those who profess the true and salutary doctrine of Christ and legitimately use the sacraments instituted by Him, and also observe the lawful order of discipline. Some others more briefly say it is the assembly of those who profess the true religion, along with their children. Thus, the Anglican Confession, Chapter 25, Article 30. Therefore, they do not want any heretical churches to constitute part of the visible Church, but exclude from it those who are properly called heretics; nor do they place outside it all who err in matters of faith and sin in the administration of the sacraments and the exercise of discipline; but only those who deny and subvert the fundamental teachings concerning faith, discipline, and the sacraments. Therefore, among the many particular churches that are contained within the communion of the true Church, they note various degrees of purity and perfection; nor do they immediately deny a church to be a true Church of Christ if it is not in all respects pure in doctrine or in the rest of worship, rites, and the sanctity of discipline, and if it has some errors in saving faith, some abuses in the use of sacraments, some superstitions in divine worship, and some allowance of scandals in the sanctity of discipline, provided that in the meantime it retains the fundamental and saving doctrine and practice of faith and worship. These are the words of the confession or declaration of the Polish Churches, publicly read at the Thorunien assembly in 1645, and printed and published the following year. And this is the common opinion of our theologians, as can be seen in John Calvin, Institutes, Book 4, Chapter 1, Section 12 and following, and in the illustrious Mestrezat in his French treatise on the Church, Book 2, Chapter 4.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“However, most others describe the visible Church as the assembly of those who profess the true and salutary doctrine of Christ and legitimately use the sacraments instituted by Him, and also observe the lawful order of discipline. Some others more briefly say it is the assembly of those who profess the true religion, along with their children. Thus, the Anglican Confession, Chapter 25, Article 30. Therefore, they do not want any heretical churches to constitute part of the visible Church, but exclude from it those who are properly called heretics; nor do they place outside it all who err in matters of faith and sin in the administration of the sacraments and the exercise of discipline; but only those who deny and subvert the fundamental teachings concerning faith, discipline, and the sacraments. Therefore, among the many particular churches that are contained within the communion of the true Church, they note various degrees of purity and perfection; nor do they immediately deny a church to be a true Church of Christ if it is not in all respects pure in doctrine or in the rest of worship, rites, and the sanctity of discipline, and if it has some errors in saving faith, some abuses in the use of sacraments, some superstitions in divine worship, and some allowance of scandals in the sanctity of discipline, provided that in the meantime it retains the fundamental and saving doctrine and practice of faith and worship. These are the words of the confession or declaration of the Polish Churches, publicly read at the Thorunien assembly in 1645, and printed and published the following year. And this is the common opinion of our theologians, as can be seen in John Calvin, Institutes, Book 4, Chapter 1, Section 12 and following, and in the illustrious Mestrezat in his French treatise on the Church, Book 2, Chapter 4.”

— Louis Le Blanc, Elucidation of the Status of Controversies about the Church Militant, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683), p. 1052">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+most+others+describe+the+visible+Church+as+the+assembly+of+those+who+profess+the+true+and+salutary+doctrine+of+Christ+and+legitimately+use+the+sacraments+instituted+by+Him%2C+and+also+observe+the+lawful+order+of+discipline.+Some+others+more+briefly+say+it+is+the+assembly+of+those+who+profess+the+true+religion%2C+along+with+their+children.+Thus%2C+the+Anglican+Confession%2C+Chapter+25%2C+Article+30.+Therefore%2C+they+do+not+want+any+heretical+churches+to+constitute+part+of+the+visible+Church%2C+but+exclude+from+it+those+who+are+properly+called+heretics%3B+nor+do+they+place+outside+it+all+who+err+in+matters+of+faith+and+sin+in+the+administration+of+the+sacraments+and+the+exercise+of+discipline%3B+but+only+those+who+deny+and+subvert+the+fundamental+teachings+concerning+faith%2C+discipline%2C+and+the+sacraments.+Therefore%2C+among+the+many+particular+churches+that+are+contained+within+the+communion+of+the+true+Church%2C+they+note+various+degrees+of+purity+and+perfection%3B+nor+do+they+immediately+deny+a+church+to+be+a+true+Church+of+Christ+if+it+is+not+in+all+respects+pure+in+doctrine+or+in+the+rest+of+worship%2C+rites%2C+and+the+sanctity+of+discipline%2C+and+if+it+has+some+errors+in+saving+faith%2C+some+abuses+in+the+use+of+sacraments%2C+some+superstitions+in+divine+worship%2C+and+some+allowance+of+scandals+in+the+sanctity+of+discipline%2C+provided+that+in+the+meantime+it+retains+the+fundamental+and+saving+doctrine+and+practice+of+faith+and+worship.+These+are+the+words+of+the+confession+or+declaration+of+the+Polish+Churches%2C+publicly+read+at+the+Thorunien+assembly+in+1645%2C+and+printed+and+published+the+following+year.+And+this+is+the+common+opinion+of+our+theologians%2C+as+can+be+seen+in+John+Calvin%2C+Institutes%2C+Book+4%2C+Chapter+1%2C+Section+12+and+following%2C+and+in+the+illustrious+Mestrezat+in+his+French+treatise+on+the+Church%2C+Book+2%2C+Chapter+4.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Elucidation+of+the+Status+of+Controversies+about+the+Church+Militant%2C+bk.+5%2C+ch.+1%2C+%E2%80%98On+the+Nature+and+Definition+of+the+Church%E2%80%99+in+Theological+Theses+Published+at+Various+Times+in+the+Academy+of+Sedan%2C+3rd+ed.%2C+tr.+by+AI+by+Colloquia+Scholastica+%281675%3B+London%2C+1683%29%2C+p.+1052&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F38b08187c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/38b08187c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=However%2C%20most%20others%20describe%20the%20visible,the%20Church%2C%20Book%202%2C%20Chapter%204." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d73260422e" data-kw="">
<blockquote><p>As for schismatics, that is, those who separate themselves from true Christian churches for some slight cause, whether in doctrine or discipline, our theologians distinguish between the authors of the schism and the people deceived by them. As for the authors of the schism, since they break the bond of charity, they acknowledge that they cannot belong to the invisible Church, whose bond and communion consist in faith, hope, and charity. But concerning the deceived people or those born in schism, they are less rigid and believe that there can be good men among them, not alien to the body of Christ but joined to it by true faith and charity; nor do they entirely exclude schismatic churches from the visible Church if they retain the foundations of doctrine and discipline, since they reserve this honor only for those who deny and overthrow the fundamentals of faith and discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Elucidation of the Status of Controversies about the Church Militant, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683)</cite>, p. 1,056</span></figcaption>

is%2C%20those,the%20fundamentals%20of%20faith%20and%20discipline." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-411e307970" data-kw="">
<blockquote><p>Doubtless, no opinion that does not thwart the fundamentals of religion should make a separation, and destroy our love and charity; and that, because we have only probable arguments for our opinions, but we have an express command for our love; one excellent property of which, is, that it ‘Bears all things, suffers long, and is kind:’ And indeed, if we do but consider the long suffering of God towards us, how much he bears with us every day, we have all the reason in the world to make that excellent character and property ours, and as much as may be, to bear with one another, to support, and not devour the weak; to strengthen, and not confound the feeble knees; to raise up, and not to trample upon those that are down; and by this means we may do more good, than by all the violence we can use, since a gentle persuasion accompanied with kindness, will reach farther than the strongest argument urged with hatred and ill nature. Christianity should appear with all the ornaments of a meek and quiet spirit, and show a love mixed with sorrow, towards those that are strangers or enemies to it; and this will make them esteem the love that’s showed them, the persons that show it, and praise the religion that moves them to it, and sooner than anything else, persuade them to be of it.</p></blockquote>

</figure><figure class="quote" id="q-fb014038e0" data-kw="">
<blockquote><p>I shall recommend to you Mr. [William] Perkins’ Exposition of this [Scripture] testimony (on Jude 19), comparing it with his comment to the same effect on the first chapter of the Epistle to the Galatians, the 2nd verse, and his doctrinal observation is this (I shall only abbreviate that descant he has enlarged): It is a great sin for a man to separate himself from the assembly of God’s people, Heb. 10:25. It is our duty to keep unity, Eph. 4:3. Upon this occasion he starts this question: Whether if there be errors in the Church, we may separate ourselves? His judicious resolution is this: Errors are either practical in manners or doctrinal in tenets. For vicious manners we may not separate; Lot did it not. The Jews might not do it from the scribes and Pharisees, because they sat in Moses’s chair. Though we may not separate from such corrupt persons in the public assemblies, yet we may in private conversation, 1 Cor. 5:11. If the Church err in doctrine, it is to be considered whether the error be in a point substantial, fundamental or not? if in a point substantial, fundamental, whether upon infirmity, or obstinacy? if of frailty, we may not separate, as in Corinth and Galatia. If a Church err in the foundation openly, obstinately, a separation may be made, 1 Tim. 4:5 (yet the error being in some, not in all, it remains a Church, as Corinth did). If the error be in smaller points, not fundamental, we may not separate: They which build upon the foundation of hay and stubble of erroneous opinon, may be saved, 1 Cor. 3:25. Mr. Perkins concludes that no man can separate from the Church of England with a good conscience, since it teaches, obeys, believes the doctrine of the prophets and apostles. In the most justifiable cause of separation he requires examination, conviction, censure (or condemnation). To separate without examination is not piety, but frenzy. No man can judge aright of that (says the Philosopher, Aristotle, bk. 1, Ethics) whereof he is ignorant. No man can well determine, what he does not well discuss. Qui ad pauca respicit de facili pronunciat.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I shall recommend to you Mr. [William] Perkins’ Exposition of this [Scripture] testimony (on Jude 19), comparing it with his comment to the same effect on the first chapter of the Epistle to the Galatians, the 2nd verse, and his doctrinal observation is this (I shall only abbreviate that descant he has enlarged): It is a great sin for a man to separate himself from the assembly of God’s people, Heb. 10:25. It is our duty to keep unity, Eph. 4:3. Upon this occasion he starts this question: Whether if there be errors in the Church, we may separate ourselves? His judicious resolution is this: Errors are either practical in manners or doctrinal in tenets. For vicious manners we may not separate; Lot did it not. The Jews might not do it from the scribes and Pharisees, because they sat in Moses’s chair. Though we may not separate from such corrupt persons in the public assemblies, yet we may in private conversation, 1 Cor. 5:11. If the Church err in doctrine, it is to be considered whether the error be in a point substantial, fundamental or not? if in a point substantial, fundamental, whether upon infirmity, or obstinacy? if of frailty, we may not separate, as in Corinth and Galatia. If a Church err in the foundation openly, obstinately, a separation may be made, 1 Tim. 4:5 (yet the error being in some, not in all, it remains a Church, as Corinth did). If the error be in smaller points, not fundamental, we may not separate: They which build upon the foundation of hay and stubble of erroneous opinon, may be saved, 1 Cor. 3:25. Mr. Perkins concludes that no man can separate from the Church of England with a good conscience, since it teaches, obeys, believes the doctrine of the prophets and apostles. In the most justifiable cause of separation he requires examination, conviction, censure (or condemnation). To separate without examination is not piety, but frenzy. No man can judge aright of that (says the Philosopher, Aristotle, bk. 1, Ethics) whereof he is ignorant. No man can well determine, what he does not well discuss. Qui ad pauca respicit de facili pronunciat.”

</figure><figure class="quote" id="q-3df12a43cc" data-kw="">
<blockquote><p>And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Planelogia, a Succinct &amp; Seasonable Discourse of the Occasions, Causes, Nature, Rise, Growth &amp; Remedies of Mental Errors... (London: Roberts, 1691), pp. 438-39, 446 Flavel was a presbyterian. | Direction 1</cite></span></figcaption>

ity%20of%20Church%2Dsocieties." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-536663c18e" data-kw="">
<blockquote><p>The Lutherans on the contrary, by defect, decline fraternal fellowship with the Reformed, who by no means differ from them in the foundation. The Reformed pursue a middle way: (1) they reject the Socinians’ Samaritanism, that is, fraternal fellowship with those who err in the foundation, and render it useless to us (1 Cor. 3:12 with Rom. 10:3–4; Gal. 5:4), being adduced: (1)… (c) by reasons, because the fellowship of the mystical body rests upon the unity of the fundamental faith (Eph. 4:4–5). (2) With churches that err concerning the foundation, that is, which teach such things whereby, through necessary consequence, the foundation is made to fail, they do not want to rashly break church fellowship, unless perhaps they exclude us (1 Cor. 3:12; Eph. 4:4–5; Col. 2:19), after the example of Paul, who due to errors of this sort, by no means separated from the churches of Corinth, Galatia, and Colossae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology, ed. Joel Beeke, tr. Todd Rester (Reformation Heritage Books), vol. 5, bk. 7, ch. 1, §35</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Lutherans on the contrary, by defect, decline fraternal fellowship with the Reformed, who by no means differ from them in the foundation. The Reformed pursue a middle way: (1) they reject the Socinians’ Samaritanism, that is, fraternal fellowship with those who err in the foundation, and render it useless to us (1 Cor. 3:12 with Rom. 10:3–4; Gal. 5:4), being adduced: (1)… (c) by reasons, because the fellowship of the mystical body rests upon the unity of the fundamental faith (Eph. 4:4–5). (2) With churches that err concerning the foundation, that is, which teach such things whereby, through necessary consequence, the foundation is made to fail, they do not want to rashly break church fellowship, unless perhaps they exclude us (1 Cor. 3:12; Eph. 4:4–5; Col. 2:19), after the example of Paul, who due to errors of this sort, by no means separated from the churches of Corinth, Galatia, and Colossae.”

<blockquote><p>§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>

<blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is: 1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed. 2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>

ns%2C+who+heretofore+and+very+lately+have+endeavored+to+reconcile+the+Protestant+Churches+into+a+perfect+union%3A+A+blessed+work.+Blessed+are+the+peacemakers%2C+that+endeavor+to+make+peace+among+the+jarring+members+of+Christ%E2%80%99s+Body%3B+and+though+they+may+fail+of+success%2C+yet+they+shall+not+lose+their+reward.+In+the+meanwhile+those+who+widen+or+heighten+these+differences%2C+and+incite+the+respective+parties+to+hatred%2C+and+wrath%2C+and+animosities+one+against+another%2C+to+be+sure+are+no+children+of+the+God+of+peace%2C+and+had+need+at+least+before+they+die+make+public+satisfaction+for+the+dreadful+effects+their+heats+and+passions+do+produce.+But+as+this+peace+among+Protestant+Churches+is+very+much+to+be+wished+and+prayed+for%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Anthony+Horneck%2C+The+Blessed+Advantages+of+Peace+%26+Peacemakers+In+a+Sermon+preached+at+the+Savoy+in+London+upon+the+Fifth+of+St.+Matthew%2C+verse+9%2C+%E2%80%98Blessed+are+the+Peace-makers%E2%80%A6%E2%80%99+%28London%3A+Aylmer%2C+1697%29%2C+pp.+29-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F38d5a0ab65.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/38d5a0ab65.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=2.%20It%20is%20not%20a%20bare,to%20be%20wished%20and%20prayed%20for%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Observation 4. Our Savior does not command his disciples to separate from commmunion with the Pharisees, and oblige them not hear their doctrine; but only to beware of the errors that they mix with their doctrine. We may, and ought to hold communion with a Church, though erroneous in doctrine, if not fundamentally erroneous. Separation from a Church is not justifiable upon any other ground than that which makes a separation betwixt God and that Church: Which is either the apostasy of that Church into gross idolatry; or in point of doctrine, into damnable heresy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-burkitt.html">William Burkitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Notes with Practical Observations on the Four Holy Evangelists… (London, 1700), On Mt. 16</cite></span></figcaption>

</figure><figure class="quote" id="q-1878dea24a" data-kw="">
<blockquote><p>If he [the opponent] judge the terms of our communion lawful [in the Church of Scotland], then he must either join and keep communion with us, or maintain that a Church, the terms of whose communion are lawful, or, to keep to our these [thesis], in which there are no sinful terms of communion imposed, is yet to be separated from. This is a new tenet, never known before among men that called themselves presbyterians. I think they had reason, who, when these [separatist] men began to call themselves ‘the true presbyterians of the Chuch of Scotland’ [after the Glorious Revolution of 1689], they called them ‘the new presbyterians’.</p></blockquote>

</figure><figure class="quote" id="q-d28781669c" data-kw="">
<blockquote><p>2nd Proposition. There may be different sentiments without separation. And hence the apostle exhorts all to “forbear one another in love” (Eph. 4:1-6), and to “walk by the same rule whereunto we have already attained.” [Phil. 3:15-16] If the sentiments of all were the same, there had not been need for any such exhortation. As long as we see but in part, as we think others should allow us to differ from them, we ought to forbear such as differ from us, I mean in things not fundamental.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738) | ch. 2, In which sundry propositions anent separation are laid down</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“2nd Proposition. There may be different sentiments without separation. And hence the apostle exhorts all to “forbear one another in love” (Eph. 4:1-6), and to “walk by the same rule whereunto we have already attained.” [Phil. 3:15-16] If the sentiments of all were the same, there had not been need for any such exhortation. As long as we see but in part, as we think others should allow us to differ from them, we ought to forbear such as differ from us, I mean in things not fundamental.”

— John Currie, An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738) | ch. 2, In which sundry propositions anent separation are laid down">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2nd+Proposition.+There+may+be+different+sentiments+without+separation.+And+hence+the+apostle+exhorts+all+to+%E2%80%9Cforbear+one+another+in+love%E2%80%9D+%28Eph.+4%3A1-6%29%2C+and+to+%E2%80%9Cwalk+by+the+same+rule+whereunto+we+have+already+attained.%E2%80%9D+%5BPhil.+3%3A15-16%5D+If+the+sentiments+of+all+were+the+same%2C+there+had+not+been+need+for+any+such+exhortation.+As+long+as+we+see+but+in+part%2C+as+we+think+others+should+allow+us+to+differ+from+them%2C+we+ought+to+forbear+such+as+differ+from+us%2C+I+mean+in+things+not+fundamental.%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation%3A+or+a+Vindication+of+the+Church+of+Scotland%2C+in+which+the+Chief+Things+in+the+Testimonies+of+these+Reverend+Brethren+who+lately+made+a+Secession+from+her+are+considered+%26+shown+to+be+no+Ground+of+Separation+or+Secession+%281738%29+%7C+ch.+2%2C+In+which+sundry+propositions+anent+separation+are+laid+down&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd28781669c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d28781669c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=2nd%20Proposition.%20There%20may%20be%20different,I%20mean%20in%20things%20not%20fundamental." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-74e165a50d" data-kw="">
<blockquote><p>And 1st, albeit there be errors, and errors of a heinous nature among some in a Church, this is not sufficient ground of separation from that Church, nay, not though these errors should remain uncensured. For, as was noticed above, there were some in the Church of Corinth who had drunk in this gross error, “That there is no resurrection of the body;” hence the apostle asks, “How say some among you, there is no resurrection of the dead?” (1 Cor. 15:12) The interrogation plainly intimates there were some among them who denied that great and fundamental doctrine of the Christian religion; and yet this Church of Corinth was a true Church of Christ, from which it was not lawful to separate. So, in the Church of Pergamos, there were some uncensured who held the doctrine of Balaam, and the doctrine of the Nicolaitans; and yet she was a true Church of Christ, right and approven in the main. So, in the Church of Thyatira, “that wicked woman” Jezebel was tolerated without being censured, though she taught the Lord’s servants to commit heinous iniquity. So, though there should be sundry persons leavened with gross errors in the Church of Scotland at this day, this is no sufficient ground for a secession or separation from her. I own it is a sin, and I think a very heinous sin in any Church, to wink at errors, or not to censure for, and be zealous against them, especially if of a heinous nature, as are some of these wherewith some among us have been charged… … And as [John] Owen justly (Exposition, p. 174) observes, “There may be a fundamental error in a true Church for a season, where the Church errs not fundamentally,” citing for proof of this, 1 Cor. 15; 2 Tim. 2:18.</p></blockquote>

<blockquote><p>11th Objection: This Chuch [of Scotland] is erroneous in her doctrine, therefore ’tis sinful to keep communion with her. This is a heavy charge indeed; and, if it was true that her declared or professed doctrine is corrupt in fundamental points and we required to approve thereof, I should think it sufficient ground of separation:</p></blockquote>

<blockquote><p>10. We have said that the symbols by which the Church is discerned are the preaching of the Word and the observance of the sacraments, for these cannot any where exist without producing fruit and prospering by the blessing of God… When the preaching of the gospel is reverently heard, and the sacraments are not neglected, there for the time the face of the Church appears without deception or ambiguity; and no man may with impunity spurn her authority… far less revolt from her, and violate her unity, (see Chap. II, sec. 1, 10, and Chap. VIII, sec. 12). For such is the value which the Lord sets on the communion of his Church, that all who contumaciously alienate themselves from any Christian society, in which the true ministry of his Word and sacraments is maintained, He regards as deserters of religion. So highly does He recommend her authority, that when it is violated He considers that his own authority is impaired. For there is no small weight in the designation given to her, “the house of God,” “the pillar and ground of the truth,” (1 Tim. 3:15)… 11… How perilous, then, nay, how fatal the temptation, when we even entertain a thought of separating ourselves from that assembly in which are beheld the signs and badges which the Lord has deemed sufficient to characterise his Church!… If it holds the order instituted by the Lord in Word and sacraments there will be no deception; we may safely pay it the honour due to a church: on the other hand, if it exhibit itself without Word and sacraments, we must in this case be no less careful to avoid the imposture… 12… in the administration of word and sacraments defects may creep in which ought not to alienate us from Its communion. For all the heads of true doctrine are not in the same position. Some are so necessary to be known, that all must hold them to be fixed and undoubted as the proper essentials of religion: for instance, that God is one, that Christ is God, and the Son of God, that our salvation depends on the mercy of God, and the like. Others, again, which are the subject of controversy among the churches, do not destroy the unity of the faith…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, tr. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4, ch. 1, sect. 10-11</cite>, p. 22-23</span></figcaption>

</figure><figure class="quote" id="q-097263c6db" data-kw="">
<blockquote><p>Schismatical is such as was the schisms of the Donatists [in the Early Church], which separated themselves from the true Church of God under the pretense of a more absolute life and a more perfect holiness… But none of these [kinds of schisms] can be justly imputed unto us declining from the Romish Church, for that departing is without all blame, which is not from a true Church, but from a false Church: not from the people of God, but from the persecuters of the people of God, not from the articles of the Faith and sound doctrine of the church, but from errors which darken the articles of the Faith and from the wicked traditions of men, which specially is not done by any lightness but by necessity, not for the desire of innovation but for true religion’s sake, and to recover the true Faith according to the testimony of the eternal verity, that leaving the fellowship of darkness, we may be gathered again in true light, placed with Christ and all his members. So we at this day have forsaken that Romish Sea full of false doctrine and idolatry, and flowing with the innocent blood of martyrs, and have embraced the evangelic and apostolic doctrine, and so Christ Himself being head of the Church, which is the commmunion of all saints believing in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-alley.html">William Alley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Poor Man’s Library Rapsodiæ G.A. Bishop of Exeter upon the First Epistle of Saint Peter... (1560; London: Day, 1565), Lecture 7, Now to the Romish Church, Response, 3. Schismatical, p. 246 Alley was the Anglican bishop of Exeter during the reign of Queen Elizabeth I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Wherefore I cannot marvel enough at the corrupt and scismatical manners of certain men, who separate themselves for every light cause, from the most wholesome and pleasant company or society of the Church. For you shall find in these days, captious and phantastical men, not a few, which of many years have had fellowship with no Church, nor as yet have fellowship with any. For in every man that is, they find some kind of fault, in themselves only they find nothing worthy reprehension. Therefore they conceive with themselves a wonderful fashion of the Church, which except they see somewhere established after that fashion which they themselves haue devised, they contend (with shame enough) that there is as yet no true Church of Christ in the world.</p></blockquote>

<blockquote><p>And because in this matter it chiefly behoves to know who is truly said to be an heretic or whom is a schismatic: of these matters I will first of all speak these few words. St. Augustine thinks that this difference there is between an heretic and a schismatic: That a heretic does corrupt the sincerity of faith and doctrine of the apostles with his wicked doctrine; and a schismatic, although he sin not at all against the pure doctrine and sincere faith, yet he rashly separates himself from the Church, breaking the bond of unity. And surely he properly is an heretic, whosoever he be that contrary to the Scripture, which is the Word of God, against the Articles of Faith,¹ or against the sound opinions of the Church grounded on the Word of God, through hope of any temporal commodity, of his own brain and fleshly choice chooses, receives, teaches, follows strange things, and stiffly retaining does both defend them and spread them abroad. ¹ [This likely refers to the Apostles’ Creed, which was also known as the 12 Articles, and around which Bullinger’s Decades was roughly organized.] By the imperial edict of Augustus Cesar, Gratian, Valentinian and Theodosius, they are defined to be catholics or Christians who continue in that religion which St. Peter taught the church of Rome and which blessed Damasus and St. Peter, bishop of Alexandria, did teach, that is to say, confessing according to the teaching of the apostles and doctrine of the Gospel the only Godhead of the Father, and of the Son, and of the Holy Ghost in equal majesty and in an holy Trinity. And again they are by them declared to be heretics, who follow contrary opinions, whom they accompt both mad and infamous, and worthy of punishment. And he is a scismatic, whosoever he be that separates himself from the unity of the true Church of God, and either himself gathers together new assemblies, or joins himself to congregations gathered by others, albeit in doctrine he err little or nothing.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“And because in this matter it chiefly behoves to know who is truly said to be an heretic or whom is a schismatic: of these matters I will first of all speak these few words. St. Augustine thinks that this difference there is between an heretic and a schismatic: That a heretic does corrupt the sincerity of faith and doctrine of the apostles with his wicked doctrine; and a schismatic, although he sin not at all against the pure doctrine and sincere faith, yet he rashly separates himself from the Church, breaking the bond of unity. And surely he properly is an heretic, whosoever he be that contrary to the Scripture, which is the Word of God, against the Articles of Faith,¹ or against the sound opinions of the Church grounded on the Word of God, through hope of any temporal commodity, of his own brain and fleshly choice chooses, receives, teaches, follows strange things, and stiffly retaining does both defend them and spread them abroad. ¹ [This likely refers to the Apostles’ Creed, which was also known as the 12 Articles, and around which Bullinger’s Decades was roughly organized.] By the imperial edict of Augustus Cesar, Gratian, Valentinian and Theodosius, they are defined to be catholics or Christians who continue in that religion which St. Peter taught the church of Rome and which blessed Damasus and St. Peter, bishop of Alexandria, did teach, that is to say, confessing according to the teaching of the apostles and doctrine of the Gospel the only Godhead of the Father, and of the Son, and of the Holy Ghost in equal majesty and in an holy Trinity. And again they are by them declared to be heretics, who follow contrary opinions, whom they accompt both mad and infamous, and worthy of punishment. And he is a scismatic, whosoever he be that separates himself from the unity of the true Church of God, and either himself gathers together new assemblies, or joins himself to congregations gathered by others, albeit in doctrine he err little or nothing.”

ns%2C+whom+they+accompt+both+mad+and+infamous%2C+and+worthy+of+punishment.+And+he+is+a+scismatic%2C+whosoever+he+be+that+separates+himself+from+the+unity+of+the+true+Church+of+God%2C+and+either+himself+gathers+together+new+assemblies%2C+or+joins+himself+to+congregations+gathered+by+others%2C+albeit+in+doctrine+he+err+little+or+nothing.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+Godly+%26+Learned+Sermons+divided+into+Five+Decades%E2%80%A6+%28d.+1575%3B+London%3A+Newberrie%2C+1577%29%2C+5th+Decade%2C+Sermon+2%2C+%E2%80%9CThat+there+is+one+catholic+Church%E2%80%9D%2C+p.+850&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F43c4f14f1b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/43c4f14f1b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=And%20because%20in%20this%20matter%20it,doctrine%20he%20err%20little%20or%20nothing." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5c87d81f26" data-kw="">
<blockquote><p>The catholic or universal visible Church is the assembly of all those which make profession of the Gospel of Jesus Christ throughout the whole world, distinguished (as we have said) into many particular Churches, all which do make but one body. Of all these particular, as members and parts of one and the self-same body, some are pure, other some are impure, some more, and some less sound, and some at this day are sick even unto death… Those that are of the purer and sounder Churches, we call them sound and true Churches, consenting to the true doctrine, which is the name, that for the most part, the ancient fathers have given them. The others we call the erring, heretical or schismatical Churches, according as they err, either in faith or in charity, against the square and right rule of Christ, or against the rule of his Church, either in the one or in the other, notwithstanding every one in his degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/philip-mornay.html">Philip Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter [in controversy with Romanism] (London: Barker, 1579)</cite>, ch. 2, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

eformed Books Online</a></div>
</figure><figure class="quote" id="q-89bdd6d968" data-kw="">
<blockquote><p>And in the Acts we read that the faithful continued in the doctrine of the apostles, in the communion and breaking of bread, and in prayers (Acts 2:42), which is no other thing but a brief description of the true Church of Christ, instructed by the Word, in true faith and knit together in true charity, through the communion that is in Him. The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.</p></blockquote>

</figure><figure class="quote" id="q-bee4d8906f" data-kw="">
<blockquote><p>Those, though otherwise never so godly, that separate from true Churches, like Novatus and Lucifer, for a stricter course of discipline; like Donatus for some bad ones in the Church, as they supposed; like Andius for some lesser corruptions and abuses, they be schismatics. This is the judgment of ancient Churches, for which see at large, Mornay, On the Church, p. 35. But our late Separatists do divide themselves from us upon like grounds: for a more strict discipline with Novatus and Lucifer; for that good and bad are mixed together, with Donatus; and from lesser corruptions among us with Andius. Therefore are these also schismatics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical... (London: 1610) | 2nd Likelihood</cite>, p. 48</span></figcaption>

</figure><figure class="quote" id="q-a5521c7827" data-kw="">
<blockquote><p>Are the wicked intermixed with true and zealous professors? What shall we then say to the old Donatists (Socrates, Ecclesiastical History, bk. 1, ch. 7), and the Brownists, and Anabaptists, which separate themselves from the true Church, say with those in the prophet, ‘Come not near us for we are holier then ye.’ Me thinks I may say unto them as Constantine said to Acesius, a Novatian Bishop: Let them make a ladder for themselves to ascend into heaven, here is no place for them on earth, as long as this world shall last, the Lord’s wheat shall grow up with the tares.(Mt. 13:29) Christ has spoken it, and Christ is truth, ‘if there be in them any charity, they will assent to this verity’ (Sit in illis charitas et congaudeant veritate, Augustine, Cor. 2:6). ‘Yea but light has no communion with darkness, nor bitterness with honey, nor life with death, nor the unbeliever with the infidel.’ It is the objection of Petilian the Donatist against Augustine. But his answer is that when they eschew the darkness, they forsake the light: when they flee from death they flee from life also: Attendis Zizania per mundum, &amp; triticum non attendis, cum per totum vtraque sint iussa crescere? attendis semen maligni, quod ad finem messis separabitur; et non attendis semen Abrahae, in quo benedicentur omnes gentes? Dost thou mark the darnel, and dost thou not remember the wheat? Dost thou think upon the seed of the serpent, whose head shall be crushed; and dost thou not think upon the seed of Abraham, in whom all the nations of the earth shall be blessed? When thou fleest from the chaff, thou forsakest the good wheat, which is mingled with it. When thou separatest thyself from the seed of the wicked, thou seperatest thyself from the seed of Abraham. When thou thus dividest thyself from the hypocrites that are in the true Church, thou cuttest thyself from the Church, and a member taken from the whole must needs perish. If thou wilt think upon this with that heedfulness that thou shouldst, thou wilt not forsake the green pastures of the Lord that are besides the waters of comfort (Ps. 23) because of the goats; nor leave God’s house because of the vessels of dishonor; nor run out of the Lord’s floor, because of the chaff; nor separate thyself from the wheat because of the tares, which shall at length be bound in a bundle and cast into the fire; nor burst the unity of the Lord’s net because of the bad fish, which swim in it, (which, when the net is brought to land, shall be cast away), but as a father speaks: tolerare potiùs propter bonos cōmixtionem malorum, quam violare propter malos charitatem bonorum; rather for the good to tolerate the bad than for the bad to forsake the good. (Augustine, bk. 3, Contra litt. Petit., ch. 3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lancelot-dawes.html">Lancelot Dawes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Sermons preached at the Assizes holden at Carlile touching sundry Corruptions of these Times (Oxford: Barnes, 1614), 1st Sermon, pp. 32-34 Dawes (1580–1653) was an Anglican clergyman.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

ink upon this with that heedfulness that thou shouldst, thou wilt not forsake the green pastures of the Lord that are besides the waters of comfort (Ps. 23) because of the goats; nor leave God’s house because of the vessels of dishonor; nor run out of the Lord’s floor, because of the chaff; nor separate thyself from the wheat because of the tares, which shall at length be bound in a bundle and cast into the fire; nor burst the unity of the Lord’s net because of the bad fish, which swim in it, (which, when the net is brought to land, shall be cast away), but as a father speaks: tolerare potiùs propter bonos cōmixtionem malorum, quam violare propter malos charitatem bonorum; rather for the good to tolerate the bad than for the bad to forsake the good. (Augustine, bk. 3, Contra litt. Petit., ch. 3)”

fleest+from+the+chaff%2C+thou+forsakest+the+good+wheat%2C+which+is+mingled+with+it.+When+thou+separatest+thyself+from+the+seed+of+the+wicked%2C+thou+seperatest+thyself+from+the+seed+of+Abraham.+When+thou+thus+dividest+thyself+from+the+hypocrites+that+are+in+the+true+Church%2C+thou+cuttest+thyself+from+the+Church%2C+and+a+member+taken+from+the+whole+must+needs+perish.+If+thou+wilt+think+upon+this+with+that+heedfulness+that+thou+shouldst%2C+thou+wilt+not+forsake+the+green+pastures+of+the+Lord+that+are+besides+the+waters+of+comfort+%28Ps.+23%29+because+of+the+goats%3B+nor+leave+God%E2%80%99s+house+because+of+the+vessels+of+dishonor%3B+nor+run+out+of+the+Lord%E2%80%99s+floor%2C+because+of+the+chaff%3B+nor+separate+thyself+from+the+wheat+because+of+the+tares%2C+which+shall+at+length+be+bound+in+a+bundle+and+cast+into+the+fire%3B+nor+burst+the+unity+of+the+Lord%E2%80%99s+net+because+of+the+bad+fish%2C+which+swim+in+it%2C+%28which%2C+when+the+net+is+brought+to+land%2C+shall+be+cast+away%29%2C+but+as+a+father+speaks%3A+tolerare+poti%C3%B9s+propter+bonos+co%CC%84mixtionem+malorum%2C+quam+violare+propter+malos+charitatem+bonorum%3B+rather+for+the+good+to+tolerate+the+bad+than+for+the+bad+to+forsake+the+good.+%28Augustine%2C+bk.+3%2C+Contra+litt.+Petit.%2C+ch.+3%29%E2%80%9D%0A%0A%E2%80%94+Lancelot+Dawes%2C+Two+Sermons+preached+at+the+Assizes+holden+at+Carlile+touching+sundry+Corruptions+of+these+Times+%28Oxford%3A+Barnes%2C+1614%29%2C+1st+Sermon%2C+pp.+32-34+Dawes+%281580%E2%80%931653%29+was+an+Anglican+clergyman.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa5521c7827.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a5521c7827.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Are%20the%20wicked%20intermixed%20with%20true,3%2C%20Contra%20litt.%20Petit.%2C%20ch.%203%29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4ece83658b" data-kw="">
<blockquote><p>3. That place must needs be holy where the Lord dwells as a Master in his house, teaching, ordering and supplying all necessaries. Where Christ, the holy Son of God, walks in the midst of the seven golden candlesticks, being conversant among the flocks of shepherds… Surely, this is Bethel, the house of God, and the gate of Heaven. This teaches us not to despise our [Anglican] assemblies, nor to think our churches unholy for some corruptions. Look upon Jerusalem, Mt. 23:37; you shall see the eleven tribes were apostates, there were in it dumb dogs, Isa. 56:10, there were scribes and Pharisees, hypocrites. At this time the doctrine of the Law was corrupted by the false glosses of the Pharisees, and the Temple was almost a den of thieves, full of buyers and sellers. Yet for all this, the evangelist calls it ‘the holy city,’ even when it had more corruptions in it than the Church of England has at this day. Why?: 1. Because there the service of the true God was set up in the Temple, the Word preached, sacrifices offered, and the meetings of the Church of God. 2. Because as yet they had not received a bill of divorce. Have we not the Word truly preached, and the sacraments for substance truly administered? And for discipline, I will say, I wish we had the execution of so much as the Church allows. Or, when did the Lord give us a bill of divorce? Or, what Church has convinced us that we cannot be acknowledged for a true Church? If they say, they of the Separation have, I answer: 1. They have labored to discover some errors, but none fundamental in us, nor without as many in themselves. 2. We… must not think it strange if some unstable persons forsake our communion, since in the golden and flourishing age of the apostles there were some such, Heb. 10:25.</p></blockquote>

</figure><figure class="quote" id="q-41d3a725ae" data-kw="">
<blockquote><p>Reason 2. They that consenting with others in the doctrine of salvation by Christ, do nevertheless separate themselves from them as touching spiritual communion, are schismatics (1 Cor. 1:10-11; Jud. 19)… They that without just cause, renounce all spiritual communion in public with a true Church, are schismatics… The Church of England is a true Church of God… The Gospel of our saluation is the word of truth. The Church of England upholds as a pillar, the Gospel of our salvation. Therefore it upholds the word of truth, and by consequence it is a true Church. Let them not here stand to show a difference between the Church of England and Ephesus. There may be a difference between true Churches: notwithstanding they are all true that maintain the word of truth, the Gospel. … If they are to be accounted true teachers, who keep this foundation (Christ is come in the flesh) and build not upon it any doctrine overthrowing the same, then a Church, as that now of England, is to be held for a true Church, which retains this foundation of the Christian Faith and builds not upon it any doctrines overthrowing the same.</p></blockquote>

<blockquote><p>Secondly, we must plant ourselves under a powerful ministry: we must repair to the tents of the shepherds, Cant. 1:8. Thirdly, we must wait in Jerusalem for the promise of the Father, Acts 1:4; we must not separate from God’s true Church.</p></blockquote>

— Stephen Denison, An Exposition upon the First Chapter of the Second Epistle of Peter (London: Field, 1622), on 2 Pet. 1:2, p. 8 Denison was a London minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+we+must+plant+ourselves+under+a+powerful+ministry%3A+we+must+repair+to+the+tents+of+the+shepherds%2C+Cant.+1%3A8.+Thirdly%2C+we+must+wait+in+Jerusalem+for+the+promise+of+the+Father%2C+Acts+1%3A4%3B+we+must+not+separate+from+God%E2%80%99s+true+Church.%E2%80%9D%0A%0A%E2%80%94+Stephen+Denison%2C+An+Exposition+upon+the+First+Chapter+of+the+Second+Epistle+of+Peter+%28London%3A+Field%2C+1622%29%2C+on+2+Pet.+1%3A2%2C+p.+8+Denison+was+a+London+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa275a51bc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa275a51bc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Secondly%2C%20we%20must%20plant%20ourselves%20under,not%20separate%20from%20God%E2%80%99s%20true%20Church." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now further, in that the prophet [Isaiah] speaks in the present tense, ‘My beloved has a Vineyard:’ albeit the whole Church of Israel and Judah was at this time so generally corrupted, as that from the crown of the head to the sole of the foot, there was nothing found but wounds, swellings and sores, full of corruption (as he had before testified [in Isa. 1:5]). We observe that: ([Margin note:] Doctrine: A true Church may be corrupted with error and idolatry) Albeit a Church be corrupted with error and idolatry, yet it is still to be accounted God’s Church, till He has divorced and forsaken her. Thus in the days of Eli (1 Sam. 2:24, 29), Israel was called God’s people; and so his Church, albeit they were not then separated from all false ways, and Eli’s sons (sons of Belial, says the text, v. 12, who knew not the Lord) remained amongst them. So Moses calls Israel God’s people when he was upon the Mount (Ex. 32:11), and yet at that time they were in the very act of their idolatry, which was not unknown to Moses, for God Himself informed him thereof (vv. 7-8). So in this our prophet’s time, albeit this people were sunk deep in rebellion and idolatry, yet for all that God Himself does call them his people, ‘Israel does not know, My people does not consider.’ (Isa. 1:21-22, 29; 2:6, 8; 65:11; 1:3) Turn we our eyes from the estate of the Church in these times to after times, as it was under the Gospel, and we shall see the truth of the point propounded. Look upon Jerusalem in our Saviour Christ’s time, and we shall see the eleven Tribes were become apostates (Mt. 23:37), and the Church amongst them was wonderfully corrupted both in doctrine and manners, as appears by our Saviour Christ’s severe reproof of both (Mt. 5:21); yea the temple itself was almost become a den of thieves, full of buyers and sellers. Yet at this time it was the true Church of God, else the evangelist would never have called it ‘the Holy City.’ (Mat. 4:5 &amp; 27:53) In Saint Paul’s time the Corinthians were called the Church of God (1 Cor. 1:1-2), and yet at that very instant some of them were in an heresy (2 Cor. 12:20-21), others in incest, and othersome that had not repented of their filthiness. (1 Cor. 5:1) Such was the estate of the Churches of Asia, yet the title of true Churches was given to them. (Rev. 2 &amp; 3) Those therefore that condemn the Church of England for a no-Church, and make a separation from it in regard of the errors and corruptions that are in it, are far from the spirit of Christ, and the prophets and apostles, who never made any schismatical and bodily separation from any true Church, for the corruptions (though gross) that were therein found. I deny not but blemishes are in every Church (for what Church ever breathed in so pure an air as that it might not justly complain of some thick and unwholesome evaporations of error and sin?), but because our Mother wants some beauty, has she lost her face? Because she is black, has she no comeliness at all? [Song 1:5-6] What is it they charge us with, but with corruptions? (for fundamental error they can discover none). Now do corruptions in a man make a false man, or a corrupt man? So that though they make the worst they can of our Church, they can make it but a corrupt Church, and not a false Church. We have the true Word of God preached, the true sacraments of Christ Jesus administered, which all divines in all the reformed Churches in Christendom, which now are or have been, do hold to be the infallible tokens of a true Church, and are reciprocally converted with the true Church. We maintain every point of the most ancient Creeds; we overthrow not the foundation by any consequence. And as yet we have not received a bill of divorcement. As for discipline (the want whereof they charge us with) our Church is not destitute of it altogether…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now further, in that the prophet [Isaiah] speaks in the present tense, ‘My beloved has a Vineyard:’ albeit the whole Church of Israel and Judah was at this time so generally corrupted, as that from the crown of the head to the sole of the foot, there was nothing found but wounds, swellings and sores, full of corruption (as he had before testified [in Isa. 1:5]). We observe that: ([Margin note:] Doctrine: A true Church may be corrupted with error and idolatry) Albeit a Church be corrupted with error and idolatry, yet it is still to be accounted God’s Church, till He has divorced and forsaken her. Thus in the days of Eli (1 Sam. 2:24, 29), Israel was called God’s people; and so his Church, albeit they were not then separated from all false ways, and Eli’s sons (sons of Belial, says the text, v. 12, who knew not the Lord) remained amongst them. So Moses calls Israel God’s people when he was upon the Mount (Ex. 32:11), and yet at that time they were in the very act of their idolatry, which was not unknown to Moses, for God Himself informed him thereof (vv. 7-8). So in this our prophet’s time, albeit this people were sunk deep in rebellion and idolatry, yet for all that God Himself does call them his people, ‘Israel does not know, My people does not consider.’ (Isa. 1:21-22, 29; 2:6, 8; 65:11; 1:3) Turn we our eyes from the estate of the Church in these times to after times, as it was under the Gospel, and we shall see the truth of the point propounded. Look upon Jerusalem in our Saviour Christ’s time, and we shall see the eleven Tribes were become apostates (Mt. 23:37), and the Church amongst them was wonderfully corrupted both in doctrine and manners, as appears by our Saviour Christ’s severe reproof of both (Mt. 5:21); yea the temple itself was almost become a den of thieves, full of buyers and sellers. Yet at this time it was the true Church of God, else the evangelist would never have called it ‘the Holy City.’ (Mat. 4:5 &amp; 27:53) In Saint Paul’s time the Corinthians were called the Church of God (1 Cor. 1:1-2), and yet at that very instant some of them were in an heresy (2 Cor. 12:20-21), others in incest, and othersome that had not repented of their filthiness. (1 Cor. 5:1) Such was the estate of the Churches of Asia, yet the title of true Churches was given to them. (Rev. 2 &amp; 3) Those therefore that condemn the Church of England for a no-Church, and make a separation from it in regard of the errors and corruptions that are in it, are far from the spirit of Christ, and the prophets and apostles, who never made any schismatical and bodily separation from any true Church, for the corruptions (though gross) that were therein found. I deny not but blemishes are in every Church (for what Church ever breathed in so pure an air as that it might not justly complain of some thick and unwholesome evaporations of error and sin?), but because our Mother wants some beauty, has she lost her face? Because she is black, has she no comeliness at all? [Song 1:5-6] What is it they charge us with, but with corruptions? (for fundamental error they can discover none). Now do corruptions in a man make a false man, or a corrupt man? So that though they make the worst they can of our Church, they can make it but a corrupt Church, and not a false Church. We have the true Word of God preached, the true sacraments of Christ Jesus administered, which all divines in all the reformed Churches in Christendom, which now are or have been, do hold to be the infallible tokens of a true Church, and are reciprocally converted with the true Church. We maintain every point of the most ancient Creeds; we overthrow not the foundation by any consequence. And as yet we have not received a bill of divorcement. As for discipline (the want whereof they charge us with) our Church is not destitute of it altogether…”

</figure><figure class="quote" id="q-8ac99ed5c7" data-kw="">
<blockquote><p>And secondly, whereas they allege that we let the wicked continue in our Church without separation, whereas we should cut them off when we find them to be hypocrites. I answer: We doe separate, as much as in us lies, for we labor to have them separated from us, and also we labor to separate ourselves from them. First, we labor their separation from us, desiring their removal, bewailing their wickedness, and our condition that live in Mesech and Kedar, and reproving them for their sins; and if that will not serve, complaining against them to those that are in authority, that they may bee excommunicated, and withal we are instant with God by prayer to stir up the hearts of such as are in authority to execute his ordinances upon them: we do what we can to separate them from us, and it comes sometime to pass, that many are so separated from us; but if they should not, that indeed were the Churches sin, and a foul sin too; yet it destroyes not the true being of our Church. Secondly, if we cannot get them separated from us, yet we separate ourselves from them, and that is the separation that the Scripture so much beats upon in private persons, as we are more conscionable, so we doe more separate from them, from their wills, affections and courses; yea, we must separate as much as conveniently we may from their persons, at least from their sins, which for our parts we are persuaded to be the chief separation that the Scripture intends. Yea, but this is a secret separation, say they, under hand, not openly known. Nay, this is a notorious and known separation: For first, it is ingenuously professed on our part, to the moving of their after-hatred and despite against us; we disclaiming them that are lewd, swearing and profane wretches, and that openly, not caring who know it; and likewise it is known on their part, they upbraiding us therefore very reproachfully, with the names of Puritans, Precisions, holy Brethren, and such like, because we will not accompany with them; if this be not an holy and a plain separation, what is?… Yea, but say they, ye should separate from them in the assemblies, from the Word and the sacraments? I answer: Rather the wicked should separate from us in these things: where the assembly and business are naught in themselves, as at playhouses and such like, there the good must separate: but where the assembly and business is good in itself, there the bad must separate; and the reason is good, for it is none of theirs, and the good must tarry and be present, for it is their own right; and it is sin to refuse God’s ordinances for the pollution of others, 1 Sam. 2:17, 24… yet our holiness being true in us, and openly professed and practiced, it shall be enough to make us a true visible Church, yea, and an holy congregation in God’s acceptation, and in the charitable estimation of our brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church… (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 1</cite>, Lecture 12; pp. 208-9</span></figcaption>

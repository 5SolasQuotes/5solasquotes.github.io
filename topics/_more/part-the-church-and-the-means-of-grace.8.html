uch like, because we will not accompany with them; if this be not an holy and a plain separation, what is?… Yea, but say they, ye should separate from them in the assemblies, from the Word and the sacraments? I answer: Rather the wicked should separate from us in these things: where the assembly and business are naught in themselves, as at playhouses and such like, there the good must separate: but where the assembly and business is good in itself, there the bad must separate; and the reason is good, for it is none of theirs, and the good must tarry and be present, for it is their own right; and it is sin to refuse God’s ordinances for the pollution of others, 1 Sam. 2:17, 24… yet our holiness being true in us, and openly professed and practiced, it shall be enough to make us a true visible Church, yea, and an holy congregation in God’s acceptation, and in the charitable estimation of our brethren.”

— John Randall, Twenty-Nine Lectures of the Church… (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 1, Lecture 12; pp. 208-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+secondly%2C+whereas+they+allege+that+we+let+the+wicked+continue+in+our+Church+without+separation%2C+whereas+we+should+cut+them+off+when+we+find+them+to+be+hypocrites.+I+answer%3A+We+doe+separate%2C+as+much+as+in+us+lies%2C+for+we+labor+to+have+them+separated+from+us%2C+and+also+we+labor+to+separate+ourselves+from+them.+First%2C+we+labor+their+separation+from+us%2C+desiring+their+removal%2C+bewailing+their+wickedness%2C+and+our+condition+that+live+in+Mesech+and+Kedar%2C+and+reproving+them+for+their+sins%3B+and+if+that+will+not+serve%2C+complaining+against+them+to+those+that+are+in+authority%2C+that+they+may+bee+excommunicated%2C+and+withal+we+are+instant+with+God+by+prayer+to+stir+up+the+hearts+of+such+as+are+in+authority+to+execute+his+ordinances+upon+them%3A+we+do+what+we+can+to+separate+them+from+us%2C+and+it+comes+sometime+to+pass%2C+that+many+are+so+separated+from+us%3B+but+if+they+should+not%2C+that+indeed+were+the+Churches+sin%2C+and+a+foul+sin+too%3B+yet+it+destroyes+not+the+true+being+of+our+Church.+Secondly%2C+if+we+cannot+get+them+separated+from+us%2C+yet+we+separate+ourselves+from+them%2C+and+that+is+the+separation+that+the+Scripture+so+much+beats+upon+in+private+persons%2C+as+we+are+more+conscionable%2C+so+we+doe+more+separate+from+them%2C+from+their+wills%2C+affections+and+courses%3B+yea%2C+we+must+separate+as+much+as+conveniently+we+may+from+their+persons%2C+at+least+from+their+sins%2C+which+for+our+parts+we+are+persuaded+to+be+the+chief+separation+that+the+Scripture+intends.+Yea%2C+but+this+is+a+secret+separation%2C+say+they%2C+under+hand%2C+not+openly+known.+Nay%2C+this+is+a+notorious+and+known+separation%3A+For+first%2C+it+is+ingenuously+professed+on+our+part%2C+to+the+moving+of+their+after-hatred+and+despite+against+us%3B+we+disclaiming+them+that+are+lewd%2C+swearing+and+profane+wretches%2C+and+that+openly%2C+not+caring+who+know+it%3B+and+likewise+it+is+known+on+their+part%2C+they+upbraiding+us+therefore+very+reproachfully%2C+with+the+names+of+Puritans%2C+Precisions%2C+holy+Brethren%2C+and+such+like%2C+because+we+will+not+accompany+with+them%3B+if+this+be+not+an+holy+and+a+plain+separation%2C+what+is%3F%E2%80%A6+Yea%2C+but+say+they%2C+ye+should+separate+from+them+in+the+assemblies%2C+from+the+Word+and+the+sacraments%3F+I+answer%3A+Rather+the+wicked+should+separate+from+us+in+these+things%3A+where+the+assembly+and+business+are+naught+in+themselves%2C+as+at+playhouses+and+such+like%2C+there+the+good+must+separate%3A+but+where+the+assembly+and+business+is+good+in+itself%2C+there+the+bad+must+separate%3B+and+the+reason+is+good%2C+for+it+is+none+of+theirs%2C+and+the+good+must+tarry+and+be+present%2C+for+it+is+their+own+right%3B+and+it+is+sin+to+refuse+God%E2%80%99s+ordinances+for+the+pollution+of+others%2C+1+Sam.+2%3A17%2C+24%E2%80%A6+yet+our+holiness+being+true+in+us%2C+and+openly+professed+and+practiced%2C+it+shall+be+enough+to+make+us+a+true+visible+Church%2C+yea%2C+and+an+holy+congregation+in+God%E2%80%99s+acceptation%2C+and+in+the+charitable+estimation+of+our+brethren.%E2%80%9D%0A%0A%E2%80%94+John+Randall%2C+Twenty-Nine+Lectures+of+the+Church%E2%80%A6+%28London%3A+Kyngston%2C+1631%29.+Randall+%281570%E2%80%931622%29+was+an+English+puritan.+%7C+pt.+1%2C+Lecture+12%3B+pp.+208-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ac99ed5c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ac99ed5c7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=And%20secondly%2C%20whereas%20they%20allege%20that,the%20charitable%20estimation%20of%20our%20brethren." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-388b438a3a" data-kw="">
<blockquote><p>First, for schismatical Churches, that is, such as embrace and profess the common saving faith of the catholic Church; but yet have separated themselves from the outward communion of those particular visible Churches, that sometimes they have been, and should be members of: the cause of such schisms is sometimes pride, discontent, weakness, willfulness, pretended zeal, a factious spirit; always it is Satan’s instigation, and man’s acceptation: whatsoever the cause be, and how great soever the schism be, though they be justly condemned as schismatical, in regard they are rent from the outward fellowship of such visible congregations as they belong unto, yet because they hold correspondency with the catholic Church in matters of saving faith, and accordingly profess the same, they [the schismatics] cannot be denied to be true visible Churches: Such were the Donatists of old, and such are the Brownists at this day…</p></blockquote>

<blockquote><p>The Church of Corinth was defiled with many sins, and horrible outrages, both in life and doctrine, they were deriders, sectaries, incestuous, profaners of the Lord’s Supper, deniers of the most essential article of the resurrection; yet so long as the ministry of the Word and sacraments was not utterly rejected, Paul acknowledges them a glorious Church. Certainly tares and unclean vessels are in the Church, yet let us endeavor ourselves to be good corn, and not go out of the Church, but follow the counsel of Augustine: Corripiat homo, quod potest, quod non potest, patienter ferat; Let a man reprove what he can (without danger of schism) and what he cannot, let him patiently suffer, but let him never make separation.</p></blockquote>

<blockquote><p>The true matter of a true church is such as profess saving truth taught in the Scriptures, and [this] is proved thus: That which makes a man a true member of a true church, that does make a true church (for members doe constitute the whole): but profession of saving truth makes a true member of a true church; for Simon Magus, upon his profession was admitted a member, till he fell away (Acts 8:13, 37, 38): and the eunuch upon the same profession was admitted too by baptism, and for ought we know continued forever. Now, that we in the church of England do profess saving truth, according to the Scriptures cannot be denied.</p></blockquote>

<blockquote><p>For profession brings a Church into outward fellowship with Christ’s body (as bad servants with a good master) and so into the way of being savingly of the body of Christ if they resist not, grieve not, quench not, or despise not the Spirit of grace. Secondly, for the form of a true Church, that is Christ united unto the persons professing his saving truth. For as the form of a man is his soul united to his body, so the form of a Church, which is the body of Christ, is Christ united unto it. Now, that Christ is united unto our Church is proved thus: because He gives the law of union to us as to the body, and makes it effectuall for conviction, or conversion, to serve the living and true God. As a king is united to his subjects by his laws, and executions of them for rewards and punishments: so is Jesus Christ to our Church. As the head united gives laws to the body for safety: so does Christ give laws to us for our salvation in his Word.</p></blockquote>

<blockquote><p>Have ye had a care to keep a Christian state to Christ’s honor? Have ye loved public assemblies to that end and use? Have ye not forsaken the assemblies of Christ’s people for no just cause? Is not that a true church which professes the name of Christ according to his Word, whereto it submits as the rule of the religion it has? Is not that a true Church which enters covenant with Me, as all the Christians in the world by entering into my school by baptism?</p></blockquote>

</figure><figure class="quote" id="q-d56418230e" data-kw="">
<blockquote><p>But you will say: ‘England is not a true Church, and therefore you separate; adhere to the true Church.’ I answer: Our Church is easily proved to be a true Church of Christ: First, because it has all the essentials necessary to the constitution of a true Church: as sound preaching of the gospel, right dispensation of the sacraments, prayer religiously performed, and evil persons justly punished (though not in that measure as some criminals and malefactors deserve); and therefore a true Church. … But I hear you reply: ‘Our Church is corrupted with ceremonies and pestered with profane persons. What then?’ Must we therefore separate for ceremonies, which many think may be lawfully used? But admit they be evils, must we make a rent in the Church for ceremonious rites, for circumstantial evils? That were a remedy worse than the disease. Besides, had not all the true Churches of Christ their blemishes and deformities, as you may see in the seven Asian Churches (Rev. 2–3)? And though you may find some Churches beyond sea free from ceremonies, yet notwithstanding they are more corrupt in preachers (which is the main), as in profanation of the Lord’s Day, etc.</p></blockquote>

%E2%80%99s%20Day%2C%20etc." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b016abb8db" data-kw="">
<blockquote><p>Reason 1. Because no man ought to separate himself from the true Church of Christ: Now such is an assembly professing the true faith, notwithstanding other corruption; for as holiness, if it might be supposed without true faith, cannot make a true Church, but false doctrine and error in the foundation overthrows it for being a Church: So e contra [from the contrary], corruptions in manners cannot make it no Church, when true faith is taught and maintained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-stock.html">Richard Stock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary upon the Whole Prophesy of Malachi (London: T.H., 1641), on ch. 1, verse 9</cite>, pp. 177</span></figcaption>

</figure><figure class="quote" id="q-fe32c49e52" data-kw="">
<blockquote><p>You [congregationalists] acknowledge the Churches under episcopal government in England, and under presbyterial in France, Holland and Scotland for true Churches and their ministry for a true ministry. But here I desire, with many others, to know what you understand by true Churches, and a true ministry: whether a metaphysical, logical, or a moral verity? If you understand that they be true Churches veritate metaphysica entis et transcendentalis [by the metaphysical and transcendental truth of being], such as Du Plessis and many of our divines grant unto the Romish Church, viz. that she is a true Church (as a pocky [covered with pock marks, i.e. sick] whore is a true woman), howsoever her flesh be so consumed with corruption that she cannot live, but must die of it, and that none can touch her without danger of being infected with her sickness; for she is a harlot and a whore, howsoever clothed with scarlet: we thank you for your favor; you hold us in the same category with Rome. If you hold us a true Church veritate logica [by logical truth], and morally, for a pure Church, wherefore desire you a toleration? Wherefore will ye not join with us and communicate as brethren with us? But you add a little after the middle part of this section, that you both did and would hold a communion with all those Churches, as with the Churches of Christ. But what communion is this you hold with these, rather than with Papists, Brownists, Anabaptists in England and the Lutherans? If ye say in doctrine, that union is not external, since: [1.] You testify it not by your external communion in the sacraments with us, for you will not admit all those to your communion that we admit to ours. 2. Neither will those [congregationalists] of New England, whom you cry up and extol so highly, admit those of our Church to their communion, or to be members of their Churches, unless of late they have changed their opinion and you and they temporize in conforming your opinions to the times and commensurate them to political aims for toleration. 3. Neither know we whether they will communicate with us; at least their writings and letters from New England, which heretofore we have seen, testify no such thing; so that in this you dissent from them, unless they within this year dissent from themselves. … But howsoever you pretend this real profession of communion with us, yet you overthrow it by your restriction afterwards, viz. to such as you know to be godly that came to visit you in your exile, but you will not admit all the members of our Churches, but such as you only judge, not we, to be members of our Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/adam-steuart.html">Adam Steuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some Observations &amp; Annotations upon the Apologetical Narration [of the Congregationalists of the Westminster Assembly], humbly submitted to the Honorable Houses of Parliament... (London: Meredith, 1643), ‘Annotations upon’ Steuart (1591–1654) was a Scottish presbyterian and professor of philosophy.</cite>, pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“You [congregationalists] acknowledge the Churches under episcopal government in England, and under presbyterial in France, Holland and Scotland for true Churches and their ministry for a true ministry. But here I desire, with many others, to know what you understand by true Churches, and a true ministry: whether a metaphysical, logical, or a moral verity? If you understand that they be true Churches veritate metaphysica entis et transcendentalis [by the metaphysical and transcendental truth of being], such as Du Plessis and many of our divines grant unto the Romish Church, viz. that she is a true Church (as a pocky [covered with pock marks, i.e. sick] whore is a true woman), howsoever her flesh be so consumed with corruption that she cannot live, but must die of it, and that none can touch her without danger of being infected with her sickness; for she is a harlot and a whore, howsoever clothed with scarlet: we thank you for your favor; you hold us in the same category with Rome. If you hold us a true Church veritate logica [by logical truth], and morally, for a pure Church, wherefore desire you a toleration? Wherefore will ye not join with us and communicate as brethren with us? But you add a little after the middle part of this section, that you both did and would hold a communion with all those Churches, as with the Churches of Christ. But what communion is this you hold with these, rather than with Papists, Brownists, Anabaptists in England and the Lutherans? If ye say in doctrine, that union is not external, since: [1.] You testify it not by your external communion in the sacraments with us, for you will not admit all those to your communion that we admit to ours. 2. Neither will those [congregationalists] of New England, whom you cry up and extol so highly, admit those of our Church to their communion, or to be members of their Churches, unless of late they have changed their opinion and you and they tempor <blockquote><p>[Contra a civil toleration of sects:] 1. Because it cannot but open a door to all sorts of erroneous opinions. 2. It is dangerous for the State; it may breed factions and divisions between all persons of whatsoever relation—between the magistrate and the subject, the husband and the wife, the father and the son, brothers, sisters, the master and the servant—when the one is of one religion or ecclesiastical government, and the other of another, as you have experienced. The son may refuse to receive any communion with the father, and the brother with the brother, and so dissolve all natural, civil, and domestic bonds of society. 3. No State in Christendom, where there is one only religion established, will admit the public exercise of any other, or endure a schism in that which is already received. Wherefore then should it be done here? 4. If it be granted to our brethren, I cannot see how it can well be denied to other sects. If it be said that other sects differ more from us than they do, it is all one; magis et minus non mutant speciem [more or less does not change the species] in the matter of toleration. For then all must be tolerated, some more, some less. And some of our brethren grant all this argument. And if we distinguish so, you must declare and expound clearly what sects and what opinions are to be tolerated, and what not—an inextricable question, which no mortal man, apparently, is able distinctly to determine. And some may say: the less the difference is, the less need there is for a toleration to be granted to such a sect; for the less it is, the greater is the schism. 5. God in the Old Testament granted no toleration of diverse religions or disciplines; and the New Testament requires no less union among Christians than the Old among the Jews. 6. Either our brethren assent to our doctrine and are resolved likewise to assent to the discipline which (God willing) shall be established by common consent, or they do not. If they grant the first, what need they any other toleration than the rest? If the second, it should first be discussed wherein they are resolved to dissent, and afterwards considered whether it is of such importance that, in consideration thereof, they dare not in good conscience entertain communion with us. 7. They are not pressed to be actors in anything against their consciences. Therefore they need not be suitors for a toleration; or if they be, it may justly be refused. 8. It is against the nature of the communion of saints to live in sects apart, without communicating at the Lord’s Table—which very hardly will be avoided if toleration be granted. 9. Because Scripture exhorts us evermore to unity, which cannot be easily procured by a toleration of sects, which cannot but daily beget new schisms and divisions. 10. Because the difference among the members of the Church of Corinth in the time of Saint Paul was greater, and yet they communicated together; indeed, the Apostle exhorted them to mutual communion and forbearance of sects and divisions. 11. Because the opinion of our brethren resembles too much that of the Donatists, who separated themselves from other churches under pretext that they were not so holy as their own. Neither is it unlike the convents and monasteries among the Papists; for as they all profess one doctrine with the Romish Church, and yet every order has its own discipline—Saint Francis one, Saint Dominic another—and in every order one general, and in every monastery one abbot, prior, or president, so all your churches believe one doctrine together with us, and every one of your churches has one minister, as their convents have a particular abbot or prior. You only differ in this, that you have no general, or anything answering thereto, to keep you in unity and conformity. … 13. We have but one God, one Christ, and one Lord, one Spirit; we are one body; we have one faith and one baptism, whereby we enter into the Church. Wherefore shall we not have one communion, whereby to be spiritually fed, and one discipline to be ruled by? 14. If churches have disciplines or governments different in their species, then the churches must be different in their species also; for all collective bodies or consociations that are governed are differentiated by their different governments, as we see in civil government, in the constitution and distinction of states, kingdoms, and republics. Wherefore, as many diverse governments as there are in churches, so many different species of churches must we admit. I speak here of the Church considered according to her visible form. But the consequent is false, since there is but one Church. Therefore— 15. Neither Christ nor his Apostles ever granted any toleration to diverse sects and governments in the Church; wherefore then will you be suitors for that which they never granted? … 17. Besides all this, Scripture forbids all such toleration as that of Jezebel. (Rev. 2:20) There must be no such speeches among us as “I am of Paul,” “I of Apollos,” “I of Cephas” (1 Cor 1:12); nor that some are “Calvinians,” as you term us, some “Independents,” some Brownists, some Anabaptists, etc. We must all be Christ’s; we must all think and speak the same things (v. 10). Otherwise men are carnal. Neither has the Church of God a custom to be contentious. [1 Cor. 11:16] Neither does the apostle permit schisms. [1 Cor. 12:25] We must not quit our mutual meetings, as others do, and as must be done in a public toleration. They that trouble the Church must be cut off. [Gal. 5:12] 18. Such a toleration cannot but expose our churches to the calumnies of Papists, who always object to Protestants the innumerable number of their sects, whereas they pretend to be nothing but one Church. 19. From such a toleration follows all that we formerly deduced out of Independency. … 21. Neither can it but overthrow all ecclesiastical government; for a man being censured in one church may flee to another, and being again suspended in that other, from thence to another, and so scorn all the churches of God and their censures; and thus this order by necessary consequence will breed all disorder.</p></blockquote>

erefore shall we not have one communion, whereby to be spiritually fed, and one discipline to be ruled by? 14. If churches have disciplines or governments different in their species, then the churches must be different in their species also; for all collective bodies or consociations that are governed are differentiated by their different governments, as we see in civil government, in the constitution and distinction of states, kingdoms, and republics. Wherefore, as many diverse governments as there are in churches, so many different species of churches must we admit. I speak here of the Church considered according to her visible form. But the consequent is false, since there is but one Church. Therefore— 15. Neither Christ nor his Apostles ever granted any toleration to diverse sects and governments in the Church; wherefore then will you be suitors for that which they never granted? … 17. Besides all this, Scripture forbids all such toleration as that of Jezebel. (Rev. 2:20) There must be no such speeches among us as “I am of Paul,” “I of Apollos,” “I of Cephas” (1 Cor 1:12); nor that some are “Calvinians,” as you term us, some “Independents,” some Brownists, some Anabaptists, etc. We must all be Christ’s; we must all think and speak the same things (v. 10). Otherwise men are carnal. Neither has the Church of God a custom to be contentious. [1 Cor. 11:16] Neither does the apostle permit schisms. [1 Cor. 12:25] We must not quit our mutual meetings, as others do, and as must be done in a public toleration. They that trouble the Church must be cut off. [Gal. 5:12] 18. Such a toleration cannot but expose our churches to the calumnies of Papists, who always object to Protestants the innumerable number of their sects, whereas they pretend to be nothing but one Church. 19. From such a toleration follows all that we formerly deduced out of Independency. … 21. Neither can it but overthrow all ecclesiastical government; for a man being censured in one church may flee to another, and being again suspended in that other, from thence to another, and so scorn all the churches of God and their censures; and thus this order by necessary consequence will breed all disorder.”

— Adam Steuart, Some Observations &amp; Annotations upon the Apologetical Narration [of the Congregationalists of the Westminster Assembly], humbly submitted to the Honorable Houses of Parliament... (London: Meredith, 1643), ‘Annotations upon’ Steuart (1591–1654) was a Scottish presbyterian and professor of philosophy., pp. 61-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BContra+a+civil+toleration+of+sects%3A%5D+1.+Because+it+cannot+but+open+a+door+to+all+sorts+of+erroneous+opinions.+2.+It+is+dangerous+for+the+State%3B+it+may+breed+factions+and+divisions+between+all+persons+of+whatsoever+relation%E2%80%94between+the+magistrate+and+the+subject%2C+the+husband+and+the+wife%2C+the+father+and+the+son%2C+brothers%2C+sisters%2C+the+master+and+the+servant%E2%80%94when+the+one+is+of+one+religion+or+ecclesiastical+government%2C+and+the+other+of+another%2C+as+you+have+experienced.+The+son+may+refuse+to+receive+any+communion+with+the+father%2C+and+the+brother+with+the+brother%2C+and+so+dissolve+all+natural%2C+civil%2C+and+domestic+bonds+of+society.+3.+No+State+in+Christendom%2C+where+there+is+one+only+religion+established%2C+will+admit+the+public+exercise+of+any+other%2C+or+endure+a+schism+in+that+which+is+already+received.+Wherefore+then+should+it+be+done+here%3F+4.+If+it+be+granted+to+our+brethren%2C+I+cannot+see+how+it+can+well+be+denied+to+other+sects.+If+it+be+said+that+other+sects+differ+more+from+us+than+they+do%2C+it+is+all+one%3B+magis+et+minus+non+mutant+speciem+%5Bmore+or+less+does+not+change+the+species%5D+in+the+matter+of+toleration.+For+then+all+must+be+tolerated%2C+some+more%2C+some+less.+And+some+of+our+brethren+grant+all+this+argument.+And+if+we+distinguish+so%2C+you+must+declare+and+expound+clearly+what+sects+and+what+opinions+are+to+be+tolerated%2C+and+what+not%E2%80%94an+inextricable+question%2C+which+no+mortal+man%2C+apparently%2C+is+able+distinctly+to+determine.+And+some+may+say%3A+the+less+the+difference+is%2C+the+less+need+there+is+for+a+toleration+to+be+granted+to+such+a+sect%3B+for+the+less+it+is%2C+the+greater+is+the+schism.+5.+God+in+the+Old+Testament+granted+no+toleration+of+diverse+religions+or+disciplines%3B+and+the+New+Testament+requires+no+less+union+among+Christians+than+the+Old+among+the+Jews.+6.+Either+our+brethren+assent+to+our+doctrine+and+are+resolved+likewise+to+assent+to+the+discipline+which+%28God+willing%29+shall+be+established+by+common+consent%2C+or+they+do+not.+If+they+grant+the+first%2C+what+need+they+any+other+toleration+than+the+rest%3F+If+the+second%2C+it+should+first+be+discussed+wherein+they+are+resolved+to+dissent%2C+and+afterwards+considered+whether+it+is+of+such+importance+that%2C+in+consideration+thereof%2C+they+dare+not+in+good+conscience+entertain+communion+with+us.+7.+They+are+not+pressed+to+be+actors+in+anything+against+their+consciences.+Therefore+they+need+not+be+suitors+for+a+toleration%3B+or+if+they+be%2C+it+may+justly+be+refused.+8.+It+is+against+the+nature+of+the+communion+of+saints+to+live+in+sects+apart%2C+without+communicating+at+the+Lord%E2%80%99s+Table%E2%80%94which+very+hardly+will+be+avoided+if+toleration+be+granted.+9.+Because+Scripture+exhorts+us+evermore+to+unity%2C+which+cannot+be+easily+procured+by+a+toleration+of+sects%2C+which+cannot+but+daily+beget+new+schisms+and+divisions.+10.+Because+the+difference+among+the+members+of+the+Church+of+Corinth+in+the+time+of+Saint+Paul+was+greater%2C+and+yet+they+communicated+together%3B+indeed%2C+the+Apostle+exhorted+them+to+mutual+communion+and+forbearance+of+sects+and+divisions.+11.+Because+the+opinion+of+our+brethren+resembles+too+much+that+of+the+Donatists%2C+who+separated+themselves+from+other+churches+under+pretext+that+they+were+not+so+holy+as+their+own.+Neither+is+it+unlike+the+convents+and+monasteries+among+the+Papists%3B+for+as+they+all+profess+one+doctrine+with+the+Romish+Church%2C+and+yet+every+order+has+its+own+discipline%E2%80%94Saint+Francis+one%2C+Saint+Dominic+another%E2%80%94and+in+every+order+one+general%2C+and+in+every+monastery+one+abbot%2C+prior%2C+or+president%2C+so+all+your+churches+believe+one+doctrine+together+with+us%2C+and+every+one+of+your+churches+has+one+minister%2C+as+their+convents+have+a+particular+abbot+or+prior.+You+only+differ+in+this%2C+that+you+have+no+general%2C+or+anything+answering+thereto%2C+to+keep+you+in+unity+and+conformity.+%E2%80%A6+13.+We+have+but+one+God%2C+one+Christ%2C+and+one+Lord%2C+one+Spirit%3B+we+are+one+body%3B+we+have+one+faith+and+one+baptism%2C+whereby+we+enter+into+the+Church.+Wherefore+shall+we+not+have+one+communion%2C+whereby+to+be+spiritually+fed%2C+and+one+discipline+to+be+ruled+by%3F+14.+If+churches+have+disciplines+or+governments+different+in+their+species%2C+then+the+churches+must+be+different+in+their+species+also%3B+for+all+collective+bodies+or+consociations+that+are+governed+are+differentiated+by+their+different+governments%2C+as+we+see+in+civil+government%2C+in+the+constitution+and+distinction+of+states%2C+kingdoms%2C+and+republics.+Wherefore%2C+as+many+diverse+governments+as+there+are+in+churches%2C+so+many+different+species+of+churches+must+we+admit.+I+speak+here+of+the+Church+considered+according+to+her+visible+form.+But+the+consequent+is+false%2C+since+there+is+but+one+Church.+Therefore%E2%80%94+15.+Neither+Christ+nor+his+Apostles+ever+granted+any+toleration+to+diverse+sects+and+governments+in+the+Church%3B+wherefore+then+will+you+be+suitors+for+that+which+they+never+granted%3F+%E2%80%A6+17.+Besides+all+this%2C+Scripture+forbids+all+such+toleration+as+that+of+Jezebel.+%28Rev.+2%3A20%29+There+must+be+no+such+speeches+among+us+as+%E2%80%9CI+am+of+Paul%2C%E2%80%9D+%E2%80%9CI+of+Apollos%2C%E2%80%9D+%E2%80%9CI+of+Cephas%E2%80%9D+%281+Cor+1%3A12%29%3B+nor+that+some+are+%E2%80%9CCalvinians%2C%E2%80%9D+as+you+term+us%2C+some+%E2%80%9CIndependents%2C%E2%80%9D+some+Brownists%2C+some+Anabaptists%2C+etc.+We+must+all+be+Christ%E2%80%99s%3B+we+must+all+think+and+speak+the+same+things+%28v.+10%29.+Otherwise+men+are+carnal.+Neither+has+the+Church+of+God+a+custom+to+be+contentious.+%5B1+Cor.+11%3A16%5D+Neither+does+the+apostle+permit+schisms.+%5B1+Cor.+12%3A25%5D+We+must+not+quit+our+mutual+meetings%2C+as+others+do%2C+and+as+must+be+done+in+a+public+toleration.+They+that+trouble+the+Church+must+be+cut+off.+%5BGal.+5%3A12%5D+18.+Such+a+toleration+cannot+but+expose+our+churches+to+the+calumnies+of+Papists%2C+who+always+object+to+Protestants+the+innumerable+number+of+their+sects%2C+whereas+they+pretend+to+be+nothing+but+one+Church.+19.+From+such+a+toleration+follows+all+that+we+formerly+deduced+out+of+Independency.+%E2%80%A6+21.+Neither+can+it+but+overthrow+all+ecclesiastical+government%3B+for+a+man+being+censured+in+one+church+may+flee+to+another%2C+and+being+again+suspended+in+that+other%2C+from+thence+to+another%2C+and+so+scorn+all+the+churches+of+God+and+their+censures%3B+and+thus+this+order+by+necessary+consequence+will+breed+all+disorder.%E2%80%9D%0A%0A%E2%80%94+Adam+Steuart%2C+Some+Observations+%26+Annotations+upon+the+Apologetical+Narration+%5Bof+the+Congregationalists+of+the+Westminster+Assembly%5D%2C+humbly+submitted+to+the+Honorable+Houses+of+Parliament...+%28London%3A+Meredith%2C+1643%29%2C+%E2%80%98Annotations+upon%E2%80%99+Steuart+%281591%E2%80%931654%29+was+a+Scottish+presbyterian+and+professor+of+philosophy.%2C+pp.+61-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5e8b6e1711.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5e8b6e1711.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=%5BContra%20a%20civil%20toleration%20of%20sects%3A%5D,necessary%20consequence%20will%20breed%20all%20disorder." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Mr. de Cluse in his prophesy [preaching amongst the Brownists] labored to prove separation from a true Church for any corruption, obstinately stood in this doctrine, was by another in prophesying there showed to be absolutely contrary to the place, Rev. 2:24; which how unsoundly it was concluded by our teacher was then observed by many… If these things be so, and be not redressed by the 〈◊〉 of this prophesy we must (according to Mr. de Cluse’s doctrine) make a new separation. How oft do the [Brownist] Brethren except one against another’s prophesying, by which, much heart-burning and strife is kindled between them? These things being well considered, I pray you well to mind whether this new way of prophesying on the Lord’s Day can be for the edification of the Church or not.</p></blockquote>

</figure><figure class="quote" id="q-91a9b3e084" data-kw="">
<blockquote><p>To depart from the Church of England is a departing from the Church of God: let them consider, the Church of Corinth had many faults in it, as many as the Church of England has, and as great ones too; and yet [it] was God’s Church for their faults. St. Paul blames some there for their civil jars impetuously, they traffering them and their suits to the courts of infidels, 1 Cor. 6:7. Others for their wicked connivence and indulgence towards the incestuous, 1 Cor. 5; others for their vile profaneness in their sacred assemblies, 1 Cor. 11:32. Yea, others for heresy, 1 Cor. 15… But the example of Christ Himself writing to the seven Churches of Asia may be our best direction, charging five of them with several faults, and with crimes of a large size, yet he does call them Churches. Moreover, is not the forsaking the Church of God, a forsaking of God Himself?</p></blockquote>

<blockquote><p>…Mr. Calamy in his Fast Sermon, Sept. 24, 1645, did call upon his people to be ashamed and confounded… ‘That while the parliament is sitting and laboring to settle things, and while the [Westminster] Assembly of ministers are studying to settle religion and laboring to heal our breaches, [churches] should be separating from us.’… He [Calamy] never thought, much less preached, that we should join with a defiled Church in her defilements. It is one thing to join with a Church in her corruptions, another thing to separate from a true Church because of some defilements that may be in it. And this is that for which we think people ought to be ashamed and confounded; Because for some few (and those but supposed) defilements, they separate not only from defilements, but from the true Churches of Jesus Christ and engage themselves into separated congregations and do not wait and tarry to see what reformation the Parliament will make. And this is no more than five (as we remember) of your [congregationalist] brethren [at Westminster] have written as their judgement in print. And therefore what Mr. [Henry] Burton writes in his margin to prove that every one ought today, before tomorrow, to separate from present defilements, is but to fight with his own shadow. For though we must separate from the defilements of a Church, yet we are not to separate from a Church for every defilement that is in it. The Church of Corinth had many defilements in it, as many we believe as the Church of Aldermanbury [that Burton exited]; And so had diverse of the Churches to which Christ wrote. And yet neither Christ, nor his apostles does persuade the people to separate from those Churches, because of the defilements. And if this doctrine were true doctrine, we believe men will soon find cause to separate from some of their churches as well as ours.</p></blockquote>

<blockquote><p>…a man may be a schismatic, forsaking communion with a true Church, and yet not be an heretic, in as much as he may rightly believe all the articles of the Faith. … Other divisions there are which are with separation, when men shall withdraw themselves from fellowship and communion with a true Church, so breaking themselves off from the body. And this (says our judicious [William] Ames)¹ by way of special appropriation, deserves most rightly to be called by the name of ‘schism’: in as much as heresy in this division is perfected and brought to a head, as also most clearly manifested, and declared, viz. in refusing of due Church-communion. ¹ Quia autem haec scissio maxime perficitur et apparet in debita communione Ecclesiastica recusanda, idcirco illa separatio per appropriationem singularium recte vocatur Schisma [But because this division is chiefly brought about and becomes evident in the refusing of due ecclesiastical communion, therefore that separation, by the appropriating of things to oneself, is rightly called ‘schism’]. Ames, Cases of Conscience on Schism Which refusal may be either partial, or total. Partial, in some particular acts and exercises, wherein a man cannot (or at least conceives he cannot) communicate without sin. Total, a rejecting, and renouncing of all religious communion. This latter all divines look upon as a schism, and that most properly so called. Which (again) may be either from the Church, or from a Church. From the Church catholic, the whole Church. That was properly Donatism (the direct error of the Seekers at this day): Or from a particular Church; and that is properly Separatism.</p></blockquote>

<blockquote><p>2. And as it is opposite to charity, so it is injurious to Christ, who seems by this means to be (as it were) divided. So Paul urges it in the third verse after the text, ‘Is Christ divided?’ Using this as an argument to induce his Corinthians to eschew all such divisions and schisms (1 Cor. 1:13), in as much as Christ Himself seems hereby to be parted and torn in pieces; the unity of his mystical body being hereby dissolved, and Himself made the head of two disagreeing bodies; which is dishonorable and monstrous to conceive of Him. 3. As it is injurious to the head, so to the body. As to Christ, so to the Church. And that many ways: 1. Shaming it. The Church’s unity is her glory. ‘My Dove, my undefiled is one’ (Cant. 6:9). Now to break this unity, to divide the Spouse of Christ, as the Levite’s concubine was, into many pieces (Jud. 19:1), what a shame is this? A shame in special to the Church, from which this separation is made. Paul, writing to his Corinthians of their excluding the poor from communicating with them, tells them that herein they shamed them. (1 Cor. 11:22) They shamed them which had not as themselves had. 2. Despising and contemning it. So Paul there again charges it. Or despise you the Church of God? Why, wherein did they despise it? This they did (as by other ways, so) by their schismatical practices, dividing themselves from their brethren, making their love-feasts and the sacrament itself (both which were instituted and ordained for bands of union) to be an occasion of fomenting their divisions; namely, by celebrating them apart from their brethren. So the apostle there taxes them (v.21): In eating, every one takes before other his own supper. Each prevented the other. This they did in their love-feasts. And this most probably they did in the Lord’s Supper itself (as Parcus conceives of it),¹ communicating apart, each faction by itself: those that were of Paul by themselves, and those which were of Peter by themselves, and those which were of Apollo by themselves; none of them staying for those which were of Christ (the best and truest piece of the Church), nor yet one for another; but each seeking to prevent the other, that so they might communicate apart. ¹ Adò divisi erant, ut invicem communicare sacram cenam non dignarentur. Singulae factiones id agebant ut alia aliam praeverteret. Paulini, verbi gratia, primi venientes suam cenam celebrabant, non expectatis Petrinis, Apollinis, etc. [They were so divided that they did not deem it worthy to receive the holy supper together. Each faction aimed to get ahead of the others. The followers of Paul, for example, arriving first, celebrated their own supper without waiting for the followers of Peter, of Apollos, etc.] This Paul calls here their own supper [v. 21]; in as much as they so made it, by appropriating it each to themselves and their party, contrary to the institution of Christ. Christ had instituted it, that it should be a communion, a common Supper, wherein the whole Church should communicate together. But they, by their celebrating it in such a separated way, had made it their own supper. A foul perverting of the ordinance; not only an abusing and corrupting of it, but plainly a destroying of it. So Paul there tells them in downright words in the verse foregoing: ‘When you come together into one place, this is not to eat the Lord’s Supper.’ What then? Their own supper. Of such dangerous consequence is it to celebrate this ordinance of God, the sacrament of the Lord’s Supper, in a separated way (1 Cor. 11:20). If Paul’s judgement may be taken in the case, it is not only a corrupting, but a perverting of the ordinance: a celebrating not of the Lord’s Supper, but of our own Supper. Which whoso do, what do they therein but despise and contemn the Church of God? namely, that Church from which they so separate. Now this, if it be a true Church, can be no small evil. To contemn and despise a private Christian, by shutting him out from desired communion, there being no just cause for it, is a great evil. But to despise and contemn a Church, a true Church of Christ, by shutting it out from communion, and by separating from it, this is a far greater. 3. As the Church is hereby despised, so it is disquieted. Even as it is in the natural body, if there be a solutio continui [a breaking of continuity], so as it be divided and parted, it breeds smart and pain, which sometimes puts the body into feverish distempers. And surely such are the symptoms of schism. The mystical body cannot be rent and torn by divisions, but it goes to the heart of all the sensible members of it. The divisions of Reuben were great thoughts of heart (Jud. 5:25). Reuben, dwelling on the other side Jordan, kept themselves separate, not joining with their brethren against their enemies, but stood as neutral, regarding more their own private than the public interest. And possibly they were divided among themselves, distracted with several opinions what they should do: some would join, others would not. Now these divisions were great thoughts of heart, working many strange impressions in the minds both of themselves and others; of very sad consequence to all the tribes of Israel. And truly, such are divisions in the Church of God, specially when they are boiled up to complete and perfect schisms (as it is in the case of separation, specially when it comes to the setting up of Churches against Churches). O these are sad thoughts of heart to the Israel of God; causing grief to the particular members of the Church, and great disquiet and disturbance to the whole Body. Oft-times breeding those feverish distempers, those un-Christian heats of hatred, variance, emulation, wrath, strife, seditions, envyings, yea, and murders too, as the apostle puts them together (Gal. 5:20). These, all these, are the fruits of schism, by reason whereof there cannot but follow a dreadful combustion in the Body of the Church, tending to the great trouble and disquietment of it. 4. As the Church is hereby disquieted, so hindered. As disquieted in the peace, so hindered in the edification of it. We know what it was which hindered the building of Babel, even a schism in their tongues, division of languages. (What do we think a schism in their hands would have done, if one had fallen to pulling down what the other built up?) And surely, there is no one thing that can more hinder the building of Jerusalem, the edification of the Church, than this, when Christians shall be divided in their heads, hearts, tongues, hands; in their judgments, affections, language, practice. How should the work of the Lord now go on? Even as it is in civil wars: whilst the parties are contending, the commonwealth suffers. So is it in Church-divisions: whilst the parties are contending, the Church suffers. As it is with a ship brought to the back-stays: one sail bears the one way, and another another; in the meantime the ship stands still. The wall and temple of Jerusalem went slowly on in troublous times. So will Church work do, wherever schisms and factions break it. 5. Again, as the Church is disquieted and hindered, so endangered by it.¹ As disquieted in the peace of it, and hindered in the edification of it, so endangered in the state of it. The cutting off of one member from the body is dangerous to the whole. What is the dismembering of a Church? The withdrawing of communion with it, the breaking off of all fellowship and communion with it by an actual and positive Separation. Certainly, this cannot but endanger the state of that Church from which this separation is made. Which, if it live and continue, is no thanks to them who have thus withdrawn themselves, who by their separation have done what in them lies to destroy it. Thus is schism injurious to the Church of God. ¹ Hoc consensu stat et subnixa est salus Ecclesiae [On this agreement the safety of the Church stands and is supported], Calvin on the text. Corpus Organicum non potest dissecari quin pariter et totum et partes intereant [An organic body cannot be cut in pieces without both the whole and the parts perishing together]. Peter Martyr on the text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of the Present Schism of New Separation in old England (London: Field, 1646)</cite>, pp. 19-22</span></figcaption>

<div class="actions"><button class="copy" data-copy="“2. And as it is opposite to charity, so it is injurious to Christ, who seems by this means to be (as it were) divided. So Paul urges it in the third verse after the text, ‘Is Christ divided?’ Using this as an argument to induce his Corinthians to eschew all such divisions and schisms (1 Cor. 1:13), in as much as Christ Himself seems hereby to be parted and torn in pieces; the unity of his mystical body being hereby dissolved, and Himself made the head of two disagreeing bodies; which is dishonorable and monstrous to conceive of Him. 3. As it is injurious to the head, so to the body. As to Christ, so to the Church. And that many ways: 1. Shaming it. The Church’s unity is her glory. ‘My Dove, my undefiled is one’ (Cant. 6:9). Now to break this unity, to divide the Spouse of Christ, as the Levite’s concubine was, into many pieces (Jud. 19:1), what a shame is this? A shame in special to the Church, from which this separation is made. Paul, writing to his Corinthians of their excluding the poor from communicating with them, tells them that herein they shamed them. (1 Cor. 11:22) They shamed them which had not as themselves had. 2. Despising and contemning it. So Paul there again charges it. Or despise you the Church of God? Why, wherein did they despise it? This they did (as by other ways, so) by their schismatical practices, dividing themselves from their brethren, making their love-feasts and the sacrament itself (both which were instituted and ordained for bands of union) to be an occasion of fomenting their divisions; namely, by celebrating them apart from their brethren. So the apostle there taxes them (v.21): In eating, every one takes before other his own supper. Each prevented the other. This they did in their love-feasts. And this most probably they did in the Lord’s Supper itself (as Parcus conceives of it),¹ communicating apart, each faction by itself: those that were of Paul by themselves, and those which were of Peter by themselves, and those which were of Apollo by themselves; none of them staying for those which were of Christ (the best and truest piece of the Church), nor yet one for another; but each seeking to prevent the other, that so they might communicate apart. ¹ Adò divisi erant, ut invicem communicare sacram cenam non dignarentur. Singulae factiones id agebant ut alia aliam praeverteret. Paulini, verbi gratia, primi venientes suam cenam celebrabant, non expectatis Petrinis, Apollinis, etc. [They were so divided that they did not deem it worthy to receive the holy supper together. Each faction aimed to get ahead of the others. The followers of Paul, for example, arriving first, celebrated their own supper without waiting for the followers of Peter, of Apollos, etc.] This Paul calls here their own supper [v. 21]; in as much as they so made it, by appropriating it each to themselves and their party, contrary to the institution of Christ. Christ had instituted it, that it should be a communion, a common Supper, wherein the whole Church should communicate together. But they, by their celebrating it in such a separated way, had made it their own supper. A foul perverting of the ordinance; not only an abusing and corrupting of it, but plainly a destroying of it. So Paul there tells them in downright words in the verse foregoing: ‘When you come together into one place, this is not to eat the Lord’s Supper.’ What then? Their own supper. Of such dangerous consequence is it to celebrate this ordinance of God, the sacrament of the Lord’s Supper, in a separated way (1 Cor. 11:20). If Paul’s judgement may be taken in the case, it is not only a corrupting, but a perverting of the ordinance: a celebrating not of the Lord’s Supper, but of our own Supper. Which whoso do, what do they therein but despise and contemn the Church of God? namely, that Church from which they so separate. Now this, if it be a true Church, can be no small evil. To contemn and despise a private Christian, by shutting him out from desired communion, there being no just cause for it, is a great evil. But to despise and contemn a Church, a true Church of Christ, by shutting it out from communion, and by separating from it, this is a far greater. 3. As the Church is hereby despised, so it is disquieted. Even as it is in the natural body, if there be a solutio continui [a breaking of continuity], so as it be divided and parted, it breeds smart and pain, which sometimes puts the body into feverish distempers. And surely such are the symptoms of schism. The mystical body cannot be rent and torn by divisions, but it goes to the heart of all the sensible members of it. The divisions of Reuben were great thoughts of heart (Jud. 5:25). Reuben, dwelling on the other side Jordan, kept themselves separate, not joining with their brethren against their enemies, but stood as neutral, regarding more their own private than the public interest. And possibly they were divided among themselves, distracted with several opinions what they should do: some would join, others would not. Now these divisions were great thoughts of heart, working many strange impressions in the minds both of themselves and others; of very sad consequence to all the tribes of Israel. And truly, such are divisions in the Church of God, specially when they are boiled up to complete and perfect schisms (as it is in the case of separation, specially when it comes to the setting up of Churches against Churches). O these are sad thoughts of heart to the Israel of God; causing grief to the particular members of the Church, and great disquiet and disturbance to the whole Body. Oft-times breeding those feverish distempers, those un-Christian heats of hatred, variance, emulation, wrath, strife, seditions, envyings, yea, and murders too, as the apostle puts them together (Gal. 5:20). These, all these, are the fruits of schism, by reason whereof there cannot but follow a dreadful combustion in the Body of the Church, tending to the great trouble and disquietment of it. 4. As the Church is hereby disquieted, so hindered. As disquieted in the peace, so hindered in the edification of it. We know what it was which hindered the building of Babel, even a schism in their tongues, division of languages. (What do we think a schism in their hands would have done, if one had fallen to pulling down what the other built up?) And surely, there is no one thing that can more hinder the building of Jerusalem, the edification of the Church, than this, when Christians shall be divided in their heads, hearts, tongues, hands; in their judgments, affections, language, practice. How should the work of the Lord now go on? Even as it is in civil wars: whilst the parties are contending, the commonwealth suffers. So is it in Church-divisions: whilst the parties are contending, the Church suffers. As it is with a ship brought to the back-stays: one sail bears the one way, and another another; in the meantime the ship stands still. The wall and temple of Jerusalem went slowly on in troublous times. So will Church work do, wherever schisms and factions break it. 5. Again, as the Church is disquieted and hindered, so endangered by it.¹ As disquieted in the peace of it, and hindered in the edification of it, so endangered in the state of it. The cutting off of one member from the body is dangerous to the whole. What is the dismembering of a Church? The withdrawing of communion with it, the breaking off of all fellowship and communion with it by an actual and positive Separation. Certainly, this cannot but endanger the state of that Church from which this separation is made. Which, if it live and continue, is no thanks to them who have thus withdrawn themselves, who by their separation have done what in them lies to destroy it. Thus is schism injurious to the Church of God. ¹ Hoc consensu stat et subnixa est salus Ecclesiae [On this agreement the safety of the Church stands and is supported], Calvin on the text. Corpus Organicum non potest dissecari quin pariter et totum et partes intereant [An organic body cannot be cut in pieces without both the whole and the parts perishing together]. Peter Martyr on the text.”

— John Brinsley, The Arraignment of the Present Schism of New Separation in old England (London: Field, 1646), pp. 19-22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+And+as+it+is+opposite+to+charity%2C+so+it+is+injurious+to+Christ%2C+who+seems+by+this+means+to+be+%28as+it+were%29+divided.+So+Paul+urges+it+in+the+third+verse+after+the+text%2C+%E2%80%98Is+Christ+divided%3F%E2%80%99+Using+this+as+an+argument+to+induce+his+Corinthians+to+eschew+all+such+divisions+and+schisms+%281+Cor.+1%3A13%29%2C+in+as+much+as+Christ+Himself+seems+hereby+to+be+parted+and+torn+in+pieces%3B+the+unity+of+his+mystical+body+being+hereby+dissolved%2C+and+Himself+made+the+head+of+two+disagreeing+bodies%3B+which+is+dishonorable+and+monstrous+to+conceive+of+Him.+3.+As+it+is+injurious+to+the+head%2C+so+to+the+body.+As+to+Christ%2C+so+to+the+Church.+And+that+many+ways%3A+1.+Shaming+it.+The+Church%E2%80%99s+unity+is+her+glory.+%E2%80%98My+Dove%2C+my+undefiled+is+one%E2%80%99+%28Cant.+6%3A9%29.+Now+to+break+this+unity%2C+to+divide+the+Spouse+of+Christ%2C+as+the+Levite%E2%80%99s+concubine+was%2C+into+many+pieces+%28Jud.+19%3A1%29%2C+what+a+shame+is+this%3F+A+shame+in+special+to+the+Church%2C+from+which+this+separation+is+made.+Paul%2C+writing+to+his+Corinthians+of+their+excluding+the+poor+from+communicating+with+them%2C+tells+them+that+herein+they+shamed+them.+%281+Cor.+11%3A22%29+They+shamed+them+which+had+not+as+themselves+had.+2.+Despising+and+contemning+it.+So+Paul+there+again+charges+it.+Or+despise+you+the+Church+of+God%3F+Why%2C+wherein+did+they+despise+it%3F+This+they+did+%28as+by+other+ways%2C+so%29+by+their+schismatical+practices%2C+dividing+themselves+from+their+brethren%2C+making+their+love-feasts+and+the+sacrament+itself+%28both+which+were+instituted+and+ordained+for+bands+of+union%29+to+be+an+occasion+of+fomenting+their+divisions%3B+namely%2C+by+celebrating+them+apart+from+their+brethren.+So+the+apostle+there+taxes+them+%28v.21%29%3A+In+eating%2C+every+one+takes+before+other+his+own+supper.+Each+prevented+the+other.+This+they+did+in+their+love-feasts.+And+this+most+probably+they+did+in+the+Lord%E2%80%99s+Supper+itself+%28as+Parcus+conceives+of+it%29%2C%C2%B9+communicating+apart%2C+each+faction+by+itself%3A+those+that+were+of+Paul+by+themselves%2C+and+those+which+were+of+Peter+by+themselves%2C+and+those+which+were+of+Apollo+by+themselves%3B+none+of+them+staying+for+those+which+were+of+Christ+%28the+best+and+truest+piece+of+the+Church%29%2C+nor+yet+one+for+another%3B+but+each+seeking+to+prevent+the+other%2C+that+so+they+might+communicate+apart.+%C2%B9+Ad%C3%B2+divisi+erant%2C+ut+invicem+communicare+sacram+cenam+non+dignarentur.+Singulae+factiones+id+agebant+ut+alia+aliam+praeverteret.+Paulini%2C+verbi+gratia%2C+primi+venientes+suam+cenam+celebrabant%2C+non+expectatis+Petrinis%2C+Apollinis%2C+etc.+%5BThey+were+so+divided+that+they+did+not+deem+it+worthy+to+receive+the+holy+supper+together.+Each+faction+aimed+to+get+ahead+of+the+others.+The+followers+of+Paul%2C+for+example%2C+arriving+first%2C+celebrated+their+own+supper+without+waiting+for+the+followers+of+Peter%2C+of+Apollos%2C+etc.%5D+This+Paul+calls+here+their+own+supper+%5Bv.+21%5D%3B+in+as+much+as+they+so+made+it%2C+by+appropriating+it+each+to+themselves+and+their+party%2C+contrary+to+the+institution+of+Christ.+Christ+had+instituted+it%2C+that+it+should+be+a+communion%2C+a+common+Supper%2C+wherein+the+whole+Church+should+communicate+together.+But+they%2C+by+their+celebrating+it+in+such+a+separated+way%2C+had+made+it+their+own+supper.+A+foul+perverting+of+the+ordinance%3B+not+only+an+abusing+and+corrupting+of+it%2C+but+plainly+a+destroying+of+it.+So+Paul+there+tells+them+in+downright+words+in+the+verse+foregoing%3A+%E2%80%98When+you+come+together+into+one+place%2C+this+is+not+to+eat+the+Lord%E2%80%99s+Supper.%E2%80%99+What+then%3F+Their+own+supper.+Of+such+dangerous+consequence+is+it+to+celebrate+this+ordinance+of+God%2C+the+sacrament+of+the+Lord%E2%80%99s+Supper%2C+in+a+separated+way+%281+Cor.+11%3A20%29.+If+Paul%E2%80%99s+judgement+may+be+taken+in+the+case%2C+it+is+not+only+a+corrupting%2C+but+a+perverting+of+the+ordinance%3A+a+celebrating+not+of+the+Lord%E2%80%99s+Supper%2C+but+of+our+own+Supper.+Which+whoso+do%2C+what+do+they+therein+but+despise+and+contemn+the+Church+of+God%3F+namely%2C+that+Church+from+which+they+so+separate.+Now+this%2C+if+it+be+a+true+Church%2C+can+be+no+small+evil.+To+contemn+and+despise+a+private+Christian%2C+by+shutting+him+out+from+desired+communion%2C+there+being+no+just+cause+for+it%2C+is+a+great+evil.+But+to+despise+and+contemn+a+Church%2C+a+true+Church+of+Christ%2C+by+shutting+it+out+from+communion%2C+and+by+separating+from+it%2C+this+is+a+far+greater.+3.+As+the+Church+is+hereby+despised%2C+so+it+is+disquieted.+Even+as+it+is+in+the+natural+body%2C+if+there+be+a+solutio+continui+%5Ba+breaking+of+continuity%5D%2C+so+as+it+be+divided+and+parted%2C+it+breeds+smart+and+pain%2C+which+sometimes+puts+the+body+into+feverish+distempers.+And+surely+such+are+the+symptoms+of+schism.+The+mystical+body+cannot+be+rent+and+torn+by+divisions%2C+but+it+goes+to+the+heart+of+all+the+sensible+members+of+it.+The+divisions+of+Reuben+were+great+thoughts+of+heart+%28Jud.+5%3A25%29.+Reuben%2C+dwelling+on+the+other+side+Jordan%2C+kept+themselves+separate%2C+not+joining+with+their+brethren+against+their+enemies%2C+but+stood+as+neutral%2C+regarding+more+their+own+private+than+the+public+interest.+And+possibly+they+were+divided+among+themselves%2C+distracted+with+several+opinions+what+they+should+do%3A+some+would+join%2C+others+would+not.+Now+these+divisions+were+great+thoughts+of+heart%2C+working+many+strange+impressions+in+the+minds+both+of+themselves+and+others%3B+of+very+sad+consequence+to+all+the+tribes+of+Israel.+And+truly%2C+such+are+divisions+in+the+Church+of+God%2C+specially+when+they+are+boiled+up+to+complete+and+perfect+schisms+%28as+it+is+in+the+case+of+separation%2C+specially+when+it+comes+to+the+setting+up+of+Churches+against+Churches%29.+O+these+are+sad+thoughts+of+heart+to+the+Israel+of+God%3B+causing+grief+to+the+particular+members+of+the+Church%2C+and+great+disquiet+and+disturbance+to+the+whole+Body.+Oft-times+breeding+those+feverish+distempers%2C+those+un-Christian+heats+of+hatred%2C+variance%2C+emulation%2C+wrath%2C+strife%2C+seditions%2C+envyings%2C+yea%2C+and+murders+too%2C+as+the+apostle+puts+them+together+%28Gal.+5%3A20%29.+These%2C+all+these%2C+are+the+fruits+of+schism%2C+by+reason+whereof+there+cannot+but+follow+a+dreadful+combustion+in+the+Body+of+the+Church%2C+tending+to+the+great+trouble+and+disquietment+of+it.+4.+As+the+Church+is+hereby+disquieted%2C+so+hindered.+As+disquieted+in+the+peace%2C+so+hindered+in+the+edification+of+it.+We+know+what+it+was+which+hindered+the+building+of+Babel%2C+even+a+schism+in+their+tongues%2C+division+of+languages.+%28What+do+we+think+a+schism+in+their+hands+would+have+done%2C+if+one+had+fallen+to+pulling+down+what+the+other+built+up%3F%29+And+surely%2C+there+is+no+one+thing+that+can+more+hinder+the+building+of+Jerusalem%2C+the+edification+of+the+Church%2C+than+this%2C+when+Christians+shall+be+divided+in+their+heads%2C+hearts%2C+tongues%2C+hands%3B+in+their+judgments%2C+affections%2C+language%2C+practice.+How+should+the+work+of+the+Lord+now+go+on%3F+Even+as+it+is+in+civil+wars%3A+whilst+the+parties+are+contending%2C+the+commonwealth+suffers.+So+is+it+in+Church-divisions%3A+whilst+the+parties+are+contending%2C+the+Church+suffers.+As+it+is+with+a+ship+brought+to+the+back-stays%3A+one+sail+bears+the+one+way%2C+and+another+another%3B+in+the+meantime+the+ship+stands+still.+The+wall+and+temple+of+Jerusalem+went+slowly+on+in+troublous+times.+So+will+Church+work+do%2C+wherever+schisms+and+factions+break+it.+5.+Again%2C+as+the+Church+is+disquieted+and+hindered%2C+so+endangered+by+it.%C2%B9+As+disquieted+in+the+peace+of+it%2C+and+hindered+in+the+edification+of+it%2C+so+endangered+in+the+state+of+it.+The+cutting+off+of+one+member+from+the+body+is+dangerous+to+the+whole.+What+is+the+dismembering+of+a+Church%3F+The+withdrawing+of+communion+with+it%2C+the+breaking+off+of+all+fellowship+and+communion+with+it+by+an+actual+and+positive+Separation.+Certainly%2C+this+cannot+but+endanger+the+state+of+that+Church+from+which+this+separation+is+made.+Which%2C+if+it+live+and+continue%2C+is+no+thanks+to+them+who+have+thus+withdrawn+themselves%2C+who+by+their+separation+have+done+what+in+them+lies+to+destroy+it.+Thus+is+schism+injurious+to+the+Church+of+God.+%C2%B9+Hoc+consensu+stat+et+subnixa+est+salus+Ecclesiae+%5BOn+this+agreement+the+safety+of+the+Church+stands+and+is+supported%5D%2C+Calvin+on+the+text.+Corpus+Organicum+non+potest+dissecari+quin+pariter+et+totum+et+partes+intereant+%5BAn+organic+body+cannot+be+cut+in+pieces+without+both+the+whole+and+the+parts+perishing+together%5D.+Peter+Martyr+on+the+text.%E2%80%9D%0A%0A%E2%80%94+John+Brinsley%2C+The+Arraignment+of+the+Present+Schism+of+New+Separation+in+old+England+%28London%3A+Field%2C+1646%29%2C+pp.+19-22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23b406c7ad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/23b406c7ad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=2.%20And%20as%20it%20is%20opposite,together%5D.%20Peter%20Martyr%20on%20the%20text." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-188d83d849" data-kw="">
<blockquote><p>That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.</p></blockquote>

</figure><figure class="quote" id="q-5c8d5afc64" data-kw="">
<blockquote><p>The voluntary and unnecessary dividing and separation from a true Church is schismatical. When we put bounds and partitions between it and ourselves, we sin (say some) as did these seducers here taxed by Jude. If the Church be not heretical or idolatrous, or do not by excommunication, persecution, etc. thrust us out of its communion; if it be such an one as Christ the head has communion with, we the members ought not by separation to rend and divide the body. To separate from congregations where the word of truth and Gospel of salvation are held forth in an ordinary way (1 Tim. 3:15), as the proclamations of princes are held forth upon pillars to which they are affixed; where the light of the truth is set up as upon a candlestick to guide passengers to heaven. (Rev. 1:13) To separate from them to whom belong the covenants, and where the sacraments, the seals of the Covenant, and for substance rightly dispensed, where Christ walks in the midst of his golden candlesticks, and discovers his presence in his ordinances, whereby they are made effectual to the conversion and edification of souls, in an ordinary way; where the members are saints by a professed subjection to Christ and his Gospel, and haply have promised this explicitly and openly; where there are sundry who in the judgment of charity may be conceived to have the work of grace really wrought in their hearts by walking in some measure answerable to their profession: I say to separate from these, as those with whom Church communion is not to be held and maintaind, is unwarrantable and schismatical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude (London: Maxey, 1654), on vv. 17-19</cite>, pp. 589-90</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The voluntary and unnecessary dividing and separation from a true Church is schismatical. When we put bounds and partitions between it and ourselves, we sin (say some) as did these seducers here taxed by Jude. If the Church be not heretical or idolatrous, or do not by excommunication, persecution, etc. thrust us out of its communion; if it be such an one as Christ the head has communion with, we the members ought not by separation to rend and divide the body. To separate from congregations where the word of truth and Gospel of salvation are held forth in an ordinary way (1 Tim. 3:15), as the proclamations of princes are held forth upon pillars to which they are affixed; where the light of the truth is set up as upon a candlestick to guide passengers to heaven. (Rev. 1:13) To separate from them to whom belong the covenants, and where the sacraments, the seals of the Covenant, and for substance rightly dispensed, where Christ walks in the midst of his golden candlesticks, and discovers his presence in his ordinances, whereby they are made effectual to the conversion and edification of souls, in an ordinary way; where the members are saints by a professed subjection to Christ and his Gospel, and haply have promised this explicitly and openly; where there are sundry who in the judgment of charity may be conceived to have the work of grace really wrought in their hearts by walking in some measure answerable to their profession: I say to separate from these, as those with whom Church communion is not to be held and maintaind, is unwarrantable and schismatical.”

io%2Fquote%2F5c8d5afc64.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5c8d5afc64.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=The%20voluntary%20and%20unnecessary%20dividing%20and,and%20maintaind%2C%20is%20unwarrantable%20and%20schismatical." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We must therefore know, it is not every seperation from that which is called a Church that is a note of an Antichristian spirit, but it must be known whether that were the true Church; now this Church St. John speaks of was the true Church, for it was from such whose sins were forgiven; now if it be not a true Church that they break from, it is no sign of Antichrist: 2 Chron. 11:16, such as set their hearts to seek the Lord, separated themselves from those that followed Jeroboam, and came to Jerusalem; so the apostles were fain to seperate from the Church of the Jews which persecuted Christ, and them, and so constituted a Church by themselves, a Christian Church; so then it is not a seperation from a false Church, but a true, that is a sign of an Antichristian spirit. … Use 2. It may teach us what to judge of the Separatists, or Brownists, are they of Antichrist? Surely their practise is blame-worthy: 1. Because they seperate, where Christ keeps fellowship, Rev. 1:18; and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? If they be converted, where had they their conversion? 2. Have not many of God’s servants heretofore kept company with Churches as corrupt as ours are? Did not Peter and John keep company with them and shall they be more pure and curious? 3. Christ commands: ‘If thy brother offends admonish him; if he hear thee not, take two or three more; if he hear not them, then tell it to the Church, and if he hear not the Church, let him be to thee as an heathen, or publican;’ (Mt. 18:17) but if the church hear not thy complaint, He does not say let the church be as an heathen, or publican;</p></blockquote>

<blockquote><p>18. They separate themselves from the true Churches of Christ. The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another? This schism grows into a heresy, as a serpent grows to be a dragon. This tolerated, will ruin families, tearing them all to pieces, while the husband goes to one Church, the wife to another, the son to a third, the daughter to a fourth, and the servant to an ale-house instead of a Church. This opens a gap to abundance of profaneness, when there shall be no cohabitation, but the Church members shall be scattered up and down, some twenty, some thirty, some sixty, some one hundred miles off; who shall have the inspection, teaching and guidance of these? Master [Jeremiah] Burroughs’s argument (Irenicum, ch. 23) for gathering of churches (in my judgment) is very dilute and weak; ’tis this: Because our divines hold it lawful to gather churches out of the Church of Rome: therefore ’tis lawful to gather churches out of the Church of England, q.d. because ’tis lawful to separate from a whore, therefore, we ought to separate from an honest woman also. What more ungodly sacrilege, or manstealing can there be, than to purloin from godly ministers the firstborn of their fervent prayers, and faithful preaching, the leaven of their flocks, the encouragement of their souls, the crown of their labors, and their epistle to Heaven? If men will needs gather churches out of the world (as they phrase it) let them first plow the world, and sow it, and reap it with their own hands, and then the Lord give them a liberal harvest. He is a very hard man that will reap where he has not sown, and gather where he has not strewed, Mt. 24:25. We have no precedent in the whole Book of God to gather up one church out of the cream and quintessence of many churches, as a reverend divine of ours has well observed. (Mr. [Thomas] Blake, On the Covenant, ch. 42 [p. 288]. in ••ne. V. The [Westminster] Assembly’s Answer to the Dissenting Brethren, p. 61 at the end [p. 22 in the link])</p></blockquote>

<blockquote><p>1. Separation from the true Church, and Christian society of the faithful, is a remarkable evil. 2. The schism or apostasy of others should not weaken us in following any good mean of edification, but rather stir us up unto more diligence, lest by negligence we fall piece and piece back after their example.</p></blockquote>

<blockquote><p>(2) Because the apostle is so far from commanding separation from the Church of Corinth that he praises their meetings, 1 Cor. 5:4, 1 Cor. 11:20; 14:23. This notwithstanding the many gross scandals which were among them, 1 Cor. 1:11-13; 1 Cor. 5:1-2; 15:12-13. (3) Because the apostle calls the Galatians “the Church of Christ,” “brethren,” and “the children of God,” who were yet in some measure removed from God to another Gospel. Nay, says Paul, “O foolish,” (or senseless) “Galatians, who has bewitched you,” (that is, so blinded the eyes of your understanding, that you cannot see the right truth, as the jugglers bewitch the outward eyes, that men think they see that which they see not) “that you should not obey the truth;” Gal. 3:1. And yet since it was a constituted true Church, it was his judgment there should be no separation from it, notwithstanding all the foresaid faults. (4) Because the Church of Ephesus was a true Church, though they made defection from their first love. So was the Church of Pergamus, though there were in it who held the doctrine of Balaam. So was the Church of Thyatira, notwithstanding that they suffered Jezebel, who called herself a prophetess, and taught the servants of Christ to commit fornication, and to eat things sacrificed to idols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory over Error... (d. 1663; Edinburgh: Reid, 1684), ch. 26, ‘Communion of the Saints’, question 1</cite>, pp. 258-59</span></figcaption>

<blockquote><p>§7. Differing opinions or practices about things indifferent, no nor about the mere integrals of religion [those things which complete religion and make it whole], which are not essentials, do not make men of different religions or Churches (universally considered). (Rom. 14 &amp; 15; Gal. 2:13-15; Phil. 3:16-17) §8. Nothing will warrant us to separate from a church as no church, but the want [lack] of something essential to a church. §9. The essential or constitutive parts of the Church-catholic (or universal) are Christ the Head and all Christians as the members. (Eph. 1:22 &amp; 4:15; Col. 1:18 &amp; 2:19; 1 Cor. 12:27; Eph. 4:12 &amp; 5:23; Mt. 28:19; 1 Cor. 5) … §13. He that does not nullify or unchurch a church, may lawfully remove from one church to another, and make choice of the best and purest, or that which is most suited to his own edification, if he be a free-man. §14. But in case of such choice or personal removal, the interest of the whole Church, or of religion in common, must be first taken into consideration by him that would rightly judge of the lawfulness of the fact. (Rom. 9:3; 1 Cor. 12:25-26) §15. If a Church which in all other respects is purest and best, will impose any sin upon all that will have local communion with it, though we must not separate from that Church as no Church, yet must we not commit that sin, but patiently suffer them to exclude us from their communion. (Rom. 3:8) §16. True heresy (that is, an error contradictory to an essential article of the Christian Faith) if it be seriously and really held, so that the contrary truth is not held seriously and really, does nullify the Christianity of him that holds it, and the Church-state of that congregation which so professes it. But so does not that fundamental error which is held but in words through ignorance, thinking it may consist with the contrary truth, while that truth is not denied, but held majore fide [with greater faith]; so that we have reason to believe that if they did discern the contradiction, they would rather forsake the error than the truth. (Tit. 3:10; 2 Jn. 10; Heb. 5:11-12; 1 Cor. 15:1-2, etc. Lk. 18:34; Jn. 12:16; Gal. 5:2 &amp; 1:7-9 &amp; 3:1-2; In isto factiosissimo soeculo, vix quisquam eximie doctus haereseos suspicione carebat. [In that most partisan age, scarcely anyone who was exceptionally learned was free from suspicion of heresy.] Erasmus in The Life of Jerome. Et profecto ita est, ut id habendum sit antiquissimum et Deo proximum, quod sit optimum. [And indeed it is so: that which is best must be regarded as both the most ancient and the closest to God.] Cicero, Of Laws, bk. 2, p. 244)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons of the Christian Religion, the First Part... (London: White, 1667), pt. 2, ch. 13</cite>, pp. 465-66</span></figcaption>

</figure><figure class="quote" id="q-d73f9ef76a" data-kw="">
<blockquote><p>For the work of peace, at the persuasion of some friends, he took a journey thitherward [to Lutheran Sweden], where he arrived in June, anno 1636… a resolution was taken to permit Master Dury to treat with the divines of that kingdom… to which he might address himself particularly, and lay open his intention… There he had conference both collegially and severally with the professors of divinity, who gave full assent unto his desires, and set down these conditions, upon which they were ready to agree, and join with the reformed side: 1. That a full agreement should be made in all the fundamental articles of Faith. 2. That all errors overthrowing the foundation, or tending to overthrow the same, should be condemned. 3. That in matters ceremonial and of indifferency, there should be a mutual toleration. 4. That betwixt the parties, united sincerity and uprightness should be maintained, lest ancient errors might be upheld under doubtful speeches. 5. That when peace is made, none should be suffered to maintain, excuse or spread any more the errors once condemned. 6. That ambitious and needless disputes and brabblings should be inhibited on all sides. 7. That former reproaches and injuries should be put to oblivion. 8. That the Church government should be settled according to apostolical rules. These demands the rest agreed unto, neither was any thing of moment added thereunto by any.</p></blockquote>

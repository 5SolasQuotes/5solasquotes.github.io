<blockquote><p>Speaking at a Belfast Anti-Slavery Society meeting for the visit of the Revd Henry Highland Garnet in April 1849, the Revd Isaac Nelson (PCI minister) predicted that history would favourably judge William Wilberforce for his exertions in the cause of emancipation:

The exertions of Wilberforce in the cause of slavery were lightly regarded for a time: such men as George Canning, William Pitt, and Charles James Fox were wont to look on him as a good-natured, simple, rather dogmatic, and perservering enthusiast; but history, which would judge more accurately, would give to the name a high niche in the temple of moral truth.</p></blockquote>

<blockquote><p>But what say you of the Greek Translation of the Old Testament, commonly called the Septuagint, approved by the Apostles themselves?

The same that we say of other Translations. For although the Apostles used that Translation, which was commonly received and read among the Gentiles and Jews that dwelt amongst them, where it differed not in sense from the true Hebrew: yet where it differed from it, they left it; as by many Examples may be confirmed, (Vide Hieronym. Prolog. in Mat.)</p></blockquote>

<blockquote><p>The 1859 Revival in Ulster led to uninspired hymns being brought into the worship of the Presbyterian Church in Ireland (PCI), though this was not officially sanctioned. As a Reformed Presbyterian (Covenanter) minister, the Revd Josias A. Chancellor of Bready sought to defend the biblical and confessional position. In so doing, he employed the following argument for exclusive psalmody using the basic hermeneutic of covenant theology (i.e. continuity with the Old Testament, except for abrogation in the New Testament):

[W]hen the administration of religion was changed, and carnal ordinances vanished away, we can detect no indication of change in the service of song. Baptism at once took the place of circumcision, the Passover was displaced by the Lord’s Supper, the first day of the week was observed instead of the seventh, sacrifices gradually ceased, and at length the Temple was destroyed, but there is no hint of any alteration being needed in the matter of praise, nor was there the slightest cessation of its observance. On the contrary, Christ and his Apostles continued to sing the Psalms, just as they had been sung before, and the Christian Church was commanded to keep up the exercise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-a-chancellor.html">J. A. Chancellor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lay-preaching and hymn-singing unwarranted in the Church: in reply to the Rev. F. J. Porter and Dr. Marcus Dill</cite>, (2nd edn, Londonderry, 1860), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-e4e99e40d6" data-kw="">
<blockquote><p>So much of the respect which we do owe our Neighbours. Is it not required also, that we should show mercifulness unto our beasts?

Yes. A righteous man is to regard the life of his beast. Pro. 12. 10. And all hard usage of the creatures of God is forbidden, (Deut. 22. 6, 7. and 25. 4.) yet not so much in regard of them, (1 Cor. 9. 9, 10) as that the Lord would train us forward to show mercy to our Neighbour. For it being unlawful to use the dumb creatures cruelly; it is much more unlawful to use men so.</p></blockquote>

<blockquote><p>What are the sins of Masters?

1. Unadvised entertainment of sinful Servants. 2. Negligence in not instructing them, (in the Fear of God, and in some lawful Calling) and not using Religious Exercises with them. [This refers to servants living in the master’s home – DR] 3. Not admonishing nor correcting them, or doing it in an ill manner: grieving more when they fail in their Business, than when they are slack in God’s Service; 4. Giving them an ill example, and using light behaviour before them. 5. Detaining their Wages from them; and not recompensing their Labors, by giving them a due reward, when they are with them, and when they part from them. 6. Neglect of them in Sickness: unjust stopping of their Wages for that time. 7. Not relieving them (if they be able) in their Age, who have spent their youth in their Service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A body of divinity: or, the sum and substance of Christian religion</cite>, ed. Michael Nevarr (1648; Herndon VA, 2007), p. 238.</span></figcaption>

</figure><figure class="quote" id="q-a529929750" data-kw="">
<blockquote><p>There are many promises that in gospel times magistrates shall lay out their power and exert their authority for the furtherance and preservation of the true worship of God, the profession of the faith, the worshippers and professors thereof, and therein the whole interest of Zion, Isa. i. 26, xlix. 22, 23; […] All the promises relating unto God’s providential dispensations in the world, with reference unto the interest of his church and people, do centre in this, that the rulers in and of the world shall exert and exercise their power in subserviency to the interest of Christ, which lies in his truth and his worship; which cannot be done if the power inquired after by denied, Isa. lx. 3, 11-17; Rev. xi. 15: To say, then, that the supreme magistrate, in a commonwealth of men professing the true Christian religion, ought not to exert his legislative and executive power in the defence and for the furtherance of the truth and worship of God, and for the restraint of the things that are destructive thereunto, is to say that “the promise of God is of no effect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two questions concerning the power of the supreme magistrate about religion and the worship of God, with one about tithes, proposed and resolved</cite>, (Oxford, 1659) in The works of John Owen, ed. W. H. Goold (16 vols, Edinburgh, 1967), xiii,511-12.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“There are many promises that in gospel times magistrates shall lay out their power and exert their authority for the furtherance and preservation of the true worship of God, the profession of the faith, the worshippers and professors thereof, and therein the whole interest of Zion, Isa. i. 26, xlix. 22, 23; […] All the promises relating unto God’s providential dispensations in the world, with reference unto the interest of his church and people, do centre in this, that the rulers in and of the world shall exert and exercise their power in subserviency to the interest of Christ, which lies in his truth and his worship; which cannot be done if the power inquired after by denied, Isa. lx. 3, 11-17; Rev. xi. 15: To say, then, that the supreme magistrate, in a commonwealth of men professing the true Christian religion, ought not to exert his legislative and executive power in the defence and for the furtherance of the truth and worship of God, and for the restraint of the things that are destructive thereunto, is to say that “the promise of God is of no effect.”

— John Owen, Two questions concerning the power of the supreme magistrate about religion and the worship of God, with one about tithes, proposed and resolved, (Oxford, 1659) in The works of John Owen, ed. W. H. Goold (16 vols, Edinburgh, 1967), xiii,511-12.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+are+many+promises+that+in+gospel+times+magistrates+shall+lay+out+their+power+and+exert+their+authority+for+the+furtherance+and+preservation+of+the+true+worship+of+God%2C+the+profession+of+the+faith%2C+the+worshippers+and+professors+thereof%2C+and+therein+the+whole+interest+of+Zion%2C+Isa.+i.+26%2C+xlix.+22%2C+23%3B+%5B%E2%80%A6%5D+All+the+promises+relating+unto+God%E2%80%99s+providential+dispensations+in+the+world%2C+with+reference+unto+the+interest+of+his+church+and+people%2C+do+centre+in+this%2C+that+the+rulers+in+and+of+the+world+shall+exert+and+exercise+their+power+in+subserviency+to+the+interest+of+Christ%2C+which+lies+in+his+truth+and+his+worship%3B+which+cannot+be+done+if+the+power+inquired+after+by+denied%2C+Isa.+lx.+3%2C+11-17%3B+Rev.+xi.+15%3A+To+say%2C+then%2C+that+the+supreme+magistrate%2C+in+a+commonwealth+of+men+professing+the+true+Christian+religion%2C+ought+not+to+exert+his+legislative+and+executive+power+in+the+defence+and+for+the+furtherance+of+the+truth+and+worship+of+God%2C+and+for+the+restraint+of+the+things+that+are+destructive+thereunto%2C+is+to+say+that+%E2%80%9Cthe+promise+of+God+is+of+no+effect.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Two+questions+concerning+the+power+of+the+supreme+magistrate+about+religion+and+the+worship+of+God%2C+with+one+about+tithes%2C+proposed+and+resolved%2C+%28Oxford%2C+1659%29+in+The+works+of+John+Owen%2C+ed.+W.+H.+Goold+%2816+vols%2C+Edinburgh%2C+1967%29%2C+xiii%2C511-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa529929750.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a529929750.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/11/01/john-owen-on-the-duty-of-the-christian-magistrate-to-promote-true-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>[N]ational covenanting is the fruit of genuine revival of national religion, and that in Christian lands where national covenanting is not observed there is no evidence that national religion has been really revived. Some, we are aware, speak slightingly of covenanting times, but were you to blot out from the history of Zion all the accounts of covenanting times, you would blot out from her history all the accounts of genuine revival times […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-hobart.html">Thomas Hobart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>National covenanting a national privilege: a sermon, preached in the Rev. J. Chancellor’s church, Belfast</cite>, (Perth, 1874), p. 14.</span></figcaption>

</figure><figure class="quote" id="q-5290782353" data-kw="">
<blockquote><p>Speaking before the General Assembly of the Presbyterian Church in Ireland in 1841, Henry Cooke mentioned how a period of ill-health was a providential means of leading him to embrace exclusive psalmody:

Some years ago, he had taken ill, in going to Newry, to organize the Church there. He was five or six weeks unable to reach his own home, in consequence of the occurrence which had happened to him; and, while he was lying on the bed of sickness, his mind, however, capable of thought, he then, for the first time, discovered, that hymns were not suited to the sick man; and that the psalms only were suited to the period of sickness. He could find no truth in paraphrase or hymns, at that hour. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/northern-whig.html">Northern Whig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Northern Whig</cite>, 10 July 1841.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-df824febbe" data-kw="">
<blockquote><p>In some Christian circles, it is common for people to assume that an afflicted person is being punished by God for personal sin. Although God sometimes disciplines his people to promote their sanctification (Hebrews 12:11), James Ussher points out that we must be careful of such censorious thoughts. Indeed, in his discussion of the third commandment, he goes so far as to assert that such assumptions are tantamount to taking the Lord’s name in vain. Amid a list of violations of the third commandment, he writes:

Evil thoughts towards our Brethren, which are afflicted. As when we see one visited by God, either in Body, Goods, or both; we are always read to think the worse of him; viz. that God executeth these Punishments on him for his sin. When as God may do it either to exercise the Faith and Patience of the Party afflicted, as in Job; or to stir others to Compassion and Pity; or else to set forth his own Glory, as we may see verified in the Example of the blind Man in the Gospel, John 9. 2, 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: or, The Sum and Substance of Christian Religion</cite>, ed. Michael Nevarr (1648; Herndon VA: Solid Ground Christian Books, 2007), p. 216.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship.html">Worship</a></span></div>

<blockquote><p>James Dick gives political conservatives some schooling on the pernicious nature of national constitutions that do not recognise Christ’s Lordship:‎

[A] national constitution if it be not according to the will of Christ, is, notwithstanding verbal professions to the contrary, at variance with His will, and so, being shaped in rebellion against Him and in rejection of the wise principles of His kingdom, it leads to rebellion and to the casting off, one by one, of the cords of His authority, which national traditions or national sentiment may have for a time retained.</p></blockquote>

</figure><figure class="quote" id="q-95eb173783" data-kw="">
<blockquote><p>It has sometimes been thought that the church can be established without the tithe being enforced. John Owen, on the other hand, argues to the contrary in the extract below. This is taken from a short tract in volume thirteen of Dr Owen’s works; it would be well-worth everyone’s time reading it (especially as it is only a few pages long):

Wherever, or in what nation soever, there hath been a removal of the maintenance provided in the providence of God for the necessary supportment of the public dispensers of the word, the issue hath been a fatal and irrecoverable disadvantage to the gospel and interest of Christ in those nations […] to take away the public maintenance provided in the good providence of God for the public dispensers of the gospel, upon pretences of present inconvience or promise of future provision, is a contempt of the care and faithfulness of God towards his church, and, in plain terms, downright robbery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two questions concerning the power of the supreme magistrate about religion and the worship of God, with one about tithes, proposed and resolved</cite>, (Oxford, 1659) in The works of John Owen, ed. W. H. Goold (16 vols, Edinburgh, 1967), xiii, 515-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/worship.html">Worship</a></span></div>

Wherever, or in what nation soever, there hath been a removal of the maintenance provided in the providence of God for the necessary supportment of the public dispensers of the word, the issue hath been a fatal and irrecoverable disadvantage to the gospel and interest of Christ in those nations […] to take away the public maintenance provided in the good providence of God for the public dispensers of the gospel, upon pretences of present inconvience or promise of future provision, is a contempt of the care and faithfulness of God towards his church, and, in plain terms, downright robbery.”

lank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>So much of the Parts of God’s Worship prescribed, together with the right use and abuse thereof. What say you of such Forms of Worship as are not prescribed by God in his Word?

We are commanded to serve God, not according to the Traditions of Men, but according to his Will revealed in the Scripture, Col. 2. 18, Mat. 15. 9.

What followeth hereupon?

That no Power must be admitted in the Church to prescribe other Forms of Worship, not appointed by God himself in his Word.</p></blockquote>

<blockquote><p>I am currently reading through the famous Decades of the Swiss Reformer, Henry Bullinger. Since Bullinger’s writings had a significant impact upon English Protestantism, they are a crucial source for understanding the theoretical framework in which the Westminster Confession was written. Although I have many more quotes from Bullinger to post, here is one that I read today:

The law of the Lord, published by the ministry of Moses, doth in the eighteenth and twentieth of Leviticus reckon up a beadrow long enough of offences as are to be punished. And lest perhaps any man think, that at this day that which Moses hath rehearsed is utterly abolished, let him give ear to St Paul, who saith: “To the just the law is not given, but to the unjust, and to sinners, to unholy and unclean, to murderers of fathers and murderers of mothers, to manslayers, to whore-mongers, to them that defile themselves with mankind, to manstealers, to liars, to perjured men, and if there by any other thing contrary to sound doctrine.” [1 Timothy 1:9-10] But apostates, idolaters, blasphemers, heretics, false teachers, and mockers of religion, do offend against the laws of religion, (and therefore ought they to be punished by the magistrate’s authority.)</p></blockquote>

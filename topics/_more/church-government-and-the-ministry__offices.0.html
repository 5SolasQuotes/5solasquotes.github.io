</figure><figure class="quote" id="q-23bfc6ed0e" data-kw="">
<blockquote><p>There remains to speak of the widows which were godly, poor, women in the church above the age of 60 years for the avoiding of all suspicion of evil which might rise by slanderous tongues if they had been younger (1 Tim. 5:9). These, as they were nourished at the charges of the church, being poor, so did they serve the church in attending upon poor strangers and the poor which were sick in the church, whereof they were widows. Now although there is not so great use of these widows with us as there was in those places where the churches were first founded and in that time wherein this order of widows was instituted, part of the which necessity grew both by the multitude of strangers through the persecution and by the great heat of those East countries, whereupon the washing and supplyng of their feet was required: yet for so much as there are poor which are sick in every church, I do not see how a better and more convenient order can be devised for the attendance of them in their sickness and other infirmities than this which St. Paul appoints that there should be (if there can be any gotten) godly, poor widows, of the age which St. Paul appoints, which should attend upon such. For if there be any such poor widows of that age destitute of all friends, it is manifest that they must needs live of the charge of the church, and seing they must needs do so, it is better they should do some duty for it unto the church again than the church should be at a new charge to find others to attend upon those which are sick and destitute of keepers, seeing that there can be none so fit for that purpose as those women which St. Paul does there describe: so that I conclude that (if such may be gotten) we ought also to keep that order of widows in the church still. I know that there be learned men which think otherwise, but I stand upon the authority of God’s Word and not upon the opinions of men be they never so well learned. And if the matter also should be tried by the judgement of men I am able to show the judgment of as learned as this age has brought forth which think that the institution of widows is perpetual and ought to be where it may be had and where such widows are found. Indeed they are more rare now than in the apostles’ times: For then by reason of the persecution those which had the gift of continency did abstain from marriage after the death of their husbands for that the sole life was an easier estate and less dangerous and chargeable when they were driven to fly than the estate of those which were married.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the</cite>, [Presbyterian] Admonition to the Parliament (1573) | ‘To the sections beginning in the 118th page and holding on until the 123rd page’, pp. 191-2</span></figcaption>

</figure><figure class="quote" id="q-a57c628b10" data-kw="">
<blockquote><p>After he [Cartwright’s opponent] says that ‘those words cannot be extended unto all the precepts,’ first because, ‘the office of widows should be then necessary:’ But he does not consider that St. Paul ordains them not simply, but upon condition. If he [Paul] had instituted the eldership with condition, if he had ordained that office [of elder] rather for the maintenance of the persons themselves than for the service of the church, if he had left so small choice of those to this office, as to that, namely that none might be chosen but poor, none but destitute of all friends, none under the age of sixty years: then he [the opponent] had said somewhat. And even now the perpetuity of that commandment touching widows remains in that sort [as] it was given: that is upon condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, (1577), ‘That the Church Government by an Eldership in Every Congregation is by the Ordinance of God &amp; Perpetual’, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-d3a2f6b573" data-kw="">
<blockquote><p>‘He that shows mercy, let him do it with cheerfulness.’ And this seems to have been the office of widows and of old men, which were to that end maintained by the Church, that they should take care of strangers and of them that were sick. For good cause he commands these to have cheerfulness. For men that be weak and afflicted, are much relieved if they see their necessities are ministered unto with cheerfulness… Thus much spake Paul concerning the public ministries of the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, … (London, 1583), pt. 4, ch.1, ‘Of Diverse Ministries of the Church’, p. 8 on Rom. 12:8</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘He that shows mercy, let him do it with cheerfulness.’ And this seems to have been the office of widows and of old men, which were to that end maintained by the Church, that they should take care of strangers and of them that were sick. For good cause he commands these to have cheerfulness. For men that be weak and afflicted, are much relieved if they see their necessities are ministered unto with cheerfulness… Thus much spake Paul concerning the public ministries of the Church…”

</figure><figure class="quote" id="q-c9aad96bec" data-kw="">
<blockquote><p>2. By ‘ministry’, called [Greek]… thereby generally are understood such offices as concerned the discipline of the Church: specially conversant about the body and temporal things, either to relieve their poverty, which was the office of deacons in the distribution of alms, or to cherish them in sickness, which was the charge of widows, whose office St. Paul describes, 1 Tim. 5, or to watch over their manners, which belonged unto the spiritual governors. … 6. ‘He that shows mercy’. 1. Some do understand this generally of all Christians, that they should give chearfully: as Chrysostom will have it the same with that precept, 2 Cor. 9:7, ‘he that soweth sparingly, shall reap sparingly:’ Theodoret, Haymo: but the apostle here speaks of the special offices of the Church. … 5. But their opinion is rather here to be approved which in the first place take the office of deacons to be described, such as were elected by the apostles, Acts 6, and here the office of such, as were assigned to have a care of strangers, exiles, the sick, such were the widows, whom St. Paul would not have chosen under 60 years, 1 Tim. 5. Thus Calvin, Beza, Martyr, Gualter, Faius, Pareus, with others. Now this showing of mercy: …3. such special works of mercy then are here understood, which belonged to the curing and attending upon the sick, aged, impotent, strangers, exiles, orphans, Pareus. 4. ‘with chearefulnes of heart’, gentleness in words, pleasantness of countenance: for all those are signified by hilarity or cheerfulness, Tolet: so Chrysostom… 3. again, such as were employed in these services, as old men and widows, are naturally given to morosity, and therefore they have need of this precept to dispose themselves to cheerfulness, Pareus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … (Cambridge, 1611), Biblical Exegesis, ch. 12, 3. ‘The Questions &amp; Doubts Discussed’, 16th Question, ‘Of these several offices here rehearsed by the apostle in particular’, pp. 546 &amp; 548-9 on Rom., 12:7-8</span></figcaption>

+of+heart%E2%80%99%2C+gentleness+in+words%2C+pleasantness+of+countenance%3A+for+all+those+are+signified+by+hilarity+or+cheerfulness%2C+Tolet%3A+so+Chrysostom%E2%80%A6+3.+again%2C+such+as+were+employed+in+these+services%2C+as+old+men+and+widows%2C+are+naturally+given+to+morosity%2C+and+therefore+they+have+need+of+this+precept+to+dispose+themselves+to+cheerfulness%2C+Pareus.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+Hexapla%2C+that+is%2C+a+Six-fold+Commentary+upon+the+Most+Divine+Epistle+of+the+Holy+Apostle%2C+St.+Paul+to+the+Romans%E2%80%A6+%28Cambridge%2C+1611%29%2C+Biblical+Exegesis%2C+ch.+12%2C+3.+%E2%80%98The+Questions+%26+Doubts+Discussed%E2%80%99%2C+16th+Question%2C+%E2%80%98Of+these+several+offices+here+rehearsed+by+the+apostle+in+particular%E2%80%99%2C+pp.+546+%26+548-9+on+Rom.%2C+12%3A7-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9aad96bec.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c9aad96bec.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-office-of-widows-the-churchs-ministry-to-the-needy/#:~:text=2.%20By%20%E2%80%98ministry%E2%80%99%2C%20called%20%5BGreek,to%20dispose%20themselves%20to%20cheerfulness%2C%20Pareus&amp;text=2.%20By%20%E2%80%98ministry%E2%80%99%2C%20called%20%5BGreek&amp;text=this%20precept%20to%20dispose%20themselves%20to%20cheerfulness%2C%20Pareus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1a4b24394f" data-kw="">
<blockquote><p>…though it be ordinarily most convenient that the office of attending the sick be committed to women, yet it is not essentially necessary to the office: And as Aretius notes upon the place (Common Places, class 4, ch. 1, p. 746), we may under [Greek] comprehend not only widows appointed to attend the sick, but old men appointed to receive and entertain strangers: Which is also judiciously observed by [Peter] Martyr. Besides, when the apostle, 1 Tim. 5, teaches what is required in widows, who should be made diaconesses, this he requires among other things, that they be not such as live in pleasures and idleness, and take not care to provide for their own houses, verse 6,8, [Greek], which though Erasmus and Beza turn in the feminine, quod si qua, yet our English translators, and many good interpreters, turn it in the masculine. And surely it shall have more weight if it agree to men as well as women, says Calvin upon that place. Now they who read in the masculine, that which the apostle says there of widows, will not, we suppose, blame us for reading, Rom. 12:8 in the masculine also, ‘He that sheweth mercie’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, … (Edinburgh, 1641), pt. 1, ch. 5, on Rom. 12:8, pp. 38-9</span></figcaption>

<blockquote><p>Diverse resolve that text [Rom. 12:6-7] thus, that first the apostle makes a general division of ecclesiastical offices, ‘prophesy’, comprehending these that labour in the Word and doctrine; ‘ministry’ comprehending those that labor not in the Word and doctrine… Ministry, he subdivides into the office of the ruling elder, deacon, and the other of showing mercy, which was committed sometimes to old men, sometimes to widows.</p></blockquote>

</figure><figure class="quote" id="q-4f39f09a43" data-kw="">
<blockquote><p>Question 9: How is it that you have taken away widows, which was an office established by the apostles? Rom. 12:8. For some say they should be gone, because they were temporary, and the heat of the Eastern countries which caused sickness, required them; but they are not needful now. So says [Thomas] Cartwright. Others make them perpetual, as Fenner; some make them to be women, as Cartwright, some men, as [Walter] Travers, some neither men nor women only, as Beza and Junius. Answer: The perpetual use of that office we think continues, that is, that there be some to show mercy on the poor, which are captives, exiled, strangers, diseased, distracted, and that there be hospitals for that effect, and surgeons, physicians, aged men and women; But that widows were officers in the Church, as elders and deacons are, we think no; but that that service may be performed by men or women, as the Church shall think good. Cartwright thinks no other than what I say. Fenner thinks well that the sick should always be cared for, neither by men only, nor by women only, as Beza and Junius think, but by both as need requires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 19, pp. 293-4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-9b84dda9a4" data-kw="">
<blockquote><p>For the choosing of widows that are poor to take care of the poor and sick in hospitals, we think it just as necessary now as then, though no ways if there be none sick and poor in the Church: But that widows were Church-officers ordained, as were deacons, Acts 6:6, we never thought, and therefore we do not see that the wanting [lacking] of such widows, is the want of a positive institution of Church-policy; for other positive things of policy that should be of perpetual use, and not all of the same kind, and of equal necessity: I see no reason (which I speak for apostles) which were necessary then, and not now;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (London, 1646), Introduction, p. 12</span></figcaption>

</figure><figure class="quote" id="q-b37e71ce3b" data-kw="">
<blockquote><p>To the deacon you [the congregationalists] added the church-widow as a distinct officer, and as necessary for the perpetual government of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, … (London, 1644), p. 92</span></figcaption>

</figure><figure class="quote" id="q-e6d28ea5c4" data-kw="">
<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan, or a Treatise Against Toleration &amp; Pretended Liberty of Conscience</cite>, … (London, 1647), 17th thesis, p. 76</span></figcaption>

</figure><figure class="quote" id="q-3143010d1a" data-kw="">
<blockquote><p>17. It having been the custom of the Church in the apostles’ days, to have ordinarily many officers in a Church, and the private part of the ministerial duty being so exceeding great and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases where more may be had, we therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls and greatness of the Word; And if for want [lack] of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober, orthodox, judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning and less able to publicly teach, and who may leave public speaking to him that is more able and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“17. It having been the custom of the Church in the apostles’ days, to have ordinarily many officers in a Church, and the private part of the ministerial duty being so exceeding great and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases where more may be had, we therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls and greatness of the Word; And if for want [lack] of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober, orthodox, judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning and less able to publicly teach, and who may leave public speaking to him that is more able and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments…”

<blockquote><p>VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes.</p></blockquote>

<blockquote><p>12. There was in the primitive times an ecclesiastical order of widows, which St. Paul mentions, 1 Tim. 5, whose whole ministry was devoted to charity. They were indeed of the poorer sort, fit rather to receive than give alms; yet the less they could do with their purses, the more was required of their persons: the humbler offices of washing the saints feet, the careful task of bringing up children, and a diligent attendance on every good work. And sure there is parity of reason that those who upon the score of their wealth, exempt themselves from those laborious services should commute for it by more liberal alms. In the warmth and zeal of Christianity, women of the higest quality performed both sorts of charity, forgot their greatness in their condescensions, yet assumed it again in their bounty; founded hospitals, and yet with a labor of love, as the apostle styles it, Heb. 6:10, disdained not sometimes to serve in them. But these are examples not like[ly] to be transcribed in our days: greatness is now grown to such an unwieldiness that it cannot stoop though to the most Christian offices, and yet can as little soar up in any munificent charities: it stands like Nebuchadnezzar’s golden image: a vast bulk only to be adored.</p></blockquote>

<blockquote><p>4. Christ to provide for his flock has taken another course than to authorize bishops and pastors [which Corbet takes to be one office] to do their work by delegates, namely, to command the ordaining of more bishops or elders as need requires. … But I do not question, but a bishop may have an assistant or assistants of his own order, either occasionally in case of present disability or justifiable avocation; or statedly when the flock that is under his personal oversight requires more work than one man can do. And then the said assistants are not his vicars, but colleagues, performing each of them their own part in the work and service of their Lord Christ.</p></blockquote>

<blockquote><p>If Paul is not referring to the wives of elders and deacons, and is not referring to women deacons in the same office as men deacons, then… The most logical and natural alternative would be to regard ‘women’ as referring to the servant-widow class that assists the deacons by ministering to the needs of women. [Hendricksen:] ‘… he regards these women as the deacons’ assistants in helping the poor and needy, etc. These are women who render auxiliary service, performing ministries for which women are better adapted…’… The interpretation of 1 Timothy 3:11 as referring to ‘women’ who assist the deacons who belong to the order of widows described in 1 Timothy 5:9ff. is also exegetically superior to the ‘women in the same office’ view when the broader contextual matters are considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>II. ‘The Biblical Evidence’</cite>, pp. 57-62 in A Historical &amp; Biblical Examination of Women Deacons, pp. 60-61</span></figcaption>

<blockquote><p>The question that remains to be answered is: are these widows placed on a list in order to receive aid or in order to serve the church? All the evidence indicates that what Paul clearly had in mind was an order of widows set apart in order to serve the church. There are a number of reasons why this interpretation is superior.</p></blockquote>

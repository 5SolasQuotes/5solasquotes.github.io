</figure><figure class="quote" id="q-23bfc6ed0e" data-kw="">
<blockquote><p>There remains to speak of the widows which were godly, poor, women in the church above the age of 60 years for the avoiding of all suspicion of evil which might rise by slanderous tongues if they had been younger (1 Tim. 5:9). These, as they were nourished at the charges of the church, being poor, so did they serve the church in attending upon poor strangers and the poor which were sick in the church, whereof they were widows. Now although there is not so great use of these widows with us as there was in those places where the churches were first founded and in that time wherein this order of widows was instituted, part of the which necessity grew both by the multitude of strangers through the persecution and by the great heat of those East countries, whereupon the washing and supplyng of their feet was required: yet for so much as there are poor which are sick in every church, I do not see how a better and more convenient order can be devised for the attendance of them in their sickness and other infirmities than this which St. Paul appoints that there should be (if there can be any gotten) godly, poor widows, of the age which St. Paul appoints, which should attend upon such. For if there be any such poor widows of that age destitute of all friends, it is manifest that they must needs live of the charge of the church, and seing they must needs do so, it is better they should do some duty for it unto the church again than the church should be at a new charge to find others to attend upon those which are sick and destitute of keepers, seeing that there can be none so fit for that purpose as those women which St. Paul does there describe: so that I conclude that (if such may be gotten) we ought also to keep that order of widows in the church still. I know that there be learned men which think otherwise, but I stand upon the authority of God’s Word and not upon the opinions of men be they never so well learned. And if the matter also should be tried by the judgement of men I am able to show the judgment of as learned as this age has brought forth which think that the institution of widows is perpetual and ought to be where it may be had and where such widows are found. Indeed they are more rare now than in the apostles’ times: For then by reason of the persecution those which had the gift of continency did abstain from marriage after the death of their husbands for that the sole life was an easier estate and less dangerous and chargeable when they were driven to fly than the estate of those which were married.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the</cite>, [Presbyterian] Admonition to the Parliament (1573) | ‘To the sections beginning in the 118th page and holding on until the 123rd page’, pp. 191-2</span></figcaption>

</figure><figure class="quote" id="q-a57c628b10" data-kw="">
<blockquote><p>After he [Cartwright’s opponent] says that ‘those words cannot be extended unto all the precepts,’ first because, ‘the office of widows should be then necessary:’ But he does not consider that St. Paul ordains them not simply, but upon condition. If he [Paul] had instituted the eldership with condition, if he had ordained that office [of elder] rather for the maintenance of the persons themselves than for the service of the church, if he had left so small choice of those to this office, as to that, namely that none might be chosen but poor, none but destitute of all friends, none under the age of sixty years: then he [the opponent] had said somewhat. And even now the perpetuity of that commandment touching widows remains in that sort [as] it was given: that is upon condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, (1577), ‘That the Church Government by an Eldership in Every Congregation is by the Ordinance of God &amp; Perpetual’, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<blockquote><p>‘He that shows mercy, let him do it with cheerfulness.’ And this seems to have been the office of widows and of old men, which were to that end maintained by the Church, that they should take care of strangers and of them that were sick. For good cause he commands these to have cheerfulness. For men that be weak and afflicted, are much relieved if they see their necessities are ministered unto with cheerfulness… Thus much spake Paul concerning the public ministries of the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, II.2.26, … (London, 1583), pt. 4, ch.1, ‘Of Diverse Ministries of the Church’, p. 8 on Rom. 12:8</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-c9aad96bec" data-kw="">
<blockquote><p>2. By ‘ministry’, called [Greek]… thereby generally are understood such offices as concerned the discipline of the Church: specially conversant about the body and temporal things, either to relieve their poverty, which was the office of deacons in the distribution of alms, or to cherish them in sickness, which was the charge of widows, whose office St. Paul describes, 1 Tim. 5, or to watch over their manners, which belonged unto the spiritual governors. … 6. ‘He that shows mercy’. 1. Some do understand this generally of all Christians, that they should give chearfully: as Chrysostom will have it the same with that precept, 2 Cor. 9:7, ‘he that soweth sparingly, shall reap sparingly:’ Theodoret, Haymo: but the apostle here speaks of the special offices of the Church. … 5. But their opinion is rather here to be approved which in the first place take the office of deacons to be described, such as were elected by the apostles, Acts 6, and here the office of such, as were assigned to have a care of strangers, exiles, the sick, such were the widows, whom St. Paul would not have chosen under 60 years, 1 Tim. 5. Thus Calvin, Beza, Martyr, Gualter, Faius, Pareus, with others. Now this showing of mercy: …3. such special works of mercy then are here understood, which belonged to the curing and attending upon the sick, aged, impotent, strangers, exiles, orphans, Pareus. 4. ‘with chearefulnes of heart’, gentleness in words, pleasantness of countenance: for all those are signified by hilarity or cheerfulness, Tolet: so Chrysostom… 3. again, such as were employed in these services, as old men and widows, are naturally given to morosity, and therefore they have need of this precept to dispose themselves to cheerfulness, Pareus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … (Cambridge, 1611), Biblical Exegesis, ch. 12, 3. ‘The Questions &amp; Doubts Discussed’, 16th Question, ‘Of these several offices here rehearsed by the apostle in particular’, pp. 546 &amp; 548-9 on Rom., 12:7-8</span></figcaption>

</figure><figure class="quote" id="q-1a4b24394f" data-kw="">
<blockquote><p>…though it be ordinarily most convenient that the office of attending the sick be committed to women, yet it is not essentially necessary to the office: And as Aretius notes upon the place (Common Places, class 4, ch. 1, p. 746), we may under [Greek] comprehend not only widows appointed to attend the sick, but old men appointed to receive and entertain strangers: Which is also judiciously observed by [Peter] Martyr. Besides, when the apostle, 1 Tim. 5, teaches what is required in widows, who should be made diaconesses, this he requires among other things, that they be not such as live in pleasures and idleness, and take not care to provide for their own houses, verse 6,8, [Greek], which though Erasmus and Beza turn in the feminine, quod si qua, yet our English translators, and many good interpreters, turn it in the masculine. And surely it shall have more weight if it agree to men as well as women, says Calvin upon that place. Now they who read in the masculine, that which the apostle says there of widows, will not, we suppose, blame us for reading, Rom. 12:8 in the masculine also, ‘He that sheweth mercie’…</p></blockquote>

<blockquote><p>Diverse resolve that text [Rom. 12:6-7] thus, that first the apostle makes a general division of ecclesiastical offices, ‘prophesy’, comprehending these that labour in the Word and doctrine; ‘ministry’ comprehending those that labor not in the Word and doctrine… Ministry, he subdivides into the office of the ruling elder, deacon, and the other of showing mercy, which was committed sometimes to old men, sometimes to widows.</p></blockquote>

</figure><figure class="quote" id="q-4f39f09a43" data-kw="">
<blockquote><p>Question 9: How is it that you have taken away widows, which was an office established by the apostles? Rom. 12:8. For some say they should be gone, because they were temporary, and the heat of the Eastern countries which caused sickness, required them; but they are not needful now. So says [Thomas] Cartwright. Others make them perpetual, as Fenner; some make them to be women, as Cartwright, some men, as [Walter] Travers, some neither men nor women only, as Beza and Junius. Answer: The perpetual use of that office we think continues, that is, that there be some to show mercy on the poor, which are captives, exiled, strangers, diseased, distracted, and that there be hospitals for that effect, and surgeons, physicians, aged men and women; But that widows were officers in the Church, as elders and deacons are, we think no; but that that service may be performed by men or women, as the Church shall think good. Cartwright thinks no other than what I say. Fenner thinks well that the sick should always be cared for, neither by men only, nor by women only, as Beza and Junius think, but by both as need requires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 19, pp. 293-4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-9b84dda9a4" data-kw="">
<blockquote><p>For the choosing of widows that are poor to take care of the poor and sick in hospitals, we think it just as necessary now as then, though no ways if there be none sick and poor in the Church: But that widows were Church-officers ordained, as were deacons, Acts 6:6, we never thought, and therefore we do not see that the wanting [lacking] of such widows, is the want of a positive institution of Church-policy; for other positive things of policy that should be of perpetual use, and not all of the same kind, and of equal necessity: I see no reason (which I speak for apostles) which were necessary then, and not now;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (London, 1646), Introduction, p. 12</span></figcaption>

</figure><figure class="quote" id="q-b37e71ce3b" data-kw="">
<blockquote><p>To the deacon you [the congregationalists] added the church-widow as a distinct officer, and as necessary for the perpetual government of the Church.</p></blockquote>

</figure><figure class="quote" id="q-e6d28ea5c4" data-kw="">
<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan</cite>, … (London, 1647), 17th thesis, p. 76</span></figcaption>

<blockquote><p>17. It having been the custom of the Church in the apostles’ days, to have ordinarily many officers in a Church, and the private part of the ministerial duty being so exceeding great and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases where more may be had, we therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls and greatness of the Word; And if for want [lack] of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober, orthodox, judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning and less able to publicly teach, and who may leave public speaking to him that is more able and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“17. It having been the custom of the Church in the apostles’ days, to have ordinarily many officers in a Church, and the private part of the ministerial duty being so exceeding great and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases where more may be had, we therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls and greatness of the Word; And if for want [lack] of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober, orthodox, judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning and less able to publicly teach, and who may leave public speaking to him that is more able and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments…”

<blockquote><p>VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes.</p></blockquote>

<blockquote><p>12. There was in the primitive times an ecclesiastical order of widows, which St. Paul mentions, 1 Tim. 5, whose whole ministry was devoted to charity. They were indeed of the poorer sort, fit rather to receive than give alms; yet the less they could do with their purses, the more was required of their persons: the humbler offices of washing the saints feet, the careful task of bringing up children, and a diligent attendance on every good work. And sure there is parity of reason that those who upon the score of their wealth, exempt themselves from those laborious services should commute for it by more liberal alms. In the warmth and zeal of Christianity, women of the higest quality performed both sorts of charity, forgot their greatness in their condescensions, yet assumed it again in their bounty; founded hospitals, and yet with a labor of love, as the apostle styles it, Heb. 6:10, disdained not sometimes to serve in them. But these are examples not like[ly] to be transcribed in our days: greatness is now grown to such an unwieldiness that it cannot stoop though to the most Christian offices, and yet can as little soar up in any munificent charities: it stands like Nebuchadnezzar’s golden image: a vast bulk only to be adored.</p></blockquote>

<blockquote><p>4. Christ to provide for his flock has taken another course than to authorize bishops and pastors [which Corbet takes to be one office] to do their work by delegates, namely, to command the ordaining of more bishops or elders as need requires. … But I do not question, but a bishop may have an assistant or assistants of his own order, either occasionally in case of present disability or justifiable avocation; or statedly when the flock that is under his personal oversight requires more work than one man can do. And then the said assistants are not his vicars, but colleagues, performing each of them their own part in the work and service of their Lord Christ.</p></blockquote>

</figure><figure class="quote" id="q-10d875f233" data-kw="">
<blockquote><p>If Paul is not referring to the wives of elders and deacons, and is not referring to women deacons in the same office as men deacons, then… The most logical and natural alternative would be to regard ‘women’ as referring to the servant-widow class that assists the deacons by ministering to the needs of women. [Hendricksen:] ‘… he regards these women as the deacons’ assistants in helping the poor and needy, etc. These are women who render auxiliary service, performing ministries for which women are better adapted…’… The interpretation of 1 Timothy 3:11 as referring to ‘women’ who assist the deacons who belong to the order of widows described in 1 Timothy 5:9ff. is also exegetically superior to the ‘women in the same office’ view when the broader contextual matters are considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>II. ‘The Biblical Evidence’</cite>, pp. 57-62 in A Historical &amp; Biblical Examination of Women Deacons, pp. 60-61</span></figcaption>

</figure><figure class="quote" id="q-ab52f3e053" data-kw="">
<blockquote><p>The question that remains to be answered is: are these widows placed on a list in order to receive aid or in order to serve the church? All the evidence indicates that what Paul clearly had in mind was an order of widows set apart in order to serve the church. There are a number of reasons why this interpretation is superior.</p></blockquote>

<blockquote><p>This we are taught by the rites of the old Testament, where, by God’s commandment, Aaron and his children were openly chosen into the holy ministry, all the people looking on. Neither let it trouble us, that Paul seemeth to give authority to Titus and Timothy to choose Bishops. For he would not have them of their private authority to do anything, but according to the duty of Superintendents, to take heed that such as were worthy and meet, might be chosen for Ministers. And it is not likely, that they had more granted to them, than the Apostles had, which without the Church’s counsel, would never do anything in this matter. For not long after they chose Deacons openly before the congregation, and Paul and Barnabas by election ordained Elders in every congregation.</p></blockquote>

</figure><figure class="quote" id="q-253f7302b3" data-kw="">
<blockquote><p>In Scripture the term bishop signifies exactly the same thing as elder, whether he is only an elder or even a pastor. I will strive to confirm this from several testimonies of sacred Scripture brought forth into our midst. Titus 1:5 says, “For the sake of this matter, remain in Crete, so that you may proceed to set in order what remains there, and establish elders town-by-town.” Then, describing what sort of men they should be, he says, “it is necessary that an elder be blameless,” et cetera. In Acts 20:17ff. Paul is said to have summoned to Miletus Ephesian elders, whom he then addresses in this way: “Attend to yourselves and to the whole flock, for which the Holy Spirit has established you as elders.” Note there in passing that it is not said that they are elders because they preside over the presbytery, but because they preside over their flock.

Philippians 1:1 says, “Paul and Timothy, servants of Jesus Christ to all the saints in Christ Jesus who are at Philippi, together with the elders and deacons.” He calls bishops elders. Indeed, Chrysostom, writing on this passage, says, “What belongs to the matter of whether there were bishops of the same city? It is not,” he says, “but that those who were then elders, the same were bishops.” In 1 Peter 5:2 Peter, compelling elders, says, “Feed the flock which is in your possession, elders [ἐπισκοποῦντες].” Finally, in this passage Paul, recounting all the orders of the ministers of the Word, says nothing about bishops as different from pastors. And Ambrose observed that when he wrote on this passage. He says, “the writings of the apostle do not agree in all ways with the ordering of the church which exists now.”

What is more, no Scripture speaks or means otherwise about bishops. And daily experience teaches that this kind of men, who are ambitious and enslaved to their stomach, make shipwreck of their conscience. The antichrist introduced the origin from this foundation and human invention, as it were, which God never blessed in His Word. They appoint the bishop as overseer over the presbytery for the sake of removing schism. But is it the case that I may say nothing from contrary experience, which Gregory of Nazianzus says to this response in Oratio in Maxim? He says, “Would that there may be no prerogative of a throne! But now this right side and left and middle, superior and inferior seats and that imported custom of going before or of coming over the same rank have broken us into many parts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey B. Carmichael, Classic Reformed Theology, vol. 5 (1593; Kindle edn, Grand Rapids MI: Reformation Heritage Books, 2021), Kindle Locations 2901-2919.</span></figcaption>

</figure><figure class="quote" id="q-ad225e2abd" data-kw="">
<blockquote><p>Elders not teaching but governing are distinguished from pastors or teaching elders. The institution of those is divine because Christ commanded that one or two more prudent be summoned for the refutation of the brother sinning, and the church for those who have not listened—that is, “more” (πλείονας) should be approached (2 Cor. 2:6; Matt. 18:16, etc.). “Having gifts … whether ministry by ministering or teaching by teaching,” and “the one who leads (ὁ προϊστάμενος) leading with devotion” (Rom. 12:6–8).

Elsewhere “those administering” (κυβερνήσεις) are mentioned as distinct from those teaching (1 Cor. 12:28). Paul above all makes this point clearly: “Those who lead, elders, are worthy of double honour, especially those who labour in word and teaching” (1 Tim. 5:17). Their office agrees with the office of pastors, except that they neither teach nor dispense the sacraments. They rule the church concerning another common counsel, and “presiding over” (περιοδευταὶ) (Ezek. 39:14), they surround and watch over all and exercise refutation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), XXVII.VIII, Kindle Locations 4307-4315.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-c16e0973c9" data-kw="">
<blockquote><p>It seems to be solidly argued from 1 Tim. v. 17. that there were in the primitive church some elders, who did not use to preach: nothing very express is said concerning them: only it seems to be intimated James v. 14. that they prayed with the flock. It may be very expedient, even on the principles of human prudence, to appoint some of the more grave and honourable members of the society to join with the pastor in the over-sight of it, who may constitute a kind of council with him, to deliberate of affairs in which the society is concerned, and prepare them for being brought before the church for its decision, to pray with the sick, to reconcile differences, &amp;c.

[B]ut there does not seem any sufficient warrant for making them a kind of judicatory, to whose decisions the rest of the society is to submit; and those rules relating to presbyteries, classes, provincials, and general assemblies, which are determined by the constitution of the church of Scotland, most evidently appear to be at best merely matters of human discretion, and to have no express foundation in the word of God; nor can we trace the existence of such ruling elders higher than Constantine’s time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/philip-doddridge.html">Philip Doddridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Lectures on the Principal Subjects in Pneumatology, Ethics, and Divinity</cite>, (London: J. Buckland, 1763), Proposition CL, Scholium 5, pp 522-23.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“It seems to be solidly argued from 1 Tim. v. 17. that there were in the primitive church some elders, who did not use to preach: nothing very express is said concerning them: only it seems to be intimated James v. 14. that they prayed with the flock. It may be very expedient, even on the principles of human prudence, to appoint some of the more grave and honourable members of the society to join with the pastor in the over-sight of it, who may constitute a kind of council with him, to deliberate of affairs in which the society is concerned, and prepare them for being brought before the church for its decision, to pray with the sick, to reconcile differences, &amp;c.

[B]ut there does not seem any sufficient warrant for making them a kind of judicatory, to whose decisions the rest of the society is to submit; and those rules relating to presbyteries, classes, provincials, and general assemblies, which are determined by the constitution of the church of Scotland, most evidently appear to be at best merely matters of human discretion, and to have no express foundation in the word of God; nor can we trace the existence of such ruling elders higher than Constantine’s time.”

— Philip Doddridge, A Course of Lectures on the Principal Subjects in Pneumatology, Ethics, and Divinity, (London: J. Buckland, 1763), Proposition CL, Scholium 5, pp 522-23.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+seems+to+be+solidly+argued+from+1+Tim.+v.+17.+that+there+were+in+the+primitive+church+some+elders%2C+who+did+not+use+to+preach%3A+nothing+very+express+is+said+concerning+them%3A+only+it+seems+to+be+intimated+James+v.+14.+that+they+prayed+with+the+flock.+It+may+be+very+expedient%2C+even+on+the+principles+of+human+prudence%2C+to+appoint+some+of+the+more+grave+and+honourable+members+of+the+society+to+join+with+the+pastor+in+the+over-sight+of+it%2C+who+may+constitute+a+kind+of+council+with+him%2C+to+deliberate+of+affairs+in+which+the+society+is+concerned%2C+and+prepare+them+for+being+brought+before+the+church+for+its+decision%2C+to+pray+with+the+sick%2C+to+reconcile+differences%2C+%26c.%0A%0A%5BB%5Dut+there+does+not+seem+any+sufficient+warrant+for+making+them+a+kind+of+judicatory%2C+to+whose+decisions+the+rest+of+the+society+is+to+submit%3B+and+those+rules+relating+to+presbyteries%2C+classes%2C+provincials%2C+and+general+assemblies%2C+which+are+determined+by+the+constitution+of+the+church+of+Scotland%2C+most+evidently+appear+to+be+at+best+merely+matters+of+human+discretion%2C+and+to+have+no+express+foundation+in+the+word+of+God%3B+nor+can+we+trace+the+existence+of+such+ruling+elders+higher+than+Constantine%E2%80%99s+time.%E2%80%9D%0A%0A%E2%80%94+Philip+Doddridge%2C+A+Course+of+Lectures+on+the+Principal+Subjects+in+Pneumatology%2C+Ethics%2C+and+Divinity%2C+%28London%3A+J.+Buckland%2C+1763%29%2C+Proposition+CL%2C+Scholium+5%2C+pp+522-23.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc16e0973c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c16e0973c9.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/07/philip-doddridge-on-ruling-elders-in-the-primitive-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-2c4a4d30ca" data-kw="">
<blockquote><p>The officers of this church were the bishops and deacons. The bishops were the pastors, elders, and overseers of the church, for a bishop and an elder is one and the same; see Acts 20:17 Acts 20:28; where the elders of the church at Ephesus are called overseers or bishops; for the same word is used there as here; and the Syriac version here renders the word by קשישא, elders: and they design no other than common and ordinary pastors; who have the name of elders from their age, gravity, and seniority; and that of bishops and overseers from the nature of their office, which is to feed, watch, inspect, and take the oversight of the flock, minister sound doctrine to them, and preserve them from error and heresies.

It seems by this, and the instance of the church at Ephesus, that there were, and so may be, where there is necessity for it, more pastors or bishops than one in a church; unless it can be thought that there were more churches than one in each of these cities; or that the pastors of adjacent churches are here included; neither of which seem to be a clear case, but the contrary: but then these pastors or bishops were all upon an equal foot; one had not any authority or power over another, or more authority than another; they were not metropolitan or diocesan bishops, but pastors of a particular church; and were neither lords over one another, nor of God’s heritage.

The deacons were such as served tables, the Lord’s table, the minister’s table, and the poor’s table; took care of the secular affairs of the church, received and disbursed moneys, kept the church’s accounts, and provided everything necessary for its temporal good. The one sort of these officers were concerned with the souls and spiritual estate of the members of the church; the others with their bodies and temporal estate, by visiting the sick, relieving the poor and both these exhibit the true primitive plan of church offices and discipline; there being no other order of offices or officers, in a Christian church of divine institution, but pastors and deacons; whatever else is introduced is without warrant, and comes from the man of sin. These officers are mentioned by the apostle, not only to show his respect to them, but to observe to the members of this church, that they ought to esteem them highly for their works’ sake; these being offices of great importance and usefulness to the church, which, by having such, was a truly organized church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the New Testament; In which the Sense of the Sacred Text is Taken; Doctrinal and Practical Truths are set in Plain and Easy Light: Difficult Passages Explained; Seeing Contradictions Reconciled; And whatever is material in the Various Readings and Several Oriental Versions is Observ</cite>, (2 vols, London: William Hill Collingridge, 1853), 1: 461.</span></figcaption>

</figure><figure class="quote" id="q-1f63cf9588" data-kw="">
<blockquote><p>The Apostles left more Officers in one Church than one, Phil. i. 1. with the Bishops, that is, the Pastors, Teachers and Elders. No Pastor or Teacher, but he is the Pastor or Teacher of one Congregation, and no more, Acts xx. 7, 28. God hath many Overseers to one Flock, not committed many, Flocks to one Overseer; therefore Non-residency is against the Rule of Christ. …

Two Sorts of Officers in the Church are ordinary, and they are Bishops and Deacons, Phil. i. 1. That these are ordinary, and that these are all, may appear by the Direction of the Apostle to Timothy, how to carry himself in the Church of God in constitution of Officers: He nameth these Two, 1 Tim. iii. 1, 8. Bishops and Deacons: Whom he doth mean by the Bishops? you may see, Acts xx. 17, with 28, the Flock over which God hath made you ἐπισκόπους, Overseers; those he calleth Elders, ver. 17. calleth Bishops, ver. 28. Tit. i. 5,7. and the same he calleth Elders, ver. 5. are called Bishops, ver. 7. For Deacons, see Acts vi. 2, 3, 4. the Deacons for the Church at Jerusalem; and Paul giveth Directions to Timothy about them, and it is a perpetual Charge to the Church. Compare 1 Tim iii. 14, 15. with 1 Tim. vi. 13, 14. Bishops and Deacons must be kept to the Coming of CHRIST in the Church, not so Apostles, Prophets, Evangelists. …

Quest. What Sort of Bishops hath God set in his Church?

Answ. Two; some Pastors and Teachers, some ruling Elders, under Two Heads; some labour in Word and Doctrine, and of those some are Pastors, some Teachers: Others rule only, and labour not in Word and Doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government and Discipline of the Churches of Christ, set down by way of Questions and Answers, with an Explanation and Application of the same</cite>, (London: John Clark, 1722), pp 19, 40, 46.</span></figcaption>

</figure><figure class="quote" id="q-00b7cfd59f" data-kw="">
<blockquote><p>But there is a still more pointed reference to this class of Elders in 1 Timothy v. 17. Let the Elders that rule well be counted worthy of double honour, especially they who labour in the word and doctrine. It would seem that every person of plain common sense, who had never heard of any diversity of opinion on the subject would, without hesitation conclude, on reading this passage, that, at the period in which it was written there were two kinds of Elders, one whose duty it was to labour in the word and doctrine, and another who did not thus labour but only ruled in the Church.

The Apostle declares that Elders who rule well are worthy of double honour, but ESPECIALLY those who labour in the word and doctrine. Now, if we. suppose that there was only one class of Elders then in the Church, and that the were ALL teachers, or laborers in the word and doctrine, we make the inspired Apostle speak in a manner utterly unworthy of his high character. There was, therefore, a class of Elders in the apostolic Church who did not, in fact, or, at any rate, ordinarily, preach, or administer sacraments, but assisted in government;-in other words, Ruling Elders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay, on the Warrant, Nature and Duties of the Office of the Ruling Elder in the Presbyterian Church</cite>, (New York: Jonathan Leavitt, 1831), p. 57.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

— Samuel Miller, An Essay, on the Warrant, Nature and Duties of the Office of the Ruling Elder in the Presbyterian Church, (New York: Jonathan Leavitt, 1831), p. 57.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+there+is+a+still+more+pointed+reference+to+this+class+of+Elders+in+1+Timothy+v.+17.+Let+the+Elders+that+rule+well+be+counted+worthy+of+double+honour%2C+especially+they+who+labour+in+the+word+and+doctrine.+It+would+seem+that+every+person+of+plain+common+sense%2C+who+had+never+heard+of+any+diversity+of+opinion+on+the+subject+would%2C+without+hesitation+conclude%2C+on+reading+this+passage%2C+that%2C+at+the+period+in+which+it+was+written+there+were+two+kinds+of+Elders%2C+one+whose+duty+it+was+to+labour+in+the+word+and+doctrine%2C+and+another+who+did+not+thus+labour+but+only+ruled+in+the+Church.%0A%0AThe+Apostle+declares+that+Elders+who+rule+well+are+worthy+of+double+honour%2C+but+ESPECIALLY+those+who+labour+in+the+word+and+doctrine.+Now%2C+if+we.+suppose+that+there+was+only+one+class+of+Elders+then+in+the+Church%2C+and+that+the+were+ALL+teachers%2C+or+laborers+in+the+word+and+doctrine%2C+we+make+the+inspired+Apostle+speak+in+a+manner+utterly+unworthy+of+his+high+character.+There+was%2C+therefore%2C+a+class+of+Elders+in+the+apostolic+Church+who+did+not%2C+in+fact%2C+or%2C+at+any+rate%2C+ordinarily%2C+preach%2C+or+administer+sacraments%2C+but+assisted+in+government%3B-in+other+words%2C+Ruling+Elders.%E2%80%9D%0A%0A%E2%80%94+Samuel+Miller%2C+An+Essay%2C+on+the+Warrant%2C+Nature+and+Duties+of+the+Office+of+the+Ruling+Elder+in+the+Presbyterian+Church%2C+%28New+York%3A+Jonathan+Leavitt%2C+1831%29%2C+p.+57.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F00b7cfd59f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/00b7cfd59f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/12/21/samuel-miller-on-ruling-elders-and-1-timothy-517/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-a3ebbade9d" data-kw="">
<blockquote><p>After this sixthly, he names ordinary offices and gifts, viz. helps, or the office of Deacons, whose work it was to see to the maintenance of Ministers, and the necessities of the Saints, and the dispensation of the public revenues of the Church: which office, though it may seem the meanest, it appears to be in no small account, and imposed not upon men of inferior rank, but upon those that were of tried fidelity, and the more able, or men of fairest estate, as vers. 22, 23, 24.

And that for the necessary use of it; for without the help of this office, the work of the Ministry would be much hindered, for had there not been helps or Deacons, who undertook the care of collecting the stipends, that the Ministers might more freely attend the work of the Lord: It is necessary that the Ministers with the Levites, Nehem. 13. to whom a designed portion was not given, should betake themselves to their fields, and their work, or secular businesses, and also to Law-suits, being debarred of their due allowance, they might lose their zeal of labouring in the Lord’s Vineyard, or the fruit of their labours.

After these (unless perhaps there was no difference touching these inferior offices) the Apostle is not solicitous any further about the order; He names Governors, or Ruling Presbyters, who take notice of the peoples manners, and as presidents with the Pastors and Teachers, with the Ecclesiastical Assembly attend to the removing of scandals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 61.</span></figcaption>

</figure><figure class="quote" id="q-c1decf2806" data-kw="">
<blockquote><p>He so designates, undoubtedly, the elders who presided over discipline. For the primitive church had its senate who preserved good morals among the people, while the apostles and teachers were left free to preach. The apostle indicates this plainly enough (1 Tim. v. 17), where he specifies two kinds of presbyters. These governors, then, were not princes or praetors armed with the sword, but presbyters, excelling others in gravity, experience, authority, chosen from amidst the assembly with the church’s consent, who aided or relieved the pastors in administering discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-king.html">David King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, An Exposition and Defence of the Presbyterian Form of Church Government. In Reply to Episcopal and Independent Writers</cite></span></figcaption>

</figure><figure class="quote" id="q-68b3706ba6" data-kw="">
<blockquote><p>He that ruleth, with diligence.] Although I doubt not that there were many kinds of government in the Church, yet to confess the truth, this as I think may most aptly be understood of those which were called praesbiteri, that is, elders, not of these which had the charge of the word and of doctrine, but of those which were appointed as helpers to the pastors. They as men of the wiser sort &amp; endowed with a greater zeal and piety, were chosen out of the Laity. Their office was chiefly to see unto discipline, and to look what every man did, and in every house &amp; family to see what every man needed, either as touching the soul, or as touching the body.

For the Church had his elders, or if I may so speak, his senate, which as time required provided for all things mete and profitable. Paul describeth this kind of ministry not only in this place but also in the first to Timothy: For thus he writeth. The elders, are worthy of double honour, especially they which labour in the word &amp; in doctrine. In which words he seemeth to signify, there are some praesbiteri which teach and set forth the word of God: and there are others, which although they do not this, yet are they governors in the Church as elders.

This thing Ambrose left not untouched, when he expounded that place, yea he complaineth, that even them either thorough the pride, or thorough the slothfulness of the priests they were in a manner worn away. For whilst they which have the government of the Church seek to draw all things to themselves, they diligently as much as they can, labour that in that room should be joined no fellow officers with them. Wherefore Paul willeth, that they which have this charge, doo put to their diligence, and expel slothfulness and sluggishness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romanes wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Ep</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 418.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-45f8bf721e" data-kw="">
<blockquote><p>That Ruling Elders are officers in the Church of God, may be clearly gathered from Rom. 12. 8. He that ruleth with diligence. (a) 1 Tim. 5. 17. Let the Elders that rule well be counted worthy of double-honour, chiefly those that labour in the word and doctrine. &amp; 1 Cor. 12. 28. God hath set in the Church—Governments.

2. That they are officers distinct from other officers, is also plain from the same place; chiefly from that of 1 Tim. 5. 17. and from Rom. 12. 4, 6. compared with 8. For in 1 Tim. 5. 17. he doth mention two sorts of Elders: first in the general those that rule well; secondly more distinctly, those that in bearing rule, labour in the word and doctrine.

And in Rom. 12. 4. the Apostle saith, that there are many members in the body of the Church, and that they have not all of them the same offices: then, v. 6. he saith, that the gifts of grace which makes men capable of offices, are different: and then in the latter part of v. 6. and v. 7. &amp; 8. he sheweth what the particular differences of offices are, amongst which he reckoneth up that of Ruling; from whence it followeth, that the Ruler is not only an officer, but a different officer from the others named in that place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A model of church-government: or, The grounds of the spiritual frame and government of the house of God. Shewing, what the holy Scriptures have therein delivered; what the best Reformed Churches do practise; what the tender consciences may rest in. For the better satisfaction of such as scruple at t</cite>, (London: John Bellamy, 1647), pp 19-20.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“That Ruling Elders are officers in the Church of God, may be clearly gathered from Rom. 12. 8. He that ruleth with diligence. (a) 1 Tim. 5. 17. Let the Elders that rule well be counted worthy of double-honour, chiefly those that labour in the word and doctrine. &amp; 1 Cor. 12. 28. God hath set in the Church—Governments.

2. That they are officers distinct from other officers, is also plain from the same place; chiefly from that of 1 Tim. 5. 17. and from Rom. 12. 4, 6. compared with 8. For in 1 Tim. 5. 17. he doth mention two sorts of Elders: first in the general those that rule well; secondly more distinctly, those that in bearing rule, labour in the word and doctrine.

And in Rom. 12. 4. the Apostle saith, that there are many members in the body of the Church, and that they have not all of them the same offices: then, v. 6. he saith, that the gifts of grace which makes men capable of offices, are different: and then in the latter part of v. 6. and v. 7. &amp; 8. he sheweth what the particular differences of offices are, amongst which he reckoneth up that of Ruling; from whence it followeth, that the Ruler is not only an officer, but a different officer from the others named in that place.”

<blockquote><p>Quest. What is the Office and Work of the Ruling Elders?

Answ. Seeing the Kingdom of God is not of this World, but Heavenly and Spiritual, and the Government of his Kingdom is not Lordly, but Stewardly and Ministerial, and to labour in the Ministry of Exhortation and Doctrine, is the proper Work of the Pastors and Teachers, it remaineth therefore to be the Office and Work of the Ruling Elders to assist the Pastors and Teachers, in diligent Attendance to all other Aids of Rule besides Exhortation and Doctrine, as becometh good Stewards of the Household of God.

As I. To open and shut the Doors of God’s House, by Admission of Members, by Ordination of Officers, by Excommunication of notorious and obstinate Offenders. 2. To see none live in the Church inordinately without a Calling, or idle in their Calling. 3. To prevent and heal Offences whether in Life or Doctrine, that might corrupt their own Church, or other Churches also, if their Counsel be required. 4. To prepare Matters for the Churches Consideration, and to moderate the Carriage of all Matters in the Church-Assemblies, as to propound Matters to the Church, and to order the Seasons of Speech and Silence in the Church. 5. Finally, To feed the Flock of God by a Word of Admonition; and, as they shall be called, to visit and pray for their sick Brethren.</p></blockquote>

s" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f42ca74d6f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/27/thomas-goodwin-on-the-office-and-work-of-ruling-elders/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-1b8f76400d" data-kw="">
<blockquote><p>And we begin with tile Ruling Elders’ place, for that carries a kind of simplicity with it: there be more ingredients required to make up the Office of Pastor and Doctor, and therefore we shall take leave to trade in the first. …

That there is such an Office and Officer appointed by Christ, as the Scriptures are plain to him, whose spirit and apprehension is not possessed and forestalled with prejudice: So this cause hath been maintained by mand of Christ’s Worthies of former, and now of latter times; and now at last, by those two famous and eminent Champions, Mr. Rutterfort [Samuel Rutherford], and Mr. Gilespy [George Gillespie].

So that we have no controversy here but with Hierarchical Persons, the force and power of whose Arguments, lies especially in a Pursuvant and a Prison, armed with Authority of an High-Commission. And therefore we shall content our selves to settle the Scriptures shortly upon their basis and bottom, according to the sense of the Spirit of God, in the several places, and dispute briefly, there-from, and so finish this Head of Discipline.

The first Argument we have from Rom. 12.7. which gives in witness to this truth, where all these officers are numbered and named expressly; if the meaning of the words be once manifested, which will be made clear in the particulars following. …

The second Argument is taken from 1 Cor. 12.28. God hath set some in his Church; as first, Apostles; then Prophets; thirdly, Teachers; after that Powers, then gifts of healing, helps, Governments. The scope of the place, and the Apostle his intendment is, to lay open the several Offices and Officers that the Lord hath set in his Church, and so many chief members, out of which the Church is constituted as an entire body. …

From which premises, the dispute issues thus: As Apostles, Prophets, and Teachers are distinct, so are Helps and Governments distinct; for the Spirit puts them in the same rank, as having a parity of reason, which appertains to them all. But they were distinct Offices, and found in persons as distinct Officers, as vers. 30. Are all Apostles? Are all Teachers? Therefore, the same is true of Governors. …

A third argument is taken from the famous place, 1 Tim. 5.17. which is full to our purpose in hand, and intended by the Holy Spirit of the Lord, to make evident the station and office of Ruling Elders, unto the end of the world; and it is admirable to observe, how the factors and followers of the Pope and Prelates, who labour to prop up their place and pre-eminency, have used all the wiliness of their wits, and unwearable wrestlings of their carnal reason, to darken the evidence of the truth, and to defeat the power of the proof in this place, as fearing, it should seem, lest by this means their way to promote and maintain the pride of Prelacy, would be utterly prejudiced and overthrown; whereas, do but suffer the Deacon to lay aside the care of the poor, make him but half a Priest, give him the allowance that he may baptize, and not give the Sacrament of the Supper; raise the Ruling-Elder one stair higher, that he may be a Teaching-Presbyter:

By this time, the Bishop is beyond the bound of an ordinary Elder, and with a little help, he will be handed up into a Diocesan Palace, and one lift more will make him a Primate; and if the Kings of the earth favour him, he will make himself a Pope presently; for they differ but in degrees, not in kind. So that you must not wonder to see the contention grow so hot touching a Ruling Elder, because if he be confined with his compass, the wings of Pope and Prelate will be exceedingly clipped, and their power impeached.</p></blockquote>

<blockquote><p>Old age is honoured in every society, which is why the synagogue, and later on the church, had elders, without whose advice nothing was done in the church. I do not know why the custom has faded out. Perhaps it is because of the laziness of the teachers, or more likely because of their pride, since they want to be seen as the only ones who do anything.</p></blockquote>

<blockquote><p>The Apostle S Paul doth notably amplify the honour due to the true and faithful Ministers. The Elders that rule well (saith he) let them be had in double honour, specially they which labour in the word and doctrine, as if he should say, let those Elders which are appointed to watch and look to the manners and behaviour of the children of God, if they execute this charge faithfully, be had in double honour: but above all, let the faithful Ministers, such as labour in the word, be honoured: for why? the other are overseers of your outward behaviour, but these have an other manner of office, they watch over your souls, which tendeth to the salvation both of body and soul.</p></blockquote>

<blockquote><p>[18. You shall bind.] The Jesuits would fain the this key of excommunication unto the Bishop’s girdle alone: which is against the mind of our Saviour Christ, and circumstance of the place: but if they will say so, and speak so strangely, they must warrant it with some other places of scriptures, where the Church is taken for one, which is as much to say, one man is many, one member is as body, one alone is a company. And beside this strangeness of speech, it destroyeth the sovereignty of the medicine which our Saviour Christ prepared for such a festered soar, as would neither be healed by private admonition, neither with admonition before one or two witnesses.

For as the fault growth, so our Saviour Christ would have the number of those before whom he should be checked and rebuked, likewise grow. Therefore from a private admonition, he riseth unto the admonition before two or three: and from them to the Church; which if we should say, it is but one: then unto a dangerouser wound, should be laid an easier plaster. And therefore our Saviour doth not rise from two to one (for that were not to rise but to fall, nor to proceed, but go backward) but to many. But Paul is the best interpreter, who in a case of excommunication, declareth that the same is to be done in the presence, and with consent of the assembly, whereof the party which is to be excommunicated, is a member.

To conclude: Theophilact upon this place interpreteth, Tell the Church, that is Many. And because that assembly in the time of the Law, were of two sorts: for some had the handling of the word, othersome watching against the offences of the Church, did by common counsel with the ministers of the word, take order against the same. Those governing Elders are divers times in the story of the Gospel made mention of, under the title of the Rulers of the Synagogue. And this manner of government, because it was to be translated into the Church of Christ under the Gospel, our Saviour by the order (at that present) used amongst the Jews, declareth what after should be done in his Church.

Agreeably hereunto the Apostle both declared the Lord’s ordinance in this behalf, and put the same in practice in ordaining to every several Church, beside the Ministry of the word, certain of the chiefest men which should assist the work of the Lord’s building. This was also faithfully practised of the Churches, after the Apostles’ times, as long as they remained in any good and allowable soundness of the doctrine. And being fallen from the Churches, especially from certain of them, the want thereof is sharply and bitterly cast in the teeth of the Church teachers, by whose ambition that came to pass.

I conclude therefore, that to tell the Church, is not to tell the Bishop or Minister of the word only; but a company which hath oversight of the Church; by whom, or by whose mouth, which is the minister of the word, the rest of the body of the Church is to be advertised: to the end that the sword of excommunication cut not without their privity and consent. Whereupon it is evident, that the places of these Fathers, which give power to the Bishops to bind, and to loose: do not restrain it unto them, shutting out the rest of the Church, which might be shewed by many testimonies out of them, if the same were needful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Confutation of the Rhemists Translation, Glosses and Annotations on the New Testament</cite>, (Leiden, 1618), p. 90.</span></figcaption>

<blockquote><p>Another point in the [Cambridge] platform [of 1649], not universally received, is, the distinct office of ruling elders, to join with the pastors in those acts of church-rule, which are distinct from the ministry of the word and sacraments, or to watch over the conversation of the church-members with authority.

There are some who cannot see any such officer as what we call a ruling elder, directed and appointed in the word of God; and the inconveniencies, whereunto many churches have been plunged by elders, not of such a number, or not of such a wisdom, as were desirable, have much increased a prejudice against the office itself; be sure, partly through a prejudice against the office, and partly, indeed chiefly, through a penury of men well qualified for the discharge of it, as it has been heretofore understood and applied, our churches are now generally destitute of such helps in government.

On the other side; there are others, who, if they asked, What order for lay-elders in the word of God? Answer, that properly, the only lay-elders known to be in any church, are the chancellours in the church of England; persons entrusted with the rules of the church, and yet not ordained unto any office in it.

But, that unless a church have divers elders, the church-government must needs become either prelatic or popular; and that a church’s needing but one elder, is an opinion contrary not only to the sense of the faithful in all ages, but also to the law of the scriptures, where there can be nothing plainer, than, elders, who rule well, and are worthy of double honour, though they do not labour in word and doctrine; whereas, if there were any teaching elders, who do not labour in word and doctrine, they would be so far from worthy of double honour, that they would not be worthy of any honour at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Magnalia Christi American: or, The Ecclesiastical History of New-England, from its First Planting in the Year 1620, unto the Year of our Lord, 1698</cite>, (1702; 2 vols, Hartford CN: Silas Andrus, 1820), Book 5, ii, 206.</span></figcaption>

<blockquote><p>Thirdly, According to some there is this Third Office in the Church of Christ, namely, that of Lay-Elders, and their Foundation for it is in Rom. 12.8. He that ruleth with Diligence; where he that ruleth is distinguished from him that teacheth and exhorteth, and therefore they say he is a different Officer, and they observe that he comes after him that teacheth and exhorteth, which shews, that he is an Officer inferior to the Teacher and Exhorter. And therefore there is Reason to infer, that ὁ προϊστάμενος, he that ruleth, is the Lay-Presbyter, whose peculiar business it is to be an Overseer and Censor of the Manners of those ‘who belong to the Christian Congregation.

So it is thought to be clear from that other Text, I Cor. 12. 28. which mentions Helps and Governments, that by them are meant Ruling Elders in the Church, who are not Pastors or Teachers (for they are distinguished from them) but are helpful and serviceable in the Governing of the Church, by taking care of the outward Behaviour of its Members. And as before he that ruleth was placed after the Teacher and Exhorter, so here they observe, that Helps and Governments are placed after Teachers, to let us know that they are not the Preaching for Teaching Governors, nor Bishops of the Church.

That is looked upon another plain Text, I Tim. 5. 17. Let the Elders that rule well be counted worthy of double Honour, especially those that labour in the Word and Doctrine. Where are two Sorts of Elders, those that Rule, and those that both Rule and do other Offices in the Church. The Lay-Seniors that are appointed to keep Things in good Order, and to assist in the Governing and Disciplinary Part, are said to Rule well, and therefore deserve a high Degree of Honour and Praise; but there is another Rank of Elders, who labour in the Word and Doctrine, whose Office it is to instruct and guide Men as to all Spiritual Affairs, and these are especially worthy of double Honour. The Emphasis lies in the Word μάλιστα, especially, which, where-ever it is used in the New Testament, signifies another Thing, or Person, different from what was before-mentioned in the Place. So here it makes a Distinction between Elders, between the Ruling and the Teaching Elder.

But here some Object (and with great Weight and Reason) that the καλῶς προεστῶτες are the same with προϊσταμένους, I Thess. 5. 12. who are acknowledged to be Bishops, or else Preaching Elders. But the Answer that is given to this Objection is this, That to Rule, or to be set over others is applicable to both that sort of Elders I’m now speaking of, and to the others. The Lay-Elder is said to Rule, not because the others do not Rule, but because he doth nothing else but Rule, he doth not Preach or Perform any Office that belongs to the Ministry.

Besides, if by ruling Elders in this Place he mean Bishops or Preaching Ministers, then the Apostle here would have those who take no Pains and Care in the Word and Doctrine, to have Honour, yea, and he lets us know that they are worthy of it; which is a Meaning unworthy of the Apostle. For the Pastoral Office requires Pains and Labour, and therefore it is certain the Apostle would not speak thus concerning those that labour not: Whence some conclude, that by the Ruling Elders here we are not to understand the Teachers of the Church, but that the plain Interpretation is this, To labour in the Word and Doctrine is here the Periphrasis of a Preaching Elder or Minister, and so it is opposed to that other Office, which consists only in Ruling. …

The short is, that some are of Opinion that labouring in the Word and Doctrine comprehends here the whole Ministerial Employment, as it is usual to express the whole by a Principal Part, and it is contradistinguished from, and preferred to the ruling well, that is, the bare Office of those who were Lay-Men, but appointed by the Church to look into the Manners of the People, and so to govern and preside over the congregation. Whence it is inferred by some, that Lay-Elders are an Evangelical Appointment in the Church.

And they tell us moreover, that this Office of a Ruling Elder is according to the Practice of the Church of God among the Jews, his own People. It is certain that there was this kind of Elders under that Oeconomy. The Sanhedrim was compounded of Priests and Lay-Elders, as is evident from Num. 11.16. 24, 25-33. 16. Deut. 17. 8, 9. as well as from other Jewish Writers since, who acquaint us that there were two Sorts of Elders among the Jews, the Ruling ones, who governed in their Assemblies and Synagogues, and the Teaching ones, who read and expounded the Scriptures. Accordingly Dr. [John] Lightfoot in his Harmony of the New Testament inclines to interpret 1 Tim. 5. 17. of the Elders in the Christian Congregations, who answer to the Lay-Elders in the Jewish Synagogue. For this Learned Writer, who was well versed in the Jewish Customs and Practices, tells us, that in every Synagogue among the Jews there were Elders that ruled chiefly in the Affairs of the Synagogue, and other Elders that labour d in the Word and Doctrine.

And so it was in the Christian Church, there was a Mixture of Clergy and Laity in their Consults about Church-Matters, as we lee frequently in the Ails of the Apostles. The concurrence of the People was thought necessary in the Apostles Times in the public Censures of the Church, in Election of Pastors, and in all Ecclesiastical Concerns. But more particularly the Practice of those Times with regard to Lay-Elders, is said to be manifest from what is recorded in the Apostolical Epistles, which hath been already produced to confirm this Office in the Church. Perhaps that Text (which is not thought of in Acts 20. 17, 20, doth the fame, for ’tis said that St. Paul called the Elders of the Church of Ephesus; and ’tis said farther, that St. Paul taught them publicly, and from House to House, whence it maybe gathered, that among those Elders some of them were Lay-Men, for some of them were not Teachers, but were taught, and these were those that we call Lay-Elders.

And afterwards the Christian Church retained this Usage, for which they quote St. Augustine’s 137th Epistle, where he motions the Clergy, and the Elders and the People. So in his 3d. Book against Cresconius he mentions Deacons and Seniors, that is, Lay-Elders, for he distinguishes them from other Presbyters. One of his Epistles to his Church of Hippo, is thus superscribed. To the Clergy and the Elders. See chap. 56. in the fore-named Book against Cresconius, where he mentions Peregrinus the Presbyter, and the Seniors. … Thus it appears, that this was an Ancient Office in the Church, and not invented by Calvin, as some have thought and writ.

And then, as to the Reason of the Thing, some think there should be no Ground of Quarrelling with this Office in the Church, seeing it is so Useful. For it was Instituted for the Ease of the Preaching Elders, that they might not be over-burdened with Business, and that they might more conveniently apply themselves to that Employment which is purely Ecclesiastical and Spiritual. And it was wisely appointed to take off the Envy and Odium from the Ministers, which would be their Lot if they intermeddled too much with Affairs. And it is a Way to cement the Clergy and Laity, and to bring them to a Friendly and Christian Correspondence, and to unite them firmly in the same great Interest, that of Religion.

It might here be remembered, that they had a very great Opinion of Laymen in the former and best Times of the Christian Church, for they were admitted to Synods and Councils, and they were advanced to the highest Ecclesiastical Dignities. Thus Spyridion, tho’ a plain Countryman and a Shepherd, was made a Bishop. Ambrose, a Secular Magistrate, and Governour of Milan, was chosen Bishop of that Place by the People. Nectarius a Layman was put into the fame Office at Constantinople. Sidonius, a French Soldier was made Bishop of Auvergne in France. And if Laymen were admitted to Bishopricks, it can’t be thought indecorous that they are placed in a much lower Station in the Church, than that of Ruling Elders.

These seem to have been allowed of by our Reformers, as is evident from the Injunctions which were given by King Edward the VIth. to those Persons who were to take care of Reforming and Settling Ecclesiastical Affairs in his Reign. See the Chapter de Divinis Officits, where the Minister and the Elders are particularly mentioned, and are commanded to look after the Discipline of the Church. See the Reverend Bishop [Gilbert] Burnet’s History of the Reformation.

Nor is this esteemed by some to be against the Genius of the Evangelical Administration, which suffers not Secular Men to discharge Spiritual Offices; for the Lay-Elders Office is not properly and strictly such, they take care only of the External Matters of the Church, and are only Assistants in the outward administering of Discipline, and look into the Manners and Carriage of the Christians belonging to such or such an Assembly. But they excuse no part of the Ecclesiastical Ministry, which properly appertains to the Ministers of the Gospel.</p></blockquote>

+their+Consults+about+Church-Matters%2C+as+we+lee+frequently+in+the+Ails+of+the+Apostles.+The+concurrence+of+the+People+was+thought+necessary+in+the+Apostles+Times+in+the+public+Censures+of+the+Church%2C+in+Election+of+Pastors%2C+and+in+all+Ecclesiastical+Concerns.+But+more+particularly+the+Practice+of+those+Times+with+regard+to+Lay-Elders%2C+is+said+to+be+manifest+from+what+is+recorded+in+the+Apostolical+Epistles%2C+which+hath+been+already+produced+to+confirm+this+Office+in+the+Church.+Perhaps+that+Text+%28which+is+not+thought+of+in+Acts+20.+17%2C+20%2C+doth+the+fame%2C+for+%E2%80%99tis+said+that+St.+Paul+called+the+Elders+of+the+Church+of+Ephesus%3B+and+%E2%80%99tis+said+farther%2C+that+St.+Paul+taught+them+publicly%2C+and+from+House+to+House%2C+whence+it+maybe+gathered%2C+that+among+those+Elders+some+of+them+were+Lay-Men%2C+for+some+of+them+were+not+Teachers%2C+but+were+taught%2C+and+these+were+those+that+we+call+Lay-Elders.%0A%0AAnd+afterwards+the+Christian+Church+retained+this+Usage%2C+for+which+they+quote+St.+Augustine%E2%80%99s+137th+Epistle%2C+where+he+motions+the+Clergy%2C+and+the+Elders+and+the+People.+So+in+his+3d.+Book+against+Cresconius+he+mentions+Deacons+and+Seniors%2C+that+is%2C+Lay-Elders%2C+for+he+distinguishes+them+from+other+Presbyters.+One+of+his+Epistles+to+his+Church+of+Hippo%2C+is+thus+superscribed.+To+the+Clergy+and+the+Elders.+See+chap.+56.+in+the+fore-named+Book+against+Cresconius%2C+where+he+mentions+Peregrinus+the+Presbyter%2C+and+the+Seniors.+%E2%80%A6+Thus+it+appears%2C+that+this+was+an+Ancient+Office+in+the+Church%2C+and+not+invented+by+Calvin%2C+as+some+have+thought+and+writ.%0A%0AAnd+then%2C+as+to+the+Reason+of+the+Thing%2C+some+think+there+should+be+no+Ground+of+Quarrelling+with+this+Office+in+the+Church%2C+seeing+it+is+so+Useful.+For+it+was+Instituted+for+the+Ease+of+the+Preaching+Elders%2C+that+they+might+not+be+over-burdened+with+Business%2C+and+that+they+might+more+conveniently+apply+themselves+to+that+Employment+which+is+purely+Ecclesiastical+and+Spiritual.+And+it+was+wisely+appointed+to+take+off+the+Envy+and+Odium+from+the+Ministers%2C+which+would+be+their+Lot+if+they+intermeddled+too+much+with+Affairs.+And+it+is+a+Way+to+cement+the+Clergy+and+Laity%2C+and+to+bring+them+to+a+Friendly+and+Christian+Correspondence%2C+and+to+unite+them+firmly+in+the+same+great+Interest%2C+that+of+Religion.%0A%0AIt+might+here+be+remembered%2C+that+they+had+a+very+great+Opinion+of+Laymen+in+the+former+and+best+Times+of+the+Christian+Church%2C+for+they+were+admitted+to+Synods+and+Councils%2C+and+they+were+advanced+to+the+highest+Ecclesiastical+Dignities.+Thus+Spyridion%2C+tho%E2%80%99+a+plain+Countryman+and+a+Shepherd%2C+was+made+a+Bishop.+Ambrose%2C+a+Secular+Magistrate%2C+and+Governour+of+Milan%2C+was+chosen+Bishop+of+that+Place+by+the+People.+Nectarius+a+Layman+was+put+into+the+fame+Office+at+Constantinople.+Sidonius%2C+a+French+Soldier+was+made+Bishop+of+Auvergne+in+France.+And+if+Laymen+were+admitted+to+Bishopricks%2C+it+can%E2%80%99t+be+thought+indecorous+that+they+are+placed+in+a+much+lower+Station+in+the+Church%2C+than+that+of+Ruling+Elders.%0A%0AThese+seem+to+have+been+allowed+of+by+our+Reformers%2C+as+is+evident+from+the+Injunctions+which+were+given+by+King+Edward+the+VIth.+to+those+Persons+who+were+to+take+care+of+Reforming+and+Settling+Ecclesiastical+Affairs+in+his+Reign.+See+the+Chapter+de+Divinis+Officits%2C+where+the+Minister+and+the+Elders+are+particularly+mentioned%2C+and+are+commanded+to+look+after+the+Discipline+of+the+Church.+See+the+Reverend+Bishop+%5BGilbert%5D+Burnet%E2%80%99s+History+of+the+Reformation.%0A%0ANor+is+this+esteemed+by+some+to+be+against+the+Genius+of+the+Evangelical+Administration%2C+which+suffers+not+Secular+Men+to+discharge+Spiritual+Offices%3B+for+the+Lay-Elders+Office+is+not+properly+and+strictly+such%2C+they+take+care+only+of+the+External+Matters+of+the+Church%2C+and+are+only+Assistants+in+the+outward+administering+of+Discipline%2C+and+look+into+the+Manners+and+Carriage+of+the+Christians+belonging+to+such+or+such+an+Assembly.+But+they+excuse+no+part+of+the+Ecclesiastical+Ministry%2C+which+properly+appertains+to+the+Ministers+of+the+Gospel.%E2%80%9D%0A%0A%E2%80%94+John+Edwards%2C+Theologia+Reformata%3A+or%2C+The+Body+and+Substance+of+the+Christian+Religion%2C+Comprised+in+distinct+Discourses+or+Treatises+upon+the+Apostles+Creed%2C+the+Lord%E2%80%99s+Prayer%2C+and+the+Ten+Commandments%2C+%282+vols%2C+London%3A+John+Lawrence%2C+1713%29%2C+1%3A+525-28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F579b885cfa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/579b885cfa.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/07/john-edwards-on-the-office-of-ruling-elder/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>It is the height of this bitter tyranny, to act cruelly towards the wife by stripes or blows; which we do not read that any one among the heathen did, unless he was drunk or mad. Hence the civil law permits the wife to avail herself of a divorce, if she can prove that her husband has beaten her: and it gives as a reason, that blows are foreign to a state of freedom, Cod. lib. 5. tit. 17. De repudiis; and in Novell, constit. 117.

For no superiority whatever gives the power of coercing the inferior by blows. If two persons enter into a league of friendship on the condition that the younger shall obey the elder, and be directed in all things by his wisdom and discretion; he is bound to obedience by virtue of this contract: but if he refuse to do that, he cannot be forced to his duty by blows.

The same must be said with regard to the matrimonial contract: for in this the husband and wife agree to a certain amicable fellowship in life, so that the wife is to be subject to her husband, and directed by him; but as a companion, not as a slave; by advice, not by stripes.

Aristotle gives this reason; because it is not fit to instil such fear into the wife, which may be injurious both to respect and love: but that servile fear which is instilled by blows is subversive of both. Neither is it fit that any one should exercise power over another by constraint supported by no law; but that power of chastising a wife by stripes is supported by no law either Divine or human.

Finally add, That is not to be done which cannot be done without sin, and what always derives its origin from this sin of bitterness. For although parents often chastise their children from love; yet both the experience and conscience of every one will testify, that no one proceeds to beat his wife except from anger, bitterness, or hatred; all which are unlawful things, and diametrically opposite to the matrimonial state. Therefore, let all bitterness be done away.</p></blockquote>

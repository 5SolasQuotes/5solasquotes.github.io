</figure><figure class="quote" id="q-4de427af5f" data-kw="">
<blockquote><p>…I do hereby grant and declare, that no person or persons, inhabiting in this province or territories, who shall confess and acknowledge One almighty God, the Creator, Upholder and Ruler of the World; and profess him or themselves obliged to live quietly under the civil government, shall be in any case molested or prejudiced, in his person or estate, because of his or their conscientious persuasion or practice… And all persons who also profess to believe in Jesus Christ, the Savior of the World, shall be capable (notwithstanding their other persuasions and practices in point of conscience and religion) to serve this government in any capacity, both legislatively and executively…</p></blockquote>

<blockquote><p>We the people of the State of Rhode Island and Providence Plantations, grateful to Almighty God for the civil and religious liberty which He has so long permitted us to enjoy, and looking to Him for a blessing upon our endeavors to secure and to transmit the same unimpaired to succeeding generations, do ordain and establish this constitution of government.</p></blockquote>

</figure><figure class="quote" id="q-d3f66e3725" data-kw="">
<blockquote><p>III. …to be elected by virtue of this constitution, they shall jointly in the house of representatives choose… a governor and commander-in-chief, a lieutenant-governor… and a privy council, all of the Protestant religion… … XII. …and that no person shall be eligible to a seat in the said senate unless he be of the Protestant religion… XIII. …No person shall be eligible to sit in the house of representatives unless he be of the Protestant religion… XXXVIII. That all persons and religious societies who acknowledge that there is one God, and a future state of rewards and punishments, and that God is publicly to be worshipped, shall be freely tolerated. The Christian Protestant religion shall be deemed and is hereby constituted and declared to be, the established religion of this State. That all denominations of Christian Protestants in this State, demeaning themselves peaceably and faithfully, shall enjoy equal religious and civil privileges… …And that whenever fifteen or more male persons, not under twenty-one years of age, professing the Christian Protestant religion, and agreeing to unite themselves in a society for the purposes of religious worship, they shall (on complying with the terms hereinafter mentioned) be, and be constituted a church, and be esteemed and regarded in law as of the established religion of the State, and on a petition to the legislature shall be entitled to be incorporated and to enjoy equal privileges. …each society so petitioning shall have agreed to and subscribed in a book the following five articles, without which no agreement or union of men upon pretence of religion shall entitle them to be incorporated and esteemed as a church of the established religion of this State: 1st. That there is one eternal God, and a future state of rewards and punishments. 2nd. That God is publicly to be worshipped. 3rd. That the Christian religion is the true religion. 4th. That the holy scriptures of the Old and New Testaments are of divine inspiration, and are the rule of faith and practice. 5th. That it is lawful and the duty of every man being thereunto called by those that govern, to bear witness to the truth.</p></blockquote>

</figure><figure class="quote" id="q-0879226770" data-kw="">
<blockquote><p>The controversy which has been moved concerning the civil magistrate’s vice-gerentship, and the holding of his office of, and under, and for Jesus Christ, as He is Mediator, has a necessary coherence with, and dependence upon, another controversy concerning a twofold kingdom of Jesus Christ… It is a distinction which Mr. Hussey [an Erastian] cannot endure, and no marvel, for it overturns the foundation of his opinion. He looks upon it as an absurd assertion, p. 25, ‘Shall He have one kingdom as Mediator, and another as God?’ He quarrels all that I have said of the twofold kingdom of Christ, and will not admit that Christ, as Mediator, is King of the church only, p. 25-27, 35-37. … He holds that Christ, as Mediator, has placed the Christian magistrate under Him, and as his vice-gerent, and has given him commission to govern the church, which, if he or any man can prove from the word of God, it will go far in the decision of the Erastian controversy… Mr. [Thomas] Coleman [c.1597-1646] in his Re-Examination, p. 19, was fearful to set his foot upon so slippery ground. He was loath to adventure upon this assertion, that magistracy is derived from Christ, as Mediator, by a commission of deputation and vice-gerentship… Wherefore he made a retreat and held him at this: ‘That magistracy is given to Christ to be serviceable in his kingdom.’ But out steps Mr. Hussey and boldly avers a great deal more. I much mistake if he shall not be made either to make a retreat, as Mr. Coleman did, or to do worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite></span></figcaption>

<blockquote><p>…the Church and State in Israel were two incorporations formally distinguished. And I see not, but those who do confound them [the Erastians], may also say that the Christian State and the Christian Church be all one State, and that the government of the one must be the government of the other; which were a confusion of the two kingdoms. It is true, God has not prescribed judicials to the Christian State, as He did to the Jewish State, because shadows are now gone when the body Christ is come; but God’s determination of what is morally lawful in civil laws is as particular to us as to them; and the Jewish judicials did no more make the Jewish State the Jewish Church, than it made Aaron to be Moses and the priest to be the king and civil judge…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. Travis Fentiman, ‘Samuel Rutherford on the Judicial Laws of Moses: Excerpts Arranged Topically’, pp. 4-6, 23 | The Due Right of Presbyteries (1644), p. 70</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…the Church and State in Israel were two incorporations formally distinguished. And I see not, but those who do confound them [the Erastians], may also say that the Christian State and the Christian Church be all one State, and that the government of the one must be the government of the other; which were a confusion of the two kingdoms. It is true, God has not prescribed judicials to the Christian State, as He did to the Jewish State, because shadows are now gone when the body Christ is come; but God’s determination of what is morally lawful in civil laws is as particular to us as to them; and the Jewish judicials did no more make the Jewish State the Jewish Church, than it made Aaron to be Moses and the priest to be the king and civil judge…”

— Samuel Rutherford, Other citations (work not named), ed. Travis Fentiman, ‘Samuel Rutherford on the Judicial Laws of Moses: Excerpts Arranged Topically’, pp. 4-6, 23 | The Due Right of Presbyteries (1644), p. 70">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Church+and+State+in+Israel+were+two+incorporations+formally+distinguished.+And+I+see+not%2C+but+those+who+do+confound+them+%5Bthe+Erastians%5D%2C+may+also+say+that+the+Christian+State+and+the+Christian+Church+be+all+one+State%2C+and+that+the+government+of+the+one+must+be+the+government+of+the+other%3B+which+were+a+confusion+of+the+two+kingdoms.+It+is+true%2C+God+has+not+prescribed+judicials+to+the+Christian+State%2C+as+He+did+to+the+Jewish+State%2C+because+shadows+are+now+gone+when+the+body+Christ+is+come%3B+but+God%E2%80%99s+determination+of+what+is+morally+lawful+in+civil+laws+is+as+particular+to+us+as+to+them%3B+and+the+Jewish+judicials+did+no+more+make+the+Jewish+State+the+Jewish+Church%2C+than+it+made+Aaron+to+be+Moses+and+the+priest+to+be+the+king+and+civil+judge%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Other+citations+%28work+not+named%29%2C+ed.+Travis+Fentiman%2C+%E2%80%98Samuel+Rutherford+on+the+Judicial+Laws+of+Moses%3A+Excerpts+Arranged+Topically%E2%80%99%2C+pp.+4-6%2C+23+%7C+The+Due+Right+of+Presbyteries+%281644%29%2C+p.+70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a656e4bf9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5a656e4bf9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/church-state-relations/erastianism/#:~:text=the%20Church%20and%20State%20in%20Israel,be%20the%20king%20and%20civil%20judge&amp;text=the%20Church%20and%20State%20in%20Israel%20were%20two&amp;text=priest%20to%20be%20the%20king%20and%20civil%20judge" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But we read not” (says Erastus) “where Christ has changed those laws in the New Testament.” It is true, Christ has not said in particular: “I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated till the evening;” nor has He said particularly of every carnal ordinance and judicial law: “it is abolished.” But we conceive the whole bulk of the Judicial Law, as judicial, and as it concerned the republic of the Jews only, is abolished, though the moral equity of all those be not abolished… … But sure Erastus errs who will have all such to be killed by the magistrate under the New Testament because they were killed by him in the Old: Why, but then the whole judicial law of God shall oblige us Christians as Carolostadius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them [the malefactors], so was it a mysterious teaching of us how God hated such and such sins; and mysteries of that kind are gone with other shadows.</p></blockquote>

<blockquote><p>There is some authority in the bishops derived from the king which may be acknowledged [as] lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>

<blockquote><p>5. Did you know before you wrote this, that all such as we persuade men to hear, have by oath renounced their Christian liberty? what oath is it that you mean? If you mean the Oath of Supremacy or Allegiance, unless Popery be Christian liberty, we know of none such which these renounce. And I know of no other oath, except that of canonical obedience in licitis et honestis [in things lawful and honest]. And for that:

1. I find not that the act or canons do impose it on those that come for ordination (nor am so well skilled in the law as to know by what law it is done).

2. I know that men have been ordinarily ordained without it. And to such your reason for separation is vain.

3. Mr. [William] Bradshaw and other old non-conformists were wont to say that they obeyed the diocesans and so did promise them obedience only as they are the king’s officers, deputed for the exercise of that civil or coercive power which magistrates have in causes called ecclesiastical [i.e. circa sacra]. And what liberty does that give away?

4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.?

5. That indeed they are nothing else, as to the whole discharge and exercise of their office, but the servants of men, is another slander and untruth. He that is a servant of Christ, and a true pastor of a Christian Church, and a sound preacher of the Gospel, and a helper of believers’ faith, and a lover of the people’s souls, and a diligent upright laborer for men’s salvation, is something else than a servant of man (even in the discharge of their ministerial office). But such are many of the conformable ministers: Therefore prove if you can that Dr. Preston, Sibbes, Stoughton, Whittaker, Mr. Bolton, Whateley, Gataker, Fenner, and all the late [Westminster] Assembly save eight or nine at most (being all conformists) were nothing else but the servants of men, and not at all the servants of Christ. Your Father thought otherwise of Mr. Bolton, and perhaps they were both as wise as you. Prove now that Mr. [William] Gurnall, Mr. [John] Trapp, Dr. [John] Lightfoot, Dr. Walker, Mr. Langley, and many others that I can name that are worthy men in London and round about it, are nothing else but the servants of men? And will it not be as hard to prove one to be a servant of Christ who serves Satan by falsehood and malice, and calumniating Christ’s Churches and servants, as those that are thus the servants of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London, 1671), sect. 41, pp. 103-5</span></figcaption>

</figure><figure class="quote" id="q-752bf8d5c6" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called [to the Savoy Conference] by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XI. They spake not against episcopacy, as it is a presidency among and over presbyters differing in degree, and not in office, called ‘order’, and that in a Church of the lowest species. …

XIII. They said nothing against metropolitans, patriarchs, lay-chancellors, commissaries, officials, surrogates, archdeacons, etc. as officers of the king, appointed to do nothing (besides the sacred ministry if they be clergymen) but what belongs to magistracy [according to circa sara].

XIV. They said nothing against any promise of obedience to them only in the capacities and in the exercise of the power forementioned.

XV. Much less did they ever oppose or question swearing to the king, according to the oaths of Allegiance and Supremacy: And I with diverse others also being (for some ends) entered as his chaplains in ordinary, took also that Oath of Fidelity which the king’s household servants take. XVI. We never were for any dishonoring of kings by public excommunications, much less by subjects or foreigners, whom kings never choose to be their pastors; but only in case of necessity, for such a denial of sacramental communion to them, as Bishop Andrewes in Tortura Torti and Bishop Bilson [The True Difference between Christian Subjection &amp; Unchristian Rebellion, pt. 3, pp. 376-77] plead for, which is but to forbear ourselves a sinful act. XVII. We never pleaded for any elders’ (or chancellors’) power of the keys, who are but laymen. XVIII. We never held that magistrates are bound to add their force by the sword to the censures of the Church as such, and to punish men more because the Church has by excommunication cast them out, or because they are not reconciled. XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But those [leading presbyterian and congregationalist ministers] that were called [to the Savoy Conference] by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XI. They spake not against episcopacy, as it is a presidency among and over presbyters differing in degree, and not in office, called ‘order’, and that in a Church of the lowest species. …

XIII. They said nothing against metropolitans, patriarchs, lay-chancellors, commissaries, officials, surrogates, archdeacons, etc. as officers of the king, appointed to do nothing (besides the sacred ministry if they be clergymen) but what belongs to magistracy [according to circa sara].

XIV. They said nothing against any promise of obedience to them only in the capacities and in the exercise of the power forementioned.

XV. Much less did they ever oppose or question swearing to the king, according to the oaths of Allegiance and Supremacy: And I with diverse others also being (for some ends) entered as his chaplains in ordinary, took also that Oath of Fidelity which the king’s household servants take. XVI. We never were for any dishonoring of kings by public excommunications, much less by subjects or foreigners, whom kings never choose to be their pastors; but only in case of necessity, for such a denial of sacramental communion to them, as Bishop Andrewes in Tortura Torti and Bishop Bilson [The True Difference between Christian Subjection &amp; Unchristian Rebellion, pt. 3, pp. 376-77] plead for, which is but to forbear ourselves a sinful act. XVII. We never pleaded for any elders’ (or chancellors’) power of the keys, who are but laymen. XVIII. We never held that magistrates are bound to add their force by the sword to the censures of the Church as such, and to punish men more because the Church has by excommunication cast them out, or because they are not reconciled. XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.”

<blockquote><p>1. We do not question the duty of obeying the king and all his officers, governing as magistrates by the power of the swords which the king may commit to them. If bishops or lay-chancellors be made magistrates, we will obey them as such: And therefore when they summon us, we appear and answer, because the king authorizes them. And many non-conformists have defended the taking the promise [of canonical obedience to a bishop or ordinary in things lawful and honest] as supposing that the word ‘ordinary’ signifies only the judge of a court set up by the king as supreme governor by the sword in matters and over persons ecclesiastical as well as civil, according to the true sense of the Oath of Supremacy.</p></blockquote>

</figure><figure class="quote" id="q-e3236da1c4" data-kw="">
<blockquote><p>A class of subjects same to be discussed in the latter part of the sixteenth century which had not engaged so much of the attention of the earlier Reformers–especially the Erastian and the Prelatic controversies–and in the discussion of these matters Beza bore his part nobly as an able and faithful champion of the truth. The Erastian controversy, indeed, as conducted between Erastus and Beza, turned mainly upon the particular subject of the excommunication of church members; and it was not till the following century, that the whole of the principles usually regarded by Presbyterian divines as comprehended in the Erastian controversy, were subjected to a full and thorough discussion. Still, even at that early stage, the quested was mooted, on which the entire progress of the subsequent discussion, down even to our own day, has made it more and more manifest that the whole controversy hinges–viz. whether or not Christ has appointed in His church a government, distinct from, independent of, and in its own province not subordinate to, civil magistracy. And on this great question, as well as on the particular topic of excommunication comprehended under it, Erastus took the side which has always been supported by politicians, sycophants [obedient flatterers], and worldlings, while Beza ably defended that which has been adhered to by all intelligent and conscientious Presbyterians.</p></blockquote>

<blockquote><p>The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite></span></figcaption>

<blockquote><p>…Lewis Du Moulin… a son of the famous Molinaeus, who took so active a part in the Arminian controversy, and was long the leading divine in the Protestant Church of France. Lewis settled in England, and obtained a chair in Oxford during the Commonwealth. He adopted Independent, or Congregational, views on church government, chiefly, it would appear, because he thought them more favorable to Erastianism than Presbyterian principles, a notion for which he could plead the authority of Congregational divines of the highest eminence–namely, the five dissenting brethren, as they were called, in the Westminster Assembly. They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>HT</cite></span></figcaption>

<blockquote><p>The Admonition annexed to the Queen’s Injunctions. The Queen’s Majesty being informed that in certain places of this realm, sundry of her native subjects, being called to ecclesiastical ministry in the Church, be by sinister persuasion and perverse construction induced to find some scruple in the form of an oath which by an act of the last parliament is prescribed to be required of diverse persons, for the recognition of their allegiance to her Majesty, which certainly neither was ever meant, ne by any equity of words or good sense, can be thereof gathered: Would that all her loving subjects should understand that nothing was, is, or shall be meant or intended by the same oath, to have any other duty, allegiance, or bond required by the same oath than was acknowledged to be due to the most noble kings of famous memory, king Henry VIII, her Majesty’s father, or king Edward VI, her Majesty’s brother. And further her Majesty forbids all manner her subjects to give ear or credit to such perverse and malicious persons which most sinisterly and maliciously labor to notify to her loving subjects how by the words of the said oath, it may be collected the kings or queens of this realm, possessors of the crown, may challenge authority and power of ministry of divine offices in the Church, wherein her said subjects be much abused by such evil disposed persons. For certainly her Majesty neither does, ne ever will challenge any other authority than that was challenged and lately used by the said noble kings of famous memory, king Henry VIII, and king Edward VI, which is and was of ancient time due to the imperial crown of this realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Consideration of the Oath of the King’s Supremacy</cite>, … (London: Hills, 1660) 27 pp., pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Objection 3: If kings be governors in all causes over all persons, then may they dissolve churches and their government, and mold and order them as they will. Answer: So far as Church constitution, government and ordering is by Christ’s appointment, or such example which has the force of an institution of Christ, it may not be altered by a king; But in such things as are left to human prudence, and there is a concernment of the weal-public, kings have authority to order them so, as that they tend to the real good and advantage of the churches of Christ and the glory of God, which is the highest and ultimate end of all. Objection 4: This will make the use of synods and assemblies of pastors to determine things of religion and to order government unnecessary, since the determination of all will lie in the king’s breast. Answer: Though statute-laws require the king’s assent, and the government is to be exercised in his name, by his commission, yet are not debates in parliament and passing bills by both Houses, nor consultations with judges, nor their decisions of cases unnecessary [but assumed in the oath]: The like is to be said of the use of synods and assemblies of Pastors and learned men, though the calling of them, and validity of their canons, that is rules, in respect of the imposing them on others with civil penalties, require the king’s concurrence. Objection 5. This has occasioned great evils in so much that persecution has been raised against godly persons as heretiques and schismatics, when princes have been misled so as to burn, banish, imprison and otherwise to afflict persons judged by prelates and others to be such. Answer: ‘Tis true this has fallen out when princes ignorant of the true religion, corrupted in their education, perverted by seducers and ungodly guides in their judgments have yielded too much to the misinformation of others, and so have been unhappy in the abuse of their government to the great hurt in life, liberty and estate of innocent persons: And the like has been in mal-administration of civil affairs through the like causes: yet the power and authority in neither is to be denied for some abuse: for that would introduce a worse evil of anarchy and mischievous confusions. On the other side when princes have been good, and have used such good counselors, as Jehoiada was to Joash, their government in religion has been of great advantage to the Church of Christ. And as things have stood in England, it was the means under God whereby Popery was expelled and the protestant Reformation was established. … Objection 8: The acknowledgement of this supremacy of the king has been opposed by sundry godly protestants who have in their writings excepted against it, as Calvin and the Century writers of Magdeburg. Answer: Tis true they excepted against the title of Head of the Church given to King Henry VIII, as Stephen Gardiner [a Papist] and such like persons misreported it, as if it gave to the king an uncontrollable authentic power, to determine of faith and worship of God: but when those learned protestants better understood what was meant by it, they withdrew their exceptions, as doctor Rainold shows in his Conference with Hart in the Tower [1584], ch. 10 [pp. 673-74]. Objection 9: Many godly persons are offended with the taking and defending the lawfulness of the taking of this oath as fearing it many tend to the taking away those liberties of their consciences in religion, which are dearer to them then their lives: and being jealous of those who take it, lest they betray those liberties. Answer: It is to be considered by those conscientious persons who make this objection that the takers, and defenders of the taking of this oath do apprehend that the imposing this oath was for the excluding the Pope’s jurisdiction and other foreign power, as the admonition of Queen Elizabeth here prefixed shows… But they that have taken it, or conceive they may take it if imposed, do it, as being satisfied in their consciences by the foregoing arguments or such like that they do but what they may do lawfully without offence, and hope that it will fall out as it did in the business of the altar of Ed, Josh. 22, that a right intelligence of their fact will prevent any breach between them and others and unite them more closely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Consideration of the Oath of the King’s Supremacy</cite>, … (London: Hills, 1660) 27 pp., pp. 22-23</span></figcaption>

rinces+ignorant+of+the+true+religion%2C+corrupted+in+their+education%2C+perverted+by+seducers+and+ungodly+guides+in+their+judgments+have+yielded+too+much+to+the+misinformation+of+others%2C+and+so+have+been+unhappy+in+the+abuse+of+their+government+to+the+great+hurt+in+life%2C+liberty+and+estate+of+innocent+persons%3A+And+the+like+has+been+in+mal-administration+of+civil+affairs+through+the+like+causes%3A+yet+the+power+and+authority+in+neither+is+to+be+denied+for+some+abuse%3A+for+that+would+introduce+a+worse+evil+of+anarchy+and+mischievous+confusions.+On+the+other+side+when+princes+have+been+good%2C+and+have+used+such+good+counselors%2C+as+Jehoiada+was+to+Joash%2C+their+government+in+religion+has+been+of+great+advantage+to+the+Church+of+Christ.+And+as+things+have+stood+in+England%2C+it+was+the+means+under+God+whereby+Popery+was+expelled+and+the+protestant+Reformation+was+established.+%E2%80%A6+Objection+8%3A+The+acknowledgement+of+this+supremacy+of+the+king+has+been+opposed+by+sundry+godly+protestants+who+have+in+their+writings+excepted+against+it%2C+as+Calvin+and+the+Century+writers+of+Magdeburg.+Answer%3A+Tis+true+they+excepted+against+the+title+of+Head+of+the+Church+given+to+King+Henry+VIII%2C+as+Stephen+Gardiner+%5Ba+Papist%5D+and+such+like+persons+misreported+it%2C+as+if+it+gave+to+the+king+an+uncontrollable+authentic+power%2C+to+determine+of+faith+and+worship+of+God%3A+but+when+those+learned+protestants+better+understood+what+was+meant+by+it%2C+they+withdrew+their+exceptions%2C+as+doctor+Rainold+shows+in+his+Conference+with+Hart+in+the+Tower+%5B1584%5D%2C+ch.+10+%5Bpp.+673-74%5D.+Objection+9%3A+Many+godly+persons+are+offended+with+the+taking+and+defending+the+lawfulness+of+the+taking+of+this+oath+as+fearing+it+many+tend+to+the+taking+away+those+liberties+of+their+consciences+in+religion%2C+which+are+dearer+to+them+then+their+lives%3A+and+being+jealous+of+those+who+take+it%2C+lest+they+betray+those+liberties.+Answer%3A+It+is+to+be+considered+by+those+conscientious+persons+who+make+this+objection+that+the+takers%2C+and+defenders+of+the+taking+of+this+oath+do+apprehend+that+the+imposing+this+oath+was+for+the+excluding+the+Pope%E2%80%99s+jurisdiction+and+other+foreign+power%2C+as+the+admonition+of+Queen+Elizabeth+here+prefixed+shows%E2%80%A6+But+they+that+have+taken+it%2C+or+conceive+they+may+take+it+if+imposed%2C+do+it%2C+as+being+satisfied+in+their+consciences+by+the+foregoing+arguments+or+such+like+that+they+do+but+what+they+may+do+lawfully+without+offence%2C+and+hope+that+it+will+fall+out+as+it+did+in+the+business+of+the+altar+of+Ed%2C+Josh.+22%2C+that+a+right+intelligence+of+their+fact+will+prevent+any+breach+between+them+and+others+and+unite+them+more+closely.%E2%80%9D%0A%0A%E2%80%94+John+Tombes%2C+A+Serious+Consideration+of+the+Oath+of+the+King%E2%80%99s+Supremacy%2C+%E2%80%A6+%28London%3A+Hills%2C+1660%29+27+pp.%2C+pp.+22-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0691d81b58.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/0691d81b58.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/church-state-relations/erastianism/#:~:text=Objection%203%3A%20If%20kings%20be%20governors,others%20and%20unite%20them%20more%20closely&amp;text=Objection%203%3A%20If%20kings%20be%20governors%20in%20all&amp;text=them%20and%20others%20and%20unite%20them%20more%20closely" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>What was used in the days of Henry VIII and Edward VI appears by the book of acts and monuments and statutes in their days, to wit, the rejecting the Pope’s jurisdiction, appointing visitors, judging and deposing some bishops, commands to take down images, causing divine service to be in the English tongue, the Bible in the English tongue to be in churches, with many other things of the like kind. The promise to defend them is ‘to our power’ whether by opposing the bringers in of a foreign power, especially the Pope’s or by aiding the king in the right use of this authority, neither is the power granted which may not be lawfully used or exercised, nor is the abuse of it required to be defended.</p></blockquote>

<blockquote><p>The immediate reason for the rewriting of the earlier manuscript [of Lex Rex by S. Rutherford] was the publication, in January 1644, of a royalist treatise, Sacro-Sancta Regum Majestas… Its author was John Maxwell, the deposed ‘Canterburian’ Bishop of Ross and one of the major architects of the notorious Scottish Prayer Book. Rutherford found this treatise by an old enemy deeply provocative, and over the winter, spring and summer of 1644, he spent much of his free-time away from the Westminster Assembly writing a detailed refutation… Maxwell had written his book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.” – Coffey, Politics, Religion, pp. 148-49 Reformed Christian Politics: “In the seventeenth century, divine-right absolutists like Roger Mainwaring and John Maxwell were Arminian in their theology. Though this seems counterintuitive, Arminian doctrine is consistent with divine-right political theory, as it allows them to affirm God’s active role in establishing kings without violating human free will. Kingship, for them, comes not by determined providence according to divine concurrence, but rather in a special, divine act that has occurred above and apart from human action. God’s choice to make a man king could not be actualized via, or in, man’s choosing, for that would violate free will (that is, it would require Calvinist views of divine sovereignty). Nor could they say that God makes a man king subsequent to man’s choosing, for that would deny God’s active role in the choosing. Instead, God chooses one man to be king, and that man is, thereby, king, and God requires the people to obey him as such. God is active, and the people are passive. Indeed, Rutherford, in Lex, Rex, blamed John Maxwell’s divine absolutism on his Arminianism. In Reformed political doctrine, on the contrary, both God and man are active in the making of one man as king, and even in determining the political form of the commonwealth.</p></blockquote>

<blockquote><p>Then the true state of the question is not whether the sword be a means of conversion of men to the true faith, nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [which is denied], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers, nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty. But whether or no ought the godly and Christian prince restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>

<blockquote><p>I offer (Worthy Reader) to your impartial and ingenuous censure these my ensuing thoughts against Liberty of Conscience, from which way, looking to me with a face of atheism, I call the adversaries, Libertines, not intending to reach a blow to any godly man, or to wound those who out of weakness are captivated with that error, but to breed in the hearts of the godly a detestation of that way, which in truth has its rise from Libertinism, and savors rankly of wide, loose and bold atheistical thoughts of the majesty of God, as if our conscience had a Prerogative Royal beside[s] a rule… and our faith and hope [according to it] must be resolved in the first principle of skepticism. So it seems to me, for the young daughters of the mind, the simplest acts of apprehending, knowing, believing God and divine truths are innocent, harmless ill-less soul-works, being from under all dominion of either free-will or a divine Law; and the mind [according to it, being] a free-born absolute Princess, can no more incur guiltiness in its operations about an infinite Sovereign God and his revealed will by this lawless way, than the fire in burning, the sun in enlightening, the stone in moving downward, be arraigned of any breach of Law, if toleration have place. All certainty of believing, all steadfastness, rooting and unmovable establishing in the truth, all life of consolations and comforts in the Scriptures, all peace of heavenly confidence, all joy unspeakable and full of glory, all lively hope, all patient and submissive waiting for the fruits of the harvest, all wrestling in prayer, all gloriation in tribulation and all triumphing in praising, all rejoicing in the Spirit, being bottomed on fallible opinions, on doubtful disputations of skeptics, may be the reelings of windmills, fair fancies and dreams; for who (say they) is infallible? and who hath known the mind of the Lord? so as the truth must be monopolized to any one sect or way? Who in faith or fullness of assurance can convince or rebuke gainsayers, heretics, or such as bring another doctrine, as those whom you so labor to convince and rebuke?

3. Conscience is hereby made every man’s rule, umpire, judge, Bible, and his God, which if he follow, he is but at the worst, a godly, pious, holy heretic, who fears his conscience more than his Creator, and is to be judged of you a saint.

4. Hence conscience being deified, all rebuking, exhorting, counter-arguing, yea all the ministry of the Gospel must be laid aside; no man must judge [a] brother [an] idolater, or brother Familist, or saints to be Socinians, or men of corrupt minds, perverse disputers, vain-janglers, wresters, rackers or torturers of Scripture, whose words eat as a canker, who subvert whole houses, who speak the visions of their own head and see false burdens, for all these who were of old, but are now quite gone out of the world; for who can make a window in any man’s soul and see there heart-obstinacy which only does essentially constitute the heretic, the blasphemer, the false prophet [according to them]? But is not brotherly forbearance, Christian indulgence a debt we owe to brethren, saints, and the truly godly in errors, and mind infirmities, which by a natural emanation or resultance get the fore-start of freewill? To which I shall speak in these few considerations:

1. It is much to be desired with the prayers and suits of the children of God that where there are two opinions, there may be one heart, that the Father of Spirits would unite the hearts of all the children of one Father and the heirs of one house.

2. Papists here have exceeded in boundless domination and tyranny over the consciences of men: and what ever is contrary to the lawless decrees of their councils and popes is an unexpiable heresy and cannot be purged but by fire and fagot.

2. Whoever refuse subjection of conscience to that enemy of Christ, and to that woman-mistress of witchcrafts, on whose skirts is found the blood of the martyrs of Jesus, is presently an heretic, and his arguments answered with burning-quick [alive]: this tyranny over conscience we disclaim; yet for that, ought not the other extremity of wild toleration be embraced.

3. We cannot think but all saints in this side of glory carry to Heaven with them errors, mistakes and prophesying in part [1 Cor. 13], and the fairest stars and lights in this lower firmament of the Church are clouded, and the benefit of the moon serves to enlighten the under garden of lillies, where ‘Christ feedeth, till the day break, and the shadows flee away.’ And here brotherly indulgence and reciprocation of the debt of compassionate forbearance of the infirmities one of another must have place.

4. Yet so, as there can be no conflict of grace against grace, nor can the taking off the foxes which destroy the vines be contrary to the gentleness and meekness of the saints in fulfilling the law of love and bearing one another’s burdens, nor can love seated essentially in a new born child of the second birth be contrary to the zeal of God in withstanding to the face a Saint looking awry, and walking not with a straight foot according to the truth of the gospel; which way if heeded in sincerity, should breed more union of hearts, and be a greater testimony of faithfulness to a straying sheep than our cruel meekness and bloody gentleness in a pretended bearing with tender consciences under a color of paying the debt of bastard love, while as we suffer millions to perish, through silence and merciless condolency with them in their sinful depraving of the truth.</p></blockquote>

<blockquote><p>But if once the government of Christ were set up among us, we know not what would impede it by the sword of God alone [i.e. the Word of God], without any secular violence, to banish out of the land those spirits of error, in all meekness, humility and love, by the force of truth convincing and satisfying the minds of the seduced. Episcopal courts were never fitted for the reclaiming of minds. Their prisons, their fines, their pillories, their nose-slitting, ear-croppings and cheek-burnings did but hold down the flame to break out in season with the greater rage. But the reformed presbytery does proceed in a spiritual method eminently fitted for the gaining of hearts; they go on with the offending party with all respect: they deal with him in all gentleness from weeks to months, from months sometimes to years, before they come near to any censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite></span></figcaption>

<blockquote><p>4. We may add this consideration, that hitherto toleration of errors and diversity of corrupt opinions have ever been looked upon, and made use of, as a most subtle means for undermining and destroying of the Church. It is marked of that skillful enemy of the Kingdom of Jesus Christ, Julian [A.D. 331-363], that having improven his subtilty to the utmost to find out means to destroy the Church by craft, which his predecessors by violence could not obtain, amongst other means he concluded this: Not to raise open persecution but to give liberty to all the differing bishops and teachers (which then, after the Council of Nicea and Constantine’s death, were very many and bitter in their differences) to follow their own way, and to vent their own opinions without all fear of any restraint: and therefore did call them that he might make intimation thereof to them for their further encouragement therein; The words which he used to them, as they are marked by Ammianus and cited by Lodovicus Molineus (p. 560) are: Ut consopitis civilibus discordiis, suae quisque Religioni serviret intrepidus, that is, in sum, That everyone forbearing civil discords, should worship in his own religion without control or fear: And is it like, that this shall prove a mean useful for the good of the Church, which that expert child of the devil did make use of to destroy the same?</p></blockquote>

<blockquote><p>The Emperor Constantine was very much for liberty for dissenters, and against persecution of them, upon tolerable differences:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 422</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Emperor Constantine was very much for liberty for dissenters, and against persecution of them, upon tolerable differences:”

— Richard Baxter, Five Disputations of Church-Government &amp; Worship, (London: R.W., 1659), 5th Disputation, ch. 2, p. 422">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Emperor+Constantine+was+very+much+for+liberty+for+dissenters%2C+and+against+persecution+of+them%2C+upon+tolerable+differences%3A%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship%2C+%28London%3A+R.W.%2C+1659%29%2C+5th+Disputation%2C+ch.+2%2C+p.+422&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb81438cb97.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b81438cb97.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=The%20Emperor%20Constantine%20was%20very%20much,persecution%20of%20them%2C%20upon%20tolerable%20differences&amp;text=The%20Emperor%20Constantine%20was%20very%20much%20for%20liberty&amp;text=and%20against%20persecution%20of%20them%2C%20upon%20tolerable%20differences" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-da5bda3de4" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: And his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Even so when Satan finds that he cannot directly destroy the unity of the Church and bring division into credit, he will be more zealous for unity than Christ Himself: He will then endure no disagreement among Christians, no not in an opinion, nor a form or ceremony; not in meats or drinks or keeping of days, or in judging of things lawful or unlawful, which are not of necessity to the Church’s concord. He is either for tolerating all propagation of heresy and practice of wickedness, or else he is so much for unity, that no difference almost is to be tolerated. For he well knows that while men are imperfect such differences will still be: And then if he can but persuade the world that for concord sake they must not be endured, what follows but that the dissenters must be fined, imprisoned or banished to bring them (or the rest) to unity. And so he will set all the world together by the ears in cruelties and bloodshed and in hating one another, and all under pretense of making them one. You may think that till mankind be all turned bedlams [mental patients], they can never be so cheated by such a gross deceit, nor ever guilty of so mad a work. But what will you say if this be the common case of the far greatest part of the Christian world? And what will you say further, if after above a thousand years’ universal experience of the unhappy success, they continue it still as the only way to unity and peace? Look but about you with opened eyes and see whether it be not so. Were not he a gracious promoter of unity in the world that would say, ‘Unity is so excellent a thing that it is meet we should be all of one complexion, or at least that the world should speak but one language; and therefore no other but one should be tolerated.’ And here how easy is it to dilate of the great inconveniences of many languages: I could write a volume in folio of it myself; and all true and evident. Methinks I see hereupon how these books are scattered and read, and how those called learned men and politicians applaud them, and shake their heads and gnash their teeth at those that would have so great a mischief tolerated: And hereupon they set about the business and desire a law that upon pain of imprisonment and banishment (I know not whither) no one in the world shall speak any other language but one. And now I hope unity will be promoted indeed, when all the world is thus engaged in a war to perfect nature and make men one. But methinks I hear one man that is awake thus bespeak the promoters of this concord: ‘Unity and concord in those points where God has made them necessary, cannot be over-valued’: But yet it is visible that there is a marvelous diversity which nature is delighted in: when of all faces and of all voices, and of all the sorts of animals and plants, there is so discernable a difference: yea of all the millions of stones in the field, no two is perfectly like each other. And where greater unity is most desirable, it must first be considered how much of it is possible or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world.’ The speech being ended, the hearers derided it and made a law for unity to destroy it, and set every man on hating and fighting against his neighbor, to make all one. It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 57, ‘Yet let not any here cheat you by overdoing, nor mere names and titles of unity deceive you instead of the thing itself…’, pp. 270-73</span></figcaption>

etter.+It+is+very+desirable+that+all+the+king%E2%80%99s+subjects+were+strong+and+beautiful+and+ingenuous+and+learned%2C+but+it+is+not+to+be+hoped%3A+But+that+they+may+be+all+loyal+and+honest+in+their+dealing+with+others+may+be+well+endeavored.+And+secondly%2C+a+wrong+kind+of+medicine+will+much+more+hasten+and+ascertain+death+than+to+let+the+disease+alone+to+nature%3A+It+is+desirable+that+all+the+kings+subjects+be+as+is+said%2C+both+wise+and+learned%2C+yea+and+perfect+in+honesty+and+piety+without+fault%3A+But+if+you+make+a+law+that+for+the+honor+of+unity%2C+all+that+are+not+learned+and+perfect+in+virtue+shall+be+fined%2C+imprisoned+or+banished%2C+the+king+nor+his+subjects+will+be+but+little+beholden+to+you+for+their+unity.+So+one+language+is+very+desirable+to+the+world%3A+But+first+it+is+not+attainable+and+secondly+a+law+to+punish+all+that+speak+another+language+is+not+the+way+to+procure+it%3B+but+to+set+them+together+by+the+ears%3A+you+must+appoint+parents+and+school-masters+to+teach+them+all+one+language+by+degrees%2C+and+keep+them+to+their+duties+and+remove+impediments%2C+and+thus+stay+the+time%3B+and+what+cannot+this+way+be+attained+must+not+be+expected+in+this+world.%E2%80%99+The+speech+being+ended%2C+the+hearers+derided+it+and+made+a+law+for+unity+to+destroy+it%2C+and+set+every+man+on+hating+and+fighting+against+his+neighbor%2C+to+make+all+one.+It+is+very+desirable+that+all+Christians+were+perfect+in+knowledge%2C+gifts+and+graces%2C+and+consequently+that+there+were+no+different+opinions%2C+nor+no+different+forms+or+modes+of+worship%2C+but+that+all+were+equal+to+the+wisest+and+to+the+most+sober%2C+pious%2C+zealous+and+sincere.+But+if+a+law+be+made+that+none+shall+be+endured+in+any+kingdom+that+are+not+of+this+temperament+and+stature%2C+the+subjects+of+all+princes+may+soon+be+numbered.+Set+parents%2C+school-masters+and+ministers+at+work%2C+to+make+men+wiser%2C+and+drive+them+on+to+diligence+in+their+duty+and+restrain+men+from+hindering+them%2C+and+from+intolerable+wickedness+and+sin%2C+and+patiently+expect+the+success+of+this%3A+And+what+this+will+not+do%2C+expect+not.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%2C+%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+57%2C+%E2%80%98Yet+let+not+any+here+cheat+you+by+overdoing%2C+nor+mere+names+and+titles+of+unity+deceive+you+instead+of+the+thing+itself%E2%80%A6%E2%80%99%2C+pp.+270-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda5bda3de4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/da5bda3de4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=There%20is%20no%20part%20of%20religion,this%20will%20not%20do%2C%20expect%20not&amp;text=There%20is%20no%20part%20of%20religion%20which%20Satan&amp;text=And%20what%20this%20will%20not%20do%2C%20expect%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>7. They [civil magistrates] might and ought to give their countenance unto, and join their authority with, such ecclesiastic statutes, overtures, or means, as Church-judicatories or officers might be about to make use of for this end in their places; and this can be no more prejudice to liberty, to countenance with their authority the ordinance of discipline, than to confirm by their authority the ordinance of preaching the Gospel. … 9. In recovering a people, in a reeling and staggering time, a magistrate may engage them to formerly received truth, and interpose his authority for this end, as is recorded of Josiah, 2 Chron. 34:31-33. Also, 10. He may and ought to remove all false worships, and endure no corrupt preaching, or writing, or meetings for that end, or administrating of corrupted sacraments, or any ordinance other than what is allowed; for, Josiah did cause the people stand to the Covenant that was made, and having removed all idolatrous worship, he made Israel to serve the Lord, that is, he made them abandon corrupt worship, and wait on pure ordinances, as keeping of the sabbaths, offering of sacrifices, etc. and that according to the manner prescribed by the Lord. Neither was it a wronging of their liberty, to do so, because:

1. It was the preservation of their liberty, to keep them from the abominable bondage of these evils.

2. It was their duty to abstain from these, and to follow the ordinances purely, and the magistrate may well put people to that.

3. It is one thing by force to keep folks from dishonouring God in a corrupt religion, (as Josiah did) another to force them to a religion; the one belongs to the ordering of the outward man, the other to the inward.

4. He might order them to keep the ordinances, and in going about them to keep the rule, because that is but a constraining of them to the means whereby religion works, and a making them, as it were, to give God a hearing, leaving their yielding and consenting to Him, when they have heard Him, to their own wills, which cannot be forced; yet it is reason that when God comes by His ordinances to treat with a people, that a magistrate should so far respect His glory and their good as to interpose His authority to make them hear.

5. Also, there is a difference between the constraining of a circumcised or baptized people, to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized, which were not formerly engaged; because, actual members of a Church have not even that liberty as others have, to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements, and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things, and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>

<blockquote><p>8. They [civil magistrates] may and ought to make such [spiritual seducers] incapable of public places of trust, and remove them from such: Because, 1. They cannot be supposed to employ their power singly. 2. Because such trust agreeth not to men and subjects as such, but are voluntarily conferred as tokens of respect put upon men eminently qualified, and as may be for the good of the commonwealth: And therefore it cannot be justly accounted a marring of their liberty as men or subjects. Upon this ground was Maachah the mother of Asa removed from being Queen, or having any government, 1 Kings 15:13; 2 Chron. 15:16, yet it cannot be said she was wronged when she was so dealt with.</p></blockquote>

<blockquote><p>In affirming that the church discipline of the Scottish Reformation is that which principally distinguishes it from the Reformation achieved in other countries, I would not be understood to mean that our fathers alone of all the Reformers taught that Christ has given commandment and authority to the church, to watch carefully over the deportment of her members, admonishing and if necessary casting out those who wantonly violate the law of God.

This was no peculiarity of theirs; nor were they singular even when they taught that the duty and the responsibility connected with the exercise of discipline belong to the church exclusively, and he quite beyond the province of the civil magistrate. These principles (and it is well to remember the fact) are embodied in the public Confessions of nearly all the reformed churches; they are to be found in the Augsburg Confession and other symbolical books of the Lutheran church, in the Gallican and second Helvetic Confessions also, as well as in the documents of the Scottish Reformation.

The distinguishing and honourable peculiarity of our fathers was this, that they not only united their solemn testimony to that of their foreign brethren regarding the law of Christ on the subject of church discipline, but inculcated that law with an energy, and reduced it to practice with a fidelity and persistency unparalleled elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-binnie.html">William Binnie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church Discipline of the Scottish Reformation in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Aquinas holdeth with Isidore, that a human Law (among other conditions of it) must both be necessary for removing of some evil, and likewise profitable for guiding us to some good. … Human Laws (in Mr. [Richard] Hooker’s judgment) must teach what is good, and be made for the benefit of men. Demosthenes describeth a Law, to be such a thing cui convenit omnibus parere, which it is convenient for every one to obey. Camero [John Cameron] not only alloweth us to seek a reason of the Church’s Laws (non enim (saith he) verae Ecclesiae libet leges ferre quarum non reddat rationem. It pleaseth not the true Church to make and publish Laws whereof she giveth not a reason:) but he will likewise have us, in such things as concern the glory and honour of God, not to obey the Laws of any Magistrate, blindly and without a reason. …

From Scripture we learn that neither hath the Magistrate any power, but for our good only [Romans 13:4], nor yet hath the Church any power, but for our edification only [Ephesians 4:12]. Law-makers therefore may not enjoin quod-libet, that which liketh them, nay nor always quod licet, that which is in itself lawful, but only quod expedit, that which is expedient and good for edifying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), prefatory epistle.</span></figcaption>

<blockquote><p>[I]t is impossible, in my mind, for a reflecting and unprejudiced Christian to read the history of the progress of the Reformation on the continent of Europe and in our British isles, without perceiving that the doctrine of the Reformers, respecting the advantages of a National Establishment of Religion, had its orthodoxy manifested experimentally before the whole world,—in so much, that it is true beyond all question, that, but for the interposition of the civil state on behalf the Reformation, the current of intellectual, moral, and spiritual improvement would have been rolled backwards, and Papal Rome would have triumphed in every other land as she did in the case of ill fated Spain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of civil establishments of religion in Reformed Presbyterian</cite></span></figcaption>

</figure><figure class="quote" id="q-dff4cde231" data-kw="">
<blockquote><p>But for the better opening and confirming of this we must call to mind how the most high God, the supreme Governor of all churches and states in the world, hath been pleased, for the more orderly government of both, to settle a distinct power in each, the power of the keys in the church, and the power of the sword in the state, answerable to the two essential parts of man, his soul and his body; for the power of the keys committed to the church, that reacheth to the soul only, not to the body; and the power of the sword committed to the civil magistrate, that reacheth to the body only, not to the soul; but both together they have influence both upon the soul and body, or outward man.

And though both these powers be united in God, the fountain of all power, yet when derived from Him they are still separated from one another, so that they are not seated together in one and the same person; but the civil magistrate, to whom the power of the sword is granted, to him is the power of the keys denied; and the church, to which the power of the keys is granted, to it is the power of the sword denied. And therefore was Peter, who had the power of keys, commanded to put up his sword, Matt. xxvi. 52, and Uzziah, who had the power of the sword, punished for using the keys, 2 Chron. xxvi.; so that the priest hath no power to execute any part of the king’s office, neither hath the king any power to execute any part of the priest’s office; but these being two distinct offices and ordinances appointed by God, he that hath the keys must use them, not the sword, and he that hath the sword must use it, and not the keys.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 557.</span></figcaption>

</figure><figure class="quote" id="q-a536f6c78d" data-kw="">
<blockquote><p>And if any have fallen into a grievous fault known unto the congregation and, being reprehended, hath not truly repented, for which cause he may deserve to be driven forth of the church for a time and to be bound, until he make amends and till he make public signification to the church of his true repentance, let such a brother be excluded out of the church and be bound.

But when he hath repented, let him be loosed, received into favour and admitted into his former communion. This is the first discipline, the end whereof is that every one should live unto God and at last also die in the Lord Jesus.</p></blockquote>

<blockquote><p>Ecclesiastical judgment is spiritual, in distinction from that which is civil or secular. The government of the church and the government of the state, with the judgment which is competent to those who respectively administer them, differ widely from one another.

They differ in their origin. Both indeed are derived from God, who is the original fountain of all authority and justice. But civil government is from God as Creator; ecclesiastical government from Christ as Mediator. The former holds of him as King of nations, the latter as King of saints. The law of nature, written on the hearts of all men, is sufficient to direct in all that is essential to the former; the latter is founded on the law supernaturally revealed in the scriptures. Civil magistrates and judges are “the ministers of God;” ecclesiastical rulers are “the ministers of Christ,” and pronounce judgment in his name, or by his authority. “Jesus said, All power is given unto me in heaven and in earth.”

They differ in their objects. Civil judgment is pronounced on things that pertain to this life and the external man—his property, his life, his liberty, or his good name; ecclesiastical judgment, on things that pertain to the welfare of the soul and to the life to come. If the former has to do with religious matters, it is either upon the ground that religion in general is conducive to the welfare of secular society, or because particular religious acts interfere with civil rights; if the latter have to do with civil matters, it is only in so far as they relate to the conscience. If at any time the same actions, materially considered, fall under the cognizance of both jurisdictions, as in the case of theft or murder, the formal light in which they are judged by each is different; the secular judicatory proceeds against them as crimes, which injure civil society; the ecclesiastical as scandals, which mar the purity of the church.

They differ in their ends. The end of secular judgment, in subordination to the glory of God, is the external peace and temporal prosperity of men, or, as the apostle expresses it, “that we may live quiet and peaceable lives in all godliness and honesty.” The end of ecclesiastical judgment, in subordination to the glory of God by Christ, is the promoting of the spiritual and eternal interests of man, or, in the words of the same apostle, “that the spirit may be saved in the day of the Lord Jesus.”

They differ, so far as their subjects are concerned, in their extent. Civil judgment extends to all who belong to the commonwealth; spiritual judgment is confined to those who have been embodied into a church state.

They differ in their sanctions, and in the means which they employ to accomplish their ends. Civil authority is supported by the power of the sword, ecclesiastical authority by the power of the word, or, as it is sometimes designed, of “the keys.” By the former, judgment is executed on the delinquent, according to the nature of his crime, to imprisonment, banishment, confiscation of goods, or death; by the latter, judgment is executed on the offender to admonition, rebuke, suspension from sealing ordinances, or excommunication.

In fine, even when the same offences fall under the cognizance of both judicatures, the issue may be different. The ecclesiastical judges may pronounce the highest spiritual sentence against one whom the secular authorities, in the exercise of prudent policy, may spare; and the latter may inflict capital punishment on an individual whom the former may receive and absolve at the last hour, as in the case of a penitent murderer or traitor.

From these premises it follows, that, as there is an exercise of judgment in the church essentially distinct from that which is civil and criminal in the state; so, on the one hand, the two jurisdictions, so far from being inconsistent with one another, are fitted for being mutually helpful in the advancement of objects common to both; and, on the other hand, the ecclesiastical judicature, not being derived from the secular, is not subordinate to it, and is equally competent and necessary under Christian and Heathen rulers.

Even during the Jewish dispensation, under which civil and religious matters were more intimately conjoined than under the Christian, the two jurisdictions were kept distinct. A line of demarcation between the office of the civil judge, and that of the priest, was laid down in the Mosaic code; and in the arrangements “for the judgment of the Lord, and for controversies,” made in the days of the reforming Jehoshaphat, we find Amariah the high priest appointed as president “in all matters of the Lord,” and Zebadiah, the ruler of the house of Judah, “for all the king’s matters.</p></blockquote>

<blockquote><p>For the nation and kingdom that will not serve thee shall perish, yea, those nation shall be utterly wasted.” (Isaiah 60:12) …

If the expression does not ascribe to the Church any control over the State, it still more clearly forbids the idea that the State may exercise control over the Church. This, indeed, if it were at all permitted, would be to reverse the statement of the text, and to make out the line of duty to be, not that nations should serve the Church, but that the Church should serve the nations of the earth.

Whatever subjection the Church, both collectively and in her individual members, may give the State in civil things, she is not only free from this subjection in spiritual matters — that is, in all those things in which she is a church — in all those matters in which her being as a Church consists — but is warranted to expect and to claim the service of the State. Not only will the fulfilment of the prediction in the text “make an end of the Erastian controversy,” [George Gillespie] — the mere announcement should have prevented its rise.</p></blockquote>

<blockquote><p>In the midst of the debates within the Free Church of Scotland surrounding a potential union with the United Presbyterians (Voluntaries), Horatius Bonar argued against any compromise of the Free Kirk’s position on church-state relations:

EDINBURGH FREE CHURCH PRESBYTERY.

THE UNION QUESTION. …

Dr [Horatius] BONAR brought forward the following overture, of which he had given notice:-

Whereas the prosecution of the negotiations for union on their present footing threatens to issue in the compromise of the distinctive principles of this Church, and is already producing most serious internal dissensions, it is humbly overtured by the Free Presbytery of Edinburgh to the ensuing General Assembly that said negotiations be discontinued, the Assembly at the same time recommending the cultivation of brotherly intercourse and co-operation in every work of faith and labour of love in which the negotiating Churches can consistently with their principles unite.

Dr Bonar, in supporting the overture, maintained that, while union among Presbyterian Churches was eminently desirable, it was absolutely-essential that the Free Church should maintain her distinctive principles. He held that the United Presbyterian Church had not made the slightest concession of their principles, while the Free Church had done so, and this it was which had led to the present crisis. He proceeded at great length to expound the distinctive principles of the Free Church, dwelling mainly upon the relation of the Church and the State.

He contended that the question of the relation of the Civil Magistrate to the Church had not been an open question in the past history of the Church; and that, if they were to found a new Church leaving that an open question, they would stand alone in the face of the Churches in Christendom – they would be proclaiming, not merely that they had altered their creed, but that the Churches of the Reformation were wrong. … He protested against the proposal to leave any of the distinctive principles of the Church as open questions, maintaining that, if such a proposal were carried out, the questions would be open, but the mouths of the members of the Church would be shut, and their hands would be tied. …

<blockquote><p>MINISTERS should preserve a People from Corruption by good Government. God has given power of ruling to Ministers. Heb. 13.13. Obey them that rule you and submit to them. He has given a power of binding and losing. Mat. 16.19. What thou shalt bind on earth shall be bound in heaven. And he appoints that they rule well, 1 Tim 5.17. Ministers have a corrcive [corrective] power to execute censures on them that are obstinate.

Ministers must have a tender and compassionate spirit, but when Men are sturdy and rebellious, severity is compassion; executing Ecclesiastical censures is a terror to evil doers: this is a proper means that their spirits may be saved in the day of the Lord Jesus, 1 Cor. 5.5. Though private revenge is utterly forbidden, yet they are to revenge disobedience: 2 Cor. 10.6. Having in a readiness to revenge all disobedience. This is the way to purge out the old leaven, to bring Men to repentance, and to put a stop to growing iniquities, that the Land be not defiled.</p></blockquote>

</figure><figure class="quote" id="q-987261b4ba" data-kw="">
<blockquote><p>[I]f any party whatever, but especially if the State, or civil power, shall claim the right of controlling the government which Christ has appointed in the hands of Church office-bearers, they must refuse obedience to that claim, must make up their minds to suffer, if need be, the loss of all things, rather than yield to it. And this because they are only servants, ministers, stewards, entrusted by the alone Master and King with a certain authority and duty.

Were they princes — as Rome’s ecclesiastics claim to be — then might they be free to consider the question, at least, whether it were not expedient, in certain circumstances, to resign the government of the Church into other hands. But they are stewards only, mere administrators, and have no discretion in any such matter. They hear the voice of the Master, “The flock over which the Holy Ghost hath made you overseers” — “put away from among yourselves that wicked person” — “whatsoever ye shall bind on earth, shall be bound in heaven; and whatsoever ye shall loose on earth, shall be loosed in heaven.”

And the government which they have thus received, they must discharge on their responsibility to Christ alone. But especially, to yield it up into the hands of the State, were to yield it, as we have seen, into the hands of another king, another master, and so were nothing less than treason against the only King and Head of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-j-brown.html">Charles J. Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Disruption Question Stated. Reprinted (with some additions) from the Free Church Record, at the request of the Free Presbytery of Edinburgh</cite>, (Edinburgh: T. Nelson and Sons, 1863), pp 7-8.</span></figcaption>

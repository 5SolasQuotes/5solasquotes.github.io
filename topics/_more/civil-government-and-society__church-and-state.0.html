<blockquote><p>…I do hereby grant and declare, that no person or persons, inhabiting in this province or territories, who shall confess and acknowledge One almighty God, the Creator, Upholder and Ruler of the World; and profess him or themselves obliged to live quietly under the civil government, shall be in any case molested or prejudiced, in his person or estate, because of his or their conscientious persuasion or practice… And all persons who also profess to believe in Jesus Christ, the Savior of the World, shall be capable (notwithstanding their other persuasions and practices in point of conscience and religion) to serve this government in any capacity, both legislatively and executively…</p></blockquote>

</figure><figure class="quote" id="q-d3f66e3725" data-kw="">
<blockquote><p>III. …to be elected by virtue of this constitution, they shall jointly in the house of representatives choose… a governor and commander-in-chief, a lieutenant-governor… and a privy council, all of the Protestant religion… … XII. …and that no person shall be eligible to a seat in the said senate unless he be of the Protestant religion… XIII. …No person shall be eligible to sit in the house of representatives unless he be of the Protestant religion… XXXVIII. That all persons and religious societies who acknowledge that there is one God, and a future state of rewards and punishments, and that God is publicly to be worshipped, shall be freely tolerated. The Christian Protestant religion shall be deemed and is hereby constituted and declared to be, the established religion of this State. That all denominations of Christian Protestants in this State, demeaning themselves peaceably and faithfully, shall enjoy equal religious and civil privileges… …And that whenever fifteen or more male persons, not under twenty-one years of age, professing the Christian Protestant religion, and agreeing to unite themselves in a society for the purposes of religious worship, they shall (on complying with the terms hereinafter mentioned) be, and be constituted a church, and be esteemed and regarded in law as of the established religion of the State, and on a petition to the legislature shall be entitled to be incorporated and to enjoy equal privileges. …each society so petitioning shall have agreed to and subscribed in a book the following five articles, without which no agreement or union of men upon pretence of religion shall entitle them to be incorporated and esteemed as a church of the established religion of this State: 1st. That there is one eternal God, and a future state of rewards and punishments. 2nd. That God is publicly to be worshipped. 3rd. That the Christian religion is the true religion. 4th. That the holy scriptures of the Old and New Testaments are of divine inspiration, and are the rule of faith and practice. 5th. That it is lawful and the duty of every man being thereunto called by those that govern, to bear witness to the truth.</p></blockquote>

</figure><figure class="quote" id="q-0879226770" data-kw="">
<blockquote><p>The controversy which has been moved concerning the civil magistrate’s vice-gerentship, and the holding of his office of, and under, and for Jesus Christ, as He is Mediator, has a necessary coherence with, and dependence upon, another controversy concerning a twofold kingdom of Jesus Christ… It is a distinction which Mr. Hussey [an Erastian] cannot endure, and no marvel, for it overturns the foundation of his opinion. He looks upon it as an absurd assertion, p. 25, ‘Shall He have one kingdom as Mediator, and another as God?’ He quarrels all that I have said of the twofold kingdom of Christ, and will not admit that Christ, as Mediator, is King of the church only, p. 25-27, 35-37. … He holds that Christ, as Mediator, has placed the Christian magistrate under Him, and as his vice-gerent, and has given him commission to govern the church, which, if he or any man can prove from the word of God, it will go far in the decision of the Erastian controversy… Mr. [Thomas] Coleman [c.1597-1646] in his Re-Examination, p. 19, was fearful to set his foot upon so slippery ground. He was loath to adventure upon this assertion, that magistracy is derived from Christ, as Mediator, by a commission of deputation and vice-gerentship… Wherefore he made a retreat and held him at this: ‘That magistracy is given to Christ to be serviceable in his kingdom.’ But out steps Mr. Hussey and boldly avers a great deal more. I much mistake if he shall not be made either to make a retreat, as Mr. Coleman did, or to do worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/erastians.html">Erastians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>George Gillespie, Aaron’s Rod</cite>, pp. 90, 96-97</span></figcaption>

<blockquote><p>…the Church and State in Israel were two incorporations formally distinguished. And I see not, but those who do confound them [the Erastians], may also say that the Christian State and the Christian Church be all one State, and that the government of the one must be the government of the other; which were a confusion of the two kingdoms. It is true, God has not prescribed judicials to the Christian State, as He did to the Jewish State, because shadows are now gone when the body Christ is come; but God’s determination of what is morally lawful in civil laws is as particular to us as to them; and the Jewish judicials did no more make the Jewish State the Jewish Church, than it made Aaron to be Moses and the priest to be the king and civil judge…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. Travis Fentiman, ‘Samuel Rutherford on the Judicial Laws of Moses: Excerpts Arranged Topically’, pp. 4-6, 23 | The Due Right of Presbyteries (1644)</cite>, p. 70</span></figcaption>

</figure><figure class="quote" id="q-810bf8d936" data-kw="">
<blockquote><p>But we read not” (says Erastus) “where Christ has changed those laws in the New Testament.” It is true, Christ has not said in particular: “I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated till the evening;” nor has He said particularly of every carnal ordinance and judicial law: “it is abolished.” But we conceive the whole bulk of the Judicial Law, as judicial, and as it concerned the republic of the Jews only, is abolished, though the moral equity of all those be not abolished… … But sure Erastus errs who will have all such to be killed by the magistrate under the New Testament because they were killed by him in the Old: Why, but then the whole judicial law of God shall oblige us Christians as Carolostadius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them [the malefactors], so was it a mysterious teaching of us how God hated such and such sins; and mysteries of that kind are gone with other shadows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. Travis Fentiman, ‘Samuel Rutherford on the Judicial Laws of Moses: Excerpts Arranged Topically’, pp. 4-6, 23 | Divine Right of Church Government (1646)</cite>, pp. 383, 493-94</span></figcaption>

</figure><figure class="quote" id="q-979a88a1b4" data-kw="">
<blockquote><p>There is some authority in the bishops derived from the king which may be acknowledged [as] lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>

<blockquote><p>5. Did you know before you wrote this, that all such as we persuade men to hear, have by oath renounced their Christian liberty? what oath is it that you mean? If you mean the Oath of Supremacy or Allegiance, unless Popery be Christian liberty, we know of none such which these renounce. And I know of no other oath, except that of canonical obedience in licitis et honestis [in things lawful and honest]. And for that: 1. I find not that the act or canons do impose it on those that come for ordination (nor am so well skilled in the law as to know by what law it is done). 2. I know that men have been ordinarily ordained without it. And to such your reason for separation is vain. 3. Mr. [William] Bradshaw and other old non-conformists were wont to say that they obeyed the diocesans and so did promise them obedience only as they are the king’s officers, deputed for the exercise of that civil or coercive power which magistrates have in causes called ecclesiastical [i.e. circa sacra]. And what liberty does that give away? 4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.? 5. That indeed they are nothing else, as to the whole discharge and exercise of their office, but the servants of men, is another slander and untruth. He that is a servant of Christ, and a true pastor of a Christian Church, and a sound preacher of the Gospel, and a helper of believers’ faith, and a lover of the people’s souls, and a diligent upright laborer for men’s salvation, is something else than a servant of man (even in the discharge of their ministerial office). But such are many of the conformable ministers: Therefore prove if you can that Dr. Preston, Sibbes, Stoughton, Whittaker, Mr. Bolton, Whateley, Gataker, Fenner, and all the late [Westminster] Assembly save eight or nine at most (being all conformists) were nothing else but the servants of men, and not at all the servants of Christ. Your Father thought otherwise of Mr. Bolton, and perhaps they were both as wise as you. Prove now that Mr. [William] Gurnall, Mr. [John] Trapp, Dr. [John] Lightfoot, Dr. Walker, Mr. Langley, and many others that I can name that are worthy men in London and round about it, are nothing else but the servants of men? And will it not be as hard to prove one to be a servant of Christ who serves Satan by falsehood and malice, and calumniating Christ’s Churches and servants, as those that are thus the servants of men.</p></blockquote>

</figure><figure class="quote" id="q-752bf8d5c6" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called [to the Savoy Conference] by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XI. They spake not against episcopacy, as it is a presidency among and over presbyters differing in degree, and not in office, called ‘order’, and that in a Church of the lowest species. … XIII. They said nothing against metropolitans, patriarchs, lay-chancellors, commissaries, officials, surrogates, archdeacons, etc. as officers of the king, appointed to do nothing (besides the sacred ministry if they be clergymen) but what belongs to magistracy [according to circa sara]. XIV. They said nothing against any promise of obedience to them only in the capacities and in the exercise of the power forementioned. XV. Much less did they ever oppose or question swearing to the king, according to the oaths of Allegiance and Supremacy: And I with diverse others also being (for some ends) entered as his chaplains in ordinary, took also that Oath of Fidelity which the king’s household servants take. XVI. We never were for any dishonoring of kings by public excommunications, much less by subjects or foreigners, whom kings never choose to be their pastors; but only in case of necessity, for such a denial of sacramental communion to them, as Bishop Andrewes in Tortura Torti and Bishop Bilson [The True Difference between Christian Subjection &amp; Unchristian Rebellion, pt. 3, pp. 376-77] plead for, which is but to forbear ourselves a sinful act. XVII. We never pleaded for any elders’ (or chancellors’) power of the keys, who are but laymen. XVIII. We never held that magistrates are bound to add their force by the sword to the censures of the Church as such, and to punish men more because the Church has by excommunication cast them out, or because they are not reconciled. XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

<blockquote><p>1. We do not question the duty of obeying the king and all his officers, governing as magistrates by the power of the swords which the king may commit to them. If bishops or lay-chancellors be made magistrates, we will obey them as such: And therefore when they summon us, we appear and answer, because the king authorizes them. And many non-conformists have defended the taking the promise [of canonical obedience to a bishop or ordinary in things lawful and honest] as supposing that the word ‘ordinary’ signifies only the judge of a court set up by the king as supreme governor by the sword in matters and over persons ecclesiastical as well as civil, according to the true sense of the Oath of Supremacy.</p></blockquote>

<blockquote><p>A class of subjects same to be discussed in the latter part of the sixteenth century which had not engaged so much of the attention of the earlier Reformers–especially the Erastian and the Prelatic controversies–and in the discussion of these matters Beza bore his part nobly as an able and faithful champion of the truth. The Erastian controversy, indeed, as conducted between Erastus and Beza, turned mainly upon the particular subject of the excommunication of church members; and it was not till the following century, that the whole of the principles usually regarded by Presbyterian divines as comprehended in the Erastian controversy, were subjected to a full and thorough discussion. Still, even at that early stage, the quested was mooted, on which the entire progress of the subsequent discussion, down even to our own day, has made it more and more manifest that the whole controversy hinges–viz. whether or not Christ has appointed in His church a government, distinct from, independent of, and in its own province not subordinate to, civil magistracy. And on this great question, as well as on the particular topic of excommunication comprehended under it, Erastus took the side which has always been supported by politicians, sycophants [obedient flatterers], and worldlings, while Beza ably defended that which has been adhered to by all intelligent and conscientious Presbyterians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation, ch. 7, ‘Calvin &amp; Beza’</cite>, pp. 350-51</span></figcaption>

<blockquote><p>The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/arminians.html">Arminians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>William Cunningham, Historical Theology, vol. 2</cite>, pp. 577-78</span></figcaption>

<blockquote><p>…Lewis Du Moulin… a son of the famous Molinaeus, who took so active a part in the Arminian controversy, and was long the leading divine in the Protestant Church of France. Lewis settled in England, and obtained a chair in Oxford during the Commonwealth. He adopted Independent, or Congregational, views on church government, chiefly, it would appear, because he thought them more favorable to Erastianism than Presbyterian principles, a notion for which he could plead the authority of Congregational divines of the highest eminence–namely, the five dissenting brethren, as they were called, in the Westminster Assembly. They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>

<blockquote><p>The Admonition annexed to the Queen’s Injunctions. The Queen’s Majesty being informed that in certain places of this realm, sundry of her native subjects, being called to ecclesiastical ministry in the Church, be by sinister persuasion and perverse construction induced to find some scruple in the form of an oath which by an act of the last parliament is prescribed to be required of diverse persons, for the recognition of their allegiance to her Majesty, which certainly neither was ever meant, ne by any equity of words or good sense, can be thereof gathered: Would that all her loving subjects should understand that nothing was, is, or shall be meant or intended by the same oath, to have any other duty, allegiance, or bond required by the same oath than was acknowledged to be due to the most noble kings of famous memory, king Henry VIII, her Majesty’s father, or king Edward VI, her Majesty’s brother. And further her Majesty forbids all manner her subjects to give ear or credit to such perverse and malicious persons which most sinisterly and maliciously labor to notify to her loving subjects how by the words of the said oath, it may be collected the kings or queens of this realm, possessors of the crown, may challenge authority and power of ministry of divine offices in the Church, wherein her said subjects be much abused by such evil disposed persons. For certainly her Majesty neither does, ne ever will challenge any other authority than that was challenged and lately used by the said noble kings of famous memory, king Henry VIII, and king Edward VI, which is and was of ancient time due to the imperial crown of this realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Consideration of the Oath of the King’s Supremacy… (London: Hills, 1660) 27 pp.</cite>, pp. 3-4</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Admonition annexed to the Queen’s Injunctions. The Queen’s Majesty being informed that in certain places of this realm, sundry of her native subjects, being called to ecclesiastical ministry in the Church, be by sinister persuasion and perverse construction induced to find some scruple in the form of an oath which by an act of the last parliament is prescribed to be required of diverse persons, for the recognition of their allegiance to her Majesty, which certainly neither was ever meant, ne by any equity of words or good sense, can be thereof gathered: Would that all her loving subjects should understand that nothing was, is, or shall be meant or intended by the same oath, to have any other duty, allegiance, or bond required by the same oath than was acknowledged to be due to the most noble kings of famous memory, king Henry VIII, her Majesty’s father, or king Edward VI, her Majesty’s brother. And further her Majesty forbids all manner her subjects to give ear or credit to such perverse and malicious persons which most sinisterly and maliciously labor to notify to her loving subjects how by the words of the said oath, it may be collected the kings or queens of this realm, possessors of the crown, may challenge authority and power of ministry of divine offices in the Church, wherein her said subjects be much abused by such evil disposed persons. For certainly her Majesty neither does, ne ever will challenge any other authority than that was challenged and lately used by the said noble kings of famous memory, king Henry VIII, and king Edward VI, which is and was of ancient time due to the imperial crown of this realm.”

— John Tombes, A Serious Consideration of the Oath of the King’s Supremacy… (London: Hills, 1660) 27 pp., pp. 3-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Admonition+annexed+to+the+Queen%E2%80%99s+Injunctions.+The+Queen%E2%80%99s+Majesty+being+informed+that+in+certain+places+of+this+realm%2C+sundry+of+her+native+subjects%2C+being+called+to+ecclesiastical+ministry+in+the+Church%2C+be+by+sinister+persuasion+and+perverse+construction+induced+to+find+some+scruple+in+the+form+of+an+oath+which+by+an+act+of+the+last+parliament+is+prescribed+to+be+required+of+diverse+persons%2C+for+the+recognition+of+their+allegiance+to+her+Majesty%2C+which+certainly+neither+was+ever+meant%2C+ne+by+any+equity+of+words+or+good+sense%2C+can+be+thereof+gathered%3A+Would+that+all+her+loving+subjects+should+understand+that+nothing+was%2C+is%2C+or+shall+be+meant+or+intended+by+the+same+oath%2C+to+have+any+other+duty%2C+allegiance%2C+or+bond+required+by+the+same+oath+than+was+acknowledged+to+be+due+to+the+most+noble+kings+of+famous+memory%2C+king+Henry+VIII%2C+her+Majesty%E2%80%99s+father%2C+or+king+Edward+VI%2C+her+Majesty%E2%80%99s+brother.+And+further+her+Majesty+forbids+all+manner+her+subjects+to+give+ear+or+credit+to+such+perverse+and+malicious+persons+which+most+sinisterly+and+maliciously+labor+to+notify+to+her+loving+subjects+how+by+the+words+of+the+said+oath%2C+it+may+be+collected+the+kings+or+queens+of+this+realm%2C+possessors+of+the+crown%2C+may+challenge+authority+and+power+of+ministry+of+divine+offices+in+the+Church%2C+wherein+her+said+subjects+be+much+abused+by+such+evil+disposed+persons.+For+certainly+her+Majesty+neither+does%2C+ne+ever+will+challenge+any+other+authority+than+that+was+challenged+and+lately+used+by+the+said+noble+kings+of+famous+memory%2C+king+Henry+VIII%2C+and+king+Edward+VI%2C+which+is+and+was+of+ancient+time+due+to+the+imperial+crown+of+this+realm.%E2%80%9D%0A%0A%E2%80%94+John+Tombes%2C+A+Serious+Consideration+of+the+Oath+of+ <blockquote><p>Objection 3: If kings be governors in all causes over all persons, then may they dissolve churches and their government, and mold and order them as they will. Answer: So far as Church constitution, government and ordering is by Christ’s appointment, or such example which has the force of an institution of Christ, it may not be altered by a king; But in such things as are left to human prudence, and there is a concernment of the weal-public, kings have authority to order them so, as that they tend to the real good and advantage of the churches of Christ and the glory of God, which is the highest and ultimate end of all. Objection 4: This will make the use of synods and assemblies of pastors to determine things of religion and to order government unnecessary, since the determination of all will lie in the king’s breast. Answer: Though statute-laws require the king’s assent, and the government is to be exercised in his name, by his commission, yet are not debates in parliament and passing bills by both Houses, nor consultations with judges, nor their decisions of cases unnecessary [but assumed in the oath]: The like is to be said of the use of synods and assemblies of Pastors and learned men, though the calling of them, and validity of their canons, that is rules, in respect of the imposing them on others with civil penalties, require the king’s concurrence. Objection 5. This has occasioned great evils in so much that persecution has been raised against godly persons as heretiques and schismatics, when princes have been misled so as to burn, banish, imprison and otherwise to afflict persons judged by prelates and others to be such. Answer: ‘Tis true this has fallen out when princes ignorant of the true religion, corrupted in their education, perverted by seducers and ungodly guides in their judgments have yielded too much to the misinformation of others, and so have been unhappy in the abuse of their government to the great hurt in life, liberty and estate of innocent persons: And the like has been in mal-administration of civil affairs through the like causes: yet the power and authority in neither is to be denied for some abuse: for that would introduce a worse evil of anarchy and mischievous confusions. On the other side when princes have been good, and have used such good counselors, as Jehoiada was to Joash, their government in religion has been of great advantage to the Church of Christ. And as things have stood in England, it was the means under God whereby Popery was expelled and the protestant Reformation was established. … Objection 8: The acknowledgement of this supremacy of the king has been opposed by sundry godly protestants who have in their writings excepted against it, as Calvin and the Century writers of Magdeburg. Answer: Tis true they excepted against the title of Head of the Church given to King Henry VIII, as Stephen Gardiner [a Papist] and such like persons misreported it, as if it gave to the king an uncontrollable authentic power, to determine of faith and worship of God: but when those learned protestants better understood what was meant by it, they withdrew their exceptions, as doctor Rainold shows in his Conference with Hart in the Tower [1584], ch. 10 [pp. 673-74]. Objection 9: Many godly persons are offended with the taking and defending the lawfulness of the taking of this oath as fearing it many tend to the taking away those liberties of their consciences in religion, which are dearer to them then their lives: and being jealous of those who take it, lest they betray those liberties. Answer: It is to be considered by those conscientious persons who make this objection that the takers, and defenders of the taking of this oath do apprehend that the imposing this oath was for the excluding the Pope’s jurisdiction and other foreign power, as the admonition of Queen Elizabeth here prefixed shows… But they that have taken it, or conceive they may take it if imposed, do it, as being satisfied in their consciences by the foregoing arguments or such like that they do but what they may do lawfully without offence, and hope that it will fall out as it did in the business of the altar of Ed, Josh. 22, that a right intelligence of their fact will prevent any breach between them and others and unite them more closely.</p></blockquote>

<blockquote><p>What was used in the days of Henry VIII and Edward VI appears by the book of acts and monuments and statutes in their days, to wit, the rejecting the Pope’s jurisdiction, appointing visitors, judging and deposing some bishops, commands to take down images, causing divine service to be in the English tongue, the Bible in the English tongue to be in churches, with many other things of the like kind. The promise to defend them is ‘to our power’ whether by opposing the bringers in of a foreign power, especially the Pope’s or by aiding the king in the right use of this authority, neither is the power granted which may not be lawfully used or exercised, nor is the abuse of it required to be defended.</p></blockquote>

<blockquote><p>The immediate reason for the rewriting of the earlier manuscript [of Lex Rex by S. Rutherford] was the publication, in January 1644, of a royalist treatise, Sacro-Sancta Regum Majestas… Its author was John Maxwell, the deposed ‘Canterburian’ Bishop of Ross and one of the major architects of the notorious Scottish Prayer Book. Rutherford found this treatise by an old enemy deeply provocative, and over the winter, spring and summer of 1644, he spent much of his free-time away from the Westminster Assembly writing a detailed refutation… Maxwell had written his book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.” – Coffey, Politics, Religion, pp. 148-49 Reformed Christian Politics: “In the seventeenth century, divine-right absolutists like Roger Mainwaring and John Maxwell were Arminian in their theology. Though this seems counterintuitive, Arminian doctrine is consistent with divine-right political theory, as it allows them to affirm God’s active role in establishing kings without violating human free will. Kingship, for them, comes not by determined providence according to divine concurrence, but rather in a special, divine act that has occurred above and apart from human action. God’s choice to make a man king could not be actualized via, or in, man’s choosing, for that would violate free will (that is, it would require Calvinist views of divine sovereignty). Nor could they say that God makes a man king subsequent to man’s choosing, for that would deny God’s active role in the choosing. Instead, God chooses one man to be king, and that man is, thereby, king, and God requires the people to obey him as such. God is active, and the people are passive. Indeed, Rutherford, in Lex, Rex, blamed John Maxwell’s divine absolutism on his Arminianism. In Reformed political doctrine, on the contrary, both God and man are active in the making of one man as king, and even in determining the political form of the commonwealth.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The immediate reason for the rewriting of the earlier manuscript [of Lex Rex by S. Rutherford] was the publication, in January 1644, of a royalist treatise, Sacro-Sancta Regum Majestas… Its author was John Maxwell, the deposed ‘Canterburian’ Bishop of Ross and one of the major architects of the notorious Scottish Prayer Book. Rutherford found this treatise by an old enemy deeply provocative, and over the winter, spring and summer of 1644, he spent much of his free-time away from the Westminster Assembly writing a detailed refutation… Maxwell had written his book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.” – Coffey, Politics, Religion, pp. 148-49 Reformed Christian Politics: “In the seventeenth century, divine-right absolutists like Roger Mainwaring and John Maxwell were Arminian in their theology. Though this seems counterintuitive, Arminian doctrine is consistent with divine-right political theory, as it allows them to affirm God’s active role in establishing kings without violating human free will. Kingship, for them, comes not by determined providence according to divine concurrence, but rather in a special, divine act that has occurred above and apart from human action. God’s choice to make a man king could not be actualized via, or in, man’s choosing, for that would violate free will (that is, it would require Calvinist views of divine sovereignty). Nor could they say that God makes a man king subsequent to man’s choosing, for that would deny God’s active role in the choosing. Instead, God chooses one man to be king, and that man is, thereby, king, and God requires the people to obey him as such. God is active, and the people are passive. Indeed, Rutherford, in Lex, Rex, blamed John Maxwell’s divine absolutism on his Arminianism. In Reformed political doctrine, on the contrary, both God and man are active in the making of one man as king, and even in determining the political form of the commonwealth.”

<blockquote><p>Then the true state of the question is not whether the sword be a means of conversion of men to the true faith, nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [which is denied], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers, nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty. But whether or no ought the godly and Christian prince restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>

<blockquote><p>I offer (Worthy Reader) to your impartial and ingenuous censure these my ensuing thoughts against Liberty of Conscience, from which way, looking to me with a face of atheism, I call the adversaries, Libertines, not intending to reach a blow to any godly man, or to wound those who out of weakness are captivated with that error, but to breed in the hearts of the godly a detestation of that way, which in truth has its rise from Libertinism, and savors rankly of wide, loose and bold atheistical thoughts of the majesty of God, as if our conscience had a Prerogative Royal beside[s] a rule… and our faith and hope [according to it] must be resolved in the first principle of skepticism. So it seems to me, for the young daughters of the mind, the simplest acts of apprehending, knowing, believing God and divine truths are innocent, harmless ill-less soul-works, being from under all dominion of either free-will or a divine Law; and the mind [according to it, being] a free-born absolute Princess, can no more incur guiltiness in its operations about an infinite Sovereign God and his revealed will by this lawless way, than the fire in burning, the sun in enlightening, the stone in moving downward, be arraigned of any breach of Law, if toleration have place. All certainty of believing, all steadfastness, rooting and unmovable establishing in the truth, all life of consolations and comforts in the Scriptures, all peace of heavenly confidence, all joy unspeakable and full of glory, all lively hope, all patient and submissive waiting for the fruits of the harvest, all wrestling in prayer, all gloriation in tribulation and all triumphing in praising, all rejoicing in the Spirit, being bottomed on fallible opinions, on doubtful disputations of skeptics, may be the reelings of windmills, fair fancies and dreams; for who (say they) is infallible? and who hath known the mind of the Lord? so as the truth must be monopolized to any one sect or way? Who in faith or fullness of assurance can convince or rebuke gainsayers, heretics, or such as bring another doctrine, as those whom you so labor to convince and rebuke? 3. Conscience is hereby made every man’s rule, umpire, judge, Bible, and his God, which if he follow, he is but at the worst, a godly, pious, holy heretic, who fears his conscience more than his Creator, and is to be judged of you a saint. 4. Hence conscience being deified, all rebuking, exhorting, counter-arguing, yea all the ministry of the Gospel must be laid aside; no man must judge [a] brother [an] idolater, or brother Familist, or saints to be Socinians, or men of corrupt minds, perverse disputers, vain-janglers, wresters, rackers or torturers of Scripture, whose words eat as a canker, who subvert whole houses, who speak the visions of their own head and see false burdens, for all these who were of old, but are now quite gone out of the world; for who can make a window in any man’s soul and see there heart-obstinacy which only does essentially constitute the heretic, the blasphemer, the false prophet [according to them]? But is not brotherly forbearance, Christian indulgence a debt we owe to brethren, saints, and the truly godly in errors, and mind infirmities, which by a natural emanation or resultance get the fore-start of freewill? To which I shall speak in these few considerations: 1. It is much to be desired with the prayers and suits of the children of God that where there are two opinions, there may be one heart, that the Father of Spirits would unite the hearts of all the children of one Father and the heirs of one house. 2. Papists here have exceeded in boundless domination and tyranny over the consciences of men: and what ever is contrary to the lawless decrees of their councils and popes is an unexpiable heresy and cannot be purged but by fire and fagot. 2. Whoever refuse subjection of conscience to that enemy of Christ, and to that woman-mistress of witchcrafts, on whose skirts is found the blood of the martyrs of Jesus, is presently an heretic, and his arguments answered with burning-quick [alive]: this tyranny over conscience we disclaim; yet for that, ought not the other extremity of wild toleration be embraced. 3. We cannot think but all saints in this side of glory carry to Heaven with them errors, mistakes and prophesying in part [1 Cor. 13], and the fairest stars and lights in this lower firmament of the Church are clouded, and the benefit of the moon serves to enlighten the under garden of lillies, where ‘Christ feedeth, till the day break, and the shadows flee away.’ And here brotherly indulgence and reciprocation of the debt of compassionate forbearance of the infirmities one of another must have place. 4. Yet so, as there can be no conflict of grace against grace, nor can the taking off the foxes which destroy the vines be contrary to the gentleness and meekness of the saints in fulfilling the law of love and bearing one another’s burdens, nor can love seated essentially in a new born child of the second birth be contrary to the zeal of God in withstanding to the face a Saint looking awry, and walking not with a straight foot according to the truth of the gospel; which way if heeded in sincerity, should breed more union of hearts, and be a greater testimony of faithfulness to a straying sheep than our cruel meekness and bloody gentleness in a pretended bearing with tender consciences under a color of paying the debt of bastard love, while as we suffer millions to perish, through silence and merciless condolency with them in their sinful depraving of the truth.</p></blockquote>

skirts is found the blood of the martyrs of Jesus, is presently an heretic, and his arguments answered with burning-quick [alive]: this tyranny over conscience we disclaim; yet for that, ought not the other extremity of wild toleration be embraced. 3. We cannot think but all saints in this side of glory carry to Heaven with them errors, mistakes and prophesying in part [1 Cor. 13], and the fairest stars and lights in this lower firmament of the Church are clouded, and the benefit of the moon serves to enlighten the under garden of lillies, where ‘Christ feedeth, till the day break, and the shadows flee away.’ And here brotherly indulgence and reciprocation of the debt of compassionate forbearance of the infirmities one of another must have place. 4. Yet so, as there can be no conflict of grace against grace, nor can the taking off the foxes which destroy the vines be contrary to the gentleness and meekness of the saints in fulfilling the law of love and bearing one another’s burdens, nor can love seated essentially in a new born child of the second birth be contrary to the zeal of God in withstanding to the face a Saint looking awry, and walking not with a straight foot according to the truth of the gospel; which way if heeded in sincerity, should breed more union of hearts, and be a greater testimony of faithfulness to a straying sheep than our cruel meekness and bloody gentleness in a pretended bearing with tender consciences under a color of paying the debt of bastard love, while as we suffer millions to perish, through silence and merciless condolency with them in their sinful depraving of the truth.”

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience (London, 1649) | ‘To the Godly &amp; Impartial Reader’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+offer+%28Worthy+Reader%29+to+your+impartial+and+ingenuous+censure+these+my+ensuing+thoughts+against+Liberty+of+Conscience%2C+from+which+way%2C+looking+to+me+with+a+face+of+atheism%2C+I+call+the+adversaries%2C+Libertines%2C+not+intending+to+reach+a+blow+to+any+godly+man%2C+or+to+wound+those+who+out+of+weakness+are+captivated+with+that+error%2C+but+to+breed+in+the+hearts+of+the+godly+a+detestation+of+that+way%2C+which+in+truth+has+its+rise+from+Libertinism%2C+and+savors+rankly+of+wide%2C+loose+and+bold+atheistical+thoughts+of+the+majesty+of+God%2C+as+if+our+conscience+had+a+Prerogative+Royal+beside%5Bs%5D+a+rule%E2%80%A6+and+our+faith+and+hope+%5Baccording+to+it%5D+must+be+resolved+in+the+first+principle+of+skepticism.+So+it+seems+to+me%2C+for+the+young+daughters+of+the+mind%2C+the+simplest+acts+of+apprehending%2C+knowing%2C+believing+God+and+divine+truths+are+innocent%2C+harmless+ill-less+soul-works%2C+being+from+under+all+dominion+of+either+free-will+or+a+divine+Law%3B+and+the+mind+%5Baccording+to+it%2C+being%5D+a+free-born+absolute+Princess%2C+can+no+more+incur+guiltiness+in+its+operations+about+an+infinite+Sovereign+God+and+his+revealed+will+by+this+lawless+way%2C+than+the+fire+in+burning%2C+the+sun+in+enlightening%2C+the+stone+in+moving+downward%2C+be+arraigned+of+any+breach+of+Law%2C+if+toleration+have+place.+All+certainty+of+believing%2C+all+steadfastness%2C+rooting+and+unmovable+establishing+in+the+truth%2C+all+life+of+consolations+and+comforts+in+the+Scriptures%2C+all+peace+of+heavenly+confidence%2C+all+joy+unspeakable+and+full+of+glory%2C+all+lively+hope%2C+all+patient+and+submissive+waiting+for+the+fruits+of+the+harvest%2C+all+wrestling+in+prayer%2C+all+gloriation+in+tribulation+and+all+triumphing+in+praising%2C+all+rejoicing+in+the+Spirit%2C+being+bottomed+on+fallible+opinions%2C+on+doubtful+disputations+of+skeptics%2C+may+be+the+reelings+of+windmills%2C+fair+fancies+and+dreams%3B+for+who+%28say+they%29+is+infallible%3F+and+who+hath+known+the+mind+of+the+Lord%3F+so+as+the+truth+must+be+monopolized+to+any+one+sect+or+way%3F+Who+in+faith+or+fullness+of+assurance+can+convince+or+rebuke+gainsayers%2C+heretics%2C+or+such+as+bring+another+doctrine%2C+as+those+whom+you+so+labor+to+convince+and+rebuke%3F+3.+Conscience+is+hereby+made+every+man%E2%80%99s+rule%2C+umpire%2C+judge%2C+Bible%2C+and+his+God%2C+which+if+he+follow%2C+he+is+but+at+the+worst%2C+a+godly%2C+pious%2C+holy+heretic%2C+who+fears+his+conscience+more+than+his+Creator%2C+and+is+to+be+judged+of+you+a+saint.+4.+Hence+conscience+being+deified%2C+all+rebuking%2C+exhorting%2C+counter-arguing%2C+yea+all+the+ministry+of+the+Gospel+must+be+laid+aside%3B+no+man+must+judge+%5Ba%5D+brother+%5Ban%5D+idolater%2C+or+brother+Familist%2C+or+saints+to+be+Socinians%2C+or+men+of+corrupt+minds%2C+perverse+disputers%2C+vain-janglers%2C+wresters%2C+rackers+or+torturers+of+Scripture%2C+whose+words+eat+as+a+canker%2C+who+subvert+whole+houses%2C+who+speak+the+visions+of+their+own+head+and+see+false+burdens%2C+for+all+these+who+were+of+old%2C+but+are+now+quite+gone+out+of+the+world%3B+for+who+can+make+a+window+in+any+man%E2%80%99s+soul+and+see+there+heart-obstinacy+which+only+does+essentially+constitute+the+heretic%2C+the+blasphemer%2C+the+false+prophet+%5Baccording+to+them%5D%3F+But+is+not+brotherly+forbearance%2C+Christian+indulgence+a+debt+we+owe+to+brethren%2C+saints%2C+and+the+truly+godly+in+errors%2C+and+mind+infirmities%2C+which+by+a+natural+emanation+or+resultance+get+the+fore-start+of+freewill%3F+To+which+I+shall+speak+in+these+few+considerations%3A+1.+It+is+much+to+be+desired+with+the+prayers+and+suits+of+the+children+of+God+that+where+there+are+two+opinions%2C+there+may+be+one+heart%2C+that+the+Father+of+Spirits+would+unite+the+hearts+of+all+the+children+of+one+Father+and+the+heirs+of+one+house.+2.+Papists+here+have+exceeded+in+boundless+domination+and+tyranny+over+the+consciences+of+men%3A+and+what+ever+is+contrary+to+the+lawless+decrees+of+their+councils+and+popes+is+an+unexpiable+heresy+and+cannot+be+purged+but+by+fire+and+fagot.+2.+Whoever+refuse+subjection+of+conscience+to+that+enemy+of+Christ%2C+and+to+that+woman-mistress+of+witchcrafts%2C+on+whose+skirts+is+found+the+blood+of+the+martyrs+of+Jesus%2C+is+presently+an+heretic%2C+and+his+arguments+answered+with+burning-quick+%5Balive%5D%3A+this+tyranny+over+conscience+we+disclaim%3B+yet+for+that%2C+ought+not+the+other+extremity+of+wild+toleration+be+embraced.+3.+We+cannot+think+but+all+saints+in+this+side+of+glory+carry+to+Heaven+with+them+errors%2C+mistakes+and+prophesying+in+part+%5B1+Cor.+13%5D%2C+and+the+fairest+stars+and+lights+in+this+lower+firmament+of+the+Church+are+clouded%2C+and+the+benefit+of+the+moon+serves+to+enlighten+the+under+garden+of+lillies%2C+where+%E2%80%98Christ+feedeth%2C+till+the+day+break%2C+and+the+shadows+flee+away.%E2%80%99+And+here+brotherly+indulgence+and+reciprocation+of+the+debt+of+compassionate+forbearance+of+the+infirmities+one+of+another+must+have+place.+4.+Yet+so%2C+as+there+can+be+no+conflict+of+grace+against+grace%2C+nor+can+the+taking+off+the+foxes+which+destroy+the+vines+be+contrary+to+the+gentleness+and+meekness+of+the+saints+in+fulfilling+the+law+of+love+and+bearing+one+another%E2%80%99s+burdens%2C+nor+can+love+seated+essentially+in+a+new+born+child+of+the+second+birth+be+contrary+to+the+zeal+of+God+in+withstanding+to+the+face+a+Saint+looking+awry%2C+and+walking+not+with+a+straight+foot+according+to+the+truth+of+the+gospel%3B+which+way+if+heeded+in+sincerity%2C+should+breed+more+union+of+hearts%2C+and+be+a+greater+testimony+of+faithfulness+to+a+straying+sheep+than+our+cruel+meekness+and+bloody+gentleness+in+a+pretended+bearing+with+tender+consciences+under+a+color+of+paying+the+debt+of+bastard+love%2C+while+as+we+suffer+millions+to+perish%2C+through+silence+and+merciless+condolency+with+them+in+their+sinful+depraving+of+the+truth.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience+%28London%2C+1649%29+%7C+%E2%80%98To+the+Godly+%26+Impartial+Reader%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa337650820.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/a337650820.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=I%20offer%20%28Worthy%20Reader%29%20to%20your,their%20sinful%20depraving%20of%20the%20truth." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-11e69be364" data-kw="">
<blockquote><p>But if once the government of Christ were set up among us, we know not what would impede it by the sword of God alone [i.e. the Word of God], without any secular violence, to banish out of the land those spirits of error, in all meekness, humility and love, by the force of truth convincing and satisfying the minds of the seduced. Episcopal courts were never fitted for the reclaiming of minds. Their prisons, their fines, their pillories, their nose-slitting, ear-croppings and cheek-burnings did but hold down the flame to break out in season with the greater rage. But the reformed presbytery does proceed in a spiritual method eminently fitted for the gaining of hearts; they go on with the offending party with all respect: they deal with him in all gentleness from weeks to months, from months sometimes to years, before they come near to any censure.</p></blockquote>

<blockquote><p>4. We may add this consideration, that hitherto toleration of errors and diversity of corrupt opinions have ever been looked upon, and made use of, as a most subtle means for undermining and destroying of the Church. It is marked of that skillful enemy of the Kingdom of Jesus Christ, Julian [A.D. 331-363], that having improven his subtilty to the utmost to find out means to destroy the Church by craft, which his predecessors by violence could not obtain, amongst other means he concluded this: Not to raise open persecution but to give liberty to all the differing bishops and teachers (which then, after the Council of Nicea and Constantine’s death, were very many and bitter in their differences) to follow their own way, and to vent their own opinions without all fear of any restraint: and therefore did call them that he might make intimation thereof to them for their further encouragement therein; The words which he used to them, as they are marked by Ammianus and cited by Lodovicus Molineus (p. 560) are: Ut consopitis civilibus discordiis, suae quisque Religioni serviret intrepidus, that is, in sum, That everyone forbearing civil discords, should worship in his own religion without control or fear: And is it like, that this shall prove a mean useful for the good of the Church, which that expert child of the devil did make use of to destroy the same?</p></blockquote>

/661b9790a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=4.%20We%20may%20add%20this%20consideration%2C,use%20of%20to%20destroy%20the%20same%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Emperor Constantine was very much for liberty for dissenters, and against persecution of them, upon tolerable differences:</p></blockquote>

<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: And his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Even so when Satan finds that he cannot directly destroy the unity of the Church and bring division into credit, he will be more zealous for unity than Christ Himself: He will then endure no disagreement among Christians, no not in an opinion, nor a form or ceremony; not in meats or drinks or keeping of days, or in judging of things lawful or unlawful, which are not of necessity to the Church’s concord. He is either for tolerating all propagation of heresy and practice of wickedness, or else he is so much for unity, that no difference almost is to be tolerated. For he well knows that while men are imperfect such differences will still be: And then if he can but persuade the world that for concord sake they must not be endured, what follows but that the dissenters must be fined, imprisoned or banished to bring them (or the rest) to unity. And so he will set all the world together by the ears in cruelties and bloodshed and in hating one another, and all under pretense of making them one. You may think that till mankind be all turned bedlams [mental patients], they can never be so cheated by such a gross deceit, nor ever guilty of so mad a work. But what will you say if this be the common case of the far greatest part of the Christian world? And what will you say further, if after above a thousand years’ universal experience of the unhappy success, they continue it still as the only way to unity and peace? Look but about you with opened eyes and see whether it be not so. Were not he a gracious promoter of unity in the world that would say, ‘Unity is so excellent a thing that it is meet we should be all of one complexion, or at least that the world should speak but one language; and therefore no other but one should be tolerated.’ And here how easy is it to dilate of the great inconveniences of many languages: I could write a volume in folio of it myself; and all true and evident. Methinks I see hereupon how these books are scattered and read, and how those called learned men and politicians applaud them, and shake their heads and gnash their teeth at those that would have so great a mischief tolerated: And hereupon they set about the business and desire a law that upon pain of imprisonment and banishment (I know not whither) no one in the world shall speak any other language but one. And now I hope unity will be promoted indeed, when all the world is thus engaged in a war to perfect nature and make men one. But methinks I hear one man that is awake thus bespeak the promoters of this concord: ‘Unity and concord in those points where God has made them necessary, cannot be over-valued’: But yet it is visible that there is a marvelous diversity which nature is delighted in: when of all faces and of all voices, and of all the sorts of animals and plants, there is so discernable a difference: yea of all the millions of stones in the field, no two is perfectly like each other. And where greater unity is most desirable, it must first be considered how much of it is possible or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world.’ The speech being ended, the hearers derided it and made a law for unity to destroy it, and set every man on hating and fighting against his neighbor, to make all one. It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.</p></blockquote>

<blockquote><p>7. They [civil magistrates] might and ought to give their countenance unto, and join their authority with, such ecclesiastic statutes, overtures, or means, as Church-judicatories or officers might be about to make use of for this end in their places; and this can be no more prejudice to liberty, to countenance with their authority the ordinance of discipline, than to confirm by their authority the ordinance of preaching the Gospel. … 9. In recovering a people, in a reeling and staggering time, a magistrate may engage them to formerly received truth, and interpose his authority for this end, as is recorded of Josiah, 2 Chron. 34:31-33. Also, 10. He may and ought to remove all false worships, and endure no corrupt preaching, or writing, or meetings for that end, or administrating of corrupted sacraments, or any ordinance other than what is allowed; for, Josiah did cause the people stand to the Covenant that was made, and having removed all idolatrous worship, he made Israel to serve the Lord, that is, he made them abandon corrupt worship, and wait on pure ordinances, as keeping of the sabbaths, offering of sacrifices, etc. and that according to the manner prescribed by the Lord. Neither was it a wronging of their liberty, to do so, because: 1. It was the preservation of their liberty, to keep them from the abominable bondage of these evils. 2. It was their duty to abstain from these, and to follow the ordinances purely, and the magistrate may well put people to that. 3. It is one thing by force to keep folks from dishonouring God in a corrupt religion, (as Josiah did) another to force them to a religion; the one belongs to the ordering of the outward man, the other to the inward. 4. He might order them to keep the ordinances, and in going about them to keep the rule, because that is but a constraining of them to the means whereby religion works, and a making them, as it were, to give God a hearing, leaving their yielding and consenting to Him, when they have heard Him, to their own wills, which cannot be forced; yet it is reason that when God comes by His ordinances to treat with a people, that a magistrate should so far respect His glory and their good as to interpose His authority to make them hear. 5. Also, there is a difference between the constraining of a circumcised or baptized people, to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized, which were not formerly engaged; because, actual members of a Church have not even that liberty as others have, to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements, and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things, and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>

elding and consenting to Him, when they have heard Him, to their own wills, which cannot be forced; yet it is reason that when God comes by His ordinances to treat with a people, that a magistrate should so far respect His glory and their good as to interpose His authority to make them hear. 5. Also, there is a difference between the constraining of a circumcised or baptized people, to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized, which were not formerly engaged; because, actual members of a Church have not even that liberty as others have, to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements, and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things, and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.”

— James Durham, The Dying Man’s Testament to the Church of Scotland, or, A Treatise Concerning Scandal… (1659), pt. 3, ch. 4, pp. 252-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+They+%5Bcivil+magistrates%5D+might+and+ought+to+give+their+countenance+unto%2C+and+join+their+authority+with%2C+such+ecclesiastic+statutes%2C+overtures%2C+or+means%2C+as+Church-judicatories+or+officers+might+be+about+to+make+use+of+for+this+end+in+their+places%3B+and+this+can+be+no+more+prejudice+to+liberty%2C+to+countenance+with+their+authority+the+ordinance+of+discipline%2C+than+to+confirm+by+their+authority+the+ordinance+of+preaching+the+Gospel.+%E2%80%A6+9.+In+recovering+a+people%2C+in+a+reeling+and+staggering+time%2C+a+magistrate+may+engage+them+to+formerly+received+truth%2C+and+interpose+his+authority+for+this+end%2C+as+is+recorded+of+Josiah%2C+2+Chron.+34%3A31-33.+Also%2C+10.+He+may+and+ought+to+remove+all+false+worships%2C+and+endure+no+corrupt+preaching%2C+or+writing%2C+or+meetings+for+that+end%2C+or+administrating+of+corrupted+sacraments%2C+or+any+ordinance+other+than+what+is+allowed%3B+for%2C+Josiah+did+cause+the+people+stand+to+the+Covenant+that+was+made%2C+and+having+removed+all+idolatrous+worship%2C+he+made+Israel+to+serve+the+Lord%2C+that+is%2C+he+made+them+abandon+corrupt+worship%2C+and+wait+on+pure+ordinances%2C+as+keeping+of+the+sabbaths%2C+offering+of+sacrifices%2C+etc.+and+that+according+to+the+manner+prescribed+by+the+Lord.+Neither+was+it+a+wronging+of+their+liberty%2C+to+do+so%2C+because%3A+1.+It+was+the+preservation+of+their+liberty%2C+to+keep+them+from+the+abominable+bondage+of+these+evils.+2.+It+was+their+duty+to+abstain+from+these%2C+and+to+follow+the+ordinances+purely%2C+and+the+magistrate+may+well+put+people+to+that.+3.+It+is+one+thing+by+force+to+keep+folks+from+dishonouring+God+in+a+corrupt+religion%2C+%28as+Josiah+did%29+another+to+force+them+to+a+religion%3B+the+one+belongs+to+the+ordering+of+the+outward+man%2C+the+other+to+the+inward.+4.+He+might+order+them+to+keep+the+ordinances%2C+and+in+going+about+them+to+keep+the+rule%2C+because+that+is+but+a+constraining+of+them+to+the+means+whereby+religion+works%2C+and+a+making+them%2C+as+it+were%2C+to+give+God+a+hearing%2C+leaving+their+yielding+and+consenting+to+Him%2C+when+they+have+heard+Him%2C+to+their+own+wills%2C+which+cannot+be+forced%3B+yet+it+is+reason+that+when+God+comes+by+His+ordinances+to+treat+with+a+people%2C+that+a+magistrate+should+so+far+respect+His+glory+and+their+good+as+to+interpose+His+authority+to+make+them+hear.+5.+Also%2C+there+is+a+difference+between+the+constraining+of+a+circumcised+or+baptized+people%2C+to+worship+God+in+the+purity+of+ordinances%2C+as+they+have+been+engaged+thereto%2C+which+was+Josiah%E2%80%99s+practice%2C+and+the+constraining+of+a+people+to+engage+and+be+baptized%2C+which+were+not+formerly+engaged%3B+because%2C+actual+members+of+a+Church+have+not+even+that+liberty+as+others+have%2C+to+abandon+ordinances%3A+and+this+puts+them+to+no+new+engagement+in+religion%2C+but+presses+them+to+continue+under+former+engagements%2C+and+accordingly+to+perform%3A+Hence+we+see%2C+that+both+in+the+Old+and+New+Testament%2C+Church-members+have+been+put+to+many+things%2C+and+restrained+from+many+things%2C+which+had+not+been+pertinent+in+the+case+of+others.+See%2C+2+Chron.+15%3A13.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+The+Dying+Man%E2%80%99s+Testament+to+the+Church+of+Scotland%2C+or%2C+A+Treatise+Concerning+Scandal%E2%80%A6+%281659%29%2C+pt.+3%2C+ch.+4%2C+pp.+252-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc843576050.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c843576050.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=7.%20They%20%5Bcivil%20magistrates%5D%20might%20and,of%20others.%20See%2C%202%20Chron.%2015%3A13." rel="noopener" target="_blank">Read it online · <blockquote><p>8. They [civil magistrates] may and ought to make such [spiritual seducers] incapable of public places of trust, and remove them from such: Because, 1. They cannot be supposed to employ their power singly. 2. Because such trust agreeth not to men and subjects as such, but are voluntarily conferred as tokens of respect put upon men eminently qualified, and as may be for the good of the commonwealth: And therefore it cannot be justly accounted a marring of their liberty as men or subjects. Upon this ground was Maachah the mother of Asa removed from being Queen, or having any government, 1 Kings 15:13; 2 Chron. 15:16, yet it cannot be said she was wronged when she was so dealt with.</p></blockquote>

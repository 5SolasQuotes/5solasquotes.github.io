<blockquote><p>And Kings shall be thy nursing fathers (Isaiah 49:23 Geneva Bible)

John Owen corrects the Erastian notion that the above text gives the civil magistrate power in sacris (in intrinsically sacred matters):

[…] It is true that this is promised, and God accomplish it more and more! but yet we do not desire such nurses as beget the children they nurse. The proposing, prescribing, commanding, binding religion on the consciences of men, is rather the begetting of it than its nursing. To take care of the church and religion, that it receive no detriment, by all the ways and means appointed by God and useful thereunto, is the duty of the magistrates: but it is so also, antecedently to their actings unto this purpose, to discern aright which is the church whereunto this promise is made; without which they cannot duly discharge their trust nor fulfil the promise itself. The very words, by the rules of the metaphor, do imply that the church and its religion, and the worship of God observed therein, are constituted, fixed, and regulated by God himself, antecedently unto the magistrate’s duty and power about it. They are to nurse that which is committed to them, and not what themselves have framed or begotten.</p></blockquote>

<blockquote><p>Many of us are familiar with the old saying, “If men were angels, government would not be necessary”. This is something of a half-truth, however. In his exposition of Romans 13, James McLeod Willson points out that civil government also has positive functions – such as promoting true religion:

It is not affirmed that the execution of law consists entirely in acts of a punitive character. It would be so, provided government had been established with no other view than to protect the peaceable citizen. Such a notion is most derogatory to the magistrate and the government. The civil ruler would then be no more than a policeman, and government a system of police. Government has higher functions. It is a “praise” them that do well. And, hence, it takes an interest in all that promotes a quiet, industrious and moral behaviour – it provides for the education of the people—it ought to interest itself in the maintenance of pure religious observances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Civil government: an exposition of Rom. XIII. 1-7</cite>, (Philadelphia, 1853), pp 85-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-1181f8ced7" data-kw="">
<blockquote><p>It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 289-90.</span></figcaption>

<blockquote><p>Unlike many today, the Scottish Reformers saw no incongruency between church discipline and the state’s implementation of biblical penology:

Marriage once lawfully contracted, may not be dissolved at man’s pleasure, as our master Christ Jesus does witness, only [if] adultery be committed; which being sufficiently proven in presence of the Civil Magistrate, the innocent (if they so require) ought to be pronounced free, and the offender ought to suffer the death as God hath commanded. If the Civil sword foolishly spare the life of the offender, yet may not the Church be negligent in their office, which is to excommunicate the wicked, and to repute them as dead members, and to pronounce the innocent party to be at freedom, be they never so honourable before the world. If the life be spared (as it ought not to be) to the offenders, and if the fruits of repentance of long time appear the same, and if they earnestly desire to be reconciled with the Church, we judge that they may be received to participation of the Sacraments, and of the other benefits of the Church, (for we would not that the Church should hold those excommunicant whom God absolved, that is, the Penitent.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>repr in The works of John Knox, ed. David Laing</cite>, (6 vols, Edinburgh, 1856), ii, 248.</span></figcaption>

<blockquote><p>[T]he saints and faithful ministers of Christ will stand up for the prerogatives of Christ, and the privileges of his subjects, upon their utmost peril. Why, the kingdom of God is within them, and therefore they cannot but be zealous for their King, and his prerogatives. Some folk now-a-days are come that length, as to think and say, that these worthies who suffered in the late times of persecution, died as a company of fools, when they would not redeem their lives, by saying, “God save the king.” Would you know what was the matter with them? Why, by the acts of parliament, the prerogative of Zion’s King was taken, and set upon the head of King Charles and King James, and they declared, “In all causes, not only civil, but ecclesiastical, head.” And they could not find freedom in their consciences, to pray that God might save a man in his usurpations upon the prerogatives of Christ the King of Zion, whose kingdom they had within them, especially when they knew the enemy would interpret their praying in these terms, a praying for their prosperity and success in such a wicked way. Sirs, they who now-a-days talk at that rate, know little of true tenderness of conscience, or of true zeal for the glory of Christ, as the alone Head and King of his church.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[T]he saints and faithful ministers of Christ will stand up for the prerogatives of Christ, and the privileges of his subjects, upon their utmost peril. Why, the kingdom of God is within them, and therefore they cannot but be zealous for their King, and his prerogatives. Some folk now-a-days are come that length, as to think and say, that these worthies who suffered in the late times of persecution, died as a company of fools, when they would not redeem their lives, by saying, “God save the king.” Would you know what was the matter with them? Why, by the acts of parliament, the prerogative of Zion’s King was taken, and set upon the head of King Charles and King James, and they declared, “In all causes, not only civil, but ecclesiastical, head.” And they could not find freedom in their consciences, to pray that God might save a man in his usurpations upon the prerogatives of Christ the King of Zion, whose kingdom they had within them, especially when they knew the enemy would interpret their praying in these terms, a praying for their prosperity and success in such a wicked way. Sirs, they who now-a-days talk at that rate, know little of true tenderness of conscience, or of true zeal for the glory of Christ, as the alone Head and King of his church.”

opener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Although some of Richard Sibbes’s comments in his book on Josiah’s Reformation lend too much weight to an Erastian position, nevertheless, he accurately distinguishes between the civil magistrate’s lawful authority circa sacra (concerning religious matters) and the church’s authority in sacris (in intrinsically sacred matters):

[A]s a chief right, the ordering of the matters of religion belongs to the care of the prince. But there are two things in religion: first, intrinsecal [sic], within the church, as to preach, administer the sacraments, and ordain ministers. These he ought not to do. But for those things that are without it, these belong to him. If any of those that are placed in church or commonwealth do not their duty, it is fitting for him to correct. He ought to set all a-going without, and to remove abuses, but not to meddle with the things within the church aforesaid, as to execute the same, but to oversee and govern their execution, and those persons whose proper office it is to execute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Josiah’s Reformation. Laid open in four sermons</cite>, (London, 1637) in Works of Richard Sibbes, ed. A. B. Grosart (1862-3; 7 vols, Edinburgh, 1983), vi, 88.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-47c8764617" data-kw="">
<blockquote><p>Only this I say, that to open a wide door, and to grant an unbounded liberty unto all sorts of heretics and sectaries … is inconsistent with the Solemn League and Covenant of the three kingdoms, by which we are obliged to endeavour the extirpation of Popery, Prelacy, superstition, heresy, and schism; lest we partake in other men’s sins, and thereby be in danger to receive of their plagues; so it is, in the own nature of it, an error so pernicious, so abominable, so monstrous, that it makes all learned men to stand amazed, and taken with horror, in so much that they cannot at first gather their thoughts to put pen to paper against it. I know this liberty and toleration was maintained by the Donatists of old, and by the Socinians, Arminians, and Anabaptists of late; but it has been constantly opposed by all that were sound and orthodox, both ancient and modern, who have asserted the lawful use of a coercive power against those things, whereby (though under pretence of conscience) God is openly dishonoured, souls ensared and destroyed, faith and piety subverted and overthrown; and further, the compelling of the outward man, though not to the practice of things indifferent (which compulsion I do not allow), yet to the practice of necessary duties, and the external means and ordinances, by which through the blessing of God, men’s hearts and consciences may be savingly affected and wrought upon. And I beseech you what else means Asa’s covenant: That whosoever would not seek the Lord God of Israel should be put to death, whether small or great, whether man or woman. And what else means Josiah’s covenant, whereof it is said, He caused all that were present in Jerusalem and Benjamin to stand to it. And what else is that in Ezra, that whosoever would not come to Jerusalem to make a covenant, and to put away strange wives, all his substance should be forfeited, and himself separated from the congregation of those that had been carried away, that is, excommunicated. And what else is that other act of Josiah in putting down the priests of the high places. And what say you to the stoning those who did entice the people to turn out of the way wherein the Lord commanded them to walk, saying, Let us go after other Gods to serve them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A late dialogue between a civilian and a divine</cite>, (London, 1644) in The anonymous writings of George Gillespie, ed. Chris Coldwell (Dallas TX, 2008), pp 132-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-e448b2d76c" data-kw="">
<blockquote><p>In 1834 the American Old Light Covenanter Synod rejected the false notion, which was originally espoused by Erastians, Tolerationists, and Anabaptist fanatics, but has even been propagated by some who claim to stand in the covenanting tradition, that civil punishment in the Old Testament was ecclesiastical discipline. Indeed, they opposed such an idea so strongly that they even condemned it as heresy:

As the doctrine of Erastus is not very popular in the present age, and as his followers depended much for the support of their cause on arguments taken from the state of things in the Jewish church, it might seem advisable to let the dispute sink into oblivion; but when we consider that multitudes of errorists and heretics in the present day, hold the same opinions respecting the Jewish church which were held by the Erastians, the discussion of this question is of no small importance. The Erastians, in order to support their doctrine, maintained that in the Jewish church there were no rulers distinct from the civil magistrate; and no discipline distinct from civil punishment. Our present heretics hold the same opinion; but the two parties deduce very different conclusions from the same premises. The Erastians, supposing that civil and ecclesiastical rulers were the same under the Old Testament, maintained that they are so still. Our present heretics, assuming the same false premises, allege, that all which is recorded of the pious kings of Judah suppressing idolatry, was done by them as ecclesiastical rulers; and that the ancient dispensation being abolished, their example is not to be followed by the Christian magistrate. In opposition to both, we maintain that the Jewish church had a government distinct from that of the state, and a discipline distinct from civil punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/general-synod-of-the-reformed-presbyterian-church.html">General Synod of the Reformed Presbyterian Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the General Synod of the Reformed Presbyterian Church, session seventeenth, held in the city of Pittsburgh, October, 1834. With an appendix containing two overtures: I. on the ‘jury act,’ II. on the magistrate’s power, circa sacra (Newburgh, 1834), pp 22-3.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>In this extract from The two sons of oil, Samuel B. Wylie explains how the civil government is to extend care and protection to the church. His application of Matthew 25:42, 45 to the state is a significant blow against Libertarian Theology, and suggests that the concept of the state not intervening in relief for the afflicted is an ungodly idea (but this is an aside):

The civil magistrate ought to defend and protect the Church of Christ. Isa. 49:23: “Kings shall be thy nursing fathers, and their queens thy nursing mothers,” &amp;c. Does not this imply protection? The metaphors selected by the Spirit of God, involve the highest possible care and tenderness. I know it has been objected by some, that the tender care and concern here intended is not official, but merely personal, as an individual member of the church. The reason assigned is, that the epithet involving concern is not confined to kings, but is common to all their queens: and this must be acknowledged to be unofficial. Sure none are exempted from being concerned about the interests of religion. The irrelevancy of the objection will appear, by attending to an observation formerly made, viz. that the commands of God are obligatory upon every one, in his respective station and department of life. Queens are bound to exercise all the influence, which in the providence of God is conferred upon them, in promoting the religion of Jesus. Kings, or civil magistrates, in like manner, are indispensably bound to exercise all the power which they possess in their stations, to promote the same desirable end. Whatever quantity of this power is kept back, is so much unliquidated debt due to the Messiah, by the express command of that God whom magistrates represent. Ps. 2:12: “Kiss ye the Son lest he be angry.” When Christ’s mystical body needs this power, and the magistrate withholds the benefit of it, does he not run the risk of being charged by Jesus at the last day, as we read, Matt. 25:42, 45 “I was an hungered, and ye gave me no meat; I was thirsty, and ye gave me no drink, &amp;c. Inasmuch as ye did it not unto one of the least of these my brethren, ye did it not to me.”

This same idea of protection, tenderness, and care, as a blessing to be expected in New Testament times, is held out, Isa. 60:10,16: “Kings shall minister unto thee,” and “thou shalt suck the breasts of kings.” All these passages evidently intimate, that the civil power shall be exercised in administering officially to the church, every comfort which may be expected to result from the union of magistratical authority and paternal care; such as defending her from her enemies, and securing to her all her privileges.

Moreover, when in 1 Tim. 2:2, we are commanded to pray for magistrates, the end proposed is, that the church and people of God, under the wing of their protection, “may lead quiet and peaceable lives in all godliness and honesty.” Either indifference, therefore, on the part of the state, toward the church, or an equal protection to her enemies, is notoriously incompatible with the ideas obviously contained in these sacred passages.</p></blockquote>

<blockquote><p>To a person in any degree acquainted with the history of the Scottish Reformation, it must be completely evident that the Reformers laboured strenuously to establish, as an essential part of their system, the harmonious co-operation of a reformed State with a reformed Church, in maintaining truth and piety, and repressing falsehood and irreligion. This principle, after countless struggles and costly sacrifices, willingly tendered for its attainment, became ascendant at the memorable era of the Second Reformation, from 1638 to 1649, and was embodied in the solemn vows of the nation. These Federal Deeds assume the doctrine of an Establishment so fundamentally, that lay it aside, and they are deprived of half their meaning. They tender the national faith for the upholding of a pure establishment, which, through the good hand of God, had been set up; and they most unequivocally bind men, in civil authority, of whatever class, to employ their official power and resources to sustain the true religion professed, and to discontinue and eradicate error and false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenanter’s narrative and plea: exhibiting the error, schism, radicalism, and slander of Dr. Paul, and other separatists from the Reformed Presbyterian Church</cite>, (Belfast, 1841), pp 32-3.</span></figcaption>

<blockquote><p>Back in the days of the Arian controversy in the Synod of Ulster, there were some orthodox people who argued that Trinitarians should tolerate Unitarians and Arians in their midst in the hope that this destructive heresy would just quietly die out. Dr John Paul of Loughmourne, on the other hand, argued that this was irrational nonsense:

For the Antitrinitarians and the orthodox to “agree to differ,” is quite preposterous. To say:- “We do not worship the same God – we regard each other as idolaters or blasphemers; and yet, to show our liberality, we will still continue to worship together, we will hold communion with each other.” This is monstrously absurd. What communion hath the temple of God with idols? To sit down at the same holy table of the Lord with those whom we regard as blasphemers or idolaters, is surely a great absurdity; nor is it less absurd to join with them in discipline. What! join in the acts of discipline with blasphemers or idolaters! Join, as a Presbytery, in laying hands on blasphemers or idolaters! Ordain to the work of the holy ministry blasphemers or idolaters! Could any thing be more inconsistent, absurd, or impious? Surely not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-paul.html">John Paul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of a speech by the Rev. Dr Montgomery of Belfast, and the doctrines of the Unitarians proved to be unfavourable to the right of private judgment, to liberality and charity, to the investigation of truth, and the practice of virtue</cite>, (Belfast, 1828) in Stewart Bates (ed.), Works of the late Rev. John Paul, D.D., of Carrickfergus. With a memoir and introduction by the editor (Belfast, 1855), p. 428.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

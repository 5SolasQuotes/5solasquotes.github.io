</figure><figure class="quote" id="q-32e0e41645" data-kw="">
<blockquote><p>The chief priest layeth two crimes to the charge of the apostles, for he accuseth them of contumacy or stubbornness, because they obeyed not the decree of the council. In the second member he betrayeth an evil conscience, or, at least, he showeth that he handled rather a private business than any public cause, for he complaineth that the apostles will cause the priests and the scribes to be hated for the death of Christ.

Behold, therefore, what that is which nettleth them, because they fear the revenge and punishment of wicked murder. He pretendeth, at the first, doctrine; but we may gather out of the end that he was not so careful for doctrine. In the mean season, he accuseth the apostles of sedition; for he taketh that for a thing which all men, for the most part, did grant, that Christ was put to death justly.

Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests. It was an heinous offence not to obey the chief priest; how much more heinous was it, then, to despise the whole order? But the chief priest doth not consider what is his duty towards God and the Church; he abuseth his authority tyrannously, as if the same were not under any laws, as the Pope dealeth with us at this day; for seeing that he taketh to himself an unbridled authority and government, he feareth not to condemn us for schismatics, so soon as he seeth us refuse his decrees; for he catcheth at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludeth that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ.

Now, forasmuch as he doth manifestly play the minister of Satan, he borroweth authority, without shame and colour, of the name of Christ; yea, the very form of speech which the chief priest useth doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the word of God, dare grant liberty to themselves to attempt whatsoever pleaseth them. With a commandment (saith he) have we commanded. Whence cometh such strait rigour, save only because they think that all that must be received without exception which they shall command?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 212-14.</span></figcaption>

<blockquote><p>Vers. 32. And the Spirits of the Prophets are subject to the Prophets.

Reason 3. Because the Spirits of the Prophets are to be examined and judged of by the other Prophets, who might afterwards give their opinions concerning those things which were heard, whether anyone hath seasonably interrupted another, and whether it were agreeable to the Word of God, which was delivered by him; and therefore there was no danger, if he that spoke before, should give place to him that modestly interrupted him, and so more might speak in their order.

When he refers to the Prophets, the judging of the Spirit, or the Doctrine which the Prophet utters by the Spirit, he does not exclude Spiritual men, i. e. the other Governors of the Church, who were skilful in spiritual knowledge and judgement, such as all ought to be in an Ecclesiastical Senate: For he commands these, vers. 37. together with the Prophets, or Ministers of the Word, that according to their Ecclesiastical authority, they acknowledge and defend their doctrine in the Church, that according thereunto they would judge and determine concerning those that were disorderly.</p></blockquote>

<blockquote><p>Andrew Willet, who is thought to have been the author of this critique of Richard Hooker, believed that Hooker’s purported defence of the Church of England, while well-intentioned, had served to undermine the English Church’s doctrine:

WHEN men dream they are asleep, and while men sleep the enemy soweth tares, and tares take root and hinder the good corn of the Church, before it be espied. Therefore Wise men through silence permit nothing loosely to pass away as in a dream. Your offer then, Maist. Hoo[ker]. is godly and laudable, to inform men of the estate of the church of God established among us. For the Teachers of righteous things, are highly to be commended. And he that leadeth men rightly to judge of the church of God, is to be beloved of all men.

Howbeit sometimes goodly promises are mere formal, and great offers serve only to hoodwink such as mean well. And as by a fair shew of wishing well, our first parents were foully deceived: so is there a cunning framed method, by excellence of words, &amp; enticing speeches of man’s wisdom, to beguile and bewitch the very Church of GOD. And such as are used for this purpose come in sheep’s clothing. For he translateth him self into an Angel of light, who blindeth all men with utter darkness.

When we therefore, your loving countrymen (unfeignedly favouring the present state, and embracing from our hearts the Gospel of Christ, as it is preached and professed in England, being ready every hour to give up our lives for God’s glory: and the honour of our Queen [Elizabeth I]) having so goodly a champion to offer combat in our defence, were made very secure, and by the sweet sound of your melodious style, almost cast into a dreaming sleep:

We happily remembering your Preface that there might be some other cause, opened at the length our heavy eyes, and casting some more earnest and intensive sight into your manner of fight, it seemed unto us that covertly and underhand you did bend all your skill and force against the present state of our English church: and by colour of defending the discipline and government thereof, to make questionable and bring in contempt the doctrine and faith it self.

For we saw the theme and the cause you have in hand, to be notable simples, whereof a skilful popish Apoticarie can readily make some fine potion or sweet smelling ointment, to bring heedless men into the pleasant dream of well-weening: while they closely set on fire the house of God. And may we not truly say, that under the shew of inveighing against Puritans, the chiefest points of popish blasphemy, are many times and in many places, by divers men not obscurely broached; both in Sermons and in Writing: to the great grief of many faithful subjects, who pray for the blessed and peaceable continuance of her most gracious Majesty, and of the estate of the Church of JESUS Christ; as it is now established among us.

And verily such a thing offered it self unto our eyes, in reading your books, and we had not skill how to judge otherwise; of the handling of your penne and of the scope of your matter. Notwithstanding because rash judgement may prejudice honest travails, and faithful labourers may have their unadvised slips, and we could not tell how zeal, love, or glory might carry a man of such towardly and excellent gifts, in the first shewing of him self to the world; or that an earnest striving &amp; bending your self in heat of disputation against the one side, might dazzle your eyes, and draw your hand at unawares too far and too favourable to the other side; or else peradventure we might mistake your meaning, and so we should do you wrong against our wills.

We thought it therefore our part, in regard of our duty to the Church; and most agreeing to charity, both for your credit and our ease; in all Christian love to intreat you, that as you tender the good estate of Christ’s church among us, and of thousands converted to the gospel, you would in like public manner (but plainly and directly) shew unto us and all English Protestants, your own true meaning, and how your words in divers things do agree with the doctrine established among us.

And that not only for avoiding of offence given to many godly and religious Christians: but also that the Atheists, Papists, and other hereticques, be not encouraged by your so hard and so harsh stile (beating as it were, as we verily think, against the very heart of all true Christian doctrine, professed by her Majesty and the whole state of this Realm) to despise and set light, by her sacred Majesty, the reverend Fathers of our Church and the whole cause of our religion.

We have made choice therefore of a few principal things, which trouble many godly minded Christians, who advisedly read over your books, that by the sincere answering and upright clearing of them, you might satisfy us all, both in them and in all the rest, and free your self from all suspicion of falsehood or treachery, and make us able to give a reason of defence unto all such as stumble at your writings. And for your better ease herein, and our more ready satisfaction, we have compared your positions and assertions in your long discourses, unto the articles of religion set forth An̄. Dn̄i 1562. and confirmed by Parliament the 13. of her Majesty’s most blessed &amp; joyful reign, and unto the Apologies of such Reverend Fathers and chief pillars of our church, as from time to time since the Gospel began to shine among us, have written and preached, and every way laboured to advance and defend the same, with the Liturgy &amp; church government established among us.

If you therefore good Ma. Hoo[ker]. will make it to appear to the world, that in these points you are all one in judgement with the church of England, and that your such speeches wherewith your godly brethren are grieved, may bear such sense and meaning: or else (as every humble Christian will do) freely and ingenuously acknowledge your unwilling oversight, or at the least (which we undoubtedly believe you will never bee able) shew plainly and by good demonstration, that all our Reverend Fathers have hitherto been deceived; then shall we hold our selves very well contented and satisfied. Hoping therefore of your charitable, direct, plain, sincere, and speedy answer, we tender here our doubts unto your Christian consideration, and crave your brotherly resolution in manner and form following.</p></blockquote>

<blockquote><p>The Free Church of Scotland’s George Smeaton explained how the Voluntaryist Seceders differed with the advocates of the Original Secession testimony (especially the elder Thomas McCrie) with respect to the relevance of Old Testament Israel to the establishment principle:

A second charge against the protesting brethren is, that although the New Testimony decidedly expressed the opinion that the connection between Church and State was unlawful, they would not exercise forbearance where, it is alleged, forbearance is not only warrantable but demanded. But it was not a question of forbearance. It was a question that related to the lawfulness and propriety of dropping all confession to the great truth of national religion. The discussion turned largely on the peculiar attitude which was to be taken to the Old Testament Economy.

The advocates of the new opinions denied on two well defined grounds the validity of the argument drawn from the Old Testament. It was held, in the first place, that the Jewish nation but typically prefigured the Christian Church; and, in the second place, the spirituality of the new Economy was held up as the absolute contrast of the previous carnal Economy. In a word, the typical character of Judaism and a carnal or non-spiritual service were represented very incorrectly as the marked peculiarities of the Jewish nation. These allegations were the ostensible plea on which a Presbyterian Church, making a transition to the narrow principles and misconceptions of the Sectaries, sought to explode every argument drawn from the Old Testament Scriptures.

The separating Brethren maintained the very reverse, as will be seen from all their publications. They asserted, first, that Israel was not the type of the Church of God, but the church of God itself, under a different dispensation. This was the ground asserted by Wendelinus and all Protestant divines. As to the element of spirituality, they held that the two Economies did not differ in kind, but only in degree and outward form.

When the advocates of the new principles came to apply the typical theory to Jewish rulers, whose function was at once moral and permanent, the self-contradictory nature of their principle became apparent. Mr Turnbull, in his acute and lively manner, triumphantly exposed the absurdity of attempting to explain the exercise of magistratical authority and influence among the Jews, in behalf of religion, on the alleged ground that the office was typical of Christ. Dr M’Crie does the same thing, in his own lucid and argumentative way.</p></blockquote>

<blockquote><p>The first error we mention was their inquisitorialness, — the excess of their ecclesiastical legislation. This refers to those who belonged to their own communion. It is well known that the discipline of the Church Courts, from kirk-sessions to general assemblies, even over those who were friends, was extreme. Such legislation could not be tolerated in our day, even among the most devoted Protestants. It was not desirable. Individuals, families, congregations, communities, were all dealt with by ecclesiastical or burghal authorities, and often in minute matters, which did not properly belong to the business of the Church.

We may admire the impartiality of the Church and its administrators, and their evident sincerity, sparing no class, high or low, contravening their regulations, — their honest zeal, — but we cannot approve of such severity of discipline, even for offences which properly came before the Church Courts. We have no authority in Scripture for clothing men under discipline in sackcloth, and making them appear before a congregation for successive days in a white sheet, and far less for the pillory, and ducking, and fines. …

The course pursued was well intended, but it was mistaken. It was more than the Word of God or the example of the Apostolic Church demanded, and must have made the transition from the moral relaxation of the Church of Rome, to the proper strictness of the Reformed standard, more difficult. The change must have been in many cases so violent as to disgust and repel. Gentler treatment might have won.</p></blockquote>

We may admire the impartiality of the Church and its administrators, and their evident sincerity, sparing no class, high or low, contravening their regulations, — their honest zeal, — but we cannot approve of such severity of discipline, even for offences which properly came before the Church Courts. We have no authority in Scripture for clothing men under discipline in sackcloth, and making them appear before a congregation for successive days in a white sheet, and far less for the pillory, and ducking, and fines. …

— John G. Lorimer, The Errors of the Age of the Reformation and the Light in which they should be regarded by the men of the Present Day in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+first+error+we+mention+was+their+inquisitorialness%2C+%E2%80%94+the+excess+of+their+ecclesiastical+legislation.+This+refers+to+those+who+belonged+to+their+own+communion.+It+is+well+known+that+the+discipline+of+the+Church+Courts%2C+from+kirk-sessions+to+general+assemblies%2C+even+over+those+who+were+friends%2C+was+extreme.+Such+legislation+could+not+be+tolerated+in+our+day%2C+even+among+the+most+devoted+Protestants.+It+was+not+desirable.+Individuals%2C+families%2C+congregations%2C+communities%2C+were+all+dealt+with+by+ecclesiastical+or+burghal+authorities%2C+and+often+in+minute+matters%2C+which+did+not+properly+belong+to+the+business+of+the+Church.%0A%0AWe+may+admire+the+impartiality+of+the+Church+and+its+administrators%2C+and+their+evident+sincerity%2C+sparing+no+class%2C+high+or+low%2C+contravening+their+regulations%2C+%E2%80%94+their+honest+zeal%2C+%E2%80%94+but+we+cannot+approve+of+such+severity+of+discipline%2C+even+for+offences+which+properly+came+before+the+Church+Courts.+We+have+no+authority+in+Scripture+for+clothing+men+under+discipline+in+sackcloth%2C+and+making+them+appear+before+a+congregation+for+successive+days+in+a+white+sheet%2C+and+far+less+for+the+pillory%2C+and+ducking%2C+and+fines.+%E2%80%A6%0A%0AThe+course+pursued+was+well+intended%2C+but+it+was+mistaken.+It+was+more+than+the+Word+of+God+or+the+example+of+the+Apostolic+Church+demanded%2C+and+must+have+made+the+transition+from+the+moral+relaxation+of+the+Church+of+Rome%2C+to+the+proper+strictness+of+the+Reformed+standard%2C+more+difficult.+The+change+must+have+been+in+many+cases+so+violent+as+to+disgust+and+repel.+Gentler+treatment+might+have+won.%E2%80%9D%0A%0A%E2%80%94+John+G.+Lorimer%2C+The+Errors+of+the+Age+of+the+Reformation+and+the+Light+in+which+they+should+be+regarded+by+the+men+of+the+Present+Day+in+J.+A.+Wylie+%28ed.%29%2C+Ter-Centenary+of+the+Scottish+Reformation%2C+as+Commemorated+at+Edinburgh%2C+August+1860&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2cda512777.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2cda512777.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/15/john-g-lorimer-on-undue-severity-in-ecclesiastical-discipline/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>To be more plain, let me be more particular. The Voluntaries mistake us, if they conceive us to be Voluntaries. We hold by the duty of Government to give of their resources and their means for the maintenance of a gospel ministry in the land; and we pray that their eyes may be opened, so that they may learn how to acquit themselves as the protectors of the Church, and not as its corrupters or its tyrants. We pray that the sin of Uzziah, into which they have fallen, may be forgiven them, and that those days of light and blessedness may speedily arrive, when “kings shall be the nursing-fathers, and queens the nursing-mothers” of our Zion.

In a word, we hold that every part and every function of a common-wealth should be leavened with Christianity, and that every functionary, from the highest to the lowest, should, in their respective spheres, do all that in them lies to countenance and uphold it. That is to say, though we quit the Establishment, we go out on the Establishment principle — we quit a vitiated Establishment, but would rejoice in returning to a pure one. To express it otherwise — we are the advocates for a national recognition and national support of religion — and we are not Voluntaries.</p></blockquote>

uote/27a50a3489.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/13/thomas-chalmers-on-the-free-church-and-the-establishment-principle/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-b16f4de01c" data-kw="">
<blockquote><p>On the other side, let the government of the reformed churches be observed, in them there is no supreme jurisdiction, but an authority which always submitteth it self to the rule of God’s word, and Canons of a discipline regulated by it. Every man being subjected to the judgement, not of one alone, but of many, and those many not undertaking to bind any man by their authority, but only by the equity of their decrees, submitting themselves to the control of any man, yea and yielding to it, if it be accompanied with reason. The true church is of so ample a circumference that she cannot be governed by one alone, and of so Royal a descent, that in that which concerneth the conscience, she cannot be ruled by any but God himself.

Any other whosoever he be, employed in any function concerning her, must behave himself as her servant, not as her Lord, not prescribing her any thing, but bearing witness to what hath been prescribed her, not advancing himself above kings, but bowing unto them, not thinking, that his spiritual liberty, exempts him from bodily loyalty, but giving to Caesar, that which is Caesar’s, to God that which is God’s, honour to whom honour, tribute to whom tribute belongeth.

This is the platform and ground of jurisdiction in the protestant churches, very different from the Pope’s, who establisheth a spiritual monarchy in the church, who taketh upon him to judge all, without being judged by any, who requireth a blind obedience, grounded not upon the reason and equity of his injunctions, but upon the uncontrollable eminency of his place, making as much of his ordinances, as if they were brought down immediately from God, as having in the registry of his breast, the fullness of infallible knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An examination of those plausible appearances which seem most to commend the Romish Church, and to prejudice the Reformed. Discovering them to be but mere shifts, purposely invented, to hinder an exact trial of doctrine by the Scriptures</cite>, trans. William Pinke (Oxford: Edward Forrest, 1626), pp 47-48.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>15. What are the duties of the officers of the State with regard to the Church?

The state is a divine institution, and the officers thereof are God’s ministers, Rom. xiii. 1-4, Christ the Mediator is, as a revealed fact, “Ruler among the Nations,” King of kings, and Lord of lords. Rev. xix. 16; Matt, xxviii. 18; Phil. ii. 9-11; Eph. i. 17-23, and the Sacred Scriptures are an infallible rule of faith and practice to all men under all conditions.

It follows therefore — 1st. That every nation should explicitly acknowledge the Christ of God to be the Supreme Governor, and his revealed will the supreme fundamental law of the land, to the general principles of which all special legislation should be conformed. 2d. That all civil officers should make the glory of God their end, and his revealed will their guide. 3d. That, while no distinction should be made between the various Christian denominations, and perfect liberty of conscience and worship be allowed to all men, nevertheless the Christian magistrate should seek to promote piety as well as civil order (“Conf Faith,” ch. 23, § 2).

This they are to do, not by assuming ecclesiastical functions, nor by attempting to patronize or control the church, but by their personal example, by giving impartial protection to church property and facility to church work, by the enactment and enforcement of laws conceived in the true spirit of the Gospel, and especially in maintaining inviolate the Christian Sabbath, and Christian marriage, and in providing for Christian instruction in the public schools.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York: Robert Carter and Brothers, 1879), p. 434.</span></figcaption>

<blockquote><p>Here I shall briefly advert to the main topics of discussion in the publications to which I have referred; and then notice the exceptions that have been taken to the way in which the writers conducted the Controversy.

As to the first of these, the principal topics on which Dr M’Crie and his friends laid emphasis, were the three following:—

I. The place assigned in matters of religion to the civil ruler or to the Christian nation acting through its Rulers in a corporate capacity. The Synod, in their new Testimony, had asserted that the power competent to worldly kingdoms is wholly temporal, respecting only the secular interests of society, (p. 193.) Of course, they adduced no scripture for this, because no scripture could be adduced to lend countenance to such a tenet. Nor can it be deduced by sound deduction from any revealed truth. The advocates of the Synod could only have recourse to the rights of man.

Were this dogma consistently carried out, the separating brethren clearly proved, that all the laws previously in force in every Christian country in favour of religion, the sabbath, scripture-education, and the like, must needs be cancelled by a universal act rescissory. They, on the contrary, maintained from scripture, that nations as such are under obligation to recognise the true religion and aid in its diffusion by wise and salutary laws. They maintained that rulers are bound to give civil sanction to the truth; to establish the church; and to contribute from the national resources, for the furtherance of the gospel. This was one point which they argued out in all its bearings.

II. Liberty of conscience, on its true foundation, was fully and admirably expounded. The doctrine of the Synod on this point was in the last degree unguarded. They not only tied up the magistrate’s hands from any exercise of civil authority in suppressing blasphemy, sabbath-breaking, or profaneness,—representing such coercive measures as inconsistent with the spiritual nature of Christ’s Kingdom,—but went so far as to allege that the national sanction of one particular profession of Christianity in preference to another, partook of the nature of compulsion, intolerance, and persecution.

On the contrary, the separating brethren put the question of liberty of conscience on its true ground: that is, they placed it not on the mere metaphysical rights of man, but on the ground that God alone is Lord of the conscience; and that its rights, as derived from him, can never be alleged as running counter to the authority of God speaking in His word, and commanding nations and rulers to obey Him. The unregulated license to which I have referred was well designated by the Rev. Mr Chalmers of Haddington, “the grim idol,” at whose shrine the entire national profession of religion and the due exercise of magistratical power about religion were recklessly sacrificed.

III. The Christian state, according to the Old Testament precedent, was represented by the separating brethren as an organised community, capable of being in covenant with God. On this they laid great stress This was the most definite expression, according to these brethren, for national religion; and their whole theory, in large measure, took its peculiar colour from this conviction.

Not that they supposed any step or act of man originating the relation between a State and God. Rather, their whole mode of representing the matter proceeded on the supposition that by an act of prevenient grace the nation to whom the word of God had come, occupied a position analogous to that of Israel; and the formal act of covenanting was but the expression of the national consciousness of being taken into such a relation. Nor was this a merely Scottish idea: for we find in other countries the same thing done or fully approved of.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Here I shall briefly advert to the main topics of discussion in the publications to which I have referred; and then notice the exceptions that have been taken to the way in which the writers conducted the Controversy.

As to the first of these, the principal topics on which Dr M’Crie and his friends laid emphasis, were the three following:—

I. The place assigned in matters of religion to the civil ruler or to the Christian nation acting through its Rulers in a corporate capacity. The Synod, in their new Testimony, had asserted that the power competent to worldly kingdoms is wholly temporal, respecting only the secular interests of society, (p. 193.) Of course, they adduced no scripture for this, because no scripture could be adduced to lend countenance to such a tenet. Nor can it be deduced by sound deduction from any revealed truth. The advocates of the Synod could only have recourse to the rights of man.

Were this dogma consistently carried out, the separating brethren clearly proved, that all the laws previously in force in every Christian country in favour of religion, the sabbath, scripture-education, and the like, must needs be cancelled by a universal act rescissory. They, on the contrary, maintained from scripture, that nations as such are under obligation to recognise the true religion and aid in its diffusion by wise and salutary laws. They maintained that rulers are bound to give civil sanction to the truth; to establish the church; and to contribute from the national resources, for the furtherance of the gospel. This was one point which they argued out in all its bearings.

II. Liberty of conscience, on its true foundation, was fully and admirably expounded. The doctrine of the Synod on this point was in the last degree unguarded. They not only tied up the magistrate’s hands from any exercise of civil authority in suppressing blasphemy, sabbath-breaking, or profaneness,—representing such coercive measures as inconsistent with the spiritual nature of Christ’s Kingdom,—but went so far as to allege that the national sanction of one particular profession of Christianity in preference to another, partook of the nature of compulsion, intolerance, and persecution.

On the contrary, the separating brethren put the question of liberty of conscience on its true ground: that is, they placed it not on the mere metaphysical rights of man, but on the ground that God alone is Lord of the conscience; and that its rights, as derived from him, can never be alleged as running counter to the authority of God speaking in His word, and commanding nations and rulers to obey Him. The unregulated license to which I have referred was well designated by the Rev. Mr Chalmers of Haddington, “the grim idol,” at whose shrine the entire national profession of religion and the due exercise of magistratical power about religion were recklessly sacrificed.

<blockquote><p>And kings shall be thy nursing fathers. After having spoken of the obedience of the Gentiles, he shews that this relates not to the common people only, but to “kings” also. He compares “kings” to hired men who bring up the children of others, and “queens” to “nurses,” who give out their labour for hire. Why so? Because “kings” and “queens” shall supply everything that is necessary for nourishing the offspring of the Church.

Having formerly driven out Christ from their dominions, they shall henceforth acknowledge him to be the supreme King: and shall render to him all honour, obedience, and worship. This took place when the Lord revealed himself to the whole world by the Gospel; for mighty kings and princes not only submitted to the yoke of Christ, but likewise contributed their riches to raise up and maintain the Church of Christ, so as to be her guardians and defenders.

Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labour in it more diligently. And this is the reason why David expressly addresses and exhorts them to “be wise, and serve the Lord, and kiss his Son.” (Ps. ii. 10-12.)

This shews how mad are the dreams of those who assert that kings cannot be Christians without laying aside that office; for those things were accomplished under Christ, when kings, who had been converted to God by the preaching of the Gospel, obtained this highest pinnacle of rank, which surpasses dominion and principality of every sort, to be “nursing-fathers” and guardians of the Church.

The Papists have no other idea of kings being “nursing-fathers” of the Church than that they have left to their priests and monks very large revenues, rich possessions and prebends, on which they might fatten, like hogs in a sty. But that “nursing” aims at an object quite different from filling up those insatiable gulls. Nothing is said here about enriching the houses of those who, under false pretences, hold themselves out to be ministers of the Church, (which was nothing else than to corrupt the Church of God and to destroy it by deadly poison,) but about removing superstitions and putting an end to all wicked idolatry, about advancing the kingdom of Christ and maintaining purity of doctrine, about purging scandals and cleansing from the filth that corrupts piety and impairs the lustre of the Divine majesty.

Undoubtedly, while kings bestow careful attention on these things, they at the same time supply the pastors and ministers of the Word with all that is necessary for food and maintenance, provide for the poor and guard the Church against the disgrace of pauperism; erect schools, and appoint salaries for the teachers and board for the students; build poor-houses and hospitals, and make every other arrangement that belongs to the protection and defense of the Church. But those unnecessary and extravagant expenses for Anniversaries and Masses, for golden vessels and costly robes, which swell the pride and insolence of papists, serve only to uphold pomp and ambition, and corrupt the pure and simple “nursing” of the Church, and even choke and extinguish the seed of God, by which alone the Church lives.

When we see that matters are now very different, and that “kings” are not the “nursing-fathers,” but the executioners of the Church; when, in consequence of taking away the doctrine of piety and banishing its true ministers, idle bellies, insatiable whirlpools, and messengers of Satan, are fattened, (for such are the persons to whom the princes cheerfully distribute their wealth, that is, the moisture and blood which they have sucked out of the people;) when even princes otherwise godly have less strength and firmness for defending the Word and upholding the Church; let us acknowledge that this is the reward due to our sins, and let us confess that we do not deserve to have good “nursing-fathers.” But yet, after this frightfully ruinous condition, we ought to hope for a restoration of the Church, and such a conversion of kings that they shall shew themselves to be “nursing-fathers” and protectors of believers, and shall bravely defend the doctrine of the Word.

And shall lick the dust of thy feet. This passage is also tortured by the Papists in order to uphold the tyranny of their idol, as if kings and princes had no other way of proving themselves to be sincere and lawful worshippers of God than by adoring that masked prince of the Church instead of God. Thus they consider the obedience of piety to consist in kissing the Pope’s feet with deep reverence. What they ought to think of such barbarous and idolatrous worship, let them learn, first, from Peter, whose seat they boast of occupying, who would not permit such honour to be rendered to him by the centurion. (Acts x. 26.) Let them, next, learn from Paul, who tore his garments, and rejected such worship with the utmost abhorrence. (Acts xiv.14.)

What could be more absurd than to imagine that the Son of God appointed, instead of a minister of the Gospel, an object of abhorrence, some king dazzling in Persian luxury and splendour? But let us remember that the Church, so long as she is a pilgrim in this world, is subjected to the cross, that she may be humble and may be conformed to her Head; that if her foes make any cessation of their hostility, still her highest ornament and lustre is modesty. Hence it follows, that she has laid aside her own attire, when she is clothed with irreligious pride.

Here the Prophet means nothing else than the adoration by which princes bow down before God, and the obedience which they render to his Word in the Church. What we have already said must be carefully observed, that, when we speak of rendering honour to the Church, she must never be separated from the Head; for this honour and worship belongs to Christ, and, when it is bestowed on the Church, it still continues to belong undivided to him alone. By the obedience of piety kings do not profess submission, so as to bear the yoke of men, but to yield to the doctrine of Christ. Whosoever therefore rejects the ministry of the Church, and refuses to bear the yoke which God wishes to lay with his own hand on all his people, can neither have any fellowship with Christ nor be a child of God.</p></blockquote>

ngs+were+accomplished+under+Christ%2C+when+kings%2C+who+had+been+converted+to+God+by+the+preaching+of+the+Gospel%2C+obtained+this+highest+pinnacle+of+rank%2C+which+surpasses+dominion+and+principality+of+every+sort%2C+to+be+%E2%80%9Cnursing-fathers%E2%80%9D+and+guardians+of+the+Church.%0A%0AThe+Papists+have+no+other+idea+of+kings+being+%E2%80%9Cnursing-fathers%E2%80%9D+of+the+Church+than+that+they+have+left+to+their+priests+and+monks+very+large+revenues%2C+rich+possessions+and+prebends%2C+on+which+they+might+fatten%2C+like+hogs+in+a+sty.+But+that+%E2%80%9Cnursing%E2%80%9D+aims+at+an+object+quite+different+from+filling+up+those+insatiable+gulls.+Nothing+is+said+here+about+enriching+the+houses+of+those+who%2C+under+false+pretences%2C+hold+themselves+out+to+be+ministers+of+the+Church%2C+%28which+was+nothing+else+than+to+corrupt+the+Church+of+God+and+to+destroy+it+by+deadly+poison%2C%29+but+about+removing+superstitions+and+putting+an+end+to+all+wicked+idolatry%2C+about+advancing+the+kingdom+of+Christ+and+maintaining+purity+of+doctrine%2C+about+purging+scandals+and+cleansing+from+the+filth+that+corrupts+piety+and+impairs+the+lustre+of+the+Divine+majesty.%0A%0AUndoubtedly%2C+while+kings+bestow+careful+attention+on+these+things%2C+they+at+the+same+time+supply+the+pastors+and+ministers+of+the+Word+with+all+that+is+necessary+for+food+and+maintenance%2C+provide+for+the+poor+and+guard+the+Church+against+the+disgrace+of+pauperism%3B+erect+schools%2C+and+appoint+salaries+for+the+teachers+and+board+for+the+students%3B+build+poor-houses+and+hospitals%2C+and+make+every+other+arrangement+that+belongs+to+the+protection+and+defense+of+the+Church.+But+those+unnecessary+and+extravagant+expenses+for+Anniversaries+and+Masses%2C+for+golden+vessels+and+costly+robes%2C+which+swell+the+pride+and+insolence+of+papists%2C+serve+only+to+uphold+pomp+and+ambition%2C+and+corrupt+the+pure+and+simple+%E2%80%9Cnursing%E2%80%9D+of+the+Church%2C+and+even+choke+and+extinguish+the+seed+of+God%2C+by+which+alone+the+Church+lives.%0A%0AWhen+we+see+that+matters+are+now+very+different%2C+and+that+%E2%80%9Ckings%E2%80%9D+are+not+the+%E2%80%9Cnursing-fathers%2C%E2%80%9D+but+the+executioners+of+the+Church%3B+when%2C+in+consequence+of+taking+away+the+doctrine+of+piety+and+banishing+its+true+ministers%2C+idle+bellies%2C+insatiable+whirlpools%2C+and+messengers+of+Satan%2C+are+fattened%2C+%28for+such+are+the+persons+to+whom+the+princes+cheerfully+distribute+their+wealth%2C+that+is%2C+the+moisture+and+blood+which+they+have+sucked+out+of+the+people%3B%29+when+even+princes+otherwise+godly+have+less+strength+and+firmness+for+defending+the+Word+and+upholding+the+Church%3B+let+us+acknowledge+that+this+is+the+reward+due+to+our+sins%2C+and+let+us+confess+that+we+do+not+deserve+to+have+good+%E2%80%9Cnursing-fathers.%E2%80%9D+But+yet%2C+after+this+frightfully+ruinous+condition%2C+we+ought+to+hope+for+a+restoration+of+the+Church%2C+and+such+a+conversion+of+kings+that+they+shall+shew+themselves+to+be+%E2%80%9Cnursing-fathers%E2%80%9D+and+protectors+of+believers%2C+and+shall+bravely+defend+the+doctrine+of+the+Word.%0A%0AAnd+shall+lick+the+dust+of+thy+feet.+This+passage+is+also+tortured+by+the+Papists+in+order+to+uphold+the+tyranny+of+their+idol%2C+as+if+kings+and+princes+had+no+other+way+of+proving+themselves+to+be+sincere+and+lawful+worshippers+of+God+than+by+adoring+that+masked+prince+of+the+Church+instead+of+God.+Thus+they+consider+the+obedience+of+piety+to+consist+in+kissing+the+Pope%E2%80%99s+feet+with+deep+reverence.+What+they+ought+to+think+of+such+barbarous+and+idolatrous+worship%2C+let+them+learn%2C+first%2C+from+Peter%2C+whose+seat+they+boast+of+occupying%2C+who+would+not+permit+such+honour+to+be+rendered+to+him+by+the+centurion.+%28Acts+x.+26.%29+Let+them%2C+next%2C+learn+from+Paul%2C+who+tore+his+garments%2C+and+rejected+such+worship+with+the+utmost+abhorrence.+%28Acts+xiv.14.%29%0A%0AWhat+could+be+more+absurd+than+to+imagine+that+the+Son+of+God+appointed%2C+instead+of+a+minister+ <blockquote><p>In George Smeaton’s preface to the 1871 edition of the elder Thomas McCrie’s classic defence of the establishment principle, Statement of the Difference the Free Church theologian explained the circumstances that had given rise to the publication of McCrie’s book:

THE celebrated Statement of the late Dr M’Crie, of which a reprint in full is here presented to the public, was drawn up with the express design of exhibiting the difference between the profession of the Reformed Church of Scotland and the theory of Voluntaryism. The latter term, indeed, was not yet in common use. The question discussed, however, was precisely the same. It was not the question as in former times: with what restrictions and with what regard to the church’s intrinsic freedom may magistrates competently exercise their power about religion? It was the absolute question: is any power whatever competent to the Christian Civil ruler in seeking to further the cause of Christ?

Dr M’Crie’s work discusses this point, and possesses the following peculiarities:— It is a masterly defence of the principle of Establishments as a scripture truth; and the most complete vindication ever given to the world of the position occupied by the Reformed Church of Scotland on the whole subject of national religion, and of the magistrate’s legitimate power in promoting it.

The occasion which called forth the treatise, was as follows. A change had been introduced into the testimony of the church of which Dr M’Crie was a minister, on the question of the Civil Ruler’s authority and duty in reference to religion. About the same period, that is, during the last decennium of the previous century, the leaven of Voluntaryism, or, the theory that it is not competent to the Christian ruler to exercise his authority and influence in behalf of religion in any form, — began to work within the pale both of the Burgher and Antiburgher sections of the Secession Church. To the latter only, as the Denomination to which Dr M’Crie belonged, do we deem it necessary to refer in this place.

In the Antiburgher Synod, or General Associate Synod, as it was termed, a motion was made in 1795 to take steps for preparing or compiling a new Historical and Doctrinal Testimony for the use of the Denomination. Various reasons prompted this proposal. It was deemed fitting to simplify the document heretofore used as a testimony; to put together in a readable form what had been said in several publications on their distinctive principles; and to bring down the testimony to the time then present. But above all it was thought desirable as the event too plainly proved, to find expression for the new opinions already widely diffused on the subject of the magistrate’s power in reference to religion; in other words, to make room for the Voluntary Theory.

For some years, the people were kept on the tip-toe of expectation for the new Display of the Secession Testimony, which was to supersede that previously in use, and to prove a great improvement upon it. When at length it appeared, after nine years spent in its preparation, it was found to say and unsay; some passages doing homage to the past attainments of the Reformed Church of Scotland, while others were all too plainly at variance with the previously recognised doctrine of the Secession Church, in reference to the lawfulness of the connection between church and state.

But, as is not unusual in such cases, the extent of the alteration was sought to be concealed. A radical change, or rather a revolution, had been made in the constitution of this section of the Secession Church. But the change was not for a time openly avowed. The Synod, abandoning the principles and position of the Secession Church, though still retaining the name, had, in fact become a Dissenting Denomination. It had broken with the Historic Church of Scotland. The connection was dissolved.

There was a certain mis-statement, therefore, in asserting that they continued, as Heretofore, to bear testimony to the doctrine, worship, discipline, and government of the Reformed Church of Scotland, (p. 15.) The Confession, received in 1647 with one explanation, was now received with many limitations, under colour of carrying out the course of action then initiated. They declared their liberty of signifying their adherence to it with the same or similar limitations, (p. 12.) The section, in particular, which described what was competent to the civil magistrate, was evacuated of its import under the plea that it taught compulsory measures in religion. It was perverted, too, from its proper meaning, as if it might be accepted in the sense of referring to the magistrate in his private capacity, (p. 198.)

Furthermore, the scheme of separating the narrative and doctrinal part of the new Testimony from each other; — that is, by binding the members of the church solely to the latter, — men’s minds were gradually led away from the facts, in support of which the Secession testimony had at first been raised. In short, the Historic basis was to a large extent removed. We frankly acknowledge that in the exhibition of doctrine, there is much precious statement of central truth, worthy of the best times of the Secession Church. But it cannot be denied that wherever reference is made, directly or indirectly, to the misleading negation of Voluntaryism, we encounter one-sided statements, vacillation, and defective exposition.

The Synod, on the 1st of May 1804, approved the testimony, and enacted that henceforth, for all who entered the denomination, it should be held as the bond or term of ministerial and Christian communion. Then followed, on the part of a small but influential minority, a determined opposition. Only six ministers refused to acquiesce in the change made on the constitution of the church. But their piety and ability, as well as their literary eminence, gave weight to the cause they represented.

Two of the number, Messrs Whytock of Dalkeith and Hog of Kelso, were soon removed from the scene of conflict, by death. The four who remained — Rev. Prof. Bruce of Whitburn, Rev. Mr Aitken of Kirriemuir, Rev. Mr Chalmers of Haddington, and Dr M’Crie — maintained the old testimony in all its integrity. But they suffered deposition at the hand of the majority.

Their testimony, however, was not to be suppressed. Forming themselves into a Presbytery, under the designation of the Constitutional Presbytery, they rendered the most important service to the entire Presbyterian church by their clear and scriptural testimony to national Christianity.</p></blockquote>

the+testimony+of+the+church+of+which+Dr+M%E2%80%99Crie+was+a+minister%2C+on+the+question+of+the+Civil+Ruler%E2%80%99s+authority+and+duty+in+reference+to+religion.+About+the+same+period%2C+that+is%2C+during+the+last+decennium+of+the+previous+century%2C+the+leaven+of+Voluntaryism%2C+or%2C+the+theory+that+it+is+not+competent+to+the+Christian+ruler+to+exercise+his+authority+and+influence+in+behalf+of+religion+in+any+form%2C+%E2%80%94+began+to+work+within+the+pale+both+of+the+Burgher+and+Antiburgher+sections+of+the+Secession+Church.+To+the+latter+only%2C+as+the+Denomination+to+which+Dr+M%E2%80%99Crie+belonged%2C+do+we+deem+it+necessary+to+refer+in+this+place.%0A%0AIn+the+Antiburgher+Synod%2C+or+General+Associate+Synod%2C+as+it+was+termed%2C+a+motion+was+made+in+1795+to+take+steps+for+preparing+or+compiling+a+new+Historical+and+Doctrinal+Testimony+for+the+use+of+the+Denomination.+Various+reasons+prompted+this+proposal.+It+was+deemed+fitting+to+simplify+the+document+heretofore+used+as+a+testimony%3B+to+put+together+in+a+readable+form+what+had+been+said+in+several+publications+on+their+distinctive+principles%3B+and+to+bring+down+the+testimony+to+the+time+then+present.+But+above+all+it+was+thought+desirable+as+the+event+too+plainly+proved%2C+to+find+expression+for+the+new+opinions+already+widely+diffused+on+the+subject+of+the+magistrate%E2%80%99s+power+in+reference+to+religion%3B+in+other+words%2C+to+make+room+for+the+Voluntary+Theory.%0A%0AFor+some+years%2C+the+people+were+kept+on+the+tip-toe+of+expectation+for+the+new+Display+of+the+Secession+Testimony%2C+which+was+to+supersede+that+previously+in+use%2C+and+to+prove+a+great+improvement+upon+it.+When+at+length+it+appeared%2C+after+nine+years+spent+in+its+preparation%2C+it+was+found+to+say+and+unsay%3B+some+passages+doing+homage+to+the+past+attainments+of+the+Reformed+Church+of+Scotland%2C+while+others+were+all+too+plainly+at+variance+with+the+previously+recognised+doctrine+of+the+Secession+Church%2C+in+reference+to+the+lawfulness+of+the+connection+between+church+and+state.%0A%0ABut%2C+as+is+not+unusual+in+such+cases%2C+the+extent+of+the+alteration+was+sought+to+be+concealed.+A+radical+change%2C+or+rather+a+revolution%2C+had+been+made+in+the+constitution+of+this+section+of+the+Secession+Church.+But+the+change+was+not+for+a+time+openly+avowed.+The+Synod%2C+abandoning+the+principles+and+position+of+the+Secession+Church%2C+though+still+retaining+the+name%2C+had%2C+in+fact+become+a+Dissenting+Denomination.+It+had+broken+with+the+Historic+Church+of+Scotland.+The+connection+was+dissolved.%0A%0AThere+was+a+certain+mis-statement%2C+therefore%2C+in+asserting+that+they+continued%2C+as+Heretofore%2C+to+bear+testimony+to+the+doctrine%2C+worship%2C+discipline%2C+and+government+of+the+Reformed+Church+of+Scotland%2C+%28p.+15.%29+The+Confession%2C+received+in+1647+with+one+explanation%2C+was+now+received+with+many+limitations%2C+under+colour+of+carrying+out+the+course+of+action+then+initiated.+They+declared+their+liberty+of+signifying+their+adherence+to+it+with+the+same+or+similar+limitations%2C+%28p.+12.%29+The+section%2C+in+particular%2C+which+described+what+was+competent+to+the+civil+magistrate%2C+was+evacuated+of+its+import+under+the+plea+that+it+taught+compulsory+measures+in+religion.+It+was+perverted%2C+too%2C+from+its+proper+meaning%2C+as+if+it+might+be+accepted+in+the+sense+of+referring+to+the+magistrate+in+his+private+capacity%2C+%28p.+198.%29%0A%0AFurthermore%2C+the+scheme+of+separating+the+narrative+and+doctrinal+part+of+the+new+Testimony+from+each+other%3B+%E2%80%94+that+is%2C+by+binding+the+members+of+the+church+solely+to+the+latter%2C+%E2%80%94+men%E2%80%99s+minds+were+gradually+led+away+from+the+facts%2C+in+support+of+which+the+Secession+testimony+had+at+first+been+raised.+In+short%2C+the+Historic+basis+was+to+a+large+extent+removed.+We+frankly+acknowledge+that+in+the+exhibition+of+doctrine%2C+there+is+much+precious+statement+of+central+truth%2C+worthy+of+the+best+times+of+the+Secession+Church.+But+it+cannot+be+denied+that+wherever+reference+is+made%2C+directly+or+indirectly%2C+to+the+misleading+negation+of+Voluntaryism%2C+we+encounter+one-sided+statements%2C+vacillation%2C+and+defective+exposition.%0A%0AThe+Synod%2C+on+the+1st+of+May+1804%2C+approved+the+testimony%2C+and+enacted+that+henceforth%2C+for+all+who+entered+the+denomination%2C+it+should+be+held+as+the+bond+or+term+of+ministerial+and+Christian+communion.+Then+followed%2C+on+the+part+of+a+small+but+influential+minority%2C+a+determined+opposition.+Only+six+ministers+refused+to+acquiesce+in+the+change+made+on+the+constitution+of+the+church.+But+their+piety+and+ability%2C+as+well+as+their+literary+eminence%2C+gave+weight+to+the+cause+they+represented.%0A%0ATwo+of+the+number%2C+Messrs+Whytock+of+Dalkeith+and+Hog+of+Kelso%2C+were+soon+removed+from+the+scene+of+conflict%2C+by+death.+The+four+who+remained+%E2%80%94+Rev.+Prof.+Bruce+of+Whitburn%2C+Rev.+Mr+Aitken+of+Kirriemuir%2C+Rev.+Mr+Chalmers+of+Haddington%2C+and+Dr+M%E2%80%99Crie+%E2%80%94+maintained+the+old+testimony+in+all+its+integrity.+But+they+suffered+deposition+at+the+hand+of+the+majority.%0A%0ATheir+testimony%2C+however%2C+was+not+to+be+suppressed.+Forming+themselves+into+a+Presbytery%2C+under+the+designation+of+the+Constitutional+Presbytery%2C+they+rendered+the+most+important+service+to+the+entire+Presbyterian+church+by+their+clear+and+scriptural+testimony+to+national+Christianity.%E2%80%9D%0A%0A%E2%80%94+George+Smeaton%2C+Statement+of+the+Difference+Between+the+Profession+of+the+Reformed+Church+of+Scotland%2C+as+Adopted+by+Seceders%2C+and+the+Profession+Contained+in+the+New+Testimony+and+other+Acts%2C+Lately+Adopted+by+the+General+Associate+Synod%3B+Particularly%2C+on+the+Power+of+Civil+Magistrates+Respecting+Religion%2C+Nationa%2C+%281807%3B+Edinburgh%3A+C.+F.+Lyon%2C+1871%29%2C+v-ix.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe2310452ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e2310452ed.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/13/george-smeaton-on-the-occasion-of-thomas-mccries-defence-of-the-establishment-principle/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-12342aaba7" data-kw="">
<blockquote><p>I suppose none will deny, but that the Church of Israel had such Governors: instance their Priests and Levites. In Jehoshaphat’s time there is an express distinction made betwixt Ecclesiastical and Civil Governors under these two phrases, matters of the Lord, and matters of the King. If Church-Governors were an evidence of God’s good Providence under the Law, surely his Providence in this kind, would not be more scanty to the Church under the Gospel: for he hath promised to do better then at her beginnings. A change of Governors there may be, and that for the better; but an utter abolishing of all Governors, proper and peculiar to the Church, cannot be to the better. We expressly read that God hath set in his Church, among other good functions, Governments.

If it be said, that under that word, Governments, civil Magistrates are understood: I answer, that first this phrase, God hath set in the Church, and then the other particulars, among which Governments are reckoned, being all proper and peculiar to the Church, admit not such an interpretation thereof. To them which ask where any mention is made of a ruling Elder, I allege these words of an Apostle, (1 Tim. 5. 17.) The Elders that rule well, &amp;c. Apply them as you please, to Ministers or others: there are ruling Elders.

The word ἡγουμένων twice used by an Apostle, (Heb. 13. 7, 17.) and translated by our last and best Translators of the Bible, them that have rule, sheweth, that Ministers of the Gospel are Church-Governors: for Christians are required to obey them. And that Ministers are there meant, is evident by these phrases, They have spoken unto you the word of God, and they watch for your souls.</p></blockquote>

<blockquote><p>47. The matter may further be thus illustrated: there is almost the like respect and consideration of the magistrate as he is occupied about the outward things of the church, and of the ecclesiastical ministry as it is occupied about the inward or spiritual part of civil government, that is, about those things which in the government of the commonwealth belong to the conscience.

It is one thing to govern the commonwealth, and to make political and civil laws; another thing to interpret the word of God, and out of it to show the magistrate his duty, to wit, how he ought to govern the commonwealth, and in what manner he ought to use the sword. The former is proper and peculiar to the magistrate (neither doth the ministry intermeddle or entangle itself into such businesses), but the latter is contained within the office of the ministers.</p></blockquote>

</figure><figure class="quote" id="q-88c0594d19" data-kw="">
<blockquote><p>Whatever influence this false theory [Erastianism] may have exerted in various Protestant nations of Europe, it receives no authority, it finds no support in the word of God. It is of the earth, earthy! The doctrine taught in Scripture on this subject is, that the church and the state are distinct societies.

The O. T. church had by divine appointment a government, officers and discipline of its own, distinct from the civil state. In the New Testament all this is anew recommitted to the church. See Rom. 12:8; 1 Cor. 12:28. For the exercise of civil rule, see Rom. 13:1, 2.

Church and state, each within its own sphere of action, is independent. The church had nothing to do with the exercise of civil authority – this belongs to the state; and the state has no right to assume authority over the church. Rightly understood, and honestly carried out in practice, there can be no collision between the powers; they are altogether different in character, and occupy distinct spheres of action. “My kingdom is not of this world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>National support of religion – the relation of the church to the state in Reformed Presbyterian and Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

The O. T. church had by divine appointment a government, officers and discipline of its own, distinct from the civil state. In the New Testament all this is anew recommitted to the church. See Rom. 12:8; 1 Cor. 12:28. For the exercise of civil rule, see Rom. 13:1, 2.

Church and state, each within its own sphere of action, is independent. The church had nothing to do with the exercise of civil authority – this belongs to the state; and the state has no right to assume authority over the church. Rightly understood, and honestly carried out in practice, there can be no collision between the powers; they are altogether different in character, and occupy distinct spheres of action. “My kingdom is not of this world.”

<blockquote><p>The principle of Church Establishments, properly understood, and apart from adventitious circumstances, is just the principle of national religion. It has many ramifications all springing from an acknowledgment of the universal supremacy of Christ, and bearing upon the duty of nations and their rulers to promote the advancement of true religion, and the prosperity of Christ’s cause and kingdom.

It is connected with the protection of the Sabbath, the promotion of scriptural education in the public schools, the conservation of the purity of the Scriptures, and the sacredness of the law of marriage. It assumes that nations are moral and responsible creatures, accountable to God in their corporate capacity, and the proper subjects of rewards and punishments.

It implies that wherever God’s Word exists, its existence and influence ought to be nationally acknowledged as the only supreme authority and the foundation of law. “There is no power but of God; the powers that be are ordained of God.” The civil magistrate is “a minister of God,” and therefore bound to honour and serve Him, whilst “he that ruleth over men must be just, ruling in the fear of God.</p></blockquote>

<blockquote><p>Although we are fully convinced that the establishment principle is biblical, William MacKray also helpfully points out that it really is just a matter of common sense. After all, the idea of a Christian nation that does not provide for the maintenance of Christian institutions is totally irrational. Can you imagine an atheist nation not providing for atheist institutions or a Muslim nation not maintaining Muslim institutions. Such an assumption is too foolish to need or deserve refutation:

I CANNOT conceive any doctrine more sound and reasonable than this — that, in a Christian land, provision ought authoritatively to be made, on the part of its government, for the diffusion of Christian knowledge and the maintenance, of Christian institutions.</p></blockquote>

<blockquote><p>David Scott argues that the establishment principle implies state maintained education and vice-versa. If you accept the validity of one, then you must accept the validity of the other. His point about Voluntaryism being linked to free-market capitalism is interesting and it is a connection that I have made myself. It is hoped that subsequent posts of extracts from the writings of objective historians will serve to further confirm Scott’s thesis:

Those opposed to a public provision for the maintenance of religious ordinances, have generally, if not unanimously, conceded the duty of a government to provide for the education of children by the establishment of common schools. So far, there is no ground of difference. But I confess an inability to reconcile the admission of the duty of the magistrate to provide a system of common school education at the public expense, and yet bitterly oppose a similar provision for the support of religion. If the former is right, the latter cannot be wrong.

Religion and education are so intrinsically connected in principle and aim, that they cannot consistently be distinguished in regard to the obligation of the government. It is right to do both; but inconsistent to admit the obligation in the one case, and deny it in the other. The public mind is, however, evidently undergoing a change on this subject, but I fear for the worse. As far as Romanists are concerned, opposition to the common school system is well understood by intelligent Protestants. But many of the latter seem disposed to put the education of the children and youth of the community on the same footing with that of religion. In fact their aim is to bring the one, as they had done the other, under the application of the voluntary or free trade system. Their consistency is portentous to the welfare of the commonwealth! The movement is backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The public support of religion in Reformed Presbyterian and Covenanter</cite></span></figcaption>

<blockquote><p>Robert Baillie reminds us that absolute religious toleration is an evil which is to be abhorred. Moreover, the extract is also interesting for his acknowledgment that the more orthodox Independents (such as Jeremiah Burroughs) did not advocate the tolerationist opinions of Rodger Williams and others:

Liberty of Conscience, and Toleration of all or any Religion is so prodigious an impiety, that this religious Parliament cannot but abhor the very naming of it. Whatever may be the opinion of Jo[hn] Godwin, of Mr [Rodger] Williams and some of their stamp, yet Mr [Jeremiah] Burrowes in his late Irenicon [sic] upon many unanswerable arguments explodes that abomination. Likewise our Brethren who seek to be accommodate, will be willing I hope to profess their going along with us, without any considerable dissent, as in the Directory for all the parts of divine worship, so in the confession of Faith and Catechism.</p></blockquote>

<blockquote><p>2. By refusing to hold office, one qualification of which is an acknowledgment of the constitution directly, or implied. To hold civil office is not wrong, and cannot be inconsistent with the Christian character; for civil government is the ordinance of God. The Christian character is not too holy to be engaged in civil transactions, nor are they too profane for his character. But civil office may be suspended on terms direct or implied, that are inconsistent with his character, and obligations as a Christian, and as a witness for the testimony of Jesus. The objection to civil office, then, is not on any abstract ground relating to civil government, but is determined by the character of the particular government objected to. The ordinance itself is entitled to every respect on the part of the Christian, because it is a divine institution, but immoral principles or radical defects in the constitution invalidate the claim of a particular government. Such are not an exemplification of the moral ordinance of God, and therefore have no claim upon that acknowledgment which is due to his institution.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. By refusing to hold office, one qualification of which is an acknowledgment of the constitution directly, or implied. To hold civil office is not wrong, and cannot be inconsistent with the Christian character; for civil government is the ordinance of God. The Christian character is not too holy to be engaged in civil transactions, nor are they too profane for his character. But civil office may be suspended on terms direct or implied, that are inconsistent with his character, and obligations as a Christian, and as a witness for the testimony of Jesus. The objection to civil office, then, is not on any abstract ground relating to civil government, but is determined by the character of the particular government objected to. The ordinance itself is entitled to every respect on the part of the Christian, because it is a divine institution, but immoral principles or radical defects in the constitution invalidate the claim of a particular government. Such are not an exemplification of the moral ordinance of God, and therefore have no claim upon that acknowledgment which is due to his institution.”

<blockquote><p>The rule of building the house of God, and of the reformation of religion is the same and perpetual; the commandment of God, and not the commandment of man, one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of religion, and they sin against God if they use not the authority which God has put in their hands for the good of religion.[1] To them belongs inspection and watching over, not only Ecclesiasticos [church people], but Ecclesiastica [church things]. Ecclesiastical persons are subject to civil authority no less than others, and in respect of things ecclesiastical or matters of religion, Eusebius brings in Constantine the great, Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a eo constitutus sum,[2] not that any mortal man whether Pope or Prince, can be properly head of the church, or vicegerent unto Christ the Mediator in his special and economical kingdom of grace. For princes are vicegerents to God, and to his Son Jesus Christ as he is God, in his universal kingdom of providence; and this watching and inspection of princes and magistrates, is objective Ecclesiastica, but formaliter civilis, it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power.[3]

The faithful custody and preservation of religion, is a part of their office. For they are not only keepers of the second, but of the first table of the law. To them appertains the vindication and defence against contempt, corruption, and abuses. Religion also expects from them the civil sanction, that the worship of God and the wholesome constitutions of the church about religion, be confirmed and settled by their laws. Coaction also is theirs, for they by their power are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.[4] They may also call civil assemblies of the church, when the case of religion does require, preside as civil presidents, and examine church constitutions, not only as they are Christians for satisfying their own souls, but as magistrates for the good of the people. And when there is a necessity of reformation of religion, and the ministry and churchmen, like the sands of the seashore are covered with a deluge of defection and corruptions, they are by their authority to endeavour a reformation. And yet in all this exercise of their power, they are to do nothing but according to the commandment of God. So David, Jehoshaphat, Hezekiah, Josiah, and other good and religious princes have done. But when Jeroboam puts his own commandment in place of the commandment of God, when Ahaz sets up the altar of Damascus beside or in place of God’s altar, when the Kings of Judah and Israel did worship God, or did command the people to worship God, otherwise than God had commanded, wrath was upon the kingdom of the king and his sons.

Alexander Henderson, ‘A sermon preached to the Honourable House of Commons at their late Solemn Fast, Wednesday, December 27, 1643’ in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westminster Assembly of divines 1643-1645 (Dallas, 2011), pp 88-9.

[1] According to Henderson, the civil magistrate has “great” (not absolute, but great nonetheless) authority not only in civil and social matters, but even concerning matters of religion. This is not consistent with an ideological commitment to small government philosophy, which considers a civil government with great power to be (at best) a judgment from God.

[2] “You were made Bishops in the Church, I was made Bishop outside the Church or temple, by God.</p></blockquote>

<blockquote><p>Christ hath travelled the road, he hath shewed us the way both as to doctrine, discipline, worship, and government. Now, when a visible church doth not follow him, but will needs, like Israel, follow other leaders, and walk after the commandments of men, and manage the affairs of Christ’s kingdom, according to the plan of worldly politics, whereby the kingdoms of this world are ruled and governed; in that case she does not follow her King, she practically disowns Jehovah for her Head, and thereupon she is dismantled of the walls of her salvation, her chariots and horsemen are gone, and in that case, the “boar out of the wood doth waste her, and the wild beast of the field devours her.” The church of Christ can never thrive but by treading the footsteps of Christ, the Breaker, that has gone up before us, he having “left an example, that we should follow his steps.</p></blockquote>

<blockquote><p>The Crimes of persons are grievous, but those of a State are more. The corruption of a member is not so grievous as of the whole Body; and the deformity of the Body Political, is not so unpleasant to the eye of God as of the Church: this is the Body, this is the Bride of Christ; nothing so much provokes the passion of a loving Husband, as the polluting of his Spouse. Church-grievances were the first and main causes of our present Troubles; the righting of these, will open the door of our first hope of deliverance.

Whoso will observe either the spring or progress of our present Woes in all the three Kingdoms, will find that the open Oppression and secret Undermining of the Common-wealth, by the craft and tyranny of the malignant Faction, did highly provoke the wrath of God, and was a great occasion of all this Discord which hath broke out among men: Yet it is evident, that the principal cause which hath kindled the Jealousie of God, and enflamed the spirits of men to shake off and break in pieces those Yokes of Civil Slavery, which ingenuous necks were no more able to bear, was the constuprating [sic] of the Church, the bringing in upon her by violence, and daily multiplying of Errors, Superstitions, Idolatries, and other Spiritual Burdens.

The Method of our Cure, if ever it prove solid, must lead our Physicians to the fountain of our Disease. All Treaties for accommodating State-differences, will be lost, if in the first place Religion be not provided for, according to the mind of God. If once the Temple were builded, and filled with the cloud, the Difficulties would be small in making up the breaches in the house of the Kingdom, and filling it with Peace and Prosperity. So long as the Temple lies desolate, it is not possible to rear up the walls of the City. […]

Interests of private persons and particular Factions, laid over with the colour of pretended State-reasons, may procrastinate days without number, settling of Religion: yet if we trust either ancient or late experience, these States-men provide best for the welfare of their Country, who give to the God of heaven, to his Worship and House, the first and most high place in all their studies and cares.

If we behold either the former, or the later Reformers of the State of Israel; if we consider the practice of Moses, of David, of Hezekiah, of Zerubbabel, and others, it is evident the Tabernacle, the Ark, the Temple, did first and most lie at all their hearts.</p></blockquote>

Interests of private persons and particular Factions, laid over with the colour of pretended State-reasons, may procrastinate days without number, settling of Religion: yet if we trust either ancient or late experience, these States-men provide best for the welfare of their Country, who give to the God of heaven, to his Worship and House, the first and most high place in all their studies and cares.

If we behold either the former, or the later Reformers of the State of Israel; if we consider the practice of Moses, of David, of Hezekiah, of Zerubbabel, and others, it is evident the Tabernacle, the Ark, the Temple, did first and most lie at all their hearts.”

</figure><figure class="quote" id="q-6b823de2b7" data-kw="">
<blockquote><p>Many today, from Radical Two Kingdom theologians to American Theonomists, think that you can be Reformed without adhering to the establishment principle. Indeed, some of them even accuse establishmentarians of being crypto-papists or crypto-communists (it is hard to know which is more absurd). The reality, however, is that the denial of the establishment principle is enough to exclude one from the pale of Reformed orthodoxy. As the Scottish Seceder William MacKray reminds us the Reformers, all of whom rejected Popery as the antichrist, regarded the establishment principle as anything but a left-over from Rome:

Among the Reformers from Popery — those master-spirits of the sixteenth century — the doctrine, that it is the duty of Christian rulers to protect the Church and her Institutions, and to provide for their maintenance throughout their dominions — was any thing but a matter of doubtful dispute. They demanded, and, with admirable resolution, persevered in endeavoring to accomplish the overthrow of the whole system, root and branch, of Papal idolatry and superstition, that had been for ages the curse and scourge of the nations of Europe;—but they demanded, at the same time, that the emancipated nations should do homage to Christ, by assuming and maintaining a pure and public profession of his name; and that the kings of the earth, who had long given their power to the beast, should now transfer it to the service of Him who “is the Prince of the kings of the earth.” It has been said, indeed, that this doctrine was one of the abominations of Antichrist, which they brought with them from the darkness in which they had been involved. But the assertion is altogether gratuitous.

The truth is, my brethren, the minds of these men were anything but predisposed to retain in their profession the peculiarities of Popery. They had felt its yoke to be so galling, and the utter ungodliness of the whole system was, in the light of God’s word, so plainly revealed before their view, that they were under strong inducement, in the circumstances in which they were placed, to reject every thing that had been at all connected with it. It was because they saw the principle in question to be so important for the welfare of the Church, and so clearly deducible from that divine record which they had been honored to bring forth from Antichristian darkness to the view of mankind, that they retained it in their creed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of civil establishments of religion in Reformed Presbyterian</cite></span></figcaption>

</figure><figure class="quote" id="q-62a49e3ed7" data-kw="">
<blockquote><p>Many facile thinkers believe that because the establishment principle has been abused, the doctrine must be discarded. As the Seceder William MacKray points out, this is vain reasoning. Virtually anything can be abused by sinners for corrupt ends – even Christianity itself. Yet we do not reject Christianity just because some evil men have abused it to satisfy their selfish desires. Unlike many today, the Covenanters understood the distinction between the abuse and the proper use of a biblical principle:

They were persecuted by the State; but they did not therefore adopt the notion that the State has nothing to do with religion. They were persecuted by a church established by law; but they did not, therefore, adopt the opinion, that establishments must necessarily persecute, and that, of course, all establishments are unjust. They exercised a spirit of sound discrimination. They distinguished a good and scriptural institution from its perversion and abuse.</p></blockquote>

<blockquote><p>[T]he [New Testament] dispensation would not come to a close till the religion of Messiah the Prince should be legally established in every nation under heaven, and till rulers and nations as such, should “kiss the Son,” and bow down under the sceptre of his power. Inspired prophecy foretels [sic] that “kings should be nursing fathers, and their queens nursing mothers” to the Church; that rulers shall bring their “glory and riches to Zion;” and that the “isles” shall submissively “wait for the Saviour’s law.” The Spirit of the Lord commands kings to be “wise and kiss the Son,” and expressly intimates that the command shall be, one day, universally obeyed. When Ethiopia shall stretch out her hands to God, “mighty princes shall come out of Egypt” to Mount Zion; the “saints of the Most High God shall take the kingdom, and possess it,” and the “kingdoms of this world” shall become “the kingdoms of our Lord and of his Christ.”

These declarations are sufficient to set aside all the vain reasonings of men of corrupt minds on this matter. In their plain and unsophisticated meaning, they do, beyond all question, warrant the opinion, that civil rulers have to do with the Church of Christ – are bound to cherish and support her, and act under a solemn responsibility to employ their influence and authority to promote her peace and prosperity. And, they, furthermore, as the voice of the Lord, assure us that the faithful witnesses of the Lamb, having regard to their Master’s honour, should in every age assert this part of his prerogative.</p></blockquote>

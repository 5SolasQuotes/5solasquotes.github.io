</figure><figure class="quote" id="q-008959d7e1" data-kw="">
<blockquote><p>So the love-tokens and testimonial rings and bracelets of the Husband, my love to the saints, my keeping of his word, my holy walking in Christ, being the works of his Spirit, which dwelt in Jesus Christ, are actu primo [the first act], in themselves, as infallible signs of the Bridegroom’s love to me; as the Beloved’s word who spake and said, ‘Arise, my love’: And if the spirations and breathings of the Spirit go not along, both the voice and the love-bracelets (for Christ is no more counterfeit in his love-tokens than in his word when He speaks as a Husband) are alike ineffectual to persuade the soul.</p></blockquote>

<blockquote><p>Don’t you count that man close akin to a beast who would be willing to live in relations of polyandry? Does not logic compel you to take a similar view of woman and polygamy? Can you think of yourself with any degree of moral complacency as living in polygamy? There is not a man here who will dare say it openly!

The Bible condemns it. The original institutions of marriage, of which we have record in Genesis 2:24, is strictly and only monogamous. Moses prohibited polygamy. Malachi rebuked it. Christ soundly condemned it, and re-established the monogamous character of marriage. His inspired apostles set a stigma of disapproval on polygamy by forbidding that any such man should be allowed to hold office in the church. Joseph Smith did not get his revelation sanctioning polygamy from Jesus Christ, who is the same yesterday, today and forever.</p></blockquote>

</figure><figure class="quote" id="q-1439516217" data-kw="">
<blockquote><p>Marriage is lawful for all who are fit or proper persons to enter into this state. It is a thing indifferent, by which we mean that it is neither commanded, nor prohibited by God, but left to the will and pleasure of those who possess the gift of continency. It is different, however, with those who do not possess this gift — to them it is not merely permitted, but commanded by God himself, that they marry in the Lord.

Hence to these persons it is not a thing indifferent, but necessary, as is evident from what the Apostle says: “It is good for a man not to touch a woman; nevertheless, to avoid fornication, let every man have his own wife, and let every woman have her own husband.” “I say to the unmarried and widows it is good for them, if they abide, even as I. But if they cannot contain, let them marry; for it is better to marry than to burn.” (1 Cor. 7: 1, 2, 8, 9.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary on the Heidelberg Catechism</cite>, trans. George W. Williard (1616; 4th American edn, Cincinnati: Elm Street Printing Company, 1888), p. 594.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“Marriage is lawful for all who are fit or proper persons to enter into this state. It is a thing indifferent, by which we mean that it is neither commanded, nor prohibited by God, but left to the will and pleasure of those who possess the gift of continency. It is different, however, with those who do not possess this gift — to them it is not merely permitted, but commanded by God himself, that they marry in the Lord.

Hence to these persons it is not a thing indifferent, but necessary, as is evident from what the Apostle says: “It is good for a man not to touch a woman; nevertheless, to avoid fornication, let every man have his own wife, and let every woman have her own husband.” “I say to the unmarried and widows it is good for them, if they abide, even as I. But if they cannot contain, let them marry; for it is better to marry than to burn.” (1 Cor. 7: 1, 2, 8, 9.)”

— Zacharias Ursinus, The Commentary on the Heidelberg Catechism, trans. George W. Williard (1616; 4th American edn, Cincinnati: Elm Street Printing Company, 1888), p. 594.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMarriage+is+lawful+for+all+who+are+fit+or+proper+persons+to+enter+into+this+state.+It+is+a+thing+indifferent%2C+by+which+we+mean+that+it+is+neither+commanded%2C+nor+prohibited+by+God%2C+but+left+to+the+will+and+pleasure+of+those+who+possess+the+gift+of+continency.+It+is+different%2C+however%2C+with+those+who+do+not+possess+this+gift+%E2%80%94+to+them+it+is+not+merely+permitted%2C+but+commanded+by+God+himself%2C+that+they+marry+in+the+Lord.%0A%0AHence+to+these+persons+it+is+not+a+thing+indifferent%2C+but+necessary%2C+as+is+evident+from+what+the+Apostle+says%3A+%E2%80%9CIt+is+good+for+a+man+not+to+touch+a+woman%3B+nevertheless%2C+to+avoid+fornication%2C+let+every+man+have+his+own+wife%2C+and+let+every+woman+have+her+own+husband.%E2%80%9D+%E2%80%9CI+say+to+the+unmarried+and+widows+it+is+good+for+them%2C+if+they+abide%2C+even+as+I.+But+if+they+cannot+contain%2C+let+them+marry%3B+for+it+is+better+to+marry+than+to+burn.%E2%80%9D+%281+Cor.+7%3A+1%2C+2%2C+8%2C+9.%29%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Commentary+on+the+Heidelberg+Catechism%2C+trans.+George+W.+Williard+%281616%3B+4th+American+edn%2C+Cincinnati%3A+Elm+Street+Printing+Company%2C+1888%29%2C+p.+594.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1439516217.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/1439516217.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/02/04/zacharias-ursinus-on-marriage-as-a-duty/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-6b3be082bc" data-kw="">
<blockquote><p>Now it is easy to everyone to know that when marriage is according to nature and God’s designation, when a woman is married to an husband she receives him as a guide, as a protector, a safeguard and defense, a shelter from harms and dangers, a reliever from distresses, a comforter in afflictions, a support in discouragements. God has so designed it, and therefore has made man of a more robust [nature], and strong in body and mind, with more wisdom strength and courage, fit to protect and defend; but he has made woman weaker, more soft and tender, more fearful, and more affectionate, as a fit object of generous protection and defense.

Hence it is, that it is natural in women to look most at valour and fortitude, wisdom, generosity and greatness of soul: these virtues do—or at least ought, according to nature—move most upon the affections of the woman. Hence also it is, that man naturally looks most at a soft and tender disposition of mind, and those virtues and affections which spring from it, such as humility, modesty, purity, chastity. And the affections which he most naturally looks at in her are a sweet and entire confidence and trust, submission and resignation; for when he receives a woman as wife, he receives her as an object of his guardianship and protection, and therefore looks at those qualifications and dispositions which exert themselves in trust and confidence.

Thus it’s against nature for a man to love a woman as wife that is rugged, daring and presumptuous, and trusts to herself, and thinks she is able to protect herself and needs none of her husband’s defense or guidance. And it is impossible a woman should love a man as an husband, except she can confide in him, and sweetly rest in him as a safeguard.</p></blockquote>

<blockquote><p>Observe first that he says, “he will cling to his wife” and not “wives.” Next, he says, “the two will be one flesh.” Here polygamy is manifestly condemned, which so effects one flesh that it also pulls man apart into many fleshes. Indeed, it is also true that, after the first institution, that custom prevailed among the fathers. But now I do not dispute how this was done rightly. I say with Christ that it was not this way from the beginning, but neither is anything corrected better than when it is led back to the first institution.</p></blockquote>

<blockquote><p>Although women are ashamed to acknowledge this, Scriptures and experience teach us that there is only one in several thousands to whom God gives the gift to live chastely in a state of virginity. A woman does not have complete mastery over herself. God so created her body that she should be with a man and bear and raise children. The words of Gen., ch. i, clearly state this, and the members of her body sufficiently show that God himself formed her for this purpose.

Just as eating, drinking, waking, and sleeping are appointed by God to be natural, so God also wills that it be natural for a man and a woman to live together in matrimony. This is enough, therefore, and no woman need be ashamed of that for which God has created and fashioned her, and if she feels that she does not possess that high and rare gift, she may leave the convent and do that for which she is adapted by nature.</p></blockquote>

</figure><figure class="quote" id="q-7b88723573" data-kw="">
<blockquote><p>O, would God in heaven, that some time a government might be established that would do away with the public bawdy-houses, as was done among the people of Israel! It is indeed an unchristian sight, that public houses of sin are maintained among Christians, a thing formerly altogether unheard of.

It should be a rule that boys and girls should be married early and such vice be prevented. Such a rule and custom ought to be sought for by both the spiritual and the temporal power. If it was possible among the Jews, why should it not also be possible among Christians? Nay, if it is possible in villages, towns and some cities, as we all see, why should it not be possible everywhere?</p></blockquote>

</figure><figure class="quote" id="q-e44c167bef" data-kw="">
<blockquote><p>The second cause [for marriage] is to avoid fornication. This Paul signifieth when he saith, ‘For the avoiding of fornication, let every man have his own wife,’ 1 Cor. vii. 8. He saith not for avoiding of adultery, but for avoiding of fornication, showing that fornication is unlawful, too, which the papists make lawful, in maintaining their stews [brothels], as a stage for fornicators to play upon, and a sanctuary to defend them; like Absalom’s tent, which was spread upon the top of the house, that all Israel might see how he defiled his father’s concubines, 2 Sam. xvi. 22.

For this cause Malachi saith that God did create but one woman for the man. He had power to create more, but to show that he would have him to stick to one, therefore he created of one rib but one wife for one husband, Mal. ii. 15. And in the ark there were no more women than men, but four wives for four husbands, although it was otherwise in the beginning of the world, when many wives might seem necessary to multiply mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>But let them arm themselves with the divine law which says: “What God has joined together, let no man put asunder” [Matt. 19:6]. For the joining together of a man and a woman is of divine law and is binding, however much it may conflict with the laws of men; the laws of men must give way before it without any hesitation. For if a man leaves father and mother and cleaves to his wife [Matt. 19:5], how much more will he tread underfoot the silly and wicked laws of men, in order to cleave to his wife! And if pope, bishop, or official should annul any marriage because it was contracted contrary to the laws of men, he is Antichrist, he does violence to nature, and is guilty of treason against the Divine Majesty, because this word stands: “What God has joined together, let no man put asunder” [Matt. 19:6].

Besides this, no man had the right to frame such laws, and Christ has granted to Christians a liberty which is above all the laws of men, especially where a law of God conflicts with them. … Moreover, such laws were condemned beforehand by Paul when he foretold that there would be men forbidding to marry [I Tim. 4:3]. Here, therefore, those inflexible impediments derived from affinity, by spiritual or legal relationship, and from blood relationship must give way, so far as the Scriptures permit, in which the second degree of consanguinity alone is prohibited.

Thus it is written in Lev. 18[:6-18], where there stepmother, full sister, half-sister by either parent, granddaughter, father’s or mother’s sister, half-sister by either parent, granddaughter, father’s or mother’s sister, daughter-in-law, brother’s wife, wife’s sister, stepdaughter, and his uncle’s wife. Here only the first degree of affinity and the second degree of consanguinity are forbidden; yet not without exception, as will appear on closer examination, for the brother’s or sister’s daughter – the niece – is not included in the prohibition, although she is in the second degree. Therefore, if a marriage has been contracted outside of these degrees, which are the only ones which have been prohibited by God’s appointment, it should by no means be annulled on account of the laws of men. For marriage itself, being a divine institution, is incomparably superior to any laws, so that marriage should not be annulled for the sake of the law, rather the laws should be broken for the sake of marriage.</p></blockquote>

</figure><figure class="quote" id="q-af1a6a0b75" data-kw="">
<blockquote><p>Who would think there were any evil in forcing of virginity, chastity, or single life? He that is unmarried, careth for the things of the Lord, how he may please the Lord, that he may be holy, both in body and also in spirit: would God it were so with all that have taken the profession of single life: but the colour is fair. Hence hath it grown, that bishops and priests, and young men and maidens, have continued single. This seemed strange, and a miracle, and a matter of great holiness.

But this is a mystery; this is a way to bring in antichrist. Mark what St. Paul speaketh hereof (1 Tim. iv): “They shall forbid to marry.” Of whom speaketh he? of antichrist and his disciples, they shall forbid lawful marriage, as unholy, and as a state of life unfit for their holiness. Yet Christ Jesus, the Son of God, did never forbid it: his Apostles were married, and had wives.

“This (saith St. Paul) is a mark of antichrist, by this shall he be known.” Forbidding of marriage is a doctrine of devils; not of Christ, or of God, but of devils. It is a gulf, it is a sea, it is a world, it is a hell of iniquity, and the vilest villainy that ever crept into the church of God. Jerome expounding the words of Daniel (chap.vii.), “He shall have no regard to the desires of women,” saith, “The better exposition hereof is, to apply these words to antichrist, for that he shall pretend chastity, that he may deceive many.” This is the mystery of iniquity. This is the practice of antichrist: he shall come with a cloak of counterfeited chastity, not with true chastity, both in body and also in spirit; but with counterfeit chastity, and so shall deceive the hearts of many.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 216-17.</span></figcaption>

<blockquote><p>The proof here of is evident if Christ’s words be weighed in the nineteenth Chapter of S. Matthew’s gospel. For when the Pharisees asking him a question, whether it were lawful for a man to put away his wife for every cause, received answer that it was not, and thereupon said unto him, Why did Moses then command to give a bill of divorcement and to put her a way: Our Saviour said unto them; Moses suffered you because of the hardness of your heart to put away your wives: But from the beginning it was not so. And I say unto you, that, whosoever shall put away his wife, except it be for whoredom, and shall marry another, doth commit adultery: and who so marrieth her that is put away, doth commit adultery.

Now in this sentence, the clause of exception [except it be for whoredom] doth argue that he commiteth not adultery, who, having put away his wife for whoredom marrieth another.

But he must needs commit it in doing so unless the band of marriage be loosed and dissolved. For who so marrieth another as long as he is bound to the former, is an adulterer. The band then of marriage is loosed &amp; dissolved between that man and wife who are put asunder and divorced for whoredom.

And if the band beloosed, the man may marry another: seeing it is written Art thou loosed from a wife? If thou marry thou sinnest not. Therefore it is lawful for him who hath put away his wife for whoredom to marry another.

This argument doth firmly and necessarily conclude the point in question, if the first part &amp; proposition of it be proved to be true. For there is no controversy of any of the rest: being all grounded on such undoubted principles of scripture &amp; reason, that our adversaries themselves admit and grant them all.

The first they deny to wit that the clause of exception in Christ’s speech [except it be for whoredom] doth argue that the man committeth not adultery, who, having put away his wife for whoredom, marrieth another. And to overthrow this proposition, they do bring sundry answers and evasions. The best of all which as Bellarmine avoucheth, is, that those words [except it be for whoredom] are not an exception. For Christ (saith he) meant those words [except for whoredom] not as an exception, but as a negation. So that the sense is whosoever shall put away his wife. except for whoredom; that is to say without the cause of whoredom, &amp; shall marry another doth commit adultery. Whereby it is affirmed that he is an adulterer who having put away his wife without the cause of whoredom, marrieth another: but nothing is said touching him who marrieth another, having put away his former wife for whore dome. In deed this evasion might have some colour for it, if these words of Christ [except it be for whoredom] were not an exception.

But neither hath Bellarmine ought that may suffice for the proof hereof and the very text of the Scripture it self is soe clear against him, that he must of necessity give over his hold. For the principal pillar wherewith he under propseth it, is S. Austin’s judgment, who hath so expounded it in his first book touching adulterous marriages: Now of that treatise S. Austin saith himself in his retractations I have written two books touching adulterous marriages, as near as I could according to the scriptures being desirous to open and loose the knots of a most difficult question. Which whether I have done so that no knot is left therein, I know not: nay rather I perceive that I have not done it perfectly, and thoroughly, although I have opened many creeks thereof, as whosoever readeth with judgment may discern. S. Augustin then acknowledgeth that there are some wants &amp; imperfections in that work which they may see who read with judgment.

And whether this that Bellarmine doth allege out of it, deserve not to fall within the compass of that censure I appeal to their judgment who have eyes to see: For S. Augustin thought that the word in the original of S. Matthew’s gospel, had, by the Proper signification of it, imported a negation rather then an exception. As he sheweth by saying that where the common Latin translation hath [except for whoredom] in the Greek text it is rather read without the cause of whoredom. Supposing belike (whether by slip of memory or rather oversight) that the same words, which were used before in the fifth Chapter of S. Matthew’s Gospel to the same purpose, were used also in this place: whereas here they differ, and are well expressed by that in the Latin by which S. Austin thought they were not so well. Howbeit, if they had been the same with the former: yet neither so might Bellarmine allow his opinion: considering that the common Latin translation (which Papists by there Council of Trent are bound to stand to under pain of curse) expresseth those likewise as a plain exception.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The proof here of is evident if Christ’s words be weighed in the nineteenth Chapter of S. Matthew’s gospel. For when the Pharisees asking him a question, whether it were lawful for a man to put away his wife for every cause, received answer that it was not, and thereupon said unto him, Why did Moses then command to give a bill of divorcement and to put her a way: Our Saviour said unto them; Moses suffered you because of the hardness of your heart to put away your wives: But from the beginning it was not so. And I say unto you, that, whosoever shall put away his wife, except it be for whoredom, and shall marry another, doth commit adultery: and who so marrieth her that is put away, doth commit adultery.

Now in this sentence, the clause of exception [except it be for whoredom] doth argue that he commiteth not adultery, who, having put away his wife for whoredom marrieth another.

But he must needs commit it in doing so unless the band of marriage be loosed and dissolved. For who so marrieth another as long as he is bound to the former, is an adulterer. The band then of marriage is loosed &amp; dissolved between that man and wife who are put asunder and divorced for whoredom.

And if the band beloosed, the man may marry another: seeing it is written Art thou loosed from a wife? If thou marry thou sinnest not. Therefore it is lawful for him who hath put away his wife for whoredom to marry another.

This argument doth firmly and necessarily conclude the point in question, if the first part &amp; proposition of it be proved to be true. For there is no controversy of any of the rest: being all grounded on such undoubted principles of scripture &amp; reason, that our adversaries themselves admit and grant them all.

The first they deny to wit that the clause of exception in Christ’s speech [except it be for whoredom] doth argue that the man committeth not adultery, who, having put away his wife for whoredom, marrieth another. And to overthrow this proposition, they do bring sundry answers and evasions. The best of all which as Bellarmine avoucheth, is, that those words [except it be for whoredom] are not an exception. For Christ (saith he) meant those words [except for whoredom] not as an exception, but as a negation. So that the sense is whosoever shall put away his wife. except for whoredom; that is to say without the cause of whoredom, &amp; shall marry another doth commit adultery. Whereby it is affirmed that he is an adulterer who having put away his wife without the cause of whoredom, marrieth another: but nothing is said touching him who marrieth another, having put away his former wife for whore dome. In deed this evasion might have some colour for it, if these words of Christ [except it be for whoredom] were not an exception.

But neither hath Bellarmine ought that may suffice for the proof hereof and the very text of the Scripture it self is soe clear against him, that he must of necessity give over his hold. For the principal pillar wherewith he under propseth it, is S. Austin’s judgment, who hath so expounded it in his first book touching adulterous marriages: Now of that treatise S. Austin saith himself in his retractations I have written two books touching adulterous marriages, as near as I could according to the scriptures being desirous to open and loose the knots of a most difficult question. Which whether I have done so that no knot is left therein, I know not: nay rather I perceive that I have not done it perfectly, and thoroughly, although I have opened many creeks thereof, as whosoever readeth with judgment may discern. S. Augustin then acknowledgeth that there are some wants &amp; imperfections in that work which they may see who read with judgment.

And whether this that Bellarmine doth allege out of it, deserve not to fall within the compass of that censure I appeal to their judgment who have eyes to see: For S. Augustin thought that the word in the original of S. Matthew’s gospel, had, by the Proper signification of it, imported a negation rather then an exception. As he sheweth by saying that where the common Latin translation hath [except for whoredom] in the Greek text it is rather read without the cause of whoredom. Supposing belike (whether by slip of memory or rather oversight) that the same words, which were used before in the fifth Chapter of S. Matthew’s Gospel to the same purpose, were used also in this place: whereas here they differ, and are well expressed by that in the Latin by which S. Austin thought they were not so well. Howbeit, if they had been the same with the former: yet neither so might Bellarmine allow his opinion: considering that the common Latin translation (which Papists by there Council of Trent are bound to stand to under pain of curse) expresseth those likewise as a plain exception.”

— John Rainolds, A defence of the judgment of the Reformed churches. That a man may lawfully not only put away his wife for her adultery, but also marry another. Wherein both Robert Bellarmine the Jesuits Latin treatise, and an English pamphlet of a nameless author maintaining the contrary are confuted by John Raino, (Dordrecht: George Walters, 1609), pp 2-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+proof+here+of+is+evident+if+Christ%E2%80%99s+words+be+weighed+in+the+nineteenth+Chapter+of+S.+Matthew%E2%80%99s+gospel.+For+when+the+Pharisees+asking+him+a+question%2C+whether+it+were+lawful+for+a+man+to+put+away+his+wife+for+every+cause%2C+received+answer+that+it+was+not%2C+and+thereupon+said+unto+him%2C+Why+did+Moses+then+command+to+give+a+bill+of+divorcement+and+to+put+her+a+way%3A+Our+Saviour+said+unto+them%3B+Moses+suffered+you+because+of+the+hardness+of+your+heart+to+put+away+your+wives%3A+But+from+the+beginning+it+was+not+so.+And+I+say+unto+you%2C+that%2C+whosoever+shall+put+away+his+wife%2C+except+it+be+for+whoredom%2C+and+shall+marry+another%2C+doth+commit+adultery%3A+and+who+so+marrieth+her+that+is+put+away%2C+doth+commit+adultery.%0A%0ANow+in+this+sentence%2C+the+clause+of+exception+%5Bexcept+it+be+for+whoredom%5D+doth+argue+that+he+commiteth+not+adultery%2C+who%2C+having+put+away+his+wife+for+whoredom+marrieth+another.%0A%0ABut+he+must+needs+commit+it+in+doing+so+unless+the+band+of+marriage+be+loosed+and+dissolved.+For+who+so+marrieth+another+as+long+as+he+is+bound+to+the+former%2C+is+an+adulterer.+The+band+then+of+marriage+is+loosed+%26+dissolved+between+that+man+and+wife+who+are+put+asunder+and+divorced+for+whoredom.%0A%0AAnd+if+the+band+beloosed%2C+the+man+may+marry+another%3A+seeing+it+is+written+Art+thou+loosed+from+a+wife%3F+If+thou+marry+thou+sinnest+not.+Therefore+it+is+lawful+for+him+who+hath+put+away+his+wife+for+whoredom+to+marry+another.%0A%0AThis+argument+doth+firmly+and+necessarily+conclude+the+point+in+qu +is+left+therein%2C+I+know+not%3A+nay+rather+I+perceive+that+I+have+not+done+it+perfectly%2C+and+thoroughly%2C+although+I+have+opened+many+creeks+thereof%2C+as+whosoever+readeth+with+judgment+may+discern.+S.+Augustin+then+acknowledgeth+that+there+are+some+wants+%26+imperfections+in+that+work+which+they+may+see+who+read+with+judgment.%0A%0AAnd+whether+this+that+Bellarmine+doth+allege+out+of+it%2C+deserve+not+to+fall+within+the+compass+of+that+censure+I+appeal+to+their+judgment+who+have+eyes+to+see%3A+For+S.+Augustin+thought+that+the+word+in+the+original+of+S.+Matthew%E2%80%99s+gospel%2C+had%2C+by+the+Proper+signification+of+it%2C+imported+a+negation+rather+then+an+exception.+As+he+sheweth+by+saying+that+where+the+common+Latin+translation+hath+%5Bexcept+for+whoredom%5D+in+the+Greek+text+it+is+rather+read+without+the+cause+of+whoredom.+Supposing+belike+%28whether+by+slip+of+memory+or+rather+oversight%29+that+the+same+words%2C+which+were+used+before+in+the+fifth+Chapter+of+S.+Matthew%E2%80%99s+Gospel+to+the+same+purpose%2C+were+used+also+in+this+place%3A+whereas+here+they+differ%2C+and+are+well+expressed+by+that+in+the+Latin+by+which+S.+Austin+thought+they+were+not+so+well.+Howbeit%2C+if+they+had+been+the+same+with+the+former%3A+yet+neither+so+might+Bellarmine+allow+his+opinion%3A+considering+that+the+common+Latin+translation+%28which+Papists+by+there+Council+of+Trent+are+bound+to+stand+to+under+pain+of+curse%29+expresseth+those+likewise+as+a+plain+exception.%E2%80%9D%0A%0A%E2%80%94+John+Rainolds%2C+A+defence+of+the+judgment+of+the+Reformed+churches.+That+a+man+may+lawfully+not+only+put+away+his+wife+for+her+adultery%2C+but+also+marry+another.+Wherein+both+Robert+Bellarmine+the+Jesuits+Latin+treatise%2C+and+an+English+pamphlet+of+a+nameless+author+maintaining+the+contrary+are+confuted+by+John+Raino%2C+%28Dordrecht%3A+George+Walters%2C+1609%29%2C+pp+2-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa49a2c7086.html&amp;via=5Solas" target="_blank" rel="noopener"> <blockquote><p>For although the Papists have some glimpse of light &amp; see more then the Heathens, as the Pharisees did whose words (I am afraid) they will use likewise: are we also blind? yet as the Pharisees were overseen foully in many of their arguments grounded upon reason, so the Papists may be. And that they not only may be overseen, but are in the reasons which their puddle-water hath yielded unto Bellarmine’s cisterns in this point: the beams of reason lightened from above shall open &amp; descrie; let such as love not darkness more then light be judges. For he reasoneth first thus: The Marriage of the faithful is a sign of Christ’s conjunction with the Church, as St. Paul teacheth. But that Conjunction is indissoluble, and cannot be loosed, The band of Marriage is therefore indissoluble too. As if a rebel should say. The joining of the Head with the Body in man resembleth the Conjunction of Christ with the Church as St. Paul teacheth.

But Christ &amp; the Church can never be parted, there fore the head may never be cut from the body. A happy conclusion for Traitors, if it were true. But if it bee false where then is Bellarmine’s reason? which will take the greater overthrow by this because look how Christ is the head of the Church, semblably the husband is the wives head. So that notwithstanding the similitude of Christ’s head-ship, the joint whereby a traitorous head is knit unto his body may feel the axe of Justice, as Bell. will grant: the marriage band that coupleth a man to an adulterous wife may be loosed by the like reason, notwithstanding marriage is a sign of Christ’s conjunction with the Church. And if this suffice not to make him acknowledge the looseness &amp; fondness of his sophistical syllogism, let him observe farther that the separation which themselves allow in case of adultery is condemned by it.

For Christ doth continue with his Church alway, &amp; cherisheth her for ever with his spirit of comfort, &amp; he is so far from despoiling her of her own wealth, if she had any, that of his gifts &amp; graces still he leaveth with her. Now the papists teach that a man may lawfully withdraw himself from ever dwelling with his wife, &amp; from yielding husband-like love &amp; duty to her, yea may still with-hold her own dowry from her, if she be an adulteress. Which doctrine how could Bell. cleanse from stain of error, if some whore of Rome should touch it with this reason. The marriage of the faithful is a sign of Christ’s conjunction with the Church, as Paul teacheth? but Christ doth still assist relieve, &amp; enrich the Church with his graces: therefore must the husband dwell still with his wife &amp; find her maintenance &amp; wealth. Would he say the C[ouncil]. of Trent accurseth all who make such Jesuitical syllogisms &amp; sophisms against their sacred canon. Certainly the harlots reason must be good unless the Jesuits be naught.

But he goeth onward, &amp; addeth that albeit some parts of the Church, to wit, some faithful folk do commit spiritual whoredom now &amp; then, &amp; make a divorcement yet it is not lawful for them to change their God. What a speech is this? As who say, our Saviour could deserve at our hands that we should forsake him, &amp; got ourselves a new bridegroom. Neither doth God cast them so away (saith Bell) that he will not be reconciled, nay he doth exhort to reconcilement still; Still? To whom then sware he, they should not enter into his rest? what were they whose carcasses fell in the wilderness? whence came the man of God who willed them that commit idolatry to be slain? where lived the Prophet who says Thou distroyest all them that go a whoring from thee: The Israelites whom God did shut out of the promised land, of whom he took many thousands away by sundry plagues, to whom the law speaketh as being under the law, did they not profess that faith &amp; use those Sacram. which al that doe are faithful folk &amp; parts of the church in Bell. phrase &amp; meaning?

I grant that God offereth to be reconciled sometimes to such offenders, &amp; waiteth in mercy long for their amendment. which if it be a pattern for us to follow herein, I say, if it be, for God gave time of repentance to Joab a will-full murderer, whom the magistrate should have put to death presently: God gave time of repentance to idolatrous wives of the Jews, whom their husbands ought not to have spared so: if therefore God’s action̄ herein be set down for our imitation, the man that can contain, &amp; be without a wife, as God without our service, may likewise in mercy wait for her repentance, &amp; when he perceive it to be unfeigned, take her again to be his wife. But he who can not, or will not render such kindness for such unkindness &amp; wickedness, may in justice also put her so away that no place or hope of reconcilement be left her, as Bell. own reason in this similitude teacheth.

For God is not bound to give unto prophane despisers of his grace &amp; breakers of his covenant place of repentance &amp; reconciliation: Nay he may in justice absolutely deny it them, &amp; oftentimes doth as the examples of Cain, of Esau, of Corah, Dathan &amp; Abiram, of Zimri. of Acan, of Ananias &amp; Saphira, of sinfinit other, that have either presently dyed in their sins, or had sentence of death pronounced irrevocably against them, do argue. wherefore when Bell. concluded this reason with saying that S. Austin urgeth it greatly in his book of the Good of marriage: he dealeth as Cooks do in larding lean-meat to give that a relish, which of it self would be unsavoury.

Though even for the lard too perhaps it agreeth not half so well herewith, as this Italian cook would have us think it doth. For why did not S. Austin urge the same likewise in his books of adulterous marriages written afterward &amp; purposely maintaining this Point against Polētius who gainsaid him in it? was it because he saw that he had urged it more then it would bear well? or that he perceived it would not hold against an adversary: though without an adversary it were a pretty allusion? At least whatsoever men deem of the lard, the meat is naught questions: &amp; such that though the cook be content to eat the driest morsel of it, yet must he needs grant that it hath not taste, not as much as the white of an egg hath. For himself saith that marriage betokeneth &amp; signifieth Christ’s conjunction with the faithful soul, as Thomas [Aquinas?] &amp; the Pope teach. But Christ’s conjunction with the faithful soul is not indissoluble, as him self also saith: the band of marriage therefore (by his own consequence) may be dissolved &amp; loosed. And thus far of his first sophism.</p></blockquote>

— John Rainolds, A defence of the judgment of the Reformed churches. That a man may lawfully not only put away his wife for her adultery, but also marry another. Wherein both Robert Bellarmine the Jesuits Latin treatise, and an English pamphlet of a nameless author maintaining the contrary are confuted by John Raino, (Dordrecht: George Walters, 1609), pp 79-82.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+although+the+Papists+have+some+glimpse+of+light+%26+see+more+then+the+Heathens%2C+as+the+Pharisees+did+whose+words+%28I+am+afraid%29+they+will+use+likewise%3A+are+we+also+blind%3F+yet+as+the+Pharisees+were+overseen+foully+in+many+of+their+arguments+grounded+upon+reason%2C+so+the+Papists+may+be.+And+that+they+not+only+may+be+overseen%2C+but+are+in+the+reasons+which+their+puddle-water+hath+yielded+unto+Bellarmine%E2%80%99s+cisterns+in+this+point%3A+the+beams+of+reason+lightened+from+above+shall+open+%26+descrie%3B+let+such+as+love+not+darkness+more+then+light+be+judges.+For+he+reasoneth+first+thus%3A+The+Marriage+of+the+faithful+is+a+sign+of+Christ%E2%80%99s+conjunction+with+the+Church%2C+as+St.+Paul+teacheth.+But+that+Conjunction+is+indissoluble%2C+and+cannot+be+loosed%2C+The+band+of+Marriage+is+therefore+indissoluble+too.+As+if+a+rebel+should+say.+The+joining+of+the+Head+with+the+Body+in+man+resembleth+the+Conjunction+of+Christ+with+the+Church+as+St.+Paul+teacheth.%0A%0ABut+Christ+%26+the+Church+can+never+be+parted%2C+there+fore+the+head+may+never+be+cut+from+the+body.+A+happy+conclusion+for+Traitors%2C+if+it+were+true.+But+if+it+bee+false+where+then+is+Bellarmine%E2%80%99s+reason%3F+which+will+take+the+greater+overthrow+by+this+because+look+how+Christ+is+the+head+of+the+Church%2C+semblably+the+husband+is+the+wives+head.+So+that+notwithstanding+the+similitude+of+Christ%E2%80%99s+head-ship%2C+the+joint+whereby+a+traitorous+head+is+knit+unto+his+body+may+feel+the+axe+of+Justice%2C+as+Bell.+will+grant%3A+the+marriage+band+that+coupleth+a+man+to+an+adulterous+wife+may+be+loosed+by+the+like+reason%2C+notwithstanding+marriage+is+a+sign+of+Christ%E2%80%99s+conjunction+with+the+Church.+And+if+this+suffice+not+to+make+him+acknowledge+the+looseness+%26+fondness+of+his+sophistical+syllogism%2C+let+him+observe+farther+that+the+separation+which+themselves+allow+in+case+of+adultery+is+condemned+by+it.%0A%0AFor+Christ+doth+continue+with+his+Church+alway%2C+%26+cherisheth+her+for+ever+with+his+spirit+of+comfort%2C+%26+he+is+so+far+from+despoiling+her+of+her+own+wealth%2C+if+she+had+any%2C+that+of+his+gifts+%26+graces+still+he+leaveth+with+her.+Now+the+papists+teach+that+a+man+may+lawfully+withdraw+himself+from+ever+dwelling+with+his+wife%2C+%26+from+yielding+husband-like+love+%26+duty+to+her%2C+yea+may+still+with-hold+her+own+dowry+from+her%2C+if+she+be+an+adulteress.+Which+doctrine+how+could+Bell.+cleanse+from+stain+of+error%2C+if+some+whore+of+Rome+should+touch+it+with+this+reason.+The+marriage+of+the+faithful+is+a+sign+of+Christ%E2%80%99s+conjunction+with+the+Church%2C+as+Paul+teacheth%3F+but+Christ+doth+still+assist+relieve%2C+%26+enrich+the+Church+with+his+graces%3A+therefore+must+the+husband+dwell+still+with+his+wife+%26+find+her+maintenance+%26+wealth.+Would+he+say+the+C%5Bouncil%5D.+of+Trent+accurseth+all+who+make+such+Jesuitical+syllogisms+%26+sophisms+against+their+sacred+canon.+Certainly+the+harlots+reason+must+be+good+unless+the+Jesuits+be+naught.%0A%0ABut+he+goeth+onward%2C+%26+addeth+that+albeit+some+parts+of+the+Church%2C+to+wit%2C+some+faithful+folk+do+commit+spiritual+whoredom+now+%26+then%2C+%26+make+a+divorcement+yet+it+is+not+lawful+for+them+to+change+their+God.+What+a+speech+is+this%3F+As+who+say%2C+our+Saviour+could+deserve+at+our+hands+that+we+should+forsake+him%2C+%26+got+ourselves+a+new+bridegroom.+Neither+doth+God+cast+them+so+away+%28saith+Bell%29+that+he+will+not+be+reconciled%2C+nay+he+doth+exhort+to+reconcilement+still%3B+Still%3F+To+whom+then+sware+he%2C+they+should+not+enter+into+his+rest%3F+what+were+they+whose+carcasses+fell+in+the+wilderness%3F+whence+came+the+man+of+God+who+willed+them+that+commit+idolatry+to+be+slain%3F+where+lived+the+Prophet+who+says+Thou+distroyest+all+them+that+go+a+whoring+from+thee%3A+The+Israelites+whom+God+did+shut+out+of+the+promised+land%2C+of+whom+he+took+many+thousands+away+by+sundry+plagues%2C+to+whom+the+law+speaketh+as+being+under+the+law%2C+did+they+not+profess+that+faith+%26+use+those+Sacram.+which+al+that+doe+are+faithful+folk+%26+parts+of+the+church+in+Bell.+phrase+%26+meaning%3F%0A%0AI+grant+that+God+offereth+to+be+reconciled+sometimes+to+such+offenders%2C+%26+waiteth+in+mercy+long+for+their+amendment.+which+if+it+be+a+pattern+for+us+to+follow+herein%2C+I+say%2C+if+it+be%2C+for+God+gave+time+of+repentance+to+Joab+a+will-full+murderer%2C+whom+the+magistrate+should+have+put+to+death+presently%3A+God+gave+time+of+repentance+to+idolatrous+wives+of+the+Jews%2C+whom+their+husbands+ought+not+to+have+spared+so%3A+if+therefore+God%E2%80%99s+action%CC%84+herein+be+set+down+for+our+imitation%2C+the+man+that+can+contain%2C+%26+be+without+a+wife%2C+as+God+without+our+service%2C+may+likewise+in+mercy+wait+for+her+repentance%2C+%26+when+he+perceive+it+to+be+unfeigned%2C+take+her+again+to+be+his+wife.+But+he+who+can+not%2C+or+will+not+render+such+kindness+for+such+unkindness+%26+wickedness%2C+may+in+justice+also+put+her+so+away+that+no+place+or+hope+of+reconcilement+be+left+her%2C+as+Bell.+own+reason+in+this+similitude+teacheth.%0A%0AFor+God+is+not+bound+to+give+unto+prophane+despisers+of+his+grace+%26+breakers+of+his+covenant+place+of+repentance+%26+reconciliation%3A+Nay+he+may+in+justice+absolutely+deny+it+them%2C+%26+oftentimes+doth+as+the+examples+of+Cain%2C+of+Esau%2C+of+Corah%2C+Dathan+%26+Abiram%2C+of+Zimri.+of+Acan%2C+of+Ananias+%26+Saphira%2C+of+sinfinit+other%2C+that+have+either+presently+dyed+in+their+sins%2C+or+had+sentence+of+death+pronounced+irrevocably+against+them%2C+do+argue.+wherefore+when+Bell.+concluded+this+reason+with+saying+that+S.+Austin+urgeth+it+greatly+in+his+book+of+the+Good+of+marriage%3A+he+dealeth+as+Cooks+do+in+larding+lean-meat+to+give+that+a+relish%2C+which+of+it+self+would+be+unsavoury.%0A%0AThough+even+for+the+lard+too+perhaps+it+agreeth+not+half+so+well+herewith%2C+as+this+Italian+cook+would+have+us+think+it+doth.+For+why+did+not+S.+Austin+urge+the+same+likewise+in+his+books+of+adulterous+marriages+written+afterward+%26+purposely+maintaining+this+Point+against+Pole%CC%84tius+who+gainsaid+him+in+it%3F+was+it+because+he+saw+that+he+had+urged+it+more+then+it+would+bear+well%3F+or+that+he+perceived+it+would+not+hold+against+an+adversary%3A+though+without+an+adversary+it+were+a+pretty+allusion%3F+At+least+whatsoever+men+deem+of+the+lard%2C+the+meat+is+naught+questions%3A+%26+such+that+though+the+cook+be+content+to+eat+the+driest+morsel+of+it%2C+yet+must+he+needs+grant+that+it+hath+not+taste%2C+not+as+much+as+the+white+of+an+egg+hath.+For+himself+saith+that+marriage+betokeneth+%26+signifieth+Christ%E2%80%99s+conjunction+with+the+faithful+soul%2C+as+Thomas+%5BAquinas%3F%5D+%26+the+Pope+teach.+But+Christ%E2%80%99s+conjunction+with+the+faithful+soul+is+not+indissoluble%2C+as+him+self+also+saith%3A+the+band+of+marriage+therefore+%28by+his+own+consequence%29+may+be+dissolved+%26+loosed.+And+thus+far+of+his+first+sophism.%E2%80%9D%0A%0A%E2%80%94+John+Rainolds%2C+A+defence+of+the+judgment+of+the+Reformed+churches.+That+a+man+may+lawfully+not+only+put+away+his+wife+for+her+adultery%2C+but+also+marry+another.+Wherein+both+Robert+Bellarmine+the+Jesuits+Latin+treatise%2C+and+an+English+pamphlet+of+a+nameless+author+maintaining+the+contrary+are+confuted+by+John+Raino%2C+%28Dordrecht%3A+George+Walters%2C+1609%29%2C+pp+79-82.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe842160d09.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e842160d09.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/26/john-rainolds-on-divorce-and-christs-marriage-to-the-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The duty of man and woman joined in marriage, requireth that they two should be as one person, and cleave each to other with mutual love and liking in society of life, until it please God, who hath coupled them together in this bond, to set them free from it, and to dissociate and sever them by death. But the inordinate fancies &amp; desires of our corrupt nature have soe inveigled Adam’s seed in many places, that men have accustomed to put away their wives upon every trifling mislike &amp; discontentment: yea, the Jews supposed themselves to be warranted by God’s law to do it, so that whosoever put away his wife gave her a bill of divorcement.

This perverse opinion &amp; error of theirs our Saviour Christ reproved teaching that divorcements may not be made for any cause save whoredom only. For whosoever (saith he) shall put away his wife except it be for whoredom and shall marry another doth commit adultery and who so marrieth her which is put away, doth commit adultery. Now about the meaning of these words of Christ expressed more fully by one of the Evangelists, by others more sparingly, there hath a doubt arisen: and diverse men even from the primitive churches time have been of diverse minds.

For many of the fathers have gathered thereupon, that if a man’s wife committed whoredom &amp; fornication, he might not only put her away, but marry another. Some others, and among them namely S. Augustine, have thought that the man might put away his wife but marry another he might not.

The School divines of latter years, &amp; the Canonists, as for the most part they were addicted commonly to S. Austin’s judgment, did likewise follow him herein &amp; the Pope’s maintaining their doctrine for Catholic, have possessed the church of Rome with this opinion. But since in our days the light of good learning both for arts &amp; tongues hath shined more brightly by God’s most gracious goodness then in the former ages, and the holy scriptures by the help thereof have been the better understood: the Pastors and Doctors of the reformed Churches have perceived &amp; shewed, that if a man’s wife defile her self with fornication, he may not only put her away by Christ’s Doctrine but also marry another. Wherein that they teach agreeably to the truth, and not erroneously, as Jesuits &amp; Papists do falsely and unjustly charge them.</p></blockquote>

<blockquote><p>Our Saviour Christ proceeding further, to restore the seventh commandment to his perfection, doth here confute a false interpretation of a Politick law of Moses, given by the Scribes and Pharisees. For this end, first he lays down the words of Moses politick law; but yet so, as containing in them the false interpretation of the Jewish teachers, ver. 31. then he opposeth the truth of God, against their false interpretation, and maintaineth the first institution of marriage, v. 32.

For the first, Moses politick law was, That he which put away his wife, should give her a Bill of divorce. This law the Jewish Teachers did falsely interpret; for the better perceiving whereof, these three points are to be handled, touching Moses politick law: 1. what kind of law it was: 2. the straightness of that law: 3. what effect and force it had. For the first, the law is set down, Deut. 24. 1. when a man marrieth a wife, and she find no favour in his eyes, because he hath espied some filthiness in her; then let him write her a bill of divorce, and put it in her hand, and send her out of his house. This law was not moral, but civil, or politick, for the good ordering of the common wealth.

Now among their particular laws, some were laws of toleration, and permission, which were such as did not approve of the evil which they concerned, but did only tolerate and permit that evil which could not be avoided, for the preventing of a greater evil, which otherwise would fall out. As when the sea hath made a breach into the land, if it cannot possibly be stopped, the best course is, to make it as narrow as may be. Such was the law concerning usury, Deut. 23. 20. permitting the Jews to exercise it upon a stranger, but not towards a brother: and the like was the law touching polygamy, Deut. 21. 15.

If a man had two wives, the one hated, the other loved, and they both have borne him children; if the first borne be the son of the hated (though she were married to him the latter) yet her seed was legitimate, and her son had the right of the first borne. In both which laws were tolerated, that which God condemned, only for the preventing of a greater evil. Under this sort comes our law of usury, for taking ten in the hundred, not approving but permitting so much, for the avoiding of greater usury.

Unto this kind, the Papists would reduce their law of permitting Stews, for the preventing of greater sins; but that law can have no title to such permission: for a law of permission, is to diminish that evil, which by man cannot possibly be cut off altogether: now that sin which they would prevent by their Stews, might be cut off among them, if they would give allowance to God’s own ordinance of lawful marriage, unto all sorts and sexes. So likewise this law of Moses for divorce, was a law of permission, not approving of the giving a bill of divorce for every light cause, but tolerating of it, for the preventing of greater mischief, even of murder: for the nature of the Jews was this; if a man once took dislike to his wife, he would never be at rest till he had shed her blood, if they might not be parted asunder.

Now this law of divorce, was given to restrain this great evil, for hereby a man was tolerated to put away his wife, when she found no favour in his eyes, lest he should kill her; yet so, as he gave her a bill of divorce, wherein he must set down the cause why he put her away: whereby also, many were restrained from putting away their wives, because it was a great shame, for a light occasion, so highly to transgress God’s holy institution, who made them by marriage, one flesh. The truth of this may appear by the Lord’s own complaint, against his people, to whom he speaketh, as to a wife that had forsaken her husband, without a cause on his behalf, Isay 50. 1. Where (saith he) is that bill of your mother’s divorcement, whereby I sent her away? As if he should say, I gave her no bill, but her departure and separation from mee, is by her own sins: which phrase sheweth what was the custom of the Jews in this case.

II. Point. The straightness of this law appears in this, that the man only was permitted to give this bill unto his wife, but the wife might not give it to her husband; for Moses saith, Whosoever shall put away his wife: neither is there any place in Scripture, to prove that the wife had this liberty, so to deal with her husband. If it bee asked, whether the wife in a just cause, as for adultery, had not the like liberty:

I answer, If we respect God’s institution touching marriage, the right of divorce is equal to them both; for in regard of the bond of marriage, they are equally bound one to another. Here indeed this liberty is permitted only to the man, by this politick law, not that he had more right, but to prevent the evil, of the hardness of his heart, who taking displeasure at his wife, would rather spill her blood, then continue with her. If it be alleged, that a man is the woman’s head: I answer, that is for regiment and direction in her place, but not in regard of breaking the bond of marriage, whereby he is bound to his wife, as well as she to him, as the Apostle teacheth, 1. Cor. 7. 4.

III. Point. The force and effect of this law was this, It made the Bill of divorcement for any cause given, to be tolerable before men; &amp; marriage after such a divorce, lawful and warrantable in the Courts of men, Deut. 24. 4. But yet in the court of conscience before God, the divorcement it self, and second marriages made thereupon, were both unlawful; for God hateth this separation, Mal. 2. 15. And whether party soever marrieth another upon this divorce, commits adultery, Matth. 19. 9. This must be remembered, for the true understanding of this law of Moses; the first words whereof, are a permission, to this effect; If a man do conceive such a dislike against his wife, as that he will not abide with her, but will needs put her away, then he may; but yet so, as he give her a bill of divorce: which doth not acquit him before God, but before men only.</p></blockquote>

<blockquote><p>Thirdly, here may be asked, whether after divorce for adultery, the parties divorced may marry again, without committing adultery? This point hath bin diversely discussed, we will consider the reasons on both sides; First, for the lawfulness of it, especially to the party innocent.

1. From Christ’s doctrine in this place; for in his answer to the false interpretation of Moses’ politick Law, touching divorce, he first propounds a general rule, and then puts an exception thereto: the nature of which exception is, always to imply and put down the contrary to the general rule. As in this place; the general rule is, Whosoever putteth away his wife, causeth her to commit adultery; &amp; he that marrieth her committeth adultery. The exception then must be contrary; namely, that in the case of adultery, he that puts away his wife, lawfully convicted thereof, causeth her not to commit adultery; neither he that marrieth her that is divorced, doth commit adultery. If it be said, that Christ propounded two rules, one for the case of divorce, the other for the case of marrying after divorce; &amp; applieth his exception for adultery only to the case of divorce, and not to the case of marriage after divorce.

Ans. As the exception for adultery, is here in this chapter joined with the case of divorce; he that putteth away his wife, except it be for fornication, &amp;c. so in the 19. cha. v. 9. the same exception for adultery, is expressly applied not only to the case of divorce, but also to the case of marriage after divorce; saying, Whosoever shall put away his wife, except it be for fornication, and marry another, committeth adultery: so that if in this place the exception make the divorce lawful for adultery, then in the 19. chapter, it maketh it lawful to marry again after such divorce, without the guilt of adultery. 2. The innocent party is not to be punished for the wilfulness of the offender, and therefore the party that is faultless may with good conscience marry again, after lawful divorce. 3. God hath provided marriage to be a remedy against incontinency for all persons, 1. Corinth. 7. 2.

But if parties lawfully divorced, might not marry again, then they should want this remedy, and be deprived of this benefit. If it be said, they may reconcile themselves each to other, and so have remedy. Answer. But what if the party offending live in adultery still, then the party innocent cannot in conscience join him or her self to the other, and reunite the bond of matrimony; for that were too much lenity, towards so foul a crime: and a sin against God, for want of Christian reconciliation, which requireth that this reuniting should be in the Lord, and not in the flesh alone. 4. The phrases of Scripture used by the holy Ghost, concerning marriage after divorce, restraining it to some cases, and allowing it in others, seem to take it for granted, that after lawful divorce, it is no sin to marry again.

Reasons alleged on the other side. First, Christ’s general saying, Whosoever putteth away his wife, and marrieth another, committeth adultery. Hence some infer, that there may be no marriage at all after any divorce. But they abuse that Scripture, for though Saint Mark put down no exception; yet Matthew hath made supply thereof in two places, Chapter 5. 32. and 19. 9. Now the Gospels were penned by several men, that that which was not fully expressed by one, might be supplied by another, that so by conferring writer with writer, the whole truth might be made manifest.

Secondly, Matth. 19. 6. Whom God hath coupled, let not man put asunder: Therefore after divorce, they still remain man and wife, before God, and may not marry to others. Ans. The party offending breaks the bond of marriage, and so sinneth grievously against that commandment: but the party innocent marrying again after lawful divorce, only taketh the benefit of that liberty, whereto God hath set him free, through the unlawful breaking of the bond, by the party offending.

Thirdly, Rom. 6. 2. The woman is bound to the man while he liveth, and therefore may not marry again after divorcement. Ans. That place must be understood of the state of marriage, continuing undissolved till death: but in the case of adultery, the bond of marriage is broken; and therefore that hindreth not, but marriage may be after lawful divorce.

Fourthly, 1. Corinth. 7. 10, 11. Let not the wife depart from her husband, and if she depart, let her remain unmarried, and be reconciled unto her husband, and let not the husband put away his wife. Here (say they) is a plain place against marriage after divorcement. Answer. The Apostle speaketh of departure, and putting away, for other causes then adultery; as for hatred, dislike, &amp;c. which indeed are no sufficient causes of divorce, and therefore they that separate thereupon, ought not to marry.

Fifthly, The bond of marriage, is a resemblance of the conjunction that is between Christ and his Church, which is inseparable and eternal; and therefore marriage also is inseparable. Answer. That resemblance stands not in every thing, but in this, That as in marriage two are made one flesh, so spiritually Christ, and every true member of his Church become one; and that as Eve was taken out of Adam’s side, and made flesh of his flesh, and bone of his bone; so the Church springeth as it were out of Christ’s blood, which issued from his side: for else, if their reason were good, we might say that marriage should be eternal, in the life to come; because the union of Christ with his Church, is eternal: which we know to be false, for in the resurrection men marry not, but are as the angels of God.

Sixthly, If parties divorced might marry again, their children should be injured, having step-fathers or step-mothers instead of their own natural parents. Ans. This reason is not sufficient to disallow divorce, or marriage after it; for by the same reason we might delude all the judicial laws of Moses, and of all countries, which impose death for sundry crimes, because thereby some children should lose their parents; but Justice must be justice with all men, though the posterity have hindrance by the execution thereof.

Quest. But what if the laws of some countries forbid marriage after divorcement? Ans. Yet the liberty of conscience remaineth still, for this being given of God cannot be taken away by men; and therefore when men have freedom from the Magistrate, they may with good conscience marry again after lawful divorce. And yet here we must know, that divorcement, or marriage after, must not be done privately by man and wife upon their own heads; but by order of law, before the Magistrate, according to the custom of that Church or Commonwealth whom it concerns.

Again, there be some particular causes which may justly hinder marriage after divorce: as first, if the parties reunite their bond again by reconciliation; for the knot broken by adultery, may be reunited by the consent of the party innocent. Secondly, when the one party is a manifest cause of the Adultery of the other, and so becomes an accessory to the other’s offence: for it seems unequal, that he who hath put his hand to the committing of a sin, should reap any benefit or privilege by the same. And therefore I say the party innocent hath freedom in this case.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thirdly, here may be asked, whether after divorce for adultery, the parties divorced may marry again, without committing adultery? This point hath bin diversely discussed, we will consider the reasons on both sides; First, for the lawfulness of it, especially to the party innocent.

1. From Christ’s doctrine in this place; for in his answer to the false interpretation of Moses’ politick Law, touching divorce, he first propounds a general rule, and then puts an exception thereto: the nature of which exception is, always to imply and put down the contrary to the general rule. As in this place; the general rule is, Whosoever putteth away his wife, causeth her to commit adultery; &amp; he that marrieth her committeth adultery. The exception then must be contrary; namely, that in the case of adultery, he that puts away his wife, lawfully convicted thereof, causeth her not to commit adultery; neither he that marrieth her that is divorced, doth commit adultery. If it be said, that Christ propounded two rules, one for the case of divorce, the other for the case of marrying after divorce; &amp; applieth his exception for adultery only to the case of divorce, and not to the case of marriage after divorce.

Ans. As the exception for adultery, is here in this chapter joined with the case of divorce; he that putteth away his wife, except it be for fornication, &amp;c. so in the 19. cha. v. 9. the same exception for adultery, is expressly applied not only to the case of divorce, but also to the case of marriage after divorce; saying, Whosoever shall put away his wife, except it be for fornication, and marry another, committeth adultery: so that if in this place the exception make the divorce lawful for adultery, then in the 19. chapter, it maketh it lawful to marry again after such divorce, without the guilt of adultery. 2. The innocent party is not to be punished for the wilfulness of the offender, and therefore the party that is faultless may with good conscience marry again, after lawful divorce. 3. God hath provided marriage to be a remedy against incontinency for all persons, 1. Corinth. 7. 2.

But if parties lawfully divorced, might not marry again, then they should want this remedy, and be deprived of this benefit. If it be said, they may reconcile themselves each to other, and so have remedy. Answer. But what if the party offending live in adultery still, then the party innocent cannot in conscience join him or her self to the other, and reunite the bond of matrimony; for that were too much lenity, towards so foul a crime: and a sin against God, for want of Christian reconciliation, which requireth that this reuniting should be in the Lord, and not in the flesh alone. 4. The phrases of Scripture used by the holy Ghost, concerning marriage after divorce, restraining it to some cases, and allowing it in others, seem to take it for granted, that after lawful divorce, it is no sin to marry again.

Reasons alleged on the other side. First, Christ’s general saying, Whosoever putteth away his wife, and marrieth another, committeth adultery. Hence some infer, that there may be no marriage at all after any divorce. But they abuse that Scripture, for though Saint Mark put down no exception; yet Matthew hath made supply thereof in two places, Chapter 5. 32. and 19. 9. Now the Gospels were penned by several men, that that which was not fully expressed by one, might be supplied by another, that so by conferring writer with writer, the whole truth might be made manifest.

Secondly, Matth. 19. 6. Whom God hath coupled, let not man put asunder: Therefore after divorce, they still remain man and wife, before God, and may not marry to others. Ans. The party offending breaks the bond of marriage, and so sinneth grievously against that commandment: but the party innocent marrying again after lawful divorce, only taketh the benefit of that liberty, whereto God hath set him free, through the unlawful breaking of the bond, by the party offending.

Thirdly, Rom. 6. 2. The woman is bound to the man while he liveth, and therefore may not marry again after divorcement. Ans. That place must be understood of the state of marriage, continuing undissolved till death: but in the case of adultery, the bond of marriage is broken; and therefore that hindreth not, but marriage may be after lawful divorce.

Fourthly, 1. Corinth. 7. 10, 11. Let not the wife depart from her husband, and if she depart, let her remain unmarried, and be reconciled unto her husband, and let not the husband put away his wife. Here (say they) is a plain place against marriage after divorcement. Answer. The Apostle speaketh of departure, and putting away, for other causes then adultery; as for hatred, dislike, &amp;c. which indeed are no sufficient causes of divorce, and therefore they that separate thereupon, ought not to marry.

Fifthly, The bond of marriage, is a resemblance of the conjunction that is between Christ and his Church, which is inseparable and eternal; and therefore marriage also is inseparable. Answer. That resemblance stands not in every thing, but in this, That as in marriage two are made one flesh, so spiritually Christ, and every true member of his Church become one; and that as Eve was taken out of Adam’s side, and made flesh of his flesh, and bone of his bone; so the Church springeth as it were out of Christ’s blood, which issued from his side: for else, if their reason were good, we might say that marriage should be eternal, in the life to come; because the union of Christ with his Church, is eternal: which we know to be false, for in the resurrection men marry not, but are as the angels of God.

Sixthly, If parties divorced might marry again, their children should be injured, having step-fathers or step-mothers instead of their own natural parents. Ans. This reason is not sufficient to disallow divorce, or marriage after it; for by the same reason we might delude all the judicial laws of Moses, and of all countries, which impose death for sundry crimes, because thereby some children should lose their parents; but Justice must be justice with all men, though the posterity have hindrance by the execution thereof.

Quest. But what if the laws of some countries forbid marriage after divorcement? Ans. Yet the liberty of conscience remaineth still, for this being given of God cannot be taken away by men; and therefore when men have freedom from the Magistrate, they may with good conscience marry again after lawful divorce. And yet here we must know, that divorcement, or marriage after, must not be done privately by man and wife upon their own heads; but by order of law, before the Magistrate, according to the custom of that Church or Commonwealth whom it concerns.

Again, there be some particular causes which may justly hinder marriage after divorce: as first, if the parties reunite their bond again by reconciliation; for the knot broken by adultery, may be reunited by the consent of the party innocent. Secondly, when the one party is a manifest cause of the Adultery of the other, and so becomes an accessory to the other’s offence: for it seems unequal, that he who hath put his hand to the committing of a sin, should reap any benefit or privilege by the same. And therefore I say the party innocent hath freedom in this case.”

— William Perkins, A godly and learned exposition of Christ’s Sermon in the Mount, (Cambridge: University of Cambridge, 1608), pp 146-49.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+here+may+be+asked%2C+whether+after+divorce+for+adultery%2C+the+parties+divorced+may+marry+again%2C+without+committing+adultery%3F+This+point+hath+bin+diversely+discussed%2C+we+will+consider+the+reasons+on+both+sides%3B+First%2C+for+the+lawfulness+of+it%2C+especially+to+the+party+innocent.%0A%0A1.+From+Christ%E2%80%99s+doctrine+in+this+place%3B+for+in+his+answer+to+the+false+interpretation+of+Moses%E2%80%99+politick+Law%2C+touching+divorce%2C+he+first+propounds+a+general+rule%2C+and+then+puts+an+exception+thereto%3A+the+nature+of+which+exception+is%2C+always+to+imply+and+put+down+the+contrary+to+the+general+rule.+As+in+this+place%3B+the+general+rule+is%2C+Whosoever+putteth+away+his+wife%2C+causeth+her+to+commit+adultery%3B+%26+he+that+marrieth+her+committeth+adultery.+The+exception+then+must+be+contrary%3B+namely%2C+that+in+the+case+of+adultery%2C+he+that+puts+away+his+wife%2C+lawfully+convicted+thereof%2C+causeth+her+not+to+commit+adultery%3B+neither+he+that+marrieth+her+that+is+divorced%2C+doth+commit+adultery.+If+it+be+said%2C+that+Christ+propounded+two+rules%2C+one+for+the+case+of+divorce%2C+the+other+for+the+case+of+marrying+after+divorce%3B+%26+applieth+his+exception+for+adultery+only+to+the+case+of+divorce%2C+and+not+to+the+case+of+marriage+after+divorce.%0A%0AAns.+As+the+exception+for+adultery%2C+is+here+in+this+chapter+joined+with+the+case+of+divorce%3B+he+that+putteth+away+his+wife%2C+except+it+be+for+fornication%2C+%26c.+so+in+the+19.+cha.+v.+9.+the+same+exception+for+adultery%2C+is+expressly+applied+not+only+to+the+case+of+divorce%2C+but+also+to+the+case+of+marriage+after+divorce%3B+saying%2C+Whosoever+shall+put+away+his+wife%2C+except+it+be+for+fornication%2C+and+marry+another%2C+committeth+adultery%3A+so+that+if+in+this+place+the+exception+make+the+divorce+lawful+for+adultery%2C+then+in+the+19.+chapter%2C+it+maketh+it+lawful+to+marry+again+after+such+divorce%2C+without+the+guilt+of+adultery.+2.+The+innocent+party+is+not+to+be+punished+for+the+wilfulness+of+the+offender%2C+and+therefore+the+party+that+is+faultless+may+with+good+conscience+marry+again%2C+after+lawful+divorce.+3.+God+hath+provided+marriage+to+be+a+remedy+against+incontinency+for+all+persons%2C+1.+Corinth.+7.+2.%0A%0ABut+if+parties+lawfully+divorced%2C+might+not+marry+again%2C+then+they+should+want+this+remedy%2C+and+be+deprived+of+this+benefit.+If+it+be+said%2C+they+may+reconcile+themselves+each+to+other%2C+and+so+have+remedy.+Answer.+But+what+if+the+party+offending+live+in+adultery+still%2C+then+the+party+innocent+cannot+in+conscience+join+him+or+her+self+to+the+other%2C+and+reunite+the+bond+of+matrimony%3B+for+that+were+too+much+lenity%2C+towards+so+foul+a+crime%3A+and+a+sin+against+God%2C+for+want+of+Christian+reconciliation%2C+which+requireth+that+this+reuniting+should+be+in+the+Lord%2C+and+not+in+the+flesh+alone.+4.+The+phrases+of+Scripture+used+by+the+holy+Ghost%2C+concerning+marriage+after+divorce%2C+restraining+it+to+some+cases%2C+and+allowing+it+in+others%2C+seem+to+take+it+for+granted%2C+that+after+lawful+divorce%2C+it+is+no+sin+to+marry+again.%0A%0AReasons+alleged+on+the+other+side.+First%2C+Christ%E2%80%99s+general+saying%2C+Whosoever+putteth+away+his+wife%2C+and+marrieth+another%2C+committeth+adultery.+Hence+some+infer%2C+that+there+may+be+no+marriage+at+all+after+any+divorce.+But+they+abuse+that+Scripture%2C+for+though+Saint+Mark+put+down+no+exception%3B+yet+Matthew+hath+made+supply+thereof+in+two+places%2C+Chapter+5.+32.+and+19.+9.+Now+the+Gospels+were+penned+by+several+men%2C+that+that+which+was+not+fully+expressed+by+one%2C+might+be+supplied+by+another%2C+that+so+by+conferring+writer+with+writer%2C+the+whole+truth+might+be+made+manifest.%0A%0ASecondly%2C+Matth.+19.+6.+Whom+God+hath+coupled%2C+let+not+man+put+asunder%3A+Therefore+after+divorce%2C+they+still+remain+man+and+wife%2C+before+God%2C+and+may+not+marry+to+others.+Ans.+The+party+offending+breaks+the+bond+of+marriage%2C+and+so+sinneth+grievously+against+that+commandment%3A+but+the+party+innocent+marrying+again+after+lawful+divorce%2C+only+taketh+the+benefit+of+that+liberty%2C+whereto+God+hath+set+him+free%2C+through+the+unlawful+breaking+of+the+bond%2C+by+the+party+offending.%0A%0AThirdly%2C+Rom.+6.+2.+The+woman+is+bound+to+the+man+while+he+liveth%2C+and+therefore+may+not+marry+again+after+divorcement.+Ans.+That+place+must+be+understood+of+the+state+of+marriage%2C+continuing+undissolved+till+death%3A+but+in+the+case+of+adultery%2C+the+bond+of+marriage+is+broken%3B+and+therefore+that+hindreth+not%2C+but+marriage+may+be+after+lawful+divorce.%0A%0AFourthly%2C+1.+Corinth.+7.+10%2C+11.+Let+not+the+wife+depart+from+her+husband%2C+and+if+she+depart%2C+let+her+remain+unmarried%2C+and+be+reconciled+unto+her+husband%2C+and+let+not+the+husband+put+away+his+wife.+Here+%28say+they%29+is+a+plain+place+against+marriage+after+divorcement.+Answer.+The+Apostle+speaketh+of+departure%2C+and+putting+away%2C+for+other+causes+then+adultery%3B+as+for+hatred%2C+dislike%2C+%26c.+which+indeed+are+no+sufficient+causes+of+divorce%2C+and+therefore+they+that+separate+thereupon%2C+ought+not+to+marry.%0A%0AFifthly%2C+The+bond+of+marriage%2C+is+a+resemblance+of+the+conjunction+that+is+between+Christ+and+his+Church%2C+which+is+inseparable+and+eternal%3B+and+therefore+marriage+also+is+inseparable.+Answer.+That+resemblance+stands+not+in+every+thing%2C+but+in+this%2C+That+as+in+marriage+two+are+made+one+flesh%2C+so+spiritually+Christ%2C+and+every+true+member+of+his+Church+become+one%3B+and+that+as+Eve+was+taken+out+of+Adam%E2%80%99s+side%2C+and+made+flesh+of+his+flesh%2C+and+bone+of+his+bone%3B+so+the+Church+springeth+as+it+were+out+of+Christ%E2%80%99s+blood%2C+which+issued+from+his+side%3A+for+else%2C+if+their+reason+were+good%2C+we+might+say+that+marriage+should+be+eternal%2C+in+the+life+to+come%3B+because+the+union+of+Christ+with+his+Church%2C+is+eternal%3A+which+we+know+to+be+false%2C+for+in+the+resurrection+men+marry+not%2C+but+are+as+the+angels+of+God.%0A%0ASixthly%2C+If+parties+divorced+might+marry+again%2C+their+children+should+be+injured%2C+having+step-fathers+or+step-mothers+instead+of+their+own+natural+parents.+Ans.+This+reason+is+not+sufficient+to+disallow+divorce%2C+or+marriage+after+it%3B+for+by+the+same+reason+we+might+delude+all+the+judicial+laws+of+Moses%2C+and+of+all+countries%2C+which+impose+death+for+sundry+crimes%2C+because+thereby+some+children+should+lose+their+parents%3B+but+Justice+must+be+justice+with+all+men%2C+though+the+posterity+have+hindrance+by+the+execution+thereof.%0A%0AQuest.+But+what+if+the+laws+of+some+countries+forbid+marriage+after+divorcement%3F+Ans.+Yet+the+liberty+of+conscience+remaineth+still%2C+for+this+being+given+of+God+cannot+be+taken+away+by+men%3B+and+therefore+when+men+have+freedom+from+the+Magistrate%2C+they+may+with+good+conscience+marry+again+after+lawful+divorce.+And+yet+here+we+must+know%2C+that+divorcement%2C+or+marriage+after%2C+must+not+be+done+privately+by+man+and+wife+upon+their+own+heads%3B+but+by+order+of+law%2C+before+the+Magistrate%2C+according+to+the+custom+of+that+Church+or+Commonwealth+whom+it+concerns.%0A%0AAgain%2C+there+be+some+particular+causes+which+may+justly+hinder+marriage+after+divorce%3A+as+first%2C+if+the+parties+reunite+their+bond+again+by+reconciliation%3B+for+the+knot+broken+by+adultery%2C+may+be+reunited+by+the+consent+of+the+party+innocent.+Secondly%2C+when+the+one+party+is+a+manifest+cause+of+the+Adultery+of+the+other%2C+and+so+becomes+an+accessory+to+the+other%E2%80%99s+offence%3A+for+it+seems+unequal%2C+that+he+who+hath+put+his+hand+to+the+committing+of+a+sin%2C+should+reap+any+benefit+or+privilege+by+the+same.+And+therefore+I+say+the+party+innocent+hath+freedom+in+this+case.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+godly+and+learned+exposition+of+Christ%E2%80%99s+Sermon+in+the+Mount%2C+%28Cambridge%3A+University+of+Cambridge%2C+1608%29%2C+pp+146-49.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb6b6adee19.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/b6b6adee19.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/23/william-perkins-on-divorce-and-remarriage/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>One [reason for marriage] is, the propagation of children, signified in that when Moses saith, Gen. ii. 22, “He created them male and female,” not both male nor both female, but one male and the other female; as if he created them fit to propagate other. And therefore when he had created them so, to shew that propagation of children is one end of marriage, he said unto them, “Increase and multiply,” Gen. i. 28; that is, bring forth children, as other creatures bring forth their kind.

For this cause marriage is called matrimony, which signifieth motherage, because it maketh them mothers which were virgins before, and is the seminary of the world, without which all things should be in vain, for want of men to use them; for God reserveth the great city to himself; and this suburbs he hath set out unto us, which are regents by sea and by land.</p></blockquote>

<blockquote><p>It was in point of fact a part of their most intimate experience through a generation of communistic living that, while the obnoxious “mine” and” thine” continue valid in the most intimate relation of life, it is folly to speak of their abolition elsewhere.

But though we may justly say that the experience of the Oneida Community provides an empirical demonstration of the theoretically obvious proposition that communism cannot exist apart from the aid of “complex marriage,” with all its accompaniments and consequences, it by no means follows that permanency can be secured to it merely by this outrage on the deepest instincts of human nature.

There are other instincts of human nature also which communism outrages, and on which all attempts to establish a communistic society must ultimately be wrecked. Property itself, for example, upon which communism makes its most immediate assault, is just as much a law of nature – or, let us say, a law of God, – is just as much an ineradicable instinct of man – as marriage, with which it is indeed inextricably involved.

Goldwin Smith, in an illuminating page, instructs us to think of property not as an institution of human society, but as a fundamental condition of human life. “A state of things in which a man would not think that what he had made for himself was his own,” he remarks, “is unknown to experience and beyond the range of our conceptions.” The economical value of property may arise from the circumstance that it is “the only known motive of production.”

But the right of property does not rest on this consideration of expediency, but is intrinsic in the individual’s right to himself. This right he can never yield, and all attempts at communism, which are at bottom only attempts to deprive men of their ineradicable rights – to themselves and the fruits of their own activities – are bound to break to pieces in the end on these primaeval instincts of the race.</p></blockquote>

<blockquote><p>It is lawful for all sorts of people to marry, who are able with judgment to give their consent. Yet it is the duty of Christians to marry only in the Lord. And therefore such as profess the true reformed religion should not marry with infidels, papists, or other idolaters: neither should such as are godly be unequally yoked, by marrying with such as are notoriously wicked in their life, or maintain damnable heresies. (Westminster Confession 24.3)

The minutes of the Westminster Assembly give us an interesting glimpse into how this section of the Confession was eventually formulated:

Report was made from the committee of that committed about marriage. …

The Assembly debated the Report of that committed about marriage, and upon debate it was

Resolved upon the Q: The former proposition about consent of parents be waved.

Resolved upon the Q: that mention be made concerning papists and other Idolators.

Resolved upon the Q: that some others besides papists and other Idolators be mentioned.

Resolved upon the Q: such as profess the true Reformed Religion ought not to marry with papists, Infid[e]ls and other Idolators.

Resolved upon the Q: nor ought such as are godly to be unequally yoaked with such as are notoriously wicked in their life.

Resolved upon the Q: ther[e] shall be a further addition.

Resolved upon the Q: These words shall be added, ‘or maintain damnable Heresies’.</p></blockquote>

<blockquote><p>The third cause is to avoid the inconvenience of solitariness, signified in these words, “It is not good for man to be alone;” as though he had said, This life would be miserable and irksome, and unpleasant to man, if the Lord had not given him a wife to company his troubles. If it be not good for man to be alone, then it is good for man to have a fellow; therefore as God created a pair of all other kinds, so he created a pair of this kind.

We say that one is none, because he cannot be fewer than one, he cannot be less than one, he cannot be weaker than one, and therefore the wise man saith, Eccles. iv. 10, ‘Woe to him that is alone,’ that is, he which is alone shall have woe. Thoughts, and cares, and fears will come to him because he hath none to comfort him, as thieves steal in when the house is empty; like a turtle which hath lost his mate; like one leg when the other is cut off; like one wing when the other is clipped; so had the man been, if the woman had not been joined to him; therefore for mutual society, God coupled two together, that the infinite troubles which lie upon us in the world might be eased with the comfort and help one of another, and that the poor in the world might have some comfort as well as the rich ; for “the poor man,” saith Solomon, “is forsaken of his own brethren,” Prov. xix. 7; yet God hath provided one comfort for him, like Jonathan’s armour-bearer, that shall never forsake him, 1 Sam. xiv. 7, that is, another self, which is the only commodity (as I may term it) wherein the poor do match the rich; without which some persons should have no helper, no comfort, no friend at all.

But as it is not good to be alone, so Solomon sheweth that “it is better to be alone than to dwell with a froward wife,” Prov. xxi. 9, which is like a quotidian ague, to keep his patience in ure [sic]. Such furies do haunt some men, like Saul’s spirit, 1 Sam. xvi. 14, as though the devil had put a sword into their hands to kill themselves; therefore choose whom thou mayest enjoy, or live alone still, and thou shalt not repent thee of thy bargain.</p></blockquote>

<blockquote><p>Yet it is still a greater wonder to me, why they compel a man to remain unmarried after being separated from his wife by divorce, and why they will not permit him to remarry. For if Christ permits divorce on the ground of unchastity and compels no one to remain unmarried, and if Paul would rather have us marry than burn [I Cor. 7:9], then he certainly seems to permit a man to marry another woman in the place of the one who has been put away.</p></blockquote>

<blockquote><p>Many prophets of Neo-Confederate mythology argue that attacks on the non-recognition of slave-marriages and legal proscriptions on slave-literacy in the Old South are actually slanderous, and that the antebellum South was the epitome of a Christian commonwealth. The interesting thing is that the Revd James Henley Thornwell, one of the leading proslavery apologists among the Old School Presbyterians,[1] recognised that unbiblical practices concerning slave-marriage and anti-scriptural legislation concerning slave-literacy actually existed in his home state (South Carolina). Although we differ with Thornwell in seeing such things as incidental evils, as the whole system of American slavery was based on iniquitous man-stealing, we do nonetheless applaud his honesty on these matters:

Our Synod has just closed its sessions. A large committee was appointed, of which I am chairman, to draw up a paper, to be presented to the next Synod, on the subject of slavery, defining the true position of our Church, and suggesting means for rectifying some of the abuses and evils incidental to the institution. We shall probably recommend a petition to the Legislature, praying that a law may be enacted, to protect the family relations of the slave; and that the disgraceful statute, which prohibits them from learning to read, may be repealed. I shall take great pains in the preparation of the document, and would be glad to receive any suggestions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-h-thornwell.html">J. H. Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to B. M. Palmer, 20 Oct. 1847 in B. M. Palmer, The life and letters of James Henley Thornwell, D.D., LL.D., ex-president of the South Carolina College, late professor of theology in the theological seminary at Columbia, South Carolina (Richmond, 1875), p. 301.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“Many prophets of Neo-Confederate mythology argue that attacks on the non-recognition of slave-marriages and legal proscriptions on slave-literacy in the Old South are actually slanderous, and that the antebellum South was the epitome of a Christian commonwealth. The interesting thing is that the Revd James Henley Thornwell, one of the leading proslavery apologists among the Old School Presbyterians,[1] recognised that unbiblical practices concerning slave-marriage and anti-scriptural legislation concerning slave-literacy actually existed in his home state (South Carolina). Although we differ with Thornwell in seeing such things as incidental evils, as the whole system of American slavery was based on iniquitous man-stealing, we do nonetheless applaud his honesty on these matters:

Our Synod has just closed its sessions. A large committee was appointed, of which I am chairman, to draw up a paper, to be presented to the next Synod, on the subject of slavery, defining the true position of our Church, and suggesting means for rectifying some of the abuses and evils incidental to the institution. We shall probably recommend a petition to the Legislature, praying that a law may be enacted, to protect the family relations of the slave; and that the disgraceful statute, which prohibits them from learning to read, may be repealed. I shall take great pains in the preparation of the document, and would be glad to receive any suggestions.”

<blockquote><p>In an address submitted before the General Assembly of the Confederate Presbyterian Church in 1863, Dr James A. Lyon condemned the laws of Southern states with respect to slave marriages. Keep in mind that Dr Lyon was not a Yankee abolitionist, but a proslavery Southern Presbyterian. His comments reveal that, far from being a great Christian society, the Old South gave legal protection to the most base immorality. In light of this extract, the idea of theonomists promoting the Old South as a model of “liberty and justice” is madness (thankfully men like Brian Schwertley, Gary North and Bojidar Marinov dissent from such folly; may more do likewise):

But perhaps there is not dereliction connected with negro slavery, as it exists in this country, fraught with more evil, whether viewed in relation to the happiness and moral character of the slave himself, or to the interests of the institution as such, than that of ignoring, in our legislation, the marriage and domestic relations amongst slaves. This is, indeed, a crying and a damaging evil, that sets at defiance the precepts of the Bible, the dictates of nature, and the moral sentiment of humanity. There is no law of God more clearly and repeatedly promulgated, in both natural and revealed religion, than that constituting the marriage and domestic relations.

There is no institution, human or divine, so efficient in developing the various attributes of man’s nature, and, consequently, in yielding so much unalloyed happiness, as that of the family, as God constituted it. The relations of husband and wife, parent and child, next to our relation to God in filial love and Christian faith, are calculated to develop and cultivate traits and amenities in the nature of man, without which humanity is defective, and unproductive of true happiness. …

Hence it is impossible from the very nature of the case, to civilize, elevate, and Christianize a savage people, in the absence of the conjugal and domestic ties. The whole Gospel can not be preached to a people in that condition. It would be a mockery alike of the moral law and the precepts of Christianity. To make the attempt would be to regard and treat the slave as a brute, and not as a man. And yet, it is not worth while to attempt to disguise the fact that, however much humane and conscientious individuals may attempt to respect the marriage and domestic relations, as existing between their own slaves – and we are happy to testify that multitudes do – yet, nevertheless, the laws of the land, for which we are all and every one responsible, wholly ignore the marriage relation as existing among slaves. There is nothing in our legislation, so far as we know, that recognizes marriage between the slaves; or that prohibits fornication, adultery, bigamy, incest, or even rape amongst them.

This is an outrage upon the laws of God, both natural and revealed, except on the presumption that the slave is not a man, but a brute, with a brute’s propensities, a brute’s nature, and a brute’s destiny. These evils, it is true, may be mitigated by the conscientious, Christian master, to some extent; but it is only a mitigation; since no one can prevent the domestic ties from being sundered at the will of the unfeeling or unfortunate master, the creditor, the executor, or the law commissioner. And the fact that this violation of God’s law is done by human law, does not relieve our consciences, or extenuate our guilt, in the least, from the fact that we, the people, are the makers of law.

Did we live under a despotism, had we no part in the framing of laws and the establishment of government, then our responsibility for this and other evils in our legislation would not be so great. Nevertheless, as the ambassadors, not of an earthly potentate, but of “the King of kings and Lord of lords,” we are commissioned and bound to tell law-makers, rulers, and governors, their duty, whether they will hear or whether they will forebear. But our government is a popular government, and every freeman is a sovereign; and all are responsible alike for the laws, and the manner in which they are executed. Consequently, no citizen who has a right to vote, or even to speak the truth, can free himself from the responsibility attending the legislation of the land, until he has exerted all his influence, in every lawful way, to make it accord with righteousness. …

This law of man’s nature – the natural right to the happiness flowing from it – no power on earth can frustrate, without setting at defiance the clearly revealed laws of God. But, lamentable as the fact is, and however much to be deplored, this holy institution, as existing between the slaves, is wholly ignored by the laws of the land. There is no law, in any State, so far as we know, that recognizes marriage between the slaves, or that condemns any of the vices growing out of the relation of the sexes perpetrated between the slaves. In this respect, therefore, our legislation does not conform to the principles of Christianity, nor to the dictates of nature, but is a sin against both; and, as a natural consequence, is attended with evils of immense magnitude. … Whenever human legislation is contrary to the dictates of nature, to say nothing of revealed religion, then we may be sure it is wrong, and will sooner or later inevitably result in evil.</p></blockquote>

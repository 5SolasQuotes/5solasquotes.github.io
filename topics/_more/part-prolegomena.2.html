</figure><figure class="quote" id="q-a178804e77" data-kw="">
<blockquote><p>The Psalter is of all books of the Bible that book which gives expression to the experimental side of religion. In the law and the prophetic writings, it is God who speaks to his people; but in the Psalter we listen to the saints speaking to God. Hence the Psalter has been at all times that part of Scripture to which believers have most readily turned and upon which they have chiefly depended for the nourishment of the inner religious life of the heart.

I say that part of Scripture and not merely that part of the Old Testament, for even taking the Old and New Testament together the common experience of the people of God affirms that there is nothing in Holy Writ which in our most spiritual moments – when we feel ourselves nearest to God – so faithfully and naturally express what we think and feel in our hearts as these songs of the pious Israelites.

Our Lord himself, who had a perfect religious experience and lived and walked with God in absolute adjustment of his thoughts and desires to the Father’s mind and will, our Lord himself found his inner life portrayed in the Psalter and in some of the highest moments of his ministry borrowed from it the language in which his soul spoke to God, thus recognizing that a more perfect language for communion with God cannot be framed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace and Glory: Sermons Preached in the Chapel of Princeton Theological Seminary</cite>, (1922; Edinburgh: Banner of Truth, 1994), pp 169-70.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-7d48192352" data-kw="">
<blockquote><p>1. We have learned from none others the plan of our salvation, than from those through whom the Gospel has come down to us, which they did at one time proclaim in public, and, at a later period, by the will of God, handed down to us in the Scriptures, to be the ground and pillar of our faith. …

2. These have all declared to us that there is one God, Creator of heaven and earth, announced by the law and the prophets; and one Christ the Son of God. If any one do not agree to these truths, he despises the companions of the Lord; nay more, he despises Christ Himself the Lord; yea, he despises the Father also, and stands self-condemned, resisting and opposing his own salvation, as is the case with all heretics.</p></blockquote>

<blockquote><p>Now it [theology] differs from other systems, and bodies of Sciences. 1 Because it is revealed from above; all other knowledge is gathered from things below. 2 Again, all other sciences are taught by men, but this is taught by the Holy Ghost. 3 All other knowledge is delivered in the writings of men, but this is revealed to us in the holy Word of God, which was written by God himself, though men were the mediate pen men of it; therefore I add that, to distinguish it from other Sciences; that, It is not revealed by men, but by the Holy Ghost, not in books written by men, but in the holy Scriptures.</p></blockquote>

<blockquote><p>And as Christ is the priest, as he is also the victim and the price of our reconciliation. He offered himself on the altar of the cross not to the devil, but to the triune God, and he did so for all with regard to the sufficiency of the price, but only for the elect with regard to the efficacy, because he brought about salvation only for the predestined.</p></blockquote>

</figure><figure class="quote" id="q-4f63c5d071" data-kw="">
<blockquote><p>So the apostle in these two verses is shewing what that knowledge of God was which the Heathens had, and how they came by it. God’s eternal power and Godhead, which are in themselves invisible, was a thing the knowledge whereof was attainable by the light of nature. They had common principles of knowledge given them of God, whereby, looking upon the works of creation, they might safely and solidly gather, what a God he was and what was his due; so that they were rendered inexcusable in abusing this light; and their mouths were stopped, so that they had nothing to say for themselves, why they lived in ungodliness and unrighteousness. …

However the Lord Jehovah be it himself unsearchable, yet hath he left at much light in folks, that were they desirous, by the very principles of natural knowledge, they might see as much of God as might convince them that he only is to be worshipped, loved, and feared for it pleased the Lord that as much as might be sufficient for this end, should remain attainable by sand-blind nature; that is it that might be known.</p></blockquote>

ormed Covenanter</a></div>
</figure><figure class="quote" id="q-b42d51e283" data-kw="">
<blockquote><p>While Thomas Aquinas strongly resisted the blasphemous notion that God had the power to do things contrary to his nature (such as sin and lie), he did not adhere to the other erroneous view that divine omnipotence was restricted to what God actually does:

[I]f we consider his power absolutely, he can do other things besides those that are subject to his providence or operation: but he cannot do what has been eternally contained in the order to his providence, because he is unchangeable. Through failing to observe this distinction some have fallen into various errors. Some in an endeavour to extend to things themselves the unchangeableness of the divine order, said that all things must of necessity be as they are; so much so, that some declared that God is unable to do except what he does. Against this we have the words Matth. 26:53: Cannot I ask my Father, and he will give me presently more than twelve legions of angels?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, trans. English Dominican Fathers (c. 1265; London, 1924), 3.98.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-367a9e378d" data-kw="">
<blockquote><p>We must not confound inspiration and providence – either by reducing the inspiration by which the Scriptures were given to the level of providential guidance of the writers, or by raising the providence by which they have been preserved to the level of inspiration. The Confession intends the distinction to be taken at its full value: one was an immediate and the other a mediate activity of God. And the product correspond to the difference: one produced the plenarily inspired Bible, every word of which is the Word of God; the other produced the safe transmission of that Word, but not without signs of human fallibility here and there in the several copies.

We thus have brought before us by the Confession, in turn, the original autograph of Scripture, produced by the immediate inspiration of God; the preservation of this autographic text in a multitude of copies whose production is presided over by God’s singular care and providence; and the ordinary Bibles in the hands of the people, each of which conveys divine truth to the reader with competent adequacy for all the needs of the Christian life.

And the Presbyterian doctrine of the Bible, therefore, embraces these three points: (1) the plenary inspiration of the Bible as God gave it, by which it is made the Word of God, trustworthy in every one of its affirmations; (2) the safe preservation of the Bible as God gave it, so as to be accessible to men, in the use of the ordinary means of securing a trustworthy text; and (3) the adequate transmission of the saving truth in every and any honest translation, so that the Word of God is accessible to all at all times for all ordinary purposes. The hearty acceptance of all three of these propositions is necessary, if we would range ourselves alongside of the Westminster Confession.</p></blockquote>

positions+is+necessary%2C+if+we+would+range+ourselves+alongside+of+the+Westminster+Confession.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+The+Westminster+Confession+and+the+original+autographs+in+Selected+shorter+writings+of+Benjamin+B.+Warfield&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F367a9e378d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/367a9e378d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2014/09/11/b-b-warfield-and-the-preservation-of-scripture-3/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-a2bc381e5b" data-kw="">
<blockquote><p>Hence we see that the reformed Protestant religion is the only true religion that is in the world, because it is built upon the infallible truth and veracity of God. We have reason to be thankful to God, that it is not built upon such sandy foundations as human unwritten traditions, or any human testimony whatsoever.

It is built upon the God of truth, and not upon fallible men. We admit the testimony of the church as an help to our faith, but not the ground and foundation of it. The precious truths which we believe, we receive them not upon the testimony of the God of truth that cannot lie.

But the Popish religion hath no sure foundation. The faith of Papists is built upon the testimony of the churches, Popes, or councils, but upon the testimony of the God of truth that cannot lie. But the Popish religion hath no sure foundation. The faith of Papists is built upon the testimony of men; so that their religion hath no more certainty in it, than these men have of infallibility.</p></blockquote>

</figure><figure class="quote" id="q-56ad3908e5" data-kw="">
<blockquote><p>It is thus perfectly clear that, according to the Confession, the preservation of the Scriptures in their purity is of as vital importance to the Church as their original inspiration. The Presbyterian Church is committed by its Confession of Faith […] to the doctrine that the inspired Scriptures have been preserved pure through the ages, as truly as to the doctrine that the Scriptures were given by the immediate inspiration of God. […] We must take the language of the Confession as it stands, and in its natural and historical meaning. […]

But Professor [Henry Preserved] Smith goes as far astray in the opposite direction, in misinterpreting the Confession, when he would urge us to believe that its language here asserts the absolute purity of every, or of any one, copy of Scripture. When he says, “What the Confession affirms, it affirms of the seventeenth century Hebrew and Greek editions which are more imperfect than our own,” he puts into the Confession something which its authors did not put there. Thus he would drive us into a dilemma and force us either to modify the Confession’s assertion of the truth of inspired Scriptures, or to declare, with what he affirms to be the meaning of the Confession, the “absolute purity” of every copy of Scripture.

It is not difficult to decline so factitious a dilemma. The Confession knows nothing of it. It does assert the preservation of Scripture in “absolute purity”: but it does not assert the “absolute purity” of “the seventeenth century editions,” or of every copy, or of any copy of Scripture. We scan the text of the Confession in vain for any allusion to such a monstrous assertion. It would be to convict its authors (who had variant copies in their hands) of incredible folly to suppose them capable of such an assertion. The most cursory appeal to their writings on the subject will exonerate them from so unheard-of a charge. They do assert the preservation of Scripture to the Church in absolute purity by God’s singular care and providence. But they did not find that Scripture, in all its purity, in any one copy in any one printer’s impression. They recognized the fallibilities of copyists and typesetters; and they looked for the pure text of Scripture, not in one copy, but in all copies. “What mistake is in one copy,” they declared through one of their number, “is corrected in another.” And so they proclaimed the perfect preservation of Scripture, in its absolute purity, through all ages, in entire consistency with the recognition that many copies might come from the press filled with corruptions, and that no copy would ever be made by men, wholly free from error.</p></blockquote>

<blockquote><p>In the assault on the trustworthiness of the Scriptures, with which the Presbyterian Church has been vexed for the last few years, two closely related but separable assertions have been made prominent. One of these concerned the gift of Scripture, or in other words the doctrine of Biblical inspiration. The other concerned the transmission of Scripture, or in other words the doctrine of Biblical preservation. In the course of the discussion attention has been chiefly concentrated upon the former topic. But the assailants of the trustworthiness of the Scriptures have no more sharply denied the plenary inspiration of the Bible as God gave it to men than they have denied the safe preservation of this Bible as God gave it to men. Their contention has ever been twofold: that God never gave an errorless Bible, and if he did, that errorless Bible is no longer in the possession of men. The air has been thick with satirical references to autographic copies which no man has ever seen, which are hopelessly lost, which can never be recovered. And the defenders of the trustworthiness of Scripture have been sarcastically asked what the use is of contending so strenuously for the plenary inspiration of autographs which have thus forever passed away.

The answer is very obvious that such a contention would be undoubtedly very foolish indeed; but that no one ever made such a foolish contention. It has not been those that have been defending the doctrine of the plenary inspiration of the autographs who have asserted the hopeless loss of this plenarily inspired text. The denial of the plenary inspiration of the autographs and of the safe preservation of the inspired text have rather gone hand in hand. The defenders of the trustworthiness of the Scriptures have constantly asserted, together, that God gave the Bible as the errorless record of his will to men, and that he has, in his superabounding grace, preserved it for them to this hour – yea, and will preserve it for them to the end of time. […] that not only was the inspired Word, as it came from God, without error, but that it remains so; that the Church still has this inspired Word and still has it without error. […] it is as truly heresy to affirm that the inerrant Bible has been lost to men as it is to declare that there never was an inerrant Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Confession and the original autographs in Selected shorter writings of Benjamin B. Warfield</cite></span></figcaption>

<blockquote><p>Qu. What is every one bound to know?

Ans. God, and himself.

Q. Where is this knowledge to be had?

<blockquote><p>27. Yet the Scripture is not so tied to those first tongues, but that it may and ought also to be translated into other tongues, for the common use of the Church.

28. But among interpreters, neither, those seventy, who turned it into Greek, nor Heirome [Jerome], nor any such like did perform the office of a Prophet, so that he should be free from errors in interpreting.

29. Hence no persons are absolutely authenticall, but so far forth only as they do express the fountains, by which also they are to be tried.

30. Neither is there any authority in Earth whereby any version may be made simply authenticall.

31. Hence the providence of GOD in preserving the Fountains, hath been always famous, and to be adored, not only that they did not wholly perish, but also that they should not be maimed by the loss of any book, or deformed by any grievous fault, when in the mean while there is no one of the ancient versions that remains whole.

32. Nevertheless, from those human versions there may be all those things perceived which are absolutely necessary, if so be they agree with the fountains in essential parts, as all those versions that are received in the Churches are wont to do, although they differ, and are defective in the smaller things not a few.

33. Neither therefore must we always rest in any version that is received: but we must most religiously provide, that the most pure and faultless interpretation be put upon the Church.</p></blockquote>

<blockquote><p>Although we must not regard as the doctrine of the Reformed those which can by any method be deduced from their confessions and be imputed to them; nor as the opinion of the Lutherans that which may be inferred from their doctrine – it does not follow that we must not consider as the word of God that which may be lawfully and plainly deduced from it. The cases are entirely different. For the Holy Spirit (who searches the deep things of God as he is omniscient) could foresee and intend whatever it was possible to gather rightly from his words. But men (who are neither omniscient nor infallible) were unable to know what might in after times be deduced from their words.</p></blockquote>

<blockquote><p>Although the church before Moses did not have a written word, it does not follow that it can also do without it now. Then the church was still in its infancy and had not as yet been formed into a body politic, but now it is increased and more populous. Its position in former times was different from it is increased and more populous. Its position in former times was different from what it is now. In those times, the unwritten word could be more easily preserved on account of the longevity of the patriarchs, the fewness of the covenanted and the frequency of revelations (although it suffered not a few corruptions). But in other times when the life of man was shortened, and the church was no longer comprehended within one or another family, but increased to a most numerous people and the divine oracles were more sparingly declared, another method of instruction became necessary so that this sacred republic might be governed not only be spoken word, but by the written law.</p></blockquote>

</figure><figure class="quote" id="q-d82d41e871" data-kw="">
<blockquote><p>Wisdom is an architectonic system commanding and directing all others. Now this is most peculiar to theology, which is so far the arbiter and mistress of all sciences that it judges of them and cannot itself by judged by another. For all other systems must be referred to it as a standard, and whatever does not agree with theology must be rejected from them. So although it does not prescribe to other systems principles and objects, yet it so far rules over them (because it establishes their limits) that they neither dare hold to any object opposed to theology, nor to use their principles against it. And also with respect to the ultimate end (viz., the glory of God) which although they do not immediately attain, yet they are bound to have such a direction. […]

If theology takes some things from other systems, it is not as an inferior from superiors, but as a superior from inferiors (as a mistress freely using her handmaids). Theology does not so much take from others, as presupposes certain previously known things upon which it builds revelation.</p></blockquote>

</figure><figure class="quote" id="q-cf6d09d969" data-kw="">
<blockquote><p>We have always thought that the serious imperfections that are justly chargeable upon the most favourite uninspired hymns furnish a powerful argument against employing them in the Psalmody of the Church. The Inspired Psalms, as being the dictates of the Spirit of truth, are entirely free from error, and although, in some cases, we may be unable to discover the application of the figures, or the full import of the expressions, we cannot hesitate for a moment to declare, that in arrangement, expression, and design, the psalms are absolutely perfect. To say otherwise, as some modern hymn-makers have done, is to charge the Author of inspiration with imperfection, and to cast contempt on his best gift to our world. No such declaration, however, can, with propriety, be used in relation to those merely human compositions which have been introduced to rank with the Psalms of David, or, in many cases, to supplant them, in the praises of the Church. Select the most esteemed of them, and they will be found, either in matter, or style, or arrangement, to betray evident marks of human imperfection: in some instances, noxious error it diffused under the embellishments of poetry; in others, the style is turgid, abounding in puerile conceits or unnatural images, and forced expressions; while, in almost all, there is a wide departure from the unadorned simplicity and dignified gravity of the Words of the Holy One of Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Mar. 1837, p. 49</span></figcaption>

the-psalter/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-94480cac2f" data-kw="">
<blockquote><p>The opponents of the exclusive use of inspired psalmody can never show a satisfactory reason, why the inspired songs should be collected into a separate book of sacred Scripture, entitled the Book of Psalms, and recognized, under this designation, by our Lord and his Apostles, unless they admit the position for which we contend – that they were intended for standing and exclusive use, in the Church. […]

There is one material fact, besides, that must not be overlooked. Some of the inspired songs which are to be found in other parts of sacred Scripture, are transferred into the collection. The song contained in the sixteenth of the Second Chronicles, for instance, forms a part of several psalms – the 105th, 96th, and 106th – and the thanksgiving hymn, recorded in the twenty-second chapter of Second Samuel, forms the matter of the 18th psalm. On the other hand, several elevated songs of praise, such as the songs of Moses and Hannah, and Hezekiah’s thanksgiving hymn, are not to be met with in the Book of Psalms. What satisfactory reason can be assigned for this diversity? This inquiry cannot be solved otherwise than by taking into account the purpose for which the collection of inspired psalms was made. The design could not be to preserve to the Church all the inspired songs which holy men composed; for that was already accomplished, by their insertion in other places of the sacred canon. Neither could it be to bring together the detached productions of one inspired writer; for the psalms are the productions of several. Nor was the design of the collection to furnish one complete view of inspired songs; for then there would not have been the omissions which we have noticed. The collection must have been made, therefore, in order to set before the Church the psalms that should be exclusively used in the celebration of praise; – and the Book of Psalms was designed to be a Divine directory of praise, throughout all generations.</p></blockquote>

</figure><figure class="quote" id="q-4e717cf62d" data-kw="">
<blockquote><p>Others may claim a liberty to dispute whether civil coercion and restraint of gross heretics, idolaters and blasphemers, be an exercise of civil authority sanctioned by Scripture:- but to those who have received the Standards of the church as scriptural, and are resolved to maintain them, there is no room left for discussion on this article. These Standards do most plainly and unequivocally teach the doctrine of magistratical coercion, and the proofs which they exhibit from sacred Scripture show that they regard this principle as authorised by the real word of truth.</p></blockquote>

</figure><figure class="quote" id="q-53a575220c" data-kw="">
<blockquote><p>However political parties or sentimentalists in religion may assert that ministers of the Gospel are travelling out of their proper province by introducing into the pulpit subjects connected with national institutions or acts, we have no fear that you, brethren, will readily adopt such a conclusion. […] The Word of God is a perfect rule of faith and practice for men in every relation; and to its inspired and unerring dictates, as the ultimate arbiter, every question in morals or religion must be referred for decision. The sacred Scriptures contain a complete system of politics, stamped with a heavenly origin, and susceptible of application to men in every condition, and in all countries, till the end of time. Large portions of the Inspired volume are taken up with the concerns of civil government; and some of the most eminent believers, whose lives are recorded, and whose characters are delineated in the Bible, are not less distinguished as patriots than as saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of nations favoured with divine revelation to promote scriptural education: in two discourses</cite>, (Belfast, 1840), pp 3-4.</span></figcaption>

</figure><figure class="quote" id="q-176be492d3" data-kw="">
<blockquote><p>[…] God’s will is to have his word understood of mankind, we may thereby gather especially, because that in speaking to his servants he used a most common kind of speech, wherewithal even the very idiots [uneducated persons – DR] were acquainted. Neither do we read that the prophets and apostles, the servants of God and interpreters of his high and everlasting wisdom, did use any strange kind of speech: so that in the whole pack of writers none can be found to excel them in a more plain and easy phrase of writing. Their writings are full of common proverbs, similitudes, parables, comparisons, devised narrations, examples, and such othe like manner of speeches, than which there is nothing that doth more move and plainly teach the common sorts of wits among mortal men. There ariseth, I confess, some darkness in the scriptures, by reason of the natural property, figurative ornaments, and the unacquainted use of the tongues. But that difficulty may easily be helped by study, diligence, faith, and the means of skilful interpreters. I know that the apostle Peter saith, in the epistles of Paul “many things are hard to be understood:” but immediately he addeth, “which the unlearned, and those that are unperfect, or unstable, pervert, as they do the other scriptures also, unto their own destruction.” Whereby we gather, that the scripture is difficult or obscure to the unlearned, unskilful, unexcercised, and malicious or corrupted wills, and not to the zealous and godly readers or hearers thereof.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[…] God’s will is to have his word understood of mankind, we may thereby gather especially, because that in speaking to his servants he used a most common kind of speech, wherewithal even the very idiots [uneducated persons – DR] were acquainted. Neither do we read that the prophets and apostles, the servants of God and interpreters of his high and everlasting wisdom, did use any strange kind of speech: so that in the whole pack of writers none can be found to excel them in a more plain and easy phrase of writing. Their writings are full of common proverbs, similitudes, parables, comparisons, devised narrations, examples, and such othe like manner of speeches, than which there is nothing that doth more move and plainly teach the common sorts of wits among mortal men. There ariseth, I confess, some darkness in the scriptures, by reason of the natural property, figurative ornaments, and the unacquainted use of the tongues. But that difficulty may easily be helped by study, diligence, faith, and the means of skilful interpreters. I know that the apostle Peter saith, in the epistles of Paul “many things are hard to be understood:” but immediately he addeth, “which the unlearned, and those that are unperfect, or unstable, pervert, as they do the other scriptures also, unto their own destruction.” Whereby we gather, that the scripture is difficult or obscure to the unlearned, unskilful, unexcercised, and malicious or corrupted wills, and not to the zealous and godly readers or hearers thereof.”

— Heinrich Bullinger, Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i,71.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B%E2%80%A6%5D+God%E2%80%99s+will+is+to+have+his+word+understood+of+mankind%2C+we+may+thereby+gather+especially%2C+because+that+in+speaking+to+his+servants+he+used+a+most+common+kind+of+speech%2C+wherewithal+even+the+very+idiots+%5Buneducated+persons+%E2%80%93+DR%5D+were+acquainted.+Neither+do+we+read+that+the+prophets+and+apostles%2C+the+servants+of+God+and+interpreters+of+his+high+and+everlasting+wisdom%2C+did+use+any+strange+kind+of+speech%3A+so+that+in+the+whole+pack+of+writers+none+can+be+found+to+excel+them+in+a+more+plain+and+easy+phrase+of+writing.+Their+writings+are+full+of+common+proverbs%2C+similitudes%2C+parables%2C+comparisons%2C+devised+narrations%2C+examples%2C+and+such+othe+like+manner+of+speeches%2C+than+which+there+is+nothing+that+doth+more+move+and+plainly+teach+the+common+sorts+of+wits+among+mortal+men.+There+ariseth%2C+I+confess%2C+some+darkness+in+the+scriptures%2C+by+reason+of+the+natural+property%2C+figurative+ornaments%2C+and+the+unacquainted+use+of+the+tongues.+But+that+difficulty+may+easily+be+helped+by+study%2C+diligence%2C+faith%2C+and+the+means+of+skilful+interpreters.+I+know+that+the+apostle+Peter+saith%2C+in+the+epistles+of+Paul+%E2%80%9Cmany+things+are+hard+to+be+understood%3A%E2%80%9D+but+immediately+he+addeth%2C+%E2%80%9Cwhich+the+unlearned%2C+and+those+that+are+unperfect%2C+or+unstable%2C+pervert%2C+as+they+do+the+other+scriptures+also%2C+unto+their+own+destruction.%E2%80%9D+Whereby+we+gather%2C+that+the+scripture+is+difficult+or+obscure+to+the+unlearned%2C+unskilful%2C+unexcercised%2C+and+malicious+or+corrupted+wills%2C+and+not+to+the+zealous+and+godly+readers+or+hearers+thereof.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+godly+and+learned+sermons+divided+into+the+five+decades+containing+the+chief+and+principal+points+of+Christian+religion%2C+ed.+Thomas+Harding+%281849-52+Parker+edn%3B+4+vols%2C+Grand+Rapids%2C+2004%29%2C+i%2C71.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F176be492d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/176be492d3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/10/09/henry-bullinger-on-the-bible-in-the-common-language-of-the-people/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

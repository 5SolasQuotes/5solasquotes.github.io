<blockquote><p>Hence we derive these instructions:

1. It is the duty of pastors to call and excite the people to the constant reading and meditation of the Scriptures: it is the duty of the people to obey such exhortations.

2. They grievously sin who excite Christian people to the knowledge of human traditions and fables; in the mean time forbidding them, as a thing full of danger, the reading of either Testament, that is, of the Divine word.

3. The word of God ought not only to be publicly preached in the temples, but to be read and heard in private houses.

4. In the word of God is contained the treasure of all wisdom necessary to salvation.

5. All, even the laics, should labour to obtain an understanding and full knowledge of Divine things.

6. That implied knowledge which the Papists would have to be sufficient for the laity, is the offspring of laziness, the mother of impiety, not of devotion.

Therefore, the decree of the Council of Trent, and received opinion of the Papists, by which they deny that the Scriptures ought to be had in the vernacular tongue, or that the study of the Scriptures is to be required from the laity, may be refuted from this passage: nay, they affirm, that it is more safe for them to be restrained from reading the Scriptures, and is sufficient for them to regulate their course of life by the direction of their Pastors alone.

But the contrary opinion (which is ours, and the same as the Apostles) we shall shew can be confirmed, the sources of our argument being indicated,

1. From the command of God, who commands the study of the Scriptures not only to the clergy but to the people, and so to all who live in the Church; Deut. xi. 18, 19.

2. From the intention of God; who would have the doctrine of salvation to be delivered in writing, to the intent that it might be accessible to all, John xx. 31, and Rom. xv. 4.

3. From the commendation of all those who have applied themselves to the reading of the Scriptures. The eunuch is commended Acts viii. 28; the Bereans, Acts xvii. 11: yea, all are pronounced blessed who become assiduous in the study of the Scriptures, Ps. i.

4. From the case of the Apostles; who, as they preached publicly the mysteries of salvation to the people, so also, by their Epistles, they recommended the whole doctrine to be read by the same. For it is most absurd for any one to say that what was heretofore written as much to the people as to the clergy, is not now proper to be read by the people. We may instance the Epistles to the Romans, Corinthians, Galatians, Ephesians.

5. From the utility and necessity of this study. By the reading of the Scriptures men are enlightened and converted, Ps. xix. 8, 9. They are directed as by the most faithful counselors, in all the ways of life, Ps. cxix. 24. They are armed against the fiery darts of Satan, Ephes. vi.</p></blockquote>

<blockquote><p>IV. In addition to the reasons from Scripture, method in theological matters is urgently demanded for the following reasons: (1) The nature of God, who, since he is not a “God of confusion,” has conducted and does conduct all his works in the most orderly way possible, and desires all things to be done “decently and in order” (1 Cor. 14:33, 40).

Surely for this reason he conferred on rational creatures the principles of order and method, that he might show that he is the author of all order and method, and also that he might direct us to preserve order and method, certainly in general, but especially in matters of great importance. And without doubt, theological matters of this sort. To that end, he also inspired the writing of his Scriptures by amanuenses in an order according to his choice, and yet certain and logical. …

(2) The nature of this theology, which, since it embraces diverse dogmas scattered throughout the vast corpus of Scripture that are among themselves mutually consistent, ordered, and aiming at the same goal, certainly requires those dogmas to be collected and constructed in a manner mutually consonant with one another.</p></blockquote>

<blockquote><p>WHAT ought you to believe concerning the Scriptures, the fountain of all Divine knowledge.

A. That the whole Scriptures were given by the inspiration of God, and so are the very word of God.

Proofs.

2 Tim. 3. 16. All Scripture is given by inspiration of God, &amp;c.

2 Pet. 1. 21. For the Prophecy came not in old time, by the will of man, but holy Men of God, spake as they were moved by the holy Ghost.

Q. What else?

A. That they are perfect every way sufficient of themselves, to direct us in all things needful to holiness or salvation.

Proofs.

Psal. 19. 7. The Law of the Lord is perfect, &amp;c.

2 Tim. 3. 16. 17. And is profitable for doctrine, for reproof, &amp;c. That the man of God may be perfect, &amp;c.</p></blockquote>

<blockquote><p>The whole counsel of God concerning all things necessary for His own glory, man’s salvation, faith and life, is either expressly set down in Scripture, or by good and necessary consequence may be deduced from Scripture: unto which nothing at any time is to be added, whether by new revelations of the Spirit, or traditions of men. (Westminster Confession 1.6)

Many have been perplexed by the Confession’s emphasis upon the validity of “good and necessary consequence” deductions from scripture, as they assume that this adds to the Bible as the rule of faith. On the contrary, as Fisher’s Catechism explains, the Bible demands that we make valid logical deductions from its own teaching:

Q. 42. Are plain and necessary consequences to be admitted as a part of the rule, as well as the express scriptures?

A. Yes; as is evident from the instance of our Lord, in proving the doctrine of the resurrection against the Sadducees, Matt. 22:31, 32 – “As touching the resurrection of the dead, have ye not read that which was spoken unto you by God, saying, I am the God of Abraham, the God of Isaac, and the God of Jacob? God is not the God of the dead, but of the living.</p></blockquote>

<blockquote><p>Systematic Theology – embracing the development into an all-embracing and self-consistent system of contents of that Revelation, and its subsequent elucidation and defence. …

10. What is embraced under the head of Systematic Theology[?]

As the name imports, Systematic Theology has for its object the gathering all that the Scriptures teach as to what we are to believe and to do, and the presenting all the elements of this teaching in a symmetrical system. The human mind must seek unity in all its knowledge. God’s truth is one, and all the contents of all revelations natural and supernatural must constitute one self-contained system, each part organically related to every other.

The method of construction is inductive. It rests upon the results of Exegesis for its foundation. Passages of Scripture ascertained and interpreted are its data. These when rightly interpreted reveal their own relations and place in the system of which the Person and work of Christ is the centre. And as the contents of revelation stand intimately related to all the other departments of human knowledge, the work of Systematic Theology necessarily involves the demonstration and illustration of the harmony of all revealed truth with all valid science, material and psychological, with all true speculative philosophy, and with all true moral philosophy and practical philanthropy.

It includes — (1.) The construction of all the contents of revelation into a complete system of faith and duties. (2.) The history of this process as it has prevailed in the Church during the past. (3.) Polemics.</p></blockquote>

<blockquote><p>This Argument he explains two ways; First, By shewing, that the Gentiles had certain remnants of the light of Nature, concerning the worshiping of God; because that which may be known of God by natural light, was manifest to them, to wit, The Eternity, Power, and Divinity of God, with the rest of his Attributes, which are apprehended by the light of Nature, even from the Creation of the World, were manifested (by the things that were made) clearly as in a glass, that they could not plead ignorance. …

Secondly, He explains the former Argument, by shewing that the Gentiles detained and imprisoned the known truth, partly, in that they gave not God the glory of his Attributes, and divine works, as also that they were not thankful for his benefits, which the light of Nature would have taught them. Partly, because they became vain in their imaginations, and deceived themselves, being blind where they seemed most of all to be wise, leaving those true Principles concerning God, through their own false reasonings, they drew false conclusions about God, and the worshiping of him.

Lastly, They apparently manifested their ingratitude and folly by their works; they framed the images of men and beasts, whereby they would represent God, or the properties of God, to the eye; thus, as much as in them lay, they changed the glory of God, dishonoured by so vile a comparison, into those abominable images.</p></blockquote>

<blockquote><p>Irenaeus of Lyon observed that while the Gnostics or Valentinians claimed to get their notions from the Bible, their assertion should be viewed as fraudulent since the did not acknowledge the “consent of all the parts” of scripture (Westminster Confession 1.5):

<blockquote><p>5. But there were some who held that Job was not someone who was in the nature of things, but that this was a parable made up to serve as a kind of theme to dispute providence, as men frequently invent cases to serve as a model for debate. Although it does not matter much for the intention of the book whether or not such is the case, it makes a difference for the truth itself.

This aforementioned opinion seems to contradict the authority of Scripture. In Ezekiel, the Lord is represented as saying, if there were three just men in our midst, Noah, Daniel, and Job, these would free your souls by their justice (Ezek 14:14). Clearly Noah and Daniel really were men in the nature of things, and so there should be no doubt about Job, who is the third man numbered with them. Also, James says, behold, we bless those who persevered. You have heard of the suffering of Job and you have seen the intention of the Lord (Jas 5:11). Therefore, one must believe that the man Job was a man in the nature of things.</p></blockquote>

<blockquote><p>It is infallible and certain. The infallibility of it is witnessed by those places where God’s Word is compared to Gold seven times refined, and where it is said, Heaven and earth shall sooner pass away, then one jot or tittle, (a). And so thy testimonies are sure; By all this it appeareth, that the Word of God is a fixed Canon, it cannot be wrested and wyer-drawn, so as to approve one thing to day, and the contrary to morrow: It is hellish blasphemy to compare it to a nose of Wax; and to say that it is to be interpreted secundum currentem statum Ecclesiae, as the condition of the Church altereth, so must the Scripture alter; thereby they confirm that of Tertullian, Deus non erit Deus nisi homini placuerit, God shall not be God unless man please.

If you say, that the Apostle Peter speaks of some who did wrest the Scripture, and put it upon the wrack; This is to be granted concerning the words, not the sense, and matter of the Holy Ghost intended by those words: That is invariable and cannot be a Reed shaken with every wind of interpretation, and because Heretics would fly to the words, denying the sense, therefore hath the Church of God been constrained to use new words to distinguish them by.

Irenaeus doth well compare Heretics to the Beast Hyaena, that imitates the Shepherd’s voice, and so by that means seduceth the Sheep into destruction. Now this infallibility of the Word is so great that when some, as Saul and Uzzah, have gone against it, as if their special considerations might give them a protection, which were indeed fair and plausible, yet they were severely punished by God.</p></blockquote>

If you say, that the Apostle Peter speaks of some who did wrest the Scripture, and put it upon the wrack; This is to be granted concerning the words, not the sense, and matter of the Holy Ghost intended by those words: That is invariable and cannot be a Reed shaken with every wind of interpretation, and because Heretics would fly to the words, denying the sense, therefore hath the Church of God been constrained to use new words to distinguish them by.

<blockquote><p>There is but ONE GOD.

1. The light of nature affords no marks of a plurality of Gods.

2. The remarkable unity of design which appears in the works of creation and providence, manifest, that the Creator and manager of all things is but ONE.

3. As God necessarily possesseth infinite excellency, no independent excellency is left to any other.

4. One Being of infinite perfection being sufficient for the making and management of all things, – no necessary and self-existence, and so no godhead, is left for another.

5. God being unchangeable, he can have no rival or competitor of equal power or wisdom.</p></blockquote>

<blockquote><p>Q. What is the Word to be with reference unto us?

A. A Rule.

Q. Is any other Rule sufficient for our direction?

A. No, this is the only Rule.

Q. Can we receive sufficient directions from our own wisdom, or the light of nature, to come to glorify, and enjoy God?

A. No.

Q. Can we receive sufficient direction from God’s works of Creation, and Providence?

A. No.

Q. Is the Scripture a sufficient Guide?

A. Yes.

Q. In what do the Scriptures direct us?

A. How we may glorify God, and enjoy him for ever.

Q. Can we never learn then how to glorify God here, or to enjoy him hereafter, without the guidance, and directions of the Scriptures?

A. No.</p></blockquote>

<blockquote><p>Now, by this we set aside the error of some who say that corporeal punishments are illicit to use. These people adduce as a basis for their error the text of Exodus ( 20:13): “You shall not kill,” which is mentioned again in Matthew (5:21). They also bring up what is said in Matthew (13:30), that the Lord replied to the stewards who wanted to gather up the cockle from amidst the wheat: “Let both grow until the harvest.” By the cockle we understand the children of the wicked one, whereas by the harvest we understand the end of the world, as is explained in the same place (Mat. 13:38-40). So, the wicked are not to be removed from among the good by killing them.

They also allege that so long as a man is existing in this world he can be changed for the better. So, he should not be removed from the world by execution, but kept for punishment.

Now, these arguments are frivolous. Indeed, in the law which says “You shall not kill” there is the later statement: “You shall not allow wrongdoers to live” (Exod. 22: 18). From this we are given to understand that the unjust execution of men is prohibited. This is also apparent from the Lord’s words in Matthew 5. For, after He said: “You have heard that it was said to them of old: You shall not kill” (Mat. 5:21), He added: “But I say to you that whosoever is angry with his brother,” etc.

From this He makes us understand that the killing which results from anger is prohibited, but not that which stems from a zeal for justice. Moreover, how the Lord’s statement, “Let both grow until the harvest,” should be understood is apparent through what follows: “lest perhaps, gathering up the cockle, you root up the wheat also together with it” (Mat. 13: 29). So, the execution of the wicked is forbidden wherever cannot be done without danger to the good. Of course, this often happens when the wicked are not clearly distinguished from the good by their sins, or when the danger of the evil involving many good men in their ruin is feared.

Finally, the fact that the evil, as long as they live, can be corrected from their errors does not prohibit the fact that they may be justly executed, for the danger which threatens from their way of life is greater and more certain than the good which may be expected from their improvement. They also have at the critical point of death the opportunity to be converted to God through repentance. And if they are so stubborn that even at the point of death their heart does not draw back from evil, it is possible to make a highly probable judgment that they would never come away from evil to the right use of their powers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, trans. English Dominican Fathers (c. 1265; London, 1924), 3.146.</span></figcaption>

<blockquote><p>Abstract reasoning is in many cases eminently serviceable in showing the thorough consistency of theological truth with philosophy and science truly so called. And the wise defenders of the faith will be forward to show that there is no incongruity, and indeed no want of mutual support, between theology, the Queen of Sciences, and her many handmaids in every department of solid thought and legitimate investigation.

And when a great ultimate scriptural truth is set forth in its own magnificent proportions, and on its own appropriate evidence, it is one of the worthiest exercises of the human intellect to show that it conflicts with nothing that the intellect of man has discovered or trustworthily accepted. This is to assign to theology its own proper sphere, and to leave theology in its own unaided majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement: In its Relations to the Covenant, the Priesthood, the Intercession of our Lord</cite>, (London: James Nisbet &amp; Co., 1870), p. 3.</span></figcaption>

</figure><figure class="quote" id="q-e15c27b743" data-kw="">
<blockquote><p>Third, someone may ask whether natural theology is sufficient for salvation. There are those on one side who do not think it is useful at all. Thus Socinius, together with his followers, denies natural theology, and the Anabaptists are in basic agreement with him through their hatred of philosophy.

There are those on the other side who make so much of natural theology that it is seen as sufficient for salvation. In this group are the pagans, and formerly the Pelagians, since they taught that the patriarchs were saved by natural law alone, and Campanella, as well as the Libertines, who openly profess it.

The Reformed certainly acknowledge that natural theology is useful for refuting atheists, for demonstrating a deity, for some kind of worship (Rom. 1:19-20), and for rendering the pagans, including the philosophers, without excuse (Rom. 1:21-24, 32; Acts 17:24ff.; 1 Cor 11:13-14), but they consider it in no way sufficient for salvation. …

Nevertheless, the same Reformed do not deny that natural theology as it existed in the state of man as originally instituted, or in the state of integrity, was sufficient for the attainment of eternal life by the covenant of nature, because at that time human nature was still whole, owing to the wisdom of original righteousness. Nor also do they deny that while sin was absent, a mediator who is revealed by theology was not necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.XXIV, pp 83-84.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/natural-theology.html">Natural Theology</a></span></div>

p;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe15c27b743.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e15c27b743.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/25/pieter-van-mastricht-on-the-reformed-view-of-natural-theology/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-bf2c757075" data-kw="">
<blockquote><p>It is not at all to be doubted, but the end proposed by philosophy, was to renew and to reform mankind, and to reduce the course of their lives to a conformity with the precepts of wisdom and virtue. …

True religion, to be sure, has the same tendency: but it promotes its end with much greater force, and better success; because its principles are much more exalted, its precepts and instructions are of greater purity, and it is, besides, attended with a divine power, whereby it makes its way into the hearts of men, and purifies them with the greatest force and efficacy; and yet, at the same time, with the most wonderful pleasure and delight. And this is the regeneration of which we are speaking, and whereof we have already observed, that philosophy acknowledged it, even under the same name; but that it effected it, we absolutely deny. …

Philosophy, as we have already observed, perceiving that man was born to higher views than this world affords, attempted to raise him from his present dejection, secure his claim to heaven, and restore him to a conformity and likeness to God; but in vain. To redeem the sons of man, and restore them to what they had lost, it was necessary that the eternal Son of God should come down from heaven. Our fall was easily brought about, but our restauration was a work of the greatest difficulty, and only to be performed by the powerful hand of God; there are but few, whom the exalted Father of spirits has loved, and Christ has raised up to heaven.

He is the source whence the spirit of God flows down to us, he is the fountain of that new life and sanctified nature, by which we mount towards God, whereby we overcome the world, and, in consequence thereof, are admitted to heaven, And happy, to be sure, are those truly noble souls, whose fate it is to be thus born again, to be admitted into the choirs of the holy angels, and to be cloathed with those glorious robes that are whiter than snow: they will follow the lamb wherever he goes, and he will lead them to the crystal streams, and even to the fountain of life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts</cite>, (London: Plato’s Head, 1763), Lect. XVI, pp 178-79, 188-89.</span></figcaption>

</figure><figure class="quote" id="q-e496c4e922" data-kw="">
<blockquote><p>I call to witness theology, the queen and mistress of the other branches of learning, and it is almost our especial task to see that these are ready handmaids to it; not that confused theology drawn from the ditches of the scholastics, nor the theology that is merely common and teachable material handed down in a variety of manuals by scores of quite worthy and not inadequate men; but theology that is free, pure and undefiled drawn in from the fountain of fountains with the Holy Spirit and power of Almighty God aiding – and indeed completing – the whole task; theology that daily blossoms forth using all the supports of true philosophy and the other branches of knowledge which can serve to help or adorn it. We see the inmost shrines of truth unlocked and hidden meanings of the living page unearthed and set before us. ‘Hence the light and sacred draughts.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Oxford Orations</cite>, (1652-57), trans. John Glucker, ed. Peter Toon (1971), Second Oration, July 1654. Available from:</span></figcaption>

— Robert Watts, The Rule of Faith and the Doctrine of Inspiration, (London: Hodder and Stoughton, 1885), xii-xiii.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhile+accurate+acquaintance+with+the+original+tongues+in+which+the+Scriptures+were+at+first+written+is+a+most+important+aid+in+the+investigation%2C+it+is+nevertheless+true%2C+that+without+any+knowledge+whatever+of+the+originals%2C+a+believer%2C+with+the+English+Version+in+his+hand%2C+may+ascertain%2C+infallibly%2C+what+the+Scriptures+teach+on+this+subject.%E2%80%9D%0A%0A%E2%80%94+Robert+Watts%2C+The+Rule+of+Faith+and+the+Doctrine+of+Inspiration%2C+%28London%3A+Hodder+and+Stoughton%2C+1885%29%2C+xii-xiii.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44f1d53781.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44f1d53781.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/09/robert-watts-on-inspiration-and-the-english-bible/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-56eedd4017" data-kw="">
<blockquote><p>That is, Natural Theology is not repugnant to Revealed Theology in the Abstract, although Natural Theology is far less complete, and takes a position beneath Revealed Theology. Nevertheless, both are Lights, Natural Theology the lesser, Revealed Theology the greater, which have their origin from the same Father of lights. Neither is natural truth able to be inconsistent with revealed truth, since truth harmonizes with truth, or truth does not contradict truth, as it is in the Axiom; indeed, truth is opposed, not to truth, but to falsehood, although the same truth often becomes known from diverse starting points: thus, that God created the world, is evident by reason and by faith, in Philosophy from the light of nature, in Theology from the light of Scripture.

But Natural Theology nowhere exists in the abstract, as, on the other hand, Revealed Theology, pure and clear of all defects, is able to be read in the Sacred Scriptures. When, therefore, any dispute occurs between them, Natural Theology with all Philosophy ought to yield to Revealed Theology as more certain, seeing that human corruption easily mingles itself with Natural Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 21, p. 164.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56eedd4017.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/05/bernardinus-de-moor-on-the-harmony-between-natural-and-revealed-theology/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>92. Two difficulties arise here: the first concerns the statement that the God of glory was crucified. For Christ’s godhead, according to which Christ is called the Lord of glory, cannot suffer anything.

The answer is that Christ is one person subsisting in two natures, the human and the divine. Hence he can be described by names drawn from either nature; furthermore, no matter what the name by which he is designated, it can be predicated of him, because there is but one person underlying both natures. Consequently, we can say that the man created the stars and that the Lord of glory was crucified; however, it was not as man that he created the stars, but as God; nor was it as God that he was crucified, but as man.

Hence this phrase refutes Nestorius’ error asserting that there is one nature, composed of God and man, in Christ; because if Nestorius were correct, it would not be true to say that Lord of glory was crucified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super 1 ad Corinthios</cite>, C. 2, L. 2, 92.</span></figcaption>

<blockquote><p>To us, as in most things, so also in this, the middle way seems to be the safest; so that in examining the mysteries of faith, the aid of reason ought to be called in, yet not wholly and altogether relied upon: but to keep that just medium, this is a difficult and arduous work …

Those are called the mysteries of faith which no man was ever able to find out by his own reasoning powers, but are known by the revelation of God alone, and are opposed to that which may be known of God by the light of nature. Rom. i. 19. 1 Cor. ii. 7. Eph. iii. 3. …

That revelation is contained in the sacred books of the Old and New Testament, which evince their authenticity to the conscience of a serious enquirer, duly attending to the external and internal marks of their divinity; and, if any thing be there plainly taught, it is certainly a great crime to treat them with reproach, under any pretence whatever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on the Use and Abuse of Reason, in Matters of Religion</cite>, trans. John Carter (Norwich: Crouse, Stevenson and Matchett, 1795), pp 3, 5-6.</span></figcaption>

</figure><figure class="quote" id="q-586ae8f99a" data-kw="">
<blockquote><p>The natural religions embody only fragments of that general revelation which is the condition of all religion; Christianity alone is the product of that special work of God which we call special revelation. Were there no “general revelation” there would be no religion in the world of any kind; were there no “special revelation” there would be no Christianity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Revelation (1902) in Selected Shorter Writings of Benjamin B. Warfield</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/revealed-theology.html">Revealed Theology</a></span></div>

— Benjamin B. Warfield, Christianity and Revelation (1902) in Selected Shorter Writings of Benjamin B. Warfield">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+natural+religions+embody+only+fragments+of+that+general+revelation+which+is+the+condition+of+all+religion%3B+Christianity+alone+is+the+product+of+that+special+work+of+God+which+we+call+special+revelation.+Were+there+no+%E2%80%9Cgeneral+revelation%E2%80%9D+there+would+be+no+religion+in+the+world+of+any+kind%3B+were+there+no+%E2%80%9Cspecial+revelation%E2%80%9D+there+would+be+no+Christianity.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+Christianity+and+Revelation+%281902%29+in+Selected+Shorter+Writings+of+Benjamin+B.+Warfield&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F586ae8f99a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/586ae8f99a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/03/19/b-b-warfield-on-christianity-and-special-revelation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-9c90456cd6" data-kw="">
<blockquote><p>The fourth argument is derived, not only from the construction of the human body, admired by every one, though enough by no one, but also from our soul; for it is either eternal, or produced out of matter, or created by some other Being; no one will now say that it is eternal. To say that it is produced from matter is most absurd; for the effect is not more noble than its cause, and who can believe that out of matter, which is extended, gross, and inanimate, there could have been produced a spiritual and thinking essence, one of so excellent a nature, that it comprehends the whole universe in its thoughts, beholds the present, remembers the past, and looks forward to the future: — one, which invents and cultivates so many arts, performs so many wonderful things; which, not content with this world and sublunary objects, aspires to God and to eternity, and runs through heaven, and earth, and the seas, although lying concealed in a single corner of the world.

Such an essence then must have an author; but who it is, if it is not God, no one can point out. Add to this the wonderful union of the soul with the body, which union is so close and intimate, that certain motions take place in the body, in obedience to certain thoughts of the soul; and, on the contrary, some thoughts take place in the soul, in compliance with some motions of the body, although the soul is ignorant in what way the members are set in motion according to its will, and how it is that at the motion of these members various thoughts are raised within it.

The fifth argument is taken from the agreement of almost all nations, even the most barbarous, upon this subject. For how is it that men of almost every country in the earth, differing in education, customs, manners, and habits, believe in any thing as a God, rather than believe in no God? and that the proudest of mankind had rather bow down to wood and stone, than be without any deity at all? ‘What nation is there,’ says Cicero, ‘or what race of men, which has not, without any previous instruction, some idea of the gods? Now that in which all men agree must necessarily be true.’ ‘If you go through the earth,’ says Plutarch, ‘you will perhaps observe cities without walls, without letters, sunk in the greatest ignorance; but we shall see not one which does not worship the Deity. But even if, as some assert, there are some nations to be found, among whom no traces of religion are discovered, it ought not to seem strange that barbarians, who have in some measure thrown aside the human nature, and assumed a kind of brutal wildness, have lost that which is peculiar to man. Without understanding, there is no notion of a Deity, and no sense of religion, and therefore these cannot apply to the brutes, and consequently not to those who have almost degenerated into brutes.’

The last argument may be sought from the power of conscience, which is the inseparable attendant on crime that has been, or is about to be, committed, and the feeling of which cannot be blunted, nor its judgment be avoided, nor its accusation eluded, nor its testimony corrupted, nor its bail deserted , nothing being more tenacious than its grasp, nothing more bitter than its torment. Whence is it that conscience is stung when a crime is committed, even though no witnesses are present, and no danger threatens from others? Silence is it that the transgressor secretly trembles at his guilt, and is afraid even of the most trifling noise?

Nor is there any exception to this fact in the case of those who acknowledged no superior on earth, and to whom their subjects did not blush to offer incense as unto gods. Caligula, for example — who, although no one is said to have carried his contempt of Deity further than he did, yet trembled exceedingly when he heard the noise of thunder. Whence all this, I ask, but from the consciousness of there being some Judge, whom the offender, although he sees him not, yet every where dreads? We wave other arguments, which might be added: I shall only subjoin this remark, that, while the atheistical doctrine gives a license to every crime, the opposite doctrine influences men to the practice of every Christian and moral virtue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 1.1, pp 3-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology.html">Theology</a></span></div>

</figure><figure class="quote" id="q-3e849e2b34" data-kw="">
<blockquote><p>It is of the utmost importance, however, that we should not misconceive the relation between “general” and “special” revelation. This relation is not one of contrast and opposition, but rather one of supplement and completion. They do not stand as two systems, each complete in itself, over against one another; but together they form one organic whole. The purpose of special revelation is not to correct, much less to set aside general revelation. General revelation needs no correction – God has not revealed himself falsely or misleadingly in it. And it cannot be set aside, – what it reveals of God is eternal and necessary truth. It might even be fairly pronounced inexact to speak of the purpose of special revelation as to supplement and complete general revelation, if the matter be conceived too abstractly. In itself, general revelation is neither imperfect nor incomplete – God does all things well.

The occasion of special revelation is extraneous to the organism of revelation itself, and lies in the necessity of meeting altered circumstances. Sin had entered in; and, speaking after the manner of man, the new conditions induced by sin required a new method and a new content for revelation. The modes of revelation adapted to sinless man would not suffice to make sinful man know God; the substance of truth revealed to sinless man would not suffice for the needs of sinful man. That sinful man might know and that he might know what sinful man needs to know, therefore, what we call special revelation entered in, not to abrogate general revelation as no longer useful, but to adapt the great organic process of revelation to the changed conditions and thus to conduct it surely onward to its originally contemplated end.

It is not to meet any failure in general revelation that special revelation is introduced, but to meet failure in man to whom the revelation is addressed. It is not the power of nature that it seeks to break, but the power of sin: nature it is its end rather to restore and to fulfil. The great organism of revelation thus includes all that God has done, looking towards the communication of knowledge of himself: and this includes the totality of his operations, in nature and history and grace. That portion of this organic process which is included in “grace” we call special revelation, which, therefore, has the same occasion and the same end as the dispensation of grace itself, of which it is a constituent element, or rather a specific aspect.</p></blockquote>

</figure><figure class="quote" id="q-bc354afe19" data-kw="">
<blockquote><p>If one be a complete stranger to the Scholastics, he shall by no means be able to dispute with the Papists; nor with the Socinians, since these also draw their objections in great part from the Scholastics; and these would buy at great price, if from hatred of Scholastic Theology we all should determine to cast away the technical terms from Theology, a great number of which are actually owed to the Scholastics, and should bind the Theologian to make use only of terms found αὐτολεξεὶ, in express words, in Sacred Scripture. Therefore, thus the terms Trinity, Consubstantial, ὁμοουσίου/homoousios, Christ’s Satisfaction, etc., also should be banished.

But there are technical terms of this sort in Theology, just as there are numeric signs in Arithmetic, and individual letters in Algebra. No less absurdly would you require from a Theologian and Doctor in an Academy, that he send all Theological terms into eternal exile, than if you would require from a Preacher, that in the explanation of the sacred text he make use of no other word than what stands in the Sacred Books. Therefore, Scholastic Theology is to be called into use as far as it or its terms are able to be useful; but all abuse of it is to be avoided …</p></blockquote>

<blockquote><p>But if it is objected that even the law of Mohammed has been received by many, the answer is that the cases are not alike, because he subjugated them by oppressing them and by force of arms, but the apostles by dying brought others to the faith, and by working signs and prodigies. For he proposed things which pertain to pleasure and lasciviousness, but Christ and the apostles contempt for earthly things: when you received the word of God, which you heard from us, you received it . . . as the word of God (1 Thess 2:13).</p></blockquote>

<blockquote><p>XII. Moreover, (1) not only does the universal consensus of all nations (Rom. 2:15) declare that a certain theology is given, but (2) nature itself teaches that God exists and that he must be glorified (Ps. 19:1; Rom. 1:19-21), and that he in turn will be a rewarder of those who seek him (Heb. 11:6), the method of whose worship we proclaim in theology. (3) Nature teaches that the soul is immortal, burning to have its immortal desire for perpetual beatitude satisfied, and theology is believed to open the path to this satisfaction. (4) Nature also teaches that the rational creature, having been created by God strives toward God, so that he is satisfied in God alone, to whom theology leads.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.XII, p. 74.</span></figcaption>

</figure><figure class="quote" id="q-e29b05b142" data-kw="">
<blockquote><p>First then, Deists object, that the excellent light of reason, derived from God, common to all men and wrought into the inmost frame of their constitution, is quite sufficient for the purpose of instruction and of directing our practice, and consequently any new light, any new revelation, is unnecessary.

Answer. We acknowledge that reason is the gift of God and an excellent gift, nor are we of the number of those who depreciate and vilify it. But this we say, that mankind were inattentive to the light of nature, and that they miserably abused it, as plainly appears from the experience of heathen nations, ancient and modern. That the light of nature was exceedingly obscured by the mistakes and immoral practices of men, so as to be almost extinguished, was a matter well known to the heathens. …

But they say, may we not collect from reason the chief and most important truths of religion, viz. “The existence and perfections of God; the laws of justice, the laws of temperance, &amp;c. Finally, the rewards and punishments of a future state.”

Ans. First, reason may teach some, but not all these truths; revelation adds others very momentous, as we have already demonstrated. Secondly, our present enquiry is not concerning reason, considered in itself, but of reason, such as it was in men, destitute of the aids of revelation. The enquiry is not, what mankind might have known, had they made a proper use of reason, but, whether they had a clear perception of divine things, whether this perception was free from uncertainty, whether it was easily acquired, whether it was not corrupted by any mixture of error? Long experience has evidently evinced the truth of the contrary position.

With respect to us, who by the kindness of Deity, have been enlightened by revelation, the eyes of the whole understanding have been opened by the gospel, we easily deduce the knowledge of divine things from the light of reason. But were we still involved amidst heathenish darkness, Gracious God! How much more imperfectly, how much more indistinctly, entangled in how many errors and absurdities, would we philosophise, concerning all these points? We hence deduce, that the very advantages we receive from the exercise of reason are to be ascribed to the light of revelation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Revealed Religion</cite>, trans. William Crawford (1737; Belfast: James Magee, 1778), § 1, pp 35, 36-37.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology.html">Theology</a></span></div>

<blockquote><p>So then, brothers, stand firm and hold to the traditions that you were taught by us, either by our spoken word or by our letter (2 Thessalonians 2:15)

6. Though we blame this in papists, yet we reject not all traditions:—

[1.] Because scripture itself is a tradition, as we proved before, and is conveyed to us by the most credible means, which we have no reason to doubt of. The scriptures of the Old Testament were preserved by the Jews, ‘to whom were committed the oracles of God.’ Rom. iii. 2, Protestants received all the books which they admitted into their canon. And for the books of the New Testament, the Christian church hath received them as the writings of those whose names they bear. And by the constant universal tradition of the church they are transmitted to us; and we have no more reason to doubt of them than we do of statutes and laws made by kings and parliaments who lived long before we had a being.

Yea; we may be much more confident, as the matter is of greater weight and consequence, and these writings have the signature and stamp of God’s Spirit on them, and have been blessed by God to the converting and sanctifying of many souls; and have been delivered down to us by a succession of believers unto this very day. And by them Christianity hath been preserved in the world, notwithstanding the wickedness of it, and hath held up head against all the encounters of time. The persecutions of adverse powers have not suppressed it, nor the disputes of enemies silenced the profession of it; but still from age to age God’s truth is received and transmitted to posterity.

[2.] Because the truth of Christianity depending upon matter of fact, chiefly Christ’s rising from the dead, it can only be proved by a testimony which, in so extraordinary a case, must be made valuable, and authorised to the world by the miracles accompanying it. Now the notice of these things is brought to us by tradition, which, being unquestionable, giveth us as good ground of faith as it did to them that lived in the apostles’ time, and heard their doctrine and saw their miracles. God’s wonderful works were never intended for the benefit of that age only in which they were done, but for the benefit also of those that should hear of them by any credible means what soever, Ps. cxlv. 4; Joel i. 3; Ps. lxxviii. 3-7: these things were told them ‘that they might set their hope in God,’ &amp;c.

[3.] Because there are some doctrines drawn by just consequence from scripture, but are the more confirmed to us when they are backed with constant church usage and practice; as baptism of infants, Lord’s-day, singing of psalms in our public worship, &amp;c.

[4.] Because there are certain words which are not found in scripture indeed, yet agreeable thereto, and are very useful to discover the frauds of heretics; as Trinity, divine providence, consubstantial, procession of the Holy Ghost, satisfaction, &amp;c.

[5.] We reject not all church history, or the records of ancient writers concerning the providences of God in their days in owning the gospel, which make much for our instruction in manners, and help to encourage us to put our trust in God.

[6.] There are certain usages and innocent customs or circumstances, common to sacred and other actions, which we despise not, but acknowledge and receive as far as their own variable nature and condition requireth; not rejecting them, because anciently practised; nor regarding them, when the general law of edification requireth the omission of them.

But that which we detest is, that the traditions of men should be made equal in dignity and authority with the express revelation of God; yea, that manifest corruptions and usurpations,—as making Rome the mistress of other churches, and superinducing the Pope as the head of the universal visible church, and the vicar of Christ, without his leave and appointment, and such like other points, should be obtruded upon the world as apostolical traditions, and to be received with like religious reverence as we do articles of faith set down in scripture. This is that we cannot sufficiently abhor, as apparently false, and destructive to Christianity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The Complete Works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 133-35.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

— Thomas Manton, Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome, (1679) in The Complete Works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 133-35.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+then%2C+brothers%2C+stand+firm+and+hold+to+the+traditions+that+you+were+taught+by+us%2C+either+by+our+spoken+word+or+by+our+letter+%282+Thessalonians+2%3A15%29%0A%0A6.+Though+we+blame+this+in+papists%2C+yet+we+reject+not+all+traditions%3A%E2%80%94%0A%0A%5B1.%5D+Because+scripture+itself+is+a+tradition%2C+as+we+proved+before%2C+and+is+conveyed+to+us+by+the+most+credible+means%2C+which+we+have+no+reason+to+doubt+of.+The+scriptures+of+the+Old+Testament+were+preserved+by+the+Jews%2C+%E2%80%98to+whom+were+committed+the+oracles+of+God.%E2%80%99+Rom.+iii.+2%2C+Protestants+received+all+the+books+which+they+admitted+into+their+canon.+And+for+the+books+of+the+New+Testament%2C+the+Christian+church+hath+received+them+as+the+writings+of+those+whose+names+they+bear.+And+by+the+constant+universal+tradition+of+the+church+they+are+transmitted+to+us%3B+and+we+have+no+more+reason+to+doubt+of+them+than+we+do+of+statutes+and+laws+made+by+kings+and+parliaments+who+lived+long+before+we+had+a+being.%0A%0AYea%3B+we+may+be+much+more+confident%2C+as+the+matter+is+of+greater+weight+and+consequence%2C+and+these+writings+have+the+signature+and+stamp+of+God%E2%80%99s+Spirit+on+them%2C+and+have+been+blessed+by+God+to+the+converting+and+sanctifying+of+many+souls%3B+and+have+been+delivered+down+to+us+by+a+succession+of+believers+unto+this+very+day.+And+by+them+Christianity+hath+been+preserved+in+the+world%2C+notwithstanding+the+wickedness+of+it%2C+and+hath+held+up+head+against+all+the+encounters+of+time.+The+persecutions+of+adverse+powers+have+not+suppressed+it%2C+nor+the+disputes+of+enemies+silenced+the+profession+of+it%3B+but+still+from+age+to+age+God%E2%80%99s+truth+is+received+and+transmitted+to+posterity.%0A%0A%5B2.%5D+Because+the+truth+of+Christianity+depending+upon+matter+of+fact%2C+chiefly+Christ%E2%80%99s+rising+from+the+dead%2C+it+can+only+be+proved+by+a+testimony+which%2C+in+so+extraordinary+a+case%2C+must+be+made+valuable%2C+and+authorised+to+the+world+by+the+miracles+accompanying+it.+Now+the+notice+of+these+things+is+brought+to+us+by+tradition%2C+which%2C+being+unquestionable%2C+giveth+us+as+good+ground+of+faith+as+it+did+to+them+that+lived+in+the+apostles%E2%80%99+time%2C+and+heard+their+doctrine+and+saw+their+miracles.+God%E2%80%99s+wonderful+works+were+never+intended+for+the+benefit+of+that+age+only+in+which+they+were+done%2C+but+for+the+benefit+also+of+those+that+should+hear+of+them+by+any+credible+means+what+soever%2C+Ps.+cxlv.+4%3B+Joel+i.+3%3B+Ps.+lxxviii.+3-7%3A+these+things+were+told+them+%E2%80%98that+they+might+set+their+hope+in+God%2C%E2%80%99+%26c.%0A%0A%5B3.%5D+Because+there+are+some+doctrines+drawn+by+just+consequence+from+scripture%2C+but+are+the+more+confirmed+to+us+when+they+are+backed+with+constant+church+usage+and+practice%3B+as+baptism+of+infants%2C+Lord%E2%80%99s-day%2C+singing+of+psalms+in+our+public+worship%2C+%26c.%0A%0A%5B4.%5D+Because+there+are+certain+words+which+are+not+found+in+scripture+indeed%2C+yet+agreeable+thereto%2C+and+are+very+useful+to+discover+the+frauds+of+heretics%3B+as+Trinity%2C+divine+providence%2C+consubstantial%2C+procession+of+the+Holy+Ghost%2C+satisfaction%2C+%26c.%0A%0A%5B5.%5D+We+reject+not+all+church+history%2C+or+the+records+of+ancient+writers+concerning+the+providences+of+God+in+their+days+in+owning+the+gospel%2C+which+make+much+for+our+instruction+in+manners%2C+and+help+to+encourage+us+to+put+our+trust+in+God.%0A%0A%5B6.%5D+There+are+certain+usages+and+innocent+customs+or+circumstances%2C+common+to+sacred+and+other+actions%2C+which+we+despise+not%2C+but+acknowledge+and+receive+as+far+as+their+own+variable+nature+and+condition+requireth%3B+not+rejecting+them%2C+because+anciently+practised%3B+nor+regarding+them%2C+when+the+general+law+of+edification+requireth+the+omission+of+them.%0A%0ABut+that+which+we+detest+is%2C+that+the+traditions+of+men+should+be+made+equal+in+dignity+and+authority+with+the+express+revelation+of+God%3B+yea%2C+that+manifest+corruptions+and+usurpations%2C%E2%80%94as+making+Rome+the+mistress+of+other+churches%2C+and+superinducing+the+Pope+as+the+head+of+the+universal+visible+church%2C+and+the+vicar+of+Christ%2C+without+his+leave+and+appointment%2C+and+such+like+other+points%2C+should+be+obtruded+upon+the+world+as+apostolical+traditions%2C+and+to+be+received+with+like+religious+reverence+as+we+do+articles+of+faith+set+down+in+scripture.+This+is+that+we+cannot+sufficiently+abhor%2C+as+apparently+false%2C+and+destructive+to+Christianity.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+Eighteen+sermons+on+the+second+chapter+of+the+second+epistle+to+the+Thessalonians%2C+containing+the+description%2C+rise%2C+growth%2C+and+fall+of+antichrist%2C+with+divers+cautions+and+arguments+to+establish+Christians+against+the+apostasy+of+the+Church+of+Rome%2C+%281679%29+in+The+Complete+Works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%2C+1871%29%2C+iii%2C+133-35.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b07a6466c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2b07a6466c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/18/thomas-manton-on-the-reformed-view-of-tradition/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Now, it happens in certain things which are ordained towards an end that there is both a right and a wrong way to proceed: and for this reason, in the government of a multitude there is a distinction between right and wrong. A thing is rightly directed when it is led towards a fitting end; wrongly, when it is led towards an unfitting end. Now the end which befits a multitude of free men is different from that which befits a multitude of slaves, for the free man is one who exists for his own sake, while the slave, as such, exists for the sake of another.

If, therefore, a multitude of free men is ordered by the ruler towards the common good of the multitude, that rulership will be right and just, as is suitable to free men. If, on the other hand, a rulership aims not at the common good of the multitude, but at the private good of the ruler, it will be an unjust and perverted rulership. And hence the Lord threatens such rulers, saying by the mouth of Ezekiel: Woe to the shepherds that feed themselves, as seeking their own interest, should not the flocks be fed by the shepherd? (Ezek 34:2). Shepherds indeed should seek the good of their flocks, and every ruler the good of the multitude subject to him.</p></blockquote>

<blockquote><p>It is an indubitable truth that the light of nature gives considerable information, with respect to the knowledge of God and divine things. That there is a supreme Being on whom every other being in the universe is dependent; that he is eternal, infinite in wisdom, power, goodness and justice, in a word, possessed of absolute perfection; that by him all things were at first created and are continually governed; that the affairs of mankind are, in a particular manner, the object of his attention; that there are laws of nature by which we are enabled to distinguish the difference betwixt just and unjust; finally, that the souls of men are immortal, and that there is a future state of rewards and punishment, all these truths are pretty clearly discovered by the light of nature. The heathens were not strangers to them, who had no other guide, with respect to such matters, but the aids derived from unassisted reason.</p></blockquote>

<blockquote><p>It is true that charity is twisted into vice when a man has become too hostile to reason and has cast it from its throne under the pretext of religion. Indeed, many matters hotly disputed today in this cause of truth turn aside and degenerate into wranglings about phrases and terms. In recent years [Samuel] Werenfels, who adorns the academy of Basel, published the most beautiful little book on contests over words, to which if one would add all the ways people everywhere sin in this regard, into how vast a volume would it grow? If anyone finds fault with any use of human reason in theology, he must be banished from human society into the company of brute beasts. Indeed, the Sacred Letters were written for men, not beasts.

The Reformed Church from its earliest beginnings has thought differently, and by countless examples has shown how much she has accomplished with the assistance of a sober and modest philosophy. For this reason in all its schools it created philosophers as much as theologians, just as the wise mistress depends on the help of her handmaids.</p></blockquote>

</figure><figure class="quote" id="q-2d93779576" data-kw="">
<blockquote><p>Indeed no one can sufficiently deplore the lot of the Christian church in those ages, when such barbarous words were used for the explanation of Christian doctrines, and every thing was so wrapped up in obscure questions, that a period of nine years was not enough for the proper understanding of the single preface of Scotus to Lombard, and when the most futile and even impious questions were discussed, to the neglect of scripture.

This was the reason why the wisest Reformers of the church have entirely banished the Scholastic Theology from its territories; together with its curious, vain, and often impious questions, and devoted themselves entirely to the exposition of God’s word. Nevertheless, after the example of the schoolmen, or following rather the method of those who teach the arts and sciences, they were willing to reduce Theology to certain rules, and that with the greatest propriety; but then the divinity which they taught, was not derived from Aristotle and Plato, but from those purer sources – the sacred writings.</p></blockquote>

</figure><figure class="quote" id="q-47757e585a" data-kw="">
<blockquote><p>But it is now asked, What sort of Doctrine is Theology, Theoretical or Practical? … This question turned out to be of greater moment, because the Socinians and Remonstrants [Arminians] made the whole of Theology practical with a perverse intention, namely, so that they might separate the knowledge of mysteries, for example, the Trinity, the Incarnation, etc., from the fundamentals of Religion, and say that Religion is summed up in the obedience of precepts and the faith of promises.

Thus Episcopius, Institutionibus Theologicis, book I, chapter II, asserts that Theology is not a speculative science, but practical; neither is it partly speculative and partly practical; but a purely practical science. This the Remonstrants also argue in their Apologia pro Confessione, pages 17, 18, in which they at the same time falsely accuse us, as if our Theology were merely speculative. …

As so, if one or the other must be chosen here; it would be better to be said, yet with the error of the Socinians and Arminians put away, that Theology is a Practical Discipline, rather than a Theoretical Discipline; for, 1. all knowledge of Religion is to be drawn unto practice, John 13:17; 1 Timothy 1:5: 2. and the End, of the glorification of God and salvation of men, is Practical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 28, pp 191-92.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology.html">Theology</a></span></div>

</figure><figure class="quote" id="q-872872fa2e" data-kw="">
<blockquote><p>Furthermore, it seems that to proceed against the cruelty of tyrants is an action to be undertaken not through the private presumption of a few, but rather by public authority. If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power. It must not be thought that such a multitude is acting unfaithfully in deposing the tyrant, even though it had previously subjected itself to him in perpetuity, because he himself has deserved that the covenant with his subjects should not be kept, since, in ruling the multitude, he did not act faithfully as the office of a king demands.

Thus did the Romans, who had accepted Tarquin the Proud as their king, cast him out from the kingship on account of his tyranny and the tyranny of his sons; and they set up in their place a lesser power: namely, the consular power. Similarly Domitian, who had succeeded those most moderate emperors, Vespasian, his father, and Titus, his brother, was slain by the Roman senate when he exercised tyranny, and all his wicked deeds were justly, and profitably, declared null and void by a decree of the senate. Thus it came about that Blessed John the Evangelist, the beloved disciple of God, who had been exiled to the island of Patmos by that very Domitian, was sent back to Ephesus by a decree of the senate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 6.</span></figcaption>

<blockquote><p>I answer that there were in the law some precepts that were purely ceremonial, as circumcision, the immolation of the lamb, and so on. Such laws, since they were only figurative, it is no longer licit to observe, for they were a figure of something to come; hence, anyone who observes them now would be signifying that Christ is still to come. But others were purely moral, and these must be observed now. …

But others were partly ceremonial and partly moral, as the judicial precepts. These laws are no longer to be used in regard to what is ceremonial; but in regard to what is moral, they must be obeyed. Yet it is not necessary that they be observed in their proper form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Hebraeos lectura</cite>, (c. 1273), C. 7, L. 2, 339.</span></figcaption>

<blockquote><p>20. Then he shows the greatness of Christ’s power when he says, whom he has appointed heir of all things; for as it says: and if a son, an heir also through God (Gal 4:7).

But in Christ are two natures, namely, the divine and the human: insofar as he is the natural Son, he is not an appointed heir, but he is so naturally; but inasmuch as he is man, he has become the Son of God: concerning his Son who was made to him of the seed of David (Rom 1:3). Indeed, as a man, he has been appointed heir of all things, just as he has become a true son of the Father: all power is given to me in heaven and in earth (Matt 28:18), and it extends to every creature that he has taken under his rule. It extends, therefore, not only to one type of man, but to all, i.e., both Jews and gentiles: ask of me and I will give you the gentiles for your inheritance (Ps 2:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Hebraeos lectura</cite>, (c. 1273), C. 1, L. 1, 20.</span></figcaption>

</figure><figure class="quote" id="q-883ddbe677" data-kw="">
<blockquote><p>God is incomprehensible, because it is said in Jeremiah: if the heavens above can be measured, and the foundations of the earth below can be explored, then I will cast off all the descendants of Israel (Jer 31:37).

I answer that in one sense, to comprehend means to enclose, as a house comprehends us; in another sense, it means to attain and hold.

In the first sense he is incomprehensible, because he cannot be enclosed in a created intellect, since he is most simple and because you do not know or love him to the degree that he is knowable and loveable, as a person who does not know a truth by demonstration but by opinion does not know it as perfectly as it can be known. But God knows himself, as far as he is knowable. The reason for this is that a thing is known according to the mode of its own being and truth. God, however, is infinite light and truth, whereas our light is finite.</p></blockquote>

<blockquote><p>1041. But it should be noted that although he says that taxes are owed to rulers as a wage for their labours, rulers can sin in two ways by accepting taxes.

Second, if they violently take more than the law permits and more than the people can bear. Hence it says in Micah: hear, you heads of Jacob and rulers of the house of Israel! Is it not you who tear the skin from my people, and their flesh from their bones? (Mic 3:1).</p></blockquote>

<blockquote><p>1. A different rationale belongs to Theology and to the other disciplines which we have just mentioned: α. Theology, having God Himself as its object, in dignity far excels the remaining disciplines, and pertains to the Image of God primarily; the remaining disciplines only secondarily. β. God has not to such an extent delineated to us an express type of the other disciplines, as He has in the case of Theology, especially as it is revealed in His Word, unto which norm our Knowledge ought to be conformed.

2. Nevertheless, if anyone should wish to recognize a certain Archetypal Knowledge in God, and Ectypal in creatures, in the other arts and sciences also; it would be allowed by us, although in a less emphatic sense.</p></blockquote>

<blockquote><p>IV. But when God is set forth as the object of theology, he is not to be regarded simply as God in himself (for thus he is incomprehensible to us), but as revealed and as he has been pleased to manifest himself to us in his word, so that divine revelation is the formal relation which comes to be considered in this object.

Nor is he to be considered exclusively under the relation of deity (according to the opinion of Thomas Aquinas and many Scholastics after him, for in this manner the knowledge of him could not be saving but deadly to sinners), but as he is our God (i.e., covenanted in Christ as he has revealed himself to us in his word not only as the object of knowledge, but also of worship). True religion (which theology teaches) consists of these two things.</p></blockquote>

</figure><figure class="quote" id="q-e52cd4ef98" data-kw="">
<blockquote><p>Even though the natural knowledge of God is not salvific, it nevertheless serves a purpose and is useful for the following reasons:

(1) It teaches that God exists; that He is an invisible, spiritual Being; is infinite; is the first cause of all things; in His Being is infinitely exalted above all that exists; and is holy, omnipotent, good and just.

(2) It teaches that God is the cause of all things (also of him who meditates about God), and thus is sovereign Lord over all. It teaches that by His influence He upholds, governs, and directs all things according to His will, so that no one can stay His hand or say, “What doest Thou?”

(3) It teaches that every human being is obligated to Him with an irrevocable obligation to do His will as expressed in His law, which is revealed to him by virtue of the light of nature.

(4) By this man can view his sin and guilt against the background of God’s justice.

(5) It promotes the maintenance of human society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 16-17.</span></figcaption>

<blockquote><p>115. But man is capable of knowing God from such creatures in three ways, as Denis [Pseudo-Dionysius] says in The Divine Names.

He knows him, first of all, through causality. For since these creatures are subject to change and decay, it is necessary to trace them back to some unchangeable and unfailing principle. In this way, it can be known that God exists.

Second, he can be known by the way of excellence. For all things are not traced back to the first principle as to a proper and univocal cause, as when man produces man, but to a common and exceeding cause. From this it is known that God is above all things.

Third, he can be known by the way of negation. For if God is a cause exceeding his effects, nothing in creatures can belong to him, just as a heavenly body is not properly called heavy or light or hot or cold. And in this way, we say that God is unchangeable and infinite; and we use other negative expressions to describe him.</p></blockquote>

</figure><figure class="quote" id="q-d9e023300a" data-kw="">
<blockquote><p>Archetypal Theology is not simply to be described as God’s Knowledge concerning Himself; but, if we wish to consider the Infinite Theology of God as a τύπον/type and πρωτότυπον/prototypical exemplar, according to which our Theology ought to be formed, it is to be added, which He decreed to manifest to the creature. And thus the Theology of the Creatures shall be a true Ectype, or the Image of the Archetype expressed in Creatures. It does not appear that this distinction is controverted very much:

1. for it is evident that God knows Himself most completely, and so no one is a more perfect θεολόγον/theologian, Matthew 11:27, neither in this particular is the Holy Spirit inferior to the Father or the Son, 1 Corinthians 2:10, 11.

2. It is no less certain that God has decreed to communicate some knowledge of Himself with Creatures, 1 Corinthians 2:7.

3. Neither will any of our Theology be able to be described as true, which does not correspond to that Knowledge of God concerning Himself and divine things, which Knowledge He decreed to be manifested to us in one way or another.

4. If the Knowledge of God also has regard to the Image of God, should not that Knowledge be called Ectypal, of which that Knowledge of God in God shall be the archetypal exemplar? yes, indeed, Colossians 3:10, ἐνδυσάμενοι τὸν νέον (ἄνθρωπον), τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ᾽ εἰκόνα τοῦ κτίσαντος αὐτόν, having put on the new (man), which is renewed in knowledge after the image of Him that created him.

5. The Sacred Scripture is said to deliver to us τύπον διδαχῆς, the form/type of doctrine, Romans 6:17, ὑποτύπωσιν ὑγιαινόντων λόγων, the pattern/prototype of sound words, 2 Timothy 1:13; but this is that knowledge of divine things revealed to us by the decree of God, in accordance with which our subjective Theology ought to be formed: so that to this extent this division of Theology also agrees quite well with the expression of Scripture.

6. Finally, this distinction shall be useful for this, that a Theologian might piously learn how to engage in the meditation of divine things, and thus from God to have an understanding in those things which have regard unto God, so that in his knowledge of God he might not deviate from that which of God and by God has been revealed to the creature.</p></blockquote>

<blockquote><p>Hence, just as the most frequently used writings of the Old Testament in the Church are the Psalms of David, who obtained pardon after his sin, so the most frequently used writings of the New Testament are the epistles of Paul, who obtained mercy, so that by these examples sinners might be aroused to hope; although another reason for this custom could be that in each of these writings is contained almost the whole teaching of theology.</p></blockquote>

<blockquote><p>After a lapse of the dark ages, during which all active speculation slumbered, the great Thomas Aquinas, an Italian by birth, A.D. 1224, and a monk of the order of St. Dominic, Doctor Angelicus, advocated with consummate ability the Augustinian system of theology in that cumbrous and artificial manner which characterized the Schoolmen.</p></blockquote>

</figure><figure class="quote" id="q-e2b713f798" data-kw="">
<blockquote><p>If Paul recognizes the right of private judgment, even in reference to the preaching of an apostle, or of an angel from heaven, surely it will not be denied with regard to the acts of any body of fallible and sinful men. The standard of judgment is of course the holy Scriptures. Our Confession tells us the decrees and determinations of councils are to be received only when “consonant to the word of God.” …

The censure, therefore, which has been heaped upon this Review for the expression of its dissent from certain acts of the Assembly, as an act of presumption unbecoming in the members and servants of the church, are, to say the least, undeserved. Those censures, however, are not to be understood as the denial of the right to dissent, or of the right to discuss the correctness of the acts in question. Such denial would be simply absurd. Those censures are merely the expressions of feeling. Those who utter them claim and exercise the right of approving or disapproving all the deliverances of church-courts. … This is a matter too plain to need remark.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Princeton Review on the State of the Country and the Church in Biblical Repertory and Princeton Review</cite></span></figcaption>

</figure><figure class="quote" id="q-ffaf375a4b" data-kw="">
<blockquote><p>The Most Illustrious COCCEIUS, in ad ultimum Mosis, § 74, says these words, “It comes here to be wondered at, even a new pestilence sprouting at this time, of those that induce the soul to doubt, whether they themselves be, see, hear, etc. Wretched mortals, who reason against their own sense, doubting themselves to be, and daring to profess themselves to be infidels and ἀθέους/atheists, at least while they are willing to doubt; thereon they are going to apply themselves to this, that they might question all things, with respect to which they are able to delay their confidence (which the Scripture calls reasonings and murmurings), and remove from themselves the knowledge of God and His ways.” Add what things are found in his Summa Theologiæ, chapter VIII, § 25, opera, tome 7, page 160.</p></blockquote>

</figure><figure class="quote" id="q-f791fe3c1c" data-kw="">
<blockquote><p>Indeed there is what is called natural religion. There are many truths concerning God, and our duty to him, which are evident by the light of nature. But christian divinity, properly so called, is not evident by the light of nature; it depends on revelation. Such are our circumstances now in our fallen state, that nothing which it is needful for us to know concerning God, is manifest by the light of nature, in the manner in which it is necessary for us to know.

For the knowledge of no truth in divinity is of significance to us, any otherwise than as it some way or other belongs to the gospel-scheme, or as it relates to a Mediator. But the light of nature teaches us no truth in this matter. Therefore it cannot be said, that we come to the knowledge of any part of christian truth by the light of nature. It is only the word of God, contained in the Old and New Testament, which teaches us christian divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Knowledge in Jonathan Edwards on Knowing Christ</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<figure class="quote" id="q-d2478435c2" data-kw="">
<blockquote><p>Of course, without special personal divine interposition there is a considerable amount of revelation of God’s being and perfections afforded by nature, — by the works of God’s hand, the constitution that He has given to man, and the providence and government which He constantly and silently exercises over him. God could not create such a world as this, and put and keep in it an intelligent being like man, without inlaying into the workmanship of His hands, and into His providence over it, incontestible evidence of His own existence, and considerable proofs, because traces of His wisdom, power, and goodness.

No one doubts, and our [Westminster] Confession in its very first clause admits, that in this there is a source of knowledge of God, or if you will, of revelation, thoroughly valuable and important; while science, glorious science, is continually reading it off to us more and more fully, some of her unwitting sons labouring in the service as the hardest driven Gibeonites we have ever chanced to come across sweating in their toil. Long and successfully may they toil, and much may they bring to light in proof of God’s necessary existence and God’s necessary perfections!</p></blockquote>

</figure><figure class="quote" id="q-b298d6ffdd" data-kw="">
<blockquote><p>XXV. This proposition that God can deceive if he will (although he neither will nor can will it), by whatever interpretation softened, is deservedly rejected as crude and dangerous. Yea it is openly repugnant also to the truth delivered in Scripture concerning God. For if God can deceive, he can also lie and sin if he so willed (which is opposed to his most perfect truth and holiness). For a long time, this concept was condemned therefore as blasphemous among the Scholastics.

To deceive another by words, what else is it than to lie or to speak falsely? Therefore if God can deceive by words, he can also lie (which is expressly repugnant to Scripture [Tit. 1:2; Heb. 6:18] and to the nature of God, in which there can be neither ignorance nor error of judgment nor malice nor any such thing from which a lie could take its origin). Yea, if we could say this, I shudder to relate, we could also say that God could be made not God; if God can deceive, he can sin; if he can sin, he can become not God because he who sins (or can sin) is not God. …

Now no one but an atheist will deny that God cannot will to deceive. … If he can deceive, our faith in the Scriptures would always be wavering. If the Scriptures were given by a God who can deceive, how could we persuade an atheist that he had not deceived? To no purpose would you say that he did not will to deceive, for how could he be assured of this?

Not from Scripture (which expressly says this) because he could immediately reply, this was said by that God who can deceive, and how do we know that he has not here given the effect which he is said to be able to give? Not from the nature of God because it is not repugnant to God’s nature to give that effect which he has the power to give. In vain also would you say that it is repugnant to his nature to will to effect it because if it is not repugnant to his nature to be able to perform it, neither will it be repugnant to his nature to be able to will to perform it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 3.21.25.</span></figcaption>

</figure><figure class="quote" id="q-0e091021c7" data-kw="">
<blockquote><p>First problem: Are Reformed theologians concerned over practical theology, and do they discuss it, or is their theology purely speculative?

Our reply: Affirmative to the first, and negative to the second, against the calumnies of the Remonstrants and the papists. The Remonstrants in their Apologia brand our theology as pure speculation. …

The very light of the facts is enough to destroy this calumny, since the sermons of the more distinguished of our preachers and an almost infinite number of writings of the Reformers (some of which we have described in our Bibliotheca Theologica) breathe pure practice, so that our theologians, like Socrates, may be said to have brought theology from heaven down to earth, or, better to have raised it to heaven from the earth and scholastic dust. On this point the English writers … [such as William] Perkins (from whom, “as from a perennial spring,” etc.) are conspicuous. …

Where, among all the books with which the Remonstrants have flooded Holland, do any practical writings appear? any moral theology? any exposition of cases of conscience? any worthwhile commentaries on the decalogue? any exercises for piety, even in shadow or name? any aids to the spiritual life?</p></blockquote>

</figure><figure class="quote" id="q-e551968cc0" data-kw="">
<blockquote><p>That true Religion is solely founded on special Revelation, as an altogether infallible Principium, alone and final, Psalm 119:105; Isaiah 8:20; Luke 16:29; Romans 10:17; Ephesians 2:20; 2 Timothy 3:15; 2 Peter 1:19, 20, without which Faith would not be divine, but only a human persuasion, Hebrews 11:1; Romans 4:20, 21.

Indeed, if the contrary opinion stand, Faith is completely converted into philosophical Knowledge: no longer will divine Revelation, unless in this name it be pleasing to trifle, be the true, sole, and ultimate foundation or Principium of our Religion; but that Reason itself, from which Revelation receives all true Authority and Meaning; as a similar analysis of the Papistical Faith in the Church is deservedly made by us, upon the Testimony and Interpretation of which these cause the Scripture altogether to depend; and of the Enthusiastical Faith in their own private Inspirations, unto which these likewise are wont to recur in all things, with continual twisting of the most manifest Scriptures.</p></blockquote>

</figure><figure class="quote" id="q-93620a8346" data-kw="">
<blockquote><p>Vers. 7. But we speak the wisdom of God in a mystery, even the hidden wisdom which God ordained, before the world, unto our glory.

The other part of the Comparison; The Wisdom of the Gospel, is the wisdom of the Living and Eternal God, because it was wisely contrived of God, and because in it the wonderful Wisdom of God is revealed, touching the Salvation and Redemption of men.

In a mystery] Comparison 4. Human Philosophy is common and obvious to every one that is indued with the gifts of Nature; but the Wisdom of the Gospel is a Mystery, or hidden wisdom, because it is not understood by natural reason, as Human Philosophy, but by Supernatural Revelation.

Before the world] Comparison 5. In the antiquity of it, the Wisdom of the Gospel is not of yesterday, but ordained of God before the world: But Human Philosophy is an invention lately found out, and not yet perfected or finished.

Glory] Comparison 6. The Wisdom of the Gospel appertains to Glory and Salvation, especially of us who live under grace: But Human Wisdom, compared with this, appertains not to salvation, but vain speculation.

Vers. 8. Which none of the Princes of this world knew: for had they known it, they would not have crucified the Lord of Glory.

Comparison 7. Human Wisdom may consist with the not knowing of Christ, but Divine Wisdom cannot. This comparison is confirmed by experience, because the chief heads of the Jews, and the Rulers of the Gentiles, (who in respect to their wisdom, seemed to get a name in the world) understood nothing of the Wisdom of the Gospel, which he proves by this instance, because had they known any thing of the Gospel, they had either out of reverence to the Divine Power, or out of fear been wary of Crucifying the Lord of Glory so ignominiously.

Vers. 9. But as it is written, Eye hath not seen, nor ear heard, neither hath entered into the heart of man, the things which God hath prepared for them that love him.

<blockquote><p>The foundations of modern infidelity may be said to have been laid by [Thomas] Hobbes and [Baruch] Spinoza, both of whom manifested an equally hostile spirit against natural as against revealed religion; and the latter of whom, who has written much more fully and formally against the truth of revelation than Hobbes, and who has always exerted, and continues to the present day to exert, a much greater influence upon the views of infidel writers, is supposed by Professor Dugald Stewart to have “very decidedly indicated a tendency to insanity, a supposition, he adds, by no means incompatible (as will be readily admitted by all who have paid any attention to the phenomena of madness) with that logical acumen which is conspicuous in some of his writings.”

Hobbes’s Leviathan was published in 1651, and Spinoza’s Tractatus Theologico-Politicus in 1670, and to these works the defenders of Christianity generally had reference in dealing with the objections of opponents until the rise of the great band of English deists in the concluding part of the 17th and in the early part of last century. The first English writer of eminence who has written fully and at length in defence of the truth of Christianity, and in opposition to the objections of infidels, is Richard Baxter, so well known and so deservedly esteemed for his numerous and multifarious writings, controversial and practical, and for the extraordinary services, which he has been honoured to render to the cause of religion and piety.

He enters somewhat upon this subject in the second part of his Saints’ Rest, and prosecutes it more fully, first in his Unreasonableness of Infidelity, published in 1655, and afterwards in his Reasons of the Christian Religion, published in 1666, and in an appendix to the latter work entitled More Reasons for the Christian Religion, and no Reason against it, published in 1671. These books of Baxter upon the evidences have not been so much read, and are not so well known, as some of his other works, but they are possessed of great value. It is but lately that I have been led to read them, but I have formed a very high opinion of their value, and I am inclined to think that subsequent writers upon the evidences have been more indebted to them than is generally supposed.

Like most of Baxter’s other works, they were written far too hastily and hurriedly to be well digested or compacted; they present a good many digressions, and much irrelevant matter, by which the continuity of the argument is sometimes broken or hidden; but they contain a great deal of important and valuable discussion which, notwithstanding all that has since been written upon the subject, after the grounds and reasons of infidelity were more fully opened up, and notwithstanding the improvements to which fuller discussions with infidels have led as to the way and manner in which the proofs of the truth of Christianity ought to be expounded, unfolded, and arranged, is still well deserving of perusal and study.

Baxter, though not by any means to be compared, in point of sound-mindedness and judiciousness, with his great cotemporary Dr [John] Owen, and though not nearly so safe a guide in doctrinal matters, was a man of perhaps still greater subtlety and reach of thought, and therefore when he kept the right track, and was not perverted, as was sometimes the case, by his subtlety, he rose more above the ordinary current views of his age than Owen or any of his other great cotemporaries; and has in this, as well as in other ways, sometimes rendered valuable service to truth, and exerted an important influence upon the opinions of men.

We have an illustration of this in his books upon the evidences, where, amid many indications of the fervency of his piety, of his deep sense of spiritual and divine things, and his earnest longing for the salvation of men’s souls, we meet with some argumentative expositions of the rational evidences for the truth of Christianity, as they are sometimes called, which would do no discredit to Dr Samuel Clarke, or to any of the most eminent men of the school of cold rational mere argumentators, who arose in the next generation.

The tendency at that time among Baxter’s friends, in opposition to the other extreme which prevailed among the clergy of the Establishment, was to disregard or despise the rational or external evidences for the truth of Christianity, which are fitted in right reason to convince infidels, and to dwell only on these more spiritual views of the effects of divine truth itself in connection with the work of the Spirit, whereby believers are built up in their most holy faith; and this tendency even Dr Owen has exhibited to an erroneous extent in his Self-evidencing Power of the Bible, and in his Reason of Faith.

Baxter, it may be believed, was not insensible to the more spiritual views of this matter, was not disposed to overlook the agency of the Holy Spirit in the production of faith, or to undervalue the witness of the Spirit; and he has given far more prominence in the works above referred to these important topics than the generality of writers upon the evidences; but he at the same time strenuously vindicated for the rational or external evidence its true place and its rightful authority with reference to its appropriate objects, and he objected to some of the notions that were then current about the witness of the Spirit. This exposed him to some odium, but it was easier to raise a prejudice against him as ascribing too much to human reason, than to answer the arguments by which he defended his views.</p></blockquote>

s+well+as+in+other+ways%2C+sometimes+rendered+valuable+service+to+truth%2C+and+exerted+an+important+influence+upon+the+opinions+of+men.%0A%0AWe+have+an+illustration+of+this+in+his+books+upon+the+evidences%2C+where%2C+amid+many+indications+of+the+fervency+of+his+piety%2C+of+his+deep+sense+of+spiritual+and+divine+things%2C+and+his+earnest+longing+for+the+salvation+of+men%E2%80%99s+souls%2C+we+meet+with+some+argumentative+expositions+of+the+rational+evidences+for+the+truth+of+Christianity%2C+as+they+are+sometimes+called%2C+which+would+do+no+discredit+to+Dr+Samuel+Clarke%2C+or+to+any+of+the+most+eminent+men+of+the+school+of+cold+rational+mere+argumentators%2C+who+arose+in+the+next+generation.%0A%0AThe+tendency+at+that+time+among+Baxter%E2%80%99s+friends%2C+in+opposition+to+the+other+extreme+which+prevailed+among+the+clergy+of+the+Establishment%2C+was+to+disregard+or+despise+the+rational+or+external+evidences+for+the+truth+of+Christianity%2C+which+are+fitted+in+right+reason+to+convince+infidels%2C+and+to+dwell+only+on+these+more+spiritual+views+of+the+effects+of+divine+truth+itself+in+connection+with+the+work+of+the+Spirit%2C+whereby+believers+are+built+up+in+their+most+holy+faith%3B+and+this+tendency+even+Dr+Owen+has+exhibited+to+an+erroneous+extent+in+his+Self-evidencing+Power+of+the+Bible%2C+and+in+his+Reason+of+Faith.%0A%0ABaxter%2C+it+may+be+believed%2C+was+not+insensible+to+the+more+spiritual+views+of+this+matter%2C+was+not+disposed+to+overlook+the+agency+of+the+Holy+Spirit+in+the+production+of+faith%2C+or+to+undervalue+the+witness+of+the+Spirit%3B+and+he+has+given+far+more+prominence+in+the+works+above+referred+to+these+important+topics+than+the+generality+of+writers+upon+the+evidences%3B+but+he+at+the+same+time+strenuously+vindicated+for+the+rational+or+external+evidence+its+true+place+and+its+rightful+authority+with+reference+to+its+appropriate+objects%2C+and+he+objected+to+some+of+the+notions+that+were+then+current+about+the+witness+of+the+Spirit.+This+exposed+him+to+some+odium%2C+but+it+was+easier+to+raise+a+prejudice+against+him+as+ascribing+too+much+to+human+reason%2C+than+to+answer+the+arguments+by+which+he+defended+his+views.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Theological+Lectures+on+Subjects+Connected+with+Natural+Theology%2C+Evidences+of+Christianity%2C+the+Canon+and+Inspiration+of+Scripture%2C+%28New+York%3A+Robert+Carter+and+Brothers%2C+1878%29%2C+Lecture+XVII%2C+pp+224-27.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9fd33bf461.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9fd33bf461.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/24/william-cunningham-on-the-value-of-richard-baxter-as-an-apologist/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>When he [Karl Marx] fled to Brussels he joined a communistic society of German working men which had fostered conspiracy, but had now become educational and propagandist. It had been renamed the League of the Communists. For this League he wrote in 1848, along with Engels, the Communist Manifesto. Not until 1867 was there published in Hamburg the first volume of his great work — Capital.

This was an economic exposition supported by a labyrinth of statistics chiefly drawn from English sources. His design was to publish four volumes, but he died in 1886 leaving behind him a large number of manuscripts. Selections from these, edited by Engels, were published in a second, and then in a third volume at a date so late as 1895.

Marx’s Capital has been called the Bible of Socialism. It ought rather to be called the Talmud, for it is as difficult to read and often as tedious and contradictory as that famous Hebrew comment and exposition of the Old Testament literature. The real scripture of Marxian Socialism is the Communist Manifesto. It is the New Testament, or at least the Sermon on the Mount, of this great apostle. To read it along with the vehement pages which close the first volume of Capital is to find both the aims and the methods of Marxian Socialism set in clear light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-macallum-clow.html">William Macallum Clow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Marxian Socialism in Princeton Theological Review</cite></span></figcaption>

<blockquote><p>Let any thing but the written word of God take place in matters of faith, and who seeth not that the very main sea of heresies must needs break in upon the Church of Christ? These are, as we suppose, causes just &amp; allowable and sufficient in the indifferent judgement of reasonable men, why we should deliver you no doctrine concerning faith &amp; religion, but only that which is in Scripture; why we should admonish you to beware of bread soured with pharisaical leaven, and to feed upon that which ye know came down from heaven, to shun broken cisterns, &amp; to come to the well of living waters, as here ye are exhorted by the Prophet.</p></blockquote>

</figure><figure class="quote" id="q-72034cf9b3" data-kw="">
<blockquote><p>The papists insist upon an implicit faith in the teaching of an infallible church, and deny to men the right of private judgment. Their implicit faith means a faith exercised without evidence or reason, that is to say, an unreasonable faith. The right of private judgment is the right of an individual personal investigation of evidence, the only process by which it is possible to reach a rational conclusion.

So, also, with the revelations of Oxford, and the teachings of Dr. Pusey and the new maniacs generally. They hold that the doctrines of religion are too sacred to be reasoned about until they have been received by faith; that we are to “maintain before we have proved”; that “we must believe in order to judge”; that “this seeming paradox is the secret of happiness.” (Tracts for the Times, No. 85, No. 63, pp. 39, 83; see Edinburgh Review, April, 1843.)

It is not strange that Rome and Oxford should proclaim this open war upon reason, for reason is at open war with them. Holding and teaching doctrines which no man can ever receive until he is prepared to trample upon every source and principle of evidence, until he is actually involved in the curse of idiocy or madness, it is natural for them to slander the image of the Father of lights in the intellectual constitution of man.

The dogmas of transubstantiation and the apostolical succession, when they stand before the bar of reason, or even that humble form of it called common sense, may well tremble in prospect of the verdict, which will be sure to pronounce them guilty of the most stupendous absurdity and consign them to the contempt and infamy they deserve.

The defenders of these dogmas stand really upon the platform of [David] Hume, and are in conspiracy with him to drive all thinking men into the fathomless abyss of universal skepticism. Upon their principles, sense, consciousness, the fundamental laws of human belief, all the witnesses which God has given us of the system to which we belong contradict one another; a vigorous cross-examination has never failed to reveal their want of veracity, and, therefore, their testimony cannot be relied on, and, therefore (for to this tremendous conclusion we come at last), the author of our constitution has so framed it that it must deceive us</p></blockquote>

<blockquote><p>The infinite God cannot be fully known by any of His creatures, but that there is a knowledge of Him within the reach of His creatures of mankind, is apparent from the very constitution of their nature, as well as from the relation in which they stand to Him.

That knowledge reveals to them His spirituality and His glory, as well as His providential care, that “they may seek Him, if haply they may feel after Him and find Him, though He is not far from every one of us.”

This view of the divine nature is furnished by observation of the works of God, and is also the dictate of our own consciousness, which tells us that we are not self-made and selfsustained, but that we are the children of a divine Father and the subjects of His supreme rule.

The Atheist denies the truth that there is a God; and the Pantheist affirms that there is nothing else but God. Both of these errors are renounced by enlightened reason. It refuses to be blind to the great fact of the divine existence. It also rejects the notion that this God is merely an infinite substance — a vague immensity. There is one living and true God, but in Him all being is not absorbed. He is in all; but everything is not God.</p></blockquote>

</figure><figure class="quote" id="q-5e69ccbd26" data-kw="">
<blockquote><p>The present critics of the new apologetic have no quarrel with its Christian theistic position, nor do they question the legitimacy of the attempt to demonstrate the reasonableness of the Christian faith by borrowing from secular philosophers. They seriously question, however, the adequacy and, in fact, the technical correctness with which the new apologetic has done its job.

Specifically, they complain (1) that its theory of knowledge, borrowed from the idealist school, logically leads to a species of pantheism, not to theism; (2) that it frequently confuses an argument by presupposition with a rational demonstration; (3) that it sometimes grossly misrepresents the position of secular and Catholic thinkers (It is one thing to reject Aristotle; it is quite another to play up the superiority of the Christian position by contrasting it with a distortion of Aristotle); (4) that it ignores and also confuses recognized meanings of the words “truth” and “knowledge”; (5) that it arbitrarily assigns new and unheard of meanings to certain technical terms in philosophy, thereby confusing issues, raising pseudo-problems, and presenting pseudo-demonstrations of foregone conclusions; and (6) that it tends to put into the idea of the antithesis a content which can only lead to exaggerated, improbable, and even absurd results.

Again, none of the present writers suspects the proponents of the new apologetic of making anything like a subtle attempt to undermine Christian doctrine. But when theories and presuppositions which can lead only to pantheism are uncritically taken over in order to arrive at theism, the resulting discourse easily reduces to the cabalistic. And, after all, a bad argument for the truth frequently does more damage than a good argument against it. …

In asserting that the givens with which we must begin are not facts but “God-interpreted facts,” the new apologetic seems to have taken over uncritically the idealist theory of knowledge and truth, a theory leading logically to a kind of pantheism. For the assertion appears to mean that “to be” is identical with “to be interpreted by God.” In other words, God’s interpretative action enters into the being of a fact (say, a tree, a bar of iron, or a human thought) in such a way as to make its existence identical with God’s knowledge. Now if God’s knowledge constitutes the facts, the facts must constitute God’s knowledge. How, then, can we distinguish God’s knowledge from God’s creatures?

This is the question of the relation between truth and reality, a question which the idealist handles somewhat as follows. Truth and reality, so he argues, must have a fundamental identity, since if truth is not identical with reality there must be something in reality which is not a content of truth and which, therefore, cannot be a possible object of thought – any thought. But if truth is to be truth, it must contain all of reality in ideal form. Yet that is demonstrably impossible since truth can never, for example, include whatever we feel at the moment, nor can it include the sensible past and the sensible future.

Truth and reality, therefore, do not seem to be identical after all. Nevertheless, if in knowledge we must begin with “facts pre-interpreted,” they must be identical. Now there is but one way out of this dilemma and that is to regard truth as an aspect of reality. Accordingly, reality must be conceived as an all-comprehending Absolute, something behind and beyond the distinction of subject and object, i.e., the knower and the thing known.

Now if, on the one hand, we identify this Absolute with God, we arrive at a full-blown pantheism – God is the one Reality comprehending all other realities which, in turn, are so many parts or aspects of God. In fact, we could say that God is the one Reality comprehending all illusions, since whatever is not itself the Absolute is not ultimately real. And, on the other hand, if we do not identify God with the Absolute, God must be regarded as something less than the Absolute, i.e., a part or aspect of the Absolute and having, therefore, no final reality in Himself. Well, any theory of knowledge the logic of which pushes one into something like that can hardly be considered a happy choice if one wishes to make a case for Christian theism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cecil-de-boer.html">Cecil De Boer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The New Apologetic in The Calvin Forum</cite></span></figcaption>

n.%0A%0ANow+if%2C+on+the+one+hand%2C+we+identify+this+Absolute+with+God%2C+we+arrive+at+a+full-blown+pantheism+%E2%80%93+God+is+the+one+Reality+comprehending+all+other+realities+which%2C+in+turn%2C+are+so+many+parts+or+aspects+of+God.+In+fact%2C+we+could+say+that+God+is+the+one+Reality+comprehending+all+illusions%2C+since+whatever+is+not+itself+the+Absolute+is+not+ultimately+real.+And%2C+on+the+other+hand%2C+if+we+do+not+identify+God+with+the+Absolute%2C+God+must+be+regarded+as+something+less+than+the+Absolute%2C+i.e.%2C+a+part+or+aspect+of+the+Absolute+and+having%2C+therefore%2C+no+final+reality+in+Himself.+Well%2C+any+theory+of+knowledge+the+logic+of+which+pushes+one+into+something+like+that+can+hardly+be+considered+a+happy+choice+if+one+wishes+to+make+a+case+for+Christian+theism.%E2%80%9D%0A%0A%E2%80%94+Cecil+De+Boer%2C+The+New+Apologetic+in+The+Calvin+Forum&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5e69ccbd26.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5e69ccbd26.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/12/cecil-de-boer-on-van-tillianism-and-idealist-pantheism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Objection #3: “Beware lest any man spoil you through philosophy and vain deceit; lest any man should beguile you with enticing words” (Colossians 2:8, 4). To engage in deductive reasoning is the practice of philosophy; we must refrain from making deductions which generate conclusions without substance.

Answer: The apostle warned against the abuse, not the lawful use of all things. Philosophy is the art of reasoning. It is innate in man to acquire knowledge about a certain issue by virtue of the process of reasoning, an ability which he utilizes in all his mental and verbal activities. The ability to reason improves by way of exercise.

The desire to acquire wisdom by way of reasoning is denominated as philosophy, which in itself should not be labelled as vain deceit. Paul does not label philosophy as vain deceit but indicates that deceptive individuals by the use of reason can formulate that which has a semblance of being reasonable, which, however, very easily could beguile, deceive, and mislead the simple.

One should be on guard for such people and their activity, and listen to Scripture rather than reason. All this, however, has nothing in common with the proper use of reason in attempting to understand Scripture — to use it as a means to extract what is concealed in every text, which is but drawing conclusions on the basis of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 48.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Yet, although tyrants desire this very benefit of friendship, they cannot obtain it, for when they seek their own good instead of the common good there is little or no communion between them and their subjects. Now, all friendship is based upon something common among those who are to be friends, for we see that those are united in friendship who have in common either their natural origin, or some similarity in habits of life, or any kind of social interests.

Consequently, there can be little or no friendship between tyrants and their subjects. When the latter are oppressed by tyrannical injustice and feel they are not loved but despised, they certainly do not conceive any love, for it is too great a virtue for the common man to love his enemies and to do good to his persecutors (cf. Matt 5:44). Nor have tyrants any reason to complain of their subjects if they are not loved by them, since they do not act towards them in such a way that they ought to be loved by them.

Good kings, on the contrary, are loved by many when they show that they love their subjects and are studiously intent on the common welfare, and when their subjects can see that they derive many benefits from this zealous care. For to hate their friends and return evil for good to their benefactors—this, surely, would be too great a malice to ascribe fittingly to the generality of men. The consequence of this love is that the government of good kings is stable, because their subjects do not refuse to expose themselves to any danger whatsoever on behalf of such kings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 10.</span></figcaption>

<blockquote><p>O! but there are some Princes in the world that pass others in wisdom: there are wise &amp; high spirited men that will put order to others, and with their wit will compass Heaven and earth, that will search out the deepness of nature, and be occupied in high things: it may be that these men have found out this wisdom. The Apostle meeteth this: No, saith he, none of the princes of this world, whether Jews or Gentiles, found out this wisdom.

All the great Monarchs, all the Philosophers, with their wisdom, and philosophy, never thought once on such a thing: it is true indeed, there is some in this world that have ever been occupied in high things above the reach of the common sort of people, sitting on high places, searching into the deepness of nature: but among all their occupations, high conceits and devises, there was never so much as a thought or suspicion or a dream of that only remedy against sin and death, of that only way and means of salvation, and delivery of a lost sinner.

A wonderful thing! condemned men sitting in such occupations, without any thought of their damnation. Emperors condemned men! and yet never such a thing as a thought how they should be relieved of their condemnation! It is true, the Philosophers among the nations aspired to a wisdom and knowledge of God to know Him, and some of them laboured to set down a science of Him.

Plato travailed much on this purpose, and therefore he was called Divine: but all their knowledge was of GOD the Creator, as He created this world, and by His providence governeth it. But will ye speak of GOD the Redeemer in His Son Jesus Christ, they had never such a thing as a thought of Him: and yet for all the business that they had about the Creation; and GOD the Creator, what were they? fools, and evanished in their own cogitations, &amp; as ye may read, Rom. 1. 22. 23. in stead of the true God they set up an idol to be worshipped.

Then seeing they found it not out, and seeing it is so necessary for all men, even for Princes (for they shall never see life except they get a part of this wisdom) they are bound to keep that wisdom, in sincerity, and not to prejudge her liberty one whit: but to maintain her and keep her from all her enemies, that would pervert her. Thou foundest her not out, keep her therefore in her liberty. The Lord grant that men may be occupied this way in their counsels, not in impairing, but in preserving the liberty of this wisdom, that only must save them: Thy kingdom, thy life, thine honour and all these earthly riches will away, only this wisdom will abide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain sermons, upon several texts of Scripture</cite>, eds Henry Charteris and William Arthur (Edinburgh: Andro Hart, 1616), pp 102-04.</span></figcaption>

usiness+that+they+had+about+the+Creation%3B+and+GOD+the+Creator%2C+what+were+they%3F+fools%2C+and+evanished+in+their+own+cogitations%2C+%26+as+ye+may+read%2C+Rom.+1.+22.+23.+in+stead+of+the+true+God+they+set+up+an+idol+to+be+worshipped.%0A%0AThen+seeing+they+found+it+not+out%2C+and+seeing+it+is+so+necessary+for+all+men%2C+even+for+Princes+%28for+they+shall+never+see+life+except+they+get+a+part+of+this+wisdom%29+they+are+bound+to+keep+that+wisdom%2C+in+sincerity%2C+and+not+to+prejudge+her+liberty+one+whit%3A+but+to+maintain+her+and+keep+her+from+all+her+enemies%2C+that+would+pervert+her.+Thou+foundest+her+not+out%2C+keep+her+therefore+in+her+liberty.+The+Lord+grant+that+men+may+be+occupied+this+way+in+their+counsels%2C+not+in+impairing%2C+but+in+preserving+the+liberty+of+this+wisdom%2C+that+only+must+save+them%3A+Thy+kingdom%2C+thy+life%2C+thine+honour+and+all+these+earthly+riches+will+away%2C+only+this+wisdom+will+abide.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+Certain+sermons%2C+upon+several+texts+of+Scripture%2C+eds+Henry+Charteris+and+William+Arthur+%28Edinburgh%3A+Andro+Hart%2C+1616%29%2C+pp+102-04.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffbf68ec730.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fbf68ec730.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/27/robert-rollock-the-world-by-wisdom-knew-not-god-in-christ-the-redeemer/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-78ce2ff482" data-kw="">
<blockquote><p>It is also plain that the inspiration of Scripture extends to every part of it. Even its historic records must be treated in the same way as its doctrinal statements. In fact, we can draw no line of separation between the two here, for some of the most important views of divine truth which the Bible contains, are embodied in the incidents which it narrates.

If we may not, then, speak of inspired facts, it is nevertheless evident that divine wisdom was needed by those who record these facts, lest they should be so stated as to intercept or obscure the light of divine truth which was let in upon the world in this way.

Nor can it be denied that divine wisdom was also needed for the selection of the facts which were to be recorded. In one word, we must recognise, from the first page of Scripture to the last, the presence of the Spirit of God, not destroying the individuality of the writers, but superintending its actings, prompting the communications which it was needful to make, restraining them from those which would have marred the design of their revelations, letting mind meet mind in the sacred page, and yet so pervading every portion with heavenly wisdom and divine grace, as to make the Bible, from Genesis to Revelation, a volume which is all given by inspiration of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-macewan.html">Alexander MacEwan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation Embodied in Scripture Supernatural, as Contradistinguished from the Productions of merely Human Thought and Genius in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-08b86ee7f5" data-kw="">
<blockquote><p>CARLYLE. I am no worshipper of Force. I see nothing to admire in mere power, i.e. in its quantity apart from its quality. Carlyle’s earnestness is very touching and noble; but it seems to me that, according to his teaching, if you could conceive an omnipotent devil, you ought to worship him as much as Israel’s Jehovah. [So that he is in one sense a modem Manichee?] I suspect so. And an omnipotent militia of darkness would be the very horror of horrors. . .

The connection between Carlylism and despotism I see, but the link is nowhere explicitly avowed. Carlyle is sometimes difficult to understand, and very difficult to judge. Why did he call Chalmers the last of the Christians? I suppose he forgets what he has written elsewhere. Hero-worship! ah well, he and I have to meet a strange hero yet … the greatest that I know of next to Him who overcame him. Carlyle has great faith in the devil, but I suspect he always appreciates quantity of being and of power more than quality. Have you observed how Christianity takes up the fragmentary truth that lies in the demonological and the spirit-inhabited? We Christians have lost nothing that could be retained in the old mythologies. And perhaps these beliefs in spiritual presences in nature are but the lingering mist of patriarchal tradition concerning the spirit-world. …

Carlyle, too, when he keeps to genuine English, when his historical narrative (as in some parts of his “French Revolution “) is vigorously sustained, has done a great deal to display the capabilities of English prose. But he often writes sheer gibberish, according to the classical tests. And whenever a man becomes cloudy in his words, be sure that his thought has grown shadowy too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-duncan.html">John Duncan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Colloquia Peripatetica</cite>, ed. William Knight (Edinburgh: Edmonston &amp; Douglas, 1870), pp 49, 53.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Yes, you say, but many of the fathers were saved and even became teachers without the languages. That is true. But how do you account for the fact that they so often erred in the Scriptures? How often does not St Augustine err in the Psalms and in his other expositions, and Hilary too – in fact, all those who have undertaken to expound Scripture without knowledge of the languages? Even though what they said about a subject at times was perfectly true, they were never quite sure whether it really was present there in the passage where by their interpretation they thought to find it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Councilmen of all cities in Germany that they Establish and Maintain Christian Schools</cite>, (1524), trans. A. T. W. Steinhaeuser, rev. W. I. Brandt in Luther’s Works: The Christian in Society II, ed. W. I. Brandt (55 vols, Philadelphia: Fortress Press, 1962), 45: 361.</span></figcaption>

</figure><figure class="quote" id="q-02ad03b8f9" data-kw="">
<blockquote><p>In more modern systems of theology published on the continent, and especially in Germany, it is common, in order to exhibit a rigidly and minutely accurate method, and to follow out fully the idea that a system of Christian theology is just a systematic exposition of the information actually contained in or deducible from the Bible itself, to introduce a summary of the evidences of Christianity, and of the divine authority of the sacred Scriptures, under the designation of prolegomena, or præcognita, or præcognoscenda; while with that strong tendency to divide and subdivide by which the Germans especially are distinguished, they have given to this subject, viewed by itself and apart from its relation to systematic divinity, the special designation of apologetic theology, to indicate that it comprehends everything connected with the defence of the claims which Christianity and the Bible put forth to be received as coming from God.

This naturally occupies the first place in a course of theological study, both because the question, whether God has given a direct and supernatural revelation of himself to men, obviously occurs whenever men’s thoughts are directed to the contemplation of God, and because it is only a conviction of the divine origin of Christianity and the Bible that will lead men to examine the Scriptures in a right spirit, and with right objects, and to make a right use of the information which they contain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture II, pp 25-26.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“In more modern systems of theology published on the continent, and especially in Germany, it is common, in order to exhibit a rigidly and minutely accurate method, and to follow out fully the idea that a system of Christian theology is just a systematic exposition of the information actually contained in or deducible from the Bible itself, to introduce a summary of the evidences of Christianity, and of the divine authority of the sacred Scriptures, under the designation of prolegomena, or præcognita, or præcognoscenda; while with that strong tendency to divide and subdivide by which the Germans especially are distinguished, they have given to this subject, viewed by itself and apart from its relation to systematic divinity, the special designation of apologetic theology, to indicate that it comprehends everything connected with the defence of the claims which Christianity and the Bible put forth to be received as coming from God.

<blockquote><p>From the sixteenth century until the beginning of the twentieth, no Reformed theologian I know of denied the validity of natural theology derived from natural revelation. The strong antipathy in our day to theology based on unaided human speculation has brought in its wake a widespread and wholesale rejection of all natural theology.

This departure, in part a reaction against Enlightenment rationalism, is a departure from historic Reformed theology and from biblical theology. Both Roman Catholicism and historic Reformed theology embraced natural theology gleaned from natural revelation. The reason for this substantial agreement is because the Bible, which both sides regarded as a special revelation, clearly teaches that, in addition to God’s revelation of himself in Scripture, there is also the sphere of divine revelation found in nature.

Classical theology made an acute distinction between special revelation and general revelation. The two kinds of revelation are distinguished by the terms special and general because of the difference in content-scope and in the audience of each. Special revelation is special because it provides specific information about God that cannot be found in nature. Nature does not teach us God’s plan for salvation; Scripture does. We learn many more specifics about the character and activity of God from Scripture than we can ever glean from creation.

The Bible is also called special revelation because the information contained in it is unknown by people who have never read the Bible or had it proclaimed to them. General revelation is general because it reveals general truths about God and because its audience is universal. Every person is exposed to some degree to God’s revelation in creation.</p></blockquote>

<blockquote><p>The end for which the Scriptures are given, is, to be a rule to direct us how we may glorify God, and come to the enjoyment of him as our God. And they are the only rule to direct us in these matters. Withall they are a certain and infallible rule; and that because they are the word of God. It appears, that they are the word of God, by the holiness efficacy of their doctrine, and the miracles wrought to confirm it. And this, although for the most part they were written by men because all Scripture is given by inspiration of God, 2 Tim. iii. 16.

The word Scriptures signifies writings: but the church had not always the written word, till about Moses’ time. Howbeit, they were supplied, while they wanted it, by extraordinary revelations: and it is the same doctrine that was then so revealed, which we have now in the Scripture. Nevertheless, the Scripture is altogether necessary for the church now; and that because extraordinary revelation of doctrine is ceased, and God hath bound us to the Scripture as the test or touchstone of doctrine: Isa. viii. 20. “To the law and to the testimony: if they speak not according to this word, it is because there is no light in them.”

Neither will God ever give us another rule: for the Scripture is a testamentary word of God. Now, a testament is the last will of a dying person. So the Scripture is Christ’s testament, confirmed by his death; and as a testament, it declares the last will of God concerning man’s salvation and duty. Christ’s testament is twofold: namely, the Old Testament, and the New Testament.

The books beginning with Genesis, and ending with Malachi, are Christ’s Old Testament: those beginning with Matthew, and ending with the Revelation, are Christ’s New Testament. These two testaments are one and the same for substance: for in both, Jesus Christ is the testator; eternal life is the legacy ; sinners of mankind are the legatees; and faith in Jesus Christ is the way of claiming and obtaining the legacy: 1 John v. 11, 12, “And this is the record, that God hath given to us eternal life: and this life is in his Son. He that hath the Son hath life; and he that hath not the Son of God, hath not life.” Prov. viii. 4, “Unto you, men, I call, and my voice is to the sons of man.” But they differ in circumstances; the new being more clear and full than the old one. Howbeit, neither the one nor the other can be savingly understood, without an inward illumination of the mind by the Spirit of Christ: 1 Cor. ii. 14, “But God hath revealed them unto us by his Spirit: for the Spirit searcheth all things, yea, the deep things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the First Part of the Assembly’s Shorter Catechism</cite>, (1727) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), 7: 10-11.</span></figcaption>

<blockquote><p>With what God doth inwardly teach you, by that common light which shines in every man’s own bosom, that with a sincere mind, attends to it, and which is too little attended to. There are Truths too commonly held in unrighteousness, seated generally in the Minds and Consciences of men; by which, tho’ they have not another Law, they are a Law to themselves; and for the stifling and resisting whereof, the wrath of God is revealed from Heaven against them.

And from such Truths they might infer others, and where God affords external helps, come to discern a sure ground whereupon to understand that what is contained besides in the frame of Christian Doctrine is true; being enabled to judge of the evidences that prove the whole Revelation thereof to be from God; and nothing being in it self more evident than that what he hath revealed is true.

And withal God is graciously pleased to shine into Minds that with upright aims set themselves to enquire out and understand his Mind; and so farther light comes to be superadded to that which is common. Now take heed how you neglect what a man teaches you, agreeably to that inward light which is already (one way or other) in your own Minds and Consciences.</p></blockquote>

<blockquote><p>St. Paul never called Philosophical truths vain, for so he should condemn divinity, to which Philosophy is subservient: besides, truth cannot be repugnant to truth; and Philosophy is one of God’s special gifts, by which even the Gentiles were brought to the knowledge of God, and made inexcusable; there are vain opinions among some professors of Philosophy, as there are among some Divines: must therefore Philosophy or Divinity be condemned as vain: he that speaks against Philosophy doeth both bewray his ignorance and malice; in disparaging men for making use of those arms which God hath given us to fight withal against the enemies of truth; and to destroy the field of good corn, because the envious man hath sown some tears among them. To speak against Philosophy, is to speak against the light of reason, which God hath kindled in our minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), p. 85.</span></figcaption>

</figure><figure class="quote" id="q-4a95bcc9e0" data-kw="">
<blockquote><p>A religious man, therefore, is practically just a true Christian, one who has acquired so much knowledge of God and of the way of salvation, and of the path of duty, from the Christian revelation, and who is so using and applying this knowledge, as that there is good ground to believe that he is advancing in the way that leadeth to glory, honour, and immortality, and that he will ultimately secure eternal life.

Theology, used subjectively, as descriptive of that in a man which entitles him to be called a theologian, means a full and comprehensive and well-digested knowledge of God, and of everything needful to be known, in order to worshipping and serving him aright, such as may not only avail for the regulation of his own conduct, and the securing of his own personal happiness, but may qualify him for becoming a teacher or instructor of others.

And in accordance with this view of its meaning, it is well known that when we apply the term theologian to one who is not in the office of the ministry, not using it merely as a common designation of a particular profession, we intend to convey the idea that he is possessed of a much fuller and more thorough acquaintance with religious subjects than is usually exhibited by those who have not studied religion professionally; such an acquaintance with these subjects as that he would be fairly entitled to speak or write about them for the instruction or information of others. Theology then used subjectively, and distinguished from religion, is descriptive of a full, comprehensive, well-digested knowledge of God and of divine things, such as may qualify for the instruction of our fellowmen.</p></blockquote>

<blockquote><p>Peter Lombard has some interesting things to say about Cornelius in Acts 10 (when discussing Augustine’s comments on the same subject): “Note carefully how he says that there cannot be salvation without faith in Christ, and yet Cornelius’ prayers were heard before he believed in Christ. This may be understood in this sense: namely, before he knew that Christ, in whom he believed under a mystery, had become incarnate.” [1] In other words, Cornelius was not an unbeliever but one trusting in the coming Messiah. Before coming into contact with the apostle Peter, however, he was one that had not yet realised that Jesus of Nazareth was the incarnate Christ owing to a lack of information.</p></blockquote>

<blockquote><p>To God indeed the grand object of knowledge, the great source of obligation, the bestower of all happiness, the author of every good and perfect gift, your attention already has been or should have been directed in the study of his works, and especially in the study of man, the noblest of his works. God’s works should be all studied with a reference to him who created and sustains them.

The things that are made should be ever contemplated as having been made and regulated for the purpose of making known the invisible things of God, even his eternal power and Godhead; and moral philosophy, when taught as it should be, unfolds all that can be known of God, and of man’s relation to him, from the light of nature and the works of creation and providence, and especially from man’s mental constitution, in order to settle aright the nature, ground, and requirements of duty, in so far as these can be known and ascertained without an immediate and supernatural revelation.</p></blockquote>

<blockquote><p>S. IS there any profit in Natural Philosophy?

M. Yea, manifold. But that I may not run over them all, for they are almost infinite I will allege five only. The first is, that thereby we know God, not only to be the Creator of all things, but also to bee everlasting, omnipotent, and merciful, &amp;c. The second, that by it wee learned the things that are created, with their operations and natures. The third, for that therein we see ourselves and perceive what we are, of what things and parts we consist, and each part of ours, that is to say, what manner of thing our Soul is, and what likewise is the state and condition of our body: which all men do confess to be the best, profitableness, &amp; most excellent knowledge of all other.

The [fourth] that wondering at in our minds, and beholding with our eyes these works of God, so great, so many, so wonderful, being thereunto holpen by none other means than by this Art, we are with great zeal and affection stirred up to set forth the wonderful praises of God and to give him thanks. Which thing happened also unto Galene, yea, although he were a prophane Philosopher, that after he had described the Nature of one of God’s works, that is to say, of Man, and the parts of his body, he was enforced, yea, almost against his will, to sing an Hymn to God. Here hence it cometh that such multitude of hymns, so many Epodes and songs of praise, so many Psalms are written and celebrated.

The [fifth] that wee understanding these things, may easily and plainly expound, and freely enter into many places of holy Scripture, which unto such as be ignorant of these matters, are not only obscure, but also cannot possibly be attained unto, or by any means understood. Wherefore S. Augustine writeth, that Natural Philosophy is very profitable and necessary for a Christian divine. What shall I speak of the singular pleasure which this knowledge bringeth unto the mind, &amp; of the great commodities which it ministreth unto the life of man?

S. How do you prove these things to be true?

M. Specially out of these places of holy scripture. The whole 104 Psalm. The 136. and 145. Psalm, &amp; 10. verse. The 147. and 148. Psalms. Job the 12. chapter and verse 8. 9. 10. and the 36. Chapter, and 24. 25. 26. verses. The 14. Chapter of the Acts, and 17. verse. The first Chapter to the Romans, and 20. verse. Unto these moreover may be added the 7. Chapter of the book of Wisdom, and 9. verse, with the next following: and likewise the 13. Chapter and 1. verse, and the next following. Likewise the holy Fathers S. Basil, S. Chrysostom, &amp; S. Ambrose in their Exameron, or work of six days do teach the same thing: And moreover the holy and absolutely learned father S. Augustine in his book of Christian doctrine, and in the viii. book of Gene. upon the letter, the viii. chapter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wonderful workmanship of the world wherein is contained an excellent discourse of Christian natural philosophy, concerning the form, knowledge, and use of all things created: specially gathered out of the fountains of holy Scripture</cite>, trans. Thomas Twyne (London: Andrew Maunsell, 1578), unpaginated.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“S. IS there any profit in Natural Philosophy?

M. Yea, manifold. But that I may not run over them all, for they are almost infinite I will allege five only. The first is, that thereby we know God, not only to be the Creator of all things, but also to bee everlasting, omnipotent, and merciful, &amp;c. The second, that by it wee learned the things that are created, with their operations and natures. The third, for that therein we see ourselves and perceive what we are, of what things and parts we consist, and each part of ours, that is to say, what manner of thing our Soul is, and what likewise is the state and condition of our body: which all men do confess to be the best, profitableness, &amp; most excellent knowledge of all other.

The [fourth] that wondering at in our minds, and beholding with our eyes these works of God, so great, so many, so wonderful, being thereunto holpen by none other means than by this Art, we are with great zeal and affection stirred up to set forth the wonderful praises of God and to give him thanks. Which thing happened also unto Galene, yea, although he were a prophane Philosopher, that after he had described the Nature of one of God’s works, that is to say, of Man, and the parts of his body, he was enforced, yea, almost against his will, to sing an Hymn to God. Here hence it cometh that such multitude of hymns, so many Epodes and songs of praise, so many Psalms are written and celebrated.

The [fifth] that wee understanding these things, may easily and plainly expound, and freely enter into many places of holy Scripture, which unto such as be ignorant of these matters, are not only obscure, but also cannot possibly be attained unto, or by any means understood. Wherefore S. Augustine writeth, that Natural Philosophy is very profitable and necessary for a Christian divine. What shall I speak of the singular pleasure which this knowledge bringeth unto the mind, &amp; of the great commodities which it ministreth unto the life of man?

S. How do you prove these things to be true?

M. Specially out of these places of holy scripture. The whole 104 Psalm. The 136. and 145. Psalm, &amp; 10. verse. The 147. and 148. Psalms. Job the 12. chapter and verse 8. 9. 10. and the 36. Chapter, and 24. 25. 26. verses. The 14. Chapter of the Acts, and 17. verse. The first Chapter to the Romans, and 20. verse. Unto these moreover may be added the 7. Chapter of the book of Wisdom, and 9. verse, with the next following: and likewise the 13. Chapter and 1. verse, and the next following. Likewise the holy Fathers S. Basil, S. Chrysostom, &amp; S. Ambrose in their Exameron, or work of six days do teach the same thing: And moreover the holy and absolutely learned father S. Augustine in his book of Christian doctrine, and in the viii. book of Gene. upon the letter, the viii. chapter.”

<blockquote><p>It lies in the very nature of a naturalistic system that it should lay all its stress on the activities of the Christian life. There is nothing else on which it could lay its stress. What man himself does, the influences by which he is brought to do it, and the issue of his activities — this is the circle of topics in which what, by a strange transmutation of meaning, is still called Theology, moves.</p></blockquote>

<blockquote><p>Obs. II. God hath filled the Scripture with truth. Whence one said well, “Adoro plenitudinem Scripturarum,” — “I reverence the fullness of the Scriptures.” Ps. cxxxviii. 2, “He hath magnified his word above all his name;” or made it more instructive than any other way or means whereby he hath revealed himself.

For not only doth the whole Scripture contain the whole counsel of God, concerning his own glory and worship, our faith, obedience, and salvation, but also every parcel of it hath in it such a depth of truth as cannot by us be perfectly searched into. Ps. cxix. 18, “Open thou mine eyes,” saith the psalmist, “that I may behold wondrous things out of thy law.”

There are wonderful things in the word, if God be pleased to give us light to see it. It is like a cabinet of jewels, that when you pull out one box or drawer and search into it, you find it full; pull out another, it is full; and when you think you have pulled out all, yet still there are some secret recesses in the cabinet, so that if you search further you will find more. Our apostle seems to have drawn out all the boxes of this cabinet, but making a second search into the words, he finds all these things treasured up, which he had not before intimated nor touched upon. It was said by some of old, that the “Scripture hath fords where a lamb may wade, and depths where an elephant may swim.” And it is true in respect of the perspicuity of some places, and the difficulty of others.

But the truth is also, that God hath in his grace and wisdom so ordered its concernments, that, — 1. What from the nature of the things themselves, which are suited unto the various states, conditions, and apprehensions of the minds of men; 2. What from the manner of their expression, on which a character of divine wisdom is impressed; 3. What from the authority of God putting itself forth in the whole and every particular; 4. What from its being not only “propositio veritatis,” but “vehiculum gratiae;” many, most, yea, all the particular places of it and passages in it, are such as through which a lamb may wade safely, and an elephant swim without danger of striking against the bottom.

Let any lamb of Christ come, in that order, with that reverence unto the reading or hearing the word of God (the Scripture itself I mean) which is required, and he will find no place so dark or difficult but that it will yield him that refreshment which is suited unto him and safe for him, and something of God he will obtain; for either he will find his graces excited, or his mind enlightened, or his conscience peculiarly brought into a reverence of God.

And let the wisest, the most learned and experienced person, that seems like an elephant in spiritual skill and strength amongst the flock, come to the plainest place, to search out the mind and will of God in it, if he be humble as well as learned, — which if he be not he is not wise, — he will scarce boast that he hath been at the bottom of it, and hath perfectly comprehended all that is in it, seeing whatever we know, “we know but in part.” And they may all of them, elephants and lambs, meet at the same passages of this river that makes glad the city of God, these waters of rest and quietness, Ps. xxiii. 2, where the lambs may wade safely, and the elephants swim together.

The poorest of the flock, in the right use of means, may take enough for themselves, even suitable direction and refreshment, from those very places of Scripture whose depths the learnedest guides of the church are not able to sound or fathom. Not only in several places, but in the same place, text, or testimony of Scripture, there is food meet for the several ages of Christians, whether babes and children or strong men; with light and direction for all sorts of believers, according to the degrees of their own inward light and grace. It is like manna, which, though men gathered variously according to their strength and appetite, yet every one had that proportion which suited his own eating.

When a learned man, and one mighty in the Scriptures, undertakes the consideration of a place of Scripture, and finds, it may be, in the issue, that with all his skill and industry, with all his helps and advantages, though attended in the use of them with fervent prayer and holy meditation, he is not able to search it out unto perfection, let him not suppose that such a place will be of no advantage unto them who are not sharers in his advantages, but rather are mean and unlearned; for they may obtain a useful portion for themselves where he cannot take down all.

If any one look on this river of God like behemoth on Jordan, “trusting that he can draw it up into his mouth,” or take up the whole sense of God in it, he of all others seems to know nothing of its worth and excellency. And this ariseth, as was observed, principally from the things themselves treated of in the Scripture. For, divine and spiritual truths having God not only as their immediate fountain and spring, but also as their proper and adequate object, there is still somewhat in them that cannot be searched out unto perfection.

As he said, “Canst thou by searching find out God? canst thou find out the Almighty unto perfection?” Job xi. 7, עַד־תַּכְלִ֖ית שַׁדַּ֣י תִּמְצָֽא, — “find him out to a perfect comprehension,” or “to a consummation of knowledge,” that it should be perfect. This neither the nature of God nor our condition will admit of. We do at best but “follow after,” that we may in our measure “apprehend that for which we also are apprehended of Christ Jesus,” Phil. iii. 12.

And these things are so tempered by divine wisdom unto the faith and light of believers, and therein unto the uses of their consolation and obedience, that something hereof is plainly exhibited to every spiritual eye: always provided that their search and inquiry be regulated according to the will of God, in a due use of the means; for to this purpose not only the private endeavours of men are required, but the use also of the public ministry, which is ordained of God to lead men gradually into continual further acquaintance with the will of God in the Scripture.</p></blockquote>

What+from+the+nature+of+the+things+themselves%2C+which+are+suited+unto+the+various+states%2C+conditions%2C+and+apprehensions+of+the+minds+of+men%3B+2.+What+from+the+manner+of+their+expression%2C+on+which+a+character+of+divine+wisdom+is+impressed%3B+3.+What+from+the+authority+of+God+putting+itself+forth+in+the+whole+and+every+particular%3B+4.+What+from+its+being+not+only+%E2%80%9Cpropositio+veritatis%2C%E2%80%9D+but+%E2%80%9Cvehiculum+gratiae%3B%E2%80%9D+many%2C+most%2C+yea%2C+all+the+particular+places+of+it+and+passages+in+it%2C+are+such+as+through+which+a+lamb+may+wade+safely%2C+and+an+elephant+swim+without+danger+of+striking+against+the+bottom.%0A%0ALet+any+lamb+of+Christ+come%2C+in+that+order%2C+with+that+reverence+unto+the+reading+or+hearing+the+word+of+God+%28the+Scripture+itself+I+mean%29+which+is+required%2C+and+he+will+find+no+place+so+dark+or+difficult+but+that+it+will+yield+him+that+refreshment+which+is+suited+unto+him+and+safe+for+him%2C+and+something+of+God+he+will+obtain%3B+for+either+he+will+find+his+graces+excited%2C+or+his+mind+enlightened%2C+or+his+conscience+peculiarly+brought+into+a+reverence+of+God.%0A%0AAnd+let+the+wisest%2C+the+most+learned+and+experienced+person%2C+that+seems+like+an+elephant+in+spiritual+skill+and+strength+amongst+the+flock%2C+come+to+the+plainest+place%2C+to+search+out+the+mind+and+will+of+God+in+it%2C+if+he+be+humble+as+well+as+learned%2C+%E2%80%94+which+if+he+be+not+he+is+not+wise%2C+%E2%80%94+he+will+scarce+boast+that+he+hath+been+at+the+bottom+of+it%2C+and+hath+perfectly+comprehended+all+that+is+in+it%2C+seeing+whatever+we+know%2C+%E2%80%9Cwe+know+but+in+part.%E2%80%9D+And+they+may+all+of+them%2C+elephants+and+lambs%2C+meet+at+the+same+passages+of+this+river+that+makes+glad+the+city+of+God%2C+these+waters+of+rest+and+quietness%2C+Ps.+xxiii.+2%2C+where+the+lambs+may+wade+safely%2C+and+the+elephants+swim+together.%0A%0AThe+poorest+of+the+flock%2C+in+the+right+use+of+means%2C+may+take+enough+for+themselves%2C+even+suitable+direction+and+refreshment%2C+from+those+very+places+of+Scripture+whose+depths+the+learnedest+guides+of+the+church+are+not+able+to+sound+or+fathom.+Not+only+in+several+places%2C+but+in+the+same+place%2C+text%2C+or+testimony+of+Scripture%2C+there+is+food+meet+for+the+several+ages+of+Christians%2C+whether+babes+and+children+or+strong+men%3B+with+light+and+direction+for+all+sorts+of+believers%2C+according+to+the+degrees+of+their+own+inward+light+and+grace.+It+is+like+manna%2C+which%2C+though+men+gathered+variously+according+to+their+strength+and+appetite%2C+yet+every+one+had+that+proportion+which+suited+his+own+eating.%0A%0AWhen+a+learned+man%2C+and+one+mighty+in+the+Scriptures%2C+undertakes+the+consideration+of+a+place+of+Scripture%2C+and+finds%2C+it+may+be%2C+in+the+issue%2C+that+with+all+his+skill+and+industry%2C+with+all+his+helps+and+advantages%2C+though+attended+in+the+use+of+them+with+fervent+prayer+and+holy+meditation%2C+he+is+not+able+to+search+it+out+unto+perfection%2C+let+him+not+suppose+that+such+a+place+will+be+of+no+advantage+unto+them+who+are+not+sharers+in+his+advantages%2C+but+rather+are+mean+and+unlearned%3B+for+they+may+obtain+a+useful+portion+for+themselves+where+he+cannot+take+down+all.%0A%0AIf+any+one+look+on+this+river+of+God+like+behemoth+on+Jordan%2C+%E2%80%9Ctrusting+that+he+can+draw+it+up+into+his+mouth%2C%E2%80%9D+or+take+up+the+whole+sense+of+God+in+it%2C+he+of+all+others+seems+to+know+nothing+of+its+worth+and+excellency.+And+this+ariseth%2C+as+was+observed%2C+principally+from+the+things+themselves+treated+of+in+the+Scripture.+For%2C+divine+and+spiritual+truths+having+God+not+only+as+their+immediate+fountain+and+spring%2C+but+also+as+their+proper+and+adequate+object%2C+there+is+still+somewhat+in+them+that+cannot+be+searched+out+unto+perfection.%0A%0AAs+he+said%2C+%E2%80%9CCanst+thou+by+searching+find+out+God%3F+canst+thou+find+out+the+Almighty+unto+perfection%3F%E2%80%9D+Job+xi.+7%2C+%D7%A2%D6%B7%D7%93%D6%BE%D7%AA%D6%B7%D6%BC%D7%9B%D6%B0%D7%9C%D6%B4%D6%96%D7%99%D7%AA+%D7%A9%D6%B7%D7%81%D7%93%D6%B7%D6%BC%D6%A3%D7%99+%D7%AA%D6%B4%D6%BC%D7%9E%D6%B0%D7%A6%D6%B8%D6%BD%D7%90%2C+%E2%80%94+%E2%80%9Cfind+him+out+to+a+perfect+comprehension%2C%E2%80%9D+or+%E2%80%9Cto+a+consummation+of+knowledge%2C%E2%80%9D+that+it+should+be+perfect.+This+neither+the+nature+of+God+nor+our+condition+will+admit+of.+We+do+at+best+but+%E2%80%9Cfollow+after%2C%E2%80%9D+that+we+may+in+our+measure+%E2%80%9Capprehend+that+for+which+we+also+are+apprehended+of+Christ+Jesus%2C%E2%80%9D+Phil.+iii.+12.%0A%0AAnd+these+things+are+so+tempered+by+divine+wisdom+unto+the+faith+and+light+of+believers%2C+and+therein+unto+the+uses+of+their+consolation+and+obedience%2C+that+something+hereof+is+plainly+exhibited+to+every+spiritual+eye%3A+always+provided+that+their+search+and+inquiry+be+regulated+according+to+the+will+of+God%2C+in+a+due+use+of+the+means%3B+for+to+this+purpose+not+only+the+private+endeavours+of+men+are+required%2C+but+the+use+also+of+the+public+ministry%2C+which+is+ordained+of+God+to+lead+men+gradually+into+continual+further+acquaintance+with+the+will+of+God+in+the+Scripture.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews.+With+Preliminary+Exercitations%2C+ed.+W.+H.+Goold+%281674%3B+7+vols%2C+Edinburgh%3A+Johnston+and+Hunter%2C+1854%29%2C+4%3A+165-67.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52ced72ad1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52ced72ad1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/31/john-owen-on-lambs-wading-and-elephants-swimming-in-the-river-of-scripture/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>But for all can be understood in two ways: first, as applying to all the predestined, since it is only in the predestined that it is efficacious. Second, as applying absolutely to all so far as sufficiency is concerned; for of itself it is sufficient for all: who is the saviour of all, but especially of the faithful (1 Tim 4:10); he died for all in general, because the price was sufficient for all. And if all do not believe, he nevertheless fulfilled his part (Chrysostom).</p></blockquote>

<blockquote><p>S. What is natural Philosophy?

M. It is the true knowledge or discourse concerning the Creation and distinction of all this whole world with the parts thereof, of the causes by which it was so wrought, and likewise of the effects which follow thereon, appertaining to the praise of God the Creator.

S. From whence do you gather this your definition?

M. Specially out of two places of holy scripture, whereof the first is the. 30. chapt. and 4. verse of the Proverbs. The other the first chapter of Genesis, in which those four points are briefly recited, unto which also that place may bee added which is in the 7. Chapter and 17. and 18. verses, where it is evidently declared, that such things be handled in this Science.

S. Is this knowledge termed by this name only, or is it called by some other also?

M. Yea truly. For out of S. Paul it may be called The knowledge of God’s works, Rom. the 1. chap. and 20. verse. Out of the Epistle to the Hebrews, The knowledge of secular things. And finally we may as fitly and conveniently call it The knowledge of things created, as natural Philosophy was so called Of the searching of Nature, if so be that the use of that name had been familiar, and received by the Greeks and Latins.

S. Why then, do you call it natural Philosophy, which is a word used by the Heathen Philosophers?

M. For two causes. The first is, for that Christians ought not to be so scrupulous, or rather superstitious, that they should be afeard to use such common words and names as the Heathen do, for so much as with them we do use and enjoy the self same Sun, air, earth, water, light, meats, and Cities. Neither doth the Scripture it self refuse that word as unseemly or monstrous, as appeareth in the 2. chapter and 3. verse to the Ephesians, and the 1. Chapter and 5. verse of the second Epistle of S. Peter.

Also the ancient and Catholic fathers in every place, do term this knowledge of things by the name of Natural Philosophy, as did Basil, Chrysostom, Ambrose, Augustine in his Enchiridion to Laurence: Natural Philosophers, saith he, are they that search the nature of things. Secondly, that for as much as this word, Nature, in the common use of the Greek tongue, is, for the most part, applied to such things as do consist, not of essence only, of which sort GOD is, but are compounded with certain accidents adjoined, such as are all the things that we behold with our eyes, and whereof this visible world consisteth: that knowledge seemeth most properly to be termed natural Philosophy, which is busied in the handling of the mixt, compounded, and material things, that it may bee distinguished from Divinity. Wherefore, Natural Philosophy, say they, is the knowledge of Material and Instrumental beginnings.</p></blockquote>

<blockquote><p>In this post, the Philadelphia Covenanter lands another blow against the New Perspective on Moses by pointing out that Christ upheld the true meaning of the so-called law of retaliation (Matthew 5:38-42) and the penal sanction against rebellious children (Matthew 15:4). Although advocates of the New Perspective on Moses are quick to accuse Judicial Calvinists with being legalists, the irony is that their position is actually that of the Pharisees rather than that of Jesus Christ:

The law of retaliation would seem to be taught by the light of nature […] It is evidently founded on the principles of immutable justice. It appears, however, to have been grossly abused by the Jews, for the purpose of private revenge. This the Redeemer forbids; but in no instance did he interfere with the province of the civil magistrate farther than to command his disciples to obey the laws which God had given to Moses. Matt. xxiii. 1. Could it be proved that Christ abrogated the law of retaliation, the same reasoning would prove that he had abrogated all law, and, consequently, all civil government. Moses commanded – “And he that curseth his father, or his mother, shall surely be put to death.” Exod. xxi. 17. This command the Scribes and Pharisees had set aside, probably under the pretence of its being a cruel law; but, for so doing, the Redeemer calls them hypocrites, and blind leaders of the blind. Matt. xx. 1-9, and 14. Mark vii. 6-13. Think of that ye advocated for the murderer – ye falsely merciful – ye vilifers of the law of Moses. Do ye pretend to be more compassionate than the Son of God? Do you understand, better than he, the demerit of crime, and the manner in which it should be punished? Do our pseudo-philanthropists know that there is such a passage in the gospel?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1847, pp 164-5</span></figcaption>

<blockquote><p>Adultery is judged to be a sin worthy of death and endless infamy. For the Lord in the law doth not say only, “Thou shalt not commit adultery;” but in another place also goeth on, and addeth, “And he that committeth adultery with another man’s wife, even he that committeth adultery with his neighbour’s wife, let both the adulterer and the adulteress be slain.” Levit. xx. And this punishment of adultery by death was not abrogated or changed by the very Gentiles; for the Roman law Lex Julia is very well known, how it commanded adulterers to be put to death: which law was of force in the time of St Hierome [Jerome], as we may gather by the history which he wrote of an adulteress, at the chopping off of whose head seven strokes were given.

Neither is it marvel, undoubedly, that adultery was among them of old, and is yet to this day, according to the laws, to be punished by death; for upon that one many sins do depend. […] Since therefore that it is a serpent with so many heads, both the laws of God and men do rightly punish adulterers with loss of life.</p></blockquote>

<blockquote><p>To a person in any degree acquainted with the history of the Scottish Reformation, it must be completely evident that the Reformers laboured strenuously to establish, as an essential part of their system, the harmonious co-operation of a reformed State with a reformed Church, in maintaining truth and piety, and repressing falsehood and irreligion. This principle, after countless struggles and costly sacrifices, willingly tendered for its attainment, became ascendant at the memorable era of the Second Reformation, from 1638 to 1649, and was embodied in the solemn vows of the nation. These Federal Deeds assume the doctrine of an Establishment so fundamentally, that lay it aside, and they are deprived of half their meaning. They tender the national faith for the upholding of a pure establishment, which, through the good hand of God, had been set up; and they most unequivocally bind men, in civil authority, of whatever class, to employ their official power and resources to sustain the true religion professed, and to discontinue and eradicate error and false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenanter’s narrative and plea: exhibiting the error, schism, radicalism, and slander of Dr. Paul, and other separatists from the Reformed Presbyterian Church</cite>, (Belfast, 1841), pp 32-3.</span></figcaption>

ants/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>It is often assumed that American slavery was wholly the fault of those living in the Southern states of the union; this assumption is crudely reductionist. Indeed, we find Albert Barnes, a New School Presbyterian theologian, arguing that public opinion in the North was often more proslavery than that in the South:

[…] I have been led to apprehend that there are many there [in the South] who, in this respect, are much in advance of many at the North, and that among these are many who exhibit a degree of candour which we do not always find in those portions of our country in which slavery does not exist. There is a hesitancy at the North in speaking of it as an evil; a desire to apologize for it, and even to defend it as a scripture institution, which by no means meets the convictions of the great body of men in the South, and for which they do not thank us. They regard slavery as an unmixed evil – as the direct calamity of their portion of the republic. They consider it to be contrary to the spirit of the Bible. They look upon it as a curse in the midst of which they were born; as an evil entailed upon them without their consent, and which they desire above all things to get rid of. They remember with little gratitude the laws and cupidity of the mother country [Britain] by which it was imposed on them, and the Northern ships by which the inhabitants of Africa were conveyed to their shores; and they little thank the professors in Theological Seminaries, and the pastors of the churches, and the editors of papers, and the ecclesiastical bodies at the North, who labour to convince the world that it is not an evil, and that it is one of the designs and tendencies of Christianity to rivet the curse on them for ever. Such men ask for no defence of slavery from the North. […] There have been more published defences of slavery from the Bible at the North, than there have been from the South.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/albert-barnes.html">Albert Barnes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An inquiry into the scriptural views of slavery</cite>, (Philadelphia, 1846), pp 9-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

<blockquote><p>This offence was plagued with most sharp punishment even in the beginning almost, and as soon as the world was created. Pharao [sic], the king of Egypt, commanded Sara, Abraham’s wife, to be taken away and carried to his palace, that he might use her as his wife; thinking verily that she had been Abraham’s sister. But the scripture saith, “The Lord vexed Pharaoh and all his house with great plagues, because of Sara, Abraham’s wife.” Lo, here the king of Egypt is punished with grievous plagues for his adultery; and yet he knew not that Sara was Abraham’s wife: how great plagues therefore are prepared for the men that wittingly and willingly, without all shame, commit adultery! To Abimelech, king of the Philistines, the Lord doth say, “Lo, thou shalt die, because of the woman which thou hast taken away from her husband.” And yet this king also had taken away Sara, not knowing that she was Abraham’s wife. Joseph, being provoked to adultery by his master’s wife, doth simply say, “How should I do this great wickedness, and sin against God?” Every woth doth bear some weight: for adultery is an heinous sin. Whereupon in the book of Job we find these words of Job himself: “If mine heart have been deceived by a woman, or I have laid wait at my neighbour’s door; then let my wife be another man’s harlot, and let other men have to do with her. For this is a wickedness and sin that is worthy to be judged to death: yea, it is a fire that utterly should consume and root out all mine increase.” [Job 31] Job saith that he hath not only not committed adultery to defile another man’s wife. He confesseth that adultery is a sin, and so grievous an offence, that it doth deserve to have the adulterer’s wife to be defiled with adultery. He addeth that adultery is a fire that utterly consumeth and devoureth all things; and, lastly, that it is a sin to be judged, and punished with death.</p></blockquote>

<blockquote><p>Radical Two Kingdom theology (R2K) affirms that while Christ is Lord of both the ecclesiastical and political realm, the latter kingdom is to be governed by natural law as opposed to biblical law. However, the American Reformed Presbyterian, Samuel B. Wylie, helpfully explains what Covenanters’ mean by the two kingdoms and how both kingdoms are to submit to the written law of God:

Though both these branches are put under the Mediator’s control, yet they are so, under different regulations. Ecclesiastical power is delegated to him in such a manner that all ordinances and institutions, necessary to the formal organization of a visible church, flow immediately from him as Mediator. Matt. 16:18. He is the builder of the church, the author of all her sacred institutions. All ecclesiastical functionaries, likewise, receive their authority from him, in the same character, for every part of their administration. Hence, Matt. 16:19, he commits unto them the keys of the kingdom, and the exclusive power of binding and loosing. But civil power is under a different regulation. It flows immediately from God Creator, as the Governor of the universe. Jer. 10:7: “Who would not fear thee, O King of nations?” It existed previously to the fall, and would necessarily have existed, even had we never revolted from God; though, no doubt, in that case, it would not have been clothed with some of its present modifications. Man’s subjection to the moral government of his Maker, would have been similar to that of beings of a more dignified order.

Civil government does not, as some modern politicians affirm, originate either in the people, as its fountain, or in the vices consequent upon the fall. Among the angels, who retained their primitive rectitude, we find certain orders, suggested by the denominations of Archangels, Thrones, Dominions, Principalities, and Powers, Col. 1:16. This testifies regular subordination among them, agreeable to the constitutional laws of their nature, and their amenability to God, their Creator and Lord. But though civil government is no new order of things, predicated upon the fall, nor, like the ministry, in all its circumstances, flowing immediately from Christ as Mediator; yet it is among the all things committed to him by the donation of the Father, Eph. 1:22.

Its officers likewise, are enjoined, under pain of perdition, to make all their administrations bend to the honour of Immanuel: and the body politic indispensably bound to modify their constitutions by his word, when in his goodness he has revealed it unto them. Ps. 2:10,12: “Be wise now, therefore, O ye kings: be instructed, ye judges of the earth. Serve the Lord with fear, and rejoice with trembling. Kiss the Son, lest he be angry, and ye perish from the way, when his wrath is kindled but a little.” Can any thing be more explicit in demonstrating the obligation of the civil authorities to render homage and respect to Messiah?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-b-wylie.html">Samuel B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 8-9.</span></figcaption>

<blockquote><p>In an article on capital punishment in the Philadelphia Covenanter periodical (not to be confused with the Belfast Covenanter), edited by James M. Willson, the author contrasted the Gnostic or Marcionite view of the Old Testament’s penal laws held by John Paul, with the true Covenanter position adhered to by Thomas Houston:

Were the law which God gave to Moses admitted authority, there would be an end of this controversy [over capital punishment]; but the prevailing sentiment of the present day seems to be that of the Gnostics, who taught that the God of Israel was the devil, and that Jesus Christ came to destroy his power, and deliver men from his tyranny! The editor of the New York Tribune is wonderfully scandalized at being charged with infidelity; and yet he quotes, without remark, a passage from the Lynn Record, in which an “eye for an eye,” &amp;c., is termed infernal policy! Dr. Paul, of Ireland, (once a Covenanter,) calls the laws of the Old Testament Thomas Houston’s bloody laws! In this he offers a double insult to the Divine Majesty; first, in calling his laws bloody; secondly, by calling them Thomas Houston’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1847, pp 163-4</span></figcaption>

Were the law which God gave to Moses admitted authority, there would be an end of this controversy [over capital punishment]; but the prevailing sentiment of the present day seems to be that of the Gnostics, who taught that the God of Israel was the devil, and that Jesus Christ came to destroy his power, and deliver men from his tyranny! The editor of the New York Tribune is wonderfully scandalized at being charged with infidelity; and yet he quotes, without remark, a passage from the Lynn Record, in which an “eye for an eye,” &amp;c., is termed infernal policy! Dr. Paul, of Ireland, (once a Covenanter,) calls the laws of the Old Testament Thomas Houston’s bloody laws! In this he offers a double insult to the Divine Majesty; first, in calling his laws bloody; secondly, by calling them Thomas Houston’s.”

<blockquote><p>The traditional Covenanter view of the Old Testament’s penal sanctions is that the majority of them remain binding today, as they have not been abrogated in the New Testament. Samuel B. Wylie, an American Reformed Presbyterian, explains this position below:

It may perhaps be inquired, what are those things which he [the civil magistrate] may lawfully command? To this I answer, he may lawfully command whatever is contained in the constitution prescribed by him whom he represents. Deut. 17:18, we are told what this is, namely, the Divine Law. Whatever penalties are specified in that law, and nowhere either repealed or mitigated, should be duly inflicted, in case of disobedience. Where the law is silent or indefinite, with respect to particular crimes, against any precept of the Decalogue, and the punishment due thereto, great prudence and discretion will be necessary to ascertain whether said crimes are punishable by civil pains, as there are many violations of the moral law to which no particular civil penalty can attach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>It was framed and concluded by the representatives of kingdoms in concurrence with those of the Church; it was sworn by them in their public capacity; at their call and by their authority, it was afterwards sworn by the body of all the people in their different ranks and orders; and finally it was ratified and pronounced valid by laws both civil and ecclesiastical. The public faith was thus plighted by all the organs through which a nation is accustomed to express its mind and will. Nothing was wanting to complete the national tie, and to render it permanent; unless it should be maintained that absolute unanimity is necessary, and that a society cannot contract lawful engagements to God or man, as long as there are individuals who oppose and are dissentient. Sanctions less sacred, and pledges less numerous would have given another nation, or even an individual, a perfect right to demand from Britain the fulfillment of any treaty or contract; and shall not God – who was not only a witness, but a principal party, and whose honor and interests were immediately concerned in this transaction – have a like claim? Or shall we “break the covenant and escape? [Ezekiel 17:15]</p></blockquote>

<blockquote><p>Back in the days of the Arian controversy in the Synod of Ulster, there were some orthodox people who argued that Trinitarians should tolerate Unitarians and Arians in their midst in the hope that this destructive heresy would just quietly die out. Dr John Paul of Loughmourne, on the other hand, argued that this was irrational nonsense:

For the Antitrinitarians and the orthodox to “agree to differ,” is quite preposterous. To say:- “We do not worship the same God – we regard each other as idolaters or blasphemers; and yet, to show our liberality, we will still continue to worship together, we will hold communion with each other.” This is monstrously absurd. What communion hath the temple of God with idols? To sit down at the same holy table of the Lord with those whom we regard as blasphemers or idolaters, is surely a great absurdity; nor is it less absurd to join with them in discipline. What! join in the acts of discipline with blasphemers or idolaters! Join, as a Presbytery, in laying hands on blasphemers or idolaters! Ordain to the work of the holy ministry blasphemers or idolaters! Could any thing be more inconsistent, absurd, or impious? Surely not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-paul.html">John Paul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of a speech by the Rev. Dr Montgomery of Belfast, and the doctrines of the Unitarians proved to be unfavourable to the right of private judgment, to liberality and charity, to the investigation of truth, and the practice of virtue</cite>, (Belfast, 1828) in Stewart Bates (ed.), Works of the late Rev. John Paul, D.D., of Carrickfergus. With a memoir and introduction by the editor (Belfast, 1855), p. 428.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-95d4f7e253" data-kw="">
<blockquote><p>At a soiree to the Revd Dr Samuel B. Wylie held at Belfast in October 1845, the Revd Isaac Nelson of Donegall Street Presbyterian Church spoke of his admiration for Dr Wylie. Dr Wylie then addressed the gathering, which was chaired by Counsellor James Gibson, on the steps that Covenanters in America had taken against the abomination of chattel slavery:

The CHAIRMAN then called upon the Rev. Isaac Nelson, to address the meeting on union among christians of all denominations, for the suppression of slavery as a system repugnant to liberty, and the spirit of the Gospel. Mr. Nelson responded to the sentiment in an eloquent and energetic speech, in which he denounced slavery as hateful in the sight of God, and disgraceful to humanity. – He hoped the mantle of Dr. Wylie, and men like him, who had contended for the liberty of their fellow-man, would fall upon others, who would never cease their efforts until the foul stain of slavery would be not only banished from churches, but from every nation under heaven. (Hear, hear, and cheers.) All sections of the church would unite to free the slave, indeed, on that subject of slavery, and the conclusion to which he had come was, that no slaveholder should be allowed to sit down at the Lord’s table, or be recognised as a member of the Christian Church. He did not take his opinions from any man, and, were he to stand alone in the Church to which he had the honour to belong, he would maintain his opinion that slave-holding was a sin, and that the slave-holder should be excluded from the church. (Cheers.)

THE CHAIRMAN then introduced Dr. Wylie to the meeting, and he gave a detailed account of what he had done himself and of what had been done in his day for the abolition of slavery in America, as regarded the Reformed Presbyterian Church, the end of which was that all slaveholders were banished from her communion. For many years that church had maintained the high and holy stand she had taken, though in some places her members had suffered much on account of their opposition to slavery. The Covenanting Church in America would as soon allow a sheep-stealer to sit down at the table of the Lord, as they would a slave-holder. (This statement was received with the most enthusiastic applause.) Dr. Wylie then congratulated the various churches in this country on the stand which they had taken in opposition to slavery […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/belfast-commerical-chronicle.html">Belfast Commerical Chronicle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commerical Chronicle</cite>, 27 Oct. 1845</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

The CHAIRMAN then called upon the Rev. Isaac Nelson, to address the meeting on union among christians of all denominations, for the suppression of slavery as a system repugnant to liberty, and the spirit of the Gospel. Mr. Nelson responded to the sentiment in an eloquent and energetic speech, in which he denounced slavery as hateful in the sight of God, and disgraceful to humanity. – He hoped the mantle of Dr. Wylie, and men like him, who had contended for the liberty of their fellow-man, would fall upon others, who would never cease their efforts until the foul stain of slavery would be not only banished from churches, but from every nation under heaven. (Hear, hear, and cheers.) All sections of the church would unite to free the slave, indeed, on that subject of slavery, and the conclusion to which he had come was, that no slaveholder should be allowed to sit down at the Lord’s table, or be recognised as a member of the Christian Church. He did not take his opinions from any man, and, were he to stand alone in the Church to which he had the honour to belong, he would maintain his opinion that slave-holding was a sin, and that the slave-holder should be excluded from the church. (Cheers.)

THE CHAIRMAN then introduced Dr. Wylie to the meeting, and he gave a detailed account of what he had done himself and of what had been done in his day for the abolition of slavery in America, as regarded the Reformed Presbyterian Church, the end of which was that all slaveholders were banished from her communion. For many years that church had maintained the high and holy stand she had taken, though in some places her members had suffered much on account of their opposition to slavery. The Covenanting Church in America would as soon allow a sheep-stealer to sit down at the table of the Lord, as they would a slave-holder. (This statement was received with the most enthusiastic applause.) Dr. Wylie then congratulated the various churches in this country on the stand which they had taken in opposition to slavery […]”

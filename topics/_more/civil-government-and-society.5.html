<blockquote><p>In an address submitted before the General Assembly of the Confederate Presbyterian Church in 1863, Dr James A. Lyon condemned the laws of Southern states with respect to slave marriages. Keep in mind that Dr Lyon was not a Yankee abolitionist, but a proslavery Southern Presbyterian. His comments reveal that, far from being a great Christian society, the Old South gave legal protection to the most base immorality. In light of this extract, the idea of theonomists promoting the Old South as a model of “liberty and justice” is madness (thankfully men like Brian Schwertley, Gary North and Bojidar Marinov dissent from such folly; may more do likewise):

But perhaps there is not dereliction connected with negro slavery, as it exists in this country, fraught with more evil, whether viewed in relation to the happiness and moral character of the slave himself, or to the interests of the institution as such, than that of ignoring, in our legislation, the marriage and domestic relations amongst slaves. This is, indeed, a crying and a damaging evil, that sets at defiance the precepts of the Bible, the dictates of nature, and the moral sentiment of humanity. There is no law of God more clearly and repeatedly promulgated, in both natural and revealed religion, than that constituting the marriage and domestic relations.

There is no institution, human or divine, so efficient in developing the various attributes of man’s nature, and, consequently, in yielding so much unalloyed happiness, as that of the family, as God constituted it. The relations of husband and wife, parent and child, next to our relation to God in filial love and Christian faith, are calculated to develop and cultivate traits and amenities in the nature of man, without which humanity is defective, and unproductive of true happiness. …

Hence it is impossible from the very nature of the case, to civilize, elevate, and Christianize a savage people, in the absence of the conjugal and domestic ties. The whole Gospel can not be preached to a people in that condition. It would be a mockery alike of the moral law and the precepts of Christianity. To make the attempt would be to regard and treat the slave as a brute, and not as a man. And yet, it is not worth while to attempt to disguise the fact that, however much humane and conscientious individuals may attempt to respect the marriage and domestic relations, as existing between their own slaves – and we are happy to testify that multitudes do – yet, nevertheless, the laws of the land, for which we are all and every one responsible, wholly ignore the marriage relation as existing among slaves. There is nothing in our legislation, so far as we know, that recognizes marriage between the slaves; or that prohibits fornication, adultery, bigamy, incest, or even rape amongst them.

This is an outrage upon the laws of God, both natural and revealed, except on the presumption that the slave is not a man, but a brute, with a brute’s propensities, a brute’s nature, and a brute’s destiny. These evils, it is true, may be mitigated by the conscientious, Christian master, to some extent; but it is only a mitigation; since no one can prevent the domestic ties from being sundered at the will of the unfeeling or unfortunate master, the creditor, the executor, or the law commissioner. And the fact that this violation of God’s law is done by human law, does not relieve our consciences, or extenuate our guilt, in the least, from the fact that we, the people, are the makers of law.

Did we live under a despotism, had we no part in the framing of laws and the establishment of government, then our responsibility for this and other evils in our legislation would not be so great. Nevertheless, as the ambassadors, not of an earthly potentate, but of “the King of kings and Lord of lords,” we are commissioned and bound to tell law-makers, rulers, and governors, their duty, whether they will hear or whether they will forebear. But our government is a popular government, and every freeman is a sovereign; and all are responsible alike for the laws, and the manner in which they are executed. Consequently, no citizen who has a right to vote, or even to speak the truth, can free himself from the responsibility attending the legislation of the land, until he has exerted all his influence, in every lawful way, to make it accord with righteousness. …

This law of man’s nature – the natural right to the happiness flowing from it – no power on earth can frustrate, without setting at defiance the clearly revealed laws of God. But, lamentable as the fact is, and however much to be deplored, this holy institution, as existing between the slaves, is wholly ignored by the laws of the land. There is no law, in any State, so far as we know, that recognizes marriage between the slaves, or that condemns any of the vices growing out of the relation of the sexes perpetrated between the slaves. In this respect, therefore, our legislation does not conform to the principles of Christianity, nor to the dictates of nature, but is a sin against both; and, as a natural consequence, is attended with evils of immense magnitude. … Whenever human legislation is contrary to the dictates of nature, to say nothing of revealed religion, then we may be sure it is wrong, and will sooner or later inevitably result in evil.</p></blockquote>

<blockquote><p>Christians have been known to spend much time debating who was technically right in the American Civil War/War Between the States. While not an entirely useless endeavour, this approach is in danger of missing the bigger picture. Isaac Nelson, of the Irish Presbyterian Church, reminds us of how the war demonstrated what happens when a nation abandons biblical justice:

His judgment long ago was – that slavery was entirely opposed to all justice. The pulpit had not done its duty in the matter, when it might have done so. The Churches of America had filled the cup of God’s indignation, and the people had now drunk it to the dregs. We find fault with the men who are corrupting the Word of the living God. It was quite possible for a nation as well as an individual to sin away its days of grace; and let us beware that as a nation we are not doing so. The lesson we have to learn from America is this – that they took to their bosom an adder of which we have to mourn, and learn the lesson that to do justice, to love mercy, to walk humbly with God is the only security for national prosperity.</p></blockquote>

<blockquote><p>[T]he [New Testament] dispensation would not come to a close till the religion of Messiah the Prince should be legally established in every nation under heaven, and till rulers and nations as such, should “kiss the Son,” and bow down under the sceptre of his power. Inspired prophecy foretels [sic] that “kings should be nursing fathers, and their queens nursing mothers” to the Church; that rulers shall bring their “glory and riches to Zion;” and that the “isles” shall submissively “wait for the Saviour’s law.” The Spirit of the Lord commands kings to be “wise and kiss the Son,” and expressly intimates that the command shall be, one day, universally obeyed. When Ethiopia shall stretch out her hands to God, “mighty princes shall come out of Egypt” to Mount Zion; the “saints of the Most High God shall take the kingdom, and possess it,” and the “kingdoms of this world” shall become “the kingdoms of our Lord and of his Christ.”

These declarations are sufficient to set aside all the vain reasonings of men of corrupt minds on this matter. In their plain and unsophisticated meaning, they do, beyond all question, warrant the opinion, that civil rulers have to do with the Church of Christ – are bound to cherish and support her, and act under a solemn responsibility to employ their influence and authority to promote her peace and prosperity. And, they, furthermore, as the voice of the Lord, assure us that the faithful witnesses of the Lamb, having regard to their Master’s honour, should in every age assert this part of his prerogative.</p></blockquote>

</figure><figure class="quote" id="q-6fd9ace109" data-kw="">
<blockquote><p>Anyone who has spent any real time among those influenced by the Religious Right in America will know that they hate the thought of anything being “socialised”. Our Reformed forebears, however, did not share this antagonism. They realised that society, not just the individual, was held accountable by God for observing the moral law. That is why the Reformers “socialised” care for the afflicted and education, because the law of God commands the nations to promote these things. (No, this is not “communism”. The Reformers did not advocate wealth equalisation or even the inherent virtue of public ownership of the means of production, but they did recognise that citizens were to contribute to the common good. Consequently, the Reformed position is rightly described as Social Theocratic, and not communist in any real sense of the word.) Since the law applies to society, they entered into social covenants to observe the commandments of the Lord. Notwithstanding the emphasis of modern theonomists on returning to the Old Testament law, not many of them have advocated social covenanting – even though social covenanting has not been abrogated in the New Testament. This is another sorry example of them preferring Mises to Moses. By way of contrast, Samuel Simms demonstrates that social covenanting remains obligatory upon modern societies:

176. What are some of the approved examples of Covenanting in the Old Testament times, to which you refer?

The Old Testament abounds with such examples. The children of Israel, in their national and ecclesiastical capacity, entered into a public, social Covenant at Mount Sinai, after their deliverance from Egypt. (See Exod. xix., xx., xxi, xxii., xxiii., xxiv.) That there was a national Covenant entered into by the Israelites at Sinai few will deny. “The words which the Lord commanded” were “laid before” the people, and “all the people answered together, and said, All that the Lord hath spoken we will do” (chap. xix. 7, 8); and the transaction is spoken of as a “Covenant,” chap. xxiv. 7, 8) […]

180. What is the nature of the argument for Covenant drawn from the New Testament?

It is threefold. First, the New Testament does not abrogate the ordinance; secondly, there are in the New Testament certain general principles which afford a strong presumptive proof in support of the doctrine; and, thirdly, the New Testament contains passages directly bearing on the subject.</p></blockquote>

<blockquote><p>The Christian Magistrate ought to protect the Elders, that they may peaceably exercise that Church-power which is committed to them by Jesus Christ, for the Christian Magistrate doth owe a spiritual subjection to all the ordinances of Jesus Christ […] It will be very dangerous for a Magistrate to do any thing of his own head about Church affairs, and it will be as dangerous for Ministers to complement in this weighty point; all power that a Magistrate hath settled upon him in Rom. 13 is settled on him as he is a Minister of God, and therefore they who teach Magistrates to despise the Authority of Ministers, because they are but Ministers of God, teach the Magistrates to despise their own authority. Officers of Christ’s instituting, and powers of God’s ordaining, must agree together, and uphold one another, or else both will be vilified: Ministers must not usurp a civil power, nor Magistrates lay claim to any Spiritual power properly so called: if a man go about to thrust two swords into one scabbard, let him take heed he doth not split the scabbard, and cut his fingers.</p></blockquote>

<blockquote><p>153. What is a NATIONAL COVENANT?

A National Covenant is a mutual stipulation entered into by a people and their rulers, by which, in a professed taking hold of the Covenant of Grace, they publicly pledge themselves to the performance of certain duties which they owe to God and one another.

154. Is not National Covenanting, as thus defined, a religious transaction?

Yes: it is a duty based on the Moral Law commanded and exemplified in the Word of God, and, being a solemn appeal to the justice and omniscience of Jehovah, is to be viewed as a direct act of religious worship.

155. May not a National Covenant comprehend things both civil and religious?

Yes: to unite things civil and religious is not to blend things sacred and common, as is often said. The necessity, occasionally, of embracing civil and religious objects in one bond will appear from the fact that things civil and religious are sometimes so closely connected that the one may be assailed through the other. Moreover, Scripture authorizes the connexion, as is evident from the Covenant referred to in Neh. x. 29. Here the Covenanters entered into “a curse” and “an oath” to walk in “God’s law,” and to “do all the commandments of the Lord” – both first and second table duties. We are also commanded to “fear God and honour the king.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prize catechism on the principles and position of the Reformed Presbyterian Church</cite>, (Belfast, 1858), pp 64-5.</span></figcaption>

<blockquote><p>And Kings shall be thy nursing fathers (Isaiah 49:23 Geneva Bible)

John Owen corrects the Erastian notion that the above text gives the civil magistrate power in sacris (in intrinsically sacred matters):

[…] It is true that this is promised, and God accomplish it more and more! but yet we do not desire such nurses as beget the children they nurse. The proposing, prescribing, commanding, binding religion on the consciences of men, is rather the begetting of it than its nursing. To take care of the church and religion, that it receive no detriment, by all the ways and means appointed by God and useful thereunto, is the duty of the magistrates: but it is so also, antecedently to their actings unto this purpose, to discern aright which is the church whereunto this promise is made; without which they cannot duly discharge their trust nor fulfil the promise itself. The very words, by the rules of the metaphor, do imply that the church and its religion, and the worship of God observed therein, are constituted, fixed, and regulated by God himself, antecedently unto the magistrate’s duty and power about it. They are to nurse that which is committed to them, and not what themselves have framed or begotten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth and innocence vindicated; in a survey of a discourse concerning ecclesiastical polity, and the authority of the civil magistrate over the consciences of subjects in matters of religion</cite>, (London, 1669) in The works of John Owen, ed. W. H. Goold (16 vols, Edinburgh, 1967), xiii, 401-02.</span></figcaption>

<blockquote><p>As a result of the influence of Libertarian Theology on most modern theonomists, they have generally shunned the establishment principle and rejected the idea that the civil magistrate is to financially endow the external observance of true religion. The irony of this is that it violates a central principle of theonomic hermeneutics: that whatever is commanded in the Old Testament, and was not repealed in the New Testament, remains binding. It is clear that true religion was nationally endowed in the Old Testament, yet the majority of contemporary theonomists argue that the state should not endow the church in the New Testament. David Scott corrects this muddled thinking in the extract below:

It is objected that the New Testament contains no appointment of such provision. The answer to this objection is brief but most satisfactory. The Old Testament is of divine authority as well as the New, and as obligatory in its precepts for our direction in doctrine and practice as the New Testament, in every thing except the peculiarities of the former dispensation. To provide for the maintenance of religion is peculiar to no administration of religion, but common to all. It is a moral principle which is in no ways affected by any change in its outward dispensation. The provision made for the Old Testament church is an example having all the force of a command, for the command though given to the Jewish people, regarded a moral duty, and therefore not peculiar to them, but common to them and us. It is not necessary then that there should be any precept in the New Testament; that which was given in a former dispensation continues in full force. The friends of a public provision for religion, have a right to ask those who are opposed to it, to furnish New Testament authority for the rescinding of the precept which was formerly given. Nothing short of this can affect the argument or form an objection to the duty of a national provision for religion. A merely positive appointment remains in force till it is abrogated. Does the New Testament contain any such rescinding act? Had it been only a positive appointment if not rescinded it would have remained in force; how much more being a moral duty?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), p. 292.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>The women of my people you drive out from their delightful houses; from their young children you take away my splendour for ever” Micah 2:9

Now, Micah specifically speaks next of elderly widows and orphaned children, as whenever cruel measures are practiced, little children and widows suffer. Once we lose sight of them, we signal how absent of human feeling we have become, and how like wild beasts we are. Accordingly, we are hereby admonished that, so long as people are weak and unable to support themselves, then all the more are we obligated not to hurt them, and to abstain from any act of evil or extortion that would bring them harm. And why is that? Because, if God is offended by our harming a person who is capable of defending himself, the offense is double when we wrong a defenseless, poor soul. For, of certainty, God will exact vengeance and take the person’s cause in hand. That is why Scripture proclaims that God is “the protector of widows” and the “Father of the fatherless” [Psalm 68:5]. For there are the very ones whom society neglects most, since they are the most destitute of human support. That is why our Lord embraces them in his safekeeping. For whenever the poor are unable to fend for themselves, then God expects us to step in, and, at the last judgment, will reveal that every time we oppressed widows and orphans, we were engaging in war with God himself.</p></blockquote>

b8bf.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/06/16/john-calvin-on-societys-duty-to-care-for-widows-and-orphans/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-e82430356a" data-kw="">
<blockquote><p>That civil and religious society, and, where revelation is enjoyed, church and state, with their respective authorities, are distinct and mutually independent, in their proper line and employment, will readily be granted by all who have just notions of the subject. But societies and powers which are distinct and independent, may have common objects about which they are employed, and may act in these with harmony and co-operation. Religion is an object of common interest to mankind, and as it enters into, and deeply affects the various relations in which they stand connected with one another, becomes an object of attention and care to all. Magistrates, Ministers, Masters and Parents have all a distinct and peculiar concern with it; and the authority of each may be employed about it, without encroaching on the business, or usurping the powers of others. Inattention to this general view of religion, and the connection which it necessarily has with the various relations of life, lies at the foundation of many of the modern errors which prevail upon the subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>
<div class="actions"><button class="copy" data-copy="“That civil and religious society, and, where revelation is enjoyed, church and state, with their respective authorities, are distinct and mutually independent, in their proper line and employment, will readily be granted by all who have just notions of the subject. But societies and powers which are distinct and independent, may have common objects about which they are employed, and may act in these with harmony and co-operation. Religion is an object of common interest to mankind, and as it enters into, and deeply affects the various relations in which they stand connected with one another, becomes an object of attention and care to all. Magistrates, Ministers, Masters and Parents have all a distinct and peculiar concern with it; and the authority of each may be employed about it, without encroaching on the business, or usurping the powers of others. Inattention to this general view of religion, and the connection which it necessarily has with the various relations of life, lies at the foundation of many of the modern errors which prevail upon the subject.”

— Thomas M’Crie, On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis, (Glasgow, 1832), p. 6.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+civil+and+religious+society%2C+and%2C+where+revelation+is+enjoyed%2C+church+and+state%2C+with+their+respective+authorities%2C+are+distinct+and+mutually+independent%2C+in+their+proper+line+and+employment%2C+will+readily+be+granted+by+all+who+have+just+notions+of+the+subject.+But+societies+and+powers+which+are+distinct+and+independent%2C+may+have+common+objects+about+which+they+are+employed%2C+and+may+act+in+these+with+harmony+and+co-operation.+Religion+is+an+object+of+common+interest+to+mankind%2C+and+as+it+enters+into%2C+and+deeply+affects+the+various+relations+in+which+they+stand+connected+with+one+another%2C+becomes+an+object+of+attention+and+care+to+all.+Magistrates%2C+Ministers%2C+Masters+and+Parents+have+all+a+distinct+and+peculiar+concern+with+it%3B+and+the+authority+of+each+may+be+employed+about+it%2C+without+encroaching+on+the+business%2C+or+usurping+the+powers+of+others.+Inattention+to+this+general+view+of+religion%2C+and+the+connection+which+it+necessarily+has+with+the+various+relations+of+life%2C+lies+at+the+foundation+of+many+of+the+modern+errors+which+prevail+upon+the+subject.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie%2C+On+church+establishments.+Extracts+from+Statement+of+the+difference+between+the+profession+of+the+Reformed+Church+of+Scotland%2C+as+adopted+by+Seceders%3B+and+the+profession+contained+in+the+New+Testimony+and+other+acts%2C+as+adopted+by+the+General+Associate+Synod%3B+particularly+on+the+power+of+civil+magis%2C+%28Glasgow%2C+1832%29%2C+p.+6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe82430356a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e82430356a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/06/08/thomas-mccrie-on-the-two-kingdoms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-eb0523f404" data-kw="">
<blockquote><p>Although this blog accepts the basic tenet of theonomy (that the penal sanctions are, for the most part, of perpetual obligation), nevertheless, some dangerous notions concerning the judicial law have been popular in certain American theonomic circles. Among the most perverse is the denial of the Lex Triplex: the threefold division of the law into moral, judicial, and ceremonial categories. While this distinction is not absolute (many divines recognised that various laws fell into both moral and judicial categories), nonetheless, it is a useful way of distinguishing between different types of laws. The early Reformed believed that the moral-judicial laws remained valid. Owing to their emphasis on the Lex Triplex, however, they did not come to the fanatical conclusion that the entire judicial law of Moses was binding on modern states. Many American theonomists recognise this in the abstract, but fall into fallacious reasoning when it comes to applying the law today (for instance, thinking that the Old Testament gleaning-laws can be slavishly followed in modern, industrial society). If they had only properly understood the Lex Triplex such errors could have been easily avoided. To this end, Henry Bullinger warns us that denial of the Lex Triplex is a sign of madness:

Now it is to be marked, that in Moses’ judicial law there are many things proper and peculiar to the Jewish nation, and so ordained, according to the state of the place, time, and persons, that, if we should go about to thrust on and apply them all to other nations, we should seem to shew ourselves more than half mad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 342.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-9497d83cbd" data-kw="">
<blockquote><p>In arguing for a national endowment of true religion, David Scott did not demand that the precise form of endowment that was provided in the Hebrew commonwealth be slavishly followed. Instead, he argued that the precise manner of such provision was a circumstantial matter, which had to be applied differently in varying circumstances. This, of course, is a correct way to interpret the moral-positive judicial laws, and why we confess that the “general equity thereof” still applies and deny that every nation must be an exact replica of Old Testament Israel:

A national provision for the support of religion is the duty inculcated by the example of the Jewish commonwealth without reference to peculiarity of circumstances; these may modify the details of the arrangement, but the example itself holds up for imitation the universal moral principle, that it is the duty of a civil community to make a competent provision for the maintenance of true religion within the national domain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), p. 274.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-fb6fa0c07c" data-kw="">
<blockquote><p>The obligation which all are under individually, to maintain the honour, and support the worship of God, attaches in an especial manner to nations and those who are in public authority over them. “Let us begin with God,” is a maxim applicable to the formation of civil society and laws, as well as to other important undertakings. Men are not to herd together like a number of cattle, making provision merely for their external protection, accommodation and order, forgetting the God that is above. A constitution which did not recognize religion, nor make any provision for its maintenance and defence, would be, in so far, an atheistical constitution. – As magistracy is an ordinance of God, and those invested with it, though chosen by men, are “the ministers of God,” such persons must be under special obligations to maintain his honour. This they are bound to do, not merely by the preservation of justice and peace, but by promoting his worship in their official station, and by resenting open indignities and contempt offered to the Majesty of heaven, by whom they rule, and decree justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-b854e1dec7" data-kw="">
<blockquote><p>It is clear the question must be thus stated, for all the laws of the old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false Gods and the breach of which the Godly Magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment. Deut. 13.8, 9, 10, 11. Deut. 17. 5, 6. Levit. 20. 1, 2, 3, 4, 5. But opinions in the Mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>

<blockquote><p>Many of us are familiar with the old saying, “If men were angels, government would not be necessary”. This is something of a half-truth, however. In his exposition of Romans 13, James McLeod Willson points out that civil government also has positive functions – such as promoting true religion:

It is not affirmed that the execution of law consists entirely in acts of a punitive character. It would be so, provided government had been established with no other view than to protect the peaceable citizen. Such a notion is most derogatory to the magistrate and the government. The civil ruler would then be no more than a policeman, and government a system of police. Government has higher functions. It is a “praise” them that do well. And, hence, it takes an interest in all that promotes a quiet, industrious and moral behaviour – it provides for the education of the people—it ought to interest itself in the maintenance of pure religious observances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Civil government: an exposition of Rom. XIII. 1-7</cite>, (Philadelphia, 1853), pp 85-6.</span></figcaption>

<blockquote><p>As one of the Scottish commissioners to the Westminster Assembly, Samuel Rutherford is an important source for understanding the Westminster Confession’s teaching on the civil magistrate and biblical penology. In this quotation, he informs us that the English Protestant divines believed that the penal sanction for adultery was of common equity:

The English Divines do well observe, That adultery is a capital crime to be punished by the Judge, Gen. 38. 24. Lev. 20. 10. Deut. 22. 22.</p></blockquote>

— Samuel Rutherford, A free disputation against pretended liberty of conscience, (London, 1649), p. 313.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+one+of+the+Scottish+commissioners+to+the+Westminster+Assembly%2C+Samuel+Rutherford+is+an+important+source+for+understanding+the+Westminster+Confession%E2%80%99s+teaching+on+the+civil+magistrate+and+biblical+penology.+In+this+quotation%2C+he+informs+us+that+the+English+Protestant+divines+believed+that+the+penal+sanction+for+adultery+was+of+common+equity%3A%0A%0AThe+English+Divines+do+well+observe%2C+That+adultery+is+a+capital+crime+to+be+punished+by+the+Judge%2C+Gen.+38.+24.+Lev.+20.+10.+Deut.+22.+22.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+free+disputation+against+pretended+liberty+of+conscience%2C+%28London%2C+1649%29%2C+p.+313.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa5cc08ae3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa5cc08ae3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/05/09/samuel-rutherford-on-the-punishment-of-adultery/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 289-90.</span></figcaption>

</figure><figure class="quote" id="q-d38fa2259a" data-kw="">
<blockquote><p>Unlike many today, the Scottish Reformers saw no incongruency between church discipline and the state’s implementation of biblical penology:

Marriage once lawfully contracted, may not be dissolved at man’s pleasure, as our master Christ Jesus does witness, only [if] adultery be committed; which being sufficiently proven in presence of the Civil Magistrate, the innocent (if they so require) ought to be pronounced free, and the offender ought to suffer the death as God hath commanded. If the Civil sword foolishly spare the life of the offender, yet may not the Church be negligent in their office, which is to excommunicate the wicked, and to repute them as dead members, and to pronounce the innocent party to be at freedom, be they never so honourable before the world. If the life be spared (as it ought not to be) to the offenders, and if the fruits of repentance of long time appear the same, and if they earnestly desire to be reconciled with the Church, we judge that they may be received to participation of the Sacraments, and of the other benefits of the Church, (for we would not that the Church should hold those excommunicant whom God absolved, that is, the Penitent.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>repr in The works of John Knox, ed. David Laing</cite>, (6 vols, Edinburgh, 1856), ii, 248.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Reformed Christians have often been divided on whether or not the apostle Paul was referring to Nero in Romans 13. The Revd Samuel Simms of Loughbrickland Reformed Presbyterian Church answered in the negative (arguably, Simms goes too far in some things that he says, though we agree that the passage does not refer to Nero as a persecuting tyrant):

The Seceding view is based, I am fully persuaded, on a misinterpretation of Rom. xiii. 1-7. That passage states that there is “no power but of God.” What does the Seceder say of this? He says, that every power that exists is of God! What does the Covenanter say of it? He says that if a power is not a God-power, it is no power, but a tyranny? …

Let us read the passage in dispute. What sort of a power does Paul describe? Seven things are said about it. (1) It is not a terror to good works. (2) It is a terror to the evil. (3) It praises what is good. (4) It is (or he is) the minister of God for good. (5) It (or he) beareth not the sword in vain. (6) It (or he) is a revenger to execute wrath upon him that doeth evil. (7) Men are to be subject to it (or to him) for conscience sake.

Now, can all this be applied to Nero? Of course, it cannot. Nero was a monstrous butcher, who murdered his own mother and his own wife, and who made flambeaux of the Christians to illuminate his gardens: how could he be the minister of God for good to men? How could Elagabalus, acting the tom-fool the whole day long among his Syrian dancing wenches, be the minister of God for good to men? Ah, no; it may not be, it cannot be, that such a precious gem as Rom. xiii. 1-7, should be allowed to sparkle on the harlot brow of the selfish, cruel, monstrous, Divine Right theory!

But again – how will the notion of Seceders, that the government of Nero was just as much an ordinance of God as was that of David, the man after God’s own heart, agree with other portions of the Divine Word? In Hosea viii. 4, it is stated – “They have set up kings, but not by me: they have made princes, and I knew it not.” In Ezek. xxi. 27, we have the threat – “I will overturn, overturn, overturn it,” &amp;c.; but on the existence theory principle, how can we acquiesce in this decision or turn this prediction into a prayer; for the power to be overturned was, on Seceding principles, as much the ordinance of God as any other power that could be! It is well known that the fox is a cunning and destructive animal; and yet, the Omniscient Redeemer, plainly and bluntly, called Herod “that fox” (Luke xiii. 32). The Apostle Paul calls the Roman magistrates at Corinth, “the unjust;” now, if they were the unjust at Corinth, how could they be the ordinance of God for good to man at Rome?

And once more; are not Christians commanded to wrestle “against the rulers of the darkness of this world, against spiritual wickedness in high places?” Who are “rulers of the darkness of this world?” Evil angels, of course, primarily; but undoubtedly also, wicked rulers who legislate by evil or satanic principles. It is not, therefore, true as Seceders virtually teach, that “whatever is is right,” as regards civil government. No, for we must take unto ourselves the whole armour of God and fight manfully against all devilish principles in high places; and this we are to do, not by swearing to devilish principles, nor by voting for men to swear to support devilish principles; but by taking up a position of manful, peaceable, but determined protest and dissent with regard to all devilish principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the Church, and Terms of Communion: Together with the Terms of Communion of the Reformed Presbyterian Church in Ireland. To which is Appended the Cameronian Dream</cite>, (Belfast, 1879), pp 22-24.</span></figcaption>

<blockquote><p>To the believer in revelation there can be no doubt that a special characteristic of this era of enlargement will be the submission of civil authorities and nations to the yoke of the Redeemer. Kings shall become “the nursing fathers, and their queens the nursing mothers” of the Church. “The kings of Tarshish and of the isles shall bring presents; the kings of Sheba and Seba shall offer gifts. Yea, all kings shall fall down before him; all nations shall serve him.” [Isaiah 49:23; Psalm 72:10-11] It is the duty, as it should be esteemed the privilege of Christians, in every station, to hasten this universal submission to the Lord’s Anointed. Pledged by solemn engagements to the King of Zion, they should employ every effort to bring nations that are enveloped in darkness to receive his truth, and to submit to his authority.

And by holding up to rulers and people in Christian lands their obligation to “kiss the Son,” they should labour that all may render cheerful homage to the religion of Christ; that the truth may be generally known, professed and practised; that when the day of enlargement comes, the whole nation, as a people righteous and keeping the truth, may enter in through the gates of Jerusalem, and receive the blessing that descends upon the heritage of Jacob.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of nations favoured with divine revelation to promote scriptural education: in two discourses</cite>, (Belfast, 1840), p. 7.</span></figcaption>

<blockquote><p>Josiah … did not only restore the religion, but did further destroy all monuments of idolatry which of long time had remained … not only in Judah, but also in Bethel where Jeroboam had erected his idolatry. Yea, he further proceeded and did kill the priests of the high places who were idolaters and had deceived the people; he did kill them, I say, and did burn their bones upon their own altars, and so returned to Jerusalem. This reformation made Josiah, and for the same obtained this testimony of the Holy Ghost, that neither before him neither after him was there any such king who returned to God with his whole soul and with all his strength according to all the law of Moses.

Of which histories it is evident that the reformation of religion in all points, together with the punishment of false teachers, doth appertain to the power of the civil magistrate. For what God required of them, His justice must require of others having the like charge and authority; what He did approve in them, He cannot but approve in all others who with like zeal and sincerity do enterprise to purge the Lord’s temple and sanctuary. What God required to them, it is before declared, to wit, that most diligently they should observe His law, statutes and ceremonies.

[…] And therefore of necessity it is speedily ye provide for reformation or else ye declare yourselves not only void of love towards your subjects, but also to live without care of your own salvation, yea, without all fear and true reverence of God.</p></blockquote>

<blockquote><p>[T]he saints and faithful ministers of Christ will stand up for the prerogatives of Christ, and the privileges of his subjects, upon their utmost peril. Why, the kingdom of God is within them, and therefore they cannot but be zealous for their King, and his prerogatives. Some folk now-a-days are come that length, as to think and say, that these worthies who suffered in the late times of persecution, died as a company of fools, when they would not redeem their lives, by saying, “God save the king.” Would you know what was the matter with them? Why, by the acts of parliament, the prerogative of Zion’s King was taken, and set upon the head of King Charles and King James, and they declared, “In all causes, not only civil, but ecclesiastical, head.” And they could not find freedom in their consciences, to pray that God might save a man in his usurpations upon the prerogatives of Christ the King of Zion, whose kingdom they had within them, especially when they knew the enemy would interpret their praying in these terms, a praying for their prosperity and success in such a wicked way. Sirs, they who now-a-days talk at that rate, know little of true tenderness of conscience, or of true zeal for the glory of Christ, as the alone Head and King of his church.</p></blockquote>

<blockquote><p>III. Nations are bound to provide for the support of religion because they are moral persons.

There are duties peculiar to individuals, and which societies are incapable of performing; but all duties which societies arc capable of performing are as obligatory upon them as upon individuals. It is the duty of individuals to promote the interests of religion by every proper and accessible means. To furnish pecuniary aid is one of the most obvious means of supporting religion. The ordinances of the gospel cannot be maintained without such means; and nations being moral persons are bound to see that such means arc provided. “If all men” says Vattel, “are bound to serve God, the entire nation in her national capacity is doubtless obliged to serve and honor him.” It is unquestionably the duty of individuals to give, and that liberally, for the maintenance of the ordinances of religion; but certainly it is not for the advantage of religion that its support be wholly dependent upon spontaneous individual liberality. This is too uncertain, and often too capriciously furnished to be safely relied on. Hence the necessity of a national supervision to provide means for the regular administration of the ordinances of religion. This national supervision does not interfere with individual obligation. The former from the nature of the case must be a general provision: this leaves ample scope in the best supposable case, for the exercise of individual liberality. An analogous case illustrates this. A general provision is made by law for the support of the poor; but sufficient room is left notwithstanding for the promptings of individual charity, enough still to excite the emotions of human sympathy. So is it in the case of religion, while a general provision is made by a nation for its support there will still remain sufficient opportunity for individual obligation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 285-6.</span></figcaption>

</figure><figure class="quote" id="q-1b22eae083" data-kw="">
<blockquote><p>The nations are under obligation to diffuse abroad the religion of Jesus, by providing for an education of youth founded upon its principles, and co-operating with the church of God in extending the kingdom of Christ. Their wisdom should be tasked in devising and arranging means; their authority exercised in giving them sanction; and their resources expended in giving them support. The rulers of nations should be friendly to Christianity, and endeavour by every means suited to its genius, and with assiduous parental care, to rear this tender celestial plant. This will give dignity to their thrones, stability and energy to their government, and diffuse peace and felicity among their people, and will prove efficiently conservative of all that is good; for literature, arts, science, refinement, and wealth, apart from religion, afford no security against national corruption and ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-symington.html">Andrew Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The headship of Christ over the nations. Being no. vi of a course of lectures on the Second Reformation</cite>, (Paisley, 1841), p. 21.</span></figcaption>

<blockquote><p>Now, if our Covenants, National, and Solemn League, are not now binding upon the nation, it is not because we have not the very same enemy to contend with which our fathers grappled with in former ages. If, then, it is always a Scriptural duty to oppose error, and Popery in particular, the British covenants must, of necessity, be of continued obligation, till Popery shall be no more. But again; as well as Popery, have we not “Prelacy, superstition, heresy, schism, and profaneness,” still to be resisted? It is still a duty to “endeavour the extirpation” of all these evils; and if so, then it must still be a duty to adhere to the Covenants which bind us to this duty! […]

There is no doctrine more clearly revealed in Scripture, than that of descending or continued obligation of public social Covenants. A practical denial of this doctrine must lead to the most disastrous consequences. Deny this doctrine, and the subject not born at the time of the coronation of the prince, may justly rise up in rebellion against his sovereign, and in turn the prince may refuse such a subject his civil rights; the heir may refuse to acknowledge the liabilities of his predecessors, and some stronger man may refuse to acknowledge the rights of the heir; and in one word, national deeds, however important, at once lose all their value in sustaining and regulating national concerns!</p></blockquote>

</figure><figure class="quote" id="q-b30031b09d" data-kw="">
<blockquote><p>Although some of Richard Sibbes’s comments in his book on Josiah’s Reformation lend too much weight to an Erastian position, nevertheless, he accurately distinguishes between the civil magistrate’s lawful authority circa sacra (concerning religious matters) and the church’s authority in sacris (in intrinsically sacred matters):

[A]s a chief right, the ordering of the matters of religion belongs to the care of the prince. But there are two things in religion: first, intrinsecal [sic], within the church, as to preach, administer the sacraments, and ordain ministers. These he ought not to do. But for those things that are without it, these belong to him. If any of those that are placed in church or commonwealth do not their duty, it is fitting for him to correct. He ought to set all a-going without, and to remove abuses, but not to meddle with the things within the church aforesaid, as to execute the same, but to oversee and govern their execution, and those persons whose proper office it is to execute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Josiah’s Reformation. Laid open in four sermons</cite>, (London, 1637) in Works of Richard Sibbes, ed. A. B. Grosart (1862-3; 7 vols, Edinburgh, 1983), vi, 88.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-084421dff6" data-kw="">
<blockquote><p>While we have not disposition to deny that the terms of the text may refer to multitudes of converts coming to Zion, each made righteous through the imputed righteousness of the Redeemer, and by the work of the Spirit on their hearts, each holding in his hand the standard of truth, we cannot but regard the command as referring peculiarly to civil communities in their associated capacity. The “righteous nation which keepeth the truth” has a place of special honour in the future gathering to Shiloh; and while Christians should labour and pray that new converts should be enrolled as citizens in a strong city from every part of the earth, they should take a particular interest in the dedication of national sovereignty to the Redeemer; and as not less connected with the true and permanent prosperity of nations themselves, than with the advancement of the Mediator’s glory, they should fervently desire the approach of the time when “the nations of them that are saved shall walk” in Zion’s light, and “the kings of the earth shall bring their glory and honour” into her.</p></blockquote>

</figure><figure class="quote" id="q-1e1e178510" data-kw="">
<blockquote><p>There was some Priests in it, and some Civil men, and they judged together in the LORD’s Matters; The Matters of the LORD belonged to them, to wit, The Priests. And the Kings Matters belonged to the others: But all was to judge according to the Word of GOD. We shall say this one word more, there is one Great Thing Folk stumbles at in that Paper that Kings ought to Rule or Judge according to the Judicial Law; and that these Laws Kings ought to Rule by, ought to be according to the Word of GOD, And think ye this a Great Wrong? The People of GOD was ruled Two Hundred Years and upwards by this Law only, and can any be fitter to be a Law-Giver than GOD? Have we Laws, have we them from Men or of GOD? If of Men, then they had them from Men or of GOD? Then the GOD of Nature, or the GOD that Created All is far better to Teach Laws than Man that is under GOD. We say stumble not that it is said, the Laws of GOD ought to be the Laws of the Land; For it will never be well with you (especially the Mein of the Land) till the Laws of GOD be the Laws of the Land; Then we will not be fashed [sic] with Great Ones to Oppress: For when they have Laws to make, they never do [any] thing but Oppress the Poor. But when the Law of GOD speaks, it will give Right to the Poor as well as to the Great. So the Law of GOD should be our Law. Where the Law of GOD is received where Christians are; Let Christians go to the Law which GOD has found out; And let Heathens and Turks go to the Law that Nature finds out.</p></blockquote>

</figure><figure class="quote" id="q-06eb791890" data-kw="">
<blockquote><p>No adventitious circumstance can equitably be made a qualification for the enjoyment of political rights. Such for example as property, or the color of a man’s skin! These do not confer upon their possessors either peculiarity of claim or fitness for the exercise of political rights. Property does not make a man either wiser or better: nor does the color of his skin or the shade of his complexion. An aristocracy based on the principle of education and mental superiority would be perfect wisdom in comparison of an aristocracy based on the principle of property or of color! This is so intuitively evident that I am afraid the man who docs not admit it as a first principle in the science of government is not to be convinced by argument, nor reached by any conclusion however legitimately drawn from the principles of equity.

The pretence that property gives its possessor a greater interest in the welfare of a state, and therefore a right to greater weight and influence in the government, is too superficial to satisfy any one, except such as are in possession of the assumed qualification, or those whose prejudices are enlisted already in its favor. […]

It is impossible to establish the equity of imposing taxation upon a citizen, and at the same time deny him the right of elective suffrage; thus subjecting him to the operation of laws which he has no power, directly or indirectly, of making. The fact that a man is to be made the subject of a law, is a sufficient reason on grounds of equity why he should have a voice in making that law; unless he may be disqualified by vice or by incompetence. But keeping out of view such exceptions as are necessary to preserve equity, and secure the objects for which civil society has been instituted, justice requires that every man should have a right to say by what laws he is to be governed, irrespective of any adventitious circumstance. Property furnishes no security to society that political rights will be properly exercised. A poor but virtuous man may take a deeper interest in the welfare of the state than his rich but wicked neighbor; and will most certainly promote its welfare incomparably more.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“No adventitious circumstance can equitably be made a qualification for the enjoyment of political rights. Such for example as property, or the color of a man’s skin! These do not confer upon their possessors either peculiarity of claim or fitness for the exercise of political rights. Property does not make a man either wiser or better: nor does the color of his skin or the shade of his complexion. An aristocracy based on the principle of education and mental superiority would be perfect wisdom in comparison of an aristocracy based on the principle of property or of color! This is so intuitively evident that I am afraid the man who docs not admit it as a first principle in the science of government is not to be convinced by argument, nor reached by any conclusion however legitimately drawn from the principles of equity.

The pretence that property gives its possessor a greater interest in the welfare of a state, and therefore a right to greater weight and influence in the government, is too superficial to satisfy any one, except such as are in possession of the assumed qualification, or those whose prejudices are enlisted already in its favor. […]

It is impossible to establish the equity of imposing taxation upon a citizen, and at the same time deny him the right of elective suffrage; thus subjecting him to the operation of laws which he has no power, directly or indirectly, of making. The fact that a man is to be made the subject of a law, is a sufficient reason on grounds of equity why he should have a voice in making that law; unless he may be disqualified by vice or by incompetence. But keeping out of view such exceptions as are necessary to preserve equity, and secure the objects for which civil society has been instituted, justice requires that every man should have a right to say by what laws he is to be governed, irrespective of any adventitious circumstance. Property furnishes no security to society that political rights will be properly exercised. A poor but virtuous man may take a deeper interest in the welfare of the state than his rich but wicked neighbor; and will most certainly promote its welfare incomparably more.”

<blockquote><p>James Renwick Willson was one of the finest Covenanter theologians in the nineteenth-century; his works should be more widely read today, and thankfully Crown and Covenant have republished some of his political writings in an edited collection entitled, Political Danger. Here is what he has to say about the Christian’s attitude to paying taxation for godly purposes:

The payment of tribute and custom. “Pay ye tribute also.” “Render to all their dues, tribute to whom tribute – custom to whom custom.” Those who are employed in attending to the general interests of the commonwealth are necessarily prevented from making efforts in the ordinary way, to provide for their temporal wants, and those of their families. The public is bound on principles of common honesty to make comfortable provision for their sustenance. National defences, internal improvements, the diffusion of knowledge, and other important public objects, cannot be effected without the payment of tribute and custom. The happiness and security of all are promoted by them, and all are bound to contribute their just proportion towards them. The principle upon which the payment is to be made ascends much higher. The former principle binds to pay for services rendered even by those who may not be recognized as the vicegerents of God. But the payment of dues to the powers mentioned by Paul, is ascribed to the fact that “they are God’s ministers attending continually upon this very thing.” What is the very thing on which they attend continually? Not the receiving of tribute and custom, but the execution of the laws of God, in the exercise of their official functions. For they are God’s ministers, attending continually to their ministry, for God’s glory and the interests of the nation. Their whole time is occupied in the service of God, as public functionaries, that he has appointed; and therefore the tribute and custom are given to God, as a demand which he makes on the behalf of those public and honourable servants, who serve not their own evil passions, by deeds of iniquity, who serve not the cause of idolatry, or vice; but serve God continually. Wherever powers, thus ordained, are found in the continual service of God as accountable to him; custom and tribute are their due, and he who withholds, when he can give, withholds not merely from man, but from God his due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-r-willson.html">J. R. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon on civil government, preached at Coldenham,</cite>, Feb. 11, 1821 (Paisley, 1821), pp 23-4.</span></figcaption>

<blockquote><p>In the midst of a debate at the 1833 Reformed Presbyterian Synod, Thomas Houston argued that the Mosaic judicials advocating the punishment of heretics were still applicable today. This did not mean that every heretic should automatically be put to death. As I understand it the ultimate sanction is only to be used in extreme and incorrigible cases of heresy, and thus in Houston’s writings he is careful not to argue that all heretics should be slain. In the Old Testament itself, judging by the examples of the reforming kings in Israel, it appears that lesser means were used to purge heresy and false worship before death was inflicted. It is worth keeping in mind that the Westminster Confession does not specify what penalties are maximum or mandatory, thus the question is extra-confessional and not a test of orthodoxy (incidentally, there is wide diversity among modern theonomists on these issues). Nevertheless, he did believe that the penal laws of common equity were obligatory today and that these demanded the suppression of heresy:

[I]n the Westminster Confession, ch. xxiii. art. 3, it is declared that the Civil Magistrate hath authority, and it is his duty to take order that unity and peace be preserved in the Church, &amp;c. and that all blasphemies and heresies be suppressed, &amp;c. That the compilers of the Confession intended that the Christian Magistrate should suppress heresy and idolatry by his official power, as direct offences against the Supreme Governor of the nation, and not merely under the notion of crime being associated with faction or rebellion against the State, is evident, first, from the Scripture passages which they adduce in proof, such as Ezra vii. 23; Levit. xxiv. 10; Deut. xiii. 5, &amp;c; 2 Chron. xxxiv. 33, &amp;c. These clearly show that our fathers regarded the judicial laws respecting the punishment of heresy and idolatry still obligatory under the New Testament, with the exception, which they specify in another article, viz. so far as the general equity thereof may require; and, likewise, that the conduct of the Jewish Magistrate in punishing heresy and idolatry is to be imitated by Christian Rulers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 23 July 1833.</span></figcaption>

<blockquote><p>[T]he special statute designed to prevent this crime, “He that stealeth a man and selleth him, or if he be found in his hand, he shall surely be put to death,” forever brands with the stamp of God’s reprobation and curse American slavery, and rendered the practice of such an iniquity in the Jewish Commonwealth impossible. The law does not read, he that stealeth a slave and selleth him, nor he that stealeth a servant even, and selleth him, but he that stealeth a man. It was the crime of stealing a man from himself, of removing him from a condition of freedom to a condition of bondage, as our slaves were stolen in the first instance from Africa, against which this law was directed; the very grossest outrage that can be perpetrated on humanity, a crime in God’s sight of the deepest dye, and therefore adjudged worthy of the severest punishment known to the divine law, namely, death.

Dare Mr. Van Dyke deny this? So have said all the churches; – his own included, in its testimony of 1801 – previous to its enlightenment and sanctification by the price of cotton, sugar, and tobacco! So have all the civilized nations of the world agreed, by declaring the foreign slave-trade murder and piracy, words all too mild to express the enormity of its guilt. There was no such crime as slave-stealing known in Israel, for the simple reason that there were no slaves to steal. However criminal helping a man to freedom may be, it is not forbidden in the divine word; on the contrary … it is highly commended. But the crime of man-stealing was known in the heathen nations round about Israel; and against the practice of such enormity, God guarded his chosen people by the fiery sword of this express and unqualified enactment. Can any man deny that American slavery originated in man-stealing? If so, does it not stand condemned and cursed in its very root, by the law of that God whose judgment is according to truth? Moreover, as if the Spirit designed to anticipate all subterfuges, it is added, “and if he be found in his hand, he shall surely be put to death.” Had it been made for our system, and designed to meet the argument with which it is attempted to be supported, it could not have been more specific.

How many transfers then, I ask, in the name of all that is sacred, does it require to transform this vice into a virtue? – this crime, against which the judgments of Heaven are denounced, into a grand missionary enterprise, and its practice into the highest exercise of a heavenly beneficence and piety? …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-r-w-sloane.html">J. R. W. Sloane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Rev. Henry J. Van Dyke’s discourse on “The character and influence of abolitionism,” a sermon preached in the Third Reformed Presbyterian Church, Twenty-Third Street, New York, on Sabbath evening, December 23, 1860</cite>, (New York, 1861), pp 10-11. Available from here.</span></figcaption>

— J. R. W. Sloane, Review of Rev. Henry J. Van Dyke’s discourse on “The character and influence of abolitionism,” a sermon preached in the Third Reformed Presbyterian Church, Twenty-Third Street, New York, on Sabbath evening, December 23, 1860, (New York, 1861), pp 10-11. Available from here.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BT%5Dhe+special+statute+designed+to+prevent+this+crime%2C+%E2%80%9CHe+that+stealeth+a+man+and+selleth+him%2C+or+if+he+be+found+in+his+hand%2C+he+shall+surely+be+put+to+death%2C%E2%80%9D+forever+brands+with+the+stamp+of+God%E2%80%99s+reprobation+and+curse+American+slavery%2C+and+rendered+the+practice+of+such+an+iniquity+in+the+Jewish+Commonwealth+impossible.+The+law+does+not+read%2C+he+that+stealeth+a+slave+and+selleth+him%2C+nor+he+that+stealeth+a+servant+even%2C+and+selleth+him%2C+but+he+that+stealeth+a+man.+It+was+the+crime+of+stealing+a+man+from+himself%2C+of+removing+him+from+a+condition+of+freedom+to+a+condition+of+bondage%2C+as+our+slaves+were+stolen+in+the+first+instance+from+Africa%2C+against+which+this+law+was+directed%3B+the+very+grossest+outrage+that+can+be+perpetrated+on+humanity%2C+a+crime+in+God%E2%80%99s+sight+of+the+deepest+dye%2C+and+therefore+adjudged+worthy+of+the+severest+punishment+known+to+the+divine+law%2C+namely%2C+death.%0A%0ADare+Mr.+Van+Dyke+deny+this%3F+So+have+said+all+the+churches%3B+%E2%80%93+his+own+included%2C+in+its+testimony+of+1801+%E2%80%93+previous+to+its+enlightenment+and+sanctification+by+the+price+of+cotton%2C+sugar%2C+and+tobacco%21+So+have+all+the+civilized+nations+of+the+world+agreed%2C+by+declaring+the+foreign+slave-trade+murder+and+piracy%2C+words+all+too+mild+to+express+the+enormity+of+its+guilt.+There+was+no+such+crime+as+slave-stealing+known+in+Israel%2C+for+the+simple+reason+that+there+were+no+slaves+to+steal.+However+criminal+helping+a+man+to+freedom+may+be%2C+it+is+not+forbidden+in+the+divine+word%3B+on+the+contrary+%E2%80%A6+it+is+highly+commended. </figure><figure class="quote" id="q-47c8764617" data-kw="">
<blockquote><p>Only this I say, that to open a wide door, and to grant an unbounded liberty unto all sorts of heretics and sectaries … is inconsistent with the Solemn League and Covenant of the three kingdoms, by which we are obliged to endeavour the extirpation of Popery, Prelacy, superstition, heresy, and schism; lest we partake in other men’s sins, and thereby be in danger to receive of their plagues; so it is, in the own nature of it, an error so pernicious, so abominable, so monstrous, that it makes all learned men to stand amazed, and taken with horror, in so much that they cannot at first gather their thoughts to put pen to paper against it. I know this liberty and toleration was maintained by the Donatists of old, and by the Socinians, Arminians, and Anabaptists of late; but it has been constantly opposed by all that were sound and orthodox, both ancient and modern, who have asserted the lawful use of a coercive power against those things, whereby (though under pretence of conscience) God is openly dishonoured, souls ensared and destroyed, faith and piety subverted and overthrown; and further, the compelling of the outward man, though not to the practice of things indifferent (which compulsion I do not allow), yet to the practice of necessary duties, and the external means and ordinances, by which through the blessing of God, men’s hearts and consciences may be savingly affected and wrought upon. And I beseech you what else means Asa’s covenant: That whosoever would not seek the Lord God of Israel should be put to death, whether small or great, whether man or woman. And what else means Josiah’s covenant, whereof it is said, He caused all that were present in Jerusalem and Benjamin to stand to it. And what else is that in Ezra, that whosoever would not come to Jerusalem to make a covenant, and to put away strange wives, all his substance should be forfeited, and himself separated from the congregation of those that had been carried away, that is, excommunicated. And what else is that other act of Josiah in putting down the priests of the high places. And what say you to the stoning those who did entice the people to turn out of the way wherein the Lord commanded them to walk, saying, Let us go after other Gods to serve them?</p></blockquote>

<blockquote><p>Writing to Thomas Houston of the Reformed Presbyterian Church of Ireland in 1847, the Revd David Scott and another American Covenanter bemoaned the fact that so many churches compromised by not disciplining slaveholders or testifying against a proslavery constitution:

Rev. and Dear Sir,

[…] In regard to the state of things around us […] the disregard of the rights of man by the larger denominations in this country, none of which maintains a faithful testimony against the sin of slaveholding, or puts any restraint upon their members voting under a slaveholding Constitution, and most of which admit without question slave holders to the enjoyment of church privileges […] Others are not so discouraged but are assured that our cause will ultimately triumph.

[We are not] entirely devoid of encouragement in the condition of things around us. The evils of the Constitution, particularly as a pro-slaveholding instrument, are becoming more and more manifest […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-newell-and-david-scott.html">J. Newell and David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Thomas Houston, Allegheny, 2 June 1847 (Reformed Presbyterian Historical Library, Knockbracken, American correspondence, no. 14)</cite></span></figcaption>

</figure><figure class="quote" id="q-760683f9b2" data-kw="">
<blockquote><p>I will be thy king” supposes more than this: ye shall have no other king besides Me. I will tell you, the most part of the land cry out, We will have no other king but Caesar – no other king but king Charles. But we must cry we will have no other king but Christ. What is that? Say ye, Are ye all against monarchy and civil Government? We are much taken up with that, if God let pure government be established, that is most for the good and advantage of civil and ecclesiastical society. But we set up kings and princes, but not by Him. If you would have Him be for you ye must cut off this king, and these princes, and make able men be your rulers, endued with suitable qualifications both of body and mind, that may employ their power for the cause and interest of God. […] Our Lord will set up other magistrates according to His promise: “And kings shall be thy nursing fathers, and queens thy nursing mothers.” And who knows but God will make out that yet? “And their nobles shall be of themselves, and their governor shall proceed from the midst of them.” Indeed by governor we principally understand our Lord Jesus Christ. But when He turns back the captivity of His Church and people, none shall be governors but such as shall be for Him, at least by profession.</p></blockquote>

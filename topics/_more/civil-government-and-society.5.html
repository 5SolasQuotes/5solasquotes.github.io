<blockquote><p>Now for the good election of magistrates, the Lord himself declareth whom and what kind of men he will have to be chosen, in these very words: “Look over all the people, consider them diligently, and choose from among them men of courage, such as fear God, speakers of truth, and haters of covetousness, and make them rulers over thousands, rulers of hundreds, rulers of fifties, and rulers of tens, to judge the people at all seasons.” [Exodus 18:21] Four things the Lord requireth in a good governor. First, that he be a man of courage, of strength or force, that is, which hath ability to do the thing whereunto he is appointed. That ability consisteth in mind rather than in body. For it is required, that he be not a fool, but wise and skilful in that which he hath to do […]

In the second place that is set down, which indeed is the first; let him fear God, let him be religious, and not superstitious. No idolater preserveth the commonweal, but rather destroyeth it; and a wicked man defendeth not truth and true religion, but persecuteth and driveth them out of his jurisdiction. Let this magistrate of ours therefore be of the right religion, sound in faith, believing the word of God, and knowing that God is present among men and doth repay to whom he list according to their deserts. And for that cause Justinian, the emperor, in Novellis Constitutionib. 109, doth freely confess that all his help is of God; and that therefore it is convenient, that the making of all laws should depend upon him alone. […] And where the princes are God’s friends, and have often conference with God, there is hope that those commonwealths shall prosper and flourish. But, on the other side, there must needs be feared an unhappy end of that commonweal, where the enemies of God have the pre-eminence. Thirdly, there is required of him, which must be chosen and called to be magistrate, that he be true in word and deed, so that he be not found to be an hypocrite, a liar, a deceiver, a turncoat, nor one which out of one mouth doth blow both hot and cold; but faithful, simple, a plain dealer, and blameless. […]

Covetousness and greedy desire of bribes are the very plagues that choke good magistrates. By covetous men and takers of bribes law, judgment, liberty, justice, and the country itself, is set to sale and sold to the devil for money. And now, though in this place the Lord hath named only the most pestilent mischief of all other, yet there is no doubt but that he doth inclusively debar all other vices and evils of that sort, commanding them to be strange and far off from the good magistrate and godly governor. Those vices are pride, envy, anger, dicing, surfeiting, drunkenness, whoredom, adultery, and whatsoever else is like to these.

This place is made more manifest by conferring it with other places in the law of God. Moses, in Deuteronomy, saith to the people: “Bring men of wisdom, of understanding, and of an honest life, according to your tribes.” [Deuteronomy 1:13] Three things here again doth the wise man, Moses, require in them that are to be appointed magistrates in his commonweal. First, saith he, let them be wise. But the beginning of wisdom is the fear of the Lord. Let them therefore be ordained as magistrates, that are friends to God and true religion; let them be wise, and not foolish idiots. Secondarily, they must be men of understanding; that is, men of experience, who by long and continual exercise in handling of matters are able at the first brunt to deal in all cases according to the law. Lastly, they must be men of honest report, whose life and sound conversation are by their deeds perfectly tried and sufficiently witnessed of unto the people: and finally, they must be such as bear authority, and not be despised as rascal and vile knaves.</p></blockquote>

<blockquote><p>It is not enough that you abstain from violent wrong and oppression which ungodly men exercise against their subjects, but ye are further bound, to wit, that ye rule above them for their wealth. Which ye cannot do if that ye, either by negligence not providing true pastors, or yet by your maintenance of such as be ravening wolves, suffer their souls to starve and perish for lack of true food which is Christ’s Evangel sincerely preached. […] And therefore I fear not to affirm that which God shall one day justify: that by your offices ye be bound not only to repress their tyranny, but also to punish them as thieves and murderers, as idolaters and blasphemers of God, and in their rooms ye are bound to place true preachers of Christ’s Evangel for the instruction, comfort and salvation of your subjects, above whom else shall never the Holy Ghost acknowledge that you rule in justice for their profit.</p></blockquote>

<blockquote><p>In this three-part series, we shall endeavour to demonstrate that the early Covenanter, Donald Cargill, believed that the penal sanctions of the Mosaic judicial law were (generally speaking) still a rule for the civil magistrate to follow in the New Testament. Since Cargill was one of the strictest Covenanters, it is crucial that those of us in the Cameronian Covenanter tradition take heed to his opinions in order to properly comprehend the historic Reformed Presbyterian position on the moral-judicial laws.

Before looking at his more theoretical writings, we will begin by considering a practical example of Cargill’s theonomic approach to the penal sanctions. When issuing his writ of excommunication in September 1680 against Sir George “Bloody” Mackenzie, Cargill mentioned Mackenzie’s failure to be theonomic in punishing criminals as a reason for casting him out of the church:

Next, I do, by virtue of the same authority, and in the same name, excommunicate, cast out of the true Church, and deliver up to Satan, Sir George Mackenzie, the king’s advocate; for his apostacy, In turning into a profligateness of conversation, after he had begun a profession of holiness: for his constant pleading against, and persecuting to death, the people of God, and alleging and laying to their charge, things, which in his conscience he knew to be against the Word of God, truth, reason, and the ancient laws of this kingdom: and his pleading for sorcerers, murderers, and other criminals, that before God, and by the laws of the land, ought to die; for his ungodly, erroneous, phantastic and blasphemous tenets, printed to the world in his pamphlets and pasquils.[1]

The meaning of this quotation is so obvious that analysis is almost redundant. Cargill maintained that murderers, sorcerers and other criminals ought to have been executed, because the laws of God and of Scotland demand that they be slain. To plead for the pardon of such criminals was to partake of their sin, and was even considered by Cargill to be an excommunicable offence. Hence we also learn that a belief in the abiding validity of biblical penal sanctions was regarded by Cargill and other like-minded Covenanters as a term of ecclesiastical communion. From this we ascertain that in order to be regarded as a member of good standing in the covenanting church, it was necessary that one recognised that the penal sanctions of God’s law were still applicable – especially if one was himself a civil ruler.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/donald-cargill.html">Donald Cargill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Torwood excommunication in James Kerr (ed.), The covenants and the Covenanters: covenants, sermons, and documents of the Covenanted Reformation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

The meaning of this quotation is so obvious that analysis is almost redundant. Cargill maintained that murderers, sorcerers and other criminals ought to have been executed, because the laws of God and of Scotland demand that they be slain. To plead for the pardon of such criminals was to partake of their sin, and was even considered by Cargill to be an excommunicable offence. Hence we also learn that a belief in the abiding validity of biblical penal sanctions was regarded by Cargill and other like-minded Covenanters as a term of ecclesiastical communion. From this we ascertain that in order to be regarded as a member of good standing in the covenanting church, it was necessary that one recognised that the penal sanctions of God’s law were still applicable – especially if one was himself a civil ruler.”

orld+in+his+pamphlets+and+pasquils.%5B1%5D%0A%0AThe+meaning+of+this+quotation+is+so+obvious+that+analysis+is+almost+redundant.+Cargill+maintained+that+murderers%2C+sorcerers+and+other+criminals+ought+to+have+been+executed%2C+because+the+laws+of+God+and+of+Scotland+demand+that+they+be+slain.+To+plead+for+the+pardon+of+such+criminals+was+to+partake+of+their+sin%2C+and+was+even+considered+by+Cargill+to+be+an+excommunicable+offence.+Hence+we+also+learn+that+a+belief+in+the+abiding+validity+of+biblical+penal+sanctions+was+regarded+by+Cargill+and+other+like-minded+Covenanters+as+a+term+of+ecclesiastical+communion.+From+this+we+ascertain+that+in+order+to+be+regarded+as+a+member+of+good+standing+in+the+covenanting+church%2C+it+was+necessary+that+one+recognised+that+the+penal+sanctions+of+God%E2%80%99s+law+were+still+applicable+%E2%80%93+especially+if+one+was+himself+a+civil+ruler.%E2%80%9D%0A%0A%E2%80%94+Donald+Cargill%2C+The+Torwood+excommunication+in+James+Kerr+%28ed.%29%2C+The+covenants+and+the+Covenanters%3A+covenants%2C+sermons%2C+and+documents+of+the+Covenanted+Reformation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb8b49a6c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb8b49a6c5.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/03/15/donald-cargill-on-the-scottish-covenanters-and-the-judicial-law-1/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Free Church of Scotland minister, Dr Thomas Guthrie, said the following about Northern and British guilt in Southern slavery:

Abuse the South as men may, I say that in some respects the North is the guiltier of the two. They know the truth, they had the truth, they were free, and they ought to have more sympathy with the cause of freedom than men bred up in the South with slavery; and, for my part, I sometimes think there are six of the one and half-a-dozen of the other. I don’t say that our own country is without blame in the matter, and I should not be surprised that we suffer some share of the judgment. Our merchants and manufacturers were long guilty of neglecting to raise cotton in our own colonies, and thereby to cut the foundation out below slavery. But just look at New York – look at its merchants. It is a notorious fact that the merchants of New York, by the reverence which they pay to the dollar, have been the mainstay of slavery in the South. It is New York dollars that have built every slave ship, and it is by New York merchants that every ship is owned that carries on that infamous traffic. And look to the pulpits of the North – look to their preachers and their ministers. They have employed their pens and prostituted their pulpits in defending this atrocious system.</p></blockquote>

<blockquote><p>Though the Jewish Church and commonwealth were for the most part not different materially, the same men being members of both, even as in all Christian republics; yet they were formally different from one another in regard of distinct acts, laws, courts, officers, censures, and administrations. For, 1. The ceremonial law was given to them as a Church, the judicial law given to them as a State.

2. They did not worship, do sacrifice, pray, praise, etc. as a State; nor did they kill malefactors with the sword as a Church.

3. As the Lord’s matters and the King’s matters were distinguished, so there were two different courts for judging of the one and the other (2 Chron. 19:8, 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A late dialogue between a civilian and a divine</cite>, (London, 1644) in The anonymous writings of George Gillespie, ed. Chris Coldwell (Dallas TX, 2008), pp 122-3.</span></figcaption>

</figure><figure class="quote" id="q-1be73ac50d" data-kw="">
<blockquote><p>That this is also your principal care, most watchful fathers of your country, your zeal and piety do not suffer us to doubt. For indeed you have remembered that dominion is strengthened by piety and righteousness according to the oracle of the wisest of kings; and that your rule never could be happy and well ordered unless you took care that by the word of God, his authority should always avail with you and that Christ himself should reign through you. You have remembered that here might be not so much an aristocracy as a theocracy, having God always for its president and ruler; and that the safety of the republic, which should always be the supreme law, could not be better consulted than by defending those two impregnable ramparts – the culture of pure religion and the pious care of nurturing the church, which God has committed to the protection of your wings […] as long as you will take care that among your citizens piety and justice, the love of religion and country, love and the holy concord of souls shall flourish, and vices (too many in this most corrupt age even in the growing church) be severely repressed; as long as by our zeal this city shall truly correspond to her name “Reformed,” as much with respect to integrity of morals as to purity of doctrine […]</p></blockquote>

ovenanter.wordpress.com/2012/02/18/francis-turretin-on-reformed-theocracy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-0b38dacc62" data-kw="">
<blockquote><p>This may possibly be also a new encouragement to your Majesty, who is already engaged in the work of restoring the kingdom of Christ, and to many who live under your government to further the same work. Your kingdom is extensive and renowned, and abounds in many excellencies; Christ as its chief ruler and governor, so that it may be defended by his safeguarded and protection; for to submit your sceptre to him, is not inconsistent with that elevation in which you are placed; but it would be far more glorious than all the triumphs of the world. For since among men gratitude is deemed the proper virtue of a great and exalted mind, what in kings can be more unbecoming than to be ungrateful to the Son, by whom they have been raised to the highest degree of honour? It is, therefore, not only an honourable, but more than a royal service, which raises us to the rank of angels, when the throne of Christ is erected among us, so that his celestial voice becomes the only rule for living and dying both to the highest and to the lowest. For though at this day to obey the authority of Christ is the common profession, made almost by all, yet there are very few who render this obedience of which they boast.

Now this obedience cannot be rendered, except the whole of religion be formed according to the infallible rule of his holy truth. But on this point strange conflicts arise, while men, not only inflated with pride, but also bewitched by monstrous madness, pay less regard to his unchangeable oracles of our heavenly Master than to their own vain fictions […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p. 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, pp xx-xxi.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-7b302f7ffd" data-kw="">
<blockquote><p>Either those laws which God gave to Moses, respecting the punishment of crimes, are in force, or God has left the civil magistrate without any rule for the administration of justice. This last hypothesis may do very well for an infidel; but certainly not for those who know that civil government is the ordinance of God for good. Rom. xiii. 1. We can hardly suppose that God would institute an ordinance, and leave us without any rule for its administration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1847, p. 165</span></figcaption>

</figure><figure class="quote" id="q-aa4a131f4c" data-kw="">
<blockquote><p>How is the religion and morality of a city or district to be maintained? Only by the godly teaching and example of godly teaching and ruling ecclesiastical officers. How is the religion and morality of a nation to be promoted and sustained? Only by the godly example and godly laws of godly civil rulers. What a terrible farce it is, as regards national morality, when the voice of the gospel minister is actually drowned by the fearful hell-filling screech of the whistle and the luggage train; and when, as soon as the congregation is dismissed – just after the minister has prayed, “Thy kingdom come. Thy will be done in earth, as it is in heaven” – their attention is attracted by the Sabbath-breaking pleasure-seekers who glide along on the tramway car. There may be exceptions, and there have been exceptions, as in the case of Scotland; yet, I think it will hold true, as a rule, that we may not look for the general Christianizing of the people but through the medium of a government themselves Christian.

This truth is taught two ways in the Bible; first, historically, by what we read of the influence which the personal character of the Jewish monarchs had on the moral and religious state of their subjects; and it is taught prophetically in the Book of Revelation, where we are taught that the kingdoms of this world shall become the kingdoms of our Lord Jesus Christ, chiefly through the conversion of Kings and Rulers – for it cannot be disputed that the Greek word Basileiai, denotes the “governing powers.” Suppose there were a John Knox in every pulpit of the land, what great good could be done nationally, so long as rulers resisted and thwarted all their teaching, by their unholy lives and their wicked legislation?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), pp 21-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>
<div class="actions"><button class="copy" data-copy="“How is the religion and morality of a city or district to be maintained? Only by the godly teaching and example of godly teaching and ruling ecclesiastical officers. How is the religion and morality of a nation to be promoted and sustained? Only by the godly example and godly laws of godly civil rulers. What a terrible farce it is, as regards national morality, when the voice of the gospel minister is actually drowned by the fearful hell-filling screech of the whistle and the luggage train; and when, as soon as the congregation is dismissed – just after the minister has prayed, “Thy kingdom come. Thy will be done in earth, as it is in heaven” – their attention is attracted by the Sabbath-breaking pleasure-seekers who glide along on the tramway car. There may be exceptions, and there have been exceptions, as in the case of Scotland; yet, I think it will hold true, as a rule, that we may not look for the general Christianizing of the people but through the medium of a government themselves Christian.

This truth is taught two ways in the Bible; first, historically, by what we read of the influence which the personal character of the Jewish monarchs had on the moral and religious state of their subjects; and it is taught prophetically in the Book of Revelation, where we are taught that the kingdoms of this world shall become the kingdoms of our Lord Jesus Christ, chiefly through the conversion of Kings and Rulers – for it cannot be disputed that the Greek word Basileiai, denotes the “governing powers.” Suppose there were a John Knox in every pulpit of the land, what great good could be done nationally, so long as rulers resisted and thwarted all their teaching, by their unholy lives and their wicked legislation?”

— Samuel Simms, The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream, (Belfast, 1879), pp 21-2.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHow+is+the+religion+and+morality+of+a+city+or+district+to+be+maintained%3F+Only+by+the+godly+teaching+and+example+of+godly+teaching+and+ruling+ecclesiastical+officers.+How+is+the+religion+and+morality+of+a+nation+to+be+promoted+and+sustained%3F+Only+by+the+godly+example+and+godly+laws+of+godly+civil+rulers.+What+a+terrible+farce+it+is%2C+as+regards+national+morality%2C+when+the+voice+of+the+gospel+minister+is+actually+drowned+by+the+fearful+hell-filling+screech+of+the+whistle+and+the+luggage+train%3B+and+when%2C+as+soon+as+the+congregation+is+dismissed+%E2%80%93+just+after+the+minister+has+prayed%2C+%E2%80%9CThy+kingdom+come.+Thy+will+be+done+in+earth%2C+as+it+is+in+heaven%E2%80%9D+%E2%80%93+their+attention+is+attracted+by+the+Sabbath-breaking+pleasure-seekers+who+glide+along+on+the+tramway+car.+There+may+be+exceptions%2C+and+there+have+been+exceptions%2C+as+in+the+case+of+Scotland%3B+yet%2C+I+think+it+will+hold+true%2C+as+a+rule%2C+that+we+may+not+look+for+the+general+Christianizing+of+the+people+but+through+the+medium+of+a+government+themselves+Christian.%0A%0AThis+truth+is+taught+two+ways+in+the+Bible%3B+first%2C+historically%2C+by+what+we+read+of+the+influence+which+the+personal+character+of+the+Jewish+monarchs+had+on+the+moral+and+religious+state+of+their+subjects%3B+and+it+is+taught+prophetically+in+the+Book+of+Revelation%2C+where+we+are+taught+that+the+kingdoms+of+this+world+shall+become+the+kingdoms+of+our+Lord+Jesus+Christ%2C+chiefly+through+the+conversion+of+Kings+and+Rulers+%E2%80%93+for+it+cannot+be+disputed+that+the+Greek+word+Basileiai%2C+denotes+the+%E2%80%9Cgoverning+powers.%E2%80%9D+Suppose+there+were+a+John+Knox+in+every+pulpit+of+the+land%2C+what+great+good+could+be+done+nationally%2C+so+long+as+rulers+resisted+and+thwarted+all+their+teaching%2C+by+their+unholy+lives+and+their+wicked+legislation%3F%E2%80%9D%0A%0A%E2%80%94+Samuel+Simms%2C+The+Bible%2C+the+church%2C+and+terms+of+communion%3A+together+with+the+terms+of+communion+of+the+Reformed+Presbyterian+Church+in+Ireland.+To+which+is+appended+the+Cameronian+Dream%2C+%28Belfast%2C+1879%29%2C+pp+21-2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faa4a131f4c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/aa4a131f4c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/02/10/samuel-simms-on-the-importance-of-godly-rulers-to-national-reform/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>[I]t is a principal function of kings and of governors to search and explore what function of life has been designed by God for each citizen, and to take care that each one is initiated, prepared, and helped toward this end from childhood, so certainly the same persons ought to exercise utmost interest and a primary concern among their subjects, and, wherever possible, to seek and find those whom the Lord seems to have appointed to this supremely salutary work, necessary before all others, of preaching the gospel. So Paul glories that he had been “separated for this work from his mother’s womb” (Gal. 1:15). They should take care that such of these as they can discover be initiated and trained from childhood for this most holy office, and that those who have been duly tested and proved be used in their good time for this function. This is certainly necessary before all things else, to be realized with utmost zeal by all kings and princes of the people of God who pray from their hearts, “Thy Kingdom come” (Matt. 6:10).</p></blockquote>

<blockquote><p>The Westminster divine, Stephen Marshall, helpfully distinguishes between what a civil magistrate may and may not do in coercing his subjects to support true religion. He argues that while the magistrate cannot convert anyone with the sword, nevertheless, he can compel his subjects to attend public worship:

Nor do I find a warrant for Magistrates to compel any to profession of truth, Psal. 110. His people a willing people. To Order what men shall believe, is to exercise Dominion over men’s Consciences: It is One thing to cause the people to attend the means, and another to make them believe the truth, the first they must do, but not the second: Faith is God’s gift. It is one thing to hinder Idolatry and blasphemy spreading, another thing to make people renounce an opinion, and embrace the truth. …

They may Command and Order the people to come and attend upon the Ministry of the Word, as the means instituted by Christ for their instruction to salvation. It is one thing to order them what they shall believe, another thing to order them to wait upon the means. All grant the civil Magistrate may call public Assemblies, to hear their Proclamations, and Statutes, &amp;c. read: if they may call a whole Town to hear a Law, then much more may they call them to hear God’s Laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The power of the magistrate in matters of religion, vindicated. The extent of his power determined. In a sermon preached before parliament on a monthly fast day</cite>, (London, 1657), pp 5, 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Then Thirdly, In the third Article of our Solemn League and Covenant, we are bound to stand fast in the Defence, and to maintain the Liberties of the Church, and Privileges of the Kingdom, as We are Men and Christians. We have observed this, that some will plead on this Article of the Covenant for owning a Popish King: But O! is there not an express Condition and Qualification there, that we shall own no Magistrates over us, but in subordination to the Law of GOD, and those who will give us security for our Religion and Liberty: And have we not the Laws of GOD against Tyranny, and also the Laws of the Land, which we are bound to maintain every Soul of us; and now we do subscribe ourselves Breakers of it, when we own a Papist. Now have we performed this? Ay, ay, it may be some Ministers and Professors will say they have; but if we have done it, then what meaneth the bleating of the sheep, and lowing of the oxen? What meaneth the lowing of the Bulls of Bashan? What meant the Wicked walking on every side? And what means the Bloodshed?

All these things do Witness against us, if We have keeped this Article in refusing to set up Magistrates over us without security given for our Religion and Liberty: Neither was it Required of him, now when he is set up, and hath Arrogate to himself an absolute power; by virtue whereof he hath stopped and disabled all our Penal statutes made against Idolaters: and is intending to [Rob] us of all Privileges and Liberties, as we are Men and Christians. And if we have maintained and Defended our Privileges as we are Men and Christians, then what meaneth the great Oppression both of Bodies and Consciences in the Land? What meaneth the [Crushing] of many poor people under heavy Burdens and great Bondage. Nay, we are obliged to cut off Idolaters: The Idolater should be put to Death, according to the Law of GOD; and those Penal statutes in the Old Testament are not abrogated yet, for they are Moral.

Fourthly, In the Fourth Article of the solemn League and Covenant, we are bound to bring the Malignant Enemies of GOD to Condign punishment. By the Law of GOD Idolaters should die the Death; and Murderers should Die the Death; that the Land should not be defiled with Blood: Well have we done this? ay, ay, Ministers and Professors will say they have done it: But if we have performed this, then what meaneth the bleating of the sheep, and lowing of the Oxen? if we have Endeavoured to bring the Enemies of GOD to condign Punishment: Then what means the setting them up in places of Power and Trust, and instead of bringing Idolaters and Murderers to punishment, We have set them up Confederate with them, and taken Protection from them, and instead of bringing them to punishment, we have maintained them:

For what’s your Cess but a Grassing of Antichrist’s Bulls to push and destroy the LORDs people. The Devil has so many Oxen to Feed, and he Requires you to Feed them, that they may tread down the Work of GOD: and where is there any that stands up and justifies themselves? O is that a keeping of the Covenant, to maintain its Destroyers? And is that a bringing of these Enemies, Idolaters and Murderers to punishment, to Feed them, and Confederate with them? O ye have made thereby an unhappy Conjunction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some notes or heads of a preface preached at Distinckorn- Hill, in the Parish of Gaastoun, by Mr. Alexander Shields, preacher of the gospel, 25 April, 1688</cite>, (n.p., 1688), p. 19.</span></figcaption>

<blockquote><p>Since both heretics and schismatics are harmful to the welfare of the church, many of the earlier Reformed divines believed that both should be restrained by the civil ruler if he was to fulfil his role as a nursing father to the church. The Westminster divine, Daniel Featley, explains the rationale behind such thinking:

[T]here will be use of an arming sword, not of War, but of Justice, to cut off Superstition and Idolatry on the one side, and Profaneness and Sacrilege on the other: Heretics with one edge, and Schismatics with the other. For as in the beginning of the Reformation, so now in the endeavoured perfection thereof, the moral enemy of our immortal souls sets on work all sorts of Heretics and Schismatics to hinder, disturb, and (if it were possible) destroy this excellent work. The Heretics he employeth to pervert the Catholic doctrine, the Schismatics to subvert the Apostolic discipline of the Church: the Heretics endeavour to shake the foundations, the Schismatics to make breaches in the walls: the Heretics to rot the main timber, the Schismatics to pull in sunder the rafters of this sacred structure.</p></blockquote>

t="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>No more baseless fantasy ever entered the mind of man than that the Church and State can be completely separate! […] In good sooth, I can look upon it as little less than a species of infatuation, to teach that Church and State must be entirely separated – because, if the Church cannot reform and Christianize the State, then, undoubtedly, the State will tyrannise over and persecute the Church! Does the British Constitution let the United Secession Church alone? Indeed it does no such thing! That Constitution binds down every minister and member of that Church to swear, if called upon, that Christ is not the Head of the Church, but that a man, a woman, or a child, is the Head of the Church! Does the constitution and government of the United States of America – where there is no Established Church – let the Church alone? Indeed it does not; for, in America the Sabbath is systematically profaned, so that ministers and church-goers can scarcely “hear their ears,” in some cases, so loud is the unholy din of the freebooters on the domain of the Fourth Commandment, who, intent on business or pleasure, tramp along the streets and highways!</p></blockquote>

<blockquote><p>In 1834 the American Old Light Covenanter Synod rejected the false notion, which was originally espoused by Erastians, Tolerationists, and Anabaptist fanatics, but has even been propagated by some who claim to stand in the covenanting tradition, that civil punishment in the Old Testament was ecclesiastical discipline. Indeed, they opposed such an idea so strongly that they even condemned it as heresy:

As the doctrine of Erastus is not very popular in the present age, and as his followers depended much for the support of their cause on arguments taken from the state of things in the Jewish church, it might seem advisable to let the dispute sink into oblivion; but when we consider that multitudes of errorists and heretics in the present day, hold the same opinions respecting the Jewish church which were held by the Erastians, the discussion of this question is of no small importance. The Erastians, in order to support their doctrine, maintained that in the Jewish church there were no rulers distinct from the civil magistrate; and no discipline distinct from civil punishment. Our present heretics hold the same opinion; but the two parties deduce very different conclusions from the same premises. The Erastians, supposing that civil and ecclesiastical rulers were the same under the Old Testament, maintained that they are so still. Our present heretics, assuming the same false premises, allege, that all which is recorded of the pious kings of Judah suppressing idolatry, was done by them as ecclesiastical rulers; and that the ancient dispensation being abolished, their example is not to be followed by the Christian magistrate. In opposition to both, we maintain that the Jewish church had a government distinct from that of the state, and a discipline distinct from civil punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/general-synod-of-the-reformed-presbyterian-church.html">General Synod of the Reformed Presbyterian Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the General Synod of the Reformed Presbyterian Church, session seventeenth, held in the city of Pittsburgh, October, 1834. With an appendix containing two overtures: I. on the ‘jury act,’ II. on the magistrate’s power, circa sacra (Newburgh, 1834), pp 22-3.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

nt+dispensation+being+abolished%2C+their+example+is+not+to+be+followed+by+the+Christian+magistrate.+In+opposition+to+both%2C+we+maintain+that+the+Jewish+church+had+a+government+distinct+from+that+of+the+state%2C+and+a+discipline+distinct+from+civil+punishment.%E2%80%9D%0A%0A%E2%80%94+General+Synod+of+the+Reformed+Presbyterian+Church%2C+Minutes+of+the+General+Synod+of+the+Reformed+Presbyterian+Church%2C+session+seventeenth%2C+held+in+the+city+of+Pittsburgh%2C+October%2C+1834.+With+an+appendix+containing+two+overtures%3A+I.+on+the+%E2%80%98jury+act%2C%E2%80%99+II.+on+the+magistrate%E2%80%99s+power%2C+circa+sacra+%28Newburgh%2C+1834%29%2C+pp+22-3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe448b2d76c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e448b2d76c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/01/11/old-light-covenanters-and-the-erastian-view-of-church-state-relations-in-the-old-testament/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>When answering the objection that Christian magistrates were not bound to enforce the Old Testament’s laws against idolatry because they were not Jews, John Knox pointed out that the commandments given under Moses remained valid for civil rulers in the new covenant era:

For it is a thing more certain that whatsoever God required of the civil magistrate in Israel or Judah concerning the observation of true religion during the time of the Law, the same doth he require of lawful magistrates professing Christ Jesus in the time of the Gospel, as the Holy Ghost hath taught us by the mouth of David, saying (Psalm 2): ‘Be learned, you that judge the earth, kiss the Son, lest that the Lord wax angry and that ye perish from the way.’ This admonition did not extend to the judges under the Law only, but doth also include such as be promoted to honours in the time of the Gospel, when Christ Jesus doth reign and fight in His spiritual kingdom, whose enemies in that Psalm be most sharply taxed, their fury expressed and vanity mocked. And then are kings and judges, who think themselves free from all law and obedience, commanded to repent their former blind rage, and judges are charged to be learned. And last are all commanded to serve the Eternal in fear, to rejoice before Him in trembling, to kiss the Son, that is, to give unto Him most humble obedience. Whereof it is evident that the rulers, magistrates and judges now in Christ’s kingdom are no less bound to obedience unto God than were those under the Law.</p></blockquote>

<blockquote><p>This Judicial Law is not accurately distinguished from the Moral Law and Natural Law, in this, that the Moral Law was published by God with his own voice, and twice written in Tables of stone and expressed in the Decalogue, but the Judicial Law without all this solemnity, was afterwards delivered to Moses, and by him to the people. For the Laws of restoring things lent or trusted, of just weights and measures, of paying the labourer his hire, and many such as these, not expressly set down in the Decalogue, are not more Judicial or less Moral, and natural than the Commandment, Thou shalt not steal. […] Those Laws therefore which are usually reckoned among the Judicial, and yet in their nature bear no singular respect to the condition of the Jews more than of any other people. Those are all of the Moral and Natural Law, which are common to all nations.</p></blockquote>

<blockquote><p>The prince shall have a section on one side and the other of the holy district and the city’s property … Then it shall be the prince’s part to give burnt offerings, grain offerings, and drink offerings, at the feasts, the New Moons, the Sabbaths, and at all the appointed seasons of the house of Israel. He shall prepare the sin offering, the grain offering, the burnt offering, and the peace offerings to make atonement for the house of Israel. Ezekiel 45:7, 17.

On the basis of the above prophecy, the Belfast Covenanter periodical deduced that the Christian magistrate was bound to give financial support to the cause of true religion:

That as we have here an account of a prince, of his having an appropriate portion of land assigned him, and of his furnishing burnt-offerings, meat-offerings, and drink-offerings, in the solemnities of public worship, we therein see, that a king, or supreme magistrate, has a special relation to the Church – should not only sanction religion by his authority and example, but honour and support it, when necessary, by his royal munificence.

In considering more minutely the contents of this 17th verse, we observe, that the profession and establishment of religion being taken for granted, as well as the appointment of a supreme magistrate, it is his business and duty to provide for the maintenance of the true religion, if not immediately from his own personal resources, at least by seeing that the subjects contribute according to the benefit enjoyed. […] Nobody complains of being obliged to be honest, or of being restrained from murder, robbery, perjury, or any other crime which would unhinge society; why then should the restraining of daring irreligion and profaneness by the magistrate be accounted oppressive, since the obligations of religion are as clearly revealed as those of morality, and those transgressions of the first table as injurious to society, as those of the second table of the moral law? There is indeed no hardship imposed, in requiring a profession of the Christian religion, and as little in requiring its professors to support it, since both are duties which mankind have no right to evade; nor can they neglect them without openly rebelling against the God who made them. The Christian magistrate, ruling over his subjects with paternal care, […] it is nevertheless his duty to see that pure Christianity be publicly professed by his subjects, and that a liberal support be administered to them that serve at the altar. His suppressing all immorality, idolatry, gross error, and false religion, is perhaps the best establishment he can give to the true; for as it is already sanctioned and established by a higher authority than that of man, it only requires the approbation, protection, and support of the civil power, in that nation or kingdom into which it has been introduced.

We may further notice here, that as the prince should take care that the ministers of religion have a sufficient maintenance, so he ought to see, that the service of God be faithfully performed by them; and where negligence or dereliction of duty is detected, should enforce amendment, since the clergy are as strictly obliged to attend to their duties, as the laity are to furnish the means of their subsistence.</p></blockquote>

rt-true-religion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>First, I said that the magistrate is the guardian of the divine law, which includes not only the second table, but the first also. Therefore he is the guardian of both the one and the other. I also mentioned the words of Augustine who said that both private men and kings should serve the Lord. It is written in the Psalms, When peoples gather together and kingdoms, to worship the Lord. In another place, Now therefore, O kings, be wise; be warned, O rulers of the earth. Serve the LORD with fear, with trembling. Augustine adds that a private man serves the Lord by confessing His name and living rightly. This, however, is not sufficient for a king or magistrate. He should serve the Lord with his authority and power by punishing those who oppose Him. Unless he does this, the magistrate appears to give his assent to blasphemy and heresy. When the king sees and suffers these men, he joins himself to them and promotes their shameful acts. When Nebuchadnezzar first came to know God, he proposed a decree promising capital punishment for those who should blaspheme against the God of Daniel. Darius later made a similar decree. Our magistrate should stamp out all idolatry, blasphemy and superstition. […] The law of God states that blasphemers should be put to death not by a private man or by priests, but by the magistrate. [Leviticus 24:16]</p></blockquote>

<div class="actions"><button class="copy" data-copy="“First, I said that the magistrate is the guardian of the divine law, which includes not only the second table, but the first also. Therefore he is the guardian of both the one and the other. I also mentioned the words of Augustine who said that both private men and kings should serve the Lord. It is written in the Psalms, When peoples gather together and kingdoms, to worship the Lord. In another place, Now therefore, O kings, be wise; be warned, O rulers of the earth. Serve the LORD with fear, with trembling. Augustine adds that a private man serves the Lord by confessing His name and living rightly. This, however, is not sufficient for a king or magistrate. He should serve the Lord with his authority and power by punishing those who oppose Him. Unless he does this, the magistrate appears to give his assent to blasphemy and heresy. When the king sees and suffers these men, he joins himself to them and promotes their shameful acts. When Nebuchadnezzar first came to know God, he proposed a decree promising capital punishment for those who should blaspheme against the God of Daniel. Darius later made a similar decree. Our magistrate should stamp out all idolatry, blasphemy and superstition. […] The law of God states that blasphemers should be put to death not by a private man or by priests, but by the magistrate. [Leviticus 24:16]”

ener">Share on X</a><a class="perma" href="../quote/5b36721e21.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/12/31/peter-martyr-vermigli-on-the-magistrates-duty-to-enforce-the-first-table-of-the-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Having my warrant therefore out of the word of God, I dare boldly avow, that those kings shall flourish and be in happy case, which wholly give and submit themselves and their kingdoms to Jesus Christ, the only-begotten Son of God, being King of kings, and Lord of lords; acknowledging him to be the mightiest prince and monarch of all, and themselves his vassals, subjects, and servants: which, finally, do not follow in all their affairs their own mind and judgment, the laws of men that are contrary to God’s commandments, or the good intents of mortal men; but do both themselves follow the very laws of the mightiest king and monarch, and also cause them to be followed throughout all their kingdom, reforming both themselves and all theirs at and by the rule of God’s holy word. For in so doing the kingdom shall flourish in peace and tranquillity, and the kings thereof shall be most wealthy, victorious, long-lived, and happy. For thus speaketh the mouth of the Lord, which cannot possibly lie: “When the king sitteth upon the seat of his kingdom, he shall take the book of the law of God, that he may read in it all the days of his life, that he may do it, and not decline from it either to the right hand or to the left; but that he may prolong the days in his kingdom both of his own life and of his children.” [Deuteronomy 17] And again, “Let not the book of this law depart out of thy mouth,” (Josue [sic], or thou, whatsoever thou art that hast a kingdom), “but occupy thy mind therein day and night, that thou mayest observe and do according to all that is written therein: for then shalt thou make thy way prosperous, and then shalt thou be happy.” It is assuredly true, therefore, confirmed by the testimony of the most true God, and in express words pronounced, that the prosperity of kings and kingdoms consisteth in true faith, diligent hearing, and faithful obeying the word or law of God: whereas their calamity and utter overthrow doth follow the contrary.</p></blockquote>

</figure><figure class="quote" id="q-db8c407a25" data-kw="">
<blockquote><p>Omitting many other passages that might be cited from the New Testament, in favour of capital punishment, I shall notice only two. “But we know that the law is good, if a man use it lawfully.” 1 Tim. i. 8. The law to which the apostle refers, is evidently what we call the judicial law; for it was not made for a righteous man, but for the lawless and disobedient. But this is not true of either the moral or ceremonial law, for they were made for righteous men: the Lord Jesus Christ obeyed them both. Now when we call a law good, we mean that the penalty is just. When the law of England hung people for stealing we called it a bad law, because the penalty was too severe; we call the law which hangs men for murder a good law, because the penalty is exactly proportioned to the crime. We see, then, that those laws which our modern illuminati call bloody laws, Paul calls good laws. In Hebrews ii. 2, it is said, “If the word spoken by angels* was steadfast, and every transgression and disobedience received a just recompense of reward.” The penalty inflicted on criminals by the Mosaic law, is called a just recompense of reward: it was neither too light, nor too severe – just such as infinite wisdom and goodness saw fit to appoint.

* Angels, (Messengers,) including Moses and the prophets.</p></blockquote>

enanter</a></div>
</figure><figure class="quote" id="q-51e1cf8518" data-kw="">
<blockquote><p>Over the coming months we will be posting a lot of quotes from the Reformer, Martin Bucer. He was a major influence on the shaping of Reformed theology, and had a very big influence upon the English Reformation. His book De Regno Christi has been translated into English, and can be purchased from here (sadly, not all chapters were translated). In this quote, Bucer upholds the Bible’s command to root out incorrigible criminals:

Thirdly, it is common to the kingdoms of this world and to the Kingdom of Christ that they should tolerate the wicked while they lie hidden among the good; but when they have done their impious misdeeds openly, and will not change their ways when corrected, it is proper to remove them from the commonwealth, as Plato indicates in his Politics. For the Lord has commanded his people quite strictly that they are to drive criminal and incorrigible men from their midst, and to burn them with fire, and thus to wipe out their offensiveness as completely as possible (Deut. 13:5 ff; 17:2-5; 19:11-21; 21:18-21; 22:13-28 and 24:7).</p></blockquote>

</figure><figure class="quote" id="q-9341b243da" data-kw="">
<blockquote><p>Now it remains to address the Magistrate, whom I judge can be described as a person chosen and instituted by God to defend the divine laws in matters of external discipline, by inflicting bodily punishment upon transgressors and by supporting and encouraging the good. The divine plan selects many people who do not act as magistrates. The ministers of the Church are one example. They still defend God’s word and laws, but not only in matters of external instruction. It is the duty of ministers to reach into the depths and motions of souls by way of the divine word. The Holy Spirit acts here as well, joining His strength with that of orthodox preaching and of the sacraments distributed by the Church.

The magistrate works alone in edifying and punishing transgressors. The minister binds the guilty and the incorrigible in the name of God, and excludes them from the kingdom of Heaven unless they correct their ways. The magistrate inflicts external punishment, working through the use of the sword. Both ministers and magistrates act to nurture the pious, but in different ways. The magistrate increases them in works, honours and merits. The minister consoles them through the promises of God and the sacraments.

The magistrate assures that the laws are kept most carefully, the guilty are punished, and the good are both helped and nurtured. The law acts as a mute magistrate, while the magistrate represents the moving and speaking law. Certainly he is also a minister of God since, as Paul said, magistrates sing the praises of those who live justly [Romans 13:3]. The magistrate wields the sword against the wicked, acting as the avenger and champion of God, and looks to nothing else but the salvation of men.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

The magistrate works alone in edifying and punishing transgressors. The minister binds the guilty and the incorrigible in the name of God, and excludes them from the kingdom of Heaven unless they correct their ways. The magistrate inflicts external punishment, working through the use of the sword. Both ministers and magistrates act to nurture the pious, but in different ways. The magistrate increases them in works, honours and merits. The minister consoles them through the promises of God and the sacraments.

The magistrate assures that the laws are kept most carefully, the guilty are punished, and the good are both helped and nurtured. The law acts as a mute magistrate, while the magistrate represents the moving and speaking law. Certainly he is also a minister of God since, as Paul said, magistrates sing the praises of those who live justly [Romans 13:3]. The magistrate wields the sword against the wicked, acting as the avenger and champion of God, and looks to nothing else but the salvation of men.”

thing+else+but+the+salvation+of+men.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Of+a+magistrate%2C+and+the+difference+between+civil+and+ecclesiastical+power+%281561%29+in+W.+J.+T.+Kirby+%28ed.%29%2C+The+Z%C3%BCrich+Connection+and+Tudor+Political+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9341b243da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9341b243da.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/12/13/peter-martyr-vermigli-on-real-two-kingdom-theology-and-the-magistrate-as-a-living-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Back in the early days of this blog, I was deeply committed to Libertarian Theology (a Christianized form of small government political ideology), which restricts the state largely to crime and defence. This position is the one held by most theonomists today, hence they write against the civil magistrate funding the church, welfare, healthcare, and education. Those of you who read the first edition of my book, A Conquered Kingdom, will know that this was the position that I defended and that I argued that this was compatible with the establishment principle as enshrined in the original Westminster Confession of Faith.

Over time, however, I began to increasingly see that this position was totally untenable. This post will reveal that Libertarian Theology is incongruous with the Scottish theory of the establishment principle, and, consequently, with the Westminster Confession of Faith that enshrines this principle as part of our subordinate standards. Whether or not Libertarian Theology is biblical is a debate for another day; our present objective is only to highlight the reality that it is contra-confessional and in opposition to the Covenanted Reformation. The sources used here are all available on the internet, so the readers can examine the documents for themselves.

Although the Scottish Reformers and Covenanters were theonomists, in the sense that they believed in the abiding validity of the majority of the penal sanctions, they did not preach a gospel of small government. First, the Second Book of Discipline of the Church of Scotland, which was approved by the General Assembly in 1578 (when Andrew Melville was moderator), makes it clear that the civil magistrate is to fund the church and the provision of social services: ‘To see that sufficient provision be made for the ministerie, the schooles, and the poore: and if they have not sufficient to awaite upon their charges, to supply their indigence even with their own rents, if need require.’ [1]

This teaching was upheld in the National Covenant of Scotland (1580, later reaffirmed in 1638), in which the Covenanters swore to ‘join ourselves willingly, in doctrine, faith, religion, discipline, and use of the holy sacraments, as lively members of the same in Christ our head: promising and swearing, by the great name of the LORD our GOD, that we shall continue in the obedience of the doctrine and discipline of this kirk’. [2] It was also upheld in the Solemn League and Covenant of England, Scotland, and Ireland in 1643; in the first article of this covenant they swore to labour for ‘the preservation of the reformed religion in the Church of Scotland, in doctrine, worship, discipline, and government, against our common enemies’. [3]

Obviously, common sense should tell us that when the Covenanters’ swore to uphold the discipline of the kirk, they meant the system enshrined in the Second Book of Discipline. Since this document stipulates that the civil magistrate is to fund the church, education, and works of mercy then we are forced to conclude that Libertarian Theology, which denies that the Christian magistrate is commanded or even permitted to do such things, is contrary to the Covenanted Reformation. Ergo, it is inconsistent for a Covenanter to be a Libertarian.

For further confirmation of the claim that the National Covenant is upholding the Second Book of Discipline, we find Thomas Houston arguing that the Church of Scotland’s First and Second Books of Discipline ‘have always been regarded with approbation in the Covenanting Church, and the latter of which, as Dr [Thomas] McCrie testifies, was sworn to in the National Covenant, and is to be considered of standing authority in the church’.[3] Modern Reformed Presbyterians need to take note of this, because if we are going to continue to claim to be the Church of the covenants, then we better make sure we know what precisely it is that the covenants teach. For my part, I only found out that the covenants upheld the Second Book of Discipline a few weeks ago. This is despite the fact that I have been reading Covenanter history and literature for nine years.

However, this raises another question, namely, ‘can one subscribe to the original Westminster Confession and believe in small government?’ Without presently going into too much detail, the answer to this should be pretty obvious to those familiar with the theoretical framework within which the Westminster Confession was written. It must be pointed out that the Westminster Confession is a direct product of the covenants, National and Solemn League. The first article of the latter covenant binds the Covenanters to compile a uniform confession of faith. Are we seriously to believe that the Confession which was subsequently produced by the Westminster Assembly and adopted by the General Assembly of the Church of Scotland was designed to accommodate views which the Covenanters had rejected in the covenants? To affirm this makes no sense at all. Conversely, we find that when the Scottish General Assembly adopted the Westminster Assembly’s Form of presbyterial church government, they continued to profess their adherence to the ‘books of Discipline’ of their church. [5] Instead, the reality must be faced: Libertarianism is unconfessional error and to embrace it is a violation of the covenants. In light of this, we must conclude that the Scottish Covenants and the Westminster Standards are Social Theocratic documents, which advocate a more interventionist state than the small government views of many conservatives and Libertarians. We could make other arguments to further substantiate this point, but these are sufficient for the time being. [6]

[1] The Second Book of Discipline of the Church of Scotland (1578), From the True Covenanter website (http://www.truecovenanter.com/kirkgovt/scotland_kirk_books_of_discipline_1621.phtml?scotland_kirk_books_of_discipline_1621=book2) (accessed 10 Dec. 2011).

[2] National Covenant of Scotland (1580; 1638), From the Covenanter website (http://www.covenanter.org/Westminster/nationalcovenant.htm) (accessed 10 Dec. 2011).

[3] Solemn League and Covenant (1643), From the Covenanter website (http://www.covenanter.org/Westminster/solemnleague.htm) (accessed 10 Dec. 2011).</p></blockquote>

<blockquote><p>This post is very interesting for revealing how establishmentarians’ believed that it was the duty of the civil magistrate to fund the propagation of the gospel and to support places of learning. It further proves that Libertarian Theology (small governmentism, that seeks to restrict the state to crime, defence, and very little else) is really a fruit of Baptist Voluntaryism and not Presbyterian establishmentarianism:

Were the State constituted on Scriptural principles, and the true religion established by public authority, it can never be shown that it would be unjust to decree a moderate tax, in order to maintain and propagate Christianity throughout the community. Who ever objects against the appropriations that are made out of the national treasury, to endow Colleges and Universities, and to promote general education? Now, if the reason for making these appropriations be that education advances the ends of civil government, as it tends to further the peace and prosperity of society, it can be shown, with tenfold conclusiveness, that civil rulers should extend their bounty to the true religion established in their dominions. Education is a blessing to a people, but pure Christianity is a blessing incomparably greater. All that education can ever do, towards promoting good order and industry and obedience to the laws throughout a community, will be accomplished much more efficiently by the doctrines of true religion faithfully inculcated, and its ordinances Scripturally administered. This being admitted, and we presume it will not be easy to deny the premises or conclusions, it follows, that a slight tax for the support of a national religious establishment cannot be regarded as a grievance, even by those who swell the ranks of dissent. […] For its own intrinsic excellence, and for the good which its establishment produces, we maintain that genuine Christianity should be supported; and that a portion of the public money were well applied, when used for the purpose of providing places of accommodation for worship, and of maintaining a regular ministry in unevangelised parts of the country. Should unbelievers, or persons who dissent from the establishment, complain that they are unjustly taxed for supporting a system which they disapprove, let them be told that the same objection may be brought with equal, if not superior force, against an endowment being extended by the State to places of learning. Besides, the principle of the objection [that unbelievers should not be taxed to support something they do not like] equally strikes against almost every appropriation of the public money for any general object, and goes to unhinge completely the operations of government.</p></blockquote>

<blockquote><p>In the dispute which resulted in the schism of 1840 over the civil magistrate’s power circa sacra, it was alleged that Thomas Houston was arguing for the entire judicial law to be upheld by the Christian ruler. This was a complete straw-man, yet, in modern debates over Theonomy, we hear this very same straw-man repeated again and again. No matter how many times you tell people that this is not the case, they persist in spreading such misrepresentation. Instead, our position is that the judicial laws which are part of the moral law continue to oblige all nations; as Dr Houston puts it:

Again, the authors of the Declinature obviously represent Mr. Houston, as teaching that the whole Judicial Code is still obligatory on Christian civil rulers, whereas, even in the passages which they have quoted, the writer limits the laws, as do the eminent Divines, to those which guard the Decalogue, which are moral in their nature, and which are susceptible of application, to nations in different ages, and under every dispensation.</p></blockquote>

<blockquote><p>Occasionally on this blog, I will make reference to the R2K error. This view is held by a number of modern “Reformed” scholars, especially from Westminster Seminary California. Although I gave a brief definition of what it was in a recent post by Samuel B. Wylie, nevertheless, it is always better to get something straight from the horses’ mouth in order to avoid accusations that you are erecting a straw-man of your opponent’s position. Michael Horton is by far the most learned, gifted, and pious of the R2K theologians I have come across. Consequently, I think it is safe to say that his definition of the dogma is probably accurate. In his recent work on systematic theology, Professor Horton provides us with the following definition of what R2Kers believe concerning God’s law and civil government: ‘God secretly governs the nations just as he does the church, although he governs the former through natural law and common grace and the latter through his Word written and preached. […] The Mosaic theocracy was limited to the old covenant and is no longer the blueprint for nation-states.’ [1]

As a forum for Reformed political theology and Covenanter Theonomy, this blog will repeatedly post material arguing that nations are to be governed by biblical law. Moreover, although we acknowledge that modern nations are not to be exact replicas of the Hebrew Republic, as the judicial laws of particular right to Israel have expired, we do believe that judicial laws of common equity in the Mosaic law, which act as an external fence to the Decalogue, bind all nations. While some posts will directly address the R2K error, others will refute it indirectly by dealing with themes relating to the establishment principle, biblical penal sanctions, social theocracy, and the Lordship of Christ over the state. In light of the writings of our Reformed forebears on these themes, one can be in no doubt that there is no place for R2K at the Reformed table, as R2K is not Reformed.[2]</p></blockquote>

<blockquote><p>In this extract from The two sons of oil, Samuel B. Wylie explains how the civil government is to extend care and protection to the church. His application of Matthew 25:42, 45 to the state is a significant blow against Libertarian Theology, and suggests that the concept of the state not intervening in relief for the afflicted is an ungodly idea (but this is an aside):

The civil magistrate ought to defend and protect the Church of Christ. Isa. 49:23: “Kings shall be thy nursing fathers, and their queens thy nursing mothers,” &amp;c. Does not this imply protection? The metaphors selected by the Spirit of God, involve the highest possible care and tenderness. I know it has been objected by some, that the tender care and concern here intended is not official, but merely personal, as an individual member of the church. The reason assigned is, that the epithet involving concern is not confined to kings, but is common to all their queens: and this must be acknowledged to be unofficial. Sure none are exempted from being concerned about the interests of religion. The irrelevancy of the objection will appear, by attending to an observation formerly made, viz. that the commands of God are obligatory upon every one, in his respective station and department of life. Queens are bound to exercise all the influence, which in the providence of God is conferred upon them, in promoting the religion of Jesus. Kings, or civil magistrates, in like manner, are indispensably bound to exercise all the power which they possess in their stations, to promote the same desirable end. Whatever quantity of this power is kept back, is so much unliquidated debt due to the Messiah, by the express command of that God whom magistrates represent. Ps. 2:12: “Kiss ye the Son lest he be angry.” When Christ’s mystical body needs this power, and the magistrate withholds the benefit of it, does he not run the risk of being charged by Jesus at the last day, as we read, Matt. 25:42, 45 “I was an hungered, and ye gave me no meat; I was thirsty, and ye gave me no drink, &amp;c. Inasmuch as ye did it not unto one of the least of these my brethren, ye did it not to me.”

This same idea of protection, tenderness, and care, as a blessing to be expected in New Testament times, is held out, Isa. 60:10,16: “Kings shall minister unto thee,” and “thou shalt suck the breasts of kings.” All these passages evidently intimate, that the civil power shall be exercised in administering officially to the church, every comfort which may be expected to result from the union of magistratical authority and paternal care; such as defending her from her enemies, and securing to her all her privileges.

Moreover, when in 1 Tim. 2:2, we are commanded to pray for magistrates, the end proposed is, that the church and people of God, under the wing of their protection, “may lead quiet and peaceable lives in all godliness and honesty.” Either indifference, therefore, on the part of the state, toward the church, or an equal protection to her enemies, is notoriously incompatible with the ideas obviously contained in these sacred passages.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In this extract from The two sons of oil, Samuel B. Wylie explains how the civil government is to extend care and protection to the church. His application of Matthew 25:42, 45 to the state is a significant blow against Libertarian Theology, and suggests that the concept of the state not intervening in relief for the afflicted is an ungodly idea (but this is an aside):

The civil magistrate ought to defend and protect the Church of Christ. Isa. 49:23: “Kings shall be thy nursing fathers, and their queens thy nursing mothers,” &amp;c. Does not this imply protection? The metaphors selected by the Spirit of God, involve the highest possible care and tenderness. I know it has been objected by some, that the tender care and concern here intended is not official, but merely personal, as an individual member of the church. The reason assigned is, that the epithet involving concern is not confined to kings, but is common to all their queens: and this must be acknowledged to be unofficial. Sure none are exempted from being concerned about the interests of religion. The irrelevancy of the objection will appear, by attending to an observation formerly made, viz. that the commands of God are obligatory upon every one, in his respective station and department of life. Queens are bound to exercise all the influence, which in the providence of God is conferred upon them, in promoting the religion of Jesus. Kings, or civil magistrates, in like manner, are indispensably bound to exercise all the power which they possess in their stations, to promote the same desirable end. Whatever quantity of this power is kept back, is so much unliquidated debt due to the Messiah, by the express command of that God whom magistrates represent. Ps. 2:12: “Kiss ye the Son lest he be angry.” When Christ’s mystical body needs this power, and the magistrate withholds the benefit of it, does he not run the risk of being charged by Jesus at the last day, as we read, Matt. 25:42, 45 “I was an hungered, and ye gave me no meat; I was thirsty, and ye gave me no drink, &amp;c. Inasmuch as ye did it not unto one of the least of these my brethren, ye did it not to me.”

Moreover, when in 1 Tim. 2:2, we are commanded to pray for magistrates, the end proposed is, that the church and people of God, under the wing of their protection, “may lead quiet and peaceable lives in all godliness and honesty.” Either indifference, therefore, on the part of the state, toward the church, or an equal protection to her enemies, is notoriously incompatible with the ideas obviously contained in these sacred passages.”

nd+of+that+God+whom+magistrates+represent.+Ps.+2%3A12%3A+%E2%80%9CKiss+ye+the+Son+lest+he+be+angry.%E2%80%9D+When+Christ%E2%80%99s+mystical+body+needs+this+power%2C+and+the+magistrate+withholds+the+benefit+of+it%2C+does+he+not+run+the+risk+of+being+charged+by+Jesus+at+the+last+day%2C+as+we+read%2C+Matt.+25%3A42%2C+45+%E2%80%9CI+was+an+hungered%2C+and+ye+gave+me+no+meat%3B+I+was+thirsty%2C+and+ye+gave+me+no+drink%2C+%26c.+Inasmuch+as+ye+did+it+not+unto+one+of+the+least+of+these+my+brethren%2C+ye+did+it+not+to+me.%E2%80%9D%0A%0AThis+same+idea+of+protection%2C+tenderness%2C+and+care%2C+as+a+blessing+to+be+expected+in+New+Testament+times%2C+is+held+out%2C+Isa.+60%3A10%2C16%3A+%E2%80%9CKings+shall+minister+unto+thee%2C%E2%80%9D+and+%E2%80%9Cthou+shalt+suck+the+breasts+of+kings.%E2%80%9D+All+these+passages+evidently+intimate%2C+that+the+civil+power+shall+be+exercised+in+administering+officially+to+the+church%2C+every+comfort+which+may+be+expected+to+result+from+the+union+of+magistratical+authority+and+paternal+care%3B+such+as+defending+her+from+her+enemies%2C+and+securing+to+her+all+her+privileges.%0A%0AMoreover%2C+when+in+1+Tim.+2%3A2%2C+we+are+commanded+to+pray+for+magistrates%2C+the+end+proposed+is%2C+that+the+church+and+people+of+God%2C+under+the+wing+of+their+protection%2C+%E2%80%9Cmay+lead+quiet+and+peaceable+lives+in+all+godliness+and+honesty.%E2%80%9D+Either+indifference%2C+therefore%2C+on+the+part+of+the+state%2C+toward+the+church%2C+or+an+equal+protection+to+her+enemies%2C+is+notoriously+incompatible+with+the+ideas+obviously+contained+in+these+sacred+passages.%E2%80%9D%0A%0A%E2%80%94+S.+B.+Wylie%2C+The+two+sons+of+oil%3B+or%2C+the+faithful+witness+for+magistracy+and+ministry+upon+a+scriptural+basis%2C+%281803%3B+York+PA%2C+2002%29%2C+pp+19-20.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3641a8235e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3641a8235e.html">Permalink</a><a class="src" href="https:/ <blockquote><p>In a series of articles on religious establishments published in the Covenanter periodical, which was edited at the time by Thomas Houston of Knockbracken, we find this brief statement as to why it is the state’s duty to submit to Christ and obey his word:

To a sincere believer in the Bible, there can be no question that the Lord Jesus Christ, in his Mediatorial character, has been exalted by the Father to the sovereignty of all worlds, and that the princes and potentates of the earth, being placed in subjection under him, are bound to yield to him an unreserved obedience. Messiah is the rightful Governor among the nations – King of kings and Lord of lords – the Prince of the kings of the earth. If this simple statement is admitted, and we see not how it can be refused, it must irresistibly follow, that the nations, as such, are bound to submit to Christ the Lord, and their rulers are indispensably required to frame their legislation on the basis of his Word, and regulate their lives according to its infallible directions. Especially are a people professedly Christian solemnly required to act from a far higher principle than a mere worldly expediency, and to set the Saviour’s glory before them in all their public deeds – in choosing their rulers, in devising or executing laws, and in regulating the measure of subjection. Should they overlook these fundamental maxims, and act in opposition to them, they will inevitably incur the Divine displeasure, and must bear the fearful consequences of rebellion against the Lord’s Anointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Nov. 1831, p. 388</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Some of us have understood Deuteronomy 22:28-9 to be referring to the punishment of rape (the NIV rendering gives this impression, as do various expounders of biblical law). However, Henry Bullinger appears to be on point when he argues that it is referring to the penalty for fornication, not rape. The latter is a form of kidnapping or manstealing, and should thus be punished with death:

Rapes and such villainies committed perforce the laws do punish with loss of life; but to him that doth deflour a maid, not violently the Lord doth say, “Marry and endow her.” [Deuteronomy 22:28-9]</p></blockquote>

</figure><figure class="quote" id="q-bb71d12cee" data-kw="">
<blockquote><p>Legislation was to go forward according to the Word of God. It is noteworthy that in every paragraph of the Covenants and in every step that was contemplated this supreme standard is pointed to, and the strong desire and determination are manifested of keeping close to this divine guide. Thus British law was to be made moral and Scriptural, and all contrary to the Word of God was to be swept away. What more necessary doctrine now, and yet what one is more overlooked? Most men would be laughed at who based an argument against any law either on the moral law or the Holy Scriptures. We have now in Britain the sad spectacle of the Legislature of one of the greatest Christian nations on earth afraid or unwilling to appeal to the only guide for Christian conduct and the only revelation of the will of the Christian’s God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-ramsey.html">John Ramsey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The British covenants suited to present-day needs</cite>, (Belfast, 1897), pp 18-19.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Legislation was to go forward according to the Word of God. It is noteworthy that in every paragraph of the Covenants and in every step that was contemplated this supreme standard is pointed to, and the strong desire and determination are manifested of keeping close to this divine guide. Thus British law was to be made moral and Scriptural, and all contrary to the Word of God was to be swept away. What more necessary doctrine now, and yet what one is more overlooked? Most men would be laughed at who based an argument against any law either on the moral law or the Holy Scriptures. We have now in Britain the sad spectacle of the Legislature of one of the greatest Christian nations on earth afraid or unwilling to appeal to the only guide for Christian conduct and the only revelation of the will of the Christian’s God.”

<blockquote><p>And this disease [depression] is more formidable than any other because it commonly lasts very long. It is a long time before it has come to its height, and usually as long ere it declines again; and all this long season of its continuance is full of fear and torment, of horror and amazement. It is in every respect sad and overwhelming; it is a state of darkness that has no discernible beams of light. It is a land of darkness on which no sun at all seems to shine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/timothy-rogers.html">Timothy Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Trouble of the Mind and the Disease of Melancholy</cite>, (1691; Morgan PA: Soli Deo Gloria, 2004), xxv.</span></figcaption>

<blockquote><p>These things I have written to you concerning those who try to deceive you.” 1 John 2:26

In his commentary on the above text, John Calvin reminds us that the Christian minister not only has the duty of gathering a flock, but he must also protect the flock from those that would seduce them into heresy:

When we hear that he wrote concerning seducers, we ought always to bear in mind, that it is the duty of a good and diligent pastor not only to gather a flock, but also to drive away wolves for what will it avail to proclaim the pure gospel, if we connive at the impostures of Satan? No one, then, can faithfully teach the Church, except he is diligent in banishing errors whenever he finds them spread by seducers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, trans. and ed. John Owen (1551; 1855) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 199.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

<blockquote><p>The Scottish Covenanter, George Gillespie spoke of his veneration for the English Independents at the Westminster Assembly:

</figure><figure class="quote" id="q-7b46081604" data-kw="">
<blockquote><p>Yet my soul is so united unto you upon that account, and because of your real concernedness and soul sympathy with all of us in Scotland, who desire to be helped of the Lord, to espouse his quarrel to be only ours, and his concernments to be only ours; I say, so united (though little or nothing I can say as I ought) that I cannot keep silent. … Most reverend Sir, my soul desires, while I live, to praise the Lord, for what great things He hath helped you to do, in so nobly, faithfully, and freely witnessing for his noble cause, and sweet Scotland’s cause.

My soul desires to honour you, because He hath so honoured you; and to love you, because He loves you, and hath caused you to love and own his cause, and receive his truths in love; and also to be afflicted in all the afflictions of his people, and to be such a sympathizer, and a burden-bearer with his poor remnant in this land, as that we may say of you, as Paul of the Hebrews, “Ye have had compassion on us in our bonds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William Brackel, 5 Oct. 1682 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh, 1876), iv, 61-62.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

venanter.wordpress.com/2018/12/15/james-renwick-on-the-sympathy-of-wilhelmus-a-brakel-for-the-suffering-church-of-scotland/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>When the most refined and civilized nations throw away all regard for religion, they become, as the history of our own age attests, the most ferocious of all mankind. Genuine civilization must commence with reformation of the heart; and nothing but true religion is capable of producing this effect.</p></blockquote>

<blockquote><p>(f) Last, but not least, when St. Paul said, “Come out and be separate,” he did not mean that Christians ought to withdraw from every Church in which there are unconverted members, or to refuse to worship in company with any who are not believers, or to keep away from the Lord’s table if any ungodly people go up to it. This is a very common but a very grievous mistake. There is not a text in the New Testament to justify it, and it ought to be condemned as a pure invention of man. Our Lord Jesus Christ Himself deliberately allowed Judas Iscariot to be an apostle for three years, and gave him the Lord’s Supper. He has taught us, in the parable of the wheat and tares, that converted and unconverted will be “together till the harvest,” and cannot be divided. (Matt. xiii. 30.)

In His Epistles to the Seven Churches, and in all St. Paul’s Epistles, we often see faults and corruptions mentioned and reproved; but we are never told that they justify desertion of the assembly, or neglect of ordinances. In short, we must not look for a perfect Church, a perfect congregation, and a perfect company of communicants, until the marriage supper of the Lamb. If others are unworthy Churchmen, or unworthy partakers of the Lord’s Supper, the sin is theirs and not ours: we are not their judges. But to separate ourselves from Church assemblies, and deprive ourselves of Christian ordinances, because others use them unworthily, is to take up a foolish, unreasonable, and unscriptural position. It is not the mind of Christ, and it certainly is not St. Paul’s idea of separation from the world.</p></blockquote>

</figure><figure class="quote" id="q-9598a2fd2c" data-kw="">
<blockquote><p>I now approach death, heartily satisfied with our excellent Westminster Confession of Faith, Catechisms, and Form of church-government,—and cordially adhering to these Covenants, by which our fathers solemnly bound themselves and their posterity to profess the doctrines and practise the duties therein contained.

I look upon the Secession as indeed the cause of God, but sadly mismanaged and dishonoured by myself and others. Alas! for that pride, passion, selfishness, and unconcern for the glory of Christ, and spiritual edification of souls, which has so often prevailed!—Alas! for our want of due meekness, gentleness, holy zeal, self-denial, hearty grief for sin, compassion to souls in immediate connection with us, or left in the established church, which became distinguished witnesses for Christ. Alas! that we did not chiefly strive to pray better, preach better, and live better than our neighbours.</p></blockquote>

<blockquote><p>Many a sermon hath God bestowed upon thee, O Scotland, but ere long God’s judgments shall be as frequent as these precious meetings have been wherein He sent forth His faithful servants to give warning in His name of their hazard in apostatizing from God, and in breaking all these noble vows which He brought the land unto Himself. God sent out a Welch, a Semple, a Cameron, and a Cargill to preach to thee, O Scotland, but ere long God shall preach unto thee by a bloody sword; for God shall not let a sentence of these men’s words fall to the ground that He sent out, and a commissioned to preach these things in His name – I say, God shall not let a sentence of these men’s words fall to the ground, but they shall have their due accomplishment ere it be long.</p></blockquote>

<blockquote><p>Families are the seminaries both of the church and state. And, therefore, as you desire the church may be pure and the state righteous, look well unto you families and let religion flourish in them. Reformation indeed must begin with persons. And if every one would mend one, all would be reformed. But from persons it must proceed to houses. And if these were but once leavened with godliness, what holy cities and what a happy nation would there be!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Prayer</cite>, (1677) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), p. 181.</span></figcaption>

</figure><figure class="quote" id="q-9fa3c7f40f" data-kw="">
<blockquote><p>We have covenanted to endeavour a reformation of church government and discipline, “according to the word of God and the example of the best reformed churches.” Now both the word of God and the example of the best reformed churches, leadeth us to a church government distinct from civil government; and the example of the best reformed churches doth undeniably lead us to a church discipline, even where the magistrate is Christian; neither doth the word make any exception of Christian states, but contrariwise chargeth us to keep the commandment and ordinances till Christ come again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, the Divine Ordinance of Church Government Vindicated</cite>, (1646; Edinburgh, 1844), p. 150.</span></figcaption>

<blockquote><p>There is no more ordinary cause of spiritual sleep, than conversing with spiritual sluggards, that count it a high point of wisdom not to be forward in religion. These formal, proud persons, as they are cold themselves, so they labour to cast water upon the heat of others. Nay, those that are otherwise good, if declining in their first love, will incline others to a fellowship in the same secure temper, lest they should be upbraided by the vigilancy of others. …

Men disposed to be asleep desire to be alone. Those likewise that are disposed to take a spiritual nap, will avoid company, especially of such as would awake them. They will hardly endure rousing means.</p></blockquote>

</figure><figure class="quote" id="q-82b9f9c792" data-kw="">
<blockquote><p>The Book of Psalms was penned by David, Asaph, Moses and others, and in several ages and states of the church, and were appointed to be sung then, for the present state of the church in those days. It may therefore be demanded: Why then do we sing them now in our churches? The answer is: the church in all ages consists of a number of believers, and the faith is always one, and makes all that apprehend God’s promises to be alike to one another in grace, in meditations, in dispositions, in affections, in desires, in spiritual wants, in the feeling and use of afflictions, in course and conversation of life, and in performance of duties to God and man. And therefore the same psalms, prayers and meditations, are now as fit for the church in these days, and are said and sung with the same use and profit, as in the church in those days when they were first made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), pp 154-55.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Entirely without ground, the Church of Christ, has, from different sides, been denied the right of expressing her faith in writing and of being watchful for its perfect maintenance. For, with such a written confession she does not encroach upon the word of God but only explains the contents of that word according to the measure of faith and knowledge granted unto her in given time. With it she does not assail the authority of the Scriptures, but just tries to maintain, this, and with it she is upon her guard that the Scriptures be not abandoned to the arbitrary will of the individual.</p></blockquote>

</figure><figure class="quote" id="q-33b850e414" data-kw="">
<blockquote><p>Justly may this reprove Scotland this day and darken all our faces before the Lord, for all the sins He hath written upon our judgments, as it were, in legible letters, and yet we never read our sins that we have wickedly and inhumanely committed against Christ and His interest; either our personal sins against the Lord, or our public defections and backslidings from our covenant engagements, and national obligations to him.</p></blockquote>

</figure><figure class="quote" id="q-931f7e9954" data-kw="">
<blockquote><p>Again, I reason thus; That which moved not Christ and his Apostles to separate from the Church of their time, is no cause to us of separation; but, want of satisfaction by convincing signs of the true grace of every member of the Church, was to them no cause of separation from the Churches of their times, Ergo.

The major is clear, except we desire a better pattern for our practices then Christ and his Apostles; what ever carrieth us beyond their line, must be high presumption and deep hypocrisy.

The minor is clear, by many Scriptures; the Scribes and Pharisees were a generation of vipers; Jerusalem worse then Sodom and Gomorrah; Corasin and Bethsaida was worse then Tyrus and Sidon, and to be cast lower in Hell then these: yet the Lord did not give over to preach, to pray, to go to the Temple with them. Judas when a declared Traitor, did not scare him, nor any of his company from the Sacrament. After he went from the Table, when his wickedness was revealed that a Devil was in him; yet none of the Apostles offered to cast themselves out of the body because this wicked member was not cut off.

Many members of the Apostolic Churches were so far from convincing signs of true grace, that the works of the flesh were most evident in their life. In the Corinthians, fundamental errors, open Idolatry, grievous scandal, bitter contentions, profanation of the Lords Table. In the Galatians, such errors as destroyed grace, and made Christ of none effect. In the Church of Ephesus, of Laodicea, and the other golden Candlesticks, divers members were so evidently faulty, that the Candlestick is threatened to be removed; yet from none of these Churches did any of the Apostles ever separate, nor gave they the least warrant to any of their Disciples to make a separation from any of them.</p></blockquote>

<blockquote><p>5. Having seen that the infant seed of the professing people of God were members of the church under the Old Testament economy; and having seen also that the church under that dispensation and the present is the same; we are evidently prepared to take another step, and to infer, that if infants were once members, and if the church remains the same, they undoubtedly are still members, unless some positive divine enactment excluding them can be found. As it was a positive divine enactment which brought them in, and gave them a place in the church, so it is evident that a divine enactment as direct and positive, repealing their old privilege, and excluding them from the covenanted family, must be found, or they are still in the church. But can such an act of repeal and exclusion, I ask, be produced? It cannot. It never has been, and it never can be.

The introduction of infants into the church by divine appointment, is undoubted. The identity of the church, under both dispensations, is undoubted. The perpetuity of the Abrahamic covenant, in which not merely the lineal descendants of Abraham, but “all the nations of the earth were to be blessed,” is undoubted (Gen. 18:18; 22:18; 26:4). And we find no hint in the New Testament of the high privileges granted to the infant seed of believers being withdrawn. Only concede that it has not been formally withdrawn, and it remains of course. The advocates of infant baptism are not bound to produce from the New Testament an express warrant for the membership of the children of believers. The warrant was given most expressly and formally, two thousand years before the New Testament was written; and having never been revoked remains firmly and indisputably in force.

It is deeply to be lamented that our Baptist brethren cannot be prevailed upon to recognize the length and breadth, and bearing of this great ecclesiastical fact. Here were little children eight days old, acknowledged as members of a covenanted society­ a society consecrated to God for spiritual as well as temporal benefits and stamped with a covenant seal, by which they were formally bound, as the seed of believers, to be entirely and forever the Lord’s. Can infant membership be ridiculed, as it often is, without lifting the puny arm against him who was with his “church in the wilderness” (Acts 7:38), and whose ways are all wise and righteous?</p></blockquote>

<blockquote><p>Adhere constantly, cordially, and honestly, to the covenanted principles of the church of Scotland, and to that testimony which hath been lifted up for them. I fear a generation is rising up, which will endeavour silently to let slip these matters, as if they were ashamed to hold them fast, or even to speak of them. May the Lord forbid, that any of you should ever enter into this confederacy against Jesus Christ and his cause! – This from a dying father and minister, and a witness for Christ.

JOHN BROWN</p></blockquote>

<blockquote><p>All, therefore, are outside of the [Christian] dispensation, who, under pretext of knowledge, understand that Jesus was one, and Christ another, and the Only-begotten another, from whom again is the Word, and that the Saviour is another, whom these disciples of error allege to be a production of those who were made Æons in a state of degeneracy. Such men are to outward appearance sheep; for they appear to be like us, by what they say in public, repeating the same words as we do; but inwardly they are wolves.

Their doctrine is homicidal, conjuring up, as it does, a number of gods, and simulating many Fathers, but lowering and dividing the Son of God in many ways. These are they against whom the Lord has cautioned us beforehand; and His disciple, in his Epistle already mentioned, commands us to avoid them, when he says: “For many deceivers are entered into the world, who confess not that Jesus Christ is come in the flesh. This is a deceiver and an antichrist. Take heed to them, that ye lose not what ye have wrought.” And again does he say in the Epistle: “Many false prophets are gone out into the world. Hereby know ye the Spirit of God: Every spirit that confesseth that Jesus Christ is come in the flesh is of God; and every spirit which separates Jesus Christ is not of God, but is of antichrist.”

These words agree with what was said in the Gospel, that “the Word was made flesh, and dwelt among us.” Wherefore he again exclaims in his Epistle, “Every one that believeth that Jesus is the Christ, has been born of God;” knowing Jesus Christ to be one and the same, to whom the gates of heaven were opened, because of His taking upon Him flesh: who shall also come in the same flesh in which He suffered, revealing the glory of the Father.</p></blockquote>

<blockquote><p>What to Moses and the Prophets was not a sufficient cause of separation from the Churches of their time, is not a sufficient cause for us to separate from the Churches in our times. But, want of satisfaction by convincing signs of the true grace of many members of the Church, was not a sufficient cause for Moses and the Prophets to separate in their times.

Ergo: The minor is clear and uncontroverted; for Moses and the Prophets were so far from separating from the Churches of their days for want of assurance of the true grace of every person in these Churches that they remained still to their dying day in the bosom of these Churches, communicating with them in the Word, Prayer, Sacraments and Sacrifices, though they were assured of the evident wickedness of the most of their fellow-members.

Moses knew the Body of Israel to be a crooked and perverse generation: Isaiah tells the Jews that they were another Sodom; Jeremy sheweth that Israel in his days was uncircumcised in heart, no better then Moab, Ammon, or Edom; Micah, that the godly in his time were very rare as the summer fruits, as the grapes after the Vintage; of this truth all the Prophets are full; yet for all this, none of the Prophets did ever think of a separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), p. 157.</span></figcaption>

<blockquote><p>The Divine Wisdom which found it expedient for man before the Fall, not to live alone, hath made it much more needful for man to live in Society after his weakening by sin; Woe to him that is alone, for if he fall who shall raise him up? The best wits of themselves are prone to errors and miscarriages, and left alone, are inclined to run on in any evil way they have once begun: But engagement in fellowship, especially with the Saints, is a preservative against the beginnings of evil, and a retractive therefrom when begun. Every gracious neighbour is a Counsellor and Pedagogue, the greater the incorporation is of such, the better is every Member directed and the more strengthened.</p></blockquote>

</figure><figure class="quote" id="q-5497843023" data-kw="">
<blockquote><p>If, therefore, magistrates command that which is prejudicial to the general welfare of the society, or dishonourable to God, the Supreme Governor of it, they ought to be disobeyed. And, if they be habitually cruel and tyrannical, they ought to be resisted and deposed, if circumstances permit.

1. When the great body of the subjects are much alienated in affection, a revolution may be accomplished without much hazard or hurt.

2. By resisting tyrannical princes in proper circumstances, nations have often preserved their lives as well as their liberties from impending ruin.

3. Such resistance, prudently managed, is an effectual warning to other magistrates to beware of abusing and opposing their subjects.

4. In mixed forms of government, the propriety of resistance is most clear as well as most easy: as when a parliament resists a king, or a king resists a parliament, in defence of the common liberties of the nation. – Nevertheless, as princes are exposed to many and uncommon difficulties, and are apt to be imposed on by their confidents:- and as their real designs are not easily penetrated, and often not to be pried into by their subjects; – and as resistance ordinarily occasions much bloodshed and misery, – subjects ought to put the best construction upon the conduct of their governors that it can justly admit, – and never proceed to violent measures but where it is absolutely necessary, and where there is an hopeful prospect of success.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendious View of Natural and Revealed Religion</cite>, (1782; Fearn: Christian Focus, 2002), pp 23-24.</span></figcaption>

</figure><figure class="quote" id="q-5d63c12f3b" data-kw="">
<blockquote><p>My Brethren and I, that have had Occasion here to confer about you, see a Beauty in the Providence of your being in Communion with the English Church; otherwise such great Confluences from among them, had not attended your Ministry, nor consequently received the Benefit, or reaped the Advantage by it, which so many of them have done.

And tho’ infinite Wisdom has made and may yet make this an alluring Bait to draw them forth; yet as England’s Reformation at first (from Popery and its superstitious and ceremonial Services) however great and glorious, was far from being to full as that of some other Protestant Churches, particularly that of Scotland; so we would fain hope, that, when a new and general Reformation shall be set on Foot, some more at least of the Rags of that Romish Church will be dropp’d, such as (abstracting at present from the Subject of Church-Government) many useless Rites and Customs relating to Worship, that have no scriptural Foundation.

This is what some of the most pious and eminent Divines of your Communion, have wished to see reformed, knowing that many of these were retained at first, only under a View of Reforming gradually, and from some prudential Considerations; and knowing also that the continued Retaining of these Things, which the reforming Fathers designed gradually to cast off, has been more stumbling to the Friends, than ever it was gaining to the Enemies of the Reformation.</p></blockquote>

</figure><figure class="quote" id="q-47d8008cc9" data-kw="">
<blockquote><p>I would desire to persuade you to humility from this, according to the lesson Christ gives us, Matt. xi. 29, “Learn of me, for I am meek and lowly.” And the apostle makes singular use of this mystery of the abasement of the Majesty, to abate from our high esteem of ourselves, Phil. ii. 3-6. O should not the same mind be in us that was in Christ! God abased, man exalted,—how unsuitable are these, think you! God lowly in condition and disposition, and man, though base in condition, yet high in his deposition and in his own estimation! What more mysterious than God humbled? And what more monstrous than man proud? Truly, pride is the most deformed thing in a man, but in a Christian it is monstrous and prodigious.

If he did humble himself out of charity and love, who was so high and glorious, how should we humble ourselves out of necessity, who are so low and base? And out of charity and love too, to be conformed and like unto him! Nature may persuade the one, but Christianity teacheth the other,—to be lowly in mind, and esteem every one better than ourselves. To be meek, patient, long-suffering, reason may persuade it, upon the consideration of our own baseness, emptiness, frailty, and nothingness. But this lesson is taught in Christ’s school, not from that motive only,—the force of necessity, but from a higher motive,—the constraint of love to Jesus Christ,—“learn of me.” Suppose there were no necessity of reason in it, yet affection might be a stronger necessity to persuade conformity to him, and following his example, who became so low, and humbled himself to the death even for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary, or, A discovery made of those glorious privileges offered unto the penitent and faithful under the Gospel unfolding their freedom from death, condemnation, and the law, in forty sermons upon Romans, Chap. 8</cite>, (1670) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 374-75.</span></figcaption>

<blockquote><p>In that day five cities in the land of Egypt will speak the language of Canaan and swear by the Lord of hosts …” (Isaiah 19:18a)

Preaching on the above text, the Scottish Seceder, Alexander Moncrieff made the following deduction:

That, as it is the Duty of the Church and People of God, in the New Testament Times, to renew their national Vows and Covenants, tho’ they be but a few in Number compared with the Opposers of a Work of Reformation; so they may warrantably trust a promising God, that he will enable them to perform that Duty to the Praise of his Grace.</p></blockquote>

<blockquote><p>What an effect would be produced on an unbelieving world if a better spirit were more prevalent; if Churches, though distinguished by trivial peculiarities, regarded each other with brotherly affection; if one form of polity, admitting of fraternal correspondence, were embraced by all true Christians; and if the soldiers of the cross presented the appearance of one great army, all trained in the discipline of integrity and truth, all animated by the same spirit, and all displaying a united front to the common foe!

Now the Church is split up into countless sections; her divisions are fitted to make a most unfavourable impression on all who are without; her visible appearance, instead of being an inviting, and instructive, and edifying spectacle, is rather fitted to discourage, to puzzle, and to repel. She is now as a house divided against itself; her most valiant men of war, instead of bearing down with all their might on the enemy, often turn their arms against each other; and thus her energies are frequently expended in the strife of internal discord. No wonder, under these circumstances, that Christianity, in relation to the world lying in wickedness, has been so little aggressive.</p></blockquote>

v>

<blockquote><p>For by faith Abel offered unto God a greater sacrifice than Cain; by the which he obtained witness that he was righteous, God testifying of his gifts: by the which faith also he being dead, yet speaketh.” Hebrews 11:4 (Geneva Bible)

Hence we learn that the church militant is a mixed and compounded company of men – not of one sort, but true believers and hypocrites mingled together, as here in the very infancy of the church there was Cain worshipping in show as well as Abel that worshipped in truth. So it was in the infancy, so in her perpetual growth. And so it shall be in the last age of the church. The good shall never be quite separated from the bad, until Christ Himself do it at the last judgment. Goats shall always be mingled among the sheep, “till Christ the great shepherd do separate them himself” (Matt. 25:34). And he that imagines a perfect separation till then, imagines a fancy in his brain and such a church as cannot be found upon the earth.

This being so, let no man therefore be afraid to join himself to the visible church, neither let any that are in it go out of it, because the bad are mingled with the good; for so it has been always and ever will be. He then that will go out of a church because there be hypocrites in it must go out of the world, for such a church is not found but triumphant in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), pp 34-35.</span></figcaption>

<blockquote><p>The person who is a Covenanter because of conviction accepts the doctrines end principles of the Church, not merely because of the tradition or authority of the Church, but because he is convinced in his heart and mind that they really are the doctrines end principles of the word of God, the Holy Bible. His loyalty is a loyalty to the written word of God. …

This kind of Covenanter is not a reed shaken by the wind; he is established firmly in his heart. He knows both what he believes, and why he believes it. He can give real Bible reasons for his belief. As a member of the Covenanter Church he is convinced, honest, and faithful to his obligations, regardless of inconvenience, unpopularity or reproach. He will receive the reward of a conscientious and consistent Christian.</p></blockquote>

</figure><figure class="quote" id="q-4c98abbb44" data-kw="">
<blockquote><p>Some people have remained Covenanters just because of tradition. They attend services and follow the Covenanter manner of worship just because they are in the habit of doing so. They cannot give any real Bible reasons for their Covenanter faith and practice. If you ask them why they do not vote in political elections, they can only reply that voting is against the principles of the Covenanter Church. They are like the little girl who was asked why we do not have organs in our churches. She replied solemnly, ”We don’t because we’re Covenanters, and Covenanters don’t.” The person who is a Covenanter merely because of custom or tradition is not really a Covenanter at heart. His loyalty is not a conscientious loyalty to the truth of God; it is merely a blind loyalty to church tradition. This is a very poor reason for being a Covenanter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-g-vos.html">J. G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Why be a Covenanter? in Blue Banner Faith and Life</cite></span></figcaption>

<blockquote><p>In the midst of the Ten Years Conflict between the non-intrusionist party in the Church of Scotland and the British state, Robert S. Candlish explained that the non-intrusionists were contending for the headship of Christ over his church:

The principle for which we are contending has already been explained tonight – we are contending for the prerogatives of Christ’s Crown and the prerogatives of the office-bearers of his Church. There are two things which flow from this doctrine – that rulers should be subject to Christ, and that those under them should be free. Christ alone is the King and head of his Church. All we ask is spiritual independence – that each office-bearer in Christ’s Church should be left free in his own department. We seek no clerical power as has been falsely represented. […]

That is the great point for which we are called upon to contend – that Christ is King and Head of his Church. The Church of the Lord Jesus Christ is not the creature of the state; it is the creature of God, and independent of the state. The Church was not founded by the fiat of any earthly prince, but by the same mighty power which said, “Let there be light, and there was light.” The Church arose not as did Prelacy, from the cabals of princes […] but by the word of the living God, and is independent of political origin.</p></blockquote>

<blockquote><p>Our Covenanting forefathers were eminently honoured to contend for the crown-rights of the Redeemer. In their national vows, they plighted the allegiance of the nation to Him – and by those federal deeds, rulers and people were taken bound to consult for the promotion of Christ’s honour, and the interests of true religion, above any worldly interests. The laws passed in the reforming period in Britain were the embodiment of the grand fundamental principles of the Redeemer’s kingdom; and for a brief period, like a gleam of bright sunshine in the history of the nation, the doctrine was generally proclaimed, and widely respected, that Christ Jesus should reign supreme in his own house, and among his people, and that earthly rulers should yield Him all homage and subjection.</p></blockquote>

<blockquote><p>Although it has been sadly forgotten in recent times, the Covenanter position is that those who dissent from the doctrine and order of the Reformed Presbyterian Church cannot be accepted into communicant membership or admitted to the Lord’s Table. Alexander McLeod explains the rationale for this below:

174. How many kinds of censurable offences are there?

The scandalous offences are of three kinds:- heresy, which consists in maintaining errors contrary to the subordinate standards of the Church, and to the holy scriptures [Rom. 16:17] – Immorality [1 Cor. 5:11] and contempt of Church-order, which consists in untenderness to brethren, neglect of ordinances, disrespect to the ministry, and resistance to the authority of the Church [2 Thess. 3:6].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-mcleod.html">Alexander McLeod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ecclesiastical catechism, being a series of questions relative to the Christian church stated and answered with the scripture proofs</cite>, (3rd edn, New York, 1831), p. 94.</span></figcaption>

</figure><figure class="quote" id="q-eaf4794a01" data-kw="">
<blockquote><p>Although many today think that you can be Reformed while rejecting theocratic politics, the reality is that most modern “Reformed” people have accepted the Anabaptist view of church-state relations:

The doctrines respecting the total disunion of civil and religious matters, by which many are led away in present times’, were unheard of in the world till broached by the Anabaptists of Germany, a few years posterior to the Reformation; and, although I would not wish to brand any system of principles with infamy merely because of the men by whom they were advocated or the circumstances that gave them birth, I cannot help saying, that the origin of these doctrines would lead me to entertain respecting them a very great degree of suspicion, if not of absolute disgust. The sentiments of these German sectaries were of the wildest description. They undertook to carry the Reformation unspeakably farther than had been done by the Reformers. They pretended to found a new Church entirely purified from the alloy of this world — altogether spiritual and divine. On behalf of this Church, they professed to be armed against all opposition by celestial visions and the power of working miracles. Among the doctrines which they advocated were polygamy — perfect equality — the abolition of all distinctions arising from birth, rank, and wealth—and the utter uselessness among Christians of all magistracy, laws, and government.

They proceeded at length to propagate their doctrines throughout Germany by the sword, and their fanatical sect was not crushed till the blood of more than a hundred thousand of the German people had been shed. This, my friends, is the origin of the doctrines respecting the spirituality of the kingdom of Christ, and the entire disunion of the Church and State, which we hear so much extolled in present times. And I cannot help saying, that, for my own part, I would be filled with inexpressible wonder if I could believe that the bringing forth before the world of a great scriptural principle, affecting the whole character and prosperity of the Church of Christ, had been reserved by Divine Providence for a party of fanatics the most wild, enthusiastic, and ferocious that the world ever saw.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of civil establishments of religion in Reformed Presbyterian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-f58d648fcf" data-kw="">
<blockquote><p>Question 1: If multitudes and people externally Covenanted with God, though not internally, whom the Lord calls his people and chosen by him, Deuteronomy 7:6; Deuteronomy 10:15 be rightly constitute the Visible Church, as Mr Thomas Hooker granteth, then Kingdoms must be his Visible Church.

Answer: No doubt, Egypt, Assyria, all Nations, all the ends of the world, all the Kingdoms of this world are Prophesied to be the Kingdoms and the Covenant people of God, and the Lord challengeth them as his (Isaiah 19:25, blessed by Egypt my people) Isaiah 2:1-3; Psalm 22:27; Revelation 11:15; Psalm 96-98; Isaiah 42:10; Isaiah 49:7-8, 20-21; Song of Solomon 8:8; Acts 13:46, 47; Romans 15:8-12, must be visible Covenanted Churches of God, to whom the seals of the Covenant are due; But that none in Egypt, Assyria, of all the called Gentiles, though visibly and professedly in Covenant, and affirmed by the mouth of the Lord to be his people, the Sifter of the Jewish Church, and his Kingdoms, are members of the Visible Church, or hath right to membership and seals, except men judge them to be real converts, sound believers, and so internally called and chosen, is to prefer the judgment of men, to the Word of God. […] [T]here be Prophecies under the Messiah, that all the Kingdoms of the world, Revelation 11:15, Egypt, Assyria, Isaiah 19:25, all Nations, Isaiah 2:2, all the Gentiles, Isaiah 60, shall be the confederate people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 199-201.</span></figcaption>

99-201.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff58d648fcf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f58d648fcf.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/01/26/samuel-rutherford-on-covenanted-nations-in-the-new-testament-age/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-673436de2b" data-kw="">
<blockquote><p>It has pleased the Lord also, to bring you a degree further, that both the honourable Houses of Parliament, and many others, whose hearts the Lord has touched, have entered into a SOLEMN LEAGUE AND COVENANT, for performing such duties, as are judged necessary at this time, for the honour of God, and for the deliverance and preservation of the church and kingdom, which no doubt will prove a precious and powerful means of good, if the name of the most High God, be not by it taken in vain. But take heed, that it be not forgotten by them that have taken it, before it be taken by others. And therefore two things would be looked into. (1.) That although it should never be taken by others, yet it obliges such as have entered in covenant, and although the whole nation be bound to the same duties which you are bound unto, you have entered into a new obligation, which, if you shall forget or violate, will certainly be laid to your charge. Jeremiah reproves Israel not for the transgression of the Law, which yet commanded the same duties, but for violation of the covenant (Jer. 34). (2) That others be instructed and moved to enter into the same covenant. For if they who have entered in covenant shall not consider that it is a perpetual covenant never to be forgotten, or (which God forbid) shall forget, their supervenient obligation, and others shall refuse to enter in covenant, it will not only make a division in the church and kingdom, but shall be a ready way to bring on a greater wrath, than yet has been seen or felt, upon one sort for their perfidy, and upon the other for their neglect or obstinacy.</p></blockquote>

</figure><figure class="quote" id="q-1bfeae19da" data-kw="">
<blockquote><p>And first, just as all by most holy Baptism have been made members of Christ’s Kingdom and then received the covenant of eternal salvation, [1] so Your Royal Majesty will make a law that orders parents to educate and establish their children in Christ’s faith and obedience with great care, with a just penalty appointed for those who themselves infect their children with either false doctrine or bad morals or permit them to be infected by others. [2] Next, it must provide that they diligently make the Church’s catechism known to them when they are old enough to understand it. For unless the foundation of the Church is firmly laid in early childhood through the catechism of Christ, its upbuilding will proceed very poorly from then on. For those who do not labour with utmost zeal to instruct and train those whom they have consecrated to Christ the Lord in Baptism expose themselves to dire retribution. For those who neglect this when it is in their control snatch back the children whom they have consecrated to the Lord and hand them over to the dominion of Satan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 280.</span></figcaption>

<blockquote><p>When addressing the House of Commons, the Westminster divines pointed out that the “ignorant” were to be barred from communion. This is also taught in the Larger Catechism, Q&amp;A 173. There has, however, been some debate as to precisely what this refers to. Judging by other sources it would appear that “points of lesser concernment” referred to extra-confessional issues, at least this appears to be how the stricter Covenanters received the Westminster standards (see here). What is interesting to note here is that the divines thought that ignorance concerning the sacraments was enough to warrant suspension from the Lord’s Table:

The Assembly of Divines, having received an Order from this Honourable House, requiring them to expresse the particulars of that Ignorance &amp; Scandall, for which they conceive, that some persons ought to be suspended from the communion, do humbly present their sense both of the one &amp; of the other, in manner following.

[1.] By Ignorance, we mean, not all weaknesse of Knowledge, or the want of knowledge of points of lesser concernment to all sorts: But a want of a competent measure of Understanding in the Grounds &amp; principles of Religion layd down in the holy Scriptures, particularly in these, concerning God, the Father, Sonne, &amp; Holy Ghost; the state of man by Creation, &amp; by his fall; the Redemption by Jesus Christ; the way &amp; means to apply Christ &amp; his benefits; the nature &amp; necessity of Faith, Repentance &amp; a godly life; the nature &amp; use of the Sacraments; &amp; the condition of man after this life. […]

3. When any are found guilty of such Ignorance, or such Scandalls, we humbly conceive they ought to be suspended from the Communion, until they give sufficient proofe of their knowledge &amp; of their Repentance: The tryall of all which, we humbly conceive, is to be referred to the Eldership of the particular Congregation, of which any are reputed members; it being impossible to make such an enumeration of all particulars, as may be universally applicable to all persons and cases.

4. In this we have been the more bold to present our humble desires to the Honourable Houses, because other Reformed churches do in this manner take a triall of the knowledge of all those that would come to the Lords Supper, before they do admit them, &amp; withhold such as are found ignorant, as also those that are found scandalous, from the sacrament, untill they have sufficient proofe of the knowledge of the one sort, &amp; the Repentance of the other.

5. In the managing of all which, the Eldership is to proceed with all christian moderation &amp; prudence: And in case any person should be injured herein, there is a Remedy by the subordination of Assemblyes.

William Twisse prolocutor

Henry Roborough. Scriba

Adoniram Byfield scriba</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/the-westminster-divines.html">The Westminster divines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Honourable the House of Commons assembled in Parliament, 25 Mar. 1645 in The minutes and papers of the Westminster Assembly 1643-1652</cite>, ed. Chad VanDixhoorn (5 vols, Oxford: Oxford University Press, 2012), v, 182-4.</span></figcaption>

<blockquote><p>Jephtha Williams was gathered to his people August 19th, 1851, in the 77th year of his age.

This exemplary Christian acceded to the Reformed Presbyterian Church, with his wife, thirty-two years ago, in the Congregation of Coldenham. It was then under the care of the Rev. Mr. Willson. They were both greatly respected members of Goodwill Presbyterian Congregation, in full communion. In that church they had been both held as slaves, in Long Island, and had bought their own freedom for $.500. Jephtha, among his Presbyterian brethren, heard it said that Covenanters were a very bad people, “turners of the world upside down.” Curiosity led, him to hear the Rev. James Milligan, then pastor of the Coldenham Congregation. The preaching pleased him greatly, as evangelical and edifying. He expected, during the interval of public worship, to find out, by the talk of the people, their evil designs as traitors to the commonwealth. The Presbyterians then held slaves. [It is not clear why this sentence is here – DR] He was, however, disappointed, as the conversation of the Covenanters was on religious topics altogether, such as the worship of the forenoon. Of that he approved, of course, and could not but contrast it with the talk of his Goodwill brethren on politics, harvests, butter, cows, calves, dollars, and cents. But his mind had been so prejudiced by the slanders of many, that he thought it all hypocrisy; still, he began to think that possibly Covenanters might be Christians. He came often to hear the word preached, sought acquaintance with the members, and read the terms of communion. He requested the pastor of the Coldenham Congregation to point out to him the alterations that the Presbyterian General Assembly had made in the Westminster Confession of Faith, and give him the history of the National Covenant of Scotland, and of the Solemn League and Covenant. He asked whether coloured members would be buried in our grave-yard, — “for,” he said, “we are not permitted to bury our dead in Goodwill burying-ground.” It seems almost incredible that any who profess to be the disciples of the meek and lowly Jesus, would carry the cruelties of slavery down to “the house appointed for all living.” But they do; yes, even those who call themselves orthodox Presbyterians! After much searching of heart, consultation with his intelligent and very exemplary wife, and prayer, he and she applied to session, gave great satisfaction when examined, and were enrolled among Christ’s witnesses.

For thirty-two years he and his household “have adorned the doctrine of God our Saviour.” His conversation, prayer, and example, have been blessed of God to bring into the church more than sixty souls of his coloured brethren, and thirteen families, nine of which are in his own family. No ne of all these in Orange county have ever been subjected to church censure. For thirty-two years, we have good reason for believing, that family worship, night and morning, was never omitted in his household.

He died in the full assurance of faith – on his death-bed “speaking peace to all his seed.” Is slavery better than the lot of these disciples of Christ? A large funeral testified the respect in which he was held by his brethren and neighbours.

J. R. W.</p></blockquote>

</figure><figure class="quote" id="q-132cff52f5" data-kw="">
<blockquote><p>First, then, the difference betwixt the Old and New Testament dispensations, with regard to extent, is deserving of marked attention. The former was greatly restricted; it was almost exclusively confined to one people; and to this limitation the members of the church had been long accustomed. The new dispensation, again, was possessed of an opposite character; it was distinguished by a universal extension of its privileges; it threw down the middle wall of partition by which the Jews were kept separate from the other nations of the earth, broadly maintained that there was no difference between the Jew and the Gentile, and opened its arms to Greek and Jew, Barbarian and Scythian, bond and free. But the previous state of things had given rise to deep-seated prejudice in favour of exclusive privilege, which it was no easy matter to uproot. […]

They were Jews, and were manifestly reluctant to descend to a common level with others, in regard to the enjoyment of religious privilege; a miracle was even required to be wrought to convince an apostle that God is no respector [sic] of persons, and to carry home to him the lesson, “What God hath cleansed, that call not thou common.” If such narrow views were entertained by those who had the best opportunities of correct information, we need not wonder at the bigoted prejudices of others. The preaching of the Gospel to the Gentiles awakened the jealously of the Jews, and to such a length did they carry their opposition, that they even persecuted the preachers, “forbidding them to speak to the Gentiles, that they might be saved.” […]

Considering such a state of things, it is surely not difficult to account for the use of terms of extensive import, in speaking of the blessings of the new economy. To mark the contrast, the strongest language that could be employed because necessary. In these circumstances, we can conceive of nothing more natural than to use the phrases all men, all the world, &amp;c., to denote men in general, without regard to national distinction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The atonement and intercession of Jesus Christ</cite>, (New York, 1863), pp 214-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-6046b3a457" data-kw="">
<blockquote><p>Do we want Jesus Christ to declare us his own? Do we want him to be our king? Then, we must accept his doctrine. We must be willing to be led as he sees fit, for him to become our strength and refuge. Then we can boast that Jesus Christ is our king. Moreover, we need to recognize that this doctrine is aimed at us, to reprove and bring us in line. For if that fails to occur, then we can never benefit from the school of Jesus Christ. Let anyone, therefore, who is content to remain in his natural state, look for a master other than God’s Son. For if we cannot let go of our personal interests and foolish fantasies, we can never be taught by him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the book of Micah</cite>, trans. and ed. B. W. Farley (1551; Phillipsburg, 2003), p. 208.</span></figcaption>

<blockquote><p>I. The first thing is, to inquire into the scripture-account of the character and duty of a faithful minister of Christ.

1. He is one who speaks the things which become sound doctrine, as the apostle exhorts Titus, chap. ii. 1. “But speak thou the things which become sound doctrine.” […] And in order to our thus speaking the things which become sound doctrine, it is necessary that we be well acquainted with the holy scriptures, with approven systems of divinity, and particularly with our own standards, our excellent Confession of Faith, and catechisms, which may well be called forms of sound words.</p></blockquote>

</figure><figure class="quote" id="q-af45488cdb" data-kw="">
<blockquote><p>Now let us consider “when” this exaltation occurs: when “peoples flow to it,” saying, Let us go up to the mountain of God, that he may teach us his ways and we may walk in his paths [Micah 4:1-2]. Micah’s intention in saying that peoples shall flow to it, is to show there is a great difference between the Church that was under the Law, and the Church that will exist at the coming and manifestation of our Lord Jesus Christ. For in Micah’s time, there was only one nation whom God had chosen; only Abraham’s children had been elected to hear the doctrine of salvation. It was to them alone in particular that God had said: “I am [the Lord] you God, who has brought you out of the land of Egypt” [Exodus 20:2]. That is why he was called in those days “the God of Abraham, of Isaac, and of Jacob” [Exodus 3:6]. But now Micah says that God will sound a trumpet that will be heard to the ends of the earth, just as Psalm 2 declared that Jesus Christ has been consecrated King and Lord of all, and that his Father has bestowed the entire earth, from the rising to the setting of the sun, on him as his posterity [Psalm 2:7-9]. That is the dignity that is entailed in Micah’s declaration that all peoples shall come together on the mountain of Zion, at the house of God [Micah 4:2].

Now this results in an important affirmation of our faith. For we can see how patient God was in calling us to a knowledge of the Gospel. For our fathers were poor pagans, without a covenant with God. They were estranged from his Church. The promises of salvation completely excluded them, as Saint Paul points out in Ephesians 2[:11-12]. Yet, today, we are united with Abraham and his lineage; we have been grafted into the people of God. How did that come about? Through the Gospel. Now, if this had happened, or had come about, without God having prophesied that it would, we could say: “Ah! it happened by chance!” But when we hear that it was proclaimed from of old, that is a true boost to our faith. For God, desirous of a special people among whom his Law might be preached, nonetheless proclaimed that a time would come when the doctrine of salvation would be revealed to all the world; that peoples would flow to it; that a true amity and understanding of faith would exist; that peoples formerly dispersed and separated from each other by great distances would unite together; and that wherever walls had kept them apart, those walls would come down.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now let us consider “when” this exaltation occurs: when “peoples flow to it,” saying, Let us go up to the mountain of God, that he may teach us his ways and we may walk in his paths [Micah 4:1-2]. Micah’s intention in saying that peoples shall flow to it, is to show there is a great difference between the Church that was under the Law, and the Church that will exist at the coming and manifestation of our Lord Jesus Christ. For in Micah’s time, there was only one nation whom God had chosen; only Abraham’s children had been elected to hear the doctrine of salvation. It was to them alone in particular that God had said: “I am [the Lord] you God, who has brought you out of the land of Egypt” [Exodus 20:2]. That is why he was called in those days “the God of Abraham, of Isaac, and of Jacob” [Exodus 3:6]. But now Micah says that God will sound a trumpet that will be heard to the ends of the earth, just as Psalm 2 declared that Jesus Christ has been consecrated King and Lord of all, and that his Father has bestowed the entire earth, from the rising to the setting of the sun, on him as his posterity [Psalm 2:7-9]. That is the dignity that is entailed in Micah’s declaration that all peoples shall come together on the mountain of Zion, at the house of God [Micah 4:2].

Now this results in an important affirmation of our faith. For we can see how patient God was in calling us to a knowledge of the Gospel. For our fathers were poor pagans, without a covenant with God. They were estranged from his Church. The promises of salvation completely excluded them, as Saint Paul points out in Ephesians 2[:11-12]. Yet, today, we are united with Abraham and his lineage; we have been grafted into the people of God. How did that come about? Through the Gospel. Now, if this had happened, or had come about, without God having prophesied that it would, we could say: “Ah! it happened by chance!” But when we hear that it was proclaimed from of old, that is a true boost to our faith. For God, desirous of a special people among whom his Law might be preached, nonetheless proclaimed that a time would come when the doctrine of salvation would be revealed to all the world; that peoples would flow to it; that a true amity and understanding of faith would exist; that peoples formerly dispersed and separated from each other by great distances would unite together; and that wherever walls had kept them apart, those walls would come down.”

<blockquote><p>But in the execution of this punishment there must a great consideration be had and observed; first, of the persons; then, of the errors; and, lastly, of the penalties. For in persons there is great diversity: because there are some standard-bearers, and heady grand captains, which are stout, hypocrites, and full of tongue, and therefore the aptest for to seduce; who, falling headlong without amendment to their own destruction, do with themselves draw other[s] into danger. They must by all means be bridled and kept under, as plagues to the church; lest, like a canker, they spread all over. Again, there are some silly seduced souls, made fools by other men, which err not of malice nor stubborn stomach, but do repent and amend in time. These the magistrate must not straightway condemn, but pray to the Lord, and bear with their error, and teach them in the spirit of gentleness, until they be brought to a better mind.

Moreover, in erroneous doctrines some are more intolerable than other some are. Some there be so wicked and blasphemous, that they are unworthy to be heard, much less to be done. Some there are which do directly and openly tend to the overthrow of the commonweal, unless they be in time appeased and resisted. But those crimes that are brought in and accused, ought first to be by the scripture and manifest truth convinced to be such as they are said to be. When the truth is known, and manifest proofs of scripture alleged, then is it lawful most sharply to punish those blasphemers of God and overthrowers of the church and commonweal. But a light and easier penalty must be set on the heads of them whose offence consisteth in light and smaller errors: for some do err so, that by their error God is not blasphemed, the church not subverted, nor the commonweal in any danger at all. Where, by the way, every one must think of that saying of the apostle: “Bear ye one another’s burden.” And again: “The weak in faith received ye, not to the doubtfulness of questions.”

Furthermore, in punishment and penalties there is great difference. They that err stubbornly, and do their endeavour to draw in and keep other men in their errors, blasphemers, troublers, and subverters of churches, may by law be put to death. But it followeth not thereupon, that every one which erreth must therefore by and by suffer loss of his life. […] And Josue, before he made open war to be proclaimed upon the children of Reuben, did first by embassage command them to dig down the altar, which they seemed to have made contrary to the law of the Lord. The emperor Justinian also granted pardon to them which repented, and turned to a sounder opinion, Constitut. 109. Moreover, Josias did not utterly kill all them that were wrapped in error and idolatry, but those especially that were incurable, and would not recant. The magistrate therefore must wisely moderate the matter, and be very circumspect in punishing offenders.</p></blockquote>

<blockquote><p>Here [London] you may likewise see a Reverend Assembly of grave and learned Divines, who daily wait upon the Angel in the Mount, to receive from him the lively Oracles, and the pattern of God’s house, to present unto you. All these are of our own Nation; and with them you may see the Honourable, reverend, and learned Commissioners of the Church of Scotland; and in them behold the wisdom and affection of their whole Church and Nation, willing to live and die with us.

All these you may behold in one view; and which is more, you may behold them all of one heart, and one mind, after so many plots and conspiracies to divide them one from another, and thereby to ruin them all: And which is yet more, you may see them all met together this day on purpose, both to praise God for this union, and to rejoice in it, and to hold it out to all the world, and thereby to testify, that as one man they will live and die together in this common cause of God, of our Lord Jesus Christ, his Church, and these three kingdoms. O beloved! how beautiful is the face of this Assembly?</p></blockquote>

<blockquote><p>Among “evangelical Calvinists” Henry Scougal’s book, The life of God in the soul of man, is held in high esteem – largely owing to the book’s influence upon George Whitefield. The Scottish Seceders, however, regarded it as a work that was harmful to the gospel:

Socinian and Arminian doctrine is now in such general request, that some have ventured openly to recommend these principles without being noticed by any of the judicatories of the church. Mr. William Wishart, principal of the college of Edinburgh, has recommended Dr. Scougal’s life of God in the soul of man, upon which Mr. Whitefield’s experiences are founded; a book calculated to lead off from faith in the righteousness of Christ without us, to a righteousness within us, and inward sensations, as the ground of our pardon and acceptance before God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Among “evangelical Calvinists” Henry Scougal’s book, The life of God in the soul of man, is held in high esteem – largely owing to the book’s influence upon George Whitefield. The Scottish Seceders, however, regarded it as a work that was harmful to the gospel:

Socinian and Arminian doctrine is now in such general request, that some have ventured openly to recommend these principles without being noticed by any of the judicatories of the church. Mr. William Wishart, principal of the college of Edinburgh, has recommended Dr. Scougal’s life of God in the soul of man, upon which Mr. Whitefield’s experiences are founded; a book calculated to lead off from faith in the righteousness of Christ without us, to a righteousness within us, and inward sensations, as the ground of our pardon and acceptance before God.”

<blockquote><p>Where the Lord does not dwell, peace will not inhabit. How frequently may we observe, in their family connexions, discord and enmity between man and wife, unkind parents, disobedient children, tyrannical masters, and treacherous servants? Thus they live, “hateful in themselves, and hating one another.” If they have what the world accounts prosperity, their hard master, Satan, so works upon their evil dispositions, that they can derive no real comfort.</p></blockquote>

<blockquote><p>On the 30 April 1845, the Edinburgh Presbytery of the Reformed Presbyterian Church of Scotland (Covenanter) passed a number of resolutions against chattel slavery and fellowship with slaveholding churches. The eighth resolution contains the following condemnation of the practice of racial segregation in the churches of America:

8. That while this Court express these views in reference to American slavery and the duties of the Churches, they cannot refrain from expressing their sympathy, not only with the oppressed slaves, but with the people of colour generally in that land, who, under the influence of cruel prejudices and unjust laws, are subjected to all manner of hardships and indignities in the whole intercourse of life.

Nor can this Court refrain from condemning the conduct of many of the churches in the United States, in reference to this matter, inasmuch as they sanction and strengthen these cruel prejudices and unjust laws, by preventing persons of colour, recognised as members of the church, from sitting in the same pews, and from taking their seats at the Lord’s table in company with their white brethren; thus in their public assemblies having respect to persons committing sin, and being convinced of the law as transgressors; and it is the conviction of this Court, that churches acting in this cruel and sinful manner, render themselves unworthy of fellowship with Christians and Christian churches, who desire to adhere consistently to the laws of Christ, the alone King and Head of his Church, with whom there is neither Greek nor Jew, circumcision nor uncircumcision, barbarian, Scythian, bond nor free; but himself all, and in all.

Joseph Wilson, Moderator.

Wm. Anderson, Clerk.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edinburgh-reformed-presbytery.html">Edinburgh Reformed Presbytery</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Deliverance of the Reformed Presbytery of Edinburgh on American slavery and church-fellowship with slave-holders (Edinburgh, 1845), p. 4.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

<blockquote><p>In 1857 the minister of Londonderry Reformed Presbyterian Church, the Revd Robert Nevin, visited the American Covenanter Synod. The letter below informs us of the reaction of the Americans to his visit and their interest in Roman Catholic mission and covenant renewal:

To the Moderator and the members of the Reformed Presbyterian Synod of Ireland.

Dear brethren,

[…] Your brother, Rev. R. Nevin, whose intention of visiting our land you mention, is present with us at our synodical meeting. It gives us great pleasure to say that we have been comforted by his appearing among us. In an address, which at our request he kindly delivered, he gave such and encouraging account of your estate – of the success of your various schemes for adorning the interests of the covenanted cause, especially your mission among the Roman Catholic population and of the fruits of your renewal of the covenants, as made our hearts glad. To us in our trials and difficulties, his words were cheering, and in fact that his kind and seasonable counsel was suited to animate us with a firmer purpose to go forward with the solemn work to which we had assigned the first two days of our meeting. […]

Samuel Sterrit, Mod

John G. Boyd, Clerk</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-sterrit.html">Samuel Sterrit</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Irish Synod, 23 June 1857 (Reformed Presbyterian Historical Library, Knockbracken, American correspondence, no. 19).</cite></span></figcaption>

<blockquote><p>In the midst of his critique of the Presbyterian Church in Ireland, the Revd James Kennedy, the Covenanter minister at Limavady (who later moved to America), pointed out that the PCI was inconsistent in professing adherence to the Westminster Standards while, at the same time, admitting those of erroneous sentiments into their pulpits:

Another step in reform we would endeavour to bring to our brethren to take would be the ceasing to employ to teach their congregations men whom in consistency they must consider to be erroneous in sentiment and principle. We have already referred to the fact, that members of the Assembly freely invite to their pulpits, to teach their people, Congregationalists and Baptists; and the time is not long past when even Methodists – known to be of Arminian sentiments – were to be found occasionally in the pulpits of Presbyterian ministers. […]

The Presbyterians of Ireland in the times of the Covenant acted not thus, for as [James Seaton] Reid well shews, when Arminians and Baptists attempted to shew their face in any locality, the most strenuous efforts were made to suppress their erroneous teachings. All this may be thought very uncharitable to Baptists, but really after all, men who deny that we are even baptized – hold us an unbaptized mass of unconverted professors, and must in consistency deny that we have a sacrament at all, and thus virtually unchurch us, deserve little charity at our hands, and we have no sympathy with the inconsistency of the men who by patronising such, pull Presbyterianism down with the one hand while they build it up with the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-kennedy.html">James Kennedy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tekel. The Reformed Presbyterian Church and the General Assembly of the Presbyterian Church in Ireland weighed in the balance of truth</cite>, (Londonderry, 1858), pp 24-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church.html">The Church</a></span></div>

— James Kennedy, Tekel. The Reformed Presbyterian Church and the General Assembly of the Presbyterian Church in Ireland weighed in the balance of truth, (Londonderry, 1858), pp 24-5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+midst+of+his+critique+of+the+Presbyterian+Church+in+Ireland%2C+the+Revd+James+Kennedy%2C+the+Covenanter+minister+at+Limavady+%28who+later+moved+to+America%29%2C+pointed+out+that+the+PCI+was+inconsistent+in+professing+adherence+to+the+Westminster+Standards+while%2C+at+the+same+time%2C+admitting+those+of+erroneous+sentiments+into+their+pulpits%3A%0A%0AAnother+step+in+reform+we+would+endeavour+to+bring+to+our+brethren+to+take+would+be+the+ceasing+to+employ+to+teach+their+congregations+men+whom+in+consistency+they+must+consider+to+be+erroneous+in+sentiment+and+principle.+We+have+already+referred+to+the+fact%2C+that+members+of+the+Assembly+freely+invite+to+their+pulpits%2C+to+teach+their+people%2C+Congregationalists+and+Baptists%3B+and+the+time+is+not+long+past+when+even+Methodists+%E2%80%93+known+to+be+of+Arminian+sentiments+%E2%80%93+were+to+be+found+occasionally+in+the+pulpits+of+Presbyterian+ministers.+%5B%E2%80%A6%5D%0A%0AThe+Presbyterians+of+Ireland+in+the+times+of+the+Covenant+acted+not+thus%2C+for+as+%5BJames+Seaton%5D+Reid+well+shews%2C+when+Arminians+and+Baptists+attempted+to+shew+their+face+in+any+locality%2C+the+most+strenuous+efforts+were+made+to+suppress+their+erroneous+teachings.+All+this+may+be+thought+very+uncharitable+to+Baptists%2C+but+really+after+all%2C+men+who+deny+that+we+are+even+baptized+%E2%80%93+hold+us+an+unbaptized+mass+of+unconverted+professors%2C+and+must+in+consistency+deny+that+we+have+a+sacrament+at+all%2C+and+thus+virtually+unchurch+us%2C+deserve+little+charity+at+our+hands%2C+and+we+have+no+sympathy+with+the+inconsistency+of+the+men+who+by+patronising+such%2C+pull+Presbyterianism+down+with+the+one+hand+while+they+build+it+up+with+the+other.%E2%80%9D%0A%0A%E2%80%94+James+Ken <blockquote><p>24. And let us consider one another, etc. I doubt not but that he addresses the Jews especially in this exhortation. It is well­known how great was the arrogance of that nation; being the posterity of Abraham, they boasted that they alone, to the exclusion of all others, had been chosen by the Lord to inherit the covenant of eternal life. Inflated by such a privilege, they despised other nations, and wished to be thought as being alone in the Church of God; nay, they superciliously arrogated to themselves the name of being The Church. It was necessary for the Apostles to labor much to correct this pride; and this, in my judgment, is what the Apostle is doing here, in order that the Jews might not bear it ill that the Gentiles were associated with them and united as one body in the Church.

And first, indeed, he says, Let us consider one another; for God was then gathering a Church both from the Jews and from the Gentiles, between whom there had always been a great discord, so that their union was like the combination of fire and water. Hence the Jews recoiled from this, for they thought it a great indignity that the Gentiles, should be made equal with them. To this goad of wicked emulation which pricked them, the Apostle sets up another in opposition to it, even that of love; or the word παροξυσμὸς, which he uses, signifies the ardor of contention. Then that the Jews might not be inflamed with envy, and be led into contention, the Apostle exhorts them to a godly emulation, even to stimulate one another to love.

25. Not forsaking the assembling of ourselves together, etc. This confirms the view that has been given. The composition of the Greek word ought to be noticed; for ἐπὶ signifies an addition; then ἐπισυναγωγὴ, assembling together, means a congregation increased by additions. The wall of partition having been pulled down, God was then gathering those as his children who had been aliens from the Church; so the Gentiles were a new and unwonted addition to the Church. This the Jews regarded as a reproach to them, so that many made a secession from the Church, thinking that such a mixture afforded them a just excuse; nor could they be easily induced to surrender their own right; and further, they considered the right of adoption as peculiar, and as belonging exclusively to themselves. The Apostle, therefore, warns them, lest this equality should provoke them to forsake the Church; and that he might not seem to warn them for no reason, he mentions that this neglect was common to many.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p., 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 239-40.</span></figcaption>

<blockquote><p>We are servants and not lords. I see never a word in this text, nay, in all the scripture that the Master of the feast sent out lords to woo home his bride; He “sent out His servants,” but not His lords. Read all the Bible from the beginning to the ending, you shall not find it. Daft men may dispute, and by respect may carry it away; but read all the Old and New Testament both, and let me see if ever this lord prelate, or that lord bishop, was sent to woo home his bride.</p></blockquote>

</figure><figure class="quote" id="q-4c390f119c" data-kw="">
<blockquote><p>You have state yourselves public witnesses for Jesus Christ, who profess to adhere to, and propagate his injured truths, and to commemorate with thankfulness the remarkable mercies, which he has bestowed on our Church and Nation, and to testify against and mourn over our own and our fathers’ fearful backsliding from that Covenanted work of Reformation once attained in our land. See that you be judicious, upright, constant and faithful in your profession. I now approach death heartily satisfied, with our excellent Westminster Confession of Faith, Catechisms and Form of Church Government, and cordially adhering to these Covenants, by which our fathers solemnly bound themselves and their posterity to profess the Doctrines and practice the duties therein contained. […] Study to see everything with your own eyes but never indulge and itch after NOVELTIES! Most of those which are now esteemed such, are nothing but OLD ERRORS which were long ago justly refuted, varnished over with some new expressions. If I mistake not the Churches are entering into a fearful cloud of apostacy and trouble! But he that endures to the end shall be saved. Be ye faithful unto death and Christ shall give you a crown of life.</p></blockquote>

<blockquote><p>When discussing how the covenants of works and grace differ, John Cameron argued that the promised reward of the first covenant was eternal earthly life, as opposed to eternal heavenly life. Although we dissent from this opinion, we post it out of historical interest:

9 Thesis. …

5 They differ in the Promise; In the Covenant of Nature, eternal and blessed life is promised, but yet animal life, to be lived in Paradise: but in the Covenant of Grace a heavenly and spiritual life is promised.

6 They differ in the manner of Sanction or ratification. In the Covenant of Nature there was no Mediator; hence the Covenant of Nature was promised before it was published. But the Covenant of Grace was first promised, and long after was published and ratified in the blood of the Son of God.</p></blockquote>

</figure><figure class="quote" id="q-ebe2978cc4" data-kw="">
<blockquote><p>Howbeit, as the first Adam, standing as head and representative of all his natural seed, entered into the first covenant with God, accepting the promise thereof, upon the terms and condition therein proposed, which he engaged to fulfil; so our Lord Jesus standing as second Adam, head and representative of the particular persons of lost mankind, by name elected to life, and given to him as his spiritual seed, entered into the second covenant with his Father; accepting the promises thereof, upon the terms and condition therein proposed; consenting and engaging to fulfil the same, for them. And thus the covenant of grace was made, and concluded, betwixt the Father and Christ the second Adam, from all eternity; being the second covenant, in respect of order and manifestation to the world, though it was first in being: 1 Cor. xv. 47, “The second man is the Lord from heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 412.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-f89e222b04" data-kw="">
<blockquote><p>The grounds and sources of holy consolation, are especially the following: God in Christ, with all his glorious perfections, as a God of love, grace, and mercy, and as the God and portion of the saints; Christ, in his glorious Person, righteousness, fullness, offices, and relations, or Christ living in them, and living for them; the Holy Spirit, as inhabiting, quickening, sanctifying, and sealing them, and as the earnest of their eternal inheritance; the covenant of grace, as well ordered in all things and sure, according to which, Jehovah, Father, Son, and. Holy Ghost, is their God, and they are his people, his peculiar people; the infinite atonement, the continual intercession, the supreme dominion, the inviolable faithfulness, and the gracious presence, of the Lord Jesus, who is given for a covenant of the people; and the ordinances, doctrines, promises, and offers, of his gospel, with the peremptory commandment, given to sinners in common, to believe on him: these are the leading, and the immediate grounds, upon which, the saints do by faith, build their comfort; and they are, at the same time, the sources, from which, by the exercise of faith, they derive their consolation.

Besides these, their faith and sense of the pardon of their sins, of the acceptance of their persons as righteous, of their adoption, of their sanctification, and of the witnessing of the blessed Spirit, are matter of consolation to them; and so is the lively exercise of all the graces of the Holy Spirit, especially of faith, hope, and love. The comfort of justification, because it is founded upon a righteousness which is perfect, and always the same, is more stable and permanent, than that of sanctification. The great things, which believers have in possession, and the greater, which they have in hope, are the sustenance of their consolation.

The suitableness of those inestimable blessings to their hearts, together with their sense of personal interest in them, affords them unspeakable joy. As to their experiences and evidences of grace, these are, strictly speaking, not grounds, upon which they build their comfort; but they are proofs, of their saving interest in those grounds of consolation, above mentioned, as well as, encouragements to build their comfort upon them; and so, they are matter of consolation to their souls. The most comfortable of the saints; are they who, trusting at all times in the second Adam. as given for a covenant to them, can think of all dispensations, of all conditions, and of all duties, with comfort. They who have the love of Christ displayed in the covenant of grace, most constantly in their view, and most frequently warm on their heart; are of all believers, the most free from perplexing doubts and fears.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh, 1814), pp 19-20.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

n+that+of+sanctification.+The+great+things%2C+which+believers+have+in+possession%2C+and+the+greater%2C+which+they+have+in+hope%2C+are+the+sustenance+of+their+consolation.%0A%0AThe+suitableness+of+those+inestimable+blessings+to+their+hearts%2C+together+with+their+sense+of+personal+interest+in+them%2C+affords+them+unspeakable+joy.+As+to+their+experiences+and+evidences+of+grace%2C+these+are%2C+strictly+speaking%2C+not+grounds%2C+upon+which+they+build+their+comfort%3B+but+they+are+proofs%2C+of+their+saving+interest+in+those+grounds+of+consolation%2C+above+mentioned%2C+as+well+as%2C+encouragements+to+build+their+comfort+upon+them%3B+and+so%2C+they+are+matter+of+consolation+to+their+souls.+The+most+comfortable+of+the+saints%3B+are+they+who%2C+trusting+at+all+times+in+the+second+Adam.+as+given+for+a+covenant+to+them%2C+can+think+of+all+dispensations%2C+of+all+conditions%2C+and+of+all+duties%2C+with+comfort.+They+who+have+the+love+of+Christ+displayed+in+the+covenant+of+grace%2C+most+constantly+in+their+view%2C+and+most+frequently+warm+on+their+heart%3B+are+of+all+believers%2C+the+most+free+from+perplexing+doubts+and+fears.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+of+Spiritual+Comfort%2C+%282nd+edn%2C+Edinburgh%2C+1814%29%2C+pp+19-20.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff89e222b04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f89e222b04.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/10/john-colquhoun-on-spiritual-consolation-and-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>21 Thesis.

… The foundation and the Mediator of the Covenant of Grace is our Lord Jesus Christ; but either as one to be incarnate, to be crucified, and to be raised from the dead; or as one being incarnate, being crucified and being truly raised from the dead, for never any had his sins remitted, but in him alone, who is yesterday, and to day and for ever, Jesus Christ, true God and true man. Therefore although he was God only before his incarnation, notwithstanding hitherto he was no other wise a Mediator, then as God about to take upon him our flesh, and if it to perform the whole mystery of our Redemption; and hence it is, he is called the Lamb of God, slain from before the foundations of the world; and the Fathers were saved by his Grace, even as we our selves are.

22 Thesis.

But although the Son of God, before he manifested himself in the flesh, was on God’s account (to whom future things are present) therefore a Mediator because to come, and therefore truly through him were sins remitted; By his Spirit did men both teach, and were taught; the Church by him was rightly governed; howbeit, the way and manner of his mediation was propounded at the first more darkly; afterwards the force and efficacy of it became yet less: and lastly, it redounded but to a very few.</p></blockquote>

<blockquote><p>Use of Instruction, That there may be an happy reconciliation and accord between God’s grace in forgiving, and man’s duty in repenting, one need not be preached to justly out the other. All error is an extremity of some truth, and therefore it is hard to discover truth, because its difficult to find out where the bounds are, that truth parts from error. Let not therefore a Christian so rely upon his repentance, as if there were no Covenant of grace, no blood of Christ to procure an atonement: so neither let him extoll these causes to the extinguishing of his duties.</p></blockquote>

<blockquote><p>And, first, as to the Nature of this solemn Part of religious Worship, it is to be observed, in the first Place, that we are not to put our personal Covenanting, or National Covenants, in the Room of the Covenant of Grace: Personal Covenanting and national Covenanting are of the same Nature and Kind, and differ only, as the one is transacted by Persons singly and separately considered, and the other by man Persons jointly in a Body: But many mismanage personal Covenanting, and likeways national Covenanting; for too many apprehend, that God, in the Word, declares himself willing to be our God upon certain Terms or Conditions to be performed by us, different from believing the free Promise of the Gospel with Application to ourselves; and therefore they do accordingly make a Covenant with God, taking him for their God upon those Terms to be by them performed in the Strength of Grace, promising and vowing that, if God will be their God, pardon their Sins, and save their Souls, they will, for their Part, be his People, faithfully serve him all the Days of their Lives, watching against all known Sin, and performing every known Duty.

There are some Mistakes here we are to beware of. In the first Place, this is to confound and mingle the Covenant of Grace and our Covenant of Duty together, as if they were the same: The Covenant of Grace was made from Eternity between the Father and the Son: Our Covenant of Duty is to be made when we have taken hold of God’s Covenant of Grace, and never till then are we suitably prepared for this solemn Work.

(2.) This is to bring in ourselves as Parties transacting in the Covenant of Grace. Whereas Christ alone, as the second Adam, was the Party-Contractor in that Covenant upon Man’s Side, as appears from the 89 Psalm throughout. God never did, nor ever will transact with any Sinner of Adam’s Family. There is nothing we can perform, nothing we can implement in this Matter: And how then can we be Transactors in the Covenant of Grace? His Holiness will not permit, his Justice will not allow, his infinite Wisdom will not admit of a Transaction with any Sinner at first Hand.

But (3.) this would be to bring in ourselves, our Doings, or what we are helped to do by Grace, into the conditionary Part of the Covenant of Grace, and so to overthrow the Doctrine of free Grace, to take Christ’s Work our of his Hand, to subvert the only Foundation of the Faith and Hope of perishing Souls, and to disparage the Righteousness of Christ the Second Adam, which is the only proper and real Condition of the Covenant of Grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-moncrieff.html">Alexander Moncrieff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of National Covenanting Explained: In Some Sermons Preached at the Renovation of Our Covenants, National and Solemn League, in the Bond Adapted to our Present Situation and Circumstances in this Period, by the Associate Presbytery, at Abernethy, in the Month of July 1744</cite>, (Edinburgh: David Duncan, 1747), pp 31-32.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And, first, as to the Nature of this solemn Part of religious Worship, it is to be observed, in the first Place, that we are not to put our personal Covenanting, or National Covenants, in the Room of the Covenant of Grace: Personal Covenanting and national Covenanting are of the same Nature and Kind, and differ only, as the one is transacted by Persons singly and separately considered, and the other by man Persons jointly in a Body: But many mismanage personal Covenanting, and likeways national Covenanting; for too many apprehend, that God, in the Word, declares himself willing to be our God upon certain Terms or Conditions to be performed by us, different from believing the free Promise of the Gospel with Application to ourselves; and therefore they do accordingly make a Covenant with God, taking him for their God upon those Terms to be by them performed in the Strength of Grace, promising and vowing that, if God will be their God, pardon their Sins, and save their Souls, they will, for their Part, be his People, faithfully serve him all the Days of their Lives, watching against all known Sin, and performing every known Duty.

There are some Mistakes here we are to beware of. In the first Place, this is to confound and mingle the Covenant of Grace and our Covenant of Duty together, as if they were the same: The Covenant of Grace was made from Eternity between the Father and the Son: Our Covenant of Duty is to be made when we have taken hold of God’s Covenant of Grace, and never till then are we suitably prepared for this solemn Work.

(2.) This is to bring in ourselves as Parties transacting in the Covenant of Grace. Whereas Christ alone, as the second Adam, was the Party-Contractor in that Covenant upon Man’s Side, as appears from the 89 Psalm throughout. God never did, nor ever will transact with any Sinner of Adam’s Family. There is nothing we can perform, nothing we can implement in this Matter: And how then can we be Transactors in the Covenant of Grace? His Holiness will not permit, his Justice will not allow, his infinite Wisdom will not admit of a Transaction with any Sinner at first Hand.

But (3.) this would be to bring in ourselves, our Doings, or what we are helped to do by Grace, into the conditionary Part of the Covenant of Grace, and so to overthrow the Doctrine of free Grace, to take Christ’s Work our of his Hand, to subvert the only Foundation of the Faith and Hope of perishing Souls, and to disparage the Righteousness of Christ the Second Adam, which is the only proper and real Condition of the Covenant of Grace.”

— Alexander Moncrieff, The Duty of National Covenanting Explained: In Some Sermons Preached at the Renovation of Our Covenants, National and Solemn League, in the Bond Adapted to our Present Situation and Circumstances in this Period, by the Associate Presbytery, at Abernethy, in the Month of July 1744, (Edinburgh: David Duncan, 1747), pp 31-32.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd%2C+first%2C+as+to+the+Nature+of+this+solemn+Part+of+religious+Worship%2C+it+is+to+be+observed%2C+in+the+first+Place%2C+that+we+are+not+to+put+our+personal+Covenanting%2C+or+National+Covenants%2C+in+the+Room+of+the+Covenant+of+Grace%3A+Personal+Covenanting+and+national+Covenanting+are+of+the+same+Nature+and+Kind%2C+and+differ+only%2C+as+the+one+is+transacted+by+Persons+singly+and+separately+considered%2C+and+the+other+by+man+Persons+jointly+in+a+Body%3A+But+many+mismanage+personal+Covenanting%2C+and+likeways+national+Covenanting%3B+for+too+many+apprehend%2C+that+God%2C+in+the+Word%2C+declares+himself+willing+to+be+our+God+upon+certain+Terms+or+Conditions+to+be+performed+by+us%2C+different+from+believing+the+free+Promise+of+the+Gospel+with+Application+to+ourselves%3B+and+therefore+they+do+accordingly+make+a+Covenant+with+God%2C+taking+him+for+their+God+upon+those+Terms+to+be+by+them+performed+in+the+Strength+of+Grace%2C+promising+and+vowing+that%2C+if+God+will+be+their+God%2C+pardon+their+Sins%2C+and+save+their+Souls%2C+they+will%2C+for+their+Part%2C+be+his+People%2C+faithfully+serve+him+all+the+Days+of+their+Lives%2C+watching+against+all+known+Sin%2C+and+performing+every+known+Duty.%0A%0AThere+are+some+Mistakes+here+we+are+to+beware+of.+In+the+first+Place%2C+this+is+to+confound+and+mingle+the+Covenant+of+Grace+and+our+Covenant+of+Duty+together%2C+as+if+they+were+the+same%3A+The+Covenant+of+Grace+was+made+from+Eternity+between+the+Father+and+the+Son%3A+Our+Covenant+of+Duty+is+to+be+made+when+we+have+taken+hold+of+God%E2%80%99s+Covenant+of+Grace%2C+and+never+till+then+are+we+suitably+prepared+for+this+solemn+Work.%0A%0A%282.%29+This+is+to+bring+in+ourselves+as+Parties+transacting+in+the+Covenant+of+Grace.+Whereas+Christ+alone%2C+as+the+second+Adam%2C+was+the+Party-Contractor+in+that+Covenant+upon+Man%E2%80%99s+Side%2C+as+appears+from+the+89+Psalm+throughout.+God+never+did%2C+nor+ever+will+transact+with+any+Sinner+of+Adam%E2%80%99s+Family.+There+is+nothing+we+can+perform%2C+nothing+we+can+implement+in+this+Matter%3A+And+how+then+can+we+be+Transactors+in+the+Covenant+of+Grace%3F+His+Holiness+will+not+permit%2C+his+Justice+will+not+allow%2C+his+infinite+Wisdom+will+not+admit+of+a+Transaction+with+any+Sinner+at+first+Hand.%0A%0ABut+%283.%29+this+would+be+to+bring+in+ourselves%2C+our+Doings%2C+or+what+we+are+helped+to+do+by+Grace%2C+into+the+conditionary+Part+of+the+Covenant+of+Grace%2C+and+so+to+overthrow+the+Doctrine+of+free+Grace%2C+to+take+Christ%E2%80%99s+Work+our+of+his+Hand%2C+to+subvert+the+only+Foundation+of+the+Faith+and+Hope+of+perishing+Souls%2C+and+to+disparage+the+Righteousness+of+Christ+the+Second+Adam%2C+which+is+the+only+proper+and+real+Condition+of+the+Covenant+of+Grace.%E2%80%9D%0A%0A%E2%80%94+Alexander+Moncrieff%2C+The+Duty+of+National+Covenanting+Explained%3A+In+Some+Sermons+Preached+at+the+Renovation+of+Our+Covenants%2C+National+and+Solemn+League%2C+in+the+Bond+Adapted+to+our+Present+Situation+and+Circumstances+in+this+Period%2C+by+the+Associate+Presbytery%2C+at+Abernethy%2C+in+the+Month+of+July+1744%2C+%28Edinburgh%3A+David+Duncan%2C+1747%29%2C+pp+31-32.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd8eed9b70a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d8eed9b70a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/12/01/alexander-moncrieff-on-personal-covenants-and-the-unconditional-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7ee901ded5" data-kw="">
<blockquote><p>3. This Covenant hath the promise of a circumcised heart, Deuteronomy 30:6, and of the word of faith that is near in the mouth, and of the righteousness of faith clearly differenced from the righteousness of the Law by doing. For so Paul, Romans 10:5-7, etc., expounds, Moses, Deuteronomy 30:11-14.

4. The Covenant of Works taught nothing of the way of expiation of sin by blood typifying the ransom of blood that Christ was to pay for our sins, as this covenant, all along had sacrifices and blood to confirm it. Exodus 24:8. And Moses took the blood and sprinkled it on the people, and said, behold this is the Blood of the Covenant which the Lord hath made with you, concerning all these words. Now the words were the Ten Commandments. See Hebrews 9:18-24.

(5.) This Covenant is made with Israel only, Exodus 20; Deuteronomy 5:6; Deuteronomy 6:5-7, 12. The Covenant of Works is made with all mankind. 6. No people under the Law can be justified and saved thereby, nor have their sins pardoned, Romans 3:9-11, 19-20; Romans 4:1-4; Romans 9; Romans 10; Psalms 130:3; Psalms 143:2; Galatians 3:1-3, 10-13. But in this Covenant, Abraham, David, Genesis 15; Psalm 32; Romans 4:1-9. And the Jews by faith, have remission of sins and salvation, as also the Gentiles have, Acts 10:43; Acts 15:11. […]

8. The Passover and Circumcision, Genesis 17:7, all along were seals of the Covenant, as Baptism on with circumcision in substance, Colossians 2:11, is the seal of the same Covenant, Acts 2:39-41. Now the Law required no Circumcision, no shedding of blood, no repentance, no new heart, but eternal condemnation followed the least breach thereof. Paul saith, Galatians 5:3, If ye be Circumcised (as the false Apostles would have, that thereby you may be justified and saved) you are debtors to keep the whole Law perfectly, as the only way to life, and by no other Covenant can you be justified and saved, now Abraham was not circumcised that way, circumcision did bind Abraham to keep the Law, as a Ceremony and Seal of the Covenant of Works doth command no ceremony, no sacrifice, no type of Christ Mediator at all.</p></blockquote>

</figure><figure class="quote" id="q-e15b92bbbb" data-kw="">
<blockquote><p>The covenant of grace is, properly speaking, an unconditional covenant. The conditions have been fulfilled for us by Christ, the covenant head of elect humanity (though we can refer to saving faith as a condition, but only in an improper sense). As Ralph Erskine argues:

This is the condition of the New Covenant. The Covenant of Works had only the active obedience of the first Adam for its condition; but the condition of the Covenant of Grace properly, is both the active and passive obedience of the second Adam, his doing and dying. Now, Lord, have respect to that blood that sealed the covenant; since the condition is fulfilled to thy infinite satisfaction, let the promised good be conferred upon me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith’s Plea Upon God’s Covenant: A Sermon on Psalm LXXIV. 20</cite>, (Falkirk: T. Johnston, 1821), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-b5462ddb6d" data-kw="">
<blockquote><p>But the truth is, the Law as pressed upon Israel was not a Covenant of Works. 1. The Law as the Law or as a Covenant of Works is made with perfect men who need no mercy; But this Covenant is made with sinners, with an express preface of mercy: I am the Lord thy God that brought thee out of the land of Egypt, etc. It is made with stiff-necked Israel, Deuteronomy 29; Deuteronomy 30-32, and that is called a Covenant from the end and object, as motions are denominate from their end: for the end of the Lord’s pressing the Law upon them was to bring them under a blessed necessity to seek salvation in their true City of Refuge Christ Jesus, who redeemed them out of the spiritual bondage of sin.

2. It was the Covenant made with Abraham, which was a Covenant of Grace: and though it be called, Deuteronomy 29:1, a Covenant beside that which was made in Horeb: Because 1) Renewed again after their breach. 2) Repeated a little before the death of Moses, Deuteronomy 31:28-30. 3. Because there were some additions of special blessings, cursings, Ceremonial Commands, that were not in the formerly proposed Covenant, Exodus 20, yet the same it was in substance, to love the Lord with all the heart, Deuteronomy 2:10, 12-14. The same with that of Abraham, Deuteronomy 8:18. That he may establish his Covenant, which he sware unto thy fathers, as it is this day. When he is to deliver them out of Egypt, Exodus 2:24. And God heard their groaning, and remembered his covenant with Abraham and Isaac and Jacob. So the Lord expounds it in his appearing to Moses, Exodus 3:6; Jeremiah 31; 32. Not according to the Covenant which I made with their fathers, in the day that I took them by the hand, to bring them out of the Land of Egypt. Now that was the Covenant which God made with Abraham, of which circumcision was a seal, Genesis 17, not of a temporary Canaan only, but of heart Circumcision, Colossians 2:11. For the Lord expressly tells them, when he took them by the hand as his married people, to bring them out of the Land of Egypt, and out of the house of bondage, Exodus 20.

He meant no other covenant then he made with Abraham, of believing, Genesis 15, and of walking before him and being perfect, Genesis 17:1, 2, which is somewhat more legal, as Moses, and the Lord himself expounds it, Exodus 2:24; Exodus 3:6; Exodus 20:1-2. And he shows them, Leviticus 26, if in their enemy’s land they repent and shall come out and meet the rod, and their uncircumcised hearts shall willingly accept of the punishment of their iniquity: Leviticus 26:42. Then (saith the Lord) I will remember, Beside there are not here three Covenants, but one, there is no word of the subservient Covenant with Israel in Sinai. Except that when he mentions the one, he excludes not the other. For to walk before the Lord required in Abraham’s Covenant, Genesis 17:1, is to walk in all the ways of the Lord, to fear and love him, (Deuteronomy 10:12, 13) and Samuel (1 Samuel 12:22), Joshua (Joshua 24:22-25). And Mary (Luke 1:55) and Zachariah (Luke 1:70, 72-73) refer to the Covenant made with Abraham to give Canaan to his seed, verse 10, Deuteronomy 7:12. If thou hearken to these judgments to do them, it shall come to pass that the Lord thy God will keep unto thee the Covenant of mercy that he sware unto thy fathers, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened; or, a Treatise of the Covenant of Grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 110-11.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But the truth is, the Law as pressed upon Israel was not a Covenant of Works. 1. The Law as the Law or as a Covenant of Works is made with perfect men who need no mercy; But this Covenant is made with sinners, with an express preface of mercy: I am the Lord thy God that brought thee out of the land of Egypt, etc. It is made with stiff-necked Israel, Deuteronomy 29; Deuteronomy 30-32, and that is called a Covenant from the end and object, as motions are denominate from their end: for the end of the Lord’s pressing the Law upon them was to bring them under a blessed necessity to seek salvation in their true City of Refuge Christ Jesus, who redeemed them out of the spiritual bondage of sin.

2. It was the Covenant made with Abraham, which was a Covenant of Grace: and though it be called, Deuteronomy 29:1, a Covenant beside that which was made in Horeb: Because 1) Renewed again after their breach. 2) Repeated a little before the death of Moses, Deuteronomy 31:28-30. 3. Because there were some additions of special blessings, cursings, Ceremonial Commands, that were not in the formerly proposed Covenant, Exodus 20, yet the same it was in substance, to love the Lord with all the heart, Deuteronomy 2:10, 12-14. The same with that of Abraham, Deuteronomy 8:18. That he may establish his Covenant, which he sware unto thy fathers, as it is this day. When he is to deliver them out of Egypt, Exodus 2:24. And God heard their groaning, and remembered his covenant with Abraham and Isaac and Jacob. So the Lord expounds it in his appearing to Moses, Exodus 3:6; Jeremiah 31; 32. Not according to the Covenant which I made with their fathers, in the day that I took them by the hand, to bring them out of the Land of Egypt. Now that was the Covenant which God made with Abraham, of which circumcision was a seal, Genesis 17, not of a temporary Canaan only, but of heart Circumcision, Colossians 2:11. For the Lord expressly tells them, when he took them by the hand as his married people, to bring them out of the Land of Egypt, and out of the house of bondage, Exodus 20.

He meant no other covenant then he made with Abraham, of believing, Genesis 15, and of walking before him and being perfect, Genesis 17:1, 2, which is somewhat more legal, as Moses, and the Lord himself expounds it, Exodus 2:24; Exodus 3:6; Exodus 20:1-2. And he shows them, Leviticus 26, if in their enemy’s land they repent and shall come out and meet the rod, and their uncircumcised hearts shall willingly accept of the punishment of their iniquity: Leviticus 26:42. Then (saith the Lord) I will remember, Beside there are not here three Covenants, but one, there is no word of the subservient Covenant with Israel in Sinai. Except that when he mentions the one, he excludes not the other. For to walk before the Lord required in Abraham’s Covenant, Genesis 17:1, is to walk in all the ways of the Lord, to fear and love him, (Deuteronomy 10:12, 13) and Samuel (1 Samuel 12:22), Joshua (Joshua 24:22-25). And Mary (Luke 1:55) and Zachariah (Luke 1:70, 72-73) refer to the Covenant made with Abraham to give Canaan to his seed, verse 10, Deuteronomy 7:12. If thou hearken to these judgments to do them, it shall come to pass that the Lord thy God will keep unto thee the Covenant of mercy that he sware unto thy fathers, etc.”

y+the+hand%2C+to+bring+them+out+of+the+Land+of+Egypt.+Now+that+was+the+Covenant+which+God+made+with+Abraham%2C+of+which+circumcision+was+a+seal%2C+Genesis+17%2C+not+of+a+temporary+Canaan+only%2C+but+of+heart+Circumcision%2C+Colossians+2%3A11.+For+the+Lord+expressly+tells+them%2C+when+he+took+them+by+the+hand+as+his+married+people%2C+to+bring+them+out+of+the+Land+of+Egypt%2C+and+out+of+the+house+of+bondage%2C+Exodus+20.%0A%0AHe+meant+no+other+covenant+then+he+made+with+Abraham%2C+of+believing%2C+Genesis+15%2C+and+of+walking+before+him+and+being+perfect%2C+Genesis+17%3A1%2C+2%2C+which+is+somewhat+more+legal%2C+as+Moses%2C+and+the+Lord+himself+expounds+it%2C+Exodus+2%3A24%3B+Exodus+3%3A6%3B+Exodus+20%3A1-2.+And+he+shows+them%2C+Leviticus+26%2C+if+in+their+enemy%E2%80%99s+land+they+repent+and+shall+come+out+and+meet+the+rod%2C+and+their+uncircumcised+hearts+shall+willingly+accept+of+the+punishment+of+their+iniquity%3A+Leviticus+26%3A42.+Then+%28saith+the+Lord%29+I+will+remember%2C+Beside+there+are+not+here+three+Covenants%2C+but+one%2C+there+is+no+word+of+the+subservient+Covenant+with+Israel+in+Sinai.+Except+that+when+he+mentions+the+one%2C+he+excludes+not+the+other.+For+to+walk+before+the+Lord+required+in+Abraham%E2%80%99s+Covenant%2C+Genesis+17%3A1%2C+is+to+walk+in+all+the+ways+of+the+Lord%2C+to+fear+and+love+him%2C+%28Deuteronomy+10%3A12%2C+13%29+and+Samuel+%281+Samuel+12%3A22%29%2C+Joshua+%28Joshua+24%3A22-25%29.+And+Mary+%28Luke+1%3A55%29+and+Zachariah+%28Luke+1%3A70%2C+72-73%29+refer+to+the+Covenant+made+with+Abraham+to+give+Canaan+to+his+seed%2C+verse+10%2C+Deuteronomy+7%3A12.+If+thou+hearken+to+these+judgments+to+do+them%2C+it+shall+come+to+pass+that+the+Lord+thy+God+will+keep+unto+thee+the+Covenant+of+mercy+that+he+sware+unto+thy+fathers%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened%3B+or%2C+a+Treatise+of+the+Covenant+of+Grace%2C+ed.+C.+M.+McMahon+%281654%3B+New+Lennox+IL%2C+2005%29%2C+pp+110-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5462ddb6d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b5462ddb6d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/11/20/samuel-rutherford-on-the-mosaic-covenant-and-the-covenant-of-grace-1/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-5b1de0105b" data-kw="">
<blockquote><p>Is holy consolation, of such inestimable value to the spiritual seed of Christ, that He, in the immensity of his love, came down from the realms of light, to purchase it for them? Believers may learn from this, what infinite obligations they are under, to their incarnate Redeemer. Christian, thy dear Saviour hath, at the infinite expense of his own unparalleled obedience, anguish, and death, purchased and secured everlasting consolation for thee. He was troubled in spirit, that thou mightest be comforted: He was encompassed with the sorrows of eternal death, that thou mightst enter into the joys of everlasting life: He was arrayed in the spirit of heaviness, that thou mightest be clothed with “the garment of praise:” He, who was, from eternity, the delight of his Father, “rejoicing always before Him,” endured for thee, the hiding of his countenance, and the sense of his infinite wrath, that thou mightst, to eternity, joy in God through him.

Hath he not done and suffered enough, to shew thee, that he is willing to enrich thee with consolation, that he careth for thy comfort, and that he giveth thee sufficient cause to be always of good comfort? Were it not, that there is something in thy heart, which requires the discipline of his covenant; he taketh such pleasure in comforting thee, that thou couldst, at no time, be disconsolate. Thou art therefore infinitely bound, to love Him ardently and supremely, to glory in his cross, and to delight in doing his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh, 1814), pp 71-72.</span></figcaption>

</figure><figure class="quote" id="q-3c6249b3b4" data-kw="">
<blockquote><p>If we more firmly believed that God, according to His covenant for His Son’s sake, has pardoned sin and will heal our souls of their distempers and will give grace sufficient and make us to grow and increase with the increases of God verily His promises would appear to be real, and according to our faith it would be to us. …

There are many reasons why the God whom believers pray to should answer them: 1.) They are His chosen ones. God pitched His love on them before the foundation of the world was laid. 2.) They are His Son’s purchase. He has brought them with a price, shed His blood for the remission of their sins, given His life for their ransom. 3.) They are in covenant with God. He has engaged to be their God, and surely He will be their guard also. 4.) They are vessels of mercy, in whom He deigns to glorify His grace and love for ever. Surely, then, He will heed these when they pray; He will give them the good they need, and save them from the evil which makes them fly to Him for shelter. I have done with the first doctrine, that a Christian’s security lies very much in praying always.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Prayer</cite>, (1677) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), pp 142, 162.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-f9eaa7a495" data-kw="">
<blockquote><p>Grace is not born in us. … Even the children of saints are born in sin. Grace doth not run in the blood. Inherent holiness is not propagated, which yet doth not impede the propagation of federal holiness. Though the seed of believers are born polluted it doth not therefore follow that they are not born privileged. David who acknowledgeth the corruption his mother bore him in (Ps. 51:5) yet pleads the privilege his mother bore him to (Ps. 116:16, the son of thy handmaiden; so Ps. 86:16). Though a wise man do not beget a wise man, yet a freeman begets a freeman. I was born free, saith Paul.

We are all born diseased and impotent, but being born of believers we are born by the pool-side, not always under the internal but always under the external administration of the covenant. Israel as the seed of Abraham were transgressors from the womb, but as the seed of Abraham, to them pertained the adoption (Rom. 9:4). Those who will not admit this blessing of Abraham to come upon the Gentiles must expunge it out of their Bibles (Gal. 3:7, 14; Acts 2:39).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Covenant of Grace</cite>, ed. Allan Harman (1692; Fearn: Christian Focus, 2002), pp 139-40.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Grace is not born in us. … Even the children of saints are born in sin. Grace doth not run in the blood. Inherent holiness is not propagated, which yet doth not impede the propagation of federal holiness. Though the seed of believers are born polluted it doth not therefore follow that they are not born privileged. David who acknowledgeth the corruption his mother bore him in (Ps. 51:5) yet pleads the privilege his mother bore him to (Ps. 116:16, the son of thy handmaiden; so Ps. 86:16). Though a wise man do not beget a wise man, yet a freeman begets a freeman. I was born free, saith Paul.

We are all born diseased and impotent, but being born of believers we are born by the pool-side, not always under the internal but always under the external administration of the covenant. Israel as the seed of Abraham were transgressors from the womb, but as the seed of Abraham, to them pertained the adoption (Rom. 9:4). Those who will not admit this blessing of Abraham to come upon the Gentiles must expunge it out of their Bibles (Gal. 3:7, 14; Acts 2:39).”

<blockquote><p>197. But can you not appeal to Scripture, if possible, of a still more conclusive nature, in relation to this subject?

Yes: posterity is charged with the guilt of violating Covenants made with ancestors: “They are turned back to the iniquity of their forefathers, which refused to hear my words; and they went after other gods to serve them: the house of Israel and the house of Judah have broken my Covenant which I made with their fathers.” (Jer. xi. 10.) Still more explicit Israel on the plains of Moab; for, in relation to the transactions at Sinai, entered into forty years before the time when Moses addressed the words to Israel, and when he, Caleb, and Joshua, were the only three original Covenanters alive, he declare:- “The Lord our God made a Covenant with us in Horeb: the Lord made not this Covenant with our fathers, but with us, even with us, who are all of us here alive this day.” (Deut. v. 2, 3.)

198. Is not the principle of the continued obligation of Covenants often in Scripture made a plea in supplicating the Divine mercy?

Yes, frequently. Hence, for example, Jeremiah exclaims:- “Do not abhor us for thy name’s sake: remember, break not thy Covenant with us.” (See Jer. xiv. 21.)

199. On the other hand, does not Jehovah himself frequently rest a plea on the same principle, why punishment should fall upon the guilty?

He does. In the suppositional case stated by Moses (Deut. xxix. 25) to inquirers after the cause of the conditional infliction of sweeping desolations on the Jewish race, the emphatic reply is given: – “Because they have forsaken the Covenant of the Lord God of THEIR FATHERS.</p></blockquote>

<blockquote><p>Now such a Surety every way did Christ become unto God for us, both to pay the debt, by undergoing death in our stead, and so to satisfy God; and then as the Heir, to execute his will and testament.

He became Surety of the whole covenant, and every condition in it, take it in the largest sense; and this of all, both on God’s part, and on ours. For us he undertook to God to work all our works, and undergo all our punishments; to pay our debts for us, and to work in us all that God required should be done by us, in the covenant of grace.</p></blockquote>

</figure><figure class="quote" id="q-d474a2bfcb" data-kw="">
<blockquote><p>And (1) we remark, that the Oath of God which we are to enter into, is not the Covenant of Grace, but it is a Covenant of Duty and Gratitude; and all that have taken hold of the Covenant of Grace are obliged to devote themselves to the Lord in a Covenant of Duty. There must be Faith in Christ in the first Place, and, in consequence of that, there ought to be an open Professing of our Faith in him and obedience to him. … We say it is not the Covenant of Grace, but a Covenant of Duty, which is founded upon, and consequential of our taking hold of the Covenant of Grace.

For, in the first Place, the Covenant of Grace is a Bundle of precious Promises, which God hath undertaken to perform to us for Christ’s Sake. The Covenant of Duty is a Bundle of Duties, which, as inflated in Christ our new Covenant and sanctifying Head, we do promise in his Strength to do and perform. 2dly. The Covenant of Grace never was, and never shall, nor can be broken, because the Parties contracting in it are Jehovah the Father on Heaven’s Side, and Jehovah the Son on Man’s Side, as my be seen in the 89 Psalm throughout. But our Covenant Duty and Gratitude is frequently broken, and needs to be renewed.

3dly. The Covenant of Grace, as it stands fast with Christ, is the Ground of all our Faith, Hope and Confidence before God: But our Covenant of Duty is neither in less nor more a Ground of Hope or Confidence to us. If we value ourselves less or more upon the Account of it, we do but idolize it. It is a Mean of God’s Appointment to impress deeply upon our Spirits a Sense of our Duty to God, a Sense of our Insufficiency to perform any Duty acceptably by any Ability or Power of our own, and to strengthen our Dependence upon Christ alone for Righteousness and Strength: But if we trust to it as a Ground of Hope, we pervert the End and Design of its Institution, and abuse it to perverse Ends of our own Invention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-moncrieff.html">Alexander Moncrieff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of National Covenanting Explained: In Some Sermons Preached at the Renovation of Our Covenants, National and Solemn League, in the Bond Adapted to our Present Situation and Circumstances in this Period, by the Associate Presbytery, at Abernethy, in the Month of July 1744</cite>, (Edinburgh: David Duncan, 1747), pp 13-14.</span></figcaption>

</figure><figure class="quote" id="q-c333ab4adf" data-kw="">
<blockquote><p>This may be a sad meditation to us, to stand and look back to our former estate, and compare it with that into which we are fallen. That image we spoke of, is defaced and blotted out, which was the glory of the creation; and now there is nothing so monstrous, so deformed in the world as man. The corruption of the best things is always worst; the ruins of the most noble creature are most ruinous; the spot of the soul most abominable.

We are nothing but a mass of darkness, ignorance, error, inordinate lust; nothing but confusion, disorder, and distempers in the soul, and in the conversation of men; and, in sum, that blessed bond of friendship with God broken, discord and enmity entered upon our side and separated us from God, and so we can expect nothing from that first covenant but the curse and wrath threatened. “By one man’s disobedience” sin entered upon all, ‘and death by sin;’ because in that agreement Adam was a common person representing us, and thus are all men once subject to God’s judgment, and come short of the glory of God, fallen from life into a state of death, and, for any thing that could be expected, irrecoverably.

But it hath pleased the Lord, in his infinite mercy, to make a better covenant in Christ his Son, that, what was impossible to the law, by reason of our weakness and wickedness, his Son, sent in the flesh, condemned for sin, might accomplish, Rom. 8.3. There is some comfort yet after this; that covenant was not the last, and that sentence was not irrevocable. He makes a new transaction, lays the iniquity of his elect upon Christ, and puts the curse upon his shoulders which was due to them. Justice cannot admit the abrogation of the law, but mercy pleads for a temperament of it. And thus the Lord dispenses with personal satisfaction, which in rigour he might have craved; and finds out a ransom, admits another satisfaction in their name.

And in the name of that Cautioner and Redeemer is salvation preached upon better terms: Believe and thou shalt be saved, Rom. 10.9. Thou lost and undone sinner, whoever thou art, that findest thyself guilty before God, and that thou canst not stand in judgment by the former covenant,—thou who hast no personal righteousness, and trustest in none,—come here, embrace the righteousness of thy Cautioner,—receive him, and rest on him, and thou shalt be saved.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This may be a sad meditation to us, to stand and look back to our former estate, and compare it with that into which we are fallen. That image we spoke of, is defaced and blotted out, which was the glory of the creation; and now there is nothing so monstrous, so deformed in the world as man. The corruption of the best things is always worst; the ruins of the most noble creature are most ruinous; the spot of the soul most abominable.

We are nothing but a mass of darkness, ignorance, error, inordinate lust; nothing but confusion, disorder, and distempers in the soul, and in the conversation of men; and, in sum, that blessed bond of friendship with God broken, discord and enmity entered upon our side and separated us from God, and so we can expect nothing from that first covenant but the curse and wrath threatened. “By one man’s disobedience” sin entered upon all, ‘and death by sin;’ because in that agreement Adam was a common person representing us, and thus are all men once subject to God’s judgment, and come short of the glory of God, fallen from life into a state of death, and, for any thing that could be expected, irrecoverably.

But it hath pleased the Lord, in his infinite mercy, to make a better covenant in Christ his Son, that, what was impossible to the law, by reason of our weakness and wickedness, his Son, sent in the flesh, condemned for sin, might accomplish, Rom. 8.3. There is some comfort yet after this; that covenant was not the last, and that sentence was not irrevocable. He makes a new transaction, lays the iniquity of his elect upon Christ, and puts the curse upon his shoulders which was due to them. Justice cannot admit the abrogation of the law, but mercy pleads for a temperament of it. And thus the Lord dispenses with personal satisfaction, which in rigour he might have craved; and finds out a ransom, admits another satisfaction in their name.

And in the name of that Cautioner and Redeemer is salvation preached upon better terms: Believe and thou shalt be saved, Rom. 10.9. Thou lost and undone sinner, whoever thou art, that findest thyself guilty before God, and that thou canst not stand in judgment by the former covenant,—thou who hast no personal righteousness, and trustest in none,—come here, embrace the righteousness of thy Cautioner,—receive him, and rest on him, and thou shalt be saved.”

— Hugh Binning, The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 234-35.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+may+be+a+sad+meditation+to+us%2C+to+stand+and+look+back+to+our+former+estate%2C+and+compare+it+with+that+into+which+we+are+fallen.+That+image+we+spoke+of%2C+is+defaced+and+blotted+out%2C+which+was+the+glory+of+the+creation%3B+and+now+there+is+nothing+so+monstrous%2C+so+deformed+in+the+world+as+man.+The+corruption+of+the+best+things+is+always+worst%3B+the+ruins+of+the+most+noble+creature+are+most+ruinous%3B+the+spot+of+the+soul+most+abominable.%0A%0AWe+are+nothing+but+a+mass+of+darkness%2C+ignorance%2C+error%2C+inordinate+lust%3B+nothing+but+confusion%2C+disorder%2C+and+distempers+in+the+soul%2C+and+in+the+conversation+of+men%3B+and%2C+in+sum%2C+that+blessed+bond+of+friendship+with+God+broken%2C+discord+and+enmity+entered+upon+our+side+and+separated+us+from+God%2C+and+so+we+can+expect+nothing+from+that+first+covenant+but+the+curse+and+wrath+threatened.+%E2%80%9CBy+one+man%E2%80%99s+disobedience%E2%80%9D+sin+entered+upon+all%2C+%E2%80%98and+death+by+sin%3B%E2%80%99+because+in+that+agreement+Adam+was+a+common+person+representing+us%2C+and+thus+are+all+men+once+subject+to+God%E2%80%99s+judgment%2C+and+come+short+of+the+glory+of+God%2C+fallen+from+life+into+a+state+of+death%2C+and%2C+for+any+thing+that+could+be+expected%2C+irrecoverably.%0A%0ABut+it+hath+pleased+the+Lord%2C+in+his+infinite+mercy%2C+to+make+a+better+covenant+in+Christ+his+Son%2C+that%2C+what+was+impossible+to+the+law%2C+by+reason+of+our+weakness+and+wickedness%2C+his+Son%2C+sent+in+the+flesh%2C+condemned+for+sin%2C+might+accomplish%2C+Rom.+8.3.+There+is+some+comfort+yet+after+this%3B+that+covenant+was+not+the+last%2C+and+that+sentence+was+not+irrevocable.+He+makes+a+new+transaction%2C+lays+the+iniquity+of+his+elect+upon+Christ%2C+and+puts+the+curse+upon+his+shoulders+which+was+due+to+them.+Justice+cannot+admit+the+abrogation+of+the+law%2C+but+mercy+pleads+for+a+temperament+of+it.+And+thus+the+Lord+dispenses+with+personal+satisfaction%2C+which+in+rigour+he+might+have+craved%3B+and+finds+out+a+ransom%2C+admits+another+satisfaction+in+their+name.%0A%0AAnd+in+the+name+of+that+Cautioner+and+Redeemer+is+salvation+preached+upon+better+terms%3A+Believe+and+thou+shalt+be+saved%2C+Rom.+10.9.+Thou+lost+and+undone+sinner%2C+whoever+thou+art%2C+that+findest+thyself+guilty+before+God%2C+and+that+thou+canst+not+stand+in+judgment+by+the+former+covenant%2C%E2%80%94thou+who+hast+no+personal+righteousness%2C+and+trustest+in+none%2C%E2%80%94come+here%2C+embrace+the+righteousness+of+thy+Cautioner%2C%E2%80%94receive+him%2C+and+rest+on+him%2C+and+thou+shalt+be+saved.%E2%80%9D%0A%0A%E2%80%94+Hugh+Binning%2C+The+Common+Principles+of+the+Christian+Religion%2C+Clearly+Proved%2C+and+Singularly+Improved.+Or%2C+A+Practical+Catechism%2C+%281672%29+in+The+Works+of+Hugh+Binning%2C+ed.+James+Cochrane+%283+vols%2C+Edinburgh%3A+William+Whyte%2C+1839%29%2C+i%2C+234-35.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc333ab4adf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c333ab4adf.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/09/25/hugh-binning-on-total-depravity-and-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>All that the Father gives me will come to me, and whoever comes to me I will never cast out.” (John 6:37)

The English language fails to give the full sense of the Greek in this sentence. The literal meaning of the Greek is, not “all persons whom the Father giveth shall come,” but “everything, – the whole thing.” It is not a masculine plural, but a neuter singular. The idea is either “that the whole mystical body, the company of my believing people, shall come to Me,” or else “every single part or jot or member of my mystical body shall come to Me, and not one be found missing at last.”

We learn from these words the great and deep truth of God’s election and appointment to eternal life of a people out of this world. The Father from all eternity has given to the Son a people to be His own peculiar people. The saints are given to Christ by the Father as a flock, which Christ undertakes to save completely, and to present complete at the last day. (See John xvii. 2, 6, 9, 11, 12: and xviii. 9.) However wicked men may abuse this doctrine, it is full of comfort to a humble believer. He did not begin the work of His salvation. He was given to Christ by the Father, by an everlasting covenant.</p></blockquote>

<blockquote><p>While the non-elect may belong to the external administration of the covenant of grace, only the elect are, properly speaking, in the covenant of grace (cf. Galatians 3:16, Romans 5:15-21, Isaiah 53:10, 11). This view is not a “Reformed Baptist” notion but is the official position of the Westminster Standards (see Larger Catechism 31). Moreover, we find the Westminster divine, Edmund Calamy, arguing for this position:

[A]ll men enter into Adam’s covenant by nature, but the Elect only enter into Christ’s covenant by grace …</p></blockquote>

</figure><figure class="quote" id="q-8d12b48f1a" data-kw="">
<blockquote><p>For the promise is to you and to your children (Acts 2:39)

Have infants now under Christ no privilege nor covenant grace external by their birth and descent from believing parents? Answer: Sure they have. For Acts 2:39, the promise is to you and to your children. Either to all children or to some, the text makes no exception. If it be said to all conditionally, if they believe, not absolutely?

Answer: That must be an internal covenanting proper to the elect, and the promise is not made to the aged but conditionally, so they [Anabaptists] believe. And yet the promise shall be made to infants and children, but not while they come to age. To be cut off and cast out of the covenant is a dreadful judgment, Zechariah 11:9; Hosea 2:3-5; Romans 11:20, well, because of unbelief they are broken off. Then because the Jews believe in Christ already come, all their children, for no fault, but for the belief of their parents, must be cut off. Whereas Paul makes it a misery that the Ephesians, Ephesians 2:12, were strangers from the covenants of promise, saving no hope and without God, without Christ.

And Peter, that the Gentiles were no people, 1 Peter 2, then that misery lies upon the infants of Christians and all within the visible church, until they be converted and baptized, and the Gospel is no favour to them, that they are within the net, and in the office house of Grace the visible church where the word preached to children, who are to be taught, Genesis 18:19; Deuteronomy 6:7; Exodus 12:26, 27; Psalm 78:1-7; 2 Timothy 3:15, and the Lord reckons it among the favours, that he bestows not on every nation but only on his own covenanted Israel, that the Word of the Gospel to gather them and their children, Matthew 23:37; 2 Timothy 3:15; Psalm 78:1-5, and his statutes and judgments are declared and preached to them, Romans 3:1, 2; Romans 9:4, the promises and the giving of the Law, and the covenants and the service of God. And this is a special blessing in the New Testament to old and young is clear from Acts 13 when Paul turns from the blaspheming Jews to the Gentiles. Acts 13:47, I have set thee to be a light to the Gentiles, that thou shouldest be for salvation to the end of the earth. Now this covenant salvation is, Isaiah 49:6, 8-9, I will give thee to restore the preserved of Israel, I will give thee for a covenant to the people to establish the earth. That thou mayest say to the prisoners go forth, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 133-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-7f890e097c" data-kw="">
<blockquote><p>So David said to Nathan, “I have sinned against the Lord.” And Nathan said to David, “The Lord also has put away your sin; you shall not die.” (2 Samuel 12:13)

Here we must note how God receives poor sinners, and accomplishes what he says by his prophet, that ‘he desires not the death’ of his own, nor to lose them, but that ‘they be converted and live’ (Ezek. 18:23). We see this portrayed in a living portrait when God pronounced by the mouth of his prophet that David’s sin was pardoned. As he was quick to make himself docile and bow his head, indeed making himself nothing at all before God, we see that God responded by readily receiving him in mercy. And that is how he will act towards all sinners, for it is not a story which applies just to one man. On the contrary, God tells us that he is always ready and prepared to grant us mercy when we come to him – if it is without hypocrisy, and if we feel the way that David did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on 2 Samuel: chapters 1-13</cite>, trans. D. F. Kelly (Edinburgh, 1992), pp 565-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-feb26afccc" data-kw="">
<blockquote><p>XVI. They are deceived then who make parallel distinctions of the Old and New Testament; of the Covenant of Works, and of Grace; of the Law, and Gospel: for in both, the Testament of Covenant is the Covenant of Grace; in both, the Law and Gospel are urged.

XVII. But the administration of the Old and New Testament differ first in time; because the Old Testament was exhibited before Christ; but the New is administered, Christ being now exhibition; that was to continue only till Christ, this forever. 2. In the place or amplitude, for that was proffered to the people of Israel only, this extends it self through all the world. 3. In clearness; because the free promises of Christ are more clearly preached in the New Testament, and confirmed, the shadows of Types and Ceremonies being abolished. 4. In facility; because the administration in the Old Testament, was more laborious than in the New. 5. In sweetness; for in the Old Testament, the perfect obedience of the Law is oftener urged, yet not excluding the promises of the Gospel; yet to that end, that they might be compelled to seek Christ by that rigorous exaction of obedience, as it were by a School-master: but in the new Testament, the promises of the Gospel are more frequent, yet not excluding the Law, which drives us to new obedience, to be performed by the grace of Regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), pp 173-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-389a805b39" data-kw="">
<blockquote><p>Of Admonition, to take heed how we vilifie or contemne this Law of God, either doctrinally, or practically. Doctrinally, so the Marcionites, and the Manichees, and Basilides; whereof some have said, it was carnall, yea that it was from a Devil, and that it was given to the Jews for their destruction because it’s said to work wrath, and to be the instrument of death. And those opinions and expressions of the Antinomians about it are very dangerous. What, shall we revile that which is God’s great mercy to a people? Because the Jews and Papists do abuse the Law, and the works of it to justification, shall it not therefore have its proper place and dignity?

Take heed therefore of such phrases, An Old-Testament-spirit, and, His Sermon is nothing but an explication of the Law: For it ought much to rejoyce thee, to hear that pure and excellent image of Gods holiness opened. How mayest thou delight to have that purity enjoyned, which will make thee loath thy self, prize Christ and Grace more, and be a quick goad to all holiness? And if you say, Here is nothing of Christ all this while: I answer That is false, as is to be proved, if the Law be not taken very strictly: And besides, the Law and the Gospel are not to be severed, but they mutually put a fresh relish and taste upon each other. And shall no mercy be esteemed, but what is the Gospel? Thou art thankfull for temporall mercies, and yet they are not the Gospel; but this is a spiritual mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or, A vindication of the moral law and the covenants, from the errors of Papists, Arminians, Socinians, and more especially, Antinomians</cite>, (London, 1647), pp 152-3 emphasis added.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>[B]y reason of despising salvation in this daylight of the gospel, we are in a most dangerous condition.

<blockquote><p>Q. Of how many sorts is this Covenant?

A. In substance it is but one, but in regard of circumstance it is two: the Old Testament, and the New.

Q. What is the Old Testament?

A. It is the covenant of God, which (under types, figures, and shadows) did set forth Christ before his coming in the flesh; and by virtue whereof life everlasting was given by faith in Christ that was to come.

Q. What is the new Testament?

A. It is the covenant of God, which (since the coming of Christ in the flesh) hath abolished those shadows, &amp; giveth life everlasting by faith in Christ, that is come; by means whereof it is in a special respect called the Gospel. Coloss. 2.16.17.20. Hebr. 9.1.2.3. &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 168.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-645ce6a9aa" data-kw="">
<blockquote><p>But the Lord is not slack, or, delays not. He checks extreme and unreasonable haste by another reason, that is, that the Lord defers his coming that he might invite all mankind to repentance. For our minds are always prurient, and a doubt often creeps in, why he does not come sooner. But when we hear that the Lord, in delaying, shews a concern for our salvation, and that he defers the time because he has a care for us, there is no reason why we should any longer complain of tardiness. He is tardy who allows an occasion to pass by through slothfulness: there is nothing like this in God, who in the best manner regulates time to promote our salvation. And as to the duration of the whole world, we must think exactly the same as of the life of every individual; for God by prolonging time to each, sustains him that he may repent. In the like manner he does not hasten the end of the world, in order to give to all time to repent.

This is a very necessary admonition, so that we may learn to employ time aright, as we shall otherwise suffer a just punishment for our idleness.

Not willing that any should perish. So wonderful is his love towards mankind, that he would have them all to be saved, and is of his own self prepared to bestow salvation on the lost. But the order is to be noticed, that God is ready to receive all to repentance, so that none may perish; for in these words the way and manner of obtaining salvation is pointed out. Every one of us, therefore, who is desirous of salvation, must learn to enter in by this way.

But it may be asked, If God wishes none to perish, why is it that so many do perish? To this my answer is, that no mention is here made of the hidden purpose of God, according to which the reprobate are doomed to their own ruin, but only of his will as made known to us in the gospel. For God there stretches forth his hand without a difference to all, but lays hold only of those, to lead them to himself, whom he has chosen before the foundation of the world.

But as the verb χωρὢσαι is often taken passively by the Greeks, no less suitable to this passage is the verb which I have put in the margin, that God would have all, who had been before wandering and scattered, to be gathered or come together to repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the catholic epistles</cite>, trans. and ed. John Owen (1551; n.p., 1855) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 419-20.</span></figcaption>

</figure><figure class="quote" id="q-a6a1ba2e42" data-kw="">
<blockquote><p>Q. What is this new Covenant?

A. A free contract or Covenant between God and a sinner, concerning the pardon of sin, and life everlasting, through faith in Christ Jesus.

Q. When did this Covenant begin?

A. Immediately after the Fall. Gen. 3.15.

Q. What is specially to be considered in this Covenant?

A. First, the parts and sorts thereof: secondly, the ground and foundation.

Q. What are the parts thereof?

A. The mutual acts between God, and a sinner.

Q. What is the act on God’s part?

A. A free offer of salvation unto a sinner, upon this condition, that he will believe in Christ.

Q. What is the act on the sinners part?

A. An acceptance of this offer, by submitting to the condition.</p></blockquote>

<blockquote><p>In Psalm 68:31 we read, “Ethiopia [or Cush] shall soon stretch out her hands unto God.” The early Seceder, Ebenezer Erskine, interpreted this text as a prediction that the Gentile nations, including those in Africa, would enter into covenant with God:

The words read … are a declaration of the success of the gospel among the Gentile nations. Ethiopia, Egypt, and other places of the world, would submit unto his royal sceptre, when it should be swayed among them in the dispensation of the gospel, Princes shall come out of Egypt, Ethiopia shall soon stretch out her hands unto God. …

From which it appears, that Ethiopia, Scotland, and all the Gentile nations, and every individual among them is, by nature, in a most dismal and deplorable condition, without God, the chief good, without Christ, the only Saviour, without hope of salvation, without the true church, where life and immortality alone is brought to light; without God’s covenant of promise, which is the only charter of salvation; under the power of sin and Satan, the great enemy of their salvation; and, consequently, in a state of hostility against God. …

Lastly, This phrase of stretching out the hand to God implies an open profession of the faith in Christ, before the world, angels, men, and devils, which is sometimes called in Scripture an avouching of the Lord to be our God; and is sometimes done there by a person or people, with the solemnity of lifting up the hand, an ancient form of swearing, Rev. x. 5, 6, when the angel swore by him that liveth for ever and ever, he doth it with his hand lifted up to heaven.

So here, Ethiopia shall soon stretch out her hands unto God, that is, the inhabitants of Ethiopia, and of the Gentile nations, shall openly profess the God and Father of our Lord Jesus Christ to be their God, and they shall do it with the solemnity of an oath or covenant, as Israel they shall do it with the solemnity of an oath or covenant, as Israel did, Josh. xxiv. 22. When Joshua told them, “Ye are witnesses against yourselves, that ye have chosen you the Lord, to serve him.” And in this manner have we, in this land, and neighbouring nations, lifted up our hand to God, declaring him to be our God, and ourselves to be his people, although, alas! these covenants have been scandalously broken, burnt, and in a great measure buried. …

See from this doctrine, wherein the essence either of personal or national covenanting with God doth consist. Why, it just lies in following the example of Ethiopia, which stretched out the hand unto God, in a way of faith and solemn profession, that the God of Christ shall be their God, and that the Father of Christ shall be their Father; and that in the strength of the grace that is in Jesus, promised in a new covenant of grace, they will cleave unto him by a personal holy walk and conversation; and that, through grace, they will cleave unto the doctrine, discipline, worship, and government, that he has appointed in his house, in his holy oracles.

It must be a strange kind of spirit, that either sets his people on edge against such covenants, or turns them to an indifferency about the public work and cause of Christ, as if it were not worth the contending for, or suffering for. When God commands us to “contend for the faith delivered to the saints,” Jude iii., and to “stand fast in the liberty wherewith Christ hath made us free,” Gal. v. 1. It appears evidently to be a plot of hell for burying a testimony for our solemn covenants, and for the reformation of Scotland, and for our encouraging judicatories to go on in their course of backsliding from the Lord, and his work and way.</p></blockquote>

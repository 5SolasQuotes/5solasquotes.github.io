</figure><figure class="quote" id="q-fa13cdd0e9" data-kw="">
<blockquote><p>If believers then suffer themselves, surrounded as they are, by the clear light of the blessed gospel, to retain ignorance, or to cherish mistakes, respecting the covenant of Jehovah’s peace, and the infinite fulness and freeness of his grace treasured up – in Christ, the glorious Trustee of that covenant; they do thereby undervalue the only doctrine, on which all true comfort depends, and so, provoke their heavenly Father, to suspend the consolations of his holy covenant, from their souls.

The gospel is an exhibition of God’s covenant of grace, to lost sinners of mankind; and therefore it is “good tidings of great joy to all people.” To be willingly ignorant, then, of that gracious contract, is the same as to be willingly ignorant of the glorious gospel; and to retain mistaken notions of the former, is the same as to err concerning the latter.

When true Christians satisfy themselves with superficial and indistinct views of the covenant of grace, or with knowing little more, than the first principles of the doctrine of that august contract; they so far despise the doctrine of redeeming grace, the joyful tidings of a free salvation, and so lose the joy of that salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh: J. Ogle, 1814), pp 77-78.</span></figcaption>

er</a></div>

<blockquote><p>Although my house be not so with God; yet he hath made with me an everlasting covenant, ordered in all things, and sure: for this is all my salvation, and all my desire, although he make it not to grow.” 2 Samuel 23:5

Commenting on the above verse, J. C. Ryle wrote:

But who can fully understand a covenant made by the Eternal God? It is something far above us and out of sight. It is a phrase by which He is graciously pleased to accommodate Himself to our poor weak faculties, but at best we can only grasp a little of it. The covenant of God to which David refers as his comfort must mean that everlasting agreement or counsel between the Three Persons of the Blessed Trinity which has existed from all eternity for the benefit of all the living members of Christ.

It is a mysterious and ineffable arrangement whereby all things necessary for the salvation of our souls, our present peace, and our final glory, are fully and completely provided, and all this by the joint work of God the Father, God the Son, and God the Holy Ghost. The redeeming work of God the Son by dying as our Substitute on the cross, – the drawing work of God the Father by choosing and drawing us to the Son, – and the sanctifying work of the Holy Ghost in awakening, quickening, and renewing our fallen nature, – are all contained in this covenant, besides everything that the soul of the believer needs between grace and glory.

Of this covenant, the Second Person of the Trinity is the Mediator (Heb. xii. 24). Through Him all the blessings and privileges of the covenant are conveyed to every one of His believing members. And when the Bible speaks of God making a covenant with man, as in the words of David, it means with man in Christ, as a member and part of the Son. They are His mystical body, and He is their Head, and through the Head of all the blessings of the eternal covenant are conveyed to the body. Christ, in one word, is “Surety of the covenant,” and through Him believers receive its benefits. This is the great covenant which David had in view.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Upper Room: Being a Few Truths for the Times</cite>, (1880; Edinburgh: Banner of Truth, 1970), pp 259-60.</span></figcaption>

</figure><figure class="quote" id="q-06197c4c85" data-kw="">
<blockquote><p>Q. What are the false grounds of the Lord’s making the Covenant of Grace?

A. There are two bastard grounds devised by Arminians. 1. Because the Covenant of Works cannot oblige both to active and passive obedience, but to one of them only (say they) and the Covenant of Works was so rigid, that God could not follow it out, and cast infants in hell for a sin which is theirs, only by imputation, and was pardoned to the first man that committed it. Therefore he was necessitated to make a Covenant of Grace with all mankind, none excepted. But the Covenant of Works is broken, and can now be a way of Justification and salvation to none, but yet it obliges all. And sin cannot make us lawless, for the spiritual Law is of an eternal obligation.

2. They that never heard of Christ, perish by the Law, and not by the Covenant of Grace of which they never heard, and the Gospel is written in the heart of none. 3. The first Covenant was holy and spiritual, and God should unjustly threaten death upon infants, if they be not guilty of eternal condemnation, as Arminius, disp. pub. 7. th. 16.3. and the Scripture saith, infants are guilty of this sin, Eph. 2.3. Rom. 5. Psal. 51.5. Job 14.4. As also Christ must not have died for the sins of Infants, if there be no sin in them, they need not the ransom of Christ’s Blood.

The other bastard ground is, the natural antecedent desire and love of God to have all saved, moved him (say they) to make this Covenant of Grace with all. But this makes away free-grace, and changes God as the blind Talmud, which saith God hath a secret place in which he afflicts himself, because he burnt the Temple, and delivered the Jews to captivity. As also, the Lord remembering the captivity of the Jews, and their desolation, he powers out two tears every day in the Sea or Ocean, and for grief, smites his breasts with both his hands. And the Alcoran saith, that God and the Angels wish well to Mahomet, but cannot free him from death. So made the Heathen their Jupiter to deplore the destinies which he could not amend. And what is this, but to say, God hath passionate desires to have all, Elect, and Reprobate, Men, and Angels, to obey and be eternally saved, but he cannot help the matter; and therefore must upon the same account, be sorrowful and mourn that he cannot get all saved, which destroys the power of grace and restrains the outgoings of free-love.</p></blockquote>

<blockquote><p>The universal offer made of Christ in the Gospel, has been urged as another objection [to limited atonement]. The fact on which this objection is founded we admit without reservation. We contend for the unlimited extent of the Gospel call, and regard every attempt to restrict it as hostile alike to the letter and the spirit of the Gospel. Here we take the phrases “every creature” — “all the world” — “every one” — “whosoever will,” &amp;c., in the fullest extent of acceptation of which they will admit. …

The principles of human obligation are not affected by the secret will of God. What man ought to do, is one thing; what God will do, is another thing. Now, the Gospel call may be regarded as expressive of man’s duty, rather than of the divine intention. God may, and does command many things, which he knows the persons commanded will never fulfil. These things it is the duty of man to do, but it is not the secret will of God to accomplish. By the warnings, and remonstrances, and solemn admonitions of Noah, he called the antediluvians to repent, and be saved from the waters of the deluge; and that it was their duty to do so, is not surely disproved by what we now know, from the fact, that it was not the secret design of God to save them.

By means of his servant Moses, God commanded Pharaoh to let Israel go, as a means of saving his own life and those of his people; it was his duty certainly to obey this command; but it was not the secret intention of God that the Egyptians and their king should escape the destruction of the Red Sea. The Jews and Roman soldiers were under obligation, from the command “Thou shalt not kill,” not to put Jesus of Nazareth to death; yet it was in consequence of being delivered by the determinate counsel and foreknowledge of God, that he was taken, and by wicked hands crucified and slain.

In like manner, may we not say, that the unlimited offer of the Gospel proves only that it is the duty of all men to believe in Christ for salvation, and not that it is the design or intention of God that all should be saved by him, or that he should obtain salvation for all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement and Intercession of Jesus Christ</cite>, (New York: Robert Carter &amp; Brothers, 1863), pp 209, 211.</span></figcaption>

<blockquote><p>Obs. VIII. There is infinite grace in every divine covenant, inasmuch as it is established on promises. Infinite condescension it is in God, that he will enter into covenant with dust and ashes, with poor worms of the earth. And herein lies the spring of all grace, from whence all the streams of it do flow. And the first expression of it is in laying the foundation of it in some undeserved promises. And this was that which became the goodness and greatness of his nature, the means whereby we are brought to adhere unto him in faith, hope, trust, and obedience, until we come unto the enjoyment of him; for that is the use of promises, to keep us in adherence unto God, as the first original and spring of all goodness, and the ultimate satisfactory reward of our souls, 2 Cor. vii. 1.

Obs. IX. The promises of the covenant of grace are better than those of any other covenant, as for many other reasons, so especially because the grace of them prevents any condition or qualification on our part. I do not say the covenant of grace is absolutely without conditions, if by conditions we intend the duties of obedience which God requireth of us in and by virtue of that covenant; but this I say, the principal promises thereof are not in the first place remunerative of our obedience in the covenant, but efficaciously assumptive of us into covenant, and establishing or confirming in the covenant.

The covenant of works had its promises, but they were all remunerative, respecting an antecedent obedience in us; (so were all those which were peculiar unto the covenant of Sinai). They were, indeed, also of grace, in that the reward did infinitely exceed the merit of our obedience; but yet they all supposed it, and the subject of them was formally reward only. In the covenant of grace it is not so; for sundry of the promises thereof are the means of our being taken into covenant, of our entering into covenant with God. The first covenant absolutely was established on promises, in that when men were actually taken into it, they were encouraged unto obedience by the promises of a future reward.

But those promises, namely, of the pardon of sin and writing of the law in our hearts, which the apostle expressly insisteth upon as the peculiar promises of this covenant, do take place and are effectual antecedently unto our covenant obedience. For although faith be required in order of nature antecedently unto our actual receiving of the pardon of sin, yet is that faith itself wrought in us by the grace of the promise, and so its precedency unto pardon respects only the order that God had appointed in the communication of the benefits of the covenant, and intends not that the pardon of sin is the reward of our faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 68-69.</span></figcaption>

<blockquote><p>But after the flood, on Noah’s offering a sacrifice that represented the sacrifice of Christ, God, in smelling a sweet savour, or accepting that sacrifice, as it was a representation of the true sacrifice of Christ, which is a sweet savour indeed to God, he gives Noah a new grant of the earth, founded on that sacrifice of Christ, of that covenant of grace which is by that sacrifice of Christ, with a promise annexed, that now the earth should no more be destroyed, till the consummation of all things; as you may see in Gen. viii. 20.21.22. and chapter ix. 1.2.3.7. The reason why such a promise, that God would no more destroy the earth, was added to this grant made to Noah, and not to that made to Adam, was because this was founded on the covenant of grace, of which Christ was the surety, and therefore could not be broken.

Therefore it comes to pass now, that though the wickedness of man has dreadfully raged, and the earth been filled with violence and wickedness thousands of times, and one age after another, and much more dreadful and aggravated wickedness than the world was full of before the flood, being against so much greater light and mercy; especially in these days of the gospel: yet God’s patience holds out; God does not destroy the earth; his mercy and forbearance abides according to his promise; and his grant established with Noah and his sons abides firm and good, being founded on the covenant of grace.

IV. On this God renews with Noah and his sons the covenant of grace, Gen. ix.9.10. “And I, behold, I establish my covenant with you, and with your seed after you, and with every living creature that is with you,” &amp;c.; which was the covenant of grace; which even the brute creation have this benefit of, that is shall never be destroyed again till the consummation of all things. When we have this expression in scripture, my covenant, it commonly is to be understood of the covenant of grace. The manner of expression, “I will establish my covenant with you, and with your seed after you,” shews plainly, that it was a covenant already in being, that had been made already, and that Noah would understand what covenant it was by that denomination, viz. the covenant of grace.</p></blockquote>

<blockquote><p>Doctrine of the Covenant directly Scriptural.

It may seem unnecessary to say that this is a doctrine which has express verbal warrant in Holy Scripture. We have been led to this topic in connexion with the doctrine of the Atonement; and, it may be in point, therefore, to call to mind the significant phrase, “The blood of the everlasting covenant” (Heb. xiii. 20). Surely that single Divine form of speech is sufficient to set forth an organic connexion between the Covenant of Grace and the sacrifice of Jesus. Take again the memorable promise: “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. ix. 11); and our Lord’s own affecting utterance in instituting the sacrament of the Supper: “This cup is the new covenant in my blood.”

Surely these Divine expressions are very express; and they are sufficient to show that no man discusses the doctrine of Christ’s death who severs it from the considerations presented by the Covenant of Grace. It is the “blood” that maketh “atonement;” but in this case the “blood” is the “blood of the Covenant.” Men may therefore discuss as long as they please an abstract theory of an abstract atonement; but if they give not heed to this atonement which the Covenant of Grace conditions and explains, they are not any more dealing with true theology, than men should deal with real astronomy who should speculate on central forces in the abstract and pretermit the actual law of gravitation —the law of the inverse square of the distance — which rules in the starry heavens.

It is scarcely necessary to refer to the express assertion of the covenant between the Father and the Son in the proposition: “The counsel of peace shall be between them both” (Zech. vi. 13). Our Lord is designated at once the “Mediator of the Covenant” (Heb. viii. 6.; xii. 24), and the “Surety of the Covenant” (Heb. vii. 22). Nay, He is represented as the substance of the Covenant: “I the Lord have called Thee in righteousness, and will hold thine hand, and will keep Thee, and give Thee for a covenant of the people, for a light to the Gentiles” (Isa. xlii. 6; xlix. 8).

The work of Christ is thus in express terms affirmed to be a covenant work — a work having immediate respect to a covenant. The work of the Spirit is spoken of in similar connexion with a covenant: “As for me, this is my covenant with them, saith the Lord; My Spirit that is upon thee, and my words that are in thy mouth, shall not depart out of thy mouth, nor out of the mouth of thy seed, nor out of the mouth of thy seed’s seed, saith the Lord, from henceforth and for ever ” (Isa. lix. 21).

When the Lord invites lost sinners to Himself, it is in terms like these: “Incline your ear, and come unto me: hear, and your souls shall live; and I will make with you an everlasting covenant, even the sure mercies of David” (Isa. lv. 3). When, moved by such entreaties, sinners ask the way to Zion, with their faces thitherward, it is with the mutual exhortation: “Come, and let us join ourselves to the Lord in a perpetual covenant that shall not be forgotten” (Jer. i. 5). When, after entering on this blessed relation with God, they would express their full satisfaction with it in the midst of all life’s troubles and afflictions, they are wont to say: “Though my house be not so with God; yet He hath made with me an everlasting covenant, ordered in all things and sure: this is all my salvation, and all my desire” (2 Sam. xxiii. 5).

For in the midst of all troubles by which their sins are chastised and their spirit chastened, the Lord sustains their faith by the gracious declaration: “My covenant will I not break, nor alter the word that hath gone out of my mouth” (Ps. lxxxix. 34). And when grieved in the view of the “cruelty” that obtains in the “dark places of the earth,” the Church’s strongest appeal to God on their behalf is this: “Have respect unto Thy covenant” (Ps. lxxiv. 20).

These are some of the more express verbal assertions of the reality and fact of a Covenant of Grace. Intelligent piety is familiar with them as with household words; and we quote them simply to show that the federal theology is no product of mere human ingenuity — no merely artificial structure — but a Scriptural theme, the terminology of which is directly furnished by Scripture itself. It is no roundabout result of mere theologising, but one of the immediate data of Divine inspiration.</p></blockquote>

y+heavens.%0A%0AIt+is+scarcely+necessary+to+refer+to+the+express+assertion+of+the+covenant+between+the+Father+and+the+Son+in+the+proposition%3A+%E2%80%9CThe+counsel+of+peace+shall+be+between+them+both%E2%80%9D+%28Zech.+vi.+13%29.+Our+Lord+is+designated+at+once+the+%E2%80%9CMediator+of+the+Covenant%E2%80%9D+%28Heb.+viii.+6.%3B+xii.+24%29%2C+and+the+%E2%80%9CSurety+of+the+Covenant%E2%80%9D+%28Heb.+vii.+22%29.+Nay%2C+He+is+represented+as+the+substance+of+the+Covenant%3A+%E2%80%9CI+the+Lord+have+called+Thee+in+righteousness%2C+and+will+hold+thine+hand%2C+and+will+keep+Thee%2C+and+give+Thee+for+a+covenant+of+the+people%2C+for+a+light+to+the+Gentiles%E2%80%9D+%28Isa.+xlii.+6%3B+xlix.+8%29.%0A%0AThe+work+of+Christ+is+thus+in+express+terms+affirmed+to+be+a+covenant+work+%E2%80%94+a+work+having+immediate+respect+to+a+covenant.+The+work+of+the+Spirit+is+spoken+of+in+similar+connexion+with+a+covenant%3A+%E2%80%9CAs+for+me%2C+this+is+my+covenant+with+them%2C+saith+the+Lord%3B+My+Spirit+that+is+upon+thee%2C+and+my+words+that+are+in+thy+mouth%2C+shall+not+depart+out+of+thy+mouth%2C+nor+out+of+the+mouth+of+thy+seed%2C+nor+out+of+the+mouth+of+thy+seed%E2%80%99s+seed%2C+saith+the+Lord%2C+from+henceforth+and+for+ever+%E2%80%9D+%28Isa.+lix.+21%29.%0A%0AWhen+the+Lord+invites+lost+sinners+to+Himself%2C+it+is+in+terms+like+these%3A+%E2%80%9CIncline+your+ear%2C+and+come+unto+me%3A+hear%2C+and+your+souls+shall+live%3B+and+I+will+make+with+you+an+everlasting+covenant%2C+even+the+sure+mercies+of+David%E2%80%9D+%28Isa.+lv.+3%29.+When%2C+moved+by+such+entreaties%2C+sinners+ask+the+way+to+Zion%2C+with+their+faces+thitherward%2C+it+is+with+the+mutual+exhortation%3A+%E2%80%9CCome%2C+and+let+us+join+ourselves+to+the+Lord+in+a+perpetual+covenant+that+shall+not+be+forgotten%E2%80%9D+%28Jer.+i.+5%29.+When%2C+after+entering+on+this+blessed+relation+with+God%2C+they+would+express+their+full+satisfaction+with+it+in+the+midst+of+all+life%E2%80%99s+troubles+and+afflictions%2C+they+are+wont+to+say%3A+%E2%80%9CThough+my+house+be+not+so+with+God%3B+yet+He+hath+made+with+me+an+everlasting+covenant%2C+ordered+in+all+things+and+sure%3A+this+is+all+my+salvation%2C+and+all+my+desire%E2%80%9D+%282+Sam.+xxiii.+5%29.%0A%0AFor+in+the+midst+of+all+troubles+by+which+their+sins+are+chastised+and+their+spirit+chastened%2C+the+Lord+sustains+their+faith+by+the+gracious+declaration%3A+%E2%80%9CMy+covenant+will+I+not+break%2C+nor+alter+the+word+that+hath+gone+out+of+my+mouth%E2%80%9D+%28Ps.+lxxxix.+34%29.+And+when+grieved+in+the+view+of+the+%E2%80%9Ccruelty%E2%80%9D+that+obtains+in+the+%E2%80%9Cdark+places+of+the+earth%2C%E2%80%9D+the+Church%E2%80%99s+strongest+appeal+to+God+on+their+behalf+is+this%3A+%E2%80%9CHave+respect+unto+Thy+covenant%E2%80%9D+%28Ps.+lxxiv.+20%29.%0A%0AThese+are+some+of+the+more+express+verbal+assertions+of+the+reality+and+fact+of+a+Covenant+of+Grace.+Intelligent+piety+is+familiar+with+them+as+with+household+words%3B+and+we+quote+them+simply+to+show+that+the+federal+theology+is+no+product+of+mere+human+ingenuity+%E2%80%94+no+merely+artificial+structure+%E2%80%94+but+a+Scriptural+theme%2C+the+terminology+of+which+is+directly+furnished+by+Scripture+itself.+It+is+no+roundabout+result+of+mere+theologising%2C+but+one+of+the+immediate+data+of+Divine+inspiration.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Atonement%3A+In+Its+Relations+to+the+Covenant%2C+the+Priesthood%2C+the+Intercession+of+our+Lord%2C+%28London%3A+James+Nisbet+%26+Co.%2C+1870%29%2C+pp+22-25.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb9eef6c321.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b9eef6c321.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/25/hugh-martin-on-the-blood-of-the-everlasting-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The first great thing in this Controversy is, to consider the nature of the Covenant, which is the first foundation of the privilege to believers, and their seed, as it was first made with Abraham and his seed, in the name of all believers, and their seed both Jews and Gentiles; for so large is the extent of that Covenant to both, as hereafter shall be proved from the New Testament expressions; and if we find the same Covenant reaching Gentile-believers, and their Children, as Abraham and his, we cannot be denied the new external sign and seal of the same Covenant; for though the outward signs may be changed, yet there is no change of the privileges, if the Covenant remain entire.</p></blockquote>

<blockquote><p>Vers. 14. For sin shall not have dominion over you; for ye are not under the Law, but under Grace.

</figure><figure class="quote" id="q-542d0dd86b" data-kw="">
<blockquote><p>As God is pleased to enter into Covenant with his people, so is he first in the Covenant. God requires no man to bind himself by Covenant to Him, till the Lord first strike a Covenant with his Soul. As we love him, because he loved us first; so we enter into Covenant with him, because he first entereth into Covenant with us. I will be their God, he is first bound, and seals first; and then, and not till then, it follows; they shall be my people. This is the constant tenor of the Covenant. And shall he begin, and we think much to follow?

Can there be a marriage consummated where only the man is first married to the woman, and the woman will not after, for her part, be married to the man? Now, God no way so much declares his willingness to be in Covenant, and to be first in it, as by deliverances … great reason therefore, men should then second him by mutual stipulation. It is an hard case, when men will not follow, where God leads.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-a29e6fd016" data-kw="">
<blockquote><p>Now, what is the foundation of this, that God is our God in the covenant of grace? We say it is founded on Christ. God is Christ’s God, and then our God; and that is the reason why Christ is called ‘Immanuel’, which is as much as to say, as it is expounded, ‘God with us’.

Not only because when he took our nature on him, there was God and man in one person; but the meaning of the word is, Christ is Immanuel, ‘God with us’; by being God in our nature, and satisfying divine justice in our nature, hath brought God the Father and us into a sweet covenant. So that God may be our God and our Father, notwithstanding his justice; because all is satisfied by Christ, who took our nature to die for us.

Christ is Immanuel, because he hath made God and us one. So that God is our God, and not only so, but our Father is him. Thus you see how it cometh to pass that God is our Father by Christ, who came to bring us again to God, as his whole office was to bring a few that had been singled out of mankind to God again, from whom they fell; for we all had communion with God in Adam, but we lost it; and now must be brought again to God, which must be done by Christ, God and man.</p></blockquote>

</figure><figure class="quote" id="q-c27ce54068" data-kw="">
<blockquote><p>§5. The covenant of God with man is different from those made by men among themselves. For men make covenants for mutual benefits. God, however, makes covenant for His people. Indeed, the covenant of God is nothing other than the divine declaration of the way of receiving the love of God as well as the union and communion of becoming a partaker in Him. If man makes use of this way, he is in the friendship of God, or, the Creator is his own. God is his own in a personal way (Gen. 17:7), and he is one spirit with God (1 Cor. 6:17), who is one with him (John 17:21). His is … the intimate fellowship of God (Ps. 25:14, cf. Job 29:4; John 14:23).

The one who is outside of the covenant is αθεος, without God (Eph. 2:12). This declaration, taken from Hebrews 8:6, can rightly be called θεία ἐπὶ ἐπαγγελίαις νομοθεσία, divine legislation sanctioned in the promises. When it is attached to the application of the testament or the plan of the future inheritance (we discuss this application below in §179; §184), νομοθεσία διαθήκης, the legislation of the testament, or διαθήκη νενομοθετημένη, the testament according to the force of the covenant and law, is described.

§6. Therefore, the covenant of God with man is μονόπλευρον (one-sided), insofar as it is the design and arrangement of God alone concerning the way of receiving His love and benefits. Indeed, this is very similar to the way in which victors are accustomed to order their vanquished, masters their αργυρωνήτοις, slaves, and parents their children. Every covenant of God, however, is not so μονόπλευρον (one-sided) that obligation is entirely absent from the other party, as it is for instance when God makes covenant with day and night, obligating Himself by decree that the distinction between day and night would be preserved (Jer. 33:20; Gen. 8:22).</p></blockquote>

</figure><figure class="quote" id="q-08efeb61d1" data-kw="">
<blockquote><p>God’s Children though they sin, yet still they are in covenant with God; God hath taken them in to an everlasting covenant with himself, that shall never be broken: Though they do offend, God will not charge it upon them as the breach of that great covenant of grace that God hath made with them in his Son, that’s an everlasting covenant; God hath made a covenant to unite their hearts to fear his name, that he will never depart from them; and that he will put his fear into their hearts, and they shall never depart from him, notwithstanding all their infirmities: This must be made good, this covenant that God hath made with them, must stand.</p></blockquote>

</figure><figure class="quote" id="q-3647fd4473" data-kw="">
<blockquote><p>In the times of truest spiritual life, this was not forgotten in Israel. The holy men who “obtained a good report by faith” had large and world-wide views, and large and world-wide hopes, as to the grace of God and the reign of their Messiah. They expected Him to rule over a kingdom co-extensive with the whole world. They expected Him to dispense blessings sufficient for every land.

The more they appreciated their own sinfulness and the freeness and sovereignty of the grace of God, the more did they clearly comprehend how the Gentiles also might freely partake of the same free mercy with themselves; and the more they felt the vanity of all earthly good and the helplessness of their whole earthly estate, and appreciated the promised kingdom and sovereign reign of their Christ as unworldly, spiritual, heavenly, divine, and eternal, so much the more did they clearly see how all nations, as they needed, so they might be embraced by, this new, heavenly kingdom of the Lord and His Anointed.

Hence, in the days of David, when true spiritual life flourished, and un-Pharisaic knowledge of the grace of God was comparatively widely diffused, the Gentiles were looked on with no evil eye; their salvation was felt to be clearly within the compass of the covenant of Abraham; and their subjugation to the coming Messiah was regarded as one of the glorious events which should mark and grace His advent and manifestation. Hence such passages in the Psalms as these,—the first addressed by the Father to His Anointed, and the second by the Church to her covenant God :— “Ask of me, and I will give thee the heathen for thine inheritance, and the uttermost parts of the earth for thy possession;” “Have respect unto Thy covenant, for the dark places of the earth are full of the habitations of cruelty” (Ps. ii. 6; lxxiv. 20).

And if any farther proof be needed that the Church, in the days of her true life and fidelity, looked for being enlarged with the believing brotherhood of the converted nations, we have it in that noble hymn of missionary prayer and hope, opening as it does with the well-remembered words, “God be merciful unto us, and bless us: and cause his face to shine upon us; that thy way may be known upon earth, thy saving health among all nations,” and closing with the confession of free, unhampered, appropriating faith, “God shall bless us,” and with the enlarged and unbounded expectation, “And all the ends of the earth shall fear him” (Ps. lxvii. 1—7).

But in the days of Israel’s degeneracy, when faith gave place to formalism, and contrite gratitude to cold and supercilious ceremony; when self-righteous pride, singularly enough keeping pace with increasing iniquity and worthlessness, arrogantly claimed right to the privileges of the covenant in very proportion as all the spirit of the covenant was violated; when the close and narrow spirit of legalism, resting its claims on carnal distinctions, and saying, “ We have Abraham to our Father,” superseded the true spirit of Israel, “I am not worthy of the least of all the goodness and the truth thou hast shown unto thy servant;” the idea of pure and sovereign grace being lost sight of — that grace whereby Jew and Gentile alike may be freely saved, — and the kingdom of the Messiah being conceived of as earthly and limited — set up, indeed, as a badge of distinction, to magnify the seed of Abraham according to the flesh; then the Gentile nations began to be looked upon as natural and irreconcilable enemies.

The Jewish Church, in fact, in such a spirit, enacts exactly the part of the Pharisee of the parable, while the publican may represent the waste of heathendom; and the vain-glorious Church, claiming Heaven’s favour on the ground of her carnal distinctions and pitiable tithings, thanks God that she is not as this poor publican!

<blockquote><p>(4.) In the fourth place, that it is not enough to consider this oneness [between Christ and the elect] as decreed; we must consider it as specially and expressly covenanted: not merely as decreed by the sovereign authority of the Godhead, but covenanted between the eternal Father and the eternal Son.

To trace the oneness between Christ and His people to a Divine decree may honour the Godhead: but does it honour the Trinity in Godhead? On the contrary, it refuses recognition of the Trinity, precisely in that grand manifestation in which the doctrine of the Trinity — the truth of the distinct personalities of the Divine persons — is most especially to be recognised. There is no revelation of the Trinity in Godhead comparable to that which is afforded by the Covenant of Grace.

To “us men, and” in “our salvation,” the doctrine of the Trinity is commended, as at once revealed and precious, as placed in clearest evidence in the distinct actings of the persons of the Godhead in that Divine compact which is the spring and fountainhead of our eternal hopes. And even “to the principalities and powers in heavenly places,” it is probable, “there is made known by the Church” and her covenanted salvation, in the most eminent possible demonstration, the subsistence of three persons in the one Divine Being.

To be satisfied, therefore, with regarding Christ’s oneness with His people as simply decreed and not covenanted, would be a very grave mistake; a mistake for which indeed there can be no excuse, as there can surely be no intelligible temptation. Moreover, it were to pretermit the due recognition of the voluntariness of Christ’s susception and entire accomplishment of the work given Him to do. And still further, it were to overlook the splendid evidence of love as the great originating principle and motive of His redemption. There is a certain aspect of coldness about a mere decree. Practically, in the mind’s view, it comes too closely to be identified, in point of impression, with the idea of cold, dead, impersonal fate. Unitarianism is ever doomed to have this practical outgoing.

It is in Trinity that provision is seen for the vivid warmth of personality and personal love; and especially in the covenant of Trinity for man’s redemption. There are distinct personal actings of the Father, and of the Son, and of the Spirit, in the Covenant. There are distinct actings of the will of the Father, and of the will of the Son in that oneness that is constituted between Christ and His people, and which justifies and bears up all that is achieved for their salvation. And these actings of will are actings of love.

Hear the overflowings of love from Christ’s heart, as His achievements for His people are by Himself referred back upon the loving deed by which the Father made them over to Him to be His own:— “O righteous Father, Thine they were, and Thou gavest them Me, and I have kept them.” He means to say: Therefore, for that reason, have I kept them; even as I would keep that love-gift of Thine, which I did so willingly and lovingly receive.

Identified, by loving covenant between Himself and the Father, with the people given unto Him; truly representing them, because identified in covenanted oneness with them; He becomes their competent and acceptable substitute and surety,—His substitution in every light most justifiable in the eye of law most stringent and of righteousness inexpugnable. And the vindication of His vicarious sacrifice of Himself for their salvation, is set on high in the intelligent and joyful convictions of the poor and needy, beyond the possibility of any sinister and false philosophy endangering it.

While the Divine Head of the Church has, in His great goodness, long kept these views before men’s minds in Scotland, we cannot but cherish a deep sympathy — we would say pity, but that the word might be considered invidious, while no such feeling is in our heart — towards many earnest and noble minds in Germany, evidently inquiring with the greatest ardour after the truth as it is in Jesus Christ, but baffled because the covenant oneness between Redeemer and redeemed has not yet come into their field of vision. It is the doctrine of the Covenant that they need.

No wonder that, in ignorance of this great guiding principle, to a beautiful and so love-worthy spirit as that of [Karl] Ullmann, “substitution” should seem an arbitrary and capricious thing; and that to many others “imputation” should be obnoxious, as a mere make-believe and legal fiction, with which they cannot accredit the God of truth. Moral instinct, the dictates of pious feeling, and Holy Scripture all combine to convince them that “the judgment of God must be according to truth.” That moral axiom — that sacred spiritual postulate — they feel they must at all hazards conserve. And they are right. Any doctrine of Atonement or of justification that should impugn it, is thereby necessarily demonstrated to be false.

But let Christ and His people be federally one, by the sovereign authority and love of the Father, and by the voluntary covenanted acceptation of the Son. In that case, legal fiction, make-believe, arbitrariness and caprice, are at the furthest possible remove from the Divine Covenant transaction of our redemption, — alike from the basis of it, and from all the fruits of it. “Christ bears the sins of many,” because, in His covenanted identification with these “many,” their sins are sinlessly and truly His sins. And unto the same ” many sons and daughters” of the Covenant, the Father imputes the righteousness of the Son, because, in their covenant oneness with the Son, His righteousness is undeservedly but truly their own righteousness. And all throughout, “the judgment of God is according to truth.</p></blockquote>

— Hugh Martin, The Atonement: In its Relations to the Covenant, the Priesthood, the Intercession of our Lord, (London: James Nisbet &amp; Co., 1870), pp 35-39.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%284.%29+In+the+fourth+place%2C+that+it+is+not+enough+to+consider+this+oneness+%5Bbetween+Christ+and+the+elect%5D+as+decreed%3B+we+must+consider+it+as+specially+and+expressly+covenanted%3A+not+merely+as+decreed+by+the+sovereign+authority+of+the+Godhead%2C+but+covenanted+between+the+eternal+Father+and+the+eternal+Son.%0A%0ATo+trace+the+oneness+between+Christ+and+His+people+to+a+Divine+decree+may+honour+the+Godhead%3A+but+does+it+honour+the+Trinity+in+Godhead%3F+On+the+contrary%2C+it+refuses+recognition+of+the+Trinity%2C+precisely+in+that+grand+manifestation+in+which+the+doctrine+of+the+Trinity+%E2%80%94+the+truth+of+the+distinct+personalities+of+the+Divine+persons+%E2%80%94+is+most+especially+to+be+recognised.+There+is+no+revelation+of+the+Trinity+in+Godhead+comparable+to+that+which+is+afforded+by+the+Covenant+of+Grace.%0A%0ATo+%E2%80%9Cus+men%2C+and%E2%80%9D+in+%E2%80%9Cour+salvation%2C%E2%80%9D+the+doctrine+of+the+Trinity+is+commended%2C+as+at+once+revealed+and+precious%2C+as+placed+in+clearest+evidence+in+the+distinct+actings+of+the+persons+of+the+Godhead+in+that+Divine+compact+which+is+the+spring+and+fountainhead+of+our+eternal+hopes.+And+even+%E2%80%9Cto+the+principalities+and+powers+in+heavenly+places%2C%E2%80%9D+it+is+probable%2C+%E2%80%9Cthere+is+made+known+by+the+Church%E2%80%9D+and+her+covenanted+salvation%2C+in+the+most+eminent+possible+demonstration%2C+the+subsistence+of+three+persons+in+the+one+Divine+Being.%0A%0ATo+be+satisfied%2C+therefore%2C+with+regarding+Christ%E2%80%99s+oneness+with+His+people+as+simply+decreed+and+not+covenanted%2C+would+be+a+very+grave+mistake%3B+a+mistake+for+which+indeed+there+can+be+no+excuse%2C+as+there+can+surely+be+no+intelligible+temptation.+Moreover%2C+it+were+to+pretermit+the+due+recognition+of+the+voluntariness+of+Christ%E2%80%99s+susception+and+entire+accomplishment+of+the+work+given+Him+to+do.+And+still+further%2C+it+were+to+overlook+the+splendid+evidence+of+love+as+the+great+originating+principle+and+motive+of+His+redemption.+There+is+a+certain+aspect+of+coldness+about+a+mere+decree.+Practically%2C+in+the+mind%E2%80%99s+view%2C+it+comes+too+closely+to+be+identified%2C+in+point+of+impression%2C+with+the+idea+of+cold%2C+dead%2C+impersonal+fate.+Unitarianism+is+ever+doomed+to+have+this+practical+outgoing.%0A%0AIt+is+in+Trinity+that+provision+is+seen+for+the+vivid+warmth+of+personality+and+personal+love%3B+and+especially+in+the+covenant+of+Trinity+for+man%E2%80%99s+redemption.+There+are+distinct+personal+actings+of+the+Father%2C+and+of+the+Son%2C+and+of+the+Spirit%2C+in+the+Covenant.+There+are+distinct+actings+of+the+will+of+the+Father%2C+and+of+the+will+of+the+Son+in+that+oneness+that+is+constituted+between+Christ+and+His+people%2C+and+which+justifies+and+bears+up+all+that+is+achieved+for+their+salvation.+And+these+actings+of+will+are+actings+of+love.%0A%0AHear+the+overflowings+of+love+from+Christ%E2%80%99s+heart%2C+as+His+achievements+for+His+people+are+by+Himself+referred+back+upon+the+loving+deed+by+which+the+Father+made+them+over+to+Him+to+be+His+own%3A%E2%80%94+%E2%80%9CO+righteous+Father%2C+Thine+they+were%2C+and+Thou+gavest+them+Me%2C+and+I+have+kept+them.%E2%80%9D+He+means+to+say%3A+Therefore%2C+for+that+reason%2C+have+I+kept+them%3B+even+as+I+would+keep+that+love-gift+of+Thine%2C+which+I+did+so+willingly+and+lovingly+receive.%0A%0AIdentified%2C+by+loving+covenant+between+Himself+and+the+Father%2C+with+the+people+given+unto+Him%3B+truly+representing+them%2C+because+identified+in+covenanted+oneness+with+them%3B+He+becomes+their+competent+and+acceptable+substitute+and+surety%2C%E2%80%94His+substitution+in+every+light+most+justifiable+in+the+eye+of+law+most+stringent+and+of+righteousness+inexpugnable.+And+the+vindication+of+His+vicarious+sacrifice+of+Himself+for+their+salvation%2C+is+set+on+high+in+the+intelligent+and+joyful+convictions+of+the+poor+and+needy%2C+beyond+the+possibility+of+any+sinister+and+false+philosophy+endangering+it.%0A%0AWhile+the+Divine+Head+of+the+Church+has%2C+in+His+great+goodness%2C+long+kept+these+views+before+men%E2%80%99s+minds+in+Scotland%2C+we+cannot+but+cherish+a+deep+sympathy+%E2%80%94+we+would+say+pity%2C+but+that+the+word+might+be+considered+invidious%2C+while+no+such+feeling+is+in+our+heart+%E2%80%94+towards+many+earnest+and+noble+minds+in+Germany%2C+evidently+inquiring+with+the+greatest+ardour+after+the+truth+as+it+is+in+Jesus+Christ%2C+but+baffled+because+the+covenant+oneness+between+Redeemer+and+redeemed+has+not+yet+come+into+their+field+of+vision.+It+is+the+doctrine+of+the+Covenant+that+they+need.%0A%0ANo+wonder+that%2C+in+ignorance+of+this+great+guiding+principle%2C+to+a+beautiful+and+so+love-worthy+spirit+as+that+of+%5BKarl%5D+Ullmann%2C+%E2%80%9Csubstitution%E2%80%9D+should+seem+an+arbitrary+and+capricious+thing%3B+and+that+to+many+others+%E2%80%9Cimputation%E2%80%9D+should+be+obnoxious%2C+as+a+mere+make-believe+and+legal+fiction%2C+with+which+they+cannot+accredit+the+God+of+truth.+Moral+instinct%2C+the+dictates+of+pious+feeling%2C+and+Holy+Scripture+all+combine+to+convince+them+that+%E2%80%9Cthe+judgment+of+God+must+be+according+to+truth.%E2%80%9D+That+moral+axiom+%E2%80%94+that+sacred+spiritual+postulate+%E2%80%94+they+feel+they+must+at+all+hazards+conserve.+And+they+are+right.+Any+doctrine+of+Atonement+or+of+justification+that+should+impugn+it%2C+is+thereby+necessarily+demonstrated+to+be+false.%0A%0ABut+let+Christ+and+His+people+be+federally+one%2C+by+the+sovereign+authority+and+love+of+the+Father%2C+and+by+the+voluntary+covenanted+acceptation+of+the+Son.+In+that+case%2C+legal+fiction%2C+make-believe%2C+arbitrariness+and+caprice%2C+are+at+the+furthest+possible+remove+from+the+Divine+Covenant+transaction+of+our+redemption%2C+%E2%80%94+alike+from+the+basis+of+it%2C+and+from+all+the+fruits+of+it.+%E2%80%9CChrist+bears+the+sins+of+many%2C%E2%80%9D+because%2C+in+His+covenanted+identification+with+these+%E2%80%9Cmany%2C%E2%80%9D+their+sins+are+sinlessly+and+truly+His+sins.+And+unto+the+same+%E2%80%9D+many+sons+and+daughters%E2%80%9D+of+the+Covenant%2C+the+Father+imputes+the+righteousness+of+the+Son%2C+because%2C+in+their+covenant+oneness+with+the+Son%2C+His+righteousness+is+undeservedly+but+truly+their+own+righteousness.+And+all+throughout%2C+%E2%80%9Cthe+judgment+of+God+is+according+to+truth.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Atonement%3A+In+its+Relations+to+the+Covenant%2C+the+Priesthood%2C+the+Intercession+of+our+Lord%2C+%28London%3A+James+Nisbet+%26+Co.%2C+1870%29%2C+pp+35-39.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b7335c993.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b7335c993.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/14/hugh-martin-on-the-trinity-and-the-covenant-of-grace-for-mans-redemption/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-14e1689bee" data-kw="">
<blockquote><p>By the gospel-lamp there is a discovery made of a new and better covenant established in Christ as a second Adam, than that which was made with the first Adam, even a covenant of grace and promise; which being confirmed by the death of Christ, is now set out in its last and best edition, viz., as a testamentary deed. Everything in and about this covenant is wonderful and mysterious. The Trinity transacted in it with Christ as a second Adam from eternity: “I have made a covenant with my chosen; I have sworn unto David my servant,” Psalm Ixxxix. 3.

The gradual manifestation of this covenant unto us, and the variety of dispensations that it has undergone under the Old and New Testament, and yet still the same covenant. The absolute freedom of this covenant unto us, no conditions or qualifications required on our part to interest us in it, the proper condition of it being already fulfilled in the obedience and death of Christ, it comes out to us absolutely free, “I will be their God. I will sprinkle them with clean water, and they shall be clean. I will take away the heart of stone,” &amp;c.

The way how a sinner is brought within the bonds of this covenant is only owing to the gospel-lamp or light, namely, by faith, not of the operation of man, but of the operation of God in a day of power. He just makes the sinner willing to be saved without money and without price, upon the footing of free grace reigning in and through an imputed righteousness, &amp;c.</p></blockquote>

<blockquote><p>3. According to the good pleasure and everlasting counsels of the Father, Son, and Holy Spirit, and for the manifestation of the divine glory in the salvation of sinners, the Father, from eternity, entered into a covenant with Son, the Lord Jesus Christ, promising to Him great mediatorial glory, and the eternal life of the elect, upon condition of His fulfilling all righteousness as their Surety.

To the terms of this covenant, the Lord Jesus voluntarily and graciously acceded, and, being accepted as the head and representative of the elect, was invested, with mediatorial offices, and by the oath of God constituted the Surety of the everlasting covenant.

The Holy Spirit participated with the Father and the Son in the formation of the covenant, and graciously undertook to sustain an infinitely important part in its execution. In this covenant there is not only a display of the perfections of the Godhead, but a display of these perfections as subsisting in the persons of the Father, Son, and Holy Spirit, the mystery of trinity in unity being exhibited in a peculiarly convincing and glorious manner in the federal economy.

4. This covenant is sometimes called by the church the covenant of redemption, but more commonly the covenant of grace. The former name is applied to it when it is viewed as an agreement between the Father and the Son that Christ should redeem the elect by satisfying, in their room, all the demands that divine justice had upon them. The latter name is applied to it when it is viewed as originating solely in the sovereign love of the Godhead, and as freely conveying Christ and all blessings in Him to elect sinners, notwithstanding their absolute unworthiness.</p></blockquote>

<blockquote><p>Ministers do, indeed, offer Christ to all, upon condition of believing, being commanded to preach the gospel to every creature, and not knowing who are reprobates; but that Christ himself (knowing that the son of perdition was now lost, that the Scripture might be fulfilled, John xvii. 12) would, in the sacrament (which is more applicative than the word, and particulariseth the promises to the receivers), so to speak, as that, in any sense, those words might be applied to Judas, that even for him, his body was broken and his blood shed; and that, thereupon, the seals should be given him, to me is not at all credible, and I prove the negative by four arguments (though I might give many more):

1. If Christ did, in reference to Judas, mean conditionally that his body was broken, and his blood shed for him, if he would believe (as Mr Prynne holds), then he meant conditionally to save the son of perdition, whom he knew infallibly to be lost, and that he should be certainly damned and go to hell, and that, in eating the sacrament, he would certainly eat and drink judgment to himself (all which Mr Prynne himself, p. 26, saith Christ infallibly knew). But who dare think or say so of Jesus Christ. …

2. If Christ would not pray for Judas, but for his elect apostles only, and such as should believe through the word of the gospel, then he meant not so much as conditionally to give his body and blood for Judas (for if he meant any good to Judas, so much as conditionally, he would not have excluded him from having any part at all in his prayers to God). But Christ doth exclude Judas from his prayer, John xvii., not only as one of the reprobate world, ver. 9, but even by name, ver. 12, giving him over for lost, and one that was not to be prayed for.

3. Love and hatred in God, and in his Son Jesus Christ, being eternal and unchangeable (for actus Dei immanentes sunt cetemi), it followeth that if there was such a decree of God, or any such meaning or intention in Christ, as to give his body and blood for Judas, whom he knew infallibly to be lost, and since that same conditional meaning or intention could not be without a conditional love of God and of Christ to Judas and his salvation, this love doth still continue in God, and in Christ, to save Judas now in hell, upon condition of his believing, which every Christian I think will abominate.

4. That conditional love and conditional intention or meaning, could not have place in the Son of God. For as Spanhemius [Friedrich Spanhem] doth rightly argue in his learned exercitations, de Gratia Universali, p. 746, it doth not become either the wisdom or goodness of God to will and intend a thing upon such a condition as neither is nor can be. And p. 829, he saith, that this conditional destination or intention cannot be conceived, as being incident only to such as do neither foreknow nor direct and order the event, and in whose hand it is not to give the faculty and will of performing the thing, which cannot without impiety be thought or said of God.</p></blockquote>

</figure><figure class="quote" id="q-4d6b6e7b50" data-kw="">
<blockquote><p>That this covenant between God and us is free and undeserved, and leaneth upon no condition of our worthiness or merits, but standeth by faith alone, hence it may easily appear. For in respect of God he properly maketh the covenant with us, and he sealeth in our hearts by his holy spirit, that same promise of underserved reconciliation offered unto us in the Gospel. Titus 3. ver. 5, 6, 7. 2 Tim. I. ver. 9. Gal. 3. ver. 6. 28, 29. In respect of us this covenant is received only by faith, while that freely and underservedly the holy Ghost is given unto us, who bringeth to pass that both we will and are able to believe the free promise of reconciliation through Christ. Eph. I. Joel 2. Esay. 59.

If you respect the mediator, verily our heavenly father hath received of him the price of reconciliation, and we have satisfied in him: notwithstanding because the mediator is freely given unto us, and imputeth also freely this merit unto us, even by this reason also the covenant is free. And so the covenant is free. And so this whole covenant is merely free, and consisteth in faith alone: the oblation of promise of grace in Christ, and also the giving of Christ himself in respect of God is freely receiving on our part is also free, because it is the work of God in us, whereby he sealeth his promise in our hearts, that being drawn we should work, that is to say, that being made believers by him we might believe. Ephe. 2. ver. 1, 5, 6, 7, 8, 9, 10.</p></blockquote>

<blockquote><p>Q. 32 Why is this covenant also called a testament?

A. First, because the term testament began to be used in the church instead of the term covenant.

Second, because just as a testament is not valid without the death of the testator, so also this covenant could not be valid without the death of Christ.

Q. 33 What is the difference between the Old and the New Testament?

A. It is the same testament or covenant of God with all the elect from the first promise given in Paradise, concerning the seed of the woman who would crush the head of the serpent, to the end of the world.

But they are called Old and New Testaments because some of the circumstances and signs of the covenant were changed.

First, in the Old they believed in the Christ who was still to come; in the New we believe in the Christ who has been revealed.

Second, the Old contained the promise of the preservation of the nation of Israel until the time of Christ; in the New we have only the general promise of the preservation of the church under various governments.

Third, the Old had levitical ceremonies, for which, having been abolished in the New, Christ instituted baptism and the Lord’s supper.

Fourth, the Old was more obscure; the New is clearer.</p></blockquote>

<blockquote><p>But we must remember that our new obedience, which is the fruit of our redemption, standeth in the study of piety, that is, in the truth of our desires, uprightness of our will, and purpose, sincerity of our care and endeavours, rather then in the perfect performance, the Lord in his children accepting the will for the deed.

By which desire, will, and endeavour, though we do not perfectly fulfil the law, yet we may be truly said to keep it. And if we have this unfained desire, sincere purpose, and upright endeavour to please God in the duties of piety and charity; we shall be accepted of God, according to the covenant of grace, as true worshippers of God in holiness &amp; righteousness. This caution is carefully to be remembered; otherwise, the greatest part of true Christians might seem to be excluded out of the covenant of grace, and out of the number of them that are redeemed by CHRIST.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), p. 59.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But we must remember that our new obedience, which is the fruit of our redemption, standeth in the study of piety, that is, in the truth of our desires, uprightness of our will, and purpose, sincerity of our care and endeavours, rather then in the perfect performance, the Lord in his children accepting the will for the deed.

By which desire, will, and endeavour, though we do not perfectly fulfil the law, yet we may be truly said to keep it. And if we have this unfained desire, sincere purpose, and upright endeavour to please God in the duties of piety and charity; we shall be accepted of God, according to the covenant of grace, as true worshippers of God in holiness &amp; righteousness. This caution is carefully to be remembered; otherwise, the greatest part of true Christians might seem to be excluded out of the covenant of grace, and out of the number of them that are redeemed by CHRIST.”

<blockquote><p>The covenant of grace in Christ is made only with the Israel of God, the church of the elect. … The covenant of grace, as reduced into the form of a testament, confirmed by the blood of Christ, doth not depend on any condition or qualification in our persons, but on a free grant and donation of God, and so do all the good things prepared in it.</p></blockquote>

<blockquote><p>What remains for sinners, that they may be personally and savingly in covenant with God, is not, as parties contractors and undertakers, to make a covenant with him for life and salvation; but only, to take hold of God’s covenant already made from eternity, between the Father and Christ the second Adam, and revealed and offered to us in the gospel, Isa. lvi. 4, 6. I have no design hereby to disparage our covenants made for national reformation by our godly progenitors, and commonly called the national covenant, and solemn league and covenant, on which God set the seal of his good pleasure in the experience of many. These and the like are covenants of duties, consequential enough to the taking hold of God’s covenant of grace.

Neither would I discourage any serious souls, from taking hold of God’s covenant of grace, for eternal life and salvation to themselves, with all the awful solemnity of the most express words, yea, and of writing and subscribing it with their hands; which is commonly called personal covenanting. But I would have all to beware of a practical corrupting of the covenant of grace, by making covenants of their own, upon such and such terms, which they will fulfil for life and salvation. The carnal Jews mistaking the design of the giving of the law, did so corrupt the covenant of grace; looking for life and salvation, not for the sake of the promised seed alone, but for their obedience, such as it was, to the moral and ceremonial laws.

And thus many, thinking that eternal salvation is proposed to them in the word upon the condition of faith, repentance, and sincere obedience to God’s law, do consent to these terms, and solemnly undertake to perform them: just binding themselves to such and such duties, that God may save their souls : and so they make their covenant. And while they can persuade themselves, that they perform their part of the covenant, they look for life and salvation thereupon. This doth quite overturn the nature of the covenant of grace: for “to him that worketh, the reward is not reckoned of grace, but of debt,” Rom. iv. 4; and “if it be of works, then it is no more grace,” chap. xi. 6.

The sinfulness of this practice is great, as overlooking Christ, the great undertaker and party-contractor by the appointment of the Father; and putting themselves in his room, to do and work for themselves for life. And the danger of it must needs be great, as laying a foundation to bear the weight of their salvation, which divine wisdom saw to be quite unable to bear it. The issue whereof must be, that such covenanters shall lie down in sorrow. So the apostle determines, Gal. v. 4, “Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 430-31.</span></figcaption>

<blockquote><p>The first, that it is not the will of God that all men should be saved. …

Of the first S. Augustine disputeth in this manner, That God will not have all men to be saved, it is manifest, forasmuch as our Saviour wrought many works in the unthankful cities, Corazin, Bethsaida, &amp; Capernaum, which he knew would not repent, but he refrained from shewing any such examples in Tire and Sidon, and Gomorrah and Sodom, which if he had done there, Tire and Sidon had repented in sackcloth &amp; ashes, &amp; Sodom had remained until this day. Moreover, saith he, I give thee thanks, o father, lord of heaven &amp; earth, because thou hast hid these things (meaning the mysteries of salvation) from̄ the wise &amp; understanding, &amp; hast opened them to babes, it is so, o father, because thy good will was such. But how then, saith he, shall we answer the objection of S. Paul? …

If God will have all men to be saved, as the apostle writeth, how is it that the greatest part are damned? … his power is greater thē his will, and his will extendeth not it self so far as his power: his will is not to do all that he can, but he can do whatsoever is his will, as the prophet speaketh. Our god is in heaven, and he doth what he listeth. If it be his will to save all, and his power is omnipotent to do what he will, why then are but a remnant saved? Some, saith August. do answer, that the cause is in themselves, as if God will, but they will not, as it is in the gospel, Jerusalem, Jerusalem, which killest the prophets, and stonest thē which are sent to thee, how often would I have gathered thy children together, as the hen gathereth her chickens, but thou wouldst not? … As though the will of God could be crossed by the will of men, and the almighty could be hindered of his purpose by the weakest vessels. how thē was he omnipotent, if he were willing to gather the children of Jerusalem, but did it not?

That text being not understood, would at the first sight seem to import so much, as if the will of God were made frustrate, and of none effect by the will of men, where then were his omnipotency? … Nay, rather Jerusalem in deed, forasmuch as lay in her, would not have her children gathered together, but his will was not frustrate, for as much as he against her will gathered together as many of them as seemed good to his own will and pleasure. And in another place he doeth answer it more fully, where he saith. … For their parts, &amp; as much in as them lay, they did that which God would not have to be done, but if ye consider the omnipotency of God, they could not doo otherways then was his will.

For, in as much as they did contrary to the will of God, in them so doing was fulfilled the will of God. And it is a wonderful mystery to see, that which is against his will, is not otherwise then he hath willed; for but by his sufferance it could not be, neither doth he suffer it against his will, but with his will: neither would God which is good suffer any thing to be done which is evil, unless his omnipotency were such that he could make good of that which is evil. Finally, to this objection out of Saint Paul, (having first disputed antagonisticò) he maketh his own answer dogmatic, and that two manner of ways.

The first is this: … Where it is written, that God willeth all men to be saved, and yet the greatest part of men are not saved, it is so to be understood. God willeth all men to be saved, that is, no man is saved against his will, but whosoever is saved, it is by his will, not as though there were none whom he would not have saved, but that none are saved, unless he will, and they only whom he will, and therefore he is to be prayed unto that he would, because it cannot otherwise be, but they shall be saved if he will, for the Apostle allegeth this as an argument, that we should pray to him for the salvation of all men, because it is by his will that they are saved. … Not as if he would have every one in particular, of all sorts of people to be saved, but of all sorts some to be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-dove.html">John Dove</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at Paul’s Cross, the sixth of February. 1596 In which are discussed these three conclusions. 1 It is not the will of God that all men should be saved. 2 The absolute will of God, and his secret decree from all eternity is the cause why some are predestined to salvation, others to d</cite>, (London: R. Dexter, 1597), pp 14-19.</span></figcaption>

</figure><figure class="quote" id="q-72529c518b" data-kw="">
<blockquote><p>And will place thee for a covenant. He now states the reason why God promises that he will be a guardian to Christ. Besides, the Prophet spoke of the Jews and the Gentiles separately; not that they differ by nature, or that the one is more excellent than the other, (for all need the grace of God, (Rom. iii.23,) and Christ has brought salvation to all indiscriminately,) but because the Lord assigned the first rank to the Jews, (Matt. x.6,) it was therefore proper that they should be distinguished from the others. Accordingly, before “the partition-wall” (Eph. ii.14) was thrown down, they excelled, not by their merit, but by the favor of God, because with them in the first instance the covenant of grace was made.

It may be objected, “Why is Christ appointed to a covenant which was ratified long before? for, more than two thousand years before, God had adopted Abraham, and thus the origin of the distinction was long previous to the coming of Christ.” I reply, the covenant which was made with Abraham and his posterity had its foundation in Christ; for the words of the covenant are these, “In thy seed shall all nations be blessed.” (Gen. xxii.18.)

And the covenant was ratified in no other manner than in the seed of Abraham, that is, in Christ, by whose coming, though it had been previously made, it was confirmed and actually sanctioned. Hence also Paul says, “that the promises of God are yea and amen in Christ,” (2 Cor. i.20,) and in another passage calls Christ “the minister of circumcision, to fulfill the promises which were given to the fathers.” (Rom. xv.8.) Still more clearly does he declare that Christ is “the peace” of all, so that they who were formerly separated are united in him, and both they who were far off and they who were near are thus reconciled to God. (Eph. ii.17.) Hence also it is evident that Christ was promised, not only to the Jews, but to the whole world.</p></blockquote>

</figure><figure class="quote" id="q-23c86677d5" data-kw="">
<blockquote><p>The covenant of redemption and the covenant of grace, are not two distinct covenants, but one and the same covenant. I know that many divines do express themselves otherwise in this matter; and that upon very different views, some of which are no ways injurious to the doctrine of free grace. But this I take to be Scripture truth, and a native consequent of the account given of the covenant of grace in our Larger Catechism, to wit, “That the covenant of grace was made with Christ as the second Adam, and in him with all the elect as his seed:” Gal. iii. 16. “Now to Abraham and his seed were the promises made. lie saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ,” Rom. v. 15, to the end. Isa. liii. 10, 11, “When thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the Lord shall prosper in his hand. He shall see of the travail of his soul, and shall be satisfied,” &amp;c.

So the covenant of redemption and the covenant of grace are but two names of one and the same second covenant, under different considerations. By a covenant of redemption is meant a bargain of buying and selling: and such a covenant it was to Christ only; for as much as he alone engaged to pay the price of our redemption, 1 Pet. i. 18, 19. By a covenant of grace, is meant a bargain whereby all is to be had freely: and such a covenant it is to us only, to whom the whole of it is of free grace; God himself having provided the ransom, and thereupon made over life and salvation to us, by free promise, without respect to any work of ours, as the ground of our right thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 396-97.</span></figcaption>

</figure><figure class="quote" id="q-8144e21586" data-kw="">
<blockquote><p>Upon all the glory of believers, there is that covering, the defence of the everlasting covenant, that is ordered in all things and sure. There are two covenants, that of grace, made with believers in Christ, and that of redemption, made with Christ himself, which is the foundation of the other; and these two make a strong covering and defence for that beauty and glory, which believers have from Christ: we have a summary of the covenant of redemption, in as far as we are concerned in it, Psa. 89:28, and onwards, there God engages thus, ‘his seed will make to endure forever, and if his children forsake my law, break my statutes, and keep not my commandments, then I will visit their transgressions with the rod, and their iniquity with stripes. Nevertheless, my loving kindness will I not utterly take from him, my covenant will I not break; but his seed shall endure for ever.’

The like account we have of the covenant of grace, Jer. 32:38, and downwards ‘they shall be my people, and I will be their God: And I will give them one heart, and one way, that they may fear me for ever, for the good of them, and of their children after them: And I will make an everlasting covenant with them, that I will not turn away from them, to do them good; but I will put my fear in their hearts, that they shall not depart from me.’ To which add what is in the parallel chapter, Jer. 31: 34, ‘I will forgive their iniquity, and remember their sins no more.’

Here indeed is a glorious covering stretched out over all the glory. Who will rob believers of that which is so well secured to them by that everlasting covenant of grace founded upon that eternal, and no less sure covenant of redemption? Now, that ye may know how sure it is made by this covenant, that they who were upon God’s heart from eternity, shall have Christ, how sure they, who have him once, are made, that they shall not lose him, him who is their glory.</p></blockquote>

<blockquote><p>That the elect were the party represented, or contracted and undertaken for, in the covenant of grace, appears from the following grounds.

1. The party with whom the covenant was made, is in the text called God’s chosen; as representing and contracting for all the chosen or elect: even as the first man was called Adam or man, as representing and contracting for all mankind in his covenant. For, as the apostle teacheth, Heb. ii. 11, He —and they — are all of one not only of one nature, but also of one body, to wit, the election; Christ is the head elect, Isa. xlii. 1, they the body elect, Eph. v. 23. Therefore they go under one name, principally belonging to him, and then to them by participation with him. Thus ho is also called Abraham’s seed, as representing all the spiritual seed of Abraham, that is, the elect, Gal. iii. 16, “And to thy seed which is Christ;” and the seed of the woman, as opposed to the serpent’s seed; and under that name also the elect are comprehended; they, and they only, being the party betwixt whom and the serpent with his seed, God puts the enmity, according to the promise, Gen. iii. 15.

2. Those whom Christ represented and contracted for in the covenant of grace, are the heavenly men: 1 Cor. xv. 47, 48, “The first man is of the earth, earthy: the second man is the Lord from heaven. As is the earthy, such are they also that are earthy; and as is the heavenly, such are they also that are heavenly.” Now, the heavenly men, belonging to Christ the second man, arc none other but the elect. For they are contra-distinguished to the earthy men, belonging to the first man; to wit, all mankind taken into the first covenant in Adam: and therefore they are the elect men, taken into the second covenant, in the second Adam.

Again, the heavenly men are those who shall bear the image of the heavenly man Christ, ver. 49; and such are the elect, and they alone. And, finally, they are those to whom Christ is, in respect of efficacy, a quickening spirit: for “as is the heavenly, such are they also that are heavenly.” As Adam’s deadly efficacy goes as wide as his representation did in the first covenant, reaching all mankind his natural seed, and them only; so Christ’s quickening efficacy goes as wide as his representation did in the second covenant, reaching all the elect, his spiritual seed, and them only: and if it did not, some would be deprived of the benefit which was purchased and paid for, by the surety, in their name: the which is not consistent with the justice of God.

3. They whom Christ represented and contracted for in the covenant, are his seed, his spiritual seed: Gal. iii. 16. “Now to Abraham and his seed were the promises made. He saith—and to thy seed, which is Christ.” Psalm lxxxix. 3, 4, “I have sworn unto David my servant. Thy seed will I establish for ever.” In the covenants typical of the covenant of grace, the parties represented were the seed of the representatives they were made with, as was cleared before: and in the first Adam’s covenant, his natural seed were the represented.

Wherefore, in the second Adam’s covenant, his spiritual seed are the represented. Now, Christ’s spiritual seed are the elect, and none other; for they are those whom he begets with the word of truth, Jam. i. 18. and are born again (1 Pet. i.23.) unto him in their regeneration; whom therefore lie sees as his seed, with his own image on them, Isa. liii. 10. They are the travail of his soul, who, sooner or later, are, all of them, justified, ver. 11. They are the seed that shall serve him, Psalm xxii. 30; which shall be established and endure for ever, namely, in a state of happiness, Psalm Ixxxix. 4, 29, 30.</p></blockquote>

</figure><figure class="quote" id="q-91b2e85290" data-kw="">
<blockquote><p>If you would be silent under your greatest afflictions, your sharpest trials, then make this consideration your daily companion, viz., That all the afflictions that come upon you, come upon you by and through that covenant of grace that God hath made with you. In the covenant of grace, God hath engaged himself to keep you from the evils, snares, and temptations of the world; in the covenant of grace, God hath engaged himself to purge away your sins, to brighten and increase your graces, to crucify your hearts to the world, and to prepare you and preserve you to his heavenly kingdom; and by afflictions he effects all this, and that according to his covenant too: Ps. lxxxix. 30-34, ‘If his children forsake my law, and walk not in my commandments; if they break my statutes, and keep not my commandments.’ In these words you have a supposition that the saints may both fall into sins of commission and sins of omission; in the following words you have God’s gracious promise: ‘Then will I visit their transgressions with the rod, and their iniquities with stripes.’

God engages himself by promise and covenant, not only to chide and check, but also to correct his people for their sins: ‘Nevertheless, my loving-kindness will I not utterly take from him, nor suffer my faithfulness to fail.’ Afflictions are fruits of God’s faithfulness, to which the covenant binds him. God would be unfaithful, if first or last, more or less, he did not afflict his people. Afflictions are part of that gracious covenant which God hath made with his people; afflictions are mercies, yea, covenant mercies, Ps. cxix. 75. Hence it is that God is called the terrible God, keeping covenant and mercy, Neh. i. 5; because, by his covenant of mercy, he is bound to afflict and chastise his people.

God by covenant is bound to preserve his people, and not to suffer them to perish; and happy are they that are preserved, whether in salt and vinegar, or in wine and sugar. All the afflictions that come upon a wicked man come upon him by virtue of a covenant of works, and so are cursed unto him; but all the afflictions that come upon a gracious man, they come upon him by virtue of a covenant of grace, and so they are blessed unto him; and therefore he hath eminent cause to hold his peace, to lay his hand upon his mouth.</p></blockquote>

God engages himself by promise and covenant, not only to chide and check, but also to correct his people for their sins: ‘Nevertheless, my loving-kindness will I not utterly take from him, nor suffer my faithfulness to fail.’ Afflictions are fruits of God’s faithfulness, to which the covenant binds him. God would be unfaithful, if first or last, more or less, he did not afflict his people. Afflictions are part of that gracious covenant which God hath made with his people; afflictions are mercies, yea, covenant mercies, Ps. cxix. 75. Hence it is that God is called the terrible God, keeping covenant and mercy, Neh. i. 5; because, by his covenant of mercy, he is bound to afflict and chastise his people.

God by covenant is bound to preserve his people, and not to suffer them to perish; and happy are they that are preserved, whether in salt and vinegar, or in wine and sugar. All the afflictions that come upon a wicked man come upon him by virtue of a covenant of works, and so are cursed unto him; but all the afflictions that come upon a gracious man, they come upon him by virtue of a covenant of grace, and so they are blessed unto him; and therefore he hath eminent cause to hold his peace, to lay his hand upon his mouth.”

+75.+Hence+it+is+that+God+is+called+the+terrible+God%2C+keeping+covenant+and+mercy%2C+Neh.+i.+5%3B+because%2C+by+his+covenant+of+mercy%2C+he+is+bound+to+afflict+and+chastise+his+people.%0A%0AGod+by+covenant+is+bound+to+preserve+his+people%2C+and+not+to+suffer+them+to+perish%3B+and+happy+are+they+that+are+preserved%2C+whether+in+salt+and+vinegar%2C+or+in+wine+and+sugar.+All+the+afflictions+that+come+upon+a+wicked+man+come+upon+him+by+virtue+of+a+covenant+of+works%2C+and+so+are+cursed+unto+him%3B+but+all+the+afflictions+that+come+upon+a+gracious+man%2C+they+come+upon+him+by+virtue+of+a+covenant+of+grace%2C+and+so+they+are+blessed+unto+him%3B+and+therefore+he+hath+eminent+cause+to+hold+his+peace%2C+to+lay+his+hand+upon+his+mouth.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brooks%2C+The+Mute+Christian+under+the+Smarting+Rod%2C+%281684%29+in+The+Works+of+Thomas+Brooks%2C+ed.+Alexander+B.+Grosart+%286+vols%2C+Edinburgh%3A+Banner+of+Truth%2C+1980%29%2C+i%2C+395.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F91b2e85290.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91b2e85290.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/29/thomas-brooks-on-affliction-and-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

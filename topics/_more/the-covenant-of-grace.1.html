<figure class="quote" id="q-11cbdaa0f1" data-kw="">
<blockquote><p>Because of his faithfulness in the covenant of grace. The clearest and surest view of our salvation, is to be had in this covenant. Therein we see, 1. The elect are given by the Father to the Son, to be redeemed by him, and that he may give them eternal life; as John xvii. 2. thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him. This charge the Son accepted from eternity, and, in the fulness of time, came into the world to fulfil, John vi. 38, 39. They were given to him, on condition of his coming, and redeeming of them by his blood; which condition he fulfilled.

2. They are promised to him as his purchase by the Father, When the Son hath bought them as he promised: Isaiah liii. 10, 11. When thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the Lord shall prosper in his hand. He shall see of the travail of his soul, and shall be satisfied,&amp;c.

3. The bringing, them safe to glory, is charged the Son, and promised by him again to the Father: John vi. 38, 39. For I came down from heaven, not to do mine own will, but the will of him that sent me. And this is the Father’s will which hath sent me, that of all which he hath given me, I should lose nothing, but should raise it up again at the last day. John xii. 50. And I know that his commandment is life everlasting. Christ stands engaged by this covenant, to give a good account of all his charge; and he will do it fully one day, when he presents his people to his Father; and will say of all, as Heb. ii. 13. Behold, I and the children which God hath given me; and as he said of a few of them in this chapter, ver. 12. While I was with them in the world, I kept them in thy name; those that thou gavest me, I have kept, and none of them is lost.And surely Christ is as good at keeping of his people when he is in heaven, as when he was on earth: for he is with them always, even unto the end of the world, Amen, Matth. xxviii. 20.

4. Christ yet further promiseth eternal life to his people: 1 John ii. 25. And this is the promise that he hath promised us, even eternal life: as it is the grand comprehensive promise. Yea, Christ himself is called eternal life, 1 John i. 2. and ver. 20. When Christ came into the world, eternal life came into it: when Christ is shown and revealed, eternal life is made known; when Christ is embraced by faith, eternal life is got: 1 John v. 11, 12. And this is the record, that God hath given to us eternal life: and this life is in his Son. He that hath the Son, hath life.O that all men did but know, how closely, how inseparably, and how eternally, Christ and eternal life are linked together No eternal life without Christ; no Christ without eternal life.

He also promiseth it, as well as contains it: John x. 27, 28. My sheep hear my voice, and I knew them, and they follow me. And I give unto them eternal life, and they shall never perish, neither shall any man pluck them out of my hand. It is this, and such like promises of eternal life, made by Jesus Christ, that every true believer builds his hope of heaven upon. And thus Christ’s faithfulness and truth is concerned in bringing all his people to glory.</p></blockquote>

<blockquote><p>But seeing the Law cannot contradict the Gospel, and speaketh nothing of a Surety and Mediator, and so is negatively diverse from the Gospel, yet positively it is not contrary, nor denyeth that there ought to be a Mediator (for so should there be two contrary wills in God, and so it had been injustice, and against a just law, that God should send his Son to die for sinners.)

It is the same very obedience commanded in the Law, as a strict covenant of works, to be done by strength from our own nature, and for the authority of the Law-giver, and the love of God, and now enjoined in a mild covenant of grace, from the strength of the grace of Christ, and now not only acteth on us by Legal motives, the love of God, the authority of the Law-giver, (which the Gospel excludeth not) but upon the love of a free Redeemer and Ransom-payer: as it may be the same debt, which a man payeth of his own proper goods, and of the money borrowed from a rich friend.

1 Perfect obedience, which the Law requireth, and imperfect obedience which the Gospel accepteth (for it requireth perfection as well as the Law doth) are but gradually differences; as the same sum of gold, though clipped, if accepted by the creditor as full payment, the rest which is wanting being pardoned, may in grace and value, bee as good as the full payment. It is the Law that commandeth the love of God, under pain of eternal death, for the least fail, and by way of a covenant of works. Now the tenure of a covenant of works is an accident of the Law.

2 A new obligation of obedience varieth not the nature of it; as it is the same moral obedience that God commanded to the heathen, and the Jews, but that it was written and preached to Jews, addeth more guiltiness, when they disobey, and these same duties that Moses commanded of righteousness, holiness, and sobriety, Exod. 20. doth the grace of the Gospel enjoin. Tit. 3.11. and the Apostles command as acts of sanctification; and though Moses should not command them by the motives of the grace of Redemption (which yet is false, except when he presseth the Law as a covenant of works) yet Gospel-motives vary not the nature of duties: as a Master may command the same duties to his son and his servant, upon different grounds.

3 The Gospel abateth nothing of the height of perfection, in commanding what ever the law commandeth in the same perfection; for tis as holy, pure, and spiritual in commanding, we be perfect as our heavenly Father, and holy, as he is holy, as the Law is. In acceptation of grace, the Gospel accepteth less then the law, but commandeth no less, therefore the Gospel granteth pardons, but no dispensations; the Law though it deny not pardons, nor forbid them positively, yet it granteth neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.7, pp 7-8.</span></figcaption>

<blockquote><p>We honour God more than if we had the obedience that Adam had at first before the fall. For now in the covenant of grace, he will be glorified in his mercy, in his forgiving, forbearing, rich, transcendent mercy, and in going beyond all our unworthiness and sins, by showing that there is a righteousness provided for us, the righteousness of the God-man; whose obedience and satisfaction is more than our disobedience, because it is the disobedience of man only, but his obedience and righteousness is the obedience of God-man. So it satisfieth divine justice, and therefore ought to satisfy conscience to the full. Our faith must answer Christ’s carriage to us. We must therefore account ourselves in him ‘undefiled’, because he accounts us so. Not in ourselves, but as we have a being in him, we are undefiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), p. 149.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“We honour God more than if we had the obedience that Adam had at first before the fall. For now in the covenant of grace, he will be glorified in his mercy, in his forgiving, forbearing, rich, transcendent mercy, and in going beyond all our unworthiness and sins, by showing that there is a righteousness provided for us, the righteousness of the God-man; whose obedience and satisfaction is more than our disobedience, because it is the disobedience of man only, but his obedience and righteousness is the obedience of God-man. So it satisfieth divine justice, and therefore ought to satisfy conscience to the full. Our faith must answer Christ’s carriage to us. We must therefore account ourselves in him ‘undefiled’, because he accounts us so. Not in ourselves, but as we have a being in him, we are undefiled.”

</figure><figure class="quote" id="q-3131fb392c" data-kw="">
<blockquote><p>That man indeed saw little of the truth and glory of the everlasting covenant who said that “the work and death of Jesus would have been very glorious though no individual of the human race had ever come and reposed living faith in the surety.” How dishonouring to the work of Jesus! How dishonouring to the righteousness of God! To what straits are men reduced when at all hazards they will have it that the death of Jesus was accomplished alike for the saved and the lost!

For if he died for the lost, and yet his death did not secure them from being lost, it must be something else than his death that secured the saved unto salvation. So that if Jesus died for all alike, it is not his death that secures the salvation of any; it only secures, it seems, the possibility of salvation to all! That is the whole fruit of it—and it is this which has tempted to the terrible and blasphemous assertion that “his death would have been a glorious work though none had been saved by it at all.”

That is to say—though he had never earned the name of Jesus, who saves his people from their sins! We have not so learned the covenant or gospel of our salvation. And very clearly our blessed Lord did not so understand the case in which he himself has so glorious an interest. “If ye seek me, let these go their way, that the saying might be fulfilled, Of those whom thou hast given me I have lost none.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Calvary: Gethsemane – The Arrest – The Trial</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 158-59.</span></figcaption>

</figure><figure class="quote" id="q-a05421d65e" data-kw="">
<blockquote><p>It should be taken as a rule in explaining the psalms, that they exhibit the covenant of grace dispensed by the Lord Jesus Christ, the King and Head of the church. He is the subject-matter of the whole of divine revelation; but in a special manner of the psalms. This appears from his own declaration, just before his ascension: Luke 24:44, “All things must be fulfilled which were written in the law of Moses, and in the prophets and in the psalms concerning me.” They are called “the word of Christ,” Col. 3:16. And in order that it may dwell in us richly in all wisdom in singing these sacred songs, we must see Christ in them. This is to be brought out in their exposition.

In Psalm 22:22, we have further confirmation of this point: “In the midst of the congregation will I praise thee.” Jesus Christ is in the midst of his people when singing his praise and participates in the service. He presides over the devotions of the sanctuary. In Heb. 2:12 these words of the psalm are ascribed to him, and they are adduced to show the oneness between him and his people. “Both he that sanctifieth and they that are sanctified are all of one,” verse 11.

Can it be a theme less important than the salvation which he has secured to his people, in which he takes so deep an interest? The numerous quotations from the Psalms and references to them in the New Testament, clearly shows that the Psalms were designed and suited to celebrate the kingdom and glory of the Mediator. Of the former there are about seventy, and of the latter, thirty. In all these the application is more or less directly to Christ. And these are not exhaustive. They are merely specimens of what the Psalms are throughout. Christ is in the Psalms, or rather the Psalms are full of Christ, and it is the business of the expounder to bring forth these good things out of this abundant storehouse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-sproull.html">Thomas Sproull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Psalms in Reformed Presbyterian and Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-9b0305aaf0" data-kw="">
<blockquote><p>The first Direction and Institution of a Church was by Covenant; the Israelites made a Covenant with the LORD, and He with them, Deut. v. 2. and from that Time they were called a Church, Acts; vii. 38, there they promised, they would do all the LORD had said, and be obedient, Exod., xxiv. 3, 7.

There was another Covenant made with them, Deut. xxix. 12, &amp;c. this was a Covenant of Grace, as the other was of Works, ver. 10, 11, 12. The LORD entered into Covenant with them that Day, and with their Children: By a Covenant He takes them to be his People, and to be their God.</p></blockquote>

</figure><figure class="quote" id="q-9c2b54c1ae" data-kw="">
<blockquote><p>Were all the promises of the covenant, made to Christ; and are they all “in him, yea, and Amen?” Then it follows, that they, in and with him, are freely offered to sinners of mankind in common, who hear the gospel. Reader, Christ and all the precious promises in him, are by Jehovah graciously offered, and in the offer, are directed to thee for thy acceptance. The authentic offer, brings them all within thy reach, and affords thee a Divine, an authoritative warrant, to come as a sinner, and to accept him, and them in him.

Come then, come as thou art; come without delay; come without looking into thy heart, or to thy life, for any good thing to recommend thee; and, upon the warrant of the free, full, and particular offer, so embrace the promises in Christ, as cordially to trust in him, for the performance of them to thy soul. Come, not on the ground of any good disposition wrought in thee, or of any good work done by thee, for these afford thee no right, but, come as a sinner, upon the warrant of the unlimited grant and call of the gospel, and trust in the Lord Jesus, for all the grace of the promise.

After thou hast begun, continue to trust in him. The believer’s turning away his eye from Christ and the covenant, is the cause, why he begins to sink under his pressures. His departing from Christ his living Redeemer, by “an evil heart of unbelief,” issues for ordinary, in his being torn asunder with a thousand anxieties. O beware of disbelieving the promise, of distrusting the grace, of a promising God; lest he measure to thee according to thy opinion of him. Since the spotless righteousness of Jesus Christ, is likewise offered to thee, and since the offer affords thee, an immediate warrant to receive it; O rely on it, for a right to the blessings promised.

Trust with assured confidence, that the promises will he fulfilled to thee, on the ground of that righteousness only, which is thine in offer; and not, on the ground of any works, which thou thyself hast done. Rely not even on thy acts of faith, for a title to the grace of the promise, but wholly on the righteousness, “revealed from faith to faith so shalt thou be an heir of promise, and shalt Christ “reign in life” eternal, “by one, Jesus.</p></blockquote>

After thou hast begun, continue to trust in him. The believer’s turning away his eye from Christ and the covenant, is the cause, why he begins to sink under his pressures. His departing from Christ his living Redeemer, by “an evil heart of unbelief,” issues for ordinary, in his being torn asunder with a thousand anxieties. O beware of disbelieving the promise, of distrusting the grace, of a promising God; lest he measure to thee according to thy opinion of him. Since the spotless righteousness of Jesus Christ, is likewise offered to thee, and since the offer affords thee, an immediate warrant to receive it; O rely on it, for a right to the blessings promised.

— John Colquhoun, A Treatise of the Covenant of Grace, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 277-78.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWere+all+the+promises+of+the+covenant%2C+made+to+Christ%3B+and+are+they+all+%E2%80%9Cin+him%2C+yea%2C+and+Amen%3F%E2%80%9D+Then+it+follows%2C+that+they%2C+in+and+with+him%2C+are+freely+offered+to+sinners+of+mankind+in+common%2C+who+hear+the+gospel.+Reader%2C+Christ+and+all+the+precious+promises+in+him%2C+are+by+Jehovah+graciously+offered%2C+and+in+the+offer%2C+are+directed+to+thee+for+thy+acceptance.+The+authentic+offer%2C+brings+them+all+within+thy+reach%2C+and+affords+thee+a+Divine%2C+an+authoritative+warrant%2C+to+come+as+a+sinner%2C+and+to+accept+him%2C+and+them+in+him.%0A%0ACome+then%2C+come+as+thou+art%3B+come+without+delay%3B+come+without+looking+into+thy+heart%2C+or+to+thy+life%2C+for+any+good+thing+to+recommend+thee%3B+and%2C+upon+the+warrant+of+the+free%2C+full%2C+and+particular+offer%2C+so+embrace+the+promises+in+Christ%2C+as+cordially+to+trust+in+him%2C+for+the+performance+of+them+to+thy+soul.+Come%2C+not+on+the+ground+of+any+good+disposition+wrought+in+thee%2C+or+of+any+good+work+done+by+thee%2C+for+these+afford+thee+no+right%2C+but%2C+come+as+a+sinner%2C+upon+the+warrant+of+the+unlimited+grant+and+call+of+the+gospel%2C+and+trust+in+the+Lord+Jesus%2C+for+all+the+grace+of+the+promise.%0A%0AAfter+thou+hast+begun%2C+continue+to+trust+in+him.+The+believer%E2%80%99s+turning+away+his+eye+from+Christ+and+the+covenant%2C+is+the+cause%2C+why+he+begins+to+sink+under+his+pressures.+His+departing+from+Christ+his+living+Redeemer%2C+by+%E2%80%9Can+evil+heart+of+unbelief%2C%E2%80%9D+issues+for+ordinary%2C+in+his+being+torn+asunder+with+a+thousand+anxieties.+O+beware+of+disbelieving+the+promise%2C+of+distrusting+the+grace%2C+of+a+promising+God%3B+lest+he+measure+to+thee+according+to+thy+opinion+of+him.+Since+the+spotless+righteousness+of+Jesus+Christ%2C+is+likewise+offered+to+thee% <blockquote><p>All they which are the sons of the promise are the seed of Abraham or the sons of God: but Isaac is a son of promise and not Ismael: therefore Isaac is the seed of Abraham and heir of the blessing, and not Ismael. The proposition is in the 8. Verse [of Romans 9], the assumption in the 9. vers. the conclusion in the 7. verse. Here mark, I. how he makes a double seed, one according to the flesh, the other spiritual: and two kind of sons, one of the flesh, the other son of the promise or the son of God: for he puts the one for the other. II. that the distinction between Isaac and Ismael, whereby one is in the covenant of grace, the other not; stands not in their foreseen saith and unbelief, and the fruits of them: but in the purpose and will of God itself.

For Isaac is called the child of promise, because by the virtue of it he was born, and believed, and was adopted the child of God, and made heir of the covenant given to Abraham: and therefore consequently the right of adoption befell him by the mere good pleasure of God, which is the first cause of our salvation, without respect of any thing in the person of Isaac. For what God by his promise brings to pass in time, that he most freely decreed before all times.

Now considering the Jews might say that Ismael was rejected, because he was borne of the hand-maid Hagar, whereas they, for their parts descend of Abraham and Sarai; by Isaac the lawful son, Paul adds a third example of the distinction between man and man out of the family of Isaac, in which Jacob was a true son and heir of the promise, and Esau was not. Now the distinction of these two persons is propounded in the 10. vers. and confirmed verse 11, 12, 13. in which are set down three things: I. the time of this distinction, yer the children were borne, and therefore when they had neither done good nor evil. And this circumstance is noted, to show, that God was not moved by any persuasion or preconsideration of Jacob’s godliness and Esau’s profaneness to prefer the one before the other.

II. the end why the distinction was made at this time and not afterward when they were born is, that the purpose of God which is according to his election might remain sure, not of works but by him that calleth: that is, that by this means it might appear, that when God receives any man into the covenant of eternal life, it proceeds not of any dignity in the man whom God calleth, but from his mercy and alone good pleasure, that his decree of saving the elect might remain firm and sure forever.

Hence it is manifest that there is an unchangeable decree of election of some men (for he that takes all and accepts none can not be said to choose) to salvation, depending upon the alone will of God; and therefore necessarily by the law of contraries, there is an opposite decree of reprobation: for in that God ordaineth some to eternal salvation, he testifies thereby, that his purpose is to pass by some without shewing of mercy.</p></blockquote>

<blockquote><p>The covenant of grace, then, was made with Jesus Christ, as the second Adam, party-contractor: Psalm lxxxix. 3, “I have made a covenant with my chosen.” Compared with 1 Cor. xv. 45, “The last Adam was made a quickening spirit.” Gal. iii. 16, “Now to Abraham and his seed were the promises made. He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ.” Rom. v. 15, to the end.

And Christ in this covenant represented all the elect, as his spiritual seed, the parties contracted for: Gal. iii. 16, forecited. Isa. liii. 10, 11, “Yet it pleased the Lord to bruise him, he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the Lord shall prosper in his hand. He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities.”

Then the covenant of redemption, and the covenant of grace, are not two distinct covenants, but two names of one covenant, under different considerations. That appears, in that the number of the covenants in Scripture is but two, whereof the covenant of works is one: Gal. iv. 24, “For these are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” By a covenant of redemption is meant a bargain of buying and selling; and the second covenant was such a covenant to Christ only: 1 Pet. i. 18, 19, “Forasmuch as ye know that ye were not redeemed with corruptible things, as silver and gold, from your vain conversation received by tradition from your fathers; but with the precious blood of Christ, as of a Lamb without blemish and without spot.”

By a covenant of grace is meant a bargain, whereby all is to be had freely; and it is such a covenant to poor sinners only: Is. lv. 1, “Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy and eat, yea, come, buy wine and milk without money, and without price.” The covenant of grace was made from eternity; Tit. i. 2, “In hope of eternal life, which Clod that cannot lie, promised before the world began.” Yet is it the second covenant, in respect of order and manifestation to the world, though it was first in being.</p></blockquote>

<blockquote><p>Argument I. The first argument [against universal redemption] may be taken from the nature of the covenant of grace, which was established, ratified, and confirmed in and by the death of Christ; that was the testament whereof he was the testator, which was ratified in his death, and whence his blood is called “The blood of the new testament,” Matt. xxvi. 28. Neither can any effects thereof be extended beyond the compass of this covenant. But now this covenant was not made universally with all, but particularly only with some, and therefore those alone were intended in the benefits of the death of Christ.

The assumption appears from the nature of the covenant itself, described clearly, Jer. xxxi. 31, 32, “I will make a new covenant with the house of Israel, and with the house of Judah: not according to the covenant that I made with their fathers in the day that I took them by the hand to bring them out of the land of Egypt; which my covenant they brake, though I was an husband to them, saith the Lord;” — and Heb. viii. 9–11, “Not according to the covenant that I made with their fathers in the day when I took them by the hand to lead them out of the land of Egypt; because they continued not in my covenant, and I regarded them not, saith the Lord. For this is the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws in their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people: and they shall not teach every man his neighbour, and every man his brother, saying, Know the Lord: for all shall know me, from the least to the greatest.”

Wherein, first, the condition of the covenant is not said to be required, but it is absolutely promised: “I will put my fear in their hearts.” And this is the main difference between the old covenant of works and the new one of grace, that in that the Lord did only require the fulfilling of the condition prescribed, but in this be promiseth to effect it in them himself with whom the covenant is made. And without this spiritual efficacy, the truth is, the new covenant would be as weak and unprofitable, for the end of a covenant (the bringing, of us and binding of us to God), as the old. For in what consisted the weakness and unprofitableness of the old covenant, for which God in his mercy abolished it? Was it not in this, because, by reason of sin, we were no way able to fulfil the condition thereof, “Do this, and live?” Otherwise the connection is still true, that “he that doeth these things shall live.”

And are we of ourselves any way more able to fulfil the condition of the new covenant? Is it not as easy for a man by his own strength to fulfil the whole law, as to repent and savingly believe the promise of the gospel? This, then, is one main difference of these two covenants, — that the Lord did in the old only require the condition; now, in the new, he will also effect it in all the federates, to whom this covenant is extended. And if the Lord should only exact the obedience required in the covenant of us, and not work and effect it also in us, the new covenant would be a show to increase our misery, and not a serious imparting and communicating of grace and mercy. If, then, this be the nature of the new testament, — as appears from the very words of it, and might abundantly be proved, — that the condition of the covenant should certainly, by free grace, be wrought and accomplished in all that are taken into covenant, then no more are in this covenant than in whom those conditions of it are effected.

But thus, as is apparent, it is not with all; for “all men have not faith,” — it is “of the elect of God:” therefore, it is not made with all, nor is the compass thereof to be extended beyond the remnant that are according to election. Yea, every blessing of the new covenant being certainly common, and to be communicated to all the covenantees, either faith is none of them, or all must have it, if the covenant itself be general. But some may say that it is true God promiseth to write his law in our hearts, and put his fear in our inward parts; but it is upon condition. Give me that condition, and I will yield the cause. Is it if they do believe? Nothing else can be imagined. That is, if they have the law written in their hearts (as every one that believes hath), then God promiseth to write his law in their hearts! Is this probable, friends? is it likely?

I cannot, then, be persuaded that God hath made a covenant of grace with all, especially those who never heard a word of covenant, grace, or condition of it, much less received grace for the fulfilling of the condition; without which the whole would be altogether unprofitable and useless. The covenant is made with Adam, and he is acquainted with it, Gen. iii. 15, — renewed with Noah, and not hidden from him, — again established with Abraham, accompanied with a full and rich declaration of the chief promises of it, Gen. xii.; which is most certain not to be effected towards all, as afterwards will appear. Yea, that first distinction, between the seed of the woman and the seed of the serpent is enough to overthrow the pretended universality of the covenant of grace; for who dares affirm that God entered into a covenant of grace with the seed of the serpent?

Most apparent, then, it is that the new covenant of grace, and the promises thereof, are all of them of distinguishing mercy, restrained to the people whom God did foreknow; and so not extended universally to all. Now, the blood of Jesus Christ being the blood of this covenant, and his oblation intended only for the procurement of the good things intended and promised thereby, — for he was the surety thereof, Heb. vii. 22, and of that only, — it cannot be conceived to have respect unto all, or any but only those that are intended in this covenant.</p></blockquote>

firm+that+God+entered+into+a+covenant+of+grace+with+the+seed+of+the+serpent%3F%0A%0AMost+apparent%2C+then%2C+it+is+that+the+new+covenant+of+grace%2C+and+the+promises+thereof%2C+are+all+of+them+of+distinguishing+mercy%2C+restrained+to+the+people+whom+God+did+foreknow%3B+and+so+not+extended+universally+to+all.+Now%2C+the+blood+of+Jesus+Christ+being+the+blood+of+this+covenant%2C+and+his+oblation+intended+only+for+the+procurement+of+the+good+things+intended+and+promised+thereby%2C+%E2%80%94+for+he+was+the+surety+thereof%2C+Heb.+vii.+22%2C+and+of+that+only%2C+%E2%80%94+it+cannot+be+conceived+to+have+respect+unto+all%2C+or+any+but+only+those+that+are+intended+in+this+covenant.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Salus+Electorum%2C+Sanguis+Jesu%3A+or%2C+The+Death+of+Death+in+the+Death+of+Christ%2C+%281647%29%2C+Book+3.1+in+William+H.+Goold+%28ed.%29%2C+The+Works+of+John+Owen+%2816+vols%2C+Edinburgh%3A+Banner+of+Truth%2C+1967%29%2C+10%3A+236-38.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc0bb45a8c3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0bb45a8c3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/03/john-owen-on-the-new-covenant-of-grace-and-limited-atonement/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-60381d9307" data-kw="">
<blockquote><p>Congregation, recognize the truth expounded here in its essence and commended for the profit of your souls. This truth that was sealed by Jesus’ suffering and death can free us from the evil of sin through the power of the Spirit. Oh, that your hearts would desire to see, to use prudently, and to profit from that which concerns your eternal salvation. These few pages are a treasure that contains everything that is able to satisfy you eternally. Learn here to know the God of gods and how through worship to be affected by the Holy Word; here learn how truly to pray to the Triune God—Father, Son, and Holy Spirit—exalting His being, honouring His name, recognizing His glories.

Wisely and holily, He accomplishes what He eternally decrees concerning creation and providence. He displays His service and gives His laws to reasonable creatures that they might know what leads them to true virtue. Behold here the first man, glorious in covenant with God, then sadly falling into sin and guilt and slavery to Satan. Behold how he was plunged into death, swept into the abyss by a thousand evils. Note God’s Son, moved to compassion, fulfilling God’s righteousness, displaying pity in the covenant of peace, our Mediator.

Note His sweet-sounding names, His natures, His offices, and how He brought redemption for our endangered souls. Observe that God’s Son in both His low and His exalted estates obtained God’s sweet honeycombs, medicine for our souls. He called His child, gave her new life, faith, salvation, righteousness, and holiness. And by godly living, praying, and watching, she is made a participant in full assurance by Him when He uses baptism and the Lord’s Supper as seals for heart and mouth. He shows His love and strengthens His partner in their holy covenant.

Behold mankind, which shall surely die and be raised again to receive its judgment on the last day. Then the ungodly will receive eternal woe, but God’s people, chosen for salvation, will be jubilant. Oh! What a holy outcome for Jesus’ followers, gathered here on earth and guided by heaven’s Word and Spirit. They will taste this salvation for all eternity, and after their struggle they will come to the eternal, blessed, joyful feast. Oh, come and see, savour the truth—so blessed in its radiance and clarity for those who see it with the Spirit’s help. Beg for light, that you may find life in the treasury of exalted truth, the rock on which God’s people build.</p></blockquote>

</figure><figure class="quote" id="q-af856017e5" data-kw="">
<blockquote><p>Hath Jesus Christ our Mediator confirmed the Covenant by his death! Then O Christian, keep up thy faith, and draw out thy faith, and exceedingly rejoice in Christ; for thy estate is sure, and thy soul is sure, and thy salvation is sure, all is sure, because all is surely confirmed by the death of Christ:

The death of Christ was a ratification to the whole Testament, to the whole covenant, and to every part and tittle of it: and as sure as Christ hath died, so sure art thou to enjoy all that God hath Covenanted with thee for there shall not fail one word of all the good he which [sic] hath promised.

Object Not one word? Not one good thing?

Sol. No, not any one; why then Mercy shall be thine, and Grace shall be thine, and Peace shall be thine, and Joy shall be thine, and Glory, and Salvation shall be thine, for all these, and more than these are promises by God in his Covenant, and are sealed by his death.</p></blockquote>

</figure><figure class="quote" id="q-22475fe67c" data-kw="">
<blockquote><p>The first covenant having been broken by the fall of man, the justice of God could have inflicted punishment; but we have beheld him pitying the human race, and giving his Son to satisfy justice by his death, and thereby entering into a new covenant with mankind; concerning this covenant we must now speak a little more particularly. …

God having thus entered into covenant with our Surety Christ Jesus, was pleased also to enter into covenant with us in him. Now this covenant we define to be, a free and gratuitous agreement between an offended God and offending man, in which God promises to man pardon and salvation through the merits and satisfaction of Christ, and man on his part promises faith and obedience. The only author of this covenant is God, who alone could raise fallen man, and make a new covenant in the place of the old. God is here considered as offended, but at the same time as a merciful Father, capable of being propitiated, and willing to be reconciled to offending man.

Man, with whom the covenant is entered into, is considered as a sinful creature, but conscious of his guilt and misery. The Mediator of the covenant is Christ. In this covenant God promises that he will be our God, which promise includes both our reconciliation and communion with him, and also the communication of those good things which are necessary for us, particularly holiness, life, and immortality. Again, God requires from us that we should be his people, namely, he requires of us faith, repentance, worship, and obedience, all which he produces in us by his Spirit.

The seals of this covenant are the sacraments. It is called the new covenant, because the old is abolished, and the covenant of grace, because man in no way whatever could merit it, but God of his mere mercy entered into it with man; and also to distinguish it from the first covenant, which is called the covenant of works. which was entered into with Adam, and renewed on Mount Sinai.</p></blockquote>

+way+whatever+could+merit+it%2C+but+God+of+his+mere+mercy+entered+into+it+with+man%3B+and+also+to+distinguish+it+from+the+first+covenant%2C+which+is+called+the+covenant+of+works.+which+was+entered+into+with+Adam%2C+and+renewed+on+Mount+Sinai.%E2%80%9D%0A%0A%E2%80%94+Benedict+Pictet%2C+Christian+Theology%2C+trans.+Frederick+Reyroux+%281696%3B+London%2C+1834%29%2C+6.17%2C+pp+324%2C+325-26.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F22475fe67c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/22475fe67c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/12/benedict-pictet-on-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-32164d7e39" data-kw="">
<blockquote><p>The infinitely glorious plan of man’s redemption, projected from everlasting, in the secret counsel of the adorable Trinity, is a manifold mystery; a mystery, the complicated plies of which, we are infinitely far from being able, fully to unfold. In the view of Jehovah, however, if I may so say, it is all one piece: for, to Him who inhabiteth eternity, all things appear together and at once: one object is not before, nor another after, as with us, who are only creatures, and creatures of time. Now it was, according to that stupendous plan of redeeming love, that the covenant of grace, was entered into, between the contracting Parties.

According to our finite manner of conceiving spiritual objects, we have to think of that covenant, as made of old, in a period which is long since elapsed; which has passed away, long, infinitely long, before the world began. But to the eternal, the glorious, Parties themselves, the making of it is ever new, and ever-present. Nothing to them can be either past or future.

The fulfilling of the conditions of that eternal covenant, was to man, when it was at first revealed to him, a matter of futurity, and that for so long as four thousand years; but to Jehovah who inhabiteth eternity, it was always present: so that, in saving sinners, under the Patriarchal and Jewish economy, he proceeded upon them, as conditions, in a manner, already fulfilled: and though it was a matter of futurity likewise, to Christ as man, previous to his finishing of his work, on the cross and in the grave; yet to him as God, it was neither past, nor future, but was ever-present. Accordingly, speaking of himself as God-man, he said to the Jews, “Before Abraham was, (not, I was, but) — I AM.” All that is past to us, as well as all that is future, is necessarily, and invariably present to him.

But although that wonderful covenant was, in the eternal and mysterious counsel of the ever-blessed Trinity, and by one eternal act of the Divine will, made all at once; yet since we, because of the narrowness and darkness of our understanding, cannot form any apprehensions of it, but as it were in parcels; we are allowed, to conceive a certain order in the making of it, and to consider, first, one part, and then, another.</p></blockquote>

</figure><figure class="quote" id="q-8b4f7d6ada" data-kw="">
<blockquote><p>As for the desire of the Repentance and life of Reprobates which you attribute unto God, you keep your course I confess in strange expressions, manifestly contradictious to the nature of God, and to your self.

Can you persuade your self that ever the world will be brought about to believe, or any intelligent or sober man amongst them, that God desires the repentance and life of them, whom he hath determined from everlasting to deprive of those helps without which no man can repent and bee saved? yet that he doth deprive them hereof, it is your own most express profession in the former Section.

As for hardening them; doth he not harden whom he will? and hath he not from everlasting ordained all Reprobates unto destruction? As for any desire hereof in God, I account it a very absurd thing, to treat of any will in God under the notion of desire in proper speech; Speak we of the desires of weak men, who cannot effect what they will; but be advised to spare to attribute any desires to God in proper speech, as you would spare to attribute to him, eyes and ears, and hands, and heart, in proper speech, and though God bee pleased in condescension to our capacities to take upon him our infirmities, let us not recompense his goodness so ill, as to conceive of his nature as obnoxious to the same imperfections whereto our natures are</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 233.</span></figcaption>

</figure><figure class="quote" id="q-bb081b1995" data-kw="">
<blockquote><p>Whilst the unutterable misery, into which all the children of Adam, by transgression, fell, was the occasion of God’s making another covenant, for the redemption of elect sinners; his own sovereign, distinguishing grace, was the cause or source of it. Hence it is usually styled THE COVENANT OR GRACE. It originated from the boundless grace, or sovereign good pleasure of God; and everything settled in it, is, and ever will be, “to the praise of the glory of his grace.”

In and by this covenant, God hath manifested, the unfathomable depths of his manifold wisdom, the unsearchable riches of his glorious grace, and the transcendent greatness of his astonishing love, far more clearly, than if man himself had performed the condition, and had been adjudged to eternal life, according to the tenor of the covenant of works.

The eternal Father, in the amazing depth of his infinite wisdom, and according to the predetermination of his sovereign will, devised this method of displaying his glory, and of manifesting his mercy, that amiable attribute of the Divine nature; which could not have shone forth with such transcendent lustre, if man had not been permitted to render himself miserable.

The covenant of grace, for the redemption of sinners of mankind, was concerted and entered into, between Jehovah the eternal Father, and his co-eternal Son as the last Adam, with the approbation of the Holy Spirit, long before it began to be published and offered to them, for their consent and acceptance:—which directs us to two different views of this august contract; first, as it is established between God and the Mediator; and next, as it is exhibited in the Gospel, to sinners for their approbation and consent. In the former view, it was made from eternity; in the latter, it was manifested in time: in that view, it is a federal transaction, or covenant properly so called, between Jehovah the Father, and his only begotten Son; in this, it is a testamentary deed or disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 6-7.</span></figcaption>

heir+approbation+and+consent.+In+the+former+view%2C+it+was+made+from+eternity%3B+in+the+latter%2C+it+was+manifested+in+time%3A+in+that+view%2C+it+is+a+federal+transaction%2C+or+covenant+properly+so+called%2C+between+Jehovah+the+Father%2C+and+his+only+begotten+Son%3B+in+this%2C+it+is+a+testamentary+deed+or+disposition.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+of+the+Covenant+of+Grace%2C+%28Edinburgh%3A+Ogle%2C+Allardice+and+Thomson%2C+1818%29%2C+pp+6-7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbb081b1995.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bb081b1995.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/27/john-colquhoun-on-the-establishment-and-exhibition-of-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4c3b3892ee" data-kw="">
<blockquote><p>In regard of the essence of God, nothing can be separated from him, he being immense and filling all things: but yet in regard of his voluntary communication and dispensing of himself unto the creature, the manner of his special presence doth much vary. Unto this special union of the creature to God (in virtue whereof, the creature is quickened, and doth in some sort live the life of God), there is necessarily pre-supposed some sinew or ligament, which may be therefore called the medium and instrument of life.

This knot in the estate of man’s creation, was the obedience of the law, or the covenant of works, which, while man did maintain firm and unshaken, he had an evident communion with God in all those vital influences, which his mercy was pleased to shed down upon him: but once untying this knot, and cutting asunder that bond, there did immediately ensue a separation between God and man, and, by an infallible consequence, death likewise.

But God, being rich in mercy, and not willing to plunge his creature into eternal misery, found a new means to communicate himself unto him, by appointing a more easy covenant, which should be the second knot of our union unto him, only to believe in Christ incarnate, who had done that for us which we ourselves had formerly undone. And this new covenant is the covenant of ‘faith, by which the just do live.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 156.</span></figcaption>

rl=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c3b3892ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4c3b3892ee.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/13/edward-reynolds-on-divine-condescension-and-the-two-covenants/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-81eee0ccb1" data-kw="">
<blockquote><p>But at the same time we must observe that the covenant of grace is nothing more than the accomplishment of the eternal counsel of God. The righteousness of faith, of which the sacraments are the seals, and which is promised in the covenant, belongs exclusively to the elect.

Nor must we omit to observe what is here of no small consequence, that the promises of the covenant, including everything it embraces, are not conditional but absolute.

For in the covenant God promises to bestow even those qualifications that are to be regarded as the prerequisites of its ultimate and complete fruition (Jer. 31:32, 33; 32:39, 40). The reason is that the promises of this covenant are founded in the satisfaction and merits of Christ, who has merited for his people not only eternal life but likewise all those benefits without which that life could not be obtained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 136-37.</span></figcaption>

</figure><figure class="quote" id="q-e077c6f7f7" data-kw="">
<blockquote><p>The Lord God having entered into a covenant of life with the first Adam, for himself and all mankind in him, this covenant has been broken, whereby sin hath entered, and death by sin; and all the world being now become guilty before God, bound over to the vengeance of eternal fire, and under an utter impossibility of recovery by aught which that covenant can do, God has out of his abundant grace made a new covenant, on which whosoever shall lay hold, shall be delivered out of the state of death and wrath into a state of life and blessedness. What the law could not do, being weak through the flesh, God sent his Son in the likeness of sinful flesh to accomplish; and with him this gracious grant, that whosoever believeth in him, shall not perish, but have everlasting life. John 3:16. And this is the covenant which has been declared unto you.

This new covenant is a marriage covenant: I will betroth thee unto me for ever, yea, I will betroth thee to me in righteousness, and in loving-kindness, and in mercies. Hos. 2:20. In it the Lord makes offer, and invites you to accept of a husband and a dower: the husband is the King’s Son, the Lord Jesus Christ, and with him the lost kingdom, and all that belongs to the kingdom of God, for a dower. Liberty for the captives, the opening of the prison to them that are bound; riches to the poor, eyes to the blind, feet to the lame, healing to the diseased, and life to the dead.

And whoever among you all, who are persons under the law, held by the cords of your sins, whose souls are fast bound in fetters of iron, who are willing that your covenant with death be made void and your agreement with hell be disannulled, and will join yourselves to the Lord and be brought within the bonds of this covenant, all the blessings of this covenant are made over and stand sure unto you. The grant is made, the deed is drawn and sealed; the Lord hath set to his seal — come you in and seal the counterpart; set to it your seal, and the match is made up. Christ, and with him all things, are yours, and you are his. Accept, and live; refuse, and die forever.

Come then, sinner; what sayest thou? Dost thou consent? Dost thou accept? Or, as Laban to Rebekah, Wilt thou go with this man? Let me espouse thee to this one Husband; only let me first tell thee, the matter is solemn, and thou must be serious. It is for life, it is for eternity. Consider therefore, and let thy heart, lying prostrate before the Almighty, come in and make answer to these demands, which from him, and in his great and dreadful name, I make unto thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven Opened; or, A Brief and Plain Discovery of the Riches of God’s Covenant of Grace</cite>, (1665; New York: American Tract Society, 1838), pp 333-35.</span></figcaption>

</figure><figure class="quote" id="q-fe1fdb3209" data-kw="">
<blockquote><p>That all mankind being, by reason of sin, in a lost and helpless state, and exposed to everlasting misery, God our heavenly Father, so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life; That Christ Jesus was this Son of God, who most willingly undertook the work of our redemption, came from heaven to earth on this most benevolent errand, assumed human nature into a personal union with his own divine nature, and thus became God and man, the fit mediator between the parties to be reconciled in the great concern of man’s salvation:

That the Redeemer, having taken the sinner’s place as his substitute and surety, perfectly obeyed and honoured the law which man had disobeyed and dishonoured, satisfied divine justice completely, by enduring the full penalty of the law, in a whole life of humiliation and suffering, and especially by a death of unspeakable agony and infamy—denominated the cursed death of the cross—and which, as a principal part of his work, is, for that reason, often put for the whole: That the Redeemer, after being laid in a tomb, rose from the dead on the third day, ascended to heaven, and to the right hand of the Father, there to appear forever as the intercessor and advocate of his people:

That thence he sent down the Holy Spirit, to instruct his apostles fully in the nature of his kingdom; to enable them, without study, to speak various languages; to confer on them the power of working miracles; and to complete, without error, the canon of sacred scripture; and also, in every age, to make a saving application of the Redeemer’s work to the human heart, renewing it unto holiness, and implanting and cherishing in it all the Christian graces:

That for the sake of what Christ has done, God can now be just and the justifier of him that believeth in Jesus, even though he be the chief of sinners; and that in the preaching of the gospel, he invites and commands every sinner who hears it, to come and receive a complete salvation, through this precious and all sufficient Saviour:

That accordingly, whenever a sinner, under the influence of the blessed Spirit becomes sensible of his guilt and misery, and on the free offer of Christ and his benefits in the gospel, actually commits his soul by faith to the Saviour, as his sole reliance, he is pardoned and justified, and shall never come into condemnation — That by faith he is united to Christ and made one with him; the righteousness of Christ is imputed to him, or reckoned as his; the work of sanctification, by which he is prepared for heaven, is commenced in his soul; and .the grace of evangelical repentance, with every other grace, being there begun, shall be cherished and carried on, in a course of sincere but imperfect obedience to all the commands of God; till at death, he shall become perfect in holiness, and rise to the enjoyment of all the bliss of heaven:

That thus it shall be with all who accept the gospel offer; while ail who hear and do not accept it, shall be consigned to hopeless misery: That there shall be a resurrection of the dead, both of the just and the unjust, when the soul and body of every individual shall be reunited; and when, before the assembled universe, the Redeemer shall award to his friends eternal life, in his kingdom of glory, and to his enemies eternal punishment, with the devil and his angels.</p></blockquote>

<blockquote><p>God cannot deal with them whom you call the world of mankind, according to the Covenant of Grace: For if he should, he should save them all; as I prove thus. If whatsoever God requires by this covenant on man’s part, God undertakes to perform on his part, then it is impossible but that all must be saved with whom he means to deal according to this covenant.

But whatsoever by this covenant God requires on man’s part, God himself undertakes to perform on his part, as I prove thus. First, in general, God undertakes in this covenant, to be our Lord and our God, to sanctify us. Therefore, he undertakes to give us faith and repentance. Secondly, in special, and first, doth God require at our hands, that we should love him with all our hearts, and with all our souls? God undertakes to perform this.</p></blockquote>

</figure><figure class="quote" id="q-84ea81f324" data-kw="">
<blockquote><p>It is through Christ Jesus we are to make known our requests unto God, because he is the trustee of the covenant, and all its exceeding great and precious promises are in him yea, and in him Amen. He is the heir of all things, and in him all things are ours, whether Paul, or Apollos, or Cephas, or the world, or life, or death, or things present, or things to come; all are ours, and we are Christ’s, and Christ is God’s.

“I will be thy God” is the formula of the covenant. God has given himself to his people as their all-comprehending good as well as their all-disposing Lord. He is their sun and their shield; he will give grace and glory; no good thing will he withhold from them who walk uprightly. The warrant and measure of our prayers, therefore, is this boundless covenant with all its promises, a covenant formed in the depths of eternity, sealed with the blood of the Lamb, and confirmed by an oath. (Heb. vi. 13, etc.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Peace of God (1863) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>

</figure><figure class="quote" id="q-6a3f19b66b" data-kw="">
<blockquote><p>When God had caused his everlasting decree to fall in labour, and had delivered it by giving the world a being, and upon infinite consultation had formed man to be his viceroy over all the works of his hands, he embarked him, with all abilities needful for such a voyage, in the bottom of the covenant of works.

Adam set forth fully furnished with skill, and richly fraught with all the fortunes, hopes, and happiness of mankind; but he had scarce launched out of sight, before Satan, who knew very well the worth of the prize, envying man the haven of bliss to which he was sailing, and envying God, who was the owner, the honour of such a venture, raised a storm, whereby the vessel, through the unfaithfulness of Adam, the pilot, ran upon a rock and miscarried. Oh what a joyful spectacle was that to Satan!

What a doleful sight to Adam, to behold himself, and all his posterity, sinking into the boundless, bottomless ocean of destruction and misery, through his falseness and treachery! when, lo, on a sudden the glorious God, out of the superabundant riches of his mercy, resolving that the devil should never rob him of the honour of that manifold wisdom, unsearchable goodness, and almighty power, which had been manifested in the work of creation, did provide and cast out the covenant of grace, a plank sufficient for his poor shipwrecked creature to swim safe to shore on.

As all the rivers meet in the sea, and all the lines in the centre, so do all the comforts of mankind meet in this covenant. The whole Scripture is ‘sincere milk,’ but this covenant is the cream of it: all our mercies are contained in it, all our hopes are sustained by it, and our heaven is at last attained through it.

The blessed God doth not only enter into a covenant of mercy, but out of compassion to our infirmities, hath been pleased to confirm it by his hand and seal: by his hand in his word, by his seals, by the privy-seal of his Spirit, and by the broad seals of the sacraments, that by these ‘immutable things, in which it is impossible for God to lie, we might have strong consolation, who have fled for refuge, to lay hold upon the hope set before us,’ Heb. vi. 18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 172.</span></figcaption>

— George Swinnock, The Christian Man’s Calling, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 172.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+God+had+caused+his+everlasting+decree+to+fall+in+labour%2C+and+had+delivered+it+by+giving+the+world+a+being%2C+and+upon+infinite+consultation+had+formed+man+to+be+his+viceroy+over+all+the+works+of+his+hands%2C+he+embarked+him%2C+with+all+abilities+needful+for+such+a+voyage%2C+in+the+bottom+of+the+covenant+of+works.%0A%0AAdam+set+forth+fully+furnished+with+skill%2C+and+richly+fraught+with+all+the+fortunes%2C+hopes%2C+and+happiness+of+mankind%3B+but+he+had+scarce+launched+out+of+sight%2C+before+Satan%2C+who+knew+very+well+the+worth+of+the+prize%2C+envying+man+the+haven+of+bliss+to+which+he+was+sailing%2C+and+envying+God%2C+who+was+the+owner%2C+the+honour+of+such+a+venture%2C+raised+a+storm%2C+whereby+the+vessel%2C+through+the+unfaithfulness+of+Adam%2C+the+pilot%2C+ran+upon+a+rock+and+miscarried.+Oh+what+a+joyful+spectacle+was+that+to+Satan%21%0A%0AWhat+a+doleful+sight+to+Adam%2C+to+behold+himself%2C+and+all+his+posterity%2C+sinking+into+the+boundless%2C+bottomless+ocean+of+destruction+and+misery%2C+through+his+falseness+and+treachery%21+when%2C+lo%2C+on+a+sudden+the+glorious+God%2C+out+of+the+superabundant+riches+of+his+mercy%2C+resolving+that+the+devil+should+never+rob+him+of+the+honour+of+that+manifold+wisdom%2C+unsearchable+goodness%2C+and+almighty+power%2C+which+had+been+manifested+in+the+work+of+creation%2C+did+provide+and+cast+out+the+covenant+of+grace%2C+a+plank+sufficient+for+his+poor+shipwrecked+creature+to+swim+safe+to+shore+on.%0A%0AAs+all+the+rivers+meet+in+the+sea%2C+and+all+the+lines+in+the+centre%2C+so+do+all+the+comforts+of+mankind+meet+in+this+covenant.+The+whole+Scripture+is+%E2%80%98sincere+milk%2C%E2%80%99+but+this+covenant+is+the+cream+of+it%3A+all+our+mercies+are+contained+in+it%2C+all+our+hopes+are+sustained+by+it%2C+and+our+heaven+is+at+last+attained+through+it.%0A%0AThe+blessed+God+doth+not+only+enter+into+a+covenant+of+mercy%2C+but+out+of+compassion+to+our+infirmities%2C+hath+been+pleased+to+confirm+it+by+his+hand+and+seal%3A+by+his+hand+in+his+word%2C+by+his+seals%2C+by+the+privy-seal+of+his+Spirit%2C+and+by+the+broad+seals+of+the+sacraments%2C+that+by+these+%E2%80%98immutable+things%2C+in+which+it+is+impossible+for+God+to+lie%2C+we+might+have+strong+consolation%2C+who+have+fled+for+refuge%2C+to+lay+hold+upon+the+hope+set+before+us%2C%E2%80%99+Heb.+vi.+18.%E2%80%9D%0A%0A%E2%80%94+George+Swinnock%2C+The+Christian+Man%E2%80%99s+Calling%2C+%281661-65%29+in+The+Works+of+George+Swinnock%2C+M.A.+%285+vols%2C+Edinburgh%3A+James+Nichol%2C+1868%29%2C+1%3A+172.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a3f19b66b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a3f19b66b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/03/george-swinnock-on-the-covenant-of-mercy-for-shipwrecked-creatures/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-d40176382a" data-kw="">
<blockquote><p>Now although God does not at all intend the salvation of the non-elect, yet he deals with the greatest truth and seriousness when he calls them, nor can any charge of mockery or deceit be brought against him. All that are called by the gospel, says the Synod of Dort, are seriously called, for God seriously and truly shews in his word what is acceptable to him, and also seriously promises rest for their souls, and eternal life, to all that come to him by faith.

Those who reject the word are very severely reproved in scripture, and will be punished for that rejection, (Isaiah 1. 2, 3; Ixv 2, 3; Matt. xi. 16; John v. 40; Proverbs i. 24-1 26); whereas those who obey the divine calling and receive the word, are commended, and will be rewarded. (John xiv. 21; Acts xvii. ii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 7.2, p. 338.</span></figcaption>

</figure><figure class="quote" id="q-ab5270ac96" data-kw="">
<blockquote><p>The Apostle [Paul] holds forth, that persons may be under the outward administrations of the Covenant, and yet not get the efficacy of it; [Romans 9] v.6. They are not all Israel that are of Israel; the Covenant was made with Abraham and his seed, all that were of him: and yet all were not Israel, that is, partakers of the inward life and efficacy of the Covenant; the Apostle only in these verses endeavours to take off that Objection, that God had broke his Covenant by casting away the Jews, and so distinguisheth of these that were merely of the flesh, who had the outward administration, but not the inward fruit, and these which were elect in the promise, in Isaac shall thy seed be called; the rest he calls the Children of the flesh, the former the Children of promise, v. 8. and so though they were under the outward dispensation of the Covenant, yet God was not mutable, nor his promise, though he rejected them, because of their own degeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cuthbert-sidenham.html">Cuthbert Sidenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of These Times; Infant-Baptism and Singing of Psalms</cite>, (London: Robert White, 1654), pp 20-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-d08b3058d9" data-kw="">
<blockquote><p>Our Lord Jesus is the actual and eventual Saviour of the elect only, in whose room and stead only he died upon the cross, according to the eternal compact passed between him and the Father, in the covenant of grace, otherwise called the covenant of redemption; for these are not two, but one and the same covenant. Thus the apostle calls him “the Saviour of the body,” Eph. v. 23. that is, of the elect, who make up the body whereof he was appointed the head from eternity, and in whose name he contracted with the Father in the eternal covenant.

And he is their Saviour eventually, as actually saving them, Matth. i. 21. “And she shall bring forth a son, and thou shalt call his name Jesus; for he shall save his people from their sins.” None but these will ever truly employ him as a Saviour, or put their case in his hand: and there are none of them but will certainly employ him sooner or later, Acts xiii. 48. “As many as were ordained to eternal life, believed.” John vi. 37. “All that the Father giveth me, shall come to me; and him that cometh to me, I will in no wise cast out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Saviour of the World. A Sermon Preached Immediately before the Celebration of the Lord’s Supper, at Ettrick, June 7, 1724</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 297.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-ab070bda2a" data-kw="">
<blockquote><p>Highly prize and frequent All the Means of Grace in Public and Private God’s Ordinances are his Sacred Channels wherein alone in ordinary, his streams of grace do flow. How did David exult in the enjoyment of them! How did he lament in the want of them! Christians ought to observe all Christ’s Commandments and Ordinances.

They must not forsake the Assembling of themselves together, as the manner of some is, O blessed is that people that know the joyful sound! The New Covenant, and the Administrations thereof are to continue till the end of this world: and therefore they ought still to be attended upon by all God’s New Covenant People.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Highly prize and frequent All the Means of Grace in Public and Private God’s Ordinances are his Sacred Channels wherein alone in ordinary, his streams of grace do flow. How did David exult in the enjoyment of them! How did he lament in the want of them! Christians ought to observe all Christ’s Commandments and Ordinances.

They must not forsake the Assembling of themselves together, as the manner of some is, O blessed is that people that know the joyful sound! The New Covenant, and the Administrations thereof are to continue till the end of this world: and therefore they ought still to be attended upon by all God’s New Covenant People.”

— Francis Roberts, The chequer-work of God’s providences, towards His own people, made up of blacks and whites, viz., of their abasements, and advancements, their distresses, and deliverances, their sullying tribulations, and beautifying relaxations represented in a sermon preached at the funeral of that faithful serv, (London: G. Calvert, 1657), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHighly+prize+and+frequent+All+the+Means+of+Grace+in+Public+and+Private+God%E2%80%99s+Ordinances+are+his+Sacred+Channels+wherein+alone+in+ordinary%2C+his+streams+of+grace+do+flow.+How+did+David+exult+in+the+enjoyment+of+them%21+How+did+he+lament+in+the+want+of+them%21+Christians+ought+to+observe+all+Christ%E2%80%99s+Commandments+and+Ordinances.%0A%0AThey+must+not+forsake+the+Assembling+of+themselves+together%2C+as+the+manner+of+some+is%2C+O+blessed+is+that+people+that+know+the+joyful+sound%21+The+New+Covenant%2C+and+the+Administrations+thereof+are+to+continue+till+the+end+of+this+world%3A+and+therefore+they+ought+still+to+be+attended+upon+by+all+God%E2%80%99s+New+Covenant+People.%E2%80%9D%0A%0A%E2%80%94+Francis+Roberts%2C+The+chequer-work+of+God%E2%80%99s+providences%2C+towards+His+own+people%2C+made+up+of+blacks+and+whites%2C+viz.%2C+of+their+abasements%2C+and+advancements%2C+their+distresses%2C+and+deliverances%2C+their+sullying+tribulations%2C+and+beautifying+relaxations+represented+in+a+sermon+preached+at+the+funeral+of+that+faithful+serv%2C+%28London%3A+G.+Calvert%2C+1657%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab070bda2a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ab070bda2a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/12/francis-roberts-on-prizing-the-means-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-9b6ce3afc7" data-kw="">
<blockquote><p>The covenants of a church are her glory; God’s covenant of grace and promise, and their covenants of duty and gratitude, Rom. ix. 4, it is said of the Old Testament church “To them belonged the adoption, the glory, and the covenants.” God’s covenant of grace and promise is the glory of a church. It was the misery of the poor Gentiles under the Old Testament, before the coming of Christ, that they were “strangers to the covenants of promise.” This is the church’s charter for all her immunities and privileges, visible or invisible, for the life that now is, and that which is to come: and it is “an everlasting covenant, well ordered in all things and sure:” and him that takes hold of this covenant, “even him will God bring to his holy mountain, and make joyful in his house of prayer,” Is. Ivi.

Now, this covenant hangs upon Christ, the nail fastened in a sure place; for God has “given him for a covenant unto the people;” it was made with him as a second Adam, and with his seed in him; he has fulfilled the condition of it, by the holiness of his nature, the obedience of his life, and the satisfaction made by his death; his fulfilling the commands and demands of the broken covenant of works, is the very condition of the covenant of grace, and by virtue of his doing so the cry comes out. Is. Iv. 1, “Ho, every one that thirsteth, come ye to the waters; he that hath no money, let him come; come, buy wine and milk without money, and without price.” The covenant, and all the blessings and promises of it, hang upon this blessed nail; they are all in him, and “in him yea and amen.”

Again, our covenants for duty, obedience, and gratitude, they hang upon this blessed nail. These are the glory of a church and land, as they were unto the church of Israel. God avouched them to be his peculiar people, and they avouched him, by solemn covenant, to be their God; on which account they are called Hephzibah, and Beulah; a people married to the Lord. This was the glory of this land, and of the three nations, though perfidiously broken, burnt, and buried. Blessed be God there is some small degree of a resurrection of these solemn covenants, by what has been lately transacted in this place.

But now, I say the glory of all our covenants, and engagements into personal or public reformation and obedience, must needs hang upon this nail fastened in a sure place. When men engage to duty in a legal way, in the strength of their own covenants, vows, promises, and resolutions, without fastening faith’s gripes upon the nail in a sure place, for righteousness and strength, they do only make to themselves ropes of sand, that will fall asunder as fast as they can make them. Christ only is “the strength of Israel;” all our funds of grace lie in him, “in whom it has pleased the Father that all fulness should dwell.”

And whatever duty we engage to should be in the strength of promised grace for assistance, and in the faith of his righteousness and intercession for acceptance: Is. xlv. 24, “Surely, shall one say, In the Lord have I righteousness and strength. I will go (says David) in the strength of the Lord God: I will make mention of thy righteousness, even of thine only.” And it is in this way that his commandments are not grievous, his yoke easy, and his burden light.</p></blockquote>

<blockquote><p>‘I will make an everlasting covenant with you, even the sure mercies of David.’ The sinner who comes to Christ is in covenant with God. God reveals to that sinner the fulness that’s in the covenant, and out of that covenant fulness he meets the sinner’s every need with the mercies of David.

These are the mercies that were promised to David’s greater Son and Lord, Jesus Christ. David himself recognised that the covenant was something that would survive after his death. ‘He hath made with me an everlasting covenant, ordered in all things, and sure.’ It was a covenant that was finding its fulfilment in Jesus Christ. What is promised to sinners who come to Christ in response to this call is that they will enter into the possession and the enjoyment of all those mercies promised to Christ in the everlasting covenant for his people. You see, the promise was made in eternity. We didn’t exist in eternity, but the Son of God existed, and the promises were made to him, for himself and for his people.

What was promised to him is described here as ‘sure mercies’. All the provisions of the gospel of the grace of God — justification, adoption, sanctification, and all the benefits that flow from them, in this life, at death, and at the resurrection. All these things are sure mercies, because God has promised them and provides them — because Jesus Christ God’s Son has procured them for his people, he met all the conditions — and because the Holy Spirit applies them to his people. That’s how sure they are. That’s how sure the salvation of the sinner who trusts in Christ is — they have the sure mercies of David, covenanted mercies. ‘I will make an everlasting covenant with them,’ as we have it in Jeremiah. The covenant was, ‘I will not turn away from them, but I’ll put my fear in their hearts so that they will not turn away from me’ (Jeremiah 32: 40).

These are sure mercies. God will never abandon us, and we will never abandon God. Although we have in us an evil heart of unbelief, departing from the living God, the Lord will not allow his people to depart. The Lord holds on to them. They may wander, they may fall, they may go through very dark passages. But the Lord’s everlasting arms are underneath them. His mercies are sure. They’re bound up with Christ. Their life is hid with Christ in God (Colossians 3: 3). How more secure could a person be than that? Your life is hid with Christ in God— is there anywhere more secure than in God and bound up with Christ in God?</p></blockquote>

<blockquote><p>It is true, that CHRIST his death is a sufficient price of ransom for the sins of the whole world: Yea of more worlds, if there were more then one, for his blood and his sufferings, whereby he redeemed us, were the blood and sufferings of him that was and is God but yet they are effectual only to those that do believe.

For if CHRIST had redeemed all men, then all should be saved. For all that are redeemed are also justified, &amp; all that are justified shall be glorified For, for whom CHRIST died, for them he hath satisfied the justice of his father, so that there is no condemnation to them, whom CHRIST hath redeemed.

For whom CHRIST died, them by his death he reconciled to God, now they, who when they were enemies were reconciled to God by the death of his Son; much more being reconciled shall be saved by his life: Neither may we think, that CHRIST would die for them, for whom he would not pray. But for the world saith he, that is for the company of the wicked and reprobates I pray not but for them whom thou hast given me out of the world.

But if the Oath of an honest man, ought to be the end of controversy, much more ought the Oath of God in this place end this controversy concerning universal redemption. For God hath sworn, that to so many as he redeemeth, he will give them to worship him in holiness and righteousness. But the greater part of mankind have never the grace to worship God in holiness and righteousness, and therefore to them the benefit of redemption doth not belong.</p></blockquote>

<blockquote><p>I. On the recovery of fallen believers.

1. I begin by remarking that true believers, as well as others, are liable to fall into sin. This is implied in all the warnings which the Scriptures give on this head. “Let him that thinketh he standeth take heed lest he fall.” “Take heed, brethren, lest there be in any of you an evil heart of unbelief.” “Let us labour — lest any man fall after the same example of unbelief.” It is also evident from Scripture example, of which that of Peter is instead of a thousand.

As some professors of religion may fall totally and irrecoverably from Christ, after very high and specious attainments, so genuine Christians may fall very foully, and, for a time, may remain in a desperate like condition. The promises and provisions of the covenant of grace secure all those who are vitally united to Christ from total and final apostasy, but there is no arrangement made securing that they shall not sin, and by their sin grievously dishonour God, wound their own consciences, lay a stumbling-block before others, and subject themselves to severe chastisement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Recovered Disciple in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

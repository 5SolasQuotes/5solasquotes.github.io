<blockquote><p>(4) The formation of the foetus in the Virgin’s womb had its stages and processes, as is usual in the formation of other foetuses and which are usually completed in the space of 9 months. It was right that Christ should be made like us in this too, namely in not being formed and born in a moment, but being completed in a matrix suited to the order and processes of nature, the operation of the H. Spirit thus accommodating its process of quickening. (5) The union of the divine nature with the human began the moment the formation of the human nature was completed, so that it would be said to have been composed of human matter and form.</p></blockquote>

</figure><figure class="quote" id="q-96c7c9f9d1" data-kw="">
<blockquote><p>Whether the Son of God assumed flesh by the soul mediating? It is affirmed with a distinction. Whether the Son of God assumed a soul by the spirit or mind mediating, that is, the rational part of the soul? It is affirmed. Whether the soul was assumed before the flesh. It is denied. Whether the flesh of Christ was assumed by the Word before the union of the soul? It is denied. Whether the whole nature was assumed simultaneously through mediating parts? It is distinguished. Whether the human nature was assumed by grace mediating? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems… (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Mode of Assuming, as far as the Order</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-16c407d07f" data-kw="">
<blockquote><p>Whether it was a natural conception or a miraculous one? The latter is affirmed. Whether the flesh of Christ was conceived and formed in an instant? It is denied. Whether it was first conceived and formed and then united? It is denied with a distinction. …. Whether the soul of Christ was infused in the first instantiating of the conception of the body, or rather after? The latter is affirmed. Whether and in what way the embryo, or that body not yet animated, was able to be said to be the body of Christ? It is explained. Whether the flesh of Christ had its beginning from Adam? It is affirmed with a distinction. … Whether in the instantiating of the conception or of the union Christ was sactified by grace? It is distinguished. Whether in the same instantiating it had the use of free choice and reason? It is denied. Whether in the same instantiating, He was able to merit? It is denied. Whether from the first moment of conception Christ enjoyed the beatific vision? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems… (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Conception &amp; Gestation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

ormedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=Whether%20it%20was%20a%20natural%20conception,the%20beatific%20vision%3F%20It%20is%20denied&amp;text=Whether%20it%20was%20a%20natural%20conception%20or%20a&amp;text=Christ%20enjoyed%20the%20beatific%20vision%3F%20It%20is%20denied" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(2) The formation of Christ’s body, to which belongs its organization, animation and the uniting of the two, body as well as soul, with the blood. 28: Query, Was Christ’s body formed in a moment or successively? Answer: Three things occur here: (1) the preparation of the material of which Christ’s body was formed; (2) the formation of the body out of the material duly prepared; (3) the completion of the same body brought gradually by its own increments to the proper stature. As regards (1) and (3) all are agreed that they were accomplished by degrees (successive). As regards (2) theologians disagree, some urging an instantaneous formation, others a successive, with the latter of whom we agree. Because: (1) the instantaneous and miraculous formation of Christ’s complete body and its union with the soul is a fiction unsupported by Scripture; (2) in his assumption of human nature Christ is said to have been made like us, except for sin; (3) if Christ’s body was completed in a moment, it could equally have been born the same moment and the Blessed Virgin need not have suffered the inconveniences of ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(XI, 27) as quoted in Heinrich Heppe, Reformed Dogmatics, ch. 17, Person of Christ, section 12</cite>, pp. 425-6</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-30b52f2456" data-kw="">
<blockquote><p>Nor is it of importance to inquire curiously at what time the soul was united to the body, the Logos (Logos) to the flesh. It is enough for us to believe that the human nature from the time it began to be never existed apart from the Logos (Logo), but was assumed by and hypostatically united to him. And if the soul could not be poured into the body unless already organized and completely formed (a point on which physicians are not agreed among themselves), it does not follow that the Logos (Logon) could not at once unite the flesh to himself, since his work could not be constrained either with the soul present or absent. Nor is it more absurd for the body of Christ (not as yet animated) to be united to the Logos (Logo), then for the same (when lifeless in the sepulcher) to remain conjoined with the same (as theologians acknowledge was done in the death of Christ).</p></blockquote>

<blockquote><p>You must not waver with regard to your decisions. “You shall not take the Lord’s name in vain.” You shall love your neighbor more than your own life. You shall not abort a child nor, again, commit infanticide. You must not withhold your hand from your son or your daughter, but from their youth you shall teach them the fear of God.</p></blockquote>

<blockquote><p>If men strive, and hurt a woman. This passage at first sight is ambiguous, for if the word death only applies to the pregnant woman, it would not have been a capital crime to put an end to the foetus, which would be a great absurdity; for the fœtus, though enclosed in the womb of its mother, is already a human being, (homo) and it is almost a monstrous crime to rob it of the life which it has not yet begun to enjoy. If it seems more horrible to kill a man in his own house than in a field, because a man’s house is his place of most secure refuge, it ought surely to be deemed more atrocious to destroy a foetus in the womb before it has come to light. On these grounds I am led to conclude, without hesitation, that the words, “if death should follow,” must be applied to the foetus as well as to the mother.</p></blockquote>

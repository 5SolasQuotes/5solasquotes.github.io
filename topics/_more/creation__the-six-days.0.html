<figure class="quote" id="q-0a819d3bca" data-kw="">
<blockquote><p>A simple survey of the world should of itself suffice to attest a Divine Providence. The heavens revolve daily, and, immense as is their fabric, and inconceivable the rapidity of their revolutions, we experience no concussion — no disturbance in the harmony of their motion. The sun, though varying its course every diurnal revolution, returns annually to the same point. The planets, in all their wanderings, maintain their respective positions. How could the earth hang suspended in the air were it not upheld by God’s hand? By what means could it maintain itself unmoved, while the heavens above are in constant rapid motion, did not its Divine Maker fix and establish it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 93:1</span></figcaption>

</figure><figure class="quote" id="q-465ac9ef5f" data-kw="">
<blockquote><p>’The sun and the moon stood still in their habitation’ – they stood still in their several spheres wherein they move, for these be their habitations, and note that they both stood still, sun and moon. For the moon borrowing all her light of the sun, had she kept her course while the sun had stool still the length of a day, there had been great irregularity of motion in these celestial bodies, from the constant order set them by their Maker in their creation. Observe also, he does not say the earth stood still, but the sun: it had been, as some said, the earth and moon stood still as the sun and moon, and our understanding would have soon apprehended, if that new astronomy had been then revealed, which some of our empericks, and journeymen in that excellent science of astronomy have late revived in their almanacs, telling the world that they have long been in a wrong belief, that the sun moves and the earth is fixed, for they believe that the sun is fixed, and the earth is moved. And to evade the clear evidence of the text, which tells it for a wonder that the sun stood still, they say, this is spoken to our capacity, because to our sight it so seems, that the sun moves and the earth is fixed, but indeed it is otherwise. Our capacity I think has much wrong done in this, for if the Word of God had told us that God had created the sun to stand still, and the earth to move, it is more likely that we should have taken his word for it, and have believed it as it is, as well as we now believe it, as it appears. We are neither incapable nor incredulous, but that many against the letter of Scripture have written, and made more believe, that the sun stands still from the creation. The common defence of this opinion grounded on God’s application of himself, to human capacity, does make figures in a story where is no need, and makes David a man of small judgement in the knowledge of the sun, who says, that God ‘hath set a tabernacle for the sun in the heavens’ (called here) a habitation, ‘which is a bridegroom coming out of his chamber, and rejoiceth, as a strong man, to run his race.’ His going forth is from the end of the Heaven, and his circuit unto the ends of it. Does not this prophet speak of the glory of God, declared in the motion, not the station of the sun? or in the glory of God showed in our opinion of the sun’s motion, not in the truth thereof. Greater secrets then this are revealed in holy Scripture, which are against the vouchie of the outward sense, or the rational discourse of man, and no doubt, but if the sun had stood still, and the earth that we live upon had moved, when this miracle was by the spirit of truth recorded, it had been so set down to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-marbury.html">Edward Marbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary or Exposition upon the Prophecy of Habbakuk</cite>, ... (London, 1650), on Hab. 3:11, pp. 127-128</span></figcaption>

</figure><figure class="quote" id="q-1d83a2433e" data-kw="">
<blockquote><p>The stability of the earth is very useful to plants, beasts, and men, that abide thereon. The damages and mischiefs that fall out upon earthquakes give further proof hereof. It is a gross error of Aristarchus, Samius, Copernicus, and other philosophers, who imagine that the earth continually moveth, and that the heaven and the host thereof do but seem to our sight to move, as the banks and trees thereon do to such as are in a boat rowed with oars, or in a ship under sail. This conceit cannot stand with the metaphor of a foundation, here and in other places applied to the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, ch. 1, verse 10, section 131</span></figcaption>

<blockquote><p>VIII. …For on the first day [of Creation]… a shining body lighted up in one hemisphere of the ethereal heavens (which by its circumrotation distinguished the day and night of the first three days, until that light was afterwards, on the fourth day, collected and distributed into the body of the sun and stars).</p></blockquote>

</figure><figure class="quote" id="q-788a1ac44c" data-kw="">
<blockquote><p>As if the several motions and phaenomena of the heavens may be with equal probability explained according to the Ptolemaic or Copernican Hypothesis, viz. about the rest or motion of the earth; then it necessarily follows, that from those phaenomena no argument can be drawn evincing the necessity of the one hypothesis and overturning the probability of the other. If that great wonder of nature, the flux and reflux of the sea, might with equal congruity be solved according to the different opinions, of its being caused by subterraneous fires, or from the motion of the moon, or the depression of the lunar vortex, or (which to me is far the most probable) by a motion of consent of the sea with all the other great bodies of the world; we should find no necessity at all of entertaining one opinion above another, but to look upon all as probable, and none as certain. So likewise for the composition and motion of all natural bodies, the several hypotheses of the old and new philosophy, implying no apparent incongruity to nature, do make it appear that all or any of them may be embraced as ingenious romances in philosophy (as they are no more), but that none of them are the certain truth, or can be made appear so to be to the minds of men.</p></blockquote>

nds%20of%20men&amp;text=As%20if%20the%20several%20motions%20and%20phaenomena%20of&amp;text=so%20to%20be%20to%20the%20minds%20of%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Secondly, that which is the only foundation of a scruple in this case, is a principle most unreasonable in itself, that we are to embrace nothing for truth, though divinely revealed, but what our reason is able to comprehend, as to the nature of the thing, and the manner of its existence; on which account the doctrine of the Trinity, Incarnation, Satisfaction, and consequently the whole mystery of the Gospel of Christ must be rejected as incredible, and that on this bare pretense, because although many expressions in Scripture seem to import all these things, yet we are bound to interpret them to another sense, because this is incongruous to our reason. But although Christianity be a religion which comes in the highest way of credibility to the minds of men, although we are not bound to believe anything but what we have sufficient reason to make it appear that it is revealed by God, yet that anything should be questioned whether it be of divine revelation, merely because our reason is to seek, as to the full and adaequate conception of it, is a most absurd and unreasonable pretence: And the assertors of it must run themselves on these unavoidable absurdities: First, of believing nothing either in nature or religion to be true, but what they can give a full and satisfactory account of, as to every mode and circumstance of it. Therefore let such persons first try themselves in all the appearances of nature: And then we may suppose they will not believe that the sun shines, till they have by demonstrative arguments proved the undoubted truth of the Ptolomaic or Copernican hypothesis, that they will never give credit to the flux and reflux of the Sea, till they clearly resolve the doubts which attend the several opinions of it. That there is no such thing as matter in the world, till they can satisfactorily tell us how the parts of it are united; nor that there are any material beings, till they have resolved all the perplexing difficulties about the several affections of them; and that themselves have not so much as a rational soul, till they are bound to satisfy us of the manner of the union of the soul and body together. And if they can expedite all these, and many more difficulties about the most obvious things…</p></blockquote>

<blockquote><p>These people believe that the Bible clearly states that the Earth does not move, and hence the only acceptable Biblical cosmology is a geocentric one… We examine these arguments, and find them poorly founded. The Scriptural passages quoted do not address cosmology. Some geocentrists draw distinctions that do not exist in the original autographs or even in translations. In short, the Bible is neither geocentric nor heliocentric… Many evolutionists claim that disbelief in evolution is like disbelief that the Earth goes round the Sun. The obvious flaw is that the latter is repeatable and observable while the former is not…. …Aardsma’s ICR Impact article, where he points out something well known to high-school physics students, but apparently not to bibliosceptics—that it’s valid to describe motion from any reference frame, although an inertial one usually makes the mathematics simpler. But there are many times when the Earth is a convenient reference frame; i.e. at some point we all use the geocentric model in one sense. For instance, a planetarium is a geocentric model. Calculation of rising, transiting, and setting of various celestial objects is calculated geocentrically. There are numerous other examples. Since modern astronomers often use an Earth-centred reference frame, it’s unfair and anti-scientific to criticise the Bible for doing the same. But this is hardly the issue, and the use of the geocentric model under these circumstances hardly makes one a geocentrist. I’m using the term to describe those who claim that the Earth is the only valid reference frame and oppose the use of any other reference frame. Perhaps the best-known geocentrist in the world today [2001] is Gerardus Bouw, who has been a professor at Baldwin-Wallace College in Berea, Ohio… To distinguish modern geocentrism from ancient geocentrism, Bouw has coined the term ‘geocentricity’ for the former. Bouw has a Ph.D. in astronomy from Case Western Reserve University… Given Bouw’s stature as the chief champion of geocentricity, we will use his book by the same name as the primary source on the topic.</p></blockquote>

<blockquote><p>§ 5. I have moreover insisted on the different apprehensions the old philosophers entertain concerning those insuperable difficulties that are about predetermination, etc. thereby to intimate that the confident [Medieval] schoolmen and their several sectators do but actum agere, and consume their strength on needless controversies, to the great disadvantage of true religion. These acting in divinity, as our virtuosi do in philosophy, who, by a zealous attempt to establish their new dogmata [dogmas] (as they call them) do not walk in any untrodden paths; The Copernican Hypothesis about the motion of the earth, as also the learned fancies about the earth, and inhabitants that are said to be in the moon, as well as that solid truth about the Antipodes, so much reproached by Lactantius [early Church father, c. 250 – c. 325, in The Divine Institutes, Bk. 3, ch. 24 in ANF 7.94-95], were all known in Cicero‘s, if not in Plato‘s, or Pythagoras‘s days. For this, consult Cicero, Quaest. Acad. l. 2: ‘Habitari ait Xenophanes in Luna, eamque esse terram multarum urbium, &amp; montium. Portenta videntur: sed tamen neque ille qui dixit jurare posset ita se rem habere, neque ego. Nonne etiam dicitis, esse è regione nobis, è contraria parte terrae, qui adversis vestigiis stent contra vestigia nostra, quos Antipodas vocatis? Cur mihi magis succensetis, qui ista non aspernor, quam eis, qui quum audiunt, desipere vos arbitrantur? Nicetas Syracusius, ut ait Theophrastus, Coelum, Solem, Lunam, Stellas, supera denique omnia stare censet, neque praeter terram rem ullam in mundo moveri: quae cùm circum axem se summa celeritate convertat, &amp; torqueat, eâdem effici omnia, quae si stante terra, Coelum moveretur. Atque hoc etiam Platonem in Timaeo dicere quidam arbitrantur, sed paulò obscuriùs.’ Thus both our New Philosophers, and the Old Schoolmen, do but trace the ancient heathen in their particular fancies, concerning things not only unrevealed, but moreover, too high for vain mortals to reach unto. The New Philosophers confidently solve, as they say, the insolvable phaenomena in the natural world… for the Schoolmen are as vain, and consequently as liable unto just rebukes, as are the New Philosophers; Do the New Philosophers revive the old dogmata of the heathen? so do the schoolmen: Do the New Philosophers disturb the world with their learned folly? so do the schoolmen. And must the New Philosopher be severely checked for his presumption in philosophy? then surely, much more so must the schoolman…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-lobb.html">Stephen Lobb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glory of Free Grace Displayed</cite>, … (London, 1680), pp. x-xi. Lobb (c. 1647–1699) was an English, calvinistic, indpendent minister. He was prominent in the 1680’s as a court representative of the Independents to James II, and in the 1690s in polemics between the Presbyterian and Independent groups of nonconformists. His church in London is supposed to be the successor to the congregation of Thomas Goodwin.</span></figcaption>

nrevealed, but moreover, too high for vain mortals to reach unto. The New Philosophers confidently solve, as they say, the insolvable phaenomena in the natural world… for the Schoolmen are as vain, and consequently as liable unto just rebukes, as are the New Philosophers; Do the New Philosophers revive the old dogmata of the heathen? so do the schoolmen: Do the New Philosophers disturb the world with their learned folly? so do the schoolmen. And must the New Philosopher be severely checked for his presumption in philosophy? then surely, much more so must the schoolman…”

— Stephen Lobb, The Glory of Free Grace Displayed, … (London, 1680), pp. x-xi. Lobb (c. 1647–1699) was an English, calvinistic, indpendent minister. He was prominent in the 1680’s as a court representative of the Independents to James II, and in the 1690s in polemics between the Presbyterian and Independent groups of nonconformists. His church in London is supposed to be the successor to the congregation of Thomas Goodwin.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7+5.+I+have+moreover+insisted+on+the+different+apprehensions+the+old+philosophers+entertain+concerning+those+insuperable+difficulties+that+are+about+predetermination%2C+etc.+thereby+to+intimate+that+the+confident+%5BMedieval%5D+schoolmen+and+their+several+sectators+do+but+actum+agere%2C+and+consume+their+strength+on+needless+controversies%2C+to+the+great+disadvantage+of+true+religion.+These+acting+in+divinity%2C+as+our+virtuosi+do+in+philosophy%2C+who%2C+by+a+zealous+attempt+to+establish+their+new+dogmata+%5Bdogmas%5D+%28as+they+call+them%29+do+not+walk+in+any+untrodden+paths%3B+The+Copernican+Hypothesis+about+the+motion+of+the+earth%2C+as+also+the+learned+fancies+about+the+earth%2C+and+inhabitants+that+are+said+to+be+in+the+moon%2C+as+well+as+that+solid+truth+about+the+Antipodes%2C+so+much+reproached+by+Lactantius+%5Bearly+Church+father%2C+c.+250+%E2%80%93+c.+325%2C+in+The+Divine+Institutes%2C+Bk.+3%2C+ch.+24+in+ANF+7.94-95%5D%2C+were+all+known+in+Cicero%E2%80%98s%2C+if+not+in+Plato%E2%80%98s%2C+or+Pythagoras%E2%80%98s+days.+For+this%2C+consult+Cicero%2C+Quaest.+Acad.+l.+2%3A+%E2%80%98Habitari+ait+Xenophanes+in+Luna%2C+eamque+esse+terram+multarum+urbium%2C+%26+montium.+Portenta+videntur%3A+sed+tamen+neque+ille+qui+dixit+jurare+posset+ita+se+rem+habere%2C+neque+ego.+Nonne+etiam+dicitis%2C+esse+%C3%A8+regione+nobis%2C+%C3%A8+contraria+parte+terrae%2C+qui+adversis+vestigiis+stent+contra+vestigia+nostra%2C+quos+Antipodas+vocatis%3F+Cur+mihi+magis+succensetis%2C+qui+ista <blockquote><p>When Moses writes that God created Heaven and Earth and whatever is in them in six days, then let this period continue to have been six days, and do not venture to devise any comment according to which six days were one day. But, if you cannot understand how this could have been done in six days, then grant the Holy Spirit the honor of being more learned than you are. For you are to deal with Scripture in such a way that you bear in mind that God Himself says what is written. But since God is speaking, it is not fitting for you wantonly to turn His word in the direction you wish to go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Luther Says. A Practical In-Home Anthology for the Active Christian</cite>, ed. Ewald M. Plass (St. Louis: Concordia, 1959), p. 1523</span></figcaption>

<blockquote><p>9. That it [Creation] is an action not successive, but instantaneous; for creation is not motion, as Thomas rightly proves, Summa Contra Gentiles bk. 2, chs. 17 and 19. Therefore God created each thing, if we consider them separately and in themselves, in an instant: although the creation of some succeeded to others in the span of six days, if we consider them collectively. But why God did not create all things at once, no reason besides his will can be adduced. For the twofold διασκοπία [scope] which is usually adduced from Ambrose, Hexaemeron, bk. 1, ch. 7, and Augustine, On Genesis, seems to me indeed, to speak truly, insufficiently solid: namely so that hence it might more openly be established that the world was founded not from eternity, but in time; and that men might so much the more distinctly and attentively meditate on the individual works of God. As if namely we would less meditatively and attentively [consider] the soul of man, or the animation [ensoulment] of the fetus, or the sun, or the hypostatic union of Christ, because God effected those works in a moment. But that reason which Augustine adduces for the time of six days in bk. 4, On the Trinity, and bk. 4, On the Literal Meaning of Genesis, ch. 1, namely that the number six is the first perfect [number], is plainly atheological, and savors of Kabbalistic superstitions: Petrus Bongus, On the Mysteries of Numbers, on the number six, p. 268, thus urges this, that he does not fear to write: For the number six is said to be sacred, and perfect not only because in this number of days all the species of things were founded, as William Hamerus had thought, following Pope Gregory the Great, bk. 35, ch. 20, Moralia, but also for that reason God perfected his works in six days, because six is perfect, and sacrosanct. Therefore even if those things were not, it would be perfect; but unless it itself were perfect, those things would not become perfect according to it: In the same chapter he adduces for this μυσταγωγία Kabbalah Clement of Alexandria, and Eusebius, who in the books of Evangelical Preparation, cites Clement. But it can be said that they argued more to the man, than from the truth of the thing and their own sense. For thus Clement, bk. 5, Stromata, p. 432: The βάρβαρος φιλοσοφία indeed knows one world, which is perceived by the intellect, but another sensible, etc. καὶ τὸν μὲν ἀρχέτυπον, and that indeed archetypal it attributes to the monad as that which is perceived by the intellect: but this sensible [world], to the number six. For among the Pythagoreans marriage is called the number six, as that which is the generative number. We reject: 1. The opinion of those, who establish that the entire world was founded in an instant, or at once, and afterwards the individual [things] were successively separated from each other. Maimonides in The Guide of the Perplexed, pt. 2, ch. 30. Of the same opinion are Philo, bk. 1, Allegories, Cajetan on Gen. 1, Melchior Cano in Bañez on ST, pt. Ia, q. 74, art. 2, Augustine, bk. 11, On the Literal Meaning of Genesis, ch. 22. We reject: 2. Those, who Kabbalistically deduce the duration of the world and other mysteries from the six days of the creation of the world. Of which sort were not only Jews, but also some from the Christians: Concerning which perhaps we must speak elsewhere in the chapter ‘On the End of the World, or on the Signs of the Times’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2 Latin | On Creation, pt. 1, p. 112</span></figcaption>

<div class="actions"><button class="copy" data-copy="“9. That it [Creation] is an action not successive, but instantaneous; for creation is not motion, as Thomas rightly proves, Summa Contra Gentiles bk. 2, chs. 17 and 19. Therefore God created each thing, if we consider them separately and in themselves, in an instant: although the creation of some succeeded to others in the span of six days, if we consider them collectively. But why God did not create all things at once, no reason besides his will can be adduced. For the twofold διασκοπία [scope] which is usually adduced from Ambrose, Hexaemeron, bk. 1, ch. 7, and Augustine, On Genesis, seems to me indeed, to speak truly, insufficiently solid: namely so that hence it might more openly be established that the world was founded not from eternity, but in time; and that men might so much the more distinctly and attentively meditate on the individual works of God. As if namely we would less meditatively and attentively [consider] the soul of man, or the animation [ensoulment] of the fetus, or the sun, or the hypostatic union of Christ, because God effected those works in a moment. But that reason which Augustine adduces for the time of six days in bk. 4, On the Trinity, and bk. 4, On the Literal Meaning of Genesis, ch. 1, namely that the number six is the first perfect [number], is plainly atheological, and savors of Kabbalistic superstitions: Petrus Bongus, On the Mysteries of Numbers, on the number six, p. 268, thus urges this, that he does not fear to write: For the number six is said to be sacred, and perfect not only because in this number of days all the species of things were founded, as William Hamerus had thought, following Pope Gregory the Great, bk. 35, ch. 20, Moralia, but also for that reason God perfected his works in six days, because six is perfect, and sacrosanct. Therefore even if those things were not, it would be perfect; but unless it itself were perfect, those things would not become perfect according to it: In the same chapter he adduces for this μυσταγωγία Kabbalah Clement of Alexandria, and Eusebius, who in the books of Evangelical Preparation, cites Clement. But it can be said that they argued more to the man, than from the truth of the thing and their own sense. For thus Clement, bk. 5, Stromata, p. 432: The βάρβαρος φιλοσοφία indeed knows one world, which is perceived by the intellect, but another sensible, etc. καὶ τὸν μὲν ἀρχέτυπον, and that indeed archetypal it attributes to the monad as that which is perceived by the intellect: but this sensible [world], to the number six. For among the Pythagoreans marriage is called the number six, as that which is the generative number. We reject: 1. The opinion of those, who establish that the entire world was founded in an instant, or at once, and afterwards the individual [things] were successively separated from each other. Maimonides in The Guide of the Perplexed, pt. 2, ch. 30. Of the same opinion are Philo, bk. 1, Allegories, Cajetan on Gen. 1, Melchior Cano in Bañez on ST, pt. Ia, q. 74, art. 2, Augustine, bk. 11, On the Literal Meaning of Genesis, ch. 22. We reject: 2. Those, who Kabbalistically deduce the duration of the world and other mysteries from the six days of the creation of the world. Of which sort were not only Jews, but also some from the Christians: Concerning which perhaps we must speak elsewhere in the chapter ‘On the End of the World, or on the Signs of the Times’.”

— Gisbertus Voetius, Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2 Latin | On Creation, pt. 1, p. 112">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C9.+That+it+%5BCreation%5D+is+an+action+not+successive%2C+but+instantaneous%3B+for+creation+is+not+motion%2C+as+Thomas+rightly+proves%2C+Summa+Contra+Gentiles+bk.+2%2C+chs.+17+and+19.+Therefore+God+created+each+thing%2C+if+we+consider+them+separately+and+in+themselves%2C+in+an+instant%3A+although+the+creation+of+some+succeeded+to+others+in+the+span+of+six+days%2C+if+we+consider+them+collectively.+But+why+God+did+not+create+all+things+at+once%2C+no+reason+besides+his+will+can+be+adduced.+For+the+twofold+%CE%B4%CE%B9%CE%B1%CF%83%CE%BA%CE%BF%CF%80%CE%AF%CE%B1+%5Bscope%5D+which+is+usually+adduced+from+Ambrose%2C+Hexaemeron%2C+bk.+1%2C+ch.+7%2C+and+Augustine%2C+On+Genesis%2C+seems+to+me+indeed%2C+to+speak+truly%2C+insufficiently+solid%3A+namely+so+that+hence+it+might+more+openly+be+established+that+the+world+was+founded+not+from+eternity%2C+but+in+time%3B+and+that+men+might+so+much+the+more+distinctly+and+attentively+meditate+on+the+individual+works+of+God.+As+if+namely+we+would+less+meditatively+and+attentively+%5Bconsider%5D+the+soul+of+man%2C+or+the+animation+%5Bensoulment%5D+of+the+fetus%2C+or+the+sun%2C+or+the+hypostatic+union+of+Christ%2C+because+God+effected+those+works+in+a+moment.+But+that+reason+which+Augustine+adduces+for+the+time+of+six+days+in+bk.+4%2C+On+the+Trinity%2C+and+bk.+4%2C+On+the+Literal+Meaning+of+Genesis%2C+ch.+1%2C+namely+that+the+number+six+is+the+first+perfect+%5Bnumber%5D%2C+is+plainly+atheological%2C+and+savors+of+Kabbalistic+superstitions%3A+Petrus+Bongus%2C+On+the+Mysteries+of+Numbers%2C+on+the+number+six%2C+p.+268%2C+thus+urges+this%2C+that+he+does+not+fear+to+write%3A+For+the+number+six+is+said+to+be+sacred%2C+and+perfect+not+only+because+in+this+number+of+days+all+the+species+of+things+were+founded%2C+as+William+Hamerus+had+thought%2C+following+Pope+Gregory+the+Great%2C+bk.+35%2C+ch.+20%2C+Moralia%2C+but+also+for+that+reason+God+perfected+his+works+in+six+days%2C+because+six+is+perfect%2C+and+sacrosanct.+Therefore+even+if+those+things+were+not%2C+it+would+be+perfect%3B+but+unless+it+itself+were+perfect%2C+those+things+would+not+become+perfect+according+to+it%3A+In+the+same+chapter+he+adduces+for+this+%CE%BC%CF%85%CF%83%CF%84%CE%B1%CE%B3%CF%89%CE%B3%CE%AF%CE%B1+Kabbalah+Clement+of+Alexandria%2C+and+Eusebius%2C+who+in+the+books+of+Evangelical+Preparation%2C+cites+Clement.+But+it+can+be+said+that+they+argued+more+to+the+man%2C+than+from+the+truth+of+the+thing+and+their+own+sense.+For+thus+Clement%2C+bk.+5%2C+Stromata%2C+p.+432%3A+The+%CE%B2%CE%AC%CF%81%CE%B2%CE%B1%CF%81%CE%BF%CF%82+%CF%86%CE%B9%CE%BB%CE%BF%CF%83%CE%BF%CF%86%CE%AF%CE%B1+indeed+knows+one+world%2C+which+is+perceived+by+the+intellect%2C+but+another+sensible%2C+etc.+%CE%BA%CE%B1%E1%BD%B6+%CF%84%E1%BD%B8%CE%BD+%CE%BC%E1%BD%B2%CE%BD+%E1%BC%80%CF%81%CF%87%CE%AD%CF%84%CF%85%CF%80%CE%BF%CE%BD%2C+and+that+indeed+archetypal+it+attributes+to+the+monad+as+that+which+is+perceived+by+the+intellect%3A+but+this+sensible+%5Bworld%5D%2C+to+the+number+six.+For+among+the+Pythagoreans+marriage+is+called+the+number+six%2C+as+that+which+is+the+generative+number.+We+reject%3A+1.+The+opinion+of+those%2C+who+establish+that+the+entire+world+was+founded+in+an+instant%2C+or+at+once%2C+and+afterwards+the+individual+%5Bthings%5D+were+successively+separated+from+each+other.+Maimonides+in+The+Guide+of+the+Perplexed%2C+pt.+2%2C+ch.+30.+Of+the+same+opinion+are+Philo%2C+bk.+1%2C+Allegories%2C+Cajetan+on+Gen.+1%2C+Melchior+Cano+in+Ba%C3%B1ez+on+ST%2C+pt.+Ia%2C+q.+74%2C+art.+2%2C+Augustine%2C+bk.+11%2C+On+the+Literal+Meaning+of+Genesis%2C+ch.+22.+We+reject%3A+2.+Those%2C+who+Kabbalistically+deduce+the+duration+of+the+world+and+other+mysteries+from+the+six+days+of+the+creation+of+the+world.+Of+which+sort+were+not+only+Jews%2C+but+also+some+from+the+Christians%3A+Concerning+which+perhaps+we+must+speak+elsewhere+in+the+chapter+%E2%80%98On+the+End+of+the+World%2C+or+on+the+Signs+of+the+Times%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+2+Latin+%7C+On+Creation%2C+pt.+1%2C+p.+112&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8315798edf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/8315798edf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-long-god-took-in-creating/#:~:text=9.%20That%20it%20%5BCreation%5D%20is%20an,on%20the%20Signs%20of%20the%20Times&amp;text=9.%20That%20it%20%5BCreation%5D%20is%20an%20action%20not&amp;text=World%2C%20or%20on%20the%20Signs%20of%20the%20Times" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-662b7a1562" data-kw="">
<blockquote><p>As to 1, the world is one, as the sacred Scriptures teach in innumerable places. It will suffice to have indicated Jn. 1:3; Col. 1:16 compared with Gen. 1, 2, where one world created by the works of six days is described:</p></blockquote>

</figure><figure class="quote" id="q-f522974a21" data-kw="">
<blockquote><p>Creatures considered through individual species are usually divided among physicists either according to the species of natural body, which is simple and mixed, etc. or according to the parts of the world, which are containers and contents, celestial and elemental, etc. We, presently omitting those things, will follow the division by the works of the six days’ creation frequented by all theologians and chronologers; and we will explain some things about the system of the world from Mosaic physics in the manner and method of theologians. For to want to call that into doubt, and to reduce it to absurdity belongs to those who, being unwise, refuse to submit their wisdom to the most Holy Spirit, and pave the way for themselves and others to Libertinism or atheism: while the system of the world described by Moses to them does not seem dissimilar to the fables and absurdities of Muhammad about the earth being founded on the horn of an ox (in the book Sunna), about the sun when it sets, immersing itself in a bubbling spring of water (Quran, chapter on the Cave). Objections and exceptions against the sacred Mosaic physics which are usually brought forward are not so subtle that they cannot be resolved. As among others Francis Junius shows against the 22 arguments of Simplicius, and of today’s antinomians, at the end of the explanation of the first three chapters of Genesis: with whom Scipio Claromontius, On the Universe, should be compared, and other philosophers to be cited below, who do not allow anti-Mosaic systems of the moderns to be foisted upon them…. …Heaven and the angels were created on the First Day. The reasons are: … 2. Because nowhere in the Hexaemeron is mention made of the creation of that heaven and the angels: but God completed in six days all things that were created, Gen. 2:1, and that heaven is among things created, Heb. 11:10.</p></blockquote>

</figure><figure class="quote" id="q-d212cdbaa3" data-kw="">
<blockquote><p>We know that God created the world in time; but why He did not create the world millions of years before, we are ignorant of, and our reasons would be bewildred in their too much curiosity. If we ask why He did not create it before, we may as well ask why He did create it then? And may not the same question be asked, if the world had been created millions of years before it was? That He created in it six days, and not in an instant, is revealed; but why He did not do it in a moment, since we are sure He was able to do it, is not revealed.</p></blockquote>

<blockquote><p>Philo Judaeus, Origen, Athanasius, Hilary, Augustine, Procopius of Gaza, Arnold of Chartres, R. Moses ben Maimonides in Moreh Nebuchim, bk. 2, ch. 30, 72, Cajetan, Bodin and Melchior Canus willed that the work of creation was accomplished in a moment, not in six days, and they thought that the six-day period of Moses should be understood allegorically. To whom we oppose:

1. The history of Creation in Gen. 1:5 ff., which relates in clear words what things were created on each day.

2. The sanctification of the Sabbath, for which this reason is given, because God created the heaven and the earth in six days and rested on the seventh day; which could not be said if the work of creation had been accomplished in a moment. Nor is the contrary opinion proved from Sirach 18:1, “He that lives for ever created all things at once (κοινῇ)”; for the little word κοινῇ refers not to “created,” but to “all things,” so that the sense is that God created all things without exception, and it is a collective of all created species, not, however, of time to a moment, and is to be taken not chronologically (χρονικῶς), but as a summary (συναγωγικῶς). Whence 3. Other fathers rightly defend the six-day creation with us, e.g., Chrysostom, Basil, Nazianzen, Ambrose, Gregory; to whom 4. Almost all the Scholastics subscribe. See Becanus, Theologia Scholastica, pt. 1, tract 4, ch. 1; Boyvin, Philosophia Scoti, pt. 1, Physics, pt. 2, disp. 1, ch. 3, sect. 1, quest. 6, p. 460-61. To the question, however: “Could not at least the works of individual days have been produced in a single moment?” we respond: The works of the first creation, or the first and immediate creation, were made in a single moment and a very brief space of time. In the mediate and second creation also [through the rest of the week], the command itself or the fiat of God was accomplished in a single moment, to which the works of the subsequent days, conformably to the nature of things, some were made without delay, at least a protracted one, some with some delay, in such a way, however, that the work of each day was completed on each day. What was disputed concerning this question between Maresius and Wittich, read in Wittich, Theologia Pacifica, ch. 7, §71-73, pp. 52-53; cf. also Burmann, Synopsis Theologiae, bk. 1, ch. 42, §6.</p></blockquote>

<blockquote><p>XI. At what time of the year the world began, whether in spring or in autumn, the learned disagree:

      1. Gerardus Mercator thinks the world was created in summer time.

      2. Many fathers and scholastics contend that it was founded in spring, with whom agree; from the Jews, R. Joshua, and from the Reformed, Alsted, Polanus, Keckermann, and Braun.

      3. But the rest of the Jews commonly, and very many of the Orthodox, for example Voet, Maresius, Cocceius, Burmann, Turretin, Rijssen, Mastricht, etc., state that the world was founded in autumn; whose opinion we approve:

      1. Because the civil year of the Israelites, which was also that of the patriarchs, was begun in the month of Tishri, Ex. 23:16, where the feast of the collection of all fruits from the fields is commanded to be celebrated at the end of the year.

      2. Because in Ex. 34:22, the Feast of Tabernacles is commanded to be celebrated in the seventh month, at the revolution of the year, i.e., in the month of Tishri.

      3. Because the sabbatical and jubilee year of the Jews was celebrated in the month of Tishri, which corresponds to our September or October, Lev. 25:9.

      4. Because the Jews to this day celebrate ראש השנה (Rosh Hashanah) in the month of Tishri, and with it they begin the year, and they explode the different opinion of R. Joshua as singular.

      5. Because in Gen. 7:11, the flood is said to have occurred in the second month; which, however, was most probably done at that time of year which is suitable for inundations, so that the second month should be computed from the autumnal equinox.

      6. Because in autumn the fruits of the trees are ripe and the plants are heavy with seeds, to sustain the first parents and the animals.

      7. The Egyptians, Persians, Greeks and all the Orientals begin the year from September, which it is not to be doubted they received from tradition.

      8. Because in the Gemara, Avodah Zarah, ch. 1, it is handed down that Adam, immediately after creation was made, noticed that the days were declining and becoming shorter; which could not have happened except in the month of September. See Menasseh ben Israel, Problems, 9, Of Creation, also The Conciliator, quest. 11 in Exodus, p. 118. For the rest, just as the Jews begin the civil year in the month of Tishri, so they begin the sacred year in the month of Nisan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, On Creation, pp. 22-23 trans. AI Latin</span></figcaption>

<blockquote><p>Amazingly, there is no primary evidence to date contradicting the historical fact that the Westminster divines exclusively endored only one view, if they commented at all, in their published writings or commentaries… To summarize: There are up to 21 witnesses (the list is growing over time); there are at least 8 explicit testimonies for 24-hour days–and it is more likely that that number will increase than that other modern views will find superior support.</p></blockquote>

<blockquote><p>ch. 2, ‘While some have thought all things were simultaneously made in both matter and form, others that it was through intervals of time’ Indeed, some of the holy fathers who have excellently examined the words and mysteries of God seem to have written seemingly conflicting things on this matter. Some indeed have taught that all things were created simultaneously in both matter and form, which Augustine seems to have thought. Others, however, have more strongly proved and asserted that a raw and formless prime matter, holding a mixture and confusion of the four elements, was created; yet afterward, through the intervals of six days [intervalla sex dierum], from that matter the kinds of corporeal things were formed according to their proper species. This judgment which Gregory, Jerome, Bede and many others commend and prefer, also seems to agree more closely with the Scripture of Genesis, from which the first knowledge of this matter was revealed to us.</p></blockquote>

o%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bd85ce9c97" data-kw="">
<blockquote><p>But to the contrary: 1. First it is argued through the text of Genesis, where it is said that through the space of six days [sex dierum spatium] the Lord completed the work that was begun. Therefore it is seen that the underlying matter was not produced in perfect actuality, according to the judgment of sacred Scripture.</p></blockquote>

— Bonaventure, Commentary on 1 &amp; 2 Peter, (Florence: College of St. Bonaventura, 1882), vol. 2, bk. 2, dist. 12, art. 1, q. 2, ‘Whether the matter produced was in perfect actuality?’, p. 295">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+to+the+contrary%3A+1.+First+it+is+argued+through+the+text+of+Genesis%2C+where+it+is+said+that+through+the+space+of+six+days+%5Bsex+dierum+spatium%5D+the+Lord+completed+the+work+that+was+begun.+Therefore+it+is+seen+that+the+underlying+matter+was+not+produced+in+perfect+actuality%2C+according+to+the+judgment+of+sacred+Scripture.%E2%80%9D%0A%0A%E2%80%94+Bonaventure%2C+Commentary+on+1+%26+2+Peter%2C+%28Florence%3A+College+of+St.+Bonaventura%2C+1882%29%2C+vol.+2%2C+bk.+2%2C+dist.+12%2C+art.+1%2C+q.+2%2C+%E2%80%98Whether+the+matter+produced+was+in+perfect+actuality%3F%E2%80%99%2C+p.+295&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd85ce9c97.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/bd85ce9c97.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=But%20to%20the%20contrary%3A%201.%20First,to%20the%20judgment%20of%20sacred%20Scripture&amp;text=But%20to%20the%20contrary%3A%201.%20First%20it%20is&amp;text=actuality%2C%20according%20to%20the%20judgment%20of%20sacred%20Scripture" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e9eb27f4f1" data-kw="">
<blockquote><p>‘The first day’ Here the error of those is manifestly refuted who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God Himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, (1554 / 1563), on ch. 1, verse 5 Latin</span></figcaption>

<blockquote><p>6. God created not the world in one moment, but in the space of six days. In the seventh day God ended all his works. Objection: ‘He that lives forever’ (says the son of Sirach, Ecclesiasticus 18:1) ‘made all things together.’ Therefore He made all in one moment. Answer: He speaks not of a moment of time, but of the whole number of things: as if he should say, whatsoever are, they are all from God by creation. But the causes why God created not all in one moment, are these:

1. Because He would have the creation of the matter itself distinct and manifest from the forming, and fashioning of the bodies of the world, which consist of it.

2. Because He would show his power and liberty in producing and bringing forth whatsoever effects He could, and that without natural causes, while He yields light to the world, makes the earth fruitful, brings plants out of it, even before the sun and moon were made.

3. He would this way show his goodness and providence, whereby He cherishes his creatures, and provides for them not yet born, bringing beasts into the earth full of plants and food, and men into the world most stored and fraught with all things appertaining to the necessity and delight of life.

4. He would by that order and course of creation hold us not in an idle, but diligent consideration of his works: which also by the consecration of a Sabbath He has consecrated to all mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his lectures upon the [Heidelberg] Catechism authorized by the noble Prince Frederick, throughout his Dominions... (d. 1583; Oxford: Barnes, 1587), pt. 2, ‘Of Creation’, 2. ‘How God made the world’, p. 366</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>

</figure><figure class="quote" id="q-074219182d" data-kw="">
<blockquote><p>Seventhly, some may ask in what space did God make the world? I answer: God could have made the world and all things in it in one moment: but He began and finished the whole work in six distinct days. [This phrase is likely opposed to those in the early and Medieval Church who taught that the six days were but one day repeated six times.] In the first day He made the matter of all things and the light… and in the end of the sixth day He made man. Thus in six distinct spaces of time, the Lord did make all things: and that especially for three causes:

I. To teach men that they ought to have a distinct and serious consideration of every creature: for if God had made the world in a moment, some might have said, this work is so mystical that no man can speak of it. But for the preventing of this cavil, it was his pleasure to make the world and all things therein in six days: and the seventh day He commanded it to be sanctified by men, that they might distinctly and seriously meditate upon every work of the creation.

II. God made the world and every thing therein in six distinct days, to teach us what wonderful power and liberty He had over all his creatures: for He made the light when there was neither sun nor moon, nor stars: to show that in giving light to the world, He is not bound to the sun, to any creature or to any means: for the light was made the first day: but the sun, the moon and the stars were not created before the fourth day. Again, trees and plants were created the third day: but yet the sun, moon and the stars, and rain which nourish and make herbs, trees and plants to grow were not created till after the third day: which shows plainly that God can make trees, plants and herbs to grow without the means of rain, and without the virtue and operation of the sun, the moon and the stars.

III. He made the world in six distinct days and framed all things in this order to teach us his wonderful providence of his creatures: for before man was created He provided for him a dwelling place and all things necessary for his perpetual preservation and perfect happiness and felicity. So also He created beasts and cattle: but not before He had made herbs, plants and grass, and all means whereby they are preserved. And if God had this care over man when as yet He was not: much more will God have care over him now when he is, and has a being in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (London, 1595), pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-46682f7824" data-kw="">
<blockquote><p>The forme of Creation, to wit, of that which is primary, is both that hidden force of divine power, put into that first matter, according to the being and conditions of the same: as also the external, immediate and instant bringing forth of the matter &amp; the state thereof, without shape and order: But, of that which is secondary, the form internal is that common and hidden nature of the whole frame, which God has imprinted into all things after a common mean and manner: but the external, whereof speech is here, is that powerful bringing forth of all things, out of the first matter in the beginning of time, by the space of six days; as also the most godly disposing of the same, both in themselues and among themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, (London, 1610), bk. 2, ch. 3, Of Creation, Confirming Part, p. 104</span></figcaption>

</figure><figure class="quote" id="q-1b81e91a18" data-kw="">
<blockquote><p>Question: What is Creation? Answer: Creation is a work proper only to God, undividedly common to the Father, the Son, and to the Holy Ghost, whereby, in the beginning, and in the space of six days, God made of nothing, the heavens and earth, and all the host of them visible, and invisible, to the glory of his Name, and the use of man… Yea whereas the Lord could have made the world in an instant, it pleased Him to take six days to finish the heaven and the earth, with all the host of them, to this end (we may well suppose) that we should take good notice of the same. For this, was the Sabbath ordained, that we might preserve the memory of the Creation, and praise the Lord…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grounds of Divinity Plainly Discovering the Mysteries of Christian Religion</cite>, (London, 1614), Grounds of Divinity, pp. 73, 75-76</span></figcaption>

<blockquote><p>Sixtly, in the space of six days; not at one time only, and this showed the creatures’ disability, that could not form itself when the first matter was created. Herein also God showed his power, and that He was not tied to second causes, as he declared when He gave light to the world, while yet there was no sun. Then herein he teaches men to dwell long upon the meditation of the creation, seeing God Himself did prolong the creation for so many days, which yet He could have dispatched in an instant.</p></blockquote>

<blockquote><p>Hence we define the creation of the world as an external action of the almighty God… whereby… He founded the heavens and the earth out of nothing, at the beginning of time. And in the space of six days He arranged in their proper order all the individual things which He willed to mold from that prime matter…</p></blockquote>

</figure><figure class="quote" id="q-b5df3ae534" data-kw="">
<blockquote><p>Q. DId God create the world at the same instant, or in the space of six days? A. In the space of six days: First, because Moses’ narration is historical, and therefore he speaks of six distinct days. Secondly, Moses, Ex. 20 &amp; 31, urges the Jews to work six days and rest the seventh, because God created the world in six days and rested the seventh; this reason had been ridiculous if God had made the world in an instant. Thirdly, if we understand Moses in this place allegorically, then we must make this whole history an allegory. Fourthly, if the seventh day had been the first (and in it God had created the world), then how is it understood that God rested the seventh day? Fiftly, how could so many diverse kinds of creatures be created in the same instant of time? yea, then we must say that man was created and brought into Paradise and was cast asleep, and Eve was formed of his rib the same instant. Q. How then is that understood, Ecclesiasticus 18 [v. 1], ‘He that lives forever, created all things together’? A. It is to be understood of that confused mass that God created in the beginning: out of the which afterward He created the rest of the creatures in their distinct days. Q. Why did God spend so much time in making the world? A. Not because He was weak and could not make it in less time, but that we might the more seriously consider the order of the creation, distinction and replenishing of the world; and in these, the omnipotency, wisdom and goodness of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Fourteen First Chapters of Genesis, by way of Question &amp; Answer</cite>, … (London, 1626), Questions on the 2nd Chapter, pp. 28-29</span></figcaption>

</figure><figure class="quote" id="q-a198ed1450" data-kw="">
<blockquote><p>The creation of the world is an external, temporal, and universal action of God, by which He alone made and perfected the whole universe, by the power of His omnipotent will, in the space of six days; for His own glory, and the utility of creatures, especially intelligent ones, and the eternal salvation of the elect in heaven. … The adjunct of time is that God created the world in the space of six natural days, Gen. 2:3, Ex. 20:11. For although God could have created it in a moment, yet He willed to use these intervals: that He might more openly declare that the creation of the world was not made from eternity, but in time; and that He might render men more attentive in the particular meditation of distinct works, as appears especially from Ps. 104 &amp; 136.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-dc7a50961f" data-kw="">
<blockquote><p>The time of the creation, as here I take it in general, is not only the first moment of time, as in this [first] verse it signifies, but also the six days mentioned distinctly in the rest of the chapter. For the highest heaven, and the rude matter, the earth, were created in the first moment of time, and all other things in the space of six days, as the history most plainly teaches… …or if I incline to any opinion concerning the time of the year, it is that the world was created in the Spring, when the day and night are equal and both of one length in all the world, that is, in the month [Hebrew] Abib, which is part of March and part of April.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 1, pp. 7-8. See also p. 6 for more similar context.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The time of the creation, as here I take it in general, is not only the first moment of time, as in this [first] verse it signifies, but also the six days mentioned distinctly in the rest of the chapter. For the highest heaven, and the rude matter, the earth, were created in the first moment of time, and all other things in the space of six days, as the history most plainly teaches… …or if I incline to any opinion concerning the time of the year, it is that the world was created in the Spring, when the day and night are equal and both of one length in all the world, that is, in the month [Hebrew] Abib, which is part of March and part of April.”

<blockquote><p>The second thing which I observe from this word bereshith, ‘in the beginning’ (which signifies in this place the first being or moment of time) is this, That time itself is but an adjunct, or circumstance of things created, and had a beginning, and shall have an end with the mutable and moveable world. For proof of this we need seek no further but to the fifth verse, where it is said, ‘The evening and the morning were the first day,’ that is, time was produced by the Word of God, even the first day together with the things therein created; and so it follows of all the days of the first week, they are said to be made with the works created in them. And indeed in reason it must needs be so; because time is nothing else but the continuance of things created and the measure of the motions which are in the created world, a day is the measure of the sun’s course from East to West, and round about to the East again: An hour is the time in which the sun runs the four and twentieth part of his day’s motion: A week is the space of seven days, and a year the time which the sun goes his course through the twelve signs of the zodiak; and the whole time of the world consists of years, months and days. Now all these had a beginning, and have an end; yea, there was no day till light and darkness were made and distinguished; no month nor year till the sun and the moon were set in their course:</p></blockquote>

<blockquote><p>The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-02908a3ee6" data-kw="">
<blockquote><p>First by ‘day’ we are here [in Gen. 1:14, ‘to separate the day from the night’] to understand not the space of the sun, moon, and stars compassing the earth, which is the space of 24 hours; for that ‘day’ consists of an evening and a morning, and comprehends in it one night; and some call it a natural, and some a civil, and some an astronomical day: but here by ‘day’ we are to understand the time while the sun, the greatest light, shines and gives light upon the face of the earth: And by ‘night’ the time while the moon and stars do only appear and give their dim light upon the earth, which some call an artificial and civil day and night, but others do more properly call it a natural day, and a natural night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 9, pp. 138-39</span></figcaption>

<blockquote><p>‘the first day’ …This first day consisting of twenty four hours had (as some think) for the first half of it the precedent [preceeding] darkness, and for the other the light newly created: the night they take to be meant by evening, a part of it, and the day by the morning which is part of it also: and according to this the Sabbath (being as large a day as any of the rest, and so containing twenty four hours) is measured from even to even, Lev. 23:32; the Romans and other Western nations reckon the twenty four hours from mid-night to mid-night; the Egyptians contrariwise from mid-day to mid-day. Yet it may be with good probability thought that at the first (according to the Chaldean account, which is quite contrary to that of the Jews’ forecited, measuring the day from sunrising to sunrising) the day natural began with the light: for even is the declining light of the foregoing day; and the morning may as well be called the end of the night past, as the beginning of the day following: and so diverse of the learned by the evening understand the day, as the end thereof; and by morning the night, at which time it is at an end: for denominations are many times taken from the end, because thereby the thing is made complete: so the whole week is called by the name Sabbath, Lev. 23:15 &amp; Mt. 18:12, because with it the week is wholly made up and fully finished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-ley.html">John Ley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the books of the Old &amp; New Testament</cite>, (London: Legatt, 1645), On Genesis | on Gen., 1:5</span></figcaption>

<blockquote><p>‘And the evening’ That is, thus the first day ended with creating the light, and God forbare to create any more, until that evening was past, and the next morning came. By the ‘evening’, we must here understand the whole night, or space between the shutting in of the light and the dawning of the next day. Now Moses names the evening first, because the darkness was before the light. In the same manner runs the computation of times among the Hebrews to this day… God is here represented to us in the creation of the world proceeding by leisure, and taking the time of six days to perform that which He might have as easily dispatched in a moment of time, if He had so been pleased.</p></blockquote>

<blockquote><p>Use 1. In that God did choose to make the world in this space of time, who could as easily have made it, as well in one moment, as in six days; this should teach us to take time for meditation on his works. He that could in one instant, at one word have brought forth heaven full of stars, the air full of fowls, the water full of fishes, the earth full of beasts, creeping things, trees, etc. was pleased to make several days works of this wonderful creation, and to proceed distinctly and orderly in his work: teaching us by the manner of his working only by his Word without instruments, that he could have done all at once, which now He did at several times… …few of us could say that of all the time we have spent, ever sith-hence we had the use of our understandings, in a serious meditation on God’s works, to this end that we might glorify the Maker, would not make up one week, not one six days, not so long as the Lord was in bringing them forth. Is not this a shame for man, who was made of purpose to glorify God in his works, that he should not in all his life spend so much time in meditating on the works of God, notwithstanding his dulness and sloth of apprehension, as the Lord was pleased to take in making of them, notwithstanding his omnipotency, which could have made them all in less than one minute, as easily as in a thousand years!… And what if I should say, it were expedient herein to follow the same order in considering of the Lord’s works, as the Lord Himself did in their creation; that is, to bind ourselves to do the work of the Day in its day, namely on the same day wherein each work was done, to meditate on the work of that Day?… …the Lord has been pleased, not only to let us know how many days He spent in the creation of all the whole, but also particularly and distinctly to acquaint us with his several days’ works; telling us what He did the first Day, what he did the second Day, etc. I dare boldly say, it is expedient even to tie ourselves to set apart some time in those several days for a more special view of those several works.</p></blockquote>

</figure><figure class="quote" id="q-9f06d33a7f" data-kw="">
<blockquote><p>How long is it since God did create the world? Four thousand years before the birth of our Saviour Christ, and so about 5614 years before this time. Why is the order of the years of the world so carefully set down in the Scripture?

1. To convince all heathen that either thought that the world was without beginning, or that it began millions of years before it did.

2. To give light to all sacred histories of the Bible… … How long was God creating the world? Six days and six nights. Why was He creating so long, seeing He could have perfected all the creatures at once and in a moment? First, to show the variety, distinction and excellency of his several creatures. Secondly, to teach us the better to understand their workmanship, even as a man which will teach a child in the frame of a letter will first teach him one line of the letter, and not the whole letter together. Thirdly, to admonish us that we are bound to bestow more time in discerning and knowing them than we do. Fourthly, that we might also by his example finish our work in six days. Fifthly, that we might observe, that many of the creatures were made before those which are ordinarily their causes, and thereby learn, that the Lord is not bound to any creature, or to any means: thus the sun was not created before the fourth day, and yet days which now are caused by the rising of the sun were before that; so trees and plants were created the third day, but the sun, moon and stars, by which they are now nourished and made to grow, were not created till after the third day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, ... (1645), A Large Explication of the Body of Christian Religion, pp. 96-97</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>God could have created them all at once, but He made them in the space of six days,¹ that He might show… ¹ That opinion of Augustine, that God made all things in a moment and distributed them into days because of our better understanding, is exploded by all. Although Creation was done in a moment, in respect of the particular bodies severally considered, yet in respect of all, it was not perfected in an instant, but in the space of six days; which spaces of days, note not a temporal succession of the same, but the order of diverse works. Some allege [against this the singular word ‘day’ in] Gen. 2:4, but it is not unusual in the Scripture to comprehend many days under the name of one. See Aquinas, [Summa] pt. 1, quest. 74, art. 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: 1654), bk. 3, ch. 2, p. 229</span></figcaption>

</figure><figure class="quote" id="q-6ac0ce38d8" data-kw="">
<blockquote><p>But that this world should be made at such a time, and at first of no pre-existent matter, and in the space of six days, and in that order one part after another, and by the Word of God as the sole efficient, and so many years ago, is far above reason.</p></blockquote>

</figure><figure class="quote" id="q-f14b20fcab" data-kw="">
<blockquote><p>‘My Father worketh hitherto, etc.’ God having finished that work of Creation in the space of six days, rested from that work on the seventh day; but from the work of his providence, and governing the things He has made, He never rested one day from the Creation of the world. In six days the Creation of the world was finished, but the government thereof is perpetual, and God continually works in preserving and maintaining the order thereof, even as the apostle says…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Eye &amp; Wheel of Providence</cite>, (London: Tyton, 1662), ch. 1, pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-3674505d20" data-kw="">
<blockquote><p>Now you are to meditate how God brought forth all his works in the space of six days, before He finished them; He did not create the world all at once, but took time for the creation of it, to teach us to take special time duly and orderly to consider and meditate on the works of God: if He that could have made the Heavens and the earth, the sun, moon and stars, and all creatures, in a moment; yet it pleased Him to take time for the creating of them; this should teach us to select some space of time for the meditation of them: We must not think it enough to look upon them at one view, but to pass from part to part, from one creature to another, and in every creature to admire the workmanship, power, wisdom and goodness of the Creator, as we are taught, Ps. 92:4-5… which psalm as the title tells us, was a meditation penned for the Sabbath day: therefore I say, God would spend six days about the creation of the world, whereas He might have done it in an instant, and in a moment of time, to the end that we might the better meditate upon it from point to point, for which purpose He presently ordained the Sabbath… The eternal power and Godhead is seen by the things that are made; but most of us have great cause to be ashamed, that we have spent so little time in meditating on the works of God; yea who can truly say he has spent so much time in meditating on God’s works as God spent in making them? How few are there that have set apart so much time ever since they were born, as (if it were all laid together) will make up six days one entire week? What a shame is it for man whom God made on purpose to view his works, and by them to glorify Him, not to spend so much time in meditating upon them as God spent in making of them;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mount of Holy Meditation: or a Treatise</cite>, … (London: Tyton, 1662), ch. 8, pp. 54-56</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now you are to meditate how God brought forth all his works in the space of six days, before He finished them; He did not create the world all at once, but took time for the creation of it, to teach us to take special time duly and orderly to consider and meditate on the works of God: if He that could have made the Heavens and the earth, the sun, moon and stars, and all creatures, in a moment; yet it pleased Him to take time for the creating of them; this should teach us to select some space of time for the meditation of them: We must not think it enough to look upon them at one view, but to pass from part to part, from one creature to another, and in every creature to admire the workmanship, power, wisdom and goodness of the Creator, as we are taught, Ps. 92:4-5… which psalm as the title tells us, was a meditation penned for the Sabbath day: therefore I say, God would spend six days about the creation of the world, whereas He might have done it in an instant, and in a moment of time, to the end that we might the better meditate upon it from point to point, for which purpose He presently ordained the Sabbath… The eternal power and Godhead is seen by the things that are made; but most of us have great cause to be ashamed, that we have spent so little time in meditating on the works of God; yea who can truly say he has spent so much time in meditating on God’s works as God spent in making them? How few are there that have set apart so much time ever since they were born, as (if it were all laid together) will make up six days one entire week? What a shame is it for man whom God made on purpose to view his works, and by them to glorify Him, not to spend so much time in meditating upon them as God spent in making of them;”

<blockquote><p>The time of their [the devils’] standing in their primitive state is conceived to be very short; for their creation (though the Socinians hold it was long before) must fall within the compass of six days, for in that space the Scripture tells us God made heaven and earth, and all things therein: and therefore within the space of six days He created the angels also. Some refer their creation to the first day’s work, others to the fourth day: and it’s probably thought that Adam’s continuance in innocency was not much above one day, and yet even then there were fallen Angels to tempt him: so that their glorious and blessed state could not, according to the computation, last above six or seven days, such a speedy issue did God make with them upon their very first sin…</p></blockquote>

</figure><figure class="quote" id="q-b02372010d" data-kw="">
<blockquote><p>2 Pet. 3:8, ‘One day is with the Lord as a thousand years, and a thousand years as one day.’ When he says, ‘a thousand years’, he means all years, all time put together, is but as one day to the Lord. A day was the first distinction of time; the first perfect time that was created, was a day: now put a thousand years together, it is but as one day to the Lord; All times and one time are all one to him who inhabits eternity. In Ps. 90:6, it is, a thousand years are but as yesterday, which notes all time past, as Peter notes, all time to come, is, but as one day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, (London, 1647), on ch. 9:3, pp. 151</span></figcaption>

</figure><figure class="quote" id="q-c9b63a1088" data-kw="">
<blockquote><p>…Though the general time which they fulfil may be known, or is known and set down by writers, yet the precise particular time, the day of the month, or hour of the day, or (which is the thing inquired) when their months come out and are fulfilled, that’s a secret. Though it be commonly known that a woman goes nine months with child… I may say in this case, as our Lord Jesus Christ said about the end of the world, ‘Of that day and hour knows no man,’ we may know the general time, we may know it will not be long before the world shall end. The time which the world shall go with its great birth is commonly said to be six thousand years; but the day and hour of its travel, and of the consummation of all things according to the decree of God, no man, no nor angel, knows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, (London, 1666), on ch. 39, vv. 1-4, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1072d9342b" data-kw="">
<blockquote><p>Of all the creatures in it, it may be truly said that they are but of yesterday, Job. 8:9, if we measure them according to God’s (that is according to the true) account, to whom a thousand years are but as yesterday, Ps. 90:4, in which estimation the world is not yet six days old… What are five or six thousand years to eternity? which God enjoys, who is from everlasting to everlasting, Ps. 90:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, (d. 1648; London, 1656), on 1:1, sect. 3, p. 7</span></figcaption>

</figure><figure class="quote" id="q-e60a53b20b" data-kw="">
<blockquote><p>Even though Calvin, Ames, and the authors of the Westminster Standards, with few exceptions, if any, undoubtedly understood the days to be ordinary days, there is no ground for supposing that they intended to exclude any and all other views, in particular the view that the days may be longer. Such views are outside their purview; their concern, in fact, moves in the opposite direction, against the instantaneous view that denies any length. This point bears emphasizing within the context of the current debate about the days of Genesis. To establish that the Standards mandate the six 24 hour days view requires more than demonstrating that the Divines, perhaps even to a man, held that the days were ordinary days. To demonstrate that of itself establishes nothing. What needs also to be shown, which we believe cannot be shown, is that they intended to exclude the views that the days are longer in some respect or that they represent a literary framework.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/westminster-theological-seminary-east-faculty.html">Westminster Theological Seminary, East, Faculty</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Theological Seminary &amp; the Days of Creation</cite>, (1999), p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/creation/the-six-days.html">The Six Days</a></span></div>

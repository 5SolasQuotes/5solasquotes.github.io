</figure><figure class="quote" id="q-e9f4985e54" data-kw="">
<blockquote><p>(1) Before the Westminster Assembly there were a variety of interpretations of Genesis 1 and its days. If the text of Genesis is so clear-cut why did the church down the centuries not see it that way? Does that not say something not only about the interpreters but also the text? Claims that a literal reading of the days of Genesis 1 is obvious fall down when the history of interpretation is taken into consideration. (2) We will be wise to heed the warnings Augustine and Calvin give on the difficulty of interpreting this chapter, and so beware of dogmatic claims they themselves did not advance. Jerome pointed to the Jewish rabbis’ refusal to let anyone under thirty interpret it. Creation transcends our knowledge and experience. A heavy dose of medicine from Job 38:1ff is in order. As with any other passage, Genesis 1 must not be interpreted in isolation but in the context of the whole of Scripture. (3) Until the mid-sixteenth century the interpreters we cited were all abreast of the philosophy and science of their day, and often made use of it in biblical interpretation. That we reject many of their scientific beliefs is because of our own scientific knowledge. That we place implicit faith in the laws of gravity is due to what we know scientifically, rather than from the Bible. So far I, for one, have found this reliable! Calvin allows and supports scientific work. He indicates Genesis is of a different literary genre than a science text book. (4) The Reformed tradition of the sixteenth century interpreted creation theologically. The classic Reformed creeds consider it in the context of the doctrine of God, as an ex nihilo work of the Trinity. In so doing, they affirm their continuity with the historic teaching of the church. The question of the days of creation was not even a matter of discussion… Its absence is striking. It was never a matter of confessional significance…</p></blockquote>

</figure><figure class="quote" id="q-4f51c148d1" data-kw="">
<blockquote><p>The charges I have still to mention are of minor importance. The first of them is the assertion, so often and confidently propounded of late, that the Confession represents the creation of the world as having taken place in six ‘natural or literal days,’ which almost all orthodox divines now grant that it did not. But the whole ground for the assertion is furnished by the words ‘natural or literal’ which the objectors themselves insert or assume. The authors of the Confession, as Dr. A. A. Hodge has well observed (Commentary on the Confession of Faith, p. 82), simply repeat the statements of Scripture in almost identical terms, and any interpretation that is fairly applicable to such passages of Scripture as Gen. 2:3 and Exodus 20:2, is equally applicable to the words of the Confession. It is quite true, as he has shown, that since the Confession was composed, many facts of science previously unknown have been brought to light respecting the changes through which our globe and probably the stellar universe had passed before the establishment of the present order of things, and that new arguments have thus been furnished against interpreting the days mentioned in the above passages of Scripture as literal days. But it is a mistake to suppose that this method of interpreting the days in these passages originated in modern times, and was altogether unknown to the men who framed our Confession. To prove it a mistake it is not necessary to have recourse to the ingenious conjecture that some of the Cambridge men in the Assembly may have been acquainted with the manuscript work of Dean [John] Colet [d. 1519], preserved in their archives, and only given to the public in our own time, in which the figurative interpretation of the days of creation is maintained.¹ ¹ Colet’s Letters to Radulpluis oit the Mosaic Account of the Creation, with translation and notes by J. H. Lupton. 1876 [pp. 3-28]. There is no lack of evidence, in works published before the meeting of the Assembly, and familiar to several of its members, to show that the figurative interpretation had long before Dean Colet’s time commended itself to several eminent scholars and divines with whose works members of the Assembly were acquainted. If there was one Jewish scholar with whose writings such men as Lightfoot, Selden, Gataker, Seaman, and Coleman were more familiar than another, it was Philo of Alexandria [d. c. 50]; and Philo has not hesitated to characterise it as ‘rustic simplicity, to imagine that the world was created in six days, or, indeed, in any clearly defined space of time.’ Augustine,² the great Latin doctor, with whose works several of the Westminster divines were far better acquainted than most of their successors, in his Literal Commentary on Genesis, maintains that the days of the creation-week were far different from (longe dispares), and again, very unlike to (multum impares) those that now are in the earth. ² Migne’s edition of Augustine, De Genesi ad literam, iv.27. Procopius [d. 565], a Greek writer not unknown to some of the Westminster divines, teaches that the number of six days was assumed not as a mark of actual time, but as a manner of teaching the order of creation; while in certain commentaries in that age, attributed to the Venerable Bede [d. 735], and largely read in England, though now deemed spurious, a similar opinion is said to be found.³ ³ Most of these testimonies are referred to, and the opinion they express is admitted to be probabilis [probable], in the sense his sect used that term, by Sixtus Senensis [a Romanist, d. 1569] in his Bibliotheca Sancta, p. 422. The figurative interpretation therefore of the six days of creation is no make-shift of hard-pressed theologians in the nineteenth century. It was held by respectable scholars and divines, from early times, and was known to the framers of our Confession; and had they meant deliberately to exclude it they would have written not six days, but six natural or literal days.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The charges I have still to mention are of minor importance. The first of them is the assertion, so often and confidently propounded of late, that the Confession represents the creation of the world as having taken place in six ‘natural or literal days,’ which almost all orthodox divines now grant that it did not. But the whole ground for the assertion is furnished by the words ‘natural or literal’ which the objectors themselves insert or assume. The authors of the Confession, as Dr. A. A. Hodge has well observed (Commentary on the Confession of Faith, p. 82), simply repeat the statements of Scripture in almost identical terms, and any interpretation that is fairly applicable to such passages of Scripture as Gen. 2:3 and Exodus 20:2, is equally applicable to the words of the Confession. It is quite true, as he has shown, that since the Confession was composed, many facts of science previously unknown have been brought to light respecting the changes through which our globe and probably the stellar universe had passed before the establishment of the present order of things, and that new arguments have thus been furnished against interpreting the days mentioned in the above passages of Scripture as literal days. But it is a mistake to suppose that this method of interpreting the days in these passages originated in modern times, and was altogether unknown to the men who framed our Confession. To prove it a mistake it is not necessary to have recourse to the ingenious conjecture that some of the Cambridge men in the Assembly may have been acquainted with the manuscript work of Dean [John] Colet [d. 1519], preserved in their archives, and only given to the public in our own time, in which the figurative interpretation of the days of creation is maintained.¹ ¹ Colet’s Letters to Radulpluis oit the Mosaic Account of the Creation, with translation and notes by J. H. Lupton. 1876 [pp. 3-28]. There is no lack of evidence, in works published before the meeting of the Assembly, and familiar to several of its members, to show that the figurative interpretation had long before Dean Colet’s time commended itself to several eminent scholars and divines with whose works members of the Assembly were acquainted. If there was one Jewish scholar with whose writings such men as Lightfoot, Selden, Gataker, Seaman, and Coleman were more familiar than another, it was Philo of Alexandria [d. c. 50]; and Philo has not hesitated to characterise it as ‘rustic simplicity, to imagine that the world was created in six days, or, indeed, in any clearly defined space of time.’ Augustine,² the great Latin doctor, with whose works several of the Westminster divines were far better acquainted than most of their successors, in his Literal Commentary on Genesis, maintains that the days of the creation-week were far different from (longe dispares), and again, very unlike to (multum impares) those that now are in the earth. ² Migne’s edition of Augustine, De Genesi ad literam, iv.27. Procopius [d. 565], a Greek writer not unknown to some of the Westminster divines, teaches that the number of six days was assumed not as a mark of actual time, but as a manner of teaching the order of creation; while in certain commentaries in that age, attributed to the Venerable Bede [d. 735], and largely read in England, though now deemed spurious, a similar opinion is said to be found.³ ³ Most of these testimonies are referred to, and the opinion they express is admitted to be probabilis [probable], in the sense his sect used that term, by Sixtus Senensis [a Romanist, d. 1569] in his Bibliotheca Sancta, p. 422. The figurative interpretation therefore of the six days of creation is no make-shift of hard-pressed theologians in the nineteenth century. It was held by respectable scholars and divines, from early times, and was known to the framers of our Confession; and had they meant deliberately to exclude it they would have written not six days, but six natural or literal days.”

the+days+of+creation+is+maintained.%C2%B9+%C2%B9+Colet%E2%80%99s+Letters+to+Radulpluis+oit+the+Mosaic+Account+of+the+Creation%2C+with+translation+and+notes+by+J.+H.+Lupton.+1876+%5Bpp.+3-28%5D.+There+is+no+lack+of+evidence%2C+in+works+published+before+the+meeting+of+the+Assembly%2C+and+familiar+to+several+of+its+members%2C+to+show+that+the+figurative+interpretation+had+long+before+Dean+Colet%E2%80%99s+time+commended+itself+to+several+eminent+scholars+and+divines+with+whose+works+members+of+the+Assembly+were+acquainted.+If+there+was+one+Jewish+scholar+with+whose+writings+such+men+as+Lightfoot%2C+Selden%2C+Gataker%2C+Seaman%2C+and+Coleman+were+more+familiar+than+another%2C+it+was+Philo+of+Alexandria+%5Bd.+c.+50%5D%3B+and+Philo+has+not+hesitated+to+characterise+it+as+%E2%80%98rustic+simplicity%2C+to+imagine+that+the+world+was+created+in+six+days%2C+or%2C+indeed%2C+in+any+clearly+defined+space+of+time.%E2%80%99+Augustine%2C%C2%B2+the+great+Latin+doctor%2C+with+whose+works+several+of+the+Westminster+divines+were+far+better+acquainted+than+most+of+their+successors%2C+in+his+Literal+Commentary+on+Genesis%2C+maintains+that+the+days+of+the+creation-week+were+far+different+from+%28longe+dispares%29%2C+and+again%2C+very+unlike+to+%28multum+impares%29+those+that+now+are+in+the+earth.+%C2%B2+Migne%E2%80%99s+edition+of+Augustine%2C+De+Genesi+ad+literam%2C+iv.27.+Procopius+%5Bd.+565%5D%2C+a+Greek+writer+not+unknown+to+some+of+the+Westminster+divines%2C+teaches+that+the+number+of+six+days+was+assumed+not+as+a+mark+of+actual+time%2C+but+as+a+manner+of+teaching+the+order+of+creation%3B+while+in+certain+commentaries+in+that+age%2C+attributed+to+the+Venerable+Bede+%5Bd.+735%5D%2C+and+largely+read+in+England%2C+though+now+deemed+spurious%2C+a+similar+opinion+is+said+to+be+found.%C2%B3+%C2%B3+Most+of+these+testimonies+are+referred+to%2C+and+the+opinion+they+express+is+admitted+to+be+probabilis+%5Bprobable%5D%2C+in+the+sense+his+sect+used+that+term%2C+by+Sixtus+Senensis+%5Ba+Romanist%2C+d.+1569%5D+in+his+Bibliotheca+Sancta%2C+p.+422.+The+figurative+interpretation+therefore+of+the+six+days+of+creation+is+no+make-shift+of+hard-pressed+theologians+in+the+nineteenth+century.+It+was+held+by+respectable+scholars+and+divines%2C+from+early+times%2C+and+was+known+to+the+framers+of+our+Confession%3B+and+had+they+meant+deliberately+to+exclude+it+they+would+have+written+not+six+days%2C+but+six+natural+or+literal+days.%E2%80%9D%0A%0A%E2%80%94+Alexander+Mitchell%2C+The+Westminster+Assembly%3A+Its+History+%26+Standards%2C+%281884%29%2C+pp.+394-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f51c148d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4f51c148d1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=The%20charges%20I%20have%20still%20to,but%20six%20natural%20or%20literal%20days&amp;text=The%20charges%20I%20have%20still%20to%20mention%20are&amp;text=six%20days%2C%20but%20six%20natural%20or%20literal%20days" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>30. To what is appeal made to support the nonliteral interpretation? a) To the fact that sun and moon (or rather the rotation of the earth around its axis in relation to the sun) were not yet present. As we know, the length of an ordinary day is determined by this rotation. b) To the indefinite use of the term “day” in other places in Scripture (Gen 2:4; 5:1; 2 Sam 21:12; Isa 11:16), also to the expression “day of the Lord” (= day of judgment) in the prophets, and to Psa 90:4; 2 Pet 3:8. c) To the analogy with other things of God. Here we have to do with God’s days. Now the “things of God” are certainly archetypical (exemplars) for the things of men, but they are not completely identical. Thus we have no right, it is thought, to judge that God‘s days are like the days of men. d) To the fact that the duration of God‘s Sabbath is eternal. That is one of the days here, the seventh day. If the seventh day is not limited to 24 hours, then the six previous days need not be limited to that time span. On these grounds many, including those who are not intent on a reconciliation of the Scripture with science, accept an extraordinary length for the creation days. This includes many church fathers and theologians of the Middle Ages, and, among more recent theologians, even Charles Hodge inclines to this view.

31. What supports the interpretation that takes “day” in its ordinary meaning? a) The entire creation aimed at man as its completion. It is difficult to accept that preparing for this goal took thousands of years. b) All the creation days must have been of the same length. Who can accept, however, that a day on which nothing else occurred than the separation between light and darkness was a day of thousands of years? c) The fact that the sun and moon, as measures of time, were not present, does not mean that there was no time. Already from the beginning God ordained a rhythm and created the light so that it would alternate with the darkness. When later this light was concentrated in the sun and the other bodies, we are told nothing about it being only then that the 24-hour day began. There was no change at that point. Therefore we have a reason for assuming that before that time the rotation of the earth took place at the same speed and that light was so positioned as was necessary for an alternation of day and night within 24 hours. d) From v. 14 on the days are unquestionably ordinary days of 24 hours. There God says emphatically of the lights in the expanse that they will be “for days and years.” One might rescue the nonliteral view by assuming for the fourth to the sixth days an extremely slow rotation of the earth about its axis, but what about plant life during those long nights? The night has to have been half of the full day. e) It is not accurate to say that the days are God‘s days. God ad intra does not have days. Creation is an act proceeding outwardly from God. Appealing to the eternal Sabbath is also of no avail. Although God’s Sabbath is certainly endless, that cannot be said of the first Sabbath (after the six-day creation) for mankind. f) The use of the term “day” in Gen 9:4 is figurative, but in Gen 1 figurative language is not used. What one must show is another place in Scripture where a first, a second, a third day, etc., are just as sharply separated and nevertheless describe periods of time. The “day of the Lord” in the prophets refers to a specific day, that is, a day on which the Lord appears for judgment, even though His judgment may last longer than one day.

32. Must someone who holds that the days are long time periods be regarded a heretic? No, in this sense the question is not an essential one. It would only become so if it provided the occasion for granting priority in principle over the Word of God to the so-called results of science.</p></blockquote>

<blockquote><p>Creation is a work of God, by which he has brought forth all creatures of nothing (Gen 1.2) A creature is whatsoever has been made by God of nothing. Now all the creatures of God were created very good. Therefore all nature, as it is nature, is good because it is the work of God. Of these creatures some are created according to the image of God; some are not. The image of God is that dignity and excellency in which the reasonable creatures, begin created like unto God, do excel other creatures. Of this image of God there are two parts: perfect reason and perfect blessedness. Perfect reason is is a part of God’s image, by which the reasonable creature does more expressly carry the image of God his creator, while by a certain divine force it knows plainly things without error, as they are, and does will and choose no other tuning that which does please God. And that perfect reason consists both in the mind and in the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Partitiones theologiae translated as The Substance of the Christian Religion</cite>, (London, 1595). Spelling modernized.</span></figcaption>

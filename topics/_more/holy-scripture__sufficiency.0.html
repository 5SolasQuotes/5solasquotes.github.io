<figure class="quote" id="q-a5e47f2ad0" data-kw="">

</figure><figure class="quote" id="q-0304106b4d" data-kw="">
<blockquote><p>It will be your duty, however, to adduce your proofs out of the Scriptures as plainly as we do, when we prove that He made His Word a Son to Himself. . . . All the Scriptures attest the clear existence of, and distinction in (the Persons of) the Trinity, and indeed furnish us with our Rule of faith.</p></blockquote>

</figure><figure class="quote" id="q-615059786d" data-kw="">
<blockquote><p>There is, brethren, one God, the knowledge of whom we gain from the Holy Scriptures, and from no other source. For just as a man if he wishes to be skilled in the wisdom of this world will find himself unable to get at it in any other way than by mastering the dogmas of philosophers, so all of us who wish to practice piety will be unable to learn its practice from any quarter than the oracles of God. Whatever things then the Holy Scriptures declare, at these let us look; and whatsoever things they teach these let us learn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hippolytus.html">Hippolytus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 9</span></figcaption>

<blockquote><p>The Papists’ confession of the sufficiency of our Belief: Council of Basil, Oration of Ragus., Bin. p. 299: ‘The holy Scripture in the literal sense, soundly and well understood, is the infallible and most sufficient rule of faith.’ Bellarmine, Of the Word of God, bk. 4, ch. 11 ‘In the Christian doctrine both of Faith and manners, some things are simply necessary to salvation, to all, as the knowledge of the articles of the Apostles’ Creed, of the Ten Commandments and of some sacraments: The rest are not so necessary that a man cannot be saved without the explicit knowledge, belief and profession of them—These things that are simply necessary, and are profitable to all, the apostles preached to all— All things are written by the apostles which are necessary to all, and which they openly preached to all.’ (See the place.) Costenus, Enchiridion, ch. 1, p. 49 ‘Non inficiamur praecipua illa fidei capita quae omnibus Christians cognitu sunt ad salutem necessaria, perspicue satis esse apostolicis scriptis comprehensa.’ [We do not deny that those principal articles of faith which all Christians know and which are necessary for salvation are set forth quite clearly enough in the apostolic writings.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief</cite>, ... (London: 1660), ‘To fill up this vacant page’</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

</figure><figure class="quote" id="q-2080b22833" data-kw="">
<blockquote><p>Let us give place and consent to the Holy Scripture (says St. Augustine) for it can neither deceive nor be deceived. The bishops also and clergy of England in the epistle of their book to the King’s grace (De peccatorum meritis et remissione, ch. 22) do affirm that holy Scripture alone shows men the right path to come to God to see Him, to know Him, to love Him, to serve Him and so to serve Him as He most desires. Wherefore they are rather obstinate against God, which instead of his only Word, preach and teach other doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/miles-coverdale.html">Miles Coverdale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Confutation of that Treatise which one John Standish made against the protestation of D. Barnes in the year 1540. Wherein the holy scriptures</cite>, (perverted and wrested in his said treatise) are restored to their own true understanding again… ([Zurich: C. Froschauer, 1541?]), Confutation, Protestation of S. Robert Barnes, no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

>
</figure><figure class="quote" id="q-68759469ef" data-kw="">
<blockquote><p>For he that is nether hot nor cold, but indifferent to use the college of God’s Word and Christ’s Church, with the word and gloss of man that teaches the use of images in the church, before he can prove by authority of God’s Word that they may be suffered in the church does not well, they have been the occasion of great hurt and idololatry the church of the Old Testament nor the New never taught the people with images. Therefore it shall be the office of every man that loves God and his Word to follow the Scripture only.</p></blockquote>

<blockquote><p>Now I find that Mr. [Richard ]Hooker [an Anglican] says two things to this: 1. That Scripture does regulate all our moral actions, but not scripture only, for the Law of nature and the most concealed instincts of nature, and other principles may warrant our actions: We move (says he), we sleep, we take the cup at the hand of our friend; a number of things we often do only to satisfy some natural desire without present express and actual reference to any commandment of God, unto his glory; even these things are done which we naturally perform, and not only that which naturally and spiritually we do, for by every effect proceeding from the most concealed instincts of nature, his power is made manifest. But it does not therefore follow, that of necessity we shall sin unless we expressly intend the glory of God in every such particular. [Rutherford’s] Answer: …I answer that as: [1.] there be some actions in man purely and spiritually, but supernaturally, moral, as to believe in Christ for remission of sins, to love God in Christ: these the Gospel does regulate. 2. There be some actions naturally moral in the substance of the act, as many things commanded and forbidden in the Moral Law; and these are to be regulated by the Law of nature and the Moral Law: 3. There be some actions mixed, as such actions in which nature, or concealed instincts of nature are the chief principles, yet in and about these actions, as in their modification of time, place, and manner and measure, there is a special morality, in regard of which they are to be ruled by the Word; Such mixed actions as these that are mentioned by Hooker, as to move, sleep, take the cup at the hand of a friend, cannot be called simply moral, for to move may be purely natural, as if a man against his will fall off a high place or off a horse, to start in the sleep, are so natural that I know not any morality in them; but sure I am [that] for Nathaniel to come to Christ, which was also done by a natural motion, is not a mere natural action proceeding from the most concealed instincts of nature; so to sleep has somewhat natural in it, for beasts do sleep; beasts do move; I grant they cannot take a cup at the hand of a friend, they cannot salute one another: (It is Hooker’s instance) but fancy sometimes in men do these, whereas conscience should do them: What is natural in moving and sleeping, and what is common to men with beasts, I grant, Scripture does not direct or regulate these acts of moving and sleeping; we grant [that] actions natural and common to us with beasts need not the rule of the Word to regulate them: But this I must say (I speak it, my record is in Heaven, not to offend any) Formalists, as such, and as Prelatical, are irreligious and profane: One of them asked a godly man, ‘Will you have Scripture for giving your horse a peck of oats, and for breaking wind, and easing or obeying nature?’ And therefore they bring in these instances to make sport: But I conceive, sleeping moderately, to enable you to the service of God, as eating, drinking, that God may be glorified, 1 Cor. 10:31, are also in the measure and manner of doing moral, and so ruled by Scripture and Scripture only, and not regulated by natural instincts… Whereas being created according to God’s image, especially, he living in the visible Church, he is to do all his actions deliberate, even natural and moral in Faith, and with a warrant from scripture, to make good their morality, Ps. 119:9; Prov. 3:23-24; 2 Cor. 5:7. And truly Formalists give men in their morals to live at random and to walk without taking heed to their ways according to God’s Word. … Answer: 1. The Law of reason in morals (for of such we now speak) is nothing but the Moral Law and will of God, contained fully in the Scriptures of the Old and New Testament; and therefore is not to be divided from the Scriptures; if a man be ruled in that, he is ruled by Scripture: for a great part of the Bible, of the Decalogue, is printed in the reasonable soul of man: as when he loves his parents, obeys his superiors, saves his neighbor in extreme danger of death, because he does these according to the Law of Reason, shall it follow that these actions which are expressly called [in Greek] Rom. 2:14, the things or duties of the Law, are not warranted by express Scripture because they are done according to the Law of natural reason? I should think the contrary most true.</p></blockquote>

<blockquote><p>II. Those give too much (in bulk, but too little in virtue) to the Scriptures: 1. Who would set them up instead of the whole Law, and Light of Nature, as excluding this, as useless where the Scripture is. 2. And they that feign it to be instead of all grammars, logic, philosophy, and all other arts and sciences, and to be a perfect particular rule for every ruler, lawyer, physician, mariner, architect, husbandman and tradesman, to do his work by. 3. And they that feign it to be fully sufficient to all men to prove its own authority and truth, without the subsidiary use of that Church-history and tradition, which tells us the supposed matters of fact and must help us to know what books are canonical and what not; and without historical evidence that these are the true books which the prophets and apostles wrote and the miracles and providences which have attested them. 4. And those that think that it is sufficient for its own promulgation, or the peoples instruction, without the ministry of man to preserve, deliver, translate, expound and preach it to the people. 5. And those that think it sufficient to sanctify men, without the concourse of the Spirit’s illumination, vivification and inward operation to that end. 6. And they that say that no man can be saved by the knowledge, belief, love and practice of all the substantial parts of Christianity brought to him by tradition, parents or preachers, who tell him nothing of the Scriptures, but deliver him the doctrines as attested by miracles and the Spirit without any notice of the Book. 7. And those that say that Scripture alone must be made use of as to all the history of Scripture-times, and that it is unlawful to make use of any other historians, (as Josephus and such others). 8. And they that say, no other books of divinity but Scripture are useful, yea, or lawful to be read of Christians; or at least in the Church. 9. And they that say that the Scriptures are so divine, not only in matter, but in method and style, as that there is nothing of human (inculpable [blameless]) imperfection or weakness in them. 10. And those that say that the logical method and the phrase is as perfect as God was able to make them. 11. And they that say that all passages in Scripture historically related are moral truths: and so make the Devil’s words to Eve, of Job, to Christ, etc. to be all true. 12. And they that say that all passages in the Scripture were equally obligatory to all other places and ages, as to those that first received them (as the kiss of peace, the veils of women, washing feet, anointing the sick, deaconesses, etc.) 13. And they that make Scripture so perfect a rule to our belief that nothing is to be taken for certain, that comes to us any other way (as natural knowledge or historical). 14. And those that think men may not translate the Scripture, turn the Psalms into metre, tune them, divide the Scripture into chapters and verses, etc. as being derogatory alterations of the perfect Word. 15. And those that think it so perfect a particular rule of all the circumstances, modes, adjuncts and external expressions of and in God’s worship, as that no such may be invented or added by man, that is not there prescribed: as time, place, vesture [clothing, such as a grave garment], gesture, utensils, methods, words, and many other things, mentioned before. 16. And those that Jewishly feign a multitude of unproved mysteries to lie in the letters, orders, numbers and proper names in Scriptures (though I deny not that there is much mystery which we little observe). 17. They that say that the Scripture is all so plain that there is no obscure or difficult passages in them, which men are in danger of wresting to their own destruction. 18. And they that say that all in the Scripture is so necessary to salvation (even the darkest prophecies) that they cannot be saved that understand them not all; or at least endeavor not studiously and particularly to understand them. 19. And they that say that every book and text must of necessity to salvation be believed to be canonical and true. 20. And those that say that God has so preserved the Scripture, as that there are no various readings and doubtful texts thereupon, and that no written or printed copies have been corrupted (when Dr. Heylin tells us that the King’s printer printed the Seventh Commandment, ‘Thou shalt commit adultery’); all these err in over-doing. … IV. The dangers of over-doing here are these: 1. It leads to downright infidelity: for when men find that the Scripture is imperfect or wanting in that which they fancy to be part of its perfection, and to be really insufficient, e.g. to teach men physics, logic, medicine, languages, etc. they will be apt to say, ‘It is not of God, because it has not that which it pretends to have.’ 2. God is made the author of defects and imperfections. 3. The Scripture is exposed to the scorn and confutation of infidels. 4. Papists are assisted in proving its imperfection. But I must stop, having spoke to this point before in Question 35 and partly Question 30 &amp; 31 &amp; 33 more at large.</p></blockquote>

rticularly to understand them. 19. And they that say that every book and text must of necessity to salvation be believed to be canonical and true. 20. And those that say that God has so preserved the Scripture, as that there are no various readings and doubtful texts thereupon, and that no written or printed copies have been corrupted (when Dr. Heylin tells us that the King’s printer printed the Seventh Commandment, ‘Thou shalt commit adultery’); all these err in over-doing. … IV. The dangers of over-doing here are these: 1. It leads to downright infidelity: for when men find that the Scripture is imperfect or wanting in that which they fancy to be part of its perfection, and to be really insufficient, e.g. to teach men physics, logic, medicine, languages, etc. they will be apt to say, ‘It is not of God, because it has not that which it pretends to have.’ 2. God is made the author of defects and imperfections. 3. The Scripture is exposed to the scorn and confutation of infidels. 4. Papists are assisted in proving its imperfection. But I must stop, having spoke to this point before in Question 35 and partly Question 30 &amp; 31 &amp; 33 more at large.”

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, ... (1673), Part 3, Question 166, ‘Who be they that give too little to the Scriptures, and who too much; and what is the danger of each extreme?’, pp. 912-13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+Those+give+too+much+%28in+bulk%2C+but+too+little+in+virtue%29+to+the+Scriptures%3A+1.+Who+would+set+them+up+instead+of+the+whole+Law%2C+and+Light+of+Nature%2C+as+excluding+this%2C+as+useless+where+the+Scripture+is.+2.+And+they+that+feign+it+to+be+instead+of+all+grammars%2C+logic%2C+philosophy%2C+and+all+other+arts+and+sciences%2C+and+to+be+a+perfect+particular+rule+for+every+ruler%2C+lawyer%2C+physician%2C+mariner%2C+architect%2C+husbandman+and+tradesman%2C+to+do+his+work+by.+3.+And+they+that+feign+it+to+be+fully+sufficient+to+all+men+to+prove+its+own+authority+and+truth%2C+without+the+subsidiary+use+of+that+Church-history+and+tradition%2C+which+tells+us+the+supposed+matters+of+fact+and+must+help+us+to+know+what+books+are+canonical+and+what+not%3B+and+without+historical+evidence+that+these+are+the+true+books+which+the+prophets+and+apostles+wrote+and+the+miracles+and+providences+which+have+attested+them.+4.+And+those+that+think+that+it+is+sufficient+for+its+own+promulgation%2C+or+the+peoples+instruction%2C+without+the+ministry+of+man+to+preserve%2C+deliver%2C+translate%2C+expound+and+preach+it+to+the+people.+5.+And+those+that+think+it+sufficient+to+sanctify+men%2C+without+the+concourse+of+the+Spirit%E2%80%99s+illumination%2C+vivification+and+inward+operation+to+that+end.+6.+And+they+that+say+that+no+man+can+be+saved+by+the+knowledge%2C+belief%2C+love+and+practice+of+all+the+substantial+parts+of+Christianity+brought+to+him+by+tradition%2C+parents+or+preachers%2C+who+tell+him+nothing+of+the+Scriptures%2C+but+deliver+him+the+doctrines+as+attested+by+miracles+and+the+Spirit+without+any+notice+of+the+Book.+7.+And+those+that+say+that+Scripture+alone+must+be+made+use+of+as+to+all+the+history+of+Scripture-times%2C+and+that+it+is+unlawful+to+make+use+of+any+other+historians%2C+%28as+Josephus+and+such+others%29.+8.+And+they+that+say%2C+no+other+books+of+divinity+but+Scripture+are+useful%2C+yea%2C+or+lawful+to+be+read+of+Christians%3B+or+at+least+in+the+Church.+9.+And+they+that+say+that+the+Scriptures+are+so+divine%2C+not+only+in+matter%2C+but+in+method+and+style%2C+as+that+there+is+nothing+of+human+%28inculpable+%5Bblameless%5D%29+imperfection+or+weakness+in+them.+10.+And+those+that+say+that+the+logical+method+and+the+phrase+is+as+perfect+as+God+was+able+to+make+them.+11.+And+they+that+say+that+all+passages+in+Scripture+historically+related+are+moral+truths%3A+and+so+make+the+Devil%E2%80%99s+words+to+Eve%2C+of+Job%2C+to+Christ%2C+etc.+to+be+all+true.+12.+And+they+that+say+that+all+passages+in+the+Scripture+were+equally+obligatory+to+all+other+places+and+ages%2C+as+to+those+that+first+received+them+%28as+the+kiss+of+peace%2C+the+veils+of+women%2C+washing+feet%2C+anointing+the+sick%2C+deaconesses%2C+etc.%29+13.+And+they+that+make+Scripture+so+perfect+a+rule+to+our+belief+that+nothing+is+to+be+taken+for+certain%2C+that+comes+to+us+any+other+way+%28as+natural+knowledge+or+historical%29.+14.+And+those+that+think+men+may+not+translate+the+Scripture%2C+turn+the+Psalms+into+metre%2C+tune+them%2C+divide+the+Scripture+into+chapters+and+verses%2C+etc.+as+being+derogatory+alterations+of+the+perfect+Word.+15.+And+those+that+think+it+so+perfect+a+particular+rule+of+all+the+circumstances%2C+modes%2C+adjuncts+and+external+expressions+of+and+in+God%E2%80%99s+worship%2C+as+that+no+such+may+be+invented+or+added+by+man%2C+that+is+not+there+prescribed%3A+as+time%2C+place%2C+vesture+%5Bclothing%2C+such+as+a+grave+garment%5D%2C+gesture%2C+utensils%2C+methods%2C+words%2C+and+many+other+things%2C+mentioned+before.+16.+And+those+that+Jewishly+feign+a+multitude+of+unproved+mysteries+to+lie+in+the+letters%2C+orders%2C+numbers+and+proper+names+in+Scriptures+%28though+I+deny+not+that+there+is+much+mystery+which+we+little+observe%29.+17.+They+that+say+that+the+Scripture+is+all+so+plain+that+there+is+no+obscure+or+difficult+passages+in+them%2C+which+men+are+in+danger+of+wresting+to+their+own+destruction.+18.+And+they+that+say+that+all+in+the+Scripture+is+so+necessary+to+salvation+%28even+the+darkest+prophecies%29+that+they+cannot+be+saved+that+understand+them+not+all%3B+or+at+least+endeavor+not+studiously+and+particularly+to+understand+them.+19.+And+they+that+say+that+every+book+and+text+must+of+necessity+to+salvation+be+believed+to+be+canonical+and+true.+20.+And+those+that+say+that+God+has+so+preserved+the+Scripture%2C+as+that+there+are+no+various+readings+and+doubtful+texts+thereupon%2C+and+that+no+written+or+printed+copies+have+been+corrupted+%28when+Dr.+Heylin+tells+us+that+the+King%E2%80%99s+printer+printed+the+Seventh+Commandment%2C+%E2%80%98Thou+shalt+commit+adultery%E2%80%99%29%3B+all+these+err+in+over-doing.+%E2%80%A6+IV.+The+dangers+of+over-doing+here+are+these%3A+1.+It+leads+to+downright+infidelity%3A+for+when+men+find+that+the+Scripture+is+imperfect+or+wanting+in+that+which+they+fancy+to+be+part+of+its+perfection%2C+and+to+be+really+insufficient%2C+e.g.+to+teach+men+physics%2C+logic%2C+medicine%2C+languages%2C+etc.+they+will+be+apt+to+say%2C+%E2%80%98It+is+not+of+God%2C+because+it+has+not+that+which+it+pretends+to+have.%E2%80%99+2.+God+is+made+the+author+of+defects+and+imperfections.+3.+The+Scripture+is+exposed+to+the+scorn+and+confutation+of+infidels.+4.+Papists+are+assisted+in+proving+its+imperfection.+But+I+must+stop%2C+having+spoke+to+this+point+before+in+Question+35+and+partly+Question+30+%26+31+%26+33+more+at+large.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%281673%29%2C+Part+3%2C+Question+166%2C+%E2%80%98Who+be+they+that+give+too+little+to+the+Scriptures%2C+and+who+too+much%3B+and+what+is+the+danger+of+each+extreme%3F%E2%80%99%2C+pp.+912-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc04bcda648.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c04bcda648.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-sufficiency-of-scripture/#:~:text=II.%20Those%20give%20too%20much%20%28in,31%20%26%2033%20more%20at%20large&amp;text=II.%20Those%20give%20too%20much%20%28in%20bulk%2C%20but&amp;text=30%20%26%2031%20%26%2033%20more%20at%20large" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1st Conclusion. To show that our Church was a visible Church before Luther arose, and that our Reformers were lawfully called of God and the Church, is a question of fact: and cannot be proved by the Word of God. Because the Word of God is not a chronicle of these who were the true Church and truly called to the ministry since the apostles departed this life. 2. Because these must be proved by sense, and the testimony of human writings, who can err. 2nd Conclusion. Yet may it be gathered from human writers that the visible Church of protestants this day, has been since the apostles’ days. I mean the determinate persons may be known by human reasons and signs.</p></blockquote>

<blockquote><p>1st Distinction. The Word of God being given to man as a moral agent, is a rule of all his moral actions, but not of actions of art, sciences, disciplines, yea, or of mere nature. … 6. What is warranted by natural reason, is warranted by Scripture, for the Law of nature is but a part of Scripture. 7. Actions are either purely moral, or purely not-moral, or mixed of both: The first has warrant in Scripture, the second none at all, the third requires not a warrant of Scripture every way concludent, but only in so far as they be moral. 8. Matters of mere fact, known by sense and human testimony, are to be considered according to their physical existence, if they be done or not done; if Titus did such a thing or not, such are not in that notion to be proved by Scripture: 2. They may be considered according to their essence and moral quality of good and lawful, bad or unlawful, and so they are to be warranted by Scripture. … * * * 5. Matters of fact are not, and need not be proved by Scripture: 1. Because sense makes them known to us. 2. Their morality is sufficiently known from God’s Word. 3. In matters of fact there may be invincible ignorance: Christ’s resurrection is not a matter of fact, as Hugo Grotius says, but also a matter of Law, as all the miracles and histories in the Word, and to be believed, because God has so spoken in the Word.</p></blockquote>

<blockquote><p>If some are more discreet and judicious in managing these [i.e., husbandry] or any other affairs than others are, God must be acknowledged in it… As to the other instance of the husbandman’s conduct in threshing his corn, it is said, ‘This also comes forth from the Lord of hosts,’ Isa. 28:29. Even the plainest dictate of sense and reason must be acknowledged to come forth from the Lord of hosts. And, if it is from Him that men do things wisely and discreetly, we must needs acknowledge Him to be ‘wise in counsel and excellent in working.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-27d31d575f" data-kw="">
<blockquote><p>In like manner when God complains of the ingratitude and corrupt morals of the people of Israel, as in Isa. 1, 5; Mic. 6 and in a variety of passage of Scripture, He condemns them by appealing to no other principles than the natural perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 14-15</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2b4ec28d7f" data-kw="">
<blockquote><p>You are wont, indeed, to bring up against us the letters of Cyprian, his opinion, his Council; why do ye claim the authority of Cyprian for your schism, and reject his example when it makes for the peace of the Church? But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true….</p></blockquote>

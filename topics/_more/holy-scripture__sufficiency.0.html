</figure><figure class="quote" id="q-615059786d" data-kw="">
<blockquote><p>There is, brethren, one God, the knowledge of whom we gain from the Holy Scriptures, and from no other source. For just as a man if he wishes to be skilled in the wisdom of this world will find himself unable to get at it in any other way than by mastering the dogmas of philosophers, so all of us who wish to practice piety will be unable to learn its practice from any quarter than the oracles of God. Whatever things then the Holy Scriptures declare, at these let us look; and whatsoever things they teach these let us learn.</p></blockquote>

<blockquote><p>The Papists’ confession of the sufficiency of our Belief: Council of Basil, Oration of Ragus., Bin. p. 299: ‘The holy Scripture in the literal sense, soundly and well understood, is the infallible and most sufficient rule of faith.’ Bellarmine, Of the Word of God, bk. 4, ch. 11 ‘In the Christian doctrine both of Faith and manners, some things are simply necessary to salvation, to all, as the knowledge of the articles of the Apostles’ Creed, of the Ten Commandments and of some sacraments: The rest are not so necessary that a man cannot be saved without the explicit knowledge, belief and profession of them—These things that are simply necessary, and are profitable to all, the apostles preached to all— All things are written by the apostles which are necessary to all, and which they openly preached to all.’ (See the place.) Costenus, Enchiridion, ch. 1, p. 49 ‘Non inficiamur praecipua illa fidei capita quae omnibus Christians cognitu sunt ad salutem necessaria, perspicue satis esse apostolicis scriptis comprehensa.’ [We do not deny that those principal articles of faith which all Christians know and which are necessary for salvation are set forth quite clearly enough in the apostolic writings.]</p></blockquote>

</figure><figure class="quote" id="q-2080b22833" data-kw="">
<blockquote><p>Let us give place and consent to the Holy Scripture (says St. Augustine) for it can neither deceive nor be deceived. The bishops also and clergy of England in the epistle of their book to the King’s grace (De peccatorum meritis et remissione, ch. 22) do affirm that holy Scripture alone shows men the right path to come to God to see Him, to know Him, to love Him, to serve Him and so to serve Him as He most desires. Wherefore they are rather obstinate against God, which instead of his only Word, preach and teach other doctrines.</p></blockquote>

</figure><figure class="quote" id="q-9c7da9c85b" data-kw="">
<blockquote><p>Now I find that Mr. [Richard ]Hooker [an Anglican] says two things to this:

1. That Scripture does regulate all our moral actions, but not scripture only, for the Law of nature and the most concealed instincts of nature, and other principles may warrant our actions: We move (says he), we sleep, we take the cup at the hand of our friend; a number of things we often do only to satisfy some natural desire without present express and actual reference to any commandment of God, unto his glory; even these things are done which we naturally perform, and not only that which naturally and spiritually we do, for by every effect proceeding from the most concealed instincts of nature, his power is made manifest. But it does not therefore follow, that of necessity we shall sin unless we expressly intend the glory of God in every such particular. [Rutherford’s] Answer: …I answer that as: [1.] there be some actions in man purely and spiritually, but supernaturally, moral, as to believe in Christ for remission of sins, to love God in Christ: these the Gospel does regulate.

2. There be some actions naturally moral in the substance of the act, as many things commanded and forbidden in the Moral Law; and these are to be regulated by the Law of nature and the Moral Law:

3. There be some actions mixed, as such actions in which nature, or concealed instincts of nature are the chief principles, yet in and about these actions, as in their modification of time, place, and manner and measure, there is a special morality, in regard of which they are to be ruled by the Word; Such mixed actions as these that are mentioned by Hooker, as to move, sleep, take the cup at the hand of a friend, cannot be called simply moral, for to move may be purely natural, as if a man against his will fall off a high place or off a horse, to start in the sleep, are so natural that I know not any morality in them; but sure I am [that] for Nathaniel to come to Christ, which was also done by a natural motion, is not a mere natural action proceeding from the most concealed instincts of nature; so to sleep has somewhat natural in it, for beasts do sleep; beasts do move; I grant they cannot take a cup at the hand of a friend, they cannot salute one another: (It is Hooker’s instance) but fancy sometimes in men do these, whereas conscience should do them: What is natural in moving and sleeping, and what is common to men with beasts, I grant, Scripture does not direct or regulate these acts of moving and sleeping; we grant [that] actions natural and common to us with beasts need not the rule of the Word to regulate them: But this I must say (I speak it, my record is in Heaven, not to offend any) Formalists, as such, and as Prelatical, are irreligious and profane: One of them asked a godly man, ‘Will you have Scripture for giving your horse a peck of oats, and for breaking wind, and easing or obeying nature?’ And therefore they bring in these instances to make sport: But I conceive, sleeping moderately, to enable you to the service of God, as eating, drinking, that God may be glorified, 1 Cor. 10:31, are also in the measure and manner of doing moral, and so ruled by Scripture and Scripture only, and not regulated by natural instincts… Whereas being created according to God’s image, especially, he living in the visible Church, he is to do all his actions deliberate, even natural and moral in Faith, and with a warrant from scripture, to make good their morality, Ps. 119:9; Prov. 3:23-24; 2 Cor. 5:7. And truly Formalists give men in their morals to live at random and to walk without taking heed to their ways according to God’s Word. … Answer: 1. The Law of reason in morals (for of such we now speak) is nothing but the Moral Law and will of God, contained fully in the Scriptures of the Old and New Testament; and therefore is not to be divided from the Scriptures; if a man be ruled in that, he is ruled by Scripture: for a great part of the Bible, of the Decalogue, is printed in the reasonable soul of man: as when he loves his parents, obeys his superiors, saves his neighbor in extreme danger of death, because he does these according to the Law of Reason, shall it follow that these actions which are expressly called [in Greek] Rom. 2:14, the things or duties of the Law, are not warranted by express Scripture because they are done according to the Law of natural reason? I should think the contrary most true.</p></blockquote>

<blockquote><p>II. Those give too much (in bulk, but too little in virtue) to the Scriptures:

      1. Who would set them up instead of the whole Law, and Light of Nature, as excluding this, as useless where the Scripture is.

      2. And they that feign it to be instead of all grammars, logic, philosophy, and all other arts and sciences, and to be a perfect particular rule for every ruler, lawyer, physician, mariner, architect, husbandman and tradesman, to do his work by.

      3. And they that feign it to be fully sufficient to all men to prove its own authority and truth, without the subsidiary use of that Church-history and tradition, which tells us the supposed matters of fact and must help us to know what books are canonical and what not; and without historical evidence that these are the true books which the prophets and apostles wrote and the miracles and providences which have attested them.

      4. And those that think that it is sufficient for its own promulgation, or the peoples instruction, without the ministry of man to preserve, deliver, translate, expound and preach it to the people.

      5. And those that think it sufficient to sanctify men, without the concourse of the Spirit’s illumination, vivification and inward operation to that end.

      6. And they that say that no man can be saved by the knowledge, belief, love and practice of all the substantial parts of Christianity brought to him by tradition, parents or preachers, who tell him nothing of the Scriptures, but deliver him the doctrines as attested by miracles and the Spirit without any notice of the Book.

      7. And those that say that Scripture alone must be made use of as to all the history of Scripture-times, and that it is unlawful to make use of any other historians, (as Josephus and such others).

      8. And they that say, no other books of divinity but Scripture are useful, yea, or lawful to be read of Christians; or at least in the Church.

      9. And they that say that the Scriptures are so divine, not only in matter, but in method and style, as that there is nothing of human (inculpable [blameless]) imperfection or weakness in them.

      10. And those that say that the logical method and the phrase is as perfect as God was able to make them.

      11. And they that say that all passages in Scripture historically related are moral truths: and so make the Devil’s words to Eve, of Job, to Christ, etc. to be all true.

      12. And they that say that all passages in the Scripture were equally obligatory to all other places and ages, as to those that first received them (as the kiss of peace, the veils of women, washing feet, anointing the sick, deaconesses, etc.)

      13. And they that make Scripture so perfect a rule to our belief that nothing is to be taken for certain, that comes to us any other way (as natural knowledge or historical).

      14. And those that think men may not translate the Scripture, turn the Psalms into metre, tune them, divide the Scripture into chapters and verses, etc. as being derogatory alterations of the perfect Word.

      15. And those that think it so perfect a particular rule of all the circumstances, modes, adjuncts and external expressions of and in God’s worship, as that no such may be invented or added by man, that is not there prescribed: as time, place, vesture [clothing, such as a grave garment], gesture, utensils, methods, words, and many other things, mentioned before.

      16. And those that Jewishly feign a multitude of unproved mysteries to lie in the letters, orders, numbers and proper names in Scriptures (though I deny not that there is much mystery which we little observe).

      17. They that say that the Scripture is all so plain that there is no obscure or difficult passages in them, which men are in danger of wresting to their own destruction.

      18. And they that say that all in the Scripture is so necessary to salvation (even the darkest prophecies) that they cannot be saved that understand them not all; or at least endeavor not studiously and particularly to understand them.

      19. And they that say that every book and text must of necessity to salvation be believed to be canonical and true.

      20. And those that say that God has so preserved the Scripture, as that there are no various readings and doubtful texts thereupon, and that no written or printed copies have been corrupted (when Dr. Heylin tells us that the King’s printer printed the Seventh Commandment, ‘Thou shalt commit adultery’); all these err in over-doing. …

IV. The dangers of over-doing here are these:

      1. It leads to downright infidelity: for when men find that the Scripture is imperfect or wanting in that which they fancy to be part of its perfection, and to be really insufficient, e.g. to teach men physics, logic, medicine, languages, etc. they will be apt to say, ‘It is not of God, because it has not that which it pretends to have.’

      2. God is made the author of defects and imperfections.

      3. The Scripture is exposed to the scorn and confutation of infidels.

      4. Papists are assisted in proving its imperfection. But I must stop, having spoke to this point before in Question 35 and partly Question 30 &amp; 31 &amp; 33 more at large.</p></blockquote>

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, ... (1673), Part 3, Question 166, ‘Who be they that give too little to the Scriptures, and who too much; and what is the danger of each extreme?’, pp. 912-13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+Those+give+too+much+%28in+bulk%2C+but+too+little+in+virtue%29+to+the+Scriptures%3A+1.+Who+would+set+them+up+instead+of+the+whole+Law%2C+and+Light+of+Nature%2C+as+excluding+this%2C+as+useless+where+the+Scripture+is.+2.+And+they+that+feign+it+to+be+instead+of+all+grammars%2C+logic%2C+philosophy%2C+and+all+other+arts+and+sciences%2C+and+to+be+a+perfect+particular+rule+for+every+ruler%2C+lawyer%2C+physician%2C+mariner%2C+architect%2C+husbandman+and+tradesman%2C+to+do+his+work+by.+3.+And+they+that+feign+it+to+be+fully+sufficient+to+all+men+to+prove+its+own+authority+and+truth%2C+without+the+subsidiary+use+of+that+Church-history+and+tradition%2C+which+tells+us+the+supposed+matters+of+fact+and+must+help+us+to+know+what+books+are+canonical+and+what+not%3B+and+without+historical+evidence+that+these+are+the+true+books+which+the+prophets+and+apostles+wrote+and+the+miracles+and+providences+which+have+attested+them.+4.+And+those+that+think+that+it+is+sufficient+for+its+own+promulgation%2C+or+the+peoples+instruction%2C+without+the+ministry+of+man+to+preserve%2C+deliver%2C+translate%2C+expound+and+preach+it+to+the+people.+5.+And+those+that+think+it+sufficient+to+sanctify+men%2C+without+the+concourse+of+the+Spirit%E2%80%99s+illumination%2C+vivification+and+inward+operation+to+that+end.+6.+And+they+that+say+that+no+man+can+be+saved+by+the+knowledge%2C+belief%2C+love+and+practice+of+all+the+substantial+parts+of+Christianity+brought+to+him+by+tradition%2C+parents+or+preachers%2C+who+tell+him+nothing+of+the+Scriptures%2C+but+deliver+him+the+doctrines+as+attested+by+miracles+and+the+Spirit+without+any+notice+of+the+Book.+7.+And+those+that+say+that+Scripture+alone+must+be+made+use+of+as+to+all+the+history+of+Scripture-times%2C+and+that+it+is+unlawful+to+make+use+of+any+other+historians%2C+%28as+Josephus+and+such+others%29.+8.+And+they+that+say%2C+no+other+books+of+divinity+but+Scripture+are+useful%2C+yea%2C+or+lawful+to+be+read+of+Christians%3B+or+at+least+in+the+Church.+9.+And+they+that+say+that+the+Scriptures+are+so+divine%2C+not+only+in+matter%2C+but+in+method+and+style%2C+as+that+there+is+nothing+of+human+%28inculpable+%5Bblameless%5D%29+imperfection+or+weakness+in+them.+10.+And+those+that+say+that+the+logical+method+and+the+phrase+is+as+perfect+as+God+was+able+to+make+them.+11.+And+they+that+say+that+all+passages+in+Scripture+historically+related+are+moral+truths%3A+and+so+make+the+Devil%E2%80%99s+words+to+Eve%2C+of+Job%2C+to+Christ%2C+etc.+to+be+all+true.+12.+And+they+that+say+that+all+passages+in+the+Scripture+were+equally+obligatory+to+all+other+places+and+ages%2C+as+to+those+that+first+received+them+%28as+the+kiss+of+peace%2C+the+veils+of+women%2C+washing+feet%2C+anointing+the+sick%2C+deaconesses%2C+etc.%29+13.+And+they+that+make+Scripture+so+perfect+a+rule+to+our+belief+that+nothing+is+to+be+taken+for+certain%2C+that+comes+to+us+any+other+way+%28as+natural+knowledge+or+historical%29.+14.+And+those+that+think+men+may+not+translate+the+Scripture%2C+turn+the+Psalms+into+metre%2C+tune+them%2C+divide+the+Scripture+into+chapters+and+verses%2C+etc.+as+being+derogatory+alterations+of+the+perfect+Word.+15.+And+those+that+think+it+so+perfect+a+particular+rule+of+all+the+circumstances%2C+modes%2C+adjuncts+and+external+expressions+of+and+in+God%E2%80%99s+worship%2C+as+that+no+such+may+be+invented+or+added+by+man%2C+that+is+not+there+prescribed%3A+as+time%2C+place%2C+vesture+%5Bclothing%2C+such+as+a+grave+garment%5D%2C+gesture%2C+utensils%2C+methods%2C+words%2C+and+many+other+things%2C+mentioned+before.+16.+And+those+that+Jewishly+feign+a+multitude+of+unproved+mysteries+to+lie+in+the+letters%2C+orders%2C+numbers+and+proper+names+in+Scriptures+%28though+I+deny+not+that+there+is+much+mystery+which+we+little+observe%29.+17.+They+that+say+that+the+Scripture+is+all+so+plain+that+there+is+no+obscure+or+difficult+passages+in+them%2C+which+men+are+in+danger+of+wresting+to+their+own+destruction.+18.+And+they+that+say+that+all+in+the+Scripture+is+so+necessary+to+salvation+%28even+the+darkest+prophecies%29+that+they+cannot+be+saved+that+understand+them+not+all%3B+or+at+least+endeavor+not+studiously+and+particularly+to+understand+them.+19.+And+they+that+say+that+every+book+and+text+must+of+necessity+to+salvation+be+believed+to+be+canonical+and+true.+20.+And+those+that+say+that+God+has+so+preserved+the+Scripture%2C+as+that+there+are+no+various+readings+and+doubtful+texts+thereupon%2C+and+that+no+written+or+printed+copies+have+been+corrupted+%28when+Dr.+Heylin+tells+us+that+the+King%E2%80%99s+printer+printed+the+Seventh+Commandment%2C+%E2%80%98Thou+shalt+commit+adultery%E2%80%99%29%3B+all+these+err+in+over-doing.+%E2%80%A6+IV.+The+dangers+of+over-doing+here+are+these%3A+1.+It+leads+to+downright+infidelity%3A+for+when+men+find+that+the+Scripture+is+imperfect+or+wanting+in+that+which+they+fancy+to+be+part+of+its+perfection%2C+and+to+be+really+insufficient%2C+e.g.+to+teach+men+physics%2C+logic%2C+medicine%2C+languages%2C+etc.+they+will+be+apt+to+say%2C+%E2%80%98It+is+not+of+God%2C+because+it+has+not+that+which+it+pretends+to+have.%E2%80%99+2.+God+is+made+the+author+of+defects+and+imperfections.+3.+The+Scripture+is+exposed+to+the+scorn+and+confutation+of+infidels.+4.+Papists+are+assisted+in+proving+its+imperfection.+But+I+must+stop%2C+having+spoke+to+this+point+before+in+Question+35+and+partly+Question+30+%26+31+%26+33+more+at+large.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+...+%281673%29%2C+Part+3%2C+Question+166%2C+%E2%80%98Who+be+they+that+give+too+little+to+the+Scriptures%2C+and+who+too+much%3B+and+what+is+the+danger+of+each+extreme%3F%E2%80%99%2C+pp.+912-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc04bcda648.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/c04bcda648.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-sufficiency-of-scripture/#:~:text=II.%20Those%20give%20too%20much%20%28in,31%20%26%2033%20more%20at%20large&amp;text=II.%20Those%20give%20too%20much%20%28in%20bulk%2C%20but&amp;text=30%20%26%2031%20%26%2033%20more%20at%20large" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1st Conclusion. To show that our Church was a visible Church before Luther arose, and that our Reformers were lawfully called of God and the Church, is a question of fact: and cannot be proved by the Word of God. Because the Word of God is not a chronicle of these who were the true Church and truly called to the ministry since the apostles departed this life. 2. Because these must be proved by sense, and the testimony of human writings, who can err. 2nd Conclusion. Yet may it be gathered from human writers that the visible Church of protestants this day, has been since the apostles’ days. I mean the determinate persons may be known by human reasons and signs.</p></blockquote>

</figure><figure class="quote" id="q-157f170654" data-kw="">
<blockquote><p>1st Distinction. The Word of God being given to man as a moral agent, is a rule of all his moral actions, but not of actions of art, sciences, disciplines, yea, or of mere nature. …

6. What is warranted by natural reason, is warranted by Scripture, for the Law of nature is but a part of Scripture.

7. Actions are either purely moral, or purely not-moral, or mixed of both: The first has warrant in Scripture, the second none at all, the third requires not a warrant of Scripture every way concludent, but only in so far as they be moral.

8. Matters of mere fact, known by sense and human testimony, are to be considered according to their physical existence, if they be done or not done; if Titus did such a thing or not, such are not in that notion to be proved by Scripture:

2. They may be considered according to their essence and moral quality of good and lawful, bad or unlawful, and so they are to be warranted by Scripture. … * * * 5. Matters of fact are not, and need not be proved by Scripture:

1. Because sense makes them known to us.

2. Their morality is sufficiently known from God’s Word.

3. In matters of fact there may be invincible ignorance: Christ’s resurrection is not a matter of fact, as Hugo Grotius says, but also a matter of Law, as all the miracles and histories in the Word, and to be believed, because God has so spoken in the Word.</p></blockquote>

<blockquote><p>In like manner when God complains of the ingratitude and corrupt morals of the people of Israel, as in Isa. 1, 5; Mic. 6 and in a variety of passage of Scripture, He condemns them by appealing to no other principles than the natural perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them.</p></blockquote>

l="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>You are wont, indeed, to bring up against us the letters of Cyprian, his opinion, his Council; why do ye claim the authority of Cyprian for your schism, and reject his example when it makes for the peace of the Church? But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true….</p></blockquote>

</figure><figure class="quote" id="q-61c1c18666" data-kw="">
<blockquote><p>But not only does Scripture give no countenance or authority to tradition as a recognised means of conveying to us the divine will, and not only does it virtually exclude tradition as a divine informant by plainly enough asserting its own sufficiency and perfection, but it also contains much that goes directly to disprove the authority and validity of tradition.

The pharisaic doctrine of tradition was the same as that of the Papists and Tractarians, and the use made of it by the Pharisees was precisely analogous to that made of it by their successors in the work of corrupting true religion, so that tradition is an old device of Satan; it met, as exhibited in the case of the Pharisees, with the most decided and emphatic condemnation from our Saviour, who not only himself refused to pay the smallest regard or respect to their traditions; in this as in everything else leaving us an example that we should follow his steps, but declared that they made the word of God of none effect by their traditions — a declaration just as applicable to the conduct of Papists and Tractarians as to that of those against whom it was originally directed.

When our Lord had so emphatically denounced this principle, and the use made of it, it might have been expected that Satan would scarcely have ventured to have again employed the same device for making the word of God of none effect among men who professed to honour Christ, and to submit to his authority. But the event has justified his wisdom and his knowledge of human nature. He has again succeeded, notwithstanding our Saviour’s warnings and denunciations, in making the word of God of none effect by tradition, in grievously corrupting the true religion by means of the devices and inventions of men.

We cannot recognise tradition as an authorised method of conveying to us the divine will, unless we have God’s own authority for regarding and trusting it as such. But God in his word has not only given it no such authority, but has, both by general principles and by specific statements, forbidden us to take it as our rule or guide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XXXIX, pp 485-86.</span></figcaption>

</figure><figure class="quote" id="q-5f5ed9533e" data-kw="">
<blockquote><p>Let us then sit down by the Scriptures, the Word of God written, as the only sure card, and rule to guide us in all matters of faith, and life: For if we leave this once, there is nothing but Sea and Air, no place for this poor Dove, this poor soul of ours to rest her foot; without which, when, and where to stay, none can tell.

That then we may not run from opinion to opinion, from Christ to Christ, from Church to church, till we have run our selves out of all, our only sure way is to fly to the Scriptures, to the written Word of God, as to an Anchor, that so we may have hope, if hope, then faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-capel.html">Richard Capel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Capel’s remains being an useful appendix to his excellent Treatise of tentations, concerning the translations of the Holy Scriptures: left written with his own hand. By that incomparably learned and judicious divine, Mr. Richard Capel, sometimes fellow of Magdalen-College in Oxford; with a preface p</cite>, (London: John Bartlet, 1658), p. 6.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Let us then sit down by the Scriptures, the Word of God written, as the only sure card, and rule to guide us in all matters of faith, and life: For if we leave this once, there is nothing but Sea and Air, no place for this poor Dove, this poor soul of ours to rest her foot; without which, when, and where to stay, none can tell.

That then we may not run from opinion to opinion, from Christ to Christ, from Church to church, till we have run our selves out of all, our only sure way is to fly to the Scriptures, to the written Word of God, as to an Anchor, that so we may have hope, if hope, then faith.”

<blockquote><p>Let any thing but the written word of God take place in matters of faith, and who seeth not that the very main sea of heresies must needs break in upon the Church of Christ? These are, as we suppose, causes just &amp; allowable and sufficient in the indifferent judgement of reasonable men, why we should deliver you no doctrine concerning faith &amp; religion, but only that which is in Scripture; why we should admonish you to beware of bread soured with pharisaical leaven, and to feed upon that which ye know came down from heaven, to shun broken cisterns, &amp; to come to the well of living waters, as here ye are exhorted by the Prophet.</p></blockquote>

</figure><figure class="quote" id="q-dd6001fbc6" data-kw="">
<blockquote><p>The end for which the Scriptures are given, is, to be a rule to direct us how we may glorify God, and come to the enjoyment of him as our God. And they are the only rule to direct us in these matters. Withall they are a certain and infallible rule; and that because they are the word of God. It appears, that they are the word of God, by the holiness efficacy of their doctrine, and the miracles wrought to confirm it. And this, although for the most part they were written by men because all Scripture is given by inspiration of God, 2 Tim. iii. 16.

The word Scriptures signifies writings: but the church had not always the written word, till about Moses’ time. Howbeit, they were supplied, while they wanted it, by extraordinary revelations: and it is the same doctrine that was then so revealed, which we have now in the Scripture. Nevertheless, the Scripture is altogether necessary for the church now; and that because extraordinary revelation of doctrine is ceased, and God hath bound us to the Scripture as the test or touchstone of doctrine: Isa. viii. 20. “To the law and to the testimony: if they speak not according to this word, it is because there is no light in them.”

Neither will God ever give us another rule: for the Scripture is a testamentary word of God. Now, a testament is the last will of a dying person. So the Scripture is Christ’s testament, confirmed by his death; and as a testament, it declares the last will of God concerning man’s salvation and duty. Christ’s testament is twofold: namely, the Old Testament, and the New Testament.

The books beginning with Genesis, and ending with Malachi, are Christ’s Old Testament: those beginning with Matthew, and ending with the Revelation, are Christ’s New Testament. These two testaments are one and the same for substance: for in both, Jesus Christ is the testator; eternal life is the legacy ; sinners of mankind are the legatees; and faith in Jesus Christ is the way of claiming and obtaining the legacy: 1 John v. 11, 12, “And this is the record, that God hath given to us eternal life: and this life is in his Son. He that hath the Son hath life; and he that hath not the Son of God, hath not life.” Prov. viii. 4, “Unto you, men, I call, and my voice is to the sons of man.” But they differ in circumstances; the new being more clear and full than the old one. Howbeit, neither the one nor the other can be savingly understood, without an inward illumination of the mind by the Spirit of Christ: 1 Cor. ii. 14, “But God hath revealed them unto us by his Spirit: for the Spirit searcheth all things, yea, the deep things of God.</p></blockquote>

<blockquote><p>So then, brothers, stand firm and hold to the traditions that you were taught by us, either by our spoken word or by our letter (2 Thessalonians 2:15)

6. Though we blame this in papists, yet we reject not all traditions:—

[1.] Because scripture itself is a tradition, as we proved before, and is conveyed to us by the most credible means, which we have no reason to doubt of. The scriptures of the Old Testament were preserved by the Jews, ‘to whom were committed the oracles of God.’ Rom. iii. 2, Protestants received all the books which they admitted into their canon. And for the books of the New Testament, the Christian church hath received them as the writings of those whose names they bear. And by the constant universal tradition of the church they are transmitted to us; and we have no more reason to doubt of them than we do of statutes and laws made by kings and parliaments who lived long before we had a being.

Yea; we may be much more confident, as the matter is of greater weight and consequence, and these writings have the signature and stamp of God’s Spirit on them, and have been blessed by God to the converting and sanctifying of many souls; and have been delivered down to us by a succession of believers unto this very day. And by them Christianity hath been preserved in the world, notwithstanding the wickedness of it, and hath held up head against all the encounters of time. The persecutions of adverse powers have not suppressed it, nor the disputes of enemies silenced the profession of it; but still from age to age God’s truth is received and transmitted to posterity.

[2.] Because the truth of Christianity depending upon matter of fact, chiefly Christ’s rising from the dead, it can only be proved by a testimony which, in so extraordinary a case, must be made valuable, and authorised to the world by the miracles accompanying it. Now the notice of these things is brought to us by tradition, which, being unquestionable, giveth us as good ground of faith as it did to them that lived in the apostles’ time, and heard their doctrine and saw their miracles. God’s wonderful works were never intended for the benefit of that age only in which they were done, but for the benefit also of those that should hear of them by any credible means what soever, Ps. cxlv. 4; Joel i. 3; Ps. lxxviii. 3-7: these things were told them ‘that they might set their hope in God,’ &amp;c.

[3.] Because there are some doctrines drawn by just consequence from scripture, but are the more confirmed to us when they are backed with constant church usage and practice; as baptism of infants, Lord’s-day, singing of psalms in our public worship, &amp;c.

[4.] Because there are certain words which are not found in scripture indeed, yet agreeable thereto, and are very useful to discover the frauds of heretics; as Trinity, divine providence, consubstantial, procession of the Holy Ghost, satisfaction, &amp;c.

[5.] We reject not all church history, or the records of ancient writers concerning the providences of God in their days in owning the gospel, which make much for our instruction in manners, and help to encourage us to put our trust in God.

[6.] There are certain usages and innocent customs or circumstances, common to sacred and other actions, which we despise not, but acknowledge and receive as far as their own variable nature and condition requireth; not rejecting them, because anciently practised; nor regarding them, when the general law of edification requireth the omission of them.

But that which we detest is, that the traditions of men should be made equal in dignity and authority with the express revelation of God; yea, that manifest corruptions and usurpations,—as making Rome the mistress of other churches, and superinducing the Pope as the head of the universal visible church, and the vicar of Christ, without his leave and appointment, and such like other points, should be obtruded upon the world as apostolical traditions, and to be received with like religious reverence as we do articles of faith set down in scripture. This is that we cannot sufficiently abhor, as apparently false, and destructive to Christianity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The Complete Works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 133-35.</span></figcaption>

— Thomas Manton, Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome, (1679) in The Complete Works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 133-35.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+then%2C+brothers%2C+stand+firm+and+hold+to+the+traditions+that+you+were+taught+by+us%2C+either+by+our+spoken+word+or+by+our+letter+%282+Thessalonians+2%3A15%29%0A%0A6.+Though+we+blame+this+in+papists%2C+yet+we+reject+not+all+traditions%3A%E2%80%94%0A%0A%5B1.%5D+Because+scripture+itself+is+a+tradition%2C+as+we+proved+before%2C+and+is+conveyed+to+us+by+the+most+credible+means%2C+which+we+have+no+reason+to+doubt+of.+The+scriptures+of+the+Old+Testament+were+preserved+by+the+Jews%2C+%E2%80%98to+whom+were+committed+the+oracles+of+God.%E2%80%99+Rom.+iii.+2%2C+Protestants+received+all+the+books+which+they+admitted+into+their+canon.+And+for+the+books+of+the+New+Testament%2C+the+Christian+church+hath+received+them+as+the+writings+of+those+whose+names+they+bear.+And+by+the+constant+universal+tradition+of+the+church+they+are+transmitted+to+us%3B+and+we+have+no+more+reason+to+doubt+of+them+than+we+do+of+statutes+and+laws+made+by+kings+and+parliaments+who+lived+long+before+we+had+a+being.%0A%0AYea%3B+we+may+be+much+more+confident%2C+as+the+matter+is+of+greater+weight+and+consequence%2C+and+these+writings+have+the+signature+and+stamp+of+God%E2%80%99s+Spirit+on+them%2C+and+have+been+blessed+by+God+to+the+converting+and+sanctifying+of+many+souls%3B+and+have+been+delivered+down+to+us+by+a+succession+of+believers+unto+this+very+day.+And+by+them+Christianity+hath+been+preserved+in+the+world%2C+notwithstanding+the+wickedness+of+it%2C+and+hath+held+up+head+against+all+the+encounters+of+time.+The+persecutions+of+adverse+powers+have+not+suppressed+it%2C+nor+the+disputes+of+enemies+silenced+the+profession+of+it%3B+but+still+from+age+to+age+God%E2%80%99s+truth+is+received+and+transmitted+to+posterity.%0A%0A%5B2.%5D+Because+the+truth+of+Christianity+depending+upon+matter+of+fact%2C+chiefly+Christ%E2%80%99s+rising+from+the+dead%2C+it+can+only+be+proved+by+a+testimony+which%2C+in+so+extraordinary+a+case%2C+must+be+made+valuable%2C+and+authorised+to+the+world+by+the+miracles+accompanying+it.+Now+the+notice+of+these+things+is+brought+to+us+by+tradition%2C+which%2C+being+unquestionable%2C+giveth+us+as+good+ground+of+faith+as+it+did+to+them+that+lived+in+the+apostles%E2%80%99+time%2C+and+heard+their+doctrine+and+saw+their+miracles.+God%E2%80%99s+wonderful+works+were+never+intended+for+the+benefit+of+that+age+only+in+which+they+were+done%2C+but+for+the+benefit+also+of+those+that+should+hear+of+them+by+any+credible+means+what+soever%2C+Ps.+cxlv.+4%3B+Joel+i.+3%3B+Ps.+lxxviii.+3-7%3A+these+things+were+told+them+%E2%80%98that+they+might+set+their+hope+in+God%2C%E2%80%99+%26c.%0A%0A%5B3.%5D+Because+there+are+some+doctrines+drawn+by+just+consequence+from+scripture%2C+but+are+the+more+confirmed+to+us+when+they+are+backed+with+constant+church+usage+and+practice%3B+as+baptism+of+infants%2C+Lord%E2%80%99s-day%2C+singing+of+psalms+in+our+public+worship%2C+%26c.%0A%0A%5B4.%5D+Because+there+are+certain+words+which+are+not+found+in+scripture+indeed%2C+yet+agreeable+thereto%2C+and+are+very+useful+to+discover+the+frauds+of+heretics%3B+as+Trinity%2C+divine+providence%2C+consubstantial%2C+procession+of+the+Holy+Ghost%2C+satisfaction%2C+%26c.%0A%0A%5B5.%5D+We+reject+not+all+church+history%2C+or+the+records+of+ancient+writers+concerning+the+providences+of+God+in+their+days+in+owning+the+gospel%2C+which+make+much+for+our+instruction+in+manners%2C+and+help+to+encourage+us+to+put+our+trust+in+God.%0A%0A%5B6.%5D+There+are+certain+usages+and+innocent+customs+or+circumstances%2C+common+to+sacred+and+other+actions%2C+which+we+despise+not%2C+but+acknowledge+and+receive+as+far+as+their+own+variable+nature+and+condition+requireth%3B+not+rejecting+them%2C+because+anciently+practised%3B+nor+regarding+them%2C+when+the+general+law+of+edification+requireth+the+omission+of+them.%0A%0ABut+that+which+we+detest+is%2C+that+the+traditions+of+men+should+be+made+equal+in+dignity+and+authority+with+the+express+revelation+of+God%3B+yea%2C+that+manifest+corruptions+and+usurpations%2C%E2%80%94as+making+Rome+the+mistress+of+other+churches%2C+and+superinducing+the+Pope+as+the+head+of+the+universal+visible+church%2C+and+the+vicar+of+Christ%2C+without+his+leave+and+appointment%2C+and+such+like+other+points%2C+should+be+obtruded+upon+the+world+as+apostolical+traditions%2C+and+to+be+received+with+like+religious+reverence+as+we+do+articles+of+faith+set+down+in+scripture.+This+is+that+we+cannot+sufficiently+abhor%2C+as+apparently+false%2C+and+destructive+to+Christianity.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+Eighteen+sermons+on+the+second+chapter+of+the+second+epistle+to+the+Thessalonians%2C+containing+the+description%2C+rise%2C+growth%2C+and+fall+of+antichrist%2C+with+divers+cautions+and+arguments+to+establish+Christians+against+the+apostasy+of+the+Church+of+Rome%2C+%281679%29+in+The+Complete+Works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%2C+1871%29%2C+iii%2C+133-35.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b07a6466c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/2b07a6466c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/18/thomas-manton-on-the-reformed-view-of-tradition/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>1. We have learned from none others the plan of our salvation, than from those through whom the Gospel has come down to us, which they did at one time proclaim in public, and, at a later period, by the will of God, handed down to us in the Scriptures, to be the ground and pillar of our faith. …

2. These have all declared to us that there is one God, Creator of heaven and earth, announced by the law and the prophets; and one Christ the Son of God. If any one do not agree to these truths, he despises the companions of the Lord; nay more, he despises Christ Himself the Lord; yea, he despises the Father also, and stands self-condemned, resisting and opposing his own salvation, as is the case with all heretics.</p></blockquote>

<figure class="quote" id="q-41388c7879" data-kw="">
<blockquote><p>Man truly begets man, although the soul is created by God, not because he only bestows him a body, nor because he prepares the body for receiving the soul… but because from the man who begets comes the very action by which the rational soul is substantially united to the body, and begins to inform, inhabit, and fill the whole material of the body. Thus in our opinion, the begetting of man is located in that action by which, through prolific virtue, the soul is joined by an essential bond to the body.</p></blockquote>

<blockquote><p>It may press us to admire the grace of God to his children. He cannot satisfy himself in doing good to you, but he must do good to your children too. How should we entertain this with reverence! When God told Abraham, I am thy God, and the God of thy seed, ‘Abraham fell upon his face,’ as humbly adoring the goodness of God, Gen.17:3; so David, when God spake concerning his house and his children: 2 Sam. 7:18, 19, ‘What am I, O Lord, and what is my house, that thou hast brought me hitherto?’ And this was yet a small thing in thy sight, O Lord God; for thou hast spoken also of thy servant’s house for a great while to come;’ he stands wondering at this mercy of God.</p></blockquote>

<blockquote><p>II. By the state of innocence, we mean the first condition of man created after the image of God internal goodness and external happiness. As it abounded in all goods (of the body as well as of the soul) necessary for obtaining true happiness in that state, so it experienced the most holy and agreeable government of God. Hence it consists principally of two parts: the happy condition of man and the federal government of God around him. His happiness arose from the image of God in which he was created. It consisted especially in original righteousness and the immortality and dominion consequent upon it (of which we have spoken before in the Topic on Creation). To it also belonged his liberty, the subject of this question.</p></blockquote>

</figure><figure class="quote" id="q-f3251ccd01" data-kw="">
<blockquote><p>In this way only we attain to what is not to say difficult but altogether against nature, to love those that hate us, render good for evil, and blessing for cursing, remembering that we are not to reflect on the wickedness of men, but look to the image of God in them, an image which, covering and obliterating their faults, should by its beauty and dignity allure us to love and embrace them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.7.6 (Beveridge transl.)</span></figcaption>

</figure><figure class="quote" id="q-ec826480cb" data-kw="">
<blockquote><p>In Christ too, you see, there was a human soul, a complete soul; not just the non-rational element in this soul, but the rational one as well, which is named mind. For, there have been some heretics, and they have been expelled from the Church, who maintained that the body of Christ does not have a rational mind, but just a kind of brute soul; cut out the rational mind, after all, and you are left with life that is brutish. But since they have been expelled—expelled in truth—you must now take the whole Christ as Word, rational mind, and flesh. That is the whole Christ; let your soul then rise from wickedness through that which is God, let your body rise again from corruption through that which is man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the Gospel of John 1-40</cite>, (c. 406-20), trans. Edmund Hill, ed. Allan D. Fitzgerald, The Works of Saint Augustine: A Translation for the 21st Century, Volume 12 (Hyde Park NY: New City Press, 2009), 23.6, p. 411.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-2754826cd0" data-kw="">
<blockquote><p>A spiritual knowledge is always attended with a spiritual life; a new man, and such a knowledge as is after the image of God, go together: Col. iii. 10, ‘Having put on the new man, which is renewed in knowledge, after the image of him that created him.’ As the natural image of God consisted in understanding and will, so the spiritual image of God by grace consists in a rectifying those faculties; the understanding with a spiritual knowledge, and the will with a spiritual bias. The faculties we have from God as creator by nature, the operation of those faculties about their proper spiritual objects we have by grace.

As the apostle distinguisheth ‘the form of godliness’ from ‘the power,’ 2 Tim. iii. 5, so he doth a form of knowledge from the life of it, Rom. ii. 20, which is a knowledge in the letter, not in the spirit, verse 29; the one is a picture wherein every limb is painted, the other is quickened and animated with a divine life. Speculative knowledge is as the light of torches, guiding, not heating; this as the sun, which both directs and warms; a fire felt as well as seen; truth known, and truth used as a compass to sail by.

When the knowledge of the nature of God is impressed upon us for imitation, and is, as the conference of Christ with his disciples, inflaming the heart, Luke xxiv. 32, and driving away the cold affections towards God; when righteousness is understood as well as judgment, and that as a path, and a good path, to walk in; when we are not only directed to the path, but are pleased with the goodness of it, and the approving wisdom enters into the heart, and the knowledge of it becomes pleasant to the soul, Prov. ii. 9, 10; when there is not only a knowledge of God, but a liking to retain it; a sight of the sun, and a delight in his beams; a knowledge of the fire, and approach to its heat; a mighty pleasure in God and Christ, as a sweet ointment poured forth; when God is known and embraced as the chief good and ultimate end; Christ known and embraced as the way to be at peace with God, and an honourer of him: such a knowledge as is not only like animal spirits in the brain, but vital spirits in the heart enabling for action; not like a cloud hanging in the air, but distilling in fruitful showers for the assistance of the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 18.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/man/image-of-god.html">Image of God</a></span></div>

As the apostle distinguisheth ‘the form of godliness’ from ‘the power,’ 2 Tim. iii. 5, so he doth a form of knowledge from the life of it, Rom. ii. 20, which is a knowledge in the letter, not in the spirit, verse 29; the one is a picture wherein every limb is painted, the other is quickened and animated with a divine life. Speculative knowledge is as the light of torches, guiding, not heating; this as the sun, which both directs and warms; a fire felt as well as seen; truth known, and truth used as a compass to sail by.

<blockquote><p>The Image of God, is that dignity, and excellency, in which the reasonable creatures, being created like unto God, do excel other creatures.

Of this Image of God there are two parts, perfect reason, and perfect blessedness. Perfect reason, is a part of God’s Image, by which the reasonable creature, doth more expressly carry the Image of God his creator, whilst by a certain divine force it knoweth plainly things, without error, as they are, and doth will and choose no other thing, then that which doth please God. And that perfect reason consisteth, both in the mind and in the will.

Perfect reason in the mind, is an excellent understanding, rightly knowing all simple, particular, and general things, which a created nature can know, and joining them together, or dividing them, or reasoning by compared things, it having also by nature, some ingraffed &amp; natural knowledge, such as are the principles of arts, and rule of life, and a respective motion judging of the proper acts thereof.

In the will there is both the conformity of the will with God, and also free will. The conformity of the will with God, is that obedience, which the will doth uprightly perform to God, so that all inclinations, desires, and actions do agree with God’s will. The free will of a reasonable creature, is the power of the will, choosing or refusing freely and of it own proper motion, without compulsion, that which understanding sheweth to be chosen or refused.

Thus far concerning perfect reason: now concerning perfect blessedness.

Perfect blessedness is that other part of the image of God, by which a natural creature, through an excellent joy, taking pleasure in God alone, doth enjoy perfect felicity.

The creatures made according to the image of God, are Angels, and men. Angels, are created, understanding, and invisible spirits, neither sustained in any other (excepting in God alone) neither part of another. And Angels are either good or evil. Good Angels, are Angels which have stood in their integrity in which they were made.

Their free will, is to good things only, because they are already so confirmed in goodness, that their mind cannot be deceived, nor err in judging, that is to say, in approving, &amp; misliking the object, neither can the will desire any other thing, then that which the mind judgeth, but choose that which it approveth, refuse and reject that which it misliketh. Job. 4.18. Mat. 22.30. 1. Tim. 5.21. Ephes. 1.10. Col. 1.20.

The duty of good Angels is two fold: either towards God, or men. Their duty towards God is of two sorts: the first to do God’s will. Psal. 103.20. The second to set forth God by continual praises. Psal. 103.20. and 148.2.

The duty of Angels towards men, is also two fold. The one, to be a defence to the elect against all dangers, and against the subtleties and assaults of the enemies, and to carry the souls of the elect being dead, into the place of the blessed. Or else to minister to those that fear God in all their ways. Heb. 1.14. Psal. 34.8. &amp; 103.21. Mat. 18.10. Psal. 91.11. Dan. 10. and 12. Luke. 16.22. Their other duty is, to punish the evil. For the good Angels, are not only the disposers of the goodness of God, but also sometime executors of punishment. 2. King. 29.35.</p></blockquote>

<blockquote><p>[T]hough by nature ye are sinful, and evil, and tainted with Corruption, yet there are some impressions of equity, some principles of common honesty still preserved; not only those that are comparatively, but those that are totally evil; those that are unsanctified, have some rules of honesty engraven upon them, some impressions of the image of God, that image not wholly defaced, concerning truths and rules of morality, which nature hath still preserved. Nature it self starts back at some abominations in an unregenerate man, the Conscience of an unregenerate man, checks it self at some horrible impiety. In a spiritual sense, all moral virtues are but vices; as St. Jerome saith, all sacred truths are not to be known, but by revelation, natural endowments are beneficial, as one benefit of the remainder of nature is, that they which cross not the rules of morality live more innocent; For, were it not that those principles bare sway in most men’s lives, common honesty and justice could not be maintained.

Secondly, by nature we can never attain to grace, and so by those virtues we cannot prevail with God for Salvation; Yet they may for a temporal reward, as in the Romans, God rewarded moral virtue with victory and prosperity.

The third benefit it gets, they that observe the rules of nature, their accompt at the last day shall be far more easy; indeed, the Heathen shall be all turned into Hell, but the Damnation shall be more easy; Socrates less punished than Cato.

Lastly, a man that lives according to the rules of nature, keeps within the compass of these principles; though not able to reach at Salvation, yet their Conversion is more easy; it’s more possible to gain him to grace, this stock of nature is fit to graft grace and religion on more kindly; yet at the best it cannot fructify, and bring forth fruit to eternal life, but grace being graffed, it will fructify to Salvation. A man within the sphere of morality, that lives peaceable, sober, just, and of an humble mind; there is more hope of salvation in that man, he is not so far from the Kingdom of God, as those that sin against nature; evil and wicked men have some principles of knowledge; ye are evil, and yet ye know some good things.</p></blockquote>

an+that+lives+according+to+the+rules+of+nature%2C+keeps+within+the+compass+of+these+principles%3B+though+not+able+to+reach+at+Salvation%2C+yet+their+Conversion+is+more+easy%3B+it%E2%80%99s+more+possible+to+gain+him+to+grace%2C+this+stock+of+nature+is+fit+to+graft+grace+and+religion+on+more+kindly%3B+yet+at+the+best+it+cannot+fructify%2C+and+bring+forth+fruit+to+eternal+life%2C+but+grace+being+graffed%2C+it+will+fructify+to+Salvation.+A+man+within+the+sphere+of+morality%2C+that+lives+peaceable%2C+sober%2C+just%2C+and+of+an+humble+mind%3B+there+is+more+hope+of+salvation+in+that+man%2C+he+is+not+so+far+from+the+Kingdom+of+God%2C+as+those+that+sin+against+nature%3B+evil+and+wicked+men+have+some+principles+of+knowledge%3B+ye+are+evil%2C+and+yet+ye+know+some+good+things.%E2%80%9D%0A%0A%E2%80%94+Ralph+Brownrigg%2C+Repentance+and+prayer+or%2C+the+two+fundamental+pillars+of+the+nation.+Being+the+substance+of+four+sermons+preached+at+St.+Peter%E2%80%99s+Poor%2C+London.+By+that+famous+and+reverend+divine+Ralph+Brownrigg%2C+formerly+vice-chancellor+of+Cambridge%2C+and+lately+Lord+Bishop+of+Exeter%2C+%28London%3A+Thomas+Riland%2C+1660%29%2C+pp+138-40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F85f0ac6864.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/85f0ac6864.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/03/16/ralph-brownrigg-on-the-image-of-god-and-totally-depraved-sinners/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>All souls are rated and valued in God’s book, and account, at one and the same price; and therefore by nature are of equal worth and dignity. Under the law, the rich and the poor were to give the same ransom, Exod. 30: 15. “The rich shall not give more, and the poor shall not give less than half a shekel.” The redemption of souls, by the blood of Christ, costs one and the same price.

The poorest and the most despised soul that believes in Jesus, is as much indebted to him for the ransom of his soul, as the greatest and most illustrious person in the world. Moses, Abraham, Paul, &amp;c. did not cost Christ any thing more than poor Lazarus, or the meanest among all the saints did. “The righteousness of Christ is unto all, and upon all that believe, for there is no difference,” Rom. 3: 22.

But yet we must not understand this parity of human souls universally, or in all respects. Though being of one species or common nature, they are all equal, and those of them that are purchased by the blood of Christ are all purchased at one rate; yet there are divers other respects and considerations, wherein there are remarkable differences betwixt soul and soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pneumatologia. A Treatise of the Soul of Man</cite>, (1698) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 528.</span></figcaption>

</figure><figure class="quote" id="q-02553cb0e8" data-kw="">
<blockquote><p>Still, since God’s image has not been so completely erased in the soul of man by the stain of earthly affections, as to have left remaining there not even the merest lineaments of it whence it might be justly said that man, even in the ungodliness of his life, does, or appreciates, some things contained in the law; if this is what is meant by the statement that “the Gentiles, which have not the law” (that is, the law of God), “do by nature the things contained in the law,” and that men of this character “are a law to themselves,” and “show the work of the law written in their hearts,” — that is to say, what was impressed on their hearts when they were created in the image of God has not been wholly blotted out:— even in this view of the subject, that wide difference will not be disturbed, which separates the new covenant from the old, and which lies in the fact that by the new covenant the law of God is written in the hearts of believers, whereas in the old it was inscribed on tables of stone.

For this writing in the heart is effected by renovation, although it had not been completely blotted out by the old nature. For just as that image of God is renewed in the mind of believers by the new testament, which impiety had not quite abolished (for there had remained undoubtedly that which the soul of man cannot be except it be rational), so also the law of God, which had not been wholly blotted out there by unrighteousness, is certainly written thereon, renewed by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Spirit and the Letter</cite>, (412), 48 in Nicene and Post-Nicene Fathers 1, 5: 103.</span></figcaption>

</figure><figure class="quote" id="q-a521839e34" data-kw="">
<blockquote><p>‘Tis most reasonable considering the general state and nature of mankind. This is such as renders it most reasonable that we should love our neighbour as ourselves. For men are made in the image of God, and are worthy of our love upon this account.

And then, we are all nearly allied one to another by nature: we have all the same nature, like faculties, like dispositions, like desires of good, like needs, like aversion to misery, and are made of one blood. And we are made to subsist by society and union, one with another, and God has made us with such a nature that we can’t subsist without the help one of another.

Mankind in this respect are as the members of the natural body, are one, can’t subsist alone without an union with and the help of the rest. Now, this state of mankind shows how reasonable and suitable it is that men should love their neighbours, and that we should not look every one at his own things, but “every man also on the things of others” (Philippians 2:4).

A selfish spirit is very unsuitable to the nature and state of mankind. He that is all for himself and none for his neighbours deserves to be cut off from the benefit of human society, and to be turned out among wild beasts, to subsist as well as he can. A private, niggardly spirit is more suitable for wolves and beasts of prey than for human beings.

Loving our neighbour as ourselves is the sum of the moral law respecting our fellow creatures, and helping of them and contributing to their relief is the most natural expression of this love. It is vain to pretend to a spirit of love to our neighbour when it grieves us to part with anything for their help when under calamity. They that love only in word and in tongue, and not in deeds, have no love in truth; any profession without it is a vain pretense.

To refuse to give to them that are needy is unreasonable, because we therein do by others contrary to what we would have them do to us in like circumstances. We are very sensible of our own calamities, and when we suffer are ready enough to think that our state requires others’ compassion and help, and are ready enough to think hard if others won’t deny themselves to help us when in straits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Poor, Explained and Enforced (1733) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 376.</cite></span></figcaption>

<blockquote><p>God created man in his own image, in the image of God created he him; male and female created he them.” Man and woman were both equally endued with this likeness or similitude of their divine Creator; and clearly does this image consist not in any bodily shape or figure, which never can be said to resemble God, who is a Spirit incorporeal and invisible. This image must, therefore, be found in the nature of the rational soul, with which the body of man was united at his creation.

Nor was this rational soul merely a higher measure of that animal mind, with which the inferior creatures were endued, and which thus fitted him merely to be their lord and ruler in this world. It was something of a much higher order—a spiritual and immortal mind—an emanation from the Divine Spirit, directly communicated from the Father of all spirits. “The Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.” Man was thus, in his intellectual and moral nature, the offspring of God, bearing, as a child to a parent, a resemblance, incalculably limited indeed, and remote in degree, but nevertheless real and essential in kind, to that which is divine.

There is such a likeness of intelligence in man to his Maker, as to render him capable, in some respects, of thinking and feeling as God himself does. There is such a similarity in spiritual faculty, as to render him capable of maintaining a species of intercourse and sympathy with his infinite Creator. There was thus wrought in man’s creation “the miracle of miracles” — a creature formed from the earth, and dwelling upon the earth, yet capable of holding communion with the Supreme, capable of sensibly experiencing his spiritual influences, and intelligently apprehending his sacred will. …

But, in all this, we only express the capability of that living soul, which God originally breathed into man, for receiving his own image. We are taught, farther, the character of that living soul, as actually impressed with that image—as endued at his creation with “a knowledge, righteousness, and holiness,” similar in kind to the same attributes of the blessed Godhead.

These three qualities are so distinctly declared in the Inspired Word to be leading features of that image of God, to which his redeemed are restored, that it cannot be questioned that they formed the leading features of that Divine image or likeness in which man was created. “And have put on the new man, which is renewed in knowledge, after the image of him that created him.” “And that ye put on the new man, which after God is created in righteousness and true holiness” — knowledge in the understanding, righteousness in the will, and holiness in the affections.

The soul of man was created after the image of God, in regard to knowledge — a knowledge not merely intellectual, but spiritual — not merely resembling that which the fallen angels, or the natural man, may be capable of receiving, but resembling the knowledge of the Creator; a knowledge not, indeed, infallible as that of God, but agreeable to the mind of God—predisposed to the reception of moral truth, and endowed with a true understanding of his Maker and his will — of his own place and duty — of his own interests and happiness.

The soul of man was created after the image of God, in regard to righteousness, in such a state of heart and inclination of the will, as to approve all that was right, and good, and true; with the Divine law impressed on his soul, and with power imparted to fulfil it perfectly in all its demands.

The soul of man was created after the image of God, in regard to holiness, with the affections pure and well-regulated — free from all evil taint or bias — directed towards high and holy objects — drawn especially towards God himself, and delighting chiefly in his favour and fellowship.</p></blockquote>

<blockquote><p>Now who can be so insensible to the words of the apostle, who so foolishly, nay, so insanely ignorant of the purport of his statement, as to venture to affirm that the law is grace, when he who knew very well what he was saying emphatically declares, “Ye who are justified by the law are fallen from grace”? Well, but if the law is not grace, seeing that in order that the law itself may be kept, it is not the law, but only grace which can give help, will not nature at any rate be grace?

For this, too, the Pelagians have been bold enough to aver, that grace is the nature in which we were created, so as to possess a rational mind, by which we are enabled to understand,—formed as we are in the image of God, so as to have dominion over the fish of the sea, and over the fowl of the air, and over every living thing that creepeth upon the earth.

This, however, is not the grace which the apostle commends to us through the faith of Jesus Christ. For it is certain that we possess this nature in common with ungodly men and unbelievers; whereas the grace which comes through the faith of Jesus Christ belongs only to them to whom the faith itself appertains. “For all men have not faith.” Now, as the apostle, with perfect truth, says to those who by wishing to be justified by the law have fallen from grace, “If righteousness come by the law, then Christ is dead in vain;” so likewise, to those who think that the grace which he commends and faith in Christ receives, is nature, the same language is with the same degree of truth applicable: if righteousness come from nature, then Christ is dead in vain.

But the law was in existence up to that time, and it did not justify; and nature existed too, but it did not justify. It was not, then, in vain that Christ died, in order that the law might be fulfilled through Him who said, “I am come not to destroy the law, but to fulfil it;” and that our nature, which was lost through Adam, might through Him be recovered, who said that “He was come to seek and to save that which was lost;” in whose coming the old fathers likewise who loved God believed.</p></blockquote>

<blockquote><p>God created Man in His own Image in respect of Life and Immortality. God made Adam a living Soul that can never die, a natural Image of HIM who only hath Immortality. And God covenanted with Adam that tho’ his Body was corruptible in it self, yet He would preserve it in Health, Ease and Strength, and it should never see Death in case he never sinned. God gave him therefore the Tree of Life to eat of, a Sign Pledge and Means of Immortality to his Body, and of the Continuance of Happiness to him in Soul and Body all his Days on Earth; and I doubt not it was also a Seal and Assurance to him of a Translation to a better World, a better Paradise in due Time.

Man could not but begin to be because he was a Creature; no more could the Angels of Heaven. God only is Eternal, from Everlasting to Everlasting, without Beginning or End. Spirits that can never cease to be, yet once were not. By God were the Invisible Thrones and Dominions above created, and so likewise the Spirits in Flesh. Both were made for an everlasting Existence and Duration. The Word of God’s Power upholds them in Being, whether in a holy and happy State, or in their sinful and miserable Condition.

This Immortality simply considered is a signal Likeness of the Everlasting Father upon his Offspring. Angels are in this Image of God upon them for ever and ever: Their Being, Glory, Blessedness, Joys are sure of an everlasting Duration. And Souls that are here sanctified in Jesus Christ are sure of going to Him at Death, and of Blessedness in his Likeness for Evermore. This Life and Immortality is bro’t to Light by the Gospel, and we are begotten to the lively Hope of it by the Resurrection of Jesus Christ from the dead. The Promise which GOD hath promised is this Eternal Life, in Soul and Body united, unto all them that by patient Continuance in well doing, seek after it.

And this shows us the Original State of Man; to what Life and Happiness he was designed and prepared in his Creation, in Conformity to the Life and Blessedness of his MAKER, even for an everlasting seeing serving and Enjoyment of Him. This therefore was an eminent Part of the Divine Image and Likeness on our First Parents, in the Day when they received their Being. They knew themselves made for Immortality, and that their present happy Circumstances could never cease, but might increase for ever and ever, and be changed for better and better, higher and high: to Everlasting. Death therefore was set before them to deter them from Sin; Death bodily and spiritual; not a Period to their Existence but to their Happiness; which alone is to be called Life; for to exist in Misery, in any great Degree of it, is Death rather than Life, and a reasonable Creature would chuse Strangling, rather than such an Existence. —

We read therefore of the Soul in a State of Misery, that it shall never see Life; and the second Death has power over it. The Curse comes on that Soul in the very Letter of it, In dying thou shalt die. The miserable Spirits in Hell are for ever dying, and yet never die; never see an End of their Misery; their Worm dieth not, and the Fire is not quenched. Here is the Loss of the Image of God to the uttermost. For God lives in the Perfection of Bliss, in ineffable inconceivable Blessedness, for ever and ever: And so do Angels and glorified Spirits in His Likeness and Favour: They have an Eternity of Happiness before them: But sinning Angels, and impenitent damned Souls, are in everlasting Chains of Darkness, reserved to unquenchable Fire and everlasting Burnings. The Image of Immortality upon them is an everlasting Curse! the Reverse of that Living Happy Soul which God at first made us.

Indeed there is no Image of God’s Self-Existence, his necessary Existence, his Independent Essence, his proper Eternity and Unchangeableness, in the immortal Nature of Angels or Men, or in the happy Immortality of holy Spirits. God is the High and lofty ONE that inhabiteth Eternity; having Life in Himself. Only the Eternal Word and Spirit who are One with the Father, are also the Brightness and express Image of his Eternal Glory. Yet every immortal Spirit is an Image of the Vital Being from Whom it came; in Whom alone is the Origin of Life, and the Life is the Light of Men and Angels: i. e. the Living God is the Spring and Fountain of it; as the Psalmist sings, “For with Thee is the Fountain of Life. When Man recovers his first and proper Immortality, as the Righteous shall do at the Resurrection, then the Image of God will be perfectly restored in him, never to be lost again.</p></blockquote>

<blockquote><p>IV. God created Man in his own Image, after his Likeness, in respect of Dominion. These are the express Words of Moses, God said, Let Us make Man in Our Image, after Our Likeness, and let them have DOMINION.

God is LORD of all! this is his Glory and unalienable Right, to reign and rule. He cannot deny Himself, and wo to his Creation should his Government and Providence cease. His is the Power and Kingdom; He is GOD over all; the Most High, Possessor of Heaven and Earth. Heaven is his Throne, and the Earth his Footstool. Angels, Authorities and Powers are all under his Feet. He is the One Lawgiver and Judge, the Lord of Hosts and King of Glory. Wisdom and Might are His: his Dominion is an Everlasting Dominion, and his Kingdom from Generation to Generation.

Intellectual and moral Creatures carry an Image of God’s Dominion in their Nature. They are made for Rule and Government in their Places. Angels are therefore called Dominions and Thrones, Principalities and Powers. And Man was in like manner made for Government here on Earth. The Fear of him was put upon the Creatures, and they herein are put under his Feet. God first said to him, Have thou Dominion, and then bro’t them to Adam to give them Names. So he gave him Possession of them all. This is celebrated in the Eighth Psalm; the Glory is given to God and all Pride is hidden from Man: “What is Man that Thou art mindful of him! Thou hast made him a little lower than the Angels, and hast crowned him with Glory and Honour.

Man is made for Dominion in his Place as Angels are in their. Rational and moral Powers are given to be sure to be used and applied, to great and good Ends and Purposes, respecting God, Self, and Fellow Creatures, in one World or other. The Application of these Powers must be in Subjection to God, the Government of our Selves, and a righteous Conduct toward others, below or above us, or on a Level with us.

But principally Man’s Glory is, that he is made for Self-Government, for Rule over himself, for a Possession of his own Soul, the Government of his own Mind and Will, Desires and Appetites, Thot’s, Words and Actions.

This was the Dominion he was principally designed for, and invested with. The Law of his God put within him, and given to him in Words as soon as he found himself in Being, sufficiently told him this. It spake indeed plainly his Subjection to-God, that he was made for Obedience and a reasonable Service; But it spake also his Pre-eminence above the Creatures put under him, in a distinguishing Power for the Rule of his own Actions, with Understanding and Choice, Liberty and Freedom, and from a Conscience of right and wrong.

Understanding and Wisdom, the Power of Tho’t and Consideration was given to Man for this End. “The Lord God put the Man into the Garden to dress and keep it, and He commanded the Man, saying &amp;c. Thus Man was made under the Law to God, a Law to himself, and was both able and inclined to do the Will of God, and to govern himself thereby. And this Power for Self-Government, by the Light and Law of God within him, and by the Will of God revealed to him, was the Image of his God upon him.

For the Divine Dominion and Government is in the Perfection of Wisdom and Righteousness. The Sceptre of his Kingdom is a right Sceptre. He does according to his Will in the Armies of Heaven, and among the Inhabitants of the Earth; but his Will is perfect, his Ways are Truth and Judgment, He is holy in all his Work, just and right is He.

Therefore the Subjection of Man to God is his governing Himself, in all his Thot’s Words &amp; Actions, in a wise, righteous and superior manner; as becomes a Creature in the Likeness of God, and made for Authority and Rule on Earth.</p></blockquote>

low+Creatures%2C+in+one+World+or+other.+The+Application+of+these+Powers+must+be+in+Subjection+to+God%2C+the+Government+of+our+Selves%2C+and+a+righteous+Conduct+toward+others%2C+below+or+above+us%2C+or+on+a+Level+with+us.%0A%0ABut+principally+Man%E2%80%99s+Glory+is%2C+that+he+is+made+for+Self-Government%2C+for+Rule+over+himself%2C+for+a+Possession+of+his+own+Soul%2C+the+Government+of+his+own+Mind+and+Will%2C+Desires+and+Appetites%2C+Thot%E2%80%99s%2C+Words+and+Actions.%0A%0AThis+was+the+Dominion+he+was+principally+designed+for%2C+and+invested+with.+The+Law+of+his+God+put+within+him%2C+and+given+to+him+in+Words+as+soon+as+he+found+himself+in+Being%2C+sufficiently+told+him+this.+It+spake+indeed+plainly+his+Subjection+to-God%2C+that+he+was+made+for+Obedience+and+a+reasonable+Service%3B+But+it+spake+also+his+Pre-eminence+above+the+Creatures+put+under+him%2C+in+a+distinguishing+Power+for+the+Rule+of+his+own+Actions%2C+with+Understanding+and+Choice%2C+Liberty+and+Freedom%2C+and+from+a+Conscience+of+right+and+wrong.%0A%0AUnderstanding+and+Wisdom%2C+the+Power+of+Tho%E2%80%99t+and+Consideration+was+given+to+Man+for+this+End.+%E2%80%9CThe+Lord+God+put+the+Man+into+the+Garden+to+dress+and+keep+it%2C+and+He+commanded+the+Man%2C+saying+%26c.+Thus+Man+was+made+under+the+Law+to+God%2C+a+Law+to+himself%2C+and+was+both+able+and+inclined+to+do+the+Will+of+God%2C+and+to+govern+himself+thereby.+And+this+Power+for+Self-Government%2C+by+the+Light+and+Law+of+God+within+him%2C+and+by+the+Will+of+God+revealed+to+him%2C+was+the+Image+of+his+God+upon+him.%0A%0AFor+the+Divine+Dominion+and+Government+is+in+the+Perfection+of+Wisdom+and+Righteousness.+The+Sceptre+of+his+Kingdom+is+a+right+Sceptre.+He+does+according+to+his+Will+in+the+Armies+of+Heaven%2C+and+among+the+Inhabitants+of+the+Earth%3B+but+his+Will+is+perfect%2C+his+Ways+are+Truth+and+Judgment%2C+He+is+holy+in+all+his+Work%2C+just+and+right+is+He.%0A%0ATherefore+the+Subjection+of+Man+to+God+is+his+governing+Himself%2C+in+all+his+Thot%E2%80%99s+Words+%26+Actions%2C+in+a+wise%2C+righteous+and+superior+manner%3B+as+becomes+a+Creature+in+the+Likeness+of+God%2C+and+made+for+Authority+and+Rule+on+Earth.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Colman%2C+A+dissertation+on+the+image+of+God+wherein+man+was+created%2C+%28Boston%3A+S.+Kneeland+and+T.+Green%2C+1736%29%2C+pp+15-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F488d5644be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/488d5644be.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/05/benjamin-colman-on-the-image-of-god-4/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>III. Man was eminently created by God in his own Image, after his Likeness, in respect of Sanctity and Holiness, Integrity and Rectitude.

There is a moral as well as intellectual Perfection. The Blessedness of God and his Glory lies in both. HE is infinitely and unchangeably possess’d of both. Nor is there any possible Perfection of Souls or Angels, but it must be both in Mind and Understanding, and also in Will and Affections. This is to follow the Dictate of that, and then the Light of God rules in the Heart; which is what we are call’d to by the Voice of Reason and Scripture. Then all is regular, wise, just, perfect.

There is none Holy as the Lord. He is glorious in Holiness. Holy, Holy, Holy, is his Name. Christ is the Holy One of God, and all the Angels of Heaven are holy Ones. They proclaim the equal Holiness of Father Son and Spirit, while they treble the Praises of the Divine Holiness. What then should be the Image of God on the Seraphims but their Holiness? while with cover’d Faces they make the Superlative Holiness of God the Subject of their Adoration. They never cease from this, They rest not Day and Night saying, Holy, Holy, Holy, Lord God Almighty! which art and wast and art to come. The Work of Saints on Earth is just the same, Exalt the Lord our God and worship at his Footstool, for the Lord our God is holy. And again, Give Thanks at the Remembrance of his Holiness.

This renders God fearful in Praises, that He is glorious in Holiness. “A perfect Understanding must have a perfect Will, and where the Mind and Will is perfect there must be perfect Holiness. Therefore is the Name of God most holy and reverend. He must needs be Holy in all his Works. He must needs then make Angels and Men holy. They could not come other out of his holy Hand. The Impress and Stamp of his Holiness must be upon them. Being capable of this Image of God, and it being necessary to their Perfection, they could not possibly be destitute of it. If every Word of God is pure, so is every Work. He cannot look upon Iniquity, he is of purer eyes than to behold it, he hates and loaths it, and loves Righteousness.

This bears his own Likeness, and is therefore lovely in his Eyes, for he infinitely loves Himself. We read, The Lord loveth the righteous: why? but because He is Himself righteous, and those that love and do Righteousness are like to Him. This one Thing is easily found, nor is all the Wisdom of Solomon needed to find it out, that God made Man upright. He could not make him otherwise. This Uprightness in the Creature is the Image of God upon it.

Men are Partakers of a Divine Nature, in the Regeneration of Souls. They are made upright and sincere in the Sight of God. Integrity and Uprightness preserves them, and they escape the Corruption that is in the World thro’ Lust, and add to their Faith, Virtue, Knowledge, Temperance, Patience, Godliness, brotherly Kindness and Charity. The Sons of Men (you see here) are capable of such a Glory and Likeness to God as to become again Partakers of the Divine Nature. This cannot possibly mean any thing more or less than some Restoration of the Image of God in them. The Loss of that Image is supposed, and it is said to be the Want of Original Righteousness &amp; the Corruption of his whole Nature.

He has corrupted himself thro’ Lust, and the World lies in this Corruption, it is propagated from Age to Age, and common to all Places. But then there is thro’ Grace an Escaping out of this Corruption, which some are made Partakers of, thro’ Sanctification of the Spirit. That is to say, they are made holy, virtuous, wise, temperate, patient, godly by the Power of Divine Grace, making a glorious Change in them; whereby they do again partake of that Divine Nature which was the Likeness of God upon Man in his first Creation.

This is the true and genuine Meaning of St. Peter‘s Words, repeated in the next Chapter They have escaped the Pollutions of the World, thro’ the Knowledge of the Lord and Saviour Jesus Christ. These the Holy Ghost calls new Men and new Creatures; being renewed in the Spirit of their Mind; the old Man being put off, which is corrupt according to deceitful Works, and the New Man put on, which after God is created in Righteousness &amp; true Holiness. See here the Image of God wherein Adam was created, and into which the Elect of God are recovered by the Power and Efficacy of the Gospel, which calls us with a holy Calling, from Uncleanness unto Holiness. This is the Image of God’s dear Son, and this is his Calling, Be ye Holy, for I am Holy. So we are made Children and adopted in Christ; for the HOLY ONE will put no other among his Children, but those in whom he puts this Likeness to Himself, his Son and Spirit.</p></blockquote>

<blockquote><p>II. God made Man in his own Image in respect of Intellect and Understanding, Knowledge and Wisdom.

God is the Only-wise perfect in Knowledge, and his Understanding is infinite. So his Word speaks of Him, and his Works declare it of Him. He that formeth the Eye, shall He not see? and He that teacheth Man Knowledge shall He not know? There is not a Soul so brutish as not to allow this.

Man, in his Soul and Body is the most eminent Display of the Knowledge and Wisdom of God here on Earth. The Mind and Eye of Man survey the Heavens, Earth, Seas and all the Creatures, and see how in Wisdom God hath made them all. Then we behold our Selves alone, among all the Creatures here on Earth, capable of this Understanding, and are led to say unto our Selves and unto God, Where is God my Maker! that teacheth me more than the Beasts of the Earth, and maketh me wiser than the Fowl of Heaven.

Man in his first State was happy and glorious in a Perfection of Knowledge and Wisdom, proper for an imbodied Spirit. He had not the Knowledge of Angels, for he was made lower than they; but he was wise as an Angel in Flesh should be. He was created with a due Knowledge of God his Maker, of Himself, and of the Creatures about him. God spake to our first Parents, and they to each other in an admirable manner, as is related by Moses. Their Minds were full of Light, the Law of God was in their Heart, and they were in the Possession of their own Souls and of Intellectual Happiness. They wanted no more Knowledge of Good at the Time, and to be sure needed no Knowledge of Evil.

This Understanding of Man was a Beam from the Light of the Knowledge and Glory of God upon him. God made him like Himself an Intellect, an Intelligence; the Inspiration of the Almighty gave him his Understanding. In his Light Man saw Light. And now Souls are renewed in Knowledge after the Image of God. They are renewed into the Likeness, in part, wherein they were first created. As they grow in holy Knowledge, they are changed more and more into the Divine Image from Glory to Glory.

The Devil tempted our Parents to aspire after more Knowledge, and so they fell. The Father of Light had given them as much of this perfect Gift as was good and fitting for them. This should have highly contented them, and filled ’em with Delight and Thankfulness. And so it did, until the false Fiend persuaded them to think, that GOD forbid ’em the Tree of Knowledge left it should make ’em wiser and better than they were.

Alas! they found nothing by it but the Knowledge of Sin and Misery, of which it was their Happiness to be ignorant; and they lost the Knowledge of all the Good which they before enjoyed. We remain miserable, and perish in our Ignorance of God, unless we are renewed after Him in Knowledge. True spiritual Wisdom is restored in the Regeneration of Souls. God gives the Light of the Knowledge of his Glory in the Face of JESUS CHRIST. They who were sometimes Darkness, are made Light in the Lord. They are full of Goodness, filled with all Knowledge.

That the Soul be without Knowledge, is not good. It is very evil to it to be so. What is a dark and blind Soul good for! the Light that is in it is Darkness. The Light of Life is from the Father of Glory, the Father of Christ, the Eyes of our Understanding being-enlightned, to know the Hope of his Calling. God gives the Spirit of Wisdom and Revelation in the Knowledge of his Son. This is the Image of the Father restored in his Elect. So they become again the Children of God; filled with the Knowledge of his Will, in all Wisdom and spiritual Understanding.

What a bright Account is this, given by the Holy Ghost, of the Image of God on the Soul of Man, in respect of Knowledge! Not only has Man an Understanding which reflects on its own Acquirements, and (as an excellent Divine of our own says) “reads its own Knowledge, and communicates it to others; but the true and high Glory of this created Intellect is,” that it is capable of knowing God unto Eternal Life; for this is Life Eternal to know Him the only true God and Jesus Christ whom be has sent. And if Souls regenerated by the Spirit of God receive from him a sanctified Mind, a spiritual Discerning of Things relating to their own Duty and Happiness; how much more must we suppose our first Parents in their state of Integrity and Perfection to be bless’d with a most holy Knowledge and spiritual Discerning?</p></blockquote>

God is the Only-wise perfect in Knowledge, and his Understanding is infinite. So his Word speaks of Him, and his Works declare it of Him. He that formeth the Eye, shall He not see? and He that teacheth Man Knowledge shall He not know? There is not a Soul so brutish as not to allow this.

Man, in his Soul and Body is the most eminent Display of the Knowledge and Wisdom of God here on Earth. The Mind and Eye of Man survey the Heavens, Earth, Seas and all the Creatures, and see how in Wisdom God hath made them all. Then we behold our Selves alone, among all the Creatures here on Earth, capable of this Understanding, and are led to say unto our Selves and unto God, Where is God my Maker! that teacheth me more than the Beasts of the Earth, and maketh me wiser than the Fowl of Heaven.

Man in his first State was happy and glorious in a Perfection of Knowledge and Wisdom, proper for an imbodied Spirit. He had not the Knowledge of Angels, for he was made lower than they; but he was wise as an Angel in Flesh should be. He was created with a due Knowledge of God his Maker, of Himself, and of the Creatures about him. God spake to our first Parents, and they to each other in an admirable manner, as is related by Moses. Their Minds were full of Light, the Law of God was in their Heart, and they were in the Possession of their own Souls and of Intellectual Happiness. They wanted no more Knowledge of Good at the Time, and to be sure needed no Knowledge of Evil.

<blockquote><p>And keeping my Eye upon this pure Word of God, it appears plain and evident that the Image of God on Man, in the Day when God created Him, consisted in the following Things.

I. GOD made Man a Spirit, a living Soul, and this was his Likeness to his MAKER, the Image of God upon him.

If you ask, what God is? Christ has revealed Him, John iv. 24. God is a Spirit. And if you ask, what Man is, Moses tells us, He is a living Soul. In his Soul he bears the Image of God, and not in his Body. His Body is of the Dust and returns to it, when his Spirit returns to God, the Infinite Spirit, the Father of Spirits, the Lord, Ruler and Judge of Spirits, the only Portion and Felicity of Souls.

God claims the Soul for his own, even all Souls, the Soul of the Father and of the Son. This unseen Part of Man bears the Image of the Invisible and Incorruptible God. Were the Body a thousand times more elegant and wonderful a Form than it is, or even as it will be after the Resurrection, yet it were utterly impossible and unlawful to conceive of it as any Likeness of God. As when God would be seen in the Mount by the Elders of Israel, they saw no manner of Similitude. The Face and Eye and Hands of Men are full of Spirit and Life, from the living Spirit within that animates and acts ’em. These are attributed to God in Scripture in way of Accommodation to Souls here in the Body. But the first thing in the Image of God on Angels and Men is Spirituality. What should be the Likeness of the Living God, but a living Soul or Spirit?

Indeed we little know what our Souls are: Yet we are sure that we are such, because we think, reason, remember, reflect, foresee, hope, fear, &amp;c. What the Spirituality of God is, is far more inconceivable to us. He is Infinite, filling Heaven and Earth. Whither can we go from His Presence and Spirit? The Rays of Light, the Wings of the Morning are not equal to the Thoughts of Men, for Brightness and Swiftness. In one Moment of Tho’t my poor Mind reaches the third Heaven, a million times beyond the Sun in its Zenith. This Soul is a poor, low feeble Image of the Immensity, Spirituality and Omniscience of God. HE searches the Heart of Man, weighs his Spirit, and knows his Tho’t afar off. This is too wonderful for us, it is high and we cannot attain to it.</p></blockquote>

</figure><figure class="quote" id="q-f0e55909eb" data-kw="">
<blockquote><p>And man is the image of God, and not only the looking glass of his power, but also of his nature after a manner, for man of all other creatures of the world cometh nearest to the nature of God, and carried the very form of him in the light of his mind and the uprightness of his will, which was in him at his first creation.

But Christ who is God manifested in the flesh, who was without sin, in whom the Godhead remained, who in his whole life and by all means shewed forth the nature, similitude &amp; figure of God through his great power, wisdom, and clemency, is in a far more excellent respect the image of God than was the first man, although he were sound and perfect.

Wherefore, the world hath no such similitude and likeliness with Christ, who is unto us not only the image, and as it were the shadow of the goodness, Wisdom, and Power of God, but also the most bright, and self-same representation of the fathers substance: Hebrews the 1. chapter and 3. verse. And therefore he is not called only the image, but also the lively brightness of the Fathers glory. And yet farther to the intent it may be the better understood, what, and how great the difference is we must note, that the world and man are a notable, but yet a shadowed representation of those things which they do teach us, concerning god.

And Christ the express and lively form, in whose inward, natural, and substantial brightness, we may most evidently behold the infinite power of God, and incomprehensible love towards us men. Thus therefore, when we think upon God and behold him in all other things, such is our vanity, that immediately we decay and come to naught: but when we look upon him in Christ, we are quieted and stayed most firmly and substantially. Wherefore there ought no comparison be made between these, which differ in kind, and manner of representation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wonderful workmanship of the world wherein is contained an excellent discourse of Christian natural philosophy, concerning the form, knowledge, and use of all things created: specially gathered out of the fountains of holy Scripture</cite>, trans. Thomas Twyne (London: Andrew Maunsell, 1578), pp 69-70.</span></figcaption>

— Lambert Daneau, The wonderful workmanship of the world wherein is contained an excellent discourse of Christian natural philosophy, concerning the form, knowledge, and use of all things created: specially gathered out of the fountains of holy Scripture, trans. Thomas Twyne (London: Andrew Maunsell, 1578), pp 69-70.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+man+is+the+image+of+God%2C+and+not+only+the+looking+glass+of+his+power%2C+but+also+of+his+nature+after+a+manner%2C+for+man+of+all+other+creatures+of+the+world+cometh+nearest+to+the+nature+of+God%2C+and+carried+the+very+form+of+him+in+the+light+of+his+mind+and+the+uprightness+of+his+will%2C+which+was+in+him+at+his+first+creation.%0A%0ABut+Christ+who+is+God+manifested+in+the+flesh%2C+who+was+without+sin%2C+in+whom+the+Godhead+remained%2C+who+in+his+whole+life+and+by+all+means+shewed+forth+the+nature%2C+similitude+%26+figure+of+God+through+his+great+power%2C+wisdom%2C+and+clemency%2C+is+in+a+far+more+excellent+respect+the+image+of+God+than+was+the+first+man%2C+although+he+were+sound+and+perfect.%0A%0AWherefore%2C+the+world+hath+no+such+similitude+and+likeliness+with+Christ%2C+who+is+unto+us+not+only+the+image%2C+and+as+it+were+the+shadow+of+the+goodness%2C+Wisdom%2C+and+Power+of+God%2C+but+also+the+most+bright%2C+and+self-same+representation+of+the+fathers+substance%3A+Hebrews+the+1.+chapter+and+3.+verse.+And+therefore+he+is+not+called+only+the+image%2C+but+also+the+lively+brightness+of+the+Fathers+glory.+And+yet+farther+to+the+intent+it+may+be+the+better+understood%2C+what%2C+and+how+great+the+difference+is+we+must+note%2C+that+the+world+and+man+are+a+notable%2C+but+yet+a+shadowed+representation+of+those+things+which+they+do+teach+us%2C+concerning+god.%0A%0AAnd+Christ+the+express+and+lively+form%2C+in+whose+inward%2C+natural%2C+and+substantial+brightness%2C+we+may+most+evidently+behold+the+infinite+power+of+God%2C+and+incomprehensible+love+towards+us+men.+Thus+therefore%2C+when+we+think+upon+God+and+behold+him+in+all+other+things%2C+such+is+our+vanity%2C+that+immediately+we+decay+and+come+to+naught%3A+but+when+we+look+upon+him+in+Christ%2C+we+are+quieted+and+stayed+most+firmly+and+substantially.+Wherefore+there+ought+no+comparison+be+made+between+these%2C+which+differ+in+kind%2C+and+manner+of+representation.%E2%80%9D%0A%0A%E2%80%94+Lambert+Daneau%2C+The+wonderful+workmanship+of+the+world+wherein+is+contained+an+excellent+discourse+of+Christian+natural+philosophy%2C+concerning+the+form%2C+knowledge%2C+and+use+of+all+things+created%3A+specially+gathered+out+of+the+fountains+of+holy+Scripture%2C+trans.+Thomas+Twyne+%28London%3A+Andrew+Maunsell%2C+1578%29%2C+pp+69-70.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff0e55909eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f0e55909eb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/21/lambert-daneau-on-christ-the-image-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>And his [Adam’s] soul was in a very perfect state, the faculties of it in full strength, not broken, impaired, and weakened and ruined, as they are now. The soul of man with regard to the quickness and clearness of its faculties was then like the heavenly intelligences — as a flame of fire. The natural image of God that consists in reason and understanding was then complete.

And man then had excellent endowments. His mind shone with the perfect spiritual image of God, being without any defect in its holiness and righteousness, or any spot or wrinkle to mar its spiritual beauty. God had put his own beauty upon it; it shone with the communication of his glory. And man enjoyed uninterrupted spiritual peace and joy that hence arose. His mind was full of spiritual light and peace as the atmosphere in a clear and calm day. …

And man lost that which was his highest excellency and the proper glory of human nature, viz. his original righteousness and the spiritual image of God. And herein he lost his spiritual peace and comfort. This ceased to shine; there was a total eclipse of it in his mind, and the gloom of a guilty conscience and the darkness of sin began to fill his mind.</p></blockquote>

<blockquote><p>But if we take in the whole extent of the image of God, we say, it is made up of these three parts. 1st. Antecedently, that it consists in the spiritual and immortal nature of the soul, and in the faculties of understanding and will. 2dly. Formally and principally, in these enduments, or qualities of the soul, viz. righteousness, and holiness. 3dly, Consequentially, in the immortality of the whole man, and his dominion over the creatures.</p></blockquote>

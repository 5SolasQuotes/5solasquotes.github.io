<blockquote><p>I. It is a matter of the greatest moment, that we learn distinctly to consider the covenant of grace, either as it is in its substance or essence, as they call it, or as it is in diverse ways proposed by God, with respect to circumstantials, under different economies. If we view the substance of the covenant, it is but only one, nor is it possible it should be otherwise. There is no other way worthy of God, in which salvation can be bestowed on sinners, but that discovered in the Gospel. Whence the apostle, Gal. 1:7, has beautifully said, “which is not another.” And that testament which was consecrated by the blood of Christ, he calls “everlasting,” Heb. 13:20, because it was settled from eternity, published immediately upon the fall of the first man, constantly handed down by the ancients, more fully explained by Christ himself and his apostles, and is to continue throughout all ages, and, in virtue of which, believers shall inherit eternal happiness. But if we attend to the circumstances of the covenant, it was dispensed “at sundry times and in divers manners,” under various economies for the manifestation of the manifold wisdom of God. In considering this, we are first to discourse on those general things which appertain to the substance of the covenant, and have continued in every age; and then explain the different economies or dispensations, and the new accessions made to each; which we will, first, do in a general and concise manner, in this and the following chapter; then gradually descend to the more special considerations. II. We therefore maintain, agreeable to the sacred writings, that to all the Elect, living in any period of time: 1st, One and the same eternal life was promised. 2dly, That Jesus Christ was held forth as the one and the same author and bestower of salvation. 3dly, That they could not become partakers of it any other way, but by a true and lively faith in him. If we demonstrate these three things, none can any longer doubt, but that the covenant of grace must be, as to its substance, only one from the beginning. For, if the salvation be the same, and the author of it the same, the manner of communion with him the same, it is certain, the covenant itself cannot be more than one. II. The Scriptures so plainly declare, that eternal life was promised to the Elect from the beginning, that if is astonishing any Christians could venture to deny it; who, indeed, are much blinder than the Jews themselves; of whom our Lord testifies, John 5:39. “Ye do search the Scriptures, for in them ye think ye have eternal life:” and that they were neither rash nor erroneous in thinking that the promises of eternal life, and the manner of enjoying them, were contained in the Scriptures they had, we prove by the most cogent arguments. 1st, Because, not only the Lord Jesus does not charge them, in this respect, with the least error, but makes use of that as a reason to recommend to them the search of the Scriptures. But it is very inconsistent with the great sincerity of the Lord Jesus, and the divine dignity of the Scriptures, to recommend them by arguments not genuine, or to recommend their value and usefulness from Jewish forgeries. Nay, had the Jews falsely persuaded themselves, that the promises of eternal life were contained in the Old Testament records, our Lord ought not, by any concession, to have cherished that mistake, which would have hindered them from acknowledging the excellence of his doctrine, and consequently the divinity of his person; but rather to have exclaimed against them: “In vain do you search the Scriptures, in hopes of finding eternal life in them; attend rather to me and my doctrine, who am the first who came into the world as a preacher of eternal life.” But every one may see how inconsistent this was from the design of the Lord Jesus. 2ndly, To this we add, that Paul’s hope was founded on the Law and the Prophets, as well as the expectation of the Jews, Acts 24:14, 15, “Believing all things, which are written in the Law and the Prophets; and have hope towards God, which they themselves also allow, that there shall be a resurrection of the dead, both of the just and unjust.” He testifies, that the Jews expected a resurrection of the dead; he professes the same belief and hope with them; and that he did not do so out of a vain presumption, but from a faith resting on the Law and the Prophets, which they also, in their manner, carefully read, and from which they had derived the same expectation with him. 3dly, The Jews were so far from judging amiss in this respect, that, on the contrary, the Lord Jesus reproved the Sadducees, as ignorant of the Scriptures, because from them they had not learned life eternal and the resurrection, Matt. 22:29. IV. But let us argue from the very books of the Old Testament: and first, after the example of our Lord, who, Matt. 22:31, 32, speaks to this purpose: “But, as touching the resurrection of the dead, have ye not read that which was spoken unto you by God, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob; God is not the God of the dead, but of the living.” This inference appeared so evident to the multitude, that they were astonished at his doctrine, and the Sadducees were put to silence, ver. 33, 34. And, indeed, if the words of Moses, quoted by Christ, be accurately weighed, the evidence of this argument will easily appear to the attentive reader. V. For, 1st, That expression, to be God to any, in its full import, includes life eternal, For, when God becomes the sinner’s God, he then becomes to him what he is to himself. But, what is he to himself? Doubtless, the fountain of eternal and complete blessedness. When God, out of his grace, gives himself to man, he gives him all things; for himself is all things. Such a man finds in God “a shield” against every evil, and an “exceeding great reward,” Gen. 15:1. And what can he desire more in order to his perfect happiness? Accordingly, the apostle joins these two, Heb. 11:16, God to be the God of any one, and to have prepared for them a city. And seeing the “gifts” of God’s grace, especially when he gives himself, “are without repentance”, Rom. 11:29; hereby also the eternity of this happiness is established. …XVII. But lest they should cavil, that we borrow our arguments only from the New Testament (though none can better instruct us in the contents of the Old Testament than Christ and his apostles), we shall consider some passages of the Old Testament, and free them from the misconstructions of our adversaries. And, first, we have that swanlike song of Jacob, Gen. 49:18. לישועתך קויתי יהוה “I wait for thy salvation, O Lord.” The aged Prophet was now at the point of death; and, being full of the Spirit of God, he, in the midst of his prophecies, in which he foretels what was to befall his children and latest posterity, breaks out into these words; which were not spoken without the Spirit of God, so as, with Smalcius, to be referred to a vain persuasion, nor possibly to be wrested to any other but this spiritual and eternal salvation. XVIII. Here, again, let a certain Jew put the followers of Socinus, if possible, to the blush: in opposition to whom we produce this paraphrase of the Jerusalem Targumist. “Our father Jacob said, My soul does not expect the redemption of Gideon, the son of Joaz, that being only momentary; nor the redemption of Samson, because a transient redemption; but the redemption thou hast mentioned in thy word, or by thy word, which is to come to thy people, the children of Israel; my soul, I say, expects this thy redemption.” Is not this a very clear testimony of the most certain persuasion and the fullest assurance of their salvation? …XXXIII. When the same apostle affirms that our “salvation at the first began to be spoken by the Lord,” Heb. 2:3, it is clear he speaks of the Gospel completed, and of the Messiah, the author of salvation, already exhibited; which Gospel the Lord first published, with respect to the apostles, evangelists, and the other ordinary preachers that followed them. For otherwise who can deny that Zacharias, the father of John the Baptist, and Mary the mother of our Lord, and the angels who proclaimed his nativity, and the aged Simeon, and John the Baptist, were preachers of salvation before the Lord? Of the Fathers the apostle himself affirms, that they were ευαγγελισμενοι, gospelized, or that “the Gospel was preached unto them as well as unto us,” Heb. 4:2. XXXIV. When it is written, Heb. 9:8. “That the way unto the holiest of all was not yet made manifest, while as the first tabernacle was yet standing;” the apostle indeed intimates, that the manner of obtaining salvation was, in some measure hid, in comparison of the brighter lustre of the Gospel. For then, doubtless, the way to life was clouded with much pomp of ceremonies and figures; which being now dispelled, we behold with open face, and ardently desire, heavenly and spiritual things. But from this it no ways follows, that those under the Old Testament had no knowledge of salvation; any more than it can be concluded, we know nothing of our glorious state, because John says, “It doth not yet appear what we shall be,” John 3:2. We may almost, in the same manner, answer the other objections advanced by our adversaries. But it is no part of our design to examine each in particular. XXXV. Now let us proceed to the second thing, which we undertook to prove; that in Christ, and in virtue of his suretiship, the fathers of the Old Testament also obtained salvation even as we. Which Peter declares almost in so many words, Acts 15:11: “But we believe that, through the grace of the Lord Jesus Christ, we shall be saved even as they.” Where the pronoun they is to be referred to the fathers, on whose neck an insupportable yoke of ceremonies was put, as appears both from the grammatical consideration of the gender, from the connexion and the force of the apostles argument. For, since κᾀκεῖνοι is masculine and τα ἔθνα, the Gentiles, mentioned ver. 7, is neuter, it is not so properly referred to the Gentiles as to the fathers. And we are not here, without necessity, to have recourse to an enallage of gender. And then, too, what method of commenting is it, to imagine so wide an hyperbaton or transposition, and to bring from verse 7 a noun, to which, after the interposition of so many other things, a pronoun shall at length answer in eleventh verse, and which yet does not answer; because, in the words immediately preceding, you may find a noun, with which the pronoun in question may be very well joined? In fine, it will either be nonsense, or, very insipid, if the words be so construed. For, what manner of reasoning is it, if we suppose the apostle to have said: “The yoke of ceremonies ought not to be put on the necks of the Gentiles, because, we Jews and apostles believe, that we shall be saved in the same manner as they, by the alone grace of the Lord Jesus Christ?” For besides this, it was improper to propose the Gentiles, to the Jews and apostles, as a pattern of salvation, because it appears, that the contrary should be done; and we could only conclude from that position, that the apostles and Jews were not bound to circumcision, and the other ceremonies, any more than the Gentiles. But that was not the thing in dispute. But according to our interpretation, the apostle argues in the strongest manner: “You ought not to put the yoke of ceremonies on the necks of the disciples, who are converted from among the Gentiles, because the fathers themselves, who were under that yoke, really felt the uneasiness of it, but did not find salvation in it, and yet they were saved, not in consequence of these ceremonies, but by the grace of our Lord Jesus Christ. Neither are we, nor any of the human race, to take any other way to attain salvation. They therefore are under a mistake, who tell the disciples, if you will be saved, you must be circumcised, and keep the law of Moses.” To sum up the whole, then, in short, the apostle here declares three things. 1st, That the fathers were saved. 2dly, By the very same covenant that we are. 3dly, Through the grace of our Lord Jesus Christ: intimating likewise by all this reasoning, that there can possibly be but ONE way of salvation. XXXVI. This is likewise confirmed by that famous passage, Heb. 13:8, “Jesus Christ the same yesterday, and to-day and for ever.” In the foregoing verse the apostle admonished them to keep fresh in their memory “the word,” which their guides had spoken unto them, whose faith they should follow. Now, he gives this for the reason of that admonition, because “Jesus Christ is the same yesterday, and to-day, and for ever;” constantly preached by all the teachers of the truth, believed on by all, and to be believed on by those that come after, if they will imitate the faith of their predecessors. The same doctrine therefore is always to be retained, because Christ, who was always both proposed, and believed, as the author of salvation, changeth not. But the particles, yesterday, to-day, and for ever, denote all the differences of times. Nor does yesterday here signify something of a late date, as we usually say, yesterday or lately; but all the time past: as the phrase to-day denotes the time of grace under the New Testament. For, this is compared to some one present day, as chap. 3:13. “While it is called to-day:” and chap. 4:7. “Again, he limiteth a certain day, saying in David, To-day,” &amp;c.; of which 2 Cor. 6:2, “Behold! now is the accepted time, behold! now is the day of salvation.” As, therefore, Christ is to-day, under the New Testament, acknowledged the alone author of salvation, and will be acknowledged as such for ever; so, in like manner, yesterday, under the Old Testament, which day is now past, he was the same, and as such was declared and acknowledged. XXXVII. Let us also add what we have in Heb. 9:15, “And for this cause he is the mediator of the New Testament, that, by means of death, for the redemption of the transgressions that were under the first testament, they which are called might receive the promise of eternal inheritance.” Where we have an open declaration, that the death of Jesus Christ was effectual for the redemption of transgressions committed under the Old Testament. For thus the apostle proceeds. He supposes that the fathers of the Old Testament were saved, notwithstanding their sins; which Socinus, with his followers, dare not deny. He says further, that the blood of bullocks and of goats, and consequently of all sacrifices whatever, could not really, and before the tribunal of God, expiate sin, and purify the conscience. Yet since, as he declares, without shedding of blood there can be no remission, verse 22, he concludes, it was necessary that the death of Christ should indeed be undergone, in order not only to the establishment of the New Testament, but by virtue of which the redemption of former sins might also be obtained. This is the genuine meaning of the sacred writer. XXXVIII. And, indeed, Grotius shamefully shuffles, when, to favour the Socinians, he thus writes on this place: “His death intervened for this end, that men might be delivered from those sins, which generally prevailed, before Christ, among those called God’s people.” Is it really so? Would thus “the redemption of the transgressions that were under the first testament,” denote such an action of Christ, whereby succeeding ages would abstain from the like sins, as were formerly committed? God forbid we should ever pervert Scripture thus. Redemption is כפד an expiation of sin, upon paying a ransom. Christ paid this for all the sins of his elect, at whatever time they lived. And upon the credit of that payment, to be made at the appointed time, believers, even under the Old Testament, obtained redemption. XXXIX. Moreover, since it is evident that Old Testament saints were saved, it must likewise be evident that they were saved through Christ. For our Saviour himself says, John 14:6: “No man cometh unto the Father but by me.” And Peter, Acts 4:12: “Neither is there salvation in any other; for there is none other name under heaven given among men, whereby we must be saved.” Nothing can be plainer than these words, which seem to be written as with a sun-beam. Yet the itch of contradiction has found something to say, but that something is less than nothing. XL. Our adversaries except, that these passages should be understood of those who live under the New Testament, and therefore that both Christ and Peter speak in the present, and not in the past time; of us, and not of the Old Testament saints; of the times when Christ was exhibited, and not of the Old Testament times. We answer: 1st, As both texts are expressed in universal terms, they are not to be limited without cause and necessity, as there is none in this case. For if salvation could be obtained formerly without Christ, equally as now through Christ, what need had we of Christ’s coming? Or, what so very great matter do we obtain Christ? 2dly, There are very solid reasons, why they neither ought nor can be thus restricted. Because they who were “without Christ, were strangers from the covenants of promise, having no hope, and without God in the world.” Eph. 2:12. 3dly, The quibbling about the verbs being of the present time is idle, because verbs of that time or tense may equally refer to all times. And whatever expression had been used, whether denoting the future or past time, there might always be room left for such cavils. Besides, no reason can be assigned, why the past time should be excluded any more than the future, if that verb of the present tense is thus to be racked. If this is not false reasoning against the Supreme Being, and a childish abuse of one’s genius and parts, what can be called so? …XLIII. The apostle writes nothing in opposition to this truth, when he says, Gal. 3:23. “But before faith came, we were kept under the law.” For it is far from the apostle’s intention to deny, that faith in Christ prevailed before his coming in the flesh, because, in the same chapter, he had highly commended the faith of Abraham, and proposed it as a pattern to us all, ver. 6, 7, 9. But by faith we here understand either the object of faith, the doctrine of the Gospel, as chap. 1:23, and the Lord Jesus himself, believed on in the world, 1 Tim. 3:16, or, the faith of the redemption already actually wrought out, as contradistinguished from the hope of the Old Testament saints, who, with earnest longing, as it were, expected the coming of the Lord, “waiting for the consolation of Israel,” Luke 2:25. And thus we have now shown, that the Old Testament saints had the same promises of eternal life with us, to be obtained by the same Christ, and the same faith in him, and consequently also had the same covenant of grace with us.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I. It is a matter of the greatest moment, that we learn distinctly to consider the covenant of grace, either as it is in its substance or essence, as they call it, or as it is in diverse ways proposed by God, with respect to circumstantials, under different economies. If we view the substance of the covenant, it is but only one, nor is it possible it should be otherwise. There is no other way worthy of God, in which salvation can be bestowed on sinners, but that discovered in the Gospel. Whence the apostle, Gal. 1:7, has beautifully said, “which is not another.” And that testament which was consecrated by the blood of Christ, he calls “everlasting,” Heb. 13:20, because it was settled from eternity, published immediately upon the fall of the first man, constantly handed down by the ancients, more fully explained by Christ himself and his apostles, and is to continue throughout all ages, and, in virtue of which, believers shall inherit eternal happiness. But if we attend to the circumstances of the covenant, it was dispensed “at sundry times and in divers manners,” under various economies for the manifestation of the manifold wisdom of God. In considering this, we are first to discourse on those general things which appertain to the substance of the covenant, and have continued in every age; and then explain the different economies or dispensations, and the new accessions made to each; which we will, first, do in a general and concise manner, in this and the following chapter; then gradually descend to the more special considerations. II. We therefore maintain, agreeable to the sacred writings, that to all the Elect, living in any period of time: 1st, One and the same eternal life was promised. 2dly, That Jesus Christ was held forth as the one and the same author and bestower of salvation. 3dly, That they could not become partakers of it any other way, but by a true and lively faith in him. If we demonstrate these n of the Jews, Acts 24:14, 15, “Believing all things, which are written in the Law and the Prophets; and have hope towards God, which they themselves also allow, that there shall be a resurrection of the dead, both of the just and unjust.” He testifies, that the Jews expected a resurrection of the dead; he professes the same belief and hope with them; and that he did not do so out of a vain presumption, but from a faith resting on the Law and the Prophets, which they also, in their manner, carefully read, and from which they had derived the same expectation with him. 3dly, The Jews were so far from judging amiss in this respect, that, on the contrary, the Lord Jesus reproved the Sadducees, as ignorant of the Scriptures, because from them they had not learned life eternal and the resurrection, Matt. 22:29. IV. But let us argue from the very books of the Old Testament: and first, after the example of our Lord, who, Matt. 22:31, 32, speaks to this purpose: “But, as touching the resurrection of the dead, have ye not read that which was spoken unto you by God, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob; God is not the God of the dead, but of the living.” This inference appeared so evident to the multitude, that they were astonished at his doctrine, and the Sadducees were put to silence, ver. 33, 34. And, indeed, if the words of Moses, quoted by Christ, be accurately weighed, the evidence of this argument will easily appear to the attentive reader. V. For, 1st, That expression, to be God to any, in its full import, includes life eternal, For, when God becomes the sinner’s God, he then becomes to him what he is to himself. But, what is he to himself? Doubtless, the fountain of eternal and complete blessedness. When God, out of his grace, gives himself to man, he gives him all things; for himself is all things. Such a man finds in God “a shield” against every evil, and an “exceeding great reward,” Gen. 15:1. And what can he desire more in order to his perfect happiness? Accordingly, the apostle joins these two, Heb. 11:16, God to be the God of any one, and to have prepared for them a city. And seeing the “gifts” of God’s grace, especially when he gives himself, “are without repentance”, Rom. 11:29; hereby also the eternity of this happiness is established. …XVII. But lest they should cavil, that we borrow our arguments only from the New Testament (though none can better instruct us in the contents of the Old Testament than Christ and his apostles), we shall consider some passages of the Old Testament, and free them from the misconstructions of our adversaries. And, first, we have that swanlike song of Jacob, Gen. 49:18. לישועתך קויתי יהוה “I wait for thy salvation, O Lord.” The aged Prophet was now at the point of death; and, being full of the Spirit of God, he, in the midst of his prophecies, in which he foretels what was to befall his children and latest posterity, breaks out into these words; which were not spoken without the Spirit of God, so as, with Smalcius, to be referred to a vain persuasion, nor possibly to be wrested to any other but this spiritual and eternal salvation. XVIII. Here, again, let a certain Jew put the followers of Socinus, if possible, to the blush: in opposition to whom we produce this paraphrase of the Jerusalem Targumist. “Our father Jacob said, My soul does not expect the redemption of Gideon, the son of Joaz, that being only momentary; nor the redemption of Samson, because a transient redemption; but the redemption thou hast mentioned in thy word, or by thy word, which is to come to thy people, the children of Israel; my soul, I say, expects this thy redemption.” Is not this a very clear testimony of the most certain persuasion and the fullest assurance of their salvation? …XXXIII. When the same apostle affirms that our “salvation at the first began to be spoken by the Lord,” Heb. 2:3, it is clear he speaks of the Gospel completed, and of the Messiah, the author of salvation, already exhibited; which Gospel the Lord first published, with respect to the apostles, evangelists, and the other ordinary preachers that followed them. For otherwise who can deny that Zacharias, the father of John the Baptist, and Mary the mother of our Lord, and the angels who proclaimed his nativity, and the aged Simeon, and John the Baptist, were preachers of salvation before the Lord? Of the Fathers the apostle himself affirms, that they were ευαγγελισμενοι, gospelized, or that “the Gospel was preached unto them as well as unto us,” Heb. 4:2. XXXIV. When it is written, Heb. 9:8. “That the way unto the holiest of all was not yet made manifest, while as the first tabernacle was yet standing;” the apostle indeed intimates, that the manner of obtaining salvation was, in some measure hid, in comparison of the brighter lustre of the Gospel. For then, doubtless, the way to life was clouded with much pomp of ceremonies and figures; which being now dispelled, we behold with open face, and ardently desire, heavenly and spiritual things. But from this it no ways follows, that those under the Old Testament had no knowledge of salvation; any more than it can be concluded, we know nothing of our glorious state, because John says, “It doth not yet appear what we shall be,” John 3:2. We may almost, in the same manner, answer the other objections advanced by our adversaries. But it is no part of our design to examine each in particular. XXXV. Now let us proceed to the second thing, which we undertook to prove; that in Christ, and in virtue of his suretiship, the fathers of the Old Testament also obtained salvation even as we. Which Peter declares almost in so many words, Acts 15:11: “But we believe that, through the grace of the Lord Jesus Christ, we shall be saved even as they.” Where the pronoun they is to be referred to the fathers, on whose neck an insupportable yoke of ceremonies was put, as appears both from the grammatical consideration of the gender, from the connexion and the force of the apostles argument. For, since κᾀκεῖνοι is masculine and τα ἔθνα, the Gentiles, mentioned ver. 7, is neuter, it is not so properly referred to the Gentiles as to the fathers. And we are not here, without necessity, to have recourse to an enallage of gender. And then, too, what method of commenting is it, to imagine so wide an hyperbaton or transposition, and to bring from verse 7 a noun, to which, after the interposition of so many other things, a pronoun shall at length answer in eleventh verse, and which yet does not answer; because, in the words immediately preceding, you may find a noun, with which the pronoun in question may be very well joined? In fine, it will either be nonsense, or, very insipid, if the words be so construed. For, what manner of reasoning is it, if we suppose the apostle to have said: “The yoke of ceremonies ought not to be put on the necks of the Gentiles, because, we Jews and apostles believe, that we shall be saved in the same manner as they, by the alone grace of the Lord Jesus Christ?” For besides this, it was improper to propose the Gentiles, to the Jews and apostles, as a pattern of salvation, because it appears, that the contrary should be done; and we could only conclude from that position, that the apostles and Jews were not bound to circumcision, and the other ceremonies, any more than the Gentiles. But that was not the thing in dispute. But according to our interpretation, the apostle argues in the strongest manner: “You ought not to put the yoke of ceremonies on the necks of the disciples, who are converted from among the Gentiles, because the fathers themselves, who were under that yoke, really felt the uneasiness of it, but did not find salvation in it, and yet they were saved, not in consequence of these ceremonies, but by the grace of our Lord Jesus Christ. Neither are we, nor any of the human race, to take any other way to attain salvation. They therefore are under a mistake, who tell the disciples have in Heb. 9:15, “And for this cause he is the mediator of the New Testament, that, by means of death, for the redemption of the transgressions that were under the first testament, they which are called might receive the promise of eternal inheritance.” Where we have an open declaration, that the death of Jesus Christ was effectual for the redemption of transgressions committed under the Old Testament. For thus the apostle proceeds. He supposes that the fathers of the Old Testament were saved, notwithstanding their sins; which Socinus, with his followers, dare not deny. He says further, that the blood of bullocks and of goats, and consequently of all sacrifices whatever, could not really, and before the tribunal of God, expiate sin, and purify the conscience. Yet since, as he declares, without shedding of blood there can be no remission, verse 22, he concludes, it was necessary that the death of Christ should indeed be undergone, in order not only to the establishment of the New Testament, but by virtue of which the redemption of former sins might also be obtained. This is the genuine meaning of the sacred writer. XXXVIII. And, indeed, Grotius shamefully shuffles, when, to favour the Socinians, he thus writes on this place: “His death intervened for this end, that men might be delivered from those sins, which generally prevailed, before Christ, among those called God’s people.” Is it really so? Would thus “the redemption of the transgressions that were under the first testament,” denote such an action of Christ, whereby succeeding ages would abstain from the like sins, as were formerly committed? God forbid we should ever pervert Scripture thus. Redemption is כפד an expiation of sin, upon paying a ransom. Christ paid this for all the sins of his elect, at whatever time they lived. And upon the credit of that payment, to be made at the appointed time, believers, even under the Old Testament, obtained redemption. XXXIX. Moreover, since it is evident that Old Testament saints were saved, it must likewise be evident that they were saved through Christ. For our Saviour himself says, John 14:6: “No man cometh unto the Father but by me.” And Peter, Acts 4:12: “Neither is there salvation in any other; for there is none other name under heaven given among men, whereby we must be saved.” Nothing can be plainer than these words, which seem to be written as with a sun-beam. Yet the itch of contradiction has found something to say, but that something is less than nothing. XL. Our adversaries except, that these passages should be understood of those who live under the New Testament, and therefore that both Christ and Peter speak in the present, and not in the past time; of us, and not of the Old Testament saints; of the times when Christ was exhibited, and not of the Old Testament times. We answer: 1st, As both texts are expressed in universal terms, they are not to be limited without cause and necessity, as there is none in this case. For if salvation could be obtained formerly without Christ, equally as now through Christ, what need had we of Christ’s coming? Or, what so very great matter do we obtain Christ? 2dly, There are very solid reasons, why they neither ought nor can be thus restricted. Because they who were “without Christ, were strangers from the covenants of promise, having no hope, and without God in the world.” Eph. 2:12. 3dly, The quibbling about the verbs being of the present time is idle, because verbs of that time or tense may equally refer to all times. And whatever expression had been used, whether denoting the future or past time, there might always be room left for such cavils. Besides, no reason can be assigned, why the past time should be excluded any more than the future, if that verb of the present tense is thus to be racked. If this is not false reasoning against the Supreme Being, and a childish abuse of one’s genius and parts, what can be called so? …XLIII. The apostle writes nothing in opposition to this truth, when he says, Gal. 3:23. “But before faith came, we were kept under the law.” For it is far from the apostle’s intention to deny, that faith in Christ prevailed before his coming in the flesh, because, in the same chapter, he had highly commended the faith of Abraham, and proposed it as a pattern to us all, ver. 6, 7, 9. But by faith we here understand either the object of faith, the doctrine of the Gospel, as chap. 1:23, and the Lord Jesus himself, believed on in the world, 1 Tim. 3:16, or, the faith of the redemption already actually wrought out, as contradistinguished from the hope of the Old Testament saints, who, with earnest longing, as it were, expected the coming of the Lord, “waiting for the consolation of Israel,” Luke 2:25. And thus we have now shown, that the Old Testament saints had the same promises of eternal life with us, to be obtained by the same Christ, and the same faith in him, and consequently also had the same covenant of grace with us.”

tings%2C+that+to+all+the+Elect%2C+living+in+any+period+of+time%3A+1st%2C+One+and+the+same+eternal+life+was+promised.+2dly%2C+That+Jesus+Christ+was+held+forth+as+the+one+and+the+same+author+and+bestower+of+salvation.+3dly%2C+That+they+could+not+become+partakers+of+it+any+other+way%2C+but+by+a+true+and+lively+faith+in+him.+If+we+demonstrate+these+three+things%2C+none+can+any+longer+doubt%2C+but+that+the+covenant+of+grace+must+be%2C+as+to+its+substance%2C+only+one+from+the+beginning.+For%2C+if+the+salvation+be+the+same%2C+and+the+author+of+it+the+same%2C+the+manner+of+communion+with+him+the+same%2C+it+is+certain%2C+the+covenant+itself+cannot+be+more+than+one.+II.+The+Scriptures+so+plainly+declare%2C+that+eternal+life+was+promised+to+the+Elect+from+the+beginning%2C+that+if+is+astonishing+any+Christians+could+venture+to+deny+it%3B+who%2C+indeed%2C+are+much+blinder+than+the+Jews+themselves%3B+of+whom+our+Lord+testifies%2C+John+5%3A39.+%E2%80%9CYe+do+search+the+Scriptures%2C+for+in+them+ye+think+ye+have+eternal+life%3A%E2%80%9D+and+that+they+were+neither+rash+nor+erroneous+in+thinking+that+the+promises+of+eternal+life%2C+and+the+manner+of+enjoying+them%2C+were+contained+in+the+Scriptures+they+had%2C+we+prove+by+the+most+cogent+arguments.+1st%2C+Because%2C+not+only+the+Lord+Jesus+does+not+charge+them%2C+in+this+respect%2C+with+the+least+error%2C+but+makes+use+of+that+as+a+reason+to+recommend+to+them+the+search+of+the+Scriptures.+But+it+is+very+inconsistent+with+the+great+sincerity+of+the+Lord+Jesus%2C+and+the+divine+dignity+of+the+Scriptures%2C+to+recommend+them+by+arguments+not+genuine%2C+or+to+recommend+their+value+and+usefulness+from+Jewish+forgeries.+Nay%2C+had+the+Jews+falsely+persuaded+themselves%2C+that+the+promises+of+eternal+life+were+contained+in+the+Old+Testament+records%2C+our+Lord+ought+not%2C+by+any+concession%2C+to+have+cherished+that+mistake%2C+which+would+have+hindered+them+from+acknowledging+the+excellence+of+his+doctrine%2C+and+consequently+the+divinity+of+his+person%3B+but+rather+to+have+exclaimed+against+them%3A+%E2%80%9CIn+vain+do+you+search+the+Scriptures%2C+in+hopes+of+finding+eternal+life+in+them%3B+attend+rather+to+me+and+my+doctrine%2C+who+am+the+first+who+came+into+the+world+as+a+preacher+of+eternal+life.%E2%80%9D+But+every+one+may+see+how+inconsistent+this+was+from+the+design+of+the+Lord+Jesus.+2ndly%2C+To+this+we+add%2C+that+Paul%E2%80%99s+hope+was+founded+on+the+Law+and+the+Prophets%2C+as+well+as+the+expectation+of+the+Jews%2C+Acts+24%3A14%2C+15%2C+%E2%80%9CBelieving+all+things%2C+which+are+written+in+the+Law+and+the+Prophets%3B+and+have+hope+towards+God%2C+which+they+themselves+also+allow%2C+that+there+shall+be+a+resurrection+of+the+dead%2C+both+of+the+just+and+unjust.%E2%80%9D+He+testifies%2C+that+the+Jews+expected+a+resurrection+of+the+dead%3B+he+professes+the+same+belief+and+hope+with+them%3B+and+that+he+did+not+do+so+out+of+a+vain+presumption%2C+but+from+a+faith+resting+on+the+Law+and+the+Prophets%2C+which+they+also%2C+in+their+manner%2C+carefully+read%2C+and+from+which+they+had+derived+the+same+expectation+with+him.+3dly%2C+The+Jews+were+so+far+from+judging+amiss+in+this+respect%2C+that%2C+on+the+contrary%2C+the+Lord+Jesus+reproved+the+Sadducees%2C+as+ignorant+of+the+Scriptures%2C+because+from+them+they+had+not+learned+life+eternal+and+the+resurrection%2C+Matt.+22%3A29.+IV.+But+let+us+argue+from+the+very+books+of+the+Old+Testament%3A+and+first%2C+after+the+example+of+our+Lord%2C+who%2C+Matt.+22%3A31%2C+32%2C+speaks+to+this+purpose%3A+%E2%80%9CBut%2C+as+touching+the+resurrection+of+the+dead%2C+have+ye+not+read+that+which+was+spoken+unto+you+by+God%2C+saying%2C+I+am+the+God+of+Abraham%2C+and+the+God+of+Isaac%2C+and+the+God+of+Jacob%3B+God+is+not+the+God+of+the+dead%2C+but+of+the+living.%E2%80%9D+This+inference+appeared+so+evident+to+the+multitude%2C+that+they+were+astonished+at+his+doctrine%2C+and+the+Sadducees+were+put+to+silence%2C+ver.+33%2C+34.+And%2C+indeed%2C+if+the+words+of+Moses%2C+quoted+by+Christ%2C+be+accurately+weighed%2C+the+evidence+of+this+argument+will+easily+appear+to+the+attentive+reader.+V.+For%2C+1st%2C+That+expression%2C+to+be+God+to+any%2C+in+its+full+import%2C+includes+life+eternal%2C+For%2C+when+God+becomes+the+sinner%E2%80%99s+God%2C+he+then+becomes+to+him+what+he+is+to+himself.+But%2C+what+is+he+to+himself%3F+Doubtless%2C+the+fountain+of+eternal+and+complete+blessedness.+When+God%2C+out+of+his+grace%2C+gives+himself+to+man%2C+he+gives+him+all+things%3B+for+himself+is+all+things.+Such+a+man+finds+in+God+%E2%80%9Ca+shield%E2%80%9D+against+every+evil%2C+and+an+%E2%80%9Cexceeding+great+reward%2C%E2%80%9D+Gen.+15%3A1.+And+what+can+he+desire+more+in+order+to+his+perfect+happiness%3F+Accordingly%2C+the+apostle+joins+these+two%2C+Heb.+11%3A16%2C+God+to+be+the+God+of+any+one%2C+and+to+have+prepared+for+them+a+city.+And+seeing+the+%E2%80%9Cgifts%E2%80%9D+of+God%E2%80%99s+grace%2C+especially+when+he+gives+himself%2C+%E2%80%9Care+without+repentance%E2%80%9D%2C+Rom.+11%3A29%3B+hereby+also+the+eternity+of+this+happiness+is+established.+%E2%80%A6XVII.+But+lest+they+should+cavil%2C+that+we+borrow+our+arguments+only+from+the+New+Testament+%28though+none+can+better+instruct+us+in+the+contents+of+the+Old+Testament+than+Christ+and+his+apostles%29%2C+we+shall+consider+some+passages+of+the+Old+Testament%2C+and+free+them+from+the+misconstructions+of+our+adversaries.+And%2C+first%2C+we+have+that+swanlike+song+of+Jacob%2C+Gen.+49%3A18.+%D7%9C%D7%99%D7%A9%D7%95%D7%A2%D7%AA%D7%9A+%D7%A7%D7%95%D7%99%D7%AA%D7%99+%D7%99%D7%94%D7%95%D7%94+%E2%80%9CI+wait+for+thy+salvation%2C+O+Lord.%E2%80%9D+The+aged+Prophet+was+now+at+the+point+of+death%3B+and%2C+being+full+of+the+Spirit+of+God%2C+he%2C+in+the+midst+of+his+prophecies%2C+in+which+he+foretels+what+was+to+befall+his+children+and+latest+posterity%2C+breaks+out+into+these+words%3B+which+were+not+spoken+without+the+Spirit+of+God%2C+so+as%2C+with+Smalcius%2C+to+be+referred+to+a+vain+persuasion%2C+nor+possibly+to+be+wrested+to+any+other+but+this+spiritual+and+eternal+salvation.+XVIII.+Here%2C+again%2C+let+a+certain+Jew+put+the+followers+of+Socinus%2C+if+possible%2C+to+the+blush%3A+in+opposition+to+whom+we+produce+this+paraphrase+of+the+Jerusalem+Targumist.+%E2%80%9COur+father+Jacob+said%2C+My+soul+does+not+expect+the+redemption+of+Gideon%2C+the+son+of+Joaz%2C+that+being+only+momentary%3B+nor+the+redemption+of+Samson%2C+because+a+transient+redemption%3B+but+the+redemption+thou+hast+mentioned+in+thy+word%2C+or+by+thy+word%2C+which+is+to+come+to+thy+people%2C+the+children+of+Israel%3B+my+soul%2C+I+say%2C+expects+this+thy+redemption.%E2%80%9D+Is+not+this+a+very+clear+testimony+of+the+most+certain+persuasion+and+the+fullest+assurance+of+their+salvation%3F+%E2%80%A6XXXIII.+When+the+same+apostle+affirms+that+our+%E2%80%9Csalvation+at+the+first+began+to+be+spoken+by+the+Lord%2C%E2%80%9D+Heb.+2%3A3%2C+it+is+clear+he+speaks+of+the+Gospel+completed%2C+and+of+the+Messiah%2C+the+author+of+salvation%2C+already+exhibited%3B+which+Gospel+the+Lord+first+published%2C+with+respect+to+the+apostles%2C+evangelists%2C+and+the+other+ordinary+preachers+that+followed+them.+For+otherwise+who+can+deny+that+Zacharias%2C+the+father+of+John+the+Baptist%2C+and+Mary+the+mother+of+our+Lord%2C+and+the+angels+who+proclaimed+his+nativity%2C+and+the+aged+Simeon%2C+and+John+the+Baptist%2C+were+preachers+of+salvation+before+the+Lord%3F+Of+the+Fathers+the+apostle+himself+affirms%2C+that+they+were+%CE%B5%CF%85%CE%B1%CE%B3%CE%B3%CE%B5%CE%BB%CE%B9%CF%83%CE%BC%CE%B5%CE%BD%CE%BF%CE%B9%2C+gospelized%2C+or+that+%E2%80%9Cthe+Gospel+was+preached+unto+them+as+well+as+unto+us%2C%E2%80%9D+Heb.+4%3A2.+XXXIV.+When+it+is+written%2C+Heb.+9%3A8.+%E2%80%9CThat+the+way+unto+the+holiest+of+all+was+not+yet+made+manifest%2C+while+as+the+first+tabernacle+was+yet+standing%3B%E2%80%9D+the+apostle+indeed+intimates%2C+that+the+manner+of+obtaining+salvation+was%2C+in+some+measure+hid%2C+in+comparison+of+the+brighter+lustre+of+the+Gospel.+For+then%2C+doubtless%2C+the+way+to+life+was+clouded+with+much+pomp+of+ceremonies+and+figures%3B+which+being+now+dispelled%2C+we+behold+with+open+face%2C+and+ardently+desire%2C+heavenly+and+spiritual+things.+But+from+this+it+no+ways+follows%2C+that+those+under+the+Old+Testament+had+no+knowledge+of+salvation%3B+any+more+than+it+can+be+concluded%2C+we+know+nothing+of+our+glorious+state%2C+because+John+says%2C+%E2%80%9CIt+doth+not+yet+appear+what+we+shall+be%2C%E2%80%9D+John+3%3A2.+We+may+almost%2C+in+the+same+manner%2C+answer+the+other+objections+advanced+by+our+adversaries.+But+it+is+no+part+of+our+design+to+examine+each+in+particular.+XXXV.+Now+let+us+proceed+to+the+second+thing%2C+which+we+undertook+to+prove%3B+that+in+Christ%2C+and+in+virtue+of+his+suretiship%2C+the+fathers+of+the+Old+Testament+also+obtained+salvation+even+as+we.+Which+Peter+declares+almost+in+so+many+words%2C+Acts+15%3A11%3A+%E2%80%9CBut+we+believe+that%2C+through+the+grace+of+the+Lord+Jesus+Christ%2C+we+shall+be+saved+even+as+they.%E2%80%9D+Where+the+pronoun+they+is+to+be+referred+to+the+fathers%2C+on+whose+neck+an+insupportable+yoke+of+ceremonies+was+put%2C+as+appears+both+from+the+grammatical+consideration+of+the+gender%2C+from+the+connexion+and+the+force+of+the+apostles+argument.+For%2C+since+%CE%BA%E1%BE%80%CE%BA%CE%B5%E1%BF%96%CE%BD%CE%BF%CE%B9+is+masculine+and+%CF%84%CE%B1+%E1%BC%94%CE%B8%CE%BD%CE%B1%2C+the+Gentiles%2C+mentioned+ver.+7%2C+is+neuter%2C+it+is+not+so+properly+referred+to+the+Gentiles+as+to+the+fathers.+And+we+are+not+here%2C+without+necessity%2C+to+have+recourse+to+an+enallage+of+gender.+And+then%2C+too%2C+what+method+of+commenting+is+it%2C+to+imagine+so+wide+an+hyperbaton+or+transposition%2C+and+to+bring+from+verse+7+a+noun%2C+to+which%2C+after+the+interposition+of+so+many+other+things%2C+a+pronoun+shall+at+length+answer+in+eleventh+verse%2C+and+which+yet+does+not+answer%3B+because%2C+in+the+words+immediately+preceding%2C+you+may+find+a+noun%2C+with+which+the+pronoun+in+question+may+be+very+well+joined%3F+In+fine%2C+it+will+either+be+nonsense%2C+or%2C+very+insipid%2C+if+the+words+be+so+construed.+For%2C+what+manner+of+reasoning+is+it%2C+if+we+suppose+the+apostle+to+have+said%3A+%E2%80%9CThe+yoke+of+ceremonies+ought+not+to+be+put+on+the+necks+of+the+Gentiles%2C+because%2C+we+Jews+and+apostles+believe%2C+that+we+shall+be+saved+in+the+same+manner+as+they%2C+by+the+alone+grace+of+the+Lord+Jesus+Christ%3F%E2%80%9D+For+besides+this%2C+it+was+improper+to+propose+the+Gentiles%2C+to+the+Jews+and+apostles%2C+as+a+pattern+of+salvation%2C+because+it+appears%2C+that+the+contrary+should+be+done%3B+and+we+could+only+conclude+from+that+position%2C+that+the+apostles+and+Jews+were+not+bound+to+circumcision%2C+and+the+other+ceremonies%2C+any+more+than+the+Gentiles.+But+that+was+not+the+thing+in+dispute.+But+according+to+our+interpretation%2C+the+apostle+argues+in+the+strongest+manner%3A+%E2%80%9CYou+ought+not+to+put+the+yoke+of+ceremonies+on+the+necks+of+the+disciples%2C+who+are+converted+from+among+the+Gentiles%2C+because+the+fathers+themselves%2C+who+were+under+that+yoke%2C+really+felt+the+uneasiness+of+it%2C+but+did+not+find+salvation+in+it%2C+and+yet+they+were+saved%2C+not+in+consequence+of+these+ceremonies%2C+but+by+the+grace+of+our+Lord+Jesus+Christ.+Neither+are+we%2C+nor+any+of+the+human+race%2C+to+take+any+other+way+to+attain+salvation.+They+therefore+are+under+a+mistake%2C+who+tell+the+disciples%2C+if+you+will+be+saved%2C+you+must+be+circumcised%2C+and+keep+the+law+of+Moses.%E2%80%9D+To+sum+up+the+whole%2C+then%2C+in+short%2C+the+apostle+here+declares+three+things.+1st%2C+That+the+fathers+were+saved.+2dly%2C+By+the+very+same+covenant+that+we+are.+3dly%2C+Through+the+grace+of+our+Lord+Jesus+Christ%3A+intimating+likewise+by+all+this+reasoning%2C+that+there+can+possibly+be+but+ONE+way+of+salvation.+XXXVI.+This+is+likewise+confirmed+by+that+famous+passage%2C+Heb.+13%3A8%2C+%E2%80%9CJesus+Christ+the+same+yesterday%2C+and+to-day+and+for+ever.%E2%80%9D+In+the+foregoing+verse+the+apostle+admonished+them+to+keep+fresh+in+their+memory+%E2%80%9Cthe+word%2C%E2%80%9D+which+their+guides+had+spoken+unto+them%2C+whose+faith+they+should+follow.+Now%2C+he+gives+this+for+the+reason+of+that+admonition%2C+because+%E2%80%9CJesus+Christ+is+the+same+yesterday%2C+and+to-day%2C+and+for+ever%3B%E2%80%9D+constantly+preached+by+all+the+teachers+of+the+truth%2C+believed+on+by+all%2C+and+to+be+believed+on+by+those+that+come+after%2C+if+they+will+imitate+the+faith+of+their+predecessors.+The+same+doctrine+therefore+is+always+to+be+retained%2C+because+Christ%2C+who+was+always+both+proposed%2C+and+believed%2C+as+the+author+of+salvation%2C+changeth+not.+But+the+particles%2C+yesterday%2C+to-day%2C+and+for+ever%2C+denote+all+the+differences+of+times.+Nor+does+yesterday+here+signify+something+of+a+late+date%2C+as+we+usually+say%2C+yesterday+or+lately%3B+but+all+the+time+past%3A+as+the+phrase+to-day+denotes+the+time+of+grace+under+the+New+Testament.+For%2C+this+is+compared+to+some+one+present+day%2C+as+chap.+3%3A13.+%E2%80%9CWhile+it+is+called+to-day%3A%E2%80%9D+and+chap.+4%3A7.+%E2%80%9CAgain%2C+he+limiteth+a+certain+day%2C+saying+in+David%2C+To-day%2C%E2%80%9D+%26c.%3B+of+which+2+Cor.+6%3A2%2C+%E2%80%9CBehold%21+now+is+the+accepted+time%2C+behold%21+now+is+the+day+of+salvation.%E2%80%9D+As%2C+therefore%2C+Christ+is+to-day%2C+under+the+New+Testament%2C+acknowledged+the+alone+author+of+salvation%2C+and+will+be+acknowledged+as+such+for+ever%3B+so%2C+in+like+manner%2C+yesterday%2C+under+the+Old+Testament%2C+which+day+is+now+past%2C+he+was+the+same%2C+and+as+such+was+declared+and+acknowledged.+XXXVII.+Let+us+also+add+what+we+have+in+Heb.+9%3A15%2C+%E2%80%9CAnd+for+this+cause+he+is+the+mediator+of+the+New+Testament%2C+that%2C+by+means+of+death%2C+for+the+redemption+of+the+transgressions+that+were+under+the+first+testament%2C+they+which+are+called+might+receive+the+promise+of+eternal+inheritance.%E2%80%9D+Where+we+have+an+open+declaration%2C+that+the+death+of+Jesus+Christ+was+effectual+for+the+redemption+of+transgressions+committed+under+the+Old+Testament.+For+thus+the+apostle+proceeds.+He+supposes+that+the+fathers+of+the+Old+Testament+were+saved%2C+notwithstanding+their+sins%3B+which+Socinus%2C+with+his+followers%2C+dare+not+deny.+He+says+further%2C+that+the+blood+of+bullocks+and+of+goats%2C+and+consequently+of+all+sacrifices+whatever%2C+could+not+really%2C+and+before+the+tribunal+of+God%2C+expiate+sin%2C+and+purify+the+conscience.+Yet+since%2C+as+he+declares%2C+without+shedding+of+blood+there+can+be+no+remission%2C+verse+22%2C+he+concludes%2C+it+was+necessary+that+the+death+of+Christ+should+indeed+be+undergone%2C+in+order+not+only+to+the+establishment+of+the+New+Testament%2C+but+by+virtue+of+which+the+redemption+of+former+sins+might+also+be+obtained.+This+is+the+genuine+meaning+of+the+sacred+writer.+XXXVIII.+And%2C+indeed%2C+Grotius+shamefully+shuffles%2C+when%2C+to+favour+the+Socinians%2C+he+thus+writes+on+this+place%3A+%E2%80%9CHis+death+intervened+for+this+end%2C+that+men+might+be+delivered+from+those+sins%2C+which+generally+prevailed%2C+before+Christ%2C+among+those+called+God%E2%80%99s+people.%E2%80%9D+Is+it+really+so%3F+Would+thus+%E2%80%9Cthe+redemption+of+the+transgressions+that+were+under+the+first+testament%2C%E2%80%9D+denote+such+an+action+of+Christ%2C+whereby+succeeding+ages+would+abstain+from+the+like+sins%2C+as+were+formerly+committed%3F+God+forbid+we+should+ever+pervert+Scripture+thus.+Redemption+is+%D7%9B%D7%A4%D7%93+an+expiation+of+sin%2C+upon+paying+a+ransom.+Christ+paid+this+for+all+the+sins+of+his+elect%2C+at+whatever+time+they+lived.+And+upon+the+credit+of+that+payment%2C+to+be+made+at+the+appointed+time%2C+believers%2C+even+under+the+Old+Testament%2C+obtained+redemption.+XXXIX.+Moreover%2C+since+it+is+evident+that+Old+Testament+saints+were+saved%2C+it+must+likewise+be+evident+that+they+were+saved+through+Christ.+For+our+Saviour+himself+says%2C+John+14%3A6%3A+%E2%80%9CNo+man+cometh+unto+the+Father+but+by+me.%E2%80%9D+And+Peter%2C+Acts+4%3A12%3A+%E2%80%9CNeither+is+there+salvation+in+any+other%3B+for+there+is+none+other+name+under+heaven+given+among+men%2C+whereby+we+must+be+saved.%E2%80%9D+Nothing+can+be+plainer+than+these+words%2C+which+seem+to+be+written+as+with+a+sun-beam.+Yet+the+itch+of+contradiction+has+found+something+to+say%2C+but+that+something+is+less+than+nothing.+XL.+Our+adversaries+except%2C+that+these+passages+should+be+understood+of+those+who+live+under+the+New+Testament%2C+and+therefore+that+both+Christ+and+Peter+speak+in+the+present%2C+and+not+in+the+past+time%3B+of+us%2C+and+not+of+the+Old+Testament+saints%3B+of+the+times+when+Christ+was+exhibited%2C+and+not+of+the+Old+Testament+times.+We+answer%3A+1st%2C+As+both+texts+are+expressed+in+universal+terms%2C+they+are+not+to+be+limited+without+cause+and+necessity%2C+as+there+is+none+in+this+case.+For+if+salvation+could+be+obtained+formerly+without+Christ%2C+equally+as+now+through+Christ%2C+what+need+had+we+of+Christ%E2%80%99s+coming%3F+Or%2C+what+so+very+great+matter+do+we+obtain+Christ%3F+2dly%2C+There+are+very+solid+reasons%2C+why+they+neither+ought+nor+can+be+thus+restricted.+Because+they+who+were+%E2%80%9Cwithout+Christ%2C+were+strangers+from+the+covenants+of+promise%2C+having+no+hope%2C+and+without+God+in+the+world.%E2%80%9D+Eph.+2%3A12.+3dly%2C+The+quibbling+about+the+verbs+being+of+the+present+time+is+idle%2C+because+verbs+of+that+time+or+tense+may+equally+refer+to+all+times.+And+whatever+expression+had+been+used%2C+whether+denoting+the+future+or+past+time%2C+there+might+always+be+room+left+for+such+cavils.+Besides%2C+no+reason+can+be+assigned%2C+why+the+past+time+should+be+excluded+any+more+than+the+future%2C+if+that+verb+of+the+present+tense+is+thus+to+be+racked.+If+this+is+not+false+reasoning+against+the+Supreme+Being%2C+and+a+childish+abuse+of+one%E2%80%99s+genius+and+parts%2C+what+can+be+called+so%3F+%E2%80%A6XLIII.+The+apostle+writes+nothing+in+opposition+to+this+truth%2C+when+he+says%2C+Gal.+3%3A23.+%E2%80%9CBut+before+faith+came%2C+we+were+kept+under+the+law.%E2%80%9D+For+it+is+far+from+the+apostle%E2%80%99s+intention+to+deny%2C+that+faith+in+Christ+prevailed+before+his+coming+in+the+flesh%2C+because%2C+in+the+same+chapter%2C+he+had+highly+commended+the+faith+of+Abraham%2C+and+proposed+it+as+a+pattern+to+us+all%2C+ver.+6%2C+7%2C+9.+But+by+faith+we+here+understand+either+the+object+of+faith%2C+the+doctrine+of+the+Gospel%2C+as+chap.+1%3A23%2C+and+the+Lord+Jesus+himself%2C+believed+on+in+the+world%2C+1+Tim.+3%3A16%2C+or%2C+the+faith+of+the+redemption+already+actually+wrought+out%2C+as+contradistinguished+from+the+hope+of+the+Old+Testament+saints%2C+who%2C+with+earnest+longing%2C+as+it+were%2C+expected+the+coming+of+the+Lord%2C+%E2%80%9Cwaiting+for+the+consolation+of+Israel%2C%E2%80%9D+Luke+2%3A25.+And+thus+we+have+now+shown%2C+that+the+Old+Testament+saints+had+the+same+promises+of+eternal+life+with+us%2C+to+be+obtained+by+the+same+Christ%2C+and+the+same+faith+in+him%2C+and+consequently+also+had+the+same+covenant+of+grace+with+us.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+vol.+1+%28London%3A+T.+Tegg+%26+Son%2C+1837%29%2C+259%E2%80%9373.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fbd11dbe7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fbd11dbe7.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/witsius-one-covenant-of-grace-multiple-administrations/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>[5.] We on all accounts stand in need of a surety for us, or on our behalf. Neither without the interposition of such a surety could any covenant between God and us be firm and stable, or “an everlasting covenant, ordered in all things, and sure.” In the first covenant, made with Adam, there was no surety, but God and man were the immediate covenanters. And although we were then in a state and condition able to perform and answer all the terms of that covenant, yet was it broken and disannulled. If this came to pass by the failure of the promise of God, it was necessary that, on the making of a new covenant, he should have a surety to undertake for him, that the covenant might be stable and everlasting. But this is false, and blasphemous to imagine. It was man alone who failed and brake that covenant. Wherefore it was necessary that, upon the making of the new covenant, and that with a design and purpose that it should never be disannulled as the former was, we should have a surety and undertaker for us; for if that first covenant was not firm and stable, because there was no surety to undertake for us, notwithstanding all that ability which we had to answer the terms of it, how much less can any other be so, now our natures are become depraved and sinful! Wherefore we alone are capable of a surety, properly so called, for us; we alone stood in need of him; and without him the covenant could not be firm and inviolable on our part: the surety, therefore, of this covenant is so with God for us. [6.] It is the priesthood of Christ that the apostle treats of in this place, and that alone. Wherefore he is a surety as he is a priest, and in the discharge of that office; and is therefore so with God on our behalf. … (3.) It remaineth that we inquire positively how the Lord Christ was the surety of the new covenant, and what is the benefit we receive thereby. And unto this purpose we must first consider that opinion of some that the whole end of the mediation of Christ was only to procure the new covenant: although at first view it be irreconcilable unto the nature and notion of a surety; for a surety is not the procurer of that whereof he is the surety, but only the undertaker for its accomplishment. But we must more distinctly consider this assertion, and in what sense Christ may be said to procure the new covenant by his death and mediation. And to this end we must observe, that the new covenant may be considered divers ways, in various respects:— [1.] In the designation and preparation of its terms and benefits in the counsel of God. And this, although it have the nature of an eternal decree, yet is it distinguished from the decree of election, which first and properly respects the subjects or persons for whom grace and glory are prepared; for this respects the preparation only of that grace and glory, as to the way and manner of their communication. It is true, this purpose, or counsel of God’s will, is not called the covenant of grace, which is the express declared exemplification of it. The covenant of grace, I say, is only the declaration of this counsel of God’s will, accompanied with the means and power of its accomplishment, and the prescription of the ways whereby we are to be interested in it, and made partakers of the benefits of it. But in the inquiry after the procuring cause of the new covenant, it is the first thing that ought to come under consideration; for nothing can be the procuring cause of this covenant which is not so of this spring and fountain of it,—of this idea of it in the mind of God. But this is nowhere in the Scripture affirmed to be the effect of the death or mediation of Christ; and so to ascribe it, is to overthrow the whole freedom of eternal grace and love. Neither can any thing that is absolutely eternal, as is this decree and counsel of God, be the effect of, or be procured by, any thing that is external and temporal. And besides, it is expressly assigned unto absolute love and grace: see Eph. 1:4–6, with all those places where the love of God is assigned as the sole cause of the designation of Christ unto his office, and the sending of him. [2.] It may be considered with respect unto the federal transactions between the Father and Son concerning the accomplishment of this counsel of his will. What these were, wherein they did consist, I have declared at large in my exercitations. Neither do I call this the covenant of grace absolutely, nor is it so called in the Scripture: but it is that wherein it had its establishment, as unto all the ways, means, and ends of its accomplishment; and by it were all things so disposed, as that it might be effectual unto the glory of the wisdom, grace, righteousness, and power of God. Wherefore the covenant of grace could not be procured by any means or cause but that which was the cause of this covenant of the mediator, or of God the Father with the Son as undertaking the work of mediation. And as this is nowhere ascribed unto the death of Christ in the Scripture, so to assert it is contrary unto all spiritual reason and understanding. Who can conceive that Christ, by his death, should procure the agreement between God and him that he should die? [3.] With respect unto the declaration of it. This you may call God’s making or establishing of it with us, if you please; though making of the covenant in the Scripture is applied only unto its execution or actual application unto persons. But this declaration of the grace of God, and the provision in the covenant of the mediator for the making of it effectual unto his glory, is most usually called the covenant of grace. And this is twofold:— 1st. In the way of a singular and absolute promise; as it was first declared unto and thereby established with Adam, and afterwards with Abraham. This is the declaration of the purpose of God, or the free determination of his will as to his dealing with sinners, on the supposition of the fall and the forfeiture of their first covenant state. Hereof the grace and will of God were the only cause, Heb. 8:8. And the death of Christ could not be the means of its procurement; for he himself, and all that he was to do for us, were the substance of that promise wherein this declaration of God’s grace and purpose was made, or of this covenant of grace, which was introduced and established in the room of that which was broken and disannulled, as unto the ends and benefits of a covenant. The substance of the first promise, wherein the whole covenant of grace was virtually comprised, directly respected and expressed the giving of him for the recovery of mankind from sin and misery, by his death, Gen. 3:15. Wherefore if he, and all the benefits of his mediation, his death and all the effects of it, be contained in the promise of the covenant, that is, in the covenant itself, then was not his death the procuring cause of that covenant, nor do we owe it thereunto.</p></blockquote>

essly assigned unto absolute love and grace: see Eph. 1:4–6, with all those places where the love of God is assigned as the sole cause of the designation of Christ unto his office, and the sending of him. [2.] It may be considered with respect unto the federal transactions between the Father and Son concerning the accomplishment of this counsel of his will. What these were, wherein they did consist, I have declared at large in my exercitations. Neither do I call this the covenant of grace absolutely, nor is it so called in the Scripture: but it is that wherein it had its establishment, as unto all the ways, means, and ends of its accomplishment; and by it were all things so disposed, as that it might be effectual unto the glory of the wisdom, grace, righteousness, and power of God. Wherefore the covenant of grace could not be procured by any means or cause but that which was the cause of this covenant of the mediator, or of God the Father with the Son as undertaking the work of mediation. And as this is nowhere ascribed unto the death of Christ in the Scripture, so to assert it is contrary unto all spiritual reason and understanding. Who can conceive that Christ, by his death, should procure the agreement between God and him that he should die? [3.] With respect unto the declaration of it. This you may call God’s making or establishing of it with us, if you please; though making of the covenant in the Scripture is applied only unto its execution or actual application unto persons. But this declaration of the grace of God, and the provision in the covenant of the mediator for the making of it effectual unto his glory, is most usually called the covenant of grace. And this is twofold:— 1st. In the way of a singular and absolute promise; as it was first declared unto and thereby established with Adam, and afterwards with Abraham. This is the declaration of the purpose of God, or the free determination of his will as to his dealing with sinners, on the supposition of the fall and the forfeiture of their first covenant state. Hereof the grace and will of God were the only cause, Heb. 8:8. And the death of Christ could not be the means of its procurement; for he himself, and all that he was to do for us, were the substance of that promise wherein this declaration of God’s grace and purpose was made, or of this covenant of grace, which was introduced and established in the room of that which was broken and disannulled, as unto the ends and benefits of a covenant. The substance of the first promise, wherein the whole covenant of grace was virtually comprised, directly respected and expressed the giving of him for the recovery of mankind from sin and misery, by his death, Gen. 3:15. Wherefore if he, and all the benefits of his mediation, his death and all the effects of it, be contained in the promise of the covenant, that is, in the covenant itself, then was not his death the procuring cause of that covenant, nor do we owe it thereunto.”

— John Owen, An Exposition of the Epistle to the Hebrews, ed. W. H. Goold, vol. 22, Works of John Owen (Edinburgh: Johnstone and Hunter, 1855), 502–506.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B5.%5D+We+on+all+accounts+stand+in+need+of+a+surety+for+us%2C+or+on+our+behalf.+Neither+without+the+interposition+of+such+a+surety+could+any+covenant+between+God+and+us+be+firm+and+stable%2C+or+%E2%80%9Can+everlasting+covenant%2C+ordered+in+all+things%2C+and+sure.%E2%80%9D+In+the+first+covenant%2C+made+with+Adam%2C+there+was+no+surety%2C+but+God+and+man+were+the+immediate+covenanters.+And+although+we+were+then+in+a+state+and+condition+able+to+perform+and+answer+all+the+terms+of+that+covenant%2C+yet+was+it+broken+and+disannulled.+If+this+came+to+pass+by+the+failure+of+the+promise+of+God%2C+it+was+necessary+that%2C+on+the+making+of+a+new+covenant%2C+he+should+have+a+surety+to+undertake+for+him%2C+that+the+covenant+might+be+stable+and+everlasting.+But+this+is+false%2C+and+blasphemous+to+imagine.+It+was+man+alone+who+failed+and+brake+that+covenant.+Wherefore+it+was+necessary+that%2C+upon+the+making+of+the+new+covenant%2C+and+that+with+a+design+and+purpose+that+it+should+never+be+disannulled+as+the+former+was%2C+we+should+have+a+surety+and+undertaker+for+us%3B+for+if+that+first+covenant+was+not+firm+and+stable%2C+because+there+was+no+surety+to+undertake+for+us%2C+notwithstanding+all+that+ability+which+we+had+to+answer+the+terms+of+it%2C+how+much+less+can+any+other+be+so%2C+now+our+natures+are+become+depraved+and+sinful%21+Wherefore+we+alone+are+capable+of+a+surety%2C+properly+so+called%2C+for+us%3B+we+alone+stood+in+need+of+him%3B+and+without+him+the+covenant+could+not+be+firm+and+inviolable+on+our+part%3A+the+surety%2C+therefore%2C+of+this+covenant+is+so+with+God+for+us.+%5B6.%5D+It+is+the+priesthood+of+Christ+that+the+apostle+treats+of+in+this+place%2C+and+that+alone.+Wherefore+he+is+a+surety+as+he+is+a+priest%2C+and+in+the+discharge+of+that+office%3B+and+is+therefore+so+with+God+on+our+behalf.+%E2%80%A6+%283.%29+It+remaineth+that+we+inquire+positively+how+the+Lord+Christ+was+the+surety+of+the+new+covenant%2C+and+what+is+the+benefit+we+receive+thereby.+And+unto+this+purpose+we+must+first+consider+that+opinion+of+some+that+the+whole+end+of+the+mediation+of+Christ+was+only+to+procure+the+new+covenant%3A+although+at+first+view+it+be+irreconcilable+unto+the+nature+and+notion+of+a+surety%3B+for+a+surety+is+not+the+procurer+of+that+whereof+he+is+the+surety%2C+but+only+the+undertaker+for+its+accomplishment.+But+we+must+more+distinctly+consider+this+assertion%2C+and+in+what+sense+Christ+may+be+said+to+procure+the+new+covenant+by+his+death+and+mediation.+And+to+this+end+we+must+observe%2C+that+the+new+covenant+may+be+considered+divers+ways%2C+in+various+respects%3A%E2%80%94+%5B1.%5D+In+the+designation+and+preparation+of+its+terms+and+benefits+in+the+counsel+of+God.+And+this%2C+although+it+have+the+nature+of+an+eternal+decree%2C+yet+is+it+distinguished+from+the+decree+of+election%2C+which+first+and+properly+respects+the+subjects+or+persons+for+whom+grace+and+glory+are+prepared%3B+for+this+respects+the+preparation+only+of+that+grace+and+glory%2C+as+to+the+way+and+manner+of+their+communication.+It+is+true%2C+this+purpose%2C+or+counsel+of+God%E2%80%99s+will%2C+is+not+called+the+covenant+of+grace%2C+which+is+the+express+declared+exemplification+of+it.+The+covenant+of+grace%2C+I+say%2C+is+only+the+declaration+of+this+counsel+of+God%E2%80%99s+will%2C+accompanied+with+the+means+and+power+of+its+accomplishment%2C+and+the+prescription+of+the+ways+whereby+we+are+to+be+interested+in+it%2C+and+made+partakers+of+the+benefits+of+it.+But+in+the+inquiry+after+the+procuring+cause+of+the+new+covenant%2C+it+is+the+first+thing+that+ought+to+come+under+consideration%3B+for+nothing+can+be+the+procuring+cause+of+this+covenant+which+is+not+so+of+this+spring+and+fountain+of+it%2C%E2%80%94of+this+idea+of+it+in+the+mind+of+God.+But+this+is+nowhere+in+the+Scripture+affirmed+to+be+the+effect+of+the+death+or+mediation+of+Christ%3B+and+so+to+ascribe+it%2C+is+to+overthrow+the+whole+freedom+of+eternal+grace+and+love.+Neither+can+any+thing+that+is+absolutely+eternal%2C+as+is+this+decree+and+counsel+of+God%2C+be+the+effect+of%2C+or+be+procured+by%2C+any+thing+that+is+external+and+temporal.+And+besides%2C+it+is+expressly+assigned+unto+absolute+love+and+grace%3A+see+Eph.+1%3A4%E2%80%936%2C+with+all+those+places+where+the+love+of+God+is+assigned+as+the+sole+cause+of+the+designation+of+Christ+unto+his+office%2C+and+the+sending+of+him.+%5B2.%5D+It+may+be+considered+with+respect+unto+the+federal+transactions+between+the+Father+and+Son+concerning+the+accomplishment+of+this+counsel+of+his+will.+What+these+were%2C+wherein+they+did+consist%2C+I+have+declared+at+large+in+my+exercitations.+Neither+do+I+call+this+the+covenant+of+grace+absolutely%2C+nor+is+it+so+called+in+the+Scripture%3A+but+it+is+that+wherein+it+had+its+establishment%2C+as+unto+all+the+ways%2C+means%2C+and+ends+of+its+accomplishment%3B+and+by+it+were+all+things+so+disposed%2C+as+that+it+might+be+effectual+unto+the+glory+of+the+wisdom%2C+grace%2C+righteousness%2C+and+power+of+God.+Wherefore+the+covenant+of+grace+could+not+be+procured+by+any+means+or+cause+but+that+which+was+the+cause+of+this+covenant+of+the+mediator%2C+or+of+God+the+Father+with+the+Son+as+undertaking+the+work+of+mediation.+And+as+this+is+nowhere+ascribed+unto+the+death+of+Christ+in+the+Scripture%2C+so+to+assert+it+is+contrary+unto+all+spiritual+reason+and+understanding.+Who+can+conceive+that+Christ%2C+by+his+death%2C+should+procure+the+agreement+between+God+and+him+that+he+should+die%3F+%5B3.%5D+With+respect+unto+the+declaration+of+it.+This+you+may+call+God%E2%80%99s+making+or+establishing+of+it+with+us%2C+if+you+please%3B+though+making+of+the+covenant+in+the+Scripture+is+applied+only+unto+its+execution+or+actual+application+unto+persons.+But+this+declaration+of+the+grace+of+God%2C+and+the+provision+in+the+covenant+of+the+mediator+for+the+making+of+it+effectual+unto+his+glory%2C+is+most+usually+called+the+covenant+of+grace.+And+this+is+twofold%3A%E2%80%94+1st.+In+the+way+of+a+singular+and+absolute+promise%3B+as+it+was+first+declared+unto+and+thereby+established+with+Adam%2C+and+afterwards+with+Abraham.+This+is+the+declaration+of+the+purpose+of+God%2C+or+the+free+determination+of+his+will+as+to+his+dealing+with+sinners%2C+on+the+supposition+of+the+fall+and+the+forfeiture+of+their+first+covenant+state.+Hereof+the+grace+and+will+of+God+were+the+only+cause%2C+Heb.+8%3A8.+And+the+death+of+Christ+could+not+be+the+means+of+its+procurement%3B+for+he+himself%2C+and+all+that+he+was+to+do+for+us%2C+were+the+substance+of+that+promise+wherein+this+declaration+of+God%E2%80%99s+grace+and+purpose+was+made%2C+or+of+this+covenant+of+grace%2C+which+was+introduced+and+established+in+the+room+of+that+which+was+broken+and+disannulled%2C+as+unto+the+ends+and+benefits+of+a+covenant.+The+substance+of+the+first+promise%2C+wherein+the+whole+covenant+of+grace+was+virtually+comprised%2C+directly+respected+and+expressed+the+giving+of+him+for+the+recovery+of+mankind+from+sin+and+misery%2C+by+his+death%2C+Gen.+3%3A15.+Wherefore+if+he%2C+and+all+the+benefits+of+his+mediation%2C+his+death+and+all+the+effects+of+it%2C+be+contained+in+the+promise+of+the+covenant%2C+that+is%2C+in+the+covenant+itself%2C+then+was+not+his+death+the+procuring+cause+of+that+covenant%2C+nor+do+we+owe+it+thereunto.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%2C+ed.+W.+H.+Goold%2C+vol.+22%2C+Works+of+John+Owen+%28Edinburgh%3A+Johnstone+and+Hunter%2C+1855%29%2C+502%E2%80%93506.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff08c05e564.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f08c05e564.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/owen-the-new-covenant-was-inaugurated-after-the-fall-a

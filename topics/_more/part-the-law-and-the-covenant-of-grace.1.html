<div class="actions"><button class="copy" data-copy="“The Covenant of Grace Identical in both Old and New Testaments Question #1: When was this covenant of grace initiated? Answer: Due to a misunderstanding concerning the nature of the covenant of grace, the Socinians and Arminians, who are in this respect like-minded, claim that it did not exist in the Old Testament. Although they admit that it was announced that a Savior would come at a given time, and that a covenant of grace would be established at a given time, they claim that there was no such covenant during the Old Testament dispensation. They claim that those living in that dispensation were not partakers of this covenant, did not receive any promises concerning eternal salvation, and did not receive eternal life by faith and hope in a future Savior. Instead, they received it by grace, that is, on the basis of their virtuousness. To this we respond that, although the administration of the covenant was very different in both testaments, this covenant, as far as essence is concerned, existed as well in the Old Testament—being initiated with Adam—as presently in the New Testament. Proof #1: This is first of all confirmed by the fact that immediately after the fall this covenant was established in Paradise by way of the promise in Genesis 3:15, “It (the seed of the woman) shall bruise thy head (the serpent).” This Seed of the woman is the Lord Jesus, who without the involvement of a man was born of the Virgin Mary. Such never has been nor ever shall be true for any man. Christ alone, and no one else, has bruised the head of the serpent, that is, the devil. “That through death He might destroy him that had the power of death, that is, the devil” (Heb. 2:14); “For this purpose the Son of God was manifested, that He might destroy the works of the devil” (1 John 3:8). Christ, the Seed of the woman, who would bruise the head of the devil, is promised here, which can be deduced from the threat made to the serpent. This promise was not addressed to Adam and Eve, but only within their hearing. From this it follows that the covenant of grace was not established with Adam and Eve, and in them with all their descendants as was true for the covenant of works. Rather, Adam and Eve, hearing this promise, had to receive the promised Savior for themselves in order to be comforted, as every believer has done subsequent to the giving of this promise, which shall become evident in what follows. Proof #2: The gospel, which is the offer of this covenant, is proclaimed in the Old Testament as well as in the New Testament. “And the Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8). He said “in thee,” that is, in thy Seed, which is Christ. “He saith not, And to seeds, as of many; but as of one, And to thy Seed, which is Christ” (Gal. 3:16). Abraham believed this good news, not for the heathen who still would come and believe, but for himself. It was to his personal benefit, it being unto justification, which is an acquittal from guilt and punishment, and a granting of the right unto eternal life. This is confirmed in Genesis 15:6, “And he believed (note: not “the LORD,” but) in the LORD; and he counted it to him for righteousness”; “And the Scripture was fulfilled which saith, Abraham believed God, and it was imputed unto him for righteousness: and he was called the friend of God” (James 2:23). That the gospel was proclaimed to him was not an extraordinary privilege afforded to Abraham alone. The church of the Old Testament had the identical privilege, which is evident from Hebrews 4:2a, “For unto us was the gospel preached, as well as unto them.” It is proclaimed to us in order that we would receive it to our benefit, and thus likewise also to their benefit. The reason why many did not profit from this was not to be attributed to the fact that it was not offered unto them, but due to their not receiving it by faith. “But the Word preached did not profit them, not being mixed with faith in them that heard it” (Heb. 4:2b). Thus, in the Old Testament dispensation Christ was proclaimed and offered in the gospel, and everyone was obligated by means of this gospel to believe in Christ unto justification as Abraham did. The covenant of grace therefore existed in the Old Testament. Observe this also in reference to Moses. “By faith Moses, when he was come to years, refused to be called the son of Pharaoh’s daughter, esteeming the reproach of Christ greater riches than the treasures in Egypt: for he had respect unto the recompense of the reward” (Heb. 11:24, 26). Moses knew Christ, believed in Christ, esteemed Christ as being precious, and had the promises in view through Christ. This chapter enumerates an entire register of Old Testament believers, and the benefits of which they became partakers by faith in Christ. Proof #3: The Surety of the covenant was equally efficacious in the Old Testament as in the New, and thus this covenant existed then as well as now. “Jesus Christ the same yesterday, and to-day, and for ever” (Heb. 13:8). “Today” refers to the present time, “for ever” refers to the future, and “yesterday” refers to the past. The apostle does not merely state that Christ was, is and shall be, but he says that Christ has always been the same; that is, unto reconciliation, comfort, and help. Therefore one ought not to faint under oppression. By “yesterday” we cannot understand the time immediately prior to Paul, that is, the period of Christ’s sojourn upon earth. It is very evident that the apostle exhorts the believers to be steadfast, since Christ at all times—that is, as soon as the church came into existence and as long as the church shall exist—is the same faithful Savior. “Yesterday” therefore refers to the time prior to Christ’s incarnation, which also is confirmed by the statement that Christ has been slain before the foundation of the world. “Whose names are not written in the book of life of the Lamb slain from the foundation of the world” (Rev. 13:8). The words “from the foundation of the world” may not be made to relate to the words “whose names are not written in the book of life.” There is no need to go back to that earlier phrase, and Christ never is said to be slain without any modifying statement. Even if one were to interpret these words as such, namely, “whose names are not written in the book of life of the Lamb before the foundation of the world,” it remains an established fact that there was a book from before the foundation of the world in which the names of believers were written. This is the book of the Lamb, that is, of Christ, and thus Christ’s death is noted as being efficacious at that time, since no one can be written in that book except it be for the efficacy of His death by being slain. It is very simple and clear, however, that one should join the words as the apostle does: “the Lamb, slain from the foundation of the world.” Question: But in what manner has Christ been slain since that time? The apostle appears to contradict this in Hebrews 9:26, where we read, “For then must He often have suffered since the foundation of the world.” Answer: The apostle shows that the death of Christ had to occur but once, and that this one sacrifice was efficacious from the foundation of the world. He thus forcefully confirms that this one death of Christ already was efficacious then, this being such as if He both at that time and since that time had actually suffered. He thus confirms that Christ is the same yesterday and today. Christ was not slain actuality from the foundation of the world, but rather as far as the efficacy of His sacrifice was concerned. From that moment believers believed in Him through the sacrifices, wherein they beheld the death of the Savior to come, and received Him by faith unto justification. This was true of Abel and Enoch, for we read, “By faith Abel offered unto God a more excellent sacrifice than Cain, by which he obtained witness that he was righteous, for before his translation he had this testimony that he pleased God” (Heb. 11:4–5). Abel sacrificed in faith, Abel pleased God, and Abel was righteous. This expresses irrefutably that Abel saw Christ represented in his sacrifice. Proof #4: Believers in the Old Testament had all the spiritual benefits of the covenant of grace, and thus they, as is true for us in the New Testament, had the covenant itself. (1) God was their God and their Father. “I am the LORD thy God” (Exo. 20:2); “I am thy God” (Isa. 41:10); “But now, O LORD, thou art our Father” (Isa. 64:8); “Wilt thou not from this time cry unto Me, My Father?” (Jer. 3:4). (2) They had the forgiveness of sins. “As for our transgressions, Thou shalt purge them away” (Psa. 65:3); “Thou forgavest the iniquity of my sin. Selah” (Psa. 32:5). (3) They had the spirit of adoption unto children, “to whom pertaineth the adoption” (Rom. 9:4); “We having the same Spirit of faith” (2 Cor. 4:13); “Thy Spirit is good; lead me into the land of uprightness” (Psa. 143:10). (4) They had peace of conscience with God. “Thou hast put gladness in my heart” (Psa. 4:7); “Truly my soul waiteth upon God” (Psa. 62:1). (5) They had childlike communion with God. “When I awake, I am still with Thee” (Psa. 139:18); “But it is good for me to draw near to God” (Psa. 73:28). (6) They were partakers of sanctification. “O how love I Thy law! it is my meditation all the day” (Psa. 119:97). (7) After death they entered eternal bliss, for which they longed. “For he looked for a city which hath foundations. But now they desire a better country, that is, an heavenly” (Heb. 11:10, 16). They were the recipients of this salvation. “But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they” (Acts 15:11). The apostle neither refers here to the heathen, nor does he elevate the salvation of the heathen above the salvation of the Jews, but his reference was to the fathers who could not bear the yoke and nevertheless were saved by faith. From this he affirms that their expectation of salvation was also by faith and not by the works of the ceremonial law. From this he concludes that one must not impose the requirement of circumcision and the keeping of the ceremonial law upon the Gentiles. From all this it is evident that believers under the Old Testament enjoyed the benefits of the covenant of grace, had the covenant itself and were partakers of the same covenant with us, having all eaten the same spiritual meat and having drunk the same spiritual drink (1 Cor. 10:3–4). Therefore the apostle Peter called the Jewish nation, “The children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Objection #1: In the Old Testament believers did not receive the promises, “not having received the promises” (Heb. 11:13). Answer: The promises to which the apostle here refers have reference to the incarnation of Christ, which they saw from afar, believed, and embraced. Objection #2: “For the law made nothing perfect” (Heb. 7:19). Answer: The ceremonial laws to which the apostle refers here lacked efficacy of satisfaction, but did point to Christ. They were a stimulus for a better hope. By faith in a Messiah to come they were perfect in Him (Col. 2:13). Objection #3: In Hebrews 9:8 we read “that the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing.” Answer: Christ is the way (John 14:6). Christ consecrated the way to God and to glory through the veil, that is to say, His flesh (cf. Heb. 10:19–20). The text states that as long as the ceremonies were still in effect, Christ had not yet actually paid the ransom, nor merited salvation for His own. When this occurred, however, these ceremonies no longer served a purpose. The apostle does not say that no one entered heaven during that time period, which is something most opposing parties would not dare to deny. Enoch, Elijah, Moses, Abraham, Isaac, and Jacob would rebuke them. Neither does the apostle state that the way to heaven was not known as yet, for whoever possesses faith, hope, and love, also knows the way. He stated rather that Christ Himself—who would accomplish that which the entire tabernacle service could not bring to pass, that is, the salvation of sinners—had not yet come in the flesh. Objection #4: The apostle stated that Christ “hath abolished death, and hath brought life and immortality to light through the gospel” (2 Tim. 1:10). Thus light and life were not present prior to Christ’s incarnation. Answer: The text indeed states that Christ is He who has brought life and immortality to light. It does not mention, however, that Christ did this only subsequent to His incarnation, and not prior to His coming. We have shown above that Christ, who is the same yesterday and today, was thus engaged in the Old Testament, the gospel having been proclaimed also during that time. This text, however, refers to the measure of revelation, and to the revelation of the gospel unto the Gentiles, which, prior to this, had only occurred in Israel. This is confirmed in verse 11, where we read, “Whereunto I am appointed a preacher, and an apostle, and a teacher of the Gentiles.” The apostle states this expressly when he says, “Which in other ages was not made known unto the sons of men, as it is now revealed … that the Gentiles should be fellow heirs.… Unto me, who am less than the least of all saints, is this grace given, that I should preach among the Gentiles the unsearchable riches of Christ” (Eph. 3:5–6, 8). In like manner Acts 16:25–26 is to be understood, where we read, “… according to the revelation of the mystery, which was kept secret since the world began, but now is made manifest, and by the scriptures of the prophets, according to the commandment of the everlasting God, made known to all nations for the obedience of faith.” From this it is evident that there is not a distinction between the Old and the New Testament as far as the way of salvation is concerned, but the distinction is between the Jewish nation, which at that time was the only recipient of revelations, and the Gentiles who now have the very same revelation. Objection #5: Consider the following texts. “And these all, having obtained a good report through faith, received not the promise, God having provided some better thing for us, that they without us should not be made perfect” (Heb. 11:39–40); “Unto whom it was revealed, that not unto themselves, but unto us they did minister the things” (1 Pet. 1:12). It is evident from these texts that they who lived during the Old Testament period did not partake of these benefits. Answer: These texts expressly refer to the incarnation of Christ, it being evident that these promises were not received while these saints lived. They proclaimed that Christ at one time would come, but that they did not expect Him during their time. In this respect they did not minister unto themselves but unto us who live subsequent to the coming of Christ, and may behold and enjoy the fulfillment of that promise. And thus we enjoy better things than they; that is, they are better since the fulfillment of the promise is better than the promise itself. It thus follows that these texts do not refer to the enjoyment of the benefits of the covenant, for they were partakers of this as much as we are (which has already been shown); the apostle pointed to this in the text itself when he stated, “that they without us should not be made perfect.” They thus were made perfect, not by the works of the law, but through Christ, whose coming they had in the promises of which we have the fulfillment. They were therefore not saved on any different basis than we, for we and they are saved by the very same Surety. The New Testament is superior to the Old Testament only as far as administration is concerned.”

— Wilhelmus à Brakel, The Christian’s Reasonable Service, ed. Joel R. Beeke, trans. Bartel Elshout, vol. 1 (Grand Rapids, MI: Reformation Heritage Books, 1992), 451–57.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Covenant+of+Grace+Identical+in+both+Old+and+New+Testaments+Question+%231%3A+When+was+this+covenant+of+grace+initiated%3F+Answer%3A+Due+to+a+misunderstanding+concerning+the+nature+of+the+covenant+of+grace%2C+the+Socinians+and+Arminians%2C+who+are+in+this+respect+like-minded%2C+claim+that+it+did+not+exist+in+the+Old+Testament.+Although+they+admit+that+it+was+announced+that+a+Savior+would+come+at+a+given+time%2C+and+that+a+covenant+of+grace+would+be+established+at+a+given+time%2C+they+claim+that+there+was+no+such+covenant+during+the+Old+Testament+dispensation.+They+claim+that+those+living+in+that+dispensation+were+not+partakers+of+this+covenant%2C+did+not+receive+any+promises+concerning+eternal+salvation%2C+and+did+not+receive+eternal+life+by+faith+and+hope+in+a+future+Savior.+Instead%2C+they+received+it+by+grace%2C+that+is%2C+on+the+basis+of+their+virtuousness.+To+this+we+respond+that%2C+although+the+administration+of+the+covenant+was+very+different+in+both+testaments%2C+this+covenant%2C+as+far+as+essence+is+concerned%2C+existed+as+well+in+the+Old+Testament%E2%80%94being+initiated+with+Adam%E2%80%94as+presently+in+the+New+Testament.+Proof+%231%3A+This+is+first+of+all+confirmed+by+the+fact+that+immediately+after+the+fall+this+covenant+was+established+in+Paradise+by+way+of+the+promise+in+Genesis+3%3A15%2C+%E2%80%9CIt+%28the+seed+of+the+woman%29+shall+bruise+thy+head+%28the+serpent%29.%E2%80%9D+This+Seed+of+the+woman+is+the+Lord+Jesus%2C+who+without+the+involvement+of+a+man+was+born+of+the+Virgin+Mary.+Such+never+has+been+nor+ever+shall+be+true+for+any+man.+Christ+alone%2C+and+no+one+else%2C+has+bruised+the+head+of+the+serpent%2C+that+is%2C+the+devil.+%E2%80%9CThat+through+death+He+might+destroy+him+that+had+the+power+of+death%2C+that+is%2C+the+devil%E2%80%9D+%28Heb.+2%3A14%29%3B+%E2%80%9CFor+this+purpose+the+Son+of+God+was+manifested%2C+that+He+might+destroy+the+works+of+the+devil%E2%80%9D+%281+John+3%3A8%29.+Christ%2C+the+Seed+of+the+woman%2C+who+would+bruise+the+head+of+the+devil%2C+is+promised+here%2C+which+can+be+deduced+from+the+threat+made+to+the+serpent.+This+promise+was+not+addressed+to+Adam+and+Eve%2C+but+only+within+their+hearing.+From+this+it+follows+that+the+covenant+of+grace+was+not+established+with+Adam+and+Eve%2C+and+in+them+with+all+their+descendants+as+was+true+for+the+covenant+of+works.+Rather%2C+Adam+and+Eve%2C+hearing+this+promise%2C+had+to+receive+the+promised+Savior+for+themselves+in+order+to+be+comforted%2C+as+every+believer+has+done+subsequent+to+the+giving+of+this+promise%2C+which+shall+become+evident+in+what+follows.+Proof+%232%3A+The+gospel%2C+which+is+the+offer+of+this+covenant%2C+is+proclaimed+in+the+Old+Testament+as+well+as+in+the+New+Testament.+%E2%80%9CAnd+the+Scripture%2C+foreseeing+that+God+would+justify+the+heathen+through+faith%2C+preached+before+the+gospel+unto+Abraham%2C+saying%2C+In+thee+shall+all+nations+be+blessed%E2%80%9D+%28Gal.+3%3A8%29.+He+said+%E2%80%9Cin+thee%2C%E2%80%9D+that+is%2C+in+thy+Seed%2C+which+is+Christ.+%E2%80%9CHe+saith+not%2C+And+to+seeds%2C+as+of+many%3B+but+as+of+one%2C+And+to+thy+Seed%2C+which+is+Christ%E2%80%9D+%28Gal.+3%3A16%29.+Abraham+believed+this+good+news%2C+not+for+the+heathen+who+still+would+come+and+believe%2C+but+for+himself.+It+was+to+his+personal+benefit%2C+it+being+unto+justification%2C+which+is+an+acquittal+from+guilt+and+punishment%2C+and+a+granting+of+the+right+unto+eternal+life.+This+is+confirmed+in+Genesis+15%3A6%2C+%E2%80%9CAnd+he+believed+%28note%3A+not+%E2%80%9Cthe+LORD%2C%E2%80%9D+but%29+in+the+LORD%3B+and+he+counted+it+to+him+for+righteousness%E2%80%9D%3B+%E2%80%9CAnd+the+Scripture+was+fulfilled+which+saith%2C+Abraham+believed+God%2C+and+it+was+imputed+unto+him+for+righteousness%3A+and+he+was+called+the+friend+of+God%E2%80%9D+%28James+2%3A23%29.+That+the+gospel+was+proclaimed+to+him+was+not+an+extraordinary+privilege+afforded+to+Abraham+alone.+The+church+of+the+Old+Testament+had+the+identical+privilege%2C+which+is+evident+from+Hebrews+4%3A2a%2C+%E2%80%9CFor+unto+us+was+the+gospel+preached%2C+as+well+as+unto+them.%E2%80%9D+It+is+proclaimed+to+us+in+order+that+we+would+receive+it+to+our+benefit%2C+and+thus+likewise+also+to+their+benefit.+The+reason+why+many+did+not+profit+from+this+was+not+to+be+attributed+to+the+fact+that+it+was+not+offered+unto+them%2C+but+due+to+their+not+receiving+it+by+faith.+%E2%80%9CBut+the+Word+preached+did+not+profit+them%2C+not+being+mixed+with+faith+in+them+that+heard+it%E2%80%9D+%28Heb.+4%3A2b%29.+Thus%2C+in+the+Old+Testament+dispensation+Christ+was+proclaimed+and+offered+in+the+gospel%2C+and+everyone+was+obligated+by+means+of+this+gospel+to+believe+in+Christ+unto+justification+as+Abraham+did.+The+covenant+of+grace+therefore+existed+in+the+Old+Testament.+Observe+this+also+in+reference+to+Moses.+%E2%80%9CBy+faith+Moses%2C+when+he+was+come+to+years%2C+refused+to+be+called+the+son+of+Pharaoh%E2%80%99s+daughter%2C+esteeming+the+reproach+of+Christ+greater+riches+than+the+treasures+in+Egypt%3A+for+he+had+respect+unto+the+recompense+of+the+reward%E2%80%9D+%28Heb.+11%3A24%2C+26%29.+Moses+knew+Christ%2C+believed+in+Christ%2C+esteemed+Christ+as+being+precious%2C+and+had+the+promises+in+view+through+Christ.+This+chapter+enumerates+an+entire+register+of+Old+Testament+believers%2C+and+the+benefits+of+which+they+became+partakers+by+faith+in+Christ.+Proof+%233%3A+The+Surety+of+the+covenant+was+equally+efficacious+in+the+Old+Testament+as+in+the+New%2C+and+thus+this+covenant+existed+then+as+well+as+now.+%E2%80%9CJesus+Christ+the+same+yesterday%2C+and+to-day%2C+and+for+ever%E2%80%9D+%28Heb.+13%3A8%29.+%E2%80%9CToday%E2%80%9D+refers+to+the+present+time%2C+%E2%80%9Cfor+ever%E2%80%9D+refers+to+the+future%2C+and+%E2%80%9Cyesterday%E2%80%9D+refers+to+the+past.+The+apostle+does+not+merely+state+that+Christ+was%2C+is+and+shall+be%2C+but+he+says+that+Christ+has+always+been+the+same%3B+that+is%2C+unto+reconciliation%2C+comfort%2C+and+help.+Therefore+one+ought+not+to+faint+under+oppression.+By+%E2%80%9Cyesterday%E2%80%9D+we+cannot+understand+the+time+immediately+prior+to+Paul%2C+that+is%2C+the+period+of+Christ%E2%80%99s+sojourn+upon+earth.+It+is+very+evident+that+the+apostle+exhorts+the+believers+to+be+steadfast%2C+since+Christ+at+all+times%E2%80%94that+is%2C+as+soon+as+the+church+came+into+existence+and+as+long+as+the+church+shall+exist%E2%80%94is+the+same+faithful+Savior.+%E2%80%9CYesterday%E2%80%9D+therefore+refers+to+the+time+prior+to+Christ%E2%80%99s+incarnation%2C+which+also+is+confirmed+by+the+statement+that+Christ+has+been+slain+before+the+foundation+of+the+world.+%E2%80%9CWhose+names+are+not+written+in+the+book+of+life+of+the+Lamb+slain+from+the+foundation+of+the+world%E2%80%9D+%28Rev.+13%3A8%29.+The+words+%E2%80%9Cfrom+the+foundation+of+the+world%E2%80%9D+may+not+be+made+to+relate+to+the+words+%E2%80%9Cwhose+names+are+not+written+in+the+book+of+life.%E2%80%9D+There+is+no+need+to+go+back+to+that+earlier+phrase%2C+and+Christ+never+is+said+to+be+slain+without+any+modifying+statement.+Even+if+one+were+to+interpret+these+words+as+such%2C+namely%2C+%E2%80%9Cwhose+names+are+not+written+in+the+book+of+life+of+the+Lamb+before+the+foundation+of+the+world%2C%E2%80%9D+it+remains+an+established+fact+that+there+was+a+book+from+before+the+foundation+of+the+world+in+which+the+names+of+believers+were+written.+This+is+the+book+of+the+Lamb%2C+that+is%2C+of+Christ%2C+and+thus+Christ%E2%80%99s+death+is+noted+as+being+efficacious+at+that+time%2C+since+no+one+can+be+written+in+that+book+except+it+be+for+the+efficacy+of+His+death+by+being+slain.+It+is+very+simple+and+clear%2C+however%2C+that+one+should+join+the+words+as+the+apostle+does%3A+%E2%80%9Cthe+Lamb%2C+slain+from+the+foundation+of+the+world.%E2%80%9D+Question%3A+But+in+what+manner+has+Christ+been+slain+since+that+time%3F+The+apostle+appears+to+contradict+this+in+Hebrews+9%3A26%2C+where+we+read%2C+%E2%80%9CFor+then+must+He+often+have+suffered+since+the+foundation+of+the+world.%E2%80%9D+Answer%3A+The+apostle+shows+that+the+death+of+Christ+had+to+occur+but+once%2C+and+that+this+one+sacrifice+was+efficacious+from+the+foundation+of+the+world.+He+thus+forcefully+confirms+that+this+one+death+of+Christ+already+was+efficacious+then%2C+this+being+such+as+if+He+both+at+that+time+and+since+that+time+had+actually+suffered.+He+thus+confirms+that+Christ+is+the+same+yesterday+and+today.+Christ+was+not+slain+actuality+from+the+foundation+of+the+world%2C+but+rather+as+far+as+the+efficacy+of+His+sacrifice+was+concerned.+From+that+moment+believers+believed+in+Him+through+the+sacrifices%2C+wherein+they+beheld+the+death+of+the+Savior+to+come%2C+and+received+Him+by+faith+unto+justification.+This+was+true+of+Abel+and+Enoch%2C+for+we+read%2C+%E2%80%9CBy+faith+Abel+offered+unto+God+a+more+excellent+sacrifice+than+Cain%2C+by+which+he+obtained+witness+that+he+was+righteous%2C+for+before+his+translation+he+had+this+testimony+that+he+pleased+God%E2%80%9D+%28Heb.+11%3A4%E2%80%935%29.+Abel+sacrificed+in+faith%2C+Abel+pleased+God%2C+and+Abel+was+righteous.+This+expresses+irrefutably+that+Abel+saw+Christ+represented+in+his+sacrifice.+Proof+%234%3A+Believers+in+the+Old+Testament+had+all+the+spiritual+benefits+of+the+covenant+of+grace%2C+and+thus+they%2C+as+is+true+for+us+in+the+New+Testament%2C+had+the+covenant+itself.+%281%29+God+was+their+God+and+their+Father.+%E2%80%9CI+am+the+LORD+thy+God%E2%80%9D+%28Exo.+20%3A2%29%3B+%E2%80%9CI+am+thy+God%E2%80%9D+%28Isa.+41%3A10%29%3B+%E2%80%9CBut+now%2C+O+LORD%2C+thou+art+our+Father%E2%80%9D+%28Isa.+64%3A8%29%3B+%E2%80%9CWilt+thou+not+from+this+time+cry+unto+Me%2C+My+Father%3F%E2%80%9D+%28Jer.+3%3A4%29.+%282%29+They+had+the+forgiveness+of+sins.+%E2%80%9CAs+for+our+transgressions%2C+Thou+shalt+purge+them+away%E2%80%9D+%28Psa.+65%3A3%29%3B+%E2%80%9CThou+forgavest+the+iniquity+of+my+sin.+Selah%E2%80%9D+%28Psa.+32%3A5%29.+%283%29+They+had+the+spirit+of+adoption+unto+children%2C+%E2%80%9Cto+whom+pertaineth+the+adoption%E2%80%9D+%28Rom.+9%3A4%29%3B+%E2%80%9CWe+having+the+same+Spirit+of+faith%E2%80%9D+%282+Cor.+4%3A13%29%3B+%E2%80%9CThy+Spirit+is+good%3B+lead+me+into+the+land+of+uprightness%E2%80%9D+%28Psa.+143%3A10%29.+%284%29+They+had+peace+of+conscience+with+God.+%E2%80%9CThou+hast+put+gladness+in+my+heart%E2%80%9D+%28Psa.+4%3A7%29%3B+%E2%80%9CTruly+my+soul+waiteth+upon+God%E2%80%9D+%28Psa.+62%3A1%29.+%285%29+They+had+childlike+communion+with+God.+%E2%80%9CWhen+I+awake%2C+I+am+still+with+Thee%E2%80%9D+%28Psa.+139%3A18%29%3B+%E2%80%9CBut+it+is+good+for+me+to+draw+near+to+God%E2%80%9D+%28Psa.+73%3A28%29.+%286%29+They+were+partakers+of+sanctification.+%E2%80%9CO+how+love+I+Thy+law%21+it+is+my+meditation+all+the+day%E2%80%9D+%28Psa.+119%3A97%29.+%287%29+After+death+they+entered+eternal+bliss%2C+for+which+they+longed.+%E2%80%9CFor+he+looked+for+a+city+which+hath+foundations.+But+now+they+desire+a+better+country%2C+that+is%2C+an+heavenly%E2%80%9D+%28Heb.+11%3A10%2C+16%29.+They+were+the+recipients+of+this+salvation.+%E2%80%9CBut+we+believe+that+through+the+grace+of+the+Lord+Jesus+Christ+we+shall+be+saved%2C+even+as+they%E2%80%9D+%28Acts+15%3A11%29.+The+apostle+neither+refers+here+to+the+heathen%2C+nor+does+he+elevate+the+salvation+of+the+heathen+above+the+salvation+of+the+Jews%2C+but+his+reference+was+to+the+fathers+who+could+not+bear+the+yoke+and+nevertheless+were+saved+by+faith.+From+this+he+affirms+that+their+expectation+of+salvation+was+also+by+faith+and+not+by+the+works+of+the+ceremonial+law.+From+this+he+concludes+that+one+must+not+impose+the+requirement+of+circumcision+and+the+keeping+of+the+ceremonial+law+upon+the+Gentiles.+From+all+this+it+is+evident+that+believers+under+the+Old+Testament+enjoyed+the+benefits+of+the+covenant+of+grace%2C+had+the+covenant+itself+and+were+partakers+of+the+same+covenant+with+us%2C+having+all+eaten+the+same+spiritual+meat+and+having+drunk+the+same+spiritual+drink+%281+Cor.+10%3A3%E2%80%934%29.+Therefore+the+apostle+Peter+called+the+Jewish+nation%2C+%E2%80%9CThe+children+of+the+prophets%2C+and+of+the+covenant+which+God+made+with+our+fathers%2C+saying+unto+Abraham%2C+And+in+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed%E2%80%9D+%28Acts+3%3A25%29.+Objection+%231%3A+In+the+Old+Testament+believers+did+not+receive+the+promises%2C+%E2%80%9Cnot+having+received+the+promises%E2%80%9D+%28Heb.+11%3A13%29.+Answer%3A+The+promises+to+which+the+apostle+here+refers+have+reference+to+the+incarnation+of+Christ%2C+which+they+saw+from+afar%2C+believed%2C+and+embraced.+Objection+%232%3A+%E2%80%9CFor+the+law+made+nothing+perfect%E2%80%9D+%28Heb.+7%3A19%29.+Answer%3A+The+ceremonial+laws+to+which+the+apostle+refers+here+lacked+efficacy+of+satisfaction%2C+but+did+point+to+Christ.+They+were+a+stimulus+for+a+better+hope.+By+faith+in+a+Messiah+to+come+they+were+perfect+in+Him+%28Col.+2%3A13%29.+Objection+%233%3A+In+Hebrews+9%3A8+we+read+%E2%80%9Cthat+the+way+into+the+holiest+of+all+was+not+yet+made+manifest%2C+while+as+the+first+tabernacle+was+yet+standing.%E2%80%9D+Answer%3A+Christ+is+the+way+%28John+14%3A6%29.+Christ+consecrated+the+way+to+God+and+to+glory+through+the+veil%2C+that+is+to+say%2C+His+flesh+%28cf.+Heb.+10%3A19%E2%80%9320%29.+The+text+states+that+as+long+as+the+ceremonies+were+still+in+effect%2C+Christ+had+not+yet+actually+paid+the+ransom%2C+nor+merited+salvation+for+His+own.+When+this+occurred%2C+however%2C+these+ceremonies+no+longer+served+a+purpose.+The+apostle+does+not+say+that+no+one+entered+heaven+during+that+time+period%2C+which+is+something+most+opposing+parties+would+not+dare+to+deny.+Enoch%2C+Elijah%2C+Moses%2C+Abraham%2C+Isaac%2C+and+Jacob+would+rebuke+them.+Neither+does+the+apostle+state+that+the+way+to+heaven+was+not+known+as+yet%2C+for+whoever+possesses+faith%2C+hope%2C+and+love%2C+also+knows+the+way.+He+stated+rather+that+Christ+Himself%E2%80%94who+would+accomplish+that+which+the+entire+tabernacle+service+could+not+bring+to+pass%2C+that+is%2C+the+salvation+of+sinners%E2%80%94had+not+yet+come+in+the+flesh.+Objection+%234%3A+The+apostle+stated+that+Christ+%E2%80%9Chath+abolished+death%2C+and+hath+brought+life+and+immortality+to+light+through+the+gospel%E2%80%9D+%282+Tim.+1%3A10%29.+Thus+light+and+life+were+not+present+prior+to+Christ%E2%80%99s+incarnation.+Answer%3A+The+text+indeed+states+that+Christ+is+He+who+has+brought+life+and+immortality+to+light.+It+does+not+mention%2C+however%2C+that+Christ+did+this+only+subsequent+to+His+incarnation%2C+and+not+prior+to+His+coming.+We+have+shown+above+that+Christ%2C+who+is+the+same+yesterday+and+today%2C+was+thus+engaged+in+the+Old+Testament%2C+the+gospel+having+been+proclaimed+also+during+that+time.+This+text%2C+however%2C+refers+to+the+measure+of+revelation%2C+and+to+the+revelation+of+the+gospel+unto+the+Gentiles%2C+which%2C+prior+to+this%2C+had+only+occurred+in+Israel.+This+is+confirmed+in+verse+11%2C+where+we+read%2C+%E2%80%9CWhereunto+I+am+appointed+a+preacher%2C+and+an+apostle%2C+and+a+teacher+of+the+Gentiles.%E2%80%9D+The+apostle+states+this+expressly+when+he+says%2C+%E2%80%9CWhich+in+other+ages+was+not+made+known+unto+the+sons+of+men%2C+as+it+is+now+revealed+%E2%80%A6+that+the+Gentiles+should+be+fellow+heirs.%E2%80%A6+Unto+me%2C+who+am+less+than+the+least+of+all+saints%2C+is+this+grace+given%2C+that+I+should+preach+among+the+Gentiles+the+unsearchable+riches+of+Christ%E2%80%9D+%28Eph.+3%3A5%E2%80%936%2C+8%29.+In+like+manner+Acts+16%3A25%E2%80%9326+is+to+be+understood%2C+where+we+read%2C+%E2%80%9C%E2%80%A6+according+to+the+revelation+of+the+mystery%2C+which+was+kept+secret+since+the+world+began%2C+but+now+is+made+manifest%2C+and+by+the+scriptures+of+the+prophets%2C+according+to+the+commandment+of+the+everlasting+God%2C+made+known+to+all+nations+for+the+obedience+of+faith.%E2%80%9D+From+this+it+is+evident+that+there+is+not+a+distinction+between+the+Old+and+the+New+Testament+as+far+as+the+way+of+salvation+is+concerned%2C+but+the+distinction+is+between+the+Jewish+nation%2C+which+at+that+time+was+the+only+recipient+of+revelations%2C+and+the+Gentiles+who+now+have+the+very+same+revelation.+Objection+%235%3A+Consider+the+following+texts.+%E2%80%9CAnd+these+all%2C+having+obtained+a+good+report+through+faith%2C+received+not+the+promise%2C+God+having+provided+some+better+thing+for+us%2C+that+they+without+us+should+not+be+made+perfect%E2%80%9D+%28Heb.+11%3A39%E2%80%9340%29%3B+%E2%80%9CUnto+whom+it+was+revealed%2C+that+not+unto+themselves%2C+but+unto+us+they+did+minister+the+things%E2%80%9D+%281+Pet.+1%3A12%29.+It+is+evident+from+these+texts+that+they+who+lived+during+the+Old+Testament+period+did+not+partake+of+these+benefits.+Answer%3A+These+texts+expressly+refer+to+the+incarnation+of+Christ%2C+it+being+evident+that+these+promises+were+not+received+while+these+saints+lived.+They+proclaimed+that+Christ+at+one+time+would+come%2C+but+that+they+did+not+expect+Him+during+their+time.+In+this+respect+they+did+not+minister+unto+themselves+but+unto+us+who+live+subsequent+to+the+coming+of+Christ%2C+and+may+behold+and+enjoy+the+fulfillment+of+that+promise.+And+thus+we+enjoy+better+things+than+they%3B+that+is%2C+they+are+better+since+the+fulfillment+of+the+promise+is+better+than+the+promise+itself.+It+thus+follows+that+these+texts+do+not+refer+to+the+enjoyment+of+the+benefits+of+the+covenant%2C+for+they+were+partakers+of+this+as+much+as+we+are+%28which+has+already+been+shown%29%3B+the+apostle+pointed+to+this+in+the+text+itself+when+he+stated%2C+%E2%80%9Cthat+they+without+us+should+not+be+made+perfect.%E2%80%9D+They+thus+were+made+perfect%2C+not+by+the+works+of+the+law%2C+but+through+Christ%2C+whose+coming+they+had+in+the+promises+of+which+we+have+the+fulfillment.+They+were+therefore+not+saved+on+any+different+basis+than+we%2C+for+we+and+they+are+saved+by+the+very+same+Surety.+The+New+Testament+is+superior+to+the+Old+Testament+only+as+far+as+administration+is+concerned.%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+The+Christian%E2%80%99s+Reasonable+Service%2C+ed.+Joel+R.+Beeke%2C+trans.+Bartel+Elshout%2C+vol.+1+%28Grand+Rapids%2C+MI%3A+Reformation+Heritage+Books%2C+1992%29%2C+451%E2%80%9357.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ab33e4200.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ab33e4200.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/brakel-the-substance-of-the-covenant-of-grace-is-identical-in-the-old-and-new-testaments/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The end which God aimed at in giving the law of Moses, was not, that any should ever attain to holiness or salvation by condition of perfect or sincere obedience to it; though, if there had been any such way of salvation at that time, it must have consisted in the performance of that law, which was then given to the church, to be a rule of life, as well as a covenant. There was another covenant made before that time with Abraham, Isaac, and Jacob, a covenant of grace, promising all blessings freely through Christ, the promised seed, by which only they were to be saved. And the covenant of the law was added, that they might see their sinfulness, and subjection to death and wrath, and the impossibility of attaining to life or holiness by their works, and be forced to trust on the free promise only for all their salvation, and that sin might be restrained by the spirit of bondage, until the coming of that promised seed Jesus Christ, and the more plentiful pouring out of the sanctifying Spirit, by him. This the apostle Paul shows largely (Gal. 3:15-24; Rom. 5:20,21 and 10:3,4). None of the Israelites under the Old Testament were ever saved by the Sinai covenant; neither did any of them ever attain to holiness by the terms of it. Some of them did indeed perform the commandments of it sincerely, though imperfectly: but those were first justified, and made partakers of life and holiness, by virtue of that better covenant made with Abraham, Isaac, and Jacob, which was the same in substance with the new covenant or testament established by the blood of Christ. Had it not been for the better covenant, the Sinai covenant would have proved to them an occasion of no happiness , but only of sin, despair, and destruction. Of itself it was only a killing letter, the ministration of death and condemnation: and therefore it is now abolished, 2 Cor. 3:6,8,9,11. – We have cause to praise God, for delivering His church, by the blood of Christ, from this yoke of bondage; and we have cause to abhor the device of those that would lay upon us a more grievous and terrible yoke, by turning our very new covenant in a covenant of sincere works, and leaving us no such better covenant, as the Israelites had under their yoke, to relieve us in our extremity.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The end which God aimed at in giving the law of Moses, was not, that any should ever attain to holiness or salvation by condition of perfect or sincere obedience to it; though, if there had been any such way of salvation at that time, it must have consisted in the performance of that law, which was then given to the church, to be a rule of life, as well as a covenant. There was another covenant made before that time with Abraham, Isaac, and Jacob, a covenant of grace, promising all blessings freely through Christ, the promised seed, by which only they were to be saved. And the covenant of the law was added, that they might see their sinfulness, and subjection to death and wrath, and the impossibility of attaining to life or holiness by their works, and be forced to trust on the free promise only for all their salvation, and that sin might be restrained by the spirit of bondage, until the coming of that promised seed Jesus Christ, and the more plentiful pouring out of the sanctifying Spirit, by him. This the apostle Paul shows largely (Gal. 3:15-24; Rom. 5:20,21 and 10:3,4). None of the Israelites under the Old Testament were ever saved by the Sinai covenant; neither did any of them ever attain to holiness by the terms of it. Some of them did indeed perform the commandments of it sincerely, though imperfectly: but those were first justified, and made partakers of life and holiness, by virtue of that better covenant made with Abraham, Isaac, and Jacob, which was the same in substance with the new covenant or testament established by the blood of Christ. Had it not been for the better covenant, the Sinai covenant would have proved to them an occasion of no happiness , but only of sin, despair, and destruction. Of itself it was only a killing letter, the ministration of death and condemnation: and therefore it is now abolished, 2 Cor. 3:6,8,9,11. – We have cause to praise God, for delivering His church, by the blood of Christ, from this yoke of bondage; and we have cause to abhor the device of those that would lay upon us a more grievous and terrible yoke, by turning our very new covenant in a covenant of sincere works, and leaving us no such better covenant, as the Israelites had under their yoke, to relieve us in our extremity.”

lling+letter%2C+the+ministration+of+death+and+condemnation%3A+and+therefore+it+is+now+abolished%2C+2+Cor.+3%3A6%2C8%2C9%2C11.+%E2%80%93+We+have+cause+to+praise+God%2C+for+delivering+His+church%2C+by+the+blood+of+Christ%2C+from+this+yoke+of+bondage%3B+and+we+have+cause+to+abhor+the+device+of+those+that+would+lay+upon+us+a+more+grievous+and+terrible+yoke%2C+by+turning+our+very+new+covenant+in+a+covenant+of+sincere+works%2C+and+leaving+us+no+such+better+covenant%2C+as+the+Israelites+had+under+their+yoke%2C+to+relieve+us+in+our+extremity.%E2%80%9D%0A%0A%E2%80%94+Walter+Marshall%2C+The+Gospel+Mystery+of+Sanctification%2C+51+%28HT%3A+Inwoo+Lee%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a2daaae1f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2a2daaae1f.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/01/walter-marshall-abraham-is-not-moses/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-fbbed27789" data-kw="">
<blockquote><p>And this doth and must determine the difference between the Jews and Christians about the promises of the Old Testament. They are all made unto the church. No individual person hath any interest in them but by virtue of his membership therewith. This church is, and always was, one and the same. With whomsoever it remains, the promises are theirs; and that not by implication or analogy, but directly and properly. They belong as immediately, at this day, either to the Jews or Christians, as they did of old to any. The question is, With whom is this church, founded on the promised Seed in the covenant? This is Zion, Jerusalem, Israel, Jacob, the temple of God. The Jews plead that it is with them, because they are the children of Abraham according to the flesh. Christians tell them that their privilege on this account was of another nature, and ended with the coming of the Messiah; that the church unto whom all the promises belong are only those who are heirs of Abraham’s faith, believing as he did, and thereby interested in his covenant. Not as though the promise made to Abraham were of none effect; for as it was made good unto his carnal seed in the exhibition of the Messiah, so the spiritual privileges of it belonged only unto those of the Jews and Gentiles in whom God had graciously purposed to effect the faith of Abraham. Thus was and is the church, whereunto all the promises belong, still one and the same, namely, Abraham’s children according to the faith: and among those promises this is one, that God will be a God unto them and their seed for ever.</p></blockquote>

</figure><figure class="quote" id="q-f25284b93f" data-kw="">
<blockquote><p>And herein is a solemn prefiguration of the implanting of believers of all nations into the covenant and faith of Abraham; for this name he received upon the solemn establishment of the covenant with him, as the apostle explains the place, Rom. 4:11–17. All, then, that believe are taken into the covenant of Abraham; and as unto the privileges of it, and inheritance to be obtained by it, they are no less his children and heirs than those who proceeded from his loins according to the flesh; as hath been manifested in our Exercitation concerning the oneness of the church. And herein also God manifested what was his design in his call and separation unto himself, even to make and constitute him and his posterity the means of bringing forth the promised Seed, wherein all nations were to be blessed.</p></blockquote>

<blockquote><p>Hieronymus Zanchius (Operum, Tom. iv. lib. i. c. 11), Maintains at large, and by several arguments, that we Christians have nothing to do with the moral precepts, as they were given to the Israelites by Moses; but only in so far as they agree with the law of nature, common to all nations, and confirmed by Christ, whom we acknowledge to be our king.</p></blockquote>

</figure><figure class="quote" id="q-7ff41b378c" data-kw="">
<blockquote><p>XIV. The law, which God in this manner published, consists of ten words or commandments, Exod. 34:28, Deut. 4:13. Wherefore the Greeks also called it δεκάλογος, the decalogue. Moreover the contents of those ten words are various. 1st, There is the prescription of certain duties; and in this, the nature of a law, as such, properly consists. 2dly, The threatening of divine vengeance against the transgressors thereof, as in the second and third commandments; and this is the sanction of the covenant of works, from which all threatenings are derived, as we explained at large, book iii. chap. i sect. 22. 3dly, The proposal of divine grace and favour; and as this is made to sinners, and that under a condition, not of perfect, but of sincere obedience, so far it flows from the covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants, 2.175</cite></span></figcaption>

</figure><figure class="quote" id="q-5c95a48cd0" data-kw="">
<blockquote><p>To be a God unto thee. In this single word we are plainly taught, that this was a spiritual covenant, not confirmed in reference to the present life only; but one from which Abraham might conceive the hope of eternal salvation, so that being raised even to heaven, he might lay hold of solid and perfect bliss. For those whom God adopts to himself, from among a people—seeing that he makes them partakers of his righteousness and of all good things—he also constitutes heirs of celestial life. Let us then mark this as the principal part of the covenant, that He who is the God of the living, not of the dead, promises to be a God to the children of Abraham. It follows afterwards, in the way of augmentation of the grant, that he promises to give them the land. I confess, indeed, that something greater and more excellent than itself was shadowed forth by the land of Canaan; yet this is not at variance with the statement, that the promise now made was an accession to that primary one, ‘I will be thy God.’ Now, although God again affirms, as before, that He will give the land to Abraham himself, we nevertheless know, that Abraham never possessed dominion over it; but the holy man was contented with his title to it alone, although the possession of it was not granted him; and, therefore, he calmly passed from his earthly pilgrimage into heaven. God again repeats that He will be a God to the posterity of Abraham, in order that they may not settle upon earth, but may regard themselves as trained for higher things.</p></blockquote>

<blockquote><p>The Old and the New Testaments are in essence one covenant (Luke 1:68–79; Acts 2:39; 3:25). They have one gospel (Rom. 1:2; Gal. 3:8; Heb. 4:2, 6; 2 Tim. 3:15); one mediator, namely, Christ, who existed also in the days of the Old Testament (John 1:1, 14; 8:58; Rom. 8:3; 2 Cor. 8:9; Gal. 4:4; Phil. 2:6; etc.), exercised his office of mediator (John 8:56; 1 Cor. 10:4; 1 Pet. 1:11; 3:19; Heb. 13:8), and is the only mediator for all humans and in all times (John 14:6; Acts 4:12; 1 Tim. 2:5). It included one faith as the way of salvation (Matt. 13:17; Acts 10:43; 15:11; Rom. 4:11; Gal. 3:6–7; Heb. 11); the same promises and benefits of God’s communion (2 Cor. 6:16; Rev. 21:3), forgiveness, justification (Acts 10:43; Rom. 4:22), and eternal life (Matt. 22:32; Gal. 3:18; Heb. 9:15; 11:10; etc.). The road was the same on which believers in the Old and the New Testaments walked, but the light in which they walked was different. For all the unity between them, therefore, there is also difference. The Old and the New Testaments as different dispensations of the same covenant of grace are related as promise and fulfillment (Acts 13:32; Rom. 1:2), as shadow and substance (Col. 2:17), as the letter that kills and the Spirit that makes alive (2 Cor. 3:6ff.), as servitude and freedom (Rom. 8:15; Gal. 4:1ff., 22ff.; Col. 2:20; Heb. 12:18f.), as particular and universal (John 4:21; Acts 10:35; 14:16; Gal. 4:4–5; 6:15; Eph. 2:14; 3:6). The new thing in the New Testament, therefore, is the shedding of the nonarbitrary but still temporary sensory national forms under which one and the same grace was revealed in the old day. The new dispensation already starts in a sense when, with the births of John the Baptist and Jesus, the promises of the Old Testament begin to be fulfilled. Yet the old dispensation still remained in effect up until the death of Christ. Jesus himself was an Israelite, fulfilled all righteousness, and still concerned himself only with the lost sheep of the house of Israel. But at his death, the curtain the temple tore in two (Matt. 27:51), the testator himself died (Heb. 9:15–17), the New Testament was founded in his blood (Matt. 26:28), the bond that stood against us was canceled (Col. 2:14), the dividing wall was broken down (Eph. 2:14), and so on. Factually the old dispensation may long linger, but legally it has been abolished. Better still, nothing was abolished, but the fruit was ripe and broke through the husk. The church, carried like a fetus in Israel’s womb, was born to an independent life of its own and in the Holy Spirit received an immanent life principle of its own. The sun of righteousness rose to its zenith in the heavens and shone out over all peoples. The law and the prophets have been fulfilled and in Christ as their end and goal reached their destiny. The law was given through Moses; grace and truth came through Jesus Christ (John 1:14). He is the truth (John 14:6), the substance (Col. 2:17) in whom all the promises and shadows have been realized. In him all things have been fulfilled. He is the true prophet, priest, and king; the true servant of the Lord, the true expiation (Rom. 3:25), the true sacrifice (Eph. 5:2), the true circumcision (Col. 2:11), the true Passover (1 Cor. 5:7), and therefore his church is the true seed of Abraham, the true Israel, the true people of God (Matt. 1:21; Luke 1:17; Rom. 9:25–26; 2 Cor. 6:16–18; Gal. 3:29; Titus 2:14; Heb. 8:8–10; 1 Pet. 2:9; Rev. 21:3), the true temple of God (1 Cor. 3:16; 2 Cor. 6:16; Eph. 2:21; 2 Thess. 2:4; Heb. 8:2, 5), the true Zion and Jerusalem (Gal. 4:26; Heb. 12:22), its spiritual offering, the true religion (John 4:24; Rom. 12:1; Phil. 3:3; 4:18; etc.). Nothing of the Old Testament is lost in the New, but everything is fulfilled, matured, has reached its full growth, and now, out of the temporary husk, produces the eternal core. It is not the case that in Israel there was a true temple and sacrifice and priesthood and so on and that all these have now vanished. The converse, rather, is true: of all this Israel only possessed a shadow, but now the substance itself has emerged. The things we see are temporal, but the invisible things are eternal.</p></blockquote>

<blockquote><p>5. In the same light are we to consider the law of the Decalogue, delivered by God to His peculiar people, the Jews, by the hands of Moses. For though it reveals the greatness of sin, and more and more convinces man thereof, yet, as it neither points out a remedy nor imparts strength to extricate him from his misery, but, being weak through the flesh, leaves the transgressor under the curse, and man cannot by this law obtain saving grace. 6. What, therefore, neither the light of nature nor the law could do, that God performs by the operation of the Holy Spirit through the word or ministry of reconciliation; which is the gospel concerning the Messiah, by means whereof it has pleased God to save such as believe, as well under the Old as under the New Testament.</p></blockquote>

<blockquote><p>Hence, also, we see the error of those who, in comparing the Law with the Gospel, represent it merely as a comparison between the merit of works, and the gratuitous imputation of righteousness. This is indeed a contrast not at all to be rejected. For Paul often means by the term “law” the rule of righteous living by which God requires of us what is his own, giving us no hope of life unless we completely obey him, and adding on the other hand a curse if we deviate even in the slightest degree. This Paul does when he contends that we pleasing to God through grace and accounted righteous through his pardon, because nowhere is found that observance of the law for which the reward has been promised. Paul therefore justly makes contraries of the righteousness of the law and that of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, 2.9.4</cite></span></figcaption>

</figure><figure class="quote" id="q-5af89096df" data-kw="">
<blockquote><p>10 Q. What is the difference between the law and the gospel? A. The law is a doctrine that God has implanted in human nature and has repeated and renewed in His commandments. In it He holds before us, as if in a manuscript, what it is we are and are not to do, namely, obey Him perfectly both inwardly and outwardly. He also promises eternal life on the condition that I keep the law perfectly my whole life long. On the other hand, He threatens eternal damnation if I do not keep every provision of the law my whole life long but violate it in one or more of its parts. As God says in Deuteronomy 27[:26] and Galatians 3[:10], “Cursed is everyone who does not continue in all things which are written in the book of the law, to do them.” And once the law has been violated, it has no promise that by the help of the law, that is, by works of the law, our sins might be forgiven. Rather, the sentence of condemnation is imposed upon us. The gospel or good news, however, is a doctrine of which even the wisest knew nothing by nature but which is revealed from heaven. In it God does not demand but rather offers and gives us the righteousness that the law requires. This righteousness is the perfect obedience of the suffering and death of Jesus Christ, through which all sin and damnation, made manifest by the law, is pardoned and washed away (Rom. 5; Gal. 3). Furthermore, God does not give us forgiveness of sins in the gospel on the condition that we keep the law. Rather, even though we never have kept it nor will ever be able to keep it perfectly, He still has forgiven our sins and given us eternal life as an unmerited gift through faith in Jesus Christ. John 1[:17] says, “The law was given through Moses, but grace and truth come through Jesus Christ.” And Romans 8[:3, 4]: “What for the law was impossible in that it was weak through the flesh, God did by sending His Son in the likeness of sinful flesh, and condemned sin the flesh through sin, that the righteousness required by the law might be fulfilled in us, who do not walk according to the flesh but according to the Spirit.” Finally, Galatians 3:[12–14]: “The law is not of faith but ‘The man who does it shall live by it.’ Christ, however, redeemed us from the curse of the law when He became a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’), that the blessing of Abraham might come upon the Gentiles in Christ Jesus and we thus might receive the promised Spirit through faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation: An Aid to Interpreting the Heidelberg Catechism, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 9–10.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>A godly person observed that Christians are usually to blame for three things: 1) they seek in themselves what they can only find in Christ; 2) they seek in the law what will only be found in the gospel; and 3) they seek on earth what will only be enjoyed in heaven.</p></blockquote>

</figure><figure class="quote" id="q-29c6666851" data-kw="">
<blockquote><p>IV. This double covenant is proposed to us in Scripture: of nature and of grace; of works and of faith; legal and evangelical. The foundation of this distinction rests both on the different relation (σχέσει) of God contracting (who can be considered now as Creator and Lord, then as Redeemer and Father) and on the diverse condition of man (who may be viewed either as a perfect or as a fallen creature); also on the diverse mode of obtaining life and happiness (either by proper obedience or by another’s imputed); finally on the diverse duties prescribed to man (to wit, works or faith). For in the former, God as Creator demands perfect obedience from innocent man with the promise of life and eternal happiness; but in the latter, God as Father promises salvation in Christ to the fallen man under the condition of faith. The former rests upon the work of man; the latter upon the grace of God alone. The former upon a just Creator; the latter upon a merciful Redeemer. The former was made with innocent man without a mediator; the latter was made with fallen man by the intervention of a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.4 (p. 575, modified according to the 1679 edition).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>The law is the Word in which God teaches and tells us what we are to do and not to do, as in the Ten commandments. …The other word of God is not Law or commandment, nor does it require anything of us; but after the first Word, that of the Law, has done this work and distressful misery and poverty have been produced in the heart, God comes and offers his lovely, living Word, and promises, pledges, and obligates himself to give grace and help, that we may get out of this misery and that all sins not only be forgiven but also blotted out and that love and delight to fulfill the law may be given besides. See, this divine promise of his grace and of the forgiveness of his is properly called Gospel. And I say again and yet again that you should never understand Gospel to mean anything but the divine promise of his grace and of the forgiveness of sin. For this is why hitherto St. Paul’s epistles were not understood and cannot be understood by our adversaries even now; they do not know what Law and Gospel really are. For they consider Christ a Legislator and the Gospel nothing but the teaching of new laws. This is nothing else but locking up the gospel and obscuring everything. For “Gospel” is Greek and means “good news,” because in it is proclaimed the saving doctrine of life, of the divine promise, and grace and the forgiveness of sins are offered. Therefore works do not belong to the gospel; for it is not laws but faith alone, because it is nothing whatever but the promise and offer of divine grace. He, then, who believes the Gospel receives grace and the Holy Spirit. Thereby the heart becomes glad and joyful in God and then keeps the Law gladly and freely, without the fear of punishment and without the expectation of reward; for it is sated and satisfied with that grace of God by which the law has been satisfied.</p></blockquote>

<blockquote><p>Although the Church existed from the beginning, it was, before the calling of Abraham, for the most part in a state of dispersion. Too little is recorded of it, prior to that event, to give us definite knowledge of its nature and requirements. Our written constitution, so to speak, dates from the father of the faithful. God made a covenant with Abraham. By covenant is meant, a contract between two or more parties, in which there are mutual stipulations and promises. The transaction with Abraham was of this kind. God promised certain blessings to the patriarch, and he promised faith and obedience to God. Not only, therefore, in the Old Testament is this transaction called a covenant, but in the New Testament the same designation is applied to it. And, further than this, the New Testament writers, referring to the transaction with Abraham, not only call it a covenant, but they argue from its nature as such, to show that its original stipulations can be neither annulled nor altered. Rom. 4:13, 14; Gal. 3:15–18. “The covenant,” says the apostle, “that was confirmed before (to Abraham) of God in Christ, the law, which was four hundred and thirty years after, cannot disannul.” It is of importance, therefore, that this word should be retained, not only because it is scriptural, but because the idea which it expresses is essential to a proper understanding of the case. Many modern theological writers discard the word entirely, and stigmatize the system of the Reformers as the federal theology. In discarding the word, the truth which it was intended to convey is almost always discarded with it. If we would retain the truth, we must retain the forms in which God has seen fit to reveal it. God then formed a covenant with Abraham. The question is, What was that covenant, and who were the parties to it? We answer, in common with all Christendom, The covenant was the covenant of grace, and the parties were Abraham and those whom Abraham represented. Of course this does not mean that the covenant of grace originated in this transaction, or that none are included in it but Abraham and those whom Abraham represented. Nor does it mean that all represented by Abraham were savingly interested in its benefits. It only means that the covenant in question was a reënactment or renewed revelation of the covenant of grace in relation to Abraham, and that those represented by him were to be regarded and treated as included in it. By the covenant of grace is meant the plan of salvation, in which God promises to give to believers all the benefits of redemption, and they promise faith and obedience. If, therefore, in the covenant with Abraham, God promised to him the benefits of redemption on the condition of faith, that covenant was the covenant of grace. In other words, it was the gospel; for the gospel is nothing else than the proclamation of salvation through faith in Christ. That such was the nature of the covenant made with Abraham, is too clearly revealed to admit of doubt. When God promised that in his seed all the nations of the earth should be blessed, he promised to send Christ to be the Redeemer of men. It is the fulfilment of this promise and the exposition of it in the New Testament, which authoritatively determines its meaning. Our Lord himself said, “Abraham saw my day and was glad.” This can only mean that Abraham foresaw the advent of Christ, and rejoiced in the accomplishment of the work which Christ came to perform. The apostle therefore says, “God preached before the gospel unto Abraham.” The gospel, in the New Testament sense of the term, is the glad news of salvation through Jesus Christ. This therefore was, according to the apostle, what was preached to Abraham, when it was said, “In thee shall all nations be blessed.” The apostle Peter also, after he had healed the lame man, told the astonished multitude that Christ, in whose name the miracle had been performed, had been promised to Abraham, and predicted by the prophets. “Ye,” he added, “are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed. Unto you first, God having raised up his Son Jesus, sent him to bless you, in turning away every one of you from his iniquities.” Acts 3:25, 26. It is here clearly taught that the Abrahamic covenant, of which the Jews were the children, had reference to Christ; that the promise, “In thy seed shall all the kindreds of the earth be blessed,” was fulfilled in the advent of the Son of God; and that the blessedness promised, was turning men from their iniquities. To the same effect Paul said in the synagogue at Antioch, in Pisidia, “We declare unto you glad tidings, how that the promise made unto the fathers, God hath fulfilled the same unto us their children, in that he hath raised up Jesus.” Acts 13:32, 33. When arraigned before Agrippa he said, “Now I stand and am judged for the hope of the promise made unto our fathers: unto which promise the twelve tribes, instantly serving God day and night, hope to come: for which hope’s sake, king Agrippa, I am accused of the Jews.” Acts 26:6, 7. The great promise made to Abraham and to the other fathers, according to this passage, was the promise of Christ, on whose behalf Paul was a prisoner; and this was the promise toward which the eyes of all who served God were constantly fixed. Paul said to the Romans, “Jesus Christ was a minister of the circumcision, for the truth of God, to confirm the promises made unto the fathers.” Rom. 15:9. That is, Jesus Christ came and exercised his ministry among the Jews, to set forth the truth or veracity of God, in fulfilling the promises made to the fathers. In all these passages, “the promises made to the fathers,” means the promise of Christ thrice made to Abraham, Gen. 12:3, 18:18, 22:18, repeated to Isaac and Jacob, Gen. 26:4, 28:14, and which thenceforth became the burden of prophecy, renewed to every generation, constantly unfolded in its inexhaustible contents until the fulfilment came. Nothing, therefore, can be plainer than that the covenant made with Abraham was the covenant of grace, i.e. the promise of redemption through faith in the Messiah. This, however, is not a doctrine which rests on such general allusions or declarations merely, it is taught in the most explicit terms by the apostles. The design of the epistle to the Galatians was to convince them of the folly of apostatizing to Judaism. To do this the apostle raises them above the Mosaic period, and sets them back into communion with the great Abrahamic covenant, to which the law of Moses was not only posterior but subordinate. The special purpose of the third chapter of that epistle is to prove that justification is by faith, and not by the law. His first argument is from the fact that the Holy Ghost, in his manifold miraculous and sanctifying influences, had been given in confirmation of the doctrine of justification by faith. His second argument is from the case of Abraham. He was justified by faith, and therefore those who share his inheritance, i.e. who inherit the blessing of redemption promised him, are believers. Know therefore, he says, that believers are the sons (i.e. heirs) of Abraham. The third argument is from the impossibility of rendering the perfect obedience which the law demands. The fourth, from the explicit declaration of the Scriptures, that those who are just by faith shall live. The fifth, from the fact that Christ has redeemed us from the curse of the law in order that the blessing of Abraham, (i.e. the blessing promised to Abraham,) might come upon the gentiles. The only blessing, however, promised to Abraham, which comes upon the gentiles, is redemption. And finally, Paul argues from the nature of the covenant made with Abraham. He reminds his readers that even a human covenant cannot, when once ratified, be either annulled or altered, much less can a divine covenant be changed, either in its promises or conditions. In the covenant with Abraham in reference to Christ, the inheritance, (that inheritance in which the gentiles share,) was suspended upon faith in the promise. The law, therefore, which was long subsequent, could not alter this covenant, or make the inheritance to depend upon works. Here everything is taught, first, the Abrahamic covenant had reference to Christ; second, the thing promised was that inheritance of which Christ is the author, and all nations (not the Jews only) the heirs; third, the condition on which a participation in this inheritance is suspended, is faith and not works.</p></blockquote>

of+the+work+which+Christ+came+to+perform.+The+apostle+therefore+says%2C+%E2%80%9CGod+preached+before+the+gospel+unto+Abraham.%E2%80%9D+The+gospel%2C+in+the+New+Testament+sense+of+the+term%2C+is+the+glad+news+of+salvation+through+Jesus+Christ.+This+therefore+was%2C+according+to+the+apostle%2C+what+was+preached+to+Abraham%2C+when+it+was+said%2C+%E2%80%9CIn+thee+shall+all+nations+be+blessed.%E2%80%9D+The+apostle+Peter+also%2C+after+he+had+healed+the+lame+man%2C+told+the+astonished+multitude+that+Christ%2C+in+whose+name+the+miracle+had+been+performed%2C+had+been+promised+to+Abraham%2C+and+predicted+by+the+prophets.+%E2%80%9CYe%2C%E2%80%9D+he+added%2C+%E2%80%9Care+the+children+of+the+prophets%2C+and+of+the+covenant+which+God+made+with+our+fathers%2C+saying+unto+Abraham%2C+And+in+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed.+Unto+you+first%2C+God+having+raised+up+his+Son+Jesus%2C+sent+him+to+bless+you%2C+in+turning+away+every+one+of+you+from+his+iniquities.%E2%80%9D+Acts+3%3A25%2C+26.+It+is+here+clearly+taught+that+the+Abrahamic+covenant%2C+of+which+the+Jews+were+the+children%2C+had+reference+to+Christ%3B+that+the+promise%2C+%E2%80%9CIn+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed%2C%E2%80%9D+was+fulfilled+in+the+advent+of+the+Son+of+God%3B+and+that+the+blessedness+promised%2C+was+turning+men+from+their+iniquities.+To+the+same+effect+Paul+said+in+the+synagogue+at+Antioch%2C+in+Pisidia%2C+%E2%80%9CWe+declare+unto+you+glad+tidings%2C+how+that+the+promise+made+unto+the+fathers%2C+God+hath+fulfilled+the+same+unto+us+their+children%2C+in+that+he+hath+raised+up+Jesus.%E2%80%9D+Acts+13%3A32%2C+33.+When+arraigned+before+Agrippa+he+said%2C+%E2%80%9CNow+I+stand+and+am+judged+for+the+hope+of+the+promise+made+unto+our+fathers%3A+unto+which+promise+the+twelve+tribes%2C+instantly+serving+God+day+and+night%2C+hope+to+come%3A+for+which+hope%E2%80%99s+sake%2C+king+Agrippa%2C+I+am+accused+of+the+Jews.%E2%80%9D+Acts+26%3A6%2C+7.+The+great+promise+made+to+Abraham+and+to+the+other+fathers%2C+according+to+this+passage%2C+was+the+promise+of+Christ%2C+on+whose+behalf+Paul+was+a+prisoner%3B+and+this+was+the+promise+toward+which+the+eyes+of+all+who+served+God+were+constantly+fixed.+Paul+said+to+the+Romans%2C+%E2%80%9CJesus+Christ+was+a+minister+of+the+circumcision%2C+for+the+truth+of+God%2C+to+confirm+the+promises+made+unto+the+fathers.%E2%80%9D+Rom.+15%3A9.+That+is%2C+Jesus+Christ+came+and+exercised+his+ministry+among+the+Jews%2C+to+set+forth+the+truth+or+veracity+of+God%2C+in+fulfilling+the+promises+made+to+the+fathers.+In+all+these+passages%2C+%E2%80%9Cthe+promises+made+to+the+fathers%2C%E2%80%9D+means+the+promise+of+Christ+thrice+made+to+Abraham%2C+Gen.+12%3A3%2C+18%3A18%2C+22%3A18%2C+repeated+to+Isaac+and+Jacob%2C+Gen.+26%3A4%2C+28%3A14%2C+and+which+thenceforth+became+the+burden+of+prophecy%2C+renewed+to+every+generation%2C+constantly+unfolded+in+its+inexhaustible+contents+until+the+fulfilment+came.+Nothing%2C+therefore%2C+can+be+plainer+than+that+the+covenant+made+with+Abraham+was+the+covenant+of+grace%2C+i.e.+the+promise+of+redemption+through+faith+in+the+Messiah.+This%2C+however%2C+is+not+a+doctrine+which+rests+on+such+general+allusions+or+declarations+merely%2C+it+is+taught+in+the+most+explicit+terms+by+the+apostles.+The+design+of+the+epistle+to+the+Galatians+was+to+convince+them+of+the+folly+of+apostatizing+to+Judaism.+To+do+this+the+apostle+raises+them+above+the+Mosaic+period%2C+and+sets+them+back+into+communion+with+the+great+Abrahamic+covenant%2C+to+which+the+law+of+Moses+was+not+only+posterior+but+subordinate.+The+special+purpose+of+the+third+chapter+of+that+epistle+is+to+prove+that+justification+is+by+faith%2C+and+not+by+the+law.+His+first+argument+is+from+the+fact+that+the+Holy+Ghost%2C+in+his+manifold+miraculous+and+sanctifying+influences%2C+had+been+given+in+confirmation+of+the+doctrine+of+justification+by+faith.+His+second+argument+is+from+the+case+of+Abraham.+He+was+justified+by+faith%2C+and+therefore+those+who+share+his+inheritance%2C+i.e.+who+inherit+the+blessing+of+redemption+promised+him%2C+are+believers.+Know+therefore%2C+he+says%2C+that+believers+are+the+sons+%28i.e.+heirs%29+of+Abraham.+The+third+argument+is+from+the+impossibility+of+rendering+the+perfect+obedience+which+the+law+demands.+The+fourth%2C+from+the+explicit+declaration+of+the+Scriptures%2C+that+those+who+are+just+by+faith+shall+live.+The+fifth%2C+from+the+fact+that+Christ+has+redeemed+us+from+the+curse+of+the+law+in+order+that+the+blessing+of+Abraham%2C+%28i.e.+the+blessing+promised+to+Abraham%2C%29+might+come+upon+the+gentiles.+The+only+blessing%2C+however%2C+promised+to+Abraham%2C+which+comes+upon+the+gentiles%2C+is+redemption.+And+finally%2C+Paul+argues+from+the+nature+of+the+covenant+made+with+Abraham.+He+reminds+his+readers+that+even+a+human+covenant+cannot%2C+when+once+ratified%2C+be+either+annulled+or+altered%2C+much+less+can+a+divine+covenant+be+changed%2C+either+in+its+promises+or+conditions.+In+the+covenant+with+Abraham+in+reference+to+Christ%2C+the+inheritance%2C+%28that+inheritance+in+which+the+gentiles+share%2C%29+was+suspended+upon+faith+in+the+promise.+The+law%2C+therefore%2C+which+was+long+subsequent%2C+could+not+alter+this+covenant%2C+or+make+the+inheritance+to+depend+upon+works.+Here+everything+is+taught%2C+first%2C+the+Abrahamic+covenant+had+reference+to+Christ%3B+second%2C+the+thing+promised+was+that+inheritance+of+which+Christ+is+the+author%2C+and+all+nations+%28not+the+Jews+only%29+the+heirs%3B+third%2C+the+condition+on+which+a+participation+in+this+inheritance+is+suspended%2C+is+faith+and+not+works.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+%E2%80%9CReview+of+The+Tecnobaptist%3A+A+Discourse%2C+Wherein+an+Honest+Baptist%2C+by+a+Course+of+Argument+to+Which+No+Honest+Baptist+Can+Object%2C+Is+Convinced+That+Infant+Christians+Are+Proper+Subjects+Of+Baptism+by+R.+B.+Mayes%2C%E2%80%9D+in+The+Book+Reviews+of+Charles+Hodge+%28repr.+Bellingham%2C+WA%3A+Logos+Bible+Software%2C+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F62298a5a2e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62298a5a2e.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/10/hodge-abraham-was-in-a-spiritual-gracious-covenant/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

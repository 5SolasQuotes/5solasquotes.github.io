<blockquote><p>The violated covenant of works, as I observed above, was not, and could not be, made or renewed with the Israelites at Sinai: for it was a broken covenant, and besides, it was a covenant between God and man as friends, whereas now, man is become the enemy of God. But though it was not renewed with them, yet it was, on that solemn occasion, repeated and displayed to them. It was not proposed to them, in order that they might consent, by their own works, to fulfil the condition of it; but it was displayed before them, in subservience to the covenant of grace, that they might see how impossible it was for them as condemned sinners, to perform that perfect obedience, which is the immutable condition of life in it. Although the Lord knew well, that they were far from being able to yield perfect obedience; yet he saw proper, to set forth eternal life to them upon these terms; and so, to speak to them, in a strain adapted to their self-righteous temper. For, previous to the giving of the law to them at Sinai, they were so ignorant of the perfection, and vast extent of that holy law, as well as of their own utter inability, to perform the smallest acceptable obedience to it; and at the same time, they were so full of self-confidence, as to say to Moses, “All that the Lord hath spoken, we will do.” God, therefore, displayed on mount Sinai, the law of the ten commandments as a covenant of works, in subservience to the covenant of grace. He displayed it in that form, in order that the people might, by contemplating it, see what kind and degree of righteousness it required, as the condition of eternal life; and that by means of it, finding themselves utterly destitute of perfect righteousness, they might be impelled to take hold of the covenant of grace, in which, the perfect righteousness of the second Adam, is provided and exhibited, for the justification of all who believe. Now, that the law of the ten commandments as a covenant of works, was repeated and displayed on mount Sinai, in subservience to the covenant of grace, appears evident, 1. From the thunderings and lightnings, the noise of the trumpet, and the mountain smoking, the thick darkness, and the voice of the living God, speaking out of the midst of the fire, on that awful occasional. These terrible emblems, signified the vindictive and tremendous wrath of God, which is due to all the race of Adam, for their breach of the covenant of works, by transgressing the law of that covenant. They represented also the extreme danger, to which, every sinner who continues under the law in its covenant form, is exposed; as being liable, every moment, to the eternal execution of its dreadful curse. This awful display of the law as a covenant of works, though it was not the principal, yet was the most conspicuous part of the Sinai transaction: for “the people saw the thunderings and the lightnings, and the noise of the trumpet, and the mountain smoking.” “And so terrible was the sight, that Moses said, I exceedingly fear and quake.” Now, the covenant of works was displayed, in this tremendous form, before the Israelites; in order that self-righteous and secure sinners among them, might be alarmed, and deterred from expecting justification in the sight of God, by the works of the law; and that, convinced of their sinfulness and misery, they might be persuaded, to flee speedily to the blessed Mediator, and to trust in Him for righteousness and salvation. That terrible display, accordingly, contributed in some measure, to humble them, to lessen that self-confidence which they had formerly discovered, and to show them their need of the Divine Redeemer, and of union with him by faith, in order to their being qualified for performing acceptable obedience. This appears from their own words to Moses, after the dreadful sight which they beheld: “Speak thou unto us,” said they, “all that the Lord our God shall speak unto thee, and we will hear and do.” Standing afar off, they do not say, as they did, before the publication of the law at Sinai, “All that the Lord hath spoken, we will do;” but,—” We will hear and do:” “We will first hear or believe, and then do.” For speaking in this strain, the Lord commended them thus: “They have well said all that they have spoken. O that there were such an heart in them!” They said well, in that they made hearing or believing, the principle of acceptable obedience. The law then, as it is the covenant of works, entered at Sinai, “that the offence might abound,” not in the life by the commission of it, but in the conscience by conviction: it entered, that it might be their “school-master to bring them unto Christ, that they might be justified by faith.” 2. That the law as a covenant of works, was displayed on mount Sinai, appears also from this: That the ten commandments, written on tables of stone, and so given to Moses on Sinai, are, by the apostle Paul, styled, “the ministration of death, written and engraven in stones.” Now it is manifest, that these commandments are no otherwise the ministration of death, than as they are in the form of the covenant of works. In this form, they were delivered to Moses, to be deposited in the ark; in order to prefigure, the fulfilling of them by Messiah, “the Surety of a better covenant,” and the concealing of that form, or the removal of it from them, to all who should believe in Him. 3. The moral law, as it was delivered from mount Sinai, is, in Scripture, expressly styled a covenant. These are the two covenants; the one from the mount Sinai. The law, in that promulgation of it, was such a covenant, as had the appearance through misapprehension of its design, of disannulling the covenant of grace, made with Abraham. “The covenant,” says the apostle Paul, “that was confirmed before of God in Christ, the law, which was four hundred and thirty years after, cannot disannul, that it should make the promise of none effect.” The law, included a way of obtaining a title to the heavenly inheritance, typified by that of Canaan, so very different from that of the promise made to Abraham, as to be incompatible with it. “For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.” The covenant of the law from mount Sinai, then, was the covenant of works; which contains a method of obtaining the inheritance, inconsistent with that of the promise; but which cannot disannul the promise, or covenant of grace. Besides, Moses, speaking of that law under the denomination of a covenant, affirms that, it was not made with the Patriarchs, or displayed publicly before them. “The Lord our God, says he, made a covenant with us in Horeb: the Lord made not this covenant, with our fathers, but with us.” This covenant displayed on Sinai, then, was not the covenant of promise, made with the fathers of the Israelitish people. 4. The covenant of works is, in the New Testament, introduced, and illustrated from the law as given by Moses. Our blessed Lord, in replying to one who asked him, What good thing he should do, that he might have eternal life, said, “If thou wilt enter into life, keep the commandments; namely, Thou shalt do no murder, Thou shalt not commit adultery, Thou shalt not steal, Thou shalt not bear false witness, Honour thy father and thy mother, &amp;c.” These being some of the commandments, promulgated from mount Sinai, our Lord repeats them to him, in the form of the covenant of works. And the apostle Paul, when mentioning the promise of the covenant of works, says, “Moses describeth the righteousness which is of the law, That the man which doeth those things, shall live by them.” In expressing also the penal sanction of that covenant, he says, “As many as are of the works of the law, are under the curse: for it is written, Cursed is every one that continueth not in all things, which are written in the book of the law, to do them.” That a conditional promise, then, and a dreadful curse, as well as the ten commandments, were published to the Israelites, is plain; and it is no less evident, that, according to our Apostle in the passages cited above, they are the form of the covenant of works. 5. That the law in the form of a covenant of works, was displayed on mount Sinai, appears likewise, from the opposition between the law and grace, often mentioned and inculcated in the New Testament. We there read that, “The law was given by Moses, but grace and truth came by Jesus Christ;” and that, “The law is not of faith; but, The man that doeth them shall live in them.” But it is, in its covenant form only, that the law in Scripture, is contrasted with grace. 6. In the Sinaitic transaction, the hewing of the latter tables of stone by Moses, before God wrote the ten commandments on them, might be intended to teach sinners, that they must be convinced of their sin and misery, by the law as a covenant of works, before it can be written legibly on their hearts, as a rule of life. 7. Lastly, The same also appears, from these words of the apostle Paul, cited above, “These are the two covenants; the one from the mount Sinai, which gendereth to bondage.” The covenant which gendereth to bondage, is, the covenant of works made with Adam, as the head and representative of all its natural posterity, and displayed on mount Sinai to the Israelites. This covenant gendereth to bondage; for, according to the Apostle, the children of it, or they who are under it, are excluded from the heavenly inheritance, as Ishmael was, from Canaan the typical and earthly inheritance. “Cast out the bond-woman and her son: for the son of the bondwoman, shall not be heir with the son of the free woman.” The generating of bond-children, excluded from the heavenly inheritance, is a distinguishing property of the covenant of works; and it cannot be a property of the covenant of grace, under any of its dispensations. It is the covenant of works only, that has a tendency, to beget a servile and slavish frame of spirit. It is evident, then, that the covenant of works was displayed on mount Sinai. It was there displayed, together with the covenant of grace, in order to subserve the latter; and particularly, to represent to the Israelitish church, that the discharging of the principal and penalty of the covenant of works, was to be required of Messiah, the Surety of elect sinners, as the proper condition of the covenant of grace. Although the Sinaitic transaction, was a mixed dispensation; yet the covenant of grace and the covenant of works, were not blended together in it. The latter as well as the ceremonial law, was added to the former; and was added to it, in order that, the Israelites might be so convinced of their sinfulness and misery, as to see their extreme need of embracing the promise, or covenant of grace. God, says the apostle Paul, “gave the inheritance to Abraham by promise. Wherefore then serveth the law? It was added because of transgressions, till the seed should come to whom the promise was made.” The promise, made to Abraham and to his seed, we have found in the preface to the ten commandments. To this promise or covenant of grace, then, was the law or subservient covenant of works, added. It formed no part of the covenant of grace, which had been a covenant entire to the Patriarchs, before that was added to it at Sinai; and it is a covenant entire to believers under the gospel, after that is removed from it: for our Apostle says, “It was added till the seed should come.” Accordingly, the ten commandments as promulgated from mount Sinai, must be considered at least, in a two-fold point of view: namely, as the law of Christ, or the law as a rule of life to believers, and, as the law as it is the matter of a covenant of works, to unregenerate sinners. This I humbly apprehend, is intimated to us, by their having been twice written on tables of stone, by God himself, and, by the double accentuation of them, in the sacred Original. In the Sinai transaction, then, the promise or covenant of grace, was published to the Israelites, and the law or covenant of works also, as subservient to it. The former was and still is, a covenant to be believed or embraced by faith; the latter, a covenant to be done or fulfilled. The apostle Paul, accordingly, contrasts the one with the other, thus; “The law is not of faith: but the man that doeth them, shall live in them.” The-covenant to be embraced by faith, was given to the fathers of the Israelites, as well as to themselves; but concerning the covenant to be done, Moses said to them, “The Lord made not this covenant with our fathers, but with us.” And again, “The Lord spake unto you out of the midst of the fire;—and he declared unto you his covenant, which he commanded you to perform, even ten commandments.” Although the same covenant of works, that was made with Adam, was displayed from mount Sinai; yet it was, for a very different purpose. God’s design, in making this covenant with Adam, was, to have that righteousness which was due to him, from man: but his great design, in displaying it to Israel at Sinai, was, that they, by contemplating it, might see what kind and degree of righteousness, it was, by which they could be justified before God; and that, finding themselves wholly destitute of that righteousness, they might be excited to take hold of the covenant of grace, in which, a perfect righteousness for justification, is graciously provided. Should the attentive reader now ask, Seeing the covenant of grace, and also that of works, were both repeated from mount Sinai, were not the Israelites under both these covenants, at one and the same time? I would answer; They could not be under both, at the same time, and in the same respects. The believers among them, as I hinted above, were internally and really, under the covenant of grace, and only externally, under that terrible display of the covenant of works, as it was subservient to that of grace; whereas, the unbelievers, were externally and by profession only, under that dispensation of the covenant of grace, but were internally and really, under the covenant of works.</p></blockquote>

ghteousness%2C+they+might+be+impelled+to+take+hold+of+the+covenant+of+grace%2C+in+which%2C+the+perfect+righteousness+of+the+second+Adam%2C+is+provided+and+exhibited%2C+for+the+justification+of+all+who+believe.+Now%2C+that+the+law+of+the+ten+commandments+as+a+covenant+of+works%2C+was+repeated+and+displayed+on+mount+Sinai%2C+in+subservience+to+the+covenant+of+grace%2C+appears+evident%2C+1.+From+the+thunderings+and+lightnings%2C+the+noise+of+the+trumpet%2C+and+the+mountain+smoking%2C+the+thick+darkness%2C+and+the+voice+of+the+living+God%2C+speaking+out+of+the+midst+of+the+fire%2C+on+that+awful+occasional.+These+terrible+emblems%2C+signified+the+vindictive+and+tremendous+wrath+of+God%2C+which+is+due+to+all+the+race+of+Adam%2C+for+their+breach+of+the+covenant+of+works%2C+by+transgressing+the+law+of+that+covenant.+They+represented+also+the+extreme+danger%2C+to+which%2C+every+sinner+who+continues+under+the+law+in+its+covenant+form%2C+is+exposed%3B+as+being+liable%2C+every+moment%2C+to+the+eternal+execution+of+its+dreadful+curse.+This+awful+display+of+the+law+as+a+covenant+of+works%2C+though+it+was+not+the+principal%2C+yet+was+the+most+conspicuous+part+of+the+Sinai+transaction%3A+for+%E2%80%9Cthe+people+saw+the+thunderings+and+the+lightnings%2C+and+the+noise+of+the+trumpet%2C+and+the+mountain+smoking.%E2%80%9D+%E2%80%9CAnd+so+terrible+was+the+sight%2C+that+Moses+said%2C+I+exceedingly+fear+and+quake.%E2%80%9D+Now%2C+the+covenant+of+works+was+displayed%2C+in+this+tremendous+form%2C+before+the+Israelites%3B+in+order+that+self-righteous+and+secure+sinners+among+them%2C+might+be+alarmed%2C+and+deterred+from+expecting+justification+in+the+sight+of+God%2C+by+the+works+of+the+law%3B+and+that%2C+convinced+of+their+sinfulness+and+misery%2C+they+might+be+persuaded%2C+to+flee+speedily+to+the+blessed+Mediator%2C+and+to+trust+in+Him+for+righteousness+and+salvation.+That+terrible+display%2C+accordingly%2C+contributed+in+some+measure%2C+to+humble+them%2C+to+lessen+that+self-confidence+which+they+had+formerly+discovered%2C+and+to+show+them+their+need+of+the+Divine+Redeemer%2C+and+of+union+with+him+by+faith%2C+in+order+to+their+being+qualified+for+performing+acceptable+obedience.+This+appears+from+their+own+words+to+Moses%2C+after+the+dreadful+sight+which+they+beheld%3A+%E2%80%9CSpeak+thou+unto+us%2C%E2%80%9D+said+they%2C+%E2%80%9Call+that+the+Lord+our+God+shall+speak+unto+thee%2C+and+we+will+hear+and+do.%E2%80%9D+Standing+afar+off%2C+they+do+not+say%2C+as+they+did%2C+before+the+publication+of+the+law+at+Sinai%2C+%E2%80%9CAll+that+the+Lord+hath+spoken%2C+we+will+do%3B%E2%80%9D+but%2C%E2%80%94%E2%80%9D+We+will+hear+and+do%3A%E2%80%9D+%E2%80%9CWe+will+first+hear+or+believe%2C+and+then+do.%E2%80%9D+For+speaking+in+this+strain%2C+the+Lord+commended+them+thus%3A+%E2%80%9CThey+have+well+said+all+that+they+have+spoken.+O+that+there+were+such+an+heart+in+them%21%E2%80%9D+They+said+well%2C+in+that+they+made+hearing+or+believing%2C+the+principle+of+acceptable+obedience.+The+law+then%2C+as+it+is+the+covenant+of+works%2C+entered+at+Sinai%2C+%E2%80%9Cthat+the+offence+might+abound%2C%E2%80%9D+not+in+the+life+by+the+commission+of+it%2C+but+in+the+conscience+by+conviction%3A+it+entered%2C+that+it+might+be+their+%E2%80%9Cschool-master+to+bring+them+unto+Christ%2C+that+they+might+be+justified+by+faith.%E2%80%9D+2.+That+the+law+as+a+covenant+of+works%2C+was+displayed+on+mount+Sinai%2C+appears+also+from+this%3A+That+the+ten+commandments%2C+written+on+tables+of+stone%2C+and+so+given+to+Moses+on+Sinai%2C+are%2C+by+the+apostle+Paul%2C+styled%2C+%E2%80%9Cthe+ministration+of+death%2C+written+and+engraven+in+stones.%E2%80%9D+Now+it+is+manifest%2C+that+these+commandments+are+no+otherwise+the+ministration+of+death%2C+than+as+they+are+in+the+form+of+the+covenant+of+works.+In+this+form%2C+they+were+delivered+to+Moses%2C+to+be+deposited+in+the+ark%3B+in+order+to+prefigure%2C+the+fulfilling+of+them+by+Messiah%2C+%E2%80%9Cthe+Surety+of+a+better+covenant%2C%E2%80%9D+and+the+concealing+of+that+form%2C+or+the+removal+of+it+from+them%2C+to+all+who+should+believe+in+Him.+3.+The+moral+law%2C+as+it+was+delivered+from+mount+Sinai%2C+is%2C+in+Scripture%2C+expressly+styled+a+covenant.+These+are+the+two+covenants%3B+the+one+from+the+mount+Sinai.+The+law%2C+in+that+promulgation+of+it%2C+was+such+a+covenant%2C+as+had+the+appearance+through+misapprehension+of+its+design%2C+of+disannulling+the+covenant+of+grace%2C+made+with+Abraham.+%E2%80%9CThe+covenant%2C%E2%80%9D+says+the+apostle+Paul%2C+%E2%80%9Cthat+was+confirmed+before+of+God+in+Christ%2C+the+law%2C+which+was+four+hundred+and+thirty+years+after%2C+cannot+disannul%2C+that+it+should+make+the+promise+of+none+effect.%E2%80%9D+The+law%2C+included+a+way+of+obtaining+a+title+to+the+heavenly+inheritance%2C+typified+by+that+of+Canaan%2C+so+very+different+from+that+of+the+promise+made+to+Abraham%2C+as+to+be+incompatible+with+it.+%E2%80%9CFor+if+the+inheritance+be+of+the+law%2C+it+is+no+more+of+promise%3A+but+God+gave+it+to+Abraham+by+promise.%E2%80%9D+The+covenant+of+the+law+from+mount+Sinai%2C+then%2C+was+the+covenant+of+works%3B+which+contains+a+method+of+obtaining+the+inheritance%2C+inconsistent+with+that+of+the+promise%3B+but+which+cannot+disannul+the+promise%2C+or+covenant+of+grace.+Besides%2C+Moses%2C+speaking+of+that+law+under+the+denomination+of+a+covenant%2C+affirms+that%2C+it+was+not+made+with+the+Patriarchs%2C+or+displayed+publicly+before+them.+%E2%80%9CThe+Lord+our+God%2C+says+he%2C+made+a+covenant+with+us+in+Horeb%3A+the+Lord+made+not+this+covenant%2C+with+our+fathers%2C+but+with+us.%E2%80%9D+This+covenant+displayed+on+Sinai%2C+then%2C+was+not+the+covenant+of+promise%2C+made+with+the+fathers+of+the+Israelitish+people.+4.+The+covenant+of+works+is%2C+in+the+New+Testament%2C+introduced%2C+and+illustrated+from+the+law+as+given+by+Moses.+Our+blessed+Lord%2C+in+replying+to+one+who+asked+him%2C+What+good+thing+he+should+do%2C+that+he+might+have+eternal+life%2C+said%2C+%E2%80%9CIf+thou+wilt+enter+into+life%2C+keep+the+commandments%3B+namely%2C+Thou+shalt+do+no+murder%2C+Thou+shalt+not+commit+adultery%2C+Thou+shalt+not+steal%2C+Thou+shalt+not+bear+false+witness%2C+Honour+thy+father+and+thy+mother%2C+%26c.%E2%80%9D+These+being+some+of+the+commandments%2C+promulgated+from+mount+Sinai%2C+our+Lord+repeats+them+to+him%2C+in+the+form+of+the+covenant+of+works.+And+the+apostle+Paul%2C+when+mentioning+the+promise+of+the+covenant+of+works%2C+says%2C+%E2%80%9CMoses+describeth+the+righteousness+which+is+of+the+law%2C+That+the+man+which+doeth+those+things%2C+shall+live+by+them.%E2%80%9D+In+expressing+also+the+penal+sanction+of+that+covenant%2C+he+says%2C+%E2%80%9CAs+many+as+are+of+the+works+of+the+law%2C+are+under+the+curse%3A+for+it+is+written%2C+Cursed+is+every+one+that+continueth+not+in+all+things%2C+which+are+written+in+the+book+of+the+law%2C+to+do+them.%E2%80%9D+That+a+conditional+promise%2C+then%2C+and+a+dreadful+curse%2C+as+well+as+the+ten+commandments%2C+were+published+to+the+Israelites%2C+is+plain%3B+and+it+is+no+less+evident%2C+that%2C+according+to+our+Apostle+in+the+passages+cited+above%2C+they+are+the+form+of+the+covenant+of+works.+5.+That+the+law+in+the+form+of+a+covenant+of+works%2C+was+displayed+on+mount+Sinai%2C+appears+likewise%2C+from+the+opposition+between+the+law+and+grace%2C+often+mentioned+and+inculcated+in+the+New+Testament.+We+there+read+that%2C+%E2%80%9CThe+law+was+given+by+Moses%2C+but+grace+and+truth+came+by+Jesus+Christ%3B%E2%80%9D+and+that%2C+%E2%80%9CThe+law+is+not+of+faith%3B+but%2C+The+man+that+doeth+them+shall+live+in+them.%E2%80%9D+But+it+is%2C+in+its+covenant+form+only%2C+that+the+law+in+Scripture%2C+is+contrasted+with+grace.+6.+In+the+Sinaitic+transaction%2C+the+hewing+of+the+latter+tables+of+stone+by+Moses%2C+before+God+wrote+the+ten+commandments+on+them%2C+might+be+intended+to+teach+sinners%2C+that+they+must+be+convinced+of+their+sin+and+misery%2C+by+the+law+as+a+covenant+of+works%2C+before+it+can+be+written+legibly+on+their+hearts%2C+as+a+rule+of+life.+7.+Lastly%2C+The+same+also+appears%2C+from+these+words+of+the+apostle+Paul%2C+cited+above%2C+%E2%80%9CThese+are+the+two+covenants%3B+the+one+from+the+mount+Sinai%2C+which+gendereth+to+bondage.%E2%80%9D+The+covenant+which+gendereth+to+bondage%2C+is%2C+the+covenant+of+works+made+with+Adam%2C+as+the+head+and+representative+of+all+its+natural+posterity%2C+and+displayed+on+mount+Sinai+to+the+Israelites.+This+covenant+gendereth+to+bondage%3B+for%2C+according+to+the+Apostle%2C+the+children+of+it%2C+or+they+who+are+under+it%2C+are+excluded+from+the+heavenly+inheritance%2C+as+Ishmael+was%2C+from+Canaan+the+typical+and+earthly+inheritance.+%E2%80%9CCast+out+the+bond-woman+and+her+son%3A+for+the+son+of+the+bondwoman%2C+shall+not+be+heir+with+the+son+of+the+free+woman.%E2%80%9D+The+generating+of+bond-children%2C+excluded+from+the+heavenly+inheritance%2C+is+a+distinguishing+property+of+the+covenant+of+works%3B+and+it+cannot+be+a+property+of+the+covenant+of+grace%2C+under+any+of+its+dispensations.+It+is+the+covenant+of+works+only%2C+that+has+a+tendency%2C+to+beget+a+servile+and+slavish+frame+of+spirit.+It+is+evident%2C+then%2C+that+the+covenant+of+works+was+displayed+on+mount+Sinai.+It+was+there+displayed%2C+together+with+the+covenant+of+grace%2C+in+order+to+subserve+the+latter%3B+and+particularly%2C+to+represent+to+the+Israelitish+church%2C+that+the+discharging+of+the+principal+and+penalty+of+the+covenant+of+works%2C+was+to+be+required+of+Messiah%2C+the+Surety+of+elect+sinners%2C+as+the+proper+condition+of+the+covenant+of+grace.+Although+the+Sinaitic+transaction%2C+was+a+mixed+dispensation%3B+yet+the+covenant+of+grace+and+the+covenant+of+works%2C+were+not+blended+together+in+it.+The+latter+as+well+as+the+ceremonial+law%2C+was+added+to+the+former%3B+and+was+added+to+it%2C+in+order+that%2C+the+Israelites+might+be+so+convinced+of+their+sinfulness+and+misery%2C+as+to+see+their+extreme+need+of+embracing+the+promise%2C+or+covenant+of+grace.+God%2C+says+the+apostle+Paul%2C+%E2%80%9Cgave+the+inheritance+to+Abraham+by+promise.+Wherefore+then+serveth+the+law%3F+It+was+added+because+of+transgressions%2C+till+the+seed+should+come+to+whom+the+promise+was+made.%E2%80%9D+The+promise%2C+made+to+Abraham+and+to+his+seed%2C+we+have+found+in+the+preface+to+the+ten+commandments.+To+this+promise+or+covenant+of+grace%2C+then%2C+was+the+law+or+subservient+covenant+of+works%2C+added.+It+formed+no+part+of+the+covenant+of+grace%2C+which+had+been+a+covenant+entire+to+the+Patriarchs%2C+before+that+was+added+to+it+at+Sinai%3B+and+it+is+a+covenant+entire+to+believers+under+the+gospel%2C+after+that+is+removed+from+it%3A+for+our+Apostle+says%2C+%E2%80%9CIt+was+added+till+the+seed+should+come.%E2%80%9D+Accordingly%2C+the+ten+commandments+as+promulgated+from+mount+Sinai%2C+must+be+considered+at+least%2C+in+a+two-fold+point+of+view%3A+namely%2C+as+the+law+of+Christ%2C+or+the+law+as+a+rule+of+life+to+believers%2C+and%2C+as+the+law+as+it+is+the+matter+of+a+covenant+of+works%2C+to+unregenerate+sinners.+This+I+humbly+apprehend%2C+is+intimated+to+us%2C+by+their+having+been+twice+written+on+tables+of+stone%2C+by+God+himself%2C+and%2C+by+the+double+accentuation+of+them%2C+in+the+sacred+Original.+In+the+Sinai+transaction%2C+then%2C+the+promise+or+covenant+of+grace%2C+was+published+to+the+Israelites%2C+and+the+law+or+covenant+of+works+also%2C+as+subservient+to+it.+The+former+was+and+still+is%2C+a+covenant+to+be+believed+or+embraced+by+faith%3B+the+latter%2C+a+covenant+to+be+done+or+fulfilled.+The+apostle+Paul%2C+accordingly%2C+contrasts+the+one+with+the+other%2C+thus%3B+%E2%80%9CThe+law+is+not+of+faith%3A+but+the+man+that+doeth+them%2C+shall+live+in+them.%E2%80%9D+The-covenant+to+be+embraced+by+faith%2C+was+given+to+the+fathers+of+the+Israelites%2C+as+well+as+to+themselves%3B+but+concerning+the+covenant+to+be+done%2C+Moses+said+to+them%2C+%E2%80%9CThe+Lord+made+not+this+covenant+with+our+fathers%2C+but+with+us.%E2%80%9D+And+again%2C+%E2%80%9CThe+Lord+spake+unto+you+out+of+the+midst+of+the+fire%3B%E2%80%94and+he+declared+unto+you+his+covenant%2C+which+he+commanded+you+to+perform%2C+even+ten+commandments.%E2%80%9D+Although+the+same+covenant+of+works%2C+that+was+made+with+Adam%2C+was+displayed+from+mount+Sinai%3B+yet+it+was%2C+for+a+very+different+purpose.+God%E2%80%99s+design%2C+in+making+this+covenant+with+Adam%2C+was%2C+to+have+that+righteousness+which+was+due+to+him%2C+from+man%3A+but+his+great+design%2C+in+displaying+it+to+Israel+at+Sinai%2C+was%2C+that+they%2C+by+contemplating+it%2C+might+see+what+kind+and+degree+of+righteousness%2C+it+was%2C+by+which+they+could+be+justified+before+God%3B+and+that%2C+finding+themselves+wholly+destitute+of+that+righteousness%2C+they+might+be+excited+to+take+hold+of+the+covenant+of+grace%2C+in+which%2C+a+perfect+righteousness+for+justification%2C+is+graciously+provided.+Should+the+attentive+reader+now+ask%2C+Seeing+the+covenant+of+grace%2C+and+also+that+of+works%2C+were+both+repeated+from+mount+Sinai%2C+were+not+the+Israelites+under+both+these+covenants%2C+at+one+and+the+same+time%3F+I+would+answer%3B+They+could+not+be+under+both%2C+at+the+same+time%2C+and+in+the+same+respects.+The+believers+among+them%2C+as+I+hinted+above%2C+were+internally+and+really%2C+under+the+covenant+of+grace%2C+and+only+externally%2C+under+that+terrible+display+of+the+covenant+of+works%2C+as+it+was+subservient+to+that+of+grace%3B+whereas%2C+the+unbelievers%2C+were+externally+and+by+profession+only%2C+under+that+dispensation+of+the+covenant+of+grace%2C+but+were+internally+and+really%2C+under+the+covenant+of+works.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+on+the+Law+and+Gospel+%28Grand+Rapids%3A+Reformation+Heritage+Books%29%2C+55ff+%28HT%3A+Chad+Vegas%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F552d44ae04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/552d44ae04.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/12/colquhoun-on-the-twofold-nature-of-the-mosaic-covenant/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>That which overthrows the main difference, between the Law and Gospel, ought not be admitted; for the confounding of them will open an in-let to innumerable errors; nay by this means the Gospel itself will become a mere cypher. The Apostle [Paul] we see was exceeding[ly] careful to keep these doctrines distinct from each other.1 Endnotes 1. “Amongst such labors and endeavors (Christian reader) I commend to thy consideration, the ensuing Treatise and commit thee to the Lord.” —Westminster, Nov. 7, 1653. John Owen.</p></blockquote>

<blockquote><p>Obj. 9. That is not to be taught in the church which increases sin. The law increases sin. (Rom. 7:8.) Therefore, it is not to be taught. Ans. There is here a fallacy of accident in the minor proposition. The law increases sin by an accident, or on account of the corruption of man, and that in two ways. First, because the nature of man is so depraved and alienated from God, that men do not perform what they know to be pleasing to God; and, on the other hand, what they know to be prohibited by God, that they desire, and do with the greatest willingness. Secondly, because it works wrath, when men fret and murmur against God, hate and turn away from him, and rush into despair according as the law reveals to them a knowledge of their sins, and the punishment which they deserve in consequence thereof. The law in itself produces righteousness, conformity with God, love to God, etc. The law also in itself increases sin, if we understand the word increase in a different sense, viz., that it shows unto us, and brings it to pass that we acknowledge the greatness and magnitude of our sins; but not that it so increases sin as that which in itself is small is made greater and more aggravated. There are, therefore, four terms in this syllogism, in consequence of the ambiguity of the word increase in the minor proposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary of Dr Zacharias Ursinus on the Heidelberg Catechism, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</cite></span></figcaption>

<blockquote><p>Obj. 8. The law is the letter which killeth, and is the ministration of death and condemnation. (2 Cor. 3:6, 7.) But there is no condemnation to Christians. Therefore, the law does not have respect to Christians who are in Christ Jesus. Ans. There is here a fallacy of accident; for the law is not in itself the letter which killeth; since this comes to pass by the fault of men, who, the more clearly they perceive the difference between themselves and the law, the more fully do they give themselves over to despair in reference to their salvation, and are therefore slain by the law. Again, the law alone, without the gospel, is the letter, that is, it is the doctrine which merely teaches, demands obedience, denounces the wrath of God and death to such as are disobedient, without producing the spiritual obedience which it requires. But when it is joined with the gospel, which is the Spirit, it also commences to become the Spirit, which is effectual in the godly, inasmuch as those who are regenerated commence willingly and cheerfully to yield obedience to the law. The law, therefore, is the letter, 1. By itself and without the gospel. 2. In respect to those who are unregenerated. On the other hand, the gospel is the Spirit; that is, it is the ministration and means through which the Holy Ghost, which works spiritual obedience in us, is given; not indeed as though all who hear, would receive the Holy Ghost and be regenerated, but because faith, by which our hearts are quickened, so that they begin to yield obedience to the law, is received by it. It does not follow, therefore, that the law is no longer to be taught in the church; for Christ himself says: “I am not come to destroy the law, but to fulfill it.” (Matt. 5:17.) And Paul also says, that we establish the law through faith. (Rom. 3:31.) Christ fulfilled the law in two respects: by obedience and suffering. He was just and holy in himself and did not violate the law in a single instance, but partly performed in our behalf those things which he was not bound to do, and partly sustained the punishment of the law. He also fulfills the law in us in two ways, by teaching it and granting unto us his Spirit, that so we may commence obedience to it, as we proved when speaking of the abrogation of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary of Dr Zacharias Ursinus on the Heidelberg Catechism, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</cite></span></figcaption>

<blockquote><p>Obj. 4. Christ is not the lawgiver. Therefore his ministers should not teach and enforce the law. Ans. Christ is not the lawgiver, as it respects the principal office of the mediator; but he was and is lawgiver: 1. In as far as he is God and the author of the law, together with the Father. 2. In as far as it belonged to the mediator to free the law from the errors with which it had been corrupted, and to restore its true sense, not indeed chiefly, but that he might be able to accomplish the principal parts of his office, which are comprehended in the reconciliation and salvation of the human race. We may give the same answer to the objection as it relates to the ministers of the gospel, inasmuch as they are to teach and expound no other doctrine to the church than that which Christ himself delivered.</p></blockquote>

<blockquote><p>We divide this Word into two principal parts or kinds: the one is called the ‘Law,’ the other the ‘Gospel.’ For all the rest can be gathered under the one or other of these two headings…Ignorance of this distinction between Law and Gospel is one of the principal sources of the abuses which corrupted and still corrupt Christianity.</p></blockquote>

<blockquote><p>Why is the redemption or reconciliation of humanity with God presented to us in the form of a covenant, indeed a covenant of grace? A: God compares the means of our salvation to a covenant, indeed an eternal covenant, so that we might be certain and assured that a lasting, eternal peace and friendship between God and us has been made through the sacrifice of His son. After a bitter quarrel, the disputants have peace of mind first and foremost when they commit and bind themselves to each other with a promise and sworn oath that on such-and-such a matter they want peace. God acts in the same way toward us: in order that we might have rest and peace in our consciences, God was willing out of His great goodness and grace, to bind himself to us, His enemies, with His promise and His oath. He promised that He would have his only begotten Son become human and die for us, and that through the sacrifice of his Son He would establish a lasting reconciliation and eternal peace….He would be our God and bless us, that is, forgive our sins and impart to us the Holy Spirit and eternal life—and all this without any merit on our part. All we would have to do is accept the Son—promised and sent—by faith.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Why is the redemption or reconciliation of humanity with God presented to us in the form of a covenant, indeed a covenant of grace? A: God compares the means of our salvation to a covenant, indeed an eternal covenant, so that we might be certain and assured that a lasting, eternal peace and friendship between God and us has been made through the sacrifice of His son. After a bitter quarrel, the disputants have peace of mind first and foremost when they commit and bind themselves to each other with a promise and sworn oath that on such-and-such a matter they want peace. God acts in the same way toward us: in order that we might have rest and peace in our consciences, God was willing out of His great goodness and grace, to bind himself to us, His enemies, with His promise and His oath. He promised that He would have his only begotten Son become human and die for us, and that through the sacrifice of his Son He would establish a lasting reconciliation and eternal peace….He would be our God and bless us, that is, forgive our sins and impart to us the Holy Spirit and eternal life—and all this without any merit on our part. All we would have to do is accept the Son—promised and sent—by faith.”

— Caspar Olevianus, A Firm Foundation: An Aid to Interpreting the Heidelberg Catechism, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhy+is+the+redemption+or+reconciliation+of+humanity+with+God+presented+to+us+in+the+form+of+a+covenant%2C+indeed+a+covenant+of+grace%3F+A%3A+God+compares+the+means+of+our+salvation+to+a+covenant%2C+indeed+an+eternal+covenant%2C+so+that+we+might+be+certain+and+assured+that+a+lasting%2C+eternal+peace+and+friendship+between+God+and+us+has+been+made+through+the+sacrifice+of+His+son.+After+a+bitter+quarrel%2C+the+disputants+have+peace+of+mind+first+and+foremost+when+they+commit+and+bind+themselves+to+each+other+with+a+promise+and+sworn+oath+that+on+such-and-such+a+matter+they+want+peace.+God+acts+in+the+same+way+toward+us%3A+in+order+that+we+might+have+rest+and+peace+in+our+consciences%2C+God+was+willing+out+of+His+great+goodness+and+grace%2C+to+bind+himself+to+us%2C+His+enemies%2C+with+His+promise+and+His+oath.+He+promised+that+He+would+have+his+only+begotten+Son+become+human+and+die+for+us%2C+and+that+through+the+sacrifice+of+his+Son+He+would+establish+a+lasting+reconciliation+and+eternal+peace%E2%80%A6.He+would+be+our+God+and+bless+us%2C+that+is%2C+forgive+our+sins+and+impart+to+us+the+Holy+Spirit+and+eternal+life%E2%80%94and+all+this+without+any+merit+on+our+part.+All+we+would+have+to+do+is+accept+the+Son%E2%80%94promised+and+sent%E2%80%94by+faith.%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+A+Firm+Foundation%3A+An+Aid+to+Interpreting+the+Heidelberg+Catechism%2C+trans.+Lyle+D.+Bierma%2C+Texts+and+Studies+in+Reformation+and+Post-Reformation+Thought+%28Carlisle%2C+United+Kingdom%3B+Grand+Rapids%2C+MI%3A+Paternoster+Press%3B+Baker+Books%2C+1995%29%2C+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fafdf9a87.html&amp;via=5Solas" ta <blockquote><p>If life and justice come not by the law, the law then is in vain. And this objection is expressed by way of interrogation, ‘Wherefore then serves the law?’ The answer is in the next words, ‘It is added for transgressions,’ that is, for the revealing of sin and the punishment thereof, and for the convincing of men touching their sins (Rom 3:19–20; HT: Inwoo Lee).</p></blockquote>

</figure><figure class="quote" id="q-af9d98cc39" data-kw="">
<blockquote><p>Objection: But does not the apostle say, Rom. 6:14. ‘Ye are not under the law but under grace?’ and Gal. 5:22, 23. ‘But the fruit of the Spirit is love, joy, peace, &amp;c.—against such there is no law?’ Answer: Believers are not under the law as a covenant of works, to be either justified or condemned thereby. For the apostle says, ‘Christ hath redeemed us from the curse of the law, being made a curse for us,’ Gal. 3:13; and that there is no condemnation to them which are in Christ Jesus.’ They are neither under the commanding nor the condemning power of that law, seeing Christ has given perfect obedience to it as a covenant of works, so that under that character it can have nothing to demand of them; and has fully satisfied all its demands in point of punishment, having suffered the very penalty threatened therein. So that as a covenant of works they are entirely delivered from it. And as to the fruits of the Spirit in them, they are the product of the Spirit, agreeable to the will and law of God; and no law can be against them, seeing they are agreeable to the very letter and spirit thereof. But believers are still under the law as a rule of life, according to which they are to regulate their hearts and lives. It is the pole star that must direct their course to heaven, and is of singular use to provoke and excite them to gratitude to Christ, who hath perfectly fulfilled it in their room and stead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Thomas Boston: An Illustration of the Doctrines of the Christian Religion, Part 2, ed. Samuel M‘Millan, vol. 2 (Aberdeen: George and Robert King, 1848), 64.</cite></span></figcaption>

</figure><figure class="quote" id="q-4ce57579ea" data-kw="">
<blockquote><p>(1.) The life which he now led was a life of faith with respect unto things spiritual and eternal. For he had for the foundation and object hereof, [1.] The promise of the blessed Seed, and the spiritual blessing of all nations in him, as a confirmation of the first fundamental promise to the church, concerning the Seed of the woman that was to break the serpent’s head. And [2] God entered expressly into covenant with him, confirming it with the seal of circumcision, wherein he obliged himself to be his God, his God almighty, or all-sufficient, for his temporal and eternal good. To suppose that Abraham saw nothing in this promise and covenant but only things confined unto this life, nothing of spiritual grace or mercy, nothing of eternal reward or glory, is so contrary to the analogy of faith, to express testimony of Scripture, so destructive of all the foundations of religion, so unworthy of the nature and properties of God, rendering his title of “the father of the faithful,” and his example in believing, so useless, as that it is a wonder men of any tolerable sobriety should indulge to such an imagination.</p></blockquote>

</a></div>
</figure><figure class="quote" id="q-a0ff0d7b1d" data-kw="">
<blockquote><p>The Church of Rome in a manner confounds the law and the gospel, saying that the gospel, which is the new law, reveals Christ more clearly than Moses’ law did, which they call the old law. But this is a wicked opinion, which overturns all religion, being the cause of many gross points in popery, which could not stand, if they would acknowledge a true distinction between the law and the gospel. They say for their defense that the precepts of both are the same in substance; that both require righteousness; both promise life, and threaten death; both command faith, repentance, and obedience; and therefore they are the same. Answer . First, the laws and precepts Answer . First, the laws and precepts of the law and gospel are not the same, for Adam in his innocence knew the law, but he knew nothing then of believing in Christ. And though both require righteousness, promise life, and threaten death, yet the manner is far different, as before was noted, so likewise they differ in the commanding of faith, for the gospel commands faith, not as a work done, as the law does, but as an instrument laying hold on Christ. Again, the law commands faith generally, as to believe in God, and to believe His Word to be true; but besides this, the gospel requires a particular faith in Christ the Redeemer, whom the law never knew. Thirdly, the law commands not repentance, for the knowledge of the law was in Adam’s heart, when he needed no repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on Christ’s Sermon on the Mount, in Works, 1:244–45. (HT: Inwoo Lee)</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Church of Rome in a manner confounds the law and the gospel, saying that the gospel, which is the new law, reveals Christ more clearly than Moses’ law did, which they call the old law. But this is a wicked opinion, which overturns all religion, being the cause of many gross points in popery, which could not stand, if they would acknowledge a true distinction between the law and the gospel. They say for their defense that the precepts of both are the same in substance; that both require righteousness; both promise life, and threaten death; both command faith, repentance, and obedience; and therefore they are the same. Answer . First, the laws and precepts Answer . First, the laws and precepts of the law and gospel are not the same, for Adam in his innocence knew the law, but he knew nothing then of believing in Christ. And though both require righteousness, promise life, and threaten death, yet the manner is far different, as before was noted, so likewise they differ in the commanding of faith, for the gospel commands faith, not as a work done, as the law does, but as an instrument laying hold on Christ. Again, the law commands faith generally, as to believe in God, and to believe His Word to be true; but besides this, the gospel requires a particular faith in Christ the Redeemer, whom the law never knew. Thirdly, the law commands not repentance, for the knowledge of the law was in Adam’s heart, when he needed no repentance.”

<blockquote><p>[W]hy the Lord says, “He that doeth the things of the law shall live,” considering no man since the fall can do the things of the law? Answer. The Lord since man’s fall repeats the law in his [its] old tenor, not to mock men, but for other weighty causes. The first is to teach us that the law is of a constant and unchangeable nature. The second is to advertise us of our weakness and to show us what we cannot do. The third is to put us in mind that we must still humble ourselves under the hand of God, after we have begun by grace to obey the law, because even then we come far short in doing the things which the law requires at our hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians, in Works, 2:178. (HT: Inwoo Lee)</cite></span></figcaption>

<blockquote><p>For when Scripture speaks of the sons of God, sometimes it has respect to eternal election, which extends only to the lawful heirs; sometimes to external vocation, according to which many wolves are within the fold; and though, in fact, they are strangers, yet they obtain the name of sons, until the Lord shall disown them. Yea, even by giving them a title so honourable, Moses reproves their ingratitude, because, leaving their heavenly Father, they prostituted themselves as deserters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the First Book of Moses Called Genesis, trans. John King (Bellingham, WA: Logos Bible Software, 2010) 1.238.</cite></span></figcaption>

— John Calvin, Commentary on the First Book of Moses Called Genesis, trans. John King (Bellingham, WA: Logos Bible Software, 2010) 1.238.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+when+Scripture+speaks+of+the+sons+of+God%2C+sometimes+it+has+respect+to+eternal+election%2C+which+extends+only+to+the+lawful+heirs%3B+sometimes+to+external+vocation%2C+according+to+which+many+wolves+are+within+the+fold%3B+and+though%2C+in+fact%2C+they+are+strangers%2C+yet+they+obtain+the+name+of+sons%2C+until+the+Lord+shall+disown+them.+Yea%2C+even+by+giving+them+a+title+so+honourable%2C+Moses+reproves+their+ingratitude%2C+because%2C+leaving+their+heavenly+Father%2C+they+prostituted+themselves+as+deserters.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+First+Book+of+Moses+Called+Genesis%2C+trans.+John+King+%28Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2010%29+1.238.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3381177b2b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3381177b2b.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/calvin-we-need-to-distinguish-between-the-internal-and-the-external-relation-to-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-0e2c309fd8" data-kw="">
<blockquote><p>We shall now be prepared to understand how the recognition, that the two worlds exist and have existed side by side from the beginning, enables the author of Hebrews to solve the chief problem of the history of redemption and revelation. For it is in Hebrews that the first age and the first world are identified with the first covenant. When, therefore, the question is raised, how the Old Covenant can be identical in substance with the New, what is the common essence, that notwithstanding the great progress from one to the other, makes them two coherent stages in the expression and conveyance of the same spiritual reality, the answer is immediately forthcoming: the same world of heavenly spiritual realities, which has now come to light in the Person and work of Christ, already existed during the course of the Old Covenant, and in a provisional typical way through revelation reflected itself in and through redemption projected itself into the religious experience of the ancient people of God, so that they in their own partial manner and measure had access to and communion with and enjoyment of the higher world, which has now been let down and thrown open to our full knowledge and possession. In other words, the bond that links the Old and the New Covenant together is not a purely evolutionary one, inasmuch as the one has grown out of the other; it is, if we may so call it, a transcendental bond: the New Covenant in its preexistent, heavenly state reaches back and stretches its eternal wings over the Old, and the Old Testament people of God were one with us in religious dignity and privilege; they were, to speak in a Pauline figure, sons of the Jerusalem above, which is the mother of all. This is a profounder solution than is offered in the well-known formula of Augustine: “The New Testament is latent in the Old, the Old Testament lies open in the New.” More profound because, together with the statement of the fact, it gives the reason for the fact. The latent existence of the verities and potencies of the Christian religion in the old dispensation are due to no other cause than that the Christian religion lived even at that time as redemptive truth and redemptive power in the heavenly world and from there created for itself an embryonic form of existence in the life of Israel. The writer of Hebrews would have subscribed to the belief that Christianity is as old as Abraham and as old as Moses, nay as old as Paradise, because it is heaven-born and not the child of earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos, ed. Richard B. Gaffin Jr. (Phillipsburg, NJ: P&amp;R Publishing, 2001), 199–200.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-32a127a836" data-kw="">
<blockquote><p>5. Now, if we choose to investigate whether it is right to administer baptism to infants, shall we not say that a man is talking nonsense or indeed raving who would halt with the mere element of water and outward observance, but cannot bear to turn his mind to the spiritual mystery? If any account of this is made, it will be evident that baptism is properly administered to infants as something owed to them. For in early times the Lord did not deign to have them circumcised without making them participants in all those things which were then signified by circumcision [cf. Gen. 17:12]. Otherwise, he would have mocked his people with mere trickery if he had nursed them on meaningless symbols, which is a dreadful thing even to hear of. For he expressly declares that the circumcision of a tiny infant will be in lieu of a seal to certify the promise of the covenant. But if the covenant still remains firm and steadfast, it applies no less today to the children of Christians than under the Old Testament it pertained to the infants of the Jews. Yet if they are participants in the thing signified, why shall they be debarred from the sign? If they grasp the truth, why shall they be driven away from the figure? Notwithstanding, the outward sign so cleaves to the word in the sacrament that it cannot be separated from it; yet if the sign is considered separately from the word, which, I ask you, shall we esteem more? Obviously, since we see that the sign serves the word, we shall say that it is under the word, and shall relegate it to a lower place. Therefore, since the word “baptism” is applied to infants, why shall the sign, which is an appendix of the word, be denied to them? This one reason, if no others were at hand, would be quite enough to refute all those who would speak in opposition. The objection that there was a stated day for circumcision is sheer evasion. We admit that we are not now bound to certain days like the Jews; but since the Lord, without fixing the day, yet declares that he is pleased to receive infants into his covenant with a solemn rite, what more do we require? 6. Yet Scripture opens to us a still surer knowledge of the truth. Indeed, it is most evident that the covenant which the Lord once made with Abraham [cf. Gen. 17:14] is no less in force today for Christians than it was of old for the Jewish people, and that this word relates no less to Christians than it then related to the Jews. Unless perhaps we think that Christ by his coming lessened or curtailed the grace of the Father—but this is nothing but execrable blasphemy! Accordingly, the children of the Jews also, because they had been made heirs of his covenant and distinguished from the children of the impious, were called a holy seed [Ezra 9:2; Isa. 6:13]. For this same reason, the children of Christians are considered holy; and even though born with only one believing parent, by the apostle’s testimony they differ from the unclean seed of idolators [1 Cor. 7:14]. Now seeing that the Lord, immediately after making the covenant with Abraham, commanded it to be sealed infants by an outward sacrament [Gen. 17:12], what excuse will Christians give for not testifying and sealing it in their children today? And let no one object against me that the Lord did not command that his covenant be confirmed by any other symbol than circumcision, which has long since been abolished. There is a ready answer that for the time of the Old Testament he instituted circumcision to confirm his covenant, but that after circumcision was abolished, the same reason for confirming his covenant (which we have in common with the Jews) still holds good. Consequently, we must always diligently consider what is common to both, and what they have apart from us. The covenant is common, and the reason for confirming it is common. Only the manner of confirmation is different—what was circumcision for them was replaced for us by baptism. Otherwise, if the testimony by which the Jews were assured of the salvation of their posterity is taken away from us, Christ’s coming would have the effect of making God’s grace more obscure and less attested for us than it had previously been for the Jews. Now, this cannot be said without grievously slandering Christ, through whom the Father’s infinite goodness was more clearly and liberally poured out upon the earth and declared to men than ever before. And if so, we must admit that at least it should not be concealed with more malign intent, nor revealed with weaker testimony than under the dim shadows of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion ed. John T. McNeill, trans. Ford Lewis Battles, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 4.16.5–6.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“5. Now, if we choose to investigate whether it is right to administer baptism to infants, shall we not say that a man is talking nonsense or indeed raving who would halt with the mere element of water and outward observance, but cannot bear to turn his mind to the spiritual mystery? If any account of this is made, it will be evident that baptism is properly administered to infants as something owed to them. For in early times the Lord did not deign to have them circumcised without making them participants in all those things which were then signified by circumcision [cf. Gen. 17:12]. Otherwise, he would have mocked his people with mere trickery if he had nursed them on meaningless symbols, which is a dreadful thing even to hear of. For he expressly declares that the circumcision of a tiny infant will be in lieu of a seal to certify the promise of the covenant. But if the covenant still remains firm and steadfast, it applies no less today to the children of Christians than under the Old Testament it pertained to the infants of the Jews. Yet if they are participants in the thing signified, why shall they be debarred from the sign? If they grasp the truth, why shall they be driven away from the figure? Notwithstanding, the outward sign so cleaves to the word in the sacrament that it cannot be separated from it; yet if the sign is considered separately from the word, which, I ask you, shall we esteem more? Obviously, since we see that the sign serves the word, we shall say that it is under the word, and shall relegate it to a lower place. Therefore, since the word “baptism” is applied to infants, why shall the sign, which is an appendix of the word, be denied to them? This one reason, if no others were at hand, would be quite enough to refute all those who would speak in opposition. The objection that there was a stated day for circumcision is sheer evasion. We admit that we are not now bound to certain days like the Jews; but since the Lord, without fixing the day, yet declares that he is pleased to receive infants into his covenant with a solemn rite, what more do we require? 6. Yet Scripture opens to us a still surer knowledge of the truth. Indeed, it is most evident that the covenant which the Lord once made with Abraham [cf. Gen. 17:14] is no less in force today for Christians than it was of old for the Jewish people, and that this word relates no less to Christians than it then related to the Jews. Unless perhaps we think that Christ by his coming lessened or curtailed the grace of the Father—but this is nothing but execrable blasphemy! Accordingly, the children of the Jews also, because they had been made heirs of his covenant and distinguished from the children of the impious, were called a holy seed [Ezra 9:2; Isa. 6:13]. For this same reason, the children of Christians are considered holy; and even though born with only one believing parent, by the apostle’s testimony they differ from the unclean seed of idolators [1 Cor. 7:14]. Now seeing that the Lord, immediately after making the covenant with Abraham, commanded it to be sealed infants by an outward sacrament [Gen. 17:12], what excuse will Christians give for not testifying and sealing it in their children today? And let no one object against me that the Lord did not command that his covenant be confirmed by any other symbol than circumcision, which has long since been abolished. There is a ready answer that for the time of the Old Testament he instituted circumcision to confirm his covenant, but that after circumcision was abolished, the same reason for confirming his covenant (which we have in common with the Jews) still holds good. Consequently, we must always diligently consider what is common to both, and what they have apart from us. The covenant is common, and the reason for confirming it is common. Only the manner of confirmation is different—what was circumcision for them was replaced for us by baptism. Otherwise, if the testimony by which the Jews were assured of the salvation of their posterity is taken away from us, Christ’s coming would have the effect of making God’s grace more obscure and less attested for us than it had previously been for the Jews. Now, this cannot be said without grievously slandering Christ, through whom the Father’s infinite goodness was more clearly and liberally poured out upon the earth and declared to men than ever before. And if so, we must admit that at least it should not be concealed with more malign intent, nor revealed with weaker testimony than under the dim shadows of the law.”

— John Calvin, Institutes of the Christian Religion ed. John T. McNeill, trans. Ford Lewis Battles, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 4.16.5–6.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+Now%2C+if+we+choose+to+investigate+whether+it+is+right+to+administer+baptism+to+infants%2C+shall+we+not+say+that+a+man+is+talking+nonsense+or+indeed+raving+who+would+halt+with+the+mere+element+of+water+and+outward+observance%2C+but+cannot+bear+to+turn+his+mind+to+the+spiritual+mystery%3F+If+any+account+of+this+is+made%2C+it+will+be+evident+that+baptism+is+properly+administered+to+infants+as+something+owed+to+them.+For+in+early+times+the+Lord+did+not+deign+to+have+them+circumcised+without+making+them+participants+in+all+those+things+which+were+then+signified+by+circumcision+%5Bcf.+Gen.+17%3A12%5D.+Otherwise%2C+he+would+have+mocked+his+people+with+mere+trickery+if+he+had+nursed+them+on+meaningless+symbols%2C+which+is+a+dreadful+thing+even+to+hear+of.+For+he+expressly+declares+that+the+circumcision+of+a+tiny+infant+will+be+in+lieu+of+a+seal+to+certify+the+promise+of+the+covenant.+But+if+the+covenant+still+remains+firm+and+steadfast%2C+it+applies+no+less+today+to+the+children+of+Christians+than+under+the+Old+Testament+it+pertained+to+the+infants+of+the+Jews.+Yet+if+they+are+participants+in+the+thing+signified%2C+why+shall+they+be+debarred+from+the+sign%3F+If+they+grasp+the+truth%2C+why+shall+they+be+driven+away+from+the+figure%3F+Notwithstanding%2C+the+outward+sign+so+cleaves+to+the+word+in+the+sacrament+that+it+cannot+be+separated+from+it%3B+yet+if+the+sign+is+considered+separately+from+the+word%2C+which%2C+I+ask+you%2C+shall+we+esteem+more%3F+Obviously%2C+since+we+see+that+the+sign+serves+the+word%2C+we+shall+say+that+it+is+under+the+word%2C+and+shall+relegate+it+to+a+lower+place.+Therefore%2C+since+the+word+%E2%80%9Cbaptism%E2%80%9D+is+applied+to+infants%2C+why+shall+the+sign%2C+which+is+an+appendix+of+the+word%2C+be+denied+to+them%3F+This+one+reason%2C+if+no+others+were+at+hand%2C+would+be+quite+enough+to+refute+all+those+who+would+speak+in+opposition.+The+objection+that+there+was+a+stated+day+for+circumcision+is+sheer+evasion.+We+admit+that+we+are+not+now+bound+to+certain+days+like+the+Jews%3B+but+since+the+Lord%2C+without+fixing+the+day%2C+yet+declares+that+he+is+pleased+to+receive+infants+into+his+covenant+with+a+solemn+rite%2C+what+more+do+we+require%3F+6.+Yet+Scripture+opens+to+us+a+still+surer+knowledge+of+the+truth.+Indeed%2C+it+is+most+evident+that+the+covenant+which+the+Lord+once+made+with+Abraham+%5Bcf.+Gen.+17%3A14%5D+is+no+less+in+force+today+for+Christians+than+it+was+of+old+for+the+Jewish+people%2C+and+that+this+word+relates+no+less+to+Christians+than+it+then+related+to+the+Jews.+Unless+perhaps+we+think+that+Christ+by+his+coming+lessened+or+curtailed+the+grace+of+the+Father%E2%80%94but+this+is+nothing+but+execrable+blasphemy%21+Accordingly%2C+the+children+of+the+Jews+also%2C+because+they+had+been+made+heirs+of+his+covenant+and+distinguished+from+the+children+of+the+impious%2C+were+called+a+holy+seed+%5BEzra+9%3A2%3B+Isa.+6%3A13%5D.+For+this+same+reason%2C+the+children+of+Christians+are+considered+holy%3B+and+even+though+born+with+only+one+believing+parent%2C+by+the+apostle%E2%80%99s+testimony+they+differ+from+the+unclean+seed+of+idolators+%5B1+Cor.+7%3A14%5D.+Now+seeing+that+the+Lord%2C+immediately+after+making+the+covenant+with+Abraham%2C+commanded+it+to+be+sealed+infants+by+an+outward+sacrament+%5BGen.+17%3A12%5D%2C+what+excuse+will+Christians+give+for+not+testifying+and+sealing+it+in+their+children+today%3F+And+let+no+one+object+against+me+that+the+Lord+did+not+command+that+his+covenant+be+confirmed+by+any+other+symbol+than+circumcision%2C+which+has+long+since+been+abolished.+There+is+a+ready+answer+that+for+the+time+of+the+Old+Testament+he+instituted+circumcision+to+confirm+his+covenant%2C+but+that+after+circumcision+was+abolished%2C+the+same+reason+for+confirming+his+covenant+%28which+we+have+in+common+with+the+Jews%29+still+holds+good.+Consequently%2C+we+must+always+diligently+consider+what+is+common+to+both%2C+and+what+they+have+apart+from+us.+The+covenant+is+common%2C+and+the+reason+for+confirming+it+is+common.+Only+the+manner+of+confirmation+is+different%E2%80%94what+was+circumcision+for+them+was+replaced+for+us+by+baptism.+Otherwise%2C+if+the+testimony+by+which+the+Jews+were+assured+of+the+salvation+of+their+posterity+is+taken+away+from+us%2C+Christ%E2%80%99s+coming+would+have+the+effect+of+making+God%E2%80%99s+grace+more+obscure+and+less+attested+for+us+than+it+had+previously+been+for+the+Jews.+Now%2C+this+cannot+be+said+without+grievously+slandering+Christ%2C+through+whom+the+Father%E2%80%99s+infinite+goodness+was+more+clearly+and+liberally+poured+out+upon+the+earth+and+declared+to+men+than+ever+before.+And+if+so%2C+we+must+admit+that+at+least+it+should+not+be+concealed+with+more+malign+intent%2C+nor+revealed+with+weaker+testimony+than+under+the+dim+shadows+of+the+law.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion+ed.+John+T.+McNeill%2C+trans.+Ford+Lewis+Battles%2C+The+Library+of+Christian+Classics+%28Louisville%2C+KY%3A+Westminster+John+Knox+Press%2C+2011%29%2C+4.16.5%E2%80%936.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32a127a836.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32a127a836.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/calvin-on-the-unity-of-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>What Augustine so strikingly formulated concerning the relation of the two historic economies of the history of redemption: “Novum Testamentum in Vetere latet, Vetus in Novo patet” [The New Testament hides in the old, the Old reveals itself in the New] permits of application to the subject in hand. Here also there was a “new” and an “old,” but the substance was the same, not different in principle, and thus it came about that the one could be used to interpret the other. Revelation could make use of the preëstablished harmony which it had itself laid at the basis of its scheme.</p></blockquote>

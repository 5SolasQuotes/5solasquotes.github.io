<blockquote><p>THERE is little more in all this, (viz. “The Marrow,”) to be attributed to me than the very gathering and composing of it. That which I aim at, and intend therein, is to show unto myself, and others that shall read it, the difference betwixt the Law and the Gospel,—a point, as I conceive, very needful for us to be well instructed in, and that for these reasons:—First, Because, if we be ignorant thereof, we shall be very apt to mix and mingle them together, and so to confound the one with the other; which, as Luther on the Galatians, p. 31, truly says, “doth more mischief than man’s reason can conceive;” and therefore he doth advise all Christians, in the case of justification, to separate the Law and the Gospel as far asunder as heaven and earth are separated. Secondly, Because if we know right how to distinguish betwixt them, the knowledge thereof will afford ns no small light towards the true understanding of the Scripture, and will help us to reconcile all such places, both in the Old and New Testament, as seem to be repugnant; yea, and it will help us to judge aright of cases of conscience, and quiet our own conscience in time of trouble and distress; yea, and we shall thereby be enabled to try the truth and falsehood of all doctrines: wherefore, for our better instruction in this point, we are first of all to consider and take notice what the law is, and what the gospel is. Now, the law is a doctrine partly known by nature, teaching us that there is a God, and what God is, and what he requires us to do, binding all reasonable creatures to perfect obedience, both internal and external, promising the favour of God, and everlasting life to all those who yield perfect obedience thereunto, and denouncing the curse of God and everlasting damnation to all those who are not perfectly correspondent thereunto. But the gospel is a doctrine revealed from heaven by the Son of God, presently after the fall of mankind into sin and death, and afterwards manifested more clearly and fully to the patriarchs and prophets, to the evangelists and apostles, and by them spread abroad to others; wherein freedom from sin, the curse of the law, the wrath of God, death, and hell, is freely promised for Christ’s sake unto all who truly believe on his name. 2dly, We are to consider what the nature and office of the law is, and what the nature and office of the gospel is. Now, the nature and office of the law is to show unto us our sin, (Rom. 3:20,) our condemnation, our death, Rom. 2:1; 7:10. But the nature and office of the gospel is to show unto us, that Christ has taken away our sin, (John 1:29,) and that he also is our redemption and life, Col. 1:14; 3:4. So that the LAW is a word of wrath, Rom. 4:14; but the GOSPEL is a word of peace, Eph. 2:17. 3dly, We are to consider where we may find the law written, and where we may find the gospel written. Now, we shall find this law and this gospel written and recorded in the writings of the prophets, evangelists, and apostles, namely, in the books called the Old and New Testament, or the Scriptures. For, indeed, the law and the gospel are the chief general heads which comprehend all the doctrine of the Scriptures; yet we are not to think that these two doctrines are to be distinguished by the books and leaves of the Scriptures, but by the diversity of God’s Spirit speaking in them: we are not to take and understand whatsoever is contained in the compass of the Old Testament to be only and merely the word and voice of the law; neither are we to think that whatsoever is contained within the compass of the bookscalled the New Testament is only and merely the voice of the gospel; for sometimes in the Old Testament God does speak comfort, as he comforted Adam, with the voice of the gospel; sometimes also in the New Testament he does threaten and terrify, as when Christ terrified the Pharisees. In some places, again, Moses and the prophets do play the evangelists; inasmuch that Hierom doubts whether he should call Isaiah a prophet or an evangelist. In some places, likewise, Christ and the apostles supply the part of Moses: Christ himself, until his death, was under the law, which law he came not to break, but to fulfil; so his sermons made to the Jews, for the most part, run all upon the perfect doctrine and works of the law, showing and teaching what we ought to do by the right law of justice, and what danger ensues in the non-performance of the same. All which places, though they be contained in the book of the New Testament, yet are they to be referred to the doctrine of the law, ever having included in them a privy exception of repentance and faith in Jesus Christ. As for example, where Christ thus preaches, “Blessed are the pure in heart, for they shall see God,” Matt. 5:8. Again, “Except ye be converted, and become as little children, ye shall not enter into the kingdom of heaven,” Matt. 18:3. And again, “He that doth the will of my Father which is in heaven, shall enter into the kingdom of heaven,” Matt. 7:22. And again, the parable of the wicked servant cast into prison, for not forgiving his fellow, Matth. 18:30; the casting of the rich glutton into hell, Luke 16:23. And again, “He that denieth me before men, I will deny him before my Father which is in heaven,” Luke 12:9; with divers such other places, all which, I say, do appertain to the doctrine of the law. Wherefore, in the fourth place, we are to take heed, when we read the Scriptures, we do not take the gospel for the law, nor the law for the gospel, but labour to discern and distinguish the voice of the one from the voice of the other: and if we would know when the law speaks, and when the gospel speaks, let us consider and take this for a note, That when in Scripture there is any moral work commanded to be done, either for eschewing of punishment, or upon promise of any reward, temporal or eternal; or else when any promise is made, with the condition of any work to be done, which is commanded in the law, there is to be understood the voice of the law. Contrariwise, where the promise of life and salvation is offered unto us freely, without any condition of any law, either natural, ceremonial, or moral, or any work done by us, all those places, whether we read them in the Old Testament, or in the New, are to be referred to the voice and doctrine of the gospel; yea, and all those promises of Christ coming in the flesh, which we read in the Old Testament, yea, and all those promises in the New Testament, which offer Christ upon condition of our believing on his name, are properly called the voice of the gospel, because they have no condition of our mortifying annexed unto them, but only faith to apprehend and receive Jesus Christ; as it is written, (Rom. 3:22,) “For the righteousness of God, which is by faith of Jesus Christ unto all, and upon all that believe,” &amp;c. Briefly, then, if we would know when the law speaks, and when the gospel speaks, either in reading the word, or in hearing it preached; and if we would skilfully distinguish the voice of the one from the voice of the other, we must consider, Law. The law says, “Thou art a sinner, and therefore thou shalt be damned;” Rom. 7:2; 2 Thess. 2:12. Gos. But the gospel says, No; “Christ Jesus came into the world to save sinners;” and therefore “believe on the Lord Jesus Christ, and thou shalt be saved,” 1 Tim. 1:15; Acts 16:31. Law. Again the law says, “Knowest thou not that the unrighteous shall not inherit the kingdom of God; be not deceived,” &amp;c. 1 Cor. 6:9. And therefore thou being a sinner, and not righteous, shall not inherit the kingdom of God. Gos. But the gospel says, “God has made Christ to be sin for thee, who knew no sin; that thou mightest be made the righteousness of God in him, who is the Lord thy righteousness,” Jer. 23:6. Law. Again the law says, “Pay me that thou owest me, or else I will cast thee into prison,” Matt. 18:28, 30. Gos. But the gospel says, “Christ gave himself a ransom for thee,” 1 Tim. 2:6; “and so is made redemption unto thee,” 1 Cor. 1:30. Law. Again the law says, “Thou hast not continued in all that I require of thee, and therefore thou art accursed,” Deut. 27:6. Gos. But the gospel says, “Christ hath redeemed thee from the curse of the law, being made a curse for thee,” Gal. 3:13. Law. Again the law says, “Thou art become guilty before God, and therefore shalt not escape the judgment of God,” Rom. 3:29; 2:3. Gos. But the gospel says, “The Father judgeth no man, but hath committed all judgment to the Son,” John 5:12. And now, knowing rightly how to distinguish between the law and the gospel, we must, in the fifth place, take heed that we break not the orders between these two in applying the law where the gospel is to be applied, either to ourselves or to others; for albeit the law and gospel, in order of doctrine, are many times to be joined together, yet, in the case of justification, the law must be utterly separated from the gospel.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“THERE is little more in all this, (viz. “The Marrow,”) to be attributed to me than the very gathering and composing of it. That which I aim at, and intend therein, is to show unto myself, and others that shall read it, the difference betwixt the Law and the Gospel,—a point, as I conceive, very needful for us to be well instructed in, and that for these reasons:—First, Because, if we be ignorant thereof, we shall be very apt to mix and mingle them together, and so to confound the one with the other; which, as Luther on the Galatians, p. 31, truly says, “doth more mischief than man’s reason can conceive;” and therefore he doth advise all Christians, in the case of justification, to separate the Law and the Gospel as far asunder as heaven and earth are separated. Secondly, Because if we know right how to distinguish betwixt them, the knowledge thereof will afford ns no small light towards the true understanding of the Scripture, and will help us to reconcile all such places, both in the Old and New Testament, as seem to be repugnant; yea, and it will help us to judge aright of cases of conscience, and quiet our own conscience in time of trouble and distress; yea, and we shall thereby be enabled to try the truth and falsehood of all doctrines: wherefore, for our better instruction in this point, we are first of all to consider and take notice what the law is, and what the gospel is. Now, the law is a doctrine partly known by nature, teaching us that there is a God, and what God is, and what he requires us to do, binding all reasonable creatures to perfect obedience, both internal and external, promising the favour of God, and everlasting life to all those who yield perfect obedience thereunto, and denouncing the curse of God and everlasting damnation to all those who are not perfectly correspondent thereunto. But the gospel is a doctrine revealed from heaven by the Son of God, presently after the fall of mankind into sin and death, and afterwards manifested more clearly and fully to the patriarchs and prophets, to the evangelists and apostles, and by them spread abroad to others; wherein freedom from sin, the curse of the law, the wrath of God, death, and hell, is freely promised for Christ’s sake unto all who truly believe on his name. 2dly, We are to consider what the nature and office of the law is, and what the nature and office of the gospel is. Now, the nature and office of the law is to show unto us our sin, (Rom. 3:20,) our condemnation, our death, Rom. 2:1; 7:10. But the nature and office of the gospel is to show unto us, that Christ has taken away our sin, (John 1:29,) and that he also is our redemption and life, Col. 1:14; 3:4. So that the LAW is a word of wrath, Rom. 4:14; but the GOSPEL is a word of peace, Eph. 2:17. 3dly, We are to consider where we may find the law written, and where we may find the gospel written. Now, we shall find this law and this gospel written and recorded in the writings of the prophets, evangelists, and apostles, namely, in the books called the Old and New Testament, or the Scriptures. For, indeed, the law and the gospel are the chief general heads which comprehend all the doctrine of the Scriptures; yet we are not to think that these two doctrines are to be distinguished by the books and leaves of the Scriptures, but by the diversity of God’s Spirit speaking in them: we are not to take and understand whatsoever is contained in the compass of the Old Testament to be only and merely the word and voice of the law; neither are we to think that whatsoever is contained within the compass of the bookscalled the New Testament is only and merely the voice of the gospel; for sometimes in the Old Testament God does speak comfort, as he comforted Adam, with the voice of the gospel; sometimes also in the New Testament he does threaten and terrify, as when Christ terrified the Pharisees. In some places, again, Moses and the prophets do play the evangelists; inasmuch that Hierom doubts whether he should call Isaiah a prophet or an evangelist. In some places, likewise, Christ and the apostles supply the part of Moses: Christ himself, until his death, was under the law, which law he came not to break, but to fulfil; so his sermons made to the Jews, for the most part, run all upon the perfect doctrine and works of the law, showing and teaching what we ought to do by the right law of justice, and what danger ensues in the non-performance of the same. All which places, though they be contained in the book of the New Testament, yet are they to be referred to the doctrine of the law, ever having included in them a privy exception of repentance and faith in Jesus Christ. As for example, where Christ thus preaches, “Blessed are the pure in heart, for they shall see God,” Matt. 5:8. Again, “Except ye be converted, and become as little children, ye shall not enter into the kingdom of heaven,” Matt. 18:3. And again, “He that doth the will of my Father which is in heaven, shall enter into the kingdom of heaven,” Matt. 7:22. And again, the parable of the wicked servant cast into prison, for not forgiving his fellow, Matth. 18:30; the casting of the rich glutton into hell, Luke 16:23. And again, “He that denieth me before men, I will deny him before my Father which is in heaven,” Luke 12:9; with divers such other places, all which, I say, do appertain to the doctrine of the law. Wherefore, in the fourth place, we are to take heed, when we read the Scriptures, we do not take the gospel for the law, nor the law for the gospel, but labour to discern and distinguish the voice of the one from the voice of the other: and if we would know when the law speaks, and when the gospel speaks, let us consider and take this for a note, That when in Scripture there is any moral work commanded to be done, either for eschewing of punishment, or upon promise of any reward, temporal or eternal; or else when any promise is made, with the condition of any work to be done, which is commanded in the law, there is to be understood the voice of the law. Contrariwise, where the promise of life and salvation is offered unto us freely, without any condition of any law, either natural, ceremonial, or moral, or any work done by us, all those places, whether we read them in the Old Testament, or in the New, are to be referred to the voice and doctrine of the gospel; yea, and all those promises of Christ coming in the flesh, which we read in the Old Testament, yea, and all those promises in the New Testament, which offer Christ upon condition of our believing on his name, are properly called the voice of the gospel, because they have no condition of our mortifying annexed unto them, but only faith to apprehend and receive Jesus Christ; as it is written, (Rom. 3:22,) “For the righteousness of God, which is by faith of Jesus Christ unto all, and upon all that believe,” &amp;c. Briefly, then, if we would know when the law speaks, and when the gospel speaks, either in reading the word, or in hearing it preached; and if we would skilfully distinguish the voice of the one from the voice of the other, we must consider, Law. The law says, “Thou art a sinner, and therefore thou shalt be damned;” Rom. 7:2; 2 Thess. 2:12. Gos. But the gospel says, No; “Christ Jesus came into the world to save sinners;” and therefore “believe on the Lord Jesus Christ, and thou shalt be saved,” 1 Tim. 1:15; Acts 16:31. Law. Again the law says, “Knowest thou not that the unrighteous shall not inherit the kingdom of God; be not deceived,” &amp;c. 1 Cor. 6:9. And therefore thou being a sinner, and not righteous, shall not inherit the kingdom of God. Gos. But the gospel says, “God has made Christ to be sin for thee, who knew no sin; that thou mightest be made the righteousness of God in him, who is the Lord thy righteousness,” Jer. 23:6. Law. Again the law says, “Pay me that thou owest me, or else I will cast thee into prison,” Matt. 18:28, 30. Gos. But the gospel says, “Christ gave himself a ransom for thee,” 1 Tim. 2:6; “and so is made redemption unto thee,” 1 Cor. 1:30. Law. Again the law says, “Thou hast not continued in all that I require of thee, and therefore thou art accursed,” Deut. 27:6. Gos. But the gospel says, “Christ hath redeemed thee from the curse of the law, being made a curse for thee,” Gal. 3:13. Law. Again the law says, “Thou art become guilty before God, and therefore shalt not escape the judgment of God,” Rom. 3:29; 2:3. Gos. But the gospel says, “The Father judgeth no man, but hath committed all judgment to the Son,” John 5:12. And now, knowing rightly how to distinguish between the law and the gospel, we must, in the fifth place, take heed that we break not the orders between these two in applying the law where the gospel is to be applied, either to ourselves or to others; for albeit the law and gospel, in order of doctrine, are many times to be joined together, yet, in the case of justification, the law must be utterly separated from the gospel.”

— Thomas Boston, The Whole Works of Thomas Boston: An Explication of the Assembly’s Shorter Catechism, ed. Samuel M‘Millan (Aberdeen: George and Robert King, 1850), 7.459–62.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTHERE+is+little+more+in+all+this%2C+%28viz.+%E2%80%9CThe+Marrow%2C%E2%80%9D%29+to+be+attributed+to+me+than+the+very+gathering+and+composing+of+it.+That+which+I+aim+at%2C+and+intend+therein%2C+is+to+show+unto+myself%2C+and+others+that+shall+read+it%2C+the+difference+betwixt+the+Law+and+the+Gospel%2C%E2%80%94a+point%2C+as+I+conceive%2C+very+needful+for+us+to+be+well+instructed+in%2C+and+that+for+these+reasons%3A%E2%80%94First%2C+Because%2C+if+we+be+ignorant+thereof%2C+we+shall+be+very+apt+to+mix+and+mingle+them+together%2C+and+so+to+confound+the+one+with+the+other%3B+which%2C+as+Luther+on+the+Galatians%2C+p.+31%2C+truly+says%2C+%E2%80%9Cdoth+more+mischief+than+man%E2%80%99s+reason+can+conceive%3B%E2%80%9D+and+therefore+he+doth+advise+all+Christians%2C+in+the+case+of+justification%2C+to+separate+the+Law+and+the+Gospel+as+far+asunder+as+heaven+and+earth+are+separated.+Secondly%2C+Because+if+we+know+right+how+to+distinguish+betwixt+them%2C+the+knowledge+thereof+will+afford+ns+no+small+light+towards+the+true+understanding+of+the+Scripture%2C+and+will+help+us+to+reconcile+all+such+places%2C+both+in+the+Old+and+New+Testament%2C+as+seem+to+be+repugnant%3B+yea%2C+and+it+will+help+us+to+judge+aright+of+cases+of+conscience%2C+and+quiet+our+own+conscience+in+time+of+trouble+and+distress%3B+yea%2C+and+we+shall+thereby+be+enabled+to+try+the+truth+and+falsehood+of+all+doctrines%3A+wherefore%2C+for+our+better+instruction+in+this+point%2C+we+are+first+of+all+to+consider+and+take+notice+what+the+law+is%2C+and+what+the+gospel+is.+Now%2C+the+law+is+a+doctrine+partly+known+by+nature%2C+teaching+us+that+there+is+a+God%2C+and+what+God+is%2C+and+what+he+requires+us+to+do%2C+binding+all+reasonable+creatures+to+perfect+obedience%2C+both+internal+and+external%2C+promising+the+favour+of+God%2C+and+everlasting+life+to+all+those+who+yield+perfect+obedience+thereunto%2C+and+denouncing+the+curse+of+God+and+everlasting+damnation+to+all+those+who+are+not+perfectly+correspondent+thereunto.+But+the+gospel+is+a+doctrine+revealed+from+heaven+by+the+Son+of+God%2C+presently+after+the+fall+of+mankind+into+sin+and+death%2C+and+afterwards+manifested+more+clearly+and+fully+to+the+patriarchs+and+prophets%2C+to+the+evangelists+and+apostles%2C+and+by+them+spread+abroad+to+others%3B+wherein+freedom+from+sin%2C+the+curse+of+the+law%2C+the+wrath+of+God%2C+death%2C+and+hell%2C+is+freely+promised+for+Christ%E2%80%99s+sake+unto+all+who+truly+believe+on+his+name.+2dly%2C+We+are+to+consider+what+the+nature+and+office+of+the+law+is%2C+and+what+the+nature+and+office+of+the+gospel+is.+Now%2C+the+nature+and+office+of+the+law+is+to+show+unto+us+our+sin%2C+%28Rom.+3%3A20%2C%29+our+condemnation%2C+our+death%2C+Rom.+2%3A1%3B+7%3A10.+But+the+nature+and+office+of+the+gospel+is+to+show+unto+us%2C+that+Christ+has+taken+away+our+sin%2C+%28John+1%3A29%2C%29+and+that+he+also+is+our+redemption+and+life%2C+Col.+1%3A14%3B+3%3A4.+So+that+the+LAW+is+a+word+of+wrath%2C+Rom.+4%3A14%3B+but+the+GOSPEL+is+a+word+of+peace%2C+Eph.+2%3A17.+3dly%2C+We+are+to+consider+where+we+may+find+the+law+written%2C+and+where+we+may+find+the+gospel+written.+Now%2C+we+shall+find+this+law+and+this+gospel+written+and+recorded+in+the+writings+of+the+prophets%2C+evangelists%2C+and+apostles%2C+namely%2C+in+the+books+called+the+Old+and+New+Testament%2C+or+the+Scriptures.+For%2C+indeed%2C+the+law+and+the+gospel+are+the+chief+general+heads+which+comprehend+all+the+doctrine+of+the+Scriptures%3B+yet+we+are+not+to+think+that+these+two+doctrines+are+to+be+distinguished+by+the+books+and+leaves+of+the+Scriptures%2C+but+by+the+diversity+of+God%E2%80%99s+Spirit+speaking+in+them%3A+we+are+not+to+take+and+understand+whatsoever+is+contained+in+the+compass+of+the+Old+Testament+to+be+only+and+merely+the+word+and+voice+of+the+law%3B+neither+are+we+to+think+that+whatsoever+is+contained+within+the+compass+of+the+bookscalled+the+New+Testament+is+only+and+merely+the+voice+of+the+gospel%3B+for+sometimes+in+the+Old+Testament+God+does+speak+comfort%2C+as+he+comforted+Adam%2C+with+the+voice+of+the+gospel%3B+sometimes+also+in+the+New+Testament+he+does+threaten+and+terrify%2C+as+when+Christ+terrified+the+Pharisees.+In+some+places%2C+again%2C+Moses+and+the+prophets+do+play+the+evangelists%3B+inasmuch+that+Hierom+doubts+whether+he+should+call+Isaiah+a+prophet+or+an+evangelist.+In+some+places%2C+likewise%2C+Christ+and+the+apostles+supply+the+part+of+Moses%3A+Christ+himself%2C+until+his+death%2C+was+under+the+law%2C+which+law+he+came+not+to+break%2C+but+to+fulfil%3B+so+his+sermons+made+to+the+Jews%2C+for+the+most+part%2C+run+all+upon+the+perfect+doctrine+and+works+of+the+law%2C+showing+and+teaching+what+we+ought+to+do+by+the+right+law+of+justice%2C+and+what+danger+ensues+in+the+non-performance+of+the+same.+All+which+places%2C+though+they+be+contained+in+the+book+of+the+New+Testament%2C+yet+are+they+to+be+referred+to+the+doctrine+of+the+law%2C+ever+having+included+in+them+a+privy+exception+of+repentance+and+faith+in+Jesus+Christ.+As+for+example%2C+where+Christ+thus+preaches%2C+%E2%80%9CBlessed+are+the+pure+in+heart%2C+for+they+shall+see+God%2C%E2%80%9D+Matt.+5%3A8.+Again%2C+%E2%80%9CExcept+ye+be+converted%2C+and+become+as+little+children%2C+ye+shall+not+enter+into+the+kingdom+of+heaven%2C%E2%80%9D+Matt.+18%3A3.+And+again%2C+%E2%80%9CHe+that+doth+the+will+of+my+Father+which+is+in+heaven%2C+shall+enter+into+the+kingdom+of+heaven%2C%E2%80%9D+Matt.+7%3A22.+And+again%2C+the+parable+of+the+wicked+servant+cast+into+prison%2C+for+not+forgiving+his+fellow%2C+Matth.+18%3A30%3B+the+casting+of+the+rich+glutton+into+hell%2C+Luke+16%3A23.+And+again%2C+%E2%80%9CHe+that+denieth+me+before+men%2C+I+will+deny+him+before+my+Father+which+is+in+heaven%2C%E2%80%9D+Luke+12%3A9%3B+with+divers+such+other+places%2C+all+which%2C+I+say%2C+do+appertain+to+the+doctrine+of+the+law.+Wherefore%2C+in+the+fourth+place%2C+we+are+to+take+heed%2C+when+we+read+the+Scriptures%2C+we+do+not+take+the+gospel+for+the+law%2C+nor+the+law+for+the+gospel%2C+but+labour+to+discern+and+distinguish+the+voice+of+the+one+from+the+voice+of+the+other%3A+and+if+we+would+know+when+the+law+speaks%2C+and+when+the+gospel+speaks%2C+let+us+consider+and+take+this+for+a+note%2C+That+when+in+Scripture+there+is+any+moral+work+commanded+to+be+done%2C+either+for+eschewing+of+punishment%2C+or+upon+promise+of+any+reward%2C+temporal+or+eternal%3B+or+else+when+any+promise+is+made%2C+with+the+condition+of+any+work+to+be+done%2C+which+is+commanded+in+the+law%2C+there+is+to+be+understood+the+voice+of+the+law.+Contrariwise%2C+where+the+promise+of+life+and+salvation+is+offered+unto+us+freely%2C+without+any+condition+of+any+law%2C+either+natural%2C+ceremonial%2C+or+moral%2C+or+any+work+done+by+us%2C+all+those+places%2C+whether+we+read+them+in+the+Old+Testament%2C+or+in+the+New%2C+are+to+be+referred+to+the+voice+and+doctrine+of+the+gospel%3B+yea%2C+and+all+those+promises+of+Christ+coming+in+the+flesh%2C+which+we+read+in+the+Old+Testament%2C+yea%2C+and+all+those+promises+in+the+New+Testament%2C+which+offer+Christ+upon+condition+of+our+believing+on+his+name%2C+are+properly+called+the+voice+of+the+gospel%2C+because+they+have+no+condition+of+our+mortifying+annexed+unto+them%2C+but+only+faith+to+apprehend+and+receive+Jesus+Christ%3B+as+it+is+written%2C+%28Rom.+3%3A22%2C%29+%E2%80%9CFor+the+righteousness+of+God%2C+which+is+by+faith+of+Jesus+Christ+unto+all%2C+and+upon+all+that+believe%2C%E2%80%9D+%26c.+Briefly%2C+then%2C+if+we+would+know+when+the+law+speaks%2C+and+when+the+gospel+speaks%2C+either+in+reading+the+word%2C+or+in+hearing+it+preached%3B+and+if+we+would+skilfully+distinguish+the+voice+of+the+one+from+the+voice+of+the+other%2C+we+must+consider%2C+Law.+The+law+says%2C+%E2%80%9CThou+art+a+sinner%2C+and+therefore+thou+shalt+be+damned%3B%E2%80%9D+Rom.+7%3A2%3B+2+Thess.+2%3A12.+Gos.+But+the+gospel+says%2C+No%3B+%E2%80%9CChrist+Jesus+came+into+the+world+to+save+sinners%3B%E2%80%9D+and+therefore+%E2%80%9Cbelieve+on+the+Lord+Jesus+Christ%2C+and+thou+shalt+be+saved%2C%E2%80%9D+1+Tim.+1%3A15%3B+Acts+16%3A31.+Law.+Again+the+law+says%2C+%E2%80%9CKnowest+thou+not+that+the+unrighteous+shall+not+inherit+the+kingdom+of+God%3B+be+not+deceived%2C%E2%80%9D+%26c.+1+Cor.+6%3A9.+And+therefore+thou+being+a+sinner%2C+and+not+righteous%2C+shall+not+inherit+the+kingdom+of+God.+Gos.+But+the+gospel+says%2C+%E2%80%9CGod+has+made+Christ+to+be+sin+for+thee%2C+who+knew+no+sin%3B+that+thou+mightest+be+made+the+righteousness+of+God+in+him%2C+who+is+the+Lord+thy+righteousness%2C%E2%80%9D+Jer.+23%3A6.+Law.+Again+the+law+says%2C+%E2%80%9CPay+me+that+thou+owest+me%2C+or+else+I+will+cast+thee+into+prison%2C%E2%80%9D+Matt.+18%3A28%2C+30.+Gos.+But+the+gospel+says%2C+%E2%80%9CChrist+gave+himself+a+ransom+for+thee%2C%E2%80%9D+1+Tim.+2%3A6%3B+%E2%80%9Cand+so+is+made+redemption+unto+thee%2C%E2%80%9D+1+Cor.+1%3A30.+Law.+Again+the+law+says%2C+%E2%80%9CThou+hast+not+continued+in+all+that+I+require+of+thee%2C+and+therefore+thou+art+accursed%2C%E2%80%9D+Deut.+27%3A6.+Gos.+But+the+gospel+says%2C+%E2%80%9CChrist+hath+redeemed+thee+from+the+curse+of+the+law%2C+being+made+a+curse+for+thee%2C%E2%80%9D+Gal.+3%3A13.+Law.+Again+the+law+says%2C+%E2%80%9CThou+art+become+guilty+before+God%2C+and+therefore+shalt+not+escape+the+judgment+of+God%2C%E2%80%9D+Rom.+3%3A29%3B+2%3A3.+Gos.+But+the+gospel+says%2C+%E2%80%9CThe+Father+judgeth+no+man%2C+but+hath+committed+all+judgment+to+the+Son%2C%E2%80%9D+John+5%3A12.+And+now%2C+knowing+rightly+how+to+distinguish+between+the+law+and+the+gospel%2C+we+must%2C+in+the+fifth+place%2C+take+heed+that+we+break+not+the+orders+between+these+two+in+applying+the+law+where+the+gospel+is+to+be+applied%2C+either+to+ourselves+or+to+others%3B+for+albeit+the+law+and+gospel%2C+in+order+of+doctrine%2C+are+many+times+to+be+joined+together%2C+yet%2C+in+the+case+of+justification%2C+the+law+must+be+utterly+separated+from+the+gospel.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+An+Explication+of+the+Assembly%E2%80%99s+Shorter+Catechism%2C+ed.+Samuel+M%E2%80%98Millan+%28Aberdeen%3A+George+and+Robert+King%2C+1850%29%2C+7.459%E2%80%9362.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc42ee3be7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c42ee3be7d.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/07/thomas-boston-how-and-why-to-distinguish-between-law-and-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The covenant of grace partakes both of a testament and of a covenant. Hence it is not improperly called “a covenant by a testament,” “a testamentary covenant” and a “federal testament.” It is a covenant because after the manner of a covenant there was an agreement between parties and conditions were laid down on both sides, both on the part of God and on the part of man, and there was a mediator to reconcile the discordant parties. But it is also a “testament” (1) because it is a covenant in which an inheritance is promised (which necessarily demands the antecedent death of the testator, since he only then is reckoned an heir who obtains the goods by an intervention of the will of the disposer). Since therefore the covenant (diathēkē) is a promise (epangelia) of this kind (in virtue of which the inheritance is discerned), it must necessarily be testamentary. On this account, the apostle adds, “For where a diathēkē is [to wit, by which an inheritance is promised, i.e., a testament], there must also of necessity be the death of the testator.” (2) Because for our advantage only was this covenant made, as in a testament the advantage not of the testator but of the heirs is regarded; nor is God reconciled concerning mutual benefits, but concerning his own alone. (3) Because although conditions are set forth on both sides, they are entrusted for execution to the virtue and fidelity of only one party (namely, of God). Hence it is founded upon the mere grace of God and upon no disposition and merit of man (as will be fully proved in the proper place).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The covenant of grace partakes both of a testament and of a covenant. Hence it is not improperly called “a covenant by a testament,” “a testamentary covenant” and a “federal testament.” It is a covenant because after the manner of a covenant there was an agreement between parties and conditions were laid down on both sides, both on the part of God and on the part of man, and there was a mediator to reconcile the discordant parties. But it is also a “testament” (1) because it is a covenant in which an inheritance is promised (which necessarily demands the antecedent death of the testator, since he only then is reckoned an heir who obtains the goods by an intervention of the will of the disposer). Since therefore the covenant (diathēkē) is a promise (epangelia) of this kind (in virtue of which the inheritance is discerned), it must necessarily be testamentary. On this account, the apostle adds, “For where a diathēkē is [to wit, by which an inheritance is promised, i.e., a testament], there must also of necessity be the death of the testator.” (2) Because for our advantage only was this covenant made, as in a testament the advantage not of the testator but of the heirs is regarded; nor is God reconciled concerning mutual benefits, but concerning his own alone. (3) Because although conditions are set forth on both sides, they are entrusted for execution to the virtue and fidelity of only one party (namely, of God). Hence it is founded upon the mere grace of God and upon no disposition and merit of man (as will be fully proved in the proper place).”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 12.1.3.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+covenant+of+grace+partakes+both+of+a+testament+and+of+a+covenant.+Hence+it+is+not+improperly+called+%E2%80%9Ca+covenant+by+a+testament%2C%E2%80%9D+%E2%80%9Ca+testamentary+covenant%E2%80%9D+and+a+%E2%80%9Cfederal+testament.%E2%80%9D+It+is+a+covenant+because+after+the+manner+of+a+covenant+there+was+an+agreement+between+parties+and+conditions+were+laid+down+on+both+sides%2C+both+on+the+part+of+God+and+on+the+part+of+man%2C+and+there+was+a+mediator+to+reconcile+the+discordant+parties.+But+it+is+also+a+%E2%80%9Ctestament%E2%80%9D+%281%29+because+it+is+a+covenant+in+which+an+inheritance+is+promised+%28which+necessarily+demands+the+antecedent+death+of+the+testator%2C+since+he+only+then+is+reckoned+an+heir+who+obtains+the+goods+by+an+intervention+of+the+will+of+the+disposer%29.+Since+therefore+the+covenant+%28diath%C4%93k%C4%93%29+is+a+promise+%28epangelia%29+of+this+kind+%28in+virtue+of+which+the+inheritance+is+discerned%29%2C+it+must+necessarily+be+testamentary.+On+this+account%2C+the+apostle+adds%2C+%E2%80%9CFor+where+a+diath%C4%93k%C4%93+is+%5Bto+wit%2C+by+which+an+inheritance+is+promised%2C+i.e.%2C+a+testament%5D%2C+there+must+also+of+necessity+be+the+death+of+the+testator.%E2%80%9D+%282%29+Because+for+our+advantage+only+was+this+covenant+made%2C+as+in+a+testament+the+advantage+not+of+the+testator+but+of+the+heirs+is+regarded%3B+nor+is+God+reconciled+concerning+mutual+benefits%2C+but+concerning+his+own+alone.+%283%29+Because+although+conditions+are+set+forth+on+both+sides%2C+they+are+entrusted+for+execution+to+the+virtue+and+fidelity+of+only+one+party+%28namely%2C+of+God%29.+Hence+it+is+founded+upon+the+mere+grace+of+God+and+upon+no+disposition+and+merit+of+man+%28as+will+be+fully+proved+in+the+proper+place%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+12.1.3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a21d7ce66.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a21d7ce66.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/05/turretin-on-covenant-and-testament/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The nature and use of the law (which goes before the covenant of grace) having been unfolded, we must now treat of the covenant itself. Since it is of the greatest importance in theology (being as it were the center and bond of all religion, consisting in the communion of God with man and embracing in its compass all the benefits of God towards man and his duties towards God), our highest interest lies in rightly knowing and observing it. Hence the discussion of it demands peculiar accuracy (akribeian), that the truth may be confirmed against the errors by which Satan has endeavored in almost every age to obscure and corrupt this saving doctrine.</p></blockquote>

</figure><figure class="quote" id="q-ce0d0714fd" data-kw="">
<blockquote><p>God having thus entered into covenant with our Surety Christ Jesus, was pleased also to enter into covenant with us in him. Now this covenant we define to be, a free and gratuitous agreement between an offended God and offending man, in which God promises to man pardon and salvation through the merits and satisfaction of Christ, and man on his part promises faith and obedience. The only author of this covenant is God, who alone could raise fallen man, and make a new covenant in the place of the old. God is here considered as offended, but at the same time as a merciful Father, capable of being propitiated, and willing to be reconciled to offending man. Man, with whom the covenant is entered into, is considered as a sinful creature, but conscious of his guilt and misery. The Mediator of the covenant is Christ. In this covenant God promises that he will be our God, which promise includes both our reconciliation and communion with him, and also the communication of those good things which are necessary for us, particularly holiness, life, and immortality Again, God requires from us that we should be his people, namely, he requires of us faith, repentance, worship, and obedience, all which he produces in us by his Spirit. The seals of this covenant are the sacraments. It is called the new covenant, because the old is abolished and the covenant of grace, because man in no way whatever could merit it, but God of his mere mercy entered into it with man; and also to distinguish it from the first covenant, which is called the covenant of works, which was entered into with Adam, and renewed on Mount Sinai. These two covenants indeed agree with each other in various particulars:—of both, God is the author; in both there are the same contracting parties; in both is promised eternal life and happiness: but they differ also in many respects; in the covenant of works God is considered as Creator and Lord, in the covenant of grace as Redeemer and Father; in the first there were was no mediator, in the second Christ is the Mediator; in the one God dealt with man as upright, in the other he deals with man as a sinner; the former depended on man’s own obedience, the latter depends on the obedience of Christ; in the former was promised life, namely, a state consisting of all good things; in the latter is promised salvation, which, along with life, includes also deliverance from sin and death; in the first God required works, saying, Do this and live; in the second he requires faith, saying, Believe, and thou shall be saved. The covenant of grace does indeed require works of righteousness, but not that we may merit eternal life by them; nor does the imperfection of Christian obedience, provided it be sincere, stand in the way of our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 281–82.</cite></span></figcaption>

</figure><figure class="quote" id="q-771cc66c44" data-kw="">
<blockquote><p>As for that which they tax the ministers, to be ministers of the dead letter, one may plainly see the Lord’s taking vengeance upon the outrage offered unto his holy Word; smiting them with the spirit of giddiness, for having despised the true and only means of coming unto God, which is the Scripture and the Word of God. In the passage of the Corinthians where Paul says, “The letter kills, and the Spirit quickens;” let any closely consider, against whom the Apostle disputes, and they will understand his drift. It is very evident that Paul in this place, had to do with false Apostles, who preached and extolled the Law without Christ, and caused the people to recoil from salvation purchased by Christ, and the grace of the new covenant, whereunto the Lord had promised to write his Law in the heart of the faithful: the Law then being separated from Christ, as a body without a soul; and nothing comes from it but death, to those that are under it: it does nothing but beat and strike the ears, without quickening the soul, until by faith we are sent from it unto Christ, as from the usher to the master; and then the Law will be found such as David sings it, “The Law of the Lord is perfect, converting the soul; the testimony of the Lord is faithful, making Wise the simple: the commandments of the Lord are right, rejoicing the heart, etc.” Thus must we understand how it is said, “The Letter kills:” Paul called the Law, The killing Letter, and says, The Spirit quickens, i.e., The Ministry of the Gospel, which he opposes unto the naked Law; and he himself calls his preaching “The Ministry of the Spirit.</p></blockquote>

<blockquote><p>5. In the same light are we to consider the law of the Decalogue, delivered by God to His peculiar people, the Jews, by the hands of Moses. For though it reveals the greatness of sin,1 and more and more convinces man thereof, yet, as it neither points out a remedy nor imparts strength to extricate him from his misery,2 but, being weak through the flesh,3 leaves the transgressor under the curse,4 and man cannot by this law obtain saving grace. 6.What, therefore, neither the light of nature nor the law could do, that God performs by the operation of the Holy Spirit1 through the word or ministry of reconciliation;2 which is the gospel concerning the Messiah, by means whereof it has pleased God to save such as believe,3 as well under the Old as under the New Testament.</p></blockquote>

<blockquote><p>Touching the subject or persons to whom it is appropriate, faith is the proper and peculiar gift of God’s elect, which only [alone] distinguishes them from the rest of the world; for all other graces, be they never so bright, or shining, are common with the reprobate; but faith, with the fruits thereof, is proper to the godly. Whereupon, (Tit. 1:1) it is called, The “faith of God’s elect”: for only they, and of them all and every one, are in their time, by virtue of God’s covenant, brought to believe (John 6:37). “Every one that the Father gives me, comes to me.” Else, in what better case are we now, then when the covenant of works did hold us, seeing it is as impossible of our selves, and by our own strength, to repent, and believe the gospel, (which is the condition of the covenant of grace) as it was to fulfill the law? Wherefore we must understand, that God, to speak properly, does not require the same, as a mutual re-stipulation of our part, as it was in the former covenant, where nothing is imposed which man’s nature could not wield: but here it is rather a declaration of his pleasure, what he would have us do, and whereunto he will enable us: not a condition to endanger the covenant, but an assurance that he will give us strength to keep it. So as the whole covenant properly and in truth rises of his part, and lies upon him: like his other covenant (brought to confirm this) with the sun and moon, and stars, whom (otherwise unable of themselves) he makes to run their course. But howsoever, all come from his only grace and virtue, yet to us that are not stocks and stones, but endued with a reasonable soul, understanding, will, and other faculties, this covenant is wont to be expressed, sometimes by words conditional, sometimes in commanding wise; that the greatness of the peril, and the difficulty of the precept might make us to bestir ourselves, to use with care and conscience the mean that he appoints, for the attaining of that precious gift, and to work together with God, when we are once wrought upon by his Spirit. And herein lies one other main difference between the law and the gospel, or the covenant of works, and this covenant of grace: The law only commands obedience, but gives no power to obey; and therefore is called, “the dead letter,” “written with ink,” and “in tables of stone,” ready indeed to be read and seen, but having no life in it to change the heart, which remains as stony as before. The Gospel not only commands, but gives faith and newness of life; and is therefore said to be written in our hearts, and called The ministration of the Spirit, because it gives the Spirit of Christ, and righteousness through him. The law therefore, pronouncing nothing but judgement and condemnation against us, as that which commands things impossible, by reason of our weakness, terrifies and amazes the conscience: In which respect it is called, “the ministry of death and condemnation.” Contrariwise, the gospel bringing glad tidings of peace and reconciliation, quiets and appeases the conscience (Rom. 5:1) “Being justified by faith, we have peace with God, through Jesus Christ our Lord.” Both parts of this difference are found (Rom. 10:5, 6, 7, 8). For Moses thus describes the righteousness which is of the law, that the man which does these things, shall live thereby. But the righteousness which is of faith, speaks on this wise, “Say not in your heart, ‘who shall ascend into heaven?’ That is to bring Christ from above. Or, ‘Who shall descend into the deep?’ That is, to bring Christ again from the dead. But what says it? The word is near you, even in your mouth and in your heart. This is the Word of Faith which we preach.</p></blockquote>

</figure><figure class="quote" id="q-f48732e9d1" data-kw="">
<blockquote><p>A learned man of late, out of hatred unto the Spirit of prayer, or prayer as his gift, hath endeavoured to deprive the church of God of the whole benefit and comfort of this promise (Amyrald. Præfat. in Psal.) for he contends that it belongs not unto the Christian church, but unto the Jews only. Had he said it belonged unto the Jews in the first place who should be converted unto Christ, he had not gone so wide from the truth nor from the sense of other expositors, though he had said more than he could prove. But to suppose that any grace, any mercy, any privilege by Jesus Christ, is promised unto the Jews, wherein Gentile believers shall be no sharers, that they should not partake of the same kind, whoever hath the prerogative as to degrees, is fond and impious; for if they also are children of Abraham, if the blessing of faithful Abraham do come upon them also, if it is through them that he is the heir of the world, his spiritual seed inhabiting it by right in all places, then unto them do all the promises belong that are made unto him and his seed. And whereas most of the “exceeding great and precious promises” of the Old Testament are made to Jacob and Israel, to Jerusalem and Zion, it is but saying that they are all confined unto the Jews, and so at once to despoil the church of God of all right and title to them; which impious folly and sacrilege hath been by some attempted. But whereas all the promises belong unto the same covenant, with all the grace contained in them and exhibited by them, whoever is interested by faith in that covenant is so in all the promises of God that belong thereunto, and hath an equal right unto them with those unto whom they were first given. To suppose, now that the Jews are rejected for their unbelief, that the promises of God made unto them whilst they stood by faith are ceased and of no use, is to overthrow the covenant of Abraham, and, indeed, the whole truth of the New Testament.</p></blockquote>

<blockquote><p>There be some which divide the holy Scriptures into four parts, and describe some books as well of the Old Testament as of the New to laws, some to histories, some to prophecies, and other some again to wisdom. But it is not meet to divide the books of the holy Scriptures from one another, because that in the books of Exodus, Leviticus, Numbers, and Deuteronomy, in which they appoint laws to be contained, are found almost as many histories as laws. Besides that in the books which they assign to prophets, laws of living uprightly are sometimes written and clearly expounded. Neither can we properly separate the books of Solomon and other of the kind (which they will have proper to wisdom) from laws and prophecies. For there are in them sentences here and there written, which serving for the instruction of life, have also without controversy the nature of laws. Further for the that in them are very many secrets opened unto the church by the inspiration of the Spirit of God, they pour undoubtedly into the attentive hearers, oracles of things to come, It may easily be granted, that all these things which they make mention of, are found in the holy books: I mean the precepts of living, notable histories, prophecies of things to come, and also most wise sentences and sayings: but in such […], that in manner in every book they are set forth unto us dispersedly, neither yet would I that these holy books should be divided from one another by these ends and limits. I would rather think as the learned […] do also judge, that whatsoever things are contained in the holy scriptures should be referred unto to principal heads, the law I mean and the gospel. For everywhere are declared unto us either the precepts of God of upright living, as when we are reproved to have strayed from them by reason of weakness or else of malice, gospel is lay forth before us, wherein by Christ that thing wherein we have offended is pardoned and the strength and power of the Holy Spirit promises us, to restore us again to the image of God, which we had lost.</p></blockquote>

<blockquote><p>For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.’ If it was ‘by Promise,’ then it was ‘by faith,’ for faith only receives the Promise; if it was by the Law, then it was by works, for works only fulfil the Law. True, the Law was afterwards added to the Promise, but not to disannul or to supersede it; on the contrary, it was itself a dispensation of the covenant of grace, for it was proclaimed in the name of the ‘God of Abraham, and Isaac, and Jacob;’ and if it republished in all their rigour the original terms of the covenant of works, it was only ‘because of transgressions, till the seed should come to whom the Promise was made.’ It was for conviction of sin, for ‘the Law worketh wrath,’ and is a ‘ministration of death;’ but, as such, it was ‘our schoolmaster to bring us unto Christ, that we might be justified by faith.’</p></blockquote>

<blockquote><p>Ver. 24. Which things are a typical history; for these two women represent the two covenants, with the churches thereto adhering respectively; the one from Mount Sinai, to wit, the covenant of works, which was given there, and where the Jewish synagogue, under that covenant, had its beginning: this bringeth forth children indeed, but such children as are mere mercenary worshippers, and under the bondage of that covenant, its curses and commands; and this is that represented by Agar the bondwoman, and that very conveniently. Ver. 25. (Gr. To gar Agar, Sina oros estin en te Arabia, &amp;c.), For as to that allegorical Agar, the mountain Sinai is in Arabia, where lived Agar and her son; and the same Sinai answers well to the earthly Jerusalem, the now Jewish synagogue, nothing being heard from either of them, but Do and Live: but Sinai still but serves with the legalists her children, Sinai and her covenant, because it was never designed but to be subservient to the covenant of grace, as Hagar to Sarah; her children, the legalists, following the state of the venter i. e. the womb from whence they came, are but in the state of bond-servants; not in the state of sons and heirs, more than Ishmael had Isaac’s privilege. “26 But Jerusalem which is above, is free, which is the mother of us all. 27 For it is written, Rejoice thou barren, that bearest not; break forth and cry, thou that travailest not: for the desolate hath many more children than she which hath an husband.” Ver. 26. But the other covenant, the covenant of grace, with the church adhering thereto, to wit, the church of believers in Christ, which is the heavenly Jerusalem, enjoying the reality of all the typical external privileges which the earthly Jerusalem had, which covenant and church is the mother of us all, Jews or Gentiles, that believe in Christ, even she is free: the covenant is served, but serves not as Sarah; the church is mistress of the family, being Christ’s spouse; and her children sons and heirs, as Sarah and her Isaac. Ver. 27. I say, the Christian church is that free mother of us all; for Isaiah in his 54th chap. ver. 1. with an eye to that typical history of Hagar and Sarah, in Abraham’s family, after he had spoke of the sufferings of Christ, immediately addressseth himself to her, as she was in her very first days before the preaching of the gospel by the apostles, saying, Rejoice thou that, as Sarah, art yet barren, thy children making no figure in comparison of the synagogue, break forth over all thy discouragements, and cry for joy, though thou travailest not yet to bring forth children, as thou shalt do ere long by the preaching of the apostles, after the effusion of the Holy Ghost on them: for though thou seem desolate as a widow, thy husband being yet in his state of humiliation, and so very little known, thou shalt have many more children, even such as shall join themselves to thee as members, than the Jewish synagogue, which only seems to have God for her husband. This shall be as sure to thee as if thou hadst all these children about thy hand already. “28 Now we, brethren, as Isaac was, are the children of promise.” Ver. 28. Now, brethren, to apply the whole unto us, ye see, we who adhere to the covenant of grace are such children as Isaac, even children of promise; born unto God by virtue of the absolute promise; not by the strength of nature or by our own works. “29 But as then be that was born after the flesh persecuted him that was born after the Spirit, even so it is now. “30 Nevertheless, what saith the scripture? Cast out the bond-woman and her son: for the son of the bond-woman shall not be heir with the son of the free-woman.” Ver. 29. But as then Ishmael persecuted Isaac, so now the legalists, children of the covenant of works, persecute the children of the covenant of grace. Ver. 30. Nevertheless, what saith the scripture? even, Cast out Hagar and Ishmael, for he shall not be heir with Isaac. The same sentence is passed against the Jewish synagogue, and all that adhere to the covenant of works; they shall be rejected and cast out of the society of saints, for they shall never partake of the heavenly inheritance with those that believe in Christ. “31 So then, brethren, we are not children of the bond-woman, but of the free.” Ver. 31. Therefore, seeing we are children of promise, as Isaac, we are not under the legal covenant, but the covenant of grace, and so are free; and therefore have nothing to do with the law.</p></blockquote>

<blockquote><p>And surely no Context of Holy Scripture can be solidly explicated, No Common Place of Divinity can be rightly handled, No Polemical or Controversal point can be dextrously descided, No Case of Conscience or Practical Question can be accurately resolved, No Christian Duty can be skilfully urged or advised, without due respect and Scope had to the COVENANT of GOD…. And so should every faithful and skilful Minister have it principally in Design, To be a Preacher of Gods Covenant; and every prudent Christian to be an Hearer and Practitioner of Gods Covenant: Gods Covenant Calling for most intentive respect from them both. So that whilst we are ignorant of the mysteries of Gods Covenant; we are Ignorant of Scriptures, of Christ, and of all Gods gracious Administrations to his Church.</p></blockquote>

<blockquote><p>Man, after the fall, abides under the covenant of works; and to this day, life is promised him under condition of works done by strength and nature. But if he will not do so well, death and the everlasting curse of God is denounced against him, so long as he is without Christ and without the gospel. And being freed from the covenant of works…he is admitted to the covenant of grace…. Christ, therefore, our Mediator, subjected himself to the covenant of works, and unto the law for our sake, and did both fulfill the condition of the covenant of works in his holy and good life…and also did undergo that curse with which man was threatened in the covenant of works, if that condition of good and holy works were not kept…Wherefore we see Christ in two respects, to wit, in doing and suffering, subject to the covenant of works, and in both respects he has most perfectly fulfilled it, and that for our sake whose Mediator he is become.</p></blockquote>

<blockquote><p>XV. In Scripture, we find two covenants of God with man: the Covenant of Works, otherwise called, the Covenant of Nature, or the Legal and the Covenant of Grace. The apostle teacheth us this distinction, Rom. 3:27, where he mentions the law of works, and the law of faith by the law of works, understanding that doctrine which points out the way in which, by means of works, salvation is obtained; and by the law of faith, that doctrine which directs by faith to obtain salvation. The form of the covenant of works is, “The man that doth these things shall live by them,” Rom. 10:5. That of the covenant of grace is, “Whosoever believeth in him shall not be ashamed,” Rom. 10:11. These covenants of mercy agree, 1st. That, in both, the contracting parties are the same, God and man. 2dly. In both, the same promise of eternal life, consisting in the immediate fruition of God. 3dly. The condition of both is the same, viz., perfect obedience to the law. Nor would it have been worthy of God to admit man to a blessed communication with him, but in the way of unspotted holiness. 4thly. In both, the same end, the glory of the most unspotted goodness of God. But in these following particulars they differ: 1st. The character or relation of God and man, in the covenant of works, is different from what it is in the covenant of grace. In the former, God treats as the Supreme Lawgiver, and the Chief Good, rejoicing to make his innocent creature a partaker of his happiness. In the latter, as infinitely merciful, adjudging life to the elect sinner consistently with his wisdom and justice. 2dly. In the covenant of works there was no mediator. In that of grace, there is the mediator, Christ Jesus. 3dly. In the covenant of works, the condition of perfect obedience was required to be performed by man himself, who had consented to it. In that of grace, the same condition is proposed, as to be, or as already performed, by a mediator. And in this substitution of the person consists the principal and essential difference of the covenants. 4thly. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore, man’s glorying is not excluded, but he may glory, as a faithful servant may do, upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man, in himself ungodly, is considered in the covenant as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. 5thly. In the covenant of works, something is required of man, as a condition which, performed, entitles him to the reward. The covenant of grace, with respect to us, consists of the absolute promises of God, in which the mediator, the life to be obtained by him, the faith by which we may be made partakers of him, the benefits purchased by him, and the perseverance in that faith, in a word, the whole of salvation, and all the requisites to it, are absolutely promised. 6thly. The special end of the covenant of works was, the manifestation of the holiness, goodness, and justice of God, conspicuous in the most perfect law, most liberal promise, and in that recompense of reward, to be given to those who seek him with their whole heart. The special end of the covenant of grace is, “the praise of the glory of his grace,” Eph. 1:6, and the revelation of his unsearchable and manifold wisdom: which divine perfections shine forth with lustre in the gift of a mediator, by whom the sinner is admitted to complete salvation, without any dishonour to the holiness, justice, and truth of God. There is also a demonstration of the all-sufficiency of God, by which not only man, but even a sinner, which is more surprising, may be restored to union and communion with God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XV. In Scripture, we find two covenants of God with man: the Covenant of Works, otherwise called, the Covenant of Nature, or the Legal and the Covenant of Grace. The apostle teacheth us this distinction, Rom. 3:27, where he mentions the law of works, and the law of faith by the law of works, understanding that doctrine which points out the way in which, by means of works, salvation is obtained; and by the law of faith, that doctrine which directs by faith to obtain salvation. The form of the covenant of works is, “The man that doth these things shall live by them,” Rom. 10:5. That of the covenant of grace is, “Whosoever believeth in him shall not be ashamed,” Rom. 10:11. These covenants of mercy agree, 1st. That, in both, the contracting parties are the same, God and man. 2dly. In both, the same promise of eternal life, consisting in the immediate fruition of God. 3dly. The condition of both is the same, viz., perfect obedience to the law. Nor would it have been worthy of God to admit man to a blessed communication with him, but in the way of unspotted holiness. 4thly. In both, the same end, the glory of the most unspotted goodness of God. But in these following particulars they differ: 1st. The character or relation of God and man, in the covenant of works, is different from what it is in the covenant of grace. In the former, God treats as the Supreme Lawgiver, and the Chief Good, rejoicing to make his innocent creature a partaker of his happiness. In the latter, as infinitely merciful, adjudging life to the elect sinner consistently with his wisdom and justice. 2dly. In the covenant of works there was no mediator. In that of grace, there is the mediator, Christ Jesus. 3dly. In the covenant of works, the condition of perfect obedience was required to be performed by man himself, who had consented to it. In that of grace, the same condition is proposed, as to be, or as already performed, by a mediator. And in this substitution of the person consists the principal and essential difference of the covenants. 4thly. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore, man’s glorying is not excluded, but he may glory, as a faithful servant may do, upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man, in himself ungodly, is considered in the covenant as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. 5thly. In the covenant of works, something is required of man, as a condition which, performed, entitles him to the reward. The covenant of grace, with respect to us, consists of the absolute promises of God, in which the mediator, the life to be obtained by him, the faith by which we may be made partakers of him, the benefits purchased by him, and the perseverance in that faith, in a word, the whole of salvation, and all the requisites to it, are absolutely promised. 6thly. The special end of the covenant of works was, the manifestation of the holiness, goodness, and justice of God, conspicuous in the most perfect law, most liberal promise, and in that recompense of reward, to be given to those who seek him with their whole heart. The special end of the covenant of grace is, “the praise of the glory of his grace,” Eph. 1:6, and the revelation of his unsearchable and manifold wisdom: which divine perfections shine forth with lustre in the gift of a mediator, by whom the sinner is admitted to complete salvation, without any dishonour to the holiness, justice, and truth of God. There is also a demonstration of the all-sufficiency of God, by which not only man, but even a sinner, which is more surprising, may be restored to union and communion with God.”

— Herman Witsius, The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), 26–27.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXV.+In+Scripture%2C+we+find+two+covenants+of+God+with+man%3A+the+Covenant+of+Works%2C+otherwise+called%2C+the+Covenant+of+Nature%2C+or+the+Legal+and+the+Covenant+of+Grace.+The+apostle+teacheth+us+this+distinction%2C+Rom.+3%3A27%2C+where+he+mentions+the+law+of+works%2C+and+the+law+of+faith+by+the+law+of+works%2C+understanding+that+doctrine+which+points+out+the+way+in+which%2C+by+means+of+works%2C+salvation+is+obtained%3B+and+by+the+law+of+faith%2C+that+doctrine+which+directs+by+faith+to+obtain+salvation.+The+form+of+the+covenant+of+works+is%2C+%E2%80%9CThe+man+that+doth+these+things+shall+live+by+them%2C%E2%80%9D+Rom.+10%3A5.+That+of+the+covenant+of+grace+is%2C+%E2%80%9CWhosoever+believeth+in+him+shall+not+be+ashamed%2C%E2%80%9D+Rom.+10%3A11.+These+covenants+of+mercy+agree%2C+1st.+That%2C+in+both%2C+the+contracting+parties+are+the+same%2C+God+and+man.+2dly.+In+both%2C+the+same+promise+of+eternal+life%2C+consisting+in+the+immediate+fruition+of+God.+3dly.+The+condition+of+both+is+the+same%2C+viz.%2C+perfect+obedience+to+the+law.+Nor+would+it+have+been+worthy+of+God+to+admit+man+to+a+blessed+communication+with+him%2C+but+in+the+way+of+unspotted+holiness.+4thly.+In+both%2C+the+same+end%2C+the+glory+of+the+most+unspotted+goodness+of+God.+But+in+these+following+particulars+they+differ%3A+1st.+The+character+or+relation+of+God+and+man%2C+in+the+covenant+of+works%2C+is+different+from+what+it+is+in+the+covenant+of+grace.+In+the+former%2C+God+treats+as+the+Supreme+Lawgiver%2C+and+the+Chief+Good%2C+rejoicing+to+make+his+innocent+creature+a+partaker+of+his+happiness.+In+the+latter%2C+as+infinitely+merciful%2C+adjudging+life+to+the+elect+sinner+consistently+with+his+wisdom+and+justice.+2dly.+In+the+covenant+of+works+there+was+no+mediator.+In+that+of+grace%2C+there+is+the+mediator%2C+Christ+Jesus.+3dly.+In+the+covenant+of+works%2C+the+condition+of+perfect+obedience+was+required+to+be+performed+by+man+himself%2C+who+had+consented+to+it.+In+that+of+grace%2C+the+same+condition+is+proposed%2C+as+to+be%2C+or+as+already+performed%2C+by+a+mediator.+And+in+this+substitution+of+the+person+consists+the+principal+and+essential+difference+of+the+covenants.+4thly.+In+the+covenant+of+works%2C+man+is+considered+as+working%2C+and+the+reward+to+be+given+as+of+debt%3B+and+therefore%2C+man%E2%80%99s+glorying+is+not+excluded%2C+but+he+may+glory%2C+as+a+faithful+servant+may+do%2C+upon+the+right+discharge+of+his+duty%2C+and+may+claim+the+reward+promised+to+his+working.+In+the+covenant+of+grace%2C+man%2C+in+himself+ungodly%2C+is+considered+in+the+covenant+as+believing%3B+and+eternal+life+is+considered+as+the+merit+of+the+mediator%2C+and+as+given+to+man+out+of+free+grace%2C+which+excludes+all+boasting%2C+besides+the+glorying+of+the+believing+sinner+in+God%2C+as+his+merciful+Saviour.+5thly.+In+the+covenant+of+works%2C+something+is+required+of+man%2C+as+a+condition+which%2C+performed%2C+entitles+him+to+the+reward.+The+covenant+of+grace%2C+with+respect+to+us%2C+consists+of+the+absolute+promises+of+God%2C+in+which+the+mediator%2C+the+life+to+be+obtained+by+him%2C+the+faith+by+which+we+may+be+made+partakers+of+him%2C+the+benefits+purchased+by+him%2C+and+the+perseverance+in+that+faith%2C+in+a+word%2C+the+whole+of+salvation%2C+and+all+the+requisites+to+it%2C+are+absolutely+promised.+6thly.+The+special+end+of+the+covenant+of+works+was%2C+the+manifestation+of+the+holiness%2C+goodness%2C+and+justice+of+God%2C+conspicuous+in+the+most+perfect+law%2C+most+liberal+promise%2C+and+in+that+recompense+of+reward%2C+to+be+given+to+those+who+seek+him+with+their+whole+heart.+The+special+end+of+the+covenant+of+grace+is%2C+%E2%80%9Cthe+praise+of+the+glory+of+his+grace%2C%E2%80%9D+Eph.+1%3A6%2C+and+the+revelation+of+his+unsearchable+and+manifold+wisdom%3A+which+divine+perfections+shine+forth+with+lustre+in+the+gift+of+a+mediator%2C+by+whom+the+sinner+is+admitted+to+complete+salvation%2C+without+any+dishonour+to+the+holiness%2C+justice%2C+and+truth+of+God.+There+is+also+a+demonstration+of+the+all-sufficiency+of+God%2C+by+which+not+only+man%2C+but+even+a+sinner%2C+which+is+more+surprising%2C+may+be+restored+to+union+and+communion+with+God.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+and+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+vol.+1+%28London%3A+T.+Tegg+%26+Son%2C+1837%29%2C+26%E2%80%9327.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff3d6c8f7ef.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f3d6c8f7ef.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/10/witsius-on-the-relations-between-the-covenants-works-and-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>DATHENUS: Just as this is very comforting, so it also is certain and true. For this is what Paul is teaching us with these similar words, namely, that “by the deeds of the law no flesh shall justified in his sight: for by the law is knowledge of sin” (Rom. 3:20). Also, “Nay, I had not know sin, but by the law: for I had not known lust except the law had said, Thou shalt not covet” (Rom. 7:7; Exod. 20:17). As summation, Paul points out that the law is our disciplinarian, or what which leads us to Christ, to be justified by faith. However, once we have come to faith, we are no longer under the disciplinarian guide. ELIZABETH: That is comforting and true. But accommodate yourself to my ignorance, and explain it to me even more. DATHENUS: I will gladly do that. You did understand what we discussed earlier about the blindness, alienation and depravity of the natural man, in which he is spiritually dead before God, did you not? ELIZABETH: I did hear you say that, but I did not understand it very well. DATHENUS: In spite of what the real state of man is before God, he likes to see himself as being pious, holy and righteous. This we can see by the example of the rich young ruler who boasted that he had kept all the commandments of God from his youth (Mat. 19:20). When the penitent woman who was a sinner touched Jesus, Simon the Pharisee regarded himself as if he were not likewise a sinner (Luke 18:11). ELIZABETH: Indeed, that is the case all too often with unbelievers. DATHENUS: Oh Elizabeth, God grant that it does not happen with those who think themselves to be the best of Christians, who see the splinter in another’s eye, but do not notice the beam in their own eye. ELIZABETH: But can this also happen with those who truly know God? DATHENUS: Alas, yes, far too often. I have to complain that I come across it many times, and I do not doubt that you sometimes have discovered it in yourself. Spiritual pride, self-love and self-centeredness have not died in the children of God. You can see this very plainly in the example of Loadicea, where the say themselves as rich and enriched and having lack of nothing. But the Lord testifies to the contrary, that they were poor, miserable, blind and naked (Rev. 3:17). ELIZABETH: That, indeed, is true. DATHENUS: Because we are so blinded by spiritual pride that we do not feel our miserable state, the law of God serves as an eye salve (Rev. 3:11), to clear up our dim vision, as a mirror (James 2:5), in which we can see and acknowledge how far we fall short. He does this in order that we will be displeased with ourselves (Ps. 19:13) and become ashamed like the poor publican who did not even dare to lift up his eyes to heaven, and say with him, “God be merciful to me a sinner” (Luke 18:13). ELIZABETH: I also need that eye salve and that mirror. DATHENUS: Not only you, dear Elizabeth, but also the holiest of people. Therefore also the more experienced of God’s elect see themselves mirrored faithfully when they have made a sincere confession (Ps. 19:13; 38:5; Job 13:23; 14:4; Isa. 38:17; 64:6; 1 John 1:9). The highest perfection of people, as long as they live on earth, lies in a sincere confession of imperfections. ELIZABETH: This cannot be denied, for who does not have to say and confess with David, “Who can understand his errors? Cleanse though me from secret faults” (Ps. 19:12). Please, also teach me something of the gospel which, as you taught me earlier, is the other part of God’s Word. I now pretty well understand what the law is about. DATHENUS: This I would wish you from the heart, but I fear that you still have quite deficiency in the knowledge of the law; but we can always make up that deficiency later. So not let us talk about the gospel. Tell me, Elizabeth, what definition would you give me of the gospel? ELIZABETH: All that Christ and His apostles have taught us and handed down to us in writing in the New Testament. DATHENUS: Here you are again making quite a big mistake. Have you forgotten so soon that which I point out earlier– that Christ and His apostles (Rom. 8:3) also proclaim and enforce the law? Don’t you remember that they exhort all people to keep the commandments of God, which we are not able to do (Acts 15:10)? ELIZABETH: Yes, that is true, but I had almost forgotten that. So please instruct me. What is the true gospel? DATHENUS: The Greek word for gospel denotes joyful good news which causes people to speak and sing joyfully and be glad in heart, just like the good news that came to Israel that David triumphed over the arrogant Goliath and slain him (1 Sam. 18:6). Such also is the good news of the gospel that proclaims to us and tells us that God will be gracious to a poor sinner, and will forgive and forget our sins (Jer. 31:34; Heb. 8:12). Yes, for Christ’s sake (1 Tim. 1:15) God will regard us as holy and righteous (2 Cor. 5:21), out of pure grace, by faith alone, without adding any works (1 Cor. 1:30; Rom. 3:28).</p></blockquote>

— Petrus Dathenus, The Pearl of Christian Comfort by Petrus Dathenus (HT: Jack Miller/Iustitia Aliena)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDATHENUS%3A+Just+as+this+is+very+comforting%2C+so+it+also+is+certain+and+true.+For+this+is+what+Paul+is+teaching+us+with+these+similar+words%2C+namely%2C+that+%E2%80%9Cby+the+deeds+of+the+law+no+flesh+shall+justified+in+his+sight%3A+for+by+the+law+is+knowledge+of+sin%E2%80%9D+%28Rom.+3%3A20%29.+Also%2C+%E2%80%9CNay%2C+I+had+not+know+sin%2C+but+by+the+law%3A+for+I+had+not+known+lust+except+the+law+had+said%2C+Thou+shalt+not+covet%E2%80%9D+%28Rom.+7%3A7%3B+Exod.+20%3A17%29.+As+summation%2C+Paul+points+out+that+the+law+is+our+disciplinarian%2C+or+what+which+leads+us+to+Christ%2C+to+be+justified+by+faith.+However%2C+once+we+have+come+to+faith%2C+we+are+no+longer+under+the+disciplinarian+guide.+ELIZABETH%3A+That+is+comforting+and+true.+But+accommodate+yourself+to+my+ignorance%2C+and+explain+it+to+me+even+more.+DATHENUS%3A+I+will+gladly+do+that.+You+did+understand+what+we+discussed+earlier+about+the+blindness%2C+alienation+and+depravity+of+the+natural+man%2C+in+which+he+is+spiritually+dead+before+God%2C+did+you+not%3F+ELIZABETH%3A+I+did+hear+you+say+that%2C+but+I+did+not+understand+it+very+well.+DATHENUS%3A+In+spite+of+what+the+real+state+of+man+is+before+God%2C+he+likes+to+see+himself+as+being+pious%2C+holy+and+righteous.+This+we+can+see+by+the+example+of+the+rich+young+ruler+who+boasted+that+he+had+kept+all+the+commandments+of+God+from+his+youth+%28Mat.+19%3A20%29.+When+the+penitent+woman+who+was+a+sinner+touched+Jesus%2C+Simon+the+Pharisee+regarded+himself+as+if+he+were+not+likewise+a+sinner+%28Luke+18%3A11%29.+ELIZABETH%3A+Indeed%2C+that+is+the+case+all+too+often+with+unbelievers.+DATHENUS%3A+Oh+Elizabeth%2C+God+grant+that+it+does+not+happen+with+those+who+think+themselves+to+be+the+best+of+Christians%2C+who+see+the+splinter+in+another%E2%80%99s+eye%2C+but+do+not+notice+the+beam+in+their+own+eye.+ELIZABETH%3A+But+can+this+also+happen+with+those+who+truly+know+God%3F+DATHENUS%3A+Alas%2C+yes%2C+far+too+often.+I+have+to+complain+that+I+come+across+it+many+times%2C+and+I+do+not+doubt+that+you+sometimes+have+discovered+it+in+yourself.+Spiritual+pride%2C+self-love+and+self-centeredness+have+not+died+in+the+children+of+God.+You+can+see+this+very+plainly+in+the+example+of+Loadicea%2C+where+the+say+themselves+as+rich+and+enriched+and+having+lack+of+nothing.+But+the+Lord+testifies+to+the+contrary%2C+that+they+were+poor%2C+miserable%2C+blind+and+naked+%28Rev.+3%3A17%29.+ELIZABETH%3A+That%2C+indeed%2C+is+true.+DATHENUS%3A+Because+we+are+so+blinded+by+spiritual+pride+that+we+do+not+feel+our+miserable+state%2C+the+law+of+God+serves+as+an+eye+salve+%28Rev.+3%3A11%29%2C+to+clear+up+our+dim+vision%2C+as+a+mirror+%28James+2%3A5%29%2C+in+which+we+can+see+and+acknowledge+how+far+we+fall+short.+He+does+this+in+order+that+we+will+be+displeased+with+ourselves+%28Ps.+19%3A13%29+and+become+ashamed+like+the+poor+publican+who+did+not+even+dare+to+lift+up+his+eyes+to+heaven%2C+and+say+with+him%2C+%E2%80%9CGod+be+merciful+to+me+a+sinner%E2%80%9D+%28Luke+18%3A13%29.+ELIZABETH%3A+I+also+need+that+eye+salve+and+that+mirror.+DATHENUS%3A+Not+only+you%2C+dear+Elizabeth%2C+but+also+the+holiest+of+people.+Therefore+also+the+more+experienced+of+God%E2%80%99s+elect+see+themselves+mirrored+faithfully+when+they+have+made+a+sincere+confession+%28Ps.+19%3A13%3B+38%3A5%3B+Job+13%3A23%3B+14%3A4%3B+Isa.+38%3A17%3B+64%3A6%3B+1+John+1%3A9%29.+The+highest+perfection+of+people%2C+as+long+as+they+live+on+earth%2C+lies+in+a+sincere+confession+of+imperfections.+ELIZABETH%3A+This+cannot+be+denied%2C+for+who+does+not+have+to+say+and+confess+with+David%2C+%E2%80%9CWho+can+understand+his+errors%3F+Cleanse+though+me+from+secret+faults%E2%80%9D+%28Ps.+19%3A12%29.+Please%2C+also+teach+me+something+of+the+gospel+which%2C+as+you+taught+me+earlier%2C+is+the+other+part+of+God%E2%80%99s+Word.+I+now+pretty+well+understand+what+the+law+is+about.+DATHENUS%3A+This+I+would+wish+you+from+the+heart%2C+but+I+fear+that+you+still+have+quite+deficiency+in+the+knowledge+of+the+law%3B+but+we+can+always+make+up+that+deficiency+later.+So+not+let+us+talk+about+the+gospel.+Tell+me%2C+Elizabeth%2C+what+definition+would+you+give+me+of+the+gospel%3F+ELIZABETH%3A+All+that+Christ+and+His+apostles+have+taught+us+and+handed+down+to+us+in+writing+in+the+New+Testament.+DATHENUS%3A+Here+you+are+again+making+quite+a+big+mistake.+Have+you+forgotten+so+soon+that+which+I+point+out+earlier%E2%80%93+that+Christ+and+His+apostles+%28Rom.+8%3A3%29+also+proclaim+and+enforce+the+law%3F+Don%E2%80%99t+you+remember+that+they+exhort+all+people+to+keep+the+commandments+of+God%2C+which+we+are+not+able+to+do+%28Acts+15%3A10%29%3F+ELIZABETH%3A+Yes%2C+that+is+true%2C+but+I+had+almost+forgotten+that.+So+please+instruct+me.+What+is+the+true+gospel%3F+DATHENUS%3A+The+Greek+word+for+gospel+denotes+joyful+good+news+which+causes+people+to+speak+and+sing+joyfully+and+be+glad+in+heart%2C+just+like+the+good+news+that+came+to+Israel+that+David+triumphed+over+the+arrogant+Goliath+and+slain+him+%281+Sam.+18%3A6%29.+Such+also+is+the+good+news+of+the+gospel+that+proclaims+to+us+and+tells+us+that+God+will+be+gracious+to+a+poor+sinner%2C+and+will+forgive+and+forget+our+sins+%28Jer.+31%3A34%3B+Heb.+8%3A12%29.+Yes%2C+for+Christ%E2%80%99s+sake+%281+Tim.+1%3A15%29+God+will+regard+us+as+holy+and+righteous+%282+Cor.+5%3A21%29%2C+out+of+pure+grace%2C+by+faith+alone%2C+without+adding+any+works+%281+Cor.+1%3A30%3B+Rom.+3%3A28%29.%E2%80%9D%0A%0A%E2%80%94+Petrus+Dathenus%2C+The+Pearl+of+Christian+Comfort+by+Petrus+Dathenus+%28HT%3A+Jack+Miller%2FIustitia+Aliena%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fedf28e8308.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/edf28e8308.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/06/law-and-gospel-in-a-pastoral-context/" rel="

<blockquote><p>[T]he Son of God, having been constituted by the Father as Mediator of the covenant, the guarantor on two counts: 1) He shall satisfy for the sins of all those whom the Father has given him (John 17) and he decreed from eternity to adopt them into sonship wrought Christ (Ephesians 1); 2) He shall also bring to pass that they, being planted in him, shall enjoy peace of conscience and be renewed daily in the image of God.</p></blockquote>

</figure><figure class="quote" id="q-a11b97b7cb" data-kw="">
<blockquote><p>Many are the mistakes at present about religious matters; but none are more destructive than those which concern the law and the gospel. The generality of our people confound them, and put one in the place of the other. Some suppose they are to be accepted of God for their works, and that they can be justified by the law in the sight of God. Others make their keeping of the law the condition of their receiving the blessings of the gospel, as if these were to be the purchase and reward of their partial obedience. Some are persuaded they must do all they can, and keep the law with all their might, and wherein they come short of the perfect demands of the law, Christ will, out his his merits, atone for their failings. And others again think that Christ has abated the rigor of the law, and that the gospel is nothing more than a new law dispensation, in which the Lord has been pleased to declare that he will accept of sincere obedience instead of perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-romaine.html">William Romaine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Twelve Discourses on the Law and the Gospel” in The Whole Works of the Late Rev. William Romaine (London, 1837).</cite></span></figcaption>

</figure><figure class="quote" id="q-aa12d92ebf" data-kw="">
<blockquote><p>In taking the comfort of the prophetic promises to our hearts we do not, perhaps, always realize what after the tempests and tumults, in the brief seasons of clear shining which God interposed, such relief must have meant to the prophets themselves. For they had not merely to pass through the distress of the present; besides this they were not allowed to avert their eyes from the terrifying vision of the latter days. In anticipation they drank from the cup “with wine of reeling” filled by Jehovah’s hand. Nor did the prophets see only the turbulent surface, the foaming upper waves of the inrushing flood, their eyes were opened to the religious and moral terrors underneath. The prophetic agony was no less spiritual than physical; it battled with the sin of Israel and the wrath of God, and these were even more dreadful realities than hostile invasion or collapse of the state or captivity for the remnant. In a sense which made them true types of Christ the prophets bore the unfaithfulness of the people on their hearts. As Jesus had a sorrowful acquaintance with the spirit no less than the body of the cross, so they were led to explore the deeper meaning of the judgment to enter recesses of its pain undreamt of by the sinners in Israel themselves.</p></blockquote>

</figure><figure class="quote" id="q-de7acf28c8" data-kw="">
<blockquote><p>Q. How shall we come to the right sight of our sins and a sound persuasion of the greatness of them? A: By the Spirit of God leading us into the true understanding of the law and a due examination of ourselves thereby. Q: Where is the law set down? A: it is written in many places of the Scriptures but the sum thereof is contained in the Ten Commandments. Q: Rehearse them A: I am the Lord your God, you shall have no other Gods but me… Q: How are they divided? A: Into two principal heads or tables as they are called. Q: What does the first table teach us? A: It teaches us our duties toward God and is contained in the first four commandments. Q: What does the second teach? A: Our duty toward our neighbor and is contained in the last six commandments. Q: Why are the duties towards God set down before the duties toward our neighbor? A: Because the love of God is the ground of our love of neighbor. Q: What follows hereof? A: That no one can rightly love his neighbor except he first love God. Q: Why are the duties towards our neighbor joined to our duty towards God? A: Because of the love of our neighbor is the proof our love towards God. Q: What ensues hereof? A: That no one can love God aright except he also love his neighbor.</p></blockquote>

</figure><figure class="quote" id="q-3aa066fe47" data-kw="">
<blockquote><p>What are the principal parts of God’s Word? The law and the gospel. What do you call the law? It is that part of the word that commands all good and forbids all evil. What if we could keep the law? Then we should be blessed. What if we break the law? Then we are subject to the curse of God, and to death and damnation. What do you call the gospel? It is that part of the word which contains the free promises of God made unto us in Jesus Christ without and respect to our deserving. What does that work in us? It works in us a true and lively faith in Jesus Christ, whereby we lay hold of the free remission of our sins in him and the true repentance of them. What must we learn by the whole word of God? Two things: First, to make a right and sound entrance to our salvation. Secondly, how to increase and continue in the same unto the end. What is required for our right and sound entrance to our salvation? Three things are required: first, to know and to be persuaded of the greatness of our sins and the misery due to the same. Secondly, to know and be persuaded how we may be delivered from them. Thirdly, to know and be persuaded what thanks we owe to God for our deliverance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Form of Catechizing (Spelling modernized; HT: Chris Gordon).</cite></span></figcaption>

</figure><figure class="quote" id="q-1e5b3da6f1" data-kw="">
<blockquote><p>At Sinai the covenant became a truly national covenant. The civil life of Israel was linked up with the covenant in such a say that the two could not be separated. In a large measure Church and Sate became one. To be in the Church was to be in the nation, and vice versa; and to leave the Chuch was to leave the nation. There was no spiritual excommunication; the ban meant cutting off by death. The Sinaitic covenant included a service that contained a positive reminder of the strict demands of the covenant of works. The law was placed very much in the foreground, giving prominence once more to the earlier legal element. But the covenant of Sinai was not a renewal of the covenant of works; in it the law was made subservient to the covenant of grace. This is indicated already in the introduction to the ten commandments, Ex. 20:2; Deut. 5:6, and further in Rom. 3:20; Gal. 3:24. It is true that at Sinai a conditional element was added to the covenant, but it was not the salvation of the Israelite but his theocratic standing in the nation, and the enjoyment of external blessings that was made dependent on the keeping of the law, Deut. 28:1-14. The law served a twofold purpose in connection with the covenant of grace: (1) to increase the consciousness of sin, Rom. 3:20; 4:15; Gal. 3:19; and (2) to be a tutor unto Christ, Gal. 3:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology, 4th edn, 298 (emphasis added).</cite></span></figcaption>

<blockquote><p>The Law-Giving Of The Covenant; Its Twofold χεσις In the covenant that God made with the people of Israel from Mount Sinai, God stipulated the law from the people, first immediately in the ten words promulgated (Ex. 20:1–8), then mediately, from the darkness of the mountain and from the constructed tabernacle, through Moses as a go-between (Ex. 20:21, etc.). This law was distinct from the mere law of faith and is called law, because it had something legal mixed, which flowing from the covenant of works, led to Christ. The χεσις of that law was twofold, legal in open, first in the approach and the skin of the words, which was by itself nothing except the letter, and evangelical in secret, in a hidden and interior sense and kernel of the thing, which was also the promise and Christ, “the end of the law” (Rom. 10:4). For the Decalogue both had strictures of grace and the whole laws in the terms agreed upon were “shadows of things to come, but the body belongs to Christ” (Col. 2:17). (VI–XI).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-h-heidegger.html">J.H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology (1697), trans. Casey Carmichael. Locus 13.3.</cite></span></figcaption>

<blockquote><p>. . . b. A usus elenchticus or pedagogicus. In this capacity the law serves the purpose of bring man under conviction of sin, and of making him conscious of his inability to meet the demands of the law. In that way the law becomes his tutor to lead him unto Christ, and thus becomes subservient to God’s gracious purpose of redemption.</p></blockquote>

<blockquote><p>There then is the first use of the preaching of the law; to make known our innumerable faults so that in ourselves we begin to be miserable and greatly humble ourselves; in short, to beget in us the first degree of repentance which is called “contrition of heart”; this produces a full and open confession toward the Lord.</p></blockquote>

<blockquote><p>5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation. 6. Although true believers be not under the law, as a covenant of works, to be thereby justified, or condemned; yet is it of great use to them, as well as to others; in that, as a rule of life informing them of the will of God, and their duty, it directs and binds them to walk accordingly; discovering also the sinful pollutions of their nature, hearts, and lives; so as, examining themselves thereby, they may come to further conviction of, humiliation for, and hatred against sin, together with a clearer sight of the need they have of Christ, and the perfection of his obedience. It is likewise of use to the regenerate, to restrain their corruptions, in that it forbids sin: and the threatenings of it serve to show what even their sins deserve; and what afflictions, in this life, they may expect for them, although freed from the curse thereof threatened in the law. The promises of it, in like manner, show them God’s approbation of obedience, and what blessings they may expect upon the performance thereof: although not as due to them by the law as a covenant of works. So as, a man’s doing good, and refraining from evil, because the law encourageth to the one, and deterreth from the other, is no evidence of his being under the law; and, not under grace. 7. Neither are the forementioned uses of the law contrary to the grace of the gospel, but do sweetly comply with it; the Spirit of Christ subduing and enabling the will of man to do that freely, and cheerfully, which the will of God, revealed in the law, requireth to be done.</p></blockquote>

<blockquote><p>Touching the catechesis of children in the Jewish church, the Old Testament abounds in many explicit commands. In the 12th and 13th chapters of Exodus, God commands the Jews to give particular instruction to their children and families in relation to the institution and benefits of the Passover. In the fourth chapter of the book of Deuteronomy he enjoins it upon parents to repeat to their children the entire history of the law which he had given them. In the sixth chapter of the same book, he requires that the doctrine of the unity of God, and of perfect love to him should be inculcated and impressed upon the minds of their children; and in the eleventh he commands them to explain the Decalogue to their children. Hence, under the Old Testament dispensation, children were taught in the family by their parents, and in the schools by the teachers of religion, the principal things contained in the prophets, viz.: such as respects God, the law, the promise of the gospel, the use of the sacraments, and sacrifices, which were types of the Messiah that was to come, and of the benefits which he was to purchase; for there can be no doubt but that the schools of the prophets Elijah, Elisha, etc., were established for this very purpose. It was also with this design that God delivered his law in the short and condensed form in which it is. “You shalt love the Lord your God with all your heart,” etc., “and your neighbor as yourself.” So also as it respects the gospel; it was briefly comprehended in the promises, “The seed of the woman shall bruise the serpent’s head;” “And in your seed shall all the nations be blessed.” They had, likewise, sacrifices, prayers, and other things which God required Abraham and his posterity to teach their children and families. Hence it is that this doctrine is presented in such a plain and simple form as to meet the capacity of children and such as are unlearned. In the New Testament we are told that Christ laid his hands upon little children and blessed them, and commanded that they should be brought unto him. Hence he says, in Mark 10:14, “Allow the little children to come to me and do not forbid them for of such is the kingdom of God.” That the catechesis of children was diligently attended to in the times of the apostles is evident from the example of Timothy, of whom it is said that he knew the holy Scriptures from a little child; and from what is said in the epistle to the Hebrews, where mention is made of some of the principal heads included in the catechism of the apostles, such as repentance from dead works, and of faith towards God, of the doctrine of baptism, and of laying on of hands, and of resurrection from the dead, and of eternal judgment, which the apostle terms milk for babes. These and similar points of doctrine were required from the Catechumens of adult age at the time of their baptism, and of children at the time of their confirmation by the laying on of hands. Hence, the apostle calls them the doctrine of baptism and laying on of hands. So likewise the Fathers wrote short summaries of doctrine, some fragments of which may still be seen in the Papal church. Eusebius writes of Origen, that he restored the custom of catechesis in Alexandria, which had been suffered to grow out of use during the times of persecution. Socrates writes thus in relation to the system of catechesis in the primitive church: “Our form of catechesis,” he says, “is in accordance with the mode which we have received from the Bishops who have preceded us, and according as we were taught when we laid the foundation of faith and were baptized, and according as we have learned from the Scriptures,” etc. Pope Gregory caused images and idols to be placed in the churches, that they might serve as books for the laity and children. After this period the doctrine of the church, through the negligence of the bishops and the subtlety of the Roman priests, became gradually more and more corrupt, and the custom of catechesis grew more and more into disuse, until at length it was changed into the ridiculous ceremony which to this day they call confirmation. So much concerning the origin and practice of catechesis in the church.</p></blockquote>

<blockquote><p>Now, the law is a doctrine partly known by nature, teaching us that there is a God, and what God is, and what he requires us to do, binding all reasonable creatures to perfect obedience, both internal and external, promising the favour of God, and everlasting life to all those who yield perfect obedience thereunto, and denouncing the curse of God and everlasting damnation to all those who are not perfectly correspondent thereunto. But the gospel is a doctrine revealed from heaven by the Son of God, presently after the fall of mankind into sin and death, and afterwards manifested more clearly and fully to the patriarchs and prophets, to the evangelists and apostles, and by them spread abroad to others; wherein freedom from sin, from the curse of the law, the wrath of God, death, and hell, is freely promised for Christ’s sake unto all who truly believe on his name.</p></blockquote>

— Herman Bavinck, Reformed Dogmatics, 4.454 (HT: James Durham Thesis)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+indeed%2C+strictly+speaking%2C+there+are+no+demands+and+conditions+in+the+gospel+but+only+promises+and+gifts.+Faith+and+repentance+are+as+much+benefits+of+the+covenant+of+grace+as+justification+%28and+so+forth%29.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%2C+4.454+%28HT%3A+James+Durham+Thesis%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F304b498ee6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/304b498ee6.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/05/bavinck-on-gospel-in-the-narrow-sense/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-60ccae10cc" data-kw="">
<blockquote><p>It may be remarked that the law of the ten commandments was promulgated to Israel from Sinai in the form of a covenant of works. Not that it was the design of God to renew a covenant of works with Israel or to put them upon seeking life by their own obedience to the law but the law was published to them as a covenant of works to show them that without a perfect righteousness answering to all the demands of the law they could not be justified before God and that finding themselves wholly destitute of that righteousness they might be excited to take hold of the covenant of grace in which a perfect righteousness for their justification is graciously provided. The Sinai transaction was a mixed dispensation. In it the covenant of grace was published as appears from these words in the preface standing before the commandments “I am the Lord thy God which have brought thee out of the land of Egypt out of the house of bondage” and from the promulgation of the ceremonial law at the sametime But the moral law as a covenant of works was also displayed to convince the Israelites of their sinfulness and misery to teach them the necessity of an atonement and lead them to embrace by faith the blessed Mediator the Seed promised to Abraham in whom all the families of the earth were to be blessed. The law therefore was published at Sinai as a covenant of works in subservience to the covenant of grace And the law is still published in subservience to the gospel as a schoolmaster to bring sinners to Christ that they may be justified by faith Gal iii 24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith: An Exposition of the Westminster Confession of Faith (1845) on WCF chapter 19 (HT: HB reader Sean)</cite></span></figcaption>

<blockquote><p>§5. The covenant of God with man is different than those made by men among themselves. For men make covenants for mutual benefits; however, God makes covenant for His people. Indeed, the covenant of God is nothing other than the divine declaration of the way of receiving the love of God as well as the union and communion of becoming a partaker in Him. If man makes use of this way he is in the friendship of God, or, the Creator is his own, God is his own in a personal way (Gen. 17:7), and he is one spirit with God (1 Cor. 6:17), who is one with him (John 17:21); his is . . . (the intimate fellowship of God; Ps. 25:14, compared with Job 29:4, John 14:23.) The one who is outside of the covenant is. . . (without God, Eph. 2:12). This declaration, taken from Hebrews 8:6, can rightly be called…(divine legislation sanctioned in the promises), and when it is attached to the application of the Testament or the plan of the future inheritance, (we discuss this application below in §179 and §184). . . (the legislation of the Testament) or. . . (the Testament according to the force of the Covenant and Law) is described.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summary of the doctrine concerning the covenant or testament… (1661).</cite></span></figcaption>

<blockquote><p>9. From this speciall and proper way of governing reasonable Creatures, there ariseth that covenant, which is between God and them. For this covenant is as it were a certaine transaction of God with the Creature, whereby God commandeth, promiseth, threatneth, fulfilleth, and the Creature doth tie it selfe in obedience to God thus covenanting. Deut. 26. 16, 17, 18, 19. This day Jehova thy God commandeth thee. &amp;c. Thou hast avouched this day the Lord to be thy God, &amp;c. Jehova hath avouched thee this day, &amp;c. To make thee high, &amp;c. And that thou mayest be an holy people, &amp;c. 10. Now because this way of entring into covenant is not between those that are equall, but between Lord and servant. Therefore it pertaines to government, whence also it is most properly called not the covenant of man, but of God, who is the author, and chiefe Executor of it. Deut. 8. 17. 18. That he may performe his covenant. 11. By vertue of this covenant the morall workes of the intelligent Creature, whilst he is in the way, have alwayes a respect, either to happinesse as a reward, of to unhappinesse as a punishment: but in the last there is meriting, but in the other not. 12. Hence the proper and highest difference of a good work and sinne doth flow, namely in that a good worke is an operation expecting happinesse of another by way of reward: as by the opposite privation of it, evill workes are made in their kind extreamly evill. 13. Hence ariseth the force &amp; reason of conscience, which is the judgement of an intelligent Creature of it selfe, as he is subjected to God. 14. Speciall government of the reasonable Creature is of Angels and men. 15. Speciall government of Angels, is either a speciall prescription, or ordering the event that followes upon it. 16. This was the same Law as touching the substance, with the morall Law which is contained in the Decalogue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity (1642 edn), 51–52.</cite></span></figcaption>

<blockquote><p>2. Under the new covenant or testament, however, these promised blessings are not given to all men, because God is true, thus the covenant is necessarily discriminate. These blessings are, however, given doubly when the covenant is received. In the first place, by the substance itself of the covenant, or by the promised blessings from God themselves, then by their administration in the visible assembly. In the first meaning learned from Jeremiah in the place already cited and which substance is peculiar to the elect. For to all the elect and to them alone, this part, the remission of sins, renewal to the image of God, and the knowledge of God itself is therefor promised, or which embraces God’s favor which they would never have had from themselves (John 6:44,45; 64,65; 10:26; 11:52; Acts 13:47,48; Romans 8:29,30; 9:7,8,9,11,15,16; Titus 1:1). Thus Moses spoke about substance of the covenant (Deuteronomy 30[:6]). “God will circumcise your heart and that of your children.” He acts truly in the administration of the covenant, (Genesis 17), ‘This is my covenant’ etc. Likewise he says, ‘My covenant will be in your flesh.’ Certainly, the very substance of the covenant was not in their flesh. And not all of their hearts were circumcised, to whom the covenant was administered or offered through circumcision (Acts 7:51,52,53). That is to say, they personally, maliciously, rejected the gracious offer of the covenant, as Stephen teaches in the same place. Therefore, the covenant of grace, if you see its essence, is a sworn oath promised by God, a gift to you by God who is never angry with you (Isaiah 54) and by our adoption in God’s Son we have been made heirs of eternal life with Jesus Christ the eternal and only begotten Son of God, the seed of Abraham who is Christ, and to all men, who by faith in this free gift which was brought by the seed, and in whom by grace they were justified and glorified short of any condition or stipulation, knowledge of the good, so that he might be celebrated in his gracious goodness from himself, in this life and life eternal (Hosea 2; Isaiah 54; Genesis 22; Hebrews chapters 1, 6; Galatians 3:15-18, 22,26,29). The administration of the covenant of grace, however, is through the testimony or call of the Royal word from the darkness (of which darkness he is convicted by the law partly natural and partly written) that is, from sin and the penalty of sin, to the light, which is unto the discerning and receiving of the Son of God offered in the gospel, with the double benefit, truly, free rightousness in the remission of sins, by cleansing in his blood, and renewal to the image of God or the spirit of holiness for sharing in the heavenly inheritance. By the outward voice and visible signs in the testimony of mutual agreement between God and us, and by the addition of the truly efficacious gift of grace of internal faith and repentance out the infinite, incomprehensible mercy to the elect, which mercy is not truly added indeed to the reprobate, but nevertheless justly and to the worship of God’s justice. For the call from the darkness to the light, that is, the gracious offer, is never rejected without evil and contumacy of the heart.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. Under the new covenant or testament, however, these promised blessings are not given to all men, because God is true, thus the covenant is necessarily discriminate. These blessings are, however, given doubly when the covenant is received. In the first place, by the substance itself of the covenant, or by the promised blessings from God themselves, then by their administration in the visible assembly. In the first meaning learned from Jeremiah in the place already cited and which substance is peculiar to the elect. For to all the elect and to them alone, this part, the remission of sins, renewal to the image of God, and the knowledge of God itself is therefor promised, or which embraces God’s favor which they would never have had from themselves (John 6:44,45; 64,65; 10:26; 11:52; Acts 13:47,48; Romans 8:29,30; 9:7,8,9,11,15,16; Titus 1:1). Thus Moses spoke about substance of the covenant (Deuteronomy 30[:6]). “God will circumcise your heart and that of your children.” He acts truly in the administration of the covenant, (Genesis 17), ‘This is my covenant’ etc. Likewise he says, ‘My covenant will be in your flesh.’ Certainly, the very substance of the covenant was not in their flesh. And not all of their hearts were circumcised, to whom the covenant was administered or offered through circumcision (Acts 7:51,52,53). That is to say, they personally, maliciously, rejected the gracious offer of the covenant, as Stephen teaches in the same place. Therefore, the covenant of grace, if you see its essence, is a sworn oath promised by God, a gift to you by God who is never angry with you (Isaiah 54) and by our adoption in God’s Son we have been made heirs of eternal life with Jesus Christ the eternal and only begotten Son of God, the seed of Abraham who is Christ, and to all men, who by faith in this free gift which was brought by the seed, and in whom by grace they were justified and glorified short of any condition or stipulation, knowledge of the good, so that he might be celebrated in his gracious goodness from himself, in this life and life eternal (Hosea 2; Isaiah 54; Genesis 22; Hebrews chapters 1, 6; Galatians 3:15-18, 22,26,29). The administration of the covenant of grace, however, is through the testimony or call of the Royal word from the darkness (of which darkness he is convicted by the law partly natural and partly written) that is, from sin and the penalty of sin, to the light, which is unto the discerning and receiving of the Son of God offered in the gospel, with the double benefit, truly, free rightousness in the remission of sins, by cleansing in his blood, and renewal to the image of God or the spirit of holiness for sharing in the heavenly inheritance. By the outward voice and visible signs in the testimony of mutual agreement between God and us, and by the addition of the truly efficacious gift of grace of internal faith and repentance out the infinite, incomprehensible mercy to the elect, which mercy is not truly added indeed to the reprobate, but nevertheless justly and to the worship of God’s justice. For the call from the darkness to the light, that is, the gracious offer, is never rejected without evil and contumacy of the heart.”

</figure><figure class="quote" id="q-5142552d4b" data-kw="">
<blockquote><p>God promised through the prophet Jeremiah [31:31, 32] that he himself would make a new covenant with us, not like that covenant which he came to regret with the fathers, when he led them from the land of Egypt. Because they made the covenant void. But this was to be the covenant: “I will put my law in your midst, and I will write my law in your heart and I will be your God and you will be my people.” Because, he will have been propitiated, he might no more remember our iniquities and our sins (Jeremiah 31; Hebrews 8). Likewise, this covenant promised to us knowledge of the true God which also embraces the free forgiveness of sins in Christ and also the he might beget from himself, renewal of man to the image of God.</p></blockquote>

<blockquote><p>Do you see how he makes this the distinction between law and gospel: that the former attributes righteousness to works, the latter bestows free righteousness apart from the help of works? This is an important passage, and one that can extricate us from many difficulties if we understand that righteousness which is given us through the gospel has been freed of all conditions of the law. (Calvin commenting on Romans 10:9)</p></blockquote>

</figure><figure class="quote" id="q-eff4be033f" data-kw="">
<blockquote><p>Q: 4 Why is the redemption or reconciliation of humanity with God presented to us in the form of a covenant, indeed a covenant of grace? A: God compares the means of our salvation to a covenant, indeed an eternal covenant, so that we might be certain and assured that a lasting, eternal peace and friendship between God and us has been made through the sacrifice of His son. After a bitter quarrel, the disputants have peace of mind first and foremost when they commit and bind themselves to each other with a promise and sworn oath that on such-and-such a matter they wont peace. God acts in the same way toward us: in order that we might have rest and peace in our consciences, God was willing our of His great goodness and grace, to bind himself to us, His enemies, with His promise and His oath. He promised that He would have his only begotten Son become human and die for us, and that through the sacrifice of his Son He would establish a lasting reconciliation and eternal peace. . . . He would be our God and bless us, that is, forgive our sins and impart to us the Holy Spirit and eternal life — and all this without any merit on our part. All we would have to do is accept the Son — promised and sent — by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation (Vester Grund, 1567).</cite></span></figcaption>

</figure><figure class="quote" id="q-a9cf0464b8" data-kw="">
<blockquote><p>The architectonic principle of the Westminster Confession is supplied by the schematization of the Federal theology, which had obtained by this time in Britain, as on the Continent, a dominant position as the most commodious mode of presenting the corpus of Reformed doctrine (so e.g. Rollock, Howie, Cartwright, Preston, Perkins, Ames, Ball, and cf. Dickson’s “Sum of Saving Knowledge” and Fisher’s “Marrow of Modern Divinity,” both of which emanated from this period and were destined to a career of great influence in the Scottish theology).</p></blockquote>

<blockquote><p>Strange as it may sound, it is true, that many—perhaps the majority—of those who feed their souls on this great declaration, seem to have trained themselves to think, when it falls upon their ears, in the first instance at least, not so much of how great, how immeasurably great, God’s love is, as rather of how great the world is. It is the world that God loves, they say,—the world: and forthwith they fall to thinking how great the world is, and how, nevertheless, God loves it all. Think, they cry, of the multitudes of men that swarm over the face of the earth; and have swarmed over it through all the countless generations from the beginning; and will swarm over it in ever-increasing numbers through perhaps even more countless generations yet to come, until the end: and God loves them all, each and every one of them, from the least to the greatest; so loves them that He has given His only begotten Son to die for them, for each and every one of them—and for each and every one of them with the same intent,—the intent, namely, that he may be saved. oh how great the love of God must be to embrace in its compass these uncounted multitudes of men; and so to embrace them that every individual that enters as a constituent unit into the mass of mankind receives his full share of it, or rather is inundated by its undivided and undiminished flood! Certainly this is a great conception. But it is just as certainly not a great enough conception to meet the requirements of our text . . . . . . We discover, then, that the distribution of the term “world” in our text into “each and every man” in the world not only begins with the obvious misstep of directing our attention at once rather to the greatness of the world than to the greatness of God’s love and only infers the latter from the former; but ends by positively belittling the love of God, as if it could content itself with half-measures,—nay, in numerous instances, with what is practically no measure at all. For if it is satisfied with merely opening a way of salvation and leaving men to walk in this way or not as they list, the hard facts of life force us to add that it is satisfied with merely opening a way of salvation for multitudes to whom it should never be made known that a way of salvation lay open before them, although their sole hope lies in their walking in it. The text is given to enhance in our hearts the conception of the love of God to sinners: to make us to know somewhat of the height and depth and length and breadth of it, though truly is passes knowledge. It will not do, then, as we read it to throw limitations around this love, as if it could not accomplish that whereto it is set.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saviour of the World (Bellingham, WA: Logos Bible Software, 2008), 103–105, 108, 111.</cite></span></figcaption>

</figure><figure class="quote" id="q-8710ddaec7" data-kw="">
<blockquote><p>When you feel doubts about being God’s child because you have not shown God that obedience that you owe to him, know that the devil is very near you. He will attempt to falsify the gospel by convincing you that you must be saved by your works. Or he will attempt to seduce you to blaspheme the Lord Jesus by causing you to think that you can be or deserve to be your own savior, at least in part. Respond to this temptation by saying that you are a poor sinner, that Jesus Christ has come to save sinners, and that there is salvation only in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. James A De Jong, and Peter Y De Jong. Classics of Reformed Spirituality (Grand Rapids: Baker Academic, 2003), 56</cite></span></figcaption>

<blockquote><p>When condition is improperly taken, and signifies no more than what particular duties as performed must, in the order of nature, precede the enjoyment of particular promised benefits, many things may be called conditions; for holiness must precede eternal happiness…. True repentance of sin must precede God’s fatherly pardon of it… And as faith is particularly required in the public dispensation of this covenant by the gospel…and is the appointed instrument by which God communicates, and we receive the blessings of it… it is more frequently called the condition of it, by divines: and indeed might be called a condition of connection in it. But when condition is taken properly for that which, when fulfilled, give gives the covenanters for right to claim the promised reward, nothing but the finished righteousness of Jesus Christ, by which all the demands of the broken covenant of works are fully satisfied, can be allowed as the condition of this covenant. 1. Christ took upon himself the whole death of his elect world,—all that of which the payment secures them from eternal death…and entitles them to eternal life…—nothing can remain there for to be fulfilled by them, as the proper condition of this covenant…. … 6. As our faith, repentance, and new obedience, by no means, answer the demands of the broken law, so, instead of being proper conditions of this covenant of grace, they are all in estimable benefits promised in it, upon the footing of its fulfilled condition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology: A Compendious View of Natural And Revealed Religion (repr. Grand Rapids: Reformation Heritage Books, 2015), 235, 235. Note: The ellipses signal the omission of Bible references. Emphasis original.</cite></span></figcaption>

</figure><figure class="quote" id="q-0c5e0f4802" data-kw="">
<blockquote><p>I also adduced another passage in which Isaiah exclaims: “‘Hear My words, and your soul shall live; and I will make an everlasting covenant with you, even the sure mercies of David. Behold, I have given Him for a witness to the people: nations which know not Thee shall call on Thee; peoples who know not Thee shall escape to Thee, because of thy God, the Holy One of Israel; for He has glorified Thee.’ This same law you have despised, and His new holy covenant you have slighted; and now you neither receive it, nor repent of your evil deeds. ‘For your ears are closed, your eyes are blinded, and the heart is hardened,’ Jeremiah has cried; yet not even then do you listen. The Lawgiver is present, yet you do not see Him; to the poor the Gospel is preached, the blind see, yet you do not understand. You have now need of a second circumcision, though you glory greatly in the flesh. The new law requires you to keep perpetual sabbath, and you, because you are idle for one day, suppose you are pious, not discerning why this has been commanded you: and if you eat unleavened bread, you say the will of God has been fulfilled. The Lord our God does not take pleasure in such observances: if there is any perjured person or a thief among you, let him cease to be so; if any adulterer, let him repent; then he has kept the sweet and true sabbaths of God. If any one has impure hands, let him wash and be pure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dialogue With Trypho the Jew, ch. 12.</cite></span></figcaption>

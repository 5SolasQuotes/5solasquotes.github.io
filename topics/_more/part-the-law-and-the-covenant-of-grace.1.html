<blockquote><p>FIFTH QUESTION: THE UNITY OF THE COVENANT OF GRACE Was the covenant of grace one and the same as to substance under each dispensation? We affirm against the Socinians, Anabaptists and Remonstrants I. This most important controversy is waged by us with the ancient and modern Pelagians (to wit, the Socinians, Remonstrants, Anabaptists and others who deny the identity of the gratuitous covenant). They hold that the fathers of the Old Testament were not saved by the gratuitous mercy of God in Christ, the Mediator (God-man, theanthrōpō) through faith in him about to come. Opinion of the Socinians. II. The Socinians express their opinion in the Racovian Catechism where they assert that in the law of Christ two promises are contained (which were not contained in the law of Moses)—eternal life and the Holy Spirit, “Nowhere will you discover in the law of Moses, either eternal life or the gift of the Spirit promised to those obeying the precepts of the law, as it is evident they are promised in the law given by Christ” (Racovian Catechism 5 [1652], p. 113). Socinus clearly confirms this: “We say, therefore, that the new covenant brought most openly to us the promise of eternal life; moreover the promise of remission of sins. Finally the promise to be obtained by all believers, of the Holy Spirit. Since that old covenant wants and wanted all these and proposed earthly happiness, it is easy to recognize the superiority of the new covenant in this respect” (de Officio Christi+). Volkelius labors to prove the same thing by various arguments (De vera Religione 3.11 [1630], pp. 56–72) and also Smaltzius (De Divinitate Jesu Christi 2 and 7 [1608], pp. 3–7 and 25–29). Still they do not deny that the fathers of the Old Testament were saved or would be saved in eternal happiness. “Not to be guilty of dissimulation,” says Smaltzius, “we firmly maintain, even if no open promise occurs of eternal life in the old covenant, that it would be given at some time or other to all those, who ever trusted in God and obeyed him” (ibid., 7, p. 27). Volkelius agrees with him (ibid.). Nor do they deny that God pardoned their sins, although he had not promised it nor signified his intention to do so (Socinus, De Iesu Christo Servatore, Pt. III. 2 [1594], pp. 228–50; “Tractatus de Justificatione,” 3* Opera Omnia [1656], 1:604–9), and that the fathers had some knowledge and hope of eternal life, although not promised to them (Smaltzius, De Divinitate Jesu Christi 7 [1608], pp. 25–29); that Christ and grace and salvation in Christ had been preached under the Old Testament. Socinus in his Praelect.+: “Now it is certain, that Christ not only really was and is our savior, but it was also predicted by the prophets, as we learn, among other passages, from chap. 23 and 33 of Jeremiah.” But on this account, they do not hold either that the ancients looked to Christ or were saved in the hope of his coming. The same one: “In this I disagree with you, that you seem to concede, that the pious under the Old Testament, looked to Christ in those ceremonies and sacrifices in which he was typified, and were saved in the hope of his coming, a thing of which I can in no way persuade myself” (Socinus, “Ad amicos epistolae: ad Matthaeum Radecium,” Opera Omnia [1656], 1:377). Hence they distinguish between the faith of those times and ours, so that was a faith in God simply and this a faith also in Christ. Smaltzius: “Nor was that faith in Jesus Christ, but in God and his promises” (Refutatio Thesium D. Wolfgangi Frantzii, Disp. 12 [1614], p. 459); and Volkelius holds that the faith of the ancients and ours differs in three things and especially “that now we are commanded to believe as much in Christ as in God; but that formerly such a faith by no means was exercised is evident even from the fact that Christ was not then manifested” (De vera Religione 4.3 [1630], p. 176). Of the Remonstrants. III. The Remonstrants do not differ from the Socinians. Arminius indeed properly places the agreement of both testaments in the one and same matter of both (to wit, the obedience of faith required in both and the inheritance of eternal life promised through the imputation of the righteousness of faith, and the gracious adoption in Christ) (“Disputation XIII: On the Comparison of the Law and the Gospel,” Works [1956], 1:539–48). The one object is Christ. The difference is in some accidentals which detract nothing from the substantial unity. But his followers speak differently. The apologists call the question concerning faith in Jesus Christ (“whether and how it had a place under the Old Testament”) “absurd, ambiguous and useless and there is certainly no passage where it appears that faith was commanded or flourished under the Old Testament” (“Apologia pro confessione sive declaratione … Remonstrantes,” 7 in Episcopius, Operum theologicorum [1665], Pt. II, p. 155). At length they distinguish the manner of revelation (clear or obscure) and say that faith in Jesus Christ was taught in the Old Testament neither openly and directly, but yet indirectly and obscurely comprehended and involved in the faith of the general favor and grace of God. They say the same thing concerning the promise of eternal life: “From this it is easy to gather what must be determined concerning the famous question, did the promise of eternal life have a place in the old covenant or rather was it comprehended in the covenant itself? For if special promises seem to be expressed in that old covenant, we must confess that no clear promise of eternal life can be found in them. If anyone thinks differently, it is his place to point out where it can be found, which I think cannot be done. But if there seem to be general promises, it must be confessed on the other part that they are such that the promise of eternal life should not only seem to come under, but also by the intention it ought to be believed to have come under them” (Episcopius, “Institutiones theologicae,” 3.4.1 Opera theologica [1678], p. 156). Of the Anabaptists. IV. Many Anabaptists fall into the same error, as is evident from the Frankenthal Colloquy where they speak of the Israelite people as if they were a herd of swine, whom they jestingly say were fattened on this earth by the Lord without any hope of heavenly immortality (Protocoll … Frankenthal, Art. 15, 16 [J. Meier, 1573], pp. 292–335). They maintain that only temporal goods and earthly promises were granted to them. This was also the impious notion of Servetus, against whom Calvin solidly disputes (Institutes of the Christian Religion, 2.10 pp. 428–49). Statement of the question. V. From these things the state of the question can clearly be gathered. The question is not: (1) whether the covenant of grace was various as to accidentals and the different modes and degrees of dispensation and manifestation (for we confess that under this relation [schesei] there is a multiple difference between the Old and New Testament or the old and new economy, as will be proved in its proper place). Rather the question is whether it was the same as to substance and the essential parts of the covenant, i.e., both as to the covenanted themselves and as to the federal pact consisting in the mutual obligation of the parties. Whether the same Mediator (Christ) in both; the same faith in Christ; promises of the same spiritual and heavenly blessings; the same way of reconciliation and salvation—the economy and administration only of the covenant varying. This our opponents deny; we affirm. VI. The question is not whether the fathers of the Old Testament were saved, whether their sins were pardoned, whether they had any hope of eternal life, whether Christ was predicted to them. Most of our adversaries do not dare deny this. Rather the question is whether they looked to Christ and were saved in the hope of his coming. Whether promises not only temporal, but also spiritual and heavenly concerning eternal life and the Holy Spirit were given to them. And whether the same covenant entered into with us in Christ had already been contracted with them, although more obscurely and reservedly. This they deny; we assert. We maintain that Christ was not only predicted but also promised to the fathers and by his grace they were saved under the Old Testament no less than we are saved under the New; nor was any other name given under heaven even from the beginning from which salvation could be hoped for (Acts 4:12) and that too according to the inviolable promise of the gratuitous covenant. The identity of the covenant is proved: (1) from the Scriptures. VII. The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8). Hence he brings forward the justification of Abraham by faith as an example for us (Rom. 4:3) and exhibits him as “the father of the faithful” to the Jews as well as the Gentiles (which could not have been done if the covenant was not identical). This is confirmed by the fact that he calls the promise given to Abraham “the covenant that was before confirmed of God in Christ” (diathēkēn prokekyrōmenēn hypo tou Theou eis Christon, Gal. 3:17). 2. From the identity of the covenant of grace. VIII. Second, in particular, from all the parts of the covenant of grace which were the same in both cases. Such is the clause of the covenant that God will be our God and the God of our seed; for as it had already been proposed to Abraham (Gen. 17:7) and renewed to Moses in a vision (Ex. 3:15) and frequently in legislation, confirmed in the captivity and after it (Ezk. 36:28), so no other was proposed in the covenant of grace as the foundation of all blessings, spiritual as well as celestial (Mt. 22:32; 2 Cor. 6:16; Rev. 21:3). 3. From the identity of the Mediator. IX. Third, the identity of the Mediator (given in the Old and New Testament), the foundation of the covenant. He is the blessed seed of the woman who would bruise the serpent’s head (Gen. 3:15 compared with Heb. 2:14 and Rom. 16:20), the seed of Abraham in whom all the nations of the earth were to be blessed (Gen. 22:18, viz., Christ—cf. Gal. 3:16); in the Old Testament “the angel of Jehovah’s presence” (Is. 63:9), “the angel of the covenant” (Mal. 3:1), “a covenant of the people and of the Gentiles,” i.e., its Mediator (Is. 42:6; 49:8), who bore the griefs of his people and was smitten for their sins (Is. 53:5, 6). In the New Testament, he is the Mediator between God and men (1 Tim. 2:5); the Mediator of the New Testament and of a better covenant (Heb. 8:6; 9:15); “the same yesterday, today and forever” (Heb. 13:8); by whose grace the fathers, no less than we, were saved (Acts 15:10, 11); to whom all the prophets bore testimony (Acts 10:43); the one sole name given under heaven by which we can be saved (Acts 4:12); the Way, the Truth and the Life, so that no one can come to the Father except by him (Jn. 14:6). X. The objection to Heb. 13:8 is vain. Christ is said to be “the same yesterday, today and forever,” and it is supposed either that it treats of his doctrine, not concerning his person and the covenant made in it. If a doctrine is eternal, therefore also the person who delivers it and the covenant proposed in it is eternal. Or it is supposed that “yesterday” denotes the day of his flesh before his ascension and “today” the time after his ascension. This is repugnant to the aim of Paul, which is to exhort to constancy of faith, the argument being drawn from the identity and perpetuity of the gospel doctrine, of which Christ as Mediator is the object. Or that by “today” and “yesterday” is denoted a thing new and recent which commenced not very long ago (as men are said to be of “yesterday” in Job 8:9 and among the Greeks ephēmeroi [“beings of a day”] on account of the shortness of their lives). The expressions are very dissimilar. To be mthmvl (“from yesterday and the day before”) depresses human nature. But here Christ is said to have been yesterday and to be today and forever through all the differences of time, to denote his glory and eternity. Nor is he only said to be yesterday, today and forever, but the same, i.e., not different, either now or then or afterwards; but always and everywhere the same Jesus Christ. This could not be said if Christ had not even from the beginning been the Mediator of the covenant of grace and the Prophet and teacher of the church. XI. Acts 15:11 cannot be understood of the apostles compared with the converted Gentile believers and not with the fathers of the Old Testament (as they maintain). For Peter had spoken proximately of the fathers and so the following words are fitly referred to them—“But we believe that through the grace of the Lord Jesus Christ, we shall be saved, even as they (kath’ hon tropon kakeinoi).” (2) The design of Peter demands this. He wishes to prove that the yoke of the ceremonial law is not to be placed on the necks of the Gentiles for this reason—that the fathers themselves could not bear it, but were saved by the same grace of Christ as we. (3) If the apostles had wished to join themselves with the Gentiles in the manner of salvation, they would not have said we believe that we are saved even as they; but rather vice versa, they even as we. It did not become the apostles to follow the Gentiles and to set these before themselves as an example in the manner of salvation, but the contrary. (4) Nor is it absurd for Peter (discoursing concerning the manner in which the Gentiles should obtain salvation) to end with an argument taken from the fathers, because there is one method of salvation for all. If the yoke of the law was insufferable (abastakton) to the fathers, it is rightly inferred that the Gentiles are not to be subjected to that yoke. XII. It is also falsely alleged that the words “There is none other name under heaven given among men, whereby we must be saved” (Acts 4:12) refer only to the time in which Christ was manifested and cannot be extended to the past. The words themselves disprove this interpretation. They do not assert that there is now no name given to men whereby they can be saved, but that no name is given among men (en anthrōpois) in all time. The thing itself demands this. For since no salvation can be granted to the sinner without a mediator (and there is no mediator except Christ), it follows either that the fathers had no salvation or that they were saved by Christ. Nor if the words are used in the present, are the past or the future excluded; but this is done that the truth of the mediation of Christ may be predicated of all time. XIII. The words “from the foundation of the world” (apo katabolēs kosmou, Rev. 13:8) are not to be separated from those which immediately precede (“the Lamb slain”) and to be joined with “the book of life” by transposition (as is the case in Rev. 17:8). (1) There is no necessity for such a transposition doing violence to the series of the discourse, which flows far more smoothly when we thus read—“whose names are not written in the book of life of the Lamb slain from the foundation of the world”—than according to the wish of our opponents—“whose names are written from the foundation of the world in the book of life of the Lamb slain.” For as the book of life is said “to be the book of life of the Lamb” (Rev. 21:27), it ought not to be torn away from the words “of the Lamb slain” (arniou esphagmenou). (2) “The Lamb slain” is nowhere put by itself, but mention is always made either of the time from which or of the persons for whom (or for what causes) he was slain. (3) It is most properly said “slain from the foundation of the world”; not in himself, but intentionally, in the decree of God; objectively, in the promises of the word and the faith of the fathers; typically, in sacraments and sacrifices. (4) Even granting that the words are to be so explained, the force of the argument is not destroyed because no one can be written in the book of life, except in Christ slain (or in his death).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“FIFTH QUESTION: THE UNITY OF THE COVENANT OF GRACE Was the covenant of grace one and the same as to substance under each dispensation? We affirm against the Socinians, Anabaptists and Remonstrants I. This most important controversy is waged by us with the ancient and modern Pelagians (to wit, the Socinians, Remonstrants, Anabaptists and others who deny the identity of the gratuitous covenant). They hold that the fathers of the Old Testament were not saved by the gratuitous mercy of God in Christ, the Mediator (God-man, theanthrōpō) through faith in him about to come. Opinion of the Socinians. II. The Socinians express their opinion in the Racovian Catechism where they assert that in the law of Christ two promises are contained (which were not contained in the law of Moses)—eternal life and the Holy Spirit, “Nowhere will you discover in the law of Moses, either eternal life or the gift of the Spirit promised to those obeying the precepts of the law, as it is evident they are promised in the law given by Christ” (Racovian Catechism 5 [1652], p. 113). Socinus clearly confirms this: “We say, therefore, that the new covenant brought most openly to us the promise of eternal life; moreover the promise of remission of sins. Finally the promise to be obtained by all believers, of the Holy Spirit. Since that old covenant wants and wanted all these and proposed earthly happiness, it is easy to recognize the superiority of the new covenant in this respect” (de Officio Christi+). Volkelius labors to prove the same thing by various arguments (De vera Religione 3.11 [1630], pp. 56–72) and also Smaltzius (De Divinitate Jesu Christi 2 and 7 [1608], pp. 3–7 and 25–29). Still they do not deny that the fathers of the Old Testament were saved or would be saved in eternal happiness. “Not to be guilty of dissimulation,” says Smaltzius, “we firmly maintain, even if no open promise occurs of eternal life in the old covenant, that it would be given at some time or other to all those, who ever trusted in God and obeyed him” (ibid., 7, p. 27). Volkelius agrees with him (ibid.). Nor do they deny that God pardoned their sins, although he had not promised it nor signified his intention to do so (Socinus, De Iesu Christo Servatore, Pt. III. 2 [1594], pp. 228–50; “Tractatus de Justificatione,” 3* Opera Omnia [1656], 1:604–9), and that the fathers had some knowledge and hope of eternal life, although not promised to them (Smaltzius, De Divinitate Jesu Christi 7 [1608], pp. 25–29); that Christ and grace and salvation in Christ had been preached under the Old Testament. Socinus in his Praelect.+: “Now it is certain, that Christ not only really was and is our savior, but it was also predicted by the prophets, as we learn, among other passages, from chap. 23 and 33 of Jeremiah.” But on this account, they do not hold either that the ancients looked to Christ or were saved in the hope of his coming. The same one: “In this I disagree with you, that you seem to concede, that the pious under the Old Testament, looked to Christ in those ceremonies and sacrifices in which he was typified, and were saved in the hope of his coming, a thing of which I can in no way persuade myself” (Socinus, “Ad amicos epistolae: ad Matthaeum Radecium,” Opera Omnia [1656], 1:377). Hence they distinguish between the faith of those times and ours, so that was a faith in God simply and this a faith also in Christ. Smaltzius: “Nor was that faith in Jesus Christ, but in God and his promises” (Refutatio Thesium D. Wolfgangi Frantzii, Disp. 12 [1614], p. 459); and Volkelius holds that the faith of the ancients and ours differs in three things and especially “that now we are commanded to believe as much in Christ as in God; but that formerly such a faith by no means was exercised is evident even from the fact that Christ was not then manifested” (De vera Religione 4.3 [1630], p. 176). Of the Remonstrants. III. The Remonstrants do not differ from the Socinians. Arminius indeed properly places the agreement of both testaments in the one and same matter of both (to wit, the obedience of faith required in both and the inheritance of eternal life promised through the imputation of the righteousness of faith, and the gracious adoption in Christ) (“Disputation XIII: On the Comparison of the Law and the Gospel,” Works [1956], 1:539–48). The one object is Christ. The difference is in some accidentals which detract nothing from the substantial unity. But his followers speak differently. The apologists call the question concerning faith in Jesus Christ (“whether and how it had a place under the Old Testament”) “absurd, ambiguous and useless and there is certainly no passage where it appears that faith was commanded or flourished under the Old Testament” (“Apologia pro confessione sive declaratione … Remonstrantes,” 7 in Episcopius, Operum theologicorum [1665], Pt. II, p. 155). At length they distinguish the manner of revelation (clear or obscure) and say that faith in Jesus Christ was taught in the Old Testament neither openly and directly, but yet indirectly and obscurely comprehended and involved in the faith of the general favor and grace of God. They say the same thing concerning the promise of eternal life: “From this it is easy to gather what must be determined concerning the famous question, did the promise of eternal life have a place in the old covenant or rather was it comprehended in the covenant itself? For if special promises seem to be expressed in that old covenant, we must confess that no clear promise of eternal life can be found in them. If anyone thinks differently, it is his place to point out where it can be found, which I think cannot be done. But if there seem to be general promises, it must be confessed on the other part that they are such that the promise of eternal life should not only seem to come under, but also by the intention it ought to be believed to have come under them” (Episcopius, “Institutiones theologicae,” 3.4.1 Opera theologica [1678], p. 156). Of the Anabaptists. IV. Many Anabaptists fall into the same error, as is evident from the Frankenthal Colloquy where they speak of the Israelite people as if they were a herd of swine, whom they jestingly say were fattened on this earth by the Lord without any hope of heavenly immortality (Protocoll … Frankenthal, Art. 15, 16 [J. Meier, 1573], pp. 292–335). They maintain that only temporal goods and earthly promises were granted to them. This was also the impious notion of Servetus, against whom Calvin solidly disputes (Institutes of the Christian Religion, 2.10 pp. 428–49). Statement of the question. V. From these things the state of the question can clearly be gathered. The question is not: (1) whether the covenant of grace was various as to accidentals and the different modes and degrees of dispensation and manifestation (for we confess that under this relation [schesei] there is a multiple difference between the Old and New Testament or the old and new economy, as will be proved in its proper place). Rather the question is whether it was the same as to substance and the essential parts of the covenant, i.e., both as to the covenanted themselves and as to the federal pact consisting in the mutual obligation of the parties. Whether the same Mediator (Christ) in both; the same faith in Christ; promises of the same spiritual and heavenly blessings; the same way of reconciliation and salvation—the economy and administration only of the covenant varying. This our opponents deny; we affirm. VI. The question is not whether the fathers of the Old Testament were saved, whether their sins were pardoned, whether they had any hope of eternal life, whether Christ was predicted to them. Most of our adversaries do not dare deny this. Rather the question is whether they looked to Christ and were saved in the hope of his coming. Whether promises not only temporal, but also spiritual and heavenly concerning eternal life and the Holy Spirit were given to them. And whether the same covenant entered into with us in Christ had already been contracted with them, although more obscurely and reservedly. This they deny; we assert. We maintain that Christ was not only predicted but also promised to the fathers and by his grace they were saved under the Old Testament no less than we are saved under the New; nor was any other name given under heaven even from the beginning from which salvation could be hoped for (Acts 4:12) and that too according to the inviolable promise of the gratuitous covenant. The identity of the covenant is proved: (1) from the Scriptures. VII. The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8). Hence he brings forward the justification of Abraham by faith as an example for us (Rom. 4:3) and exhibits him as “the father of the faithful” to the Jews as well as the Gentiles (which could not have been done if the covenant was not identical). This is confirmed by the fact that he calls the promise given to Abraham “the covenant that was before confirmed of God in Christ” (diathēkēn prokekyrōmenēn hypo tou Theou eis Christon, Gal. 3:17). 2. From the identity of the covenant of grace. VIII. Second, in particular, from all the parts of the covenant of grace which were the same in both cases. Such is the clause of the covenant that God will be our God and the God of our seed; for as it had already been proposed to Abraham (Gen. 17:7) and renewed to Moses in a vision (Ex. 3:15) and frequently in legislation, confirmed in the captivity and after it (Ezk. 36:28), so no other was proposed in the covenant of grace as the foundation of all blessings, spiritual as well as celestial (Mt. 22:32; 2 Cor. 6:16; Rev. 21:3). 3. From the identity of the Mediator. IX. Third, the identity of the Mediator (given in the Old and New Testament), the foundation of the covenant. He is the blessed seed of the woman who would bruise the serpent’s head (Gen. 3:15 compared with Heb. 2:14 and Rom. 16:20), the seed of Abraham in whom all the nations of the earth were to be blessed (Gen. 22:18, viz., Christ—cf. Gal. 3:16); in the Old Testament “the angel of Jehovah’s presence” (Is. 63:9), “the angel of the covenant” (Mal. 3:1), “a covenant of the people and of the Gentiles,” i.e., its Mediator (Is. 42:6; 49:8), who bore the griefs of his people and was smitten for their sins (Is. 53:5, 6). In the New Testament, he is the Mediator between God and men (1 Tim. 2:5); the Mediator of the New Testament and of a better covenant (Heb. 8:6; 9:15); “the same yesterday, today and forever” (Heb. 13:8); by whose grace the fathers, no less than we, were saved (Acts 15:10, 11); to whom all the prophets bore testimony (Acts 10:43); the one sole name given under heaven by which we can be saved (Acts 4:12); the Way, the Truth and the Life, so that no one can come to the Father except by him (Jn. 14:6). X. The objection to Heb. 13:8 is vain. Christ is said to be “the same yesterday, today and forever,” and it is supposed either that it treats of his doctrine, not concerning his person and the covenant made in it. If a doctrine is eternal, therefore also the person who delivers it and the covenant proposed in it is eternal. Or it is supposed that “yesterday” denotes the day of his flesh before his ascension and “today” the time after his ascension. This is repugnant to the aim of Paul, which is to exhort to constancy of faith, the argument being drawn from the identity and perpetuity of the gospel doctrine, of which Christ as Mediator is the object. Or that by “today” and “yesterday” is denoted a thing new and recent which commenced not very long ago (as men are said to be of “yesterday” in Job 8:9 and among the Greeks ephēmeroi [“beings of a day”] on account of the shortness of their lives). The expressions are very dissimilar. To be mthmvl (“from yesterday and the day before”) depresses human nature. But here Christ is said to have been yesterday and to be today and forever through all the differences of time, to denote his glory and eternity. Nor is he only said to be yesterday, today and forever, but the same, i.e., not different, either now or then or afterwards; but always and everywhere the same Jesus Christ. This could not be said if Christ had not even from the beginning been the Mediator of the covenant of grace and the Prophet and teacher of the church. XI. Acts 15:11 cannot be understood of the apostles compared with the converted Gentile believers and not with the fathers of the Old Testament (as they maintain). For Peter had spoken proximately of the fathers and so the following words are fitly referred to them—“But we believe that through the grace of the Lord Jesus Christ, we shall be saved, even as they (kath’ hon tropon kakeinoi).” (2) The design of Peter demands this. He wishes to prove that the yoke of the ceremonial law is not to be placed on the necks of the Gentiles for this reason—that the fathers themselves could not bear it, but were saved by the same grace of Christ as we. (3) If the apostles had wished to join themselves with the Gentiles in the manner of salvation, they would not have said we believe that we are saved even as they; but rather vice versa, they even as we. It did not become the apostles to follow the Gentiles and to set these before themselves as an example in the manner of salvation, but the contrary. (4) Nor is it absurd for Peter (discoursing concerning the manner in which the Gentiles should obtain salvation) to end with an argument taken from the fathers, because there is one method of salvation for all. If the yoke of the law was insufferable (abastakton) to the fathers, it is rightly inferred that the Gentiles are not to be subjected to that yoke. XII. It is also falsely alleged that the words “There is none other name under heaven given among men, whereby we must be saved” (Acts 4:12) refer only to the time in which Christ was manifested and cannot be extended to the past. The words themselves disprove this interpretation. They do not assert that there is now no name given to men whereby they can be saved, but that no name is given among men (en anthrōpois) in all time. The thing itself demands this. For since no salvation can be granted to the sinner without a mediator (and there is no mediator except Christ), it follows either that the fathers had no salvation or that they were saved by Christ. Nor if the words are used in the present, are the past or the future excluded; but this is done that the truth of the mediation of Christ may be predicated of all time. XIII. The words “from the foundation of the world” (apo katabolēs kosmou, Rev. 13:8) are not to be separated from those which immediately precede (“the Lamb slain”) and to be joined with “the book of life” by transposition (as is the case in Rev. 17:8). (1) There is no necessity for such a transposition doing violence to the series of the discourse, which flows far more smoothly when we thus read—“whose names are not written in the book of life of the Lamb slain from the foundation of the world”—than according to the wish of our opponents—“whose names are written from the foundation of the world in the book of life of the Lamb slain.” For as the book of life is said “to be the book of life of the Lamb” (Rev. 21:27), it ought not to be torn away from the words “of the Lamb slain” (arniou esphagmenou). (2) “The Lamb slain” is nowhere put by itself, but mention is always made either of the time from which or of the persons for whom (or for what causes) he was slain. (3) It is most properly said “slain from the foundation of the world”; not in himself, but intentionally, in the decree of God; objectively, in the promises of the word and the faith of the fathers; typically, in sacraments and sacrifices. (4) Even granting that the words are to be so explained, the force of the argument is not destroyed because no one can be written in the book of life, except in Christ slain (or in his death).”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 192–96 (12.5.1–13).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFIFTH+QUESTION%3A+THE+UNITY+OF+THE+COVENANT+OF+GRACE+Was+the+covenant+of+grace+one+and+the+same+as+to+substance+under+each+dispensation%3F+We+affirm+against+the+Socinians%2C+Anabaptists+and+Remonstrants+I.+This+most+important+controversy+is+waged+by+us+with+the+ancient+and+modern+Pelagians+%28to+wit%2C+the+Socinians%2C+Remonstrants%2C+Anabaptists+and+others+who+deny+the+identity+of+the+gratuitous+covenant%29.+They+hold+that+the+fathers+of+the+Old+Testament+were+not+saved+by+the+gratuitous+mercy+of+God+in+Christ%2C+the+Mediator+%28God-man%2C+theanthr%C5%8Dp%C5%8D%29+through+faith+in+him+about+to+come.+Opinion+of+the+Socinians.+II.+The+Socinians+express+their+opinion+in+the+Racovian+Catechism+where+they+assert+that+in+the+law+of+Christ+two+promises+are+contained+%28which+were+not+contained+in+the+law+of+Moses%29%E2%80%94eternal+life+and+the+Holy+Spirit%2C+%E2%80%9CNowhere+will+you+discover+in+the+law+of+Moses%2C+either+eternal+life+or+the+gift+of+the+Spirit+promised+to+those+obeying+the+precepts+of+the+law%2C+as+it+is+evident+they+are+promised+in+the+law+given+by+Christ%E2%80%9D+%28Racovian+Catechism+5+%5B1652%5D%2C+p.+113%29.+Socinus+clearly+confirms+this%3A+%E2%80%9CWe+say%2C+therefore%2C+that+the+new+covenant+brought+most+openly+to+us+the+promise+of+eternal+life%3B+moreover+the+promise+of+remission+of+sins.+Finally+the+promise+to+be+obtained+by+all+believers%2C+of+the+Holy+Spirit.+Since+that+old+covenant+wants+and+wanted+all+these+and+proposed+earthly+happiness%2C+it+is+easy+to+recognize+the+superiority+of+the+new+covenant+in+this+respect%E2%80%9D+%28de+Officio+Christi%2B%29.+Volkelius+labors+to+prove+the+same+thing+by+various+arguments+%28De+vera+Religione+3.11+%5B1630%5D%2C+pp.+56%E2%80%9372%29+and+also+Smaltzius+%28De+Divinitate+Jesu+Christi+2+and+7+%5B1608%5D%2C+pp.+3%E2%80%937+and+25%E2%80%9329%29.+Still+they+do+not+deny+that+the+fathers+of+the+Old+Testament+were+saved+or+would+be+saved+in+eternal+happiness.+%E2%80%9CNot+to+be+guilty+of+dissimulation%2C%E2%80%9D+says+Smaltzius%2C+%E2%80%9Cwe+firmly+maintain%2C+even+if+no+open+promise+occurs+of+eternal+life+in+the+old+covenant%2C+that+it+would+be+given+at+some+time+or+other+to+all+those%2C+who+ever+trusted+in+God+and+obeyed+him%E2%80%9D+%28ibid.%2C+7%2C+p.+27%29.+Volkelius+agrees+with+him+%28ibid.%29.+Nor+do+they+deny+that+God+pardoned+their+sins%2C+although+he+had+not+promised+it+nor+signified+his+intention+to+do+so+%28Socinus%2C+De+Iesu+Christo+Servatore%2C+Pt.+III.+2+%5B1594%5D%2C+pp.+228%E2%80%9350%3B+%E2%80%9CTractatus+de+Justificatione%2C%E2%80%9D+3%2A+Opera+Omnia+%5B1656%5D%2C+1%3A604%E2%80%939%29%2C+and+that+the+fathers+had+some+knowledge+and+hope+of+eternal+life%2C+although+not+promised+to+them+%28Smaltzius%2C+De+Divinitate+Jesu+Christi+7+%5B1608%5D%2C+pp.+25%E2%80%9329%29%3B+that+Christ+and+grace+and+salvation+in+Christ+had+been+preached+under+the+Old+Testament.+Socinus+in+his+Praelect.%2B%3A+%E2%80%9CNow+it+is+certain%2C+that+Christ+not+only+really+was+and+is+our+savior%2C+but+it+was+also+predicted+by+the+prophets%2C+as+we+learn%2C+among+other+passages%2C+from+chap.+23+and+33+of+Jeremiah.%E2%80%9D+But+on+this+account%2C+they+do+not+hold+either+that+the+ancients+looked+to+Christ+or+were+saved+in+the+hope+of+his+coming.+The+same+one%3A+%E2%80%9CIn+this+I+disagree+with+you%2C+that+you+seem+to+concede%2C+that+the+pious+under+the+Old+Testament%2C+looked+to+Christ+in+those+ceremonies+and+sacrifices+in+which+he+was+typified%2C+and+were+saved+in+the+hope+of+his+coming%2C+a+thing+of+which+I+can+in+no+way+persuade+myself%E2%80%9D+%28Socinus%2C+%E2%80%9CAd+amicos+epistolae%3A+ad+Matthaeum+Radecium%2C%E2%80%9D+Opera+Omnia+%5B1656%5D%2C+1%3A377%29.+Hence+they+distinguish+between+the+faith+of+those+times+and+ours%2C+so+that+was+a+faith+in+God+simply+and+this+a+faith+also+in+Christ.+Smaltzius%3A+%E2%80%9CNor+was+that+faith+in+Jesus+Christ%2C+but+in+God+and+his+promises%E2%80%9D+%28Refutatio+Thesium+D.+Wolfgangi+Frantzii%2C+Disp.+12+%5B1614%5D%2C+p.+459%29%3B+and+Volkelius+holds+that+the+faith+of+the+ancients+and+ours+differs+in+three+things+and+especially+%E2%80%9Cthat+now+we+are+commanded+to+believe+as+much+in+Christ+as+in+God%3B+but+that+formerly+such+a+faith+by+no+means+was+exercised+is+evident+even+from+the+fact+that+Christ+was+not+then+manifested%E2%80%9D+%28De+vera+Religione+4.3+%5B1630%5D%2C+p.+176%29.+Of+the+Remonstrants.+III.+The+Remonstrants+do+not+differ+from+the+Socinians.+Arminius+indeed+properly+places+the+agreement+of+both+testaments+in+the+one+and+same+matter+of+both+%28to+wit%2C+the+obedience+of+faith+required+in+both+and+the+inheritance+of+eternal+life+promised+through+the+imputation+of+the+righteousness+of+faith%2C+and+the+gracious+adoption+in+Christ%29+%28%E2%80%9CDisputation+XIII%3A+On+the+Comparison+of+the+Law+and+the+Gospel%2C%E2%80%9D+Works+%5B1956%5D%2C+1%3A539%E2%80%9348%29.+The+one+object+is+Christ.+The+difference+is+in+some+accidentals+which+detract+nothing+from+the+substantial+unity.+But+his+followers+speak+differently.+The+apologists+call+the+question+concerning+faith+in+Jesus+Christ+%28%E2%80%9Cwhether+and+how+it+had+a+place+under+the+Old+Testament%E2%80%9D%29+%E2%80%9Cabsurd%2C+ambiguous+and+useless+and+there+is+certainly+no+passage+where+it+appears+that+faith+was+commanded+or+flourished+under+the+Old+Testament%E2%80%9D+%28%E2%80%9CApologia+pro+confessione+sive+declaratione+%E2%80%A6+Remonstrantes%2C%E2%80%9D+7+in+Episcopius%2C+Operum+theologicorum+%5B1665%5D%2C+Pt.+II%2C+p.+155%29.+At+length+they+distinguish+the+manner+of+revelation+%28clear+or+obscure%29+and+say+that+faith+in+Jesus+Christ+was+taught+in+the+Old+Testament+neither+openly+and+directly%2C+but+yet+indirectly+and+obscurely+comprehended+and+involved+in+the+faith+of+the+general+favor+and+grace+of+God.+They+say+the+same+thing+concerning+the+promise+of+eternal+life%3A+%E2%80%9CFrom+this+it+is+easy+to+gather+what+must+be+determined+concerning+the+famous+question%2C+did+the+promise+of+eternal+life+have+a+place+in+the+old+covenant+or+rather+was+it+comprehended+in+the+covenant+itself%3F+For+if+special+promises+seem+to+be+expressed+in+that+old+covenant%2C+we+must+confess+that+no+clear+promise+of+eternal+life+can+be+found+in+them.+If+anyone+thinks+differently%2C+it+is+his+place+to+point+out+where+it+can+be+found%2C+which+I+think+cannot+be+done.+But+if+there+seem+to+be+general+promises%2C+it+must+be+confessed+on+the+other+part+that+they+are+such+that+the+promise+of+eternal+life+should+not+only+seem+to+come+under%2C+but+also+by+the+intention+it+ought+to+be+believed+to+have+come+under+them%E2%80%9D+%28Episcopius%2C+%E2%80%9CInstitutiones+theologicae%2C%E2%80%9D+3.4.1+Opera+theologica+%5B1678%5D%2C+p.+156%29.+Of+the+Anabaptists.+IV.+Many+Anabaptists+fall+into+the+same+error%2C+as+is+evident+from+the+Frankenthal+Colloquy+where+they+speak+of+the+Israelite+people+as+if+they+were+a+herd+of+swine%2C+whom+they+jestingly+say+were+fattened+on+this+earth+by+the+Lord+without+any+hope+of+heavenly+immortality+%28Protocoll+%E2%80%A6+Frankenthal%2C+Art.+15%2C+16+%5BJ.+Meier%2C+1573%5D%2C+pp.+292%E2%80%93335%29.+They+maintain+that+only+temporal+goods+and+earthly+promises+were+granted+to+them.+This+was+also+the+impious+notion+of+Servetus%2C+against+whom+Calvin+solidly+disputes+%28Institutes+of+the+Christian+Religion%2C+2.10+pp.+428%E2%80%9349%29.+Statement+of+the+question.+V.+From+these+things+the+state+of+the+question+can+clearly+be+gathered.+The+question+is+not%3A+%281%29+whether+the+covenant+of+grace+was+various+as+to+accidentals+and+the+different+modes+and+degrees+of+dispensation+and+manifestation+%28for+we+confess+that+under+this+relation+%5Bschesei%5D+there+is+a+multiple+difference+between+the+Old+and+New+Testament+or+the+old+and+new+economy%2C+as+will+be+proved+in+its+proper+place%29.+Rather+the+question+is+whether+it+was+the+same+as+to+substance+and+the+essential+parts+of+the+covenant%2C+i.e.%2C+both+as+to+the+covenanted+themselves+and+as+to+the+federal+pact+consisting+in+the+mutual+obligation+of+the+parties.+Whether+the+same+Mediator+%28Christ%29+in+both%3B+the+same+faith+in+Christ%3B+promises+of+the+same+spiritual+and+heavenly+blessings%3B+the+same+way+of+reconciliation+and+salvation%E2%80%94the+economy+and+administration+only+of+the+covenant+varying.+This+our+opponents+deny%3B+we+affirm.+VI.+The+question+is+not+whether+the+fathers+of+the+Old+Testament+were+saved%2C+whether+their+sins+were+pardoned%2C+whether+they+had+any+hope+of+eternal+life%2C+whether+Christ+was+predicted+to+them.+Most+of+our+adversaries+do+not+dare+deny+this.+Rather+the+question+is+whether+they+looked+to+Christ+and+were+saved+in+the+hope+of+his+coming.+Whether+promises+not+only+temporal%2C+but+also+spiritual+and+heavenly+concerning+eternal+life+and+the+Holy+Spirit+were+given+to+them.+And+whether+the+same+covenant+entered+into+with+us+in+Christ+had+already+been+contracted+with+them%2C+although+more+obscurely+and+reservedly.+This+they+deny%3B+we+assert.+We+maintain+that+Christ+was+not+only+predicted+but+also+promised+to+the+fathers+and+by+his+grace+they+were+saved+under+the+Old+Testament+no+less+than+we+are+saved+under+the+New%3B+nor+was+any+other+name+given+under+heaven+even+from+the+beginning+from+which+salvation+could+be+hoped+for+%28Acts+4%3A12%29+and+that+too+according+to+the+inviolable+promise+of+the+gratuitous+covenant.+The+identity+of+the+covenant+is+proved%3A+%281%29+from+the+Scriptures.+VII.+The+reasons+are%3A+First%2C+in+general%2C+the+Scriptures+teach+that+the+covenant+of+grace+%28which+God+contracted+with+us+in+the+New+Testament%29+is+the+same+with+the+covenant+previously+made+with+Abraham.+Hence+Zachariah+says+in+his+song%2C+%E2%80%9CGod+visited+and+redeemed+his+people%2C+as+he+spake+by+the+mouth+of+his+holy+prophets%2C+which+have+been+since+the+world+began%3A+to+perform+the+mercy+promised+to+our+fathers%2C+and+to+remember+his+holy+covenant%3B+the+oath+which+he+sware+to+our+father+Abraham%E2%80%9D+%28Lk.+1%3A68%2C+70%2C+72%2C+73%29.+And+Peter+addressing+the+Jews+concerning+the+days+of+Christ+%28which+had+been+predicted+by+all+the+prophets%29+says%2C+%E2%80%9CYe+are+the+children+of+the+prophets%2C+and+of+the+covenant+which+God+made+with+our+fathers%2C+saying+unto+Abraham%2C+And+in+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed%E2%80%9D+%28Acts+3%3A25%29.+Paul+mentions+by+name+the+promise+of+the+gospel%3A+%E2%80%9CThe+Scripture%2C+foreseeing+that+God+would+justify+the+heathen+through+faith%2C+preached+before+the+gospel+unto+Abraham%2C+saying%2C+In+thee+shall+all+nations+be+blessed%E2%80%9D+%28Gal.+3%3A8%29.+Hence+he+brings+forward+the+justification+of+Abraham+by+faith+as+an+example+for+us+%28Rom.+4%3A3%29+and+exhibits+him+as+%E2%80%9Cthe+father+of+the+faithful%E2%80%9D+to+the+Jews+as+well+as+the+Gentiles+%28which+could+not+have+been+done+if+the+covenant+was+not+identical%29.+This+is+confirmed+by+the+fact+that+he+calls+the+promise+given+to+Abraham+%E2%80%9Cthe+covenant+that+was+before+confirmed+of+God+in+Christ%E2%80%9D+%28diath%C4%93k%C4%93n+prokekyr%C5%8Dmen%C4%93n+hypo+tou+Theou+eis+Christon%2C+Gal.+3%3A17%29.+2.+From+the+identity+of+the+covenant+of+grace.+VIII.+Second%2C+in+particular%2C+from+all+the+parts+of+the+covenant+of+grace+which+were+the+same+in+both+cases.+Such+is+the+clause+of+the+covenant+that+God+will+be+our+God+and+the+God+of+our+seed%3B+for+as+it+had+already+been+proposed+to+Abraham+%28Gen.+17%3A7%29+and+renewed+to+Moses+in+a+vision+%28Ex.+3%3A15%29+and+frequently+in+legislation%2C+confirmed+in+the+captivity+and+after+it+%28Ezk.+36%3A28%29%2C+so+no+other+was+proposed+in+the+covenant+of+grace+as+the+foundation+of+all+blessings%2C+spiritual+as+well+as+celestial+%28Mt.+22%3A32%3B+2+Cor.+6%3A16%3B+Rev.+21%3A3%29.+3.+From+the+identity+of+the+Mediator.+IX.+Third%2C+the+identity+of+the+Mediator+%28given+in+the+Old+and+New+Testament%29%2C+the+foundation+of+the+covenant.+He+is+the+blessed+seed+of+the+woman+who+would+bruise+the+serpent%E2%80%99s+head+%28Gen.+3%3A15+compared+with+Heb.+2%3A14+and+Rom.+16%3A20%29%2C+the+seed+of+Abraham+in+whom+all+the+nations+of+the+earth+were+to+be+blessed+%28Gen.+22%3A18%2C+viz.%2C+Christ%E2%80%94cf.+Gal.+3%3A16%29%3B+in+the+Old+Testament+%E2%80%9Cthe+angel+of+Jehovah%E2%80%99s+presence%E2%80%9D+%28Is.+63%3A9%29%2C+%E2%80%9Cthe+angel+of+the+covenant%E2%80%9D+%28Mal.+3%3A1%29%2C+%E2%80%9Ca+covenant+of+the+people+and+of+the+Gentiles%2C%E2%80%9D+i.e.%2C+its+Mediator+%28Is.+42%3A6%3B+49%3A8%29%2C+who+bore+the+griefs+of+his+people+and+was+smitten+for+their+sins+%28Is.+53%3A5%2C+6%29.+In+the+New+Testament%2C+he+is+the+Mediator+between+God+and+men+%281+Tim.+2%3A5%29%3B+the+Mediator+of+the+New+Testament+and+of+a+better+covenant+%28Heb.+8%3A6%3B+9%3A15%29%3B+%E2%80%9Cthe+same+yesterday%2C+today+and+forever%E2%80%9D+%28Heb.+13%3A8%29%3B+by+whose+grace+the+fathers%2C+no+less+than+we%2C+were+saved+%28Acts+15%3A10%2C+11%29%3B+to+whom+all+the+prophets+bore+testimony+%28Acts+10%3A43%29%3B+the+one+sole+name+given+under+heaven+by+which+we+can+be+saved+%28Acts+4%3A12%29%3B+the+Way%2C+the+Truth+and+the+Life%2C+so+that+no+one+can+come+to+the+Father+except+by+him+%28Jn.+14%3A6%29.+X.+The+objection+to+Heb.+13%3A8+is+vain.+Christ+is+said+to+be+%E2%80%9Cthe+same+yesterday%2C+today+and+forever%2C%E2%80%9D+and+it+is+supposed+either+that+it+treats+of+his+doctrine%2C+not+concerning+his+person+and+the+covenant+made+in+it.+If+a+doctrine+is+eternal%2C+therefore+also+the+person+who+delivers+it+and+the+covenant+proposed+in+it+is+eternal.+Or+it+is+supposed+that+%E2%80%9Cyesterday%E2%80%9D+denotes+the+day+of+his+flesh+before+his+ascension+and+%E2%80%9Ctoday%E2%80%9D+the+time+after+his+ascension.+This+is+repugnant+to+the+aim+of+Paul%2C+which+is+to+exhort+to+constancy+of+faith%2C+the+argument+being+drawn+from+the+identity+and+perpetuity+of+the+gospel+doctrine%2C+of+which+Christ+as+Mediator+is+the+object.+Or+that+by+%E2%80%9Ctoday%E2%80%9D+and+%E2%80%9Cyesterday%E2%80%9D+is+denoted+a+thing+new+and+recent+which+commenced+not+very+long+ago+%28as+men+are+said+to+be+of+%E2%80%9Cyesterday%E2%80%9D+in+Job+8%3A9+and+among+the+Greeks+eph%C4%93meroi+%5B%E2%80%9Cbeings+of+a+day%E2%80%9D%5D+on+account+of+the+shortness+of+their+lives%29.+The+expressions+are+very+dissimilar.+To+be+mthmvl+%28%E2%80%9Cfrom+yesterday+and+the+day+before%E2%80%9D%29+depresses+human+nature.+But+here+Christ+is+said+to+have+been+yesterday+and+to+be+today+and+forever+through+all+the+differences+of+time%2C+to+denote+his+glory+and+eternity.+Nor+is+he+only+said+to+be+yesterday%2C+today+and+forever%2C+but+the+same%2C+i.e.%2C+not+different%2C+either+now+or+then+or+afterwards%3B+but+always+and+everywhere+the+same+Jesus+Christ.+This+could+not+be+said+if+Christ+had+not+even+from+the+beginning+been+the+Mediator+of+the+covenant+of+grace+and+the+Prophet+and+teacher+of+the+church.+XI.+Acts+15%3A11+cannot+be+understood+of+the+apostles+compared+with+the+converted+Gentile+believers+and+not+with+the+fathers+of+the+Old+Testament+%28as+they+maintain%29.+For+Peter+had+spoken+proximately+of+the+fathers+and+so+the+following+words+are+fitly+referred+to+them%E2%80%94%E2%80%9CBut+we+believe+that+through+the+grace+of+the+Lord+Jesus+Christ%2C+we+shall+be+saved%2C+even+as+they+%28kath%E2%80%99+hon+tropon+kakeinoi%29.%E2%80%9D+%282%29+The+design+of+Peter+demands+this.+He+wishes+to+prove+that+the+yoke+of+the+ceremonial+law+is+not+to+be+placed+on+the+necks+of+the+Gentiles+for+this+reason%E2%80%94that+the+fathers+themselves+could+not+bear+it%2C+but+were+saved+by+the+same+grace+of+Christ+as+we.+%283%29+If+the+apostles+had+wished+to+join+themselves+with+the+Gentiles+in+the+manner+of+salvation%2C+they+would+not+have+said+we+believe+that+we+are+saved+even+as+they%3B+but+rather+vice+versa%2C+they+even+as+we.+It+did+not+become+the+apostles+to+follow+the+Gentiles+and+to+set+these+before+themselves+as+an+example+in+the+manner+of+salvation%2C+but+the+contrary.+%284%29+Nor+is+it+absurd+for+Peter+%28discoursing+concerning+the+manner+in+which+the+Gentiles+should+obtain+salvation%29+to+end+with+an+argument+taken+from+the+fathers%2C+because+there+is+one+method+of+salvation+for+all.+If+the+yoke+of+the+law+was+insufferable+%28abastakton%29+to+the+fathers%2C+it+is+rightly+inferred+that+the+Gentiles+are+not+to+be+subjected+to+that+yoke.+XII.+It+is+also+falsely+alleged+that+the+words+%E2%80%9CThere+is+none+other+name+under+heaven+given+among+men%2C+whereby+we+must+be+saved%E2%80%9D+%28Acts+4%3A12%29+refer+only+to+the+time+in+which+Christ+was+manifested+and+cannot+be+extended+to+the+past.+The+words+themselves+disprove+this+interpretation.+They+do+not+assert+that+there+is+now+no+name+given+to+men+whereby+they+can+be+saved%2C+but+that+no+name+is+given+among+men+%28en+anthr%C5%8Dpois%29+in+all+time.+The+thing+itself+demands+this.+For+since+no+salvation+can+be+granted+to+the+sinner+without+a+mediator+%28and+there+is+no+mediator+except+Christ%29%2C+it+follows+either+that+the+fathers+had+no+salvation+or+that+they+were+saved+by+Christ.+Nor+if+the+words+are+used+in+the+present%2C+are+the+past+or+the+future+excluded%3B+but+this+is+done+that+the+truth+of+the+mediation+of+Christ+may+be+predicated+of+all+time.+XIII.+The+words+%E2%80%9Cfrom+the+foundation+of+the+world%E2%80%9D+%28apo+katabol%C4%93s+kosmou%2C+Rev.+13%3A8%29+are+not+to+be+separated+from+those+which+immediately+precede+%28%E2%80%9Cthe+Lamb+slain%E2%80%9D%29+and+to+be+joined+with+%E2%80%9Cthe+book+of+life%E2%80%9D+by+transposition+%28as+is+the+case+in+Rev.+17%3A8%29.+%281%29+There+is+no+necessity+for+such+a+transposition+doing+violence+to+the+series+of+the+discourse%2C+which+flows+far+more+smoothly+when+we+thus+read%E2%80%94%E2%80%9Cwhose+names+are+not+written+in+the+book+of+life+of+the+Lamb+slain+from+the+foundation+of+the+world%E2%80%9D%E2%80%94than+according+to+the+wish+of+our+opponents%E2%80%94%E2%80%9Cwhose+names+are+written+from+the+foundation+of+the+world+in+the+book+of+life+of+the+Lamb+slain.%E2%80%9D+For+as+the+book+of+life+is+said+%E2%80%9Cto+be+the+book+of+life+of+the+Lamb%E2%80%9D+%28Rev.+21%3A27%29%2C+it+ought+not+to+be+torn+away+from+the+words+%E2%80%9Cof+the+Lamb+slain%E2%80%9D+%28arniou+esphagmenou%29.+%282%29+%E2%80%9CThe+Lamb+slain%E2%80%9D+is+nowhere+put+by+itself%2C+but+mention+is+always+made+either+of+the+time+from+which+or+of+the+persons+for+whom+%28or+for+what+causes%29+he+was+slain.+%283%29+It+is+most+properly+said+%E2%80%9Cslain+from+the+foundation+of+the+world%E2%80%9D%3B+not+in+himself%2C+but+intentionally%2C+in+the+decree+of+God%3B+objectively%2C+in+the+promises+of+the+word+and+the+faith+of+the+fathers%3B+typically%2C+in+sacraments+and+sacrifices.+%284%29+Even+granting+that+the+words+are+to+be+so+explained%2C+the+force+of+the+argument+is+not+destroyed+because+no+one+can+be+written+in+the+book+of+life%2C+except+in+Christ+slain+%28or+in+his+death%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+192%E2%80%9396+%2812.5.1%E2%80%9313%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0666632e20.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0666632e20.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/turretin-we-affirm-the-unity-of-the-covenant-of-grace-against-the-socinians-remonstrants-and-anabaptists/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>IV. IN WHAT DO THE OLD AND THE NEW COVENANT AGREE, AND IN WHAT DO THEY DIFFER? Since there is but one covenant, and the Scriptures speak of it as though it were two, we must consider in what particulars the old and the new covenants agree and in what they differ. They agree, 1. In having God as their author and Christ as the Mediator. But Moses, some say, was the Mediator of the Old covenant. To this we reply, that he was Mediator only as a type of Christ, who was even then already Mediator, but is now the only Mediator without any type; for Christ having come in the flesh, is no longer covered with types. 2. In the promise of grace concerning the remission of sins, and eternal life granted freely to such as believe by and for the sake of Christ, which promise was common to those who lived under the old covenant, as well as to us; although it is now delivered more clearly, for God promises the same grace to all that believe in the Mediator. “The seed of the woman shall bruise the serpent’s head.” “I will be a God unto thee and thy seed.” “He that believeth on the Son hath everlasting life.” “But we believe that through the grace of the Lord Jesus Christ, we shall be saved even as they.” (Gen. 3:15; 17:7. John 3:36. Acts 15; 11.) We here speak of the promise of grace in general, and not of the circumstances of grace particularly. 3. In the condition in respect to ourselves. In each covenant, God requires from men faith and obedience. “Walk before me and be thou perfect.” “Repent and believe the gospel.” (Gen. 17:1. Mark 1:15.) The new covenant, therefore, agrees with the old in that which relates to the principal conditions, both on the part of God, and on the part of man. The two covenants differ, 1. In the promises of temporal blessings. The old covenant had many special promises in relation to blessings of a temporal character, such as the promise of the land of Canaan, which was to be given to the Church—the form of the ceremonial worship, and of the Mosaic polity, which were to be preserved in the land even to the time of the Messiah—the birth of the Messiah from that people, &amp;c. But the new covenant has no such special promises of temporal blessings, but only such as are general, because God will preserve his church even to the end, and will always provide for it a certain resting place. 2. In the circumstance of the promise of grace. In the old covenant, the faithful were received into the favor of God, on account of the Messiah that was to come, and the sacrifice which he would offer; in the new, the same blessing is obtained for the sake of the Messiah who has already come, and for the sacrifice which he has already offered in our behalf. 3. In the rites, or signs, which are added to the promise of grace. In the old covenant the sacraments were various, and painful, such as circumcision, the passover, oblations and sacrifices. In the new, there are only two sacraments—Baptism and the Lord’s Supper—both of which are simple and significant. 4. In clearness. The old had types and shadows of good things to come. All was typical, as the priests, sacrifices, &amp;c. Hence every thing was more obscure and unintelligible. In the new, we have a fulfillment of all these types, so that every thing is clearer and better understood, both in regard to the sacraments and the doctrine which is revealed. 5. In the gifts which they confer. In the old, the effusion of the Holy Spirit was small and limited; in the new, it is large and full. “I will make a new covenant.” “If the ministration of condemnation be glory, much more,” &amp;c. “I will pour out my Spirit upon all flesh.” (Jer. 31:31. 2 Cor. 3:5. Joel 2:28.) 6. In duration. The old was to continue only until the coming of the Messiah; but the new will continue forever. “I will make an everlasting covenant with them.” (Jer. 32:40.) 7. In their obligation. The old bound the people to the whole law, the moral, ceremonial, and judicial; the new binds us only to the moral, and to the use of the sacraments of Christ. 8. In their extent. In the old covenant, the church was confined to the Jewish nation, to which it became all those who would be saved to unite themselves. In the new, the church is established among all nations, and is open to all that believe of every nation, rank, condition, or language. Remark. The old testament, or covenant, is often used in Scripture by a figure of speech, called synecdoche, (in which a part is taken for the whole,) for the law, with respect to that part which is especially treated of. For in the old covenant, the law was enforced more strenuously, and there were many parts of it. The gospel was also more obscure. The new testament, or covenant, on the other hand, is for the most part taken for the gospel, because in the new a great part of the law is abrogated, and the gospel is here more clearly revealed</p></blockquote>

udicial; the new binds us only to the moral, and to the use of the sacraments of Christ. 8. In their extent. In the old covenant, the church was confined to the Jewish nation, to which it became all those who would be saved to unite themselves. In the new, the church is established among all nations, and is open to all that believe of every nation, rank, condition, or language. Remark. The old testament, or covenant, is often used in Scripture by a figure of speech, called synecdoche, (in which a part is taken for the whole,) for the law, with respect to that part which is especially treated of. For in the old covenant, the law was enforced more strenuously, and there were many parts of it. The gospel was also more obscure. The new testament, or covenant, on the other hand, is for the most part taken for the gospel, because in the new a great part of the law is abrogated, and the gospel is here more clearly revealed”

5.%29+The+new+covenant%2C+therefore%2C+agrees+with+the+old+in+that+which+relates+to+the+principal+conditions%2C+both+on+the+part+of+God%2C+and+on+the+part+of+man.+The+two+covenants+differ%2C+1.+In+the+promises+of+temporal+blessings.+The+old+covenant+had+many+special+promises+in+relation+to+blessings+of+a+temporal+character%2C+such+as+the+promise+of+the+land+of+Canaan%2C+which+was+to+be+given+to+the+Church%E2%80%94the+form+of+the+ceremonial+worship%2C+and+of+the+Mosaic+polity%2C+which+were+to+be+preserved+in+the+land+even+to+the+time+of+the+Messiah%E2%80%94the+birth+of+the+Messiah+from+that+people%2C+%26c.+But+the+new+covenant+has+no+such+special+promises+of+temporal+blessings%2C+but+only+such+as+are+general%2C+because+God+will+preserve+his+church+even+to+the+end%2C+and+will+always+provide+for+it+a+certain+resting+place.+2.+In+the+circumstance+of+the+promise+of+grace.+In+the+old+covenant%2C+the+faithful+were+received+into+the+favor+of+God%2C+on+account+of+the+Messiah+that+was+to+come%2C+and+the+sacrifice+which+he+would+offer%3B+in+the+new%2C+the+same+blessing+is+obtained+for+the+sake+of+the+Messiah+who+has+already+come%2C+and+for+the+sacrifice+which+he+has+already+offered+in+our+behalf.+3.+In+the+rites%2C+or+signs%2C+which+are+added+to+the+promise+of+grace.+In+the+old+covenant+the+sacraments+were+various%2C+and+painful%2C+such+as+circumcision%2C+the+passover%2C+oblations+and+sacrifices.+In+the+new%2C+there+are+only+two+sacraments%E2%80%94Baptism+and+the+Lord%E2%80%99s+Supper%E2%80%94both+of+which+are+simple+and+significant.+4.+In+clearness.+The+old+had+types+and+shadows+of+good+things+to+come.+All+was+typical%2C+as+the+priests%2C+sacrifices%2C+%26c.+Hence+every+thing+was+more+obscure+and+unintelligible.+In+the+new%2C+we+have+a+fulfillment+of+all+these+types%2C+so+that+every+thing+is+clearer+and+better+understood%2C+both+in+regard+to+the+sacraments+and+the+doctrine+which+is+revealed.+5.+In+the+gifts+which+they+confer.+In+the+old%2C+the+effusion+of+the+Holy+Spirit+was+small+and+limited%3B+in+the+new%2C+it+is+large+and+full.+%E2%80%9CI+will+make+a+new+covenant.%E2%80%9D+%E2%80%9CIf+the+ministration+of+condemnation+be+glory%2C+much+more%2C%E2%80%9D+%26c.+%E2%80%9CI+will+pour+out+my+Spirit+upon+all+flesh.%E2%80%9D+%28Jer.+31%3A31.+2+Cor.+3%3A5.+Joel+2%3A28.%29+6.+In+duration.+The+old+was+to+continue+only+until+the+coming+of+the+Messiah%3B+but+the+new+will+continue+forever.+%E2%80%9CI+will+make+an+everlasting+covenant+with+them.%E2%80%9D+%28Jer.+32%3A40.%29+7.+In+their+obligation.+The+old+bound+the+people+to+the+whole+law%2C+the+moral%2C+ceremonial%2C+and+judicial%3B+the+new+binds+us+only+to+the+moral%2C+and+to+the+use+of+the+sacraments+of+Christ.+8.+In+their+extent.+In+the+old+covenant%2C+the+church+was+confined+to+the+Jewish+nation%2C+to+which+it+became+all+those+who+would+be+saved+to+unite+themselves.+In+the+new%2C+the+church+is+established+among+all+nations%2C+and+is+open+to+all+that+believe+of+every+nation%2C+rank%2C+condition%2C+or+language.+Remark.+The+old+testament%2C+or+covenant%2C+is+often+used+in+Scripture+by+a+figure+of+speech%2C+called+synecdoche%2C+%28in+which+a+part+is+taken+for+the+whole%2C%29+for+the+law%2C+with+respect+to+that+part+which+is+especially+treated+of.+For+in+the+old+covenant%2C+the+law+was+enforced+more+strenuously%2C+and+there+were+many+parts+of+it.+The+gospel+was+also+more+obscure.+The+new+testament%2C+or+covenant%2C+on+the+other+hand%2C+is+for+the+most+part+taken+for+the+gospel%2C+because+in+the+new+a+great+part+of+the+law+is+abrogated%2C+and+the+gospel+is+here+more+clearly+revealed%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Commentary+of+Dr.+Zacharias+Ursinus+on+the+Heidelberg+Catechism%2C+trans.+G.+W.+Willard+%28Cincinnati%2C+OH%3A+Elm+Street+Printing+Company%2C+1888%29%2C+99%E2%80%93100+%5Bcommenting+on+Heidelberg+Catechism+18%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd74c51345e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d <blockquote><p>The Covenant of Grace Identical in both Old and New Testaments Question #1: When was this covenant of grace initiated? Answer: Due to a misunderstanding concerning the nature of the covenant of grace, the Socinians and Arminians, who are in this respect like-minded, claim that it did not exist in the Old Testament. Although they admit that it was announced that a Savior would come at a given time, and that a covenant of grace would be established at a given time, they claim that there was no such covenant during the Old Testament dispensation. They claim that those living in that dispensation were not partakers of this covenant, did not receive any promises concerning eternal salvation, and did not receive eternal life by faith and hope in a future Savior. Instead, they received it by grace, that is, on the basis of their virtuousness. To this we respond that, although the administration of the covenant was very different in both testaments, this covenant, as far as essence is concerned, existed as well in the Old Testament—being initiated with Adam—as presently in the New Testament. Proof #1: This is first of all confirmed by the fact that immediately after the fall this covenant was established in Paradise by way of the promise in Genesis 3:15, “It (the seed of the woman) shall bruise thy head (the serpent).” This Seed of the woman is the Lord Jesus, who without the involvement of a man was born of the Virgin Mary. Such never has been nor ever shall be true for any man. Christ alone, and no one else, has bruised the head of the serpent, that is, the devil. “That through death He might destroy him that had the power of death, that is, the devil” (Heb. 2:14); “For this purpose the Son of God was manifested, that He might destroy the works of the devil” (1 John 3:8). Christ, the Seed of the woman, who would bruise the head of the devil, is promised here, which can be deduced from the threat made to the serpent. This promise was not addressed to Adam and Eve, but only within their hearing. From this it follows that the covenant of grace was not established with Adam and Eve, and in them with all their descendants as was true for the covenant of works. Rather, Adam and Eve, hearing this promise, had to receive the promised Savior for themselves in order to be comforted, as every believer has done subsequent to the giving of this promise, which shall become evident in what follows. Proof #2: The gospel, which is the offer of this covenant, is proclaimed in the Old Testament as well as in the New Testament. “And the Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8). He said “in thee,” that is, in thy Seed, which is Christ. “He saith not, And to seeds, as of many; but as of one, And to thy Seed, which is Christ” (Gal. 3:16). Abraham believed this good news, not for the heathen who still would come and believe, but for himself. It was to his personal benefit, it being unto justification, which is an acquittal from guilt and punishment, and a granting of the right unto eternal life. This is confirmed in Genesis 15:6, “And he believed (note: not “the LORD,” but) in the LORD; and he counted it to him for righteousness”; “And the Scripture was fulfilled which saith, Abraham believed God, and it was imputed unto him for righteousness: and he was called the friend of God” (James 2:23). That the gospel was proclaimed to him was not an extraordinary privilege afforded to Abraham alone. The church of the Old Testament had the identical privilege, which is evident from Hebrews 4:2a, “For unto us was the gospel preached, as well as unto them.” It is proclaimed to us in order that we would receive it to our benefit, and thus likewise also to their benefit. The reason why many did not profit from this was not to be attributed to the fact that it was not offered unto them, but due to their not receiving it by faith. “But the Word preached did not profit them, not being mixed with faith in them that heard it” (Heb. 4:2b). Thus, in the Old Testament dispensation Christ was proclaimed and offered in the gospel, and everyone was obligated by means of this gospel to believe in Christ unto justification as Abraham did. The covenant of grace therefore existed in the Old Testament. Observe this also in reference to Moses. “By faith Moses, when he was come to years, refused to be called the son of Pharaoh’s daughter, esteeming the reproach of Christ greater riches than the treasures in Egypt: for he had respect unto the recompense of the reward” (Heb. 11:24, 26). Moses knew Christ, believed in Christ, esteemed Christ as being precious, and had the promises in view through Christ. This chapter enumerates an entire register of Old Testament believers, and the benefits of which they became partakers by faith in Christ. Proof #3: The Surety of the covenant was equally efficacious in the Old Testament as in the New, and thus this covenant existed then as well as now. “Jesus Christ the same yesterday, and to-day, and for ever” (Heb. 13:8). “Today” refers to the present time, “for ever” refers to the future, and “yesterday” refers to the past. The apostle does not merely state that Christ was, is and shall be, but he says that Christ has always been the same; that is, unto reconciliation, comfort, and help. Therefore one ought not to faint under oppression. By “yesterday” we cannot understand the time immediately prior to Paul, that is, the period of Christ’s sojourn upon earth. It is very evident that the apostle exhorts the believers to be steadfast, since Christ at all times—that is, as soon as the church came into existence and as long as the church shall exist—is the same faithful Savior. “Yesterday” therefore refers to the time prior to Christ’s incarnation, which also is confirmed by the statement that Christ has been slain before the foundation of the world. “Whose names are not written in the book of life of the Lamb slain from the foundation of the world” (Rev. 13:8). The words “from the foundation of the world” may not be made to relate to the words “whose names are not written in the book of life.” There is no need to go back to that earlier phrase, and Christ never is said to be slain without any modifying statement. Even if one were to interpret these words as such, namely, “whose names are not written in the book of life of the Lamb before the foundation of the world,” it remains an established fact that there was a book from before the foundation of the world in which the names of believers were written. This is the book of the Lamb, that is, of Christ, and thus Christ’s death is noted as being efficacious at that time, since no one can be written in that book except it be for the efficacy of His death by being slain. It is very simple and clear, however, that one should join the words as the apostle does: “the Lamb, slain from the foundation of the world.” Question: But in what manner has Christ been slain since that time? The apostle appears to contradict this in Hebrews 9:26, where we read, “For then must He often have suffered since the foundation of the world.” Answer: The apostle shows that the death of Christ had to occur but once, and that this one sacrifice was efficacious from the foundation of the world. He thus forcefully confirms that this one death of Christ already was efficacious then, this being such as if He both at that time and since that time had actually suffered. He thus confirms that Christ is the same yesterday and today. Christ was not slain actuality from the foundation of the world, but rather as far as the efficacy of His sacrifice was concerned. From that moment believers believed in Him through the sacrifices, wherein they beheld the death of the Savior to come, and received Him by faith unto justification. This was true of Abel and Enoch, for we read, “By faith Abel offered unto God a more excellent sacrifice than Cain, by which he obtained witness that he was righteous, for before his translation he had this testimony that he pleased God” (Heb. 11:4–5). Abel sacrificed in faith, Abel pleased God, and Abel was righteous. This expresses irrefutably that Abel saw Christ represented in his sacrifice. Proof #4: Believers in the Old Testament had all the spiritual benefits of the covenant of grace, and thus they, as is true for us in the New Testament, had the covenant itself. (1) God was their God and their Father. “I am the LORD thy God” (Exo. 20:2); “I am thy God” (Isa. 41:10); “But now, O LORD, thou art our Father” (Isa. 64:8); “Wilt thou not from this time cry unto Me, My Father?” (Jer. 3:4). (2) They had the forgiveness of sins. “As for our transgressions, Thou shalt purge them away” (Psa. 65:3); “Thou forgavest the iniquity of my sin. Selah” (Psa. 32:5). (3) They had the spirit of adoption unto children, “to whom pertaineth the adoption” (Rom. 9:4); “We having the same Spirit of faith” (2 Cor. 4:13); “Thy Spirit is good; lead me into the land of uprightness” (Psa. 143:10). (4) They had peace of conscience with God. “Thou hast put gladness in my heart” (Psa. 4:7); “Truly my soul waiteth upon God” (Psa. 62:1). (5) They had childlike communion with God. “When I awake, I am still with Thee” (Psa. 139:18); “But it is good for me to draw near to God” (Psa. 73:28). (6) They were partakers of sanctification. “O how love I Thy law! it is my meditation all the day” (Psa. 119:97). (7) After death they entered eternal bliss, for which they longed. “For he looked for a city which hath foundations. But now they desire a better country, that is, an heavenly” (Heb. 11:10, 16). They were the recipients of this salvation. “But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they” (Acts 15:11). The apostle neither refers here to the heathen, nor does he elevate the salvation of the heathen above the salvation of the Jews, but his reference was to the fathers who could not bear the yoke and nevertheless were saved by faith. From this he affirms that their expectation of salvation was also by faith and not by the works of the ceremonial law. From this he concludes that one must not impose the requirement of circumcision and the keeping of the ceremonial law upon the Gentiles. From all this it is evident that believers under the Old Testament enjoyed the benefits of the covenant of grace, had the covenant itself and were partakers of the same covenant with us, having all eaten the same spiritual meat and having drunk the same spiritual drink (1 Cor. 10:3–4). Therefore the apostle Peter called the Jewish nation, “The children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Objection #1: In the Old Testament believers did not receive the promises, “not having received the promises” (Heb. 11:13). Answer: The promises to which the apostle here refers have reference to the incarnation of Christ, which they saw from afar, believed, and embraced. Objection #2: “For the law made nothing perfect” (Heb. 7:19). Answer: The ceremonial laws to which the apostle refers here lacked efficacy of satisfaction, but did point to Christ. They were a stimulus for a better hope. By faith in a Messiah to come they were perfect in Him (Col. 2:13). Objection #3: In Hebrews 9:8 we read “that the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing.” Answer: Christ is the way (John 14:6). Christ consecrated the way to God and to glory through the veil, that is to say, His flesh (cf. Heb. 10:19–20). The text states that as long as the ceremonies were still in effect, Christ had not yet actually paid the ransom, nor merited salvation for His own. When this occurred, however, these ceremonies no longer served a purpose. The apostle does not say that no one entered heaven during that time period, which is something most opposing parties would not dare to deny. Enoch, Elijah, Moses, Abraham, Isaac, and Jacob would rebuke them. Neither does the apostle state that the way to heaven was not known as yet, for whoever possesses faith, hope, and love, also knows the way. He stated rather that Christ Himself—who would accomplish that which the entire tabernacle service could not bring to pass, that is, the salvation of sinners—had not yet come in the flesh. Objection #4: The apostle stated that Christ “hath abolished death, and hath brought life and immortality to light through the gospel” (2 Tim. 1:10). Thus light and life were not present prior to Christ’s incarnation. Answer: The text indeed states that Christ is He who has brought life and immortality to light. It does not mention, however, that Christ did this only subsequent to His incarnation, and not prior to His coming. We have shown above that Christ, who is the same yesterday and today, was thus engaged in the Old Testament, the gospel having been proclaimed also during that time. This text, however, refers to the measure of revelation, and to the revelation of the gospel unto the Gentiles, which, prior to this, had only occurred in Israel. This is confirmed in verse 11, where we read, “Whereunto I am appointed a preacher, and an apostle, and a teacher of the Gentiles.” The apostle states this expressly when he says, “Which in other ages was not made known unto the sons of men, as it is now revealed … that the Gentiles should be fellow heirs.… Unto me, who am less than the least of all saints, is this grace given, that I should preach among the Gentiles the unsearchable riches of Christ” (Eph. 3:5–6, 8). In like manner Acts 16:25–26 is to be understood, where we read, “… according to the revelation of the mystery, which was kept secret since the world began, but now is made manifest, and by the scriptures of the prophets, according to the commandment of the everlasting God, made known to all nations for the obedience of faith.” From this it is evident that there is not a distinction between the Old and the New Testament as far as the way of salvation is concerned, but the distinction is between the Jewish nation, which at that time was the only recipient of revelations, and the Gentiles who now have the very same revelation. Objection #5: Consider the following texts. “And these all, having obtained a good report through faith, received not the promise, God having provided some better thing for us, that they without us should not be made perfect” (Heb. 11:39–40); “Unto whom it was revealed, that not unto themselves, but unto us they did minister the things” (1 Pet. 1:12). It is evident from these texts that they who lived during the Old Testament period did not partake of these benefits. Answer: These texts expressly refer to the incarnation of Christ, it being evident that these promises were not received while these saints lived. They proclaimed that Christ at one time would come, but that they did not expect Him during their time. In this respect they did not minister unto themselves but unto us who live subsequent to the coming of Christ, and may behold and enjoy the fulfillment of that promise. And thus we enjoy better things than they; that is, they are better since the fulfillment of the promise is better than the promise itself. It thus follows that these texts do not refer to the enjoyment of the benefits of the covenant, for they were partakers of this as much as we are (which has already been shown); the apostle pointed to this in the text itself when he stated, “that they without us should not be made perfect.” They thus were made perfect, not by the works of the law, but through Christ, whose coming they had in the promises of which we have the fulfillment. They were therefore not saved on any different basis than we, for we and they are saved by the very same Surety. The New Testament is superior to the Old Testament only as far as administration is concerned.</p></blockquote>

<blockquote><p>[399] But a great many Reformed theologians believed otherwise and answered the above question in the affirmative. In their opinion, the answer to Christ’s prayer (John 11:42; Heb. 5:7) and especially the entire state of exaltation from the resurrection to his coming again for judgment is a reward for the work that he accomplished as the Servant of the Lord in the days of his humiliation. And, given the teaching of Scripture, no other answer is possible. For over and over it presents the state of humiliation as the way and the means by which alone Christ can attain his exaltation (Isa. 53:10–12; Matt. 23:12; Luke 24:26; John 10:17; 17:4–5; Phil. 2:9; Heb. 2:10; 12:2). The preposition διο (therefore) in Philippians 2:9 refers not to the order and logic but specifically to the meritorious cause of the exaltation. Because Christ humbled himself so deeply, therefore God has so highly exalted him. Especially the Letter to the Hebrews repeatedly puts a heavy accent on this meritorious connection between Christ’s humiliation and exaltation (1:3; 2:9–10; 5:7–10; 10:12; 12:2). Christ himself was “sanctified” by suffering. This does not mean that he was consecrated to God or made morally perfect; it means “perfected, brought to full wisdom and maturity,” made τελειος, which consists in his now being crowned with honor and glory (2:9), being seated as high priest at the right hand of Majesty in the highest heaven (8:1), having attained the joy for which he endured the cross and despised the shame (12:2), and becoming the source of eternal salvation to all who obey him (5:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 3, trans. John Bolt and John Vriend, (Grand Rapids: Baker Academic, 2006), 433–34.</span></figcaption>

</figure><figure class="quote" id="q-8b4e8e37a6" data-kw="">
<blockquote><p>16. For God so loved the world. Christ opens up the first cause, and, as it were, the source of our salvation, and he does so, that no doubt may remain; for our minds cannot find calm repose, until we arrive at the unmerited love of God. As the whole matter of our salvation must not be sought any where else than in Christ, so we must see whence Christ came to us, and why he was offered to be our Saviour. Both points are distinctly stated to us: namely, that faith in Christ brings life to all, and that Christ brought life, because the Heavenly Father loves the human race, and wishes that they should not perish. And this order ought to be carefully observed; for such is the wicked ambition which belongs to our nature, that when the question relates to the origin of our salvation, we quickly form diabolical imaginations about our own merits. Accordingly, we imagine that God is reconciled to us, because he has reckoned us worthy that he should look upon us. But Scripture everywhere extols his pure and unmingled mercy, which sets aside all merits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, vol. 1 (Bellingham, WA: Logos Bible Software, 2010), 122–123.</span></figcaption>

</figure><figure class="quote" id="q-d3d133a57a" data-kw="">
<blockquote><p>I.I.XV. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore man’s glorying is not excluded, but he may glory as a faithful servant may do upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man in himself ungodly is considered in the covenant, as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. I.IX.XVI. The second thing, which we said, § II. was immutable in the covenant of works, was this; that eternal life was not obtainable on any other condition but that of perfect obedience: as may thus be invincibly proved: for, by virtue of this general rule, it was necessary for Christ to be made under the law, Gal. iv. 4. and fulfil all righteousness, and that for this end, that the righteousness of the law might be fulfilled, Rom. viii. 4. But if this righteousness had not been sacred and inviolable, Christ would have been under no necessity to submit to the covenant of the law, in order to merit eternal life for his people. This therefore is evident, that there ought to be a merit of perfect obedience on which a right to eternal life may be founded. Nor is it material whether that perfect obedience be performed by man himself, or by his surety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite></span></figcaption>

itsius-on-merit/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-33e23ef31c" data-kw="">
<blockquote><p>If Adam had stood, and performed all things [of the law], he would even have merited, but I. not by condign merit, as if either his person, or his works would have been worthy of so great a reward. There is no creature, though perfect, who can merit this way in the presence of God. 1) Because we owe everything to God. Lk. 17:10. 2) No one is able to bring obligation upon God since he would be El Shaddai, God the sufficient one. Gen. 17. See Job 22: 2. 3) Whatever good things a man has, it is from God. Phil. 2:13; Ac. 17:28; 1 Cor. 4:7. 4) Nothing is given proportionately between the work of creatures, and the enjoyment of God.

II. It would not even have been by congruent merit, certainly because of the extraordinary gifts, which he had received from God. 1) Because God is not a respecter of persons, whom he made able by the particular gifts. 2) Because there was no grace in the case of Adam, the one building favour, when everything he would have was from God. Merit, therefore, was to its extent by the covenant, following the stipulation of the covenant, by the mere good pleasure of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doctrina Foederum sive Systema Theologiae</cite>, (Amsterdam: Abraham van Someren, 1691), pp 259–60. Quoted in and translated by Harrison Perkins, Catholicity and the Covenant of Works: James Ussher and the Reformed Tradition, Oxford Studies in Historical Theology (New York: Oxford University Press, 2020), pp 105-06.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

asquotes.github.io%2Fquote%2F33e23ef31c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/33e23ef31c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/07/01/johannes-braun-on-covenantal-merit-in-relation-to-adam/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-f351227e9d" data-kw="">
<blockquote><p>Another reason which may be briefly mentioned for the fact that the atoning death of Jesus is a ground of prayer lies in the consideration that it properly merits a hearing for the petitions of those who trust in Him. The co-presence of His divine nature with His human rendered His sacrifice of Himself infinitely valuable and meritorious. He through the eternal Spirit, says the apostle, offered Himself without spot to God. His divine nature was the altar which sustained the gift of His human nature and sanctified it to the great end for which it was sacrificed. The prayers of the believer, though worthless in themselves, are, when laid upon the sacrifice of Christ, sanctified by the same altar. The infinite merits of the atonement of Jesus impart worth and dignity to his petitions, purchase for them audience with God, and lend them their own rich perfume as they ascend before the throne of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grounds of Prayer in George A. Blackburn (ed.), Sermons by Rev. John L. Girardeau, D.D., LL.D., Late Professor in the Theological Seminary, Columbia, S.C.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“Another reason which may be briefly mentioned for the fact that the atoning death of Jesus is a ground of prayer lies in the consideration that it properly merits a hearing for the petitions of those who trust in Him. The co-presence of His divine nature with His human rendered His sacrifice of Himself infinitely valuable and meritorious. He through the eternal Spirit, says the apostle, offered Himself without spot to God. His divine nature was the altar which sustained the gift of His human nature and sanctified it to the great end for which it was sacrificed. The prayers of the believer, though worthless in themselves, are, when laid upon the sacrifice of Christ, sanctified by the same altar. The infinite merits of the atonement of Jesus impart worth and dignity to his petitions, purchase for them audience with God, and lend them their own rich perfume as they ascend before the throne of grace.”

</figure><figure class="quote" id="q-81a878a7f4" data-kw="">
<blockquote><p>There are some who think that the only people who turn away from God are those who openly deny that he exists, like the Epicureans, or say that he does not govern human affairs. Others think that “turning away from God” applies only to those people who have given up Christianity for Islam or Judaism.

They are right up to a point, but in this verse Paul shows what turning away from God really means. He accuses the Galatians of having done just that. What exactly had they done? They had accepted the teaching of the false apostles who (as we know very well from the content of this epistle and from Acts 15) taught that unless you are circumcised according to the law of Moses you cannot be saved.

In other words, if you want to receive the forgiveness of sins and salvation, it is not enough merely to believe in Christ. The forgiveness of sins and salvation must also be earned by doing the works of the law. This was the teaching that the Galatians had accepted, and it was on account of that acceptance that Paul accused them of forsaking God and Christ his Son. Those who have turned away from God and been alienated from him are not just those who have abandoned Christianity for the crass idolatry of the pagans, the ungodliness of the Muslims or the superstitions of the Jews, but also those who have put their trust in human works and merits.</p></blockquote>

</figure><figure class="quote" id="q-1406c0bbfb" data-kw="">
<blockquote><p>Spiritual life is infused into no one dead in sin except on the ground of the merit of Christ’s death. The life that Christ has merited by his death is everlasting, for it corresponds to that life that Adam should have obtained had he continued in his integrity.

And it flows from the Spirit of life in Christ risen from the dead, for as Christ himself having once died, dies no more, so neither shall the second death reign over anyone who, by the Spirit of life in Christ, is raised from the first. For these reasons, we admit no regeneration through the blood of Christ that, although sufficient for everlasting life, may possibly end in eternal death. Whoever is born of the Spirit immediately enters into the kingdom of heaven—first, as a state of grace; afterwards, as a state of glory. The Holy Spirit knows nothing of any other regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 136.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-475f22d788" data-kw="">
<blockquote><p>And upon this covenant made with Christ, and compact between God and him for us, comes it, that all things we have by Christ, though purchased by him, are yet said to be by grace, as well as by Christ’s merits, because they are bestowed by a compact with Christ, by virtue of which compact his merits are accepted for us; so that though Christ laid down a price worth all the grace and glory we shall have, yet that it should be accepted for us, and all that grace bestowed on us, comes from this compact and covenant made by God with Christ to accept it for us. And the acceptation of it for us depends as much on that covenant made with Christ as on his merits.

Therefore, Heb. x. 10, our sanctification and salvation is ascribed as much to God’s will and covenant with Christ (of which ho spake, ver. 7) as to Christ’s offering himself; for he says, ‘By which will we are sanctified, through the offering of the body of Christ.’ And therefore, as it is said that Christ died, so also it is God that justifies; Rom. viii. 33, ‘Who shall lay anything to the charge of God’s elect? It is God that justifieth;’ justifies freely by his grace; Rom. iii. 24, ‘Being justified freely by his grace, through the redemption that is in Jesus Christ.’ Though Christ hath laid down a sufficient price, and equal to the guilt of our sins, yet that God justifies us for it is an act of grace. Why? Because the acceptation of it for us was out of covenant; and therefore our divines say against the Jesuits, that his merits are merits ex compacto, and not which absolutely could oblige God to us. Though they be equal to our demerits by sin, yet it is only that relation that they had to this covenant made with Christ which gave acceptation to them for us. …

This covenant therefore which God made with Christ, to bestow all the merits of his obedience on us, which he called him unto, is the main foundation of all our happiness. As it obliged and engaged God firmly to us in Christ, so it makes all that Christ purchased to be of grace. Though he paid an equivalent price to what we should have done, and much more, yet it is accepted for us out of a covenant of grace. And therefore in Rom. v. 17, though the apostle shews and proves that there is more merit in Christ’s obedience to justify than in Adam’s sin to condemn, yet the imputing of it to us he calls ‘abundance of grace, and the gift of righteousness.’ Though it was an abounding righteousness, yet there was an abounding of grace to accept it for us, and it is derived by way of gift. And the ground of all is because of this covenant made by God with Christ for us, upon which the acceptation of all depends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christ the Mediator</cite>, (London, 1642) in The Works of Thomas Goodwin (12 vols, Edinburgh: James Nisbet, 1861-66), 5: 30-31.</span></figcaption>

</figure><figure class="quote" id="q-6b77bf9e74" data-kw="">
<blockquote><p>Those who think that they can rely on the merits or intercession of others when they stand before the judgment seat of God are greatly mistaken. Just as the righteous person lives by his own faith and not by that of someone else, so you will be judged by what you have done, not someone else. Jerome noticed this and wrote in his commentary on this passage: “As long as we are in this present world we can help one another by praying for or giving advice to one another, but when we come to the judgment seat of Christ, neither Job nor Daniel nor Noah will be able to intercede for anyone, but each person will bear his own burden.” Jerome got that from Ezekiel, who said more or less the same thing. [Ezekiel 14:20]

But most of the papist superstition is overturned by this doctrine. Prayers for the dead in particular, and those sacred rites that are performed for the dead and that only priests and monks are entitled to do. But for the present let this be the one purpose and use of all these things, that we should witness to our faith by mutual love and by fostering love put up with one another, restore others and prove our work before God so that when he returns in glory our Lord and Saviour Jesus Christ will acknowledge that we belong to him, to whom be blessing, honour, glory and power forever. Amen.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Those who think that they can rely on the merits or intercession of others when they stand before the judgment seat of God are greatly mistaken. Just as the righteous person lives by his own faith and not by that of someone else, so you will be judged by what you have done, not someone else. Jerome noticed this and wrote in his commentary on this passage: “As long as we are in this present world we can help one another by praying for or giving advice to one another, but when we come to the judgment seat of Christ, neither Job nor Daniel nor Noah will be able to intercede for anyone, but each person will bear his own burden.” Jerome got that from Ezekiel, who said more or less the same thing. [Ezekiel 14:20]

But most of the papist superstition is overturned by this doctrine. Prayers for the dead in particular, and those sacred rites that are performed for the dead and that only priests and monks are entitled to do. But for the present let this be the one purpose and use of all these things, that we should witness to our faith by mutual love and by fostering love put up with one another, restore others and prove our work before God so that when he returns in glory our Lord and Saviour Jesus Christ will acknowledge that we belong to him, to whom be blessing, honour, glory and power forever. Amen.”

— Rudolf Gwalther, In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 210-11.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+who+think+that+they+can+rely+on+the+merits+or+intercession+of+others+when+they+stand+before+the+judgment+seat+of+God+are+greatly+mistaken.+Just+as+the+righteous+person+lives+by+his+own+faith+and+not+by+that+of+someone+else%2C+so+you+will+be+judged+by+what+you+have+done%2C+not+someone+else.+Jerome+noticed+this+and+wrote+in+his+commentary+on+this+passage%3A+%E2%80%9CAs+long+as+we+are+in+this+present+world+we+can+help+one+another+by+praying+for+or+giving+advice+to+one+another%2C+but+when+we+come+to+the+judgment+seat+of+Christ%2C+neither+Job+nor+Daniel+nor+Noah+will+be+able+to+intercede+for+anyone%2C+but+each+person+will+bear+his+own+burden.%E2%80%9D+Jerome+got+that+from+Ezekiel%2C+who+said+more+or+less+the+same+thing.+%5BEzekiel+14%3A20%5D%0A%0ABut+most+of+the+papist+superstition+is+overturned+by+this+doctrine.+Prayers+for+the+dead+in+particular%2C+and+those+sacred+rites+that+are+performed+for+the+dead+and+that+only+priests+and+monks+are+entitled+to+do.+But+for+the+present+let+this+be+the+one+purpose+and+use+of+all+these+things%2C+that+we+should+witness+to+our+faith+by+mutual+love+and+by+fostering+love+put+up+with+one+another%2C+restore+others+and+prove+our+work+before+God+so+that+when+he+returns+in+glory+our+Lord+and+Saviour+Jesus+Christ+will+acknowledge+that+we+belong+to+him%2C+to+whom+be+blessing%2C+honour%2C+glory+and+power+forever.+Amen.%E2%80%9D%0A%0A%E2%80%94+Rudolf+Gwalther%2C+In+Divi+Pauli+Apostoli+Epistolam+ad+Galatas+Homiliae+LXI%2C+%28Zurich%2C+1576%29.+Quoted+in+Gerald+L.+Bray%2C+Timothy+F.+George%2C+Scott+M.+Manetsch+%28eds%29%2C+Reformation+Commentary+on+Scripture+X%3A+Galatians%2C+Ephesians+%28Downers+Grove+IL%3A+IVP+Academic%2C+2011%29%2C+pp+210-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6b77bf9e74.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/6b77bf9e74.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/05/03/rudolf-gwalther-on-the-merits-of-the-saints/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>On the other hand, merit by the covenant, whereas it does not have the strength to obligate on its own account, nevertheless, it does have it from the arrangement, so that either a full or greater reward for the work is owed to it. This again has a twin; it has strength to merit some things by the promise, others by the covenant. That is by the promise it has strength to merit so far as by its arrangement by which reward is expected, so that the rewards are displayed with sporting contests whether by the King or by the people. Then indeed merit of such value is by the arrangement, but furthermore the method of the arrangement pays from only the will of the one who arranges.</p></blockquote>

</figure><figure class="quote" id="q-06759181ed" data-kw="">
<blockquote><p>Note that whenever some merit derived from the sacraments or other works is mixed with faith, the result is another gospel that is not Christ’s but a radical perversion of it. Let us apply this teaching to our own times. Paul is contending for the basic principle of the gospel, which is that we are justified (or pardoned from our sins) by trusting in Christ alone and not by circumcision. Satan still objects to this principle today, but not in the same way. What he objects to now is our assertion that we receive Christ, who is our righteousness, by faith alone (that is, by trusting that he was handed over to death for our sake and that we are united with him).

Satan adds that Christ is also received by our mouths. As a result of this teaching of his, there are many people today who think that the forgiveness of sins is part and parcel of the sacramental host. How can we be surprised if they try to get righteousness and the forgiveness of sins by receiving the sacrament if that is the way they have been taught to receive Christ? But the articles of our faith teach something very different from that, and Paul opposes this notion directly in Romans 4:10–11. What we have here is a different gospel and a perversion of the gospel of Christ. Just think what great danger you are exposing yourself to if you accept such ideas.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolam Divi Pauli Apostoli ad Galatas Notae ex Concionibus Gasparis Oleviani Excerptae, et a Theodoro Beza Editae (</cite>, Geneva: Eustache Vignon, 1578). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 27.</span></figcaption>

<blockquote><p>Peter, as the president of the apostles, delivers it as the sense of the whole college of apostles then present: Acts ii. 23, ‘He was delivered by the determinate counsel and foreknowledge of God.’ It was decreed and enacted in heaven, resolved before time, though done in the fulness of time. Therefore Christ is called ‘the Lamb slain from before the foundation of the world,’ determinately, in the counsel and decree of God; promissorily, in the promise and word of God passed to Adam after the fall; typically, in sacrifices which were settled immediately upon that promise of redemption; efficaciously, in regard of the merit of it, applied by God to believers before the actual suffering.

He was made sin, not by us, not only by himself, and his own will, but by God’s ordination: 2 Cor. v. 21, ‘He hath made him to be sin for us,’ by a divine statute, i.e. he was ordained to be put into the state and condition of a sinner in our stead; not into the practical and experimental state of sin, but the penal state of a sinner; to be a sacrifice for it, not to be polluted with it.

Indeed, had not God appointed it, it had not been meritorious; for the merit was not absolute for us, but pactional and conditional. It was capable of meriting, because of the worth and dignity of the person; but not actually meritorious for us, but upon the covenant transacted between the Father and the Son, that it should be performed by him for us, and accepted by the Father for us, and applied by the Spirit to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 496.</span></figcaption>

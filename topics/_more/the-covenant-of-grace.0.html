<blockquote><p>7. The covenant is either a covenant of works or a covenant of faith. This distinction coincides with that between the legal and the evangelical covenant. The first included a stipulation of works: ‘Do this and you will live.’ The second included a stipulation of faith: ‘Believe and you will be saved.’ Indeed, in this covenant too works are required, but not primarily, as if man is justified through them; but they are required as a consequence, as a sign of gratitude, as a proof of an unfeigned faith which in this way also edifies the neighbor.</p></blockquote>

</figure><figure class="quote" id="q-bfdf633058" data-kw="">
<blockquote><p>Question: But why is God pleased to promise to give unto his people in Covenant spiritual blessings as well as temporal? … …Spiritual blessings are necessary for them in relation unto that eternal life… Heb. 12:13… Lo, here is a necessity of holiness and regeneration for salvation, and they are congruous, and fitting us for salvation, or eternal life… It is meet to enjoy grace before we come to enjoy glory; it is meet to have a conformity to Christ on his cross before we come to have a conformity to Christ in his crown, etc.</p></blockquote>

</figure><figure class="quote" id="q-b86df6a6a3" data-kw="">
<blockquote><p>Most broadly understood it [a condition] includes anything that is required in any way for the covenant of grace, whether: (1) antecedently, and as it were in a preparatory fashion, in which sense the hearing of the promulgated covenant, a general assent given to the divine Word, a conviction of the necessity of the covenant of grace, an effectual call to faith (prior to faith, if not in time, at least in nature), an acknowledgement and sense of one’s misery, a godly desperation about oneself and all things outside the Mediator, and so forth, can be called a condition. Or, (2) concomitantly, in which manner self-denial (Lk. 9:23; Phil. 3:4–12), the exercise of repentance (Mk. 1:15; Acts 2:38–39), and so forth, can be taken as a condition. Or, (3) consequently, as covenantal duties, in which sense evangelical obedience (cf. Gen. 12:1–3; 15:18; 17:1–2; 9:1–15) and renewal of repentance (Dt. 30:1–9 with 29:24 to the end) can be admitted as a condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 4, pt. 1, bk. 5, ch. 1, ‘The Covenant of Grace’, sect. XXII, ‘What the condition of the covenant of grace is’</cite>, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

y%20understood%20it%20%5Ba%20condition%5D,can%20be%20admitted%20as%20a%20condition." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a6876fd9dd" data-kw="">
<blockquote><p>It follows not that they [good works] are con-causes, or joint-causes with Christ, but only conditions; just as a man’s journeying on foot or horse, to a city, or a kingdom to inherit it, is the way, condition, of his entering the city; But it is not his charter, or law-title, or right to enjoy the crown, as his inheritance; any effective influence to the title of the crown of Heaven, I dare not ascribe to any works in us, or to any but to Christ; but undeniably, good works are not so much as conditions of justification, they follow a man justified, but go not before justification; no more than the apple goes before the tree, or the cistern before the fountain; nor are they the conditions of the Covenant of Grace: they are the conditions of covenanted ones, not of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism (London, 1648), pt. 2, ch. 48, ‘Antinomians hold that the believer cannot sin against God…’, p. 63</cite>, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><figure class="quote" id="q-904eca776e" data-kw="">
<blockquote><p>(2) God has been importunate in entreaties of us. God offers not only truce, but a peace, and has been most active in urging a reconciliation. Can He manifest his willingness in clearer methods, than that of sending his Son to reconcile the world to Himself? Can He evidence more sincerity than by his repeated and reiterated pressing of our souls to the acceptance of Him? God knocks at our hearts, and we are deaf to Him; He thunders in our ears, and we regard Him not; He waits upon us for our acceptance of his love, and we grow more mad against Him; He beseeches us, and we ungratefully and proudly reject Him; He opens his bosom, and we turn our backs; He offers us his pearls, and we tread them under our feet; He would give us angels’ bread, and we feed on husks with swine. The wisdom of God shines upon us, and we account it foolishness. The infinite kindness of God courts us, and we refuse it, as if it were the greatest cruelty. Christ calls and begs, and we will not hear Him either commanding or entreating…</p></blockquote>

</figure><figure class="quote" id="q-30279e146d" data-kw="">
<blockquote><p>To that which is asked about the work of mercy, it must be said that it is more proper to God to show mercy, because for the work of mercy nothing is required except God’s goodness; but for Him to exercise the severity of justice, our iniquity is presupposed; and therefore the former is more appropriated to God Himself than the latter.</p></blockquote>

<blockquote><p>This disposition [in Eze. 18:33] proves that God is ready to pardon, to forbear, and to forgive sins if only people were willing to come to their senses. But because they continue to be stubborn and to reject every remedy, He is tortured, as it were, by their wickedness.</p></blockquote>

<blockquote><p>We learn, therefore, from this law in the second place, not only that it is God whom we ought to love above all things, but also that H̲e̲ b̲y̲ H̲i̲s̲ n̲a̲t̲u̲r̲e̲ l̲o̲v̲e̲s̲ n̲o̲t̲ o̲n̲l̲y̲ m̲a̲n̲ b̲u̲t̲ a̲l̲l̲ H̲i̲s̲ c̲r̲e̲a̲t̲u̲r̲e̲s̲. For unless He loved them, He would not create them, sustain them, live and work in them.</p></blockquote>

</figure><figure class="quote" id="q-57c27cb19d" data-kw="">
<blockquote><p>We see that God is (as ye would say) wayward towards us; we see that He does not only bereave us of his blessings, but is also angry with us; and to be short, we perceive in Him nothing but all manner of rigor. And what is the cause hereof? Verily that we shut the gate against his goodness and will not suffer Him to use (as ye would say) his natural disposition. Lo here [is] a thing that should make us the better to acknowledge our faults and not to accuse God of any excessive cruelty when He deals not with us after our liking. For it is certain that He will take pleasure in doing us good, but on the other side let us consider also that He must in likewise delight to do us evil. And why so? Verily because that He is just. Indeed, if we did suffer God to use his own inclination towards us, He would bestow infinite benefits upon us and we living in this world should be as in Paradise. But because of our sins, we must live here like wretched wanderers; we must languish in many miseries, we must dwell in continual fear and in doubt and we must groan in great unrest: it must be even so. And wherefore? Because God is just. This is the very pleasure that is spoken of in this text, according whereunto it is said that God will rejoice and be glad when He has punished the wicked and maintained his majesty against them, for that they have despised Him and set Him at nought. Nevertheless, it is likewise true that He says by his prophet Isaiah [1:24] that He does it unwillingly. ‘Alas’ (says He) ‘must I needs revenge Me of mine enemies?’ God cries there ‘Alas,’ as if He were in sorrow and anguish for it. ‘I must’ (says He) ‘take comfort in avenging Me of mine enemies.’ Those whom He terms his enemies are the children whom He had adopted, and which boasted themselves to be his people. And how does He comfort Himself in them? Even by giving them over and by driving them away. But in the meanwhile He shows that it is against his will when He must so beat men down with main strokes, howbeit that He can none otherwise do. Yet notwithstanding, in very deed God is able to tame the hearts of men without any great violence: for (as we have said) He is not subject to our passions. But hereby we be to consider how his intent is to declare that our unreformable naughtiness is the cause why He is faine to pursue us after such manner as is spoken of here and that He is faine to take pleasure in doing us harm, wherein the order of nature is after a sort quite altered and changed: but all is through our own fault and we ourselves are to blame for it, and it is not for us to seek any other reason thereof than our own sin which has kindled his vengeance to the uttermost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sermons of Mr. John Calvin upon the Fifth Book of Moses called Deuteronomy... (London: Middleton, 1583), Sermon 162, the 10th upon the 28th Chapter, p. 1,005 on Dt. 28:63, “And it shall come to pass, that like as the Lord thy God rejoiced over thee to do thee good, and to multiply thee: even so will the Lord rejoice over you to destroy you, and to bring you to nought…”</cite></span></figcaption>

<blockquote><p>Their heavenly adoption ought to excite them to the exercise of beneficence, that they may imitate their Father’s disposition, “who makes his sun to rise on the evil and on the good,” (Mt. 5:45) There is nothing in which men resemble God more truly than in doing good to others.</p></blockquote>

<blockquote><p>Christ sets before us a picture of this kind in the character of the publican, who beats on his breast and begs for pardon with a dejected countenance. (Lk. 18:13). Thus also the sons of God throw down their prayers in that spirit of humility which springs from penitence. Then they raise their prayers by faith for when God invites them to Himself, and gives them the witness to his propitious disposition, they raise themselves up and overtop the clouds, yea, even heaven itself.</p></blockquote>

<blockquote><p>Jonah would not have shrunk from God’s command, had he been sent to the Ninevites to teach what he had been ordered to do among the chosen people. Had then a message been committed to Jonah, to set forth a gracious and merciful God to the Ninevites, he would not have hesitated a moment to offer his service. But as this express threatening, Nineveh shall be destroyed, was given him in charge, he became confounded, and sought at length to flee away rather than to execute such a command. Why so? Because he thus reasoned with himself, “I am to denounce a near ruin on the Ninevites; why does God command me to do this, except to invite these wretched men to repentance? Now if they repent, will not God be instantly ready to forgive them? He would otherwise deny his own nature: God cannot be unlike Himself, He cannot put off that disposition of which He has once testified to Moses [Ex. 34]. Since God, then, is reconcilable, if the Ninevites will return to the right way and flee to him, He will instantly embrace them: thus I shall be found to be false in my preaching.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jonah, ch. 4, verse 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-9250e3080a" data-kw="">
<blockquote><p>We are told, then, that because the kingdom of God is near we must be converted and believe the gospel. We have already explained, though rather briefly, what is meant by ‘the kingdom of God.’ It means that God has chosen to reveal Himself to men from whom He was formerly estranged, and who were more or less cut off from Him. We have all been banished from the heavenly life by Adam’s sin and fall. God therefore sends his only Son and, as it were, with outstretched arms asks us to turn back to Him, for He is willing to receive us. Although we have strayed and are lost because of our demerits, He still wills to show us mercy. Because the kingdom of God is near, our Lord Jesus Christ urges men to repentance and faith. Notice first of all that nothing should move or inflame us to yield to God more than his offer of infinite grace and goodness. When Paul, for example, seeks to pierce men’s stony hearts and to soften their hardness and obduracy, he appeals to ‘the bowels of God’s mercy’ (Phil. 2:1). In speaking thus, he is really saying: ‘Will you now continue in our madness? Must you be worse than the devils? And when God comes to you, displaying his mercy and opening his heart to welcome you as his own children—when he gives you his own Son, will you be so unfeeling as not to be softened or inflamed by love for his grace? Will you not allow Him to lead you, and will you not delight in the goodness He shows you?’ It is in just this way that Jesus Christ urges men to repentance and faith. But on what does he base his appeal? On the fact that God wishes to draw near to those from whom He was once estranged. God, therefore, in receiving us in mercy, sets his goodness before us without waiting for us to seek Him out; he forestalls us with such exceptional grace that we cannot grasp even a hundredth part of it. Since He is so kindly disposed toward us, we should be rightly and deeply touched, to the very core of thought and feeling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Gospel of God (Mt. 4:12, 17; Mk. 1:14–15; Lk. 3:19–20; 4:14–15)” in In the Power of the Spirit: Sermons on Matthew, Mark &amp; Luke, tr. Robert White (Banner of Truth, 2024)</cite>, pp. 154–55</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-d1bc25edd6" data-kw="">
<blockquote><p>As the term God is more distinctly expressive of majesty, so the term ‘Father’ conveys the idea of clemency and benevolent disposition. It becomes us to contemplate both as existing in God, that his majesty may inspire us with fear and reverence, and that his fatherly love may secure our full confidence. Hence it is not without good reason that Paul has conjoined these two things… At the same time there will be no inconsistency in saying, that he contents himself with the single term, ‘Father’. Farther, as it is necessary that his incomparable grace should be expressed by the term ‘Father’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, 1:12</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>(Verse. 31) ‘He forsakes not forever.’… Moreover, this is most sure, that the nature of God is such as that He delights not in our afflictions, being Himself naturally good, gentle, slow to anger and of great compassion. Thus we see how God is described unto us throughout the whole volume of the scripture, namely, in the 34th chapter of Exodus, insomuch that whenas Isaiah in his 28th chapter says He punishes and afflicts us, it seems rather that He deals like a stranger, and not like Himself. And namely, in the midst of all our afflictions, He makes his singular goodness always appear in the moderating of our punishments, turning them all to our benefit and welfare. And according hereunto, most notably wrote Saint Augustine in his epistles to Felix and Rusticus, saying, What is it that our good God will not mercifully do unto man? And how can it be but that He will show him all the favor He can, considering that all the tribulations which He sends are more benefits…</p></blockquote>

<blockquote><p>[For He does not punish from his heart] it arises not from God’s voluntary desire, but from the sin of man that God punishes; [and makes sorrowful the children of men] gives them cause by afflicting them to be vexed and grieved. Doctrine. [for etc.] sin constrains the Lord to afflict his dearest children: for the reasons hereof, see verse 27. … Doctrine. [not punish from his heart] God takes no delight in afflicting his children, Ps. 81:13; Isa. 1:24. The use is to teach us, first, to abhor their profaneness that say God sports Himself in punishing man. Secondly, by his example, to censure others with all remorse and pity, not delighting to disgrace them.</p></blockquote>

<blockquote><p>When love is attributed to God in Scripture, it does not mean a passion or an affect, for God is dispassionate [ἀπαθής], the freest, the most blissful, the most blessed, the most perfect. Nothing slavish happens to Him, nothing lowly, and finally nothing that indicates any imperfection. But God’s love denotes three completely, perfect things: eternal benevolence, actual beneficence, and actual delight in the thing loved. For he who loves something is well-disposed towards it, does it whatever good he is capable of, and delights in it. These three things are found in the love of God. Now this love is first the love of God in Himself, and then towards his creatures. For God loves Himself and above all things: the Father: the Son and the Holy Spirit; the Son: the Father and the Holy Spirit, and the Holy Spirit: the Father and the Son. God’s love for his creatures is first general and then special. That general love is the one by which He fully embraces all things created by Him, blesses them, and preserves and sustains them. In this way there is no one, no man, and no devil either, who can say that He is not loved by God. The special love is that by which alone He leads the elect to eternal life, as He acknowledges them to be his own children in Christ: this passage [Mal. 1:2] here must be understood from this special love.</p></blockquote>

</figure><figure class="quote" id="q-688db4ad07" data-kw="">
<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), ‘Doctrine of Election’, pt. 1 Wendelin (1584-1652)</cite></span></figcaption>

</figure><figure class="quote" id="q-34abd8f321" data-kw="">
<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest [seria] approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of Him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition [affectus] in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter tr. Johnson &amp; Fentiman (1639-1642; RBO, 2019), ch. 2, ‘On God’, Section 20, ‘Whether because God amiably invites and by supplications solicits, entreats and calls upon reprobates, and as He mourns over them, is grieved by them and laments on account of the disobedient, whether He, therefore, intends the obedience of them?’</cite>, pp. 57-58</span></figcaption>

<blockquote><p>Objection: Again it is objected, the apostle Paul says in 1 Tim. 2:4 that God would have all men saved: How should it be then that any should perish, unless his will be changeable? Answer: Ambrose upon this place of the apostle expounds it thus: God will have all men to be saved, but so as they come to Him, He will have them saved; if they will salvation to themselves; and if this sense be admitted, there is no shadow of change in God, though many be not saved, because those many that are not saved, do not seek salvation… God will have all men saved, He wills the salvation even of the reprobate, as a thing in itself good and suitable to the disposition of a gracious God: but yet He does not determine or appoint it, and therefore though many perish, there is no change in God’s will: this place showing what God might approve of being done, not what He determined to do; He wills it by an antecedent will, as in itself considered; but not with a consequent will, and here is no change in God’s will;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Objection: Again it is objected, the apostle Paul says in 1 Tim. 2:4 that God would have all men saved: How should it be then that any should perish, unless his will be changeable? Answer: Ambrose upon this place of the apostle expounds it thus: God will have all men to be saved, but so as they come to Him, He will have them saved; if they will salvation to themselves; and if this sense be admitted, there is no shadow of change in God, though many be not saved, because those many that are not saved, do not seek salvation… God will have all men saved, He wills the salvation even of the reprobate, as a thing in itself good and suitable to the disposition of a gracious God: but yet He does not determine or appoint it, and therefore though many perish, there is no change in God’s will: this place showing what God might approve of being done, not what He determined to do; He wills it by an antecedent will, as in itself considered; but not with a consequent will, and here is no change in God’s will;”

— Richard Stock, A Stock of Divine Knowledge, being a lively Description of the Divine Nature, or the Divine Essence, Attributes &amp; Trinity particularly explained and profitably applied… (London: T.H., 1641), ch. 13, pp. 133-34 Stock (c.1568-1626) was an English puritan.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection%3A+Again+it+is+objected%2C+the+apostle+Paul+says+in+1+Tim.+2%3A4+that+God+would+have+all+men+saved%3A+How+should+it+be+then+that+any+should+perish%2C+unless+his+will+be+changeable%3F+Answer%3A+Ambrose+upon+this+place+of+the+apostle+expounds+it+thus%3A+God+will+have+all+men+to+be+saved%2C+but+so+as+they+come+to+Him%2C+He+will+have+them+saved%3B+if+they+will+salvation+to+themselves%3B+and+if+this+sense+be+admitted%2C+there+is+no+shadow+of+change+in+God%2C+though+many+be+not+saved%2C+because+those+many+that+are+not+saved%2C+do+not+seek+salvation%E2%80%A6+God+will+have+all+men+saved%2C+He+wills+the+salvation+even+of+the+reprobate%2C+as+a+thing+in+itself+good+and+suitable+to+the+disposition+of+a+gracious+God%3A+but+yet+He+does+not+determine+or+appoint+it%2C+and+therefore+though+many+perish%2C+there+is+no+change+in+God%E2%80%99s+will%3A+this+place+showing+what+God+might+approve+of+being+done%2C+not+what+He+determined+to+do%3B+He+wills+it+by+an+antecedent+will%2C+as+in+itself+considered%3B+but+not+with+a+consequent+will%2C+and+here+is+no+change+in+God%E2%80%99s+will%3B%E2%80%9D%0A%0A%E2%80%94+Richard+Stock%2C+A+Stock+of+Divine+Knowledge%2C+being+a+lively+Description+of+the+Divine+Nature%2C+or+the+Divine+Essence%2C+Attributes+%26+Trinity+particularly+explained+and+profitably+applied%E2%80%A6+%28London%3A+T.H.%2C+1641%29%2C+ch.+13%2C+pp.+133-34+Stock+%28c.1568-1626%29+was+an+English+puritan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4e4267eaaa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4e4267eaaa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Objection%3A%20Again%20it%20is%20objected%2C%20the,is%20no%20change%20in%20God%E2%80%99s%20will%3B" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4c815e930c" data-kw="">
<blockquote><p>Goodness according to some admits of a threefold consideration: Of nature, which is called perfection. Of manners, called holiness. Of beneficence, id est [that is], a disposition to do good to others; this is properly called benignity: ‘Thou art good and doest good,’ Ps. 119:68. Goodness is either essential or by participation. God is essentially good: He is good of Himself; He is goodness itself: the creature is good by participation, i.e. by a goodness received of God. …the peculiar affection in parents towards their children renders them propense to do them good: and the soul full of matter (like wine which has no vent) propends to pour out itself; so is the Lord affected to do good according as He has willed concerning the creature. … God, who is the increated good, communicates Himself without division, effusion, or multiplication of Himself: all that He communicates, notwithstanding, He remains infinite and the same. God were God blessed forever though He had never willed of his goodness unto any, but if He were not a God of benignity, He were not our God.</p></blockquote>

</figure><figure class="quote" id="q-1239b11234" data-kw="">
<blockquote><p>It should be the care both of ministers and of all those that deal with others first of all to use mild and winning, and gaining courses. Now to prove this: First, they are more suitable to the nature of man: for the nature of man is best wrought on by rational courses suitable to his nature… Again, they suit most to God’s disposition, for God is love [1 Jn. 4:8], and his course to man is love: if He take any course contrary to love, it is not his own work, as He says to punish man, it is not his own work [Isa. 28:21]. He is forced to that alway: to show love and mercy, that is his work, that that comes from his own principle, from his mercy: He is love; He does not say He is justice, or rigor, but He is love. It agrees with the nature of God to deal mercifully; if He deal otherwise, it is forced from us.</p></blockquote>

</figure><figure class="quote" id="q-2b13774c16" data-kw="">
<blockquote><p>1. The first ground is the Lord’s disposition and nature of mercy and placableness towards a poor sinner, which gives him footing for his hope abundantly in any particular case, as: (1.) From his Name and attributes, whereby He has made Himself known to his people. God proclaims his Name to Moses to be ‘the Lord, the Lord God, the powerful, the mighty Jehovah’ (Ex. 34 [vv. 6-7]), which ministers comfort when annexed to his manifestation of Himself in this way of mercy. ‘Merciful,’ inclined to pity the sin and misery of his people, ready to relieve them in their distress and not only just to require the due service and punish the defaults; ‘Gracious,’ of an affable condescending descending nature, not standing upon the distance that He is in as a great King above all his creatures; He may be petitioned, sought unto and prevailed with by his poor suitors. ‘Long-suffering,’ that is, not hasty to use severity with the worst of sinners, usually taking all other ways first with them, willing that all men should repent and come to the knowledge of the truth (1 Tim. 2:4): Trying many that repent not with much goodness to draw them to it. Enduring with much patience the very vessels of wrath before He brings destruction on them (Rom. 9:22). In all cases He forgives iniquity, transgression and sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/henry-newcome.html">Henry Newcome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Hope... (London: E.C., 1660 [1659]), ch. 4</cite>, pp. 25-27</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>For as Tertullian elegantly says in bk. 1, Against Marcion [unable to find the reference]: ‘God is good of Himself, [but] just from us: the former is goodness according to nature, the latter is severity according to cause, etc.&#x27;</p></blockquote>

<blockquote><p>The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ [Rev. 3:20] it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>

<blockquote><p>At other times, He parleys and works with them, and makes gracious overtures and offers of the gospel to them. He opens a door of hope and woos and beseeches them to throw down their rebellious arms and come to Christ for life. He reveals how Christ is in a present disposition to embrace their first motion towards mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian in Complete Armor (†1679)</cite>, 1:116-17</span></figcaption>

</figure><figure class="quote" id="q-b6bfd17c0d" data-kw="">
<blockquote><p>I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts: 1. The inward disposition or inclination, or aptitude and readiness to mercy, that is in the four first attributes, merciful, gracious, long-suffering, much in goodness, and truth is added. 2. There are his purposes and resolutions of mercy, keeping mercy for thousands; and they are immanent acts in God, kept and laid up in God’s own breast. 3. There are extrinsical acts of mercy issuing from both: ‘pardoning iniquity, transgression, and sin.’ The meaning plainly is, first, God is merciful as He is Jehovah; that is his nature. Secondly, He fully resolves to show mercy; there is his heart. Thirdly, He has done it, and does it every day, in pardoning sin; there is his wont and practice. So that God is every way merciful: in his nature, in his purposes, and in his deeds and performance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8</cite>, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

nd%20in%20his%20deeds%20and%20performance." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ff0eb34bea" data-kw="">
<blockquote><p>2. The next thing in God is love, and that arises from goodness. The goodness that is in God inclines Him to love, and to be the most profuse lover. You read in 1 John 4:7-8, ‘God is love.’ The question is whether this speech does not import that He is love in Himself, as well as that He shows love. There are these reasons why it imports what He is in Himself, when He says, ‘God is love.’ Says He, verse 7, ‘Every one that loves is born of God, and knows God,’ that is the affirmative; and verse 8, ‘He that loves not knows not God, for God is love’; that is, he knows not God in what is most proper to Him, as to what does most abound in Him, for God is love. We ordinarily say of a man that is of such a disposition, I know him, he is so and so; so the believer knows God to be love… He speaks it of his love, which none sees but as manifest by effects; but God is love essentially. Says Aquinas, Whoever has a will, has a proneness to love. Says Musculus, As every one is in goodness, so in love. If God then has a will inclined to anything, it is to love; He has hatred in Him to sin, He has the opposite: He has a love also to something, only it is guided by his will towards creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8</cite>, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

ttps://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=2.%20The%20next%20thing%20in%20God,guided%20by%20his%20will%20towards%20creatures." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9e10921dfd" data-kw="">
<blockquote><p>I. How God delights not in the death of a sinner… If God has more pleasure in the conversion of sinners than their destruction, why are there not more converted than we find to be? The greatest part of mankind are perishing in their unbelief and impenitency. Answer: (1) I might answer, that this text speaks not absolutely, but comparatively. God rejoices in the execution of his justice, as well as in all his other works; but if you compare things with things, He rejoices rather in acts of mercy than in acts of vengeance. His disposition inclines Him to mercy rather than to wrath: ‘Mercy pleases Him,’ Mic. 7:18; and mercy rejoices over judgment in the conflict. Justice is alienum opus, ‘his strange work,’ Isa. 28:21; Lam. 3:33, ‘He does not afflict willingly, nor grieve the children of men;’ not with his heart. Mercy, like live honey, drops of its own accord. He is forced to the other [judgment]; it [judgment] is wrested from Him. Though the properties are equally infinite in God, yet they do diversely exert themselves towards men as to the effects. Now the world is upon its trial. God’s primary end is the conversion of a sinner; his secondary end the honor of his vindictive justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 21, Two sermons on Eze. 18:23</cite>, pp. 463-79</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I. How God delights not in the death of a sinner… If God has more pleasure in the conversion of sinners than their destruction, why are there not more converted than we find to be? The greatest part of mankind are perishing in their unbelief and impenitency. Answer: (1) I might answer, that this text speaks not absolutely, but comparatively. God rejoices in the execution of his justice, as well as in all his other works; but if you compare things with things, He rejoices rather in acts of mercy than in acts of vengeance. His disposition inclines Him to mercy rather than to wrath: ‘Mercy pleases Him,’ Mic. 7:18; and mercy rejoices over judgment in the conflict. Justice is alienum opus, ‘his strange work,’ Isa. 28:21; Lam. 3:33, ‘He does not afflict willingly, nor grieve the children of men;’ not with his heart. Mercy, like live honey, drops of its own accord. He is forced to the other [judgment]; it [judgment] is wrested from Him. Though the properties are equally infinite in God, yet they do diversely exert themselves towards men as to the effects. Now the world is upon its trial. God’s primary end is the conversion of a sinner; his secondary end the honor of his vindictive justice.”

<blockquote><p>In the Hebrew it is, ‘He does not afflict from his heart,’ that is, with pleasure and delight; or (which seems the best sense to me) not from his own mere motion without a cause given Him from the persons afflicted. Hence judgment is called God’s ‘strange work‘ [Isa. 28:21]. Showing mercy is his proper natural work, which flows from Himself without any cause in the creature. Judgment is his strange work, to which He never proceeds but when provoked, and as it were forced from the creature, whence it follows that He cannot delight in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on the Whole Bible | on Lamentations 3, verse 33</cite></span></figcaption>

</figure><figure class="quote" id="q-a93eb6fc23" data-kw="">
<blockquote><p>Secondly, another excellent disposition in Christ is his love, not only his philanthropy, or good will He bears to all men, and the desire He has of their salvation, Eze. 33:11, but his αγαπη, his special love, from αγαν valde et παυομας acquiesco, such an ardent affection has the heart of Christ for a person adhering to Him, that it greatly acquiesces in, and is fully contented with him, Eph. 2:4. Such is the sweetness of Christ’s nature, that it is full of love; ‘God is love,’ 1 Jn. 4:16. And as the Father has loved Me, so have I loved you, Jn. 15:9. Now this love of Christ to his people, is: First, a supreme love, the chiefest love. He has a love of benevolence to all, Mk. 10:21, ‘He beheld the young man and loved him;’ but the love He bears his own, is transcedent and exceeds the love of men and angels, Jn. 15:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/bartholomew-ashwood.html">Bartholomew Ashwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Treasure, or the Way to be Truly Rich (London: Marshal, 1681)</cite>, p. 139</span></figcaption>

<blockquote><p>XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>

</figure><figure class="quote" id="q-0902f1baa4" data-kw="">
<blockquote><p>goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions</cite>, pp. 560-61</span></figcaption>

<div class="actions"><button class="copy" data-copy="“goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.”

— Leonard Rijssen, as translated in Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions, pp. 560-61">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cgoodness+%28bonitas%29+is+that+act+of+the+divine+will%2C+by+which+he+is+disposed+to+self-communication.+Love+%28amor%29%2C+that+by+which+God+is+moved+toward+created+things+and+bestows+blessings+on+them.+Grace+%28gratia%29%2C+that+by+which+God+is+moved+to+communicate+himself+to+creatures+of+his+own+accord%2C+not+on+grounds+of+merit+or+debt.+Mercy+%28misericordia%29+is+the+disposition+of+the+divine+will+to+help+the+wretched%2C+not+because+of+any+external+cause%2C+but+solely+of+the+divine+goodness.+Hatred+%28odium%29+in+God+indicates+either+the+disapproval+of+sin%2C+or+the+will+to+punish+sinners+that+follows+sin%2C+or+the+denial+of+those+salutary+benefits+that+flow+from+the+divine+will.+Longing+%28desiderium%29+in+God+indicates+that+the+obedience+of+human+beings+is+exceedingly+pleasing+to+him%2C+and+not+without+future+reward.+Hope+and+expectation+%28spes+et+expectatio%29+in+God+signify+that+something+is+owed.+God+is+said+to+rejoice+%28gaudere%29+when+something+is+pleasing+to+him.+Dread+%28metus%29+is+something+attributed+to+him%2C+in+order+to+indicate+that+he+desires+to+prevent+evil.+Sorrow+%28tristia%29+in+God+indicates+something+that+is+exceedingly+displeasing+to+God+and+contrary+to+his+virtues.%E2%80%9D%0A%0A%E2%80%94+Leonard+Rijssen%2C+as+translated+in+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+%28Baker+Academic%2C+2003%29%2C+vol.+3%2C+ch.+6.3%2C+Divine+Affections+%26+Virtues%2C+A.+General+Considerations%2C+3.+Doctrinal+Conclusions%2C+pp.+560-61&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0902f1baa4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0902f1baa4.html">Permalink</a><a class="src" href=" <blockquote><p>(3) What encouragement a repenting returning sinner has to hope for pardon and life according to this promise… he has this to support himself with, that God’s nature, property, and delight, is to have mercy and to forgive, for He has said (Eze. 18:23): “Have I any pleasure at all that the wicked should die? No, by no means; you never had any cause given you to think so.</p></blockquote>

<blockquote><p>13. …There is all in God that is good, and perfect, and excellent in our desires and wishes for the conversion and salvation of wicked men. As, for instance, there is a love to holiness, absolutely considered, or an agreeableness of holiness to his nature and will; or, in other words, to his natural inclination. The holiness and happiness of the creature, absolutely considered, are things that he loves. These things are infinitely more agreeable to his nature than to ours. There is all in God that belongs to our desire of the holiness and happiness of unconverted men and reprobates, excepting what implies imperfection. All that is consistent with infinite knowledge, wisdom, power, self-sufficience, infinite happiness, and immutability. Therefore, there is no reason that his absolute prescience, or his wise determination and ordering what is future, should hinder his expressing this disposition of his nature, in like manner as we are wont to express such a disposition in ourselves, viz. by calls and invitations, and the like.</p></blockquote>

<blockquote><p>2. God’s common providence towards mankind teaches us that God is inclined to mercy and is willing to be reconciled, that he is not implacable… By these things, it plainly appears that God hasn’t utterly forsaken the world of mankind as to any favor or merciful regards. This was the witness which God gave all mankind, and even the heathen, that had direct revelation of his disposition to a reconciliation. Acts 14:16–17, ‘Who in times past suffered all nations to walk in their own ways. Nevertheless He left not Himself without witness, in that He did good, and gave us rain from heaven, and fruitful seasons, filling our hearts with food and gladness.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-22b2ca9b6f" data-kw="">
<blockquote><p>In an extensive sense, God is a Father, and is so revealed in his works as well as his Word. The paternal relation among men aids us in contemplating the loving relation in which God stands to his creatures: it is a shadow and representation of the Divine Fatherhood. Fatherly dispositions and dealings are ascribed to Him. By creation, He is the Father of intelligent beings. Angels are those “sons of God” that shouted for joy when “the morning stars,” at the dawn of creation, “sang together.” (Job 38:7) Men are “his offspring,” and He is “the Father of the spirits of all flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works Doctrinal and Practical of Thomas Houston (1876), vol. 1, The Adoption of Sons, ch. 3, The Fatherhood of God</cite>, p. 128</span></figcaption>

</figure><figure class="quote" id="q-7576bf8bff" data-kw="">
<blockquote><p>It must be admitted that if the expression [of God’s desiring the repentance and salvation of the reprobate] were intended to apply to the decretive will of God then there would be, at least, implicit contradiction. For to say that God desires the salvation of the reprobate and also that God wills the damnation of the reprobate and apply the former to the same thing as the latter, namely, the decretive will, would be contradiction; it would amount to averring of the same thing, viewed from the same aspect, God wills and God does not will. The question then is: what is implicit in, or lies back of; the full and free offer of the gospel to all without distinction? The word “desire” has come to be used in the debate, not because it is necessarily the most accurate or felicitous word but because it serves to set forth quite sharply a certain implication of the full and free offer of the gospel to all. This implication is that in the free offer there is expressed not simply the bare preceptive will of God but the disposition of lovingkindness on the part of God pointing to the salvation to be gained through compliance with the overtures of gospel grace. In other words, the gospel is not simply an offer or invitation but also implies that God delights that those to whom the offer comes would enjoy what is offered in all its fullness. And the word “desire” has been used in order to express the thought epitomized in Ezekiel 33:11, which is to the effect that God has pleasure that the wicked turn from his evil way and live. It might as well have been said, “It pleases God that the wicked repent and be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth (1948) General Assembly of the Orthodox Presbyterian Church’ | Introduction</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

%2C+%E2%80%98Report+of+the+Committee+on+the+Free+Offer+of+the+Gospel+presented+to+the+Fifteenth+%281948%29+General+Assembly+of+the+Orthodox+Presbyterian+Church%E2%80%99+%7C+Introduction&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7576bf8bff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7576bf8bff.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=It%20must%20be%20admitted%20that%20if,the%20wicked%20repent%20and%20be%20saved." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ba65e7d881" data-kw="">
<blockquote><p>The sum of this study of these passages in Matthew and Luke [6:35-36] is simply this, that presupposed in God’s gifts bestowed upon the ungodly there is in God a disposition of love, kindness, mercifulness, and that the actual gifts and the blessing accruing therefrom for the ungodly must not be abstracted from the lovingkindness of which they are the expression. And, of course, we must not think of this lovingkindness as conditioned upon a penitent attitude in the recipients. The lovingkindness rather is exercised towards them in their ungodly state and is expressed in the favours they enjoy. What bearing this may have upon the grace of God manifested in the free offer of the gospel to all without distinction remains to be seen. But we are hereby given a disclosure of goodness in the heart of God and of the relation there is between gifts bestowed and the lovingkindness from which they flow. And there is indicated to us something respecting God’s love or benevolence that we might not or could not entertain if we concentrated our thought simply on the divine decree of reprobation.</p></blockquote>

<blockquote><p>The affections are, therefore [after quoting Venema and Ames], either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. Significantly, this figurative or metaphorical understanding of some of the divine affections as inward, permanent dispositions and others as ad extra manifestations of permanent dispositions in no way lessened the Reformed interest in the topic–nor did it in any way undermine the discussion of the divine affections in the works of popular piety written during the era of orthodoxy. It is even possible to argue the opposite, that the Reformed orthodox reading of the biblical language of divine affections as not indicating alterations of the divine essence but, nonetheless, as descriptive of genuine patterns of relationship between God and his creation, enhanced the interest of theologians, pastors, and authors of treatises of popular piety in the divine affections… …Nor, indeed, has the basic doctrinal assumption shifted: like the Reformers, the orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions. Because of the difficulties inherent in the term ‘affection,’ some of the Reformed prefer to speak of the divine ‘virtues.’ (Thus, Leigh, Treatise, II.x (pp. 78-79); Mastricht, Theoretico-practica theologia, II.xv.18-19.) The question of the ‘affections’ (affectiones or adfectiones) and ‘passions’ (passiones) of the divine will arises rather naturally as a result of the definition and discussion of the voluntas Dei, granting the context of traditional, Christian Aristotelianism and scholastic faculty psychology within which Protestant discussions of mind and will took place, both in the time of the Reformation and afterward. (See Muller, Unaccommodated Calvin, pp. 159-173; and idem, God, Creation, and Providence, pp. 143-149, 167-169, 191-207.) The terminology is itself interesting: the language of affections and passions is typically a language indicating the changeableness of a living being, specifically of the soul, in its sentiments or dispositions. Strictly, an affection or passion is an acquired quality. (Francois Bremondy, “Affection,” in Encyclopedie philosophique universelle, II/1, p. 49.) An affection is usually favorable or positive, whereas a passion is usually negative. Thus, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. (Cf. Heidanus, Corpus theol., II (p. 172); Venema, Inst. theol., viii (p. 180).) It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept. A passion, most strictly, is a form of suffering and would not have the connotation of a permanent disposition and certainly not of a disposition positively directed toward an object. Passions, moreover, indicate a declension from an original or natural condition that is at variance with the fundamental inclination of the individual–and, therefore, a loss of power or self-control. (Venema, Inst. theol., viii (p. 181).) A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.¹ ¹ (Ames, Marrow, I.iv.63; note that this understanding of affections and passions reflects the standard categories of predication, in which action and passion denote respectively, the act of a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The affections are, therefore [after quoting Venema and Ames], either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. Significantly, this figurative or metaphorical understanding of some of the divine affections as inward, permanent dispositions and others as ad extra manifestations of permanent dispositions in no way lessened the Reformed interest in the topic–nor did it in any way undermine the discussion of the divine affections in the works of popular piety written during the era of orthodoxy. It is even possible to argue the opposite, that the Reformed orthodox reading of the biblical language of divine affections as not indicating alterations of the divine essence but, nonetheless, as descriptive of genuine patterns of relationship between God and his creation, enhanced the interest of theologians, pastors, and authors of treatises of popular piety in the divine affections… …Nor, indeed, has the basic doctrinal assumption shifted: like the Reformers, the orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions. Because of the difficulties inherent in the term ‘affection,’ some of the Reformed prefer to speak of the divine ‘virtues.’ (Thus, Leigh, Treatise, II.x (pp. 78-79); Mastricht, Theoretico-practica theologia, II.xv.18-19.) The question of the ‘affections’ (affectiones or adfectiones) and ‘passions’ (passiones) of the divine will arises rather naturally as a result of the definition and discussion of the voluntas Dei, granting the context of traditional, Christian Aristotelianism and scholastic faculty psychology within which Protestant discussions of mind and will took place, both in the time of the Reformation and afterward. (See Muller, Unaccommodated Calvin, pp. 159-173; and idem, God, Creation, and Providence, pp. 143-149, 167-169, 191-207.) The terminology is itself interesting: the language of affections and passions is typically a language indicating the changeableness of a living being, specifically of the soul, in its sentiments or dispositions. Strictly, an affection or passion is an acquired quality. (Francois Bremondy, “Affection,” in Encyclopedie philosophique universelle, II/1, p. 49.) An affection is usually favorable or positive, whereas a passion is usually negative. Thus, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. (Cf. Heidanus, Corpus theol., II (p. 172); Venema, Inst. theol., viii (p. 180).) It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept. A passion, most strictly, is a form of suffering and would not have the connotation of a permanent disposition and certainly not of a disposition positively directed toward an object. Passions, moreover, indicate a declension from an original or natural condition that is at variance with the fundamental inclination of the individual–and, therefore, a loss of power or self-control. (Venema, Inst. theol., viii (p. 181).) A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.¹ ¹ (Ames, Marrow, I.iv.63; note that this understanding of affections and passions reflects the standard categories of predication, in which action and passion denote respectively, the act of a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)”

— Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, pp. 552-53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+affections+are%2C+therefore+%5Bafter+quoting+Venema+and+Ames%5D%2C+either+inward+and+inalterable+dispositions+of+the+divine+will+or+figurative+attributions+based+on+ad+extra+manifestations.+Furthermore%2C+what+makes+the+attribution+of+an+affection+to+God+figurative+or+metaphorical+is+its+apparent+variation%2C+temporality%2C+or+alterability.+Significantly%2C+this+figurative+or+metaphorical+understanding+of+some+of+the+divine+affections+as+inward%2C+permanent+dispositions+and+others+as+ad+extra+manifestations+of+permanent+dispositions+in+no+way+lessened+the+Reformed+interest+in+the+topic%E2%80%93nor+did+it+in+any+way+undermine+the+discussion+of+the+divine+affections+in+the+works+of+popular+piety+written+during+the+era+of+orthodoxy.+It+is+even+possible+to+argue+the+opposite%2C+that+the+Reformed+orthodox+reading+of+the+biblical+language+of+divine+affections+as+not+indicating+alterations+of+the+divine+essence+but%2C+nonetheless%2C+as+descriptive+of+genuine+patterns+of+relationship+between+God+and+his+creation%2C+enhanced+the+interest+of+theologians%2C+pastors%2C+and+authors+of+treatises+of+popular+piety+in+the+divine+affections%E2%80%A6+%E2%80%A6Nor%2C+indeed%2C+has+the+basic+doctrinal+assumption+shifted%3A+like+the+Reformers%2C+the+orthodox+assume+that+God+has+affectiones+that+characterize+his+relationship+to+the+world+and+that+some+analogy+can+be+drawn+between+these+%E2%80%98divine+affections%E2%80%99+and+the+affections+that+belong+to+human+willing%E2%80%93with+the+major+qualification+that%2C+unlike+human+affections%2C+the+divine+affections+do+not+indicate+essential+change+in+God+and+that+they+are+permanent+rather+than+transient+dispositions.+Because+of+the+difficulties+inherent+in+the+term+%E2%80%98affection%2C%E2%80%99+some+of+the+Reformed+prefer+to+speak+of+the+divine+%E2%80%98virtues.%E2%80%99+%28Thus%2C+Leigh%2C+Treatise%2C+II.x+%28pp.+78-79%29%3B+Mastricht%2C+Theoretico-practica+theologia%2C+II.xv.18-19.%29+The+question+of+the+%E2%80%98affections%E2%80%99+%28affectiones+or+adfectiones%29+and+%E2%80%98passions%E2%80%99+%28passiones%29+of+the+divine+will+arises+rather+naturally+as+a+result+of+the+definition+and+discussion+of+the+voluntas+Dei%2C+granting+the+context+of+traditional%2C+Christian+Aristotelianism+and+scholastic+faculty+psychology+within+which+Protestant+discussions+of+mind+and+will+took+place%2C+both+in+the+time+of+the+Reformation+and+afterward.+%28See+Muller%2C+Unaccommodated+Calvin%2C+pp.+159-173%3B+and+idem%2C+God%2C+Creation%2C+and+Providence%2C+pp.+143-149%2C+167-169%2C+191-207.%29+The+terminology+is+itself+interesting%3A+the+language+of+affections+and+passions+is+typically+a+language+indicating+the+changeableness+of+a+living+being%2C+specifically+of+the+soul%2C+in+its+sentiments+or+dispositions.+Strictly%2C+an+affection+or+passion+is+an+acquired+quality.+%28Francois+Bremondy%2C+%E2%80%9CAffection%2C%E2%80%9D+in+Encyclopedie+philosophique+universelle%2C+II%2F1%2C+p.+49.%29+An+affection+is+usually+favorable+or+positive%2C+whereas+a+passion+is+usually+negative.+Thus%2C+an+affection+is+a+disposition+of+nature+or+an+inclination+of+will+toward+an+object+and%2C+as+such%2C+it+can+indicate+either+a+transient+disposition+%28in+contrast+to+a+habitus%29+that+is+caused+by+an+external+object+or+a+permanent+disposition+or+virtue.+%28Cf.+Heidanus%2C+Corpus+theol.%2C+II+%28p.+172%29%3B+Venema%2C+Inst.+theol.%2C+viii+%28p.+180%29.%29+It+is+the+latter+sense+of+the+term%2C+as+a+permanent+disposition+or+virtue%2C+that+the+orthodox+accept.+A+passion%2C+most+strictly%2C+is+a+form+of+suffering+and+would+not+have+the+connotation+of+a+permanent+disposition+and+certainly+not+of+a+disposition+positively+directed+toward+an+object.+Passions%2C+moreover%2C+indicate+a+declension+from+an+original+or+natural+condition+that+is+at+variance+with+the+fundamental+inclination+of+the+individual%E2%80%93and%2C+therefore%2C+a+loss+of+power+or+self-control.+%28Venema%2C+Inst.+theol.%2C+viii+%28p.+181%29.%29+A+virtue+is%2C+quite+simply%2C+a+moral+perfection%E2%80%93in+the+case+of+God%2C+the+perfection+of+his+understanding+and%2For+will.%C2%B9+%C2%B9+%28Ames%2C+Marrow%2C+I.iv.63%3B+note+that+this+understanding+of+affections+and+passions+reflects+the+standard+categories+of+predication%2C+in+which+action+and+passion+denote+respectively%2C+the+act+of+a+subject+and+the+subject+being+acted+upon%3A+thus%2C+the+point+of+the+theological+argument+is+that+God+act%5Bs%5D+but+is+not+acted+upon.%29%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+%28Baker+Academic%2C+2003%29%2C+vol.+3%2C+pp.+552-53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7375df7539.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7375df7539.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20affections%20are%2C%20therefore%20%5Bafter%20quoting,act%5Bs%5D%20but%20is%20not%20acted%20upon.%29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-62ffb91a19" data-kw="">
<blockquote><p>The divine affections or virtues are not distinct dispositions or habits that stand as attributes or functions of will, as they do in human beings, but instead are divine perfections that have some analogy to the dispositions or habits of the human will: ‘for though, properly speaking, there are [no affections] in God, he being a most pure and simple act, free from all commotion and perturbation; yet there being some things said and done by him, which are similar to affections in intelligent beings, [sic] they [that] are ascribed to him; as love, pity, hatred, anger etc., from which must be removed everything that is carnal, sensual, or has any degree of imperfection in it.’ (Gill, Complete Body of Divinity, I, p. 112; cf. Synopsis purioris theologiae, VI.xxxix; Turretin, Inst. theol. elencticae, III.xix.1.) Several writers, most notably Venema, treat these affections not only in relation to the divine will, but also as the affective manifestations of the goodness and holiness of God… The basis for this understanding is the assumption that affections are not essential attributes or original properties but, rather, are ad extra manifestations in which God is known through his effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, pp. 557-58</span></figcaption>

s." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b2bd544491" data-kw="">
<blockquote><p>…just as in human beings, the term ‘virtues’ is reserved for ‘excellent and confirmed habits’ or dispositions that conduce to the proper use of the faculties, so also in God is the word ‘virtues’ applied to the workings of the divine essence, with specific reference to the disposition and use of the ‘faculties’ of intellect and will. This approach is analogical, given that the divine virtues are not separable from the divine essence as human virtues are separable from humanity. In short, the virtues of God are the divine moral perfections, specifically the goodness and righteousness of the divine willing. These virtues are also the source of all finite or creaturely goodness and righteousness. (Leigh, Treatise, II.x (pp. 78-79).)</p></blockquote>

</figure><figure class="quote" id="q-43f63abc46" data-kw="">
<blockquote><p>Even so God both endures “with much longsuffering” the sins of the reprobate and, at the same time, is patient with the elect prior to their conversion, willing their repentance rather than their immediate destruction because of sin.534 It is, thus, “the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but he doth warn them beforehand, lightly correct and seek to turn them unto him.”535 The divine compassion, similarly, is the disposition of God to deliver creatures from their misery. It is manifest when “the object of the divine goodness of love [is] involved in misery, such as man who is a sinner and subject to death.”536 534. Brakel, Redelijke Godsdienst, I.iii.36. 535. Leigh, Treatise, II.xiii (p. 100). 536. Venema, Inst. theol., VIII (p. 185).</p></blockquote>

<blockquote><p>Third, because every agent acts by its form; hence the manner in which it has its form is the manner in which it is an agent. Therefore whatever is primarily and essentially an agent must be primarily and essentially form. Now God is the first agent, since He is the first efficient cause. He is therefore of His essence a form; and not composed of matter and form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 | quest. 3, Simplicity of God | art. 2, Whether God is composed of matter and form?, I answer that</cite></span></figcaption>

<blockquote><p>I answer that, Everything is said to be good so far as it is perfect; for in that way only is it desirable (as shown above, AA. 1, 3). Now a thing is said to be perfect if it lacks nothing according to the mode of its perfection. But since everything is what it is by its form (and since the form presupposes certain things, and from the form certain things necessarily follow), in order for a thing to be perfect and good it must have a form, together with all that precedes and follows upon that form. … Further, upon the form follows an inclination to the end, or to an action, or something of the sort; for everything, in so far as it is in act, acts and tends towards that which is in accordance with its form;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 | quest. 5, art. 5, Whether the essence of goodness consists in mode, species and order?, I answer that</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“I answer that, Everything is said to be good so far as it is perfect; for in that way only is it desirable (as shown above, AA. 1, 3). Now a thing is said to be perfect if it lacks nothing according to the mode of its perfection. But since everything is what it is by its form (and since the form presupposes certain things, and from the form certain things necessarily follow), in order for a thing to be perfect and good it must have a form, together with all that precedes and follows upon that form. … Further, upon the form follows an inclination to the end, or to an action, or something of the sort; for everything, in so far as it is in act, acts and tends towards that which is in accordance with its form;”

</figure><figure class="quote" id="q-5592ef0e54" data-kw="">
<blockquote><p>I answer that, There is will in God, as there is intellect: since will follows upon intellect. For as natural things have actual existence by their form, so the intellect is actually intelligent by its intelligible form. Now everything has this aptitude towards its natural form, that when it has it not, it tends towards it; and when it has it, it is at rest therein. It is the same with every natural perfection, which is a natural good. This aptitude to good in things without knowledge is called natural appetite. Whence also intellectual natures have a like aptitude as apprehended through its intelligible form; so as to rest therein when possessed, and when not possessed to seek to possess it, both of which pertain to the will. Hence in every intellectual being there is will, just as in every sensible being there is animal appetite. And so there must be will in God, since there is intellect in Him. And as His intellect is His own existence, so is His will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 | quest. 19 | art. 1, Whether there is will in God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-a31fa81a8b" data-kw="">
<blockquote><p>God wills not only Himself, but other things apart from Himself. This is clear from the comparison which we made above (A. 1). For natural things have a natural inclination not only towards their own proper good, to acquire it if not possessed, and, if possessed, to rest therein; but also to spread abroad their own good among others, so far as possible. Hence we see that every agent, in so far as it is perfect and in act, produces its like. It pertains, therefore, to the nature of the will to communicate as far as possible to others the good possessed; and especially does this pertain to the divine will, from which all perfection is derived in some kind of likeness. Hence, if natural things, in so far as they are perfect, communicate their good to others, much more does it appertain to the divine will to communicate by likeness its own good to others as much as possible. Thus, then, He wills both Himself to be, and other things to be; but Himself as the end, and other things as ordained to that end, inasmuch as it befits the divine goodness that other things should be partakers therein.</p></blockquote>

<blockquote><p>Strictly speaking, therefore, God does not love irrational creatures with the love of friendship; but as it were with the love of desire, in so far as He orders them to rational creatures, and even to Himself. Yet this is not because He stands in need of them; but only on account of His goodness, and of the services they render to us. For we can desire a thing for others as well as for ourselves.</p></blockquote>

</figure><figure class="quote" id="q-00dfc149ac" data-kw="">
<blockquote><p>Mercy is especially to be attributed to God, as seen in its effect, but not as an affection of passion… To sorrow, therefore, over the misery of others belongs not to God; but it does most properly belong to Him to dispel that misery, whatever be the defect we call by that name. Now defects are not removed, except by the perfection of some kind of goodness; and the primary source of goodness is God, as shown above (Q. 6, A. 4). It must, however, be considered that to bestow perfections appertains not only to the divine goodness, but also to His justice, liberality, and mercy; yet under different aspects. The communicating of perfections, absolutely considered, appertains to goodness, as shown above (Q. 6, AA. 1, 4); in so far as perfections are given to things in proportion, the bestowal of them belongs to justice, as has been already said (A. 1); in so far as God does not bestow them for His own use, but only on account of His goodness, it belongs to liberality; in so far as perfections given to things by God expel defects, it belongs to mercy.</p></blockquote>

<blockquote><p>Mercy and truth are necessarily found in all God’s works, if mercy be taken to mean the removal of any kind of defect. Not every defect, however, can properly be called a misery; but only defect in a rational nature whose lot is to be happy; for misery is opposed to happiness. … Now the work of divine justice always presupposes the work of mercy; and is founded thereupon. For nothing is due to creatures, except for something pre-existing in them, or foreknown. Again, if this is due to a creature, it must be due on account of something that precedes. And since we cannot go on to infinity, we must come to something that depends only on the goodness of the divine will—which is the ultimate end… In all that follows, the power of mercy remains, and works indeed with even greater force; as the influence of the first cause is more intense than that of second causes. For this reason does God out of abundance of His goodness bestow upon creatures what is due to them more bountifully than is proportionate to their deserts: since less would suffice for preserving the order of justice than what the divine goodness confers; because between creatures and God’s goodness there can be no proportion.</p></blockquote>

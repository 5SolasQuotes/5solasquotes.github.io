</figure><figure class="quote" id="q-d03f9558bd" data-kw="">
<blockquote><p>I answer that, It is necessary to assign an appetitive power to the soul. To make this evident, we must observe that some inclination follows every form: for example, fire, by its form, is inclined to rise, and to generate its like. Now, the form is found to have a more perfect existence in those things which participate knowledge than in those which lack knowledge. For in those which lack knowledge, the form is found to determine each thing only to its own being—that is, to its nature. Therefore this natural form is followed by a natural inclination, which is called the natural appetite. But in those things which have knowledge, each one is determined to its own natural being by its natural form, in such a manner that it is nevertheless receptive of the species of other things: for example, sense receives the species of all things sensible, and the intellect, of all things intelligible, so that the soul of man is, in a way, all things by sense and intellect: and thereby, those things that have knowledge, in a way, approach to a likeness to God, in Whom all things pre-exist, as Dionysius says (Div. Nom. v). Therefore, as forms exist in those things that have knowledge in a higher manner and above the manner of natural forms; so must there be in them an inclination surpassing the natural inclination, which is called the natural appetite. And this superior inclination belongs to the appetitive power of the soul, through which the animal is able to desire what it apprehends, and not only that to which it is inclined by its natural form. And so it is necessary to assign an appetitive power to the soul. … Reply Obj. 2: What is apprehended and what is desired are the same in reality, but differ in aspect [ratione]: for a thing is apprehended as something sensible or intelligible, whereas it is desired as suitable or good. Now, it is diversity of aspect in the objects, and not material diversity, which demands a diversity of powers. Reply Obj. 3: Each power of the soul is a form or nature, and has a natural inclination to something. Wherefore each power desires by the natural appetite that object which is suitable to itself. Above which natural appetite is the animal appetite, which follows the apprehension, and by which something is desired not as suitable to this or that power, such as sight for seeing, or sound for hearing; but simply as suitable to the animal.</p></blockquote>

</figure><figure class="quote" id="q-4be16a5051" data-kw="">
<blockquote><p>I answer that, The will is a rational appetite. Now every appetite is only of something good. The reason of this is that the appetite is nothing else than an inclination of a person desirous of a thing towards that thing. Now every inclination is to something like and suitable to the thing inclined. Since, therefore, everything, inasmuch as it is being and substance, is a good, it must needs be that every inclination is to something good. And hence it is that the Philosopher says (Ethic. i, 1) that the good is that which all desire. But it must be noted that, since every inclination results from a form, the natural appetite results from a form existing in the nature of things: while the sensitive appetite, as also the intellective or rational appetite, which we call the will, follows from an apprehended form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 of 2 | quest. 8, art. 1, Whether the will is of good only?</cite></span></figcaption>

<blockquote><p>‘The Lord is well pleased.’… This passage is interpreted in various ways. Some render it, “The Lord has so willed it;” others, “He is merciful;” but, for my own part, I have translated it, “The Lord is willing,” that is, disposed and inclined to deliver his people, and that for the purpose of magnifying his Law and extolling his righteousness. Thus God assigns the reason why He is ready to aid those who are unworthy, that He wishes to spread his glory in their salvation, that in this manner his righteousness may be illustriously displayed, and that his Law may prevail and flourish. As to the heavy calamities that have come on the Jews, the reason is, that of their own accord they have resolved to be blind, and to bring afflictions on themselves, instead of obeying God; for otherwise the Lord would have wished to enrich and exalt them…. Others render it, “For his righteous one,” and refer it to Christ; but they mistake the meaning of the word צדקו, (tzidko) and unquestionably He speaks of righteousness, and means that the Lord would willingly have displayed the magnificence of his promises: and would have given proofs of his righteousness in preserving his people, if they had not shown themselves to be ungrateful and unworthy. Some think that the Lord here offers an excuse for Himself, because, when the people whom He had adopted were exposed to so many evils, it appeared as if his truth were shaken, and that the prophet intended to meet this calumny, for they were seized and became a prey, not because the Lord delights in their miseries, but because He prefers his righteousness to everything else. For my own part, I explain it simply to mean, “The Lord, for the sake of doing honor to his Law, was inclined to do good to his people, in order that his glory and righteousness might shine forth in it; but his people showed themselves to be unworthy of so great a favor; and, therefore, by their own obduracy they made their wounds incurable.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘The Lord is well pleased.’… This passage is interpreted in various ways. Some render it, “The Lord has so willed it;” others, “He is merciful;” but, for my own part, I have translated it, “The Lord is willing,” that is, disposed and inclined to deliver his people, and that for the purpose of magnifying his Law and extolling his righteousness. Thus God assigns the reason why He is ready to aid those who are unworthy, that He wishes to spread his glory in their salvation, that in this manner his righteousness may be illustriously displayed, and that his Law may prevail and flourish. As to the heavy calamities that have come on the Jews, the reason is, that of their own accord they have resolved to be blind, and to bring afflictions on themselves, instead of obeying God; for otherwise the Lord would have wished to enrich and exalt them…. Others render it, “For his righteous one,” and refer it to Christ; but they mistake the meaning of the word צדקו, (tzidko) and unquestionably He speaks of righteousness, and means that the Lord would willingly have displayed the magnificence of his promises: and would have given proofs of his righteousness in preserving his people, if they had not shown themselves to be ungrateful and unworthy. Some think that the Lord here offers an excuse for Himself, because, when the people whom He had adopted were exposed to so many evils, it appeared as if his truth were shaken, and that the prophet intended to meet this calumny, for they were seized and became a prey, not because the Lord delights in their miseries, but because He prefers his righteousness to everything else. For my own part, I explain it simply to mean, “The Lord, for the sake of doing honor to his Law, was inclined to do good to his people, in order that his glory and righteousness might shine forth in it; but his people showed themselves to be unworthy of so great a favor; and, therefore, by their own obduracy they made their wounds incurable.”

— John Calvin, Commentary on Isaiah 42, verse 21, “The Lord is well pleased for his righteousness’ sake; he will magnify the law, and make it honourable.”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98The+Lord+is+well+pleased.%E2%80%99%E2%80%A6+This+passage+is+interpreted+in+various+ways.+Some+render+it%2C+%E2%80%9CThe+Lord+has+so+willed+it%3B%E2%80%9D+others%2C+%E2%80%9CHe+is+merciful%3B%E2%80%9D+but%2C+for+my+own+part%2C+I+have+translated+it%2C+%E2%80%9CThe+Lord+is+willing%2C%E2%80%9D+that+is%2C+disposed+and+inclined+to+deliver+his+people%2C+and+that+for+the+purpose+of+magnifying+his+Law+and+extolling+his+righteousness.+Thus+God+assigns+the+reason+why+He+is+ready+to+aid+those+who+are+unworthy%2C+that+He+wishes+to+spread+his+glory+in+their+salvation%2C+that+in+this+manner+his+righteousness+may+be+illustriously+displayed%2C+and+that+his+Law+may+prevail+and+flourish.+As+to+the+heavy+calamities+that+have+come+on+the+Jews%2C+the+reason+is%2C+that+of+their+own+accord+they+have+resolved+to+be+blind%2C+and+to+bring+afflictions+on+themselves%2C+instead+of+obeying+God%3B+for+otherwise+the+Lord+would+have+wished+to+enrich+and+exalt+them%E2%80%A6.+Others+render+it%2C+%E2%80%9CFor+his+righteous+one%2C%E2%80%9D+and+refer+it+to+Christ%3B+but+they+mistake+the+meaning+of+the+word+%D7%A6%D7%93%D7%A7%D7%95%2C+%28tzidko%29+and+unquestionably+He+speaks+of+righteousness%2C+and+means+that+the+Lord+would+willingly+have+displayed+the+magnificence+of+his+promises%3A+and+would+have+given+proofs+of+his+righteousness+in+preserving+his+people%2C+if+they+had+not+shown+themselves+to+be+ungrateful+and+unworthy.+Some+think+that+the+Lord+here+offers+an+excuse+for+Himself%2C+because%2C+when+the+people+whom+He+had+adopted+were+exposed+to+so+many+evils%2C+it+appeared+as+if+his+truth+were+shaken%2C+and+that+the+prophet+intended+to+meet+this+calumny%2C+for+they+were+seized+and+became+a+prey%2C+not+because+the+Lord+delights+in+their+miseries%2C+but+because+He+prefers+his+righteousness+to+everything+else.+For+my+own+part%2C+I+explain+it+simply+to+mean%2C+%E2%80%9CThe+Lord%2C+for+the+sake+of+doing+honor+to+his+Law%2C+was+inclined+to+do+good+to+his+people%2C+in+order+that+his+glory+and+righteousness+might+shine+forth+in+it%3B+but+his+people+showed+themselves+to+be+unworthy+of+so+great+a+favor%3B+and%2C+therefore%2C+by+their+own+obduracy+they+made+their+wounds+incurable.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Isaiah+42%2C+verse+21%2C+%E2%80%9CThe+Lord+is+well+pleased+for+his+righteousness%E2%80%99+sake%3B+he+will+magnify+the+law%2C+and+make+it+honourable.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1fa2e2b5f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1fa2e2b5f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=%E2%80%98The%20Lord%20is%20well%20pleased.%E2%80%99%E2%80%A6,obduracy%20they%20made%20their%20wounds%20incurable." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-533414df6f" data-kw="">
<blockquote><p>God shows here, by his prophet, that He was constrained by urgent necessity to deal sharply and roughly with the people. Nothing, we know, is more pleasing to God than to treat us kindly; for there is not found a father in the world who cherishes his children as tenderly: but we, being perverse, suffer Him not to follow the inclination of his nature. He is therefore constrained to put on, as it were, a new character, and to chide us severely, according to the way in which He here says, He had treated the Israelites; ‘I have cut them,’ He says, ‘by my prophets, and killed them by the words of my mouth.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hosea</cite>, 6:5</span></figcaption>

</figure><figure class="quote" id="q-8ae6dd80bb" data-kw="">
<blockquote><p>But in this place and present argument, ‘grace’ is the favor and goodness of the eternal Godhead wherewith He according to his incomprehensible goodness does gratis, freely for Christ’s sake embrace, call, justify and save us mortal men. Now here me thinks before we go any further it is not amiss to examine and search out the cause of this God’s love to us exhibited. For we see that there is a certain relation between the favor of God and us men to whom his favour is so bent. It is a matter neither hard nor tedious to be found out. For in us there is nothing wherewith God can be in love, or wherewithal He may be moved or stirred up to embrace us: yea, in so much as we are all unpure sinners, and that God is holy, just and a revenger of iniquities, He has matter enough to find in us for which He may be angry at and with just revengement plague us. So then the cause of God’s love to us wards must of necessity be, not in us, nor in any other thing beside God (considering that nothing is more excellent than man) but even in God Himself. Moreover, the most true Scripture does teach us that God is of his own inclination naturally good, gentle, and as Paul calls Him, Philanthropon, a lover of us men, who has sent his own Son of his own nature into the world for our redemption: whereupon it does consequently follow, that God does freely of Himself, and for his Son’s sake love man, and not for any other cause. Whereby immediately all the preparaments, incitaments and merits of men being dissolved by the fire of God’s great love, do fade and pass away like smoke. For the grace of God is altogether free, and unless it be so, I cannot see how it can be called grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons, divided into Five Decades… (d. 1575; London: Ralph Newberry, 1577), 4th Decade, 1st Sermon, Of the Gospel of the Grace of God</cite>, p. 529</span></figcaption>

</figure><figure class="quote" id="q-1cf9912c79" data-kw="">
<blockquote><p>…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.”

— Andrew Willet, Hexapla, that is a Six-fold Commentary upon… Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6these+considerations+must+be+premised%3A+1.+That+mercy+is+otherwise+in+God+than+in+man%3A+in+man+indeed+it+is+a+grief+or+compassion+conceived+upon+another%E2%80%99s+misery%3A+but+in+God+it+is+only+a+propension+and+readiness+of+the+divine+will+to+help+those+which+are+in+misery.+2.+Mercy+in+God+either+signifies+the+inclination%2C+power%2C+faculty+and+property+to+show+mercy%2C+and+this+is+natural+in+God%3A+or+the+act+and+exercising+of+that+property+toward+the+creature%2C+and+this+is+so+natural+in+God+as+yet+it+is+directed+by+his+will.+3.+A+thing+is+said+to+be+natural+two+ways%3A+Either+that+which+only+proceeds+from+the+instinct+of+nature%2C+as+the+fire+naturally+burns%3A+or+that+whereunto+nature+inclines%2C+yet+not+without+direction+of+the+will%2C+as+thus+a+man+is+said+to+speak%2C+to+understand+naturally%3A+So+God+is+both+ways+naturally+merciful%2C+in+Himself+the+first+way%3B+toward+his+creatures+the+second.+Now+to+the+arguments+we+answer%3A+1.+The+apostle+%5Bin+Rom.+9%3A18%5D+speaks+not+of+the+natural+property%2C+but+of+the+act+of+mercy%2C+which+is+directed+by+the+will+of+God.+2.+All+the+natural+properties+which+are+in+God+He+always+uses+not%2C+nor+towards+all%3A+as+his+justice%2C+power%2C+longanimity%2C+mercy%3A+they+are+always+in+God%2C+but+He+exercises+them+as+it+pleases+Him.+3.+Justice+and+mercy+are+not+contrary%2C+but+cruelty+is+opposed+to+mercy%3A+neither+is+there+any+contrariety+in+God%2C+but+in+the+effects+in+diverse+subjects%3A+as+the+Sun+with+the+same+heat+mollifies+the+wax+and+hardens+the+clay.+4.+Neither+are+these+properties+unequal+in+God%2C+but+the+effects+and+acts+only+are+unequal%2C+as+it+pleases+God+to+dispose+in+his+freewill.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+Hexapla%2C+that+is+a+Six-fold+Commentary+upon%E2%80%A6+Romans...+%28Lege%2C+1611%29+%7C+on+ch.+9%2C+Places+of+Controversy%2C+Controversy+12%2C+Whether+mercy+be+a+natural+property+in+God%2C+or+an+effect+only+of+his+will%2C+against+Socinus%3F&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1cf9912c79.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1cf9912c79.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=%E2%80%A6these%20considerations%20must%20be%20premised%3A,God%20to%20dispose%20in%20his%20freewill." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-2d590d39b0" data-kw="">
<blockquote><p>But God (says Simon Magus) would not that Adam should have eaten of the forbidden fruit, who nevertheless did eat of that fruit; it follows therefore that he remained not as his Creator would have had him to have remained; how then can God be omnipotent, or his will always fulfilled? It were necessary, if we should fully satisfy this argument, to entreat more largely of the will of God than were convenient for this place: wherefore, that we may briefly answer this objection, we must presuppose with the school-divines a threefold distinction of the will of God, according to the diversity of their proper objects:¹ the first they call his efficient, effectual, or working will, by which God does so effectually intend anything that He performs it actually by some external operation and work, either actually produced or to be produced. ¹ Aquinas, [Summa] pt. 1, quest. 19; the same: Molina, Vasquez, Suarez, Sumel, Bannez and many others. The other kind of will which the divines distinguish in God, in regard of some objects which He does not really produce, is called inefficax voluntas, a kind of propension or inclination of his divine will to the effectuating of any good effect, which might redound to the felicity of man: yet for the attaining of the end, which out of his unsearchable wisdom He has prefixed, He oftentimes permits the contrary to this his divine inclination and will; the which therefore is called God’s permissive will. As for example, God would that all men should be saved, according to that of the apostle [1 Tim. 2:4], Deus vult omnes homines saluos fieri; to wit, in his universal grace, calling and inspirations and other general means, offered to all, so that out of his infinite goodness He wishes and wills in this sort all to be saved; and that He might the more manifest his infinite mercy by the efficacy of his working will, He actually saves some; even so, to manifest his justice by his other permissive decree, He permits others to work their own ruin and eternal damnation.</p></blockquote>

<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>

<blockquote><p>The impelling cause [of the gospel call], whereby God is moved internally by Himself, is God’s grace, his good pleasure and favorably-inclined will to offer, in Christ, his salvation to wretched sinners.</p></blockquote>

<blockquote><p>7. From these things it is plain that God, when He pursues with a hatred of displeasure an elect person whom He previously loved with a love of complacency, is not changed, even though perhaps the act of complacency, considered as it adds a respect of reason to such an object, is now in no way in Him. For: First, when such an act is removed, God is not physically and really changed, because nothing departs from Him beyond a mere respect of reason, as Suárez and Vázquez demonstrate by irrefutable arguments in the places cited. Secondly, neither is He changed morally, because He does not change his purpose, but on the contrary, remains [steadfast] in his purpose, or rather in his natural inclination, by which from eternity He was, now is, and always will be, inclined to love virtue and to detest vices or sins. He also remains [steadfast] in his purpose of leading those whom He chose and justified to eternal glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Venial &amp; Mortal Sin (1633; 1649), pt. 1, sect. 6, ‘God can love those whom He previously hated, and hate those whom He previously loved, without any change, whether physical or moral, in his will’ tr. Michael Lynch Latin</cite></span></figcaption>

</figure><figure class="quote" id="q-f6d7762388" data-kw="">
<blockquote><p>That God wills the good of men in bestowing any good gifts or graces upon them, needed no proof at all: We have always willingly granted this proposition. Yet for the true understanding thereof it must be observed that when we say, ‘This is God’s will; this is God’s aim or intent,’ these words have not always the same signification. This author [Samuel Hoard, an Arminian], by confounding the diverse meaning of these and the like words, does strangely entangle himself through his whole discourse. First therefore: Anything is said to be according to God’s will which, considered in itself, is according to the goodness and pureness of the Divine nature. This is a perpetual and necessary volition in God, qua Deo placet omne bonum [by which God is pleased by every good thing]. (See [Diego] Ruiz [d. 1632], Of the Will of God, disp. 6, §2, p. 38) And this simplex complacentia [simple complacency] towards all good actions of men, or events unto men, is possible circa creaturas omnes etiam nunquam futuras [about all creatures, even which will never be]. For there is no goodness imaginable which has not an agreement with the good will of God which we call amorem simplicis complacentiae [a love of simple complacency]. Satis constat hujusmodi complacentiam Dei versari circa poenitentiam, gratiam et gloriam possibilem Judae aut cujus libet damnati [It is sufficiently clear that this kind of complacency in God has reference to the possible repentance, grace, and glory of Judas, or of any damned person whatsoever]. (Ruiz, disp. 19, p. 214) But this is not it which we now speak of. 2. Secondly, God is said to will, desire or aim-at that good, for the obtaining whereof He affords fitting means, though withal He wills that it shall be in the liberty of the creature to hinder and frustrate those means, and though He have absolutely decreed to permit the creature to abuse them unto his own destruction. This is that which usually is termed by divines voluntas antecedens, voluntas conditionata, voluntas simplicis complacentiae [the will preceding, will-conditioned, will of simple complacency]. And thus God is said to aim-at or to will and desire the conversion, justification and salvation of those who never shall be converted, justified or saved. Neither must we think that by these men God’s omnipotent will is crossed, because his voluntas simplicis complacentiae [will of simple complacency] is not fulfilled. For the absolute will of God was that in such persons their own free-will might hinder the good effect of his gifts and graces, which He was absolutely resolved to permit for some greater good. Lastly, there is a will in God which strictly and most properly is called voluntas beneplaciti [will of good-pleasure] or his absolute will, which is not only a liking of the good willed unto the creature, and an ordering of fit means whereby the creature (if his own free-will hinder not) may attain it, but a merciful decree of so ordering the means and the very will of the creature, that it shall infallibly and infrustrately obtain the good end whereunto such means were accommodated. And of this will Ruiz truly affirms: Sola haec voluntas absoluta simpliciter amplectitur objectum, et ideo sola simpliciter et absolute meretur nomen voluntatis Beneplaciti [Only this absolute will simply embraces its object, and therefore only it, simply and absolutely, deserves the name of the will of good pleasure.]. (disp. 18, §4, p. 185) We grant, therefore, that in the second acception of the word ‘will,’ God truly wills, likes, desires the repentance, faith, perseverance and salvation of all to whom the Gospel is preached and Christ offered. But in the last and most proper acception, God wills the perseverance and salvation only of his elect, in whom He never ceases working till the happy effect be produced. Our divines at [the Synod of] Dort [1618-1619] granted a true and serious will in God according to the second acception of the word ‘will,’ but not according to the last. Which will simplicis complacentiae [of simple complacency] may stand with absolute reprobation. If this author can be content to acknowledge that for a true, serious and no delusory will, which affords the creature means of repenting, believing and being saved, though under an eternal absolute decree of permitting the final disobedience and perdition of the creature, we will free him from the trouble of answering the places of Scripture, and with him embrace the interpretation of Damascene, who tells us (Of the Orthodox Faith, bk. 4, ch. 20) that albeit the Scriptures do in such places seem to make God’s benefits causes of man’s sin and ruin, yet they must be understood [Greek], not [Greek]. A physician does give his patient physick with an absolute will to cure so far as his skill and ability will stretch: But God does not always give the means of salvation unto all men out of his absolute will, for then all should be cured and saved. Ps. 135, Omnia quaecunque voluit Deus, fecit in coelo et in terra [All which God wills is done in heaven and in earth]. Fulgentius gives the reason (1 ad Mon., ch. 12), Quia cui semper subest cum volet posse, non aliud est in illo velle quam posse [For to whom there is always present the ability whenever he wills, in him to will is nothing other than to be able.]. The will of God inviting or moving men to perform such good acts as tend to their salvation is God’s true and serious will, though He have not decreed by such means to produce their salvation. (See [Michael] Bajus, Institutes, bk. 1, ch. 104, etc. etc. 115, 116) This will is often despised by men to their own damnation. But there is a will not only ordaining means to the end, but of causing men to use the means unto the consecution of the end. And thus by giving them special grace, God wills the kingdom of glory only unto the elect. The former will is not to be baffled with the name of dissimulation, because this latter is only it which brings men unto glorification. And we further add that the reprobates in resisting the former will, which is vera voluntas simplicis complacentiae [the true will of simple complacency], do always fulfill the latter, which is God’s absolute will of permitting this resistance and of gathering out of it a greater illustration of his own glory. The blessings and means which God out of his goodness afforded to the angels, to Adam and which He continually affords unto wicked men, by the ill frame of their hearts may be and have been turned to their own hurt; and yet we cannot but acknowledge in them an antecedent and gracious will to do them good. But we do acknowledge, over and above this will of complacency, an absolute will of efficiency, by which God has mercifully decreed to work in some persons the will and the deed, and by the means of grace, de facto, to bring them unto glory. These two different manners of willing and working the salvation of men do demonstrate an absolute will in God of saving some, which we call the absolute decree of their election, and an absolute will of permitting others to draw upon themselves damnation by voluntary abusing the means of grace, which we call absolute reprobation. Chrysostom (who is no depressor of man’s free-will) was not ignorant of this absolute will of God turning and bending man’s which way He pleases: Si Deus voluerit, nullus impediet [If God wills, none impedes]. (See many times in homily 2 on Ps. 50) And of this will St. Augustine speaks (Enchiridion, ch. 97): In coelo et in terra non quaedam voluit et fecit, quaedam vero voluit et non fecit, sed omnia quaecun{que} voluit fecit. [In heaven and on earth, He did not will some things and accomplish them and will other things but not accomplish them; rather, He accomplished all things whatsoever He willed.] And St. Jerome, speaking of the Samaritans, says (apud Petr. Diac.): Si voluisset, ex indevotis devotos fecisset [If He had willed, He had made the impious pious]. And that prayer of Basil is famous (On the Incarnation, ch. 8): Malos, quaesumus, bonos facito; bonos in bonitate conserva. Omnia enim potes: quem enim volueris, salvas: et non est qui resistat tibi. [Make the wicked good, we beseech You; preserve the good in goodness. For You can do all things: whomsoever You will, You save; and there is none who may resist You.] Since therefore the Scriptures and the Fathers, and all orthodox divines, who confess that to be a true will which by affording ordinary means aims at the sanctification (1 Tim. 4:3) and salvation of all men (1 Tim. 2:4), do notwithstanding, intimate unto us an absolute will eternally predestinating and in time infallibly working the salvation only of some men; it is but a weak kind of reasoning from the affirmation of the one to conclude a negation of the other. The doctrine of absolute election and reprobation infers that God had not an absolute will by those means of grace which He bestowed upon the non-elect angels or men to bring them unto glory; and that He had an absolute will to permit themselves to abuse them to the procuring of their own eternal misery: And yet he that should say that God by giving the non-elect angels such excellent endowments, or by giving Cain and Judas such fatherly admonitions, did in those means aim at their destruction, speaks both ignorantly and profanely. For the aim of God and the end of any good gift which He vouchsafes unto men, is to be measured by the nature of the gift itself and not by the perverse use which God suffers the receivers to make of it. Calvin usually speaks in the Scripture-phrase, even in those points which seem harsh to the ears of the Remonstrants. But this author having before truly explained how such phrases are to be understood, namely of the end whereunto reprobates always finally abuse them, and not of the end whereunto God has ordained them, he had done much better to have afforded Calvin’s words this charitable construction. And as for Beza, he denies not a proper and true ordination of the divine grace unto the effecting of salvation in all to whom it is afforded, nor a true will of complacency in God, that by them it should be used to that good end: but he denies an absolute will in God of saving them by that grace; and he shows the end which the wicked always come to by abusing it, which is, ut gravius puniantur [that they are more severely punished]. That Calvin had no other meaning, appears by these words of his which shut-up the section out of which the former are taken: Quid sibi vult Dominus eos docendo a quibus ne intelligatur curat? Considera unde vitium, et desines interrogare. In verbo enim qualiscunque sit obscuritas, satis tamen semper est lucis ad convincendam impiorum conscientiam. [What does the Lord intend by teaching those whom He takes no care should understand? Consider from where the fault proceeds, and you will cease to inquire. For in the Word, whatever its obscurity may be, there is nevertheless always enough light to convict the consciences of the wicked.] The drift of Calvin is not to affirm that God works either by any positive action, or by proper ordination of his Word unto any such end that deafness, blindness, senselesseness whereunto the reprobate grow only by their own default. But because God, who could soften their hearts and would if they were in the number of his elect, has ordained not to do it, this ordination is intimated by the event which perpetually follows upon it, namely deafness, blindness, etc. So that all which Calvin intends is this (see §14-15, where is mind is explained), that where God has not comprised men within his merciful decree of predestination, there He has decreed to hold-off his hand from effectually opening their ears and eyes; and they suo vitio obsurdescunt [become deaf through their own fault], etc. And Beza had no other intent, but to show that the Word preached unto the reprobate (Opuscula, p. 30 and Of Predestination, p. 434): non eo usque conjunctum cum Spiritus ministerio, ut illos vera fide, qua propria nota electi a reprobis dignoscuntur, Christo ut palmites frugiferos inserat. [is not so joined with the ministry of the Spirit as to insert them into Christ by true faith, by which, as the distinctive mark, the elect are distinguished from the reprobate as fruitful branches.] Whence follows that woeful event, ut justo exitio devoti magis ac magìs reddantur [Greek] [that they may be rendered more and more devoted to just destruction]. For [Johannes] Maccovius, if his speeches [see pp. 372-73 in the previous section] tend to show the intentional end of the gospel preached, and not the eventual success, we utterly disclaim his opinion. For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“That God wills the good of men in bestowing any good gifts or graces upon them, needed no proof at all: We have always willingly granted this proposition. Yet for the true understanding thereof it must be observed that when we say, ‘This is God’s will; this is God’s aim or intent,’ these words have not always the same signification. This author [Samuel Hoard, an Arminian], by confounding the diverse meaning of these and the like words, does strangely entangle himself through his whole discourse. First therefore: Anything is said to be according to God’s will which, considered in itself, is according to the goodness and pureness of the Divine nature. This is a perpetual and necessary volition in God, qua Deo placet omne bonum [by which God is pleased by every good thing]. (See [Diego] Ruiz [d. 1632], Of the Will of God, disp. 6, §2, p. 38) And this simplex complacentia [simple complacency] towards all good actions of men, or events unto men, is possible circa creaturas omnes etiam nunquam futuras [about all creatures, even which will never be]. For there is no goodness imaginable which has not an agreement with the good will of God which we call amorem simplicis complacentiae [a love of simple complacency]. Satis constat hujusmodi complacentiam Dei versari circa poenitentiam, gratiam et gloriam possibilem Judae aut cujus libet damnati [It is sufficiently clear that this kind of complacency in God has reference to the possible repentance, grace, and glory of Judas, or of any damned person whatsoever]. (Ruiz, disp. 19, p. 214) But this is not it which we now speak of. 2. Secondly, God is said to will, desire or aim-at that good, for the obtaining whereof He affords fitting means, though withal He wills that it shall be in the liberty of the creature to hinder and frustrate those means, and though He have absolutely decreed to permit the creature to abuse them unto his own destruction. This is that which usually is termed by divines voluntas antecedens, voluntas conditionata, voluntas simplicis complacentiae [the will preceding, will-conditioned, will of simple complacency]. And thus God is said to aim-at or to will and desire the conversion, justification and salvation of those who never shall be converted, justified or saved. Neither must we think that by these men God’s omnipotent will is crossed, because his voluntas simplicis complacentiae [will of simple complacency] is not fulfilled. For the absolute will of God was that in such persons their own free-will might hinder the good effect of his gifts and graces, which He was absolutely resolved to permit for some greater good. Lastly, there is a will in God which strictly and most properly is called voluntas beneplaciti [will of good-pleasure] or his absolute will, which is not only a liking of the good willed unto the creature, and an ordering of fit means whereby the creature (if his own free-will hinder not) may attain it, but a merciful decree of so ordering the means and the very will of the creature, that it shall infallibly and infrustrately obtain the good end whereunto such means were accommodated. And of this will Ruiz truly affirms: Sola haec voluntas absoluta simpliciter amplectitur objectum, et ideo sola simpliciter et absolute meretur nomen voluntatis Beneplaciti [Only this absolute will simply embraces its object, and therefore only it, simply and absolutely, deserves the name of the will of good pleasure.]. (disp. 18, §4, p. 185) We grant, therefore, that in the second acception of the word ‘will,’ God truly wills, likes, desires the repentance, faith, perseverance and salvation of all to whom the Gospel is preached and Christ offered. But in the last and most proper acception, God wills the perseverance and salvation only of his elect, in whom He never ceases working till the happy effect be produced. Our divines at [the Synod of] Dort [1618-1619] granted a true and serious will in God according to the second acception of the word ‘will,’ but not according to the last. Which will simplicis complacentiae [of simple complacency] may stand with absolute reprobation. If this author can be content to acknowledge that for a true, serious and no delusory will, which affords the creature means of repenting, believing and being saved, though under an eternal absolute decree of permitting the final disobedience and perdition of the creature, we will free him from the trouble of answering the places of Scripture, and with him embrace the interpretation of Damascene, who tells us (Of the Orthodox Faith, bk. 4, ch. 20) that albeit the Scriptures do in such places seem to make God’s benefits causes of man’s sin and ruin, yet they must be understood [Greek], not [Greek]. A physician does give his patient physick with an absolute will to cure so far as his skill and ability will stretch: But God does not always give the means of salvation unto all men out of his absolute will, for then all should be cured and saved. Ps. 135, Omnia quaecunque voluit Deus, fecit in coelo et in terra [All which God wills is done in heaven and in earth]. Fulgentius gives the reason (1 ad Mon., ch. 12), Quia cui semper subest cum volet posse, non aliud est in illo velle quam posse [For to whom there is always present the ability whenever he wills, in him to will is nothing other than to be able.]. The will of God inviting or moving men to perform such good acts as tend to their salvation is God’s true and serious will, though He have not decreed by such means to produce their salvation. (See [Michael] Bajus, Institutes, bk. 1, ch. 104, etc. etc. 115, 116) This will is often despised by men to their own damnation. But there is a will not only ordaining means to the end, but of causing men to use the means unto the consecution of the end. And thus by giving them special grace, God wills the kingdom of glory only unto the elect. The former will is not to be baffled with the name of dissimulation, because this latter is only it which brings men unto glorification. And we further add that the reprobates in resisting the former will, which is vera voluntas simplicis complacentiae [the true will of simple complacency], do always fulfill the latter, which is God’s absolute will of permitting this resistance and of gathering out of it a greater illustration of his own glory. The blessings and means which God out of his goodness afforded to the angels, to Adam and which He continually affords unto wicked men, by the ill frame of their hearts may be and have been turned to their own hurt; and yet we cannot but acknowledge in them an antecedent and gracious will to do them good. But we do acknowledge, over and above this will of complacency, an absolute will of efficiency, by which God has mercifully decreed to work in some persons the will and the deed, and by the means of grace, de facto, to bring them unto glory. These two different manners of willing and working the salvation of men do demonstrate an absolute will in God of saving some, which we call the absolute decree of their election, and an absolute will of permitting others to draw upon themselves damnation by voluntary abusing the means of grace, which we call absolute reprobation. Chrysostom (who is no depressor of man’s free-will) was not ignorant of this absolute will of God turning and bending man’s which way He pleases: Si Deus voluerit, nullus impediet [If God wills, none impedes]. (See many times in homily 2 on Ps. 50) And of this will St. Augustine speaks (Enchiridion, ch. 97): In coelo et in terra non quaedam voluit et fecit, quaedam vero voluit et non fecit, sed omnia quaecun{que} voluit fecit. [In heaven and on earth, He did not will some things and accomplish them and will other things but not accomplish them; rather, He accomplished all things whatsoever He willed.] And St. Jerome, speaking of the Samaritans, says (apud Petr. Diac.): Si voluisset, ex indevotis devotos fecisset [If He had willed, He had made the impious pious]. And that prayer of Basil is famous (On the Incarnation, ch. 8): Malos, quaesumus, bonos facito; bonos in bonitate conserva. Omnia enim potes: quem enim volueris, salvas: et non est qui resistat tibi. [Make the wicked good, we beseech You; preserve the good in goodness. For You can do all things: whomsoever You will, You save; and there is none who may resist You.] Since therefore the Scriptures and the Fathers, and all orthodox divines, who confess that to be a true will which by affording ordinary means aims at the sanctification (1 Tim. 4:3) and salvation of all men (1 Tim. 2:4), do notwithstanding, intimate unto us an absolute will eternally predestinating and in time infallibly working the salvation only of some men; it is but a weak kind of reasoning from the affirmation of the one to conclude a negation of the other. The doctrine of absolute election and reprobation infers that God had not an absolute will by those means of grace which He bestowed upon the non-elect angels or men to bring them unto glory; and that He had an absolute will to permit themselves to abuse them to the procuring of their own eternal misery: And yet he that should say that God by giving the non-elect angels such excellent endowments, or by giving Cain and Judas such fatherly admonitions, did in those means aim at their destruction, speaks both ignorantly and profanely. For the aim of God and the end of any good gift which He vouchsafes unto men, is to be measured by the nature of the gift itself and not by the perverse use which God suffers the receivers to make of it. Calvin usually speaks in the Scripture-phrase, even in those points which seem harsh to the ears of the Remonstrants. But this author having before truly explained how such phrases are to be understood, namely of the end whereunto reprobates always finally abuse them, and not of the end whereunto God has ordained them, he had done much better to have afforded Calvin’s words this charitable construction. And as for Beza, he denies not a proper and true ordination of the divine grace unto the effecting of salvation in all to whom it is afforded, nor a true will of complacency in God, that by them it should be used to that good end: but he denies an absolute will in God of saving them by that grace; and he shows the end which the wicked always come to by abusing it, which is, ut gravius puniantur [that they are more severely punished]. That Calvin had no other meaning, appears by these words of his which shut-up the section out of which the former are taken: Quid sibi vult Dominus eos docendo a quibus ne intelligatur curat? Considera unde vitium, et desines interrogare. In verbo enim qualiscunque sit obscuritas, satis tamen semper est lucis ad convincendam impiorum conscientiam. [What does the Lord intend by teaching those whom He takes no care should understand? Consider from where the fault proceeds, and you will cease to inquire. For in the Word, whatever its obscurity may be, there is nevertheless always enough light to convict the consciences of the wicked.] The drift of Calvin is not to affirm that God works either by any positive action, or by proper ordination of his Word unto any such end that deafness, blindness, senselesseness whereunto the reprobate grow only by their own default. But because God, who could soften their hearts and would if they were in the number of his elect, has ordained not to do it, this ordination is intimated by the event which perpetually follows upon it, namely deafness, blindness, etc. So that all which Calvin intends is this (see §14-15, where is mind is explained), that where God has not comprised men within his merciful decree of predestination, there He has decreed to hold-off his hand from effectually opening their ears and eyes; and they suo vitio obsurdescunt [become deaf through their own fault], etc. And Beza had no other intent, but to show that the Word preached unto the reprobate (Opuscula, p. 30 and Of Predestination, p. 434): non eo usque conjunctum cum Spiritus ministerio, ut illos vera fide, qua propria nota electi a reprobis dignoscuntur, Christo ut palmites frugiferos inserat. [is not so joined with the ministry of the Spirit as to insert them into Christ by true faith, by which, as the distinctive mark, the elect are distinguished from the reprobate as fruitful branches.] Whence follows that woeful event, ut justo exitio devoti magis ac magìs reddantur [Greek] [that they may be rendered more and more devoted to just destruction]. For [Johannes] Maccovius, if his speeches [see pp. 372-73 in the previous section] tend to show the intentional end of the gospel preached, and not the eventual success, we utterly disclaim his opinion. For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].”

— John Davenant, Animadversions upon a Treatise entitled, God’s Love to Mankind... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’, pp. 390-93">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+God+wills+the+good+of+men+in+bestowing+any+good+gifts+or+graces+upon+them%2C+needed+no+proof+at+all%3A+We+have+always+willingly+granted+this+proposition.+Yet+for+the+true+understanding+thereof+it+must+be+observed+that+when+we+say%2C+%E2%80%98This+is+God%E2%80%99s+will%3B+this+is+God%E2%80%99s+aim+or+intent%2C%E2%80%99+these+words+have+not+always+the+same+signification.+This+author+%5BSamuel+Hoard%2C+an+Arminian%5D%2C+by+confounding+the+diverse+meaning+of+these+and+the+like+words%2C+does+strangely+entangle+himself+through+his+whole+discourse.+First+therefore%3A+Anything+is+said+to+be+according+to+God%E2%80%99s+will+which%2C+considered+in+itself%2C+is+according+to+the+goodness+and+pureness+of+the+Divine+nature.+This+is+a+perpetual+and+necessary+volition+in+God%2C+qua+Deo+placet+omne+bonum+%5Bby+which+God+is+pleased+by+every+good+thing%5D.+%28See+%5BDiego%5D+Ruiz+%5Bd.+1632%5D%2C+Of+the+Will+of+God%2C+disp.+6%2C+%C2%A72%2C+p.+38%29+And+this+simplex+complacentia+%5Bsimple+complacency%5D+towards+all+good+actions+of+men%2C+or+events+unto+men%2C+is+possible+circa+creaturas+omnes+etiam+nunquam+futuras+%5Babout+all+creatures%2C+even+which+will+never+be%5D.+For+there+is+no+goodness+imaginable+which+has+not+an+agreement+with+the+good+will+of+God+which+we+call+amorem+simplicis+complacentiae+%5Ba+love+of+simple+complacency%5D.+Satis+constat+hujusmodi+complacentiam+Dei+versari+circa+poenitentiam%2C+gratiam+et+gloriam+possibilem+Judae+aut+cujus+libet+damnati+%5BIt+is+sufficiently+clear+that+this+kind+of+complacency+in+God+has+reference+to+the+possible+repentance%2C+grace%2C+and+glory+of+Judas%2C+or+of+any+damned+person+whatsoever%5D.+%28Ruiz%2C+disp.+19%2C+p.+214%29+But+this+is+not+it+which+we+now+speak+of.+2.+Secondly%2C+God+is+said+to+will%2C+desire+or+aim-at+that+good%2C+for+the+obtaining+whereof+He+affords+fitting+means%2C+though+withal+He+wills+that+it+shall+be+in+the+liberty+of+the+creature+to+hinder+and+frustrate+those+means%2C+and+though+He+have+absolutely+decreed+to+permit+the+creature+to+abuse+them+unto+his+own+destruction.+This+is+that+which+usually+is+termed+by+divines+voluntas+antecedens%2C+voluntas+conditionata%2C+voluntas+simplicis+complacentiae+%5Bthe+will+preceding%2C+will-conditioned%2C+will+of+simple+complacency%5D.+And+thus+God+is+said+to+aim-at+or+to+will+and+desire+the+conversion%2C+justification+and+salvation+of+those+who+never+shall+be+converted%2C+justified+or+saved.+Neither+must+we+think+that+by+these+men+God%E2%80%99s+omnipotent+will+is+crossed%2C+because+his+voluntas+simplicis+complacentiae+%5Bwill+of+simple+complacency%5D+is+not+fulfilled.+For+the+absolute+will+of+God+was+that+in+such+persons+their+own+free-will+might+hinder+the+good+effect+of+his+gifts+and+graces%2C+which+He+was+absolutely+resolved+to+permit+for+some+greater+good.+Lastly%2C+there+is+a+will+in+God+which+strictly+and+most+properly+is+called+voluntas+beneplaciti+%5Bwill+of+good-pleasure%5D+or+his+absolute+will%2C+which+is+not+only+a+liking+of+the+good+willed+unto+the+creature%2C+and+an+ordering+of+fit+means+whereby+the+creature+%28if+his+own+free-will+hinder+not%29+may+attain+it%2C+but+a+merciful+decree+of+so+ordering+the+means+and+the+very+will+of+the+creature%2C+that+it+shall+infallibly+and+infrustrately+obtain+the+good+end+whereunto+such+means+were+accommodated.+And+of+this+will+Ruiz+truly+affirms%3A+Sola+haec+voluntas+absoluta+simpliciter+amplectitur+objectum%2C+et+ideo+sola+simpliciter+et+absolute+meretur+nomen+voluntatis+Beneplaciti+%5BOnly+this+absolute+will+simply+embraces+its+object%2C+and+therefore+only+it%2C+simply+and+absolutely%2C+deserves+the+name+of+the+will+of+good+pleasure.%5D.+%28disp.+18%2C+%C2%A74%2C+p.+185%29+We+grant%2C+therefore%2C+that+in+the+second+acception+of+the+word+%E2%80%98will%2C%E2%80%99+God+truly+wills%2C+likes%2C+desires+the+repentance%2C+faith%2C+perseverance+and+salvation+of+all+to+whom+the+Gospel+is+preached+and+Christ+offered.+But+in+the+last+and+most+proper+acception%2C+God+wills+the+perseverance+and+salvation+only+of+his+elect%2C+in+whom+He+never+ceases+working+till+the+happy+effect+be+produced.+Our+divines+at+%5Bthe+Synod+of%5D+Dort+%5B1618-1619%5D+granted+a+true+and+serious+will+in+God+according+to+the+second+acception+of+the+word+%E2%80%98will%2C%E2%80%99+but+not+according+to+the+last.+Which+will+simplicis+complacentiae+%5Bof+simple+complacency%5D+may+stand+with+absolute+reprobation.+If+this+author+can+be+content+to+acknowledge+that+for+a+true%2C+serious+and+no+delusory+will%2C+which+affords+the+creature+means+of+repenting%2C+believing+and+being+saved%2C+though+under+an+eternal+absolute+decree+of+permitting+the+final+disobedience+and+perdition+of+the+creature%2C+we+will+free+him+from+the+trouble+of+answering+the+places+of+Scripture%2C+and+with+him+embrace+the+interpretation+of+Damascene%2C+who+tells+us+%28Of+the+Orthodox+Faith%2C+bk.+4%2C+ch.+20%29+that+albeit+the+Scriptures+do+in+such+places+seem+to+make+God%E2%80%99s+benefits+causes+of+man%E2%80%99s+sin+and+ruin%2C+yet+they+must+be+understood+%5BGreek%5D%2C+not+%5BGreek%5D.+A+physician+does+give+his+patient+physick+with+an+absolute+will+to+cure+so+far+as+his+skill+and+ability+will+stretch%3A+But+God+does+not+always+give+the+means+of+salvation+unto+all+men+out+of+his+absolute+will%2C+for+then+all+should+be+cured+and+saved.+Ps.+135%2C+Omnia+quaecunque+voluit+Deus%2C+fecit+in+coelo+et+in+terra+%5BAll+which+God+wills+is+done+in+heaven+and+in+earth%5D.+Fulgentius+gives+the+reason+%281+ad+Mon.%2C+ch.+12%29%2C+Quia+cui+semper+subest+cum+volet+posse%2C+non+aliud+est+in+illo+velle+quam+posse+%5BFor+to+whom+there+is+always+present+the+ability+whenever+he+wills%2C+in+him+to+will+is+nothing+other+than+to+be+able.%5D.+The+will+of+God+inviting+or+moving+men+to+perform+such+good+acts+as+tend+to+their+salvation+is+God%E2%80%99s+true+and+serious+will%2C+though+He+have+not+decreed+by+such+means+to+produce+their+salvation.+%28See+%5BMichael%5D+Bajus%2C+Institutes%2C+bk.+1%2C+ch.+104%2C+etc.+etc.+115%2C+116%29+This+will+is+often+despised+by+men+to+their+own+damnation.+But+there+is+a+will+not+only+ordaining+means+to+the+end%2C+but+of+causing+men+to+use+the+means+unto+the+consecution+of+the+end.+And+thus+by+giving+them+special+grace%2C+God+wills+the+kingdom+of+glory+only+unto+the+elect.+The+former+will+is+not+to+be+baffled+with+the+name+of+dissimulation%2C+because+this+latter+is+only+it+which+brings+men+unto+glorification.+And+we+further+add+that+the+reprobates+in+resisting+the+former+will%2C+which+is+vera+voluntas+simplicis+complacentiae+%5Bthe+true+will+of+simple+complacency%5D%2C+do+always+fulfill+the+latter%2C+which+is+God%E2%80%99s+absolute+will+of+permitting+this+resistance+and+of+gathering+out+of+it+a+greater+illustration+of+his+own+glory.+The+blessings+and+means+which+God+out+of+his+goodness+afforded+to+the+angels%2C+to+Adam+and+which+He+continually+affords+unto+wicked+men%2C+by+the+ill+frame+of+their+hearts+may+be+and+have+been+turned+to+their+own+hurt%3B+and+yet+we+cannot+but+acknowledge+in+them+an+antecedent+and+gracious+will+to+do+them+good.+But+we+do+acknowledge%2C+over+and+above+this+will+of+complacency%2C+an+absolute+will+of+efficiency%2C+by+which+God+has+mercifully+decreed+to+work+in+some+persons+the+will+and+the+deed%2C+and+by+the+means+of+grace%2C+de+facto%2C+to+bring+them+unto+glory.+These+two+different+manners+of+willing+and+working+the+salvation+of+men+do+demonstrate+an+absolute+will+in+God+of+saving+some%2C+which+we+call+the+absolute+decree+of+their+election%2C+and+an+absolute+will+of+permitting+others+to+draw+upon+themselves+damnation+by+voluntary+abusing+the+means+of+grace%2C+which+we+call+absolute+reprobation.+Chrysostom+%28who+is+no+depressor+of+man%E2%80%99s+free-will%29+was+not+ignorant+of+this+absolute+will+of+God+turning+and+bending+man%E2%80%99s+which+way+He+pleases%3A+Si+Deus+voluerit%2C+nullus+impediet+%5BIf+God+wills%2C+none+impedes%5D.+%28See+many+times+in+homily+2+on+Ps.+50%29+And+of+this+will+St.+Augustine+speaks+%28Enchiridion%2C+ch.+97%29%3A+In+coelo+et+in+terra+non+quaedam+voluit+et+fecit%2C+quaedam+vero+voluit+et+non+fecit%2C+sed+omnia+quaecun%7Bque%7D+voluit+fecit.+%5BIn+heaven+and+on+earth%2C+He+did+not+will+some+things+and+accomplish+them+and+will+other+things+but+not+accomplish+them%3B+rather%2C+He+accomplished+all+things+whatsoever+He+willed.%5D+And+St.+Jerome%2C+speaking+of+the+Samaritans%2C+says+%28apud+Petr.+Diac.%29%3A+Si+voluisset%2C+ex+indevotis+devotos+fecisset+%5BIf+He+had+willed%2C+He+had+made+the+impious+pious%5D.+And+that+prayer+of+Basil+is+famous+%28On+the+Incarnation%2C+ch.+8%29%3A+Malos%2C+quaesumus%2C+bonos+facito%3B+bonos+in+bonitate+conserva.+Omnia+enim+potes%3A+quem+enim+volueris%2C+salvas%3A+et+non+est+qui+resistat+tibi.+%5BMake+the+wicked+good%2C+we+beseech+You%3B+preserve+the+good+in+goodness.+For+You+can+do+all+things%3A+whomsoever+You+will%2C+You+save%3B+and+there+is+none+who+may+resist+You.%5D+Since+therefore+the+Scriptures+and+the+Fathers%2C+and+all+orthodox+divines%2C+who+confess+that+to+be+a+true+will+which+by+affording+ordinary+means+aims+at+the+sanctification+%281+Tim.+4%3A3%29+and+salvation+of+all+men+%281+Tim.+2%3A4%29%2C+do+notwithstanding%2C+intimate+unto+us+an+absolute+will+eternally+predestinating+and+in+time+infallibly+working+the+salvation+only+of+some+men%3B+it+is+but+a+weak+kind+of+reasoning+from+the+affirmation+of+the+one+to+conclude+a+negation+of+the+other.+The+doctrine+of+absolute+election+and+reprobation+infers+that+God+had+not+an+absolute+will+by+those+means+of+grace+which+He+bestowed+upon+the+non-elect+angels+or+men+to+bring+them+unto+glory%3B+and+that+He+had+an+absolute+will+to+permit+themselves+to+abuse+them+to+the+procuring+of+their+own+eternal+misery%3A+And+yet+he+that+should+say+that+God+by+giving+the+non-elect+angels+such+excellent+endowments%2C+or+by+giving+Cain+and+Judas+such+fatherly+admonitions%2C+did+in+those+means+aim+at+their+destruction%2C+speaks+both+ignorantly+and+profanely.+For+the+aim+of+God+and+the+end+of+any+good+gift+which+He+vouchsafes+unto+men%2C+is+to+be+measured+by+the+nature+of+the+gift+itself+and+not+by+the+perverse+use+which+God+suffers+the+receivers+to+make+of+it.+Calvin+usually+speaks+in+the+Scripture-phrase%2C+even+in+those+points+which+seem+harsh+to+the+ears+of+the+Remonstrants.+But+this+author+having+before+truly+explained+how+such+phrases+are+to+be+understood%2C+namely+of+the+end+whereunto+reprobates+always+finally+abuse+them%2C+and+not+of+the+end+whereunto+God+has+ordained+them%2C+he+had+done+much+better+to+have+afforded+Calvin%E2%80%99s+words+this+charitable+construction.+And+as+for+Beza%2C+he+denies+not+a+proper+and+true+ordination+of+the+divine+grace+unto+the+effecting+of+salvation+in+all+to+whom+it+is+afforded%2C+nor+a+true+will+of+complacency+in+God%2C+that+by+them+it+should+be+used+to+that+good+end%3A+but+he+denies+an+absolute+will+in+God+of+saving+them+by+that+grace%3B+and+he+shows+the+end+which+the+wicked+always+come+to+by+abusing+it%2C+which+is%2C+ut+gravius+puniantur+%5Bthat+they+are+more+severely+punished%5D.+That+Calvin+had+no+other+meaning%2C+appears+by+these+words+of+his+which+shut-up+the+section+out+of+which+the+former+are+taken%3A+Quid+sibi+vult+Dominus+eos+docendo+a+quibus+ne+intelligatur+curat%3F+Considera+unde+vitium%2C+et+desines+interrogare.+In+verbo+enim+qualiscunque+sit+obscuritas%2C+satis+tamen+semper+est+lucis+ad+convincendam+impiorum+conscientiam.+%5BWhat+does+the+Lord+intend+by+teaching+those+whom+He+takes+no+care+should+understand%3F+Consider+from+where+the+fault+proceeds%2C+and+you+will+cease+to+inquire.+For+in+the+Word%2C+whatever+its+obscurity+may+be%2C+there+is+nevertheless+always+enough+light+to+convict+the+consciences+of+the+wicked.%5D+The+drift+of+Calvin+is+not+to+affirm+that+God+works+either+by+any+positive+action%2C+or+by+proper+ordination+of+his+Word+unto+any+such+end+that+deafness%2C+blindness%2C+senselesseness+whereunto+the+reprobate+grow+only+by+their+own+default.+But+because+God%2C+who+could+soften+their+hearts+and+would+if+they+were+in+the+number+of+his+elect%2C+has+ordained+not+to+do+it%2C+this+ordination+is+intimated+by+the+event+which+perpetually+follows+upon+it%2C+namely+deafness%2C+blindness%2C+etc.+So+that+all+which+Calvin+intends+is+this+%28see+%C2%A714-15%2C+where+is+mind+is+explained%29%2C+that+where+God+has+not+comprised+men+within+his+merciful+decree+of+predestination%2C+there+He+has+decreed+to+hold-off+his+hand+from+effectually+opening+their+ears+and+eyes%3B+and+they+suo+vitio+obsurdescunt+%5Bbecome+deaf+through+their+own+fault%5D%2C+etc.+And+Beza+had+no+other+intent%2C+but+to+show+that+the+Word+preached+unto+the+reprobate+%28Opuscula%2C+p.+30+and+Of+Predestination%2C+p.+434%29%3A+non+eo+usque+conjunctum+cum+Spiritus+ministerio%2C+ut+illos+vera+fide%2C+qua+propria+nota+electi+a+reprobis+dignoscuntur%2C+Christo+ut+palmites+frugiferos+inserat.+%5Bis+not+so+joined+with+the+ministry+of+the+Spirit+as+to+insert+them+into+Christ+by+true+faith%2C+by+which%2C+as+the+distinctive+mark%2C+the+elect+are+distinguished+from+the+reprobate+as+fruitful+branches.%5D+Whence+follows+that+woeful+event%2C+ut+justo+exitio+devoti+magis+ac+mag%C3%ACs+reddantur+%5BGreek%5D+%5Bthat+they+may+be+rendered+more+and+more+devoted+to+just+destruction%5D.+For+%5BJohannes%5D+Maccovius%2C+if+his+speeches+%5Bsee+pp.+372-73+in+the+previous+section%5D+tend+to+show+the+intentional+end+of+the+gospel+preached%2C+and+not+the+eventual+success%2C+we+utterly+disclaim+his+opinion.+For+God+properly+intends+no+end+of+his+volitions+or+actions+but+Himself%2C+unto+whose+glory+all+things+have+naturam+mediorum+%5Bthe+nature+of+means%5D%2C+not+intenti+finis+%5Bthe+intention+of+an+end%5D.+The+intention+therefore+of+means+by+God+unto+any+lower+or+inferior+end+is+nothing+else+but+the+fitness+of+such+means+considered+in+themselves+%28and+not+abused%29+for+the+producing+of+that+end%3A+And+this+intention+is+not+altered+by+the+decree+of+reprobation%3B+for+that+decree+as+it+is+immanent+and+eternal+in+voluntate+divina%2C+nihil+ponit+in+reprobato+%5Bin+the+divine+will%2C+puts+nothing+in+the+reprobate%5D%3A+And+when+the+temporal+execution+comes%2C+it+puts+no+malice+into+his+will%3B+it+puts+no+necessitation+unto+wicked+actions+upon+his+will%3B+it+only+puts+in+God+an+absolute+will+of+not-giving+effectual+grace%2C+and+of+not-working+in+him+salutiferous+actions%2C+whereupon+follows+perditio+tua+exte+%5Byour+destruction+is+out+of+yourself%2C+Hos.+13%3A9%5D.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Animadversions+upon+a+Treatise+entitled%2C+God%E2%80%99s+Love+to+Mankind...+%28Cambridge%3A+Daniel%2C+1641%29%2C+%E2%80%98Answer%3A+Whether+the+decree+of+absolute+Reprobation+is+contrary+unto+the+use+and+end+of+God%E2%80%99s+gifts+bestowed+upon+men%2C%E2%80%99%2C+pp.+390-93&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6d7762388.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6d7762388.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=That%20God%20wills%20the%20good%20of,is%20out%20of%20yourself%2C%20Hos.%2013%3A9%5D." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Besides, the text [2 Cor. 5:13] only says, ‘God is reconciling the world to Himself;’ now there is a great difference between God reconciling and reconciled: The former supposes in God a propensity to bring about the way of reconciliation; not that He is already reconciled, but this flows from a general love and pity He bears to mankind, whereby He procures a way that actual reconciliation may be obtained between man and God; yea Eph. 2:16 compared with Col. 1:20…</p></blockquote>

<blockquote><p>[Margin:] (What mercy is in God: Miseri cordia est voluntas Dei qua ad succurrendum miseris et propensus [Mercy is the will of God by which He is inclined to succor the miserable.]; [Johannes] Sharpius. The mercy of God some call the property or attribute of his nature, inclining Him to relieve the misery of his creature; some the essence of God showing mercy. [William] Sclater on the 117th Psalm: Ira dicitur esse in Deo non ut turbidus motus animi sed simplex voluntas ad ultionem.) But mercy in God is his very essence whereby He is infinitely disposed to help succour and comfort such as be in any miserable condition. Those expressions in Scripture: ‘In their afflictions He was afflicted’; and ‘Mine heart is turned within Me, my repentings are kindled together,’ are borrowed phrases, as from the turning of the bowels in men at the sight of an object of pity. And yet in men this is not mercy itself but a companion of pity. Yet because by it our mercy is made known, we call it by the name of ‘mercy’. We call rolling of bowels mercy, and mercy rolling of bowels, which yet is but a companion of it, and that in men only and not in God. Mercy may be without it, and in God always is; because God has no bowels to be turned, God is one most simple essence, and has no qualities. And therefore when we say God is merciful, we speak of Him metaphorically, as when we say God is angry. Anger is a turbulency of spirit, but there is no such thing in God. The effects of that which is called anger in God are often put for anger: as when we see the punishment and scourges on the backs of wicked men we conclude that God is angry. In like manner when we see the [hurtful] rod taken of and cast into the fire (which is an effect of mercy) we say God is merciful. But mercy in God signifies two things: First, an inclination in his heavenly Majesty to show mercy. Secondly, the effects of his supposed affection, which is his helping of the miserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.</p></blockquote>

<blockquote><p>God in this attribute of mercy is infinite and incomprehensible. He is in this as in other attributes; indeed He is God. Heaps of places I might bring in; the Bible abounds with passages of the merciful inclination of God: Ex. 34:6-7, ‘The Lord God merciful and gracious, etc.’ And again, ‘Keeping mercy for thousands.’ Dt. 5:10, ‘And showing mercy unto thousands.’ Ps. 36:5, ‘Thy mercy O Lord is in the heavens,’ or unto the heavens. So that we need not ask as Esau did of Jacob his father about a blessing, ‘Hast thou but one blessing my father?’ (Gen. 27:38) So hast Thou but one mercy, O God? For come there never so many, there is mercy for all. The bottomless ocean of God’s mercy can never possibly be drawn dry by the creature. Many admirable sayings have we touching God’s mercy: First, God inclines to it; it comes naturally from Him: not as waters out of the pump, but as showers from heaven. Tis but ‘open our mouths’ and God will fill them [Ps. 95]. Yea secondly (to use the words of a painful and learned writer; [John] Downame’s Christian Warfare, bk. 2, ch. 34, sect. 4, p. 204), ‘It is not only not troublesome and painful’ (to wit because it is natural to God to show mercy) ‘but also pleasant and delightful for God to show mercy, etc.’ And a little after: ‘And contrariwise it should be troublesome and irksome, if I may so speak‘ (says mine author) ‘for God not to show and exercise his nature and mercy, etc.’ And once more: ‘For as the eye is delighted with seeing, and to be restrained therefrom is grievous unto it, as the ear is delighted with hearing and is much molested if it be stopped; and as every part and faculty of the body and soul are delighted in exercising their several actions and functions and are much vexed and cumbered if by any means they should be hindered, so is the Lord delighted and well pleased in showing and exercising his own nature and attributes.’ God weeps when He strikes, but smiles when He strokes. It does his heart good (as we use to say of men). Certainly God will not be barred of his pleasure; He rejoices much to have an occasion offered of exercising his mercy. Ps. 147:11, David says that, ‘the Lord is delighted in them that fear Him and attend upon his mercy.’ When men wait for mercy, God is delighted to exercise it towards them. Judicious Mr. [Joseph] Caryl, ‘To show mercy pleases Him more than it relieves us.’ Thirdly, God is said ‘to multiply’ to show mercy. Single acts of mercy cannot give Him content: He shows mercies by thousands, unto thousands of his people. Fourthly, ye have an expression, Isa. 30:18, ‘And therefore will He be exalted that He may have mercy upon you.’ But what do I speak of that which is infinite and incomprehensible? Sooner can we number the stars of heaven, drops of the ocean, sands on the shore, yea atoms in the sun, than give you a true account of the mercies of this most merciful God. What is a drop to the ocean? (Quantum scintilla ad mare se habet, tantum hominis malitia ad Dei clementiam imo vero non tantum; [As much as a spark is to the sea, so much is man’s wickedness to God’s clemency; indeed, not even so much.] Chrysostom) And what are our sins to the mercies of God. Infiniteness cannot be limited. God’s thoughts of mercy are exalted above the thoughts of our unworthiness far higher than the heavens are exalted above the earth. Mercy is as it were God’s fetching of breath. His infinite and incomprehensible goodness does in a sort wholly live in works of mercy; For all the world are object of God’s mercy since Adam’s fall: ‘For all have sinned, and have come short of the glory of God.’ That famous man, Jerome Zanchi has notable stuff about this matter. I will take notice but of one passage, upon Ex. 34:6-7, where it is said that God is slow to anger. He writes (On the Attributes, bk. 2, ch. 1, quest. 2): ‘And therefore we must note, although anger be attributed unto God, it is in God nothing else but the chief goodness and justice whereby He abhors evil, and according to his just judgment, does at length punish it if it be not amended by his longsuffering and patience. This here hence appears evidently speaking of revenge, which is an effect of anger; He does not say that He does presently inflict punishment, or that He is so ready to inflict it as to show mercy: but He says that He ‘is slow to anger,’ etc.’ And upon the 28th of Isa. 21, where the words are: ‘For the Lord shall rise up as in mount Perahim; He shall be wrath as in the valley of Gibeon, that He may do his work, his strange work, and bring to pass his acts, his strange act.’ ‘The prophet’ (says Zanchi): ‘makes two sorts of God’s works: his proper and strange works. The proper work of God is to show mercy and to spare or forgive; his strange work is to be angry and to punish.’ So far he. I have been somewhat long about this quotation. The weight lies upon this, that mercy in God is his nature, and therefore infinite; it is the very life of God, his drawing of breath in his proper works. Mercy, goodness, longsuffering are according to the nature of the Deity, which is far remote from all unjust severity, cruelty, tyranny and pride. All providences have mercy in them. Tis of the infinite mercy of God that the world is borne up, which would else sink into its first: nothing. It is mercy [that] respites the damnation of wicked men and saves the elect; yea, behold I tell you a mystery, mercies bring calamities: 1 Cor. 11:32, ‘But when we are judged we are chastened of the Lord that we should not be condemned with the world.’ O let me draw breath a little! Consider what unexpected, even incredible mercies God sometimes breathes out. Even when He seems to breathe out smoke and flames, yet He is angry that He may bring his work to pass, that is to say, his proper work; that is, that he may have mercy and preserve. The Devil, he breathes out deaths, miseries and mischiefs, but God loads us with mercies, and (as I said) the attribute of goodness sets God on work to put Himself out in endless mercies and tender bowels beyond what man or angel can possibly imagine.</p></blockquote>

hief goodness and justice whereby He abhors evil, and according to his just judgment, does at length punish it if it be not amended by his longsuffering and patience. This here hence appears evidently speaking of revenge, which is an effect of anger; He does not say that He does presently inflict punishment, or that He is so ready to inflict it as to show mercy: but He says that He ‘is slow to anger,’ etc.’ And upon the 28th of Isa. 21, where the words are: ‘For the Lord shall rise up as in mount Perahim; He shall be wrath as in the valley of Gibeon, that He may do his work, his strange work, and bring to pass his acts, his strange act.’ ‘The prophet’ (says Zanchi): ‘makes two sorts of God’s works: his proper and strange works. The proper work of God is to show mercy and to spare or forgive; his strange work is to be angry and to punish.’ So far he. I have been somewhat long about this quotation. The weight lies upon this, that mercy in God is his nature, and therefore infinite; it is the very life of God, his drawing of breath in his proper works. Mercy, goodness, longsuffering are according to the nature of the Deity, which is far remote from all unjust severity, cruelty, tyranny and pride. All providences have mercy in them. Tis of the infinite mercy of God that the world is borne up, which would else sink into its first: nothing. It is mercy [that] respites the damnation of wicked men and saves the elect; yea, behold I tell you a mystery, mercies bring calamities: 1 Cor. 11:32, ‘But when we are judged we are chastened of the Lord that we should not be condemned with the world.’ O let me draw breath a little! Consider what unexpected, even incredible mercies God sometimes breathes out. Even when He seems to breathe out smoke and flames, yet He is angry that He may bring his work to pass, that is to say, his proper work; that is, that he may have mercy and preserve. The Devil, he breathes out deaths, miseries and mischiefs, but God loads us with mercies, and (as I

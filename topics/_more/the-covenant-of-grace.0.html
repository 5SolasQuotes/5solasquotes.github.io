— Thomas Larkham, The Attributes of God Unfolded &amp; Applied... (London: Eglesfield, 1656) Larkham (1602–1669) was an English puritan clergyman and settler in New England., pp. 131-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+in+this+attribute+of+mercy+is+infinite+and+incomprehensible.+He+is+in+this+as+in+other+attributes%3B+indeed+He+is+God.+Heaps+of+places+I+might+bring+in%3B+the+Bible+abounds+with+passages+of+the+merciful+inclination+of+God%3A+Ex.+34%3A6-7%2C+%E2%80%98The+Lord+God+merciful+and+gracious%2C+etc.%E2%80%99+And+again%2C+%E2%80%98Keeping+mercy+for+thousands.%E2%80%99+Dt.+5%3A10%2C+%E2%80%98And+showing+mercy+unto+thousands.%E2%80%99+Ps.+36%3A5%2C+%E2%80%98Thy+mercy+O+Lord+is+in+the+heavens%2C%E2%80%99+or+unto+the+heavens.+So+that+we+need+not+ask+as+Esau+did+of+Jacob+his+father+about+a+blessing%2C+%E2%80%98Hast+thou+but+one+blessing+my+father%3F%E2%80%99+%28Gen.+27%3A38%29+So+hast+Thou+but+one+mercy%2C+O+God%3F+For+come+there+never+so+many%2C+there+is+mercy+for+all.+The+bottomless+ocean+of+God%E2%80%99s+mercy+can+never+possibly+be+drawn+dry+by+the+creature.+Many+admirable+sayings+have+we+touching+God%E2%80%99s+mercy%3A+First%2C+God+inclines+to+it%3B+it+comes+naturally+from+Him%3A+not+as+waters+out+of+the+pump%2C+but+as+showers+from+heaven.+Tis+but+%E2%80%98open+our+mouths%E2%80%99+and+God+will+fill+them+%5BPs.+95%5D.+Yea+secondly+%28to+use+the+words+of+a+painful+and+learned+writer%3B+%5BJohn%5D+Downame%E2%80%99s+Christian+Warfare%2C+bk.+2%2C+ch.+34%2C+sect.+4%2C+p.+204%29%2C+%E2%80%98It+is+not+only+not+troublesome+and+painful%E2%80%99+%28to+wit+because+it+is+natural+to+God+to+show+mercy%29+%E2%80%98but+also+pleasant+and+delightful+for+God+to+show+mercy%2C+etc.%E2%80%99+And+a+little+after%3A+%E2%80%98And+contrariwise+it+should+be+troublesome+and+irksome%2C+if+I+may+so+speak%E2%80%98+%28says+mine+author%29+%E2%80%98for+God+not+to+show+and+exercise+his+nature+and+mercy%2C+etc.%E2%80%99+And+once+more%3A+%E2%80%98For+as+the+eye+is+delighted+with+seeing%2C+and+to+be+restrained+therefrom+is+grievous+unto+it%2C+as+the+ear+is+delighted+with+hearing+and+is+much+molested+if+it+be+stopped%3B+and+as+every+part+and+faculty+of+the+body+and+soul+are+delighted+in+exercising+their+several+actions+and+functions+and+are+much+vexed+and+cumbered+if+by+any+means+they+should+be+hindered%2C+so+is+the+Lord+delighted+and+well+pleased+in+showing+and+exercising+his+own+nature+and+attributes.%E2%80%99+God+weeps+when+He+strikes%2C+but+smiles+when+He+strokes.+It+does+his+heart+good+%28as+we+use+to+say+of+men%29.+Certainly+God+will+not+be+barred+of+his+pleasure%3B+He+rejoices+much+to+have+an+occasion+offered+of+exercising+his+mercy.+Ps.+147%3A11%2C+David+says+that%2C+%E2%80%98the+Lord+is+delighted+in+them+that+fear+Him+and+attend+upon+his+mercy.%E2%80%99+When+men+wait+for+mercy%2C+God+is+delighted+to+exercise+it+towards+them.+Judicious+Mr.+%5BJoseph%5D+Caryl%2C+%E2%80%98To+show+mercy+pleases+Him+more+than+it+relieves+us.%E2%80%99+Thirdly%2C+God+is+said+%E2%80%98to+multiply%E2%80%99+to+show+mercy.+Single+acts+of+mercy+cannot+give+Him+content%3A+He+shows+mercies+by+thousands%2C+unto+thousands+of+his+people.+Fourthly%2C+ye+have+an+expression%2C+Isa.+30%3A18%2C+%E2%80%98And+therefore+will+He+be+exalted+that+He+may+have+mercy+upon+you.%E2%80%99+But+what+do+I+speak+of+that+which+is+infinite+and+incomprehensible%3F+Sooner+can+we+number+the+stars+of+heaven%2C+drops+of+the+ocean%2C+sands+on+the+shore%2C+yea+atoms+in+the+sun%2C+than+give+you+a+true+account+of+the+mercies+of+this+most+merciful+God.+What+is+a+drop+to+the+ocean%3F+%28Quantum+scintilla+ad+mare+se+habet%2C+tantum+hominis+malitia+ad+Dei+clementiam+imo+vero+non+tantum%3B+%5BAs+much+as+a+spark+is+to+the+sea%2C+so+much+is+man%E2%80%99s+wickedness+to+God%E2%80%99s+clemency%3B+indeed%2C+not+even+so+much.%5D+Chrysostom%29+And+what+are+our+sins+to+the+mercies+of+God.+Infiniteness+cannot+be+limited.+God%E2%80%99s+thoughts+of+mercy+are+exalted+above+the+thoughts+of+our+unworthiness+far+higher+than+the+heavens+are+exalted+above+the+earth.+Mercy+is+as+it+were+God%E2%80%99s+fetching+of+breath.+His+infinite+and+incomprehensible+goodness+does+in+a+sort+wholly+live+in+works+of+mercy%3B+For+all+the+world+are+object+of+God%E2%80%99s+mercy+since+Adam%E2%80%99s+fall%3A+%E2%80%98For+all+have+sinned%2C+and+have+come+short+of+the+glory+of+God.%E2%80%99+That+famous+man%2C+Jerome+Zanchi+has+notable+stuff+about+this+matter.+I+will+take+notice+but+of+one+passage%2C+upon+Ex.+34%3A6-7%2C+where+it+is+said+that+God+is+slow+to+anger.+He+writes+%28On+the+Attributes%2C+bk.+2%2C+ch.+1%2C+quest.+2%29%3A+%E2%80%98And+therefore+we+must+note%2C+although+anger+be+attributed+unto+God%2C+it+is+in+God+nothing+else+but+the+chief+goodness+and+justice+whereby+He+abhors+evil%2C+and+according+to+his+just+judgment%2C+does+at+length+punish+it+if+it+be+not+amended+by+his+longsuffering+and+patience.+This+here+hence+appears+evidently+speaking+of+revenge%2C+which+is+an+effect+of+anger%3B+He+does+not+say+that+He+does+presently+inflict+punishment%2C+or+that+He+is+so+ready+to+inflict+it+as+to+show+mercy%3A+but+He+says+that+He+%E2%80%98is+slow+to+anger%2C%E2%80%99+etc.%E2%80%99+And+upon+the+28th+of+Isa.+21%2C+where+the+words+are%3A+%E2%80%98For+the+Lord+shall+rise+up+as+in+mount+Perahim%3B+He+shall+be+wrath+as+in+the+valley+of+Gibeon%2C+that+He+may+do+his+work%2C+his+strange+work%2C+and+bring+to+pass+his+acts%2C+his+strange+act.%E2%80%99+%E2%80%98The+prophet%E2%80%99+%28says+Zanchi%29%3A+%E2%80%98makes+two+sorts+of+God%E2%80%99s+works%3A+his+proper+and+strange+works.+The+proper+work+of+God+is+to+show+mercy+and+to+spare+or+forgive%3B+his+strange+work+is+to+be+angry+and+to+punish.%E2%80%99+So+far+he.+I+have+been+somewhat+long+about+this+quotation.+The+weight+lies+upon+this%2C+that+mercy+in+God+is+his+nature%2C+and+therefore+infinite%3B+it+is+the+very+life+of+God%2C+his+drawing+of+breath+in+his+proper+works.+Mercy%2C+goodness%2C+longsuffering+are+according+to+the+nature+of+the+Deity%2C+which+is+far+remote+from+all+unjust+severity%2C+cruelty%2C+tyranny+and+pride.+All+providences+have+mercy+in+them.+Tis+of+the+infinite+mercy+of+God+that+the+world+is+borne+up%2C+which+would+else+sink+into+its+first%3A+nothing.+It+is+mercy+%5Bthat%5D+respites+the+damnation+of+wicked+men+and+saves+the+elect%3B+yea%2C+behold+I+tell+you+a+mystery%2C+mercies+bring+calamities%3A+1+Cor.+11%3A32%2C+%E2%80%98But+when+we+are+judged+we+are+chastened+of+the+Lord+that+we+should+not+be+condemned+with+the+world.%E2%80%99+O+let+me+draw+breath+a+little%21+Consider+what+unexpected%2C+even+incredible+mercies+God+sometimes+breathes+out.+Even+when+He+seems+to+breathe+out+smoke+and+flames%2C+yet+He+is+angry+that+He+may+bring+his+work+to+pass%2C+that+is+to+say%2C+his+proper+work%3B+that+is%2C+that+he+may+have+mercy+and+preserve.+The+Devil%2C+he+breathes+out+deaths%2C+miseries+and+mischiefs%2C+but+God+loads+us+with+mercies%2C+and+%28as+I+said%29+the+attribute+of+goodness+sets+God+on+work+to+put+Himself+out+in+endless+mercies+and+tender+bowels+beyond+what+man+or+angel+can+possibly+imagine.%E2%80%9D%0A%0A%E2%80%94+Thomas+Larkham%2C+The+Attributes+of+God+Unfolded+%26+Applied...+%28London%3A+Eglesfield%2C+1656%29+Larkham+%281602%E2%80%931669%29+was+an+English+puritan+clergyman+and+settler+in+New+England.%2C+pp.+131-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F900923f427.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/900923f427.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=God%20in%20this%20attribute%20of%20mercy,man%20or%20angel%20can%20possibly%20imagine." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Fifteenthly and lastly, It is clearly evident that the Lord Christ has a strong inclination to save sinners, by his giving out of Scripture in that way and manner as He has done; the Lord Christ has given out Scripture so as to answer the objections of men and women, to answer all the evils of their hearts, all the pleas of corruption, and of a guilty conscience, and of the Devil himself: The Lord has given out Scripture so as to answer all that might hinder their coming in unto Him… Is not here encouragement enough unto poor sinners: — So here in the next words, ‘Whosoever will let him come and drink of the water of life freely:’ It’s laid down so as to answer all your objections, and to take away all your pleas you have to stave you off from Christ. So then you see clear evidences that Christ is willing to save sinners.</p></blockquote>

</figure><figure class="quote" id="q-a51d71ac82" data-kw="">
<blockquote><p>The second consideration which we would have the Christian to take along with him when he begins to study the mercy and love of God is this: know that it is natural and native for Him to love; justice is his strange act, Isa. 28:21, importing his great unwillingness to be much taken up in the exercise of that attribute of justice. If we would ask the question, What is God? we could have no answer so suitable and pertinent to it as that which He has given Himself, He is merciful and loving. It is his great design, and likewise his desire, to be taken up in his attribute of mercy… And we conceive, that which does eminently declare how much God delights in mercy, and how natural it is for Him to love, is this: that notwithstanding there was a strong and invincible impediment laid in the way of the exercise of the attribute of mercy (which if angels and men had attempted to have loosed, should eternally have crushed and depressed them into the lowest hell), yet love was not hindered in its exercise by this strong impediment. O blessed be that love, for it was strong; and that good will, for it was wonderful: that when there was such an impediment laid in the way, it did put wisdom in exercise to find out the way how it might exercise itself towards man without leaving an imputation on justice! It likewise put omnipotent power to exercise, that it might exercise the decrees of wisdom that were such a holy and divine restraint on the love of God; and before the curse was proclaimed towards man for the breach of his holy law, love did propose the way how that everlasting curse, which man by his own hand had wrapped about his own neck, might be taken away…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works… (d. 1656; Aberdeen: King, 1839)</cite>, pp. 455-56</span></figcaption>

</figure><figure class="quote" id="q-57a78890f2" data-kw="">
<blockquote><p>Now although the nature of God be marvellously one and simple, so it is that according to our manner of conception, we distinguish his virtues and properties from his essence. Concerning his properties, we conceive them under very different respects, and pretend not when we say that he is merciful, to beget an apprehension in the minds of those that hear us, that He is just, or when we say that He is wise, to give occasion to think of his power and might, as his attributes have very different objects, so we comprehend them in our understandings under very different ideas: But then when we speak of his essence, we make a kind of abstraction of it from his properties, and represent it as a single and simple thing, in which all his attributes exist as in a common subject. As to what concerns his attributes, we see them in some sort in this life, in that we understand at least in some degree what is the nature of those operations by which they display themselves upon their objects. For we are not perfectly ignorant what may be that inclination in God of pardoning sins to the penitent, and punishing the obstinate and impenitent and things of like nature. But as to his essence, there is no man that does not acknowledge that we understand it not at all in this life; that is to say, we are not able to form any conception in our minds which has any respect to the nature of his essence, only some think that when we shall be received into the heavens, our supreme happiness will consist in the vision of this essence, which certainly seems extremely difficult to be imagined…</p></blockquote>

</figure><figure class="quote" id="q-1609803b37" data-kw="">
<blockquote><p>Further, The inclination of thy heart towards fruitless and unprofitable creatures does fore-preach to thee the inclination of the heart of God towards thee in the Judgment: If thou hast either cow or any other beast that is now unprofitable to thee, though thou mayst suffer them for some time to be with thee, as God suffers sinners in the world, yet all this while thy heart is not with them, but thou wilt take thy time to clear thy hands of them. Why, just so shall thy judgment be as God says, ‘Though Moses and Samuel stood before Me,’ that is, to pray Me to spare this people, ‘yet my heart could not be towards them; therefore cast them out of my sight and let them go forth.’ Jer. 15:1; Eze. 14:13-14.</p></blockquote>

</figure><figure class="quote" id="q-96d45ff267" data-kw="">
<blockquote><p>Plead hard with God, but plead with Him upon his own arguments; there are amongst many others, these four grounds on which to bottom your plea… 1. On God Himself. And there are two special things from which you may plead here: 1. His gracious nature. Fetch your arguments by which you plead with God for mercy thence, whence He originally fetched his arguments to persuade Himself to show mercy; from his own bowels, from his gracious nature, from his natural goodness and gracious inclination to mercy, Jn. 3:16, ‘God so loved the world that He gave his only Son, etc.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-016b0f6c72" data-kw="">
<blockquote><p>Remember and consider what the Lord says in this case, ‘My thoughts are not your thoughts;’ (Isa. 55:7) He can pardon abundantly. The very holiness of God inclines Him to mercy, as man’s wickedness inclines him to cruelty: The tender mercies of the wicked are cruel. The Devil, who is the greatest of sinners, is disposed to the greatest revenge and cruelty: he would revenge himself on God if he could; and therefore he belies God to man, as well as he does man to God… There is no such thing in the Devil as the least pity towards any sinner. But God’s holiness disposes Him to pity poor sinners, when their souls are in trouble for sin. Thus says the high and lofty One that inhabits eternity, whose Name is Holy: ‘I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite one.’ (Isa. 57:15)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations upon our Savior’s Parable of the Prodigal Son… (London: Roycroft, 1678), ch. 27</cite>, pp. 253-54</span></figcaption>

</figure><figure class="quote" id="q-25871be9fa" data-kw="">
<blockquote><p>The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God… (d. 1680; London: Newman, 1682), Goodness of God</cite>, pp. 584-85</span></figcaption>

e+%26+Attributes+of+God%E2%80%A6+%28d.+1680%3B+London%3A+Newman%2C+1682%29%2C+Goodness+of+God%2C+pp.+584-85&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F25871be9fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/25871be9fa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20goodness%20of%20God%20is%20his,goodness%20%28as%20shall%20afterward%20be%20shown%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. This goodness is communicative. [There is] None so communicatively good as God. As the notion of God includes goodness, so the notion of goodness includes diffusiveness; without goodness He would cease to be a Deity, and without diffusiveness He would cease to be Good. The being good is necessary to the being God: For goodness is nothing else in the notion of it, but a strong inclination to do good; either to find or make an object wherein to exercise itself according to the propension of its own nature; and it is an inclination of communicating itself not for its own interest, but the good of the object it pitches upon. Thus God is good by nature and his nature is not without activity; He acts conveniently to his own nature. Ps. 119:68, ‘Thou art good and dost good.’ And nothing accrues to Him by the communications of Himself to others, since his blessedness was as great before the frame of any creature as ever it was since the erecting of the world; so that the goodness of Christ Himself increases not the luster of his happiness: Ps. 16:2, ‘My goodness extends not to Thee.’ He is not of a niggardly and envious nature; He is too rich to have any cause to envy, and too good to have any will to envy: He is as liberal as he is rich, according to the capacity of the object about which his goodness is exercised. The divine goodness being the supreme goodness, is goodness in the highest degree of activity; Not an idle, enclosed, pent up goodness, as a spring shut up or a fountain sealed, bubbling up within itself, but bubbling out of itself. A fountain of gardens to water every part of his creation; He is an ointment poured forth (Cant. 1:5). Nothing spreads itself more than oil and takes up a larger space, wheresoever it drops. It may be no less said of the goodness of God, as it is of the fulness of Christ, Eph. 1:23, ‘He fills all in all‘: He fills rational creatures with understanding, sensitive nature with vigor and motion, the whole world with beauty and sweetness. Every taste, every touch of a creature is a taste and touch of divine goodness. Divine goodness offers itself in one spark in this creature, in another spark in the other creature, and altogether make up a goodness inconceivable by any creature. The whole mass and extracted spirit of it is infinitely short of the goodness of the divine nature, imperfect shadows of that goodness which is in Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God… (d. 1680; London: Newman, 1682), Goodness of God</cite>, p. 588</span></figcaption>

</figure><figure class="quote" id="q-aab8f90051" data-kw="">
<blockquote><p>Whatever sparks of goodness any creature has are the free effusions of God’s bounty, the offspring of his own inclination to do well, the simple favor of the donor; not purchased, not merited by the creature. God is as unconstrained in his liberty in all his communications as infinite in his goodness, the fountain of them.</p></blockquote>

<blockquote><p>3. The third thing is the goodness of God in his government…. his goodness hovers over the whole frame… to conduct them to those ends which might illustrate his wisdom and goodness to his creatures. His goodness does no less incline Him to provide for them than to frame them. ‘Tis the natural inclination of man to love what is purely the birth of his own strength or skill. He is fond of preserving his own inventions, as well as laborious in inventing them. ‘Tis the glory of a man to preserve them as well as to produce them. God loves everything which He has made, which love could not be without a continued diffusiveness to them, suitable to the end for which He made them.</p></blockquote>

<blockquote><p>First, What is this love of God in Christ? Here I take it actively for the love wherewith He loves us. Love may be considered: First, as an attribute or a perfection in God; so it is said, 1 John 4:8, ‘God is love.’ Which notes his readiness, self-propension or inclination to do good. Secondly, as it relates and passes out to the creature; so there is a common love and a special love. His common love is set forth: Ps. 145:9, ‘The Lord is good to all, and his tender mercies are over all his works.’…</p></blockquote>

<blockquote><p>III Proposition: In asking any spiritual gift we are encouraged by the bounty and mercy of God [as in Ps. 119:64]. David signifies both: 1. His bounty or benignity, or that free inclination which is in God to do good to his creatures. 2. His mercy respects the creature as affected with any misery. Mercy properly is a proneness to succour and relieve a man in misery notwithstanding sin. Now the larger thoughts of mercy, the more hope, partly because we have no plea of merit and therefore mercy is the fountain of all the good which comes to us from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm… (London: T.P., 1681) | sermon 72, on Ps. 119:64</cite>, pp. 436-37</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-4e53e27cae" data-kw="">
<blockquote><p>In God it [‘mercy’] notes his readiness to do good to the miserable, notwithstanding sin. The motion comes from within, from his own breast and bowels. For our God is pitiful and of tender mercy, James 5:11, and the act of it is extended and reached out unto the creature in seasonable relief. For the throne of grace was erected for this purpose, Heb. 4:11. Two things there are in mercy: First, a propension and inclination to commiserate the afflicted. Secondly, a ready relief and succour of them according to our power, affectus and effectus. First, there is a compassion or a being affected with the misery of others. This properly cannot be in God, in whom as there is no passion, so strictly speaking there is no compassion; yet something analagous there is, a taking notice of our misery. Something like a pity arising in his heart upon the sight of it; which the Scripture frequently ascribes to God, and we can best understand as we consider the divine perfections shining forth in the human nature of Christ. Ex. 2:24, ‘He heard their groaning;’ and Isa. 63:4, ‘In all their afflictions He was afflicted.’ Judges 10:16, ‘His soul was grieved for the misery of Israel.’ Forms of speech taken from the manner of men, who use to be thus affected when they see a miserable object. God in his simple and perfect nature cannot be said either to joy or grieve: but He carries Himself as one thus affected. Or these expressions were laid in aforehand to suit with the divine perfections as manifested in Christ, who is touched with a feeling of our infirmities. Secondly, mercy notes the actual exhibition of help and relief to the miserable…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm… (London: T.P., 1681) | sermon 84, on Ps. 119:76, “Let, I pray thee, thy merciful kindness be for my comfort”</cite>, p. 512</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>(2) There is more goodwill in his heart than is visible in his dealings. The merciful nature of God should be a support to us, though we see nothing of the effects of it in his providence. Job 10:13, ‘These things hast Thou hid in thine heart; I know that it is with Thee.’ He speaks of his favourable inclination to show pity to distressed creatures. We are not able always to reconcile his present dispensations with his gracious nature, yet faith must not quit its holdfast: We must see what is hid in God’s heart and comfort ourselves with that favor and mercy which we know to be essential to Him: Though the mercy and pity be not visible and obvious to sense, the disposition and inclination abides in God unchangeable and sure. God is a merciful God still, and Christ a compassionate Savior, though the effects be suspended to try and sharpen our faith.</p></blockquote>

</figure><figure class="quote" id="q-7271d37246" data-kw="">
<blockquote><p>5. That we must not dote upon sensible consolation. The merciful nature of God should be a support to us though we see nothing of the effects of it in the course of his dealings with us; and we should believe his love when we do not actually feel it. Job 10:13, ‘And these things hast Thou hid in thine heart; I know that this is with Thee.’ He speaks of his favorable inclination to show pity to his creatures. We are not able always to reconcile his present dispensations with his gracious nature, nor our former experience of his goodnessת yet faith must not quit its holdfast but we must see what is hid in God’s heart and comfort ourselves with concealed favor and mercy, when we cannot comfort ourselves with felt favor and mercy. Though mercies be not visible and obvious to sense, yet the disposition and inclination is ever in God unchangeable and sure. A withdrawn God is a merciful God still.</p></blockquote>

<blockquote><p>1. As love stands opposed to hatred and wrath, and enmity. Considering man as God’s creature, he was not hated of God; God hates not the work of his own hand; but considering him as a lapsed creature, as degenerated into the plant of a strange vine, after that God had created him a generous, noble plant… How suitable to us now is it to have a Savior? That is love, and who has loves, considering the aversion in the holy Divine Being from mankind as rebellious seed, a seed of evil-doers? Who could have suited us to have become a Savior unto us, but one who had a kind propension and inclination to us, inclining Him to the great work of man’s redemption and reconciliation to God, especially also considering that there could be no remission of sins without blood…</p></blockquote>

<blockquote><p>XXVIII. From these things, however, it is now sufficiently clear that that vindicatory justice is not a free and arbitrary act that depends solely upon the will of God, but an essential property to the exercise of which the will, once sin is posited, is necessarily impelled. And indeed, if it befits the nature of God that He does not suffer him who repents of sin to perish, because He is good and clement, it will no less befit Him that He does not allow sin to go unpunished, because He is just; for as the former arises from a certain natural ῥοπῇ [inclination] and propensity of goodness and mercy toward repentance, so the latter also flows from a certain natural hatred and detestation of sin. Indeed, if we consider the matter accurately, the latter seems to be somewhat more fitting. For when He pardons sin, He does so out of a certain abundance of goodness, but He is bound by no right, by no law, to perform this; therefore, in that, He follows only the lead of his nature, while the creature has no merit. But in administering justice, besides that ῥοπῇ [inclination] of nature by which He inclines toward the hatred of sin, He also has regard for the order of which He is the guardian and avenger, and whose law, once enacted, He can by no means abrogate. Regarding the former, He sees no quality in the subject by which He could be moved to benefit it, or if He sees any, He sees one contrary to his holiness, and of such a kind that He could justly refrain from every benefit; but with respect to the latter, the subject, He sees it clothed in that quality which incites justice to exercise and propels it by a certain inevitable necessity, whence the act of mercy is plainly arbitrary if you abstract it from the decree, because it has no foundation in the subject concerning which it is exercised, whereas the act of justice is necessary, because it depends not only on the will, but on the very nature of God who punishes and the thing to be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Satisfaction of Christ… (Geneva, 1666), Disputation 1, sect. 28 tr. AI at The Received Faith</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>No man was ever questioned by God for having too much grace; we may all complain of too little: More grace is the constant desire of every holy soul as there is a propensity in God to give it; ‘To him that has, more shall be given’: God loves to accumulate his favors, to load us with his benefits; he gives liberally that He may draw out our hope to follow Him for more and more still. ‘Let us then abound in hope, holding fast our confidence firm unto the end.&#x27;</p></blockquote>

<blockquote><p>XL. Third, zeal for exploring, if we observe some propensity of God toward us, some love, grace, or mercy, whether is it only that universal propensity which is inclined to beasts as well as men (Ps. 36:6), or that common propensity which is inclined to the reprobate as well as the elect.</p></blockquote>

</figure><figure class="quote" id="q-ca36a5eaa5" data-kw="">
<blockquote><p>The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17). In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>

<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: … 2. The nexus which intervenes between knowledge and will also demands that what one knows with the consciousness of knowledge, he also acknowledge according to the dignity and goodness of the thing which he observes in it; to which, attending, an intellectual being also tends and is borne toward it as toward a good thing—which belongs to the will. But this has place much more and more eminently in God, whose intellect, the more perfect it is, so much the more distinctly represents to His most absolute thought the truth and goodness of things in their objects: which things, when He approves, He wills well.</p></blockquote>

</figure><figure class="quote" id="q-ed3d48e38e" data-kw="">
<blockquote><p>3rdly, Some natural good wishes for his welfare are implied in this love [to the rich young ruler]. There is in every wise and good man a hearty desire of the happiness of his fellow-creatures; he loves them all in this sense, even the foolish and the wicked. Human nature that has any goodness in it, is ready to wish well to any person, though he be an utter stranger and unknown, especially if he has some agreeable qualities. There may be an innocent inclination to see all men happy, though we know this shall not be brought to pass; for the Word of God declares that the most part of men walk in the broad way, and shall go down to hell. You know how passionately St. Paul longed for the salvation of all his countrymen the Jews [Rom. 9]. This is called a love of benevolence; and it is evident, by the following particulars, that the Lord expressed this good-will toward the young man in my text.</p></blockquote>

</figure><figure class="quote" id="q-879366644a" data-kw="">
<blockquote><p>If God’s love is known by what it hates, it is also known by what it loves or inclines toward. First, in a sense, it extends to all creatures. All creatures have some good from God.136 Even the wicked share in this benevolence. “God is kind to the unthankful and evil.”137 Man is now naturally contrary to God and positively evil, but the Luke 6:35 sermon shows that God still loves him in some ways. Indeed, Edwards goes on to say in another sermon: “even in damnation.”138 Yet, fundamentally, “holy persons love holy things for their holiness.”139 136. Unpublished MS sermon on Ps. 145:15–21, “All creatures in heaven and earth have their good things from God,” p. 1, St. Ind., Nov. 1, 1753. 137. Unpublished MS sermon on Lk. 6:35. 138. Unpublished MS sermon on Eph. 4:15–16, “In a company of Christians among whom Christianity has its genuine effect, love is the beginning and love is the middle and love is the end of all their affairs,” p. 2, May 1743. 139. Unpublished MS sermons on Ps. 119:[1]40.</p></blockquote>

0119%3A%5B1%5D40." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>amor Dei: the love of god; i.e., both the love of creatures for God and the divine attribute of love… Considered as a divine attribute, the amor Dei can be defined as the propensity of the divine essence or nature for the good, both in the sense of God’s inward intrinsic, benevolentia, or willing of the good, and in the sense of God’s external, extrinsic, beneficentia, or kindness, toward his creatures… the amor Dei communis is directed toward all human beings, both elect and reprobate, and is manifest in the blessings, or benefits (beneficia), of God… the amor Dei communis is understood to be benevolentia in the strict sense of goodwill toward human beings…</p></blockquote>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>

<blockquote><p>Mastricht offers as a brief definition the statement that the divine will is God’s ‘propensity toward the good,’ (Theoretico-practica theol., II.xvii.4) and the somewhat longer definition that ‘will in God is nothing other than his most wise propensity toward himself as the highest goal and toward creatures as means, for the sake of himself,’ inasmuch as creatures attain the fulfilment of the good not in themselves but in God.’ (Theoretico-practica theol., II.xv.7; cf. Cocceius, Summa theol. III.x.23-24 and Van Asselt, Federal Theology, p. 166.)</p></blockquote>

<blockquote><p>[Benedict Pictet:] Now we call goodness that affection in God, by which he is inclined to communicate himself to his creatures… The first act of God’s goodness in time is creation, and because what is produced always depends on what produces it, the second act of goodness is preservation.” (Theol. chr., II.vii.2-3; cf. Ridgely, Body of Divinity (1885), p. 109.) In this most inclusive sense, the divine goodness can be identified as benevolentia, the ‘inclination of the will to do good as far as it is possible and lawful to do so‘ or, indeed, as ‘the love of God towards his creatures’ by which he acts to ‘promote their happiness and perfection.’ (Venema, Inst. theol., VII (p. 163).) Accordingly, Scripture teaches that ‘God is love’ (1 John 4:8), that he is ‘good and upright’ (Ps. 25:8), that he takes ‘no pleasure’ in the death of his creatures (Ezek. 18:32), would have none perish (2 Pet. 3:9), and ‘will have all men to be saved‘ (1 Tim. 2:4). (Cf. Venema, Inst. theol., VII (p. 163), with Turretin, Inst. theol. elencticae, III.xx.2, 5.)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Benedict Pictet:] Now we call goodness that affection in God, by which he is inclined to communicate himself to his creatures… The first act of God’s goodness in time is creation, and because what is produced always depends on what produces it, the second act of goodness is preservation.” (Theol. chr., II.vii.2-3; cf. Ridgely, Body of Divinity (1885), p. 109.) In this most inclusive sense, the divine goodness can be identified as benevolentia, the ‘inclination of the will to do good as far as it is possible and lawful to do so‘ or, indeed, as ‘the love of God towards his creatures’ by which he acts to ‘promote their happiness and perfection.’ (Venema, Inst. theol., VII (p. 163).) Accordingly, Scripture teaches that ‘God is love’ (1 John 4:8), that he is ‘good and upright’ (Ps. 25:8), that he takes ‘no pleasure’ in the death of his creatures (Ezek. 18:32), would have none perish (2 Pet. 3:9), and ‘will have all men to be saved‘ (1 Tim. 2:4). (Cf. Venema, Inst. theol., VII (p. 163), with Turretin, Inst. theol. elencticae, III.xx.2, 5.)”

— Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, p. 509">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BBenedict+Pictet%3A%5D+Now+we+call+goodness+that+affection+in+God%2C+by+which+he+is+inclined+to+communicate+himself+to+his+creatures%E2%80%A6+The+first+act+of+God%E2%80%99s+goodness+in+time+is+creation%2C+and+because+what+is+produced+always+depends+on+what+produces+it%2C+the+second+act+of+goodness+is+preservation.%E2%80%9D+%28Theol.+chr.%2C+II.vii.2-3%3B+cf.+Ridgely%2C+Body+of+Divinity+%281885%29%2C+p.+109.%29+In+this+most+inclusive+sense%2C+the+divine+goodness+can+be+identified+as+benevolentia%2C+the+%E2%80%98inclination+of+the+will+to+do+good+as+far+as+it+is+possible+and+lawful+to+do+so%E2%80%98+or%2C+indeed%2C+as+%E2%80%98the+love+of+God+towards+his+creatures%E2%80%99+by+which+he+acts+to+%E2%80%98promote+their+happiness+and+perfection.%E2%80%99+%28Venema%2C+Inst.+theol.%2C+VII+%28p.+163%29.%29+Accordingly%2C+Scripture+teaches+that+%E2%80%98God+is+love%E2%80%99+%281+John+4%3A8%29%2C+that+he+is+%E2%80%98good+and+upright%E2%80%99+%28Ps.+25%3A8%29%2C+that+he+takes+%E2%80%98no+pleasure%E2%80%99+in+the+death+of+his+creatures+%28Ezek.+18%3A32%29%2C+would+have+none+perish+%282+Pet.+3%3A9%29%2C+and+%E2%80%98will+have+all+men+to+be+saved%E2%80%98+%281+Tim.+2%3A4%29.+%28Cf.+Venema%2C+Inst.+theol.%2C+VII+%28p.+163%29%2C+with+Turretin%2C+Inst.+theol.+elencticae%2C+III.xx.2%2C+5.%29%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+%28Baker+Academic%2C+2003%29%2C+vol.+3%2C+p.+509&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd78be705ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d78be705ee.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=%5BBenedict%20Pictet%3A%5D%20Now%20we%20call%20goodness,Turretin%2C%20Inst.%20theol.%20elencticae%2C%20III.xx.2%2C%205.%29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-32484f2f45" data-kw="">
<blockquote><p>The Reformed orthodox describe God’s love as an act of the divine will or a movement toward the good–both toward the good in itself and toward the good as it is embodied in the creature. Indeed, the predications of will, love, and goodness conjoin in the basic definition, granting that the divine will is God’s propensity for the good that is ultimately the divine essence itself as the source of all good–and amor [love], strictly defined, is a propensity for the good (Mastricht, Theoretico-practica theol., II.xvii.3, 4, 6; cf. Brakel, Redelijke Godsdienst, I.iii.33. Note the similar definitions in Arminius, Disputationes privatae, XX.iii-iv.), or a desire or ‘appetite for union.’ (Heidanus, Corpus theol., II (p. 172).)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, pp. 564-65</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-14e906f598" data-kw="">
<blockquote><p>There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, p. 566</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-30c6bb1512" data-kw="">
<blockquote><p>Thus, gratia Dei [the grace of God] is that perfection or attribute according to which God, out of a totally gracious and unmerited love, is conceived as willing to communicate himself to his creatures. (Rijssen, Summa Theol., III.xliii) Considered as affective, as ratione actus interni in Deo [a rule of the internal act in God], grace is a propensity of the divine will–while considered as effective it is the gifts of the Spirit graciously given to us by God, either the ordinary gifts of faith, hope, and love or the extraordinary gifts bestowed upon the church for its edification. (Rijssen, Summa theol., III.xliii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, p. 571</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-89c11aa158" data-kw="">
<blockquote><p>This pattern of definition results in the understanding of mercy as an affection, although there remains among the Reformed orthodox the assumption that the inclination to aid the creature is so intrinsic to the divine nature that mercy also can be understood as an essential attribute of God: the disposition belongs to God essentially, although its transient revelation belongs to the category of affection. (Cf. Brakel, Redelijke Godsdienst, I.iii.35.)</p></blockquote>

<blockquote><p>The words of the apostle, ‘God will have all men to be saved, etc.’ [1 Tim. 2:4] can be understood in three ways: Third, according to [John] Damascene (Of the Orthodox Faith, 2.29), they are understood of the antecedent will of God; not of the consequent will. This distinction must not be taken as applying to the divine will itself, in which there is nothing antecedent nor consequent, but to the things willed. To understand this we must consider that everything, in so far as it is good, is willed by God. A thing taken in its primary sense, and absolutely considered, may be good or evil, and yet when some additional circumstances are taken into account, by a consequent consideration may be changed into the contrary. Thus that a man should live is good; and that a man should be killed is evil, absolutely considered. But if in a particular case we add that a man is a murderer or dangerous to society, to kill him is a good; that he live is an evil. Hence it may be said of a just judge, that antecedently he wills all men to live; but consequently wills the murderer to be hanged. In the same way God antecedently wills all men to be saved, but consequently wills some to be damned, as His justice exacts. Nor do we will simply, what we will antecedently, but rather we will it in a qualified manner; for the will is directed to things as they are in themselves, and in themselves they exist under particular qualifications. Hence we will a thing simply inasmuch as we will it when all particular circumstances are considered; and this is what is meant by willing consequently. Thus it may be said that a just judge wills simply the hanging of a murderer, but in a qualified manner he would will him to live, to wit, inasmuch as he is a man. Such a qualified will may be called a willingness rather than an absolute will. Thus it is clear that whatever God simply wills takes place; although what He wills antecedently may not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 19, article 6, Whether the will of God is always fulfilled?, reply to objection 1</cite></span></figcaption>

</figure><figure class="quote" id="q-9e96acf3b2" data-kw="">
<blockquote><p>‘And it shall come to pass, that as the Lord rejoiced over you.’ The wonderful and inestimable love of God towards his people is here set forth, via, that He had rejoiced in heaping blessings upon them; wherefore their depravity was all the more base and intolerable, in that God, though voluntarily disposed to be bountiful, was obliged by it to lay aside His affection for them. But although it is only by a metaphor that God is said to rejoice in destroying the wicked, yet it is not without good reason that this expression is applied to Him; that we may know that He can no more fail to be the defender of His Law, and the Avenger of its contempt, than deny Himself. He complains, indeed, by Isaiah, (Isa. 10:24) that He is unwillingly forced to punish the Jews; but these two things are quite consistent, that He rejoices in His just judgment and at the same time is mindful of His clemency and indulgence, so that He would rather pardon, if the wickedness of men would allow Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy 28, verse 63</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-bc6445d2aa" data-kw="">
<blockquote><p>Here we see what care about our salvation is manifested by our Heavenly Father, who wishes us to take hold of his power and goodness, that we may know how great it is, and may partake of it more and more abundantly; for He would wish to deal with us on the same familiar terms as with his children, if we did not prevent Him by our wickedness. Since, therefore, we are incapable of enjoying his fatherly tenderness, He must display his strength and majesty, that, being awed by it, and affected by the anticipation of the judgment, we may humbly entreat Him, and sincerely implore peace and pardon. Now, this is done when we are truly converted to Him; for, so long as we please ourselves, and flatter our vices, we cannot but displease Him; and, on the other hand, if we enter into peace with Him, we must make war against Satan and sin. How earnestly God desires to be reconciled to us appears still more clearly from the repetition of the words. He might have said, in a single word, that He is merciful and ready to bestow pardon; and therefore, when He twice repeats the words, ‘that he may make peace with Me,’ He declares that willingly and most earnestly He hastens to blot out all our offenses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 27:5</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-2c31393b0e" data-kw="">
<blockquote><p>‘For He abounds in pardoning.’ Now, because it is difficult to remove terror from trembling minds, Isaiah draws all argument from the nature of God, that He will be ready to pardon and to be reconciled. Thus the Holy Spirit dwells on this part of doctrine, because we always doubt whether or not God is willing to pardon us; for, although we entertain some thoughts of his mercy, yet we do not venture fully to believe that, it belongs to us. It is not without reason, therefore, that this clause is added, that we may not be hindered by uncertainty or doubt as to his infinite compassion toward us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 55:7</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-35beddc22d" data-kw="">
<blockquote><p>And such a hope ought especially to encourage us to repent, for we see that God is ready to receive us and seeks reconciliation with us, and is always prepared to forgive all our sins, provided we from the heart return to Him; and He seems as one unwilling to inflict punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 25:6</span></figcaption>

— John Calvin, Commentary on Jeremiah, 25:6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+such+a+hope+ought+especially+to+encourage+us+to+repent%2C+for+we+see+that+God+is+ready+to+receive+us+and+seeks+reconciliation+with+us%2C+and+is+always+prepared+to+forgive+all+our+sins%2C+provided+we+from+the+heart+return+to+Him%3B+and+He+seems+as+one+unwilling+to+inflict+punishment.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Jeremiah%2C+25%3A6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F35beddc22d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/35beddc22d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=And%20such%20a%20hope%20ought%20especially,as%20one%20unwilling%20to%20inflict%20punishment." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f86a15fe0c" data-kw="">
<blockquote><p>But as it cannot be but that God will smite us with his rods, not only because we deserve to be smitten, but also because it is expedient, it is necessary to flee to this consolation which is offered to us, even that God having afflicted us with grief will again shew us compassion, even ‘according to the multitude of his mercies.’ He confirms the truth of what he alleges by a reference to the very nature of God Himself. Hence, that the faithful might not debate with themselves whether God would be propitious to them, after having inflicted on them a temporary punishment, the prophet comes to their aid, and sets before them the mercy of God, or rather mercies, in the plural number; as though he had said, that it could not be that God should deny Himself, and that therefore He would be always merciful to his people; for otherwise his mercy would be obliterated, yea, that mercy which is inseparable from his eternal essence and divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations 3 | verse 32, “But though he cause grief, yet will he have compassion according to the multitude of his mercies.”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“But as it cannot be but that God will smite us with his rods, not only because we deserve to be smitten, but also because it is expedient, it is necessary to flee to this consolation which is offered to us, even that God having afflicted us with grief will again shew us compassion, even ‘according to the multitude of his mercies.’ He confirms the truth of what he alleges by a reference to the very nature of God Himself. Hence, that the faithful might not debate with themselves whether God would be propitious to them, after having inflicted on them a temporary punishment, the prophet comes to their aid, and sets before them the mercy of God, or rather mercies, in the plural number; as though he had said, that it could not be that God should deny Himself, and that therefore He would be always merciful to his people; for otherwise his mercy would be obliterated, yea, that mercy which is inseparable from his eternal essence and divinity.”

</figure><figure class="quote" id="q-7302550d0c" data-kw="">
<blockquote><p>Ye,” says Christ, “who are evil, know how to do good to your children” (Mt. 7:11); what then are we to expect from the very fountain of goodness? As, then, parents are not willingly angry with their children, nor handle them roughly, there is no doubt but that God never punishes men except when He is constrained. There is, as I have said, an impropriety in the expression, but it is enough to know, that God derives no pleasure from the miseries of men, as profane men say, who utter such blasphemies as these, that we are like balls with which God plays, and that we are exposed to many evils, because God wishes to have as it were, a pleasant and delectable spectacle in looking on the innumerable afflictions, and at length on the death of men. That such thoughts, then, might not tempt us to unbelief, the prophet here puts a check on us, and declares that God does not afflict from his heart, that is, willingly, as though He delighted in the evils of men, as a judge, who, when he ascends his throne and condemns the guilty to death, does not do this from his heart, because he wishes all to be innocent, and thus to have a reason for acquitting them; but yet he willingly condemns the guilty, because this is his duty. So also God, when He adopts severity towards men, He indeed does so willingly, because He is the judge of the world; but He does not do so from the heart, because He wishes all to be innocent—for far away from Him is all fierceness and cruelty; and as He regards men with paternal love, so also He would have them to be saved, were they not as it were by force to drive Him to rigor. And this feeling he also expresses in Isaiah, “Ah! I will take consolation from mine adversaries.” (Isa. 1:24) He calls them adversaries who so often provoked Him by their obstinacy; yet He was led unwillingly to punish their sins, and hence He employed a particle expressive of grief, and exclaimed ‘Ah!’ as a father who wishes his son to be innocent, and yet is compelled to be severe with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations 3 | verse 33, “For he doth not afflict willingly nor grieve the children of men.”</cite></span></figcaption>

<blockquote><p>Verse 33. ‘For he does not afflict willingly.’ Here he tells that if God afflicts, He does it not willingly, but strokes are drawn out of His hand by our provocations and the necessity of our estate. Objection. But how can anything be done to us and God not willing to do it? Answer. He is willing and not willing. [Willing,] because justice requires it, and He must correct us or lose us. Unwilling, because strokes are extorted out of His hand. We see then that simply and absolutely or properly God delights not in our affliction, but when He afflicts, it is extorted from His justice. 2. This shows the procuring cause of our grief is not in the Lord but in ourselves. God is the causer of our grief but not the procurer of it. God is the worker and {bringer about} of grief but not the causer of it. … Use Two. If God afflicted not willingly, then be sure He will comfort willingly. As He is unwilling to strike, so He is ready to comfort. As a father would rejoice to see his son thrive, so would God to see us study to please Him. He can let the rod lie aside us all day, clap [pat] our heads and lay His benefits to our hand. Know then, as it is against God’s will that you come into grief, so it is with His will that you be comforted, or if He let you lie still in that grief, it is because He sees it is necessary for you to steep yourself in trouble [so] that your perverse nature [may] be humbled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Jeremiah’s Lamentations (1628; Naphtali Press &amp; RHB, 2020), on Lam. 3:33</cite>, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-bf0de92f98" data-kw="">
<blockquote><p>…and if it be asked, what may be imported by this speech properly? We answer, ‘O that my people had hearkened unto Me, etc.’ [Ps. 81:13] shows these six things: … 4. Fourthly, that God delights not in the death or destruction of his people, but that they should repent and live. … 6. Sixthly, that God requires a suitable meeting of his people to his dispensations, that is, that they may be so willing to hearken to his voice, and so loath to offend Him, as He does manifest by Word and works his willingness to save them and his loathness to destroy them. From the Lord’s lamenting, learn further: … 3. He who hears God uttering his wishes for the conversion of His people and lamenting that His Word is not believed, and that his offer of grace is not received, does give God an evil meeting and neither believes God’s goodness, nor cares for his own salvation, except he join with God lamenting his own misbelief in time past, and do with heartily the same with God for his own conversion for time to come;</p></blockquote>

</figure><figure class="quote" id="q-90ef894f52" data-kw="">
<blockquote><p>Why then does He punish with perdition? No otherwise than as some just judge, that would have all men live regularly, and free from disorders; but having transgressed the laws, justice compels him, and that by a good and rectified will, to punish them. Some would have this will of God to be velleitatem [willingness] rather than voluntatem [will]; not so much an absolute will and resolution, as a willingness and desire: not unlike a merchant’s casting his freight overboard in a dangerous tempest. He would willingly save them, and yet he is willingly content to lose them, says one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Second Epistle General of St. Peter (1633; Soli Deo Gloria, 1990), on 2 Pet. 3:9, “Not willing that any should perish,”</cite>, pp. 693-95</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-2ccc0475a4" data-kw="">
<blockquote><p>…when He has decreed it, He does not presently execute it, but He does denounce it: why? because He is most merciful, slow to wrath, and therefore He does denounce: Isa. 34:7, He is a God that will not punish, but upon necessity; He would willingly be always showing good, and when He is angry, He is compelled and provoked to it; and because He would not willingly punish, therefore He denounces punishment; He speaks often, before He will do it once, that if it might be, He might be prevented by repentance. Lastly, after threatening, He proceeds to execution, not with delight (God delights not in the death of a sinner, He afflicts not willingly), but compassion. As Titus the Emperor, before he sacked the city of Jerusalem, wept over it, pitying them he should destroy it; so does God, when threatnings prevail not, and by them, men are not reclaimed, then He comes to execution… as Savian says of Sodom, that God showed mercy, in that He was long before He did execute; and justice, and wrath, in that He did execute at last.</p></blockquote>

<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-2d1bafe9b6" data-kw="">
<blockquote><p>Thirdly, God has expressed Himself in Scripture, as much, yea more, for his willingness, than for his power to help; therefore we need not make our uncertainty of his will the reason of our unbelief, when we say, we are assured of his power: God has said, He is Almighty, etc., but there are not only words importing that God is willing to help his people, but promises and oaths that He will (Ps. 50:15) ‘Call upon me, and I will deliver thee’; Eze. 33:11, ‘As I live, saith the Lord God, I have no pleasure in the death of the wicked (that place is meant primarily of a civil death, a death in trouble) but that the wicked turn from his way and live.’ Yea, God has manifested a willingness to help a people, which his power has not seconded; but He never manifested his power, when his will did not concur: that most passionate exclamation, ‘O Jerusalem, Jerusalem, How often would I have gathered thee! etc.’ [Mt. 23:37] implies a general willingness in Christ to gather Jerusalem, yet Christ did not act his divine power effectually for their gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Unbelief (London, 1645)</cite>, p. 40</span></figcaption>

<blockquote><p>The Fourth Doctrine Propounded in Chapter 45: that God and Christ are exceedingly willing and desirous to be reconciled with sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Reconciliation, or Christ’s Trumpet of Peace to the World (d. 1646; 1657; Soli Deo Gloria, 1997) | Table of Contents</cite></span></figcaption>

</figure><figure class="quote" id="q-efc6740ffe" data-kw="">
<blockquote><p>This argues God’s willingness to be reconciled, that the Lord is thus pleading with you. And let me speak to everyone in this place who has felt God pleading thus with them. Know that the Lord, by this work of His, strives with you to bring you to be reconciled to Him. This is nothing other than the striving of the Spirit of God Himself with you, though perhaps you think this is troublesome to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Reconciliation, or Christ’s Trumpet of Peace to the World (d. 1646; 1657; Soli Deo Gloria, 1997)</cite>, ch. 74, The Fourteenth Argument, pp. 316-17</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“This argues God’s willingness to be reconciled, that the Lord is thus pleading with you. And let me speak to everyone in this place who has felt God pleading thus with them. Know that the Lord, by this work of His, strives with you to bring you to be reconciled to Him. This is nothing other than the striving of the Spirit of God Himself with you, though perhaps you think this is troublesome to you.”

— Jeremiah Burroughs, Gospel Reconciliation, or Christ’s Trumpet of Peace to the World (d. 1646; 1657; Soli Deo Gloria, 1997), ch. 74, The Fourteenth Argument, pp. 316-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+argues+God%E2%80%99s+willingness+to+be+reconciled%2C+that+the+Lord+is+thus+pleading+with+you.+And+let+me+speak+to+everyone+in+this+place+who+has+felt+God+pleading+thus+with+them.+Know+that+the+Lord%2C+by+this+work+of+His%2C+strives+with+you+to+bring+you+to+be+reconciled+to+Him.+This+is+nothing+other+than+the+striving+of+the+Spirit+of+God+Himself+with+you%2C+though+perhaps+you+think+this+is+troublesome+to+you.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel+Reconciliation%2C+or+Christ%E2%80%99s+Trumpet+of+Peace+to+the+World+%28d.+1646%3B+1657%3B+Soli+Deo+Gloria%2C+1997%29%2C+ch.+74%2C+The+Fourteenth+Argument%2C+pp.+316-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefc6740ffe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efc6740ffe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=This%20argues%20God%E2%80%99s%20willingness%20to%20be,think%20this%20is%20troublesome%20to%20you." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-38ad15fc71" data-kw="">
<blockquote><p>Come we to your [John Cotton‘s] proper opinion: You ‘do not acknowledge any unwillingness in God to reward the men of this world with life, upon any condition whatsoever.‘ I know no reason why you should conceive any of our divines to differ from you in this, although you had spoken out your meaning never so plainly and fully: not only denying unwillingness, but acknowledging a willingness, as afterwards you do; not a willingness only, which may have place though joined with a will to the contrary, as in all mixed actions, which yet are not incident to God, though they are to a creature, as who sometimes does some thing volens nolens [willingly not willingly]: for certainly God will save any man upon condition he believes and repents: and on the other side, neither is there any unwillingness in God, but a willingness rather, yea and that a resolute will to damn any man in case he dies in infidelity and impenitency. For we have the clear word of God to justify us herein, professing most evidently that ‘Whosoever believeth shall be saved; whosoever believeth not shall be damned.’ So that I wonder not a little whereto these expressions [of Cotton’s] tend, save that commonly such is the issue of imperfect conceptions, all preparations to the justifying of them fall miserably short of that whereunto they aim.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. [John] Cotton’s clearing certain doubts concerning Predestination, together with an Examination Thereof (London: J.D., 1646), Question 2</cite>, pp. 54-55</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“Come we to your [John Cotton‘s] proper opinion: You ‘do not acknowledge any unwillingness in God to reward the men of this world with life, upon any condition whatsoever.‘ I know no reason why you should conceive any of our divines to differ from you in this, although you had spoken out your meaning never so plainly and fully: not only denying unwillingness, but acknowledging a willingness, as afterwards you do; not a willingness only, which may have place though joined with a will to the contrary, as in all mixed actions, which yet are not incident to God, though they are to a creature, as who sometimes does some thing volens nolens [willingly not willingly]: for certainly God will save any man upon condition he believes and repents: and on the other side, neither is there any unwillingness in God, but a willingness rather, yea and that a resolute will to damn any man in case he dies in infidelity and impenitency. For we have the clear word of God to justify us herein, professing most evidently that ‘Whosoever believeth shall be saved; whosoever believeth not shall be damned.’ So that I wonder not a little whereto these expressions [of Cotton’s] tend, save that commonly such is the issue of imperfect conceptions, all preparations to the justifying of them fall miserably short of that whereunto they aim.”

— William Twisse, A Treatise of Mr. [John] Cotton’s clearing certain doubts concerning Predestination, together with an Examination Thereof (London: J.D., 1646), Question 2, pp. 54-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCome+we+to+your+%5BJohn+Cotton%E2%80%98s%5D+proper+opinion%3A+You+%E2%80%98do+not+acknowledge+any+unwillingness+in+God+to+reward+the+men+of+this+world+with+life%2C+upon+any+condition+whatsoever.%E2%80%98+I+know+no+reason+why+you+should+conceive+any+of+our+divines+to+differ+from+you+in+this%2C+although+you+had+spoken+out+your+meaning+never+so+plainly+and+fully%3A+not+only+denying+unwillingness%2C+but+acknowledging+a+willingness%2C+as+afterwards+you+do%3B+not+a+willingness+only%2C+which+may+have+place+though+joined+with+a+will+to+the+contrary%2C+as+in+all+mixed+actions%2C+which+yet+are+not+incident+to+God%2C+though+they+are+to+a+creature%2C+as+who+sometimes+does+some+thing+volens+nolens+%5Bwillingly+not+willingly%5D%3A+for+certainly+God+will+save+any+man+upon+condition+he+believes+and+repents%3A+and+on+the+other+side%2C+neither+is+there+any+unwillingness+in+God%2C+but+a+willingness+rather%2C+yea+and+that+a+resolute+will+to+damn+any+man+in+case+he+dies+in+infidelity+and+impenitency.+For+we+have+the+clear+word+of+God+to+justify+us+herein%2C+professing+most+evidently+that+%E2%80%98Whosoever+believeth+shall+be+saved%3B+whosoever+believeth+not+shall+be+damned.%E2%80%99+So+that+I+wonder+not+a+little+whereto+these+expressions+%5Bof+Cotton%E2%80%99s%5D+tend%2C+save+that+commonly+such+is+the+issue+of+imperfect+conceptions%2C+all+preparations+to+the+justifying+of+them+fall+miserably+short+of+that+whereunto+they+aim.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+Treatise+of+Mr.+%5BJohn%5D+Cotton%E2%80%99s+clearing+certain+doubts+concerning+Predestination%2C+together+with+an+Examination+Thereof+%28London%3A+J.D.%2C+1646%29%2C+Question+2%2C+pp.+54-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F38ad15fc71.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/38ad15fc71.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Come%20we%20to%20your%20%5BJohn%20Cotton%E2%80%98s%5D,short%20of%20that%20whereunto%20they%20aim." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2… And on the other side, it is equally as true that God has a willingness to glorify his vindicative justice as well as remunerative: to punish with death any one of his elect upon condition of final disobedience and impenitency, as well as to reward with life, upon condition of obedience and repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. [John] Cotton’s clearing certain doubts concerning Predestination, together with an Examination Thereof (London: J.D., 1646), Question 2</cite>, p. 58</span></figcaption>

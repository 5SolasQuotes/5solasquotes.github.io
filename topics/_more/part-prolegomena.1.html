t+want+to+trust+the+men+who+are+witnesses+of+their+baptism%2C+but+now+as+men+are+ready+to+trust+themselves+that+they+are+baptized+as+if+they+were+not+men%2C+or+as+if+they+were+more+certain+of+their+faith+than+the+witness+of+Christendom+allows.+So+I+contend+that+if+they+want+to+do+justice+to+this+passage%2C+%E2%80%9CWhoever+believes%2C%E2%80%9D+according+to+their+understanding%2C+they+must+condemn+rebaptism+much+more+earnestly+than+the+first+baptism.+Neither+the+baptizer+nor+the+baptized+can+maintain+his+position%2C+for+both+are+uncertain+of+their+faith%2C+or+at+least+are+in+constant+peril+and+anxiety.+For+it+happens%2C+indeed+it+is+so+in+this+matter+of+faith%2C+that+often+he+who+claims+to+believe+does+not+at+all+believe%3B+and+on+the+other+hand%2C+he+who+doesn%E2%80%99t+think+he+believes%2C+but+is+in+despair%2C+has+the+greatest+faith.+So+this+verse%2C+%E2%80%9CWhoever+believes%2C%E2%80%9D+does+not+compel+us+to+determine+who+has+faith+or+not.+Rather%2C+it+makes+it+a+matter+of+every+man%E2%80%99s+conscience+to+realize+that+if+he+is+to+be+saved+he+must+believe+and+not+pretend+that+it+is+sufficient+for+a+Christian+to+be+baptized.+For+the+verse+does+not+say%2C+%E2%80%9CWhoever+knows+that+he+believes%2C+or%2C+if+you+know+that+anyone+believes%2C%E2%80%9D+but+it+says%2C+%E2%80%9CWhoever+believes.%E2%80%9D+Who+has+it%2C+has+it.+One+must+believe%2C+but+we+neither+should+nor+can+know+it+for+certain.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Concerning+Rebaptism+in+Luther%E2%80%99s+Works%2C+Vol.+40%3A+Church+and+Ministry+II%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+40+%28Philadelphia%3A+Fortress+Press%2C+1999%29%2C+239%E2%80%9341.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9294aabf54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9294aabf54.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/01/luther-challenges-the-anabaptist-interpretation-of-mark-1616/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-f5fd75eefd" data-kw="">
<blockquote><p>An extreme opinion on this subject has been held by some Christians, to the effect that no true and certain knowledge of God can be derived by man, in his present condition, from the light of nature in the entire absence of a supernatural revelation; that we are altogether dependent upon such a revelation for any certain knowledge that God exists, as well as for all knowledge of his nature and his purposes. This opinion is disproved: (a.) By the direct testimony of Scripture. Rom. 1:20–24; 2:14, 15. (b.) By the fact that many conclusive arguments for the existence of a great first Cause, who is at the same time an intelligent personal Spirit and righteous moral Governor, have been drawn by a strict induction from the facts of nature alone, as they lie open to the natural understanding. The fact that this argument remains unanswerable shows that the process by which the conclusions are drawn from purely natural sources is legitimate. (c.) All nations, however destitute of a supernatural revelation they may have been, have yet possessed some knowledge of a God. And in the case of the most enlightened of the heathen, natural religion has given birth to a considerable natural theology. We must, however, distinguish between that knowledge of the divine character which may be obtained by men from the works of nature and providence in the exercise of their natural powers alone, without any suggestions or assistance derived from a supernatural revelation—as is illustrated in theological writings of some most eminent of the heathen who lived before Christ—and that knowledge which men in this age, under the clear light of a supernatural revelation, are competent to deduce from a study of nature. The natural theology of the modern rationalists demonstrably owes all its special excellences to that Christian revelation it is intended to supersede.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, (Philadelphia: Presbyterian Board of Publications, 1920), 45–46.</span></figcaption>

</figure><figure class="quote" id="q-64184bc0f0" data-kw="">
<blockquote><p>As I hasten to a conclusion, I am compelled to pass by your calumny, that, leaning entirely to our own judgment, we find not in the whole Church one individual to whom we think deference is due. That it is a calumny, I have already sufficiently demonstrated. For, although we hold that the Word of God alone lies beyond the sphere of our judgment, and that Fathers and Councils are of authority only in so far as they accord with the rule of the Word, we still give to Councils and Fathers such rank and honour as it is meet for them to hold, under Christ.</p></blockquote>

</figure><figure class="quote" id="q-01f5c9f73b" data-kw="">
<blockquote><p>Wherefore when this Word of God is now preached in the church by preachers lawfully called, we believe that the very Word of God is proclaimed, and received by the faithful; and that neither any other Word of God is to be invented nor is to be expected from heaven: and that now the Word itself which is preached is to be regarded, not the minister that preaches; for even if he be evil and a sinner, nevertheless the Word of God remains still true and good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, Other citations (work not named), chapter 1.</span></figcaption>

<blockquote><p>Take away, indeed, from the heretics the wisdom which they share with the heathen, and let them support their inquiries from the Scriptures alone: they will then be unable to keep their ground.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De res. 3. On the Resurrection of the Flesh, in Latin Christianity: Its Founder, Tertullian</cite>, ed. Alexander Roberts, James Donaldson, and A. Cleveland Coxe, trans. Peter Holmes, vol. 3, The Ante-Nicene Fathers (Buffalo, NY: Christian Literature Company, 1885), 547.</span></figcaption>

</figure><figure class="quote" id="q-874f1351e9" data-kw="">
<blockquote><p>To the fourth we answer, that your conclusion of that which Jerome and Vincentius say, that the Devil and heretics use of the Scriptures is childish. And unless you will conclude that all those that use the Scriptures are heretics, it is utterly vain. If you say that heretics appeal to the Scriptures alone, which the Catholics do not. First you say an untruth, seeing you may remember him that complained he was rejected with the Fathers. Secondly you say more than [Vincent of Lerin] does, nay he says the clean contrary, as that the Scripture alone is sufficient against heretics, if it be taken in the right sense And albeit, before he speaks of the tradition of the Catholic Church: yet thereby he means not unwritten verities, but the right exposition of the scriptures, made by the pastors and teachers of the Church. For otherwise how can the Scriptures alone be a perfect and sufficient rule against the heretics, if it need the supply of unwritten verities. Wherefore you are like to him that having arrows to shoot at the armed enemy, spent them vainly in shooting at birds. And we fear not (with a holy vaunt) even to vaunt our selves in the Gospel and Scriptures of God, as in the sword, which never fails to bring us home a spoil and a prey from you, as oft as we join battle with you.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“To the fourth we answer, that your conclusion of that which Jerome and Vincentius say, that the Devil and heretics use of the Scriptures is childish. And unless you will conclude that all those that use the Scriptures are heretics, it is utterly vain. If you say that heretics appeal to the Scriptures alone, which the Catholics do not. First you say an untruth, seeing you may remember him that complained he was rejected with the Fathers. Secondly you say more than [Vincent of Lerin] does, nay he says the clean contrary, as that the Scripture alone is sufficient against heretics, if it be taken in the right sense And albeit, before he speaks of the tradition of the Catholic Church: yet thereby he means not unwritten verities, but the right exposition of the scriptures, made by the pastors and teachers of the Church. For otherwise how can the Scriptures alone be a perfect and sufficient rule against the heretics, if it need the supply of unwritten verities. Wherefore you are like to him that having arrows to shoot at the armed enemy, spent them vainly in shooting at birds. And we fear not (with a holy vaunt) even to vaunt our selves in the Gospel and Scriptures of God, as in the sword, which never fails to bring us home a spoil and a prey from you, as oft as we join battle with you.”

<blockquote><p>It should be carefully noted that our criticism of this procedure does not imply that we hold it to be wrong for the Christian church to make formal use of the categories of thought discovered by Aristotle or any other thinker. On the contrary, we believe that in the Providence of God, Aristotle was raised up of God so that he might serve the church of God by laying at its feet the measures of his brilliant intellect. When Solomon built the temple of God he was instructed to make use of the peculiar skill and the peculiar gifts of the pagan nation that was his neighbor. But this was something quite different than to build together with pagan nations. The Samaritans wanted to help the Jews construct the city and the temple. Hence they were rejected by the true Jews. The Phoenicians merely wanted to bring their treasures to Solomon and let him construct the way he saw fit. Hence they were gladly received by Solomon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of Christian Epistemology</cite>, (The Presbyterian and Reformed Publishing Company: Phillipsburg, NJ, 1969).</span></figcaption>

<blockquote><p>Are the writings of the fathers the rule of truth in doctrines of faith and in the interpretation of the Scriptures? We deny against the papists I. Although from the preceding question we are already satisfied that the fathers cannot sit as judges in controversies of faith, yet because the papists frequently recur to them and are accustomed to obtrude upon us the consent of the fathers as a rule of truth, we must devote a separate question to this argument which is of the greatest importance in the controversies of the present day. II. By “the fathers” we do not mean with Augustine the apostles as the first founders and patriarchs of the Christian church (Psalm 45, NPNF1, 8:153), but (in accordance with the present usage which is sanctioned by the ancients) the teachers of the primitive church who (after the death of the apostles) taught and illustrated the doctrine of salvation, orally and in writing. On account of age, they lived many years before our times; on account of doctrine (for by inculcating it upon their disciples), they begat sons to God in the church. III. Although some extend their age down to the tenth century, we do not think it ought to be carried down further than the sixth. For it is certain that purity of doctrine and worship became greatly corrupted after the six hundredth year (in which Antichrist raised his head)—error and superstitions increasing by the just judgment of God. In the first century after the death of the apostles, the principal fathers were Ignatius and Polycarp, fragments of whose writings are extant. In the second, Justin Martyr and Irenaeus. In the third, Tertullian, Clement of Alexandria, Origen, Cyprian, Arnobius, Lactantius. In the fourth, Athanasius, Eusebius of Caesarea, Hilary of Poitiers, Basil, Gregory Nazianzus, Ambrose, Jerome, Gregory of Nyssa, Epiphanius, John Chrysostom. In the fifth, Augustine, Cyril of Alexandria, Theodoret, Hilary of Aries, Prosper of Aquitania, Leo I. In the sixth, Fulgentius the African, Gelasius (Cyzicus), Gregory the Great and others. IV. There are three opinions among the papists as to the authority of the fathers. First, those who put them on an equality with the Scriptures: to which belong those decrees of the Glossator asserting, “the writings of the fathers to be authentic, individually as well as collectively” (Dist. 9+). Second (just the opposite), those who hold their writings to be merely human and therefore incapable of being a rule of faith. This was the opinion of Cajetan (“Praefatio,” Commentarii … in quinque Mosaicos libros in Sacrae Scripturae [1639], vol. 1) and of the wiser papists. Third, those who, holding a middle ground, concede that the authority of individual fathers is human and fallible, but think that the common and universal consent of the fathers in controversies is infallible and divine. This was the opinion of the Council of Trent, affirming that “the traditions of the fathers pertaining both to faith and practice must be received with an equal affection of piety with the Old and New Testaments” (Session 4, Schroeder, p. 17). And, in the same place, “It prohibits anyone from daring to interpret the Scriptures contrary to that sense which the holy mother church has held, or now holds … or even against the unanimous consent of the fathers” (Session 4, Schroeder, p. 19). Most of the papists—Stapleton, Bellarmine, Canus, Valentia and others—agree with this. V. The orthodox (although they hold the fathers in great estimation and think them very useful to a knowledge of the history of the ancient church, and our opinion on cardinal doctrines may agree with them) yet deny that their authority, whether as individuals or taken together, can be called authoritative in matters of faith and the interpretation of the Scriptures, so that by their judgment we must stand or fall. Their authority is only ecclesiastical and subordinate to the Scriptures and of no weight except so far as they agree with them.</p></blockquote>

<blockquote><p>…those who founded sects committed to erroneous doctrines proceeded in a way that is opposite to this, The point is clear in the case of Muhammad. He seduced the people by promises of carnal pleasure to which the concupiscence of the flesh goads us. His teaching also contained precepts that were in conformity with his promises, and he gave free rein to carnal pleasure. In all this, as is not unexpected, he was obeyed by carnal men. As for proofs of the truth of his doctrine, he brought forward only such as could be grasped by the natural ability of anyone with a very modest wisdom. Indeed, the truths that he taught he mingled with many fables and with doctrines of the greatest falsity. He did not bring forth any signs produced in a supernatural way, which alone fittingly gives witness to divine inspiration; for a visible action that can be only divine reveals an invisibly inspired teacher of truth. On the contrary, Muhammad said that he was sent in the power of his arms—which are signs not lacking even to robbers and tyrants. What is more, no wise men, men trained in things divine and human, believed in him from the beginning, Those who believed in him were brutal men and desert wanderers, utterly ignorant of all divine teaching, through whose numbers Muhammad forced others to become his followers by the violence of his arms. Nor do divine pronouncements on the part of preceding prophets offer him any witness. On the contrary, he perverts almost all the testimonies of the Old and New Testaments by making them into fabrications of his own, as can be seen by anyone who examines his law. It was, therefore, a shrewd decision on his part to forbid his followers to read the Old and New Testaments, lest these books convict him of falsity. It is thus clear that those who place any faith in his words believe foolishly.</p></blockquote>

<blockquote><p>Before I come to the consideration of these words, a doubt must be resolved. For some men may say that this is epistle is corrupted because these words are wanting in sundry translations and editions of the Bible. And Jerome says that they were not found in the copies of the Bible in his days. Answer. In the editions and translations of the Bible, there are sundry differences and diversities of readings. And these differences are not the fault of the Scripture, but of the men which used to write out the Bible. For the Bible heretofore was spread abroad, not by printing, but by writing. Again, though in the books of the Bible there be sundry varieties of reading, yet the providence of God has so watched over the Bible that the sense thereof remains entire, sound, and incorrupt, specially in the grounds of religion. And not the words principally, but the sense is the Scripture. For whether these words be left in, or put out, the sense of the verse is one and the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley (Grand Rapids: Reformation Heritage Books, 2015), 146.</span></figcaption>

<blockquote><p>The anti-protestant principles of Dr. Schaff, as it appears to us, are either included in his theory of development, or are its legitimate consequences. That theory he and Dr. Nevin for a time held in common. But it contains antagonistic principles. When carried out, the one must eliminate the other. And the precise difference between Dr. Nevin and Dr. Schaff, as we conceive, is that the former has given himself up to that element of the system which necessitates a return to Rome; while Dr. Schaff has remained true to that feature of theory, which enables him to look on Rome as a station long since past, in the onward progress of the Church, to which she can no more return than a man can become a boy. In order, however, to understand this subject, it will be necessary to ascertain what is meant by “development of the Church.” In Dr. Schaff’s exhibition of his doctrine there is much that is true, much that is common presented in new form, and much that is new, anti-scriptural, and anti-protestant. The plausibility of theory arises, in a great degree, from this large admixture of what every one is ready to admit, with subtle principles which spoil and pervert the whole. There is a form of the doctrine of development, or of the constant advance of the Church, which we presume all Protestants admit. Their view on this subject we understand to be substantially as follows: 1. Christianity is a system of doctrines supernaturally revealed and now recorded in the Bible. Of that system there can be no development. No new doctrines can be added to those contained in the word of God. No doctrine can ever be unfolded or expanded beyond what is there revealed. The whole revelation is there, and is there as distinctly, as fully, and as clearly as it can ever be made, without a new supernataral revelation. Every question, therefore, as to what is, or what is not Christian doctrine, is simply a question as to what the Bible teaches. There is no analogy, consequently, between theology and other sciences. The materials of theology do not admit of increase. They are all in the Bible. The materials of human science are constantly accumulating, as new facts are brought to light and old assumptions corrected. Theology, therefore, as it existed in the mind of Paul, and is recorded in his writings, is precisely what will be theology of the last saint who is to live on the earth. Whereas the astronomy of Pythagoras is as different from that of La Place, as the men are widely separated in time. 2. While Christianity, considered as a system of doctrine, is thus complete and unchangeable, the knowledge of that system as it lies in the mind of the individual Christian, or in the Church collectively, is susceptible of progress, and does in fact advance. Every believer, when he first receives the truth, receives it partially, and necessarily mingles it with the previous contents of his mind, which to a greater or less degree perverts and corrupts it. As he grows in grace, he grows in knowledge. The more the Spirit of God leads him into conformity with the truth, the more correct do his apprehensions become, the more is the dross of error removed, and the more fully does he coincide in all his conceptions of divine things with the infallible standard of the word of God. With this increase of knowledge there is connected a corresponding increase of holiness, and of power to influence those around him for good. This is matter of daily experience and observation, and is in accordance with everything taught in the Bible, on the progress of the life of God in the soul. This progress is neither uniform nor constant. In some days, or even hours, the Christian may grow more than in years of ordinary experience. Sometimes his course is backward; he loses ground in knowledge, in faith, in love, in zeal and obedience. From these backslidings he is recalled only by the power of the Holy Ghost. This restoration is commonly effected only through a deeper conviction of sin, and a clearer apprehension and more cordial reception of the truth than he had before experienced. He becomes thus a better man and a more advanced Christian than he was before. It was thus with Peter; and it is thus that the Christian is led from strength to strength until he appears before God. No part of a believer’s life is isolated. As the present is conditioned more or less by the past, so in its turn it conditions the future.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Review of History of the Apostolic Church; with a General Introduction to Church History by Philip Schaff,” in The Book Reviews of Charles Hodge</cite>, (Bellingham, WA: Logos Bible Software, 2014).</span></figcaption>

+of+God+in+the+soul.+This+progress+is+neither+uniform+nor+constant.+In+some+days%2C+or+even+hours%2C+the+Christian+may+grow+more+than+in+years+of+ordinary+experience.+Sometimes+his+course+is+backward%3B+he+loses+ground+in+knowledge%2C+in+faith%2C+in+love%2C+in+zeal+and+obedience.+From+these+backslidings+he+is+recalled+only+by+the+power+of+the+Holy+Ghost.+This+restoration+is+commonly+effected+only+through+a+deeper+conviction+of+sin%2C+and+a+clearer+apprehension+and+more+cordial+reception+of+the+truth+than+he+had+before+experienced.+He+becomes+thus+a+better+man+and+a+more+advanced+Christian+than+he+was+before.+It+was+thus+with+Peter%3B+and+it+is+thus+that+the+Christian+is+led+from+strength+to+strength+until+he+appears+before+God.+No+part+of+a+believer%E2%80%99s+life+is+isolated.+As+the+present+is+conditioned+more+or+less+by+the+past%2C+so+in+its+turn+it+conditions+the+future.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+%E2%80%9CReview+of+History+of+the+Apostolic+Church%3B+with+a+General+Introduction+to+Church+History+by+Philip+Schaff%2C%E2%80%9D+in+The+Book+Reviews+of+Charles+Hodge%2C+%28Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2014%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6dcdc5f68a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6dcdc5f68a.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/09/hodge-sufficiency-scripture-development-theology/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-a761f3de04" data-kw="">
<blockquote><p>If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone. …Faith, therefore, is not the gift of the church, except improperly and in a mere ministerial capacity; but it is properly and necessarily the gift and effect of the Holy Spirit speaking through the scriptures. The sum of the matter is this: faith is produced by scripture alone; therefore the true sense of scripture is to be discovered from the scripture itself alone. Our third argument stands thus: The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope. The major is self-evident. The minor, namely, that none of these properties exist in any visible church or in the pope, is clear also. …As to Cyprian, his error did not lie in rejecting custom and appealing to scripture, (for he is praised by Augustine for doing so,) but in thinking that his opinion could be established by scripture, whereas scripture is subversive of it. Even Gratian, Dist. 8 and 9, approves of Cyprian for refusing to yield to mere custom2. Bellarmine subjoins that the Arians (to mention no more) appealed to the scripture alone. I answer: The Arians clung to the bare words of scripture: we do not imitate them in that. We do not reject terms which never occur in scripture, provided the sense and force of those terms be contained in scripture, as we have frequently replied already: on which account we condemn the Arians for rejecting the Homoüsion. However, religion and piety do not consist in words; and Luther said truly, that he should not be a heretic if he rejected the term Homoüsion, and yet so thought of the Son of God as the scriptures have delivered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, (1588), 328, 448, 611.</span></figcaption>

</figure><figure class="quote" id="q-2845c96678" data-kw="">
<blockquote><p>The Starting point of theory of knowledge ought to be ordinary daily experience, the universal and natural certainty of human beings concerning the objectivity and truth of their knowledge. After all, it is not philosophy that creates the cognitive faculty and cognition. Philosophy only finds it and then attempts to explain it. Any solution that does not explain the cognitive faculty but instead destroys it and, failing to understand cognition, turns it into an illusion, is judged by that fact. Only a theory of knowledge that penetrates the very depths of the problem has a chance to succeed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: Prolegomena</cite>, ed. John Bolt trans. John Vriend (Grand Rapids: Baker, 2003), 223.</span></figcaption>

</figure><figure class="quote" id="q-55f2dd6b09" data-kw="">
<blockquote><p>Wherefore we do not despise the interpretations of the holy Greek and Latin fathers, nor reject their disputations and treatises concerning sacred matters as far as they agree with the Scriptures; but we modestly dissent from them when they are found to set down things differing from, or altogether contrary to, the Scriptures. Neither do we think that we do them any wrong in this matter; seeing that they all, with one consent, will not have their writings equated with the canonical Scriptures, but command us to prove how far they agree or disagree with them, and to accept what is in agreement and to reject what is in disagreement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, (1566), ch. 2.</span></figcaption>

<blockquote><p>III. Let then these things be premised. First. Reason signifies either that faculty of man where by he perceives, and judgeth, and distinguisheth truth from falsehood, or those maxims, aphorisms, or axioms, which are either self evident, or believed to be rightly drawn from evident principles. Secondly. Right reason, considered as a faculty, is that which being endued with sufficient light, conceives things, or judgeth concerning them, no otherwise than as they truly are; and is opposed to corrupt, erroneous, blind reason which frequently forms very wrong conceptions and judgements of things. Considered as an axiom, by right reason is meant most certain and evident principles, or inferences drawn there from by plain and evident consequence; and is opposed to rash assertions, spoken without any just examination, or test, of the things so affirmed. Thirdly. Reason is fully persuaded that it judgeth right, when the conceptions, or ideas, of things are clearly and distinctly perceived; nevertheless the often discovers herself to have been mistaken, whilst she thought that she perceived something clearly and distinctly, when at the same time she was in an error. Fourthly. In as far as reason denotes a faculty, it is the next efficient cause of perception and judgement; not the rule: but as it signifies evident and certain axioms it may so far have the nature of a rule that whatever is rejected for false is plainly repugnant to a position of manifest truth, or is not a just and legitimate inference. Fifthly. Faith here notes an assent given to some truth, not on account of the evidence of the thing,* but on account of the testimony of God; who, as he is the supreme truth, bears witness of himself. John 3:33. 1 John 5:9, 10. Sixthly. Those are called the mysteries of faith which no man was ever able to find out by his own reasoning powers, but are known by the revelation of God alone, and are opposed to that which may be known of God by the light of nature. Rom. 1:19. 1 Cor. 2:7. Eph. 3:3. Seventhly. That revelation is contained in the sacred books of the Old and New Testament, which evince their authenticity to the conscience of a serious enquirer, duly attending to the external and internal marks of their divinity; and, if any thing be there plainly taught, it is certainly a great crime to treat them with reproach, under any pretence whatever. IV. These things being premised; the Question is not, Whether the scripture may teach some mysteries contrary to right reason? Nor, whether reason may ever oppose itself to the doctrine of the scripture, under pretence of its own rectitude? Nor, whether investigating the sense of scripture, reason be of great use? For this would be an ambiguous statement of the subject. But, when we enquire into the meaning of the holy scriptures, the question is, Whether then the dictates of what is accounted right reason, must be first consulted, that it may in the first place determine, concerning the things themselves, whether they be worthy a divine revelation; or, whether we ought simply to attend to what the words, in all their circumstances, properly signify, so that what they are found to mean, may forthwith be received for true, without any farther test, or examination, of the things according to pretended axioms of reason? Or, (more briefly stated) whether it is better to explain the words of scripture so that they may agree with the axioms of reason, or to correct the axioms of reason to that sense which the words of scripture plainly speak? The Socinians contend for the former, and support it by their practice; and I wish they only did so: the Orthodox maintain the latter.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“III. Let then these things be premised. First. Reason signifies either that faculty of man where by he perceives, and judgeth, and distinguisheth truth from falsehood, or those maxims, aphorisms, or axioms, which are either self evident, or believed to be rightly drawn from evident principles. Secondly. Right reason, considered as a faculty, is that which being endued with sufficient light, conceives things, or judgeth concerning them, no otherwise than as they truly are; and is opposed to corrupt, erroneous, blind reason which frequently forms very wrong conceptions and judgements of things. Considered as an axiom, by right reason is meant most certain and evident principles, or inferences drawn there from by plain and evident consequence; and is opposed to rash assertions, spoken without any just examination, or test, of the things so affirmed. Thirdly. Reason is fully persuaded that it judgeth right, when the conceptions, or ideas, of things are clearly and distinctly perceived; nevertheless the often discovers herself to have been mistaken, whilst she thought that she perceived something clearly and distinctly, when at the same time she was in an error. Fourthly. In as far as reason denotes a faculty, it is the next efficient cause of perception and judgement; not the rule: but as it signifies evident and certain axioms it may so far have the nature of a rule that whatever is rejected for false is plainly repugnant to a position of manifest truth, or is not a just and legitimate inference. Fifthly. Faith here notes an assent given to some truth, not on account of the evidence of the thing,* but on account of the testimony of God; who, as he is the supreme truth, bears witness of himself. John 3:33. 1 John 5:9, 10. Sixthly. Those are called the mysteries of faith which no man was ever able to find out by his own reasoning powers, but are known by the revelation of God alone, and are opposed to that which may be known of God by the light of nature. Rom. 1:19. 1 Cor. 2:7. Eph. 3:3. Seventhly. That revelation is contained in the sacred books of the Old and New Testament, which evince their authenticity to the conscience of a serious enquirer, duly attending to the external and internal marks of their divinity; and, if any thing be there plainly taught, it is certainly a great crime to treat them with reproach, under any pretence whatever. IV. These things being premised; the Question is not, Whether the scripture may teach some mysteries contrary to right reason? Nor, whether reason may ever oppose itself to the doctrine of the scripture, under pretence of its own rectitude? Nor, whether investigating the sense of scripture, reason be of great use? For this would be an ambiguous statement of the subject. But, when we enquire into the meaning of the holy scriptures, the question is, Whether then the dictates of what is accounted right reason, must be first consulted, that it may in the first place determine, concerning the things themselves, whether they be worthy a divine revelation; or, whether we ought simply to attend to what the words, in all their circumstances, properly signify, so that what they are found to mean, may forthwith be received for true, without any farther test, or examination, of the things according to pretended axioms of reason? Or, (more briefly stated) whether it is better to explain the words of scripture so that they may agree with the axioms of reason, or to correct the axioms of reason to that sense which the words of scripture plainly speak? The Socinians contend for the former, and support it by their practice; and I wish they only did so: the Orthodox maintain the latter.”

— Herman Witsius, An Essay on the Use and Abuse of Reason in Matters of Religion, trans. John Carter (Norwich: Crouse, Stevenson and Matchett, 1795), 4–7.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+Let+then+these+things+be+premised.+First.+Reason+signifies+either+that+faculty+of+man+where+by+he+perceives%2C+and+judgeth%2C+and+distinguisheth+truth+from+falsehood%2C+or+those+maxims%2C+aphorisms%2C+or+axioms%2C+which+are+either+self+evident%2C+or+believed+to+be+rightly+drawn+from+evident+principles.+Secondly.+Right+reason%2C+considered+as+a+faculty%2C+is+that+which+being+endued+with+sufficient+light%2C+conceives+things%2C+or+judgeth+concerning+them%2C+no+otherwise+than+as+they+truly+are%3B+and+is+opposed+to+corrupt%2C+erroneous%2C+blind+reason+which+frequently+forms+very+wrong+conceptions+and+judgements+of+things.+Considered+as+an+axiom%2C+by+right+reason+is+meant+most+certain+and+evident+principles%2C+or+inferences+drawn+there+from+by+plain+and+evident+consequence%3B+and+is+opposed+to+rash+assertions%2C+spoken+without+any+just+examination%2C+or+test%2C+of+the+things+so+affirmed.+Thirdly.+Reason+is+fully+persuaded+that+it+judgeth+right%2C+when+the+conceptions%2C+or+ideas%2C+of+things+are+clearly+and+distinctly+perceived%3B+nevertheless+the+often+discovers+herself+to+have+been+mistaken%2C+whilst+she+thought+that+she+perceived+something+clearly+and+distinctly%2C+when+at+the+same+time+she+was+in+an+error.+Fourthly.+In+as+far+as+reason+denotes+a+faculty%2C+it+is+the+next+efficient+cause+of+perception+and+judgement%3B+not+the+rule%3A+but+as+it+signifies+evident+and+certain+axioms+it+may+so+far+have+the+nature+of+a+rule+that+whatever+is+rejected+for+false+is+plainly+repugnant+to+a+position+of+manifest+truth%2C+or+is+not+a+just+and+legitimate+inference.+Fifthly.+Faith+here+notes+an+assent+given+to+some+truth%2C+not+on+account+of+the+evidence+of+the+thing%2C%2A+but+on+account+of+the+testimony+of+God%3B+who%2C+as+he+is+the+supreme+truth%2C+bears+witness+of+himself.+John+3%3A33.+1+John+5%3A9%2C+10.+Sixthly.+Those+are+called+the+mysteries+of+faith+which+no+man+was+ever+able+to+find+out+by+his+own+reasoning+powers%2C+but+are+known+by+the+revelation+of+God+alone%2C+and+are+opposed+to+that+which+may+be+known+of+God+by+the+light+of+nature.+Rom.+1%3A19.+1+Cor.+2%3A7.+Eph.+3%3A3.+Seventhly.+That+revelation+is+contained+in+the+sacred+books+of+the+Old+and+New+Testament%2C+which+evince+their+authenticity+to+the+conscience+of+a+serious+enquirer%2C+duly+attending+to+the+external+and+internal+marks+of+their+divinity%3B+and%2C+if+any+thing+be+there+plainly+taught%2C+it+is+certainly+a+great+crime+to+treat+them+with+reproach%2C+under+any+pretence+whatever.+IV.+These+things+being+premised%3B+the+Question+is+not%2C+Whether+the+scripture+may+teach+some+mysteries+contrary+to+right+reason%3F+Nor%2C+whether+reason+may+ever+oppose+itself+to+the+doctrine+of+the+scripture%2C+under+pretence+of+its+own+rectitude%3F+Nor%2C+whether+investigating+the+sense+of+scripture%2C+reason+be+of+great+use%3F+For+this+would+be+an+ambiguous+statement+of+the+subject.+But%2C+when+we+enquire+into+the+meaning+of+the+holy+scriptures%2C+the+question+is%2C+Whether+then+the+dictates+of+what+is+accounted+right+reason%2C+must+be+first+consulted%2C+that+it+may+in+the+first+place+determine%2C+concerning+the+things+themselves%2C+whether+they+be+worthy+a+divine+revelation%3B+or%2C+whether+we+ought+simply+to+attend+to+what+the+words%2C+in+all+their+circumstances%2C+properly+signify%2C+so+that+what+they+are+found+to+mean%2C+may+forthwith+be+received+for+true%2C+without+any+farther+test%2C+or+examination%2C+of+the+things+according+to+pretended+axioms+of+reason%3F+Or%2C+%28more+briefly+stated%29+whether+it+is+better+to+explain+the+words+of+scripture+so+that+they+may+agree+with+the+axioms+of+reason%2C+or+to+correct+the+axioms+of+reason+to+that+sense+which+the+words+of+scripture+plainly+speak%3F+The+Socinians+contend+for+the+former%2C+and+support+it+by+their+practice%3B+and+I+wish+they+only+did+so%3A+the+Orthodox+maintain+the+latter.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+An+Essay+on+the+Use+and+Abuse+of+Reason+in+Matters+of+Religion%2C+trans.+John+Carter+%28Norwich%3A+Crouse%2C+Stevenson+and+Matchett%2C+1795%29%2C+4%E2%80%937.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F92e3b93464.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/92e3b93464.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/08/witsius-on-the-relation-between-human-reason-and-divine-authority/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Finally we turn to the perspicuity of nature which corresponds to the perspicuity of Scripture. We have stressed the fact that God’s revelation in nature was from the outset of history meant to be taken conjointly with God’s supernatural communication. This might seem to indicate that natural revelation is not inherently perspicuous. Then too it has been pointed out that back of both kinds of revelation is the incomprehensible God. And this fact again might, on first glance, seem to militate strongly against the claim that nature clearly reveals God. Yet these very facts themselves are the best guarantee of the genuine perspicuity of natural revelation. The perspicuity of God’s revelation in nature depends for its very meaning upon the fact that it is an aspect of the total and totally voluntary revelation of a God who is self-contained. God’s incomprehensibility to man is due to the fact that he is exhaustively comprehensible to himself. God is light and in him is no darkness at all. As such he cannot deny himself. This God naturally has an all-comprehensive plan for the created universe. He has planned all the relationships between all the aspects of created being. He has planned the end from the beginning. All created reality therefore actually displays this plan. It is, in consequence, inherently rational. It is quite true, of course, that created man is unable to penetrate to the very bottom of this inherently clear revelation. But this does not mean that on this account the revelation of God is not clear, even for him. Created man may see clearly what is revealed clearly even if he cannot see exhaustively. Man does not need to know exhaustively in order to know truly and certainly. When on the created level of existence man thinks God’s thoughts after him, that is, when man thinks in self-conscious submission to the voluntary revelation of the self-sufficient God, he has therewith the only possible ground of certainty for his knowledge. When man thinks thus he thinks as a covenant creature would wish to think. That is to say, man normally thinks in analogical fashion. He realizes that God’s thoughts are self-contained. He knows that his own interpretation of nature must therefore be a re-interpretation of what is already fully interpreted by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Apologetics. 2nd ed</cite>, (Phillipsburg, NJ: The Presbyterian and Reformed Publishing Company, 2003), ch. 2, sect;5.</span></figcaption>

<blockquote><p>Alongside of the archetypal knowledge of God, found in God Himself, there is also an ectypal knowledge of Him, given to man by revelation. The latter is related to the former as a copy is to the original, and therefore does not possess the same measure of clearness and perfection. All our knowledge of God is derived from His self-revelation in nature and in Scripture. Consequently, our knowledge of God is on the one hand ectypal and analogical, but on the other hand also true and accurate, since it is a copy of the archetypal knowledge which God has of Himself.</p></blockquote>

<blockquote><p>You are wont, indeed, to bring up against us the letters of Cyprian, his opinion, his Council; why do ye claim the authority of Cyprian for your schism, and reject his example when it makes for the peace of the Church? But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true….</p></blockquote>

<blockquote><p>True philosophy, although it also differs very much from the doctrine of the church, yet, it does not array itself against it nor is it a wicked fabrication and device of Satan, as is true of the false doctrines of the sects, but it contains truth and is, as it were, a certain ray of the wisdom of God, impressed upon the mind of man in his creation. It is a doctrine that has respect to God and his creatures and many other things that are good and profitable to mankind and has been drawn out from the light of nature and from principles, in themselves clear and evident, and reduced to a system by wise and earnest men. It follows, therefore, that it is not only lawful but also profitable for Christians to devote themselves to the study of philosophy.</p></blockquote>

<blockquote><p>19. That person does not deserve to be called a theologian who looks upon the invisible things of God as though they were clearly perceptible in those things which have actually happened (Rom. 1:20; cf. 1 Cor 1:21-25), 20. He deserves to be called a theologian, however, who comprehends the visible and manifest things of God seen through suffering and the cross. 21. A theology of glory calls evil good and good evil. A theology of the cross calls the thing what it actually is.</p></blockquote>

</figure><figure class="quote" id="q-c7a7d11ae8" data-kw="">
<blockquote><p>From the beginning Christianity was certainly a life. But how was the life produced? It might conceivably have been produced by exhortation. That method had often been tried in the ancient world; in the Hellenistic age there were many wandering preachers who told men how they ought to live. But such exhortation proved to be powerless. Although the ideals of the Cynic and Stoic preachers were high, these preachers never succeeded in transforming society. The strange thing about Christianity was that it adopted an entirely different method. It transformed the lives of men not by appealing to the human will, but by telling a story; not by exhortation, but by the narration of an event. It is no wonder that such a method seemed strange. Could anything be more impractical than the attempt to influence conduct by rehearsing events concerning the death of a religious teacher? That is what Paul called ‘the foolishness of the message.’ It seemed foolish to the ancient world, and it seems foolish to liberal teachers today. But the strange thing is that it works. The effects of it appear even in this world. Where the most eloquent exhortation fails, the simple story of an event succeeds; the lives of men are transformed by a piece of news.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism, New Edition</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-980568f110" data-kw="">
<blockquote><p>A controversy respecting the atonement sprang up between Duns Scotus and the followers of Aquinas, which involved fundamental principles in ethics and religion, and divided the Romish Church into two great parties of Thomists and Scotists. Duns Scotus denied the Anselmic doctrine that sin is of infinite demerit, and consequently denied that the suffering of Christ is of infinite value. The relation of the atonement of the Son of God to the sin of mankind, he maintained, is merely an arbitrary and constituted one. The principle upon which he founded his theory was: “Tantum valet omne creatum oblatum, pro quanto acceptat Deus illud, et non plus.” There is no interior fitness and adaptation between Christ’s atonement and man’s sin. God was pleased to accept this particular sacrifice as an offset and equivalent for human transgression, not from any intrinsic value in it, but because he so pleased. He might have accepted any other substitute, or he might have dispensed with accepting any substitute at all. In opposition to this view, the followers of Aquinas maintained the old Anselmic theory of the infinite demerit of sin, and the infinite and objective value of Christ’s satisfaction. In this controversy, the soteriology of the adherents of Aquinas is more in harmony with the Protestant view and feeling; so that we might reverse what Melanchthon remarks of Augustine, and say, that “the opinion of Aquinas is more pertinent, fit and convenient when he disputed than it was when not disputing.” And yet it would be difficult to see how the followers of Aquinas could in the end avoid the conclusions of Duns Scotus, if they started from that doctrine of a relative necessity of satisfying justice which we have seen Aquinas held, in common with all the Schoolmen excepting Anselm. If omnipotence and bare will are more ultimate in the Divine Nature than justice and truth are, then it is difficult to see how Scotus can be censured for holding, that in the last analysis God can dispense with an atonement altogether, and that whatever value the existing judicial provision possesses in the divine plan, it possesses not in itself, but solely by virtue of its optional acceptance by the Omnipotent One who is not limited by anything, not even by his own moral attributes. The controversy, however, ran high between the adherents of Aquinas and Scotus,—the Dominican order generally siding with the former, and the Franciscan with the latter. The Nominalists in philosophy also naturally favoured the views of Scotus, as his theory was that of a nominal and putative satisfaction, in distinction from a real and objective one. The extravagantly speculative minds of the age, those who have given the reputation of hair-splitting and excessive dialectics to Scholasticism, also adopted the positions of Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Theology</cite>, (New York: Scribners) 2.315</span></figcaption>

<blockquote><p>The third property of Scripture adduced, is its perspicuity (section 7): and here again the Confession is no less precise and guarded than clear and decided in its assertions. The perspicuity of Scripture is sharply affirmed, in the sense that the saving truth is declared to be placed in Scripture within the reach of all sincere seekers after it. But the limitations of its perspicuity are very fully and carefully stated. It is only “those things which are necessary to be known, believed, and observed, for salvation” that are said to lie perspicuously in Scripture. Even these things are not said to be plainly delivered on every occasion in which they fall to be mentioned or treated in Scripture; but only “in some place of Scripture or other.” Nor is it even stated that they all are anywhere so clearly propounded and opened as that they may easily be understood unto perfection; but only so as that “a sufficient understanding of them” may be attained. Nor yet are they affirmed to be equally understandable by all; but only that they are so clearly spread on the face of Scripture that every man, learned or unlearned, may attain a sufficient understanding of them to secure his salvation and peace. The variety of Scripture is here fully recognized—its frequent obscurities, its difficulties, its problems, and its profound depths darkening to all human gaze. The variety of mental acumen and teachableness of heart brought to the study of Scripture, is sufficiently recognized. But the fact that the Scriptures, despite all their obscurities, are a people’s book, is sharply and decisively asserted; and with it the right of the unlearned man to them, and his capacity to make full use of them for the main purpose for which they were given; and as well, the openness of the Scriptures to the “due use of the ordinary means.” In a word there is combined here an adequate recognition of the profundity of the Scriptures and their occasional obscurity, with an equally clear assertion of the popular character of the Word of God as a message to every one of His children. We must not overlook, in passing, that it is by “a due use of the ordinary means” that the learned and unlearned alike are said to be able to attain a sufficient knowledge of the saving message of Scripture. By the phrase, “a due use of the ordinary means,” not only is the need of an infallible interpreting Church denied; but also all dependence on extraordinary revelations, the “inner light” of the mystical sectaries, and the like, is excluded. Within the “ordinary means” is included that “inward illumination of the Spirit of God,” which is declared to be necessary to the saving understanding of Scripture in section 6, and which is here declared to be an ordinary endowment of the children of God. Within them is included all the religious and gracious means which God has placed at the disposal of His people, in the establishment of His Church and its teaching functions. But in this phrase is also included the implication that Scripture is to be interpreted, as other books are interpreted, in the ordinary processes and by means of the ordinary implements of exegesis. There is included here, therefore, the charter of a sound and rational system and method of exposition; and we are accordingly not surprised to find the Westminster Divines dealing constantly in their extant writings with the question of “how to read the Scriptures,” and laying down well-considered and reasonable canons of interpretation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The third property of Scripture adduced, is its perspicuity (section 7): and here again the Confession is no less precise and guarded than clear and decided in its assertions. The perspicuity of Scripture is sharply affirmed, in the sense that the saving truth is declared to be placed in Scripture within the reach of all sincere seekers after it. But the limitations of its perspicuity are very fully and carefully stated. It is only “those things which are necessary to be known, believed, and observed, for salvation” that are said to lie perspicuously in Scripture. Even these things are not said to be plainly delivered on every occasion in which they fall to be mentioned or treated in Scripture; but only “in some place of Scripture or other.” Nor is it even stated that they all are anywhere so clearly propounded and opened as that they may easily be understood unto perfection; but only so as that “a sufficient understanding of them” may be attained. Nor yet are they affirmed to be equally understandable by all; but only that they are so clearly spread on the face of Scripture that every man, learned or unlearned, may attain a sufficient understanding of them to secure his salvation and peace. The variety of Scripture is here fully recognized—its frequent obscurities, its difficulties, its problems, and its profound depths darkening to all human gaze. The variety of mental acumen and teachableness of heart brought to the study of Scripture, is sufficiently recognized. But the fact that the Scriptures, despite all their obscurities, are a people’s book, is sharply and decisively asserted; and with it the right of the unlearned man to them, and his capacity to make full use of them for the main purpose for which they were given; and as well, the openness of the Scriptures to the “due use of the ordinary means.” In a word there is combined here an adequate recognition of the profundity of the Scriptures and their occasional obscurity, with an equally clear assertion of the popular character of the Word of God as a message to every one of His children. We must not overlook, in passing, that it is by “a due use of the ordinary means” that the learned and unlearned alike are said to be able to attain a sufficient knowledge of the saving message of Scripture. By the phrase, “a due use of the ordinary means,” not only is the need of an infallible interpreting Church denied; but also all dependence on extraordinary revelations, the “inner light” of the mystical sectaries, and the like, is excluded. Within the “ordinary means” is included that “inward illumination of the Spirit of God,” which is declared to be necessary to the saving understanding of Scripture in section 6, and which is here declared to be an ordinary endowment of the children of God. Within them is included all the religious and gracious means which God has placed at the disposal of His people, in the establishment of His Church and its teaching functions. But in this phrase is also included the implication that Scripture is to be interpreted, as other books are interpreted, in the ordinary processes and by means of the ordinary implements of exegesis. There is included here, therefore, the charter of a sound and rational system and method of exposition; and we are accordingly not surprised to find the Westminster Divines dealing constantly in their extant writings with the question of “how to read the Scriptures,” and laying down well-considered and reasonable canons of interpretation.”

— Benjamin B. Warfield, The Works of Benjamin B. Warfield: The Westminster Assembly and Its Work, vol. 6 (Bellingham, WA: Logos Bible Software, 2008), 232–34.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+third+property+of+Scripture+adduced%2C+is+its+perspicuity+%28section+7%29%3A+and+here+again+the+Confession+is+no+less+precise+and+guarded+than+clear+and+decided+in+its+assertions.+The+perspicuity+of+Scripture+is+sharply+affirmed%2C+in+the+sense+that+the+saving+truth+is+declared+to+be+placed+in+Scripture+within+the+reach+of+all+sincere+seekers+after+it.+But+the+limitations+of+its+perspicuity+are+very+fully+and+carefully+stated.+It+is+only+%E2%80%9Cthose+things+which+are+necessary+to+be+known%2C+believed%2C+and+observed%2C+for+salvation%E2%80%9D+that+are+said+to+lie+perspicuously+in+Scripture.+Even+these+things+are+not+said+to+be+plainly+delivered+on+every+occasion+in+which+they+fall+to+be+mentioned+or+treated+in+Scripture%3B+but+only+%E2%80%9Cin+some+place+of+Scripture+or+other.%E2%80%9D+Nor+is+it+even+stated+that+they+all+are+anywhere+so+clearly+propounded+and+opened+as+that+they+may+easily+be+understood+unto+perfection%3B+but+only+so+as+that+%E2%80%9Ca+sufficient+understanding+of+them%E2%80%9D+may+be+attained.+Nor+yet+are+they+affirmed+to+be+equally+understandable+by+all%3B+but+only+that+they+are+so+clearly+spread+on+the+face+of+Scripture+that+every+man%2C+learned+or+unlearned%2C+may+attain+a+sufficient+understanding+of+them+to+secure+his+salvation+and+peace.+The+variety+of+Scripture+is+here+fully+recognized%E2%80%94its+frequent+obscurities%2C+its+difficulties%2C+its+problems%2C+and+its+profound+depths+darkening+to+all+human+gaze.+The+variety+of+mental+acumen+and+teachableness+of+heart+brought+to+the+study+of+Scripture%2C+is+sufficiently+recognized.+But+the+fact+that+the+Scriptures%2C+despite+all+their+obscurities%2C+are+a+people%E2%80%99s+book%2C+is+sharply+and+decisively+asserted%3B+and+with+it+the+right+of+the+unlearned+man+to+them%2C+and+his+capacity+to+make+full+use+of+them+for+the+main+purpose+for+which+they+were+given%3B+and+as+well%2C+the+openness+of+the+Scriptures+to+the+%E2%80%9Cdue+use+of+the+ordinary+means.%E2%80%9D+In+a+word+there+is+combined+here+an+adequate+recognition+of+the+profundity+of+the+Scriptures+and+their+occasional+obscurity%2C+with+an+equally+clear+assertion+of+the+popular+character+of+the+Word+of+God+as+a+message+to+every+one+of+His+children.+We+must+not+overlook%2C+in+passing%2C+that+it+is+by+%E2%80%9Ca+due+use+of+the+ordinary+means%E2%80%9D+that+the+learned+and+unlearned+alike+are+said+to+be+able+to+attain+a+sufficient+knowledge+of+the+saving+message+of+Scripture.+By+the+phrase%2C+%E2%80%9Ca+due+use+of+the+ordinary+means%2C%E2%80%9D+not+only+is+the+need+of+an+infallible+interpreting+Church+denied%3B+but+also+all+dependence+on+extraordinary+revelations%2C+the+%E2%80%9Cinner+light%E2%80%9D+of+the+mystical+sectaries%2C+and+the+like%2C+is+excluded.+Within+the+%E2%80%9Cordinary+means%E2%80%9D+is+included+that+%E2%80%9Cinward+illumination+of+the+Spirit+of+God%2C%E2%80%9D+which+is+declared+to+be+necessary+to+the+saving+understanding+of+Scripture+in+section+6%2C+and+which+is+here+declared+to+be+an+ordinary+endowment+of+the+children+of+God.+Within+them+is+included+all+the+religious+and+gracious+means+which+God+has+placed+at+the+disposal+of+His+people%2C+in+the+establishment+of+His+Church+and+its+teaching+functions.+But+in+this+phrase+is+also+included+the+implication+that+Scripture+is+to+be+interpreted%2C+as+other+books+are+interpreted%2C+in+the+ordinary+processes+and+by+means+of+the+ordinary+implements+of+exegesis.+There+is+included+here%2C+therefore%2C+the+charter+of+a+sound+and+rational+system+and+method+of+exposition%3B+and+we+are+accordingly+not+surprised+to+find+the+Westminster+Divines+dealing+constantly+in+their+extant+writings+with+the+question+of+%E2%80%9Chow+to+read+the+Scriptures%2C%E2%80%9D+and+laying+down+well-considered+and+reasonable+canons+of+interpretation.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+The+Works+of+Benjamin+B.+Warfield%3A+The+Westminster+Assembly+and+Its+Work%2C+vol.+6+%28Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2008%29%2C+232%E2%80%9334.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F91f992e49c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91f992e49c.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/warfield-what-the-perspicuity-of-scripture-does-and-does-not-do/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-162a9cd4cd" data-kw="">
<blockquote><p>Now indeed these two kinds of theology are so different that they cannot truthfully be related to some one, definite head and shared genus. Of course the first kind of theology, which we have named divine and a prototype, does not belong to the one genus nor indeed to the other. The nature of the first kind of theology and of the second kind makes clear that its genus is not common with this created theology. For that essential, archetypal theology is a characteristic of the nature of God, and part (as we would put it) of that infinite knowledge which in God is essential. Whatever is essential, moreover, it is agreed that this is properly assigned to the same genus, together with the actual essence of which that thing is essential; so we speak of part for whole, and limb for body of the same kind, and sharing in the genus. God, however, is above every genus, essence beyond essence, as the holy fathers very aptly called Him. This theology in fact does not belong to the essence of those things to which it pertains, but attaches to them like a garment, as it were, enrobing their essence so to speak. And hence it is as far removed from that essence (so that I may use a common expression) as is heaven from earth. That it is not a part of that genus which we were discussing in the second passage, nature itself and reason show with all possible clarity. For if in fact it is essential, as it is, and in that respect of the same kind as the nature of God, certainly its reason will be the same and of the divine essence. But since that divine essence or nature is truly beyond essence and is limited by nothing shared with any other genus whether properly or improperly, that is, simply or by reduction, we claim most properly and certainly that this theology is beyond essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, 105.</span></figcaption>

<blockquote><p>That the observances of the old law are better called signs than sacraments. For those things which were instituted only for the sake of signifying are merely signs, and not sacraments; such were the carnal sacrifices and the ceremonial observances of the Old Law, which could never justify those who offered them. As the Apostle says, “the blood of goats and of oxen, and the ashes of an heifer being sprinkled, sanctified such as are defiled, for the cleansing of the flesh,” [Heb 9:13] ‘not of the soul’ [Glossa Ordinaria] because the defilement arose from contact with the dead.—Augustine. Hence Augustine: ‘By that defilement which the Law cleanses, I understand noting other than contact with a dead person; anyone who touched such a person was unclean for seven days; but according to the Law he was purified on the third and seventh day, and was cleansed,’ so that he might enter the Temple. At times, those legal observances also cleansed ‘from bodily leprosy’; but as the Apostle says, no one was ever justified by the words of the Law, even if they were done in faith and charity. Why? —Ambrose, On the Letter to the Hebrews: ‘Because God imposed them for servitude, not for justification, and that they should be a figure of the future, willing them to be offered to himself rather than to idols.’ —And so they were sings; and Scriptures, because they were signs of a sacred thing, which they certainly did not confer. 4. Which things are called works of the Law. The Apostle calls those things the works of the Law which were instituted only for the sake of signifying, or as a burden.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sentences</cite>, Book 4, dist. 1, ch. 4, §§ 3-4.</span></figcaption>

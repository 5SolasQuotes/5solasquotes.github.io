ks Online</a></div>
</figure><figure class="quote" id="q-14f9d5ee14" data-kw="">
<blockquote><p>Second, by metonymy and metaphor [metaphoram metonymicam], it can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.</p></blockquote>

</figure><figure class="quote" id="q-1f3ebcac39" data-kw="">
<blockquote><p>The holy scripture therefore, designing by revealed religion to maintain and improve natural religion, to repair the decays of it and supply the defects of it, since the fall, for the reviving of the precepts of the law of nature, lays down, at first, this principle of the unclouded light of nature, That this world was, in the beginning of time, created by a Being of infinite wisdom and power, who was himself before all time and all worlds.</p></blockquote>

<blockquote><p>nature; a term having three primary meanings in scholastic theology and in Protestant orthodox usage: (1) essence; (2) a particular kind or species of essence in its actual existence; (3) the entire physical universe and its phenomenon… In the third sense, natura simply refers to the order of nature and is used in such terms as lex naturalis (q.v.), natural law, or theologia naturalis (q.v.), natural theology–the law implicit in the order of the phenomenal world and the knowledge of God obtainable from examination of the physical universe.</p></blockquote>

<blockquote><p>It is very true, that things subordinate are not at variance. There is a natural end. As nature is subordinate to God, so natural ends are subordinate to those which are supernatural and divine. The end of our nature, so far as it is natural, is this, that it should approach very near to the Divine; so far as it is supernatural, it is that man may be united to God.</p></blockquote>

<blockquote><p>The Law of Nature cannot direct us unto a supernatural end, as is acknowledged not only by our divines (Junius, De Politia Mosaica, ch. 1; Paraeus, Commentary on Rom. 1:19), but by Aquinas also (1a, 2a, q. 91, article 4). It only teaches us to seek and to do bonum, velut finem naturae, ‘such a good as is an end proportioned to Nature’ (Junius). All those precepts of the Law of Nature which we have spoken of, could never lead men to a supernatural good (Junius). It is only the Divine Law, revealed from God, which informs the minds of men with such notions as are supra naturam [above nature], and which may guide them ad finem supernaturalem [to a supernatural end].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (1637), pt. 3, ch. 9, ‘That the Lawfulness of the Ceremonies Cannot be Warranted by the Law of Nature’, p. 200</span></figcaption>

<blockquote><p>What is the purpose of human existence? Both Christianity and classical philosophy in the Platonic and Aristotelian traditions answer that our highest end is to know God. But there is, according to Roman Catholic theology, a crucial difference between the knowledge of God that philosophy makes possible, and the kind that Christian revelation promises. Unaided human reason can establish that there exists a divine first cause of the world. It can infer God’s unity, perfect goodness, omnipotence, omniscience, and many other divine attributes. But it cannot afford us a direct (as opposed to merely inferential) knowledge of God’s very essence or nature. For example, it cannot reveal the Trinitarian inner life of God as three divine Persons. The direct apprehension of God’s essence is known as the beatific vision, and Catholic teaching holds that it is not something we are naturally capable of. Attaining it requires grace or supernatural assistance in the sense of special divine action to raise us above or beyond (hence the prefix “super-”) what our nature makes possible. Since it is not an end we are naturally capable of achieving, neither is it an end we are by nature made for. Rather, it is a supernatural end (again, in the sense of above or beyond our nature), to which God has graciously raised us. By nature alone we are aimed only toward an incomplete knowledge of God, such as the kind that philosophy provides. By grace we are directed toward the most intimate knowledge of him that is possible for a created thing. I have left out various nuances and details… On one side [of the 20th century Romanist debate] were Thomist theologians (that is to say, followers of St. Thomas Aquinas) such as Reginald Garrigou-Lagrange (1877–1964), who developed and defended the account just summarized. … …human beings are not, by nature, completely closed off to the beatific vision. They do by nature have what is called an “obediential potency” for it, a built-in capacity to have a supernatural end added to them. But Hart [who is Eastern Orthodox] dismisses this notion as doubletalk. If we really have such a capacity, he says, then this would after all amount to a natural orientation toward the beatific vision; whereas if it would not amount to that, then we are back to the problem that, by raising us to that end, God would be replacing us with some other kind of creature rather than transforming us. The notion of an “obediential potency” is supposed to be a middle ground between these options, but, Hart insists, there is no such middle ground. Yet that Hart is wrong about this is clear even from simple analogies drawn from everyday modern life. Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories (via download, or through USB and HDMI ports and the like)—including, if it is old enough, some that had not even been invented at the time the computer was designed and manufactured. Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them. Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice. Now, like other critics of the Thomist position, Hart insists that an orientation toward the supernatural end of the beatific vision is natural to us. Taken at face value, this is simply incoherent. If an orientation toward a certain end really is natural to us, then it makes no sense to describe it as supernatural (that is to say, beyond our nature). Or, if it really is supernatural, then it makes no sense to describe it as natural. However, in fairness to Hart, I don’t think he is actually guilty of this particular sort of incoherence. In order to be guilty of it, you have to acknowledge that there really is a distinction in reality between the natural order and the supernatural order. Catholic thinkers like de Lubac do acknowledge this, which is why it is difficult for them to formulate a coherent alternative to the Thomist position. But Hart does not acknowledge it. He insists on collapsing the distinctions between natural and supernatural, between nature and grace, and between God’s creating us and his orienting us to the beatific vision. And this is where his position becomes truly radical—indeed, as I have said, pantheistic. To understand how and why Hart goes in the extreme direction he does, it is useful to note that one of the motivations for the Thomist position he rejects is the thesis that the vision of God’s very essence is natural only to God himself, and not to any created thing (as Aquinas says in Question 27, Article 2 of De Veritate). This implies that to attribute to human beings a natural capacity to know God’s very essence would be to identify them with God.</p></blockquote>

indeed+a+middle+ground+of+just+the+sort+Hart+claims+is+impossible.+In+what+Thomists+call+a+state+of+%E2%80%9Cpure+nature%2C%E2%80%9D+human+beings+would+not+have+the+beatific+vision+as+an+end+to+which+they+are+directed%2C+any+more+than+a+computer+is+oriented+toward+running+some+application+that+did+not+even+exist+when+it+was+manufactured.+But+just+as+a+computer+does+nevertheless+have+a+capacity+to+have+such+applications+added+to+it%2C+so+too+are+human+beings+made+in+such+a+way+that+an+orientation+toward+the+beatific+vision+might+be+imparted+to+them.+Hart%E2%80%99s+second+main+objection+is+that+any+rational+creature+would%2C+just+by+virtue+of+being+rational%2C+desire+to+know+the+very+essence+of+the+first+cause+of+all+things%2C+so+that+such+knowledge+would+be+its+natural+end.+There+is+a+sense+in+which+the+premise+is+true%2C+but+the+conclusion+does+not+follow.+To+borrow+an+example+from+the+philosopher+Thomas+Nagel%2C+consider+that+there+is+an+obvious+sense+in+which+a+human+being+might+desire+to+know+what+it+is+like+to+be+a+bat%E2%80%94to+fly+through+the+air+the+way+a+bat+does%2C+to+get+around+via+echolocation%2C+and+so+on.+Yet+there+is+also+an+obvious+sense+in+which+it+is+simply+not+part+of+our+nature+to+do+these+things%2C+so+that+human+beings+can+live+complete+lives+as+the+kind+of+creatures+we+are+without+doing+them.+For+that+reason%2C+our+curiosity+about+what+it+is+like+to+be+a+bat+does+not+entail+a+sense+of+deprivation+or+loss+in+the+way+that%2C+say%2C+a+missing+limb+would.+In+an+analogous+way%2C+had+human+beings+been+created+in+a+state+of+%E2%80%9Cpure+nature%2C%E2%80%9D+without+a+divinely+imparted+orientation+toward+the+supernatural+end+of+the+beatific+vision%2C+they+might+in+a+sense+nevertheless+wish+that+they+could+have+a+direct+knowledge+of+God%E2%80%99s+very+essence.+But+they+would+also+judge+that+this+is+simply+no+more+possible+for+them+than+it+is+possible+for+them+to+know+what+it+is+like+to+be+a+bat%2C+and+thus+they+would+not+feel+this+impossibility+as+a+deprivation+of+something+they+were+by+nature+made+for.+The+indirect+knowledge+of+God+that+they+are+capable+of+would+suffice.+Now%2C+like+other+critics+of+the+Thomist+position%2C+Hart+insists+that+an+orientation+toward+the+supernatural+end+of+the+beatific+vision+is+natural+to+us.+Taken+at+face+value%2C+this+is+simply+incoherent.+If+an+orientation+toward+a+certain+end+really+is+natural+to+us%2C+then+it+makes+no+sense+to+describe+it+as+supernatural+%28that+is+to+say%2C+beyond+our+nature%29.+Or%2C+if+it+really+is+supernatural%2C+then+it+makes+no+sense+to+describe+it+as+natural.+However%2C+in+fairness+to+Hart%2C+I+don%E2%80%99t+think+he+is+actually+guilty+of+this+particular+sort+of+incoherence.+In+order+to+be+guilty+of+it%2C+you+have+to+acknowledge+that+there+really+is+a+distinction+in+reality+between+the+natural+order+and+the+supernatural+order.+Catholic+thinkers+like+de+Lubac+do+acknowledge+this%2C+which+is+why+it+is+difficult+for+them+to+formulate+a+coherent+alternative+to+the+Thomist+position.+But+Hart+does+not+acknowledge+it.+He+insists+on+collapsing+the+distinctions+between+natural+and+supernatural%2C+between+nature+and+grace%2C+and+between+God%E2%80%99s+creating+us+and+his+orienting+us+to+the+beatific+vision.+And+this+is+where+his+position+becomes+truly+radical%E2%80%94indeed%2C+as+I+have+said%2C+pantheistic.+To+understand+how+and+why+Hart+goes+in+the+extreme+direction+he+does%2C+it+is+useful+to+note+that+one+of+the+motivations+for+the+Thomist+position+he+rejects+is+the+thesis+that+the+vision+of+God%E2%80%99s+very+essence+is+natural+only+to+God+himself%2C+and+not+to+any+created+thing+%28as+Aquinas+says+in+Question+27%2C+Article+2+of+De+Veritate%29.+This+implies+that+to+attribute+to+human+beings+a+natural+capacity+to+know+God%E2%80%99s+very+essence+would+be+to+identify+them+with+God.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+%E2%80%98David+Bentley+Hart%E2%80%99s+Post-Christian+Pantheism%E2%80%99%2C+%282022%29+at+Public+Discourse&amp;url=https%3A%2F%2F5solasquotes.github. <blockquote><p>What! is not natural theology the very basis and foundation of revealed? nor without the former can the latter be at all supported. For the instructions we receive from nature want [lack] no further proof, they are in themselves perfectly evident, we are born with them, they are deeply wrought into our frame as rational beings, nor can they be rejected by any, but such as are quite destitute of an intelligent principle; bit revelation, being contained in particular books, must be confirmed by the test of truth, before we can receive it, and it cannot be proved by any principles except such as are derived from the light of nature. For how can I be certain that what God has revealed is credible, unless I have first learned from the light of nature that He is a being of veracity, and therefore cannot possibly deceive me? How can I be sure that this or that revelation derives its origin from the Deity, unless the light of nature has first taught me to know what is worthy and what unworthy of God, and consequently what are the proper characters of a divine revelation? How can I be prevailed with to pay any tribute of adoration to the deity, to discharge certain duties to Him, to cultivate a sense of piety and virtue, unless I have previously learned my duty from the light of nature what I am to understand by an obligation, and the original from which it is derived, and been instructed in the difference betwixt justice and injustice, betwixt piety and impiety? For if justice and injustice are nothing, if virtue is nothing but a word, as it is expressed by the poet, and there is no such thing as a natural obligation, then no revelation can compel me either to avoid or pursue any particular course of action. Wherefore our natural sentiments of things are to be laid down as the principles of all our other knowledge. It is a very just thought of Tertullian that: ‘the Deity has sent nature before as our guide, and afterwards favored us with prophesy, that it might obtain the more easy belief from the person qualified to receive it by the instructions of nature.’ (Of the Resurrection of the Body, ch. 12) But as in recognizing the authority of revelation, so in investigating the sense of it, and settling controversies, we must perpetually have recourse to natural theology. Nor can we possibly give our assent to any thing, as a divine revelation which contradicts the light of nature. Wherefore if any doctrine is attempted to be imposed on us as a revealed truth, which is inconsistent with natural theology, we are on that very account to be absolutely certain that it is an imposture, or at least to try if the passages which seem to contain such a doctrine will bear a construction which will remove the inconsistence, for it is impossible that God can contradict Himself. Thus when the Anthropomorphite asserts that the Deity is possessed of a human form, because the Scripture speaks of his face, his eyes, his ears and arms; natural theology at once convinces us of the delusion, teaching us that God is a being absolutely perfect, and therefore must of consequence be immaterial. … The Scripture itself appeals to these natural perceptions wwe have of the attributes of the supreme Being, and points out to us their great importance and excellence. Thus in the place quoted above from the nineteenth psalm, and in many others of the psalms and prophets, the greatness, wisdom, power and goodness of the Deity are demonstrated from his works. Agreeable to this, Job 12:7-9: ‘But ask now the beasts, and they shall teach thee, and the fowls of the air, and they shall tell thee; or speak to the earth, etc. who knows not that in all these, the hand of the Lord has wrought this?’ In like manner when God complains of the ingratitude and corrupt morals of the people of Israel, as in Isa. 1, 5; Mic. 6 and in a variety of passage of Scripture, He condemns them by appealing to no other principles than the natural perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them. The Scripture declares that the works of nature are an immediate declaration made by God Himself of his parental regard and gracious intentions towards all nations, ‘sending fruitful seasons, and filling their hearts with food and gladness.’ (Acts 14:17) It asserts that the whole of God’s providential care, more especially in those dispensations which respect mankind, is expressed with an immediate view, ‘that men may seek the Lord, if haply they might feel after Him, and find Him’ (Acts 17:25-27) It declares that what may and ought to be known of God is made manifest to all nations; and likewise that ‘the invisible things of God, may be seen from his works, and are placed as it were before our eyes, even his eternal power and godhead;’ and that so great is the brightness of the light of nature, that they who do not give proper attention to it, and glorify God, and praise Him for his goodness, are altogether without excuse; Rom. 1:19-21. It says that these are the riches of his goodness, and forbearance and long suffering, by which God leads us to repentance, Rom. 11:4. It says that our natural sentiments, with respect to the several duties of life, supply the place of a revealed law, ‘that they who have not the law are a law unto themselves, having the work of the law written in their hearts.’ (Rom. 11:14-15) Nor does Christ hesitate to affirm that in the rule which right reason has prescribed to every people, which is, that ‘we should do unto another, what we wish should be done unto ourselves, is contained in the law and the prophets;’ (Mt. 7:12). the strength and excellence of these [Biblical] encomiums on natural revelation cannot be exceeded by anything that can be said on the subject.</p></blockquote>

— Jean-Alphonse Turretin, Dissertations on Natural Theology, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 12-18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat%21+is+not+natural+theology+the+very+basis+and+foundation+of+revealed%3F+nor+without+the+former+can+the+latter+be+at+all+supported.+For+the+instructions+we+receive+from+nature+want+%5Black%5D+no+further+proof%2C+they+are+in+themselves+perfectly+evident%2C+we+are+born+with+them%2C+they+are+deeply+wrought+into+our+frame+as+rational+beings%2C+nor+can+they+be+rejected+by+any%2C+but+such+as+are+quite+destitute+of+an+intelligent+principle%3B+bit+revelation%2C+being+contained+in+particular+books%2C+must+be+confirmed+by+the+test+of+truth%2C+before+we+can+receive+it%2C+and+it+cannot+be+proved+by+any+principles+except+such+as+are+derived+from+the+light+of+nature.+For+how+can+I+be+certain+that+what+God+has+revealed+is+credible%2C+unless+I+have+first+learned+from+the+light+of+nature+that+He+is+a+being+of+veracity%2C+and+therefore+cannot+possibly+deceive+me%3F+How+can+I+be+sure+that+this+or+that+revelation+derives+its+origin+from+the+Deity%2C+unless+the+light+of+nature+has+first+taught+me+to+know+what+is+worthy+and+what+unworthy+of+God%2C+and+consequently+what+are+the+proper+characters+of+a+divine+revelation%3F+How+can+I+be+prevailed+with+to+pay+any+tribute+of+adoration+to+the+deity%2C+to+discharge+certain+duties+to+Him%2C+to+cultivate+a+sense+of+piety+and+virtue%2C+unless+I+have+previously+learned+my+duty+from+the+light+of+nature+what+I+am+to+understand+by+an+obligation%2C+and+the+original+from+which+it+is+derived%2C+and+been+instructed+in+the+difference+betwixt+justice+and+injustice%2C+betwixt+piety+and+impiety%3F+For+if+justice+and+injustice+are+nothing%2C+if+virtue+is+nothing+but+a+word%2C+as+it+is+expressed+by+the+poet%2C+and+there+is+no+such+thing+as+a+natural+obligation%2C+then+no+revelation+can+compel+me+either+to+avoid+or+pursue+any+particular+course+of+action.+Wherefore+our+natural+sentiments+of+things+are+to+be+laid+down+as+the+principles+of+all+our+other+knowledge.+It+is+a+very+just+thought+of+Tertullian+that%3A+%E2%80%98the+Deity+has+sent+nature+before+as+our+guide%2C+and+afterwards+favored+us+with+prophesy%2C+that+it+might+obtain+the+more+easy+belief+from+the+person+qualified+to+receive+it+by+the+instructions+of+nature.%E2%80%99+%28Of+the+Resurrection+of+the+Body%2C+ch.+12%29+But+as+in+recognizing+the+authority+of+revelation%2C+so+in+investigating+the+sense+of+it%2C+and+settling+controversies%2C+we+must+perpetually+have+recourse+to+natural+theology.+Nor+can+we+possibly+give+our+assent+to+any+thing%2C+as+a+divine+revelation+which+contradicts+the+light+of+nature.+Wherefore+if+any+doctrine+is+attempted+to+be+imposed+on+us+as+a+revealed+truth%2C+which+is+inconsistent+with+natural+theology%2C+we+are+on+that+very+account+to+be+absolutely+certain+that+it+is+an+imposture%2C+or+at+least+to+try+if+the+passages+which+seem+to+contain+such+a+doctrine+will+bear+a+construction+which+will+remove+the+inconsistence%2C+for+it+is+impossible+that+God+can+contradict+Himself.+Thus+when+the+Anthropomorphite+asserts+that+the+Deity+is+possessed+of+a+human+form%2C+because+the+Scripture+speaks+of+his+face%2C+his+eyes%2C+his+ears+and+arms%3B+natural+theology+at+once+convinces+us+of+the+delusion%2C+teaching+us+that+God+is+a+being+absolutely+perfect%2C+and+therefore+must+of+consequence+be+immaterial.+%E2%80%A6+The+Scripture+itself+appeals+to+these+natural+perceptions+wwe+have+of+the+attributes+of+the+supreme+Being%2C+and+points+out+to+us+their+great+importance+and+excellence.+Thus+in+the+place+quoted+above+from+the+nineteenth+psalm%2C+and+in+many+others+of+the+psalms+and+prophets%2C+the+greatness%2C+wisdom%2C+power+and+goodness+of+the+Deity+are+demonstrated+from+his+works.+Agreeable+to+this%2C+Job+12%3A7-9%3A+%E2%80%98But+ask+now+the+beasts%2C+and+they+shall+teach+thee%2C+and+the+fowls+of+the+air%2C+and+they+shall+tell+thee%3B+or+speak+to+the+earth%2C+etc.+who+knows+not+that+in+all+these%2C+the+hand+of+the+Lord+has+wrought+this%3F%E2%80%99+In+like+manner+when+God+complains+of+the+ingratitude+and+corrupt+morals+of+the+people+of+Israel%2C+as+in+Isa.+1%2C+5%3B+Mic.+6+and+in+a+variety+of+passage+of+Scripture%2C+He+condemns+them+by+appealing+to+no+other+principles+than+the+natural+perceptions+they+had+of+the+duties+they+owed+to+Him%E2%80%93And+when+Christ+or+his+apostles+endeavor+either+to+prove+the+truth+of+their+doctrine%2C+or+to+refute+those+who+had+fallen+into+mistakes+with+respect+to+it%3B+when+they+either+blame+their+disciples%2C+or+exhort+them+to+the+discharge+of+any+duty%2C+they+continually+have+recourse+to+the+light+of+reason%2C+or+to+natural+principles%E2%80%93%E2%80%98Judge+not+according+to+the+outward+appearance%2C+but+judge+right+judgment%2C%E2%80%99+Jn.+7%3A24.+I+speak+to+those+who+have+understanding%2C+judge+ye+what+I+say%2C%E2%80%99+1+Cor.+10%3A15.+And+on+such+occasions+the+Scripture+not+only+appeals+to+our+natural+sentiments%2C+but+points+out+the+particular+ends+for+which+they+were+implanted+in+us%2C+and+in+what+manner+we+are+to+make+the+best+use+of+them.+The+Scripture+declares+that+the+works+of+nature+are+an+immediate+declaration+made+by+God+Himself+of+his+parental+regard+and+gracious+intentions+towards+all+nations%2C+%E2%80%98sending+fruitful+seasons%2C+and+filling+their+hearts+with+food+and+gladness.%E2%80%99+%28Acts+14%3A17%29+It+asserts+that+the+whole+of+God%E2%80%99s+providential+care%2C+more+especially+in+those+dispensations+which+respect+mankind%2C+is+expressed+with+an+immediate+view%2C+%E2%80%98that+men+may+seek+the+Lord%2C+if+haply+they+might+feel+after+Him%2C+and+find+Him%E2%80%99+%28Acts+17%3A25-27%29+It+declares+that+what+may+and+ought+to+be+known+of+God+is+made+manifest+to+all+nations%3B+and+likewise+that+%E2%80%98the+invisible+things+of+God%2C+may+be+seen+from+his+works%2C+and+are+placed+as+it+were+before+our+eyes%2C+even+his+eternal+power+and+godhead%3B%E2%80%99+and+that+so+great+is+the+brightness+of+the+light+of+nature%2C+that+they+who+do+not+give+proper+attention+to+it%2C+and+glorify+God%2C+and+praise+Him+for+his+goodness%2C+are+altogether+without+excuse%3B+Rom.+1%3A19-21.+It+says+that+these+are+the+riches+of+his+goodness%2C+and+forbearance+and+long+suffering%2C+by+which+God+leads+us+to+repentance%2C+Rom.+11%3A4.+It+says+that+our+natural+sentiments%2C+with+respect+to+the+several+duties+of+life%2C+supply+the+place+of+a+revealed+law%2C+%E2%80%98that+they+who+have+not+the+law+are+a+law+unto+themselves%2C+having+the+work+of+the+law+written+in+their+hearts.%E2%80%99+%28Rom.+11%3A14-15%29+Nor+does+Christ+hesitate+to+affirm+that+in+the+rule+which+right+reason+has+prescribed+to+every+people%2C+which+is%2C+that+%E2%80%98we+should+do+unto+another%2C+what+we+wish+should+be+done+unto+ourselves%2C+is+contained+in+the+law+and+the+prophets%3B%E2%80%99+%28Mt.+7%3A12%29.+the+strength+and+excellence+of+these+%5BBiblical%5D+encomiums+on+natural+revelation+cannot+be+exceeded+by+anything+that+can+be+said+on+the+subject.%E2%80%9D%0A%0A%E2%80%94+Jean-Alphonse+Turretin%2C+Dissertations+on+Natural+Theology%2C+tr.+William+Crawford+%28d.+1737%3B+Belfast%3A+Magee%2C+1777%29%2C+Theses+concerning+Natural+Theology+in+General%2C+pp.+12-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89807cb19b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89807cb19b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-light-of-nature/#:~:text=What%21%20is%20not%20natural%20theology%20the,can%20be%20said%20on%20the%20subject&amp;text=What%21%20is%20not%20natural%20theology%20the%20very%20basis&amp;text=anything%20that%20can%20be%20said%20on%20the%20subject" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…it is impossible for the aforesaid truth of faith to be contrary to those principles which reason knows naturally…. Now, the knowledge of naturally known principles is instilled into us by God, since God himself is the author of our nature. Therefore, the divine wisdom also contains these principles. Consequently, whatever is contrary to these principles is contrary to the divine wisdom. Therefore, it cannot be from God. Therefore, those things which are received by faith from divine revelation cannot be contrary to our natural knowledge… God does not instil into man any opinion or belief contrary to natural knowledge… Yet, because it [the word of faith] surpasses reason, some look upon it as though it were contrary to reason; which is impossible.</p></blockquote>

<blockquote><p>Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to</cite>, 12. ‘Gradation of Principles &amp; Practices’ in ‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to [Edward] Feser’ (RBO, 2025)</span></figcaption>

</figure><figure class="quote" id="q-de69b506c5" data-kw="">
<blockquote><p>Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectarum Disputationum Theologicarum Pars Prima</cite>, (Utrecht: Apud Joannem Waesberge, 1658), pp. 3-4 &amp; 7 as quoted in Johannes Hoornbeeck, ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors (1658) tr. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

econdarily&amp;text=Therefore%2C%20our%20doctrine%20is%20that%20in%20elenctic%20theology&amp;text=and%20also%20from%20the%20light%20of%20nature%20secondarily" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cb2eaf7123" data-kw="">
<blockquote><p>When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism</cite>, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.”

— Gisbertus Voetius, Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+we+demand+the+use+of+reason+and+logic%2C+we+no+more+turn+them+into+the+foundations%2C+principles%2C+and+rules+of+faith+than+we+do+our+eyes%2C+ears%2C+and+tongues+without+which+we+can+neither+learn+nor+teach+our+religion%2C+nor+defend+it+against+opponents.+For+us+they+are%2C+therefore%2C+means+and+requirements+without+which+there+is+no+faith+or+theological+knowledge%2C+but+they+are+certainly+not+principles%2C+norms%2C+rules%2C+and+foundations.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Appendix+2%2C+%E2%80%98The+Use+of+Reason+In+Matters+of+Faith%E2%80%99+in+Introduction+to+Reformed+Scholasticism%2C+ed.+Joel+R.+Beeke+%26+Jay+T.+Collier%2C+trans.+Albert+Gootjes+%28Reformation+Heritage+Books%2C+2011%29%2C+p.+12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb2eaf7123.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb2eaf7123.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-use-of-reason-in-theology/#:~:text=When%20we%20demand%20the%20use%20of,not%20principles%2C%20norms%2C%20rules%2C%20and%20foundations&amp;text=When%20we%20demand%20the%20use%20of%20reason%20and&amp;text=are%20certainly%20not%20principles%2C%20norms%2C%20rules%2C%20and%20foundations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0fd57e2451" data-kw="">
<blockquote><p>Having noted these presuppositions, we now say that no human reason can be the principle by which or through which, or else on the ground of which or why we believe, or the foundation, law, or norm for what must be believed, under whose direction we are to judge.</p></blockquote>

<blockquote><p>13. Reason is employed on both sides, as an instrument, not a judge or norm. So that neither are they to be listened to who defer to it more than is fair in theological matters, and demand the things of faith from its scales, who are the Socinians; nor those who pointlessly begrudge its use in theological argumentation and forming consequences, which the Verronian Papists do, and some Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors</cite>, (1658) tr. Charles Johnson</span></figcaption>

<blockquote><p>Theology is not only intelligible and meaningful, but also discursive. For it employs many arguments for the convincing of opponents, and from its principles, prior, and indemonstrable in themselves, it either draws out conclusions for proving the truth, or solutions for refuting the fallacious objections of sophists. Mt. 22:32-33; 1 Cor. 15:20-22.</p></blockquote>

</figure><figure class="quote" id="q-ebb8e21ffd" data-kw="">
<blockquote><p>14. What is the legitimate office of reason in the sphere of religion? 1st. Reason is the primary revelation God has made to man, necessarily presupposed in every subsequent revelation of whatever kind. 2d. Hence Reason, including the moral and emotional nature, and experience, must be the organ by means of which alone all subsequent revelations can be apprehended and received. A revelation addressed to the irrational would be as inconsequent as light to the blind. This is the usus organicus [organic use] of reason. 3d. Hence no subsequent revelation can contradict reason acting legitimately within its own sphere. For then (1) God would contradict Himself, and (2) faith would be impossible. To believe is to assent to a thing as true, but to see that it contradicts reason, is to see that it is not true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology 2nd ed., enlarged</cite>, (Bible Institute Colportage Association, 1878), ch. 3, ‘The Sources of Theology’, p. 62</span></figcaption>

</figure><figure class="quote" id="q-0edcc5e7a1" data-kw="">
<blockquote><p>It was a common practise amongst the young students of our universities in the time of the Dunses [after John Duns Scotus] (and is yet amongst too many, whom spots of Dunsery have stained), that if in disputation they were brought to an inconvenience, were it never so absurd, they would haue a distinction, though void of brain and sense, yet a distinction to maintain it. If a man will be perverse, it is no mastery to do it. But as a wise and learned man does say of them, that they are base wits which are so affected, whereas ingenuous minds and natures well-given will rather seek how true that is which they hold than how they may defend it, making greater price of verity than victory: so I may say (yea much more in matters of religion, of faith, of life eternal) a Christian wit and godly mind will search and weigh rather what should be said truly than what may be said probably or colourably at the least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds &amp; John Hart touching the Head &amp; the Faith of the Church</cite>, … (London: Bishop, 1584), p. 44</span></figcaption>

<blockquote><p>VI. Many abuses can also be reckoned up: … (3) When philosophy assumes to itself the office of a master, in articles of faith, not content with that of a servant (as was done by the [Medieval, Romanist] Scholastics who places Aristotle upon the throne; and by the Socinians who would not admit the doctrines of the Trinity, of the incarnation, etc. because they did not seem to be in accordance with the principles of philosophy). (4) When more new distinctions and phrases than necessary are introduced from philosophy into theology under which (oftentimes) new and dangerous errors lie concealed.</p></blockquote>

</figure><figure class="quote" id="q-e4ffb2adec" data-kw="">
<blockquote><p>6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology. 7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).</p></blockquote>

</figure><figure class="quote" id="q-33dc49d682" data-kw="">
<blockquote><p>…it’s possible to articulate Christian doctrine without formally invoking concepts like “essence,” “substance” and so on. Instead of saying, for example, that in the incarnation there is one hypostasis subsisting in two distinct natures, one can say that there is just Jesus and not someone else and that Jesus always remains both truly God and truly human. However, the fact that the use of the metaphysical language is not absolutely necessary does not mean that the metaphysical resources in question are detached from reality. It does not mean that what they offer us is just a set of coherent rules for saying things – rules that we might either take or leave. On the contrary, the classical metaphysical tradition developed by Christian thinkers like John of Damascus, Thomas Aquinas or the early Reformed theologians and philosophers involves a knowledge of how things are. Indeed, it is fundamentally an exposition of things human beings know to be true prior to engaging in any formal academic work. For example, things do have natures by virtue of which they are similar to other things. There really are substances in which accidents inhere… As we seek ways to express what God is like according to scriptural teaching, we should look to this philosophical tradition, not Kant or Hegel, because it sheds light on reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/steven-j-duby.html">Steven J. Duby</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘In Defense of Christian Philosophy: A Response to Peter Leithart’</cite>, (2018) 22 paragraphs</span></figcaption>

<blockquote><p>Though Christian dogma cannot be explained in terms of Greek philosophy, it also did not come into being apart from it. There is as yet no dogma and theology, strictly speaking, in Scripture. As long as revelation itself was still in progress, it could not become the object of scientific reflection. Inspiration had to be complete before reflection could begin. To speak of “Mosaic”, “Pauline”, or the “Bible’s” theology and dogmatics therefore, is not advisable; the word theology, for that matter, does not occur in Scripture and has only gradually acquired its present meaning. Theology first arose in the Christian community after the naïveté of childhood lay behind it and the adult thinking mind had awakened. Gradually a need arose to think through the ideas of revelation, to link it with other knowledge and to defend it against various forms of attack. For this purpose people needed philosophy. Scientific theology was born with its help. This did not, however, happen accidentally. The church was not the victim of deception. In the formation and development of the dogmas, the church fathers made generous use of philosophy. They did that, however, in the full awareness of and with clear insight into the dangers connected with that enterprise; they were conscious of the grounds on which they did it with express recognition of the word of the apostles as the only rule of faith and conduct. For that reason also they did not utilize the whole of Greek philosophy but made a choice; they only utilized the philosophy that was most suited to help them think through and defend the truth of God. They went to work eclectically and did not take over any single philosophical system, be it either from Plato or from Aristotle, but with the aid of Greek philosophy produced a Christian philosophy of their own. Furthermore, they only used that philosophy as a means. Just as Hagar was the servant of Sarah, as the treasures of Egypt were employed by the Israelites for the adornment of the tabernacle, as the wise men from the East placed their gifts at the feed of the child in Bethlehem, so, in the opinion of the church fathers, philosophy was the servant of theology. From everything it is clearly evident that the use of philosophy in theology was based, not on a mistake, but on firm and clear conviction. The church fathers knew what they were doing. Mind you, this does not rule out the possibility that at some points the influence of philosophy was too strong. But in that connection we must make a distinction between the theology of the fathers and the dogmas of the church. The church was at all times alert against the misuse of philosophy; it not only rejected Gnosticism but also condemned Origenism. And up until now no one has succeeded in explaining the dogmas materially in terms of philosophy; however often this has been attempted, in the end the scriptural character of orthodoxy has been vindicated. Initially the Reformation assumed a hostile posture toward scholasticism and philosophy. But it soon changed its mind. Because it was not, nor wanted to be, a sect, it could not do without theology. Even Luther and Melanchton, therefore, already resumed the use of philosophy and recognized its usefulness. Calvin assumed this high position from the start, saw in philosophy an “outstanding gift of God”, and was followed in this assessment by all Reformed theologians. The question here is not whether theology should make use of a specific philosophical system. Christian theology has never taken over any philosophical system without criticism and given it the stamp of approval. Neither Plato’s nor Aristotle’s philosophy has been held to be the true one by any theologian. That theologians nevertheless preferred these two philosophical systems was due to the fact that these systems best lent themselves to the development and defense of the truth. Present also was the idea that the Greeks and Romans had been accorded a special calling and gift for the life of culture. Still to this day, in fact, our whole civilization is built upon that of Greece and Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Baker), vol. 1, p. 607</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Though Christian dogma cannot be explained in terms of Greek philosophy, it also did not come into being apart from it. There is as yet no dogma and theology, strictly speaking, in Scripture. As long as revelation itself was still in progress, it could not become the object of scientific reflection. Inspiration had to be complete before reflection could begin. To speak of “Mosaic”, “Pauline”, or the “Bible’s” theology and dogmatics therefore, is not advisable; the word theology, for that matter, does not occur in Scripture and has only gradually acquired its present meaning. Theology first arose in the Christian community after the naïveté of childhood lay behind it and the adult thinking mind had awakened. Gradually a need arose to think through the ideas of revelation, to link it with other knowledge and to defend it against various forms of attack. For this purpose people needed philosophy. Scientific theology was born with its help. This did not, however, happen accidentally. The church was not the victim of deception. In the formation and development of the dogmas, the church fathers made generous use of philosophy. They did that, however, in the full awareness of and with clear insight into the dangers connected with that enterprise; they were conscious of the grounds on which they did it with express recognition of the word of the apostles as the only rule of faith and conduct. For that reason also they did not utilize the whole of Greek philosophy but made a choice; they only utilized the philosophy that was most suited to help them think through and defend the truth of God. They went to work eclectically and did not take over any single philosophical system, be it either from Plato or from Aristotle, but with the aid of Greek philosophy produced a Christian philosophy of their own. Furthermore, they only used that philosophy as a means. Just as Hagar was the servant of Sarah, as the treasures of Egypt were employed by the Israelites for the adornment of the tabernacle, as the wise men from the East placed their gifts at the feed of the child in Bethlehem, so, in the opinion of the church fathers, philosophy was the servant of theology. From everything it is clearly evident that the use of philosophy in theology was based, not on a mistake, but on firm and clear conviction. The church fathers knew what they were doing. Mind you, this does not rule out the possibility that at some points the influence of philosophy was too strong. But in that connection we must make a distinction between the theology of the fathers and the dogmas of the church. The church was at all times alert against the misuse of philosophy; it not only rejected Gnosticism but also condemned Origenism. And up until now no one has succeeded in explaining the dogmas materially in terms of philosophy; however often this has been attempted, in the end the scriptural character of orthodoxy has been vindicated. Initially the Reformation assumed a hostile posture toward scholasticism and philosophy. But it soon changed its mind. Because it was not, nor wanted to be, a sect, it could not do without theology. Even Luther and Melanchton, therefore, already resumed the use of philosophy and recognized its usefulness. Calvin assumed this high position from the start, saw in philosophy an “outstanding gift of God”, and was followed in this assessment by all Reformed theologians. The question here is not whether theology should make use of a specific philosophical system. Christian theology has never taken over any philosophical system without criticism and given it the stamp of approval. Neither Plato’s nor Aristotle’s philosophy has been held to be the true one by any theologian. That theologians nevertheless preferred these two philosophical systems was due to the fact that these systems best lent themselves to the development and defense of the truth. Present also was the idea that the Greeks and Romans had been accorded a special calling and gift for the life of culture. Still to this day, in fact, our whole civilization is built upon that of Greece and Rome.”

C+but+with+the+aid+of+Greek+philosophy+produced+a+Christian+philosophy+of+their+own.+Furthermore%2C+they+only+used+that+philosophy+as+a+means.+Just+as+Hagar+was+the+servant+of+Sarah%2C+as+the+treasures+of+Egypt+were+employed+by+the+Israelites+for+the+adornment+of+the+tabernacle%2C+as+the+wise+men+from+the+East+placed+their+gifts+at+the+feed+of+the+child+in+Bethlehem%2C+so%2C+in+the+opinion+of+the+church+fathers%2C+philosophy+was+the+servant+of+theology.+From+everything+it+is+clearly+evident+that+the+use+of+philosophy+in+theology+was+based%2C+not+on+a+mistake%2C+but+on+firm+and+clear+conviction.+The+church+fathers+knew+what+they+were+doing.+Mind+you%2C+this+does+not+rule+out+the+possibility+that+at+some+points+the+influence+of+philosophy+was+too+strong.+But+in+that+connection+we+must+make+a+distinction+between+the+theology+of+the+fathers+and+the+dogmas+of+the+church.+The+church+was+at+all+times+alert+against+the+misuse+of+philosophy%3B+it+not+only+rejected+Gnosticism+but+also+condemned+Origenism.+And+up+until+now+no+one+has+succeeded+in+explaining+the+dogmas+materially+in+terms+of+philosophy%3B+however+often+this+has+been+attempted%2C+in+the+end+the+scriptural+character+of+orthodoxy+has+been+vindicated.+Initially+the+Reformation+assumed+a+hostile+posture+toward+scholasticism+and+philosophy.+But+it+soon+changed+its+mind.+Because+it+was+not%2C+nor+wanted+to+be%2C+a+sect%2C+it+could+not+do+without+theology.+Even+Luther+and+Melanchton%2C+therefore%2C+already+resumed+the+use+of+philosophy+and+recognized+its+usefulness.+Calvin+assumed+this+high+position+from+the+start%2C+saw+in+philosophy+an+%E2%80%9Coutstanding+gift+of+God%E2%80%9D%2C+and+was+followed+in+this+assessment+by+all+Reformed+theologians.+The+question+here+is+not+whether+theology+should+make+use+of+a+specific+philosophical+system.+Christian+theology+has+never+taken+over+any+philosophical+system+without+criticism+and+given+it+the+stamp+of+approval.+Neither+Plato%E2%80%99s+nor+Aristotle%E2%80%99s+philosophy+has+be </figure><figure class="quote" id="q-44699d3c2e" data-kw="">
<blockquote><p>15. What is philosophy, and what is its relation to theology ? Philosophy, in its wide sense, embraces all human knowledge, acquired through the use of man’s natural faculties, and consists of that knowledge interpreted and systematized by the reason. Science is more specific, relating to some special department of knowledge thoroughly reduced to system… Philosophy is presupposed, therefore, in science as the first and most general knowledge. It inquires into the soul and the laws of thought, into intuition and ultimate truth, into substance and real being, into absolute cause, the ultimate nature of force and will, into conscience and duty. As to its relations to theology it will be observed — 1st. The first principles of a true philosophy are presupposed in all theology, natural and revealed. 2d. The Holy Scriptures, although not designed primarily to teach philosophy, yet necessarily presuppose and involve the fundamental principles of a true philosophy. Not the inferences of these principles drawn out into a system, but the principles themselves, as to substance and cause, as to conscience and right, etc. … 4th. The devout believer, however, who is assured that the Bible is the very word of God, can never allow his philosophy, derived from human sources, to dominate his interpretation of the Bible, but will seek with a docile spirit and with the assistance of the Holy Spirit, to bring his own philosophy into perfect harmony with that which is implicitly contained in the Word. He will, by all means, seek to realize a philosophy which proves itself to be the genuine and natural handmaid of the religion which the Word reveals.</p></blockquote>

<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>

/a></div>
</figure><figure class="quote" id="q-595686e025" data-kw="">
<blockquote><p>Certainly [James] Arminius… saw that… the novel Pseudo-philosophy of the Jesuits was being confounded with true metaphysics and the Thomistic Scholastics… His disciples—when they perceived that the little pseudo-philosophical reasonings, by which at the beginning, and almost alone, they had assailed the received truth, were no longer a terror but a derision, and that their own theology daily grew worse—began strenuously to declaim against the philosophy of the schools, especially the metaphysical… Solid ratiocinations they call Scholastic subtleties: by this name they pretext their fault. … But [the Arminian] Vorstius, in his writings… in place of the philosophy of Aristotle and of the Scholastics—rightly emended in the reformed schools and accommodated to the truth of religion—substitutes the metaphysics of Taurellus, conjoined with the declamations of Ramus (which they call schools), with Bodin’s Theater [of Nature] from time to time employed… Let now the metaphysics and Triumphus of Taurellus be compared, with some things of Bodin added, and the declamations of Ramus, and let it be judged whether by their help the Atheistic, Epicurean, Ethnic [pagan], Judaic, Muhammadan, Enthusiastico-Libertine, Vorstian, Socinian, etc. [errors] can better be refuted than out of Thomas and the other Scholastics, and the more recent disciples of these, Suárez, Fonseca, etc. Certainly of these it may be said what was once said of Origen: where good, none better; where bad, none worse. When they are not hindered by the prejudices and authority of the corrupted religion and church of their own [communion], they render truly useful service (certain errors, and things too curious, excepted)—e.g. in the defense of the Trinity, of the divine attributes, of Christ the θεάνθρωπος [God-man], of the creation of the world, of the resurrection, of the general theses concerning the end of man, concerning the affections, faculties, etc. Hence it is that our most excellent theologians not unwillingly plow with their heifer [i.e. make use of them]—e.g. Martyr, Zanchi, Danaeus, Franciscus Junius, Ferrius, Molinaeus, Perkins, Twisse, Rutherford, etc. And the [Protestant] philosophers have, in emulation, out of the same—and chiefly out of Suárez, among the more recent—composed their own metaphysics: e.g. Cornelius Martinius, Jacobus Martinius, Combachius, Werenbergius, Scheibler, Jachaeus, Rutgersius, Burgersdicius, Senguerdius, etc. But the virtues and vices of Scholastic Theology we have explained ex professo [expressly, professedly] in the disputation On Scholastic Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>

<blockquote><p>Reason cannot and ought not to bring forth any mysteries, as it were, out of its own storehouse; for this is the prerogative of scripture only. Also, that reason is not to be heard when complaining of its incapacity to comprehend the mysteries of faith: for, being finite, it is no wonder that reason should not comprehend many things that relate to what is infinite; and to reject a mystery because it is incomprehensible to reason, is to offend against reason itself. Neither is reason to be listened to whenever, under cover of holding the mysteries of faith, it aims at setting up its own errors. On the very same grounds we can not call philosophy any rule of faith, although we again concede that it is of no little use, provided it assume not to itself the power of dictating in articles of faith. True philosophy indeed serves very much both to convince men and to prepare their minds; and there is a wonderful harmony between sound philosophy and divinity: for truth is not contrary to truth, nor light to light; only we must not imagine that the former is the rule by which the sense of scripture must be tried and examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, p. 54</span></figcaption>

<blockquote><p>Medieval theology received from the church fathers a great body of highly detailed doctrine, but virtually nothing that could be called a system [of] theology and, certainly, no theological prolegomena. The received body of patristic teaching was clarified and systematized… to the point that, toward the close of the twelfth century… [they] were able to draw doctrine together into collections of theological statements and definitions, the sententiae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, Ch. 2, sections 1-2, pp. 85-96 of Post-Reformation Reformed Dogmatics, vol. 1, 2nd ed. (Baker, 2003), p. 85</span></figcaption>

<blockquote><p>It is designed primarily for the intelligent reader rather than for the scholar. In the process of popularization much had to be diluted, ommitted or condensed. In many areas the presentation is very sketchy, though, I hope, authentic and accurate.</p></blockquote>

</figure><figure class="quote" id="q-2ad5ec154a" data-kw="">
<blockquote><p>The Masoretes… mentioned even what they regarded as unusual accents, vowel points, and spelling. They recorded a number of variant readings — on the average of about one to a page of a printed Hebrew Old Testament— and they made reference to eighteen corrections attributed to the scribes before them… Their high regard for the text that had come down to them is evidenced by their placing in the margin readings which they believed to be correct and leaving the text itself unaltered… The view of P. de Lagarde that after A.D. 130 all manuscripts of the Hebrew Bible were closely fashioned after one archetype which had been decided on not long before that date has not been accepted by all; but it is at least the case that a type of text basically that of the Masoretes existed around A.D. 100 and that this text subsequently overcame whatever competitors it had…. Dr. [William H.] Green calls attention to the fact that Origen and Jerome place on translators or transcribers of the Septuagint the responsibility for the variations of the Septuagint from the Hebrew text known to them and do not entertain any belief that the Hebrew text had been altered. Pfeiffer expresses the opinion that Origen was misled by reason of a virtual fixation of the Hebrew text which had occurred [after the Septuagint but] before his time and by reason of the notable agreement among the available Hebrew manuscripts. But it is nevertheless important to observe that neither Origen nor Jerome nor any other early writer evidences any suspicion that a real revision or a fixation of the Hebrew text had occurred after the time of the Septuagint. Dr. Green does not deny the possibility that the Septuagint may have been made from a Hebrew text considerably, if not substantially, different from the text in use in Origen’s day. He thinks it quite possible that there may have been some inferior manuscripts of the Old Testament in use, especially among Jews outside of Palestine; but he holds that, even if this were the case, it would not follow that no authoritative text then existed and that there were no standard copies from which the traditional text has descended. He states a truth quite important in this connection that ‘reverence for the Scriptures and regard for the purity of the sacred text did not first originate after the fall of Jerusalem.’ …the counting of the letters, words, verses, and sections in all the books, the noting of the location of the middle letters and words of every book, and the marking of them at times by a letter of abnormal size. He [William Green] remarks that the Talmud regards all this as old and as performed by the early scribes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-h-skilton.html">John H. Skilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Transmission of the Hebrew Text’ from ‘The Transmission of the Scriptures’ in eds. N.B. Stonehouse &amp; Paul Woolley, The Infallible Word: A Symposium by the Members of the Faculty of Westminster Theological Seminary, rev</cite>, ‘The Transmission of the Hebrew Text’ from ‘The Transmission of the Scriptures’ in eds. N.B. Stonehouse &amp; Paul Woolley, The Infallible Word: A Symposium by the Members of the Faculty of Westminster Theological Seminary, rev. ed. (Philadelphia: Presbyterian &amp; Reformed, 1967) at Bible-Researcher</span></figcaption>

delphia%3A+Presbyterian+%26+Reformed%2C+1967%29+at+Bible-Researcher&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ad5ec154a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ad5ec154a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/textual-criticism-of-the-old-testament/#:~:text=mentioned%20even%20what%20they%20regarded%20as,as%20performed%20by%20the%20early%20scribes&amp;text=mentioned%20even%20what%20they%20regarded%20as%20unusual%20accents&amp;text=old%20and%20as%20performed%20by%20the%20early%20scribes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d1d7a46bae" data-kw="">
<blockquote><p>Section 14. It is no doubt but that in the copies we now enjoy of the Old Testament there are some diverse readings, or various lections… the various lections of Ben-Asher or Rabbi Aaron the son of Rabbi Moses of the tribe of Asher, and Ben Nepthali, or R: Moses the son of David of the tribe of Nepthali; of the East and Western Jews, which we have collected at the end of the great Bible with the Masora, evince it. But yet we affirm that the whole Word of God, in every letter and tittle, as given from Him by inspiration, is preserved without corruption. Where there is any variety it is always in things of less, indeed of no importance. God by his providence preserving the whole entire, suffered this lesser variety to fall out, in or among the copies we have, for the quickening and exercising of our diligence in our search into his Word.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Section 14. It is no doubt but that in the copies we now enjoy of the Old Testament there are some diverse readings, or various lections… the various lections of Ben-Asher or Rabbi Aaron the son of Rabbi Moses of the tribe of Asher, and Ben Nepthali, or R: Moses the son of David of the tribe of Nepthali; of the East and Western Jews, which we have collected at the end of the great Bible with the Masora, evince it. But yet we affirm that the whole Word of God, in every letter and tittle, as given from Him by inspiration, is preserved without corruption. Where there is any variety it is always in things of less, indeed of no importance. God by his providence preserving the whole entire, suffered this lesser variety to fall out, in or among the copies we have, for the quickening and exercising of our diligence in our search into his Word.”

— John Owen, Other citations (work not named), Of the Divine Original, with the Authority, Self-Evidencing Power &amp; Light of the Holy Scriptures, ch. 1 in Of the Divine Original, Authority, Self-Evidencing Light &amp; Power of the Scriptures. With an Answer to that Enquiry… (Oxford: Hall, 1659), pp. 13-14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSection+14.+It+is+no+doubt+but+that+in+the+copies+we+now+enjoy+of+the+Old+Testament+there+are+some+diverse+readings%2C+or+various+lections%E2%80%A6+the+various+lections+of+Ben-Asher+or+Rabbi+Aaron+the+son+of+Rabbi+Moses+of+the+tribe+of+Asher%2C+and+Ben+Nepthali%2C+or+R%3A+Moses+the+son+of+David+of+the+tribe+of+Nepthali%3B+of+the+East+and+Western+Jews%2C+which+we+have+collected+at+the+end+of+the+great+Bible+with+the+Masora%2C+evince+it.+But+yet+we+affirm+that+the+whole+Word+of+God%2C+in+every+letter+and+tittle%2C+as+given+from+Him+by+inspiration%2C+is+preserved+without+corruption.+Where+there+is+any+variety+it+is+always+in+things+of+less%2C+indeed+of+no+importance.+God+by+his+providence+preserving+the+whole+entire%2C+suffered+this+lesser+variety+to+fall+out%2C+in+or+among+the+copies+we+have%2C+for+the+quickening+and+exercising+of+our+diligence+in+our+search+into+his+Word.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Other+citations+%28work+not+named%29%2C+Of+the+Divine+Original%2C+with+the+Authority%2C+Self-Evidencing+Power+%26+Light+of+the+Holy+Scriptures%2C+ch.+1+in+Of+the+Divine+Original%2C+Authority%2C+Self-Evidencing+Light+%26+Power+of+the+Scriptures.+With+an+Answer+to+that+Enquiry%E2%80%A6+%28Oxford%3A+Hall%2C+1659%29%2C+pp.+13-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd1d7a46bae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d1d7a46bae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/textual-criticism-of-the-old-testament/#:~:text=Section%2014.%20It%20is%20no%20doubt,in%20our%20search%20into%20his%20 </figure><figure class="quote" id="q-180a0bc941" data-kw="">
<blockquote><p>It would be tedious now to enumerate, what great additions and omissions the Septuagint has made, and all the passages which in church-copies are marked with daggers and asterisks. The Jews generally laugh when they hear our version of this passage of Isaiah, ‘Blessed is he that has seed in Zion and servants in Jerusalem.’ In Amos also after a description of self-indulgence Amos 6:4-6 there come these words: ‘They have thought of these things as halting and not likely to fly,’ a very rhetorical sentence quite worthy of Tully. But how shall we deal with the Hebrew originals in which these passages and others like them are omitted, passages so numerous that to reproduce them all would require books without number? The number of the omissions is shown alike by the asterisks mentioned above and by my own version when compared by a careful reader with the old translation. Yet the Septuagint has rightly kept its place in the churches, either because it is the first of all the versions in time, made before the coming of Christ, or else because it has been used by the apostles (only however in places where it does not disagree with the Hebrew).</p></blockquote>

target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-281f1ebbf1" data-kw="">
<blockquote><p>From this discrepancy between the Hebrew [Jews’] books [i.e. the Septuagint] and our own arises the well-known question as to the age of Methuselah; for it is computed that he lived for fourteen years after the deluge, though Scripture relates that of all who were then upon the earth only the eight souls in the ark escaped destruction by the flood, and of these Methuselah was not one… …that they may not cast a slight on the trustworthiness of versions which the Church has received into a position of high authority, and because they believe that the Jewish manuscripts rather than our own are in error. For they do not admit that this is a mistake of the [Septuagint] translators, but maintain that there is a falsified statement in the original, from which, through the Greek, the Scripture has been translated into our own tongue. They say that it is not credible that the seventy translators, who simultaneously and unanimously produced one rendering, could have erred, or, in a case in which no interest of theirs was involved, could have falsified their translation; but that the Jews, envying us our translation of their Law and Prophets, have made alterations in their texts so as to undermine the authority of ours. This opinion or suspicion let each man adopt according to his own judgment. Certain it is that Methuselah did not survive the flood, but died in the very year it occurred, if the numbers given in the Hebrew manuscripts are true. My own opinion regarding the seventy translators I will, with God’s help, state more carefully in its own place, when I have come down (following the order which this work requires) to that period in which their translation was executed.</p></blockquote>

</figure><figure class="quote" id="q-302bbb00a4" data-kw="">
<blockquote><p>The Greek interpreter has translated this place more unfitly, using for ‘burnt offerings’, the general word ‘sacrifice’: somewhat also he leaves out, as namely that particle ‘all’ and he adds many things of his own; all which Jerome has rightly amended according to the truth of the Hebrew text. Now seeing the Greek translations are in diverse places faulty, and seeing that in all things we must follow the Hebrew, hereafter we will not much trouble ourselves about the Greek, unless peradventure we shall find anything worth the observation. God be thanked that in these days he has restored the knowledge of the Hebrew tongue, through ignorance whereof those that are unskillful will hardly believe how, often and how greatly the most learned Greek interpreters have erred in the true exposition of all the sacred books of the Old Testament, and especially of this; as also very many of the Latin interpreters, after Jerome’s emendations, but I return to the matter. For these things I touch in a manner against my will, which nevertheless I would have diligently to be marked of those, who bend themselves to the study of divinity, seeing it has pleased God in this age to make the Hebrew tongue so familiar unto us, lest with the Fathers in many places they err from the true and natural sense of the Scriptures; yet we must always that reverence which is due to men of such learning and antiquity.</p></blockquote>

<blockquote><p>Did you know that the first editions of the Belgic Confession included two proof-texts from the apocrypha? Did you know that our contemporary editions continue to include one small quote from the apocrypha? Elsewhere in his writings, Guido de Brès referred more often to these non-canonical writings. Moreover, de Brès was not exceptional in doing this. Other Reformers did likewise, and so did other Reformed confessions. In this paper, I outline de Brès’ use of the apocrypha, put it in the historical context of the Reformation, and attempt to explain it.</p></blockquote>

<blockquote><p>7. That Word of God was first ἄγραφον [unwritten], afterward ἔγγραφον [enscripturated], materially the same in both cases, even if not formally; [it was the same] intensively, even if not extensively. 8. It alone today is the rule of things to be believed and done, and therefore adequate to its regulated object. 9. As it has its authority comparatively from itself, so also it has it in itself, and although it can be persuaded to us through other means, yet it cannot be persuaded except through that very light which it has in itself, just as also the sun can be seen only by its own light. 10. The authority of the Church, whatever it may be, can be here εἰσαγωγική [introductory] and διηγητική [expository], but cannot be αὐθεντική [self-authorizing] or αὐτοπιστική [self-credentialing]; for although the Holy Spirit uses both the intrinsic light of Scripture and the extrinsic light of the Church in impressing faith concerning Scripture upon us, yet the former is the primary medium and motive, the latter only secondary. 11. The Church can use unwritten traditions whether public of councils or private of fathers, but ought not to rely upon them. And traditions subalternate to Scripture must always be distinguished from those opposed to it; the former to be admitted, the latter to be rejected. 12. All dogmatic traditions of the Roman Church fabricated outside God’s word are opposed to God’s word, ritual ones for the greatest part of them. 13. Neither the constitution of the [Biblical] canon nor the interpretation of the constituted canon ultimately rests on the authority of the Church. 14. The αὐτοκρατορικός [absolute ruler], judge of controversies, is the one Spirit of God, the κανονικός [normative] judge is sacred Scripture, the ὀργανικός [instrumental] or λειτουργικός [ministerial] judge is the Church, but the one which is true, not the one which merely professes itself to be true. 15. But Scripture is a real Judge, not personal, whence vain are the argumentations which are drawn against the real judge from the characteristics of a personal judge.</p></blockquote>

<blockquote><p>5. We accept, secondly, on the topic of a rule: I. That the rule or measure of a thing must be marked &amp; easy. Suarez, Metaphysics, pt. 2, distinction II, section 3, because it must be accommodated to the knowledge of a thing. Therefore, since the Scripture is a rule, it is not obscure and difficult, as the Papists will. II. A rule has a parity of proportion to that thing that it is the rule of. If, therefore, the Scripture is the rule of faith, faith does not extend beyond the Scripture: and therefore, unwritten traditions do not at all pertain to faith. III. A rule that is such by its nature has in itself the reason of its exemplary cause, and is therefore prior by nature to the thing it regulates. If, therefore, the Scripture is the rule of faith, it is indeed prior to faith: if it is prior to faith, then also to the faithful; and if to the faithful, then to the church, which is the congregation of the faithful, and so it is that the Roman church banishes it from that superior place in which it tends to set its own self with some nefarious presumption, as if it were ahead of and above the Scripture. IV. A rule consists in something indivisible; that is, so constituted that the least bit is neither increased or diminished. They therefore violate the Scriptures who join to them their own traditions or abolish anything whatsoever prescribed by them: and the Roman Pontiffs are manifestly possessed of both these evils. V. If Scripture is the rule of faith, then those who can err in the exposition of Scripture can indeed err in faith, and commend a false rule of faith to others. That, however, the Pope and the Roman church interpret many parts of Scripture insipidly and impiously is so manifest that it need not be proven. Therefore, the Roman Pontiff may shamefully err in his decrees, even concerning faith and morals. VI. Since such is the nature of this rule, that it be a precept, anything admitted without the direction of this rule, of what species soever it otherwise be, is anomalous, and an aberration: and therefore, as much the supererogations of the Papists as their many dogmas (concerning the worship of images and creatures, purgatory, the mass itself, and the Roman Pontiff) must be acknowledged to necessarily be mere error. VII. Since the Scripture is not indeed a single precept, but a system of precepts respecting the same thing (namely, that we live well to God), it is necessary that it contain within itself the whole doctrine of theology: therefore, what thing sover the Roman Pontiff obtrudes without Scripture must be alien to true theology. VIII. Finally, since it is the rule of faith, they must be enemies of the faithful who snatch that rule from their hands. 6. We accept those qualities conceded to Scripture from Bellarmine, that it is a certain and stable rule of faith. For: I. If it is, in itself, a certain rule, then it can leave us certain of the will of God, without the definitions of the church. II. Then all uncertainties, the lie of men, are by the decree of God to be examined according to that rule. III. Then it does not admit various and uncertain senses. IV. Then a certain determination is to be sought from Scripture of all controversies which are stirred up concerning the faith. V. If it is indeed a stable rule, then nothing is necessary to be believed by us, or useful, which was unknown in the age of the apostles. VI. Then the dispensations of the Papists are pernicious impostures. VII. Then, finally, the stability of the church entirely depends upon this: if it constantly adheres to this rule.</p></blockquote>

<blockquote><p>1… in [you, Edward Bagshaw] saying I deny the Scripture to be a perfect rule, when I still say, ‘It is a perfect rule so far as it is a rule’! 2. If you intend sense and truth, your argument must run thus: ‘He that says the Scripture is not a particular rule, commanding the thing in particular, but only a general rule, for the meter and tunes of psalms, for the dividing of itself into chapters and verses, for the hour and place of meetings, for the choice of a text to preach on, and words and method of sermon and prayer, for the naming or determining the person that shall be a pastor, for the form of pulpits, tables, cups, etc. yea, for the making of a clock, or watch, or hour-glass, to measure the time by, or for building the house to preach in, etc. He that says these are not determined of particularly in Scripture, but only under the general rule of doing all things to God’s glory, to edification, decently and in order, etc. this man does deny Scripture to be a perfect rule, and labors to overthrow the foundation of faith and practice, and proving what he says by the ill consequences that else will follow, will in the end be found in perfect folly and madness, reproved by God and found a liar: But such a one is R.B. Therefore, etc.&#x27;</p></blockquote>

<blockquote><p>This doctrine [of the inner testimony of the Holy Spirit] was opposed, however, from the side of Sociniaism, Remonstrantism, and Romanism. And gradually the doctrine of the internal testimony began to lose its place of honor even in Reformed theology. Already in Turretin, Amyrald, Molina, et al., it was weakened and identified with the so-called illumination of the Holy Spirit by which the intellect is enabled to note the marks and criteria of the divinity of the Holy Scripture. Faith no longer connects directly and immediately with Scripture but is the product of insight into the marks of truth and divinity it bears. Inserted between Scripture and faith, then, are the marks of the truth of Scripture. This occurred first in the sense that the recognition of those criteria was attributed to an illumination of the intellect by the Holy Spirit. But rationalism soon also considered this illumination unnecessary, assigned the study of the truth of revelation to reason, and base[d] the authority of Scripture on historical proofs. Even orthodox theologians scarcely dared any longer to speak of the internal testimony [Wilhelmus A’Brakel and Johannes Marck are cited as examples].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 1, pp. 584-85</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“This doctrine [of the inner testimony of the Holy Spirit] was opposed, however, from the side of Sociniaism, Remonstrantism, and Romanism. And gradually the doctrine of the internal testimony began to lose its place of honor even in Reformed theology. Already in Turretin, Amyrald, Molina, et al., it was weakened and identified with the so-called illumination of the Holy Spirit by which the intellect is enabled to note the marks and criteria of the divinity of the Holy Scripture. Faith no longer connects directly and immediately with Scripture but is the product of insight into the marks of truth and divinity it bears. Inserted between Scripture and faith, then, are the marks of the truth of Scripture. This occurred first in the sense that the recognition of those criteria was attributed to an illumination of the intellect by the Holy Spirit. But rationalism soon also considered this illumination unnecessary, assigned the study of the truth of revelation to reason, and base[d] the authority of Scripture on historical proofs. Even orthodox theologians scarcely dared any longer to speak of the internal testimony [Wilhelmus A’Brakel and Johannes Marck are cited as examples].”

— Herman Bavinck, Reformed Dogmatics: God and Creation, vol. 1, pp. 584-85">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+doctrine+%5Bof+the+inner+testimony+of+the+Holy+Spirit%5D+was+opposed%2C+however%2C+from+the+side+of+Sociniaism%2C+Remonstrantism%2C+and+Romanism.+And+gradually+the+doctrine+of+the+internal+testimony+began+to+lose+its+place+of+honor+even+in+Reformed+theology.+Already+in+Turretin%2C+Amyrald%2C+Molina%2C+et+al.%2C+it+was+weakened+and+identified+with+the+so-called+illumination+of+the+Holy+Spirit+by+which+the+intellect+is+enabled+to+note+the+marks+and+criteria+of+the+divinity+of+the+Holy+Scripture.+Faith+no+longer+connects+directly+and+immediately+with+Scripture+but+is+the+product+of+insight+into+the+marks+of+truth+and+divinity+it+bears.+Inserted+between+Scripture+and+faith%2C+then%2C+are+the+marks+of+the+truth+of+Scripture.+This+occurred+first+in+the+sense+that+the+recognition+of+those+criteria+was+attributed+to+an+illumination+of+the+intellect+by+the+Holy+Spirit.+But+rationalism+soon+also+considered+this+illumination+unnecessary%2C+assigned+the+study+of+the+truth+of+revelation+to+reason%2C+and+base%5Bd%5D+the+authority+of+Scripture+on+historical+proofs.+Even+orthodox+theologians+scarcely+dared+any+longer+to+speak+of+the+internal+testimony+%5BWilhelmus+A%E2%80%99Brakel+and+Johannes+Marck+are+cited+as+examples%5D.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+vol.+1%2C+pp.+584-85&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76dcfbe253.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76dcfbe253.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-authority-of-the-bible/#:~:text=This%20doctrine%20%5Bof%20the%20inner%20testimony,Johannes%20Marck%20are%20cited%20as%20examples&amp;text=This%20doctrine%20%5Bof%20the%20inner%20testimony%20of%20the&amp;text=A%E2%80%99Brakel%20and%20Johannes%20Marck%20are%20 <div class="actions"><button class="copy" data-copy="“I. Is Scripture so perfect that it contains all the doctrines necessary for salvation? Yes.”

— Johannes Hoornbeeck, ‘A Practical Theological Disputation on Sin, pt. 2’, tr. Onku with AI (Leiden: Johann Elsevir, 1660), Corollaries Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+Is+Scripture+so+perfect+that+it+contains+all+the+doctrines+necessary+for+salvation%3F+Yes.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98A+Practical+Theological+Disputation+on+Sin%2C+pt.+2%E2%80%99%2C+tr.+Onku+with+AI+%28Leiden%3A+Johann+Elsevir%2C+1660%29%2C+Corollaries+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7271c88499.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7271c88499.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-sufficiency-of-scripture/#:~:text=I.%20Is%20Scripture%20so%20perfect%20that,the%20doctrines%20necessary%20for%20salvation%3F%20Yes&amp;text=I.%20Is%20Scripture%20so%20perfect%20that%20it%20contains&amp;text=contains%20all%20the%20doctrines%20necessary%20for%20salvation%3F%20Yes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6d00dcdf01" data-kw="">
<blockquote><p>That which is owned among Protestants in common is this: That the Holy Scriptures are the only, and sufficient guide and rule, in all matters of necessary belief and observance in order unto salvation; able to make us wise unto salvation; and therefore, whosoever does either derogate from this their perfection, or add any thing unto them, as necessary to be believed or done in order unto salvation, are certainly guilty of most presumptuous and unaccountable profaneness: and this we justly tax the Church of Rome withal, for enjoining of unwritten traditions and Papal determinations to be received with an equal reverence unto the holy Scriptures. But then it is not their meaning, by virtue of this declaration, to condemn all opinions, as false, and actions as unlawful, which the Holy Scripture prescribes not; or to extend the perfection of holy Scripture so far as the punctual determination of the circumstantials of divine worship. The perfection of God’s Word is judged by them with relation unto that special end whereto it is designed; viz. the instruction of men in all things necessary unto salvation; the knowledge whereof they could not otherwise attain unto than by divine revelation; for it was not aimed to destroy or extinguish the light of nature, but to help, advance and perfect it. It is not therefore any of God’s purpose in the holy Scriptures, to comprize all things which men may know, believe or practice, as if natural reason and discretion were no longer to continue it’s guidance; or to determine all rituals and circumstances appertaining to the external ordering of divine worship, so as to have nothing for ecclesiastical laws to be employed about. That, which they teach of the Scripture’s sufficiency is ever restrained to matters of necessary belief and duties of necessary observance in order unto salvation; and never enlarged to all things that may be believed or done by us in the general, or to particular circumstances, which have respect unto the good order, decency, and external regulation of divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-camfield.html">Benjamin Camfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Examination of the Independents’ Catechism &amp; therein of the Chief Principles of Non-Conformity to, &amp; Separation from the Church of England</cite>, (London: Redmayne, 1668), ch. 1, pp. 2-4 Camfield defended the Anglican ceremonies.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

<blockquote><p>There is, brethren, one God, the knowledge of whom we gain from the Holy Scriptures, and from no other source. For just as a man if he wishes to be skilled in the wisdom of this world will find himself unable to get at it in any other way than by mastering the dogmas of philosophers, so all of us who wish to practice piety will be unable to learn its practice from any quarter than the oracles of God. Whatever things then the Holy Scriptures declare, at these let us look; and whatsoever things they teach these let us learn.</p></blockquote>

<blockquote><p>The Papists’ confession of the sufficiency of our Belief: Council of Basil, Oration of Ragus., Bin. p. 299: ‘The holy Scripture in the literal sense, soundly and well understood, is the infallible and most sufficient rule of faith.’ Bellarmine, Of the Word of God, bk. 4, ch. 11 ‘In the Christian doctrine both of Faith and manners, some things are simply necessary to salvation, to all, as the knowledge of the articles of the Apostles’ Creed, of the Ten Commandments and of some sacraments: The rest are not so necessary that a man cannot be saved without the explicit knowledge, belief and profession of them—These things that are simply necessary, and are profitable to all, the apostles preached to all— All things are written by the apostles which are necessary to all, and which they openly preached to all.’ (See the place.) Costenus, Enchiridion, ch. 1, p. 49 ‘Non inficiamur praecipua illa fidei capita quae omnibus Christians cognitu sunt ad salutem necessaria, perspicue satis esse apostolicis scriptis comprehensa.’ [We do not deny that those principal articles of faith which all Christians know and which are necessary for salvation are set forth quite clearly enough in the apostolic writings.]</p></blockquote>

<blockquote><p>Let us give place and consent to the Holy Scripture (says St. Augustine) for it can neither deceive nor be deceived. The bishops also and clergy of England in the epistle of their book to the King’s grace (De peccatorum meritis et remissione, ch. 22) do affirm that holy Scripture alone shows men the right path to come to God to see Him, to know Him, to love Him, to serve Him and so to serve Him as He most desires. Wherefore they are rather obstinate against God, which instead of his only Word, preach and teach other doctrines.</p></blockquote>

>

</figure><figure class="quote" id="q-9c7da9c85b" data-kw="">
<blockquote><p>Now I find that Mr. [Richard ]Hooker [an Anglican] says two things to this: 1. That Scripture does regulate all our moral actions, but not scripture only, for the Law of nature and the most concealed instincts of nature, and other principles may warrant our actions: We move (says he), we sleep, we take the cup at the hand of our friend; a number of things we often do only to satisfy some natural desire without present express and actual reference to any commandment of God, unto his glory; even these things are done which we naturally perform, and not only that which naturally and spiritually we do, for by every effect proceeding from the most concealed instincts of nature, his power is made manifest. But it does not therefore follow, that of necessity we shall sin unless we expressly intend the glory of God in every such particular. [Rutherford’s] Answer: …I answer that as: [1.] there be some actions in man purely and spiritually, but supernaturally, moral, as to believe in Christ for remission of sins, to love God in Christ: these the Gospel does regulate. 2. There be some actions naturally moral in the substance of the act, as many things commanded and forbidden in the Moral Law; and these are to be regulated by the Law of nature and the Moral Law: 3. There be some actions mixed, as such actions in which nature, or concealed instincts of nature are the chief principles, yet in and about these actions, as in their modification of time, place, and manner and measure, there is a special morality, in regard of which they are to be ruled by the Word; Such mixed actions as these that are mentioned by Hooker, as to move, sleep, take the cup at the hand of a friend, cannot be called simply moral, for to move may be purely natural, as if a man against his will fall off a high place or off a horse, to start in the sleep, are so natural that I know not any morality in them; but sure I am [that] for Nathaniel to come to Christ, which was also done by a natural motion, is not a mere natural action proceeding from the most concealed instincts of nature; so to sleep has somewhat natural in it, for beasts do sleep; beasts do move; I grant they cannot take a cup at the hand of a friend, they cannot salute one another: (It is Hooker’s instance) but fancy sometimes in men do these, whereas conscience should do them: What is natural in moving and sleeping, and what is common to men with beasts, I grant, Scripture does not direct or regulate these acts of moving and sleeping; we grant [that] actions natural and common to us with beasts need not the rule of the Word to regulate them: But this I must say (I speak it, my record is in Heaven, not to offend any) Formalists, as such, and as Prelatical, are irreligious and profane: One of them asked a godly man, ‘Will you have Scripture for giving your horse a peck of oats, and for breaking wind, and easing or obeying nature?’ And therefore they bring in these instances to make sport: But I conceive, sleeping moderately, to enable you to the service of God, as eating, drinking, that God may be glorified, 1 Cor. 10:31, are also in the measure and manner of doing moral, and so ruled by Scripture and Scripture only, and not regulated by natural instincts… Whereas being created according to God’s image, especially, he living in the visible Church, he is to do all his actions deliberate, even natural and moral in Faith, and with a warrant from scripture, to make good their morality, Ps. 119:9; Prov. 3:23-24; 2 Cor. 5:7. And truly Formalists give men in their morals to live at random and to walk without taking heed to their ways according to God’s Word. … Answer: 1. The Law of reason in morals (for of such we now speak) is nothing but the Moral Law and will of God, contained fully in the Scriptures of the Old and New Testament; and therefore is not to be divided from the Scriptures; if a man be ruled in that, he is ruled by Scripture: for a great part of the Bible, of the Decalogue, is printed in the reasonable soul of man: as when he loves his parents, obeys his superiors, saves his neighbor in extreme danger of death, because he does these according to the Law of Reason, shall it follow that these actions which are expressly called [in Greek] Rom. 2:14, the things or duties of the Law, are not warranted by express Scripture because they are done according to the Law of natural reason? I should think the contrary most true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Intro, Section 4, pp. 72-74</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

o+live+at+random+and+to+walk+without+taking+heed+to+their+ways+according+to+God%E2%80%99s+Word.+%E2%80%A6+Answer%3A+1.+The+Law+of+reason+in+morals+%28for+of+such+we+now+speak%29+is+nothing+but+the+Moral+Law+and+will+of+God%2C+contained+fully+in+the+Scriptures+of+the+Old+and+New+Testament%3B+and+therefore+is+not+to+be+divided+from+the+Scriptures%3B+if+a+man+be+ruled+in+that%2C+he+is+ruled+by+Scripture%3A+for+a+great+part+of+the+Bible%2C+of+the+Decalogue%2C+is+printed+in+the+reasonable+soul+of+man%3A+as+when+he+loves+his+parents%2C+obeys+his+superiors%2C+saves+his+neighbor+in+extreme+danger+of+death%2C+because+he+does+these+according+to+the+Law+of+Reason%2C+shall+it+follow+that+these+actions+which+are+expressly+called+%5Bin+Greek%5D+Rom.+2%3A14%2C+the+things+or+duties+of+the+Law%2C+are+not+warranted+by+express+Scripture+because+they+are+done+according+to+the+Law+of+natural+reason%3F+I+should+think+the+contrary+most+true.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+...+%281646%29%2C+Intro%2C+Section+4%2C+pp.+72-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c7da9c85b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c7da9c85b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-sufficiency-of-scripture/#:~:text=Now%20I%20find%20that%20Mr.%20%5BRichard,should%20think%20the%20contrary%20most%20true&amp;text=Now%20I%20find%20that%20Mr.%20%5BRichard%20%5DHooker%20%5Ban&amp;text=reason%3F%20I%20should%20think%20the%20contrary%20most%20true" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>II. Those give too much (in bulk, but too little in virtue) to the Scriptures: 1. Who would set them up instead of the whole Law, and Light of Nature, as excluding this, as useless where the Scripture is. 2. And they that feign it to be instead of all grammars, logic, philosophy, and all other arts and sciences, and to be a perfect particular rule for every ruler, lawyer, physician, mariner, architect, husbandman and tradesman, to do his work by. 3. And they that feign it to be fully sufficient to all men to prove its own authority and truth, without the subsidiary use of that Church-history and tradition, which tells us the supposed matters of fact and must help us to know what books are canonical and what not; and without historical evidence that these are the true books which the prophets and apostles wrote and the miracles and providences which have attested them. 4. And those that think that it is sufficient for its own promulgation, or the peoples instruction, without the ministry of man to preserve, deliver, translate, expound and preach it to the people. 5. And those that think it sufficient to sanctify men, without the concourse of the Spirit’s illumination, vivification and inward operation to that end. 6. And they that say that no man can be saved by the knowledge, belief, love and practice of all the substantial parts of Christianity brought to him by tradition, parents or preachers, who tell him nothing of the Scriptures, but deliver him the doctrines as attested by miracles and the Spirit without any notice of the Book. 7. And those that say that Scripture alone must be made use of as to all the history of Scripture-times, and that it is unlawful to make use of any other historians, (as Josephus and such others). 8. And they that say, no other books of divinity but Scripture are useful, yea, or lawful to be read of Christians; or at least in the Church. 9. And they that say that the Scriptures are so divine, not only in matter, but in method and style, as that there is nothing of human (inculpable [blameless]) imperfection or weakness in them. 10. And those that say that the logical method and the phrase is as perfect as God was able to make them. 11. And they that say that all passages in Scripture historically related are moral truths: and so make the Devil’s words to Eve, of Job, to Christ, etc. to be all true. 12. And they that say that all passages in the Scripture were equally obligatory to all other places and ages, as to those that first received them (as the kiss of peace, the veils of women, washing feet, anointing the sick, deaconesses, etc.) 13. And they that make Scripture so perfect a rule to our belief that nothing is to be taken for certain, that comes to us any other way (as natural knowledge or historical). 14. And those that think men may not translate the Scripture, turn the Psalms into metre, tune them, divide the Scripture into chapters and verses, etc. as being derogatory alterations of the perfect Word. 15. And those that think it so perfect a particular rule of all the circumstances, modes, adjuncts and external expressions of and in God’s worship, as that no such may be invented or added by man, that is not there prescribed: as time, place, vesture [clothing, such as a grave garment], gesture, utensils, methods, words, and many other things, mentioned before. 16. And those that Jewishly feign a multitude of unproved mysteries to lie in the letters, orders, numbers and proper names in Scriptures (though I deny not that there is much mystery which we little observe). 17. They that say that the Scripture is all so plain that there is no obscure or difficult passages in them, which men are in danger of wresting to their own destruction. 18. And they that say that all in the Scripture is so necessary to salvation (even the darkest prophecies) that they cannot be saved that understand them not all; or at least endeavor not studiously and particularly to understand them. 19. And they that say that every book and text must of necessity to salvation be believed to be canonical and true. 20. And those that say that God has so preserved the Scripture, as that there are no various readings and doubtful texts thereupon, and that no written or printed copies have been corrupted (when Dr. Heylin tells us that the King’s printer printed the Seventh Commandment, ‘Thou shalt commit adultery’); all these err in over-doing. … IV. The dangers of over-doing here are these: 1. It leads to downright infidelity: for when men find that the Scripture is imperfect or wanting in that which they fancy to be part of its perfection, and to be really insufficient, e.g. to teach men physics, logic, medicine, languages, etc. they will be apt to say, ‘It is not of God, because it has not that which it pretends to have.’ 2. God is made the author of defects and imperfections. 3. The Scripture is exposed to the scorn and confutation of infidels. 4. Papists are assisted in proving its imperfection. But I must stop, having spoke to this point before in Question 35 and partly Question 30 &amp; 31 &amp; 33 more at large.</p></blockquote>

of+as+to+all+the+history+of+Scripture-times%2C+and+that+it+is+unlawful+to+make+use+of+any+other+historians%2C+%28as+Josephus+and+such+others%29.+8.+And+they+that+say%2C+no+other+books+of+divinity+but+Scripture+are+useful%2C+yea%2C+or+lawful+to+be+read+of+Christians%3B+or+at+least+in+the+Church.+9.+And+they+that+say+that+the+Scriptures+are+so+divine%2C+not+only+in+matter%2C+but+in+method+and+style%2C+as+that+there+is+nothing+of+human+%28inculpable+%5Bblameless%5D%29+imperfection+or+weakness+in+them.+10.+And+those+that+say+that+the+logical+method+and+the+phrase+is+as+perfect+as+God+was+able+to+make+them.+11.+And+they+that+say+that+all+passages+in+Scripture+historically+related+are+moral+truths%3A+and+so+make+the+Devil%E2%80%99s+words+to+Eve%2C+of+Job%2C+to+Christ%2C+etc.+to+be+all+true.+12.+And+they+that+say+that+all+passages+in+the+Scripture+were+equally+obligatory+to+all+other+places+and+ages%2C+as+to+those+that+first+received+them+%28as+the+kiss+of+peace%2C+the+veils+of+women%2C+washing+feet%2C+anointing+the+sick%2C+deaconesses%2C+etc.%29+13.+And+they+that+make+Scripture+so+perfect+a+rule+to+our+belief+that+nothing+is+to+be+taken+for+certain%2C+that+comes+to+us+any+other+way+%28as+natural+knowledge+or+historical%29.+14.+And+those+that+think+men+may+not+translate+the+Scripture%2C+turn+the+Psalms+into+metre%2C+tune+them%2C+divide+the+Scripture+into+chapters+and+verses%2C+etc.+as+being+derogatory+alterations+of+the+perfect+Word.+15.+And+those+that+think+it+so+perfect+a+particular+rule+of+all+the+circumstances%2C+modes%2C+adjuncts+and+external+expressions+of+and+in+God%E2%80%99s+worship%2C+as+that+no+such+may+be+invented+or+added+by+man%2C+that+is+not+there+prescribed%3A+as+time%2C+place%2C+vesture+%5Bclothing%2C+such+as+a+grave+garment%5D%2C+gesture%2C+utensils%2C+methods%2C+words%2C+and+many+other+things%2C+mentioned+before.+16.+And+those+that+Jewishly+feign+a+multitude+of+unproved+mysteries+to+lie+in+the+letters%2C+orders%2C+numbers+and+proper+names+in+Scriptures+%28though+I+deny+not+that+there+is+much+mystery+which+we+little+observe%29.+17.+They+that+say+that+the+Scripture+is+all+so+plain+that+there+is+no+obscure+or+difficult+passages+in+them%2C+which+men+are+in+danger+of+wresting+to+their+own+destruction.+18.+And+they+that+say+that+all+in+the+Scripture+is+so+necessary+to+salvation+%28even+the+darkest+prophecies%29+that+they+cannot+be+saved+that+understand+them+not+all%3B+or+at+least+endeavor+not+studiously+and+particularly+to+understand+them.+19.+And+they+that+say+that+every+book+and+text+must+of+necessity+to+salvation+be+believed+to+be+canonical+and+true.+20.+And+those+that+say+that+God+has+so+preserved+the+Scripture%2C+as+that+there+are+no+various+readings+and+doubtful+texts+thereupon%2C+and+that+no+written+or+printed+copies+have+been+corrupted+%28when+Dr.+Heylin+tells+us+that+the+King%E2%80%99s+printer+printed+the+Seventh+Commandment%2C+%E2%80%98Thou+shalt+commit+adultery%E2%80%99%29%3B+all+these+err+in+over-doing.+%E2%80%A6+IV.+The+dangers+of+over-doing+here+are+these%3A+1.+It+leads+to+downright+infidelity%3A+for+when+men+find+that+the+Scripture+is+imperfect+or+wanting+in+that+which+they+fancy+to+be+part+of+its+perfection%2C+and+to+be+really+insufficient%2C+e.g.+to+teach+men+physics%2C+logic%2C+medicine%2C+languages%2C+etc.+they+will+be+apt+to+say%2C+%E2%80%98It+is+not+of+God%2C+because+it+has+not+that+which+it+pretends+to+have.%E2%80%99+2.+God+is+made+the+author+of+defects+and+imperfections.+3.+The+Scripture+is+exposed+to+the+scorn+and+confutation+of+infidels.+4.+Papists+are+assisted+in+proving+its+imperfection.+But+I+must+stop%2C+having+spoke+to+this+point+before+in+Question+35+and+partly+Question+30+%26+31+%26+33+more+at+large.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+...+%281673%29%2C+Part+3%2C+Question+166%2C+%E2%80%98Who+be+they+that+give+too+little+to+the+Scriptures%2C+and+who+too+much%3B+and+what+is+the+danger+of+each+extreme%3F%E2%80%99%2C+pp.+912-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc04bcda648.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c04bcda648.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-sufficiency-of-scripture/#:~:text=II.%20Those%20give%20too%20much%20%28in,31%20%26%2033%20more%20at%20large&amp;text=II.%20Those%20give%20too%20much%20%28in%20bulk%2C%20but&amp;text=30%20%26%2031%20%26%2033%20more%20at%20large" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1st Conclusion. To show that our Church was a visible Church before Luther arose, and that our Reformers were lawfully called of God and the Church, is a question of fact: and cannot be proved by the Word of God. Because the Word of God is not a chronicle of these who were the true Church and truly called to the ministry since the apostles departed this life. 2. Because these must be proved by sense, and the testimony of human writings, who can err. 2nd Conclusion. Yet may it be gathered from human writers that the visible Church of protestants this day, has been since the apostles’ days. I mean the determinate persons may be known by human reasons and signs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 1, ch. 8, section 8, p. 229</span></figcaption>

</figure><figure class="quote" id="q-157f170654" data-kw="">
<blockquote><p>1st Distinction. The Word of God being given to man as a moral agent, is a rule of all his moral actions, but not of actions of art, sciences, disciplines, yea, or of mere nature. … 6. What is warranted by natural reason, is warranted by Scripture, for the Law of nature is but a part of Scripture. 7. Actions are either purely moral, or purely not-moral, or mixed of both: The first has warrant in Scripture, the second none at all, the third requires not a warrant of Scripture every way concludent, but only in so far as they be moral. 8. Matters of mere fact, known by sense and human testimony, are to be considered according to their physical existence, if they be done or not done; if Titus did such a thing or not, such are not in that notion to be proved by Scripture: 2. They may be considered according to their essence and moral quality of good and lawful, bad or unlawful, and so they are to be warranted by Scripture. … * * * 5. Matters of fact are not, and need not be proved by Scripture: 1. Because sense makes them known to us. 2. Their morality is sufficiently known from God’s Word. 3. In matters of fact there may be invincible ignorance: Christ’s resurrection is not a matter of fact, as Hugo Grotius says, but also a matter of Law, as all the miracles and histories in the Word, and to be believed, because God has so spoken in the Word.</p></blockquote>

<blockquote><p>In like manner when God complains of the ingratitude and corrupt morals of the people of Israel, as in Isa. 1, 5; Mic. 6 and in a variety of passage of Scripture, He condemns them by appealing to no other principles than the natural perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them.</p></blockquote>

<blockquote><p>Objection 5… But sin unto death is sin against the Holy Spirit, as the Master [Peter Lombard] says…. Reply to Objection 5… so also among sins it is only those sins among mortal sins that are called “sins unto death” that, as far as they themselves go, are unforgivable. Therefore, sin is called “mortal” from the first death, but “unto death” because of the second death.” (Sentences, bk. 2, dist. 43, q. 1, art. 2; the ‘Exposition of the Text’ on this Distinction confirms this) For the Reformed: ‘That the Sin unto Death is the Same as the Sin Against the Holy Spirit’. . Disagreements What it is Thomas: “to sin through malice is to sin against the Holy Ghost.” (Summa, pt. 2 of 2, q. 14, art. 1) Turretin: “We say it is a universal apostasy from true Christianity or of the truth of the Gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency.” (1.647) Turretin’s view was the dominant view of the Reformed: ‘Of the Sin Against the Holy Spirit’. . Sin unto Death: Not to be Prayed for Thomas: “‘I do not say that anyone should pray for him.’ [1 Jn. 5:16]… then it must be understood in the sense that not just anyone should pray for such a sinner, since the conversion of these kinds of sinners is, as it were, miraculous. Hence just as not just anyone should pray for miracles to be performed, except great and holy men, neither should just anyone pray for the conversion of these kinds of sinners. Even so, according to the form of the words, it is not forbidden for there to be prayer for such a person.” (Sentences, bk. 2, dist. 43, ‘Exposition of the Text’) WCF 21.4: “Prayer is to be made for things lawful,[n] and for all sorts of men living… but not for… those of whom it may be known that they have sinned the sin unto death.[q] [n] 1 John 5:14 [q] 1 John 5:16</p></blockquote>

<blockquote><p>Thomas Aquinas begins Summa Theologicae Part III with reflections on the Incarnation of Christ… This section of the Summa reinvigorated Chalcedonian Christology in the West… Aquinas repeatedly affirms that Christ remains omnipresent according to his divine nature even while taking to himself a finite and circumscribed human nature, what will come to be known as the extra Calvinisticum in later centuries. Christ’s presence extra carnem, beyond the flesh, in no way separates the person of Christ but rather secures his presence with the Church.” (K.J. Drake, ‘Beyond the Flesh’) . Christ’s Human Nature: an Individual Thing Aquinas: “…although this human nature [of Christ] is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>

<blockquote><p>The mode of giving supernatural grace to nature is, Junius stated, infusion, a term that is strikingly redolent of Aquinas’s conception of the mode of communicating grace.” (Seung J. Lee, Orders of Nature &amp; Grace, p. 60) Gale: “That supernatural good and virtue comes from God by divine infusion is generally asserted and demonstrated by the sectators of Augustin and Aquinas.” (4.496) . No Proper Habitual vs. Actual Grace Distinction On Maresius and Thomas: “Supernatural habits, by contrast [with natural habits], are stirred into action by the Holy Spirit, who dwells in the recipients of habitual grace (Maresius 1646-48, 2:143). Maresius disagrees with some Roman Catholic theologians, who suggest that people imbued with habitual grace require an additional gift of ‘actual grace’ before habitual grace bears fruit. For Maresius, the Spirit’s powerful presence is quite sufficient. As a result, Maresius is suspicious of the distinction between habitual and actual grace—a distinction, he notes, which is not found in Aquinas. That said, if by ‘actual grace’ is meant simply the Spirit’s activity in exciting supernatural habits into action, Maresius does not object, although he prefers the term ‘moving grace’ (Maresius 1646-48, 2:144). And since the Holy Spirit dwells with believers permanently, he argues that moving grace is also permanently present as to the principle of its motion, even if it is not permanently active.” (Stephen Hampton in Oxford Handbook of Early Modern Theology, p. 236) . Deification Thomas: “Now the gift of grace surpasses every capability of created nature, since it is nothing short of a partaking of the Divine Nature, which exceeds every other nature. And thus it is impossible that any creature should cause grace. For it is as necessary that God alone should deify [deificet], bestowing a partaking of the Divine Nature by a participated likeness, as it is impossible that anything save fire should enkindle.</p></blockquote>

<blockquote><p>But you may say that there were musical instruments in the Old Testament, as well as vocal song. Therefore, why does the Church dismiss those but accept these? A twofold mystical meaning is given, because they were figurative. According to this, the reason is that God is praised by mind and voice but not by instruments. Another reason comes from the words of the Philosopher [Aristotle], who said that it is against wisdom that men be instructed in lyric songs and music, since they would occupy their souls in these works, but there should be simple music so that they may be drawn from bodily things and brought to the divine praises.” (On Ps. 32, sect. 308) Beza, at some length, debating with Jacob Andreae (a leading Lutheran theologian), held instruments, as used by the churches in worship, to be essentially indifferent, some of the reformed finding them profitable (and using them), and some not finding them so (and not using them). (Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586, Concordia, 2017, pp. 458, 464, 479-83, 493-95) Leigh, after referencing certain reformed divines and numerous of their arguments for musical instruments in worship, says, “Not only Dr. Ames opposes it, but Aquinas, Rivet, Zanchius, Zepperus, Altingius and others’ dislike of organs and such like music in churches, and they do generally rather hinder edification.” (System of Divinity, p. 610) Ames: “Thomas Aquinas… opposes thus: ‘The Church uses no [instruments of] music for divine praises, lest it should seem to Judaize,’ and answers thus: ‘Musical instruments do more stir up the mind to delight than frame it to a right disposition. In the Old Testament there was some need of them, both, etc. and also because they did figure [signify] out something.&#x27;” (Fresh Suit, p. 405) For more of the Reformed: ‘Musical Instruments in Worship’. . Images Agreements Nature of Idolatry Owen, speaking of idolatry: “We know it to be… ‘Any religious worship of that which by nature is not God;’ and so does your Thomas grant it to be.” (14:216; Turretin, Institutes 2.44) Rutherford, in examining the nature of idolatry, approves of Thomas teaching that “the heathen acknowledged a Godhead to dwell in the images.” (Divine Right, ch. 1, question 5, p. 152) . Disagreements Images of God &amp; Christ are Not to be Made Thomas: “…images of the Trinity and of Christ should be worshiped with the same adoration with which the prototypes are worshiped…” (Summa, pt. 3, q. 25, art. 3) Vermigli: “And Thomas Aquinas is also to be wondered at, who says that God forbade the Jews that they should not make images, because at that time the Word had not taken upon it the nature of man. What is this to the purpose; seeing we speak at this present of the images and pictures of the very nature of God, which by art, colors and lineaments cannot be described? Wherefore there is all one reason, as well of the old Hebrews as of the Christians…” (Common Places, pt. 2, ch. 5, p. 340) For more of the Reformed: ‘Images of God are Forbidden’ ‘Images of Christ’ . Divine Worship Not to be Given to Images Turretin denies Thomas (Summa, pt. 3, q. 25, art. 4) on giving the worship of latria (divine worship) to the cross itself (2:53), saying “the orthodox impugn it.</p></blockquote>

n Baptize, even in “Necessity</p></blockquote>

<blockquote><p>…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.</p></blockquote>

<blockquote><p>And the same is objected against them by Maimonides in Pirke Aboth: as though it were not known that the greatest part of their Talmud, the sacred treasury of their oral law, is taken up with differences and disputes of their masters among themselves, with a multitude of various opinions and contradictory conceptions about their traditions. Thus deal the Romanists also with their adversaries, this they charge them withal. They are heretics, Biblists; and, by adhering to the Scripture alone, have no certainty among themselves, but run into diversities of opinion, having deserted the unerring rule of their Cabala;—when the world is filled with the noise of their own conflicts, notwithstanding the pretended relief which they have thereby.</p></blockquote>

<blockquote><p>It must be observed, however, that the teachings and prescriptions of Scripture are not confined by the Confession to what is “expressly set down in Scripture.” Men are required to believe and to obey not only what is “expressly set down in Scripture,” but also what “by good and necessary consequence may be deduced from Scripture.” This is the strenuous and universal contention of the Reformed theology against Socinians and Arminians, who desired to confine the authority of Scripture to its literal asseverations; and it involves a characteristic honoring of reason as the instrument for the ascertainment of truth. We must depend upon our human faculties to ascertain what Scripture says; we cannot suddenly abnegate them and refuse their guidance in determining what Scripture means. This is not, of course, to make reason the ground of the authority of inferred doctrines and duties. Reason is the instrument of discovery of all doctrines and duties, whether “expressly set down in Scripture” or “by good and necessary consequence deduced from Scripture”: but their authority, when once discovered, is derived from God, who reveals and prescribes them in Scripture, either by literal assertion or by necessary implication. The Confession is only zealous, as it declares that only Scripture is the authoritative rule of faith and practice, so to declare that the whole of Scripture is authoritative, in the whole stretch of its involved meaning. It is the Reformed contention, reflected here by the Confession, that the sense of Scripture is Scripture, and that men are bound by its whole sense in all its implications. The reëmergence in recent controversies of the plea that the authority of Scripture is to be confined to its expressed declarations, and that human logic is not to be trusted in divine things, is, therefore, a direct denial of a fundamental position of Reformed theology, explicitly affirmed in the Confession, as well as an abnegation of fundamental reason, which would not only render thinking in a system impossible, but would discredit at a stroke many of the fundamentals of the faith, such e.g. as the doctrine of the Trinity, and would logically involve the denial of the authority of all doctrine whatsoever, since no single doctrine of whatever simplicity can be ascertained from Scripture except by the use of the processes of the understanding. It is, therefore, an unimportant incident that the recent plea against the use of human logic in determining doctrine has been most sharply put forward in order to justify the rejection of a doctrine which is explicitly taught, and that repeatedly, in the very letter of Scripture; if the plea is valid at all, it destroys at once our confidence in all doctrines, no one of which is ascertained or formulated without the aid of human logic.</p></blockquote>

nce+in+recent+controversies+of+the+plea+that+the+authority+of+Scripture+is+to+be+confined+to+its+expressed+declarations%2C+and+that+human+logic+is+not+to+be+trusted+in+divine+things%2C+is%2C+therefore%2C+a+direct+denial+of+a+fundamental+position+of+Reformed+theology%2C+explicitly+affirmed+in+the+Confession%2C+as+well+as+an+abnegation+of+fundamental+reason%2C+which+would+not+only+render+thinking+in+a+system+impossible%2C+but+would+discredit+at+a+stroke+many+of+the+fundamentals+of+the+faith%2C+such+e.g.+as+the+doctrine+of+the+Trinity%2C+and+would+logically+involve+the+denial+of+the+authority+of+all+doctrine+whatsoever%2C+since+no+single+doctrine+of+whatever+simplicity+can+be+ascertained+from+Scripture+except+by+the+use+of+the+processes+of+the+understanding.+It+is%2C+therefore%2C+an+unimportant+incident+that+the+recent+plea+against+the+use+of+human+logic+in+determining+doctrine+has+been+most+sharply+put+forward+in+order+to+justify+the+rejection+of+a+doctrine+which+is+explicitly+taught%2C+and+that+repeatedly%2C+in+the+very+letter+of+Scripture%3B+if+the+plea+is+valid+at+all%2C+it+destroys+at+once+our+confidence+in+all+doctrines%2C+no+one+of+which+is+ascertained+or+formulated+without+the+aid+of+human+logic.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+The+Works+of+Benjamin+B.+Warfield%3A+The+Westminster+Assembly+and+Its+Work%2C+vol.+6+%28Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2008%29%2C+226%E2%80%9327.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff43796151a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f43796151a.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/07/warfield-contra-biblicism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The genuine believer takes the whole of Scripture as a living organism produced by the Holy Spirit to present Christ to him. On every page of Scripture, he finds traits and traces of the Mediator.</p></blockquote>

</figure><figure class="quote" id="q-f030809bf0" data-kw="">
<blockquote><p>For indeed, as the Creator of all things, He was from the beginning discovered equally with them, they having been themselves manifested that He might become known as God. For although Moses, some long while afterwards, seems to have been the first to introduce the knowledge of the God of the universe in the temple of his writings, yet the birthday of that knowledge must not on that account be reckoned from the Pentateuch. For the volume of Moses does not at all initiate the knowledge of the Creator, but from the first gives out that it is to be traced from Paradise and Adam, not from Egypt and Moses. The greater part, therefore, of the human race, although they knew not even the name of Moses, much less his writings, yet knew the God of Moses; and even when idolatry overshadowed the world with its extreme prevalence, men still spoke of Him separately by His own name as God, and the God of gods, and said, “If God grant,” and, “As God pleases,” and, “I commend you to God.” Reflect, then, whether they knew Him, of whom they testify that He can do all things. To none of the writings of Moses do they owe this. The soul was before prophecy. From the beginning the knowledge of God is the dowry of the soul, one and the same amongst the Egyptians, and the Syrians, and the tribes of Pontus. For their souls call the God of the Jews their God. Do not, O barbarian heretic, put Abraham before the world. Even if the Creator had been the God of one family, He was yet not later than your god; even in Pontus was He known before him. Take then your standard from Him who came first: from the Certain (must be judged) the uncertain; from the Known the unknown. Never shall God be hidden, never shall God be wanting. Always shall He be understood, always be heard, nay even seen, in whatsoever way He shall wish. God has for His witnesses this whole being of ours, and this universe wherein we dwell. He is thus, because not unknown, proved to be both God and the only One, although another still tries hard to make out his claim.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Five Books against Marcion, in Latin Christianity: Its Founder, Tertullian</cite>, ed. Alexander Roberts, James Donaldson, and A. Cleveland Coxe, trans. Peter Holmes, vol. 3, The Ante-Nicene Fathers (Buffalo, NY: Christian Literature Company, 1885), 1.10 (p. 278).</span></figcaption>

</figure><figure class="quote" id="q-025aa1fdd7" data-kw="">
<blockquote><p>These are “the doctrines” of men and “of demons” produced for itching ears of the spirit of this world’s wisdom: this the Lord called “foolishness,” and “chose the foolish things of the world” to confound even philosophy itself. For (philosophy) it is which is the material of the world’s wisdom, the rash interpreter of the nature and the dispensation of God. Indeed heresies are themselves instigated by philosophy. From this source came the Æons, and I known not what infinite forms, and the trinity of man in the system of Valentinus, who was of Plato’s school. From the same source came Marcion’s better god, with all his tranquillity; he came of the Stoics. Then, again, the opinion that the soul dies is held by the Epicureans; while the denial of the restoration of the body is taken from the aggregate school of all the philosophers; also, when matter is made equal to God, then you have the teaching of Zeno; and when any doctrine is alleged touching a god of fire, then Heraclitus comes in. The same subject-matter is discussed over and over again by the heretics and the philosophers; the same arguments are involved. Whence comes evil? Why is it permitted? What is the origin of man? and in what way does he come? Besides the question which Valentinus has very lately proposed—Whence comes God? Which he settles with the answer: From enthymesis and ectroma. Unhappy Aristotle! who invented for these men dialectics, the art of building up and pulling down; an art so evasive in its propositions, so far-fetched in its conjectures, so harsh, in its arguments, so productive of contentions—embarrassing even to itself, retracting everything, and really treating of nothing! Whence spring those “fables and endless genealogies,” and “unprofitable questions,” and “words which spread like a cancer?”From all these, when the apostle would restrain us, he expressly names philosophy as that which he would have us be on our guard against. Writing to the Colossians, he says, “See that no one beguile you through philosophy and vain deceit, after the tradition of men, and contrary to the wisdom of the Holy Spirit.”He had been at Athens, and had in his interviews (with its philosophers) become acquainted with that human wisdom which pretends to know the truth, whilst it only corrupts it, and is itself divided into its own manifold heresies, by the variety of its mutually repugnant sects. What indeed has Athens to do with Jerusalem? What concord is there between the Academy and the Church? what between heretics and Christians? Our instruction comes from “the porch of Solomon,” who had himself taught that “the Lord should be sought in simplicity of heart.”Away with all attempts to produce a mottled Christianity of Stoic, Platonic, and dialectic composition! We want no curious disputation after possessing Christ Jesus, no inquisition after enjoying the gospel! With our faith, we desire no further belief. For this is our excellent faith, that there is nothing which we ought to believe besides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prescription against Heretics, in Latin Christianity: Its Founder, Tertullian</cite>, ed. Alexander Roberts, James Donaldson, and A. Cleveland Coxe, trans. Peter Holmes, vol. 3, The Ante-Nicene Fathers (Buffalo, NY: Christian Literature Company, 1885), 7 (p. 246).</span></figcaption>

asive+in+its+propositions%2C+so+far-fetched+in+its+conjectures%2C+so+harsh%2C+in+its+arguments%2C+so+productive+of+contentions%E2%80%94embarrassing+even+to+itself%2C+retracting+everything%2C+and+really+treating+of+nothing%21+Whence+spring+those+%E2%80%9Cfables+and+endless+genealogies%2C%E2%80%9D+and+%E2%80%9Cunprofitable+questions%2C%E2%80%9D+and+%E2%80%9Cwords+which+spread+like+a+cancer%3F%E2%80%9DFrom+all+these%2C+when+the+apostle+would+restrain+us%2C+he+expressly+names+philosophy+as+that+which+he+would+have+us+be+on+our+guard+against.+Writing+to+the+Colossians%2C+he+says%2C+%E2%80%9CSee+that+no+one+beguile+you+through+philosophy+and+vain+deceit%2C+after+the+tradition+of+men%2C+and+contrary+to+the+wisdom+of+the+Holy+Spirit.%E2%80%9DHe+had+been+at+Athens%2C+and+had+in+his+interviews+%28with+its+philosophers%29+become+acquainted+with+that+human+wisdom+which+pretends+to+know+the+truth%2C+whilst+it+only+corrupts+it%2C+and+is+itself+divided+into+its+own+manifold+heresies%2C+by+the+variety+of+its+mutually+repugnant+sects.+What+indeed+has+Athens+to+do+with+Jerusalem%3F+What+concord+is+there+between+the+Academy+and+the+Church%3F+what+between+heretics+and+Christians%3F+Our+instruction+comes+from+%E2%80%9Cthe+porch+of+Solomon%2C%E2%80%9D+who+had+himself+taught+that+%E2%80%9Cthe+Lord+should+be+sought+in+simplicity+of+heart.%E2%80%9DAway+with+all+attempts+to+produce+a+mottled+Christianity+of+Stoic%2C+Platonic%2C+and+dialectic+composition%21+We+want+no+curious+disputation+after+possessing+Christ+Jesus%2C+no+inquisition+after+enjoying+the+gospel%21+With+our+faith%2C+we+desire+no+further+belief.+For+this+is+our+excellent+faith%2C+that+there+is+nothing+which+we+ought+to+believe+besides.%E2%80%9D%0A%0A%E2%80%94+Tertullian%2C+The+Prescription+against+Heretics%2C+in+Latin+Christianity%3A+Its+Founder%2C+Tertullian%2C+ed.+Alexander+Roberts%2C+James+Donaldson%2C+and+A.+Cleveland+Coxe%2C+trans.+Peter+Holmes%2C+vol.+3%2C+The+Ante-Nicene+Fathers+%28Buffalo%2C+NY%3A+Christian+Literature+Company%2C+1885%29%2C+7+%28p.+246%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F025aa1fdd7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/025aa1fdd7.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/11/what-tertullian-really-said-about-jerusalem-and-athens/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-cee4553464" data-kw="">
<blockquote><p>The law is known partly by the light of nature (Rom. 2:14–15), but the gospel is known only by a revelation from heaven (Matt. 11:27). Man, though he is a fallen creature, has in some degree a natural knowledge of the law, but he has no natural knowledge of the gospel. The gospel was wrapped up in profound secrecy till it was revealed from heaven by the Son of God immediately after the fall, and therefore it is called “the mystery,” and “the mystery of Christ” (Rom. 16:25; Eph. 3:4). Hence, unregenerate sinners are commonly not so averse from hearing the doctrine of the law as they are from hearing that of the gospel. Legal doctrine they can naturally understand, for it has a testimony in their consciences; but evangelical doctrine is a strange, unaccountable, and incredible doctrine to them (1 Cor. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 132.</span></figcaption>

</figure><figure class="quote" id="q-d1249d1fe4" data-kw="">
<blockquote><p>Fully adequate [exhaustive] knowledge is something of which we possess very little. Everywhere and in every area of life we finally run into mystery. The inner being of things, the thing as such, escapes our perception. We observe phenomena and from them infer the essence of things; we learn to know stable properties and from them we deduce the substance, but this substance itself lies behind the phenomenon and as such is unknown to us. Physics assumes the existence of atoms or electrons or energies as the final components of the material world, but does not have even a smidgen of empirical knowledge of them. Only the most simple things can be defined. As soon as things are of a somewhat higher order, they can no longer be completely captured in a concept. This is already true of the visible world, but it is even more applicable in the world of invisible things. Human beings are corporeal, sense-oriented beings. All their knowledge originates in, and arises from, sense perception. Our thinking is bound up with our senses, just as our soul is with our body. We never perceive spiritual realities directly but only by the medium of material things. We see all things ‘dimly.’ Not only God but also the soul and the entire spiritual world only become known to us through the medium of the world of the senses. This is why we refer to all spiritual matters with names that have their primary reference in the visible world… The same is true in religion and theology. There is no fully adequate knowledge of God. We cannot name him as he is within himself. All his names are derived from the world of creatures. But this does not make them untrue, a product of human imagination. Just as there is resemblance between various parts of the world, making comparison between them a possibility, so also there is kinship between God and his creatures, a kinship that warrants the use of creaturely language in speaking of him. Furthermore, though temporally the natural is prior to the spiritual, logically and ideally the spiritual precedes the natural. The natural could never guide us to the spiritual if it had not itself proceeded from the spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, Volume 2: God and Creation</cite>, trans. John Vriend, ed. John Bolt (Grand Rapids: Baker Academic, 2004), 144–45.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-c935b6c0c7" data-kw="">
<blockquote><p>Thus Paul treats this topic in a truly apostolic way, because no sophist or legalist or Jew or fanatic or anyone else speaks this way. Who would dare quote this passage from Moses, “Cursed be everyone who hangs on a tree,” and apply it to Christ Himself? By the same principle by which Paul applied this sentence, “Cursed be everyone, etc.,” to Christ, we can apply not only all of Deut. 27 but all collected curses of the Mosaic Law to Christ. For just as Christ for His own Person is innocent of this general Law, so He is of all others. And just as for us He violated this general Law and was hanged on the tree as a criminal, a blasphemer, a parricide, and a traitor, so He violated all other laws as well. For all the curses of the Law were gathered together in Him, and therefore He bore and sustained them in His own body for us. Consequently, He was not only accursed; but He became a curse for us. This is really the apostolic way to interpret the Scriptures. For without the Holy Spirit a man cannot speak this way; that is, he cannot include the entire Law in one word and gather it all at once in Christ, and, on the other hand, include all the promises of Scripture and say that these are fulfilled in Christ once and for all. Therefore this argument is apostolic and very powerful, based as it is, not on one passage in the Law but on all the laws; and Paul relies heavily on it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 289.</span></figcaption>

+Publishing+House%2C+1999%29%2C+289.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc935b6c0c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c935b6c0c7.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/11/luther-the-apostolic-way-of-reading-scripture/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-72736537e6" data-kw="">
<blockquote><p>Aristotle said it with style: people who set their heart on, proving to themselves with drawn-out arguments “that some providence is,” actually deserve whips, not words; a reply from an executioner, not a philosopher (nor, I add, a theologian). And what is more: if “that fire is hot,” something we perceive with touch; or “that noonday is light to our sense perception,” something we perceive with sight, do not require demonstration, then much less will divine providence, require it.</p></blockquote>

<blockquote><p>…That three things are recorded as created, namely, the heaven, the water, and the earth; and these three received their form from the three days’ work of distinction, so that heaven was formed on the first day; on the second day the waters were separated; and on the third day, the earth was divided into sea and dry land. So also is it in the work of adornment; on the first day of this work, which is the fourth of creation, are produced the lights, to adorn the heaven by their movements; on the second day, which is the fifth, birds and fishes are called into being, to make beautiful the intermediate element, for they move in air and water, which are here taken as one; while on the third day, which is the sixth, animals are brought forth, to move upon the earth and adorn it.</p></blockquote>

</figure><figure class="quote" id="q-3cb4a2f549" data-kw="">
<blockquote><p>Is Christianity private or public? Does the truth about Christ Jesus, who is the object of my faith, depend on my own private beliefs, or is there something verifiable that can be “fact-checked”? The reason I pose these questions is because we are living in a time when the determination of truth and untruth have turned inward, making one’s own personal beliefs the measure of what is true or not. While examining and verifying evidence and testimony may be found in courts of law, in the press and many political and personal interactions it is common to observe persons passing off as truth what are merely their own feelings, opinions, and beliefs, often without evidence or verifiable testimony. The resurrection of Jesus was a very public miracle. Not so with the resurrection of Christ Jesus. The resurrection of Jesus was a very public miracle witnessed by many and supported by evidence at the time it occurred and afterward. The evidence is recorded in Scripture. There are about 5,250 ancient Greek manuscripts of books and parts of the New Testament that record Jesus’ life, death, and resurrection. The earliest is dated to about 90 years after his death (Rylands Library Papyrus 52).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Fact Checking The Resurrection”</cite>, Jan 31, 2022</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-9294aabf54" data-kw="">
<blockquote><p>In the third place, it is said, as I also have read, that they base their faith on this verse, “He who believes and is baptized will be saved” [Mark 16:16]. This they interpret to mean that no man should be baptized before he believes. I must say that they are guilty of a great presumption. For if they follow this principle they cannot venture to baptize before they are certain that the one to be baptized believes, How and when can they ever know that for certain? Have they now become gods so that they can discern the hearts of men and know whether or not they believe? If they are not certain if they believe, why then do they baptize, since they contend so strenuously that faith must precede baptism? Are they not contradicting themselves when they baptize without being certain if faith is there or not? For whoever bases baptism on faith and baptizes on chance and not on certainty that faith is present does nothing better than he who baptizes him who has no faith. For unbelief and uncertain belief are one and the same thing, and both are contrary to the verse, “Whoever believes,” which speaks of a sure faith which they who are to be baptized should have. You say, I know, that he confesses that he believes, etc. Dear sir, confession is neither here nor there. The text does not say, “He who confesses,” but “He who believes.” To have his confession is not to know his faith. With all your reasoning you cannot do justice to this verse unless you also know he has faith, since all men are liars and God alone knows the heart. So whoever bases baptism on the faith of the one to be baptized can never baptize anyone. Even if you baptized a person a hundred times a day you would not at all know if he believes. Why then do you carry on with your rebaptizing, since you contradict yourself and baptize when you are not sure that faith is present, and yet you teach that faith must most certainly be present. This verse, “Whoever believes,” altogether opposes their rebaptizing, since the verse speaks of a certain faith. They base their rebaptizing on an uncertain faith, and in not a syllable do they follow the meaning of the verse. I say the same thing about the baptized one who receives or grounds his baptism on his faith. For he is not sure of his own faith. I would compare the man who lets himself be rebaptized with the man who broods and has scruples because perhaps he did not believe as a child. So when next day the devil comes, his heart is filled with scruples and he says, Ah, now for the first time I feel I have the right faith, yesterday I don’t think I truly believed. So I need to be baptized a third time, the second baptism not being of any avail. You think the devil can’t do such things? You had better get to know him better. He can do worse than that, dear friend. He can go on and cast doubt on the third, and the fourth and so on incessantly (as he indeed has in mind to do), just as he has done with me and many in the matter of confession. We never seemed able to confess sufficiently certain sins, and incessantly and restlessly sought one absolution after the other, one father confessor after the other. Just because we sought to rely on our confession, as those to be baptized now want to rely on their faith. What is the end result? Baptizing without end would result. All this is nonsense. Neither the baptizer nor the baptized can base baptism on a certain faith. This verse of Scripture is far more a judgment on them than on us. And these are the people who don’t want to trust the men who are witnesses of their baptism, but now as men are ready to trust themselves that they are baptized as if they were not men, or as if they were more certain of their faith than the witness of Christendom allows. So I contend that if they want to do justice to this passage, “Whoever believes,” according to their understanding, they must condemn rebaptism much more earnestly than the first baptism. Neither the baptizer nor the baptized can maintain his position, for both are uncertain of their faith, or at least are in constant peril and anxiety. For it happens, indeed it is so in this matter of faith, that often he who claims to believe does not at all believe; and on the other hand, he who doesn’t think he believes, but is in despair, has the greatest faith. So this verse, “Whoever believes,” does not compel us to determine who has faith or not. Rather, it makes it a matter of every man’s conscience to realize that if he is to be saved he must believe and not pretend that it is sufficient for a Christian to be baptized. For the verse does not say, “Whoever knows that he believes, or, if you know that anyone believes,” but it says, “Whoever believes.” Who has it, has it. One must believe, but we neither should nor can know it for certain.</p></blockquote>

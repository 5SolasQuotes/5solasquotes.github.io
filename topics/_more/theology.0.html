<blockquote><p>15. What is philosophy, and what is its relation to theology ? Philosophy, in its wide sense, embraces all human knowledge, acquired through the use of man’s natural faculties, and consists of that knowledge interpreted and systematized by the reason. Science is more specific, relating to some special department of knowledge thoroughly reduced to system… Philosophy is presupposed, therefore, in science as the first and most general knowledge. It inquires into the soul and the laws of thought, into intuition and ultimate truth, into substance and real being, into absolute cause, the ultimate nature of force and will, into conscience and duty. As to its relations to theology it will be observed — 1st. The first principles of a true philosophy are presupposed in all theology, natural and revealed. 2d. The Holy Scriptures, although not designed primarily to teach philosophy, yet necessarily presuppose and involve the fundamental principles of a true philosophy. Not the inferences of these principles drawn out into a system, but the principles themselves, as to substance and cause, as to conscience and right, etc. … 4th. The devout believer, however, who is assured that the Bible is the very word of God, can never allow his philosophy, derived from human sources, to dominate his interpretation of the Bible, but will seek with a docile spirit and with the assistance of the Holy Spirit, to bring his own philosophy into perfect harmony with that which is implicitly contained in the Word. He will, by all means, seek to realize a philosophy which proves itself to be the genuine and natural handmaid of the religion which the Word reveals.</p></blockquote>

</figure><figure class="quote" id="q-d4371b9201" data-kw="">
<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/joel-carini.html">Joel Carini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The Natural Man does Not Accept the Things of the Spirit of God’ – But He Can Accept Natural Theology: A Response to Brian Mattson &amp; Richard Gaffin’</cite>, (2024)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.”

/a></div>
</figure><figure class="quote" id="q-595686e025" data-kw="">
<blockquote><p>Certainly [James] Arminius… saw that… the novel Pseudo-philosophy of the Jesuits was being confounded with true metaphysics and the Thomistic Scholastics… His disciples—when they perceived that the little pseudo-philosophical reasonings, by which at the beginning, and almost alone, they had assailed the received truth, were no longer a terror but a derision, and that their own theology daily grew worse—began strenuously to declaim against the philosophy of the schools, especially the metaphysical… Solid ratiocinations they call Scholastic subtleties: by this name they pretext their fault. … But [the Arminian] Vorstius, in his writings… in place of the philosophy of Aristotle and of the Scholastics—rightly emended in the reformed schools and accommodated to the truth of religion—substitutes the metaphysics of Taurellus, conjoined with the declamations of Ramus (which they call schools), with Bodin’s Theater [of Nature] from time to time employed… Let now the metaphysics and Triumphus of Taurellus be compared, with some things of Bodin added, and the declamations of Ramus, and let it be judged whether by their help the Atheistic, Epicurean, Ethnic [pagan], Judaic, Muhammadan, Enthusiastico-Libertine, Vorstian, Socinian, etc. [errors] can better be refuted than out of Thomas and the other Scholastics, and the more recent disciples of these, Suárez, Fonseca, etc. Certainly of these it may be said what was once said of Origen: where good, none better; where bad, none worse. When they are not hindered by the prejudices and authority of the corrupted religion and church of their own [communion], they render truly useful service (certain errors, and things too curious, excepted)—e.g. in the defense of the Trinity, of the divine attributes, of Christ the θεάνθρωπος [God-man], of the creation of the world, of the resurrection, of the general theses concerning the end of man, concerning the affections, faculties, etc. Hence it is that our most excellent theologians not unwillingly plow with their heifer [i.e. make use of them]—e.g. Martyr, Zanchi, Danaeus, Franciscus Junius, Ferrius, Molinaeus, Perkins, Twisse, Rutherford, etc. And the [Protestant] philosophers have, in emulation, out of the same—and chiefly out of Suárez, among the more recent—composed their own metaphysics: e.g. Cornelius Martinius, Jacobus Martinius, Combachius, Werenbergius, Scheibler, Jachaeus, Rutgersius, Burgersdicius, Senguerdius, etc. But the virtues and vices of Scholastic Theology we have explained ex professo [expressly, professedly] in the disputation On Scholastic Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-ea060bdf15" data-kw="">
<blockquote><p>Reason cannot and ought not to bring forth any mysteries, as it were, out of its own storehouse; for this is the prerogative of scripture only. Also, that reason is not to be heard when complaining of its incapacity to comprehend the mysteries of faith: for, being finite, it is no wonder that reason should not comprehend many things that relate to what is infinite; and to reject a mystery because it is incomprehensible to reason, is to offend against reason itself. Neither is reason to be listened to whenever, under cover of holding the mysteries of faith, it aims at setting up its own errors. On the very same grounds we can not call philosophy any rule of faith, although we again concede that it is of no little use, provided it assume not to itself the power of dictating in articles of faith. True philosophy indeed serves very much both to convince men and to prepare their minds; and there is a wonderful harmony between sound philosophy and divinity: for truth is not contrary to truth, nor light to light; only we must not imagine that the former is the rule by which the sense of scripture must be tried and examined.</p></blockquote>

<blockquote><p>Medieval theology received from the church fathers a great body of highly detailed doctrine, but virtually nothing that could be called a system [of] theology and, certainly, no theological prolegomena. The received body of patristic teaching was clarified and systematized… to the point that, toward the close of the twelfth century… [they] were able to draw doctrine together into collections of theological statements and definitions, the sententiae.</p></blockquote>

<blockquote><p>Objection 5… But sin unto death is sin against the Holy Spirit, as the Master [Peter Lombard] says…. Reply to Objection 5… so also among sins it is only those sins among mortal sins that are called “sins unto death” that, as far as they themselves go, are unforgivable. Therefore, sin is called “mortal” from the first death, but “unto death” because of the second death.” (Sentences, bk. 2, dist. 43, q. 1, art. 2; the ‘Exposition of the Text’ on this Distinction confirms this) For the Reformed: ‘That the Sin unto Death is the Same as the Sin Against the Holy Spirit’. . Disagreements What it is Thomas: “to sin through malice is to sin against the Holy Ghost.” (Summa, pt. 2 of 2, q. 14, art. 1) Turretin: “We say it is a universal apostasy from true Christianity or of the truth of the Gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency.” (1.647) Turretin’s view was the dominant view of the Reformed: ‘Of the Sin Against the Holy Spirit’. . Sin unto Death: Not to be Prayed for Thomas: “‘I do not say that anyone should pray for him.’ [1 Jn. 5:16]… then it must be understood in the sense that not just anyone should pray for such a sinner, since the conversion of these kinds of sinners is, as it were, miraculous. Hence just as not just anyone should pray for miracles to be performed, except great and holy men, neither should just anyone pray for the conversion of these kinds of sinners. Even so, according to the form of the words, it is not forbidden for there to be prayer for such a person.” (Sentences, bk. 2, dist. 43, ‘Exposition of the Text’) WCF 21.4: “Prayer is to be made for things lawful,[n] and for all sorts of men living… but not for… those of whom it may be known that they have sinned the sin unto death.[q] [n] 1 John 5:14 [q] 1 John 5:16</p></blockquote>

<blockquote><p>Thomas Aquinas begins Summa Theologicae Part III with reflections on the Incarnation of Christ… This section of the Summa reinvigorated Chalcedonian Christology in the West… Aquinas repeatedly affirms that Christ remains omnipresent according to his divine nature even while taking to himself a finite and circumscribed human nature, what will come to be known as the extra Calvinisticum in later centuries. Christ’s presence extra carnem, beyond the flesh, in no way separates the person of Christ but rather secures his presence with the Church.” (K.J. Drake, ‘Beyond the Flesh’) . Christ’s Human Nature: an Individual Thing Aquinas: “…although this human nature [of Christ] is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Where Reformed Orthodox Writers Agreed &amp; Disagreed with Aquinas</cite>, Extra Calvinisticum</span></figcaption>

<blockquote><p>The mode of giving supernatural grace to nature is, Junius stated, infusion, a term that is strikingly redolent of Aquinas’s conception of the mode of communicating grace.” (Seung J. Lee, Orders of Nature &amp; Grace, p. 60) Gale: “That supernatural good and virtue comes from God by divine infusion is generally asserted and demonstrated by the sectators of Augustin and Aquinas.” (4.496) . No Proper Habitual vs. Actual Grace Distinction On Maresius and Thomas: “Supernatural habits, by contrast [with natural habits], are stirred into action by the Holy Spirit, who dwells in the recipients of habitual grace (Maresius 1646-48, 2:143). Maresius disagrees with some Roman Catholic theologians, who suggest that people imbued with habitual grace require an additional gift of ‘actual grace’ before habitual grace bears fruit. For Maresius, the Spirit’s powerful presence is quite sufficient. As a result, Maresius is suspicious of the distinction between habitual and actual grace—a distinction, he notes, which is not found in Aquinas. That said, if by ‘actual grace’ is meant simply the Spirit’s activity in exciting supernatural habits into action, Maresius does not object, although he prefers the term ‘moving grace’ (Maresius 1646-48, 2:144). And since the Holy Spirit dwells with believers permanently, he argues that moving grace is also permanently present as to the principle of its motion, even if it is not permanently active.” (Stephen Hampton in Oxford Handbook of Early Modern Theology, p. 236) . Deification Thomas: “Now the gift of grace surpasses every capability of created nature, since it is nothing short of a partaking of the Divine Nature, which exceeds every other nature. And thus it is impossible that any creature should cause grace. For it is as necessary that God alone should deify [deificet], bestowing a partaking of the Divine Nature by a participated likeness, as it is impossible that anything save fire should enkindle.</p></blockquote>

<blockquote><p>But you may say that there were musical instruments in the Old Testament, as well as vocal song. Therefore, why does the Church dismiss those but accept these? A twofold mystical meaning is given, because they were figurative. According to this, the reason is that God is praised by mind and voice but not by instruments. Another reason comes from the words of the Philosopher [Aristotle], who said that it is against wisdom that men be instructed in lyric songs and music, since they would occupy their souls in these works, but there should be simple music so that they may be drawn from bodily things and brought to the divine praises.” (On Ps. 32, sect. 308) Beza, at some length, debating with Jacob Andreae (a leading Lutheran theologian), held instruments, as used by the churches in worship, to be essentially indifferent, some of the reformed finding them profitable (and using them), and some not finding them so (and not using them). (Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586, Concordia, 2017, pp. 458, 464, 479-83, 493-95) Leigh, after referencing certain reformed divines and numerous of their arguments for musical instruments in worship, says, “Not only Dr. Ames opposes it, but Aquinas, Rivet, Zanchius, Zepperus, Altingius and others’ dislike of organs and such like music in churches, and they do generally rather hinder edification.” (System of Divinity, p. 610) Ames: “Thomas Aquinas… opposes thus: ‘The Church uses no [instruments of] music for divine praises, lest it should seem to Judaize,’ and answers thus: ‘Musical instruments do more stir up the mind to delight than frame it to a right disposition. In the Old Testament there was some need of them, both, etc. and also because they did figure [signify] out something.&#x27;” (Fresh Suit, p. 405) For more of the Reformed: ‘Musical Instruments in Worship’. . Images Agreements Nature of Idolatry Owen, speaking of idolatry: “We know it to be… ‘Any religious worship of that which by nature is not God;’ and so does your Thomas grant it to be.” (14:216; Turretin, Institutes 2.44) Rutherford, in examining the nature of idolatry, approves of Thomas teaching that “the heathen acknowledged a Godhead to dwell in the images.” (Divine Right, ch. 1, question 5, p. 152) . Disagreements Images of God &amp; Christ are Not to be Made Thomas: “…images of the Trinity and of Christ should be worshiped with the same adoration with which the prototypes are worshiped…” (Summa, pt. 3, q. 25, art. 3) Vermigli: “And Thomas Aquinas is also to be wondered at, who says that God forbade the Jews that they should not make images, because at that time the Word had not taken upon it the nature of man. What is this to the purpose; seeing we speak at this present of the images and pictures of the very nature of God, which by art, colors and lineaments cannot be described? Wherefore there is all one reason, as well of the old Hebrews as of the Christians…” (Common Places, pt. 2, ch. 5, p. 340) For more of the Reformed: ‘Images of God are Forbidden’ ‘Images of Christ’ . Divine Worship Not to be Given to Images Turretin denies Thomas (Summa, pt. 3, q. 25, art. 4) on giving the worship of latria (divine worship) to the cross itself (2:53), saying “the orthodox impugn it.</p></blockquote>

<blockquote><p>Wherefore I say that by that place of the Acts of the Apostles ‘In the name of Jesus Christ,’ is meant, by the guiding, commandment, will and institution of Christ. Wherefore by these words rather it is known that the Apostles did altogether keep the form prescribed by Christ [in Mt. 28]. Otherwise they would not have baptized in the name of Christ, doing otherwise than He had commanded. Neither are we to think that the apostles who spread abroad religion with so great godliness and endeavor, rejected the form of baptizing delivered by Christ. Neither must we pass it over that the Schoolmen (as we read in Thomas) when they agree that the form of baptizing was in a manner changed by the apostles, write that this was done for a time by the dispensation of the Holy Ghost, to the intent the name of Christ might be made the more famous, and that therefore a perpetual law should not be drawn from thence… Neither is this doctrine to be suffered, that it is put in men’s authority to invert either the matter or the words of the Sacraments as these men have most impudently done: who not only have taken away the cup from the common people, but also the words spoken thereat, the which be very comfortable, and do more largely and significantly express the mysteries of our salvation than do the words which be uttered [by the papists at the Supper]…” (Common Places, pt. 4, ch. 11, p. 210) More research on the Reformed needs to be done. . Disagreements John’s Baptism Essentially the Same as Christ’s Turretin: “Was John’s baptism essentially the same as Christ’s baptism? We affirm against the Romanists [including Thomas, Summa, pt. 3, q. 38, art. 6].” (3.398) Voet: “Whether those baptized by John’s baptism afterward ought to have been baptized by Christ’s baptism? It is denied. Whether hence John’s baptism had the same efficacy with the baptism of Christ, the apostles and our baptism? It is affirmed.” (Syllabus, pt. 1, sect. 2, tract 5, appendix 1) . Only Ministers can Baptize, even in “Necessity</p></blockquote>

<blockquote><p>…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.”

ffects+of+His+power+in+a+measure+to+them+all%E2%80%A6%E2%80%9D+%28Summa%2C+pt.+3%2C+q.+52%2C+art.+2%2C+reply+to+obj.+1%29+He+did+believe%2C+though+that+Christ+delivered+the+Old+Testament+saints+in+the+Limbo+of+the+Fathers+to+Heaven+%28Summa%2C+pt.+3%2C+q.+52%2C+art.+5%29.+The+Reformed%2C+contra+the+Romanists%2C+believed%2C+%E2%80%98The+Old+Testament+Saints+went+Directly+to+Heaven+upon+Death%E2%80%99+and+denied+any+%E2%80%98Limbo+of+the+Fathers%E2%80%99.+.+Hell+Agreement+Eternal+Punishment+Thomas%2C+Summa%2C+suppl.%2C+q.+99+For+the+Reformed%3A+%E2%80%98Hell%E2%80%99.+.+The+Damned+shall+Sinfully+Blaspheme+Leigh%3A+%E2%80%9CIts+a+question+among+the+Schoolmen%2C+Whether+the+damned+blaspheme%3F+Aquinas+thinks+it+credible+that+after+the+resurrection+they+shall+vocally+blaspheme%2C+as+the+saints+shall+vocally+praise+God%3A+And+some+say%2C+%E2%80%98So+long+as+the+damned+blaspheme+God%2C+in+this+they+sin%2C+because+they+are+bound+to+an+eternal+law.%E2%80%99+After+this+life+the+demerit+of+sin+ceases%2C+%5Bas%5D+you+shall+give+an+account+for+the+things+done+in+the+body%2C+2+Cor.+5%3A10.+The+soul+sins+after%2C+but+shall+not+be+judged+for+those+sins%3B+as+in+Heaven+good+actions+%E2%80%98pertain+to+the+reward+of+blessedness%2C%E2%80%99+so+in+hell+evil+actions+%E2%80%98pertain+to+the+penalty+of+damnation%2C%E2%80%99+says+Aquinas+in+the+same+place.%E2%80%9D+%28System+of+Divinity%2C+p.+344%29+.+Disagreements+No+Fourfold+Hell+Turretin+notes+how+%E2%80%9Cthe+papists+make+a+fourfold+hell%2C%E2%80%9D+including+%281%29+hell+proper%2C+%282%29+purgatory%2C+%283%29+the+eternal+limbo+of+infants+with+the+suffering%2C+not+of+sense%2C+but+of+loss%2C+and+%284%29+the+limbo+of+the+Old+Testament+fathers%2C+temporally+suffering+loss+only%2C+till+Christ+delivered+them+by+his+death%2C+citing+Thomas+and+others%2C+and+argues+at+length+specifically+against+the+limbo+of+the+fathers.+%282.257%29+.+Nature+of+Hell-Fire+is+Not+Clearly+Determinable+Thomas%3A+%E2%80%9C%E2%80%A6they+will+be+punished+in+a+physical+fire.%E2%80%9D+%28Sentences%2C+bk.+4%2C+dist.+44%2C+q.+3%2C+art.+2%2C+quaestiuncula+2%29+Voet%3A+%E2%80%9CWhether+true+fire+is+given+in+Hell%2C+or+whether+it+is+only+metaphorical%3F+It+is+not+said+and+it+is+permitted+to+be+inquired+into.+Whether+it+is+corporal+or+rather+spiritual%3F+The+question+is+inept.+Whether+it+is+of+the+same+species+with+our+fire%3F+The+question+is+curious%E2%80%A6+Is+it+an+error+of+the+Faith+to+suppose+an+incorporeal+and+immaterial+infernal+fire%3F+The+question+is+absurd.%E2%80%9D+%28Syllabus%2C+sect.+2%2C+tract+6%2C+title+6%2C+subtitle+2%2C+%E2%80%98Of+Infernal+Fire%E2%80%99%29+.+Heaven+Agreements+Saints+do+Not+See+All+Things+on+Earth+through+God+Turretin+contends+against%2C+%E2%80%9Cas+the+papists+wish%E2%80%A6+the+imaginary+mirror+of+the+Trinity%2C+which+they+feign+%28as+if+saints%2C+seeing+all+things+in+the+essence+of+God+saw+all+things+done+here%29+%5Bto+support+the+intercession+of+the+saints%5D%E2%80%A6+It+displeased+not+a+few+of+the+distinguished+papists%3A+Lombard%2C+Thomas+Aquinas+%5BSumma%2C+suppl.+92%2C+art.+3%5D%E2%80%A6%E2%80%9D+%282.43%29+.+Saints+will+See+Punishment+of+the+Damned+Leigh%3A+%E2%80%9CAquinas+has+this+question%2C+Whether+the+blessed+which+are+in+the+Fatherland+see+the+punishment+of+the+damned%3F+and+resolves+they+shall%2C+because+it+makes+to+the+perfection+of+their+blessedness%2C+%E2%80%98Opposites+placed+next+to+each+other+shine+forth+more+brightly.%E2%80%99+They+shall+perfectly+see+the+punishment+of+the+wicked%2C+that+their+blessedness+may+the+more+content+them+and+they+may+give+more+abundant+thanks+to+God.%E2%80%9D+%28System+of+Divinity%2C+p.+872%29+.+The+Heaven+of+God%E2%80%99s+Throne+Room+will+Not+be+Renovated+with+Fire+Thomas%3A+%E2%80%9C%E2%80%A6the+higher+heavens+will+not+be+cleansed+by+that+fire%E2%80%A6+The+cleansing+of+the+world+will+be+for+the+purpose+of+removing+from+bodies+the+disposition+contrary+to+the+perfection+of+glory%E2%80%A6+Peter+explains+himself+to+which+heavens+he+refers%E2%80%A6+%E2%80%98the+heavens+first%2C+and+the+earth+through+water+perished%2C+which+now+by+the+same+word+are+kept+in+store%2C+reserved+unto+fire+unto+the+day+of+judgment%E2%80%99+%282+Pet+5%3A5%E2%80%937%29%E2%80%A6+Nor+did+the+empyrean+heaven+contract+any+stain%E2%80%A6%E2%80%9D+%28Summa%2C+suppl.%2C+q.+74%2C+art.+4%29+For+the+Reformed%3A+%E2%80%98On+the+Renovation%2C+New+Heavens+%26+Earth%E2%80%99.+.+Mixed+Deification+Thomas+affirmed+a+kind+of+deification+of+heavenly+saints+with+respect+to+the+light+of+glory+and+the+beatific+vision.+Yet+for+Thomas%2C+%E2%80%9Cthe+light+of+glory%2C+like+the+habit+of+grace%2C+is+something+created.+So+in+either+state%2C+pre-+or+post-mortem%2C+deification+is+something+created.%E2%80%9D+%28p.+32%29+This+is+in+contrast+to+deification+being+grounded+in+uncreated+grace%2C+per+the+Eastern+Orthodox%2C+which+entails+the+host+of+problems+often+associated+with+the+term.+See+Richard+Cross%2C+%E2%80%98Deification+in+Aquinas%E2%80%99.+Yet+many+of+the+Reformed+were+hesitant+or+contrary+to+accepting+Thomas%E2%80%99s+exact+method+and+paradigm+of+how+saints+see+God.+See+on+the+Beatific+Vision+below.+Yet%2C+Carl+Mosser+has+found+the+concept+and%2For+terminology+of+deification%2C+in+protestant+senses%2C+in+Martin+Luther%2C+Ulrich+Zwingli%2C+Martin+Bucer%2C+Henry+Bullinger%2C+John+Calvin%2C+Richard+Hooker+and+Jonathan+Edwards%3A+%E2%80%98Deification%3A+a+Truly+Ecumenical+Concept%E2%80%99+and+%E2%80%98Recovering+the+Reformation%E2%80%99s+Ecumenical+Vision+of+Redemption+as+Deification+and+Beatific+Vision%E2%80%99.+Using+the+term+of+deification+for+growing+more+and+more+into+the+image+of+God%2C+through+beholding+Him%2C+for+all+eternity%2C+is+not+to+no+purpose.+2+Pet.+1%3A4+says+%E2%80%9Cthat+by+these%2C%E2%80%9D+including+godliness%2C+all+graces+and+the+promises+of+God%2C+including+that+of+glorification%2C+%E2%80%9Cye+might+be+partakers+of+the+divine+nature%E2%80%9D.+Ps.+17%3A15%3A+%E2%80%9CAs+for+me%2C+I+will+behold+thy+face+in+righteousness%3A+I+shall+be+satisfied%2C+when+I+awake%2C+with+thy+likeness.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+Where+Reformed+Orthodox+Writers+Agreed+%26+Disagreed+with+Aquinas%2C+Purgatory+is+Not+Real%2C+Ussher%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F672ce0b2da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/672ce0b2da.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/where-reformed-orthodox-writers-agreed-disagreed-with-aquinas/#:~:text=this%20being%20a%20case%20with%20them,when%20I%20awake%2C%20with%20thy%20likeness&amp;text=this%20being%20a%20case%20with%20them%20%5B%E2%80%9Cour%20Romanists&amp;text=be%20satisfied%2C%20when%20I%20awake%2C%20with%20thy%20likeness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For indeed, as the Creator of all things, He was from the beginning discovered equally with them, they having been themselves manifested that He might become known as God. For although Moses, some long while afterwards, seems to have been the first to introduce the knowledge of the God of the universe in the temple of his writings, yet the birthday of that knowledge must not on that account be reckoned from the Pentateuch. For the volume of Moses does not at all initiate the knowledge of the Creator, but from the first gives out that it is to be traced from Paradise and Adam, not from Egypt and Moses. The greater part, therefore, of the human race, although they knew not even the name of Moses, much less his writings, yet knew the God of Moses; and even when idolatry overshadowed the world with its extreme prevalence, men still spoke of Him separately by His own name as God, and the God of gods, and said, “If God grant,” and, “As God pleases,” and, “I commend you to God.” Reflect, then, whether they knew Him, of whom they testify that He can do all things. To none of the writings of Moses do they owe this. The soul was before prophecy. From the beginning the knowledge of God is the dowry of the soul, one and the same amongst the Egyptians, and the Syrians, and the tribes of Pontus. For their souls call the God of the Jews their God. Do not, O barbarian heretic, put Abraham before the world. Even if the Creator had been the God of one family, He was yet not later than your god; even in Pontus was He known before him. Take then your standard from Him who came first: from the Certain (must be judged) the uncertain; from the Known the unknown. Never shall God be hidden, never shall God be wanting. Always shall He be understood, always be heard, nay even seen, in whatsoever way He shall wish. God has for His witnesses this whole being of ours, and this universe wherein we dwell. He is thus, because not unknown, proved to be both God and the only One, although another still tries hard to make out his claim.</p></blockquote>

e+him.+Take+then+your+standard+from+Him+who+came+first%3A+from+the+Certain+%28must+be+judged%29+the+uncertain%3B+from+the+Known+the+unknown.+Never+shall+God+be+hidden%2C+never+shall+God+be+wanting.+Always+shall+He+be+understood%2C+always+be+heard%2C+nay+even+seen%2C+in+whatsoever+way+He+shall+wish.+God+has+for+His+witnesses+this+whole+being+of+ours%2C+and+this+universe+wherein+we+dwell.+He+is+thus%2C+because+not+unknown%2C+proved+to+be+both+God+and+the+only+One%2C+although+another+still+tries+hard+to+make+out+his+claim.%E2%80%9D%0A%0A%E2%80%94+Tertullian%2C+The+Five+Books+against+Marcion%2C+in+Latin+Christianity%3A+Its+Founder%2C+Tertullian%2C+ed.+Alexander+Roberts%2C+James+Donaldson%2C+and+A.+Cleveland+Coxe%2C+trans.+Peter+Holmes%2C+vol.+3%2C+The+Ante-Nicene+Fathers+%28Buffalo%2C+NY%3A+Christian+Literature+Company%2C+1885%29%2C+1.10+%28p.+278%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff030809bf0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f030809bf0.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/11/tertullian-on-the-natural-knowledge-of-god/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-025aa1fdd7" data-kw="">
<blockquote><p>These are “the doctrines” of men and “of demons” produced for itching ears of the spirit of this world’s wisdom: this the Lord called “foolishness,” and “chose the foolish things of the world” to confound even philosophy itself. For (philosophy) it is which is the material of the world’s wisdom, the rash interpreter of the nature and the dispensation of God. Indeed heresies are themselves instigated by philosophy. From this source came the Æons, and I known not what infinite forms, and the trinity of man in the system of Valentinus, who was of Plato’s school. From the same source came Marcion’s better god, with all his tranquillity; he came of the Stoics. Then, again, the opinion that the soul dies is held by the Epicureans; while the denial of the restoration of the body is taken from the aggregate school of all the philosophers; also, when matter is made equal to God, then you have the teaching of Zeno; and when any doctrine is alleged touching a god of fire, then Heraclitus comes in. The same subject-matter is discussed over and over again by the heretics and the philosophers; the same arguments are involved. Whence comes evil? Why is it permitted? What is the origin of man? and in what way does he come? Besides the question which Valentinus has very lately proposed—Whence comes God? Which he settles with the answer: From enthymesis and ectroma. Unhappy Aristotle! who invented for these men dialectics, the art of building up and pulling down; an art so evasive in its propositions, so far-fetched in its conjectures, so harsh, in its arguments, so productive of contentions—embarrassing even to itself, retracting everything, and really treating of nothing! Whence spring those “fables and endless genealogies,” and “unprofitable questions,” and “words which spread like a cancer?”From all these, when the apostle would restrain us, he expressly names philosophy as that which he would have us be on our guard against. Writing to the Colossians, he says, “See that no one beguile you through philosophy and vain deceit, after the tradition of men, and contrary to the wisdom of the Holy Spirit.”He had been at Athens, and had in his interviews (with its philosophers) become acquainted with that human wisdom which pretends to know the truth, whilst it only corrupts it, and is itself divided into its own manifold heresies, by the variety of its mutually repugnant sects. What indeed has Athens to do with Jerusalem? What concord is there between the Academy and the Church? what between heretics and Christians? Our instruction comes from “the porch of Solomon,” who had himself taught that “the Lord should be sought in simplicity of heart.”Away with all attempts to produce a mottled Christianity of Stoic, Platonic, and dialectic composition! We want no curious disputation after possessing Christ Jesus, no inquisition after enjoying the gospel! With our faith, we desire no further belief. For this is our excellent faith, that there is nothing which we ought to believe besides.</p></blockquote>

<blockquote><p>The law is known partly by the light of nature (Rom. 2:14–15), but the gospel is known only by a revelation from heaven (Matt. 11:27). Man, though he is a fallen creature, has in some degree a natural knowledge of the law, but he has no natural knowledge of the gospel. The gospel was wrapped up in profound secrecy till it was revealed from heaven by the Son of God immediately after the fall, and therefore it is called “the mystery,” and “the mystery of Christ” (Rom. 16:25; Eph. 3:4). Hence, unregenerate sinners are commonly not so averse from hearing the doctrine of the law as they are from hearing that of the gospel. Legal doctrine they can naturally understand, for it has a testimony in their consciences; but evangelical doctrine is a strange, unaccountable, and incredible doctrine to them (1 Cor. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 132.</span></figcaption>

<blockquote><p>Fully adequate [exhaustive] knowledge is something of which we possess very little. Everywhere and in every area of life we finally run into mystery. The inner being of things, the thing as such, escapes our perception. We observe phenomena and from them infer the essence of things; we learn to know stable properties and from them we deduce the substance, but this substance itself lies behind the phenomenon and as such is unknown to us. Physics assumes the existence of atoms or electrons or energies as the final components of the material world, but does not have even a smidgen of empirical knowledge of them. Only the most simple things can be defined. As soon as things are of a somewhat higher order, they can no longer be completely captured in a concept. This is already true of the visible world, but it is even more applicable in the world of invisible things. Human beings are corporeal, sense-oriented beings. All their knowledge originates in, and arises from, sense perception. Our thinking is bound up with our senses, just as our soul is with our body. We never perceive spiritual realities directly but only by the medium of material things. We see all things ‘dimly.’ Not only God but also the soul and the entire spiritual world only become known to us through the medium of the world of the senses. This is why we refer to all spiritual matters with names that have their primary reference in the visible world… The same is true in religion and theology. There is no fully adequate knowledge of God. We cannot name him as he is within himself. All his names are derived from the world of creatures. But this does not make them untrue, a product of human imagination. Just as there is resemblance between various parts of the world, making comparison between them a possibility, so also there is kinship between God and his creatures, a kinship that warrants the use of creaturely language in speaking of him. Furthermore, though temporally the natural is prior to the spiritual, logically and ideally the spiritual precedes the natural. The natural could never guide us to the spiritual if it had not itself proceeded from the spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, Volume 2: God and Creation</cite>, trans. John Vriend, ed. John Bolt (Grand Rapids: Baker Academic, 2004), 144–45.</span></figcaption>

<blockquote><p>Aristotle said it with style: people who set their heart on, proving to themselves with drawn-out arguments “that some providence is,” actually deserve whips, not words; a reply from an executioner, not a philosopher (nor, I add, a theologian). And what is more: if “that fire is hot,” something we perceive with touch; or “that noonday is light to our sense perception,” something we perceive with sight, do not require demonstration, then much less will divine providence, require it.</p></blockquote>

<blockquote><p>…That three things are recorded as created, namely, the heaven, the water, and the earth; and these three received their form from the three days’ work of distinction, so that heaven was formed on the first day; on the second day the waters were separated; and on the third day, the earth was divided into sea and dry land. So also is it in the work of adornment; on the first day of this work, which is the fourth of creation, are produced the lights, to adorn the heaven by their movements; on the second day, which is the fifth, birds and fishes are called into being, to make beautiful the intermediate element, for they move in air and water, which are here taken as one; while on the third day, which is the sixth, animals are brought forth, to move upon the earth and adorn it.</p></blockquote>

</figure><figure class="quote" id="q-f5fd75eefd" data-kw="">
<blockquote><p>An extreme opinion on this subject has been held by some Christians, to the effect that no true and certain knowledge of God can be derived by man, in his present condition, from the light of nature in the entire absence of a supernatural revelation; that we are altogether dependent upon such a revelation for any certain knowledge that God exists, as well as for all knowledge of his nature and his purposes. This opinion is disproved: (a.) By the direct testimony of Scripture. Rom. 1:20–24; 2:14, 15. (b.) By the fact that many conclusive arguments for the existence of a great first Cause, who is at the same time an intelligent personal Spirit and righteous moral Governor, have been drawn by a strict induction from the facts of nature alone, as they lie open to the natural understanding. The fact that this argument remains unanswerable shows that the process by which the conclusions are drawn from purely natural sources is legitimate. (c.) All nations, however destitute of a supernatural revelation they may have been, have yet possessed some knowledge of a God. And in the case of the most enlightened of the heathen, natural religion has given birth to a considerable natural theology. We must, however, distinguish between that knowledge of the divine character which may be obtained by men from the works of nature and providence in the exercise of their natural powers alone, without any suggestions or assistance derived from a supernatural revelation—as is illustrated in theological writings of some most eminent of the heathen who lived before Christ—and that knowledge which men in this age, under the clear light of a supernatural revelation, are competent to deduce from a study of nature. The natural theology of the modern rationalists demonstrably owes all its special excellences to that Christian revelation it is intended to supersede.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, (Philadelphia: Presbyterian Board of Publications, 1920), 45–46.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>Wherefore when this Word of God is now preached in the church by preachers lawfully called, we believe that the very Word of God is proclaimed, and received by the faithful; and that neither any other Word of God is to be invented nor is to be expected from heaven: and that now the Word itself which is preached is to be regarded, not the minister that preaches; for even if he be evil and a sinner, nevertheless the Word of God remains still true and good.</p></blockquote>

<blockquote><p>It should be carefully noted that our criticism of this procedure does not imply that we hold it to be wrong for the Christian church to make formal use of the categories of thought discovered by Aristotle or any other thinker. On the contrary, we believe that in the Providence of God, Aristotle was raised up of God so that he might serve the church of God by laying at its feet the measures of his brilliant intellect. When Solomon built the temple of God he was instructed to make use of the peculiar skill and the peculiar gifts of the pagan nation that was his neighbor. But this was something quite different than to build together with pagan nations. The Samaritans wanted to help the Jews construct the city and the temple. Hence they were rejected by the true Jews. The Phoenicians merely wanted to bring their treasures to Solomon and let him construct the way he saw fit. Hence they were gladly received by Solomon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of Christian Epistemology</cite>, (The Presbyterian and Reformed Publishing Company: Phillipsburg, NJ, 1969).</span></figcaption>

<blockquote><p>…those who founded sects committed to erroneous doctrines proceeded in a way that is opposite to this, The point is clear in the case of Muhammad. He seduced the people by promises of carnal pleasure to which the concupiscence of the flesh goads us. His teaching also contained precepts that were in conformity with his promises, and he gave free rein to carnal pleasure. In all this, as is not unexpected, he was obeyed by carnal men. As for proofs of the truth of his doctrine, he brought forward only such as could be grasped by the natural ability of anyone with a very modest wisdom. Indeed, the truths that he taught he mingled with many fables and with doctrines of the greatest falsity. He did not bring forth any signs produced in a supernatural way, which alone fittingly gives witness to divine inspiration; for a visible action that can be only divine reveals an invisibly inspired teacher of truth. On the contrary, Muhammad said that he was sent in the power of his arms—which are signs not lacking even to robbers and tyrants. What is more, no wise men, men trained in things divine and human, believed in him from the beginning, Those who believed in him were brutal men and desert wanderers, utterly ignorant of all divine teaching, through whose numbers Muhammad forced others to become his followers by the violence of his arms. Nor do divine pronouncements on the part of preceding prophets offer him any witness. On the contrary, he perverts almost all the testimonies of the Old and New Testaments by making them into fabrications of his own, as can be seen by anyone who examines his law. It was, therefore, a shrewd decision on his part to forbid his followers to read the Old and New Testaments, lest these books convict him of falsity. It is thus clear that those who place any faith in his words believe foolishly.</p></blockquote>

<blockquote><p>The Starting point of theory of knowledge ought to be ordinary daily experience, the universal and natural certainty of human beings concerning the objectivity and truth of their knowledge. After all, it is not philosophy that creates the cognitive faculty and cognition. Philosophy only finds it and then attempts to explain it. Any solution that does not explain the cognitive faculty but instead destroys it and, failing to understand cognition, turns it into an illusion, is judged by that fact. Only a theory of knowledge that penetrates the very depths of the problem has a chance to succeed.</p></blockquote>

<blockquote><p>III. Let then these things be premised. First. Reason signifies either that faculty of man where by he perceives, and judgeth, and distinguisheth truth from falsehood, or those maxims, aphorisms, or axioms, which are either self evident, or believed to be rightly drawn from evident principles. Secondly. Right reason, considered as a faculty, is that which being endued with sufficient light, conceives things, or judgeth concerning them, no otherwise than as they truly are; and is opposed to corrupt, erroneous, blind reason which frequently forms very wrong conceptions and judgements of things. Considered as an axiom, by right reason is meant most certain and evident principles, or inferences drawn there from by plain and evident consequence; and is opposed to rash assertions, spoken without any just examination, or test, of the things so affirmed. Thirdly. Reason is fully persuaded that it judgeth right, when the conceptions, or ideas, of things are clearly and distinctly perceived; nevertheless the often discovers herself to have been mistaken, whilst she thought that she perceived something clearly and distinctly, when at the same time she was in an error. Fourthly. In as far as reason denotes a faculty, it is the next efficient cause of perception and judgement; not the rule: but as it signifies evident and certain axioms it may so far have the nature of a rule that whatever is rejected for false is plainly repugnant to a position of manifest truth, or is not a just and legitimate inference. Fifthly. Faith here notes an assent given to some truth, not on account of the evidence of the thing,* but on account of the testimony of God; who, as he is the supreme truth, bears witness of himself. John 3:33. 1 John 5:9, 10. Sixthly. Those are called the mysteries of faith which no man was ever able to find out by his own reasoning powers, but are known by the revelation of God alone, and are opposed to that which may be known of God by the light of nature. Rom. 1:19. 1 Cor. 2:7. Eph. 3:3. Seventhly. That revelation is contained in the sacred books of the Old and New Testament, which evince their authenticity to the conscience of a serious enquirer, duly attending to the external and internal marks of their divinity; and, if any thing be there plainly taught, it is certainly a great crime to treat them with reproach, under any pretence whatever. IV. These things being premised; the Question is not, Whether the scripture may teach some mysteries contrary to right reason? Nor, whether reason may ever oppose itself to the doctrine of the scripture, under pretence of its own rectitude? Nor, whether investigating the sense of scripture, reason be of great use? For this would be an ambiguous statement of the subject. But, when we enquire into the meaning of the holy scriptures, the question is, Whether then the dictates of what is accounted right reason, must be first consulted, that it may in the first place determine, concerning the things themselves, whether they be worthy a divine revelation; or, whether we ought simply to attend to what the words, in all their circumstances, properly signify, so that what they are found to mean, may forthwith be received for true, without any farther test, or examination, of the things according to pretended axioms of reason? Or, (more briefly stated) whether it is better to explain the words of scripture so that they may agree with the axioms of reason, or to correct the axioms of reason to that sense which the words of scripture plainly speak? The Socinians contend for the former, and support it by their practice; and I wish they only did so: the Orthodox maintain the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on the Use and Abuse of Reason in Matters of Religion</cite>, trans. John Carter (Norwich: Crouse, Stevenson and Matchett, 1795), 4–7.</span></figcaption>

<blockquote><p>Alongside of the archetypal knowledge of God, found in God Himself, there is also an ectypal knowledge of Him, given to man by revelation. The latter is related to the former as a copy is to the original, and therefore does not possess the same measure of clearness and perfection. All our knowledge of God is derived from His self-revelation in nature and in Scripture. Consequently, our knowledge of God is on the one hand ectypal and analogical, but on the other hand also true and accurate, since it is a copy of the archetypal knowledge which God has of Himself.</p></blockquote>

<blockquote><p>True philosophy, although it also differs very much from the doctrine of the church, yet, it does not array itself against it nor is it a wicked fabrication and device of Satan, as is true of the false doctrines of the sects, but it contains truth and is, as it were, a certain ray of the wisdom of God, impressed upon the mind of man in his creation. It is a doctrine that has respect to God and his creatures and many other things that are good and profitable to mankind and has been drawn out from the light of nature and from principles, in themselves clear and evident, and reduced to a system by wise and earnest men. It follows, therefore, that it is not only lawful but also profitable for Christians to devote themselves to the study of philosophy.</p></blockquote>

<blockquote><p>19. That person does not deserve to be called a theologian who looks upon the invisible things of God as though they were clearly perceptible in those things which have actually happened (Rom. 1:20; cf. 1 Cor 1:21-25), 20. He deserves to be called a theologian, however, who comprehends the visible and manifest things of God seen through suffering and the cross. 21. A theology of glory calls evil good and good evil. A theology of the cross calls the thing what it actually is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Disputation</cite>, (1518)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“19. That person does not deserve to be called a theologian who looks upon the invisible things of God as though they were clearly perceptible in those things which have actually happened (Rom. 1:20; cf. 1 Cor 1:21-25), 20. He deserves to be called a theologian, however, who comprehends the visible and manifest things of God seen through suffering and the cross. 21. A theology of glory calls evil good and good evil. A theology of the cross calls the thing what it actually is.”

— Martin Luther, Heidelberg Disputation, (1518)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C19.+That+person+does+not+deserve+to+be+called+a+theologian+who+looks+upon+the+invisible+things+of+God+as+though+they+were+clearly+perceptible+in+those+things+which+have+actually+happened+%28Rom.+1%3A20%3B+cf.+1+Cor+1%3A21-25%29%2C+20.+He+deserves+to+be+called+a+theologian%2C+however%2C+who+comprehends+the+visible+and+manifest+things+of+God+seen+through+suffering+and+the+cross.+21.+A+theology+of+glory+calls+evil+good+and+good+evil.+A+theology+of+the+cross+calls+the+thing+what+it+actually+is.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Heidelberg+Disputation%2C+%281518%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b9a7068cc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2b9a7068cc.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/01/theology-of-cross-vs-theology-of-glory/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-980568f110" data-kw="">
<blockquote><p>A controversy respecting the atonement sprang up between Duns Scotus and the followers of Aquinas, which involved fundamental principles in ethics and religion, and divided the Romish Church into two great parties of Thomists and Scotists. Duns Scotus denied the Anselmic doctrine that sin is of infinite demerit, and consequently denied that the suffering of Christ is of infinite value. The relation of the atonement of the Son of God to the sin of mankind, he maintained, is merely an arbitrary and constituted one. The principle upon which he founded his theory was: “Tantum valet omne creatum oblatum, pro quanto acceptat Deus illud, et non plus.” There is no interior fitness and adaptation between Christ’s atonement and man’s sin. God was pleased to accept this particular sacrifice as an offset and equivalent for human transgression, not from any intrinsic value in it, but because he so pleased. He might have accepted any other substitute, or he might have dispensed with accepting any substitute at all. In opposition to this view, the followers of Aquinas maintained the old Anselmic theory of the infinite demerit of sin, and the infinite and objective value of Christ’s satisfaction. In this controversy, the soteriology of the adherents of Aquinas is more in harmony with the Protestant view and feeling; so that we might reverse what Melanchthon remarks of Augustine, and say, that “the opinion of Aquinas is more pertinent, fit and convenient when he disputed than it was when not disputing.” And yet it would be difficult to see how the followers of Aquinas could in the end avoid the conclusions of Duns Scotus, if they started from that doctrine of a relative necessity of satisfying justice which we have seen Aquinas held, in common with all the Schoolmen excepting Anselm. If omnipotence and bare will are more ultimate in the Divine Nature than justice and truth are, then it is difficult to see how Scotus can be censured for holding, that in the last analysis God can dispense with an atonement altogether, and that whatever value the existing judicial provision possesses in the divine plan, it possesses not in itself, but solely by virtue of its optional acceptance by the Omnipotent One who is not limited by anything, not even by his own moral attributes. The controversy, however, ran high between the adherents of Aquinas and Scotus,—the Dominican order generally siding with the former, and the Franciscan with the latter. The Nominalists in philosophy also naturally favoured the views of Scotus, as his theory was that of a nominal and putative satisfaction, in distinction from a real and objective one. The extravagantly speculative minds of the age, those who have given the reputation of hair-splitting and excessive dialectics to Scholasticism, also adopted the positions of Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Theology</cite>, (New York: Scribners) 2.315</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-162a9cd4cd" data-kw="">
<blockquote><p>Now indeed these two kinds of theology are so different that they cannot truthfully be related to some one, definite head and shared genus. Of course the first kind of theology, which we have named divine and a prototype, does not belong to the one genus nor indeed to the other. The nature of the first kind of theology and of the second kind makes clear that its genus is not common with this created theology. For that essential, archetypal theology is a characteristic of the nature of God, and part (as we would put it) of that infinite knowledge which in God is essential. Whatever is essential, moreover, it is agreed that this is properly assigned to the same genus, together with the actual essence of which that thing is essential; so we speak of part for whole, and limb for body of the same kind, and sharing in the genus. God, however, is above every genus, essence beyond essence, as the holy fathers very aptly called Him. This theology in fact does not belong to the essence of those things to which it pertains, but attaches to them like a garment, as it were, enrobing their essence so to speak. And hence it is as far removed from that essence (so that I may use a common expression) as is heaven from earth. That it is not a part of that genus which we were discussing in the second passage, nature itself and reason show with all possible clarity. For if in fact it is essential, as it is, and in that respect of the same kind as the nature of God, certainly its reason will be the same and of the divine essence. But since that divine essence or nature is truly beyond essence and is limited by nothing shared with any other genus whether properly or improperly, that is, simply or by reduction, we claim most properly and certainly that this theology is beyond essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, 105.</span></figcaption>

<blockquote><p>That the observances of the old law are better called signs than sacraments. For those things which were instituted only for the sake of signifying are merely signs, and not sacraments; such were the carnal sacrifices and the ceremonial observances of the Old Law, which could never justify those who offered them. As the Apostle says, “the blood of goats and of oxen, and the ashes of an heifer being sprinkled, sanctified such as are defiled, for the cleansing of the flesh,” [Heb 9:13] ‘not of the soul’ [Glossa Ordinaria] because the defilement arose from contact with the dead.—Augustine. Hence Augustine: ‘By that defilement which the Law cleanses, I understand noting other than contact with a dead person; anyone who touched such a person was unclean for seven days; but according to the Law he was purified on the third and seventh day, and was cleansed,’ so that he might enter the Temple. At times, those legal observances also cleansed ‘from bodily leprosy’; but as the Apostle says, no one was ever justified by the words of the Law, even if they were done in faith and charity. Why? —Ambrose, On the Letter to the Hebrews: ‘Because God imposed them for servitude, not for justification, and that they should be a figure of the future, willing them to be offered to himself rather than to idols.’ —And so they were sings; and Scriptures, because they were signs of a sacred thing, which they certainly did not confer. 4. Which things are called works of the Law. The Apostle calls those things the works of the Law which were instituted only for the sake of signifying, or as a burden.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“That the observances of the old law are better called signs than sacraments. For those things which were instituted only for the sake of signifying are merely signs, and not sacraments; such were the carnal sacrifices and the ceremonial observances of the Old Law, which could never justify those who offered them. As the Apostle says, “the blood of goats and of oxen, and the ashes of an heifer being sprinkled, sanctified such as are defiled, for the cleansing of the flesh,” [Heb 9:13] ‘not of the soul’ [Glossa Ordinaria] because the defilement arose from contact with the dead.—Augustine. Hence Augustine: ‘By that defilement which the Law cleanses, I understand noting other than contact with a dead person; anyone who touched such a person was unclean for seven days; but according to the Law he was purified on the third and seventh day, and was cleansed,’ so that he might enter the Temple. At times, those legal observances also cleansed ‘from bodily leprosy’; but as the Apostle says, no one was ever justified by the words of the Law, even if they were done in faith and charity. Why? —Ambrose, On the Letter to the Hebrews: ‘Because God imposed them for servitude, not for justification, and that they should be a figure of the future, willing them to be offered to himself rather than to idols.’ —And so they were sings; and Scriptures, because they were signs of a sacred thing, which they certainly did not confer. 4. Which things are called works of the Law. The Apostle calls those things the works of the Law which were instituted only for the sake of signifying, or as a burden.”

<blockquote><p>Nineteenth-century Thomists like Joseph Kleutgen (1811-83) sought to revive the Aristotelian-Thomistic tradition in the face of these modern developments, and their efforts were massively aided by Pope Leo XIII’s encyclical Aeterni Patris (1879), which called for a renewal of Thomism, and of Scholastic philosophy in general. The result was a Neo-Thomistic and Neo-Scholastic movement which marked a third phase in the history of Thomism, dominated Roman Catholic thought until the Second Vatican Council (1962-65), and has dramatically influenced the modern understanding of Aquinas’s thought down to the present day. Several schools of thought describing themselves as ‘Thomistic’ have developed over the course of the last century or so, each representing a different response to the characteristic themes and assumptions of modern philosophy. Since they have had such a profound influence on the contemporary debate over Aquinas’s thought, it will be worthwhile briefly to describe the main positions: 1. Neo-Scholastic Thomism: The dominant tendency within Thomism in the first decades after the revival sparked by Leo’s encyclical, this approach is reflected in many of the manuals and textbooks widely in use in Roman Catholic colleges and seminaries before Vatican II. Due to its emphasis on following the interpretative tradition of the great commentators on Aquinas (such as Capreolus, Cajetan, and John of St. Thomas) and associated suspicion of attempts to synthesize Thomism with non-Thomistic categories and assumptions, it has also sometimes been labeled “Strict Observance Thomism.” Still, its focus was less on exegesis of the historical Aquinas’s own texts than on carrying out the program of deploying a rigorously worked out system of Thomistic metaphysics in a wholesale critique of modern philosophy. Its core philosophical commitments are summarized in the famous “Twenty-Four Thomistic Theses” approved by Pope Pius X. Reginald Garrigou-Lagrange (1877-1964) is perhaps its greatest representative. 2. Existential Thomism: Etienne Gilson (1884-1978), the key proponent of this approach to Thomism, tended to emphasize the importance of historical exegesis but also to deemphasize Aquinas’s continuity with the Aristotelian tradition, highlighting instead the originality of Aquinas’s doctrine of being or existence. He was also critical of the Neo-Scholastics’ focus on the tradition of the commentators, and given what he regarded as their insufficient emphasis on being or existence accused them of ‘essentialism’ (to allude to the other half of Aquinas’s distinction between being and essence). Gilson’s reading of Aquinas as putting forward a distinctively ‘Christian philosophy’ tended, at least in the view of his critics, to blur Aquinas’s distinction between philosophy and theology. Jacques Maritain (1882-1973) introduced into Thomistic metaphysics the notion that philosophical reflection begins with an ‘intuition of being,’ and in ethics and social philosophy sought to harmonize Thomism with personalism and pluralistic democracy. Though “existential Thomism” was sometimes presented as a counterpoint to modern existentialism, the main reason for the label is the emphasis this approach puts on Aquinas’s doctrine of existence. Contemporary proponents include Joseph Owens and John F. X. Knasas. 3. Laval or River Forest Thomism: This approach emphasizes the Aristotelian foundations of Aquinas’s philosophy, and in particular the idea that the construction of a sound metaphysics must be preceded by a sound understanding of natural science, as interpreted in light of an Aristotelian philosophy of nature. Accordingly, it is keen to show that modern physical science can and should be given such an interpretation. Charles De Koninck (1906-1965), James A. Weisheipl (1923-1984), William A. Wallace, and Benedict Ashley are among its representatives. It is sometimes called “Laval Thomism” after the University of Laval in Quebec, where De Koninck was a professor. The alternative label “River Forest Thomism” derives from a suburb of Chicago, the location of the Albertus Magnus Lyceum for Natural Science, whose members are associated with this approach. It is also sometimes called ‘Aristotelian Thomism’ (to highlight its contrast with Gilson’s brand of existential Thomism) though since Neo-Scholastic Thomism also emphasizes Aquinas’s continuity with Aristotle, this label seems a bit too proprietary. (There are writers, like the contemporary Thomist Ralph McInerny, who exhibit both Neo-Scholastic and Laval/River Forest influences, and the approaches are not necessarily incompatible.) 4. Transcendental Thomism: Unlike the first three schools mentioned, this approach, associated with Joseph Marechal (1878-1944), Karl Rahner (1904-84), and Bernard Lonergan (1904-84), does not oppose modern philosophy wholesale, but seeks to reconcile Thomism with a Cartesian subjectivist approach to knowledge in general, and Kantian epistemology in particular. It seems fair to say that most Thomists otherwise tolerant of diverse approaches to Aquinas’s thought tend to regard transcendental Thomism as having conceded too much to modern philosophy genuinely to count as a variety of Thomism, strictly speaking, and this school of thought has in any event been far more influential among theologians than among philosophers. 5. Lublin Thomism: This approach, which derives its name from the University of Lublin in Poland where it was centered, is also sometimes called “phenomenological Thomism.” Like transcendental Thomism, it seeks to combine Thomism with certain elements of modern philosophy, though in a way that is less radically revisionist. In particular, it seeks to make use of the phenomenological method of philosophical analysis associated with Edmund Husserl and the personalism of writers like Max Scheler in articulating the Thomist conception of the human person. Its best-known proponent is Karol Wojtyla (1920-2005), who went on to become Pope John Paul II. 6. Analytical Thomism: This newest approach to Thomism is described by John Haldane… its key proponent, as ‘a broad philosophical approach that brings into mutual relationship the styles and preoccupations of recent English-speaking philosophy and the concepts and concerns shared by Aquinas and his followers’ (from the article on ‘analytical Thomism’ in The Oxford Companion to Philosophy, edited by Ted Honderich). By ‘recent English-speaking philosophy’ Haldane means the analytical tradition founded by thinkers like Gottlob Frege, Bertrand Russell, G. E. Moore, and Ludwig Wittgenstein, which tends to dominate academic philosophy in the English-speaking world. Elizabeth Anscombe (1919-2001) and her husband Peter Geach are sometimes considered the first ‘analytical Thomists,’ though (like most writers to whom this label has been applied) they did not describe themselves in these terms, and as Haldane’s somewhat vague expression ‘mutual relationship’ indicates, there does not seem to be any set of doctrines held in common by all so-called analytical Thomists. What they do have in common seems to be that they are philosophers trained in the analytic tradition who happen to be interested in Aquinas in some way; and the character of their ‘analytical Thomism’ is determined by whether it tends to stress the ‘analytical’ side of analytical Thomism, or the ‘Thomism’ side, or, alternatively, attempts to emphasize both sides equally.</p></blockquote>

<blockquote><p>Treatments of the history of and various schools of thought within Thomism can be found in: Romanus Cessario, A Short History of Thomism (Catholic University of America Press, 2003); Helen James John, The Thomist Spectrum (Fordham University Press, 1966); Fergus Kerr, After Aquinas: Versions of Thomism (Blackwell, 2002); Ralph M. McInerny, Thomism in an Age of Renewal (University of Notre Dame Press, 1968); and Brian J. Shanley, The Thomist Tradition (Kluwer, 2002). Useful collections of essays can be found in: Victor Brezik, ed., One Hundred Years of Thomism: Aeterni Patris and Afterwards, A Symposium (Center for Thomistic Studies, 1981); Deal W. Hudson and Dennis Wm. Moran, eds., The Future of Thomism (American Maritain Association, 1992); and the series Thomistic Papers published by the Center for Thomistic Studies at the University of St. Thomas in Houston, Texas. Jacques Maritain, St. Thomas Aquinas (Meridian Books, 1958) contains a useful collection of papal statements on the significance of Aquinas for Roman Catholic thought. Gerald A. McCool has developed a controversial interpretation of the recent history of Thomism in a series of books; see his Nineteenth-Century Scholasticism: The Search for a Unitary Method (Fordham University Press, 1989); From Unity to Pluralism: The Internal Evolution of Thomism (Fordham University Press, 1989); and The Neo-Thomists (Marquette University Press, 1994). His interpretation is debated in John F. X. Knasas, ed., Thomistic Papers VI (Center for Thomistic Studies, 1994). The Neo-Scholastic approach to Aquinas is summarized in Reginald Garrigou-Lagrange, Reality: A Synthesis of Thomistic Thought (B. Herder Co., 1950; reprinted by Ex Fontibus Co., 2006). A recent treatment of Garrigou-Lagrange’s thought is Richard Peddicord, The Sacred Monster of Thomism: An Introduction to the Life and Legacy of Reginald Garrigou-Lagrange, O. P. (St. Augustine’s Press, 2005). Presentations of existential Thomism can be found in Etienne Gilson, Being and Some Philosophers (Pontifical Institute of Medieval Studies, 1952) and Jacques Maritain, Existence and the Existent (Vintage Books, 1966). John F. X. Knasas, Being and Some Twentieth-Century Thomists (Fordham University Press, 2003) is a recent defense and Ralph McInerny, Praeambula Fidei: Thomism and the God of the Philosophers (Catholic University of America Press, 2006) a recent critique. Two recent introductions to Laval/River Forest Thomism are The Writings of Charles De Koninck, Volume 1, edited and translated by Ralph McInerny (University of Notre Dame Press, 2008) and Benedict M. Ashley, The Way toward Wisdom: An Interdisciplinary and Intercultural Introduction to Metaphysics (University of Notre Dame Press, 2006). For transcendental Thomism, see Joseph Donceel, ed., A Marechal Reader (Herder and Herder, 1970). For Lublin Thomism, see Rocco Buttiglione, Karol Wojtyla: The Thought of the Man Who Became Pope John Paul II (Eerdmans, 1997). For analytical Thomism, see the chapter on Aquinas in G. E. M. Anscombe and P. T. Geach, Three Philosophers (Basil Blackwell, 1961); John Haldane, ed., Mind, Metaphysics, and Value in the Thomistic and Analytical Traditions (University of Notre Dame Press, 2002); The Monist, Vol. 80, No. 4 (1997), a special issue on Analytical Thomism edited by Haldane; and Craig Paterson and Matthew S. Pugh, eds., Analytical Thomism: Traditions in Dialogue (Ashgate, 2006).</p></blockquote>

<blockquote><p>3. We neither have, nor can have here in flesh, any one proper formal conception of the Divine nature that is formally suited to the truth in the object, but only metaphorical or analogical conceptions borrowed from things better known. 4. Yet nothing beyond sense (at least) is so certainly known as God, so far as we can reach, though nothing be less perfectly or more defectively known, or less comprehended. Even as we know nothing visible more certainly than the sun, and yet comprehend nothing visible less. … 7. God is here seen in the glass of His works, with the revelation of His Word and Spirit. And from these works we must borrow our conceptions. 8. Therefore, though the thing intended when we speak of God be transcendently and only in Him, and not in the creature, yet the first use of the words is to signify something in the creature. And therefore the creature is the famosius analogatum, though nothing to God.</p></blockquote>

0God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And to the same purpose is that which Bonaventure has: Since non-being is a privation of being, it does not fall within the intellect except through being. But being does not fall (within the intellect) through something else; because everything that is understood is understood either as non-being, or as being in potency, or as being in act. If, therefore, non-being cannot be understood except through being, and being in potency cannot be understood except through being in act, and since being names the pure act of that which is, therefore being is that which first falls within the intellect. And that being is the pure act; but this is not particular being, which is being narrowed (or restricted), because that is mixed with potency; nor analogical being, because that has the least degree of act, inasmuch as it is the least actual. It remains, therefore, that that being is the divine being. Therefore remarkable is the blindness of the intellect, which does not consider that which it sees first, and without which it can know nothing. For just as the eye, intent upon the various differences of colors, does not see the light by which it sees the rest—and if it sees it, nevertheless does not notice it—so the eye of our mind, intent upon these particular and universal beings, does not take notice of being itself, which is outside of every genus, although it first presents itself to the mind and through it the others. Whence it very truly appears that, just as the eye of a bat is related to the light, so is the eye of our mind related to the most manifest things of nature. For being accustomed to the darkness of beings and the phantasms of sensible things, when it gazes upon the very light of the highest Being, it seems to itself to see nothing—failing to understand that this very darkness is the supreme illumination of our mind; just as when the eye sees pure light, it seems to itself to see nothing.</p></blockquote>

<blockquote><p>…the difficulty to do good, proneness to evil, contrariety between the powers and faculties of the soul, and the rebellion of the meaner against the superior and better, are not the conditions of nature, as it was or might have been in itself before the entrance of sin, but that all these proceed from the putting of the powers of the soul, by the loss of grace, out of that course, which by the law of God and nature they were to hold. For does not the condition of man’s nature require that amongst things inquired after, thought of, and known, God should be the first? and amongst things desired and loved, nothing should be desired and loved more or before Him, nor otherwise than for Him? and is it not clear and evident, that if God be the first thing that is thought of, sought after, and loved, and that nothing be sought after or respected, but after and for God, that there will be no proneness to evil, difficultire to do good, contrariety between the powers of the soul, and rebellion of the meaner and inferior against the better and superior? surely there is none that can or will make question of it. Now it is confessed by the best learned amongst the Schoolmen, that howsoever it be not so in the course of our understanding, in this state wherein we are, yet according to the course of the nature of our understanding simply considered, it should be so, that God should be the first thing sought after and known by us. … By this which has ben said [including the quotes by Scotus and Bonaventure], it is evident that according to the course of nature not disordered, nor put out of course, the first thing that is inquired after, thought of and known, is God, and that He is the first good that is desired and loved, and that no other thing is desired or loved but after Him, and for Him. So that none of the things formerly mentioned can be found in the nature of man, unless it be put out of course. Whence grows the contrariety between the meaner and better, superior and inferior faculties of the soul, but from hence, that the soul in this state of her aversion from God, takes the beginning of all her knowledge from the senses, apprehends particular things as good upon the first view, and to be desired, which afterwards upon better consideration, in respects not considered at the first, she finds are not good nor desirable? And whence is the rebellion of the inferior against the superior, but from hence, that the superior having cast off the dependance it formerly had upon God and respect unto Him, the inferior also casts off the respect it had to it? ‘What could have been more just than that he should receive retaliation in kind? God is the life of the soul, and the soul is the life of the body. By sinning the soul willingly lost its power to live; let it unwillingly lose also its power to give life. Having freely driven away life—since it did not wish to live—let it not be able to bestow life on whom, or in what measure, it may wish. The soul would not be ruled by God; let it be unable to rule the body. If it does not obey its superior, why should it command its inferior? The Creator found His creature rebellious against Himself; let the soul likewise find its own handmaid (the body) rebellious against it. Man was found a transgressor of the divine law; let him find another law in his members opposing the law of his mind and bringing him into captivity to the law of sin. And since sin sets a separation between us and God, let death likewise set a separation between our body and ourselves.’ Bernard of Clairvaux, Sermon to the Knights of the Temple, ch. 11, ‘Of the Sepulcher’ From hence likewise is that danger of erring, whereunto man is subject; for apprehending particular things first, his knowledge is imperfect and confused; and not without much labor and danger of erring does he come to the distinct knowledge of any thing. And hence also flows that ignorance that is found in men; for taking the beginning of all the knowledge they have from the senses, they know no more touching anything than may be discerned by the accidents and outward effects of it, and so never come to know anything in the essence of it, or immediately as it is in itself. So that according to that which before I noted, out of the book called Destructorium vitiorum, as a man may know in the dark, the length, breadth and other dimensions of a thing, but not whether it be fair or foul, white or black. So men in this obscurity of discerning, may find out that there is a God, and that He is the beginning and cause of all things: but they cannot know how fair, how good, how merciful, and how glorious He is, that so they may love Him, fear Him, honour Him, and trust in Him as God, unless they have an illumination of grace.</p></blockquote>

separation+between+our+body+and+ourselves.%E2%80%99+Bernard+of+Clairvaux%2C+Sermon+to+the+Knights+of+the+Temple%2C+ch.+11%2C+%E2%80%98Of+the+Sepulcher%E2%80%99+From+hence+likewise+is+that+danger+of+erring%2C+whereunto+man+is+subject%3B+for+apprehending+particular+things+first%2C+his+knowledge+is+imperfect+and+confused%3B+and+not+without+much+labor+and+danger+of+erring+does+he+come+to+the+distinct+knowledge+of+any+thing.+And+hence+also+flows+that+ignorance+that+is+found+in+men%3B+for+taking+the+beginning+of+all+the+knowledge+they+have+from+the+senses%2C+they+know+no+more+touching+anything+than+may+be+discerned+by+the+accidents+and+outward+effects+of+it%2C+and+so+never+come+to+know+anything+in+the+essence+of+it%2C+or+immediately+as+it+is+in+itself.+So+that+according+to+that+which+before+I+noted%2C+out+of+the+book+called+Destructorium+vitiorum%2C+as+a+man+may+know+in+the+dark%2C+the+length%2C+breadth+and+other+dimensions+of+a+thing%2C+but+not+whether+it+be+fair+or+foul%2C+white+or+black.+So+men+in+this+obscurity+of+discerning%2C+may+find+out+that+there+is+a+God%2C+and+that+He+is+the+beginning+and+cause+of+all+things%3A+but+they+cannot+know+how+fair%2C+how+good%2C+how+merciful%2C+and+how+glorious+He+is%2C+that+so+they+may+love+Him%2C+fear+Him%2C+honour+Him%2C+and+trust+in+Him+as+God%2C+unless+they+have+an+illumination+of+grace.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Other+citations+%28work+not+named%29%2C+Of+the+Church+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+Answer+to+Berely%2C+ch.+5%2C+pp.+252-54+Field+%281561%E2%80%931616%29+was+an+English+ecclesiological+theologian+associated+with+the+work+of+Richard+Hooker.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe54fea7c48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e54fea7c48.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-epistemology/#:~:text=the%20difficulty%20to%20do%20good%2C%20proneness,they%20have%20an%20illumination%20of%20 <blockquote><p>Should anyone attempt to weaken the truth of natural theology by this argument, that nothing of certainty can be discovered in human affairs, or that what is certain cannot possibly be distinguished from that which is doubtful, a confutation of the first of these puerilities does not belong to this part of the subject; for it is not our business here to demonstrate the principles of human knowledge, but to take them for granted–Let these who are so thoroughly possessed of such skeptical opinions in order to be cured of their folly apply to the metaphysicians, I had almost said to the physicians–all that our subject requires of us is to show that there is as great certainty to be found in matters of a divine nature as can possibly be met with in human affairs. For to add only this one remark, what end can it serve to confute those by argument who attempt to destroy all reasoning, nay the very foundations of it, and who, on their own principles, are equally refuted, whether they prove their own opinion to be true, or do not prove it, whether they overcome in their disputations, or are defeated? But that certainty is often confounded with doubt, and truth with falsehood, in every subject of our enquiry, more particularly such enquiries as have divine things for their object, cannot be denied. For this reason in particular, the candid enquirer after truth should determine nothing without caution, nothing precipitately, nothing from prejudice, from anger, from hatred, or any improper disposition. But to assert that nothing, in any of our enquiries, can be known with certainty, even when the utmost caution, sincereity and attention guide our researches, is perfectly absurd and quite inconsistent with the first principles of reason.</p></blockquote>

<blockquote><p>On the Existence of Secondary Efficient Causes … Against the rigid occasionalists we can urge the testimony of conscience, for we at least experience our will being a true cause of other actions, namely willing, attending, trying etc. The certitude we have of these acts is of the highest degree. Of lesser degree is the certitude we have of our causality as to our commanded bodily acts, but even this certitude, namely moral certitude, is so persuasive as to make it impossible to doubt of such causality. The resistance we experience in attaining our aims can only rationally be interpreted as evidence not just of the existence of the external world but also for its causality with respect to us. The other things that we precisely experience as obstacles to our action are certainly caused, because they are transient, changeable, and temporal; but that such things are caused by secondary efficient causes is a conclusion so very probable indeed that it cannot prudently be doubted of, although it is not indubitably evident… On the Existence of Finality That some final causality exists can be proved from our experience, for we certainly act for the sake of some end, and once the existence of a true order in the world has been admitted we can also conclude to the existence of some finality even beyond ourselves.</p></blockquote>

</figure><figure class="quote" id="q-b05816f5f6" data-kw="">
<blockquote><p>Questions of how the brain can a priori create its own goals and then find the appropriate search images in its memory banks are not well handled. The loss of the Cartesian pilot has left a large gap in the theory, because no one wants a homunculus, but no one has a replacement… Recognition of ‘dissipative structures’… of ‘macroscopic order parameters’… and of ‘positive entropic information flows’ by various authors writing on self-organization in chaotic systems has opened new avenues to pursue the age-old question of how goals and their derivative expectancies arise in brains. Proposed new answers are expressed in terms of “circular causality”… My aim in this essay is to compare the language used in the theory of dynamical systems to describe active perception in experimental animals with the language used by an eminent philosopher [Aquinas] to describe the process in humans.</p></blockquote>

</figure><figure class="quote" id="q-d21c6396fc" data-kw="">
<blockquote><p>16… This can be illustrated by the likeness of the soul. For the soul, which is whole in the whole body and whole in each part of the body, as to essence, is not more in the heart or brain than in the feet; for equally, as far as essence is concerned, it is in each part of the human body: yet it is said to be especially in the head, as to the effects which it produces more excellently and preeminently in the head than in the rest of the body. For indeed it diffuses the power of sensing throughout the whole body: but in the head, it effects the power of hearing, seeing, smelling, tasting: indeed, also of speaking, thinking, remembering, understanding, which powers it does not exert in other members.</p></blockquote>

</figure><figure class="quote" id="q-639f557fb5" data-kw="">
<blockquote><p>V. The faculties of the soul are really [realiter] distinct from the soul itself, as qualities or a peculiar accident [proprium accidens] differ from the subject. The reason is to be found in the result; when faculties of the soul are injured its essence remains. VI. The faculties of the soul are either purely organic, as are the vegetative and sensitive faculties, or they are so partially and temporarily, as are intelligence and will. The former do not operate after the death of the body; the latter both can operate without the help of the body, and continue to operate after the body has been destroyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, bk. 1, ch. 5, ‘Creation’ (1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), p. 58</span></figcaption>

</figure><figure class="quote" id="q-94f2641b32" data-kw="">
<blockquote><p>The soul, by which each was man, was not educed from the potency of the body, but was created from nothing by God [in Gen. 2], infused into the body and personally united with it. For God breathed into the body the spirit of life, that is, the soul, Gen. 2:7, and thus man was made a living soul, in the same place and 1 Cor. 15:45. Therefore the soul of man is of a spiritual nature, as it is everywhere called ‘spirit’, Ps. 31:5; Eccl. 12:7; Zech. 12:1; Lk. 23:46; Acts 7:59. It is immortal, which cannot be killed, Mt. 10:28, but after death remains surviving, Mt. 22:32; Phil. 1:23; Lk. 16:22-23ff. Endowed also with the faculty of understanding and willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>The mind of man is a tabula rasa not absolutely, but relatively as to discursion and dianoetical knowledge (which is acquired necessarily by inferring one thing from another); but not as to apprehensive and intuitive knowledge. For even according to Paul, the work of the law is in such a manner written in the hearts of the Gentiles that they do by nature the things contained in the law. Hence is a twofold inscription upon the heart of man: the one of God in the remains of his image and the natural law; the other of the Devil by sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1, 1st Topic, 3rd question, ‘Whether Natural Theology may be Granted’, sect. 11, p. 9</span></figcaption>

</figure><figure class="quote" id="q-00fdb6afba" data-kw="">
<blockquote><p>We call principles those things which are known per se by the light of nature, which are known immediately, and which are unmoved or immutable, such that from them at last definite knowledge arises. From these principles the faculty of reason deduces fixed processes, like rivulets from springs. It compares the principles of nature with the truth of reality or separates them from one another. It joins causes with effects and from these forms conclusions. It decides which things are common and which unique. Finally, it so orders everything that it acquires knowledge of all those things which the reason of a person can trace down and follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, trans. David Noe (1592?; RHB, 2014), ch. 10, ‘Natural Theology’, p. 146</span></figcaption>

<blockquote><p>§1. We have laid out the concept of the natural knowledge of God based on the mainstream orthodox view. What is left is to demonstrate the wider agreement on this by quoting different authors… These authors do not just generally affirm this natural knowledge of God, but also distinctly break it down into parts or species which they explain: the innate or implanted or subjective type; and the acquired or added or objective or discursive or demonstrative type, derived a posteriori from observing effects.</p></blockquote>

<blockquote><p>Althought God is not manifest to the senses comprehensively as he is in himself, yet he can be perceived apprehensively as shining in his works, appearing in signs, heard in the word and manifested in the fabric of the whole universe. (2) It is a false assumption that there is nothing in the intellect which was not before in some sense. For universals are in the intellect and never were in any sense. A mind is known as also an angel, yet they are never pereceived or seen except from their effects. Why therefore may not God be most certainly known in the mind from his works and a posteriori, although we cannot perceive Him with our eyes or any of the other bodily senses.</p></blockquote>

<blockquote><p>Doth the plowman plow all day to sow? doth he open and break the clods of his ground? When he hath made plain the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and cast in the principal wheat and the appointed barley and the rie in their place? For his God doth instruct him to discretion, and doth teach him. For the fitches are not threshed with a threshing instrument, neither is a cart wheel turned about upon the cummin; but the fitches are beaten out with a staff, and the cummin with a rod. Bread corn is bruised; because he will not ever be threshing it, nor break it with the wheel of his cart, nor bruise it with his horsemen. This also cometh forth from the Lord of hosts, which is wonderful in counsel, and excellent in working.</p></blockquote>

<blockquote><p>21. By the knowledge of our own acts we know our powers and the nature of our own souls (though imperfectly). And by the knowledge of our souls, we know the nature of other intellectual spirits. And by the knowledge of ourselves and them, and the Scripture expressions of his attributes, we know so much of God as we can here know. And accordingly must speak of him, or be silent. For we have no higher notions than such as are thus analogical, expressing that which is in God in an inconceivable eminency and transcendency, by words which first signify that which is formally in the soul (as is said).</p></blockquote>

<blockquote><p>For, since the principle of all the knowledge which the reason acquires about a thing is the understanding of that thing’s essence—because, according to the Philosopher’s teaching (2 Posterior Analytics 3, 9) the principle of a demonstration is what a thing is—it follows that our knowledge about a thing will be in proportion to our understanding of its essence. Therefore, if the human intellect comprehends the essence of a particular thing, such as a stone or a triangle, no truth about that thing will surpass the capability of human reason. But this does not happen to us in relation to God, because the human intellect is incapable by its natural power of attaining to the comprehension of his essence. For our intellect’s knowledge, according to the mode of the present life, originates from the senses: and thus things which are not objects of sense cannot be comprehended by the human intellect except insofar as knowledge of them is gathered from sensibles. Now sensibles cannot lead our intellect to see in them what God is, because they are effects unequal to the power of their cause. And yet our intellect is led by sensibles to the divine knowledge so as to know about God that he is, and other such truths which need to be ascribed to the first principle. Accordingly, some divine truths are attainable by human reason, while others altogether surpass the power of human reason. … Furthermore, the same is made abundantly clear by the deficiency which we experience every day in our knowledge of things. For we are ignorant of many of the properties of sensible things, and in many cases we are unable to discover the nature of those properties which we perceive by our senses. Much less, therefore, is human reason capable of investigating all the truths about that most sublime [divine] essence. This agrees with the saying of the Philosopher, where he says that our intellect is like the eye of a bat in relation to the sun in relation to those primary things which are most evident in nature (1a Metaphysics 1, 2).</p></blockquote>

<blockquote><p>Transient to a First Uncausable Efficient Cause [see pp. 38-46 of the Summary for background for 16-21] . 16. In the same class of essentially ordered causes, the series cannot be infinite, for otherwise there would be an actually infinite series of simultaneously existing dependent things, which is impossible (from conclusion 4). Hence there cannot be an infinite series of essentially ordered efficient causes. The like must be said of final causes, or of material or formal causes. 17. A circle of essentially ordered causes cannot exist as independent or uncaused in itself (conclusion 5). Since a circle of causes must always be understood of things simultaneously existing,¹ this conclusion extends to every circle of causes. ¹ “But just as the cause which gives being to something must exist in the moment when the transient thing begins to exist,² so too the reason that the transient thing persists in being must coexist as long as the transient thing continues to exist.” p. 34 ² [This is confirmed in that only something actual can actualize something potential.] 18. A material cause does not behave as matter unless the formal cause forms it and vice versa. The point is plain from the definitions of these causes [see pp. 39-40], for unless that which is composed of both exists, matter and form cannot have an inflow on the thing caused [see pp. 38 &amp; 40]. Here from follows another conclusion, namely: 19. If something has behaved as matter, something else has behaved as form, and vice versa. 20. What is not effected is not caused by a final cause. The point is plain from the definitions of each [see pp. 39-40], for the final cause is that for the sake of which the efficient cause produces the effect; therefore it causes only by mediation of the efficient cause. This conclusion can thus be formulated in another way, namely that if something depends on a final cause it also depends on an efficient cause. 21. What is not effected is not mattered or formed, or, if something is caused by a material and formal cause, it is also caused by an efficient cause. For matter and form are parts; therefore they are in themselves indifferently disposed to forming one thing. Therefore something in the order of efficient cause is required to effect this one thing. 22. If something is transient or changeable or temporal, something is effectible or able to be effected. For nothing of this sort has in itself the total reason for its existence; therefore it is from another, namely from an efficient cause; therefore it is something that can be an effect or is effectible. 23. If something is effectible, something can effect. Cause and effect are correlatives¹ so that the possibility of one involves the possibility of the other. ¹ [Correlatives are things that are by definition depedent on each other; if there is one, there must be the other. An example is: if there is a father, there must be, or have been, a son; if there is a son, there must be, or have been, a father.] 24. If some efficient cause can exist, some first efficient and uncausable thing can exist. The proof is as follows: If there is an efficient cause it is either a first efficient cause (that is, not itself effectible) or not. If it is not the first ineffectible efficient cause, there is either: a) a circle of efficient causes such that the circle as a whole is altogether independent of anything outside it, but its individual members are effected by each other, or b) there is an infinite series of efficient causes that are either i) essentially ordered or ii) accidentally ordered.¹ ¹ “Causes are said to be accidentally ordered among themselves if one depends on the other in being, but not in actually causing; hence if the first cause of such a series ceases to exist, the others can still exist and still cause. Thus a father, when grandfather and great-grandfather are dead, can generate a son.” p. 44 But a) is impossible (from conclusion 17) and so is b) i) (from conclusion 16). But b) ii) would also be impossible unless there existed something outside the series on which the whole series depends. The proof is twofold: First, that from the fact that the individual members are dependent, the series consists, as a totality, of dependent things, and so the series as a whole is dependent and thus requires some cause outside itself. Second, from the fact that if the individual causes are not simultaneously existent, [then] they begin to be and cease to be; therefore they are transient. But if something is transient, there is also something absolutely permanent and independent both as to its existence and as to its permanence (from conclusion 3). Such a being, to the extent it keeps the series in being, is also an efficient cause, otherwise it would not be altogether independent as to its permanence in being. For if it were merely a material or formal cause, it would depend on some other efficient cause so that it be formally a cause (from conclusions 18 and 21). If it were merely a final cause, it would also require an efficient cause in order to exercise its final causality (from conclusion 20). There is a confirmation from the fact that to persist in being is formally an effect, at least in its beginning. Therefore if it is an efficient cause, it is in every case the first ineffectible efficient cause. That this first efficient cause is simply uncausable is plain from conclusions 20 and 21. 25. What is ineffectible cannot be caused by a final or material or formal cause; therefore it is simply uncausable. 26. If an ineffectible being can exist, it must exist; for if it did not actually exist, it could not receive existence from a cause. So it could not in fact exist but would be simply impossible. 27. A first uncausable efficient cause actually exists. The point is plain from the fact that there is something transient, changeable and temporal (from conclusions 8, 14, 15); therefore there is an uncausable first efficient cause (from conclusions 24 to 26). It follows next that there exists at least one efficient cause. Hence if something can be transient, changeable, etc. some ineffectible efficient cause must exist as the condition sine qua non [without which: nothing] of the possibility of something else.</p></blockquote>

es+the+effect%3B+therefore+it+causes+only+by+mediation+of+the+efficient+cause.+This+conclusion+can+thus+be+formulated+in+another+way%2C+namely+that+if+something+depends+on+a+final+cause+it+also+depends+on+an+efficient+cause.+21.+What+is+not+effected+is+not+mattered+or+formed%2C+or%2C+if+something+is+caused+by+a+material+and+formal+cause%2C+it+is+also+caused+by+an+efficient+cause.+For+matter+and+form+are+parts%3B+therefore+they+are+in+themselves+indifferently+disposed+to+forming+one+thing.+Therefore+something+in+the+order+of+efficient+cause+is+required+to+effect+this+one+thing.+22.+If+something+is+transient+or+changeable+or+temporal%2C+something+is+effectible+or+able+to+be+effected.+For+nothing+of+this+sort+has+in+itself+the+total+reason+for+its+existence%3B+therefore+it+is+from+another%2C+namely+from+an+efficient+cause%3B+therefore+it+is+something+that+can+be+an+effect+or+is+effectible.+23.+If+something+is+effectible%2C+something+can+effect.+Cause+and+effect+are+correlatives%C2%B9+so+that+the+possibility+of+one+involves+the+possibility+of+the+other.+%C2%B9+%5BCorrelatives+are+things+that+are+by+definition+depedent+on+each+other%3B+if+there+is+one%2C+there+must+be+the+other.+An+example+is%3A+if+there+is+a+father%2C+there+must+be%2C+or+have+been%2C+a+son%3B+if+there+is+a+son%2C+there+must+be%2C+or+have+been%2C+a+father.%5D+24.+If+some+efficient+cause+can+exist%2C+some+first+efficient+and+uncausable+thing+can+exist.+The+proof+is+as+follows%3A+If+there+is+an+efficient+cause+it+is+either+a+first+efficient+cause+%28that+is%2C+not+itself+effectible%29+or+not.+If+it+is+not+the+first+ineffectible+efficient+cause%2C+there+is+either%3A+a%29+a+circle+of+efficient+causes+such+that+the+circle+as+a+whole+is+altogether+independent+of+anything+outside+it%2C+but+its+individual+members+are+effected+by+each+other%2C+or+b%29+there+is+an+infinite+series+of+efficient+causes+that+are+either+i%29+essentially+ordered+or+ii%29+accidentally+ordered.%C2%B9+%C2%B9+%E2%80%9CCauses+are+said+to+be+accidentally+ordered+among+themselves+if+one+depends+on+the+other+in+being%2C+but+not+in+actually+causing%3B+hence+if+the+first+cause+of+such+a+series+ceases+to+exist%2C+the+others+can+still+exist+and+still+cause.+Thus+a+father%2C+when+grandfather+and+great-grandfather+are+dead%2C+can+generate+a+son.%E2%80%9D+p.+44+But+a%29+is+impossible+%28from+conclusion+17%29+and+so+is+b%29+i%29+%28from+conclusion+16%29.+But+b%29+ii%29+would+also+be+impossible+unless+there+existed+something+outside+the+series+on+which+the+whole+series+depends.+The+proof+is+twofold%3A+First%2C+that+from+the+fact+that+the+individual+members+are+dependent%2C+the+series+consists%2C+as+a+totality%2C+of+dependent+things%2C+and+so+the+series+as+a+whole+is+dependent+and+thus+requires+some+cause+outside+itself.+Second%2C+from+the+fact+that+if+the+individual+causes+are+not+simultaneously+existent%2C+%5Bthen%5D+they+begin+to+be+and+cease+to+be%3B+therefore+they+are+transient.+But+if+something+is+transient%2C+there+is+also+something+absolutely+permanent+and+independent+both+as+to+its+existence+and+as+to+its+permanence+%28from+conclusion+3%29.+Such+a+being%2C+to+the+extent+it+keeps+the+series+in+being%2C+is+also+an+efficient+cause%2C+otherwise+it+would+not+be+altogether+independent+as+to+its+permanence+in+being.+For+if+it+were+merely+a+material+or+formal+cause%2C+it+would+depend+on+some+other+efficient+cause+so+that+it+be+formally+a+cause+%28from+conclusions+18+and+21%29.+If+it+were+merely+a+final+cause%2C+it+would+also+require+an+efficient+cause+in+order+to+exercise+its+final+causality+%28from+conclusion+20%29.+There+is+a+confirmation+from+the+fact+that+to+persist+in+being+is+formally+an+effect%2C+at+least+in+its+beginning.+Therefore+if+it+is+an+efficient+cause%2C+it+is+in+every+case+the+first+ineffectible+efficient+cause.+That+this+first+efficient+cause+is+simply+uncausable+is+plain+from+conclusions+20+and+21.+25.+What+is+ineffectible+cannot+be+caused+by+a+final+or+material+or+formal+cause%3B+therefore+it+is+simply+uncausable.+26.+If+an+ineffectible+being+can+exist%2C+it+must+exist%3B+for+if+it+did+not+actually+exist%2C+it+could+not+receive+existence+from+a+cause.+So+it+could+not+in+fact+exist+but+would+be+simply+impossible.+27.+A+first+uncausable+efficient+cause+actually+exists.+The+point+is+plain+from+the+fact+that+there+is+something+transient%2C+changeable+and+temporal+%28from+conclusions+8%2C+14%2C+15%29%3B+therefore+there+is+an+uncausable+first+efficient+cause+%28from+conclusions+24+to+26%29.+It+follows+next+that+there+exists+at+least+one+efficient+cause.+Hence+if+something+can+be+transient%2C+changeable%2C+etc.+some+ineffectible+efficient+cause+must+exist+as+the+condition+sine+qua+non+%5Bwithout+which%3A+nothing%5D+of+the+possibility+of+something+else.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99%2C+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52a28e625b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52a28e625b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hylemorphism/#:~:text=Transient%20to%20a%20First%20Uncausable%20Efficient,of%20the%20possibility%20of%20something%20else&amp;text=Transient%20to%20a%20First%20Uncausable%20Efficient%20Cause%20%5Bsee&amp;text=which%3A%20nothing%5D%20of%20the%20possibility%20of%20something%20else" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>On the Natures of Things &amp; Substantial Forms 1. We do not introduce these things to the students so that they will all now immediately necessarily believe in forms with their appendices, or contend tooth and nail for them, but so that they may at least for a time abstain from a peremptory judgment and its execution, by which the miserable and innocent beings are cast down from their ancient possession, until they have learned thoroughly, if not most accurately, at least moderately the philosophy of the schools, specifically logic, metaphysics, physics and these few notes which we subjoin, having been solidly determined, and they see that they are satisfied in them. However they will finally judge, we will not have wasted our labor if in the meantime we will have recalled them from a fierce contempt and flight of the philosophical study, moreover from an idiotic rustic and proud ignorance, so that at least it could sometime be said concerning those dissenting elsewhere what is boasted among the Arabs: A wise man when he errs, errs with learned error. Moreover our notes are threefold: 1. Certain prejudgments which I [approvingly] suggest to the disputants. 2. Reasons for forms, which are to be clearly solved. 3. Reasons against forms and for those vicarious accidents which certain more recent [mechanical] authors wish to be substituted for forms, which forms and their doubts, with their principles and consequences, are fittingly to be defended. 2. The notes of the first kind are: I. Let them consider whether they satisfy themselves in the reconciliation of this opinion [of forms] with sacred scripture. For it indeed harmonizes with truth: and Christian philosophers will profess learned ignorance a thousand times rather than that they bring even the least appearance of prejudice to divine truth. See Gen. 1:11, 21-22, 24-25; Prov. 30:24-27, where we think permanent natures, faculties and distinct species of things are implied. II. It is to be seen whether from the denying opinion there would be at least an easier lapse than from the affirming into doubt. [Put the question forth:] Whether there are any substantial forms which actuate the body of man and constitute one composite with it? But if someone denies this, and substitutes the krasin of Galen, or a particle of divine breath or soul of the world, or the universal intellect of Averroes, or the mind of Plato, thrust into the workshop of the body as a genial pipor and bound to it, as Prometheus the Caucasian, if someone I say substitutes such a thing, by what reasons would you more successfully and safely rebut him than [those by which] the assertors of forms [do]. III. It is to be seen how with this opinion standing the distinction between the being of substance and of accident can be conveniently explained and defended. For there would be, according to them, no substantial difference between a wolf, a sheep, a whale, an elephant, a serpent, a stone, a monk’s hood, aconite, wheat, the sun, the moon, the earth; add also a clock, the wooden Trojan horse, the bronze bull of Phalaris, the flying dove of Archytas, the bronze head of Pope Sylvester, the speaking statue of Albertus Magnus, a house, a chair, a garment etc. But perhaps they would retort that those substances differ essentially through those five accidents motion, rest, position, figure and quantity. I respond: Granting this to be so (about which we do not now dispute), the difficulty is nevertheless not removed by this escape. It nevertheless remains [on this view] that substances are distinguished from substances in no other way than accidents from substances and accidents among themselves, for both the former and the latter are distinguished by accidents. IV. It is to be seen whether from here there is not an easier lapse, when someone is pressed by reasons and consequences into this absurd [occasionalist] opinion: ‘Secondary causes endowed with their own causality are not given, but only the first and universal cause acts in the presence and disposition of secondary causes.’ See the absurdity of this opinion shown by the Scholastics and more recent metaphysicians and theologians in the topic on Providence, on the concourse of God with creatures. Let the consequences [of their position], by which they could be pressed, be these: 1. That the concourse of God is not given, nor the motion of the first mover accommodated to the natures and properties of secondary causes, whether they are necessary or contingent. 2. That there is not in created substances an intrinsic mover and a substantial principle of internal and proper motion: for the disposition of the mobile thing to motion from quantity, figure, position is not the activity or causality of the efficient cause, but only a required condition, and a cause sine qua non (‘without which nothing’). 3. Consequently, since no mobile thing can move itself in potency to act or determine itself to motion, it remains that some external mover is to be sought which may lead the potency into act. But what will they give here? The Platonic-Virgilian soul of the world, or intelligences, or God, or atoms, or celestial globules. Here something will have to be said [by them]. V. It is to be seen lest the negation of proper qualities, which internally emanate from the form and substance of a thing (the negation of which follows the negation of forms, just as one error drags another), drive us into these absurdities: 1. That created substances are the immediate principle of their own operation, since there are no active qualities by which substances operate as a means: which see shaken out by the metaphysicians and theologians when they treat of the simplicity of God and of the distinction of the divine attributes. 2. That there are no qualities altogether, as neither of the second, or third, so also not of the first species; that is, there are no habits, against the common school of philosophers and theologians. I would like to see how those who deny natural faculties or powers will vindicate habits against the atheists, skeptics and infidels (the necessity of which Scripture and reason persuades), lest they be likewise shut up in that pentagon-workshop of motion, rest, quantity, position and figure. VI. From this opinion it follows that no definitions of substances are given, since there are no forms or proper first and internal essentials from which the difference can be taken. How this may savor to the sons of the logicians of whatever sect, and to all acroamatic minds, and to the professors of whatever disciplines, they themselves will see. VII. This absurdity also follows: That all created substances, even man himself (and why not angels and separate souls?), are beings per accidens [through accident], collective and aggregate: but not essences or natures, one per se [through itself]. So that no essence seems to be per se, except perhaps atoms, or ethereal globules, or insensible particles, or Platonic ideas (which he called αυτοάνθρωπον, αυτοίππον, etc.) or chimeras buzzing in the void, etc. But that man ought to be called a being and one per se, we will teach below. VIII. It would follow that there are no proper and intrinsic faculties, nor are their principles in animals of another kind than in automata or Daedalean statues; and consequently the works of God and nature produced through creation or generation are essentially and univocally the same with works of art: which how it may agree well enough with Ps. 104:29; 7:14-15; Num. 16:22; 27:16; Heb. 11:9-10; Hab. 2:19, I confess I do not see the knot. IX. It would follow that there is no generation or corruption of natural things. But more on this in Thesis 4 [below]. X. Since efficiency and motion, which is usually attributed to forms and their active qualities, is attributed to quantity and figure, it is to be seen lest young men at some time imprudently admit through consequence that magical axiom rejected by all Christian theology and philosophy: “There is some efficacy of quantity and figure, and it either per se or with others things concurs as an active principle of transmutation.</p></blockquote>

izes+with+truth%3A+and+Christian+philosophers+will+profess+learned+ignorance+a+thousand+times+rather+than+that+they+bring+even+the+least+appearance+of+prejudice+to+divine+truth.+See+Gen.+1%3A11%2C+21-22%2C+24-25%3B+Prov.+30%3A24-27%2C+where+we+think+permanent+natures%2C+faculties+and+distinct+species+of+things+are+implied.+II.+It+is+to+be+seen+whether+from+the+denying+opinion+there+would+be+at+least+an+easier+lapse+than+from+the+affirming+into+doubt.+%5BPut+the+question+forth%3A%5D+Whether+there+are+any+substantial+forms+which+actuate+the+body+of+man+and+constitute+one+composite+with+it%3F+But+if+someone+denies+this%2C+and+substitutes+the+krasin+of+Galen%2C+or+a+particle+of+divine+breath+or+soul+of+the+world%2C+or+the+universal+intellect+of+Averroes%2C+or+the+mind+of+Plato%2C+thrust+into+the+workshop+of+the+body+as+a+genial+pipor+and+bound+to+it%2C+as+Prometheus+the+Caucasian%2C+if+someone+I+say+substitutes+such+a+thing%2C+by+what+reasons+would+you+more+successfully+and+safely+rebut+him+than+%5Bthose+by+which%5D+the+assertors+of+forms+%5Bdo%5D.+III.+It+is+to+be+seen+how+with+this+opinion+standing+the+distinction+between+the+being+of+substance+and+of+accident+can+be+conveniently+explained+and+defended.+For+there+would+be%2C+according+to+them%2C+no+substantial+difference+between+a+wolf%2C+a+sheep%2C+a+whale%2C+an+elephant%2C+a+serpent%2C+a+stone%2C+a+monk%E2%80%99s+hood%2C+aconite%2C+wheat%2C+the+sun%2C+the+moon%2C+the+earth%3B+add+also+a+clock%2C+the+wooden+Trojan+horse%2C+the+bronze+bull+of+Phalaris%2C+the+flying+dove+of+Archytas%2C+the+bronze+head+of+Pope+Sylvester%2C+the+speaking+statue+of+Albertus+Magnus%2C+a+house%2C+a+chair%2C+a+garment+etc.+But+perhaps+they+would+retort+that+those+substances+differ+essentially+through+those+five+accidents+motion%2C+rest%2C+position%2C+figure+and+quantity.+I+respond%3A+Granting+this+to+be+so+%28about+which+we+do+not+now+dispute%29%2C+the+difficulty+is+nevertheless+not+removed+by+this+escape.+It+nevertheless+remains+%5Bon+this+view%5D+that+substances+are+distinguished+from+substances+in+no+other+way+than+accidents+from+substances+and+accidents+among+themselves%2C+for+both+the+former+and+the+latter+are+distinguished+by+accidents.+IV.+It+is+to+be+seen+whether+from+here+there+is+not+an+easier+lapse%2C+when+someone+is+pressed+by+reasons+and+consequences+into+this+absurd+%5Boccasionalist%5D+opinion%3A+%E2%80%98Secondary+causes+endowed+with+their+own+causality+are+not+given%2C+but+only+the+first+and+universal+cause+acts+in+the+presence+and+disposition+of+secondary+causes.%E2%80%99+See+the+absurdity+of+this+opinion+shown+by+the+Scholastics+and+more+recent+metaphysicians+and+theologians+in+the+topic+on+Providence%2C+on+the+concourse+of+God+with+creatures.+Let+the+consequences+%5Bof+their+position%5D%2C+by+which+they+could+be+pressed%2C+be+these%3A+1.+That+the+concourse+of+God+is+not+given%2C+nor+the+motion+of+the+first+mover+accommodated+to+the+natures+and+properties+of+secondary+causes%2C+whether+they+are+necessary+or+contingent.+2.+That+there+is+not+in+created+substances+an+intrinsic+mover+and+a+substantial+principle+of+internal+and+proper+motion%3A+for+the+disposition+of+the+mobile+thing+to+motion+from+quantity%2C+figure%2C+position+is+not+the+activity+or+causality+of+the+efficient+cause%2C+but+only+a+required+condition%2C+and+a+cause+sine+qua+non+%28%E2%80%98without+which+nothing%E2%80%99%29.+3.+Consequently%2C+since+no+mobile+thing+can+move+itself+in+potency+to+act+or+determine+itself+to+motion%2C+it+remains+that+some+external+mover+is+to+be+sought+which+may+lead+the+potency+into+act.+But+what+will+they+give+here%3F+The+Platonic-Virgilian+soul+of+the+world%2C+or+intelligences%2C+or+God%2C+or+atoms%2C+or+celestial+globules.+Here+something+will+have+to+be+said+%5Bby+them%5D.+V.+It+is+to+be+seen+lest+the+negation+of+proper+qualities%2C+which+internally+emanate+from+the+form+and+substance+of+a+thing+%28the+negation+of+which+follows+the+negation+of+forms%2C+just+as+one+error+drags+another%29%2C+drive+us+into+these+absurdities%3A+1.+That+created+substances+are+the+immediate+principle+of+their+own+operation%2C+since+there+are+no+active+qualities+by+which+substances+operate+as+a+means%3A+which+see+shaken+out+by+the+metaphysicians+and+theologians+when+they+treat+of+the+simplicity+of+God+and+of+the+distinction+of+the+divine+attributes.+2.+That+there+are+no+qualities+altogether%2C+as+neither+of+the+second%2C+or+third%2C+so+also+not+of+the+first+species%3B+that+is%2C+there+are+no+habits%2C+against+the+common+school+of+philosophers+and+theologians.+I+would+like+to+see+how+those+who+deny+natural+faculties+or+powers+will+vindicate+habits+against+the+atheists%2C+skeptics+and+infidels+%28the+necessity+of+which+Scripture+and+reason+persuades%29%2C+lest+they+be+likewise+shut+up+in+that+pentagon-workshop+of+motion%2C+rest%2C+quantity%2C+position+and+figure.+VI.+From+this+opinion+it+follows+that+no+definitions+of+substances+are+given%2C+since+there+are+no+forms+or+proper+first+and+internal+essentials+from+which+the+difference+can+be+taken.+How+this+may+savor+to+the+sons+of+the+logicians+of+whatever+sect%2C+and+to+all+acroamatic+minds%2C+and+to+the+professors+of+whatever+disciplines%2C+they+themselves+will+see.+VII.+This+absurdity+also+follows%3A+That+all+created+substances%2C+even+man+himself+%28and+why+not+angels+and+separate+souls%3F%29%2C+are+beings+per+accidens+%5Bthrough+accident%5D%2C+collective+and+aggregate%3A+but+not+essences+or+natures%2C+one+per+se+%5Bthrough+itself%5D.+So+that+no+essence+seems+to+be+per+se%2C+except+perhaps+atoms%2C+or+ethereal+globules%2C+or+insensible+particles%2C+or+Platonic+ideas+%28which+he+called+%CE%B1%CF%85%CF%84%CE%BF%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CE%BD%2C+%CE%B1%CF%85%CF%84%CE%BF%CE%AF%CF%80%CF%80%CE%BF%CE%BD%2C+etc.%29+or+chimeras+buzzing+in+the+void%2C+etc.+But+that+man+ought+to+be+called+a+being+and+one+per+se%2C+we+will+teach+below.+VIII.+It+would+follow+that+there+are+no+proper+and+intrinsic+faculties%2C+nor+are+their+principles+in+animals+of+another+kind+than+in+automata+or+Daedalean+statues%3B+and+consequently+the+works+of+God+and+nature+produced+through+creation+or+generation+are+essentially+and+univocally+the+same+with+works+of+art%3A+which+how+it+may+agree+well+enough+with+Ps.+104%3A29%3B+7%3A14-15%3B+Num.+16%3A22%3B+27%3A16%3B+Heb.+11%3A9-10%3B+Hab.+2%3A19%2C+I+confess+I+do+not+see+the+knot.+IX.+It+would+follow+that+there+is+no+generation+or+corruption+of+natural+things.+But+more+on+this+in+Thesis+4+%5Bbelow%5D.+X.+Since+efficiency+and+motion%2C+which+is+usually+attributed+to+forms+and+their+active+qualities%2C+is+attributed+to+quantity+and+figure%2C+it+is+to+be+seen+lest+young+men+at+some+time+imprudently+admit+through+consequence+that+magical+axiom+rejected+by+all+Christian+theology+and+philosophy%3A+%E2%80%9CThere+is+some+efficacy+of+quantity+and+figure%2C+and+it+either+per+se+or+with+others+things+concurs+as+an+active+principle+of+transmutation.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+%E2%80%98On+the+Natures+of+Things+%26+Substantial+Forms%E2%80%99%2C+pp.+369-76+in+Select+Theological+Disputations%2C+vol.+1%2C+pt.+2+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+%E2%80%98On+Creation%E2%80%99%2C+pt.+8+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17509e63f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17509e63f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hylemorphism/#:~:text=On%20the%20Natures%20of%20Things,as%20an%20active%20principle%20of%20transmutation&amp;text=On%20the%20Natures%20of%20Things%20%26%20Substantial%20Forms&amp;text=things%20concurs%20as%20an%20active%20principle%20of%20transmutation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…hylemorphic dualism… takes a human being to be, not a composite of two distinct substances, but one substance with both incorporeal and corporeal operations. And the incorporeal incomplete substance that is the soul is related to the body not as an efficient cause but as its formal cause. Their relationship is as intimate as that between the form and matter of a stone, a tree, or a dog, which is why we experience the body as part of us rather than as some instrument extrinsic to us. Soul and body do not ‘interact’ any more than the substantial form of a stone and the matter that makes up the stone interact. Hence there is no ‘problem’ of explaining how they interact. An ‘interaction problem’ can arise only if, like Descartes, one misconceives them as two distinct substances related by efficient causation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, ch. 11, ‘The Form of the Body’ in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pp. 493-523 See especially, ‘Hylemorphic Dualism’, pp. 505-10., p. 508</span></figcaption>

<blockquote><p>Nor is it yet a small matter when he adds, that God had formed the spirit of man; for we know that we live; the body of itself would be without any strength or motion, were it not endued with life; and the soul which animates the body is invisible… By saying “in the midst of him”, he means, that the spirit dwells within; for the body, we allow, is as it were its tabernacle.</p></blockquote>

<blockquote><p>7. …Indeed the soul (as is aforesaid) is wholly hypostasis to the head, giving life to it and sustaining it: but where? not in every part of the body, but only in that where the head itself is: and out of the head [the soul] is also wholly hypostasis to the feet, sustaining them too: not where the head is, but where the feet themselves are. Is then the union which the soul has with the head dissolved because out of the head it is wholly also in the feet? 8. Finally, that all things which have been spoken of this personal union [of Christ in two natures], may more plainly be declared, I add these also: The soul is hypostasis to the eyes: to what eyes? such as they are: namely instruments used for sight, not for hearing: on the other side, to the ears, for hearing, not for seeing. So the Word was hypostasis to the human nature, not to destroy death, which was a property of the Word: but to suffer death, which was a property of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (d. 1590; Cambridge, 1599), ‘Observations of the same Zanchius upon his Own Confession’, pp. 289-90 The context in point 7 is Zanchi arguing the validity of the extra Calvinisticum, that they person, or hypostasis of the Son exists outside of the human flesh according to his divinity. In point 8 it is the denial of the real communication of properties, via the Person, of the natures (contra the Lutherans).</span></figcaption>

<blockquote><p>XIII… And a little later: “As the soul is in the body, so Christians are in the world.” The soul, although dispersed throughout all the members of the body, is nonetheless present in it; likewise, Christians, though they dwell in the world, are not of the world. The invisible soul is established as if in a garrison within the visible body; similarly, Christians are recognized while they sojourn in the world, but their divine worship is invisible. And a little later: Although the soul is enclosed in the body, it still preserves the body; likewise, although Christians are detained in the world as if in custody, they also preserve the world.</p></blockquote>

</figure><figure class="quote" id="q-3e8e10a30c" data-kw="">
<blockquote><p>7. In Corollary 1 I had said that the opinion of Taurellus and Gorlaeus about man as a being per accidens stumbles in many ways. The argument by which they are moved is such. Two beings or complete substances make one per accidens and not per se: but the body and soul of man are two complete substances. Therefore. I respond: The major is not universally true; and the minor is denied. That in the presence of the disputation itself it may be aired to many and to the end, we now cursorily indicate these hypotheses: I. That man is a species of substance and animal created into one essence or nature from soul and body, we think is implied in Gen. 3:7, 1 Cor. 15:45, compared with Gen. 1:26-27. II. Christ-Theanthropos [God-man] (in whom there are two natures or complete substances) is one per se and not per accidens: for the union of natures was made into one suppositum, [Greek]. See the theologians on the person of Christ: Much more therefore substantially and per se the union was made between the soul and body of man, which indeed are not so far distant, nor are they such complete substances as divinity and humanity. III. The true human nature of Christ would not be more one substance through itself than in the death of the same … [These articles are about Christ, man, the soul and angels] … IX. This opinion even impinges on many metaphysical dogmas… … 5. That man is not a substance nor does he directly pertain to the predication of substance: but only indirectly, and per accidens is referred to it, since he is a being per accidens and collective. 6. That one man is no more one per se, than an army, a city, etc. where there are many men collectively. 7. That consequently man cannot be defined by an essential and perfect definition. 8. That the matter and form of a composite are properly matter, and its form is the union, that is an accident, or pure mode, namely a relation. See Gorlaeus, Exercit. 14, p. 266. 9. That the union of the human soul with its body is to be sought in some mere accident from those five, and indeed in position or posture: as some seem to concede. 10. That the body is not the nature of man, but only his instrument, through which the soul existing in the body operates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Natures of Things &amp; Substantial Forms’</cite>, pp. 369-76 in Select Theological Disputations, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), ‘On Creation’, pt. 8 Latin</span></figcaption>

<blockquote><p>…as the soul of man is said to be in the head or heart, so conceive of God’s being in Heaven. The soul (we know) animates the whole body of man, and by the presence of it in every member communicates life to the whole: yet by way of preeminency and excellency it is said to be in the head or heart of man, because in these two parts of man, and from thence she exercises her cheifest functions, and derives her cheifest influence.</p></blockquote>

<blockquote><p>XXIV. It is asked, fifth, whether infants before all use of reason are subject to actual sin… The Reformed, although they acknowledge that original corruption is actually present in infants, from which by nature they are prone to all actual sins, and moreover bear in themselves the seeds of the same, nonetheless deny that they are properly subject to any actual sin… Nevertheless they object:… (2) That the human mind consists in actual thought, which can not only be congruent with divine law, but also repugnant to it. I respond: (1) That the human mind is a thinking substance which, with organs adequately disposed, can think, we do not doubt, just as it is a reasoning substance, not because it is always reasoning in actuality, but because it can reason, with necessary things put in place.</p></blockquote>

<blockquote><p>…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.</p></blockquote>

<blockquote><p>…the Scholastic view (which… committed as it is to an Aristotelian understanding of causation on which the connection between the mind and the world is not especially problematic)… Thus was invented [by the mechanical philosophy in the mid-1600’s with Descartes and others] the famous ‘mind-body problem&#x27;” It seems that mind cannot possibly be reduced to matter; and yet it also seems that the mind could not possibly interact with the material world in the way it does if it was not itself material. How to resolve the paradox? That’s the problem. It has appeared to some philosophers to be unsolvable; and it is unsolvable if one clings pathologically (as contemporary philosophers do) to the mechanistic assumptions that created the problem in the first place. The only way to solve it is to return to the Aristotelian-Thomistic conception of the soul as the form of the body, having certain immaterial operations but nevertheless ‘interacting’ with the material world as a formal rather than an efficient cause.</p></blockquote>

c%20view%20%28which&amp;text=as%20a%20formal%20rather%20than%20an%20efficient%20cause" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Spiritual substance is distinguished from matter by the characteristic of self-motion, or motion ab intra [from inside]. Matter must be moved from without, by another material substance impinging upon it. But mind moves from within. Its motion is not from external impact, but is self-motion. Adam was created a spirit. The instant, therefore, that he was created, he had all the characteristics that distinguish spirit from matter. One of these, and one of the most important, is self-motion. But self-motion is self-determination, and self-determination is inclination. The Scripture asserts that Adam was created a ‘living soul.’ Life implies motion; and the motion in this case was not mechanical or material, but the motion of mind. Thus in creating a rational spirit, God creates a self-moving essence, and this is a self-determining will.</p></blockquote>

<blockquote><p>Similarly, the soul of a man isn’t a complete substance; only the soul and body (i.e. the form and matter) together constitute a thing or substance, that is, a man. It isn’t the soul that thinks when a man uses his intellect; it is the man himself who thinks, just as it is the man himself, and not the soul, who grows taller, digests his food, and walks around. For this reason, it is not at all surprising that human thought should be very closely correlated with certain brain events even if it is not identical to any of them. Since the soul is the form of the body, including the brain, the connection between them is in many ways like the connection between the form of the some particular table–its round shape, its having four legs, its being brown, etc.–and the matter that make up the table; that is, it i bound to be very close indeed. When the intellect determines that a certain course of action is the best one to take and the will follows it, the body proceeds to move in a way that constitutes the action. The operation of intellect and will constitute in this case is the formal-cum-final caue of the action, of which the firing of the neurons, flexing of the muscles, etc. are the material cause. Then there is the fact that even though the intellect itself operates without any bodily organ, it does depend indirectly on the senses for the raw material from which it abstracts universals or essences (e.g. it abstracts the universal ‘triangularity’ from particular triangles it has perceived). And the sense organs, along with the brain events associated with perceptual experiences, are material. But precisely because the operation of the intellect are not directly dependent on the matter of the brain, the parallel with the form of a table is not exact. If the soul can, unlike the form of a table, function apart from the matter it informs (as it does in thought), then it can also, and again unlike the form of a table, exist apart from the matter it informs, as a kind of incomplete substance.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Similarly, the soul of a man isn’t a complete substance; only the soul and body (i.e. the form and matter) together constitute a thing or substance, that is, a man. It isn’t the soul that thinks when a man uses his intellect; it is the man himself who thinks, just as it is the man himself, and not the soul, who grows taller, digests his food, and walks around. For this reason, it is not at all surprising that human thought should be very closely correlated with certain brain events even if it is not identical to any of them. Since the soul is the form of the body, including the brain, the connection between them is in many ways like the connection between the form of the some particular table–its round shape, its having four legs, its being brown, etc.–and the matter that make up the table; that is, it i bound to be very close indeed. When the intellect determines that a certain course of action is the best one to take and the will follows it, the body proceeds to move in a way that constitutes the action. The operation of intellect and will constitute in this case is the formal-cum-final caue of the action, of which the firing of the neurons, flexing of the muscles, etc. are the material cause. Then there is the fact that even though the intellect itself operates without any bodily organ, it does depend indirectly on the senses for the raw material from which it abstracts universals or essences (e.g. it abstracts the universal ‘triangularity’ from particular triangles it has perceived). And the sense organs, along with the brain events associated with perceptual experiences, are material. But precisely because the operation of the intellect are not directly dependent on the matter of the brain, the parallel with the form of a table is not exact. If the soul can, unlike the form of a table, function apart from the matter it informs (as it does in thought), then it can also, and again unlike the form of a table, exist apart from the matter it informs, as a kind of incomplete substance.”

</figure><figure class="quote" id="q-5b3de544e3" data-kw="">
<blockquote><p>It must also be kept in mind that for the Aristotelian-Thomistic tradition, human beings and their operations are, like other natural substances and processes, to be analyzed in terms of formal, material, efficient and final causes, which together form an irreducible unity. In the case of a thought (such as the thought that snow is white) the neural processes associated with the relevant phantasms [sensory experience or memory] might be regarded as the material cause of a single event of which the intellective activity is the formal cause. To be sure, the analysis of human thought and action in terms of the Aristotelian four-causal explanatory framework is a more complicated business than that suggests. But it is only if that framework is rejected that to acknowledge that there are immaterial aspects of thought can seem to open up what Dillard calls “an apparently unbridgeable gulf between thought and behavior.” And to reject it without argument would simply be to beg the question against the Aristotelian-Thomistic view.</p></blockquote>

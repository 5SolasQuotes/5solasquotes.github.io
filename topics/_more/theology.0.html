<blockquote><p>In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius, 2017) | ch. 6, The Nature of God and of His Relationship to the World, p. 170</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-8b352127fe" data-kw="">
<blockquote><p>To this principle of contradiction or of identity is subordinated the principle of sufficient reason, which in its generality may be formulated thus: ‘Everything that is has its raison d’etre, in itself, if of itself it exists, in something else, if of itself it does not exist.’ But this generality must be understood in senses analogically different. First. [Formal cause] The characteristics of a thing, e.g.: a circle, have their raison d’etre in the essence (nature) of that thing. [In a siimlar way the sufficient reason for God is in Himself] Secondly. [Efficient cause] The existence of an effect has its raison d’etre in the cause which produces and preserves that existence, that is to say, in the cause which is the reason not only of the ‘becoming,’ but also of the continued being of that effect. Thus that which is being by participation has its reason of existence in that which is being by essence [namely God]. Thirdly. [Final cause] Means have their raison d’etre in the end, the purpose, to which they are proportioned. Fourthly, [Material cause] Matter is the raison d’etre of the corruptibility of bodies. This principle, we see, is to be understood analogically, according to the order in which it is found, whether that order is intrinsic (the nature of a circle related to its characteristics [or in something being material and corruptible]): or extrinsic (cause, efficient or final, to its effects). When I ask the reason why, says St. Thomas, I must answer by one of the four causes. Why has the circle these properties? By its intrinsic nature. Why is this iron dilated? Because it has been heated (efficient cause). Why did you come? For such or such a purpose. Why is man mortal? Because he is a material composite, hence corruptible. [Unfallen Adam was capable of dying though He would not have died by the providence of God if he had remained upright.] Thus the raison d’etre, answering the question ‘why’ (propter quid): is manifold in meaning, but these different meanings are proportionally the same, that is, analogically. We stand here at a central point. We see that the efficient cause presupposes the very universal idea of cause, found also in the final cause, and in formal cause, as well as in the agent. Thus the principle of sufficient reason had been formulated long before Leibnitz.</p></blockquote>

<blockquote><p>50. Being is divided into substance and accident. … About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. … Relative Being to Absolute Being [see pp. 69-72 of the Summary] 52. If there is relative being, absolute being must exist. For once the existence of a purely relative being has been admitted, some other beings must exist, namely subject, term and foundation [p. 69]. But all these are as it were the matter of relation and so are not formally the relation, nor formally ‘existing-to’; therefore they are absolute beings. But even on the other opinion, this proposition can in some way be saved. For if relative being is formally a being of reason with a foundation in the thing, something truly real and therefore absolute is required, namely the foundation itself. 53. From the nature of relation, it is plain that relation cannot be found, nor be known, unless subject, term, and foundation are present and known respectively at the same time. And in this sense can the Aristotelian-Scholastic dictum be understood: ‘relatives are simultaneous in nature and in understanding’. … Proof of God … 7. God knows all individuals, not only as absolute beings and in themselves, but also knows them according to all the relations that one has to all the others. This conclusion too is plain from the perfection of God’s knowledge. … Conclusions Respecting Reality … 29. Every being is good, or being and good convert. Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty, or the will…</p></blockquote>

nd foundation are present and known respectively at the same time. And in this sense can the Aristotelian-Scholastic dictum be understood: ‘relatives are simultaneous in nature and in understanding’. … Proof of God … 7. God knows all individuals, not only as absolute beings and in themselves, but also knows them according to all the relations that one has to all the others. This conclusion too is plain from the perfection of God’s knowledge. … Conclusions Respecting Reality … 29. Every being is good, or being and good convert. Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty, or the will…”

— Allan B. Wolter, ‘Allan Wolter’s Conclusions respecting Reality, Proving God’, (1958), ‘Conclusions respecting Reality’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C50.+Being+is+divided+into+substance+and+accident.+%E2%80%A6+About+knowledge+of+the+formal+idea+of+accident+one+must+note+that+%E2%80%98in+another%E2%80%99+or+%E2%80%98in-anotherness%E2%80%99+is+correlative%2C+for+it+involves+something+in+which+it+is.+But+to+perceive+some+relation%2C+there+is+need+of+knowledge+of+the+terms+of+the+relation+in+themselves.+Our+first+knowledge+of+reality%2C+therefore%2C+seems+to+be+knowledge+of+things+as+absolute+objects+and+not+in+their+relation+to+other+beings.+But+when+we+say+that+accidents+are+immediately+experienced+as+beings+in+another+the+sense+is%3A+this+knowledge+is+not+by+way+of+reasoning+out+but%2C+from+phenomenological+analysis+of+the+givens+of+experience%2C+we+perceive+through+simple+apprehension+this+relation+of+%E2%80%98in-anotherness%E2%80%99.+Shape%2C+for+instance%2C+is+not+only+perceived+in+itself+and+as+something+absolute+but+also+in+its+relation+to+extension+and+color%2C+namely+as+the+limit+of+a+colored+expanse.+But+in+other+cases+it+seems+we+do+not+immediately+perceive+the+idea+of+%E2%80%98in-anotherness%E2%80%99%2C+but+rather+we+infer+it+by+reasoning+out.+This+happens%2C+for+example%2C+with+quantity.+No+wonder+then+that+some%2C+as+Descartes%2C+identified+extension+with+material+substance+as+such.+%E2%80%A6+Relative+Being+to+Absolute+Being+%5Bsee+pp.+69-72+of+the+Summary%5D+52.+If+there+is+relative+being%2C+absolute+being+must+exist.+For+once+the+existence+of+a+purely+relative+being+has+been+admitted%2C+some+other+beings+must+exist%2C+namely+subject%2C+term+and+foundation+%5Bp.+69%5D.+But+all+these+are+as+it+were+the+matter+of+relation+and+so+are+not+formally+the+relation%2C+nor+formally+%E2%80%98existing-to%E2%80%99%3B+therefore+they+are+absolute+beings.+But+even+on+the+other+opinion%2C+this+proposition+can+in+some+way+be+saved.+For+if+relative+being+is+formally+a+being+of+reason+with+a+foundation+in+the+thing%2C+something+truly+real+and+therefore+absolute+is+required%2C+namely+the+foundation+itself.+53.+From+the+nature+of+relation%2C+it+is+plain+that+relation+cannot+be+found%2C+nor+be+known%2C+unless+subject%2C+term%2C+and+foundation+are+present+and+known+respectively+at+the+same+time.+And+in+this+sense+can+the+Aristotelian-Scholastic+dictum+be+understood%3A+%E2%80%98relatives+are+simultaneous+in+nature+and+in+understanding%E2%80%99.+%E2%80%A6+Proof+of+God+%E2%80%A6+7.+God+knows+all+individuals%2C+not+only+as+absolute+beings+and+in+themselves%2C+but+also+knows+them+according+to+all+the+relations+that+one+has+to+all+the+others.+This+conclusion+too+is+plain+from+the+perfection+of+God%E2%80%99s+knowledge.+%E2%80%A6+Conclusions+Respecting+Reality+%E2%80%A6+29.+Every+being+is+good%2C+or+being+and+good+convert.+Just+as+ontological+truth+states+the+relation+of+being+to+the+cognitive+faculty%2C+so+goodness+involves+a+relation+to+the+appetitive+faculty%2C+or+the+will%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99%2C+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44e5959ce1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44e5959ce1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=50.%20Being%20is%20divided%20into%20substance,the%20appetitive%20faculty%2C%20or%20the%20will&amp;text=50.%20Being%20is%20divided%20into%20substance%20and%20accident&amp;text=relation%20to%20the%20appetitive%20faculty%2C%20or%20the%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fa36de1ec1" data-kw="">
<blockquote><p>Cognition, according to St. Thomas, is a form of tendency by which the knower, without ceasing to be himself, becomes something else. A cognitive faculty is a capacity to take on the form of another being. The form received into the intellect is called the intelligible species. By it the knower is given the formal or intelligible determinations of the thing known. Thus informed, the knower actively expresses or acts out the part of the thing known, so that the accidental act of the knower becomes one (in intention) with the act of the thing known… This intention, expressed by the knower and expressing the thing known, has a twofold relation: it is a form or quality perfecting the knower and a relation of likeness to the thing known. Viewed in this latter relation, according to what it expresses, it is essentially the relation of truth, the conformity of intellect to thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-schmidt.html">Robert Schmidt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Domain of Logic according to S. Thomas Aquinas</cite>, (Hague: Martinus Nijhoff, 1966), ‘Conclusion’ | ‘Intention’ 306-8</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>1. Theology is usually divided into the Theology of the Laity and the Theology of the Doctors, which they call argumentative and Scholastic. The former is a bare knowledge of the credibilia (as they call them) necessary for salvation. The latter is not a bare knowledge of the credibilia, but is the faculty by which we are able to explain, defend, and confirm the articles of faith, and to instruct others concerning their truth. 2. Argumentative or Scholastic Theology is said to exceed the Theology of the Laity in a twofold respect: first, because it extends itself to more credibilia; for learned men in spiritual matters understand more than the Laity and the simple. Secondly, because it is able to explain to others those things which are to be believed, and to defend and confirm them against Atheists, Jews, Mohammedans, and Pagans.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. Theology is usually divided into the Theology of the Laity and the Theology of the Doctors, which they call argumentative and Scholastic. The former is a bare knowledge of the credibilia (as they call them) necessary for salvation. The latter is not a bare knowledge of the credibilia, but is the faculty by which we are able to explain, defend, and confirm the articles of faith, and to instruct others concerning their truth. 2. Argumentative or Scholastic Theology is said to exceed the Theology of the Laity in a twofold respect: first, because it extends itself to more credibilia; for learned men in spiritual matters understand more than the Laity and the simple. Secondly, because it is able to explain to others those things which are to be believed, and to defend and confirm them against Atheists, Jews, Mohammedans, and Pagans.”

— Robert Baron, Philosophy, the Handmaiden of Theology 2nd, ed. trans. AI (1621; Robinson &amp; Davis, 1658), 3rd Exercise, art. 7, p. 91 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Theology+is+usually+divided+into+the+Theology+of+the+Laity+and+the+Theology+of+the+Doctors%2C+which+they+call+argumentative+and+Scholastic.+The+former+is+a+bare+knowledge+of+the+credibilia+%28as+they+call+them%29+necessary+for+salvation.+The+latter+is+not+a+bare+knowledge+of+the+credibilia%2C+but+is+the+faculty+by+which+we+are+able+to+explain%2C+defend%2C+and+confirm+the+articles+of+faith%2C+and+to+instruct+others+concerning+their+truth.+2.+Argumentative+or+Scholastic+Theology+is+said+to+exceed+the+Theology+of+the+Laity+in+a+twofold+respect%3A+first%2C+because+it+extends+itself+to+more+credibilia%3B+for+learned+men+in+spiritual+matters+understand+more+than+the+Laity+and+the+simple.+Secondly%2C+because+it+is+able+to+explain+to+others+those+things+which+are+to+be+believed%2C+and+to+defend+and+confirm+them+against+Atheists%2C+Jews%2C+Mohammedans%2C+and+Pagans.%E2%80%9D%0A%0A%E2%80%94+Robert+Baron%2C+Philosophy%2C+the+Handmaiden+of+Theology+2nd%2C+ed.+trans.+AI+%281621%3B+Robinson+%26+Davis%2C+1658%29%2C+3rd+Exercise%2C+art.+7%2C+p.+91+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fde4599187b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/de4599187b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scholastic-theology/#:~:text=1.%20Theology%20is%20usually%20divided%20into,against%20Atheists%2C%20Jews%2C%20Mohammedans%2C%20and%20Pagans&amp;text=1.%20Theology%20is%20usually%20divided%20into%20the%20Theology&amp;text=confirm%20them%20against%20Atheists%2C%20Jews%2C%20Mohammedans%2C%20and%20Pagans" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-757858b68f" data-kw="">
<blockquote><p>In this scholastic theology is to be praised: 1. the simple and concise kind of language; 2. the accurate and dialectical method; 3. the use or support of philosophy and natural disciplines. They are to be blamed, however, out of themselves, even the defenders of it, by: 1. the obnoxious doctrine of the papacy unto tyranny; and hence it is false in many ways; 2. the multitude of philosophical things; 3. the curiosity of vain inquiries [or topics]; 4. the confusion itself of things, arising out of an ignorance of languages; 5. obscurity and barbarities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-burman.html">Francis Burman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of Theology</cite>, (Utrecht: Noenardus, 1671), vol. 1, bk. 1, ch. 2, section 47, p. 12 trans. T. Fentiman</span></figcaption>

</figure><figure class="quote" id="q-fd689867fb" data-kw="">
<blockquote><p>It [theology] is called doctrine, not to separate it from understanding, knowledge, wisdom, art or prudence–for these go with every exact discipline, and most of all with theology–but to mark it as a discipline which derives not from nature and human inquiry like others, but from divine revelation and appointment. Isa. 51:4, ‘Doctrine shall go forth from Me;’ Mt. 21:25, ‘From heaven… Why then did you not believe him?’; Jn. 9:29, ‘We know that God has spoken to Moses;’ Gal. 1:11-12, ‘The gospel… is not according to man. For I neither received it from man, nor was I taught it, but it came through a revelation;’ Jn. 6:45. 3. The principles of other arts, since they are inborn in us, can be developed through sense perception, observation, experience and induction, and so brought to perfection. But the basic principles of theology, though they be advanced by study and industry, are not in us by nature. Matt. 16:17, ‘Flesh and blood has not revealed this to you.’ 4. Every art has its rules to which the work of the person practicing it corresponds. Since living is the noblest work of all, there cannot be any more proper study than the art of living well. 5. Since the highest kind of life for a human being is that which approaches most closely the living and life-giving God, the nature of theological life is living to God. … 8. Although it is within the compass of this life to live both happily and well, euzoia, living well, is more excellent than eudaimonia, living happily. What chiefly and finally ought to be striven for is not happiness which has to do with our own pleasure, but goodness which looks to God’s glory… … 10. Now since this life so willed is truly and properly our most important practice, it is self-evident that theology is not a speculative discipline but a practical one–not only in the common respect that all disciplines have eupraxia, good practice, as their end, but in a special and peculiar manner compared with all others. 11. Nor is there anything in theology which does not refer to the final end or to the means related to that end–all of which refer directly to practice. 12. This practice of life is so perfectly reflected in theology that there is no precept of universal truth relevant to living well in domestic economy, morality, political life or law-making which does not rightly pertain to theology. 13. Theology, therefore, is to us the ultimate and noblest of all exact teaching arts. It is a guide and master plan for our hightest end, sent in a special manner from God, treating of divine things, tending towards God, and leading man to God. It may therefore not incorrectly be called theozoia, a living to God, theourgia, a working towards God, as well as theology.</p></blockquote>

ks Online</a></div>
</figure><figure class="quote" id="q-14f9d5ee14" data-kw="">
<blockquote><p>Second, by metonymy and metaphor [metaphoram metonymicam], it can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Use of Reason in Matters of Faith’ in Willem J. van Asselt, Introduction to Reformed Scholasticism</cite>, (RHB, 2011), Appendix 2, pp. 226-27</span></figcaption>

</figure><figure class="quote" id="q-1f3ebcac39" data-kw="">
<blockquote><p>The holy scripture therefore, designing by revealed religion to maintain and improve natural religion, to repair the decays of it and supply the defects of it, since the fall, for the reviving of the precepts of the law of nature, lays down, at first, this principle of the unclouded light of nature, That this world was, in the beginning of time, created by a Being of infinite wisdom and power, who was himself before all time and all worlds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Henry’s Commentary on the Whole Bible: Complete &amp; Unabridged in One Volume</cite>, (Hendrickson, 1994), p. 3</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The holy scripture therefore, designing by revealed religion to maintain and improve natural religion, to repair the decays of it and supply the defects of it, since the fall, for the reviving of the precepts of the law of nature, lays down, at first, this principle of the unclouded light of nature, That this world was, in the beginning of time, created by a Being of infinite wisdom and power, who was himself before all time and all worlds.”

<blockquote><p>It is very true, that things subordinate are not at variance. There is a natural end. As nature is subordinate to God, so natural ends are subordinate to those which are supernatural and divine. The end of our nature, so far as it is natural, is this, that it should approach very near to the Divine; so far as it is supernatural, it is that man may be united to God.</p></blockquote>

</figure><figure class="quote" id="q-b89b78d223" data-kw="">
<blockquote><p>The Law of Nature cannot direct us unto a supernatural end, as is acknowledged not only by our divines (Junius, De Politia Mosaica, ch. 1; Paraeus, Commentary on Rom. 1:19), but by Aquinas also (1a, 2a, q. 91, article 4). It only teaches us to seek and to do bonum, velut finem naturae, ‘such a good as is an end proportioned to Nature’ (Junius). All those precepts of the Law of Nature which we have spoken of, could never lead men to a supernatural good (Junius). It is only the Divine Law, revealed from God, which informs the minds of men with such notions as are supra naturam [above nature], and which may guide them ad finem supernaturalem [to a supernatural end].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (1637), pt. 3, ch. 9, ‘That the Lawfulness of the Ceremonies Cannot be Warranted by the Law of Nature’, p. 200</span></figcaption>

</figure><figure class="quote" id="q-ff3f337631" data-kw="">
<blockquote><p>What is the purpose of human existence? Both Christianity and classical philosophy in the Platonic and Aristotelian traditions answer that our highest end is to know God. But there is, according to Roman Catholic theology, a crucial difference between the knowledge of God that philosophy makes possible, and the kind that Christian revelation promises. Unaided human reason can establish that there exists a divine first cause of the world. It can infer God’s unity, perfect goodness, omnipotence, omniscience, and many other divine attributes. But it cannot afford us a direct (as opposed to merely inferential) knowledge of God’s very essence or nature. For example, it cannot reveal the Trinitarian inner life of God as three divine Persons. The direct apprehension of God’s essence is known as the beatific vision, and Catholic teaching holds that it is not something we are naturally capable of. Attaining it requires grace or supernatural assistance in the sense of special divine action to raise us above or beyond (hence the prefix “super-”) what our nature makes possible. Since it is not an end we are naturally capable of achieving, neither is it an end we are by nature made for. Rather, it is a supernatural end (again, in the sense of above or beyond our nature), to which God has graciously raised us. By nature alone we are aimed only toward an incomplete knowledge of God, such as the kind that philosophy provides. By grace we are directed toward the most intimate knowledge of him that is possible for a created thing. I have left out various nuances and details… On one side [of the 20th century Romanist debate] were Thomist theologians (that is to say, followers of St. Thomas Aquinas) such as Reginald Garrigou-Lagrange (1877–1964), who developed and defended the account just summarized. … …human beings are not, by nature, completely closed off to the beatific vision. They do by nature have what is called an “obediential potency” for it, a built-in capacity to have a supernatural end added to them. But Hart [who is Eastern Orthodox] dismisses this notion as doubletalk. If we really have such a capacity, he says, then this would after all amount to a natural orientation toward the beatific vision; whereas if it would not amount to that, then we are back to the problem that, by raising us to that end, God would be replacing us with some other kind of creature rather than transforming us. The notion of an “obediential potency” is supposed to be a middle ground between these options, but, Hart insists, there is no such middle ground. Yet that Hart is wrong about this is clear even from simple analogies drawn from everyday modern life. Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories (via download, or through USB and HDMI ports and the like)—including, if it is old enough, some that had not even been invented at the time the computer was designed and manufactured. Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them. Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice. Now, like other critics of the Thomist position, Hart insists that an orientation toward the supernatural end of the beatific vision is natural to us. Taken at face value, this is simply incoherent. If an orientation toward a certain end really is natural to us, then it makes no sense to describe it as supernatural (that is to say, beyond our nature). Or, if it really is supernatural, then it makes no sense to describe it as natural. However, in fairness to Hart, I don’t think he is actually guilty of this particular sort of incoherence. In order to be guilty of it, you have to acknowledge that there really is a distinction in reality between the natural order and the supernatural order. Catholic thinkers like de Lubac do acknowledge this, which is why it is difficult for them to formulate a coherent alternative to the Thomist position. But Hart does not acknowledge it. He insists on collapsing the distinctions between natural and supernatural, between nature and grace, and between God’s creating us and his orienting us to the beatific vision. And this is where his position becomes truly radical—indeed, as I have said, pantheistic. To understand how and why Hart goes in the extreme direction he does, it is useful to note that one of the motivations for the Thomist position he rejects is the thesis that the vision of God’s very essence is natural only to God himself, and not to any created thing (as Aquinas says in Question 27, Article 2 of De Veritate). This implies that to attribute to human beings a natural capacity to know God’s very essence would be to identify them with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’</cite>, (2022) at Public Discourse</span></figcaption>

to say, beyond our nature). Or, if it really is supernatural, then it makes no sense to describe it as natural. However, in fairness to Hart, I don’t think he is actually guilty of this particular sort of incoherence. In order to be guilty of it, you have to acknowledge that there really is a distinction in reality between the natural order and the supernatural order. Catholic thinkers like de Lubac do acknowledge this, which is why it is difficult for them to formulate a coherent alternative to the Thomist position. But Hart does not acknowledge it. He insists on collapsing the distinctions between natural and supernatural, between nature and grace, and between God’s creating us and his orienting us to the beatific vision. And this is where his position becomes truly radical—indeed, as I have said, pantheistic. To understand how and why Hart goes in the extreme direction he does, it is useful to note that one of the motivations for the Thomist position he rejects is the thesis that the vision of God’s very essence is natural only to God himself, and not to any created thing (as Aquinas says in Question 27, Article 2 of De Veritate). This implies that to attribute to human beings a natural capacity to know God’s very essence would be to identify them with God.”

gou-Lagrange+%281877%E2%80%931964%29%2C+who+developed+and+defended+the+account+just+summarized.+%E2%80%A6+%E2%80%A6human+beings+are+not%2C+by+nature%2C+completely+closed+off+to+the+beatific+vision.+They+do+by+nature+have+what+is+called+an+%E2%80%9Cobediential+potency%E2%80%9D+for+it%2C+a+built-in+capacity+to+have+a+supernatural+end+added+to+them.+But+Hart+%5Bwho+is+Eastern+Orthodox%5D+dismisses+this+notion+as+doubletalk.+If+we+really+have+such+a+capacity%2C+he+says%2C+then+this+would+after+all+amount+to+a+natural+orientation+toward+the+beatific+vision%3B+whereas+if+it+would+not+amount+to+that%2C+then+we+are+back+to+the+problem+that%2C+by+raising+us+to+that+end%2C+God+would+be+replacing+us+with+some+other+kind+of+creature+rather+than+transforming+us.+The+notion+of+an+%E2%80%9Cobediential+potency%E2%80%9D+is+supposed+to+be+a+middle+ground+between+these+options%2C+but%2C+Hart+insists%2C+there+is+no+such+middle+ground.+Yet+that+Hart+is+wrong+about+this+is+clear+even+from+simple+analogies+drawn+from+everyday+modern+life.+Consider+the+laptop+computer+on+which+you+might+be+reading+this.+There+is+an+obvious+sense+in+which+it+is+complete+all+by+itself%2C+with+its+operating+system%2C+other+software+installed+in+the+factory%2C+built-in+Wi-Fi+capability%2C+and+so+on.+Yet+it+has+the+capacity+to+have+added+to+it+all+sorts+of+new+software+and+accessories+%28via+download%2C+or+through+USB+and+HDMI+ports+and+the+like%29%E2%80%94including%2C+if+it+is+old+enough%2C+some+that+had+not+even+been+invented+at+the+time+the+computer+was+designed+and+manufactured.+Since+software+and+accessories+of+the+latter+sort+were+not+even+in+view+when+the+computer+was+designed%2C+they+cannot+be+said+to+be+ends+for+which+the+computer+was+made.+All+the+same%2C+they+are+ends+that+might+be+added+to+it%2C+because+it+does+at+least+have+the+inherent+capacity+to+have+such+ends+added+to+it.+This+is+analogous+to+the+notion+of+an+%E2%80%9Cobediential+potency%2C%E2%80%9D+and+it+indicates+the+sense+in+which+there+is+indeed+a+middle+ground+of+just+the+sort+Hart+claims+is+impossible.+In+what+Thomists+call+a+state+of+%E2%80%9Cpure+nature%2C%E2%80%9D+human+beings+would+not+have+the+beatific+vision+as+an+end+to+which+they+are+directed%2C+any+more+than+a+computer+is+oriented+toward+running+some+application+that+did+not+even+exist+when+it+was+manufactured.+But+just+as+a+computer+does+nevertheless+have+a+capacity+to+have+such+applications+added+to+it%2C+so+too+are+human+beings+made+in+such+a+way+that+an+orientation+toward+the+beatific+vision+might+be+imparted+to+them.+Hart%E2%80%99s+second+main+objection+is+that+any+rational+creature+would%2C+just+by+virtue+of+being+rational%2C+desire+to+know+the+very+essence+of+the+first+cause+of+all+things%2C+so+that+such+knowledge+would+be+its+natural+end.+There+is+a+sense+in+which+the+premise+is+true%2C+but+the+conclusion+does+not+follow.+To+borrow+an+example+from+the+philosopher+Thomas+Nagel%2C+consider+that+there+is+an+obvious+sense+in+which+a+human+being+might+desire+to+know+what+it+is+like+to+be+a+bat%E2%80%94to+fly+through+the+air+the+way+a+bat+does%2C+to+get+around+via+echolocation%2C+and+so+on.+Yet+there+is+also+an+obvious+sense+in+which+it+is+simply+not+part+of+our+nature+to+do+these+things%2C+so+that+human+beings+can+live+complete+lives+as+the+kind+of+creatures+we+are+without+doing+them.+For+that+reason%2C+our+curiosity+about+what+it+is+like+to+be+a+bat+does+not+entail+a+sense+of+deprivation+or+loss+in+the+way+that%2C+say%2C+a+missing+limb+would.+In+an+analogous+way%2C+had+human+beings+been+created+in+a+state+of+%E2%80%9Cpure+nature%2C%E2%80%9D+without+a+divinely+imparted+orientation+toward+the+supernatural+end+of+the+beatific+vision%2C+they+might+in+a+sense+nevertheless+wish+that+they+could+have+a+direct+knowledge+of+God%E2%80%99s+very+essence.+But+they+would+also+judge+that+this+is+simply+no+more+possible+for+them+than+it+is+possible+for+them+to+know+what+it+is+like+to+be+a+bat%2C+and+thus+they+would+not+feel+this+impossibility+as+a+deprivation+of+something+they+were+by+nature+made+for.+The+indirect+knowledge+of+God+that+they+are+capable+of+would+suffice.+Now%2C+like+other+critics+of+the+Thomist+position%2C+Hart+insists+that+an+orientation+toward+the+supernatural+end+of+the+beatific+vision+is+natural+to+us.+Taken+at+face+value%2C+this+is+simply+incoherent.+If+an+orientation+toward+a+certain+end+really+is+natural+to+us%2C+then+it+makes+no+sense+to+describe+it+as+supernatural+%28that+is+to+say%2C+beyond+our+nature%29.+Or%2C+if+it+really+is+supernatural%2C+then+it+makes+no+sense+to+describe+it+as+natural.+However%2C+in+fairness+to+Hart%2C+I+don%E2%80%99t+think+he+is+actually+guilty+of+this+particular+sort+of+incoherence.+In+order+to+be+guilty+of+it%2C+you+have+to+acknowledge+that+there+really+is+a+distinction+in+reality+between+the+natural+order+and+the+supernatural+order.+Catholic+thinkers+like+de+Lubac+do+acknowledge+this%2C+which+is+why+it+is+difficult+for+them+to+formulate+a+coherent+alternative+to+the+Thomist+position.+But+Hart+does+not+acknowledge+it.+He+insists+on+collapsing+the+distinctions+between+natural+and+supernatural%2C+between+nature+and+grace%2C+and+between+God%E2%80%99s+creating+us+and+his+orienting+us+to+the+beatific+vision.+And+this+is+where+his+position+becomes+truly+radical%E2%80%94indeed%2C+as+I+have+said%2C+pantheistic.+To+understand+how+and+why+Hart+goes+in+the+extreme+direction+he+does%2C+it+is+useful+to+note+that+one+of+the+motivations+for+the+Thomist+position+he+rejects+is+the+thesis+that+the+vision+of+God%E2%80%99s+very+essence+is+natural+only+to+God+himself%2C+and+not+to+any+created+thing+%28as+Aquinas+says+in+Question+27%2C+Article+2+of+De+Veritate%29.+This+implies+that+to+attribute+to+human+beings+a+natural+capacity+to+know+God%E2%80%99s+very+essence+would+be+to+identify+them+with+God.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+%E2%80%98David+Bentley+Hart%E2%80%99s+Post-Christian+Pantheism%E2%80%99%2C+%282022%29+at+Public+Discourse&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff3f337631.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff3f337631.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-light-of-nature/#:~:text=What%20is%20the%20purpose%20of%20human,be%20to%20identify%20them%20with%20God&amp;text=What%20is%20the%20purpose%20of%20human%20existence%3F%20Both&amp;text=essence%20would%20be%20to%20identify%20them%20with%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>What! is not natural theology the very basis and foundation of revealed? nor without the former can the latter be at all supported. For the instructions we receive from nature want [lack] no further proof, they are in themselves perfectly evident, we are born with them, they are deeply wrought into our frame as rational beings, nor can they be rejected by any, but such as are quite destitute of an intelligent principle; bit revelation, being contained in particular books, must be confirmed by the test of truth, before we can receive it, and it cannot be proved by any principles except such as are derived from the light of nature. For how can I be certain that what God has revealed is credible, unless I have first learned from the light of nature that He is a being of veracity, and therefore cannot possibly deceive me? How can I be sure that this or that revelation derives its origin from the Deity, unless the light of nature has first taught me to know what is worthy and what unworthy of God, and consequently what are the proper characters of a divine revelation? How can I be prevailed with to pay any tribute of adoration to the deity, to discharge certain duties to Him, to cultivate a sense of piety and virtue, unless I have previously learned my duty from the light of nature what I am to understand by an obligation, and the original from which it is derived, and been instructed in the difference betwixt justice and injustice, betwixt piety and impiety? For if justice and injustice are nothing, if virtue is nothing but a word, as it is expressed by the poet, and there is no such thing as a natural obligation, then no revelation can compel me either to avoid or pursue any particular course of action. Wherefore our natural sentiments of things are to be laid down as the principles of all our other knowledge. It is a very just thought of Tertullian that: ‘the Deity has sent nature before as our guide, and afterwards favored us with prophesy, that it might obtain the more easy belief from the person qualified to receive it by the instructions of nature.’ (Of the Resurrection of the Body, ch. 12) But as in recognizing the authority of revelation, so in investigating the sense of it, and settling controversies, we must perpetually have recourse to natural theology. Nor can we possibly give our assent to any thing, as a divine revelation which contradicts the light of nature. Wherefore if any doctrine is attempted to be imposed on us as a revealed truth, which is inconsistent with natural theology, we are on that very account to be absolutely certain that it is an imposture, or at least to try if the passages which seem to contain such a doctrine will bear a construction which will remove the inconsistence, for it is impossible that God can contradict Himself. Thus when the Anthropomorphite asserts that the Deity is possessed of a human form, because the Scripture speaks of his face, his eyes, his ears and arms; natural theology at once convinces us of the delusion, teaching us that God is a being absolutely perfect, and therefore must of consequence be immaterial. … The Scripture itself appeals to these natural perceptions wwe have of the attributes of the supreme Being, and points out to us their great importance and excellence. Thus in the place quoted above from the nineteenth psalm, and in many others of the psalms and prophets, the greatness, wisdom, power and goodness of the Deity are demonstrated from his works. Agreeable to this, Job 12:7-9: ‘But ask now the beasts, and they shall teach thee, and the fowls of the air, and they shall tell thee; or speak to the earth, etc. who knows not that in all these, the hand of the Lord has wrought this?’ In like manner when God complains of the ingratitude and corrupt morals of the people of Israel, as in Isa. 1, 5; Mic. 6 and in a variety of passage of Scripture, He condemns them by appealing to no other principles than the natural perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them. The Scripture declares that the works of nature are an immediate declaration made by God Himself of his parental regard and gracious intentions towards all nations, ‘sending fruitful seasons, and filling their hearts with food and gladness.’ (Acts 14:17) It asserts that the whole of God’s providential care, more especially in those dispensations which respect mankind, is expressed with an immediate view, ‘that men may seek the Lord, if haply they might feel after Him, and find Him’ (Acts 17:25-27) It declares that what may and ought to be known of God is made manifest to all nations; and likewise that ‘the invisible things of God, may be seen from his works, and are placed as it were before our eyes, even his eternal power and godhead;’ and that so great is the brightness of the light of nature, that they who do not give proper attention to it, and glorify God, and praise Him for his goodness, are altogether without excuse; Rom. 1:19-21. It says that these are the riches of his goodness, and forbearance and long suffering, by which God leads us to repentance, Rom. 11:4. It says that our natural sentiments, with respect to the several duties of life, supply the place of a revealed law, ‘that they who have not the law are a law unto themselves, having the work of the law written in their hearts.’ (Rom. 11:14-15) Nor does Christ hesitate to affirm that in the rule which right reason has prescribed to every people, which is, that ‘we should do unto another, what we wish should be done unto ourselves, is contained in the law and the prophets;’ (Mt. 7:12). the strength and excellence of these [Biblical] encomiums on natural revelation cannot be exceeded by anything that can be said on the subject.</p></blockquote>

 perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them. The Scripture declares that the works of nature are an immediate declaration made by God Himself of his parental regard and gracious intentions towards all nations, ‘sending fruitful seasons, and filling their hearts with food and gladness.’ (Acts 14:17) It asserts that the whole of God’s providential care, more especially in those dispensations which respect mankind, is expressed with an immediate view, ‘that men may seek the Lord, if haply they might feel after Him, and find Him’ (Acts 17:25-27) It declares that what may and ought to be known of God is made manifest to all nations; and likewise that ‘the invisible things of God, may be seen from his works, and are placed as it were before our eyes, even his eternal power and godhead;’ and that so great is the brightness of the light of nature, that they who do not give proper attention to it, and glorify God, and praise Him for his goodness, are altogether without excuse; Rom. 1:19-21. It says that these are the riches of his goodness, and forbearance and long suffering, by which God leads us to repentance, Rom. 11:4. It says that our natural sentiments, with respect to the several duties of life, supply the place of a revealed law, ‘that they who have not the law are a law unto themselves, having the work of the law written in their hearts.’ (Rom. 11:14-15) Nor does Christ hesitate to affirm that in the rule which right reason has prescribed to every people, which is, that ‘we should do unto another, what we wish should be done unto ourselves, is contained in the law and the prophets;’ (Mt. 7:12). the strength and excellence of these [Biblical] encomiums on natural revelation cannot be exceeded by anything that can be said on the subject.”

— Jean-Alphonse Turretin, Dissertations on Natural Theology, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 12-18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat%21+is+not+natural+theology+the+very+basis+and+foundation+of+revealed%3F+nor+without+the+former+can+the+latter+be+at+all+supported.+For+the+instructions+we+receive+from+nature+want+%5Black%5D+no+further+proof%2C+they+are+in+themselves+perfectly+evident%2C+we+are+born+with+them%2C+they+are+deeply+wrought+into+our+frame+as+rational+beings%2C+nor+can+they+be+rejected+by+any%2C+but+such+as+are+quite+destitute+of+an+intelligent+principle%3B+bit+revelation%2C+being+contained+in+particular+books%2C+must+be+confirmed+by+the+test+of+truth%2C+before+we+can+receive+it%2C+and+it+cannot+be+proved+by+any+principles+except+such+as+are+derived+from+the+light+of+nature.+For+how+can+I+be+certain+that+what+God+has+revealed+is+credible%2C+unless+I+have+first+learned+from+the+light+of+nature+that+He+is+a+being+of+veracity%2C+and+therefore+cannot+possibly+deceive+me%3F+How+can+I+be+sure+that+this+or+that+revelation+derives+its+origin+from+the+Deity%2C+unless+the+light+of+nature+has+first+taught+me+to+know+what+is+worthy+and+what+unworthy+of+God%2C+and+consequently+what+are+the+proper+characters+of+a+divine+revelation%3F+How+can+I+be+prevailed+with+to+pay+any+tribute+of+adoration+to+the+deity%2C+to+discharge+certain+duties+to+Him%2C+to+cultivate+a+sense+of+piety+and+virtue%2C+unless+I+have+previously+learned+my+duty+from+the+light+of+nature+what+I+am+to+understand+by+an+obligation%2C+and+the+original+from+which+it+is+derived%2C+and+been+instructed+in+the+difference+betwixt+justice+and+injustice%2C+betwixt+piety+and+impiety%3F+For+if+justice+and+injustice+are+nothing%2C+if+virtue+is+nothing+but+a+word%2C+as+it+is+expressed+by+the+poet%2C+and+there+is+no+such+thing+as+a+natural+obligation%2C+then+no+revelation+can+compel+me+either+to+avoid+or+pursue+any+particular+course+of+action.+Wherefore+our+natural+sentiments+of+things+are+to+be+laid+down+as+the+principles+of+all+our+other+knowledge.+It+is+a+very+just+thought+of+Tertullian+that%3A+%E2%80%98the+Deity+has+sent+nature+before+as+our+guide%2C+and+afterwards+favored+us+with+prophesy%2C+that+it+might+obtain+the+more+easy+belief+from+the+person+qualified+to+receive+it+by+the+instructions+of+nature.%E2%80%99+%28Of+the+Resurrection+of+the+Body%2C+ch.+12%29+But+as+in+recognizing+the+authority+of+revelation%2C+so+in+investigating+the+sense+of+it%2C+and+settling+controversies%2C+we+must+perpetually+have+recourse+to+natural+theology.+Nor+can+we+possibly+give+our+assent+to+any+thing%2C+as+a+divine+revelation+which+contradicts+the+light+of+nature.+Wherefore+if+any+doctrine+is+attempted+to+be+imposed+on+us+as+a+revealed+truth%2C+which+is+inconsistent+with+natural+theology%2C+we+are+on+that+very+account+to+be+absolutely+certain+that+it+is+an+imposture%2C+or+at+least+to+try+if+the+passages+which+seem+to+contain+such+a+doctrine+will+bear+a+construction+which+will+remove+the+inconsistence%2C+for+it+is+impossible+that+God+can+contradict+Himself.+Thus+when+the+Anthropomorphite+asserts+that+the+Deity+is+possessed+of+a+human+form%2C+because+the+Scripture+speaks+of+his+face%2C+his+eyes%2C+his+ears+and+arms%3B+natural+theology+at+once+convinces+us+of+the+delusion%2C+teaching+us+that+God+is+a+being+absolutely+perfect%2C+and+therefore+must+of+consequence+be+immaterial.+%E2%80%A6+The+Scripture+itself+appeals+to+these+natural+perceptions+wwe+have+of+the+attributes+of+the+supreme+Being%2C+and+points+out+to+us+their+great+importance+and+excellence.+Thus+in+the+place+quoted+above+from+the+nineteenth+psalm%2C+and+in+many+others+of+the+psalms+and+prophets%2C+the+greatness%2C+wisdom%2C+power+and+goodness+of+the+Deity+are+demonstrated+from+his+works.+Agreeable+to+this%2C+Job+12%3A7-9%3A+%E2%80%98But+ask+now+the+beasts%2C+and+they+shall+teach+thee%2C+and+the+fowls+of+the+air%2C+and+they+shall+tell+thee%3B+or+speak+to+the+earth%2C+etc.+who+knows+not+that+in+all+these%2C+the+hand+of+the+Lord+has+wrought+this%3F%E2%80%99+In+like+manner+when+God+complains+of+the+ingratitude+and+corrupt+morals+of+the+people+of+Israel%2C+as+in+Isa.+1%2C+5%3B+Mic.+6+and+in+a+variety+of+passage+of+Scripture%2C+He+condemns+them+by+appealing+to+no+other+principles+than+the+natural+perceptions+they+had+of+the+duties+they+owed+to+Him%E2%80%93And+when+Christ+or+his+apostles+endeavor+either+to+prove+the+truth+of+their+doctrine%2C+or+to+refute+those+who+had+fallen+into+mistakes+with+respect+to+it%3B+when+they+either+blame+their+disciples%2C+or+exhort+them+to+the+discharge+of+any+duty%2C+they+continually+have+recourse+to+the+light+of+reason%2C+or+to+natural+principles%E2%80%93%E2%80%98Judge+not+according+to+the+outward+appearance%2C+but+judge+right+judgment%2C%E2%80%99+Jn.+7%3A24.+I+speak+to+those+who+have+understanding%2C+judge+ye+what+I+say%2C%E2%80%99+1+Cor.+10%3A15.+And+on+such+occasions+the+Scripture+not+only+appeals+to+our+natural+sentiments%2C+but+points+out+the+particular+ends+for+which+they+were+implanted+in+us%2C+and+in+what+manner+we+are+to+make+the+best+use+of+them.+The+Scripture+declares+that+the+works+of+nature+are+an+immediate+declaration+made+by+God+Himself+of+his+parental+regard+and+gracious+intentions+towards+all+nations%2C+%E2%80%98sending+fruitful+seasons%2C+and+filling+their+hearts+with+food+and+gladness.%E2%80%99+%28Acts+14%3A17%29+It+asserts+that+the+whole+of+God%E2%80%99s+providential+care%2C+more+especially+in+those+dispensations+which+respect+mankind%2C+is+expressed+with+an+immediate+view%2C+%E2%80%98that+men+may+seek+the+Lord%2C+if+haply+they+might+feel+after+Him%2C+and+find+Him%E2%80%99+%28Acts+17%3A25-27%29+It+declares+that+what+may+and+ought+to+be+known+of+God+is+made+manifest+to+all+nations%3B+and+likewise+that+%E2%80%98the+invisible+things+of+God%2C+may+be+seen+from+his+works%2C+and+are+placed+as+it+were+before+our+eyes%2C+even+his+eternal+power+and+godhead%3B%E2%80%99+and+that+so+great+is+the+brightness+of+the+light+of+nature%2C+that+they+who+do+not+give+proper+attention+to+it%2C+and+glorify+God%2C+and+praise+Him+for+his+goodness%2C+are+altogether+without+excuse%3B+Rom.+1%3A19-21.+It+says+that+these+are+the+riches+of+his+goodness%2C+and+forbearance+and+long+suffering%2C+by+which+God+leads+us+to+repentance%2C+Rom.+11%3A4.+It+says+that+our+natural+sentiments%2C+with+respect+to+the+several+duties+of+life%2C+supply+the+place+of+a+revealed+law%2C+%E2%80%98that+they+who+have+not+the+law+are+a+law+unto+themselves%2C+having+the+work+of+the+law+written+in+their+hearts.%E2%80%99+%28Rom.+11%3A14-15%29+Nor+does+Christ+hesitate+to+affirm+that+in+the+rule+which+right+reason+has+prescribed+to+every+people%2C+which+is%2C+that+%E2%80%98we+should+do+unto+another%2C+what+we+wish+should+be+done+unto+ourselves%2C+is+contained+in+the+law+and+the+prophets%3B%E2%80%99+%28Mt.+7%3A12%29.+the+strength+and+excellence+of+these+%5BBiblical%5D+encomiums+on+natural+revelation+cannot+be+exceeded+by+anything+that+can+be+said+on+the+subject.%E2%80%9D%0A%0A%E2%80%94+Jean-Alphonse+Turretin%2C+Dissertations+on+Natural+Theology%2C+tr.+William+Crawford+%28d.+1737%3B+Belfast%3A+Magee%2C+1777%29%2C+Theses+concerning+Natural+Theology+in+General%2C+pp.+12-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89807cb19b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89807cb19b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-light-of-nature/#:~:text=What%21%20is%20not%20natural%20theology%20the,can%20be%20said%20on%20the%20subject&amp;text=What%21%20is%20not%20natural%20theology%20the%20very%20basis&amp;text=anything%20that%20can%20be%20said%20on%20the%20subject" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…it is impossible for the aforesaid truth of faith to be contrary to those principles which reason knows naturally…. Now, the knowledge of naturally known principles is instilled into us by God, since God himself is the author of our nature. Therefore, the divine wisdom also contains these principles. Consequently, whatever is contrary to these principles is contrary to the divine wisdom. Therefore, it cannot be from God. Therefore, those things which are received by faith from divine revelation cannot be contrary to our natural knowledge… God does not instil into man any opinion or belief contrary to natural knowledge… Yet, because it [the word of faith] surpasses reason, some look upon it as though it were contrary to reason; which is impossible.</p></blockquote>

</figure><figure class="quote" id="q-40e246eff8" data-kw="">
<blockquote><p>Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to</cite>, 12. ‘Gradation of Principles &amp; Practices’ in ‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to [Edward] Feser’ (RBO, 2025)</span></figcaption>

</figure><figure class="quote" id="q-be8b63b848" data-kw="">
<blockquote><p>Asking whether you should listen to God or to reason is like asking whether you should listen to Beethoven’s Fifth Symphony or to the recording you have of it. It’s like asking whether the earth is lit up by the sun or by sunlight. It’s like asking whether you should obey your commanding officer or his commands. The natural law of reason is a participation in the eternal law of God ([Thomas, Summa] I-I,91,2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-kreeft.html">Peter Kreeft</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Theology: Spiritual Direction from St. Thomas Aquinas</cite>, … (Ignatius Press, 2014), ch. 82, ‘Listening to Reason is Listening to God’</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-de69b506c5" data-kw="">
<blockquote><p>Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectarum Disputationum Theologicarum Pars Prima</cite>, (Utrecht: Apud Joannem Waesberge, 1658), pp. 3-4 &amp; 7 as quoted in Johannes Hoornbeeck, ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors (1658) tr. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

econdarily&amp;text=Therefore%2C%20our%20doctrine%20is%20that%20in%20elenctic%20theology&amp;text=and%20also%20from%20the%20light%20of%20nature%20secondarily" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cb2eaf7123" data-kw="">
<blockquote><p>When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism</cite>, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.”

— Gisbertus Voetius, Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+we+demand+the+use+of+reason+and+logic%2C+we+no+more+turn+them+into+the+foundations%2C+principles%2C+and+rules+of+faith+than+we+do+our+eyes%2C+ears%2C+and+tongues+without+which+we+can+neither+learn+nor+teach+our+religion%2C+nor+defend+it+against+opponents.+For+us+they+are%2C+therefore%2C+means+and+requirements+without+which+there+is+no+faith+or+theological+knowledge%2C+but+they+are+certainly+not+principles%2C+norms%2C+rules%2C+and+foundations.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Appendix+2%2C+%E2%80%98The+Use+of+Reason+In+Matters+of+Faith%E2%80%99+in+Introduction+to+Reformed+Scholasticism%2C+ed.+Joel+R.+Beeke+%26+Jay+T.+Collier%2C+trans.+Albert+Gootjes+%28Reformation+Heritage+Books%2C+2011%29%2C+p.+12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb2eaf7123.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb2eaf7123.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-use-of-reason-in-theology/#:~:text=When%20we%20demand%20the%20use%20of,not%20principles%2C%20norms%2C%20rules%2C%20and%20foundations&amp;text=When%20we%20demand%20the%20use%20of%20reason%20and&amp;text=are%20certainly%20not%20principles%2C%20norms%2C%20rules%2C%20and%20foundations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0fd57e2451" data-kw="">
<blockquote><p>Having noted these presuppositions, we now say that no human reason can be the principle by which or through which, or else on the ground of which or why we believe, or the foundation, law, or norm for what must be believed, under whose direction we are to judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism</cite>, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 230</span></figcaption>

<blockquote><p>14. What is the legitimate office of reason in the sphere of religion? 1st. Reason is the primary revelation God has made to man, necessarily presupposed in every subsequent revelation of whatever kind. 2d. Hence Reason, including the moral and emotional nature, and experience, must be the organ by means of which alone all subsequent revelations can be apprehended and received. A revelation addressed to the irrational would be as inconsequent as light to the blind. This is the usus organicus [organic use] of reason. 3d. Hence no subsequent revelation can contradict reason acting legitimately within its own sphere. For then (1) God would contradict Himself, and (2) faith would be impossible. To believe is to assent to a thing as true, but to see that it contradicts reason, is to see that it is not true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology 2nd ed., enlarged</cite>, (Bible Institute Colportage Association, 1878), ch. 3, ‘The Sources of Theology’, p. 62</span></figcaption>

</figure><figure class="quote" id="q-0edcc5e7a1" data-kw="">
<blockquote><p>It was a common practise amongst the young students of our universities in the time of the Dunses [after John Duns Scotus] (and is yet amongst too many, whom spots of Dunsery have stained), that if in disputation they were brought to an inconvenience, were it never so absurd, they would haue a distinction, though void of brain and sense, yet a distinction to maintain it. If a man will be perverse, it is no mastery to do it. But as a wise and learned man does say of them, that they are base wits which are so affected, whereas ingenuous minds and natures well-given will rather seek how true that is which they hold than how they may defend it, making greater price of verity than victory: so I may say (yea much more in matters of religion, of faith, of life eternal) a Christian wit and godly mind will search and weigh rather what should be said truly than what may be said probably or colourably at the least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds &amp; John Hart touching the Head &amp; the Faith of the Church</cite>, … (London: Bishop, 1584), p. 44</span></figcaption>

<blockquote><p>VI. Many abuses can also be reckoned up: … (3) When philosophy assumes to itself the office of a master, in articles of faith, not content with that of a servant (as was done by the [Medieval, Romanist] Scholastics who places Aristotle upon the throne; and by the Socinians who would not admit the doctrines of the Trinity, of the incarnation, etc. because they did not seem to be in accordance with the principles of philosophy). (4) When more new distinctions and phrases than necessary are introduced from philosophy into theology under which (oftentimes) new and dangerous errors lie concealed.</p></blockquote>

<blockquote><p>Also together with the heresies you will not inappropriately count scholastic theology, or that philosophical theology that vitiated orthodox theology no less than any heresy.</p></blockquote>

<blockquote><p>6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology. 7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).</p></blockquote>

</figure><figure class="quote" id="q-33dc49d682" data-kw="">
<blockquote><p>…it’s possible to articulate Christian doctrine without formally invoking concepts like “essence,” “substance” and so on. Instead of saying, for example, that in the incarnation there is one hypostasis subsisting in two distinct natures, one can say that there is just Jesus and not someone else and that Jesus always remains both truly God and truly human. However, the fact that the use of the metaphysical language is not absolutely necessary does not mean that the metaphysical resources in question are detached from reality. It does not mean that what they offer us is just a set of coherent rules for saying things – rules that we might either take or leave. On the contrary, the classical metaphysical tradition developed by Christian thinkers like John of Damascus, Thomas Aquinas or the early Reformed theologians and philosophers involves a knowledge of how things are. Indeed, it is fundamentally an exposition of things human beings know to be true prior to engaging in any formal academic work. For example, things do have natures by virtue of which they are similar to other things. There really are substances in which accidents inhere… As we seek ways to express what God is like according to scriptural teaching, we should look to this philosophical tradition, not Kant or Hegel, because it sheds light on reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/steven-j-duby.html">Steven J. Duby</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘In Defense of Christian Philosophy: A Response to Peter Leithart’</cite>, (2018) 22 paragraphs</span></figcaption>

<blockquote><p>Though Christian dogma cannot be explained in terms of Greek philosophy, it also did not come into being apart from it. There is as yet no dogma and theology, strictly speaking, in Scripture. As long as revelation itself was still in progress, it could not become the object of scientific reflection. Inspiration had to be complete before reflection could begin. To speak of “Mosaic”, “Pauline”, or the “Bible’s” theology and dogmatics therefore, is not advisable; the word theology, for that matter, does not occur in Scripture and has only gradually acquired its present meaning. Theology first arose in the Christian community after the naïveté of childhood lay behind it and the adult thinking mind had awakened. Gradually a need arose to think through the ideas of revelation, to link it with other knowledge and to defend it against various forms of attack. For this purpose people needed philosophy. Scientific theology was born with its help. This did not, however, happen accidentally. The church was not the victim of deception. In the formation and development of the dogmas, the church fathers made generous use of philosophy. They did that, however, in the full awareness of and with clear insight into the dangers connected with that enterprise; they were conscious of the grounds on which they did it with express recognition of the word of the apostles as the only rule of faith and conduct. For that reason also they did not utilize the whole of Greek philosophy but made a choice; they only utilized the philosophy that was most suited to help them think through and defend the truth of God. They went to work eclectically and did not take over any single philosophical system, be it either from Plato or from Aristotle, but with the aid of Greek philosophy produced a Christian philosophy of their own. Furthermore, they only used that philosophy as a means. Just as Hagar was the servant of Sarah, as the treasures of Egypt were employed by the Israelites for the adornment of the tabernacle, as the wise men from the East placed their gifts at the feed of the child in Bethlehem, so, in the opinion of the church fathers, philosophy was the servant of theology. From everything it is clearly evident that the use of philosophy in theology was based, not on a mistake, but on firm and clear conviction. The church fathers knew what they were doing. Mind you, this does not rule out the possibility that at some points the influence of philosophy was too strong. But in that connection we must make a distinction between the theology of the fathers and the dogmas of the church. The church was at all times alert against the misuse of philosophy; it not only rejected Gnosticism but also condemned Origenism. And up until now no one has succeeded in explaining the dogmas materially in terms of philosophy; however often this has been attempted, in the end the scriptural character of orthodoxy has been vindicated. Initially the Reformation assumed a hostile posture toward scholasticism and philosophy. But it soon changed its mind. Because it was not, nor wanted to be, a sect, it could not do without theology. Even Luther and Melanchton, therefore, already resumed the use of philosophy and recognized its usefulness. Calvin assumed this high position from the start, saw in philosophy an “outstanding gift of God”, and was followed in this assessment by all Reformed theologians. The question here is not whether theology should make use of a specific philosophical system. Christian theology has never taken over any philosophical system without criticism and given it the stamp of approval. Neither Plato’s nor Aristotle’s philosophy has been held to be the true one by any theologian. That theologians nevertheless preferred these two philosophical systems was due to the fact that these systems best lent themselves to the development and defense of the truth. Present also was the idea that the Greeks and Romans had been accorded a special calling and gift for the life of culture. Still to this day, in fact, our whole civilization is built upon that of Greece and Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Baker), vol. 1, p. 607</span></figcaption>

C+but+with+the+aid+of+Greek+philosophy+produced+a+Christian+philosophy+of+their+own.+Furthermore%2C+they+only+used+that+philosophy+as+a+means.+Just+as+Hagar+was+the+servant+of+Sarah%2C+as+the+treasures+of+Egypt+were+employed+by+the+Israelites+for+the+adornment+of+the+tabernacle%2C+as+the+wise+men+from+the+East+placed+their+gifts+at+the+feed+of+the+child+in+Bethlehem%2C+so%2C+in+the+opinion+of+the+church+fathers%2C+philosophy+was+the+servant+of+theology.+From+everything+it+is+clearly+evident+that+the+use+of+philosophy+in+theology+was+based%2C+not+on+a+mistake%2C+but+on+firm+and+clear+conviction.+The+church+fathers+knew+what+they+were+doing.+Mind+you%2C+this+does+not+rule+out+the+possibility+that+at+some+points+the+influence+of+philosophy+was+too+strong.+But+in+that+connection+we+must+make+a+distinction+between+the+theology+of+the+fathers+and+the+dogmas+of+the+church.+The+church+was+at+all+times+alert+against+the+misuse+of+philosophy%3B+it+not+only+rejected+Gnosticism+but+also+condemned+Origenism.+And+up+until+now+no+one+has+succeeded+in+explaining+the+dogmas+materially+in+terms+of+philosophy%3B+however+often+this+has+been+attempted%2C+in+the+end+the+scriptural+character+of+orthodoxy+has+been+vindicated.+Initially+the+Reformation+assumed+a+hostile+posture+toward+scholasticism+and+philosophy.+But+it+soon+changed+its+mind.+Because+it+was+not%2C+nor+wanted+to+be%2C+a+sect%2C+it+could+not+do+without+theology.+Even+Luther+and+Melanchton%2C+therefore%2C+already+resumed+the+use+of+philosophy+and+recognized+its+usefulness.+Calvin+assumed+this+high+position+from+the+start%2C+saw+in+philosophy+an+%E2%80%9Coutstanding+gift+of+God%E2%80%9D%2C+and+was+followed+in+this+assessment+by+all+Reformed+theologians.+The+question+here+is+not+whether+theology+should+make+use+of+a+specific+philosophical+system.+Christian+theology+has+never+taken+over+any+philosophical+system+without+criticism+and+given+it+the+stamp+of+approval.+Neither+Plato%E2%80%99s+nor+Aristotle%E2%80%99s+philosophy+has+been+held+to+be+the+true+one+by+any+theologian.+That+theologians+nevertheless+preferred+these+two+philosophical+systems+was+due+to+the+fact+that+these+systems+best+lent+themselves+to+the+development+and+defense+of+the+truth.+Present+also+was+the+idea+that+the+Greeks+and+Romans+had+been+accorded+a+special+calling+and+gift+for+the+life+of+culture.+Still+to+this+day%2C+in+fact%2C+our+whole+civilization+is+built+upon+that+of+Greece+and+Rome.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+%28Baker%29%2C+vol.+1%2C+p.+607&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d8fd31874.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d8fd31874.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/philosophy/#:~:text=Though%20Christian%20dogma%20cannot%20be%20explained,upon%20that%20of%20Greece%20and%20Rome&amp;text=Though%20Christian%20dogma%20cannot%20be%20explained%20in%20terms&amp;text=is%20built%20upon%20that%20of%20Greece%20and%20Rome" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

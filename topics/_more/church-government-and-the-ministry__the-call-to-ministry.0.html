</figure><figure class="quote" id="q-ea669cbd29" data-kw="">
<blockquote><p>3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led.

4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving.

5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel, and doctrine concerning Christ the Savior and faith in him, who, without knowledge of Him who alone is the way, can come to life?

6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and Him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>

<blockquote><p>XII. As an instrument, He uses his word (Rom. 10:16), and that of both the Law and the Gospel, in different ways: by the former, indeed, preparing the way for the efficacy of vocation (Gal. 3:24), and by the latter, perfecting the same in the called (Rom. 1:16).

<blockquote><p>4. In this expression of ‘the Covenant,’ the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>

</figure><figure class="quote" id="q-6ac434a282" data-kw="">
<blockquote><p>III. Whether there can be regeneration of adults without antecedent or conjoined external calling through the Word externally set forth; and whether de facto there has been such? Response: The former is not to be denied. To the latter we say that ordinarily it does not happen, according to Rom. 10:15, 17; 1 Cor. 1 [1:21]; 2 [2:4-5], 21 [This should be different], compared with Ps. 147 [vv. 19-20]; Eph. 2:11–12. Nor do I see any example adduced after the new covenant was established. Concerning Abraham, it can be said that he had in his paternal family the external Word handed down from hand to hand through the patriarchs. Concerning Adam and Eve, it can be said that they were the first in whom God established the church after the fall, from whom thenceforth the church was propagated through the external Word. Nor is it certain that their first conversion was accomplished without some Word sounding externally (although in an extraordinary manner, because it was necessary first to establish the order and to begin from them).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>2. And as to the last edition of the Covenant of Grace by Christ [in the New Testament]:

1. The tenor of it extends to all; as is visible Mt. 28:19; Mk. 16:16; Jn. 3:16.

2. And Christ has made it the office of his ministers by his commission to promulgate and offer it to all.

3. And whereas providence concurs not to the universal execution, we must all confess, that Christ came not to put the world into a worse condition than He found them in. If He did any no good by his incarnation, He would do them no harm. Therefore they that never hear the Gospel, are still under the first edition of the Covenant made with Adam and Noah, so far as it is unaltered. I add that word [“so far as it is unaltered”], because, that so far as the promise was to give salvation by the Messiah hereafter to be incarnate, none is now bound to expect his future incarnation, because it is past. But the same benefits that were due to believers before Christs incarnation, are due since upon the true performance of so much of the condition as is still in force, and not repealed. …

4. And also, that more was required then, to be known particularly by the Jews that had the Scripture and tradition to acquaint them with the Messiah to come, than of the rest of the world, that had not those distinct discoveries, nor Abraham’s promises made known unto them: And how much Gen. 3:15 might cause them to understand, we may conjecture by the words. At least this much was required of all, that they believe that their sin deserves punishment and misery, and yet that God of his abundant mercy, by his wisdom securing his truth and justice, will pardon sin and grant salvation to all that truly believe and trust in that his wisdom and mercy, and repent of their sins, and unfeignedly give up themselves to God as their merciful Redeemer. Thus far we are agreed about the grace of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, … (1675), Preface, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>Question 1. If so much knowledge will save a man as helps him to love God as God, may not heathens or infidels at least be saved? For they know that there is one God who is infinitely good and perfect, and more amiable than all the world, and the great benefactor of man, and of the whole creation: So that there is no goodness but what is in Him, or from Him, and through Him, and finally to Him: And man’s will is made to love apprehended good, and follows the last practical act of the intellect, at least where there is no competitor, but omnimoda ratio boni. And all men know that God is not only best in Himself, but good, yea best to them, because that all they have is from Him: and they have daily experience of pardoning grace contrary to their commerit. It seems therefore that they may love God as God. Answer:

1. To cause a man to love God as God, there is necessary both objective revelation of God’s amiableness, and such subjective grace which consists in a right disposition of the soul.

2. Objective revelation is considered as sufficient either to well disposed, or to an ill disposed soul.

3. This right disposition consists both in the abatement of men’s inclinations to contrary (sensual) objects, and in the inclining them to that which is divine and spiritual. And now I answer:

1. It cannot be denied but that so much of God’s amiableness or goodness is revealed to infidels that have not the Gospel, by the means mentioned in the objection, as is sufficient to bring men under an obligation to love God as God, and to leave them unexcusable that do not.

2. Therefore to such the impossibility is not physical, but moral.

3. And there is in that objective revelation, so much sufficiency, as that if the soul itself were sanctified and well disposed, it might love God upon such revelation. (Which [Moses] Amyraldus has largely proved.)

4. But to an unholy and undisposed soul no objective revelation is sufficient without the Spirit’s help and operations.

5. Only the Spirit of Christ the Mediator, as given by and from Him, does thus operate on souls, as savingly to renew them. (Of all this I have discoursed more largely in my Catholic Theology, and the applied Epitome.)

6. Whether ever the Spirit of Christ does thus operate on any that hear not of Christ’s incarnation, must be known either by the Scripture or by experience. [1.] By the Scripture I am not able to prove the universal negative, though it’s easy to prove sanctification incomparably more common in the Church, than on those without, if any there have it. The case of infants and of the Churches, and the world before Christ’s incarnation, must here come into consideration. 2. And by experience no man can prove the negative; because no man has experience what is in the hearts of all the persons in the world.</p></blockquote>

<blockquote><p>1. God never did, nor ever will, justify and save a wicked Jew that lived and died impenitent, though he was of the seed of Abraham, and a Hebrew of the Hebrews, and had all the honour and advantages that attended circumcision. He does and will render indignation and wrath, tribulation and anguish, upon every soul of man that doeth evil; and of the Jew first, whose privileges and professions, instead of screening him from the judgment of God, will but aggravate his guilt and condemnation. See Rom. 2:3, 8–9, 17. Though God has favoured the Jews, above other nations, with the dignities of visible church-membership, yet He will not therefore accept of any particular persons of that dignity, if they allow themselves in immoralities contradictory to their profession; and particularly in persecution, which was now, more than any other, the national sin of the Jews.

2. He never did, nor ever will, reject or refuse an honest Gentile, who, though he has not the privileges and advantages that the Jews have, yet, like Cornelius, fears God, and worships Him, and works righteousness, that is, is just and charitable towards all men, who lives up to the light he has, both in a sincere devotion and in a regular conversation. Whatever nation he is of, though ever so far remote from kindred to the seed of Abraham, though ever so despicable, nay, though in ever so ill a name, that shall be no prejudice to him. God judges of men by their hearts, not by their country or parentage; and, wherever He finds an upright man, He will be found an upright God, Ps. 18:25. Observe, Fearing God, and working righteousness, must go together; for, as righteousness towards men is a branch of true religion, so religion towards God is a branch of universal righteousness. Godliness and honesty must go together, and neither will excuse for the want of the other. But, where these are predominant, no doubt is to be made of acceptance with God. Not that any man, since the fall, can obtain the favour of God otherwise than through the mediation of Jesus Christ, and by the grace of God in Him; but those that have not the knowledge of Him, and therefore cannot have an explicit regard to Him, may yet receive grace from God for his sake, to fear God and to work righteousness; and wherever God gives grace to do so, as He did to Cornelius, He will, through Christ, accept the work of his own hands. Now: (1) This was always a truth, before Peter perceived it, that God respecteth no man’s person; it was the fixed rule of judgment from the beginning: If thou doest well, shalt thou not be accepted? And, if not well, sin, and the punishment of it, lie at the door, Gen. 4:7. God will not ask in the great day what country men were of, but what they were, what they did, and how they stood affected towards Him and towards their neighbors; and, if men’s personal characters received neither advantage nor disadvantage from the great difference that existed between Jews and Gentiles, much less from any less difference of sentiments and practices that may happen to be among Christians themselves, as those about meats and days, Rom. 14:1-23. It is certain the kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost; and he that in these things serveth Christ is accepted of God, and ought to be approved of men; for dare we reject those whom God doth not? (2) Yet now it was made more clear than it had been; this great truth had been darkened by the covenant of peculiarity made with Israel, and the badges of distinction put upon them; the ceremonial law was a wall of partition between them and other nations; it is true that in it God favoured that nation (Rom. 3:1–2; 9:4), and thence particular persons among them were ready to infer that they were sure of God’s acceptance, though they lived as they listed, and that no Gentile could possibly be accepted of God. God had said a great deal by the prophets to prevent and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.</p></blockquote>

<blockquote><p>But beside, suppose there were some petty defects or irregularities in their entry to the exercise of their ministry… yet ye should know it is not every lighter fault of that nature which will warrant Separation; but only such attrocious crimes as either destroys the essence of the ministry and makes it null and void (as your Reverend Mr. [Robert] Brown teaches in the Preface to his Book against Wolrogen, and excellent Mr. [Oliver] Bowels in his Pastor Evangelicus, bk. 1, ch. 4), for recte fieri is one thing, and ratum esse is another, and multa impediunt matrimonium contrahendum, quae non dirimunt contractum; or else does so vitiate their ministry as people cannot join therewith in its ministerial acts without real and native participating in the sin, in God’s account and in the construction of his holy Law: Otherwise if there be any pollution adherent to their ministry, which neither evacuates the essence thereof, nor so intrinsically leprosies it, but ye may communicate in its acts abstractly from and without touching the spot; the sin rests on the men themselves, and ye are not concerned therein farther than to lament it, but not to be scared and debarred by it from joining in their ministerial administrations, they being to you clean, whatever they be to the men themselves.</p></blockquote>

<blockquote><p>X. …What is essential to the ministry cannot be changed without making another ministry. But the essence remaining untouched, it does not cease to be the same ministry, although a varied and manifold change as to the accidents may have taken place. The essence of the ministry is placed in this–that all saving truth pertaining to the conservation of faith and piety be retained and taught; that the true sacraments instituted by Christ may be administered; and that the people may be held under a legitimate government. The accidents make its state good or bad. The good is when the preaching of the Word is pure and entire without any mixture of error or superstition; when the sacraments are rightly celebrated according to the institution of Christ without addition, or detraction, or alteration; and the Christian people are governed in a holy manner according to the Word of God and not in a tyrannical manner. The bad on the other hand is when the truth preached is mixed with errors and superstitions; the sacraments are in different way altered and corrupted; and the government is either confused or unjust and tyrannical… But still it must not be thought that the ministry ought at once to cease and be extinguished on account of any corruption whatsoever and depraved state; as life is not at once extinguished, but can subsist in the midst of weakness and disease.</p></blockquote>

istry/#:~:text=What%20is%20essential%20to%20the%20ministry,the%20midst%20of%20weakness%20and%20disease&amp;text=What%20is%20essential%20to%20the%20ministry%20cannot%20be&amp;text=subsist%20in%20the%20midst%20of%20weakness%20and%20disease" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Kneeling in receiving imposition of hands, which is joined with prayer and invocation, has nothing ado with kneeling in a mediate worship, for in this case a man kneels because of the immediate worship of invocation: But when there is no prayer, I suppose no man will kneel religiously and with a religious respect to those persons or things which are before him, as there purposely in his sight that before them he may adore, which is the kind of kneeling now in question, or if any did so, there were more need to give him instruction than ordination.</p></blockquote>

</figure><figure class="quote" id="q-d0de7ca7d1" data-kw="">
<blockquote><p>But it is further objected by Sutlivius that this could not be such a Presbytery as is among us, because ordination and imposition of hands pertain to none but the ministers of the Word. Answer 1. The children of Israel laid their hands upon the Levites (Num. 8:10), and we would know his reason why he denies the like power to ruling elders now, especially since this imposition of hands is but a gesture of one praying, and a moral sign declaring the person prayed for. 2. Howsoever our practice (which is also approved by good divines, Junius, Cont. 5, book 1, ch. 3; Synopsis Pur. Theol., Disputation 42, Thesis 37) is to put a difference betwixt the act of ordination and the external right thereof, which is imposition of hands, ascribing the former to the whole Presbytery both pastors and elders, and reserving the latter to the ministers of the Word, yet to be done in the name of all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (1641), pt. 2, ch. 3, p. 132</span></figcaption>

</figure><figure class="quote" id="q-063551aa12" data-kw="">
<blockquote><p>2. It is not said that deacons were ordained with fasting and prayer, Acts 6, as the elders are chosen in every Church, Acts 14:23, and as hands are laid upon Paul and Barnabas; Acts 13:3-4, but simply that the apostles, Acts 6:6, prayed and laid their hands on them. Which seemeth to me to be nothing but a sign of praying over the deacons, and no ceremony or sacrament conferring on them the Holy Ghost: And Steven his working of miracles, and speaking with wisdom irresistible was but the fruit of that grace and extraordinary measure of the Holy Ghost abundantly poured forth on all ranks of persons in those days when the prophecy of Joel was now taking its accomplishment; Acts 2:16-19; Joel 2:28-29. which grace was in Steven before he was ordained a deacon by the laying on of hands. Acts 6:3-5. And the Text saith not that Steven did wonders and signs amongst the people by virtue of imposition of hands, or of his deaconry, but because he was full of faith and power. v. 8, else you must make working of miracles a gift bestowed on all those who serve tables, and are not to give themselves to continual praying and the ministry of the Word. I think papists will not say so much of all their priests; and we can say it of none of our pastors, nor doth Chysostom say that Steven, as a deacon, and by virtue of the office of a deacon wrought miracles, but only that his miracles and disputing was a mere consequent of laying on of hands. Further, laying on of hands was taken from the custom of blessing amongst the Jews, Christ laid his hands upon young children and blessed them, yet did he not, thereby, design them to any office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Part 1, ch. 7, section 7, ‘Of Deacons’, pp. 169-70</span></figcaption>

<div class="actions"><button class="copy" data-copy="“2. It is not said that deacons were ordained with fasting and prayer, Acts 6, as the elders are chosen in every Church, Acts 14:23, and as hands are laid upon Paul and Barnabas; Acts 13:3-4, but simply that the apostles, Acts 6:6, prayed and laid their hands on them. Which seemeth to me to be nothing but a sign of praying over the deacons, and no ceremony or sacrament conferring on them the Holy Ghost: And Steven his working of miracles, and speaking with wisdom irresistible was but the fruit of that grace and extraordinary measure of the Holy Ghost abundantly poured forth on all ranks of persons in those days when the prophecy of Joel was now taking its accomplishment; Acts 2:16-19; Joel 2:28-29. which grace was in Steven before he was ordained a deacon by the laying on of hands. Acts 6:3-5. And the Text saith not that Steven did wonders and signs amongst the people by virtue of imposition of hands, or of his deaconry, but because he was full of faith and power. v. 8, else you must make working of miracles a gift bestowed on all those who serve tables, and are not to give themselves to continual praying and the ministry of the Word. I think papists will not say so much of all their priests; and we can say it of none of our pastors, nor doth Chysostom say that Steven, as a deacon, and by virtue of the office of a deacon wrought miracles, but only that his miracles and disputing was a mere consequent of laying on of hands. Further, laying on of hands was taken from the custom of blessing amongst the Jews, Christ laid his hands upon young children and blessed them, yet did he not, thereby, design them to any office.”

<blockquote><p>If [as Thomas Hooker says,] ‘the laying on of hands be no specificating act of an office, because it is used in other performances, as in the sending of Paul and Barnabas to preach to the Gentiles, Acts 13,’ then shall water not be essential to baptism, nor drinking to the Lord’s Supper, nor blessing sacramental in that Supper, because in Levitical washings, in the feasts-sacred, in the Passover, in praying for a blessing to the Word preached, all these were used. It’s loose logic, a genere ad speciem [a genus to the species]; the question is not of laying on of hands in general, but of a certain kind and species of laying on of hands by way of prayer and designation. Mr. Rutherford knows there be diverse kinds of laying on of hands. 2. Nor do I say that the rite is essential to ordination, but of the necessity of before.</p></blockquote>

<blockquote><p>VI. No more can the rite of the sacrament of confirmation than the name be shown from the Scriptures. The apostles indeed employed the imposition of hands (cheirothesian, Acts 8:17; 19:6), but since it is evident that that was done in a visible dispensation of the Holy Spirit in the nascent condition of the church and indeed from a special promise, it is clear that it was an extraordinary rite and for this reason only temporary (whose end ceased together with other miracles). That the sacerdotal chrism and anointing were altogether different from the apostolic laying on of hands (cheirothesia) and that this [chrism/anointing] referred to the bestowal of the extraordinary gifts of the Spirit is not obscurely gathered…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Institutes of Eclenctic Theology, vol. 3, Topic 19, Question 31, ‘The Five False Sacraments of the Romanists’, section 36, ‘Proof that the Orders [of Church Office] are not Sacraments’</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-5bccefe48c" data-kw="">
<blockquote><p>XXXVI… For as to the laying on of hands, it cannot be considered as a sign. (a) It is not an element, but an action. (b) It is common with confirmation and many other things and was practiced even under the Old Testament. (c) It was not instituted by Christ by any command, but is a free ceremony, which we read indeed of having been employed, but not of having been instituted; what has been employed, however, ought not at once to be said to have been instituted. Thus the washing of feet and breathing upon the apostles were employed by Christ (Jn. 13:5; Jn. 20:22); yet they were not on that account instituted. (d) Imposition of hands does not pertain to all the orders [of Church office], but only to some.</p></blockquote>

— Francis Turretin, Institutes of Elenctic Theology, Institutes of Eclenctic Theology, vol. 3, Topic 19, Question 31, ‘The Five False Sacraments of the Romanists’, section 36, ‘Proof that the Orders [of Church Office] are not Sacraments’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXXVI%E2%80%A6+For+as+to+the+laying+on+of+hands%2C+it+cannot+be+considered+as+a+sign.+%28a%29+It+is+not+an+element%2C+but+an+action.+%28b%29+It+is+common+with+confirmation+and+many+other+things+and+was+practiced+even+under+the+Old+Testament.+%28c%29+It+was+not+instituted+by+Christ+by+any+command%2C+but+is+a+free+ceremony%2C+which+we+read+indeed+of+having+been+employed%2C+but+not+of+having+been+instituted%3B+what+has+been+employed%2C+however%2C+ought+not+at+once+to+be+said+to+have+been+instituted.+Thus+the+washing+of+feet+and+breathing+upon+the+apostles+were+employed+by+Christ+%28Jn.+13%3A5%3B+Jn.+20%3A22%29%3B+yet+they+were+not+on+that+account+instituted.+%28d%29+Imposition+of+hands+does+not+pertain+to+all+the+orders+%5Bof+Church+office%5D%2C+but+only+to+some.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+Institutes+of+Eclenctic+Theology%2C+vol.+3%2C+Topic+19%2C+Question+31%2C+%E2%80%98The+Five+False+Sacraments+of+the+Romanists%E2%80%99%2C+section+36%2C+%E2%80%98Proof+that+the+Orders+%5Bof+Church+Office%5D+are+not+Sacraments%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5bccefe48c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/5bccefe48c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-laying-on-of-hands/#:~:text=For%20as%20to%20the%20laying%20on,Church%20office%5D%2C%20but%20only%20to%20some&amp;text=For%20as%20to%20the%20laying%20on%20of%20hands&amp;text=orders%20%5Bof%20Church%20office%5D%2C%20but%20only%20to%20some" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Your next exception against the presbytery is for their expectants, these be the sons of the prophers, who in their preparations for the ministry, at their first exercises for assay and trial are heard in the presbytery; with this practise no reasonable man can find fault; it is naturally impossible for any, without a miracle, to attain the habit of preaching but by diverse initial and preparatory actions; where can these be so fitly performed as in the classes [presbyteries]? The expectants are present in the classes for their training, not as members, for they do not voice in any matters of discipline. The true mystery of this controversy is that the expectants [in Anglicanism] are permitted to preach before the holy hands of a bishop have conferred upon them the order of a deacon, and so [have] power to preach and baptize: The Church of Scotland did always reject this corruption as clearly contrary to Scripture.</p></blockquote>

<blockquote><p>Ordination is the act of a presbytery.[t] The power of ordering the whole work of ordination is in the whole presbytery, which, when it is over more congregations than one, whether these congregations be fixed or not fixed, in regard of officers or members, it is indifferent as to the point of ordination.[v] [t] 1 Tim. 4:14. [v] 1 Tim. 4:14. It is very requisite, that no single congregation, that can conveniently associate, do assume to itself all and sole power in ordination:

1. Because there is no example in scripture that any single congregation, which might conveniently associate, did assume to itself all and sole power in ordination; neither is there any rule which may warrant such a practice.

2. Because there is in scripture example of an ordination in a presbytery over diverse congregations; as in the church of Jerusalem, where were many congregations: these many congregations were under one presbytery, and this presbytery did ordain. The preaching presbyters orderly associated, either in cities or neighboring villages, are those to whom the imposition of hands doth appertain, for those congregations within their bounds respectively.</p></blockquote>

<blockquote><p>You will reply: It is because they are ministers ordained by antichristian bishops; and therefore, before they have renounced their false ministry we cannot with a safe conscience hear them, nor expect a blessing from their ministry. This reply is, we confess, a great stumbling block to many godly people in this kingdom. For satisfaction to it we offer these particulars:

1. Many of you [congregationalists] that make this reply hold that the election of the people is by God’s Word sufficient to make a man a true minister without ordination. Now it is certain that many public [Anglican] ministers have been chosen by the free and full consent of their congregations; and most of them have had an after consent, which was sufficient to make Leah Jacob’s wife (Subsequens consensus Jacobi in Leam, fecit eos conjuges. [David] Pareus, etc.), and why not (to use your own words) to marry a man to a people; and therefore according to your own judgments all such are lawful ministers. For sinful superadditions do not nullify divine institutions.

2. Some of you that, besides election, require ordination for the making of a minister, yet say that this ordination must be by the people of the congregation; and thus are your ministers ordained. Now we find neither precept nor precedent for this in all the Scripture: We find ordination by the laying on of the hands of the presbytery (1 Tim. 4:14), but never of the laying on of the hands of the people. We find the apostles, Timothy and Titus ordaining (Acts 14:23; 1 Tim. 5:22; Tit. 1:5), but never the people ordaining; and for private persons to assume the power of ordination (that is, a power to send men to preach the Gospel and administer the sacraments) is a sin like unto the sin of Uzzah and of Korah and his company. Therefore we say to you as Christ does, Mt. 6, ‘First pluck the beam out of thine own eye, and then, etc.’ First justify the ordination of your own ministers by private persons and then you will see better to find fault with the ordination of our ministers.

3. We distinguish between a defective ministry and a false ministry, as we do between a man that is lame or blind and a man that is but the picture of a man. We do not deny but that the way of ministers entering into the ministry by the bishops had many defects in it, for which they ought to be humbled. But we add that, notwithstanding all the accidental corruptions, yet it is not substantially and essentially corrupted, as it is with baptism [not being substantially and essentially corrupted] in the Popish Church. All orthodox divines account it valid, though mingled with much dross, because the party baptized is baptized in the name of the Father, Son, and Holy Ghost. And therefore, when a Papist turns protestant, he is not baptized again, because the substance of baptism is preserved in Popery under many defects. The like and much more may be said for the ordination of our ministers by bishops: It is lawful and valid for the substance of it, though mingled with many circumstantial defects. And this appears:

1. Because when they were ordained, they were designed to no other office but to preach the Word and administer the sacraments according to the will of Christ.

2. Because since their ordination God has sealed the truth of their ministry (as has been said) by his blessing upon it. If they be antichristian ministers, how is your conversion Christian?

3. Because they were ordained by bishops, not as lord bishops or as a superior order by divine right above a presbyter, but as they were presbyters. For the understanding of which you must know:

1. That by Scripture a bishop and presbyter is all one, as appears by Acts 10:27-28; Tit. 1:5-8; Phil. 1:1; 1 Tim. 3:1-2, etc. 1 Pet. 5:1-2, and by what is said by the authors quoted in the margin. (Smectymnuus, The Answer of Mr. Marshal, Mr. Vines, Mr. Caryl, Mr. Seaman returned to the late King in the Treaty at the Isle of Wight)

2. That the lordly dignities of bishops were mere civil additaments annexed to their bishoprics by kingly favor.

3. That this opinion, that bishops are a superior order of ministry by divine right above a presbyter is a late upstart opinion contrary to antiquity, as appears by the authors quoted in the margin. (Ambrose in ch. 4 to the Ephesians and in 1 Tim. 3; Jerome in Tit. 1 and to Evagrius; Augustine, Epistle 19; Chrysostom in 1 Tim. 3)

4. That the laws of this realm do account nothing divine in a bishop but his being a presbyter; and therefore the parliament in their ordinance for ordination tells us that they did ordain [them] as presbyters, not as bishops, much less as lord bishops. As for their usurpation of the sole power of jurisdiction together with their lordly titles and dignities and dependances, we have renounced them in our Solemn League and Covenant [1643]. But we never did, nor never shall renounce them as presbyters, which by the consent of all sides are by divine right. 4. We shall add one thing more, that ministers do not receive their ministry from the people, or bishops, but immediately from Jesus Christ. For they are ministers and ambassadors of Christ, not of the people. Indeed they are ambassadors for the good of the people, but not ambassadors of the people. All that the people or bishop does is but to choose and ordain a man, but it is Christ that gives him his power and authority, as when a wife chooses a husband and a town a mayor: the town does not give the mayor, nor the wife the husband the power they have, but the laws of God the one, and of man the other. So it is here, it is Christ that gives the office and the call to the ministry; they are his servants and in his name execute their function. It is He that fits them with ability for their work; the people they consent, and the bishop as a presbyter with other presbyters ordain him; which though it had many corruptions mingled with it, when the bishop was in all his pomp and lordliness, yet for the substance of it, it was lawful and warrantable and therefore cannot without sin be renounced and abjured.</p></blockquote>

nding+of+which+you+must+know%3A+1.+That+by+Scripture+a+bishop+and+presbyter+is+all+one%2C+as+appears+by+Acts+10%3A27-28%3B+Tit.+1%3A5-8%3B+Phil.+1%3A1%3B+1+Tim.+3%3A1-2%2C+etc.+1+Pet.+5%3A1-2%2C+and+by+what+is+said+by+the+authors+quoted+in+the+margin.+%28Smectymnuus%2C+The+Answer+of+Mr.+Marshal%2C+Mr.+Vines%2C+Mr.+Caryl%2C+Mr.+Seaman+returned+to+the+late+King+in+the+Treaty+at+the+Isle+of+Wight%29+2.+That+the+lordly+dignities+of+bishops+were+mere+civil+additaments+annexed+to+their+bishoprics+by+kingly+favor.+3.+That+this+opinion%2C+that+bishops+are+a+superior+order+of+ministry+by+divine+right+above+a+presbyter+is+a+late+upstart+opinion+contrary+to+antiquity%2C+as+appears+by+the+authors+quoted+in+the+margin.+%28Ambrose+in+ch.+4+to+the+Ephesians+and+in+1+Tim.+3%3B+Jerome+in+Tit.+1+and+to+Evagrius%3B+Augustine%2C+Epistle+19%3B+Chrysostom+in+1+Tim.+3%29+4.+That+the+laws+of+this+realm+do+account+nothing+divine+in+a+bishop+but+his+being+a+presbyter%3B+and+therefore+the+parliament+in+their+ordinance+for+ordination+tells+us+that+they+did+ordain+%5Bthem%5D+as+presbyters%2C+not+as+bishops%2C+much+less+as+lord+bishops.+As+for+their+usurpation+of+the+sole+power+of+jurisdiction+together+with+their+lordly+titles+and+dignities+and+dependances%2C+we+have+renounced+them+in+our+Solemn+League+and+Covenant+%5B1643%5D.+But+we+never+did%2C+nor+never+shall+renounce+them+as+presbyters%2C+which+by+the+consent+of+all+sides+are+by+divine+right.+4.+We+shall+add+one+thing+more%2C+that+ministers+do+not+receive+their+ministry+from+the+people%2C+or+bishops%2C+but+immediately+from+Jesus+Christ.+For+they+are+ministers+and+ambassadors+of+Christ%2C+not+of+the+people.+Indeed+they+are+ambassadors+for+the+good+of+the+people%2C+but+not+ambassadors+of+the+people.+All+that+the+people+or+bishop+does+is+but+to+choose+and+ordain+a+man%2C+but+it+is+Christ+that+gives+him+his+power+and+authority%2C+as+when+a+wife+chooses+a+husband+and+a+town+a+mayor%3A+the+town+does+not+give+the+mayor%2C+nor+the+wife+the+husband+the+power+they+have%2C+but+the+laws+of+God+the+one%2C+and+of+man+the+other.+So+it+is+here%2C+it+is+Christ+that+gives+the+office+and+the+call+to+the+ministry%3B+they+are+his+servants+and+in+his+name+execute+their+function.+It+is+He+that+fits+them+with+ability+for+their+work%3B+the+people+they+consent%2C+and+the+bishop+as+a+presbyter+with+other+presbyters+ordain+him%3B+which+though+it+had+many+corruptions+mingled+with+it%2C+when+the+bishop+was+in+all+his+pomp+and+lordliness%2C+yet+for+the+substance+of+it%2C+it+was+lawful+and+warrantable+and+therefore+cannot+without+sin+be+renounced+and+abjured.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+London%2C+%28Presbyterian%29+Provincial+Assembly+%7C+A+Vindication+of+the+Presbyterial-Government+%26+the+Ministry%E2%80%A6+%28London%2C+1650%29%2C+pt.+2%2C+pp.+123-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab143f1f23.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/ab143f1f23.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ordination/#:~:text=You%20will%20reply%3A%20It%20is%20because,without%20sin%20be%20renounced%20and%20abjured&amp;text=You%20will%20reply%3A%20It%20is%20because%20they%20are&amp;text=therefore%20cannot%20without%20sin%20be%20renounced%20and%20abjured" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Answer:

1. Some parcels of these epistles are written to Timothy and Titus as evangelists, such as none may now do but they only (2 Tim. 4:4; Tit. 1:3; 2 Tim. 1:5) and some other things which they gave in charge to elders.

2. Some things are written to them as Christians, as 1 Tim. 1:19; Tit. 3:3 and finaliter, or objectively, all is written for the Church’s good; but 3. the bulk of the epistle is written to them as elders, and is a rule of perpetual government, and especially, 1 Tim. 5:22; 2 Tim. 2:2, for these and the like they were to do with the presbytery, as is clear, 1 Tim. 4:14.</p></blockquote>

<blockquote><p>3. When God commands such offices to be in his house, which depend immediately upon his own immediate will of giving gifts essentially required to these offices, then these offices are so long in his Church as God is pleased by his immediate will to give these gifts; and when God denies these gifts essentially requisite, sure it is, his immediate will has altered and removed the office, not the will of the Church, so the Lord has altered and removed these offices and gifts of apostles, who could speak with tongues and seal their doctrine with miracles, evangelists, prophets extraordinarily inspired, gifts of healing, etc.</p></blockquote>

</figure><figure class="quote" id="q-1598a035d7" data-kw="">
<blockquote><p>The officers which Christ gave to his church were of two sorts—extraordinary ones advanced to a higher office in the church: such were apostles, prophets, and evangelists. The apostles were chief. These Christ immediately called, furnished them with extraordinary gifts and the power of working miracles, and with infallibility in delivering his truth; and, they having been the witnesses of his miracles and doctrine, he sent them forth to spread the gospel and to plant and govern churches. The prophets seem to have been such as expounded the writings of the Old Testament, and foretold things to come. The evangelists were ordained persons (2 Tim. 1:6 ), whom the apostles took for their companions in travel (Gal. 2:1 ), and sent them out to settle and establish such churches as the apostles themselves had planted (Acts. 19:22 ), and, not being fixed to any particular place, they were to continue till recalled, 2 Tim. 4:9. And then there are ordinary ministers, employed in a lower and narrower sphere; as pastors and teachers…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 4:11</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-2455814659" data-kw="">
<blockquote><p>The apostles have preached the Gospel to us from the Lord Jesus Christ; Jesus Christ [has done so] from God. Christ therefore was sent forth by God, and the apostles by Christ. Both these appointments, then, were made in an orderly way, according to the will of God. Having therefore received their orders, and being fully assured by the resurrection of our Lord Jesus Christ, and established in the Word of God, with full assurance of the Holy Ghost, they went forth proclaiming that the kingdom of God was at hand. And thus preaching through countries and cities, they appointed the firstfruits [of their labours], having first proved them by the Spirit, to be bishops and deacons of those who should afterwards believe. Nor was this any new thing, since indeed many ages before it was written concerning bishops and deacons. For thus saith the Scripture in a certain place, ‘I will appoint their bishops in righteousness, and their deacons in faith.’ [Isa. 60:17 LXX]</p></blockquote>

<blockquote><p>I believe the importance of this subject for the PCA is now matched by its urgency. If I may speak personally, one of the most alarming trends that I’ve seen among candidates for the ministry and among teaching and ruling elders in our denomination, is the growing opinion that the Standards are merely constitutional documents, on a par with the Book of Church Order (BCO) or Robert’s Rules of Order. It is an opinion that I suspect is held in equal numbers by those who take very few or no exceptions as much as by those who take several. To them, the Standards are necessary administrative instruments of good governance, and little more: “Certainly, we need to read them and know them and subscribe to them, but only in so far as doing so allows us to hold office in the denomination.” The idea that vibrant, useful, life-giving, God-exalting theology, piety, and practice can and should be mined from our Standards in any ongoing way, for the sake of the health of our own souls and the fruitfulness of our ministries, is quite foreign to their minds. The tragic result is that the proclamation heard from our pulpits, the Christian formation provided in our Sunday School classes, and the piety practiced in our churches is less and less fluent in the historic syntax and grammar of the Reformed faith. Too often, in our ministries, after having declared our adherence to them before our presbyteries (or, if we are ruling elders or deacons, before our Sessions), we simply assume theology of the Westminster Standards ever afterwards. Perhaps, in some cases, it might be more accurate to say that, after subscribing to them, we largely ignore and leave behind theology of the Standards, in favor of novel ways of framing the truth which appear in our own eyes to be far more exciting and helpful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/david-strain.html">David Strain</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Good Faith Subscription? Confessional Integrity in the PCA</cite>, Gospel Reformation Network, June 27, 2021</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>Christ was a lawful preacher. As he had his unction from his Father, so his mission. ‘The Father that sent me bears witness of me’ (John 8:18). Christ, in whom were all perfections concentred, yet would be solemnly sealed and inaugurated into his ministerial as well as mediatory office. If Jesus Christ would not enter upon the work of the ministry without a commission, how absurdly impudent are they who without any warrant dare invade this holy function! There must be a lawful admission of men into the ministry. ‘No man taketh this honour to himself, but he that is called of God, as was Aaron’ (Hebrews 5:4). Our Lord Christ, as he gave apostles and prophets who were extraordinary ministers, so pastors and teachers who were initiated and made in an ordinary way (Ephesians 4:11); and he will have a ministry perpetuated; ‘Lo I am with you alway, even unto the end of the world’ (Matthew 28:20). Sure, there is as much need of ordination now as in Christ’s time and in the time of the apostles, there being then extraordinary gifts in the church which are now ceased.

But why should not the ministry lie in common? ‘Hath the Lord spoken only by Moses?’ (Numbers 12:2). Why should not one preach as well as another? I answer — Because God (who is the God of order) has made the work of the ministry a select, distinct office from any other. As in the body natural the members have a distinct office, the eye is to see, the hand to work; you may as well say, why should not the hand see as well as the eye? Because God has made the distinction. He has put the seeing faculty into the one and not the other. So here, God has made a distinction between the work of the ministry and other work.

Where is this distinction? We find in Scripture a distinction between pastor and people. ‘The elders (or ministers) I exhort … Feed the flock of God which is among you’ (1 Peter 5:2). If anyone may preach, by the same rule all may, and then what will become of the apostle’s distinction? Where will the flock of God be if all be pastors?

God has cut out the minister his work which is proper for him and does not belong to any other. ‘Give attendance to reading, to exhortation, to doctrine . . . give thyself wholly to them’, or, as it is in the Greek, ‘Be thou wholly in them’ (1 Timothy 4, 13-15). This charge is peculiar to the minister and does not concern any other. It is not spoken to the tradesman that he should give himself wholly to doctrine and exhortation. No, let him look to his shop. It is not spoken to the ploughman that he should give himself wholly to preaching. No, let him give himself to his plough. It is the minister’s charge. The apostle speaks to Timothy and, in him, to the rest who had the hands of the presbytery laid on them. And ‘Study to shew thyself approved . . ., a workman that needeth not to be ashamed, rightly dividing the word of truth’ (2 Timothy 2:15). This is spoken peculiarly to the minister. Everyone that can read the word aright cannot divide the word aright. So that the work of the ministry does not lie in common; it is a select, peculiar work. As none might touch the ark but the priests, none may touch this temple-office but such as are called to it.

But if a man has gifts, is not this sufficient? I answer, No! As grace is not sufficient to make a minister, so neither are gifts. The Scripture puts a difference between gifting and sending. ‘How shall they preach unless they be sent?’ (Romans 10:15). If gifts were enough to constitute a minister, the apostle should have said, ‘How shall they preach unless they be gifted?, but he says ‘unless they be sent?’ As in other callings, gifts do not make a magistrate. The attorney that pleads at the bar may have as good gifts as the judge that sits upon the bench, but he must have a commission before he sit as judge. If it be thus in matters civil, much more in ecclesiastical and sacred, which are, as [Martin] Bucer says, ‘things of the highest importance’. Those therefore that usurp the ministerial work without any special designation and appointment discover more pride than zeal. They act out of their sphere and are guilty of theft. They steal upon a people, and, as they come without a call, so they stay without a blessing. ‘I sent them not, therefore they shall not profit this people at all’ (Jeremiah 23:32). And so much for the first, the preacher.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes: An Exposition of Matthew 5:1-12</cite>, (1660; Edinburgh: Banner of Truth, 1971), pp 14-16.</span></figcaption>

istinction+between+the+work+of+the+ministry+and+other+work.%0A%0AWhere+is+this+distinction%3F+We+find+in+Scripture+a+distinction+between+pastor+and+people.+%E2%80%98The+elders+%28or+ministers%29+I+exhort+%E2%80%A6+Feed+the+flock+of+God+which+is+among+you%E2%80%99+%281+Peter+5%3A2%29.+If+anyone+may+preach%2C+by+the+same+rule+all+may%2C+and+then+what+will+become+of+the+apostle%E2%80%99s+distinction%3F+Where+will+the+flock+of+God+be+if+all+be+pastors%3F%0A%0AGod+has+cut+out+the+minister+his+work+which+is+proper+for+him+and+does+not+belong+to+any+other.+%E2%80%98Give+attendance+to+reading%2C+to+exhortation%2C+to+doctrine+.+.+.+give+thyself+wholly+to+them%E2%80%99%2C+or%2C+as+it+is+in+the+Greek%2C+%E2%80%98Be+thou+wholly+in+them%E2%80%99+%281+Timothy+4%2C+13-15%29.+This+charge+is+peculiar+to+the+minister+and+does+not+concern+any+other.+It+is+not+spoken+to+the+tradesman+that+he+should+give+himself+wholly+to+doctrine+and+exhortation.+No%2C+let+him+look+to+his+shop.+It+is+not+spoken+to+the+ploughman+that+he+should+give+himself+wholly+to+preaching.+No%2C+let+him+give+himself+to+his+plough.+It+is+the+minister%E2%80%99s+charge.+The+apostle+speaks+to+Timothy+and%2C+in+him%2C+to+the+rest+who+had+the+hands+of+the+presbytery+laid+on+them.+And+%E2%80%98Study+to+shew+thyself+approved+.+.+.%2C+a+workman+that+needeth+not+to+be+ashamed%2C+rightly+dividing+the+word+of+truth%E2%80%99+%282+Timothy+2%3A15%29.+This+is+spoken+peculiarly+to+the+minister.+Everyone+that+can+read+the+word+aright+cannot+divide+the+word+aright.+So+that+the+work+of+the+ministry+does+not+lie+in+common%3B+it+is+a+select%2C+peculiar+work.+As+none+might+touch+the+ark+but+the+priests%2C+none+may+touch+this+temple-office+but+such+as+are+called+to+it.%0A%0ABut+if+a+man+has+gifts%2C+is+not+this+sufficient%3F+I+answer%2C+No%21+As+grace+is+not+sufficient+to+make+a+minister%2C+so+neither+are+gifts.+The+Scripture+puts+a+difference+between+gifting+and+sending.+%E2%80%98How+shall+they+preach+unless+they+be+sent%3F%E2%80%99+%28Ro </figure><figure class="quote" id="q-a9353d197e" data-kw="">
<blockquote><p>This is the sum of their answer, It is lawful for them, nay, they ought to prefer God before men. God commandeth us to bear witness of Christ; therefore it is in vain for you to command us to keep silence. But I have declared before in the third chapter, when this sentence taketh place, that we ought rather to obey God than men. God doth set men over us in such sort with power, that he keepeth still his own authority safe and sound. Therefore, we must obey rulers so far, that the commandment of God be not broken.

Whereas power and authority is lawfully used, then it is out of season to make comparison between God and man. If a faithful pastor do command or forbid out of the Word of God, it shall be in vain for men which are stubborn to object that we ought to obey God; for God will be heard by man. Yea, man is nothing else but an instrument of God. If a magistrate do his duty as he ought, a man shall in vain say that he is contrary to God, seeing that he dissenteth in nothing; yea, rather the contrary rule is then in force. We must obey God’s ministers and officers if we will obey him.

But so soon as rulers do lead us away from the obedience of God, because they strive against God with sacrilegious boldness, their pride must be abated, that God may be above all in authority. Then all smokes of honour vanish away. For God doth not vouchsafe to bestow honourable titles upon men, to the end they may darken his glory. Therefore, if a father, being not content with his own estate, do essay to take from God the chief honour of a father, he is nothing else but a man. If a king, or ruler, or magistrate, do become so lofty that he diminisheth the honour and authority of God, he is but a man.

We must thus think also of pastors. For he which goeth beyond his bounds in his office, (because he setteth himself against God:) must be despoiled of his honour, lest, under a colour or visor, he deceive. The office of a pastor is very excellent, the authority of the Church is great, yet so that no part of God’s power and Christ’s mastership be diminished. Whence we may easily gather that the pride of the Pope is ridiculous, who, when as he treadeth under foot the whole kingdom of Christ, and doth set himself openly against God, will yet, nevertheless, lie hid under the name of Christ.</p></blockquote>

</figure><figure class="quote" id="q-c9248aa928" data-kw="">
<blockquote><p>Q. What is his Prophetical office?

A. It is the first part of his mediation, whereby he is our Prophet, Doctor, or Apostle.

Q. How is he our Prophet, Doctor, or Apostle?

A. In that he hath opened the whole will of his Father, concerning all things necessary to salvation.

Q. How doth that appear?

A. By his own testimony, Joh. 15. 15. I call you no more servants, because the servant knoweth not what his master doth. But I call you friends, because all which I have heard of my Father, I have made known unto you.

Q. What learn you from thence?

A. What a foul error it is in then, that think that our Saviour Christ delivered not all things, pertaining to the instruction and government of his Church, but left them moreover to the traditions and inventions of men.

Q. What further?

A. That the Ministers of the Word should not utterly suppress in silence, any truth that Christ hath revealed. And that the people should content themselves with that which Christ hath taught, rejecting whatsoever else, the boldness of men shall obtrude upon them.

Q. Did his office of Doctor-ship then first begin, when he came into the world?

A. No: for he (at the first) opened his Fathers will unto us, by the ministry of his servants the Prophets: and after he came into the world, he opened the same doctrine more plainly and fully by the Apostles and Evangelists.</p></blockquote>

<blockquote><p>Object. 15. The Arguments for a Classical, or Presbyterial Church do much side with Prelacy; for you make many Lords ruling and not teaching.

Answ. Let all judge whether the independent power of three Elders accountable to none, in a Church-way, but to Jesus Christ only, as you make your little Kingdoms on Earth, be nearer to the Pope’s Monarchy, and especially when there is but one Pastor in the Congregation, then the subordinate Government of fourscore, or an hundred Elders, sure I am, three Neighbours are nearer to one Monarch, then three hundred. 2. One Monarchical Society is as tyrannical Antichristianism as one Monarchical Pastor. 3. If we made many ruling and domineering Lords, you should say something; but we make many servants endued only with Ministerial power, only to teach and rule, and to be accomptable to the Church; your Eldership in this agreeth with the Pope, that though they deliver many Souls to Satan, yet no Man on Earth can, in a Church-way, say, What do you?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Object. 15. The Arguments for a Classical, or Presbyterial Church do much side with Prelacy; for you make many Lords ruling and not teaching.

Answ. Let all judge whether the independent power of three Elders accountable to none, in a Church-way, but to Jesus Christ only, as you make your little Kingdoms on Earth, be nearer to the Pope’s Monarchy, and especially when there is but one Pastor in the Congregation, then the subordinate Government of fourscore, or an hundred Elders, sure I am, three Neighbours are nearer to one Monarch, then three hundred. 2. One Monarchical Society is as tyrannical Antichristianism as one Monarchical Pastor. 3. If we made many ruling and domineering Lords, you should say something; but we make many servants endued only with Ministerial power, only to teach and rule, and to be accomptable to the Church; your Eldership in this agreeth with the Pope, that though they deliver many Souls to Satan, yet no Man on Earth can, in a Church-way, say, What do you?”

</figure><figure class="quote" id="q-9b75e248df" data-kw="">
<blockquote><p>Also though it be true, that one and the same man may both teach and exhort, and the comparison of the natural body doth not in all things hold, for one member cannot both be the eye to see, and the ear to hear, but both are here a sort of eye to the Church; yet hath Christ made the Pastor and the Doctor different. (It is needless to dispute, if they differ in nature, and if it be a confounding of Christ’s order, that one be both, when Christ hath given gifts for both to one man) for first, the Word of God doth difference them; secondly, we know that many have gifts to teach, who are but dull and weak to persuade and work upon the affection, as is observed amongst the Fathers. Augustine excelled in teaching and disputing, Chrysostom in exhorting. [Alfonso] Salmeron observeth, that there Thomas Aquinas was eminent in informing the understanding, and Bonaventura excellent for moving the affections. And many are fitted to work on the affections, as Pastors, who are not able to teach as Doctors in the Schools. So hath Chrysostom and Theodoret observed upon these words, Rom. 12. 7, 8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland</cite>, (London: Richard Whittaker and Andrew Crook, 1644), p. 158.</span></figcaption>

</figure><figure class="quote" id="q-ff9eea89cf" data-kw="">
<blockquote><p>See hence that they run a very dangerous risk who do injury to his subjects, or strip them of any of the rights, privileges, or immunities he has granted them, and purchased for them with the price of his blood. Among other privileges which Zion’s King hath allowed his subjects, this is none of the least, that they should have the choice of their pastors; for which cause he hath required them to try the spirits and gifts, ministers are endowed with, whether they be calculated for the edification of their souls, 1 John iv. 1.

It is a command not given unto heritors and elders only, but even to little children, young men and fathers; “Beloved (says he), believe not every spirit, but try the spirits,” viz., of ministers and preachers, “whether they are of God:” and the reason he gives is remarkable in the close of the verse, ” Because many false prophets are gone abroad into the world.”

And in a suitableness to this trying of the spirits of the prophets, we find, Acts vi. that it was “the multitude of disciples,” that by express order are commanded to choose out from among them “men full of the Holy Ghost and wisdom.” The apostles, the extraordinary officers in the church, and who, one would think, were the most competent judges of men full of the Holy Ghost and wisdom; yet they would not take that power upon them, which is now lodged in heritors and elders.

I fear, the partiality shown in our public acts, in preferring the great, the noble, the rich man with the gay clothing, before the poor of this world, whom generally God hath chosen, rich in faith, and heirs of the kingdom, lay a foundation for a controversy between God and this nation, which will not soon be at an end. Christ’s little ones are but little regarded now-a-days; but they who maltreat them, to gratify the greatest upon earth, will smart for it in the issue.

It is an awful word uttered by him upon whose shoulders the government is laid. Matt, xviii. 6, 7, “But whoso shall offend one of these little ones which believe in me, it were better for him that a mill-stone were hanged about his neck, and that he were drowned in the depth of the sea.” “Wo unto the world because of offences: for it must needs be that offences come: but wo to that man by whom the offence cometh.” …

These professed Presbyterians, who, under that disguise exercise a lordly prelacy and dominion over the church of Christ, in thrusting in men upon congregations without, and contrary to, the free choice their King has allowed them. I fear there shall be a sad reckoning ere all be done, for the violent rapes which are committed upon the spouse of Christ up and down the land. Christ mystical is wounded in the house of his professed friends: and it will be a wonder if there be not wounds for wounds, before the scene be ended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government upon Christ s Shoulder. A Sermon Preached on Sabbath Evening after the Sacrament at Stirling, June 4, 1732’ in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

ter</a></div>
</figure><figure class="quote" id="q-b1459964db" data-kw="">
<blockquote><p>When casuists, as God requires, call attention to small evils and bind consciences to the avoiding of them (following Mt. 5:19), they do not overlook the big ones, but fight against them the more strongly. That this ought to be done, and the other not left undone, is the Saviour’s teaching (Mt. 23:13). But if by minor details is understood the adiaphora or actions that are lawful, we would agree that practical theology has committed a great sin in pressing such a matter, whenever it has done so.

(3) It is a calumny to say that minutiae [“minor matters”] have been made into major cases of conscience by Reformed theologians (who are called Calvinists, Puritans, etc.). They arouse greater or lesser scruples, analogically according to the degree of the sin. Thus, for instance, they raise more serious scruples about fornication and adultery than about dancing and the stage; about murder and duels than about mere words or fist fights. But they do arouse scruples about both.</p></blockquote>

<blockquote><p>(1.) An authoritative imposition of the office of Mediator, which Christ closed withal by his voluntary susception of it, willingly undergoing the office, wherein by dispensation the Father had and exercised a kind of superiority, which the Son, though “in the form of God,” humbled himself unto, Phil. ii. 6–8. And of this there may conceived two parts:—

[1.] The purposed imposition of his counsel, or his eternal counsel for the setting apart of his Son incarnate to this office, saying unto him, “Thou art my Son; this day have I begotten thee. Ask of me, and I shall give thee the nations for thine inheritance, and the uttermost parts of the earth for thy possession,” Ps. ii. 7, 8. He said unto him, “Sit thou at my right hand until I make thine enemies thy footstool;” for “the Lord swore, and will not repent, Thou art a priest for ever after the order of Melchizedek,” Ps. cx. 1, 4. He appointed him to be “heir of all things,” Heb. i. 2, having “ordained him to be Judge of quick and dead,” Acts x. 42; for unto this he was “ordained before the foundation of the world,” 1 Pet. i. 20, and “determined, ὁρισθείς, to be the Son of God with power,” Rom. i. 4, “that he might be the first-born among many brethren,” chap. viii. 29.

I know that this is an act eternally established in the mind and will of God, and so not to be ranged in order with the others, which are all temporary, and had their beginning in the fulness of time, of all which this first is the spring and fountain, according to that of James, Acts xv. 18, “Known unto God are all his works from the beginning of the world;” but yet, it being no unusual form of speaking that the purpose should also be comprehended in that which holds out the accomplishment of it, aiming at truth and not exactness, we pass it thus.

[2.] The actual inauguration or solemn admission of Christ into his office; “committing all judgment unto the Son,” John v. 22; “making him to be both Lord and Christ,” Acts ii. 36; “appointing him over his whole house,” Heb. iii. 1–6; — which is that “anointing of the most Holy,” Dan. ix. 24; God “anointing him with the oil of gladness above his fellows,” Ps. xlv. 7: for the actual setting apart of Christ to his office is said to be by unction, because all those holy things which were types of him, as the ark, the altar, etc., were set apart and consecrated by anointing, Exod. xxx. 25–28, etc.

To this also belongs that public testification by innumerable angels from heaven of his nativity, declared by one of them to the shepherds. “Behold,” saith he, “I bring you good tidings of great joy, which shall be unto all people; for unto you is born this day in the city of David a Saviour, which is Christ the Lord,” Luke ii. 10, 11; — which message was attended by and closed with that triumphant exultation of the host of heaven, “Glory be to God on high, on earth peace, towards men good-will,” verse 14: with that redoubled voice which afterward came from the excellent glory, “This is my beloved Son, in whom I am well-pleased,” Matt. iii. 17, xvii. 5; 2 Pet. i. 17.

If these things ought to be distinguished and placed in their own order, they may be considered in these three several acts:— First, The glorious proclamation which he made of his nativity, when he “prepared him a body,” Heb. x. 5, bringing his First-begotten into the world, and saying, “Let all the angels of God worship him” chap. i. 6, sending them to proclaim the message which we before recounted. Secondly, Sending the Spirit visibly, in the form of a dove, to light upon him at the time of his baptism, Matt. iii. 16, when he was endued with a fulness thereof, for the accomplishment of the work and discharge of the office whereunto he was designed, attended with that voice whereby he owned him from heaven as his only-beloved.

Thirdly, The “crowning of him with glory and honour,” in his resurrection, ascension, and sitting down “on the right hand of the Majesty on high,” Heb. i. 3; setting “him as his king upon his holy hill of Zion,” Ps. ii. 6; when “all power was given unto him in heaven and in earth,” Matt. xxviii. 18, “all things being put under his feet” Heb. ii. 7, 8; himself highly exalted, and “a name given him above every name, that at,” etc., Phil. ii. 9–11. Of which it pleased him to appoint witnesses of all sorts; — angels from heaven, Luke xxiv. 4, Acts i. 10; the dead out of the graves, Matt. xxvii. 52; the apostles among and unto the living, Acts ii. 32; with those more than five hundred brethren, to whom he appeared at once, 1 Cor. xv. 6. Thus gloriously was he inaugurated into his office, in the several sets and degrees thereof, God saying unto him, “It is a light thing that thou shouldest be my servant to raise up the tribes of Jacob, and to restore the preserved of Israel: I will also give thee for a light to the Gentiles that thou mayest be my salvation unto the end of the earth,” Isa. xlix. 6.

Between these two acts I confess there intercedes a twofold promise of God; — one, of giving a Saviour to his people, a Mediator, according to his former purpose, as Gen. iii. 15, “The seed of the woman shall break the serpent’s head;” and, “The sceptre shall not depart from Judah, nor a lawgiver from between his feet, till Shiloh come; and unto him shall the gathering of the people be,” chap. xlix. 10. Which he also foresignified by many sacrifices and other types, with prophetical predictions: “Of which salvation the prophets have inquired and searched diligently, who prophesied of the grace that should come unto you; searching what or what manner of time the Spirit of Christ which was in them did signify, when it testified beforehand the sufferings of Christ, and the glory that should follow. Unto whom it was revealed, that not unto themselves, but unto us they did minister the things which are now reported unto you by them that have preached the gospel unto you with the Holy Ghost sent down from heaven; which things the angels desire to look into,” 1 Pet. i. 10–12.

The other is a promise of applying the benefits purchased by this Saviour so designed to them that should believe on him, to be given in fulness of time, according to the former promises; telling Abraham, that “in his seed all the families of the earth should be blessed,” and justifying himself by the same faith, Gen. xii. 3, xv. 6. But these things belong rather to the application wholly, which was equal both before and after his actual mission.</p></blockquote>

<blockquote><p>1. That Christ Jesus hath appointed Pastors and Teachers to be officers in his Church, is evident from Joh. 10. 1, 2. the Sheep-fold—the Shepherd of the sheep. Ephes. 4. 11. He gave—some Pastors and Teachers.

2. That to these officers, the whole work and effect of the ordinary Administration is committed, is also evident from Ephes. 4, 11, till 17. where next unto the extraordinary officers of the church, who are Apostles, Prophets and Evangelists; the ordinary, who are Pastors and Teachers, are ranked: unto whom, together with the others, all is ascribed, that is to be done concerning the Church. Therefore the extraordinary officers ceasing, all is committed unto the ordinary administration, which resteth upon these, 1 Pet. 5. 1, 2, 3, 4. Feed the flock, ποιμάνατε shepherdize the flock.

3. That these officers are distinct from Ruling Elders; and that Ruling Elders are subordinate unto their employment, is clear from 1 Tim. 5. 17. The Elders that Rule well—especially they that labour in the word and doctrine. That they are also distinct from Deacons, and that these are subordinate unto them in like manner, is clear from Act. 6. 2, 3, 4. It is not reason we should leave the Word, and serve tables—Look out men—whom we may appoint over this business; but we will give our selves to Prayer and to the ministry of the Word.

4. That in the work of the Ministry, the duties of the Pastor and Teacher are to be jointly performed, doth appear by this; that the Pastors according to Gods heart, do feed the people with knowledge and understanding, Jer. 3. 15. Then also reproofs, rebukes, and exhortations, which are the proper work of the Pastor, must be performed; with all long suffering and doctrine: which is the proper work of the Teacher, 2 Tim. 4. 2.

5. That the special gifts and proper works of both these, are nevertheless distinct; is also apparent from Rom. 12. 6, 7, 8. Having gifts differing—He that teacheth, on teaching; He that exhorteth, on exhortation. And 1 Cor. 12. 8. To one is given—the word of wisdom, which is the Pastoral; to another the word of knowledge, which is the Doctoral gift.

6. So then the Pastoral office doth eminently contain the use of all other offices: for all that is to be done by the Teacher, or by the Ruling Elder, or the Deacon, is to be subservient unto this care; and in case these officers be wanting, the Pastor is to do all by himself, even as the Apostles did the work of the Deacons before those officers were chosen, Act. 4. 34, 35. They laid down the prices at the Apostles feet, and distribution was made. And when all these do their duties, he ought carefully to concur with them therein, Rom. 12. 5. We being many are one body; and every one members one of another. 1 Cor. 12. 20. They are many members, yet but one body. vers. 25. The members should have the same care one of another.

7. The end and use of the Pastoral office, is the same with the end and use of the Apostolical, Prophetical, and Evangelical office. Which is, to perfect the Saints; to do the work of the ministry; and to build up the body of Christ, Ephes. 4. 12.</p></blockquote>

<blockquote><p>Paul is right to subordinate Jesus Christ the Son to God the Father because he is the intermediary through whom the righteousness and peace of God the Father reaches our consciences—he is the one who confers the righteousness and peace that God the Father has ordained for us. This verse tells us something about God the Father and God the Son. God the Father is the ultimate source of our righteousness, peace and salvation. Christ Jesus the Son is the intermediary through whom we receive that righteousness, peace and salvation—in other words, he is the one who delivers them to us.

The point here is that God the Father does not justify anybody apart from Christ, nor does he give anyone peace of mind apart from him. Likewise, it is plain from this what the gospel is and especially what it teaches, which is that the grace and peace of God the Father is manifested to us in our Lord Jesus Christ. To put it another way, the gospel teaches that our Lord Jesus Christ gave himself up for our sins in order to rescue us from this present world, according to the will of God our Father.</p></blockquote>

<blockquote><p>Here may we see what a deadly evil power void of the fear of God is. For when that religion and reverence which ought doth not reign, the more holy the place is which a man doth possess, the more boldly doth he rage.

For which cause we [should] always take good heed that the wicked be not preferred unto the government of the Church. And those which are called to this function must behave themselves reverently and modestly, lest they seem to be armed to do hurt.

But and if it so happen they abuse their honour, the Spirit declareth there, as in a glass, what small account we ought to make of their decrees and commandments. The authority of the pastors hath certain bounds appointed which they may not pass. And if they dare be so bold, we may lawfully refuse to obey them; for if we should, it were in us great wickedness, as it followeth now.</p></blockquote>

</figure><figure class="quote" id="q-0f22e73c1b" data-kw="">
<blockquote><p>Christ was said to be God’s servant, partly as he subjected himself to the condition of man, and because he lived among men in a needy, servile, and abject state of life, not like a prince, but a servant, which is the lowest form of rational creatures. And it is expressed by ‘taking the form of a servant’ upon him, Phil. 2:7. Angels are called sons, and man a servant; ‘The sons of God shouted for joy,’ Job 38:7. In the family of heaven they were to God as servants.

And partly as he was a choice instrument for the executing of God’s decrees. Those that are taken into any degree of subserviency to God’s counsels have this badge of honour put upon them, to be God’s servants, as Nebuchadnezzar is called God’s servant, Jer. 27:6. Now, because Christ submitted himself to the office of the mediatorship, and so to a subserviency to God’s decrees, he is called a servant: Isa. 13:1, ‘Behold my servant, whom I uphold;’ Isa. 49:3, ‘Thou art my servant.’

And this being an instrument of God’s decrees, is called service, because whosoever is employed in it is to sequester himself for the uses of God, and to divest himself of all self-respect, and like a servant to be at the command of another, and wholly to give up himself to the profit and benefit of his Master. So Christ, not aiming at himself, accomplished the work of God to God’s glory and the salvation of man. And—

Partly as he subjected himself to the law of God and the covenant of works, which was a covenant of servants. A servant expects his hire as the reward of his work, and therefore the state of the gospel is called a state of sonship: Gal. 4:5, ‘To redeem them that were under the law, that they might receive the adoption of sons.’ So in the 1st verse of that chapter, ‘The heir, as long as he is a child, differeth nothing from a servant;’ that is, those that are under the covenant of grace did very little differ from those that are under the covenant of works, in the time of the church’s infancy and ceremonial dispensation, because it was a ministry of condemnation.

Everywhere the covenant of works is made as the covenant of an hireling, and implieth bondage and service. And therefore Christ, because he submitted himself to such a covenant, and seeing he was to be judged of God according to all extremity and rigour, things were carried between God and Christ in a way of justice, and our grace and glory were due to him. So that in all these respects Christ was God’s servant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 442-43.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-20014c7035" data-kw="">
<blockquote><p>But you [a congregationalist] will say, in a church in an island, one may be a pastor without any ordination if the people elect him and there be no elders to ordain. I answer: it is true: but so many pastors send a pastor to be a pastor to a congregation, though that congregation never choose him, as possibly they be for the most part Popish or unwilling; yet both cases are extraordinary and the Church [is in the case of] not [being] constituted and established.</p></blockquote>

<blockquote><p>4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church…</p></blockquote>

</figure><figure class="quote" id="q-eb61100438" data-kw="">
<blockquote><p>2. A calling is extraordinary, either in habit or in exercise; in habit, as to be an apostle and have the gift of miracles: Thus our reformers calling was not extraordinary, they were not immediately called by God from Heaven; for they would not have concealed such a calling, if they had had any such: Or a calling is extraordinary in the exercise, and that two ways; either in the principle moving them to teach, or, 2. in the manner of teaching and efficacy; a calling extraordinary in the principle moving is twofold: Either a mere prophetical impulsion of revelation stirring them up to such an act, as the Spirit of the Lord came upon Saul and he prophesied; this our reformers had not because we never find that they allege it. 2. A more than ordinary motion with illumination by God’s Spirit speaking in the Scriptures, in which motions they were not subordinate in the exercise of their ministry to the Church of pastors, but immediately in that subordinated to God; and in this I prove that our reformers were extraordinary doctors.

1. Because Eze. 34, in a universal apostasy of the prophets and shepherds, the Lord extraordinarily works, v. 11, ‘For thus saith the Lord God, behold I, even I will both search my sheep, and seek them out.’ Now this is by pastors, when the ordinary pastors are all failed. So Rev. 11, in that universal apostasy under Antichrist, when the gentiles tread upon the outer court of the Temple and the holy City, God stirs up two witnesses to prophesy in sackcloth; that is, some few pastors (for two is the smallest number) and they prophesy and are slain, and yet they rise again. We need not apply this to men in particular, as to John Huss and Jerome of Prague; but certainly, some few spake against Babylon and they were borne down and oppressed and killed, and men of that same spirit rose and spake that same truth as if the very two men who were slain had risen within three days again.

2. Because when the Church is overgone with heresy and Apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; and suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 126-7</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. A calling is extraordinary, either in habit or in exercise; in habit, as to be an apostle and have the gift of miracles: Thus our reformers calling was not extraordinary, they were not immediately called by God from Heaven; for they would not have concealed such a calling, if they had had any such: Or a calling is extraordinary in the exercise, and that two ways; either in the principle moving them to teach, or, 2. in the manner of teaching and efficacy; a calling extraordinary in the principle moving is twofold: Either a mere prophetical impulsion of revelation stirring them up to such an act, as the Spirit of the Lord came upon Saul and he prophesied; this our reformers had not because we never find that they allege it. 2. A more than ordinary motion with illumination by God’s Spirit speaking in the Scriptures, in which motions they were not subordinate in the exercise of their ministry to the Church of pastors, but immediately in that subordinated to God; and in this I prove that our reformers were extraordinary doctors.

1. Because Eze. 34, in a universal apostasy of the prophets and shepherds, the Lord extraordinarily works, v. 11, ‘For thus saith the Lord God, behold I, even I will both search my sheep, and seek them out.’ Now this is by pastors, when the ordinary pastors are all failed. So Rev. 11, in that universal apostasy under Antichrist, when the gentiles tread upon the outer court of the Temple and the holy City, God stirs up two witnesses to prophesy in sackcloth; that is, some few pastors (for two is the smallest number) and they prophesy and are slain, and yet they rise again. We need not apply this to men in particular, as to John Huss and Jerome of Prague; but certainly, some few spake against Babylon and they were borne down and oppressed and killed, and men of that same spirit rose and spake that same truth as if the very two men who were slain had risen within three days again.

2. Because when the Church is overgone with heresy and Apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; and suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.”

5. If nothing extraordinary was here, l […]t Mr. Hooker or any for him vindicate the place, Acts 8, from Anabaptists who allege the same place, Acts 8, to destroy the standing ordinance of the ministry: and read the judicious Tractate of the Ministers of London, of Mr. Collings.</p></blockquote>

</figure><figure class="quote" id="q-4eab099764" data-kw="">
<blockquote><p>2… [Margin note: A prophet is an interpreter of the Word] Also they which expound other men’s prophesies are prophets. For so was Aaron said to be the prophet of Moses unto Pharaoh: and the expounders of the holy scriptures are called prophets. Also it belongs to the office of a prophet to pray unto God: wherefore Paul says that ‘every man praying or prophesying, etc.’ [1 Cor. 11:4] And in Genesis [ch. 20], God answers Abimelech concerning Abraham, when he had taken his wife from him: ‘Give him his wife again, for he is a prophet, and shall pray for thee.’ And Paul in the first epistle to the Corinthians the 14th chapter sets forth more at large the office of a prophet. ‘When ye come together’ (says he) ‘every one hath a psalm, or hath doctrine, or hath revelation, or hath interpretation; let all things be done to edifying. They may also make hymns and thanksgiving, and exhort the people. For Paul says: ‘He that prophesieth, speaketh doctrine, exhortation, and consolation.’ Which faculty pertains to the mind and power of understanding. And a prophet differs from a priest, in that a priest should not only exhort, teach, and comfort; but also minister holy services, which thing a prophet may not do. Besides, the priests were of the tribe of Levi: the prophets were of other tribes. Moreover, the priests might err, &amp; often did err; but the true prophets, in that they were prophets, could not err. Indeed they sometimes added somewhat of their own, but therein they were not prophets… 4. But now that spirit, wherewith they be stirred up, is sometimes good, and sometimes evil. For as God does edify the church by his prophets: so the devil apishly counterfeiting God, subverts it by his prophets… 5. …But a fuller definition [of prophesy] is this: Prophesy is a faculty given unto certain men by the spirit of God, without teaching or learning, whereby they are able certainly to know things heavenly, high, and secret, and to open the same unto others for edifying of the church. Here this word faculty is the general word to prophesy, which may be referred to natural power: not that the same power is natural, but that it may make men apt, as natural power does, whereby they may be assured of their knowledge. 7. But above all things, prophets must beware that they corrupt not, nor that they add not, or diminish any thing. For some, otherwhile having received the illumination of God, do add over and besides of their own. In the Acts (21:4, 10) certain holy men lightened with the spirit of God, said that many grievous afflictions were prepared for Paul at Jerusalem. And this in very deed they spake truly: but they added other things of their own. For they gave counsel unto Paul, that he should not go to Jerusalem; which thing they had not of the holy Ghost. Good prophets ought not so to behave themselves. For if they will mingle their own wisdom with the oracles of God, they may easily both be deceived themselves, and also cause others to be deceived. Besides this, the prophets must take heed, that they suffer not themselves to be corrupted either by money, or favor; as we read that Balaam did. For they which so do (says Jerome) are not prophets, but diviners: As when Logic is corrupt with errors, and fallacies, it is no longer Logic, but Sophistry. For they which may be hired to speak in favor for reward sake, be rather the diviners of idols, than the prophets of God: and if they bear any office in the church, they will soon infect their auditory with errors: and so both shall be cast headlong into the ditch. Further, they must endeavor themselves, by their life and manners, to win credit to the Word of God… 8 But thou wilt say, Seeing there be some good prophets and some bad; by what mark may the one sort be discerned from the other?… There be certain other more sure tokens showed us in the scriptures. God says in Deuteronomy, that these be two sure arguments of a good prophet. The first, if he lead not away the people to idolatry, and strange gods: Secondly, if it certainly come to pass whatsoeuer he foreshows. The one of these, which concerns idolatry, is undoubted and certain; but of the second some doubt may be. For sometimes the foreshowings of the true prophets have not come to pass. Isaiah did prophesy that king Hezekiah should die of that disease whereof he was sick: and Jonah said that within forty days the city of Ninevah should be destroyed, and yet neither of these things came to pass according to the prophesy. Here the answer may be that those sayings were not prophesies, so much as they were threatenings: and that the prophets did foresee those effects according to the causes: and when the causes were changed, it was no absurdity that the effects changed also: and therefore the prophets cannot be reproved as liars. But that place of Deuteronomy is not to be understood of threatenings, but of other prophesies…

9. Whereas Paul says that the spirits of the prophets are subject to the prophets; that he added, lest the prophets should be at any contention among themselves, and should hinder one another; or least that any one should say: He could not wait till another had done. Paule adds another note in the same place: None (says he) can say, the Lord Jesus, but in the spirit of God. And no man speaking in the spirit of God, defies Jesus. These be assured tokens both of a good prophet and of a bad. Nevertheless it is not sufficient to confess the Lord Jesus in words, but it must also be done in true faith. Augustine in his commentaries begun upon the Epistle to the Romans: There be found (says he) which profess God in words, but deny him in their doings. Wherefore whosoever professes the true faith of God, and shows the same in his deeds and manners, must be accounted for a true prophet. Yet we ought not to deny, but that evil men also do sometimes foreshow true things. Such be they which shall say in that latter day: Have not we cast out devils, and wrought many miracles in thy name? And generally we may conclude that whosoever confesses Jesus Christ, of what manners soever he be, so he lead us not away from the faith, the same is to be esteemed for a prophet of God. For God can use the works even of evil ministers, in showing forth his glory, so they keep themselves within the prescript of faith… But if we take prophesying more largely for the exposition of the prophets, and Word of God, it cannot be denied but that that faculty may be attained by exercise and doctrine. And therefore to that purpose we find that schools were appointed, wherein the children of the prophets were instructed…

10. Now let us in a few words declare the effects of prophesy. The first effect is, the edifying of the church. Therefore Solomon says in the 29th of Proverbs: When prophesy ceases,the people be scattered, and with idleness and loitering be quite marred. For prophesy keeps men in their duty: wherefore Paule says, He that prophesieth, speaketh doctrine, exhortation, and comfort; so that if the ordinary ministration at any time (as it happens) be out of course, God raises up prophets extraordinarily to restore things into order. But it may be doubted, whether prophets do surely know those things to be true, which they foretell: yes verily. For otherwise how could Abraham have found in his heart to slay his son, unless he had been assured of the commandment of God. Wherefore in that they be prophets, they be sure of that which they say; I add, ‘in that they be prophets.’ For as being men they may both err and be deceived. In Chronicles, David told Nathan that he would build up a temple unto the Lord. Then Nathan the prophet, as if he allowed the king’s mind, bade him do that which seemed good to his own eyes; but afterward he received from the mouth of God, that the same work pertained to Solomon: therefore Nathan as man erred: but God forthwith called him home.

11. But we see that Abraham and Abimelech [Gen. 20] did then prophesy when God appeared unto them, but not as they thought good themselves. So we may perceive that this power of prophesy, is not to be counted an habit, but a preparation, or as they term it a disposition, being in a kind of quality. And the heauenly light, wherewith a man’s mind is then lightened, is rather as a sudden passion, as that which may easily be removed, than as a passible quality: and is as light in the air, but not like the light of the celestial bodies: not as a paleness coming of the natural temperature of the body; but as that is which rises of a sudden frighting of the mind… But there is not so necessary a bond between prophesy and justifying faith as that every man that has attained to the gift of prophesying, is forthwith become a friend of God and justified. We know that Balaam was a wicked man, and yet nevertheless a prophet. And in Matthew there is mention made of certain wicked persons that in the day of judgment shall object unto the Lord; Have we not prophesied in thy name? Who nevertheless shall hear (Christ say) I know you not [Mt. 7]. But this is no marvel, since the same happens in the office of the apostles and evangelists, and other ministers of the church. Judas was not in God’s favor, and yet nevertheless an apostle, and sent to preach among the rest. And Paul in the epistle to the Philippians, speaks of some that they did not preach Christ with a pure mind; but onely that they might stir up afflictions to him, whereunto the apostle adds that he is glad so Christ be preached, whether it be in truth, or by an occasion. And why? This is no necessary consequent. Among their reasons alleged, this also may be brought for a cause: namely, for that this gift is granted of the Lord, for the furtherance and profit of others: even as are the gifts of healing, of tongues, and of other such graces. And this does nothing derogate from the goodness of God: nay rather it does more plainly show the same unto us, when we understand thereby, that he is so gracious, as he will make even the wicked to serve to a good purpose.

12. Sometime this name of a prophet is used in the holy scriptures for an interpreter, as in the 7th of Exodus, Aaron is appointed to be Moses’s prophet, that is, his interpreter before Pharaoh. And ye shall find that the word prophesying in the first of Samuel, is attributed unto Saul, when he being assailed with the evil spirit of the Lord, spake strange and unusual things (as the Greeks say) by a vehement concitation of the mind. But the children of the prophets were the disciples of great and famous prophets, which sometime with their musical instruments and songs, were so stirred up to sing the praises of God as they spake some things beyond their wonted manner and custom: so that it easily appeared they were set on by the spirit of God… 13… And it should seem that in the stead of them [prophets], there succeed most learned teachers of the holy scriptures, plentifully at this day given us of God. Nevertheless it cannot be proved by the scriptures that such be called prophets, unless they, by the inspiration of God, foreshow some secret mysteries, without the earnest endeavor of man’s eloquence. Except thou wilt wrest the words of Paul in the first to the Corinthians to that purpose: and yet thou canst not prove it necessarily. And although that Christ said that there should be such gifts in his church; yet he did not warrant that they should continue still forever: neither have we any promises that Christ would perpetually adorn his church with such gifts.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2… [Margin note: A prophet is an interpreter of the Word] Also they which expound other men’s prophesies are prophets. For so was Aaron said to be the prophet of Moses unto Pharaoh: and the expounders of the holy scriptures are called prophets. Also it belongs to the office of a prophet to pray unto God: wherefore Paul says that ‘every man praying or prophesying, etc.’ [1 Cor. 11:4] And in Genesis [ch. 20], God answers Abimelech concerning Abraham, when he had taken his wife from him: ‘Give him his wife again, for he is a prophet, and shall pray for thee.’ And Paul in the first epistle to the Corinthians the 14th chapter sets forth more at large the office of a prophet. ‘When ye come together’ (says he) ‘every one hath a psalm, or hath doctrine, or hath revelation, or hath interpretation; let all things be done to edifying. They may also make hymns and thanksgiving, and exhort the people. For Paul says: ‘He that prophesieth, speaketh doctrine, exhortation, and consolation.’ Which faculty pertains to the mind and power of understanding. And a prophet differs from a priest, in that a priest should not only exhort, teach, and comfort; but also minister holy services, which thing a prophet may not do. Besides, the priests were of the tribe of Levi: the prophets were of other tribes. Moreover, the priests might err, &amp; often did err; but the true prophets, in that they were prophets, could not err. Indeed they sometimes added somewhat of their own, but therein they were not prophets… 4. But now that spirit, wherewith they be stirred up, is sometimes good, and sometimes evil. For as God does edify the church by his prophets: so the devil apishly counterfeiting God, subverts it by his prophets… 5. …But a fuller definition [of prophesy] is this: Prophesy is a faculty given unto certain men by the spirit of God, without teaching or learning, whereby they are able certainly to know things heavenly, high, and secret, and st, if he lead not away the people to idolatry, and strange gods: Secondly, if it certainly come to pass whatsoeuer he foreshows. The one of these, which concerns idolatry, is undoubted and certain; but of the second some doubt may be. For sometimes the foreshowings of the true prophets have not come to pass. Isaiah did prophesy that king Hezekiah should die of that disease whereof he was sick: and Jonah said that within forty days the city of Ninevah should be destroyed, and yet neither of these things came to pass according to the prophesy. Here the answer may be that those sayings were not prophesies, so much as they were threatenings: and that the prophets did foresee those effects according to the causes: and when the causes were changed, it was no absurdity that the effects changed also: and therefore the prophets cannot be reproved as liars. But that place of Deuteronomy is not to be understood of threatenings, but of other prophesies…

9. Whereas Paul says that the spirits of the prophets are subject to the prophets; that he added, lest the prophets should be at any contention among themselves, and should hinder one another; or least that any one should say: He could not wait till another had done. Paule adds another note in the same place: None (says he) can say, the Lord Jesus, but in the spirit of God. And no man speaking in the spirit of God, defies Jesus. These be assured tokens both of a good prophet and of a bad. Nevertheless it is not sufficient to confess the Lord Jesus in words, but it must also be done in true faith. Augustine in his commentaries begun upon the Epistle to the Romans: There be found (says he) which profess God in words, but deny him in their doings. Wherefore whosoever professes the true faith of God, and shows the same in his deeds and manners, must be accounted for a true prophet. Yet we ought not to deny, but that evil men also do sometimes foreshow true things. Such be they which shall say in that latter day: Have not we cast out devils, and wrought many miracles in thy name? And generally we may conclude that whosoever confesses Jesus Christ, of what manners soever he be, so he lead us not away from the faith, the same is to be esteemed for a prophet of God. For God can use the works even of evil ministers, in showing forth his glory, so they keep themselves within the prescript of faith… But if we take prophesying more largely for the exposition of the prophets, and Word of God, it cannot be denied but that that faculty may be attained by exercise and doctrine. And therefore to that purpose we find that schools were appointed, wherein the children of the prophets were instructed…

10. Now let us in a few words declare the effects of prophesy. The first effect is, the edifying of the church. Therefore Solomon says in the 29th of Proverbs: When prophesy ceases,the people be scattered, and with idleness and loitering be quite marred. For prophesy keeps men in their duty: wherefore Paule says, He that prophesieth, speaketh doctrine, exhortation, and comfort; so that if the ordinary ministration at any time (as it happens) be out of course, God raises up prophets extraordinarily to restore things into order. But it may be doubted, whether prophets do surely know those things to be true, which they foretell: yes verily. For otherwise how could Abraham have found in his heart to slay his son, unless he had been assured of the commandment of God. Wherefore in that they be prophets, they be sure of that which they say; I add, ‘in that they be prophets.’ For as being men they may both err and be deceived. In Chronicles, David told Nathan that he would build up a temple unto the Lord. Then Nathan the prophet, as if he allowed the king’s mind, bade him do that which seemed good to his own eyes; but afterward he received from the mouth of God, that the same work pertained to Solomon: therefore Nathan as man erred: but God forthwith called him home.

11. But we see that Abraham and Abimelech [Gen. 20] did then prophesy when God appeared unto them, but not as they thought good themselves. So we may perceive that this power of prophesy, is not to be counted an habit, but a preparation, or as they term it a disposition, being in a kind of quality. And the heauenly light, wherewith a man’s mind is then lightened, is rather as a sudden passion, as that which may easily be removed, than as a passible quality: and is as light in the air, but not like the light of the celestial bodies: not as a paleness coming of the natural temperature of the body; but as that is which rises of a sudden frighting of the mind… But there is not so necessary a bond between prophesy and justifying faith as that every man that has attained to the gift of prophesying, is forthwith become a friend of God and justified. We know that Balaam was a wicked man, and yet nevertheless a prophet. And in Matthew there is mention made of certain wicked persons that in the day of judgment shall object unto the Lord; Have we not prophesied in thy name? Who nevertheless shall hear (Christ say) I know you not [Mt. 7]. But this is no marvel, since the same happens in the office of the apostles and evangelists, and other ministers of the church. Judas was not in God’s favor, and yet nevertheless an apostle, and sent to preach among the rest. And Paul in the epistle to the Philippians, speaks of some that they did not preach Christ with a pure mind; but onely that they might stir up afflictions to him, whereunto the apostle adds that he is glad so Christ be preached, whether it be in truth, or by an occasion. And why? This is no necessary consequent. Among their reasons alleged, this also may be brought for a cause: namely, for that this gift is granted of the Lord, for the furtherance and profit of others: even as are the gifts of healing, of tongues, and of other such graces. And this does nothing derogate from the goodness of God: nay rather it does more plainly show the same unto us, when we understand thereby, that he is so gracious, as he will make even the wicked to serve to a good purpose.

12. Sometime this name of a prophet is used in the holy scriptures for an interpreter, as in the 7th of Exodus, Aaron is appointed to be Moses’s prophet, that is, his interpreter before Pharaoh. And ye shall find that the word prophesying in the first of Samuel, is attributed unto Saul, when he being assailed with the evil spirit of the Lord, spake strange and unusual things (as the Greeks say) by a vehement concitation of the mind. But the children of the prophets were the disciples of great and famous prophets, which sometime with their musical instruments and songs, were so stirred up to sing the praises of God as they spake some things beyond their wonted manner and custom: so that it easily appeared they were set on by the spirit of God… 13… And it should seem that in the stead of them [prophets], there succeed most learned teachers of the holy scriptures, plentifully at this day given us of God. Nevertheless it cannot be proved by the scriptures that such be called prophets, unless they, by the inspiration of God, foreshow some secret mysteries, without the earnest endeavor of man’s eloquence. Except thou wilt wrest the words of Paul in the first to the Corinthians to that purpose: and yet thou canst not prove it necessarily. And although that Christ said that there should be such gifts in his church; yet he did not warrant that they should continue still forever: neither have we any promises that Christ would perpetually adorn his church with such gifts.”

— Peter Martyr Vermigli, Common Places, sections 2, 4-5, 7-13 in ch. 3, “Concerning Prophesy; out of 1 Samuel 19:33” in The Common Places… (London, 1583), pt. 1, pp. 17-24, pp. 18-24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2%E2%80%A6+%5BMargin+note%3A+A+prophet+is+an+interpreter+of+the+Word%5D+Also+they+which+expound+other+men%E2%80%99s+prophesies+are+prophets.+For+so+was+Aaron+said+to+be+the+prophet+of+Moses+unto+Pharaoh%3A+and+the+expounders+of+the+holy+scriptures+are+called+prophets.+Also+it+belongs+to+the+office+of+a+prophet+to+pray+unto+God%3A+wherefore+Paul+says+that+%E2%80%98every+man+praying+or+prophesying%2C+etc.%E2%80%99+%5B1+Cor.+11%3A4%5D+And+in+Genesis+%5Bch.+20%5D%2C+God+answers+Abimelech+concerning+Abraham%2C+when+he+had+taken+his+wife+from+him%3A+%E2%80%98Give+him+his+wife+again%2C+for+he+is+a+prophet%2C+and+shall+pray+for+thee.%E2%80%99+And+Paul+in+the+first+epistle+to+the+Corinthians+the+14th+chapter+sets+forth+more+at+large+the+office+of+a+prophet.+%E2%80%98When+ye+come+together%E2%80%99+%28says+he%29+%E2%80%98every+one+hath+a+psalm%2C+or+hath+doctrine%2C+or+hath+revelation%2C+or+hath+interpretation%3B+let+all+things+be+done+to+edifying.+They+may+also+make+hymns+and+thanksgiving%2C+and+exhort+the+people.+For+Paul+says%3A+%E2%80%98He+that+prophesieth%2C+speaketh+doctrine%2C+exhortation%2C+and+consolation.%E2%80%99+Which+faculty+pertains+to+the+mind+and+power+of+understanding.+And+a+prophet+differs+from+a+priest%2C+in+that+a+priest+should+not+only+exhort%2C+teach%2C+and+comfort%3B+but+also+minister+holy+services%2C+which+thing+a+prophet+may+not+do.+Besides%2C+the+priests+were+of+the+tribe+of+Levi%3A+the+prophets+were+of+other+tribes.+Moreover%2C+the+priests+might+err%2C+%26+often+did+err%3B+but+the+true+prophets%2C+in+that+they+were+prophets%2C+could+not+err.+Indeed+they+sometimes+added+somewhat+of+their+own%2C+but+therein+they+were+not+prophets%E2%80%A6+4.+But+now+that+spirit%2C+wherewith+they+be+stirred+up%2C+is+sometimes+good%2C+and+sometimes+evil.+For+as+God+does+edify+the+church+by+his+prophets%3A+so+the+devil+apishly+counterfeiting+God%2C+subverts+it+by+his+prophets%E2%80%A6+5.+%E2%80%A6But+a+fuller+definition+%5Bof+prophesy%5D+is+this%3A+Prophesy+is+a+faculty+given+unto+certain+men+by+the+spirit+of+God%2C+without+teaching+or+learning%2C+whereby+they+are+able+certainly+to+know+things+heavenly%2C+high%2C+and+secret%2C+and+to+open+the+same+unto+others+for+edifying+of+the+church.+Here+this+word+faculty+is+the+general+word+to+prophesy%2C+which+may+be+referred+to+natural+power%3A+not+that+the+same+power+is+natural%2C+but+that+it+may+make+men+apt%2C+as+natural+power+does%2C+whereby+they+may+be+assured+of+their+knowledge.+7.+But+above+all+things%2C+prophets+must+beware+that+they+corrupt+not%2C+nor+that+they+add+not%2C+or+diminish+any+thing.+For+some%2C+otherwhile+having+received+the+illumination+of+God%2C+do+add+over+and+besides+of+their+own.+In+the+Acts+%2821%3A4%2C+10%29+certain+holy+men+lightened+with+the+spirit+of+God%2C+said+that+many+grievous+afflictions+were+prepared+for+Paul+at+Jerusalem.+And+this+in+very+deed+they+spake+truly%3A+but+they+added+other+things+of+their+own.+For+they+gave+counsel+unto+Paul%2C+that+he+should+not+go+to+Jerusalem%3B+which+thing+they+had+not+of+the+holy+Ghost.+Good+prophets+ought+not+so+to+behave+themselves.+For+if+they+will+mingle+their+own+wisdom+with+the+oracles+of+God%2C+they+may+easily+both+be+deceived+themselves%2C+and+also+cause+others+to+be+deceived.+Besides+this%2C+the+prophets+must+take+heed%2C+that+they+suffer+not+themselves+to+be+corrupted+either+by+money%2C+or+favor%3B+as+we+read+that+Balaam+did.+For+they+which+so+do+%28says+Jerome%29+are+not+prophets%2C+but+diviners%3A+As+when+Logic+is+corrupt+with+errors%2C+and+fallacies%2C+it+is+no+longer+Logic%2C+but+Sophistry.+For+they+which+may+be+hired+to+speak+in+favor+for+reward+sake%2C+be+rather+the+diviners+of+idols%2C+than+the+prophets+of+God%3A+and+if+they+bear+any+office+in+the+church%2C+they+will+soon+infect+their+auditory+with+errors%3A+and+so+both+shall+be+cast+headlong+into+the+ditch.+Further%2C+they+must+endeavor+themselves%2C+by+their+life+and+manners%2C+to+win+credit+to+the+Word+of+God%E2%80%A6+8+But+thou+wilt+say%2C+Seeing+there+be+some+good+prophets+and+some+bad%3B+by+what+mark+may+the+one+sort+be+discerned+from+the+other%3F%E2%80%A6+There+be+certain+other+more+sure+tokens+showed+us+in+the+scriptures.+God+says+in+Deuteronomy%2C+that+these+be+two+sure+arguments+of+a+good+prophet.+The+first%2C+if+he+lead+not+away+the+people+to+idolatry%2C+and+strange+gods%3A+Secondly%2C+if+it+certainly+come+to+pass+whatsoeuer+he+foreshows.+The+one+of+these%2C+which+concerns+idolatry%2C+is+undoubted+and+certain%3B+but+of+the+second+some+doubt+may+be.+For+sometimes+the+foreshowings+of+the+true+prophets+have+not+come+to+pass.+Isaiah+did+prophesy+that+king+Hezekiah+should+die+of+that+disease+whereof+he+was+sick%3A+and+Jonah+said+that+within+forty+days+the+city+of+Ninevah+should+be+destroyed%2C+and+yet+neither+of+these+things+came+to+pass+according+to+the+prophesy.+Here+the+answer+may+be+that+those+sayings+were+not+prophesies%2C+so+much+as+they+were+threatenings%3A+and+that+the+prophets+did+foresee+those+effects+according+to+the+causes%3A+and+when+the+causes+were+changed%2C+it+was+no+absurdity+that+the+effects+changed+also%3A+and+therefore+the+prophets+cannot+be+reproved+as+liars.+But+that+place+of+Deuteronomy+is+not+to+be+understood+of+threatenings%2C+but+of+other+prophesies%E2%80%A6+9.+Whereas+Paul+says+that+the+spirits+of+the+prophets+are+subject+to+the+prophets%3B+that+he+added%2C+lest+the+prophets+should+be+at+any+contention+among+themselves%2C+and+should+hinder+one+another%3B+or+least+that+any+one+should+say%3A+He+could+not+wait+till+another+had+done.+Paule+adds+another+note+in+the+same+place%3A+None+%28says+he%29+can+say%2C+the+Lord+Jesus%2C+but+in+the+spirit+of+God.+And+no+man+speaking+in+the+spirit+of+God%2C+defies+Jesus.+These+be+assured+tokens+both+of+a+good+prophet+and+of+a+bad.+Nevertheless+it+is+not+sufficient+to+confess+the+Lord+Jesus+in+words%2C+but+it+must+also+be+done+in+true+faith.+Augustine+in+his+commentaries+begun+upon+the+Epistle+to+the+Romans%3A+There+be+found+%28says+he%29+which+profess+God+in+words%2C+but+deny+him+in+their+doings.+Wherefore+whosoever+professes+the+true+faith+of+God%2C+and+shows+the+same+in+his+deeds+and+manners%2C+must+be+accounted+for+a+true+prophet.+Yet+we+ought+not+to+deny%2C+but+that+evil+men+also+do+sometimes+foreshow+true+things.+Such+be+they+which+shall+say+in+that+latter+day%3A+Have+not+we+cast+out+devils%2C+and+wrought+many+miracles+in+thy+name%3F+And+generally+we+may+conclude+that+whosoever+confesses+Jesus+Christ%2C+of+what+manners+soever+he+be%2C+so+he+lead+us+not+away+from+the+faith%2C+the+same+is+to+be+esteemed+for+a+prophet+of+God.+For+God+can+use+the+works+even+of+evil+ministers%2C+in+showing+forth+his+glory%2C+so+they+keep+themselves+within+the+prescript+of+faith%E2%80%A6+But+if+we+take+prophesying+more+largely+for+the+exposition+of+the+prophets%2C+and+Word+of+God%2C+it+cannot+be+denied+but+that+that+faculty+may+be+attained+by+exercise+and+doctrine.+And+therefore+to+that+purpose+we+find+that+schools+were+appointed%2C+wherein+the+children+of+the+prophets+were+instructed%E2%80%A6+10.+Now+let+us+in+a+few+words+declare+the+effects+of+prophesy.+The+first+effect+is%2C+the+edifying+of+the+church.+Therefore+Solomon+says+in+the+29th+of+Proverbs%3A+When+prophesy+ceases%2Cthe+people+be+scattered%2C+and+with+idleness+and+loitering+be+quite+marred.+For+prophesy+keeps+men+in+their+duty%3A+wherefore+Paule+says%2C+He+that+prophesieth%2C+speaketh+doctrine%2C+exhortation%2C+and+comfort%3B+so+that+if+the+ordinary+ministration+at+any+time+%28as+it+happens%29+be+out+of+course%2C+God+raises+up+prophets+extraordinarily+to+restore+things+into+order.+But+it+may+be+doubted%2C+whether+prophets+do+surely+know+those+things+to+be+true%2C+which+they+foretell%3A+yes+verily.+For+otherwise+how+could+Abraham+have+found+in+his+heart+to+slay+his+son%2C+unless+he+had+been+assured+of+the+commandment+of+God.+Wherefore+in+that+they+be+prophets%2C+they+be+sure+of+that+which+they+say%3B+I+add%2C+%E2%80%98in+that+they+be+prophets.%E2%80%99+For+as+being+men+they+may+both+err+and+be+deceived.+In+Chronicles%2C+David+told+Nathan+that+he+would+build+up+a+temple+unto+the+Lord.+Then+Nathan+the+prophet%2C+as+if+he+allowed+the+king%E2%80%99s+mind%2C+bade+him+do+that+which+seemed+good+to+his+own+eyes%3B+but+afterward+he+received+from+the+mouth+of+God%2C+that+the+same+work+pertained+to+Solomon%3A+therefore+Nathan+as+man+erred%3A+but+God+forthwith+called+him+home.+11.+But+we+see+that+Abraham+and+Abimelech+%5BGen.+20%5D+did+then+prophesy+when+God+appeared+unto+them%2C+but+not+as+they+thought+good+themselves.+So+we+may+perceive+that+this+power+of+prophesy%2C+is+not+to+be+counted+an+habit%2C+but+a+preparation%2C+or+as+they+term+it+a+disposition%2C+being+in+a+kind+of+quality.+And+the+heauenly+light%2C+wherewith+a+man%E2%80%99s+mind+is+then+lightened%2C+is+rather+as+a+sudden+passion%2C+as+that+which+may+easily+be+removed%2C+than+as+a+passible+quality%3A+and+is+as+light+in+the+air%2C+but+not+like+the+light+of+the+celestial+bodies%3A+not+as+a+paleness+coming+of+the+natural+temperature+of+the+body%3B+but+as+that+is+which+rises+of+a+sudden+frighting+of+the+mind%E2%80%A6+But+there+is+not+so+necessary+a+bond+between+prophesy+and+justifying+faith+as+that+every+man+that+has+attained+to+the+gift+of+prophesying%2C+is+forthwith+become+a+friend+of+God+and+justified.+We+know+that+Balaam+was+a+wicked+man%2C+and+yet+nevertheless+a+prophet.+And+in+Matthew+there+is+mention+made+of+certain+wicked+persons+that+in+the+day+of+judgment+shall+object+unto+the+Lord%3B+Have+we+not+prophesied+in+thy+name%3F+Who+nevertheless+shall+hear+%28Christ+say%29+I+know+you+not+%5BMt.+7%5D.+But+this+is+no+marvel%2C+since+the+same+happens+in+the+office+of+the+apostles+and+evangelists%2C+and+other+ministers+of+the+church.+Judas+was+not+in+God%E2%80%99s+favor%2C+and+yet+nevertheless+an+apostle%2C+and+sent+to+preach+among+the+rest.+And+Paul+in+the+epistle+to+the+Philippians%2C+speaks+of+some+that+they+did+not+preach+Christ+with+a+pure+mind%3B+but+onely+that+they+might+stir+up+afflictions+to+him%2C+whereunto+the+apostle+adds+that+he+is+glad+so+Christ+be+preached%2C+whether+it+be+in+truth%2C+or+by+an+occasion.+And+why%3F+This+is+no+necessary+consequent.+Among+their+reasons+alleged%2C+this+also+may+be+brought+for+a+cause%3A+namely%2C+for+that+this+gift+is+granted+of+the+Lord%2C+for+the+furtherance+and+profit+of+others%3A+even+as+are+the+gifts+of+healing%2C+of+tongues%2C+and+of+other+such+graces.+And+this+does+nothing+derogate+from+the+goodness+of+God%3A+nay+rather+it+does+more+plainly+show+the+same+unto+us%2C+when+we+understand+thereby%2C+that+he+is+so+gracious%2C+as+he+will+make+even+the+wicked+to+serve+to+a+good+purpose.+12.+Sometime+this+name+of+a+prophet+is+used+in+the+holy+scriptures+for+an+interpreter%2C+as+in+the+7th+of+Exodus%2C+Aaron+is+appointed+to+be+Moses%E2%80%99s+prophet%2C+that+is%2C+his+interpreter+before+Pharaoh.+And+ye+shall+find+that+the+word+prophesying+in+the+first+of+Samuel%2C+is+attributed+unto+Saul%2C+when+he+being+assailed+with+the+evil+spirit+of+the+Lord%2C+spake+strange+and+unusual+things+%28as+the+Greeks+say%29+by+a+vehement+concitation+of+the+mind.+But+the+children+of+the+prophets+were+the+disciples+of+great+and+famous+prophets%2C+which+sometime+with+their+musical+instruments+and+songs%2C+were+so+stirred+up+to+sing+the+praises+of+God+as+they+spake+some+things+beyond+their+wonted+manner+and+custom%3A+so+that+it+easily+appeared+they+were+set+on+by+the+spirit+of+God%E2%80%A6+13%E2%80%A6+And+it+should+seem+that+in+the+stead+of+them+%5Bprophets%5D%2C+there+succeed+most+learned+teachers+of+the+holy+scriptures%2C+plentifully+at+this+day+given+us+of+God.+Nevertheless+it+cannot+be+proved+by+the+scriptures+that+such+be+called+prophets%2C+unless+they%2C+by+the+inspiration+of+God%2C+foreshow+some+secret+mysteries%2C+without+the+earnest+endeavor+of+man%E2%80%99s+eloquence.+Except+thou+wilt+wrest+the+words+of+Paul+in+the+first+to+the+Corinthians+to+that+purpose%3A+and+yet+thou+canst+not+prove+it+necessarily.+And+although+that+Christ+said+that+there+should+be+such+gifts+in+his+church%3B+yet+he+did+not+warrant+that+they+should+continue+still+forever%3A+neither+have+we+any+promises+that+Christ+would+perpetually+adorn+his+church+with+such+gifts.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Common+Places%2C+sections+2%2C+4-5%2C+7-13+in+ch.+3%2C+%E2%80%9CConcerning+Prophesy%3B+out+of+1+Samuel+19%3A33%E2%80%9D+in+The+Common+Places%E2%80%A6+%28London%2C+1583%29%2C+pt.+1%2C+pp.+17-24%2C+pp.+18-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4eab099764.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/4eab099764.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-biblical-prophecy-as-including-expositing-the-scriptures/#:~:text=Margin%20note%3A%20A%20prophet%20is%20an,adorn%20his%20church%20with%20such%20gifts&amp;text=Margin%20note%3A%20A%20prophet%20is%20an%20interpreter%20of&amp;text=would%20perpetually%20adorn%20his%20church%20with%20such%20gifts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>These prophets [in 1 Cor. 14] were prophets by office, and so beside that they were gifted, they were sent with official authority to preach:

1. They are such as Paul speaks of, 1 Cor. 12:28, ‘God hath set some in the Church, first apostles, secondarily prophets,’ therefore, they were officers set in the body, as apostles were at that time, Eph. 4:11.

2. They are called prophets, 1 Cor. 14:29, 32. But in all the Old or New Testament, prophets signify over these that are in office, as the places in the margin clear, and a place cannot be brought where the word prophet signifies a man who publicly preaches, and yet is no prophet by office, but possibly a fashioner, a ploughman, a shoemaker.

3. The formal effects of public edifying, comforting, convincing, converting souls are ascribed to these prophets, vv. 1, 3-5, 12, 24-25, 31, which are ascribed to preaching pastors, Rom 10:14-15; 1 Cor. 14:1-3.

4. In this chapter, and in ch. 13, Paul does set down canons anent the right use of the offices that he spake of, 1 Cor. 12:28-29.

5. Paul must think them prophets by office, while as he compares himself who was an apostle and prophet with these prophets, v. 37, ‘If any man think himself to be a prophet, or spiritual, let him acknowledge that the things that I write to you are the commandments of the Lord.’ Also these prophets were extraordinary and temporary, as were the gifts of tongues and miracles; and therefore none out of office now are to prophesy publicly. Mr. Robinson says, they cannot be extraordinary, because extraordinary prophets are infallible, and cannot err, else the Scriptures should have been written by prophets who could err; but these prophets, 1 Cor. 14, could err and were not infallible because their doctrine was to be judged, v. 29. Answer: This is a silly reason, Pareus, Bulling, Calvin, Beza say all spirits are to be tried by the Word, and all prophets, even Samuel and Nathan may err, and look beside the book, and may speak of their own spirit. How then were the penmen of Scripture infallible, says Robinson? I answer, there are none simply infallible but God; every man is a liar: The penmen of the Scripture were infallible, because when they were actually inspired by the Holy-Ghost, they could not err: and the spirits of all prophets are to be tried by the Word, even of Paul preaching at Berea: But it follows not that Paul then could err. To this they answer that false prophets, as Balaam, could not err when they were actually inspired, no more than canonic writers. Answer: In the case of infallibility all are alike, none are infallible by any infused habit of a prophetical spirit; but false prophets were inspired with an habitual spirit of lying, which spirit is not in canonic writers. Robinson and others of his side think them not extraordinarily inspired:

1. Because these prophets might have been interrupted and put to silence, that another to whom choicer things were revealed, might prophesy, v. 3.

2. Because Paul exhorts to pray for the gift of interpretation, and to covet (say others) to prophesy. Now we cannot seek in faith from God an extraordinary and miraculous gift.

3. Others add, this prophesying was subject to the free-will of the prophets, for they might prophesy, or keep silence, as they pleased; but the acts of extraordinary prophesying are not subjected to the free-will of the prophets; therefore this was but ordinary prophesying, to the which all gifted professors even out of office are obliged for the edifying of the Church of Christ to the world’s end. Answer: All these three come to one, to wit, acts of extraordinary prophesying are under the determination of free-will. A little of this. 1st Conclusion: Pareus observes well that there be two kinds of prophets.

1. Some who foretold things to come, of these the text in hand speaks not.

2. Some extraordinarily inspired with an extraordinary grace of interpreting Scripture: The former were prophets in the Old Testament, the latter especially prophets of the New Testament; knowledge of both were given without study or pains. So there was a prophetical spirit in Paul, Gal. 1:12, ‘I received it not of man, neither was I taught it, but by the revelation of Jesus Christ.’ 2nd Conclusion: The act of foretelling things to come, especially things merely contingent, which are determined only in the free decree of God, is not so under our free-will, as the acts of preaching and interpreting Scripture out of a prophetical infused habit: For prophesying things to come seemed to have come on the prophets of old, as a fire-flash appears to a man’s eye in the dark air, he cannot choose but see it, Eze. 2:14, ‘So the spirit lifted me up, and took me away, and I went in bitterness, in the heat of my spirit, but the hand of the Lord was strong upon me,’ Jer. 20:9, ‘And I said, I will not make mention of him, nor speak any more in his name, but his word was in my heart, as a burning fire shut up in my bones, and I was weary with forbearing, and I could not stay,’ 2 Kings 3:15, ‘The hand of the Lord came upon Elisha, and he prophesied.’ See Jerome, Oecumenius, Gregory and Thomas. The prophetical spirit in the New Testament seems to be more swayed with free-will, and moral threatnings, 1 Cor. 9:16, ‘Woe unto me if I preach not the Gospel; yet the habit from whence he preached was a prophetical principle, Gal. 1:12; 1 Cor. 14:32. 3rd Conclusion: Hence prophesying is not a habit and it is a habit. It is not a habit:

1. Because no prophet can simply prophecy when he will, except the man Christ, especially of things to come by contingent causes (the presence of which things (says Suarez) is only connatural to God, and to no moral man) coming on men by a transient irradiation, while as the candle of God’s prophetical light glances upon the fancy, and from thence to the mind, that the man may see and read the species and images, and when this light shines not Nathan and Samuel read beside the Bible and are widely out. Prophecy also is a habit for: 1. something remains in Isaiah and Jeremiah while they sleep and prophesy not, from whence they are named prophets and really are prophets; for when God has once revealed himself to one as to his own prophet, even from by-past revelation:

1. There remains a disposition to prophecy, 1 Sam. 3:20, All Israel knew, even from Dan to Beersheba, that Samuel was established to be a prophet of the Lord.

2. Because there remains a prophetical light, whereby the man gave assent to the last prophetical revelation, and so the species and prophetical images must remain in the fantasy, and with these a prophetical memory of by past predictions, and so some experimental certainty, that what he foretells shall come to pass: See Thomas and Cajetan. …

4. Conclusion: Hence Separatists may see that extraordinary acts of prophecy may well be subjected to the determination of the Church, and yet be extraordinary inspirations, and that diverse ways:

1. Because they were prophets of the New Testament, and so grace being more abundant now nor under the Old Testament, it can bow and facilitate free-will to acts of prophesying, and Paul from more grace labored more abundantly than they all.

2. Prophesying at that time in Corinth might well be obtained by prayer upon the extraordinary impulsion of the spirit, as Daniel obtained by prayer the interpretation of a dream; neither can it be proved from 1 Cor. 14 that Paul wills them all without exception to covet to speak with tongues and to prophesy, but only these that were extraordinarily moved to pray, except these [words] (v. 31, ‘ye may all prophecy’) be contrary to these words (1 Cor. 12:29, ‘are all prophets?’) which we cannot say.

3. Because it was of old in the power of prophets to use some means to dispose themselves to prophecy, for when the passion of anger overclouded the fancy and the species therein, then Elisha calls for a minstrel to play, and dispose the mind better, as Cajetan says: Howbeit for all that the text says the hand of the Lord only actuated these species and caused him to prophesy.</p></blockquote>

— Samuel Rutherford, Other citations (work not named), pp. 249-57 in ch. 16 of A Peaceable &amp; Temperate Plea… (London, 1642), pp. 249-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThese+prophets+%5Bin+1+Cor.+14%5D+were+prophets+by+office%2C+and+so+beside+that+they+were+gifted%2C+they+were+sent+with+official+authority+to+preach%3A+1.+They+are+such+as+Paul+speaks+of%2C+1+Cor.+12%3A28%2C+%E2%80%98God+hath+set+some+in+the+Church%2C+first+apostles%2C+secondarily+prophets%2C%E2%80%99+therefore%2C+they+were+officers+set+in+the+body%2C+as+apostles+were+at+that+time%2C+Eph.+4%3A11.+2.+They+are+called+prophets%2C+1+Cor.+14%3A29%2C+32.+But+in+all+the+Old+or+New+Testament%2C+prophets+signify+over+these+that+are+in+office%2C+as+the+places+in+the+margin+clear%2C+and+a+place+cannot+be+brought+where+the+word+prophet+signifies+a+man+who+publicly+preaches%2C+and+yet+is+no+prophet+by+office%2C+but+possibly+a+fashioner%2C+a+ploughman%2C+a+shoemaker.+3.+The+formal+effects+of+public+edifying%2C+comforting%2C+convincing%2C+converting+souls+are+ascribed+to+these+prophets%2C+vv.+1%2C+3-5%2C+12%2C+24-25%2C+31%2C+which+are+ascribed+to+preaching+pastors%2C+Rom+10%3A14-15%3B+1+Cor.+14%3A1-3.+4.+In+this+chapter%2C+and+in+ch.+13%2C+Paul+does+set+down+canons+anent+the+right+use+of+the+offices+that+he+spake+of%2C+1+Cor.+12%3A28-29.+5.+Paul+must+think+them+prophets+by+office%2C+while+as+he+compares+himself+who+was+an+apostle+and+prophet+with+these+prophets%2C+v.+37%2C+%E2%80%98If+any+man+think+himself+to+be+a+prophet%2C+or+spiritual%2C+let+him+acknowledge+that+the+things+that+I+write+to+you+are+the+commandments+of+the+Lord.%E2%80%99+Also+these+prophets+were+extraordinary+and+temporary%2C+as+were+the+gifts+of+tongues+and+miracles%3B+and+therefore+none+out+of+office+now+are+to+prophesy+publicly.+Mr.+Robinson+says%2C+they+cannot+be+extraordinary%2C+because+extraordinary+prophets+are+infallible%2C+and+cannot+err%2C+else+the+Scriptures+should+have+been+written+by+prophets+who+could+err%3B+but+these+prophets%2C+1+Cor.+14%2C+could+err+and+were+not+infallible+because+their+doctrine+was+to+be+judged%2C+v.+29.+Answer%3A+This+is+a+silly+reason%2C+Pareus%2C+Bulling%2C+Calvin%2C+Beza+say+all+spirits+are+to+be+tried+by+the+Word%2C+and+all+prophets%2C+even+Samuel+and+Nathan+may+err%2C+and+look+beside+the+book%2C+and+may+speak+of+their+own+spirit.+How+then+were+the+penmen+of+Scripture+infallible%2C+says+Robinson%3F+I+answer%2C+there+are+none+simply+infallible+but+God%3B+every+man+is+a+liar%3A+The+penmen+of+the+Scripture+were+infallible%2C+because+when+they+were+actually+inspired+by+the+Holy-Ghost%2C+they+could+not+err%3A+and+the+spirits+of+all+prophets+are+to+be+tried+by+the+Word%2C+even+of+Paul+preaching+at+Berea%3A+But+it+follows+not+that+Paul+then+could+err.+To+this+they+answer+that+false+prophets%2C+as+Balaam%2C+could+not+err+when+they+were+actually+inspired%2C+no+more+than+canonic+writers.+Answer%3A+In+the+case+of+infallibility+all+are+alike%2C+none+are+infallible+by+any+infused+habit+of+a+prophetical+spirit%3B+but+false+prophets+were+inspired+with+an+habitual+spirit+of+lying%2C+which+spirit+is+not+in+canonic+writers.+Robinson+and+others+of+his+side+think+them+not+extraordinarily+inspired%3A+1.+Because+these+prophets+might+have+been+interrupted+and+put+to+silence%2C+that+another+to+whom+choicer+things+were+revealed%2C+might+prophesy%2C+v.+3.+2.+Because+Paul+exhorts+to+pray+for+the+gift+of+interpretation%2C+and+to+covet+%28say+others%29+to+prophesy.+Now+we+cannot+seek+in+faith+from+God+an+extraordinary+and+miraculous+gift.+3.+Others+add%2C+this+prophesying+was+subject+to+the+free-will+of+the+prophets%2C+for+they+might+prophesy%2C+or+keep+silence%2C+as+they+pleased%3B+but+the+acts+of+extraordinary+prophesying+are+not+subjected+to+the+free-will+of+the+prophets%3B+therefore+this+was+but+ordinary+prophesying%2C+to+the+which+all+gifted+professors+even+out+of+office+are+obliged+for+the+edifying+of+the+Church+of+Christ+to+the+world%E2%80%99s+end.+Answer%3A+All+these+three+come+to+one%2C+to+wit%2C+acts+of+extraordinary+prophesying+are+under+the+determination+of+free-will.+A+little+of+this.+1st+Conclusion%3A+Pareus+observes+well+that+there+be+two+kinds+of+prophets.+1.+Some+who+foretold+things+to+come%2C+of+these+the+text+in+hand+speaks+not.+2.+Some+extraordinarily+inspired+with+an+extraordinary+grace+of+interpreting+Scripture%3A+The+former+were+prophets+in+the+Old+Testament%2C+the+latter+especially+prophets+of+the+New+Testament%3B+knowledge+of+both+were+given+without+study+or+pains.+So+there+was+a+prophetical+spirit+in+Paul%2C+Gal.+1%3A12%2C+%E2%80%98I+received+it+not+of+man%2C+neither+was+I+taught+it%2C+but+by+the+revelation+of+Jesus+Christ.%E2%80%99+2nd+Conclusion%3A+The+act+of+foretelling+things+to+come%2C+especially+things+merely+contingent%2C+which+are+determined+only+in+the+free+decree+of+God%2C+is+not+so+under+our+free-will%2C+as+the+acts+of+preaching+and+interpreting+Scripture+out+of+a+prophetical+infused+habit%3A+For+prophesying+things+to+come+seemed+to+have+come+on+the+prophets+of+old%2C+as+a+fire-flash+appears+to+a+man%E2%80%99s+eye+in+the+dark+air%2C+he+cannot+choose+but+see+it%2C+Eze.+2%3A14%2C+%E2%80%98So+the+spirit+lifted+me+up%2C+and+took+me+away%2C+and+I+went+in+bitterness%2C+in+the+heat+of+my+spirit%2C+but+the+hand+of+the+Lord+was+strong+upon+me%2C%E2%80%99+Jer.+20%3A9%2C+%E2%80%98And+I+said%2C+I+will+not+make+mention+of+him%2C+nor+speak+any+more+in+his+name%2C+but+his+word+was+in+my+heart%2C+as+a+burning+fire+shut+up+in+my+bones%2C+and+I+was+weary+with+forbearing%2C+and+I+could+not+stay%2C%E2%80%99+2+Kings+3%3A15%2C+%E2%80%98The+hand+of+the+Lord+came+upon+Elisha%2C+and+he+prophesied.%E2%80%99+See+Jerome%2C+Oecumenius%2C+Gregory+and+Thomas.+The+prophetical+spirit+in+the+New+Testament+seems+to+be+more+swayed+with+free-will%2C+and+moral+threatnings%2C+1+Cor.+9%3A16%2C+%E2%80%98Woe+unto+me+if+I+preach+not+the+Gospel%3B+yet+the+habit+from+whence+he+preached+was+a+prophetical+principle%2C+Gal.+1%3A12%3B+1+Cor.+14%3A32.+3rd+Conclusion%3A+Hence+prophesying+is+not+a+habit+and+it+is+a+habit.+It+is+not+a+habit%3A+1.+Because+no+prophet+can+simply+prophecy+when+he+will%2C+except+the+man+Christ%2C+especially+of+things+to+come+by+contingent+causes+%28the+presence+of+which+things+%28says+Suarez%29+is+only+connatural+to+God%2C+and+to+no+moral+man%29+coming+on+men+by+a+transient+irradiation%2C+while+as+the+candle+of+God%E2%80%99s+prophetical+light+glances+upon+the+fancy%2C+and+from+thence+to+the+mind%2C+that+the+man+may+see+and+read+the+species+and+images%2C+and+when+this+light+shines+not+Nathan+and+Samuel+read+beside+the+Bible+and+are+widely+out.+Prophecy+also+is+a+habit+for%3A+1.+something+remains+in+Isaiah+and+Jeremiah+while+they+sleep+and+prophesy+not%2C+from+whence+they+are+named+prophets+and+really+are+prophets%3B+for+when+God+has+once+revealed+himself+to+one+as+to+his+own+prophet%2C+even+from+by-past+revelation%3A+1.+There+remains+a+disposition+to+prophecy%2C+1+Sam.+3%3A20%2C+All+Israel+knew%2C+even+from+Dan+to+Beersheba%2C+that+Samuel+was+established+to+be+a+prophet+of+the+Lord.+2.+Because+there+remains+a+prophetical+light%2C+whereby+the+man+gave+assent+to+the+last+prophetical+revelation%2C+and+so+the+species+and+prophetical+images+must+remain+in+the+fantasy%2C+and+with+these+a+prophetical+memory+of+by+past+predictions%2C+and+so+some+experimental+certainty%2C+that+what+he+foretells+shall+come+to+pass%3A+See+Thomas+and+Cajetan.+%E2%80%A6+4.+Conclusion%3A+Hence+Separatists+may+see+that+extraordinary+acts+of+prophecy+may+well+be+subjected+to+the+determination+of+the+Church%2C+and+yet+be+extraordinary+inspirations%2C+and+that+diverse+ways%3A+1.+Because+they+were+prophets+of+the+New+Testament%2C+and+so+grace+being+more+abundant+now+nor+under+the+Old+Testament%2C+it+can+bow+and+facilitate+free-will+to+acts+of+prophesying%2C+and+Paul+from+more+grace+labored+more+abundantly+than+they+all.+2.+Prophesying+at+that+time+in+Corinth+might+well+be+obtained+by+prayer+upon+the+extraordinary+impulsion+of+the+spirit%2C+as+Daniel+obtained+by+prayer+the+interpretation+of+a+dream%3B+neither+can+it+be+proved+from+1+Cor.+14+that+Paul+wills+them+all+without+exception+to+covet+to+speak+with+tongues+and+to+prophesy%2C+but+only+these+that+were+extraordinarily+moved+to+pray%2C+except+these+%5Bwords%5D+%28v.+31%2C+%E2%80%98ye+may+all+prophecy%E2%80%99%29+be+contrary+to+these+words+%281+Cor.+12%3A29%2C+%E2%80%98are+all+prophets%3F%E2%80%99%29+which+we+cannot+say.+3.+Because+it+was+of+old+in+the+power+of+prophets+to+use+some+means+to+dispose+themselves+to+prophecy%2C+for+when+the+passion+of+anger+overclouded+the+fancy+and+the+species+therein%2C+then+Elisha+calls+for+a+minstrel+to+play%2C+and+dispose+the+mind+better%2C+as+Cajetan+says%3A+Howbeit+for+all+that+the+text+says+the+hand+of+the+Lord+only+actuated+these+species+and+caused+him+to+prophesy.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Other+citations+%28work+not+named%29%2C+pp.+249-57+in+ch.+16+of+A+Peaceable+%26+Temperate+Plea%E2%80%A6+%28London%2C+1642%29%2C+pp.+249-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff557d905bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/f557d905bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-biblical-prophecy-as-including-expositing-the-scriptures/#:~:text=These%20prophets%20%5Bin%201%20Cor.%2014,species%20and%20caused%20him%20to%20prophesy&amp;text=These%20prophets%20%5Bin%201%20Cor.%2014%5D%20were%20prophets&amp;text=actuated%20these%20species%20and%20caused%20him%20to%20prophesy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e3ae0d6ec3" data-kw="">
<blockquote><p>Here are three opinions concerning these prophets mentioned by the apostle:

1. [that they were, and warrant, laymen preaching, as held by the Independent, Socinians and Arminians;]

2. That these prophets were Church officers, and no more but ordinary teachers or interpreters of Scripture in the Church: without excluding the sons of the prophets, or probationers from their assembly, and from exercising their gifts in preaching upon occasion, and fore-trial of their gifts, or of the growth and increase thereof, yet I remember no place in the New Testament where ordinary pastors are said to prophesy, except Rev. 11:3, where notwithstanding, prophesy is ascribed unto them in no other sense than the working of miracles, v. 6: ‘Those have power to shut heaven, that it rain not in the days of their prophesy, and have power over waters to turn them into blood, and to smite the earth with all plagues as often as they will.’ All which (prophesying and miracles) is spoken by way of allusion to Moses and Elijah.

3. That they were extraordinary prophets, immediately and extraordinarily inspired by the Holy Ghost; and that they are to be reckoned among these other administrations which were not to continue, or be ordinary in the Church: apostles, evangelists, workers of miracles. (Synopsis of Pure Theology, disp. 42, thesis 22; Martyr, Common Places, class. 4, ch. 1; Aretius, Theological Problems, place 62; Calvin, Institutes, bk. 4, ch. 3, §4; Diodati on 1 Cor. 14:1; the late English Annotations on 1 Cor. 12:28; Mr. [Paul] Bayne on Eph. 4:11, together with two learned countrymen of mine, Mr. David Dickson on 1 Cor. 14:31 and Mr. [Samuel] Rutherfurd on his Peaceable Plea, ch. 16) I know many Protestant writers of very good note, are of the second opinion. But with all due respect unto them, I hold the third opinion, with Gerhard [a Lutheran], Common Places, tome 6, p. 72, and diverse others.</p></blockquote>

al+Problems%2C+place+62%3B+Calvin%2C+Institutes%2C+bk.+4%2C+ch.+3%2C+%C2%A74%3B+Diodati+on+1+Cor.+14%3A1%3B+the+late+English+Annotations+on+1+Cor.+12%3A28%3B+Mr.+%5BPaul%5D+Bayne+on+Eph.+4%3A11%2C+together+with+two+learned+countrymen+of+mine%2C+Mr.+David+Dickson+on+1+Cor.+14%3A31+and+Mr.+%5BSamuel%5D+Rutherfurd+on+his+Peaceable+Plea%2C+ch.+16%29+I+know+many+Protestant+writers+of+very+good+note%2C+are+of+the+second+opinion.+But+with+all+due+respect+unto+them%2C+I+hold+the+third+opinion%2C+with+Gerhard+%5Ba+Lutheran%5D%2C+Common+Places%2C+tome+6%2C+p.+72%2C+and+diverse+others.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Treatise+of+Miscellany+Questions%2C+ch.+5%2C+%E2%80%9CWhether+these+prophets+and+prophesyings+in+the+primitive+Church%2C+1+Cor.+14+and+1+Cor.+12%3A28%3B+Eph.+4%3A11%2C+were+extraordinary%2C+and+so+not+to+continue%3A+Or+whether+they+are+precedents+for+the+preaching+or+prophesying+of+such+as+are+neither+ordained+ministers+nor+probationers+for+the+ministry%E2%80%9D+in+A+Treatise+of+Miscellany+Questions+%28Edinburgh%2C+1649%29%2C+pp.+64-85%2C+pp.+64-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe3ae0d6ec3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../../quote/e3ae0d6ec3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-biblical-prophecy-as-including-expositing-the-scriptures/#:~:text=Here%20are%20three%20opinions%20concerning%20these,6%2C%20p.%2072%2C%20and%20diverse%20others&amp;text=Here%20are%20three%20opinions%20concerning%20these%20prophets%20mentioned&amp;text=Places%2C%20tome%206%2C%20p.%2072%2C%20and%20diverse%20others" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There are but three senses of the word “prophesying,” which I can find anywhere else in the New Testament:

1. For such prophesying as is competent to all converted and gifted persons, when they are filled with a spirit of illumination and speak with other tongues as the Spirit gives them utterance: In which sense Joel foretold that daughters as well as sons, handmaids as well as men-servants, young and old should prophesy, Acts 2:17-18, which was accordingly fulfilled upon the day of Pentecost, for Acts 1:14 and 2:1, 4, this Spirit of prophesy was poured out upon all the disciples, men and women.

2. For such prophesying as is [materially] the preaching of ordinary ministers, although I know no text where without any controversy the word is used for the ordinary ministerial preaching; Yet I understand the word to be used in this sense (though by allusion only, whereof before), Rev. 11:3, ‘And I will give power unto my two witnesses and they shall prophesy a thousand two hundred and threescore days clothed in sackcloth.’

3. For extraordinary prophesying from immediate and miraculous inspiration, in which sense it is often used in the New Testament, as I shall show anone.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“There are but three senses of the word “prophesying,” which I can find anywhere else in the New Testament:

1. For such prophesying as is competent to all converted and gifted persons, when they are filled with a spirit of illumination and speak with other tongues as the Spirit gives them utterance: In which sense Joel foretold that daughters as well as sons, handmaids as well as men-servants, young and old should prophesy, Acts 2:17-18, which was accordingly fulfilled upon the day of Pentecost, for Acts 1:14 and 2:1, 4, this Spirit of prophesy was poured out upon all the disciples, men and women.

2. For such prophesying as is [materially] the preaching of ordinary ministers, although I know no text where without any controversy the word is used for the ordinary ministerial preaching; Yet I understand the word to be used in this sense (though by allusion only, whereof before), Rev. 11:3, ‘And I will give power unto my two witnesses and they shall prophesy a thousand two hundred and threescore days clothed in sackcloth.’

3. For extraordinary prophesying from immediate and miraculous inspiration, in which sense it is often used in the New Testament, as I shall show anone.”

<blockquote><p>8. All prophets are either ordinary or extraordinary, as is clear in God’s Word; extraordinary now are not in the Church, and the ordinary prophets now are not gifted to preach the Word, except as Timothy, from their youth they have been trained up in the Scriptures and have learning, sciences, knowledge of the tongues, if he would be a man able to teach others, 2 Tim. 2:3; 1 Tim. 3, he must meditate, read, and give himself wholly to these things, 1 Tim. 3:15-16, and so must leave his calling contrary to the apostle his commandment, 1 Cor. 7:20-22; 1 Thess. 4:11; Eph. 4:28, but if he have a gift for public preaching, he is to separate himself for it, seeing a gift is a token of Gods separation.</p></blockquote>

<blockquote><p>Objection 3. The apostle says, 1 Cor. 14:26, ‘When ye come together every one of you hath a psalm, hath a doctrine, hath a tongue, hath a revelation, hath an interpretation,’ v. 31, ‘ye may all prophesy one by one.’ Therefore all that preach or prophesy need not to be ordained. Answer: What those prophets were, and what is meant by prophesying there, all are not of one opinion. I hold that these prophets were immediately and extraordinarily inspired, and I reckon them among these other administrations, which were not ordinary, or ever to continue in the Church: apostles, evangelists, workers of miracles. But of this I am to speak distinctly, and by itself afterwards [in ch. 5]. Meanwhile, they that make the objection must prove two things, else they conclude nothing against the necessity of ordination:

1. That these prophets were not sent and ordained, but that their gifts and parts, gave them a sufficient calling to interpret in the Church.

2. That although they had no ministerial sending or vocation, yet they were not extraordinary prophets, but that such prophets are to continue ordinarily in the Church. I believe it will trouble them to prove either.</p></blockquote>

<blockquote><p>II. Moral actions of God, whose efficiency is metaphorical and are by way of object, by which He objectively moves and intelligibly instructs the elect (namely, adults or those using reason), by setting forth and offering the goods acquired, adjudicated, and assigned by Christ the Redeemer, and thus inviting to the acceptance of them, which happens through the contracting of the covenant. And such a moral action is of one single species, called Calling—calling, I say, to the contracting of the covenant of grace: so that I may distinguish it from the Calling which demands the performance of the law and summons all men to the obedience due to God from the right which He has over rational creatures. Which we also concede is directed to all the reprobate; but we deny that it can properly be called salvific, or a calling to salvation.

III. Real actions operating really or physically (as the more recent speak), and producing a real and inhering change in the subject, are those by which God makes the elect participants of real possession of goods and inhering gifts. And they are: Regeneration; Beatification in the state of grace; Beatification of the soul after this life; Resurrection to glory; Final glorification. Of these, the three latter pertain to the future life; the two former to the present life.</p></blockquote>

<blockquote><p>Question. How many sorts of callings or calls are there? Answer. There is a double call, viz. particular [to an office] and general [to salvation]: … Secondly, there is a general call unto salvation, which is twofold, to wit, ineffectual and effectual: First, there is an effectual calling, which is twofold, to wit, a calling whereby God calls all men, and a call whereby He calls the outward Church: First, there is an effectual call whereby God calls all men, and this is twofold, to wit: First, the Word of God, which is said to call all, and that both because it speaks unto all without difference; ‘Come all,’ etc. Mk. 11:24 &amp; Acts 17:30 &amp; 10:35, and also because the sound thereof goes into all the world, or unto the utmost parts of the world. Rom. 10:17; Ps. 19:4: The book of the creatures for the invisible things of God are seen in the creation, Rom. 1:20, and there are some marks and impressions or prints of God in every creature: Secondly, there is an effectual call, whereby God calls the eternal Church, to wit, the whole Church professing the Gospel outwardly, whether they be Papists, Arians, Heretics, Anabaptists or Protestants: Whence we may learn that all in the outward Church are called, and therefore many are called; this is clear from this verse: and chap. 20:16; Lk. 14:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canterbury’s Doom</cite>, ... (London: Macock, 1646), 73. ‘Passages razed out concerning our effectual vocation’, pp. 343-44</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Question. How many sorts of callings or calls are there? Answer. There is a double call, viz. particular [to an office] and general [to salvation]: … Secondly, there is a general call unto salvation, which is twofold, to wit, ineffectual and effectual: First, there is an effectual calling, which is twofold, to wit, a calling whereby God calls all men, and a call whereby He calls the outward Church: First, there is an effectual call whereby God calls all men, and this is twofold, to wit: First, the Word of God, which is said to call all, and that both because it speaks unto all without difference; ‘Come all,’ etc. Mk. 11:24 &amp; Acts 17:30 &amp; 10:35, and also because the sound thereof goes into all the world, or unto the utmost parts of the world. Rom. 10:17; Ps. 19:4: The book of the creatures for the invisible things of God are seen in the creation, Rom. 1:20, and there are some marks and impressions or prints of God in every creature: Secondly, there is an effectual call, whereby God calls the eternal Church, to wit, the whole Church professing the Gospel outwardly, whether they be Papists, Arians, Heretics, Anabaptists or Protestants: Whence we may learn that all in the outward Church are called, and therefore many are called; this is clear from this verse: and chap. 20:16; Lk. 14:16.”

<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold:

1. Common; when men are brought but to outward profession and common gifts; and so the word is used often.

2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>

<blockquote><p>Then he [Satan] begins his strongest batteries, or main temptations, when we are first entering into a renewed state: Now this is most usual in the days of our youth. Thus many of our worthies observe, Mr. [Thomas] Ford, speaking of young people, faith, Amongst the usually the stream of converting grace most runs. It may be in some grace is wrought very early, even in childhood, but ordinarily ’tis after they come under catechising, and are more adult. And Mr. Burges thus, Conversion does not only belong to the old, but to the young; yea, commonly conversion is sooner wrought upon the younger sort of people; for they have not resisted the grace of God so much, they have not provoked God to give them up to their own heart’s lusts, and desires, as many ages persons have; so then let young ones hearken to sermons, let them attend to what the ministers of God exhort. Remember thy Creator in the days of thy youth; and it is good to bear the yoke in they youth; it is good to feel the bitterness of sin betimes, Eccl. 12:1; Lam. 3:27. And Vortier thus, The Lord can convert and bring home to himself at all times, in middle age, in old age, at the very last, as the thief upon the cross; yet the time of effectual calling is more ordinary in the time of youth. Some have observed the time of effectual calling to be between the years of eighteen and thirty, most commonly. And I believe that most saints experience, that the Lord wrought upon them in their younger days. Marriages are most in younger times, so are spiritual contracts in Jesus Christ. David was good when young, Daniel a young prophet; Timothy a young preacher, Samuel began with God betimes, Abijah good when a child, so was Josiah. Hammers thus, Those who in their infancy were considered as parts of their parents, and so by virtue of their parents’ membership enjoyed the ordinance of baptism; when once grown up to maturity and ripeness of years, they are to be looked upon and considered in themselves, and no longer as in their parents, and therefore as being in a capacity so to do, they ought now to take hold of the covenant for themselves, and to render a personal account of their faith. It pleases God, that many do so even very early; which agrees with the former opinion, that some are regenerated after they come under catechizing. It was the use of the Jews, as Mr. Buxtorf reports, that so soon as their circumcised children were able to speak, they taught them some select places of Scripture, and so proceeding on by degrees at thirteen years of age, they were called filii praecepti, sons of the precept; and then they were to receive the passover, as says Mr. Weem, and to observe the 613 precepts, which comprehended in them the sum of the Mosaical law, and Jewish religion, and then they themselves were accounted guilty and liable to punishment, both divine and human, if they did transgress the law, whereas before their faults were imputed to their fathers, of whom the punishment was exacted… I hope, I may say of Gentiles as well as Jews, that conversion is sometimes very early, even as early as at thirteen years of age, though it be not ordinary. And oh! how good is it for a man to bear the yoke in his youth, seeing it must be born at one time or other? The burden of sin at that age will be the lighter, the flowing of heavenly affections will be the sweeter, the removal of sin, in all likehood will be sooner, at least the surer; God having engaged Himself that ‘they that seek Him early shall find Him,’ Prov. 8:17. Satan knows all this very well, and therefore he sets a stricter watch on youth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>War with Devils</cite>, … (d. 1663), pp. 52-54</span></figcaption>

<blockquote><p>The reason why it is believed, that regeneration does not usually accompany baptism, is simply because no evidences of spiritual life appear in baptized children more than in those which remain unbaptized. The education of children should proceed on the principle that they are in an unregenerate state, until evidences of piety clearly appear, in which case, they should be sedulously cherished and nurtured. These are Christ’s lambs — ” little ones, who believe in Him” whom none should offend or mislead upon the peril of a terrible punishment. But though the religious education of children should proceed on the ground that they are destitute of grace, it ought ever to be used as a means of grace. Every lesson, therefore, should be accompanied with the lifting up of the heart of the instructer to God for a blessing on the means. “Sanctify them through thy truth; thy word is truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), pp. 26-27</span></figcaption>

</figure><figure class="quote" id="q-7bcd709954" data-kw="">
<blockquote><p>The end of [external] calling can be considered in two ways: either on the part of God or on the part of the thing (which is called the end of the worker [finis operantis] and the end of the work [finis operis]). Although each is conjoined in the elect, yet in others they are separated… in the gospel call, the end of the thing is the salvation of man because by its nature it tends to the bringing of him to salvation by faith and repentance; but not at once with respect to all the called is it the end of God, but only of those to whom he decreed to give faith and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, p. 504</span></figcaption>

<blockquote><p>29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter.

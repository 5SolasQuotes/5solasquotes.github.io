— Thomas Manton, A Practical Exposition upon the Fifty-Third Chapter of Isaiah, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 442-43.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist+was+said+to+be+God%E2%80%99s+servant%2C+partly+as+he+subjected+himself+to+the+condition+of+man%2C+and+because+he+lived+among+men+in+a+needy%2C+servile%2C+and+abject+state+of+life%2C+not+like+a+prince%2C+but+a+servant%2C+which+is+the+lowest+form+of+rational+creatures.+And+it+is+expressed+by+%E2%80%98taking+the+form+of+a+servant%E2%80%99+upon+him%2C+Phil.+2%3A7.+Angels+are+called+sons%2C+and+man+a+servant%3B+%E2%80%98The+sons+of+God+shouted+for+joy%2C%E2%80%99+Job+38%3A7.+In+the+family+of+heaven+they+were+to+God+as+servants.%0A%0AAnd+partly+as+he+was+a+choice+instrument+for+the+executing+of+God%E2%80%99s+decrees.+Those+that+are+taken+into+any+degree+of+subserviency+to+God%E2%80%99s+counsels+have+this+badge+of+honour+put+upon+them%2C+to+be+God%E2%80%99s+servants%2C+as+Nebuchadnezzar+is+called+God%E2%80%99s+servant%2C+Jer.+27%3A6.+Now%2C+because+Christ+submitted+himself+to+the+office+of+the+mediatorship%2C+and+so+to+a+subserviency+to+God%E2%80%99s+decrees%2C+he+is+called+a+servant%3A+Isa.+13%3A1%2C+%E2%80%98Behold+my+servant%2C+whom+I+uphold%3B%E2%80%99+Isa.+49%3A3%2C+%E2%80%98Thou+art+my+servant.%E2%80%99%0A%0AAnd+this+being+an+instrument+of+God%E2%80%99s+decrees%2C+is+called+service%2C+because+whosoever+is+employed+in+it+is+to+sequester+himself+for+the+uses+of+God%2C+and+to+divest+himself+of+all+self-respect%2C+and+like+a+servant+to+be+at+the+command+of+another%2C+and+wholly+to+give+up+himself+to+the+profit+and+benefit+of+his+Master.+So+Christ%2C+not+aiming+at+himself%2C+accomplished+the+work+of+God+to+God%E2%80%99s+glory+and+the+salvation+of+man.+And%E2%80%94%0A%0APartly+as+he+subjected+himself+to+the+law+of+God+and+the+covenant+of+works%2C+which+was+a+covenant+of+servants.+A+servant+expects+his+ </figure><figure class="quote" id="q-7cce232702" data-kw="">
<blockquote><p>FIRST, I would consider Christ’s coming into the world, or his taking upon him our nature to put himself in a capacity to purchase redemption for us.—Christ became incarnate, or, which is the same thing, became man, to put himself in a capacity for working out our redemption: for though Christ, as God, was infinitely sufficient for the work, yet to his being in an immediate capacity for it, it was needful that he should not only be God but man.

If Christ had remained only in the divine nature, he would not have been in a capacity to have purchased our salvation; not from any imperfection of the divine nature, but by reason of its absolute and infinite perfection: for Christ, merely as God, was not capable either of that obedience or suffering that was needful. The divine nature is not capable of suffering: for it is infinitely above all suffering. Neither is it capable of obedience to that law that was given to man. It is as impossible that one who is only God, should obey the law that was given to man, as it is that he should suffer man’s punishment.</p></blockquote>

it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-07ba09b1c6" data-kw="">
<blockquote><p>The person spoken unto [in Psalm 110:1] is the Son, אָדוֹן, “the Lord,” David’s Lord; in what respect we must now inquire. The Lord Christ, the Son, in respect of his divine nature, is of the same essence, power, and glory, with the Father, John x. 30. Absolutely, therefore, and naturally, in that respect he is capable of no subordination to the Father or exaltation by him, but what depends on and flows from his eternal generation, John v. 26.

By dispensation he humbled himself, and emptied himself of this glory, Phil. ii. 7, 8; not by a real parting with it, but by the assumption of human nature into personal union with himself, being made flesh, John i. 14; wherein his eternal glory was clouded for a season, John xvii. 5, and his person humbled to the discharge of those acts of his mediation which were to be performed in the human nature, Phil. ii. 9, 10.

This person of Christ is here spoken unto, not in respect of his divine nature only, which is not capable of exaltation or glory by the way of free gift or donation; nor in respect of his human nature only, which is not the king and head of the church; but with respect unto his whole person, wherein the divine nature, exerting its power and glory with the will and understanding of the human nature, is the principle of those theandrical acts whereby Christ ruleth over all in the kingdom given him of his Father, Rev. i. 17, 18.

As he was God, he was David’s Lord, but not his son; as he was man, he was David’s son, and so absolutely could not be his Lord; in his person, as he was God and man, he was his Lord and his son, — which is the intention of our Saviour’s question, Matt. xxii. 45.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. William H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 3: 224-25.</span></figcaption>

</figure><figure class="quote" id="q-207481f994" data-kw="">
<blockquote><p>Furthermore he sub-joins to the following admonition a maxim concerning order divinely stablished in the mystical body of the Church, viz. that Christ is nearest subordinate to God, as he is God-man, the Mediator and the Head of the Church, and that the man next succeeds in dignity unto Christ, and the woman to the man, which so far as it appertains to the honour of the sex, she is made subordinate to the man as Head; whereupon they may understand that order in Church-Assemblies is to be observed.</p></blockquote>

</figure><figure class="quote" id="q-92e3e5dc3d" data-kw="">
<blockquote><p>Mr Alexander McLeod was ordained in the meeting house at Coldenham on the 6th July 1801 to take Charge of the united congregation of New York and Walkill as their fixed Pastor. The scattered state of the Church and other circumstances required his immediate absence, and it was not until the 25 September that he delivered his Introductory Discourse to the Church on each side of Walkill.

Again the organization of the Church session was detained by providential occurrences. There were but two elders and the absence of one on Mr McLeod’s return from New York rendered it impossible to constitute a Session until the 14th day of November, on the evening of that the elders and the minister met and agreed to Constitute the session.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/minutes-of-coldenham-reformed-presbyterian-church-session.html">Minutes of Coldenham Reformed Presbyterian Church Session</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of Coldenham Reformed Presbyterian Church Session</cite>, 6 July 1801 (Reformed Presbyterian Theological Seminary Library, Pittsburgh).</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Mr Alexander McLeod was ordained in the meeting house at Coldenham on the 6th July 1801 to take Charge of the united congregation of New York and Walkill as their fixed Pastor. The scattered state of the Church and other circumstances required his immediate absence, and it was not until the 25 September that he delivered his Introductory Discourse to the Church on each side of Walkill.

Again the organization of the Church session was detained by providential occurrences. There were but two elders and the absence of one on Mr McLeod’s return from New York rendered it impossible to constitute a Session until the 14th day of November, on the evening of that the elders and the minister met and agreed to Constitute the session.”

</figure><figure class="quote" id="q-a054699443" data-kw="">
<blockquote><p>Although the editor of this blog is not opposed to home-schooling (indeed, it is often the only way for parents in our current circumstances to ensure their children get a Christian education), we reject the extremist notion that it is the only scriptural (or even the best) way to educate children. Our Reformed forebears did not believe this to be the case; you will even notice that Samuel Rutherford applies a favourite home-schooling “proof-text” to those who teach children in schools. This, moreover, also demonstrates that the Covenanters did not believe in Kuyperian notions of sphere-sovereignty. Since magistrates and school-teachers are also “fathers”, texts like Ephesians 6:4 could also be applied to them and not just to literal fathers. Hence they rejected the idea that education belonged to the “sphere” of the nuclear family alone :

There are with us Doctors of Divinity who teach in Schools and Universities, men tried to be holy and learned, and then put in office, as 1 Tim. 3. 10. under whose instruction are students aiming at the holy ministry called expectants, as in the Jewish Church in their Colleges, were young Prophets, or sons of the Prophets, as 1 Sam. 10. 5. 2 Kin. 4. 1. 1 King. 20. 35. These Doctors and also the teachers of human literature, who train up children in the nurture and admonition of the Lord, Pro. 22. 6. Ephes. 6.4. if they aim at the Ministry, prophesy in our presbyterial meetings, 1 Cor. 14.29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A peaceable and temperate plea for Paul’s Presbytery in</cite>, Scotland (London, 1642), p. 319.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>Her ministry should be learned and pious. Without the former, they will only betray, through ignorance, their cause into the hands of the enemy; without the latter, they will pollute the sacred sanctuary.

Consider, for a moment, what a ridiculous figure the ambassador sent to negotiate with a foreign nation would make, who could not read his master’s commission. Would such an one be qualified to be an ambassador to an earthly potentate? Is not the negotiation of the King of kings much more important than the adjustment of the differences between states and empires?

When Christ called his ministers in an extraordinary manner, he gave them extraordinary qualifications: and among these we find the gift of tongues. In 1 Tim. 1:7, those are severely reprehended, who presume to enter on an office without due qualifications: “desiring to be teachers of the law, yet understanding neither what they say, nor whereof they affirm.” Such are the clouds of illiterate, methodistic locusts which darken the horizon of these States. Without abilities, natural or acquired, they pour forth like torrents, over the face of the earth, and lead aside the simple and unwary. The infuriated zeal with which they propagate their poisonous doctrines, resembles much the character of the Scribes and Pharisees, mentioned, Matt. 23:15: “Who compass sea and land to make one proselyte, and when he is made, he is rendered twofold more the child of hell than themselves.”

Without a due measure of learning, how can they meet the cavillings of deists and crafty impostors, and so act the part of an evangelist, required, Tit. 1:9, namely, to be able to convince the gainsayers, and put adversaries to silence?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 30-1.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-23a2ba3197" data-kw="">
<blockquote><p>It must not be omitted that princes are not only referred to in holy writings as deacons or ministers of God, but also as pastors. Ezekiel complained heavily of this, for these pastors cruelly and perversely fed the people [Ezekiel 34]. Homer called his king Agamemno, “shepherd of the people”. These pastors should not behave like soldiers or mercenaries, oppressing and skinning the people, but they should serve as shepherds. Princes are called fathers, for the Romans called their senators patres conscripti, “enlisted fathers.” Nor was there a greater or more ancient honour in the Commonwealth than to be called pater patriae, “father of the homeland.” Therefore, the divine commandment “Honour your father and your mother” must also apply to princes, who should give paternal adoration in return [Exodus 20:12]. Princes should never forget that they do not rule over beasts but over men, and that they themselves are also men. They should therefore be much better and superior to those men whom they rule. Otherwise, they are not fit to rule. We do not give any sheep command over the other sheep. It is given to a ram, and then to a shepherd above him. Just as a shepherd rules the sheep, so is a magistrate commissioned to rule his people. Therefore, magistrates should surpass their people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of a magistrate, and the difference between civil and ecclesiastical power (1561) in W. J. T. Kirby (ed.), The Zürich connection and Tudor political theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

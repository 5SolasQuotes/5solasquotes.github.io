<figure class="quote" id="q-4fad973513" data-kw="Traditions">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 6, ch. 16</span></figcaption>

</figure><figure class="quote" id="q-1ae5a421f4" data-kw="Rule of faith">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 6, ch. 16</span></figcaption>

</figure><figure class="quote" id="q-0ee2106606" data-kw="Vincent of Lerins">
<blockquote><p>Vincentius Lirinensis, an ancient author in whose book the papists have great confidence, speaks thus: c. 41, “The canon of scripture alone is self-sufficient for all.” Still more plainly, c. 2: “The canon of scripture alone is sufficient, and more than sufficient for all things.” I do not see how he could have spoken more plainly: he says that the canon of scripture is sufficient, and more than sufficient; sufficient for all things, and sufficient alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 6, ch. 17</span></figcaption>

<blockquote><p>Augustine, De Natura et Gratia, c. 91, writes thus: “I owe an absolute assent only to the canonical scriptures.” What value, may I ask, did this father set upon traditions, when he declared that he owed an absolute assent to nothing but the canonical scriptures?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 6, ch. 17</span></figcaption>

— William Whitaker, A Disputation on Holy Scripture, Question 6, ch. 14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CScripture+is+not+only+one+of+those+means+which+relate+to+salvation%2C+but+the+entire+and+sole+medium%2C+the+perfect+and+complete+medium%2C+because+it+produces+a+perfect+faith.+For+that+faith+which+brings+salvation+is+perfect%3B+and+consequently+the+medium+whereby+that+faith+is+produced+is+also+perfect.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Disputation+on+Holy+Scripture%2C+Question+6%2C+ch.+14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4385f208ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4385f208ce.html">Permalink</a><a class="src" href="https://archive.org/details/disputationonhol00whituoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-25d85261d2" data-kw="Infallible rule">
<blockquote><p>Although infallibility is not given by God to the church, it cannot on this account be said that God was wanting in things necessary to her, because it is not necessary to have a supreme and infallible tribunal among men upon whose decrees and responses our faith should be suspended, since it is sufficient for her to have an infallible rule of faith and practice in the Scriptures, which as long as she observes, she will not wander from the right track.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.32</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../../topics/the-church/infallibility-of-the-church/the-church-can-err.html">The church can err</a></span><span class="t"><a href="../../topics/rome/the-church.html">Rome: The Church</a> › <a href="../../topics/rome/the-church/infallibility.html">Infallibility</a></span><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

<blockquote><p>When the fathers bring forward succession in disputing against heretics, they do not mean so much a personal or local as a doctrinal succession. They even always connect and suppose a doctrinal succession.</p></blockquote>

</figure><figure class="quote" id="q-a2863a5000" data-kw="Judge of controversies">
<blockquote><p>It is not necessary that there should be in the church any external infallible judge by whom controversies of faith may be solved. It suffices for believers, for the tranquility and rest of their consciences, that there is an interior or divine definitive judgment (namely, of Christ and the Holy Spirit speaking in the Scriptures). An external human judgment, infallible and definitive in the church, is neither necessary nor possible. Controversies do not belong to external order but to the mental judgment for which a judge is necessary to enlighten the mind and sanctify the will (which an external and human judge cannot do because he has no power over the conscience).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.23</span></figcaption>

</figure><figure class="quote" id="q-2455adbaa0" data-kw="Apocrypha">

<blockquote><p>We receive and embrace all the canonical Scriptures, both of the Old and New Testament, giving thanks to our God, who hath raised up unto us that light which we might ever have before our eyes, lest either by the subtlety of man, or by the snares of the devil, we should be carried away to errors and lies. Also that these be the heavenly voices, whereby God hath opened unto us His will: and that only in them man&#x27;s heart can have settled rest; that in them be abundantly and fully comprehended all things, whatsoever be needful for our salvation, as Origen, Augustine, Chrysostom, and Cyrillus have taught: that they be the very might and strength of God to attain to salvation: that they be the foundations of the Prophets and Apostles, whereupon is built the Church of God: that they be the very sure and infallible rule, whereby may be tried, whether the Church do stagger, or err, and whereunto all ecclesiastical doctrine ought to be called to account: and that against these Scriptures neither law, nor ordinance, nor any custom ought to be heard: no, though Paul his own self, or an angel from heaven, should come and teach the contrary.</p></blockquote>

</figure><figure class="quote" id="q-51d6b04ae1" data-kw="">
<blockquote><p>The fact is, that the doctrine of Development has to encounter a great historical difficulty, which it can only remove by an enormous assumption. The doctrine is, that Christ&#x27;s original revelation contained seeds and germs of truths destined, under the Divine guidance, to expand to a certain definite form. If this be true, that expansion would take place wherever these germs were planted. It does not depend on where a tree is planted, whether it springs up a cedar or a bramble-bush, or whether it brings forth figs or grapes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture II</span></figcaption>

</figure><figure class="quote" id="q-66d40d7be9" data-kw="">
<blockquote><p>The Council of Trent having stamped the Vulgate as ‘authentic,’ ordered that a correct edition of this authorized Vulgate should be published. But little was done in fulfilment of this decree for nearly forty years, when the task was undertaken by Pope Sixtus V., a Pontiff who seems really to have believed in his own infallibility. He employed a Board of learned men to act as revisers, but in complete subordination to himself. In his preface he claims the superiority to them which he exercised, as resulting from the singular privilege which he enjoyed as successor to Peter, the Prince of the Apostles, for whom Christ prayed that his faith should not fail, and who was charged to confirm the other Apostles in the faith. … But a glance at the volume was sufficient to convince any moderately learned man of the folly, not to say impiety, of such boastful presumption. Many passages were found covered with slips of paper on which new corrections had been printed; others were scratched out and merely corrected with a pen; and different copies were corrected in different ways. A closer examination showed those competent to judge that the edition had graver faults than could be accounted for by printers’ carelessness. Sixtus had changed the readings of those whom he had employed to report upon the text with the most arbitrary and unskilful hand; and it was scarcely an exaggeration to say with Bellarmine that his precipitate self-reliance had brought the Church into the most serious peril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XIV</span></figcaption>

<blockquote><p>Truly, this must not be tolerated in the church, that in place of the things which the Holy Spirit wrote in the Hebrew and Greek sources something should be foisted onto us as authentic which has been badly rendered by the translator or altered or mutilated and added by copyists, and that in such a way that one may not reject them even after he has examined the sources.</p></blockquote>

</figure><figure class="quote" id="q-0018e6f6fd" data-kw="">

</figure><figure class="quote" id="q-56392f2102" data-kw="">
<blockquote><p>The question therefore comes to this: does Scripture contain perfectly, not absolutely everything, but whatever is necessary for salvation, not explicitly and in exact words, but with equal force [to explicit statement] or by valid conclusion (aequipollenter vel per legitimam consequentiam), so that there is no need to resort to any unwritten word; or, is Scripture a full and sufficient rule of faith and conduct, not merely a partial and inadequate one? We uphold the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.9</span></figcaption>

</figure><figure class="quote" id="q-0ca44fe101" data-kw="">
<blockquote><p>Paul says that all Scripture is inspired by God (πᾶσαν γραφὴν esse θεόπνευστον), and useful for teaching, reproof, correction, and training in righteousness, that the man of God may be complete, equipped for every good work (II Tim. 3:16–17). Here lie a number of arguments for the perfection of Scripture. First that the sacred writings can instruct for salvation (v. 15). Who would ask for more than that we be made capable of salvation? Second, it is useful for all purposes, theoretical and practical: for teaching faith, and for guiding conduct. Third, it can make the man of God complete for every good work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.13</span></figcaption>

</figure><figure class="quote" id="q-7761f3b35c" data-kw="">
<blockquote><p>Our SECOND REASON is this: The scriptures were delivered to us that we might possess a rule of faith. Consequently, the scripture is sufficient, and therefore the scripture is perfect. For if it be a rule, it is a perfect rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question VI, on the perfection of Scripture</span></figcaption>

</figure><figure class="quote" id="q-51306cb5aa" data-kw="">
<blockquote><p>John affirms that that part of the doctrine of Christ which is necessary and sufficient for true faith and salvation has been written. Therefore it is clear that though not everything … was written, nevertheless, whatever of the doctrine and miracles of Christ is necessary and sufficient for true faith and eternal life has been written.</p></blockquote>

</figure><figure class="quote" id="q-4a2d1718e9" data-kw="">
<blockquote><p>Therefore we ought gratefully and reverently to embrace and kiss this blessing of the Holy Spirit, that He condescended to our infirmity and did not want to burden it too much but selected and assigned for writing that of the doctrine and miracles of Christ which He judged to be sufficient and necessary for true faith and eternal life.</p></blockquote>

</figure><figure class="quote" id="q-13f1dfa0bc" data-kw="">
<blockquote><p>Is Scripture so understandable in matters necessary for salvation that it can be read by a believer without external unwritten traditions or the help of the authority of the church? Affirmative, against the Roman Catholics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Is Scripture so understandable in matters necessary for salvation that it can be read by a believer without external unwritten traditions or the help of the authority of the church? Affirmative, against the Roman Catholics.”

</figure><figure class="quote" id="q-792fccf965" data-kw="">
<blockquote><p>The question therefore comes to this: is Scripture so understandable in matters necessary for salvation, not with regard to what is taught but with regard to the manner of teaching, not with regard to the subject [persons], but to the object [Scripture itself], that it can be read and understood for salvation (salutariter) by believers without the help of external traditions? The Roman Catholics deny this; we affirm it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The question therefore comes to this: is Scripture so understandable in matters necessary for salvation, not with regard to what is taught but with regard to the manner of teaching, not with regard to the subject [persons], but to the object [Scripture itself], that it can be read and understood for salvation (salutariter) by believers without the help of external traditions? The Roman Catholics deny this; we affirm it.”

</figure><figure class="quote" id="q-22d2555627" data-kw="">
<blockquote><p>The question is whether [these necessary matters] are presented somewhere in such a manner that a believer can recognize their truth when he has given them serious consideration, because nothing is learned from the more obscure passages that is not found most plainly taught elsewhere. As Augustine says, &quot;The Holy Spirit has arranged the Scriptures in such a wonderful and wholesome manner, that hunger is remedied by the plainer passages and pride by the more obscure&quot; (Concerning Christian Doctrine 2.6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.5</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

</figure><figure class="quote" id="q-9d4abd4aee" data-kw="">
<blockquote><p>That Scripture has this perspicuity is plain (1) from Scripture itself, which proclaims its lucidity. &quot;The testimony of Jehovah is sure, enlightening the eyes&quot; (Ps. 19:8). &quot;Thy words are a lamp to my feet&quot; (Ps. 119:105). &quot;A light shining in the darkness&quot; (II Peter 1:19). &quot;The law is a lamp&quot; (Prov. 6:23). … For Scripture is called &quot;clear&quot; (lucidus) not only because it throws light upon the matters that are understood, but also because it is clear in itself and has been made suitable for throwing light on these matters, if used by people with the eyes of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.8</span></figcaption>

</figure><figure class="quote" id="q-42768689de" data-kw="">
<blockquote><p>Also the will of God is revealed in that manner in the Scriptures, that although, the things themselves are for the most part hard to be conceived, yet the manner of delivering and explaining them, especially in those things which are necessary, is clear and perspicuous. Hence the Scriptures need not especially in necessaries, any such explication whereby light may be brought to it from something else: but they give light to themselves, which is diligently to be drawn out by men, and to be communicated to others according to their calling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity</cite>, Book I, ch. XXXIV, theses 20–21</span></figcaption>

<blockquote><p>Secondly, The Holy Spirit hath so disposed of the Scripture that the mind of God in all things concerning our faith and obedience, which are of necessity for us to know, might be clearly and distinctly understood. … [1.] In that whatever is necessary for us to believe concerning these things is plainly and clearly revealed in the Scripture, and that in sundry places.</p></blockquote>

<blockquote><p>Scripture exhibits fully as clear evidence of its own truth as white and black things do of their color, or sweet and bitter things do of their taste.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.2</span></figcaption>

</figure><figure class="quote" id="q-721cb5dffe" data-kw="">
<blockquote><p>We believe that Holy Scripture has one true and authentic meaning, but this meaning can be twofold, either simple or composite. … That there is a single meaning to Scripture is evident (1) from the unity of truth, because truth is single (unicus) and simple (simplex), and for that reason does not admit of several meanings, which would make it uncertain and ambiguous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.19.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We believe that Holy Scripture has one true and authentic meaning, but this meaning can be twofold, either simple or composite. … That there is a single meaning to Scripture is evident (1) from the unity of truth, because truth is single (unicus) and simple (simplex), and for that reason does not admit of several meanings, which would make it uncertain and ambiguous.”

<blockquote><p>Our fourteenth argument is as follows: If the scriptures do not interpret themselves or judge controversies, this is because they are either obscure or imperfect. But they are neither obscure nor imperfect, as we have already proved. Therefore they both interpret themselves and judge controversies.</p></blockquote>

</figure><figure class="quote" id="q-0710eea5db" data-kw="">
<blockquote><p>It is not a question whether divine and apostolic traditions, that is, all teachings which were handed down by Christ or the apostles, are to be accepted; everyone readily grants this. The question is whether any such traditions are given except in Scripture. Therefore, until our adversaries can show by an unquestionable proof that their unwritten traditions truly rest on Christ and the apostles, which will never be done, we shall reject them as human work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.8</span></figcaption>

</figure><figure class="quote" id="q-701fcad58c" data-kw="">
<blockquote><p>Therefore, though we grant that the Apostles of the Lord handed down to posterity some customs which they never committed to writing; still, first, this has nothing to do with the doctrine of faith, (as to it we cannot extract one iota from them,) but only with external rites subservient to decency or discipline; and secondly, it is still necessary for them to prove that everything to which they give the name is truly an apostolical tradition. … We especially repudiate their desire to make certainty of doctrine depend not less on what they call agrafa, (unwritten,) than on the Scriptures. We must ever adhere to Augustine&#x27;s rule, &quot;Faith is conceived from the Scriptures.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session IV</span></figcaption>

<blockquote><p>There are four heads: First, they ordain that in doctrine we are not to stand on Scripture alone, but also on things handed down by tradition. … These four things being established, who can deny that the war is ended? … for whatever they produce, if supported by no authority of Scripture, will be classed among traditions, which they insist should have the same authority as the Law and the Prophets. What, then, will it be permitted to disapprove? for there is no gross old wife&#x27;s dream which this pretext will not enable them to defend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session IV</span></figcaption>

<blockquote><p>Sundry other branches there are of the abominations of these men … which may be reduced to these three corrupt and bloody fountains: — 1. That the Scripture at best, as given out from God, and as it is to us continued, was and is but a partial revelation of the will of God, the other part of it … being reserved in their magazine of traditions. 2. That the Scripture is not able to evince or manifest itself to be the Word of God … without an accession of testimony from that combination of politic, worldly-minded men that call themselves the Church of Rome.</p></blockquote>

</figure><figure class="quote" id="q-8141366f7a" data-kw="">
<blockquote><p>Likewise we reject human traditions, even if they be adorned with high-sounding titles, as though they were divine and apostolical, delivered to the Church by the living voice of the apostles, and, as it were, through the hands of apostolical men to succeeding bishops which, when compared with the Scriptures, disagree with them; and by their disagreement show that they are not Apostolic at all. … it would be wicked to assert that the apostles by a living voice delivered anything contrary to their writings.</p></blockquote>

</figure><figure class="quote" id="q-76a5437c2b" data-kw="">
<blockquote><p>We do not deny that there can be in the church a ministerial and secondary judge, who can officially moderate controversies over the faith by the Word of God, but we hold that the Holy Spirit, as its source, teaches us the true interpretation of Scripture where inner assurance is concerned. We deny that any supreme and infallible judge except Scripture need be sought with regard to external proof of the object, much less that the pope, who assumes such a task, is to be accepted. We believe that Scripture alone, or God speaking in it, is enough.</p></blockquote>

</figure><figure class="quote" id="q-063d7aca10" data-kw="">
<blockquote><p>A supreme and infallible judge is indeed one who is never wrong in his decisions, and cannot err, who is not influenced by any interested party, and from whom there can be no appeal. But all these qualities can be attributed neither to the church nor to the councils nor to the pope, for they both can err and often have done so most grievously. … Only God speaking in Scripture lays claim to all these qualities in his own person, for he cannot fall into error, since he is truth itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.10</span></figcaption>

</figure><figure class="quote" id="q-1164379e79" data-kw="">
<blockquote><p>But a most pernicious error widely prevails that Scripture has only so much weight as is conceded to it by the consent of the church. As if the eternal and inviolable truth of God depended upon the decision of men! For they mock the Holy Spirit when they ask: Who can convince us that these writings came from God?</p></blockquote>

<blockquote><p>Let this point therefore stand: that those whom the Holy Spirit has inwardly taught truly rest upon Scripture, and that Scripture indeed is self-authenticated; hence, it is not right to subject it to proof and reasoning. And the certainty it deserves with us, it attains by the testimony of the Spirit. … For as God alone is a fit witness of himself in his Word, so also the Word will not find acceptance in men&#x27;s hearts before it is sealed by the inward testimony of the Spirit.</p></blockquote>

</figure><figure class="quote" id="q-a4d344e0e7" data-kw="">
<blockquote><p>The Scriptures of the Old and New Testament do abundantly and uncontrollably manifest themselves to be the word of the living God; so that, merely on the account of their own proposal of themselves unto us in the name and majesty of God, as such — without the contribution of help or assistance from tradition, church, or any thing else without themselves — we are obliged, upon the penalty of eternal damnation … to receive them, with that subjection of soul which is due to the word of God. … So, then, the authority of the written Word — in itself and unto us — is from itself, as the Word of God; and the eviction of that authority unto us, is by itself.</p></blockquote>

</figure><figure class="quote" id="q-eb68156088" data-kw="">
<blockquote><p>The Holy Scripture is the only sufficient, certain, and infallible rule of all saving knowledge, faith, and obedience, although the light of nature, and the works of creation and providence do so far manifest the goodness, wisdom, and power of God, as to leave men inexcusable; yet they are not sufficient to give that knowledge of God and His will which is necessary unto salvation. Therefore it pleased the Lord at sundry times and in diversified manners to reveal Himself, and to declare that His will unto His church; and afterward for the better preserving and propagating of the truth, and for the more sure establishment and comfort of the church against the corruption of the flesh, and the malice of Satan, and of the world, to commit the same wholly unto writing; which makes the Holy Scriptures to be most necessary, those former ways of God&#x27;s revealing His will unto His people being now completed.</p></blockquote>

<blockquote><p>The supreme judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Scripture delivered by the Spirit, into which Scripture so delivered, our faith is finally resolved.</p></blockquote>

</figure><figure class="quote" id="q-bba49df3ee" data-kw="">
<blockquote><p>For I confess to your Charity that I have learned to yield this respect and honour only to the canonical books of Scripture: of these alone do I most firmly believe that the authors were completely free from error. And if in these writings I am perplexed by anything which appears to me opposed to truth, I do not hesitate to suppose that either the manuscript is faulty, or the translator has not caught the meaning of what was said, or I myself have failed to understand it. As to all other writings, in reading them, however great the superiority of the authors to myself in sanctity and learning, I do not accept their teaching as true on the mere ground of the opinion being held by them; but only because they have succeeded in convincing my judgment of its truth either by means of these canonical writings themselves, or by arguments addressed to my reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 82 (to Jerome)</cite>, §3</span></figcaption>

</figure><figure class="quote" id="q-25881b937a" data-kw="">
<blockquote><p>But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true; but that all the letters of bishops which have been written, or are being written, since the closing of the canon, are liable to be refuted if there be anything contained in them which strays from the truth, either by the discourse of some one who happens to be wiser in the matter than themselves, or by the weightier authority and more learned experience of other bishops, by the authority of Councils</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true; but that all the letters of bishops which have been written, or are being written, since the closing of the canon, are liable to be refuted if there be anything contained in them which strays from the truth, either by the discourse of some one who happens to be wiser in the matter than themselves, or by the weightier authority and more learned experience of other bishops, by the authority of Councils”

</figure><figure class="quote" id="q-ff2a372682" data-kw="">
<blockquote><p>For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies … Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, q. 5, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-41deb671e7" data-kw="">
<blockquote><p>Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful. How then shall I acquiesce in their sentence? How can my conscience certainly determine, so as to leave no room for my faith to waver, that whatever they may pronounce is true? This is surely to leave no difference between God and men. For I believe what God says to be true, because he says it, and seek no other reason; but when I hear scripture saying that “all men are liars,” I dare not ascribe so much to man, lest I make him equal to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, q. 5, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-9f507a876f" data-kw="">
<blockquote><p>Nor is the right of examination founded in this—that we ought to believe ourselves wiser and more sagacious than entire synods and the whole true church; but in this—that since the privilege of infallibility has been granted by God to no church or pastor, nor are we certain whether they who compose ecclesiastical assemblies are members of the true church and faithful servants of God, who are partakers of the Holy Spirit and follow his guidance; nay, it can happen (and it has too often happened) that such assemblies have erred in their decisions. Hence no other means is left for the believer to know the legitimate authority of these assemblies and the decisions made by them with the certainty of faith, than a comparison and examination of them with the word of God, which he not only permits as possible and lawful, but commands as just and necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.34</span></figcaption>

</figure><figure class="quote" id="q-6de32a9617" data-kw="">
<blockquote><p>The Bible is a plain book. It is intelligible by the people. And they have the right, and are bound to read and interpret it for themselves; so that their faith may rest on the testimony of the Scriptures, and not on that of the Church. Such is the doctrine of Protestants on this subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>

— Charles Hodge, Systematic Theology, vol. 1, Introduction, ch. 6, §5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20Bible%20is%20a%20plain%20book.%20It%20is%20intelligible%20by%20the%20people.%20And%20they%20have%20the%20right%2C%20and%20are%20bound%20to%20read%20and%20interpret%20it%20for%20themselves%3B%20so%20that%20their%20faith%20may%20rest%20on%20the%20testimony%20of%20the%20Scriptures%2C%20and%20not%20on%20that%20of%20the%20Church.%20Such%20is%20the%20doctrine%20of%20Protestants%20on%20this%20subject.%E2%80%9D%0A%0A%E2%80%94%20Charles%20Hodge%2C%20Systematic%20Theology%2C%20vol.%201%2C%20Introduction%2C%20ch.%206%2C%20%C2%A75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6de32a9617.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6de32a9617.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology1" rel="noopener" target="_blank">Read it online · CCEL, vol. 1</a></div>
</figure><figure class="quote" id="q-d69ee4f244" data-kw="">
<blockquote><p>That the obligations to faith and obedience are personal. Every man is responsible for his religious faith and his moral conduct. He cannot transfer that responsibility to others; nor can others assume it in his stead. He must answer for himself; and if he must answer for himself, he must judge for himself. It will not avail him in the day of judgment to say that his parents or his Church taught him wrong. He should have listened to God, and obeyed Him rather than men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>

<blockquote><p>Upon scriptural and Protestant principles, every man has the right of private judgment, —i.e., he is entitled to interpret the word of God for himself upon his own responsibility, for the regulation of his own opinions and conduct, for the execution of his own functions and the discharge of his own duties, whatever these may be; and Christ has conferred upon no class of men any power that interferes with the exercise of this right.</p></blockquote>

</figure><figure class="quote" id="q-cade01efb4" data-kw="">
<blockquote><p>My principal design is, to manifest that every believer may, in the due use of the means appointed of God for that end, attain unto such a full assurance of understanding in the truth, or all that knowledge of the mind and will of God revealed in the Scripture, which is sufficient to direct him in the life of God, to deliver him from the dangers of ignorance, darkness, and error, and to conduct him unto blessedness.</p></blockquote>

</figure><figure class="quote" id="q-4bd5742617" data-kw="">
<blockquote><p>Besides that, we are all priests, as I have said, and have all one faith, one Gospel, one Sacrament; how then should we not have the power of discerning and judging what is right or wrong in matters of faith? What becomes of St. Paul&#x27;s words, &quot;But he that is spiritual judgeth all things, yet he himself is judged of no man&quot; (1 Cor. ii. 15), and also, &quot;we having the same spirit of faith&quot;? (2 Cor. iv. 13). Why then should we not perceive as well as an unbelieving pope what agrees or disagrees with our faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Christian Nobility of the German Nation</cite>, The Second Wall</span></figcaption>

<blockquote><p>The question is whether the reading should be forbidden to anyone (which we deny). … (3) The Scriptures are the Testament of our heavenly father, and should a child be forbidden to read the will of his father? … Is it not sufficient that the reading of the Scriptures is allowed by the papists to some? For that ought not to be granted to some as a privilege which is enjoined upon all as a duty.</p></blockquote>

</figure><figure class="quote" id="q-2b20523127" data-kw="">
<blockquote><p>The threefold judge must be accurately distinguished here. First is the supreme and autocratic (autokratorikos), which judges by legislative and absolute authority after the manner of the highest prince, which enacts laws and from which there is no appeal. Second is the subordinate (hypēretikos) or ministerial, which interprets the laws after the manner of a public minister. Third is an idiomatic (idiōtikos) or private, which both from the laws and from their interpretation judges in the way of private discretion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.3</span></figcaption>

</figure><figure class="quote" id="q-e8b377bc63" data-kw="">
<blockquote><p>We hold the case thus:—that the spirits are to be tried and proved by a twofold judgment. The one, internal; by which, through the Holy Spirit, or a peculiar gift of God, any one may illustrate, and to a certainty, judge of, and determine on, the doctrines and sentiments of all men, for himself and his own personal salvation concerning which it is said. (1 Cor. ii. 15.) &quot;The spiritual man judgeth all things, but he himself is judged of no man.&quot; This belongs to faith, and is necessary for every, even private, Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 34</span></figcaption>

</figure><figure class="quote" id="q-ea02d03b91" data-kw="">
<blockquote><p>The other, then, is the external judgment; by which, we judge, to the greatest certainty, of the spirits and doctrines of all men; not for ourselves only, but for others also, and for their salvation. This judgment is peculiar to the public ministry of the Word and the external office, and especially belongs to teachers and preachers of the Word. Of this we make use, when we strengthen the weak in faith, and when we refute adversaries.</p></blockquote>

</figure><figure class="quote" id="q-c7614cee12" data-kw="">
<blockquote><p>There is a twofold trial of doctrine, private and public. The private trial is that by which every one settles his own faith, when he wholly acquiesces in that doctrine which he knows has come from God. … Public trial refers to the common consent and polity of the Church; for as there is danger lest fanatics should rise up, who may presumptuously boast that they are endued with the Spirit of God, it is a necessary remedy, that the faithful meet together and seek a way by which they may agree in a holy and godly manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>

</figure><figure class="quote" id="q-7469950696" data-kw="">
<blockquote><p>Now we determine that the supreme right, authority, and judgment of interpreting the scriptures, is lodged with the Holy Ghost and the scripture itself: for these two are not mutually repugnant. We say that the Holy Spirit is the supreme interpreter of scripture, because we must be illuminated by the Holy Spirit to be certainly persuaded of the true sense of scripture; otherwise, although we use all means, we can never attain to that full assurance which resides in the minds of the faithful. … As to external persuasion, we say that scripture itself is its own interpreter.</p></blockquote>

</figure><figure class="quote" id="q-f4b69291f9" data-kw="">
<blockquote><p>To ascertain the true sense of the Scriptures, interpretation is needed. … It is not to be sought by each man&#x27;s private judgment (which is the idia epilysis condemned by Peter), but is to be gathered from the Scriptures themselves as their own best and surest interpreter (Neh. 8:8; Acts 17:11). But for this, after fervent prayer to God, there is need of an inspection of the sources, the knowledge of languages, … collation of passages, … and conformity of the interpretation to the analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.19.18</span></figcaption>

</figure><figure class="quote" id="q-93e36ab959" data-kw="">
<blockquote><p>If the Scriptures be what they claim to be, the word of God, they are the work of one mind, and that mind divine. From this it follows that Scripture cannot contradict Scripture. God cannot teach in one place anything which is inconsistent with what He teaches in another. Hence Scripture must explain Scripture. If a passage admits of different interpretations, that only can be the true one which agrees with what the Bible teaches elsewhere on the same subject.</p></blockquote>

</figure><figure class="quote" id="q-28d3ab91db" data-kw="">
<blockquote><p>Seventhly, all our expositions should accord with the analogy of faith, which we read of, Rom. xii. 6. Now the analogy of faith is nothing else but the constant sense of the general tenour of scripture in those clear passages of scripture, where the meaning labours under no obscurity; such as the articles of faith in the Creed, and the contents of the Lord&#x27;s Prayer, the Decalogue, and the whole Catechism: for every part of the Catechism may be confirmed by plain passages of scripture. Whatever exposition is repugnant to this analogy must be false.</p></blockquote>

</figure><figure class="quote" id="q-91f1d74d37" data-kw="">
<blockquote><p>For when some have taken up a private interpretation of any place of Scripture, if, before they have thoroughly imbibed and vented it, they do not submit their conception, although they seem to be greatly satisfied in it and full of it, unto the authority of the Scripture in the declaration of its own mind in other places, there is but small hope of their recovery. And this is that pride which is the source and original of heresy, -- namely, when men will prefer their seemingly wise and rational conceptions of the sense of particular places before the analogy of faith.</p></blockquote>

— John Owen, The Causes, Ways, and Means of Understanding the Mind of God, ch. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%20when%20some%20have%20taken%20up%20a%20private%20interpretation%20of%20any%20place%20of%20Scripture%2C%20if%2C%20before%20they%20have%20thoroughly%20imbibed%20and%20vented%20it%2C%20they%20do%20not%20submit%20their%20conception%2C%20although%20they%20seem%20to%20be%20greatly%20satisfied%20in%20it%20and%20full%20of%20it%2C%20unto%20the%20authority%20of%20the%20Scripture%20in%20the%20declaration%20of%20its%20own%20mind%20in%20other%20places%2C%20there%20is%20but%20small%20hope%20of%20their%20recovery.%20And%20this%20is%20that%20pride%20which%20is%20the%20source%20and%20original%20of%20heresy%2C%20--%20namely%2C%20when%20men%20will%20prefer%20their%20seemingly%20wise%20and%20rational%20conceptions%20of%20the%20sense%20of%20particular%20places%20before%20the%20analogy%20of%20faith.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20The%20Causes%2C%20Ways%2C%20and%20Means%20of%20Understanding%20the%20Mind%20of%20God%2C%20ch.%208&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F91f1d74d37.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91f1d74d37.html">Permalink</a><a class="src" href="https://archive.org/details/worksofjohnowend0004owen" rel="noopener" target="_blank">Read it online · Internet Archive (Goold)</a></div>
</figure><figure class="quote" id="q-f327f9ab65" data-kw="">
<blockquote><p>The clearness of the Scripture is twofold; even as the obscurity is twofold also. The one is external, placed in the ministry of the word; the other internal, placed in the understanding of the heart. If you speak of the internal clearness, no man sees one iota in the Scriptures, but he that hath the Spirit of God. … If you speak of the external clearness, nothing whatever is left obscure or ambiguous; but all things that are in the Scriptures, are by the Word brought forth into the clearest light, and proclaimed to the whole world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

</figure><figure class="quote" id="q-b1c502ae28" data-kw="">
<blockquote><p>The question then comes to this—whether the Scriptures are so plain in things essential to salvation (not as to the things delivered, but as to the mode of delivery; not as to the subject, but the object) that without the external aid of tradition or the infallible judgment of the church, they may be read and understood profitably by believers. The papists deny this; we affirm it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The question then comes to this—whether the Scriptures are so plain in things essential to salvation (not as to the things delivered, but as to the mode of delivery; not as to the subject, but the object) that without the external aid of tradition or the infallible judgment of the church, they may be read and understood profitably by believers. The papists deny this; we affirm it.”

</figure><figure class="quote" id="q-2fb873736a" data-kw="">
<blockquote><p>It is not denied that the Scriptures contain many things hard to be understood; that they require diligent study; that all men need the guidance of the Holy Spirit in order to right knowledge and true faith. But it is maintained that in all things necessary to salvation they are sufficiently plain to be understood even by the unlearned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>

</figure><figure class="quote" id="q-d8438f77a1" data-kw="">
<blockquote><p>But the Papists are doubly foolish, when they conclude from this passage, that no interpretation of a private man ought to be deemed authoritative. For they pervert what Peter says, that they may claim for their own councils the chief right of interpreting Scripture; but in this they act indeed childishly; for Peter calls interpretation private, not that of every individual, in order to prohibit each one to interpret; but he shews that whatever men bring of their own is profane.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 2 Peter 1:20</span></figcaption>

</figure><figure class="quote" id="q-a4810c40f0" data-kw="">
<blockquote><p>Were, then, the whole world unanimous, and were the minds of all men united together, still what would proceed from them, would be private or their own; for the word is here set in opposition to divine revelation; so that the faithful, inwardly illuminated by the Holy Spirit, acknowledge nothing but what God says in his word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 2 Peter 1:20</span></figcaption>

</figure><figure class="quote" id="q-5b92934789" data-kw="">
<blockquote><p>Although we allow to individual believers the judgment of private discretion (because &quot;he that is spiritual judgeth all things&quot; [1 Cor. 2:15], and the apostle commands us to &quot;prove all things&quot; [1 Thess. 5:21]), we do not therefore assert in opposition to Peter (2 Pet. 1:20*) that the Scriptures are of private interpretation (idia epilysis). For epilysis here does not mean the interpretation of the Scriptures so much as the origin of the prophetic oracles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.33</span></figcaption>

</figure><figure class="quote" id="q-c78882c4a3" data-kw="">
<blockquote><p>If men abuse the Scriptures, this does not happen per se, but accidentally from the perversity of those who wrongfully wrest them to their own destruction. Otherwise (if on account of the abuse the use should be prohibited), the Scriptures ought to be taken away not only from the laity, but also from the teachers who abuse them far more. For heresies usually arise not from the common people and the unlearned, but from ecclesiastics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.18.5</span></figcaption>

</figure><figure class="quote" id="q-12c2017005" data-kw="">
<blockquote><p>The fact that all the true people of God in every age and in every part of the Church, in the exercise of their private judgment, in accordance with the simple rules above stated, agree as to the meaning of Scripture in all things necessary either in faith or practice, is a decisive proof of the perspicuity of the Bible, and of the safety of allowing the people the enjoyment of the divine right of private judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §6</span></figcaption>

</figure><figure class="quote" id="q-7b28e372f2" data-kw="">
<blockquote><p>Therefore it is a wickedly devised fable-and they cannot quote a single letter to confirm it-that it is for the Pope alone to interpret the Scriptures or to confirm the interpretation of them. They have assumed the authority of their own selves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Christian Nobility of the German Nation</cite>, The Second Wall</span></figcaption>

</figure><figure class="quote" id="q-27a9e0c727" data-kw="">
<blockquote><p>As all were not true prophets, the Apostle here declares that they ought to have been examined and tried. And he addresses not only the whole Church, but also every one of the faithful. … That we may then be fit judges, we must necessarily be endowed with and directed by the Spirit of discernment. But as the Apostle would have commanded this in vain, were there no power of judging supplied, we may with certainty conclude, that the godly shall never be left destitute of the Spirit of wisdom as to what is necessary, provided they ask for him of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“As all were not true prophets, the Apostle here declares that they ought to have been examined and tried. And he addresses not only the whole Church, but also every one of the faithful. … That we may then be fit judges, we must necessarily be endowed with and directed by the Spirit of discernment. But as the Apostle would have commanded this in vain, were there no power of judging supplied, we may with certainty conclude, that the godly shall never be left destitute of the Spirit of wisdom as to what is necessary, provided they ask for him of the Lord.”

— John Calvin, Commentaries on the Catholic Epistles, 1 John 4:1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs%20all%20were%20not%20true%20prophets%2C%20the%20Apostle%20here%20declares%20that%20they%20ought%20to%20have%20been%20examined%20and%20tried.%20And%20he%20addresses%20not%20only%20the%20whole%20Church%2C%20but%20also%20every%20one%20of%20the%20faithful.%20%E2%80%A6%20That%20we%20may%20then%20be%20fit%20judges%2C%20we%20must%20necessarily%20be%20endowed%20with%20and%20directed%20by%20the%20Spirit%20of%20discernment.%20But%20as%20the%20Apostle%20would%20have%20commanded%20this%20in%20vain%2C%20were%20there%20no%20power%20of%20judging%20supplied%2C%20we%20may%20with%20certainty%20conclude%2C%20that%20the%20godly%20shall%20never%20be%20left%20destitute%20of%20the%20Spirit%20of%20wisdom%20as%20to%20what%20is%20necessary%2C%20provided%20they%20ask%20for%20him%20of%20the%20Lord.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Catholic%20Epistles%2C%201%20John%204%3A1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27a9e0c727.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27a9e0c727.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom45" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-af1d9fc9d0" data-kw="">
<blockquote><p>We do not say that each individual should acquiesce in that interpretation which his own private spirit frames and dictates to him; for this would be to open a door to fanatical tempers and spirits: but we say that that Spirit should be the judge, who speaks openly and expressly in the scriptures, and whom all may hear; by him we desire that all other spirits, that is, all doctrines, (for so the word is to be taken in this place,) should be examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 5 (pp. 433–34)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We do not say that each individual should acquiesce in that interpretation which his own private spirit frames and dictates to him; for this would be to open a door to fanatical tempers and spirits: but we say that that Spirit should be the judge, who speaks openly and expressly in the scriptures, and whom all may hear; by him we desire that all other spirits, that is, all doctrines, (for so the word is to be taken in this place,) should be examined.”

</figure><figure class="quote" id="q-3e0068a0fa" data-kw="">
<blockquote><p>They did only examine Paul&#x27;s doctrine by the rule and square of the Scripture … for the Scripture is the true touchstone whereby all doctrines must be tried. If any man say that this kind of trial is doubtful, forasmuch as the Scripture is oftentimes doubtful, and is interpreted divers ways, I say, that we must also add judgment of the Spirit, who is, not without cause, called the Spirit of discretion, [discernment.] But the faithful must judge of every doctrine no otherwise then out of, and according to, the Scriptures, having the Spirit for their leader and guide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, Acts 17:11</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“They did only examine Paul&#x27;s doctrine by the rule and square of the Scripture … for the Scripture is the true touchstone whereby all doctrines must be tried. If any man say that this kind of trial is doubtful, forasmuch as the Scripture is oftentimes doubtful, and is interpreted divers ways, I say, that we must also add judgment of the Spirit, who is, not without cause, called the Spirit of discretion, [discernment.] But the faithful must judge of every doctrine no otherwise then out of, and according to, the Scriptures, having the Spirit for their leader and guide.”

</figure><figure class="quote" id="q-8eab3242bd" data-kw="">
<blockquote><p>Therefore, let this remain as a most sure maxim, that no doctrine is worthy to be believed but that which we find to be grounded in the Scriptures. The Pope will have all that received without any more ado, whatsoever he doth blunder out at his pleasure; but shall he be preferred before Paul, concerning whose preaching it was lawful for the disciples to make inquisition?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, Acts 17:11</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Therefore, let this remain as a most sure maxim, that no doctrine is worthy to be believed but that which we find to be grounded in the Scriptures. The Pope will have all that received without any more ado, whatsoever he doth blunder out at his pleasure; but shall he be preferred before Paul, concerning whose preaching it was lawful for the disciples to make inquisition?”

— John Calvin, Commentary on Acts, Acts 17:11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C%20let%20this%20remain%20as%20a%20most%20sure%20maxim%2C%20that%20no%20doctrine%20is%20worthy%20to%20be%20believed%20but%20that%20which%20we%20find%20to%20be%20grounded%20in%20the%20Scriptures.%20The%20Pope%20will%20have%20all%20that%20received%20without%20any%20more%20ado%2C%20whatsoever%20he%20doth%20blunder%20out%20at%20his%20pleasure%3B%20but%20shall%20he%20be%20preferred%20before%20Paul%2C%20concerning%20whose%20preaching%20it%20was%20lawful%20for%20the%20disciples%20to%20make%20inquisition%3F%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentary%20on%20Acts%2C%20Acts%2017%3A11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8eab3242bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8eab3242bd.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom37" rel="noopener" target="_blank">Read it online · CCEL, vol. 2</a></div>
</figure><figure class="quote" id="q-d4bd5dd7bb" data-kw="">
<blockquote><p>The Bereans are praised for not rashly and hastily receiving whatever Paul taught them, but diligently examining his doctrine by scripture. Whence we draw two inferences: First, that all doctrine is to be judged by the scriptures. For, if the Bereans compared the preaching of an apostle with the rule of scripture, shall we embrace without any examination whatever the pope may please to maintain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 8 (p. 457)</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Bereans are praised for not rashly and hastily receiving whatever Paul taught them, but diligently examining his doctrine by scripture. Whence we draw two inferences: First, that all doctrine is to be judged by the scriptures. For, if the Bereans compared the preaching of an apostle with the rule of scripture, shall we embrace without any examination whatever the pope may please to maintain?”

— William Whitaker, A Disputation on Holy Scripture, Controversy 1, Q. 5, ch. 8 (p. 457)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20Bereans%20are%20praised%20for%20not%20rashly%20and%20hastily%20receiving%20whatever%20Paul%20taught%20them%2C%20but%20diligently%20examining%20his%20doctrine%20by%20scripture.%20Whence%20we%20draw%20two%20inferences%3A%20First%2C%20that%20all%20doctrine%20is%20to%20be%20judged%20by%20the%20scriptures.%20For%2C%20if%20the%20Bereans%20compared%20the%20preaching%20of%20an%20apostle%20with%20the%20rule%20of%20scripture%2C%20shall%20we%20embrace%20without%20any%20examination%20whatever%20the%20pope%20may%20please%20to%20maintain%3F%E2%80%9D%0A%0A%E2%80%94%20William%20Whitaker%2C%20A%20Disputation%20on%20Holy%20Scripture%2C%20Controversy%201%2C%20Q.%205%2C%20ch.%208%20%28p.%20457%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd4bd5dd7bb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d4bd5dd7bb.html">Permalink</a><a class="src" href="https://archive.org/details/disputationonhol00whituoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-b65e48dc5d" data-kw="">
<blockquote><p>In this matter there is no need of knowing immediately and a priori who has the Spirit, but only who speaks according to the Scriptures. When this becomes known by a reference to the Scriptures, we can readily judge a posteriori who utters the words of the Spirit and speaks from him. Thus the Bereans did not inquire a priori whether Paul who preached to them was moved by the Holy Spirit … but whether Paul spoke according to the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.35</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“In this matter there is no need of knowing immediately and a priori who has the Spirit, but only who speaks according to the Scriptures. When this becomes known by a reference to the Scriptures, we can readily judge a posteriori who utters the words of the Spirit and speaks from him. Thus the Bereans did not inquire a priori whether Paul who preached to them was moved by the Holy Spirit … but whether Paul spoke according to the Scriptures.”

— Francis Turretin, Institutes of Elenctic Theology, 2.20.35">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn%20this%20matter%20there%20is%20no%20need%20of%20knowing%20immediately%20and%20a%20priori%20who%20has%20the%20Spirit%2C%20but%20only%20who%20speaks%20according%20to%20the%20Scriptures.%20When%20this%20becomes%20known%20by%20a%20reference%20to%20the%20Scriptures%2C%20we%20can%20readily%20judge%20a%20posteriori%20who%20utters%20the%20words%20of%20the%20Spirit%20and%20speaks%20from%20him.%20Thus%20the%20Bereans%20did%20not%20inquire%20a%20priori%20whether%20Paul%20who%20preached%20to%20them%20was%20moved%20by%20the%20Holy%20Spirit%20%E2%80%A6%20but%20whether%20Paul%20spoke%20according%20to%20the%20Scriptures.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%202.20.35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb65e48dc5d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b65e48dc5d.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-f8b91c1809" data-kw="">
<blockquote><p>And although ordinary believers are obliged to make diligent and conscientious use of the ministry of the church, among other things, as a means appointed of God to lead, guide, and instruct them in the knowledge of his mind and will revealed in the Scripture, which is the principal end of that ordinance; yet is not their understanding of the truth, their apprehension of it and faith in it, to rest upon or to be resolved into their authority, who are not appointed of God to be lords of their faith, but helpers of their joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 1</span></figcaption>

<blockquote><p>1. Revelation of God in the destitute state is one thing, subjective, which can be called impressed on conscience; objective another, and that either inscribed in Nature or inserted in Scripture. 2. Subjective revelation impressed on conscience is convictive, but not converting. 3. Objective revelation inscribed in nature proposes God the Creator, but by no means God the Redeemer. 4. Of this revelation there is neither other efficacy nor other outcome except ἀπολογησία [inexcusability]. 5. Revelation inserted in Scripture is both the only adequate one and the only one that can be salutary.</p></blockquote>

<blockquote><p>In today’s intellectual milieu, pride and sloth are the two chief interpretive vices. Partisan pride protects its beliefs behind the shield of identity politics, while systemic sloth shrugs indifferently at the pursuit of truth itself. In response, today’s Bible interpreters need more than the right kind of method; they need to be the right kind of people: readers marked by interpretive virtue rather than interpretive vice. With boldness, they oppose systemic sloth and proclaim what God has said. At the same time, with humility, they resist partisan pride and remain humbly open to correction.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In today’s intellectual milieu, pride and sloth are the two chief interpretive vices. Partisan pride protects its beliefs behind the shield of identity politics, while systemic sloth shrugs indifferently at the pursuit of truth itself. In response, today’s Bible interpreters need more than the right kind of method; they need to be the right kind of people: readers marked by interpretive virtue rather than interpretive vice. With boldness, they oppose systemic sloth and proclaim what God has said. At the same time, with humility, they resist partisan pride and remain humbly open to correction.”

<blockquote><p>. . . he is the best student who does not read his thoughts into the book, but lets it reveal its own; who draws from it its sense, and does not import his own into it, nor force upon its words a meaning which he had determined was the right one before he opened its pages. Since then we are to discourse of the things of God, let us assume that God has full knowledge of Himself, and bow with humble reverence to His words. For He Whom we can only know through His own utterances is the fitting witness concerning Himself.</p></blockquote>

<blockquote><p>First rule: “We must consider the primary idea of the whole passage, and we must gather this idea from what precedes and from what follows. For as a building without a foundation is weak (as Chrysostom says), so Scripture is useless unless we discover its aim.</p></blockquote>

<blockquote><p>9. As it [the Word of God] has its authority comparatively from itself, so also it has it in itself, and although it can be persuaded to us through other means, yet it cannot be persuaded except through that very light which it has in itself, just as also the Sun can be seen only by its own light. X. The authority of the Church, whatever it may be, can be here εἰσαγωγική [introductory] and διηγητική [exegetical], but cannot be αὐθεντική [self-authorizing] or αὐτοπιστική [self-credentialing]; for although the Holy Spirit uses both the intrinsic light of Scripture and the extrinsic light of the Church in impressing faith concerning Scripture upon us, yet the former is the primary medium and motive, the latter only secondary. … XIII. Neither the constitution of the Canon nor the interpretation of the constituted canon ultimately rests on the authority of the Church. XIV. The αὐτοκρατορικός [absolute ruler] judge of controversies is the one Spirit of God, the κανονικός [normative] judge is Sacred Scripture, the ὀργανικός [instrumental] or λειτουργικός [ministerial] judge is the Church, but the one which is true, not the one which merely professes itself to be true. XV. But Scripture is a real Judge, not personal, whence vain are the argumentations which are drawn against the real judge from the characteristics of a personal judge. … XVII. The adequate sense of sacred Scripture is only one, inadequate senses sometimes several can be given, but subalternate, not opposed. XVIII. The end of sacred Scripture is not merely commonitory [calling to mind], but instructive and regulative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/friedrich-spanheim-the-elder.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>

<blockquote><p>The Church of Rome makes four senses of the Scriptures, the literal, allegorical, tropological and anagogical, as in this her example: Melchizedek offered bread and wine. The literal sense is that the King of Salem with meat which he brought, refreshed the soldiers of Abraham being tired with travel. The allegorical is that the priest does offer up Christian ye Mass. The tropological is therefore something is to be given to the poor. The Anagogical is that Christ in like manner being in heaven, shall be the bread of life to the faithful. But this her device of the fourfold meaning of the Scripture must be exploded and rejected. There is one only sense, and the same is the Literal. An allegory is only a certain manner of uttering the same sense. The Anagoge and Tropology are ways whereby the sense may be applied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Prophesying: or a Treatise concerning the Sacred &amp; Only True Manner &amp; Method of Preaching (London, 1607)</cite>, pp. 30-31</span></figcaption>

<blockquote><p>Accordingly, Rivet rejected the medieval quadriga [four-fold interpretation] and argued that the source of all theological conclusions was the literal sense of the text ([Isagogue] chap. 14[:1; C.f. 15:20]). At the same time, he recognized that the literal sense of Holy Scripture included various figures and types; yet allegories, tropes, and anagogy he understood as false readings when they were imposed on the text rather than being identified as integral to it.</p></blockquote>

<blockquote><p>John Murray was not only one of the most renowned twentieth-century representatives of classical Reformed theology, but also a highly-respected interpreter of Calvin. Here we have Murray’s vigorous refutation of arguments suggesting that Calvin did not teach the inerrancy of Scripture. Murray also demonstrates that Calvin did not consider Christ’s identity as the divine Word to be in any way prejudicial to Scripture being the very Word of God as well.” – Sherman Isbell . on Warfield Gerstner, John – ‘Warfield’s Case for Biblical Inerrancy’ 24 pp. in God’s Inerrant Word: a Symposium on the Trustworthiness of Scripture Warfield has some of the best writings on Inspiration and was a great defender of the Inerrancy of the Original Autographs of the Scriptures. Be aware, though, that, in his adoption of the ‘critical texts’ of Scripture (dug up in the mid-1800’s) and the philosophy behind them, Warfield did quietly drop the doctrine of the special, providential preservation of the Scriptures through the New Testament era *in all ages* (as WCF 1.8 states: “and by his singular care and providence kept pure in all ages, are therefore authentical”). Warfield, unfortunately has been greatly influenctial in this regard towards those who have come after him. For a correction of this, see The Ecclesiastical Text. . . The Chicago Statement on Biblical Inerrancy 1978 Chicago Statement on Biblical Inerrancy with Exposition 19 Articles Sproul, R.C. – Explaining Inerrancy: a Commentary Buy 51 pp. . . The Proof is in the Pudding To see the complete truthfulness of the Scriptural accounts demonstrated in detail, see the ‘Authenticity’ section at the end of each commentary section that we have on most books of the Bible: Old Testament Commentaries New Testament Commentaries . . Bible Difficulties Resolved Below are the top 5 recommendations (from this document) of Dr. Leslie McFall (a late, evangelical Biblical chronologist) out of 120 works from the pre-1900’s era that are in Cambridge University’s library. McFall said, “If you are stuck for time, consult Manasseh Ben Israel first then Baruh.</p></blockquote>

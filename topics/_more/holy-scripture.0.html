<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law. 3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty. 4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things. 5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie. 6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one. 7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know: 1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such. 2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause. 3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>

<blockquote><p>What does the Bible presume that we already know. There are a lot of things that the Bible presumes that we already know… Biblicism is a term that’s often being used in reference to a specific distinctive of evangelicals… How do you define Biblicism? I define it as that elevation of the Bible to such a high level that it occludes other things that we need to take into account… And often in circles that emphasize Biblicism you see prudential categores of thought deemphasized; its not about prudence if you have a divinely inspired verse that commands you to do something about it… in addition to that, there’s also the sidelining of philosophical categories, and systematic categories… We do teach the sufficiency of Scripture, but sufficiency for the task that God has given it. And so its like talking about the sufficiency of a steering wheel for steering a car. We don’t think of the sufficiency of the steering wheel in detachment from the rest of the steering mechanism, or in detachment from the driver; and so we need all of these things together, and Scripture is something that works along with God’s revelation in nature.</p></blockquote>

orks%20along%20with%20God%E2%80%99s%20revelation%20in%20nature" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9dae215799" data-kw="">
<blockquote><p>Or if anyone should think this is untrue, I am not going to quarrel about it. After all, I am clearly dealing with Christians, who rejoice over their knowing the holy Scriptures without human guidance; and if that is the case, it is a genuine good they are rejoicing over, one quite out of the ordinary. So let them grant me that each one of us, from earliest childhood, has had to learn our own language by constantly hearing it spoken, and has acquired a knowledge of any other language, whether Hebrew or Greek, or any of the rest, either in the same way by hearing it spoken, or from a human teacher. So now then, if you agree, let us advise all our brothers and sisters not to teach their small children these things, because after all it was in a single instant of time, with the coming of the Holy Spirit, that the apostles were filled and spoke in the tongues of all nations; or else none of us who have not experienced such things should consider ourselves to be Christians, or to have received the Holy Spirit. But no, on the contrary, let us not be too proud to learn what has to be learned with the help of other people, and let those of us by whom others are taught pass on what we have received without pride and without jealousy.</p></blockquote>

<blockquote><p>Thirdly, I demand of you, how you could so nakedly propound the apostolical directions, patterns and examples of the primitive Churches to walk by (excepting mere circumstances and the rules of the law of nature) and not except withal extraordinary and miraculous, personal and particular, occasional and accidental, temporary and local patterns and examples. I own the Scripture for the rule, rightly understanding it, and in matters of discipline and Church-order profess to walk by it, desiring to be tied to the Scripture patterns, particularly to the patterns of examples and precepts recorded in the New Testament (provided this be understood in essentials and fundamentals of order, in matters of perpetual use, and of a common reason to all times and places); only I add that in some things, where in matter of order and external government there may be no such clear directions either by precept or example, there general rules of the Word, with deductions out of Scripture examples, and from precepts by way of analogy, with rules of common prudence be taken in too. Now the interpretation of this rule (as I have laid it down) being rejected, and the rule simply taken up without such limitations, will produce a wild and strange discipline and Church-order, to practice all things recorded in the Acts of the Apostles and epistles without distinction and difference of those times, persons, places, and ours: and on the other hand to practice nothing but what has a clear example, or precept is strange too, and in so doing, reasonable men cannot become a Church society, nor exercise Church communion. And however in matters of external government and administration of holy things in the visible Church some pretend to this, to practice whatever they find recorded in the Scriptures, and to practice nothing whatsoever they find not there, yet none of the Independents, no not the highest form of them, the Anabaptists, nor the highest sort of Anabaptists (who were called Apostolici [Apostles] from their pretending to imitate the apostles in all things) ever yet have or do practice all patterns and examples recorded in the New Testament, or are contented with them alone, but practice somewhat over and above not particularly recorded in Scripture. I could lay down a catalogue of many particulars specified in the Acts of the Apostles and epistles not practiced in your churches, nor in any churches of the Independent way, as also of many things practiced by you which we never read of in the Scriptures, so that all the Independents are in many things according to the first pattern both defective and excessive. But I refer the full handling of this to a Tractate I intend concerning the Scriptures [which appears to never have been published], How far the Scriptures are a rule for all matters of Church government and order in the visible Church. I add only one thing for the reader’s sake, that they be careful to understand this first principle of yours, not so nakedly as you lay it down in pages 8-11 [of the Independents’ Apology], because it has been, is, and may be a rock to split many on, and an ignis fatuus [elf-fire] to lead many into waters, instead of a sacred pillar of fire to guide to Heaven in a safe way. This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top. Now how far the want [lack] of these limitations and distinctions in this your first rule has led some of you into errors and strange practices and may lead you further, as into anointing the sick with oil, baptizing in rivers, etc. I leave you to consider of. But yet this first and great principle upon which you went and reared up your new Church way, how difficult and abstruse a rule, and how doubtful a groundwork do you make it, before you pass from it…</p></blockquote>

<blockquote><p>Whether in all matters of doctrine all of you [Independents] be as orthodox in your judgments as your brethren themselves, I question it (though in the most doctrines and in the main I grant it)… however though you do not nourish any monsters or serpents of opinions in your bosoms, yet I fear you have running worms in your heads, and together with the gold, silver and ivory of orthodox truths, you have store of apes and peacocks, conceits and toys, as strange coined distinctions, new strained expositions of Scriptures, odd opinions about the personal reign of Christ on earth, and I ask you what the anointing with oil of sick persons as an ordinance for church-members, and what the bringing in of hymns composed by the gift of a church-member, cum multis aliis [with many others], are? Whether are not these strange conceits?</p></blockquote>

<blockquote><p>Scripture is not a legal document, the articles of which only need to be looked up for a person to find out what its view is in a given case. It is composed of many books written by various authors, dating back to different times and divergent in content. It is a living whole, not abstract but organic. It nowhere contains a sketch of the doctrine of faith; this is something that has to be drawn from the entire organism of Scripture. Scripture is not designed so that we should parrot it but that as free children of God we should think his thoughts after him… …So much study and reflection on the subject is bound up with it that no person can possibly do it alone. That takes centuries. To that end the church has been appointed and given the promise of the Spirit’s guidance into all truth. Whoever isolates himself from the church i.e., from Christianity as a whole, from the history of dogma in its entirety, loses the truth of the Christian faith. That person becomes a branch that is torn from the tree and shrivels, an organ that is separated from the body and therefore doomed to die. Only within the communion of the saints can the length and the breadth, the depth and the height, of the love of Christ be comprehended (Eph. 3:18). Add to this that the proponents of this school [19th century biblical theology advocates] forget that the Christian faith is universal; it can and must enter into all forms and conditions. They oppose grace to nature in a hostile fashion and do not sufficiently take account of the incarnation of the Word. For just as the Son of God became truly human, so also God’s thoughts, incorporated into Scripture, become flesh and blood in human consciousness. Dogmatics is and ought to be divine thought totally entered into and absorbed in our human consciousness, freely and independently expressed in our language, in its essence the fruit of centuries, in its form contemporary (Da Costa)</p></blockquote>

d+in+our+human+consciousness%2C+freely+and+independently+expressed+in+our+language%2C+in+its+essence+the+fruit+of+centuries%2C+in+its+form+contemporary+%28Da+Costa%29%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%2C+vol.+1+HT%3A+A+Pilgrim%E2%80%99s+Theology%2C+p.+83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b0a8b290f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b0a8b290f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-biblicism/#:~:text=Scripture%20is%20not%20a%20legal%20document,in%20its%20form%20contemporary%20%28Da%20Costa&amp;text=Scripture%20is%20not%20a%20legal%20document%2C%20the%20articles&amp;text=of%20centuries%2C%20in%20its%20form%20contemporary%20%28Da%20Costa" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-1749a32780" data-kw="">
<blockquote><p>In a formal sense, there are no dogmas in Scripture, but the material for them is all to be found in it. Hence dogmatics can be defined as the truth of Scripture, absorbed and reproduced by the thinking consciousness of the Christian theologian.</p></blockquote>

</figure><figure class="quote" id="q-15d1c6a015" data-kw="">
<blockquote><p>Holy Scripture is no dogmatics. It contains all the knowledge of God we need but not in the form of dogmatic formulations. The truth has been deposited in Scripture as the fruit of revelation and inspiration, in a language that is the immediate expression of life and therefore always remains fresh and original. But it has not yet become the object of reflection and has not yet gone through the thinking consciousness of the believer. Here and there, for example in the letter to the Romans, there may be a beginning of dogmatic development, but it is no more than a beginning. The period of revelation had to be closed before that of dogmatic reproduction could start. Scripture is the gold mine; it is the church that extracts the gold, puts its stamp on it, and converts it to general currency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 1 HT: A Pilgrim’s Theology</cite>, p. 116</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-774e14975c" data-kw="">
<blockquote><p>The term “biblicism” is usually derogatory. It is commonly applied to (1) someone who has no appreciation for the importance of extrabiblical truth in theology, who denies the value of general or natural revelation, (2) those suspected of believing that Scripture is a ‘textbook’ of science, or philosophy, politics, ethics, economics, aesthetics, church government, etc., (3) those who have no respect for confessions, creeds, and past theologians, who insist on ignoring these and going back to the Bible to build up their doctrinal formulations from scratch, (4) those who employ a ‘proof texting’ method, rather than trying to see Scripture texts in their historical, cultural, logical, and literary contexts. I wish to disavow biblicism in these senses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-frame.html">John Frame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘In Defense of Something Close to Biblicism: Reflections on Sola Scriptura and History in Theological Method’ (2012)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-8a41e984e0" data-kw="">
<blockquote><p>The basic question at stake is, “What makes a doctrine biblical?” That question is of course important to Catholics, Orthodox, and Protestants alike, but it is particularly important for us Protestants, affirming as we do sola scriptura. What I would like to do here is articulate an appropriate theological method that is faithful to sola scriptura in a robustly theological and historical manner (which, by the way, is how the Reformers originally articulated the idea). In contrast to a stark biblicism that sees theology as essentially an individual project whereby the reader exegetes a handful of passages and then makes theological conclusions, this method is, I think, more careful to understand that theology is not autonomous, it is not presupposition-less, it is not a-historical, it is not merely a matter of proof-texting or collecting a handful of texts, and it is not unmoored from other Christians reflection throughout space and time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matt-emerson.html">Matt Emerson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What Makes a Doctrine “Biblical”? On Method’ (2016)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-42a48afdd7" data-kw="">
<blockquote><p>Much of recent American Reformed theology has been caught up for some time in a distorted form of biblicism that has fallen into the trap of trying to reinvent the theological wheel in areas where doing so is fraught with danger—in particular, the doctrine of the divine attributes and the doctrine of the Trinity. More often than should be the case, important aspects of these essential doctrines of the Christian faith have been seriously misunderstood and then, on the basis of such misunderstanding, rejected or revised, with disastrous consequences. One way in which these misunderstandings could have been avoided would have been to grapple with the way these doctrines were defined and defended by the greatest theologians of the past, theologians such as Augustine, Gregory of Nazianzus, and yes, even Thomas Aquinas.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/keith-a-mathison.html">Keith A. Mathison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Should We Read Thomas Aquinas?” Tabletalk (August 10, 2018)</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Much of recent American Reformed theology has been caught up for some time in a distorted form of biblicism that has fallen into the trap of trying to reinvent the theological wheel in areas where doing so is fraught with danger—in particular, the doctrine of the divine attributes and the doctrine of the Trinity. More often than should be the case, important aspects of these essential doctrines of the Christian faith have been seriously misunderstood and then, on the basis of such misunderstanding, rejected or revised, with disastrous consequences. One way in which these misunderstandings could have been avoided would have been to grapple with the way these doctrines were defined and defended by the greatest theologians of the past, theologians such as Augustine, Gregory of Nazianzus, and yes, even Thomas Aquinas.”

— Keith A. Mathison, “Should We Read Thomas Aquinas?” Tabletalk (August 10, 2018)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMuch+of+recent+American+Reformed+theology+has+been+caught+up+for+some+time+in+a+distorted+form+of+biblicism+that+has+fallen+into+the+trap+of+trying+to+reinvent+the+theological+wheel+in+areas+where+doing+so+is+fraught+with+danger%E2%80%94in+particular%2C+the+doctrine+of+the+divine+attributes+and+the+doctrine+of+the+Trinity.+More+often+than+should+be+the+case%2C+important+aspects+of+these+essential+doctrines+of+the+Christian+faith+have+been+seriously+misunderstood+and+then%2C+on+the+basis+of+such+misunderstanding%2C+rejected+or+revised%2C+with+disastrous+consequences.+One+way+in+which+these+misunderstandings+could+have+been+avoided+would+have+been+to+grapple+with+the+way+these+doctrines+were+defined+and+defended+by+the+greatest+theologians+of+the+past%2C+theologians+such+as+Augustine%2C+Gregory+of+Nazianzus%2C+and+yes%2C+even+Thomas+Aquinas.%E2%80%9D%0A%0A%E2%80%94+Keith+A.+Mathison%2C+%E2%80%9CShould+We+Read+Thomas+Aquinas%3F%E2%80%9D+Tabletalk+%28August+10%2C+2018%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F42a48afdd7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/42a48afdd7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-biblicism/#:~:text=Much%20of%20recent%20American%20Reformed%20theology,Nazianzus%2C%20and%20yes%2C%20even%20Thomas%20Aquinas&amp;text=Much%20of%20recent%20American%20Reformed%20theology%20has%20been&amp;text=Gregory%20of%20Nazianzus%2C%20and%20yes%2C%20even%20Thomas%20Aquinas" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-82f7f2a696" data-kw="">
<blockquote><p>Biblicism moves beyond believing in the final authority of the Bible to imposing a restrictive hermeneutical method onto the Bible. Biblicism can be identified by the following symptoms: (1) Ahistorical mindset: Biblicism is a haughty disregard (chronological snobbery in the words of C.S. Lewis) for the history of interpretation and the authority of creeds and confessions, chanting an individualistic mantra, ‘No creed by the Bible,’ which in practice translates into ‘No authority but me.’ Sola scriptura is radicalized into solo scriptura. As a result, biblicism tails to let theology inform exegesis, which is designed to guard against heresy. (2) Irresponsible proof texting: Biblicism treats Scripture as if it is a dictionary or encyclopedia, as if the theologian merely excavates the right proof texts, chapter and verse, tallying them up to support a doctrine. Biblicism limits itself to those beliefs explicitly laid down in Scripture and fails to deduce doctrines from Scripture by good and necessary consequence. (3) Anti-metaphysics: Biblicism undervalues the use of philosophy in the service of exegesis and theology. Biblicism is especially allergic to metaphysics, failing to understand how the study of being should safeguard who God is (e.g. , pure act) in contrast to the creature. As a result, biblicism conflates theology and economy, as if who God is in himself can be read straight off the pages of Scripture when these pages are often focued on historical events. (4) Univocal predication: Biblicism assumes language used of God in the text should be applied to God in a direct fashion, as if the meaning of an attribute predicated of man has the same meaning when predicated of God. By consequence, biblicism risks historicizing God by means of a literalistic interpretation of the text. (5) Restrictive revelation: Biblicism is a suspicion or even dismissiveness toward the diverse ways God has revealed himself, limiting itself to the book of Scripture while shunning the book of creation. Biblicism is often suspicious towards natural theology. (6) Overemphasis on the human author: Biblicism neglects the divine author’s intent and ability to transcend any one human author. As a result, biblicism struggles to explain the unity of the canon and Christological fulfillment, nor does it provide the metaphysic necessary to explain the attributes of Scripture like inspiration and inerrancy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/matthew-barrett.html">Matthew Barrett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformation as Renewal: Retrieving the One, Holy, Catholic &amp; Apostolic Church (Zondervan, 2023)</cite>, p. 21</span></figcaption>

</figure><figure class="quote" id="q-2850ed89a9" data-kw="">
<blockquote><p>The increasingly rationalistic biblicism of the Socinian movement in its seventeenth- century forms posed an even more intense problem for the Reformed orthodox… the Socinians opposed the balance of revelation and reason advocated by the Reformed and claimed a fundamental biblical basis for their doctrine and repudiated natural theology — at the same time that they argued against the simplicity and infinity of God, denied the Trinity and the two natures of Christ, and proposed an alternative view of the work of Christ. From the Reformed perspective, all of these doctrines appeared to be at the same time the result of a new rationalism and a radically deviant exegesis. On all of these points, the high orthodox developed detailed argumentation: elements of debate not found in the Reformation and early orthodox era theologies, but arguably presented in defense of the same basic body of doctrine.</p></blockquote>

<blockquote><p>The [Westminster] confession… acknowledges that issues of worship and church government must be inferred in a general way from Scripture in concert with “the light of nature and Christian precedence.” [WCF 1.6] The doctrine of Scripture is thus safeguarded from a wooden rationalism, and, in the life of the church, the realm of adiaphora is carefully marked out and preserved from a rigoristic biblicism.</p></blockquote>

</figure><figure class="quote" id="q-c9e7fbca84" data-kw="">
<blockquote><p>The rise and development of Socinianism in the seventeenth century cannot entirely account for the variant trinitarianisms of the age, including the English debates of the 1640s and 1650s, the variant language and historical perspectives of the Cambridge Platonists, and the doctrinal alternative proposed by Milton. In addition to the spread of a rational and biblicistic Socinian critique of traditional dogmatic language, the antitrinitarianism of the era was also fueled by developments in philosophy that challenged either the Christianized versions of Aristotelianism that had been the norm in theological usage or the older Aristotelian models themselves. The new philosophies of the seventeenth century tended to detach themselves from traditional conceptions of essence, substance, and individuality and, in so doing, critiques not only the older philosophy but also the theology that had grown attached to it and had reached, during the course of centuries, a linguistic concordat with traditional philosophical vocabulary. Notable here is the alteration in meaning of such terms as “substance” and “essence” that can be traced among the various philosophical schools of the seventeenth century. In 1611, Randle Cotgrave defined the French substance as “substance, matter, stuffe,” substanciel as “substantiall, stuffie,” and essence as “an essence or being, the nature or subsistence of things”—perhaps reflecting a movement away from the older dual philosophical usage of “essence” to mean both the individuality and the quiddity, or whatness, of a thing, toward understanding the term in a more material and exclusively individual sense, perhaps more as haeccitas [this-ness] than as quidditas [what-ness]. His definition of substance, moreover, carries only the connotation of primary substance, the actual stuff or material identity of a thing, and not the connotation of secondary substance, the species or genus of a thing. Of course, when one looks to the technical manuals, there is little difference on the point between Thomas Wilson’s Rule of Reason (1551/52) and Thomas Spencer’s Art of Logick (1628): both offer the identification of “first” or primary substance as the individual thing and “second” or secondary substance as the kind of thing, namely, the species or genus.</p></blockquote>

itas+%5Bthis-ness%5D+than+as+quidditas+%5Bwhat-ness%5D.+His+definition+of+substance%2C+moreover%2C+carries+only+the+connotation+of+primary+substance%2C+the+actual+stuff+or+material+identity+of+a+thing%2C+and+not+the+connotation+of+secondary+substance%2C+the+species+or+genus+of+a+thing.+Of+course%2C+when+one+looks+to+the+technical+manuals%2C+there+is+little+difference+on+the+point+between+Thomas+Wilson%E2%80%99s+Rule+of+Reason+%281551%2F52%29+and+Thomas+Spencer%E2%80%99s+Art+of+Logick+%281628%29%3A+both+offer+the+identification+of+%E2%80%9Cfirst%E2%80%9D+or+primary+substance+as+the+individual+thing+and+%E2%80%9Csecond%E2%80%9D+or+secondary+substance+as+the+kind+of+thing%2C+namely%2C+the+species+or+genus.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+2nd+ed.+%28Baker+Academic%2C+2003%29%2C+vol.+4%2C+pp.+99%E2%80%93100&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9e7fbca84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9e7fbca84.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-biblicism/#:~:text=The%20rise%20and%20development%20of%20Socinianism,thing%2C%20namely%2C%20the%20species%20or%20genus&amp;text=The%20rise%20and%20development%20of%20Socinianism%20in%20the&amp;text=kind%20of%20thing%2C%20namely%2C%20the%20species%20or%20genus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>By this method (as I have before observed) the dishonesty of those men is sufficiently rebuked, who censure Moses for not speaking with greater exactness. For as it became a theologian, he had respect to us rather than to the stars. Nor, in truth, was he ignorant of the fact, that the moon had not sufficient brightness to enlighten the earth, unless it borrowed from the sun; but he deemed it enough to declare what we all may plainly perceive, that the moon is a dispenser of light to us. That it is, as the astronomers assert, an opaque body, I allow to be true, while I deny it to be a dark body. For, first, since it is placed above the element of fire, it must of necessity be a fiery body.† Hence it follows, that it is also luminous; but seeing that it has not light sufficient to penetrate to us, it borrows what is wanting from the sun.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Gen.</cite>, 1:15</span></figcaption>

</figure><figure class="quote" id="q-7f085aca17" data-kw="">
<blockquote><p>16. The greater light I have said, that Moses does not here subtilely descant, as a philosopher, on the secrets of nature, as may be seen in these words. First, he assigns a place in the expanse of heaven to the planets and stars; but astronomers make a distinction of spheres, and, at the same time, teach that the fixed stars have their proper place in the firmament. Moses makes two great luminaries; but astronomers prove, by conclusive reasons that the star of Saturn, which on account of its great distance, appears the least of all, is greater than the moon. Here lies the difference: Moses wrote in a popular style things which without instruction, all ordinary persons, endued with common sense, are able to understand; but astronomers investigate with great labor whatever the sagacity of the human mind can comprehend. Nevertheless, this study is not to be reprobated, nor this science to be condemned, because some frantic persons are wont boldly to reject whatever is unknown to them. For astronomy is not only pleasant, but also very useful to be known: it cannot be denied that this art unfolds the admirable wisdom of God. Wherefore, as ingenious men are to be honored who have expended useful labor on this subject, so they who have leisure and capacity ought not to neglect this kind of exercise. Nor did Moses truly wish to withdraw us from this pursuit in omitting such things as are peculiar to the art; but because he was ordained a teacher as well of the unlearned and rude as of the learned, he could not otherwise fulfill his office than by descending to this grosser method of instruction. Had he spoken of things generally unknown, the uneducated might have pleaded in excuse that such subjects were beyond their capacity. Lastly since the Spirit of God here opens a common school for all, it is not surprising that he should chiefly choose those subjects which would be intelligible to all. If the astronomer inquires respecting the actual dimensions of the stars, he will find the moon to be less than Saturn; but this is something abstruse, for to the sight it appears differently. Moses, therefore, rather adapts his discourse to common usage. For since the Lord stretches forth, as it were, his hand to us in causing us to enjoy the brightness of the sun and moon, how great would be our ingratitude were we to close our eyes against our own experience? There is therefore no reason why janglers should deride the unskilfulness of Moses in making the moon the second luminary; for he does not call us up into heaven, he only proposes things which lie open before our eyes. Let the astronomers possess their more exalted knowledge; but, in the meantime, they who perceive by the moon the splendor of night, are convicted by its use of perverse ingratitude unless they acknowledge the beneficence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Gen.</cite>, 1:16</span></figcaption>

</figure><figure class="quote" id="q-8292d341b5" data-kw="">
<blockquote><p>I do not doubt that the most ancient fathers, to whom the coming night was the end of one day and the beginning of another, followed this mode of reckoning. Although Moses did not intend here to prescribe a rule which it would be criminal to violate; yet (as we have now said) he accommodated his discourse to the received custom. Wherefore, as the Jews foolishly condemn all the reckonings of other people, as if God had sanctioned this alone; so again are they equally foolish who contend that this modest reckoning, which Moses approves, is preposterous. The first day: Here the error of those is manifestly refuted, who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Gen.</cite>, 1:5</span></figcaption>

<blockquote><p>It is designed primarily for the intelligent reader rather than for the scholar. In the process of popularization much had to be diluted, ommitted or condensed. In many areas the presentation is very sketchy, though, I hope, authentic and accurate.</p></blockquote>

— William Chomsky, Hebrew: The Eternal Language (Philadelphia: Jewish Publication Society, 1957) 340 pp. ToC Chart of paleo-Hebrew: p. 87., p. vii">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+designed+primarily+for+the+intelligent+reader+rather+than+for+the+scholar.+In+the+process+of+popularization+much+had+to+be+diluted%2C+ommitted+or+condensed.+In+many+areas+the+presentation+is+very+sketchy%2C+though%2C+I+hope%2C+authentic+and+accurate.%E2%80%9D%0A%0A%E2%80%94+William+Chomsky%2C+Hebrew%3A+The+Eternal+Language+%28Philadelphia%3A+Jewish+Publication+Society%2C+1957%29+340+pp.+ToC+Chart+of+paleo-Hebrew%3A+p.+87.%2C+p.+vii&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff44781459e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f44781459e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/textual-criticism-of-the-old-testament/#:~:text=It%20is%20designed%20primarily%20for%20the,though%2C%20I%20hope%2C%20authentic%20and%20accurate&amp;text=It%20is%20designed%20primarily%20for%20the%20intelligent%20reader&amp;text=very%20sketchy%2C%20though%2C%20I%20hope%2C%20authentic%20and%20accurate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2ad5ec154a" data-kw="">
<blockquote><p>The Masoretes… mentioned even what they regarded as unusual accents, vowel points, and spelling. They recorded a number of variant readings — on the average of about one to a page of a printed Hebrew Old Testament— and they made reference to eighteen corrections attributed to the scribes before them… Their high regard for the text that had come down to them is evidenced by their placing in the margin readings which they believed to be correct and leaving the text itself unaltered… The view of P. de Lagarde that after A.D. 130 all manuscripts of the Hebrew Bible were closely fashioned after one archetype which had been decided on not long before that date has not been accepted by all; but it is at least the case that a type of text basically that of the Masoretes existed around A.D. 100 and that this text subsequently overcame whatever competitors it had…. Dr. [William H.] Green calls attention to the fact that Origen and Jerome place on translators or transcribers of the Septuagint the responsibility for the variations of the Septuagint from the Hebrew text known to them and do not entertain any belief that the Hebrew text had been altered. Pfeiffer expresses the opinion that Origen was misled by reason of a virtual fixation of the Hebrew text which had occurred [after the Septuagint but] before his time and by reason of the notable agreement among the available Hebrew manuscripts. But it is nevertheless important to observe that neither Origen nor Jerome nor any other early writer evidences any suspicion that a real revision or a fixation of the Hebrew text had occurred after the time of the Septuagint. Dr. Green does not deny the possibility that the Septuagint may have been made from a Hebrew text considerably, if not substantially, different from the text in use in Origen’s day. He thinks it quite possible that there may have been some inferior manuscripts of the Old Testament in use, especially among Jews outside of Palestine; but he holds that, even if this were the case, it would not follow that no authoritative text then existed and that there were no standard copies from which the traditional text has descended. He states a truth quite important in this connection that ‘reverence for the Scriptures and regard for the purity of the sacred text did not first originate after the fall of Jerusalem.’ …the counting of the letters, words, verses, and sections in all the books, the noting of the location of the middle letters and words of every book, and the marking of them at times by a letter of abnormal size. He [William Green] remarks that the Talmud regards all this as old and as performed by the early scribes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-h-skilton.html">John H. Skilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Transmission of the Hebrew Text’ from ‘The Transmission of the Scriptures’ in eds. N.B. Stonehouse &amp; Paul Woolley, The Infallible Word: A Symposium by the Members of the Faculty of Westminster Theological Seminary, rev. ed. (Philadelphia: Presbyterian &amp; Reformed, 1967) at Bible-Researcher</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></span></div>

regarded%20as%20unusual%20accents&amp;text=old%20and%20as%20performed%20by%20the%20early%20scribes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d1d7a46bae" data-kw="">
<blockquote><p>Section 14. It is no doubt but that in the copies we now enjoy of the Old Testament there are some diverse readings, or various lections… the various lections of Ben-Asher or Rabbi Aaron the son of Rabbi Moses of the tribe of Asher, and Ben Nepthali, or R: Moses the son of David of the tribe of Nepthali; of the East and Western Jews, which we have collected at the end of the great Bible with the Masora, evince it. But yet we affirm that the whole Word of God, in every letter and tittle, as given from Him by inspiration, is preserved without corruption. Where there is any variety it is always in things of less, indeed of no importance. God by his providence preserving the whole entire, suffered this lesser variety to fall out, in or among the copies we have, for the quickening and exercising of our diligence in our search into his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Divine Original, with the Authority, Self-Evidencing Power &amp; Light of the Holy Scriptures, ch. 1 in Of the Divine Original, Authority, Self-Evidencing Light &amp; Power of the Scriptures. With an Answer to that Enquiry… (Oxford: Hall, 1659)</cite>, pp. 13-14</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Section 14. It is no doubt but that in the copies we now enjoy of the Old Testament there are some diverse readings, or various lections… the various lections of Ben-Asher or Rabbi Aaron the son of Rabbi Moses of the tribe of Asher, and Ben Nepthali, or R: Moses the son of David of the tribe of Nepthali; of the East and Western Jews, which we have collected at the end of the great Bible with the Masora, evince it. But yet we affirm that the whole Word of God, in every letter and tittle, as given from Him by inspiration, is preserved without corruption. Where there is any variety it is always in things of less, indeed of no importance. God by his providence preserving the whole entire, suffered this lesser variety to fall out, in or among the copies we have, for the quickening and exercising of our diligence in our search into his Word.”

— John Owen, Of the Divine Original, with the Authority, Self-Evidencing Power &amp; Light of the Holy Scriptures, ch. 1 in Of the Divine Original, Authority, Self-Evidencing Light &amp; Power of the Scriptures. With an Answer to that Enquiry… (Oxford: Hall, 1659), pp. 13-14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSection+14.+It+is+no+doubt+but+that+in+the+copies+we+now+enjoy+of+the+Old+Testament+there+are+some+diverse+readings%2C+or+various+lections%E2%80%A6+the+various+lections+of+Ben-Asher+or+Rabbi+Aaron+the+son+of+Rabbi+Moses+of+the+tribe+of+Asher%2C+and+Ben+Nepthali%2C+or+R%3A+Moses+the+son+of+David+of+the+tribe+of+Nepthali%3B+of+the+East+and+Western+Jews%2C+which+we+have+collected+at+the+end+of+the+great+Bible+with+the+Masora%2C+evince+it.+But+yet+we+affirm+that+the+whole+Word+of+God%2C+in+every+letter+and+tittle%2C+as+given+from+Him+by+inspiration%2C+is+preserved+without+corruption.+Where+there+is+any+variety+it+is+always+in+things+of+less%2C+indeed+of+no+importance.+God+by+his+providence+preserving+the+whole+entire%2C+suffered+this+lesser+variety+to+fall+out%2C+in+or+among+the+copies+we+have%2C+for+the+quickening+and+exercising+of+our+diligence+in+our+search+into+his+Word.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Of+the+Divine+Original%2C+with+the+Authority%2C+Self-Evidencing+Power+%26+Light+of+the+Holy+Scriptures%2C+ch.+1+in+Of+the+Divine+Original%2C+Authority%2C+Self-Evidencing+Light+%26+Power+of+the+Scriptures.+With+an+Answer+to+that+Enquiry%E2%80%A6+%28Oxford%3A+Hall%2C+1659%29%2C+pp.+13-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd1d7a46bae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d1d7a46bae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/textual-criticism-of-the-old-testament/#:~:text=Section%2014.%20It%20is%20no%20doubt,in%20our%20search%20into%20his%20Word&amp;text=Section%2014.%20It%20is%20no%20doubt%20but%20that&amp;text=our%20diligence%20in%20our%20search%20into%20his%20Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-180a0bc941" data-kw="">
<blockquote><p>It would be tedious now to enumerate, what great additions and omissions the Septuagint has made, and all the passages which in church-copies are marked with daggers and asterisks. The Jews generally laugh when they hear our version of this passage of Isaiah, ‘Blessed is he that has seed in Zion and servants in Jerusalem.’ In Amos also after a description of self-indulgence Amos 6:4-6 there come these words: ‘They have thought of these things as halting and not likely to fly,’ a very rhetorical sentence quite worthy of Tully. But how shall we deal with the Hebrew originals in which these passages and others like them are omitted, passages so numerous that to reproduce them all would require books without number? The number of the omissions is shown alike by the asterisks mentioned above and by my own version when compared by a careful reader with the old translation. Yet the Septuagint has rightly kept its place in the churches, either because it is the first of all the versions in time, made before the coming of Christ, or else because it has been used by the apostles (only however in places where it does not disagree with the Hebrew).</p></blockquote>

target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-281f1ebbf1" data-kw="">
<blockquote><p>From this discrepancy between the Hebrew [Jews’] books [i.e. the Septuagint] and our own arises the well-known question as to the age of Methuselah; for it is computed that he lived for fourteen years after the deluge, though Scripture relates that of all who were then upon the earth only the eight souls in the ark escaped destruction by the flood, and of these Methuselah was not one… …that they may not cast a slight on the trustworthiness of versions which the Church has received into a position of high authority, and because they believe that the Jewish manuscripts rather than our own are in error. For they do not admit that this is a mistake of the [Septuagint] translators, but maintain that there is a falsified statement in the original, from which, through the Greek, the Scripture has been translated into our own tongue. They say that it is not credible that the seventy translators, who simultaneously and unanimously produced one rendering, could have erred, or, in a case in which no interest of theirs was involved, could have falsified their translation; but that the Jews, envying us our translation of their Law and Prophets, have made alterations in their texts so as to undermine the authority of ours. This opinion or suspicion let each man adopt according to his own judgment. Certain it is that Methuselah did not survive the flood, but died in the very year it occurred, if the numbers given in the Hebrew manuscripts are true. My own opinion regarding the seventy translators I will, with God’s help, state more carefully in its own place, when I have come down (following the order which this work requires) to that period in which their translation was executed.</p></blockquote>

</figure><figure class="quote" id="q-302bbb00a4" data-kw="">
<blockquote><p>The Greek interpreter has translated this place more unfitly, using for ‘burnt offerings’, the general word ‘sacrifice’: somewhat also he leaves out, as namely that particle ‘all’ and he adds many things of his own; all which Jerome has rightly amended according to the truth of the Hebrew text. Now seeing the Greek translations are in diverse places faulty, and seeing that in all things we must follow the Hebrew, hereafter we will not much trouble ourselves about the Greek, unless peradventure we shall find anything worth the observation. God be thanked that in these days he has restored the knowledge of the Hebrew tongue, through ignorance whereof those that are unskillful will hardly believe how, often and how greatly the most learned Greek interpreters have erred in the true exposition of all the sacred books of the Old Testament, and especially of this; as also very many of the Latin interpreters, after Jerome’s emendations, but I return to the matter. For these things I touch in a manner against my will, which nevertheless I would have diligently to be marked of those, who bend themselves to the study of divinity, seeing it has pleased God in this age to make the Hebrew tongue so familiar unto us, lest with the Fathers in many places they err from the true and natural sense of the Scriptures; yet we must always that reverence which is due to men of such learning and antiquity.</p></blockquote>

<blockquote><p>Did you know that the first editions of the Belgic Confession included two proof-texts from the apocrypha? Did you know that our contemporary editions continue to include one small quote from the apocrypha? Elsewhere in his writings, Guido de Brès referred more often to these non-canonical writings. Moreover, de Brès was not exceptional in doing this. Other Reformers did likewise, and so did other Reformed confessions. In this paper, I outline de Brès’ use of the apocrypha, put it in the historical context of the Reformation, and attempt to explain it.</p></blockquote>

<blockquote><p>7. That Word of God was first ἄγραφον [unwritten], afterward ἔγγραφον [enscripturated], materially the same in both cases, even if not formally; [it was the same] intensively, even if not extensively. 8. It alone today is the rule of things to be believed and done, and therefore adequate to its regulated object. 9. As it has its authority comparatively from itself, so also it has it in itself, and although it can be persuaded to us through other means, yet it cannot be persuaded except through that very light which it has in itself, just as also the sun can be seen only by its own light. 10. The authority of the Church, whatever it may be, can be here εἰσαγωγική [introductory] and διηγητική [expository], but cannot be αὐθεντική [self-authorizing] or αὐτοπιστική [self-credentialing]; for although the Holy Spirit uses both the intrinsic light of Scripture and the extrinsic light of the Church in impressing faith concerning Scripture upon us, yet the former is the primary medium and motive, the latter only secondary. 11. The Church can use unwritten traditions whether public of councils or private of fathers, but ought not to rely upon them. And traditions subalternate to Scripture must always be distinguished from those opposed to it; the former to be admitted, the latter to be rejected. 12. All dogmatic traditions of the Roman Church fabricated outside God’s word are opposed to God’s word, ritual ones for the greatest part of them. 13. Neither the constitution of the [Biblical] canon nor the interpretation of the constituted canon ultimately rests on the authority of the Church. 14. The αὐτοκρατορικός [absolute ruler], judge of controversies, is the one Spirit of God, the κανονικός [normative] judge is sacred Scripture, the ὀργανικός [instrumental] or λειτουργικός [ministerial] judge is the Church, but the one which is true, not the one which merely professes itself to be true. 15. But Scripture is a real Judge, not personal, whence vain are the argumentations which are drawn against the real judge from the characteristics of a personal judge.</p></blockquote>

<blockquote><p>5. We accept, secondly, on the topic of a rule: I. That the rule or measure of a thing must be marked &amp; easy. Suarez, Metaphysics, pt. 2, distinction II, section 3, because it must be accommodated to the knowledge of a thing. Therefore, since the Scripture is a rule, it is not obscure and difficult, as the Papists will. II. A rule has a parity of proportion to that thing that it is the rule of. If, therefore, the Scripture is the rule of faith, faith does not extend beyond the Scripture: and therefore, unwritten traditions do not at all pertain to faith. III. A rule that is such by its nature has in itself the reason of its exemplary cause, and is therefore prior by nature to the thing it regulates. If, therefore, the Scripture is the rule of faith, it is indeed prior to faith: if it is prior to faith, then also to the faithful; and if to the faithful, then to the church, which is the congregation of the faithful, and so it is that the Roman church banishes it from that superior place in which it tends to set its own self with some nefarious presumption, as if it were ahead of and above the Scripture. IV. A rule consists in something indivisible; that is, so constituted that the least bit is neither increased or diminished. They therefore violate the Scriptures who join to them their own traditions or abolish anything whatsoever prescribed by them: and the Roman Pontiffs are manifestly possessed of both these evils. V. If Scripture is the rule of faith, then those who can err in the exposition of Scripture can indeed err in faith, and commend a false rule of faith to others. That, however, the Pope and the Roman church interpret many parts of Scripture insipidly and impiously is so manifest that it need not be proven. Therefore, the Roman Pontiff may shamefully err in his decrees, even concerning faith and morals. VI. Since such is the nature of this rule, that it be a precept, anything admitted without the direction of this rule, of what species soever it otherwise be, is anomalous, and an aberration: and therefore, as much the supererogations of the Papists as their many dogmas (concerning the worship of images and creatures, purgatory, the mass itself, and the Roman Pontiff) must be acknowledged to necessarily be mere error. VII. Since the Scripture is not indeed a single precept, but a system of precepts respecting the same thing (namely, that we live well to God), it is necessary that it contain within itself the whole doctrine of theology: therefore, what thing sover the Roman Pontiff obtrudes without Scripture must be alien to true theology. VIII. Finally, since it is the rule of faith, they must be enemies of the faithful who snatch that rule from their hands. 6. We accept those qualities conceded to Scripture from Bellarmine, that it is a certain and stable rule of faith. For: I. If it is, in itself, a certain rule, then it can leave us certain of the will of God, without the definitions of the church. II. Then all uncertainties, the lie of men, are by the decree of God to be examined according to that rule. III. Then it does not admit various and uncertain senses. IV. Then a certain determination is to be sought from Scripture of all controversies which are stirred up concerning the faith. V. If it is indeed a stable rule, then nothing is necessary to be believed by us, or useful, which was unknown in the age of the apostles. VI. Then the dispensations of the Papists are pernicious impostures. VII. Then, finally, the stability of the church entirely depends upon this: if it constantly adheres to this rule.</p></blockquote>

<blockquote><p>1… in [you, Edward Bagshaw] saying I deny the Scripture to be a perfect rule, when I still say, ‘It is a perfect rule so far as it is a rule’! 2. If you intend sense and truth, your argument must run thus: ‘He that says the Scripture is not a particular rule, commanding the thing in particular, but only a general rule, for the meter and tunes of psalms, for the dividing of itself into chapters and verses, for the hour and place of meetings, for the choice of a text to preach on, and words and method of sermon and prayer, for the naming or determining the person that shall be a pastor, for the form of pulpits, tables, cups, etc. yea, for the making of a clock, or watch, or hour-glass, to measure the time by, or for building the house to preach in, etc. He that says these are not determined of particularly in Scripture, but only under the general rule of doing all things to God’s glory, to edification, decently and in order, etc. this man does deny Scripture to be a perfect rule, and labors to overthrow the foundation of faith and practice, and proving what he says by the ill consequences that else will follow, will in the end be found in perfect folly and madness, reproved by God and found a liar: But such a one is R.B. Therefore, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw… (London: Simmons, 1671), section 74</cite>, pp. 160-61</span></figcaption>

<blockquote><p>This doctrine [of the inner testimony of the Holy Spirit] was opposed, however, from the side of Sociniaism, Remonstrantism, and Romanism. And gradually the doctrine of the internal testimony began to lose its place of honor even in Reformed theology. Already in Turretin, Amyrald, Molina, et al., it was weakened and identified with the so-called illumination of the Holy Spirit by which the intellect is enabled to note the marks and criteria of the divinity of the Holy Scripture. Faith no longer connects directly and immediately with Scripture but is the product of insight into the marks of truth and divinity it bears. Inserted between Scripture and faith, then, are the marks of the truth of Scripture. This occurred first in the sense that the recognition of those criteria was attributed to an illumination of the intellect by the Holy Spirit. But rationalism soon also considered this illumination unnecessary, assigned the study of the truth of revelation to reason, and base[d] the authority of Scripture on historical proofs. Even orthodox theologians scarcely dared any longer to speak of the internal testimony [Wilhelmus A’Brakel and Johannes Marck are cited as examples].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 1</cite>, pp. 584-85</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This doctrine [of the inner testimony of the Holy Spirit] was opposed, however, from the side of Sociniaism, Remonstrantism, and Romanism. And gradually the doctrine of the internal testimony began to lose its place of honor even in Reformed theology. Already in Turretin, Amyrald, Molina, et al., it was weakened and identified with the so-called illumination of the Holy Spirit by which the intellect is enabled to note the marks and criteria of the divinity of the Holy Scripture. Faith no longer connects directly and immediately with Scripture but is the product of insight into the marks of truth and divinity it bears. Inserted between Scripture and faith, then, are the marks of the truth of Scripture. This occurred first in the sense that the recognition of those criteria was attributed to an illumination of the intellect by the Holy Spirit. But rationalism soon also considered this illumination unnecessary, assigned the study of the truth of revelation to reason, and base[d] the authority of Scripture on historical proofs. Even orthodox theologians scarcely dared any longer to speak of the internal testimony [Wilhelmus A’Brakel and Johannes Marck are cited as examples].”

— Herman Bavinck, Reformed Dogmatics, vol. 1, pp. 584-85">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+doctrine+%5Bof+the+inner+testimony+of+the+Holy+Spirit%5D+was+opposed%2C+however%2C+from+the+side+of+Sociniaism%2C+Remonstrantism%2C+and+Romanism.+And+gradually+the+doctrine+of+the+internal+testimony+began+to+lose+its+place+of+honor+even+in+Reformed+theology.+Already+in+Turretin%2C+Amyrald%2C+Molina%2C+et+al.%2C+it+was+weakened+and+identified+with+the+so-called+illumination+of+the+Holy+Spirit+by+which+the+intellect+is+enabled+to+note+the+marks+and+criteria+of+the+divinity+of+the+Holy+Scripture.+Faith+no+longer+connects+directly+and+immediately+with+Scripture+but+is+the+product+of+insight+into+the+marks+of+truth+and+divinity+it+bears.+Inserted+between+Scripture+and+faith%2C+then%2C+are+the+marks+of+the+truth+of+Scripture.+This+occurred+first+in+the+sense+that+the+recognition+of+those+criteria+was+attributed+to+an+illumination+of+the+intellect+by+the+Holy+Spirit.+But+rationalism+soon+also+considered+this+illumination+unnecessary%2C+assigned+the+study+of+the+truth+of+revelation+to+reason%2C+and+base%5Bd%5D+the+authority+of+Scripture+on+historical+proofs.+Even+orthodox+theologians+scarcely+dared+any+longer+to+speak+of+the+internal+testimony+%5BWilhelmus+A%E2%80%99Brakel+and+Johannes+Marck+are+cited+as+examples%5D.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%2C+vol.+1%2C+pp.+584-85&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76dcfbe253.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76dcfbe253.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-authority-of-the-bible/#:~:text=This%20doctrine%20%5Bof%20the%20inner%20testimony,Johannes%20Marck%20are%20cited%20as%20examples&amp;text=This%20doctrine%20%5Bof%20the%20inner%20testimony%20of%20the&amp;text=A%E2%80%99Brakel%20and%20Johannes%20Marck%20are%20cited%20as%20examples" rel="noopener" <blockquote><p>I. Is Scripture so perfect that it contains all the doctrines necessary for salvation? Yes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Practical Theological Disputation on Sin, pt. 2’ tr. Onku with AI (Leiden: Johann Elsevir, 1660), Corollaries Latin</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“I. Is Scripture so perfect that it contains all the doctrines necessary for salvation? Yes.”

— Johannes Hoornbeeck, ‘A Practical Theological Disputation on Sin, pt. 2’ tr. Onku with AI (Leiden: Johann Elsevir, 1660), Corollaries Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+Is+Scripture+so+perfect+that+it+contains+all+the+doctrines+necessary+for+salvation%3F+Yes.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98A+Practical+Theological+Disputation+on+Sin%2C+pt.+2%E2%80%99+tr.+Onku+with+AI+%28Leiden%3A+Johann+Elsevir%2C+1660%29%2C+Corollaries+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7271c88499.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7271c88499.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-sufficiency-of-scripture/#:~:text=I.%20Is%20Scripture%20so%20perfect%20that,the%20doctrines%20necessary%20for%20salvation%3F%20Yes&amp;text=I.%20Is%20Scripture%20so%20perfect%20that%20it%20contains&amp;text=contains%20all%20the%20doctrines%20necessary%20for%20salvation%3F%20Yes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6d00dcdf01" data-kw="">
<blockquote><p>That which is owned among Protestants in common is this: That the Holy Scriptures are the only, and sufficient guide and rule, in all matters of necessary belief and observance in order unto salvation; able to make us wise unto salvation; and therefore, whosoever does either derogate from this their perfection, or add any thing unto them, as necessary to be believed or done in order unto salvation, are certainly guilty of most presumptuous and unaccountable profaneness: and this we justly tax the Church of Rome withal, for enjoining of unwritten traditions and Papal determinations to be received with an equal reverence unto the holy Scriptures. But then it is not their meaning, by virtue of this declaration, to condemn all opinions, as false, and actions as unlawful, which the Holy Scripture prescribes not; or to extend the perfection of holy Scripture so far as the punctual determination of the circumstantials of divine worship. The perfection of God’s Word is judged by them with relation unto that special end whereto it is designed; viz. the instruction of men in all things necessary unto salvation; the knowledge whereof they could not otherwise attain unto than by divine revelation; for it was not aimed to destroy or extinguish the light of nature, but to help, advance and perfect it. It is not therefore any of God’s purpose in the holy Scriptures, to comprize all things which men may know, believe or practice, as if natural reason and discretion were no longer to continue it’s guidance; or to determine all rituals and circumstances appertaining to the external ordering of divine worship, so as to have nothing for ecclesiastical laws to be employed about. That, which they teach of the Scripture’s sufficiency is ever restrained to matters of necessary belief and duties of necessary observance in order unto salvation; and never enlarged to all things that may be believed or done by us in the general, or to particular circumstances, which have respect unto the good order, decency, and external regulation of divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/benjamin-camfield.html">Benjamin Camfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Examination of the Independents’ Catechism &amp; therein of the Chief Principles of Non-Conformity to, &amp; Separation from the Church of England (London: Redmayne, 1668), ch. 1, pp. 2-4 Camfield defended the Anglican ceremonies.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

</figure><figure class="quote" id="q-615059786d" data-kw="">
<blockquote><p>There is, brethren, one God, the knowledge of whom we gain from the Holy Scriptures, and from no other source. For just as a man if he wishes to be skilled in the wisdom of this world will find himself unable to get at it in any other way than by mastering the dogmas of philosophers, so all of us who wish to practice piety will be unable to learn its practice from any quarter than the oracles of God. Whatever things then the Holy Scriptures declare, at these let us look; and whatsoever things they teach these let us learn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/hippolytus.html">Hippolytus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies, 9</cite></span></figcaption>

<blockquote><p>The Papists’ confession of the sufficiency of our Belief: Council of Basil, Oration of Ragus., Bin. p. 299: ‘The holy Scripture in the literal sense, soundly and well understood, is the infallible and most sufficient rule of faith.’ Bellarmine, Of the Word of God, bk. 4, ch. 11 ‘In the Christian doctrine both of Faith and manners, some things are simply necessary to salvation, to all, as the knowledge of the articles of the Apostles’ Creed, of the Ten Commandments and of some sacraments: The rest are not so necessary that a man cannot be saved without the explicit knowledge, belief and profession of them—These things that are simply necessary, and are profitable to all, the apostles preached to all— All things are written by the apostles which are necessary to all, and which they openly preached to all.’ (See the place.) Costenus, Enchiridion, ch. 1, p. 49 ‘Non inficiamur praecipua illa fidei capita quae omnibus Christians cognitu sunt ad salutem necessaria, perspicue satis esse apostolicis scriptis comprehensa.’ [We do not deny that those principal articles of faith which all Christians know and which are necessary for salvation are set forth quite clearly enough in the apostolic writings.]</p></blockquote>

<blockquote><p>Let us give place and consent to the Holy Scripture (says St. Augustine) for it can neither deceive nor be deceived. The bishops also and clergy of England in the epistle of their book to the King’s grace (De peccatorum meritis et remissione, ch. 22) do affirm that holy Scripture alone shows men the right path to come to God to see Him, to know Him, to love Him, to serve Him and so to serve Him as He most desires. Wherefore they are rather obstinate against God, which instead of his only Word, preach and teach other doctrines.</p></blockquote>

</figure><figure class="quote" id="q-68759469ef" data-kw="">
<blockquote><p>For he that is nether hot nor cold, but indifferent to use the college of God’s Word and Christ’s Church, with the word and gloss of man that teaches the use of images in the church, before he can prove by authority of God’s Word that they may be suffered in the church does not well, they have been the occasion of great hurt and idololatry the church of the Old Testament nor the New never taught the people with images. Therefore it shall be the office of every man that loves God and his Word to follow the Scripture only.</p></blockquote>

</figure><figure class="quote" id="q-9c7da9c85b" data-kw="">
<blockquote><p>Now I find that Mr. [Richard ]Hooker [an Anglican] says two things to this: 1. That Scripture does regulate all our moral actions, but not scripture only, for the Law of nature and the most concealed instincts of nature, and other principles may warrant our actions: We move (says he), we sleep, we take the cup at the hand of our friend; a number of things we often do only to satisfy some natural desire without present express and actual reference to any commandment of God, unto his glory; even these things are done which we naturally perform, and not only that which naturally and spiritually we do, for by every effect proceeding from the most concealed instincts of nature, his power is made manifest. But it does not therefore follow, that of necessity we shall sin unless we expressly intend the glory of God in every such particular. [Rutherford’s] Answer: …I answer that as: [1.] there be some actions in man purely and spiritually, but supernaturally, moral, as to believe in Christ for remission of sins, to love God in Christ: these the Gospel does regulate. 2. There be some actions naturally moral in the substance of the act, as many things commanded and forbidden in the Moral Law; and these are to be regulated by the Law of nature and the Moral Law: 3. There be some actions mixed, as such actions in which nature, or concealed instincts of nature are the chief principles, yet in and about these actions, as in their modification of time, place, and manner and measure, there is a special morality, in regard of which they are to be ruled by the Word; Such mixed actions as these that are mentioned by Hooker, as to move, sleep, take the cup at the hand of a friend, cannot be called simply moral, for to move may be purely natural, as if a man against his will fall off a high place or off a horse, to start in the sleep, are so natural that I know not any morality in them; but sure I am [that] for Nathaniel to come to Christ, which was also done by a natural motion, is not a mere natural action proceeding from the most concealed instincts of nature; so to sleep has somewhat natural in it, for beasts do sleep; beasts do move; I grant they cannot take a cup at the hand of a friend, they cannot salute one another: (It is Hooker’s instance) but fancy sometimes in men do these, whereas conscience should do them: What is natural in moving and sleeping, and what is common to men with beasts, I grant, Scripture does not direct or regulate these acts of moving and sleeping; we grant [that] actions natural and common to us with beasts need not the rule of the Word to regulate them: But this I must say (I speak it, my record is in Heaven, not to offend any) Formalists, as such, and as Prelatical, are irreligious and profane: One of them asked a godly man, ‘Will you have Scripture for giving your horse a peck of oats, and for breaking wind, and easing or obeying nature?’ And therefore they bring in these instances to make sport: But I conceive, sleeping moderately, to enable you to the service of God, as eating, drinking, that God may be glorified, 1 Cor. 10:31, are also in the measure and manner of doing moral, and so ruled by Scripture and Scripture only, and not regulated by natural instincts… Whereas being created according to God’s image, especially, he living in the visible Church, he is to do all his actions deliberate, even natural and moral in Faith, and with a warrant from scripture, to make good their morality, Ps. 119:9; Prov. 3:23-24; 2 Cor. 5:7. And truly Formalists give men in their morals to live at random and to walk without taking heed to their ways according to God’s Word. … Answer: 1. The Law of reason in morals (for of such we now speak) is nothing but the Moral Law and will of God, contained fully in the Scriptures of the Old and New Testament; and therefore is not to be divided from the Scriptures; if a man be ruled in that, he is ruled by Scripture: for a great part of the Bible, of the Decalogue, is printed in the reasonable soul of man: as when he loves his parents, obeys his superiors, saves his neighbor in extreme danger of death, because he does these according to the Law of Reason, shall it follow that these actions which are expressly called [in Greek] Rom. 2:14, the things or duties of the Law, are not warranted by express Scripture because they are done according to the Law of natural reason? I should think the contrary most true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646), Intro, Section 4</cite>, pp. 72-74</span></figcaption>

ral%2C+for+to+move+may+be+purely+natural%2C+as+if+a+man+against+his+will+fall+off+a+high+place+or+off+a+horse%2C+to+start+in+the+sleep%2C+are+so+natural+that+I+know+not+any+morality+in+them%3B+but+sure+I+am+%5Bthat%5D+for+Nathaniel+to+come+to+Christ%2C+which+was+also+done+by+a+natural+motion%2C+is+not+a+mere+natural+action+proceeding+from+the+most+concealed+instincts+of+nature%3B+so+to+sleep+has+somewhat+natural+in+it%2C+for+beasts+do+sleep%3B+beasts+do+move%3B+I+grant+they+cannot+take+a+cup+at+the+hand+of+a+friend%2C+they+cannot+salute+one+another%3A+%28It+is+Hooker%E2%80%99s+instance%29+but+fancy+sometimes+in+men+do+these%2C+whereas+conscience+should+do+them%3A+What+is+natural+in+moving+and+sleeping%2C+and+what+is+common+to+men+with+beasts%2C+I+grant%2C+Scripture+does+not+direct+or+regulate+these+acts+of+moving+and+sleeping%3B+we+grant+%5Bthat%5D+actions+natural+and+common+to+us+with+beasts+need+not+the+rule+of+the+Word+to+regulate+them%3A+But+this+I+must+say+%28I+speak+it%2C+my+record+is+in+Heaven%2C+not+to+offend+any%29+Formalists%2C+as+such%2C+and+as+Prelatical%2C+are+irreligious+and+profane%3A+One+of+them+asked+a+godly+man%2C+%E2%80%98Will+you+have+Scripture+for+giving+your+horse+a+peck+of+oats%2C+and+for+breaking+wind%2C+and+easing+or+obeying+nature%3F%E2%80%99+And+therefore+they+bring+in+these+instances+to+make+sport%3A+But+I+conceive%2C+sleeping+moderately%2C+to+enable+you+to+the+service+of+God%2C+as+eating%2C+drinking%2C+that+God+may+be+glorified%2C+1+Cor.+10%3A31%2C+are+also+in+the+measure+and+manner+of+doing+moral%2C+and+so+ruled+by+Scripture+and+Scripture+only%2C+and+not+regulated+by+natural+instincts%E2%80%A6+Whereas+being+created+according+to+God%E2%80%99s+image%2C+especially%2C+he+living+in+the+visible+Church%2C+he+is+to+do+all+his+actions+deliberate%2C+even+natural+and+moral+in+Faith%2C+and+with+a+warrant+from+scripture%2C+to+make+good+their+morality%2C+Ps.+119%3A9%3B+Prov.+3%3A23-24%3B+2+Cor.+5%3A7.+And+truly+Formalists+give+men+in+their+morals+to+live+at+random+and+to+walk+without+taking+heed+to+their+ways+according+to+God%E2%80%99s+Word.+%E2%80%A6+Answer%3A+1.+The+Law+of+reason+in+morals+%28for+of+such+we+now+speak%29+is+nothing+but+the+Moral+Law+and+will+of+God%2C+contained+fully+in+the+Scriptures+of+the+Old+and+New+Testament%3B+and+therefore+is+not+to+be+divided+from+the+Scriptures%3B+if+a+man+be+ruled+in+that%2C+he+is+ruled+by+Scripture%3A+for+a+great+part+of+the+Bible%2C+of+the+Decalogue%2C+is+printed+in+the+reasonable+soul+of+man%3A+as+when+he+loves+his+parents%2C+obeys+his+superiors%2C+saves+his+neighbor+in+extreme+danger+of+death%2C+because+he+does+these+according+to+the+Law+of+Reason%2C+shall+it+follow+that+these+actions+which+are+expressly+called+%5Bin+Greek%5D+Rom.+2%3A14%2C+the+things+or+duties+of+the+Law%2C+are+not+warranted+by+express+Scripture+because+they+are+done+according+to+the+Law+of+natural+reason%3F+I+should+think+the+contrary+most+true.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government...+%281646%29%2C+Intro%2C+Section+4%2C+pp.+72-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c7da9c85b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c7da9c85b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-sufficiency-of-scripture/#:~:text=Now%20I%20find%20that%20Mr.%20%5BRichard,should%20think%20the%20contrary%20most%20true&amp;text=Now%20I%20find%20that%20Mr.%20%5BRichard%20%5DHooker%20%5Ban&amp;text=reason%3F%20I%20should%20think%20the%20contrary%20most%20true" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

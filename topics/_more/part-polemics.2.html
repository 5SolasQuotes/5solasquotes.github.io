ather of spirits” (Heb. 12:9) with reference to creation, not to composition. The Son of God is God-man (theanthrōpos) not by composition properly so-called, but by hypostatical union (by which the Word [logos] indeed assumed human nature in one hypostasis, but was not compounded with it as part with part; but stood to it in the relation of perfecter and sustainer to make perfect and sustain an essential adjunct, so that the human nature indeed did thence receive perfection, but nothing was added by it to the divine nature). VIII. Composition is in that in which there is more than one real entity, but not where there is only more than one mode because modes only modify and characterize, but do not compose the essence. But in divine things there are one essence and three hypostases (which are modes distinguishing indeed the persons from each other, but not composing because they are not real entities concurring to the composition of some fourth thing, since they have one common essence; but they are only modifications according to which the essence is conceived to subsist in three persons). IX. Simplicity and triplicity are so mutually opposed that they cannot subsist at the same time (but not simplicity and Trinity because they are said in different respects): simplicity in respect to essence, but Trinity in respect to persons. In this sense, nothing hinders God (who is one in essence) from being three persons. X. The decrees of God can be regarded in two ways: either subjectively (if it is right so to speak, i.e., on the part of the internal act in itself and absolutely); or objectively, extrinsically and relatively with respect to creatures (respectively). In the former manner, they do not differ from God himself and are no other than God himself decreeing. But in the latter, they do differ because they may be conceived as many and various (not as to the thing, since God has decreed all things by one single and most simple act, but as to the objects), even as the knowledge of God is conversant with innumerable objects without detriment to his unity. XI. The decrees of God are free, not absolutely and as to the principle, but relatively and objectively and as to the end. For there could be no external object necessarily terminating to the divine will, for God stands in need of nothing out of himself. Therefore they could be and not be. But this does not hinder them from being called necessary as to the principle and internal act because the act of intelligence and will could not be absent from God at all. He could not be God without intelligence and will. They are necessary, therefore, as to internal existence, but free as to external relation (schesin) and habit. Nor can the will of God be said to cease absolutely, but with respect to the external object on which it is terminated. XII. The decrees of God are immanent acts of the divine will, but not properly its effect. God ought not to be called so much the cause as the principle of them. Hence there is no need that they should be posterior to God except in our order and in the manner of conceiving them. XIII. Although the essence of God (considered simply in itself) is absolute and implies no relation to creatures, yet this does not hinder it (when considered with relative opposition to creatures and as determining itself in the manner of vital principle to the production of this or that thing out of itself) from having a certain reference (schesin) and relation to creatures. Nor can that manifold relation make composition in God, more than the relation which his omniscience and omnipotence bear to things ad extra, constituted a real difference between God and his omnipotence and omniscience. XIV. Whatever in God is essential and absolute is God himself. Thus the absolute attributes may be identified really with the divine essence and are in it essentially, not accidentally. If they are predicated of God in the concrete, their subject is only of denomination, not of inhesion (inhaesionis). But whatever is personal and modal in God is indeed God himself in the concrete, though not in the abstract. XV. The relative attributes do not argue composition, but distinction. The formal nature of relations is not to be in, but to be to. Nor do they superadd a new perfection to the essence, but only imply a habitude of the essence to other things. Paternity and dominion do not render him another being, but in a different manner dispose the possessor without superinducing a change in him. XVI. The personal property of the Son does not make his essence different from that of the Father, nor of a simple essence make a composed, for nothing real is added to the essence, rather it only makes the Son distinct from the Father. Distinction is not composition. XVII. The fathers often insist on this simplicity of God. “The nature of God is simple and immutable and undisturbed, nor is he himself one thing and what he is and has another thing” (Augustine, 1. 5, de Trinit. c. 1+). And after teaching that no creature is truly and perfectly simple, he adds: “Now although God may be called manifold, yet he is truly perfectly simple, for he is called great, wise, happy, and true, and whatever with propriety may be said of him. But his greatness is the same as his wisdom, for he is not great in mass, but in virtue, and his goodness is the same as his wisdom and greatness and truth” (The Trinity 6.6, 7* [FC 45:208–9; PL 42.929]). So too Athanasius: “God is not composed who composed all things that they might be; nor is he such as those things are which were made by his word; since he is a simple substance in whom there is no quality nor any shadow of change, as James testifies” (To the Bishops of Africa 8 [NPNF2, 4:493; PG 26.1043]).”

— Francis Turretin, Institutes of Elenctic Theology, trans. George Musgrave Giger, ed. James T. Dennison Jr., vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 3.7 [191–94].">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs+God+most+simple+and+free+from+all+composition%3F+We+affirm+against+Socinus+and+Vorstius+I.+The+Socinians+agitate+this+controversy+with+us+since+they+deny+that+simplicity+can+be+attributed+to+God+according+to+the+Scriptures+and+think+it+should+be+expunged+from+the+number+of+the+divine+attributes+for+no+other+purpose+than+to+weaken+more+easily+the+mystery+of+the+Trinity+by+establishing+the+composition+of+the+divine+essence+%28The+Racovian+Catechism+3.1+%5B1818%5D%2C+p.+33%29.+Vorstius+retained+this+error+%28with+various+others+also%29+and+introduced+it+into+his+Tractatus+theologicus+de+Deo+%281610%29+and+in+the+notes+to+%E2%80%9CDisputatione+III%3A+De+Natura+Dei%E2%80%9D+%28cf.+Tractatus+theologicus+de+Deo+%5B1610%5D%2C+pp.+19%E2%80%9328%29.+With+these+the+Remonstrants+also+agree.+In+their+Apology%2C+they+deny+that+the+simplicity+of+God+is+necessary+to+be+believed+or+that+anything+occurs+in+Scripture+relative+to+it%2C+but+that+the+whole+doctrine+is+metaphysical+whether+you+consider+the+word+or+the+thing+%28%E2%80%9CApologia+pro+confessione+sive+declaratione+%E2%80%A6+Remonstrantes%2C%E2%80%9D+2+in+Episcopius%2C+Operum+theologicorum+%5B1665%5D%2C+Pt.+II%2C+p.+129%29.+But+the+orthodox+have+constantly+taught+that+the+essence+of+God+is+perfectly+simple+and+free+from+all+composition.+II.+Simple+is+used+in+two+senses%3A+either+absolutely+and+simply%3B+or+relatively+and+comparatively.+Absolutely+is+such+as+in+every+kind+of+being+excludes+composition%3B+comparatively+is+such+as+excludes+it+only+with+respect+to+some.+Heaven+and+the+elements+are+called+simple+bodies+with+respect+to+mixed%2C+but+do+not+exclude+composition+from+their+matter+and+form+and+quantitative+parts.+Angels+and+souls+are+simple+with+respect+to+bodies%2C+but+not+absolutely+such+because+they+always+involve+a+composition.+Here+we+speak+of+absolute+and+not+of+comparative+simplicity.+III.+The+simplicity+of+God+considered+not+morally%2C+but+physically%2C+is+his+incommunicable+attribute+by+which+the+divine+nature+is+conceived+by+us+not+only+as+free+from+all+composition+and+division%2C+but+also+as+incapable+of+composition+and+divisibility.+Proof+that+God+is+perfectly+simple.+IV.+This+is+proved+to+be+a+property+of+God%3A+%281%29+from+his+independence%2C+because+composition+is+of+the+formal+reason+of+a+being+originated+and+dependent+%28since+nothing+can+be+composed+by+itself%2C+but+whatever+is+composed+must+necessarily+be+composed+by+another%3B+now+God+is+the+first+and+independent+being%2C+recognizing+no+other+prior+to+himself%29%3B+%282%29+from+his+unity%2C+because+he+who+is+absolutely+one%2C+is+also+absolutely+simple+and+therefore+can+neither+be+divided+nor+composed%3B+%283%29+from+his+perfection%2C+because+composition+implies+imperfection+inasmuch+as+it+supposes+passive+power%2C+dependency+and+mutability%3B+%284%29+from+his+activity%2C+because+God+is+a+most+pure+act+having+no+passive+admixture+and+therefore+rejecting+all+composition+%28because+in+God+there+is+nothing+which+needs+to+be+made+perfect+or+can+receive+perfection+from+any+other%2C+but+he+is+whatever+can+be+and+cannot+be+other+than+what+he+is%29.+Whence+he+is+usually+described+not+only+by+concrete+but+also+by+abstract+names%E2%80%94life%2C+light%2C+truth%2C+etc.+V.+From+the+removal+of+all+species+of+composition+%28such+as+physical%E2%80%94of+matter+and+form%2C+since+he+is+incorporeal%29%3B+or+of+quantitative+parts+%28which+do+not+apply+to+God%29%3B+or+of+subject+and+accident+%28because+no+accident+can+make+the+most+perfect+still+more+perfect%29%3B+logical+%28of+kind+and+difference+because+God+is+above+every+genus%2C+nor+is+his+a+common+nature+capable+of+being+restricted+by+difference%29%3B+metaphysical+act+and+power+%28since+he+is+a+pure+act+and+incapable+of+change+properly+so+called%2C+to+whom+nothing+new+can+happen+or+be+received+by+him%29%3B+of+essence+and+existence+%28as+in+created+things+in+which+the+nature+of+existence+differs+from+that+of+essence%2C+since+their+essence+can+be+conceived+without+existence%3B+nor+does+existence+enter+into+their+definition+because+they+can+be+and+not+be%2C+and+existence+with+respect+to+them+is+something+contingent%2C+not+necessary.+For+in+God+essence+cannot+be+conceived+without+existence%2C+and+it+is+repugnant+to+conceive+of+God+as+not+existing%3B+hence+philosophers+call+him+a+being+by+essence+%28i.e.%2C+which+exists+in+virtue+of+its+own+essence%29+and+of+the+nature+of+whose+essence+it+is+that+he+always+exists.+For+this+reason%2C+God+calls+himself+Jehovah+%28viz.%2C+he+who+is%2C+%E2%80%9CI+am+that+I+am%E2%80%9D+%5B%E2%80%98hyh+%E2%80%98shr+%E2%80%98hyh%5D%29+to+signify+that+being+belongs+to+him+in+a+far+different+manner+than+to+all+created+things%2C+not+participatively+and+contingently%2C+but+necessarily%2C+properly+and+independently.+Finally%2C+his+simplicity+is+proved+from+nature+and+subsistence%3B+for+persons+and+essence+are+not+related+as+real+component+extremes+from+which+a+tertium+quid+may+arise+%28as+in+human+things+from+the+nature+of+man+and+the+subsistence+of+Peter+arises+that+person+whom+we+call+Peter%29%3B+otherwise+not+a+Trinity+but+a+certain+quaternity+would+be+conceived+of+in+God%3B+nor+do+modes+%28such+as+subsistences%29+compose%2C+they+only+modify.+VI.+But+as+God+rejects+all+composition+in+himself%2C+so+his+simplicity+hinders+him+also+from+being+compounded+with+any+created+things+so+as+to+hold+the+relation+of+some+part+either+of+matter+or+form+%28against+the+opinion+of+the+Platonists+who+supposed+God+to+be+the+soul+of+the+world%3B+and+of+the+Manicheans+who+held+that+all+creatures+were+propagated+from+the+essence+of+God%29.+This+is+so+both+because+he+is+altogether+diverse+from+creatures%2C+and+because+he+is+immutable+and+incorruptible+%28he+cannot+coalesce+in+one+with+any+mutable+and+corruptible+created+thing%29.+For+all+composition+infers+mutation+by+which+a+thing+becomes+part+of+a+whole%2C+which+it+was+not+before.+Sources+of+explanation.+VII.+If+all+things+are+said+to+be+of+God+%28Rom.+11%3A36%29%2C+this+must+be+understood+not+hylik%C5%8Ds+%28%E2%80%9Cbelonging+to+matter%E2%80%9D%29+and+materially%2C+but+d%C4%93miourgik%C5%8Ds+%28%E2%80%9Cformatively%E2%80%9D%29+and+efficiently.+We+are+called+the+race+and+offspring+of+God+%28Acts+17%3A28%29%2C+not+by+a+participation+of+the+same+essence%2C+but+by+similarity+of+likeness%3B+efficiently+not+essentially%2C+as+also+he+is+called+the+%E2%80%9CFather+of+spirits%E2%80%9D+%28Heb.+12%3A9%29+with+reference+to+creation%2C+not+to+composition.+The+Son+of+God+is+God-man+%28theanthr%C5%8Dpos%29+not+by+composition+properly+so-called%2C+but+by+hypostatical+union+%28by+which+the+Word+%5Blogos%5D+indeed+assumed+human+nature+in+one+hypostasis%2C+but+was+not+compounded+with+it+as+part+with+part%3B+but+stood+to+it+in+the+relation+of+perfecter+and+sustainer+to+make+perfect+and+sustain+an+essential+adjunct%2C+so+that+the+human+nature+indeed+did+thence+receive+perfection%2C+but+nothing+was+added+by+it+to+the+divine+nature%29.+VIII.+Composition+is+in+that+in+which+there+is+more+than+one+real+entity%2C+but+not+where+there+is+only+more+than+one+mode+because+modes+only+modify+and+characterize%2C+but+do+not+compose+the+essence.+But+in+divine+things+there+are+one+essence+and+three+hypostases+%28which+are+modes+distinguishing+indeed+the+persons+from+each+other%2C+but+not+composing+because+they+are+not+real+entities+concurring+to+the+composition+of+some+fourth+thing%2C+since+they+have+one+common+essence%3B+but+they+are+only+modifications+according+to+which+the+essence+is+conceived+to+subsist+in+three+persons%29.+IX.+Simplicity+and+triplicity+are+so+mutually+opposed+that+they+cannot+subsist+at+the+same+time+%28but+not+simplicity+and+Trinity+because+they+are+said+in+different+respects%29%3A+simplicity+in+respect+to+essence%2C+but+Trinity+in+respect+to+persons.+In+this+sense%2C+nothing+hinders+God+%28who+is+one+in+essence%29+from+being+three+persons.+X.+The+decrees+of+God+can+be+regarded+in+two+ways%3A+either+subjectively+%28if+it+is+right+so+to+speak%2C+i.e.%2C+on+the+part+of+the+internal+act+in+itself+and+absolutely%29%3B+or+objectively%2C+extrinsically+and+relatively+with+respect+to+creatures+%28respectively%29.+In+the+former+manner%2C+they+do+not+differ+from+God+himself+and+are+no+other+than+God+himself+decreeing.+But+in+the+latter%2C+they+do+differ+because+they+may+be+conceived+as+many+and+various+%28not+as+to+the+thing%2C+since+God+has+decreed+all+things+by+one+single+and+most+simple+act%2C+but+as+to+the+objects%29%2C+even+as+the+knowledge+of+God+is+conversant+with+innumerable+objects+without+detriment+to+his+unity.+XI.+The+decrees+of+God+are+free%2C+not+absolutely+and+as+to+the+principle%2C+but+relatively+and+objectively+and+as+to+the+end.+For+there+could+be+no+external+object+necessarily+terminating+to+the+divine+will%2C+for+God+stands+in+need+of+nothing+out+of+himself.+Therefore+they+could+be+and+not+be.+But+this+does+not+hinder+them+from+being+called+necessary+as+to+the+principle+and+internal+act+because+the+act+of+intelligence+and+will+could+not+be+absent+from+God+at+all.+He+could+not+be+God+without+intelligence+and+will.+They+are+necessary%2C+therefore%2C+as+to+internal+existence%2C+but+free+as+to+external+relation+%28schesin%29+and+habit.+Nor+can+the+will+of+God+be+said+to+cease+absolutely%2C+but+with+respect+to+the+external+object+on+which+it+is+terminated.+XII.+The+decrees+of+God+are+immanent+acts+of+the+divine+will%2C+but+not+properly+its+effect.+God+ought+not+to+be+called+so+much+the+cause+as+the+principle+of+them.+Hence+there+is+no+need+that+they+should+be+posterior+to+God+except+in+our+order+and+in+the+manner+of+conceiving+them.+XIII.+Although+the+essence+of+God+%28considered+simply+in+itself%29+is+absolute+and+implies+no+relation+to+creatures%2C+yet+this+does+not+hinder+it+%28when+considered+with+relative+opposition+to+creatures+and+as+determining+itself+in+the+manner+of+vital+principle+to+the+production+of+this+or+that+thing+out+of+itself%29+from+having+a+certain+reference+%28schesin%29+and+relation+to+creatures.+Nor+can+that+manifold+relation+make+composition+in+God%2C+more+than+the+relation+which+his+omniscience+and+omnipotence+bear+to+things+ad+extra%2C+constituted+a+real+difference+between+God+and+his+omnipotence+and+omniscience.+XIV.+Whatever+in+God+is+essential+and+absolute+is+God+himself.+Thus+the+absolute+attributes+may+be+identified+really+with+the+divine+essence+and+are+in+it+essentially%2C+not+accidentally.+If+they+are+predicated+of+God+in+the+concrete%2C+their+subject+is+only+of+denomination%2C+not+of+inhesion+%28inhaesionis%29.+But+whatever+is+personal+and+modal+in+God+is+indeed+God+himself+in+the+concrete%2C+though+not+in+the+abstract.+XV.+The+relative+attributes+do+not+argue+composition%2C+but+distinction.+The+formal+nature+of+relations+is+not+to+be+in%2C+but+to+be+to.+Nor+do+they+superadd+a+new+perfection+to+the+essence%2C+but+only+imply+a+habitude+of+the+essence+to+other+things.+Paternity+and+dominion+do+not+render+him+another+being%2C+but+in+a+different+manner+dispose+the+possessor+without+superinducing+a+change+in+him.+XVI.+The+personal+property+of+the+Son+does+not+make+his+essence+different+from+that+of+the+Father%2C+nor+of+a+simple+essence+make+a+composed%2C+for+nothing+real+is+added+to+the+essence%2C+rather+it+only+makes+the+Son+distinct+from+the+Father.+Distinction+is+not+composition.+XVII.+The+fathers+often+insist+on+this+simplicity+of+God.+%E2%80%9CThe+nature+of+God+is+simple+and+immutable+and+undisturbed%2C+nor+is+he+himself+one+thing+and+what+he+is+and+has+another+thing%E2%80%9D+%28Augustine%2C+1.+5%2C+de+Trinit.+c.+1%2B%29.+And+after+teaching+that+no+creature+is+truly+and+perfectly+simple%2C+he+adds%3A+%E2%80%9CNow+although+God+may+be+called+manifold%2C+yet+he+is+truly+perfectly+simple%2C+for+he+is+called+great%2C+wise%2C+happy%2C+and+true%2C+and+whatever+with+propriety+may+be+said+of+him.+But+his+greatness+is+the+same+as+his+wisdom%2C+for+he+is+not+great+in+mass%2C+but+in+virtue%2C+and+his+goodness+is+the+same+as+his+wisdom+and+greatness+and+truth%E2%80%9D+%28The+Trinity+6.6%2C+7%2A+%5BFC+45%3A208%E2%80%939%3B+PL+42.929%5D%29.+So+too+Athanasius%3A+%E2%80%9CGod+is+not+composed+who+composed+all+things+that+they+might+be%3B+nor+is+he+such+as+those+things+are+which+were+made+by+his+word%3B+since+he+is+a+simple+substance+in+whom+there+is+no+quality+nor+any+shadow+of+change%2C+as+James+testifies%E2%80%9D+%28To+the+Bishops+of+Africa+8+%5BNPNF2%2C+4%3A493%3B+PG+26.1043%5D%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger%2C+ed.+James+T.+Dennison+Jr.%2C+vol.+1+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%931997%29%2C+3.7+%5B191%E2%80%9394%5D.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f61ce30ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3f61ce30ac.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/08/turretin-defended-divine-simplicity-against-the-socinians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>As was already said in the preceding, the distinction between the law and the gospel is not the same as that between the Old and the New Testament. Neither is it the same as that which present day Dispensationalists make between the dispensation of the law and the dispensation of the gospel. It is contrary to the plain facts of Scripture to say that there is no gospel in the Old Testament, or at least not in that part of the Old Testament that covers the dispensation of the law. There is gospel in the maternal promise, gospel in the ceremonial law, and gospel in many of the Prophets, as Isa. 53 and 54; 55:1–3, 6, 7; Jer. 31:33, 34; Ezek. 36:25–28. In fact, there is a gospel current running through the whole of the Old Testament, which reaches its highest point in the Messianic prophecies. And it is equally contrary to Scripture to say that there is no law in the New Testament, or that the law does not apply in the New Testament dispensation. Jesus taught the permanent validity of the law, Matt. 5:17–19. Paul says that God provided for it that the requirements of the law should be fulfilled in our lives, Rom. 8:4, and holds his readers responsible for keeping the law, Rom. 13:9. James assures his readers that he who transgresses a single commandment of the law (and he mentions some of these), is a transgressor of the law, Jas. 2:8–11. And John defines sin as “lawlessness,” and says that this is the love of God, that we keep His commandments, 1 John 3:4; 5:3.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As was already said in the preceding, the distinction between the law and the gospel is not the same as that between the Old and the New Testament. Neither is it the same as that which present day Dispensationalists make between the dispensation of the law and the dispensation of the gospel. It is contrary to the plain facts of Scripture to say that there is no gospel in the Old Testament, or at least not in that part of the Old Testament that covers the dispensation of the law. There is gospel in the maternal promise, gospel in the ceremonial law, and gospel in many of the Prophets, as Isa. 53 and 54; 55:1–3, 6, 7; Jer. 31:33, 34; Ezek. 36:25–28. In fact, there is a gospel current running through the whole of the Old Testament, which reaches its highest point in the Messianic prophecies. And it is equally contrary to Scripture to say that there is no law in the New Testament, or that the law does not apply in the New Testament dispensation. Jesus taught the permanent validity of the law, Matt. 5:17–19. Paul says that God provided for it that the requirements of the law should be fulfilled in our lives, Rom. 8:4, and holds his readers responsible for keeping the law, Rom. 13:9. James assures his readers that he who transgresses a single commandment of the law (and he mentions some of these), is a transgressor of the law, Jas. 2:8–11. And John defines sin as “lawlessness,” and says that this is the love of God, that we keep His commandments, 1 John 3:4; 5:3.”

<blockquote><p>V. They [the Remonstrants] distinguish therefore, between the obtaining of reconciliation and the application of it. They contend that reconciliation and remission of sins is obtained for all, which yet is applied only to them that believe, that all men are given to Christ in the right of salvation but not in the communication of salvation, that God has neither will nor nilled [willed the contrary] the application of reconciliation (that is, faith and salvation) to all men, but he has thus willed it if they believe, if they will receive grace.</p></blockquote>

<blockquote><p>According to the common doctrine of Augustinians, as expressed in the Westminster Catechism, “God, having … elected some to everlasting life, did enter into a covenant of grace, to deliver them out of the estate of sin and misery, and to bring them into an estate of salvation by a Redeemer.” In opposition to this view some of the Reformed theologians of the seventeenth century introduced the scheme which is known in the history of theology as the doctrine of hypothetical redemption. The principal advocate of this doctrine was Amyraut (died 1664), Professor in the French Protestant Seminary at Saumur. He taught, (1.) That the motive impelling God to redeem men was benevolence, or love to men in general. (2.) From this motive He sent His Son to make the salvation of all men possible. (3.) God, in virtue of a decretum universale hypotheticum, offers salvation to all men if they believe in Christ. (4.) All men have a natural ability to repent and believe. (5.) But as this natural ability was counteracted by a moral inability, God determined to give his efficacious grace to a certain number of the human race, and thus to secure their salvation. This scheme is sometimes designated as “universalismus hypotheticus.” It was designed to take a middle ground between Augustinianism and Arminianism. It is liable to the objections which press on both systems. It does not remove the peculiar difficulties of Augustinianism, as it asserts the sovereignty of God in election. Besides, it leaves the case of the heathen out of view. They, having no knowledge of Christ, could not avail themselves of this decretum hypotheticum, and therefore must be considered as passed over by a decretum absolutum. It was against this doctrine of Amyraut and other departures from the standards of the Reformed Church that, in 1675, the “Formula Consensus Helvetica” was adopted by the churches of Switzerland. This theory of the French theologians soon passed away as far as the Reformed churches in Europe were concerned. Its advocates either returned to the old doctrine, or passed on to the more advanced system of the Arminians. In this country it has been revived and extensively adopted. At first view it might seem a small matter whether we say that election precedes redemption or that redemption precedes election. In fact, however, it is a question of great importance. The relation of the truths of the Bible is determined by their nature. If you change their relation you must change their nature. If you regard the sun as a planet instead of as the centre of our system you must believe it to be something very different in its constitution from what it actually is. So in a scheme of thought, if you make the final cause a means, or a means the final cause, nothing but confusion can be the result… 1. It supposes mutability in the divine purposes; or that the purpose of God may fail of accomplishment. According to this scheme, God, out of benevolence or philanthropy, purposed the salvation of all men, and sent his Son for their redemption. But seeing that such purpose could not be carried out, He determined by his efficacious grace to secure the salvation of a certain portion of the human race. This difficulty the scheme involves, however it may be stated. It cannot however be supposed that God intends what is never accomplished; that He purposes what He does not intend to effect; that He adopts means for an end which is never to be attained. This cannot be affirmed of any rational being who has the wisdom and power to secure the execution of his purposes. Much less can it be said of Him whose power and wisdom are infinite. If all men are not saved, God never purposed their salvation, and never devised and put into operation means designed to accomplish that end. We must assume that the result is the interpretation of the purposes of God. If He foreordains whatsoever comes to pass, then events correspond to his purposes; and it is against reason and Scripture to suppose that there is any contradiction or want of correspondence between what He intended and what actually occurs. The theory, therefore, which assumes that God purposed the salvation of all men, and sent his Son to die as a means to accomplish that end, and then seeing, or foreseeing that such end could not or would not be attained, elected a part of the race to be the subjects of efficacious grace, cannot be admitted as Scriptural. 2. The Bible clearly teaches that the work of Christ is certainly efficacious. It renders certain the attainment of the end it was designed to accomplish. It was intended to save his people, and not merely to make the salvation of all men possible. It was a real satisfaction to justice, and therefore necessarily frees from condemnation. It was a ransom paid and accepted, and therefore certainly redeems. If, therefore, equally designed for all men, it must secure the salvation of all. If designed specially for the elect, it renders their salvation certain, and therefore election precedes redemption. God, as the Westminster Catechism teaches, having elected some to eternal life, sent his Son to redeem them. 3. The Scriptures further teach that the gift of Christ secures the gift of all other saving blessings. “He that spared not his own Son, but delivered him up for us all, how shall he not with him also freely give us all things?” (Rom. 8:32.) Hence they are certainly saved for whom God delivered up his Son. The elect only are saved, and therefore He was delivered up specially for them, and consequently election must precede redemption. The relation, therefore, of redemption to election is as clearly determined by the nature of redemption as the relation of the sun to the planets is determined by the nature of the sun. 4. The Bible in numerous passages directly asserts that Christ came to redeem his people; to save them from their sins; and to bring them to God. He gave Himself for his Church; He laid down his life for his sheep. As the end precedes the means, if God sent his Son to save his people, if Christ gave Himself for his Church, then his people were selected and present to the divine mind, in the order of thought, prior to the gift of Christ. 5. If, as Paul teaches (Rom. 8:29, 30), foreknowledge precedes predestination, and if the mission of Christ is the means of accomplishing the end of predestination, then of necessity predestination to eternal life precedes the gift of Christ. Having, as we are taught in Eph. 1:4, 5, predestinated us to the adoption of sons, God chose us before the foundation of the world, and sent his Son to be the propitiation for our sins. This is the order of the divine purposes, or the mutual relation of the truths of redemption as presented in the Scriptures. 6. The motive (so to speak) of God in sending his Son is not, as this theory assumes, general benevolence or that love of which all men are equally the objects, but that peculiar, mysterious, infinite love in which God, in giving his Son, gives Himself and all conceivable and possible good. All these points, however, as before remarked, ask for further consideration when we come to treat of the nature and design of Christ’s work.</p></blockquote>

inst+this+doctrine+of+Amyraut+and+other+departures+from+the+standards+of+the+Reformed+Church+that%2C+in+1675%2C+the+%E2%80%9CFormula+Consensus+Helvetica%E2%80%9D+was+adopted+by+the+churches+of+Switzerland.+This+theory+of+the+French+theologians+soon+passed+away+as+far+as+the+Reformed+churches+in+Europe+were+concerned.+Its+advocates+either+returned+to+the+old+doctrine%2C+or+passed+on+to+the+more+advanced+system+of+the+Arminians.+In+this+country+it+has+been+revived+and+extensively+adopted.+At+first+view+it+might+seem+a+small+matter+whether+we+say+that+election+precedes+redemption+or+that+redemption+precedes+election.+In+fact%2C+however%2C+it+is+a+question+of+great+importance.+The+relation+of+the+truths+of+the+Bible+is+determined+by+their+nature.+If+you+change+their+relation+you+must+change+their+nature.+If+you+regard+the+sun+as+a+planet+instead+of+as+the+centre+of+our+system+you+must+believe+it+to+be+something+very+different+in+its+constitution+from+what+it+actually+is.+So+in+a+scheme+of+thought%2C+if+you+make+the+final+cause+a+means%2C+or+a+means+the+final+cause%2C+nothing+but+confusion+can+be+the+result%E2%80%A6+1.+It+supposes+mutability+in+the+divine+purposes%3B+or+that+the+purpose+of+God+may+fail+of+accomplishment.+According+to+this+scheme%2C+God%2C+out+of+benevolence+or+philanthropy%2C+purposed+the+salvation+of+all+men%2C+and+sent+his+Son+for+their+redemption.+But+seeing+that+such+purpose+could+not+be+carried+out%2C+He+determined+by+his+efficacious+grace+to+secure+the+salvation+of+a+certain+portion+of+the+human+race.+This+difficulty+the+scheme+involves%2C+however+it+may+be+stated.+It+cannot+however+be+supposed+that+God+intends+what+is+never+accomplished%3B+that+He+purposes+what+He+does+not+intend+to+effect%3B+that+He+adopts+means+for+an+end+which+is+never+to+be+attained.+This+cannot+be+affirmed+of+any+rational+being+who+has+the+wisdom+and+power+to+secure+the+execution+of+his+purposes.+Much+less+can+it+be+said+of+Him+whose+power+and+wisdom+are+infinite.+If+all+men+are+not+saved%2C+God+never+purposed+their+salvation%2C+and+never+devised+and+put+into+operation+means+designed+to+accomplish+that+end.+We+must+assume+that+the+result+is+the+interpretation+of+the+purposes+of+God.+If+He+foreordains+whatsoever+comes+to+pass%2C+then+events+correspond+to+his+purposes%3B+and+it+is+against+reason+and+Scripture+to+suppose+that+there+is+any+contradiction+or+want+of+correspondence+between+what+He+intended+and+what+actually+occurs.+The+theory%2C+therefore%2C+which+assumes+that+God+purposed+the+salvation+of+all+men%2C+and+sent+his+Son+to+die+as+a+means+to+accomplish+that+end%2C+and+then+seeing%2C+or+foreseeing+that+such+end+could+not+or+would+not+be+attained%2C+elected+a+part+of+the+race+to+be+the+subjects+of+efficacious+grace%2C+cannot+be+admitted+as+Scriptural.+2.+The+Bible+clearly+teaches+that+the+work+of+Christ+is+certainly+efficacious.+It+renders+certain+the+attainment+of+the+end+it+was+designed+to+accomplish.+It+was+intended+to+save+his+people%2C+and+not+merely+to+make+the+salvation+of+all+men+possible.+It+was+a+real+satisfaction+to+justice%2C+and+therefore+necessarily+frees+from+condemnation.+It+was+a+ransom+paid+and+accepted%2C+and+therefore+certainly+redeems.+If%2C+therefore%2C+equally+designed+for+all+men%2C+it+must+secure+the+salvation+of+all.+If+designed+specially+for+the+elect%2C+it+renders+their+salvation+certain%2C+and+therefore+election+precedes+redemption.+God%2C+as+the+Westminster+Catechism+teaches%2C+having+elected+some+to+eternal+life%2C+sent+his+Son+to+redeem+them.+3.+The+Scriptures+further+teach+that+the+gift+of+Christ+secures+the+gift+of+all+other+saving+blessings.+%E2%80%9CHe+that+spared+not+his+own+Son%2C+but+delivered+him+up+for+us+all%2C+how+shall+he+not+with+him+also+freely+give+us+all+things%3F%E2%80%9D+%28Rom.+8%3A32.%29+Hence+they+are+certainly+saved+for+whom+God+delivered+up+his+Son.+The+elect+only+are+saved%2C+and+therefore+He+was+delivered+up+specially+for+them%2C+and+consequently+election+must+precede+redemption.+The+relation%2C+therefore%2C+of+redemption+to+election+is+as+clearly+determined+by+the+nature+of+redemption+as+the+relation+of+the+sun+to+the+planets+is+determined+by+the+nature+of+the+sun.+4.+The+Bible+in+numerous+passages+directly+asserts+that+Christ+came+to+redeem+his+people%3B+to+save+them+from+their+sins%3B+and+to+bring+them+to+God.+He+gave+Himself+for+his+Church%3B+He+laid+down+his+life+for+his+sheep.+As+the+end+precedes+the+means%2C+if+God+sent+his+Son+to+save+his+people%2C+if+Christ+gave+Himself+for+his+Church%2C+then+his+people+were+selected+and+present+to+the+divine+mind%2C+in+the+order+of+thought%2C+prior+to+the+gift+of+Christ.+5.+If%2C+as+Paul+teaches+%28Rom.+8%3A29%2C+30%29%2C+foreknowledge+precedes+predestination%2C+and+if+the+mission+of+Christ+is+the+means+of+accomplishing+the+end+of+predestination%2C+then+of+necessity+predestination+to+eternal+life+precedes+the+gift+of+Christ.+Having%2C+as+we+are+taught+in+Eph.+1%3A4%2C+5%2C+predestinated+us+to+the+adoption+of+sons%2C+God+chose+us+before+the+foundation+of+the+world%2C+and+sent+his+Son+to+be+the+propitiation+for+our+sins.+This+is+the+order+of+the+divine+purposes%2C+or+the+mutual+relation+of+the+truths+of+redemption+as+presented+in+the+Scriptures.+6.+The+motive+%28so+to+speak%29+of+God+in+sending+his+Son+is+not%2C+as+this+theory+assumes%2C+general+benevolence+or+that+love+of+which+all+men+are+equally+the+objects%2C+but+that+peculiar%2C+mysterious%2C+infinite+love+in+which+God%2C+in+giving+his+Son%2C+gives+Himself+and+all+conceivable+and+possible+good.+All+these+points%2C+however%2C+as+before+remarked%2C+ask+for+further+consideration+when+we+come+to+treat+of+the+nature+and+design+of+Christ%E2%80%99s+work.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+2+%28Oak+Harbor%2C+WA%3A+Logos+Research+Systems%2C+Inc.%2C+1997%29%2C+321%E2%80%9324.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8589b1bd5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8589b1bd5b.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/11/hodge-contra-amyraut/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-30a6aaea5e" data-kw="">
<blockquote><p>That is what my Antinomians, too, are doing today. They are preaching finely and (I can think nothing else) with real seriousness about Christ’s grace, the forgiveness of sins, and the other things that can be said concerning redemption. But they flee the consequence of this, as though it were the very devil, and will not speak to the people about the Third Article, think that they ought not to terrify people, or disturb them, but always to preach in a comforting way about grace and the forgiveness of sins in Christ, and utterly avoid such words as these: “Listen! You want to be a Christian and yet remain an adulterer, fornicator, drunken swine, proud, covetous, a usurer, envious, revengeful, malicious!” On the contrary, they say: “Listen! Though you are an adulterer, a fornicator, a miser, or any other kind of sinner, only believe, and you will be saved and need not fear the law; Christ has fulfilled it all!” Tell me, is that not granting the premise and denying the conclusion? Nay, it is taking away Christ and bringing Him to nought, at the same time that He is most highly preached. It is saying Yes and No to the same thing. There is no such Christ, Who has died for these sinners who, after forgiveness of sins, do not leave their sins and lead a new life. Thus they finely preach the logic of Nestorious and Eutyches, that Christ is this and is yet not this. They are fine Easter preachers, but shamefully poor Pentecost preachers, for they preach nothing de sanctificatione et vivificatione Spiritus Sancti, i.e., concerning sanctification by the Holy Spirit, but preach only about redemption by Christ, though Christ, Whom they extol so highly (and rightly so!) is Christ, i.e., He has purchased redemption from sin and death, in order that the Holy Spirit shall make new men of us, in place of the old Adam, so that we die unto sin and live unto righteousness, as St. Paul teaches in Romans 6:1, beginning and increasing this life here on earth, and completing it yonder. What Christ has earned for us is not only gratia, “grace,” but also donum, the “gift” of the Holy Ghost, so that we might not only have forgiveness of sin, but also cease from sinning. Whoever, then, does not cease from sinning, but continues in his former wicked life, must have another Christ from the Antinomians, for the real Christ is not there, even though all the angels were to cry only “Christ! Christ!”; and he must be damned with his new Christ.</p></blockquote>

<blockquote><p>Whereas our Savior is frequently, in Scripture, call’d the Son of God, the Socinians deny that he is so call’d with respect to his Eternal Generation, or being Begotten of his Father before all World’s; as also they deny that his Divinity can be prov’d thence.</p></blockquote>

<blockquote><p>By this answer Christ declared that he did not deliver any other rule of life than that which had formerly been delivered in the law of the Lord. Thus he both bore testimony to the divine law, that it was a doctrine of perfect righteousness, and at the same time met the calumnious charge of seeming, by some new rule of life, to incite the people to revolt from the law. The young man, who was not ill-disposed, but was puffed up with vain confidence, answers that he had observed all the precepts of the law from his youth. It is absolutely certain that he was immeasurably distant from the goal which he boasted of having reached. Had his boast been true, he would have wanted nothing of absolute perfection. For it has been demonstrated above, that the law contains in it a perfect righteousness. This is even obvious from the fact, that the observance of it is called the way to eternal life. To show him how little progress he had made in that righteousness which he too boldly answered that he had fulfilled, it was right to bring before him his besetting sin. Now, while he abounded in riches, he had his heart set upon them. Therefore, because he did not feel this secret wound, it is probed by Christ — “Go,” says he, “and sell that thou hast.” Had he been as good a keeper of the law as he supposed, he would not have gone away sorrowful on hearing these words. For he who loves God with his whole heart, not only regards everything which wars with his love as dross, but hates it as destruction (Philippians 3:8). Therefore, when Christ orders a rich miser to leave all that he has, it is the same as if he had ordered the ambitious to renounce all his honors, the voluptuous all his luxuries, the unchaste all the instruments of his lust. Thus consciences, which are not reached by any general admonition, are to be recalled to a particular feeling of their particular sin. In vain, therefore, do they wrest that special case to a general interpretation, as if Christ had decided that the perfection of man consists in the abandonment of his goods, since he intended nothing more by the expression than to bring a youth who was out of measure satisfied with himself to feel his sore, and so understand that he was still at a great distance from that perfect obedience of the law which he falsely ascribed to himself: I admit that this passage was ill understood by some of the Fathers; and hence arose an affectation of voluntary poverty, those only being thought blest who abandoned all earthly goods, and in a state of destitution devoted themselves to Christ. But I am confident that, after my exposition, no good and reasonable man will have any dubiety here as to the mind of Christ.</p></blockquote>

</figure><figure class="quote" id="q-22636852ec" data-kw="">
<blockquote><p>Canon VI: Wherefore, we can not agree with the opinion of those who teach: l) that God, moved by philanthropy, or a kind of special love for the fallen of the human race, did, in a kind of conditioned willing, first moving of pity, as they call it, or inefficacious desire, determine the salvation of all, conditionally, i.e., if they would believe, 2) that he appointed Christ Mediator for all and each of the fallen; and 3) that, at length, certain ones whom he regarded, not simply as sinners in the first Adam, but as redeemed in the second Adam, he elected, that is, he determined graciously to bestow on these, in time, the saving gift of faith; and in this sole act election properly so called is complete. For these and all other similar teachings are in no way insignificant deviations from the proper teaching concerning divine election; because the Scriptures do not extend unto all and each God’s purpose of showing mercy to man, but restrict it to the elect alone, the reprobate being excluded even by name, as Esau, whom God hated with an eternal hatred (Rom 9:11). The same Holy Scriptures testify that the counsel and will of God do not change, but stand immovable, and God in the, heavens does whatsoever he will (Ps 115:3; Isa 47:10); for God is in finitely removed from all that human imperfection which characterizes inefficacious affections and desires, rashness repentance and change of purpose. The appointment, also, of Christ, as Mediator, equally with the salvation of those who were given to him for a possession and an inheritance that can not be taken away, proceeds from one and the same election, and does not form the basis of election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/j-h-heidegger-francis-turretin.html">J. H. Heidegger, Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Helvetic Consensus Formula</cite>, (1675)</span></figcaption>

<blockquote><p>VIII. Fifth, the injustice of the demand appears also clearly in this—that they treacherously corrupt the writings of the fathers and endeavor to destroy whatever of candor remains and extinguish all memory of antiquity as far as they are able (most base men). They wish to turn against us the arms of truth which they themselves have tempered with, overlaid and expunged because we cannot bring them forward. They, who persecuted the pious with flames and the sword, now make sport of them, evidently as the Jews who, smiting Christ with rods, said, “prophesy who struck you.” Thus they wish us to prophesy and to give a reason for a previous time. IX. Sixth, if our opponents wish us to answer the proposed question, they are also bound to answer us—where was their church in the time of Christ and the apostles, in which nothing concerning either transubstantiation, the sacrifice of the Mass, the invocation of saints and the worship of images, purgatory, indulgences, the pope and his authority, and the other errors theoretical and practical prevailed as yet among believers? Let them show us where then was that magnificent apparatus of temples and ceremonies which has corrupted Christianity completely and converted divine worship into a show. Where was the papacy in the first six centuries of purer (or at least of less impure) Christianity? For although various errors began gradually to creep into the church, still it is certain that far more numerous and grievous errors were introduced in the following ages or received strength: The worship of images, transubstantiation, communion under one species, the infallibility and monarchy of the pope, the use of a foreign language in the sacred service, etc. let them show where the church was in the 10th century (which Baronius calls the “iron” age), in which there were more than 50 Popes succeeding each other, not so much apostolical (apostolici), as “apostatical” (apostatici) And “apostactical” (apostactici) (according to Genebrard).</p></blockquote>

<blockquote><p>1. When, however, they are confuted from the Scriptures, they turn round and accuse these same Scriptures, as if they were not correct, nor of authority, and [assert] that they are ambiguous, and that the truth cannot be extracted from them by those who are ignorant of tradition. For [they allege] that the truth was not delivered by means of written documents, but viva voce: wherefore also Paul declared, “But we speak wisdom among those that are perfect, but not the wisdom of this world.” And this wisdom each one of them alleges to be the fiction of his own inventing, forsooth; so that, according to their idea, the truth properly resides at one time in Valentinus, at another in Marcion, at another in Cerinthus, then afterwards in Basilides, or has even been indifferently in any other opponent, who could speak nothing pertaining to salvation. For every one of these men, being altogether of a perverse disposition, depraving the system of truth, is not ashamed to preach himself.</p></blockquote>

<blockquote><p>14. Still there was nothing with the Fathers less intended than to establish that kind of perfection which was afterwards fabricated by cowled monks, in order to rear up a species of double Christianity. For as yet the sacreligious dogma was not broached which compares the profession of monasticism to baptism, nay, plainly asserts that it is the form of a second baptism. Who can doubt that the Fathers with their whole hearts abhorred such blasphemy? Then what need is there to demonstrate, by words, that the last quality which Augustine mentions as belonging to the ancient monks—viz. that they in all things accommodated themselves to charity—is most alien from this new profession? The thing itself declares that all who retire into monasteries withdraw from the Church. For how? Do they not separate themselves from the legitimate society of the faithful, by acquiring for themselves a special ministry and private administration of the sacraments? What is meant by destroying the communion of the Church if this is not? And to follow out the comparison with which I began, and at once close the point, what resemblance have they in this respect to the ancient monks? These, though they dwelt separately from others, had not a separate Church; they partook of the sacraments with others, they attended public meetings, and were then a part of the people. But what have those men done in erecting a private altar for themselves but broken the bond of unity? For they have excommunicated themselves from the whole body of the Church, and contemned the ordinary ministry by which the Lord has been pleased that peace and charity should be preserved among his followers. Wherefore I hold that as many monasteries as there are in the present day, so many conventicles are there of schismatics, who have disturbed ecclesiastical order, and been cut off from the legitimate society of the faithful. And that there might be no doubt as to their separation, they have given themselves the various names of factions. They have not been ashamed to glory in that which Paul so execrates, that he is unable to express his detestation too strongly. Unless, indeed, we suppose that Christ was not divided by the Corinthians, when one teacher set himself above another (1 Corinthians 1:12, 13; 3:4); and that now no injury is done to Christ when, instead of Christians, we hear some called Benedictines, others Franciscans, others Dominicans, and so called, that while they affect to be distinguished from the common body of Christians, they proudly substitute these names for a religious profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.13.14</span></figcaption>

</figure><figure class="quote" id="q-a755f3f30b" data-kw="">
<blockquote><p>This document is entitled, “Concord between the Doctors of Wittenberg and the Doctors of the Imperial Cities in Greater Germany.” My above-mentioned lord has commanded me to write to you, so that you would think carefully about this — because we want you to be in agreement with the Germans, having the same confession of the main things, in order to break entirely the force of the pope. If we were all united in doctrine, no one could touch us without offending people throughout Germany. This would be an invaluable benefit for us and would serve to shut the mouths of those who say that we are not united. Also, our poor country would be greatly relieved by this means. When they ask what we are trying to accomplish with our reformation, it would be easier to answer them. It is true that the aforementioned document looks disagreeable at first glance, but if we want to, it is possible to see it in a better light. The Duke sent us to Metz to communicate this matter to our brothers in the ministry in that city–which we have done. At first glance, they had difficulties with the statement, just as we did. However, after all things were considered, they have agreed with us in the opinion that we could agree with the Germans on the point of the Lord’s Supper, following the statement that Mr. Bucer gave at the end. That is already a great accomplishment for us, since we are not divided with them on this point.</p></blockquote>

</figure><figure class="quote" id="q-43f6d35149" data-kw="">
<blockquote><p>13. Our indulgence ought to extend much farther in tolerating imperfection of conduct. Here there is great danger of falling, and Satan employs all his machinations to ensnare us. For there always have been persons who, imbued with a false persuasion of absolute holiness, as if they had already become a kind of aerial spirits, spurn the society of all in whom they see that something human still remains. Such of old were the Cathari and the Donatists, who were similarly infatuated Such in the present day are some of the Anabaptists, who would be thought to have made superior progress. Others, again, sin this respect, not so much from that insane pride as from inconsiderate zeal. Seeing that among those to whom the gospel is preached, the fruit produced is not in accordance with the doctrine, they forthwith conclude that there no church exists.</p></blockquote>

<blockquote><p>Now very many persons see the base tricks, deceits, thefts, and greediness with which the indulgence traffickers have heretofore mocked and beguiled us, and yet they do not see the very fountain of the impiety itself. As a consequence, it behooves us to indicate not only the nature of indulgences but also what in general they would be, wiped clean of all spots. The merits of Christ and the holy apostles and martyrs our opponents call the “treasury of the church.” They pretend that the prime custody of this storehouse, as I have already hinted, has been entrusted to the Bishop of Rome, who controls the dispensing of these very great benefits, so that he can both distribute them by himself and delegate to others the management of their distribution. Consequently, plenary indulgences, as well as indulgences for certain years, stem from the pope; indulgences for a hundred days, from the cardinals; and of forty days, from the bishops! Now these, to describe them rightly, are a profanation of the blood of Christ, a Satanic mockery, to lead the Christian people away from God’s grace, away from the life that is in Christ, and turn them aside from the true way of salvation. For how could the blood of Christ be more foully profaned than when they deny that it is sufficient for the forgiveness of sins, for reconciliation, for satisfaction—unless the lack of it, as of something dried up and exhausted, be otherwise supplied and filled? “To Christ, the Law and all the Prophets bear witness,” says Peter, that “through him we are to receive forgiveness of sins.” [Acts 10:43 p.] Indulgences bestow forgiveness of sins through Peter, Paul, and the martyrs. “The blood of Christ cleanses us from sin,” says John [1 John 1:7 p.]. Indulgences make the blood of martyrs the cleansing of sins. “Christ,” says Paul, “who knew no sin, was made sin for us” (that is, satisfaction of sin) “so that we might be made the righteousness of God in him” [2 Corinthians 5:21 p., cf. Vg.]. Indulgences lodge satisfaction of sins in the blood of martyrs. Paul proclaimed and testified to the Corinthians that Christ alone was crucified and died for them [cf. 1 Corinthians 1:13]. Indulgences declare: “Paul and others died for us.” Elsewhere Paul says, “Christ acquired the church with his own blood.” [Acts 20:28 p.] Indulgences establish another purchase price in the blood of martyrs. “By a single offering Christ has perfected for all time those who are sanctified.” [Hebrews 10:14.] Indulgences proclaim: Sanctification, otherwise insufficient, is perfected by the martyrs. John says that “all the saints have washed their robes… in the blood of the Lamb.” [Revelation 7:14.] Indulgences teach that they wash their robes in the blood of the saints.</p></blockquote>

<blockquote><p>The interest of the debate to us lies in the revelation which it gives us of the presence in the Assembly of an influential and able, but apparently small, body of men whose convictions lay in the direction of the modified Calvinism which had been lately promulgated by Cameron and Amyraut for the express purpose of finding a place for a universal redemption in the Calvinistic system. For the origin of this party Dr. Mitchell would point us to English sources: but Baillie especially mentions Amyraut in this connection; and it would seem that it was Amyraut and Cameron—both of whom Gillespie mentions in this debate—whom men had especially in mind during the discussion; and it would seem further to be clear that while the adherents of this universalistic view of the atonement in the Assembly held it with British moderation, and were not prepared to go all lengths with the French Divines who had lately promulgated it with such force, they yet looked upon them as of their school and sought support from them. The result of the debate was a refusal to modify the Calvinistic statement in this direction—or perhaps we should rather say the definitive rejection of the Amyraldian views and the adoption of language which was precisely framed to exclude them. Dr. Mitchell, reviving an old contention, suggests indeed that unless the clause of the Confession in question be read disjunctively rather than, as it is actually phrased, conjunctively, it will not operate for the exclusion of Amyraldians. It is not clearly obvious, however, that the word “and” here binds the several items of the enumeration so closely together as to make it appear that all that is affirmed is only that the whole of this process takes place in the case of the elect only: the natural sense of the clause is clearly that no one of the transactions here brought together is to be affirmed of the non-elect. And this impression is increased by the broader context, not to speak of the parallel passages in viii. 3 and 5. It might seem somewhat more to the point, possibly, to recall that in this section the language is so ordered as to seem to deal with the actual ordo salutis rather than directly with the ordo decretorum. It is asserted that the ordo salutis is the result of the decreeing of the means by which the elect are brought to glory. But what is subsequently asserted is that none but the elect are (actually) redeemed by Christ, effectually called, etc.—the mind being abstracted for the moment from the intention to the performance. The Westminster Amyraldians—if we may venture so to call them—had, of course, freely admitted the distinction between the elect and non-elect in the application: it was only in the impetration that they disputed it: and it might perhaps seem to them possible to confess that though Christ had died for all, the merits of His death had actually been applied only to some, and to contend that only this is actually expressed by saying that none but the elect “are redeemed by Christ.” Even this, however, appears more subtle than satisfactory; and in any event it would seem quite obvious that the Assembly intended to state in this clause with adequate clearness their reasoned and deliberate conviction that the decree of election lies behind the decree of the gift of Christ for redemption, and that the latter is to be classed as one of the means for the execution of the decree of election. This is the definite exclusion of the Amyraldian view, and anything that can be made really consistent with this conception of the ordo decretorum will be found to differ fundamentally from Amyraldism.</p></blockquote>

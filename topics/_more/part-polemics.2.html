<blockquote><p>As Zwingli’s successor, Heinrich Bullinger (1504-1575) consolidated the reform of Zurich. Nevertheless, he is more positively disposed toward Marian doctrine and piety. His ‘Sermon on Mary,’ after defending Mary’s perpetual virginity… This is not to say that the sermon is a wholesale endorsement of Marian developments to the sixteenth century, for it also regards the immaculate conception and the bodily assumption as open questions… Bullinger also inveighs against her invocation and rejects the understanding of Mary as mistress of the church.</p></blockquote>

</figure><figure class="quote" id="q-5db7de0c84" data-kw="">
<blockquote><p>But that even our Scriptures… use metaphorical and symbolic words and discourse is clearly apparent from these things… How is it that Mary herself calls Joseph the father of Jesus (Luke 2:48)? What pious person would not profess that all these things are said improperly? Or, having been taught by Scripture, do we not firmly believe that the Lord Jesus was by no means conceived by the seed of Joseph (which certain heretics, being of unsound mind with the Jews, have dared to proclaim) but that He was conceived of the Holy Spirit (Luke 1:35), and that His blessed mother had never known a man but remained a virgin and untouched forever?</p></blockquote>

</figure><figure class="quote" id="q-10069342eb" data-kw="">
<blockquote><p>They [Romanists] say moreover that the perpetual virginity of our Lady is to be believed of necessity as Cyprian, Chrysostom, Jerome, Ambrose, Austen and all other speaking thereof say. But this is not found in the Scripture: ergo [therefore] there is something to be believed that is not written in the Scripture. The minor, that is to say that this is not written in the Scripture is false. For first, none of the old authors that rehearse traditions of the apostles-unwritten make mention of the perpetual virginity of our Lady to be one of them: but they rehearse only diverse ceremonies or bodily gestures… which (as I have manifestly declared) are not necessary to salvation… Moreover all the said authors prove her perpetual virginity by this text of Scripture: Ezekiel 44, ‘This door shall be still shut and not opened for any man to go through it: but only for the Lord God of Israel, yea He shall go through it, else shall it be shut still.’ For if these and such other fathers had not judged her perpetual virginity to have been written in the Scriptures: they would never have judged it to have been a thing to be believed under pain of damnation. Saint Jerome also calls Helvidius a rash and an ungodly man: because that he taught that our Lady had other children by Joseph after Christ’s birth, which doctrine he could not prove by the Scriptures of God. In like manner we call all them that preach any doctrine in the Church without the authority of God’s Word both ungodly, rash and wicked members of Antichrist.</p></blockquote>

<blockquote><p>…we considered each chapter by itself, and left nothing unexplored, and diligently examined everything respecting God, the sacred laws and rights of the Church, and it is impossible to express the exceeding delight we derived from that work, when we clearly perceived that in your little book was most faithfully, holily, piously, and indeed divinely explained, and that briefly whatever we have been constantly teaching these eight years, and still by the grace of God, continued to teach, in our Churches, in the schools, and in the pulpit. We are therefore altogether compelled, as well by our consciences, as from a sense of duty, to undertake its patronage, and not only to express our approval, but also our exceeding commendation of every chapter and every sentence.</p></blockquote>

<blockquote><p>CHRIST IS TRUE MAN, HAVING REAL FLESH. We also believe and teach that the eternal Son of the eternal God was made the Son of man, from the seed of Abraham and David, not from the coitus [union] of a man, as the Ebionites [a sect from the Early Church] said, but was most chastely conceived by the Holy Spirit and born of the ever virgin Mary, as the evangelical history carefully explains to us (Matt., ch. 1). And Paul says: “he took not on him the nature of angels, but of the seed of Abraham.” Also the apostle John says that whoever does not believe that Jesus Christ has come in the flesh, is not of God. Therefore, the flesh of Christ was neither imaginary nor brought from heaven, as Valentinus and Marcion wrongly imagined.</p></blockquote>

</figure><figure class="quote" id="q-f261cc281e" data-kw="">
<blockquote><p>As Mary conceived a virgin, so it may be well thought that she continued a virgin to the end, though we make it no article of our faith. When Christ was upon the cross, he commended his mother to the custody of John; which probably argues that she had no child to whose care and keeping she might be commended. And though Christ be called her firstborn, yet does it not follow that she had any child after him: for as that is called last after which there is none, so that is called the first before which there was none. And as for Joseph, when he was espoused to Mary, he was a man of eighty years old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (Cambridge, 1595), p. 171</span></figcaption>

</figure><figure class="quote" id="q-21283dd83a" data-kw="">
<blockquote><p>The nativity of Christ, is that whereby Mary, a virgin, did after the course of nature and the custom of women [contra in partu], bring forth Christ, that Word of the Father and the Son of David: so that those are much deceived which are of opinion that Christ, after a miraculous manner, came into the world, the womb of the Virgin being shut. Lk. 2:23, ‘Every man-child which first opens the womb, shall be called holy to the Lord.’ The which place of scripture is applied to Mary and our Savior Christ. Hence is it that the Virgin Mary is said Theotokos [God-bearer] to bring forth God, albeit she is not any way mother of the Godhead. For Christ as He is God, is without mother, and as man, without father. It is convenient to be thought that Mary continued a virgin until her dying day, albeit we make not this opinion any article of our belief: I. Christ being now to depart the world, committed his mother to the tuition and custody of his disciple John, which it is like He would not have done, if she had had any children, by whom, as custom was, she might have been provided for, Jn. 19:26. II. It is likely that she who was with child by the Holy Ghost, would not after[ward] know any man. III. It is agreed of by the Church in all ages.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The nativity of Christ, is that whereby Mary, a virgin, did after the course of nature and the custom of women [contra in partu], bring forth Christ, that Word of the Father and the Son of David: so that those are much deceived which are of opinion that Christ, after a miraculous manner, came into the world, the womb of the Virgin being shut. Lk. 2:23, ‘Every man-child which first opens the womb, shall be called holy to the Lord.’ The which place of scripture is applied to Mary and our Savior Christ. Hence is it that the Virgin Mary is said Theotokos [God-bearer] to bring forth God, albeit she is not any way mother of the Godhead. For Christ as He is God, is without mother, and as man, without father. It is convenient to be thought that Mary continued a virgin until her dying day, albeit we make not this opinion any article of our belief: I. Christ being now to depart the world, committed his mother to the tuition and custody of his disciple John, which it is like He would not have done, if she had had any children, by whom, as custom was, she might have been provided for, Jn. 19:26. II. It is likely that she who was with child by the Holy Ghost, would not after[ward] know any man. III. It is agreed of by the Church in all ages.”

<blockquote><p>In that James is called our Lord’s brother [in Gal. 1:19] three things may be demanded: One, which James this was? Answer: It was James the son of Alpheus: for he lived 14 years after this, Gal. 2:9, whereas James the son of Zebedeus lived not so long, because he was put to death by Herod. The second thing is, how James should be the Lord’s brother? Answer: In scripture, children of the same womb, are brethren: men of the same blood are brethren; as Abram and Lot, Gen. 13:8. Men of the same country are brethren, thus Saul’s countrymen are called his brethren, 1 Chron. 12:2. And James is called our Lord’s brother, not because he was of the same womb, but because he was of the same blood or kindred: for Elie had two daughters, Mary, espoused to Joseph, and Mary Cleophas, who afterward was married to Alpheus, of whom came James here mentioned. James therefore was the cousin-german [first-cousin] of Christ. Therefore Helvideus failed when he went about to infringe the perpetual virginity of the virgin Mary out of this place, as if she had more sons beside Christ. The third thing is, what benefit James had by being the Lord’s brother? Answer: He is here called the Lord’s brother only, for distinction’s sake in respect of the other James the son of Zebedeus…</p></blockquote>

.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-perpetual-virginity-of-mary/#:~:text=In%20that%20James%20is%20called%20our,other%20James%20the%20son%20of%20Zebedeus&amp;text=In%20that%20James%20is%20called%20our%20Lord%E2%80%99s%20brother&amp;text=of%20the%20other%20James%20the%20son%20of%20Zebedeus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Scripture tells us how man comes four ways into the world… 4. Of a woman without a man, and so was Christ born. Of the Virgin Mary.] Where the mother of Christ is described by her Name, ‘Mary’; surename, ‘Virgin’. The new Jesuits and old Friers have many wonderful extravagant conceits of this name: let it suffice that it is added in the Gospel and Creed to show that Christ came of the lineage of David: and that therefore He was the true Messias, as God had promised and prophesied by the mouths of all his holy servants. Virgin] A perpetual Virgin: Before, In, After Christ’s birth. Before his birth, against 1. Jews, 2. Gentiles, 3. Cerinthians. Unto the first [the Jews] we say with Cyril: Pariet Aaronis virga sine semine, et non pariet virgo sine semine? aut vtrum[que] negate aut vtrum[que] concedite. Against the second [the gentiles], we have: Ficta: Qui enim e Iouis cerebro Mineruam, et ex eiusdem femore Bacchum, falso prognatum esse fabulamini: quomodo ex vtero virginali Christum nasci dicitis impossibile? Facta: Quoniam animalia multas sine commistione generantur. And Plutarch in the life of Numa spake like an angel: Incredibilo non est, ut spiritus Dei cum muliere coeat, ei[que] sobolis quaedam principia ingoneret. 3. The Cerinthians, Ebionites, and Carpocratian heretics held that Christ was the natural son of Joseph: et verus, et merus homo [both true and merely man]. Contrary to text, Mt. 1:25; Lk. 3:23. See the Gospel, Dom. l, post Epiphan. In his birth, against: Jovinian, Durandus. Unto these that of Isa. 7 is opposed, ‘Ecce 〈…〉, &amp; pariet filium.’ The which words are to be construed: ‘in censu composito, non diuiso: scilicet integra perman•e•• et conceptura, et paritura: nam quale signum vel prodigium esset ut quae fuit virgo conciperet, et corrupta pareret?’ ‘Hic si ratio quaeritur, non erit mirabile. Si poscitur exemplum, non erit singulare. Demus Deum aliquid posse, quod nos fateamur inuestigare non posse.’ ‘Fides adsit, et nulla quaestio remanebit.’ See the Gospel of the purification. After his birth against the Old Helvidians, [and] New Antidicomarianites: holding it a point of zeal to disgrace this holy Virgin: whereas it is our duty rather highly to reverence her, as being the Mother of our Lord; a prophetess on earth, a saint in heaven, (as the Fathers usually) the window of heaven, through which it pleased the light of the world to illuminate such as sit in darkness and in the shadow of death. Of such estimation in the Church, that whereas the first General Council was assembled against Arius, to maintain the honor of the Son, and so by consequence of the Father: The second against Macedonius, to maintain the honor of the Holy Ghost: The third was assembled against Nestorius, to maintain the dignity of the blessed Virgin. And therefore let not us give her too little, though the Papists have given her too much. See Gospel on the Annunciation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of all the Principal Scriptures used in our English Liturgy</cite>, … (London, 1610), pp. 37-8</span></figcaption>

0tells%20us%20how%20man%20comes%20four&amp;text=her%20too%20much.%20See%20Gospel%20on%20the%20Annunciation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VII. We believe also that Mary continued a virgin after her childbirth: For her marriage with Joseph did not consist in the generation of children, but in her education and holy conjunction of life with him. VIII. Although Christ had no other brothers born after Him, yet He is rightly called Mary’s first begotten Son. In Scripture Christ is called the ‘firstborn’ four manner of ways… 4. In respect of his nativity of the Virgin, Lk. 2:7. Now He is not only called firstborn, whom other brothers do follow; but he also who is born before others, although he be indeed the only begotten, or he whom other brothers do not follow; whence such a one, even before he had any brothers, was consecrated to God, as if he had been the firstborn, Num. 18:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, … (d. 1629; London, 1660), pp. 128-9</span></figcaption>

<blockquote><p>Though Christ in regard of his divine nature, and by virtue of his eternal generation be the only begotten Son of his Father; and in regard of his humane nature, by reason of the perpetual virginity of his mother, her only begotten Son; yet may He well be said to have brethren, and that in two especial respects: 1. Because the Son of God and Son of men are of one, even of one and the same nature: Therefore He is not ashamed to call them brethren, Heb. 2:11. 2. Because He has adopted them to be Sons of his Father; For we children of men are said to have the adoption of children by Jesus Christ, Eph. 1:5. In this respect Christ stiles his disciples whom He had adopted, ‘brethren’, Mt. 28:10. For He Himself renders this reason of calling them brethren, ‘My Father is their Father’, Jn. 20:17.</p></blockquote>

</figure><figure class="quote" id="q-2e880b3191" data-kw="">
<blockquote><p>The fifth and last proposition is this, that although Jesus of Nazareth naturally descended only from Mary, yet he derives not his title to the crown and kingdom of the Jews originally by the line of Mary (for as much as she sprang from the Line of Rhesa the younger Son of Zorobabel), but received that from Joseph, who was of the elder line by Abiud; which line of Abiud failing in Joseph, as having no issue, the right of Inheritance devolved upon one of the younger line, viz. upon Mary, and consequently upon Jesus her son and legal heir. From whence there rises this unanswerable argument, both against the opinion of those who affirm Joseph to have had other Children by a former wife; as also against that old heresy of Helvidius, who, against the general and constant sense of the Church, denied the perpetual virginity of Mary, affirming that Joseph had other children by her after the Birth of Jesus. [Frederic] Spanheimius [Sr., 1600-1649] in his Dubia Evangelica, concludes against the opinion of Helvidius (which I much marvel at) merely upon the account of decency and congruity, as judging it more suitable and agreeable to that honorable esteem we ought to have of our Blessed Savior’s mother, to hold that after his birth she remained a perpetual virgin. But I add, that to assert so, seems not only decent, but of as absolute necessity, as that Jesus Christ the Messiah was to be of right king of the Jews. For had Joseph had any children either by Mary, or any other wife, they as coming from the elder line of Abiud by Joseph their father, must have claimed the inheritance of the kingdom in his right, and not Jesus the Son of Mary, who descended from a younger line, and so could not legally inherit, but upon default of issue from Joseph the only remaining heir of the elder. For this was the law of Moses, which in this case would have barred Jesus from a title to the kingdom of the Jews. But we know Jesus came to fulfill the Law in every part and tittle of it; and therefore would never have owned himself king of the Jews, contrary to the express injunctions and tenor of it. For though it must be confessed that the Gospel makes mention of the brothers and sisters of Jesus, yet it is known to be most usual in the Jewish language to call any collateral kindred, as cousins and cousin-germans [first cousins] by that name. And antiquity reports the Virgin Mary to have had two sisters, the children of which might very well be called the brethren of Jesus. So that from hence there can be no necessity of granting that Jesus had any brother or sister either by his mother Mary, or his reputed and legal father Joseph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-south.html">Robert South</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twelve Sermons upon Several Subjects &amp; Occasions. The Third Volume</cite>, … (London, 1698), Sermon on Rev. 22:16, Proposition 5, pp. 339-41. South was a reformed Anglican.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-911b466ed0" data-kw="">

<blockquote><p>A new lie about me is being circulated. I am supposed to have preached and written that Mary, the mother of God, was not a virgin either before or after the birth of Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>That Jesus Christ was Born a Jew</cite>, (1523) in LW, 45:199</span></figcaption>

</figure><figure class="quote" id="q-a91e1b549d" data-kw="">
<blockquote><p>Scripture does not say or indicate that she later lost her virginity… … The form of expression used by Matthew is the common idiom, as if I were to say, “Pharaoh believed not Moses, until he was drowned in the Red Sea.” Here it does not follow that Pharaoh believed later, after he had drowned; on the contrary, it means that he never did believe. Similarly when Matthew [1:25] says that Joseph did not know Mary carnally until she had brought forth her son, it does not follow that he knew her subsequently; on the contrary, it means that he never did know her. Again, the Red Sea overwhelmed Pharaoh before he got across. Here too it does not follow that Pharaoh got across later, after the Red Sea had overwhelmed him, but rather that he did not get across at all. In like manner, when Matthew [1:18] says, “She was found to be with child before they came together,” it does not follow that Mary subsequently lay with Joseph, but rather that she did not lie with him. Elsewhere in Scripture the same manner of speech is employed. Psalm 110[:1] reads, “God says to my Lord: ‘Sit at my right hand, till I make your enemies your footstool.’ ” Here it does not follow that Christ does not continue to sit there after his enemies are placed beneath his feet. Again, in Genesis 28[:15], “I will not leave you until I have done all that of which I have spoken to you.” Here God did not leave him after the fulfillment had taken place. Again, in Isaiah 42[:4], “He shall not be sad, nor troublesome, till he has established justice in the earth.” There are many more similar expressions, so that this babble of Helvidius is without justification; in addition, he has neither noticed nor paid any attention to either Scripture or the common idiom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>That Jesus Christ was Born a Jew</cite>, (1523) in LW 45.206, 212-213</span></figcaption>

</figure><figure class="quote" id="q-eab23cb342" data-kw="">
<blockquote><p>According to His humanity, He, Christ, our Savior, was the real and natural fruit of Mary’s virginal womb (of which Elizabeth, filled with the Holy Spirit, said to her in Luke 1:42: “Blessed is the fruit of your womb!”). This was without the co-operation of a man, and she remained a virgin after that. Everything else that a mother imparts to a child was imparted by Mary, the mother of God’s eternal Son. Even the milk He sucked had no other source than the breasts of this holy and pure mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4</cite>, (1539) in ed. Jaroslav Pelikan, Luther’s Works (St. Louis: Concordia Pub. House, 1955), 22:23-24</span></figcaption>

</figure><figure class="quote" id="q-d8b5db9ae0" data-kw="">
<blockquote><p>Now the question may occupy us how Christ could have brothers, since He was the only Son of Mary, and the Virgin Mary bore no children besides Him. Some say that Joseph had been married before his marriage to Mary, and that the children of this first wife were later called Christ’s brothers… Any children born to Joseph by other wives would have been half brothers of Christ. This is the explanation offered by some. But I am inclined to agree with those who declare that “brothers” really means “cousins” here, for Holy Writ and the Jews always call cousins brothers. Be that as it may, it matters little. It neither adds to nor detracts from faith. It is immaterial whether these men were Christ’s cousins or His brothers begotten by Joseph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4</cite>, (1539) in LW, 22:214-215</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-e12a8af594" data-kw="">
<blockquote><p>For this reason, too, Scripture does not quibble or speak about the virginity of Mary after the birth of Christ, a matter about which the hypocrites are greatly concerned, as if it were something of the utmost importance on which our whole salvation depended. Actually, we should be satisfied simply to hold that she remained a virgin after the birth of Christ because Scripture does not state or indicate that she later lost her virginity. We certainly need not be so terribly afraid that someone will demonstrate, out of his own head apart from Scripture, that she did not remain a virgin. But the Scripture stops with this, that she was a virgin before and at the birth of Christ; for up to this point God had need of her virginity in order to give us the promised blessed seed without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, LW, 45:205-206</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-74ab6f9bac" data-kw="">
<blockquote><p>The conjecture which some have drawn from these words [‘How shall this be, seeing I know not a man?’], that she had formed a vow of perpetual virginity, is unfounded and altogether absurd. She would, in that case, have committed treachery by allowing herself to be united to a husband, and would have poured contempt on the holy covenant of marriage; which could not have been done without mockery of God. Although the Papists have exercised barbarous tyranny on this subject, yet they have never proceeded so far as to allow the wife to form a vow of continence at her own pleasure. Besides, it is an idle and unfounded supposition that a monastic life existed among the Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Luke</cite>, ch. 1, v. 34</span></figcaption>

<blockquote><p>Doctrine 3. Christ was born of Mary, remaining still a virgin after He was born. This is gathered from the scope of the words [Mt. 1:20], the question being about this, whether Mary were a virgin or no; and the words of the angel were to assure him that she was. Reason. 1. Is that this might be a singular and miraculous sign to the whole house of Israel, and this is it that is pointed at, in Isa. 7:14. Reason 2. That the prophesies going before of this thing might be fulfilled. Reason 3. That God’s omnipotency in this so divine a mystery, and principal a work of God, might be evidently shown. Now it was not difficult to the power of God that a son should be born of a virgin. For seeing all second causes act by their virtue which they received from God, it is not to be doubted, but that God can produce all these effects without this or that cause cooperating, which otherways use to exist by them. Yet not onely the power of God appeared in that work, but also his wisdom, to which it was most agreeable, that so singular a substance of human nature, should in as singular a manner be brought to pass, that differed from all others. For in three manners all men were made before: 1. Without the concurrence of either man or woman, as in the creation of Adam. 2. Without the concurrence of woman, as in the production of Eve. 3. By the concurrence of man and woman, as in all ordinary generation afterwards. And this only is the proper and peculiar one of Christ, by and of a woman, without concurrence of a man. Reason 4. That it might easily appear how the contagion of sin might be removed from the human nature of Christ. [The] Use, is of confirmation, for strengthening of our faith about the person of Christ; to wit, that He was both the Messiah of old promised, and the promised seed of the woman in that peculiar manner, as that promise seems to have intended; to wit, the Son of Man; that is, of a woman descending of Adam and other men in ordinary way, but made mother of a son not vulgarly or after the common manner, but miraculously and without the company of a man begotten, and born; so that from his first conception all things were in him supernatural; about which our minds being busied, ought always to be lifted up to supernatural contemplations, laying aside carnal and worldly thoughts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion, or, A Plain and Easy Draught of the Christian Catechism in 52 Lectures</cite>, … (London: Mabb, 1659), 14th Lord’s Day, pp. 100-101</span></figcaption>

</figure><figure class="quote" id="q-861d4e5588" data-kw="">
<blockquote><p>Wherefore there remaineth two rules for to judge of spirits. One is, if the opinions, as touching faith be retained perfect and pure. And this meant John when he said: ‘If any man confess the Lord Jesus,’ etc. And this confession of opinions must be examined by the holy Scriptures: the which seeing they had not in the Church at the beginning, as concerning the New Testament, they were examined by the words and doctrine of the apostles. Therefore John a little after says: ‘He that is of God heareth us, and he that heareth not us is not of God.’ Then he adds, that thus we do prove the spirit. Another rule is of manners and life: This did Christ express when he said: ‘By their fruits ye shall know them.‘ And as opinions are known by examining of them with the Scriptures, so life and manners should be tried by the discipline of the Church… In the primative Church a gift was extant whereby it might easily be known with what spirit they which did speak were led. By these means Satan was resisted when he transformed himself into an angel of light.</p></blockquote>

<blockquote><p>Christ’s first disciples were chosen by Him in order that they might disperse throughout the whole world, and preach His faith everywhere, according to Mt. 28:19, “Going… teach ye all nations.” Now it was not fitting that they who were being sent to teach others should need to be taught by others, either as to how they should speak to other people, or as to how they were to understand those who spoke to them; and all the more seeing that those who were being sent were of one nation, that of Judea, according to Is. 27:6, “When they shall rush out from Jacob [*Vulg.: ‘When they shall rush in unto Jacob,’ etc.]… they shall fill the face of the world with seed.</p></blockquote>

<blockquote><p>3. Isn’t the Holy Spirit being given nowadays, then, brothers and sisters? Anyone who thinks that, isn’t worthy to receive it. It certainly is given nowadays. So why is nobody speaking with the tongues of all nations, as people spoke who were filled with the Holy Spirit at that time? Why? Because what that signified has been fulfilled. What was that? When we celebrated the fortieth day, remember, I drew your attention to how the Lord Jesus Christ drew a sketch of his Church and then ascended. His disciples were asking, “When will the end of the world be?” And he said, it is not for you to know the times or moments, which the Father has placed under his own authority. He had still to promise what he has carried out today: You will receive the power of the Holy Spirit coming down upon you, and you will be witnesses to me in Jerusalem, and in the whole of Judea and Samaria, and as far as the ends of the earth (Acts 1:7–8). The Church was then in one house, it received the Holy Spirit; it consisted of a few people, it consisted of the languages of the whole world. There you have what it was pointing forward to now. the fact, I mean, that that small Church was speaking with the tongues of all nations, what else can it signify but that this great Church from the rising of the sun to its setting (Ps 113:3) is speaking with the tongues of all nations? Now is being fulfilled what was then being promised.</p></blockquote>

<blockquote><p>From the very beginning of the Reformation there have been various attempts for a composition of the differences between the church of Rome and those who were departed from it. Councils of princes, conventions of divines, imperial edicts, sedate consultations of learned men, have all been made use of unto this end; and all in vain. And it was for a while the judgment of most wise men, that the council of Trent had rendered all reconciliations, so much as by a pretence of any condescension on the part of Rome, utterly impossible; for it hath bound itself and all the world that will own its authority, under solemn curses, not to make any change or alteration in the present state of the papal church, though the salvation of all men living should depend thereon.</p></blockquote>

</figure><figure class="quote" id="q-41d0c5ea1b" data-kw="">
<blockquote><p>At the Synod of Dort, the foreign delegates spoke as broadly as possible about the worth and sufficiency of Christ’s sacrifice. The English theologians even stated that Christ, in a sense, had died for all: “Christ so died for all that all people and individuals, with faith mediating, can gain remission of sins and eternal life in virtue of this ransom (ἀντιλυτρον).”117 In England, over against the rigorously Reformed school of Twisse, Rutherford, Gillespie, Goodwin, and others, there was a moderate group represented by Davenant, Calamy, Arrowsmith, Seaman, and others and especially by Richard Baxter.118 Their view completely agreed in substance with that of the French theologians Cameron, Testard, Amyraut, and others. There was an antecedent decree by which Christ had conditionally satisfied for all, on condition of faith, and another subsequent particular decree by which he had so made satisfaction for the elect that he would in time also grant them faith and infallibly lead them to salvation.”119 117 Acta, National Synod of Dort (1620), Judicia, 79. 118 Richard Baxter (1615–91) published his Universal Redemption of Mankind by the Lord Jesus Christ and thereby contributed substantially to the introduction of Amyraldism in England. His contemporary, Isaac Barrow (1630–77), author of The Doctrine of Universal Redemption Asserted and Explained, had committed to Arminianism (see W. Cunningham, Hist. Theol., II, 328). Against their hypothetical universalism it was objected that if Christ died for all on condition of faith, he cannot have died for the children who can never actually believe. Cf. B. B. Warfield, “The Making of the Westminster Confession, and Especially of Its Chapter on the Decree of God,” Presbyterian and Reformed Review 12 (1901): 226–83. 119 Cf. H. Bavinck, Reformed Dogmatics, II, 368–72; C. Vitringa, Doctr. christ., VI, 138ff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: Sin and Salvation in Christ</cite>, trans. John Bolt and John Vriend (Baker Academic, 2006), 3:460–61.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

<blockquote><p>The Compromise of the School of Saumur. The School of Saumur represents an attempt to tone down the rigorous Calvinism of the Synod of Dort, and to avoid at the same time the error of Arminianism. This is seen especially in the work of Amyraldus, who boldly taught a hypothetical universalism, which was really a species of universal atonement. God willed by an antecedent decree that all men should be saved on condition of repentance and faith in Jesus Christ. He therefore sent Christ into the world to die for all men. But seeing that, left to themselves, none would repent and believe, He by a subsequent decree elected some as the objects of the saving operation of His grace. These and these only are actually saved. The outcome proved this to be an untenable position. Of the followers of this school some emphasized the first decree and the universal offer of salvation based on it, with the result that they landed in the Arminian camp; and others stressed the second decree and the necessity of effectual grace, and thus returned to the Calvinistic position. The views of the School of Saumur were practically shared by Davenant, Calamy, and especially Richard Baxter, in England. Its peculiar opinions gave occasion for the construction of the Formula Consensus Helvetica by Turretin and Heidegger, in which these views are combatted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of Christian Doctrines</cite>, (William. B. Eerdmans Publishing Company, 1949), 195.</span></figcaption>

<blockquote><p>Since not only the complete finishing of this treatise under my hand, which is now about five months ago, but also the printing of some part of it, the two dissertations of Dr Davenant, of the Death of Christ, and of Predestination and Reprobation, were set forth; in both which, especially the former, there are sundry assertions, positions, and theses, differing from what is delivered in the ensuing treatise, and, as I suppose, repugnant unto truth itself. The whole of those persuasions, I confess, which he endeavoureth in them to maintain, is suited to the expressions of sundry learned men, as Austin, Hilary, Fulgentius, Prosper, who in their generations deserved exceeding well of the church of God; but that it is free from opposition to the Scripture, or indeed self-contradiction, is not so apparent. Yea, through the patience and goodness of God, I undertake to demonstrate that the main foundation of his whole dissertation about the death of Christ, with many inferences from thence, are neither found in, nor founded on the word; but that the several parts thereof are mutually conflicting and destructive of each other, to the great prejudice of the truth therein contained. It is a thing of the saddest consideration possible, that wise and learned men should once suppose, by tempering the truths of God so that they may be suited to the self-indulgency of unsubdued carnal affections, to give any lustre to them, or in the least to remove that scandal and offence which the fleshly-minded doth take continually at those ways of God which are far above out of his sight. That this is the grand design of such undertakings as that of the learned bishop now mentioned, even to force the mysteries of the gospel to a condescension and suitableness unto the unpurged relics of the wisdom of nature, when all other thoughts ought to be captivated to the obedience thereof, is to me most apparent. Whence else should it proceed that so many unscriptural distinctions of the various intentions of God in the business of redemption, with the holding out, for the confirmation of one part of their opinion,—namely, “That Christ died for all and every one in such a sense,”—those very arguments which the most that own the truth of their inferences do employ merely against the latter part of their opinion,—namely, “In some sense he died only for the elect,”—with sundry inextricable entanglements, should fill up both the pages of their discourses? It is no way clear to me what glory redoundeth to the grace of God, what exaltation is given to the death of Christ, what encouragement to sinners in the things of God, by maintaining that our Saviour, in the intention and the designment of his Father, died for the redemption of millions for whom he purchased not one dram of saving grace, and concerning whom it was the purpose of God from eternity not to make out unto them effectually any of those means for a participation in the fruits of his death, without which it is impossible but it should be useless and unprofitable unto them; and yet this is the main design of that Dissertation concerning the Death of Christ. What in that and the ensuing discourse is argued and contended for according to the mind of God we thankfully accept; and had it not been condited with the unsavoury salt of human wisdom, it had been exceeding acceptable, especially at this time: for that there are some more than ordinary endeavours for the supportment and re-enforcing of the almost conclamated cause of Arminianism ready to be handed unto public view is commonly reported and believed; concerning which, also, many swelling words (of which there lies great abundance on every side) are daily vented, as of some unparalleled product of truth and industry, as though “Nil oriturum alias, nil ortum tale,” [nothing like it has arisen, nothing like it will arise again] for the most part by such as are utterly ignorant how far these controversies have been sifted, and to what issue they have been driven long ago.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold (T&amp;T Clark, n.d.), 10:432–33. Emphasis added. NB: the translation of the Latin is supplied by the HB. It is a quotation from book 2, epistle 1, line 16 of the Epistles of Horace.</span></figcaption>

<blockquote><p>Hence I believe that there is one Church of those who have the same Spirit, through whom they are made certain that they are the true children of the family of God; and this is the first fruits of the Church. I believe that this Church does not err in regard to truth, namely in those fundamental matters of faith upon which everything depends. I believe also that the universal, visible Church is one, while it maintains that true confession, of which we have already spoken. I believe also that all belong to this Church who give their adherence to it according to the rule and promise of God’s Word. I believe that to this Church belong Isaac, Jacob, Judah and all who were of the seed of Abraham, and also those infants whose parents in the first beginnings of the Christian Church, through the preaching of the apostles, were won to the cause of Christ. For if Isaac and the rest of the ancients had not belonged to the Church, they would not have received the Church’s token, circumcision. Since these, then, were members of the Church, infants and children belonged to the primitive Church. Therefore I believe and know that they were sealed by the sacrament of baptism. For children also make a confession, when they are offered by their parents to the Church, especially since the promise offers them to God, which is made to our infants no less, but even far more amply and abundantly, than formerly to the children of the Hebrews. These are the grounds for baptizing and commending infants to the Church, against which all the weapons and war engines of the Anabaptists avail nothing. For not only are they to be baptized who believe, but they who confess, and they who, according to the promise of God’s Word, belong to the Church. For otherwise even the apostles would not have baptized anyone, since no apostle had absolute evidence regarding the faith of one confessing and calling himself a Christian. For Simon the impostor, Ananias, Judas, and no one knows who, were baptized when they declared their adherence to Christ, even though they did not have faith. On the other hand, Isaac was circumcised as an infant without declaring his adherence or believing, but the promise acted in his behalf. But since our infants are in the same position as those of the Hebrews, the promise also declares their adherence to our Church and makes confession. Hence, in reality baptism, like circumcision (I am speaking of the sacrament of baptism) pre-supposes nothing but one of two things, either confession, i.e., a declaration of allegiance or a covenant, i.e., a promise. All of which will become somewhat clearer from what follows.</p></blockquote>

</figure><figure class="quote" id="q-14f5c6fd75" data-kw="">
<blockquote><p>Therefore we are fighting today, not against the obvious wickedness and vice of the papacy but against its fictitious saints, who think that they lead an angelic life when they observe not only the commandments of God but also the counsels of Christ and works that are not required or works of supererogation. We say that this is a waste of time and effort, unless they have grasped that “one thing” which Christ says is the only thing “needful” and, like Mary, have chosen the good portion, which cannot be taken away from them (Luke 10:42). That is what Bernard did. He was a man so pious, holy, and chaste that I think he deserves to be put ahead of all other monks. Once, when he was gravely ill and despaired of his life, he did not place his trust in the celibacy that he had observed so chastely, or in the good works and acts of piety that he had performed in such quantity; but he put all these far from sight and took hold of the blessing of Christ by faith, saying: “I have lived damnably. But Thou, O Lord Jesus Christ, hast a double right to the kingdom of heaven: first, because Thou art the Son of God; secondly, because Thou hast won it by Thy passion and death. The first Thou dost keep for Thyself by Thy birthright; the latter Thou dost grant to me by the right, not of works but of grace.” He did not set his monkery or his angelic life against the wrath and judgment of God but took hold of the one thing that is needful and thus was saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 459–460.</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome.html">Rome</a></span></div>

</figure><figure class="quote" id="q-e4a400e150" data-kw="">
<blockquote><p>Ever since God revealed himself Father to us, we must prove our ungratefulness to him if we did not in turn show ourselves his sons. Ever since Christ cleansed us with the washing of his blood, and imparted this cleansing through baptism, it would be unfitting to befoul ourselves with new pollutions. Ever since he engrafted us into his body, we must take especial care not to disfigure ourselves, who are his members, with any spot or blemish. Ever since Christ himself, who is our Head, ascended into heaven, it behooves us, having laid aside love of earthly things, wholeheartedly to aspire heavenward. Ever since the Holy Spirit dedicated us as temples to God, we must take care that God’s glory shine through us, and must not commit anything to defile ourselves with the filthiness of sin. Ever since both our souls and bodies were destined for heavenly incorruption and an unfading crown, we ought to strive manfully to keep them pure and uncorrupted until the Day of the Lord. These, I say, are the most auspicious foundations upon which to establish one’s life. One would look in vain for the like of these among the philosophers, who, in their commendation of virtue, never rise above the natural dignity of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, [Battles Edition], III.vi.3.</span></figcaption>

</figure><figure class="quote" id="q-02b0eac0a6" data-kw="">
<blockquote><p>Today, also, those crackpots, the Anabaptists, who cause so much trouble in the world, who denounce governments, magistrates, the unity of the church, never tire of repeating this phrase, “Blessed are those who suffer persecution.” Yes, but do they suffer on account of righteousness? The answer is no: the opposite is true. We should have the word “‘righteousness’ firmly written in our hearts, and ensure that, whenever we are persecuted, our conscience testifies before God that our cause is just. For that is the mark chosen by Christ to distinguish his disciples from those who are brigands, thieves, murderers, blasphemers, and adulterers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Beatitudes</cite>, (Carlisle, PA: Banner of Truth Trust, 2006), 60–61.</span></figcaption>

<blockquote><p>The other things must be briefly dispatched; for otherwise we should never be able to get out of this forest. We shall merely mention a few of the alleged relics of saints who lived in the days of our Saviour, and then mention a few of those of the ancient martyrs and others. In this way my readers will be able to judge for themselves. Anna, mother of the Virgin Mary, has one of her bodies at Apte in Provence, and another in the church of Mary Insulan at Lyons. Besides, she has one of her hands at Treves, another at Turin, and a third in a town of Thuringia, which takes its name from it. I say nothing of the fragments which exist in more than a hundred places. Among others, I remember having myself, long ago, kissed a portion of it at Ursicampus, a monastery in the vicinity of Noyon, where it is held in great reverence. Lastly, another of her arms is in St Paul’s at Rome. Here, if it be possible, let some certainty be shown. We now come to Lazarus, and his sister the Magdalene. He, as far as I know, has only three bodies; one at Marseilles, another at Austum, a third at Avallon. Between these towns there was a great controversy, but after large sums were expended on both sides, they left the matter as it was, each continuing to maintain its claims. Magdalene being a female, it was necessary to make her inferior to her brother, and, therefore, she has only two bodies, one of which is at Vesoul, near Auxerre, and another, which is of greater renown, at San Maximin, a town of Provence, where also her head exists separately, together with what is called the Noli me tangere, which is a bit of wax, but is said to be the mark of a blow which our Saviour gave her in anger when she wished to touch him. I need not advert to the relics of her bones and hair, which are scattered over the world. Those who wish to know the certainty of all these things, should first inquire whether Lazarus, and his sisters Martha and Magdalene, ever came to France for the purpose of preaching the gospel. For if ancient history be read and examined with judgment, it will be seen that this is the most stupid of all fables, and has not the least shadow of plausibility. Yet the relics of Lazarus and Mary are the best authenticated relics of all. Be this as it may, was it not enough to pervert one body to idolatry, instead of proceeding, according to the common saying, to make three devils out of one? In like manner, they have given a place among their deities to him who pierced the side of our Lord when on the cross, and have called him Longinus, a puerile blunder certainly. This name in Greek signifies a spearman, but they have laid hold of it and converted it into the proper name of an individual. After thus naming him, they have given him two bodies, one of which is at Mantua, and the other at the church of Mary Insulan at Lyons. They have done the same with the Magians who came to worship Christ after his birth. And first they have fixed the number of them, maintaining that there were three only. The Gospel nowhere says how many there were, while some of the ancient doctors, for instance, the writer of an unfinished Commentary on Matthew, which is sometimes attributed to Chrysostom, affirms that there were fourteen. The Evangelist calls them Magians, that is, philosophers, but they have taken it upon them to give them royal dignity, though without kingdom or subjects. And lastly, they have given them names, calling the one Belthasar, the other Melchior, and the other Gaspar. However, if we may be permitted to interfere with their fables, it is most certain that these philosophers returned to the East. This the Scripture expressly declares; and there is no ground at all for any other belief than that they died there. Who was it that afterwards transferred them from those regions? Who knew them so well, that he could identify their bodies, for the purpose of being converted into relics? But I desist. It is foolish to engage in refuting such absurdities. All I say is, that the inhabitants of Cologne and of Milan should be left to litigate among themselves as to which of the two is to possess them. Both claim them, and it is impossible that both can be right. When once they bring their law-suit to a close, it will be time to see what should be done. Among ancient martyrs, Dionysius is particularly celebrated; for he is held to be a disciple of the Apostles, and the first evangelist of the French. On this account relics of him are preserved in many places, while his body exists entire in two places only, viz., St Denis and Ratisbon. Because the French claimed him exclusively to themselves, the people of Ratisbon raised an action against them at Rome about a hundred years ago, and the body was adjudged to them by a definitive sentence, while the Legate of France was personally present, and a very fine Bull to this effect was given to them. But should any person go to St Denis, which is in the neighbourhood of Paris, and deny that the body is there, he would be stoned. At the same time, should any one deny that it is at Ratisbon, he would be counted a heretic; for his denial would be rebellion against the Apostolic See. The prudent plan, therefore, will be not to meddle with their disputes. Let them tear out each other’s eyes if they will; the utmost they will gain will be to prove that the whole matter is a lie. The body of Stephen they have so dissected, that, though it is entire at Rome, in the church which bears his name, the head is at Arles, and bones are in more than two hundred places; while, as if to show their approval of those who put him to death, they have consecrated even the stones by which he was murdered. It will, perhaps, be asked how they could be identified, where they were found, and out of whose hands they were recovered? I give this short reply, that it is a foolish question. There could be no difficulty in finding them, wherever stones are found, and the carriage is not costly, as at Florence, at Arles, in the monastery of the Augustins, and at Vigeon, in Aquitaine. Any one who chooses to shut his eyes, and deprive himself of all understanding, will believe that they are the very stones that stoned Stephen; while he, again, who will give some little heed to the matter, will laugh. But assuredly the Carmelites of Poictiers, within the last fourteen years, possessed one to which they assigned the office of assisting women in labour, and easing their pains. The Dominicans, from whom one, destined like a pearl for the same purpose, had been stolen, had a mighty quarrel with them, and bawled out imposture; but the Carmelites, by fighting stoutly, came off victorious.</p></blockquote>

<blockquote><p>With regard to the Virgin Mary, as they give out that her body is not on the earth, they are of course prevented from pretending to have her bones; were it otherwise, I can well believe they would have given her a body of such a size as would suffice to fill a thousand sarcophaguses. What is denied with reference to the whole body, they have endeavoured to compensate by hair and milk. Some hairs are shown at Rome, in the church of Mary supra Minerva, at St Salvator’s in Spain, at Mascon, at Clugny, at Nocera, at Sanflor, at St James’s, and many other places. As to the milk, it cannot be necessary to enumerate all the places where it is shown. Indeed, the task would be endless, for there is no town, however small, no monastery or nunnery, however insignificant, which does not possess it, some in less, and others in greater quantities; not that they would have been ashamed to have it in hogsheads, but they thought the lie might be more plausible if they had only a small, quantity,—as much, for instance, as could be contained in a small gallipot or phial; for in this form it can be kept back from minute inspection. But had the breasts of the most Holy Virgin yielded a more copious supply than is given by a cow, or had she continued to nurse during her whole lifetime, she scarcely could have furnished the quantity which is exhibited. Again, I would fain know how that milk, which is at present almost everywhere exhibited, was collected, so as to be preserved until our time. We do not read of any person who had the curiosity to undertake the task. We read, indeed, that the shepherds worshipped Christ, and that the Magians presented gifts to him, but we nowhere read of her having given milk as a kind of return for their presents. Luke relates the prophecy which Simeon made to the Virgin; but he does not say that Simeon asked her to give him some milk. If the matter be only looked to, it will be unnecessary to offer any argument for the purpose of showing how utterly devoid of reason, and all appearance of probability, this wild dream is. It is strange how it never occurred to them to pare her nails, and get other things of that kind, when there was nothing else of the body they could get; but perhaps it was impossible for them to mind every thing. The other relics of the Virgin, which they boast of having, form part of her wardrobe and baggage. First, there is a shirt at Chartrain, which is a very celebrated object of idolatry, and there is another at Acqs in Germany. It is needless to ask where they found them; for it is most certain that the Apostles and other pious men were not so foolish as to occupy their minds with such frivolities. But let its form only be examined, and I will instantly succumb, if the imposture does not become visible even to the eye. At Acqs, where is one of the shirts we have mentioned, it is carried round in solemn state fastened to a pole, and is as long as a white surplice. Had the Virgin been of the race of the giants, I don’t believe she would have had so long a shirt. To give more importance to the exhibition, they, at the same time, produce shoes belonging to St Joseph, which would only fit a boy or a dwarf. There is an old proverb, “A liar should have a good memory.” That proverb has been little attended to here; for so short has been their memory, that they have forgotten to attend to the measure of the husband’s shoes and his wife’s shirt. Now, let them run about, and, with the greatest veneration, kiss their relics which have not the least semblance of being genuine. I know of only two gowns, one at Treves, in the church of St Maximin, and another at Lisia in Italy. I should like much to examine them, that it might be seen what kind of web they are made of, and whether it is such as the Jews of that period were wont to weave. I should like also that the two gowns were compared together, to ascertain whether there is any similarity between them. At Bonne there is a certain scarf. Some one will ask me if I think it is fictitious. I answer, that I have the same opinion of it that I have of the two girdles, the one of which is at Prague, and the other at St Iago of Montserrat, and also of the slipper which is at St James’s, and the shoe at Sanflor. But if there were no other objection, every person not absolutely sunk in ignorance is aware that the pious had no such custom as that of collecting shoes and sandals, in order to make relics of them, and that for 500 years after the Virgin’s decease not one of these things was ever heard of. What need, therefore, for farther discussion, as if the matter were at all doubtful? Nay, they have even thought proper to calumniate the most holy Virgin, by representing her as excessively careful about decking her person, and combing her hair; for they show two combs that belonged to her. One of them is in St Martin’s at Rome, the other in St John’s at Besançon. It is probable there are a great many more in other places. If this is not to hold up the holy Virgin to derision, I know not what derision is. Moreover, they have not forgotten her marriage-ring, which is to be seen at Perugia. Because it is now customary with us for the husband at marriage to present his bride with a ring, they have imagined, without making more inquiry about the matter, that it was customary also at that time. What they have adopted for this purpose is a beautiful ring of great value, never thinking of the great poverty in which the Virgin spent her life. Of her wardrobe, part is seen at Rome, in the church of Joannes Lateranensis, of St Barbara, of Mary supra Minerva, and part at Blois, and also at St Salvator’s in Spain; at least, they boast of having some fragments of them there. I have also heard other places mentioned, but they escape my memory. To detect the imposture, it were only necessary to inspect the texture of this clothing. They seem to have imagined it as easy for the Virgin to put herself in full dress, as it is for them to deck their idols, which they are ever and anon furnishing with new attire. It remains to speak of pictures—not pictures in general, but those which are specially celebrated for some singular quality. And, first, they pass off an imposture in the name of Luke, pretending that he painted four pictures of the Virgin, and that these are now at Rome. In the church of St Mary the Immaculate one of them is shown at the altar, where it is hung up, as they say, in devotion to her, together with the ring which Joseph gave her on her espousals. Another is shown at Rome also, in the church of Mary Nova, and is said to have been painted by Luke at Troas, and brought thither by an angel. Another is in the church of St Mary called Aracali, and is in the form of a cross. But at the church of St Augustine they give out that they have the most remarkable of all; for if they are to be credited, it is one which Luke carried constantly about with him, and even wished to be put into his coffin when he died. What blasphemy, I ask, to convert a holy evangelist of God into an impious idolator? And what pretence have they for holding that Luke was a painter? Paul calls him a physician, but on what grounds they assign to him skill in painting I have not the least idea. Even if it were true that he practised this art, it is not a whit more probable that he would have painted the Virgin than that he would have painted Jupiter or Venus, or any other idol. It certainly was not the practice at that period for Christians to have idols, nor was it introduced till long after, when the Church had been corrupted with superstition. Again, every comer of the globe is filled with pictures said to have been painted by Luke, as at Cambray, and many other places. And in what form? in such colours as one might be expected to employ in painting an abandoned woman. God hath so blinded them that they have shown no more consideration in this matter than the beasts that perish. However, it does not seem strange to me that they have attributed pictures of the Virgin to Luke, since they have practised similar imposition in the name of Jeremiah. Evidence of their impudence in this respect may be seen at Puteus, a town of Auvergne. Now, I should have thought it time for miserable men to open their eyes, and see through a matter so transparent. I say nothing of Joseph, though some are said to have his shoes, as at Treves, in the monastery of Simeon, and others to have his sandals, while to others are reserved his bones. The specimens already given should be a sufficient exposure of the absurdity. I must, however, add the case of the archangel Michael, and his attendance on the Virgin Mary. It will be thought I am in jest when I speak of the relics of an angel. Comedians and players have laughed at this, but monkish and priestly impostors have not, therefore, ceased to deceive the people in good earnest. For the inhabitants of Carcassone boast that they have relics belonging to him, as do also those of Tours, in their church of St Julian. In the great church of St Michael, which is frequented by crowds of pilgrims, they show his dagger, which looks very much like the one boys play with. They show also his shield, which in appearance exactly corresponds with the dagger, resembling the brass circles which are put upon horses’ harness. Assuredly there is no man and no old woman so dull as not to see how ridiculous those things are. But because the lies are covered with the veil of religion, the iniquity of thus deriding God and angels is not perceived. Some may here object the express declaration of Scripture, that Michael fought with the devil. True; but if the devil were to be vanquished, it behoved to be with a stronger and a sharper sword than that one. Are they so brutish as to imagine that the war which both angels and believers wage with devils is carnal, and carried on with daggers and sharp weapons? But it is just as I have observed before: mankind have richly deserved, by their brutish stupidity, to be so deceived, while with perverse eagerness they have gone about in all directions collecting idols and images, to which they might give worship, instead of giving it to the living God.</p></blockquote>

e+great+poverty+in+which+the+Virgin+spent+her+life.+Of+her+wardrobe%2C+part+is+seen+at+Rome%2C+in+the+church+of+Joannes+Lateranensis%2C+of+St+Barbara%2C+of+Mary+supra+Minerva%2C+and+part+at+Blois%2C+and+also+at+St+Salvator%E2%80%99s+in+Spain%3B+at+least%2C+they+boast+of+having+some+fragments+of+them+there.+I+have+also+heard+other+places+mentioned%2C+but+they+escape+my+memory.+To+detect+the+imposture%2C+it+were+only+necessary+to+inspect+the+texture+of+this+clothing.+They+seem+to+have+imagined+it+as+easy+for+the+Virgin+to+put+herself+in+full+dress%2C+as+it+is+for+them+to+deck+their+idols%2C+which+they+are+ever+and+anon+furnishing+with+new+attire.+It+remains+to+speak+of+pictures%E2%80%94not+pictures+in+general%2C+but+those+which+are+specially+celebrated+for+some+singular+quality.+And%2C+first%2C+they+pass+off+an+imposture+in+the+name+of+Luke%2C+pretending+that+he+painted+four+pictures+of+the+Virgin%2C+and+that+these+are+now+at+Rome.+In+the+church+of+St+Mary+the+Immaculate+one+of+them+is+shown+at+the+altar%2C+where+it+is+hung+up%2C+as+they+say%2C+in+devotion+to+her%2C+together+with+the+ring+which+Joseph+gave+her+on+her+espousals.+Another+is+shown+at+Rome+also%2C+in+the+church+of+Mary+Nova%2C+and+is+said+to+have+been+painted+by+Luke+at+Troas%2C+and+brought+thither+by+an+angel.+Another+is+in+the+church+of+St+Mary+called+Aracali%2C+and+is+in+the+form+of+a+cross.+But+at+the+church+of+St+Augustine+they+give+out+that+they+have+the+most+remarkable+of+all%3B+for+if+they+are+to+be+credited%2C+it+is+one+which+Luke+carried+constantly+about+with+him%2C+and+even+wished+to+be+put+into+his+coffin+when+he+died.+What+blasphemy%2C+I+ask%2C+to+convert+a+holy+evangelist+of+God+into+an+impious+idolator%3F+And+what+pretence+have+they+for+holding+that+Luke+was+a+painter%3F+Paul+calls+him+a+physician%2C+but+on+what+grounds+they+assign+to+him+skill+in+painting+I+have+not+the+least+idea.+Even+if+it+were+true+that+he+practised+this+art%2C+it+is+not+a+whit+more+probable+that+he+would+have+painted+the+Virgin+than+that+he+would+have+painted+Jupiter+or+Venus%2C+or+any+other+idol.+It+certainly+was+not+the+practice+at+that+period+for+Christians+to+have+idols%2C+nor+was+it+introduced+till+long+after%2C+when+the+Church+had+been+corrupted+with+superstition.+Again%2C+every+comer+of+the+globe+is+filled+with+pictures+said+to+have+been+painted+by+Luke%2C+as+at+Cambray%2C+and+many+other+places.+And+in+what+form%3F+in+such+colours+as+one+might+be+expected+to+employ+in+painting+an+abandoned+woman.+God+hath+so+blinded+them+that+they+have+shown+no+more+consideration+in+this+matter+than+the+beasts+that+perish.+However%2C+it+does+not+seem+strange+to+me+that+they+have+attributed+pictures+of+the+Virgin+to+Luke%2C+since+they+have+practised+similar+imposition+in+the+name+of+Jeremiah.+Evidence+of+their+impudence+in+this+respect+may+be+seen+at+Puteus%2C+a+town+of+Auvergne.+Now%2C+I+should+have+thought+it+time+for+miserable+men+to+open+their+eyes%2C+and+see+through+a+matter+so+transparent.+I+say+nothing+of+Joseph%2C+though+some+are+said+to+have+his+shoes%2C+as+at+Treves%2C+in+the+monastery+of+Simeon%2C+and+others+to+have+his+sandals%2C+while+to+others+are+reserved+his+bones.+The+specimens+already+given+should+be+a+sufficient+exposure+of+the+absurdity.+I+must%2C+however%2C+add+the+case+of+the+archangel+Michael%2C+and+his+attendance+on+the+Virgin+Mary.+It+will+be+thought+I+am+in+jest+when+I+speak+of+the+relics+of+an+angel.+Comedians+and+players+have+laughed+at+this%2C+but+monkish+and+priestly+impostors+have+not%2C+therefore%2C+ceased+to+deceive+the+people+in+good+earnest.+For+the+inhabitants+of+Carcassone+boast+that+they+have+relics+belonging+to+him%2C+as+do+also+those+of+Tours%2C+in+their+church+of+St+Julian.+In+the+great+church+of+St+Michael%2C+which+is+frequented+by+crowds+of+pilgrims%2C+they+show+his+dagger%2C+which+looks+very+much+like+the+one+boys+play+with.+They+show+also+his+shield%2C+which+in+appearance+exactly+corresponds+with+the+dagger%2C+resembling+the+brass+circles+which+are+put+upon+horses%E2%80%99+harness.+Assuredly+there+is+no+man+and+no+old+woman+so+dull+as+not+to+see+how+ridiculous+those+things+are.+But+because+the+lies+are+covered+with+the+veil+of+religion%2C+the+iniquity+of+thus+deriding+God+and+angels+is+not+perceived.+Some+may+here+object+the+express+declaration+of+Scripture%2C+that+Michael+fought+with+the+devil.+True%3B+but+if+the+devil+were+to+be+vanquished%2C+it+behoved+to+be+with+a+stronger+and+a+sharper+sword+than+that+one.+Are+they+so+brutish+as+to+imagine+that+the+war+which+both+angels+and+believers+wage+with+devils+is+carnal%2C+and+carried+on+with+daggers+and+sharp+weapons%3F+But+it+is+just+as+I+have+observed+before%3A+mankind+have+richly+deserved%2C+by+their+brutish+stupidity%2C+to+be+so+deceived%2C+while+with+perverse+eagerness+they+have+gone+about+in+all+directions+collecting+idols+and+images%2C+to+which+they+might+give+worship%2C+instead+of+giving+it+to+the+living+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%9CAn+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%E2%80%9D+in+Tracts+Relating+to+the+Reformation%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+316%E2%80%93321&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e52676006.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e52676006.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-9/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>For to convince all men how little credit is due to the proofs which they adduce in support of their relics, it is to be observed, that the chief and most authentic of those which are seen at Rome are said to have been brought thither by Titus and Vespasian. This fiction is hot a whit more ingenious than if it were said that the Grand Turk went to Jerusalem in order that he might bring the cross of Christ to Constantinople. Vespasian, before he became Emperor, subdued and laid waste a part of Judea. Afterwards, when he had obtained the empire, his son Titus, whom he had left in command, took Jerusalem. Now, both of them were heathens, and cared no more for Christ than if he had never been born. In the same way, we may judge whether, in alleging that Godfrey of Boulogne, or King Louis, brought these relics, they have not lied with equal effrontery as when they said it was Vespasian. Besides, let it be considered what kind of judgment was displayed by that king to whom they give the name of St Louis, and by others like him. They had, no doubt, a semblance of religion, and a zeal, such as it was, for the propagation of the Christian name. But if the droppings of goats had been shown them, and they been told at the same time that they were the Virgin Mary’s beads, they would have worshipped them at once, without ever debating the matter, and would have sent ships to transport them to any place where they were to be set up and honoured. It cannot be denied they wasted both their resources and their bodily strength, and also spent a goodly part of their revenues in bringing back a heap of indescribable trifles and toys, by which the minds of men were so fascinated as to regard them as most valuable jewels. To give a clearer illustration of the fact, I may observe, that throughout the whole of Greece, Asia Minor, and Mauritania, and the whole of those countries which go under the name of the Indies, all the antique relics which our idolaters imagine that they possess here are there exhibited with the greatest confidence. How are we to decide between these two parties? Our people say that the relics were brought away from those places. The Christians who are living there affirm that they still possess them, and deride our foolish boasting. How can the dispute be decided without investigation—investigation, however, which cannot, and never will, be made? The only remedy is to despise both, and leave the matter as it is, in statu quo. The last class of relics belonging to Christ are those which relate to events subsequent to his resurrection; e. g. the piece of broiled fish which Peter offered to him when he appeared on the sea-shore. It must have been wondrously well salted if it has kept for such a long series of ages! But, jesting apart, is it supposable that the apostles made relics of what they had actually prepared for dinner? Whoever does not perceive that the whole matter is an open mockery of God, I must leave as unworthy of being farther addressed on the subject. Then we have the miraculous blood which has flowed from many of the hosts at mass; as at Paris, in the church of John Arenarius, and also in that of John the Angel; as also at Dijon, and many other places. And, in order to enlarge the heap, they have added the impious knife with which the host was stabbed at Paris by a certain Jew. This knife the Parisians regard with greater veneration than the host itself. When Doctor à Quercus, who held the cure of St John Arenarius, found that the donations made to this host stood in his way, (his gains being diminished in proportion to what the knife received,) he indignantly exclaimed, that they were worse than the Jews, inasmuch as they were worshipping a knife which had been the instrument of violating the sacred body of Christ. I have adduced this instance, because the exclamation would equally apply to the spear, the nails, and the crown of thorns; all who adore them being, in the opinion of Master à Quercus, more impious than the Jews by whom Christ was crucified. In like manner are shown the prints of his feet in a place where he is said to have appeared to several individuals after his ascension, as at Rome, in the church of St Lawrence, at the spot where he is said to have appeared to Peter, and foretold him that he was to suffer at Rome. Another of these foot-marks is to be seen at Poictiers, in the church of Arabegend, another at Soissons, and another at Arles. I deny not that Christ could have left the mark of his foot upon a stone. I only deny the allegation of his having actually done so. In the absence of all proper proof, I maintain that the whole ought to be regarded as a mere fable. But the most admirable specimen of this description of relics is the impression of his hips, which is seen at Rheims, on a stone behind the altar, and is said to have been left at the time when our Saviour turned mason, in order that he might build the vestibule of that church. The blasphemy is so execrable, that I am almost ashamed to mention it. To proceed, let us now attend to what is said of images, I mean not those which are usually made by painters, sculptors, and artists—(the number of these is infinite;)—but of those which possess some special claim to respect, and are regarded as singular and precious, as being of the nature of relics. Of these there are two kinds; for some have been miraculously formed, as that which is shown at Rome, in the portico of the church of St Mary. There is another also in the church of Joannes Lateranensis; and another, in which there is a picture of our Lord, said to have been taken at the time when he was twelve years old. There is also another at Lucca, which they say was painted by angels, and is called “The Holy Countenance.” These follies are so absurd, that I would lose my pains, and feel I was absurdly wasting my time, were I to dwell upon them. It is sufficient, therefore, merely to have noticed them in passing; for everybody knows that painting is not at all an office which belongs to angels, and that the means by which our Lord wished to make himself known, and imprinted on our memory, was very different from lifeless images. Eusebius relates, in his Ecclesiastical History, that our Saviour sent his picture, painted to the life, to King Abgarus; and this is somewhat more certain than a fiction taken from the Chronicles of Milan. But though the fact were so, how came they to obtain it from King Abgarus? It is said to be at Rome; but Eusebius says not that it was in existence up to his day. He only speaks by hearsay, as of a thing which had occurred long before. Is it to be believed, that it was brought to light six or seven hundred years after; and, quitting Persia, travelled as far as Rome? Pictures of the cross have been fabricated in the same way as those of our Saviour’s person. It is given out at Brescia, that they have the very cross that appeared to Constantine. I will not dispute the matter with them; I only send them to the Cortonians, who firmly maintain that they possess it. Let them litigate the matter between themselves, and then let the one who gains his plea come forward, and we will give him his answer. Indeed, it is not difficult to find an answer that will convict them all of folly. For when some writers say that a cross appeared to Constantine, they mean not a material cross, but the figure of a cross which was exhibited to him by a visible representation in the sky. Therefore, although the fact were true, it is clear that they have fallen into a very stupid blunder, and reared up their imposture without giving it the shadow of a foundation. But there is a second species of images which are regarded as relics, in consequence of certain services which they have performed. To this class of images belong crucifixes, on which the beard grows; for instance, one at Burgos in Spain, another in the church of St Salvator, and another in that of Aurengia. Were I to dwell upon this for the purpose of demonstrating what folly, or rather brutish stupidity, it is to believe such a thing, I should make myself ridiculous. The whole matter is so absurd in itself, that it cannot be at all necessary to spend time in refuting it, and yet the wretched populace are so dull, that the great majority of them think it just as certain as the gospel. With these, also, I class those crucifixes which have spoken, and of which there is a great multitude. But let us content ourselves with one, by way of example, viz., the one which is at St Denis in France. It spoke, they say, when it testified that the Church was dedicated. Leaving others to consider how far the importance of the matter called for such utterance, I only ask how an image of the cross could have been in the Church at that time, when, according to the custom used at dedications, all the images are removed from the Church? How did it manage to steal away and conceal itself, so as not to be removed with the rest? We see how easy a matter they must suppose it is to deceive the world, since they care not how much they contradict themselves, but deem it enough to belch forth their lies with open mouth, giving themselves no concern about any objections that might be urged. Lastly, we have got tears also; one, for instance, at Vindon, another at Treves, in the church of St Maximin, another at Orleans, in the church of Peter Puellare, besides many which are unknown to me. Some of these are said to be natural tears, as the one at St Maximin; for, according to their chronicle, our Lord let it fall when he was washing the disciples’ feet. Others are miraculous, as if it were to be believed that crucifixes of wood had so much feeling in them that they could shed tears. But we must pardon them this fault; they were ashamed to think that their images could do less than had been done by those of the heathen. The heathen pretended that their idols occasionally wept, and these crucifixes, therefore, must receive the same right, and be put on an equal footing!</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For to convince all men how little credit is due to the proofs which they adduce in support of their relics, it is to be observed, that the chief and most authentic of those which are seen at Rome are said to have been brought thither by Titus and Vespasian. This fiction is hot a whit more ingenious than if it were said that the Grand Turk went to Jerusalem in order that he might bring the cross of Christ to Constantinople. Vespasian, before he became Emperor, subdued and laid waste a part of Judea. Afterwards, when he had obtained the empire, his son Titus, whom he had left in command, took Jerusalem. Now, both of them were heathens, and cared no more for Christ than if he had never been born. In the same way, we may judge whether, in alleging that Godfrey of Boulogne, or King Louis, brought these relics, they have not lied with equal effrontery as when they said it was Vespasian. Besides, let it be considered what kind of judgment was displayed by that king to whom they give the name of St Louis, and by others like him. They had, no doubt, a semblance of religion, and a zeal, such as it was, for the propagation of the Christian name. But if the droppings of goats had been shown them, and they been told at the same time that they were the Virgin Mary’s beads, they would have worshipped them at once, without ever debating the matter, and would have sent ships to transport them to any place where they were to be set up and honoured. It cannot be denied they wasted both their resources and their bodily strength, and also spent a goodly part of their revenues in bringing back a heap of indescribable trifles and toys, by which the minds of men were so fascinated as to regard them as most valuable jewels. To give a clearer illustration of the fact, I may observe, that throughout the whole of Greece, Asia Minor, and Mauritania, and the whole of those countries which go under the name of the Indies, all the antique relics which our idolaters imagine that they possess here are there exhibited with the greatest confidence. How are we to decide between these two parties? Our people say that the relics were brought away from those places. The Christians who are living there affirm that they still possess them, and deride our foolish boasting. How can the dispute be decided without investigation—investigation, however, which cannot, and never will, be made? The only remedy is to despise both, and leave the matter as it is, in statu quo. The last class of relics belonging to Christ are those which relate to events subsequent to his resurrection; e. g. the piece of broiled fish which Peter offered to him when he appeared on the sea-shore. It must have been wondrously well salted if it has kept for such a long series of ages! But, jesting apart, is it supposable that the apostles made relics of what they had actually prepared for dinner? Whoever does not perceive that the whole matter is an open mockery of God, I must leave as unworthy of being farther addressed on the subject. Then we have the miraculous blood which has flowed from many of the hosts at mass; as at Paris, in the church of John Arenarius, and also in that of John the Angel; as also at Dijon, and many other places. And, in order to enlarge the heap, they have added the impious knife with which the host was stabbed at Paris by a certain Jew. This knife the Parisians regard with greater veneration than the host itself. When Doctor à Quercus, who held the cure of St John Arenarius, found that the donations made to this host stood in his way, (his gains being diminished in proportion to what the knife received,) he indignantly exclaimed, that they were worse than the Jews, inasmuch as they were worshipping a knife which had been the instrument of violating the sacred body of Christ. I have adduced this instance, because the exclamation would equally apply to the spear, the nails, and the crown of thorns; all who adore them being, in the opinion of Master à Quercus, more impious than the Jews by whom Christ was crucified. In like manner are shown the prints of his feet in a place where he is said to have appeared to several individuals after his ascension, as at Rome, in the church of St Lawrence, at the spot where he is said to have appeared to Peter, and foretold him that he was to suffer at Rome. Another of these foot-marks is to be seen at Poictiers, in the church of Arabegend, another at Soissons, and another at Arles. I deny not that Christ could have left the mark of his foot upon a stone. I only deny the allegation of his having actually done so. In the absence of all proper proof, I maintain that the whole ought to be regarded as a mere fable. But the most admirable specimen of this description of relics is the impression of his hips, which is seen at Rheims, on a stone behind the altar, and is said to have been left at the time when our Saviour turned mason, in order that he might build the vestibule of that church. The blasphemy is so execrable, that I am almost ashamed to mention it. To proceed, let us now attend to what is said of images, I mean not those which are usually made by painters, sculptors, and artists—(the number of these is infinite;)—but of those which possess some special claim to respect, and are regarded as singular and precious, as being of the nature of relics. Of these there are two kinds; for some have been miraculously formed, as that which is shown at Rome, in the portico of the church of St Mary. There is another also in the church of Joannes Lateranensis; and another, in which there is a picture of our Lord, said to have been taken at the time when he was twelve years old. There is also another at Lucca, which they say was painted by angels, and is called “The Holy Countenance.” These follies are so absurd, that I would lose my pains, and feel I was absurdly wasting my time, were I to dwell upon them. It is sufficient, therefore, merely to have noticed them in passing; for everybody knows that painting is not at all an office which belongs to angels, and that the means by which our Lord wished to make himself known, and imprinted on our memory, was very different from lifeless images. Eusebius relates, in his Ecclesiastical History, that our Saviour sent his picture, painted to the life, to King Abgarus; and this is somewhat more certain than a fiction taken from the Chronicles of Milan. But though the fact were so, how came they to obtain it from King Abgarus? It is said to be at Rome; but Eusebius says not that it was in existence up to his day. He only speaks by hearsay, as of a thing which had occurred long before. Is it to be believed, that it was brought to light six or seven hundred years after; and, quitting Persia, travelled as far as Rome? Pictures of the cross have been fabricated in the same way as those of our Saviour’s person. It is given out at Brescia, that they have the very cross that appeared to Constantine. I will not dispute the matter with them; I only send them to the Cortonians, who firmly maintain that they possess it. Let them litigate the matter between themselves, and then let the one who gains his plea come forward, and we will give him his answer. Indeed, it is not difficult to find an answer that will convict them all of folly. For when some writers say that a cross appeared to Constantine, they mean not a material cross, but the figure of a cross which was exhibited to him by a visible representation in the sky. Therefore, although the fact were true, it is clear that they have fallen into a very stupid blunder, and reared up their imposture without giving it the shadow of a foundation. But there is a second species of images which are regarded as relics, in consequence of certain services which they have performed. To this class of images belong crucifixes, on which the beard grows; for instance, one at Burgos in Spain, another in the church of St Salvator, and another in that of Aurengia. Were I to dwell upon this for the purpose of demonstrating what folly, or rather brutish stupidity, it is to believe such a thing, I should make myself ridiculous. The whole matter is so absurd in itself, that it cannot be at all necessary to spend time in refuting it, and yet the wretched populace are so dull, that the great majority of them think it just as certain as the gospel. With these, also, I class those crucifixes which have spoken, and of which there is a great multitude. But let us content ourselves with one, by way of example, viz., the one which is at St Denis in France. It spoke, they say, when it testified that the Church was dedicated. Leaving others to consider how far the importance of the matter called for such utterance, I only ask how an image of the cross could have been in the Church at that time, when, according to the custom used at dedications, all the images are removed from the Church? How did it manage to steal away and conceal itself, so as not to be removed with the rest? We see how easy a matter they must suppose it is to deceive the world, since they care not how much they contradict themselves, but deem it enough to belch forth their lies with open mouth, giving themselves no concern about any objections that might be urged. Lastly, we have got tears also; one, for instance, at Vindon, another at Treves, in the church of St Maximin, another at Orleans, in the church of Peter Puellare, besides many which are unknown to me. Some of these are said to be natural tears, as the one at St Maximin; for, according to their chronicle, our Lord let it fall when he was washing the disciples’ feet. Others are miraculous, as if it were to be believed that crucifixes of wood had so much feeling in them that they could shed tears. But we must pardon them this fault; they were ashamed to think that their images could do less than had been done by those of the heathen. The heathen pretended that their idols occasionally wept, and these crucifixes, therefore, must receive the same right, and be put on an equal footing!”

— John Calvin, An Admonition Showing the Advantages Which Christendom Might Derive From an Inventory of Relics, Vol. 1 | Edinburgh: Calvin Translation Society, 1844, pp. 312–16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+to+convince+all+men+how+little+credit+is+due+to+the+proofs+which+they+adduce+in+support+of+their+relics%2C+it+is+to+be+observed%2C+that+the+chief+and+most+authentic+of+those+which+are+seen+at+Rome+are+said+to+have+been+brought+thither+by+Titus+and+Vespasian.+This+fiction+is+hot+a+whit+more+ingenious+than+if+it+were+said+that+the+Grand+Turk+went+to+Jerusalem+in+order+that+he+might+bring+the+cross+of+Christ+to+Constantinople.+Vespasian%2C+before+he+became+Emperor%2C+subdued+and+laid+waste+a+part+of+Judea.+Afterwards%2C+when+he+had+obtained+the+empire%2C+his+son+Titus%2C+whom+he+had+left+in+command%2C+took+Jerusalem.+Now%2C+both+of+them+were+heathens%2C+and+cared+no+more+for+Christ+than+if+he+had+never+been+born.+In+the+same+way%2C+we+may+judge+whether%2C+in+alleging+that+Godfrey+of+Boulogne%2C+or+King+Louis%2C+brought+these+relics%2C+they+have+not+lied+with+equal+effrontery+as+when+they+said+it+was+Vespasian.+Besides%2C+let+it+be+considered+what+kind+of+judgment+was+displayed+by+that+king+to+whom+they+give+the+name+of+St+Louis%2C+and+by+others+like+him.+They+had%2C+no+doubt%2C+a+semblance+of+religion%2C+and+a+zeal%2C+such+as+it+was%2C+for+the+propagation+of+the+Christian+name.+But+if+the+droppings+of+goats+had+been+shown+them%2C+and+they+been+told+at+the+same+time+that+they+were+the+Virgin+Mary%E2%80%99s+beads%2C+they+would+have+worshipped+them+at+once%2C+without+ever+debating+the+matter%2C+and+would+have+sent+ships+to+transport+them+to+any+place+where+they+were+to+be+set+up+and+honoured.+It+cannot+be+denied+they+wasted+both+their+resources+and+their+bodily+strength%2C+and+also+spent+a+goodly+part+of+their+revenues+in+bringing+back+a+heap+of+indescribable+trifles+and+toys%2C+by+which+the+minds+of+men+were+so+fascinated+as+to+regard+them+as+most+valuable+jewels.+To+give+a+clearer+illustration+of+the+fact%2C+I+may+observe%2C+that+throughout+the+whole+of+Greece%2C+Asia+Minor%2C+and+Mauritania%2C+and+the+whole+of+those+countries+which+go+under+the+name+of+the+Indies%2C+all+the+antique+relics+which+our+idolaters+imagine+that+they+possess+here+are+there+exhibited+with+the+greatest+confidence.+How+are+we+to+decide+between+these+two+parties%3F+Our+people+say+that+the+relics+were+brought+away+from+those+places.+The+Christians+who+are+living+there+affirm+that+they+still+possess+them%2C+and+deride+our+foolish+boasting.+How+can+the+dispute+be+decided+without+investigation%E2%80%94investigation%2C+however%2C+which+cannot%2C+and+never+will%2C+be+made%3F+The+only+remedy+is+to+despise+both%2C+and+leave+the+matter+as+it+is%2C+in+statu+quo.+The+last+class+of+relics+belonging+to+Christ+are+those+which+relate+to+events+subsequent+to+his+resurrection%3B+e.+g.+the+piece+of+broiled+fish+which+Peter+offered+to+him+when+he+appeared+on+the+sea-shore.+It+must+have+been+wondrously+well+salted+if+it+has+kept+for+such+a+long+series+of+ages%21+But%2C+jesting+apart%2C+is+it+supposable+that+the+apostles+made+relics+of+what+they+had+actually+prepared+for+dinner%3F+Whoever+does+not+perceive+that+the+whole+matter+is+an+open+mockery+of+God%2C+I+must+leave+as+unworthy+of+being+farther+addressed+on+the+subject.+Then+we+have+the+miraculous+blood+which+has+flowed+from+many+of+the+hosts+at+mass%3B+as+at+Paris%2C+in+the+church+of+John+Arenarius%2C+and+also+in+that+of+John+the+Angel%3B+as+also+at+Dijon%2C+and+many+other+places.+And%2C+in+order+to+enlarge+the+heap%2C+they+have+added+the+impious+knife+with+which+the+host+was+stabbed+at+Paris+by+a+certain+Jew.+This+knife+the+Parisians+regard+with+greater+veneration+than+the+host+itself.+When+Doctor+%C3%A0+Quercus%2C+who+held+the+cure+of+St+John+Arenarius%2C+found+that+the+donations+made+to+this+host+stood+in+his+way%2C+%28his+gains+being+diminished+in+proportion+to+what+the+knife+received%2C%29+he+indignantly+exclaimed%2C+that+they+were+worse+than+the+Jews%2C+inasmuch+as+they+were+worshipping+a+knife+which+had+been+the+instrument+of+violating+the+sacred+body+of+Christ.+I+have+adduced+this+instance%2C+because+the+exclamation+would+equally+apply+to+the+spear%2C+the+nails%2C+and+the+crown+of+thorns%3B+all+who+adore+them+being%2C+in+the+opinion+of+Master+%C3%A0+Quercus%2C+more+impious+than+the+Jews+by+whom+Christ+was+crucified.+In+like+manner+are+shown+the+prints+of+his+feet+in+a+place+where+he+is+said+to+have+appeared+to+several+individuals+after+his+ascension%2C+as+at+Rome%2C+in+the+church+of+St+Lawrence%2C+at+the+spot+where+he+is+said+to+have+appeared+to+Peter%2C+and+foretold+him+that+he+was+to+suffer+at+Rome.+Another+of+these+foot-marks+is+to+be+seen+at+Poictiers%2C+in+the+church+of+Arabegend%2C+another+at+Soissons%2C+and+another+at+Arles.+I+deny+not+that+Christ+could+have+left+the+mark+of+his+foot+upon+a+stone.+I+only+deny+the+allegation+of+his+having+actually+done+so.+In+the+absence+of+all+proper+proof%2C+I+maintain+that+the+whole+ought+to+be+regarded+as+a+mere+fable.+But+the+most+admirable+specimen+of+this+description+of+relics+is+the+impression+of+his+hips%2C+which+is+seen+at+Rheims%2C+on+a+stone+behind+the+altar%2C+and+is+said+to+have+been+left+at+the+time+when+our+Saviour+turned+mason%2C+in+order+that+he+might+build+the+vestibule+of+that+church.+The+blasphemy+is+so+execrable%2C+that+I+am+almost+ashamed+to+mention+it.+To+proceed%2C+let+us+now+attend+to+what+is+said+of+images%2C+I+mean+not+those+which+are+usually+made+by+painters%2C+sculptors%2C+and+artists%E2%80%94%28the+number+of+these+is+infinite%3B%29%E2%80%94but+of+those+which+possess+some+special+claim+to+respect%2C+and+are+regarded+as+singular+and+precious%2C+as+being+of+the+nature+of+relics.+Of+these+there+are+two+kinds%3B+for+some+have+been+miraculously+formed%2C+as+that+which+is+shown+at+Rome%2C+in+the+portico+of+the+church+of+St+Mary.+There+is+another+also+in+the+church+of+Joannes+Lateranensis%3B+and+another%2C+in+which+there+is+a+picture+of+our+Lord%2C+said+to+have+been+taken+at+the+time+when+he+was+twelve+years+old.+There+is+also+another+at+Lucca%2C+which+they+say+was+painted+by+angels%2C+and+is+called+%E2%80%9CThe+Holy+Countenance.%E2%80%9D+These+follies+are+so+absurd%2C+that+I+would+lose+my+pains%2C+and+feel+I+was+absurdly+wasting+my+time%2C+were+I+to+dwell+upon+them.+It+is+sufficient%2C+therefore%2C+merely+to+have+noticed+them+in+passing%3B+for+everybody+knows+that+painting+is+not+at+all+an+office+which+belongs+to+angels%2C+and+that+the+means+by+which+our+Lord+wished+to+make+himself+known%2C+and+imprinted+on+our+memory%2C+was+very+different+from+lifeless+images.+Eusebius+relates%2C+in+his+Ecclesiastical+History%2C+that+our+Saviour+sent+his+picture%2C+painted+to+the+life%2C+to+King+Abgarus%3B+and+this+is+somewhat+more+certain+than+a+fiction+taken+from+the+Chronicles+of+Milan.+But+though+the+fact+were+so%2C+how+came+they+to+obtain+it+from+King+Abgarus%3F+It+is+said+to+be+at+Rome%3B+but+Eusebius+says+not+that+it+was+in+existence+up+to+his+day.+He+only+speaks+by+hearsay%2C+as+of+a+thing+which+had+occurred+long+before.+Is+it+to+be+believed%2C+that+it+was+brought+to+light+six+or+seven+hundred+years+after%3B+and%2C+quitting+Persia%2C+travelled+as+far+as+Rome%3F+Pictures+of+the+cross+have+been+fabricated+in+the+same+way+as+those+of+our+Saviour%E2%80%99s+person.+It+is+given+out+at+Brescia%2C+that+they+have+the+very+cross+that+appeared+to+Constantine.+I+will+not+dispute+the+matter+with+them%3B+I+only+send+them+to+the+Cortonians%2C+who+firmly+maintain+that+they+possess+it.+Let+them+litigate+the+matter+between+themselves%2C+and+then+let+the+one+who+gains+his+plea+come+forward%2C+and+we+will+give+him+his+answer.+Indeed%2C+it+is+not+difficult+to+find+an+answer+that+will+convict+them+all+of+folly.+For+when+some+writers+say+that+a+cross+appeared+to+Constantine%2C+they+mean+not+a+material+cross%2C+but+the+figure+of+a+cross+which+was+exhibited+to+him+by+a+visible+representation+in+the+sky.+Therefore%2C+although+the+fact+were+true%2C+it+is+clear+that+they+have+fallen+into+a+very+stupid+blunder%2C+and+reared+up+their+imposture+without+giving+it+the+shadow+of+a+foundation.+But+there+is+a+second+species+of+images+which+are+regarded+as+relics%2C+in+consequence+of+certain+services+which+they+have+performed.+To+this+class+of+images+belong+crucifixes%2C+on+which+the+beard+grows%3B+for+instance%2C+one+at+Burgos+in+Spain%2C+another+in+the+church+of+St+Salvator%2C+and+another+in+that+of+Aurengia.+Were+I+to+dwell+upon+this+for+the+purpose+of+demonstrating+what+folly%2C+or+rather+brutish+stupidity%2C+it+is+to+believe+such+a+thing%2C+I+should+make+myself+ridiculous.+The+whole+matter+is+so+absurd+in+itself%2C+that+it+cannot+be+at+all+necessary+to+spend+time+in+refuting+it%2C+and+yet+the+wretched+populace+are+so+dull%2C+that+the+great+majority+of+them+think+it+just+as+certain+as+the+gospel.+With+these%2C+also%2C+I+class+those+crucifixes+which+have+spoken%2C+and+of+which+there+is+a+great+multitude.+But+let+us+content+ourselves+with+one%2C+by+way+of+example%2C+viz.%2C+the+one+which+is+at+St+Denis+in+France.+It+spoke%2C+they+say%2C+when+it+testified+that+the+Church+was+dedicated.+Leaving+others+to+consider+how+far+the+importance+of+the+matter+called+for+such+utterance%2C+I+only+ask+how+an+image+of+the+cross+could+have+been+in+the+Church+at+that+time%2C+when%2C+according+to+the+custom+used+at+dedications%2C+all+the+images+are+removed+from+the+Church%3F+How+did+it+manage+to+steal+away+and+conceal+itself%2C+so+as+not+to+be+removed+with+the+rest%3F+We+see+how+easy+a+matter+they+must+suppose+it+is+to+deceive+the+world%2C+since+they+care+not+how+much+they+contradict+themselves%2C+but+deem+it+enough+to+belch+forth+their+lies+with+open+mouth%2C+giving+themselves+no+concern+about+any+objections+that+might+be+urged.+Lastly%2C+we+have+got+tears+also%3B+one%2C+for+instance%2C+at+Vindon%2C+another+at+Treves%2C+in+the+church+of+St+Maximin%2C+another+at+Orleans%2C+in+the+church+of+Peter+Puellare%2C+besides+many+which+are+unknown+to+me.+Some+of+these+are+said+to+be+natural+tears%2C+as+the+one+at+St+Maximin%3B+for%2C+according+to+their+chronicle%2C+our+Lord+let+it+fall+when+he+was+washing+the+disciples%E2%80%99+feet.+Others+are+miraculous%2C+as+if+it+were+to+be+believed+that+crucifixes+of+wood+had+so+much+feeling+in+them+that+they+could+shed+tears.+But+we+must+pardon+them+this+fault%3B+they+were+ashamed+to+think+that+their+images+could+do+less+than+had+been+done+by+those+of+the+heathen.+The+heathen+pretended+that+their+idols+occasionally+wept%2C+and+these+crucifixes%2C+therefore%2C+must+receive+the+same+right%2C+and+be+put+on+an+equal+footing%21%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%9CAn+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%E2%80%9D+in+Tracts+Relating+to+the+Reformation%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+312%E2%80%9316&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F611521ed8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/611521ed8f.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-8/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>That infant baptism is the practice of all branches of the Christian church, with one solitary exception, is a well-known fact. That it has been the practice of the church of God for eighteen centuries is also beyond dispute. When one sect, therefore, ventures to differ in opinion from all other Christian churches, it should have very strong reasons to support it. But I was considering the objections which the Anabaptists advance against the administration of the ornaments, and then let all men judge whether they are sound and conclusive. 1. The first of these objections is founded on the baptism of Christ (Matt. 3:13–17). The fact that Christ was not baptized in childhood, but only when he entered on his ministry, some thirty years afterwards, is considered by many of the more ignorant class a strong proof against infant baptism. This will be short. At the time of Christ’s birth, the ordinance of baptism did not exist in the church of God. Circumcision was then the initiatory right, and Christ was circumcised (Luke 2:21). Thirty years afterwards, John was sent to baptize, and so soon as the opportunity presented itself, Christ submitted to the rite. But although His own disciples baptized during the Savior’s lifetime (John 4:1–2), yet it was not until the Lord had risen from the dead that Christian baptism was instituted (Matt. 28:19). The mere fact, therefore, that the Lord Jesus did not receive, infancy, an ordinance that did not exist until after his death and resurrection, is no argument against infant baptism. One might as well argue against the circumcision of infants, on the ground that Abraham was not circumcised until he was 100 years of age. 2. Again, it is said that an infant cannot understand baptism, and eloquent pictures are sometimes drawn of the wrong inflicted on the poor unconscious babe which receives an ordinance of which it knows nothing, and is made party to a solemn transaction without any consent of its own. It is admitted, readily, that a child at baptism does not understand the nature of the ordinance of which it is the subject, but that is no reason why it should not drive benefit thereby. He does not know the texture of the clothes that cover it, and yet these clothes keep it warm. It does not understand the nature of its mother’s milk, and yet that milk sustains its life. The children that were brought to Jesus that he might touch them (Mark 10:13–16) did not understand the ceremony that was gone through on that occasion, and yet we cannot but believe that Christ did them good. An Anabaptist might have rebuked those mothers, and said to them, “take your children home, what is the good of it? What can they know about Christ blessing?” But Jesus would have shown him, what he did show the ignorant disciples, that with such conduct “he was indignant.” A divine purpose may be served, and good, by the administration of baptism to a child, while, at the same time, the child does not understand the ordinance. If our Anabaptist friends had seen a Jew, with a knife in hand, ready to perform on an infant of eight days old the right of circumcision, they would have attempted to dissuade him from his bloody work in some such way as this: “How can this poor babe know anything of a covenant made so many years ago? Why administer to it an ordinance that it does not understand? Why make it a party to such a solemn transaction without any consent of its own?” The Jew could scarcely hide his contempt for one so ignorant of the law and the prophets, as he would reply: “Beautiful reasoning, indeed, Gentile unbeliever! But with me it does not weigh one feather against the appointment of God.” Now we say the same. The baptized infant may be ignorant of the ordinance, but that does not, with us, weigh one feather against the appointment of God. Alexander Carson, an Anabaptist writer, says, “I would baptize Satan himself, without the smallest scruple, had I a divine warrant.” Possessing, as we do, a divine warrant for baptizing the children of believers, we hesitate still less to administer the ordinance to an unconscious babe.</p></blockquote>

<blockquote><p>11. What is the view of this subject entertained by the French Protestant theologians, Camero, Amyraut, and others? These theological professors at Saumur, during the second quarter of the seventeenth century, taught that God, 1st. Decreed to create man. 2d. To permit man to fall. 3d.To provide, in the mediation of Christ, salvation for all men. 4th. But, foreseeing that if men were left to themselves none would repent and believe, therefore he sovereignly elected some to whom he decreed to give the necessary graces of repentance and faith. The new school theology of America, as far as it relates to the decrees of God, is only a revival of this system. It differs from the Calvinistic view in making the decree of redemption precede the decree of election. It differs from the Arminian view in regarding the sovereign good pleasure of God, and not foreseen faith, the ground of election. The objection to this view is, that it is an essential element in that radically false view of the atonement called the governmental theory.—See Chapter XXII., questions 6, 7.</p></blockquote>

<blockquote><p>But what ought to be clearly observed is that Covenant of Works or Covenant of Life did not offer “salvation.” The word “salvation” implies something from which one is saved. Adam was not lost when that Covenant of Life was given him. On the contrary he had knowledge, righteousness and holiness. The Covenant of Works was not given as a way by which a sinner might get rid of his sin and merit eternal life. Neither was the Mosaic Law given for any such purpose. It was not given to present, even hypothetically, a way by which a sinner, already eternally under the condemnation of sin, could by future perfect obedience merit the favor of God. And Dr. Charles Hodge surely does not regard it as given for any such purpose. The root error, or one of the many root errors of the Dispensationalism of the Scofield Bible seems to me to be the utter failure to recognize and make central the fact of the Fall of man. I know that there are salutary inconsistencies in the Scofield Bible. I know that in the notes on the fifth chapter of Romans there is taught, not indeed the orthodox doctrine of imputation, but still some recognition of the universal corruption that has come from Adam’s sin. But by what a back-door even that much of the central Biblical teaching is brought in! As one reads Dr. Scofield’s notes one does not for the most part get the slightest inkling of the fact that anything irrevocable took place when Adam fell. After his Fall man continued to be tested in successive dispensations. See for example the definition of a dispensation which Dr. Scofield gives at the beginning. That is one of the things that seems to me to be so profoundly heretical in this commentary. It is contrary to the very heart of the Augustinian and Calvinistic view of sin. According to that view — and surely according to the Bible — the guilt of Adam’s first sin was imputed to his posterity. Adam being by divine appointment the representative or federal head of the race. Thus all descended from Adam by ordinary generation are guilty. They are guilty before they individually have done anything either good or bad. They are under the penalty of sin when they are born. Part of that penalty of sin is hopeless corruption, from which, if there is growth to years of discretion, individual transgressions spring. How utterly absurd would it have been therefore for God to offer the Mosaic Law, to such an already condemned and fallen race, as something which, if only obeyed by that already condemned and fallen race, would bring salvation and eternal life! Thus Dr. Scofield’s view of the Mosaic Law is rooted in a wrong view of sin — a wrong view which is against the very heart and core of the Reformed Faith.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But what ought to be clearly observed is that Covenant of Works or Covenant of Life did not offer “salvation.” The word “salvation” implies something from which one is saved. Adam was not lost when that Covenant of Life was given him. On the contrary he had knowledge, righteousness and holiness. The Covenant of Works was not given as a way by which a sinner might get rid of his sin and merit eternal life. Neither was the Mosaic Law given for any such purpose. It was not given to present, even hypothetically, a way by which a sinner, already eternally under the condemnation of sin, could by future perfect obedience merit the favor of God. And Dr. Charles Hodge surely does not regard it as given for any such purpose. The root error, or one of the many root errors of the Dispensationalism of the Scofield Bible seems to me to be the utter failure to recognize and make central the fact of the Fall of man. I know that there are salutary inconsistencies in the Scofield Bible. I know that in the notes on the fifth chapter of Romans there is taught, not indeed the orthodox doctrine of imputation, but still some recognition of the universal corruption that has come from Adam’s sin. But by what a back-door even that much of the central Biblical teaching is brought in! As one reads Dr. Scofield’s notes one does not for the most part get the slightest inkling of the fact that anything irrevocable took place when Adam fell. After his Fall man continued to be tested in successive dispensations. See for example the definition of a dispensation which Dr. Scofield gives at the beginning. That is one of the things that seems to me to be so profoundly heretical in this commentary. It is contrary to the very heart of the Augustinian and Calvinistic view of sin. According to that view — and surely according to the Bible — the guilt of Adam’s first sin was imputed to his posterity. Adam being by divine appointment the representative or federal head of the race. Thus all descended from Adam by ordinary generation are guilty. They are guilty before they individually have done anything either good or bad. They are under the penalty of sin when they are born. Part of that penalty of sin is hopeless corruption, from which, if there is growth to years of discretion, individual transgressions spring. How utterly absurd would it have been therefore for God to offer the Mosaic Law, to such an already condemned and fallen race, as something which, if only obeyed by that already condemned and fallen race, would bring salvation and eternal life! Thus Dr. Scofield’s view of the Mosaic Law is rooted in a wrong view of sin — a wrong view which is against the very heart and core of the Reformed Faith.”

<blockquote><p>[The Socinian Biddle asks] Q. Doth the Scripture account Christ to be the Son of God because he was eternally begotten out of the divine essence, or for other reasons agreeing to him only as a man? Rehearse the passages to this purpose. A. Luke 1:30, 32, 34, 35; John. 10:36; Acts 13:32, 33; Rev. 1:5; Col. 1:18; Heb. 1:4, 5, 5:5; Rom. 8:29. [Owen Replies]… 1. Distinction of persons (it being an infinite substance) doth no way prove difference of essence between the Father and the Son. Where Christ, as mediator, is said to be another from the Father or God, spoken personally of the Father, it argues not in the least that he is not partaker of the same nature with him. That in one essence there can be but one person may be true where the substance is finite and limited, but hath no place in that which is infinite. … 2. Distinction and inequality in respect office in Christ doth not in the least take away equality and sameness with the Father in respect of nature and essence. A son of the same nature with his father, and therein equal to him, may in office be his inferior, his subject. … Q. 9. We are come to the head of this discourse, and of Mr B.’s design in this chapter, and, indeed, of the greatest design that he drives in religion, namely, the denial of the eternal deity of the Son of God; which not only in this place directly, but in sundry others covertly, he doth invade and oppose. His question is, “Doth the Scripture account Christ to be the Son of God because he was eternally begotten out of the divine essence, or for other reasons agreeing to him only as a man? Rehearse the passages to this purpose.” His answer is from Luke 1:31–35; John 10:36; Acts 13:32, 33; Rev. 1:5; Col. 1:18; Heb 1:4, 5, 5:5; Rom. 8:29; most of which places are expressly contrary to him in his design, as the progress of our discourse will discover. This, I say, being the head of the difference between us in this chapter, after I have rectified one mistake in Mr B.’s question, I shall state the whole matter so as to obviate farther labour and trouble about sundry other ensuing queries. For Mr B.’s question, then, we say not that the Son is begotten eternally out of the divine essence, but in it, not by an eternal act of the Divine Being, but of the person of the Father; which being premised, I shall proceed. [Owen quotes Socinians denying the eternal generation of the Son] … I insist somewhat the more on these things, that men may judge the better whether in all probability Mr B., in his “impartial search into the Scripture,” did not use the help of some of them that went before him in the discovery of the same things which he boasts himself to have found out. And this is the first reason which our catechist hath taken from his masters to communicate to his scholars [students] why Jesus Christ is called the “Son of God.” This he and they insist on exclusively to his eternal sonship, or being the Son of God in respect of his eternal generation of the substance of his Father. And these are some of those monstrous figments which, under pretence of bare adherence to the Scripture, our catechist would obtrude upon us: First, Christ is the Son of God; then, growing like God in divine qualities, he is made a God; and so becomes the Son of God. And this, if the man may be believed, is the pure doctrine of the Scripture! And if Christ be a God because he is like God, by the same reason we are all gods in Mr B[iddle]’s conceit, being all made in the image and likeness of God; which, says he, by sin we have not lost. … 1. He who is ἴδιος υἱός, the “proper son” of any, is begotten of the substance of his father. Christ is the proper Son of God, and God he called often ἴδιον Πατέρα, his “proper Father.” He is properly a father who begets another of his substance; and he is properly a son who is so begotten. … he who is properly a son is distinguished from him who is metaphorically so only; for any thing whatever is metaphorically said to be what it is said to be by a translation and likeness to that which is true. Now, if Christ be not begotten of the essence of his Father, he is only a metaphorical Son of God by way of allusion, and cannot be called the proper Son of God, being only one who hath but a similitude to a proper Son; so that it is a plain contradiction that Christ should be the proper Son of God, and yet not be begotten of his Father’s essence. … 4. He who is the Son of God, begotten of his Father by an eternal communication of his divine essence, he is the Son begotten of the essence of the Father; for these terms are the same, and of the same importance. … And this may suffice (without insisting upon what more might be added) for the demonstration of the first assertion, That Christ’s filiation ariseth from his eternal generation, or he is the Son of God upon the account of his being begotten of the essence of his Father from eternity. … 4. That which only manifests the filiation of Christ is not the cause of it. The cause of a thing is that which gives it its being. The manifestation of it is only that which declares it to be so. … To the farther confirmation of this assertion two things are to be annexed:—First, The eversion of that fancy of Episcopius before mentioned, and the rest of the Socinianizing Arminians, that Christ is called the “Son of God,” both on the account of his eternal sonship and also of those other particulars mentioned from him above. Secondly, To consider the texts of Scripture produced by Mr [Biddle] for the confirmation of his insinuation, that Christ is not called the “Son of God” because of his eternal generation of the essence of his Father. … 3. An invincible argument for the sonship of Christ, to be placed only upon the account of his eternal generation, ariseth from this very place that was produced to oppose it! He who is the Son of God because he is “one with the Father,” and God equal to him, is the Son of God upon the account of his eternal relation to the Father: but that such was the condition of Jesus Christ, himself here bears witness to the Jews, although they are ready to stone him for it; and of his not blaspheming in this assertion he convinces his adversaries by an argument a minori, [from the lesser or the minor premise; John 10] verses 34–36.</p></blockquote>

%E2%80%99s+conceit%2C+being+all+made+in+the+image+and+likeness+of+God%3B+which%2C+says+he%2C+by+sin+we+have+not+lost.+%E2%80%A6+1.+He+who+is+%E1%BC%B4%CE%B4%CE%B9%CE%BF%CF%82+%CF%85%E1%BC%B1%CF%8C%CF%82%2C+the+%E2%80%9Cproper+son%E2%80%9D+of+any%2C+is+begotten+of+the+substance+of+his+father.+Christ+is+the+proper+Son+of+God%2C+and+God+he+called+often+%E1%BC%B4%CE%B4%CE%B9%CE%BF%CE%BD+%CE%A0%CE%B1%CF%84%CE%AD%CF%81%CE%B1%2C+his+%E2%80%9Cproper+Father.%E2%80%9D+He+is+properly+a+father+who+begets+another+of+his+substance%3B+and+he+is+properly+a+son+who+is+so+begotten.+%E2%80%A6+he+who+is+properly+a+son+is+distinguished+from+him+who+is+metaphorically+so+only%3B+for+any+thing+whatever+is+metaphorically+said+to+be+what+it+is+said+to+be+by+a+translation+and+likeness+to+that+which+is+true.+Now%2C+if+Christ+be+not+begotten+of+the+essence+of+his+Father%2C+he+is+only+a+metaphorical+Son+of+God+by+way+of+allusion%2C+and+cannot+be+called+the+proper+Son+of+God%2C+being+only+one+who+hath+but+a+similitude+to+a+proper+Son%3B+so+that+it+is+a+plain+contradiction+that+Christ+should+be+the+proper+Son+of+God%2C+and+yet+not+be+begotten+of+his+Father%E2%80%99s+essence.+%E2%80%A6+4.+He+who+is+the+Son+of+God%2C+begotten+of+his+Father+by+an+eternal+communication+of+his+divine+essence%2C+he+is+the+Son+begotten+of+the+essence+of+the+Father%3B+for+these+terms+are+the+same%2C+and+of+the+same+importance.+%E2%80%A6+And+this+may+suffice+%28without+insisting+upon+what+more+might+be+added%29+for+the+demonstration+of+the+first+assertion%2C+That+Christ%E2%80%99s+filiation+ariseth+from+his+eternal+generation%2C+or+he+is+the+Son+of+God+upon+the+account+of+his+being+begotten+of+the+essence+of+his+Father+from+eternity.+%E2%80%A6+4.+That+which+only+manifests+the+filiation+of+Christ+is+not+the+cause+of+it.+The+cause+of+a+thing+is+that+which+gives+it+its+being.+The+manifestation+of+it+is+only+that+which+declares+it+to+be+so.+%E2%80%A6+To+the+farther+confirmation+of+this+assertion+two+things+are+to+be+annexed%3A%E2%80%94First%2C+The+eversion+of+that+fancy+of+Episcopius+before+mentioned%2C+and+the+rest+of+the+Socinianizing+Arminians%2C+that+Christ+is+called+the+%E2%80%9CSon+of+God%2C%E2%80%9D+both+on+the+account+of+his+eternal+sonship+and+also+of+those+other+particulars+mentioned+from+him+above.+Secondly%2C+To+consider+the+texts+of+Scripture+produced+by+Mr+%5BBiddle%5D+for+the+confirmation+of+his+insinuation%2C+that+Christ+is+not+called+the+%E2%80%9CSon+of+God%E2%80%9D+because+of+his+eternal+generation+of+the+essence+of+his+Father.+%E2%80%A6+3.+An+invincible+argument+for+the+sonship+of+Christ%2C+to+be+placed+only+upon+the+account+of+his+eternal+generation%2C+ariseth+from+this+very+place+that+was+produced+to+oppose+it%21+He+who+is+the+Son+of+God+because+he+is+%E2%80%9Cone+with+the+Father%2C%E2%80%9D+and+God+equal+to+him%2C+is+the+Son+of+God+upon+the+account+of+his+eternal+relation+to+the+Father%3A+but+that+such+was+the+condition+of+Jesus+Christ%2C+himself+here+bears+witness+to+the+Jews%2C+although+they+are+ready+to+stone+him+for+it%3B+and+of+his+not+blaspheming+in+this+assertion+he+convinces+his+adversaries+by+an+argument+a+minori%2C+%5Bfrom+the+lesser+or+the+minor+premise%3B+John+10%5D+verses+34%E2%80%9336.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+21+vol.+ed.+William+H.+Goold+%28Edinburgh%3A+T.+and+T.+Clark%2C+1862%29%2C+12.169%2C+170%2C+171%2C+177%2C+181%2C+182%2C+185%2C+189%2C+190%2C+193%2C+194%2C+198&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F907cf60c39.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/907cf60c39.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/10/john-owen-defended-eternal-generation-against-the-socinians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>XI. Mary is rightly called the Mother of God (theotokos) in the concrete and specifically because she brought forth him who is also God, but not in the abstract and reduplicatively as God. Although this is not expressly stated in the Scriptures, still it is sufficiently intimated when she is called the mother of the Lord (Lk. 1:43) and the mother of Immanuel. If the blessed virgin brought nothing to the person of the Logos (Logou) absolutely considered, still she can be said to have brought something to the person of the incarnate Logos (Logou) economically considered, inasmuch as she gave the human nature which he took into the unity of person. XII. The title Mother of God given to the virgin was perverted by superstitious men into an occasion of idolatry, as Paul Sarpi observes. “Because the impiety of Nestorius divided Christ, constituting two sons and denying that he, who was born of the virgin Mary, is God; the church, in order to implant the catholic truth in the minds of believers, decided that the words, Mary, the Mother of God (Maria theotokos), should be more frequently inculcated in the churches of the East as well as of the West. This, instituted indeed solely for the honor of Christ, by degrees began to be shared with the mother and at length was referred entirely to her alone” (History of the Council of Trent 2 [1620], p. 181). Although, I say, this most gross error either arose from or was increased by this occasion, it derogates nothing from the truth because the abuse and error of the papists ought not to take away the lawful use of this name.</p></blockquote>

<blockquote><p>The controversy was renewed not long after in another form, in consequence of the position taken by George Major, also a pupil of Luther and Melancthon, and for some years professor of theology and preacher at Wittenberg. He was accused of objecting to the proposition “we are saved by faith alone” and of teaching that good works were also necessary to salvation. This was understood as tantamount to saying that good works are necessary to justification. Major, indeed, denied the justice of this charge. He said he did not teach that good works were necessary as being meritorious, but simply as the necessary fruits of faith and part of our obedience to Christ; nevertheless, he maintained that no one could be saved without good works. How then can infants be saved? And how can this unconditional necessity of good works be consistent with Paul’s doctrine that we are justified by faith without works? Whom God justifies He glorifies. Justification secures salvation; and, therefore, if faith alone, or faith without works, secures justification, it secures salvation. It is very evident that this was a dispute about words. Major admitted that the sinner was in a state of salvation the moment he believed, but held that if his faith did not produce good works it was not a saving faith. In his sermon “On the Conversion of Paul,” he said: “As thou art now justified by faith alone, and hast become a child of God, and since Christ and the Holy Ghost through that faith dwell in thy heart, so are good works necessary, not to obtain salvation (which thou already hast as a matter of grace, without works, through faith alone on the Lord Jesus Christ), but to hold fast your salvation, that it be not lost, and also because if thou dost not produce good works, it is an evidence that thy faith is false and dead, a mere pretence or opinion.” …. The “Form of Concord,” in which this and other controversies in the Lutheran Church were finally adjusted, took the true ground on this subject, midway between the two extreme views. It rejects the unqualified proposition that good works are necessary to salvation, as men may be saved who have no opportunity to testify to their faith by their works. On the other hand, it utterly condemns the unwarrantable declaration that good works are hurtful to salvation; which it pronounces to be pernicious and full of scandal. It teaches that “Fides vera nunquam sola est, quin caritatem et spem semper secum habeat.” The same doctrine was clearly taught in the Lutheran Symbols from the beginning, so that the charge made by Romanists, that Protestants divorced morality from religion, was without foundation, either in their doctrine or practice…</p></blockquote>

<blockquote><p>Anno, 1522. Did arise in Saxony Nicholas Stork, who boasted of dreams and visions and rejected the Scripture as being a carnal and literal rule. Antinomians call it carnal, literal, and legal. From him and others arose Thomas Muntzer, about anno 1524, who styled himself “Thomas Muntzer, the servant of God, with the sword of Gideon against the ungodly.” This man, being hungry for glory, hunted for Luther’s name to his new designs but not obtaining it, said but [unclear] Antichrist: that Luther’s carnal and literal gospel was worse than the pope and therefore cried down books and the letter of Scripture and said the Spirit was the leader and rule to believers.</p></blockquote>

<blockquote><p>Is God most simple and free from all composition? We affirm against Socinus and Vorstius I. The Socinians agitate this controversy with us since they deny that simplicity can be attributed to God according to the Scriptures and think it should be expunged from the number of the divine attributes for no other purpose than to weaken more easily the mystery of the Trinity by establishing the composition of the divine essence (The Racovian Catechism 3.1 [1818], p. 33). Vorstius retained this error (with various others also) and introduced it into his Tractatus theologicus de Deo (1610) and in the notes to “Disputatione III: De Natura Dei” (cf. Tractatus theologicus de Deo [1610], pp. 19–28). With these the Remonstrants also agree. In their Apology, they deny that the simplicity of God is necessary to be believed or that anything occurs in Scripture relative to it, but that the whole doctrine is metaphysical whether you consider the word or the thing (“Apologia pro confessione sive declaratione … Remonstrantes,” 2 in Episcopius, Operum theologicorum [1665], Pt. II, p. 129). But the orthodox have constantly taught that the essence of God is perfectly simple and free from all composition. II. Simple is used in two senses: either absolutely and simply; or relatively and comparatively. Absolutely is such as in every kind of being excludes composition; comparatively is such as excludes it only with respect to some. Heaven and the elements are called simple bodies with respect to mixed, but do not exclude composition from their matter and form and quantitative parts. Angels and souls are simple with respect to bodies, but not absolutely such because they always involve a composition. Here we speak of absolute and not of comparative simplicity. III. The simplicity of God considered not morally, but physically, is his incommunicable attribute by which the divine nature is conceived by us not only as free from all composition and division, but also as incapable of composition and divisibility. Proof that God is perfectly simple. IV. This is proved to be a property of God: (1) from his independence, because composition is of the formal reason of a being originated and dependent (since nothing can be composed by itself, but whatever is composed must necessarily be composed by another; now God is the first and independent being, recognizing no other prior to himself); (2) from his unity, because he who is absolutely one, is also absolutely simple and therefore can neither be divided nor composed; (3) from his perfection, because composition implies imperfection inasmuch as it supposes passive power, dependency and mutability; (4) from his activity, because God is a most pure act having no passive admixture and therefore rejecting all composition (because in God there is nothing which needs to be made perfect or can receive perfection from any other, but he is whatever can be and cannot be other than what he is). Whence he is usually described not only by concrete but also by abstract names—life, light, truth, etc. V. From the removal of all species of composition (such as physical—of matter and form, since he is incorporeal); or of quantitative parts (which do not apply to God); or of subject and accident (because no accident can make the most perfect still more perfect); logical (of kind and difference because God is above every genus, nor is his a common nature capable of being restricted by difference); metaphysical act and power (since he is a pure act and incapable of change properly so called, to whom nothing new can happen or be received by him); of essence and existence (as in created things in which the nature of existence differs from that of essence, since their essence can be conceived without existence; nor does existence enter into their definition because they can be and not be, and existence with respect to them is something contingent, not necessary. For in God essence cannot be conceived without existence, and it is repugnant to conceive of God as not existing; hence philosophers call him a being by essence (i.e., which exists in virtue of its own essence) and of the nature of whose essence it is that he always exists. For this reason, God calls himself Jehovah (viz., he who is, “I am that I am” [‘hyh ‘shr ‘hyh]) to signify that being belongs to him in a far different manner than to all created things, not participatively and contingently, but necessarily, properly and independently. Finally, his simplicity is proved from nature and subsistence; for persons and essence are not related as real component extremes from which a tertium quid may arise (as in human things from the nature of man and the subsistence of Peter arises that person whom we call Peter); otherwise not a Trinity but a certain quaternity would be conceived of in God; nor do modes (such as subsistences) compose, they only modify. VI. But as God rejects all composition in himself, so his simplicity hinders him also from being compounded with any created things so as to hold the relation of some part either of matter or form (against the opinion of the Platonists who supposed God to be the soul of the world; and of the Manicheans who held that all creatures were propagated from the essence of God). This is so both because he is altogether diverse from creatures, and because he is immutable and incorruptible (he cannot coalesce in one with any mutable and corruptible created thing). For all composition infers mutation by which a thing becomes part of a whole, which it was not before. Sources of explanation. VII. If all things are said to be of God (Rom. 11:36), this must be understood not hylikōs (“belonging to matter”) and materially, but dēmiourgikōs (“formatively”) and efficiently. We are called the race and offspring of God (Acts 17:28), not by a participation of the same essence, but by similarity of likeness; efficiently not essentially, as also he is called the “Father of spirits” (Heb. 12:9) with reference to creation, not to composition. The Son of God is God-man (theanthrōpos) not by composition properly so-called, but by hypostatical union (by which the Word [logos] indeed assumed human nature in one hypostasis, but was not compounded with it as part with part; but stood to it in the relation of perfecter and sustainer to make perfect and sustain an essential adjunct, so that the human nature indeed did thence receive perfection, but nothing was added by it to the divine nature). VIII. Composition is in that in which there is more than one real entity, but not where there is only more than one mode because modes only modify and characterize, but do not compose the essence. But in divine things there are one essence and three hypostases (which are modes distinguishing indeed the persons from each other, but not composing because they are not real entities concurring to the composition of some fourth thing, since they have one common essence; but they are only modifications according to which the essence is conceived to subsist in three persons). IX. Simplicity and triplicity are so mutually opposed that they cannot subsist at the same time (but not simplicity and Trinity because they are said in different respects): simplicity in respect to essence, but Trinity in respect to persons. In this sense, nothing hinders God (who is one in essence) from being three persons. X. The decrees of God can be regarded in two ways: either subjectively (if it is right so to speak, i.e., on the part of the internal act in itself and absolutely); or objectively, extrinsically and relatively with respect to creatures (respectively). In the former manner, they do not differ from God himself and are no other than God himself decreeing. But in the latter, they do differ because they may be conceived as many and various (not as to the thing, since God has decreed all things by one single and most simple act, but as to the objects), even as the knowledge of God is conversant with innumerable objects without detriment to his unity. XI. The decrees of God are free, not absolutely and as to the principle, but relatively and objectively and as to the end. For there could be no external object necessarily terminating to the divine will, for God stands in need of nothing out of himself. Therefore they could be and not be. But this does not hinder them from being called necessary as to the principle and internal act because the act of intelligence and will could not be absent from God at all. He could not be God without intelligence and will. They are necessary, therefore, as to internal existence, but free as to external relation (schesin) and habit. Nor can the will of God be said to cease absolutely, but with respect to the external object on which it is terminated. XII. The decrees of God are immanent acts of the divine will, but not properly its effect. God ought not to be called so much the cause as the principle of them. Hence there is no need that they should be posterior to God except in our order and in the manner of conceiving them. XIII. Although the essence of God (considered simply in itself) is absolute and implies no relation to creatures, yet this does not hinder it (when considered with relative opposition to creatures and as determining itself in the manner of vital principle to the production of this or that thing out of itself) from having a certain reference (schesin) and relation to creatures. Nor can that manifold relation make composition in God, more than the relation which his omniscience and omnipotence bear to things ad extra, constituted a real difference between God and his omnipotence and omniscience. XIV. Whatever in God is essential and absolute is God himself. Thus the absolute attributes may be identified really with the divine essence and are in it essentially, not accidentally. If they are predicated of God in the concrete, their subject is only of denomination, not of inhesion (inhaesionis). But whatever is personal and modal in God is indeed God himself in the concrete, though not in the abstract. XV. The relative attributes do not argue composition, but distinction. The formal nature of relations is not to be in, but to be to. Nor do they superadd a new perfection to the essence, but only imply a habitude of the essence to other things. Paternity and dominion do not render him another being, but in a different manner dispose the possessor without superinducing a change in him. XVI. The personal property of the Son does not make his essence different from that of the Father, nor of a simple essence make a composed, for nothing real is added to the essence, rather it only makes the Son distinct from the Father. Distinction is not composition. XVII. The fathers often insist on this simplicity of God. “The nature of God is simple and immutable and undisturbed, nor is he himself one thing and what he is and has another thing” (Augustine, 1. 5, de Trinit. c. 1+). And after teaching that no creature is truly and perfectly simple, he adds: “Now although God may be called manifold, yet he is truly perfectly simple, for he is called great, wise, happy, and true, and whatever with propriety may be said of him. But his greatness is the same as his wisdom, for he is not great in mass, but in virtue, and his goodness is the same as his wisdom and greatness and truth” (The Trinity 6.6, 7* [FC 45:208–9; PL 42.929]). So too Athanasius: “God is not composed who composed all things that they might be; nor is he such as those things are which were made by his word; since he is a simple substance in whom there is no quality nor any shadow of change, as James testifies” (To the Bishops of Africa 8 [NPNF2, 4:493; PG 26.1043]).</p></blockquote>

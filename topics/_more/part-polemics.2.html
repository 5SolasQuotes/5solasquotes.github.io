<blockquote><p>As Zwingli’s successor, Heinrich Bullinger (1504-1575) consolidated the reform of Zurich. Nevertheless, he is more positively disposed toward Marian doctrine and piety. His ‘Sermon on Mary,’ after defending Mary’s perpetual virginity… This is not to say that the sermon is a wholesale endorsement of Marian developments to the sixteenth century, for it also regards the immaculate conception and the bodily assumption as open questions… Bullinger also inveighs against her invocation and rejects the understanding of Mary as mistress of the church.</p></blockquote>

</figure><figure class="quote" id="q-5db7de0c84" data-kw="">
<blockquote><p>But that even our Scriptures… use metaphorical and symbolic words and discourse is clearly apparent from these things… How is it that Mary herself calls Joseph the father of Jesus (Luke 2:48)? What pious person would not profess that all these things are said improperly? Or, having been taught by Scripture, do we not firmly believe that the Lord Jesus was by no means conceived by the seed of Joseph (which certain heretics, being of unsound mind with the Jews, have dared to proclaim) but that He was conceived of the Holy Spirit (Luke 1:35), and that His blessed mother had never known a man but remained a virgin and untouched forever?</p></blockquote>

</figure><figure class="quote" id="q-10069342eb" data-kw="">
<blockquote><p>They [Romanists] say moreover that the perpetual virginity of our Lady is to be believed of necessity as Cyprian, Chrysostom, Jerome, Ambrose, Austen and all other speaking thereof say. But this is not found in the Scripture: ergo [therefore] there is something to be believed that is not written in the Scripture. The minor, that is to say that this is not written in the Scripture is false. For first, none of the old authors that rehearse traditions of the apostles-unwritten make mention of the perpetual virginity of our Lady to be one of them: but they rehearse only diverse ceremonies or bodily gestures… which (as I have manifestly declared) are not necessary to salvation… Moreover all the said authors prove her perpetual virginity by this text of Scripture: Ezekiel 44, ‘This door shall be still shut and not opened for any man to go through it: but only for the Lord God of Israel, yea He shall go through it, else shall it be shut still.’ For if these and such other fathers had not judged her perpetual virginity to have been written in the Scriptures: they would never have judged it to have been a thing to be believed under pain of damnation. Saint Jerome also calls Helvidius a rash and an ungodly man: because that he taught that our Lady had other children by Joseph after Christ’s birth, which doctrine he could not prove by the Scriptures of God. In like manner we call all them that preach any doctrine in the Church without the authority of God’s Word both ungodly, rash and wicked members of Antichrist.</p></blockquote>

<blockquote><p>…we considered each chapter by itself, and left nothing unexplored, and diligently examined everything respecting God, the sacred laws and rights of the Church, and it is impossible to express the exceeding delight we derived from that work, when we clearly perceived that in your little book was most faithfully, holily, piously, and indeed divinely explained, and that briefly whatever we have been constantly teaching these eight years, and still by the grace of God, continued to teach, in our Churches, in the schools, and in the pulpit. We are therefore altogether compelled, as well by our consciences, as from a sense of duty, to undertake its patronage, and not only to express our approval, but also our exceeding commendation of every chapter and every sentence.</p></blockquote>

<blockquote><p>CHRIST IS TRUE MAN, HAVING REAL FLESH. We also believe and teach that the eternal Son of the eternal God was made the Son of man, from the seed of Abraham and David, not from the coitus [union] of a man, as the Ebionites [a sect from the Early Church] said, but was most chastely conceived by the Holy Spirit and born of the ever virgin Mary, as the evangelical history carefully explains to us (Matt., ch. 1). And Paul says: “he took not on him the nature of angels, but of the seed of Abraham.” Also the apostle John says that whoever does not believe that Jesus Christ has come in the flesh, is not of God. Therefore, the flesh of Christ was neither imaginary nor brought from heaven, as Valentinus and Marcion wrongly imagined.</p></blockquote>

</figure><figure class="quote" id="q-f261cc281e" data-kw="">
<blockquote><p>As Mary conceived a virgin, so it may be well thought that she continued a virgin to the end, though we make it no article of our faith. When Christ was upon the cross, he commended his mother to the custody of John; which probably argues that she had no child to whose care and keeping she might be commended. And though Christ be called her firstborn, yet does it not follow that she had any child after him: for as that is called last after which there is none, so that is called the first before which there was none. And as for Joseph, when he was espoused to Mary, he was a man of eighty years old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles… (Cambridge, 1595)</cite>, p. 171</span></figcaption>

</figure><figure class="quote" id="q-21283dd83a" data-kw="">
<blockquote><p>The nativity of Christ, is that whereby Mary, a virgin, did after the course of nature and the custom of women [contra in partu], bring forth Christ, that Word of the Father and the Son of David: so that those are much deceived which are of opinion that Christ, after a miraculous manner, came into the world, the womb of the Virgin being shut. Lk. 2:23, ‘Every man-child which first opens the womb, shall be called holy to the Lord.’ The which place of scripture is applied to Mary and our Savior Christ. Hence is it that the Virgin Mary is said Theotokos [God-bearer] to bring forth God, albeit she is not any way mother of the Godhead. For Christ as He is God, is without mother, and as man, without father. It is convenient to be thought that Mary continued a virgin until her dying day, albeit we make not this opinion any article of our belief: I. Christ being now to depart the world, committed his mother to the tuition and custody of his disciple John, which it is like He would not have done, if she had had any children, by whom, as custom was, she might have been provided for, Jn. 19:26. II. It is likely that she who was with child by the Holy Ghost, would not after[ward] know any man. III. It is agreed of by the Church in all ages.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The nativity of Christ, is that whereby Mary, a virgin, did after the course of nature and the custom of women [contra in partu], bring forth Christ, that Word of the Father and the Son of David: so that those are much deceived which are of opinion that Christ, after a miraculous manner, came into the world, the womb of the Virgin being shut. Lk. 2:23, ‘Every man-child which first opens the womb, shall be called holy to the Lord.’ The which place of scripture is applied to Mary and our Savior Christ. Hence is it that the Virgin Mary is said Theotokos [God-bearer] to bring forth God, albeit she is not any way mother of the Godhead. For Christ as He is God, is without mother, and as man, without father. It is convenient to be thought that Mary continued a virgin until her dying day, albeit we make not this opinion any article of our belief: I. Christ being now to depart the world, committed his mother to the tuition and custody of his disciple John, which it is like He would not have done, if she had had any children, by whom, as custom was, she might have been provided for, Jn. 19:26. II. It is likely that she who was with child by the Holy Ghost, would not after[ward] know any man. III. It is agreed of by the Church in all ages.”

<blockquote><p>In that James is called our Lord’s brother [in Gal. 1:19] three things may be demanded: One, which James this was? Answer: It was James the son of Alpheus: for he lived 14 years after this, Gal. 2:9, whereas James the son of Zebedeus lived not so long, because he was put to death by Herod. The second thing is, how James should be the Lord’s brother? Answer: In scripture, children of the same womb, are brethren: men of the same blood are brethren; as Abram and Lot, Gen. 13:8. Men of the same country are brethren, thus Saul’s countrymen are called his brethren, 1 Chron. 12:2. And James is called our Lord’s brother, not because he was of the same womb, but because he was of the same blood or kindred: for Elie had two daughters, Mary, espoused to Joseph, and Mary Cleophas, who afterward was married to Alpheus, of whom came James here mentioned. James therefore was the cousin-german [first-cousin] of Christ. Therefore Helvideus failed when he went about to infringe the perpetual virginity of the virgin Mary out of this place, as if she had more sons beside Christ. The third thing is, what benefit James had by being the Lord’s brother? Answer: He is here called the Lord’s brother only, for distinction’s sake in respect of the other James the son of Zebedeus…</p></blockquote>

<blockquote><p>The Scripture tells us how man comes four ways into the world… 4. Of a woman without a man, and so was Christ born. Of the Virgin Mary.] Where the mother of Christ is described by her Name, ‘Mary’; surename, ‘Virgin’. The new Jesuits and old Friers have many wonderful extravagant conceits of this name: let it suffice that it is added in the Gospel and Creed to show that Christ came of the lineage of David: and that therefore He was the true Messias, as God had promised and prophesied by the mouths of all his holy servants. Virgin] A perpetual Virgin: Before, In, After Christ’s birth. Before his birth, against 1. Jews, 2. Gentiles, 3. Cerinthians. Unto the first [the Jews] we say with Cyril: Pariet Aaronis virga sine semine, et non pariet virgo sine semine? aut vtrum[que] negate aut vtrum[que] concedite. Against the second [the gentiles], we have: Ficta: Qui enim e Iouis cerebro Mineruam, et ex eiusdem femore Bacchum, falso prognatum esse fabulamini: quomodo ex vtero virginali Christum nasci dicitis impossibile? Facta: Quoniam animalia multas sine commistione generantur. And Plutarch in the life of Numa spake like an angel: Incredibilo non est, ut spiritus Dei cum muliere coeat, ei[que] sobolis quaedam principia ingoneret. 3. The Cerinthians, Ebionites, and Carpocratian heretics held that Christ was the natural son of Joseph: et verus, et merus homo [both true and merely man]. Contrary to text, Mt. 1:25; Lk. 3:23. See the Gospel, Dom. l, post Epiphan. In his birth, against: Jovinian, Durandus. Unto these that of Isa. 7 is opposed, ‘Ecce 〈…〉, &amp; pariet filium.’ The which words are to be construed: ‘in censu composito, non diuiso: scilicet integra perman•e•• et conceptura, et paritura: nam quale signum vel prodigium esset ut quae fuit virgo conciperet, et corrupta pareret?’ ‘Hic si ratio quaeritur, non erit mirabile. Si poscitur exemplum, non erit singulare. Demus Deum aliquid posse, quod nos fateamur inuestigare non posse.’ ‘Fides adsit, et nulla quaestio remanebit.’ See the Gospel of the purification. After his birth against the Old Helvidians, [and] New Antidicomarianites: holding it a point of zeal to disgrace this holy Virgin: whereas it is our duty rather highly to reverence her, as being the Mother of our Lord; a prophetess on earth, a saint in heaven, (as the Fathers usually) the window of heaven, through which it pleased the light of the world to illuminate such as sit in darkness and in the shadow of death. Of such estimation in the Church, that whereas the first General Council was assembled against Arius, to maintain the honor of the Son, and so by consequence of the Father: The second against Macedonius, to maintain the honor of the Holy Ghost: The third was assembled against Nestorius, to maintain the dignity of the blessed Virgin. And therefore let not us give her too little, though the Papists have given her too much. See Gospel on the Annunciation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of all the Principal Scriptures used in our English Liturgy… (London, 1610)</cite>, pp. 37-8</span></figcaption>

<blockquote><p>VII. We believe also that Mary continued a virgin after her childbirth: For her marriage with Joseph did not consist in the generation of children, but in her education and holy conjunction of life with him. VIII. Although Christ had no other brothers born after Him, yet He is rightly called Mary’s first begotten Son. In Scripture Christ is called the ‘firstborn’ four manner of ways… 4. In respect of his nativity of the Virgin, Lk. 2:7. Now He is not only called firstborn, whom other brothers do follow; but he also who is born before others, although he be indeed the only begotten, or he whom other brothers do not follow; whence such a one, even before he had any brothers, was consecrated to God, as if he had been the firstborn, Num. 18:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity… (d. 1629; London, 1660)</cite>, pp. 128-9</span></figcaption>

<blockquote><p>Though Christ in regard of his divine nature, and by virtue of his eternal generation be the only begotten Son of his Father; and in regard of his humane nature, by reason of the perpetual virginity of his mother, her only begotten Son; yet may He well be said to have brethren, and that in two especial respects: 1. Because the Son of God and Son of men are of one, even of one and the same nature: Therefore He is not ashamed to call them brethren, Heb. 2:11. 2. Because He has adopted them to be Sons of his Father; For we children of men are said to have the adoption of children by Jesus Christ, Eph. 1:5. In this respect Christ stiles his disciples whom He had adopted, ‘brethren’, Mt. 28:10. For He Himself renders this reason of calling them brethren, ‘My Father is their Father’, Jn. 20:17.</p></blockquote>

</figure><figure class="quote" id="q-2e880b3191" data-kw="">
<blockquote><p>The fifth and last proposition is this, that although Jesus of Nazareth naturally descended only from Mary, yet he derives not his title to the crown and kingdom of the Jews originally by the line of Mary (for as much as she sprang from the Line of Rhesa the younger Son of Zorobabel), but received that from Joseph, who was of the elder line by Abiud; which line of Abiud failing in Joseph, as having no issue, the right of Inheritance devolved upon one of the younger line, viz. upon Mary, and consequently upon Jesus her son and legal heir. From whence there rises this unanswerable argument, both against the opinion of those who affirm Joseph to have had other Children by a former wife; as also against that old heresy of Helvidius, who, against the general and constant sense of the Church, denied the perpetual virginity of Mary, affirming that Joseph had other children by her after the Birth of Jesus. [Frederic] Spanheimius [Sr., 1600-1649] in his Dubia Evangelica, concludes against the opinion of Helvidius (which I much marvel at) merely upon the account of decency and congruity, as judging it more suitable and agreeable to that honorable esteem we ought to have of our Blessed Savior’s mother, to hold that after his birth she remained a perpetual virgin. But I add, that to assert so, seems not only decent, but of as absolute necessity, as that Jesus Christ the Messiah was to be of right king of the Jews. For had Joseph had any children either by Mary, or any other wife, they as coming from the elder line of Abiud by Joseph their father, must have claimed the inheritance of the kingdom in his right, and not Jesus the Son of Mary, who descended from a younger line, and so could not legally inherit, but upon default of issue from Joseph the only remaining heir of the elder. For this was the law of Moses, which in this case would have barred Jesus from a title to the kingdom of the Jews. But we know Jesus came to fulfill the Law in every part and tittle of it; and therefore would never have owned himself king of the Jews, contrary to the express injunctions and tenor of it. For though it must be confessed that the Gospel makes mention of the brothers and sisters of Jesus, yet it is known to be most usual in the Jewish language to call any collateral kindred, as cousins and cousin-germans [first cousins] by that name. And antiquity reports the Virgin Mary to have had two sisters, the children of which might very well be called the brethren of Jesus. So that from hence there can be no necessity of granting that Jesus had any brother or sister either by his mother Mary, or his reputed and legal father Joseph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/robert-south.html">Robert South</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twelve Sermons upon Several Subjects &amp; Occasions. The Third Volume… (London, 1698), Sermon on Rev. 22:16, Proposition 5, pp. 339-41. South was a reformed Anglican.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-911b466ed0" data-kw="">

</figure><figure class="quote" id="q-a91e1b549d" data-kw="">
<blockquote><p>Scripture does not say or indicate that she later lost her virginity… … The form of expression used by Matthew is the common idiom, as if I were to say, “Pharaoh believed not Moses, until he was drowned in the Red Sea.” Here it does not follow that Pharaoh believed later, after he had drowned; on the contrary, it means that he never did believe. Similarly when Matthew [1:25] says that Joseph did not know Mary carnally until she had brought forth her son, it does not follow that he knew her subsequently; on the contrary, it means that he never did know her. Again, the Red Sea overwhelmed Pharaoh before he got across. Here too it does not follow that Pharaoh got across later, after the Red Sea had overwhelmed him, but rather that he did not get across at all. In like manner, when Matthew [1:18] says, “She was found to be with child before they came together,” it does not follow that Mary subsequently lay with Joseph, but rather that she did not lie with him. Elsewhere in Scripture the same manner of speech is employed. Psalm 110[:1] reads, “God says to my Lord: ‘Sit at my right hand, till I make your enemies your footstool.’ ” Here it does not follow that Christ does not continue to sit there after his enemies are placed beneath his feet. Again, in Genesis 28[:15], “I will not leave you until I have done all that of which I have spoken to you.” Here God did not leave him after the fulfillment had taken place. Again, in Isaiah 42[:4], “He shall not be sad, nor troublesome, till he has established justice in the earth.” There are many more similar expressions, so that this babble of Helvidius is without justification; in addition, he has neither noticed nor paid any attention to either Scripture or the common idiom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>That Jesus Christ was Born a Jew (1523) in LW 45.206, 212-213</cite></span></figcaption>

</figure><figure class="quote" id="q-eab23cb342" data-kw="">
<blockquote><p>According to His humanity, He, Christ, our Savior, was the real and natural fruit of Mary’s virginal womb (of which Elizabeth, filled with the Holy Spirit, said to her in Luke 1:42: “Blessed is the fruit of your womb!”). This was without the co-operation of a man, and she remained a virgin after that. Everything else that a mother imparts to a child was imparted by Mary, the mother of God’s eternal Son. Even the milk He sucked had no other source than the breasts of this holy and pure mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4 (1539) in ed. Jaroslav Pelikan, Luther’s Works (St. Louis: Concordia Pub. House, 1955)</cite>, 22:23-24</span></figcaption>

</figure><figure class="quote" id="q-d8b5db9ae0" data-kw="">
<blockquote><p>Now the question may occupy us how Christ could have brothers, since He was the only Son of Mary, and the Virgin Mary bore no children besides Him. Some say that Joseph had been married before his marriage to Mary, and that the children of this first wife were later called Christ’s brothers… Any children born to Joseph by other wives would have been half brothers of Christ. This is the explanation offered by some. But I am inclined to agree with those who declare that “brothers” really means “cousins” here, for Holy Writ and the Jews always call cousins brothers. Be that as it may, it matters little. It neither adds to nor detracts from faith. It is immaterial whether these men were Christ’s cousins or His brothers begotten by Joseph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4 (1539) in LW</cite>, 22:214-215</span></figcaption>

</figure><figure class="quote" id="q-e12a8af594" data-kw="">
<blockquote><p>For this reason, too, Scripture does not quibble or speak about the virginity of Mary after the birth of Christ, a matter about which the hypocrites are greatly concerned, as if it were something of the utmost importance on which our whole salvation depended. Actually, we should be satisfied simply to hold that she remained a virgin after the birth of Christ because Scripture does not state or indicate that she later lost her virginity. We certainly need not be so terribly afraid that someone will demonstrate, out of his own head apart from Scripture, that she did not remain a virgin. But the Scripture stops with this, that she was a virgin before and at the birth of Christ; for up to this point God had need of her virginity in order to give us the promised blessed seed without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>LW</cite>, 45:205-206</span></figcaption>
<div class="meta"><span class="t"><a href="../../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-74ab6f9bac" data-kw="">
<blockquote><p>The conjecture which some have drawn from these words [‘How shall this be, seeing I know not a man?’], that she had formed a vow of perpetual virginity, is unfounded and altogether absurd. She would, in that case, have committed treachery by allowing herself to be united to a husband, and would have poured contempt on the holy covenant of marriage; which could not have been done without mockery of God. Although the Papists have exercised barbarous tyranny on this subject, yet they have never proceeded so far as to allow the wife to form a vow of continence at her own pleasure. Besides, it is an idle and unfounded supposition that a monastic life existed among the Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Luke, ch. 1, v. 34</cite></span></figcaption>

<blockquote><p>Doctrine 3. Christ was born of Mary, remaining still a virgin after He was born. This is gathered from the scope of the words [Mt. 1:20], the question being about this, whether Mary were a virgin or no; and the words of the angel were to assure him that she was. Reason. 1. Is that this might be a singular and miraculous sign to the whole house of Israel, and this is it that is pointed at, in Isa. 7:14. Reason 2. That the prophesies going before of this thing might be fulfilled. Reason 3. That God’s omnipotency in this so divine a mystery, and principal a work of God, might be evidently shown. Now it was not difficult to the power of God that a son should be born of a virgin. For seeing all second causes act by their virtue which they received from God, it is not to be doubted, but that God can produce all these effects without this or that cause cooperating, which otherways use to exist by them. Yet not onely the power of God appeared in that work, but also his wisdom, to which it was most agreeable, that so singular a substance of human nature, should in as singular a manner be brought to pass, that differed from all others. For in three manners all men were made before: 1. Without the concurrence of either man or woman, as in the creation of Adam. 2. Without the concurrence of woman, as in the production of Eve. 3. By the concurrence of man and woman, as in all ordinary generation afterwards. And this only is the proper and peculiar one of Christ, by and of a woman, without concurrence of a man. Reason 4. That it might easily appear how the contagion of sin might be removed from the human nature of Christ. [The] Use, is of confirmation, for strengthening of our faith about the person of Christ; to wit, that He was both the Messiah of old promised, and the promised seed of the woman in that peculiar manner, as that promise seems to have intended; to wit, the Son of Man; that is, of a woman descending of Adam and other men in ordinary way, but made mother of a son not vulgarly or after the common manner, but miraculously and without the company of a man begotten, and born; so that from his first conception all things were in him supernatural; about which our minds being busied, ought always to be lifted up to supernatural contemplations, laying aside carnal and worldly thoughts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion, or a Plain &amp; Easy Draught of the Christian Catechism in 52 Lectures… (London: Mabb, 1659), 14th Lord’s Day</cite>, pp. 100-101</span></figcaption>

<blockquote><p>Wherefore there remaineth two rules for to judge of spirits. One is, if the opinions, as touching faith be retained perfect and pure. And this meant John when he said: ‘If any man confess the Lord Jesus,’ etc. And this confession of opinions must be examined by the holy Scriptures: the which seeing they had not in the Church at the beginning, as concerning the New Testament, they were examined by the words and doctrine of the apostles. Therefore John a little after says: ‘He that is of God heareth us, and he that heareth not us is not of God.’ Then he adds, that thus we do prove the spirit. Another rule is of manners and life: This did Christ express when he said: ‘By their fruits ye shall know them.‘ And as opinions are known by examining of them with the Scriptures, so life and manners should be tried by the discipline of the Church… In the primative Church a gift was extant whereby it might easily be known with what spirit they which did speak were led. By these means Satan was resisted when he transformed himself into an angel of light.</p></blockquote>

<blockquote><p>Christ’s first disciples were chosen by Him in order that they might disperse throughout the whole world, and preach His faith everywhere, according to Mt. 28:19, “Going… teach ye all nations.” Now it was not fitting that they who were being sent to teach others should need to be taught by others, either as to how they should speak to other people, or as to how they were to understand those who spoke to them; and all the more seeing that those who were being sent were of one nation, that of Judea, according to Is. 27:6, “When they shall rush out from Jacob [*Vulg.: ‘When they shall rush in unto Jacob,’ etc.]… they shall fill the face of the world with seed.</p></blockquote>

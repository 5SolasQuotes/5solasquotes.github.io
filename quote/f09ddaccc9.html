<main class="wrap"><figure class="quote" id="q-f09ddaccc9" data-kw="">
<blockquote><p>James Renwick Willson was one of the finest Covenanter theologians in the nineteenth-century; his works should be more widely read today, and thankfully Crown and Covenant have republished some of his political writings in an edited collection entitled, Political Danger. Here is what he has to say about the Christian’s attitude to paying taxation for godly purposes:

The payment of tribute and custom. “Pay ye tribute also.” “Render to all their dues, tribute to whom tribute – custom to whom custom.” Those who are employed in attending to the general interests of the commonwealth are necessarily prevented from making efforts in the ordinary way, to provide for their temporal wants, and those of their families. The public is bound on principles of common honesty to make comfortable provision for their sustenance. National defences, internal improvements, the diffusion of knowledge, and other important public objects, cannot be effected without the payment of tribute and custom. The happiness and security of all are promoted by them, and all are bound to contribute their just proportion towards them. The principle upon which the payment is to be made ascends much higher. The former principle binds to pay for services rendered even by those who may not be recognized as the vicegerents of God. But the payment of dues to the powers mentioned by Paul, is ascribed to the fact that “they are God’s ministers attending continually upon this very thing.” What is the very thing on which they attend continually? Not the receiving of tribute and custom, but the execution of the laws of God, in the exercise of their official functions. For they are God’s ministers, attending continually to their ministry, for God’s glory and the interests of the nation. Their whole time is occupied in the service of God, as public functionaries, that he has appointed; and therefore the tribute and custom are given to God, as a demand which he makes on the behalf of those public and honourable servants, who serve not their own evil passions, by deeds of iniquity, who serve not the cause of idolatry, or vice; but serve God continually. Wherever powers, thus ordained, are found in the continual service of God as accountable to him; custom and tribute are their due, and he who withholds, when he can give, withholds not merely from man, but from God his due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-r-willson.html">J. R. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon on civil government, preached at Coldenham,</cite>, Feb. 11, 1821 (Paisley, 1821), pp 23-4.</span></figcaption>

<blockquote><p>And these were the Halcionian days which Ambrose himself declares and magnifies, even when Maximus had suppressed the Arrians, En tempus acceptabile! quo non hiemalibus perfidiae caligantis pruinas annus riget, nec altis nivis, etc. ibid. Reader was not that time more strange than ours? that Ambrose must be so loyal as to save his prince and country from a usurper; and yet so pious as to be persecuted by his prince, and he and his brethren saved by that same usurper, and openly give praise to God for the great felicity of the Church which it received by that same usurper whom he so resisted?</p></blockquote>

<blockquote><p>And first concerning Church meetings, this counsel is to be given [to civil magistrates], that they come not by heaps, or by throngs, neither in, nor go out, and that they flock not by great numbers into one church, where they shall be driven to sit straightly and near together, especially in one city: whereas there are more places fit for this purpose, in the which the divine service, that is, the expounding of the word of God, and administration of the sacraments may be done. For albeit these things may peradventure seem unto some to be but small, and of little importance, yet nothing is to be omitted, which by any means may make for the turning away of the infection. And that which Cicero said, that when as we ought to do for the benefit of men, and do service to the fellowship of mankind, nothing is to be kept close, whatsoever commodity or store we have, the same especially ought to have place at this time.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c6852c840c" data-kw="">
<blockquote><p>The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/london.html">Charles Creighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Epidemics in Britain, from A.D. 664 to the Extinction of the Plague</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.”

— London, Charles Creighton, A History of Epidemics in Britain, from A.D. 664 to the Extinction of the Plague [1666] (Cambridge, 1891), p. 497">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+truth+is%2C+the+times+were+very+sad%2C+and+nothing+but+lamentation+and+bemoanings+heard+in+the+streets.+Those+that+had+wealth+retired+into+the+country%2C+but+those+that+were+needy+were%2C+if+not+taken+away+by+death%2C+almost+starved%2C+and+so+consequently+ready+to+mutiny+against+their+superiors+for+relief.+All+the+gates+of+colleges+and+halls+were+constantly+kept+shut+day+and+night%2C+a+few+persons+being+left+in+them+to+keep+possession.+The+shops+of+the+town+were+closed%2C+none+but+the+attendants+on+the+sick+or+the+collectors+for+them+were+to+be+seen+stirring+abroad%2C+the+churches+were+seldom+or+never+open+for+divine+service.%E2%80%9D%0A%0A%E2%80%94+London%2C+Charles+Creighton%2C+A+History+of+Epidemics+in+Britain%2C+from+A.D.+664+to+the+Extinction+of+the+Plague+%5B1666%5D+%28Cambridge%2C+1891%29%2C+p.+497&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc6852c840c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c6852c840c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=The%20truth%20is%2C%20the%20times%20were,or%20never%20open%20for%20divine%20service&amp;text=The%20truth%20is%2C%20the%20times%20were%20very%20sad&amp;text=were%20seldom%20or%20never%20open%20for%20divine%20service" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c6eb61e32" data-kw="">
<blockquote><p>Answer 1: Mr. Hooker [a New England Independent puritan] makes all that Christians do as [private] Christians and as Churches, that is, gathering of Churches, hearing, partaking of seals and censures, to be private actings not belonging to the magistrate. Strange it is, that the convening of the ten thousand subjects in the same place (as our Brethren [the Independents] say) belongs nothing to the magistrate; sure it sides with peace or war. … [Answer] 3: I wonder more in what capacity the magistrate can have to do with commanding and governing men, if not as they converse morally with men, and in their families, as fathers and sons, as masters and servants, and as Christians who both in private and public may perform duties to one another, or oppress one another… But if Mr. Hooker mean that private actings of citizens, of members of families, of Christians, that are good and indifferent, do not appertain to the magistrate, who is an adversary to him in this? Though all good actions done in private or public deserve praise, reward and protection from the magistrate… Mr. Hooker [said]: “Commission and just permission are all one: A ruler permits a finder [founder] to set up a school; he needs no commission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 4, ch. 12, ‘Of the Magistrate’s Power in Convocating Synods’, pp. 487-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-f33153f387" data-kw="">

</figure><figure class="quote" id="q-fc8bb9f4db" data-kw="">
<blockquote><p>4. The sin of receiving and spreading false reports of others upon hearsay, is now so common among those that do profess sobriety and religion, that all men should take heed of it in all company, as they would do of the plague in an infectious time: And now it is so notorious that false news and slanders of others are so common, neither good men’s words, nor common fame, will allow you (or excuse you) to believe or report any evil of another, till you are able to prove that it is your duty: But all Christians should join in lamenting and reproving this common uncharitable sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 430</span></figcaption>

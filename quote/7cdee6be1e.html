<blockquote><p>30. But those in whom true faith is found are all and only those who are predestined to eternal life. For that faith falls to them from the decree of divine election; and therefore it is called by Paul, “the faith of God’s elect,” Tit. 1:1. Whence it happens that without it no one can be saved, nor does anyone have it who does not obtain salvation. For that assent which imitates true faith in some of the reprobate is temporary faith, about which we spoke above: and it must be distinguished from justifying and saving faith. 31. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God does not cleanse from every stain of original sin all the infants whom he admits into his heavenly kingdom, into which nothing polluted or defiled enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, He undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues. 32. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), vol. 2, ‘On Faith’, pp. 131-32 Latin</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a8d35535aa" data-kw="">
<blockquote><p>The Word of God, Gen. 17:23, acknowledges that one may have a right to the first seal of the covenant, and that coram Deo, that has no saving grace. Ishmael was thirteen years old, verse 25, when he was circumcised, and therefore of age to answer for himself; yet Ishmael had no saving grace, neither was he within the covenant of Isaac–the covenant of absolute and certain salvation, from which he was excluded, verse 19. Yet Ishmael has a right to the first seal of the covenant coram Deo, as is most most evident from the immediate command of God, that he that was born in Abraham’s house, must needs be circumcised, verse 12, and accordingly Abraham understood it. He proceeds upon the command of God to circumcise Ishmael first of all. Now what is it that giveth one right to any ordinance but the command, or at least more evidently than the command of God Himself? And that right which we have from God’s command, is doubtless a right coram Deo, and in his sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-fullwood.html">Francis Fullwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Visible Church</cite>, … (1658) as quoted by Thomas Boston, Works, 6:130</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-a35366c560" data-kw="">
<blockquote><p>A question here ariseth about infants; Whether they are to be baptized, or not, seeing they cannot be taught or instructed about faith? I answer that the children, or infants of believers ought to be baptized, because while they are yet infants, as to the external privileges of the Covenant with God, they are accounted both persons and parties of, or belonging to their parents; and therefore they are of the family of Christ, or of the number of his disciples. For if the Covenant made with Abraham be the same for substance, by which we are saved, and belongeth as much to us and to our children as it did to Abraham and his posterity, then not only we, but our children also ought to be partakers of the seal of this Covenant. But the first is true, as appeareth by Rom. 4 and other places; and therefore the latter also is true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion, or, A Plain and Easy Draught of the Christian Catechism in 52 Lectures</cite>, … (London, 1659), The 26-27th Lord’s Days, p. 180</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

>Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-363ccf782c" data-kw="">
<blockquote><p>Therefore, when we say that the proper power of outward baptism resides in being a seal, we mean two things: firstly, that it makes more certain the promised grace that the principal cause has conferred or is to confer, and secondly that it strengthens and increases that grace. But since that promise is not absolute but linked to the condition of faith and repentance, it follows that the grace is sealed only to those who believe and repent, and consequently do not use the signs in a unworthy manner, as the apostle says in 1 Corinthians 11:29. In this regard we grant that this sacrament–just like the other ones–is also exhibitive of the thing that is promised, because in the lawful and worthy use of this sacrament these things that are promised are through the Holy Spirit not merely offered to believers but they are in fact exhibited to and conferred upon them. For God is truthful in sealing his promises, and our sacraments are not supplements of a letter that kills, but of the life-giving Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, sections 31-32, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

t="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e695624f3c" data-kw="infants are not to be baptized">
<blockquote><p>Because they baptized Proselytes both Men, Women and Children, must Christians do so too? Sure the Custom of the Romish Church in baptizing of Infants, as a human Tradition, is every way of as good Authority to warrant us so to do, as the Custom of the unbelieving Jews. But pray take what a Learned Pedo-Baptist, and a Son of the Church of England, hath said in answer to this vain Conceit; &#x27;tis Sir Norton Knatchbull, in his Animadversiones in lib. Novi Testamenti, pag. 313. Ac cum videam summi judicii viros in his temporibus ex Rabbinis fundamenta petere veritatis, &amp;c. But when I see in these times some Men of the greatest Judgment to fetch the Foundation of Truth from the Rabbins, I cannot but stick at it: for whence was the Talmud sent to us, (they are the words (saith he) of Buxtorf in his Synagoga Judaica) that we should give so, much Credit thereto, that we should believe that the Mosaic Law either was or ought to be understood therefrom, much less the Gospel, to which they are professed Enemies?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Because they baptized Proselytes both Men, Women and Children, must Christians do so too? Sure the Custom of the Romish Church in baptizing of Infants, as a human Tradition, is every way of as good Authority to warrant us so to do, as the Custom of the unbelieving Jews. But pray take what a Learned Pedo-Baptist, and a Son of the Church of England, hath said in answer to this vain Conceit; &#x27;tis Sir Norton Knatchbull, in his Animadversiones in lib. Novi Testamenti, pag. 313. Ac cum videam summi judicii viros in his temporibus ex Rabbinis fundamenta petere veritatis, &amp;c. But when I see in these times some Men of the greatest Judgment to fetch the Foundation of Truth from the Rabbins, I cannot but stick at it: for whence was the Talmud sent to us, (they are the words (saith he) of Buxtorf in his Synagoga Judaica) that we should give so, much Credit thereto, that we should believe that the Mosaic Law either was or ought to be understood therefrom, much less the Gospel, to which they are professed Enemies?”

— Benjamin Keach, Pedo-Baptism Disproved">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause+they+baptized+Proselytes+both+Men%2C+Women+and+Children%2C+must+Christians+do+so+too%3F+Sure+the+Custom+of+the+Romish+Church+in+baptizing+of+Infants%2C+as+a+human+Tradition%2C+is+every+way+of+as+good+Authority+to+warrant+us+so+to+do%2C+as+the+Custom+of+the+unbelieving+Jews.+But+pray+take+what+a+Learned+Pedo-Baptist%2C+and+a+Son+of+the+Church+of+England%2C+hath+said+in+answer+to+this+vain+Conceit%3B+%27tis+Sir+Norton+Knatchbull%2C+in+his+Animadversiones+in+lib.+Novi+Testamenti%2C+pag.+313.+Ac+cum+videam+summi+judicii+viros+in+his+temporibus+ex+Rabbinis+fundamenta+petere+veritatis%2C+%26c.+But+when+I+see+in+these+times+some+Men+of+the+greatest+Judgment+to+fetch+the+Foundation+of+Truth+from+the+Rabbins%2C+I+cannot+but+stick+at+it%3A+for+whence+was+the+Talmud+sent+to+us%2C+%28they+are+the+words+%28saith+he%29+of+Buxtorf+in+his+Synagoga+Judaica%29+that+we+should+give+so%2C+much+Credit+thereto%2C+that+we+should+believe+that+the+Mosaic+Law+either+was+or+ought+to+be+understood+therefrom%2C+much+less+the+Gospel%2C+to+which+they+are+professed+Enemies%3F%E2%80%9D%0A%0A%E2%80%94+Benjamin+Keach%2C+Pedo-Baptism+Disproved&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe695624f3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e695624f3c.html">Permalink</a><span class="src none">No free online copy linked</span></div>

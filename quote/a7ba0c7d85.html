<main class="wrap"><figure class="quote" id="q-a7ba0c7d85" data-kw="">
<blockquote><p>Tilen sets out the expediency of holy-days for imprinting in the minds of people the sense and knowledge of the benefits of redemption. Answer:

1. There is no mean so good for this purpose as catechizing and preaching, out of season and in season.

2. What could he say unto them who have attained his end without his mean? I find people better instructed and made more sensible of those benefits where the feasts are not kept, than where they are.

3. Think they their people sufficiently instructed in the grounds of religion when they hear of the nativity, passion, etc. What course will they take for instructing them in other principles of faith? Why do they not keep one way, and institute a holy-day for every particular head of catechism? But Bishop Lindsey thinks yet to let us see a greater expediency for observing holy-days. Certainely says he, nothing is so powerful to abolish profaneness and to root out superstition of men’s hearts, as the exercise of divine worship in preaching, praying and thanksgiving, chiefly then when the superstitious conceits of merit and necessity are most pregnant in the heads of people, as doubtless they are when the set times of solemnities return; for then it is meet to lance the oposterne when it is ripe. Answer: This is a very bad cure and is not only to heal the wound of the people slightly [Jer. 6:14], but to make it the more inveterate and festered. I might object that little or nothing is preached or spoken by him and his companions at the revolution of those festivities against the superstitious keeping of them; but though they should speake as much as can be against this superstition, their lancing being in word only, and not in deed, the recidivation will prove worse than the disease. The best lancing of the oposterne were not to observe them at all, or to preach against them, which are tried to work this effect more powerfully than the bishop’s cure has done: for all know, that there is none so free of this superstition as those who observe not the holy-days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 2, ‘Against those of our Opposites who plead for the Ceremonies as things Expedient’, pp. 13-14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ba4f4a651c" data-kw="">
<blockquote><p>The most of the persons whom the Papists now keep holy days for were very religious godly people: And the zealous religious people of that age did think that the honoring of the memories of the martyrs was a great means to invite the infidels to Christianity and to encourage the weak to stick to Christ: and therefore they kept the days of their martyrdom in thanksgiving to God and in honor of them. The wicked of that age hated and persecuted both the martyrs and them that honored them. In the next age, religion being uppermost in the world, the wicked did turn hypocrites and keep holy days for the honor of their names whom their forefathers murdered. At last when it was observed that the Papists who burned the living saints were the greatest honorers of the dead, the most religious people turned quite to dislike and reject those very days which their predecessors had set up in thanksgiving to God for the doctrine, example and constancy of the martyrs.</p></blockquote>

</figure><figure class="quote" id="q-e8fa779d47" data-kw="">
<blockquote><p>Those days which are consecrated to Christ in the Church, if they are received only for reason of a remembrance of the saving graces of Christ to us, and are retained, in order to make us more certain concerning these matters and actions, and if they are observed without any superstition of the day, in the way that they were celebrated when they were first instituted, not by the Papists, but by the Church), then, let them be retained for the honor of Christ, for as long as it seems good to the pious Church, because they are matters straightaway indifferent, and means. Although, I think and judge that even these days among us (who cannot now doubt concerning the trustworthiness of the Evangelical history; nor do we, by the grace of God, walk amongst the heathens), these days, I say, are to be abolished. For, every day, by the preaching of the gospel, Christ is born, circumcised, dies, and resurrects for us, Heb. 13:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ad tomum I. et II. controversiarum Roberti Bellarmini responsio</cite>, (Joannes le Preux, 1598), pp. 1519–20. The latin was cited by George Gillespie, A Dispute Against the English Popish Ceremonies (Naphtali Press, 2013), p. 50 and Balduin, de Cas. Consc., lib. 2, cap. 12, cas. 1. Trans. Charles Johnson</span></figcaption>

<blockquote><p>5. It is one question whether a day may be set apart for commemoration of some mystery of our religion, by men, and as a part of God’s worship. And another whether such days may be set apart for worshipping God merely as a piece of good order and policy. The first the Papists are for: the other most of our prelatists own, though some of them differ little from the Papists in this matter.

6. The question is not whether a day may be set apart occasionally for religious worship: that is, when any special providence gives occasion for fasting and humiliation or for thanksgiving and rejoicing: seeing in that case there is a special providential call to that solemn work: but whether a day may be set apart to be observed constantly and as it recurs every year. The one makes a difference between that day of the year and other days and exempts it altogether and constantly from civil use, the other does not so; the one makes a difference among days, the other makes the difference only in the works or dispensations of God which occasion such work on that day and not on another. All that the Church does in the one case, is, whereas the present providence calls to the work, as it is expressed, Isa. 22:12. The Church only determines the circumstance of time, which must be done: in the other, the Church determines more than a necessary circumstance, viz. that there shall be such a solemnity, which the Lord has not enjoined; neither do we doubt, but that the Church may appoint recurrent days for solemn worship, to wit, while the present providence that calls to such work continues. Weekly or monthly fasts may be appointed under a lasting calamity or threatening.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 9, pp. 205-6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“5. It is one question whether a day may be set apart for commemoration of some mystery of our religion, by men, and as a part of God’s worship. And another whether such days may be set apart for worshipping God merely as a piece of good order and policy. The first the Papists are for: the other most of our prelatists own, though some of them differ little from the Papists in this matter.

6. The question is not whether a day may be set apart occasionally for religious worship: that is, when any special providence gives occasion for fasting and humiliation or for thanksgiving and rejoicing: seeing in that case there is a special providential call to that solemn work: but whether a day may be set apart to be observed constantly and as it recurs every year. The one makes a difference between that day of the year and other days and exempts it altogether and constantly from civil use, the other does not so; the one makes a difference among days, the other makes the difference only in the works or dispensations of God which occasion such work on that day and not on another. All that the Church does in the one case, is, whereas the present providence calls to the work, as it is expressed, Isa. 22:12. The Church only determines the circumstance of time, which must be done: in the other, the Church determines more than a necessary circumstance, viz. that there shall be such a solemnity, which the Lord has not enjoined; neither do we doubt, but that the Church may appoint recurrent days for solemn worship, to wit, while the present providence that calls to such work continues. Weekly or monthly fasts may be appointed under a lasting calamity or threatening.”

— Gilbert Rule, The Good Old Way Defended, … (Edinburgh: 1697), sect. 9, pp. 205-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+It+is+one+question+whether+a+day+may+be+set+apart+for+commemoration+of+some+mystery+of+our+religion%2C+by+men%2C+and+as+a+part+of+God%E2%80%99s+worship.+And+another+whether+such+days+may+be+set+apart+for+worshipping+God+merely+as+a+piece+of+good+order+and+policy.+The+first+the+Papists+are+for%3A+the+other+most+of+our+prelatists+own%2C+though+some+of+them+differ+little+from+the+Papists+in+this+matter.+6.+The+question+is+not+whether+a+day+may+be+set+apart+occasionally+for+religious+worship%3A+that+is%2C+when+any+special+providence+gives+occasion+for+fasting+and+humiliation+or+for+thanksgiving+and+rejoicing%3A+seeing+in+that+case+there+is+a+special+providential+call+to+that+solemn+work%3A+but+whether+a+day+may+be+set+apart+to+be+observed+constantly+and+as+it+recurs+every+year.+The+one+makes+a+difference+between+that+day+of+the+year+and+other+days+and+exempts+it+altogether+and+constantly+from+civil+use%2C+the+other+does+not+so%3B+the+one+makes+a+difference+among+days%2C+the+other+makes+the+difference+only+in+the+works+or+dispensations+of+God+which+occasion+such+work+on+that+day+and+not+on+another.+All+that+the+Church+does+in+the+one+case%2C+is%2C+whereas+the+present+providence+calls+to+the+work%2C+as+it+is+expressed%2C+Isa.+22%3A12.+The+Church+only+determines+the+circumstance+of+time%2C+which+must+be+done%3A+in+the+other%2C+the+Church+determines+more+than+a+necessary+circumstance%2C+viz.+that+there+shall+be+such+a+solemnity%2C+which+the+Lord+has+not+enjoined%3B+neither+do+we+doubt%2C+but+that+the+Church+may+appoint+recurrent+days+for+solemn+worship%2C+to+wit%2C+while+the+present+providence+that+calls+to+such+work+continues.+Weekly+or+monthly+fasts+may+be+appointed+under+a+lasting+calamity+or+threatening.%E2%80%9D%0A%0A%E2%80%94+Gilbert+Rule%2C+The+Good+Old+Way+Defended%2C+%E2%80%A6+%28Edinburgh%3A+1697%29%2C+s

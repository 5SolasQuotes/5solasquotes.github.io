<blockquote><p>Obj. But I have often relapsed and fallen into the same sin again and again.

Ans. If Christ will have us pardon our brother seventy-seven times, can we think that he will enjoin us more than he will be ready to do himself, when in case of shewing mercy he would have us think his thoughts to be far above ours? Adam lost all by once sinning, but we are under a better covenant, a covenant of mercy, and are encouraged by the Son to go to the Father every day for the sins of that day.

Where the work of grace is begun, sin loses strength by every new fall; for hence issues deeper humility, stronger hatred, fresh indignation against ourselves, more experience of the deceitfulness of our hearts, renewed resolutions until sin be brought under. That should not drive us from God, which God would have us make use of to fly the rather to him. Since there is a throne of grace set up in Jesus Christ, we may boldly make use of it, and let us be ashamed to sin, and not be ashamed to glorify God’s mercy in begging pardon for sin. Nothing will make us more ashamed to sin than thoughts of so free and large mercy. It will grieve an ingenuous spirit to offend so good a God. Ah, that there should be such a heart in me as to tire the patience of God, and dam up his goodness as much as in me lies!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Soul’s Conflict with Itself, and Victory Over Itself by Faith. A Treatise of the Inward Disquietments of Distressed Spirits, with Comfortable Remedies to Establish them</cite>, (1635) in The Complete Works of Richard Sibbes, ed. Alexander B. Grosart, Nichol’s Series of Standard Divines. Puritan Period (7 vols, Edinburgh: James Nichol, 1862-64), 1: 231-32.</span></figcaption>

<blockquote><p>3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37]

4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.</p></blockquote>

</figure><figure class="quote" id="q-2ec24cdd2c" data-kw="">
<blockquote><p>Others (Immanuel Tremellius &amp; Thomas Wilcox) interpret this of the doors of our heart, according to that Apoc. 3:20, ‘Behold I stand at the doors and knock, if any man hear my voice and open the door, I will come in unto him, etc.’ In the Gospel’s history we find that Christ had a fourfold entertainment among men. Some received Him into house, not into heart, as Simon the Pharisee (Lk. 7:44), who gave Him no kiss, nor water to his feet: some into heart, but not into house, as the faithful centurion, esteeming himself unworthy that Christ (Mt. 8:8) shouId come under his roof: some neither into soul nor heart, as the graceIess Gergesites, Mt. 8:54; some both into house and heart, as Lazarus (Jn. 11:11, 15), Mary (Lk. 10:38), Martha. Now that Christ may dwell in our hearts by faith (Eph. 3:17), and that our bodies may be temples of his Holy Spirit (1 Cor. 6:19); we must as our prophet exhorts here, ‘lift up our souls,’ that is, in the words of St. Paul, Col. 3:2, our affections must be set on things which are above, and not on things which are on earth, if we desire to lift up our heart unto Christ’s verity, we may not lift it up unto the world’s vanity (Augustine in location), that is, we must not fasten our love too much upon the things of this life, but on those pleasures at God’s right hand, which are evermore… O Lord, which art the God of my salvation (Ps. 18:47), I lift my heart to Thee (Ps. 25:1), desirous to seek Thee, both in the right ubi, ‘where’ Thou mayst be found, and in the right quando, ‘while’ Thou mayst be found: Open my dull ears and hard heart, that thy Son my Savior may come in and dwell with me: Grant me grace that I may still hear while He calls, open while He knocks, and hold Him also when I have Him, that I may both ascend thine hill, and stand in thine holy place, that I may not only sojourn in thy tabernacle, but also rest and dwell upon the mountain of thine holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical</cite>, [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | Ascension Day Evening Prayer, Psalm 24, p. 912</span></figcaption>

<blockquote><p>8. When Christ knocks and presses hardest, it’s for our own good, and it’s a token of love in Him to do so; for, there is nothing more deplorable, than when He says to one under indisposition, and in an evil case, ‘Let him alone.’ …

10. Christ may call very pressingly, and his Word may have some work on the conscience and affections of hearers, and they be some-way affected with it, and yet the Word be rejected, and the heart not made open to Christ; as here she sleeps still notwithstanding; and the following verse confirms it.

11. There are some operations of the Spirit, which though they be more than a common work on the generality of hearers, yet are not saving, and may be, and often are, even by believers frustrated for a time, and by others for ever; for, this knocking gets a refusal, verse 3. So deceiving, beguiling and dangerous are common motions to rest on, when the finger of gracious Omnipotency is not applied, as verse 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Song of Solomon</cite>, 5:2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“8. When Christ knocks and presses hardest, it’s for our own good, and it’s a token of love in Him to do so; for, there is nothing more deplorable, than when He says to one under indisposition, and in an evil case, ‘Let him alone.’ …

10. Christ may call very pressingly, and his Word may have some work on the conscience and affections of hearers, and they be some-way affected with it, and yet the Word be rejected, and the heart not made open to Christ; as here she sleeps still notwithstanding; and the following verse confirms it.

11. There are some operations of the Spirit, which though they be more than a common work on the generality of hearers, yet are not saving, and may be, and often are, even by believers frustrated for a time, and by others for ever; for, this knocking gets a refusal, verse 3. So deceiving, beguiling and dangerous are common motions to rest on, when the finger of gracious Omnipotency is not applied, as verse 4.”

</figure><figure class="quote" id="q-51668855c3" data-kw="">
<blockquote><p>And accordingly we distinguish of the effects of God’s love in respect whereof He is said to love his creature. For they may be considered either in respect of life temporal, or of life spiritual, or of life eternal. The first effects of love, as touching life temporal, God communicates to all that have life; thus He is said to save both man and beast, and the eyes of all are said to wait upon Him; He hears the cry of ravens; the sparrows fall not to the ground without the providence divine; The very lions roaring after their prey, do seek their meat at [from] God. Thus He may be said to be as the Savior, so the lover of all men; but especially of them that believe, to wit, both in respect of the comforts of life spiritual, and the joys of life eternal which He affords unto them…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-30eda1a183" data-kw="">
<blockquote><p>A man may administer sacraments where he preaches not, as the apostles baptized, but Christ only preached there. And he that baptized Cornelius and his company, did not preach unto them, but Peter only preached. We read not that the [Greek] or minister, which Paul and Barnabas carried about with them, did preach. A minister may both preach and administer sacraments where he rules not, as Philip to the eunuch, the apostles and the 70 in Christ’s time: and ministers that preach abroad in a journey, or at a lecture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Essence &amp; Unity of the Church catholic, Visible, &amp; the Priority Thereof in Regard of Particular Churches, in Answer to the Objections made Against it</cite>, … (London, 1650), Question 1, ch. 7, p. 175</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>11. This [church] covenant (thus distinguished from the Covenant of Grace) they hold to be that covenant which is sealed by the sacraments, and for the sealing and ratifying of which the sacraments were principally ordained of God, and therefore to be administered only to such as are first entered into this covenant, as seals thereof. Apology, p. 15, 19, 31; Answer to 9; pos. pp. 63 &amp; 66. And therefore, that such persons as (by their condition) cannot join in church covenant, nor live in church fellowship with a set society, are not bound to partake in sacraments. Apology, pp. 39 &amp; 41. See [John] Robinson, Justification, pp. 80 &amp; 110, though I do not find the Brownists so solicitously to distinguish between the church covenant and the Covenant of Grace as these our [Independent and congregationalist] brethren do.</p></blockquote>

">Read it online · Reformed Books Online</a></div>

<blockquote><p>…and if Brownism be a bitter error and way, then the way of the Apologists [who are congregationalists] is not very sweet, their way being but Brown’s younger brother, agreeing with the Brownists in the nature and definition of the visible Church, in the independent power of a particular congregation, in the way of making officers, in the way of their ordinances, as prophesying, in the way of forms of prayer, in the sacraments, none to be admitted but church members, cum multis alijs [with many other things], and I desire the Apologists to give any material difference (however their grounds are different, and they do not go so far in consequences, nor are not so gross) between their churches and the Brownists:</p></blockquote>

</figure><figure class="quote" id="q-10e7eb0cf1" data-kw="">
<blockquote><p>It is uncharitable, and against the Word, to teach that when a church is dissolved, by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though both real and visible converts, have no right to the ordinances: for if the formal cause, to wit, their confederacy into one visible body, as Mr. [Thomas] Hooker [a congregationalist] says, be removed, their visible and external right is removed. The like is to be said of visible professors, and of members of another congregation, and known godly sojourners [travelers]; these Mr. Hooker [by implication] excommunicates for no scandal, visible and invisible: for impossible it is that they can meet together in one place with their own church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 1 | ch. 19, ‘Mr. [Thomas] Hooker [a congregationalist], his formal cause of a Church visible, or Church confederating, is considered’, pp. 96-104, p. 96</span></figcaption>

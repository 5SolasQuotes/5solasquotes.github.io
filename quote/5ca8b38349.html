<main class="wrap"><figure class="quote" id="q-5ca8b38349" data-kw="">
<blockquote><p>Tried by the political Creed of Mary [Queen of Scots], it must be confessed that Knox entertained disloyal sentiments. Mary held by the principle — to sovereigns a convenient one — of “the right divine of kings to govern wrong.” Knox, on the contrary, held that “all power is founded in a compact expressed or understood, between the rulers and he ruled, and that no one has either divine or human right to govern, save in accordance with the will of the people and the law of God.” This is the amount of all that Knox advanced in his various interviews with Mary. These opinions may have sounded strange to one reared in a despotic court, they were before their time, we admit; but the world has since seen cause to ratify them, and states of no mean name have acted upon them.

They are the very sentiments which were embodied in the famous Declaration of Independence emitted by the states of Holland twenty years afterwards. They received a signal triumph when the British nation adopted them at the revolution of 1688; and they form at this day the basis of that glorious constitution under which it is our lot to live. Branded as treason, when first uttered beneath the regal roof of Holyrood; not a day now passes but we read these same sentiments in a hundred journals, we hear them proclaimed in senates, they are acted on by cabinets, and re-echoed from the throne itself. Let us not forget that the first openly to avow them on Scottish soil was Knox. …

Not to sovereigns, not to parliaments, not to nobles did he entrust the safety of the Reformation; he knew it must preserve itself. The broad practical sagacity in which he excelled, taught him the instrumentality by which alone this could be effected. He demanded, first, a constitutional government; and second, a national system of education. Some have talked, as if these two — constitutionalism and the schoolmaster — were ideas of modern times. On the contrary, they are as old as the days of Knox.

On Knox’s principles we should have had as liberal a government and as free a people in the fifteenth century as we have in the nineteenth. He anticipated by one hundred and fifty years the liberties of the Revolution of 1688. His scheme of education, as developed in the First Book of Discipline, was higher in its literary aims, more complete in its machinery, and more extensive as regarded population, than any that has yet been offered to the nation’s acceptance. That his ideas were not fully realized was no fault of his.

The first part of his scheme was deferred for a century and a half by the wretched despotism of the Court. The second was partially defeated by the grasping avarice of the nobles, joined to the apathy of the people, nevertheless, the institutions which Knox planted, though crippled from these causes, have kept their hold of the soil, and proved vast blessings to his country.

The constitutionalism and the Presbyterianism, of which he was the first public expounder in the British Isles, have become the special mission of Britain, and wherever liberty and religion are reviving, whether in the new countries of Canada and Australia, or in the old states of Europe, they are reviving, speaking generally, upon the Scottish type, Knox’s obstructions were temporary: his work is eternal: his country will yet fulfil the great task he set her: and in the completion of the work of Knox lies the completion of that of Luther and Calvin, — the completion, in fact, of the Reformation itself. And the one beneficent, and surpassingly grand object of the Reformation, was to fill the earth with pure churches and free nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-wylie.html">James A. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Knox in idem (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

<blockquote><p>[T]hose that have condemned me (the whole rabble of the papistical clergy) have declined from the true faith, have given ear to deceivable spirits and to doctrine of devils, are the stars fallen from the heaven to earth, are fountains without water, and finally are enemies to Christ Jesus, deniers of His virtue and horrible blasphemers of His death and passion.

<blockquote><p>III. The third article [of difference between the Reformed and Lutherans] is that concerning predestination, which began to be controverted after Luther’s time, perhaps on the occasion of certain theologians who, asserting gratuitous predestination, sought out the mode and order of the signs of reason and of the divine acts perhaps more deeply than sacred Scripture, and than was fitting; and they use harsher forms of speaking. I plainly think that it can be explained in that mode and order according to the Scriptures, Augustine, and the article of our [Anglican] Church, as the late most reverend [John] Overall [d. 1619] explained it, so that I may easily hope that the more moderate Lutherans can be brought to our opinion, especially if they will not refuse to stand by Luther’s tenets in his book On the Bondage of the Will against Erasmus, and in his Annotations on the 9th chapter of Romans. From what has been said, it can be somewhat established that the Reformed Churches [including Lutherans] do not dissent in the fundamentals of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent</cite>, … ed. Seth Ward trans. AI (d. 1643; Gallibrand, 1658), pp. 152-53</span></figcaption>

<div class="actions"><button class="copy" data-copy="“III. The third article [of difference between the Reformed and Lutherans] is that concerning predestination, which began to be controverted after Luther’s time, perhaps on the occasion of certain theologians who, asserting gratuitous predestination, sought out the mode and order of the signs of reason and of the divine acts perhaps more deeply than sacred Scripture, and than was fitting; and they use harsher forms of speaking. I plainly think that it can be explained in that mode and order according to the Scriptures, Augustine, and the article of our [Anglican] Church, as the late most reverend [John] Overall [d. 1619] explained it, so that I may easily hope that the more moderate Lutherans can be brought to our opinion, especially if they will not refuse to stand by Luther’s tenets in his book On the Bondage of the Will against Erasmus, and in his Annotations on the 9th chapter of Romans. From what has been said, it can be somewhat established that the Reformed Churches [including Lutherans] do not dissent in the fundamentals of faith.”

aith" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

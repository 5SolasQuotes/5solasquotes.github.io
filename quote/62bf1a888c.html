<main class="wrap"><figure class="quote" id="q-62bf1a888c" data-kw="">
<blockquote><p>Q. 87. What is repentance unto life? A. Repentance unto life is a saving grace,[g] whereby a sinner, out of a true sense of his sin,[h] and apprehension of the mercy of God in Christ,[i] doth, with grief and hatred of his sin, turn from it unto God,[k] with full purpose of, and endeavour after, new obedience.[l] [g] Acts 11:18. [h] Acts 2:37,38. [i] Joel 2:12. Jer. 3:22. [k] Jer. 31:18,19. Ezek. 36:31. [l] 2 Cor. 7:11. Isa. 1:16,17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shorter Catechism</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dba5925b32" data-kw="">
<blockquote><p>If therefore you ask, Whether faith and repentance be by the Law, or by the Gospel, I answer: It is by both and that these must not be seperated one from the other in the command of these duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 27 in Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London: Young, 1647), pp. 260-63, p. 262</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>
<div class="actions"><button class="copy" data-copy="“If therefore you ask, Whether faith and repentance be by the Law, or by the Gospel, I answer: It is by both and that these must not be seperated one from the other in the command of these duties.”

</figure><figure class="quote" id="q-b964b3c608" data-kw="">
<blockquote><p>2. Repentance is the same thing as special effectual calling; So we 〈◊〉[take] not ‘calling’ in the most narrow sense of all: for the bare act of faith: only this difference there is: 1. The word ‘repentance’ does specially denote our motion from the terminus a quo [end from which], even that sinful state from which we turn, and which we repent of: yet including essentially also the state to which we turn. Whereas the word ‘vocation’ does principally express the state to which we are called. 2. Also the word ‘repentance’ does principally respect our turning to God from whom we fell: But the word ‘vocation’ does as much or more respect our coming to Christ the Mediator as the way to the Father. There is a twofold repentance: 1. One is our turning from a state of sin and misery, such as the unconverted are in, and this is it that we mean now as the same with conversion from the same state. 2. There is also a particular repentance, which is a turning from a particular sin, and this must be daily renewed while we live. Repentance signifies and contains two things: The first is a hearty sorrow that ever we sinned; The second is a change of the mind from that sin to God. Indeed the former is but part of the later: The changed mind is changed in this part, and manifests its change in a special manner, by remorse for former sins: Though all remorse is not from such a change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 7-8</span></figcaption>

</figure><figure class="quote" id="q-4cdb14dafa" data-kw="">
<blockquote><p>For Aquinas, a necessary condition for repentance is the recognition of a higher good the realization of which is frustrated by the action of which one repents (Of Evil, quest. 3, art. 13). He compares this to correcting an intellectual error by reasoning back to first principles (an example of which would be the law of non-contradiction). If one is correct about which principles are truly first, then rectifying the error is possible. But if one is incorrect about that, rectifying an error is far more difficult, because one will not have anything more fundamental to appeal to in order to correct one’s mistake about which principles are truly first. Similarly, if one correctly understands which ultimate end will conduce to human happiness, repentance of sin will be much easier than if one is wrong about the ultimate end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, (Editiones Scholastica, 2024), pt. 4, ch. 10, p. 481</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-a16ffa1ba6" data-kw="">
<blockquote><p>1st Problem: Whether natural man can use the light of nature (which some call the remnants of the divine image, good disposition, common or universal grace, first and preventing grace) so rightly that by that good use he can obtain greater grace, namely, evangelical and salvific grace? Response: So indeed the ancient and more recent Pelagians would have it, whose recooked error see in Johann Arnold Corvinus’s treatise against Tilenus, ch. 6. But we deny it, from Mt. 11:23 [11:25-27]; Ps. 147:19–20; Acts 14:16; and 10:6–7[?]; Eph. 2:12–13 with Titus 3:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

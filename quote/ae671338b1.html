<blockquote><p>XXIX. I do not deny, but that Christ in his death prayed for them that crucified him: But I deny that he prayed for all without exception, but for them alone who did it by ignorance; for he saith: Father forgive them, for they know not what they do, Luk. 23. 34. Whom a little after, as Saint Luke doth testify, were converted to the faith, Act. 2. and Chap. 3. 37. Doth not Christ say this with an humane affection, and not as the Redeemer? For, as he was man, he might wish well to those, whom as he was God, he knew were Reprobates: Thus he wept over the inhabitants of Jerusalem, the fall and rejection of which City, as he was God he had decreed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 28.29, pp 211-12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4334d34118" data-kw="">
<blockquote><p>Those who are strangers to prayer, their mercies are not mercies indeed to them. That threatening is fulfilled upon them, Malachi 2:2, “I will send a curse upon you, and I will curse your blessings.” Prayer will turn curses into blessing. Afflictions are part of the curse inflicted because of sin, but prayer alters the nature of them. For the sanctification of them being begged and granted, they work together for the good of them that feel them. Affliction yields “the peaceable fruits of righteousness to them that are exercised thereby,” says the Apostle.

On the other side, where prayer is not, blessings are a snare, and the good things which are received work together for the harm and ruin of those that do enjoy them. There is a spirit of slumber that has seized on them in the midst of their enjoyments. Their table, their plenty, their abundance becomes a snare “and a trap, and a stumbling block, and a recompense to them,” Romans 11:8, 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Prayer</cite>, (1677) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), pp 155-56.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><figure class="quote" id="q-fbc83b9ecc" data-kw="">
<blockquote><p>O Lord Jehovah, how little do we poor miserable mortals know of thy Supreme Deity, and incomprehensible perfections! how far short do our thoughts come about thee, who art infinite or immense in thy being, thy attributes, thy sovereignty over the creatures! what mortal can take upon him to set bounds to this thy sovereignty, where thou dost not lead the way!

Lord, we know that thou art indebted to none, and that there is none who can say to thee, what dost thou, or why dost thou so? That thou art also holy, and infinitely good, and therefore a lover and rewarder of holiness. May the consciousness of our ignorance in other things kindle in our hearts an ineffable desire of that beatific vision, by which, knowing as we are known, we may in the abyss of thy infinity behold those things which no thought of our at present can reach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank (1677; 2 vols, London, 1822), i, pp 81-82, 1.4.23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><figure class="quote" id="q-1846c90f07" data-kw="">
<blockquote><p>But here Austin moves this objection: if we must not use many words in prayer for that our heavenly father knows our want by the same reason, and for the same cause, we should not use few words, no not those which are here appointed by our Saviour Christ.

The answer is: that in regard of God, and for his cause, we need, neither many nor few, nor any words at all in prayer, neither doth the form of prayer consist in the repetition of words. For to pray is to lift up the mind unto God, to pour out the heart before God, &amp; to ask something of him: but no man doth truly ask any thing, which desireth not the same, and desire is an affection of the mind.

And therefore though he utter with his mouth the best words that can be, unless there be also a lifting up of the mind, with attention and devotion, so as the heart may truly desire that which he asketh, that man prayeth not indeed. But he that lifteth up his mind, and with a devout inward affection of heart, doth entirely ask any thing of God, that man doth truly pray, although he express not in words his desire.

One man cannot intreat another unless he use words or gesture: but the inward and most secret corners of the mind and heart are plainly seen of God, and therefore David saith, my groaning is not hid from thee, Psal. 38. v. 10. &amp; Psal. 10. v. 17. The Lord heareth the desire of the poor: thine ear harkeneth to the preparation of their heart. And Psal. 38.10. My whole desire is before thee. Rom. 8. v. 26. When we know not what to ask, the spirit it self maketh request for us, with sighs which cannot be expressed.

And it were a foolish thing, therefore to utter our prayer in words, as though God could not understand the desire of our heart. And yet the Saints of God in the old testament, and the Apostles in the new are said, to have used words in praying. Neither doth Christ without cause say thus, in Luke, [when ye pray, say] but it was for our sakes and for our prayers. Which is carefully to be considered, that we may learn to use vocal prayer well and profitably: for our mind doth not thoroughly consider and regard those things which we want, or are to aske, especially if they be spiritual, and pertain to the glory of God. And therefore the words which we use in praying, do by a kind of advertisement lead us to that consideration, that so the desire of our heart may be rightly informed.

Now the heart in prayer ought to be penitent and humble. But because we do for the most part rush upon this exercise of prayer, without due consideration of our sins and unworthiness: therefore the rehearsing of words is profitable, whereunto if the mind give heed, that we may pray with the Spirit and with the understanding also, 1. Cor. 1.15. then will the meditation thereof prepare the heart to serious repentance and to true humility. The desires of our heart are commonly out of order, so as oftentimes men neither think upon the order, nor on the end of those things they are to require: but the words which we use in prayer doe advertise us of those things we are to think upon when we pray.

And doubtless the rehearsing and meditation of God’s promises doth stir up, kindle, and increase our faith. We are often slow to prayer, and in praying cold and drowsy, neither do we come unto God with the devotion of mind we ought to do. But when as in praying we repeat the words, by diligent meditation thereon, and by due consideration of the promise and commandment, our mind is moved to lift up it self unto God, our devotion is kindled, and being once kindled is continued and increased.

Also the diligent marking of those things we are to ask, whereof we are put in mind by the words of our prayer, doth excite and kindle in our benumbed and frozen heart a good affection unto prayer. For those words, because they are the words of Christ, be the tool or instrument of the Spirit, whereby the Spirit of prayer will be powerful and effectual in us. And therefore that which Christ here delivereth [When we pray, SAY:] doth bind us so far forth as the rehearsal of words in praying is hereunto available, to excite, and kindle, to continue and increase our devotion, least it should wax cold and benumbed and be quenched altogether. And hereunto sometime longer prayers serve best, otherwise those which are shorter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), pp 9-13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

nd+the+desire+of+our+heart.+And+yet+the+Saints+of+God+in+the+old+testament%2C+and+the+Apostles+in+the+new+are+said%2C+to+have+used+words+in+praying.+Neither+doth+Christ+without+cause+say+thus%2C+in+Luke%2C+%5Bwhen+ye+pray%2C+say%5D+but+it+was+for+our+sakes+and+for+our+prayers.+Which+is+carefully+to+be+considered%2C+that+we+may+learn+to+use+vocal+prayer+well+and+profitably%3A+for+our+mind+doth+not+thoroughly+consider+and+regard+those+things+which+we+want%2C+or+are+to+aske%2C+especially+if+they+be+spiritual%2C+and+pertain+to+the+glory+of+God.+And+therefore+the+words+which+we+use+in+praying%2C+do+by+a+kind+of+advertisement+lead+us+to+that+consideration%2C+that+so+the+desire+of+our+heart+may+be+rightly+informed.%0A%0ANow+the+heart+in+prayer+ought+to+be+penitent+and+humble.+But+because+we+do+for+the+most+part+rush+upon+this+exercise+of+prayer%2C+without+due+consideration+of+our+sins+and+unworthiness%3A+therefore+the+rehearsing+of+words+is+profitable%2C+whereunto+if+the+mind+give+heed%2C+that+we+may+pray+with+the+Spirit+and+with+the+understanding+also%2C+1.+Cor.+1.15.+then+will+the+meditation+thereof+prepare+the+heart+to+serious+repentance+and+to+true+humility.+The+desires+of+our+heart+are+commonly+out+of+order%2C+so+as+oftentimes+men+neither+think+upon+the+order%2C+nor+on+the+end+of+those+things+they+are+to+require%3A+but+the+words+which+we+use+in+prayer+doe+advertise+us+of+those+things+we+are+to+think+upon+when+we+pray.%0A%0AAnd+doubtless+the+rehearsing+and+meditation+of+God%E2%80%99s+promises+doth+stir+up%2C+kindle%2C+and+increase+our+faith.+We+are+often+slow+to+prayer%2C+and+in+praying+cold+and+drowsy%2C+neither+do+we+come+unto+God+with+the+devotion+of+mind+we+ought+to+do.+But+when+as+in+praying+we+repeat+the+words%2C+by+diligent+meditation+thereon%2C+and+by+due+consideration+of+the+promise+and+commandment%2C+our+mind+is+moved+to+lift+up+it+self+unto+God%2C+our+devotion+is+kindled%2C+and+being+once+kindled+is+continued+and+increased.%0A%0AAlso+the+diligent+marking+of+those+things+we+are+to+ask%2C+whereof+we+are+put+in+mind+by+the+words+of+our+prayer%2C+doth+excite+and+kindle+in+our+benumbed+and+frozen+heart+a+good+affection+unto+prayer.+For+those+words%2C+because+they+are+the+words+of+Christ%2C+be+the+tool+or+instrument+of+the+Spirit%2C+whereby+the+Spirit+of+prayer+will+be+powerful+and+effectual+in+us.+And+therefore+that+which+Christ+here+delivereth+%5BWhen+we+pray%2C+SAY%3A%5D+doth+bind+us+so+far+forth+as+the+rehearsal+of+words+in+praying+is+hereunto+available%2C+to+excite%2C+and+kindle%2C+to+continue+and+increase+our+devotion%2C+least+it+should+wax+cold+and+benumbed+and+be+quenched+altogether.+And+hereunto+sometime+longer+prayers+serve+best%2C+otherwise+those+which+are+shorter.%E2%80%9D%0A%0A%E2%80%94+Martin+Chemnitz%2C+A+substantial+and+Godly+exposition+of+the+prayer+commonly+called+the+Lord%E2%80%99s+Prayer%2C+%28Cambridge%3A+John+Legate%2C+1598%29%2C+pp+9-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1846c90f07.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1846c90f07.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/10/12/martin-chemnitz-on-prayer-and-the-desires-of-our-hearts/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

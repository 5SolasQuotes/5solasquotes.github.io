<blockquote><p>…aims to defend the doctrine of the extra Calvinisticum… by arguing that it is logically coherent, biblically warranted, catholically orthodox, and theologically useful. It shows that none of the standard objections are devastating to the extra, that the doctrine is rooted in the claims of Christian Scripture and not merely a remnant of perfect being philosophical theology, and that the doctrine plays an important role in contemporary theological discussion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-r-gordon.html">James R. Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Holy One in Our Midst</cite>, (Fortress Press, 2016) 240 pp.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2815f4ead8" data-kw="">
<blockquote><p>Again, hereby all Popish corruptions and mixtures brought into this sacrament [of baptism] are confuted and condemned, as their cream, their tapers [candles], their crosses, their censers, their salt, their spittle, their holy-water, their exorcisings and conjurations, having also an opinion of salvation and worship annexed unto them… True it is, if all the other parts and actions be observed, these inventions and additions, which are so many abuses make not baptism void, neither bring a nullity therof…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments</cite>, … (London, 1606), Ch. 5, ‘Of the third outward part of baptism’, pp. 146-7</span></figcaption>

</figure><figure class="quote" id="q-3aa0c37dcc" data-kw="">
<blockquote><p>The communion, or supper of the Lord, is frequently to be celebrated; but how often, may be considered and determined by the ministers, and other church-governors of each congregation, as they shall find most convenient for the comfort and edification of the people committed to their charge. And, when it shall be administered, we judge it convenient to be done after the morning sermon… Where this sacrament cannot with convenience be frequently administered, it is requisite that publick warning be given the sabbath-day before the administration thereof: and that either then, or on some day of that week, something concerning that ordinance, and the due preparation thereunto, and participation thereof, be taught; that, by the diligent use of all means sanctified of God to that end, both in publick and private, all may come better prepared to that heavenly feast.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship</cite>, A key passage in the Directory is</span></figcaption>

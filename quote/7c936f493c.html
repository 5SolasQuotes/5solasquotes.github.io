<blockquote><p>38. There is no history that I have seen or heard that tells us of any Churches on earth that for many hundred years together did worship God without a liturgy as faulty as ours: To make them all idolaters and such whose worship God cursed and accepted not, is to make them no true Churches; and if Christ had no Church, He was no Head and King of it, and so no Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Much Impure Worship is much Better than what other Churches do</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2b43c99223" data-kw="">
<blockquote><p>Again, he [an episcopalian] argues we cannot be said to be members of a particular Church, or to hold communion with it, if we do not join in their worship, as it is established among them. This is easily answered by a plain distinction: unless we join in their established worship, as to the greatest and chief acts of it, conceditur [it is conceded]: as to all the parts of it, even to the least, negatur [I deny]. I may join with a Church in the Word and sacraments; and yet if they have a holy day or two beside the Sabbath, may forbear; yea I may, without this be a member of that Church (if they will suffer me), which all the Reformed Churches do, except the Episcopal Church of England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., p. 257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-44afb1d0a7" data-kw="">
<blockquote><p>Yet there was in those rites some manner of difference, not only between the first Passover celebrated in Egypt and the subsequent ones, but also between the primary Passover, which was ordinarily eaten in the month of Nisan on the fourteenth day, and the secondary one, which was celebrated in the second month on the fourteenth day, for the sake of those who were either unclean or absent in the prior month, because in the latter, the communicants were not bound to such an exact purging of all leaven, and also they conducted this feast for not but one day [instead of seven].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (1698; RHB), bk. 7, ch. 5, sect. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-f8353c8249" data-kw="">
<blockquote><p>The age is becoming luxurious and irreligious, and the luxury and music of the drawing-room are being transferred to the Church. Some good people foolishly imagine that because vital religion is all-important, divine order is quite immaterial. Family religion is neglected; the holy word of God is impiously decried; anarchy of all kinds is growing; intemperance, Sabbath-breaking, crime and pauperism, impurity, dishonesty, and frivolity, partly as the result of ecclesiastical disorganisation, are only too rife.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anarchy in Worship or Recent Innovations Contrasted with the Constitution of the Presbyterian Church and the Vows of Her Office-Bearers</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), p. 48.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bbf6d48ee" data-kw="">
<blockquote><p>The early Covenanter, James Durham, helps us to understand the true meaning of 1 Corinthians 11:2-16. We believe that this practice was among the variable circumstances of worship, common to human actions and societies, which are to be ordered by Christian prudence and the general rules of the Word (Westminster Confession 1:6). According to Durham, this was not a universal principle of regulated worship, but a custom-able sign:

ASSERTION ONE. For no offense whatsoever should men forbear a necessary duty, or commit anything which is materially sinful. Christ would needs go up to Jerusalem, although his disciples were displeased, and would continue in preaching the gospel, and in doing what was entrusted to him, although the Pharisees were offended (Matt. 15). This is clear, for no evil should be done that good may come of it (Rom. 3).

ASSERTION TWO. Yet in other things there ought to be great respect had to offense, and men ought to be swayed accordingly in their practice, as the former reasons clear. As (1.), if the matter is of light concernment in itself, as how men’s gestures are in their walking (suppose in walking softly, or quickly, with cloak or without) men ought to do, or abstain, as may prevent the construction of pride, lightness, etc., or give occasion to others in any of these. Of such sort was womens’ praying with their heads uncovered amongst the Corinthians, it being then taken for an evil sign. Yet if it is necessary, there is nothing little, as Moses will not leave a hoof (Exod. 10), or Mordecai bow his knee to Haman, because it looked like fawning on an accursed enemy. Of this sort also are offenses in the fashions of clothes, as some men’s wearing of ribbons, and such like, which being of small concernment, ought certainly to be regulated be offense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The dying man’s testament of the Church of Scotland or, A treatise concerning scandal</cite>, ed. Christopher Coldwell (1680; Dallas TX: Naphtali Press, 1990), pp 20-1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-2a8b5b753b" data-kw="">

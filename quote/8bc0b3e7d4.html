<main class="wrap"><figure class="quote" id="q-8bc0b3e7d4" data-kw="">
<blockquote><p>It is entirely by the intervention of Christ’s righteousness that we obtain justification before God. This is equivalent to saying that man is not just in himself, but that the righteousness of Christ is communicated to him by imputation, while he is strictly deserving of punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.23</span></figcaption>

</figure><figure class="quote" id="q-3e2d83e76c" data-kw="">
<blockquote><p>It never was the doctrine of the Reformation, or of the Lutheran and Calvinistic divines, that the imputation of righteousness affected the moral character of those concerned. It is true, whom God justifies he also sanctifies; but justification is not sanctification, and the imputation of righteousness is not the infusion of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted on X by @5Solas2</cite>, Oct 21, 2024</span></figcaption>

</figure><figure class="quote" id="q-4fcf1107c1" data-kw="">
<blockquote><p>Because all men be sinners and offenders against God, and breakers of His law and commandments, therefore can no man by His own acts, works, and deeds (seem they never so good) be justified, and made righteous before God: But every man of necessity is constrained to seek for another righteousness or justification, to be received at God’s own hands, that is to say, the forgiveness of his sins and trespasses, in such things as he hath offended. And this justification or righteousness, which we so receive of God’s mercy and Christ’s merits, embraced by faith, is taken, accepted, and allowed of God, for our perfect and full justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily of Salvation</cite>, First Book of Homilies, 1547</span></figcaption>

<blockquote><p>3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christs blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.</p></blockquote>

<blockquote><p>…there is a double beginning or cause of every gracious action in a man regenerate: 1. The Spirit of God by his exciting and cooperating grace. 2. Man himself renewed and sanctified in all his faculties. The former is termed principium a quo [the principle from which], the latter principium quod [the principle that]: man works, but he must be moved thereto and assisted by the Spirit of Grace: both together concur to the producing of every holy action. I say both together: for although man in his first conversion was merely passive, God’s Spirit working all without man’s help: yet man in performance of any holy act is not merely active, able to do all of himself without God’s help. No, he is partly passive, partly active: passive as he stands in need of God’s grace to stir up, guide, and strengthen the endeavor of each faculty in the doing of good: Active in as much as being thus helped by grace, himself willingly moves himself to every godly work. Now by reason of this concurrence of man with God, these operations of grace are properly called man’s work, not God’s work in man. So that when a regenerate man believes, this act though it be caused by Gods Spirit, yet it is done and exercised by Man voluntarily moving himself in that action, and therefore we say it is man that believes, not God’s Spirit that believes: as if the act of believing were wrought in man’s will by the Spirit of God in the same sort as jugglers work strange motions in their puppets, which seem to do wondrous feats, but tis an unseen hand that’s the cause of all. Such gross conceits should not have been devised by ingenuous minds and put upon so plain and clear doctrine as that is touching the concurrence of God’s grace with our strength in all holy actions whatsoever. The point is easy to him that will understand: Every good desire and good work is partly from man, because he wills it: he works it; but principally from God’s Spirit, because He makes man to will and to work it. Without which cooperating grace man by habitual inherent grace could do no good work at all, according to that of Christ, Jn. 15:5, ‘Without Me ye can do nothing,’ and of the apostle, Phil. 1:6, ‘He that hath begun the good work will also perform it;’ and again, Phil. 2:13, ‘It is God that worketh in you both the will and the deed, even of his good pleasure:’ and again, 1 Cor. 15:10, ‘I have labored more abundantly than they all, yet not I but the grace of God which is in me.’</p></blockquote>

e+as+that+is+touching+the+concurrence+of+God%E2%80%99s+grace+with+our+strength+in+all+holy+actions+whatsoever.+The+point+is+easy+to+him+that+will+understand%3A+Every+good+desire+and+good+work+is+partly+from+man%2C+because+he+wills+it%3A+he+works+it%3B+but+principally+from+God%E2%80%99s+Spirit%2C+because+He+makes+man+to+will+and+to+work+it.+Without+which+cooperating+grace+man+by+habitual+inherent+grace+could+do+no+good+work+at+all%2C+according+to+that+of+Christ%2C+Jn.+15%3A5%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+of+the+apostle%2C+Phil.+1%3A6%2C+%E2%80%98He+that+hath+begun+the+good+work+will+also+perform+it%3B%E2%80%99+and+again%2C+Phil.+2%3A13%2C+%E2%80%98It+is+God+that+worketh+in+you+both+the+will+and+the+deed%2C+even+of+his+good+pleasure%3A%E2%80%99+and+again%2C+1+Cor.+15%3A10%2C+%E2%80%98I+have+labored+more+abundantly+than+they+all%2C+yet+not+I+but+the+grace+of+God+which+is+in+me.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29+%7C+pp+147-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69d2bffe34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69d2bffe34.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=there%20is%20a%20double%20beginning%20or,of%20God%20which%20is%20in%20me&amp;text=there%20is%20a%20double%20beginning%20or%20cause%20of&amp;text=the%20grace%20of%20God%20which%20is%20in%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Assertion 2. The Gospel-love of Christ frees a captive from under the Law as a curser and delivers him over to the Law as to a pedagogue to lead him to Christ, and as to an instructor to rule and lead him when He is come to Christ. Love is the immediate and nearest lord; law the mediate and remote lord. Love bids the man do all for Christ; the law now of itself, because of our sinfulness, is a bitter and sour thing; but now the law is dipped in Christ’s Gospel-love and is sugared and honeyed, and evangelized with free grace and receives a new form from Christ and is become sweeter than the honey and the honeycomb to draw and persuade: and all the law is made a new commandment of love and a Gospel-yoke, sweet and easy; But still the law obliges justified men to obedience, not only for the matter of it, but for the supreme authority of the Lawgiver; now Christ, who came to fulfill, not to dissolve the law, does not remove this authority, but adds a new bond of obligation, from: [1.] the tie of Redemption in Jesus Christ, and we are freed from the curse of the Law. 2. the rigid exaction of obedience, every way perfect. 3. the seeking of life and justification by the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: J.D., 1647), pt. 3</cite>, p. 273</span></figcaption>

0Christ%20frees%20a&amp;text=seeking%20of%20life%20and%20justification%20by%20the%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>God is omnipotent, or God can do all things. That, things which imply a contradiction: as namely, for the same thing to be, and not to be; and impossibilities, as namely, for a man not to be a reasonable creature, and the like: fall not under the compass of omnipotency, is not from any defect (it is indeed from the perfection) of power in God; but from the impossibility of the things… So likewise that God cannot sin, lie, or deny Himself, is not from defect, but from the eminency of his power and absolute perfection, whence He is uncapable of being touched with any imperfection. … Perfection is God all-sufficient and all-excellent: not having need of anything, giving sufficience unto, and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite sea of all happiness. Perfection is increated glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word eminently taken in its strict and proper sense seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. Eminential continency and virtual continency (that is, for one thing to be contained in another eminently, as the excellency of the creature is in the Creator; or virtually, as all things saleable are in money, Eccl. 10:9) are not the same: the first is proper to the Creator, the second is found in the creature. The essential perfection of God is increated glory, eternal, always the same, from which nothing can be taken, to which nothing can be added. The acknowledgement of the manifested perfections of God, is glorification: viz. The act of the creature done in time, admitting more or less according as God is known or acknowledged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 19-20</span></figcaption>

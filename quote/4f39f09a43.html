<main class="wrap"><figure class="quote" id="q-4f39f09a43" data-kw="">
<blockquote><p>Question 9: How is it that you have taken away widows, which was an office established by the apostles? Rom. 12:8. For some say they should be gone, because they were temporary, and the heat of the Eastern countries which caused sickness, required them; but they are not needful now. So says [Thomas] Cartwright. Others make them perpetual, as Fenner; some make them to be women, as Cartwright, some men, as [Walter] Travers, some neither men nor women only, as Beza and Junius. Answer: The perpetual use of that office we think continues, that is, that there be some to show mercy on the poor, which are captives, exiled, strangers, diseased, distracted, and that there be hospitals for that effect, and surgeons, physicians, aged men and women; But that widows were officers in the Church, as elders and deacons are, we think no; but that that service may be performed by men or women, as the Church shall think good. Cartwright thinks no other than what I say. Fenner thinks well that the sick should always be cared for, neither by men only, nor by women only, as Beza and Junius think, but by both as need requires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 19, pp. 293-4</span></figcaption>

</figure><figure class="quote" id="q-a57c628b10" data-kw="">
<blockquote><p>After he [Cartwright’s opponent] says that ‘those words cannot be extended unto all the precepts,’ first because, ‘the office of widows should be then necessary:’ But he does not consider that St. Paul ordains them not simply, but upon condition. If he [Paul] had instituted the eldership with condition, if he had ordained that office [of elder] rather for the maintenance of the persons themselves than for the service of the church, if he had left so small choice of those to this office, as to that, namely that none might be chosen but poor, none but destitute of all friends, none under the age of sixty years: then he [the opponent] had said somewhat. And even now the perpetuity of that commandment touching widows remains in that sort [as] it was given: that is upon condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, (1577), ‘That the Church Government by an Eldership in Every Congregation is by the Ordinance of God &amp; Perpetual’, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<blockquote><p>‘Rebuke not an Elder.’ Do not handle him roughly, and as it were strike him, as the Greek word signifies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Tim</cite>, 5:1</span></figcaption>

— Edward Leigh, Annotations on 1 Tim., 5:1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Rebuke+not+an+Elder.%E2%80%99+Do+not+handle+him+roughly%2C+and+as+it+were+strike+him%2C+as+the+Greek+word+signifies.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+Annotations+on+1+Tim.%2C+5%3A1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd49208dd79.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d49208dd79.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=Rebuke%20not%20an%20Elder.%E2%80%99%20Do%20not,him%2C%20as%20the%20Greek%20word%20signifies&amp;text=Rebuke%20not%20an%20Elder.%E2%80%99%20Do%20not%20handle%20him&amp;text=were%20strike%20him%2C%20as%20the%20Greek%20word%20signifies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0b42a848a4" data-kw="">
<blockquote><p>As for the maintenance and the continuance of the office of ruling elders, we love not unnecessary multiplication of questions, let every Church do herein what they find most convenient. The manner of our Church in these things is such as best befits the condition of the same, and such as cannot be in reason condemned; Neither is a stipend, nor continuance in the function till death, essential to the ministry of the Church, but separable from the same. The Levites of old served not at all times, but by course, and when they were 50 years old, they were wholly liberat[ed], from the burden and labor (though not from the attendance) of the Levitical service; and ministers may still upon the Church’s permission, for lawful reasons and urgent necessities, be absent a whole year, and longer too, from their particular charges. The apostles, when they were first sent through Judea, took no stipend, Mt. 10:8-9. Neither did Paul take any at Corinth, 1 Cor. 9:18. The ministers among the Waldenses work with their hands for their maintenance. The old patriarchs were priests and preachers to their families, and maintained themselves by the work of their hands, feeding of flocks, tilling the ground, etc. These things I do not mention as rules, to be followed by us, but to show, that the intermission of the exercise of the ministry, the want of maintainance and laboring with the hands, are not altogether repugnant, nor inconsistent with the nature of the vocation of the ministers of the Word, but in some cases hic &amp; nunc [here and now], may be most approveable in them: much more in ruling elders. The revenues of our Church are so small that they cannot spare stipends to ruling elders, which makes them willing to serve without stipends; and lest they should be overburdened with this their service, though they be chosen and called to be ruling elders as long as they live, at least till they merit to be deposed, yet our book of policy [Second Book of Discipline] allows them that ease of intermission and serving by course which was allowed to the Levites of old in the Temple. The double honor which the apostle commands to give unto elders that rule well, 1 Tim. 5:17, needs not to be expounded of maintenance and obedience; for by double honor we may either simply understand much honor, or by way of comparison double honor in respect of the widows, whom he had before commanded to honor, 1 Tim. 5:3, as Calvin expounds the place. Both these interpretations does Oecumenius give upon the same place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, … (Edinburgh, 1641), pt, 1, ch. 14, pp. 104-6</span></figcaption>

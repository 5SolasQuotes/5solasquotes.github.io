<main class="wrap"><figure class="quote" id="q-5345e00844" data-kw="">
<blockquote><p>It is divine law, jure divino, both by nature and Scripture, for the stronger to relinquish rights and privileges for the here and now to help the weaker, for the greater good (Ps. 40:6–8; Mt. 5:38–48; Mk. 15:3–5; Jn. 10:15–17; 1 Cor. 6:4–8; 9:4–23; Eph. 5:25–26; Phil. 2:6–9; 1 Pet. 2:19–25; WLC 99.5), especially when called by Christ to do so (Mt. 28:18–20; Acts 9:15–16). Ought not the stronger and more excellent parts of the body, rather than ignoring or forsaking the weaker and less comely parts, unite with, serve and benefit them, covering them over with greater honor, as we ourselves do and God does (1 Cor. 12:23–24), “that there should be no schism in the body”? (1 Cor. 12:25)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b50da99f93" data-kw="">
<blockquote><p>To be precise, if we may consider frankly the actual system of virtue which Aristotle proposes, by which alone access to happiness is acquired, we will see that it is an arrogant supposition peddling the mere shadow of virtue, rather than that disposition of mind which comports with the human condition and its dependency on the most high God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologoumena Pantodapa</cite>, tr. Dr. David C. Noe</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-21d7debf01" data-kw="">
<blockquote><p>Besides, arguments drawn from scandal in things neither unlawful nor (setting the reason of scandal aside) inexpedient, as they are subject to sundry frailties otherwise, so they are manifestly of no weight at all when they are counterpoised with the apparent danger of evil consequents on the other side. For in such cases there is commonly equal danger (if not rather something more) of scandal to be taken from the example the quite contrary way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop Sanderson’s Judgment concerning Submission to Usurpers</cite>, (d. 1663; London, 1678), pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-46c286a640" data-kw="">
<blockquote><p>If superiors command that which is above their sphere to command, namely, things not necessary in genere [in their kind], yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.</p></blockquote>

<blockquote><p>[226] The special qualification of the second person in the Trinity is filiation. In Scripture he bears several names that denote his relation to the Father, such as word, wisdom, logos, son, the firstborn, only-begotten and only son, the image of God, image (εἱκων), substance (ὑποστασις), stamp (χαρακτηρ) [cf. Heb. 1:3]. The doctrine of “eternal generation” (αἰωνος γεννησις), so called for the first time by Origen, was based on these names and a few texts cited above. In using these terms we are of course speaking in a human and hence an imperfect language, a fact that makes us cautious. Yet we have the right to speak this language. For just as the Bible speaks analogically of God’s ear, eye, and mouth, so human generation is an analogy and image of the divine deed by which the Father gives the Son “to have life in himself.” But when we resort to this imagery, we must be careful to remove all associations with imperfection and sensuality from it. The generation of a human being is imperfect and flawed. A husband needs a wife to bring forth a son. No man can ever fully impart his image, his whole nature, to a child or even to many children. A man becomes a father only in the course of time and then stops being a father, and a child soon becomes wholly independent from and self-reliant vis-à-vis his or her father. But it is not so with God. Generation occurs also in the divine being. God’s fecundity is a beautiful theme, one that frequently recurs in the church fathers. God is no abstract, fixed, monadic, solitary substance, but a plenitude of life. It is his nature (οὐσια) to be generative (γεννητικη) and fruitful (καρπογονος). It is capable of expansion, unfolding, and communication. Those who deny this fecund productivity fail to take seriously the fact that God is an infinite fullness of blessed life. All such people have left is an abstract deistic concept of God, or to compensate for this sterility, in pantheistic fashion they include the life of the world in the divine being. Apart from the Trinity even the act of creation becomes inconceivable. For if God cannot communicate himself, he is a darkened light, a dry spring, unable to exert himself outward to communicate himself to creatures. Still, that generation is to be conceived in divine terms. In the first place, it is spiritual The Arians, in opposing the idea of divine generation, objected that all generation necessarily brings along with it separation (τομη) and division (διαιρεσις), passion (παθος) and emanation (ἀπορροια). And that would be correct if it were physical, sensual, and creaturely. But it is spiritual, divine, and therefore simple, without division (ἀρρευστως) or separation (ἀδιαιρετως). It occurs without flux and division. While giving rise to distinction and distribution in the divine being, it does not create divergence and division. Athanasius writes: “Inasmuch as God is simple, the Father of the Son is indivisible and without passion, for although in the case of humans we speak of outflow and inflow, we cannot predicate these things of anything that is incorporeal.”120 The most striking analogy of divine generation is thought and speech, and Scripture itself suggests this when it calls the Son “Logos” [Speech, Word, Reason]. Just as the human mind objectivizes itself in speech, so God expresses his entire being in the Logos [Christ]. But here, too, we must note the difference. Humans need many words to express their ideas. These words are sounds and therefore material, sense-related. They have no existence by themselves. But when God speaks, he totally expresses himself in the one person of the Logos, whom he also “granted to have life in himself” (John 5:26 NIV). In the second place, therefore, divine generation implies that the Father begets the Son out of the being of the Father, “God of God, Light of Light, very God of very God; begotten, not made, being of one substance with the Father,” as the Nicene symbol has it. The Arians, by contrast, contended that the Son had been brought forth by the will of the Father out of nothing. This, however, is not generation but creation, as John of Damascus points out. Creation is “the bringing into being, from the outside and not from the substance of the Creator, of something created and made entirely dissimilar [in substance],” while “begetting” means “producing of the substance of the begetter an offspring similar in substance to the begetter.” The Son is not a creature but he is “God over all, forever praised!” (Rom. 9:5 NIV). Accordingly, he was not brought forth by the will of the Father out of nothing and in time. Rather, he is generated out of the being of the Father in eternity. Hence, instead of viewing “generation” as an actual work, a performance (ἐνεργεια), of the Father, we should ascribe to the Father “a generative nature” (φυσις γεννητικη). This is not to say, of course, that the generation is an unconscious and unwilled emanation, occurring apart from the will and power of the Father. It is not an act of an antecedent decreeing will, like creation, but one that is so divinely natural to the Father that his concomitant will takes perfect delight in it. It is a manifestation of what is truly expressive of his nature and essence, and therefore also of his knowledge, will, and power, in fact of all his virtues. In the third place, therefore, the church confesses its belief in the eternal character of this generation. The Arians said that there was a time when the Son did not exist (ἠν ποτε ὁτε οὐκ ἠν). They appealed especially to the words “he brought me forth,” or “created me” in Proverbs 8:22, and pointed out the antinomy between the terms “eternal” (αἰωνος) and “begetting” (γεννησις). But if the “Father” and the “Son” bear their names in a metaphysical sense, as Scripture incontrovertibly teaches, it follows that the generation in question has to be eternal as well. For if the Son is not eternal, then of course God is not the eternal Father either. In that case he was God before he was Father, and only later—in time—became Father. Hence, rejection of the eternal generation of the Son involves not only a failure to do justice to the deity of the Son, but also to that of the Father. It makes him changeable, robs him of his divine nature, deprives him of the eternity of his fatherhood, and leaves unexplained how God can truly and properly be called “Father” in time if the basis for calling him “Father” is not eternally present in his nature. We must, accordingly, conceive that generation as being eternal in the true sense of the word. It is not something that was completed and finished at some point in eternity, but an eternal unchanging act of God, at once always complete and eternally ongoing. Just as it is natural for the sun to shine and for a spring to pour out water, so it is natural for the Father to generate the Son. The Father is not and never was ungenerative; he begets everlastingly. “The Father did not by a single act beget the Son and then release him from his ‘genesis,’ but generates him perpetually.” For God to beget is to speak, and his speaking is eternal. God’s offspring is eternal.</p></blockquote>

tflow+and+inflow%2C+we+cannot+predicate+these+things+of+anything+that+is+incorporeal.%E2%80%9D120+The+most+striking+analogy+of+divine+generation+is+thought+and+speech%2C+and+Scripture+itself+suggests+this+when+it+calls+the+Son+%E2%80%9CLogos%E2%80%9D+%5BSpeech%2C+Word%2C+Reason%5D.+Just+as+the+human+mind+objectivizes+itself+in+speech%2C+so+God+expresses+his+entire+being+in+the+Logos+%5BChrist%5D.+But+here%2C+too%2C+we+must+note+the+difference.+Humans+need+many+words+to+express+their+ideas.+These+words+are+sounds+and+therefore+material%2C+sense-related.+They+have+no+existence+by+themselves.+But+when+God+speaks%2C+he+totally+expresses+himself+in+the+one+person+of+the+Logos%2C+whom+he+also+%E2%80%9Cgranted+to+have+life+in+himself%E2%80%9D+%28John+5%3A26+NIV%29.+In+the+second+place%2C+therefore%2C+divine+generation+implies+that+the+Father+begets+the+Son+out+of+the+being+of+the+Father%2C+%E2%80%9CGod+of+God%2C+Light+of+Light%2C+very+God+of+very+God%3B+begotten%2C+not+made%2C+being+of+one+substance+with+the+Father%2C%E2%80%9D+as+the+Nicene+symbol+has+it.+The+Arians%2C+by+contrast%2C+contended+that+the+Son+had+been+brought+forth+by+the+will+of+the+Father+out+of+nothing.+This%2C+however%2C+is+not+generation+but+creation%2C+as+John+of+Damascus+points+out.+Creation+is+%E2%80%9Cthe+bringing+into+being%2C+from+the+outside+and+not+from+the+substance+of+the+Creator%2C+of+something+created+and+made+entirely+dissimilar+%5Bin+substance%5D%2C%E2%80%9D+while+%E2%80%9Cbegetting%E2%80%9D+means+%E2%80%9Cproducing+of+the+substance+of+the+begetter+an+offspring+similar+in+substance+to+the+begetter.%E2%80%9D+The+Son+is+not+a+creature+but+he+is+%E2%80%9CGod+over+all%2C+forever+praised%21%E2%80%9D+%28Rom.+9%3A5+NIV%29.+Accordingly%2C+he+was+not+brought+forth+by+the+will+of+the+Father+out+of+nothing+and+in+time.+Rather%2C+he+is+generated+out+of+the+being+of+the+Father+in+eternity.+Hence%2C+instead+of+viewing+%E2%80%9Cgeneration%E2%80%9D+as+an+actual+work%2C+a+performance+%28%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%CE%B5%CE%B9%CE%B1%29%2C+of+the+Father%2C+we+should+ascribe+to+the+Father+%E2%80%9Ca+generative+nature%E2%80%9D+%28%CF%86%CF%85%CF%83%CE%B9%CF%82+%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%84%CE%B9%CE%BA%CE%B7%29.+This+is+not+to+say%2C+of+course%2C+that+the+generation+is+an+unconscious+and+unwilled+emanation%2C+occurring+apart+from+the+will+and+power+of+the+Father.+It+is+not+an+act+of+an+antecedent+decreeing+will%2C+like+creation%2C+but+one+that+is+so+divinely+natural+to+the+Father+that+his+concomitant+will+takes+perfect+delight+in+it.+It+is+a+manifestation+of+what+is+truly+expressive+of+his+nature+and+essence%2C+and+therefore+also+of+his+knowledge%2C+will%2C+and+power%2C+in+fact+of+all+his+virtues.+In+the+third+place%2C+therefore%2C+the+church+confesses+its+belief+in+the+eternal+character+of+this+generation.+The+Arians+said+that+there+was+a+time+when+the+Son+did+not+exist+%28%E1%BC%A0%CE%BD+%CF%80%CE%BF%CF%84%CE%B5+%E1%BD%81%CF%84%CE%B5+%CE%BF%E1%BD%90%CE%BA+%E1%BC%A0%CE%BD%29.+They+appealed+especially+to+the+words+%E2%80%9Che+brought+me+forth%2C%E2%80%9D+or+%E2%80%9Ccreated+me%E2%80%9D+in+Proverbs+8%3A22%2C+and+pointed+out+the+antinomy+between+the+terms+%E2%80%9Ceternal%E2%80%9D+%28%CE%B1%E1%BC%B0%CF%89%CE%BD%CE%BF%CF%82%29+and+%E2%80%9Cbegetting%E2%80%9D+%28%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%83%CE%B9%CF%82%29.+But+if+the+%E2%80%9CFather%E2%80%9D+and+the+%E2%80%9CSon%E2%80%9D+bear+their+names+in+a+metaphysical+sense%2C+as+Scripture+incontrovertibly+teaches%2C+it+follows+that+the+generation+in+question+has+to+be+eternal+as+well.+For+if+the+Son+is+not+eternal%2C+then+of+course+God+is+not+the+eternal+Father+either.+In+that+case+he+was+God+before+he+was+Father%2C+and+only+later%E2%80%94in+time%E2%80%94became+Father.+Hence%2C+rejection+of+the+eternal+generation+of+the+Son+involves+not+only+a+failure+to+do+justice+to+the+deity+of+the+Son%2C+but+also+to+that+of+the+Father.+It+makes+him+changeable%2C+robs+him+of+his+divine+nature%2C+deprives+him+of+the+eternity+of+his+fatherhood%2C+and+leaves+unexplained+how+God+can+truly+and+properly+be+called+%E2%80%9CFather%E2%80%9D+in+time+if+the+basis+for+calling+him+%E2%80%9CFather%E2%80%9D+is+not+eternally+present+in+his+nature.+We+must%2C+accordingly%2C+conceive+that+generation+as+being+eternal+in+the+true+sense+of+the+word.+It+is+not+something+that+was+completed+and+finished+at+some+point+in+eternity%2C+but+an+eternal+unchanging+act+of+God%2C+at+once+always+complete+and+eternally+ongoing.+Just+as+it+is+natural+for+the+sun+to+shine+and+for+a+spring+to+pour+out+water%2C+so+it+is+natural+for+the+Father+to+generate+the+Son.+The+Father+is+not+and+never+was+ungenerative%3B+he+begets+everlastingly.+%E2%80%9CThe+Father+did+not+by+a+single+act+beget+the+Son+and+then+release+him+from+his+%E2%80%98genesis%2C%E2%80%99+but+generates+him+perpetually.%E2%80%9D+For+God+to+beget+is+to+speak%2C+and+his+speaking+is+eternal.+God%E2%80%99s+offspring+is+eternal.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+transl.+John+Bolt%2C+and+John+Vriend+%28Grand+Rapids%2C+MI%3A+Baker+Academic%2C+2004%29%2C+2.308%E2%80%93310.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb6cb6008b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb6cb6008b.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/08/bavinck-on-eternal-generation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3292520bce" data-kw="one God Deuteronomy Trinity">

<blockquote><p>The fair inference from the Apostle’s words is, that there is a proper subsistence (hypostasis) of the Father, which shines refulgent in the Son. From this, again it is easy to infer that there is a subsistence (hypostasis) of the Son which distinguishes him from the Father. The same holds in the case of the Holy Spirit; for we will immediately prove both that he is God, and that he has a separate subsistence from the Father. This, moreover, is not a distinction of essence, which it were impious to multiply.</p></blockquote>

<blockquote><p>71. Fourthly, they [Romanists] accuse us of blasphemy against the Son of God, for denying (as they say) that He is Deus ex Deo, God of God: against the doctrine of the Nicene Creed; and this they call the atheism of Calvin and Beza: a palpable slander: for neither Calvin nor Beza did ever imagine, much less utter the same in that sense which they lay to their charges: for let [Robert] Bellarmine their sworn adversary speak for them: ‘Calvin and Beza teach’ (says he) ‘that the Son is of Himself in respect of his essence, but not in respect of his Person, and they seem to say that the essence of the Deity in Christ is not begotten, but is of itself: which opinion’ (says he) ‘I see not why it may not be called Catholic.’ Here Bellarmine tells us truly what their opinion was, and does acknowledge it to be a true catholic doctrine: and yet in the same chapter he contemns Calvin for his manner of speaking of it and of intolerable sauciness for finding fault with the harshness of the phrase used by the Nicene Council, ‘God of God: Light of light’. Mark (I pray you) his absurdity, it is catholic, and yet it may not be spoken: it is true, and yet it is to be blamed. May not a catholic doctrine be spoken then? or must the truth be smothered? This is such an inconsequence as neither reason nor religion can any ways bear withal: and for his saucy dealing with the Nicene Council, all that ever he says is, that it is durum dictum, ‘a hard phrase’: yet so that he confesses it may receive a good and commodious interpretation if it be understood in the concrete, that Christ who is God, is of the Father that is God: the word being taken personally, and not in the abstract; as if the essence of the Deity of the Son should be from the Father, which is entirely subsisting, in, of, and by its own eternal, incomprehensible, and most glorious nature: and this without question was the true intendement of the Council; for else it had not confuted, but favored the blasphemous heresy of Arius, against whom it was assembled, which Calvin and Beza do not anyways cross, but onely bring unto it a fit and fauourable exposition. Thus we have Bellarmine, Calvin’s and Beza’s patron in this doctrine, though full ill against his will: and not only him, but Ribera and Gregory de Valentia, two other no mean Rabbies, both which do conclude that: ‘the Son as He is a Person, is of another; but as He is a simple ens [being], is not of another: and that the essence does not beget the essence, but the Father the Son;’ so that either they are slanderers of the truth, or their catholic doctrines may be atheism and blasphemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beard.html">Thomas Beard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retractive from the Romish Religion… (London, 1616), Motive 12</cite>, pp. 469-70</span></figcaption>

nd+not+in+the+abstract%3B+as+if+the+essence+of+the+Deity+of+the+Son+should+be+from+the+Father%2C+which+is+entirely+subsisting%2C+in%2C+of%2C+and+by+its+own+eternal%2C+incomprehensible%2C+and+most+glorious+nature%3A+and+this+without+question+was+the+true+intendement+of+the+Council%3B+for+else+it+had+not+confuted%2C+but+favored+the+blasphemous+heresy+of+Arius%2C+against+whom+it+was+assembled%2C+which+Calvin+and+Beza+do+not+anyways+cross%2C+but+onely+bring+unto+it+a+fit+and+fauourable+exposition.+Thus+we+have+Bellarmine%2C+Calvin%E2%80%99s+and+Beza%E2%80%99s+patron+in+this+doctrine%2C+though+full+ill+against+his+will%3A+and+not+only+him%2C+but+Ribera+and+Gregory+de+Valentia%2C+two+other+no+mean+Rabbies%2C+both+which+do+conclude+that%3A+%E2%80%98the+Son+as+He+is+a+Person%2C+is+of+another%3B+but+as+He+is+a+simple+ens+%5Bbeing%5D%2C+is+not+of+another%3A+and+that+the+essence+does+not+beget+the+essence%2C+but+the+Father+the+Son%3B%E2%80%99+so+that+either+they+are+slanderers+of+the+truth%2C+or+their+catholic+doctrines+may+be+atheism+and+blasphemy.%E2%80%9D%0A%0A%E2%80%94+Thomas+Beard%2C+A+Retractive+from+the+Romish+Religion%E2%80%A6+%28London%2C+1616%29%2C+Motive+12%2C+pp.+469-70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff48151ccb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f48151ccb9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-trinity#:~:text=71.%20Fourthly%2C%20they%20%5BRomanists%5D%20accuse%20us,doctrines%20may%20be%20atheism%20and%20blasphemy&amp;text=71.%20Fourthly%2C%20they%20%5BRomanists%5D%20accuse%20us%20of%20blasphemy&amp;text=their%20catholic%20doctrines%20may%20be%20atheism%20and%20blasphemy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Why is the Son so called? Answer. Because He was begotten of the Father by a perfect and eternal generation, not to be uttered of man or conceived. And we must be warned not to conceive it in any carnal or human manner. For an earthly father is in time before his son, and the son after. But God the Father and the Son are coeternal, and not one before or after the other for time. An earthly father is forth of [i.e., separate from] the son, and the son forth of the father. But God the Father is in the Son, and the Son in the Father. An earthly child is from his father by propagation, but the Son is from the heavenly Father not by propagation, but by communication of substance. Lastly, the heavenly Father begets the Son by communication of His whole substance, and so does no earthly father.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-441a0030a2" data-kw="Trinity fundamental worship">
<blockquote><p>God has revealed himself as one in essence, three in persons (viz., the Father, the Son, and the Holy Spirit). Thus he who does not acknowledge and believe the Trinity has not the true God, but has erected for himself an idol in place of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.24.8</span></figcaption>

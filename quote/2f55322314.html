<main class="wrap"><figure class="quote" id="q-2f55322314" data-kw="">
<blockquote><p>But that all doubt may be better cleared away, this principle should ever be kept in mind, that baptism is not conferred on children in order that they may become sons and heirs of God, but, because they are already considered by God as occupying that place and rank, the grace of adoption is sealed in their flesh by the rite of baptism. Otherwise the Anabaptists are in the right in excluding them from baptism. For unless the thing signified by the external sign can be predicated of them, it will be a mere profanation to call them to a participation of the sign itself. But if any one were inclined to refuse them baptism, we have a ready answer; they are already of the flock of Christ, of the family of God, since the covenant of salvation which God enters into with believers is common also to their children. As the words import ‘I will be thy God and the God of thy seed after thee.’ Unless this promise had preceded, certainly it would have been wrong to confer on them baptism. Now I ask whether the Word of God is sufficient by its intrinsic value for our salvation, or whether some aid must be borrowed elsewhere to supply its defect, or help its infirmity? If this promise is not believed to be efficacious in itself, not only the virtue of God, but also his grace and truth will be attached to the external sign. Thus those men, while they strive to honor baptism, cast serious ignominy on God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 438–To John Clauburger in Letters of John Calvin</cite>, ed. Bonnet (Philadelphia: Presbyterian Board of Publication, 1858), vol. 3, pp. 282-283</span></figcaption>

</figure><figure class="quote" id="q-cf024ff49e" data-kw="">
<blockquote><p>By Baptism… we are received solemnly into the visible Church; and Baptism is a seal of our entry into Christ’s visible Body, as swearing to the colors enters a soldier a member to the army; and, we teach not that Baptism constitutes the Church-visible simply, as the Church: its a seal of a visible profession.</p></blockquote>

</figure><figure class="quote" id="q-14dc9f6d20" data-kw="">
<blockquote><p>But where I added, that in the name of Jesus Christ we baptize, though I said no more than the Scripture says [i.e. Acts 2:38; 8:12,16; 19:5], yet he [Mr. Hussey] is pleased to object against me… I cited plain texts to prove that baptism is done in the name of Christ… But how does baptizing in the name of Christ, as Mediator, agree with the commission to baptize in the name of the Father, Son and Holy Ghost?… First, I say, the question is of things or actions, not of words. Mr. Hussey (it seems) did apprehend my meaning, as if I had intended an expression to be made in the act of baptizing, thus: ‘I baptize thee in the name of Jesus Christ.’ But [on the contrary] I speak of the action, not of the expression, even as in another instance I gave: our assembling together is in the name of Christ, though we do not say in terminis [in the very terms], ‘We are now assembled in the name of Christ.’ In baptism Christ does not command us to say either these words, ‘I baptize thee in the name of Christ;’ or these, ‘I baptize thee in the name of the Father, Son and Holy Ghost:’ but we are commanded to do the thing, both in the name of Christ as Mediator, and in the name of the Father, Son and Holy Ghost; but in different respects. A minister of Christ does both preach and baptize in the name of Christ, as Mediator; that is, vice Christi, in Christ’s stead [see 2 Cor. 5:20], and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our commission to preach and baptize, by Mr. Hussey’s confession. So that to preach and baptize epi to onomati Iesou Christou [in the name of Jesus Christ] (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38), comprehends a formal commission, power and authority, given and derived from Christ. I say not that it comprehends no more, but this it does comprehend. But when Christ bids us baptize eis ta onoma, ‘unto’, or ‘into’, or ‘in the name’ of the Father, Son and Holy Ghost, Mt. 28:19, this does relate to the end and effect of baptism, or the good of the baptized (if we understand the words properly), not the authority of the baptizer, as if a formal commission were there given him from the Father, Son and Holy Ghost. So that to baptize on ‘in’ or ‘unto’ the name of the Father, Son and Holy Ghost, is properly meant both of sealing the parties’ right and title to the enjoyment of God Himself, as their God by covenant, and their interest in the love of God, the grace of Christ, and of the communion of the Holy Ghost; and of dedicating the party to the knowledge, profession, faith, love, and obedience of God the Father, Son and Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, p. 110-111</span></figcaption>

— George Gillespie, Aaron’s Rod Blossoming, p. 110-111">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+where+I+added%2C+that+in+the+name+of+Jesus+Christ+we+baptize%2C+though+I+said+no+more+than+the+Scripture+says+%5Bi.e.+Acts+2%3A38%3B+8%3A12%2C16%3B+19%3A5%5D%2C+yet+he+%5BMr.+Hussey%5D+is+pleased+to+object+against+me%E2%80%A6+I+cited+plain+texts+to+prove+that+baptism+is+done+in+the+name+of+Christ%E2%80%A6+But+how+does+baptizing+in+the+name+of+Christ%2C+as+Mediator%2C+agree+with+the+commission+to+baptize+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3F%E2%80%A6+First%2C+I+say%2C+the+question+is+of+things+or+actions%2C+not+of+words.+Mr.+Hussey+%28it+seems%29+did+apprehend+my+meaning%2C+as+if+I+had+intended+an+expression+to+be+made+in+the+act+of+baptizing%2C+thus%3A+%E2%80%98I+baptize+thee+in+the+name+of+Jesus+Christ.%E2%80%99+But+%5Bon+the+contrary%5D+I+speak+of+the+action%2C+not+of+the+expression%2C+even+as+in+another+instance+I+gave%3A+our+assembling+together+is+in+the+name+of+Christ%2C+though+we+do+not+say+in+terminis+%5Bin+the+very+terms%5D%2C+%E2%80%98We+are+now+assembled+in+the+name+of+Christ.%E2%80%99+In+baptism+Christ+does+not+command+us+to+say+either+these+words%2C+%E2%80%98I+baptize+thee+in+the+name+of+Christ%3B%E2%80%99+or+these%2C+%E2%80%98I+baptize+thee+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3A%E2%80%99+but+we+are+commanded+to+do+the+thing%2C+both+in+the+name+of+Christ+as+Mediator%2C+and+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3B+but+in+different+respects.+A+minister+of+Christ+does+both+preach+and+baptize+in+the+name+of+Christ%2C+as+Mediator%3B+that+is%2C+vice+Christi%2C+in+Christ%E2%80%99s+stead+%5Bsee+2+Cor.+5%3A20%5D%2C+and+having+authority+for+that+effect+from+Christ%2C+as+Mediator%3B+for+Christ%2C+as+Mediator%2C+gave+us+our+commission+to+preach+and+baptize%2C+by+Mr.+Hussey%E2%80%99s+confession.+So+that+to+preach+and+baptize+epi+to+onomati+Iesou+Christou+%5Bin+the+name+of+Jesus+Christ%5D+%28which+we+find+both+of+preaching%2C+Lk.+24%3A47%2C+and+of+baptizing%2C+Acts+2%3A38%29%2C+comprehends+a+formal+commission%2C+power+and+authority%2C+given+and+derived+from+Christ.+I+say+not+that+it+comprehends+no+more%2C+but+this+it+does+comprehend.+But+when+Christ+bids+us+baptize+eis+ta+onoma%2C+%E2%80%98unto%E2%80%99%2C+or+%E2%80%98into%E2%80%99%2C+or+%E2%80%98in+the+name%E2%80%99+of+the+Father%2C+Son+and+Holy+Ghost%2C+Mt.+28%3A19%2C+this+does+relate+to+the+end+and+effect+of+baptism%2C+or+the+good+of+the+baptized+%28if+we+understand+the+words+properly%29%2C+not+the+authority+of+the+baptizer%2C+as+if+a+formal+commission+were+there+given+him+from+the+Father%2C+Son+and+Holy+Ghost.+So+that+to+baptize+on+%E2%80%98in%E2%80%99+or+%E2%80%98unto%E2%80%99+the+name+of+the+Father%2C+Son+and+Holy+Ghost%2C+is+properly+meant+both+of+sealing+the+parties%E2%80%99+right+and+title+to+the+enjoyment+of+God+Himself%2C+as+their+God+by+covenant%2C+and+their+interest+in+the+love+of+God%2C+the+grace+of+Christ%2C+and+of+the+communion+of+the+Holy+Ghost%3B+and+of+dedicating+the+party+to+the+knowledge%2C+profession%2C+faith%2C+love%2C+and+obedience+of+God+the+Father%2C+Son+and+Holy+Ghost.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Aaron%E2%80%99s+Rod+Blossoming%2C+p.+110-111&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14dc9f6d20.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/14dc9f6d20.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=But%20where%20I%20added%2C%20that%20in,the%20Father%2C%20Son%20and%20Holy%20Ghost&amp;text=But%20where%20I%20added%2C%20that%20in%20the%20name&amp;text=of%20God%20the%20Father%2C%20Son%20and%20Holy%20Ghost" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

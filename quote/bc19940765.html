<main class="wrap"><figure class="quote" id="q-bc19940765" data-kw="">
<blockquote><p>7th Quest. And in the seventh place, we may and ought to be ready to lay down our lives for the commonwealth, for common good is to be preferred before private good. The hand doth endanger itself for the good of the head, and therefore a private man may venture himself to save a public person; and from hence is grounded the lawfulness of a Christian war.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-278e3fa2b6" data-kw="">
<blockquote><p>In context, Samuel Rutherford is discussing the question as to whether or not the reprobates have lost all right to the use of God’s creation as a result of Adam’s fall. In the midst of this, he raises a question concerning thieves being required to make restitution for goods that they have stolen, and he answers in the affirmative. Although I am not sure if this is enough to indicate a change in position from that which he took in his earlier work, A Free Disputation (where he argued that restitution for theft was not among the Mosaic laws of common equity), the reference to the case laws in Exodus 22 implies that the marrow of the laws concerning restitution are still binding:

[A] thief is obliged to restore stolen goods […] They who enjoy that which they may and ought by their own private power, restore, such as ill conquered goods. They sin in using that, true, Proverbs 3:27; Exodus 22:26, 27; Luke 19:8. It’s a sin to withhold the raiment though laid in pawned, which should cover the poor man’s skin in the night, and they have no right to enjoy that.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 98-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-f2d5d7b1c4" data-kw="">
<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 4, pp. 46-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-83f9932e9e" data-kw="">
<blockquote><p>Piety made David, Solomon, Jehoshaphat, Hezechias, Josias, Zerubbabel, Constantine, Theodosius, Edward the VI., Queen Elizabeth, Prince Henry, and other religious princes, to be so honoured, that their names, since their deaths, smell in the church of God like a precious ointment, and their remembrances are sweet as honey in all mouths, and as music at a banquet of wine; whereas the lives of others, who have been godless and irreligious princes, do rot and stink in the memory of God’s people—and what honour is it for great men to have great titles on earth, when God counts their names unworthy to be written in his book of life in heaven?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), xxxiv.</span></figcaption>

<blockquote><p>…if I drew not up a fair contract of marriage betwixt you and Christ, if I went not with offers betwixt the bridegroom and you, and your conscience did bear you witness, your mouths confessed that there were many fair trysts and meetings drawn on betwixt Christ and you at communion-feasts and other occasions; there were bracelets, jewels, rings, and love-letters sent to you by the Bridegroom, it was told you what a fair dowry you should have and what a house your husband and ye should dwell in, and what was the bridegroom’s excellency, sweetness, might, power. The eternity, and glory of his Kingdom, the exceeding deepness of his love, who sought his black wife through pain, fires, shame, death and the grave; and swimmed the salt sea for her, undergoing the curse of the law, and then was made a curse for you, and you then consented and said, ‘Even so I take Him’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Joshua Redivivus, or Mr. Rutherford’s Letters</cite>, (1664) | To his Parishoners (2), p. 6</span></figcaption>

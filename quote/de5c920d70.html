<blockquote><p>117. Q. Must not your obedience be yielded from right principles and motives?

A. Yes: if my principles and motives are worldly, impure, or condemned in Scripture, it is evident that the actions flowing from them cannot be acceptable to God. My obedience must proceed, not from a desire to “be seen of men,” or to “make gain of godliness,” but from a profound regard to the authority and glory of God, from a sincere attachment to my Lord and Saviour, from a serious view to the rewards and punishments of a future state, and from other considerations of a similar kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-thomson.html">Andrew Thomson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism for the Instruction of Communicants in the Nature and Uses of the Sacrament of our Lord’s Supper, and in the Doctrines and Duties connected with that Ordinance</cite>, (Edinburgh: William Ritchie, [1807]), p. 28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e6551a841" data-kw="">
<blockquote><p>…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.</p></blockquote>

</figure><figure class="quote" id="q-4bc153b4ac" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water [Lk. 13:16], which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears [Mt. 12:1], and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath in The Works of Thomas Shepard</cite>, … (d. 1649; Boston, 1853), pp. 258-59</span></figcaption>

a></div>
</figure><figure class="quote" id="q-1c8ac596e8" data-kw="">
<blockquote><p>The Christian women appeared open, and in public uncovered, from a phantastical imitation of the she-priests and prophetesses of the gentiles when they showed their idols, as their Pythiae, Bacchae, or Menadae, and the like, who used when they uttered their oracles or celebrated the rites and sacrifices of their gods, to put themselves into a wild and extatical guise, having their faces discovered, their hair disheveled etc. The Corinthian women conceiting themselves, when they prayed or prophesied in the Church, to be acting the parts of the priests, or celebrating sacrifice, were so fond as to imitate them and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby dishonoured their head, that is, were unseemly accontred and dressed on their head. Master Mede on 1 Cor. 11.5, vide [see] Grotius.¹ ¹ In Tertullian’s time, those that professed virginity, took upon them to sit with their faces unveiled in the Church, taking it for a privilege of their rank to disclaim the subjection of the sex, and profess freedom. This is the occasion of his book, De velandis virginibus. Thorndike, Of the Service of God at Religious Assemblies, ch. 6 [p. 190], see more there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, … (London, 1654), on 1 Cor. 11 | v. 5</span></figcaption>

</figure><figure class="quote" id="q-9932df8e09" data-kw="">
<blockquote><p>I am taught by the… passage to give no unnecessary outrage to the customs, whether of my age or neighborhood — such customs as, however ephemeral or however local, cannot be violated without a moral hardihood and defiance on the part of the transgressor, and without scandalizing the observers of the offensive exhibition. To estimate the force of this remark, let us but think of how much and what evil would be implied and wrought if the men of our day were to commence the practice of sitting in Church with their hats on, and the women with their bonnets off. Our existing habit, which is a second nature, would cause us to feel that it were a shameful thing in the reckless few who dared such an innovation, and so as to warrant the interference of the Church authorities on the subject. There is enough of analogy between the hats and the long hair to make the apostle’s earnestness on the subject of that liberty which he here reproves to be not altogether unintelligible:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Cor. 11 in Sabbath Scripture Readings, p. 232</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f18afe3f69" data-kw="">
<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (Edinburgh, 1655)</cite>, pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>IV. Now this law of God is divided in general into natural and positive. As the right of God is twofold (one natural, founded in the perfectly just and holy nature of God; the other positive, depending on the will of God alone in which He also shows his own liberty), so there is a positive law of God built on the free and positive right of God (with respect to which things are then good because God commands them). Hence God was free either not to give such a law or to institute otherwise (such as the law relating to food and the symbolical law given to Adam [Gen. 2:16-17] and the ceremonial laws of the Old Testament, in which there was no moral goodness or evil per se, but only from the command of God). There is another (natural) founded on the natural right of God, with regard to which things are not called just because they are commanded, but are commanded because they were just and good antecedently to the command of God (being founded on the very holiness and wisdom of God). And such is its nature that (the creation of man being supposed) it must have been given to him, since it prescribes to him indispensable duties to be performed by all, always and everywhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, Question 1, section 4</cite>, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-dae3e85038" data-kw="">
<blockquote><p>Sometime he [Satan] tempts to lawful liberties, to ear, setting the Law of nature in opposition to the divine positive-law, Gen. 3. ‘The tree is good for meat;’ then God and Nature ordained it for food. In all which, holy Sovereignty gives influences natural to the tempter; nor will He have us to question his Sovereignty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Influences of the Life of Grace… (London, 1659)</cite>, pp. 110-111</span></figcaption>

</figure><figure class="quote" id="q-e33149f1c9" data-kw="">
<blockquote><p>Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (London: Legatt, 1626), vol. 1</cite>, p. 692</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<main class="wrap"><figure class="quote" id="q-51637e0443" data-kw="">
<blockquote><p>We affirm on the other side [from the Papists], that the testimony of the Spirit of God in the Word itself–witnessing it to be of God, by that stamp and impress, or, which comes to the same, by those notes and marks of divinity, which everywhere appear in it–is the immediate and principal, and a sufficient, reason of our believing it to be the Word of God, and the medium [which] the Spirit, working inwardly in our hearts, moves as the efficient of our faith, so the Scripture itself, in its own intrinsical beauty, luster, power and excellency, is that which moves us, in the way of an object or medium, to yield our assent to its being of God. By this the Spirit of God; and, by an internal application of this to our minds, induceth us to assent to its so being…. This they [the Papists] deny; and this we shall first, though more briefly prove…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 612-3 of ‘The Testimony of the Church is not the Only, nor the Chief Reason of our Believing the Scripture to be the Word of God’ in Puritan Sermons, 5.606-648 &amp; in Works, 8.495-543</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-62732e5795" data-kw="">

</figure><figure class="quote" id="q-5911d442cf" data-kw="">
<blockquote><p>Controversy II: What is justifying faith? … Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure:

1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed.

2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

ne</a></div>
</figure><figure class="quote" id="q-8322df7240" data-kw="">
<blockquote><p>In respect to this confidence, faith is called saving and justifying. For God justifies no one except those who place their confidence in Christ and firmly believe their sins to be forgiven because of His merit. Thus, to attain salvation, it is not enough to have knowledge of divine mysteries or even general assent, but confidence is also necessarily required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | And in his Explanation, he adds:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-9964da864b" data-kw="">
<blockquote><p>And this life is by faith in Christ, as “he loved us, and gave himself for us;” that is, as he was a propitiation for our sins. This, then, is the only way, means, and cause, on our part, of the preservation of this life, of the continuance of our justification; and herein are we “kept by the power of God through faith unto salvation.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

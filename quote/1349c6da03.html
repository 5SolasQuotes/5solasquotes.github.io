<main class="wrap"><figure class="quote" id="q-1349c6da03" data-kw="">
<blockquote><p>There was another body called Covenanters. Who are the Covenanters? We are the Covenanters. I have no idea of giving up the covenant of our fathers; and when writing to any of my dear brethren of that [Reformed Presbyterian] church, I style him as belonging to the church commonly called Covenanters, but I never on any occasion address them as Covenanters par excellence. He hoped the time would come when they would unite with that church too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belfast-commercial-chronicle.html">Belfast Commercial Chronicle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commercial Chronicle</cite>, 1 July 1839.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-465ee733d8" data-kw="">
<blockquote><p>And what can we answer to all the Sister-Churches in Christendom, who have heard of so many Declarations, Letters, Ordinances, Remonstrances, promises before God, the world, and the elect Angels, that we came to this Reverend [Westminster] Assembly as willing to join with the professed desires and invitation of the honourable Houses of Parliament to remove not only government by Archbishops, but likewise to settle such a government as is most agreeable to the word of God, most apt to procure and preserve the peace of the Church at home, and a happy union with the Church of Scotland, and other Reformed Churches abroad, in doctrine, worship, government, and one form of Catechism, and to establish the same by Law.

To oppose heresies, errors, schisms, injoyne the National Covenant by Ordinance of Parliament to be taken by all; when now indulgence and more is yielded to all heresies, blasphemies and sects, and an army pleading for Liberty of conscience to all Religions, Popery not excepted, is owned and authorised by the Houses, whereas other humble and modest petitioners for a government according to the word of God, against the Erastian and unwarrantable government set up but in quarters and pieces, of which the Lord may say, Offer it now to your Governor, will he be pleased with it and accept your persons? have been checked and dismissed without an answer till his day, yea and censured as guilty of breach of privilege of Parliament, as it faired with the Reverend Assembly of Divines, for a submissive and humble supplication, for the Royal Prerogative of Jesus Christ in his own free Courts and Assemblies.

… Shall not the Reformed Churches abroad who have hitherto prayed for the sad calamities of the Church of England, when they hear (as they must hear in languages known to them) that the Parliaments of both Kingdoms have made their humble address to the King’s Majesty, and the Ambassadors of Christ, and the godly have lain at the footstool of the throne of Grace, soliciting the Lord, in whose hands is the heart of the King, that he would graciously incline his spirit to take the National Covenant, for the extirpation of Popery, Prelacy, superstition, heresy, schism, profaneness, and whatsoever shall be found contrary to sound doctrine.

Wonder and be astonished, when it is reported that the Parliament of England joined in the same Covenant with us! have not only, not pressed the same on the Subjects, which they desire of their Prince, but suffer satires, railings, reproaches to be cast upon the Covenant of God in Press, and Pulpit, highly promote those that are greatest enemies thereof, and countenance an Army, who labour with all their power to render the heart of the Prince averse to the Covenant, and the sincere promoters thereof, and do require the open toleration (not the extirpation) of all heresies, blasphemies, yea of the Kingdom and throne of Antichrist, against which we Covenanted, and to take off all Laws for pressing the Covenant, that so it may be buried in England, though many of the Army, and Independents, Antinomians, Socinians, and others, did solemnly with their hands lifted up to the most High, engage themselves to the Lord, never to suffer themselves directly or indirectly to be divided and withdrawn from that blessed union and conjunction: So that what the Kingdom and Church of Scotland, and the most faithful adherers to the Covenant, labour to build in public, with this underhand dealing is destroyed and casten down.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brotherly and free epistle to the patrons and friends of pretended Liberty of Conscience in A survey of the spiritual antichrist</cite></span></figcaption>

</figure><figure class="quote" id="q-20c40102e8" data-kw="Creeds and confessions">
<blockquote><p>To this power belongs the making of public creeds and confessions, which are usually and by synods and presbyteries to preserve the unity and agreement of faith and reject errors. They do not have the same authority as the Scriptures, since they must be compared with and corrected by them. Yet they have even their own memorable weight and ought to be valued very highly by the pious. Both because they contain the sum and foundation of the Christian doctrine and are like barriers against the errors and corruptions which can injure religion. And because they are the bonds of ecclesiastical communion and formulas of consent which testify of the unity of faith and the agreement of churches with each other and are distinguished from unbelievers, as soldiers by marks or watchwords from their enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a1da1a7ea8" data-kw="">
<blockquote><p>In the meantime, to give some stop, if it might be, to the Current of Popery, I conceived in might be convenient and necessary that it be known and declared to this mislead people, as to others, who that is whom they so follow, that he is that very Antichrist, by whom they may be carried away by that deluge of Apostacy into perdition, whereby these may by grace be brought to consider their ways.

This is that which is in the following Treatise intended, and is, I hope to some evidenced, which appearing, other points and erroneous Doctrines of Popery will fall, depending on that the principal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jones.html">Henry Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of antichrist preached at Christ-Church, Dublin, Novemb. 12, 1676. By the Right Reverend Father in God, HENRY, Lord Bishop of MEATH.</cite>, (2nd edn, London: Nathaniel Ponder, 1679), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3be6d89447" data-kw="">
<blockquote><p>The pope makes everything right. Where the pope is, there is the true church, pure doctrine, and apostolic succession. The truth is, there is not a word in Scripture about such an apostolic succession. Even as such it is no more a guarantee of purity of doctrine than the hereditary high-priestly office of Caiaphas validated the justice of his pronouncements and actions. For that reason Protestants were right in saying that not “the succession of places and persons” (successio locorum et personarum) but “the succession of doctrine” (successio doctrinae) is a distinguishing feature of the true church. If the latter is missing, the former can make no church into a true church; and if it is present, the former is of very minor significance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 4, §496</span></figcaption>

</figure><figure class="quote" id="q-36d770f0fc" data-kw="Succession of Peter">
<blockquote><p>No one succeeded the apostles in personal apostolic preeminence (hyperochē). Therefore neither did anyone succeed Peter. For the same principle ought to apply to all. Nor ought the privilege of Peter as to ecclesiastical monarchy to be opposed, because this is the capital falsehood (prōton pseudos), which has been refuted before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.4</span></figcaption>

</figure><figure class="quote" id="q-7f4a9b7ead" data-kw="Succession">
<blockquote><p>Thirdly, I say that this appertains as much to all bishops and ministers as to the pope of Rome himself; because they all succeed Peter in this matter, that is, in the preaching of the word, and should imitate his diligence in feeding the sheep of Christ.</p></blockquote>

</figure><figure class="quote" id="q-a68407c8d3" data-kw="">
<blockquote><p>But there are other Philistines namely Arminian and Socinian Philistines, by which Church and State are much endangered, and it is the business now in hand to lay open their mystery of iniquity to the public view. We may say to these pestilent Heretics as well as to malignant Statesmen, Ita nati estis ut mala vestra ad Rempub. pertineant; for there are no greater Statesmen in the world then the English Arminians, and Popish Socinians; for such Monsters hath England nourished as are not to be found in all Africa.

Herod and Pilate, the Roman and the Racovian Antichrist, are made friends in England, all the Grand-Malignants, Arminians, Papists, and Socinians are of one confederacy, all united under one head the Arch-Bishop of Canterbury, the Patriarch or Pope of this British world, alterius orbis Papa as his Brother-Pope hath given him leave to phrase it, because he saw the Arch-Bishop too proud to acknowledge his Supremacy, but forward enough to maintain any other point of Popery, &amp; ready to join with him to suppress all Pure Protestants.

If this Design take effect, there may well be a reconciliation professed &amp; established between Rome and Canterbury, the two Popes may divide the spoil of the Church between them if they can but agree at parting. Whether some have not endeavoured to make such a Reconciliation; whether all points of Popery almost have not been greedily embraced in England, and that of the Pope’s Supremacy only rejected, more out of pride then conscience, let the prudent judge, they have light and evidence enough, and new evidence is daily produced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The rise, growth, and danger of Socinianism together with a plain discovery of a desperate design of corrupting the Protestant religion, whereby it appears that the religion which hath been so violently contended for (by the Archbishop of Canterbury and his adherents) is not the true pure Protestant</cite>, (London: Samuel Gellibrand, 1643), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

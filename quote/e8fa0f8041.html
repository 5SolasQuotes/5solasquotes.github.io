<blockquote><p>…wager: ‘Tis called contractus sponsionis, a contract of promising, and is commonly used when there is some contest about the truth of a proposition, concerning something that is or is not in being already, or will or will not be hereafter, both parties agreeing that he who holds the truth shall have a reward and the other that asserted the falsehood shall be mulcted [fined]. The thing in itself is not absolutely unlawful or unjust, and may sometimes be of use to repress a foolish confidence. Also, where the engagement is only on one hand, whereby a man obliges himself to do a thing under a penalty; for here it may be of use, to stir up a laudable industry, provided such obligation, wager, or agreement be not to any matter that is sinful (as who shall drink most, who shall play a lascivious prank or offer an injurious abuse, etc.) provided also that it be not to the notable loss or hazard of any man, unless it does conduce to a greater public good (which cautions are seldom observed in common wagers), for in such cases the wager becomes sinful and is to be altogether avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-morton.html">Charles Morton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gaming-Humor Considered &amp; Reproved… (London: Cockerill, 1684), pp. 25-26 Morton (1627-1698) was an English, puritan, nonconformist minister.</cite></span></figcaption>

<blockquote><p>Question: Why, but do you think it simply unlawful to play for money? Answer: Surely no. For when either so litle is played as no way inables me to any duty of my calling, or the money (not much) is bestowed in some meeting, for the increase of love, or that which is won is a reward appointed to that exercise, then think I, with others, that it is lawful.</p></blockquote>

</figure><figure class="quote" id="q-d635f46709" data-kw="">
<blockquote><p>§19. Question 12. If another man deceive me into a promise or covenant against my good, am I bound to perform it when I have discovered the deceit? Answer: Yes, 1. in case that the law of the land or other reasons for the public good require it; 2. Or in case that you were faulty by negligence, heedlessness, or otherwise guilty of your own deceit, in any considerable and avoidable degree. Otherwise, in that measure that he deceived you, and in those respects you are not obliged. §20. Question 13. If the contracting parties do neither of them understand the other, is it a covenant: or if it be, whose sense must carry it? Answer: If they understand not each other in the essentials of the contract, it is no contract, in point of conscience: except where the laws, for the public safety, do annex the obligation to the bare external act. But if they understand not one another in some circumstances, and be equally culpable or innocent, they must come to a new agreement in those particulars: But if one party only be guilty of the misunderstanding, he must bear the loss if the other insist on it. … §22. Question 15. If I say I will give such or such a one this or that, am I bound thereby to do it? Answer: It is one thing to express your present mind and resolution without giving away the liberty of changing it: And it’s another thing to intend the obliging of yourself to do the thing mentioned, and that obligation is either intended to man or to God only; and that is either in point of rendition and use, or in point of veracity, or the performance of that moral duty of speaking truth. If you meant no more in saying, ‘I will do it,’ or ‘I will give it,’ but that this is your present will and purpose and resolution, yea, though it add the confident persuasion that your will shall not change, yet this no further obliges you than you are obliged to continue in that will: And a man’s confident resolutions may lawfully be changed upon sufficient cause. But if you intended to alienate the title to another, or to give him present right, or to oblige yourself for the future to him by that promise; or to oblige yourself to God to do it by way of peremptory assertion, as one that will be guilty of a lie if you perform it not; or if you dedicate the thing to God by those words as a vow, then you are obliged to do accordingly (supposing nothing else to prohibit it).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London, 1673) | pt. 4, ch. 19, title 2</cite>, p. 117</span></figcaption>

</figure><figure class="quote" id="q-c96746d8bb" data-kw="">
<blockquote><p>Oaths conceived or made rightly of things lawful, true, certain, weighty, and possible, are to be kept. For if once thou hast acknowledged and testified thyself to be justly bound to keep thy promise, and hast called God to record hereof, when as afterwards thou wittingly and willingly breakest thine oath, thou dost violate and break a just bond, and doest either accuse God, the witness and maintainer of this bond, of vanity and lightness, or provoke Him to punish thee. Ps. 15:4-5… But oaths that are made of unlawful things, either by an error, or by ignorance, or through infirmity, or against the conscience, it is sin to keep them. And therefore such oaths are to be retracted and recalled, least we add thereby sins unto sins… They therefore who keep that which they have ill sworn heap sin unto sin; as did Herod putting John Baptist to death by pretence of keeping his oath: and likewise such as keep monastical vows, whereby they have sworn idolatry and impious single living… and according to the example and doctrine of David, 1 Sam. 25, who swears that he will destroy Nabal together with his family, saying: ‘So and more also do God unto the enemies of David; for surely I will not leave of all that he has by the dawning of the day, any that pisses against the wall:’ But after he had heard Abigail speak, he gives thanks to God that the executing and fulfilling of his oath was hindered by her and confirms by a new oath that this is God’s blessing and benefit, saying: ‘Blessed be the Lord God of Israel which sent thee this day to meet me; and blessed be thy counsels, and blessed be thou, which hast kept me this day from coming to shed blood, and that mine hand has not saved me. For indeed, as the Lord God of Israel lives, who has kept me back from hurting thee, etc.’… Objection 2. The oath of peace which was made to the Gibeonites, Josh. 9, was [by deception and] against the commandment of God. It is lawful therefore to keep an oath made of things unlawful. Answer: 1. They were not excluded from peace if any of those nations which God has commanded to be destroyed, did ask peace of the Israelites and did embrace their religion. Now the Gibeonites desire peace and are adjudged to serve the tabernacle for woodcleavers and drawers of water perpetually. Therefore the peace which was promised them, albeit it was obtained by fraud and guile, yet was it not repugnant to God’s commandment. 2. The Israelites do not therefore keep this oath, as that they were bound thereby, because they sware it being deceived, and thinking the Gibeonites to have been of another country: but first for avoiding of offence, whereby the name of God might be disgraced among the heathen, if the Jews had not kept their oath; and then, because it was lawful and just to save them which desired peace and embraced their religion, although no oath had been made at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-ursinus.html">Zachary Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), 3rd Commandment, 4. Whether all oaths are to be kept</cite>, pp. 917-19</span></figcaption>

— Zachary Ursinus, The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), 3rd Commandment, 4. Whether all oaths are to be kept, pp. 917-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COaths+conceived+or+made+rightly+of+things+lawful%2C+true%2C+certain%2C+weighty%2C+and+possible%2C+are+to+be+kept.+For+if+once+thou+hast+acknowledged+and+testified+thyself+to+be+justly+bound+to+keep+thy+promise%2C+and+hast+called+God+to+record+hereof%2C+when+as+afterwards+thou+wittingly+and+willingly+breakest+thine+oath%2C+thou+dost+violate+and+break+a+just+bond%2C+and+doest+either+accuse+God%2C+the+witness+and+maintainer+of+this+bond%2C+of+vanity+and+lightness%2C+or+provoke+Him+to+punish+thee.+Ps.+15%3A4-5%E2%80%A6+But+oaths+that+are+made+of+unlawful+things%2C+either+by+an+error%2C+or+by+ignorance%2C+or+through+infirmity%2C+or+against+the+conscience%2C+it+is+sin+to+keep+them.+And+therefore+such+oaths+are+to+be+retracted+and+recalled%2C+least+we+add+thereby+sins+unto+sins%E2%80%A6+They+therefore+who+keep+that+which+they+have+ill+sworn+heap+sin+unto+sin%3B+as+did+Herod+putting+John+Baptist+to+death+by+pretence+of+keeping+his+oath%3A+and+likewise+such+as+keep+monastical+vows%2C+whereby+they+have+sworn+idolatry+and+impious+single+living%E2%80%A6+and+according+to+the+example+and+doctrine+of+David%2C+1+Sam.+25%2C+who+swears+that+he+will+destroy+Nabal+together+with+his+family%2C+saying%3A+%E2%80%98So+and+more+also+do+God+unto+the+enemies+of+David%3B+for+surely+I+will+not+leave+of+all+that+he+has+by+the+dawning+of+the+day%2C+any+that+pisses+against+the+wall%3A%E2%80%99+But+after+he+had+heard+Abigail+speak%2C+he+gives+thanks+to+God+that+the+executing+and+fulfilling+of+his+oath+was+hindered+by+her+and+confirms+by+a+new+oath+that+this+is+God%E2%80%99s+blessing+and+benefit%2C+saying%3A+%E2%80%98Blessed+be+the+Lord+God+of+Israel+which+sent+thee+this+day+to+meet+me%3B+and+blessed+be+thy+counsels%2C+and+blessed+be+thou%2C+which+hast+kept+me+this+day+from+coming+to+shed+blood%2C+and+that+mine+hand+has+not+saved+me.+For+indeed%2C+as+the+Lord+God+of+Israel+lives%2C+who+has+kept+me+back+from+hurting+thee%2C+etc.%E2%80%99%E2%80%A6+Objection+2.+The+oath+of+peace+which+was+made+to+the+Gibeonites%2C+Josh.+9%2C+was+%5Bby+deception+and%5D+against+the+commandment+of+God.+It+is+lawful+therefore+to+keep+an+oath+made+of+things+unlawful.+Answer%3A+1.+They+were+not+excluded+from+peace+if+any+of+those+nations+which+God+has+commanded+to+be+destroyed%2C+did+ask+peace+of+the+Israelites+and+did+embrace+their+religion.+Now+the+Gibeonites+desire+peace+and+are+adjudged+to+serve+the+tabernacle+for+woodcleavers+and+drawers+of+water+perpetually.+Therefore+the+peace+which+was+promised+them%2C+albeit+it+was+obtained+by+fraud+and+guile%2C+yet+was+it+not+repugnant+to+God%E2%80%99s+commandment.+2.+The+Israelites+do+not+therefore+keep+this+oath%2C+as+that+they+were+bound+thereby%2C+because+they+sware+it+being+deceived%2C+and+thinking+the+Gibeonites+to+have+been+of+another+country%3A+but+first+for+avoiding+of+offence%2C+whereby+the+name+of+God+might+be+disgraced+among+the+heathen%2C+if+the+Jews+had+not+kept+their+oath%3B+and+then%2C+because+it+was+lawful+and+just+to+save+them+which+desired+peace+and+embraced+their+religion%2C+although+no+oath+had+been+made+at+all.%E2%80%9D%0A%0A%E2%80%94+Zachary+Ursinus%2C+The+Sum+of+Christian+Religion%3A+Delivered%E2%80%A6+in+his+Lectures+upon+the+Catechism%E2%80%A6+tr.+Henrie+Parrie+%28Oxford%2C+1587%29%2C+3rd+Commandment%2C+4.+Whether+all+oaths+are+to+be+kept%2C+pp.+917-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc96746d8bb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c96746d8bb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=Oaths%20conceived%20or%20made%20rightly%20of,oath%20had%20been%20made%20at%20all." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And I dare say, whosoever shall peruse with a judicious and unpartial eye most of those pamphlets, that in this daring age have been thrust into the world against… (…things of lesser regard and usefulness and more open to acception [exception] and abuse, yet so far as I can understand, unjustly condemned as things utterly unlawful, such as are lusorious lots, dancing, stage plays and some other things of like nature), when he shall have drained out the bitter invectives, unmannerly jeers, petulant guirding at those that are in authority, impertinent digressions, but above all those most bold and perverse wrestings of holy Scripture, wherewith such books are infinitely stuffed, he shall find that little poor remainder that is left behind to contain nothing but vain words and empty arguments. For when these great undertakers have snatched up the bucklers, as if they would make it good against all comers, that such and such things are utterly unlawful, and therefore ought in all reason and conscience to bring such proofs as will come up to that conclusion: Quid dignum tanto? very seldom shall you hear from them any other arguments than such as will conclude but an inexpediency at the most, as that they are apt to give scandal, that they carry with them an appearance of evil, that they are often occasions of sin, that they are not command[ed] in the Word, and such like. Which objections, even where they are just, are not of force (no not taken altogether, much less any of them singly) to prove a thing to be utterly unlawful. And yet are they glad many times, rather than sit out, to play very small game and to make use of arguments yet weaker than these and such as will not reach so far as to prove a bare inexpediency, as that they were invented by heathens, that they have been abused in Popery and other such like. Which to my understanding is a very strong presumption that they have taken a very weak cause in hand and such as is wholly destitute of sound proof.</p></blockquote>

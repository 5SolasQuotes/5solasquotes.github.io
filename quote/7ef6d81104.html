<main class="wrap"><figure class="quote" id="q-7ef6d81104" data-kw="">
<blockquote><p>Do you, or can you believe and make all your followers believe that the synagogue-worship and the Temple-worship were kept so pure by the priests, Levites and pharisees in Christ’s days as that there was nothing of human tradition obtruded? Or nothing but what God commanded? Can you believe this? Or can you believe that Christ was not usually or often present there? See Luke 4:16, ‘At Nazareth where he had been brought up, as his custom was, He went into the synagogue on the Sabbath day’—And of Paul its said, Acts 17:2, ‘As his manner was, he went in to them, and three Sabbath days reasoned’—Or do you believe that Christ was a sinner? and that he contradicted his own sovereignty? What! and yet be a perfect Saviour?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), sect. 45, p. 116</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e1ae6820fa" data-kw="">
<blockquote><p>Separation is one thing, and not hearing such or such a man is a far other thing. There may be many just grounds of exception against a particular person, why people may refuse to countenance him, without any hazard of separation, or joining with separatists in their principles. Separation is one thing, and refusing to attend the ministry of such a man is another thing; for a man may join with ordinances in another congregation, and so testify that he has no prejudice at the ministry, but only against such a man in particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-5a539df8b1" data-kw="">
<blockquote><p>…or else they [Christians] must [on congregationalist principles] be fetched from places so far distant as must force them either to travel far from their several abodes to the same meeting place for worship winter and summer, or else many of them to be without all church-ordinances, or to enjoy them rarely: The former of which is oppressive to their bodies, the later injurious to their souls; neither of them seems suitable to the goodness and wisdom of God, who (as ’tis said of the Sabbath [Mk. 2:27]) has made Church-ordinances for man, not man for Church-ordinances.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b7320d7710" data-kw="">
<blockquote><p>If the Divine BEING, by reason of their Childishness in which they then were, did allow ‘em to offer Sacrifices; why do you wonder that he also allowed ‘em that Musick which is performed by the Harp and Psaltery?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isidore-pelusiota.html">Isidore Pelusiota</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lib. 2, Epist</cite>, 176</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b011b04a0" data-kw="">
<blockquote><p>I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the temple destroyed? Is the temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the temple or the synagogue the model on which the Church of the New Testament is formed? Does the Old Testament itself point to anything but ‘the fruit of the lips’ [Heb. 13:15] as the peace-offering or thank-offering of gospel times? Is there a trace in the New Testament of any other mode of praise? For my part I am persuaded that if the organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fullness — against the substitution again, in our whole religion, of the formal for the spiritual, the symbolic for the real.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in James Gibson’s, The Public Worship of God</cite>, (1869), p. 107 Candlish was a leading minister in the Free Church of Scotland.</span></figcaption>

</figure><figure class="quote" id="q-b0c7e74abf" data-kw="">
<blockquote><p>Also whatever is a profession in fact, of a false religion by ceremonies indifferent, and yet proper to a false religion, is a denying of the true religion; but the using of these ceremonies, used by Papists and Jews is such; Therefore… The proposition [above] is Scripture, Gal. 2:14, Peter lived after the manner of the Jews in using the religious materials of the Jews, though he had no Jewish intention or opinion; yea, Acts 10, he disputes against that: So circumcision, Gal. 6:14-15, is put for the Jewish Church. Now altars, organs, Jewish ephods, or surplice, Mass-clothes, and Romish crossing, bowing to altars, images, are badges of Jewish and Popish religion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, pp. 142-143</span></figcaption>

</figure><figure class="quote" id="q-830945a23e" data-kw="">
<blockquote><p>Lastly, God’s spirit works not with ceremonies, and so they are as the offering of swines’ blood and the slaying of a man; and so abomination to God, Isa. 66:3. 2. The Holy Spirit is merited to us by Christ, Jn. 16:14, “He shall receive of mine and show unto you”: but who can say that the grace of joy in the Holy Ghost, wrought by the droning of organs and the holiness taught by surplice, is a work of the spirit merited by Christ as our High Priest? 3. God has made no promise that He will work by ceremonies, for the Spirit works not without the Word; so then I might resist the working of the Spirit and not sin against the Word; and this is Anabaptists’ Enthusiasm: If God work not by them, they be vain and fruitless; and the idol is unlawful for this [reason], that ‘it profits not’. Also, the Spirit’s action is either natural or supernatural here: If natural, it is a natural work, and a natural spirit, and to be rejected: If supernatural, we may devise means to produce supernatural effects: men’s ceremonies can produce supernatural joy, comfort, peace, and acts of grace purchased to us by Christs merit; this is a miracle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, p. 136</span></figcaption>

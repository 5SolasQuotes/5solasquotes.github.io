<main class="wrap"><figure class="quote" id="q-0ee2106606" data-kw="Vincent of Lerins">
<blockquote><p>Vincentius Lirinensis, an ancient author in whose book the papists have great confidence, speaks thus: c. 41, “The canon of scripture alone is self-sufficient for all.” Still more plainly, c. 2: “The canon of scripture alone is sufficient, and more than sufficient for all things.” I do not see how he could have spoken more plainly: he says that the canon of scripture is sufficient, and more than sufficient; sufficient for all things, and sufficient alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 6, ch. 17</span></figcaption>

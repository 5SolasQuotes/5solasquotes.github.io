</figure><figure class="quote" id="q-dc6148f3bb" data-kw="">
<blockquote><p>‘Do not harshly rebuke an elder.’ He now recommends to Timothy gentleness and moderation in correcting faults. Correction is a medicine, which has always some bitterness, and consequently is disagreeable. Besides, Timothy being a young man, his severity would have been less tolerable, if it had not been somewhat moderated. ‘But exhort him as a father.’ The Apostle enjoins him to reprove elder persons as parents; and he even employs the milder term, ‘exhort.’ It is impossible not to be moved with reverence, when we place before our eyes our father or our mother; in consequence of which, instead of harsher vehemence, we are immediately influenced by modesty. Yet it ought to be observed, that he does not wish old men to be spared or indulged in such a manner as to sin with impunity and without correction; he only wishes that some respect should be paid to their age, that they may more patiently bear to be admonished. ‘The younger as brethren.’ Even towards younger persons he wishes moderation to be used, though not in an equal degree; for the vinegar must always be mingled with oil, but with this difference, that reverence should always be shown to older persons, and equals should be treated with brotherly gentleness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Timothy</cite>, 5:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

ated%20with%20brotherly%20gentleness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-acd0b817f0" data-kw="">
<blockquote><p>Nor are women, sons, servants, debarred from voicing in election because it is a Church-power, for it is no power of jurisdiction. For: 1. Their tacit [understood or implied without being stated] voices and consents are not excluded, because they must try the spirits, and not upon trust and fide implicita [implicit faith] believe every teacher more than men, or believe as the Church believes, more than their husbands, nor must they take doctrines as truth upon their husband’s word; nor are women so excluded from speaking in the Church as [that] they may upon no occasion: confess their faith, 2. profess vocally repentance, 3. depose as witnesses, [or] 4. accuse the guilty before the binding Church.

4. Nor may a [civil] corporation cast out a major [an official] by an authoritative power such as binding and loosing is, Mt. 18 [that is, the power by which they do it is not of the same kind as ecclesiastical power].

5. We seek a warrant why the votes of women in choosing their pastors must more be included in the votes of the male than their being essential parts of the redeemed Church is included in the males, or their confessing publicly that Jesus is the Christ, as many women martyrs and sons and servants have gloriously done; and yet their confession of Christ to the death must be personal, and not included in the confession of husband or parents, as Mt. 10:32.</p></blockquote>

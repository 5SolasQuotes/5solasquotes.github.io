<main class="wrap"><figure class="quote" id="q-8b3c46dc45" data-kw="">
<blockquote><p>That children ought not to dispose of themselves in marriage without the consent of parents, is the constant doctrine of the Protestant churches. And the reasons are these: (1) The scripture gives the power of making marriages for children to the parents, Deut. 7:3; Jer. 29:6; 1 Cor. 7:37, 38. Yea, even after parties have consented, it is left to the parent, whether to give his abused daughter to him that has been guilty with her, Ex. 22:16, 17. (2) The most approved examples of marriage in scripture go this way, Gen. 24:3, 4; 28:1, 2; and 29:19; Judg. 14:2. (3) Lastly, The reason is plain; for the child cannot give away any thing that is his parents’ against their will. Now, the child himself is the parents’, a part of their self-moving substance, in which they have a most undoubted property. So, when the devil was permitted to fall upon what was Job’s, he fell upon his children, and killed them in the first place. Yet, upon the other hand, no parent can force a child to marry such and such a person; for consent makes marriage, and that which is forced is no consent. The child must be satisfied as well as the parent, Gen. 24:57. So the short of it is, that the consent of both is necessary, and that the parent must neither force the child, nor the child rob the parent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/attersoll-boston.html">Attersoll Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thomas Boston, Works, 2:221:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>We also seeing the standards of kings, princes and cities, we call the signs by the names of the kings, princes, and cities: for we say, ‘This is the king of France,’ ‘This is the prince of Germany, this is Tigur, this is Bern.’ So if we see the marriage ring, or the image of any prince, we call it the faith and trothe of wedlock, or man and wife, yea, and we say by the image, ‘This is the prince.’ For matrons showing their wedding ring, say, ‘this is my husband.‘</p></blockquote>

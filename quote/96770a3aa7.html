<main class="wrap"><figure class="quote" id="q-96770a3aa7" data-kw="">
<blockquote><p>VI. From that nexus of the parts result the affections of the world, and indeed I. Unity; which certain ancient philosophers denied: Democritus, Leucippus, Epicurus, Diogenes, Metrodorus, Empedocles, Anaximander, Anaximenes, Xenophanes, Zeno of Elea, Anaxarchus, Archelaus, and Anaxagoras, whom when Alexander the Great had heard discoursing that there are innumerable worlds, he is said to have wept. When asked the cause, he replied: “Do I not seem to weep rightly, who, when there are innumerable worlds, have not yet become the master of one?” Whence the saying of Juvenal, Satire 10, “One globe does not suffice for the Pellaean youth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), ch. 2, Of Creation</cite>, pp. 19-21 trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53b2323259" data-kw="">
<blockquote><p>The philosophers, among whom was Aristotle, because being devoid of revelation, they could not reach to the first man, thought of an infinite subordination of men, and at the same time, of the eternity of the world. Democritus is reported to have stated that men crawled forth from the earth like maggots. Epicurus said that man was a composite of the fortuitous confluence of atoms, and in addition that they arose from the earth like fungi, and are daily animated by the certain position of the stars. Paracelsus [d. 1541], besides the human posterity of Adam, numbered four other non-Adamic races of men, and assigned them to each of the elements…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Do All Men Owe their Origin to the One Adam?’ in Theoretical-Practical Theology (RHB), vol. 3, ch. 9, section 13</cite></span></figcaption>

</figure><figure class="quote" id="q-a68262c412" data-kw="">
<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis (London: 1592), ch. 1</cite>, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-7963400fc6" data-kw="">
<blockquote><p>As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons &amp; Uses upon the First Epistle General of John (d. 1652; 1658), on ch. 3, verse 2, doctrines 3-4</cite>, pp. 224-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<main class="wrap"><figure class="quote" id="q-f925026ff3" data-kw="">
<blockquote><p>There are certain things which you cannot expect from such a true Christian Church. In the first place, you cannot expect from it any cooperation with non-Christian religion or with a non-Christian program of ethical culture. There are those who tell us that the Bible ought to be put into the public schools, and that the public schools should seek to build character by showing the children that honesty is the best policy and that good Americans do not lie nor steal. With such programs a true Christian Church will have nothing to do. The Bible, it will hold, is made to say the direct opposite of what it means if any hope is held out to mankind from its ethical portions apart from its great redemptive center and core; and character building on the basis of human experience may be character destruction; it is the very antithesis of that view of sin which is at the foundation of all Christian convictions and all Christian life. There is no such thing, a true Christian Church will insist, as a universally valid fund of religious principles upon which particular religions, including the Christian religion, may build; “religion” in that vague sense is not only inadequate but false; and a morality based upon human experience instead of upon the law of God is no true morality. Against such programs of religious education and character building, a true Christian Church will seek from the state liberty for all parents everywhere to bring up their children in accordance with the dictates of their conscience, will bring up its own children in accordance with the Word of God, and will try to persuade all other parents, becoming Christians, to bring up their children in that same Christian way. In the second place, you cannot expect from a true Christian Church any official pronouncements upon the political or social questions of the day, and you cannot expect cooperation with the state in anything involving the use of force. Important are the functions of the police, and members of the Church, either individually or in such special associations as they may choose to form, should aid the police in every lawful way in the exercise of those functions. But the function of the Church in its corporate capacity is of an entirely different kind. Its weapons against evil are spiritual, not carnal; and by becoming a political lobby, through the advocacy of political measures whether good or bad, the Church is turning aside from its proper mission, which is to bring to bear upon human hearts the solemn and imperious, yet also sweet and gracious, appeal of the gospel of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Responsibility of the Church in our New Age,” The Presbyterian Guardian 45</cite>, (February, 1976): 5, 13, 14.</span></figcaption>

<blockquote><p>At the Creation the Spirit of God moved upon the face of the waters, Gen. 1.1. So that He was at the framing of this world; and because of that, must be concluded to exist before the world: for when a man in verity can be said to subsist without a soul, the eternity of God shall be allowed, granting Him to abide without his Spirit; which here brooded over the world’s embryo, animating the same for production, infusing such vivifying heat as might capacitate the first confused mass, to bring forth the several forms of things we behold…</p></blockquote>

<blockquote><p>We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.</p></blockquote>

<blockquote><p>…hereafter we must see concerning the selling and buying of things necessary… it is a thing doubtless greatly material that not only things hurtful be not brought into the city, but also the things good and profitable should be brought, but with such a proviso that the things that are to be brought in be set abroad and sold with least danger. Here therefore laws are to be made [of] what kinds of meats [foods] may be lawful to be sold and what not… and a certain penalty by the Preservers [civil health officials appointed for the time of the plague] to be set upon the offenders. … Lastly, also as touching the place wherein all things pertaining unto meat and drink are to be sold, something must be added. For it seems not convenient that all things should be brought into one market. For so it must needs be that a mighty multitude of people should come together… the infection must with all diligence be shunned, as has been often said already. There must therefore be ordained many places in sundry parts of the city where those things must be set which pertain unto food and are needful for everyone. Let there also be a several [different] market for flesh and fish, for herbs and fruits, that all discommodities which may arise by the mingling together of a multitude of people and bringing of things sellable, may with all diligence be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 1, ch. 7</span></figcaption>

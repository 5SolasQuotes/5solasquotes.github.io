<main class="wrap"><figure class="quote" id="q-5a460830c4" data-kw="">
<blockquote><p>Love is the going forth of the heart unto the object beloved; and the love which true Christians bear unto Jesus Christ is a grace wrought by the Spirit in their hearts whereby, upon discovery and believing apprehension of Christ’s infinite loveliness and excellency, His matchless love, grace, and mercy, their hearts go forth towards Him in earnest desires after union to Him, and communion with Him, wherein they take chief complacency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Unseen Christ (1680; Ligonier PA: Soli Deo Gloria, 1993), p. 8.</cite></span></figcaption>

<blockquote><p>6. The effects of this first [divine] work are these: (1) A hearty welcoming of Christ Jesus into the soul; they do not take up with comfort on this side [of] Christ; Men’s troubles are known by their satisfaction… But if we see the necessity of a Savior, receive Him into our hearts and believe in Him with all our hearts, desire and delight and all is carried after Christ, and after the refreshings of his grace and are satisfied with none but Christ, and our hearts pant for Him, as the hart pants after the water brooks, you ought to bless God that He has left the impression of the effect, though He has not left the impression of the way; Ps. 42:1.</p></blockquote>

</figure><figure class="quote" id="q-30cbe3f315" data-kw="">
<blockquote><p>The third theological foundation of the Genevan Psalter was the doctrine of common grace. By this it was recognized that there are two types of divine gifts — supernatural and natural. The former are the virtues wrought in the soul by a special work of grace; the latter are those which pertain to secular matters and are distributed to all, not to saints only; as a matter of fact, often to sinners. But, wherever they were, Calvin recognized these and used them for his purposes. Skill in music is a natural rather than a supernatural skill, but Calvin was ever on the alert to capture this for the worship of God. Thus, at his Academy in Geneva, he made music required four hours each week. The choir thereby trained in this skill was to lead the people so they could, under its leadership, cultivate the same skill. Acting on this same principle, Calvin was quick to appreciate the able — though not excessively orthodox — Marot, and to stand by the gifted composer, Bourgeois, who was thrown into prison for breaking some of the rigid disciplines of Geneva of which Calvin was himself the main author. Abraham Kuyper, in his admirable Lectures on Calvinism, so aptly remarks, “Music…would flourish, henceforth, not within the narrow limitation of particular grace, but in the wide and fertile fields of common grace.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Singing the Words God Has Put in Our Mouths”</cite>, (originally published in The Hymn, January 1953), in John H. Gerstner: The Early Writings, vol. 1, pp. 204-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

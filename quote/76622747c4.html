<blockquote><p>Although certain ordinations of the apostles (which referred to the rites and circumstances of divine worship) were variable and instituted only for a time (as the sanction of not eating blood and of things strangled [Acts 15:20]; concerning the woman’s head being covered and the man’s being uncovered when they prophesy [1 Cor. 11:4, 5]) because there was a special cause and reason for them and (this ceasing) the institution itself ought to cease also; still there were others invariable and of perpetual observance in the church, none of which were founded upon any special occasion to last only for a time by which they might be rendered temporary…</p></blockquote>

</figure><figure class="quote" id="q-27b38c5889" data-kw="">
<blockquote><p>And here also [regarding worship] we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and unseparable concomitants of both civil, natural, and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individual proprieties of every man: forma, figura, locus, tempus, strips[?], patria, nomen. Under form and figure: The first two, I comprehend, such a proportion of body, a man of a high stature, or low; a man beautiful, or not beautiful, to which I crave leave to reduce all external forms of habits [garments], as clothes, the head covered, or not covered, the situation of the body, as they are in themselves, mere physical acts; kneeling, sitting, standing; the eyes cast down to the earth, or lifted up; the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural, time, place, family, country, name, as such a person… 1. All these are common concomitants of civil, natural, and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people; or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit, some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions, because neither actions natural, civil, nor religious, can be performed, but by some persons, in some habit and gesture, in some time, in some place: And lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and unseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak in this place, rather than that place (so it be not, locus ut sic, of intention, such a religious place, before the image of Christ, or the Father, or the Virgin Mary) the praying is neither the more, or the less acceptable to God because of these common and unseparable adjuncts… …to my knowledge all these that are mere physical circumstances, are particularly enumerated, such as are: 1. time: 2. place, 3. person, or agent: 4. name. 5. family: 6. condition, as country, family, house: 7. habits or garments: 8. gestures, as sitting, standing, lifting of the eyes or hands, knocking on the breast, kneeling, and there is no blind in this enumeration, for there be no other particulars that can be enumerated [that do not fall into one of these categories]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction | section 1, pp. 2-3</span></figcaption>

%2C+some+gesture+in+the+doing+of+all+these+actions%2C+and+they+are+unseparable+adjuncts+of+all+these+actions%2C+because+neither+actions+natural%2C+civil%2C+nor+religious%2C+can+be+performed%2C+but+by+some+persons%2C+in+some+habit+and+gesture%2C+in+some+time%2C+in+some+place%3A+And+lastly%2C+they+are+mere+circumstantials%2C+and+contribute+no+moral+goodness+or+badness+to+the+actions%2C+as+they+are+but+common+and+unseparable+circumstances%3B+for+because+he+preaches+in+time%2C+or+in+place+simply%2C+the+preaching+is+neither+morally+good%2C+nor+ill%2C+better+or+worse%2C+because+Thomas+prays+in+gown+or+cloak+in+this+place%2C+rather+than+that+place+%28so+it+be+not%2C+locus+ut+sic%2C+of+intention%2C+such+a+religious+place%2C+before+the+image+of+Christ%2C+or+the+Father%2C+or+the+Virgin+Mary%29+the+praying+is+neither+the+more%2C+or+the+less+acceptable+to+God+because+of+these+common+and+unseparable+adjuncts%E2%80%A6+%E2%80%A6to+my+knowledge+all+these+that+are+mere+physical+circumstances%2C+are+particularly+enumerated%2C+such+as+are%3A+1.+time%3A+2.+place%2C+3.+person%2C+or+agent%3A+4.+name.+5.+family%3A+6.+condition%2C+as+country%2C+family%2C+house%3A+7.+habits+or+garments%3A+8.+gestures%2C+as+sitting%2C+standing%2C+lifting+of+the+eyes+or+hands%2C+knocking+on+the+breast%2C+kneeling%2C+and+there+is+no+blind+in+this+enumeration%2C+for+there+be+no+other+particulars+that+can+be+enumerated+%5Bthat+do+not+fall+into+one+of+these+categories%5D%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government...+%281646%29+%7C+Introduction+%7C+section+1%2C+pp.+2-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27b38c5889.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27b38c5889.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=And%20here%20also%20%5Bregarding%20worship%5D%20we,fall%20into%20one%20of%20these%20categories&amp;text=And%20here%20also%20%5Bregarding%20worship%5D%20we%20consider%20things&amp;text=do%20not%20fall%20into%20one%20of%20these%20categories" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(4) …1 Tim. 2:9. And therefore the leaving the breasts naked, in whole or in part, is a transgression of this rule; they uncover their nakedness which they should vail and hide, especially in God’s presence: as the apostle says, 1 Cor. 11:10, ‘The woman ought to have power on her head, because of the angels.’ In the assembly there you meet with angels and devils; angels to observe your garb and carriage, and devils to tempt you; therefore be covered because of the angels. Yet usually women come hither with a shameless impudence into the presence of God, men and angels. This is a practice that neither suits with modesty nor conveniency; nothing can be alleged for it but reasons of pride and wantonness; it feeds your own pride and provokes lust in others. You would think they were wicked women that should offer others poison to drink; they do that which is worse, lay a snare for the soul, uncover that which should be covered; lest you provoke others of your rank to imitate your vanity, if they should not by the fear of God be guarded from unclean thoughts and filthy desires.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“(4) …1 Tim. 2:9. And therefore the leaving the breasts naked, in whole or in part, is a transgression of this rule; they uncover their nakedness which they should vail and hide, especially in God’s presence: as the apostle says, 1 Cor. 11:10, ‘The woman ought to have power on her head, because of the angels.’ In the assembly there you meet with angels and devils; angels to observe your garb and carriage, and devils to tempt you; therefore be covered because of the angels. Yet usually women come hither with a shameless impudence into the presence of God, men and angels. This is a practice that neither suits with modesty nor conveniency; nothing can be alleged for it but reasons of pride and wantonness; it feeds your own pride and provokes lust in others. You would think they were wicked women that should offer others poison to drink; they do that which is worse, lay a snare for the soul, uncover that which should be covered; lest you provoke others of your rank to imitate your vanity, if they should not by the fear of God be guarded from unclean thoughts and filthy desires.”

— Thomas Manton, A Fourth Volume containing One Hundred &amp; Fifty Sermons on Several Texts of Scripture in Two Parts: part the First Containing LXXIV Sermons... (London, 1693), Several Sermons upon Titus 2:11-14, Sermon 8, 3rd Branch, Sobriety in Apparel, p. 78">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%284%29+%E2%80%A61+Tim.+2%3A9.+And+therefore+the+leaving+the+breasts+naked%2C+in+whole+or+in+part%2C+is+a+transgression+of+this+rule%3B+they+uncover+their+nakedness+which+they+should+vail+and+hide%2C+especially+in+God%E2%80%99s+presence%3A+as+the+apostle+says%2C+1+Cor.+11%3A10%2C+%E2%80%98The+woman+ought+to+have+power+on+her+head%2C+because+of+the+angels.%E2%80%99+In+the+assembly+there+you+meet+with+angels+and+devils%3B+angels+to+observe+your+garb+and+carriage%2C+and+devils+to+tempt+you%3B+therefore+be+covered+because+of+the+angels.+Yet+usually+women+come+hither+with+a+shameless+impudence+into+the+presence+of+God%2C+men+and+angels.+This+is+a+practice+that+neither+suits+with+modesty+nor+conveniency%3B+nothing+can+be+alleged+for+it+but+reasons+of+pride+and+wantonness%3B+it+feeds+your+own+pride+and+provokes+lust+in+others.+You+would+think+they+were+wicked+women+that+should+offer+others+poison+to+drink%3B+they+do+that+which+is+worse%2C+lay+a+snare+for+the+soul%2C+uncover+that+which+should+be+covered%3B+lest+you+provoke+others+of+your+rank+to+imitate+your+vanity%2C+if+they+should+not+by+the+fear+of+God+be+guarded+from+unclean+thoughts+and+filthy+desires.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Fourth+Volume+containing+One+Hundred+%26+Fifty+Sermons+on+Several+Texts+of+Scripture+in+Two+Parts%3A+part+the+First+Containing+LXXIV+Sermons...+%28London%2C+1693%29%2C+Several+Sermons+upon+Titus+2%3A11-14%2C+Sermon+8%2C+3rd+Branch%2C+Sobriety+in+Apparel%2C+p.+78&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2575a7f8ab.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2575a7f8ab.html">Perm

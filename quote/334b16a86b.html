<main class="wrap"><figure class="quote" id="q-334b16a86b" data-kw="">
<blockquote><p>The Sabbath, which was consecrated in paradise when man was innocent (Gen. ii. 3), is much more necessary now, when men are fallen and tempted. Instituted to commemorate the work of creation (Gen. i. 31, ii. 1-8), it is not less useful now when it commemorates, together with the works of God in nature, his greater work of redemption. — (John xx. 19, 26; Rev. i. 10.)

The law of the Sabbath, which the Almighty himself proclaimed to Israel, and wrote on a table of stone, with nine other laws of universal and eternal obligation, to show its perpetual importance to the welfare of men (Exod. xx. 1, xxxi. 18, xxxii. 15), has lost nothing of its value from the lapse of ages, the progress of civilisation, and the increase of secular knowledge.

The hearty consecration of that day, to which God has attached such important blessings (Isa. Ivi. 2, Iviii. 13, 14; Ezek. xx. 10-24; Neh. xiii. 18), must still secure his approbation; and, since our Lord has declared that “the Sabbath is made for man” (Mark ii. 27), it must be well adapted to promote both his spiritual and his temporal welfare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/baptist-w-noel.html">Baptist W. Noel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface in The Christian Sabbath, Considered in its Various Aspects by Ministers of Different Denominations. With Preface by the Hon. and Rev. Baptist W. Noel</cite></span></figcaption>

</figure><figure class="quote" id="q-7e86e768d8" data-kw="">
<blockquote><p>In his book, English Popish Ceremonies, George Gillespie points out that the English Puritans and the Scottish Covenanters were not the only people in the Reformed world who opposed the religious observance of extra-biblical festivals (holy days were called holidays in Gillespie’s time):

As touching the judgment of divines, we say 1. Many divines disallow of festival days, and wish the church, were free of them. For the Belgic churches, in their synod, anno 1578, wished that the six days might be wrought upon, and that the Lord’s day alone might be celebrated. And Luther in his book, de Bonis Operibus, wished that there were no feast-days among Christians but the Lord’s day. […] The old Waldenses also, whose doctrine was restored and propagated by John Huss, and Jerome of Prague, after Wicklif, and that with the congratulation of the church of Constantinople, held, that they were to rest from labour upon no day but upon the Lord’s day, whereby it appeareth that holidays have had adversaries before us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English Popish ceremonies obtruded on the Church of Scotland</cite>, (1637; Edinburgh, 1844), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

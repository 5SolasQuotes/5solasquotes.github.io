<blockquote><p>Yea there are among you now many things of a lower [superstitious] nature, which some dare scarce plainly say God commands or forbids, and yet they are censorious enough about them: …That it is unlawful to keep any anniversary day of humiliation or thanksgiving of man’s appointment.</p></blockquote>

<blockquote><p>§46. 6. And as for holy days, there is great difference between them: Those are liable to most question that are obtruded on the Church with the greatest confidence. As for such days as are appointed upon some emergent occasions that arose since Scripture was indited, and are not common to all times and places of the Church, there is no more question whether the magistrate may command them, or the pastors agree upon them, than whether a lecture-day, or fast-day, or thanksgiving-day may be commanded or agreed on: some time for God’s worship besides the Lord’s Day must be appointed: And God having not told us which, the magistrate may, on fit occasions. And this is no derogation from the sufficiency of Scripture: For the occasion of the day was not existent when the Scripture was written: such occasions are various according to the various state of the Church in several ages and countries. And therefore to keep an anniversary day of thanksgiving, such as we keep on the fifth of November for our deliverance from the Papists’ powder plot, is no more questionable than to keep a lecture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London: R.W., 1659), 5th Disputation, ch. 2</cite>, p. 412</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

<blockquote><p>Because, then, there is plainly no reason why any one festival should stay, and another should go away; because also it cannot be denied that they have all done harm, and the greatest have done the most harm; so we will allow ourselves to use only Sunday for celebration, which brotherly love alone requires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grund und ursach auß gotlicher schrifft, 1525</cite></span></figcaption>

</figure><figure class="quote" id="q-9714cc21b3" data-kw="">
<blockquote><p>5. By their fruits shall we know them; look whether they give so much liberty to others and take so much to themselves upon their holy days for staying from the public worship and attending wordly business, as they do at the diets of weekly and ordinary preaching: yet they would make the simple believe that their holy days are only appointed to be kept as those ordinary times set apart for divine service on the week-days. Nay, moreover, let it be observed, whether or not they keep the festival days more carefully, and urge the keeping of them more earnestly than the Lord’s own day. Those prelates that will not abase themselves to preach upon ordinary Sabbaths, think the high holy days worthy of their sermons. They have been also often seen to travel upon the Lord’s Day, whereas they hold it religion to travel upon a holy day. And whereas they can digest the common profanation of the Lord’s Day and not challenge it, they cannot away with the not observing of their festivities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 3, ch. 1</cite>, pp. 12-13</span></figcaption>

<blockquote><p>Concerning ceremonial festivals of man’s making, our practice cannot be objected, because we observe none. We take occasion of hearing and praying upon any day when occasion is offered. We say (with [Rudolph] Hospinian [d. 1626], [in Latin] Of Christian Festivals, ch. 2 [1611/74]) ‘Not the day, but the Word of God… puts us in mind of the nativity, resurrection and ascension of Christ.&#x27;</p></blockquote>

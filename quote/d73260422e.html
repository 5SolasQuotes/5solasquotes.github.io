<main class="wrap"><figure class="quote" id="q-d73260422e" data-kw="">
<blockquote><p>As for schismatics, that is, those who separate themselves from true Christian churches for some slight cause, whether in doctrine or discipline, our theologians distinguish between the authors of the schism and the people deceived by them. As for the authors of the schism, since they break the bond of charity, they acknowledge that they cannot belong to the invisible Church, whose bond and communion consist in faith, hope, and charity. But concerning the deceived people or those born in schism, they are less rigid and believe that there can be good men among them, not alien to the body of Christ but joined to it by true faith and charity; nor do they entirely exclude schismatic churches from the visible Church if they retain the foundations of doctrine and discipline, since they reserve this honor only for those who deny and overthrow the fundamentals of faith and discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Elucidation of the Status of Controversies about the Church Militant, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683)</cite>, p. 1,056</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-8bce28ac69" data-kw="">
<blockquote><p>§7. Differing opinions or practices about things indifferent, no nor about the mere integrals of religion [those things which complete religion and make it whole], which are not essentials, do not make men of different religions or Churches (universally considered). (Rom. 14 &amp; 15; Gal. 2:13-15; Phil. 3:16-17) §8. Nothing will warrant us to separate from a church as no church, but the want [lack] of something essential to a church. §9. The essential or constitutive parts of the Church-catholic (or universal) are Christ the Head and all Christians as the members. (Eph. 1:22 &amp; 4:15; Col. 1:18 &amp; 2:19; 1 Cor. 12:27; Eph. 4:12 &amp; 5:23; Mt. 28:19; 1 Cor. 5) … §13. He that does not nullify or unchurch a church, may lawfully remove from one church to another, and make choice of the best and purest, or that which is most suited to his own edification, if he be a free-man. §14. But in case of such choice or personal removal, the interest of the whole Church, or of religion in common, must be first taken into consideration by him that would rightly judge of the lawfulness of the fact. (Rom. 9:3; 1 Cor. 12:25-26) §15. If a Church which in all other respects is purest and best, will impose any sin upon all that will have local communion with it, though we must not separate from that Church as no Church, yet must we not commit that sin, but patiently suffer them to exclude us from their communion. (Rom. 3:8) §16. True heresy (that is, an error contradictory to an essential article of the Christian Faith) if it be seriously and really held, so that the contrary truth is not held seriously and really, does nullify the Christianity of him that holds it, and the Church-state of that congregation which so professes it. But so does not that fundamental error which is held but in words through ignorance, thinking it may consist with the contrary truth, while that truth is not denied, but held majore fide [with greater faith]; so that we have reason to believe that if they did discern the contradiction, they would rather forsake the error than the truth. (Tit. 3:10; 2 Jn. 10; Heb. 5:11-12; 1 Cor. 15:1-2, etc. Lk. 18:34; Jn. 12:16; Gal. 5:2 &amp; 1:7-9 &amp; 3:1-2; In isto factiosissimo soeculo, vix quisquam eximie doctus haereseos suspicione carebat. [In that most partisan age, scarcely anyone who was exceptionally learned was free from suspicion of heresy.] Erasmus in The Life of Jerome. Et profecto ita est, ut id habendum sit antiquissimum et Deo proximum, quod sit optimum. [And indeed it is so: that which is best must be regarded as both the most ancient and the closest to God.] Cicero, Of Laws, bk. 2, p. 244)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons of the Christian Religion, the First Part... (London: White, 1667), pt. 2, ch. 13</cite>, pp. 465-66</span></figcaption>

</figure><figure class="quote" id="q-edb152a677" data-kw="">
<blockquote><p>All the difference of religion, which is at this day between the Church of Rome and the Protestants, lies in some certain points which the Church of Rome maintains as important, and necessary articles of the Christian faith: whereas the Protestants, on the contrary, neither believe nor will receive them as such. For as for those matters which the Protestants believe, which they conceive to be the fundamentals of religion, they are evidently and undeniably such, that even their enemies admit and receive them as well as they: inasmuch as they are both clearly delivered in the Scriptures, and expressly admitted by the ancient councils and Fathers ; and are indeed unanimously received by the greatest part of Christians in all ages, and in different parts of the world. But now their adversaries add to these many other points, which they press and command men to believe as necessary; and such as, without believing in, there is no possible hope of salvation. As for example: that the Pope of Rome is the head and supreme monarch of the whole Christian Church throughout the world, that he, or at least the Church which he acknowledges a true one, cannot possibly err in matters of faith… which their adversaries plainly protest that they cannot with a safe conscience believe. These points are the ground of the whole difference between them; the one party pretending that they have been believed and received by the Church of Christ in all ages as revealed by him; and the other maintaining the contrary.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“All the difference of religion, which is at this day between the Church of Rome and the Protestants, lies in some certain points which the Church of Rome maintains as important, and necessary articles of the Christian faith: whereas the Protestants, on the contrary, neither believe nor will receive them as such. For as for those matters which the Protestants believe, which they conceive to be the fundamentals of religion, they are evidently and undeniably such, that even their enemies admit and receive them as well as they: inasmuch as they are both clearly delivered in the Scriptures, and expressly admitted by the ancient councils and Fathers ; and are indeed unanimously received by the greatest part of Christians in all ages, and in different parts of the world. But now their adversaries add to these many other points, which they press and command men to believe as necessary; and such as, without believing in, there is no possible hope of salvation. As for example: that the Pope of Rome is the head and supreme monarch of the whole Christian Church throughout the world, that he, or at least the Church which he acknowledges a true one, cannot possibly err in matters of faith… which their adversaries plainly protest that they cannot with a safe conscience believe. These points are the ground of the whole difference between them; the one party pretending that they have been believed and received by the Church of Christ in all ages as revealed by him; and the other maintaining the contrary.”

— John Daillie, ‘Author’s Preface’ in A Treatise on the Right Use of the Fathers in the Decision of Controversies Existing at this Day in Religion 2nd ed. (1631; Philadelphia, 1856), pp. 17-21, pp. 17-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+the+difference+of+religion%2C+which+is+at+this+day+between+the+Church+of+Rome+and+the+Protestants%2C+lies+in+some+certain+points+which+the+Church+of+Rome+maintains+as+important%2C+and+necessary+articles+of+the+Christian+faith%3A+whereas+the+Protestants%2C+on+the+contrary%2C+neither+believe+nor+will+receive+them+as+such.+For+as+for+those+matters+which+the+Protestants+believe%2C+which+they+conceive+to+be+the+fundamentals+of+religion%2C+they+are+evidently+and+undeniably+such%2C+that+even+their+enemies+admit+and+receive+them+as+well+as+they%3A+inasmuch+as+they+are+both+clearly+delivered+in+the+Scriptures%2C+and+expressly+admitted+by+the+ancient+councils+and+Fathers+%3B+and+are+indeed+unanimously+received+by+the+greatest+part+of+Christians+in+all+ages%2C+and+in+different+parts+of+the+world.+But+now+their+adversaries+add+to+these+many+other+points%2C+which+they+press+and+command+men+to+believe+as+necessary%3B+and+such+as%2C+without+believing+in%2C+there+is+no+possible+hope+of+salvation.+As+for+example%3A+that+the+Pope+of+Rome+is+the+head+and+supreme+monarch+of+the+whole+Christian+Church+throughout+the+world%2C+that+he%2C+or+at+least+the+Church+which+he+acknowledges+a+true+one%2C+cannot+possibly+err+in+matters+of+faith%E2%80%A6+which+their+adversaries+plainly+protest+that+they+cannot+with+a+safe+conscience+believe.+These+points+are+the+ground+of+the+whole+difference+between+them%3B+the+one+party+pretending+that+they+have+been+believed+and+received+by+the+Church+of+Christ+in+all+ages+as+revealed+by+him%3B+and+the+other+maintaining+the+contrary.%E2%80%9D%0A%0A%E2%80%94+John+Daillie%2C+%E2%80%98Author%E2%80%99s+Preface%E2%80%99+in+A+Treatise+on+the+Right+Use+of+the+Fathers+in+the+Decision+of+Cont

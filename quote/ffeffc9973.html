<blockquote><p>In mentioning the Spirit’s indwelling and working… we make believers the subject: Because though faith itself be the gift of God, yet there is so much greater and more eminent grace given after faith, and on condition of believing, than the grace is which enables us to believe, that it is only the giving of that greater measure (and extraordinary gifts) which in the New Testament is usually called the ‘giving of the Spirit’: For (as Mr. Thomas Hooker and others express it) the Spirit in working faith does but, as it were, make his way into the soul, and then dwells and works there afterwards; as (says he) some birds first make their way into a hard tree by stocking a hole in it, and afterward make their nests and lay their young there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 24</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b21925d580" data-kw="">
<blockquote><p>Question: By what means do we receive or draw these virtues from Christ, or enjoy them in Him? Answer: This is only by faith of Him, that is, by faith receiving or going to Christ’s person, pitching on Him alone as revealed and offered in the Gospel. Doctrine: Faith in Christ’s person, name, is the only means of receiving all saving virtues from Christ, when we believe the Gospel and glad tidings offering us Christ’s person with all his benefits and virtues, and behold Him to be such a one towards us as the Gospel reveals and offers Him to us, that is, our wisdom, righteousness, sanctification, and redemption, our King, Priest, and Prophet, then is He indeed become such a one towards us, and we are made such in Him.</p></blockquote>

</figure><figure class="quote" id="q-e54df171fc" data-kw="">
<blockquote><p>Repentance goes before justification, even as faith and hope; for of the Baptist it is said, that he preached the baptism of repentance for the remission of sins, Mk. 1:4; Lk. 3:3. But regeneration follows justification; for, being justified, we receive the Spirit of sanctification, whereby we are renewed, and, as it were, find a new creature begun even in this life. Repentance is the cause, regeneration is the effect; for therefore God does renew us in Christ, and make us new men, because we repent us of our old life, and begin to be wise after sin committed. Notwithstanding in the middle place, betwixt repentance and regeneration, comes in justification, when as God does of his mere mercy account and repute us as just. The name of repentance implies sorrow, but the name of regeneration gladness. To conclude, the points of repentance, as whence it proceeds and whereunto it tends, they are deeds, the evil or sin committed, and the good which ought to be practised; but the bounds of regeneration are qualities — inherent corruption, and sanctity or holiness, which is wrought in us; the old man and new man renewed in Christ. …For every change of the mind is not to be deemed forthwith regeneration, but there are certain changes of man’s mind which go before regeneration, and which prepare the mind, and so the whole man, unto regeneration, and to that new creation; in which kind repentance is a special grace. These things are to be distinguished not in time but in nature; for at that very same instant, we believe, and be effectually called, and do repent, and be justified, and be regenerate.</p></blockquote>

</figure><figure class="quote" id="q-d7c9d09d0f" data-kw="">
<blockquote><p>1. That it is necessary for salvation, Jn. 3:3. 2. That regeneration is one action in species, and consequently always one and uniform for all, as to essentials. 3. That it is instantaneous, or that it happens in an instant. But what is said by some to be successive is to be understood of the whole complex or collection of the terminus in the first and second moment; but we here treat of the terminus of regeneration in the first moment. 4. That it is perfect (as also all actions of God) according to the divine idea and intention; in the same way the first creation of all things was perfect. But I say it is perfect not only in itself and by reason of God operating (to whom no defect can happen), but also by reason of the terminus and intended effect, and of the operation proportionate to it. 5. That it is supernatural, transcending the whole of nature and its works and the order constituted in creation, Matthew 16:17; John 1:9–10, 12–13. 6. That consequently it is of God alone, no less than creation and resuscitation, Romans 4:17. 7. That the mode of operating or causality of God regenerating is physical, by which one thing is directly changed into another, and the new creature is produced and introduced. 8. That the same is nevertheless called moral or objective, not in itself and with respect to regeneration as such, but by reason of its adjunct, whether antecedent or concomitant, namely, calling. 9. That it is infallible by reason of God’s intention and the event, and irresistible and invincible by reason of the mode and efficacy of operating. For although man according to his innate depravity can do nothing but resist in the divided sense, yet actually he does not resist nor can he resist in the composite sense, when the Holy Spirit regenerating removes resistibility by impressing a new principle of spiritual life. 10. Therefore no voluntary or involuntary of man has place in this first moment, because no human action intervenes, but it is the action of God alone. So that the will conducts itself neutrally and purely passively with respect to the new principle, here willing or not willing nothing. Yet regeneration could be called voluntary as to man by extrinsic denomination from the consequent effect, or by a certain extrinsic respect, on account of the subsequent (not indeed antecedent or simultaneous) consent of the will, or new and regenerate volition, by which, excited by second grace in the second moment, man himself begins to will the spiritual goods offered through calling according to the new will divinely impressed, and according as the Holy Spirit made him willing from unwilling, and works in him τὸ θέλειν [to thelein, the willing] and to accomplish. 11. Finally, that it is difficult if you look to nature and flesh, yet easy if you look to τὸ κράτος τῆς ἰσχύος [to kratos tēs ischuos, the might of the power] divine, Matthew 19:23–26, compared with Ephesians 1:19; Proverbs 21:1; Romans 11:23. Hence omnipotent facility and easy omnipotence are attributed to God regenerating.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. That it is necessary for salvation, Jn. 3:3. 2. That regeneration is one action in species, and consequently always one and uniform for all, as to essentials. 3. That it is instantaneous, or that it happens in an instant. But what is said by some to be successive is to be understood of the whole complex or collection of the terminus in the first and second moment; but we here treat of the terminus of regeneration in the first moment. 4. That it is perfect (as also all actions of God) according to the divine idea and intention; in the same way the first creation of all things was perfect. But I say it is perfect not only in itself and by reason of God operating (to whom no defect can happen), but also by reason of the terminus and intended effect, and of the operation proportionate to it. 5. That it is supernatural, transcending the whole of nature and its works and the order constituted in creation, Matthew 16:17; John 1:9–10, 12–13. 6. That consequently it is of God alone, no less than creation and resuscitation, Romans 4:17. 7. That the mode of operating or causality of God regenerating is physical, by which one thing is directly changed into another, and the new creature is produced and introduced. 8. That the same is nevertheless called moral or objective, not in itself and with respect to regeneration as such, but by reason of its adjunct, whether antecedent or concomitant, namely, calling. 9. That it is infallible by reason of God’s intention and the event, and irresistible and invincible by reason of the mode and efficacy of operating. For although man according to his innate depravity can do nothing but resist in the divided sense, yet actually he does not resist nor can he resist in the composite sense, when the Holy Spirit regenerating removes resistibility by impressing a new principle of spiritual life. 10. Therefore no voluntary or involuntary of man has place in this first moment, because no human action intervenes, but it is the action of God alone. So that the will conducts itself neutrally and purely passively with respect to the new principle, here willing or not willing nothing. Yet regeneration could be called voluntary as to man by extrinsic denomination from the consequent effect, or by a certain extrinsic respect, on account of the subsequent (not indeed antecedent or simultaneous) consent of the will, or new and regenerate volition, by which, excited by second grace in the second moment, man himself begins to will the spiritual goods offered through calling according to the new will divinely impressed, and according as the Holy Spirit made him willing from unwilling, and works in him τὸ θέλειν [to thelein, the willing] and to accomplish. 11. Finally, that it is difficult if you look to nature and flesh, yet easy if you look to τὸ κράτος τῆς ἰσχύος [to kratos tēs ischuos, the might of the power] divine, Matthew 19:23–26, compared with Ephesians 1:19; Proverbs 21:1; Romans 11:23. Hence omnipotent facility and easy omnipotence are attributed to God regenerating.”

— Gisbertus Voetius, Select Theological Disputations (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+That+it+is+necessary+for+salvation%2C+Jn.+3%3A3.+2.+That+regeneration+is+one+action+in+species%2C+and+consequently+always+one+and+uniform+for+all%2C+as+to+essentials.+3.+That+it+is+instantaneous%2C+or+that+it+happens+in+an+instant.+But+what+is+said+by+some+to+be+successive+is+to+be+understood+of+the+whole+complex+or+collection+of+the+terminus+in+the+first+and+second+moment%3B+but+we+here+treat+of+the+terminus+of+regeneration+in+the+first+moment.+4.+That+it+is+perfect+%28as+also+all+actions+of+God%29+according+to+the+divine+idea+and+intention%3B+in+the+same+way+the+first+creation+of+all+things+was+perfect.+But+I+say+it+is+perfect+not+only+in+itself+and+by+reason+of+God+operating+%28to+whom+no+defect+can+happen%29%2C+but+also+by+reason+of+the+terminus+and+intended+effect%2C+and+of+the+operation+proportionate+to+it.+5.+That+it+is+supernatural%2C+transcending+the+whole+of+nature+and+its+works+and+the+order+constituted+in+creation%2C+Matthew+16%3A17%3B+John+1%3A9%E2%80%9310%2C+12%E2%80%9313.+6.+That+consequently+it+is+of+God+alone%2C+no+less+than+creation+and+resuscitation%2C+Romans+4%3A17.+7.+That+the+mode+of+operating+or+causality+of+God+regenerating+is+physical%2C+by+which+one+thing+is+directly+changed+into+another%2C+and+the+new+creature+is+produced+and+introduced.+8.+That+the+same+is+nevertheless+called+moral+or+objective%2C+not+in+itself+and+with+respect+to+regeneration+as+such%2C+but+by+reason+of+its+adjunct%2C+whether+antecedent+or+concomitant%2C+namely%2C+calling.+9.+That+it+is+infallible+by+reason+of+God%E2%80%99s+intention+and+the+event%2C+and+irresistible+and+invincible+by+reason+of+the+mode+and+efficacy+of+operating.+For+although+man+according+to+his+innate+depravity+can+do+nothing+but+resist+in+the+divided+sense%2C+yet+actually+he+does+not+resist+nor+can+he+resist+in+the+composite+sense%2C+when+the+Holy+Spirit+regenerating+removes+resistibility+by+impressing+a+new+principle+of+spiritual+life.+10.+Therefore+no+voluntary+or+involuntary+of+man+has+place+in+this+first+moment%2C+because+no+human+action+intervenes%2C+but+it+is+the+action+of+God+alone.+So+that+the+will+conducts+itself+neutrally+and+purely+passively+with+respect+to+the+new+principle%2C+here+willing+or+not+willing+nothing.+Yet+regeneration+could+be+called+voluntary+as+to+man+by+extrinsic+denomination+from+the+consequent+effect%2C+or+by+a+certain+extrinsic+respect%2C+on+account+of+the+subsequent+%28not+indeed+antecedent+or+simultaneous%29+consent+of+the+will%2C+or+new+and+regenerate+volition%2C+by+which%2C+excited+by+second+grace+in+the+second+moment%2C+man+himself+begins+to+will+the+spiritual+goods+offered+through+calling+according+to+the+new+will+divinely+impressed%2C+and+according+as+the+Holy+Spirit+made+him+willing+from+unwilling%2C+and+works+in+him+%CF%84%E1%BD%B8+%CE%B8%CE%AD%CE%BB%CE%B5%CE%B9%CE%BD+%5Bto+thelein%2C+the+willing%5D+and+to+accomplish.+11.+Finally%2C+that+it+is+difficult+if+you+look+to+nature+and+flesh%2C+yet+easy+if+you+look+to+%CF%84%E1%BD%B8+%CE%BA%CF%81%CE%AC%CF%84%CE%BF%CF%82+%CF%84%E1%BF%86%CF%82+%E1%BC%B0%CF%83%CF%87%CF%8D%CE%BF%CF%82+%5Bto+kratos+t%C4%93s+ischuos%2C+the+might+of+the+power%5D+divine%2C+Matthew+19%3A23%E2%80%9326%2C+compared+with+Ephesians+1%3A19%3B+Proverbs+21%3A1%3B+Romans+11%3A23.+Hence+omnipotent+facility+and+easy+omnipotence+are+attributed+to+God+regenerating.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29%2C+p.+447+ff.+tr.+AI+by+Roman+Prestarri+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd7c9d09d0f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a

<main class="wrap"><figure class="quote" id="q-22776c76f8" data-kw="">
<blockquote><p>…[Magistrates, during a time of plague] must follow the example of David in this place who humbled himself before the Lord, who prayed for himself and for the people, and built an altar and offered up sacrifice; that is, they must maintain God’s truth to the uttermost of their power; they must set forward the preaching of the Word; they must with good Hezekiah and Josiah remove all idolatry and superstition (2 Kings 18:4; 23:4); they must also with David labor to find out the cause of God’s punishment, and remove it as he did when famine was in his land (2 Sam. 21:1,9)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cupper.html">William Cupper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 341 of Sermon 10 in Certain Sermons Concerning God’s Late Visitation in the City of London and other parts of the land, teaching all men to make use thereof, that mean to profit by God’s fatherly chastisements… (London, 1592)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-833ea0c68f" data-kw="">
<blockquote><p>They that shall adventure to bring into the city and to sell things forbidden are worthily to be punished with the loss of the things themselves. The same punishment is to be laid upon the buyers, if they yet now have with them the things whole and untouched: otherwise let the punishment be equal unto the price of the things. He that is found selling of profitable things, as meats or drinks, in any other place than in the place appointed, let him bear the loss of all that he sets to sale. Whosoever of his own private authority shall covetously increase the price of things sellable above that [which] is reasonable or above the appointed rate, let him be under the punishment of unlawful usuries, and for a time forbidden to occupy any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 2, ch. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-9e80044434" data-kw="">
<blockquote><p>And here comes in the way that general bond wherewith man is especially bound unto man, and that without taking away of humanity itself, cannot be broken; There is also another bond binding every citizen unto his country and city. But both these bonds I affirm to be natural and universal, that everyone must have regard of his estate, and calling; for some serve in public offices, either civil, or the ministry; the rest are private persons… …yet, lest in this case [of flight], any man by flattering of himself, might sin against his neighbour [in neglecting his duty towards him], it is the duty of a Christian magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague</cite>, … (London, 1580; rep. 1665), p. 18</span></figcaption>

the%20way%20that%20general&amp;text=the%20sick%20of%20the%20plague%20want%20%5Black%5D%20nothing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d2bbf9aba6" data-kw="">
<blockquote><p>If we take care of our bodily safety, by flying the company of such as have the plague, yea if we take care of the safety of our beasts, and would not to our knowledge suffer a scabbed or rotten sheep to infect the rest, shall we not much more take care of our own and neighbors’ souls, by avoiding and warning others to avoid the fellowship of the ungodly, whereby spiritual infection comes.</p></blockquote>

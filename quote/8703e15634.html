<main class="wrap"><figure class="quote" id="q-8703e15634" data-kw="">
<blockquote><p>There is no doctrine objectively of absolute necessity to salvation, but the doctrine of the Baptismal Covenant which is expounded in the [Apostles’] Creed, Lord’s prayer and Decalogue. But there is much doctrinal and active means necessary to make men uUnderstand, Believe, Love and Practice this necessary Covenant doctrine. And the doctrine or articles of faith, will save none that do not understand, believe, love, and practise it, and that sincerely preferring the things revealed before all the pleasures, riches and honors of this world. A parrot shall not be a saint for saying the Creed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 6, pp. 85-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6595eacc6b" data-kw="">
<blockquote><p>That in endeavoring union and healing men would not straiten it to an universal union in everything, in judgement and practice, but would resolve to have it with many things defective that need forbearance in persons that are united, which men may take up in these particulars: 1. There may be difference of judgement in many things, I mean in such things that are consistent with the foundation and edification; and such a forbearance would be resolved upon, and to do otherways were to think that either men had no reason at all, or that their understandings were perfect, or at least of equal reach. 2… certainly, if people ought to carry even to corrupt ministers who yet destroy not the foundation, as ministers, in the duties that becomes them to ministers in communion with them, while they continue such, then certainly ministers ought to keep that communion with ministers, that becomes their relations, seeing they are still ministers in that respect, as well as in the other. And if this corruption will not warrant separation in other ordinances, as was said in the close of the second part, then neither will it warrant division in the ordinance of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (Edinburgh: Higgins, 1659), pt. 4, ch. 7, ‘General Grounds leading to Unity’, pp. 316–18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

ent&amp;text=That%20in%20endeavoring%20union%20and%20healing%20men%20would&amp;text=it%20warrant%20division%20in%20the%20ordinance%20of%20government" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-917f4352cb" data-kw="">
<blockquote><p>But mistake me not, I speak not this of all kind of errors in judgement, what man is he that errs not? All errors are sinful, but all errors are not damning: all errors are hurtful, but all errors are not destructive and undoing errors. I told you there were some errors which were building errors, and some which were fundamental errors: as the apostle speaks, 1 Cor. 3:10-12, etc. In the one the work shall be burnt, in the other the workman. One shall be saved, but so saved as by fire, the other shall be destroyed in fire; work and workman, person and errors shall perish together, 1 Cor. 3:13-15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, ... (1646), p. 51</span></figcaption>

<blockquote><p>Lastly, there may be corruption in the translation of the Word and in the Church’s interpretation of the Word, and so false doctrines arise and be maintained; yet not being in the fundamental points of the Covenant before mentioned, the Church may be a true church, though corrupted.</p></blockquote>

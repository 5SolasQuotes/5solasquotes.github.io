<blockquote><p>[Election is God’s] eternal, most wise, and immutable decree, constituted by Him in eternity, by which certain men in the trap of deepest sin and death, and one with all the fallen are, according to his merciful will, rescued graciously through Christ.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1952f7ea61" data-kw="immutable election">

</figure><figure class="quote" id="q-5f317cf4ce" data-kw="">
<blockquote><p>Of what sort of men is election? Of such as are uncleane and ungodly in the sight of God. “For He has chosen us that we might be holy and without blame,” Eph. 1:4. But whereas He chose us before the world was made, it is effected that God set before his eyes all men that ever should be, and for as much as they would be ungodly and accursed, He likewise so considered them and so chose some out of the common lump and filth of men, and those freely according to the good pleasure of his will, leaving others in their sin and curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London: 1606), Place 36, ‘Of Predestination’, p. 433</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-6781601465" data-kw="">
<blockquote><p>Those of mankind that are predestinated unto life, God, before the foundation of the world was laid, according to his eternal and immutable purpose, and the secret counsel and good pleasure of his will, hath chosen, in Christ, unto everlasting glory, out of his mere free grace and love, without any foresight of faith, or good works, or perseverance in either of them, or any other thing in the creature, as conditions, or causes moving him thereunto; and all to the praise of his glorious grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 3.5</span></figcaption>

</figure><figure class="quote" id="q-3137406937" data-kw="">
<blockquote><p>As Muller perceptively notes, however, the concept of Christ as fundamentum electionis became problematic only when the name Christ was no longer “loosely” applied after the fashion of Calvin, but “strictly” applied as the title of the elected mediator. (Christ &amp; the Decree, 156– 57) Later generations arose to further the basic christological and soteriological insights of the earliest Reformers in a “new language” with “a more strict theological method.” (Christ &amp; the Decree, 131)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-pomplun.html">Robert Pomplun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Predestined a Passible Redeemer: Scientia Media in Early Modern Christologies” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries</cite>, “Predestined a Passible Redeemer: Scientia Media in Early Modern Christologies” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

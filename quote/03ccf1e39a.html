<main class="wrap"><figure class="quote" id="q-03ccf1e39a" data-kw="">
<blockquote><p>There are four heads: First, they ordain that in doctrine we are not to stand on Scripture alone, but also on things handed down by tradition. … These four things being established, who can deny that the war is ended? … for whatever they produce, if supported by no authority of Scripture, will be classed among traditions, which they insist should have the same authority as the Law and the Prophets. What, then, will it be permitted to disapprove? for there is no gross old wife&#x27;s dream which this pretext will not enable them to defend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session IV</span></figcaption>

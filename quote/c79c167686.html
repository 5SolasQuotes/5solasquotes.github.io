</figure><figure class="quote" id="q-da10e894b5" data-kw="">
<blockquote><p>To make such images and representations to be used in divine worship, is not simply evil, as appears by the brazen serpent, a temporary ordinance for an occasion in the wilderness; and by the cherubims on the mercy-seat, a stated ordinance for the Mosaical dispensation. There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 18, p. 205</span></figcaption>

894b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da10e894b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=To%20make%20such%20images%20and%20representations,the%20same%20as%20a%20bright%20medium&amp;text=To%20make%20such%20images%20and%20representations%20to%20be&amp;text=shining%20through%20the%20same%20as%20a%20bright%20medium" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. God’s proper title which is Jehovah: wheresoever He that appeared as an angel, and is styled an angel, has this title Jehovah attributed to Him, there Christ Jesus is meant: On this ground it is evident that the angel which appeared to Moses in the burning bush was Christ, because He is called Jehovah, Ex. 3:3-4.</p></blockquote>

</figure><figure class="quote" id="q-8994f6114d" data-kw="">
<blockquote><p>As the religious homage done to an image, or even to elements, is in itself an external act of idolatry, insofar as the act is concerned, although the intention of such homage may be directed to God the Great First Cause, —so the act of kneeling to a piece of bread, seeing that, according to the ordinance, the whole man, internal and external, ought to be engaged in the elementary signs, is a relative act of worship and an adoration of the bread itself. The reason is: an intention to worship a material object is not of the essence of external adoration, as appears in a religious act of homage. Thus, the bending of the knee before the Babylonish image is an external act of worship, even though the three youths had no intention to worship any but the true God; and in like manner, those who, from fear or the hope of reward or vain-glory, bend the knee to Jeroboam’s golden calf (which the text clearly enough proclaims to have been done by the king himself, from no religious motive but the mere desire to rule), do pay ad- oration to the calf by the external act, although, no doubt, they may suppose the calf a mere created object and unworthy of honor,—because the act of homage, whether we mean it or not, is, from the ordinance of God and nature, a symbol of worship. Therefore, as the bread [in the Lord’s Supper] denotes the body of Christ (even though that idea be not present to the mind), so in like manner, kneeling, when used as a religious service, is the external adoration of that bread, in presence of which we bow as before the delegated representative of God, be our intention what it may.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, (Edinburgh, 1894), pp. 193-94 Also reprinted by Banner of Truth. Rutherford is here quoting from some other public document, possibly from the Latin of David Calderwood’s Altar of Damascus, p. 595. | Letter 91, to Robert Gordon of Knockbrex</span></figcaption>

<blockquote><p>That answer was the answer of God; it implies divine perfection in him who gave it. To what sufferer would the favor of a creature be sufficient? Who but God can say, “My grace is sufficient for thee?” To Paul it was sufficient. It gave him perfect peace.</p></blockquote>

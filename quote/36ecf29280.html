<main class="wrap"><figure class="quote" id="q-36ecf29280" data-kw="">
<blockquote><p>Not regeneration, faith, or repentance, much less our assumptions pertaining to them, but only the covenant of grace gave people, both adults and children, the right to baptism.</p></blockquote>

<blockquote><p>That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Condition on which the Efficacy of Baptism is suspended”</span></figcaption>

</figure><figure class="quote" id="q-2cb6f80744" data-kw="">
<blockquote><p>Infants of believing parents are likewise to be baptized. The grounds of their baptism are these. First, the commandment of God, “Baptize all nations” (Matt. 28:19), in which words the baptism of infants is prescribed. For the apostles by virtue of this commission baptized whole families (Acts 16:15, 31–33). Again, circumcision of infants was commanded by God (Gen. 17:14), and baptism in the New Testament succeeds in the room of circumcision (Col. 2:11–12); therefore baptism of infants is likewise commanded. The second ground is this. Infants of believing parents are in the covenant of grace. For this is the tenor of the covenant: “I will be thy God, and the God of thy seed” (Gen. 17:7). It may be said that this promise was made in this sort only to Abraham, because he was to be the father of the faithful. Answer. It pertains to all believing parents. God promises “to show mercy to thousands of them that love Him” (Ex. 20). Peter says to the Jews that heard him preach, “The promises belong to you, and to your children” (Acts 2:39). Paul says, “If the parents believe, the children are holy” (1 Cor. 7:14). If holy, then are they in the covenant. Now they are holy because we are in the judgment of Christian charity to esteem them all as regenerate and sanctified, secret judgments (in the mean season) left to God. Now then because infants are in the covenant, they are to be baptized. For this is the reason of St. Peter. To whom the promises belong, to them belongs baptism. But to you and your children belong the promises. Therefore you and your children are to be baptized (Acts 2:38–39).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 230–31.</span></figcaption>

</figure><figure class="quote" id="q-e9bbff3ec9" data-kw="">
<blockquote><p>If they are truly slaves, as slaves formerly were, I would not deny it; for we read that it was commanded to Abraham that he should circumcise all his servants. But such as we have as servants today—since for the most part they are truly free—I do not think they should be treated in that way. Nor indeed those who by right of war become subjects to princes; for this kind of subject nevertheless remains free. Therefore, with respect to those born of unbelieving parents yet free, if the parents consent, I think a distinction should be made. For they consent either after they themselves have become believers, and then there is no difficulty, etc.; or they persist in unbelief, and then I do not think they are to be baptized, etc.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Panstratiae Catholicae, or a Body of the Controversies of Religion Against the Papists</cite>, vol. 4, bk. 5, ch. 11, section 2, as quoted in Latin by Giles Firmin, A Sober Reply to the Sober Answer of Reverend Mr. Cawdrey… (London, 1653), p. 42, trans. by ChatGPT4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-0bde8ca3a7" data-kw="">
<blockquote><p>Conclusion I: None have a right to baptism before the Lord, but those who have actually a saving interest in the Lord Jesus Christ… Conclusion II: Visible believers, and such as have a profession of religion, probably signifying their having a saving interest in Christ, have a right to baptism before the church, so that they may be admitted thereto, though indeed they have no saving grace, yea or never shall have it… Conclusion III: None but visible believers, or such as appear to have a saving interest in Christ, have right to baptism before the Church… Conclusion IV: All infants descended of parents whereof one only is a visible believer, has right to baptism before the church… Such are in covenant with God visibly; we are to look on them as probably within the covenant, as to the saving benefits thereof, so that none can forbid water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macpherson.html">John MacPherson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 82-90 of ‘The Idea of the Church and Membership in it’, Lecture 2 in The Doctrine of the Church in Scottish Theology 1903 | Thomas Boston, ‘Who Have Right to Baptism, and are to be Baptized’ in Works 6.126-39:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/efficacy.html">Baptism: Efficacy</a></span></div>

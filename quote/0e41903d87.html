<main class="wrap"><figure class="quote" id="q-0e41903d87" data-kw="">
<blockquote><p>The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination, wherein the Nature of Divine Predetermination is fully explicated &amp; demonstrated, both in the general, as also more particularly, as to the substrate mater or entitative act of sin (1678) 217 pp.</cite>, pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

y/#:~:text=The%20sum%20of%20all%20is%20this,the%20radical%20power%20to%20that%20act&amp;text=The%20sum%20of%20all%20is%20this%2C%20that%20the&amp;text=act%2C%20not%20the%20radical%20power%20to%20that%20act" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05797ee800" data-kw="">
<blockquote><p>…divine providence is occupied not only with respect to necessary things, which have a natural connection with their own causes (Jer. 33:20, 25), but also, first, with respect to contingent things, which have an uncertain, fortuitous, and casual connection: either with the existence and nature of God, in which sense all things except God exist contingently, inasmuch as in themselves they are able not to exist; or with their own proximate causes operating accidentally and contingently; or with man’s free choice. That contingent things of this sort are subject to divine governance is taught throughout Scripture (Ex. 21:12–13; Deut. 19:5; Prov. 21:31; Ps. 127:1–2; 46:8–10; Dan. 11:21), even to the smallest things, such as the falling of a hair (Matt. 10:30), the operations of locusts and lice (Ex. 8:17; 10:12; Joel 1:4; Acts 12:23). In these things, accordingly, their own natural contingency does not perish, because they are certainly and infallibly directed, and come to pass, by the first cause. This appears specifically in the lot (Prov. 16:33), by which God decides cases through merely contingent events (Judges 6:37; Josh. 7:14), and likewise in his deciding the end of human life (Ex. 21:12–13; Isa. 38:5). 5. With free actions XVII. It is also occupied, second, with respect to free things that result from choice or counsel. For that these are subject to divine determination (and that certainly physical, not only moral), is evident both by the Scriptures (Prov. 16:1; 19:21; 21:1; Gen. 43:14; Ex. 11:1–3; 4:11; Phil. 2:12), and by reasons, because otherwise free choice would be independent, at least with respect to the act of determining itself. Yet notwithstanding, that these things remain free, is likewise, according to Scripture (1 Peter 5:2; Heb. 10:26) and experience, an indubitable fact. Moreover, by what reckoning the liberty of our choice is consistent with divine predestination is not so difficult to understand (as many think), if we consider that the divine influence and its predetermination does not hinder man from acting from counsel and rational complacency, or from determining himself while remaining otherwise undetermined and indeterminable by any created cause. I will add that if God, by determining the will and therefore producing a volition, deprived the will of liberty, then also the will, by determining itself and procuring its own volition, would deprive itself of liberty, which is contradictory; conversely, if the will, by determining itself, does not destroy its own liberty, then neither does God by doing the same. Wherefore the providence of God, in determining our choice, in no way either takes away or injures the liberty of choice. 6. With moral operations XVIII. It is occupied, namely, third, with respect to moral actions, both good and evil, which, just as from this determination of divine providence they are not any less free, likewise they are not any less ours: for although God is their efficient cause insofar as they are existing things (Acts 17:25, 28), nevertheless man remains their formal cause. God certainly produces faith in man, yet it is not God who believes, but man.</p></blockquote>

</figure><figure class="quote" id="q-4e8cb2b806" data-kw="">
<blockquote><p>…we can distinguish between natural passive potency and supernatural or obediential passive potency. A natural passive potency points to an outcome that can be realized given only a thing’s natural capacities, and can be actualized by some agent that is itself a mixture of active and passive potency. A supernatural or obediential potency points to an outcome that cannot be realized given only a thing’s natural capacities, and requires as an agent a purely actual divine cause. In human beings, potencies for eating, sleeping, walking, talking, thinking, willing, writing poems or doing science, and even coming to know the truths of natural theology and natural law are for the Scholastic all natural potencies; whereas the capacity to attain the Beatific Vision is an obediential potency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Metaphysics (Editiones Scholasticae, 2014), 1.1.3, ‘Divisions of act and potency’</cite>, p. 44</span></figcaption>

<blockquote><p>Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God. [1 Cor,. 2:14]’ Richard Baxter: 1. What not sanctified free-will? 2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’ [1 Cor,. 2:14], that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw… (London: Simmons, 1671), section 56</cite>, pp. 139-40</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God. [1 Cor,. 2:14]’ Richard Baxter: 1. What not sanctified free-will? 2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’ [1 Cor,. 2:14], that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.’”

— Richard Baxter, A Second Admonition to Mr. Edward Bagshaw… (London: Simmons, 1671), section 56, pp. 139-40">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEdward+Bagshaw%2C+p.+18%3A+%E2%80%98His+own+free-will+has+not+the+least+power+to+receive+the+things+of+God.+%5B1+Cor%2C.+2%3A14%5D%E2%80%99+Richard+Baxter%3A+1.+What+not+sanctified+free-will%3F+2.+What%21+not+a+receiving+obediential+power%3F+A+receiving+power+is+a+passive+power+%28as+it+is+strictly+taken%29.+Has+a+free-agent+less+power+to+receive+grace+than+a+marble+to+receive+the+engraving+of+the+workman%3F+Does+no+man+ever+receive+grace%3F+Or+do+they+receive+what+they+cannot+receive%3F+Has+a+man+no+more+receptive+power+than+a+block+or+stone%3F+I+know+it%E2%80%99s+said+%E2%80%98The+natural+man+receiveth+not%2C+etc.%E2%80%99+%5B1+Cor%2C.+2%3A14%5D%2C+that+is%2C+understands+not%2C+believes+not%2C+and+loves+not+in+sensu+composito+%5Bin+a+combined+sense%5D%3A+But+its+never+said+that%2C+%E2%80%98Our+free-will+has+not+the+least+power+to+receive.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Second+Admonition+to+Mr.+Edward+Bagshaw%E2%80%A6+%28London%3A+Simmons%2C+1671%29%2C+section+56%2C+pp.+139-40&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3547270b20.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3547270b20.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-nature-grace/#:~:text=Edward%20Bagshaw%2C%20p.%2018%3A%20%E2%80%98His%20own,not%20the%20least%20power%20to%20receive&amp;text=Edward%20Bagshaw%2C%20p.%2018%3A%20%E2%80%98His%20own%20free%2Dwill%20has&amp;text=free%2Dwill%20has%20not%20the%20least%20power%20to%20receive" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Parishioner: Although I admit, sir, that man is depraved, yet I have been inclined to believe that he was not entirely disabled to do good. I have supposed that his moral and not his natural faculties were affected by the fall, and hence that his inability referred merely to the will, and was manifested in his indisposition to receive the gospel. And the reference of Scripture appears to be to this kind of inability, when it is said, “we are made willing in the day of God’s power,” [Ps. 110] and in that other passage “ye will not come unto Me that ye may have life.” [John 5] Do not these passages imply that a sinner possess a natural, but not a moral ability to believe, and that he can if he will repent? Pastor: If the distinction between natural and moral ability contemplates no more than this, that in our natural condition, we possess all the faculties of mind, which a regenerated man employs in the service of God, I am ready to admit it. The same natural faculties characterize both the regenerate and the unregenerate, and the work of the Spirit on the mind does not increase the number of these faculties. But if the distinction implies that these natural faculties are not disabled by the fall, this I deny, as being contrary to fact.</p></blockquote>

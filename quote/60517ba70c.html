<main class="wrap"><figure class="quote" id="q-60517ba70c" data-kw="">
<blockquote><p>THE Church of Corinth, to which the apostle directs this epistle, was a church as flourishing in gifts as any; yet as much crumbled into divisions, as eminent in knowledge. A year and six months the apostle had been conversant among them, planting and watering with expectation of a plentiful harvest; but no sooner had he turned his back but the devil steps in and sows his tares. It was a church still, but divided; it had the evangelical doctrine, but too much choked with schismatical weeds.

1. Observe. The best churches are like the moon, not without their spots. The purest times had their imperfections; a pure state is not allowed to this, but reserved for another world.

2. Church antiquity is a very unsafe rule. Other churches at some distance from the apostles, were as subject to error as this. Pride and ambition were less like to keep out of them, than out of Christ’s family. Had the history of this church’s practices and tenets, without this corrective epistle of the apostle, been transmitted to after–ages, they would have been used as a pattern ; – not the church, but Scripture authority is to he followed. Fathers must not be preferred before apostles; church practices are no patterns, but as they are parallel to the grand and unerring rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), iv, 494.</span></figcaption>

<blockquote><p>V. Particular churches how they may be known, whether they be true churches or not.

And hereby we believe every particular church may be discerned, whether it be a true church gathered in the Lord, even by those things whereupon the Lord hath willed them to be built, namely upon the preaching of the gospel, the administration of the sacraments instituted of Christ and the keeping of his commandments. Therefore those churches we acknowledge for the true churches of Christ, in which first the pure doctrine of the gospel is preached, heard and allowed of, and that so allowed of, that there is no place nor hearing for the contrary.

For these both are properties of the flock or sheep of Christ, namely to hear the voice of their shepherd and to reject the strangers voice. In those also, where the sacraments instituted of Christ (as much as in them lieth) are lawfully, that is according to Christ’s own institution administered and received, and so where other sacraments devised by men are not allowed of.

In those lastly, where the discipline of Christ taketh place, that is, where a care is taken through love, that both privately and publicly, by admonitions, corrections and, when need requireth, by excommunications the commandments of Christ may be observed. And so that men may live soberly, justly, and godly to the glory of God and edification of their neighbours.

For, wheresoever ungodliness and all looseness of life is in public practise and open offences are not reproved according to the discipline of Christ, there we believe that it is possible that many good and godly men may be, but we believe this is not a godly and christian congregation; the Lord himself saying: ‘In this men shall know that ye are my disciples, if ye have love one to another’. But what love can there be, where no care is taken that according to Christ’s doctrine brethren, which offend, may be corrected, may repent, may be gained unto the Lord and saved?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XXIV.V, 1: 395-97.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-45698d906a" data-kw="">
<blockquote><p>The Papists repeat the Apostles’ Creed, but they do not believe it in the Apostles’ meaning. Now it is evident that a new sense doth make a new Creed. But they are not so modest as to content themselves with this grand corruption, though weak delusion, for they have added new Articles of faith to our old Creed, they have composed a Trent-Creed, and they will not admit any man into their Communion, who believes the Apostles’ Creed, unless he will believe this Trent-Creed.</p></blockquote>

<blockquote><p>Conclusion 1. The appearing-holiness of those who hold an opinion is not enough to demonstrate it a truth. A man may be in a dangerous (I had like to have said, damning) error, and yet to the view of men appearingly-holy. Many men have put on a form of godliness, and shew of holiness, till they have gotten strength and power enough to back them in their opinions, and then they have discovered the venom of their spirits, and let loose their spirits to those corrupt ways which their erroneous understandings did lead them to.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b4d63f5295" data-kw="">
<blockquote><p>So in the 23rd [of] Proverbs, v. 26. ‘My son give me thy heart;’ ‘O my son,’ says God, ‘give Me thy heart;’ Christ is the Everlasting Father, and He says, ‘My son, give me thy heart, come to Me.’ One place more in the 3rd [chapter of] Revelation is worth your observing; ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in to him and will sup with him, and he with Me:’ ‘Behold I stand at the door and knock;’ I came down from heaven into mine ordinances, I knock at the door of your hearts and consciences, if any man will open now, if any many would have water of life from me, if any man would have bread of life from Me, if any man would have communion with Me, let him but open and receive Me in, and I will sup with him and he with Me: what sweet invitations have we from Christ, how forward, how ready is the Lord Jesus to do poor sinners good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-greenhill.html">Ezekiel Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of Christ… (London: R.I., 1656), “Christ’s Willingness to Save Sinners, Sermon 1”</cite>, p. 156</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-576d817df9" data-kw="">
<blockquote><p>They do not receive this grace as they ought to do. They let it into the ear, giving it the hearing, but not into the heart, embracing of it. They shut the door of their souls against it. Now upon this condition it is that Christ promises to communicate Himself and his grace to those to whom He comes, viz. if they shall open the door to Him, ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in, and sup with him, and he with Me.’ (Rev. 3.20). It is not the bare hearing of the voice of Christ speaking in his word, but the opening of the door, the letting of Him into the soul, receiving and entertaining Him by faith and love that will bring men to have communion with Him to be made partakers of his grace and Spirit. Now this many will not do; they shut the door of their souls against Jesus Christ, not letting in the motions of his Spirit into their hearts, but opposing, resisting it. This is that which Stephen charges upon the Jews, Acts 7:51, ‘Ye stiff-necked and uncircumcised in heart, and ears, ye do always resist the holy Ghost; as your fathers did so do you.’ And so is it with many, they hear the Word, but they do not let in the monitions of it, nor the motions of the Spirit into their hearts. Question: Why, but is not the grace of God irresistible? A. This is made a matter of controversy, eagerly debated betwixt Arminians and Orthodox divines; I shall not now wade into it. In a word take this resolution: The Spirit of grace in itself is irresistible (I mean so irresistible, as that though it may be opposed, yet it cannot be conquered) but it does not always work in an irresistable way and manner. In itself (I say) it is irresistible, so as if it will put forth its strength, it is able to make way for the motions of it; able to open the door of the soul, though never so closed shut against it, so as not only to illuminate the mind, but also to change the will; not by forcing and constraining it (which being contrary to the nature of the will, is inconsistent with it; should the will be forced, it should cease to be a will, the property whereof is to act freely), but by sweetly inclining it, of unwilling, making it willing to comply and yield to such terms as are tendered to it; by which means the grace of God becomes effectual in it. But this I shall not enlarge upon, resting contented with this, that the grace of God is sufficient for all that shall receive it: sufficient for their conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aqua cœlestis, or a Sovereign Cordial extracted from the Sufficiency of Divine Grace &amp; Strength made Perfect in Weakness… (London: Sawbridge, 1663)</cite>, pp. 54-56</span></figcaption>

</figure><figure class="quote" id="q-3a4fd6c2c2" data-kw="">
<blockquote><p>…but as for that which no hypocrite or unsound professor can attain to, a broken, hungry, self-deined heart, that Christ and his grace might enter and dwell there, oh, how harsh is it?… what shall they look for that despise the grace of the Gospel, and that offer which God has honored by so many miracles, and such abundance of sermons, and the powerful ministry of so many preachers? Beware of refusing such salvation, as being a more spiritual wickedness than any moral offense. Thirdly, its reproof to all cavillers that descant upon this free, plain and simple-hearted offer of God. Being urged to receive it, they answer so they would if they knew themselves elected. But (say they) we are afraid God means it us not. If we be chosen, we are sure to be called to believe it: if not, none of their preachers can give it us. It must be God (say they) and not man that must work our hearts and draw us. But, oh vain jangler, tell me, has not God revealed his will in his offer? Dost thou know his secrets? Is not his offer ingenuous? Say not in thine heart, ‘Who shall go up to Heaven or descend, etc? Lo, the Word is in thy mouth, it is neare thee.’ (Dt. 29:19) If Jeremiah in the dungeon had told Ebedmelech [Jer. 38] he knew not whether he meant to help him out or no, and so have refused to come out, had he not justly been left there still? So, when the Lord lets down the ladder of his offer, into thy dungeon, casts thee his cords and rags to put under thy armholes, that He may draw thee out, dost thou cavil and say, ‘Lord, I know not whether thou meanst me well or no; perhaps Thou wilt pull me out a little way, and then let me fall back again; perhaps I am not elected!’ Is not this a woeful dishonor to the simplicity of the offer? Was he ever tied at all to offer it? and dost thou distrust his ingenuous meaning in it? Thy blood be upon thy own head, in that thou choosest rather to smite the Lord to thy own destruction than to set thy foot in his ladder and put on his cords, that thou mightst come out! The way for thee is first to step upward that thou mayst come to the top than to leap to the top at first, to break thy neck backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Catechism... (London: Norton, 1632), pt. 2, 4th Article</cite>, pp. 182-83</span></figcaption>

21%E2%80%99+Is+not+this+a+woeful+dishonor+to+the+simplicity+of+the+offer%3F+Was+he+ever+tied+at+all+to+offer+it%3F+and+dost+thou+distrust+his+ingenuous+meaning+in+it%3F+Thy+blood+be+upon+thy+own+head%2C+in+that+thou+choosest+rather+to+smite+the+Lord+to+thy+own+destruction+than+to+set+thy+foot+in+his+ladder+and+put+on+his+cords%2C+that+thou+mightst+come+out%21+The+way+for+thee+is+first+to+step+upward+that+thou+mayst+come+to+the+top+than+to+leap+to+the+top+at+first%2C+to+break+thy+neck+backward.%E2%80%9D%0A%0A%E2%80%94+Daniel+Rogers%2C+A+Practical+Catechism...+%28London%3A+Norton%2C+1632%29%2C+pt.+2%2C+4th+Article%2C+pp.+182-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a4fd6c2c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a4fd6c2c2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=but%20as%20for%20that%20which%20no,first%2C%20to%20break%20thy%20neck%20backward&amp;text=but%20as%20for%20that%20which%20no%20hypocrite%20or&amp;text=top%20at%20first%2C%20to%20break%20thy%20neck%20backward" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. This external and internal calling may be ineffectual or effectual. [1.] The ineffectual call consists in the bare tender and offer of grace, but it is not entertained. God may knock at the door of the heart that does not open to Him; knock by the word, knock by the motions of the Spirit and checks of conscience; so ‘many are called, but few are chosen,’ Matt 22:14. There is not the fruit of election, nor are these the called according to purpose. [2.] The effectual call is when God changes the heart, and brings it home to Himself by Jesus Christ…</p></blockquote>

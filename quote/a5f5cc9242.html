<main class="wrap"><figure class="quote" id="q-a5f5cc9242" data-kw="">
<blockquote><p>…to return to our main subject, that of matrimony, we see what kind of treaty there was about it, Gen. 34:6, 12, what the contract, Gen. 24:50-51, 57-58, what the solemnizing of it, Gen. 24:67, were in those early days. We read not of any formality in joining of man and woman. Mutual consent made marriage. ‘Wilt thou go with this man?’ And she said, ‘I will go.’ Then when she was come to his house, he took her, and she became his wife.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Authority, Style &amp; Perfection of the Books of the Old &amp; New Testament… (London: Wilkin, 1693), Of the Excellency &amp; Perfection of the Holy Scriptures, ch. 5</cite>, p. 227</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-a29b9b4b09" data-kw="">
<blockquote><p>Ye know the civil magistrate, or church sessions, have much power about matters belonging to husband and wife, parents and children, so as to censure and punish them for their unnatural carriage towards each other and to see every one do duty to another; and yet neither the civil magistrate, nor church session has marital or husbandly power over the wife, or parental power over the children so as they might challenge the same duties from them to be done to themselves which the wife owes to her husband, or the children to the parents; the husband and parents only have that power…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors Toleration, Erastianism… (d. 1667; Edinburgh, 1692), section 3</cite>, pp. 107-8</span></figcaption>

</figure><figure class="quote" id="q-80835e15e7" data-kw="">
<blockquote><p>The reason why St. James would not have the ceremonies buried as soon as they were dead, was because the Jews had been so long confirmed in them, and bare such a love unto them; and he would purchase concord between them and the Gentile converts; though the Gentiles should bear with some inconvenience into the bargain, as not presently using all the liberty which through Christ they had a right unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 15:20-21</span></figcaption>

<main class="wrap"><figure class="quote" id="q-316958759e" data-kw="">
<blockquote><p>The strength, we see, of the consolation depends upon the stability of the covenant: and is God’s covenant made more firm by an oath than by a promise? The truth of God is as his nature, without variableness or shadow of changing; and can it then be made more immutable? Certainly as to infiniteness in regard of accession, so unto immutability in regard of firmness, there cannot be any accession of degrees, or parts; all immutability being nothing else but an exclusion of whatsoever might possibly occur to make the thing variable and uncertain. So then the oath of God doth no more add to the certainty of his word, than do men’s oaths and protestations to the truth of what they affirm; but because we consist of an earthly and dull temper, therefore God, when he speaks unto us, doth ingeminate his compellations, “O earth, earth, earth, hear the Word of the Lord.”

So weak is our sight, so diffident our nature, as that it seems to want the evidence of what it sees. Peradventure God may repent him of his promise, as he did sometime of his creature. Why should not the covenant of grace be as mutable as was that of works? God promised to establish Sion for ever; and yet Sion, the city of the great God, is fallen. Was not Shilo beloved; and did not God forsake it? Had not Coniah been as the signet of his hand, and has he not yet been cast away? Was not Jerusalem a vine of God’s planting, and hath not the wild boar long since rooted it up? Was not Israel the natural olive, that did partake of the fat and sweetness of the root, and is it not yet cut off, and wrath come upon it to the uttermost.

Though God be most immutable, may he not yet alter his promise? Did the abrogation of ceremonies prove any way a change in him, who was as well the erector as the dissolver of them. Though the sun be fastened to his own sphere, yet may he be moved by another orb. What if God’s promise, barely considered, proceed from his antecedent and simple way of benevolence towards the creature; but the stability and certainty of his promise in the event depend on a second resolution of his consequent will, which presupposeth the good use of mine own liberty?

May not I then abuse my free-will, and so frustrate unto myself the benefit of God’s promise? Is not my will mutable, though God’s be not? May not I sink and fall, though the place on which I stand, be firm? May not I let go my hold, though the thing which I handle, be itself fast! What if, all this while, I have been in a dream, mistaking mine own private fancies and mis-persuasions for the dictates of God’s Spirit? mistaking Satan (who useth to transform himself) for an angel of light! God hath promised, it is true, but hath he promised unto me? Did he ever say unto me, “Simon, Simon,” or “Saul, Saul,” or “Samuel, Samuel?” Or if he did, must he needs perform his promise to me, who am not able to fulfil my conditions unto him?

Thus, as unto men floating upon the sea, or unto distempered brains, the land and house, though immovable, seem to reel and totter; or as unto weak eyes, every thing seems double;—so the promises of God, however built on a sure foundation, his counsel and fore-knowledge, yet unto men, prepossessed with their own private distempers, do they seem unstable and frail, unto a weak eye of faith, God’s covenant to be (if I may so speak) double, to have a tongue and a tongue, a promise and a promise, that is, a various and uncertain promise.

And for this cause (notwithstanding diffident and distrustful men do, indeed, deserve what they suspect, and are worthy to suffer what they unworthily do fear) doth God yet, in compassion towards our frailty, condescend to confirm his promises by an oath, to engage the truth of his own essence for performance, to seal the patent which he hath given with his own blood, and to exhibit that seal unto us so often, as, with faith, we approach unto the communion of these holy mysteries. And who can sufficiently admire the riches of this mercy, which makes the very weaknesses and imperfections of his church, occasions of redoubling his promises unto it?</p></blockquote>

<blockquote><p>Particularly noteworthy are his treatments of the Noahic and Mosaic covenants as integral to the overarching covenant of grace.” – Ryan McGraw . . The History of the Development of the Doctrine of the Covenant of Grace Whole of Church History eds. Waters, Reid &amp; Muether – pt. 2, chs. 14-20 in Covenant Theology: Biblical, Theological &amp; Historical Perspectives Pre (Crossway, 2020) ToC . In the Early Church Duncan, J. Ligon – The Covenant Idea in Ante-Nicene Theology PhD diss. (Edinburgh, 1995) Abstract: “This thesis argues that the covenant idea was more significant in the writings of particular ante-Nicene theologians than has generally been admitted in patristic research or general surveys of the history of the covenant idea in the Christian tradition… This investigation reveals that the covenant idea functions in several arenas of early Christian thought. It is employed (1) to stress moral obligations incumbent upon Christians; (2) to show God’s grace in including the Gentiles in the Abrahamic blessings; (3) to deny the reception of these promises to the Israel of the flesh, that is, Israel considered merely as an ethnic entity; (4) to demonstrate continuity in the divine economy; and (5) to explain discontinuity in the divine economy. In reviewing the role of early Christian covenant thought in these areas, this thesis argues that (1) the pre-Nicene theologians usually take OT covenant passages (not NT passages) as the starting point in their applications of the covenant concept to Christian living; (2) the early Christian use of the covenant idea evidences that they understood the covenant to be both unilateral and bilateral, promissory and obligatory, to bring divine blessings and entail human obedience; (3) these writings also show that, from the very earliest times, Christian authors (following OT and NT examples) have employed the covenant concept as a key structural idea in their presentations of redemptive history; (4) contrary to the suggestions of previous studies, there is no evidence of a gap in the usage of the covenant idea after the era of the NT writings; (5) the covenant idea was closely linked to the early Christian self-understanding as the people of God; (6) the covenant idea is not monolithic in the thought of the authors surveyed. It is employed with differing emphases and takes on varying shades of meaning in their respective writings… This study is significant for at least these following reasons: (1) It confirms current research on the Jewish matrix of early Christianity, from a vantage-point not yet exploited. (2) It reviews in greater detail the early Christian covenant thought which is now being acknowledged to have been influential on the sixteenth-century Reformers (such as Bullinger and Calvin). (3) As the first extensive patristic survey of the covenant idea, it fills a significant lacuna in the history of ideas…</p></blockquote>

+blessings+and+entail+human+obedience%3B+%283%29+these+writings+also+show+that%2C+from+the+very+earliest+times%2C+Christian+authors+%28following+OT+and+NT+examples%29+have+employed+the+covenant+concept+as+a+key+structural+idea+in+their+presentations+of+redemptive+history%3B+%284%29+contrary+to+the+suggestions+of+previous+studies%2C+there+is+no+evidence+of+a+gap+in+the+usage+of+the+covenant+idea+after+the+era+of+the+NT+writings%3B+%285%29+the+covenant+idea+was+closely+linked+to+the+early+Christian+self-understanding+as+the+people+of+God%3B+%286%29+the+covenant+idea+is+not+monolithic+in+the+thought+of+the+authors+surveyed.+It+is+employed+with+differing+emphases+and+takes+on+varying+shades+of+meaning+in+their+respective+writings%E2%80%A6+This+study+is+significant+for+at+least+these+following+reasons%3A+%281%29+It+confirms+current+research+on+the+Jewish+matrix+of+early+Christianity%2C+from+a+vantage-point+not+yet+exploited.+%282%29+It+reviews+in+greater+detail+the+early+Christian+covenant+thought+which+is+now+being+acknowledged+to+have+been+influential+on+the+sixteenth-century+Reformers+%28such+as+Bullinger+and+Calvin%29.+%283%29+As+the+first+extensive+patristic+survey+of+the+covenant+idea%2C+it+fills+a+significant+lacuna+in+the+history+of+ideas%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Stephen+G.+Myers%2C+God+to+Us%3A+Covenant+Theology+in+Scripture%2C+%28RHB%2C+2021%29+368%2C+pp.+ToC&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4d914b237.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4d914b237.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace#:~:text=Particularly%20noteworthy%20are%20his%20treatments%20of,lacuna%20in%20the%20history%20of%20ideas&amp;text=Particularly%20noteworthy%20are%20his%20treatments%20of%20the%20Noahic&amp;text=a%20significant%20lacuna%20in%20the%20history%20of%20ideas" rel="noopener" target="_blank">Read it online · Reformed Book

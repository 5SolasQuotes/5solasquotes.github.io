<main class="wrap"><figure class="quote" id="q-43d6c25b4d" data-kw="">
<blockquote><p>To you who are magistrates, and invested with civil authority, permit me respectfully to say, The ordinance of God and the voice of a free people have elevated you to posts of dignity and power, that you may be the sentinels of the public virtue. To you their eyes are directed, to maintain the sacredness and diffuse the blessings of the holy Sabbath. The voice of the King of kings to you is, Remember the Sabbath Day!

In your personal and official capacity never lose sight of its appointment and design. If, as our civil fathers, you would see your children rise up and call you blessed; if you would embalm your names in the remembrance of an elevated people, and transmit them with many a grateful sentiment to a distant futurity; be entreated to become the exemplary and fearless guardians of the Christian Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gardiner-spring.html">Gardiner Spring</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath a Blessing to Mankind</cite>, Tracts of the American Tract Society. General Series. Volume 1 (1825), no. 37, p. 19.</span></figcaption>

</figure><figure class="quote" id="q-1d68760fc2" data-kw="">
<blockquote><p>But especially take heed of that which is true superstition indeed, by which here I mean the making of any new parts of religion to ourselves and fathering them upon God, who never made them. Of this there are two sorts, positive and negative: When we falsely say, ‘This is a duty commanded by God,’ or when we falsely say, ‘This is a sin forbidden by God.’ Take heed of both. I do not speak here of doing or not doing the same things upon any other account (as human duties, or mere conveniences or the like), but as they are falsely pretended to be divine.</p></blockquote>

<blockquote><p>§45. 5. And for organs or other instruments of music in God’s worship, they being a help partly natural and partly artificial, to the exhilarating of the spirits for the praise of God, I know no argument to prove them simply unlawful, but what would prove a cup of wine unlawful, or the tune and meter, and melody of singing unlawful. But yet if any would abuse it, by turning God’s worship into carnal pomp, and levity, especially by such non-intelligible singing, or bleating as some of our choristers used, the common people would have very great reason to be weary of it as accidentally evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 412</span></figcaption>

<main class="wrap"><figure class="quote" id="q-dadbf43504" data-kw="">
<blockquote><p>The demand was of the same man, who formerly did lawfully preach in a public assembly, if he should [now] obtain a license from the Lord bishop of the diocese, without any unlawful condition for to continue in that his course [of public preaching], whether that leave or license given does pollute the actions, seeing a man may ask leave of the great Turk to preach the gospel within his dominions? His [John Robinson’s] answer is that the very obtaining and receiving of such a license is unlawful, because it is a real acknowledgement that such a bishop has a lawful power to grant it. Which [in my judgment] is neither so nor so, for: 1. The asking and receiving of leave or license (which are both one) does not always imply an acknowledgement of his lawful authority from whom it is sought. If any man of violence shall usurp a power to himself, of permitting or hindering the lawful and good offices that pertain unto honest men, so that without his license a man could not buy or sell, or teach any science or trade of life; if an honest man whom these duties concern, should in that case take a license from that usurper (though he were no better than a strong thief) no reasonable man will say that in so doing he did acknowledge such [an] usurped power [to be] lawful. The rulers of Jewish synagogues had no lawful power over the apostles of Christ in any part of their ministry, neither would Paul ever acknowledge so much: yet he and Barnabas accepted of such license or leave from them sometime as they did usually grant unto those that acknowledged themselves lawfully subject to their authority. See an example, Acts 13:15. Mr. Robinson himself has granted in the first demand that a man may preach by leave in a parochial assembly: which leave must be given by the parochial minister and church-wardens, whose authority he holds one with the bishops. If therefore leave or license (whether in word or writing, that is all one) may be lawfully taken from them, without acknowledging any authority lawful which is unlawful, why not from the bishop? 2. There is some authority in the bishops derived from the king which may be acknowledged [as] lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr. [John] Robinson. Or a Confirmation of the Former in an Answer to his Manumission (Amsterdam, 1615)</cite>, pp. 6-7</span></figcaption>

</figure><figure class="quote" id="q-ebdf5e31d2" data-kw="">
<blockquote><p>Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

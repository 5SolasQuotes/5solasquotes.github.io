<main class="wrap"><figure class="quote" id="q-de8f816fdc" data-kw="">
<blockquote><p>This system also conflicts with Scripture, which recognizes no such primacy of Peter as that on which the system is built, and distinctly recognizes the voice of the people in ecclesiastical affairs. Moreover, the claim of the Roman Catholic Church, that there has been an unbroken line of succession from the time of Peter down to the present day, is contradicted by history. The papal system is, both exegetically and historically, untenable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, pt. 5, “The Government of the Church”</span></figcaption>

</figure><figure class="quote" id="q-75fb9ddff4" data-kw="">
<blockquote><p>The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 214</span></figcaption>

</figure><figure class="quote" id="q-43f398b797" data-kw="Upon this rock">
<blockquote><p>Mt. 16:18 does not favor the primacy of Peter. First, the passage is allegorical and metaphorical, admitting of various interpretations. Assuredly, it cannot establish an ecumenical pontificate, which ought to be proved by some express passage. Second, these things are certainly said to Peter, but not about Peter. The reasons are various. (a) From the very words because Petra is expressly distinguished from Petro, both in person and in gender, as the denominating and the denominated. Yet if he had wished to indicate Peter, why did he use both? Why did he not say, “Thou art Peter and upon thee” (which would have removed all difficulty). Rather he says “and upon this rock.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.13</span></figcaption>

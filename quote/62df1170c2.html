<main class="wrap"><figure class="quote" id="q-62df1170c2" data-kw="">
<blockquote><p>Human life owes almost all its security, and the greater part of its happiness, to the fact that, whether by nature or by choice, by the ties of common family, common country, or voluntary association, different individuals are bound together into one body. And the law of such bodies is not only that if one member be honoured the others rejoice with it, but that if one member suffer the others must suffer with it.

For as in the natural body the nerves, along which in health thrill so many sensations of pleasure, at times rack the frame with cruel achings, so those ties of union which in various ways bind us in one body with our fellowmen do at times bring us pain instead of happiness, pain which we are content to accept on account of the vastly greater happiness which has come through the same channels.

We owe so much, for instance, to our country and its laws, which give us security for property, and life, and family comfort, that it is justly accounted the grossest ingratitude if we do not love our fatherland, or if we hesitate to give our substance or our life for it should its needs require.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gnosticism and Agnosticism and Other Sermons</cite>, (London: MacMillan and Co., 1887), p. 35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>…our causuists… consider of the conception, either as it is before it receive life, or after that it is animated: Before it receive life, they are wont to determine, that howsoever it were no less than mortal sin, in a physician to prescribe a medicinal receit [prescription] to cause abortion, for the hiding of a sin, or any outward secular occasion, yet for the preservation of the life of the mother, in an extreme danger (I say, before animation) it might be lawful: But after life once received, it were an heinous sin to administer any such mortal remedy. The latter casuists are better advised; and justly hold that to give any such expelling or destructive medicine, with a direct intention to work an abortment (whether before or after animation) is utterly unlawful, and highly sinful: And with them I cannot but concur in opinion; For, after conception we know that naturally follows animation, there is only the time that makes the difference, which in this case is not so considerable as to take off a sin… …the Septuagint in their translation (as [Leonardus] Lessius well observes) have rendered that Mosaical law (in Ex. 21[:22-23]) concerning abortions, in these terms: ‘If a man strike a woman that is with child, and she make an abortion, if the child were formed, he shall give his life for the life of the child; if it were not formed, he shall be punished with a pecuniary mulct to her husband,’ applying that to the issue [the fetus] which the Vulgar Latin understands of the mother; and making the supposition to be of a formation and life, which the Latin more agreeably to the [Hebrew] original, makes to be ‘death’; and our English [KJV], with Castalion expresses by ‘mischief’: but whether the mischief be meant of the death of the mother or of the late-living issue, the Scripture has not declared: Cornelius à Lapide taking it expresly of the mother’s death, yet draws the judgement out, in an equal length to the death of the child, once animated; making no difference of the guilt; since the infant’s soul is of no less worth than her’s that beats him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men</cite>, … (London, 1654), 2nd Decade, Case 3, ‘Whether may it be lawful, in case of extremity, to procure the abortion of the child for the preservation of the mother?’, pp. 90-91, 93-95. Hall was a godly Anglican bishop.</span></figcaption>

<blockquote><p>VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…</p></blockquote>

<blockquote><p>In the second place, let us refer to the right inherent in the Church of Christ to propagate the Gospel, and make disciples in every country and nation under heaven. This right, claimed by the Church, and belonging to her in consequence of the duty enjoined by her Head, is a right of such a nature, that it cannot properly consist with the neutrality of the civil magistrate, or be recognised by any state constituted on the principle that it has nothing to do with religion.

The full and free and unrestricted power to take possession of this world in the name of Christ, to the exclusion of any other form of faith and worship, is what Christianity demands: with less than this it cannot be satisfied. And yet it may well be doubted whether it be consistent with the principle and practice of absolute neutrality on the part of the state to concede this demand, or whether a toleration for the truth, founded on the theory of entire impartiality and indifference as regards truth and falsehood, is sufficient to protect the Church of Christ in its exclusive claims.

The Gospel of Christ is not, like the systems of polytheism among which it was introduced at first, compatible with every other system of falsehood. It is exclusive in its character and pretensions; and demands that it be received and owned and submitted to, to the abandonment and rejection of every other faith. Christ Himself tells us that He came to send on the earth, “not peace, but a sword,” not ease, but “a burning fire;” and, like a sword, His Gospel divides asunder the outward and formal union of human society, and, like a fire, it kindles strife and division in the world.

There is so much in the Gospel fitted to awaken the hostility of the human heart, and standing in direct opposition to the principles and practices of the world, that it cannot but act as a firebrand wherever it enters. To introduce and propagate it, therefore, in any community, tends not indirectly to excite the rage and outrage and violence of men. More than this: its first principle and first duty is that of aggression.

The ministers of the Gospel claim it as a right to go into every nation, however fenced around and guarded from intrusion, and to demand an entrance in the name of Him who sent them, even although the magistrate should bid them depart from his coasts. Further still, the messengers of the Cross arrogate to themselves the title to enter into every human dwelling where a sinner is to be found,-seeking admittance in the name of the Saviour of sinners, that they may negotiate with the inhabitant in behalf of their Master, however sternly the door may be closed against them by jealousy of their errand, or hatred to their cause.

It has been the eloquent boast of freedom in our country, that every man’s house is his castle; and that, be it but a strawbuilt shed, open to every breath of heaven, yet fenced about by the protection and the sanction of law, there even “the king cannot and dare not enter.” But where the king cannot enter, there the missionary of Christ claims to be admitted; and, with a higher warrant in his hand than that of human law, bids the gates be lifted up, that with the Gospel he may enter in. And can claims and pretensions so essentially exclusive and aggressive, which belong from its very nature to Christianity, be owned and conceded by a state constituted on the principle of entire and equal indifference to truth and falsehood?

Is it, in the nature of things, possible, in regard to such demands, to profess or carry out the theory of neutrality in civil legislation, granting a licence free and full to Christianity, intolerant as it is of every other religion? Ask the Roman magistrate within whose jurisdiction the Gospel was at first preached, or the magistrate of any country not Christian within whose rule Christianity is introduced at the present day. For the first three hundred years of its existence the religion of Christ was in almost perpetual collision with the state, just on the ground that it was essentially a missionary and an exclusive religion, that it would not, and could not, exist in peace alongside of any other faith, that its temples must stand alone, and its Deity find no place in the Pantheon. Nor has the essential character of Christianity altered since the days of Nero and Diocletian.

<blockquote><p>But these general truths may be added, concerning the Judicial Laws: 1. None can say that none of the Judicial Laws, concerning political constitutions, is to be observed in the New Testament: for then many special rules of natural and necessary equity would be rejected, which are contained in the Judicial Laws of God: Yea all the laws of equity in the world would be so cast; for none can be instanced, which may not be reduced to some of the Judicial Laws: And if any of them are to be observed, certainly these penal statutes so necessary for the preservation of policies, must be binding. …

3. Those Judicial Laws, which had either somewhat typical, or pedagogical, or peculiar to the then Judaical State, are indeed not binding to us under that formality; though even these doctrinally are very useful, in so far as in their general nature, or equity of proportion, they exhibit to us some documents of duty: but those penal judgments, which in the matter of them are appended to the Moral Law, and are in effect but accurate determinations and accommodations of the Law of Nature, which may suit our circumstances as well as the Jews, do oblige us as well as them. And such are these penal statutes I adduce; for, that blasphemy, murder and idolatry, are heinous crimes and that they are to be punished, the Law of Nature dictates; and how, and by whom, in several cases, they are to be punished, the Law judicial determines. Concerning the Moral Equity even of the strictest of them: [William] Ames, Of the Conscience, Book 5, ‘Of the Appended Precepts of Moses’.

4. Those Judicial Laws, which are but Positive in their form, yet if their special internal and proper reason and ground by Moral, which pertains to all nations, which is necessary and useful to mankind, which is rooted in and may be fortified by human reason, and as to the substance of them approven by the more intelligent heathens; those are Moral, and oblige all Christians as well as Jews: and such are these laws of punishing idolaters, etc. founded upon Moral grounds, pertaining to all nations necessary and useful to mankind, rooted in and fortified by human reason, to wit that the wrath of God may be averted, and that all may hear and fear and do no more so wickedly; especially this reason be superadded, when the case is such, that innocent and honest people cannot be preserved, if such wicked persons be not take order with.</p></blockquote>

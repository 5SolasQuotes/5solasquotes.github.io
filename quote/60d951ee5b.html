<main class="wrap"><figure class="quote" id="q-60d951ee5b" data-kw="">
<blockquote><p>There’s a difference between a Tyrant that cometh violently to force men to submit to him, or one that comes with a sudden surprise, or with any cunning ways to persuade men to come in to submit to him, and a Prince that is upon his Throne reigning, and having his Subjects acknowledging themselves to be as Subjects to him …</p></blockquote>

<blockquote><p>Understand further that powers are from God, not as pestilence and famine, and wars, and other visitations for sin are said to be from Him, but because He has appointed them for the legitimate and just government of the world. For though tyrannies and unjust exercise of power, as they are full of disorder (ἀταξίας) are not an ordained government, yet the right of government is ordained by God for the well-being of mankind.</p></blockquote>

</figure><figure class="quote" id="q-dbdf8c5578" data-kw="">
<blockquote><p>But this is not all the usurpers that rose up in those days. Eugenius [the usurper] soon becomes more terrible than he (who once was but a schoolmaster). And how does this loyal St. Ambrose carry it? When he had got of Theodosius a pardon for all that took part with Maximus, even his army except two or three, yea and benefits too, yet did not this holy loyal man think it sinful to write thus to the tyrant Eugenius (Epistles, bk. 2, p. 103), Clementissimo Imperatori Eugenio, Ambrosius Episcopus, ‘Bishop Ambrose to the most clement emperor Eugenius.’ And thus concludes: In his vero in quibus vos rogari decet, etiam exhibere sedulitatem potestati debitam▪ sicut et scriptum est, cui honorem, honorem, cui tributum, tributum: Nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori? i.e. ‘But in these matters where it becomes us to petition you, we must also give the diligence due to power: as it is written, honor to whom honor, tribute to whom tribute: For when I honored you, when you were a private man from the inwards of my heart, how should I not honor you an emperor?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Episcopacy</cite>, … (London: Simmons, 1681) | pt. 2, ch. 22, p. 210</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

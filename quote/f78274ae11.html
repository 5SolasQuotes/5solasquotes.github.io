<main class="wrap"><figure class="quote" id="q-f78274ae11" data-kw="">
<blockquote><p>As to the apostle’s determination to know, or preach, nothing else, than the doctrine of a crucified Saviour, it may be remarked, that judging of what he delivered orally, by what we find in his writings, he certainly did not confine himself to the dry and incessant reiteration of the truths we have detailed. On the contrary, we find him expressly affirming, that he had not shunned to declare the whole counsel of God; and there is actually apparent in his writings, a whole system of theological truth, and of evangelical ethicks, extensively taught and powerfully inculcated.

But that all this is perfectly consistent with what we have given as the import of the text, may be shown by an illustration, taken from the words of our Saviour himself. He told the Jews, that on two commandments, relating to the great principle of love—love to God and love to man—hang all the law and the prophets. In like manner, we affirm, that although the apostle declared many truths, taught many doctrines, and urged many duties, he still knew nothing hut Jesus Christ and him crucified, because every thing was made by him to hang upon, the cross.

The truths which we have recited, were so much and so often insisted on, that they formed a large and the most prominent part of his system, and thus gave to it its distinctive character and appellation. All his teaching, moreover, whatever was the subject or the occasion, savoured strongly of the cross; it always had a manifest consistency, and generally a plain connexion, with the doctrine of Christ crucified — From this doctrine it was often immediately derived; frequently it was little else than the ramification, or carrying out, of this doctrine, into its proper consequences; and not seldom, the teaching and illustration of some related truth, serving to give it clearness and effect.

In a word, the doctrine of Christ crucified, was the sun of the apostle’s theological system, which imparted lustre to every other truth, directed its course, and kept it to its proper orbit — The sun which threw off its beams of heavenly radiance in all directions, to warm, and cheer, and animate those who were already spiritually alive, and to waken into life, those who were yet slumbering in the frost and death of sin; which gave vitality and productive energy to every evangelical principle and precept; and to which every ray of truth might be traced back, as to its proper source; and to whose full orbed splendour every Christian eye was often directed, to catch some glimpses of a glory too intense for a full and steady vision, till mortality should be swallowed up of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ashbel-green.html">Ashbel Green</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ crucified, the characteristick of Apostolick preaching: a sermon delivered in the First Presbyterian Church of Philadelphia, at the opening of the General Assembly of the Presbyterian Church in the United States, May 19, 1825</cite>, (Philadelphia: Clark &amp; Raser, 1825), pp 8-9.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2be9b15777" data-kw="">
<blockquote><p>It is most probable that no gift, no pains a man takes to fit himself for preaching, shall ever do good to the people or himself, except a man labor to have and keep his heart in a spiritual condition before God, depending on Him always for furniture and the blessing. Earnest faith and prayer, a single aim at the glory of God, and good of people, a sanctified heart and carriage, shall avail much for right preaching. There is sometime somewhat in preaching that cannot be ascribed either to the matter or expression, and cannot be described what it is, or from whence it comes, but with a sweet violence, it pierces into the heart and affections, and comes immediately from the Lord. But if there be any way to attain to any such thing, it is by a heavenly disposition of the speaker.</p></blockquote>

</figure><figure class="quote" id="q-74af20edbe" data-kw="">
<blockquote><p>From this cause [native depravity] it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible. Yet even to these, the truths committed to memory are now of great utility. They are like a treasure which has been hidden, but is now discovered. Of two persons under conviction of sin, one of whom has had sound religious instruction, and the other none, the former will have an unspeakable advantage over the latter in many respects.</p></blockquote>

</figure><figure class="quote" id="q-54985cb2a3" data-kw="">
<blockquote><p>It is pity that any wise and judicious minister should want [lack] that fervor and seriousness of speech which the weight of so great a business does require. And it is greater pity that any serious, affectionate minister should be ignorant and injudicious: And it is yet greater pity that in any good men, too much of their fervor should be merely affected and seem to be what it is not; or at least be raised by a selfish desire to advance ourselves in the hearers’ thoughts and to exercise our parts upon their affections. But it is most pitiful that the Church has any hypocrites who have no other but such affected dissembled fervency. And it is not the least pity that so many good people, especially youths and women, should be so weak, as to value an affectionate tone of speech above a judicious opening of the Gospel. I confess there is something in an affectionate expression, which will move the wisest: And as light and judgment tend to generate judgment, so heat of affection tends to beget affection. And I never loved a senseless delivery of matters of eternal consequence, as if we were asleep ourselves, or would make the hearers to be so: or would have them think by our cold expressions that we believe not ourselves, when we set forth the great inestimable things of the life to come. But yet it grieves my very soul to think what pitiful, raw and ignorant kind of preaching is crowded most after in many places for the mere affectionate manner of expression and loudness of the preacher’s voice! How oft have I known the ablest preachers undervalued and an ignorant man by crowds applauded, when I that have been acquainted with the preacher ab incunabulis [from infancy], have known him to be unable well to answer most questions in the common catechism. And I durst not tell them of his great insufficiency and ignorance for fear of hindering the success of his labors and being thought envious at other men’s acceptance.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is pity that any wise and judicious minister should want [lack] that fervor and seriousness of speech which the weight of so great a business does require. And it is greater pity that any serious, affectionate minister should be ignorant and injudicious: And it is yet greater pity that in any good men, too much of their fervor should be merely affected and seem to be what it is not; or at least be raised by a selfish desire to advance ourselves in the hearers’ thoughts and to exercise our parts upon their affections. But it is most pitiful that the Church has any hypocrites who have no other but such affected dissembled fervency. And it is not the least pity that so many good people, especially youths and women, should be so weak, as to value an affectionate tone of speech above a judicious opening of the Gospel. I confess there is something in an affectionate expression, which will move the wisest: And as light and judgment tend to generate judgment, so heat of affection tends to beget affection. And I never loved a senseless delivery of matters of eternal consequence, as if we were asleep ourselves, or would make the hearers to be so: or would have them think by our cold expressions that we believe not ourselves, when we set forth the great inestimable things of the life to come. But yet it grieves my very soul to think what pitiful, raw and ignorant kind of preaching is crowded most after in many places for the mere affectionate manner of expression and loudness of the preacher’s voice! How oft have I known the ablest preachers undervalued and an ignorant man by crowds applauded, when I that have been acquainted with the preacher ab incunabulis [from infancy], have known him to be unable well to answer most questions in the common catechism. And I durst not tell them of his great insufficiency and ignorance for fear of hindering the success of his labors and being thought envious at other men’s acceptance.”

— Richard Baxter, The Cure of Church Divisions, … (London, 1670), pt. 1, Direction 41, pp. 214-15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+pity+that+any+wise+and+judicious+minister+should+want+%5Black%5D+that+fervor+and+seriousness+of+speech+which+the+weight+of+so+great+a+business+does+require.+And+it+is+greater+pity+that+any+serious%2C+affectionate+minister+should+be+ignorant+and+injudicious%3A+And+it+is+yet+greater+pity+that+in+any+good+men%2C+too+much+of+their+fervor+should+be+merely+affected+and+seem+to+be+what+it+is+not%3B+or+at+least+be+raised+by+a+selfish+desire+to+advance+ourselves+in+the+hearers%E2%80%99+thoughts+and+to+exercise+our+parts+upon+their+affections.+But+it+is+most+pitiful+that+the+Church+has+any+hypocrites+who+have+no+other+but+such+affected+dissembled+fervency.+And+it+is+not+the+least+pity+that+so+many+good+people%2C+especially+youths+and+women%2C+should+be+so+weak%2C+as+to+value+an+affectionate+tone+of+speech+above+a+judicious+opening+of+the+Gospel.+I+confess+there+is+something+in+an+affectionate+expression%2C+which+will+move+the+wisest%3A+And+as+light+and+judgment+tend+to+generate+judgment%2C+so+heat+of+affection+tends+to+beget+affection.+And+I+never+loved+a+senseless+delivery+of+matters+of+eternal+consequence%2C+as+if+we+were+asleep+ourselves%2C+or+would+make+the+hearers+to+be+so%3A+or+would+have+them+think+by+our+cold+expressions+that+we+believe+not+ourselves%2C+when+we+set+forth+the+great+inestimable+things+of+the+life+to+come.+But+yet+it+grieves+my+very+soul+to+think+what+pitiful%2C+raw+and+ignorant+kind+of+preaching+is+crowded+most+after+in+many+places+for+the+mere+affectionate+manner+of+expression+and+loudness+of+the+preacher%E2%80%99s+voice%21+How+oft+have+I+known+the+ablest+preachers+undervalued+and+an+ignorant+man+by+crowds+applauded%2C+when+I+that+have+been+acquainted+with+the+preacher+ab+incunabulis+%5Bfrom+infancy%5D%2C+have+known+him+to+be+unable+well+to+answer+most+questions+in+the+commo

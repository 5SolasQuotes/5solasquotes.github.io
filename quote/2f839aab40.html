<blockquote><p>IV. God also, besides his other proprieties, is simple or unmixed, that he can no ways be said to be compounded of many things. No, not of his being and essence.

V. For, although he attribute unto himself many things in the scriptures, as it were many qualities as to be good, just, might etc., yet no quality doth in very deed fall into God. But of what sort soever he is, the same he is in his own simple essence. But by these divers names the infinite perfection of his most simple essence is signified unto us.</p></blockquote>

<blockquote><p>§2. Just as the essence and existence of God do not really differ from His vital actuality [actuositas vitalis], but are distinguished only by a mental abstraction: so His understanding and willing are comprehended under His life, or most perfect thought, as by no means really distinct from one another, but as identified in God—so that the distinction here also is nothing but the abstraction of our mind.</p></blockquote>

</figure><figure class="quote" id="q-5f2f93fce0" data-kw="">
<blockquote><p>We must needs assert that in God there is love: because love is the first movement of the will and of every appetitive faculty. For since the acts of the will and of every appetitive faculty tend towards good and evil, as to their proper objects: and since good is essentially and especially the object of the will and the appetite, whereas evil is only the object secondarily and indirectly, as opposed to good; it follows that the acts of the will and appetite that regard good must naturally be prior to those that regard evil; thus, for instance, joy is prior to sorrow, love to hate: because what exists of itself is always prior to that which exists through another. Again, the more universal is naturally prior to what is less so. Hence the intellect is first directed to universal truth; and in the second place to particular and special truths. Now there are certain acts of the will and appetite that regard good under some special condition, as joy and delight regard good present and possessed; whereas desire and hope regard good not as yet possessed. Love, however, regards good universally, whether possessed or not. Hence love is naturally the first act of the will and appetite; for which reason all the other appetite movements presuppose love, as their root and origin. For nobody desires anything nor rejoices in anything, except as a good that is loved: nor is anything an object of hate except as opposed to the object of love. Similarly, it is clear that sorrow, and other things like to it, must be referred to love as to their first principle. Hence, in whomsoever there is will and appetite, there must also be love: since if the first is wanting, all that follows is also wanting. Now it has been shown that will is in God (Q[19], A[1]), and hence we must attribute love to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, (d. 1274), pt. 1, quest. 20, art. 1, I answer that</span></figcaption>

</figure><figure class="quote" id="q-a1e8359159" data-kw="">
<blockquote><p>In the Reformed view, both Catholic Counter-Reformation (L. Molina) and Remonstrant theology (Arminius) had modified this ‘will-based-theology’ [of Augustine and the Reformed] by their adaptation of middle knowledge (scientia media), resulting in a ‘knowledge-based-theology’ in which there is no room for real contingency (Maccovius 1641b, 103-4; Bac 2010). For Maccovius and most of seventeenth-century Reformed theologians, the main problem of the concept of middle knowledge is that it undermines the fundamental distinction between Creator and creature. Middle knowledge, used to describe a category of divine knowledge structurally or logically antecedent to God’s will, implies a necessity of the objects of divine knowledge (Maccovius 1641a, 25-26). Because middle knowledge postulates objects extra Deum [outside God] that precede his will, a logical contradiction is involved: objects outside God always presuppose the divine will. Finally. if God’s middle knowledge also contains his decree, then this would imply that it is impossible for God to choose an alternative (Maccovius 1641a, 25). Middle knowledge, then, approximates Stoic fate (fatum Stoicum), a natural or absolute necessity so inherent in the essential nature of things that even God is made dependent, like Homer’s Jupiter [who was constrained by nature] (Maccovius 1641b, 253).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willem-j-van-asselt.html">Willem J. van Asselt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Christ, Predestination, and Covenant in Post-Reformation Reformed Theology’</cite>, 2. ‘Predestination…’, pp. 218-9 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

<main class="wrap"><figure class="quote" id="q-8460645da5" data-kw="">
<blockquote><p>M.—It is not, then, your opinion, that a king should in all matters be invested with arbitrary power?

B.—By no means; for I recollect that he is not only a king, but also a man erring much through ignorance, offending much through inclination, and much almost against his will; as he is an animal readily yielding to every breath of favour or hatred. This imperfection of nature too is generally increased by the possession of office; so that here, if anywhere, I recognize the force of the sentiment in the comedy, when it says, that “by unrestrained authority we all become worse.” For this reason legislative sages supplied their king with law, either to instruct his ignorance or to rectify his mistakes. From these remarks you may, I presume, conceive, as in a typical representation, what my idea is of a genuine king’s duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-buchanan.html">George Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland</cite>, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), pp 14-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-9d63fb276b" data-kw="">
<blockquote><p>…Pilate uses all means to get Jesus loose; he uses the present occasion to that purpose; knowing the use [custom] of the Jews, he would have been glad to have had Jesus set at liberty, above all the prisoners. To speak somewhat of this custom: They had this custom, to get a prisoner set at liberty at festival times, to the honor of their feasts… but therewith they dishonored God. Is that to honor God, to break his commandment?… We know this, there is nothing wherein a prince resembles God more than in clemency; but it is a sin to let a wicked man escape, or that the emperor should let him go; for God’s law says, Dt. 19:11-13, “Thine eye shall not spare the murderer, neither look upon him with a pitiful eye.”… Some will say, has not a free prince license to give him his life, albeit the law of God says, “The murderer shall die the death?”… It is true, indeed, a prince should be loath to put out that life that God has put in, and should beware to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince has no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate [lesson] the punishment, but to say he may let the man go free, he has no power. But they will insist further, and say, Is not this on the the judicial laws that was given to the Jews–then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them–they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know that natural men, ethnics, who had never the law of the Jews, they executed the murderer. But yet they insist, and they will bring in the example of good kings, who forgave capital crimes committed against the very universal and natural law; and namely of David. Forgave he not Joab for slaying of Abner and Amasah? and Amnon, for committing incest? and again, forgave he not Absalom for slaying of Amnon, his brother? But I answer: We are bound to live by God’s laws, and not by examples… Indeed, there is a difference between these crimes that are capital, and the crimes that in their own nature are not capital, but by the laws of princes are made capital; for upon just considerations, the prince has power to dispense with them: as, for example, it was not deadly of the own nature to Shimei to go out of the ports of Jerusalem, but because Solomon forbade it, it became deadly. Like as it is in the hands of princes to make and to change such special laws; so it lies in his hands to forgive such a man transgressing them, upon weighty and great considerations. So, to return, these crimes that are capital by natural law, a prince has no power to remit them, albeith he were ruler of all the world; he derogates to God’s glory. And secondly, if there were no more to let us see that God has not given that power to forgive capital crimes against God’s law and nature, the judgments of God which ceased on such men and their posterity were sufficient to show it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, vol. 2, pp. 87-90 on Mt. 27:16-17</span></figcaption>

+are+grounded+upon+nature%2C+and+natural+law%2C+we+have+ado+with+them.+As+for+this+law%2C+it+is+natural.+Ye+know+that+natural+men%2C+ethnics%2C+who+had+never+the+law+of+the+Jews%2C+they+executed+the+murderer.+But+yet+they+insist%2C+and+they+will+bring+in+the+example+of+good+kings%2C+who+forgave+capital+crimes+committed+against+the+very+universal+and+natural+law%3B+and+namely+of+David.+Forgave+he+not+Joab+for+slaying+of+Abner+and+Amasah%3F+and+Amnon%2C+for+committing+incest%3F+and+again%2C+forgave+he+not+Absalom+for+slaying+of+Amnon%2C+his+brother%3F+But+I+answer%3A+We+are+bound+to+live+by+God%E2%80%99s+laws%2C+and+not+by+examples%E2%80%A6+Indeed%2C+there+is+a+difference+between+these+crimes+that+are+capital%2C+and+the+crimes+that+in+their+own+nature+are+not+capital%2C+but+by+the+laws+of+princes+are+made+capital%3B+for+upon+just+considerations%2C+the+prince+has+power+to+dispense+with+them%3A+as%2C+for+example%2C+it+was+not+deadly+of+the+own+nature+to+Shimei+to+go+out+of+the+ports+of+Jerusalem%2C+but+because+Solomon+forbade+it%2C+it+became+deadly.+Like+as+it+is+in+the+hands+of+princes+to+make+and+to+change+such+special+laws%3B+so+it+lies+in+his+hands+to+forgive+such+a+man+transgressing+them%2C+upon+weighty+and+great+considerations.+So%2C+to+return%2C+these+crimes+that+are+capital+by+natural+law%2C+a+prince+has+no+power+to+remit+them%2C+albeith+he+were+ruler+of+all+the+world%3B+he+derogates+to+God%E2%80%99s+glory.+And+secondly%2C+if+there+were+no+more+to+let+us+see+that+God+has+not+given+that+power+to+forgive+capital+crimes+against+God%E2%80%99s+law+and+nature%2C+the+judgments+of+God+which+ceased+on+such+men+and+their+posterity+were+sufficient+to+show+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+Select+Works+of+Robert+Rollock%2C+vol.+2%2C+pp.+87-90+on+Mt.+27%3A16-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9d63fb276b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9d63fb276b.html">Permalink</a><a <blockquote><p>5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.</p></blockquote>

<blockquote><p>Whereas this must be observed carefully and forever maintained as the everlasting Truth of God, that the Lord gives a power-spiritual to the work which it had not before He concurs with the act of that power when it is put forth; He gives him a being in the 〈◊〉[state?] of grace, before He leads out the act of that being. He first lets in an influence of a powerful impression upon the faculty of the will, before He concurs with the act 〈◊〉deed. He gives a heart of flesh, and then causes them to walk in his ways: As if one could put a principle of life and motion into another, and then draw forth the act of that power to the performance of the work…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Application of Redemption by the Effectual Work of the Word &amp; Spirit of Christ for the bringing home of lost sinners to God</cite>, (d. 1647; London: Cole, 1656), bk. 10, pp. 411-12</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d7c9d09d0f" data-kw="">
<blockquote><p>1. That it is necessary for salvation, Jn. 3:3.

2. That regeneration is one action in species, and consequently always one and uniform for all, as to essentials.

3. That it is instantaneous, or that it happens in an instant. But what is said by some to be successive is to be understood of the whole complex or collection of the terminus in the first and second moment; but we here treat of the terminus of regeneration in the first moment.

4. That it is perfect (as also all actions of God) according to the divine idea and intention; in the same way the first creation of all things was perfect. But I say it is perfect not only in itself and by reason of God operating (to whom no defect can happen), but also by reason of the terminus and intended effect, and of the operation proportionate to it.

5. That it is supernatural, transcending the whole of nature and its works and the order constituted in creation, Matthew 16:17; John 1:9–10, 12–13.

6. That consequently it is of God alone, no less than creation and resuscitation, Romans 4:17.

7. That the mode of operating or causality of God regenerating is physical, by which one thing is directly changed into another, and the new creature is produced and introduced.

8. That the same is nevertheless called moral or objective, not in itself and with respect to regeneration as such, but by reason of its adjunct, whether antecedent or concomitant, namely, calling.

9. That it is infallible by reason of God’s intention and the event, and irresistible and invincible by reason of the mode and efficacy of operating. For although man according to his innate depravity can do nothing but resist in the divided sense, yet actually he does not resist nor can he resist in the composite sense, when the Holy Spirit regenerating removes resistibility by impressing a new principle of spiritual life.

10. Therefore no voluntary or involuntary of man has place in this first moment, because no human action intervenes, but it is the action of God alone. So that the will conducts itself neutrally and purely passively with respect to the new principle, here willing or not willing nothing. Yet regeneration could be called voluntary as to man by extrinsic denomination from the consequent effect, or by a certain extrinsic respect, on account of the subsequent (not indeed antecedent or simultaneous) consent of the will, or new and regenerate volition, by which, excited by second grace in the second moment, man himself begins to will the spiritual goods offered through calling according to the new will divinely impressed, and according as the Holy Spirit made him willing from unwilling, and works in him τὸ θέλειν [to thelein, the willing] and to accomplish.

11. Finally, that it is difficult if you look to nature and flesh, yet easy if you look to τὸ κράτος τῆς ἰσχύος [to kratos tēs ischuos, the might of the power] divine, Matthew 19:23–26, compared with Ephesians 1:19; Proverbs 21:1; Romans 11:23. Hence omnipotent facility and easy omnipotence are attributed to God regenerating.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-03be889c9b" data-kw="">
<blockquote><p>He says not: ‘ye are the children of God because ye are circumcised, because ye have heard the law and have done the works thereof’ (as the Jews do imagine, and the false apostles teach): but ‘by faith in Jesus Christ’ [Gal. 3:26]. The law then makes us not the children of God, and much less men’s traditions. It cannot beget us into a new nature or a new birth: but it sets before us that old birth whereby we were born to the kingdom of the Devil: And so it prepares us to a new birth which is by faith in Jesus Christ and not by the law, as Paul plainly witnesses: ‘For ye are all the children of God by faith, etc.&#x27;</p></blockquote>

<blockquote><p>V. The notion of regeneration broadly taken is distinguished from the event into ἀργόν [argon, inactive] and ἐνεργῆ [energē, active]. The former is of infants dying before the use of reason. The latter is of adults. Which again is distinguished into that of the first and second moment. The former is that which has for its terminus and formal effect the new creature in the first act, or the spiritual man. The latter is that which has for its terminus and formal effect the second acts of the new creature, or the regenerate man actually exercising and eliciting the motions of faith, repentance, etc. The cause of the former is operating, preventing, or first grace; of the latter, cooperating, second, or subsequent grace. The former impresses new habits or faculties, namely, by informing the mind and will with them and rendering them fit; the latter impresses new motions or acts, namely, by applying the will to them and premoving and preceding it and influencing into it, and thus concurring with it to one and the same effect, and efficiently influencing into the same effect, that is, co-producing it. The former is simply instantaneous; the latter, as to its whole complex, successive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>

<div class="actions"><button class="copy" data-copy="“V. The notion of regeneration broadly taken is distinguished from the event into ἀργόν [argon, inactive] and ἐνεργῆ [energē, active]. The former is of infants dying before the use of reason. The latter is of adults. Which again is distinguished into that of the first and second moment. The former is that which has for its terminus and formal effect the new creature in the first act, or the spiritual man. The latter is that which has for its terminus and formal effect the second acts of the new creature, or the regenerate man actually exercising and eliciting the motions of faith, repentance, etc. The cause of the former is operating, preventing, or first grace; of the latter, cooperating, second, or subsequent grace. The former impresses new habits or faculties, namely, by informing the mind and will with them and rendering them fit; the latter impresses new motions or acts, namely, by applying the will to them and premoving and preceding it and influencing into it, and thus concurring with it to one and the same effect, and efficiently influencing into the same effect, that is, co-producing it. The former is simply instantaneous; the latter, as to its whole complex, successive.”

— Gisbertus Voetius, Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+The+notion+of+regeneration+broadly+taken+is+distinguished+from+the+event+into+%E1%BC%80%CF%81%CE%B3%CF%8C%CE%BD+%5Bargon%2C+inactive%5D+and+%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%E1%BF%86+%5Benerg%C4%93%2C+active%5D.+The+former+is+of+infants+dying+before+the+use+of+reason.+The+latter+is+of+adults.+Which+again+is+distinguished+into+that+of+the+first+and+second+moment.+The+former+is+that+which+has+for+its+terminus+and+formal+effect+the+new+creature+in+the+first+act%2C+or+the+spiritual+man.+The+latter+is+that+which+has+for+its+terminus+and+formal+effect+the+second+acts+of+the+new+creature%2C+or+the+regenerate+man+actually+exercising+and+eliciting+the+motions+of+faith%2C+repentance%2C+etc.+The+cause+of+the+former+is+operating%2C+preventing%2C+or+first+grace%3B+of+the+latter%2C+cooperating%2C+second%2C+or+subsequent+grace.+The+former+impresses+new+habits+or+faculties%2C+namely%2C+by+informing+the+mind+and+will+with+them+and+rendering+them+fit%3B+the+latter+impresses+new+motions+or+acts%2C+namely%2C+by+applying+the+will+to+them+and+premoving+and+preceding+it+and+influencing+into+it%2C+and+thus+concurring+with+it+to+one+and+the+same+effect%2C+and+efficiently+influencing+into+the+same+effect%2C+that+is%2C+co-producing+it.+The+former+is+simply+instantaneous%3B+the+latter%2C+as+to+its+whole+complex%2C+successive.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F987794b041.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perm <blockquote><p>The Root of David He is called, according to Isa. 53:2, whereas He is said to be a branch out of the root, Isa. 11:1, because although He be but a branch according to the flesh for so much as he came of David, yet He is a root according to his divinity (Rupertus; Pannonius), whereupon David and all the godly are born by faith partaking of his grace, as of sap coming from Him, and consequently of salvation by Him.</p></blockquote>

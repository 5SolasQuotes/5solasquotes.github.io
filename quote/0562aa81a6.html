<main class="wrap"><figure class="quote" id="q-0562aa81a6" data-kw="">
<blockquote><p>Oh Brethren! deceive not your selves. If this be all you look at; if, upon opening this door of hope, this be all you aim at, to make use of the time to secure your selves against oppressors, and never think of closing with God; or, but think of it; you may perhaps go far in pursuit of your own designs, in providing against the evils you sigh under; and, this Parliament may do great things this way:

But let me tell you from God, that this will never do the deed, till the Covenant we have been all this while speaking of, be resolved on, and solemnly entered into by all those that expect any blessing from that High Assembly. Nor this, nor all the Parliaments in the world shall ever be able to make in happy in such a degree at least as we expect, till the Lord hath even glued, and married us all unto himself by mutual Covenant.

It is not only the making of good Laws to remove our present grievances; no, nor the cutting down of all the evil Instruments in our State or Church at one blow, that can secure us against the like; yea, worse evils for the future; but rather, as one wave follows another, so one mischief will still tread on the heels of another, and greater plagues will ever crowd in after the former, till we close with God by such a solemn Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-burges.html">Cornelius Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The first sermon, preached to the Honourable House of Commons now assembled in Parliament at their publique fast. Novemb. 17. 1640</cite>, (London: Philemon Stephens and Christopher Meredith, 1641), p. 43.</span></figcaption>

<blockquote><p>We say, furthermore, that these Reformed Churches do not dissent in the fundamentals of faith. For although they may dissent in some chapters of Doctrine, we nevertheless deny any dissension in the fundamentals of faith… We are not saying here that they do not dissent in rites and ceremonies, for not every such dissension, either by its own nature severs, or ought to sever, the union of the Reformed Churches, especially since none of the Reformed Churches retains rites that are repugnant to the Gospel or introduced with an opinion of worship… Augustine, in Epistle 86, wrote no less skillfully than holily: “Let the garment of the Church be so varied by different observances that it is not torn apart by adverse contentions.”… Furthermore, it should also be added that we do not say that the Reformed Churches do not likewise dissent in the external mode of administering ecclesiastical polity or discipline… Nevertheless, we also contend that, this discrepancy being admitted, there is still no dissension in the fundamentals of faith. Indeed, such diversity in external polity can and ought to be tolerated without injury to or rupture of fraternal unity, especially since all the reformed Churches retain those things which are absolutely necessary, namely, the pure preaching of the Word of God, the due administration of the Sacraments, the ordination of pastors by public authority, and finally, the censure of morals. It is not on account of a difference in external form in these matters, where there is consensus in the fundamentals of faith, that the Reformed Churches should fight among themselves and reject all external ecclesiastical union. … The Foundation of Faith denotes… The primary object of faith, which is Christ the Savior… An epitome of this doctrine of the prophets and apostles [Eph. 2:20], containing in itself the sum of the Law and the Gospel, can be and is accustomed to be most conveniently reduced to four heads. So Augustine in the Enchiridion.

1. The Apostles’ Creed.

2. The Decalogue.

3. The Lord’s Prayer.

4. The doctrine of the sacraments. … But neither do we say they dissent in the very many secondary and tertiary articles, which since they are sufficiently proposed to, revealed to, and understood by all the Reformed Churches, are asserted with unanimous consent by them against the old heresies of the Marcionites, Manichaeans, Arians, Eunomians, Nestorians, Eutychians, and Monothelites, and against the new heresies of the Romanists. In a very few secondary articles not sufficiently proposed to all, or certainly not well enough weighed by them, and in some tertiary ones whose clear deduction from the primary is still hidden from some Churches, let there be dissent… Yet that does not impede the harmony of faith (ὁμονοίαν πίστεως) nor does it, or should it, break the ecclesiastical unity of the said Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 144-53, pp. 145-49</span></figcaption>

<blockquote><p>Largely as a result of the influence of Robert Hamilton, [in early 1679] there was less of a spirit of passive resistance and a greater determination to carry the battle to the authorities. The result was a series of confrontations of increasing violence. These started on 11 March, when Robert Johnstone, the Town Major of Edinburgh, who was noted for his persecution of those who attended unauthorized services, was lured to a house in the city under pretext of dispersing an illegal meeting, and was there set upon by a body of men, of whom Cameron’s brother Michael was one. On 30 March, when a field-meeting at Cummerhead, near Lesmahagow, was challenged by a party of soldiers, the response form those present was so robust that some of the soldiers were wounded and made prisoner, and the lieutenant in charge barely escaped with his life. Three weeks later a government trooper was shot dead, and another seriously wounded, in an attack by a body of armed men on their sleeping-quarters at Newmilns, in Ayshire. The blame for these and other incidents was, of course, attributed to Hamilton and his supporters, though there are good grounds to believe that some of them, particularly the last, were caused by rogue elements which had infiltrated his following and which he could not properly control.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), p. 139</span></figcaption>

<blockquote><p>The second distinction is, between congregations ‘which have a competent and well-qualified eldership, and small congregations, who have but few office-bearers, and those, it may be, not sufficiently able for church government. In this case of insufficiency, a congregation may not independently, by itself, exercise jurisdiction, and not in re propis,” says Parker.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (Edinburgh, 1846), Part 2, Concerning the Assemblies of the Church of Scotland, and the Authority Thereof | Ch. 2, ‘Of the Independency of the Elderships of Particular Congregations’, p. 43</span></figcaption>

<blockquote><p>We desire all people, whom the benign influence of our clemency rules, to turn to the religion which tradition from Peter to the present day declares to have been delivered to the Romans by blessed Peter the Apostle, the religion which it is clear that the Pontiff Damasus and Peter Bishop of Alexandria, a man of apostolic holiness follow; this faith is that we should believe, in accordance with apostolic discipline and Gospel teaching, that there is one Godhead, Father, Son, and Holy Spirit, in an equal Majesty and a holy Trinity.1 We order those who follow this doctrine to receive the title of Catholic Christians, but others we judge to be mad and raving and worthy of incurring the disgrace of heretical teaching, nor are their assemblies to receive the name of churches. They are to be punished not only by Divine retribution but also by our own measures which we have decided in accordance with Divine inspiration.2 Given on the 3rd Kalends of March at Thessalonica, Gratianus and Theodosius being Consuls (February 27, 380).</p></blockquote>

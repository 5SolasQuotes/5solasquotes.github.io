<main class="wrap"><figure class="quote" id="q-688bda96f3" data-kw="">
<blockquote><p>Q. 138, ‘How may we know the Fundamentals, Essentials, or what parts are necessary to Salvation? And is the Papists way allowable that (some of them) deny that distinction, and make the difference to be only in the degrees of men’s opportunities of knowledge?’ …And whereas they [Papists] would make all the parts of Christian faith and practice equally necessary, where men have a capacity and ability to know, believe and practice them, it is a gross deceit… And thereby they make all sins and errors as equal as all duties and truths (James 3:2; 1 John 1, end). Whereas: 1. There is no man that has not some error and some sin. 2. There is no man that does all that ever he was able to do to understand all the truth. 3. Therefore there is no man whose errors themselves are not (many of them at least) culpable or sinful. 4. And they that distinguish between mortal and venial sins, and yet will not distinguish between mortal and venial errors, are either blind or would keep others blind. As it is not so damning a sin for a man to think a vain thought, or to speak a vain word, as not to love God or holiness (no though he was more able to have forborne that idle word than to have loved God), so it is not so mortal a sin (that is, inconsistent with a justified state) to mistake in a small matter (as who was the Father of Arphaxad, or what year the world was drowned in, etc.) as to blaspheme the Holy Ghost or deny Jesus Christ to be the Savior of the world, or to deny that there is a God or everlasting life, or a difference between good and evil. All sins are not equal in magnitude or danger. Therefore all errors are not equal in magnitude sinfulness or danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London, 1673), pt. 3, Christian Ecclesiastics</cite>, p. 895</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c8418870d" data-kw="">
<blockquote><p>I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-98709b5b6d" data-kw="">
<blockquote><p>That the Word and sacraments are not administered rightly and exactly, secundum [in Latin], as altogether agreeing with the prescript of the Lord, no not in all the world; yet albeit they be not administred according to that exact rule, and by reason of our frailty cannot be suddenly reformed, yet may they be so performed that they may be pleasing unto God and healthfull to the Church, yet so as the defect should be lamented and acknowledged; which point if it be not granted, there will be no pure or true Church in all the world; Zachary Ursinus, Catechism, pt. 2, to question 84, fol. 620. That albeit many evil things do go along and be done, yet these things are done by such as hinder reformation, and by the disobedient; not by such as wish and sue for amendment: For ‘blessed are they who hunger and thirst after righteousness,’ Mt. 5:6, (that is) which do desire good things to be done in the Church, which if they be not done it is not their fault: they may in that case retain a good conscience; Ursinus, ibid., fol. 618.</p></blockquote>

<blockquote><p>…the minister who is to preach is to… to call upon the Lord to this effect: ‘To acknowledge our great sinfulness, First, by reason of original sin, which… doth defile our best actions… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed. And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord…&#x27;</p></blockquote>

<blockquote><p>The subject itself as well as the agreement of all the nations demonstrates that theology exists. The subject shows it, for it is both true that God exists and that He is the principle of every good thing in the universe; and God both speaks and acts. The agreement of all nations shows it, for all by the light of nature acknowledge that theology exists.</p></blockquote>

<blockquote><p>Question: Where do the natural knowledge of God and morality originate?

Answer: They do not originate from a new gift which God bestowed upon man after he lost the image of God. There is not a word in Scripture to suggest this. Reason neither teaches this, nor does necessity require it. It is also not a remnant of the image of God in its narrower sense, which consists of spiritual knowledge, righteousness, and holiness. It is a remnant, however, of the image of God in its wider sense, as far as this refers to the subject or essence of the image of God itself. In order to understand this correctly one must consider what the image of God actually is as well as what belongs to it. At the appropriate place these matters shall be discussed more extensively.

(1) Man was not first created in puris naturalibus, that is, he was not created as a purely natural and rational person, having no more than the five senses along with the instant ability to reason, the image of God being impressed upon him subsequent to his creation. It is my opinion that man would not have been truly man if the consciousness of God had not been present from the very outset. Rather, man was created in, and in possession of, the image of God. God, in creating man, created him in His image, generating this image in the very act of creating (Genesis 1:27). The existence of sensitivity as well as the capability for growth, both of which are inherent in the life of animals and vegetation, do not function as components united within a larger entity, but virtualiter et efficaciter, that is, by virtue of innate ability and propensity. The rational soul is also similarly capable of reasoning.

Thus, in a similar manner the image of God contains within itself both the natural knowledge of God and morality. These are not individual entities; neither do they coexist as components of a larger entity, as if in Adam there were a distinction between a knowledge of God and morality which would be of a natural sort, and a spiritual knowledge of the same which would be the image of God. Adam possessed these by virtue of innate ability and propensity. The image of God permeated everything and energized all faculties and motions of the soul; hence all that was within him and was performed by him was spiritual and holy in nature.

(2) Even though the image of God in Adam was indivisible, one can nevertheless distinguish three matters by way of intellectual deduction: 1) its basis or focal point, 2) its nature or essence, and 3) its consequence or purpose. The focal point of the image of God was the soul which is an invisible, immortal spirit, endowed with intellect, a will, and affections. The essence was spiritual knowledge, righteousness, and holiness. The consequence or purpose of the image of God was his glorious position and his exercise of dominion over the animal kingdom.

In reference to the focal point the following must be noted, which when properly understood will answer the initial question and eliminate much confusion concerning this matter. An artist cannot impress someone‟s image upon water or sand. To accomplish this he must have the appropriate base or medium. Similarly, the image of God could not have been impressed upon wood, stone, or an irrational creature. It required an intelligent, willing, rational soul, and a consciousness of God. The soul in Adam could not be separated from the image of God in its narrow sense, as the image of God permeated and energized the entire soul. We are merely making an intellectual deduction here.

As a result of Adam’s fall, the image of God in its narrow sense, consisting of spiritual knowledge, righteousness, and holiness, has been entirely removed from all the faculties and propensities of the soul. Nevertheless, Adam did not lose his human nature. He retained the soul in its essence and propensity, consisting of intelligence, will, disposition, reason, and consciousness of God. The consciousness of God is as natural to man as his ability to reason. This ability is at all times common to man, and to man only.

One can therefore state this in reverse: every human being is conscious of a deity, and a being which is conscious of a deity is necessarily a human being. Yes, by virtue of his consciousness of God[,] man distinguishes himself even further and more clearly from animals than by his ability to reason. In some animals one can discern a trace or semblance of the ability to reason, although such animals are not consciously aware of their activity. The impression of the existence of a deity is entirely absent and cannot be taught. Man’s consciousness of God is innate, however. Even if someone no longer manifests any evidence of this, it does not require many hours, for example, to bring the most savage heathen to an acknowledgement of it, which proves that such is his natural propensity. The consciousness of deity, viewed here as a propensity rather than the act itself, is not a remnant of the image of God in its narrower sense which consists of spiritual knowledge, righteousness, and holiness.

To insist otherwise would create unsolvable difficulties. It is, however, possible to state that it is a remnant of the image of God in its wider sense, which includes the previously mentioned faculties of the soul, and those only. It therefore belongs to the essential nature of man, so that the natural consciousness of God, as well as the natural morality which proceeds from it, do not merely differ in degree from the essential elements of the image of God—that is, spiritual knowledge, righteousness, and holiness—but they differ in their very nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 17-19.</span></figcaption>

ge+of+God+in+its+narrow+sense%2C+consisting+of+spiritual+knowledge%2C+righteousness%2C+and+holiness%2C+has+been+entirely+removed+from+all+the+faculties+and+propensities+of+the+soul.+Nevertheless%2C+Adam+did+not+lose+his+human+nature.+He+retained+the+soul+in+its+essence+and+propensity%2C+consisting+of+intelligence%2C+will%2C+disposition%2C+reason%2C+and+consciousness+of+God.+The+consciousness+of+God+is+as+natural+to+man+as+his+ability+to+reason.+This+ability+is+at+all+times+common+to+man%2C+and+to+man+only.%0A%0AOne+can+therefore+state+this+in+reverse%3A+every+human+being+is+conscious+of+a+deity%2C+and+a+being+which+is+conscious+of+a+deity+is+necessarily+a+human+being.+Yes%2C+by+virtue+of+his+consciousness+of+God%5B%2C%5D+man+distinguishes+himself+even+further+and+more+clearly+from+animals+than+by+his+ability+to+reason.+In+some+animals+one+can+discern+a+trace+or+semblance+of+the+ability+to+reason%2C+although+such+animals+are+not+consciously+aware+of+their+activity.+The+impression+of+the+existence+of+a+deity+is+entirely+absent+and+cannot+be+taught.+Man%E2%80%99s+consciousness+of+God+is+innate%2C+however.+Even+if+someone+no+longer+manifests+any+evidence+of+this%2C+it+does+not+require+many+hours%2C+for+example%2C+to+bring+the+most+savage+heathen+to+an+acknowledgement+of+it%2C+which+proves+that+such+is+his+natural+propensity.+The+consciousness+of+deity%2C+viewed+here+as+a+propensity+rather+than+the+act+itself%2C+is+not+a+remnant+of+the+image+of+God+in+its+narrower+sense+which+consists+of+spiritual+knowledge%2C+righteousness%2C+and+holiness.%0A%0ATo+insist+otherwise+would+create+unsolvable+difficulties.+It+is%2C+however%2C+possible+to+state+that+it+is+a+remnant+of+the+image+of+God+in+its+wider+sense%2C+which+includes+the+previously+mentioned+faculties+of+the+soul%2C+and+those+only.+It+therefore+belongs+to+the+essential+nature+of+man%2C+so+that+the+natural+consciousness+of+God%2C+as+well+as+the+natural+morality+which+proceeds+from+it%2C+do+not+merely+differ+in+degree+from+the+essential+elements+of+the+image+of+God%E2%80%94that+is%2C+spiritual+knowledge%2C+righteousness%2C+and+holiness%E2%80%94but+they+differ+in+their+very+nature.%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+The+Christian%E2%80%99s+Reasonable+Service%2C+trans.+Bartel+Elshout%2C+ed.+Joel+R.+Beeke+%281700%3B+Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+1992%29%2C+1%3A+17-19.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa7afc43f70.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a7afc43f70.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/03/20/wilhelmus-a-brakel-on-the-origin-of-the-natural-knowledge-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-16b7855172" data-kw="">
<blockquote><p>Q. What is the Word to be with reference unto us?

A. A Rule.

Q. Is any other Rule sufficient for our direction?

A. No, this is the only Rule.

Q. Can we receive sufficient directions from our own wisdom, or the light of nature, to come to glorify, and enjoy God?

A. No.

Q. Can we receive sufficient direction from God’s works of Creation, and Providence?

A. No.

Q. Is the Scripture a sufficient Guide?

A. Yes.

Q. In what do the Scriptures direct us?

A. How we may glorify God, and enjoy him for ever.

Q. Can we never learn then how to glorify God here, or to enjoy him hereafter, without the guidance, and directions of the Scriptures?

A. No.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-14a00d8b26" data-kw="" data-pol="">
<blockquote><p>And truly we can expect nothing from the Tridentines who serve under Neptune but what is of a watery nature, when the business to be undertaken is the Reformation of the Church. But when persecution is to rage against the innocent, and impious tyranny is to be confirmed by the blood of the godly, they at once blaze into flame.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Preface to the Pious Reader</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome.html">Rome (General)</a><a class="tag" href="../topics/church/nature-and-marks.html">Nature &amp; Marks</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf384d238d" data-kw="" data-pol="">
<blockquote><p>There, instead of the ministry of the word, prevails a perverted government, compounded of lies, a government which partly extinguishes, partly suppresses, the pure light. In place of the Lord&#x27;s Supper, the foulest sacrilege has entered, the worship of God is deformed by a varied mass of intolerable superstitions; doctrine (without which Christianity exists not) is wholly buried and exploded, the public assemblies are schools of idolatry and impiety.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.2.2</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome.html">Rome (General)</a><a class="tag" href="../topics/church/nature-and-marks.html">Nature &amp; Marks</a></div>

</figure><figure class="quote" id="q-70fbe0dd05" data-kw="" data-pol="">
<blockquote><p>The schools of the Sophists have taught with remarkable agreement that the sacraments of the new law (those now used in the Christian church) justify and confer grace, provided we do not set up a barrier of mortal sin. How deadly and pestilential this notion is cannot be expressed — and the more so because for many centuries it has been a current claim in a good part of the world, to the great loss of the church. Of a certainty it is diabolical. For in promising a righteousness apart from faith, it hurls souls headlong to destruction… Hence, any man is deceived who thinks anything more is conferred upon him through the sacraments than what is offered by God’s Word and received by him in true faith. From this something else follows: assurance of salvation does not depend upon participation in the sacrament, as if justification consisted in it. For we know that justification is lodged in Christ alone, and that it is communicated to us no less by the preaching of the gospel than by the seal of the sacrament, and without the latter can stand unimpaired.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.14.14</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome.html">Rome (General)</a><a class="tag" href="../topics/church/baptism.html">Baptism (General)</a></div>

</figure><figure class="quote" id="q-376e0c9c24" data-kw="" data-pol="">
<blockquote><p>These, whatsoever the Papists say to the contrary, as soon as ever they do but begin to heave and stir in our breasts, are truly sins; and do, in their measure, pollute and defile the soul: for the soul of man is like a clear mirror, upon which if you only breathe, you sully it, and leave a dimness upon it</p></blockquote>
<figcaption>— <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a>, <cite>An Exposition of the Ten Commandments</cite>, The Tenth Commandment</figcaption>
<div class="meta"><a class="tag" href="../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../topics/polemics/rome.html">Rome (General)</a></div>

<main class="wrap"><figure class="quote" id="q-56978ca130" data-kw="">
<blockquote><p>Obedience is Heaven begun, and the sons of God rejoice to see him take his honour, and call all worlds around him to esteem and love him, as most worthy. They are not under the law in whole or part, so far as it has sanctions, threats, or promises. But let us hear in mind — for there may he ere long another Antinomian outbreak — that in the measure in which we win Christ, it will be our meat to do the Father’s will as it was his beforehand. Our willingness to obey just shows how far we have tasted the sweetness of the promises, how far we have apprehended Christ.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5052115699" data-kw="">
<blockquote><p>It is therefore a great practical doctrine—that Jesus is not simply a Redeemer from sin, but the Founder and Head of a Kingdom. He has not only taught men a system of opinions concerning God, but instituted also, and rules over, a community. He hath given not simply a precept to be obeyed—a rule for the government of life—an opinion to be held by each individual separately—the body of his followers, like those of Socrates or Plato, combining merely by accidental agreement in opinion: far beyond all this.

He hath constructed a Society; his followers are made members of a community with new social relations. To believe in Jesus is not merely the adoption of an opinion. The very act of faith whereby his followers receive his doctrine, unites them also to Him as members of his mystical body, and through Him to one another. They become a combination of men who are members of one spiritual body—brethren of one holy family. And this is the Kingdom of Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stuart-robinson.html">Stuart Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom on Earth: A Self-Expanding Missionary Society. A Discourse for the Presbyterian Board of Foreign Missions; Preached in the First Presbyterian Church, N.Y., May 6, 1855</cite>, (New York: Edward O. Jenkins, 1855), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

ner" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-e51aa60dd1" data-kw="">
<blockquote><p>It is a question: An sancti fruantur beatitudine ante ultimum judicium? [Whether the saints enjoy blessedness before the Last Judgment?] It was a current opinion among most of the Fathers, if not all that the souls of men after their death do not go immediately to heaven, but are in a receptacle or mansion-place till the day of Judgement, and some of late have followed it, especially the Anabaptists. The souls immediately departed have not the compleat fullness of that happiness which they shall have, yet they are not excluded from the enjoying of God, Lk. 23:43; 2 Cor. 5:1; Phil. 1:23. Some say there is a difference of those that are raised again, as Lazarus and some others; for it is likely (say they) that their souls went not into heaven, but were detained by God, who would unite them again to show forth his glory. The accidental joy of the saints (say the [Medieval] Schoolmen) shall be greater, both extensively, because it shall be in soul and body, and intensively, because the soul shall rejoyce to see the body glorified. 2. The essential glory shall increase extensively, because it shall redound unto the body. The souls of the godly immediately after their departure hence from the body are said to be in rest, Heb. 4:11 in consolation, Lk. 16:25, in security, Jn. 11:15,18, therefore they presently go to heaven, to God and Christ. Consider the names given to the state of glory: it is called Life, ‘These shall enter into life’; Rest, find rest, go to rest; our home, our Fathers’ house; a purchased and glorious inheritance; A Kingdom, the Kingdom of heaven; Joy, our Master’s joy, everlasting joy; Glory, weight of glory, eternal weight of glory; The City of our God. The Scripture calls it Paradise, a place of all delight and pleasure, alluding to that Paradise planted by God’s own hand, to make it a delight for the innocent state of man, and Abrahams bosom, wherein the Saints receive refreshing, which is a borrowed speech taken from fathers carrying and cherishing their little one, in their bosome, so the elect are cherished in the bosom of the father of all the faithful. There is perfection, perpetuity, immutability, there is Foelix securitas, secura foelicitas. Bernard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 10, ch. 4, ‘Of Everlasting Life’, pp. 869-70</span></figcaption>

</figure><figure class="quote" id="q-c9829607ae" data-kw="">
<blockquote><p>How much of spiritual meaning and significance is revealed to the eye of faith, in that great truth “He inhabiteth eternity.” From eternity did God exist, and infinitely happy in his own glory. His being is underived, and never had a beginning; before angel and arch-angel were called into being to celebrate his praises, did our God exist in his own uncreated glory. The blessed spirits of heaven, who, as they receive their existence from the “high and lofty One,” derive also their happiness from the infinite happiness which resides in his perfections, and delight to magnify his glory, and to do his will. Their fervid praises ascend to him, who has given them all their powers of serving him, and their capacities of enjoying him. In the immediate dwelling place of God are the souls of the redeemed, who “have passed beyond tribulation, and who, clothed with white robes and palms in their hands,” cry with a loud voice, saying, “Salvation to our God which sitteth upon the throne, and unto the Lamb.”

Infinite happiness is in the immediate dwelling-place of him who inhabits eternity; unutterable glory is also around the God of our salvation. The Word of God elevates our faith, and calls upon us to entertain devout and adoring views of the glory of him, who is holy in his nature, and holy and righteous in all his ways. Yet, though thus glorious and exalted, though infinite in his own happiness, though inconceivably pure and holy in his essence, though requiring no services of any created beings that rejoices in the excellence of his will, to add to his internal and infinite happiness and complacency, yet, amazing truth of God’s own grace and condescension, he delights to come forth from the glory which he inhabits in eternity, and to dwell with them, who in the depths of humility and self-abasement, feel their own guilt and unworthiness in his holy and omniscient view, and in faith and love acknowledge him as their God in Christ.

What a precious revelation does the Prophet give of the grace of God! What a consolatory representation of his unsearchable condescension! While God dwells in the heavens, and praises of eternity — while he dwells in the “high and holy place” — a heavenly temple—the grandeur, the purity, the glory of which befit the blessed perfections of his nature — yet he dwells also with him who is of a contrite and humble spirit — God dwells with such for a blessed and gracious purpose — “to revive the spirit of the humble, and to revive the heart of the contrite ones.” In his wisdom and grace, he has devised a glorious plan of salvation, through which he can hold communion with those in whom these spiritual qualities reside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mungo-fairlie-parker.html">Mungo Fairlie Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Dwelling with the Humble and Contrite, the Source of their Revival’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

Infinite happiness is in the immediate dwelling-place of him who inhabits eternity; unutterable glory is also around the God of our salvation. The Word of God elevates our faith, and calls upon us to entertain devout and adoring views of the glory of him, who is holy in his nature, and holy and righteous in all his ways. Yet, though thus glorious and exalted, though infinite in his own happiness, though inconceivably pure and holy in his essence, though requiring no services of any created beings that rejoices in the excellence of his will, to add to his internal and infinite happiness and complacency, yet, amazing truth of God’s own grace and condescension, he delights to come forth from the glory which he inhabits in eternity, and to dwell with them, who in the depths of humility and self-abasement, feel their own guilt and unworthiness in his holy and omniscient view, and in faith and love acknowledge him as their God in Christ.

What a precious revelation does the Prophet give of the grace of God! What a consolatory representation of his unsearchable condescension! While God dwells in the heavens, and praises of eternity — while he dwells in the “high and holy place” — a heavenly temple—the grandeur, the purity, the glory of which befit the blessed perfections of his nature — yet he dwells also with him who is of a contrite and humble spirit — God dwells with such for a blessed and gracious purpose — “to revive the spirit of the humble, and to revive the heart of the contrite ones.” In his wisdom and grace, he has devised a glorious plan of salvation, through which he can hold communion with those in whom these spiritual qualities reside.”

— Mungo Fairlie Parker, God s Dwelling with the Humble and Contrite, the Source of their Revival’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHow+much+of+spiritual+meaning+and+significance+is+revealed+to+the+eye+of+faith%2C+in+that+great+truth+%E2%80%9CHe+inhabiteth+eternity.%E2%80%9D+From+eternity+did+God+exist%2C+and+infinitely+happy+in+his+own+glory.+His+being+is+underived%2C+and+never+had+a+beginning%3B+before+angel+and+arch-angel+were+called+into+being+to+celebrate+his+praises%2C+did+our+God+exist+in+his+own+uncreated+glory.+The+blessed+spirits+of+heaven%2C+who%2C+as+they+receive+their+existence+from+the+%E2%80%9Chigh+and+lofty+One%2C%E2%80%9D+derive+also+their+happiness+from+the+infinite+happiness+which+resides+in+his+perfections%2C+and+delight+to+magnify+his+glory%2C+and+to+do+his+will.+Their+fervid+praises+ascend+to+him%2C+who+has+given+them+all+their+powers+of+serving+him%2C+and+their+capacities+of+enjoying+him.+In+the+immediate+dwelling+place+of+God+are+the+souls+of+the+redeemed%2C+who+%E2%80%9Chave+passed+beyond+tribulation%2C+and+who%2C+clothed+with+white+robes+and+palms+in+their+hands%2C%E2%80%9D+cry+with+a+loud+voice%2C+saying%2C+%E2%80%9CSalvation+to+our+God+which+sitteth+upon+the+throne%2C+and+unto+the+Lamb.%E2%80%9D%0A%0AInfinite+happiness+is+in+the+immediate+dwelling-place+of+him+who+inhabits+eternity%3B+unutterable+glory+is+also+around+the+God+of+our+salvation.+The+Word+of+God+elevates+our+faith%2C+and+calls+upon+us+to+entertain+devout+and+adoring+views+of+the+glory+of+him%2C+who+is+holy+in+his+nature%2C+and+holy+and+righteous+in+all+his+ways.+Yet%2C+though+thus+glorious+and+exalted%2C+though+infinite+in+his+own+happiness%2C+though+inconceivably+pure+and+holy+in+his+essence%2C+though+requiring+no+services+of+any+created+beings+that+rejoices+in+the+excellence+of+his+will%2C+to+add+to+his+internal+and+infinite+happiness+and+complacency%2C+yet%2C+amazing+truth+of+God%E2%80%99s+own+grace+and+condescension%2C+he+delights+to+come+forth+from+the+glory+which+he+inhabits+in+eternity%2C+and+to+dwell+with+them%2C+who+in+the+depths+of+humility+and+self-abasement%2C+feel+their+own+guilt+and+unworthiness+in+his+holy+and+omniscient+view%2C+and+in+faith+and+love+acknowledge+him+as+their+God+in+Christ.%0A%0AWhat+a+precious+revelation+does+the+Prophet+give+of+the+grace+of+God%21+What+a+consolatory+representation+of+his+unsearchable+condescension%21+While+God+dwells+in+the+heavens%2C+and+praises+of+eternity+%E2%80%94+while+he+dwells+in+the+%E2%80%9Chigh+and+holy+place%E2%80%9D+%E2%80%94+a+heavenly+temple%E2%80%94the+grandeur%2C+the+purity%2C+the+glory+of+which+befit+the+blessed+perfections+of+his+nature+%E2%80%94+yet+he+dwells+also+with+him+who+is+of+a+contrite+and+humble+spirit+%E2%80%94+God+dwells+with+such+for+a+blessed+and+gracious+purpose+%E2%80%94+%E2%80%9Cto+revive+the+spirit+of+the+humble%2C+and+to+revive+the+heart+of+the+contrite+ones.%E2%80%9D+In+his+wisdom+and+grace%2C+he+has+devised+a+glorious+plan+of+salvation%2C+through+which+he+can+hold+communion+with+those+in+whom+these+spiritual+qualities+reside.%E2%80%9D%0A%0A%E2%80%94+Mungo+Fairlie+Parker%2C+God+s+Dwelling+with+the+Humble+and+Contrite%2C+the+Source+of+their+Revival%E2%80%99+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9829607ae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9829607ae.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/01/mungo-fairlie-parker-on-the-gracious-condescension-of-the-infinitely-exalted-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

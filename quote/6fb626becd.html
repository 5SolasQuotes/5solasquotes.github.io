<main class="wrap"><figure class="quote" id="q-6fb626becd" data-kw="">
<blockquote><p>The rainbow, the symbol of the covenant with Noah, is typical of our Lord Jesus, who is the Lord’s witness to the people. When can we expect to see the token of the covenant? The rainbow is only to be seen when there are clouds. When the sinner’s conscience is dark with clouds, when he remembers his past sin and mourns and laments before God, then Jesus Christ is revealed to him as the Covenant Rainbow, displaying all the glorious hues of the divine character and promised peace.

When the believer’s trials and temptations surround him, it is sweet to behold the person of our Lord Jesus Christ and to see Him bleeding, living, rising, and pleading for us! God’s rainbow is hung over the cloud of our sins, sorrows, and woes, prophesying deliverance. A cloud alone does not give a rainbow, but there must be the crystal drops to reflect the light of the sun.

Our sorrows must not only threaten, but they must also really fall upon us. There would have been no Christ for us if the vengeance of God had been merely a threatening cloud; punishment had to fall in terrible drops upon the Promise. Until there is real anguish in the sinner’s conscience, there is no Christ for him. Until the chastisement that he feels becomes severe, he cannot see Jesus. But there must also be sun. Clouds and drops of rain do not make rainbows unless the sun shines.

Beloved, our God, who is as the sun to us, always shines. We may not always see Him, for clouds might hide His face; but no matter what drops may be falling or what clouds may be threatening, if He shines, there will be a rainbow at once. It is said that when we see the rainbow, the shower is over. It is certain that when Christ comes, our troubles will be ended forever. When we behold Jesus, our sins vanish and our doubts and fears subside. When Jesus walks on the waters of the sea, how profound is the calm!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evening by Evening: Daily Devotional Readings</cite>, (1865; rev. edn, Aneko Press, 2020) 12 August, p. 232.</span></figcaption>

<blockquote><p>8. When Christ knocks and presses hardest, it’s for our own good, and it’s a token of love in Him to do so; for, there is nothing more deplorable, than when He says to one under indisposition, and in an evil case, ‘Let him alone.’ …

10. Christ may call very pressingly, and his Word may have some work on the conscience and affections of hearers, and they be some-way affected with it, and yet the Word be rejected, and the heart not made open to Christ; as here she sleeps still notwithstanding; and the following verse confirms it.

11. There are some operations of the Spirit, which though they be more than a common work on the generality of hearers, yet are not saving, and may be, and often are, even by believers frustrated for a time, and by others for ever; for, this knocking gets a refusal, verse 3. So deceiving, beguiling and dangerous are common motions to rest on, when the finger of gracious Omnipotency is not applied, as verse 4.</p></blockquote>

<blockquote><p>The persons called by God, who yet are not chosen, are of two sorts, as you heard: First, those, who, though so graciously invited, do yet obstinately and peremptorily refuse, and these are actively only called on God’s part. The second sort is of those who do give consent, and yield to their call, but because they do not rise up fully to all that is required, therefore they are cast away. In this [latter] rank is the man, who being invited, made no opposition or excuse, but went in and sat down at the feast, was as confident as the other guests, seems to be conscious to himself of no fault, but having no wedding garment, the master is so wroth and displeased with him, that he is adjudged to everlasting torments; and from this instance our Savior gathers this conclusion in the text [circa Mt. 22:14]; so that the meaning is: Of those many that are called , and give a general acceptance of it, yet few are chosen to eternal glory: Those enjoy the feast of the ordinances here, who are to be tormented for ever hereafter; those are admitted to eat in God’s presence here, who shall be commanded to depart from Him hereafter, He knows them not: Many are admitted into the temple that may not enter into the holiest of holies… That men did receive the truth as to some particulars and some degrees, but not wholly and thoroughly… Thou receivest Christ and his ways but in parcels, though thou hast baptism, the title of a Christian, sittest down at the ordinances, yet where is the wedding-garment! where is the conversation that does agree and belong to so holy a matter? To open this doctrine, let us consider: First, Wherein lies this outward obedience to God’s call, which yet is ineffectual; for can anything more concern you than that you should not be Christians in vain? that all thy praying and frequenting of holy duties may not be in vain? that God may not take thee from this feast, as Haman was from his in which he so much boasted, to be put into confusion and everlasting fear?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, ... (London: Miller, 1652), sermon 119, on Mt. 22:14, pp. 632-33</span></figcaption>

<blockquote><p>Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, ... (London: E.G., 1641), on 2 Pet. 1:10-11, p. 164</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.”

<blockquote><p>We have spoken at large of the participation of the grace of Christ and the benefits of the Gospel: Now we are come unto the means whereby God does effect these things. Show therefore how and in what manner God does offer and communicate the Covenant of Grace unto mankind? By vocation or calling, Rom. 8:30; Heb. 3:1, when God, by the means of his Word and Spirit acquainting men with his gracious purpose of salvation by Christ, invites them to come unto Him, Hos. 2:14, and revealing unto them his Covenant of grace, Mt. 11:27; 16:17; Jn. 14:21; Ps. 25:14, brings them out of darkness to light, Acts 26:18. Is this calling of one sort only? No: there is an external gathering common to all, together with some light of the Spirit and certain fruits of the same, attained unto by some that are not heirs of the promise: for many are called with this outward and ineffectual calling, who are not chosen, Isa. 48:12; Mt. 22:14. And there is an internal and effectual calling, peculiar to those few that are elect; whereby unfeigned faith and true repentance is wrought in the heart of God’s chosen; and God (become in Christ their Father) does not only outwardly by his Word invite, but inwardly also, and powerfully by his Spirit allure and win their hearts to cleave to Him inseparably unto salvation, Gen. 9:27; Ps. 25:14; 60:6. 5. 4; Joel 2:32; Acts 2:39. How do both these kinds of callings differ? Howsoever we are to judge charitably of all outwardly called, 1 Cor. 1:2, because who among them is also inwardly called, is only known to God, 2 Tim. 2:19, yet does this outward calling differ from the inward.

1. In that it is wrought only by outward means, and common illumination, Heb. 4:2, without the spirit of regeneration, Jude verse 19, or any portion of saving faith, Lk. 8:13.

2. In that they are admitted only to an outward and temporary league of formal profession, Acts 8:13; Rom. 9:4-5, not to that entire fellowship with Christ required unto salvation, 1 Jn. 2:19; 1 Cor. 1:8-9. What are the means which God has appointed to call us by? They are partly inward, and partly outward, 1 Thess. 5:19-20; Acts 10:44. What are the inward? The Spirit of God, which is given by the outward things, Gal. 3:2-3; 1 Tim. 1:14. What mean you by the Spirit of God in this place? That power of God which works in the hearts of men things which the natural discourse of reason is not able to attain unto. Being incomprehensible, how may we come to some understanding and sense of it? By the things whereunto it is compared:

1. To wind, Acts 2, to show the marvelous power of it in operation.

2. To oil, Heb. 1:9, that is of a hot nature that pierces and supplies.

3. To water, Jn. 4, that cools, scours and cleanses.

4. To fire, Mt. 3; Acts 2, that severs dross and good metal. How is the operation of it? Diverse; as softening and hardening, enlightening and darkening, which it works after a diverse manner, by the Word in the hearts of the elect and reprobate, according to the good pleasure of God’s secret will only, and after that, according to the good pleasure of his revealed will; so that the lawful use thereof is rewarded with a gracious increase of blessing, and the abuse punished with further hardness to condemnation. What then does the Spirit work in the wicked? Finding them hard, it hardens them more to their further condemnation. What does the same Spirit work in the godly? Faith, whereby they take hold on Christ with all his benefits, Eph. 2:8. What are the outward things which God has given to call us by? They are either common to the whole world, or proper to the Church. What are the things common to the whole world? God’s works not unprofitably given, although not sufficient to salvation. Is not the knowledge of the wisdom, power and goodness of God in the creation and government of the heaven and earth, with the things that are in them, sufficient to make us wise to salvation? No: First, it serves rather for further condemnation without the Word, Rom. 1:19-21. Secondly, as by and with the Word, the due meditation and consideration of God’s works is a good help to further us in religion and in the graces of God’s Spirit, 1 Cor. 1:21-22.</p></blockquote>

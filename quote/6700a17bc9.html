<main class="wrap"><figure class="quote" id="q-6700a17bc9" data-kw="">
<blockquote><p>What spirit shall we think they have, that will unchurch churches, because they have some defilement and unbrotherly brethren, accounting them no churches, no brethren, because they have some imperfections? Why hath not Christ a quarrel to the church then? is he blind? doth his love make him blind? No; he seeth corruption, but he seeth better things; somewhat of his own, that makes him overlook those imperfections, because they are such as he means to mortify, subdue, wear away, and to fire out by the power of his Spirit, which as fire shall waste all those corruptions in time. So it is with the church. Put the case, she hath some corruptions: that it be not with her as it should be, yet she is a church notwithstanding. The church of Corinth, we see, Paul styles them saints and brethren, with all those sweet names (1 Cor. 1:1, 2), notwithstanding they had many corruptions among them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), pp 149-50.</span></figcaption>

</figure><figure class="quote" id="q-5f9ffa19d6" data-kw="">
<blockquote><p>Q. 2. On the Way that we Know God Positively we can say, following the lead of Scotus (Oxon. 1 d. 3 part one q.1) that our knowledge of God is: 1) Positive and not merely negative, because a purely negative knowledge is no knowledge. 2) Quidditative or essential and not merely knowledge of his existence or attributes, for in understanding existence or property we must pre-understand some quasi-subject in which we understand that quasi-property to be present in; therefore we do not merely understand whether God is but to some extent and imperfectly what God is. 3) Not merely in a concept analogous to the concept of a creature which, concept is altogether other than the one said of a creature, but in some concept univocal to God and creatures. This is plain directly from experience and indirectly follows once innatism, illuminationism, and ontologism have been rejected (see below). 4) Proper, but through concepts composed of common concepts. We can attain to many concepts proper to God that do not belong to creatures, for example, supreme being, infinite good, pure act, supreme legislator, etc. But concepts of this sort are not proper notions from proper notions but from transcendental notions, as first, supreme, being, good, which are predicated in common of God and creatures. 5) Notions abstracted from creatures, for as Scotus says, “All metaphysical investigation of God proceeds as follows: a) by considering the formal idea of something, and b) by taking away from that formal idea the imperfection that it has in creatures, and c) by keeping that formal idea and attributing to it altogether supreme perfection, and by thus attributing it to God” (Oxon. ibid.). Note the triple way, namely of affirmation, of negation, and of eminence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958) Wolter was a Scotus scholar and writes from that perspective., p. 87</span></figcaption>

</figure><figure class="quote" id="q-bb970912a4" data-kw="">
<blockquote><p>21. The effects of justification, or its necessary consequences, are:

1. Actual adoption, Eph. I.5.

2. Peace of conscience, Rom. V.1.

3. Love, Luke VII.47; and other spiritual charismata [gifts] of that kind, which the Spirit of adoption works in the hearts of the justified. For justification is to be conjoined with sanctification by an inseparable and perpetual bond, yet not to be confounded with it; and to those for whom Christ has been made δικαιοσύνη [dikaiosynē, righteousness], to them He has also been made ἁγιασμός [hagiasmos, sanctification], 1 Cor. I.30.

4. Life and glory, Rom. VIII.30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

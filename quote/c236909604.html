<main class="wrap"><figure class="quote" id="q-c236909604" data-kw="monastic">
<blockquote><p>Now although they are not agreed as to the number (some making more, others fewer), still there are three principal ones upon which they build up the monastic life, continence, obedience and poverty. To these the three vows imposed upon monks correspond: of perpetual continence, regular obedience and voluntary poverty. Of the orthodox. II. On the other hand, the orthodox do not deny that there are certain indifferent works left to each one’s own will in the Scriptures, and with respect to which counsels may be given in the word of God, not improperly distinguished from the precepts necessarily to be obeyed: such as Paul’s counsel concerning a virgin’s marrying or not marrying (1 Cor. 7:26, 36); concerning the use of wine with regard to Timothy (1 Tim. 5:23*). Still they are of such a nature that they are not of themselves pleasing to God and when neglected, deserve no punishment; nor when observed, any reward. But they deny that there are any such counsels about moral things, since these fall under commands properly so called, not under counsels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/monasticism.html">Monasticism</a></span></div>

</figure><figure class="quote" id="q-fe5f29ba12" data-kw="">
<blockquote><p>We complain that the whole doctrine of godliness is adulterated by impious dogmas; that the whole worship of God is vitiated by foul and disgraceful superstitions; that the pure institution of the sacraments has been supplanted by horrible sacrilege; that their use has been converted into a profane trafficking; that poor souls, which ought to have been ruled by the doctrine of Christ, are oppressed by cruel bondage; that nothing is seen in the Christian Church that is not deformed and debased; that the grace of Christ not only lies half-buried, but is partly torn to pieces, partly altogether extinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, p. 20</span></figcaption>

</figure><figure class="quote" id="q-d9cb792a33" data-kw="">
<blockquote><p>Meanwhile, seeing that this brutish stupidity has overspread the globe, men longing after visible forms of God, and so forming deities of wood and stone, silver and gold, or of any other dead and corruptible matter, we must hold it as a first principle, that as often as any form is assigned to God, his glory is corrupted by an impious lie.</p></blockquote>

</figure><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 100</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c236909604" data-kw="monastic">
<blockquote><p>Although they are not agreed as to the number (some making more, others fewer), still there are three principal ones upon which they build up the monastic life, continence, obedience and poverty. To these the three vows imposed upon monks correspond: of perpetual continence, regular obedience and voluntary poverty. Of the orthodox. II. On the other hand, the orthodox do not deny that there are certain indifferent works left to each one’s own will in the Scriptures, and with respect to which counsels may be given in the word of God, not improperly distinguished from the precepts necessarily to be obeyed: such as Paul’s counsel concerning a virgin’s marrying or not marrying (1 Cor. 7:26, 36); concerning the use of wine with regard to Timothy (1 Tim. 5:23*). Still they are of such a nature that they are not of themselves pleasing to God and when neglected, deserve no punishment; nor when observed, any reward. But they deny that there are any such counsels about moral things, since these fall under commands properly so called, not under counsels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/monasticism.html">Monasticism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-48f84ab3d4" data-kw="">
<blockquote><p>Do we not see with our eyes that in the Roman Church the people is denied the Communion of the cup? Do we not see pictures of the Trinity, and the people bowing the knee before images? Do we not hear public service and prayers in an unknown tongue? And if these things be formally prohibited in the holy Scripture, are they not unto us sensible marks of a false and erroneous Church?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, ch. 28</span></figcaption>

</figure><figure class="quote" id="q-063a9a14a7" data-kw="">
<blockquote><p>The old father Epiphanius saith:--&quot;It is a horrible wickedness, and a sin not to be suffered, for any man to set up any picture in the Church of the Christians, yea, though it were the picture of Christ Himself.&quot; Yet, these men store all their temples, and each corner of them, with painted and carved images, as though without them religion were nothing worth.</p></blockquote>

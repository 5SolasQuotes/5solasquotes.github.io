<blockquote><p>The Anabaptists, not content with this moderation in swearing oaths, condemn all oaths without exception, since Christ’s prohibition of them is general. “I say to you, Do not swear at all, … but let what you say be simply, ‘Yes, yes’ or ‘No, no’; anything more than this comes from evil.” [Matt. 5:34, 37; cf. James 5:12.] But in this way they heedlessly dash against Christ, making him the Father’s enemy as if he had come down to earth to set aside God’s decrees. Now the eternal God not only permits oaths as a legitimate thing under the law (which should be sufficient), but commands their use in case of necessity [Ex. 22:10–11]. But Christ declares that he is one with the Father [John 10:30]; that he brings nothing but what the Father has commanded [John 10:18]; that his teaching is not from himself [John 7:16], etc. What then? Will they make God contradict himself so that he afterward forbids and condemns what he once approved by enjoining it upon men’s behavior? But because there is some difficulty in Christ’s words, let us spend a little time on them. Here, however, we shall never attain the truth unless we fix our eyes upon Christ’s intention and give heed to what he is driving at in that passage. It was not his purpose either to slacken or tighten the law, but to bring back to a true and genuine understanding what had been quite corrupted by the false devisings of the scribes and Pharisees. If we understand this, we will not think that Christ condemned oaths entirely, but only those which transgress the rule of the law. From these words it is clear that the people then commonly avoided perjury only, while the law forbids not only perjuries but also empty and superfluous oaths. Therefore the Lord, the surest interpreter of the law, warns that it is evil not only to swear falsely but also to swear [Matt. 5:34]. Why “to swear”? Surely he means “to swear in vain.” But the oaths that are commended in the law, he leaves untouched and free. Our opponents think that they argue more compellingly when they doggedly seize upon the expression “at all.” Yet this does not refer to the word “to swear,” but to the forms of oaths following thereafter. For this, also, was a part of their error, that while they swore by heaven and earth they thought they did not touch the name of God. After the chief instance of transgression, therefore, the Lord also cuts off all excuses from them in order that they may not suppose they have escaped by calling on heaven and earth, while suppressing God’s name. eWe ought also to note this in passing: although the name of God is not expressed, yet men swear by him indirect forms; as when they swear by the light of life, by the bread they eat, by their baptism, or by other tokens of God’s generosity toward them. Christ, in that passage forbidding men to swear by heaven and earth and Jerusalem [Matt. 5:34–35], is not correcting superstition, as some falsely think. Rather, he is refuting the wily sophistry of those who see nothing wrong in idly tossing about indirect oaths—as if they spared God’s sacred name, when it is actually engraved upon all his benefits. It is another matter when some mortal, or deceased person, or angel is substituted in place of God; just as among the heathen nations that loathsome form of swearing by the life or by the genius of the king was devised by way of adulation. For then such false deification obscures and lessens the glory of the one God. But when we intend only to seek confirmation of our statements from God’s holy name, although it be done indirectly, injury is done to his majesty by all such trifling oaths. Christ deprives this license of vain excuse, forbidding us to “swear at all.” James, repeating those words of Christ which I have cited, has the same intent [James 5:12]. For such rashness, although it is a desecration of God’s name, has always been widespread in the world. If you should refer the expression “at all” to the substance, as if it were without exception unlawful to swear any oath, how would you explain what is immediately added: “Neither by heaven, nor by the earth,” etc.? From these words it is sufficiently clear that Christ has met the quibbles whereby the Jews thought their fault lightened.</p></blockquote>

<blockquote><p>§19. Question 12. If another man deceive me into a promise or covenant against my good, am I bound to perform it when I have discovered the deceit? Answer: Yes, 1. in case that the law of the land or other reasons for the public good require it; 2. Or in case that you were faulty by negligence, heedlessness, or otherwise guilty of your own deceit, in any considerable and avoidable degree. Otherwise, in that measure that he deceived you, and in those respects you are not obliged. §20. Question 13. If the contracting parties do neither of them understand the other, is it a covenant: or if it be, whose sense must carry it? Answer: If they understand not each other in the essentials of the contract, it is no contract, in point of conscience: except where the laws, for the public safety, do annex the obligation to the bare external act. But if they understand not one another in some circumstances, and be equally culpable or innocent, they must come to a new agreement in those particulars: But if one party only be guilty of the misunderstanding, he must bear the loss if the other insist on it. … §22. Question 15. If I say I will give such or such a one this or that, am I bound thereby to do it? Answer: It is one thing to express your present mind and resolution without giving away the liberty of changing it: And it’s another thing to intend the obliging of yourself to do the thing mentioned, and that obligation is either intended to man or to God only; and that is either in point of rendition and use, or in point of veracity, or the performance of that moral duty of speaking truth. If you meant no more in saying, ‘I will do it,’ or ‘I will give it,’ but that this is your present will and purpose and resolution, yea, though it add the confident persuasion that your will shall not change, yet this no further obliges you than you are obliged to continue in that will: And a man’s confident resolutions may lawfully be changed upon sufficient cause. But if you intended to alienate the title to another, or to give him present right, or to oblige yourself for the future to him by that promise; or to oblige yourself to God to do it by way of peremptory assertion, as one that will be guilty of a lie if you perform it not; or if you dedicate the thing to God by those words as a vow, then you are obliged to do accordingly (supposing nothing else to prohibit it).</p></blockquote>

<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into by all the members of the visible Church of one nation or kingdom: when the Church in that kingdom or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not accrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn Covenant in the presence of God. 4. …it is lawful also expressely, publicly and solemnly to vow to God those things which are in the precepts of God enjoined to all believers: But that necessity of making this public, solemn and express covenant, in the presence of the whole Church, requiring it as a thing of absolute necessity to the essential constitution of a particular church, we do not acknowledge: But that union above mentioned, we conceive sufficient by the Word of God for the joining men professing the faith into one particular church. So that, by the Word of God, to the essence and entireness of a particular Church, this union is sufficient.</p></blockquote>

</figure><figure class="quote" id="q-c84b442fe1" data-kw="">
<blockquote><p>3. No man can enjoin anything upon the consciences of men (as absolutely necessary to enjoying the sacraments of divine grace and the benefits of the ministry of the Church) which God has not enjoined, without damnable will-worship. But God has not enjoined such a covenant on the consciences of men as absolutely necessary…</p></blockquote>

</figure><figure class="quote" id="q-6e6e9458d0" data-kw="">
<blockquote><p>If the terms of our utmost ‘endeavors’ and ‘all the days of our lives’ are to be understood literally [in the SL&amp;C], and that we must not survive any violation of the Covenant… The terms of ‘forever’ [which the SL&amp;C does not use] or ‘for all the days of our lives’ are not in our contracts to be understood naturally, but morally. For we find it plainly in the [Mosaic] Judicial Law that after a Jew had taken a servant and bored a hole through his ear he was (as the text [Ex. 21:6] says) to serve him ‘forever,’ although one of them might possibly have died the next day, and both of them after a while might have been made captives to others. The law calls the league of marriage individua vitae consuetudo, a cohabitation for all the days of our lives, for so it should be ex voto contrahenti [out of the vow binding], in the sincere desires of the contractors. Yet we know one ordinarily dies before the other and that many conditions may happen to legitimate their divorce afterwards, though the contract was never so religiously made in the presence of almighty God at first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Anthony Ascham on the Expiring of the Solemn League &amp; Covenant</cite>, 1649’ (RBO)</span></figcaption>

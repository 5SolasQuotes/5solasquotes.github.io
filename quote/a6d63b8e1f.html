<main class="wrap"><figure class="quote" id="q-a6d63b8e1f" data-kw="" data-pol="">
<blockquote><p>It reproves and condemns the church of Rome, who from the Alpha of their religion to the Omega, are wholly idolatrous. They make images of God the Father,—painting him in their church windows as an old man,—and an image of Christ on the crucifix; and, because it is against the letter of this commandment, therefore they sacrilegiously blot out the second commandment out of their catechises, dividing the tenth commandment into two.</p></blockquote>
<figcaption>— <a href="../authors/thomas-watson.html">Thomas Watson</a>, <cite>The Ten Commandments</cite>, Second Commandment, p. 96</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-images.html">Rome: Images &amp; Idolatry</a><a class="tag" href="../topics/worship/idolatry.html">Idolatry</a></div>

</figure><figure class="quote" id="q-fecc17f84e" data-kw="Mary Mediator Invocation of saints Idolatry" data-pol="">
<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>
<figcaption>— <a href="../authors/albert-barnes.html">Albert Barnes</a>, <cite>Notes on the Bible</cite>, 1 Timothy 2:5</figcaption>

</figure><figure class="quote" id="q-1adee36587" data-kw="" data-pol="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>
<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, p. 197</figcaption>

</figure><figure class="quote" id="q-75c3465029" data-kw="" data-pol="">
<blockquote><p>That Council, because it supports idolatry, the Papists deem holy and lawful. Hence, according to their axiom, it cannot have erred in the exposition of Scripture. But if such interpreters of sacred things are to be listened to, (it is abominable to say they are,) the religion of the Egyptians will be preferable to the Christian.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to Session IV</figcaption>

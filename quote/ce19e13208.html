<main class="wrap"><figure class="quote" id="q-ce19e13208" data-kw="">
<blockquote><p>Episcopal government, managed in conjunction with presbyters, presbyteries, and synods, is not contrary to the rule of Scripture, or the example of the primitive Church, but most agreeable to both. Yea, it is not contrary to that new [Solemn League and] Covenant [1643]… it is certainly most pertinent… to declare the consistence of the present [Church] government even with that obligation… As for our present model in Scotland, and the way of managing it, whatsoever is amiss (and it can be no wrong to make that supposition concerning any church on earth), the brethren that are dissatisfied had possibly better acquitted their duty by free admonitions and significations of their own sense in all things than by leaving their stations, which is the only thing that has made the breach… But there is much charity due to those following their own consciences; and they owe, and I hope they pay, the same back again to those that do the same in another way… That this difference should arise to a great height may seem somewhat strange to any man that calmly considers that there is in this Church no change at all, neither in the doctrine nor worship; no, nor in the substance of the discipline itself. But when it falls on matter easily inflammable, a little sparkle, how great a fire will it kindle!… After the same author saith, As we have Prelacy to be aware of, so we have the contrary extreme to avoid; and the Church’s peace, if it may be so procured; and as we must not take down the ministry lest it prepare men for Episcopacy, so neither must we be against any profitable use and exercise of the ministry, or desirable order amongst them, for fear of introducing Prelacy, etc… And unless they can make it appear that the Episcopacy now in question with us in Scotland, is either contrary to the word of God, or to that mitigated sense of their own oath, it would seem more suitable to Christian charity and moderation, rather to yield to it, as tolerable at least, than to continue so inflexibly to their first mistakes, and excessive zeal for love of it, as to divide from the Church, and break the bond of peace.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7837e003eb" data-kw="">
<blockquote><p>Here he argued that when schism threatened the unity of a church a presbytery could appoint a temporary bishop, similar to the post-reformation superintendents. This type of bishop would be subject to the jurisdiction of a provincial or national synod, acting in a capacity akin to that of a constant moderator… For Baillie this temporary office was not ‘wicked in itself or contrair to the word of God;’ indeed, Baillie could not cite any ‘classic divine of the Reformed churches’ who maintained that such an episcopate was unlawful… Temporary bishops were only instituted by ecclesiastical canon, implying that scriptural and patristic sources did not explicitly condemn such practice.</p></blockquote>

</figure><figure class="quote" id="q-27fdd8bb2e" data-kw="">
<blockquote><p>Those who hold Church government to be of divine right may feel uneasy in calling it positive. Rutherford, who wrote The Book on the subject, The Divine Right of Church Government (1646), did not. One reason why Church government is positive is because it is a special arrangement that does not simply inhere in or derive from nature; rather, it has been appointed in special revelation by the will of Christ about redemption. It is also political, in the sense of binding men in society. Church government could be otherwise (if Christ had so appointed); however the specific form of it, namely classical presbyterianism, is the particular form that Christ has chosen and instituted as the Mediatorial King of the Church, his Kingdom. The form of the government binds not from the nature of it (though it is in accord with the light of nature), but from Christ’s authority alone. Church government was different in the Old Testament, and had changed, developed and progressed numerous times therein. To say that New Testament Church government is positive does not mean that there is not any continuity between it and the Church government of the Old Testament; there is. But there is also not a direct one-to-one correlation between the two either, which some persons find perplexing. On the one hand, as these positive laws of Church government are binding as they are positive (just as the Mosaic ceremonial laws were binding to the Old Testament Church as they were positive), so under the normal circumstances of the Church in the course of history, every last spiritually prescribed detail (however minute) of Biblical, classical presbyterianism is binding by the authority and honor of Christ, the Church’s Lord. However, on the other hand, it is also because the laws of Church government are positive, and as moral obligations (in necessity) override positive ones, that alterations in the regular government of the Church, grounded in natural principles, may, and should, legitimately occur in extraordinary and necessary circumstances (as the Bible and historic presbyterianism teach). Because human, Church government is positive, according to the needs and circumstances of the Church in this age, it will greatly change and fall away with the renovation of all things in the Age to Come, when no teachers will be needed, as we will be beholding God face to face, immediately (Jer. 31:33-34; 1 Cor. 15:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Introduction’ to On Positive Laws &amp; Ordinances, &amp; the Law of Nations</cite></span></figcaption>

</figure><figure class="quote" id="q-e119cee609" data-kw="">
<blockquote><p>Whatsoever kind of office-bearers the Jewish Church had, not as it was Jewish, but as it was a Church, such ought the Christian Church to have also. But the Jewish Church, not as it was Jewish, but as it was a Church, had elders of the people who assisted in their ecclesiastical government and were members of their ecclesiastical consistories. Therefore such ought the Christian Church to have also. The proposition will no man call in question, for ‘quod competit alicui qua tali competit omni tali.’ That which agrees to any Church as it is a Church, agrees to every Church. I speak of the Church as it is a political body and settled ecclesiastical republic.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Whatsoever kind of office-bearers the Jewish Church had, not as it was Jewish, but as it was a Church, such ought the Christian Church to have also. But the Jewish Church, not as it was Jewish, but as it was a Church, had elders of the people who assisted in their ecclesiastical government and were members of their ecclesiastical consistories. Therefore such ought the Christian Church to have also. The proposition will no man call in question, for ‘quod competit alicui qua tali competit omni tali.’ That which agrees to any Church as it is a Church, agrees to every Church. I speak of the Church as it is a political body and settled ecclesiastical republic.”

— George Gillespie, bk. 1 ToC of Aaron’s Rod Blossoming, or the Divine Ordinance of Church Government Vindicated… (Edinburgh: Ogle, Oliver &amp; Boyd, 1844), | 3. That the Jews had an ecclesiastical sanhedrim and government distinct from the civil 4, p. 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhatsoever+kind+of+office-bearers+the+Jewish+Church+had%2C+not+as+it+was+Jewish%2C+but+as+it+was+a+Church%2C+such+ought+the+Christian+Church+to+have+also.+But+the+Jewish+Church%2C+not+as+it+was+Jewish%2C+but+as+it+was+a+Church%2C+had+elders+of+the+people+who+assisted+in+their+ecclesiastical+government+and+were+members+of+their+ecclesiastical+consistories.+Therefore+such+ought+the+Christian+Church+to+have+also.+The+proposition+will+no+man+call+in+question%2C+for+%E2%80%98quod+competit+alicui+qua+tali+competit+omni+tali.%E2%80%99+That+which+agrees+to+any+Church+as+it+is+a+Church%2C+agrees+to+every+Church.+I+speak+of+the+Church+as+it+is+a+political+body+and+settled+ecclesiastical+republic.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+bk.+1+ToC+of+Aaron%E2%80%99s+Rod+Blossoming%2C+or+the+Divine+Ordinance+of+Church+Government+Vindicated%E2%80%A6+%28Edinburgh%3A+Ogle%2C+Oliver+%26+Boyd%2C+1844%29%2C+%7C+3.+That+the+Jews+had+an+ecclesiastical+sanhedrim+and+government+distinct+from+the+civil+4%2C+p.+13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe119cee609.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e119cee609.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/church-government/#:~:text=Whatsoever%20kind%20of%20office%2Dbearers%20the%20Jewish,political%20body%20and%20settled%20ecclesiastical%20republic&amp;text=Whatsoever%20kind%20of%20office%2Dbearers%20the%20Jewish%20Church%20had&amp;text=is%20a%20political%20body%20and%20settled%20ecclesiastical%20republic" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And as touching things of prudence, they are things properly mixed [partly moral and partly positive], as at what hour sermon shall begin in such a church, at eight, or nine or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; for to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12. Not to imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>

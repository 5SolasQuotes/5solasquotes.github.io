<main class="wrap"><figure class="quote" id="q-95071b0da1" data-kw="">
<blockquote><p>How did Christ condemn and pass sentence on the wicked world in his death? 1. He did it legally, in that his offering of a sufficient ransom for sin, there is a seal put on the condemnation of all impenitent men, that they shall ‘not see life but the wrath of God’ (that they were by nature under, being the captives of the Law) ‘abides on them,’ Jn. 3:36. ‘Because they believe not in the Son of God,’ Jn. 16:9. Christ’s dying day was the unbelievers’ doomsday.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-52c14a01f6" data-kw="">
<blockquote><p>Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

0is%20affirmed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. That Christ Jesus died sufficiently for all men (his death being of sufficient merit to redeem and save them), but primarily and effectually for the elect alone, for whom alone He has actually and effectually obtained remission of sins, and life eternal.</p></blockquote>

</figure><figure class="quote" id="q-f819638ef1" data-kw="">
<blockquote><p>I. God as the supreme Lord has true right over the actions of all men, both internal and external, that they may serve his glory and obedience be rendered to him in all things (Luke 17:10), which obedience moreover he as ruler has commanded and sanctioned under the gravest threats (Gen 2:17, Deut 27:26). When man violates this right and denies this obedience to God, he commits two things: 1) he does not acknowledge the lordship of his master over himself, 2) he despises him, even by disdaining his laws before his sight, who pays heed to all the ways of men. Hence this wickedness is so great that none greater can be given; by it man turns away from the infinite good, and consequently merits for himself the privation of the highest good; whence he has been handed over by his Lord, whose obedience he refused, into servitude to the Devil and his servants, that he may be tormented by them in [God’s] name and experience the gravity of the lordship he despised (Jude 5-6). … III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied…. … VI. But Christ, offering himself to God (our Lord whose captives we were, by Thesis 1) as a sacrifice and victim (of the same character as the Old Testament victims) as a fragrant aroma (Eph 5:2, Heb 8:3, 9:14; cf. Gen 8:21, Lev 1), separated us from servitude to the Devil, etc. Therefore [he redeemed us]. Socinus (Praelections, ch. 9) and Volkelius (ibid.) declaim here in a rather diluted rhetorical way, hence the price had to be paid to the Devil – as if the λύτρον [ransom] were owed to the punishment or its executioner, and not to the one in whose name it is commanded and inflicted! When someone is freed from the gallows by the intervention of a payment, is it brought to the gallows or the executioner? or rather to the one who holds the right of majesty? We see here that it is not impossible to demonstrate to whom this price was paid, as Volkelius thinks (lib. 3, cap. 18). For the passages alleged teach that Christ offered himself to God as a victim for us. Christ, therefore, is such a redeemer who freed us by the intervention of a price (Acts 20:28, 1 Pet 1:18-19), which price indeed agrees in the formality of price with what is used in exchanges, like gold, silver, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’ tr. Onku with AI (Utrecht, 1650) Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-c95490c981" data-kw="">
<blockquote><p>Unto whom is the death and passion of Christ profitable? Although He might have been a sufficient price for the sins for all men, yet actually and effectually he died for his elect only, who receive Him and believe Him, Matt 1:21. “He will deliver his people from their sins.” John 10:15. “I lay down my life for my sheep.” and Chap. 17:19 “I sanctify myself,” for otherwise it would follow that Christ died [without] profit, and to no purpose in regard of many, and that the efficacy of Christ’s death could be made void by men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion (London, 1606)</cite>, p. 235</span></figcaption>

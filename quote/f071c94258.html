<blockquote><p>Among all other pernicious doctrine contrary unto the truth, there is one most pestilent and dangerous which denieth Jesus of Nazareth our saviour to have received his humanity and manhood of the blessed &amp; holy virgin Mary and supposeth either he brought his humanity with him from heaven, or else took it of some other, then of her.</p></blockquote>

</figure><figure class="quote" id="q-db97f4427b" data-kw="">
<blockquote><p>VII. We believe also that Mary continued a virgin after her childbirth: For her marriage with Joseph did not consist in the generation of children, but in her education and holy conjunction of life with him.

VIII. Although Christ had no other brothers born after Him, yet He is rightly called Mary’s first begotten Son. In Scripture Christ is called the ‘firstborn’ four manner of ways… 4. In respect of his nativity of the Virgin, Lk. 2:7. Now He is not only called firstborn, whom other brothers do follow; but he also who is born before others, although he be indeed the only begotten, or he whom other brothers do not follow; whence such a one, even before he had any brothers, was consecrated to God, as if he had been the firstborn, Num. 18:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, … (d. 1629; London, 1660), pp. 128-9</span></figcaption>

</figure><figure class="quote" id="q-81ce495dfe" data-kw="">
<blockquote><p>Though Christ in regard of his divine nature, and by virtue of his eternal generation be the only begotten Son of his Father; and in regard of his humane nature, by reason of the perpetual virginity of his mother, her only begotten Son; yet may He well be said to have brethren, and that in two especial respects:

1. Because the Son of God and Son of men are of one, even of one and the same nature: Therefore He is not ashamed to call them brethren, Heb. 2:11.

2. Because He has adopted them to be Sons of his Father; For we children of men are said to have the adoption of children by Jesus Christ, Eph. 1:5. In this respect Christ stiles his disciples whom He had adopted, ‘brethren’, Mt. 28:10. For He Himself renders this reason of calling them brethren, ‘My Father is their Father’, Jn. 20:17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary on the Whole Epistle to the Hebrews</cite>, … (London, 1655), §. 67. ‘Of Christ the first-begotten’, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), Appendix, Question 1, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-78047d539a" data-kw="">
<blockquote><p>It shall be bound in heaven, and loosed in heaven: not that Christ has hereby obliged himself to confirm all church-censures, right or wrong; but such as are duly passed according to the Word, clave non errante [the key not erring]–the key turning the right way, such are sealed in heaven; that is, the word of the gospel, in the mouth of faithful ministers, is to be looked upon, not as the word of man, but as the word of God, and to be received accordingly, 1 Thess. 2:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 16, verse 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“It shall be bound in heaven, and loosed in heaven: not that Christ has hereby obliged himself to confirm all church-censures, right or wrong; but such as are duly passed according to the Word, clave non errante [the key not erring]–the key turning the right way, such are sealed in heaven; that is, the word of the gospel, in the mouth of faithful ministers, is to be looked upon, not as the word of man, but as the word of God, and to be received accordingly, 1 Thess. 2:13.”

— Matthew Henry, Commentary on Matthew 16, verse 19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+shall+be+bound+in+heaven%2C+and+loosed+in+heaven%3A+not+that+Christ+has+hereby+obliged+himself+to+confirm+all+church-censures%2C+right+or+wrong%3B+but+such+as+are+duly+passed+according+to+the+Word%2C+clave+non+errante+%5Bthe+key+not+erring%5D%E2%80%93the+key+turning+the+right+way%2C+such+are+sealed+in+heaven%3B+that+is%2C+the+word+of+the+gospel%2C+in+the+mouth+of+faithful+ministers%2C+is+to+be+looked+upon%2C+not+as+the+word+of+man%2C+but+as+the+word+of+God%2C+and+to+be+received+accordingly%2C+1+Thess.+2%3A13.%E2%80%9D%0A%0A%E2%80%94+Matthew+Henry%2C+Commentary+on+Matthew+16%2C+verse+19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78047d539a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78047d539a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-guilt-innocence-in-breaking-church-ordinances-on-contumacy/#:~:text=It%20shall%20be%20bound%20in%20heaven,be%20received%20accordingly%2C%201%20Thess.%202%3A13&amp;text=It%20shall%20be%20bound%20in%20heaven%2C%20and%20loosed&amp;text=and%20to%20be%20received%20accordingly%2C%201%20Thess.%202%3A13" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-39255d67dc" data-kw="">
<blockquote><p>However, we think that no proper lawmaking (nomothetiken) power was given to the church by which she can make laws directly and by themselves binding the conscience; but only an ordaining power (diataktiken), which can form constitutions and canons for the preservation of peace and good order (eutaxias), which on this account do not bind the conscience by themselves and directly, but only indirectly in case of scandal; that these are… only an order by ministers; not of the essentials of Christ’s kingdom, but only of the external accidents and things indifferent; nor are they good per se, but only on account of circumstances and their relation (schesin) to the end. … IV. (2) …[Moral] Laws bind the conscience per se and directly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly and mediately in case of scandal and contempt. Hence the guilt arising from their violation is not properly on account of the violation of the constitution, but on account of the neglect of the authority which God ordained, and on account of the scandal given. … XX. Again, in the transgression of them [church constitutions] there can be no sin except indirectly (i.e., not on account of the usurpation of the thing itself [as in homicide, fornication, etc., previously mentioned], but on account of another thing [if it is from contempt of lawful authority], for because obedience is commanded by God, there is sin in a neglect of it, if with a neglect of brotherly edification, or if from impiety and license. However, if all these are absent, there will be no sin in a transgression of them… nor is the authority of the one commanding to be so much regarded as the cause of the command.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, p. 285-6, 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

— Francis Turretin, p. 285-6, 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+we+think+that+no+proper+lawmaking+%28nomothetiken%29+power+was+given+to+the+church+by+which+she+can+make+laws+directly+and+by+themselves+binding+the+conscience%3B+but+only+an+ordaining+power+%28diataktiken%29%2C+which+can+form+constitutions+and+canons+for+the+preservation+of+peace+and+good+order+%28eutaxias%29%2C+which+on+this+account+do+not+bind+the+conscience+by+themselves+and+directly%2C+but+only+indirectly+in+case+of+scandal%3B+that+these+are%E2%80%A6+only+an+order+by+ministers%3B+not+of+the+essentials+of+Christ%E2%80%99s+kingdom%2C+but+only+of+the+external+accidents+and+things+indifferent%3B+nor+are+they+good+per+se%2C+but+only+on+account+of+circumstances+and+their+relation+%28schesin%29+to+the+end.+%E2%80%A6+IV.+%282%29+%E2%80%A6%5BMoral%5D+Laws+bind+the+conscience+per+se+and+directly%2C+and+a+violation+of+them+incurs+guilt%3B+but+constitutions+bind+the+conscience+only+indirectly%2C+and+a+violation+of+them+incurs+guilt%3B+but+constitutions+bind+the+conscience+only+indirectly+and+mediately+in+case+of+scandal+and+contempt.+Hence+the+guilt+arising+from+their+violation+is+not+properly+on+account+of+the+violation+of+the+constitution%2C+but+on+account+of+the+neglect+of+the+authority+which+God+ordained%2C+and+on+account+of+the+scandal+given.+%E2%80%A6+XX.+Again%2C+in+the+transgression+of+them+%5Bchurch+constitutions%5D+there+can+be+no+sin+except+indirectly+%28i.e.%2C+not+on+account+of+the+usurpation+of+the+thing+itself+%5Bas+in+homicide%2C+fornication%2C+etc.% </figure><figure class="quote" id="q-cf6b14572d" data-kw="">
<blockquote><p>…for neither magistrate nor people can be bound to follow the judgement of the Churches or ministry farther than they follow the rule of the Word; they follow their judgement conditionally, not absolutely and simply; and it is a great calumny of Mr. [Henry] Burton and our [Independent] Brethren, that we lay bands on the consciences of prince and people to follow the acts and determinations of the Church, be they true or false: and that there is no place left to appeal to the next, or a better informed synod, and to the consciences of the collective Church of the godly judicious professors, and to protest and deny obedience to erring assemblies.</p></blockquote>

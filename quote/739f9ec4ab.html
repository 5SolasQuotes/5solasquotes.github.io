<blockquote><p>18th Objection [by Osiander]: Christ has brought us eternal justice. This applied justice is not eternal: Therefore this is not our justice, but God Himself is our justice. Answer: The Lord is our justice, that is, our Justifier. But that our applied justice is eternal, has been showed before; because the imputation thereof is continued to all eternity. That justice also of the Law which is begun in us in this life, shall be continued, and perfected in the life to come. But that justice which is God Himself is not in us: because so God should be an accident to his creature, and become justice in man. For justice and virtue are things created in us, not the essence of God. Moreover Osiander, who obiects this, does not discern the cause from the effect. As we live not, or are wise by the essence of God (for this is all one, as to say, that we are as wise as God) so also we are not just by the essence of God. Wherefore nothing is more impious than to say that the essential justice of the Creator is the justice of the creatures: for thereof it would follow, that we have the justice of God, yea the very essence of God. The cause must be discerned from the effect, increate iustice from created justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’, p. 691</span></figcaption>

<blockquote><p>Is a believer’s justification complete at once; are all his sins, past, present and to come, on his first believing, pardoned? Justification, as has already been shown, changes a person’s state; and a believer’s state being changed, all his legal condemnation is at that time taken from off his person: union with Christ exempts from the same. “There is therefore now no condemnation to them that are in Christ Jesus” Rom. 8:1. Here is the high privilege of those in Christ asserted, namely, exemption from God’s condemnation; and the Holy Ghost here tells us, “There is therefore now no condemnation,” not the least condemnation remains to them “in Christ,” but their sins are freely remitted, “for his name’s sake, and all that believe are justified from all things” Acts 13:39. Here is a most complete absolution from all sins, for all those that believe in the Lord Christ. Thus Col. 1:13, “Having forgiven you all trespasses.” God does not, in the justification of his people, forgive some sins only, and leave others standing on the score. “Who forgiveth all thine iniquities,” Ps. 103:3. And not only so, but Christ covers the believer with the robe of righteousness, Isa. 61:10. For no sooner does a man truly believe in Christ, but his righteousness is imputed to him, and in and by that righteousness, he stands righteous before God, as well at the first as at the last; that righteousness of Christ by which we are justified, whether first or last, being most perfect: therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men.—Downame on Justification, page 7. But God only forgives the sins that are past? Rom. 3:25. I answer, This looks to the sins of the saints, that were committed before Christ’s coming in the flesh, and holds forth God’s indulgence in pardoning of them, on the account of Christ’s engagement, though the price of their redemption was not actually laid down. To the same thing does the Holy Ghost speak, “And for this cause He is the Mediator of the new testament, that by means of death, for the redemption of the transgressions that were under the first testament,” Heb. 9:15. Here is that most excellent sacrifice, that looked as high as Adam, being the Lamb slain from the foundation of the world, from whence all the Old Testament saints had both full and free remission of all sin: and this I take to be the true meaning of this scripture. And though sin cannot properly be said to be actually forgiven, before it be committed, yet when the elect are, by the Holy Ghost, united to Christ, their persons are completely justified, and Christ having fulness of pardoning grace in his hands, their justification is continued and maintained by his intercession in heaven, 1 John 2:1. And thus the saints’ justification is, and continues to be, one constant and complete act of free grace, never to be reversed again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification by Faith, Opened &amp; Applied from Rom. 3:24-25</cite>, …’ in Works (London: Tegg, 1845), vol. 5, pp. 382-89</span></figcaption>

</figure><figure class="quote" id="q-3bba617e92" data-kw="">
<blockquote><p>It is said, Christ is our righteousness, because He satisfied the Father for us, and that satisfaction, when He justifies us, is given and communicated to us in such a way that it can be said to be our satisfaction and righteousness. For even if we are truly and rightly called and are righteous by inherent righteousness, yet we do not satisfy God for our sins and eternal punishment by it. But that inherent righteousness comes with the remission of sin and eternal punishment, the effect of Christ’s satisfaction, which is conferred and applied to us in justification. And in this way it would not be absurd if someone said that the merits of Christ are imputed to us, when they are given and applied to us, as if we ourselves satisfied God; provided that it is not denied that there is in us also an inherent righteousness, which is true and absolute righteousness, which is not liable to punishment but to glory.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is said, Christ is our righteousness, because He satisfied the Father for us, and that satisfaction, when He justifies us, is given and communicated to us in such a way that it can be said to be our satisfaction and righteousness. For even if we are truly and rightly called and are righteous by inherent righteousness, yet we do not satisfy God for our sins and eternal punishment by it. But that inherent righteousness comes with the remission of sin and eternal punishment, the effect of Christ’s satisfaction, which is conferred and applied to us in justification. And in this way it would not be absurd if someone said that the merits of Christ are imputed to us, when they are given and applied to us, as if we ourselves satisfied God; provided that it is not denied that there is in us also an inherent righteousness, which is true and absolute righteousness, which is not liable to punishment but to glory.”

is%20said%2C%20Christ%20is%20our,liable%20to%20punishment%20but%20to%20glory&amp;text=It%20is%20said%2C%20Christ%20is%20our%20righteousness%2C%20because&amp;text=is%20not%20liable%20to%20punishment%20but%20to%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0302ebf39b" data-kw="">
<blockquote><p>When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. When we say by faith only, this opposes all other graces of the same order, but not the merits of Christ or the efficacy of God’s grace; the apostle, Rom. 4, makes it all one to prove a man justified by grace, Christ and by faith. It is to be considered as alone in the act of justification, but not in the subject justified; therefore that is a reproach cast on Protestants to call them Solifidians.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c7be8869db" data-kw="">
<blockquote><p>When He creates a human soul and pours it into an organized body, it is not that it should be there as water in a vessel, or as a king in his palace: it lives not thereas an assisting form, or as an outward cause of the body’s operations, but it is united to it by a very strict union, and serves as an essential form; It is the principle of our life, the internal cause of motion of sense, and of understanding: So that if we will speak properly, man cannot be said to be altogether of a spiritual nature, as the holy angels, nor a single body, as the sun, and the stars; but, he is made up of both:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-drelincourt.html">Charles Drelincourt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Defense against the Fears of Death</cite>, … (London, 1675), ch. 23, pp. 443-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dbf669f70d" data-kw="">
<blockquote><p>In Voetius’s view it is valid to say that some unborn foetuses have ‘a human life’ and others have not. He refers to Exodus 21:22-23 as a passage suggesting that not all abortions of foetuses are the same. He shows a certain flexibility as to the estimated time when a foetus is animated [ensouled], but maintains that the soul can only ‘be brought into an organized body’… Zechariah 12:1, a text that speaks of ‘…the Lord, which… formeth the spirit of man within him’ (AV)… Voetius obviously thought that initially there is no soul for an embryo that has yet to be formed. He cites various opinions on the time when an embryo is animated… Voet thinks it is prudent not to move beyond the latter estimate [of the 30th to 40th day], and leaves further debate to physicians. The former estimate seems to have been motivated by references to both Aristotle and the Bible (Lev. 12[:2-6]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Orthodoxy &amp; Philosophy</cite>, pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006), pp. 239-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“In Voetius’s view it is valid to say that some unborn foetuses have ‘a human life’ and others have not. He refers to Exodus 21:22-23 as a passage suggesting that not all abortions of foetuses are the same. He shows a certain flexibility as to the estimated time when a foetus is animated [ensouled], but maintains that the soul can only ‘be brought into an organized body’… Zechariah 12:1, a text that speaks of ‘…the Lord, which… formeth the spirit of man within him’ (AV)… Voetius obviously thought that initially there is no soul for an embryo that has yet to be formed. He cites various opinions on the time when an embryo is animated… Voet thinks it is prudent not to move beyond the latter estimate [of the 30th to 40th day], and leaves further debate to physicians. The former estimate seems to have been motivated by references to both Aristotle and the Bible (Lev. 12[:2-6]).”

— Aza Goudriaan, pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006), pp. 239-41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+Voetius%E2%80%99s+view+it+is+valid+to+say+that+some+unborn+foetuses+have+%E2%80%98a+human+life%E2%80%99+and+others+have+not.+He+refers+to+Exodus+21%3A22-23+as+a+passage+suggesting+that+not+all+abortions+of+foetuses+are+the+same.+He+shows+a+certain+flexibility+as+to+the+estimated+time+when+a+foetus+is+animated+%5Bensouled%5D%2C+but+maintains+that+the+soul+can+only+%E2%80%98be+brought+into+an+organized+body%E2%80%99%E2%80%A6+Zechariah+12%3A1%2C+a+text+that+speaks+of+%E2%80%98%E2%80%A6the+Lord%2C+which%E2%80%A6+formeth+the+spirit+of+man+within+him%E2%80%99+%28AV%29%E2%80%A6+Voetius+obviously+thought+that+initially+there+is+no+soul+for+an+embryo+that+has+yet+to+be+formed.+He+cites+various+opinions+on+the+time+when+an+embryo+is+animated%E2%80%A6+Voet+thinks+it+is+prudent+not+to+move+beyond+the+latter+estimate+%5Bof+the+30th+to+40th+day%5D%2C+and+leaves+further+debate+to+physicians.+The+former+estimate+seems+to+have+been+motivated+by+references+to+both+Aristotle+and+the+Bible+%28Lev.+12%5B%3A2-6%5D%29.%E2%80%9D%0A%0A%E2%80%94+Aza+Goudriaan%2C+pp.+239-42%2C+247-48+%26+257+of+ch.+4%2C+%E2%80%98The+Human+Being%3A+His+Soul+%26+Body%E2%80%A6%E2%80%99+in+Reformed+Orthodoxy+%26+Philosophy%2C+1625-1750%3A+Gisbertus+Voetius%2C+Petrus+van+Mastricht%2C+%26+Anthonius+Driessen+%28Brill%2C+2006%29%2C+pp.+239-41&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdbf669f70d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dbf669f70d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=In%20Voetius%E2%80%99s%20view%20it%20is%20valid,Aristotle%20and%20the%20Bible%20%28Lev.%2012%5B%3A2%2D6&amp;text=In%20Voetius%E2%80%99s%20view%20it%20is%20valid%20to%20say&amp;text=to%20both%20Aristotle%20and%20the%20Bible%20%28Lev.%2012%5B%3A2%2D6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b5413bcc5f" data-kw="">
<blockquote><p>Questions about babies who have died in their mother’s womb, about miscarried fetuses, the malformed and similarly abnormal babies can be duly resolved once the hypothesis is laid concerning the infusion of the soul (anima). For either the bodies truly were animate with a human soul, or they were not animate. If the former, then the resurrection applies to them, too, If not, then conequently excluded from the resurrection are such bodies to which the definition of human being does not apply.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, … ed. Harm Goris (Brill, 2020), vol. 3, Disputation 51, sect. 36, p. 557</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-7b3ddb0eda" data-kw="">
<blockquote><p>We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…”

— Pierre Du Moulin, An Untying of Grave Questions (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+therefore%2C+maintain+that+the+rational+soul+is+infused+by+God+into+the+embryo%2C+not+indeed+%CE%B8%CF%8D%CF%81%CE%B1%CE%B8%CE%B5%CE%BD+%E1%BC%90%CF%80%CE%B5%CE%B9%CF%83%CE%B9%CE%AD%CE%BD%CE%B1%CE%B9+%28entering+from+without%29%2C+as+Aristotle+wishes+in+book+2+of+On+the+Generation+of+Animals%2C+chapter+3%2C+but+is+formed+by+God+in+the+fetus+itself+and+the+rudiment+of+the+human+body.+Scripture+teaches+this.+For+in+Isa.+57%3A16+God+speaks+thus%3A+%E2%80%9CThe+spirit+from+my+face+shall+clothe+man%2C+and+I+make+the+souls.%E2%80%9D+And+in+Zech.+12%3A1%3A+%E2%80%9CThus+says+the+Lord%2C+who+stretches+out+the+heavens%2C+and+lays+the+foundation+of+the+earth%2C+and+forms+the+spirit+within+him.%E2%80%9D%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+An+Untying+of+Grave+Questions+%28Leiden%3A+Elzevirana%2C+1632%29%2C+Treatise+5%2C+on+Original+Sin%2C+ch.+1%2C+%E2%80%98Whether+there+is+original+sin%2C+in+whom+it+exists%2C+and+whether+it+is+removed+by+Baptism.+Only+Christ+is+excepted+from+this+stain.+Not+even+the+Virgin+Mary+was+immune+from+it%E2%80%99+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b3ddb0eda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7b3ddb0eda.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=We%2C%20therefore%2C%20maintain%20that%20the%20rational,and%20forms%20the%20spirit%20within%20him&amp;text=We%2C%20therefore%2C%20maintain%20that%20the%20rational%20soul%20is&amp;text=the%20earth%2C%20and%20forms%20the%20spirit%20within%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-91b1e10eb8" data-kw="">
<blockquote><p>‘and in sin has my mother conceived me’ …he having original sin from his parents, was in that sin ‘conceived’, that is, fostered and nourished in his mother’s womb, and brought forth in the same, for so largely do I take the word of ‘conceiving’, the beginning of a thing being put for the growth, proceeding and continuance of the same thing.</p></blockquote>

<blockquote><p>XXVI. If it is necessary for the reparation to be co-extensive with the corruption, and the latter has invaded all the faculties of the soul, the former must also be constituted in all its parts. And since supernatural life has been extinguished in the whole man, and not in the will or the mind separately, the whole man must also become a partaker of spiritual life, so that he may be truly called regenerated. XXVII. Therefore, the darkened mind is illuminated (Eph. 1:18), the will, prone only to evil, is bent toward the good, the disordered affections, alienated from the rule of reason, begin again to listen to it and to be more subject to the will (Rom. 6:12), and finally, the whole man comes into some part of this new and divine change. XXVIII. Those who state that here only the mind is illuminated and the affections corrected, but that the will is not healed, but only freed from impediments and rendered more ready to exercise the faculty inherent in it, must see on what foundation of Scripture they do this. We, on the contrary, feel that the will is as much the subject of this reparation as the mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e54df171fc" data-kw="">
<blockquote><p>Repentance goes before justification, even as faith and hope; for of the Baptist it is said, that he preached the baptism of repentance for the remission of sins, Mk. 1:4; Lk. 3:3. But regeneration follows justification; for, being justified, we receive the Spirit of sanctification, whereby we are renewed, and, as it were, find a new creature begun even in this life. Repentance is the cause, regeneration is the effect; for therefore God does renew us in Christ, and make us new men, because we repent us of our old life, and begin to be wise after sin committed. Notwithstanding in the middle place, betwixt repentance and regeneration, comes in justification, when as God does of his mere mercy account and repute us as just. The name of repentance implies sorrow, but the name of regeneration gladness. To conclude, the points of repentance, as whence it proceeds and whereunto it tends, they are deeds, the evil or sin committed, and the good which ought to be practised; but the bounds of regeneration are qualities — inherent corruption, and sanctity or holiness, which is wrought in us; the old man and new man renewed in Christ. …For every change of the mind is not to be deemed forthwith regeneration, but there are certain changes of man’s mind which go before regeneration, and which prepare the mind, and so the whole man, unto regeneration, and to that new creation; in which kind repentance is a special grace. These things are to be distinguished not in time but in nature; for at that very same instant, we believe, and be effectually called, and do repent, and be justified, and be regenerate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 34, ‘Of Repentance’, p. 245</span></figcaption>

</figure><figure class="quote" id="q-a4015899bf" data-kw="">
<blockquote><p>61. And because regeneration in this life is imperfect, it cannot perfectly and completely fulfill God’s Law (Rom. 7). So much for the powers of human choice in this life; what remains concerns its powers after this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Choice of Man’, pt. 2</cite>, (Basel: Waldkirchius, 1597) trans. at Obedientia Mortis Christi Latin</span></figcaption>

</figure><figure class="quote" id="q-d6bb455246" data-kw="">
<blockquote><p>In these commands God speaks to his Church, to his people who had long been his delight; therefore they must have been already regenerate; since, without regeneration no one can see or enter into the kingdom of God. Therefore by these commands God does not mean to bring about regeneration as it denotes the first infusion of the spiritual life, but the drawing forth of that life which is infused by regeneration into the second acts or consequent exercises (which is expressly mentioned in the passage, from whence the first of these commands is quoted) which is done in conversion, that follows upon regeneration, in which man, being drawn, runs after God; being turned, he actively converts and turns himself to God by the power of his grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Regeneration</cite>, … (New Haven, 1770), | section 25, pp. 36-37</span></figcaption>

</figure><figure class="quote" id="q-5c962461c3" data-kw="">
<blockquote><p>Whereas this must be observed carefully and forever maintained as the everlasting Truth of God, that the Lord gives a power-spiritual to the work which it had not before He concurs with the act of that power when it is put forth; He gives him a being in the 〈◊〉[state?] of grace, before He leads out the act of that being. He first lets in an influence of a powerful impression upon the faculty of the will, before He concurs with the act 〈◊〉deed. He gives a heart of flesh, and then causes them to walk in his ways: As if one could put a principle of life and motion into another, and then draw forth the act of that power to the performance of the work…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Application of Redemption by the Effectual Work of the Word &amp; Spirit of Christ for the bringing home of lost sinners to God</cite>, (d. 1647; London: Cole, 1656), bk. 10, pp. 411-12</span></figcaption>

<main class="wrap"><figure class="quote" id="q-47b3f7d122" data-kw="">
<blockquote><p>They that would enter heaven, but not by the way of obedience, must resolve to get in over the walls, but come not in by the door; that is, they shall never see it; ‘for without holiness no man shall see the Lord.’ We must follow the footsteps of our blessed Lord and the flock, who all entered heaven this way; though in different respects, he by, and they in, obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 4, Sermons on the Most Important &amp; Interesting Subjects…, Sermon 29, ‘Believers Laboring for their Reward’, on Heb. 4:11</cite>, p. 281</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-1c3699ab9a" data-kw="">
<blockquote><p>5. Good works are no less necessary as they are our walking in the way which leads to heaven. Jesus Christ is the way (John 14:6). Faith and holiness are our walking in Him as the way. This way, accordingly, is called “the way of holiness,” or “the holy way” (Isaiah 35:8), inasmuch as none can walk in Christ other than by faith, and by that holiness of heart and life which is “the obedience of faith.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

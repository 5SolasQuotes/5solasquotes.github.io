<main class="wrap"><figure class="quote" id="q-f72e0777f9" data-kw="">
<blockquote><p>For as a Relation unto a particular visible Church walking according to the Order and Rule of the Gospel, is the Duty of every Believer to give himself up unto; as that which is a means appointed and sanctified to the furtherance of his Edification and Salvation; so where it cannot be obtained through invincible outward Impediments, or is omitted through ignorance of Duty, or is on just Causes refused where opportunities make a tender of it; or where the being and benefit of it is lost through the Apostasie of those Churches whereunto any persons did belong, the utter want of it, and that alwayes, is not such as necessarily infers the eternal loss of their Souls who suffer under it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious</cite>, … (London, 1672), ch. 3, pp. 83-84</span></figcaption>

</figure><figure class="quote" id="q-4b3469d8b8" data-kw="">
<blockquote><p>Ch. 8, Of their Dismissing of Members from one church to another, or otherwise. 1. No person once thus admitted (as aforesaid) into any of their churches ought to remove thence without the consent of the said church first sought and obtained. For if he do, they hold that he breaks covenant with God and the Church and like Ananias and Sapphira lies against the Holy Ghost. Answer to 9th Position, p. 73; Apology of the Churches in New England for Church Covenant, p. 39; R.M. to E.B., p. 6. Inasmuch as they conceive their covenant binds them not to depart without consent. Ibid. 2. Therefore when any would remove, they require that he first give notice thereof to their church wherewith he is in covenant and lay before them (how many soever they be) in a public meeting both his reasons for which he desires to remove and also to what other church he would remove, and consult with them about both. Answer to 9th Position, p. 74; Apology, p. 20. 3. If upon examination they approve both of his reasons why and of the place whither he would go, then they consent, and giving him letters of dismission and recommendation to that other church, they send him away with their prayers and blessing. Ibid. 4. If contrarily they approve not, either the one or the other, they dissuade him from his purpose; if they prevail not, they will not hold him by violence (for that they cannot), yet they will neither give their consent, nor give him their letters of recommendation (though he were otherwise never so well deserving), nor send him away with their benediction as otherwise they would. Ibid. Yea, he shall depart little better than an excommunicate, as a covenant breaker with God and man, and as one that is wise in his own conceit and refuses to hearken to counsel. Ibid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers</cite>, … (London, 1644) Rathband was a Westminster divine., pp. 31-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

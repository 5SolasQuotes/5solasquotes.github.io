<main class="wrap"><figure class="quote" id="q-a772a24152" data-kw="">
<blockquote><p>3. Beside this law, commonly called moral, God was pleased to give to the people of Israel, as a church under age, ceremonial laws, containing several typical ordinances, partly of worship, prefiguring Christ, his graces, actions, sufferings, and benefits; and partly, holding forth divers instructions of moral duties. All which ceremonial laws are now abrogated, under the new testament. 4. To them also, as a body politic, he gave sundry judicial laws, which expired together with the State of that people; not obliging any other now, further than the general equity thereof may require. 5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-confession.html">Westminster Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 20.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c08f47fb7" data-kw="">
<blockquote><p>4. The old covenant is abrogated as to the yoke of Mosaical policy. — We have nothing to do with the judicial laws of the Jews, any farther than they are moral, or of a moral equity: “The law and the prophets were until John.” (Lk. 16:16) “The priesthood being changed, there is made of necessity a change also of the law.” (Heb. 7:12)</p></blockquote>

</figure><figure class="quote" id="q-bf33b0c2d9" data-kw="">
<blockquote><p>II. Law is an ordinance of reason, instituted by him who has the care of a community, concerning good things, for the common and particular advantage of some society; teaching what is to be done and what is not, and likewise commanding or forbidding the same, and obligating the rational creature to perform those things by the threatening of punishment and the promise of reward. … XIX. From this distinction of the Mosaic law, judgment is easily made concerning the difference and agreement of these three parts [the moral, ceremonial and judicial laws], both in substance and as to their accidental abrogation. They agree: 1. in author, both principal and ministerial. 2. in general end, namely, the common good.</p></blockquote>

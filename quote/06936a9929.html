<blockquote><p>[S]ince it has to be diligently guarded against that no occasion be given to men for doing their own will on the Sabbaths of the Lord, it must be a matter of special concern for those who wish the Kingdom of Christ to be restored among them that Sunday religious observance be renewed and established.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3bbb2e9cba" data-kw="">
<blockquote><p>But that this may be the clearer, I conceive that there is a twofold, immediate honoring of God in the worship of God:

1. An honoring of God less immediate, as hearing of the Word, is an immediate honoring of God, because honor flows immediately from God, both ex conditione operis, and ex conditione operantis; ‘from the nature of the work’, and ‘[from the] intention of the worker’: yet it is a less immediate honoring of God, in regard that I may also hear the Word even from the condition of the work, and so from the intrinsic end of the worker that I may learn to know God and believe; for thus far I am led to honor God immediately in hearing the Word, that action of its own nature conveying honor to God; there intervenes also a medium amidst between me and honoring of God, to wit, the preacher or the Bible (to which no external adoration is due): [2.] There is another more immediate worship, to wit, praising of God, from which, by an immediate result, God is honored, and in worship especially, strictly, immediate, God is immediately honored both in the intention of the work and the intrinsic end of it, and the intention of the worker; though no other thing be done, and others be not edified either in knowledge, increase of faith or any other ways: And in this, duties of the Second Table, of mercy and justice, differ from worship in that such acts of love and mercy, as to give alms to save the life of my brother or of his beast, are not acts of worshipping God; their intrinsic end, and the nature of the work being to do good to the creature, principally, ex natura et conditione operis, though God also thereby be honored, yet in a more secondary consideration: For I praying to God, do immediately, from the nature of the action, honor God, though no good should either redound to myself or to the creature; thereby it is true, God, by acts of love and mercy to our neighbor, is honored two ways:

1. In that men seeing our good works do thence take occasion to glorify our heavenly Father, whose truth teaches us by the grace of God to do these works, but the intrinsic and proper use of these is to do good to ourselves, as in works of sobriety, and to our neighbor, as in works of righteous dealing, but not immediately, and in the first and primary consideration to honor God, as in works of piety, holiness and worship, the honoring of God by secondary resultance, does issue also from these duties of righteousness, but not as from the acts of praying, praising, sacramental eating, drinking.

2. The doer of these acts of mercy may, and is to intend, the honoring of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), Intro, section 6, pp. 87-88</span></figcaption>

</figure><figure class="quote" id="q-e5babd4a51" data-kw="">
<blockquote><p>Now, lest this so strict observance of the Lord’s day, in spending the whole day in holy meditation, holy exercises, and works of mercy, excepting only necessary repasts, should be thought, as it is by some, to be merely Jewish, or only the private opinion of some zealots, more nice than wise; know, that as the fourth commandment is of moral obligation, there is the same reason for the strict observance of it, as any other divine precept, as against idolatry, murder, fornication, &amp;c.

And taking away of the morality of the fourth commandment, and unloosing the conscience from the immediate bonds of God’s command to observe a day for his solemn worship, overthrows true religion, and the power of godliness, and opens a wide gap to atheism, profaneness, and all licentiousness; as daily experience proves in those persons and places, by whom and where the Lord’s day is not holily and duly observed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, (1627; Philadelphia, 1800), p. 94.</span></figcaption>

</figure><figure class="quote" id="q-f75031eb4f" data-kw="">
<blockquote><p>Q. May the church appoint holy days, to remember Christ’s birth, death, temptation, ascension, &amp;c.?

A. No: as God hath abolished the Jewish holy-days of his own appointment, so he hath given no warrant to the church to appoint any; but hath commanded us to labour six days, except when Providence calls to humiliation or thanksgiving; and expressly forbids us to observe holy-days of men[’]s appointment, Col. ii. 16. Gal. iv. 10, 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An essay towards an easy, plain, practical, and extensive explication of the Assembly’s Shorter Catechism</cite>, (Carlisle, 1747), p. 228.</span></figcaption>

<blockquote><p>1. Some brethren of the Classical [presbytrian] way may possibly object [to joining an accommodated church-association such as Baxter’s], that joining with us in this way may seem to signify a dislike of the resolutions of the [Westminster?] Assembly, or a consent to the undoing of what they have done. Answer: There is no ground for this scruple: For we do not disclaim or condemn the judgment or way of any party, by taking up at present with what all are agreed in. A present forbearance of the use of full Classical government is no rejecting it. We did in this county seek for authority from the parliament many years ago for the establishing of the presbyterian government, and all our endeavors were frustrated. And many brethren that make this objection do preach themselves without the exercise of the presbyterian government. For because they live not in London, Lancashire, Shropshire, where that government was authorized by parliament, therefore they will not use it: And so some of them for many years have forborne all administration of the Lord’s Supper, and others administer it without any exercise of discipline: And may not we as lawfully exercise so much as all are agreed in, as they may forbear all? Objection: But why may not you as well set up the Classical government punctually, as do what you do? Answer: We are not all of one mind; and those of us that are for the Classical government do not think those parts of it which we here omit and forbear to be of so great necessity or moment as for the present use of it to disjoin and divide from all our brethren of a different judgment. We take ourselves bound to do much for the unity and peace of the churches: Besides, being many of us at a loss in several controverted points of discipline, we think the amicable union and association of brethren where all things may be frequently and plainly debated will be the likeliest way to satisfy and rectify us in those controverted points. In the meantime, you may join with us in going so far as we can go unanimously, without disclaiming, yea or forbearing your own way. For I think the constant exercise of the presbyterian government may well consist with our Propositions and associations: part of it being indeed above, but not contrary to our Agreement, and therefore may be done by those that will overgo us, without dividing from us. … And whereas it may be objected that we do allow a single minister to name offenders and to charge it on the people’s consciences to avoid communion with them, which only a presbytery is authorized to do, I answer:

1. We desire each church may have a presbytery, and then we are agreed.

2. The brethren of the Classical Way do allow a single pastor to pronounce the sentence of excommunication itself, so be it he have the advice and consent of a presbytery. And to avoid all possibility of breach upon this ground, we have agreed to take the advice of the Association of ministers before we require the people to avoid communion with any. Only we resolve not to do this all on the same reasons and principles: One may think it of flat necessity in a regimental way: Another may think it of necessity in a way of union: Another may think it convenient to avoid miscarriages and rash censures in so weighty a case: Another may think it fit to be yielded to for peace with those brethren that judge it necessary, seeing it is unquestionably lawful to take advice in cases of such weight. And why must we needs agree in our reasons as long as we agree in our practice?

3. It is only a preaching power that we exercise, applying Christ’s doctrine to particular persons and cases: supposing the evidence of the fact and guilt to be beyond question, we do but apply the word to the person hereupon… Have not pastors a charge of particular souls, but only of people in general? Is not the Old Testament and New full of examples to warrant us in this? Take heed of crying down duty, under pretense of questioning authority. … I will say no more to any objections that may possibly be made by my brethren of the Classical Way, because I find by experience it is needless (if others be as those with us), for they are the forwardest men to our union and Association of any others (here). The Lord grant the like spirit of unity and condescension in other parts. … Brethren! Would you have unity and peace or no? If you would, must not you condescend as far as may be to others, as well as others to you? Let it be the property of the Pope to accept of no peace with any Church that will not wholly come up to his will and way. And you know that this is the great point which you must yield in or you cannot have union with the contrary minded… Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches. 5. In the mean time, I pray you observe, that you may join with us in this without contradicting or deserting your own principles… The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member. What confusion will follow the plucking up of Christ’s and the magistrate’s and the churches’ bounds?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. Some brethren of the Classical [presbytrian] way may possibly object [to joining an accommodated church-association such as Baxter’s], that joining with us in this way may seem to signify a dislike of the resolutions of the [Westminster?] Assembly, or a consent to the undoing of what they have done. Answer: There is no ground for this scruple: For we do not disclaim or condemn the judgment or way of any party, by taking up at present with what all are agreed in. A present forbearance of the use of full Classical government is no rejecting it. We did in this county seek for authority from the parliament many years ago for the establishing of the presbyterian government, and all our endeavors were frustrated. And many brethren that make this objection do preach themselves without the exercise of the presbyterian government. For because they live not in London, Lancashire, Shropshire, where that government was authorized by parliament, therefore they will not use it: And so some of them for many years have forborne all administration of the Lord’s Supper, and others administer it without any exercise of discipline: And may not we as lawfully exercise so much as all are agreed in, as they may forbear all? Objection: But why may not you as well set up the Classical government punctually, as do what you do? Answer: We are not all of one mind; and those of us that are for the Classical government do not think those parts of it which we here omit and forbear to be of so great necessity or moment as for the present use of it to disjoin and divide from all our brethren of a different judgment. We take ourselves bound to do much for the unity and peace of the churches: Besides, being many of us at a loss in several controverted points of discipline, we think the amicable union and association of brethren where all things may be frequently and plainly debated will be the likeliest way to satisfy and rectify us in those controverted points. In the meantime, you may join with us in going so far as we can go unanimously, without disclaiming, yea or forbearing your own way. For I think the constant exercise of the presbyterian government may well consist with our Propositions and associations: part of it being indeed above, but not contrary to our Agreement, and therefore may be done by those that will overgo us, without dividing from us. … And whereas it may be objected that we do allow a single minister to name offenders and to charge it on the people’s consciences to avoid communion with them, which only a presbytery is authorized to do, I answer:

1. We desire each church may have a presbytery, and then we are agreed.

2. The brethren of the Classical Way do allow a single pastor to pronounce the sentence of excommunication itself, so be it he have the advice and consent of a presbytery. And to avoid all possibility of breach upon this ground, we have agreed to take the advice of the Association of ministers before we require the people to avoid communion with any. Only we resolve not to do this all on the same reasons and principles: One may think it of flat necessity in a regimental way: Another may think it of necessity in a way of union: Another may think it convenient to avoid miscarriages and rash censures in so weighty a case: Another may think it fit to be yielded to for peace with those brethren that judge it necessary, seeing it is unquestionably lawful to take advice in cases of such weight. And why must we needs agree in our reasons as long as we agree in our practice?

3. It is only a preaching power that we exercise, applying Christ’s doctrine to particular persons and cases: supposing the evidence of the fact and guilt to be beyond question, we do but apply the word to the person hereupon… Have not pastors a charge of particular souls, but only of people in general? Is not the Old Testament and New full of examples to warrant us in this? Take heed of crying down duty, under pretense of questioning authority. … I will say no more to any objections that may possibly be made by my brethren of the Classical Way, because I find by experience it is needless (if others be as those with us), for they are the forwardest men to our union and Association of any others (here). The Lord grant the like spirit of unity and condescension in other parts. … Brethren! Would you have unity and peace or no? If you would, must not you condescend as far as may be to others, as well as others to you? Let it be the property of the Pope to accept of no peace with any Church that will not wholly come up to his will and way. And you know that this is the great point which you must yield in or you cannot have union with the contrary minded… Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches. 5. In the mean time, I pray you observe, that you may join with us in this without contradicting or deserting your own principles… The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member. What confusion will follow the plucking up of Christ’s and the magistrate’s and the churches’ bounds?”

— Richard Baxter, Christian Concord, (London: A.M., 1653), ‘Objections Answered’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Some+brethren+of+the+Classical+%5Bpresbytrian%5D+way+may+possibly+object+%5Bto+joining+an+accommodated+church-association+such+as+Baxter%E2%80%99s%5D%2C+that+joining+with+us+in+this+way+may+seem+to+signify+a+dislike+of+the+resolutions+of+the+%5BWestminster%3F%5D+Assembly%2C+or+a+consent+to+the+undoing+of+what+they+have+done.+Answer%3A+There+is+no+ground+for+this+scruple%3A+For+we+do+not+disclaim+or+condemn+the+judgment+or+way+of+any+party%2C+by+taking+up+at+present+with+what+all+are+agreed+in.+A+present+forbearance+of+the+use+of+full+Classical+government+is+no+rejecting+it.+We+did+in+this+county+seek+for+authority+from+the+parliament+many+years+ago+for+the+establishing+of+the+presbyterian+government%2C+and+all+our+endeavors+were+frustrated.+And+many+brethren+that+make+this+objection+do+preach+themselves+without+the+exercise+of+the+presbyterian+government.+For+because+they+live+not+in+London%2C+Lancashire%2C+Shropshire%2C+where+that+government+was+authorized+by+parliament%2C+therefore+they+will+not+use+it%3A+And+so+some+of+them+for+many+years+have+forborne+all+administration+of+the+Lord%E2%80%99s+Supper%2C+and+others+administer+it+without+any+exercise+of+discipline%3A+And+may+not+we+as+lawfully+exercise+so+much+as+all+are+agreed+in%2C+as+they+may+forbear+all%3F+Objection%3A+But+why+may+not+you+as+well+set+up+the+Classical+government+punctually%2C+as+do+what+you+do%3F+Answer%3A+We+are+not+all+of+one+mind%3B+and+those+of+us+that+are+for+the+Classical+government+do+not+think+those+parts+of+it+which+we+here+omit+and+forbear+to+be+of+so+great+necessity+or+moment+as+for+the+present+use+of+it+to+disjoin+and+divide+from+all+our+brethren+of+a+different+judgment.+We+take+ourselves+bound+to+do+much+for+the+unity+and+peace+of+the+churches%3A+Besides%2C+being+many+of+us+at+a+loss+in+several+controverted+points+of+discipline%2C+we+think+the+amicable+union+and+association+of+brethren+where+all+things+may+be+frequently+and+plainly+debated+will+be+the+likeliest+way+to+satisfy+and+rectify+us+in+those+controverted+points.+In+the+meantime%2C+you+may+join+with+us+in+going+so+far+as+we+can+go+unanimously%2C+without+disclaiming%2C+yea+or+forbearing+your+own+way.+For+I+think+the+constant+exercise+of+the+presbyterian+government+may+well+consist+with+our+Propositions+and+associations%3A+part+of+it+being+indeed+above%2C+but+not+contrary+to+our+Agreement%2C+and+therefore+may+be+done+by+those+that+will+overgo+us%2C+without+dividing+from+us.+%E2%80%A6+And+whereas+it+may+be+objected+that+we+do+allow+a+single+minister+to+name+offenders+and+to+charge+it+on+the+people%E2%80%99s+consciences+to+avoid+communion+with+them%2C+which+only+a+presbytery+is+authorized+to+do%2C+I+answer%3A%0A%0A1.+We+desire+each+church+may+have+a+presbytery%2C+and+then+we+are+agreed.%0A%0A2.+The+brethren+of+the+Classical+Way+do+allow+a+single+pastor+to+pronounce+the+sentence+of+excommunication+itself%2C+so+be+it+he+have+the+advice+and+consent+of+a+presbytery.+And+to+avoid+all+possibility+of+breach+upon+this+ground%2C+we+have+agreed+to+take+the+advice+of+the+Association+of+ministers+before+we+require+the+people+to+avoid+communion+with+any.+Only+we+resolve+not+to+do+this+all+on+the+same+reasons+and+principles%3A+One+may+think+it+of+flat+necessity+in+a+regimental+way%3A+Another+may+think+it+of+necessity+in+a+way+of+union%3A+Another+may+think+it+convenient+to+avoid+miscarriages+and+rash+censures+in+so+weighty+a+case%3A+Another+may+think+it+fit+to+be+yielded+to+for+peace+with+those+brethren+that+judge+it+necessary%2C+seeing+it+is+unquestionably+lawful+to+take+advice+in+cases+of+such+weight.+And+why+must+we+needs+agree+in+our+reasons+as+long+as+we+agree+in+our+practice%3F%0A%0A3.+It+is+only+a+preaching+power+that+we+exercise%2C+applying+Christ%E2%80%99s+doctrine+to+particular+persons+and+cases%3A+supposing+the+evidence+of+the+fact+and+guilt+to+be+beyond+question%2C+we+do+but+apply+the+word+to+the+person+hereupon%E2%80%A6+Have+not+pastors+a+charge+of+particular+souls%2C+but+only+of+people+in+general%3F+Is+not+the+Old+Testament+and+New+full+of+examples+to+warrant+us+in+this%3F+Take+heed+of+crying+down+duty%2C+under+pretense+of+questioning+authority.+%E2%80%A6+I+will+say+no+more+to+any+objections+that+may+possibly+be+made+by+my+brethren+of+the+Classical+Way%2C+because+I+find+by+experience+it+is+needless+%28if+others+be+as+those+with+us%29%2C+for+they+are+the+forwardest+men+to+our+union+and+Association+of+any+others+%28here%29.+The+Lord+grant+the+like+spirit+of+unity+and+condescension+in+other+parts.+%E2%80%A6+Brethren%21+Would+you+have+unity+and+peace+or+no%3F+If+you+would%2C+must+not+you+condescend+as+far+as+may+be+to+others%2C+as+well+as+others+to+you%3F+Let+it+be+the+property+of+the+Pope+to+accept+of+no+peace+with+any+Church+that+will+not+wholly+come+up+to+his+will+and+way.+And+you+know+that+this+is+the+great+point+which+you+must+yield+in+or+you+cannot+have+union+with+the+contrary+minded%E2%80%A6+Is+it+not+fit+that+bounds+for+order+and+division+should+be+set%3F%E2%80%A6+And+is+it+not+done+in+most+places+as+well+as+you+can+desire%3F+And+where+it+is+not%E2%80%A6+get+them+amended+as+soon+as+you+can.+In+the+mean+time%2C+affect+not+confusion%3A+turn+not+all+order+upside+down%3A+God+is+not+the+God+of+confusion%2C+but+of+order%2C+which+He+would+have+established+in+all+the+Churches.+5.+In+the+mean+time%2C+I+pray+you+observe%2C+that+you+may+join+with+us+in+this+without+contradicting+or+deserting+your+own+principles%E2%80%A6+The+public+welfare+and+unity+of+the+churches+is+to+be+preferred+before+the+pleasing%2C+yea+or+edifying+of+any+single+member.+What+confusion+will+follow+the+plucking+up+of+Christ%E2%80%99s+and+the+magistrate%E2%80%99s+and+the+churches%E2%80%99+bounds%3F%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98Objections+Answered%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F501d90c574.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/501d90c574.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-occasional-partial-conformity-or-moderate-puritanism/#:~:text=1.%20Some%20brethren%20of%20the%20Classical,the%20magistrate%E2%80%99s%20and%20the%20churches%E2%80%99%20bounds&amp;text=1.%20Some%20brethren%20of%20the%20Classical%20%5Bpresbytrian%5D%20way&amp;text=Christ%E2%80%99s%20and%20the%20magistrate%E2%80%99s%20and%20the%20churches%E2%80%99%20bounds" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

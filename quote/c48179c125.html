<blockquote><p>It is often affirmed that in the matter of sabbath-observance we should not attempt to legislate for the unconverted. But the legislation is already in force. The Almighty has spoken in the Decalogue. As to the laws of the land, the government of the nation has no right to legalize murder or theft – no right to disregard the sixth or the eighth commandment.

It should not act as though there were no distinction between right and wrong. It should not act as though God had not spoken. It should not legislate contrary to any command of the Decalogue, but rather in support of these commands. And it would seem to be a Christian duty heartily to support the laws of the land which are{ for the maintenance of the ten great Words of God’s law – the fourth included. Admittedly, men will never truly keep the Lord’s day aright until they love the Lord of the day. Our first great aim and endeavour, therefore, should be to lead them to the Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-j-grier.html">W. J. Grier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Development of the Lord s Day from the Jewish Sabbath’, The Christian Graduate</cite></span></figcaption>

<blockquote><p>In the Middle Ages Thomas not only asserted that as rational beings human beings can—without supernatural grace—know natural truths but also testifies that it is impossible for there to be “some knowledge which is totally false without any admixture of some truth” and in this connection appeals to the words of Beda and Augustine: “There is no false doctrine which does not at some time mix some truth with falsehoods.” The Reformed theologians were even better positioned to recognize this by their doctrine of common grace. By it they were protected, on the one hand, from the Pelagian error, which taught the sufficiency of natural theology and linked salvation to the sufficiency of natural theology, but could, on the other hand, recognize all the truth, beauty, and goodness that is present also in the pagan world. Science, art, moral, domestic, and societal life, etc., were derived from that common grace and acknowledged and commended with gratitude. As a rule this operation of common grace, though perceived in the life of morality and intellect, society and state, was less frequently recognized in the religions of pagans. In the latter context the Reformed only spoke of natural religion, innate and acquired, but the connection between this natural religion and the [pagan] religions was not developed. The religions were traced to deception or demonic influences. However, an operation of God’s Spirit and of his common grace is discernible not only in science and art, morality and law, but also in the religions. Calvin rightly spoke of a “seed of religion,” a “sense of divinity.” Founders of religion, after all, were not impostors or agents of Satan but men who, being religiously inclined, had to fulfill a mission to their time and people and often exerted a beneficial influence on the life of peoples. The various religions, however mixed with error they may have been, to some extent met people’s religious needs and brought consolation amidst the pain and sorrow of life. What comes to us from the pagan world are not just cries of despair but also expressions of confidence, hope, resignation, peace, submission, patience, etc. All the elements and forms that are essential to religion (a concept of God, a sense of guilt, a desire for redemption, sacrifice, priesthood, temple, cult, prayer, etc.), though corrupted, nevertheless do also occur in pagan religions. Here and there even unconscious predictions and striking expectations of a better and purer religion are voiced. Hence Christianity is not only positioned antithetically toward paganism; it is also paganism’s fulfillment. Christianity is the true religion, therefore also the highest and purest; it is the truth of all religions. What in paganism is the caricature, the living original is here. What is appearance there is essence here. What is sought there can be found here. Christianity is the explanation of “ethnicism.” Christ is the Promised One to Israel and the desire of all the Gentiles. Israel and the church are elect for the benefit of humankind. In Abraham’s seed all the nations of the earth will be blessed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, trans. John Bolt, and John Vriend (Grand Rapids, MI: Baker Academic, 2003), 1.319–20.</span></figcaption>

<blockquote><p>A wive’s outward reverence consists in her reverend gesture, speech. For the first, that a reverend gesture and carriage of herself to her husband, and in her husband’s presence, beseems a wife, was of old implied by the vail which the woman used to put on, when she was brought unto her husband, as is noted in the example of Rebekah (Gen. 24:65): whereunto the apostle alludes in these words, ‘the woman ought to have power on her head.’ (1 Cor. 11:10) That cover on the woman’s head, as in general it implied subjection, so in particular this kind of subjection, viz. a reverend carriage and gesture. But most expressly is this duty set down by Saint Peter who exhorts wives to order their conversation [conduct] before their husbands, so as it be pure, with reverence. This reverend conversation [conduct] consists in a wive-like sobriety, mildness, courtesy and modesty. [Gouge does not go on to mention veils]</p></blockquote>

" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Towards God the duty is set down, that when we are merry and cheerful, to sing psalms and hymns unto God, ver. 16. And therefore St. James saith, chap. 5:13, ‘if any be merry, let him sing psalms ;’ … …a hymn, is a song of thanksgiving for a benefit received, and therefore our Savior, after his supper, sang an hymn, Mt. 26:30, viz., for a particular benefit. Lastly, a song is a more general thing than either the psalm or hymn, viz., wherein we give thanks, not for particular benefits, but for general blessings received at God’s hands, as when David praised the Lord for the works of creation, as the heavens, etc., Ps. 104… Use. These must be spiritual songs, viz. holy psalms and songs, not profane and wicked love-songs…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, (d. 1603; rep. Edinburgh, 1864), Sermon 26, on Col. 3:16-17, p. 55, rt. col.</span></figcaption>

<blockquote><p>The Scriptures, with equal explicitness, forbid travel upon the Sabbath-day. “Thy stranger that is within thy gates” is put down by name in the fourth commandment, and is as much required to keep the Sabbath holy as any other person. So in Ex. 23: 12, “the stranger” is required to “rest,” and the reason is given, that he “may be refreshed.”

Many and ingenious, but wicked are the pleas urged by men for disregarding the fourth commandment when on a journey; but they are “refuges of lies,” which will be swept away the moment man appears in the presence of God.

This is a great sin in our nation. Its influence is vastly mischievous. The traveller is seen by many, and sins openly. He requires the services of those who conduct the public conveyances; or, if travelling privately, he at least demands the services of keepers of public or private houses. The whole moral law, including the fourth commandment, was given from Sinai to a whole nation on a journey.</p></blockquote>

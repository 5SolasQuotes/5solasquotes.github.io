<main class="wrap"><figure class="quote" id="q-135a1eb41e" data-kw="">
<blockquote><p>The office of Christ is threefold: prophetic, priestly, and kingly. For He became for us “Wisdom” (as Prophet), “Righteousness” (as Priest), “Sanctification” (as King, author of internal holiness and heavenly glory), and “Redemption” (which is executed in the former parts) (1 Cor. 1:30).

The natural lack of man, corrupted by sin, also required that very thing. For the prophet removed ignorance, the priest alienation from God, and the king weakness of drawing near to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), XIX.VI, Kindle Locations 2989-2992.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry.html">Church Government and the Ministry</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), ch. 20, 13th Article, ‘Private Worship’</span></figcaption>

</figure><figure class="quote" id="q-434a2843e4" data-kw="">
<blockquote><p>[Rutherford’s Anglican opponents said:] ‘Notwithstanding, that crossing, kneeling, surplice, human holy days occasion the soul-murder of him for whom Christ died, yet we the Prelates command the practice of the foresaid ceremonies as good and expedient for edification, for our commandment makes the murdering of our brethren, to be obedience to the Fifth Commandment.’ [Rutherford responds:] But if Prelates may command that which would be otherwise, without, or before the Commandment [of God], [even] spiritual murdering and scandalizing of our brother, they may command also that which would be otherwise without or before their command: adultery against the Seventh, and theft against the Eighth, and Perjury and lying against the Ninth Commandment, and concupiscence against the Tenth; for the Fifth Commandment has the precedency before the Seventh, Eighth, Ninth and Tenth Commandments no less than before the Sixth, which forbids the killing of our brother’s soul.</p></blockquote>

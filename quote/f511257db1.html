<main class="wrap"><figure class="quote" id="q-f511257db1" data-kw="Permission" data-pol="">
<blockquote><p>God leaves the sinner so far as he sees meet to the swing of his own lusts, and denies him restraining grace. … And when the restraint is taken off the sinner, he runs furiously, to evil. 3. God bounds sin, and restrains men in their sins, as he does the raging sea, allowing it to go so far, but no further.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86e8b1fd52" data-kw="Permission|Author of sin|Holiness|The Fall" data-pol="">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote>
<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 5.4</figcaption>

</figure><figure class="quote" id="q-bc72ee2b84" data-kw="Permission|Author of sin" data-pol="">
<blockquote><p>Not by permitting the evil action, because he is bound by no law to hinder sin. Not by determining it; for as he who puts out a fire so that it may not spread further is not the cause of the fire, so he who fixes bounds to sin is not the cause of sin. Not by directing it to a good end; for as it is the highest art to prepare a wholesome medicine from venomous animals, so it is glorious for God to draw light even out of darkness, and something good out of evils.</p></blockquote>
<figcaption>— <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a>, <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</figcaption>

</figure><figure class="quote" id="q-a923204566" data-kw="Permission|Author of sin|The Fall" data-pol="">
<blockquote><p>God acted nothing, but only ceased to act, and therefore could not be the efficient cause of man’s sin. As God is not the author of good but by willing and effecting it, so he is not the author of evil but by willing and effecting it. But he doth not positively will evil, nor effect it by any efficacy of his own. Permission is no action, nor the cause of that action which is permitted, but the will of that person who is permitted to do such an action is the cause.</p></blockquote>
<figcaption>— <a href="../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/fall-and-sin/the-fall.html">The Fall</a><a class="tag" href="../topics/fall-and-sin/original-sin.html">Original Sin &amp; Imputation</a></div>

</figure><figure class="quote" id="q-52550c975a" data-kw="Hardening|Author of sin" data-pol="">
<blockquote><p>When God is here spoken of as hardening some of the children of men, it is not to be understood that God by any positive efficiency hardens any man&#x27;s heart. There is no positive act in God, as though he put forth any power to harden the heart. To suppose any such thing would be to make God the immediate author of sin. God is said to harden men in two ways: by withholding the powerful influences of his Spirit, without which their hearts will remain hardened, and grow harder and harder; in this sense he hardens them, as he leaves them to hardness. And again, by ordering those things in his providence which, through the abuse of their corruption, become the occasion of their hardening.</p></blockquote>
<figcaption>— <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>God&#x27;s Sovereignty</cite>, sermon on Romans 9:18</figcaption>

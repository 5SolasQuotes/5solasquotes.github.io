<main class="wrap"><figure class="quote" id="q-52a0bd33f7" data-kw="">
<blockquote><p>We must labour to wean our hearts daily, from the overmuch love of all earthly things; and inure our selves to bear willingly the daily and ordinary crosses we are subject to in this life, nothing makes us so unwilling and unfit to dye, as the immoderate love of earthly things. They are in themselves (certainly) God’s good blessings, and he doth (of his goodness and bounty) allow us to use and enjoy them, not for our necessity onely, but even for our delight and comfort also he giveth us richly all things to enjoy, saith the Apostle, 1 Tim. 6. 17.

But the love of them is a most deadly enemy to grace, specially unto this grace of dying willingly and comfortably. That which the Apostle saith of the love of money, 1 Tim. 6. 10. that it is the root of all evil, and cause why many are even pierced through with many sorrows, (the truth whereof is never more seen then when they are to dye) may be likewise said of the love of any other worldly thing. Love not the world (saith the Apostle 1 John 2. 15.) neither the things that are in the world. If any man love the world, the love of the father is not in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached in Ashby-Chappell, Oct. 4. 1629</cite>, (London: George Miller, 1633), p. 13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-62ffb91a19" data-kw="">
<blockquote><p>The divine affections or virtues are not distinct dispositions or habits that stand as attributes or functions of will, as they do in human beings, but instead are divine perfections that have some analogy to the dispositions or habits of the human will: ‘for though, properly speaking, there are [no affections] in God, he being a most pure and simple act, free from all commotion and perturbation; yet there being some things said and done by him, which are similar to affections in intelligent beings, [sic] they [that] are ascribed to him; as love, pity, hatred, anger etc., from which must be removed everything that is carnal, sensual, or has any degree of imperfection in it.’ (Gill, Complete Body of Divinity, I, p. 112; cf. Synopsis purioris theologiae, VI.xxxix; Turretin, Inst. theol. elencticae, III.xix.1.) Several writers, most notably Venema, treat these affections not only in relation to the divine will, but also as the affective manifestations of the goodness and holiness of God… The basis for this understanding is the assumption that affections are not essential attributes or original properties but, rather, are ad extra manifestations in which God is known through his effects.</p></blockquote>

fects&amp;text=The%20divine%20affections%20or%20virtues%20are%20not%20distinct&amp;text=in%20which%20God%20is%20known%20through%20his%20effects" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Scripture, moreover, has a, third rule for modifying the use of earthly blessings. We have already adverted to it when considering the offices of charity. For it declares that they have all been given us by the kindness of God, and appointed for our use under the condition of being regarded as trusts, of which one day we must give an account. We must, therefore, administer them as if we constantly heard the words sounding in our ears, ‘Give an account of your stewardship.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559), bk. 3, ch. 10, sect. 5, p. 297</span></figcaption>

</figure><figure class="quote" id="q-acc30bbf0b" data-kw="">
<blockquote><p>I find that the covenant of God is of two sorts. One is general, an other is special and everlasting. The general covenant is that which he hade with his whole frame of the earth and all that dwelleth therein, as well beasts as men, with the day also and the night, winter and summer, cold and heat, seed time and harvest …

The special and everlasting covenant, is the same which he hath vouchsafed to make with his elect and believing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of Christian Religion</cite>, trans. John Man (London: Henry Bynneman, 1578), ff. 284, 285.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-18653f1acd" data-kw="">
<blockquote><p>5. They differ [objecto] in the object. The chief object concerned in the first covenant was all mankind, (though it referred to Adam more immediately,) the first man being the root, spring, and representative head of all mankind. Adam was the first person with whom this covenant was made, yet it was not only personal, but comprehensive, and extended to all man’s posterity, therefore when he violated that covenant, it was imputed to us, his fault was our guilt; “for in Adam all sinned,” see Rom. v. 12, 16. But this second covenant is personal, it is contracted with individual souls; it is true, the general grant is to all, the proclamation is universal, whosoever will, it is offered promiscuously but the saving benefits of this covenant reach no further with respect to persons at age, than those that by faith apply them, by particularly laying hold of this blessed covenant; it is only the seed, believers, heirs of the promise, children of the covenant, that are sharers in it, Gal. iii. 22.

6. The first covenant, and this new gospel covenant differ [materia] in the matter, or good things promised, in the former God promised life only, “Do this and live”; he did not promise continuance of life absolutely, but upon condition of man’s obedience, nor yet his restitution in case he fell, for fall once, and fall finally, there is no recovery by virtue of that old covenant. But now by this gospel covenant, God promiseth many rich blessings which in this our fallen state are needful for us, as pardon of sin, reconciliation, adoption, sanctification, means of grace, daily supports, perseverance, a crown of glory ; God gives grace and glory by virtue of it, and what tends to both, and that immutably without failure or defectibility; see Jer. xxxi. 34—36. xxxiii. 20, 21. Isa. liv. 9, 10.

7. They differ [conditionibus] in the conditions of both; indeed some say obedience is the condition on man’s part under both covenants, but surely not the same obedience, the former required personal, perfect, absolute, and perpetual obedience to the commands, both moral and positive, without any deviation to the right-hand, or to the left, if he failed in the least punctilio, he was under the curse, Gal. iii. 10; and this obedience must be performed by strength of grace received in his first creation; since man was able to perform it, this condition was highly reasonable. But in the gospel covenant the great condition is faith; a free acceptance of the offered grace, an unfeigned faith, which is not an antecedent condition to the making of the covenant, but subsequent, or intermediate for man’s laying hold, and receiving the benefits thereof; yea, God promiseth and worketh what he requires; all faith, repentance, and new obedience, are the gifts of free grace; grace doth all, Rom. iv. 16</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Bonds Renewed</cite>, (1687) in The Whole Works of the Rev. Oliver Heywood, B.A. (5 vols, Idle: John Vint, 1826), 4: 15-17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

7. They differ [conditionibus] in the conditions of both; indeed some say obedience is the condition on man’s part under both covenants, but surely not the same obedience, the former required personal, perfect, absolute, and perpetual obedience to the commands, both moral and positive, without any deviation to the right-hand, or to the left, if he failed in the least punctilio, he was under the curse, Gal. iii. 10; and this obedience must be performed by strength of grace received in his first creation; since man was able to perform it, this condition was highly reasonable. But in the gospel covenant the great condition is faith; a free acceptance of the offered grace, an unfeigned faith, which is not an antecedent condition to the making of the covenant, but subsequent, or intermediate for man’s laying hold, and receiving the benefits thereof; yea, God promiseth and worketh what he requires; all faith, repentance, and new obedience, are the gifts of free grace; grace doth all, Rom. iv. 16”

— Oliver Heywood, Baptismal Bonds Renewed, (1687) in The Whole Works of the Rev. Oliver Heywood, B.A. (5 vols, Idle: John Vint, 1826), 4: 15-17.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+They+differ+%5Bobjecto%5D+in+the+object.+The+chief+object+concerned+in+the+first+covenant+was+all+mankind%2C+%28though+it+referred+to+Adam+more+immediately%2C%29+the+first+man+being+the+root%2C+spring%2C+and+representative+head+of+all+mankind.+Adam+was+the+first+person+with+whom+this+covenant+was+made%2C+yet+it+was+not+only+personal%2C+but+comprehensive%2C+and+extended+to+all+man%E2%80%99s+posterity%2C+therefore+when+he+violated+that+covenant%2C+it+was+imputed+to+us%2C+his+fault+was+our+guilt%3B+%E2%80%9Cfor+in+Adam+all+sinned%2C%E2%80%9D+see+Rom.+v.+12%2C+16.+But+this+second+covenant+is+personal%2C+it+is+contracted+with+individual+souls%3B+it+is+true%2C+the+general+grant+is+to+all%2C+the+proclamation+is+universal%2C+whosoever+will%2C+it+is+offered+promiscuously+but+the+saving+benefits+of+this+covenant+reach+no+further+with+respect+to+persons+at+age%2C+than+those+that+by+faith+apply+them%2C+by+particularly+laying+hold+of+this+blessed+covenant%3B+it+is+only+the+seed%2C+believers%2C+heirs+of+the+promise%2C+children+of+the+covenant%2C+that+are+sharers+in+it%2C+Gal.+iii.+22.%0A%0A6.+The+first+covenant%2C+and+this+new+gospel+covenant+differ+%5Bmateria%5D+in+the+matter%2C+or+good+things+promised%2C+in+the+former+God+promised+life+only%2C+%E2%80%9CDo+this+and+live%E2%80%9D%3B+he+did+not+promise+continuance+of+life+absolutely%2C+but+upon+condition+of+man%E2%80%99s+obedience%2C+nor+yet+his+restitution+in+case+he+fell%2C+for+fall+once%2C+and+fall+finally%2C+there+is+no+recovery+by+virtue+of+that+old+covenant.+But+now+by+this+gospel+covenant%2C+God+promiseth+many+rich+blessings+which+in+this+our+fallen+state+are+needful+for+us%2C+as+pardon+of+sin%2C+reconciliation%2C+adoption%2C+sanctification%2C+means+of+grace%2C+daily+supports%2C+perseverance%2C+a+crown+of+glory+%3B+God+gives+grace+and+glory+by+virtue+of+it%2C+and+what+tends+to+both%2C+and+that+immutably+without+failure+or+defectibility%3B+see+Jer.+xxxi.+34%E2%80%9436.+xxxiii.+20%2C+21.+Isa.+liv.+9%2C+10.%0A%0A7.+They+differ+%5Bconditionibus%5D+in+the+conditions+of+both%3B+indeed+some+say+obedience+is+the+condition+on+man%E2%80%99s+part+under+both+covenants%2C+but+surely+not+the+same+obedience%2C+the+former+required+personal%2C+perfect%2C+absolute%2C+and+perpetual+obedience+to+the+commands%2C+both+moral+and+positive%2C+without+any+deviation+to+the+right-hand%2C+or+to+the+left%2C+if+he+failed+in+the+least+punctilio%2C+he+was+under+the+curse%2C+Gal.+iii.+10%3B+and+this+obedience+must+be+performed+by+strength+of+grace+received+in+his+first+creation%3B+since+man+was+able+to+perform+it%2C+this+condition+was+highly+reasonable.+But+in+the+gospel+covenant+the+great+condition+is+faith%3B+a+free+acceptance+of+the+offered+grace%2C+an+unfeigned+faith%2C+which+is+not+an+antecedent+condition+to+the+making+of+the+covenant%2C+but+subsequent%2C+or+intermediate+for+man%E2%80%99s+laying+hold%2C+and+receiving+the+benefits+thereof%3B+yea%2C+God+promiseth+and+worketh+what+he+requires%3B+all+faith%2C+repentance%2C+and+new+obedience%2C+are+the+gifts+of+free+grace%3B+grace+doth+all%2C+Rom.+iv.+16%E2%80%9D%0A%0A%E2%80%94+Oliver+Heywood%2C+Baptismal+Bonds+Renewed%2C+%281687%29+in+The+Whole+Works+of+the+Rev.+Oliver+Heywood%2C+B.A.+%285+vols%2C+Idle%3A+John+Vint%2C+1826%29%2C+4%3A+15-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F18653f1acd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/18653f1acd.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/17/oliver-heywood-on-the-two-covenants-contrasted-2/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

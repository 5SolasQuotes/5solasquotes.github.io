<main class="wrap"><figure class="quote" id="q-9d306f79c2" data-kw="">
<blockquote><p>What Mr. [Thomas] Bedford [d. 1653] has produced for the efficacy of baptism has been answered by Mr. [Richard] Baxter in his Appendix to his Plain Scripture, etc. [1651-1656]… Dr. [Cornelius] Burges, his Treatise of Baptismal Regeneration [1629], has been freely censured by many… And therefore I deny baptism to be the remedy of original sin, or the cause of regeneration, or that Christ intended to assign the use to baptism to heal original sin, or to testify the freedom from it without actual [sin]. These things have been delivered by Augustine and taught by the Romanists and Lutherans, but by many other Protestants disclaimed and refuted; and therefore Mr. Stephens, Mr. [James?] Cranford [d. 1657], Mr. Bedford, etc. in using this argument do but symbolize with the Papists, and revive what many Protestants of best note have exploded. ([Errata, p. 341:] What Dr. [Samuel] Ward and Dr. [John] Davenant have said for regeneration and justification of infants by baptism has been accurately examined and enervated by Mr. Gataker in Latin.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-Pædobaptism, or, The Second Part of the Full Review of the Dispute Concerning Infant-Baptism</cite>, ... (London, 1654), pp. 220-21. Tombes was an English baptist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ac486bd48" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Efficacy &amp; Utility of Baptism in the Case of Elect Infants whose Parents are Under the Covenant’</cite>, (Utrecht, 1693) in MJT 17 (2006), pp. 121-90, Includes an introduction by Mark Beach. Originally an appendix in William Marshall, Popery in The Full Corn, the Ear &amp; the Blade; or, The Doctrine of Baptism in the Popish, Episcopalian &amp; Congregational Churches; with a Defence of the Calvinistic or Presbyterian View (Edinburgh: Paton and Ritchie, 1852) | On pp. 132-137 Witsius critiques the English view of John Davenant, the Scottish, Aberdeen view of William Forbes and others, that:</span></figcaption>

ism/#:~:text=a%20certain%20kind%20of%20regeneration%20and,sin%20after%20they%20have%20grown%20up&amp;text=a%20certain%20kind%20of%20regeneration%20and%20justification%20is&amp;text=their%20own%20sin%20after%20they%20have%20grown%20up" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-feda7ad161" data-kw="">
<blockquote><p>…hence we seek a warrant, why these who were once members of the visible Church and baptized, as the Answer to the 32 [Questions, a previously published congregationalist work] says, and so [are] clean and holy, 1 Cor. 7:14; Rom. 11:16, (2) in covenant with God, Acts 2:38-39; Acts 15:14-15; Gen. 17:7; 2 Cor. 6:16-18, etc. (3) and so redeemed by the blood of Christ and baptized into his body, 1 Cor. 12:13, even unto Christ, Gal. 3:17; Acts 2:38-39, when they come to age, are for no scandal unchurched, and because they cannot give evidence of real conversion, yet for 60 or 80 years, and to their dying day, are no more Church-members than pagans? ([Margin note:] Our [congregationalist] Brethren cast out of the Church these who were baptized in their infancy, and members thereof, because visibly non-regenerated. What warrant for this censure?)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the Churches of New England is now Re-examined (London, 1658), bk. 1, ch. 14, p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-a56c78153d" data-kw="">
<blockquote><p>Concerning your determination about the effect of baptism (unless there were great necessity of defending yourself), I would not advise you to set that foot controversy on foot. Though it be the opinion of Antiquity, and to me appears more probable than the contrary, yet at this time when the Arminians draw so close one to another, it is not convenient to be at open controversies amonst ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Samuel Ward in Morris Fuller, The Life, Letters &amp; Writings of John Davenant</cite>, ... (London, 1897), p. 329</span></figcaption>

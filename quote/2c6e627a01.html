<main class="wrap"><figure class="quote" id="q-2c6e627a01" data-kw="">
<blockquote><p>Men of a broad and unambitious spirit take the cause of others to their hearts. They rejoice in the success of their neighbours and their nation, and they mourn in their distress and tribulation. Selfish men care only for their own personal affairs. The Christian is a man who is for his nation. He thinks of his nation as his family and himself as one of the family, as a body and himself as a member of the body. Any injury, wound, or pain in any part of the body, especially the head, affects him. The death of those who are useful and famous in the country is a source of grief and anxiety to everyone.

The Christian is affected in this way and feels the loss deeply. Isaiah complained that “the righteous perishes, and no man lays it to heart: and merciful men are taken away, none considering that the righteous is taken away from the evil to come” (Isa. 57:1). The death of a good, gentle, godly king is a cause of great sadness to the nation in general and to the godly in particular. Thus was the death of Josiah to all Judah, and especially to Jeremiah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-elias.html">John Elias</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Funeral Sermon of King George III (1820) in The Experimental Knowledge of Christ and additional Sermons of John Elias</cite></span></figcaption>

</figure><figure class="quote" id="q-ad9c349332" data-kw="">
<blockquote><p>What cannot warrant a breach where there is union, that cannot warrantably be the ground to keep up a division; Now there are many miscarriages or defects, which are really gross, and yet will not warrant a schism, as all that write thereon do clear, and is obvious to all. The reason of the consequence is, because making up of a breach is no less a duty than preventing thereof; and further, if it began upon such a ground, then the continuing thereof upon the same ground is but the continuing in the same sin; and it cannot be thought that any party by dividing upon an unjust ground can afterward be justified upon the same ground; It remains therefore, that if the ground was not sufficient at first to warrant a separation or division, it cannot be sufficient afterward to continue the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, ... (Edinburgh: Higgins, 1659), pt. 4, ch. 7, p. 320</span></figcaption>

</figure><figure class="quote" id="q-673436de2b" data-kw="">
<blockquote><p>It has pleased the Lord also, to bring you a degree further, that both the honourable Houses of Parliament, and many others, whose hearts the Lord has touched, have entered into a SOLEMN LEAGUE AND COVENANT, for performing such duties, as are judged necessary at this time, for the honour of God, and for the deliverance and preservation of the church and kingdom, which no doubt will prove a precious and powerful means of good, if the name of the most High God, be not by it taken in vain. But take heed, that it be not forgotten by them that have taken it, before it be taken by others. And therefore two things would be looked into. (1.) That although it should never be taken by others, yet it obliges such as have entered in covenant, and although the whole nation be bound to the same duties which you are bound unto, you have entered into a new obligation, which, if you shall forget or violate, will certainly be laid to your charge. Jeremiah reproves Israel not for the transgression of the Law, which yet commanded the same duties, but for violation of the covenant (Jer. 34). (2) That others be instructed and moved to enter into the same covenant. For if they who have entered in covenant shall not consider that it is a perpetual covenant never to be forgotten, or (which God forbid) shall forget, their supervenient obligation, and others shall refuse to enter in covenant, it will not only make a division in the church and kingdom, but shall be a ready way to bring on a greater wrath, than yet has been seen or felt, upon one sort for their perfidy, and upon the other for their neglect or obstinacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached to the Honourable House of Commons at their late Solemn Fast, Wednesday, December 27, 1643 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westminster Assembly of divines 1643-1645</cite></span></figcaption>

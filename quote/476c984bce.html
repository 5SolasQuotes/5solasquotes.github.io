</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02908a3ee6" data-kw="">
<blockquote><p>First by ‘day’ we are here [in Gen. 1:14, ‘to separate the day from the night’] to understand not the space of the sun, moon, and stars compassing the earth, which is the space of 24 hours; for that ‘day’ consists of an evening and a morning, and comprehends in it one night; and some call it a natural, and some a civil, and some an astronomical day: but here by ‘day’ we are to understand the time while the sun, the greatest light, shines and gives light upon the face of the earth: And by ‘night’ the time while the moon and stars do only appear and give their dim light upon the earth, which some call an artificial and civil day and night, but others do more properly call it a natural day, and a natural night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 9, pp. 138-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

0night" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>X. That the world lacked a beginning, and therefore VI. is eternal by reason of duration, was stated by Ocellus Lucanus and Xenophanes of Colophon, and after them, Aristotle. Although there are not wanting those who excuse Aristotle: and of these, some deny that he simply denied that the world had a beginning, like Thomas, pt. 1, quest. 46, art. 1; others affirm that Aristotle spoke hesitantly on this matter in several places, like Grotius, bk. 1, Of the Truth of the Christian Religion, §7; others use a distinction, and assert that Aristotle stated that God is the emanative cause of the world, without novelty of being, so that the world is indeed posterior to God by nature, but not by duration; like Suarez, Metaphysical Disputations, 20, sect. 1, n. 24, 26. The more common opinion, however, is that Aristotle affirmed that the world is eternal. Whence many Scholastics, rightly supposing from the foundations of the Christian religion that the world was created in time, nevertheless, in deference to Aristotle, defend that the world could have been from eternity; with whom, however, others disagree. We, although we do not deny that this question, setting aside revelation, is most difficult to solve, and that therefore this error should be pardoned in Aristotle and other philosophers who assert eternal matter; yet from revelation, to which sound reason, let alone illuminated reason, is not repugnant, we believe it as indubitable that the world was created by God in time. For:

      1. Gen. 1:1, God is said to have created the heaven and the earth “in the beginning”; although indeed the Targum of Jerusalem rendered that “in the beginning” as מהָ כְ וֹבחְּ, “through wisdom”; and Origen, Ambrose, Jerome, and Basil understand the Son of God, from Prov. 8:22; Jn. 1:1; c. 8:28; Col. 1:18; Apoc. 3:14, and take “beginning” not by reason of time, but of order; of which version Menasseh Ben Israel also makes mention, Problems, 13, On Creation; yet we see no solid reason why the more common interpretation should be deserted and the beginning of time be relinquished here.

      2. Because in Ps. 90:2, a beginning of time is attributed to the world: “Before the mountains were brought forth, or ever you had formed the earth and the world.” Prov. 8:24-26, “When there were no depths… before the fountains abounded with water. Before the mountains were settled, before the hills was I brought forth: While as yet he had not made the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, Of Creation, pp. 21-22 trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

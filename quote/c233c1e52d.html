</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53ba2a652c" data-kw="">
<blockquote><p>The custom in these parts [in France] is, to put off the hat, when in public acts the king is named: Moreover the Protestants [Anglicans] in England do ordain that men put off their hats at sermons when they hear the name of Jesus. In like manner all countries haue their customs: that which is ridiculous and superstitious in one place, is held and esteemed comely and religious in another. The most expedient way would be, instead of calling one another idolaters and heretics, to exhort one another charitably to do all to edification, to avoid the appearance of evil and excess, and not to scandalize the infidels and unbelievers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/morton-eudes.html">Morton Eudes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Traditions, or a Treatise of the Belief of the Christians of Asia, Europa &amp; Africa in the Principal Controversies of our Time… (London, 1609), Question 42, Annotation Eudes was a Romanist.</cite>, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-0be51627bb" data-kw="">
<blockquote><p>Besides, you mistake him [Tertullian] if you think he meant by the name of ‘tradition’ a tradition of the apostles. For whatsoever custom not written in the scripture was kept by the faithful, that, because it was delivered by some body from whom the use thereof was taken, he says it came in by tradition. In so much that he affirms it both of Jewish customs before the apostles, as that their women covered their faces with vails…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds and John Hart [a Romanist] touching the Head and the Faith of the Church (London, 1584), ch. 8</cite>, p. 581</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-023d25eed8" data-kw="">
<blockquote><p>…but he [Paul] says that the church has no such custom as that any man should be contentious, but rather that all should preserve the common peace. But if any one be contentious, he is a stranger to the church of God… he says, that the churches of God have no custom of allowing any man to be contentious. Thus he represses contentious spirits by the authority of the church, and does not confirm the dogma by mere custom. Now that custom of avoiding contention in the church is abundantly sanctioned by testimonies of scripture.</p></blockquote>

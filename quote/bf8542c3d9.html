<main class="wrap"><figure class="quote" id="q-bf8542c3d9" data-kw="">
<blockquote><p>Now, you shall see that prayer gives acknowledgement of His attributes more than anything; for He who prays to God, in so doing, acknowledges His omnipresence and His omniscience. They acknowledge that He hears that which the idols of the Gentiles could not do, and that He knows the secrets of men’s hearts that neither men nor angels can do.

Again, it acknowledges His almighty power, that He is able to do anything. For that is presupposed when we come and seek Him.

Again, it acknowledges His mercy and His goodness, that He is not only able, but exceedingly willing to help.

Again, it acknowledges His truth, that as He has promised so He will perform it. When I go and seek Him, all the attributes of God are acknowledged in prayer. Therefore, therein you worship Him in a special manner when you go and seek Him, and pray to Him. In doing so, you acknowledge Him. Yea, you acknowledge Him to be a Lord and a Father. It is like when we see a child run to a man and ask him for a blessing. When we see him ask him for food and raiment, we say, “Surely such a man is his father.” So this very praying to God is a worshipping of Him, because it acknowledges His attributes, and His relation to us and ours to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Daily Exercise: A Treatise Concerning the Whole Duty of Prayer</cite>, (1632) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), pp 36-37.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-61d8791c9c" data-kw="">
<blockquote><p>These things, beloved brethren, when we have learnt from the sacred reading, and have gathered in what way we ought to approach to prayer, let us know also from the Lord’s teaching what we should pray. “Thus,” says He, “pray ye:—

“Our Father, which art in heaven, Hallowed be Thy name. Thy kingdom come. Thy will be done, as in heaven so in earth. Give us this day our daily bread. And forgive us our debts, as we forgive our debtors. And suffer us not to be led into temptation; but deliver us from evil. Amen.” …

After all these things, in the conclusion of the prayer comes a brief clause, which shortly and comprehensively sums up all our petitions and our prayers. For we conclude by saying, “But deliver us from evil,” comprehending all adverse things which the enemy attempts against us in this world, from which there may be a faithful and sure protection if God deliver us, if He afford His help to us who pray for and implore it.

And when we say, Deliver us from evil, there remains nothing further which ought to be asked. When we have once asked for God’s protection against evil, and have obtained it, then against everything which the devil and the world work against us we stand secure and safe. For what fear is there in this life, to the man whose guardian in this life is God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian.html">Cyprian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Lord’s Prayer</cite>, (c. 252), 7, 27 in Ante-Nicene Fathers, 5: 449, 454-55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

venanter.wordpress.com/2020/03/23/cyprian-of-carthage-on-the-conclusion-to-the-lords-prayer/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-38a909b283" data-kw="kingdom come">
<blockquote><p>The second petition is: that God&#x27;s Kingdom come [Matt. 6:10]. Even though it contains nothing new, it is with good reason kept separate from the first petition; for if we consider our languor in the greatest matters of all, it behooves us to extend our discussion in order to drive home something that ought to have been thoroughly known of itself. … God reigns where men, both by denial of themselves and by contempt of the world and of earthly life, pledge themselves to his righteousness in order to aspire to a heavenly life. Thus there are two parts to this Kingdom: first, that God by the power of his Spirit correct all the desires of the flesh which by squadrons war against him; second, that he shape all our thoughts in obedience to his rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/the-lords-prayer.html">The Lord&#x27;s Prayer</a> › <a href="../topics/prayer/the-lords-prayer/thy-kingdom-come.html">Thy kingdom come</a></span></div>

</figure><figure class="quote" id="q-0f05c8b204" data-kw="">
<blockquote><p>Lay no weight on the quantity of your prayers; that is to say, how long or how many they are. These things avail nothing with God, by whom prayers are not measured, but weighed. And what makes the weight in them is the faith, fervency, and humility therein; so that one of those groanings mentioned, Rom. viii. 26, will down-weigh a whole day’s prayers, in which these things are wanting. Do you labour to get near God in prayer, and press forward to obtain that.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Memorial Concerning Personal and Family Fasting and Humiliation</cite>, (1756) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 383.</span></figcaption>

</figure><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9 / on invocation</span></figcaption>

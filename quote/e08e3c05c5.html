<main class="wrap"><figure class="quote" id="q-e08e3c05c5" data-kw="">
<blockquote><p>But if the tyrant forbids what God commands, you should not at all judge that you have performed your duty if you have merely refused to obey the tyrant, unless at the same time you obey the command of God as we declared that Obadiah did, who not merely refrained from slaying the prophets of God, but even protected and nourished them in defiance of the command of Ahab and Jezebel, since the Lord bids us, each as far as his calling permits, to bring succour to his brethren in peril. Thus also the Apostles, as we have said above, not merely did not desist from preaching the Gospel that they might heed the priests, but on the contrary they steadfastly preached everywhere since they had expressly received this command from the Lord: “Go ye and preach the Gospel to every creature,” etc.

Therefore when today we see many Rulers so bewitched by the Roman Antichrist that they by the sternest commands compel their subjects to attend the execrable sacrifice of Mass, the duty of all pious men requires not merely that they should not carry out that command, but further that they should in accordance with the example of Elijah and Elisha, even of the entire pure and true Church of old, join in pious gatherings, there hear the word of God and have communion of the sacraments as Christ ordained that it should be done in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers over their Subjects and the Duty of Subjects Towards their Rulers: A Brief and Clear Treatise Particularly Indispensable to Either Class in these Troubled Times</cite>, (1572), trans. Henry Louis Gonin, ed. Patrick S. Poole in Journal of Christian Reconstruction, 14.1 (1996), p. 106.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-d948d98553" data-kw="">
<blockquote><p>It is, that when God formed man, he implanted within him from the beginning a natural law. And what then was this natural law? He gave utterance to conscience within us; and made the knowledge of good things, and of those which are the contrary, to be self-taught. For we have no need to learn that fornication is an evil thing, and that chastity is a good thing, but we know this from the first.

And that you may learn that we know this from the first, the Lawgiver, when He afterwards gave laws, and said, “Thou shalt not kill,” did not add, “since murder is an evil thing,” but simply said, “Thou shall not kill;” for He merely prohibited the sin, without teaching. How was it then when He said, “Thou shalt not kill,” that He did not add, “because murder is a wicked thing.” The reason was, that conscience had taught this beforehand; and He speaks thus, as to those who know and understand the point. Wherefore when He speaks to us of another commandment, not known to us by the dictate of consciences He not only prohibits, but adds the reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies Addressed to the People of Antioch, Concerning the Statutes</cite>, (387), 12.9 in Nicene and Post-Nicene Fathers 2, 9: 421.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<main class="wrap"><figure class="quote" id="q-3d449a822f" data-kw="">
<blockquote><p>Whether or no it was sinful and unlawful to admit such to be members of the Committee of Estates who had been debarred from the public trust formerly, they being such as have satisfied the Kirk for the offense for which they were excluded?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7da9bbf34b" data-kw="">
<blockquote><p>The mean while the enemy came hard to the bridge-end and spoke to us and we to them. They desired us to come over and they would not harm us, and called for Mr. Hamilton to speak with him; so Mr. David Hume went over, and another gentleman with him, and spoke with the duke, and desired his Grace if he would prevent the effusion of blood. He told them, their petition should have been more humbly worded, and said, lay down our arms and come in his mercy, and we should be favourably dealt with: so he returned and told us. When Robert Hamilton heard it, he laughed at it, and said, ‘and [we shall] hang next.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., p. 477</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-799fe52128" data-kw="">

</figure><figure class="quote" id="q-05d0dc780f" data-kw="">
<blockquote><p>…union has the advantage over division, because:

1. It is a commanded mean tending to edification, which division is not.

2. Division has no less nor fewer inconveniencies following it, nor [is] less destructive to the Church than union in the case supposed; yea, schism is one of the greatest hurts that can come to an orthodox Church, it being next to heresy in doctrine; and therefore no particular evil can be laid in the balance with it.

3. The ills of division are most inevitable, for the ills that follow union, through God’s blessing, may be prevented; it is not impossible, but in the way of division it is, because itself is out of God’s way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, ... (Edinburgh: Higgins, 1659), pt. 4, ch. 7, p. 323</span></figcaption>

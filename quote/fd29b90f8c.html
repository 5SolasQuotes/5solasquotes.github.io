<main class="wrap"><figure class="quote" id="q-fd29b90f8c" data-kw="">
<blockquote><p>Their definition of the Church is essentially unsound, and their account of the marks by which the true Church may be discriminated, is widely different from that of their reforming ancestors.

I have already referred to the admirable definition given in the 19th Article, in which “the visible Church of Christ” is said to be “a congregation of faithful men, in the which the pure Word of God is preached, and the sacraments be duly administered, according to Christ’s ordinance in all those things that of necessity are requisite to the same.”

This truly catholic article can in no way be reconciled with the exclusive pretensions of the Oxford divines, unless on the supposition that the sacraments cannot be duly administered according to Christ’s ordinance, excepting by those who have received Episcopal ordination; and not only so, but that this is “one of those things that of necessity are requisite to the same;” — but how this supposition can consist with that other statement in the 23d Article, “of ministering in the congregation,” which declares that “those we ought to judge lawfully called and sent, which be chosen and called to this work by men who have publick authority given unto them in the congregation, to call and send ministers into the Lord’s vineyard,” remains to be explained.

It is nowhere said in the English Articles that this public authority belongs only to bishops, or that a Christian ministry cannot exist without Episcopal ordination. But contrast with the catholic doctrine of the Article the definition of the Church which is given in the Tracts for the Times. “What do we conceive is meant by it?” (the one Catholic and Apostolic Church.) As people vaguely take it in the present day, it seems only an assertion that there is a number of sincere Christians scattered throughout the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the “Tracts for the Times.”</cite>, (Edinburgh: John Johnstone, 1843), pp 47-48.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>A FAITHFUL and wise servant, or steward, as Luke calls him, watches — that is, cares for — the interests of his Lord. This is one of those striking parabolic pictures for which our Lord’s teachings are distinguished. It is here in the form of a question which each of us must put to his own soul: “Am I this faithful and wise servant or steward?” The main characteristics of such a servant are that he should be faithful and wise. Paul writes, “It is required of a steward that a man be found faithful.” The proof of his faithfulness is his watchfulness. The punishment of a sentinel who sleeps on his post has in all ages been death. An unwatchful steward who allows his master’s goods to be stolen has his portion with the hypocrites; but let us be watchful, faithful, and wise, and we shall hear the Lord saying, ” Blessed is that servant.”

Especially are our Lord’s words addressed to ministers, who are “stewards of the mysteries of God,” which demands fidelity to Christ as servants, fidelity to the people as dispensers of his Word. To be thus faithful we must be full of faith. And then as to the blessedness, the reward of faithful stewardship, we can only say in the words of the beloved John, “It doth not yet appear what we shall be, but we know that when he shall appear we shall be like him: for we shall see him as he is.</p></blockquote>

</figure><figure class="quote" id="q-1c7c640251" data-kw="">
<blockquote><p>Most of these Tracts [for the Times] are of inferior stamp, both in style and substance. Few of them have any pretensions to eloquence, talent, or even learning, yet the results they have already produced upon the Church of England are amazing. They have, to a great extent, changed the complexion of its ministry, and drawn it, as a body, many degrees nearer Rome.

Besides the men whom they can actually claim as their converts or allies, they have infused new vigour into the old high Church anti-evangelical party; and worse than that, have thrown a tinge, if not of their arrogant intolerance, at least of their mysticism, over many a faithful minister of the Gospel of Christ. In short, within a few years, they have effected a greater breach in the Protestant ramparts of England, than either we or our fathers have witnessed for many generations. Rome has much to thank them for. They are Tracts which will never be found in the Index expurgatorius. The Vatican will give them its ready imprimatur.

These Tracts, as our readers are probably aware, were the organs through which the new Oxford sect unfolded their opinions. The most learned and elaborate of the series are from the pen of Dr Pusey, and hence the name of the new creed, Puseyism,—a name, we believe, first fixed upon the party by the Record newspaper. Whether it be aptly chosen or not, we shall not inquire. It designates the sect, as is usually done, by the name of its founder. Our object is rather to sketch the features of the party, and enumerate the articles of their mystic creed.

Puseyism is just diluted Popery. By some it is more and by others less diluted, but still it is Popery. Some years ago, this was not so perceptible, now, it is glaring. In 1833, the language was measured and cautious, now, it is bold and undisguised. All that is essential to Popery will be found in the “Tracts for the Times.” No one who believed the doctrines promulgated in these, could have any difficulty in subscribing the decrees and at tides of the council of Trent. The strange events of the last few months have showed the truth of this. Mr Newman now finds he has thrown a bridge over the gulf between the Churches of England and Rome, along which his followers are passing a little faster than even he seems to relish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Puseyism. Rise and Progress of – Doctrines of – Reflection on, etc. in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

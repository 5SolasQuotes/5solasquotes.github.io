<main class="wrap"><figure class="quote" id="q-4a6e42b8a9" data-kw="">
<blockquote><p>If it is the principal desire of your souls to understand the nature of this [eternal] felicity, and the way that leads to it, search the Scriptures; for, from them alone, we all think, or profess to think, we can have eternal life. I exhort, and beseech you, never to suffer so much as one day to pass, either thro’ lazy negligence, or too much eagerness in inferior studies, without reading some part of the sacred records, with a pious and attentive disposition of mind; still joining with your reading fervent prayer, that you may thereby draw down that divine light, without which spiritual things cannot be read and understood.

But with this light shining upon them, it is not possible to express how much sweeter you will find these inspired writings, than Cicero, Demonsthenes, Homer, Aristotle, and all the other orators, poets, and philosophers. They reason about an imaginary felicity, and every one in his own way advances some precarious and uncertain thoughts upon it; but this book alone shews clearly, and with absolute certainty, what it is, and points out the way that leads to the attainment of it.

This is that which prevailed with St. Augustine to study the Scriptures, and engaged his affection to them. “In Cicero, and Plato, and other such writers,” says he, “I meet with many things wittily said, and things that have a moderate tendency to move the passions; but in none of them do I find these words, Come unto me, all ye that labour, and are heavy laden, and I will give you rest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts</cite>, (London: Plato’s Head, 1763), Lect. III, pp 25-27.</span></figcaption>

<blockquote><p>God hath made us for mutual society; He hath made us so that continual strain on body or mind without recreation is destructive to our health and usefulness. No enlightened conscience will see any inconsistency between healthful and happy recreation, on the one hand, and glorifying God, on the other. These very recreations, and whatsoever he doeth, the enlarged and free-hearted believer can do — to the glory of God.

</figure><figure class="quote" id="q-60b4b080c1" data-kw="">
<blockquote><p>If life be brief and fading, we have all the more need to improve it diligently, and to realize its awful bearing on eternity. Knowing that we are every day advancing nearer to the grave, oh! how important to be daily looking beyond it, and turning our time to a spiritual account. Consider, then, for what ends life was given you, how these ends have already been prosecuted, and to what extent they have yet been attained. Without all controversy, the most urgent business of time is to secure the salvation of the soul — to acquire the knowledge and the favour of God — to learn his truth, and to live to his glory. How much, then, of the time past of your lives has been devoted to spiritual exercises, to prayer, to searching the Holy Scriptures, to the study of your own hearts?

Just let the last year of your existence be the subject of review, and say what were your spiritual views and experience at the time it commenced, and what are they now? Surely some change, either to the better or the worse, must have taken place upon your moral condition, for character is no more stationary than time — and in not improving, it must be degenerating. And it becomes you to ascertain whether you have advanced in knowledge and in grace, or whether you have been losing ground, and pursuing a careless and a backsliding path.

Ah, brethren, it is certain that the progress of the year has brought every one of you nearer to death, and judgment, and eternity — and how near none of us can tell. But are you any nearer heaven any better prepared for the solemn meeting with your God? You are more nearly being done with this world and with all its passing interests. But are your hearts more dead to it in proportion, and more decidedly and earnestly set on the things which arc above? Or, just as your interest in time has been diminishing, has your love for the world been increased?

Oh! inquire — search diligently into your own spiritual condition. Much of your time has been necessarily occupied with the business of the world — and too much of it, perhaps, has been wasted in idleness and in unprofitable amusement, if not in sinful pleasure. But what have you been doing for your souls? Is your peace made with God through Jesus Christ? Have you clearly understood, and cordially embraced, the way of salvation revealed? Are you satisfied that you are in a state of grace — that you have been effectually called and regenerated — and that God has given you the earnest of his Spirit in your heart?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bryden.html">Robert Bryden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fall of the Leaf in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

ts.+But+are+your+hearts+more+dead+to+it+in+proportion%2C+and+more+decidedly+and+earnestly+set+on+the+things+which+arc+above%3F+Or%2C+just+as+your+interest+in+time+has+been+diminishing%2C+has+your+love+for+the+world+been+increased%3F%0A%0AOh%21+inquire+%E2%80%94+search+diligently+into+your+own+spiritual+condition.+Much+of+your+time+has+been+necessarily+occupied+with+the+business+of+the+world+%E2%80%94+and+too+much+of+it%2C+perhaps%2C+has+been+wasted+in+idleness+and+in+unprofitable+amusement%2C+if+not+in+sinful+pleasure.+But+what+have+you+been+doing+for+your+souls%3F+Is+your+peace+made+with+God+through+Jesus+Christ%3F+Have+you+clearly+understood%2C+and+cordially+embraced%2C+the+way+of+salvation+revealed%3F+Are+you+satisfied+that+you+are+in+a+state+of+grace+%E2%80%94+that+you+have+been+effectually+called+and+regenerated+%E2%80%94+and+that+God+has+given+you+the+earnest+of+his+Spirit+in+your+heart%3F%E2%80%9D%0A%0A%E2%80%94+Robert+Bryden%2C+The+Fall+of+the+Leaf+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F60b4b080c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/60b4b080c1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/02/robert-bryden-on-the-urgency-of-salvation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

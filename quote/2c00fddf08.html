<main class="wrap"><figure class="quote" id="q-2c00fddf08" data-kw="">
<blockquote><p>In itself the truth of the gospel always remains pure. As Christ says of himself, that he is the same yesterday, today and forever, so the Word of the gospel also remains the same forever, and not a single element of it falls away or changes, even though heaven and earth should pass away. But this truth does not always remain so pure among human beings, because Satan creeps in sowing his weeds here and there whenever he sees us getting drowsy.

So great is the enemy’s cleverness that he transforms himself into an angel of light and is able to misuse texts of Scripture taken out of their context in order to obscure the truth of the gospel. This is what he was doing in this instance [in Galatians 2:5]. Whatever favorable comments Christ had made about the law were distorted by his ministers the false apostles, with the result that many turned away from Christ and put their trust in legal ceremonies as the way of salvation.

Using similar trickery today he attracts the minds of many by glorifying the saints in heaven. He encourages many people to admire them and is so successful that they disregard the example of those saints and cling to them, claiming them and calling on them as their advocates, worshiping them and believing that they are saved by their merits. In this way he turns religious people into superstitious ones, worshipers of the true God into idolaters, professors of Christ into profaners of Christ’s glory, enemies of the faith in fact, because while they appear to be fighting for the saints in fact they are persecuting the doctrine and faith of those saints in the most determined way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 56-57.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98d5b59ac8" data-kw="">
<blockquote><p>I would have wanted to expound this in a more detailed and careful way, because all the ministers of the church are reminded by Paul’s example what they must do and how they must understand the purpose and goal of their ministry in order to be able to defend their teaching with similar confidence against whoever may come along. The essential point is that we preach God, not people. All human beings are liars, and so whatever they make up in their own mind is uncertain, dubious and unstable. In his own being, God is eternal, and so he always stays the same and does not change.…

Paul challenges the Galatians by appealing to their consciences in a way that those who are sure of themselves often do because they know that their self-confidence will also be perceived by their enemies. What he says here served his purpose very well. Those who want to please people have to say things that are pleasing to them, and so they keep quiet about things that they know others will find offensive. They are therefore forced to hide a great deal and to express many things in ways that are quite different from the way God reveals them in his Word. Paul says that he is not the kind of person who wants to please people, and by using that argument he attacks the false apostles, whom he accuses of pleasing the Jews, who were the most bitter persecutors of the gospel, by adding circumcision and the other ceremonies of the law to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 33.</span></figcaption>

</figure><figure class="quote" id="q-7e9215f958" data-kw="">
<blockquote><p>Neither may they forbid a communion with them in good because all communion in evil is denied us. Neither to hear them preach evil or untruth is to communicate with them in evil, except we yield to, believe, or obey their evil. And so those Scriptures forbidding to hear are to be understood. For Jeremiah did hear the false prophet Hananiah and said ‘amen’ to his prayer (Jer. 28:6). That is, to that good, or to those words of his prayer which might be taken well, he answered ‘so be it, the Lord ratify they words,’ but yet he reproved the evil.</p></blockquote>

<blockquote><p>9. Whether any constitutions may be tolerated in the church which in their nature indeed are not impious, but do not, nevertheless, tend to edification? I answer that if those constitutions which the queen’s majesty wishes to impose upon you are free from any impiety, they are rather to be tolerated than that the churches should be deserted. For if the edifying of the church is the chief thing to be regarded in this matter, we shall do the church a greater injury by deserting it than by wearing the habits [garments]. And where there is no impiety, and the conscience is not wounded, it is proper to submit, even if some degree of bondage be imposed. In the meantime, however, it might be demanded on the other hand, whether the imposition of the habits, as far as it tends to decency and order, may justly come under the denomination of bondage? … 11, 12. The last two questions come more closely to the point. Whether it is more expedient thus to obey the church, or on account of disobedience to be cast out of the ministry? And, whether good pastors may lawfully be removed from the ministry on account of their non-compliance with such ceremonies? I answer, if in these ceremonies there is no superstition, no impiety, but yet they are imposed upon godly pastors, who would rather that they should not be imposed upon them, I will certainly allow, and that most fully, that a burden and bondage is imposed upon them; but I will not allow, and this for most just reasons, that their station or ministry is on that account to be deserted and place given to wolves, as was before observed, or to ministers less qualified than themselves: especially, since there remains the liberty of preaching, and care may be taken that no greater bondage shall be imposed; with many other things of this kind, etc.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“9. Whether any constitutions may be tolerated in the church which in their nature indeed are not impious, but do not, nevertheless, tend to edification? I answer that if those constitutions which the queen’s majesty wishes to impose upon you are free from any impiety, they are rather to be tolerated than that the churches should be deserted. For if the edifying of the church is the chief thing to be regarded in this matter, we shall do the church a greater injury by deserting it than by wearing the habits [garments]. And where there is no impiety, and the conscience is not wounded, it is proper to submit, even if some degree of bondage be imposed. In the meantime, however, it might be demanded on the other hand, whether the imposition of the habits, as far as it tends to decency and order, may justly come under the denomination of bondage? … 11, 12. The last two questions come more closely to the point. Whether it is more expedient thus to obey the church, or on account of disobedience to be cast out of the ministry? And, whether good pastors may lawfully be removed from the ministry on account of their non-compliance with such ceremonies? I answer, if in these ceremonies there is no superstition, no impiety, but yet they are imposed upon godly pastors, who would rather that they should not be imposed upon them, I will certainly allow, and that most fully, that a burden and bondage is imposed upon them; but I will not allow, and this for most just reasons, that their station or ministry is on that account to be deserted and place given to wolves, as was before observed, or to ministers less qualified than themselves: especially, since there remains the liberty of preaching, and care may be taken that no greater bondage shall be imposed; with many other things of this kind, etc.”

— Heinrich Bullinger, The Zurich Letters, … ed. Hastings Robinson for the Parker Society, 2nd ed. (Cambridge Univ. Press, 1846), Letter 104, Bullinger to L. Humphrey &amp; T. Sampson (1566), pp. 222-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C9.+Whether+any+constitutions+may+be+tolerated+in+the+church+which+in+their+nature+indeed+are+not+impious%2C+but+do+not%2C+nevertheless%2C+tend+to+edification%3F+I+answer+that+if+those+constitutions+which+the+queen%E2%80%99s+majesty+wishes+to+impose+upon+you+are+free+from+any+impiety%2C+they+are+rather+to+be+tolerated+than+that+the+churches+should+be+deserted.+For+if+the+edifying+of+the+church+is+the+chief+thing+to+be+regarded+in+this+matter%2C+we+shall+do+the+church+a+greater+injury+by+deserting+it+than+by+wearing+the+habits+%5Bgarments%5D.+And+where+there+is+no+impiety%2C+and+the+conscience+is+not+wounded%2C+it+is+proper+to+submit%2C+even+if+some+degree+of+bondage+be+imposed.+In+the+meantime%2C+however%2C+it+might+be+demanded+on+the+other+hand%2C+whether+the+imposition+of+the+habits%2C+as+far+as+it+tends+to+decency+and+order%2C+may+justly+come+under+the+denomination+of+bondage%3F+%E2%80%A6+11%2C+12.+The+last+two+questions+come+more+closely+to+the+point.+Whether+it+is+more+expedient+thus+to+obey+the+church%2C+or+on+account+of+disobedience+to+be+cast+out+of+the+ministry%3F+And%2C+whether+good+pastors+may+lawfully+be+removed+from+the+ministry+on+account+of+their+non-compliance+with+such+ceremonies%3F+I+answer%2C+if+in+these+ceremonies+there+is+no+superstition%2C+no+impiety%2C+but+yet+they+are+imposed+upon+godly+pastors%2C+who+would+rather+that+they+should+not+be+imposed+upon+them%2C+I+will+certainly+allow%2C+and+that+most+fully%2C+that+a+burden+and+bondage+is+imposed+upon+them%3B+but+I+will+not+allow%2C+and+this+for+most+just+reasons%2C+that+their+station+or+ministry+is+on+that+account+to+be+deserted+and+place+given+to+wolves%2C+as+was+before+observed%2C+or+to+ministers+less+qualified+than+themselves%3A+especially%2C+since+there+remains+the+liberty+of+preaching%2C+and+care+may+be+taken+that+no+greater+bondage+shall+be+imposed%3B+with+many+other+things+of+this+kind%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Zurich+Letters%2C+%E2%80%A6+ed.+Hastings+Robinson+for+the+Parker+Society%2C+2nd+ed.+%28Cambridge+Univ.+Press%2C+1846%29%2C+Letter+104%2C+Bullinger+to+L.+Humphrey+%26+T.+Sampson+%281566%29%2C+pp.+222-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5b9c684e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b5b9c684e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=9.%20Whether%20any%20constitutions%20may%20be,other%20things%20of%20this%20kind%2C%20etc&amp;text=9.%20Whether%20any%20constitutions%20may%20be%20tolerated%20in&amp;text=with%20many%20other%20things%20of%20this%20kind%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

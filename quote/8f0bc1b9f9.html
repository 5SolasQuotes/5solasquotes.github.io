<main class="wrap"><figure class="quote" id="q-8f0bc1b9f9" data-kw="">
<blockquote><p>He did not desire to nourish fights of one faction againt another; he knew that the truth is difficult to come by through polemics; and it was in the truth that he wanted consensus. If the fundamentals of the Christian faith could be agreed upon, then the controversies that were plaguing the Church could be accommodated ‘without ill will [Greek] [fairly, reasonably, equitably] and for the general restoration in every way of concord in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-lugioyo.html">Brian Lugioyo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Martin Bucer’s Doctrine of Justification: Reformation Theology &amp; Early Modern Irenicism (Oxford Univ. Press, 2010) 260 pp. ToC</cite>, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-1f53706f30" data-kw="">
<blockquote><p>5th Consideration. The essential ingredients and reasons of a lawful divorce [from Romanism] are here: 1. We could not lie in one bed with that sometime sister Church of Rome, but our skin behoved to rub upon her botch-boil, and therfore we did separate from nothing but corruption. 2. There was there persecutions, and in that we are patients and ejected rather then departers on foot and horse. 3. A professed dominion over our consciences. 4. Necessity of receiving the mark of the beast, and so the plagues of the beast, to worship images, and the work of men’s hands, a necessity of professing fundamental errors that subvert the foundation of faith, did all necessitate our seperation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbyterie in Scotland… (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’</cite>, p. 123</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-66cd10c262" data-kw="">
<blockquote><p>Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise Concerning Scandal</cite>, pp. 321–22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<main class="wrap"><figure class="quote" id="q-d0c00d6c7c" data-kw="">
<blockquote><p>In these days so-called revivals are spoken of with eagerness, and are resorted to as essential to the progress of religion. But what is their character? Do they tend or are they to increase reverence for the institutions of Christ? The genuine revivals of former times did this. They led to the purging of the Church from the corruption which self-willed had brought in. But these modern revivals live and thrive upon the corruptions of self-will. If you take out of them the methods which man has invented, they die a natural death.

What is urgently needed is a genuine revival by the Spirit of the Living God to sweep away the impudent inventions of human wisdom, to reveal Christ upon His throne in the Church requiring absolute submission to Himself and to His methods, and to awaken the conscience of His people to inquire sorrowfully what gracious institution they have diminished or abolished, and what human institution they have added to His worship, that they may commit neither the one sin not the other any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Authority of Christ over the Individual, the Church, and the Nation</cite>, (Belfast, 1893), p. 15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb80694733" data-kw="">
<blockquote><p>When one examines the Psalms of David with Hymns and Spiritual Songs, which was the end-product of this synodical action, one is immediately struck by the fact that the church was concerned with providing the texts of the psalms but not with preserving the Genevan tunes. All but a few of the psalms were presented in four-line stanzas in short metre, common metre, or long metre. In spite of this radical departure from the continental Reformed practice, the book retained settings of each of the 150 psalms and continued to do so in each succeeding psalter until 1869. In the edition of the hymnal published in that year the psalms had nearly disappeared among the 1007 hymns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/various.html">Various</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘We Used to Sing Only Psalms — What Happened?’</cite>, Happened? 1987, [Norman] Kansfield comments:</span></figcaption>

</figure><figure class="quote" id="q-f61059cb55" data-kw="">
<blockquote><p>If we had the true portrait and very resemblance of our Saviour Christ, taken from his own body, what account ought we to make of it? Had I such a picture, I would keep it as most precious, not only above all other painting, but as one of the most worthy objects of man’s sight: But I would ever make more account of the least Christian than of such a picture: For a Christian represents Christ a great deal better then any paint. A true human body animated not only with a reasonable soul, but also with the spirit of Christ, does it not more resemble Christ than a dead crucifix, or a shape that expresses nothing but some superficial lineaments? I say more: That if one would abuse this picture and idolatrize it, I would do by it as Hezekiah did by the brazen serpent, 2 Kings 18:14. . A notable difference betwixt one of the figures which represented Christ and those that represented the angels, and a consideration upon the matter. In the Old Testament Christ was figured by the image of a serpent set upon a pole, without the Tabernacle, in an open place: But the angels were figured by the faces of men, having wings, placed over the ark itself, in the most holy of Holies. If we consider these figures and their placing, that of Christ’s was greatly inferior unto that of the angels: and if the true image of Christ did consist in outward lineaments, a human shape had been fitter there than that of a serpent. . Whence is it that in the Apocalypse, Jesus Christ (being man) is deciphered only in parabolical figures rather than in the natural form of his own body? We see him appear with seven stars in his right hand, and a two-edged sword going forth of his mouth: We see him clad with a robe dipped in blood, and mounted upon a white horse: We see him in the shape of a lamb slain, having seven eyes and seven horns. But we never see him there, or in any other place of the holy history, in the figure of his own natural visage: To teach us that we ought rather to seek Him in the description of his graces than in the idea of the feature of his visage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>New Observations upon the Decalogue</cite>, … (London, 1652), 2nd Commandment. D’Espagne (1591-1659) was a French, reformed minister who lived for a significant amount of time in London., pp. 55-58</span></figcaption>

</figure><figure class="quote" id="q-142cc5097c" data-kw="">
<blockquote><p>The mortality in our perish is not over yet, though I hoped my child had closed it: but just while I was writing this, I heard of the death of a mother of four small children… carried off at night by a sickness, so far as I could understand, not above two hours long long. Alas! we have provoked our God. By the awful voice of Providence continuing, I was led to Zech. 12:12, ‘And the land shall mourn, every family apart,’ etc., on which I dwelt from 11th March till 20th May; and for some time after, on Ps. 126:5, ‘They that sow in tears, shall reap in joy.’ Upon the former of these I pressed the duty of personal and family fasting, among other things. And this was not without fruit. I knew that some were engaged in these duties; particularly James Biggar’s family, on which the hand of the Lord lay long and heavy, and carried off several of them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Memorial Concerning Personal &amp; Family Fasting &amp; Humiliation on Zech. 12:12</cite>, (†1732) 50 pp. in Works, vol. 11, pp. 343-393 See especially p. 386 ff. | The occasion of this piece (Memoirs, p. 304):</span></figcaption>

<main class="wrap"><figure class="quote" id="q-501c80bd1e" data-kw="">
<blockquote><p>Paybody thinks kneeling in the act of receiving the Communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it, but I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with feare and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637) | pt. 2</cite>, ch. 2, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ccb32f075" data-kw="">
<blockquote><p>VI. If any member of this Church do differ from us about the gesture in the Lord’s Supper (or any such circumstance) we desire them first to come to us and hear our reasons: and if we cannot satisfy them, we will not hinder them from receiving it in any decent gesture they desire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

%20decent%20gesture%20they%20desire." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e13bf9dfd3" data-kw="">
<blockquote><p>Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship [WCF 1.6]; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections; the rending of the garments signified the rending of the heart by sorrow; standing with a religious suspect [respect] to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For ‘which of you’, says our Master, ‘having a servant ploughing, or feeding cattle, will say unto him by and by, when he is come from the field, Go and sit down to meat?’ (Lk. 17:7) All these signs have their significations from nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3</cite>, ch. 5, p. 85</span></figcaption>

</figure><figure class="quote" id="q-559c8504b3" data-kw="">

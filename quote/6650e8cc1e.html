<main class="wrap"><figure class="quote" id="q-6650e8cc1e" data-kw="">
<blockquote><p>Thesis XXI… yet properly the substance itself, or the nature, or the action of a rational creature is not sin, but is infected by sin. Sin, however, is the lawlessness (ἀνομία) itself, that is, the defect and privation of due righteousness in the action itself, or in the rational substance, according to the law of God. Therefore, the apostle rightly did not say that sin is an unjust thing, or an evil action, but ἀνομία, that is, that by which a nature or action is, and is called unjust. So that the nature and the action, which are good in themselves and of which God is the author, must be entirely distinguished from the iniquity, by which they are unjust, and of which God cannot be the author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin (Bern: Fabricius, 1637), p. 9 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-caaf3d004d" data-kw="">
<blockquote><p>But if by ‘the Author of Sin’, is meant the Permitter, or not a Hinderer of Sin; and at the same time, a Disposer of the State of Events, in such a manner, for wise, holy and most excellent ends and purposes, that sin, if it be permitted or not hindered, will most certainly and infallibly follow: I say, if this be all that is meant, by being the Author of Sin, I don’t deny that God is the Author of Sin… And I don’t deny, that God’s being thus the Author of Sin, follows from what I have laid down…</p></blockquote>

</figure><figure class="quote" id="q-5cbf7cd3e2" data-kw="">
<blockquote><p>The will of God is one and the same, but it is distinguished: 1. In respect of the object into voluntatem beneplaciti et placiti. God wills good things and good effects with the will of his good pleasure, approving them first of all, and by Himself, He intends their end and means, Eph. 1:5; but evil and evil effects as they are evil, he nils, disapproves and dislikes. Yet he voluntarily permits evil, and as there is a good end of it, He wills it with the will of his pleasure, for it is good that there should be evil, Ps. 81:12; Acts 14:16; 1 Cor. 10:5. Divines thus distinguish, there is volitio mala et mali [an evil volition and a volition of evil], to will sin to be, is not sinful; it had never come into the world if God had not willed it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, 1654), bk. 2, ch. 7, ‘Of God’s Understanding that He is Omniscient, and of his Will’</cite>, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-f511257db1" data-kw="Permission">
<blockquote><p>God leaves the sinner so far as he sees meet to the swing of his own lusts, and denies him restraining grace. … And when the restraint is taken off the sinner, he runs furiously, to evil. 3. God bounds sin, and restrains men in their sins, as he does the raging sea, allowing it to go so far, but no further.</p></blockquote>

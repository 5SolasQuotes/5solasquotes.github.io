<blockquote><p>IT may be that in the civil part of man’s life where (if the worst come to the worst) it toucheth but the temporal good: this affected winking of the understanding is not altogether hurtful. But in Religion it fareth otherwise, the danger here is dreadful, and the loss beyond recovery: when all here is embarked, and carried away, the body &amp; the soul, not to be no more, which would be at least a forlorn kind of happiness, but to be everlastingly miserable, which is the woeful complement of all unhappiness. …

If by reasons so sensible, that mere sense might comprehend them, it be strongly endeavoured to make the folly of the Turkish Religion [Islam] visible unto a Turk, all this while the Sun is but shewed to a beetle, the Turk sees not a whit: not as if that had impaired his senses, but it being an irksome business to acknowledge the horrid absurdities of his superstition, his passions grow furious, &amp; either besot his understanding, or divert it from a discontenting speculation of such a truth, which being assented to, would force him to pronounce sentence of condemnation upon his country-men, his Sultan, his friends, and kindred. This is so torturing a grief unto him, that nature will not suffer him to believe it, and so it remaineth as incredible unto him, as it is unpleasant, unless God work above nature.

Let us accuse the obstinate Jews of blasphemy, by testimonies of Scripture, we shall stop their mouths, we shall convince them, but yet for all that not convert them. An inconsiderate zeal without knowledge (as the Apostle hath observed it) a superstitious reverence of the traditions of their fathers, a sottish doting upon their own righteousness, a desire of the restoration of their state, of their reestablishment in the land of promise; overspread their eyes, as it were, with a vail, so that they cannot behold the glory of God in the face of Christ; who nullifieth their traditions; teareth from them the false covert of righteousness; who confoundeth their hope of an earthly kingdom, and prosperity; who frustrateth their expectation of a King, a Messias triumphing in secular pomp: who bindeth them to the taking up of his Cross, presenting himself to them crucified, and in his Cross the shame, &amp; horror of the rebellion of their Ancestors.

All this is thus, and more harsh to the natural apprehension of the Jew: and therefore he is no less blockish, and backward to believe it. In as much as he considereth not, neither alloweth the true, &amp; full poise to those means whereby this truth should be proved unto him. It is then from his passion that this his affected, voluntary, and in consequence malicious ignorance proceedeth.</p></blockquote>

<blockquote><p>But this is most certain, that there are yet better things to come then have been since the first calling of the Gentiles. Among other better things to come, the recalling of the Jews is most clearly and plentifully fore told by the Prophets. Many apply sundry prophecies that tend that way, to the delivery of the Jews from the Babylonish Captivity; and others, to the spiritual Israel, consisting of Gentiles.

But assuredly such prophecies as fore-tell the re-uniting of Judah and Ephraim together, have especial reference to the fore-said recalling of the Jews: as that Parable, whereof this our Prophet maketh mention, about joining two sticks, on the one whereof was written, For Judah, and for the children of Israel his companions: and on the other, For Joseph the stick of Ephraim, and for all the house of Israel his companions. That Parable the Prophet thus applieth, I will make them one Nation, and one King shall be King to them all, &amp;c.

But if any shall question this and other prophecies of the ancient Prophets. The Apostle Paul hath so expressly fore-told a recalling of the Jews, and thereupon, a bringing in a fullness of the Gentiles, as no question can be made thereof: and he doth after such a manner express these, as apparently declareth a future glory of the Christian Church. Some particular expressions of his in the 11. to the Romans, are these.

1.Vers. 11. Having propounded this Question concerning the Jews, Have they stumbled, that they should fall? (namely, totally and finally, never to be raised again.) He gives this answer, God forbid. Whereby he implieth, that assuredly they shall be raised again, that is, they shall be made a visible Church of Christ, and submit themselves to his ordinances.

2. Vers. 12. This supposition, If the fall of them be riches of the world, and the diminishing of them the riches of the Gentiles: how much more their fullness? By their fullness, he meaneth their bringing them in to the Church of Christ, consisting of Gentiles, and thereby making that Church full, when both Gentiles and Jews shall be joined together.

3. Vers. 15. This Question (What shall the receiving of them be but life from the dead?) doth take it for grant, that they shall be received, and taken into the Church of Christ; and that this restoration of theirs will be as a new glorious resurrection.

4. Vers. 23. It is said, They also shall be graffed in; namely, into the body of the Christian Church; and a proof thereof is taken from God’s omnipotency, For God is able to graff them in again.

5. Vers. 24. This emphatical Interrogation, How much more shall these, which be the natural branches, he graffed into their own Olive-tree? doth put it out of all question, that the Jews shall again be brought to be of the true Church, which is the Olive-tree here intended.

6. Vers. 25. This restrictive particle, In part (blindness in part is happened unto Israel) doth import, that they shall not be finally blinded, but that at length they shall come to have their eyes so opened, as they shall know and believe in Jesus Christ. This is further manifested by expressing the period of this limitation, thus, Until the fullness of the Gentiles be come in.

7. Verse 26. This general phrase; All Israel shall be saved, sheweth, that there is a time to come, when not only two or three, or a few Jews here and there thorowout the Christian Church (as have been in all ages thereof) but the whole Nation shall be called.

8. Vers. 31. This phrase, Through your mercy they also may obtain mercy; sheweth, that God purposely suffered them sometime to abide in unbelief, that when they should be brought to believe, this grace and honour might appear to arise from God’s mere mercy and free grace. The words following in the next verse doe shew as much: They are these, For God hath concluded them all in unbelief, that he might have mercy upon all.

Thus we see that there is a calling of the Jews to come, and that their calling shall be as a resurrection from the dead, as an incision of many more branches into a glorious tree, that it shall be an universal, conspicuous calling of a whole Nation, wherein the freeness and largeness of God’s grace and mercy shall be evidently manifested. At which time there shall be also such a number of Gentiles brought in, as may well be called the fullness of the Gentiles, vers. 25. This certainly shall be a most glorious condition of the Christian Church, and this is yet to come: therefore God will yet doe better things for us. In expectation whereof we may comfort our selves, though for a while thick clouds of troubles doe over-spread the face of the Church, and somewhat eclipse the glorious brightness thereof.</p></blockquote>

0A8.+Vers.+31.+This+phrase%2C+Through+your+mercy+they+also+may+obtain+mercy%3B+sheweth%2C+that+God+purposely+suffered+them+sometime+to+abide+in+unbelief%2C+that+when+they+should+be+brought+to+believe%2C+this+grace+and+honour+might+appear+to+arise+from+God%E2%80%99s+mere+mercy+and+free+grace.+The+words+following+in+the+next+verse+doe+shew+as+much%3A+They+are+these%2C+For+God+hath+concluded+them+all+in+unbelief%2C+that+he+might+have+mercy+upon+all.%0A%0AThus+we+see+that+there+is+a+calling+of+the+Jews+to+come%2C+and+that+their+calling+shall+be+as+a+resurrection+from+the+dead%2C+as+an+incision+of+many+more+branches+into+a+glorious+tree%2C+that+it+shall+be+an+universal%2C+conspicuous+calling+of+a+whole+Nation%2C+wherein+the+freeness+and+largeness+of+God%E2%80%99s+grace+and+mercy+shall+be+evidently+manifested.+At+which+time+there+shall+be+also+such+a+number+of+Gentiles+brought+in%2C+as+may+well+be+called+the+fullness+of+the+Gentiles%2C+vers.+25.+This+certainly+shall+be+a+most+glorious+condition+of+the+Christian+Church%2C+and+this+is+yet+to+come%3A+therefore+God+will+yet+doe+better+things+for+us.+In+expectation+whereof+we+may+comfort+our+selves%2C+though+for+a+while+thick+clouds+of+troubles+doe+over-spread+the+face+of+the+Church%2C+and+somewhat+eclipse+the+glorious+brightness+thereof.%E2%80%9D%0A%0A%E2%80%94+William+Gouge%2C+The+progress+of+divine+providence%2C+set+out+in+a+sermon+preached+in+the+Abbey+Church+of+Westminster+before+the+House+of+Peers%2C+on+the+24th+of+September%2C+1645.+being+the+day+of+their+monthly+fast%2C+%28London%3A+Joshua+Kirton%2C+1645%29%2C+pp+29-33.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F811810855a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/811810855a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/08/william-gouge-on-the-restoration-of-the-jews/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Galatia is surrounded by Paphlagonia, Bithynia, Cappadocia, Phrygia, Lycaonia and some other places. Here we have set before us an example of how great God’s wrath can be against those who despise his Word. For these regions where Paul sowed the seeds of the gospel spurned the heavenly teaching and, secure in their pleasures, were the first to be handed over to the barbarous yoke of the Turks and oppressed by them.

The Turks trace their origins to Central Asia and Tataristan. They began by invading the neighboring countries, and in 1335 their second sultan, Orhan, occupied Galatia. We see how from small beginnings, like border raids, the kingdom of the Turks grew into a huge empire in the space of two hundred years, and how horribly God punished so many powerful kingdoms and flourishing cities by this barbaric power and might. … We should be warned by such examples, repent and obey the gospel, lest our country should also be struck with a similar anathema.</p></blockquote>

<blockquote><p>Thirdly, it is asked whether the Jews are to be compelled to pay field tithes or the other things that Christians living in houses or dwelling in lands which are within the boundaries of some church are accustomed to pay. It seems that: a. For the Church must by no means be defrauded of its right; but it would be defrauded if Jews were to retain lands and not pay tithes; therefore they are to be compelled to payment. b. Furthermore, it was commanded in the Law of Moses that the sons of Israel should pay tithes to the Levites; similarly it is said in Mal. 3:10: Bring every tithe into my storehouse; and in 2 Chron. 31:5, where it is said that they were offering to God tithes of everything. Since, therefore, Jews are bound to the payment of tithes and are exempt from no privilege, since they are of worse condition and ought to be, by reason of sin, than they were in the time of the Law, they will now be bound to the payment of tithes. c. And if perhaps they should say that they would be bound to render them to their own Levites, against this it is that the Levitical priesthood yielded to the priesthood of Christ Himself, as is had in Heb. 7:12: The priesthood having been transferred, it is necessary that a transfer of the Law also be made. Likewise in Daniel: When the Holy of holies has come. Therefore, Christ having come, your anointing ought to cease; the royal and priestly anointing ought to cease; therefore the payment of tithes was to be made to the priests of the New Law. d. Furthermore, tithes are rendered to God from lands in memory of the benefit of the annual multiplication of fruits; but lands are bounded according to the distinction of churches; therefore by reason of fields or lands tithes are to be paid by all who possess them; therefore Jews, if they possess lands, are bound to pay tithes to the churches. On the contrary:

1. Jews have nothing except from usury in most cases; but from usuries the Church ought to receive nothing; therefore, as it seems, neither ought it to receive anything from lands that have been bought with usuries.

2. Again, Sirach 34:21 says: The oblation of one sacrificing from injustice is defiled; and again: He who offers from the substance of the poor is as one who sacrifices a son in the sight of the father. The Most High does not approve the gifts of the unjust. Since, therefore, these men have nothing except the gifts of the unjust, they ought not to be accepted by the Church, which receives in place of the Most High. [Solution]: To this it must be said that some tithes are predial and some are personal. Predial tithes, however, and whatever churches were wont to receive on account of fields, the churches can ask even from Jews by reason of the fields possessed by them, as is had in the Extra, De decimis, De terris, where it is said that Jews are to be compelled to pay tithes from the lands which they cultivate or to renounce the possessions altogether, lest perhaps the churches be able to be defrauded of their right on that account. Likewise it is had in the Extra, De usuris, Quanto, where it is said that Jews are to be compelled to make satisfaction to the churches for tithes and due oblations, which they are accustomed to receive from Christians from houses and other possessions, so that the churches may be preserved unharmed. Not that anything is to be received from usuries or from things acquired unlawfully, or that oblations are to be received in the church from the Jews themselves, but from things lawfully acquired by them by reason of the houses which they inhabit, lest the church be harmed excessively, if nevertheless the decency of the church in this matter is preserved. But if it should be contrary to decency and the church were not harmed excessively, one should refrain, to avoid scandal. [To the objections]:

1. And by this the contrary objection can be solved, because from usuries, insofar as they are such, the Church cannot ask tithes or oblations. And although lands may have been bought from usuries, nevertheless the Church can ask tithes, because the one who sold could sell only what he had by right, while the thing itself passes with its burden.

2. To the second, however, it must be said that, although oblations or gifts are not acceptable to God, insofar as they are offered by the unjust, nevertheless those things which are owed are acceptable, by reason of the fact that they are owed, if they are paid; whence in one respect they are acceptable, in another respect they are not acceptable; yet the action itself, which proceeds from a perverse will, is not acceptable. But when something is offered from theft or usury, it is not acceptable, because it is not offered from what is one’s own; but its restitution, insofar as it is such, would be acceptable.</p></blockquote>

f+churches%3B+therefore+by+reason+of+fields+or+lands+tithes+are+to+be+paid+by+all+who+possess+them%3B+therefore+Jews%2C+if+they+possess+lands%2C+are+bound+to+pay+tithes+to+the+churches.+On+the+contrary%3A+1.+Jews+have+nothing+except+from+usury+in+most+cases%3B+but+from+usuries+the+Church+ought+to+receive+nothing%3B+therefore%2C+as+it+seems%2C+neither+ought+it+to+receive+anything+from+lands+that+have+been+bought+with+usuries.+2.+Again%2C+Sirach+34%3A21+says%3A+The+oblation+of+one+sacrificing+from+injustice+is+defiled%3B+and+again%3A+He+who+offers+from+the+substance+of+the+poor+is+as+one+who+sacrifices+a+son+in+the+sight+of+the+father.+The+Most+High+does+not+approve+the+gifts+of+the+unjust.+Since%2C+therefore%2C+these+men+have+nothing+except+the+gifts+of+the+unjust%2C+they+ought+not+to+be+accepted+by+the+Church%2C+which+receives+in+place+of+the+Most+High.+%5BSolution%5D%3A+To+this+it+must+be+said+that+some+tithes+are+predial+and+some+are+personal.+Predial+tithes%2C+however%2C+and+whatever+churches+were+wont+to+receive+on+account+of+fields%2C+the+churches+can+ask+even+from+Jews+by+reason+of+the+fields+possessed+by+them%2C+as+is+had+in+the+Extra%2C+De+decimis%2C+De+terris%2C+where+it+is+said+that+Jews+are+to+be+compelled+to+pay+tithes+from+the+lands+which+they+cultivate+or+to+renounce+the+possessions+altogether%2C+lest+perhaps+the+churches+be+able+to+be+defrauded+of+their+right+on+that+account.+Likewise+it+is+had+in+the+Extra%2C+De+usuris%2C+Quanto%2C+where+it+is+said+that+Jews+are+to+be+compelled+to+make+satisfaction+to+the+churches+for+tithes+and+due+oblations%2C+which+they+are+accustomed+to+receive+from+Christians+from+houses+and+other+possessions%2C+so+that+the+churches+may+be+preserved+unharmed.+Not+that+anything+is+to+be+received+from+usuries+or+from+things+acquired+unlawfully%2C+or+that+oblations+are+to+be+received+in+the+church+from+the+Jews+themselves%2C+but+from+things+lawfully+acquired+by+them+by+reason+of+the+houses+which+they+inhabit%2C+lest+the+church+be+harmed+excessively%2C+if+nevertheless+the+decency+of+the+church+in+this+matter+is+preserved.+But+if+it+should+be+contrary+to+decency+and+the+church+were+not+harmed+excessively%2C+one+should+refrain%2C+to+avoid+scandal.+%5BTo+the+objections%5D%3A+1.+And+by+this+the+contrary+objection+can+be+solved%2C+because+from+usuries%2C+insofar+as+they+are+such%2C+the+Church+cannot+ask+tithes+or+oblations.+And+although+lands+may+have+been+bought+from+usuries%2C+nevertheless+the+Church+can+ask+tithes%2C+because+the+one+who+sold+could+sell+only+what+he+had+by+right%2C+while+the+thing+itself+passes+with+its+burden.+2.+To+the+second%2C+however%2C+it+must+be+said+that%2C+although+oblations+or+gifts+are+not+acceptable+to+God%2C+insofar+as+they+are+offered+by+the+unjust%2C+nevertheless+those+things+which+are+owed+are+acceptable%2C+by+reason+of+the+fact+that+they+are+owed%2C+if+they+are+paid%3B+whence+in+one+respect+they+are+acceptable%2C+in+another+respect+they+are+not+acceptable%3B+yet+the+action+itself%2C+which+proceeds+from+a+perverse+will%2C+is+not+acceptable.+But+when+something+is+offered+from+theft+or+usury%2C+it+is+not+acceptable%2C+because+it+is+not+offered+from+what+is+one%E2%80%99s+own%3B+but+its+restitution%2C+insofar+as+it+is+such%2C+would+be+acceptable.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology%2C+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+2%2C+ch.+3%2C+%E2%80%98Whether+Jews+are+to+be+compelled+to+pay+tithes%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F92967667f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/92967667f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Thirdly%2C%20it%20is%20asked%20whether%20the,it%20is%20such%2C%20would%20be%20acceptable&amp;text=Thirdly%2C%20it%20is%20asked%20whether%20the%20Jews%20are&amp;text=insofar%20as%20it%20is%20such%2C%20would%20be%20acceptable" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We grant that these prophecies [Isaiah 59:20; Amos 9:11] contain evident arguments for a future restoration of Israel, if you will acknowledge that which is before clearly proved by the testimonies of the Apostles, and by experience, that is, that they are begun already in part: we grant also, that they have such correspondence with these texts of Esaie and Amos and many more to: but we deny 1. your manner of restoration, and we hold that the spiritual restoration is more glorious for the honour of God and weal of Israel. 2. we deny that the Apostle James alledgeth the prophecy of Amos for such a conversion of the Jews: for he speaks expressly of visiting the gentiles, to take out of them a people unto His name Act. 15.14. and of this visiting he expones the words of Amos and the other Prophets: he speaks not only of Amos, but saith generally, and to this agree the words of the Prophets.

3 we deny that the Apostle Paul alledgeth the prophecy of Elaie to that pretended purpose, for he saith not, and then all Israel shall be saved, but, and so all Israel shall be saved: he shows no order or difference in time, but makes a conclusion out of the former words, where he saith, Blindness in part is happened to Israel, until the fullness of the gentiles shall come in: and then he inferreth, And so all Israel shall be saved: and therefore the conclusion must be exponed according to the proceeding words, that is, all Israel are the called of Israel and of the gentiles: there is a distinction twixt Israel, and all Israel; and all Israel is more than Israel, seeing it includes likewise the faithful gentiles: and in this signification the proof following in the cited testimony must necessarily be understood, and not of a calling of the Jews after the full calling of the gentiles: and far less of that calling, which (he saith) shall perhaps be (not in part but) of all the gentiles that shall be left. Yea these conjectures destroy one another: for if the calling of the Jews shall be after the fullness of the calling of the gentiles, then all the gentiles that shat be left cannot be called through the wonderful deliverance of the Jews.

And this last conjecture destroyeth a many tenet of the Millenaries, who say, that the Jews shall rule over all the nations, and hold them in subjection till the end of the 1000 years, and then these profane nations shall rise again in arms against the Jews. Now seeing betwixt these above named prophecies of Jere. 23. and 31, &amp;c. and these two of Esaie and Amos, there is not any material difference, and no other difference them betwixt a brief intimation and a large explication of the same thing: and seeing these prophecies of Esaie and Amos are to be understood of the Christian Church and estate thereof from the beginning till the end, as the Apostles James and Paul expone them, this conclusion follows, These above named prophecies give no ground for the earthly monarchy of the Jews.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cb6ee3c0c8" data-kw="">
<blockquote><p>There is natural religion. I call it by that name, because something of it is every where, and it is only what remains in that fallen state that man is come into. We will see now what this is made up of, what are those principles that are so deeply engraven in the hearts of men, that they do fill all the inhabitants of the earth with some form of religion.

Wherever travellers have come, and observations have been made, among the most savage people, there is something left of some notions of religion; forms of it, though very sorry ones they be, it is acknowledged. You had need consider this, for this kind of religion is in every one of your hearts; but unless the grace of God, and the light of the gospel expel it, and plant something better in its room, you are lost for ever. Natural religion has in it these particulars.

1st, Some notion of the being of a God, that there is a God, and that this God is to be worshipped, and served, and obeyed. All the world own something of this. The invisible things of him from the creation of the world ore clearly seen, being understood by the things that are made, even his eternal power and Godhead: so that they are without excuse, Rom. i. 20. There is nothing more invisible than the God-head; eternal power is also invisible: but, says the apostle, the very Heathens have these things made visible by the mighty works of God; and their natural reason can instruct them so far, that the rearing up of this glorious canopy of the heavens, the frame of the earth, the making of these great seas, and the making of so many beautiful creatures upon the earth, must be the work of some great, powerful, wise agent.

Atheism is against nature, and is no where found, but where the principles of natural religion are extinguished by the power of the devil, and the justice of God by men’s abuse of revealed religion. When men come to struggle with the right way of the knowledge of God revealed in the word, and shut their eyes against that, God suffers them to be blinded, as to those things that the very Heathens have more light in. I believe that there are more Atheists in England, than among all the Pagan nations through the whole earth. A place where the gospel light doth shine, and men rebel against it, is the only place where such monsters are bred.

2dly, In natural religion, there is always some distinction made about good and evil, some light about good and evil, and some conscience there is exercised about these. Conscience is as natural to us, as understanding, and will, and memory are. It is as natural to us to have a conscience, as it is to be men and women, or to have reason; for conscience is nothing else but the exercise of reason about the greatest concernments; it is only a man’s judging himself, according as he stands before a greater and supreme judge. Therefore the apostle speaks thus of the Heathen: These having not the law, are a law unto themselves: which shew, says he, the work of the law written in their hearts, Rom. ii. 14, 15. Pray observe, one of the grand promises of the new covenant, is God’s writing his laws in our hearts. Here the apostle speaks of the law of nature, as written in the heart of a Heathen, their conscience in the mean while, says he, accusing, or else excusing one another, according to the light that they receive.

3dly, There is amongst all natural men, and a natural religion, some notion of forgiveness, and pardoning mercy and goodness in God. Amidst all their darkness about God, yet they do know, that it is a great excellency, and all excellencies they will ascribe to God, to be good and gracious, and ready to forgive. As there is a conscience of sin amongst all men, so they do give this praise to God, that he is a God that can forgive; thereupon they address to him, in their several ways, for it. All the Heathen have some sense of judgment to come; and from these principles all the fabrics of natural religion are reared up in the world. Now, where this natural religion comes to be polished by the light of the word, it will look a great deal better, and a great many are deceived by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Profession of Our Faith, Recommended in Several Sermons (1718) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 3: 213-15.</cite></span></figcaption>

<blockquote><p>…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.</p></blockquote>

ffects+of+His+power+in+a+measure+to+them+all%E2%80%A6%E2%80%9D+%28Summa%2C+pt.+3%2C+q.+52%2C+art.+2%2C+reply+to+obj.+1%29+He+did+believe%2C+though+that+Christ+delivered+the+Old+Testament+saints+in+the+Limbo+of+the+Fathers+to+Heaven+%28Summa%2C+pt.+3%2C+q.+52%2C+art.+5%29.+The+Reformed%2C+contra+the+Romanists%2C+believed%2C+%E2%80%98The+Old+Testament+Saints+went+Directly+to+Heaven+upon+Death%E2%80%99+and+denied+any+%E2%80%98Limbo+of+the+Fathers%E2%80%99.+.+Hell+Agreement+Eternal+Punishment+Thomas%2C+Summa%2C+suppl.%2C+q.+99+For+the+Reformed%3A+%E2%80%98Hell%E2%80%99.+.+The+Damned+shall+Sinfully+Blaspheme+Leigh%3A+%E2%80%9CIts+a+question+among+the+Schoolmen%2C+Whether+the+damned+blaspheme%3F+Aquinas+thinks+it+credible+that+after+the+resurrection+they+shall+vocally+blaspheme%2C+as+the+saints+shall+vocally+praise+God%3A+And+some+say%2C+%E2%80%98So+long+as+the+damned+blaspheme+God%2C+in+this+they+sin%2C+because+they+are+bound+to+an+eternal+law.%E2%80%99+After+this+life+the+demerit+of+sin+ceases%2C+%5Bas%5D+you+shall+give+an+account+for+the+things+done+in+the+body%2C+2+Cor.+5%3A10.+The+soul+sins+after%2C+but+shall+not+be+judged+for+those+sins%3B+as+in+Heaven+good+actions+%E2%80%98pertain+to+the+reward+of+blessedness%2C%E2%80%99+so+in+hell+evil+actions+%E2%80%98pertain+to+the+penalty+of+damnation%2C%E2%80%99+says+Aquinas+in+the+same+place.%E2%80%9D+%28System+of+Divinity%2C+p.+344%29+.+Disagreements+No+Fourfold+Hell+Turretin+notes+how+%E2%80%9Cthe+papists+make+a+fourfold+hell%2C%E2%80%9D+including+%281%29+hell+proper%2C+%282%29+purgatory%2C+%283%29+the+eternal+limbo+of+infants+with+the+suffering%2C+not+of+sense%2C+but+of+loss%2C+and+%284%29+the+limbo+of+the+Old+Testament+fathers%2C+temporally+suffering+loss+only%2C+till+Christ+delivered+them+by+his+death%2C+citing+Thomas+and+others%2C+and+argues+at+length+specifically+against+the+limbo+of+the+fathers.+%282.257%29+.+Nature+of+Hell-Fire+is+Not+Clearly+Determinable+Thomas%3A+%E2%80%9C%E2%80%A6they+will+be+punished+in+a+physical+fire.%E2%80%9D+%28Sentences%2C+bk.+4%2C+dist.+44%2C+q.+3%2C+art.+2%2C+quaestiuncula+2%29+Voet%3A+%E2%80%9CWhether+true+fire+is+given+in+Hell%2C+or+whether+it+is+only+metaphorical%3F+It+is+not+said+and+it+is+permitted+to+be+inquired+into.+Whether+it+is+corporal+or+rather+spiritual%3F+The+question+is+inept.+Whether+it+is+of+the+same+species+with+our+fire%3F+The+question+is+curious%E2%80%A6+Is+it+an+error+of+the+Faith+to+suppose+an+incorporeal+and+immaterial+infernal+fire%3F+The+question+is+absurd.%E2%80%9D+%28Syllabus%2C+sect.+2%2C+tract+6%2C+title+6%2C+subtitle+2%2C+%E2%80%98Of+Infernal+Fire%E2%80%99%29+.+Heaven+Agreements+Saints+do+Not+See+All+Things+on+Earth+through+God+Turretin+contends+against%2C+%E2%80%9Cas+the+papists+wish%E2%80%A6+the+imaginary+mirror+of+the+Trinity%2C+which+they+feign+%28as+if+saints%2C+seeing+all+things+in+the+essence+of+God+saw+all+things+done+here%29+%5Bto+support+the+intercession+of+the+saints%5D%E2%80%A6+It+displeased+not+a+few+of+the+distinguished+papists%3A+Lombard%2C+Thomas+Aquinas+%5BSumma%2C+suppl.+92%2C+art.+3%5D%E2%80%A6%E2%80%9D+%282.43%29+.+Saints+will+See+Punishment+of+the+Damned+Leigh%3A+%E2%80%9CAquinas+has+this+question%2C+Whether+the+blessed+which+are+in+the+Fatherland+see+the+punishment+of+the+damned%3F+and+resolves+they+shall%2C+because+it+makes+to+the+perfection+of+their+blessedness%2C+%E2%80%98Opposites+placed+next+to+each+other+shine+forth+more+brightly.%E2%80%99+They+shall+perfectly+see+the+punishment+of+the+wicked%2C+that+their+blessedness+may+the+more+content+them+and+they+may+give+more+abundant+thanks+to+God.%E2%80%9D+%28System+of+Divinity%2C+p.+872%29+.+The+Heaven+of+God%E2%80%99s+Throne+Room+will+Not+be+Renovated+with+Fire+Thomas%3A+%E2%80%9C%E2%80%A6the+higher+heavens+will+not+be+cleansed+by+that+fire%E2%80%A6+The+cleansing+of+the+world+will+be+for+the+purpose+of+removing+from+bodies+the+disposition+contrary+to+the+perfection+of+glory%E2%80%A6+Peter+explains+himself+to+which+heavens+he+refers%E2%80%A6+%E2%80%98the+heavens+first%2C+and+the+earth+through+water+perished%2C+which+now+by+the+same+word+are+kept+in+store%2C+reserved+unto+fire+unto+the+day+of+judgment%E2%80%99+%282+Pet+5%3A5%E2%80%937%29%E2%80%A6+Nor+did+the+empyrean+heaven+contract+any+stain%E2%80%A6%E2%80%9D+%28Summa%2C+suppl.%2C+q.+74%2C+art.+4%29+For+the+Reformed%3A+%E2%80%98On+the+Renovation%2C+New+Heavens+%26+Earth%E2%80%99.+.+Mixed+Deification+Thomas+affirmed+a+kind+of+deification+of+heavenly+saints+with+respect+to+the+light+of+glory+and+the+beatific+vision.+Yet+for+Thomas%2C+%E2%80%9Cthe+light+of+glory%2C+like+the+habit+of+grace%2C+is+something+created.+So+in+either+state%2C+pre-+or+post-mortem%2C+deification+is+something+created.%E2%80%9D+%28p.+32%29+This+is+in+contrast+to+deification+being+grounded+in+uncreated+grace%2C+per+the+Eastern+Orthodox%2C+which+entails+the+host+of+problems+often+associated+with+the+term.+See+Richard+Cross%2C+%E2%80%98Deification+in+Aquinas%E2%80%99.+Yet+many+of+the+Reformed+were+hesitant+or+contrary+to+accepting+Thomas%E2%80%99s+exact+method+and+paradigm+of+how+saints+see+God.+See+on+the+Beatific+Vision+below.+Yet%2C+Carl+Mosser+has+found+the+concept+and%2For+terminology+of+deification%2C+in+protestant+senses%2C+in+Martin+Luther%2C+Ulrich+Zwingli%2C+Martin+Bucer%2C+Henry+Bullinger%2C+John+Calvin%2C+Richard+Hooker+and+Jonathan+Edwards%3A+%E2%80%98Deification%3A+a+Truly+Ecumenical+Concept%E2%80%99+and+%E2%80%98Recovering+the+Reformation%E2%80%99s+Ecumenical+Vision+of+Redemption+as+Deification+and+Beatific+Vision%E2%80%99.+Using+the+term+of+deification+for+growing+more+and+more+into+the+image+of+God%2C+through+beholding+Him%2C+for+all+eternity%2C+is+not+to+no+purpose.+2+Pet.+1%3A4+says+%E2%80%9Cthat+by+these%2C%E2%80%9D+including+godliness%2C+all+graces+and+the+promises+of+God%2C+including+that+of+glorification%2C+%E2%80%9Cye+might+be+partakers+of+the+divine+nature%E2%80%9D.+Ps.+17%3A15%3A+%E2%80%9CAs+for+me%2C+I+will+behold+thy+face+in+righteousness%3A+I+shall+be+satisfied%2C+wh

<main class="wrap"><figure class="quote" id="q-0b27aedd2f" data-kw="">
<blockquote><p>’Salute one another with a holy kiss’: That is, with a kiss of peace and brotherhood, with which believers according to the use of those countries and times, used to salute on another. And it is called holy because it must be given, not out of carnal but spiritual love, and without hypocrisy, Gen. 29:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dutch-annotations.html">Dutch Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, on Rom., 16:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aaf93bec2a" data-kw="">
<blockquote><p>How shall we hold and keep fast the letter of Scripture, when there are so many Greek copies of the New Testament? and these diverse from one another? Yes, well: for though there are many received copies of the New Testament; yet there is not material difference between them. The four Evangelists do vary in the relation of the same thing; yet because there is no contradiction or material variation, we do adhere to all of them, and deny none. In the times of the Jews before Christ, they had but one original of the Old Testament; yet that has several readings: there is a marginal reading and a line reading, and they differ no less than eight hundred times the one from the other; yet the Jews did adhere to both and denied neither; Why? Because there was no material difference. And so now, though there be many copies of the New Testament; yet seeing that there is no material difference between them, we may adhere to all:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture Light the Most Sure Light</cite>, (1656), sermon 3 on 2 Pet. 1:19, p. 47</span></figcaption>

</figure><figure class="quote" id="q-4c57a2c187" data-kw="">
<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.”

</figure><figure class="quote" id="q-dbc05a79dd" data-kw="">
<blockquote><p>In the second member [of the verse] he betrays an evil conscience, or, at least, he shows that he handled rather a private business than any public cause, for he complains that the apostles will cause the priests and the scribes to be hated for the death of Christ. … Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests… But the chief priest does not consider what is his duty towards God and the Church; he abuses his authority tyrannously, as if the same were not under any laws, as the Pope deals with us at this day; for seeing that he takes to himself an unbridled authority and government, he fears not to condemn us for schismatics, so soon as he sees us refuse his decrees; for he catches at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludes that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ. Now, forasmuch as he does manifestly play the minister of Satan, he borrows authority, without shame and color, of the name of Christ; yea, the very form of speech which the chief priest uses doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the Word of God, dare grant liberty to themselves to attempt whatsoever pleases them. With a commandment (says he) have we commanded. Whence comes such strait rigor, save only because they think that all that must be received without exception which they shall command?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 5:28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

bc05a79dd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=In%20the%20second%20member%20%5Bof%20the,without%20exception%20which%20they%20shall%20command&amp;text=In%20the%20second%20member%20%5Bof%20the%20verse%5D%20he&amp;text=be%20received%20without%20exception%20which%20they%20shall%20command" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ecbb59759f" data-kw="">
<blockquote><p>…in making orders and ceremonies of the Church it is not lawful to do what men list, but they are bound to follow the general rules of the Scripture that are given to be the square whereby those should be squared out. Which rules I will here set down as those which I would have as well all orders and ceremonies of the church framed by as by the which I wil be content that all those orders and ceremonies which are now in question whether they be good and convenient or no should be tried and examined by. And they are those rules which Paul gave in such cases as are not particularly mentioned of in scripture. The first, that they offend not any, especially the Church of God. (1 Cor. 10:32) The second is (that which you cite also out of Paul) that all be done in order and comliness. (1 Cor. 14:40) The third, that all be done to edifying. (1 Cor. 14:26) The last, that they be done to the glory of God. Rom. 6:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift against the Admonition to the Parliament</cite>, (1573), Answer to, pp. 20-22, p. 27</span></figcaption>

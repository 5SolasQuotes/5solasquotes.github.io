<main class="wrap"><figure class="quote" id="q-5477c0d736" data-kw="">
<blockquote><p>That as the Jews were wont to shut up the solemnity of the Passover by singing some of David’s Psalms; so our Saviour, after the celebration of the Sacrament of his body and blood, went out with his disciples to the mount of Olives, […] having sung the Hymn, which Hymn (say the best expositors) was the same that the Jews did ordinarily sing after the Passover, and is called by them the great Hallel, which, as Paulus Brugensis says, consisted of six Psalms, from Ps. 113 to Ps. 118, and he adds (verisimile est hos à Domino decantatos) it is most like that these were sung by our Saviour. And Drusius says, hunc hymnum hodieque canunt in nocte Paschatis; The Jews sing this Hymn in the evening of the Passover to this day. The learned Scaliger having largely described the forms and rites of celebrating the Passover, concludes thus; This was the true rite of celebrating the Passover in the times of the Messiah…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation Concerning the Frequent Use of our Lord’s Prayer in the public Worship of God and a view of what hath been said by Mr</cite>, [John] Owen concerning that subject (London, 1658), pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-17d2591676" data-kw="">
<blockquote><p>And the best recreation to a spiritual mind, when it is weary of worldly employments, is to walk into Christ’s garden, and there, by reading and meditating, singing of Psalms (Col. 3:16) and holy conference, you may solace yourself with the sweet comforts of the holy Spirit, and may work your heart to joy in God, even to joy in the holy Ghost, and to a delight in the Commandments and Word of God.</p></blockquote>

%20the%20Commandments%20and%20Word%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ada1c8474e" data-kw="">
<blockquote><p>The matter is here three ways to be considered: First, in the ground, foundation, or authority of the Psalms we use, viz. they must be the word of Christ, that is contained in the Scriptures. Secondly in the kinds of Psalms, there are many sort of Psalms in Scripture. The Psalms of Moses, David, Solomon, and other prophets: but all are here referred to three heads; they are either Psalms, specially so called, or hymns, or songs. Great ado there is among interpreters to find a difference in these: some would have Psalms to be the songs of men, and Hymns of angels: some think they differ, especially in the manner of music. Some are sung by voice, some played upon instruments; but the plausiblest opinion is not to distinguish them by the persons that use them, or by the kind of music, but by the matter, and so they say Psalms contain exhortation to manners or holy life. Hymns contain praises to God in the commemoration of his benefits. Songs contain doctrine of the chief good, or man’s eternal felicity. But I think there needs not any curious distinction: it may suffice us that there is variety of Psalms in Scripture and God allows us the use of every kind. Thirdly, the property of the Psalms, they are Spiritual, both because they are indited by the spirit, and because they make us more spiritual in the due use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (London, 1615), commentary on ch. 3, v. 16, p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

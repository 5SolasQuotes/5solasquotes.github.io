<main class="wrap"><figure class="quote" id="q-8501f6da9f" data-kw="">
<blockquote><p>The sense is, not that judgment shall not pass against him but by such a number of witnesses, or that the evidence upon his trial shall consist of such a number; for this is no other than what ought to be in the case of a private member, and of every man, according to Deuteronomy 19:15. But the sense is, that the affair of an elder shall not be put upon a trial, much less sentence pass, until it has been privately proved against him, by proper testimonies, beyond all exception; only in such a case, should a church admit a charge against its elder. The reason of this rule is, because of his high office and the honour of the church, which is concerned in his, as well as of religion; for it carries in it some degree of scandal for such a person to be charged, even though he may be cleared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Timothy</cite>, 5:19</span></figcaption>

</figure><figure class="quote" id="q-3143010d1a" data-kw="">
<blockquote><p>17. It having been the custom of the Church in the apostles’ days, to have ordinarily many officers in a Church, and the private part of the ministerial duty being so exceeding great and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases where more may be had, we therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls and greatness of the Word; And if for want [lack] of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober, orthodox, judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning and less able to publicly teach, and who may leave public speaking to him that is more able and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653) | The Propositions agreed on by the Associated Ministers of the County of Worcester and some Adjacent Parts, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-aca6ea0189" data-kw="">
<blockquote><p>Yea in favor of lay-elders he [Hugo Grotius] asserts (having argued them not to be of divine institution, yet):

1. That they may be lawfully instituted by sovereigns, or by the Church on their permission.

2. That it may be proved by Scripture that this institution is not displeasing to God.

3. That there are examples in pious antiquity, either of this same way, or one very near it.

4. That it is no contemptible benefit that by these elders may be received. But these [are] to exercise their office with several cautions:

1. Not claiming institution by divine precept.

2. Not usurping any of the power of the keys, nor of excommunication, further than excommunication belongs to the people (executively).

3. That the men be not unmeet.

4. Exercising no external jurisdiction but by public law.

5. Standing as mutable. Thus far Grotius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653) | ‘Objections Answered’</span></figcaption>

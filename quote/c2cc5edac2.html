<main class="wrap"><figure class="quote" id="q-c2cc5edac2" data-kw="">
<blockquote><p>Without all question the Models of some eminent persons Devotion, may be a singular help to others Devotion. Every one that hath this divine fire of Devotion in his soul, cannot always readily bring fit fuel to make it flame forth. But when fuel is brought by others, it will soon take, and quickly flame out.

Neither is this (as some too weakly, though very violently cavil) to stint the spirit of supplication. For the work of the Spirit consists not so much in the words and phrases whereby the matter of Devotion is expressed, as in the intention of the heart, and in the entireness and earnestness of the affection, wherein the very form, soul and life of true Devotion consisteth.

Otherwise, the spirit of all GOD’S people in all public Liturgies, and forms of prayer would be stinted: yea by this reason the spirit of every one that joineth with another in prayer (except his spirit only who conceiveth and uttereth the prayer) would be stinted. And if so, then away with public assemblies for prayer: away with family meetings to call upon GOD: away with all meetings of two or three together in CHRIST’S name, notwithstanding CHRIST’S promise of being in the midst of them (Mat. 18. 20.) But rather away with such proud and preposterous conceits, which clean cross the tenor of sacred Scripture, and commendable custom of GOD’S Church in all ages.

Sacred Scripture records sundry prayers conceived and uttered by one, but assented to by sundry others, whereby they became also the prayers of those others. The 102. Psalm bears this title, A Prayer for the afflicted when he is overwhelmed and poureth out his complaint before the LORD. This title apparently sheweth that the Prophet who first penned this Psalm, did it in the persons and for the use of any poor distressed servant of GOD.

So as we thereby are taught what to pray when our sins lie heavy upon us, or when we are in any other distress. It is expressly said that John taught his Disciples to pray, Luke 11. 1. This questionless was done by prescribing unto them a form of prayer. Whereupon when a Disciple of CHRIST said unto him, LORD teach us to pray as John also taught his Disciples, he said unto them, when ye pray, say Our Father which art in Heaven, &amp;c.

As John had prescribed a form to his Disciples, so CHRIST doth to his: and so teacheth them to pray, as John did his. Sundry forms of prayers were by the Ancient Fathers composed for the Churches in their days. In like manner have all Christian Churches in succeeding ages, had their particular forms. Never had any age, or country more pious, pithy forms then ours, some for public, others for private use, among which the form here tendered unto thee hath its excellency. As it is lawful to have such help, so may such an help be very useful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Robert Bolton, Certain devout prayers of Mr. Bolton upon solemn occasions</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83b8c0a43c" data-kw="">
<blockquote><p>And what can train us to likeness to Christ so much as prayers in which all thought of self being cast aside we pour out our hearts in manifestation of our love to our brethren, and in longings for the extension of the Redeemer’s Kingdom in the world. And surely the higher advances any makes in the spiritual life, the more he rises above self, the larger space will requests for others occupy in his devotions.</p></blockquote>

</figure><figure class="quote" id="q-9a0d8367ed" data-kw="will be done">
<blockquote><p>The third petition is: that God&#x27;s will may be done on earth as in heaven [Matt. 6:10]. Even though it depends upon his Kingdom and cannot be separated from it, still it is with reason added separately on account of our ignorance, which does not easily or immediately comprehend what it means that “God reigns in the world.” It will therefore not be absurd to take it as an explanation that God will be King in the world when all submit to his will. … We are therefore bidden to desire that, just as in heaven nothing is done apart from God&#x27;s good pleasure, and the angels dwell together in all peace and uprightness, the earth be in like manner subject to such a rule, with all arrogance and wickedness brought to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.43</span></figcaption>

<blockquote><p>Nay, here idolatry is manifest; since the worship of adoration and religious invocation is due to God alone (Ps. 50:15; Matt. 4:10; Rom. 10:17), nor can the calves of the lips be offered to the Saints, nor the incense of prayers burned to them, without their thereby being reckoned omniscient, omnipotent, omnipresent, and immense — able in a moment to be present to all who invoke them, in various places, on various matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Concise Refutation of Papism</cite>, p. 17</span></figcaption>

</figure><figure class="quote" id="q-cc49d79512" data-kw="">
<blockquote><p>Furthermore, some do place before the word, “Amen,” immediately after the rehearsal of these words, “But deliver us from evil,” “For thine is the kingdom, and the power, and the glory, for ever. Amen.” But Erasmus Roterod., in his annotations upon the new Testament, witnesseth, that those words are not found in any old Latin copy; but are found added in all Greek copies, howbeit not expounded of any of the interpreters, but of Chrysostom only and his follower Theophylact; and that therefore they seemed unto him to be added unto the Lord’s Prayer, as some have added these unto the Psalms: “Glory be to the Father, to the Son,” &amp;c. The same Erasmus immediately adjouneth: “Wherefore there is no cause why Laurentius Valla should stomach the matter, that a good part of the Lord’s Prayer was curtailed. Their rashness was rather to be reproved, who feared not to so heavenly a prayer to patch their own toys. For I may call them toys, in comparison of that which God hath taught whatsoever hath proceeded from men; especially if that which men have added and put to, be compared with Christ the author of the prayer.”

Neither did Erasmus only doubt of this addition; for the Spanish copy, which they call Codex Complutensis, hath: “That it seemeth more credible, that these words are not a part of the Lord’s prayer, as a member of the whole; but put in through the fault of some certain writers, or printer.” In the same book is by and bye added: “And albeit St Chrysostom in his Commentaries upon Matt., Homil. xx., do expound these words, as if they were of the text; yet it is conjectured to be more true, that even in his time the first originals in his treatise were corrupted: whereupon none of the Latins, no, not of the ancient interpreters or entreaters thereof, is read to have made any mention of these words.” And surely this is truly said. For the most diligent interpreters, which have taken in hand each of them word for word to expound the Lord’s Prayer, as were St Cyprian, Hierome, and Augustine, of this addition have not spoken so much as one word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), iv, 219-20.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Furthermore, some do place before the word, “Amen,” immediately after the rehearsal of these words, “But deliver us from evil,” “For thine is the kingdom, and the power, and the glory, for ever. Amen.” But Erasmus Roterod., in his annotations upon the new Testament, witnesseth, that those words are not found in any old Latin copy; but are found added in all Greek copies, howbeit not expounded of any of the interpreters, but of Chrysostom only and his follower Theophylact; and that therefore they seemed unto him to be added unto the Lord’s Prayer, as some have added these unto the Psalms: “Glory be to the Father, to the Son,” &amp;c. The same Erasmus immediately adjouneth: “Wherefore there is no cause why Laurentius Valla should stomach the matter, that a good part of the Lord’s Prayer was curtailed. Their rashness was rather to be reproved, who feared not to so heavenly a prayer to patch their own toys. For I may call them toys, in comparison of that which God hath taught whatsoever hath proceeded from men; especially if that which men have added and put to, be compared with Christ the author of the prayer.”

— Heinrich Bullinger, Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), iv, 219-20.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFurthermore%2C+some+do+place+before+the+word%2C+%E2%80%9CAmen%2C%E2%80%9D+immediately+after+the+rehearsal+of+these+words%2C+%E2%80%9CBut+deliver+us+from+evil%2C%E2%80%9D+%E2%80%9CFor+thine+is+the+kingdom%2C+and+the+power%2C+and+the+glory%2C+for+ever.+Amen.%E2%80%9D+But+Erasmus+Roterod.%2C+in+his+annotations+upon+the+new+Testament%2C+witnesseth%2C+that+those+words+are+not+found+in+any+old+Latin+copy%3B+but+are+found+added+in+all+Greek+copies%2C+howbeit+not+expounded+of+any+of+the+interpreters%2C+but+of+Chrysostom+only+and+his+follower+Theophylact%3B+and+that+therefore+they+seemed+unto+him+to+be+added+unto+the+Lord%E2%80%99s+Prayer%2C+as+some+have+added+these+unto+the+Psalms%3A+%E2%80%9CGlory+be+to+the+Father%2C+to+the+Son%2C%E2%80%9D+%26c.+The+same+Erasmus+immediately+adjouneth%3A+%E2%80%9CWherefore+there+is+no+cause+why+Laurentius+Valla+should+stomach+the+matter%2C+that+a+good+part+of+the+Lord%E2%80%99s+Prayer+was+curtailed.+Their+rashness+was+rather+to+be+reproved%2C+who+feared+not+to+so+heavenly+a+prayer+to+patch+their+own+toys.+For+I+may+call+them+toys%2C+in+comparison+of+that+which+God+hath+taught+whatsoever+hath+proceeded+from+men%3B+especially+if+that+which+men+have+added+and+put+to%2C+be+compared+with+Christ+the+author+of+the+prayer.%E2%80%9D%0A%0ANeither+did+Erasmus+only+doubt+of+this+addition%3B+for+the+Spanish+copy%2C+which+they+call+Codex+Complutensis%2C+hath%3A+%E2%80%9CThat+it+seemeth+more+credible%2C+that+these+words+are+not+a+part+of+the+Lord%E2%80%99s+prayer%2C+as+a+member+of+the+whole%3B+but+put+in+through+the+fault+of+some+certain+writers%2C+or+printer.%E2%80%9D+In+the+same+book+is+by+and+bye+added%3A+%E2%80%9CAnd+albeit+St+Chrysostom+in+his+Commentaries+upon+Matt.%2C+Homil.+xx.%2C+do+expound+these+words%2C+as+if+they+were+of+the+text%3B+yet+it+is+conjectured+to+be+more+true%2C+that+even+in+his+time+the+first+originals+in+his+treatise+were+corrupted%3A+whereupon+none+of+the+Latins%2C+no%2C+not+of+the+ancient+interpreters+or+entreaters+thereof%2C+is+read+to+have+made+any+mention+of+these+words.%E2%80%9D+And+surely+this+is+truly+said.+For+the+most+diligent+interpreters%2C+which+have+taken+in+hand+each+of+them+word+for+word+to+expound+the+Lord%E2%80%99s+Prayer%2C+as+were+St+Cyprian%2C+Hierome%2C+and+Augustine%2C+of+this+addition+have+not+spoken+so+much+as+one+word.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+godly+and+learned+sermons+divided+into+the+five+decades+containing+the+chief+and+principal+points+of+Christian+religion%2C+ed.+Thomas+Harding+%281849-52+Parker+edn%3B+4+vols%2C+Grand+Rapids%2C+2004%29%2C+iv%2C+219-20.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcc49d79512.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cc49d79512.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/05/27/henry-bullinger-on-the-conclusion-of-the-lords-prayer-2/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

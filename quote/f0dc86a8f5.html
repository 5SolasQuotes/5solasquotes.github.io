<main class="wrap"><figure class="quote" id="q-f0dc86a8f5" data-kw="mediatorial office degrees">
<blockquote><p>The mediatorial office of Christ is all that Christ ought to do from his mission and calling towards an offended God and offending men, reconciling and again uniting them to each other. And instituted with how many degrees? Predestination, mission, and calling.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2626e5a58d" data-kw="">
<blockquote><p>OH eternal and most merciful God: whose word is the light unto our steps, and the lantern unto our feet. We most humbly beseech thee, to illuminate our minds, that we may understand the mysteries contained in thy holy law. And into the same self thing that we godly understand, we may be virtuously transformed, so that of no part, we offend thy high majesty, through our saviour Jesus Christ. So be it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A lesson of the Incarnation of Christ that he took, his humanity in and of the Blessed Virgin made the twentieth day of June by John Hopper, 1549</cite>, (London: Edward Whitechurch, 1549), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4233a79978" data-kw="">
<blockquote><p>There follows in the prayer, Thy kingdom come. We ask that the kingdom of God may be set forth to us, even as we also ask that His name may be sanctified in us. For when does God not reign, or when does that begin with Him which both always has been, and never ceases to be? We pray that our kingdom, which has been promised us by God, may come, which was acquired by the blood and passion of Christ; that we who first are His subjects in the world, may hereafter reign with Christ when He reigns, as He Himself promises and says, “Come, ye blessed of my Father, receive the kingdom which has been prepared for you from the beginning of the world.” Christ Himself, dearest brethren, however, may be the kingdom of God, whom we day by day desire to come, whose advent we crave to be quickly manifested to us.

For since He is Himself the Resurrection, since in Him we rise again, so also the kingdom of God may be understood to be Himself, since in Him we shall reign. But we do well in seeking the kingdom of God, that is, the heavenly kingdom, because there is also an earthly kingdom. But he who has already renounced the world, is moreover greater than its honours and its kingdom. And therefore he who dedicates himself to God and Christ, desires not earthly, but heavenly kingdoms.

But there is need of continual prayer and supplication, that we fall not away from the heavenly kingdom, as the Jews, to whom this promise had first been given, fell away; even as the Lord sets forth and proves: “Many,” says He, “shall come from the east and from the west, and shall recline with Abraham, and Isaac, and Jacob in the kingdom of heaven. But the children of the kingdom shall be cast out into outer darkness: there shall be weeping and gnashing of teeth.” He shows that the Jews were previously children of the kingdom, so long as they continued also to be children of God; but after the name of Father ceased to be recognised among them, the kingdom also ceased; and therefore we Christians, who in our prayer begin to call God our Father, pray also that God’s kingdom may come to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Lord’s Prayer</cite>, (c. 252), 13 in Ante-Nicene Fathers, 5: 450-51.</span></figcaption>

</figure><figure class="quote" id="q-2f1681c7f0" data-kw="">
<blockquote><p>The fast is indicted [called and set] eight days before, and the causes laid open for preparing of the people for humiliation (as Joel 2:1-3; Isa. 22:12,13). We have no anniversary [annual] and set fasts or feasts either, because God Himself by his judgment imminent, or already inflicted, or by permitting his people to follow their own ways, calls to fasting and mourning (Isa. 22:13, Joel 2:1-6, etc.), and so by his mercies and wonderful deliverances calls to extraordinary joy of thanksgiving (Ps. 118:24). The doctrine of the Law is preached (as Joel 2 and Isa 58), and the fast observed with abstinence from meat and drink, and carnal and ordinary pleasures (Joel 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), Chapter 20, Article 7</span></figcaption>

</figure><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9 / on invocation</span></figcaption>

</figure><figure class="quote" id="q-1e7e9d5d74" data-kw="">
<blockquote><p>Wherefore, our Heavenly Master also says: “Watch and pray, that ye enter not into temptation.” Let every man, therefore, when fighting against his own concupiscence, pray that he enter not into temptation; that is, that he be not drawn aside and enticed by it. But he does not enter into temptation if he conquers his evil concupiscence by good will. And yet the determination of the human will is insufficient, unless the Lord grant it victory in answer to prayer that it enter not into temptation. What, indeed, affords clearer evidence of the grace of God than the acceptance of prayer in any petition?

If our Saviour had only said, “Watch that ye enter not into temptation,” He would appear to have done nothing further than admonish man’s will; but since He added the words, “and pray,” He showed that God helps us not to enter into temptation. It is to the free will of man that the words are addressed: “My son, remove not thyself from the chastening of the Lord.” And the Lord said: “I have prayed for thee, Peter, that thy faith fail not.” So that a man is assisted by grace, in order that his will may not be uselessly commanded.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Wherefore, our Heavenly Master also says: “Watch and pray, that ye enter not into temptation.” Let every man, therefore, when fighting against his own concupiscence, pray that he enter not into temptation; that is, that he be not drawn aside and enticed by it. But he does not enter into temptation if he conquers his evil concupiscence by good will. And yet the determination of the human will is insufficient, unless the Lord grant it victory in answer to prayer that it enter not into temptation. What, indeed, affords clearer evidence of the grace of God than the acceptance of prayer in any petition?

— Augustine of Hippo, A Treatise of Grace and Free Will, (c. 427), 9 in Nicene and Post-Nicene Fathers 1, 5: 447.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWherefore%2C+our+Heavenly+Master+also+says%3A+%E2%80%9CWatch+and+pray%2C+that+ye+enter+not+into+temptation.%E2%80%9D+Let+every+man%2C+therefore%2C+when+fighting+against+his+own+concupiscence%2C+pray+that+he+enter+not+into+temptation%3B+that+is%2C+that+he+be+not+drawn+aside+and+enticed+by+it.+But+he+does+not+enter+into+temptation+if+he+conquers+his+evil+concupiscence+by+good+will.+And+yet+the+determination+of+the+human+will+is+insufficient%2C+unless+the+Lord+grant+it+victory+in+answer+to+prayer+that+it+enter+not+into+temptation.+What%2C+indeed%2C+affords+clearer+evidence+of+the+grace+of+God+than+the+acceptance+of+prayer+in+any+petition%3F%0A%0AIf+our+Saviour+had+only+said%2C+%E2%80%9CWatch+that+ye+enter+not+into+temptation%2C%E2%80%9D+He+would+appear+to+have+done+nothing+further+than+admonish+man%E2%80%99s+will%3B+but+since+He+added+the+words%2C+%E2%80%9Cand+pray%2C%E2%80%9D+He+showed+that+God+helps+us+not+to+enter+into+temptation.+It+is+to+the+free+will+of+man+that+the+words+are+addressed%3A+%E2%80%9CMy+son%2C+remove+not+thyself+from+the+chastening+of+the+Lord.%E2%80%9D+And+the+Lord+said%3A+%E2%80%9CI+have+prayed+for+thee%2C+Peter%2C+that+thy+faith+fail+not.%E2%80%9D+So+that+a+man+is+assisted+by+grace%2C+in+order+that+his+will+may+not+be+uselessly+commanded.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+A+Treatise+of+Grace+and+Free+Will%2C+%28c.+427%29%2C+9+in+Nicene+and+Post-Nicene+Fathers+1%2C+5%3A+447.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e7e9d5d74.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e7e9d5d74.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/22/augustine-of-hippo-on-prayer-and-the-fight-against-concupiscence/" rel="noopener" target="_blank">Read it online

<main class="wrap"><figure class="quote" id="q-20ee32ad01" data-kw="">
<blockquote><p>XLVIII. Secondly, we more especially remark, that when the law was given from Mount Sinai or Horeb there was a repetition of the covenant of works. For those tremendous signs of thunders and lightnings, of an earthquake, a thick smoke and black darkness, were adapted to strike Israel with great terror. And the setting bounds and limits round about the mount, whereby the Israelites were kept at a distance from the presence of God, upbraided them with that separation which sin had made between God and them. “In a word, whatever we read, Exod. 19 (says Calvin, on Heb. 12:19) is intended to inform the people, that God then ascended his tribunal, and manifested himself as an impartial Judge. If an innocent animal happened to approach, he commanded it to be thrust through with a dart; how much sorer punishment were sinners liable to, who were conscious of their sins, nay, and knew themselves indicted by the law, as guilty of eternal death.” See the same author on Exod. 19:1, 16. And the apostle in this matter, Heb. 12:18–22, sets Mount Sinai in opposition to Mount Sion, the terrors of the law to the sweetness of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, (4.4.48), trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 188.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<blockquote><p>Man, on the other hand, whose nature was to be a mean between the angelic and bestial, [God] created in such sort, that if he remained in subjection to His Creator as his rightful Lord, and piously kept His commandments, he should pass into the company of the angels; and obtain, without the intervention of death, a blessed and endless immortality.</p></blockquote>

</figure><figure class="quote" id="q-ad2829052d" data-kw="death tree of life">
<blockquote><p>A law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life and from the threatening of death (which by reason of contraries had the implied promise of life).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.7</span></figcaption>

</figure><figure class="quote" id="q-02254d7d48" data-kw="">
<blockquote><p>1. The law of Moses was, in the first place, a re-enactment of the covenant of works. A covenant is simply a promise suspended upon a condition. The covenant of works, therefore, is nothing more than the promise of life suspended on the condition of perfect obedience. The phrase is used as a concise and convenient expression of the eternal principles of justice on which God deals with rational creatures, and which underlie all dispensations, the Adamic, Abrahamic, Mosaic and Christian. Our Lord said to the lawyer who asked what he should do to inherit eternal life, “What is written in the law? How readest thou? And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thy-self. And he said unto him, Thou hast answered right, this do and thou shalt live,” Luke 10:26–28. This is the covenant of works. It is an immutable principle that where there is no sin there is no condemnation, and where there is sin there is death. This is all that those who reject the gospel have to fall back upon. It is this principle which is rendered so prominent in the Mosaic economy as to give it its character of law. Viewed under this aspect it is the ministration of condemnation and death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, (New York: A. C. Armstrong &amp; Son, 1891), 57–58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

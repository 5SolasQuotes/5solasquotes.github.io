<main class="wrap"><figure class="quote" id="q-2bd04d99d3" data-kw="">
<blockquote><p>Richard Cameron […] slew the lion of absolute despotism, when he nailed his discourse of war against Charles II to the cross of Sanquhar. Now, are we to suppose that, when Richard Cameron, Patrick Foreman, David Hackstoun, and others, renounced their allegiance to Charles II, that they incurred thereby the displeasure of the Almighty? Ah, it is only the heartless sycophant who could say so?

No doubt, Charles II was a “power,” and a “power of God” too, but so is an earth-quake, so is the cholera-morbus, so was the sweating sickness, and so was the black death! Charles II was “a power” existing in the providence of God; but to say that he was a power of God for good to man, would be to attempt to make vice virtue, and to snatch the sceptre from Jehovah!

The persecuted children of Scotia not only “foiled a tyrant’s and a bigot’s bloody laws,” but they also – and they the first of any people on earth – clearly stated the true bounds and limits of civil allegiance. Tyranny has its basis upon sycophancy, whereas freedom dwells with heroism; hence it is that I cherish the conviction that the sound of Richard Cameron’s hammer, as he nailed his declaration to the market cross of Sanquhar, will reverberate throughout the nations, till on every national banner shall be found inscribed that noble motto of the Cameron Men, “HE THAT RULETH OVER MEN MUST BE JUST, RULING IN THE FEAR OF GOD.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in</cite>, Ireland. To which is appended the Cameronian Dream (Belfast, 1879), pp 39-40.</span></figcaption>

<blockquote><p>But I answer, [1.] the king as king has dominion-civil of places and times, as places and times, but not of places as sacred in use, and of times as sacred and religious: for his power in Church matters being accumulative, not privative [depriving], he cannot take away a house dedicated to God’s service no more than he can take away maintenance allotted by public authority upon hospitals, schools, doctors and pastors. God has here a sort of propriety of houses and goods as men have. Places as sacred-abused are subject to regal power; he may inhibit conventions of heretics.

2. The apostles might preach in the Temple, though civil authority forbid them.

3. Kings are as much lords of places as sacred and public, as they have a dominion of civil places, in respect the king may by coactive [coercive] power hinder that false and heretical doctrine be preached, either in public, or private places, for this he ought to do as a preserver of both Tables [of the Law] and a bearer of the sword for the good of religion; and if they may command pure doctrine to be preached, and sound discipline to be exercised, they may command the same to be done in public places.</p></blockquote>

<blockquote><p>2. What they affirm, that brothels are to be tolerated lest married women should be violated, is contrary to the Divine command, Deut. xxiii. 17, There shall be no whore of the daughters of Israel, &amp;c. It is contrary to Apostolic doctrine; which would have matrimony, not fornication, to be the remedy for lust. It is contrary to the received opinion of Theologians, who deny that a compensation of sins is to be admitted: Harlots, therefore, are not to be prostituted lest married women should be violated. Lastly, it is contrary to the duty of the Christian magistrate; who is bound, as much as in him lies, to take care that all may live piously, soberly, and righteously: Rom. xiii. He ought not, therefore, to suffer those who openly profess whoredom.

3. With respect to the remark of Augustine, Take away harlots from human society and you will disturb all things by lust; we answer, it is not of much weight: because he wrote those books De ordine, when he was a young man, and not then baptized, as is evident from the first of his Retractations. We also oppose to it the more serious of the Fathers. Lactantius, Instit. lib. 6, cap. 23, says, The devil set up brothels, and published the shame of unhappy women. Clemens, Paedag. 3. cap. 3, Brothels are trophies of public intemperance. Tertullian, de cultu faeminar. calls harlots the most unhappy victims of public lusts. But now how disgraceful to the Christian magistrate, if he defend the inventions of the devil, if he suffer that victims be publicly immolated to lust, if, in short, he do not demolish the trophies of intemperance. Besides, I say, that however diligently the magistrate may endeavour to repress fornication, yet he can never wholly remove from human society harlots or fornicators, no more than he can remove thieves or murderers. Therefore the Papists may dismiss this fear.

Lastly we must also add; that this remedy (the toleration of brothels) is worse than even the disease which is dreaded. For although adultery be in itself worse than fornication; yet it is worse for a whole city to be continually polluted by brothels, than if it should sometimes happen that certain wedded women be violated. But even this is by no means to be conceded; that the honour and chastity of married women can be better preserved by the permission of fornication than by the severe punishment of it. For by impunity, and the continued habit of sinning we become more daring; and if we have served an apprenticeship to lust among harlots, becoming anon veterans, we the more confidently assault wedded females.

This point acquires support from the fact, that we scarcely ever have either read or heard of married women having been defiled by any other than by those who were before accustomed to practices with harlots: so admirably does the toleration of brothels conduce to the protection of the chastity of married women! — And these remarks may suffice against those who either deny that fornication is to be accounted a sin, or say that it is to be tolerated for the sake of avoiding adultery. We have dwelt the longer in opposing fornication, because it has obtained its patrons.</p></blockquote>

3. With respect to the remark of Augustine, Take away harlots from human society and you will disturb all things by lust; we answer, it is not of much weight: because he wrote those books De ordine, when he was a young man, and not then baptized, as is evident from the first of his Retractations. We also oppose to it the more serious of the Fathers. Lactantius, Instit. lib. 6, cap. 23, says, The devil set up brothels, and published the shame of unhappy women. Clemens, Paedag. 3. cap. 3, Brothels are trophies of public intemperance. Tertullian, de cultu faeminar. calls harlots the most unhappy victims of public lusts. But now how disgraceful to the Christian magistrate, if he defend the inventions of the devil, if he suffer that victims be publicly immolated to lust, if, in short, he do not demolish the trophies of intemperance. Besides, I say, that however diligently the magistrate may endeavour to repress fornication, yet he can never wholly remove from human society harlots or fornicators, no more than he can remove thieves or murderers. Therefore the Papists may dismiss this fear.

Lastly we must also add; that this remedy (the toleration of brothels) is worse than even the disease which is dreaded. For although adultery be in itself worse than fornication; yet it is worse for a whole city to be continually polluted by brothels, than if it should sometimes happen that certain wedded women be violated. But even this is by no means to be conceded; that the honour and chastity of married women can be better preserved by the permission of fornication than by the severe punishment of it. For by impunity, and the continued habit of sinning we become more daring; and if we have served an apprenticeship to lust among harlots, becoming anon veterans, we the more confidently assault wedded females.

This point acquires support from the fact, that we scarcely ever have either read or heard of married women having been defiled by any other than by those who were before accustomed to practices with harlots: so admirably does the toleration of brothels conduce to the protection of the chastity of married women! — And these remarks may suffice against those who either deny that fornication is to be accounted a sin, or say that it is to be tolerated for the sake of avoiding adultery. We have dwelt the longer in opposing fornication, because it has obtained its patrons.”

— John Davenant, An Exposition of the Epistle of St. Paul to the Colossians, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 45-46.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+What+they+affirm%2C+that+brothels+are+to+be+tolerated+lest+married+women+should+be+violated%2C+is+contrary+to+the+Divine+command%2C+Deut.+xxiii.+17%2C+There+shall+be+no+whore+of+the+daughters+of+Israel%2C+%26c.+It+is+contrary+to+Apostolic+doctrine%3B+which+would+have+matrimony%2C+not+fornication%2C+to+be+the+remedy+for+lust.+It+is+contrary+to+the+received+opinion+of+Theologians%2C+who+deny+that+a+compensation+of+sins+is+to+be+admitted%3A+Harlots%2C+therefore%2C+are+not+to+be+prostituted+lest+married+women+should+be+violated.+Lastly%2C+it+is+contrary+to+the+duty+of+the+Christian+magistrate%3B+who+is+bound%2C+as+much+as+in+him+lies%2C+to+take+care+that+all+may+live+piously%2C+soberly%2C+and+righteously%3A+Rom.+xiii.+He+ought+not%2C+therefore%2C+to+suffer+those+who+openly+profess+whoredom.%0A%0A3.+With+respect+to+the+remark+of+Augustine%2C+Take+away+harlots+from+human+society+and+you+will+disturb+all+things+by+lust%3B+we+answer%2C+it+is+not+of+much+weight%3A+because+he+wrote+those+books+De+ordine%2C+when+he+was+a+young+man%2C+and+not+then+baptized%2C+as+is+evident+from+the+first+of+his+Retractations.+We+also+oppose+to+it+the+more+serious+of+the+Fathers.+Lactantius%2C+Instit.+lib.+6%2C+cap.+23%2C+says%2C+The+devil+set+up+brothels%2C+and+published+the+shame+of+unhappy+women.+Clemens%2C+Paedag.+3.+cap.+3%2C+Brothels+are+trophies+of+public+intemperance.+Tertullian%2C+de+cultu+faeminar.+calls+harlots+the+most+unhappy+victims+of+public+lusts.+But+now+how+disgraceful+to+the+Christian+magistrate%2C+if+he+defend+the+inventions+of+the+devil%2C+if+he+suffer+that+victims+be+publicly+immolated+to+lust%2C+if%2C+in+short%2C+he+do+not+demolish+the+trophies+of+intemperance.+Besides%2C+I+say%2C+that+however+diligently+the+magistrate+may+endeavour+to+repress+fornication%2C+yet+he+can+never+wholly+remove+from+human+society+harlots+or+fornicators%2C+no+more+than+he+can+remove+thieves+or+murderers.+Therefore+the+Papists+may+dismiss+this+fear.%0A%0ALastly+we+must+also+add%3B+that+this+remedy+%28the+toleration+of+brothels%29+is+worse+than+even+the+disease+which+is+dreaded.+For+although+adultery+be+in+itself+worse+than+fornication%3B+yet+it+is+worse+for+a+whole+city+to+be+continually+polluted+by+brothels%2C+than+if+it+should+sometimes+happen+that+certain+wedded+women+be+violated.+But+even+this+is+by+no+means+to+be+conceded%3B+that+the+honour+and+chastity+of+married+women+can+be+better+preserved+by+the+permission+of+fornication+than+by+the+severe+punishment+of+it.+For+by+impunity%2C+and+the+continued+habit+of+sinning+we+become+more+daring%3B+and+if+we+have+served+an+apprenticeship+to+lust+among+harlots%2C+becoming+anon+veterans%2C+we+the+more+confidently+assault+wedded+females.%0A%0AThis+point+acquires+support+from+the+fact%2C+that+we+scarcely+ever+have+either+read+or+heard+of+married+women+having+been+defiled+by+any+other+than+by+those+who+were+before+accustomed+to+practices+with+harlots%3A+so+admirably+does+the+toleration+of+brothels+conduce+to+the+protection+of+the+chastity+of+married+women%21+%E2%80%94+And+these+remarks+may+suffice+against+those+who+either+deny+that+fornication+is+to+be+accounted+a+sin%2C+or+say+that+it+is+to+be+tolerated+for+the+sake+of+avoiding+adultery.+We+have+dwelt+the+longer+in+opposing+fornication%2C+because+it+has+obtained+its+patrons.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1832%29%2C+2%3A+45-46.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0cfa6f347b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0cfa6f347b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpr

<blockquote><p>The effects of mercy are either special: proper to the elect, as flowing from special grace, Rom. 9:23. The elect are called (and by effectual calling so made) vessels of mercy. Or common, extended to those who are not elected, Lk. 6:35-36. Unto the beasts of the field, Ps. 104:27; Yea, over all his works, Ps. 145:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, ... (London: 1654), ch. 1, Of the Divine Essence, p. 14</span></figcaption>

</figure><figure class="quote" id="q-8619ed2862" data-kw="">
<blockquote><p>The Word must be preached to all without exception; the Gospel must be offered to converted and unconverted. Some object to this as if it would make the offer of grace too general. But the Lord Jesus has commanded it. ‘Many are called, but few are chosen.’ (Matt. 22:14; 20:16) ‘Go ye therefore, and teach all nations, baptizing them in the Name of the Father, and of the Son, and of the Holy Ghost.’ (Matt. 28:19) ‘Go ye into all the world, and preach the Gospel to every creature.’ (Mark 16:15) … Indeed, God not only calls to all who hear His Word, but He also communicates various gifts to them. Speaking of persons who do not come to conversion, the apostle says that they were once enlightened, have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come. (Heb. 6:4,5) God sometimes grants to reprobates special gifts, also relating to His Word, giving a certain pleasure in it, which nevertheless does not lead to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-h-kersten.html">G.H. Kersten</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 2, p. 369</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-cd5dc750db" data-kw="">
<blockquote><p>It may be observed, in passing, that there is a double sense in which we may speak of Christ’s purchase; First, Strictly and properly, when we regard Him as purchasing men; and secondly, More improperly, when we consider Him as purchasing benefits for men. This last view [the second], as we have hinted, is rather figurative and metaphorical than real and literal; for the idea of his purchasing benefits from the Father for mankind, must ever be understood in consistency with the Father’s sovereignty, and his pre-existing love to the children of men. The Father is not induced or persuaded to bestow benefits on men by a price paid to Him; but being antecedently full of compassion to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Completeness &amp; Extent of the Atonement</cite>, (1845), pp. 4-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

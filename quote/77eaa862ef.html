<blockquote><p>[Scotus:] ‘That the effect is not right is caused now not because of the prior cause, which on its own part would cause rightly if the second cause were to cause; but because of the defect of the secondary cause, which in its power has the option of co-causing with the first cause or not cocausing. And if it does not co-cause with the first cause as it is bound to, there is no rectitude in the common effect of both.&#x27;</p></blockquote>

<blockquote><p>31. VI. God’s causal relations to his creatures are in general those named by St. Paul, Romans 11:36: “Of him, and through him, and to him, are all things.” And he is: 1. The first efficient, 2. The supreme dirigent, 3. The ultimate final cause of all things. 32. God’s efficiency is terminated: 1. On the things in their being, 2. In their action and operation. 1. And in the first respect he is the cause: 1. Of their existing essence, 2. Of their order, 3. Of their goodness or perfection. And so he is, 1. The Creator and conserver, 2. The ordinator, 3. The benefactor of all the world. And in the second respect (as to action) he is: 1. The actor or motor of all things (by his active power); 2. The governor of all (according to their several natures) (by his wisdom); 3. The perfecter of all things in their attaining or fruition of their proper end (by his goodness). 33. VII. As to man in special, God is now fundamentally related to him as his Creator, his Redeemer, and his Regenerator or Sanctifier, eminently ascribed distinctly to the Father, Son, and Holy Spirit. From this flows natura, medela, salus [nature, healing, salvation], or nature, redeeming grace, and renewing grace (holiness and glory), that is, love begun here and perfected in heaven. 34. VIII. From creation there results a threefold moral right and relation of God to man: 1. He is our absolute owner or Lord to dispose of us and act us by his power. 2. He is our supreme rector, morally to rule us as intellectual free agents, eminently by his wisdom. 3. He is our lover and ultimate end, as he is goodness and love itself. To love him and be loved by him perfectly forever, being amantissimus et amabilissimus [most loving and most lovable] in his goodness. 35. He that leaves out any one of these relations of God to man (to be our owner, ruler, and lover and end) leaves out that which is essential to our God, as the word is relatively used in the precepts and promises of Holy Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), sect. 3, ‘The several inadequate conceptions which in order make up our knowledge of God’, p. 5</span></figcaption>

</figure><figure class="quote" id="q-78f1af44c6" data-kw="">
<blockquote><p>First: how God is not a cause when He permits. For if God were to give his efficacious grace to the will, it would not sin. I respond that this doubt is common to all and looks elsewhere. Briefly, however, I say that for us, who hold every sin to be an effect of reprobation [this is hard language which the Reformed often spoke against]… the response is at hand: namely, that God is not bound to exhibit efficacious grace, since through original sin its privation has been incurred [the Reformed agree with this]; and therefore the permission is just. [The Reformed generally disagree:] He does give sufficient grace, with which man can and without which he cannot avoid sin. And in that permission God foresees that the man will sin, as we have often taught with Scotus.</p></blockquote>

e-secondary-causation-occasionalism/#:~:text=First%3A%20how%20God%20is%20not%20a,we%20have%20often%20taught%20with%20Scotus&amp;text=First%3A%20how%20God%20is%20not%20a%20cause%20when&amp;text=sin%2C%20as%20we%20have%20often%20taught%20with%20Scotus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-203bb6b5d2" data-kw="Author of sin">
<blockquote><p>Although the premotion of God is extended to evil actions, it does not on that account make God guilty of the fault or the author of sin. It only pertains to actions inasmuch as they are material and entitative (entitative), not however as they are moral, i.e., to the substance of the act, but not to its wickedness. … The magistrate is the cause of the death inflicted on the guilty person by the executioner, but is not the cause of the cruelty exhibited in that execution; the harp player is the cause of the sound, but not of the dissonance arising from the strings; and he who drives a lame horse is the cause of the motion, but not the lameness.</p></blockquote>

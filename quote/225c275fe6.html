<main class="wrap"><figure class="quote" id="q-225c275fe6" data-kw="">
<blockquote><p>The visible Church of Christ is a congregation of faithful men, in the which the pure Word of God is preached, and the Sacraments be duly ministered according to Christ&#x27;s ordinance in all those things that of necessity are requisite to the same. As the Church of Jerusalem, Alexandria, and Antioch, have erred; so also the Church of Rome hath erred, not only in their living and manner of Ceremonies, but also in matters of Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 19</span></figcaption>

<blockquote><p>The Lord recognises nothing as his own, save when his word is heard and religiously observed. … If that temple which seemed consecrated for the perpetual habitation of God, could be abandoned by God and become profane, the Romanists have no ground to pretend that God is so bound to persons or places, and fixed to external observances, that he must remain with those who have only the name and semblance of a Church.</p></blockquote>

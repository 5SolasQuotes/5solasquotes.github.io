<main class="wrap"><figure class="quote" id="q-24772af8a1" data-kw="">
<blockquote><p>…he [the magistrate] bears the sword against all evil doers, Rom. 13:1, [on the other-hand] the magistrate as the magistrate does only command well-doing in order to praise and a good name, or temporal reward amongst men, Rom. 13:3, “Do that which is good and thou shalt have praise of the power;” 1 Tim. 5:17; Mt. 10:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), p. 548</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“…he [the magistrate] bears the sword against all evil doers, Rom. 13:1, [on the other-hand] the magistrate as the magistrate does only command well-doing in order to praise and a good name, or temporal reward amongst men, Rom. 13:3, “Do that which is good and thou shalt have praise of the power;” 1 Tim. 5:17; Mt. 10:10.”

— Samuel Rutherford, The Divine Right of Church Government… (London, 1646), p. 548">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6he+%5Bthe+magistrate%5D+bears+the+sword+against+all+evil+doers%2C+Rom.+13%3A1%2C+%5Bon+the+other-hand%5D+the+magistrate+as+the+magistrate+does+only+command+well-doing+in+order+to+praise+and+a+good+name%2C+or+temporal+reward+amongst+men%2C+Rom.+13%3A3%2C+%E2%80%9CDo+that+which+is+good+and+thou+shalt+have+praise+of+the+power%3B%E2%80%9D+1+Tim.+5%3A17%3B+Mt.+10%3A10.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%28London%2C+1646%29%2C+p.+548&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F24772af8a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/24772af8a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-libertarianism/#:~:text=he%20%5Bthe%20magistrate%5D%20bears%20the%20sword,power%3B%E2%80%9D%201%20Tim.%205%3A17%3B%20Mt.%2010%3A10&amp;text=he%20%5Bthe%20magistrate%5D%20bears%20the%20sword%20against%20all&amp;text=of%20the%20power%3B%E2%80%9D%201%20Tim.%205%3A17%3B%20Mt.%2010%3A10" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b8baa4b2c" data-kw="">
<blockquote><p>Our gracious prince, who now by the blessing of God happily reigns over us, will not (we assure ourselves) be offended at us for having regard to our consciences [though it goes against his command], God’s own deputies placed in our souls, so far, that for all the world we dare not hazard their peace and quiet by doing anything with their repugnance and aversation;</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-1c39de9c72" data-kw="">
<blockquote><p>5. They may and ought to restrain idle and vagabound travelling of such suspected persons [spiritual seducers], without representing of their necessary businesse to some, appointed for that effect, in which case their doing hurt by such a voyage, might be prevented, and they have a pass.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (1659), pt. 3, ch. 14, p. 255</span></figcaption>

</figure><figure class="quote" id="q-04471d2fc1" data-kw="">
<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics… If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23, p. 220</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-07ff5cfcf8" data-kw="">
<blockquote><p>…what would he say of those Scottish protestants imprisoned in the Castle of Scherisburgh in France, who being commanded by the captain to come to the mass, answered that to do anything that was against their conscience they would not, neither for him nor yet for the king (History of the Church of Scotland, bk. 1, p. 181)? If he approve this answer of theirs, he must allow us to say that we will do nothing which is against our consciences. We submit ourselves and all which we have to the king and to inferior governors we render all due subjection, which we owe to them. But no mortal man has domination over our consciences, which are subject to one only Lawgiver and ruled by his Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 4, p. 49</span></figcaption>

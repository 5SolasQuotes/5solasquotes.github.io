<main class="wrap"><figure class="quote" id="q-dd92410d7d" data-kw="">
<blockquote><p>A third Method [used by the enemies of the church] is, the flattering and corrupting of those, whose power may be serviceable to them in this World. If they can but gain the shields of the earth to defend their cause, they are ready to think themselves invincible, and the true Christian interest irrecoverable.

Therefore this hath always been one of the main Policies of the Antichristian party, to insinuate into their favour, who might frown the Servants of God into Destruction, and Creep into their Bosoms, who could give them the power of stinging and tormenting others.

What hath been more visibly pursued and aimed at in the World, than to bring the honour and strength of the Nations into Babylon, and to place those Men as Horns upon the Beast, who should be the Guardians and Protectors of the Church? And certainly no way of accomplishing their grand Design hath seemed more probable than this; yet even this hath not prospered.

Some have escaped their strong delusions, whose authority and influence would have tended to promote them: These Vipers have been shaken off from those hands, where they hoped to fasten; and the Pillars upon which some Kingdoms stand, do still support the Cause of the Reformation, though great endeavours have been used to pluck them away from it. God hath not suffered the Emissaries of Rome to find Reception every where, and there are places which have lodged them once, but now know them to more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-cruso.html">Timothy Cruso</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mighty Wonders of a Merciful Providence. In a Sermon Preached on January 31, 1688/89. Being the Day of Public Thanksgiving to God for the Great Deliverance of this Kingdom by His Highness the Prince of Orange</cite>, (London: Thomas Cockerill, 1689), pp 7-8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c7a8de1d6" data-kw="">
<blockquote><p>L… The indispensible Law of Nature obliges every man according to his place and calling, his ability, and his opportunities, to do his best to propagate Christ’s gospel and to save mens souls, as much and more than to feed men’s bodies and save their lives… And we did not receive this calling to be altered or forborn at the will of man, but to be performed according to the Word of God: Men being not the makers of the office, nor of God’s Law under which we execute it, nor the donors or limiters of the power, but only… the governors of us in the exercise of it, according to God’s laws, by which they may punish us for mal-administration, but cannot dissolve the Law’s obligation to those that are indeed commanded by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 6, pp. 84-85</span></figcaption>

<blockquote><p>III. Ministers are fishers by office; they are catchers of the souls of men, sent “to open the eyes of the blind, and to turn them from darkness to light, and from the power of Satan unto God,” Acts 26:18. Preachers of the gospel are fishers; and their work, and that of fishers, agree in several things.

      1. The design and work of fishers is to catch fish. This is the work that preachers of the gospel have taken in hand, even to endeavour to bring souls to Christ. Their design in their work should be the same. Tell me, O my soul, what is thy design in preaching? for what end dost thou lay the net in the water? is it to shew thy gifts, and to gain the applause of men? Oh! no. Lord, thou knowest my gifts are very small; and had I not some other thing than them to lean to, I had never gone to a pulpit. I confess, that, for as small as they are, the devil and my corruptions do sometimes present them to me in a magnifying glass, and so would blow me up with wind. But, Lord, thou knowest it is my work to repel these motions. An instance of this see in my Diary, Jan. 1. 1699. But of this see afterwards.

      2. Their work is hard work; they are exposed to much cold in the water. So is the minister’s work.

      3. A storm that will affright others, they will venture on, that they may not lose their fish. So should preachers of the gospel do.

      4. Fishers catch fish with a net. So preachers have a net to catch souls with. This is the everlasting gospel, the word of peace and reconciliation, wherewith sinners are caught. It is compared to a net wherewith fishers catch fish….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Thomas Boston: A Soliloquy on the Art of Man-Fishing</cite>, ed. Samuel M‘Millan, vol. 5 (Aberdeen: George and Robert King, 1849), 10–11.</span></figcaption>

</figure><figure class="quote" id="q-e3bf11b7dc" data-kw="">
<blockquote><p>Certainly, that succession is a goodly ornament—if, with the succession of persons, there be also a succession of doctrine and conformity of virtue. But there are many chairs in which those who sit hold a contrary doctrine to their predecessors. Thus, the scribes and Pharisees were sitting in the chair of Moses and had the personal succession; nevertheless, Jesus Christ commanded His disciples to beware of the leaven of their doctrine and reproached them for transgressing the law of God by their tradition (Matt. 15). Thus, the bishops of the churches of Antioch, Rome, and Alexandria boast themselves to be successors of Saint Peter, yet are dissenting and separate in communion. The bishops of Constantinople trace their succession from the Apostle Saint Andrew, as Nicephorus attempts to prove in the eighth book of his Chronology, chapter 6. Yet these bishops, by the judgment of the Roman Church, are schismatics and heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, bk. 1, ch. 32</span></figcaption>

<blockquote><p>That they acknowledged the king to be the only supreme governor in this kingdom, over all persons and in all causes… and that at their utmost power they should defend, assist and maintain his majesty’s jurisdiction foresaid against all deadly, and never to decline his majesty’s power and jurisdiction by this their oath upon the holy evangel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

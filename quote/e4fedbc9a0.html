<main class="wrap"><figure class="quote" id="q-e4fedbc9a0" data-kw="">
<blockquote><p>It will be said by such a believer that my change of view was too rationalistic, too cerebral, too bloodless, too focused on a theoretical knowledge of the God of the philosophers rather than a personal response to the God of Abraham, Isaac, and Jacob. But the dichotomy is a false one, and the implied conception of the relationship between faith and reason not only foolish but heterodox. As to the heterodoxy and foolishness of fideism, and the correct understanding of the relationship of faith and reason, I have addressed that set of issues elsewhere. As to the ‘heart versus head’ stuff, it seems to me to rest on an erroneous bifurcation of human nature. Man is a unity, his rationality and animality, intellect and passions, theoretical and moral lives all ultimately oriented toward the same end… …that does not mean that the will does not have a role to play. But that is true wherever reason leads us to a conclusion we might not like, not merely in matters of religion. And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real. If you find yourself intellectually convinced that there is a divine Uncaused Cause who sustains the world and you in being at every instant, and don’t find this conclusion extremely strange and moving, something that leads you to a kind of reverence, then I dare say you haven’t understood it. Of course, there are those whose heads and hearts are so out of sync that they cannot follow both at the same time. But we shouldn’t mistake this pathology for an insight into human nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 9, ‘The Road from Atheism’, pp. 213-14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f9aeee0f2" data-kw="">
<blockquote><p>A.H. Strong uses the analogy of the coupling. The coupling joins a train of cars to a locomotive. The coupling has no power in itself. It cannot move a single car an inch. All the power is in the locomotive. But the coupling is the link by which the power of the locomotive is transmitted to the cars. Faith has no power in itself; it is not a ground of salvation; it is not a good work. It is merely that by which all the goodness and grace and glory of Christ comes to the sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-fe81a52281" data-kw="">
<blockquote><p>Belief was at first defined to be an assent to things known by revelation: but now ye are further to know that all assent is not of the same kind and degree, but differs according to the diversity of the objects assented unto. Therefore we must observe, that of the objects of belief:

1. Some are represented unto us only as true and good in themselves, without any special relation to our benefit and commodity. Unto such things, whether past, present or to come, the understanding and will of man do yield that common assent and approbation whereby they allow of the truth and goodness of everything that is apprehended by them as true and good in what kind soever it be. This is called a bare assent, or credulitas, belief in strict terms, when we only believe tis good and true, and go no further.

2. Some are revealed unto us not only as true and good in themselves, but more specially as containing some excellent truth and goodness that concerns us in regard of some benefit that we shall get thereby. In these things our assent is with adherence, affiance, trust and dependance upon the thing revealed. For as in general all truth and goodness draws the faculties of the soul to an approbation of them when they are known, so much more does the goodness and truth of those things, which are proportionable to our nature and necessities, wherein we may claim special interest and commodity, unite our wills and understanding in strong assent and adherence unto them. This kind of assent is in strict terms called faith or trust, fides, fiducia, which imply much more than credulitas, belief. Fidere in the property of the word is a degree beyond credere, importing an assent with reliance and confidence. Now the proper object of this assent is nothing but promises of some good hereafter to befall us. And promises are never believed, unless they be trusted upon: as a captive cannot be said to believe him that promises to ransom him upon a day, unless he trust and depend upon him. In which case we cannot distinguish between belief and trust, fidem and fiduciam, to make them two several acts, which are but one and the same; as is manifest thus, a promise is a revelation of some such truth as shall be beneficial to me in particular. The truth of such a promise consists in the certainty of performance. The goodness of the promise consists in the quality of the thing promised more or less excellent. But now to trust (fiduciam ponere, fidem habere) upon a promise is not to believe the goodness of the thing promised (for that often is known perfectly enough) but to be believe the certainty of performance of it unto me: as for instance, if a rich man promise to pay a poor man’s debts, the poor man needs not believe the goodness of the promise, for he well knows the benefit thereof. What then must he believe? The truth of it: where in stands that? in the performance that the rich man will certainly do for him what he has said. Now what is this else but to trust him? So that belief and trust or affiance are here essentially one and the same thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), pp. 170-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>1. Do but consider, as faith is the condition required on our part, so it is the only condition; there is no more, no other thing required to bring you in to Christ, nor to bring you into communion or fellowship, or participation of Himself, nor of the benefits of his death, but faith: If you do believe, Christ is yours, and if you do believe you are justified and if you do believe you shall be saved and if you do believe you have an immediate, certain and full interest in Christ and his merits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed in the Everlasting Covenant</cite>, ... (London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, sect. 8, Whether Jesus Christ as Mediator died for all and every man?, p. 284</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. Do but consider, as faith is the condition required on our part, so it is the only condition; there is no more, no other thing required to bring you in to Christ, nor to bring you into communion or fellowship, or participation of Himself, nor of the benefits of his death, but faith: If you do believe, Christ is yours, and if you do believe you are justified and if you do believe you shall be saved and if you do believe you have an immediate, certain and full interest in Christ and his merits.”

<blockquote><p>4. Therefore, if we look merely to the Law, the result must be despondency, confusion, and despair, seeing that by it we are all cursed and condemned, while we are kept far away from the blessedness which it holds forth to its observers. Is the Lord, then, you will ask, only sporting with us? Is it not the next thing to mockery, to hold out the hope of happiness, to invite and exhort us to it, to declare that it is set before us, while all the while the entrance to it is precluded and quite shut up? I answer, although the promises, insofar as they are conditional, depend on a perfect obedience of the Law, which is nowhere to be found, they have not, however, been given in vain. For when we have learned that the promises would be fruitless and unavailing, did not God accept us of his free goodness, without any view to our works, and when, having so learned, we, by faith, embrace the goodness thus offered in the gospel, the promises, with all their annexed conditions, are fully accomplished. For God, while bestowing all things upon us freely, crowns his goodness by not disdaining our imperfect obedience; forgiving its deficiencies, accepting it as if it were complete, and so bestowing upon us the full amount of what the Law has promised. But as this point will be more fully discussed in treating of justification by faith, we shall not follow it further at present.</p></blockquote>

<blockquote><p>38. One act of faith is direct toward its object, another reflexive toward itself. Also the first act of faith is to believe, the second to work through charity and by means of it.

39. This latter act is the instrument of our sanctification, which is mortification of the old man according to all parts and faculties that are in us, and vivification of the new according to the same. But that is not perfect in the way, but such it will be in the goal, nor is it given here consqummated, but only begun.

40. Sanctification is succeeded by glorification…</p></blockquote>

<blockquote><p>36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical.

37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in an identical sense.

38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace.

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>

<blockquote><p>CXIII. Then, it seems somewhat uncertain when they [some Reformed theologians] distinguish between the act that predisposes one to justification and the act they say is formally justifying. According to the Reformed perspective, faith does not justify as a sort of form through which we are justified but rather as an instrument grasping Christ’s merit, as many say, or as a condition of the covenant of grace, which God counts as righteousness for Christ’s sake, as others prefer to say. These views, upon closer examination, converge to the same point. No one would say faith is a physical instrument of our justification; it can only intervene as a moral instrument. But faith can’t be a moral instrument of justification unless in the sense that God has promised forgiveness of sins to believers, which cannot be attained without the intervention of a living and effective faith. This is essentially the same as being a condition of the covenant of grace, wherein God offers grace and glory to believers and repentants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683), On Justifying Faith, pt. 1, pp. 165-66 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

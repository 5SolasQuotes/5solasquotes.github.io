</figure><figure class="quote" id="q-c1877f79d0" data-kw="">
<blockquote><p>2. They resisted the Holy Ghost striving with them by their own consciences, and would not comply with the convictions and dictates of them. God’s Spirit strove with them as with the old world, but in vain; they resisted Him, took part with their corruptions against their convictions, and rebelled against the light. There is that in our sinful hearts that always resists the Holy Ghost, a flesh that lusts against the Spirit, and wars against his motions; but in the hearts of God’s elect, when the fullness of time comes, this resistance is overcome and overpowered, and after a struggle the throne of Christ is set up in the soul, and every thought that had exalted itself against it is brought into captivity to it, 2 Co. 10:4, 2 Co. 10:5. That grace therefore which effects this change might more fitly be called victorious grace than irresistible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 7:51, “…ye do always resist the Holy Ghost…”</span></figcaption>

</figure><figure class="quote" id="q-59b13ebd44" data-kw="">
<blockquote><p>These several passages quoted out of our [official] Homilies [of the Anglican Church] do abundanty testify:… That God’s grace and Spirit do always work effectually in the hearts of his elect, in the act of their conversion, which they can never finally nor totally resist. And that the elect and truly regenerate can neither fall finally nor totally from the state of grace, which is firm and stable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of England’s Old Antithesis to New Arminianism</cite>, … (London: Matthewes, 1629), pp. 33-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

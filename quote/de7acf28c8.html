<main class="wrap"><figure class="quote" id="q-de7acf28c8" data-kw="">
<blockquote><p>Q. How shall we come to the right sight of our sins and a sound persuasion of the greatness of them? A: By the Spirit of God leading us into the true understanding of the law and a due examination of ourselves thereby. Q: Where is the law set down? A: it is written in many places of the Scriptures but the sum thereof is contained in the Ten Commandments. Q: Rehearse them A: I am the Lord your God, you shall have no other Gods but me… Q: How are they divided? A: Into two principal heads or tables as they are called. Q: What does the first table teach us? A: It teaches us our duties toward God and is contained in the first four commandments. Q: What does the second teach? A: Our duty toward our neighbor and is contained in the last six commandments. Q: Why are the duties towards God set down before the duties toward our neighbor? A: Because the love of God is the ground of our love of neighbor. Q: What follows hereof? A: That no one can rightly love his neighbor except he first love God. Q: Why are the duties towards our neighbor joined to our duty towards God? A: Because of the love of our neighbor is the proof our love towards God. Q: What ensues hereof? A: That no one can love God aright except he also love his neighbor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Form Of Catechizing (1599).</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-61e1b01320" data-kw="">
<blockquote><p>We, on the other hand, declare with Paul that no law, whether it is human or divine, justifies or makes alive. Therefore we distinguish the Law from righteousness as sharply as death from life or hell from heaven. We are prompted to declare this by the clear statement of Paul: “The Law was not given in order to justify, make live, or save, but merely in order to condemn, kill, and destroy, contrary to the opinion of all men, who naturally suppose that the Law was given in order to obtain righteousness, life, and salvation.” Such a proper distinction between the function of the Law and that of the Gospel keeps all genuine theology in its correct use. It also establishes us believers in a position as judges over all styles of life and over all the laws and dogmas of men. Finally it provides us with a faculty for testing all the spirits (1 John 4:1). By contrast, because the papists have completely intermingled and confused the doctrine of the Law and that of the Gospel, they have been unable to teach anything certain either about faith or about works or about styles of life or about judging the spirits. And the same thing is happening to the sectarians today. After these refutations and arguments, therefore, Paul teaches, at some length and with considerable beauty, that if you consider the true and best use of the Law, it is nothing but some sort of discipline toward righteousness. It humbles men and makes them ready for the righteousness of Christ, if it performs its proper function, that is, if it makes them guilty, terrifies them, makes them conscious of sin, wrath, death, and hell. When this has happened, the presumption of their own righteousness and holiness disappears, and Christ, with His blessings, begins to become sweet. Therefore the Law is not against the promises of God; it is for them. Although it does not fulfill the promise and does not grant righteousness, still, in its use and function, it humbles us and thus makes us ready for the grace and blessing of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 331.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-c862a4f6cf" data-kw="">

</figure><figure class="quote" id="q-869d3af065" data-kw="">
<blockquote><p>Now, what need is there to go through all of Latomus, point by point, since what has been said thoroughly refutes his entire position and confirms mine? I have sufficiently shown that his whole work consists of begging the question, for he does not want to understand my use of “sin” except in his own sense. With deliberate villainy, he distorts both my statements and those of all the fathers, making out that what they say simply of sin is said against sin under grace, or applying what is said of the sin of the whole to, as I might say, the sin of the part. He does this because he, together with his sophists, has never recognized what grace and sin, law and gospel, Christ and man are. He who wishes to discuss sin and grace, law and gospel, Christ and man, in a Christian way, necessarily discourses for the most part on nothing else than God and man in Christ….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works, Vol. 32: Career of the Reformer II, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 32 (Philadelphia: Fortress Press, 1999), 257</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-133bcaf368" data-kw="">
<blockquote><p>As whether there be any Transubstantiation of the bread, or no any corporal &amp; carnal presence of Christ’s substance, or no: Whether adoration (due only unto God) is to be done unto the Sacrament or no: and whether Christ’s body be there offered indeed unto the heavenly father, by the priest or no: and whether the evil man receiveth the natural body of Christ or no.

Yet nevertheless as in a man disease in diverse parts, commonly the original cause of such diverse diseases, which is spread abroad in the body, do come from one chief member, as from the stomach, or from the head: even so all five aforesaid do chiefly hang upon this one question: which is, what is the mater of the Sacrament: whether is it the natural substance of bread, or the natural substance of Christ’s own body?

The truth of this question truly tried out and agreed upon, no doubt shall cease the controversy in all the rest. For if it be Christ’s own natural body, borne of the virgin: than assuredly (seeing that all learned men in England so far as I know, both new &amp; old, grant there to be but one substance) than I say, they must needs grant Transubstantiation: that is, a change of the substance of bread, into the substance of Christ’s body.

Than also they must needs grant the carnal and corporal presence of Christ’s body. Than must the Sacrament be adored with the honour due to Christ himself, for the unity of the two natures in one person. Than if the priest do offer the Sacrament, he doth offer indeed Christ himself. And finally the murderer, the adulterer, or wicked man receiving the Sacrament, must needs than receive also the natural substance of Christ’s own blessed body, both flesh and blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-ridley.html">Nicholas Ridley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief declaration of the Lord’s Supper, written by the singular learned man, and most constant martyr of Jesus Christ, Nicholas Ridley Bishop of London prisoner in Oxford, a little before he suffered death for the true testimony of Christ</cite>, (Emden: E. van der Erve, 1555), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2136d535e" data-kw="">
<blockquote><p>[I]f you are very despondent and leaning towards melancholy, and you proceed to partake of the Lord’s Supper, see to it that you do not dwell on the disturbing and unsettling thoughts regarding your sins and failures. To you who are in a state of despondency, we say that we do not wish to apply this rule categorically, as if they who partake of the Lord’s Supper should refrain from reflecting upon their sins.

On the contrary! We believe that if someone comes to the Lord’s Table in a somewhat sluggish and dull heart to be broken so that the balm of grace may be all the more effective (Matt. 12:20). Nevertheless, concerning you who are of a melancholy and weak disposition, we believe that now, namely, the time of preparation for the Lord’s Supper, is not the time to prune and carve even more, but rather that you should solely pursue the healing and refreshing of your soul.

The reason why you so frequently leave the Lord’s Table without fruit and joy is because you have been wrongly engaged, having focused more on your sins and abominations than on the grace of Jesus Christ. Such a melancholy reflections will so oppress you and engulf your heart that the sunshine of God’s comfort cannot penetrate. The best way for you and all that are of a similar disposition is but to cast your souls, as wounded and broken as they may be, before the cross of Christ, longing and craving for the sweet efficacy of His healing blood. Do so before you inflict new wounds in your soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guiljelmus-saldenus.html">Guiljelmus Saldenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Efficacy of the Lord’s Supper to the Comfort and Sanctification of God’s Children</cite>, (1664), trans. Bartel Elshout in James A. De Jong (ed.), In Remembrance of Him: Profiting from the Lord’s Supper (Grand Rapids MI: Reformation Heritage Books, 2012), p. 31.</span></figcaption>

</figure><figure class="quote" id="q-8eb3be1fc7" data-kw="">
<blockquote><p>This sacrament, therefore, consists in the rite and the promise annexed to it, or in the signs and the things signified. The rite, or signs are the bread which is broken and eaten, and the wine which is poured out, and drunk. The things signified are the broken body, and shed blood of Christ, which are eaten and drunk, or our union with Christ by faith, by which we are made partakers of Christ and all his benefits, so that we derive from him everlasting life, as the branches draw their life from the vine.</p></blockquote>

<blockquote><p>Problem: Whether the Lord’s Supper can be said directly and proximately to seal the grace of regeneration? Response: It seals the continuation and excitation of it, or of its terminus, namely, faith (as it is an organ) primarily, and new obedience secondarily. But the grace of regeneration which is the cause of faith it designates consequently and mediately, as something presupposed.</p></blockquote>

</figure><figure class="quote" id="q-04ea9ba944" data-kw="">
<blockquote><p>I do not know of any satisfactory answer to this problem,” Kenny continued. “If I did, I would give it. Since I do not, I must leave it, as the writers of textbooks say, as an exercise for the reader” (A Path from Rome, 1986, 167–168). These questions may seem abstruse… But the question of Christ’s presence now on the altar is… central to the consecration and adoration of the Eucharist [in Romanism]. It is a question that many others besides Thomas Aquinas sought to answer, and a seriously inquiring intellect might rightly be disturbed, even scandalized, if forbidden to ask it. But for a long time Thomas’s answer was accepted just because it was his… Thomas’s answer to Kenny’s question can, in fact, be found in other Scholastics who variously adopt the principle that “that into which something is converted is where the converted thing was before.” This principle is dubious and was not universally accepted. Since transubstantiation converts only the substance of the bread into Christ’s body and not also the accidents, why should any of the accidents of the bread be kept by Christ’s body if, according to the doctrine, the accidents are not part of the transubstantiation? [Simpson goes on to describe Scotus’s proposed answer to the issue.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-l-p-simpson.html">Peter L.P. Simpson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Have you Tried Scotus? Aquinas Didn’t Know Everything’ in Commonweal</cite>, (June 14, 2019), p. 12</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I do not know of any satisfactory answer to this problem,” Kenny continued. “If I did, I would give it. Since I do not, I must leave it, as the writers of textbooks say, as an exercise for the reader” (A Path from Rome, 1986, 167–168). These questions may seem abstruse… But the question of Christ’s presence now on the altar is… central to the consecration and adoration of the Eucharist [in Romanism]. It is a question that many others besides Thomas Aquinas sought to answer, and a seriously inquiring intellect might rightly be disturbed, even scandalized, if forbidden to ask it. But for a long time Thomas’s answer was accepted just because it was his… Thomas’s answer to Kenny’s question can, in fact, be found in other Scholastics who variously adopt the principle that “that into which something is converted is where the converted thing was before.” This principle is dubious and was not universally accepted. Since transubstantiation converts only the substance of the bread into Christ’s body and not also the accidents, why should any of the accidents of the bread be kept by Christ’s body if, according to the doctrine, the accidents are not part of the transubstantiation? [Simpson goes on to describe Scotus’s proposed answer to the issue.]”

<blockquote><p>The bestowment of common grace upon the non-elect shows that non-election does not exclude from the kingdom of heaven by Divine efficiency, because common grace is not only an invitation to believe and repent, but an actual help towards it; and a help that is nullified solely by the resistance of the non-elect, and not by anything in the nature of common grace, or by any preventive action of God. The fault of the failure of common grace to save the sinner, is chargeable to the sinner alone; and he has no right to plead a fault of his own as the reason why he is entitled to special grace. It is absurd for him to contend that God has no right to refuse him regenerating grace, because he has defeated the Divine mercy in common grace. The true way out of the difficulty for the sinner is, not to demand regenerating grace as a debt by denying that God has the right to withhold it, but to confess the sinful abuse and frustration of common grace, and to cry with the leper: ‘Lord, if thou wilt, thou canst make me clean.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (NY: 1893)</cite>, ch. 5, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

<blockquote><p>53. For just as a physician who abolishes and removes disease and restores health; a master who abolishes and takes away servitude and grants freedom to a slave; a lord who breaks and destroys a prison and releases a captive and exalts him to the highest dignity – these are not said to use force upon the sick man, the slave, or the captive. So neither does God use force upon one to whom He provides that renewing grace. And just as it is foreign to debate whether a sick man is restored to health irresistibly, a slave to liberty, a captive to dignity, so it is foreign to this matter to dispute whether God’s renewing grace operates irresistibly.</p></blockquote>

</figure><figure class="quote" id="q-26f5f30b35" data-kw="">
<blockquote><p>Nor do we say that any such previous action [to regeneration] can be performed by the creature ut de merito congrui teneatur Gratiam dare [so that it binds by congruent merit to give grace], that God is bound for the desert of any such previous action to give his inward and regenerating quickening grace: But yet this we say, that in the church of God, where men are daily stirred up by the Word and Spirit to repent and believe savingly, God will give (though not for any of these previous or dispository actions, yet) freely, regenerating grace to all such as are capable of it, unless they have resisted the Spirit of God in the preceding operations and rejected his quickening grace; but yet we deny, that any man can perform these actions so but he will offend and resist the Spirit of God in them: Now why when as all resist, God should reject some, as they have rejected Him, and leave them to the hardness of their own hearts, and work irresistibly on others who have resisted their God as much, and break open their hearts, though locked and barred against Him, and fill them with quickening grace, and pull a Lot out of Sodom by force, and draw a soul out of the wilderness by head and shoulders, I say, why He should do it, when two are grinding at the same mill, take one and leave the other… I will conclude with Dr. Davenant, is Sacrum Misterium divinae voluntati reliquendum, ‘a sacred and secret mystery to be left to the divine pleasure,’ and the reason lies in the agent’s own breast; It is because He will have mercy upon whom He will have mercy, and whom He wills He hardens; God is his own reason, and his free grace its own cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646)</cite>, p. 26</span></figcaption>

</figure><figure class="quote" id="q-3e8bc84111" data-kw="">
<blockquote><p>The Calvinist, on the contrary [to Arminianism], holds that the unregenerate man never ceases to resist and never yields to God of his own motion, but only as he is acted upon by the Holy Spirit and is thereby ‘persuaded and enabled’ to cease resisting and to yield obedience. Ceasing to resist God, he [the Calvinist] contends, is holy action, and so is yielding or submitting to God. To refer this kind of action to the sinful and unregenerate will as its author [as the Arminian does], the Calvinist asserts [this] is contrary to the Scripture declaration, that ‘the carnal mind is enmity against God, and is not subject to the law of God, neither indeed can be,’ Rom. 8:7. A will at enmity with God never of itself ceases resisting Him, and never of itself yields to Him. It must be changed from enmity into love by ‘the washing of regeneration and renewing of the Holy Ghost’ in order to sweet and gentle submission. The sinner, as such, cannot, therefore, assist and co-operate with the Holy Spirit in this work of originating faith and repentance, but the whole of it must be done by that Almighty Agent who can turn the human heart as the rivers of water. Christ, through the Spirit, is the sole ‘author of faith’ (Heb. 12:2). When the Holy Spirit puts forth a higher degree of his energy than He exerts in his ordinary operation, He overcomes and stops the sinner’s resistance instead of the sinner’s overcoming and stopping it of himself, and [the Holy Spirit] inclines the sinner to yield to the Divine monitions [admonitions] and impulse instead of the sinner’s yielding of his own accord [as the Arminian says]. If the sinner’s resistance is ‘overcome’, it is overcome by God’s action [according to the Calvinist]; but if it ‘ceases’, it ceases by the sinner’s action [by his own power, according to the Arminian]. To say that common grace [in the sincere strivings of the Spirit] would [hypothetically] succeed [in salvation] if it were not resisted by man, is not the same as saying that common grace would succeed if it were yielded to by man[‘s independent power, as in Arminianism]. [Hypothetical] Non-resistance is different from ceasing resistance [of the Arminian]. In the former [hypothetical] instance there is no opposition by the man [and thus the common, gracious striving of the Spirit in the gospel call would result in saving grace]; in the latter there is opposition, which is put a stop to by the man[‘s independent power, on the Arminian view]. … According to the monergistic [God alone working] or Calvinistic view of grace, on the contrary [to Arminianism], no man receives a grace that is ‘sufficient for generating faith’ who does not receive such a measure of Divine influence as overcomes his hostile will; so that he does not stop his own resistance but it stopped by the mercy and power of God; so that his faith and repentance are not the result in part of his own efficiency, but solely of the Holy Spirit’s irresistible and sovereign energy in regeneration. In a word, the dependence upon Divine grace in the Calvinistic system [in being saved] is total; in the Arminian is partial. In the former, common grace cannot be made saving grace by the sinner’s co-action; in the latter it can be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (NY: 1893)</cite>, ch. 9, pp. 100-103</span></figcaption>

— William G.T. Shedd, Calvinism: Pure &amp; Mixed (NY: 1893), ch. 9, pp. 100-103">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Calvinist%2C+on+the+contrary+%5Bto+Arminianism%5D%2C+holds+that+the+unregenerate+man+never+ceases+to+resist+and+never+yields+to+God+of+his+own+motion%2C+but+only+as+he+is+acted+upon+by+the+Holy+Spirit+and+is+thereby+%E2%80%98persuaded+and+enabled%E2%80%99+to+cease+resisting+and+to+yield+obedience.+Ceasing+to+resist+God%2C+he+%5Bthe+Calvinist%5D+contends%2C+is+holy+action%2C+and+so+is+yielding+or+submitting+to+God.+To+refer+this+kind+of+action+to+the+sinful+and+unregenerate+will+as+its+author+%5Bas+the+Arminian+does%5D%2C+the+Calvinist+asserts+%5Bthis%5D+is+contrary+to+the+Scripture+declaration%2C+that+%E2%80%98the+carnal+mind+is+enmity+against+God%2C+and+is+not+subject+to+the+law+of+God%2C+neither+indeed+can+be%2C%E2%80%99+Rom.+8%3A7.+A+will+at+enmity+with+God+never+of+itself+ceases+resisting+Him%2C+and+never+of+itself+yields+to+Him.+It+must+be+changed+from+enmity+into+love+by+%E2%80%98the+washing+of+regeneration+and+renewing+of+the+Holy+Ghost%E2%80%99+in+order+to+sweet+and+gentle+submission.+The+sinner%2C+as+such%2C+cannot%2C+therefore%2C+assist+and+co-operate+with+the+Holy+Spirit+in+this+work+of+originating+faith+and+repentance%2C+but+the+whole+of+it+must+be+done+by+that+Almighty+Agent+who+can+turn+the+human+heart+as+the+rivers+of+water.+Christ%2C+through+the+Spirit%2C+is+the+sole+%E2%80%98author+of+faith%E2%80%99+%28Heb.+12%3A2%29.+When+the+Holy+Spirit+puts+forth+a+higher+degree+of+his+energy+than+He+exerts+in+his+ordinary+operation%2C+He+overcomes+and+stops+the+sinner%E2%80%99s+resistance+instead+of+the+sinner%E2%80%99s+overcoming+and+stopping+it+of+himself%2C+and+%5Bthe+Holy+Spirit%5D+inclines+the+sinner+to+yield+to+the+Divine+monitions+%5Badmonitions%5D+and+impulse+instead+of+the+sinner%E2%80%99s+yielding+of+his+own+accord+%5Bas+the+Arminian+says%5D.+If+the+sinner%E2%80%99s+resistance+is+%E2%80%98over <blockquote><p>The manner of conversion is to us unsearchable, both because we are ignorant of the nature of the immortal soul, and because much more are we ignorant of the manner of God’s working upon that immortal spirit. As for the resistibility or irresistibility of grace, we know that the power of God is almighty, and cannot be resisted by any created strength, if He please to exercise it to the full, or in some high measure: But if God give power to the creature, or work by that created power given, it may be resisted by a contrary created power: And so grace or the power of conversion, as a created thing in man, may be so given as to be resisted by the will of man. And both the understanding of man, will and does, either deny or doubt of divine truths represented to the soul; and the will will wrangle, oppose and reject or not sincerely affect and submit unto the divine commands, and promises. And hence, the many conflicts not only in conversion, but after we are converted. As for necessitation of the will in this work of divine calling, it’s certain and granted of all that the illumination of the understanding may be necessary so far as the soul in respect of the same is only passive, though in the apprehension and judgement concerning the truths represented by the Word it be active. Besides, God may give an active power to the will, and it may be passive in receiving of it, and also necessitated to an act of complacency in general, so that it necessarily may approve by a general approbation of the justice and equity of the command, and the excellency of the good promised… Yet notwithstanding this necessary and natural act of complacency, that act of the will, which Buridan calls acceptatio ad prosecutionem may be, and is free. I pass by the philosophical speculations concerning the nature of the will, which few know, concerning the natural and necessary acts thereof, and also concerning those that are free; and what the natural liberty of the will is, and in what acts, and in respect of what acts, it is free. Concerning the positive acts velle and nolle, and the negative, non velle, non nolle, and concerning the liberty of contradiction and specification; It’s far more profitable for all such as are so blessed as to live in the Church and enjoy the means of conversion diligently to use the means and exercise that power which God has given them, and also earnestly and constantly pray for the regenerating Spirit, which God has promised to them that seek Him in an orderly way. For upon this done, regeneration will follow; and by the divine and spiritual power given them, together with God’s special assistance, and concurrence, after all necessary preparations, they shall freely determine and the will shall wholly and most willingly submit to God-Redeemer, which is the ultimate product of divine vocation, the parts whereof are the outward Word, and the inward power of the Spirit which go together, according to the promise of the Gospel, and make up the essence of it… And we cannot find in Scripture that God denies his Spirit to such as hear his Word till they give God cause either by their neglect or perversness, or apostasy from that degree of grace they have received to withdraw the same. By all this we understand that Christ finds his subjects, to whom God has given Him a right, to be enemies, and He enlarges as He begins his Kingdom by a kind of spiritual conquest, dashing in pieces all such as will not submit, and are bound to submit, with his iron rod and irresistible strength, reducing the rest unto subjection, after some time of standing out… And this publication of his laws is accompanied with a wonderful power of his Spirit whereby together with the Word of the Kingdom, He pierces the minds of men and breaks their stony hearts in sunder, as an hammer does a rock: In this respect the Lord says, ‘Is not my Word like as a fire, and like an hammer that breaks the rock asunder, Jer. 23:29.</p></blockquote>

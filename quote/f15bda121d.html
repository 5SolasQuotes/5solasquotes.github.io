<main class="wrap"><figure class="quote" id="q-f15bda121d" data-kw="">
<blockquote><p>For while there remains any remnant of the lust of the flesh, to be kept in check by the rein of continence, God is by no means loved with all one’s soul. For the flesh does not lust without the soul; although it is the flesh which is said to lust, because the soul lusts carnally. In that perfect state the just man shall live absolutely without any sin, since there will be in his members no law warring against the law of his mind, but wholly will he love God, with all his heart, with all his soul, and with all his mind which is the first and chief commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Man’s Perfection in Righteousness: Addressed to Eutropius and Paulus</cite>, (415), 8 in NPNF1, 5: 165.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9aa27b38b9" data-kw="">
<blockquote><p>What is the end of our Justification? … Lastly, that we ourselves might be bettered and made righteous. Gal. 2:17, “If then while we seek to be made righteous by Christ, we ourselves are found sinners, is Christ therefore the minister of sin? God forbid.” For to this end are we justified by faith through Christ, that the old man being abolished by the power and efficacy of Christ crucified, Christ might live in us and that we should by our study and labor endeavor to bring forth good works, [and] show ourselves thankful to God for so great a benefit. And therefore it is that the apostle Paul almost in all his epistles derives the doctrine of sanctification, or good works, from the doctrine of faith or justification as the cause from the effect, or the necessary consequent from the antecedent. What are the adjuncts of Justification? … For saiys Augustine, good works do follow a man already justified, and do not go before a man that is to be justified, as good fruits are not before a good tree… The works accompanying or following it are… Moreover the adopting of us to be sons of God, our sanctification or newness of life, the fruits whereof are described, Gal. 5:22. For they that are made partakers of Christ through faith, they do with Him receive the Holy Ghost, the author of all holiness; from whence it is, that these two benefits are indeed distinguished one from another, but yet so linked together by an unseparable bond that they can never be plucked asunder; and the latter is the testimony of the former, both in the soul of the faithful man himself and to other men also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), ch. 31, ‘Justification’, pp. 354-56</span></figcaption>

<blockquote><p>8. Likewise, every Christian should learn that this grace and this regeneration have not been given to us so that we might remain idle in that stage of our renewal which we at first obtained, but so that we may grow in everything into him who is the head. Therefore, the people must be taught to devote effort to this growth which indeed happens through good works, both internal and external, which are commanded and commended by God. To these works God has, in many passages from the Gospels, clearly and manifestly promised on account of Christ a reward – good things in this life, as much for the body as for the soul (as much as seems right to divine providence) and after this life in heaven. Therefore, although the inheritance of eternal life is due to the regenerate on account of the promise, as soon as they are reborn in Christ, nevertheless God also renders a reward to good works, not according to the substance of the works, nor because they come from us, but to the extent that they are performed in faith and proceed from the Holy Spirit, who dwells in us, free choice concurring as a partial agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/colloquy-of-regensburg.html">Colloquy of Regensburg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anthony Lane, Justification by Faith in Catholic-Protestant Dialogue. An Evangelical Assessment</cite>, tr. Anthony Lane (London: 2002), Appendix 1, p. 236 This statement was agreed by both the Reformed and Romanist sides</span></figcaption>

<blockquote><p>It is our Duty. In his Example we have a taste of his Spirit; I am not of the World, saith Christ; and we should imitate Christ as dear Children, Ephes. 5.1. They that love to live in delight and pleasures, are but Christians in Name. If we had no other Reason to contemn the vanity of the World, than the Life of Christ, this were enough. Who was wisest, Christ, or you? Who can make the better choice, Christ or you? Who is in an Error, Christ or you? Christ chose a poor Life, and you affect Greatness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons upon the Seventeenth Chapter of St. John</cite>, Sermon 25, in A Second Volume of Sermons (London, 1684), p. 225</span></figcaption>

</figure><figure class="quote" id="q-6700a17bc9" data-kw="">
<blockquote><p>What spirit shall we think they have, that will unchurch churches, because they have some defilement and unbrotherly brethren, accounting them no churches, no brethren, because they have some imperfections? Why hath not Christ a quarrel to the church then? is he blind? doth his love make him blind? No; he seeth corruption, but he seeth better things; somewhat of his own, that makes him overlook those imperfections, because they are such as he means to mortify, subdue, wear away, and to fire out by the power of his Spirit, which as fire shall waste all those corruptions in time. So it is with the church. Put the case, she hath some corruptions: that it be not with her as it should be, yet she is a church notwithstanding. The church of Corinth, we see, Paul styles them saints and brethren, with all those sweet names (1 Cor. 1:1, 2), notwithstanding they had many corruptions among them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), pp 149-50.</span></figcaption>

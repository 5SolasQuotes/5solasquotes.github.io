<main class="wrap"><figure class="quote" id="q-c5cb3f9194" data-kw="">
<blockquote><p>Two things are seen in Christ which are necessary to our justification: the one is death; the other, resurrection from the dead, etc. [Rom. 4:25] It was fitting that by his death the sins of the world should be expiated, etc. while by his resurrection from the dead, it pleased the same goodness of God to grant the Holy Ghost, through whom the gospel might be believed, and the justice that was lost by the sin of the first Adam might be restored. The apostle has expressed both parts in these words, ‘Who was delivered on account of our sins, etc. [and was raised again for our justification]’ [Rom. 4:25] In his death therefore is found satisfaction for sin; in his resurrection the gift of the Holy Ghost, by which our justification to life is effected…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-borrhaus.html">Martin Borrhaus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 Borrhaus (1499–1564) was a professor of philosophy and Old Testament at Basel in the reformed tradition. | On Gen. 15:4</cite>, pp. 161-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7f73ca9b2" data-kw="">

</figure><figure class="quote" id="q-1b35431909" data-kw="">
<blockquote><p>22. This new obedience of ours, by which, so far as lies in us, we henceforth conduct ourselves in conformity to the divine law—since it is required by God himself and performed by us—according to its degree and measure is also called our righteousness; by which also, formally, inherently, habitually, or from works, we (according to our measure) are even truly said to be righteous before God, inasmuch as on its account we are regarded by God himself as righteous in part. And with respect to it, in the divine forum, we may in some way be justified (if there were need of it). (Lk. 1:6; Isa. 38:3; 1 Thess. 5:23)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on the Doctrine of Justification, in which a plain way is built up to the concord of them which vary on this thing (d. 1618; Leiden, 1684), trans. ChatGPT-5</cite>, ch. 24, ‘Of the Effects of Justification’; sect. 22, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-4041cf2e7b" data-kw="">
<blockquote><p>4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33</cite>, p. 336</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>1. Active justification differs from passive justification. In Latin, the nouns ending in –io are generally interpreted in this way [as active and passive]. God justifies and we are justified. 2. Passive justification is later than faith. Passive justification follows after passive faith, because it is through faith that we receive the remission of sins, Act 26:18.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-86467aa5f9" data-kw="">
<blockquote><p>Because all the ceremonial law was enjoined to the Jews only, and not to the Gentiles; but this commandment of the holy Sabbath, as matrimony, was instituted of God in the state of innocency, when there was but one state of all men, and therefore enjoined to the Gentiles as well as to the Jews. So that all magistrates and householders were commanded to constrain all strangers, as well as their own subjects and family, to observe the holy Sabbath (Isa. lvi. 6), as appears by the fourth commandment, and the practice of Nehemiah (Neh. xiii. 19, &amp;c.)

All the ceremonies were a partition-wall to separate Jews and Gentiles (Eph. ii. 14;) but seeing the Gentiles are bound to keep this commandment as well as the Jews, it is evident that it is no Jewish ceremony. And seeing the same authority is for the Sabbath that is for marriage, a man may as well say that marriage is but a ceremonial law, as the Sabbath. And remember, that whereas marriage is termed but once the covenant of God (Prov. ii. 17), because instituted by God in the beginning (Matt. xix. 6, 8), the Sabbath is everywhere called “the Sabbath of the Lord thy God,” because ordained by God in the same beginning, both of time, state, and perpetuity: therefore not ceremonial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), p. 173.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Calvin: In the English Liturgy as you [the English exiles at Frankfurt] do describe unto me, I spy out many tolerabiles ineptias, ‘tolerable unfit things:’ By which two words I express thus much, that there was not that purity which were to be wished, which errors could not immediately the first day be corrected (Cum nulla subesset manifesta impietas ferenda ad tempus fuisse). Seeing there was therein contained no manifest impiety, these things† should have been born withal for a time; Epistle 200, fol. 336.</p></blockquote>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>As touching that point whether the minister should wear it [the surplice, a white garment], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Reply, pt. 2</cite>, ch. 8, pp. 262–63</span></figcaption>

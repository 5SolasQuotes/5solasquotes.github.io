<blockquote><p>…the Westminster Assembly consistently maintains particularism. I deny that the universalists at Westminster ‘were able to restrain the final codification sufficiently for there to be some significant ambiguity at crucial places’ (148). I do not deny that the issue of particularism versus universalism was debated at Westminster nor that contemporary universalists claimed their teaching compatible and remained active at the synod. But the mere presence of a plurality of views in session does not imply a plurality of views in confession. Clearly, the final formulation should interpret (the outcome of) the earlier discussion and not the earlier discussion the final formulation. Although WCF could be ambiguous or alternatively rendered on this subject (as on some other ones), it is actually precise and clear about the strictly particular divine intention.” – Rehnman . Quotes 1800’s Robert Shaw Exposition of the Westminster Confession, pp. 112-113, commenting on WCF 8.8, “To all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-rehnman.html">Sebastian Rehnman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Particular Defence of Particularism’ Journal of Reformed Theology</cite>, vol. 6, issue 1 (Jan., 2012), pp. 24-34 Ref</span></figcaption>

<blockquote><p>Now when God says expressly (as if He would make it impossible for any mortal to misconceive Him) that Christ is the Savior, the propitiation, the taster of death, not only for all men, but for every man, not only for the world, but for the whole world, and to prove He speaks of an intention to save them all without exception (if by the wickedness of their wills they do not frustrate his intention, as the greater part of men do, by not accepting his offer and not performing the conditions on which his offer is made), He professes He is not willing that any should perish, but [on the contrary] that all should come to repentance, 2 Pet. 3:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-pierce.html">Thomas Pierce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Philanthropy</cite>, ... (London: Royston, 1657), ch. 3, pp. 86-87</span></figcaption>

<blockquote><p>[Amyraldianism is] a revolt from the position maintained at the Synod of Dordt, under the guise of an explanation… When we examine the [Amyraldian] theory minutely, it will not hang together. Its advocates speak of a Universal Decree, in which God was supposed to have given Christ as a Mediator for the whole human race; and of a Special Decree, in which God, foreseeing that no one would believe in his unaided strength, was supposed to have elected some to receive the gift of faith. Unquestionably it differs form the Arminian positions in this respect, that the faith was not referred to man’s free will, but was supposed to be derived form God’s free grace. The theory acknowledged the sovereign election of God, according to His good pleasure. But it laboured under the defect of supposing a double and a conflicting decree; that is, a general decree, in which he was said to will the salvation of all, and a special decree, in which He was said to will the salvation of the elect. To Christ also it ascribed a twofold and discordant aim, viz. to satisfy for all men, and to satisfy merely for the elect. As a reconciling system, and an incoherent one, it aimed to harmonize the passages of Scripture, which at one time seem to extend Christ’s merits to the world, and at another to limit them to the church; not to mention that God is supposed to be disappointed in His purpose</p></blockquote>

<blockquote><p>The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, p. 559</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…”

— James Ussher, The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, p. 559">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+first+contains+the+preparation+of+the+remedy+necessary+for+man%E2%80%99s+salvation%3B+the+second+brings+with+it+an+application+of+the+same.+And+consequently+the+one+may+well+appertain+to+the+common+nature%2C+which+the+Son+assumed%2C+when+the+other+is+a+special+privilege+vouchsafed+to+such+particular+persons+only%2C+as+the+Father+has+given+Him.+And+therefore+we+may+safely+conclude+out+of+all+these+premises%2C+that+%E2%80%98the+Lamb+of+God%2C+offering+Himself+a+sacrifice+for+the+sins+of+the+whole+world%2C%E2%80%99+intended+by+giving+sufficient+satisfaction+to+God%E2%80%99s+justice%2C+to+make+the+nature+of+man%2C+which+He+assumed%2C+a+fit+subject+for+mercy+and+to+prepare+a+medicine+for+the+sins+of+the+whole+world%2C+which+should+be+denied+to+none+that+intended+to+take+the+benefit+of+it%3A+howsoever+He+intended+not+by+applying+this+all-sufficient+remedy+unto+every+person+in+particular+to+make+it+effectual+unto+the+salvation+of+all%2C+or+to+procure+thereby+actual+pardon+for+the+sins+of+the+whole+world.+So%2C+in+one+respect+He+may+be+said+to+have+died+for+all%3B+yet+so+as+in+respect+of+his+mercy+He+may+be+counted+a+kind+of+universal+cause+of+the+restoring+of+our+nature%2C+as+Adam+was+of+the+depraving+of+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+The+Whole+Works+of+the+Most+Rev.+James+Ussher%E2%80%A6+17+vols.+%28Dublin%3A+Hodges+%26+Smith%2C+1864%29%2C+vol.+12+%7C+%E2%80%98Of+the+True+Intent+%26+Extent+of+Christ%E2%80%99s+Death+%26+Satisfaction+upon+the+Cross%E2%80%99+%281617%29%2C+pp.+552-60%2C+p.+559&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F755e0e1434.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a519a9ff77" data-kw="">
<blockquote><p>Seeing then it is certain that the Roman Pontiff has impudently transferred to himself the most peculiar properties of God and Christ, there cannot be a doubt that he is the leader and standard-bearer of an impious and abominable kingdom.</p></blockquote>

</figure><figure class="quote" id="q-819cd372c2" data-kw="">
<blockquote><p>According to the judgment of the Nicene Council, we say, that the Bishop of Rome hath no more jurisdiction over the Church of God than the rest of the patriarchs, either of Alexandria, or of Antiochia have. And as for the Bishop of Rome, who now calleth all matters before himself alone, except he do his duty as he ought to do, except he minister the Sacraments, except he instruct the people, except he warn them and teach them, we say that he ought not of right once to be called a bishop, or so much as an elder. For a bishop, as saith Augustine, is a name of labour, and not of honour: because he will have that man understand himself to be no bishop, which will seek to have pre-eminence, and not to profit others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><figure class="quote" id="q-9f507a876f" data-kw="">
<blockquote><p>Nor is the right of examination founded in this—that we ought to believe ourselves wiser and more sagacious than entire synods and the whole true church; but in this—that since the privilege of infallibility has been granted by God to no church or pastor, nor are we certain whether they who compose ecclesiastical assemblies are members of the true church and faithful servants of God, who are partakers of the Holy Spirit and follow his guidance; nay, it can happen (and it has too often happened) that such assemblies have erred in their decisions. Hence no other means is left for the believer to know the legitimate authority of these assemblies and the decisions made by them with the certainty of faith, than a comparison and examination of them with the word of God, which he not only permits as possible and lawful, but commands as just and necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.34</span></figcaption>

</figure><figure class="quote" id="q-dd6fbda734" data-kw="">
<blockquote><p>It is not the case that there is one church at Rome and another in all the world beside. Gaul and Britain, Africa and Persia, India and the East worship one Christ and observe one rule of truth. If you ask for authority, the world outweighs its capital. Wherever there is a bishop, whether it be at Rome or at Engubium, whether it be at Constantinople or at Rhegium, whether it be at Alexandria or at Zoan, his dignity is one and his priesthood is one. Neither the command of wealth nor the lowliness of poverty makes him more a bishop or less a bishop. All alike are successors of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146 (to Evangelus)</cite>, §1</span></figcaption>

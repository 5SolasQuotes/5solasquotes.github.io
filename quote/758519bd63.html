<main class="wrap"><figure class="quote" id="q-758519bd63" data-kw="">
<blockquote><p>[God] Must be infinitely perfect. Since man knows he is an imperfect being, he must suppose the perfections he wants [lacks] are seated in some other being, which has limited him, and upon which he depends. Whatsover we conceive of excellency or perfection must be in God; for we can conceive no perfection but what God has given us a power to conceive. And He that gave us power to conceive a transcendent perfection above whatsoever we saw or heard of, has much more in Himself, or else He could not give us such a conception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, (Edinburgh: Nichol, 1864), p. 151</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

<blockquote><p>Although the Deity is unbounded and incomprehensible, yet because God has condescended to reveal himself to us both in nature and in the Scriptures (and it is incumbent upon the one who approaches God to believe that he is and is a rewarder of those who seek him, Heb. 11:6), the discussion concerning God holds the first place in theology and embraces the sum of all saving knowledge.</p></blockquote>

</figure><figure class="quote" id="q-db2b631032" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The second way is from the nature of the efficient cause. In the world of sense we find there is an order of efficient causes. There is no case known (neither is it, indeed, possible) in which a thing is found to be the efficient cause of itself; for so it would be prior to itself, which is impossible. Now in efficient causes it is not possible to go on to infinity, because in all efficient causes following in order, the first is the cause of the intermediate cause, and the intermediate is the cause of the ultimate cause, whether the intermediate cause be several, or only one. Now to take away the cause is to take away the effect. Therefore, if there be no first cause among efficient causes, there will be no ultimate, nor any intermediate cause. But if in efficient causes it is possible to go on to infinity, there will be no first efficient cause, neither will there be an ultimate effect, nor any intermediate efficient causes; all of which is plainly false. Therefore it is necessary to admit a first efficient cause, to which everyone gives the name of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>

God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fa7c31e8f3" data-kw="">
<blockquote><p>It would also seem well to observe that sensible things, from which human reason derives the source of its knowledge, retain a certain trace of likeness to God, but so imperfect that it proves altogether inadequate to manifest the substance itself of God. For effects resemble their causes according to their own mode, since like action proceeds from like agent; and yet the effect does not always reach to a perfect likeness to the agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-dbc2bfaf22" data-kw="">
<blockquote><p>In support, however, of this kind of truth [i.e. of things of faith which cannot be known by reason alone], certain probable arguments must be adduced for the practice and help of the faithful, but not for the conviction of our opponents, because the very insufficiency of these arguments would rather confirm them in their error if they thought that we assented to the truth of faith on account of such weak reasonings.</p></blockquote>

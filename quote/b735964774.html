<blockquote><p>XIV. The motions of concupiscence… If Adam had never sinned, he would never have felt such motions (which cannot be free from vitiosity).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6faf9d6c2b" data-kw="">
<blockquote><p>Human acts are the acts of the will directed by reason. They are either elicited, that is, produced by the will itself, or commanded, that is, produced by some other faculty under the influence of the will. Elicited acts are concerned either with the end or with the means. Three acts are concerned with the end: a) simple velleity, not yet efficacious; b) efficacious intention of the end; c) joy in the end attained. Two acts are concerned with means: a) consent, which accepts means; b) choice of a determined set of means. Each of these five acts of the will is preceded by a directive act of the intellect. Simple velleity, by the knowledge of the good in question; intention, by a judgment that this end should be attained; consent, by counsel; choice, by the last practical judgment which terminates deliberation. After voluntary choice there follows, in the intellect, the act called imperium, which directs the execution of the means chosen, ascending from lower means to those higher and nearer to the end to be obtained, in order inverse to that of intention, which descends from the desired end to the means which come first in execution. After the intellect’s imperium there follows in the will the act called active use, which sets the other faculties to work. These acts of the other faculties, called passive use, are, properly speaking, commanded acts of the will. And the will’s last act is that of joy in the possession of the end obtained. The end, which was first in the order of intention, is the last in the order of execution. … By the term ‘interior’ act St. Thomas often means an act which does not arise from a previous act, the first act, for example, of willing an end. By opposition, then, ‘exterior act’ often means not only the act of the corporeal members, but also an act of the will itself, if this act arises from a preceding act, as when, for example, we will the means because we already will the end. Here we must remark, further, that a human act, voluntary and free, is not necessarily preceded, if we speak precisely, by a discursive deliberation, but may be the fruit of a special inspiration, superior to human deliberation. But, even here, the act is free… because the will consents to follow the inspiration. Here lies the difference between the virtue of prudence, which presupposes discursive deliberation, and the gifts which make man prompt and docile to the inspirations of the Holy Ghost. These latter acts, free but not in the proper sense deliberate [deliberative], are the fruit, as we shall see later, not of co-operating grace, but of operating grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (St. Louis: Herder, 1950), ch. 46, ‘Human Acts’, pp. 278-80 Lagrange was a Neo-Thomist.</span></figcaption>

</figure><figure class="quote" id="q-9580d6b32c" data-kw="">
<blockquote><p>…note that while the behavior of non-human animals is not deterministic, neither is it random or arbitrary. It is perfectly intelligible given their causal powers together with the powers of the things they interact with. Yet non-human animals do not have wills, much less free will… Aquinas’s answer is that the will is a power of the kind of thing whose activity arises from within it in a certain way–specifically, by way of having knowledge of the kind of which a rational substance alone is capable (Summa theologiae I-II.6.1-2). To act voluntarily is to know what you are doing in the way that human beings do.</p></blockquote>

<blockquote><p>VII… By immortality, I refer not to the immortality of the soul by creation strictly (as discussed in Thesis IV) but to the immortality of the whole composite [of man] by grace. It is not that death was impossible in the absolute sense (since it consisted of separable parts, including the corruptible body, with mutually opposing qualities), but as long as man persisted in that state under the covenant, he would never have died. This argument is against the Pelagians, Photinians, Socinians, and Anabaptists, and is supported by:

1. The first covenant and agreement (Leviticus 18:5, Romans 10:5, 11).

2. The sacrament and the tree of life (Genesis 2:9 compared with Genesis 3:22). The tree did not contain such a great power physically within itself, but it served as a pledge and sacrament, ensuring that his life would be happily continued until, by God’s grace, he would have reached complete blessedness in heaven after a most felicitous transition through death.

3. Death, originally threatened as a penalty in the event of sin (Genesis 2:17), only entered the world when sin became an actual reality; hence, death would not have had any place in that state. With sin excluded, all guilt, penalty, and consequent punishment were also excluded. This is clearly evident from Romans 5:12, 1 Corinthians 15:22, James 1:15, Romans 6:23, and Genesis 2:17, which align with the Hebrew saying: אין מיתה בלא חטא (“there is no death without sin”).</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673), Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’, p. 819</span></figcaption>

<main class="wrap"><figure class="quote" id="q-935c88853b" data-kw="">
<blockquote><p>The life of Christianity, take it in itself, is the most pleasant and joyful life that can be, exempted from those fears and cares, those sorrows and anxieties, that all other lives are subject unto; for this of necessity must be the force and efficacy of true religion, if it be indeed true to its name, to disburden and ease the heart, and fill it with all manner of consolation. Certainly it is the most rich subject, and most completely furnished with all variety of delights to entertain a soul, that can be imagined. Yet, I must confess, while we consult with the experience and practice of Christians, this bold assertion seems to be much weakened, and too much ground is given to confirm the contrary misapprehensions of the world, who take it to be a sullen, melancholic, and disconsolate life, attended with many fears and sorrows.

It is, alas! too evident, that many Christians are kept in bondage, almost all their lifetime, through fear of eternal death. How many dismal representations of sin and wrath, are in the souls of some Christians, which keep them in much thraldom! At least, who is it that is not once and often brought in bondage after conversion, and made to apprehend fearfully their own estate; who hath such constant uninterrupted peace and joy in the Holy Ghost, or lies under such direct beams of divine favour, but it is sometimes eclipsed, and their souls filled with the darkness of horror and terror? And truly the most part taste not so much sweetness in religion, as makes them incessant and unwearied in the ways of godliness.

Yet notwithstanding of all this, we must vindicate Christianity itself, and not impute these things unto it, which are the infirmities and faults of the followers of it, who do not improve it unto such an use, or use it so far as in itself it is capable. Indeed, it is true that often we are brought to fear again, yet withal it is certain, that our allowance is larger, and that we have received the Spirit, not to put us in bondage again to fear, but rather to seal to our hearts that love of God, which may not only expel fear, but bring in joy. I wish that this were deeply considered by all of us, that there is such a life as this attainable; that the word of God doth not deceive us in promising fair things, which it cannot perform, but that there is a certain reality in the life of Christianity, in that peace and joy, tranquillity and serenity of mind that is holden out, and that some have really found it, and do find it; and that the reason why all of us do not find it in experience, is not because it is not, but because we have so little apprehension of it, and diligence after it.

It is strange, that all men who have pursued satisfaction in the things of this life, being disappointed, and one generation witnessing this to another, and one person to another, that notwithstanding, men are this day as fresh in the pursuit of that, as big in the expectations as ever. And yet in this business of religion, and the happiness to be found in it, though the oracles of God in all ages have testified from heaven, how certain and possible it is, though many have found it in experience, and left on record to others; yet there is so slender belief of the reality and certainty of it, and so slack pursuit of it, as if we did not believe it at all. Truly, my beloved, there is a great mistake in this, and it is general too. All men apprehend other things more feasible and attainable than personal holiness and happiness in it; but truly, I conceive there is nothing in the world so practicable as this, nothing made so easy, so certain to a soul that really minds it.

Let us take it so then. The fault is not religion’s, that those who profess it are subject to so much fear and care, and disquieted with so much sorrow; it is rather because Christianity doth not sink into the hearts and souls of men, but only puts a tincture on their outside, or because the faith of divine truths is so superficial, and the consideration of them so slight, that they cannot have much efficacy and influence on the heart, to quiet and compose it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary: Being Sermons on the Eighth Chapter of the Epistle to the Romans</cite>, (1670) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 146-48.</span></figcaption>

<blockquote><p>The third Impediment of the Churches restauration taken away by these great earth-quakes, is error, heresy, false worship, idolatry, &amp;c. You cannot preach, nor pray them down directly and immediately (though all other meanes depend upon these (and the Saints must own the thing) God is terrible out of his holy places, Psa. 68.35.) Well, that which the Word cannot do, the sword shall; that which the water cannot wash out, the fire will burn out. Unto this particular the Apostle applies this very text in part, namely concerning the shaking of the Heavens, Heb, 12.26, 27. Yet once more I shake not earth only, but also heaven, &amp;c.

An earth-quake (as we have heard) was appointed to shake down the ceremonial Ordinances; now if this were necessary for the abolition of that divine worship, which had sometimes been by God’s own holy institution, how much more shall that which hath been of human invention (yea, the very fumes and fogs of the bottomless pit) to God’s infinite displeasure and dishonour, be tumbled down with violence and vengeance to hell, from whence it came? And therefore as the heathenish idolatry fell with such a terrible earthquake as shook down both it and all its supporters both Emperors and Empire; even so shall antichristian idolatry and heresy with Babylon their Mother, the Beast their Father, and all their intoxicated and dementated defenders, be thrown like a Mill-stone into the bottom of the sea, Rev. 18.21.</p></blockquote>

<blockquote><p>In natural things, it is to be noted that the whole fulness of perfection due to a thing, is not from the mere substantial form that gives it its species since a thing derives much from supervening accidents, as man does from shape, color and the like; and if any one of these accidents be out of due proportion, evil is the result. So it is with action. For the plenitude of its goodness does not consist wholly in its species, but also in certain additions which accrue to it by reason of certain accidents: and such are its due circumstances. Wherefore if something be wanting that is requisite as a due circumstance the action will be evil. … Circumstances are outside an action inasmuch as they are not part of its essence; but they are in an action as accidents thereof… Every accident is not accidentally in its subject, for some are proper accidents; and of these every art takes notice. And thus it is that the circumstances of actions are considered in the doctrine of morals… Since good and being are convertible, according as being is predicated of substance and of accident, so is good predicated of a thing both in respect of its essential being, and in respect of its accidental being; and this, both in natural things and in moral actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 3. ‘Whether man’s action may be good or evil from a circumstance?’ [Yes]</span></figcaption>

<blockquote><p>This argument proves that veneration is not due to the images, as to books of the Trinity, because that the veneration of the image is an honoring of God, there must be a union betwixt the images and God or Christ, betwixt the tree and Christ [in the case of a crucifix]. 1. There is no union-lawful that can be a warrant of honoring anything but a union warranted of God, [to give false examples] betwixt crossing in the air and dedication to Christ’s service, betwixt surplice and pastoral sanctity; There is no union, nor is there a personal union betwixt Christ and the image: Nor 2. a union of parts, as betwixt the shoulders and the head. Nor 3. is there a divine relative union, as betwixt the mean or the end, the servant or the lord: for as John White says well [a puritan, d. 1648], and the Scripture proves, all union betwixt God and the means of worship, which are to be reverenced as means of worship in relation to God, is by divine institution (Mt. 10:14, 42; 2 Cor. 8:4; Gal. 4:14; Acts 10:34; Ps. 119:97, 159, 147, 82, 103, 111, 113, 114, 120, 127, 128, 140, 143, 167, 174); now certainly if by divine ordination there had been a union betwixt the image and God, then had it been lawful to lay the image in the heart, to say: ‘How love I thy image? The painted pictures and wooden portraits of Christ, the wood of the cross are my delight’, ‘I hope in the wood,’ ‘I have taken images for my heritage, they are sweeter to me, nor the honey or the honey comb,’ ‘How pleasant are the wooden feet of these dead and senseless ambassadors of Christ, who bring to my soul news of God, or of my Redeemer Jesus.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Ch. 1, Question 5, Section 3; p. 189</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7ae8c8b4cd" data-kw="">
<blockquote><p>Christ gave his soul to trouble, and to the horror of the second death for you; consult with your heart, if you have quit one lust for him. Christ laid aside his heaven for you; his whole heaven, his whole glory for you, and his Father’s house; are you willing to part with an acre of earth, or house, and inheritance for him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself</cite>, (London, 1647), pp 17-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b15a47c95" data-kw="">
<blockquote><p>[And I lay down my life for the sheep.] Our Lord, to show how truly He is the Good Shepherd, declares that like a good shepherd He not only knows all His sheep, but lays down His life for them. By using the present tense He seems to say, “I am doing it. I am just about to do it. I came into the world to do it.” This can only refer to His own atoning death on the cross, the great propitiation He was about to make by shedding His life blood. It was the highest proof of love. “Greater love hath no man than this, that a man lay down his life for his friends.” (John xv.13.)

Taken alone and by itself, this sentence undoubtedly contains the doctrine of particular redemption. It declares that Christ “lays down His life for the sheep.” That He does so in a special sense I think none can deny. The “sheep” alone, or true believers, obtain any saving benefit from His death. But to argue from this text that in no sense and in no way did Christ die for any beside His “sheep” is to say what seems to me to contradict Scripture. The plain truth is that the extent of redemption is not the leading subject of this verse. Our Lord is saying what He does for His sheep; He loves them so that He dies for them. But it does not follow that we are to conclude that His death was not meant to influence and affect the position of all mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 221.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

edcovenanter.wordpress.com/2021/02/25/j-c-ryle-on-particular-redemption-and-hypothetical-universalism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-2217e3fe57" data-kw="">
<blockquote><p>It was in itself of infinite value and sufficiency to have been made a price to have bought and purchased all and every man in the world. That it did formally become a price for any is solely to be ascribed to the purpose of God, intending their purchase and redemption by it. The intention of the offerer and accepter that it should be for such, some, or any, is that which gives the formality of a price unto it; this is external. But the value and fitness of it to be made a price arises from its own internal sufficiency. Hence may appear what is to be thought of… [the statement] “The blood of Christ was a sufficient price for the sins of all the world;” –which last expression is corrected by some, and thus asserted, “That the blood of Christ was sufficient to have been made a price for all;” which is most true, as was before declared: for its being a price for all or some does not arise from its own sufficiency, worth, or dignity, but from the intention of God and Christ using it to that purpose, as was declared; and, therefore, it is denied that the blood of Christ was a sufficient price and ransom for all and every one, not because it was not sufficient, but because it was not a ransom. And so it easily appears what is to be owned in the [Lombardian] distinction itself before expressed. If it intend no more but that the blood of our Savior was of sufficient value for the redemption of all and every one, and that Christ intended to lay down a price which should be sufficient [emphasis added; note this is consistent with being in the realm of hypothesis] for their redemption, it is acknowledged as most true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Intro | Owen explains his rationale in this way (note his hypothetical and contrary-to-fact language):</span></figcaption>

</figure><figure class="quote" id="q-cd865c3ee5" data-kw="">
<blockquote><p>As for the universal Redemption of all and every man, it is no better then a forgery of man’s brain. There shall be many in the day of judgement of whom Christ shall say, that he never knew them. Again he saith, He which believeth not is already judged, and the wrath of God abides upon him. But if all were effectually redeemed, &amp; only condemned for not believing in Christ, it should have been said that they are already judged, and that the wrath of God not abides but returns upon them. Christ makes no intercession for the world: and therefore his redemption is not effectual to all men. For the intercession is the means of applying the satisfaction.

If it be said that by the world is meant only contemners of grace, it appears to be otherwise in that Christ opposeth the world to them which are the fathers, and are given to Christ by him: thereby signifying that by the world he means all such as are not the fathers, and were never given to Christ. And he lays down his life for his sheep: now the sheep have all these brands or marks; they hear his voice, they know him, they follow him, they shall not perish, none shall pluck them out of Christs hands: and these are only such of whom Paul saith; Who shall lay any thing to the charge of Gods elect: it is God that justifieth who shall condemn? And if this should be true, that Christ was crucified and died no less to make satisfaction for the sins of the damned, then for the sins of Peter and Paul and the rest of the Saints, it follows necessarily that all their sins are forgiven: considering that remission of sin depends inseparably upon satisfaction made to Gods justice for sin: and satisfaction doth necessarily abolish all fault.

We grant that Christ’s death is sufficient to save many thousand worlds: we grant again it is every way most effectual in it self: but that it is effectual in, or unto the person of every man, that we deny. For if it were thus effectual, then it should be applied to the person of every man, as to Cain, Judas, Nero, Heliogabalus, &amp;c. even as the plaster is laid to the sore: being applied, Christs righteousness should be imputed for the justification and sanctification of all and every man: and thus some justified before God and sanctified should after go to hell and be damned, whereas David, never so much as dreaming of this divinity saith, that they are blessed which have the pardon of their sins: and Paul, that they which are justified have peace with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), pp 478-79.</span></figcaption>

<blockquote><p>‘Tis for a Soul to sit down satisfied with what God is, as all, and so it lies in a full and ample satisfaction, in, and with the Divine presence and fulness: ‘Tis for a Soul to take up, in, and with the blessed God, as his only and all-sufficient Portion and happiness for ever. God, my Beloved, is an All-sufficient God, he asserts his own All-sufficiency, Gen. 17.1. I am God all-sufficient, (says he to Abraham) q. d. I am infinitely sufficient for my self, and I am infinitely sufficient for thee and all my People, to make the one and the other happy for ever. God is an inexhaustible Fountain of Light, Life, Love, Blessedness, Perfection and Glory; there is all good in God, and he that has God has all. To him that overcometh will I give to inherit all things: And how so? I will be his God, Rev. 21.7. He has all good, all happiness in him, and in him we may find all as in its Fountain-fulness and purity.

Now the Soul, seeing God to be such a God, and withal looking upon him as his God in Covenant, sits down satisfied with him alone, saying, I have enough, I have all, and so is at Rest in him, whether he has much or little, any thing or nothing of this world’s good; whether the streams run high or low with him, yet here is a Fountain of infinite sweetness and blessedness, and he drinks there, and satisfies himself there; he sees the Fountain is so full, that he needs not the streams to make him happy, and accordingly sits down satisfied therewith, and is at Rest: Thus David’s Soul was at Rest in God, Ps l. 16.5, 6. the Lord is the portion of mine Inheritance, and of my Cup: Well, and what then? Why he sits down at Rest in him, the lines (says he) are fallen to me in pleasant places yea, I have a goodly heritage; I have enough, enough for delight, and enough for satisfaction; I have as much as my Soul can wish or desire; so Psal. 17.15. As for me, I will behold thy Face in Righteousness, I shall be satisfied, when I awake, with thy likeness; in the verse immediately preceding he had spoken of some whose portion and happiness is in this World; well, and pray David where and in what is your Portion, your happiness?

My Portion is in God, and my Happiness is in God, (says he) in the sight of God, and in the likeness of God; let others take up their Rest, Portion and Happiness where and in what they will, God is my Rest, my Portion, my Happiness, my All for ever: as for me I will behold, &amp;c. Again, the Lord lives, (says he) and blessed be my Rock, Psal. 18.46. q. d. such and such Comforts are dead and gone, they are not, (as Jacob spake of his sons) well, but however God lives still, I have a living God, and he is a living Happiness, and that’s enough. So 2 Sam. 23.5. Although my House be not so with God, yet he hath made with me an everlasting Covenant, ordered in all things, and sure, and this is all my Salvation, and all my desire, q. d. God is my God by Covenant, and here is my happiness, even all that my Soul can wish, and accordingly he is at Rest in his God: And Psal. 73.25, 26. Whom have I in heaven but thee? and there is none upon Earth that I desire in comparison of thee: my heart and my flesh faileth, but God is the Rock of my heart, and my Portion for ever.

How dark soever things looked with him, yet he, looking to his God, was satisfied and at Rest in him, and with him, as infinitely enough for him. The Prophet Habakkuk resolved upon the same course, Hab. 3.17, 18. Although the Fig-tree shall not blossom, neither shall Fruit be in the Vines; the labour of the Olive shall fail, &amp;c. yet will I rejoice in the Lord, I will joy in the God of my Salvation: He supposes the worst that could come, and yet still resolves to be at Rest in God, and that God alone shall be enough for him, when all other things fail.

Thus the holy Soul sits down satisfied with God alone, setting God, and an interest in God, over and against all his Wants, Losses, Burthens, Difficulties, Temptations, as one infinitely able to relieve and satisfy him under all; his language to God is, Lord, let others take the Word, and the good things thereof, give me thy Self, and I have enough; run out to broken Cisterns who will, let me have a free recourse unto the Fountain, and I am satisfied; ’tis true, the Tide of Creature-comforts runs low with me, and on the other hand, the Waves and Surges of Affliction rise high; but God is all-sufficient, and I have enough in him; he sees a little of that glorious Fullness, Sweetness and Blessedness that is in God, and hereupon sings an holy Requiem unto himself, saying, Soul take thine ease, thou hast Goods, Light, Life, Love, Blessedness, Salvation enough laid up for thee for many days, yea for the days of Eternity, take thine ease, sit down satisfied in and with thy God alone; had’st thou ten thousand Worlds, without him thou had’st nothing, but in him thou hast all, Rest thou therefore in him. Thus you see what ’tis for a Soul to be at Rest in God, and when he may be said to be at Rest in him.</p></blockquote>

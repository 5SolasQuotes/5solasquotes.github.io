<main class="wrap"><figure class="quote" id="q-45e0471d7c" data-kw="">
<blockquote><p>Lastly, they say, ‘Rome cannot be the whore [in Rev. 17], because (forsooth) of her holiness,’ and what is that? There are so many abbacies, mortifications, holy Churchmen, relics and temples of saints, many masses and such like there, etc. All which serve not to prove this conclusion, that she is so. And it is not unobserveable that immediately after this answer, Cornelius à Lapide, professor at Rome, does justify the toleration of stews and brothel-houses in it, as a thing tending to prevent much sin and becoming a well-ordered commonwealth; And when this is mentioned by them as a piece of Rome’s holiness, we may the more easily judge of the rest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation (1658) ch. 17, Lecture 6</cite>, p. 675</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-9e57d95fbe" data-kw="">
<blockquote><p>…a Puritan was a man supremely concerned about conscience… The concern which was really supreme in the minds and hearts of the people called Puritans was a concern about God—a concern to know Him truly, and serve Him rightly, and so to glorify Him and to enjoy Him. But, just because this was so, they were in fact very deeply concerned about conscience, for they held that conscience was the mental organ in men through which God brought His Word to bear on them. Nothing, therefore, in their estimation, was more important for any man than that his conscience should be enlightened, instructed, purged, and kept clean. To them, there could be no real spiritual understanding, or any genuine godliness, except as men exposed and enslaved their consciences to God’s Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-i-packer.html">J. I. Packer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Puritan Conscience’ in Puritan Papers, Vol. Two: 1960-1962 (P&amp;R, 2001)</cite>, pp. 237-257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<main class="wrap"><figure class="quote" id="q-3ee62f6ad6" data-kw="">
<blockquote><p>Speaking at Inverness on 25 April 1638, Andrew Mant reminded the Covenanters that the Scottish Reformation was far superior to that in England and even that in Geneva. This was because the Scots had got rid of popish innovations, such as holy days, which other Reformers had not been able to extirpate:

LONG ago our gracious God was pleased to visit this nation with the light of His glorious Gospel, by planting a vineyard in, and making His glory to arise upon Scotland. A wonder! that so great a God should shine on so base a soil! Nature hath been a stepmother to us in comparison of those who live under a hotter climate, as in a land like Goshen, or a garden like Eden. But the Lord looks not as man: His grace is most free, whereby it often pleaseth Him to compense what is wanting in nature: whence upon Scotland (a dark obscure island, inferior to many) the Lord did arise, and discovered the tops of the mountains with such a clear light, that in God’s gracious dispensation, it is inferior to none. How far other nations outstripped her in naturals, as far did she out-go them in spirituals. Her pomp less, her purity more: they had more of antichrist than she, she more of Christ than they: in their reformation something of the beast was reserved; in ours, not so much as a hoof. When the Lord’s ark was set up among them, Dagon fell, and his neck brake, yet his stump was left; but with us, stump and all was cast into the brook Kidron. Hence king James his doxology in face of parliament, thanking God who made him king in such a kirk that was far beyond England (they having but an ill-said mass in English) yea, beyond Geneva itself; for holy-days (one of the beast’s marks) are in part there retained, which (said he) to day are with us quite abolished. […] Such was the glory, perfection, order, and unity of this house, that the altar of Damascus could have no peace, the Canaanite no rest, heresy no hatching, schism no footing, Diotrephes no incoming, the papists no couching, and Jezebel no fairding [sic].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-cant.html">Andrew Cant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The National Covenant: exhortation at Inverness in James Kerr (ed.), The Covenants and the Covenanters: covenants, sermons, and documents of the Covenanted Reformation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ba4f4a651c" data-kw="">
<blockquote><p>The most of the persons whom the Papists now keep holy days for were very religious godly people: And the zealous religious people of that age did think that the honoring of the memories of the martyrs was a great means to invite the infidels to Christianity and to encourage the weak to stick to Christ: and therefore they kept the days of their martyrdom in thanksgiving to God and in honor of them. The wicked of that age hated and persecuted both the martyrs and them that honored them. In the next age, religion being uppermost in the world, the wicked did turn hypocrites and keep holy days for the honor of their names whom their forefathers murdered. At last when it was observed that the Papists who burned the living saints were the greatest honorers of the dead, the most religious people turned quite to dislike and reject those very days which their predecessors had set up in thanksgiving to God for the doctrine, example and constancy of the martyrs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, ‘Take heed of superstition, and observe well the circular course of zealous superstition…’, p. 280</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0ca535bb87" data-kw="">
<blockquote><p>It deserves our attention that Christ says that he gave an example; for we are not at liberty to take all his actions, without reserve, as subjects of imitation. The Papists boast that, by Christ’s example, they observe the forty days’ fast, or Lent. But we ought first to see whether or not he intended to lay down his fast as an example, that the disciples might conform to it as a rule. We read nothing of this sort, and, therefore, the imitation of it is not less wicked than if they attempted to fly to heaven. Besides, when they ought to have followed Christ, they were not imitators, but apes. Every year they have a fashion of washing some people’s feet, as if it were a farce which they were playing on the stage; and so, when they have performed this idle and unmeaning ceremony, they think that they have fully discharged their duty, and reckon themselves at liberty to despise their brethren during the rest of the year. But—what is far worse—after having washed the feet of twelve men, they subject every member of Christ to cruel torture, and thus spit in Christ’s face. This display of buffoonery, therefore, is nothing else than a shameful mockery of Christ. At all events, Christ does not here enjoin an annual ceremony, but bids us be ready, throughout our whole life, to wash the feet of our brethren and neighbours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, trans. William Pringle, vol. 2 (Logos Bible Software, 2010), 61–62.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-f75031eb4f" data-kw="">
<blockquote><p>Q. May the church appoint holy days, to remember Christ’s birth, death, temptation, ascension, &amp;c.?

A. No: as God hath abolished the Jewish holy-days of his own appointment, so he hath given no warrant to the church to appoint any; but hath commanded us to labour six days, except when Providence calls to humiliation or thanksgiving; and expressly forbids us to observe holy-days of men[’]s appointment, Col. ii. 16. Gal. iv. 10, 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An essay towards an easy, plain, practical, and extensive explication of the Assembly’s Shorter Catechism</cite>, (Carlisle, 1747), p. 228.</span></figcaption>

</figure><figure class="quote" id="q-d8b6704766" data-kw="">
<blockquote><p>The Religion, Doctrine and Discipline received, believed and defended by the Church of Scotland, and namely the public ministration of Baptism, and the Lord’s Supper, sitting at the table in the act of receiving the bread and wine of that Sacrament, the observation of the Lord’s Day, and the examination of children, for the first time at the ninth year of their age, for the second at the twelfth, for the third at the fourteenth, excluding and abhorring private baptism, private communion, kneeling in the act of receiving the Supper, holy days, or feast of Christmas, Passion, Resurrection, Ascension and sending down of the Holy Ghost: were brought in at the reformation of religion [in 1560], and enjoyed ever since in manner and form as follows. After due trial and advertisement taken of the heads in general and particular above written, the whole church was of one heart and judgment concerning the same…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, 1619, p. 24</span></figcaption>

<main class="wrap"><figure class="quote" id="q-bcd8e05fc5" data-kw="">
<blockquote><p>Read and do, read and practise what you read, or else all your reading will do you no good. He that hath a good book in his hand, but not a lesson of it in his heart or life, is like that ass that carrieth burdens, and feeds upon thistles. In divine account, a man knows no more than he doth. Profession without practice will but make a man twice told a child of darkness …

There is no fear of knowing too much, though there is much fear in practising too little; the most doing man shall be the most knowing man; the mightiest man in practice will in the end prove the mightiest man in Scripture, John vii. 16, 17, Ps. cxix. 98-100. … The true reason why many read so much and profit so little is, because they do not apply and bring home what they read to their own souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 291-92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-b55ea98a8d" data-kw="">
<blockquote><p>Having been requested to write a Preface to a reprint, in Ireland, of an American treatise on the Psalmody of Christian worship, I have most cheerfully complied; — partly on account of the importance of the subject — partly on account of the talent displayed in the work — and partly that, by a detail of my own experience, I may add my humble testimony to a great principle.

My earliest recollection of family and public psalmody is that of the exclusive use of the English version of the Biblical Psalms, authorized by the Reformed Church of Scotland. In our Presbyterian Churches, so far as my knowledge extends, others were unknown. When I entered the ministry, in 1807, the Scottish selection of Paraphrases and Hymns had come into partial use; and influenced by the feeling in their favour, I was gradually led to adopt them. The principle of their use once adopted, the way to others was opened to an unlimited extent; for if these paraphrases and hymns be good for public worship, it follows that others may be as good, or better.

Accordingly, at one time of my ministry, I dedicated both time and pains to selecting, from all accessible sources, an additional volume, with an essay, embodying a defence of its use in private or in public worship. I need scarcely add, that I believed my arguments — which were partly original, and partly derivative — to be unanswerable. I shall now detail, and as briefly as may be, the circumstances that first led me to doubt, and finally to reject my former conclusions.

Having been appointed to a short missionary tour, I left my home in good health, but was taken suddenly ill, and, during a month, was unable to return; and it was when “wearisome nights were appointed to me, and tossings to and fro until the dawning of the day,” that, in frequent solitude, I was thrown, almost entirely, on the resources of memory.

But with that faculty God had sufficiently endowed me; and the psalms committed in school-boy days, and paraphrases and hymns of riper years, presented ready subjects of meditation. And it was then, that, all unexpectedly, yet irresistibly, it was impressed upon me, by experience and feeling, that the most celebrated hymns of uninspired men were, like Job’s friends, “miserable comforters,” when compared with the experience of Christ, in the days of humiliation, of which the Book of Psalms is the true prophetic picture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-cooke.html">Henry Cooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to The True Psalmody; or, The Bible Psalms the Church’s Only Manual of Praise (Belfast: James Johnston, 1861).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-e6b9a9fb6c" data-kw="">
<blockquote><p>The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church</cite>, (1544) in Tracts &amp; Letters relating to the Reformation, tr. &amp; ed. Henry Beveridge, 7 vols. (Edinburgh: Calvin Translation Society, 1844), 1.189</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>My being present and hearing of a Conformist [minister is] no approbation of the evil of his conformity, and so no occasional or transient relation is raised thereby. Approbation is an act of the mind or heart; It is not showed to him or others by me until it be expressed outwardly by my words or gestures, which I have not in this case any occasion to do, his evil being done elsewhere and formerly, and not in our presence that now hear him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3, p. 16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“My being present and hearing of a Conformist [minister is] no approbation of the evil of his conformity, and so no occasional or transient relation is raised thereby. Approbation is an act of the mind or heart; It is not showed to him or others by me until it be expressed outwardly by my words or gestures, which I have not in this case any occasion to do, his evil being done elsewhere and formerly, and not in our presence that now hear him.”

— Philip Nye, A Case of Great &amp; Present Use, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3, p. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMy+being+present+and+hearing+of+a+Conformist+%5Bminister+is%5D+no+approbation+of+the+evil+of+his+conformity%2C+and+so+no+occasional+or+transient+relation+is+raised+thereby.+Approbation+is+an+act+of+the+mind+or+heart%3B+It+is+not+showed+to+him+or+others+by+me+until+it+be+expressed+outwardly+by+my+words+or+gestures%2C+which+I+have+not+in+this+case+any+occasion+to+do%2C+his+evil+being+done+elsewhere+and+formerly%2C+and+not+in+our+presence+that+now+hear+him.%E2%80%9D%0A%0A%E2%80%94+Philip+Nye%2C+A+Case+of+Great+%26+Present+Use%2C+%5BSolemn+League+%26%5D+Covenant+%26+Some+of+them+%5Bare%5D+Supposed+to+be+Scandalous+in+their+Lives%2C+Considered+%26+Affirmatively+Resolved+%281672%3B+1677%29%2C+Consideration+3%2C+p.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffbeca688eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fbeca688eb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=My%20being%20present%20and%20hearing%20of,our%20presence%20that%20now%20hear%20him&amp;text=My%20being%20present%20and%20hearing%20of%20a%20Conformist&amp;text=not%20in%20our%20presence%20that%20now%20hear%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

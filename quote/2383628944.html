<main class="wrap"><figure class="quote" id="q-2383628944" data-kw="">
<blockquote><p>We do observe beautiful things through our senses, but the property by which they are beautiful is not perceivable through the senses. Animals have perceptions and representations of beautiful things, but they do not know the beautiful. They know only the useful and the pleasant. For that reason, the perception and recognition of the beautiful, also in sensory things, belongs to the higher faculty of knowing, to reason… Beauty is something that the beholding of which delights a person. Something is good insofar as it, when it is recognized by us, is desirable to our will. But beauty is what stimulates not our desire in a narrow sense, but our pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921), p. 164</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4aab833104" data-kw="">
<blockquote><p>Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, 2nd pt. of 2nd pt., question 158, ‘Anger’, article 2, ‘Whether anger is a sin’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-d8eea88569" data-kw="">
<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4. 4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Answer of Mr. John Cotton of Boston in New-England, to the aforesaid Arguments Against Persecution for Cause of Conscience</cite>, …’ in Roger Williams, The Blovdy Tenent of Persecution for Cause of Conscience, Discussed in a Conference… (London, 1644), p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-b7b05140f9" data-kw="">
<blockquote><p>And one thing is surely right in Kant’s argument, which is that the experience of beauty, like the judgement in which it issues, is the prerogative of rational beings. Only creatures like us—with language, self-consciousness, practical reason, and moral judgement—can look on the world in this alert and disinterested way, so as to seize on the presented object and take pleasure in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre</cite>, (Oxford University Press, 2011), pp. 27-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

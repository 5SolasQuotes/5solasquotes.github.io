<main class="wrap"><figure class="quote" id="q-09e5019974" data-kw="faith alone means union">
<blockquote><p>So great is the necessity of faith in the matter of salvation that as Christ alone is the cause of salvation, so faith alone is the means and way to Christ. Hence it is celebrated as the bond of our union with Christ because he dwells in us by faith (Eph. 3:17); as the condition of the covenant of grace under which salvation is promised to us; as the instrument by which we receive Christ with all his benefits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.7.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/faith-as-a-gift.html">Faith as a gift</a></span><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a> › <a href="../topics/union-with-christ/nature-of-union/vital-union.html">Vital union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7251b10f7e" data-kw="">
<blockquote><p>By justifying faith we understand, not only the common belief of the articles of the Christian religion, and a persuasion of the truth of God’s Word in general, but also a particular application of the gracious promises of the gospel to the comfort of our own souls, whereby we lay hold on Christ with all His benefits, having an earnest trust and confidence in God, that He will be merciful unto us for His only Son’s sake. So that a true believer may be certain, by the assurance of faith, of the forgiveness of his sins, and of his everlasting salvation by Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-ireland.html">Church of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Irish Articles</cite>, 1615, Art. 37</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a87fa16892" data-kw="">
<blockquote><p>…the precepts of the natural law are general, and require to be determined: and they are determined both by human law and by Divine law. And just as these very determinations which are made by human law are said to be, not of natural, but of positive law; so the determinations of the precepts of the natural law, effected by the Divine law, are distinct from the moral precepts which belong to the natural law. Wherefore to worship God, since it is an act of virtue, belongs to a moral precept; but the determination of this precept, namely that He is to be worshipped by such and such sacrifices, and such and such offerings, belongs to the ceremonial precepts. Consequently the ceremonial precepts are distinct from the moral precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, pt. 1</cite>, Question 99, ‘Of the Precepts of the Old Law’, Article 3, ‘Whether the Old Law comprises ceremonial, besides moral, precepts?’, Reply to Objection 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-26f022a668" data-kw="">
<blockquote><p>…but it [instituted worship] concerns those outward ways and means whereby God has appointed that faith, and love, and fear of Him to be exercised and expressed unto his glory. And this kind of worship, though it depend not upon the nature of God, but upon his free and arbitrary disposal, and so was of old liable unto alterations, yet God did ever strictly require in the several states and conditions that his Church has gone through in the world. And this is that, which most commonly in the Scripture is called by the name of the worship of God; as that whereby all the acceptable actings of the souls of men towards him are expressed, and the only way of owning and acknowledging Him in the world, as also of entertaining a visible intercourse with Him. This therefore He calls for, and requires indispensibly of all that draw nigh to Him, and that because He is the Lord our God, Rev. 14:6-7; Mt. 4:10; Dt. 10:12-13. For his observance hereof does He so approve of Abraham, Gen. 18:19, and sets it down as an everlasting Law unto all others that in a holy observation thereof He will be sanctified in all that draw nigh unto Him, Lev. 10:1-3. His commands also concerning it are multiplyed in the Scripture, with the approbation of all those that attend unto them. We may not think to find acceptance with God or to inherit the promises, if supposing ourselves to adhere unto Him in worship internal and natural, we neglect that which is external and of his free appointment: for besides, that we renounce thereby our inward dependance on Him also in not observing his commands, as Adam did in transgressing an institution, we become wholly useless unto all the ends of his glory in the world, which is not the way to come to an enjoyment of Him. Neither do we only express and profess our inward moral, natural worship of God hereby, by which means it becomes the principal way and instrument of faith and trust exerting themselves in our obedience, but also it is a most effectual help and assistance unto the principle of that natural worship, strengthening the habit of it, and exciting it unto all suitable actings, unto its increase and growth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667) | Question 1, pp. 2-4</span></figcaption>

</figure><figure class="quote" id="q-76b56e04c0" data-kw="">
<blockquote><p>There are three fundamental principles held by non-conformists (and those especially of them which are called presbyterians) wherein they differ from others: 1. That the Scriptures of the Old and New Testament are a perfect Rule for Christians, directing them not only what to believe in the things of God, but also what to do in all matters relating to the Worship of God, and the government of the Church; so as in these things they may not either believe or do what is not there expressly, or by immediate consequence revealed. In civil matters they believe the Scripture to be only a general rule, or rather as to them, to contain some general rules only, by which all men’s actions are to be directed; but in sacred things, they believe the Scriptures to be a particular rule… Thus they differ from Papists, who will not allow the Scriptures to be a perfect rule as to matters of faith; and from those, who although they allow them in matters of faith a perfect rule, yet deny them to be so in the matters of worship, or government of the Church; and as to the first, say that the Scriptures are only a perfect rule as to acts of worship, not as to means, and modes, or religious rites used in, and about the worship of God; but that these may be directed by superiours for spiritual edification; or who say, that the Scripture has only directed that the Church should be governed, but has left to superiours to determine by what officers, acts and rules that government should be exercised: So as the first and main question is, Whether the Scriptures be a perfect and sufficient rule for Christians in matters of worship, and Church government, as well as matters of faith? which those called presbyterians believe it is; because they find sufficient directions in it for the decent and orderly performance of all acts of worship, without any human supplements; and such Church-officers directed by it, such acts of jurisdiction and censures prescribed in it, as are sufficient to preserve the unity, peace and purity of the Church; which are the great ends of that government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-presbyterians.html">English Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anonymous, English Presbytery, or an Account of the Main Opinions of those ministers and people in England who go under the name of Presbyterians</cite>, … (London, 1680), pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Application 1: This may first let us see that notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field. Rome has long doted on Peter’s Chair, and Jerusalem might as well have bragged of her privileges as any other place, but Christ leaves them: Never rest we then in any outward estate, for Christ may leave us. The Palatinate [Germany] has been as reformed as any Church for doctrine, and though they might say, their bed was green, and their beams were of cedar, and their rafters of fir, yet God has left them: for do we think that if God had been there, these things had befallen them that now are.</p></blockquote>

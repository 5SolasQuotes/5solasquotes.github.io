<main class="wrap"><figure class="quote" id="q-95ae612f15" data-kw="">
<blockquote><p>B.—You have not forgotten, I imagine, what is said by the poets of the furies, and by the populace of devils, that they are spirits hostile to the human race, and, in the midst of their own eternal torments, delighting in the torture of men. This is certainly a true picture of tyranny. But, since this picture is discernible only to the mind, and without sensation, I shall offer you another, which will impress not only your mind, but your senses, and rush upon your eyes almost palpably visible. Imagine yourself viewing a ship at sea, tossed by storms, and all the shores around not only destitute of harbours, but full of inveterate enemies.

Imagine also the master of that ship engaged in a mutual contest of hatred with the passengers, and yet having no hopes of safety but in the fidelity of the sailors, and even those not certain, as he cannot be ignorant that his life is in the hands of a barbarous class of men, strangers to all humanity, retained in their duty solely by proffers of money, and easily tempted to his destruction by the prospect of greater hire. Such, positively, is the life embraced by tyrants as a state of beatitude. Abroad they dread open enemies, at home their subjects; and not only their subjects, but their domestics, their relations, their brothers, their wives, their children, and their parents. Accordingly, they always either wage or dread an external war with foreigners, a civil war with their subjects, or a domestic war with their relations, and never expect any assistance but from hirelings, and dare not hire the good nor trust the bad.

What enjoyment then can life be to such men? Dionysius, dreading the application of a razor to his throat, would not permit his daughters, ladies of adult age, to supply the place of a barber. His brother was murdered by Timoleon, the Pheræan Alexander by his wife, and Spurius Cassius by his father. What racks must the man, who has these examples constantly before his eyes, carry in his breast, when he considers himself erected as a mark at which all mankind are to shoot their arrows? when he is tormented by the stings of conscience, not only when awake, but is roused even in his sleep by the terrific images of the living and the dead, and pursued by the furies shaking their torches? For the time assigned by nature to all animals for repose, and to men as a relief from cares, becomes to him all horror and despair?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-buchanan.html">George Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland</cite>, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), pp 44-45.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-77acffe85c" data-kw="">
<blockquote><p>For they are monsters and no men, that are unnatural toward their parents; and especially they which do not only neglect and despise them, but also beat and uncourteously handle them. Such fellows doth the Lord command to be slain, as people unworthy to see the light, because they forget and will not acknowledge, that by means of their parents the came into the world. “He that curseth father or mother,” saith the Lord, “let him die the death.” And again: “He that striketh his father or mother, let him die the death.” [Exodus 21:15, 17]</p></blockquote>

</figure><figure class="quote" id="q-4e8419ac74" data-kw="">
<blockquote><p>And it is most false that we join with Jesuits.

1. We teach no more against tyrants, in exercitio [in the exercise], than Grotius, Barclay, and Winzetus, in the matter of deposing kings; and in this, royalists conspire with Jesuits.

2. We deny that the Pope may loose subjects from the oath of fidelity when a king turns heretical.

3. That people, at the Pope’s commandment, are to dethrone kings for heresy; so do the prelates and their fellows, the papists, teach; so Gregory VII practised; so Aquinas taught, (2 of 2 q. 12, art. 2), Antonin. [sum. part 3, t. 22, ch. 3, sect. 7), “Thou hast put all things under the Pope’s feet,” oves, id est, Christianos; boves. Judceos et hereticos ; pecora, Paganos; so Navar. (bk. 1, ch. 13); Pagans have no jurisdiction. Jaco. Symanca, (de Catho. Instit., tit. 45, n. 25). “Catholica uxor heretico viro debitum reddere non tenetur.” Item, Constat, haereticum privatum esse omnidominio, naturali, civili, politico, naturali quod habet in filios, nam propter hceresin patris ejjiciuntur jilii sui juris, civili, quod habct in servos, ab eo enim scrvi liberantur, politico, quod rerum domini habcnt in sxtbditos, ita Bannes, (22. q. 12, art. 10); Gregor. de valent., 2 of 2, dis. 1, q. 12, p. 2, lod. Mol. to. 1, de just, et jur. tract. 2, dis. 29, v. 3).</p></blockquote>

<blockquote><p>Magistrates, who should know theology and should have the law before their eyes (Deut. 17:18-20; Josh. 1:8; Psalm 19), prescribe it for their subordinates (2 Chron. 17:7-9; Josh. 24:14ff.), protect it against enemies, as nursing fathers of the church (Isa. 49:23; 60:16) and as guardians of both tables of the law, and propagate it (Gen 18:19). In sum they should, in all ways, kiss Christ (Ps. 2:10-12), so that their polity becomes a theocracy, that is, a Christocracy.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Magistrates, who should know theology and should have the law before their eyes (Deut. 17:18-20; Josh. 1:8; Psalm 19), prescribe it for their subordinates (2 Chron. 17:7-9; Josh. 24:14ff.), protect it against enemies, as nursing fathers of the church (Isa. 49:23; 60:16) and as guardians of both tables of the law, and propagate it (Gen 18:19). In sum they should, in all ways, kiss Christ (Ps. 2:10-12), so that their polity becomes a theocracy, that is, a Christocracy.”

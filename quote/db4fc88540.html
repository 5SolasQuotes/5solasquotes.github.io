<main class="wrap"><figure class="quote" id="q-db4fc88540" data-kw="">
<blockquote><p>Nor may it be gathered from this that this is merit de condigno; for even though it is from God, yet it is not from God dwelling within through justifying grace, but from God stirring up and helping from without … and moreover it is from God beginning and initiating, not yet completing and perfecting. Hence it is a merit begun and imperfect; and it has some dignity and proportion to its end, but not so great as merit de condigno requires. Finally, there is lacking, as we said, a pact properly so called, without which there can be no merit out of justice, or de condigno.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 1, ch. 21 (translated from the Latin)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-eca3f1de29" data-kw="">
<blockquote><p>There are those who think that the good works of the just are meritorious of eternal life ex condigno by reason of the work, even if no divine agreement existed. So Cajetan teaches. … Others, on the contrary, think that good works proceeding from grace are not meritorious ex condigno by reason of the work, but only by reason of the pact and of divine acceptance. So Scotus teaches. … To us the middle opinion seems more probable, which teaches that the good works of the just are meritorious of eternal life ex condigno by reason of the pact and of the work together; not indeed that without the pact or acceptance a good work has no proportion to eternal life, but because God is not bound to accept a good work for that reward, even though it be equal and on a par with the reward, unless an agreement intervene.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-1d5aa59359" data-kw="">
<blockquote><p>There remains the last question, whether God rewards good works out of mere liberality beyond what is condign. For the common opinion of theologians constantly affirms this.</p></blockquote>

</figure><figure class="quote" id="q-14a3722262" data-kw="">
<blockquote><p>Filial adoption, in making us partakers by grace in the divine nature, can bestow true merit on us as a result of God&#x27;s gratuitous justice. This is our right by grace, the full right of love, making us &quot;co-heirs&quot; with Christ and worthy of obtaining &quot;the promised inheritance of eternal life.&quot; The merits of our good works are gifts of the divine goodness.</p></blockquote>

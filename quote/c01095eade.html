</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6b97d5bd72" data-kw="">
<blockquote><p>As there is an itching after new doctrine in some, so is there for division in others. Gal. 5:19-20, ‘Now the works of the flesh are manifest; which are these, hatred, variance, emulations, wrath, strife, seditions.’ The Greek word dicostasias [***], there rendered “seditions,” signifies a renting of those who ought to be united in one common society. Jude 19, there says the apostle, ‘These are they who separate themselves, sensual, not having the Spirit.’ Sometimes separatists have made high pretenses to the Spirit, and yet been sensual. And the Assembly 1641, in their act against impiety and schism in meetings for mutual edification, having advised to eschew all such meetings as are apt to bread error, scandal and schism, they expressly say, “These are works of the flesh, but not of the Spirit, and are contrary to truth and peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-834e490251" data-kw="">
<blockquote><p>Hamilton seems to have felt that the tyranny of the times called for more positive action on the part of those who adhered to the [non-conforming, field-preaching] Presbyterian cause, and he is said to have tried, during the summer of 1678, to stir up some of the people in the west into an armed rising against the government [previously the battles had all been defensive]. Whether this allegation is well-founded cannot conclusively be proved… Feelings on the subject [of the Indulgence] ran high, and Cameron and Hamilton were accused of spreading dissension and disunity among the people and of causing disaffection towards ministers who did not share their radical opinions.</p></blockquote>

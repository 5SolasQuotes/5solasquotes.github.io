<main class="wrap"><figure class="quote" id="q-508dcc22dd" data-kw="">
<blockquote><p>…as I will show in more detail, the Anglican formularies do indeed prohibit all icon veneration… His [Dr. Hoskin’s] most important point is the “distinction between worship and veneration.”… The Reformation position cannot be easily sidestepped by the use of distinctions which the Reformers themselves understood and rejected… The rest of this essay will highlight confessional statements from various Reformation churches, including the Anglicans and the Lutherans, to show that there is no place for the veneration of images… Indeed, the rejection of image veneration is a truly pan-Protestant position… Still, the historical record is clear. The Protestant confessions give no allowance for the veneration of icons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-wedgeworth.html">Steven Wedgeworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Place of Images in the Venerable Protestant Tradition’</cite>, (2023) at Ad Fontes</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-498d889bda" data-kw="">
<blockquote><p>‘The honor rendered to the image passes to the prototype,’ to the model or original… This is the locus classicus of the defenders of the images in the Byzantine Iconoclastic Controversy… The sentence just cited is taken from St. Basil’s late fourth century anti-Arian treatise On the Holy Spirit, where it had served to illustrate the unifying image relation of the Son to the Father in the Divine Trinity, a relation first expressed by St. Paul when he said that Christ was the Image of God.</p></blockquote>

</figure><figure class="quote" id="q-046661d6e9" data-kw="">
<blockquote><p>2. How does [Richard] Hooker prove that the vessels made for Baal are in their own nature more incurable than the sign of the cross? You may remove the superstitious intention and idolatrous use of any vessel and turn it to a good use; yet Josiah burnt them to ashes. The like may be said of the groves which he stamped to powder and cast in the brook Kidron, and of the chariots five of the sun which he burnt with fire, and of the bones of dead men, not any of these being of their own nature more indifferent and innocent creatures of God, [nor] were of their own nature more scandalous and more incurable than the sign of the cross. The like may be said of altars…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty, pp. 91-92</span></figcaption>

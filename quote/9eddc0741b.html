<blockquote><p>Nineteenth-century Thomists like Joseph Kleutgen (1811-83) sought to revive the Aristotelian-Thomistic tradition in the face of these modern developments, and their efforts were massively aided by Pope Leo XIII’s encyclical Aeterni Patris (1879), which called for a renewal of Thomism, and of Scholastic philosophy in general. The result was a Neo-Thomistic and Neo-Scholastic movement which marked a third phase in the history of Thomism, dominated Roman Catholic thought until the Second Vatican Council (1962-65), and has dramatically influenced the modern understanding of Aquinas’s thought down to the present day. Several schools of thought describing themselves as ‘Thomistic’ have developed over the course of the last century or so, each representing a different response to the characteristic themes and assumptions of modern philosophy. Since they have had such a profound influence on the contemporary debate over Aquinas’s thought, it will be worthwhile briefly to describe the main positions: 1. Neo-Scholastic Thomism: The dominant tendency within Thomism in the first decades after the revival sparked by Leo’s encyclical, this approach is reflected in many of the manuals and textbooks widely in use in Roman Catholic colleges and seminaries before Vatican II. Due to its emphasis on following the interpretative tradition of the great commentators on Aquinas (such as Capreolus, Cajetan, and John of St. Thomas) and associated suspicion of attempts to synthesize Thomism with non-Thomistic categories and assumptions, it has also sometimes been labeled “Strict Observance Thomism.” Still, its focus was less on exegesis of the historical Aquinas’s own texts than on carrying out the program of deploying a rigorously worked out system of Thomistic metaphysics in a wholesale critique of modern philosophy. Its core philosophical commitments are summarized in the famous “Twenty-Four Thomistic Theses” approved by Pope Pius X. Reginald Garrigou-Lagrange (1877-1964) is perhaps its greatest representative. 2. Existential Thomism: Etienne Gilson (1884-1978), the key proponent of this approach to Thomism, tended to emphasize the importance of historical exegesis but also to deemphasize Aquinas’s continuity with the Aristotelian tradition, highlighting instead the originality of Aquinas’s doctrine of being or existence. He was also critical of the Neo-Scholastics’ focus on the tradition of the commentators, and given what he regarded as their insufficient emphasis on being or existence accused them of ‘essentialism’ (to allude to the other half of Aquinas’s distinction between being and essence). Gilson’s reading of Aquinas as putting forward a distinctively ‘Christian philosophy’ tended, at least in the view of his critics, to blur Aquinas’s distinction between philosophy and theology. Jacques Maritain (1882-1973) introduced into Thomistic metaphysics the notion that philosophical reflection begins with an ‘intuition of being,’ and in ethics and social philosophy sought to harmonize Thomism with personalism and pluralistic democracy. Though “existential Thomism” was sometimes presented as a counterpoint to modern existentialism, the main reason for the label is the emphasis this approach puts on Aquinas’s doctrine of existence. Contemporary proponents include Joseph Owens and John F. X. Knasas. 3. Laval or River Forest Thomism: This approach emphasizes the Aristotelian foundations of Aquinas’s philosophy, and in particular the idea that the construction of a sound metaphysics must be preceded by a sound understanding of natural science, as interpreted in light of an Aristotelian philosophy of nature. Accordingly, it is keen to show that modern physical science can and should be given such an interpretation. Charles De Koninck (1906-1965), James A. Weisheipl (1923-1984), William A. Wallace, and Benedict Ashley are among its representatives. It is sometimes called “Laval Thomism” after the University of Laval in Quebec, where De Koninck was a professor. The alternative label “River Forest Thomism” derives from a suburb of Chicago, the location of the Albertus Magnus Lyceum for Natural Science, whose members are associated with this approach. It is also sometimes called ‘Aristotelian Thomism’ (to highlight its contrast with Gilson’s brand of existential Thomism) though since Neo-Scholastic Thomism also emphasizes Aquinas’s continuity with Aristotle, this label seems a bit too proprietary. (There are writers, like the contemporary Thomist Ralph McInerny, who exhibit both Neo-Scholastic and Laval/River Forest influences, and the approaches are not necessarily incompatible.) 4. Transcendental Thomism: Unlike the first three schools mentioned, this approach, associated with Joseph Marechal (1878-1944), Karl Rahner (1904-84), and Bernard Lonergan (1904-84), does not oppose modern philosophy wholesale, but seeks to reconcile Thomism with a Cartesian subjectivist approach to knowledge in general, and Kantian epistemology in particular. It seems fair to say that most Thomists otherwise tolerant of diverse approaches to Aquinas’s thought tend to regard transcendental Thomism as having conceded too much to modern philosophy genuinely to count as a variety of Thomism, strictly speaking, and this school of thought has in any event been far more influential among theologians than among philosophers. 5. Lublin Thomism: This approach, which derives its name from the University of Lublin in Poland where it was centered, is also sometimes called “phenomenological Thomism.” Like transcendental Thomism, it seeks to combine Thomism with certain elements of modern philosophy, though in a way that is less radically revisionist. In particular, it seeks to make use of the phenomenological method of philosophical analysis associated with Edmund Husserl and the personalism of writers like Max Scheler in articulating the Thomist conception of the human person. Its best-known proponent is Karol Wojtyla (1920-2005), who went on to become Pope John Paul II. 6. Analytical Thomism: This newest approach to Thomism is described by John Haldane… its key proponent, as ‘a broad philosophical approach that brings into mutual relationship the styles and preoccupations of recent English-speaking philosophy and the concepts and concerns shared by Aquinas and his followers’ (from the article on ‘analytical Thomism’ in The Oxford Companion to Philosophy, edited by Ted Honderich). By ‘recent English-speaking philosophy’ Haldane means the analytical tradition founded by thinkers like Gottlob Frege, Bertrand Russell, G. E. Moore, and Ludwig Wittgenstein, which tends to dominate academic philosophy in the English-speaking world. Elizabeth Anscombe (1919-2001) and her husband Peter Geach are sometimes considered the first ‘analytical Thomists,’ though (like most writers to whom this label has been applied) they did not describe themselves in these terms, and as Haldane’s somewhat vague expression ‘mutual relationship’ indicates, there does not seem to be any set of doctrines held in common by all so-called analytical Thomists. What they do have in common seems to be that they are philosophers trained in the analytic tradition who happen to be interested in Aquinas in some way; and the character of their ‘analytical Thomism’ is determined by whether it tends to stress the ‘analytical’ side of analytical Thomism, or the ‘Thomism’ side, or, alternatively, attempts to emphasize both sides equally.</p></blockquote>

<blockquote><p>As I have emphasized, the Aristotelian position acknowledges that sensory experience, mental imagery, emotion, and other mental attributes we share with non-human animals are entirely corporeal or bodily. It also holds that the intellect depends on the senses, and thus the body and brain, for informational input. It also holds that the intellect depends on the senses, and thus the body and brain, for informational input. Moreover, the Aristotelian allows that even when concepts have been abstracted from mental imagery, the intellect still, in the normal course of things, makes use of imagery when entertaining even the most abstract ideas and lines of reasoning. That too depends on brain activity. And it cannot be emphasized too strongly that these are not concessions the Aristotelian has been forced to make in light of modern neuroscientific findings. On the contrary, these are things that Aristotelians have been saying for centuries. Hence there is nothing in what modern neuroscience has discovered about the mind that need be remotely troubling to the Aristotelian. Indeed it is precisely the sort of thing Aristotelian philosophy of mind would lead us to expect.</p></blockquote>

<blockquote><p>The first sort [of objectors] say, ‘It is to no purpose to dispute against such as deny grounded principles.’ And by this means, because one grounded principle is denied them, they break off quite and clean, as though all mean of conference were taken away. Surely this principle of theirs is very true, but yet (in my judgment) it is very ill understood. I grant it is to no purpose to dispute against such as deny grounded principles, by the same principles which they deny: That is very true. But there may be some other principles common to both sides, by the which a man may profitably dispute with them, and by those common principles oftentimes prove and verify his own principles. And that is the thing which I intend to do in this work. As for example: The Christian grounds himself upon the Gospel; the Jew denies it: and therefore it were to no purpose to allege it unto him. But both the Jew and the Christian have one common principle and ground, which is the Old Testament: By this may the Christian profitably dispute against the Jew, yea even to the verifying of the Gospel. … Likewise the Jew is grounded upon the Old Testament, which the Gentile would mock at if he should allege it unto him. But both the Gentile and the Jew have one common nature, which furnishes them both with one common philosophy, and with one common sort of principles; as that there is one God which governs all things; that He is good, and no author of evil; that He is wise, and does not anything in vain. Also that man is born to be immortal; that to be happy he ought to serve God and continue in his favor. And therewithal, that he is subject to passions, inclined to evil, weak unto good and so forth. Of these common principles, the Jew may draw necessary conclusions, which the Gentile shall not perceive at the first, like as when a man understands a proposition, but conceives not yet the drift and consequence thereof… Thus shall the Jew by common principles and conclusions, verify his own ground which is the Old Testament… And what else is all this than that which is commonly done in geometry and logic, which by two lines or by two propositions that are commonly known and certain, do gather… a third proposition (that is to say, a conclusion) that was… either doubted of or hidden, and by means of the other two is evidently found out, and necessarily proved. … To be short, the mark that our faith looks at, is the Author of Nature and principle of all principles. The rules therefore and the principles of nature which He has made cannot be contrary unto Himself. And He is also the very reason and truth itself. All other reason then, and all other truth depends upon Him, and relies upon Him, neither is there, or can there be any reason or truth but in Him: So far off is it, that the thing which is true and reasonable in nature, is or can be false in divinity, which (to speak properly) is not against nature, but against the corruption of nature, and in very deed about nature.</p></blockquote>

<blockquote><p>If there is Anything, the Uncausable is Susbtance [see pp. 56-68 of the Summary] . 48. If something accidental exists, something substantial exists. Proof: An accident depends essentially on its substrate. This dependence is of the same order as that which is found between formal cause and material cause. For substance is as it were the matter of accidents. Hence for any accident that actually exists there is required the simultaneous existence of another being, namely that in which the accident is. If this other is not something substantial but on the contrary an accident, then some third being is required. But there cannot be a regress to infinity, both because there would be at the same time an infinite number and because dependence in any essential order ends in some independent being in the same order. Hence every effect demands an ultimate being that is not an effect; a thing in matter requires eventually a being not in matter, namely prime matter. Likewise a being in another or to which existing in another belongs, involves a being not in another, or to which existing in itself belongs. If you object that some accident, namely quantity, can exist in itself, that is, supernaturally, the objection is not valid; for even in this case God, as first efficient cause, would be making up for the natural, material, secondary causality of the substance. And so, even on this supposition, at least one substance would exist, namely God himself. 49. If there is anything, substance exists. If there is anything, it is either accident or substance. But if it is accident, substance too exists (from conclusion 48). Therefore in either case, if there is anything, there is substance. 50. Being is divided into substance and accident. The existence of accidents must be proved from experience. And on this point one must note that, on the evidence of experience, many things exist that are not only beings but beings in another, as color, shape etc. It does not matter whether these are formally objective or subjective, for in either case they are real modifications of something. One must say the same about our internal acts, as thoughts, affections, volitions; for we experience these beings as empirical modifications of the ‘ego’. — From the fact of actual accident follows the fact of actual substance (from conclusion 48). Thus both accident and substance exist; therefore being is divided into substance and accident. About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. 51. If something is altogether independent, it must be substance and not accident. Hence the uncausable, for instance, is substance. This conclusion is sufficiently clear from what was said above in proof of conclusion 48. … Proof of God … 11. God’s knowledge is really the same as the divine essence. Plain both from the physical simplicity of God and from the infinite perfection of the divine essence, which is perfectible neither accidentally nor substantially (conclusion 2). [A difference between the divine essence and its knowledge would be a difference between substance and accident.] … 15… Corollary: On a Personal God We show, against those who conceive God to be an impersonal cosmic force, that God is a rational being and hence personal. For a personal God is here understood as a rational supposit, that is, a singular substance simply complete, in its own right, and endowed with reason. God’s simply complete substantiality and singularity, and being in his own right, follow from our principal argument. In the present chapter God’s rationality is proved. Hence everything requisite for a personal being is verified of God. … 29. Every being is good, or being and good convert. … Further, creatures are also good for other creatures; for example, substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>

+accident.+The+existence+of+accidents+must+be+proved+from+experience.+And+on+this+point+one+must+note+that%2C+on+the+evidence+of+experience%2C+many+things+exist+that+are+not+only+beings+but+beings+in+another%2C+as+color%2C+shape+etc.+It+does+not+matter+whether+these+are+formally+objective+or+subjective%2C+for+in+either+case+they+are+real+modifications+of+something.+One+must+say+the+same+about+our+internal+acts%2C+as+thoughts%2C+affections%2C+volitions%3B+for+we+experience+these+beings+as+empirical+modifications+of+the+%E2%80%98ego%E2%80%99.+%E2%80%94+From+the+fact+of+actual+accident+follows+the+fact+of+actual+substance+%28from+conclusion+48%29.+Thus+both+accident+and+substance+exist%3B+therefore+being+is+divided+into+substance+and+accident.+About+knowledge+of+the+formal+idea+of+accident+one+must+note+that+%E2%80%98in+another%E2%80%99+or+%E2%80%98in-anotherness%E2%80%99+is+correlative%2C+for+it+involves+something+in+which+it+is.+But+to+perceive+some+relation%2C+there+is+need+of+knowledge+of+the+terms+of+the+relation+in+themselves.+Our+first+knowledge+of+reality%2C+therefore%2C+seems+to+be+knowledge+of+things+as+absolute+objects+and+not+in+their+relation+to+other+beings.+But+when+we+say+that+accidents+are+immediately+experienced+as+beings+in+another+the+sense+is%3A+this+knowledge+is+not+by+way+of+reasoning+out+but%2C+from+phenomenological+analysis+of+the+givens+of+experience%2C+we+perceive+through+simple+apprehension+this+relation+of+%E2%80%98in-anotherness%E2%80%99.+Shape%2C+for+instance%2C+is+not+only+perceived+in+itself+and+as+something+absolute+but+also+in+its+relation+to+extension+and+color%2C+namely+as+the+limit+of+a+colored+expanse.+But+in+other+cases+it+seems+we+do+not+immediately+perceive+the+idea+of+%E2%80%98in-anotherness%E2%80%99%2C+but+rather+we+infer+it+by+reasoning+out.+This+happens%2C+for+example%2C+with+quantity.+No+wonder+then+that+some%2C+as+Descartes%2C+identified+extension+with+material+substance+as+such.+51.+If+something+is+altogether+independent%2C+it+must+be+substance+and+not+accident.+Hence+the+uncausable%2C+for+instance%2C+is+substance.+This+conclusion+is+sufficiently+clear+from+what+was+said+above+in+proof+of+conclusion+48.+%E2%80%A6+Proof+of+God+%E2%80%A6+11.+God%E2%80%99s+knowledge+is+really+the+same+as+the+divine+essence.+Plain+both+from+the+physical+simplicity+of+God+and+from+the+infinite+perfection+of+the+divine+essence%2C+which+is+perfectible+neither+accidentally+nor+substantially+%28conclusion+2%29.+%5BA+difference+between+the+divine+essence+and+its+knowledge+would+be+a+difference+between+substance+and+accident.%5D+%E2%80%A6+15%E2%80%A6+Corollary%3A+On+a+Personal+God+We+show%2C+against+those+who+conceive+God+to+be+an+impersonal+cosmic+force%2C+that+God+is+a+rational+being+and+hence+personal.+For+a+personal+God+is+here+understood+as+a+rational+supposit%2C+that+is%2C+a+singular+substance+simply+complete%2C+in+its+own+right%2C+and+endowed+with+reason.+God%E2%80%99s+simply+complete+substantiality+and+singularity%2C+and+being+in+his+own+right%2C+follow+from+our+principal+argument.+In+the+present+chapter+God%E2%80%99s+rationality+is+proved.+Hence+everything+requisite+for+a+personal+being+is+verified+of+God.+%E2%80%A6+29.+Every+being+is+good%2C+or+being+and+good+convert.+%E2%80%A6+Further%2C+creatures+are+also+good+for+other+creatures%3B+for+example%2C+substance+upholds+accidents%2C+accidents+give+further+perfection+to+substance%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7565f8e859.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7565f8e859.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=If%20there%20is%20Anything%2C%20the%20Uncausable,give%20further%20perfection%20to%20substance%2C%20etc&amp;text=If%20there%20is%20Anything%2C%20the%20Uncausable%20is%20Susbtance&amp;text=accidents%2C%20accidents%20give%20further%20perfection%20to%20substance%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Material and formal cause, properly so called, does not have place in accidents, although by some all beings promiscuously, whether substances or accidents, are wont to be explained through four kinds of causes. Yet if anyone wishes to form analogical concepts of it [regeneration] after the manner of physical generation, let him consider: I. The Holy Spirit as the one generating, 1 Jn. 5:1. II. The transient matter or matter of generation, the Word of God, which is compared to seed, 1 Pet. 1:23. III. The proximate constituting matter, the intellect. IV. The form, faith or the new creature. V. The composite from man’s intellect with will and from the image of God or new creature: let it be the new man, the man of God, the spiritual man. VI. That introduced form informs and actuates the matter, and thus renders man active for spiritual life; moreover constitutes him in a certain kind of things and distinguishes him from all other men not regenerate; finally renders him fit for every good work.</p></blockquote>

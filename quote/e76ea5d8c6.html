<blockquote><p>XV. The question arises whether sin can also be committed in sleep? The answer is yes, because then it arises from the waking sins of those who sleep, so that we sin even in this state, and sleep as it were continues those sins; for the thoughts and cares of the day supply the material for dreams–not to mention intemperance in food and drink as causes of other sins. There is at least a virtual and original consent of the will, even if an accompanying consent too; and in sleep we perceive ourselves having good thoughts and cherishing virtuous dispositions, so contrariwise the others that diverge must be counted as sinful. Thus in the old law, those who at any time suffered from a gonorrhea discharge were considered unclean, Leviticus 15:2-3. To this point tend the opinions and rescripts of the Ancients concerning nocturnal pollution, whether one had suffered it voluntarily, not from any preceding lust, but spontaneously, as a natural bodily excretion “as superfluous matter”, in which case they judged the man not to be defiled; or whether “desire preceded and the emission followed from that”, or it occurred “from intemperance in food and drink”, in which way Dionysius of Alexandria speaks in his Epistle to Basilides, chapter 4. There were others who counted even the natural flow of semen among sins, against whom John Zonaras argues in “Lest you be Overly Righteous”, in the Greek-Roman Law of Marquard Freher, Book 5 of Responses, page 351, and in Emmingus Bonificius’ Oriental Law, Book 3. “Be not righteous overmuch,” is how he begins his oration, “nor more upright than the rule itself. These are the opinions of the more excellent wisdom, and our own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Practical Theological Disputation on Sin, pt. 2’</cite>, tr. Onku with AI (Leiden: Johann Elsevir, 1660), sect. 15-20 Latin</span></figcaption>

<blockquote><p>The progress in sin is therefore such… First, from the tinder comes a certain motion of titillation in the flesh toward lust, that is toward carnal concupiscence, which the sense existing in the flesh apprehends. [Second,] Through whose apprehension first the sensitive appetite conjoined to the sense is moved by a motion of pleasure about that to which the flesh tingles. Thirdly it is moved by a motion of desire to pursue that into action, which motion in the sensitive appetite mediated by the sense is apprehended by the reason of simple intelligence. Through which apprehension fourthly the will is moved by a motion of delight in delighting in the sensitive appetite; and in the fifth way by a motion into delight; and sixth by surreptitious desire for consent to pursue that into action, and here is the boundary and term of venial sin. Seventh is interpretative consent in delight, and it is the first and lowest grade of mortal sin, which is called mortal from morose delight. Eighth is true consent in delight. Ninth is consent in deed and according to Augustine in On the Sermon of the Lord on the Mount, “full sin known to God in our heart, and now if by deed it does not become known to men”. And then tenth, if the opportunity is present, follows the execution of the deed. Eleventh, from frequent execution, custom; and twelfth from custom, despair; and thirteenth, from despair, obstinacy, says Augustine in the sermon on Pharaoh’s hardening: “From a multitude of sins despair is born, and from despair hardness is generated according to that which is written: ‘The sinner, when he has come into the depths of sins, despises&#x27;”. And then fourteenth and last follows final impenitence, of which says Augustine in the sermon on blasphemy against the Holy Spirit: “Impenitence, as long as one lives in this flesh, cannot be judged as we understand persistent hardness of heart”. … First indeed in this way undoubtedly first motions are sins, both in the regenerate and in the unregenerate, because they have deformity in themselves against the rules of prudence and right reason, which deformity has the rule of vice, just as its contrary information has the rule of virtue. In this way also the said obliquity in the rule has the rule of vice, and similarly the tinder in the flesh, and this according to the manner in which virtues and vices are granted to be in the sensitive powers not by essence, but by a certain participation, as we determined in a preceding Quolibet… Secondly… And this mortal, if mortal sin be called that to which is due eternal punishment, because with sin as it is sin, eternal punishment is due… And this sin in the unregenerate should be called not original sin, but actual, and this because it is perpetrated not by an act of its own will, but by an act proper to its own flesh. … To the second that “first motions are not voluntary”, it must be said that, although not voluntary as regards the will of him in whom they are… they are however voluntary as regards the will of the first parent, as determines Augustine, bk. 3, ‘On Free Choice’, from whose will proceeded his own proper actual sin and henceforth all other original sins of others, either medially or immediately, and from them first motions, from whose will they have that they are sins both as regards blemish and as regards guilt…</p></blockquote>

<blockquote><p>But first of all, it is necessary to consider certain changes which took place in Christian thought on this subject during the preceding centuries. Be the origin of the doctrine in the attempt to smooth the rough places of law for the sake of the weak or tender conscience, or in the practical necessity for a guiding principle of division as a kind of ready reckoner for pastoral purposes, or in both these causes, a change of deep significance came about in its structure. At first, and up to the close of the patristic era, the key-note of the distinction was oþjectivity. The external act is the criterion, so that there is a regular tabula of sins, the commission of any of which involves the sinner in mortal sin. But by the time of the Schoolmen, and notably, of in the works of St. Thomas Aquinas, a tremendous ethical course, change in the idea has come about. There are still sins which are reckoned as mortal, suo genere [in its genera], but the governing factor is no longer the external act. It is the deliberateness with which the act is committed. In other words, intention or motive is receiving recognition as the determining element in assessing the gravity of sin. It was to Peter Abelard [c. 1079–1142)] that Aquinas and his fellows were indebted for this improved idea: In the Scito Te Ipsum [Know Yourself, by Abelard] the discussion of sin moves forward out of the realm of externals. Consequent on this stressing of deliberateness at the expense of drawing a clear line between what was mortal and what venial. This indeterminacy. inevitably paved the way for laxity in the computation of the guiltiness of certain sinful acts.</p></blockquote>

— Henry R. McAdoo, Ch. 4, ‘Mortal &amp; Venial Sin: the Reforming Strain’ in The Structure of Caroline Moral Theology (Longmans, Green, 1949), pp. 98-119">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+first+of+all%2C+it+is+necessary+to+consider+certain+changes+which+took+place+in+Christian+thought+on+this+subject+during+the+preceding+centuries.+Be+the+origin+of+the+doctrine+in+the+attempt+to+smooth+the+rough+places+of+law+for+the+sake+of+the+weak+or+tender+conscience%2C+or+in+the+practical+necessity+for+a+guiding+principle+of+division+as+a+kind+of+ready+reckoner+for+pastoral+purposes%2C+or+in+both+these+causes%2C+a+change+of+deep+significance+came+about+in+its+structure.+At+first%2C+and+up+to+the+close+of+the+patristic+era%2C+the+key-note+of+the+distinction+was+o%C3%BEjectivity.+The+external+act+is+the+criterion%2C+so+that+there+is+a+regular+tabula+of+sins%2C+the+commission+of+any+of+which+involves+the+sinner+in+mortal+sin.+But+by+the+time+of+the+Schoolmen%2C+and+notably%2C+of+in+the+works+of+St.+Thomas+Aquinas%2C+a+tremendous+ethical+course%2C+change+in+the+idea+has+come+about.+There+are+still+sins+which+are+reckoned+as+mortal%2C+suo+genere+%5Bin+its+genera%5D%2C+but+the+governing+factor+is+no+longer+the+external+act.+It+is+the+deliberateness+with+which+the+act+is+committed.+In+other+words%2C+intention+or+motive+is+receiving+recognition+as+the+determining+element+in+assessing+the+gravity+of+sin.+It+was+to+Peter+Abelard+%5Bc.+1079%E2%80%931142%29%5D+that+Aquinas+and+his+fellows+were+indebted+for+this+improved+idea%3A+In+the+Scito+Te+Ipsum+%5BKnow+Yourself%2C+by+Abelard%5D+the+discussion+of+sin+moves+forward+out+of+the+realm+of+externals.+Consequent+on+this+stressing+of+deliberateness+at+the+expense+of+drawing+a+clear+line+between+what+was+mortal+and+what+venial.+This+indeterminacy.+inevitably+paved+the+way+for+laxity+in+the+computation+of+the+guiltiness+of+certain+sinful+acts.%E2%80%9D%0A%0A%E2%80%94+Henry+R.+McAdoo%2C+Ch.+4%2C+%E2% </figure><figure class="quote" id="q-8f24577347" data-kw="">
<blockquote><p>If a people trusting in the goodness of their prince, enslave themselves to him, and he shall after turn tyrant; a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium: Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and therefore the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and therefore, when the contract is made for the utility of the one party [only], the law says their place is for after wits, that men may change their mind, and resume their liberty…</p></blockquote>

<blockquote><p>…and the ignorance of any questions which may be cleared by God’s Word, is vincible and culpable, for the Law says, ‘The ignorance of these things which we are obliged to know is culpable, and excuses not.’ (Reg. juris Culpabilis est ignorantia rerum quas scire tenemur.) But thirdly, a question of fact is properly a question whether this Corinthian committed incest or no, whether Titus committed murder, or no, and in this there is sometimes invincible ignorance when all diligence morally possible is given to come to the knowledge of the fact.</p></blockquote>

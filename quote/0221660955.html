<blockquote><p>3… Oh, how little will they have to say for themselves upon whom grace waited so many years, knocking hard at the door of their hearts for acceptance, and they refused to open to it [Rev. 3:20], or bid it come in. How justly will they suffer long in the other world, to whom God was so long-suffering to no purpose in this world, Rom. 4:2.</p></blockquote>

<blockquote><p>With what different emotions of heart may we suppose Zaccheus received this invitation? Think you not that he was surprised to hear Jesus Christ call him by name, and not only so, but invite Himself to his house? Surely, thinks Zaccheus, I dream: it cannot be; how should He know me? I never saw Him before: besides, I shall undergo much contempt, if I receive Him under my roof. Thus, I say, we may suppose Zaccheus thought within himself. But what says the Scripture? “I will make a willing people in the day of my power.” [Ps. 110:3] With this outward call, there went an efficacious power from God, which sweetly over-ruled his natural will: and therefore, verse 6, “He made haste, and came down, and received him joyfully;” not only into his house, but also into his heart. … And thus it is with all, that, like Zaccheus, receive Jesus Christ by faith into their hearts: the very moment they find rest in Him, they are freely justified from all things from which they could not be justified by the law of Moses; “for by grace are we saved, through faith, and that not of ourselves, it is the gift of God. … You say you have faith; but how do you prove it? Did you ever hear the Lord Jesus call you by name? Were you ever made to obey the call? Did you ever, like Zaccheus, receive Jesus Christ joyfully into your hearts? Are you influenced by the faith you say you have, to stand up and confess the Lord Jesus before men? Were you ever made willing to own, and humble yourselves for, your past offenses? … He came not only to save, but to seek and to save that which was lost. He came to Jericho to seek and save Zaccheus; for otherwise Zaccheus would never have been saved by Him. But from whence came He? Even from Heaven, his dwelling-place, to this lower earth, this vale of tears, to seek and save that which was lost; or all that feel themselves lost, and are willing, like Zaccheus, to receive Him into their hearts to save them; with how great a salvation? … The power of his death and resurrection is as great now as formerly. Make haste therefore, make haste, O ye publicans and sinners, and give the dear Lord Jesus your hearts, your whole hearts. If you refuse to hearken to this call of the Lord, remember your damnation will be just: I am free from the blood of you all… Let all that love the Lord Jesus Christ in sincerity say, Amen.</p></blockquote>

</figure><figure class="quote" id="q-d966461caf" data-kw="">
<blockquote><p>It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-annotations.html">English Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations (the Westminster Annotations)</cite>, 3rd ed. (1658), on Song 5:2</span></figcaption>

<blockquote><p>‘That knocketh.’ moving my heart by secret inspirations, to give full admittance and entrance to his grace and virtues, Rev. 3:20. ‘Open to me.’ receive Me in thine heart, by a lively act of faith, for it is mine only place of refuge and abode upon earth, out of which I find nothing but annoyance and displeasure in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-diodati.html">John Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pious Annotations, upon the Holy Bible</cite>, (London: T.B., 1643), on Song 5, verse 2, p. 201</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘That knocketh.’ moving my heart by secret inspirations, to give full admittance and entrance to his grace and virtues, Rev. 3:20. ‘Open to me.’ receive Me in thine heart, by a lively act of faith, for it is mine only place of refuge and abode upon earth, out of which I find nothing but annoyance and displeasure in the world.”

<blockquote><p>‘Alas, this business is beyond my strength, I cannot change mine own heart; though there are encouragements and helps, I know not which way to go, nor how to plead them.’ Well, but is the Spirit of God able to quicken thee, and to teach thee, and to enable thee? He stands especially engaged, ’tis his immediate work to prevail upon the heart. Go to the Spirit, and beg of Him, that He would lead thee to the Father, and to Christ, that thou mayst have fellowship with the Father and the Son. ‘Alas, I cannot go unto the Spirit, I have so long resisted Him, so often grieved Him, with what face can I go? I am unworthy of his guidance.’ Well, but Jesus Christ stands engaged; and never speak of merit that day thou speakest of Christ. Go to Christ, and beg that He would send his Spirit into thy heart. Jesus Christ is thy Kinsman, he knows how to pity thee; and the Spirit of Grace is at his dispose. Oh then go to Christ. ‘Alas, I cannot go to Christ, I have no ability to go, nor so much as a will to move towards Him. I cannot go to Christ.’ Well, but the Father is engaged to draw thee, though thou canst not go; a man may be drawn, which has no natural willingness of his own. The Father stands engaged to change the will, and absolute promises are theirs that lay claim to them (provided they do not overthrow their own claim). Go therefore and tell the Father thy case.</p></blockquote>

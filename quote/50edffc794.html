<main class="wrap"><figure class="quote" id="q-50edffc794" data-kw="">
<blockquote><p>Too near to these do they come, who though they do not tie themselves to the very same rites and ordinances, whereto the Jews were bound, yet tread too near upon their heels, and too apishly imitate them: and that in matters about divine Service: as in fair embroidered Copes, and other Ministers-vestments; in high standing Altars; in low cringings and bowings; in turning to the East, as they to the Temple, when they pray; in variety of musical instruments and artificial anthems; in multitude of holy days, with the like; whereof even this Church stood formerly too guilty.

These Jewish Christians do both justify the poor blind Jews, who yet retain as many of the Mosaical Ceremonies as they can (in that Christians have a greater light, the light of the Gospel, to discover unto them the abrogation of that Law, together with the reason thereof) and also doe harden their hearts, and make them bold in cleaving to their Law, when they see such as profess themselves Christians, come so near there unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), pp 23-24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

an-rituals/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39eac37d0e" data-kw="">
<blockquote><p>That he [Paul] did not propose this his practice [of not receiving money from the Christians in Ephesus in Acts 20:33-35] as a precept or precedent law or rule to all ministers, for he had not power to deprive them of what God had given them (Lev. 27:32; Mt. 10:10; Lk. 11:42; Prov. 3:9,10; Mal. 3:9,10). Tithes were paid by Abraham to Melchisedeck long before the Levitical Law: So that there must be a moral equity in this reciprocal duty both before the Law, under the Law, and after the Law under the Gospel. And though Paul did thus in a juncture and case of necessity because of their present poverty (had they been able, more shame would it have been to them to let him labor) and because false teachers were watching all advantages against him, yet does he himself often assert his own privilege (1 Cor. 9:14; Gal. 6:6) and Christ’s words (he urges) might be collected out of Lk. 6:38 and 16:9, etc. yea, the very terms might be spoken by Christ, for all He spake is not writ (Jn. 20:30).</p></blockquote>

<blockquote><p>The date of its publication is almost all that has been ascertained in regard to the circumstances in which this “Peace-offering” appeared. We are inclined to attach to it considerable value; and of all the writings of Owen in defence of Nonconformity, in the trying and critical period of its history when this tract was published (1667), there is none in which the case of the Nonconformists is more simply and conclusively argued, or more likely to produce a greater effect on the modern reader. Very earnest in its tone, and yet very moderate in its language,—calm, and yet most impressive in the appeal which it contains,—it affords a pleasing illustration alike of the meekness of wisdom and the wisdom of meekness.

It seems impossible to read it without a mingled feeling of regret and indignation that there ever should have been a time when men breathing the spirit which our author here breathes should have been denied religious freedom and the rights of conscience on the soil of Britain. The chief fault of the tract is its very moderation, as “a humble plea,”—for an “indulgence,” too, in the exercise of those rights which no government is either able to confer or entitled to withhold, and the protection of which is one of the highest ends of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-h-goold.html">William H. Goold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prefatory Note to John Owen, A Peace-Offering, in An Apology and Humble Plea for Indulgence and Liberty of Conscience: By Sundry Protestants Differing in some things from the Present Establishment about the Worship of God</cite></span></figcaption>

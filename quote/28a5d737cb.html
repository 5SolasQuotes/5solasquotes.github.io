<main class="wrap"><figure class="quote" id="q-28a5d737cb" data-kw="">
<blockquote><p>I judge a free Parliament, the most natural Ordinance (and the nearest that Divine government which once was) for the true good of a Nation that would not be slaves to sin and man’s will, of any yet known, or in use in the world; and if my Judgement were of any weight in a business of this nature, I would think those the more unnatural to themselves and others, who otherwise speak and act amongst us. Our lusts would be Laws and Judges of them too, and may, as well one as tother; ’tis thus with us, ’tis thus with you; ’tis so in Divinity, ’tis so in morality, ’tis so in the first Table, ’tis so in the second.

Christ meant civil Government really, when he bade us submit to it, and pray for it, and practised it himself by giving to Caesar the things which were Caesars; if in these last and worst days we need it less than then, I do not yet understand it. Wild beasts love no bound, but if this should be, then all the world would be a wilderness, and where should we live without tearing in pieces? I think just Government in a Turk to be a beam of God, and we admire it abroad, and trample upon it at home.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-lockyer.html">Nicholas Lockyer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached before the Honourable House of Commons assembled in Parliament: At their solemn fast, Octob. 28 1646</cite>, (London: John Rothwell, 1646), epistle dedicatory.</span></figcaption>

<blockquote><p>2. Nations are bound to frame their constitutions of government; to enact their laws; and to conduct the civil administration, in professed and real obedience to the Scriptures. – National acknowledgment of the Messiah’s authority is not a bare profession. “Not every one that saith, Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father which is in heaven,” Matt. vii. 21. Christ’s titles are not mere honorary titles; he is really a king. Submission to his sceptre implies the reception of his law and obedience to its demands.

The laws of Christ are contained in the Bible, and all the laws of the Bible are Christ’s laws. Both the Old and New Testaments are his statute books. Every moral law found there, carries with it an obligation to obedience. And it is the imperative duty of all Christ’s subjects to search, each for himself, the inspired record, that he may ascertain from its pages the principles of righteousness by which his conduct ought to be governed. “Search the Scriptures; – and they are they which testify of me.” As nations are under the government of the Mediator, this obligation rests upon them as well as upon individuals.

And why should not nations seek light from the Bible? The remains of the moral law are very broken and imperfect in the natural man, even in regard to civil duties. Witness the national follies and crimes of the most enlightened pagan nations: to say nothing of the great majority of the inhabitants of those nations that either have not the Bible at all, or have only a closed Bible and who have consequently sunk into the most wretched condition of moral and social debasement. The Bible professes to be a perfect rule. It has been “given by inspiration of God, that the man of God may be perfect; thoroughly furnished unto all good works,” 2 Tim. iii. 16, 17. There is no exception made of civil or political “works.” This gracious revelation finds man in all things wanting such light as will clearly show him the will of God. This it does.

Nor are its teachings confined to the duties of personal religion and those of the domestic and other social relations. The Scriptures abound with instruction respecting matters civil and political. The historical part of the Old Testament, the prophecies, the book of Proverbs and the Psalms, are full of the richest treasures of political wisdom; while the Pentateuch contains a system of laws devised by infinite wisdom for the chosen people of God. Indeed, civil duties occupy as large a space in the Bible as they do in the actual operations of society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible Magistracy: or Christ’s Dominion over the Nations: with an Examination of the Civil Institutions of the</cite>, United States (Philadelphia, 1842), pp 47-50.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-cf85c52c48" data-kw="">
<blockquote><p>What is the “kingdom of God”? It is the dominion of God, his reign in the soul by his law written upon the heart; his reign in that community of souls which is called the church; his reign in the souls of all men in the end, except those in hell. The kingdom of God is opposed to the kingdom of the devil, and to the kingdom of man undertaking to reign without God, and to the kingdom of man, who, as a civil magistrate and swordbearer, can only restrain evil-doers and protect those who do well by force.

We see its beginning in Genesis iii. 15 in opposition to the kingdom of the devil and the beastly nature of fallen man (now become the image of the devil). Here it is the kingdom of God in man, or in the woman’s seed; the kingdom of man in God or God in man in opposition to the kingdom of man without God or against God. We see it again in the family of Abraham: in Israel after the flesh (theocracy), especially in the typical kingdoms of David and Solomon. Again in opposition to the kingdom of the beasts in Daniel, as the kingdom of the “Son of man.” Then again in Revelation in opposition to the kingdom of the beast, and finally prevailing and absorbing the kingdom of the world (the sovereignty of the world which had lasted for centuries becoming the sovereignty of our Lord and of his Christ) in Rev. xi. 15.

The kingdom of God, therefore, is the theocracy (the only kind of government which would have existed in the world if man had not apostatized from his Maker); sometimes the theocracy in its laws and principles of administration; sometimes, in its personnel, when it is equivalent to church (during the present militant condition of the kingdom); sometimes as to its internal growth; sometimes as to its external growth; sometimes in its militant, sometimes in its triumphant, state; but the fundamental idea always is that of a theocracy, of a government of God which is consented to (either in reality or pretence) by man; and always a government of God administered by man; and in the New Testament (when the incarnation has become plainly revealed) by the God-man, the “Son of man” (the special sense of which phrase is “the King” and “Head of the kingdom”); hence the association in the Gospels of the “kingdom of God” or “heaven” with the “Son of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on the Acts of the Apostles</cite>, in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia, ed. T. C. Johnson (3 vols, Richmond VA: The Presbyterian Committee of Publication, 1895-97), 3: 44-45.</span></figcaption>

stration%3B+sometimes%2C+in+its+personnel%2C+when+it+is+equivalent+to+church+%28during+the+present+militant+condition+of+the+kingdom%29%3B+sometimes+as+to+its+internal+growth%3B+sometimes+as+to+its+external+growth%3B+sometimes+in+its+militant%2C+sometimes+in+its+triumphant%2C+state%3B+but+the+fundamental+idea+always+is+that+of+a+theocracy%2C+of+a+government+of+God+which+is+consented+to+%28either+in+reality+or+pretence%29+by+man%3B+and+always+a+government+of+God+administered+by+man%3B+and+in+the+New+Testament+%28when+the+incarnation+has+become+plainly+revealed%29+by+the+God-man%2C+the+%E2%80%9CSon+of+man%E2%80%9D+%28the+special+sense+of+which+phrase+is+%E2%80%9Cthe+King%E2%80%9D+and+%E2%80%9CHead+of+the+kingdom%E2%80%9D%29%3B+hence+the+association+in+the+Gospels+of+the+%E2%80%9Ckingdom+of+God%E2%80%9D+or+%E2%80%9Cheaven%E2%80%9D+with+the+%E2%80%9CSon+of+man.%E2%80%9D%0A%0A%E2%80%94+Thomas+Peck%2C+Notes+on+the+Acts+of+the+Apostles%2C+in+Miscellanies+of+Rev.+Thomas+E.+Peck%2C+D.D.%2C+LL.D.%2C+Professor+of+Theology+in+the+Union+Theological+Seminary+in+Virginia%2C+ed.+T.+C.+Johnson+%283+vols%2C+Richmond+VA%3A+The+Presbyterian+Committee+of+Publication%2C+1895-97%29%2C+3%3A+44-45.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcf85c52c48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cf85c52c48.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/12/thomas-e-peck-on-the-kingdom-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-b839c2986d" data-kw="">
<blockquote><p>Forsomuch now as the word of God is the only truth that driveth away all lies, and discloseth all joggling and deceit, therefore is our Baalam of Rome so loath that the scripture should be known in the mother, tongue; lest, if kings and princes, specially above all other, were exercised therein, they should reclaim and challenge again their due authority, which he falsely hath usurped so many years, and so to tie him shorter; and lest the people, being taught by the word of God, should fall from the false feigned obedience of him and his disguised apostles into the true obedience commanded by God’s own mouth; as namely, to obey their prince, to obey father and mother, &amp;c., and not to step over father and mother’s belly to enter into his painted religions, as his hypocrites teach. For he knoweth well enough, that if the clear sun of God’s word come once to the heat of the day, it shall drive away all the foul mist of his devilish doctrines. Therefore were it more to the maintenance of antichrist’s kingdom, that the world were still in ignorance and blindness, and that the scripture should never come to light.</p></blockquote>

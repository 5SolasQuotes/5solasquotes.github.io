<main class="wrap"><figure class="quote" id="q-f194c6ee17" data-kw="">
<blockquote><p>However, “evil” is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<blockquote><p>12. The whole law of nature, which was such to innocent man, did necessarily result from the nature of man, as related to God and his fellow-subjects, and as placed in the midst of such a world of objects; and so is legible in rerum natura [in the nature of things]… 13. There are some duties that are founded in the relation of our very rational nature to the holy, perfect nature of God… and some duties that are founded in the relation of our natures one to another, and some from the inseparable, innocent principle of self-love. All these have their necessary original with our natures, by resultancy therefrom… 14. There are some duties of the law of nature founded in natural, but mutable, accidents, relations, moods. These are indispensable duties, while these relations or other accidents remain, which are the foundation of them;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity (London: R.W., 1655), An Advertisement Explicatory, pp. x-xi. For the relations of positive laws added into this mix, see Baxter’s larger discussion.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-a70f4018d9" data-kw="">
<blockquote><p>Question 1. Whether in a good or evil act there be necessarily required an inclination of the will? 1st Answer. First, the will is the principle and the first cause of all human operation in regard of the exercise of the act. For we therefore do this or that rather than another thing, because we will; As God Himself is said to do all things of his own Will, Eph. 1:11. So also does man who is made after the Image of God. The first cause therefore of the goodness or sinfulness of any act of man, is in the will. 2. Secondly, liberty also of election is formally in the will: that therefore anyone does yield obedience to God, or refuses to do so, proceeds from the will. 3. Lastly, our obedience stands in our conformity to the Will of God, and the disobedience, in our unconformity thereunto. Now our conformity with the Will of God is first and principally in our will, Apoc. 2:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’</cite>, pp. 92-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-79a16d5352" data-kw="">
<blockquote><p>Also this power is given to certain ends: and if it be used against those ends, so that either the ends or that means must be forsaken, it is easy to see that it is means and not the ends. For the means are not always the same, God having [a] store [of means] if any one fail. Especially the means is of positive morality and the ends [are] of natural morality: For when two duties come together, and both cannot be chosen, the choosing of the less (which must give place to the greater) is a sin: and positives are less (caeteris paribus [all things being equal]) than naturals: And the substantials of positives [are] more necessary than the circumstantials:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite>, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-260ed823a9" data-kw="">
<blockquote><p>When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?</p></blockquote>

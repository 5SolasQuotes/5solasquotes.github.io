<main class="wrap"><figure class="quote" id="q-1deaacbc98" data-kw="">
<blockquote><p>Since purgatory has been reared on many, and is daily propped up by new blasphemies; since it produces many grievous offenses, assuredly it is not to be connived at, however it might have been disguised for a time, that without any authority from the word of God, it was devised by prying audacious rashness, that credit was procured for it by fictitious revelations, the wiles of Satan, and that certain passages of Scripture were ignorantly wrested to its support.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.5.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo.html">Purgatory and Limbo</a> › <a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo/purgatory-no-ground-in-scripture.html">Purgatory: no ground in Scripture</a></span><span class="t"><a href="../topics/rome/last-things.html">Rome: Last Things</a> › <a href="../topics/rome/last-things/purgatory.html">Purgatory</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b5846db12" data-kw="">
<blockquote><p>We prove the vanity of this fiction in this way. First, because scripture teaches that the faithful (for whom they want Purgatory to be constructed) pass from here through death into eternal life. John 5:24 — &quot;Whoever hears my word and believes him who sent me has eternal life and will not come under judgment but has passed from death to life.&quot; Therefore they do not come into the judgment of Purgatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis on Purgatory</cite>, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo.html">Purgatory and Limbo</a> › <a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo/purgatory-no-ground-in-scripture.html">Purgatory: no ground in Scripture</a></span><span class="t"><a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo.html">Purgatory and Limbo</a> › <a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo/death-passes-the-soul-at-once-to-its-place.html">Death passes the soul at once to its place</a></span><span class="t"><a href="../topics/rome/last-things.html">Rome: Last Things</a> › <a href="../topics/rome/last-things/purgatory.html">Purgatory</a></span></div>

</figure><figure class="quote" id="q-91c4cd3b52" data-kw="">
<blockquote><p>As this whole business of purgatory is a groundless fable, an invention set up in competition with and opposition unto the sanctification of the Spirit and cleansing virtue of the blood of Christ, as a matter of unspeakably more profit and secular advantage unto those who have its management committed unto them; so it is as great an encouragement unto unholiness and a continuance in sin for those who believe it, and at the same time love the pleasures of sin (which are the generality of their church), as ever was or can be found out or made use of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pneumatologia</cite>, Book 4, ch. 4 (Works, ed. Goold)</span></figcaption>

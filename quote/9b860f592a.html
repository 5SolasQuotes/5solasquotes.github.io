<main class="wrap"><figure class="quote" id="q-9b860f592a" data-kw="">
<blockquote><p>1. According to my ordering of the decrees divine: In no moment of nature or reason is the decree of damnation precedent to the decree of permitting infidelity, or leaving the infidelity of some men uncured, to wit, by denying them faith, by denying the grace of regeneration. But the decrees of creating all in Adam, of permitting all to fall in Adam, in bringing all men forth into the world in the state of original sin, of leaving this original sin uncured in them, and last of all, of damning them for their sins; are decrees not subordinate, but coordinate, as decrees de mediis [of means, or middle things], tending jointly to one supreme end, which is the manifestation of God’s glory upon them in the way of justice-vindicative, as also to show the riches of his glory upon the vessels of mercy whom He has prepared unto glory (Rom. 9:22), to wit, by beholding in others that miserable condition, which through God’s mere grace and goodness they have escaped. 2. According to the Contra-Remonstrants [Anti-Arminians] tenet, I answer: 1. Many of them do not maintain that infidelity is consequent to the decree of damnation, but in the foresight of God, precedent rather: as appears by the British [delegation of] divines [to the Synod of Dort], their Theses de Reprobatione; and Alvarez professes the same. The denial of grace, and so the permitting of natural infidelity to remain uncured, they make consequent (as it seems) to a negative decree of denying glory. And to the decree of permitting infidelity, they make the foresight of infidelity subsequent; and this foresight of infidelity they make precedent to reprobation, as it signifies the decree of damnation. And thus far I agree with them, that in no moment of nature, or sign of reason did God ordain any man to damnation, but for sin; and consequently in no moment of nature, or sign of reason, did the decree of damnation go before the foresight of sin or infidelity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath… (Oxford: L.L., 1653), pt. 1, ‘The Discourse Itself’</cite>, p. 69</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40ad41a1eb" data-kw="">
<blockquote><p>This election is not of many kinds, but one and the same for all who were to be saved in the Old and the New Testament. For Scripture declares that there is a single good pleasure, purpose, and plan of God’s will, by which he chose us from eternity both to grace and to glory, both to salvation and to the way of salvation, which God prepared in advance for us to walk in.</p></blockquote>

</figure><figure class="quote" id="q-e55b8e106f" data-kw="">
<blockquote><p>Indeed we must remember that the love, election and predestination of God are ordered among themselves and follow on one another for a certain reason. First, all men in their unhappy estate are presented to the knowledge of God, as needy and miserable, then those of whom God of his pure and simple mercy loves and for whom He wills the good are distinguished from those He passes over, who are not comprehended within his benevolence: by this distinction they are said to be elect; the elect, truly, are appointed toward their end.</p></blockquote>

</figure><figure class="quote" id="q-fe1ca3704d" data-kw="">
<blockquote><p>The conclusion reached in this paper is that there are more similarities than disparities between Aquinas and Calvin on the doctrine of predestination. Some degree of continuity ought to be expected given that both men interpret the Apostle Paul’s teaching on predestination through the lens of Augustine to one degree or another. In some respects, Thomas reflects a more faithful reading of Augustine than Calvin since he recognizes the role of merit in the soteric process and leans in the direction of a single predestinarian view. However, Calvin does more justice to Augustine’s emphasis on human depravity and the necessity of saving grace to rescue man from destruction. As it pertains to this doctrine, the theology of Thomas… It would be a serious misrepresentation to classify his position as Semi-Pelagian… A comparison of views between these theological titans reveals several notable areas of incongruity. First, Thomas sees predestination as a part of God’s providence and focuses on causality while Calvin posits predestination, not providence, as determinative of our final end and approaches it soteriologically. Second, Thomas follows Augustine and argues that the attainment of glory is realized in conjunction with acquired merit through grace and the gift of perseverance. Calvin, on the other hand, is irreconcilably opposed to the role of human merit both prior to and subsequent to justification. Third, our election in Christ is vital for Calvin while Thomas hardly speaks to this at all. Fourth, Thomas by and large embraces a doctrine of negative or passive reprobation whereby God permits the reprobate to fall away leading to damnation. Calvin advocates double predestination, arguing that God actively wills the destruction of the reprobate irrespective of works. Fifth, while Thomas identifies no practical end for this doctrine, it serves as a ground of assurance in Calvin’s theology. While these differences are not inconsequential, areas of agreement should be given greater weight. Both share the same outlook on the cause, extent, and end of election, namely, God’s unmerited favor toward a select number of individuals freely chosen for eternal life for the purpose of manifesting his goodness in their redemption. Thomas and Calvin mutually affirm the total inability of man to please God without special grace, unconditional election, the limited efficacy of Christ’s atonement, efficacious grace, and the perseverance of the elect. One might deduce from these propositions a Thomistic version of TULIP. In the final analysis, Thomas and Calvin locate the source and means of salvation squarely in God’s sovereign grace. Man can neither initiate his salvation nor realize its consummation apart from grace. Individuals possess eternal life only because God has foreordained them to this end according to his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-b-cavalli.html">Francis B. Cavalli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Aquinas &amp; Calvin on Predestination: Is There Any Common Ground? [Yes]’ in Reformed Faith &amp; Practice, vol. 1, issue 2 (2016)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

C+arguing+that+God+actively+wills+the+destruction+of+the+reprobate+irrespective+of+works.+Fifth%2C+while+Thomas+identifies+no+practical+end+for+this+doctrine%2C+it+serves+as+a+ground+of+assurance+in+Calvin%E2%80%99s+theology.+While+these+differences+are+not+inconsequential%2C+areas+of+agreement+should+be+given+greater+weight.+Both+share+the+same+outlook+on+the+cause%2C+extent%2C+and+end+of+election%2C+namely%2C+God%E2%80%99s+unmerited+favor+toward+a+select+number+of+individuals+freely+chosen+for+eternal+life+for+the+purpose+of+manifesting+his+goodness+in+their+redemption.+Thomas+and+Calvin+mutually+affirm+the+total+inability+of+man+to+please+God+without+special+grace%2C+unconditional+election%2C+the+limited+efficacy+of+Christ%E2%80%99s+atonement%2C+efficacious+grace%2C+and+the+perseverance+of+the+elect.+One+might+deduce+from+these+propositions+a+Thomistic+version+of+TULIP.+In+the+final+analysis%2C+Thomas+and+Calvin+locate+the+source+and+means+of+salvation+squarely+in+God%E2%80%99s+sovereign+grace.+Man+can+neither+initiate+his+salvation+nor+realize+its+consummation+apart+from+grace.+Individuals+possess+eternal+life+only+because+God+has+foreordained+them+to+this+end+according+to+his+good+pleasure.%E2%80%9D%0A%0A%E2%80%94+Francis+B.+Cavalli%2C+%E2%80%98Aquinas+%26+Calvin+on+Predestination%3A+Is+There+Any+Common+Ground%3F+%5BYes%5D%E2%80%99+in+Reformed+Faith+%26+Practice%2C+vol.+1%2C+issue+2+%282016%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffe1ca3704d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fe1ca3704d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-decrees-of-god#:~:text=The%20conclusion%20reached%20in%20this%20paper,end%20according%20to%20his%20good%20pleasure&amp;text=The%20conclusion%20reached%20in%20this%20paper%20is%20that&amp;text=to%20this%20end%20according%20to%20his%20good%20pleasure" rel="noopener" target="_blank">Read it online · Reformed Books Online<

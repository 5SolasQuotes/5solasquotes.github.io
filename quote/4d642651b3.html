<blockquote><p>But those [leading English presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … V. They never accused the use of holy days, as days of thanksgiving to God for giving such holy apostles to the Church and whose memory we honorable commemorate.</p></blockquote>

</figure><figure class="quote" id="q-ba4f4a651c" data-kw="">
<blockquote><p>The most of the persons whom the Papists now keep holy days for were very religious godly people: And the zealous religious people of that age did think that the honoring of the memories of the martyrs was a great means to invite the infidels to Christianity and to encourage the weak to stick to Christ: and therefore they kept the days of their martyrdom in thanksgiving to God and in honor of them. The wicked of that age hated and persecuted both the martyrs and them that honored them. In the next age, religion being uppermost in the world, the wicked did turn hypocrites and keep holy days for the honor of their names whom their forefathers murdered. At last when it was observed that the Papists who burned the living saints were the greatest honorers of the dead, the most religious people turned quite to dislike and reject those very days which their predecessors had set up in thanksgiving to God for the doctrine, example and constancy of the martyrs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, ‘Take heed of superstition, and observe well the circular course of zealous superstition…’, p. 280</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

opener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6851cdc0bb" data-kw="">
<blockquote><p>But to celebrate solemnly the day of a man’s birth, it has been a custom of all nations: and in my judgment, it is not done amiss, so that there be used a godly modesty. Surely it is a notable gift that we may be reckoned among the number of God’s creatures. And who doubts, but that it is well done, to give thanks unto God for it, and in thanksgiving to testify the joyfulness of mind by an outward token of some modest banket? The use of honest pleasures is such, as they have always godliness joined with them.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-7241c527d9" data-kw="">
<blockquote><p>Magistrates certainly have a power to appoint public days, yea, annual days of thanksgivings, for mercies never to be forgotten. Indeed they cannot make a day holy, so as it shall be a sin against God to labor in it, or to use any pleasures (as in the case of the sabbath); but they may command the public worship of God to be performed on particular days, and men ought to attend it when with convenience they can; only they ought to take care that such days be not spent in luxury and profaneness, and that they be for signal providences, and not so multiplied, and frequently renewing, as that the service of them degenerate into mere matter of form. Whether Christ went up in order to the feast [of dedication], or because of the great concourse of people he knew would be there at that time, cannot be determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on John 10</cite>, v. 22</span></figcaption>

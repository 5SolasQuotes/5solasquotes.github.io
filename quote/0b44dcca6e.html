<main class="wrap"><figure class="quote" id="q-0b44dcca6e" data-kw="">
<blockquote><p>I answer, recommendatory letters can never give a Church-right to the Church-privileges of the seals of the Covenant: they do but only notify, manifest and declare the Church-right which the man had before. Therefore, either he cannot in any sort be capable of the seals of the Covenant in another congregation than his own whereof he is an inchurched member [as upon a congregationalist view], which destroys all communion of sister Churches, or if he be capable of the seals in another congregation [which be the case], he was capable and had a Church-right in himself before he received recommendatory letters: yea, these whom we recommend by letters as fit to partake of the sacraments in another congregation, we presuppose they have Church-right to the seals in another congregation-visible than in their own whereof they are members, except our testimony be false. Therefore, before our recommendatory letters, the person of approved piety was a member of all the visible Churches about, hoc ipso, and ‘by that same reason,’ that he is a member of one visible congregation: Yea Peter clearly insinuates that all who have received the Holy Ghost, are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the Eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals, and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer when he goes to another visible congregation than his own, that faith gives him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does as a condition notify this faith and Church-right in all congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5, pp. 195-96 Rutherford (c. 1600–1661) was a Scottish presbyterian Westminster divine.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d2c47fb0a" data-kw="">
<blockquote><p>4. The manner of performing this worship of sanctifying the Lord’s Day in holy duties is required not only to be in public, nor only in secret, but [also] by the members of each family jointly, and apart from other families. For 1. It [the 4th Commandment] cannot be understood to require worship only in public together, because: 1. There may be in some cases no access to public worship, and yet the command of sanctifying the Lord’s Day lies still on, and no doubt by families. 2. Waiting on public worship is but one piece of sanctifying the Lord’s Day, and that but in a part of it; therefore there must be some other thing included here.</p></blockquote>

<blockquote><p>7th Question: Is it necessary in essence for the Church, or at least as a requirement, that all its members be closely united in terms of locality? Response: Conclusion: It is very convenient, so this should generally be observed, that members are constituted from a common locality, such as from a neighborhood or city. Because such is suggested by the practice of the Apostolic Church. For we do not read that the inhabitants of Cenchreae were included in the Church of the Corinthians, or vice versa. Because if they can observe one another more easily, they can stimulate love and good works, Hebrews 10, and give and receive examples. Because in this way they can best encourage, comfort, and build each other up, 1 Thess. 5:11,14, and indeed as mentioned in Heb. 3:13. Conclusion: Therefore, it should not be proven that without a just necessity, citizens, for example, of our city should be enrolled in the Church of a neighboring city or village, and vice versa. Because this inconvenience exists and affects many looking towards ecclesiastical communion; for the enjoyment of which God primarily instituted gatherings and ecclesiastical societies: See the statements of the preceding problem. Because it breeds confusion, contentions, and divisions among members and churches; it removes harmony and weakens the vigor of ecclesiastical discipline. Hence, ancient canons have prohibited transitions and appeals to other churches for both private believers and clergy. See the Canons of the African Church, especially Canons 23, 28, 54, 105, 125, and notably the Canons and Acts of the Council of Carthage in the year 419, where a synodical letter to Boniface, Bishop of the Roman Church, shows that one should not be summoned from Africa across the sea to the See of Rome. The constitutions, decrees, and practices of the Belgian Churches absolutely prohibit any transfer from one church to another, whether of the same language or a different one, without good permission and dismissal, or written testimony from the church of which one is a member. This especially applies to those transient members around whom the office of correction or even censorship is exercised. Because it smacks of schismatic and factious behavior or carnal curiosity, i.e., factionalism, pride, and disdain; similarly as in the Church of Corinth, 1 Cor. 1:12 &amp; 3:3. Conclusion: If in any case, due to urgent reasons, it is granted to someone or some people to be enrolled in a church outside their place of residence, or to remain in the same church after moving to a nearby city or village, this must be done with the advice and consent of both churches. Conclusion: Another reason is far different when churches are not of the same confession or at least differ to the extent that the advantages of local presence and cohabitation are postponed for the tranquility of conscience and safer and much greater edification. This must be dealt with elsewhere in detail, and we may touch on it below. Conclusion: Where faithful cannot enjoy the benefits of close cohabitation, they should not be circumscribed by the boundaries of that church and excluded from it, just as those who live outside the parish, city, or village should not be forced to join it any more than those who live there. Because the circumstance of location and civil cohabitation is external and accidental to the church; therefore, it is not of its nature or essence. Because it is not a necessary requirement. Ecclesiastical communion acts can be carried out among those members, although not as promptly, abundantly, easily, and excellently. For more and less do not alter the species. Because the status of a clandestine and troubled church often requires such a thing due to persecutions, heresies, schisms, and similar disturbances. Because the defects of other faithful, churches, and ministers in many places leave nothing else for the faithful but to resort to this last refuge, especially since they cannot use the first ship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbert-voetius.html">Gisbert Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’</cite>, pp. 59-60 (PDF pp. 62-64)</span></figcaption>

op+of+the+Roman+Church%2C+shows+that+one+should+not+be+summoned+from+Africa+across+the+sea+to+the+See+of+Rome.+The+constitutions%2C+decrees%2C+and+practices+of+the+Belgian+Churches+absolutely+prohibit+any+transfer+from+one+church+to+another%2C+whether+of+the+same+language+or+a+different+one%2C+without+good+permission+and+dismissal%2C+or+written+testimony+from+the+church+of+which+one+is+a+member.+This+especially+applies+to+those+transient+members+around+whom+the+office+of+correction+or+even+censorship+is+exercised.+Because+it+smacks+of+schismatic+and+factious+behavior+or+carnal+curiosity%2C+i.e.%2C+factionalism%2C+pride%2C+and+disdain%3B+similarly+as+in+the+Church+of+Corinth%2C+1+Cor.+1%3A12+%26+3%3A3.+Conclusion%3A+If+in+any+case%2C+due+to+urgent+reasons%2C+it+is+granted+to+someone+or+some+people+to+be+enrolled+in+a+church+outside+their+place+of+residence%2C+or+to+remain+in+the+same+church+after+moving+to+a+nearby+city+or+village%2C+this+must+be+done+with+the+advice+and+consent+of+both+churches.+Conclusion%3A+Another+reason+is+far+different+when+churches+are+not+of+the+same+confession+or+at+least+differ+to+the+extent+that+the+advantages+of+local+presence+and+cohabitation+are+postponed+for+the+tranquility+of+conscience+and+safer+and+much+greater+edification.+This+must+be+dealt+with+elsewhere+in+detail%2C+and+we+may+touch+on+it+below.+Conclusion%3A+Where+faithful+cannot+enjoy+the+benefits+of+close+cohabitation%2C+they+should+not+be+circumscribed+by+the+boundaries+of+that+church+and+excluded+from+it%2C+just+as+those+who+live+outside+the+parish%2C+city%2C+or+village+should+not+be+forced+to+join+it+any+more+than+those+who+live+there.+Because+the+circumstance+of+location+and+civil+cohabitation+is+external+and+accidental+to+the+church%3B+therefore%2C+it+is+not+of+its+nature+or+essence.+Because+it+is+not+a+necessary+requirement.+Ecclesiastical+communion+acts+can+be+carried+out+among+those+members%2C+although+not+as+promptly%2C+abundantly%2C+easily%2C+and+excellently.+For+more+and+less+do+not+alter+the+species.+Because+the+status+of+a+clandestine+and+troubled+church+often+requires+such+a+thing+due+to+persecutions%2C+heresies%2C+schisms%2C+and+similar+disturbances.+Because+the+defects+of+other+faithful%2C+churches%2C+and+ministers+in+many+places+leave+nothing+else+for+the+faithful+but+to+resort+to+this+last+refuge%2C+especially+since+they+cannot+use+the+first+ship.%E2%80%9D%0A%0A%E2%80%94+Gisbert+Voetius%2C+Ecclesiastical+Politics+tr.+by+AI+%28Amsterdam%3A+Joannes+%C3%A0+Waesberge%2C+1663%E2%80%931676%29%2C+vol.+1%2C+%E2%80%98The+Nature+of+the+Instituted+Church%E2%80%99%2C+pp.+59-60+%28PDF+pp.+62-64%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d7fb2af14.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d7fb2af14.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=7th%20Question%3A%20Is%20it%20necessary%20in,they%20cannot%20use%20the%20first%20ship&amp;text=7th%20Question%3A%20Is%20it%20necessary%20in%20essence%20for&amp;text=especially%20since%20they%20cannot%20use%20the%20first%20ship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Answer: I must entreat the reader carefully to distinguish here: … 2. Between obedience formally so called (which is, when we therefore obey in conscience because it is commanded, and the commander’s authority is the formal reason and object of our obedience) and obedience material only, which is properly no obedience, but a doing the thing which is commanded upon other reasons, and not at all because it is commanded. … And so I answer: … 4. Many such things may be done materially on other reasons (as for the Church’s good, the furtherance of the Gospel, the winning of men to God, the avoiding of scandal, or of hurt to others or ourselves, etc.) when they are not to be done in formal obedience, out of conscience to the authority imposing (as if it be commanded by one that has no just power).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, p. 888</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f89c9779a" data-kw="">
<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or, A Vindication of our Lawful Submission to the Present Government, or to a Government Supposed Unlawful, but Commanding Lawful Things, Likewise how such an Obedience is Consistent with our Solemn League &amp; Covenant</cite>, … (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse., p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>3… Yet I intend not to handle the case of invasion, to show in what cases only an invasion of another nation in a hostile manner is lawful: I am from all my books, that I cannot consult with casuists in that point… Had God given me life, I intended a large Treatise concerning the Usurpation of the Government of England, and the unlawfulness of the invasion of Scotland [by Cromwell]; but my collections being lost and taken away, they must die with me; I hope more able hands will write against the invasion, though they cannot fight against the invaders.</p></blockquote>

</figure><figure class="quote" id="q-09822e2260" data-kw="">
<blockquote><p>God gives kingdoms to whom He will. What then?… and He gives tyrannous conquests to whom He will: and it is Nebuchadnezzar to whom Daniel speaks that from the Lord [Dan. 5:21], and he had no just title to many kingdoms, especially to the kingdom of Judah, which yet God, the King of kings, gave to him because it was his good pleasure; and if God had not commanded them by the mouth of his prophet Jeremiah, might they not have risen, and, with the sword, have vindicated themselves and their own liberty, no less than they lawfully, by the sword, vindicated themselves from under Moab, (Judges 3) and from under Jabin, king of Canaan, who, twenty years, mightily oppressed the children of Israel, Judges 4. Now this Popish Prelate [John Maxwell], by all these instances, making heathen kings to be kings by as good a title as David and Hezekiah, [implicitly] condemns the people of God as rebels, if, being subdued and conquered by the Turk and Spanish king, they should, by the sword, recover their own liberty [such as happened the Reformation in the Netherlands]; and that Israel, and the saviours which God raised to them, had not warrant from the law of nature to vindicate themselves to liberty, which was taken from them violently and unjustly by the sword… for Nebuchadnezzar’s sovereignty over the people of God, and many other kingdoms also, was revenged of God as tyranny, Jer. 1:6-7; and therefore the vengeance of the Lord, and the vengeance of his temple, came upon him and his land, Jer. 1:16, etc. It is true the people of God were commanded of God to submit to the king of Babylon, to serve him, and to pray for him, and to do the contrary was rebellion; but this was not because the king of Babylon was their king, and because the king of Babylon had a command of God so to bring under his yoke the people of God. So Christ had a commandment to suffer the death of the cross (John 10:18) but had Herod and Pilate any warrant to crucify him? None at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-21b0057632" data-kw="">
<blockquote><p>Assertion 1 — There is an oath betwixt the king and his people, laying on by reciprocation of bands mutual civil obligation upon the king to the people and the people to the king; 2 Sam. 5:3, “So all the elders of Israel came to the king to Hebron, and king David made a covenant with them in Hebron before the Lord, and they anointed David king over Israel.” 1 Chron. 11:3, “And David made a covenant with them before the Lord, and they anointed David king over Israel, according to the word of the Lord by Samuel.” 2 Chron. 23:2-3, ” And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the chief of the fathers of Israel, and they came to Jerusalem. And all the congregation made a covenant with the king [Joash] in the house of God.” 2 Kings 11:17, “Jehoiada made a covenant between the Lord and the king and the people, that they should be the Lord’s people; between the king also and the people.” Eccl. 8:2, “I counsel thee to keep the king’s commandment, and that in regard of the oath of God.</p></blockquote>

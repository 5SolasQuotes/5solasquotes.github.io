<blockquote><p>It therefore now appears, that as the law or dictates of pure nature, comprehended together with other fit additionals, became at first one entire constitution aptly suited to the government of man in his innocent state, unto which the title did well agree of the law or covenant of works: so the same natural dictates, transcribed and made express (because now sullied, and not so legible in the corrupted nature of man) do, with such allays [alleviation] and additions as the case required, compose and make up the constitution which bears the title of the law or covenant of grace, or the law of faith, or the gospel of Christ; and is only suitable to the state of man lapsed and fallen, as the measure of that righteousness which he is now to aim at, and aspire unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessedness Of The Righteous Opened</cite>, (London, 1668), 26–27.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-30de8ba973" data-kw="">
<blockquote><p>Although the law in its covenant form requires of all who are under it since the fall perfect obedience as the condition of life and full satisfaction for sin their own persons, and at the same time, upon the revelation and offer of Christ in the gospel as Jehovah Our Righteousness, commands them to believe in Him as such; yet as is the case in various other instances of duty, it requires the one of these only on supposition that the other is not performed. The law as a covenant of works requires that all who are under it do present to it as the conditions of eternal life perfect obedience and complete satisfaction for sin, either in their own persons or in that of a responsible surety. So long, then, as a sinner, unwilling to be convinced of his sin and his want of righteousness, cleaves to the law as a covenant and refuses to accept and present in the hand of faith the spotless righteousness of the adorable Surety, that sinner continues “a debtor to do the whole law” (Gal. 5:3). He keeps himself under an obligation to do, in his own person, all that the law in that form requires and also to suffer all that it threatens. The righteous law, accordingly, goes on to use him as he deserves. It continues to proceed against him without the smallest abatement of its high demands, requiring of him the complete payment of his debt both of perfect obedience and of infinite satisfaction for his disobedience. As it accepts no obedience but that which is absolutely perfect or fully answerable to all its demands (Gal. 3:10–11), so the acceptance of a man’s person as righteous according to it will depend on the acceptance of [Christ’s] obedience (Matt. 5:18; Rom. 10:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 19.</span></figcaption>

</figure><figure class="quote" id="q-1b332b9bae" data-kw="">
<blockquote><p>Canon VII: As all his works were known unto God from eternity, (Acts 15:18), so in time, according to his infinite power, wisdom, and goodness, he made man, the glory and end of his works, in his own image, and, therefore, upright, wise, and just. Having created man in this manner, he put him under the Covenant of Works, and in this Covenant freely promised him communion with God, favor and life, if indeed he acted in obedience to his will. Canon VIII: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the’ course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death. Canon IX: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself. Canon X: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head and root with thc whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12,19) and “in Adam all die” (I Cor 15:21–22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty.</p></blockquote>

<blockquote><p>…describes the entire biblical history as a series of events by which an original covenant of works is gradually annulled, bringing new phases in the history of the covenant of grace. He shows that God’s standard way of relating to mankind is through covenant, which, at its heart, is friendship with God.” – Bookflap Vlak, Johannes – Dissertation 1, On the Covenant of Works of God in A Triad of Dissertations: on the Covenants of God of Works &amp; of Peace, &amp; on Justification in Response to Leydekker (1689), pp. 71-170 trans. AI Latin Vlak (c.1635-1690) appears to have leaned towards Cocceius, contra Leydekker who was a Voetian. Flavel, John – Vindiciæ Legis &amp; Fœderis: or, A Reply to Mr. Philip Cary’s Solemn Call, wherein he Pretends to Answer All the Arguments of Mr. Allen, Mr. Baxter, Mr. Sydenham, Mr. Sedgwick, Mr. Roberts, and Dr. Burthogge for the Right of Believers’ Infants to Baptism, by Proving the Law at Sinai &amp; the Covenant of Circumcision with Abraham were the Very Same with Adam’s Covenant of Works, &amp; that Because the Gospel-Covenant is Absolute (London, 1690) . 1700’s Hopkins, Ezekiel – The Doctrine of the Two Covenants, wherein the Nature of Original Sin is at Large Explained… (London, 1712) Table of Contents This is also in vol. 2 of his Works. Hopkins (1634-1690) was a reformed, Anglican divine in the Church of Ireland. Hog, James – Some Select Notes Towards Detecting a Covered Mixture of the Covenant of Works, &amp; of Grace: With the Danger of that Evil; &amp; a Few Advices for Remedying Thereof. Contained in a Letter to a Friend Upon the Head Ref (1718) 20 pp. Hog (c.1658-1734) was a Scottish minister at Carnock, known for his role in the Marrow Controversy within the Church of Scotland. Taylor, Richard – Discourses on the Fall &amp; Misery of Man: &amp; on the Covenant of Grace (London: John Clark, 1725) 379 pp. Herman Witsius footnotes this work under the statement: “The formularies of the Protestant Churches in general, and the writings of the most eminent Reformed Divines…” – On the Apostles’ Creed, Note XII, p. 386 Wilson, David – Palæmon’s Creed Reviewed &amp; Examined: wherein Several Gross &amp; Dangerous Errors, Advanced by the Author of the Letters on Theron &amp; Aspasio, are Detected &amp; Refuted; &amp; the Protestant Doctrine Concerning the Covenant of Works &amp; the Covenant of Grace, Conviction of Sin, Regeneration, Faith, Justification, Inherent Grace, etc., Vindicated from the Cavils and Exceptions of that Author, and shown to be entirely conformable to the Apostolic Doctrine concerning the several points afore-mentioned, vol. 1, 2 (London, 1762) Wikipedia: “Theron and Aspasio, or a series of Letters upon the most important and interesting Subjects [by James Hervey, 1724-58, an Anglican clergyman], which appeared in 1755, and was equally well received, called forth some adverse criticism even from Calvinists, on account of tendencies which were considered to lead to antinomianism, and was strongly objected to by Wesley in his Preservative against unsettled Notions in Religion. Besides carrying into England the theological disputes to which the Marrow of Modern Divinity had given rise in Scotland (the Marrow Controversy), it also led to what is known as the Sandemanian controversy as to the nature of saving faith.</p></blockquote>

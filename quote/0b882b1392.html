<main class="wrap"><figure class="quote" id="q-0b882b1392" data-kw="">
<blockquote><p>SINCE the fall of man, the conflict between truth and error, religion and irreligion, sound morals and immorality, has been incessant, and it must continue till the God of truth and righteousness “shall set judgment in the earth.”

As in all other conflicts, so in this, there are cardinal points around which the contest has been most obstinate — each of the parties convinced that success or failure depends upon the gaining and holding of these.

One of the most important of these points is the question respecting the divine authority of the Sabbath, both as a religious and civil institution. The estimate put upon the question by both the friends and the enemies of religion and morals, is indicated by the persevering earnestness with which the controversy has been carried on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathan-l-rice.html">Nathan L. Rice</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Origin and History of the Sabbath in The Christian Sabbath: Its History, Authority, Duties, Benefits, and Civil Relations. A Series of Discourses</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60858bca7e" data-kw="">
<blockquote><p>Now England cannot abide this gear, they cannot be content to hear God’s Minister and his threatening for their sin. Though the Sermon be never so good, though it be never so true. It is a naughty fellow, a seditious fellow, he maketh trouble and rebellion in the Realm, he lacketh discretion, but the Ninevites rebuked not Jonas that he lacketh discretion, or that he spake out of time, that his Sermon was out of season made.

But in England if God’s Preacher, Gods Minister be any thing quick, or do speak sharply, then he is a foolish fellow, he is rash, he lacketh discretion. Nowadays if they cannot reprove the doctrine that is preached: then they will reprove the Preacher that he lacketh dew consideration of the times, and that he is of learning sufficient, but he wanteth discretion, what a time is this picked out to preach such things, he should have a respect and a regard to the time, and to the state of things, and of the Common weal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-latimer.html">Hugh Latimer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most faithful sermon preached before the King’s most excellent Majesty, and his most honourable Council, in his court at Westminster</cite>, (London: John Day, 1550), unpaginated.</span></figcaption>

<blockquote><p>[I]t is called an holy rest, the rest of the holy Sabbath, and the commandment expressly saith, Remember to keep it holy. Now an holy rest certainly stands distinguished from a rest merely natural, when our bodies cease from action, and worldly labour, 2. A rest that is profane. By which I understand not only a sinful rest, unlawful on any day; but a rest from recreations, and pastimes, lawful enough on other days.

We read not in the old Law of any toleration for sports on the Sabbath, we read on the contrary that it was to be an holy rest, kept holy, &amp;c. To which sports cannot contribute: It seems unreasonable to think that labour should be forbidden, in order to our more serious and solemn service of God, and yet sports should be allowed, which every way as much distract, and unfit the Soul for acts of solemn worship. But the prophets are best interpreters of the Law.

Now the prophet Isaiah, Isa. 58.13. expounding this Law saith, If thou turn away thy foot from the Sabbath, from doing thy pleasure on my holy-day, and call the Sabbath a delight, the holy of the Lord, honourable, and shalt honour him, not doing thine own ways, nor finding thy own pleasure, nor speaking thy own words: Then shalt thou delight thy self in the Lord, and I will cause thee to ride upon the high places of the Earth, and feed thee with the heritage of Jacob thy father, for the mouth of the Lord hath spoken it. There is a precept v. 13. and a promise annexed to the due observance of that precept v. 14. The precept is directive for the sanctification of the Sabbath, which is called the Sabbath, the Lord’s holy day. The end of the Sabbath for which God instituted it, and which every one ought in the observation of it to aim at; and shalt honour him, the honouring and glorifying of God, that is the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), pp 99-100.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

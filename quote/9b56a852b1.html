<blockquote><p>Q. 9. Is there any other day holy besides this day [i.e. the Sabbath]?

A. No day but this is holy by institution of the Lord; yet days of humiliation and thanksgiving may be lawfully set apart by men on a call of providence; but popish holidays are not warrantable, nor to be observed; Gal. iv. 10. Ye observe days, and months, and times, and years.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of the Assembly’s catechism. With practical inferences from each question: as it was carried on in the Lord’s Days exercises in</cite>, Dartmouth, in the first year of liberty, 1688 (1692) in The works of John Flavel (6 vols, London, 1820), vi, 234.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d6b1585704" data-kw="">
<blockquote><p>But you tell us, why we do so much avoid the Fathers.” I had rather you would tell us why you do so carefully avoid the Scriptures. “For” (say you) “they that cannot away with set times of Fasting, must needs be offended with Basil, Nazianzen, Leo, and Chrysostom, which have published excellent Sermons of Lent.” Christ ordained no set and ordinary fasts in the Gospel, Lent was appointed long after, and the manner of observing it in those times, was not one and the same in all Churches. We both allow and use public and Christian fasts which are fitted to the time and the Churches’ occasions: as for your appointed, and yearly solemn fasts, we do with good reason reject them, because they are full of superstition, and injurious unto Christian liberty. Our judgement of fasting is the same which Augustine hath taught: I find it not set down in any Commandment of the Lord, or his Apostles, what days we ought to fast, what not. Augustine then knew not these your set yearly ceremonies of fasting, nor your Lenten fast, which hath a certain time and number of days prescribed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to the Ten Reasons of Edmund Campian, the Jesuit</cite>, … (London, 1606), 133–34 [spelling and punctuation modified].</span></figcaption>

<blockquote><p>RHEMI. [ 1. Desert.] As John the Baptist, so our Saviour by going into the desert and there living in contemplation even among brute beasts, and subject to the assaults of the Devil for our sins, gives a warrant and example to such holy men as have lived in wilderness for penance and contemplation, called Eremites. CARTW. 1. [1. Desert] We have learned that every action of Christ is our instruction, but that every action of his is our imitation (which must be proved to maintain this conclusion) is a strange voice which our ears were never acquainted with: the untruth whereof (as in many other cases) is manifest in this. And first of all, in the working cause, which was the holy Ghost, that led him into the Desert; whereby his immediate and extraordinary sending into the wilderness is signified by the power of his own Spirit rapt in the body to the Desert. And as his calling was this way extraordinary: so the means to prove this extraordinary calling was suitable. For it appears as Elias was often time, and Philip once taken up by the Angel of the Lord, or otherwise taken up, and miraculously transported: so also was our Saviour Christ. This is first noted in the composition of the word, which signifying either to bring again, or else to carry up: the former signification not framing with the place, the latter must be received, and so it is used of S. Paul. Secondly, this is confirmed by the word which S. Mark uses, that notes a powerable and sudden transport of his person into the wilderness. Thirdly, this is evident by his return from the wilderness, which S. Luke affirmed to have been in the power and virtue of the same Spirit, wherewith he had been anointed and carried up into the Wilderness, and therefore not in the common natural power of a man. Lastly, the Evangelist seems to have left some mark hereof in that he closes up this story of his carriage and re-carriage to and fro the Wilderness, whereof when your Eremites are utterly destitute; and that (unless you be marvelously impudent) by your own confession: the Eremites can have no other guide of their voluntary leaping into the Wilderness then the spirit of Satan, contrary to that Spirit which led our Saviour Christ thither. Secondly, of the end of his going, partly to testify his Divine Glory in abstinence from meat the space of forty days, which hath no place in your Eremites: partly to be tempted of the Devil, which ought to have as little place in them, if they knew the meaning of the last petition in the Lords prayer: for our Saviour Christ herein sought the fittest place of temptation, as the Stories of the possessed by devils do declare, whom the devils to greater terror and horror; drove into the solitary and fearful places: Unless therefore the Jesuits dare say that we may lay our selves open, yea seek the occasion of most dangerous temptation, it is evident that this example of our Saviour Christ, seals no warrant of an Eremetical life. Where the folly of the Jesuits is yet more manifestly decried, for having no ground here but of Christs example, yet have they clean altered the end of their Eremites flight into the Wilderness: assigning it to be penance, whereof they have no shadow in his example of going thither, yet were it meet that they should profess their penance among men, rather then among beasts, that they might have the same witnesses of their repentance, whom they had beholders of their fall. Again, if the warrant of Eremetical life be fetched from this example. it must of necessity be shut up within the space of forty days, and as many nights, after which time our Saviour returning from his temptations, lived the rest of his life in the common society of men. Further, if both John which lived in great austerity of life, and our Saviour Christ who lived in a more liberal sort, after the accustomed manner of men, be examples of Eremetical life; it follows that the Eremites may at their choice, either live austerely by the example of John, or in great freedom of meats and drinks by the example of our Saviour Christ; contrary to your doctrine of Eremetical life, And here you put me in remembrance of the notable injury you do to our Saviour Christ, who making him an Eremite, make John Baptist his Prince, whose shoe-latchets notwithstanding he was not worthy to loose. Verily these fables were not well put together: wherein if you would salve the matter, by expounding Prince for the first Eremite, you have barred your selves from this answer, with a double bar: First, in that otherwhere you make Elias an Eremite, who was before John: Secondly, in that you cannot bear the Princedom sometime of the Fathers ascribed to Peter over the Apostles, to be interpreted, the first either in time, or in order, but will needs have it first in dignity: which interpretation if you will so stiffly stand unto, then have you made a fair hand, which by the same construction lift up John above our Saviour Christ? that is to say, the servant above his Master. We see not therefore; but you must fetch the warrant of your Eremetical profession from the tempter himself, who is a greater haunter of the Wildernesses then either of those personages which you have yet named. And although there be no ground of your Eremetical profession, yet there is a law of leprosy, which casting both you and your Eremites out of Cities and Towns, will make you field-men, least the infection of your manifold hypocrisy and superstition should spread it self among God’s people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Confutation of the Rhemists’ Translation, Glosses and Annotations on the New Testament</cite>, … (Leiden, 1618), 16–17. [spelling and punctuation modernized]</span></figcaption>

inted+and+carried+up+into+the+Wilderness%2C+and+therefore+not+in+the+common+natural+power+of+a+man.+Lastly%2C+the+Evangelist+seems+to+have+left+some+mark+hereof+in+that+he+closes+up+this+story+of+his+carriage+and+re-carriage+to+and+fro+the+Wilderness%2C+whereof+when+your+Eremites+are+utterly+destitute%3B+and+that+%28unless+you+be+marvelously+impudent%29+by+your+own+confession%3A+the+Eremites+can+have+no+other+guide+of+their+voluntary+leaping+into+the+Wilderness+then+the+spirit+of+Satan%2C+contrary+to+that+Spirit+which+led+our+Saviour+Christ+thither.+Secondly%2C+of+the+end+of+his+going%2C+partly+to+testify+his+Divine+Glory+in+abstinence+from+meat+the+space+of+forty+days%2C+which+hath+no+place+in+your+Eremites%3A+partly+to+be+tempted+of+the+Devil%2C+which+ought+to+have+as+little+place+in+them%2C+if+they+knew+the+meaning+of+the+last+petition+in+the+Lords+prayer%3A+for+our+Saviour+Christ+herein+sought+the+fittest+place+of+temptation%2C+as+the+Stories+of+the+possessed+by+devils+do+declare%2C+whom+the+devils+to+greater+terror+and+horror%3B+drove+into+the+solitary+and+fearful+places%3A+Unless+therefore+the+Jesuits+dare+say+that+we+may+lay+our+selves+open%2C+yea+seek+the+occasion+of+most+dangerous+temptation%2C+it+is+evident+that+this+example+of+our+Saviour+Christ%2C+seals+no+warrant+of+an+Eremetical+life.+Where+the+folly+of+the+Jesuits+is+yet+more+manifestly+decried%2C+for+having+no+ground+here+but+of+Christs+example%2C+yet+have+they+clean+altered+the+end+of+their+Eremites+flight+into+the+Wilderness%3A+assigning+it+to+be+penance%2C+whereof+they+have+no+shadow+in+his+example+of+going+thither%2C+yet+were+it+meet+that+they+should+profess+their+penance+among+men%2C+rather+then+among+beasts%2C+that+they+might+have+the+same+witnesses+of+their+repentance%2C+whom+they+had+beholders+of+their+fall.+Again%2C+if+the+warrant+of+Eremetical+life+be+fetched+from+this+example.+it+must+of+necessity+be+shut+up+within+the+space+of+forty+days%2C+and+as+many+nights%2C+after+which+time+our+Saviour+returning+from+his+temptations%2C+lived+the+rest+of+his+life+in+the+common+society+of+men.+Further%2C+if+both+John+which+lived+in+great+austerity+of+life%2C+and+our+Saviour+Christ+who+lived+in+a+more+liberal+sort%2C+after+the+accustomed+manner+of+men%2C+be+examples+of+Eremetical+life%3B+it+follows+that+the+Eremites+may+at+their+choice%2C+either+live+austerely+by+the+example+of+John%2C+or+in+great+freedom+of+meats+and+drinks+by+the+example+of+our+Saviour+Christ%3B+contrary+to+your+doctrine+of+Eremetical+life%2C+And+here+you+put+me+in+remembrance+of+the+notable+injury+you+do+to+our+Saviour+Christ%2C+who+making+him+an+Eremite%2C+make+John+Baptist+his+Prince%2C+whose+shoe-latchets+notwithstanding+he+was+not+worthy+to+loose.+Verily+these+fables+were+not+well+put+together%3A+wherein+if+you+would+salve+the+matter%2C+by+expounding+Prince+for+the+first+Eremite%2C+you+have+barred+your+selves+from+this+answer%2C+with+a+double+bar%3A+First%2C+in+that+otherwhere+you+make+Elias+an+Eremite%2C+who+was+before+John%3A+Secondly%2C+in+that+you+cannot+bear+the+Princedom+sometime+of+the+Fathers+ascribed+to+Peter+over+the+Apostles%2C+to+be+interpreted%2C+the+first+either+in+time%2C+or+in+order%2C+but+will+needs+have+it+first+in+dignity%3A+which+interpretation+if+you+will+so+stiffly+stand+unto%2C+then+have+you+made+a+fair+hand%2C+which+by+the+same+construction+lift+up+John+above+our+Saviour+Christ%3F+that+is+to+say%2C+the+servant+above+his+Master.+We+see+not+therefore%3B+but+you+must+fetch+the+warrant+of+your+Eremetical+profession+from+the+tempter+himself%2C+who+is+a+greater+haunter+of+the+Wildernesses+then+either+of+those+personages+which+you+have+yet+named.+And+although+there+be+no+ground+of+your+Eremetical+profession%2C+yet+there+is+a+law+of+leprosy%2C+which+casting+both+you+and+your+Eremites+out+of+Cities+and+Towns%2C+will+make+you+field-men%2C+least+the+infection+of+your+manifold+hypocrisy+and+superstition+should+spread+it+self+among+God%E2%80%99s+people.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+A+Confutation+of+the+Rhemists%E2%80%99+Translation%2C+Glosses+and+Annotations+on+the+New+Testament%2C+%E2%80%A6+%28Leiden%2C+1618%29%2C+16%E2%80%9317.+%5Bspelling+and+punctuation+modernized%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a935d95f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a935d95f6.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/02/thomas-cartwright-contra-lent/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>This one thing, however, we can scarcely refrain from mentioning, with regard to what is written in the 24th chapter of the aforesaid [Second Helvetic] Confession [of 1566] concerning the ‘festival of our Lord’s nativity, circumcision, passion, resurrection, ascension, and sending of the Holy Ghost upon his disciples,’ that these festivals at the present time obtain no place among us; for we dare not religiously celebrate any other feast-day than what the divine oracles have prescribed. Everything else, as we have said, we teach, approve, and most willingly embrace [in the Second Helvetic Confession].</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1a742dd648" data-kw="">
<blockquote><p>his [Descartes’] warning… that the main questions about God and the soul’s distinction from the body are among those that should be demonstrated by philosophy rather than theology (Descartes, Meditations on First Philosophy in The Philosophical Writings of Descartes, vol. 2, tr. John Cottingham, et al., Cambridge Univ. Press, 1984, p. 3)… In the branch of philosophy called first philosophy or metaphysics, he accomplished little, only explaining and defending two questions about God’s existence and the soul’s distinction from the body. For apart from those questions belonging to pneumatics and natural theology, he was so caught up in explaining them and defending them against objections that he revealed too clearly his weakness in understanding and judging metaphysical formalities and abstractions. I will not even [describe] how he went about proposing such lofty and difficult philosophical ideas in a methodical, precise, clear, and evident way, or how he dealt with similar things and hypotheses taken or assumed without proof, or the non-principles on which he built his own ideas. Finally, there are the contradictions, confusions, and evasions he typically resorted to when attacked by opponents, like a man who has fallen into water grasping at anything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/voet-gisbert.html">Voet Gisbert</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 3</cite>, tr. Michael Lynch (1665)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ba50f9ac9" data-kw="">
<blockquote><p>A being is considered as possible, or as actual. When it is considered as possible, it is said to have an essence or nature; such were all things before their creation; When it is considered as actual, then it is said to have existence also; such are all things which are created, and God himself the Creator. Essence, therefore, is but the very nature of any being, whether it be actually existing or not… There is but one Being which includes existence in the very essence of it, and that is God, who therefore actually exists by natural and eternal necessity; but the actual existence of every creature is very distinct from its essence, for it may be, or may not be, as God pleases.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-watts.html">Isaac Watts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Logic</cite>, 1.2.1. cf. Aquinas, Of Being.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

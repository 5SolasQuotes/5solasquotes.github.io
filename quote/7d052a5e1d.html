<main class="wrap"><figure class="quote" id="q-7d052a5e1d" data-kw="">
<blockquote><p>These peculiar and distinctive principles of modern Independents or Congregationalists were not explicitly professed, and, of course, were neither formally defended nor assailed in the early church. As a subject of controversial discussion, they are wholly of modern origin. They seem to have been first publicly and distinctly broached, as exhibiting the scriptural views of the constitution and government of the church, by J.B. Morellius or Morely, who was connected with the Reformed Church of France, and whose work on the subject, entitled, ‘Traicte de la Discipline et Police Chretienne,’ was published at Lyons in 1561, and was soon thereafter condemned by the National Synod at Orleans in 1562, and again at Nismes in 1572. They were embraced also by [Peter] Ramus, the celebrated philosopher, who was killed in the massacre of St. Bartholomew; but they made no permanent impression upon the French Protestants. It was not till about twenty or thirty years later, near the end of the sixteenth century, that these views were brought out and practically acted upon in this country, by some persons… who were known for a time under the name of Brownists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, 2.548</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-947e6d6c05" data-kw="">
<blockquote><p>Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.</p></blockquote>

</figure><figure class="quote" id="q-ed97c098ff" data-kw="">
<blockquote><p>Although Baillie was fundamentally disenchanted with episcopacy after years of religious upheaval for which he blamed the Laudian episcopate, he had not abandoned the argument that a temporary episcopate could effectively restore unity to a fragmented and church. It was Baillie’s overriding desire for a return to peace and normalcy that led him not to contest publicly Charles II’s reestablishment of episcopacy but this did not preclude Baillie from exhorting leading nobles and the new archbishop of Glasgow privately. Ironically, this suggests that one of the explanations for the widespread conformity to the Erastian settlement of the post-restoration kirk may be found through analysis of the writings of one of the most strident proponents of a jure divino presbyterian polity. Such a conclusion cases mid-century presbyterians in more moderate light than has hitherto been the case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16c407d07f" data-kw="">
<blockquote><p>Whether it was a natural conception or a miraculous one? The latter is affirmed. Whether the flesh of Christ was conceived and formed in an instant? It is denied. Whether it was first conceived and formed and then united? It is denied with a distinction. …. Whether the soul of Christ was infused in the first instantiating of the conception of the body, or rather after? The latter is affirmed. Whether and in what way the embryo, or that body not yet animated, was able to be said to be the body of Christ? It is explained. Whether the flesh of Christ had its beginning from Adam? It is affirmed with a distinction. … Whether in the instantiating of the conception or of the union Christ was sactified by grace? It is distinguished. Whether in the same instantiating it had the use of free choice and reason? It is denied. Whether in the same instantiating, He was able to merit? It is denied. Whether from the first moment of conception Christ enjoyed the beatific vision? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations</cite>, … (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Conception &amp; Gestation</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether it was a natural conception or a miraculous one? The latter is affirmed. Whether the flesh of Christ was conceived and formed in an instant? It is denied. Whether it was first conceived and formed and then united? It is denied with a distinction. …. Whether the soul of Christ was infused in the first instantiating of the conception of the body, or rather after? The latter is affirmed. Whether and in what way the embryo, or that body not yet animated, was able to be said to be the body of Christ? It is explained. Whether the flesh of Christ had its beginning from Adam? It is affirmed with a distinction. … Whether in the instantiating of the conception or of the union Christ was sactified by grace? It is distinguished. Whether in the same instantiating it had the use of free choice and reason? It is denied. Whether in the same instantiating, He was able to merit? It is denied. Whether from the first moment of conception Christ enjoyed the beatific vision? It is denied.”

edbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=Whether%20it%20was%20a%20natural%20conception,the%20beatific%20vision%3F%20It%20is%20denied&amp;text=Whether%20it%20was%20a%20natural%20conception%20or%20a&amp;text=Christ%20enjoyed%20the%20beatific%20vision%3F%20It%20is%20denied" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-180a781acb" data-kw="">
<blockquote><p>…our causuists… consider of the conception, either as it is before it receive life, or after that it is animated: Before it receive life, they are wont to determine, that howsoever it were no less than mortal sin, in a physician to prescribe a medicinal receit [prescription] to cause abortion, for the hiding of a sin, or any outward secular occasion, yet for the preservation of the life of the mother, in an extreme danger (I say, before animation) it might be lawful: But after life once received, it were an heinous sin to administer any such mortal remedy. The latter casuists are better advised; and justly hold that to give any such expelling or destructive medicine, with a direct intention to work an abortment (whether before or after animation) is utterly unlawful, and highly sinful: And with them I cannot but concur in opinion; For, after conception we know that naturally follows animation, there is only the time that makes the difference, which in this case is not so considerable as to take off a sin… …the Septuagint in their translation (as [Leonardus] Lessius well observes) have rendered that Mosaical law (in Ex. 21[:22-23]) concerning abortions, in these terms: ‘If a man strike a woman that is with child, and she make an abortion, if the child were formed, he shall give his life for the life of the child; if it were not formed, he shall be punished with a pecuniary mulct to her husband,’ applying that to the issue [the fetus] which the Vulgar Latin understands of the mother; and making the supposition to be of a formation and life, which the Latin more agreeably to the [Hebrew] original, makes to be ‘death’; and our English [KJV], with Castalion expresses by ‘mischief’: but whether the mischief be meant of the death of the mother or of the late-living issue, the Scripture has not declared: Cornelius à Lapide taking it expresly of the mother’s death, yet draws the judgement out, in an equal length to the death of the child, once animated; making no difference of the guilt; since the infant’s soul is of no less worth than her’s that beats him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, … (London, 1654), 2nd Decade, Case 3, ‘Whether may it be lawful, in case of extremity, to procure the abortion of the child for the preservation of the mother?’, pp. 90-91, 93-95. Hall was a godly Anglican bishop.</span></figcaption>

</figure><figure class="quote" id="q-63430825e9" data-kw="">
<blockquote><p>…for in the ordinary course, nature proceeds in this manner: first, there is the mass of blood or seed received in the womb, but there is no parts of a body framed at the first: after a certain number of weeks, nature forms that substance into the parts of the body distinctly, but yet it is without life: then is the soul infused, when the body is organical, and so it is quickened and a true man; it is not before a man, but embryo as they call it… Now in the course of nature: first, that which is material is formed, as it were the house of the soul, and then the soul is infused, not only as the guest of it, but as the form and life of it:</p></blockquote>

<blockquote><p>…there can exist circumstances under which it is not only advisable but imperative that birth control should be practiced–for instance, where there are conditions of the utmost poverty in which it is impossible to provide for the needs of the children and to give them a fair chance in life. Or, where one of the parents is physically or mentally in such a state that it is undesirable for them to have children–if one of them, for instance, is subject to a disease that is likely to be handed on from parent to child, or if the mother’s physical condition makes pregnancy undesirable. And for every couple birth control is essential for the best spacing of children–so as to fit financial, physical and other circumstances. No hard and fast rules can be laid down.</p></blockquote>

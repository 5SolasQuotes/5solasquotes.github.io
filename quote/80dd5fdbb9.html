<main class="wrap"><figure class="quote" id="q-80dd5fdbb9" data-kw="">
<blockquote><p>XVIII. Baptism indeed promises us the submersion of our Pharaoh and the mortification of sin, yet not so that it is no more or does not trouble us, but only that it does not overcome us, on account of Christ who, by His blood, prevents its power from condemning, and by his Spirit, restrains it from dominating. This is not so that men may sleep securely in their sins, but only that they may not waver and lose heart, who are tickled and pricked by their flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), p. 6 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva. This quote is against Romanism.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-5fc4ed81cf" data-kw="">
<blockquote><p>Q. 26. Does sanctification occur in the conscious level of the life of believers or below that level in depth? It occurs below the level of conscious life and works out of the regnerate root of the soul on its dispositions and inclincations to sanctify them. Q. 27. Is sanctification a mediate or immediate work? As it takes place below the consciousness, it is primarily an immediate work. That, however, does not take away form the fact that in its manifestation it is tied by God to the use of certain means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, tr: Richard Gaffin 1 vol. ed., p. 802</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

— Geerhardus Vos, Reformed Dogmatics tr: Richard Gaffin 1 vol. ed., p. 802">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+26.+Does+sanctification+occur+in+the+conscious+level+of+the+life+of+believers+or+below+that+level+in+depth%3F+It+occurs+below+the+level+of+conscious+life+and+works+out+of+the+regnerate+root+of+the+soul+on+its+dispositions+and+inclincations+to+sanctify+them.+Q.+27.+Is+sanctification+a+mediate+or+immediate+work%3F+As+it+takes+place+below+the+consciousness%2C+it+is+primarily+an+immediate+work.+That%2C+however%2C+does+not+take+away+form+the+fact+that+in+its+manifestation+it+is+tied+by+God+to+the+use+of+certain+means.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+Reformed+Dogmatics+tr%3A+Richard+Gaffin+1+vol.+ed.%2C+p.+802&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5fc4ed81cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5fc4ed81cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=Q.%2026.%20Does%20sanctification%20occur%20in,to%20the%20use%20of%20certain%20means&amp;text=Q.%2026.%20Does%20sanctification%20occur%20in%20the%20conscious&amp;text=by%20God%20to%20the%20use%20of%20certain%20means" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-aea56bc91a" data-kw="">
<blockquote><p>Fourthly, they [Justification and Sanctification] are both equally imputed unto us through the righteousness of Christ. Therefore says St. Paul to the Corinthians, ‘To them that are sanctified in Christ Jesus,’ (1 Cor. 1:2) and to the Hebrews, it is said we are ‘sanctified by the blood of the Covenant.’ (Heb. 10:29) So that no less are we sanctified than justified by Christ’s death and merits, and the imputation of them. But on the other side, they are distinct in some formalities, such as these may be, for first, the immediate cause of our sanctification is in holy Scripture imputed to the operation and influence of the Holy Spirit, as our Justification is more properly attributed to Christ the mediator between God and man: As appears from St. Paul’s words to the Thessalonians, ‘But we are bound to give thanks always for you brethren beloved of the Lord, because God has from the beginning chosen you to salvation, through sanctification of the Spirit, and belief of the truth.’ (2 Thess. 2:13) And St. Peter, ‘Elect according to the foreknowledge of God the Father and Sanctification of the Spirit unto obedience.’ (1 Pet. 1:2)… For not only is a sinner by the Spirit of regeneration and sanctification purged from the old leaven of sin and malice, but he becomes a new lump, and unleavened (1 Cor. 5:7); and whereas he has ‘yielded his members as instruments of unrighteousness unto sin, he does yield himself unto God,’ (Rom. 6:13) as those that are alive from the dead. And old things are done away in him, and all things become new.’ (2 Cor. 5:17) And ‘whosoever is (thus) born of God; does not commit sin, for his seed remains in him, and he cannot sin because he is born of God.’ (1 Jn. 3:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-9d76353554" data-kw="">
<blockquote><p>§VIII. The external means are the Word (James 1:18, “Of his own will begat he us with the word of truth.” v. 21, “receive with meekness the engrafted word, which is able to save your souls.” 1 Pet. 1:23, “Being born again… by the word of God, which liveth.” Lk. 8:15; Gal. 3:2) and the sacraments (Jn. 3:5; Tit. 3:5; Gal. 3:27; Rom. 6:4; Lk. 22:20). The internal is faith (Gal. 5:6), hence in Acts 15:9, hearts are said to be purified by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI (Frankfurt: Zeitler, 1709), p. 3 Holtzfus (1659-1717) was a German, reformed professor of philosophy and theology at Frankfurt.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

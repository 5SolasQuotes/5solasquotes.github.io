<blockquote><p>Have we not the example of our Lord Jesus Christ? Are we better than he? Surely, if ever there was one who might justly plead that the common worship of the community had nothing to offer him it was the Lord Jesus Christ.

But every Sabbath found him seated in his place among the worshipping people and there was no act of stated worship which he felt himself entitled to discard. Even in his most exalted moods and after his most elevating experiences, he quietly took his place with the rest of God’s people sharing with them in the common worship of the community.

Returning from that great baptismal scene, when the heavens themselves were rent to bear him witness that he was well pleasing to God: from the searching trials of the wilderness, and from that first great tour in Galilee, prosecuted, as we are expressly told, “in the power of the Spirit”; he came back, as the record tells, “to Nazareth, where he had been brought up, and” — so proceeds the amazing narrative — “he entered, as his custom was, into the synagogue, on the Sabbath day.” “As his custom was!” Jesus Christ made it his habitual practice to be found in his place on the Sabbath day at the stated place of worship to which he belonged.

“It is a reminder,” as Sir William Robertson Nicoll well insists, “of the truth which, in our fancied spirituality, we are apt to forget — that the holiest personal life can scarcely afford to dispense with stated forms of devotion, and that the regular public worship of the church, for all its local imperfections and dullness, is a divine provision for sustaining the individual soul.”

“We cannot afford to be wiser than our Lord in this matter. If any one could have pled that his spiritual experience was so lofty that it did not require public worship. if any one might have felt that the consecration and communion of his personal life exempted him from what ordinary mortals needed, it was Jesus. But he made no such plea. Sabbath by Sabbath even he was found in the place of worship, side by side with God’s people, not for the mere sake of setting a good example, but for deeper reasons. Is it reasonable, then, that any of us should think we can safely afford to dispense with the pious custom of regular participation with the common worship of our locality?”

Is it necessary for me to exhort those who would fain be like Christ, to see to it that they are imitators of him in this?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Religious Life of Theological Students in Union Seminary Magazine</cite></span></figcaption>

<blockquote><p>Answer… It is blasphemy to seek this distinction of person and office in the King of kings, because by person in a mortal king, we understand a man that can sin.

1. I am not obliged to obey his [the king’s] personal commandment, except I were his domestic [servant], nor his unlawful personal commandments, because they are sinful.

2. It is false that you obey the king’s law because you obey the king; for then you say but this: ‘I obey the king because I obey the king.’ The truth is, obedience is not formally terminated on the person of the king. Obedience is relative to a precept, and it is men-service to obey a law, not because it is good and just, but upon this formal motive, because it is the will of a mortal man to command it. And reverence, love, fear, being acts of the affection, are not terminated on a law, but properly on the person of the judge; and they are modifications, or laudable qualifications of acts of obedience, not motives, not the formal reason why I obey, but the manner how I obey. And the apostle makes expressly fear of punishment a motive of obedience (Rom. 13:4), while he says, “He beareth not the sword in vain,” therefore be subject to the king; and this hinders not personal resistance to unjust commandments. … Answer.

1. To obey the king’s personal will when it is sinful (as we now suppose), against his legal will, is a sin and a disobedience to God and the king also, seeing the law is the king’s will as king; but to obey his legal will against his sinful personal will (as it must be sinful if contrary to a just law) is obedience to the king as king, and so obedience to God.

2. You take the king’s person to be himself, but you take quid pro quo [this for that]; for his ‘person’ here, you must not take physically for his suppost [agent] of soul and body, but morally: it is the king as a sinful man, doing his worst will against the law, which is his just and best will and the rule of the subjects. And the king’s personal will is so far just and to regulate the subjects insofar as it agrees with his legal will or his law, and this [personal] will can sin, and therefore may be crossed without breach of the Fifth Commandment; but his legal will cannot be crossed without disobedience both to God and the king. … Answer… We are to obey the king’s personal will when the thing commanded is not sin; but his subjects, as subjects, have little to do with his personal will in that notion. It concerns his domestic servant, and is the king’s will as he is the master of servants, not as he is king in relation to subjects; But we speak of the king’s personal will as repugnant to law and contrary to the king’s will as king, and so contrary to the Fifth Commandment; and this [personal will] is attended often not only with passion, but also with prejudice; and we owe no subjection to prejudice and passions, or to actions commanded by these disordered powers, because they are not from God, nor his ordinances, but from men and the flesh, and we owe no subjection to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), p. 150. Rutherford is responding to the royalist, Symmons.</span></figcaption>

<blockquote><p>M. First, this is want to be demanded, what is the form of this world, and specially of this body, within the compass whereof all these things are contained: for that some will have it to be spherical or round, as Aristotle: othersome of the fashion and likeness of the figure Icosaidron round compassing with a great many of Angles or Corners here and there in the top, as Plato: Others, plain and flat, like a skin stretched forth abroad, as S. Basil: others give it other forms, and those also diverse, as the Greek writer Cleomides reporteth in his title of the contemplation of circles.

S. Is there any of those opinions true?

M. God he knoweth. We, who in no place of his word doe read these matters plainly determined (unless perhaps some man will allege that which is written in Job the 22. Chapter, and 14. verse: and there is mention also made of the sphere of the earth in Isay the 40. chapter and 22. verse: and in S. James the 3. chapter and 6. verse, to the end he might prove that this world, and also the outmost heaven, are round like a circle or a wheel) do oftentimes fall &amp; are drawn into contrary opinions.

Verily, that the world is round, it seemeth unto me much the more probable, by that which is written, as I have said in Job the 20. chapter, and 14. verse: and in Eccles. the 24. chapter, and 8. verse: both for that it is the most beautiful and widest form of all other, by which it was needful that a compass which should contain in the bosom thereof so many things, should be framed: also for that the principal, and as it were the parts of the whole in respect of this world as are heaven, water, &amp; earth, are by our senses themselves perceived to be spherical and round, unto which it is credible that the compass of the whole world is semblable.

How be it, I can affirm nothing certainly thereof, since although we admit that this part which is nearest unto us, &amp; the lowermost of the circumference of the high heaven which we behold, and which environeth all thing, be bending, hollow, &amp; round notwithstanding it may be imagined that the farthermost and higher most part of the same circumference is of some other form: and I know there be some that have said that the uttermost and farthermost part of heaven is shaped like a bell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wonderful workmanship of the world wherein is contained an excellent discourse of Christian natural philosophy, concerning the form, knowledge, and use of all things created: specially gathered out of the fountains of holy Scripture</cite>, trans. Thomas Twyne (London: Andrew Maunsell, 1578), p. 28.</span></figcaption>

</figure><figure class="quote" id="q-8ff51caef2" data-kw="">
<blockquote><p>As touching that point whether the minister should wear it [the surplice, a white garment], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Reply, pt. 2</cite>, ch. 8, pp. 262–63</span></figcaption>

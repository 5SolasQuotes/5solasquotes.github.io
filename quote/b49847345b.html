<main class="wrap"><figure class="quote" id="q-b49847345b" data-kw="">
<blockquote><p>Humility.—A measure of this grace is to be expected in every true Christian: but it can only appear in proportion to the knowledge they have of Christ and of their own hearts. It is a part of C’s [1] daily employment to look back upon the way by which the Lord has led him; and while he reviews the Ebenezers he has set up all along the road, he sees, in almost an equal number, the monuments of his own perverse returns, and how he has in a thousand instances rendered to the Lord evil for good. Comparing these things together, he can without affectation adopt the Apostle’s language, and style himself “less than the least of all saints, and of sinners the chief.”

A and B know that they ought to be humbled; but C is truly so, and feels the force of that text which I mentioned in my last; Ezek. xvi. 63. Again, as he knows most of himself, so he has seen most of the Lord. The apprehension of infinite Majesty combined with infinite Love, makes him shrink into the dust. From the exercise of this grace he derives two others, which are exceedingly ornamental, and principal branches of the mind which was in Christ.

The one is, submission to the will of God. The views he has of his own vileness, unworthiness, and ignorance, and of the Divine sovereignty, wisdom, and love, teach him to be content in every state, and to bear his appointed lot of suffering with resignation, according to the language of David in a time of affliction, “I was dumb, and opened not my mouth, because thou didst it.”

The other is, tenderness of spirit towards his fellow-Christians. He cannot but judge of their conduct according to the rule of the word. But his own heart, and the knowledge he has acquired of the snares of the world, and the subtilty of Satan, teach him to make all due allowances, and qualify him for admonishing and restoring, in the spirit of meekness, those who have been overtaken in a fault. Here A is usually blameable; the warmth of his zeal, not being duly corrected by a sense of his own imperfections, betrays him often into a censorious spirit. But C can bear with A likewise, because he has been so himself, and he will not expect green fruit to be ripe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-newton.html">John Newton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter XII, Forty-One Letters on Religious Subjects</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67d7d97470" data-kw="">
<blockquote><p>It is the special office of the Spirit to convince the world of sin; to reveal Christ, to regenerate the soul, to lead men to the exercise of faith and repentance; to dwell in those whom He thus renews, as a principle of a new and divine life. By this indwelling of the Spirit, believers are united to Christ, and to one another, so that they form one body. This is the foundation of the communion of saints, making them one in faith, one in love, one in their inward life, and one in their hopes and final destiny.</p></blockquote>

</figure><figure class="quote" id="q-18a8af8811" data-kw="">
<blockquote><p>No amount of mere external evidence can produce genuine faith. The Israelites, who had seen a long succession of wonders in the land of Egypt, who had passed through the divided waters of the Red Sea, who were daily receiving by miracle food from heaven, who had trembled at the manifestations of the Divine majesty on Mount Sinai, within sight of that mountain made a golden calf their god. The men who saw the miracles of Christ performed almost daily in their presence, cried out, ‘Crucify him! Crucify him!’ Hence our Saviour said, that those who hear not ‘Moses and the prophets, neither will they be persuaded, though one rose from the dead.’ We may confidently conclude, therefore, that those who now believe not the gospel, would not be persuaded had they seen all the miracles which Christ performed. It is important that the attention of the doubting should be directed to the fact, that their want of faith is to be attributed to their own moral state, and not to any deficiency in the evidence of the truth. ‘If the gospel be hid,’ says the apostle, ‘it is hid to them that are lost: in whom the god of this world hath blinded the minds of them which believe not, lest the light of the glorious gospel of Christ, who is the image of God, should shine unto them’ (2 Cor. 4:3, 4).</p></blockquote>

</figure><figure class="quote" id="q-d8a938995a" data-kw="Spirit proceeds Filioque deity">
<blockquote><p>The Holy Spirit proceeds from the Father and the Son, and the reason is that He is called the Spirit of the Son in Galatians 4:6 and Romans 8. He who is called the Spirit of God is the same who is also called the Spirit of Christ. The second reason is that He is so the Spirit of the Son that He is sent by the Son (John 16:7, 14). But if one is sent, he is sent either by authority, or by counsel, or by natural production. He is not sent by authority, since He is God; nor by counsel, since He is also God—for one who is such is instructed by one wiser than himself. Therefore He is sent by natural procession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputations on the Holy Spirit</cite>, II</span></figcaption>

</figure><figure class="quote" id="q-3d64d40d2a" data-kw="">
<blockquote><p>As the Head of his Church, Christ is its source of spiritual influence. In him, for the use of his Church, the Spirit dwells in immeasurable degree. For the “Father giveth not the Spirit by measure unto his Son.” It has thus pleased the Father, that in him all fulness should dwell; and the conclusion is clear — Out of his fulness may we all receive, even grace upon grace. Oh, it was no scanty supply of the Spirit Christ ensured for his Church. There is no risk of soon draining this fountain dry. Believe it, it is inexhaustible. Hither may you repair, and drink of the water of life as largely as your finite capacities will admit of, and yet leave it undiminished.

Mark well, for it is important, the encouragement afforded us by the death of Christ to expect free and full communications of the Holy Spirit. Had Christ not died, the Spirit could in no degree — not even in the smallest —have been sent forth to enlighten, and sanctify, and save; for the justice of God, unpropitiated and unappeased, would have stood immoveably in the way of this. But now Christ having died, and justice being satisfied, and every obstacle on God’s part removed, what hinders that the Spirit be now shed forth through Christ, and that not grudgingly and sparingly, but cheerfully and abundantly?

It is now not merely consistent with the Divine character that the Spirit may be obtained. The glory of the Divine character requires that what Christ died for be accomplished — that what he purchased be bestowed. To imagine that Christ has obtained by his death only a small measure of spiritual influence for the Church, is virtually to detract from the merit and efficacy of his death. To go to God with doubting, confused, straitened desires for the Spirit, is virtually to deny that the Spirit is the purchase of Christ for his Church, and to insinuate that something yet remains to be done to entitle us to receive him, at least so fully as we need.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-l-r-foote.html">Alexander L. R. Foote</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of the Lord not Straitened in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

Mark well, for it is important, the encouragement afforded us by the death of Christ to expect free and full communications of the Holy Spirit. Had Christ not died, the Spirit could in no degree — not even in the smallest —have been sent forth to enlighten, and sanctify, and save; for the justice of God, unpropitiated and unappeased, would have stood immoveably in the way of this. But now Christ having died, and justice being satisfied, and every obstacle on God’s part removed, what hinders that the Spirit be now shed forth through Christ, and that not grudgingly and sparingly, but cheerfully and abundantly?

It is now not merely consistent with the Divine character that the Spirit may be obtained. The glory of the Divine character requires that what Christ died for be accomplished — that what he purchased be bestowed. To imagine that Christ has obtained by his death only a small measure of spiritual influence for the Church, is virtually to detract from the merit and efficacy of his death. To go to God with doubting, confused, straitened desires for the Spirit, is virtually to deny that the Spirit is the purchase of Christ for his Church, and to insinuate that something yet remains to be done to entitle us to receive him, at least so fully as we need.”

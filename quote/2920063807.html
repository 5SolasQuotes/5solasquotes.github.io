<blockquote><p>32. In the next place page 138, he [Brown’s opponent] cites with Bellarmine, Rom. 8:30, and says that [in the verse] either sanctification must be excluded, or ‘justification’ must be taken in its proper sense [as including sanctification]. Answer: (1) There is no necessity for either: for sanctification is comprehended [in the verse] under ‘vocation,’ which is saving and effectual; otherwise the links of this chain could be broken; for a common and ineffectual call is not attended with justification and glorification: and effectual vocation is by infusion of grace, and the Spirit of holiness and a real change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quakerism: the Pathway to Paganism, or a View of the Quakers’ Religion, being an Examination of the Theses &amp; Apology of Robert Barclay, one of their Number</cite>, ... (Edinburgh: Cairns, 1678), ch. 13, Of Justification, pp. 316-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>Thesis XVI. The duration of original sin is its affection by which original sin begins from the first origin of human conception and lasts to the end of his life… For since perfect regeneration is not given in this life, and the baptized sometimes become more wicked than the unbaptized, it is a necessary consequence that original sin is not taken away in this life with respect to its existence, but only with respect to its guilt.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-574bb6ee1e" data-kw="">
<blockquote><p>A disposition to good works is necessary to justification, being the qualification of an active and lively faith… Sincere, uniform and constant [obedience], though imperfect in measure and degree, and this is so necessary that without it there is no salvation to be expected. The Covenant of Grace calls for perfection, accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection was rigidly exacted, no flesh could be saved: if not at all commanded, imperfection should not be sin, nor perfection to be labored after. The faith that is lively to embrace mercy is ever conjoined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, does ever attend that faith whereby we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life, than it does virtually or actually lead us forward in the way to Heaven. For: ‘If we say we have fellowship with God and walk in darkness, we lie and do not the truth: But if we walk in the light, as He is in the light, we have fellowship one with another,’ 1 Jn. 1:6-7. This walking in the light as He is in the light is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins, or actual approbation with God. The truth of which doctrine St. John likewise ratifies in terms equivalent, in the words presently following: ‘and the blood of Christ cleanseth us’ (walking in the light as God is in the light) ‘from all sin.’ [v. 7]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 20-21</span></figcaption>

</figure><figure class="quote" id="q-5b7edb58ff" data-kw="">
<blockquote><p>Assertion 2. The Gospel-love of Christ frees a captive from under the Law as a curser and delivers him over to the Law as to a pedagogue to lead him to Christ, and as to an instructor to rule and lead him when He is come to Christ. Love is the immediate and nearest lord; law the mediate and remote lord. Love bids the man do all for Christ; the law now of itself, because of our sinfulness, is a bitter and sour thing; but now the law is dipped in Christ’s Gospel-love and is sugared and honeyed, and evangelized with free grace and receives a new form from Christ and is become sweeter than the honey and the honeycomb to draw and persuade: and all the law is made a new commandment of love and a Gospel-yoke, sweet and easy; But still the law obliges justified men to obedience, not only for the matter of it, but for the supreme authority of the Lawgiver; now Christ, who came to fulfill, not to dissolve the law, does not remove this authority, but adds a new bond of obligation, from: [1.] the tie of Redemption in Jesus Christ, and we are freed from the curse of the Law. 2. the rigid exaction of obedience, every way perfect. 3. the seeking of life and justification by the law.</p></blockquote>

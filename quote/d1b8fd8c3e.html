<main class="wrap"><figure class="quote" id="q-d1b8fd8c3e" data-kw="">
<blockquote><p>The Son, indeed, is incarnate because He wills voluntarily to be made our sponsor, voluntarily subjecting Himself to the Father not according to nature, but according to the voluntary arrangement (oeconomia) or dispensation: a natural subjection is, surely, distinct from an economic or dispensatory subjection: He is made freely obedient to the Father, not according to the divine nature itself (in se), but according to will: obedience, indeed, is not the natural act of a nature (actus naturalis naturae), but of the will or free accord of the Person of Christ (voluntarius personae Christi).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma VI.xiii (p. 364, col. 2) as quoted in Richard Muller, 3. ‘The Love of the Father for the Son &amp; the Pactum Salutis‘ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725, vol. 4, The Triunity of God 2nd ed. (Baker Books, 2003)</cite>, p. 267</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

d it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-411d5086bd" data-kw="">
<blockquote><p>And as the Author, and fellow-Counsellor, and Framer of the things that are in formation, He begot the Word; and as He bears this Word in Himself, and that, too, as (yet) invisible to the world which is created, He makes Him visible; (and) uttering the voice first, and begetting Him as Light of Light, He set Him forth to the world as its Lord, (and) His own mind; and whereas He was visible formerly to Himself alone, and invisible to the world which is made, He makes Him visible in order that the world might see Him in His manifestation, and be capable of being saved. 11. And thus there appeared another beside Himself. But when I say another, I do not mean that there are two Gods, but that it is only as light of light, or as water from a fountain, or as a ray from the sun. For there is but one power, which is from the All; and the Father is the All, from whom comes this Power, the Word. And this is the mind which came forth into the world, and was manifested as the Son of God. All things, then, are by Him, and He alone is of the Father. Who then adduces a multitude of gods brought in, time after time? For all are shut up, however unwillingly, to admit this fact, that the All runs up into one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus-of-rome.html">Hippolytus of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>c. 235) | Against Noetus</cite></span></figcaption>

"noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9c5edb9e5b" data-kw="">
<blockquote><p>Thesis XIV… For because divine essence is infinite, most simple, and eternal, therefore the three hypostases subsisting in it—although they are truly three in number—because these individual hypostases are distinguished by their own incommunicable properties, they are nevertheless not three gods nor are they said to be three gods in the same way that there are three men… But instead, in the divine this happens by an indescribable communication of the whole essence from eternity, in which no point of beginning, middle, or end can be stated.† † dari, i.e., cannot be stated or supplied because it does not exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beza on the Trinity, 21 Theses’ from Tractationes Theologicae Bezae, Volumen I (Geneva: Jean Crespin, 1570)</cite>, p. 651 tr. David Noe</span></figcaption>

<blockquote><p>Among all the works of God those things rightly hold the first place, which concern the glory of His creation. For neither is it permitted, that we should consider concerning those works which are of the Father toward the Son, of the Son toward the Father, of both toward the Holy Spirit, of the Holy Spirit toward both, which are neither scrutable, nor necessary to be known: but it is abundantly sufficient, if the creature should acknowledge, look up unto and glorify the work of its creator as creator, propagator, conservator, reparator, governor and consummator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

<blockquote><p>Engages narrative theology and post-metaphysical thought of the last 75 years by retrieving the exegetical and metaphysical account of Aquinas.” – Mark Jones Wanless, Brandon L. – Universality &amp; the Divine Essence: St. Thomas Aquinas on the Unity Characteristic of the Trinitarian Persons a Masters thesis (University of St. Thomas, 2015) 92 pp. Introduction: “The greatest of the Scholastic doctors understood himself as a conduit of the wisdom he himself received from earlier doctors of the Church. This medieval method of theology—originating in part with such persons as St. John of Damascus in the East and Peter Lombard in the West—amounted to a synthetic engagement of the patristic theologians with the goal of producing a unified and holistic theological account of the faith… …The disagreement itself regards the proper predication of the relation of the three persons of the Trinity to the divine nature, and whether we can speak of the divine essence as a universal, that is, as a relation of three individuals to a species. In other words, are the trinitarian persons three individuals of the one divine species of divinity? Augustine argues in the negative, whereas [John the] Damascene speaks affirmatively…. After addressing the specifics of the relative positions of Augustine and Damascene, and their treatment by Peter Lombard in his Sentences in the following chapter, I will spend the bulk of this paper examining Aquinas’s theology of the Trinity… he uniquely provides a definitive account of the various concepts needed to thoroughly understand the relation of individuals to a species and its applicability to the Godhead… Aquinas proves on multiple levels that, properly speaking, God cannot be said to be a divine species with three subordinate individuals… I will also show how it is that Aquinas recognizes some similarities (and thus allows for Damascene’s position) between the species/individual relationship and that of the divine essence and persons… What follows in this paper is a relatively unique Thomistic analysis of this question, putting to use his trinitarian and metaphysical principles as a way to understand all the critical implications of a relationship of universality between essence and persons in the Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-levering.html">Matthew Levering</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture &amp; Metaphysics: Aquinas &amp; the Renewal Of Trinitarian Theology (Blackwell, 2004) 266</cite>, pp. ToC</span></figcaption>

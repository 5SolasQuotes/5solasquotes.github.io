<main class="wrap"><figure class="quote" id="q-55ebc556c1" data-kw="">
<blockquote><p>He offers him grace and pardon for all that is past to turn him, yea He counsels him to turn, and entreats him, by his benefits seeks to lead him to repentance (Rom. 2:4), and which is more then all this, He knocks at the door of his heart by his Spirit (Rev. 3:20), and who can say then but that it is true, which is here said, He delights not in his dying?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, ... (London: 1653) | on Ezekiel, ch. 18, v. 23, p. 421</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d18b7522d8" data-kw="">
<blockquote><p>Sixthly, by his not only offering acquaintance with us upon these terms, by his ambassadors, his ministers, but by his coming personally by his Spirit to our several hearts, inviting and soliciting us to this acquaintance. According to that of our Lord Jesus Christ, ‘Behold I stand at the door and knock; if any man hear my voice, and open to Me, I will come in to him, and will sup with him, and he with Me.’ The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Acquaintance &amp; Highest Honor of Christians, or a Discourse of Acquaintance with God</cite>, (London: Parker, 1679), ch. 4, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

thly%2C%20by%20his%20not%20only%20offering%20acquaintance%20with&amp;text=has%20towards%20peace%20and%20renewed%20acquaintance%20with%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d454a43305" data-kw="">
<blockquote><p>Therefore the evangelist John makes this the first work of the Spirit, that it shall convince the world of sin (Jn. 16:8): which is so needful, that without it Christ Jesus can never enter into the heart: for He promises to dwell only with them that are humble in spirit and contrite in heart (Isa. 57:15), through the sight of their iniquities, and of God’s displeasure justly deserved for the same: and calls those alone unto Him that are weary and heavy laden (Mt. 11), groaning and sighing under the burden of their sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seven Godly &amp; Fruitful Sermons</cite>, … (London: Kyngston, 1614), ‘Of extinguishing the graces of the Spirit’, pp. 189-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-4f4d498e05" data-kw="">
<blockquote><p>‘Alas, this business is beyond my strength, I cannot change mine own heart; though there are encouragements and helps, I know not which way to go, nor how to plead them.’ Well, but is the Spirit of God able to quicken thee, and to teach thee, and to enable thee? He stands especially engaged, ’tis his immediate work to prevail upon the heart. Go to the Spirit, and beg of Him, that He would lead thee to the Father, and to Christ, that thou mayst have fellowship with the Father and the Son. ‘Alas, I cannot go unto the Spirit, I have so long resisted Him, so often grieved Him, with what face can I go? I am unworthy of his guidance.’ Well, but Jesus Christ stands engaged; and never speak of merit that day thou speakest of Christ. Go to Christ, and beg that He would send his Spirit into thy heart. Jesus Christ is thy Kinsman, he knows how to pity thee; and the Spirit of Grace is at his dispose. Oh then go to Christ. ‘Alas, I cannot go to Christ, I have no ability to go, nor so much as a will to move towards Him. I cannot go to Christ.’ Well, but the Father is engaged to draw thee, though thou canst not go; a man may be drawn, which has no natural willingness of his own. The Father stands engaged to change the will, and absolute promises are theirs that lay claim to them (provided they do not overthrow their own claim). Go therefore and tell the Father thy case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-annesley.html">Samuel Annesley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion with God, in Two Sermons</cite>, … (London: Tyler, 1655), sermon 2, pp. 41-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-67b703ed0b" data-kw="">
<blockquote><p>Christ makes the feast, Lk. 15:23, and the angels make the music, verse 7. But if men will not receive the tenders of grace, Christ grieves, Mk. 3:5. He is like a judge that passes the sentence with tears in his eyes, Lk. 19:42, ‘And when He came nigh the city, He wept.’ ‘Ah sinners, I come to save you, but you put away salvation from you (Acts 13). I come with healing under my wings, but you bolt out your Physician; I would have you but open your hearts to receive Me, and I will open Heaven to receive you, but you will rather stay with your sins and die, than come to Me and live, Ps. 81:11, ‘Israel would none of me.’ Well sinners, I will weep at your funerals.’ Oh how lovely is Christ in his disposition! He comes with his supplying oil to pour into sinners’ wounds; He would fain break their hearts with his mercies, He labors to overcome their evil with his good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Delight</cite>, (London: T.R., 1657), “Christ’s Loveliness”, pp. 353-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

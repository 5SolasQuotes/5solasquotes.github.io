<main class="wrap"><figure class="quote" id="q-a6e7e6bf5f" data-kw="">
<blockquote><p>the word ‘justify’ has two meanings, the first signifies to absolve anyone from crimes… and to pronounce him just, and is opposed to the word ‘to condemn;’ and this signification is altogether forensic. The other meaning of the word is, that a man is made just from being unjust, as also to be sanctified is, to be made holy from being profane; in which signication the apostle has said, ‘And such were some of you, etc. [1 Cor. 6:11]’, i.e. you have been made, from being unclean, clean, holy from being profane, just from being unjust, by the Holy Ghost, on account of Christ, in whom you believe. To which meaning relates that passage also, which we read in the Revelation, ‘He that is just, let him be justified still more,’ i.e. let him become in truth, from being just, still more just, viz., in the same way as from being unjust, he had been made just. And the Fathers and especially S. Augustine, have interpreted the word in this sense… These are two certain meanings of this word ‘to justify’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, vol. 6, thesis 13, p. 81 [or 84?] in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa0c0168f5" data-kw="">
<blockquote><p>It is asked, moreover, whether or not we seek forgiveness of sins—that is, the first aspect of justification—from God on a daily basis? And if so, how can we say that justification is completed once and for all in this life? I respond that when we pray for the remission of sins, we are not praying for that benefit as if it were not already given to us. Rather, we are praying for the increase of our faith, and for the application of that benefit which is ours through faith and faith’s increase.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-3ce3b4ac53" data-kw="">
<blockquote><p>[On Rom. 5:17, 19] And here some one may enquire what this gift of justice is which flows to us from Christ our head?… Of this gift the apostle thus speaks; ‘For if by the offence of one man, etc.’ by which words St. Paul declares that, through the merit and good work of the second Adam, many receive the gift of justice and life, as through the sin of the first Adam his posterity had contracted hurt and death. But what other thing could this gift have been but the gift of the Holy Ghost, who should bring both justice and life to those who are endowed with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-borrhaus.html">Martin Borrhaus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 Borrhaus (1499–1564) was a professor of philosophy and Old Testament at Basel in the reformed tradition. | On Gen. 15:4, pp. 161-62</span></figcaption>

<blockquote><p>3. To whomsoever the guilt of any particular sin is charged, he has either committed that sin or not committed it.

4. If he has committed it, he can in no other way be truly justified before God than by pleading the satisfaction of Christ, performed for him in general.

5. If he has not committed it, then his own innocence or righteousness may be pleaded for his justification; which is to be justified from his own works, or from a formal and inherent righteousness in himself, insofar as this is concerned.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>What is to be observed in the sayings of the Scriptures wherein justification, salvation and life eternal is ascribed to works? 1. Legal sentences are to be understood of perfect good works, such as none can be found in no creature; But evangelical sentences do always include faith in our works. And we must understand that by faith in the first place, justification is received, and acceptation to life eternal: afterward in the second place and by consequence, works are accepted as the fruits of faith, and life eternal is promised to these for Christ’s sake. 2. In such sayings, there are not brought forth arguments from the cause [as to] why the person is made partaker of eternal life, but it is showed from the effects or the adjuncts what person is partaker of remission of sins and life eternal (so Lk. 7:47). Christ plainly proves in way of resolution by this argument that the woman’s sins were pardoned because she loved much. But two diverse questions are at no hand to be confounded. The one to whom life eternal is given, the other for what cause it is given. To them that do well and meditate in the law of God, is happiness and life eternal promised, but yet it is given freely for Christ’s sake. 3. In this question we must remember to observe a rule of the Rabbins concerning the Holy Scriptures. In every place wherein thou lightest on an objection for an heretics, thou findest a medicine in the side thereof. So the scripture, wheresoever it ascribes eternal life to works as a reward, calls it an inheritance. 4. When as diverse effects do depend alike of one and the self same cause, the consequence from one effect avails to another because of their common dependence, as Lk. 7:47, the consequence from love avails (to prove) the remission of sins: because each of them depends on faith. 5. Where there is a subject there is his propriety, and on the contrary where there is a propriety there is his subject. So where there is faith there be works, and where there be good works there is faith. 6. Seeing good works do spring from faith, whatsoever is attributed to them, must needs be ascribed to the root (i.e. faith, whence they spring).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), ch. 32, ‘Of Good Works’, p. 376-77</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3eddfe8052" data-kw="">
<blockquote><p>XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, trans. AI (1634), p. 9</span></figcaption>

<blockquote><p>The righteousness required by the Moral Law is of two sorts: 1. Habitual [an abiding inward disposition], in the inherent holiness of man’s whole person, when such gracious qualities are fixed and planted in every faculty of soul and body: as do dispose and incline the motions of both only unto that which is conformable to the righteousness of the Law. That such righteousness is required by the Law is a plain case and confessed; That which commands the good or forbids the evil action does command the virtuous and forbid the vicious habit too. He that looks for purity in the stream cannot but dislike poison in the fountain: and God that commands us to do good, bids us also to be holy; nor can we do the one, unless we do the other. And therefore the apostle joins both together. The end of the commandment is love, (but where?) out of a pure heart, 1 Tim. 1:5. 2. Actual, in the exercise of all good works enjoined by the Law, and forbearing the contrary evil works. Whether these good or evil works be inward in that spiritual obedience which the Law required; (viz.) in the right ordering of all the motions of our souls, that every one of our thoughts, imaginations, purposes of our mind, and all the secret workings and stirrings of our affections, be altogether employed upon piety and charity, not so much as touching upon any thing that is contrary to the love of God or our neighbor. Or, whether these good and evil works be outward in the bodily obedience unto the Law, in doing all and every external duty of religion towards God: of justice and mercy towards man; and in leaving undone the contrary. Further this actual righteousnesse of the Law is to be considered two ways: 1. As it respects all the commandments, and so that righteousness is only perfect, which fulfils all and every particular precept of the Law. 2. As it respects any one commandment, or any one duty therein contained. And so we may call that righteousness perfect, which exactly performs any one point of the Law, though it fail in others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith</cite>, … 1st ed. (Oxford, 1625), section 3, ch. 1, pp. 66-67</span></figcaption>

<main class="wrap"><figure class="quote" id="q-16497d3565" data-kw="">
<blockquote><p>Let none of us be like the proud and hypocritical Pharisees, who thought to cloke their real impieties in neglecting works of mercy and peace by a pretence of zeal for the minute circumstances of external worship and discipline; but let us offer to God the sacrifices of a humble and contrite heart, and ‘not forget to do good and communicate, for with such sacrifices God is well pleased,’ (Heb. 13:16) and then He will accept our praises, and answer our prayers with a Misericordiam volo: ‘I will have mercy upon you, and heal your land.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Misericordiam Volo: or the Pharisees’ Lesson, showing the Impiety &amp; Unreasonableness of contending for Outward Forms &amp; Ceremonies to the Violation of Obedience, Charity &amp; the Public Peace 52 pp. in The Character of a Separatist, or Sensuality the Ground of Separation... (London: Kettilby, 1677)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

<blockquote><p>Note in relation to non-conformity: as the power of eliciting religious acts extends further than the power of publicly commanding religious acts with due authority, so in resistance to public authorities, one might elicit such acts (and that with others consenting of their own will) where one might not publicly command and enforce such acts over others.</p></blockquote>

</figure><figure class="quote" id="q-39efa5d0a2" data-kw="">
<blockquote><p>21… But the most of our acquaintance [being parish ministers in England in the 1650’s, under Cromwell] were peaceable, moderate men that thought several parties [of various views of Church government] had somewhat of the right, and that the points of difference were so few and small that they might well live in peace and love, and that none of the parties was so right as that in all things they should be followed, and others trod down to set them up: And many of these were young men that, being at the schools, had not been engaged in the first quarrels [in the 1640’s and before], and desired not to side with any dividing parties, and modestly professed that they had not maturity enough to study themselves to any great confidence in the controversies [about Church government]. 22. This last sort of men beginning in Worcestshire set on foot a work of reconciling [an] Association, in which the Episcopal, Presbyterians and Independants agreed to practise so much of Church government and ministration as they were all agreed in, with mutual love and assisting concord, and to forbear one another in the rest, till God should bring us nearer (and after[wards] they added another agreement, to catechize every person in their parishes old and young that would come to them, or receive them thereto, and personally to instruct and exhort them about the practicals of religion, and preparation for death and the life to come). This example was presently followed by the ministers in Cumberland and Westmorland, Wiltshire, Dorsetshire, Essex, and going on in other counties, till the confusions [of] 1659 interrupted it [when Cromwell died], and the return of the prelacy [in 1662] ended it and many such endeavors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), section 7</cite>, pp. 130-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><figure class="quote" id="q-74466895c6" data-kw="">
<blockquote><p>For says he [Edward Stillingfleet]: ‘…if Presbytery had been settled upon the King’s Restoration [1660], would they [Independent churches] not have continued in their Separation?… 4. Had the Presbyterian government been settled at the King’s Restoration, by the encouragement and protection of the practise of it, without a rigorous imposition of every thing supposed by any to belong thereunto, or a mixture of human constitutions, if there had any appearance of a schism or separation continued between the parties, I do judge they would have been both to blame. For as it cannot be expected that all churches and all persons in them should agree in all principles and practises belonging unto Church order, nor was it so in the days of the apostles, nor ever since among any true Churches of Christ, so all the fundamental principles of Church communion would have been so fixed and agreed upon between them, and all offences in worship so removed, as that it would have been a matter of no great art absolutely to unite them, or to maintain a firm communion among them, no more than in the days of the apostles, and the primitive times, in reference to the differences that were among Churches in those days. For they allowed distinct communion upon distinct apprehensions of things belonging unto Church order or worship, all keeping the unity of the Spirit in the bond of peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into the Original, Nature, Institution, Power, Order and Communion of Evangelical Churches... (1681)</cite>, pp. 346-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

<main class="wrap"><figure class="quote" id="q-8a2e2095a8" data-kw="">
<blockquote><p>The covenant of God in general is a promise of grace under some settled condition. The legal covenant is the promise of eternal life under the condition of our own lawful works. The gratuitous covenant is the promise of both justice, which was lost through the Fall, and eternal life, under the condition of satisfaction for an offence committed, not a satisfaction of our own, but that rendered by Christ the mediator, which must nevertheless be apprehended by our faith. Each covenant with man is in fact of grace, even of pure grace. It is of grace that God promises eternal life in the legal covenant; so too it is of grace that he promises life in the Evangelical covenant.

Nevertheless, in each covenant, the promise springs from grace in such a way that grace and mercy do not annul God’s justice. Thus a condition has been added to the promise in each covenant, and this for the sake of divine justice, which requires the same of necessity. So, for instance, in the legal covenant, God’s justice requires our works, and those most perfect. In the evangelical covenant, God’s justice requires satisfaction for the violation of that first covenant — not indeed a satisfaction of our own, but that rendered by Christ, which must nevertheless be apprehended by our faith. From these considerations it follows that the peculiar condition of the new covenant is Christ’s satisfaction, not considered simpliciter, but rather as it must be apprehended by our faith, which is indeed a kind of secondary and subservient condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De foedere Dei</cite>, (1593), trans. Aaron C. Denlinger, ‘Robert Rollock on Covenant and Sacrament’, Reformation &amp; Renaissance Review, 15.2 (2013), p. 202.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

<blockquote><p>Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11), angels, by reason of the quickness and strength of their understanding, apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London, 1654), ch. 1, Of the Divine Essence, pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

<blockquote><p>At a public meeting held at Edinburgh in February 1840 on the church’s spiritual independence, Dr Thomas Chalmers spoke on the influence of Moderatism in the Church of Scotland and the influence of evangelical dissenters outside of its pale:

It is to the experience of our fathers in the last century—that dreary period, at the commencement of which Scotland was a well-watered garden, and at the consummation of which it became, in comparison, a mural and spiritual wilderness. It began about a hundred years ago, and was perpetuated through a series of till the best of our people were driven from the tabernacles they loved, and the voice of the gospel was extinguished in more than half the pulpits of Scotland. Then it was, that by the aid of an obsequious clergy in our Courts, lacked in their tyrannical decisions by an armed soldiery in the parishes, obnoxious ministers were forced at the point of the bayonet on reclaiming congregations.

The cold, and jejune, and lifeless ministrations which followed on the establishment of this system, fell like a withering mildew on the hearts of our people—(Cheers)—who heard, but heard not gladly; and, deserting in thousands the Church of their fathers, went off in hundreds to the evangelical meeting-houses which were raised without its pale. It was well that the lessons of a pure gospel were given there. This alleviates, but it never can repair, the degeneracy which takes place in the clergy of an Establishment; and thus it is that every decline of Christianity in the great national institute is sure to be followed up by a declension in the religion of families. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 26 February 1840.</span></figcaption>

</figure><figure class="quote" id="q-1035334f61" data-kw="">
<blockquote><p>That this righteousness of ours, that is, whereby we are righteous, or made righteous before God; is not Legal, but Evangelical. Man’s first righteousness was Legal, but that is a Non-ens now; there is no such thing in being now betwixt God and us, as Legal Righteousness: once it was, but now ’tis cast out, in the Bond-woman and her Son, Gal. 4.

The Law is not able to justify a sinner; therefore the Apostle saith, If there had been a Law which could have given life, i.e. Justification unto life (as Rom. 5.18.) verily righteousness should have been by Law: but the Scripture, i.e. the Law hath concluded all under sin, that the promise by faith of Jesus Christ might be given to them that believe.

‘Tis true, Christ’s Righteousness, as in himself was legal, being the satisfaction of the Law, and Justice of God in our behalf. But as this Righteousness is imputed to us, so it is Evangelical Righteousness; because it is not Righteousness in us, but Righteousness accounted to us: Abraham believed, and it was accounted to him for righteousness. So that there is now another way to Justification, and so to life and glory, than once there was, which the Epistle to the Hebrews calls a New way; and this is the Righteousness of Christ made ours, or Christ, the Lord our Righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord Jesus Christ, the Lord our Righteousness, or, Christ the Righteousness of a Sinner before God delivered in Several Sermons</cite>, (London; John Brooke, 1669), pp 18-19.</span></figcaption>

<blockquote><p>Evangelical,” on the other hand, although it is a fine term, does not quite seem to designate clearly enough the position of those who hold specifically to the system of doctrine taught in the Westminster Confession of Faith, as distinguished from other systems which are near enough to the truth in order that they may be called “evangelical” but which yet fall short of being the system that is contained in God’s Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“What Is Orthodoxy?”</cite></span></figcaption>

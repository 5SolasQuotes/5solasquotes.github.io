<blockquote><p>(5) Beware of having the persons of men in admiration, either for gifts or grace, or because of advantage, Judg. 5:16. This was it which occasioned the schisms in the Church of Corinth, admiring their teachers, they were puffed up for one against another, and one said, ‘I am of Paul, another, I of Apollo, others, I of Cephas, etc.’ even according as their humor and liking led them? take heed of being taken in the same snare. All flesh is grass, none infallible, and therefore none to be doted upon. Ne judicemus ex personis fidem, sed ex fide personas, said Tertullian. Let not your eyes be so dazzled with whatever eminency of parts or graces ye apprehend to be in any, as to set up their bare word for your oracle, or their example for your rule. This was it which drew many of the Jews (and Barnabas among the rest) into a sinful separation (Gal. 2:12-13) because they saw Peter a leading man, a prime and eminent apostle, going that way before them. And yet that pillar of the Church did therein halt, and walked not with a straight foot, and was to be blamed; and consequently to be not imitated, but shunned. It is dangerous to shape our course by another’s compass; as many a ship has been lost and run on banks by following their admiral’s lanthorn. Give eminent and godly men their due respect, but put them not in God’s room. It is divine rule, not human example we are to walk by. Follow no man further than he follows Christ, 1 Cor. 11:1… … (8) Enslave not yourselves to any person or party, so as to be over-desirous to please them or over-fearful of their censures. Is it not servile man-pleasing and cowardice to do so? and leads many to sinful compliance with dividing courses? When therefore any fervent self-conceited person or people would carry all down by their censoriousness and passions, it is high time for pastors and the aged, graver and maturer sort of Christians openly to rebuke them, to appear against them and stand their ground (as Paul did, Gal. 2:11) and not to comply with the misguided sort (though well-meaning) and their preposterous zeal, that by connivance or compliance ye may escape their censures and reproaches. He that thus saves his name, shall lose it, and perhaps on a worse account. Be not therefore cowed to silence or amen to their way, for fear of the scourge of tongues. Be valiant for the truth and against such ills, else fainting will feed their humor and invite them to be more insolent. Put on authority and Gospel-austerity to check their petulancy and untowardliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681)</cite>, pp. 180-82</span></figcaption>

<blockquote><p>22. The heretic is not to be confused with the schismatic: nor is every schismatic to be counted among the number of heretics. For although heretics often become schismatics, and conversely schismatics often become heretics, nevertheless the heretic and the schismatic differ. For first, heretics, corrupting the sincerity of faith with false doctrines, do not always separate themselves from the Church: but schismatics, sometimes even retaining the purity of faith without the stain of heresy, break the bond of brotherly society out of ambition for honor or some function in which they do not want another to be preferred over them, or out of hatred and impatience of divine order and ecclesiastical discipline, or under the pretext of scandals which are committed everywhere. 23. Heretics properly strike against the truth of the doctrines of faith, as heretics: but schismatics against charity, as schismatics: 24. Those who at the same time stumble in the truth of faith and charity, and obstinately defending the error of faith separate themselves from the Church of God, they are at the same time heretics and schismatics. 25. Very often it happens in practice that some orthodox individuals think differently from others, without strife or schism: as Jerome and Augustine. 26. Schismatics either separate themselves entirely from the Church, or in part also from this or that Church in the name of particular offenses.</p></blockquote>

<blockquote><p>5. Remember, that you have all but one end and one aim, that is, you are all of you elected and called to this assembly for the glory of your God, the honor of your king, the welfare of his people, the peace and purity of the Church, the punishing of offenders, the reforming of abuses and the taking away of all polluted and pernicious doctrines and practices from amongst us. And then the remembrance hereof will be a means to make you one.</p></blockquote>

<blockquote><p>…this accommodation is not impossible: if indeed it were, God does not bind us to the seeking after it… If we look upon the nature of the things wherein they differ, they are not of such moment as to divide between brethren; their differences are not about fundamentals, but superstructures: there is no opinion expressly maintained by either side which is directly contrary to the substance of faith, or destructive to salvation; nay, whatever are such, they are condemned by both. Nor [is] the difference in those matters wherein they differ so wide but they may be composed and brought together, if men will act humility and self-denial. It was said of the differences between Luther and the [reformed] Helvetians, that there was not any impossibility in respect of the things themselves; if their spirits could be reconciled, their causes might easily be reconciled… where the difference is substantial, I do not see but if humility and self-denial might take place, if interests might be waved, if pre-engagements might be slighted, even in those things there might be an agreement; certainly, God does not make the difference so great as we ourselves do make it… It was the speech of one concerning the reconciliation of the German Churches: It is possible for the most hot and rigorous spirits to be reconciled, but it is easy for peaceable and moderate men to be agreed. The differences are not between enemies, but between brethren, and neither of them proud, imperious and contentious, but both of them humble, holy and peaceable…</p></blockquote>

<blockquote><p>There is a twofold Word, or rather a double declaration of the same Word: 1. There is God’s external or outward Word, containing letters and syllables, and this is his external voice. 2. There is God’s internal Word and voice, which secretly speaks to the heart, even by the external Word, when that only speaks to the ear. … 2. This inward Word is double: 1. ineffectual (though inward); 2. effectual. 1. Ineffectual, is that which has some inward operation upon the heart, but it attains not God’s end to bring a man into a state of life; and thus, Heb. 6:2, 5. Many tasted of the good Word of God, yet fell away. And such a heart is compared to a field which a man plows and sows, and rain falls on it, and yet the end is not attained: it brings forth thistles; and this many Jews did hear, and hence had some kind of faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subjection to Christ in all his Ordinances &amp; Appointments the best means to preserve our Liberty: together with a Treatise of Ineffectual Hearing the Word... (d. 1649; London: S.G., 1657), ‘Of Ineffectual Hearing’</cite>, pp. 89-90</span></figcaption>

<blockquote><p>360. XII. The last now to be named is the antecedent and consequent will. This also is handled by many Schoolmen and much used by the Jesuits and Arminians. To pass by others, Pennottus handles it Propugn. bk. 4, ch. 21, having first showed, ch. 20, p. 225 that Chrysostom and Damascene first used it. His explicatory propositions are: 1. Voluntas antecedens et consequens non est in Deo respectu omnium volitorum, sed solum respectu eorum quae aliquo modo pendent ex lib. arbtrio creaturae. [The antecedent and consequent will do not exist in God with respect to all things willed, but only with respect to those things which in some manner depend upon the free will of the creature.] 2. Voluntas antecedens est illa qua Deus vult hominis salutem quantum in ipso est, et qua illum ad salutem ordinat, et media ad salutem necessaria praeparat, quibus nisi per ipsum hominem steterit, salutem assequatur. [The antecedent will is that by which God wills the salvation of man, insofar as it lies in Him, and by which He ordains him to salvation and prepares the means necessary for salvation, so that, unless the hindrance to salvation should arise from the man himself, he may attain salvation.] 3. Non semper voluntas antecedens et consequens circa objecta contraria versantur, sed potest idem objectum esse volitum à Deo voluntate tum antecedente tum consequente. [The antecedent and consequent will do not always concern contrary objects; rather, the same object may be willed by God both by the antecedent will and by the consequent will.] 4. Voluntas antecedens in Deo est voluntas beneplaciti, et non solum voluntas signi. [The antecedent will in God is the will of good pleasure, and not merely the will of sign.] 5. Voluntas antecedens est formaliter et proprie in Deo existens, et non solum per metaphoram ad eum modum, quo voluntas signi. [The antecedent will exists formally and properly in God, and not merely metaphorically, in the manner in which the will of sign does.] 361. I tell you their sense that I may the better open the plain truth to you, which is as follows: 1. This distinction of voluntas antecedens et consequens is not applied to God as He is our Creator, or end, nor as He is mere Proprietor or Benefactor, but only as He is Rector or [the] Moral Ruler of man. 2. As government has an antecedent and consequent part, viz. legislation and judgement (with execution), so God’s antecedent will is nothing but his legal will, or his will as Rector signified by his laws; and his consequent will is his judicial will, or expressed in judgment: one antecedent to man’s part (obedience or disobedience) and the other consequent to it. 3. It is most certain that God wills antecedently all that is in his Law, that is, that all that believe and repent shall be saved: and that He wills consequently that Judas e.g., and every finally impenitent unbeliever, shall be damned. For what God does, that He wills to do: But God does Himself make such a Law and pass such a judgement: Therefore He is willing of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology... (London: White, 1675) | pt. 1, sect. 14, Of Several Distinctions of God’s Will</cite>, pp. 56-57</span></figcaption>

<blockquote><p>102. The distinction of God’s antecedent and consequent will, used by Damascene, is by many applied to this controversy, but by none that I have read sufficiently explained, which is the cause that so many good men reject it, because they misunderstand it. It’s truly said that by his antecedent will, God would have all men to believe, repent and be saved, but by his consequent will He will have all condemned whom He does condemn. But then it must be understood that this distinction is not applied to the will of God as He is merely an Absolute Proprietary or Benefactor, but as He is the King or Rector of the world; and so his legislation is his antecedent will, and his judgment is his consequent will. And no man of religion can deny either that God’s Law is the signification of his will, or his will signified, or that his judgment and execution is his will declared; or that God’s Law of Grace does conditionally give pardon and salvation to all antecedently to man’s performance or rejection of the condition, or that God condemns infidels consequently to their infidelity. The Law antecedently to man’s part acted says, ‘He that believes shall be saved;’ and the sentence consequently to his fact says, ‘Judas, an unbeliever or impenitent, shall perish.’ And thus the distinction has no doubt or difficulty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology... (London: White, 1675) | pt. 2, sect. 7, ‘The Antecedent &amp; Consequent Will of God, etc.’</cite>, p. 54</span></figcaption>

<div class="actions"><button class="copy" data-copy="“102. The distinction of God’s antecedent and consequent will, used by Damascene, is by many applied to this controversy, but by none that I have read sufficiently explained, which is the cause that so many good men reject it, because they misunderstand it. It’s truly said that by his antecedent will, God would have all men to believe, repent and be saved, but by his consequent will He will have all condemned whom He does condemn. But then it must be understood that this distinction is not applied to the will of God as He is merely an Absolute Proprietary or Benefactor, but as He is the King or Rector of the world; and so his legislation is his antecedent will, and his judgment is his consequent will. And no man of religion can deny either that God’s Law is the signification of his will, or his will signified, or that his judgment and execution is his will declared; or that God’s Law of Grace does conditionally give pardon and salvation to all antecedently to man’s performance or rejection of the condition, or that God condemns infidels consequently to their infidelity. The Law antecedently to man’s part acted says, ‘He that believes shall be saved;’ and the sentence consequently to his fact says, ‘Judas, an unbeliever or impenitent, shall perish.’ And thus the distinction has no doubt or difficulty.”

— Richard Baxter, Richard Baxter’s Catholic Theology... (London: White, 1675) | pt. 2, sect. 7, ‘The Antecedent &amp; Consequent Will of God, etc.’, p. 54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C102.+The+distinction+of+God%E2%80%99s+antecedent+and+consequent+will%2C+used+by+Damascene%2C+is+by+many+applied+to+this+controversy%2C+but+by+none+that+I+have+read+sufficiently+explained%2C+which+is+the+cause+that+so+many+good+men+reject+it%2C+because+they+misunderstand+it.+It%E2%80%99s+truly+said+that+by+his+antecedent+will%2C+God+would+have+all+men+to+believe%2C+repent+and+be+saved%2C+but+by+his+consequent+will+He+will+have+all+condemned+whom+He+does+condemn.+But+then+it+must+be+understood+that+this+distinction+is+not+applied+to+the+will+of+God+as+He+is+merely+an+Absolute+Proprietary+or+Benefactor%2C+but+as+He+is+the+King+or+Rector+of+the+world%3B+and+so+his+legislation+is+his+antecedent+will%2C+and+his+judgment+is+his+consequent+will.+And+no+man+of+religion+can+deny+either+that+God%E2%80%99s+Law+is+the+signification+of+his+will%2C+or+his+will+signified%2C+or+that+his+judgment+and+execution+is+his+will+declared%3B+or+that+God%E2%80%99s+Law+of+Grace+does+conditionally+give+pardon+and+salvation+to+all+antecedently+to+man%E2%80%99s+performance+or+rejection+of+the+condition%2C+or+that+God+condemns+infidels+consequently+to+their+infidelity.+The+Law+antecedently+to+man%E2%80%99s+part+acted+says%2C+%E2%80%98He+that+believes+shall+be+saved%3B%E2%80%99+and+the+sentence+consequently+to+his+fact+says%2C+%E2%80%98Judas%2C+an+unbeliever+or+impenitent%2C+shall+perish.%E2%80%99+And+thus+the+distinction+has+no+doubt+or+difficulty.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Catholic+Theology...+%28London%3A+White%2C+1675%29+%7C+pt.+2%2C+sect.+7%2C+%E2%80%98The+Antecedent+%26+Consequent+Will+of+God%2C+etc.%E2%80%99%2C+p.+54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F456787a1bb.html&amp;via=5Solas" target="_blank" rel=" <blockquote><p>God’s call sometimes is ineffectual, and sometimes effectual. So the same apostle plainly declares in 1 Thess. 2:13: “For this cause also thank we God, which effectually works also in you that believe.” Observe that it is the work of God’s Spirit in the heart, superadded to the Word of the Gospel, as spoken by men, that makes any call effectual. Without this inward work, God may call, and the soul will never answer… It is this effectual work of God’s Spirit, in regenerating the soul by infusing of habits of grace, which distinguishes an internal effectual call of God form a mere external and ineffectual one… The text makes sure that it might be known whether or not God has so called you by His Word, as that also He has worked in you by His Spirit; whether God has illuminated your understanding, and inclined your will, so that you have complied with God’s will, and have answered His call. Whether, when God drew you, you ran after Him (Cant. 1:4); whether, when God entreated and persuaded you to be reconciled to Him you consented (2 Cor. 5:20); whether, when He wooed you, He also won you; whether, when He invited you to the wedding supper of His Son, you made no excuse or delay, but accepted, and welcomed the offer of the Gospel with faith and love (Luke 14:18). All which if you did do, it arose from the power of an inward call, being superadded to the outward call of the Word…</p></blockquote>

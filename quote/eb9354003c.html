<blockquote><p>Chrysostom shows that it was the manner of the heathen Grecians to come to prayer covered thus, and Beza alleges Plutarch speaking of the Romans, that they worshipped their gods being covered and bowing their heads. Wherefore it was necessary for the apostle to admonish them hereof, there being some doubtless, who notwithstanding the order before settled at Corinth, did cleave to this their superstitious manner still… Here is no ground then for being bareheaded in the congregation, as some imagine, nor yet for the preachers being bareheaded, but that he may wear a little cap to defend him from the cold, as Calvin allows, or a hat, where the order of the Church is such in token of authority, as Beza contends, and is the manner of the French Church, because howsoever it was then, now it is a sign of authority amongst men to be covered, and of subjection to be uncovered. The only thing to be gathered hence is that all should be held with such reverence of the public place, as that they should do nothing unseemly there, of what sex or condition soever they be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon All the Epistles of the Apostle Saint Paul</cite>, ... (London, 1631), on 1 Cor. 11 Mayer (1583–1664) was an English clergyman, who, it appears, conformed at 1662. | Question 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b55a47f3a4" data-kw="">
<blockquote><p>Of the Church of the New Testament, it was prophesied that God would give them one way, as well as one heart, Jer. 32:39, that there shall not only be one Lord, but his Name one, Zech. 14:9. We are exhorted to walk by the same rule, so far as we have attained, that is, to study uniformity, not diversity in those things which are agreed upon to be good and right, Phil. 3:16. Does not the apostle plainly intimate and commend a uniformity in the worship of God, 1 Cor. 14:27… verse 33, for God is not the author of confusion, but of peace, as in all the Churches of the saints, verse 40, ‘Let all things be done decently and in order.’ He limits the prophets to that same number, of two or three, even as he limits those that had the gift of tongues, verse 29. And was it not a great uniformity that he would have every man who prayed or prophesied, to have his head uncovered, and every woman covered, 1 Cor. 11? Does not the same apostle, besides the doctrine of faith and practical duties of a Christian life, deliver several canons to be observed in the ordination and admission of elders and deacons, concerning widows, concerning accusations, admonitions, censures and other things belonging to Church policy, as appears especially from the epistles to Timothy and Titus?… In the ancient Church, although there was not an uniformity in all particulars among all the churches, for instance in the point of fasting: some fasting on the Sabbath, some not, some taking the Lord’s Supper fasting, some after meals, which differences in fasting, gave occasion to the old rule: dissonantia jejunii non dissolvit consonantiam fidei [The dissonance of fasting does not dissolve the concord of the faith]. Although likewise, there was a great difference between the custom of one church and another in the time and manner of celebrating the Lords Supper and in other particulars, as Augustine, Socrates and the author of the Tripartite History record unto us. Yet the Centuries and other ecclesiastical historians show us in every century, a great uniformity in those ancient times, even in very many things belonging to Church government and form of worship.</p></blockquote>

</figure><figure class="quote" id="q-f25aa18f93" data-kw="">
<blockquote><p>But beware that you take not decent or comely ceremonies for essential parts of worship. The apostle urging women in the Church of Corinth to be covered, 1 Cor. 11:6, that which they might think was too much preciseness in him (for we may be apt to suppose he discontented them that did otherwise) was decent in his eyes, and commanded to be done; but not making it a point of worship, nor pressing it upon them as part of God’s service, declares that ceremonies may be used in, but ought ever to be differenced from the worship performed. In brief, whatever Ceremony of what nature or kind soever that is enjoined, that is not contrary to the Word of God, and by the officers of the Church thought comely to be used, as tending to make that worship then used to be the more reverenced and esteemed by the performers, is not to be opposed. This age discovers, what a disrespect, contempt, undervaluinig thoughts most men have (even good men in a great measure) of the house of God, table of God, service of God and servants of God, since decent and comely ceremonies were banished from the Church of God: and where such ceremonies are enjoined, and thou separatest, thou art guilty of renting the seamless coat, there being no cause for making that separation justifiable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-annand.html">William Annand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fides Catholica, or, The Doctrine of the Catholic Church in Eighteen Grand Ordinances</cite>, … (London, 1661), ch. 1, question 6, p. 82 Annand (1633–1689) was born and educated in Scotland (University of Aberdeen, 1649) and took another degree at Oxford in 1655. He was ordained by an Irish bishop and wrote the following as an Anglican minister against the English puritans upon the restoration of King Charles II. He then served as a Scottish minister from 1663-1689.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>‘with her head uncovered’. It may seem strange from whom the Corinthian women should take up this custom, since the Jewish women were not allowed to go into the streets, or into any open and public place, unveiled (Maimonides, Hilch. Ishot, ch. 24, sect. 12). It was a Jewish law, that they should go out nowhere bare-headed (Babylonian Talmud, Cethubot, fol. 72. 1): yea, it was reckoned scandalous and ignominious to do so. Hence it is said, שגלוי הראש גנאי להם, “that uncovering of the head is a reproach” to the daughters of Israel (Rabbi Solomon Jarchi on Numb. 5:19)… So that there it should seem that these Corinthians followed the examples of the heathens: but then, though it might be the custom of some nations for women to go abroad bare headed; yet at their solemnities, where and when they were admitted, for they were not everywhere and always, they used to attend with their heads veiled and covered (Alex., ab Alex. Genial. Dier., bk. 4, ch. 17)… ‘for that is even all one as if she were shaven’; to be without a veil, or some sort of covering on her head, according to the custom of the country, is the same thing as if her head was shaved;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11</cite>, v. 5</span></figcaption>

<blockquote><p>This thesis argues that in 1 Corinthians 11:2-16 Paul asserts most centrally that women should wear head coverings while praying and prophesying in the Corinthian Christian assembly. I examine the honor and shame value system of the Greco-Roman world, both generally and in specific reference to head adornment, since head coverings and hairstyles were connected to honor and status. Then I look at Paul’s treatment of honor and shame throughout 1 Corinthians, which denounces the worldly value system of status seeking in favor of the value system of the cross. Paul’s stance leads him to subject cultural norms to gospel values…</p></blockquote>

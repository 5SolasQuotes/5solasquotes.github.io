<main class="wrap"><figure class="quote" id="q-801ac81cd6" data-kw="">
<blockquote><p>Fourth [Obj.] Again, some may object against charity to such or such particular persons, that they are not obliged to give ’em [charity], for though they are [in] need yet they ben’t in extremity. ‘Tis true, they meet with difficulty, but yet not so but that they can live, though they suffer some hardships.

Ans. It don’t answer [the] rules of Christian charity only to relieve those that are in extremity, as might be abundantly shown. But I shall at this time mention but two things as an evidence of it.

1. We are commanded to love and treat one another as brethren; 1 Peter 3:8, “have compassion one of another, love as brethren, be pitiful.” Now is it a brotherly part for brethren to refuse to help one another, and to do anything for each other’s comfort and for the relief of each other’s difficulties, only when they are in extremity? Does it not become brothers and sisters to have a more friendly disposition one towards another than this comes to, and to be ready to be compassionate to one another under difficulties, though they ben’t extreme?

The rule of the gospel is that when we see our brother under any difficulty or burden we should be ready to bear the burden with him; Galatians 6:2, “Bear ye one another’s burdens, and so fulfil the law of Christ.” So we are commanded, “by love” to “serve one another” (Galatians 5:13).

The Christian spirit will make us apt to sympathize with our neighbour when we see him under any difficulty; Romans 12:15, “Rejoice with them that do rejoice, and weep with them that weep.” When our neighbour is under difficulty, he is afflicted; and we ought to have such a spirit of love to him that we should be afflicted with him in his affliction. And if we ought to be afflicted, then it will follow that we ought to be ready to relieve, because if we are afflicted with him, we relieve ourselves in relieving him; his relief is so far our relief as his affliction is our affliction. Christianity teaches [us] to be afflicted in our neighbour’s affliction; and nature teaches us to relieve ourselves when afflicted.

We should behave ourselves one towards another as brethren that are fellow-travellers, for we are pilgrims and strangers here on earth, and are on a journey. Now, if brethren are on a journey together, if one meets with difficulty in the way, does it not become the rest to help him not only in the extremity of broken bones or the like? If the provision for the journey falls short, it becomes his fellow-travellers to afford him supply out of their stores, and not to be over nice, and exact, and fearful, lest they should give him too much; for ’tis but provision for a journey, and it makes no odds when they get to their journey’s end.

2. That we should only relieve our neighbour when in extremity is not agreeable to that rule of loving our neighbour as ourselves. Though that rule don’t imply that we should love our neighbour to the same degree as we love ourselves, yet it implies that our love towards our neighbour should work in the same manner and express itself in the ways as our love to ourselves. We are very sensible of our own difficulties; we should also be ready to be sensible of their difficulties. We, from our love to ourselves, when we are under difficulties and suffer hardships, are apt to be concerned for our relief, to seek relief, and lay ourselves out for it. And, as we would love our neighbour {as ourselves}, we ought in like manner to be concerned when our neighbour is under difficulty and seek their relief.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-89f7088cea" data-kw="">
<blockquote><p>Next to fidelity towards God, study to adorn your cause with loyalty to your king, in the Lord, Rom. 13:1, 5; Prov. 24:21; 1 Pet. 2:13. ‘Give unto God the things which are God’s, and unto Ceasar the things which are Cesar’s,” that hereby ye may stop the mouths of them that falsely speak evil of the presbyterian interest and party as inimical to king’s crowns, 1 Pet. 2:15. Did he not in the Usurper’s [Cromwell’s] time find you the most faithful party to him of any? And albeit ye be but ill requat, yet discourage not to follow your duty for the Lord’s sake. We are apt to believe, if any other party in the nation had been so crushed and harassed by his power as ye, none would have born it better. Let him still find that no discouragement will fret or tempt you from your duty and that for conscience-sake, without by-ends; yea, bear due allegiance to him so far as may stand with your allegiance to the King of kings and Lord of lords. And who knows what a conviction this may produce in end? 1 Sam. 24:17-18, testifying to him and all men your cause is of God, which leads you to be so conscientious toward man; and that you are the only fast and faithful friends to authority, who will cleave to it in a stormy day out of the fear of God when all its self-seeking friends will desert it when their interest parts with it; and that it is not humor, but conscience which keeps you off from complying with his will in the matters of your God wherein ye differ from him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London: Cockerill, 1681), pp. 171-72</span></figcaption>

<blockquote><p>Yea, Dr. Ursinus, in his Judicium de Disciplina Ecclesiastica et Excommunicatione, exhibited to the Prince Elector Palatine Frederick III (who had required him to give his judgment concerning Erastus’ theses), does once and again observe, that all the reformed churches and divines, as well as those that did not practice excommunication as those who did practice it, agree, notwithstanding, in this principle, that excommunication ought to be in the church; which is a mighty advantage against Erastianism.</p></blockquote>

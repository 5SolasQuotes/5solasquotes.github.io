<main class="wrap"><figure class="quote" id="q-4815dfbf9b" data-kw="">
<blockquote><p>The group collected brain scans from a woman for 30 consecutive days during a natural menstrual cycle, finding fluctuations in the volume of her hippocampus that correlated with changes in progesterone… We then collected scans while she was on the birth control pill and saw no volume differences across the 30 days we scanned her. That suggests that the pill’s control of her hormone levels was quashing the natural fluctuations of the brain…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zara-abrams.html">Zara Abrams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How birth control pills affect the brain: Research on cognition, stress responses, and health impacts helps women make informed reproductive health decisions’ in Monitor on Psychology</cite>, vol. 56, no. 3 (Apr/May 2025), p. 50 ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“The group collected brain scans from a woman for 30 consecutive days during a natural menstrual cycle, finding fluctuations in the volume of her hippocampus that correlated with changes in progesterone… We then collected scans while she was on the birth control pill and saw no volume differences across the 30 days we scanned her. That suggests that the pill’s control of her hormone levels was quashing the natural fluctuations of the brain…”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-906be42022" data-kw="">
<blockquote><p>In order of final causality God wills, first the soul, secondly the body for the sake of the soul. But in the order of material causality He wills first the body, as being the material cause to be perfected by the soul, and the soul is created only when the embryo is sufficiently disposed to receive the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (St. Louis: Herder, 1950) Garrigou-Lagrange was a Romanist, Neo-Thomist theologian., ch. 32, Introduction, p. 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-f96e682650" data-kw="">
<blockquote><p>Difficult are the questions, at what time the fetus is animated, and what is the proximate and internal principle of the formation of the fetus, which have their use in the explication of certain passages of scripture, for example Eccl. 11, Ps. 139, and in the disputations on the person of Christ, and in certain cases about abortion and homicide pertaining to the sixth commandment of the Decalogue. Thomas Feyens inquired into the animation of the fetus in a special treatise, where you will find the varying opinions and authors indicated. He himself, however, diverges from the common and received opinion of the physicians (whom hitherto the fathers, scholastics, and our philosophers and theologians have followed). They also treat of this matter: Sennert and his antagonist Gallego de la Serna, and Freitag. But on this question see below appendix 1 thesis 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | ‘On Creation’, pt. 10, after 9th problem, p. 307</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

e</a></div>
</figure><figure class="quote" id="q-c0a787b362" data-kw="">
<blockquote><p>If it be further demanded, whether in case that death follows, it be to be understood of any child, how little time soever the mother has gone with it? I answer with Simlerus that we must distinguish between a child formed and unformed, if the child were an embryo, not yet perfected, although it perished, the party, by whose stroke, was not to be put to death, but for such only as was come to perfection, so likewise Augustine and Jerome in Decretis, Causa 32, Question 2, Ch. Mosis, and the words of the text, ‘life for life’, seem to make for it, that a man’s life must not be paid but for one living and perfected, and the Septuagint make this plain by rendering, ‘not death’, [Hebrew], ‘not formed’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, … (London, 1653), Exodus, ch. 21, p. 558</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-823f7d21fd" data-kw="">
<blockquote><p>the body of Christ our Savior did not observe this law of successive formation in the womb of the virgin mother, for what was to be gradually fashioned by the force of nature in the space of forty days, was perfected and completed in a moment by divine power and the work of the Holy Spirit.</p></blockquote>

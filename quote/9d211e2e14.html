<main class="wrap"><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

</figure><figure class="quote" id="q-1adee36587" data-kw="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>

</figure><figure class="quote" id="q-268fbb81ca" data-kw="">
<blockquote><p>And can a man devise to tear the majesty of our Lord Jesus Christ and to deface his glory more than by the things that the Papists do? Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal son, in whom dwells the fulness of the Godhead, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby the only flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 23, the 5th upon Dt. 4, p. 138</span></figcaption>

<blockquote><p>[Ralph] Erskine’s comparison of mental idolatry with mental adultery suggests some important clues. A man cannot always avoid seeing a beautiful woman or being attracted to her. Mental adultery does not consist in physical sight, but in cultivating the mental image of that woman for the purpose of sexual stimulation. In the same way, it is possible to walk past a portrait of Christ in a museum without yielding to any temptation to meditate on God through its instrumentality. Even if the picture is sinful, the viewer need not sin.</p></blockquote>

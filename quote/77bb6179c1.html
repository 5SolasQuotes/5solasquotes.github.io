<main class="wrap"><figure class="quote" id="q-77bb6179c1" data-kw="">
<blockquote><p>Whereupon Tertullian said: ‘First God sent Nature to be our school-dame, purposing afterward to send the Word; that so having learned in the school of Nature, we might the more easily believe the Word of God.’ So then as when I see an house, I say there has been a carpenter, though I see him not: so when I look upon the frame of this world, I must say, it had a builder, though I behold him not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion... (London: Snowdon, 1606), 1. ‘Of God’, How do you prove that there is a God?</cite>, p. 1</span></figcaption>

<blockquote><p>1. Vos is very insightful and helpful for developing a Reformed natural theology. 2. Vos’s natural-theological method and underlying cognitive theory differ substantively from both that of Thomas Aquinas and even most Reformed scholastics (Voetius, Turretin, Maastricht, Charnock…). Associating Vos with Thomism (as Fesko seems to do in his Introduction) is inaccurate and amateurish. 3. Vos’s and Van Til’s accounts are fundamentally aligned. A main difference between Vos and Van Til is that Van Til makes the implanted knowledge of God a condition for the possibility of not only (i) the acquired knowledge of God but also (ii) knowledge of creatures—which Vos may not even disagree with. Non-Thomist elements in Vos’s natural theology—which also distinguish him from many Reformed scholastics: 1. Innate knowledge of God. The innate knowledge of God (i) involves a “thick” concept of God as absolute being (not a general concept of a highest being), (ii) is produced in all people by the Holy Spirit’s illumination, and (iii) is the principle of knowledge of God acquired through experience and inference. 2. Ontological argument. An adjusted form of the ontological argument is sound. It consists merely in drawing attention to the innate knowledge of God—not in deducing God’s existence from a concept of God’s essence (p. 52, n. 113; p. 56, n. 127). 3. Cosmological arguments. Arguments which simply prove that an uncaused cause exists are weak: They don’t prove that the cause must be an absolute being (p. 55, n. 124). The innate knowledge of God (as an absolute being) grounds our knowledge that every (non-absolute) effect requires a cause (p. 55, n. 127). Vos thinks that innate knowledge of God is a condition for the possibility of acquired knowledge of God, and he takes himself to be following Calvin here.</p></blockquote>

<blockquote><p>I here consider Francis Turretin’s approach to Natural Theology through an analysis of his response to Five important questions. First of all, what, according to Turretin, Natural Theology is and isn’t (as well as the contents of Natural Theology). Secondly, whether humans (fallen or regenerated) are able to engage in Natural Theology, and how. Thirdly, the relationship between Natural theology and the articles of faith. Fourthly, the uses and limitations of natural theology. Fifthly, the effect of Natural Theology.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c297e9359a" data-kw="">
<blockquote><p>Let me now perswade you to rejoyce evermore by the two arguments of necessity and utility. 1. The necessity of it: (1) That you may own God as your God, delighting in God is a duty of the First Commandment, ‘Thou shalt have no other gods before Me:’ that is, rejoice in no other, but in Me only, as thy full and all-sufficient portion and happiness: And therefore it is a part, not of instituted, but of natural worship; such worship which we are to give God though He had never given direction about it; which immediately results from the owning and choosing of God for our God. For if God be not loved and delighted in more than anything, or all things else, He is not our God. Now then is there not a necessity, if you would worship God as God, that you should rejoice evermore, and delight in Him as sufficient to your happiness, whether the world comes or goes, whether your creature comforts and relations continue with you, or be taken from you? God still must be the heart’s delight and your exceeding joy. Ps. 37:4, ‘Delight thyself also in the Lord, and He shall give thee the desires of thine heart.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fourth Volume containing One Hundred &amp; Fifty Sermons on Several Texts of Scripture… (d. 1677; London: J.D., 1693), 2nd Sermon on 1 Thess. 5:16</cite>, p. 767</span></figcaption>

</figure><figure class="quote" id="q-f84e1e20f2" data-kw="">
<blockquote><p>For answering… how the Mediator is the object of divine worship: we shall first distinguish this title ‘object,’ then answer. By divines there is in this case a threefold object acknowledged (all agreeing to the Mediator in some respect): 1. There is objectum materiale, or, quod [‘that’], that is, the object, or Person to whom worship is given. 2. There is objectum formale, or, quo, that is, the account upon which it is given to that Person, or object. 3. There is objectum considerationis, that is, the consideration that the worshipper has of that object in worshipping of Him, and is as a motive thereto, or is (as the learned Voetius calls it, specificatio objecti) ‘the specification of the object,’ whereby the heart of the worshipper, by taking up the object worshipped under such a consideration, is warmed with love and thankfulness, and strengthened in his confidence, to worship that object. Thus, the relations that God took on Him to be the redeemer of His people from Egypt, and from the land of the North, did give no new object of worship, yet did they give some external denominations, or specifications, of that object, God, to them: the consideration whereof in their worshipping did much qualify the object to them, so that with the more thankfulness and confidence they might approach to Him: and thus we distinguish between the object worshipped, and the consideration which may be had of Him in our worship. And this does not make Him adorable simply and in Himself, because He was so naturally; but, it is the ground upon which He is accessible to us, who are sinners and enemies:</p></blockquote>

</figure><figure class="quote" id="q-12bc9a21f6" data-kw="">
<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), ‘The Distribution of Theology’</cite></span></figcaption>

</figure><figure class="quote" id="q-647983ef1f" data-kw="">
<blockquote><p>This invented or will-worship [Col. 2:23], Cultus arbitrarius, has two specious things in it, as the apostle says: 1. The first is a kind of wisdom, and carries with it a trim show thereof: when a man shall be thought so wise as that he is able to devise and invent a worship for God, especially when men consider not what God has already prescribed, whereby their rites prove contrary to what He has appointed, and so they will be wiser than God. … Although, all will-worship, [Greek], be taken in an evil sense by many, upon the vulgar exposition of that place in Col. 2:23, yet that there may be some voluntary or free worship acceptable to God, though not specially commanded, provided it be not corruptive of or contrary to any right or worship commanded by Him, but subservient or agreeable thereto, is the judgement of learned divines; For under the law they had their voluntary and free-will offerings, besides those commanded by God, and though things were more particularly prescribed in the Levitical worship than now under the Gospel, the Church being then in its childhood, and confined to one nation, and the Spirit not then so plentifully given as now since the ascension of Christ, yet even then the Church prescribed diverse things in God’s worship not specially commanded, as in fasts and festival days, as that of the dedication of the Temple, approved by Christ’s own observance, Jn. 10, and sundry other things, all which were never taxed as unlawful, unless the worship appointed by God Himself were thereby corrupted or neglected, and so the continual practice of the Christian Church has been to prescribe and order several things in God’s worship, which no peaceable and holy men ever found fault with, provided, that they were agreeable to those general rules of moral worship required by God and no ways repugnant to those rites by Him appointed, but rather subservient to them, and contained nothing either impious and forbidden, or vain and ridiculous; nor the observance of them preferred before the commandments of God, or made equal to them; but a difference observed between things of immediate divine institution and those of ecclesiastical institution: To add to God’s institution anything as from God is forbidden, Dt. 12:32, but to add something for the more decent and orderly performance of what God has appointed, and to observe the same as an ecclesiastical institution, is nowhere forbidden, but rather commanded in all those texts that require us to hear the Church [Mt. 18] and to give obedience to her; and to observe this is also to obey God, who has given his Church power to ordain such things: And that that place in Col. 2:23, condemns not all voluntary or free worship no more than it does humility and chastening, or keeping under the body which are joined therewith, but rather that it makes for it has been lately proved by judicious and learned divines; and by one in a full tract upon this subject of will-worship; for the apostle there condemning certain Jewish and Pythagorean observances about touching, tasting, etc. says, verse 23, that they had a show of wisdom, if due cautions were observed, viz. if they were freely and voluntarily undertaken, not as necessary to salvation, and without rejecting what God had made, and if they were used in humility or modesty not condemning others which used them not, and if they sought thereby only to keep under the flesh. The contrary to all which those Pythagoreans and Jews practiced. By which exposition, which I take to be the most true, it is plain that the apostle is so far from condemning all voluntary or will-worship, that he rather approves and commends it, and condemns their forbearance of meats and other things because it was not freely or voluntarily undertaken, but as a thing necessary to salvation, etc. See [Hugo] Grotius in Col. 2:23, Et votum pro pace, pp. 100-103, and [Andrew] Rivet, Apologeticus, pp. 109-10, etc. Dr. [Henry] Hammond, Of Will-Worship. See also our reverend author in his sermon on Mt. 6:16, p. 124, etc. and on 1 Cor. 11:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrewes-lancelot.html">Andrewes Lancelot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moral Law Expounded: Largely, Learnedly, Orthodoxly… upon the Ten Commandments… (d. 1626; London: Sparke, 1642), On the Ten Commandments, 2nd Commandment, ch. 1, pp. 194-95 See</cite>, p. 196 for more.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This invented or will-worship [Col. 2:23], Cultus arbitrarius, has two specious things in it, as the apostle says: 1. The first is a kind of wisdom, and carries with it a trim show thereof: when a man shall be thought so wise as that he is able to devise and invent a worship for God, especially when men consider not what God has already prescribed, whereby their rites prove contrary to what He has appointed, and so they will be wiser than God. … Although, all will-worship, [Greek], be taken in an evil sense by many, upon the vulgar exposition of that place in Col. 2:23, yet that there may be some voluntary or free worship acceptable to God, though not specially commanded, provided it be not corruptive of or contrary to any right or worship commanded by Him, but subservient or agreeable thereto, is the judgement of learned divines; For under the law they had their voluntary and free-will offerings, besides those commanded by God, and though things were more particularly prescribed in the Levitical worship than now under the Gospel, the Church being then in its childhood, and confined to one nation, and the Spirit not then so plentifully given as now since the ascension of Christ, yet even then the Church prescribed diverse things in God’s worship not specially commanded, as in fasts and festival days, as that of the dedication of the Temple, approved by Christ’s own observance, Jn. 10, and sundry other things, all which were never taxed as unlawful, unless the worship appointed by God Himself were thereby corrupted or neglected, and so the continual practice of the Christian Church has been to prescribe and order several things in God’s worship, which no peaceable and holy men ever found fault with, provided, that they were agreeable to those general rules of moral worship required by God and no ways repugnant to those rites by Him appointed, but rather subservient to them, and contained nothing either impious and forbidden, or vain and ridiculous; nor the observance of them preferred before the commandments of God, or made equal to them; but a difference observed between things of immediate divine institution and those of ecclesiastical institution: To add to God’s institution anything as from God is forbidden, Dt. 12:32, but to add something for the more decent and orderly performance of what God has appointed, and to observe the same as an ecclesiastical institution, is nowhere forbidden, but rather commanded in all those texts that require us to hear the Church [Mt. 18] and to give obedience to her; and to observe this is also to obey God, who has given his Church power to ordain such things: And that that place in Col. 2:23, condemns not all voluntary or free worship no more than it does humility and chastening, or keeping under the body which are joined therewith, but rather that it makes for it has been lately proved by judicious and learned divines; and by one in a full tract upon this subject of will-worship; for the apostle there condemning certain Jewish and Pythagorean observances about touching, tasting, etc. says, verse 23, that they had a show of wisdom, if due cautions were observed, viz. if they were freely and voluntarily undertaken, not as necessary to salvation, and without rejecting what God had made, and if they were used in humility or modesty not condemning others which used them not, and if they sought thereby only to keep under the flesh. The contrary to all which those Pythagoreans and Jews practiced. By which exposition, which I take to be the most true, it is plain that the apostle is so far from condemning all voluntary or will-worship, that he rather approves and commends it, and condemns their forbearance of meats and other things because it was not freely or voluntarily undertaken, but as a thing necessary to salvation, etc. See [Hugo] Grotius in Col. 2:23, Et votum pro pace, pp. 100-103, and [Andrew] Rivet, Apologeticus, pp. 109-10, etc. Dr. [Henry] Hammond, Of Will-Worship. See also our reverend author in his sermon on Mt. 6:16, p. 124, etc. and on 1 Cor. 11:16.”

— Andrewes Lancelot, The Moral Law Expounded: Largely, Learnedly, Orthodoxly… upon the Ten Commandments… (d. 1626; London: Sparke, 1642), On the Ten Commandments, 2nd Commandment, ch. 1, pp. 194-95 See, p. 196 for more.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+invented+or+will-worship+%5BCol.+2%3A23%5D%2C+Cultus+arbitrarius%2C+has+two+specious+things+in+it%2C+as+the+apostle+says%3A+1.+The+first+is+a+kind+of+wisdom%2C+and+carries+with+it+a+trim+show+thereof%3A+when+a+man+shall+be+thought+so+wise+as+that+he+is+able+to+devise+and+invent+a+worship+for+God%2C+especially+when+men+consider+not+what+God+has+already+prescribed%2C+whereby+their+rites+prove+contrary+to+what+He+has+appointed%2C+and+so+they+will+be+wiser+than+God.+%E2%80%A6+Although%2C+all+will-worship%2C+%5BGreek%5D%2C+be+taken+in+an+evil+sense+by+many%2C+upon+the+vulgar+exposition+of+that+place+in+Col.+2%3A23%2C+yet+that+there+may+be+some+voluntary+or+free+worship+acceptable+to+God%2C+though+not+specially+commanded%2C+provided+it+be+not+corruptive+of+or+contrary+to+any+right+or+worship+commanded+by+Him%2C+but+subservient+or+agreeable+thereto%2C+is+the+judgement+of+learned+divines%3B+For+under+the+law+they+had+their+voluntary+and+free-will+offerings%2C+besides+those+commanded+by+God%2C+and+though+things+were+more+particularly+prescribed+in+the+Levitical+worship+than+now+under+the+Gospel%2C+the+Church+being+then+in+its+childhood%2C+and+confined+to+one+nation%2C+and+the+Spirit+not+then+so+plentifully+given+as+now+since+the+ascension+of+Christ%2C+yet+even+then+the+Church+prescribed+diverse+things+in+God%E2%80%99s+worship+not+specially+commanded%2C+as+in+fasts+and+festival+days%2C+as+that+of+the+dedication+of+the+Temple%2C+approved+by+Christ%E2%80%99s+own+observance%2C+Jn.+10%2C+and+sundry+other+things%2C+all+which+were+never+taxed+as+unlawful%2C+unless+the+worship+appointed+by+God+Himself+were+thereby+corrupted+or+neglected%2C+and+so+the+continual+practice+of+the+Christian+Church+has+been+to+prescribe+and+order+several+things+in+God%E2%80%99s+worship%2C+which+no+peaceable+and+holy+men+ever+found+fault+with%2C+provided%2C+that+they+were+agreeable+to+those+general+rules+of+moral+worship+required+by+God+and+no+ways+repugnant+to+those+rites+by+Him+appointed%2C+but+rather+subservient+to+them%2C+and+contained+nothing+either+impious+and+forbidden%2C+or+vain+and+ridiculous%3B+nor+the+observance+of+them+preferred+before+the+commandments+of+God%2C+or+made+equal+to+them%3B+but+a+difference+observed+between+things+of+immediate+divine+institution+and+those+of+ecclesiastical+institution%3A+To+add+to+God%E2%80%99s+institution+anything+as+from+God+is+forbidden%2C+Dt.+12%3A32%2C+but+to+add+something+for+the+more+decent+and+orderly+performance+of+what+God+has+appointed%2C+and+to+observe+the+same+as+an+ecclesiastical+institution%2C+is+nowhere+forbidden%2C+but+rather+commanded+in+all+those+texts+that+require+us+to+hear+the+Church+%5BMt.+18%5D+and+to+give+obedience+to+her%3B+and+to+observe+this+is+also+to+obey+God%2C+who+has+given+his+Church+power+to+ordain+such+things%3A+And+that+that+place+in+Col.+2%3A23%2C+condemns+not+all+voluntary+or+free+worship+no+more+than+it+does+humility+and+chastening%2C+or+keeping+under+the+body+which+are+joined+therewith%2C+but+rather+that+it+makes+for+it+has+been+lately+proved+by+judicious+and+learned+divines%3B+and+by+one+in+a+full+tract+upon+this+subject+of+will-worship%3B+for+the+apostle+there+condemning+certain+Jewish+and+Pythagorean+observances+about+touching%2C+tasting%2C+etc.+says%2C+verse+23%2C+that+they+had+a+show+of+wisdom%2C+if+due+cautions+were+observed%2C+viz.+if+they+were+freely+and+voluntarily+undertaken%2C+not+as+necessary+to+salvation%2C+and+without+rejecting+what+God+had+made%2C+and+if+they+were+used+in+humility+or+modesty+not+condemning+others+which+used+them+not%2C+and+if+they+sought+thereby+only+to+keep+under+the+flesh.+The+contrary+to+all+which+those+Pythagoreans+and+Jews+practiced.+By+which+exposition%2C+which+I+take+to+be+the+most+true%2C+it+is+plain+that+the+apostle+is+so+far+from+condemning+all+voluntary+or+will-worship%2C+that+he+rather+approves+and+commends+it%2C+and+condemns+their+forbearance+of+meats+and+other+things+because+it+was+not+freely+or+voluntarily+undertaken%2C+but+as+a+thing+necessary+to+salvation%2C+etc.+See+%5BHugo%5D+Grotius+in+Col.+2%3A23%2C+Et+votum+pro+pace%2C+pp.+100-103%2C+and+%5BAndrew%5D+Rivet%2C+Apologeticus%2C+pp.+109-10%2C+etc.+Dr.+%5BHenry%5D+Hammond%2C+Of+Will-Worship.+See+also+our+reverend+author+in+his+sermon+on+Mt.+6%3A16%2C+p.+124%2C+etc.+and+on+1+Cor.+11%3A16.%E2%80%9D%0A%0A%E2%80%94+Andrewes+Lancelot%2C+The+Moral+Law+Expounded%3A+Largely%2C+Learnedly%2C+Orthodoxly%E2%80%A6+upon+the+Ten+Commandments%E2%80%A6+%28d.+1626%3B+London%3A+Sparke%2C+1642%29%2C+On+the+Ten+Commandments%2C+2nd+Commandment%2C+ch.+1%2C+pp.+194-95+See%2C+p.+196+for+more.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F647983ef1f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/647983ef1f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=This%20invented%20or%20will%2Dworship%20%5BCol.%202%3A23%5D%2C,etc.%20and%20on%201%20Cor.%2011%3A16." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-aa4d1194ea" data-kw="">
<blockquote><p>In the midst of distinguishing biblical penal servitude from American slavery, the Synod of the Reformed Presbyterian Church of Scotland argued that the moral-judicial laws would form the basis for the civil codes of Christian nations during the church’s latter-day glory:

Those Hebrews alone were subjected to the servitude prescribed who had been convicted of some moral offence. There were especially, two crimes that were visited with this form of punishment – theft, for which they could make restitution, and the contraction of debt which they were unable to pay. How different the way which you act! It is not persons who have been guilty of offences deserving punishment, at the hand of the civil courts, that you are bringing into slavery, or keeping in it. Were you to seize upon all the incorrigible thieves, and all the fraudulent bankrupts that you could find in the Union, and carry them off to the plantations, to perform the labours you now exact from unoffending Africans, there would have been no ground for a charge of injustice. We would rather rejoice in your reviving the spirit of that sacred jurisprudence which was given in the volume of revelation by the Israelites, and which, we have no doubt, will yet furnish, in its great moral principles, the basis of that high judicial code which christian nations shall enjoy, when God will “make their officers peace, and their exactors righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-the-reformed-presbyterian-church-in-scotland.html">Synod of the Reformed Presbyterian Church in Scotland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An expostulation with those Christians and Christian churches, in the United States of America, that are implicated in the sin of slaveholding. By a committee of the Synod of the Reformed Presbyterian Church in Scotland’ Reformed Presbyterian</cite></span></figcaption>

<blockquote><p>As Baillie explained, there were certain cases of necessity in which a presbytery could deem it expedient to appoint a temporary bishop, either to prevent schism schism and preserve the unity of the national church or to preside over an ecclesiastical assembly as moderator… The type of ‘superintendent’ of which Baillie approved in the ancient church was never granted powers of order or jurisdiction that were not also given to preaching presbyters… Ordination was given by divine right to the presbytery of Ephesus–not just the meeting of presbyters but the ‘office and grade of presbyter’ as described by St Jerome and Calvin–which continued to exist even after the ordination of Timothy as a bishop; a delegation, rather than relegation of powers of jurisdiction. Acts 20:17 and 28 both outlined the divine warrant of temporary, ambulatory pastors who were ‘given the power of determining doctrine and expelling heretics from the church by the Sacred Spirit’. Yet Baillie quickly affirmed that the superiority maintained in these loci were during periods when the church’s polity was in flux.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>Consider now what that justification is, that is obtained by this true lively faith; I showed unto you that justification is ordinarily taken for an acquittance from a debt. It is derived from “justice” or “righteousness”; therefore I showed that justification and righteousness are taken for one and the self-same thing; ‘For if there had been a Law given which could,’ etc. that is: justification had been by the Law. Now as there is a double righteousness, so there is also a double justification. Not that I hold there is any other justification as it comprehends remission of sins, but only one, but otherways, as many righteousnesses as there are, so many justifications there are. Now there is a double kind of righteousness, the one imputed, and the other inherent; the one is the righteousness of Christ, an act transient from another, which cannot be made mine but by imputation. Besides this there is another which is inherent, a righteousness in us. St. James speaks of the one, and Saint John of the other. One is opposed to condemnation, and the other to hypocrisy. The soundness of the heart is respected of God for righteousness, in respect of the graces inherent in us. Now to give you a touch of the difference between the one and the other, and therein to declare the difference between us and Rome: Know then that the question between us and Rome is not whether justification be by faith or no? But whether there be any such thing as justification or no? The doctrine of the Church of Rome is that there is no such grace as this. But concerning the first of these, that justification which is by the imputation of Christ’s righteousness, I showed unto you that imputation in this case is, as when a man comes to hold up his hand at God’s bar, as it were, and it’s demanded of him what he has to say for himself why he should not die, and then this justification by Christ’s righteousness is opposed to condemnation. Then justification by faith is that when I come to stand before God, though conscience say I am guilty of a thousand sins, yet I may go boldly and plead my pardon, which will acquit me as if I had never sinned at anytime. God was thus in Christ reconciling us (the world) unto Himself, not imputing their sins unto them. Now sin is a thing past, which being done, cannot be made undone, the sin remains still; murder is murder still, and adultery is adultery still; it cannot be undone again. Now how shall this man that is guilty of murder and adultery be made just? It cannot possibly be but by not imputing his sin unto him, so that God should account it to him as if it had not been done at all by him; He puts it upon Christ’s account; ‘Account’: The word is used in the epistle to Philemon, where St. Paul says, ‘If he has wronged thee, or owes thee ought, put that on mine account.’ A man’s sins being thus put upon Christ’s account, he is accepted of God as freely as if he had never owed him anything, or as if he had never offended Him. Now this is done by transferring the debt from one person to another; so that we see this imputation of sin to Christ, and of Christ’s righteousness to us is most necessary. It must be so: And if there were no testimony for it in Scripture, yet reason sheweth that there can be no righteousness but by God’s acceptation of us in Christ as if we had never sinned; there is the difference then. ‘To him that worketh not, but believeth in him that justifieth the ungodly, his faith is accounted to him for righteousness.’ But does God justify the ungodly? That’s a hard speech; we read in the Proverbs: ‘He that justifieth the wicked, and condemneth the just, even they both are abomination to the Lord.’ But here we must understand this as we do some other Scriptures; we read in John that the blind see, the lame walk, the dumb speak. It’s impossible for a man to be blind and see, to be dumb and speak all at once; yet take the chief of sinners, suppose Paul, and he was so in his own account; but the act of justification alters him. God justifies the ungodly, that is, him that was even now so; but by the imputation of Christ’s righteousness he is made righteous, that is, righteous in God’s account.</p></blockquote>

<blockquote><p>4. The Holy Ghost speaks generally of all men, whether regenerate or unregenerate, and of all works, whether going before faith or following it, that a man, that is, every one, who is justified, is justified by faith without the works of the law, Rom. 3:28, that a man is not justified (that is, that no man is justified) by the works of the Law, but by the faith of Jesus Christ, for by the works of the Law no flesh, that is, as the Psalmist speaks, no man living shall be justified, Gal. 2:16. For as in the first act of justification we are justified by faith without respect of works, so our justification is continued unto us without respect of our works. And this appears most plainly in the examples of Abraham, of Job, of David, of Paul, etc. as I showed before, who, though they abounded with good works which they wrought by faith, yet were not justified by them, but by faith only. For that which Chrysostom says of Abraham is also verified of all the godly: for, says he, that a man having not works should be justified by faith, it is no unlikely thing: [Greek], but this, that a man flourishing in good works, should not thereby be justified, but by faith, it was wonderful, and very much sets forth the force of faith.</p></blockquote>

<blockquote><p>‘Which believe in Him that raised up Jesus our Lord from the dead, who was delivered for our sins, and is risen again for our justification.’ …But here arises a doubt, by what means the apostle may seem to seioine and to put asunder these things one from the other: namely, the forgiveness of sin, and justification: and one the other side, the faith of the death, from the faith of the resurrection, when as it seems that by the faith of each part, of his death (I say) and of his resurrection is given not only remission of sins but also justification. … …wherefore there are yet behind two other very likely interpretations: Of which the first is, that in very deed, by the death of Christ was paid the price of our redemption. But, that it might be applied unto us, there needs the Holy Ghost, to move us to believe, and Christ to give unto us this Holy Ghost, rose again from death, sent abroad his apostles to preach into all parts of the world, and now also before the Father, executes the office of an intercessor and high priest: therefore is He said to have risen again to help us that we might obtain justification. Chrysostom seems to lean unto this sentence. The second exposition [as pertaining to inherent righteousness] is that the faith of the death and of the resurrection brings justification: but Paul seioyned them aptly to declare the analogy and proportion between them. Unto the death of Christ answers very well the forgiveness of sins, for by reason of them, death was due unto us. And as Christ, as touching this corruptible life, died, so also ought we, when we are justified to die unto sin. Again because justification seems herein to be declared in that we begin a new life, therefore is it referred unto the resurrection of Christ: for that he then seemed to have begun a celestial and happy life. Paul used in a maner the self-same form of words in this same epistle, when he says [Rom. 10]: ‘with the heart we believe unto righteousness: and with the mouth is confession made to salvation.’ For the faith of the heart both works righteousness and also brings salvation: but because salvation and instauration are chiefly declared in action, therefore he ascribed it to confession. But whither of these expositions is the truer, neither will I contend, nor also now declare. Of those things which have now been spoken, we gather a most sweet consolation: for thereby we do not only know the weight of sin, but also we understand that God bare a singular good love towards us: as one which gave his only begotten Son, and that unto the death to deliver us from sins. Farther, seeing Christ is said to have risen from the dead for our justification, we easily see that we are by Him called back to a new life: unto which yet we cannot aspire, except we be of Him elected.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“‘Which believe in Him that raised up Jesus our Lord from the dead, who was delivered for our sins, and is risen again for our justification.’ …But here arises a doubt, by what means the apostle may seem to seioine and to put asunder these things one from the other: namely, the forgiveness of sin, and justification: and one the other side, the faith of the death, from the faith of the resurrection, when as it seems that by the faith of each part, of his death (I say) and of his resurrection is given not only remission of sins but also justification. … …wherefore there are yet behind two other very likely interpretations: Of which the first is, that in very deed, by the death of Christ was paid the price of our redemption. But, that it might be applied unto us, there needs the Holy Ghost, to move us to believe, and Christ to give unto us this Holy Ghost, rose again from death, sent abroad his apostles to preach into all parts of the world, and now also before the Father, executes the office of an intercessor and high priest: therefore is He said to have risen again to help us that we might obtain justification. Chrysostom seems to lean unto this sentence. The second exposition [as pertaining to inherent righteousness] is that the faith of the death and of the resurrection brings justification: but Paul seioyned them aptly to declare the analogy and proportion between them. Unto the death of Christ answers very well the forgiveness of sins, for by reason of them, death was due unto us. And as Christ, as touching this corruptible life, died, so also ought we, when we are justified to die unto sin. Again because justification seems herein to be declared in that we begin a new life, therefore is it referred unto the resurrection of Christ: for that he then seemed to have begun a celestial and happy life. Paul used in a maner the self-same form of words in this same epistle, when he says [Rom. 10]: ‘with the heart we believe unto righteousness: and with the mouth is confession made to salvation.’ For the faith of the heart both works righteousness and also brings salvation: but because salvation and instauration are chiefly declared in action, therefore he ascribed it to confession. But whither of these expositions is the truer, neither will I contend, nor also now declare. Of those things which have now been spoken, we gather a most sweet consolation: for thereby we do not only know the weight of sin, but also we understand that God bare a singular good love towards us: as one which gave his only begotten Son, and that unto the death to deliver us from sins. Farther, seeing Christ is said to have risen from the dead for our justification, we easily see that we are by Him called back to a new life: unto which yet we cannot aspire, except we be of Him elected.”

— Peter Martyr Vermigli, A Most Learned &amp; Fruitful Commentary upon the Epistle of St. Paul to the Romans... (d. 1562; London: 1568), on ch. 4, verse 25, p. 97">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Which+believe+in+Him+that+raised+up+Jesus+our+Lord+from+the+dead%2C+who+was+delivered+for+our+sins%2C+and+is+risen+again+for+our+justification.%E2%80%99+%E2%80%A6But+here+arises+a+doubt%2C+by+what+means+the+apostle+may+seem+to+seioine+and+to+put+asunder+these+things+one+from+the+other%3A+namely%2C+the+forgiveness+of+sin%2C+and+justification%3A+and+one+the+other+side%2C+the+faith+of+the+death%2C+from+the+faith+of+the+resurrection%2C+when+as+it+seems+that+by+the+faith+of+each+part%2C+of+his+death+%28I+say%29+and+of+his+resurrection+is+given+not+only+remission+of+sins+but+also+justification.+%E2%80%A6+%E2%80%A6wherefore+there+are+yet+behind+two+other+very+likely+interpretations%3A+Of+which+the+first+is%2C+that+in+very+deed%2C+by+the+death+of+Christ+was+paid+the+price+of+our+redemption.+But%2C+that+it+might+be+applied+unto+us%2C+there+needs+the+Holy+Ghost%2C+to+move+us+to+believe%2C+and+Christ+to+give+unto+us+this+Holy+Ghost%2C+rose+again+from+death%2C+sent+abroad+his+apostles+to+preach+into+all+parts+of+the+world%2C+and+now+also+before+the+Father%2C+executes+the+office+of+an+intercessor+and+high+priest%3A+therefore+is+He+said+to+have+risen+again+to+help+us+that+we+might+obtain+justification.+Chrysostom+seems+to+lean+unto+this+sentence.+The+second+exposition+%5Bas+pertaining+to+inherent+righteousness%5D+is+that+the+faith+of+the+death+and+of+the+resurrection+brings+justification%3A+but+Paul+seioyned+them+aptly+to+declare+the+analogy+and+proportion+between+them.+Unto+the+death+of+Christ+answers+very+well+the+forgiveness+of+sins%2C+for+by+reason+of+them%2C+death+was+due+unto+us.+And+as+Christ%2C+as+touching+this+corruptible+life%2C+died%2C+so+also+ought+we%2C+when+we+are+justified+to+die+unto+sin.+Again+because+justification+seems+herein+to+be+declared+in+that+we+begin+a+new+life%2C+therefore+is+it+referred+unto+the+resurrection+of+Christ%3A+for+that+he+then+seemed+to+have+begun+a+celestial+and+happy+life.+Paul+used+in+a+maner+the+self-same+form+of+words+in+this+same+epistle%2C+when+he+says+%5BRom.+10%5D%3A+%E2%80%98with+the+heart+we+believe+unto+righteousness%3A+and+with+the+mouth+is+confession+made+to+salvation.%E2%80%99+For+the+faith+of+the+heart+both+works+righteousness+and+also+brings+salvation%3A+but+because+salvation+and+instauration+are+chiefly+declared+in+action%2C+therefore+he+ascribed+it+to+confession.+But+whither+of+these+expositions+is+the+truer%2C+neither+will+I+contend%2C+nor+also+now+declare.+Of+those+things+which+have+now+been+spoken%2C+we+gather+a+most+sweet+consolation%3A+for+thereby+we+do+not+only+know+the+weight+of+sin%2C+but+also+we+understand+that+God+bare+a+singular+good+love+towards+us%3A+as+one+which+gave+his+only+begotten+Son%2C+and+that+unto+the+death+to+deliver+us+from+sins.+Farther%2C+seeing+Christ+is+said+to+have+risen+from+the+dead+for+our+justification%2C+we+easily+see+that+we+are+by+Him+called+back+to+a+new+life%3A+unto+which+yet+we+cannot+aspire%2C+except+we+be+of+Him+elected.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+A+Most+Learned+%26+Fruitful+Commentary+upon+the+Epistle+of+St.+Paul+to+the+Romans...+%28d.+1562%3B+London%3A+1568%29%2C+on+ch.+4%2C+verse+25%2C+p.+97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac48967e05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ac48967e05.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Which%20believe%20in%20Him%20that%20raised,except%20we%20be%20of%20Him%20elected&amp;text=Which%20believe%20in%20Him%20that%20raised%20up%20Jesus&amp;text=cannot%20aspire%2C%20except%20we%20be%20of%20Him%20elected" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ebd9cd8cc4" data-kw="">
<blockquote><p>A double accusation may be brought against man before the tribunal of God: that he is a sinner, and so guilty of the breach of the first covenant [of Works]; or that he is no sound believer, having not fulfilled the condition [i.e. faith] of the second [covenant, i.e. of grace]. As to the first accusation, we are justified by faith; as to the second, by works; and so James and Paul are reconciled (Rom. 3:24; Jm. 2:24): “A man is justified by faith without the deeds of the law,” and “a man is justified by works and not by faith only.</p></blockquote>

</figure><figure class="quote" id="q-11aa9bd530" data-kw="">
<blockquote><p>Indeed the works that follow our justification although they proceed from the Spirit of God who has taken possession of the hearts of those justified, are nevertheless of themselves unclean, because they are performed in a heart that is still impure. For justification has just begun and is not completed. We have received the first fruits of the Spirit (Rom. 8:23) but not yet the ‘titles’.¹ We are still waiting with groaning as Paul says in Rom. 8:23, for the redemption of our body. ¹ In order to understand this and the following assertions, the reader must bear in mind that Melanchthon understands ‘justificatio’ in the Augustinian sense. In a preliminary draft of the Loci called ‘Theologica Institutio’ he describes it not as a new relation to God but as the actual possession of true ‘justitia’ quae et constans esset et ex animo bearet nos.’ Thus ‘justificatio’ and ‘sanctificatio’ fall in fundamentally together. Later this notion gradually receded into the background. cf. Herrlinger: Theologie Melanchthons S. 6 ff….</p></blockquote>

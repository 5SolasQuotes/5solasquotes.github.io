<main class="wrap"><figure class="quote" id="q-757e8a0bda" data-kw="">
<blockquote><p>The righteousness required by the Moral Law is of two sorts: 1. Habitual [an abiding inward disposition], in the inherent holiness of man’s whole person, when such gracious qualities are fixed and planted in every faculty of soul and body: as do dispose and incline the motions of both only unto that which is conformable to the righteousness of the Law. That such righteousness is required by the Law is a plain case and confessed; That which commands the good or forbids the evil action does command the virtuous and forbid the vicious habit too. He that looks for purity in the stream cannot but dislike poison in the fountain: and God that commands us to do good, bids us also to be holy; nor can we do the one, unless we do the other. And therefore the apostle joins both together. The end of the commandment is love, (but where?) out of a pure heart, 1 Tim. 1:5. 2. Actual, in the exercise of all good works enjoined by the Law, and forbearing the contrary evil works. Whether these good or evil works be inward in that spiritual obedience which the Law required; (viz.) in the right ordering of all the motions of our souls, that every one of our thoughts, imaginations, purposes of our mind, and all the secret workings and stirrings of our affections, be altogether employed upon piety and charity, not so much as touching upon any thing that is contrary to the love of God or our neighbor. Or, whether these good and evil works be outward in the bodily obedience unto the Law, in doing all and every external duty of religion towards God: of justice and mercy towards man; and in leaving undone the contrary. Further this actual righteousnesse of the Law is to be considered two ways: 1. As it respects all the commandments, and so that righteousness is only perfect, which fulfils all and every particular precept of the Law. 2. As it respects any one commandment, or any one duty therein contained. And so we may call that righteousness perfect, which exactly performs any one point of the Law, though it fail in others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith</cite>, … 1st ed. (Oxford, 1625), section 3, ch. 1, pp. 66-67</span></figcaption>

<blockquote><p>Answer 2. Necessary, though not necessitate efficientiae as causes; yet necessitate presentiae, as necessary consequents of justification, and as necessary antecedents of glorification. They are necessary, I say, by a necessity not only privative (if I may so speak) but also positive… Answer 3. They are necessary also by a positive necessity, and that manifold. As first by the necessity of infallibility, in respect of God’s decree, Word, oath. … Answer 6. Secondly, they are necessary necessitate pracepti, imposing a necessity of duty, towards God, our neighbor, ourselves. … Argument 8. Thirdly, they are necessary, necessitate signi, as necessary signs and evidences, whereby we are to gather assurance to ourselves of our justification, whereby our faith is to be demonstrated, whereby we are to make our calling, and our election sure. … Argument 9. Lastly, they are necessary necessitate medii, and as that, which, though it be no cause, is called causa sine qua non. And thus they are necessary: First, as the way, which leadeth to life eternal, via qua nos perducturus est ad finem itsum quem promisit (Aug. in Ps. 109), the way by which He will bring us unto that end which He hath promised, saith Augustine. For those that are justified, and by justification entitled to the Kingdom of Heaven, they are to go in the way of sanctification towards their glorification, Eph. 2:10; good works therefore, though they be not the cause of reigning yet they are the way to the Kingdom. Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14. I conclude with Bernard (De Gratia et Libero Arbitrio) that good works are… of our secret predestination, presages of our future happiness, the way to the Kingdom, but not the cause of our obtaining that Kingdom. For howsoever good works are necessary in many respects, as I have showed, necessitate presentiae; yet they are not necessary necessitate efficientiae, as causes of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London, 1633) Book 7, ‘Concerning Good Works’ | Ch. 1 – To avoid Popish calumniations, it is shewed, that we doe hold the necessity of good works, and do urge the same by better arguments than the Popish religion doth afford.</span></figcaption>

<blockquote><p>What is the end of our Justification? … Lastly, that we ourselves might be bettered and made righteous. Gal. 2:17, “If then while we seek to be made righteous by Christ, we ourselves are found sinners, is Christ therefore the minister of sin? God forbid.” For to this end are we justified by faith through Christ, that the old man being abolished by the power and efficacy of Christ crucified, Christ might live in us and that we should by our study and labor endeavor to bring forth good works, [and] show ourselves thankful to God for so great a benefit. And therefore it is that the apostle Paul almost in all his epistles derives the doctrine of sanctification, or good works, from the doctrine of faith or justification as the cause from the effect, or the necessary consequent from the antecedent. What are the adjuncts of Justification? … For saiys Augustine, good works do follow a man already justified, and do not go before a man that is to be justified, as good fruits are not before a good tree… The works accompanying or following it are… Moreover the adopting of us to be sons of God, our sanctification or newness of life, the fruits whereof are described, Gal. 5:22. For they that are made partakers of Christ through faith, they do with Him receive the Holy Ghost, the author of all holiness; from whence it is, that these two benefits are indeed distinguished one from another, but yet so linked together by an unseparable bond that they can never be plucked asunder; and the latter is the testimony of the former, both in the soul of the faithful man himself and to other men also.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-488e797d7c" data-kw="">
<blockquote><p>The more natural and simple the wine is, the more pure it is; mixtures do but adulterate it. The more simple the worship of God is — I speak of gospel simplicity and order — the more pure it is; human inventions and mixtures may abase it, they cannot adorn it. God’s altar under the law must be of earth; ‘If thou lift up a tool upon it, thou hast polluted it,’ Exod. xx. 24, 25. Men are apt to think, that by lifting up tools on God’s altar they polish it, but God himself saith they pollute it.

When the church was in her infancy, she was dressed in the swaddling clothes of ceremonies; but since she is grown up, God hath provided her other attire. To the Jews, the Sun of righteousness was behind, and therefore the shadow of those ceremonies was before. They were in force and power; but to us Gentiles the Sun of righteousness is before, and therefore the shadow of ceremonies is behind. When Christ came, those shadows seemed to say, as the angels to Jacob, ‘Let us go, for the day breaketh,’ Gen. xxxii. 26; at the death of Christ the veil of the temple was rent in twain from the top to the bottom, to acquaint us that the Jewish ceremonies must then vanish, Mat. xxvii. 51.

Reader, I would not be mistaken; I do not advise thee against that order and decency which is commanded in the worship of God, nor against active obedience to authority in things that are circumstantial, or not directly nor consequentially forbidden in Scripture, but I would counsel thee to beware, lest, like the dog in the fable, whilst thou art snapping at any shadow, thou dost not lose the substance; and withal I must tell thee, that as when the shadows grow long, it is a sign the sun is declining, so when those shadows, those even indifferent things increase, usually the substance, the light of holiness, decreaseth.

When corn runs out into straw and chaff, those that feed on it may well be thin and lean; but when it runs into ear and kernel, thou mayest expect such as eat of it to be fat and well-favoured: when religion runs into formalities and ceremonies, her followers can never be thriving spiritually — they may starve, for all the gaudy flowers wherewith the several dishes on her table are decked and set forth; it is the power of godliness alone, which, like wholesome and substantial food, will distribute nourishment and strength to the inner man.

I expect nourishment from bread, not from straw or stones, because God hath annexed his blessing to the former, not to the latter. I look for spiritual strength from divine institutions, not from human inventions, because God’s promise is made to word-worship, not to will-worship. One would think the sparks of that fire wherewith Aaron’s sons were consumed should fly in the faces of men, and make them afraid to offer up to the Lord what he commanded them not, Lev. x. 1, 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 81-82.</span></figcaption>

</figure><figure class="quote" id="q-17093b9caa" data-kw="">
<blockquote><p>Before we go further we must take it as clear, that by Scriptures, Christ and his Apostles do mean the Word of God written. Our enquiry is, What written word?

Not the Original Copy, for that was in the Ark, and there only, and not to be seen of every body, if of any body, but the high Priest: and I know nothing but those Tables perished with the Temple. Nor can it be, that when he did call upon them to search the Scriptures he did send them to the Ark, which then was not. I doubt not but he meant by the Scriptures, the writings of Moses &amp; the Prophets.

Now who can think that Christ and his Apostles did turn over the Church and people of God to the Scriptures written by Moses and the Prophets own hands? those were not then extant, nor when extant to be seen of every body. What then? when he bade them search the Scriptures, he must needs mean some transcribed Copies, or some Translations For Copies in the Hebrew, I doubt me whether the common people did then understand the Hebrew, and amongst the Bereans, who did search the Scriptures, I think it past question, that there were many ordinary people, and perhaps Coblers or Taylors, or such, as Dr J. Rainolds seems to judge

If this be granted that those who were commanded to search the Scriptures, and commended for searching the Scriptures, did not, could not search the Original Hebrew, what shall we think then? No other can be imagined but some Translations, which they did understand, Syriac, Chaldee, but chiefly the Greek Translation, which the most, if not all, understood.

But you will say, the Translators were subject to mistake, and err, or worse, being no Prophets; and if they did understand the Hebrew, yet sith they could not come by the first Original Copy, they must needs have recourse to some transcribed Copies. Whether the Church were to repair to Translations, or to transcribed Copies, all comes to one, sith neither Transcribers nor Translators were Prophets. Very good men let them be, yet men they were, and subject to error.

May I speak my Opinion, I think when Christ said search the Scriptures, he meant the Scriptures translated into Greek, and by Scriptures, the Apostles meant the Greek Translation, which tongue, if not in Christ’s time, yet in the Apostles times in a manner all did understand. Wherefore when the Apostle saith (is given by inspiration, and is profitable) he means it is profitable to be read, or heard read in the Greek Translation.

And the rather am I of this mind, because Scholars do know that the New Testament doth cite the places out of the Old Testament according to the Greek Translation, and most an end are very punctual in it. However, whither we look on Translations, or Transcription, sith the first Table written by God himself was lost with the Temple, and the Original Greek Copy of the Translation of the Old Testament was, the Learned think, (and I think they think well in it) burned by Julius Caesar’s Army, when they fired Alexandria, and the famous Library there.

The Ephesians were built on the Prophets and Apostles; the Apostles they had with them, but the Prophets were dead and gone; Malachi was the last; the Apostles they might consult with and they had their writings, but for the writings of the Prophets, the Ephesians being Gentiles (I take it for granted) understood not the Hebrew, at least the body of them, but being Grecians, they might and did understand the Greek translation, which I doubt not was purer then, then it is now: yet then being but a translation, and the Original it self but carried up and down in transcribed Copies, it is consented unto by all parties, that the Translators and Transcribers might err, being not Prophets, nor endued with that infallible spirit in translating, or transcribing, as Moses and the Prophets were in their Original writings.

The tentation lies on this side, how the Ephesians then, and much more sith there are no Prophets, no Apostles, no nor any infallible spirits in the Church, how can we build on the foundation of the Prophets and Apostles now, sith the Scriptures in their translated Copies are not free from all possible corruptions, in the Copies we have either by transcribers or translators.

Besides, many are unlearned, and cannot read a Letter. For these last, though they cannot read, yet they can hear it read to them. Do not we see many blind men in Schools come to great learning by hearing others read Philosophy, and Divinity, and the body of other Arts &amp; Sciences to them? &amp; so it is with the Scriptures, they cannot read them, but they can hear them read &amp; preached by others.

Dr. Jackson in his first book of his Commentaries on the Creed, and Mr. John Goodwin in a set and large Treatise to justify the authority of the Scriptures, have shewed much learning, and taken great pains in this Argument. But like two Elephants, they both swim so deep, that the benefit and comfort of it can reach but to a few, we must fight lower and in a briefer way (least we wear the Reader and charge the Printer) and set down the brief of the matter in it, so that common people, and men of ordinary brains, (who are most subject to Tentation) may find a way to spell out the right of this, how faith can be had, and the soul built on the foundation of the Prophets and Apostles, sith this foundation was in their Writings, and their Writings are under no other notion to any, but either the Original transcribed or translated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-capel.html">Richard Capel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Capel’s remains being an useful appendix to his excellent Treatise of tentations, concerning the translations of the Holy Scriptures: left written with his own hand. By that incomparably learned and judicious divine, Mr. Richard Capel, sometimes fellow of Magdalen-College in Oxford; with a preface p</cite>, (London: John Bartlet, 1658), pp 7-15.</span></figcaption>

— Richard Capel, Capel’s remains being an useful appendix to his excellent Treatise of tentations, concerning the translations of the Holy Scriptures: left written with his own hand. By that incomparably learned and judicious divine, Mr. Richard Capel, sometimes fellow of Magdalen-College in Oxford; with a preface p, (London: John Bartlet, 1658), pp 7-15.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBefore+we+go+further+we+must+take+it+as+clear%2C+that+by+Scriptures%2C+Christ+and+his+Apostles+do+mean+the+Word+of+God+written.+Our+enquiry+is%2C+What+written+word%3F%0A%0ANot+the+Original+Copy%2C+for+that+was+in+the+Ark%2C+and+there+only%2C+and+not+to+be+seen+of+every+body%2C+if+of+any+body%2C+but+the+high+Priest%3A+and+I+know+nothing+but+those+Tables+perished+with+the+Temple.+Nor+can+it+be%2C+that+when+he+did+call+upon+them+to+search+the+Scriptures+he+did+send+them+to+the+Ark%2C+which+then+was+not.+I+doubt+not+but+he+meant+by+the+Scriptures%2C+the+writings+of+Moses+%26+the+Prophets.%0A%0ANow+who+can+think+that+Christ+and+his+Apostles+did+turn+over+the+Church+and+people+of+God+to+the+Scriptures+written+by+Moses+and+the+Prophets+own+hands%3F+those+were+not+then+extant%2C+nor+when+extant+to+be+seen+of+every+body.+What+then%3F+when+he+bade+them+search+the+Scriptures%2C+he+must+needs+mean+some+transcribed+Copies%2C+or+some+Translations+For+Copies+in+the+Hebrew%2C+I+doubt+me+whether+the+common+people+did+then+understand+the+Hebrew%2C+and+amongst+the+Bereans%2C+who+did+search+the+Scriptures%2C+I+think+it+past+question%2C+that+there+were+many+ordinary+people%2C+and+perhaps+Coblers+or+Taylors%2C+or+such%2C+as+Dr+J.+Rainolds+seems+to+judge%0A%0AIf+this+be+granted+that+those+who+were+commanded+to+search+the+Scriptures%2C+and+commended+for+searching+the+Scriptures%2C+did+not%2C+could+not+search+the+Original+Hebrew%2C+what+shall+we+think+then%3F+No+other+can+be+imagined+but+some+Translations%2C+which+they+did+understand%2C+Syriac%2C+Chaldee%2C+but+chiefly+the+Greek+Translation%2C+which+the+most%2C+if+not+all%2C+understood.%0A%0ABut+you+will+say%2C+the+Translators+were+subject+to+mistake%2C+and+err%2C+or+worse%2C+being+no+Prophets%3B+and+if+they+did+understand+the+Hebrew%2C+yet+sith+they+could+not+come+by+the+first+Original+Copy%2C+they+must+needs+have+recourse+to+some+transcribed+Copies.+Whether+the+Church+were+to+repair+to+Translations%2C+or+to+transcribed+Copies%2C+all+comes+to+one%2C+sith+neither+Transcribers+nor+Translators+were+Prophets.+Very+good+men+let+them+be%2C+yet+men+they+were%2C+and+subject+to+error.%0A%0AMay+I+speak+my+Opinion%2C+I+think+when+Christ+said+search+the+Scriptures%2C+he+meant+the+Scriptures+translated+into+Greek%2C+and+by+Scriptures%2C+the+Apostles+meant+the+Greek+Translation%2C+which+tongue%2C+if+not+in+Christ%E2%80%99s+time%2C+yet+in+the+Apostles+times+in+a+manner+all+did+understand.+Wherefore+when+the+Apostle+saith+%28is+given+by+inspiration%2C+and+is+profitable%29+he+means+it+is+profitable+to+be+read%2C+or+heard+read+in+the+Greek+Translation.%0A%0AAnd+the+rather+am+I+of+this+mind%2C+because+Scholars+do+know+that+the+New+Testament+doth+cite+the+places+out+of+the+Old+Testament+according+to+the+Greek+Translation%2C+and+most+an+end+are+very+punctual+in+it.+However%2C+whither+we+look+on+Translations%2C+or+Transcription%2C+sith+the+first+Table+written+by+God+himself+was+lost+with+the+Temple%2C+and+the+Original+Greek+Copy+of+the+Translation+of+the+Old+Testament+was%2C+the+Learned+think%2C+%28and+I+think+they+think+well+in+it%29+burned+by+Julius+Caesar%E2%80%99s+Army%2C+when+they+fired+Alexandria%2C+and+the+famous+Library+there.%0A%0AThe+Ephesians+were+built+on+the+Prophets+and+Apostles%3B+the+Apostles+they+had+with+them%2C+but+the+Prophets+were+dead+and+gone%3B+Malachi+was+the+last%3B+the+Apostles+they+might+consult+with+and+they+had+their+writings%2C+but+for+the+writings+of+the+Prophets%2C+the+Ephesians+being+Gentiles+%28I+take+it+for+granted%29+understood+not+the+Hebrew%2C+at+least+the+body+of+them%2C+but+being+Grecians%2C+they+might+and+did+understand+the+Greek+translation%2C+which+I+doubt+not+was+purer+then%2C+then+it+is+now%3A+yet+then+being+but+a+translation%2C+and+the+Original+it+self+but+carried+up+and+down+in+transcribed+Copies%2C+it+is+consented+unto+by+all+parties%2C+that+the+Translators+and+Transcribers+might+err%2C+being+not+Prophets%2C+nor+endued+with+that+infallible+spirit+in+translating%2C+or+transcribing%2C+as+Moses+and+the+Prophets+were+in+their+Original+writings.%0A%0AThe+tentation+lies+on+this+side%2C+how+the+Ephesians+then%2C+and+much+more+sith+there+are+no+Prophets%2C+no+Apostles%2C+no+nor+any+infallible+spirits+in+the+Church%2C+how+can+we+build+on+the+foundation+of+the+Prophets+and+Apostles+now%2C+sith+the+Scriptures+in+their+translated+Copies+are+not+free+from+all+possible+corruptions%2C+in+the+Copies+we+have+either+by+transcribers+or+translators.%0A%0ABesides%2C+many+are+unlearned%2C+and+cannot+read+a+Letter.+For+these+last%2C+though+they+cannot+read%2C+yet+they+can+hear+it+read+to+them.+Do+not+we+see+many+blind+men+in+Schools+come+to+great+learning+by+hearing+others+read+Philosophy%2C+and+Divinity%2C+and+the+body+of+other+Arts+%26+Sciences+to+them%3F+%26+so+it+is+with+the+Scriptures%2C+they+cannot+read+them%2C+but+they+can+hear+them+read+%26+preached+by+others.%0A%0ADr.+Jackson+in+his+first+book+of+his+Commentaries+on+the+Creed%2C+and+Mr.+John+Goodwin+in+a+set+and+large+Treatise+to+justify+the+authority+of+the+Scriptures%2C+have+shewed+much+learning%2C+and+taken+great+pains+in+this+Argument.+But+like+two+Elephants%2C+they+both+swim+so+deep%2C+that+the+benefit+and+comfort+of+it+can+reach+but+to+a+few%2C+we+must+fight+lower+and+in+a+briefer+way+%28least+we+wear+the+Reader+and+charge+the+Printer%29+and+set+down+the+brief+of+the+matter+in+it%2C+so+that+common+people%2C+and+men+of+ordinary+brains%2C+%28who+are+most+subject+to+Tentation%29+may+find+a+way+to+spell+out+the+right+of+this%2C+how+faith+can+be+had%2C+and+the+soul+built+on+the+foundation+of+the+Prophets+and+Apostles%2C+sith+this+foundation+was+in+their+Writings%2C+and+their+Writings+are+under+no+other+notion+to+any%2C+but+either+the+Original+transcribed+or+translated.%E2%80%9D%0A%0A%E2%80%94+Richard+Capel%2C+Capel%E2%80%99s+remains+being+an+useful+appendix+to+his+excellent+Treatise+of+tentations%2C+concerning+the+translations+of+the+Holy+Scriptures%3A+left+written+with+his+own+hand.+By+that+incomparably+learned+and+judicious+divine%2C+Mr.+Richard+Capel%2C+sometimes+fellow+of+Magdalen-College+in+Oxford%3B+with+a+preface+p%2C+%28London%3A+John+Bartlet%2C+1658%29%2C+pp+7-15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17093b9caa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17093b9caa.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/12/02/richard-capel-on-reading-scripture-in-its-transcriptions-and-translations/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-712e5cf219" data-kw="">
<blockquote><p>I take it we are not denied to rejoice and solace ourselues upon this day. For to some men, at some times, recreation may be more necessary than meat, in case of weakness, for present preservation of health. And though not in that regard, yet being well used, it may be a furtherance to men, in the performance of the duties of godliness, as well as in the duties of their calling. But this rejoicing must be such as was the rejoicing of the Jews, Neh. 8:12, which was only spiritual, and in the Lord. For they reioyced only for this, that they understood the law of God that was taught them. But as for the recreations and pastimes aforenamed, as bowling and such like, they are not at this time to be used…</p></blockquote>

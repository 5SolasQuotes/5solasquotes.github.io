<main class="wrap"><figure class="quote" id="q-ca05713a28" data-kw="">
<blockquote><p>According to his usual manner he added the opposite clause, that we may know that faith in Christ and knowledge of him are vainly pretended, except there be newness of life. For Christ is never dormant where he reigns, but the Spirit renders effectual his power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 3:6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/sanctification-and-justification.html">Sanctification and Justification</a> › <a href="../topics/sanctification/sanctification-and-justification/distinct-but-inseparable.html">Distinct but inseparable</a></span><span class="t"><a href="../topics/justification/justification-and-sanctification-distinguished.html">Justification and Sanctification Distinguished</a> › <a href="../topics/justification/justification-and-sanctification-distinguished/distinguished-but-inseparable.html">Distinguished but inseparable</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a5833f0a1f" data-kw="">
<blockquote><p>Would ye then obtain justification in Christ? You must previously possess Christ. But you cannot possess him without being made a partaker of his sanctification: for Christ cannot be divided. Since the Lord, therefore, does not grant us the enjoyment of these blessings without bestowing himself, he bestows both at once but never the one without the other. Thus it appears how true it is that we are justified not without, and yet not by works, since in the participation of Christ, by which we are justified, is contained not less sanctification than justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.16.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-sanctification-distinguished.html">Justification and Sanctification Distinguished</a> › <a href="../topics/justification/justification-and-sanctification-distinguished/distinguished-but-inseparable.html">Distinguished but inseparable</a></span><span class="t"><a href="../topics/union-with-christ/union-and-justification-sanctification.html">Union and Justification / Sanctification</a> › <a href="../topics/union-with-christ/union-and-justification-sanctification/both-flow-from-union.html">Both flow from union</a></span><span class="t"><a href="../topics/sanctification/sanctification-and-justification.html">Sanctification and Justification</a> › <a href="../topics/sanctification/sanctification-and-justification/distinct-but-inseparable.html">Distinct but inseparable</a></span></div>

</figure><figure class="quote" id="q-711baca51c" data-kw="">
<blockquote><p>His grace, therefore, necessarily brings along with it &quot;newness of life,&quot; (Rom 6:4,) because they who still are the slaves of sin make void the blessing of redemption; but now we are released from the bondage of sin, in order that we may serve the righteousness of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to Timothy, Titus, and Philemon</cite>, Titus 2:14</span></figcaption>

</figure><figure class="quote" id="q-3bb240ac05" data-kw="">
<blockquote><p>This, also, is a passage worthy of observation, as shewing that a gratuitous righteousness is not conferred upon us in Christ, without our being at the same time regenerated by the Spirit to the obedience of righteousness, as he teaches us elsewhere, that Christ is made to us righteousness and sanctification. (1Co 1:30.) The former we obtain by a gratuitous acceptance; and the latter by the gift of the Holy Spirit, when we are made new creatures. There is however an inseparable connection between these two blessings of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Philippians, Colossians, and Thessalonians</cite>, Colossians 1:22</span></figcaption>

</figure><figure class="quote" id="q-120097347c" data-kw="">
<blockquote><p>The state of the case is really this, — that the faithful are never reconciled to God without the gift of regeneration; nay, we are for this end justified, — that we may afterwards serve God in holiness of life. Christ indeed does not cleanse us by his blood, nor render God propitious to us by his expiation, in any other way than by making us partakers of his Spirit, who renews us to a holy life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 6:2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ae38a93a6e" data-kw="">
<blockquote><p>The duties required in the ninth commandment are… appearing and standing for the truth;[d] and from the heart,[e] sincerely,[f] freely,[g] clearly,[h] and fully,[i]… a charitable esteem of our neighbours;[m]… defending their innocency;[r] a ready receiving of a good report,[s] and unwillingness to admit of an evil report,[t] concerning them; discouraging… flatterers,[w]… love and care of our own good name, and defending it when need requireth;[y]… studying and practising of whatsoever things are true, honest, lovely, and of good report.[a] [d] Prov. 31:8,9. [e] Ps. 15:2. [f] 2 Chron. 19:9. [g] 1 Sam. 19:4,5. [h] Josh. 7:19. [i] 2 Sam. 14:18-20. [m] Heb. 6:9. 1 Cor. 13:7. [r] 1 Sam. 22:14. [s] 1 Cor. 13:6,7. [t] Ps. 15:3. [w] Prov. 26:24,25. [y] Prov. 22:1. John 8:49. [a] Phil. 4:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite>, #144</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1f77942e65" data-kw="">
<blockquote><p>Virtue consists in a mediocrity. Omne quod est nimium vertitur in vitium. A rigid severity may mar all. “Let your moderation, το ετιεκες , be known to all men,” Phil. 4:5; prefer equity before extremity: utmost right may be utmost wrong. He is righteous over much that will remit nothing of his right, but exercise great censures for light offences; this is, as one said, to kill a fly upon a man’s forehead with a beetle. Justice, if not mixed with mercy, degenerates into cruelty. Again, he is righteous more than is meet that makes sins where God has made none, as those superstitiostdi of old, and the Papists to this day do with their, “Touch not, taste not, handle not: which things have indeed a show of wisdom in will worship,” etc. Col. 2:21-23. Will worshippers are usually over wise, i.e., overweening, and also too well conceited of their own wisdom and worth. Hence it is that they cannot do, but they must overdo, till “wearied in the greatness of their way,” Isa. 57:10, they see and say that it had been best to have held the king’s highway, chalked out unto them by the “royal law,” Jam 2:8, that “perfect law of liberty.” Jam. 1:25. Via regis temperata est, nec plus in se habens, nec minus; the middle way is the way of God, neither having too much, nor yet too little. True it is, says the heathen orator, that nemo pius est qui pistatem caret, no man is godly, that is afraid of being so. But then it is no less true, and the same author speaks it, Modum esse religionis, nimium esse superstitiosum non oportere; that there is a reason in being religious, and that men must see they be not superstitious. Solomon says that he that wrings his nose overhard, brings blood out of it. Pliny says he that tills his land too much, does it to his loss. Apelles said those painters were to blame, qui non sentirent quid esset satis, that could not see when they had done sufficient. It is reported of the river Nile that if it either exceed or be defective in its due overflowings of the land of Egypt, it causes famine. The planet Jupiter, situated between cold Saturn and hot Mars, Ex utroque temperatus est, et saluteris, says Pliny, partakes of both, and is benign and wholesome to the sublunary creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ecclesiastes</cite>, 7, v. 16</span></figcaption>

</figure><figure class="quote" id="q-caf43006e7" data-kw="">

<div class="meta"><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

</figure><figure class="quote" id="q-187d739753" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more. Christ was not strict enough for the Pharisees, in keeping the Sabbath, nor in his company, nor in his diet. Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it. If he cannot destroy zeal, by scorning it and quenching it; he will try to do it by overheating and distempering it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 57, p. 270</span></figcaption>

</figure><figure class="quote" id="q-14cb1660d5" data-kw="">
<blockquote><p>For besides the consideration of pride, spiritual pride…. what is it but ‘calling evil good and good evil; putting darkness for light and light for darkness; putting bitter for sweet, and sweet for bitter?’ Isa. 5:20. Excesses and extremes, which are always vices, being extolled and recommended as the perfection of virtue? But the most dangerous circumstance is this, that such persons are of all the most difficult to be reclaimed from their errors and vices… In their own imagination their errors are the height of wisdom, and their sins and vices the most perfect virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-trapp.html">Joseph Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nature, Folly, Sin &amp; Danger of Being Righteous Over-Much, with a particular view to the doctrines and practices of certain modern Enthusiasts, being the substance of four discourses</cite>, … 3rd ed. (London: Austen, 1739) 69 pp. on Eccl. 7:16, p. 33</span></figcaption>

<blockquote><p>These Things were so plain to the Jews in the Old Testament, that they made no question but that in the New Testament the Children should be admitted as the Parents were: Therefore you read little of the Baptism of the Infants; but it was clear, that if the Fathers and their Seed were then received into the Covenant by the Seal of Circumcision, (Col. ii. 11, 12.) then in the New Testament the were to be received by the Seal of Baptism; so that in the New Testament you read of nothing but of the joining and gluing to the Church; and as Man and Wife were joined by Marriage Covenant, so were they joined together by Covenant in Church-Fellowship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government and Discipline of the Churches of Christ, set down by way of Questions and Answers, with an Explanation and Application of the same</cite>, (London: John Clark, 1722), p. 23.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85a0b5f475" data-kw="">
<blockquote><p>LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 435 Latin</span></figcaption>

</figure><figure class="quote" id="q-14dc9f6d20" data-kw="">
<blockquote><p>But where I added, that in the name of Jesus Christ we baptize, though I said no more than the Scripture says [i.e. Acts 2:38; 8:12,16; 19:5], yet he [Mr. Hussey] is pleased to object against me… I cited plain texts to prove that baptism is done in the name of Christ… But how does baptizing in the name of Christ, as Mediator, agree with the commission to baptize in the name of the Father, Son and Holy Ghost?… First, I say, the question is of things or actions, not of words. Mr. Hussey (it seems) did apprehend my meaning, as if I had intended an expression to be made in the act of baptizing, thus: ‘I baptize thee in the name of Jesus Christ.’ But [on the contrary] I speak of the action, not of the expression, even as in another instance I gave: our assembling together is in the name of Christ, though we do not say in terminis [in the very terms], ‘We are now assembled in the name of Christ.’ In baptism Christ does not command us to say either these words, ‘I baptize thee in the name of Christ;’ or these, ‘I baptize thee in the name of the Father, Son and Holy Ghost:’ but we are commanded to do the thing, both in the name of Christ as Mediator, and in the name of the Father, Son and Holy Ghost; but in different respects. A minister of Christ does both preach and baptize in the name of Christ, as Mediator; that is, vice Christi, in Christ’s stead [see 2 Cor. 5:20], and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our commission to preach and baptize, by Mr. Hussey’s confession. So that to preach and baptize epi to onomati Iesou Christou [in the name of Jesus Christ] (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38), comprehends a formal commission, power and authority, given and derived from Christ. I say not that it comprehends no more, but this it does comprehend. But when Christ bids us baptize eis ta onoma, ‘unto’, or ‘into’, or ‘in the name’ of the Father, Son and Holy Ghost, Mt. 28:19, this does relate to the end and effect of baptism, or the good of the baptized (if we understand the words properly), not the authority of the baptizer, as if a formal commission were there given him from the Father, Son and Holy Ghost. So that to baptize on ‘in’ or ‘unto’ the name of the Father, Son and Holy Ghost, is properly meant both of sealing the parties’ right and title to the enjoyment of God Himself, as their God by covenant, and their interest in the love of God, the grace of Christ, and of the communion of the Holy Ghost; and of dedicating the party to the knowledge, profession, faith, love, and obedience of God the Father, Son and Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, p. 110-111</span></figcaption>

<blockquote><p>As concerning children, we cannot bind all to the same measure of age. For there are some in whom spiritual knowledge, study and zeal for piety, and grave and well-ordered morals supply the defect of years. Yet it is not in the least to be approved that each and all alike, after the age of fourteen, initiated with the sacrament of confirmation (according to the Papists)… are received to communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, 6th Question, ‘Is the Supper to be Granted to Infants, or to Children?’ [No] in Ecclesiastical Politics, vol. 1, book 2, tract 2, section 4, ch. 3, pp. 757-58 trans. Charles Johnson</span></figcaption>

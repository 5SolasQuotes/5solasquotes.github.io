<main class="wrap"><figure class="quote" id="q-93c2c65903" data-kw="">
<blockquote><p>Hence, (7) it is said that those born of God cannot sin (1 John 3:9; 5:18), namely unto death (1 John 5:16), because by the grace of God, before death they are certainly restored (Ps. 37:24; Prov. 24:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 5, bk. 6, ch. 9, sect. 18, p. 213</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hence, (7) it is said that those born of God cannot sin (1 John 3:9; 5:18), namely unto death (1 John 5:16), because by the grace of God, before death they are certainly restored (Ps. 37:24; Prov. 24:16).”

— Petrus van Mastricht, Theoretical-Practical Theology (RHB), vol. 5, bk. 6, ch. 9, sect. 18, p. 213">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%2C+%287%29+it+is+said+that+those+born+of+God+cannot+sin+%281+John+3%3A9%3B+5%3A18%29%2C+namely+unto+death+%281+John+5%3A16%29%2C+because+by+the+grace+of+God%2C+before+death+they+are+certainly+restored+%28Ps.+37%3A24%3B+Prov.+24%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology+%28RHB%29%2C+vol.+5%2C+bk.+6%2C+ch.+9%2C+sect.+18%2C+p.+213&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F93c2c65903.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/93c2c65903.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=Hence%2C%20%287%29%20it%20is%20said%20that,certainly%20restored%20%28Ps.%2037%3A24%3B%20Prov.%2024%3A16&amp;text=Hence%2C%20%287%29%20it%20is%20said%20that%20those%20born&amp;text=they%20are%20certainly%20restored%20%28Ps.%2037%3A24%3B%20Prov.%2024%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24e5cfd6bc" data-kw="">
<blockquote><p>He does not forbid the faithful to pray for such (Estius, similarly Hammond), but unto that he does not venture to urge them, that is, that they might pray for them with the confidence of obtaining (Estius); that is to say, I do not venture to create a certain hope of obtaining (Menochius). I do not command prayers to be poured out for them (Grotius, thus Hammond), for there is no promise upon which such prayers might depend. Here you have the mystical sense of the passages in Jer. 7:16 and Eze. 14:14 (Grotius).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole</cite>, vol. 79, 1, 2, and 3 John, Jude (d. 1679; VA: Master Poole Publishing, 2013), on 1 John 5:16, p. 171</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“He does not forbid the faithful to pray for such (Estius, similarly Hammond), but unto that he does not venture to urge them, that is, that they might pray for them with the confidence of obtaining (Estius); that is to say, I do not venture to create a certain hope of obtaining (Menochius). I do not command prayers to be poured out for them (Grotius, thus Hammond), for there is no promise upon which such prayers might depend. Here you have the mystical sense of the passages in Jer. 7:16 and Eze. 14:14 (Grotius).”

</figure><figure class="quote" id="q-e445dc279b" data-kw="">
<blockquote><p>‘To bind’ is to denounce God’s wrath against impenitent sinners. ‘To loose’ is to pronounce remission of sins to repentant sinners; both which have certain degrees. The degrees of binding are:

1. A severe exhortation and commination, after private admonitions have been rejected; this must be done by the presbytery. (Mt. 18:15-17)

2. A keeping off from the Lord’s Supper. (Mt. 7:6)

3. The greater excommunication, by which the sinner is cast out of the Church, yet not without hope of pardon and return, if he repent. (1 Cor. 5:5)

4. Anathema, or in the Syriac word, Maran-atha, when he is cast out without hope. (1 Cor. 16:22; 1 Jn. 5:16)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, ... (d. 1629; London: Mab, 1650), bk. 1, ch. 26, ‘Of the outward administration of the Church,’, p. 177</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

</figure><figure class="quote" id="q-bd504a1b3e" data-kw="">
<blockquote><p>I shall not go about to define or circumscribe exactly the bounds wherein to conclude wilful sinning: I shall not confine this evil spirit with any circle: because I would have every one to look well about, lest the case be his own…</p></blockquote>

</figure><figure class="quote" id="q-0a171f73ca" data-kw="">
<blockquote><p>If any man see his brother fall into and continue in such a sin as may be capable of forgiveness, let him earnestly sue unto God, for pardon of that offender; and God, who is great, and infinite in mercy, shall graciously incline his ear to his prayers, give remission and life to such an one. There is indeed a sin unto death, for which there is no forgiveness with God, because there is no capacity of repentance for it in the committer of it; I mean the sin against the Holy Ghost, when a man, having received the knowledge of the Gospel by the illumination of the Holy Spirit, and [has] professed the belief thereof, shall, in a devilish malice, wilfully blaspheme and persecute that known truth: I do not give you allowance to pray for the pardon of this sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain &amp; Familiar Explication</cite>, (d. 1656), vol. 2, on 1 Jn., 5:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

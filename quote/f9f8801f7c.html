<main class="wrap"><figure class="quote" id="q-f9f8801f7c" data-kw="">
<blockquote><p>This offence was plagued with most sharp punishment even in the beginning almost, and as soon as the world was created. Pharao [sic], the king of Egypt, commanded Sara, Abraham’s wife, to be taken away and carried to his palace, that he might use her as his wife; thinking verily that she had been Abraham’s sister. But the scripture saith, “The Lord vexed Pharaoh and all his house with great plagues, because of Sara, Abraham’s wife.” Lo, here the king of Egypt is punished with grievous plagues for his adultery; and yet he knew not that Sara was Abraham’s wife: how great plagues therefore are prepared for the men that wittingly and willingly, without all shame, commit adultery! To Abimelech, king of the Philistines, the Lord doth say, “Lo, thou shalt die, because of the woman which thou hast taken away from her husband.” And yet this king also had taken away Sara, not knowing that she was Abraham’s wife. Joseph, being provoked to adultery by his master’s wife, doth simply say, “How should I do this great wickedness, and sin against God?” Every woth doth bear some weight: for adultery is an heinous sin. Whereupon in the book of Job we find these words of Job himself: “If mine heart have been deceived by a woman, or I have laid wait at my neighbour’s door; then let my wife be another man’s harlot, and let other men have to do with her. For this is a wickedness and sin that is worthy to be judged to death: yea, it is a fire that utterly should consume and root out all mine increase.” [Job 31] Job saith that he hath not only not committed adultery to defile another man’s wife. He confesseth that adultery is a sin, and so grievous an offence, that it doth deserve to have the adulterer’s wife to be defiled with adultery. He addeth that adultery is a fire that utterly consumeth and devoureth all things; and, lastly, that it is a sin to be judged, and punished with death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 410-11.</span></figcaption>

<blockquote><p>7th Conclusion. When the representative Church is universally apostatical, then may the prince use the help of the Church-essential of found believers, for a reformation; and if they also be apostatic (which cannot be, except the Lord utterly have removed his candlestick) we see not what he can do but hear witness against them, but if there be any secret seeker of God in whose persons the essence of a true Church is conserved. The king by a royal power, and the law of charity is obliged to reform the land, as the godly kings with a blessed success have hitherto done, Asa, Josiah, Jehoshaphat, in which case the power of reformation and of performing many acts, of due belonging to the Church officers, are warrantably performed by the king, as in a diseased body, in an extraordinary manner power recurs from the members to the politic head and Christian prince, who both, as a King, in an authoritative way is obliged to do more then ordinary, and as a Christian member of the Church, in a charitative and common way, is to care for the whole body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 419</span></figcaption>

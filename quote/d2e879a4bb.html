<main class="wrap"><figure class="quote" id="q-d2e879a4bb" data-kw="">
<blockquote><p>Secondly, infirmities be either general, or personal; general, which appertain to the whole nature of man, and are to be found in every man that comes of Adam: as to be born unlearned, and subject to natural affections, as sorrow, anger, etc. Personal, are such as appertain to some particular men, and not to all, and arise of some private causes and particular judgments of God, as to be born a fool, to be sick of an ague, consumption, dropsy, pleuresy, and such like diseases. Now the first sort be in Christ, and not the second: for as He took not the person of any man, but only man’s nature, so was it sufficient for Him to take unto Him the infirmities of man’s nature, though He took not the private infirmities of any man’s person. And the reason why Christ would put on not only the substance and faculties of a true man, but also his infirmities, was that He might show Himself to be very man indeed, also that He might suffer for us both in body and soul, and that he might give us an example of patience in bearing all manner of evil for God’s glory and the good of our neighbor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (Cambridge, 1595), p. 152</span></figcaption>

</figure><figure class="quote" id="q-c52fb8e7b4" data-kw="">
<blockquote><p>I… The occasion for this calumny [by Romanists] is taken from Calvin’s words in Mt. 26, found in his Harmony of the Gospels. There, Calvin, writing about Christ’s prayer, “My Father, if it is possible, let this cup pass from me; yet not as I will, but as you will,” includes these words among others: ‘He was struck with fear and constricted by anxiety, so that it was necessary for him to vacillate, as it were, with alternating prayers amidst the violent waves of temptations. This is the reason why, having prayed for the cup to pass, He immediately reins Himself in, and submitting his prayer to the Father’s command, He chastises and recalls the request that had just slipped out. And there, He says, ‘This was not a deliberate prayer of Christ, but the force and sudden impulse of grief extorted the words, to which correction was immediately added; the same vehemence also took away the immediate memory of the heavenly decree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), on the Impeccability of Christ, p. 570 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>
<div class="actions"><button class="copy" data-copy="“I… The occasion for this calumny [by Romanists] is taken from Calvin’s words in Mt. 26, found in his Harmony of the Gospels. There, Calvin, writing about Christ’s prayer, “My Father, if it is possible, let this cup pass from me; yet not as I will, but as you will,” includes these words among others: ‘He was struck with fear and constricted by anxiety, so that it was necessary for him to vacillate, as it were, with alternating prayers amidst the violent waves of temptations. This is the reason why, having prayed for the cup to pass, He immediately reins Himself in, and submitting his prayer to the Father’s command, He chastises and recalls the request that had just slipped out. And there, He says, ‘This was not a deliberate prayer of Christ, but the force and sudden impulse of grief extorted the words, to which correction was immediately added; the same vehemence also took away the immediate memory of the heavenly decree.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), on the Impeccability of Christ, p. 570 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI%E2%80%A6+The+occasion+for+this+calumny+%5Bby+Romanists%5D+is+taken+from+Calvin%E2%80%99s+words+in+Mt.+26%2C+found+in+his+Harmony+of+the+Gospels.+There%2C+Calvin%2C+writing+about+Christ%E2%80%99s+prayer%2C+%E2%80%9CMy+Father%2C+if+it+is+possible%2C+let+this+cup+pass+from+me%3B+yet+not+as+I+will%2C+but+as+you+will%2C%E2%80%9D+includes+these+words+among+others%3A+%E2%80%98He+was+struck+with+fear+and+constricted+by+anxiety%2C+so+that+it+was+necessary+for+him+to+vacillate%2C+as+it+were%2C+with+alternating+prayers+amidst+the+violent+waves+of+temptations.+This+is+the+reason+why%2C+having+prayed+for+the+cup+to+pass%2C+He+immediately+reins+Himself+in%2C+and+submitting+his+prayer+to+the+Father%E2%80%99s+command%2C+He+chastises+and+recalls+the+request+that+had+just+slipped+out.+And+there%2C+He+says%2C+%E2%80%98This+was+not+a+deliberate+prayer+of+Christ%2C+but+the+force+and+sudden+impulse+of+grief+extorted+the+words%2C+to+which+correction+was+immediately+added%3B+the+same+vehemence+also+took+away+the+immediate+memory+of+the+heavenly+decree.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+on+the+Impeccability+of+Christ%2C+p.+570+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc52fb8e7b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c52fb8e7b4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-human-nature-of-christ/#:~:text=The%20occasion%20for%20this%20calumny%20%5Bby,i

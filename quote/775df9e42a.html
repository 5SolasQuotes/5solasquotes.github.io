<main class="wrap"><figure class="quote" id="q-775df9e42a" data-kw="">
<blockquote><p>There is no necessity that the reserve [of withholding of certain powers] be expressed in the covenant between king and people [as the Erastian, divine-right of kings advocates maintained], more than in contract of marriage between a husband and a wife, [that] beside her jointure, you should set down this clause in the contract, that if the husband attempt to kill the wife, or the wife the husband, in that case it shall be lawful to either of them to part companies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edin., 1843), p. 118</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>…for as the woman is independent in regard of intrinsic power of consenting or dissenting in point of marriage, the parents’ directive power of extrinsic commanding, as the judicious [congregationalist] Prefacers say… How are [ecclesiastical] leaders and overseers [according to congregationalism,] in the same managing of censures, equal in power, and not above those whom they lead and oversee, yea, to whom they are to yield obedience, as Mr. Hooker cites to that purpose the place Heb. 13:17? Are parents equal in power who do command the virgin, whose it is to consent to the marriage?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 3, pp. 309-10</span></figcaption>

</figure><figure class="quote" id="q-de54466b40" data-kw="">
<blockquote><p>Faith then is the hand and wheel which must frame a vessel for honor, prepared, as for all other, so for this work of marriage. And in truth, as it is all religion (upon point) so it is the marriage ring, which makes the soul one with the Lord; and this ring is beset with many rich jewels, all of them serving for the honor, that is, the well carrying and discharge of marriage duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matrimonial Honour</cite>, (1642), pp. 24-25</span></figcaption>

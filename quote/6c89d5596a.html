<blockquote><p>§66… There is a second thing unlawful also, and that is the misdetermining of those same modes and circumstances which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude: 1. That every misordering of such great affairs is the sin of them that do it. 2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is. §67. If the mischoosing of such circumstances by Church-governors be but an inconvenience and do not destroy the ordinance itself, or frustrate the ends of it, we are to obey: 1. For he is the judge in his own work, and not we: 2. the thing is not sinful, though inconvenient. 3. Obedience is commanded to our lawful governors… §68. But if a governor so misdetermine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to. As for example: If a governor make a new sacrament, I will not obey, because his command is null and the thing [is] simply evil. If he miscommand a circumstance of time or place, or gesture, I will consider the consequents. If he command the solemn assemblies to be held a mile or two or three from the people, I will obey him, if it be but as far as I can go without frustrating the work itself. But if he command us all to go ten miles or twenty miles to worship, I would obey for some time to avoid a greater evil, but ordinarily I would no more obey than if he forbade all Christian assemblies, for it comes all to one. So if he command the assemblies to be at break of day or after sun-setting, I would obey. But if he command that we assemble only at midnight, what should I do then? The thing is not simply unlawful: He does but misdo his own work. And therefore for some times I would obey, if it were necessary to avoid a greater evil. But if he make it the ordinary case, I would not obey: because it destroys the worship itself in a manner, as if he simply forbade it, and this he has no power to do. An inconvenient gesture I would use in obedience and to avoid a greater evil: But I would not obey him that would command me to stand on my head always in hearing. An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: But not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for. §69. In all such cases where governors act not as usurpers in a matter that they have no authority in, but only misdo their own work, it much concerns the subjects to foresee what’s likely to be the consequents of their obeying or disobeying, and accordingly to do that which tends most to the ends of the work: still holding to this rule, that we must obey in all things lawful. §70. And when we do obey in a case of miscommanding, it is not a doing evil that good may come of it, as some do misconceive: But it is only a submitting to that which is ill commanded, but not evil in him that does submit. It is the determiner that is the cause of the inconvenience, and not the obeyer. Nor is it inconvenient for me to obey, though it be worse perhaps to him that commands. While he sins in commanding, he may make it my duty to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations on Church Government &amp; Worship (London, 1659)</cite>, ch. 2; pp. 423-24</span></figcaption>

<blockquote><p>It may be said, ‘But are not the ordinances of Christ someway polluted by the unworthiness of such scandalous partakers? and if so, can polluted ordinances be partaken of without sin?’ Answer: We may consider polluting of ordinances in a threefold sense. 1. An ordinance may be said to be polluted when the essentials and substantials thereof are corrupted, so as indeed it ceases to be an ordinance of Jesus Christ: Thus the mass in Popery is a fearfull abomination and a corruption of the sacrament: in this respect, the ordinance (if it may be called an ordinance after that, for indeed it is not an ordinance of Christ) is polluted, and this may be many ways fallen into, and communion in this is indeed sinful and cannot but be so. 2. An ordinance may be said to be polluted when it is irreverently and profanely abused, though essentials be kept: Thus the Lord’s Sabbath may be polluted, which yet is holy in itself; So was the Table of the Lord polluted, Mal. 1. And in this sense the sacrament of the Lord’s Supper was indeed polluted by the Corinthians, 1 Cor. 11, when some came drunk or otherways irreverently to the holy ordinances; In this respect, an ordinance may be said to be polluted to him that so goes about it, because to the unclean all things are unclean; but it is not polluted in itself, nor to any other that examine themselves, as the former instance does clear, because that pollution comes from nothing in the ordinance (it being in its essentials complete) but does arise from the sinfulness of such and such persons, and therefore must be commensurable with them. 3. An ordinance may be said to be polluted, upon this extrinsic consideration, to wit, when by some circumstance in it, or miscarriage of those that are about it, it is made common-like, and so wants that luster and honorableness that it ought to have; by such a fault the ordinance is made obnoxious to contempt and is despised by others, contrary to the Lord’s allowance. Thus the priests of old made the offerings of the Lord vile and contemptible [1 Sam. 2], which was not by corrupting them in essentials, nor making them cease to be ordinances, but by their miscarriages and corrupt irreverent way of going about them, they did lay that stumbling-block before others to make them account these ordinances contemptible. This may be diverse ways fallen into, as: 1. When the officer or minister has a profane carnal carriage… 2… when an officer does indiscreetly and indifferently administrate ordinances to precious and vile, as if they were common things… All those may be said to pollute the ordinances as they derogate from their weight and authority, and miscarry in the administration of them, and are ready to breed irreverence and contempt in others… yet all these do not pollute the ordinance in itself or make it to be no ordinance, nor do pollute it to any that does reverently partake of the same, and does not stumble upon the block that is laid before him… If it be said that communicating in such a case does seem to approve such an admission and to confirm those in some good opinion of themselves who are admitted, and so there is a necessity of abstaining, though not upon the account that the ordinances are polluted, yet, for preventing the foresaid offence, which might make us guilty. Answer: … 2. Is not reverent and exemplary partaking of the ordinances at such a time a more edifying and convincing testimony against such untenderness, than by withdrawing to give a new offence? 3. The Lord’s precept in such a case, ‘Let a man examine himself, and so let him eat,’ does not leave the thing indifferent upon that ground; And therefore that objection is not here to have place, as the grounds formerly laid down do evince [prove]: For we are not to be wise or holy beyond what the Lord has commanded.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“It may be said, ‘But are not the ordinances of Christ someway polluted by the unworthiness of such scandalous partakers? and if so, can polluted ordinances be partaken of without sin?’ Answer: We may consider polluting of ordinances in a threefold sense. 1. An ordinance may be said to be polluted when the essentials and substantials thereof are corrupted, so as indeed it ceases to be an ordinance of Jesus Christ: Thus the mass in Popery is a fearfull abomination and a corruption of the sacrament: in this respect, the ordinance (if it may be called an ordinance after that, for indeed it is not an ordinance of Christ) is polluted, and this may be many ways fallen into, and communion in this is indeed sinful and cannot but be so. 2. An ordinance may be said to be polluted when it is irreverently and profanely abused, though essentials be kept: Thus the Lord’s Sabbath may be polluted, which yet is holy in itself; So was the Table of the Lord polluted, Mal. 1. And in this sense the sacrament of the Lord’s Supper was indeed polluted by the Corinthians, 1 Cor. 11, when some came drunk or otherways irreverently to the holy ordinances; In this respect, an ordinance may be said to be polluted to him that so goes about it, because to the unclean all things are unclean; but it is not polluted in itself, nor to any other that examine themselves, as the former instance does clear, because that pollution comes from nothing in the ordinance (it being in its essentials complete) but does arise from the sinfulness of such and such persons, and therefore must be commensurable with them. 3. An ordinance may be said to be polluted, upon this extrinsic consideration, to wit, when by some circumstance in it, or miscarriage of those that are about it, it is made common-like, and so wants that luster and honorableness that it ought to have; by such a fault the ordinance is made obnoxious to contempt and is despised by others, contrary to the Lord’s allowance. Thus the priests of old made the offerings of the Lord vile and contemptible [1 Sam. 2], which was not by corrupting them in essentials, nor making them cease to be ordinances, but by their miscarriages and corrupt irreverent way of going about them, they did lay that stumbling-block before others to make them account these ordinances contemptible. This may be diverse ways fallen into, as: 1. When the officer or minister has a profane carnal carriage… 2… when an officer does indiscreetly and indifferently administrate ordinances to precious and vile, as if they were common things… All those may be said to pollute the ordinances as they derogate from their weight and authority, and miscarry in the administration of them, and are ready to breed irreverence and contempt in others… yet all these do not pollute the ordinance in itself or make it to be no ordinance, nor do pollute it to any that does reverently partake of the same, and does not stumble upon the block that is laid before him… If it be said that communicating in such a case does seem to approve such an admission and to confirm those in some good opinion of themselves who are admitted, and so there is a necessity of abstaining, though not upon the account that the ordinances are polluted, yet, for preventing the foresaid offence, which might make us guilty. Answer: … 2. Is not reverent and exemplary partaking of the ordinances at such a time a more edifying and convincing testimony against such untenderness, than by withdrawing to give a new offence? 3. The Lord’s precept in such a case, ‘Let a man examine himself, and so let him eat,’ does not leave the thing indifferent upon that ground; And therefore that objection is not here to have place, as the grounds formerly laid down do evince [prove]: For we are not to be wise or holy beyond what the Lord has commanded.”

— James Durham, The Dying Man’s Testament of the Church of Scotland or, A Treatise concerning Scandal (Edinburgh, 1659), pt. 2, ch. 14, pp. 147-50">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+may+be+said%2C+%E2%80%98But+are+not+the+ordinances+of+Christ+someway+polluted+by+the+unworthiness+of+such+scandalous+partakers%3F+and+if+so%2C+can+polluted+ordinances+be+partaken+of+without+sin%3F%E2%80%99+Answer%3A+We+may+consider+polluting+of+ordinances+in+a+threefold+sense.+1.+An+ordinance+may+be+said+to+be+polluted+when+the+essentials+and+substantials+thereof+are+corrupted%2C+so+as+indeed+it+ceases+to+be+an+ordinance+of+Jesus+Christ%3A+Thus+the+mass+in+Popery+is+a+fearfull+abomination+and+a+corruption+of+the+sacrament%3A+in+this+respect%2C+the+ordinance+%28if+it+may+be+called+an+ordinance+after+that%2C+for+indeed+it+is+not+an+ordinance+of+Christ%29+is+polluted%2C+and+this+may+be+many+ways+fallen+into%2C+and+communion+in+this+is+indeed+sinful+and+cannot+but+be+so.+2.+An+ordinance+may+be+said+to+be+polluted+when+it+is+irreverently+and+profanely+abused%2C+though+essentials+be+kept%3A+Thus+the+Lord%E2%80%99s+Sabbath+may+be+polluted%2C+which+yet+is+holy+in+itself%3B+So+was+the+Table+of+the+Lord+polluted%2C+Mal.+1.+And+in+this+sense+the+sacrament+of+the+Lord%E2%80%99s+Supper+was+indeed+polluted+by+the+Corinthians%2C+1+Cor.+11%2C+when+some+came+drunk+or+otherways+irreverently+to+the+holy+ordinances%3B+In+this+respect%2C+an+ordinance+may+be+said+to+be+polluted+to+him+that+so+goes+about+it%2C+because+to+the+unclean+all+things+are+unclean%3B+but+it+is+not+polluted+in+itself%2C+nor+to+any+other+that+examine+themselves%2C+as+the+former+instance+does+clear%2C+because+that+pollution+comes+from+nothing+in+the+ordinance+%28it+being+in+its+essentials+complete%29+but+does+arise+from+the+sinfulness+of+such+and+such+persons%2C+and+therefore+must+be+commensurable+with+them.+3.+An+ordinance+may+be+said+to+be+polluted%2C+upon+this+extrinsic+consideration%2C+to+wit%2C+when+by+some+circumstance+in+it%2C+or+miscarriage+of+those+that+are+about+it%2C+it+is+made+common-like%2C+and+so+wants+that+luster+and+honorableness+that+it+ought+to+have%3B+by+such+a+fault+the+ordinance+is+made+obnoxious+to+contempt+and+is+despised+by+others%2C+contrary+to+the+Lord%E2%80%99s+allowance.+Thus+the+priests+of+old+made+the+offerings+of+the+Lord+vile+and+contemptible+%5B1+Sam.+2%5D%2C+which+was+not+by+corrupting+them+in+essentials%2C+nor+making+them+cease+to+be+ordinances%2C+but+by+their+miscarriages+and+corrupt+irreverent+way+of+going+about+them%2C+they+did+lay+that+stumbling-block+before+others+to+make+them+account+these+ordinances+contemptible.+This+may+be+diverse+ways+fallen+into%2C+as%3A+1.+When+the+officer+or+minister+has+a+profane+carnal+carriage%E2%80%A6+2%E2%80%A6+when+an+officer+does+indiscreetly+and+indifferently+administrate+ordinances+to+precious+and+vile%2C+as+if+they+were+common+things%E2%80%A6+All+those+may+be+said+to+pollute+the+ordinances+as+they+derogate+from+their+weight+and+authority%2C+and+miscarry+in+the+administration+of+them%2C+and+are+ready+to+breed+irreverence+and+contempt+in+others%E2%80%A6+yet+all+these+do+not+pollute+the+ordinance+in+itself+or+make+it+to+be+no+ordinance%2C+nor+do+pollute+it+to+any+that+does+reverently+partake+of+the+same%2C+and+does+not+stumble+upon+the+block+that+is+laid+before+him%E2%80%A6+If+it+be+said+that+communicating+in+such+a+case+does+seem+to+approve+such+an+admission+and+to+confirm+those+in+some+good+opinion+of+themselves+who+are+admitted%2C+and+so+there+is+a+necessity+of+abstaining%2C+though+not+upon+the+account+that+the+ordinances+are+polluted%2C+yet%2C+for+preventing+the+foresaid+offence%2C+which+might+make+us+guilty.+Answer%3A+%E2%80%A6+2.+Is+not+reverent+and+exemplary+partaking+of+the+ordinances+at+such+a+time+a+more+edifying+and+convincing+testimony+against+such+untenderness%2C+than+by+withdrawing+to+give+a+new+offence%3F+3.+The+Lord%E2%80%99s+precept+in+such+a+case%2C+%E2%80%98Let+a+man+examine+himself%2C+and+so+let+him+eat%2C%E2%80%99+does+not+leave+the+thing+indifferent+upon+that+ground%3B+And+therefore+that+objection+is+not+here+to+have+place%2C+as+the+grounds+formerly+laid+down+do+evince+%5Bprove%5D%3A+For+we+are+not+to+be+wise+or+holy+beyond+what+the+Lord+has+commanded.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+The+Dying+Man%E2%80%99s+Testament+of+the+Church+of+Scotland+or%2C+A+Treatise+concerning+Scandal+%28Edinburgh%2C+1659%29%2C+pt.+2%2C+ch.+14%2C+pp.+147-50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd626ca7257.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d626ca7257.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=It%20may%20be%20said%2C%20%E2%80%98But%20are,beyond%20what%20the%20Lord%20has%20commanded&amp;text=It%20may%20be%20said%2C%20%E2%80%98But%20are%20not%20the&amp;text=or%20holy%20beyond%20what%20the%20Lord%20has%20commanded" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

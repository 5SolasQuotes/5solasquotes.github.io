<main class="wrap"><figure class="quote" id="q-9541e39dd5" data-kw="">
<blockquote><p>The ancients† insist much upon that proof John 16:15, ‘All things that the Father hath are mine’, compared with John 10:30, ‘I and my Father are one’, and John 10:37, ‘If I do not the works of my Father, believe me not; for from hence they do conclude, that Christ has the same divine nature and Godhead with the Father; they both have the same divine and essential titles and attributes, and perform the same inward operations in reference to all creatures whatsoever; † Epiphanius, contra Apostolicos, see Cyril in John, ch. 3 &amp; 8; Jerome on Zech. 2; Ambrose, bk. 5, Of Faith, ch. 4; Augustine, contra Pascen tium: ‘nemo igitur jam calumnia turde verbo; et si enim verbum ipsum in Lege scriptum non reperitur, res tamen reperitur, ego et Pater unum sumus’, Epistle 174. and therefore they did farther infer that they had reason to use the word ‘Consubstantial’ [one substance]; for though the word is not in Scripture, yet the sense and meaning of it is orthodox and canonical, because evidently deduced from these texts and some other Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity… (London, 1650)</cite>, ch. 4, p. 26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-11e3f554be" data-kw="">
<blockquote><p>Meanwhile, we believe and confess the force of this union of the natures in the person of Christ to be so great: that first, whatsoever Christ is or does, according to the divine nature, that same, whole Christ, the Son of man, may be said to be, or to do: and again, whatsoever Christ does or suffers according to his human nature, that same, whole Christ the Son of God, God Himself, is said in the holy Scriptures, to be, to do, and to suffer. As that: God (that is Christ, man and God) redeemed the Church with his blood: Acts 20:28, whenas the force of the redemption pertained to the Godhead, the shedding of his blood only to the manhood. Yet both these actions are joined in one, and each of them may be spoken alike of whole Christ: although they were and are distinct, because the natures, although distinct yet are coupled together in Christ’s one Person. Yea Christ the Mediator, according to his humanity never did or does anything, wherein his divinity did not or does not work together: and He never performed anything according to his divinity, whereunto his humanity was not assisting or consenting: that the Fathers very fitly called all the works of Christ the Mediator [theandric?], that is performed both by God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion… (1599)</cite>, ch. 11, ‘Of Christ the Redeemer’; pp. 65-66</span></figcaption>

<blockquote><p>Q. 41.9. How often were the commandments written on tables of stone? A. The first being broken by Moses, on occasion of the idolatry of Israel, Exod 32:19, the Lord condescended to write on two other tables, the very same words that were on the former, Exod 34:1. Q. 41.10. Was there any difference between the first two tables and the second? A. The first two, which were entirely the work of God, (the polishing as well as the engraving,) were broken beneath the mount, Exod 32:16,19; but the second, which were hewed by Moses, the typical mediator, were put into the ark, Deut 10:3,5. Q. 41.11. What spiritual mystery was represented by this? A. That though the covenant of works, made with the first Adam, was broken and violated by him, yet it was fulfilled in every respect by Christ the true Mediator, who “restored that which he took not away,” Ps 69:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-f0dc86a8f5" data-kw="mediatorial office degrees">
<blockquote><p>The mediatorial office of Christ is all that Christ ought to do from his mission and calling towards an offended God and offending men, reconciling and again uniting them to each other. And instituted with how many degrees? Predestination, mission, and calling.</p></blockquote>

</figure><figure class="quote" id="q-7e7a95d7eb" data-kw="">
<blockquote><p>Neither can the names of Jesus and Christ prove that what is said there [in Prov. 8:15-16, 22-30] must needs be meant of Him as Mediator. Mark how well-grounded Mr. Hussey’s arguments are. Jesus sat at meat in Simon the Pharisee’s house, Luke 7:37; Jesus wept for Lazarus, because He loved him, John 11:35-36. Must we needs therefore say that, as Mediator, He sat at meat in the Pharisee’s house, and, as Mediator, He wept for Lazarus? Christ is the Son of David, Matt. 22:42. Must we therefore say that, as Mediator, He is the Son of David? Christ is “God over all, blessed forever,” Rom. 9:5. Must we therefore say that this is meant of Christ only as Mediator? What is more ordinary than to use the names of Jesus and Christ when the thing which is said is meant in reference to one of the natures?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming… (1646), pt. 2, ch. 6</cite>, p. 98, lt col</span></figcaption>

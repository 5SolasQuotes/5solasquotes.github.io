<blockquote><p>The same prelate pleads for the expediency of giving the Communion to the sick in private houses, because he thinks they should not want [lack] this mean of comfort: As if the wanting of the sacramental signs, not procured by a man’s own negligence or contempt, could stop or stay the comforts of the Holy Spirit. Nay, it is not so: we have seen some who received not the Communion in time of their sickness, end more gloriously and comfortably than ever we heard of any who received the sacrament for their viaticum [journey] when they were a dying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 2, 14</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-56e591a277" data-kw="">
<blockquote><p>A second general attribution of the Lord’s Supper, from whence it is endeavored [by opponents] to conclude to the sinfulness of giving it, in any case, unto such as are known by the minister to be unworthy receivers [though they have not been convicted by the Session of elders], is, its being a seal of the Covenant of Grace, the righteousnesse of faith. For hence think some, it follows that administration of the Lord’s Supper unto known scandalous and wicked persons, is a practical and visible lie, a confirmation of an untruth, because it seals the Covenant and promises to those who have visibly no share in them. For answer: The Lord’s Supper may be said to be a seal of the Covenant, or promise of grace, either absolutely, or conditionally. The truth of the Covenant and promises in themselves, our obligation to gratitude and obedience, are sealed absolutely by the Lord’s Supper; but interest in the Covenant and promises of grace, the Lord’s Supper seals unto those that partake thereof, but conditionally, so they believe: Unto wicked men the promises are as propounded, so sealed but conditionally. Sacramenta (says [William] Ames) non sunt testimonia completa et absoluta nisi credentibus. They are (says Rutherford) seals unto the wicked, not in actu secundo [by the following act of exercised power], but only in actu primo [in their first act of being, apart from that being exercised]. See Mr. [Stephen] Marshall in his Defence of Infant Baptism Against Tombs, [1646,] pp. 117-8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government… (London, 1650), p. 60 Jeanes was an English presbyterian.</cite></span></figcaption>

</figure><figure class="quote" id="q-2a35968f71" data-kw="">
<blockquote><p>Secondly, as this sacrament being a communion admonishes that we are all one in Christ: so it teaches that it is to be received of many together in the church, not of one alone, and therefore it overthrows the private masses of the church of Rome, where one partakes all and the rest of the Church nothing at all. There is a flat opposition between these two: so that the communion cannot be a private mass, and private mass cannot be a communion. That which is ordained and prepared for many, delivered unto many, and received of many, cannot stand with the mass, where the priest prepares for himself, not for the people: he speaks to himself, not to the church: he receives himself alone, not with his brethren: all which are directly contrary to the apostles rule, ‘Tarry one for another.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments… (London, 1606), bk. 3, ‘Of the Lord’s Supper’</cite>, p. 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-e301663091" data-kw="">
<blockquote><p>Neither Word nor sacraments, nor anything on the part of the Almighty can be intended in vain, though the end of the ordinance be not obtained. I should have expected some such divinity from the pen of Arminians and Socinians who make God to intend the salvation of all and every one in both the promises of the Gospel, precepts and sacraments, and yet He falls from this end: so you may read, in Arminius, Anti-Perkins, p. 60, that God is disappointed in his end, in both Law and Gospel, and God shooting beside his mark misses the salvation of many, say the Remonstrants at the Synod of Dort, p. 216, and in their confession, ch. 7, sect. 3; and because Socinus thought it hard thus to take from God wise intentions, he did no less than blasphemously deprive Him of his omniscience: So Socians, Contra Puccium, ch. 10, and in Theological Lectures, ch. 11, made all things that are contingently to come uncertain to God: But if you speak of intentio operis, non operantis [the end of the work, not of the worker], that the Supper, in its nature, is ordained…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646), ch. 23</cite>, pp. 525-26</span></figcaption>

</figure><figure class="quote" id="q-cc25ddb50f" data-kw="">
<blockquote><p>Herein now we disprove the papistical doctrine which allows of private masses and teaches that the priest offers up the body and blood of our Lord for the standers by; and that by the mass he applies the merit of redemption unto them that with devotion come to that sacrifice. For as there is no one word of the Lord extant that commands the priests to sacrifice or privately to apply the supper for others, or that promises anything unto them that stand by and look on it (for He says, “Do this; eat ye and drink ye all in the remembrance of me;” He says not, ‘Look upon the priests only while they be eating and drinking for you’)… … Concerning the place where the supper is to be celebrated, I find no contention has been amongst the most ancient ministers of the Church. It is read how that our Lord Jesus used the hall of a certain private man’s house. And also the apostle Paul both preached and brake bread at Troas in a certain dining-place (Acts 20)… At this present there seems no place to be more worthy or more commodious to celebrate the holy supper in, than that which is appointed for doctrine and prayer. For so have we learned of St. Paul, 1 Cor. ch. 11. Howbeit, if tyrannical power will not suffer us to have a church, what shall let us but that we may reverently celebrate the supper in honest private houses?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decades (Parker Society, 1852), 5th Decade, Sermon 9, ‘Of the Lord’s Holy Supper’</cite>, pp. 417-8</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Herein now we disprove the papistical doctrine which allows of private masses and teaches that the priest offers up the body and blood of our Lord for the standers by; and that by the mass he applies the merit of redemption unto them that with devotion come to that sacrifice. For as there is no one word of the Lord extant that commands the priests to sacrifice or privately to apply the supper for others, or that promises anything unto them that stand by and look on it (for He says, “Do this; eat ye and drink ye all in the remembrance of me;” He says not, ‘Look upon the priests only while they be eating and drinking for you’)… … Concerning the place where the supper is to be celebrated, I find no contention has been amongst the most ancient ministers of the Church. It is read how that our Lord Jesus used the hall of a certain private man’s house. And also the apostle Paul both preached and brake bread at Troas in a certain dining-place (Acts 20)… At this present there seems no place to be more worthy or more commodious to celebrate the holy supper in, than that which is appointed for doctrine and prayer. For so have we learned of St. Paul, 1 Cor. ch. 11. Howbeit, if tyrannical power will not suffer us to have a church, what shall let us but that we may reverently celebrate the supper in honest private houses?”

<blockquote><p>[Objection:] Sixthly, if it be the will of God that the death of Christ should be available for the immediate reconciliation of some of the elect, without any condition performed by them, then it was his will that it should be for all of them. But it is the will of God that it should be available for the immediate reconciliation of some of the elect, viz. infants, or else they cannot be reconciled. I answer: Mr. [William] Eyre is hardly put to it, that he must run to the Philistines to sharpen his goad; this argument is taken from [Francis] Suarez [a Romanist], who argues against faith in general upon this ground, because infants are justified without it. Now this argument proves, if it proves anything at all, that we are justified without it, and not before it, and so believers are not the sole subjects of justification, as Mr. Eyre elsewhere affirms; but the case of infants is not to be urged in most questions, especially when we are speaking of what God requires in those that are adulti, ‘of age’ unto salvation; but I deny his minor and affirm that infants are not united to Christ without faith; they are saved by faith as well as we. Thus [Jerome] Zanchi (tome 5, Commentary on Hosea, p. 28): Ut uniamur huic capiti Christo, Spiritus propriae fidei per sese omnibus ipsis etiam parvulis pernecessarius est; justus enim ex sola fide sua vivet, non aliena: assensus autem propriae voluntatis omnibus adultis est necessarius, etc.’ ‘ac proinde etiam parvuli quodammodo sibi ponunt hoc caput, cum Spiritu fidei interno in hoc caput donantur:’ ‘That we may be united to Christ, the spirit of a man’s own faith by itself is necessary to all, yea to infants also; for the just shall live by his own faith, not by another man’s; but the assent of our own proper will is necessary to all that are of age.’ And a little after he says: ‘and therefore also infants do in a manner appoint themselves this head, when they are given unto this head by the internal Spirit of faith.’ So also learned [Andrew] Rivet (ad vers. Babyl Jesui. Tom., [section ?] 297, p. 254.): Agnoscimus Deum in infantibus supplere quod deest propter aetatis imbecillitatem interna Spiritus sui operatione, qui fidei semen in ipsis ingenerat, et vi sua eis applicat meritum Christi, cujus suo tempore in eis sensum est excitaturus: ‘We acknowledge that God supplies in infants what is wanting through the weakness of their age by the internal work of his Spirit, who engenders a seed of faith, and by his power applies the merits of Christ to them, whereof He will raise up a sense in his time;’ Therefore I acknowledge there is at least wrought in them semen fidei, ‘a seed of faith’, by which they become members of Christ, and that relation which is in their faith to Christ’s merits is the instrument by which they obtain remission of sins, and without which they could not be saved. Nor may this seem strange, seeing we grant that in men grown up they are merely passive in the first work of grace, their understandings and wills no ways concurring antecedently to this work; and seeing it is a work wrought in us without us, why may not children be capable of this? Besides, if Adam had stood, even infants before the use of reason had been sanctified, and Christ was so from the womb, and John Baptist, and infants received the seal of the righteousness of faith; and are they capable of the seal of the righteousness of faith, and not of faith? And therefore though they have not the use of knowledge, this hinders not a seed and work of faith; they have not actual reason, yet they have reasonable souls; and when it is said that faith comes by hearing [Rom. 10], it is to be applied to persons that are of age, to whom the ordinary means to beget faith is hearing of the Word preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-warren.html">Thomas Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unbelievers No Subjects of Justification</cite>, … (London: Browne, 1654), pp. 247-49</span></figcaption>

<blockquote><p>XXIII. But with regard to the place of regeneration there is greater difficulty. On this part of the subject, I find four distinct opinions among theologians. Some think that regeneration takes place at different periods of time—it may be before, it may be at, or it may be after baptism. Others place it uniformly before baptism. Others teach that infants are baptized unto future regeneration, being incapable of it at the time. Indeed, many contend that God usually confers regeneration upon infants in the very act and moment of baptism. Let us look at the arguments of each class, and subject them to an impartial examination. XXIV. That in the dispensation of his saving grace God is restricted to no particular period of time will be admitted by every person who entertains a becoming reverence for his supreme and almighty dominion. The sole question is: What he may have prescribed to himself in the exercise of his unlimited freedom, or may have revealed in his Word, or made manifest by experience?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXIII. But with regard to the place of regeneration there is greater difficulty. On this part of the subject, I find four distinct opinions among theologians. Some think that regeneration takes place at different periods of time—it may be before, it may be at, or it may be after baptism. Others place it uniformly before baptism. Others teach that infants are baptized unto future regeneration, being incapable of it at the time. Indeed, many contend that God usually confers regeneration upon infants in the very act and moment of baptism. Let us look at the arguments of each class, and subject them to an impartial examination. XXIV. That in the dispensation of his saving grace God is restricted to no particular period of time will be admitted by every person who entertains a becoming reverence for his supreme and almighty dominion. The sole question is: What he may have prescribed to himself in the exercise of his unlimited freedom, or may have revealed in his Word, or made manifest by experience?”

— Herman Witsius, ‘On the Efficacy &amp; Utility of Baptism in the Case of Elect Infants whose Parents are Under the Covenant’ (Utrecht, 1693) in MJT 17 (2006), pp. 121-90, Includes an introduction by Mark Beach. Originally an appendix in William Marshall, Popery in The Full Corn, the Ear &amp; the Blade; or, The Doctrine of Baptism in the Popish, Episcopalian &amp; Congregational Churches; with a Defence of the Calvinistic or Presbyterian View (Edinburgh: Paton and Ritchie, 1852), p. 142">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXIII.+But+with+regard+to+the+place+of+regeneration+there+is+greater+difficulty.+On+this+part+of+the+subject%2C+I+find+four+distinct+opinions+among+theologians.+Some+think+that+regeneration+takes+place+at+different+periods+of+time%E2%80%94it+may+be+before%2C+it+may+be+at%2C+or+it+may+be+after+baptism.+Others+place+it+uniformly+before+baptism.+Others+teach+that+infants+are+baptized+unto+future+regeneration%2C+being+incapable+of+it+at+the+time.+Indeed%2C+many+contend+that+God+usually+confers+regeneration+upon+infants+in+the+very+act+and+moment+of+baptism.+Let+us+look+at+the+arguments+of+each+class%2C+and+subject+them+to+an+impartial+examination.+XXIV.+That+in+the+dispensation+of+his+saving+grace+God+is+restricted+to+no+particular+period+of+time+will+be+admitted+by+every+person+who+entertains+a+becoming+reverence+for+his+supreme+and+almighty+dominion.+The+sole+question+is%3A+What+he+may+have+prescribed+to+himself+in+the+exercise+of+his+unlimited+freedom%2C+or+may+have+revealed+in+his+Word%2C+or+made+manifest+by+experience%3F%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+%E2%80%98On+the+Efficacy+%26+Utility+of+Baptism+in+the+Case+of+Elect+Infants+whose+Parents+are+Under+the+Covenant%E2%80%99+%28Utrecht%2C+1693%29+in+MJT+17+%282006%29%2C+pp.+121-90%2C+Includes+an+introduction+by+Mark+Beach.+Originally+an+appendix+in+William+Marshall%2C+Popery+in+The+Full+Corn%2C+the+Ear+%26+the+Blade%3B+or%2C+The+Doctrine+of+Baptis

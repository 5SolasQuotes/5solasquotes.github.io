<main class="wrap"><figure class="quote" id="q-c342d9a693" data-kw="">
<blockquote><p>It is God that we have to deal withal in Ordinances, that sheds a glory, casts a Majesty, and puts an efficacy into all the Ordinances we have to deal withal: It is he who makes the Promises of the Word rocks of stay and support, that makes the commands of the Word full of authority, that makes the threatenings of the Word exceeding terrible[.]

It is he that we have to deal withal, that makes a little handful of water, a little bit of bread, and sup of wine, exceeding glorious and efficacious. What empty, what poor, what contemptible things would these be (and are to unbelieving men) if we had not to do with God in them? It is this God we have to do withal, that casts a Majesty upon, and puts an efficacy into every Ordinance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>Concerning the story and benefit of our Lord’s resurrection… directing our course as it were by the loadstar of scripture we pronounce by virtue and authority thereof that so precious and inestimable a benefit belongs unto all the faithful, and to them alone; and we exclude the wicked and unbelievers, as long as they remain such, from having any interest therein… The answer hereunto is twofold, either of which is true and sound. First, as often as the Gospel extends the fruit of Christ’s merits and benefits unto all, it must be understood (as says Saint Ambrose) of the whole number of the faithful and elect. For this is the usual and common voice found everywhere throughout the whole course of the gospel… Howbeit there is another answer no less true, wherewith we may satisfy the most contentious wranglers; that Christ died for all men absolutely and without exception to wit, if you respect the sufficiency of the merit, and the price which He paid. It is out of all doubt and controversy that the death of the Son of God is of such weight and worth that it may serve to purge and cleanse the sins not of one world only, but thousands of worlds; if at least all men would apprehend by faith this salve of sin. But the question concerns the efficacy and participation itself of the fruits which we mainly deny to be common to the believing, and unbelieving, or to be generally promised or given in the〈…〉; and we hold it no sound doctrine to 〈…〉 in this respect Christ died alike for all ???? and reprobate… For what slander is there, if this be none. When we distinguish the worth of the merue from the efficacy and participating of the benefits, and restrain according to Scripture and the judgement of the soundest Fathers this participation to the whole number of the faithful alone gathered from amongst the Jews and Gentiles; do we then deny that Christ died for all?… They [opponents] run on still, and say He died for all and every of these not only in respect of the sufficiency of his sacrifice and satisfaction, but also in regard of the efficacy of the same. What means this new device I pray? That forsooth Christ by his death and bloodshedding has truly and effectually delivered from death, purged from sin, sanctified, reconciled unto God, and restored unto his grace and favor by his death and bloodshedding all and every single man, yea even those who are not saved, but have been ever since Caine, etc. are at this day, and shall be hereafter damned… they neither perished, nay perish, nor shall perish, for their sins (whereas they are washed away by the blood of Christ Jesus) but for unbelief alone.</p></blockquote>

<blockquote><p>An intention or a conscious goal is that which an agent aims to accomplish and the means are that which is used for attaining the intention. When the agent acts according to its nature, then the end of the action and the end of the agent is one and the same. But when the means are not fitted for the intentional end, then a distinction must be inferred between the end of the action and the end of the agent; between the intention and the intender. Now, the doctrine of divine simplicity implies that in God intention and Intender—act and Agent—cannot be other than one and the same. In humans intention and intender—acts and agents—may not be one and the same. In God the means for attaining the salvation of the elect are not, indeed cannot, be disproportionate to that end. There cannot be conditions—conditional redemption—to God. For according to the doctrine of divine simplicity, each thing is related to God, but God is not (reciprocally) related to anything. Yet, universalism anthropomorphically pictures God as using means that are not proportionate to the end and assumes that there is one intention in some salvific act and another intention in some other salvific act. Particularism upholds the doctrine of simplicity and consistently maintains the otherness of God in intending to save humans in Christ. Every salvific action of God is particular in intention, since in God intention and Intender cannot be other than one and the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-rehnman.html">Sebastian Rehnman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Particular Defence of Particularism’ Journal of Reformed Theology</cite>, vol. 6, issue 1 (2012), pp. 24–34</span></figcaption>

<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>

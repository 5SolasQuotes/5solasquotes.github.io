<blockquote><p>The names of the two covenants, one of works and one of grace, may be misleading. The names may give the idea that the original covenant lacks any element of grace. That God creates us and gives us the gift of life is already an act of grace. God was under no obligation to create anyone. Once created, we had no claim on God to enter into a covenant with us. God’s promise of life on the condition of obedience has its origin in his grace. Even in the covenant of works the reward promised for obedience is de pactio.

The reward is given, not because the works themselves, due to their intrinsic value, impose an obligation on God to reward them, but because God in his grace offered such a reward as part of an agreement. Theoretically God could have justly and righteously imposed an obligation on his creatures to obey his law without any promise of reward whatsoever. It is the creature’s intrinsic duty to obey his Creator, with or without the prospect of reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-c-sproul.html">R. C. Sproul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What is Reformed Theology? Understanding the Basics</cite>, (1997; Grand Rapids MI: Baker Books, Kindle Edition, 2016), p. 131.</span></figcaption>

<blockquote><p>2. Q: How many fold is the covenant of God established with man? A: It is twofold: there is the covenant of nature or works, and the covenant of grace (Gal. 4:24).

3. Q: What is the covenant of nature or works? A: It is the covenant of God in which he promises man eternal life under the condition of good works—works proceeding from the virtues of [man’s] nature (vires naturae)—and man, moreover, accepts that condition of good works (Lev. 18:5; Rom. 10:5; Gal. 3:12).13

4. Q: Has no grave threat been added to the promise of this covenant? A: One has been added.

5. Q: In what form? A: Cursed is the one who will not persist in doing all things which have been written in the book of law, in order to do them (Gen. 2:17; Deut. 27:26; Gal. 3:10).

6. Q: What is the basis (fundamentum) of the covenant of works? A: A good, holy, and upright nature, of the kind which was in man at creation. For if God had not made man, in the beginning, according to his own image—that is, wise, holy, and just by nature—then he could not, surely, have established with man this covenant, which has for its condition holy, just, and perfect works proceeding from [man’s] nature (Gen. 1:26, 27; Eph. 4:24; Col. 3:9).

7. Q: What is promised in the covenant of works? A: A blessed life which should endure forever (Rom. 10:5; Gal. 3:12).

8. Q: What is the condition in the covenant of works? A: The condition is good works, which ought to proceed from that good, holy, and upright nature upon which the covenant of works itself was based.

9. Q: What things are excluded by this condition? A: By this condition, first, faith in Christ, and second, works proceeding from grace and regeneration, are excluded from the covenant of works (Rom. 11:6).

10. Q: Why are these things excluded? A: Because the virtues of [man’s] nature, and the works proceeding from those virtues, cannot coexist with the grace of Christ and works of grace.

11. Q: What are the principal divisions of this covenant’s condition? A: They are contained individually in the discrete commands of the Decalogue. Hence, the tables upon which the law was written were called “the tables of the covenant” (Ex. 19 and 20; 22:15; Heb. 9:4).

12. Q: Is this condition of works one of merit? A: Not at all. Rather, it is one as of duties which bear witness to [man’s] gratitude towards God the creator (Rom. 11:35; Luke 17:10).</p></blockquote>

<blockquote><p>VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)</p></blockquote>

<blockquote><p>The covenant of works is that in which God promiseth everlasting life unto a man that in all respects performeth perfect obedience to the law of works, adding thereunto threatenings of eternal death, if he shall not perform perfect obedience thereto. God made this covenant in the beginning with the first man Adam, whilst he was in the first estate of integrity: the same covenant God did repeat and make again by Moses with the people of Israel.</p></blockquote>

<blockquote><p>…a study by Isbell Sherman. He traces the development of federal theology through Wolfgang Musculus, Peter Martyr, Peter Vermigli, Stephen Szegedi, Zacharius Ursinus, Kasper Olevian, Johannes Piscator, Dudley Fenner, Thomas Cartwright, William Perkins, Robert Howie, Robert Rollock, and Francis Gomarus. It is only then that he turns to Lausanne, to consider the English translation of the works of William Bucanus.” – Bill Berends – ‘Christ’s Active Obedience in Federal Theology’, Vox Reformata (2004), p. 46 Smedley, Todd Matthew – The Covenant Theology of Zacharias Ursinus PhD thesis (Aberdeen, 2012) Abstract: “…the covenant theology of Zacharias Ursinus, which in many ways broke new ground for the development of Federal Theology in the sixteenth century with his introduction of the foedus naturale. For the first time in its development he describes the prelapsarian economy to be covenantal and thus opens the way for a bicovenantal scheme to eventually become a distinctive feature of Reformed theology.</p></blockquote>

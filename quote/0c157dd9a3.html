</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6b9349f83f" data-kw="sufficiency">
<blockquote><p>The question is not whether all those things are taught in Scripture word for word (autolexei), or immediately and expressly. We acknowledge that many things are to be deduced by legitimate inference and to be considered as the word of God. But the question is whether they are so contained in Scripture, be they expressly in it or derivable from it by legitimate inference, that there is no need of another and an unwritten (agraphō) rule of faith from which to derive matters of religion and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.3</span></figcaption>

</figure><figure class="quote" id="q-701fcad58c" data-kw="">
<blockquote><p>Therefore, though we grant that the Apostles of the Lord handed down to posterity some customs which they never committed to writing; still, first, this has nothing to do with the doctrine of faith, (as to it we cannot extract one iota from them,) but only with external rites subservient to decency or discipline; and secondly, it is still necessary for them to prove that everything to which they give the name is truly an apostolical tradition. … We especially repudiate their desire to make certainty of doctrine depend not less on what they call agrafa, (unwritten,) than on the Scriptures. We must ever adhere to Augustine&#x27;s rule, &quot;Faith is conceived from the Scriptures.&quot;</p></blockquote>

</figure><figure class="quote" id="q-22b111434a" data-kw="">
<blockquote><p>The Holy Scripture is the only sufficient, certain and infallible rule of all saving knowledge, faith and obedience … The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.</p></blockquote>

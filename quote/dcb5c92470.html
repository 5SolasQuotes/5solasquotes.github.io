<blockquote><p>We sharply contend with Socinus that finite and corrupt reason must not be made the rule of believing, or what amounts to the same thing, that we must not trust in reason if the sacred page contradicts it. Such a hideous error we all abhor, but many among us – some knowingly, others incautiously and ignorantly – follow in the footsteps of Socinus, although from this source comes every deformity of religion. What a miserable little mankin that has more faith in himself than in God! The divine oracles teach that in the beginning all things were created from nothing, which finite and vitiated reason does not accept.</p></blockquote>

<blockquote><p>These things being premised; the Question is not, Whether the scripture may teach some mysteries contrary to right reason? Nor, whether reason may ever oppose itself to the doctrine of the scripture, under pretence of its own rectitude? Nor, whether in investigating the sense of scripture, reason be of great use? For this would be an ambiguous statement of the subject.

But, when we enquire into the meaning of the holy scriptures, the question is, Whether then the dictates of what is accounted right reason, must be first consulted, that it may in the first place determine, concerning the things themselves, whether they be worthy a divine revelation; or, whether we ought simply to attend to what the words, in all their circumstances, properly signify, so that what they are found to mean, may forthwith be received for true, examination, of the things according to pretended axioms of reason?

Or, (more briefly stated) whether it is better to explain the words of scripture so that they may agree with the axioms of reason, or to correct the axioms of reason to that sense which the words of scripture plainly speak? The Socinians contend for the former, and support it by their practice; and I wish they only did so: the Orthodox maintain the latter.</p></blockquote>

<blockquote><p>Thirdly, therefore there is a deeper sting in it [death], which the godly are freed from: of which we read in the following Verse, in these words, The sting of death is sin, and the strength of sin is the law, i.e. sin armeth death with its sting, which otherwise could never have had power to hurt or touch us, whatever the Socinian faith to the contrary; and the law now broken ex accidente irritate, and per se declare, and manifest, and aggravate sin, and so giveth it its strength, and death its warrant thus to arrest and execute us …</p></blockquote>

<blockquote><p>By these and other Scripture-sentences, everyone easily sees that there are two conditions given man that he may escape the judgment of God’s justice and obtain the promise of mercy. One is the blessed seed, Christ, and his death and sacrifice. The other is faith in Christ and repentance. There is great difference between these conditions: one is simple, not conditionate, and (as they say) simply given, without respect to another dignity (or worthiness); but the other is conditionate, and given secundum quid [in a certain way], that is, receiving all its authority and certainty from the former: to wit, repentance and faith in Christ. The first condition depends on no other, but is of itself, and from itself, authentical, and gives from itself to the other all its force, virtue, and dignity. Hence the first is more principal and the chief; but the other is less principal and viler. This greater or less principality consists in this, that the first is the cause-efficient of expiation and security from God’s justice, and of obtaining mercy. And the latter is an instrumental cause, or organ of acceptance, applying reconciliation and mercy obtained. That respects justice; this mercy. By that satisfaction is given to the just Judge, without the hurt or diminution of his justice, as Himself proclaims from heaven, Mt. 3:17 and 17:5, “in whom I am well pleased,” or “in whom I am appeased,” or rest satisfied. But by that other, to wit, faith and repentance, man satisfies himself in his own conscience, that he may consist without any offence from the justice of God. As therefore it is a heinous error of them who confound these conditions in the business of justification, so peculiarly does Socinus err and break forth into blasphemy, while, turning his eye to this condition—to wit, faith and repentance, which is the less principal—and resting on this alone, he affirms it to be the efficient and meritorious cause of obtaining mercy. But the other more principal, without which this would be as a body without a soul, or a shell without a kernel, he blindly passes over and neglects, as if he saw it not. For if only bare faith in Christ and repentance would suffice to obtain God’s mercy, of what use, I pray you, was that former condition premised to this? to wit, the promise and exhibition of the Holy One, and of his death and sacrifice, and the express injunction that men’s eyes and faith be directed to this holy seed. Socinus therefore does violence to God, disjoining what He has conjoined; and that which God would have put first, he does not so much as let it follow after, but endeavours wholly to remove and blot it out of the memory of men.” – pp. 53-54, trans. Baxter, Baxter’s Confession (1655), ch. 10, sect. 3, pp. 388-90 Lubbertus, Sibrandus – De Iesu Christo servatore, hoc est, cur et qua ratione Jesus Christus noster servator sit, libri quatuor. Contra Faustum Socinum (Franeker, 1611) 650 pp. This was the first-scale reply to Socinus’s De Servatore. Hoornbeek, Johannes – Socinianism Confuted, vol. 1, 2 (Amsterdam, 1650/62) ToC 1, 2 Hoornbeek goes through the whole system of Socinianism; hence this work is virtually a polemical systematic theology. Table of Contents vol. 1 Bk. 1 1. Whether in sacred Scripture there is truly any disagreement and contradiction 1 2. Whether the authentic text of sacred Scripture in many places has been changed and corrupted 28 3. Whether some of the sacred books of the O.T. have perished 48 4. Whether under the New Testament, the reading of the O.T. is not necessary and of great moment 56 … Bk. 2 10. Whether the eternity of God has temporal parts and succession, through what is before and that which follows 262 11. Whether God, his presence, is omnipresent 285 12. Whether God has all knowledge [scientiam], even of future contingencies 319 13. Whether attributes, or properties in God are accidents or qualities really different from God and really different between themselves 367 14. Whether <div class="actions"><button class="copy" data-copy="“By these and other Scripture-sentences, everyone easily sees that there are two conditions given man that he may escape the judgment of God’s justice and obtain the promise of mercy. One is the blessed seed, Christ, and his death and sacrifice. The other is faith in Christ and repentance. There is great difference between these conditions: one is simple, not conditionate, and (as they say) simply given, without respect to another dignity (or worthiness); but the other is conditionate, and given secundum quid [in a certain way], that is, receiving all its authority and certainty from the former: to wit, repentance and faith in Christ. The first condition depends on no other, but is of itself, and from itself, authentical, and gives from itself to the other all its force, virtue, and dignity. Hence the first is more principal and the chief; but the other is less principal and viler. This greater or less principality consists in this, that the first is the cause-efficient of expiation and security from God’s justice, and of obtaining mercy. And the latter is an instrumental cause, or organ of acceptance, applying reconciliation and mercy obtained. That respects justice; this mercy. By that satisfaction is given to the just Judge, without the hurt or diminution of his justice, as Himself proclaims from heaven, Mt. 3:17 and 17:5, “in whom I am well pleased,” or “in whom I am appeased,” or rest satisfied. But by that other, to wit, faith and repentance, man satisfies himself in his own conscience, that he may consist without any offence from the justice of God. As therefore it is a heinous error of them who confound these conditions in the business of justification, so peculiarly does Socinus err and break forth into blasphemy, while, turning his eye to this condition—to wit, faith and repentance, which is the less principal—and resting on this alone, he affirms it to be the efficient and meritorious cause of obtaining mercy. But the other more principal, without which this would be as a body without a soul, or a shell without a kernel, he blindly passes over and neglects, as if he saw it not. For if only bare faith in Christ and repentance would suffice to obtain God’s mercy, of what use, I pray you, was that former condition premised to this? to wit, the promise and exhibition of the Holy One, and of his death and sacrifice, and the express injunction that men’s eyes and faith be directed to this holy seed. Socinus therefore does violence to God, disjoining what He has conjoined; and that which God would have put first, he does not so much as let it follow after, but endeavours wholly to remove and blot it out of the memory of men.” – pp. 53-54, trans. Baxter, Baxter’s Confession (1655), ch. 10, sect. 3, pp. 388-90 Lubbertus, Sibrandus – De Iesu Christo servatore, hoc est, cur et qua ratione Jesus Christus noster servator sit, libri quatuor. Contra Faustum Socinum (Franeker, 1611) 650 pp. This was the first-scale reply to Socinus’s De Servatore. Hoornbeek, Johannes – Socinianism Confuted, vol. 1, 2 (Amsterdam, 1650/62) ToC 1, 2 Hoornbeek goes through the whole system of Socinianism; hence this work is virtually a polemical systematic theology. Table of Contents vol. 1 Bk. 1 1. Whether in sacred Scripture there is truly any disagreement and contradiction 1 2. Whether the authentic text of sacred Scripture in many places has been changed and corrupted 28 3. Whether some of the sacred books of the O.T. have perished 48 4. Whether under the New Testament, the reading of the O.T. is not necessary and of great moment 56 … Bk. 2 10. Whether the eternity of God has temporal parts and succession, through what is before and that which follows 262 11. Whether God, his presence, is omnipresent 285 12. Whether God has all knowledge [scientiam], even of future contingencies 319 13. Whether attributes, or properties in God are accidents or qualities really different from God and really differ nd+these+conditions+in+the+business+of+justification%2C+so+peculiarly+does+Socinus+err+and+break+forth+into+blasphemy%2C+while%2C+turning+his+eye+to+this+condition%E2%80%94to+wit%2C+faith+and+repentance%2C+which+is+the+less+principal%E2%80%94and+resting+on+this+alone%2C+he+affirms+it+to+be+the+efficient+and+meritorious+cause+of+obtaining+mercy.+But+the+other+more+principal%2C+without+which+this+would+be+as+a+body+without+a+soul%2C+or+a+shell+without+a+kernel%2C+he+blindly+passes+over+and+neglects%2C+as+if+he+saw+it+not.+For+if+only+bare+faith+in+Christ+and+repentance+would+suffice+to+obtain+God%E2%80%99s+mercy%2C+of+what+use%2C+I+pray+you%2C+was+that+former+condition+premised+to+this%3F+to+wit%2C+the+promise+and+exhibition+of+the+Holy+One%2C+and+of+his+death+and+sacrifice%2C+and+the+express+injunction+that+men%E2%80%99s+eyes+and+faith+be+directed+to+this+holy+seed.+Socinus+therefore+does+violence+to+God%2C+disjoining+what+He+has+conjoined%3B+and+that+which+God+would+have+put+first%2C+he+does+not+so+much+as+let+it+follow+after%2C+but+endeavours+wholly+to+remove+and+blot+it+out+of+the+memory+of+men.%E2%80%9D+%E2%80%93+pp.+53-54%2C+trans.+Baxter%2C+Baxter%E2%80%99s+Confession+%281655%29%2C+ch.+10%2C+sect.+3%2C+pp.+388-90+Lubbertus%2C+Sibrandus+%E2%80%93+De+Iesu+Christo+servatore%2C+hoc+est%2C+cur+et+qua+ratione+Jesus+Christus+noster+servator+sit%2C+libri+quatuor.+Contra+Faustum+Socinum+%28Franeker%2C+1611%29+650+pp.+This+was+the+first-scale+reply+to+Socinus%E2%80%99s+De+Servatore.+Hoornbeek%2C+Johannes+%E2%80%93+Socinianism+Confuted%2C+vol.+1%2C+2+%28Amsterdam%2C+1650%2F62%29+ToC+1%2C+2+Hoornbeek+goes+through+the+whole+system+of+Socinianism%3B+hence+this+work+is+virtually+a+polemical+systematic+theology.+Table+of+Contents+vol.+1+Bk.+1+1.+Whether+in+sacred+Scripture+there+is+truly+any+disagreement+and+contradiction+1+2.+Whether+the+authentic+text+of+sacred+Scripture+in+many+places+has+been+changed+and+corrupted+28+3.+Whether+some+of+the+sacred+books+of+the+O.T.+have+per <blockquote><p>I DO not wonder that there are infidels, because the two greatest facts in our religion seem to be a denial of all moral government whatever. 1st, That the guilty, and the fear-fully guilty, should be freely pardoned; and 2d, That the only perfect innocent in the universe should be the greatest sufferer in the universe. But how does Socinus get over this latter fact?

The fact is unquestioned that he did suffer, and the fact is unquestionable that he was innocent. Why then did he suffer? if not vicariously. Was it for an example of patience? All that for a sample! But it is a truth, becoming more and more evident to me as time passes, that “no man can call Jesus Lord, but by the Holy Ghost;” and I am prepared to prove it. For what is it to call Jesus Lord? It is to worship him. Either, then, Christ is God, or he is not.

If he is not, and if we worship him, we are idolaters. And how can a man be absolutely certain that he is no idolater, or worshipper of man, in worshipping one who was essentially man, whatever else he was? He cannot, unless he is taught it from above. . . . The Jewish mind is essentially fixed in the notion that we Christians worship three gods, and that one of them is a man, and therefore that we are idolaters. In discussing theology with the Hungarian Jews, I never could get this driven out of them.</p></blockquote>

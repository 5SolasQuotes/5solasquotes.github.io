<main class="wrap"><figure class="quote" id="q-c3e59fbef6" data-kw="">
<blockquote><p>All these upon my own knowledge were the true causes why so great a number of those persons who were counted most religious, fell in with the parliament in England; insomuch that the generality of the stricter diligent sort of preachers joined with them, though not in meddling with arms, yet in judgment, and in flying to their garrisons; and almost all those afterwards called presbyterians were before conformists: Very few of all that learned and pious synod at Westminster were nonconformists before, and yet were for the parliament, supposing that the interest of religion lay on that side. Yet did they still keep up an honorable esteem of all that they thought religious on the other side, such as Bishop Davenant, Bishop Hall, Bishop Morton, Archbishop Ussher, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ: or, Mr. Richard Baxter’s Narrative of the most Memorable Passages of his Life &amp; Times</cite>, (London: Parkhurst, 1696), bk. 1, pt. 1, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bc7b9831b" data-kw="">
<blockquote><p>Should there be a gathering destitute of bread and wine, as perchance among the Indians, who for bread use the baked marrow of a certain tree, or a fixed root, or rice, or such other things, the gathering may–if, I say, there is no bread of corn–safely use what it is accustomed to use in place of bread. It is not so much the outward form and kind of corn that ought to be regarded, as the nourishment and what chiefly nourishes. The same must be said if wine is lacking. Something else might be applied, in place of wine, as scarcely any nation is discoverable, which has not some beverage which it uses to restore the spirits in place of wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doctrine of the Covenants, or a System of Didactic &amp; Elenchtic Theology</cite>, (Amsterdam, 1688), p. 593 as trans. in Heinrich Heppe, Reformed Dogmatics ed. Ernst Bizer tr. G.T. Thomson (Wipf &amp; Stock, 2007), p. 631</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-95e3bdca5e" data-kw="">
<blockquote><p>The adjuncts of the church, as crucifixes, images, altars, ravels, mass-clothes and the like are properly monuments and instruments of idolatry, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the Temple has; yea all the necessity or influence that they have in the worship is only religious and human, flowing from the will of men, without either necessity from our natural constitution of body or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty, p. 64</span></figcaption>

<blockquote><p>There is nothing accidental in the worship of God. Every thing that belongs to it, is part of it. Some things are of more weight, use and importance than others (Mt. 23:27), but all things duly belonging to it, are parts of it, or of its subsistence; outward circumstances are natural and occasional, no accidental parts of worship.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1fe6d4df6c" data-kw="">
<blockquote><p>XXXIV. Since the certainty which we urge ought to be always ought to be always connected with the use of means, we search for it in vain in the impenitent sinner… He ought not to be ignorant that perseverence in sin is inconsistent (asystaton) with that certainty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James Dennison, Jr. (Presbyterian &amp; Reformed, 1994), vol. 2, 15th Topic, question 17, ‘Whether the believer can and ought to be certain of his faith and justification by a divine and not merely conjectural certainty. We affirm…’ | section 34, p. 630</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXXIV. Since the certainty which we urge ought to be always ought to be always connected with the use of means, we search for it in vain in the impenitent sinner… He ought not to be ignorant that perseverence in sin is inconsistent (asystaton) with that certainty.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e83ff2c72e" data-kw="">
<blockquote><p>Although hypocrites and other unregenerate men may vainly deceive themselves with false hopes and carnal presumptions of being in the favor of God, and estate of salvation (which hope of theirs shall perish): yet such as truly believe in the Lord Jesus, and love him in sincerity, endeavoring to walk in all good conscience before him, may, in this life, be certainly assured that they are in the state of grace, and may rejoice in the hope of the glory of God, which hope shall never make them ashamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.1</span></figcaption>

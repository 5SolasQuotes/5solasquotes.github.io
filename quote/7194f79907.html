<main class="wrap"><figure class="quote" id="q-7194f79907" data-kw="">
<blockquote><p>It was an argument of Jezebel’s favor to the prophets of the groves that they did eat at her table, 1 Kings 18:19. So did Nehemiah express his friendship to the 150 Jews and rulers who did eat at his table, Neh. 5:17. Peradventure in the two last examples there were some successive (at least several tables). However, eating at any man’s table was ever a symbol of friendship with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 18, ‘Of the Use of a Table in the Lord’s Supper…’, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“It was an argument of Jezebel’s favor to the prophets of the groves that they did eat at her table, 1 Kings 18:19. So did Nehemiah express his friendship to the 150 Jews and rulers who did eat at his table, Neh. 5:17. Peradventure in the two last examples there were some successive (at least several tables). However, eating at any man’s table was ever a symbol of friendship with him.”

</figure><figure class="quote" id="q-749ffbefe0" data-kw="">
<blockquote><p>As to praying a written prayer out of a book, it is a habit I cannot commend. If we can tell our doctors the state of our bodies without a book, we ought to be able to tell the state of our souls to God. I have no objection to a man using crutches, when he is first recovering from a broken limb. It is better to use crutches than not to walk at all. But if I saw him on crutches all his life, I would not consider it a matter for praise. I would like to see him strong enough to throw his crutches away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer’ in Practical Religion</cite>, (Evangelical Press), pp. 97-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-5aa04506f5" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cbca538537" data-kw="">
<blockquote><p>First of all, I both believe and know that there is but one God, one alone for all sufficient: and himself to be naturally good, true, almighty, just, wise, the creator &amp; curate of all things visible and invisible, and even the same my God to be the father, the sone, &amp; the holy ghost, three persons, but one only in substance. I believe as concerning the unity of the godhead &amp; the trinity of these names or persons in all things according unto the exposition of the Creed of Nicene &amp; Athanasius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The reckoning and declaration of the faith and belief of Huldrick Zwingli bishop of Zurich the chief town of Helvetia, sent to Charles.V. that now is Emperor of Rome: holding a parliament or council at Augsburg with the chief lords and learned men of Germany, the year of our Lorde MDXXX. in the mont</cite>, trans. George Joy (London: Richard Weaver, 1548), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-feb4f173a4" data-kw="">
<blockquote><p>But that which abides always is certainly not changed, therefore if it suffers no change it is eternal. And so the Holy Spirit is eternal, but the creature is liable to fault, and therefore subject to change. But that which is subject to change cannot be eternal, and there cannot therefore be anything in common between the Spirit and the creature, because the Spirit is eternal, but every creature is temporal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit</cite>, (381), 3.11.80 in Nicene and Post-Nicene Fathers 2, 10: 106.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

<blockquote><p>At length the orthodox, to cut off every way of escape for him, declared in the Council of Nicea that the Son was homoousion (i.e., of the same nature and essence with the Father). … Athanasius detected the subterfuge and taught that there was not a similar, but the same essence in the Father and Son.</p></blockquote>

</figure><figure class="quote" id="q-17e6751446" data-kw="">
<blockquote><p>Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><figure class="quote" id="q-6636989924" data-kw="">
<blockquote><p>The purpose of all the Catholic commentators I have been able to read on the divine books of both testaments, who have written before me on the trinity which God is, has been to teach that according to the scriptures Father and Son and Holy Spirit in the inseparable equality of one substance present a divine unity; and therefore there are not three gods but one God; although indeed the Father has begotten the Son, and therefore he who is the Father is not the Son; and the Son is begotten by the Father, and therefore he who is the Son is not the Father; and the Holy Spirit is neither the Father nor the Son, but only the Spirit of the Father and of the Son, himself coequal to the Father and the Son, and belonging to the threefold unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trinity</cite>, trans. Edmund Hill, ed. J. E. Rotelle (420; New York: New City Press, 1991), 1.2.7, p. 69.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

<main class="wrap"><figure class="quote" id="q-b2c9c2b372" data-kw="">
<blockquote><p>Luther igenuously confessed that he often acted inconsiderately and moved by various passions. But when he acknowledged this, God did not condemn him for his errors, but the cause being God’s [see Micah 7:9], and his aims being holy, to promote the truth, and being a man mighty in prayer, and strong in faith, God by him kindled that fire which all the world shall never be able to quench.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed, in Works, vol. 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-917f4352cb" data-kw="">
<blockquote><p>But mistake me not, I speak not this of all kind of errors in judgement, what man is he that errs not? All errors are sinful, but all errors are not damning: all errors are hurtful, but all errors are not destructive and undoing errors. I told you there were some errors which were building errors, and some which were fundamental errors: as the apostle speaks, 1 Cor. 3:10-12, etc. In the one the work shall be burnt, in the other the workman. One shall be saved, but so saved as by fire, the other shall be destroyed in fire; work and workman, person and errors shall perish together, 1 Cor. 3:13-15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error... (1646)</cite>, p. 51</span></figcaption>

<blockquote><p>Thus we see where at this day we may find the true Church of God. Now I come to the third question; and that is: At what time a man may with good conscience make separation from a Church. Answer: So long as a Church makes no separation from Christ, we must make no separation from it: and when it separates from Christ, we may also separate from it;</p></blockquote>

</figure><figure class="quote" id="q-9b99b78b1d" data-kw="">
<blockquote><p>4. They, who truly fear the name of God [and refuse the ceremonies], are indeed scandalized by the prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified. But fiftly saith Mr. [John] Sprint, it offends the magistrate, by provoking him (persuaded and resolved as he is [as to the lawfulness of the ceremonies]) to disgrace these otherwise well deserving ministers, and to strike them with the sword of authority. Answer: Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will provoked Pharaoh the more to oppress them, or than Christ’s preaching of the truth and his abstaining from the superstitious ceremonies of the Pharisees provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed, and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2</cite>, ch. 1, p. 7</span></figcaption>

amp;text=4.%20They%2C%20who%20truly%20fear%20the%20name%20of&amp;text=not%20incited%20by%20our%20deed%2C%20but%20by%20theirs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c657d1c5d6" data-kw="">
<blockquote><p>And concerning the bounds and limits of this forbearance, all will undeniably acknowledge that it ought not to be extended indifferently unto all persons, opinions and practises, but that these four propositions are agreeable to the truth of Christianity: … Secondly, that it is not the mind of Christ that any of his servants should profess themselves willing or obliged to bear with any person which does endeavour, and with any doctrine or practice which does tend to overthrow the faith in his name, which is delivered to the saints (Jude 3), or to destroy the life and power of godliness either in the private or publick profession of religion (Tit. 1:10-11; 2 Tim. 3:5-8; Gal. 5:7-13), or to dissolve the bonds of holy communion amongst Christian brethren (Phil. 3:2; Jud. 19; Rom. 16:17-18), or to abolish the orderly relations and obligations natural and moral, without which human societies cannot stand (1 Tim. 5:8; Mt. 15:4-6; 1 Tim. 4:3), or to put down the authority which God has set up in and over human societies for the administration of justice therein (2 Pet. 2:10; Rom. 13:1-8). … Fourthly, that in matters of greater weight, which are not merely circumstantial, but are conceived to be determined by the Word, yet so, as that it is differently understood: in this case the mind of Christ is that the rules of Christian charity and mutual edification, be inviolably observed with all long suffering and forbearance. And this course ought to be continued so long, either as there is hope to gain the advantage of loving conferences, whereby differences may be reconciled, and mistakes and scandals prevented and taken out of the way; or so long as there is cause to think that God may reveal his profitable truths to such as err not wilfully, but through weakeness of judgment and harmlessly, Phil. 3:15-16 and 2 Tim. 2:22-26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moderator: endeavoring a Full Composure &amp; Quiet Settlement of those many differences both in doctrine &amp; discipline which have so long disturbed the peace &amp; welfare of this Commonwealth… (London: Bellamy, 1652), ch. 8, pp. 57-58 Caryl was a congregationalist.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Justly may this reprove Scotland this day and darken all our faces before the Lord, for all the sins He hath written upon our judgments, as it were, in legible letters, and yet we never read our sins that we have wickedly and inhumanely committed against Christ and His interest; either our personal sins against the Lord, or our public defections and backslidings from our covenant engagements, and national obligations to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bruce.html">Michael Bruce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-931f7e9954" data-kw="">
<blockquote><p>Again, I reason thus; That which moved not Christ and his Apostles to separate from the Church of their time, is no cause to us of separation; but, want of satisfaction by convincing signs of the true grace of every member of the Church, was to them no cause of separation from the Churches of their times, Ergo.

The major is clear, except we desire a better pattern for our practices then Christ and his Apostles; what ever carrieth us beyond their line, must be high presumption and deep hypocrisy.

The minor is clear, by many Scriptures; the Scribes and Pharisees were a generation of vipers; Jerusalem worse then Sodom and Gomorrah; Corasin and Bethsaida was worse then Tyrus and Sidon, and to be cast lower in Hell then these: yet the Lord did not give over to preach, to pray, to go to the Temple with them. Judas when a declared Traitor, did not scare him, nor any of his company from the Sacrament. After he went from the Table, when his wickedness was revealed that a Devil was in him; yet none of the Apostles offered to cast themselves out of the body because this wicked member was not cut off.

Many members of the Apostolic Churches were so far from convincing signs of true grace, that the works of the flesh were most evident in their life. In the Corinthians, fundamental errors, open Idolatry, grievous scandal, bitter contentions, profanation of the Lords Table. In the Galatians, such errors as destroyed grace, and made Christ of none effect. In the Church of Ephesus, of Laodicea, and the other golden Candlesticks, divers members were so evidently faulty, that the Candlestick is threatened to be removed; yet from none of these Churches did any of the Apostles ever separate, nor gave they the least warrant to any of their Disciples to make a separation from any of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), pp 158-59.</span></figcaption>

<blockquote><p>…a General Meeting met at Douglas, the 3rd of December, 1690… After this, Messrs Lining and Shields, spoke to the Meeting, to this effect, That they would not impose upon any person, yet they advised them to hear those ministers who were most free and faithful, that they could have the opportunity of, and to have a care of running upon extremes on the right hand. After which some debates ensued. Whereupon it was proposed to the meeting that a paper should be drawn up, containing a protestation against the defections of the [Church of Scotland] ministers they [Cameronian laypersons] were to hear (which they might give in either to the minister with whom they were to join, or to the presbytery of the bounds) and what induced them to join at that time; as also that their joining at present was neither a condemning of, nor receding from our former testimony and contending, nor approving of these defections they witnessed against before… Upon the morrow they convened again. The said paper was presented and read; but there were debatings concerning the same between our ministers and some of the meeting. As also, the Meeting were of different sentiments about it, some against it upon one account, and some upon another account, and some were for it, thinking it better to join with such a testimony than without any at all. Not coming to any agreement, it was left to people’s liberty and freedom to give it or not, as they thought fit. It was proposed to the meeting, that in regard debates did not much good, but rather hurt, it was fittest to leave them off, and part; which… they did. Some stayed and took copies of the paper, which they gave in to ministers before they joined; a transcript of which follows. To the right reverend Minister and Eldership of the Parish of ________ or Presbtyery of ________ Although among other calamities that we have been exercised with in these days of tribulation that have gone over us, these have been very grievous unto us, that not only we have labored under a sad famine of gospel-ordinances, but under the reproach that we despised and rejected the offer of them: Yet we have a witness in heaven and in our own consciences, that nothing has been more lamented in our lot than the want [lack] of such a privilege, nor anything so much desired as the recovery and enjoyment of these ordinances, administered in freedom and faithfulness, purity and power, which for a long time, in our judgment, have been so restrained and restricted, burdened and borne down under the bushel of Erastian and Antichristian usurpations, that not only they watned that liberty, light and luster which the Lord Jesus had set them in by his institutions, but seemed to be encompassed with and subjected to these wicked encroachments that we could not have access to them without some way acknowledging and bowing unto these idols of jealousy, which being set up in the very entry of the house of the Lord, did scar and fright us from coming thereunto, so long as these usurpations were standing. But now these things being removed, and the church’s freedom and power restored, the doctrine, worship, discipline and government, and all the ordinances of Christ re-established in purity, peace and freedom, we cannot any longer stand at a distance from them. Nevertheless, the indignities done to our Lord Jesus, and injuries done to his church by these Erastian and Antichristian usurpations of Prelacy, Supremacy and absolute power; and the defections of ministers in comliance therewisth not being as yet confessed nor condemned, and our complaints and petitions offered to the late General Assembly, not being received nor regarded as we expected, which was a great grievance, and an addition to all our former complaints; and yet being resolved to remain no longer in withdrawing as formerly, we think it altogether needful for our own exoneration, and for making our communion the more comfortable, and free of all accession to, or partaking with the guilt of these offenses, which made us withdraw in former times; To offer and give in our testimony against all the wrongs done to Christ and this reformed covenanted Church of Scotland, by the Popish, Prelatical and malignant faction, in their wicked overturning its blessed ancient reformation, rescinding the righteous laws, and breaking, burning and burying the holy covenants that fenced it, and establishing upon the ruins thereof abjured Prelacy, supremacy and tyranny, and by all the defections of ministers in compliance with, or submission to the same; such as, heaing of curates, taking any of the oaths and bonds repugnant to the covenants, embracing the indulgences and indemnities of tyrants, addressing for, and accepting of the late Popish toleration, their lying bye from, or unfaithfulness in the exercise of their ministry in times of abounding snares and their present offensive omissions in not renewing the covenants, nor purging out all the Episcopal curates, etc. And particularly, we cannot forbear to testify (with all reverence and respect to your ministry, which now we offer and promise subjection to in the Lord) against your sin of ___________________________________________ Thus having given in our testimony against these sins and all other defections and corruptions in this church; We protest that our present joining may not be interpreted an approving of any of these sins, nor a condemning of, or receding from our former or present testimony against the same; and humbly plead, that this our testimony and protestation may be registered in the books of Session or Presbytery. Subscribed by us ________ the ___ day of ______.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-shields.html">Michael Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faithful Contendings Displayed</cite>, ed. John Howie (Glasgow: John Bryce, 1780) This is the main primary source account., pp. 459-62</span></figcaption>

e of all accession to, or partaking with the guilt of these offenses, which made us withdraw in former times; To offer and give in our testimony against all the wrongs done to Christ and this reformed covenanted Church of Scotland, by the Popish, Prelatical and malignant faction, in their wicked overturning its blessed ancient reformation, rescinding the righteous laws, and breaking, burning and burying the holy covenants that fenced it, and establishing upon the ruins thereof abjured Prelacy, supremacy and tyranny, and by all the defections of ministers in compliance with, or submission to the same; such as, heaing of curates, taking any of the oaths and bonds repugnant to the covenants, embracing the indulgences and indemnities of tyrants, addressing for, and accepting of the late Popish toleration, their lying bye from, or unfaithfulness in the exercise of their ministry in times of abounding snares and their present offensive omissions in not renewing the covenants, nor purging out all the Episcopal curates, etc. And particularly, we cannot forbear to testify (with all reverence and respect to your ministry, which now we offer and promise subjection to in the Lord) against your sin of ___________________________________________ Thus having given in our testimony against these sins and all other defections and corruptions in this church; We protest that our present joining may not be interpreted an approving of any of these sins, nor a condemning of, or receding from our former or present testimony against the same; and humbly plead, that this our testimony and protestation may be registered in the books of Session or Presbytery. Subscribed by us ________ the ___ day of ______.”

— Michael Shields, Faithful Contendings Displayed, ed. John Howie (Glasgow: John Bryce, 1780) This is the main primary source account., pp. 459-62">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6a+General+Meeting+met+at+Douglas%2C+the+3rd+of+December%2C+1690%E2%80%A6+After+this%2C+Messrs+Lining+and+Shields%2C+spoke+to+the+Meeting%2C+to+this+effect%2C+That+they+would+not+impose+upon+any+person%2C+yet+they+advised+them+to+hear+those+ministers+who+were+most+free+and+faithful%2C+that+they+could+have+the+opportunity+of%2C+and+to+have+a+care+of+running+upon+extremes+on+the+right+hand.+After+which+some+debates+ensued.+Whereupon+it+was+proposed+to+the+meeting+that+a+paper+should+be+drawn+up%2C+containing+a+protestation+against+the+defections+of+the+%5BChurch+of+Scotland%5D+ministers+they+%5BCameronian+laypersons%5D+were+to+hear+%28which+they+might+give+in+either+to+the+minister+with+whom+they+were+to+join%2C+or+to+the+presbytery+of+the+bounds%29+and+what+induced+them+to+join+at+that+time%3B+as+also+that+their+joining+at+present+was+neither+a+condemning+of%2C+nor+receding+from+our+former+testimony+and+contending%2C+nor+approving+of+these+defections+they+witnessed+against+before%E2%80%A6+Upon+the+morrow+they+convened+again.+The+said+paper+was+presented+and+read%3B+but+there+were+debatings+concerning+the+same+between+our+ministers+and+some+of+the+meeting.+As+also%2C+the+Meeting+were+of+different+sentiments+about+it%2C+some+against+it+upon+one+account%2C+and+some+upon+another+account%2C+and+some+were+for+it%2C+thinking+it+better+to+join+with+such+a+testimony+than+without+any+at+all.+Not+coming+to+any+agreement%2C+it+was+left+to+people%E2%80%99s+liberty+and+freedom+to+give+it+or+not%2C+as+they+thought+fit.+It+was+proposed+to+the+meeting%2C+that+in+regard+debates+did+not+much+good%2C+but+rather+hurt%2C+it+was+fittest+to+leave+them+off%2C+and+part%3B+which%E2%80%A6+they+did.+Some+stayed+and+took+copies+of+the+paper%2C+which+they+gave+in+to+ministers+before+they+joined%3B+a+transcript+of+which+follows.+To+the+right+reverend+Minister+and+Eldership+of+the+Parish+of+________+or+Presbtyery+of+________+Although+among+other+calamities+that+we+have+been+exercised+with+in+these+days+of+tribulation+that+have+gone+over+us%2C+these+have+been+very+grievous+unto+us%2C+that+not+only+we+have+labored+under+a+sad+famine+of+gospel-ordinances%2C+but+under+the+reproach+that+we+despised+and+rejected+the+offer+of+them%3A+Yet+we+have+a+witness+in+heaven+and+in+our+own+consciences%2C+that+nothing+has+been+more+lamented+in+our+lot+than+the+want+%5Black%5D+of+such+a+privilege%2C+nor+anything+so+much+desired+as+the+recovery+and+enjoyment+of+these+ordinances%2C+administered+in+freedom+and+faithfulness%2C+purity+and+power%2C+which+for+a+long+time%2C+in+our+judgment%2C+have+been+so+restrained+and+restricted%2C+burdened+and+borne+down+under+the+bushel+of+Erastian+and+Antichristian+usurpations%2C+that+not+only+they+watned+that+liberty%2C+light+and+luster+which+the+Lord+Jesus+had+set+them+in+by+his+institutions%2C+but+seemed+to+be+encompassed+with+and+subjected+to+these+wicked+encroachments+that+we+could+not+have+access+to+them+without+some+way+acknowledging+and+bowing+unto+these+idols+of+jealousy%2C+which+being+set+up+in+the+very+entry+of+the+house+of+the+Lord%2C+did+scar+and+fright+us+from+coming+thereunto%2C+so+long+as+these+usurpations+were+standing.+But+now+these+things+being+removed%2C+and+the+church%E2%80%99s+freedom+and+power+restored%2C+the+doctrine%2C+worship%2C+discipline+and+government%2C+and+all+the+ordinances+of+Christ+re-established+in+purity%2C+peace+and+freedom%2C+we+cannot+any+longer+stand+at+a+distance+from+them.+Nevertheless%2C+the+indignities+done+to+our+Lord+Jesus%2C+and+injuries+done+to+his+church+by+these+Erastian+and+Antichristian+usurpations+of+Prelacy%2C+Supremacy+and+absolute+power%3B+and+the+defections+of+ministers+in+comliance+therewisth+not+being+as+yet+confessed+nor+condemned%2C+and+our+complaints+and+petitions+offered+to+the+late+General+Assembly%2C+not+being+received+nor+regarded+as+we+expected%2C+which+was+a+great+grievance%2C+and+an+addition+to+all+our+former+complaints%3B+and+yet+being+resolved+to+remain+no+longer+in+withdrawing+as+formerly%2C+we+think+it+altogether+needful+for+our+own+exoneration%2C+and+for+making+our+communion+the+more+comfortable%2C+and+free+of+all+accession+to%2C+or+partaking+with+the+guilt+of+these+offenses%2C+which+made+us+withdraw+in+former+times%3B+To+offer+and+give+in+our+testimony+against+all+the+wrongs+done+to+Christ+and+this+reformed+covenanted+Church+of+Scotland%2C+by+the+Popish%2C+Prelatical+and+malignant+faction%2C+in+their+wicked+overturning+its+blessed+ancient+reformation%2C+rescinding+the+righteous+laws%2C+and+breaking%2C+burning+and+burying+the+holy+covenants+that+fenced+it%2C+and+establishing+upon+the+ruins+thereof+abjured+Prelacy%2C+supremacy+and+tyranny%2C+and+by+all+the+defections+of+ministers+in+compliance+with%2C+or+submission+to+the+same%3B+such+as%2C+heaing+of+curates%2C+taking+any+of+the+oaths+and+bonds+repugnant+to+the+covenants%2C+embracing+the+indulgences+and+indemnities+of+tyrants%2C+addressing+for%2C+and+accepting+of+the+late+Popish+toleration%2C+their+lying+bye+from%2C+or+unfaithfulness+in+the+exercise+of+their+ministry+in+times+of+abounding+snares+and+their+present+offensive+omissions+in+not+renewing+the+covenants%2C+nor+purging+out+all+the+Episcopal+curates%2C+etc.+And+particularly%2C+we+cannot+forbear+to+testify+%28with+all+reverence+and+respect+to+your+ministry%2C+which+now+we+offer+and+promise+subjection+to+in+the+Lord%29+against+your+sin+of+___________________________________________+Thus+having+given+in+our+testimony+against+these+sins+and+all+other+defections+and+corruptions+in+this+church%3B+We+protest+that+our+present+joining+may+not+be+interpreted+an+approving+of+any+of+these+sins%2C+nor+a+condemning+of%2C+or+receding+from+our+former+or+present+testimony+against+the+same%3B+and+humbly+plead%2C+that+this+our+testimony+and+protestation+may+be+registered+in+the+books+of+Session+or+Presbytery.+Subscribed+by+us+________+the+___+day+of+______.%E2%80%9D%0A%0A%E2%80%94+Michael+Shields%2C+Faithful+Contendings+Displayed%2C+ed.+John+Howie+%28Glasgow%3A+John+Bryce%2C+1780%29+This+is+the+main+primary+source+account.%2C+pp.+459-62&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F487f649539.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/487f649539.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=a%20General%20Meeting%20met%20at%20Douglas,________%20the%20___%20day%20of%20______&amp;text=a%20General%20Meeting%20met%20at%20Douglas%2C%20the%203rd&amp;text=by%20us%20________%20the%20___%20day%20of%20______" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘Yea but’ (say they) ‘our significant ceremonies were taken from idolaters and limbs of [the Roman] Antichrist who have abused them.’ Were this true, yet take the dross from the silver and make a vessel for the finer (Prov. 25:4); but it is false. Though they have had such as ours and have still, yet ours are our own and were never theirs in special. Fire and water are contrary, yet they agree in their kind: they are both elements. So ours are ceremonies and so are theirs, but otherwise they differ as fire and water; they scorn therefore ours and we deride theirs. We read of sacrifices offered to devils, yet some of this was sold in shambles and some the heathens made feasts of [such]. It was all the same flesh in kind, but not in use. The Christians did damnably if they went to it when it was sacrificed, yea and if they went to their idol feasts when they blessed an idol, it was idolatry; but if they bought part of that flesh in the shambles and ate it, or went to their private feasts when they ate of it (for aught they knew) without reference to the idol, then, says Paul, ‘Eat, making no question for conscience sake.’ So say we of our cross, surplice, kneeling: they were ordinances before idolaters abused them. If they take them and bless an idol with them, be it upon their own pates; but if we be invited to them in a better use (and not know, nor have just cause to suspect any lurking idolatry), why should we make so many needless questions about the use of them? Put [the] case, such as they are pertained to idolaters. So did Goliath’s sword, yet David laid it up in a holy place for better use. So did bowing belong to Baal, prostrating the whole body to idols, kissing to the calves, kissing the hand to the host of heaven, lifting up the eyes, stretching forth both hands, shouting for joy, sitting or lying along upon the ground or on a carpet to idols; yet all these we may use in the worship of the true God. So for our ceremonies, such as they are pertained to idolaters, but were not idolatrous of themselves. The cross was used as a sign of profession before idolatry prevailed. The white garment was ordained as a cover-sloven in the poverty of the Church; kneeling was used as an act of reverence before the breaden god was hatched. And may not we lawfully use them now, to show that we are in communion and fellowship with that blessed and persecuted Church, without such noises and schisms?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639), sect. 15 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine., pp. 207-9</span></figcaption>

<blockquote><p>This language of ‘authentic’ [WCF 1.8] arose on account of the Roman Catholic assertion that the Latin Vulgate was the authentic standard by which the church should be appealing as authoritative. This was codified by the papists at the Council of Trent… Therefore, the Reformers were required to state unequivocally that the authoritative or authentic Scripture was that in the original Greek and Hebrew Scriptures and not the Latin translation…. It is clear, then, that our own Confession is not using the term “authentic” void of meaning. It is a reference to that which has final authority in matters of religious controversy and to that which the church should appeal. But notice again, it is not a printed text that is the appeal. It is to the original languages of the Hebrew and Greek. Therefore, “authentic” in §1.8 does not have historical connection to a particular printed text… Like Turretin, Owen is speaking of the manuscript tradition of copies rather than a collated, edited, and printed edition of the Greek New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-decker.html">Timothy Decker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does our confession require a printed text or indicate the need for a text critical methodology?’</cite>, (2023)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>In every comparison there must be some dissimilitude. …‘Proportions are alike, but not the same.’ Christ’s body is not divided in parts as the bread; therefore there is no analogy betwixt Christ crucified and the bread? It follows not, for similitudes disagree in some things. Similitudes are not to be taken from things altogether different: as an ancient writer makes a comparison betwixt the ten plagues of Egypt and the Ten Commandments: so those who make the comparison betwixt the 70 disciples and the 70 palm trees; the 12 fountains and the 12 apostles: here the comparison is far sought. The comparison must agree in the main point, else it is not a comparison;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Synagogue</cite>, … (London, 1623), 3rd bk., ch. 2, ‘Of the Illustration of Doctrine by Comparisons’, p. 281</span></figcaption>

<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them?… …whereas it might bee thought, that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places… …that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks.</p></blockquote>

— George Gillespie, English Popish Ceremonies (1637), pt. 1, ch. 8, ‘That Festival Days take away our Christian Liberty, proved out of the Gospel’, pp. 25-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BCol.+2%5D+verse.+17%2C+What+should+we+do+with+the+shadow%2C+when+we+have+the+body%3F+another%2C+verse+20%2C+Why+should+we+be+subject+to+human+ordinances%2C+since+through+Christ+we+are+dead+to+them%2C+and+have+nothing+ado+with+them%3F%E2%80%A6+%E2%80%A6whereas+it+might+bee+thought%2C+that+the+apostle+does+not+condemn+all+holy-days%2C+because+both+he+permits+others+to+observe+days%2C+Rom.+14%3A5%2C+and+he+himself+also+did+observe+one+of+the+Jewish+feasts%2C+Acts+18%3A21.+It+is+easily+answered+that+our+holy-days+have+no+warrant+from+these+places%E2%80%A6+%E2%80%A6that+which+the+apostle+either+said+or+did+hereanent%2C+is+to+be+expounded+and+understood+of+bearing+with+the+weak+Jews%2C+whom+he+permitted+to+esteeme+one+day+above+another%2C+and+for+whose+cause+he+did+in+his+own+practice%2C+thus+far+apply+himself+to+their+infirmity+at+%5B%3F%3F%3F%5D+time%2C+when+they+could+not+possibly+be+as+yet+fully+and+throughly+instructed+concerning+Christian+liberty+and+the+abrogation+of+the+Ceremonial+Law%2C+because+the+Gospel+was+as+yet+not+fully+propagated%3A+and+when+the+Mosaical+rites+were+like+a+dead+man+not+yet+buried%2C+as+Augustine%E2%80%99s+simile+runs.+So+that+all+this+can+make+nothing+for+holy-days+after+the+full+promulgation+of+the+Gospel%2C+and+after+that+the+Jewish+ceremonies+are+not+only+dead%2C+but+also+buried%2C+and+so+deadly+to+be+used+by+us.+Hence+it+is%2C+that+the+apostle+will+not+bear+with+the+observation+days+in+Christian+Churches%2C+who+have+known+God+as+he+speaks.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+1%2C+ch.+8%2C+%E2%80%98That+Festival+Days+take+away+our+Christian+Liberty%2C+proved+out+of+the+Gospel%E2%80%99%2C+pp.+25-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9aec2c78b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9aec2c78b0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-ceremonial-law/#:~:text=Col.%202%5D%20verse.%2017%2C%20What%20should,have%20known%20God%20as%20he%20speaks&amp;text=Col.%202%5D%20verse.%2017%2C%20What%20should%20we%20do&amp;text=Churches%2C%20who%20have%20known%20God%20as%20he%20speaks" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We may only advert farther on this head, to the wonder that the friends of truth and reformation should be so divided in sentiment and communion.

Considering that these are so feeble in point of numbers, and that the force of their public testimony depends so much on their united exertions, it is truly surprising that so little of a spirit of enlightened and scriptural union should exist among them; and that so generally they should be on the watch to increase their own little parties, by fishing in disturbed waters, and picking up treasures from the wreck of ruined establishments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Aspect of the Times. Delivered in May, 1834 in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4e8ed2d62a" data-kw="">
<blockquote><p>Things that are false will accomplish a great many useful things in the world. If I take a counterfeit coin and buy a dinner with it, the dinner is every bit as good as if the coin were a product of the mint. And what a very useful thing a dinner is! But just as I am on my way downtown to buy a dinner for a poor man, an expert tells me that my coin is a counterfeit. The miserable, heartless theorizer! While he is going into uninteresting, learned details about the primitive history of that coin, a poor man is dying for want of bread. So it is with faith. Faith is so very useful, they tell us, that we must not scrutinize its basis in truth. But, the great trouble is, such an avoidance of scrutiny itself involves the destruction of faith. For faith is essentially dogmatic. Despite all you can do, you cannot remove the element of intellectual assent from it. Faith is the opinion that some person will do something for you. If that person really will do that thing for you, then the faith is true. If he will not do it, then the faith is false. In the latter case, not all the benefits in the world will make the faith true. Though it has transformed the world from darkness to light, though it has produced thousands of glorious healthy lives, it remains a pathological phenomenon. It is false, and sooner or later it is sure to be found out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism</cite>, (1923), pp. 142-43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-72c588861e" data-kw="">
<blockquote><p>The chief practical argument in favour of Universalism is, doubtless, the sinful callousness of Christians towards this tremendous destiny of their sinful fellow-creatures. Can we contemplate the exposure of our friends, neighbours, and children to a fate so terrible [as hell], and feel so little sensibility, and make efforts so few and weak for their deliverance! And yet, we profess to have faith! How can our unbelieving friends be made to credit the sincerity of our convictions? Here, doubtless, is the best argument of Satan for their scepticism. And the best refutation of this heresy is the exhibition by God’s people of a holy, humble, yet burning zeal to pluck men as brands from the burning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus and Notes of the Course of Systematic and Polemic Theology Taught in Union Theological Seminary, Virginia</cite>, (2nd edn, St Louis MO: Presbyterian Publishing Company, 1878), pp 861-62.</span></figcaption>

</figure><figure class="quote" id="q-b73d1dc7e3" data-kw="">
<blockquote><p>It is the worst of sins, because it keeps all sins: they are made sure and secure by hypocrisy. Indeed some vices are quarter-masters with it, and some Sovereigns over it: for the hypocrisy is but another sin … except to content some affected guest, we could never yield to this filthy Herodias. It is made a stalking horse for covetousness, under long prayers many a Pharisee devours the poor, houses, goods and all. It is a complexion for lust, who, were she not painted over with a religious shew, would appear as loathsome to the world, as she is indeed.

It is a sepulchre of rotten impostures, which would stink like a putrefied corpse, if hypocrisy were not their cover. It is a mask for treason, whose shop-full of poisons, pistols, daggers, gunpowder-trains, would easily be spied out, had hypocrisy left them bare-faced. Treachery under this vizard thrusts into Court-revels, nay, Court-counsels; and holds the torch to sports, nay the books to serious consultations; deviseth, adviseth, plots with those that provide best for the Common-wealth, Thus are all sins beholding to hypocrisy: she maintains them at her own proper costs and charges.

… It is the worst of sins, because it counterfeits all virtues: he that counterfeits the King’s coin, is liable to death, if hypocrisy find not death, and (mortem sine morte) death without death, for counterfeiting the king of heaven’s Seal manual of grace, it speeds better then it merits: vice is made virtues ape in an hypocrite’s practise. If he see Chusi run, this Ahimaaz will outrun him: he mends his pace, but not his path: the goodman goes slower, but will be at heaven before him: thus thriftiness in a Saint, is counterfeited by niggardliness in an hypocrite: be thou charitable, behold he is bountiful, but not except thou may behold him: his vainglorious pride shall emulate thy liberality: thou art good to the poor, he will be better to the rich: he follows the religious man a far of, as Peter did Christ, but when he comes to the cross, he will deny him. Thus hypocrisy can but put blood into your cheeks, (like the Aliptae) and better your colours; but you may be sick in your consciences, and almost dead at the heart, and (non est medicamen in hortis) there is no medicine in this drugster’s shop can cure you.

… An hypocrite is a kind of honest Atheist: for his own Good is his God: his heaven is upon earth, and that not the Peace of his conscience, or that kingdom of heaven, which may be in a soul living on earth, but the secure peace of a worldly estate: he stands in awe of no Judge, but man’s eye; that he observes with as great respect, as David did the eyes of God; if man takes notice, he cares not, yet laughs at him for that notice, and kills his soul by that laughter: so Pigmalion-like, he dotes on his own carved and painted peace: and perhaps dies Zeuxis death, who painting an old woman, and looking merrily on her, brake out into a laughter that killed him. if the world doth not praise his doings, he is ready to challenge it, as the Jews God, wherefore have we fasted, and thou seest it not? he crosseth Christ’s precept: the left hand must be privy to the right hands charity, he dares not trust God with a penny, except before a whole congregation of witnesses, lest perhaps, God should deny the receipt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The white devil, or The hypocrite uncased: In a sermon preached at Paul’s Cross, March 7. 1612</cite>, (London: Melchisedech Bradwood, 1613), pp 29-30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

… It is the worst of sins, because it counterfeits all virtues: he that counterfeits the King’s coin, is liable to death, if hypocrisy find not death, and (mortem sine morte) death without death, for counterfeiting the king of heaven’s Seal manual of grace, it speeds better then it merits: vice is made virtues ape in an hypocrite’s practise. If he see Chusi run, this Ahimaaz will outrun him: he mends his pace, but not his path: the goodman goes slower, but will be at heaven before him: thus thriftiness in a Saint, is counterfeited by niggardliness in an hypocrite: be thou charitable, behold he is bountiful, but not except thou may behold him: his vainglorious pride shall emulate thy liberality: thou art good to the poor, he will be better to the rich: he follows the religious man a far of, as Peter did Christ, but when he comes to the cross, he will deny him. Thus hypocrisy can but put blood into your cheeks, (like the Aliptae) and better your colours; but you may be sick in your consciences, and almost dead at the heart, and (non est medicamen in hortis) there is no medicine in this drugster’s shop can cure you.

… An hypocrite is a kind of honest Atheist: for his own Good is his God: his heaven is upon earth, and that not the Peace of his conscience, or that kingdom of heaven, which may be in a soul living on earth, but the secure peace of a worldly estate: he stands in awe of no Judge, but man’s eye; that he observes with as great respect, as David did the eyes of God; if man takes notice, he cares not, yet laughs at him for that notice, and kills his soul by that laughter: so Pigmalion-like, he dotes on his own carved and painted peace: and perhaps dies Zeuxis death, who painting an old woman, and looking merrily on her, brake out into a laughter that killed him. if the world doth not praise his doings, he is ready to challenge it, as the Jews God, wherefore have we fasted, and thou seest it not? he crosseth Christ’s precept: the left hand must be privy to the right hands charity, he dares not trust God with a penny, except before a whole congregation of witnesses, lest perhaps, God should deny the receipt.”

— Thomas Adams, The white devil, or The hypocrite uncased: In a sermon preached at Paul’s Cross, March 7. 1612, (London: Melchisedech Bradwood, 1613), pp 29-30.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+the+worst+of+sins%2C+because+it+keeps+all+sins%3A+they+are+made+sure+and+secure+by+hypocrisy.+Indeed+some+vices+are+quarter-masters+with+it%2C+and+some+Sovereigns+over+it%3A+for+the+hypocrisy+is+but+another+sin+%E2%80%A6+except+to+content+some+affected+guest%2C+we+could+never+yield+to+this+filthy+Herodias.+It+is+made+a+stalking+horse+for+covetousness%2C+under+long+prayers+many+a+Pharisee+devours+the+poor%2C+houses%2C+goods+and+all.+It+is+a+complexion+for+lust%2C+who%2C+were+she+not+painted+over+with+a+religious+shew%2C+would+appear+as+loathsome+to+the+world%2C+as+she+is+indeed.%0A%0AIt+is+a+sepulchre+of+rotten+impostures%2C+which+would+stink+like+a+putrefied+corpse%2C+if+hypocrisy+were+not+their+cover.+It+is+a+mask+for+treason%2C+whose+shop-full+of+poisons%2C+pistols%2C+daggers%2C+gunpowder-trains%2C+would+easily+be+spied+out%2C+had+hypocrisy+left+them+bare-faced.+Treachery+under+this+vizard+thrusts+into+Court-revels%2C+nay%2C+Court-counsels%3B+and+holds+the+torch+to+sports%2C+nay+the+books+to+serious+consultations%3B+deviseth%2C+adviseth%2C+plots+with+those+that+provide+best+for+the+Common-wealth%2C+Thus+are+all+sins+beholding+to+hypocrisy%3A+she+maintains+them+at+her+own+proper+costs+and+charges.%0A%0A%E2%80%A6+It+is+the+worst+of+sins%2C+because+it+counterfeits+all+virtues%3A+he+that+counterfeits+the+King%E2%80%99s+coin%2C+is+liable+to+death%2C+if+hypocrisy+find+not+death%2C+and+%28mortem+sine+morte%29+death+without+death%2C+for+counterfeiting+the+king+of+heaven%E2%80%99s+Seal+manual+of+grace%2C+it+speeds+better+then+it+merits%3A+vice+is+made+virtues+ape+in+an+hypocrite%E2%80%99s+practise.+If+he+see+Chusi+run%2C+this+Ahimaaz+will+outrun+him%3A+he+mends+his+pace%2C+but+not+his+path%3A+the+goodman+goes+slower%2C+but+will+be+at

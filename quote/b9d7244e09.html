<blockquote><p>It is known that many take offence at tolling of bells, at a minister’s [civilly appropriate] gown while he preaches, at the naming of the days of the week, after the Heathen style from the seven planets… It is true, bells are abused by Papists… But these be scandals taken, and not given, for we read not of scandals culpable in God’s word, but there be some apparent moral reason in them. 2. The object scandalizing has no necessity, why it should be. … Things that fall under an affirmative precept, and these cannot be totally omitted, for eschewing scandal: for whatever God has commanded, is some way necessary. Therefore, it some ways, and in some cases may be done, though offence be taken at it; but branches, or parts of affirmative precepts may be omitted for eschewing of scandal, as such a particular kneeling in prayer, in such a place¹…</p></blockquote>

<blockquote><p>While that act stands unrepealed, or not annulled, it remains an act and rule of this Church still, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature.’ Now, as to the Brethren: [1] I cannot see any ground to say the sentenced anent them are not materially rescinded, seeing as the Assembly 1733 and their commission did cast them out from this Church, so the Assembly 1734 gave the synod of Perth power and full authority to restore and unite them again to the communion thereof, and to their ministerial charges, which accordingly was done by that synod: And this, in my opinion, was a material condemning of the sentences of the former Assembly and commission that had been pronounced against them. (2) But, whereas ’tis said the act of Assembly 1733 against them, while unrepealed, ‘It still remains an act and rule of this Church, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature,’ and therefore they cannot accede to the judicatories till that act is rescinded, lest they homologate that sinful deed or sentence. Now if this argument prove anything, it proves too much; for it says we are never to join with a Church which has made any unjust or sinful act till repealed: And so the Brethren could never be justified for joining formerly with the Church of Scotland when such unaccountable acts as that of the Assembly 1638, sessions 23-24, was unrepealed: which discharges all persons of whatever quality, ministers or others, to speak or write against that Assembly, or any act of that Assembly, under pain of the censures of the Church: A very bad precedent! And so the Assembly 1642, session 7, enjoins that every presbytery proceed against non-communicants, whether Papists or others, according to the act of parliament, which looks too like the English Sacramental Test: And also the above-cited act of Assembly 1648, anent deposing all suspended ministers who do not submit to the sentences of Church judicatories, and so of other bad acts of Assembly from 1638 to 1649 inclusive. And, if an act in a particular case is a rule in a way of precedent in similar cases, or cases of the like nature, then the instance of overturning the settlement made by the Commission at Auchtermuchty, and the repeated instances of our late General Assemblies in allowing the people of Stow, Troqueir, Dennie, etc. the privilege of sealing ordinances, are good precedents to plead in like cases where ministers are intruded upon Christian congregations. 4thly, They say: “Seeing an accession to a Church cannot be made but in the situation in which that Church is when the accession is made unto her; therefore any accession to her in that situation so far approves of her, as to submit it to her authority what is to be counted defections, and what not; and, if that Church maintain not that testimony which they that accede to her maintain, then they fall from their testimony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-f93f5805cc" data-kw="">
<blockquote><p>Sixteen of these [field] ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church: from the Reformation to the Disruption (London: Blackie &amp; Son, 1875)</cite>, pp. 328-331</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Sixteen of these [field] ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians.”

— Thomas M’Crie Jr., The Story of the Scottish Church: from the Reformation to the Disruption (London: Blackie &amp; Son, 1875), pp. 328-331">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSixteen+of+these+%5Bfield%5D+ministers+while+they+condemned+the+Erastianism+of+the+indulgence%2C+and+deplored+the+conduct+of+their+brethren+who+had+accepted+it%2C+were+not+prepared+to+exclude+them+from+their+ranks%2C+or+refuse+aid+from+them+in+the+common+cause.+Though+they+themselves+could+not+conscientiously+submit+to+the+restrictions%2C+or+the+acknowledgments+implied+in+that+insidious+measure%2C+they+were+disposed+to+make+allowances+for+such+of+their+brethren+as+had+yielded+under+strong+temptation+or+plausible+arguments%3B+and+they+argued%2C+that+whatever+ecclesiastical+censure+their+conduct+might+afterwards+be+found+to+deserve%2C+to+deny+them+in+the+meantime+the+opportunity+of+vindicating+their+rights+and+liberties%2C+civil+and+religious%2C+by+excluding+them+from+the+army%2C+would+be+no+less+presumptuous+and+unjust+in+principle%2C+than+it+was+preposterous+in+the+present+circumstances+of+the+country.+This+liberal+view+of+the+subject+was+opposed+by+only+two+of+the+ministers%2C+namely%2C+Mr.+%5BDonald%5D+Cargill+and+Mr.+%5BThomas%5D+Douglas%3B+but+these+were+supported+by+a+considerable+number+of+the+lay+leaders+of+the+army%2C+at+the+head+of+whom+was+Sir+Robert+Hamilton.+Hamilton+appears+to+have+been+a+pious+man%2C+and+of+good+intentions%3B+but+of+narrow+views%2C+severe+in+his+temper%2C+and+altogether+unqualified+by+want+of+military+talents+and+experience%2C+for+the+command+which+he+assumed.+He+is+charged%2C+and+apparently+not+without+reason%2C+with+having+been+active+in+pushing+Cargill%2C+Cameron%2C+and+some+other+ministers%2C+to+those+extremes+which+produced+a+breach+between+them+and+their+brethren%2C+with+whom+they+had+until+of+late+acted+in+concert.%C2%B3+%C2%B3+M%E2%80%99Crie%E2%80%99s+Mem.+of+Veitch%2C+%26c.%2C+Notices+of+James+Ure%2C+p.+452.+I+am

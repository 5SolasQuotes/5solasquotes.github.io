<main class="wrap"><figure class="quote" id="q-2c8e3ea429" data-kw="">
<blockquote><p>I do not with the Tridentine fathers approve the necessity of having images in churches, nor do I place any part of piety in them, but with Luther I place images among the adiaphora if they are not set up or used for worship and adoration.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa950a99bd" data-kw="Vernacular">
<blockquote><p>Because these original tongues are not known to all the people of God, who have a right unto, and interest in the Scriptures, and are commanded in the fear of God to read, and search them, therefore they are to be translated into the vulgar language of every nation unto which they come, that the Word of God dwelling plentifully in all, they may worship Him in an acceptable manner, and through patience and comfort of the Scriptures may have hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.8</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Because these original tongues are not known to all the people of God, who have a right unto, and interest in the Scriptures, and are commanded in the fear of God to read, and search them, therefore they are to be translated into the vulgar language of every nation unto which they come, that the Word of God dwelling plentifully in all, they may worship Him in an acceptable manner, and through patience and comfort of the Scriptures may have hope.”

</figure><figure class="quote" id="q-cb6006cb72" data-kw="">

</figure><figure class="quote" id="q-d12fdf0e2d" data-kw="">
<blockquote><p>Bishops, Priests, and Deacons, are not commanded by God&#x27;s Law, either to vow the estate of single life, or to abstain from marriage: therefore it is lawful for them, as for all other Christian men, to marry at their own discretion, as they shall judge the same to serve better to godliness.</p></blockquote>

</figure><figure class="quote" id="q-1adee36587" data-kw="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, p. 197</span></figcaption>

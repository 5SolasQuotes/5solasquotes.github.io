<main class="wrap"><figure class="quote" id="q-bb47c23da1" data-kw="">
<blockquote><p>First, ‘God’ (say they [Arminians]), ‘considering all mankind as fallen from that grace and favor in Adam where they were created, and excluded utterly from the attainment of salvation by virtue of the covenant of works which was at the first made with him, yet by his infinite goodness was inclined to desire the happiness of them all and every one, that they might be delivered from misery and be brought unto Himself, which inclination of his they call his universal love and antecedent will, whereby He would desirously have them all to be saved, out of which love He sends Christ.’ [Owen:] That God has any natural or necessary inclination by his goodness or any other property to do good to us or any of his creatures, we do deny: everything that concerns us is an act of his free will and good pleasure, and not a natural necessary act of his Deity, as shall be declared. Secondly, the ascribing an antecedent conditional will unto God, whose fulfilling and accomplishment should depend on any free contingent act or work of ours, is injurious to his wisdom, power and sovereignty, and cannot well be excused from blasphemy, and is contrary to Rom. 9:19, ‘Who hath resisted his will? I say.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus electorum, sanguis Jesu</cite>, … (London: W.W., 1648), bk. 2, ch. 4, pp. 91-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f08e5695a" data-kw="">
<blockquote><p>Rutherford states quite explicitly that it was Bradwardine who provided him with the solution to the philosophical conundrum of the ground of ethics… Bradwardine offered a subtler threefold division… Bradwardine’s basic distinction was between things which are reasonable naturally prior to the divine will, things which are reasonable naturally posterior to the divine will, and things which are said to be mixed. Within the first category are contained necessary truths about God, such as his being and goodness, which obtain prior to any act of his will… they are able to move the divine will. Within the second category are contained things which are reasonable posterior to God’s will, and which depend on God’s will for their reasonable status. These are therefore said to be caused by the divine will and can in no way move or determine it… Bradward likens it to the situation of someone choosing between two equal alternatives. For when someone chooses one of these, we say that this was a rational choice even though he could have also chosen the other. Within the third category are included reasonable things which are said to be conditionally rather than absolutely necessary. Thus while they do not themselves obtain naturally prior to the divine will, their reasonable status is crucially founded on truths which do obtain in this way… the creature’s duty to love and obey God. For althought the creature’s existence is dependent on the divine will, with the supposition that this creature is in existence it is absolutely reasonable that he should love and obey God and indeed this reasonable status cannot be changed even by God himself… Rutherford therefore had no difficulty transposing this into his own theory of moral complexes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simon-j-g-burton.html">Simon J.G. Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40, pp. 134-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-064de38f6e" data-kw="">
<blockquote><p>This law is eternal and divine, and therefore the universal principle and exemplar of all other rules. This law is immutable, and accordingly (as we should say with the scholastics) it is never ruled by any other law… the law is nothing other than the very wisdom of God that determines the rationale of what is lawful and unlawful in all things created according to his own image.</p></blockquote>

</figure><figure class="quote" id="q-908f580768" data-kw="">
<blockquote><p>I shall not now enquire whether these acts of Christ’s will and holy love did issue and proceed from Him per modum naturae [through the mode of nature, as Rutherford held; see below], or per modum rationis [through the mode of reason], as they speak in the Schools, or both; that is, whether they were only the natural weights and inclinations, and desires of the will and habit of charity to his own self-preservation, without any deliberation, such as is to be found in children before the use of reason; or whether they proceeded from Him out of a deliberate consideration and pondering, not so much of the now-impending evils and the fury of his Father’s wrath, as the love He bore to his own people the Jews, whose destruction and casting off He foresaw would be the consequents of his death: though Suarez seems to me to have proved the latter as well as the former.</p></blockquote>

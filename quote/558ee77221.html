</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b99b78b1d" data-kw="">
<blockquote><p>4. They, who truly fear the name of God [and refuse the ceremonies], are indeed scandalized by the prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified. But fiftly saith Mr. [John] Sprint, it offends the magistrate, by provoking him (persuaded and resolved as he is [as to the lawfulness of the ceremonies]) to disgrace these otherwise well deserving ministers, and to strike them with the sword of authority. Answer: Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will provoked Pharaoh the more to oppress them, or than Christ’s preaching of the truth and his abstaining from the superstitious ceremonies of the Pharisees provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed, and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2</cite>, ch. 1, p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-c96e6fed04" data-kw="">
<blockquote><p>IRONIA: ironic, taunting speeches may lawfully be used, as occasion serves. (1) God himself used them in Genesis 3:22. “The man is become as one of us” – as one of the Trinity, whereby God declares his great disdain of their affectation of an impossible preeminence in being like to God, which is to say: “By his sin he is become most unlike to us. See how well Satan hath performed his promise to man, is not he become like one of us? And hath not he gained a goodly measure of knowledge, both of good and evil?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ literarum, The Schools Guarded… (1655), Rhetorica Sacra, or a Synopsis of the most material Tropes and Figures contained in the Sacred Scriptures</cite>, pp. 167-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-188d83d849" data-kw="">
<blockquote><p>That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors: Toleration, Erastianism, Independency &amp; Separation… (d. 1667; Edinburgh: 1692), ‘Sermon preached before the synod at Glasgow, 1653’</cite>, pp. 246-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.”

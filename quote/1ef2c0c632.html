<main class="wrap"><figure class="quote" id="q-1ef2c0c632" data-kw="">
<blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote>
<figcaption>— <a href="../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 1, Art. 12</figcaption>
<div class="meta"><a class="tag" href="../topics/election/election-in-christ.html">Election in Christ</a><a class="tag" href="../topics/election/assurance-and-comfort-in-election.html">Assurance and Comfort in Election</a><a class="tag" href="../topics/assurance-peace-and-joy/spiritual-peace-and-joy.html">Spiritual Peace and Joy</a><a class="tag" href="../topics/assurance-peace-and-joy/doubts-and-fears.html">Doubts and Fears</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-506762ccac" data-kw="">
<blockquote><p>As the godly consideration of predestination and our election in Christ, is full of sweet, pleasant, and unspeakable comfort to godly persons, and such as feel in themselves the working of the Spirit of Christ, mortifying the works of the flesh, and their earthly members, and drawing up their mind to high and heavenly things, as well because it doth greatly establish and confirm their faith of eternal salvation to be enjoyed through Christ, as because it doth fervently kindle their love towards God…</p></blockquote>
<figcaption>— <a href="../authors/church-of-england.html">Church of England</a>, <cite>The Thirty-Nine Articles</cite>, 1563, Art. 17</figcaption>
<div class="meta"><a class="tag" href="../topics/election/ground-of-election.html">Ground of Election</a><a class="tag" href="../topics/election/election-in-christ.html">Election in Christ</a><a class="tag" href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></div>

</figure><figure class="quote" id="q-3eda47bbc3" data-kw="">
<blockquote><p>Our election … consisteth not in ourselves, but in the eternal and immutable good pleasure of God, and that in such absolute authority that it cannot be overthrown, neither by the raging storms of the world, nor by the assaults of Satan; neither yet by the wavering and weakness of our own flesh. Then only is our salvation in assurance, when we find the cause of the same in the bosom and counsel of God.</p></blockquote>
<figcaption>— <a href="../authors/john-knox.html">John Knox</a>, <cite>On Predestination</cite>, p. 33</figcaption>

</figure><figure class="quote" id="q-68e1533d1d" data-kw="">
<blockquote><p>The doctrine of the high mystery of predestination is to be handled with special prudence and care, that men attending the will of God revealed in His Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election; so shall this doctrine afford matter of praise, reverence, and admiration of God, and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.</p></blockquote>
<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith</cite>, 1689, 3.7</figcaption>

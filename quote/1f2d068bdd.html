<main class="wrap"><figure class="quote" id="q-1f2d068bdd" data-kw="">
<blockquote><p>(6.) They that want faith cannot bring forth fruit unto the glory of God. No more than these branches broken down can bear fruit, no more can a man without faith bring forth good fruit unto God. What is that which makes folk like briers and thorns? Whence their profanity, ungodliness, and throwing out oaths for every trifling matter? Is it not owing to their unbelief? And,

(7.) This is the woefulness of their case that want faith, that whatsoever they do is sin. “Whatsoever is not of faith is sin.” Everything that people do is sin, if they believe not. The very work and labour they are about is sin. Their plowing, their eating, their drinking, their walking, their sitting, their sleeping, and all that they do is sin. Their hearing, their reading, their praying is sin. And is not that a deplorable case, to have all that a man doeth looked upon as sin? And so it is with such as are destitute of the grace of faith.</p></blockquote>

<blockquote><p>Therefore the anchor of our faith hath two most unchangeable holds, namely the promise of God, and the oath of God: In both which it is impossible that God should lie. For as it is impossible that God should lie when he simply affirmeth: so is it more impossible (if there may be degrees in impossibilities) that God should lie when he sweareth.

And as it is impossible that God should lie or be forsworn: so is it impossible that any man or woman, which taketh hold of God’s promises by faith, should miss the performance of them, whatsoever seemeth to be lets or impediments unto them. For there can be no let or impediment so great, as should be able to compel God to lying or perjury, which be as great impossibilities as can be thought of.

For if the general or universal promises of God should not be granted to any one person that embraceth them by faith, God should be no more true of his word &amp; his oath, which is as impossible as that God should be no more God. For example, seeing God hath said: whosoever calleth upon the name of the Lord, shall be saved, if I poor wretch embracing this promise of God by faith, doo call upon the name of the Lord, whatsoever lets or impediments be in the way, it is impossible but that I shall be saved.

Therefore if all the Angels in heaven should tell me on their own credit, or as it were by God’s commandment, that I should be damned, I must hold them all accursed, rather then to grant that God should be a liar or perjured person. And forasmuch as Christ hath said: whosoever believeth and is baptised shall be saved, if I being baptised into the name of Christ, repose my whole trust &amp; confidence in him: whatsoever can be objected against me, I must of necessity be saved. For neither the justice of the law, nor the guiltiness of my sin, nor the accusation of the Devil, nor witness of mine own conscience, shall be able to condemn me, so long as I depend upon the promise of God. For there is now no condemnation to them that are in Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A comfortable sermon of faith, in temptations and afflictions Preached at S. Botolph’s without Aldersgate in London, the .xv. of February. 1573.</cite>, (London: John Awdeley, 1574), unpaginated.</span></figcaption>

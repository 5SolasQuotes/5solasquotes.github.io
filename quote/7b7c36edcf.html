<main class="wrap"><figure class="quote" id="q-7b7c36edcf" data-kw="">
<blockquote><p>CANON 9. Concerning the succor of God. It is a mark of divine favor when we are of a right purpose and keep our feet from hypocrisy and unrighteousness; for as often as we do good, God is at work in us and with us, in order that we may do so. CANON 10. Concerning the succor of God. The succor of God is to be ever sought by the regenerate and converted also, so that they may be able to come to a successful end or persevere in good works. CANON 11. Concerning the duty to pray. None would make any true prayer to the Lord had he not received from him the object of his prayer, as it is written, “Of thy own have we given thee” (1 Chron. 29:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange</cite>, (AD 529)</span></figcaption>

</figure><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>In fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Disp. 40, On the Church (vol. 2)</span></figcaption>

</figure><figure class="quote" id="q-ccf1687a01" data-kw="">
<blockquote><p>But where find we that women which were prophetesses and immediately inspired were allowed to deliver their prophesy in the Church [according to Gillespie’s objector]? I suppose he had a respect to 1 Cor: 11:5, ‘But every woman that prayeth or prophesieth with her head covered, dishonoureth her head,’ which is meaned of the public assembly, for the apostle is speaking of covering or uncovering the head in the Church. [The argument of the last statement is that one can know that the context in 1 Cor. 11 is of public assemblies of the Church (as opposed to private) because it mentions the practice of headcoverings. That is, headcoverings had a distinctively public function, likely to all such societal, public functions. This is confirmed below.] But diverse interpreters understand here by a woman that prays or prophesies, a woman that joins as a hearer in the public assembly: and so verse 4, by a man that prays or prophesies [signifies] a man that is a hearer and joins in the ordinances. So that the Geneva annotation upon verse 5 gives a good sense of that text: that women which show themselves in public and ecclesiastical assemblies without the sign and token of their subjection, that is to say, uncovered, shame themselves. See more for this in Junius, his annotations on the Arabic version in that place. If the apostle by ‘prophesying’, 1 Cor. 11:4-5, understand prophesying by immediate inspiration, then the objection may be retorted and turned into an argument against the objectors [who advocated for regular lay preaching]: For the sense of the word ‘prophesying’ in the 11th chapter may give light to the word prophesying in the 14th chapter, verse 3. Peter Martyr (Common Places, eccles. 4, ch. 1) is indeed of opinion that women which were prophetesses and extraordinarily inspired might speak in the Church, provided that their heads were covered, in token of feminine subjection, and that the forbidding of women to speak in the Church extends to such, and so he reconciles, 1 Cor. 14:34; 1 Tim. 2:13 with 2 Cor. 11:5. I doubt his opinion in this particular is not well grounded, only so far I make use of it: that if 1 Cor. 11:5 be meant of prophetesses praying or prophesying in the Church (which the Objector has to prove). Then certainly the forbidding of women to speak in the Church cannot be understood universally, but with a reserve and exception of extraordinary cases. But how can this exception of prophetesses consist with the text, ‘Let your women keep silence in the Church,’ Why [Greek] your women, they had prophesying women, as is supposed by these of the other opinion, from 1 Cor. 11:5. Nay, even your women must be silent says the apostle; and the reasons which he adds are so universal as to comprehend even prophetesses, they are commanded to be under obedience, and to be in subjection (which Martyr himself notes), holds true of prophesying women as well as others; and that for that cause their heads were to be covered. Another reason is added, 1 Tim. 2:14, Adam was not deceived; but the woman being deceived, was in the transgression. It might be feared, says Peter Martyr, if women were permitted to speak in the Church, Satan should return to his first wile and deceive the man by the woman. Surely he that made use of Eve might also make use of a prophesying woman to deceive, and so much the more, because, now since the fall, both man and woman are more subject to tentation. So that both the apostle’s command and the reasons of it seem plainly to exclude even prophesying women from speaking in the Church; and if they be allowed to deliver extraordinary prophesies and revelations in the Church, why not also to prophesy as other gifted members? If that which is greater be allowed them, why not that which is less? And if prophetesses be excepted from the rule, 1 Cor. 14:34, why not also other women of excellent gifts?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), | ch. 5, ‘Whether these prophets and prophesyings in the primitive Church, 1 Cor. 14; 12:28; Eph. 4:11, were extraordinary…’, pp. 75-76</span></figcaption>

 speak in the Church extends to such, and so he reconciles, 1 Cor. 14:34; 1 Tim. 2:13 with 2 Cor. 11:5. I doubt his opinion in this particular is not well grounded, only so far I make use of it: that if 1 Cor. 11:5 be meant of prophetesses praying or prophesying in the Church (which the Objector has to prove). Then certainly the forbidding of women to speak in the Church cannot be understood universally, but with a reserve and exception of extraordinary cases. But how can this exception of prophetesses consist with the text, ‘Let your women keep silence in the Church,’ Why [Greek] your women, they had prophesying women, as is supposed by these of the other opinion, from 1 Cor. 11:5. Nay, even your women must be silent says the apostle; and the reasons which he adds are so universal as to comprehend even prophetesses, they are commanded to be under obedience, and to be in subjection (which Martyr himself notes), holds true of prophesying women as well as others; and that for that cause their heads were to be covered. Another reason is added, 1 Tim. 2:14, Adam was not deceived; but the woman being deceived, was in the transgression. It might be feared, says Peter Martyr, if women were permitted to speak in the Church, Satan should return to his first wile and deceive the man by the woman. Surely he that made use of Eve might also make use of a prophesying woman to deceive, and so much the more, because, now since the fall, both man and woman are more subject to tentation. So that both the apostle’s command and the reasons of it seem plainly to exclude even prophesying women from speaking in the Church; and if they be allowed to deliver extraordinary prophesies and revelations in the Church, why not also to prophesy as other gifted members? If that which is greater be allowed them, why not that which is less? And if prophetesses be excepted from the rule, 1 Cor. 14:34, why not also other women of excellent gifts?”

in+the+11th+chapter+may+give+light+to+the+word+prophesying+in+the+14th+chapter%2C+verse+3.+Peter+Martyr+%28Common+Places%2C+eccles.+4%2C+ch.+1%29+is+indeed+of+opinion+that+women+which+were+prophetesses+and+extraordinarily+inspired+might+speak+in+the+Church%2C+provided+that+their+heads+were+covered%2C+in+token+of+feminine+subjection%2C+and+that+the+forbidding+of+women+to+speak+in+the+Church+extends+to+such%2C+and+so+he+reconciles%2C+1+Cor.+14%3A34%3B+1+Tim.+2%3A13+with+2+Cor.+11%3A5.+I+doubt+his+opinion+in+this+particular+is+not+well+grounded%2C+only+so+far+I+make+use+of+it%3A+that+if+1+Cor.+11%3A5+be+meant+of+prophetesses+praying+or+prophesying+in+the+Church+%28which+the+Objector+has+to+prove%29.+Then+certainly+the+forbidding+of+women+to+speak+in+the+Church+cannot+be+understood+universally%2C+but+with+a+reserve+and+exception+of+extraordinary+cases.+But+how+can+this+exception+of+prophetesses+consist+with+the+text%2C+%E2%80%98Let+your+women+keep+silence+in+the+Church%2C%E2%80%99+Why+%5BGreek%5D+your+women%2C+they+had+prophesying+women%2C+as+is+supposed+by+these+of+the+other+opinion%2C+from+1+Cor.+11%3A5.+Nay%2C+even+your+women+must+be+silent+says+the+apostle%3B+and+the+reasons+which+he+adds+are+so+universal+as+to+comprehend+even+prophetesses%2C+they+are+commanded+to+be+under+obedience%2C+and+to+be+in+subjection+%28which+Martyr+himself+notes%29%2C+holds+true+of+prophesying+women+as+well+as+others%3B+and+that+for+that+cause+their+heads+were+to+be+covered.+Another+reason+is+added%2C+1+Tim.+2%3A14%2C+Adam+was+not+deceived%3B+but+the+woman+being+deceived%2C+was+in+the+transgression.+It+might+be+feared%2C+says+Peter+Martyr%2C+if+women+were+permitted+to+speak+in+the+Church%2C+Satan+should+return+to+his+first+wile+and+deceive+the+man+by+the+woman.+Surely+he+that+made+use+of+Eve+might+also+make+use+of+a+prophesying+woman+to+deceive%2C+and+so+much+the+more%2C+because%2C+now+since+the+fall%2C+both+man+and+woman+are+more+subject+to+tentation.+So+that+both+the+apostle%E2%80%99s+command+and+the+reasons+of+it+seem+plainly+to+exclude+even+prophesying+women+from+speaking+in+the+Church%3B+and+if+they+be+allowed+to+deliver+extraordinary+prophesies+and+revelations+in+the+Church%2C+why+not+also+to+prophesy+as+other+gifted+members%3F+If+that+which+is+greater+be+allowed+them%2C+why+not+that+which+is+less%3F+And+if+prophetesses+be+excepted+from+the+rule%2C+1+Cor.+14%3A34%2C+why+not+also+other+women+of+excellent+gifts%3F%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Treatise+of+Miscellany+Questions%E2%80%A6+%28Edinburgh%2C+1649%29%2C+%7C+ch.+5%2C+%E2%80%98Whether+these+prophets+and+prophesyings+in+the+primitive+Church%2C+1+Cor.+14%3B+12%3A28%3B+Eph.+4%3A11%2C+were+extraordinary%E2%80%A6%E2%80%99%2C+pp.+75-76&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fccf1687a01.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ccf1687a01.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=But%20where%20find%20we%20that%20women,also%20other%20women%20of%20excellent%20gifts&amp;text=But%20where%20find%20we%20that%20women%20which%20were&amp;text=why%20not%20also%20other%20women%20of%20excellent%20gifts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

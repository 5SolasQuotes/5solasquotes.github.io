<main class="wrap"><figure class="quote" id="q-3901b51b26" data-kw="">
<blockquote><p>The holy Sire [Noah] is now gone forth at the appointed season; and beholding the dismal desolation, he offers an atoning sacrifice of every clean bird and beast, and the Lord smelled a savour of the rest. This naturally leads us to think of him who gave himself for us an offering and a sacrifice of a sweet smelling savour, — Eph. v. 2. So well pleased is God with Jesus Christ, that with him he establishes his covenant, and with all his seed, that they shall never come into condemnation.

Hear what himself declares by the mouth of the holy prophet Isaiah: “This is as the waters of Noah unto me: for as I have sworn that the waters of Noah shall no more go over the earth: so have I sworn that 1 would not be wroth with thee, nor rebuke thee, O thou afflicted, tossed with tempest, and not comforted.” — Isa. liv. 9. See how the frowning clouds now smile with the glorious colours of the rainbow, the cheerful token of God’s covenant. It is a bow, but it has no arrow; and the face of it is turned away from us, in token of reconciliation.

Such is the glorious transformation of all your afflictions by Jesus Christ, O ye heirs of righteousness. They are clouds indeed, dark clouds, but they shall not drown, nay, they shall fructify your soul, and make you revive as the corn. What before was an indication of wrath, and a cause of fear, is now a token of love, and an encouragement of faith. A rainbow forever encompasses the throne of your God, — Rev. iv. 3. though from it should proceed lightning and thunders, and voices. Though, like that mighty angel in the Revelation, — Isa. x. 1. he should be clothed with a cloud in the dispensations of his providence, his sunny face will produce a rainbow round about his head. He is ever mindful of his covenant, and you need not to fear the terrors of his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcewen.html">William McEwen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace and Truth, or, The Glory and Fulness of the Redeemer Displayed: In An Attempt to Explain, Illustrate, and Enforce, the Most Remarkable Types, Figures, and Allegories of the Old Testament. To which is added Thoughts of Various Subjects</cite>, (1763; Philadelphia PA: W. W. Woodward, 1821), pp 22-23.</span></figcaption>

<blockquote><p>Such as the worship is in Popery, where they teach and do many things contrary to the principles of faith, placing holiness and the worship of God in their own inventions, and seeking remission of sins, and the merit of eternal life in every beggarly superstitious observation and ceremony. But if by false manner of worship you understand every error, fault and corruption in matters of religion, which though they be evil and to be condemned, yet overthrow not the faith, nor the very essence of God’s true worship, but be in circumstances, or in parts that may be maimed, and yet the life remain: then I deny the proposition as most erroneous, false and heretical…</p></blockquote>

</figure><figure class="quote" id="q-739cd44fcb" data-kw="">
<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?

2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively.

3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</span></figcaption>

%99+%281+Cor.+15%3A9%29+There+is+no+necessity+to+expound+these+of+people+meeting+ordinarily+to+worship+God%3B+for+Herod+and+Saul+persecuted+all%2C+whither+apostles+or+professors+in+houses%2C+not+respecting+their+meeting+in+one+place%3B+Also+%5Bthat%5D+it+shall+follow+that+prayers+were+not+made+in+private%2C+but+only+in+the+church%2C+that+is%2C+in+the+convened+congregation+for+Peter%2C+which+is+absurd%3A+And+that+they+were+a+visible-church+is+clear%2C+else+Herod+and+Saul+could+not+persecute+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+for+Paul%E2%80%99s+Presbytery+in+Scotland%2C+%E2%80%A6+%281642%29%2C+ch.+7%2C+%E2%80%98If+there+be+No+True+Visible+Church+in+the+New+Testament%2C+but+Only+a+Congregation+Meeting+in+One+Place%2C+%26+No+Presbyterial+or+Representative+Church+%28as+They+Call+it%29+at+All%E2%80%99%2C+p.+81+Rutherford+is+arguing+against+the+novel+Independent+Church+government.+See+also+the+chapter+at+large.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F739cd44fcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/739cd44fcb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-holding-public-worship-church-courts-by-distance-though-technology-on-using-satellite-campuses-under-necessity-for-edification/#:~:text=1.%20The%20word%20%E2%80%98church%E2%80%99%20%5Bsay%20the,and%20Saul%20could%20not%20persecute%20them&amp;text=1.%20The%20word%20%E2%80%98church%E2%80%99%20%5Bsay%20the%20Independents%5D%20signifies&amp;text=else%20Herod%20and%20Saul%20could%20not%20persecute%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Donald Cargill’s theonomic views of the judicial law are further explicated in the Queensferry Paper of 1680, a document which was owned by many of the covenanting martyrs in their dying testimonies (for more on this see A cloud of witnesses for the royal prerogatives of Jesus Christ ). The teachings of the Queensferry Paper are thus part of the covenanted testimony for which the martyrs laid down their lives. Any divergence from its view of biblical penology, therefore, represents a serious departure from Covenanter principles.

In the third article of the Queensferry Paper, the adherents, in accordance with the National Covenant (1638) and Solemn League and Covenant (1643), bound themselves to extirpate gross sins and crimes against the first table of the law:

That we shall endeavour to our utmost, the extirpation of the kingdom of Darkness, and whatsoever is contrary to the kingdom of Christ, and especially Idolatry, and Popery in all the Articles of it, as we are bound in our National Covenant; and Superstition, Will-Worship, and Prelacy, with its Hierarchy, as we are bound in our Solemn League and Covenant; And that we shall with the same sincerity, endeavour (God giving us assistance) the overthrow of that Power that hath established that Prelacy and Erastianism over the Church, and exercises such a lustful and arbitrary Tyranny over the Subjects, seeking again to introduce Idolatry and Superstition in these Lands, contrary to our Covenants: And in a word, that we shall endeavour the extirpation of all the works of Darkness, and the Relics of Idolatry and Superstition, (which are both much enlarged and revived in our times,) and execute righteous judgment impartially (according to the word of God, and degree of offences) upon committers of those things, especially, to wit, the blasphemy, idolatry, atheism, sorcery, perjury, uncleanness, profanation of the Lord’s day, oppression, and malignancy, that thus being zealous of God’s glory, he may delight to dwell in the midst of us. [1]

What is important about this extract, for our present purposes, is that it demonstrates to us that the strictest Covenanters believed that the civil magistrate was to execute righteous judgment by punishing a multiplicity of crimes in accordance with biblical law – a central tenet of theonomy. Since many of the crimes listed above were punished in scripture with the death sentence, it is stretching credulity to think that Cargill would have consented to the modern notion that capital punishment only applies to murder.

Cargill also complained about the covenant-breaking regime in Scotland not upholding biblical jurisprudence:

So that it can no more be called a Government, but a lustful Rage, exercised with as little right reason, and with more cruelty then in Beasts, and they themselves can be no more called Governors, but publick Grassators, and publick Judgments, which all Men ought as earnestly to labour to be free of, as of Sword, Famine, or Pestilence raging amongst us; and besides, hath stopped (instead of punishing) the course of Law and Justice against Idolaters, Blasphemers, Atheists, Murderers, Incestuous and Adulterous, and other Malefactors; and instead of rewarding the Good, hath made Butcheries and Murthers on the Lords People, sold them as Slaves, Imprisoned, Forfaulted, Banished and Fined them, upon no other account, but for maintaining the Lords Right to rule Consciences, against the usurpations of Men, for fulfilling their Vows, and repelling unjust Violence, which innocent Nature allows to all; of which, and more particulars, we can give (we speak as before God) innumerable and sure instances …[2]

Obviously, he could not have said this if he had believed that the Mosaic judicials had been entirely set aside or that capital punishment was to be reserved for the single crime of murder. Instead, Cargill taught the magistrates of covenanted Scotland were to govern in accordance with biblical civil law:

Moreover, we declare that these Men whom we shall set over us, shall be engaged to govern us principally by that Civil or Judicial Law, given by God to His People of Israel, especially in matters of Life and Death, and in all other things also, so far as they teach, excepting only that Law, (viz. anent Slaves,) which does not agree with that Christian Liberty established in all Christendom (only violated by our Tyrants, and some others of late,) [obviously he is not saying that the Old Testament authorised chattel slavery, based on manstealing] and that of Divorces and Polygamy; the one being not a Law, but a permission granted upon the account of the hardness of their Hearts, the other being a sinful custom contrary to the first institution of Marriage, crept into the Church …[3]

Cargill avoids the extremist opinion that the entire judicial law of Moses remains binding, recognising that specifically Jewish laws have expired. Laws such as those permitting the heathen to be used by Israelites as unpaid bondservants were deemed to be incongruous with the inclusion of the Gentiles into the New Testament church (Colossians 4:1 teaches that servants are to be paid wages, which is not consistent even with voluntary bondservice). Nevertheless, Cargill does recognise that the parts of the judicial law which are also part of the moral law, especially those dealing with crime and punishment, are to be followed by the Christian magistrate.

[1] A true and exact copy of a treasonable and bloody-paper called, the fanticks new-covenant: which was taken from Mr. Donald Cargill at Queens-Ferry, the third day of June, 1680 (Edinburgh, 1680), p. 4.

[2] Ibid., p, 5. The reference to slavery reveals that the early Covenanters, in common with their later heirs, condemned chattel slavery as a form of manstealing.</p></blockquote>

<blockquote><p>The arrangement of the tunes in some of the Psalm-books is supposed by some to show that standing was the common posture in praise [during the late-1500’s and early-1600’s].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-sprott.html">George Sprott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Postures’</cite>, p. lix in Introduction to the Book of Common Order, pp. lviii-lx in eds. George W. Sprott &amp; Thomas Leishman, The Book of Common Order of the Church of Scotland, Commonly Known as John Knox’s Liturgy, &amp; the Directory for the Public Worship of God Agreed Upon by the Assembly of Divines at Westminster, with Historical Introductions &amp; Illustrative Notes (Edinburgh, 1868)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53bee3b9e5" data-kw="">
<blockquote><p>Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here (section 14) object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [a pseudonym for the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use[d] to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself [a papal apologist] distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgesse [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgesse himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the Sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more then non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, pp. 62-63</span></figcaption>

<blockquote><p>This gesture (says the Rejoinder [of the opponent]) may before, or by occasion of any of God’s ordinances, be performed lawfully to God. By occasion, I grant: but ‘before’ importes more: Might the Jews kneel before the cherubims of the vail, as they might before the ark? Might they kneel before the brazen-serpent? Might they before every ephod? May we before every pastor? When the Rejoinder has resolved these questions, we shall further consider.</p></blockquote>

<blockquote><p>11. …for they [Quakers] will salute no man, nor uncover their head, not only to their equals, but neither will they do it unto their superiors, nor give the least sign of respect, of honour, or of reverence in their gesture and carriage unto any whatsoever. And he [Robert Barclay] says he cannot see what we can say in defence of our practice. But we have shown above what is our ground: and we have seen the same practised by other worthy persons mentioned in Scripture… As concerning, says he, the fashions and customs of the nations, it is an evil argument for the practice of Christians, who should follow a better rule. Answer: And so we do follow a better rule; and yet we may follow the Law of nations, which is mostly gathered from the practice of nations, in things not contrary to the Law of God; for even the Law of nations, in such things, is a part of the Law of God, being but some particular applications or explications of the Law of Nature: And though no particular gesture, as a sign of respect and reverence, due to our equals or superiours, be universally received by all nations, yet the Law of Nations and their practice may teach us that by some one outward gesture or other we ought to witness our respect and declare that reverence that we owe to others: Christianity is no enemy to humanity and civility, whatever our morose and unmannerly Quakers dream.</p></blockquote>

<blockquote><p>For the more clear opening of the ensuing treatise it is necessary to speak somewhat of worship and adoration, and especially of these: 1. honor. 2. praise. 3. glory, 4. reverence. 5. veneration. 6. devotion. 7. religion. 8. service. 9. worship. 10. love. 11. obedience. 12. adoration. 1. Honor, is a testification of the excellency of any, Aristotle, Ethics, bk. 8, ch. 8; Aquinas, Honos est signum quoddam excellentiae. ‘Honour is a sign or expression of excellency in any,’ it does not import any superiority in the party whom we honor, as adoration does. [2.] Praise is a special honoring of any, consisting in words. [3.] Glory is formally the effect of honor, though it be taken, pro claritate, ‘for the celebrity’ or renownedness of any; yet glory seems to be founded upon celebrity, as its foundation. [4.] Reverence is a sort of veneration of a person for excellency connotating a sort of fear. [5.] Veneration is a sort of fear, and reverencing of a person: I see not well any difference between reverence and veneration, except that veneration seems to be some more, and comes nearer to adoration. [6.] Devotion is the promptitude, cheerfulness, or spiritual propension of the will to serve God; [7.] Religion is formally in this, when a man subjects himself to God, as to his supreme Lord, and thence arises to give him honor, as his God and absolute Lord. The two integral parts of religion are the subjection of the reasonable creature to God. 2. An exhibition of honour… [8.] Service is from the bond of subjection, to reverence God as an inferior or servant does his Lord and Master: A servant does properly do the will of his master for the gain or profit that redounds to his master… [9.] For worship formally is to give reverence to God for his excellency; in one and the same act we may both worship God and serve Him. Only service does include the obligation of a servant to a lord. As concerning [10.] love, faith and hope, they are internal worship, not properly adoration: Love as love does rather import an equality with the thing loved, and a desire of an union, rather than a submission. It is true, there is a perfection in that which we love, but not essentially to perfect the lover… Faith and hope may suppose a resting on a helper as a helper, and so are internal worship; if they be adoration formally may be a question… [11.] Obedience is founded, not formally upon God’s excellency, properly so called, but upon his jurisdiction and authority to command. [12.] Adoration is the subjection or prostration of soul or body to God in the due recognition and acknowledgement of his absolute supremacy. There is no need, that Vasquez [a Romanist] should deny that there is any internal adoration, for that adoration is only an external and bodily worship of God, can hardly be defended… as external adoration is an act by which we offer our bodies to God and subject the utter man to him, in sign of service and reverence to so supreme a Lord, so there is a heart-prostration and inward bowing of the soul answerable thereunto.</p></blockquote>

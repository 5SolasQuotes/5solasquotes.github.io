<main class="wrap"><figure class="quote" id="q-4966911299" data-kw="">
<blockquote><p>Is it not strange, to observe how carefully philosophers, who deplore the condition of world, and profess to expect its amelioration their speculations clear of every idea of Divine interposition? No builders of houses or cities were ever more attentive to guard the access of inundation and fire.

If He should but touch their prospective theories of improvement they would renounce them as defiled and fit only for vulgar fanaticism. Their system of Providence would be profaned by the intrusion of the Almighty. Man is to affect an apotheosis for himself, by the hopeful process of exhausting corruptions.

And should it take all but an endless series of ages, vices, and woes, to reach this glorious attainment, patience may sustain itself the while by the thought that when it is realized, it will be burdened with no duty of religious gratitude. No time is too long to wait, no cost too deep to incur, for the triumph of proving that we have no need of that one attribute of a Divinity, which creates the grand interest in acknowledging such a being the benevolence that would make us happy. But even if this triumph should found unattainable, the independence of spirit which has laboured for it must not at last sink into piety. This afflicted world, “this poor terrestrial citadel of man,” is to lock its gates and keep its miseries rather than admit the degradation of receiving help from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foster.html">John Foster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine and Human Agency in Christian Miscellany</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d6b1585704" data-kw="">
<blockquote><p>But you tell us, why we do so much avoid the Fathers.” I had rather you would tell us why you do so carefully avoid the Scriptures. “For” (say you) “they that cannot away with set times of Fasting, must needs be offended with Basil, Nazianzen, Leo, and Chrysostom, which have published excellent Sermons of Lent.” Christ ordained no set and ordinary fasts in the Gospel, Lent was appointed long after, and the manner of observing it in those times, was not one and the same in all Churches. We both allow and use public and Christian fasts which are fitted to the time and the Churches’ occasions: as for your appointed, and yearly solemn fasts, we do with good reason reject them, because they are full of superstition, and injurious unto Christian liberty. Our judgement of fasting is the same which Augustine hath taught: I find it not set down in any Commandment of the Lord, or his Apostles, what days we ought to fast, what not. Augustine then knew not these your set yearly ceremonies of fasting, nor your Lenten fast, which hath a certain time and number of days prescribed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to the Ten Reasons of Edmund Campian, the Jesuit</cite>, … (London, 1606), 133–34 [spelling and punctuation modified].</span></figcaption>

</figure><figure class="quote" id="q-f2b19ab676" data-kw="">
<blockquote><p>After affirming belief in the sufficiency of scripture for the doctrine and worship of the church in its First Head (“Of Doctrine”), the First Book of Discipline of the Church of Scotland (1560) called for all extra-biblical holy days to be abolished:

In which Books of Auld and New Testaments we affirm, that all things necessary for the instruction of the Kirk, and to make the man of God perfect, is contained and sufficiently expressed.

By the contrary Doctrine, we understand whatsoever men, by Laws, Counsels, or Constitutions have imposed upon the consciences of men, without the expressed commandment of God’s word; such as be [the] vows of chastity, forswearing of marriage, binding of men and women to several disguised apparels, to the superstitious observation of fasting days, difference of meat for conscience sake, prayer for the dead; and keeping of holy days of certain Sanctis commandit by man, such as be all those that the Papists have invented, as the Feasts (as they term them) of Apostles, Martyrs, Virgins, of Christmas, Circumcision, Epiphany, Purification, and other fond feasts of our Lady. Which things, because in God’s Scriptures they neither have commandment nor assurance, we judge them utterly to be abolished from this Realm; affirming farther, that the obstinate maintainers and teachers of such abominations ought not to escape the punishment of the Civil Magistrate.</p></blockquote>

<blockquote><p>The argument of this paper is that Byzantine Iconoclasm was a response to the rise of Islam. This is an old-fashioned point of view. First advanced by the Byzantines themselves, the theory of Saracen influence was accepted by older scholarship on the subject, and long remained academically respectable. In the last generation, however, it has fallen out of favour. Contemporary literature on the subject, though far from agreed in other respects, is virtually unanimous that, whatever may have been the causes of Iconoclasm, Islam was not among them… the assumption that the Byzantines paid attention to what the successful Arabs believed is now deemed unproven, unnecessary or even incredible. Yet the case for Islam seems so effortless that the determination to exclude it must strike the outsider as an almost wilful exercise of professional scepticism… it is considerably simpler to assume that it was the role of Islam to make epidemic what had hitherto been merely endemic [in Christianity]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patricia-crone.html">Patricia Crone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 3, ‘Islam, Judeo Christianity &amp; Byzantine Iconoclasm’ in From Kavad to al-Ghazali: Religion, Law &amp; Political Thought in the Near East c. 600 – c. 1100 Pre (Ashgate, 2005), pp. 59-96, p. 59</span></figcaption>

<blockquote><p>Not long since [during the times of Romanism] what a stir was there about the more than decent, even superstitious adorning of temples, and building of altars, and brave canopies, what sumptuous things and fine knacks had they, and all to set out a pompous superstitious way of worship? This altogether prevailed; as for the purity and simplicity of Gods ways and worship, how was it trampled under feet as an unworthy contemptible thing? But these things that for a while seemed so glorious, begin to vanish, and we hope ere long will come to nothing, the very memory of them shall perish, the purity of God’s worship, and the simplicity of the Gospel in God’s ordinances shall recover their beauty and glory when those braveries shall be no more.</p></blockquote>

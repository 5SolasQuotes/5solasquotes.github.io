<main class="wrap"><figure class="quote" id="q-7dff769bc3" data-kw="">
<blockquote><p>Other lords besides thee have had dominion over us. Not without cause do they complain that they are placed under a different dominion from that of God, for he had received them under his sole guardianship. Hence it follows that, if they had not been estranged from him, they would not have endured so hard a lot as to be exposed to the tyranny and caprice of enemies. It may be thought that the government of all princes is “besides God,” or different from that of God, even though they govern in his name. But the Prophet does not speak of those who govern for our benefit, but of those who are opposed to true worship and to holy doctrine.

David was indeed a ruler who exercised dominion separate from that of God, but at the same time he was a genuine servant of God for the general advantage of the whole people; and therefore he maintained the true religion, which those rulers wished altogether to overthrow. Most justly did it befall the Jews, that, in consequence of having refused to obey God, who treated them with the greatest kindness, they were subjected to the tyranny of wicked men.

There is an implied contrast between God and the pious kings who governed the people in his name and by his authority, and the tyrants who oppressed them by governing with most unjust laws. This will be made more evident by a similar passage in Ezekiel, “I gave them,” says God, “good laws, by which they might live; but because they did not execute my judgments, and despised my statutes, and profaned my Sabbaths, and cast their eyes upon the idols of their fathers, for this reason I gave them statutes that were not good, and judgments by which they could not live.” (Ezekiel 20:11, 24, 25.) Since they might formerly, through the blessing of God, have been prosperous and happy, if they had obeyed his word, the prophet Ezekiel threatens that they will be subjected to tyrants who will compel them to obey their cruel enactments, and that without profit or reward.

Isaiah now deplores a similar calamity. “When the Lord ruled over us, we could not be satisfied with our lot, and now we are compelled to endure severe tyranny, and suffer the just punishment of our wickedness.” The same complaint may be made by believers who live under the Papacy, or who in any way are compelled, by unjust laws, to observe superstition; for they are subject to a government which is “besides God,” or different from that of God, and endure bondage worse than barbarous, which not only fetters their bodies, but conducts their souls to torture and slaughter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 228-29.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b47d2af4ff" data-kw="">
<blockquote><p>At least let him who thinks it advantageous and allowable to kill himself kill his neighbour also, since the Scripture says: ‘Thou shalt love thy neighbour as thyself.’ But when no laws or lawful authorities give command, it is not lawful to kill another, even if he wishes and asks for it and has no longer the strength to live, as is clearly proved by the Scripture in the Book of Kings, where King David ordered the slayer of King Saul to be put to death, although he said that he had been importuned by the wounded and half-dead king to kill him with one blow and to free his soul struggling with the fetters of the body and longing to be released from those torments. Therefore, since everyone who kills a man without any authorization of lawful power is a murderer, anyone who kills himself will not be a murderer if he is not a man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Dulcitius, 420 (no. 204) in Saint Augustine Letters: Volume V, trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 32 (Washington D.C.: The Catholic University of America Press, 1956), p. 6.</cite></span></figcaption>

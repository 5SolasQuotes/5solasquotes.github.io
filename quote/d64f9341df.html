<main class="wrap"><figure class="quote" id="q-d64f9341df" data-kw="">
<blockquote><p>The word Testament is a Latin word, whereby the Greek word Diatheke is rendered, which the Greek Translators use to express the Hebrew word Berith, that is, Covenant. And thereby is properly understood the Covenant itself, which God hath made with mankind upon certain conditions to give them everlasting life: which Covenant is twofold, the Old and the New.

The Old is that which God made with the first man before the fall, wherein eternal life was promised upon condition of a thoroughly perfect, and keeping of the Law; and is therefore called the Legal Covenant, which God again propounded to the Israelites, that from thence they might learn to understand (seeing this condition is transgressed by all men, and can now be fulfilled by no man) that they must seek their salvation in another Covenant, which is called the New [Covenant,] and consisteth in this: That God hath appointed his Son for a Mediator, and promiseth eternal life upon condition that we believe in him; and is called the Covenant of Grace.

And this also in regard of the several administrations thereof unto mankind is called Old and New. The Old is the administration of the Covenant before the coming of the Mediator, which was promised to Abraham and his posterity [to come] of his seed, and prefigured by manifold Ceremonies laid down by Moses. The New is the administration of the same Covenant, since the Son of God, the Mediator of this Covenant came in the flesh, and hath accomplished man’s reconciliation with God. These two Covenants are of one kind as concerning their substance, forasmuch as in both forgiveness of sins, salvation and eternal life are promised upon condition of faith in the Mediator: but are different in respect of their several administrations, which in the New is much clearer, without figures, and extends itself unto all Nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-haak.html">Theodore Haak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Argument of the New Testament in The Dutch Annotations upon the Whole Bible</cite></span></figcaption>

<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: … 2. The nexus which intervenes between knowledge and will also demands that what one knows with the consciousness of knowledge, he also acknowledge according to the dignity and goodness of the thing which he observes in it; to which, attending, an intellectual being also tends and is borne toward it as toward a good thing—which belongs to the will. But this has place much more and more eminently in God, whose intellect, the more perfect it is, so much the more distinctly represents to His most absolute thought the truth and goodness of things in their objects: which things, when He approves, He wills well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

<blockquote><p>I answer that, It is necessary to assign an appetitive power to the soul. To make this evident, we must observe that some inclination follows every form: for example, fire, by its form, is inclined to rise, and to generate its like. Now, the form is found to have a more perfect existence in those things which participate knowledge than in those which lack knowledge. For in those which lack knowledge, the form is found to determine each thing only to its own being—that is, to its nature. Therefore this natural form is followed by a natural inclination, which is called the natural appetite. But in those things which have knowledge, each one is determined to its own natural being by its natural form, in such a manner that it is nevertheless receptive of the species of other things: for example, sense receives the species of all things sensible, and the intellect, of all things intelligible, so that the soul of man is, in a way, all things by sense and intellect: and thereby, those things that have knowledge, in a way, approach to a likeness to God, in Whom all things pre-exist, as Dionysius says (Div. Nom. v). Therefore, as forms exist in those things that have knowledge in a higher manner and above the manner of natural forms; so must there be in them an inclination surpassing the natural inclination, which is called the natural appetite. And this superior inclination belongs to the appetitive power of the soul, through which the animal is able to desire what it apprehends, and not only that to which it is inclined by its natural form. And so it is necessary to assign an appetitive power to the soul. … Reply Obj. 2: What is apprehended and what is desired are the same in reality, but differ in aspect [ratione]: for a thing is apprehended as something sensible or intelligible, whereas it is desired as suitable or good. Now, it is diversity of aspect in the objects, and not material diversity, which demands a diversity of powers. Reply Obj. 3: Each power of the soul is a form or nature, and has a natural inclination to something. Wherefore each power desires by the natural appetite that object which is suitable to itself. Above which natural appetite is the animal appetite, which follows the apprehension, and by which something is desired not as suitable to this or that power, such as sight for seeing, or sound for hearing; but simply as suitable to the animal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 80, Appetitive Powers in General, art. 1, Whether the appetite is a special power of the soul?</span></figcaption>

<blockquote><p>As therefore I have showed in what sense the covenant of grace is called “the new covenant,” in this distinction and opposition, so I shall propose sundry things which relate unto the nature of the first covenant, which manifest it to have been a distinct covenant, and not a mere administration of the covenant of grace: — 1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends.</p></blockquote>

<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>

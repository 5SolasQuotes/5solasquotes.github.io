<blockquote><p>God condescends to speak after the manner of men that we may understand him: and here we are not to think that God wants anything needful to him; he is God blessed for ever; or that he labours under any defect of power that he cannot accomplish what he would have, nor that he is capable of any uneasiness or desire of what he has not. To admit of any of those which commonly are found in men when they wish, were to blaspheme the Lord.</p></blockquote>

<blockquote><p>[Attributes of God are classified] Into Absolute and Relative, which imply a Relation to the creatures with Himself, and are founded in Absolutes. Thus an Absolute Attribute of God is Goodness, but a Relative Attribute is Mercy, which pertains to the Goodness of God, but additionally involves a regard to a miserable creature. Immensity is an Absolute Attribute, but Omnipresence is Relative, because it indicates a relation to created things, in all which it asserts the presence of God. Vindictive Justice is a Relative Attribute, indicating a relation to a creature, sinful and worthy of punishment; but it is founded in an Absolute Attribute, divine Holiness. And so, although that relation did not obtain before the things were created, nevertheless the Relative Attributes are able truly to be said to be Essential to God, because they are always applicable to God with respect to their foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuous Commentary on Johannes a Marck</cite>, (1761-1772), IV:19, ‘Classification of God’s Attributes: Absolute &amp; Relative’</span></figcaption>

</figure><figure class="quote" id="q-9997402f31" data-kw="">
<blockquote><p>The properties of God are either absolute or relative. The absolute properties of God are such as may be considered without the supposition of any thing else whatever, towards which their energy and efficacy should be exerted. His relative are such as, in their egress and exercise, respect some things in the creatures, though they naturally and eternally reside in God. Of the first sort is God’s immensity ; it is an absolute property of his nature and being. For God to be immense, infinite, unbounded, unlimited, is as necessary to him as to be God ; that is, it is of his essential perfection so to be. The ubiquity of God, or his presence to all things and persons, is a relative property of God ; for to say that God is present in and to all things supposes those things to be. Indeed, the ubiquity of God is the habitude of his immensity to the creation. Supposing the creatures, the world that is, God is by reason of his immensity indistant to them all;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae</cite>, ch. 2, ‘Of the Nature of God’, p. 93 in Works, vol. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-b8736c5415" data-kw="">
<blockquote><p>The other thing expressed in these invitations, is a sort of dislike, grief, or sorrow; (it’s a speech borrowed from man, for there is no disappointing of the Lord’s will, nor sorrow in him for the not fulfilling of it) or an earnest nilling and hating dislike, that these two should not go along, as approved efficaciously by us, to wit, the creatures obedience of Faith, and life eternal. God loveth, approveth the believing of Jerusalem, and of her children, as a moral duty, as the hen doth love to warm and nourish her chickens; and he hateth, with an exceeding and unfained dislike of improbation and hatred, their rebellious disobedience, and refusing to bee gathered: but there is no purpose, intention, or decree of God holden forth in these invitations called his revealed will, by which he saith, he intendeth and willeth that all he maketh the offer unto, shall obey and be saved.

But it’s to be observed, that the revealed will of God, holden forth to all, called voluntas signi, doth not hold forth formally, that God intendeth, decreeth, or purposeth in his eternal counsel, that any man shall actually obey, either elect or reprobate; it formally is the expression only of the good liking of that moral and duty-conjunction between the obedience of the creature, and the reward, but holdeth forth not any intention or decree of God, that any shall obey, or that all shall obey, or that none at all shall obey; and what Arminians say of Christ’s intention to die for all, and every one; and of the Lord’s intention and Catholic good will, to save all and every one; to wit, that these desires may be in God, though not any be saved at all, but all eternally perish, which maketh the Lord’s desires irrational, unwise, and frustraneous, that we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect, though not any one of men or Angel obey, if there were not going along with this will of God, another will, and eternal decree and purpose in God, of working by free grace in some chosen ones, what the Lord willeth in his approving will; and another decree in the which the Lord purposeth to deny his saving grace, upon his absolute liberty to others, that being left to the hardness of their own hearts, they may freely disobey, and be the sole Author’s of their own damnation. Now because Arminians deny any such two decrees in God, but assert only such as depend wholly in their fulfilling, on the free will of Men and Angels, and all the decrees of God may be frustrated and disappointed by Men and Angels; as if the poor short-sighted creature, not the Sovereign Creator were carver, and Lord of the decrees, and Master of work in fulfilling of these counsels.

We reject their Catholic intentions and decrees, to save and redeem all and every one, which they vainly fancy to be in God, as repugnant to his will, which is irresistible, and cannot miss its end. 2. To his immutability, which cannot be compelled to take a second port, whereas he cannot sail the first. 3. To his Omnipotency, who cannot be resisted, 4. To his happiness, who cannot come short of what his soul desires. 5. To his wisdom, who cannot aim at an end, and desire it with his soul, and go about it, by such means, as he seeth shall be utterly uneffectual, and never produce his end, and not use these means, which he knoweth may, and infallibly doth, produce the same end in others.

Now this desire of approbation is an abundantly sufficient closing of the mouth, of such as stumble at the Gospel, being appointed thereunto, and an expression of Christ’s good liking to save sinners. Expressed in his borrowed wishes, Deut. 5.29. O that there were such a heart in them, that they would fear me, and keep my commandments. Psal. 81.13. O that my people had hearkened unto me, and Israel walked in my ways. Which wish, as relating to disobeying Israel, is a Figure, or Metaphor borrowed from men, but otherwise sheweth how acceptable the duty is to God, how obligatory to the creature. 2. By the Lord’s expostulations, Ezek. 18.31 Why will ye die, O house of Israel. Verse 32. For I have no pleasure in the death of him that dies. 3. In the Lord’s crying to sinners. Prov. 1.20. Wisdom cries, she uttereth her voice in the streets. The Word is to cry with strong shouting, either for joy, Psalm. 81.2. or sorrow, Lament. 2.19. which expresseth Christ’s desire to save sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself, or, A survey of our Saviour in his soul-suffering, his loveliness in his death, and the efficacy thereof</cite>, (London: Andrew Crooke, 1647), Part III, pp 443-45.</span></figcaption>

all+and+every+one%3B+to+wit%2C+that+these+desires+may+be+in+God%2C+though+not+any+be+saved+at+all%2C+but+all+eternally+perish%2C+which+maketh+the+Lord%E2%80%99s+desires+irrational%2C+unwise%2C+and+frustraneous%2C+that+we+say+with+good+reason+of+God%E2%80%99s+good+will%2C+called+voluntas+signi%2C+it+might+have+its+complete+and+entire+end+and+effect%2C+though+not+any+one+of+men+or+Angel+obey%2C+if+there+were+not+going+along+with+this+will+of+God%2C+another+will%2C+and+eternal+decree+and+purpose+in+God%2C+of+working+by+free+grace+in+some+chosen+ones%2C+what+the+Lord+willeth+in+his+approving+will%3B+and+another+decree+in+the+which+the+Lord+purposeth+to+deny+his+saving+grace%2C+upon+his+absolute+liberty+to+others%2C+that+being+left+to+the+hardness+of+their+own+hearts%2C+they+may+freely+disobey%2C+and+be+the+sole+Author%E2%80%99s+of+their+own+damnation.+Now+because+Arminians+deny+any+such+two+decrees+in+God%2C+but+assert+only+such+as+depend+wholly+in+their+fulfilling%2C+on+the+free+will+of+Men+and+Angels%2C+and+all+the+decrees+of+God+may+be+frustrated+and+disappointed+by+Men+and+Angels%3B+as+if+the+poor+short-sighted+creature%2C+not+the+Sovereign+Creator+were+carver%2C+and+Lord+of+the+decrees%2C+and+Master+of+work+in+fulfilling+of+these+counsels.%0A%0AWe+reject+their+Catholic+intentions+and+decrees%2C+to+save+and+redeem+all+and+every+one%2C+which+they+vainly+fancy+to+be+in+God%2C+as+repugnant+to+his+will%2C+which+is+irresistible%2C+and+cannot+miss+its+end.+2.+To+his+immutability%2C+which+cannot+be+compelled+to+take+a+second+port%2C+whereas+he+cannot+sail+the+first.+3.+To+his+Omnipotency%2C+who+cannot+be+resisted%2C+4.+To+his+happiness%2C+who+cannot+come+short+of+what+his+soul+desires.+5.+To+his+wisdom%2C+who+cannot+aim+at+an+end%2C+and+desire+it+with+his+soul%2C+and+go+about+it%2C+by+such+means%2C+as+he+seeth+shall+be+utterly+uneffectual%2C+and+never+produce+his+end%2C+and+not+use+these+means%2C+which+he+knoweth+may%2C+and+infallibly+doth%2C+produce+the+same+end+in+others.%0A%0ANow+this+desire+of+approbation+is+an+abundantly+sufficient+closing+of+the+mouth%2C+of+such+as+stumble+at+the+Gospel%2C+being+appointed+thereunto%2C+and+an+expression+of+Christ%E2%80%99s+good+liking+to+save+sinners.+Expressed+in+his+borrowed+wishes%2C+Deut.+5.29.+O+that+there+were+such+a+heart+in+them%2C+that+they+would+fear+me%2C+and+keep+my+commandments.+Psal.+81.13.+O+that+my+people+had+hearkened+unto+me%2C+and+Israel+walked+in+my+ways.+Which+wish%2C+as+relating+to+disobeying+Israel%2C+is+a+Figure%2C+or+Metaphor+borrowed+from+men%2C+but+otherwise+sheweth+how+acceptable+the+duty+is+to+God%2C+how+obligatory+to+the+creature.+2.+By+the+Lord%E2%80%99s+expostulations%2C+Ezek.+18.31+Why+will+ye+die%2C+O+house+of+Israel.+Verse+32.+For+I+have+no+pleasure+in+the+death+of+him+that+dies.+3.+In+the+Lord%E2%80%99s+crying+to+sinners.+Prov.+1.20.+Wisdom+cries%2C+she+uttereth+her+voice+in+the+streets.+The+Word+is+to+cry+with+strong+shouting%2C+either+for+joy%2C+Psalm.+81.2.+or+sorrow%2C+Lament.+2.19.+which+expresseth+Christ%E2%80%99s+desire+to+save+sinners.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+dying+and+drawing+sinners+to+himself%2C+or%2C+A+survey+of+our+Saviour+in+his+soul-suffering%2C+his+loveliness+in+his+death%2C+and+the+efficacy+thereof%2C+%28London%3A+Andrew+Crooke%2C+1647%29%2C+Part+III%2C+pp+443-45.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb8736c5415.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b8736c5415.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/28/samuel-rutherford-on-gospel-invitations-divine-intentions-and-anthropopathisms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Of love, mercy, and grace, the condition is something otherwise: principally they denote God’s essential goodness and kindness, which is eminent amongst his infinite perfections; and secondarily the effects thereof… The apostle tells us that God is “blessed forever,” Rom. 9:5; “He is the blessed and only Potentate,” 1 Tim. 6:15; ‘God all-sufficient’ Gen. 17:1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can He be blessed, is He all-sufficient who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like?</p></blockquote>

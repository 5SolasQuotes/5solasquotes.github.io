<main class="wrap"><figure class="quote" id="q-ad3beebfd8" data-kw="">
<blockquote><p>Rutherford, in the following year, joined in [Charles] Herle’s crusade against Congregationalism with his famous work, ‘The Due Right of Prebyteries’ (1644). In reply to Herle, [Richard] Mather and William Tompson published, ‘A Modest &amp; Brotherly Answer To Mr. Charles Herle’ (1644). Also, refuting both Herle and Rutherford, Mather wrote another work, ‘A Reply to Mr. Rutherford’ (1647). It should be remembered that Rutherford’s The Due Right of Prebyteries (1644) itself was his critical review of both Mather’s ‘Church Government and Church Covenant Discussed’ (1643) and [John] Cotton’s ‘The Way Of The Churches Of Christ In New-England’, whose manuscript was widely circulated in England even a few years before its publication in 1645. By 1644, Rutherford was already involved in another round of debate, which was set off by John Cotton. Particularly, Cotton’s ‘The Keys Of The Kingdom Of Heaven’ (1644) was so influential in England that John Owen, a Presbyterian, became convinced that Cotton was right and, finally, supported the Congregational form of church government.¹ ¹ See John Owen’s Preface in A Defence of Mr. John Cotton from the Imputation of Self-Contradiction Charged on Him by Mr. Daniel Cawdrey (Oxford: H. Hall for T. Robinson, 1658)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, or a Peaceable Plea for the Government of the Church of Scotland… (London, 1644) ToC | Sang Ahn, Covenant in Conflict</cite>, pp. 61:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2fe5b8374" data-kw="">
<blockquote><p>…therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God… And as touching things of prudence, they are things properly mixed, as at what hour sermon shall begin in such a church, at eight, or nine, or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; For to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12, not to [the] imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government... (1646)</cite>, p. 6</span></figcaption>

</figure><figure class="quote" id="q-7837e003eb" data-kw="">
<blockquote><p>Here he argued that when schism threatened the unity of a church a presbytery could appoint a temporary bishop, similar to the post-reformation superintendents. This type of bishop would be subject to the jurisdiction of a provincial or national synod, acting in a capacity akin to that of a constant moderator… For Baillie this temporary office was not ‘wicked in itself or contrair to the word of God;’ indeed, Baillie could not cite any ‘classic divine of the Reformed churches’ who maintained that such an episcopate was unlawful… Temporary bishops were only instituted by ecclesiastical canon, implying that scriptural and patristic sources did not explicitly condemn such practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55</cite>, p. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-195c7abe03" data-kw="">
<blockquote><p>§ 10. 1. False doctrine is directly scandalous: for it seduces the judgment, which then misguides the will, which then misrules the rest of the faculties! False doctrine, if it be in weighty practical points, is the pernicious plague of souls and nations.</p></blockquote>

</figure><figure class="quote" id="q-44b00e766c" data-kw="">
<blockquote><p>…in such cases, where two parts of a Church are divided, having independent authorities as to one another, and there being contrary determinations in the same question, it seems convenient and necessary for peace, that either both should waive their decisions, or that both should permit the decisions of each other to stand and be in force, to such only as should acquiesce therein, and willingly acknowledge the same.</p></blockquote>

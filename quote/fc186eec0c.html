<main class="wrap"><figure class="quote" id="q-fc186eec0c" data-kw="">
<blockquote><p>The apostle does not deny that those who do the law will inherit righteousness and life if they fulfill it completely, but he says that because they cannot fulfill the law completely they obtain neither righteousness nor life. The defenders of salvation by works quote this text of Leviticus to counter free justification, but they do not know what to make of the bit that denies that human nature is capable of doing this. If they thought about it properly they would see that the passage of Leviticus does not support their position.

We do not deny that those who fulfill the law perfectly will inherit life and righteousness, but because nobody actually does this, there is no one who obtains either righteousness or life from it. We are happy to admit to those who defend the keeping of the law that life and righteousness are the results of keeping it perfectly, but we want them to admit to us that keeping the law perfectly is beyond our abilities. There is nothing particularly odd about saying that those who keep the law perfectly can obtain life and righteousness, but there is nobody who keeps the law perfectly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 101.</span></figcaption>

86eec0c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/12/02/erasmus-sarcerius-on-law-keeping-and-inheriting-life/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f455066f86" data-kw="">
<blockquote><p>26. Therefore, every true Christian who has actually returned into the grace of God, being now constituted in a state of grace, has a twofold righteousness—not acquired by his own free will or the powers of nature, but given to him by God through Christ—and both are necessary for his salvation: one imputed, the other inherent. The imputed is that which Christ has performed for him, to satisfy for all sins committed by him throughout his whole life; the inherent is that by which, through divine grace in Christ, he begins inwardly more and more to cease from sins to be committed hereafter, and strives most diligently to observe the divine law exactly. For by that imputed righteousness of Christ he is not freed from the keeping of the law, but rather bound to it more closely.</p></blockquote>

</figure><figure class="quote" id="q-09706511d9" data-kw="">
<blockquote><p>When I lately read one saying: “That this was one principle that the Church of England went on, in the Reformation, that faith and works have the same consideration in the business of justification,” I could not but stand amazed, and conclude that either he or I had been asleep ever since we were born; or that there were two Churches of England, – one that I never knew, and another that he never knew; or else that prejudice is powerful, and makes men confident. Is that the doctrine of the Church of England, as they call it? When, where, by whom was it taught, but by Papists and Socinians, until within a very few years, in England? What place hath it in confessions, homilies, liturgies, controversy writers, or any place of repute for learning and religion in England?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Strength of Faith in Posthumous Sermons. Part II</cite></span></figcaption>

</figure><figure class="quote" id="q-d94a4e8666" data-kw="">
<blockquote><p>This new state of Justification is continuing and permanent; not in this sense, that God renews and frequently reiterates the enstating of them into this new relative state; but in this sense, that once justified always justified; they are fixed and preserved in that state: as adoption is a permanent state, because once adopted always a child of God. Hence it is called a grace, wherein we stand Rom. 5:2. It is a state of reconciliation and Peace wherein we stand. It is no fluctuating state, wherein one may be to day and be out of it tomorrow, and again brought into it. The ground of this sentence is fixed, lasting and permanent, to wit, the imputation of the righteousness of Christ: once clothed therewith, never naked or spoiled thereof again; the gifts and calling of God being without repentance Rom. 11:29. The soul’s union with Christ through faith, is lasting and abiding: once in him, always in him, once a member of his mystical body, and married to him, as his spouse, and always so, for he must finally present all such holy and without spot, or wrinkle, or any such thing Ephes. 5:27. Faith whereby the knot is made, and the marriage consent is given, remains, as to its root and habit, Christ prays, that it fail not. Luk. 22:32. They are kept by the power of God through faith unto salvation. 1. Pet. 1:5. All the arguments proving perseverance of the saints, which we cannot here sum-up, do confirm this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life of Justification Opened</cite>, (n.p., 1695), 263 (Editor’s note: Spelling modernized).</span></figcaption>

</figure><figure class="quote" id="q-0d7f8eb7ed" data-kw="">
<blockquote><p>One reason, therefore, why the Lord displayed the law as a covenant of works* on Sinai was that self-righteous Israelites and all pharisaic professors to the end of time might see that as they have sinned and so have not performed perfect obedience, it is absolutely impossible for them to attain justification and eternal life on the footing of their own works (Rom. 3:20). The law was there displayed in its covenant form in order to discover sin and condemn for it and so to stir up secure sinners to inquire after the perfect fulfillment of it by the second Adam (Deut. 27:26), for until self-righteousness is overthrown, a man will never submit to the righteousness of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 69.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-2954cf3d83" data-kw="">
<blockquote><p>Christ preached the Gospel to those that He knew sinned against the Holy Ghost, to the Pharisees who persecuted Christ to death and others, Mt. 12:31-34; Jn. 15:22-25; Jn. 7:28-29; Jn. 12:35-38; Jn. 10:31-32; Jn. 11:47-48… the word is a converting ordinance out of question, and preached to heathen and to the non-converted, though they refuse to embrace and believe the Gospel, and refuse to entertain the preachers of it: as is clear, Acts 19:22-25; Tit. 1:10-13; 2 Tim. 3:25-27. The texts that Master Prynne alledges, that the Gospel should not be preached to heathen who refuse to embrace and believe the Gospel, to wit, Mt. 10:14-15; Lk. 9:5; Acts 13:46, are to no purpose, for Mt. 10; Lk. 9, is but a temporary commandment, given for a time, that the disciples should depart from those houses of Judea (there is nothing of the heathen; but by the contrary the apostles are forbidden to go to Samaritans or gentiles at all, Mt. 10:5-6 [which was unique to those circumstances]) who would not receive the peace of God in the Gospel, which precept the apostles in the story of the Acts did not observe, but preached the Gospel to many heathen who refused to embrace and believe the Gospel: As Acts 16 and 17, and 19:2. The place Acts 13:15 is meant of the blaspheming Jews, to whom Paul preached long after they persecuted and stoned the prophets, and had killed the Lord of life, Acts▪2 and 4, and 8, and 9; Mt. 23:37-38. 3. Those places, are to better color of purpose brought by Arminians and Socinians to prove that the Gospel is preached to people for their good entertainment thereof, and denied to others for their unworthiness, and because they will not welcome it; So the Arminians in the conference at Hague, pp. 87-89, God sends the Gospel not according to his absolute will, sed ob alias causas in homine latent•s, for secret causes in man. Arminius, Against Perkins, p. 199, ‘The will of God in sending the Gospel has causes in the will of man according to that,’ habenti dabitur: So Corvinus, Ad Wallachros, p. 44. Socinus, Commentary on 1 Jn. 4, p. 307 says the same: and Mr. Prynne is pleased in the same sense to cite them, I conceive imprudently, for I believe that Reverend and learned man does hate those impious sects, the enemies of the grace of God; but truly if this be a rule to pastors to spread the Gospel, that they are to offer and give the pearl of the preached Gospel to those that willingly receive it and harbour the preachers, and presently to depart and preach no more the Word of the Kingdom to those who refuse it, as the places Mt. 10:14 and Lk. 9:5 carry that sense, because they are heathens who refuse to embrace and believe the Gospel, and harbor the preachers, as (the worthy divine says) conceiving that to be a casting of pearls to dogs and swine; I see not how the preachers and spreaders of the Gospel to the heathen are to believe that God out of mere grace and the good pleasure of his will, without respect to good or bad deserving, sends the Gospel to some and denies it to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 23, pp. 516-18</span></figcaption>

<blockquote><p>The design of Christ was not like Mahomet’s, to get himself an earthly kingdom and numerous followers merely to cry up his name: and therefore He will not indulge men in their sin, nor abate or alter the conditions of his Covenant to win disciples: He will have his ministers deal plainly with all to whom they preach, and let them know that without self-denial and forsaking all (in estimation and resolution) and a willing exchange of earth for heaven, they cannot be his true disciples: Nor without a professed consent to thus much, they cannot be his visible professed disciples. But all that will not repent must perish. And therefore in their baptism they must profess a renunciation of all competitors.</p></blockquote>

<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it: 1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein. 2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita. 3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it: 1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein. 2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita. 3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.”

— George Gillespie, An Assertion of the Government of the Church of Scotland (1641), p. 53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+what+can+be+the+reason%2C+may+some+man+say%2C+why+the+Scripture+has+not+itself+determined+these+kinds+of+assemblies+%5Bsynods%2C+general+assemblies%2C+etc.%5D+particularly%3F+I+answer%2C+three+reasons+may+begiven+for+it%3A+1.+Because+it+was+not+necessary%2C+the+general+rules+of+the+word%2C+together+with+nature%E2%80%99s+light%2C+which+directeth+commonwealths+in+things+of+the+same+kind%2C+being+sufficient+to+direct+the+church+therein.+2.+As+seasons+and+times+for+the+meeting+of+assemblies+%2C+so+the+just+bounds+thereof+in+so+many+different+places+of+the+world+are+things+of+that+kind+which+were+not+determinable+in+Scripture%2C+unless+the+world+had+been+filled+with+volumes+thereof%3B+for%2C+individua+sunt+infinita.+3.+Because+this+constitution+of+synods%2C+provincial+and+national%2C+is+not+universal+for+all+times+and+places%3B+for+example%2C+there+may+bein+a+remote+island+ten+or+twelve+Christian+congregations%2C+which%2C+beside+their+particular+elderships%2C+have+a+common+presbytery%2C+but+are+not+capable+of+synods%2C+either+provincial+or+national.+Again%2C+let+there+be+an+island+containing+forty+or+fifty+Christian+congregations%2C+there+shall+be+therein%2C+beside+presbyteries%2C+one+kind+of+a+synod%2C+but+not+two+kinds.+Besides%2C+the+reformed+congregations+within+a+great+nation+may+haply+%5Bby+chance%5D+be+either+so+few%2C+or+so+dispersed+and+distant%2C+or+so+persecuted%2C+that+they+can+neither+have+provincial+nor+national+assemblies.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+An+Assertion+of+the+Government+of+the+Church+of+Scotland+%281641%29%2C+p.+53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8a82d4739.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8a82d4739.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/top

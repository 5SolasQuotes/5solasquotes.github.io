<main class="wrap"><figure class="quote" id="q-e52ba179f8" data-kw="">
<blockquote><p>It is no small ground of Admiration, that God should rescue so vile and degenerate a people by the hands of such a justly Renowned Instrument. God hath sent us a Saviour, and a great one, (as the Prophet speaks) One not like Noble Cyrus of old, but Superior to him, for he knew not God, though he was girded by him; One not like the King of Babylon, to whom God promised the wages of a Temporal Reward, for himself and his Army; for the service done at this time, hath been so clearly from another Principle, and with another Spirit, that I doubt not of God’s recompensing it to him, with a Throne in Heaven, and an Incorruptible Crown of Glory.

Let his Enemies be Judges (if their Tongues will confess what their Hearts know) whether he be not worthy of double Honour, beyond those of his own rank; and let all men consider, whether he do not deserve our Praises the more, because his Humility declines them so much. We are undoubtedly very pure in our own Eyes, if we imagine that too much to be said of him, which was spoken by the people to David, that he is worth ten thousand of us; and therefore wonder, that such a Person should be exposed and hazarded for our safety and preservation. Wonder, that a man wise as an Angel of God should be found out and stirred up by God to deliver a Nation so void of Counsel; and that One who is so great an Ornament and Credit to the Protestant Profession, should willingly offer himself for us, who were so notorious a Scandal and Disgrace to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-cruso.html">Timothy Cruso</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mighty Wonders of a Merciful Providence. In a Sermon Preached on January 31, 1688/89. Being the Day of Public Thanksgiving to God for the Great Deliverance of this Kingdom by His Highness the Prince of Orange</cite>, (London: Thomas Cockerill, 1689), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Absolute censorship of the Nazi data does not seem proper, especially when the secrets of saving lives may lie solely in its contents… When the value of the Nazi data is of great value to humanity, then the morally appropriate policy would be to utilize the data, while explicitly condemning the atrocities… To further justify its use, the scientific validity of the experiment must be clear; there must be no other alternative source from which to gain that information, and the capacity to save lives must be evident. …it must not be included as ordinary scientific research, just to be cited and placed in a medical journal… citation of the data must contain a thorough expose’ of exactly what tortures and atrocities were committed for that experiment… [and it] must be accompanied with the author’s condemnation of the data… as medical evil, never to be repeated.</p></blockquote>

<blockquote><p>God gives kingdoms to whom He will. What then?… and He gives tyrannous conquests to whom He will: and it is Nebuchadnezzar to whom Daniel speaks that from the Lord [Dan. 5:21], and he had no just title to many kingdoms, especially to the kingdom of Judah, which yet God, the King of kings, gave to him because it was his good pleasure; and if God had not commanded them by the mouth of his prophet Jeremiah, might they not have risen, and, with the sword, have vindicated themselves and their own liberty, no less than they lawfully, by the sword, vindicated themselves from under Moab, (Judges 3) and from under Jabin, king of Canaan, who, twenty years, mightily oppressed the children of Israel, Judges 4. Now this Popish Prelate [John Maxwell], by all these instances, making heathen kings to be kings by as good a title as David and Hezekiah, [implicitly] condemns the people of God as rebels, if, being subdued and conquered by the Turk and Spanish king, they should, by the sword, recover their own liberty [such as happened the Reformation in the Netherlands]; and that Israel, and the saviours which God raised to them, had not warrant from the law of nature to vindicate themselves to liberty, which was taken from them violently and unjustly by the sword… for Nebuchadnezzar’s sovereignty over the people of God, and many other kingdoms also, was revenged of God as tyranny, Jer. 1:6-7; and therefore the vengeance of the Lord, and the vengeance of his temple, came upon him and his land, Jer. 1:16, etc. It is true the people of God were commanded of God to submit to the king of Babylon, to serve him, and to pray for him, and to do the contrary was rebellion; but this was not because the king of Babylon was their king, and because the king of Babylon had a command of God so to bring under his yoke the people of God. So Christ had a commandment to suffer the death of the cross (John 10:18) but had Herod and Pilate any warrant to crucify him? None at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>§12. Question 7. May a true man promise money to a robber for the saving of his life or of a greater sum or more precious commodity? Answer: Yes, in case of necessity, when his life or estate cannot better be preserved: And so taxes may be paid to an enemy in arms, or to a plundering soldier (supposing that it do no other hurt which is greater than the good). Any man may part with a lesser good to preserve a greater: And it is no more voluntary or imputable to our wills than the casting of our goods into the sea to save the vessel and our lives.</p></blockquote>

<blockquote><p>Order is an excellent means of edification and of preserving truth, charity and peace, but it is but a means to the ends of the things ordered and the public good. Therefore if order should be made the advantage of heresy, Church-tyranny or iniquity, and be turned against the good of Church and souls (as it is in the policy of the Roman Church and in well ordered armies of rebels or such as have unlawful wars), this would make it no schism or sin to break such order.</p></blockquote>

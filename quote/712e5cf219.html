<main class="wrap"><figure class="quote" id="q-712e5cf219" data-kw="">
<blockquote><p>I take it we are not denied to rejoice and solace ourselues upon this day. For to some men, at some times, recreation may be more necessary than meat, in case of weakness, for present preservation of health. And though not in that regard, yet being well used, it may be a furtherance to men, in the performance of the duties of godliness, as well as in the duties of their calling. But this rejoicing must be such as was the rejoicing of the Jews, Neh. 8:12, which was only spiritual, and in the Lord. For they reioyced only for this, that they understood the law of God that was taught them. But as for the recreations and pastimes aforenamed, as bowling and such like, they are not at this time to be used…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, (Cambridge: John Legat, 1606), ch. 16, ‘How the Sabbath of the New Testament is to be observed?’, section 1, case 1, p. 460</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4c27e5535" data-kw="">
<blockquote><p>That saying of our Savior, that the Sabbath was not made for man etc. was not uttered by Him to show that the action of the disciples in plucking and eating the ears of corn was warranted by necessity against the command of the Sabbath, but that it was not within the prohibition of works on the Sabbath, which ordinarily is restrained to works of a civil or servile nature, not to natural refreshment, which is always indulged on the Sabbath and so that work of mercy is not under the prohibition, for the plucking of the ears of corn, when they were in the field was no more then drawing drink out of a vessel and of this opinion is learned [Martin] Chemnitz: Hoc Christus it a defendit, ut simul ostendat extra casum contempus publici ministry, et turbationis cultus sabati propter otium externum Sabati, hominem ne levi quidē incommodo assiciendum. ‘By this Christ does so defend his disciples, as withal He shows that, out of the case of contempt of the public ministry and disturbance of the worships of the Sabbath, for the external rest of the Sabbath, a man is not to undergo the least damage.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-geree.html">John Geree</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Might Overcoming Right. Or a Clear Answer to Mr. John Goodwin’s Might and Right well met</cite>, (London: Bostock, 1649), ch. 1, section 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

ath&amp;text=man%20is%20not%20to%20undergo%20the%20least%20damage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ea6137d763" data-kw="">
<blockquote><p>We think to deny the lawfulness of public fasting on the Lord’s day, as if the Christian Sabbath were a day only of spiritual feasting and rejoicing, because that day Christ ended the work of redemption and second creation, is a wronging of the Christian Sabbath, which is ordained for the whole public worship of God, joying, sorrowing for sin, learning God’s will in all and every point, as the Jewish Sabbath was not ordained only for meditation on the work of creation, but for worships of all kinds: The worship of this day, Acts 20:7, is as large as preaching, and being in the Spirit, on the Lord’s day, and seeing the visions of God, Rev. 1:10-12, and the whole ordinary public worship. It is then too narrow to restrict all our Sabbath-worship to one single act of festival rejoicing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ch. 20, Article 7</span></figcaption>

</figure><figure class="quote" id="q-08ee15b796" data-kw="">
<blockquote><p>…let our rest and confidence be only in Christ, and to such as take Him for their rest, his work is but recreation, and so indeed we should esteem it in a spiritual sense; not looking upon it as a sour task, or a rigid exaction, but calling the Sabbath a delight, we should keep it accordingly, even the whole day, with the whole man, as a day of delights to the Lord, being transported beyond flesh and the world, and having our conversation in heaven, as much as is possible for creatures clothed with flesh.</p></blockquote>

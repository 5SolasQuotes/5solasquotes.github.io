<main class="wrap"><figure class="quote" id="q-41214a3615" data-kw="" data-pol="">
<blockquote><p>Accordingly, it is not valid to say: (1) it begets sin, therefore it is not sin. For a man, because he begets a man, does not cease to be a man; indeed, as we have said, it is sin by the very fact that it begets sin.</p></blockquote>
<figcaption>— <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, 4.3.21</figcaption>

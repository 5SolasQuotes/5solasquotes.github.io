<blockquote><p>4. The intrinsical acts of God which do connote some habitude and respect to some thing that is out of the Godhead, are the will of God, or the essence of God considered after the manner of an act of his will, ‘essentia ex se actuosa’ (as the Schools speak) ‘concepta per modum actus volendi.’ If this act be considered in itself, it is nothing else but the will or essence of God, because it is an intrinsical and vital act. But now if this act be considered as relative, and as related to some thing that is out of God, we say this act is not necessary, but free in respect of all those things which God decrees to produce or permit in the world; for God does arbitrarily decree to permit or produce this, and not that, according to the counsel of his own will, it being as truly and fully in his power to permit or produce that, as this: both were alike possible, but this is made future, and will in the fullness of time be present in act by virtue of the free decree of God; for all creatures are produced and do exist by the will of God. It is most evident that the will of God is the same whether it act upon Himself or something that is out of the Godhead. 5. The relation which is between the will of God, and the creature, whether in futurition, or existence, is extrinsical. 6. The denominations grounded upon the termination, or relation of the will of God towards the creatures, is extrinsecal also. 7. These actions of God which are said to be rather from God, than in God, as to create, govern, redeem or the like, are called extrinsical, and therefore the denomination of God from them must needs be extrinsical. 8. We have no ground to conceive that the essence of God is compounded with extrinsical terminations, relations, or denominations. 9. Though the objects which God does will are very different, and their production is successive, yet the will of God is the self same, and is one single and pure act: the Power of willing and the act of willing are not distinct in God; nay God does will his own happiness necessarily, and the happiness of men and angels freely by the same will; necessity and liberty do not make distinct powers or wills in God. 10. There is no potentia executiva in God, and therefore all those conceits of Vorstius [an Arminian] concerning any change or composition in God by several acts or decrees are but mere dreams, and vain conceits, though they be now published to the world, not with less blasphemy than impudence in this licentious age. It is evident by what has been said that the eminent virtue of God (notwithstanding its several objects, egresses, terminations, relations, denominations and effects) is one single and infinite perfection. This will be the constant result and conclusion of all sober debates, and Christian discussions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity… (London, 1650)</cite>, pp. 129-32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27f900eae4" data-kw="">
<blockquote><p>…Whereby it comes to pass that He, in that He is man… He is able to do all those things which pertain to his office: yea and such things as cannot be performed of any created substance, but only of God Himself, may be done by Him, by the power of his deity, yet his human will always working therewithal evermore by consent and as it were by desire: so that in all the actions of Christ, as He is God, pertaining to our salvation, always his soul in some sort joins itself thereunto by love, by desire, and will: as also in all things which He did as man, the deity was always concurrent, yea even in his death and passion: not that the deity suffered, but that it willed both the passion and death of Christ, and added to his passion and death an infinite power, even to cleanse us of our sins. To conclude, concerning the two natures in Christ, and the union and proprieties of them, we believe whatsoever has been determined in the Nicene, Constantinopolitane, Ephesian, and Calcedonian councils, against Arrius, Apollinaris, Nestorius, and Eutyches: and in the sixth synod against the Monothelites. 13. Two kinds of actions in Christ: and all those things which we read that He did and suffered, were done indeed according to the truth of the matter, and not after a vain show or illusion. Now from the person of Christ, and his natures, and the union of the natures, to pass over peculiarly to his actions and his office: First we believe, that as there are two true natures in Christ, whereof each has had and has her true and essential proprieties, coupled together, even as the natures are also united, but not confounded together: so there are two kinds of actions, which our Lord Jesus Christ is said partly to have performed, and partly will yet perform for our salvation: some whereof proceed from his deity, and some from his humanity: and the same partly have been, and partly are so joined together, and yet distinct that each of their forms (as Leo speaks) always works with communion of the other, the Word, performing those things which are of the Word, and the flesh, those things which pertain to the flesh. Moreover, as those things which Christ did and does by virtue of his divine nature, were true and not feigned deeds, (for He truly reconciled us to his father, he truly forgives sins, and truly sanctifies, and regenerates). So whatsoever we read that He did or suffered for us according to his humanity, we believe that He did and suffered all those things truly and indeed, and not only in a vain show and (as some speak) an appearance only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion… (1599)</cite>, ch. 11, ‘Of Christ the Redeemer’; pp. 68-9</span></figcaption>

<blockquote><p>Peter cannot be called the foundation of the church, since no other foundation can be laid besides Christ (1 Cor. 3:11), and he himself is a member of the church, who ought to be built on Christ with the others as he himself teaches (1 Pet. 2:5, 6). Nor if the church is said to be built upon the foundation of the apostles, is this to be understood with respect to their persons, but with respect to their doctrine.</p></blockquote>

<blockquote><p>Whereas they say that there is a double head of the church, one imperial, which is Christ alone, the other ministerial, which is the pope governing the whole church under Christ; I answer, this distinction robs Christ of His honor because in setting up their ministerial head, they are fain to borrow of Christ things proper unto Him, as the privilege to forgive sins properly and the power to govern the whole earth by making of laws that shall as truly bind conscience as the laws of God, etc.</p></blockquote>

<blockquote><p>…but to… sacrifice… at eight of clock in the morning, rather than at ten, in this place physical, rather than this, is no worshipping… but a mere physical circumstance, neither up, nor down to the worship; and time and place-physical are neither worship, nor religious means of worship. 2. Time, and place, name, country, form, figure, habit [dress] or garments, to hold off injuries of sun and heaven as such are never commanded, never forbidden of God, and therefore the change of these circumstances can be no change of a Commandment of God: We never advanced circumstances, as such to the orb and sphere of morals;</p></blockquote>

</figure><figure class="quote" id="q-d23af0379e" data-kw="">
<blockquote><p>28. Ministers with their families ought to be maintained with honest and liberal stipends. We also believe that the church cannot well be governed unless such necessary maintenance be bestowed on the ministers as whereby they and their family may live in an honest estate; For no man, except he have whereupon to live (Mt. 10:10), can do his duty; and Christ says, “the workman is worthy of his wages” and the apostle writes largely thereof in more than one place (1 Cor. 9:7 etc.) showing by many reasons that ministers which serve the churches ought to receive of the same church what so is needful for them: (1 Tim. 5:17 etc.) and that they have good right to demand the same: so far from offence is it, that they should take it, as some would cavil: yet notwithstanding covetousness, as well in all other as chiefly in ministers we do with the apostle utterly condemn: (1 Tim. 3:3,8) as also we allow not prodigality: and we teach that both these faults are to be shunned and avoided. 29. The church goods should not be wasted, but be bestowed on the maintenance of ministers, and other godly uses. And whereas many goods have in times past, and yet in some places are given to churches, by the liberality of princes and other godly persons: we judge that if any church have such goods, great care is to be had that the same be not wasted nor converted into profane uses, and much less into sacriligious uses, nor feigned to be so converted: but to be only bestowed upon that purpose whereto they were given, even to a godly intent. And we well allow of that ancient partition of church goods, where one part went to the bishops, that is, to the teachers, (Deu[…] […]) and ministers of the Word and their families; another to the clerks, that is to students and such as were ordained to the ministry of the church and to them that attended on the church: the third part to poor people and travelers: a fourth part to repairing of churches and schools, to which part also, belong not only the houses of ministers, teachers, students, libraries and books, all kinds of instruments and things necessary for churches and schools: but also spittles and hospitals and other such like places, where such live as are peculiarly to be relieved and cared for of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giralamo-zanchi.html">Giralamo Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Body of Christian Religion (d. 1590; London, 1659)</cite></span></figcaption>

</figure><figure class="quote" id="q-1e1e0634df" data-kw="">
<blockquote><p>Secondly, the farther that the members or Churches, either congregational, presbyterial, or national, are removed in local distance one from another, the less is the visible and external communion of rebuking, comforting, and admonishing one another; yet the power and obligation of these duties are not removed. So though the national Churches be locally distant one from another, yet their power of exercising duties… is not from thence concluded to be null. Yea, national duties upon occasion are still obligatory, and communion of men of sundry nations is clear to me, Isa. 2:3, ‘many nations shall flow unto the mountain of the Lord’s House,’ Zech. 8:23, ‘Ten men shall take hold out of all languages of the nations, they even shall take hold of the skirt of him that is a Jew, saying, we will go with you, for we have heard that God is with you.’ …the places [of Scripture] do well prove the power-lawful of performing duties, whereas the exercise of them in one place is not hic &amp; nunc, in ordinary providence, possible. And so this consequence must be weak: the whole catholic visible Churches in their principal guides cannot ordinarily and constantly meet, hic &amp; nunc, for the exercise of their power; Therefore they have no such power. For if the power be exercised in parts, which, through occurrences of providence and the corruption of men’s nature, cannot be exercised in whole at once, yet it’s not hence evinced [proven] to be a power not given of Christ for edification;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 1</cite>, pp. 300-301</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 1</cite>, pp. 303-304</span></figcaption>

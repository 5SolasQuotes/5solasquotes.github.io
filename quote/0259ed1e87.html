<main class="wrap"><figure class="quote" id="q-0259ed1e87" data-kw="">
<blockquote><p>I have also no difficulty in conceding to you, that there is nothing more perilous to our salvation than a preposterous and perverse worship of God. The primary rudiments, by which we are wont to train to piety those whom we wish to gain as disciples to Christ, are these; viz., not to frame any new worship of God for themselves at random, and after their own pleasure, but to know that the only legitimate worship is that which he himself approved from the beginning. For we maintain, what the sacred oracle declared, that obedience is more excellent than any sacrifice (1 Sam. xv. 22.) In short, we train them, by every means, to be contented with the one rule of worship which they have received from his mouth, and bid adieu to all fictitious worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Cardinal Sadolet’s Letter (1539) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge, (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 34.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c9449eabd" data-kw="">
<blockquote><p>‘Worship,’ in our English tongue, and as it is used to express the original scriptures, is diversely taken. Sometime largely, as when it expresses the Greek word latreuo, as Phil. 3:3, ‘we are the circumcision which worship God in the spirit:’ and Acts 24:14, ‘so worship I the God of my fathers.’ And thus both the English &amp; Greek answers to the Hebrew ghnabad [עָבַד], which properly signifies to serve, Ex. 3:12; Dt. 10:12; 2 Sam. 15:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Holy Scriptures, Worship &amp; Ministery, used</cite>, ... (Amsterdam: Thorp, 1609), ‘Of Worship’, p. 5</span></figcaption>

</figure><figure class="quote" id="q-d4fd6b8c0f" data-kw="">
<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 16</span></figcaption>

</figure><figure class="quote" id="q-4c7c1a7844" data-kw="">
<blockquote><p>[O]ur Lord Jesus Christ was a true man, and that his disciples had all possible evidence of it, which the history more abundantly shews. He conversed with them familiarly, he eat and drank with them, yea, his conversation in the world was very much condescending, in outward behaviour, to the customs of the world. He eat with Pharisees; when they invited him, he refused not; but he was more bold with publicans and sinners, to converse with them, as being their greatest friend. He was uncivil to none; would deter none through a rigid austere conversation.

And, indeed, to testify the truth of his human nature, he came so low to partake of all human infirmities without sin, and to be subject to extraordinary afflictions and crosses, as to the eyes of the world it did quite extinguish his divine glory, and bury it in misbelief. This which we speak of, as a testimony and evidence that he was man, was the very grand stumbling-block and offence of the Jews and Gentiles; which they made use of as an evidence and certain testimony that he was not God. The evidence of the one seems to give an evidence to the other.

But let us consider this, for it is a sweet and pleasant subject, if our hearts were suitably framed to delight in it, that there was as much evidence to the conviction of all men’s senses, of his divine majesty, as of his human infirmity; and that there are two concurring evidences, which enlighten one another; which we shall shew, partly from his own works and miracles, and partly from the more than miraculous success and progress of the gospel after him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John</cite>, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 200-01.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Q. What are the false grounds of the Lord’s making the Covenant of Grace?

A. There are two bastard grounds devised by Arminians. 1. Because the Covenant of Works cannot oblige both to active and passive obedience, but to one of them only (say they) and the Covenant of Works was so rigid, that God could not follow it out, and cast infants in hell for a sin which is theirs, only by imputation, and was pardoned to the first man that committed it. Therefore he was necessitated to make a Covenant of Grace with all mankind, none excepted. But the Covenant of Works is broken, and can now be a way of Justification and salvation to none, but yet it obliges all. And sin cannot make us lawless, for the spiritual Law is of an eternal obligation.

2. They that never heard of Christ, perish by the Law, and not by the Covenant of Grace of which they never heard, and the Gospel is written in the heart of none. 3. The first Covenant was holy and spiritual, and God should unjustly threaten death upon infants, if they be not guilty of eternal condemnation, as Arminius, disp. pub. 7. th. 16.3. and the Scripture saith, infants are guilty of this sin, Eph. 2.3. Rom. 5. Psal. 51.5. Job 14.4. As also Christ must not have died for the sins of Infants, if there be no sin in them, they need not the ransom of Christ’s Blood.

The other bastard ground is, the natural antecedent desire and love of God to have all saved, moved him (say they) to make this Covenant of Grace with all. But this makes away free-grace, and changes God as the blind Talmud, which saith God hath a secret place in which he afflicts himself, because he burnt the Temple, and delivered the Jews to captivity. As also, the Lord remembering the captivity of the Jews, and their desolation, he powers out two tears every day in the Sea or Ocean, and for grief, smites his breasts with both his hands. And the Alcoran saith, that God and the Angels wish well to Mahomet, but cannot free him from death. So made the Heathen their Jupiter to deplore the destinies which he could not amend. And what is this, but to say, God hath passionate desires to have all, Elect, and Reprobate, Men, and Angels, to obey and be eternally saved, but he cannot help the matter; and therefore must upon the same account, be sorrowful and mourn that he cannot get all saved, which destroys the power of grace and restrains the outgoings of free-love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened, or, A treatise of the covenant of grace</cite>, (Edinburgh: Robert Brown, 1655), 1.10, pp 56-57.</span></figcaption>

<blockquote><p>Q. What is this new Covenant?

A. A free contract or Covenant between God and a sinner, concerning the pardon of sin, and life everlasting, through faith in Christ Jesus.

Q. When did this Covenant begin?

A. Immediately after the Fall. Gen. 3.15.

Q. What is specially to be considered in this Covenant?

A. First, the parts and sorts thereof: secondly, the ground and foundation.

Q. What are the parts thereof?

A. The mutual acts between God, and a sinner.

Q. What is the act on God’s part?

A. A free offer of salvation unto a sinner, upon this condition, that he will believe in Christ.

Q. What is the act on the sinners part?

A. An acceptance of this offer, by submitting to the condition.</p></blockquote>

<blockquote><p>5. That we must not dote upon sensible consolation. The merciful nature of God should be a support to us though we see nothing of the effects of it in the course of his dealings with us; and we should believe his love when we do not actually feel it. Job 10:13, ‘And these things hast Thou hid in thine heart; I know that this is with Thee.’ He speaks of his favorable inclination to show pity to his creatures. We are not able always to reconcile his present dispensations with his gracious nature, nor our former experience of his goodnessת yet faith must not quit its holdfast but we must see what is hid in God’s heart and comfort ourselves with concealed favor and mercy, when we cannot comfort ourselves with felt favor and mercy. Though mercies be not visible and obvious to sense, yet the disposition and inclination is ever in God unchangeable and sure. A withdrawn God is a merciful God still.</p></blockquote>

<blockquote><p>3. This goodness is communicative. [There is] None so communicatively good as God. As the notion of God includes goodness, so the notion of goodness includes diffusiveness; without goodness He would cease to be a Deity, and without diffusiveness He would cease to be Good. The being good is necessary to the being God: For goodness is nothing else in the notion of it, but a strong inclination to do good; either to find or make an object wherein to exercise itself according to the propension of its own nature; and it is an inclination of communicating itself not for its own interest, but the good of the object it pitches upon. Thus God is good by nature and his nature is not without activity; He acts conveniently to his own nature. Ps. 119:68, ‘Thou art good and dost good.’ And nothing accrues to Him by the communications of Himself to others, since his blessedness was as great before the frame of any creature as ever it was since the erecting of the world; so that the goodness of Christ Himself increases not the luster of his happiness: Ps. 16:2, ‘My goodness extends not to Thee.’ He is not of a niggardly and envious nature; He is too rich to have any cause to envy, and too good to have any will to envy: He is as liberal as he is rich, according to the capacity of the object about which his goodness is exercised. The divine goodness being the supreme goodness, is goodness in the highest degree of activity; Not an idle, enclosed, pent up goodness, as a spring shut up or a fountain sealed, bubbling up within itself, but bubbling out of itself. A fountain of gardens to water every part of his creation; He is an ointment poured forth (Cant. 1:5). Nothing spreads itself more than oil and takes up a larger space, wheresoever it drops. It may be no less said of the goodness of God, as it is of the fulness of Christ, Eph. 1:23, ‘He fills all in all‘: He fills rational creatures with understanding, sensitive nature with vigor and motion, the whole world with beauty and sweetness. Every taste, every touch of a creature is a taste and touch of divine goodness. Divine goodness offers itself in one spark in this creature, in another spark in the other creature, and altogether make up a goodness inconceivable by any creature. The whole mass and extracted spirit of it is infinitely short of the goodness of the divine nature, imperfect shadows of that goodness which is in Himself.</p></blockquote>

— Stephen Charnock, Several Discourses upon the Existence &amp; Attributes of God, … (d. 1680; London: Newman, 1682), Goodness of God, p. 588">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+This+goodness+is+communicative.+%5BThere+is%5D+None+so+communicatively+good+as+God.+As+the+notion+of+God+includes+goodness%2C+so+the+notion+of+goodness+includes+diffusiveness%3B+without+goodness+He+would+cease+to+be+a+Deity%2C+and+without+diffusiveness+He+would+cease+to+be+Good.+The+being+good+is+necessary+to+the+being+God%3A+For+goodness+is+nothing+else+in+the+notion+of+it%2C+but+a+strong+inclination+to+do+good%3B+either+to+find+or+make+an+object+wherein+to+exercise+itself+according+to+the+propension+of+its+own+nature%3B+and+it+is+an+inclination+of+communicating+itself+not+for+its+own+interest%2C+but+the+good+of+the+object+it+pitches+upon.+Thus+God+is+good+by+nature+and+his+nature+is+not+without+activity%3B+He+acts+conveniently+to+his+own+nature.+Ps.+119%3A68%2C+%E2%80%98Thou+art+good+and+dost+good.%E2%80%99+And+nothing+accrues+to+Him+by+the+communications+of+Himself+to+others%2C+since+his+blessedness+was+as+great+before+the+frame+of+any+creature+as+ever+it+was+since+the+erecting+of+the+world%3B+so+that+the+goodness+of+Christ+Himself+increases+not+the+luster+of+his+happiness%3A+Ps.+16%3A2%2C+%E2%80%98My+goodness+extends+not+to+Thee.%E2%80%99+He+is+not+of+a+niggardly+and+envious+nature%3B+He+is+too+rich+to+have+any+cause+to+envy%2C+and+too+good+to+have+any+will+to+envy%3A+He+is+as+liberal+as+he+is+rich%2C+according+to+the+capacity+of+the+object+about+which+his+goodness+is+exercised.+The+divine+goodness+being+the+supreme+goodness%2C+is+goodness+in+the+highest+degree+of+activity%3B+Not+an+idle%2C+enclosed%2C+pent+up+goodness%2C+as+a+spring+shut+up+or+a+fountain+sealed%2C+bubbling+up+within+itself%2C+but+bubbling+out+of+itself.+A+fountain+of+gardens+to+water+every+part+of+his+creation%3B+He+is+an+ointment+poured+forth+%28Cant.+1%3A5%29.+Nothing+spreads+itself+more+than+oil+and+takes+up+a+larger+space%2C+wheresoever+it+drops.+It+may+be+no+less+said+of+the+goodness+of+God%2C+as+it+is+of+the+fulness+of+Christ%2C+Eph.+1%3A23%2C+%E2%80%98He+fills+all+in+all%E2%80%98%3A+He+fills+rational+creatures+with+understanding%2C+sensitive+nature+with+vigor+and+motion%2C+the+whole+world+with+beauty+and+sweetness.+Every+taste%2C+every+touch+of+a+creature+is+a+taste+and+touch+of+divine+goodness.+Divine+goodness+offers+itself+in+one+spark+in+this+creature%2C+in+another+spark+in+the+other+creature%2C+and+altogether+make+up+a+goodness+inconceivable+by+any+creature.+The+whole+mass+and+extracted+spirit+of+it+is+infinitely+short+of+the+goodness+of+the+divine+nature%2C+imperfect+shadows+of+that+goodness+which+is+in+Himself.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+Several+Discourses+upon+the+Existence+%26+Attributes+of+God%2C+%E2%80%A6+%28d.+1680%3B+London%3A+Newman%2C+1682%29%2C+Goodness+of+God%2C+p.+588&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0a4750d2de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0a4750d2de.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=3.%20This%20goodness%20is%20communicative.%20%5BThere,that%20goodness%20which%20is%20in%20Himself&amp;text=3.%20This%20goodness%20is%20communicative.%20%5BThere%20is%5D%20None&amp;text=shadows%20of%20that%20goodness%20which%20is%20in%20Himself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And herein is a solemn prefiguration of the implanting of believers of all nations into the covenant and faith of Abraham; for this name he received upon the solemn establishment of the covenant with him, as the apostle explains the place, Rom. 4:11–17. All, then, that believe are taken into the covenant of Abraham; and as unto the privileges of it, and inheritance to be obtained by it, they are no less his children and heirs than those who proceeded from his loins according to the flesh; as hath been manifested in our Exercitation concerning the oneness of the church. And herein also God manifested what was his design in his call and separation unto himself, even to make and constitute him and his posterity the means of bringing forth the promised Seed, wherein all nations were to be blessed.</p></blockquote>

<blockquote><p>The doctrine hence arising is this, that so long as we labor to keep the substance of God’s worship, though we fail in some circumstances thereof, He will be merciful to us. If we embrace the substance thereof willingly, and fail in the circumstances unwillingly, God will never lay it to out charge. Examples will prove this more fully unto us: ‘Ye have heard of the patience of God’ (says the apostle James) ‘and ye know what end God made with him.’ (James 5:11; Job 3)… there was in him a great deal of passion and distemper: and that he held out but very weakly in a great part of the conflict… yet because he held out in the substance of godliness, in the midst of all his woes and miseries… and in the end acknowledged his fault and desired to lay his hand upon his mouth: because (I say) these good things were found in him, God passes by his infirmities and takes notice of his patience, with high commendation thereof… For the Lord in his wisdom considered that it was not through any stubbornness, or rebellious disposition that he brake out in that manner…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20</cite>, pp. 122-23</span></figcaption>

ce%20arising%20is%20this,he%20brake%20out%20in%20that%20manner&amp;text=The%20doctrine%20hence%20arising%20is%20this%2C%20that%20so&amp;text=disposition%20that%20he%20brake%20out%20in%20that%20manner" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>First, if we tender up to God all that we have. Though we be never so poor and mean, yet if God has the strength of our souls, God accepts it. For we are to know that God does not stand in need of what we have, or of what we do; but that we might show our respect to Him: Therefore if we give all that we have, God accepts it. As a child, if it puts forth all its strength that it has to do a business which the father bids him, whether the business be done or no, the father looks upon it and accepts it as suitable to the child’s strength; and it shows the respect that the child has to his father. And as it is storied of an emperor that when a poor man had nothing to offer him but a little water that he had taken up with his hand, he having nothing else, the emperor accepts of it. So that’s that which God looks for, that the creature should lift Him above all. If therefore when thou comest to worship God, God has more of thy heart then ever any creature in the world had, God accepts of that, and that you must look unto; Can you say so, when you go to worship God: Lord it is true there is much weakness in my spirit, but Thou that knowest all things knowest that thou hast more of my heart than ever any creature in the world had. This is suitable to God: God will account this (in the Covenant of Grace) to be a present suitable to Himself. As in the Law, when they offered to the building of the Temple, every one could not offer gold and silver and precious stones, but some came and offered badgers-skins, and some women did spin and offered coats-hair to the building of the Temple, and so God accepted of that being the most they could do. 2. In the second place, when we do not only offer unto God the most we can, but when we add to this the grief of our souls that we can do no more, when the soul shall strive to the uttermost it can, and when it has done all, says, ‘I am an unprofitable servant; Oh that I could do more!’ This is suitable to God. 3. Thirdly, the people of God though they be weak, yet the weakest servant of God is able to offer up to God somewhat that is suitable to the infinite majesty of God, upon this third ground, because that there is a kind of impression of God’s infiniteness in those services that a gracious heart does tender unto God, and therefore [it is] suitable unto God.</p></blockquote>

</figure><figure class="quote" id="q-3a21169bb9" data-kw="">
<blockquote><p>About refraining a moral duty for the evil mixed with it, or in the persons performing it: 1. As we are not to do evil that good may come of it, no more ought we to leave what is morally good undone for the evil that is some way mixed with it. Zeal for good is to be preferred to that which is against evil. The greatest good is better than the greatest evil is bad. Whatever good thing we do tends towards our union with the chiefest Good, the refraining of evil not so immediately. 2. Betwixt things indifferent and what is morally good, you have this difference: If there be any mixture of evil with the one, it becomes wholly evil; there is nothing of good in it to give stop or preponderate; but what is morally good will remain so still, though mixed with evil. We may allay the worth of it, as baser metals mixed with gold, but yet it is gold still, and may be perfectly severed. 3. ‘When I would do good,’ says the apostle, ‘evil is present with me.’ [Rom. 7:21] I cannot hear, or read or pray, and the rest, but with a mixture of sin; yet upon this account I may not cease from or neglect a known duty, not though materially considered the evil accompanying being greater than the good; as in meditation, when blasphemous thoughts arise, etc. To omit a known duty is a sin of wilfulness; the evil from me in it is but infirmity only; The least wilful sin is greater and more provoking than the greatest sin of infirmity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use: Whether we may Lawfully Hear the now Conforming Ministers who are Re-ordained &amp; have Renounced the [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 2</cite>, pp. 8-10</span></figcaption>

<blockquote><p>For the benefit of Christian love and concord may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They [nonconfomrits] prefer their own manner of worshipping God as better than the [Anglican] Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacrilegious Desertion of the Holy Ministry Rebuked &amp; Tolerated Preaching of the Gospel Vindicated (1672), ch. 2</cite>, pp. 16-17</span></figcaption>

<blockquote><p>Now in this that I declare unto you I praise you not, that ye come together not for the better, but for the worse. For first of all, when ye come together in the church, I hear that there be divisions among you; and I partly believe it. For there must be also heresies among you, that they which are approved may be made manifest among you. When ye come together therefore into one place, this is not to eat the Lord’s supper. For in eating every one taketh before other his own supper: and one is hungry, and another is drunken. What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? what shall I say to you? shall I praise you in this? I praise you not.</p></blockquote>

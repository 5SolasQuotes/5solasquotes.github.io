<main class="wrap"><figure class="quote" id="q-669e01d933" data-kw="" data-pol="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Letter to Pope Leo X</cite>, p. 2</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/church/nature-and-marks.html">Nature &amp; Marks</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2dd3d4865" data-kw="" data-pol="">

<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 60</figcaption>

</figure><figure class="quote" id="q-9bac27814f" data-kw="" data-pol="">
<blockquote><p>Truly, such vain displays of pride and arrogance make a mockery of the holy God when the Roman Pontiff is seen acting in the place of God, sitting in the temple of God as God, showing himself to be God. It seems incredible that anyone but an insane man should behave in such an unlikely manner, taking both the name and authority of God upon himself.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 31</figcaption>

</figure><figure class="quote" id="q-373000dea1" data-kw="" data-pol="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.2.12</figcaption>

</figure><figure class="quote" id="q-09308723bf" data-kw="" data-pol="">

<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Animadversions on Fiat Lux</cite>, ch. 21</figcaption>

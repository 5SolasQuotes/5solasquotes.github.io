<main class="wrap"><figure class="quote" id="q-0f2cdba7fc" data-kw="">
<blockquote><p>It is a noble temper to be afraid of sin. If a person pretends conscience for a particular opinion and practice, and in the mean time be a common drunkard, swearer, liar, blasphemer, unclean person, one that lives as it were without God in the World, making no conscience of reading the Scripture, praying, bringing up and governing his Family in the nurture and fear of the Lord, only pretends conscience as to baptizing of Children, keeping the Seventh day Sabbath; this man is an hypocrite, and dissembles with God and men for there is an uniformity in conscience, and it would certainly oblige him to avoid known and confessed sins, as much as what he doth fancy is a sin, and as much oblige him to all, as to any known duty.

But where I see a Christian walking close with God in the general of his conversation, and differing from me in this or that point, because he thinks he cannot without sin believe and practise what I do; I cannot but love and honour him, and be very far from their Religion who think it the best and most Gospel way to cudgel him into my Persuasion: A Gaol, or a Fire and Faggots never yet cured an erring Conscience. Such Brethren though overtaken with a fault are certainly (according to the Apostle’s counsel) to be restored in the spirit of meekness, and to be dealt with, (like rational Creatures) argued, and treated, and persuaded out of their mistakes, not cudgelled out of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-e854102423" data-kw="">
<blockquote><p>Thankfulness for grace received is one of the principal duties that is incumbent on believers in this world. Now, how can a man in faith bless God for that which he is utterly uncertain whether he have received it from him or no? I know some men run on in a rote in this matter. They will bless God in a formal way for regeneration, sanctification, justification, and the like; but if you ask them whether themselves are regenerate or no, they will be ready to scoff at it, or at least to profess that they know no such thing. What is this but to mock God, and in a presumptuous manner to take his name in vain? But if we will praise God as we ought for his grace, as we are guided and directed in the Scripture, as the nature of the matter requires, with such a frame of heart as may influence our whole obedience, surely it cannot but be our duty to know the grace that we have received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 6 (Edinburgh: T&amp;T Clark, n.d.), 592.</span></figcaption>

</figure><figure class="quote" id="q-ef8c84ca9f" data-kw="">
<blockquote><p>There are then a great number of truths, both of faith and of morality, which seem contradictory, and which all hold good together in a wonderful system. The source of all heresies is the exclusion of some of these truths, and the source of all the objections which the heretics make against us is the ignorance of some of our truths. And it generally happens that, unable to conceive the connection of two opposite truths, and believing that the admission of one involves the exclusion of the other, they adhere to the one, exclude the other, and think of us as opposed to them. Now exclusion is the cause of their heresy; and ignorance that we hold the other truth causes their objections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/blaise-pascal.html">Blaise Pascal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pensees</cite>, section 14, Appendix: ‘Polemical Fragments’ in Pensees – The Provincial Letters in The Modern Library (d. 1662; NY: Modern Library, 1941), p. 305</span></figcaption>

</figure><figure class="quote" id="q-74979e3bbe" data-kw="">
<blockquote><p>He that despaireth of the forgiveness of his sins, denieth GOD to be merciful, yea he denieth as much as lieth in him that GOD hath love, truth and power, in which three all my comfort consisteth, to wit, in the love of his adoption, in the truth of his promise, and in his power to perform. Let my foolish Cogitation then mutter what it listeth within me, saying, who art thou? or by what merit or worthiness doest thou hope to obtain such great glory? I comfortably will answer I know whom I have believed, and I am sure that in love he hath adopted mee to be his Child, that he is true in his promise, and powerful in performance. And these three so strengthen my heart, that no want of merit, no consideration of my own vileness, no greatness of the future blessedness can cast me down from the height of hope, wherein I am soundly rooted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), p. 285.</span></figcaption>

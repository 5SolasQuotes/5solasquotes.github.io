<main class="wrap"><figure class="quote" id="q-0fa7d1695a" data-kw="">
<blockquote><p>…you say we ‘are not bound, or rather have no warrant to use the Psalms in meter or with tunes.’ To this I answer, that we are bound to sing is evident, both from Scripture-precept and example; and that we are thereby warranted to have the Psalms in meter with tunes is as clear, as both are necessary, at least convenient in the propriety of our language, for the use of singing: I deny not, but prose may be sung; but seeing it is certain that our language has no such exact prosody, as either to render it easily measurable, or the measures distinguishable by points and accents; nay that the import of the music or tonici accentus, in the Hebrew, qui olim moderabantur harmoniam musicam, is so far now lost and unknown, that if we were now to sing the Hebrew Psalms, we could not make use of them: Pray, Sir, leave us but the way of meter in place of points and accents until you teach us better grammar: whereas you hint, that we ‘may have all David‘s instruments as well as tunes’, if you could learn us to sing without tunes, as we may well do without organs, I shall not contend, but seeing that David did, no doubt, invent and introduce these his instruments, as well by the special direction of the Spirit, as he did all other things anent the service of the Temple, and that the Primitive Christians, worshipping more in the simplicity of the Spirit than in outward shows, canebant assâ voce non […], I think you may now put up your pipes and spare the cost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered, pp. 277-278. MacWard was the protege of Samuel Rutherford.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16fbe9387d" data-kw="">
<blockquote><p>And for singing of David’s Psalms in meter, establisheth a concord in the harmony; and the matter being the same, it is nothing to the lawfulness or unlawfulness of the thing… and for singing psalms (Mt. 26:30; Acts 16:26; Col. 3:16), we have the practice of our Savior Himself, Paul, Silas, and the recommendation of James, and of Paul also; and ’tis reported of Theodorus, that under the cruel persecution of Julius the Apostate, suffered much in martyrdom, and being on the rack, to the amazement of all the beholders, sung psalms most harmoniously; and if there can be any song spiritual, and yet unlawful, why then did Paul admonish us to exhort one another in psalms, and hymns, and spiritual songs? and there can be no song, but there must be meter, for so the word signifies, and therefore take them as songs, our practice is justified. And if you look for more, I refer you to them who have writ largely on this subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-deacon.html">John Deacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Nayler’s Blasphemies Discovered</cite>, (1657), ‘Answer to the 13th Query’, pp. 50-51. Deacon appears to have been a presbyterian (p. 10 &amp; 54) writing against a Quaker, who did not publicly sing praise at all.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-4842eb8ff8" data-kw="">
<blockquote><p>That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 152 Lectures upon Psalm 51… (London, 1635), Lecture 1, p. 4-5 This section is occasioned upon the title of Ps. 51, that it is a psalm of David ‘to the chief musician’.</span></figcaption>

</figure><figure class="quote" id="q-adc2d5bc08" data-kw="">
<blockquote><p>So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, ‘The Causes &amp; Cures of Mental Errors’, p. 476</span></figcaption>

<div class="actions"><button class="copy" data-copy="“So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.”

— John Flavel, Works, vol. 3, ‘The Causes &amp; Cures of Mental Errors’, p. 476">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo%2C+for+that+scriptural+heavenly+duty+of+singing%3A+what+more+commonly+alleged+against+it+than+the+abuse+and+ill+effects+of+that+precious+ordinance%3F+How+often+is+the+nonsense+and+error+of+the+common+translation%2C+the+rudeness+and+dullness+of+the+meter+of+some+Psalms%2C+as+Ps.+7%3A13%2C+as+also+the+cold+formality+with+which+that+ordinance+is+performed+by+many+who+do+but+parrotize%3F+I+say%2C+how+often+are+these+things+buzzed+into+the+ears+of+the+people+to+alienate+their+hearts+from+so+sweet+and+beneficial+a+duty%3F+And+very+often+we+find+it+urged+%5Bby+Antinomians%2C+who+sometimes+forsook+singing+public+praise+altogether%5D+to+the+same+end%2C+how+unwarrantable+and+dangerous+a+thing+it+is+for+carnal+and+unregenerated+persons+to+appropriate+to+themselves+in+singing+those+praises+and+experiences+which+are+peculiar+to+the+saints%3B+not+understanding+or+considering+that+the+singing+of+Psalms+is+an+ordinance+of+Christ+appointed+for+teaching+and+admonition%2C+as+well+as+praising%2C+Col.+3%3A16%2C+%E2%80%98Teaching+and+admonishing+one+another+in+psalms+and+hymns%2C%E2%80%99+etc%E2%80%A6+If+Satan+can+prevail+first+with+wicked+men+to+corrupt+and+abuse+God%E2%80%99s+ordinances+by+superstitious+mixtures+and+additions%3B+and+then+with+good+men+to+renounce+and+slight+them+for+the+sake+of+those+abuses%3B+he+fully+obtains+his+design%2C+and+gives+Christ+a+double+wound+at+once%3B+one+by+the+hands+of+his+avowed+enemies%2C+the+other+by+the+hands+of+his+friends%2C+no+less+grievous+than+the+first.+First%2C+wicked+men+corrupt+Christ%E2%80%99s+ordinances%2C+and+then+good+men+nauseate+them.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+Works%2C+vol.+3%2C+%E2%80%98The+Causes+%26+Cures+of+Mental+Errors%E2%80%99%2C+p.+476&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fadc2d5bc08.html&amp;via=5Solas" target="_blank" rel="noopener">Shar

<main class="wrap"><figure class="quote" id="q-5b76cd05d2" data-kw="">
<blockquote><p>The subject matter of these debates [surrounding the public Resolutions] is not so far removed out of the way as our [Resolutioner] Brethren do talk, but do still continue in many respects: 1. In regard of the sin and guilt thereof, which has not been taken-with, nor repented-of till this day. And as the resolution Brethren judge it hard for the protesting Brethren to be satisfied with nothing, unless they do repent of that, as a sin which in their consciences they judge to be a duty; So they must give leave to the protesting Brethren to judge it hard, that the Church, of which they are members and ministers, should lie under the guilt of a public transgression, and under great and sore wrath, because thereof, and they in the meanwhile not be permitted to discover her iniquity therein, that her captivity may be turned away, especially when they are engaged by Covenant so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, ... (1658), p. 69</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01c39ae948" data-kw="">
<blockquote><p>Right discipline is not necessary to the essence of a visible Church. All our divines condemn Anabaptists and Pelagians, who plead that righteous men only, and such societies as have right discipline, be true Churches. Novatians and Donatistscame near to them in this also. The exercise may be wanting in a Church, a true visible Church, from which we are not to separate. A Church may retain the essence and being of a visible Chuch, and yet have no discipline in actual use, or little.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, of the Church of Scotland, contra the Seceders’ Covenant, &amp; that as a Term of Communion, 1744</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-895f6f5922" data-kw="">
<blockquote><p>Although a Church be defective in purging out of corrupt members, yet that does not pollute the ordinances to others, or necessitate them to separate from them. These Churches continue to be Churches, and the ordinances to be ordinances of Christ, although such were continued in communion with them; and, notwithstanding thereof, these who were free of those corruptions are approven and commended by Jesus Christ: And if it were not so, that a person’s endeavoring in his station to amend such a fault, and to have such scandals censured, did not exempt him from guiltiness so as to continue in Church communion, although the plurality of officers should be short of their duty in that respect; then there might be still separation after separation in infinitum [to infinity].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-2f016b59e9" data-kw="">
<blockquote><p>But yet it’s an error to hold that if any unjustly condemn other churches, it is a renunciation of that condemned church-state to have communion with them that condemn. Who would have thought the two separating extremes had so agreed in their principles? This is just the very core of the evil of the book of the contrary party which I here answer. Alas! how few Churches on earth have not peevishly condemned one another: it may be for Easter-day, for the choice of a bishop, as the Donatists (striving whose bishop was the right one): The case of the [early Church groups, the] Novatians, Audians, Luciferians and even of most in East and West are sad instances: And will such censoriousness unChurch them and forbid us communion with them? This is plain revenge and to curse them that curse us and abuse them that abuse us. I like Calvin ‘s spirit better than this, who said, “Though Luther should call me a devil, I would call him the excellent servant of God.”* Too many Lutherans now renounce communion with the Calvinists, who yet renounce not communion with them. * John Calvin, Letters of John Calvin, ed. Jules Bonnet (Philadelphia: Presbyterian Board of Publication, 1900), letter 122, to Bullinger (1544), p. 433.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 83-84</span></figcaption>

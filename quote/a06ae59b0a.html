<blockquote><p>Ma. Seeing there is but one God, tell me, Why in the confession of the Christian Faith, thou rehearsest three, the Father, the Son, and the holy Ghost.

Sch. Those be not the names of sundry Gods, but of three distinct Persons in the Godhead. For God the Father, God the Son, and God the holy Ghost, being three persons, are one only God, as we are taught by the holy Scriptures; which we ought readily to believe, rather than curiously to search the infinite depth of so secret and hidden a mystery.

Ma. Thou sayest true. Go forward therefore, why callest thou God, Father?

Sch. First and principally, for that the is the natural Father of his only son Jesus Christ. Secondly, for that he is our Father, both for that he created us, and gave life unto us all, and also for that he hath heavenly begotten us again through the holy Ghost; and by faith in his true and natural Son Jesus Christ, he hath elected, and adopted us his children; and through the same Christ hath given us his Kingdom, and the inheritance of everlasting life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-nowell.html">Alexander Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism, or Instruction of Christian Religion, to be learned of all youth, next after the little Catechism: Appointed in the Book of Common Prayer</cite>, (London: John Day, 1572), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-f4c3cb2fc7" data-kw="">
<blockquote><p>This Truth concerning the blessed and glorious Trinity, being so often insisted on here, and coming so near to the nature of God Himself, it cannot but be exceedingly necessary for Christians to be through in the faith thereof: yet it is questioned of late, whether it be to be accompted a fundamental point of Faith or not?

I say, this of late is questioned by Socinus, and the favourers of a boundless untolerable Toleration: for, of old it was most sacredly received as such, amongst the Ancients, as the Creeds that are called Apostolic, Nicene, and that of Athanasius, do manifest: But this Engine the Devil drives, first, to make the most necessary Truths indifferent, that then he may the more easily engage opposers to quarrel the very Truth of them it self; but we conceive, whatever it was of old before Christ, yet now it is to be looked on, not only as a Truth, which is clear from the Word, but also as a fundamental Truth; which being shaken, would overturn Christianity, and the way of Salvation that the Lord hath revealed in His Gospel.

This is not to be extended to a rigid degree of knowledge in this wonderful Mystery, but to so much clearness in this Truth from the Word, as may be a ground to Faith in the thing it self. And that this is necessary, as a fundamental, we think ariseth clearly from these three grounds. 1. That Truth, without which the true God cannot be taken up, believed in, and worshipped, is a fundamental Truth; but, this Truth of the Trinity of Persons, and Unity of the Godhead, is such, that without it, that God, which is proposed in the Word, and is the only true God, and the object of all Worship, can neither be taken up, believed in, nor worshipped rightly: Ergo, &amp;c. because the true God is One, and yet Three Persons; and as such, hath proposed Himself to be known and worshipped.

2. That Truth without which the work of Redemption would be overturned, is fundamental; But this is such: for, by taking away the Mystery of the Trinity, they take away the Godhead and Personality of the Mediator, and so do enervate His satisfaction. And, as on the former accompt, the true God is otherwise conceived than He is in Himself; so, in this respect, the Mediator is made a quite other thing. And, can any thing be fundamental, if this be not?

3. The way that God hath laid down in His Worship, requireth this, seeing in Baptism there is particular and express mentioning of these Three, the Father, Son and Spirit, as the Superior, to whom they that are Christian Soldiers, should be lifted and enrolled: and so we may accompt of all after-worship; seeing God requires us to honour the Son, as we honour the Father; and seeing these Three equally witness from Heaven, 1 Joh. 5. the Father, Word, and Spirit; all which Three, are One: can their Testimony be received as of Three, or can they be accompted as One God without this? And yet there can neither be one, in Faith, engaged unto in Baptism, or one, whose Testimony we may receive, but He who is God: and can any think but it’s necessary for a Christian, and that, fundamentally, to know to whom they are devoted, whom they are to worship, whose Testimony it is that they receive, whose operations they feel, whom they are to make use of, &amp;c? And therefore it’s necessary to know the Trinity of Persons in that One Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), pp 8-9.</span></figcaption>

</figure><figure class="quote" id="q-785861c5de" data-kw="">
<blockquote><p>Again they who labour under the frenzy of Sabellius and the craze of Arius, have both fallen from a sound faith for want of observing a middle course. The name of Christian is applied to both these heretics; but if any one examines their doctrines, he will find the one sect not much better than the Jews, and differing from them only in name, and the other very nearly holding the heresy of Paul of Samosata, and that both are very wide of the truth. Great, therefore, is the danger in such cases, and the way of orthodoxy is narrow and hemmed in by threatening crags on either side, and there is no little fear lest when intending to strike at one enemy we should be wounded by the other.

For if any one assert the unity of the Godhead, Sabellius straightway turns that expression to the advantage of his own mental vagary, and if he distinguish the Persons, and say that the Father is one, and the Son another, and the Holy Spirit a third, up gets Arius, ready to wrest that distinction of Persons into a difference of substance; so we must turn and flee both from the impious confounding of the Persons by the one, and the senseless division of the substance by the other, confessing, indeed, that the Godhead of the Father and of the Son and of the Holy Ghost, is all one, while we add thereunto a Trinity of Persons. For then we shall be able to fortify ourselves against the attacks of both heretics.</p></blockquote>

— John Chrysostom, On the Priesthood, (c. 381-85), 4.4 in Nicene and Post Nicene Fathers 1, 9: 66.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAgain+they+who+labour+under+the+frenzy+of+Sabellius+and+the+craze+of+Arius%2C+have+both+fallen+from+a+sound+faith+for+want+of+observing+a+middle+course.+The+name+of+Christian+is+applied+to+both+these+heretics%3B+but+if+any+one+examines+their+doctrines%2C+he+will+find+the+one+sect+not+much+better+than+the+Jews%2C+and+differing+from+them+only+in+name%2C+and+the+other+very+nearly+holding+the+heresy+of+Paul+of+Samosata%2C+and+that+both+are+very+wide+of+the+truth.+Great%2C+therefore%2C+is+the+danger+in+such+cases%2C+and+the+way+of+orthodoxy+is+narrow+and+hemmed+in+by+threatening+crags+on+either+side%2C+and+there+is+no+little+fear+lest+when+intending+to+strike+at+one+enemy+we+should+be+wounded+by+the+other.%0A%0AFor+if+any+one+assert+the+unity+of+the+Godhead%2C+Sabellius+straightway+turns+that+expression+to+the+advantage+of+his+own+mental+vagary%2C+and+if+he+distinguish+the+Persons%2C+and+say+that+the+Father+is+one%2C+and+the+Son+another%2C+and+the+Holy+Spirit+a+third%2C+up+gets+Arius%2C+ready+to+wrest+that+distinction+of+Persons+into+a+difference+of+substance%3B+so+we+must+turn+and+flee+both+from+the+impious+confounding+of+the+Persons+by+the+one%2C+and+the+senseless+division+of+the+substance+by+the+other%2C+confessing%2C+indeed%2C+that+the+Godhead+of+the+Father+and+of+the+Son+and+of+the+Holy+Ghost%2C+is+all+one%2C+while+we+add+thereunto+a+Trinity+of+Persons.+For+then+we+shall+be+able+to+fortify+ourselves+against+the+attacks+of+both+heretics.%E2%80%9D%0A%0A%E2%80%94+John+Chrysostom%2C+On+the+Priesthood%2C+%28c.+381-85%29%2C+4.4+in+Nicene+and+Post+Nicene+Fathers+1%2C+9%3A+66.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F785861c5de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/785861c5de.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/28/john-chrysostom-on-fleeing-from-anti-trinitarian-heresies/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-670925aa26" data-kw="Old Testament Trinity degrees">
<blockquote><p>Although the mystery of the Trinity was more obscure under the Old than under the New Testament, it does not follow that it was then altogether unknown. For otherwise, they could neither have known the true God nor have been able to believe in the Messiah. Therefore we must distinguish knowledge from its degrees. The same knowledge was given as to substance, but it varied in degree.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-08ae58b6b6" data-kw="">
<blockquote><p>Those who search for other reasons [besides adultery for divorce] ought justly to be set at nought, because they choose to be wise above the heavenly Teacher. They† say that leprosy is a proper ground for divorce, because the contagion of the disease affects not only the husband, but likewise the children. For my own part, while I advise a religious man not to touch a woman afflicted with leprosy, I do not pronounce him to be at liberty to divorce her. If it be objected, that they who cannot live unmarried need a remedy, that they may not be burned, I answer, that what is sought in opposition to the Word of God is not a remedy. I add too, that if they give themselves up to be guided by the Lord, they will never want [lack] continence, for they follow what He has prescribed. One man shall contract such a dislike of his wife, that he cannot endure to keep company with her: will polygamy cure this evil? Another man’s wife shall fall into palsy or apoplexy, or be afflicted with some other incurable disease, shall the husband reject her under the pretense of incontinency? We know, on the contrary, that none of those who walk in their ways are ever left destitute of the assistance of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 19, v. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

ank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f8500454e" data-kw="">
<blockquote><p>The donation of Ananias and Sapphira was made to God for the use of the poor, it lay not now in their power nor in the Churches to revoke and reverse that grant, wherein God became now to be interessed. We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), pp. 704-705</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-8a2942ec6b" data-kw="">
<blockquote><p>1. Regarding young people who have never been married, none, whether sons or daughters, who have a father still living shall have the power to contract a marriage without the permission of their father unless they have attained the legal age, that is twenty years for a son and eighteen for a daughter. And if after reaching the said age they have asked their fathers or had them asked to marry them and their fathers have not attended to it, in that case it shall be lawful for them to marry without their father’s authority. … 7. Where children marry without their father’s or mother’s permission at the age permitted above and it is established by the court that they have done this lawfully because of the negligence or excessive strictness of their fathers, let the fathers be required to grant them a dowry or provide them such a share or position as [they would have given] if they had consented to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marriage-ordinance-of-geneva.html">Marriage Ordinance of Geneva</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Witte, Jr. &amp; Robert McCune Kingdon, Sex, Marriage &amp; Family in John Calvin’s Geneva</cite>, vol. 1: Courtship, Engagement, &amp; Marriage, pp. 165 &amp; 172</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-a5f5cc9242" data-kw="">
<blockquote><p>…to return to our main subject, that of matrimony, we see what kind of treaty there was about it, Gen. 34:6, 12, what the contract, Gen. 24:50-51, 57-58, what the solemnizing of it, Gen. 24:67, were in those early days. We read not of any formality in joining of man and woman. Mutual consent made marriage. ‘Wilt thou go with this man?’ And she said, ‘I will go.’ Then when she was come to his house, he took her, and she became his wife.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Authority, Style &amp; Perfection of the Books of the Old &amp; New-Testament with a Continued Illustration of Several Difficult Texts of Scripture throughout the Whole Work</cite>, … (London: Wilkin, 1693), Of the Excellency &amp; Perfection of the Holy Scriptures, ch. 5, p. 227</span></figcaption>

</figure><figure class="quote" id="q-c50ef5a04d" data-kw="">
<blockquote><p>Further, if parents should be unwilling to allow the honorable vows of their children and proceed to abuse their power over them, they must be admonished and persuaded by a warning, prayers, and the urging first of relatives and friends, and secondly of the presbyters of the church. But if harsh parents should ignore all these, then the magistrates must interpose their authority, lest anyone by the wickedness of his parents be either kept from marriage longer than is fair or driven to a less acceptable marriage, provided that those who have such inhuman parents are not seeking to be joined with corrupt men of little honor and piety. There was a provision concerning such things even in Roman laws (Digest XXIII, 2, 19, 21, 22; Code V, 4, 12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), bk. 2, ch. 18, ‘Marriages should not be held valid which are contracted without the consent of those who have power over the ones who make the contract, or without suitable advisors’, pp. 323-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

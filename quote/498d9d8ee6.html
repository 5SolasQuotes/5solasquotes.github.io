<blockquote><p>If you look into 1 Peter 3:19-20, you there find that Christ “went and preached unto the spirits in prison; which sometime were disobedient, when once the long-suffering of God waited in the days of Noah.” The meaning of which is, that in the days before the flood, Christ by his Spirit strove [Gen. 6:3] with the disobedient and rebellious sinners in the ministry of Noah, who then were living men and women as we are, but now are “spirits in prison,” that is, damned souls in hell, for their disobedience…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Knocking at the Door of Sinners’ Hearts; or, A Solemn Entreaty to Receive the Savior and His Gospel in This the Day of Mercy</cite>, (New York: American Tract Society, 1850), p. 97. This quote was compiled by Tony Byrne.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51668855c3" data-kw="">
<blockquote><p>And accordingly we distinguish of the effects of God’s love in respect whereof He is said to love his creature. For they may be considered either in respect of life temporal, or of life spiritual, or of life eternal. The first effects of love, as touching life temporal, God communicates to all that have life; thus He is said to save both man and beast, and the eyes of all are said to wait upon Him; He hears the cry of ravens; the sparrows fall not to the ground without the providence divine; The very lions roaring after their prey, do seek their meat at [from] God. Thus He may be said to be as the Savior, so the lover of all men; but especially of them that believe, to wit, both in respect of the comforts of life spiritual, and the joys of life eternal which He affords unto them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice</cite>, (1651), p. 52</span></figcaption>

</figure><figure class="quote" id="q-bd854850b1" data-kw="">
<blockquote><p>Upon the stage of this world, mercy acts in part and shows itself in more objects, and in more instances, than the judgment of God does; that must have its course and triumph in the next world; here all sinners share, more or less, in the mercy of God. “The Lord is good to all” (Ps. 145:9) “He makes his rain to fall, and his sun to shine upon the just and the unjust.” (Matt 5:45).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted by David Silversides, The Free Offer of the Gospel</cite>, p. 106, The Sermons of Matthew Mead (d. 1699; Soli Deo Gloria, 1991), p. 338 ff.</span></figcaption>

</figure><figure class="quote" id="q-892ba504ee" data-kw="">
<blockquote><p>The second sort of divines (Contra-Remonstrants) [that is, those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-17f9255f8e" data-kw="">
<blockquote><p>Secondly, we must from hence be exhorted to take heed of usurping Christ’s honor to our selves, of being our own rule or way. The Lord is a jealous God, and will not suffer any to be a self mover, or a God unto himself. It is one of God’s extremest judgments to give men over to themselves, and leave them to follow their own rules. When He has first woo’d men by his Spirit, and that is resisted; enticed them by his mercies, and they are abused; threatened them with his judgments, and they are mis-attributed to second causes; cried unto them by his prophets, and they are reviled; sent his own Son to persuade them, and He is trampled on and despised: when He offers to teach them, and they stop their ears; to lead them, and they pull away their shoulder; to convert them, and they hardened their heart; when they set up mounds against the Gospel, as it were to non-plus and pose the mercies of God, that there may be no remedy left; then after all these indignities to the Spirit of Grace, this is the judgement with which God uses to revenge the quarrel of his Grace and Covenant, to leave them to the hardness and impenitency of their own hearts, to be a rule and way unto themselves. My people would not hearken to my voice, and Israel would none of me. … [Reynolds below is describing Christ’s offers, wooings and entreaties both before and after conversion, which is clear from the beginning and end of the quote] We see then, to conclude all, what an absolute necessity lies upon us of having Christ, because with Him we have All things, and can do all things: without Him we are poor and can do nothing. And the more necessary the duty, the more sinful the neglect: especially considering that Christ withholds not Himself, but is ready to meet, to prevent, to attend every heart that in truth desires Him. If a man have a serious, simple, sincere will, to come wholly to Christ, not to be held back from him by His dearest and closest corruptions, by the sweetest pleasures, or strongest temptations, which can allure or assault him, he may draw near unto Him with boldness, and assurance of acceptation: he has a call, Christ invites [Margin Note: Rev. 22:17], yea entreats him, and therefore he may come: he has a command, Christ requires it of him, and therefore he must come. And now when we have Christ, how careful should we be to keep Him; how tender and watchful over all our behaviors towards Him, lest He be grieved and depart again. The Spirit of the Lord is a delicate spirit, most sensible of those injuries which his friends do Him. Let us therefore take heed of violating, afflicting, discouraging, grieving this Spirit (which is the bond of all our union and interest with Christ) in any of those his sacred breathings and operations upon the Soul. But when He teaches, let us submit and obey, receive the belief and the love of His Truth: when He promises, let us neither distrust nor despise, but embrace as true, and admire as precious, all the offers which He makes to us: when He contends with our lusts in His Word and secret suggestions, let him not always strive, but let us give up our fleshly affections to be crucified by Him: when He woos and invites us, when He offers to lead and to draw us, let us not stop the ear, or pull away the shoulder, or draw backward like froward children, or cast cold water in the face of Grace, by thwarting the motions, and rebelling against the dictates thereof, but let us yield our selves unto Him, captivate all our lusts, and consecrate all our powers, and submit all our desires to His rule and government; and then when He has been a Spirit of union, to incorporate us into Christ’s Body; and a Spirit of unction, to sanctify us with His Grace, He will undoubtedly be a Spirit of comfort and assurance, to seal us unto the day of our full redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life of Christ, from his Three Treatises</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Secondly, we must from hence be exhorted to take heed of usurping Christ’s honor to our selves, of being our own rule or way. The Lord is a jealous God, and will not suffer any to be a self mover, or a God unto himself. It is one of God’s extremest judgments to give men over to themselves, and leave them to follow their own rules. When He has first woo’d men by his Spirit, and that is resisted; enticed them by his mercies, and they are abused; threatened them with his judgments, and they are mis-attributed to second causes; cried unto them by his prophets, and they are reviled; sent his own Son to persuade them, and He is trampled on and despised: when He offers to teach them, and they stop their ears; to lead them, and they pull away their shoulder; to convert them, and they hardened their heart; when they set up mounds against the Gospel, as it were to non-plus and pose the mercies of God, that there may be no remedy left; then after all these indignities to the Spirit of Grace, this is the judgement with which God uses to revenge the quarrel of his Grace and Covenant, to leave them to the hardness and impenitency of their own hearts, to be a rule and way unto themselves. My people would not hearken to my voice, and Israel would none of me. … [Reynolds below is describing Christ’s offers, wooings and entreaties both before and after conversion, which is clear from the beginning and end of the quote] We see then, to conclude all, what an absolute necessity lies upon us of having Christ, because with Him we have All things, and can do all things: without Him we are poor and can do nothing. And the more necessary the duty, the more sinful the neglect: especially considering that Christ withholds not Himself, but is ready to meet, to prevent, to attend every heart that in truth desires Him. If a man have a serious, simple, sincere will, to come wholly to Christ, not to be held back from him by His dearest and closest corruptions, by the sweetest pleasures, or strongest temptations, which can allure or assault him, he may draw near unto Him with boldness, and assurance of acceptation: he has a call, Christ invites [Margin Note: Rev. 22:17], yea entreats him, and therefore he may come: he has a command, Christ requires it of him, and therefore he must come. And now when we have Christ, how careful should we be to keep Him; how tender and watchful over all our behaviors towards Him, lest He be grieved and depart again. The Spirit of the Lord is a delicate spirit, most sensible of those injuries which his friends do Him. Let us therefore take heed of violating, afflicting, discouraging, grieving this Spirit (which is the bond of all our union and interest with Christ) in any of those his sacred breathings and operations upon the Soul. But when He teaches, let us submit and obey, receive the belief and the love of His Truth: when He promises, let us neither distrust nor despise, but embrace as true, and admire as precious, all the offers which He makes to us: when He contends with our lusts in His Word and secret suggestions, let him not always strive, but let us give up our fleshly affections to be crucified by Him: when He woos and invites us, when He offers to lead and to draw us, let us not stop the ear, or pull away the shoulder, or draw backward like froward children, or cast cold water in the face of Grace, by thwarting the motions, and rebelling against the dictates thereof, but let us yield our selves unto Him, captivate all our lusts, and consecrate all our powers, and submit all our desires to His rule and government; and then when He has been a Spirit of union, to incorporate us into Christ’s Body; and a Spirit of unction, to sanctify us with His Grace, He will undoubtedly be a Spirit of comfort and assurance, to seal us unto the day of our full redemption.”

— Edward Reynolds, The Life of Christ, from his Three Treatises">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+we+must+from+hence+be+exhorted+to+take+heed+of+usurping+Christ%E2%80%99s+honor+to+our+selves%2C+of+being+our+own+rule+or+way.+The+Lord+is+a+jealous+God%2C+and+will+not+suffer+any+to+be+a+self+mover%2C+or+a+God+unto+himself.+It+is+one+of+God%E2%80%99s+extremest+judgments+to+give+men+over+to+themselves%2C+and+leave+them+to+follow+their+own+rules.+When+He+has+first+woo%E2%80%99d+men+by+his+Spirit%2C+and+that+is+resisted%3B+enticed+them+by+his+mercies%2C+and+they+are+abused%3B+threatened+them+with+his+judgments%2C+and+they+are+mis-attributed+to+second+causes%3B+cried+unto+them+by+his+prophets%2C+and+they+are+reviled%3B+sent+his+own+Son+to+persuade+them%2C+and+He+is+trampled+on+and+despised%3A+when+He+offers+to+teach+them%2C+and+they+stop+their+ears%3B+to+lead+them%2C+and+they+pull+away+their+shoulder%3B+to+convert+them%2C+and+they+hardened+their+heart%3B+when+they+set+up+mounds+against+the+Gospel%2C+as+it+were+to+non-plus+and+pose+the+mercies+of+God%2C+that+there+may+be+no+remedy+left%3B+then+after+all+these+indignities+to+the+Spirit+of+Grace%2C+this+is+the+judgement+with+which+God+uses+to+revenge+the+quarrel+of+his+Grace+and+Covenant%2C+to+leave+them+to+the+hardness+and+impenitency+of+their+own+hearts%2C+to+be+a+rule+and+way+unto+themselves.+My+people+would+not+hearken+to+my+voice%2C+and+Israel+would+none+of+me.+%E2%80%A6+%5BReynolds+below+is+describing+Christ%E2%80%99s+offers%2C+wooings+and+entreaties+both+before+and+after+conversion%2C+which+is+clear+from+the+beginning+and+end+of+the+quote%5D+We+see+then%2C+to+conclude+all%2C+what+an+absolute+necessity+lies+upon+us+of+having+Christ%2C+because+with+Him+we+have+All+things%2C+and+can+do+all+things%3A+without+Him+we+are+poor+and+can+do+nothing.+And+the+more+necessary+the+duty%2C+the+more+sinful+the+neglect%3A+especially+considering+that+Christ+withholds+not+Himself%2C+but+is+ready+to+meet%2C+to+prevent%2C+to+attend+every+heart+that+in+truth+desires+Him.+If+a+man+have+a+serious%2C+simple%2C+sincere+will%2C+to+come+wholly+to+Christ%2C+not+to+be+held+back+from+him+by+His+dearest+and+closest+corruptions%2C+by+the+sweetest+pleasures%2C+or+strongest+temptations%2C+which+can+allure+or+assault+him%2C+he+may+draw+near+unto+Him+with+boldness%2C+and+assurance+of+acceptation%3A+he+has+a+call%2C+Christ+invites+%5BMargin+Note%3A+Rev.+22%3A17%5D%2C+yea+entreats+him%2C+and+therefore+he+may+come%3A+he+has+a+command%2C+Christ+requires+it+of+him%2C+and+therefore+he+must+come.+And+now+when+we+have+Christ%2C+how+careful+should+we+be+to+keep+Him%3B+how+tender+and+watchful+over+all+our+behaviors+towards+Him%2C+lest+He+be+grieved+and+depart+again.+The+Spirit+of+the+Lord+is+a+delicate+spirit%2C+most+sensible+of+those+injuries+which+his+friends+do+Him.+Let+us+therefore+take+heed+of+violating%2C+afflicting%2C+discouraging%2C+grieving+this+Spirit+%28which+is+the+bond+of+all+our+union+and+interest+with+Christ%29+in+any+of+those+his+sacred+breathings+and+operations+upon+the+Soul.+But+when+He+teaches%2C+let+us+submit+and+obey%2C+receive+the+belief+and+the+love+of+His+Truth%3A+when+He+promises%2C+let+us+neither+distrust+nor+despise%2C+but+embrace+as+true%2C+and+admire+as+precious%2C+all+the+offers+which+He+makes+to+us%3A+when+He+contends+with+our+lusts+in+His+Word+and+secret+suggestions%2C+let+him+not+always+strive%2C+but+let+us+give+up+our+fleshly+affections+to+be+crucified+by+Him%3A+when+He+woos+and+invites+us%2C+when+He+offers+to+lead+and+to+draw+us%2C+let+us+not+stop+the+ear%2C+or+pull+away+the+shoulder%2C+or+draw+backward+like+froward+children%2C+or+cast+cold+water+in+the+face+of+Grace%2C+by+thwarting+the+motions%2C+and+rebelling+against+the+dictates+thereof%2C+but+let+us+yield+our+selves+unto+Him%2C+captivate+all+our+lusts%2C+and+consecrate+all+our+powers%2C+and+submit+all+our+desires+to+His+rule+and+government%3B+and+then+when+He+has+been+a+Spirit+of+union%2C+to+incorporate+us+into+Christ%E2%80%99s+Body%3B+and+a+Spirit+of+unction%2C+to+sanctify+us+with+His+Grace%2C+He+will+undoubtedly+be+a+Spirit+of+comfort+and+assurance%2C+to+seal+us+unto+the+day+of+our+full+redemption.%E2%80%9D%0A%0A%E2%80%94+Edward+Reynolds%2C+The+Life+of+Christ%2C+from+his+Three+Treatises&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17f9255f8e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17f9255f8e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/common-grace/the-westminster-confession-on-common-grace/#:~:text=Secondly%2C%20we%20must%20from%20hence%20be,the%20day%20of%20our%20full%20redemption&amp;text=Secondly%2C%20we%20must%20from%20hence%20be%20exhorted%20to&amp;text=us%20unto%20the%20day%20of%20our%20full%20redemption" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

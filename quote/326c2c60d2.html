<blockquote><p>1. But suppose a person has wronged another in his estate, and the party wronged be dead, what shall he do in this case? Let him restore his ill-gotten goods to that man’s heirs and successors. Question: But what if none of them be living? Answer: Let him restore to God; that is, let him put his unjust gain into God’s treasury by relieving the poor. 2. But what if the party who did the wrong be dead? Then they who are his heirs ought to make restitution. Mark what I say: if there be any who have estates left them, and they knew that the parties who left their estates did defraud others, and died with that guilt upon them, then the heirs or executors who possess those estates are bound in conscience to make restitution, else they entail the curse of God upon their family. 3. But if a man has wronged another, and he be not able to restore, what shall he do in this case? Let him deeply humble himself before God, promising to the party wronged (if the Lord make him able) full satisfaction, and God will accept of the will for the deed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Repentance, Useful for these Times (London, 1668), ch. 4, section 2</cite>, pp. 23-24</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9843bb9a1a" data-kw="">
<blockquote><p>VII. It [sin] is a deviation of human action (Mic. 6:8), whereas although their own law of nature is prescribed for brute beasts and inanimate objects (Jer. 8:7; Deut. 32:11; Isa. 1:3; Prov. 6:6), from which they can in some sense fall short, yet whenever this happens, there is not committed by them sin in the proper sense, as in the case when the earth does not produce its fruits, or when the digestion of the stomach or liver fails; yet because they do not have the moral law, and do not acknowledge their own natural law, nor can they order themselves to it, but rather are ordered and determined by another, properly speaking they neither deviate nor sin. Nor is it any hindrance to this that now and then they are said to be punished (Gen. 3:15; 9:5; Lev. 20:15–16; Ex. 21:28). For that penalty, pronounced thus catechrestically, in detestation of the material fact itself, through the body of that beast assails its owner. Nor also does their demise argue for sin, but for a fragile nature, enlarged by the occasion of human sin (Gen. 3:17; Rom. 8:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 7</cite>, pp. 492-93</span></figcaption>

<blockquote><p>Whether God is able to hate sin and will its existence? It is asked whether that distinction is frivolous by which we teach God to hate sin, and yet to will its existence? So says that Arminian against Perkins (p. 701). We deny: 1. Because for God to hate sin is not for God to intend that sin would never exist, as it is false that God decreed that the crucifixion of the Savior, the selling of Joseph, the carrying off of his people into captivity by the Assyrians and Chaldeans, the defecting of the ten tribes from the family of David and the spoiling of Job by the Sabeans, would not exist. 2. Because sin in itself is a disgraceful evil and an object of the displeasing and disapproving will [of God]. But truly for sin to exist is a useful good, conducing to the glory of God; and all good existing in time is from God, from the eternal decree. 3. Because in the explication of our distinction, Arminius falsely imputes to us that we teach that God wills and approves sin existing and that God does not hate sin existing. For God hates sin and hates the existence of sin in the genus of a disgraceful thing, and yet He decrees to permit that it would exist under the genus of a useful thing. 4. [William] Twisse rightly says, Marcus Cato[1] willed Carthage [an enemy city] to exist inasmuch as it was a grindstone and material exercising youth of Roman virtue, and yet he willed against it, i.e. to hate Carthage. I further add that Peter rightly willed that Christ would spare Himself, that He would not be killed by ungodly foes; and yet Christ wills against this, rightly declaring him to be of Satan; notwithstanding, Peter was bound to hate that occasion as it was sin (Mt. 16:21-23). [1] Marcus Cato the elder (234-149 B.C.) was a Roman soldier, senator and historian known for his opposition to Hellenization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Examination of Arminianism, p. 233-234, as trans. in Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter trans. Charles Johnson &amp; Travis Fentiman (1668 / 2019)</cite>, pp. 68-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><figure class="quote" id="q-cedf944e34" data-kw="privation">
<blockquote><p>Hence it follows that the formal reason of sin consists in anomia and privation, denoting the want of the rectitude or goodness which ought to be in the rational creature according to the prescription of the law (whether it belongs to the nature or qualities or actions themselves, for it deprives all these of conformity with the law and so constitutes them guilty of sin). But this privation is not pure or simple, but corrupting; not idle, but energetic; not of pure negation, but of depraved disposition, by which not only is the due rectitude taken away, but also an undue unrectitude and a depraved quality laid down, infecting all the faculties. Just as a physical disease is not only a removal of the temper of the humors, but also a corrupt disposition and disorder (dyskrasia) of them, so sin (which holds the relation of a moral disease of the soul) is not only the negation of a good, but the position of a corrupt disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.1</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Hence it follows that the formal reason of sin consists in anomia and privation, denoting the want of the rectitude or goodness which ought to be in the rational creature according to the prescription of the law (whether it belongs to the nature or qualities or actions themselves, for it deprives all these of conformity with the law and so constitutes them guilty of sin). But this privation is not pure or simple, but corrupting; not idle, but energetic; not of pure negation, but of depraved disposition, by which not only is the due rectitude taken away, but also an undue unrectitude and a depraved quality laid down, infecting all the faculties. Just as a physical disease is not only a removal of the temper of the humors, but also a corrupt disposition and disorder (dyskrasia) of them, so sin (which holds the relation of a moral disease of the soul) is not only the negation of a good, but the position of a corrupt disposition.”

— Francis Turretin, Institutes of Elenctic Theology, 9.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%20it%20follows%20that%20the%20formal%20reason%20of%20sin%20consists%20in%20anomia%20and%20privation%2C%20denoting%20the%20want%20of%20the%20rectitude%20or%20goodness%20which%20ought%20to%20be%20in%20the%20rational%20creature%20according%20to%20the%20prescription%20of%20the%20law%20%28whether%20it%20belongs%20to%20the%20nature%20or%20qualities%20or%20actions%20themselves%2C%20for%20it%20deprives%20all%20these%20of%20conformity%20with%20the%20law%20and%20so%20constitutes%20them%20guilty%20of%20sin%29.%20But%20this%20privation%20is%20not%20pure%20or%20simple%2C%20but%20corrupting%3B%20not%20idle%2C%20but%20energetic%3B%20not%20of%20pure%20negation%2C%20but%20of%20depraved%20disposition%2C%20by%20which%20not%20only%20is%20the%20due%20rectitude%20taken%20away%2C%20but%20also%20an%20undue%20unrectitude%20and%20a%20depraved%20quality%20laid%20down%2C%20infecting%20all%20the%20faculties.%20Just%20as%20a%20physical%20disease%20is%20not%20only%20a%20removal%20of%20the%20temper%20of%20the%20humors%2C%20but%20also%20a%20corrupt%20disposition%20and%20disorder%20%28dyskrasia%29%20of%20them%2C%20so%20sin%20%28which%20holds%20the%20relation%20of%20a%20moral%20disease%20of%20the%20soul%29%20is%20not%20only%20the%20negation%20of%20a%20good%2C%20but%20the%20position%20of%20a%20corrupt%20disposition.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%209.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcedf944e34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cedf944e34.html">Permalink</a><span class="src none">No free online copy linked</span></div>

<blockquote><p>V… In conclusion, the image of God in the first man was fittingly analogous to a son reflecting his father, especially in that which the father considers his most distinguishing feature—the face. Similarly, man was to reflect what God Himself deems most important: His holiness (Leviticus 19:2, Hebrews 11:10), which God is frequently said to swear by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a67b3992d" data-kw="">
<blockquote><p>Second, by metonymy and metaphor [metaphoram metonymicam], it [reason] can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Use of Reason in Matters of Faith’ in Willem J. van Asselt, Introduction to Reformed Scholasticism (RHB, 2011), Appendix 2</cite>, pp. 226-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-8a312a8286" data-kw="">
<blockquote><p>Some infer from this passage that men were content with herbs and fruits until the deluge, and that it was even unlawful for them to eat flesh. And this seems the more probable, because God confines, in some way, the food of mankind within certain limits. Then after the deluge [Gen. 9], He expressly grants them the use of flesh. These reasons, however are not sufficiently strong: for it may be adduced on the opposite side, that the first men offered sacrifices from their flocks [Gen. 4]. This, moreover, is the law of sacrificing rightly, not to offer unto God anything except what He has granted to our use. Lastly men were clothed in skins [Gen. 3:21]; therefore it was lawful for them to kill animals. For these reasons, I think it will be better for us to assert nothing concerning this matter. Let it suffice for us, that herbs and the fruits of trees were given them as their common food; yet it is not to be doubted that this was abundantly sufficient for their highest gratification. For they judge prudently who maintain that the earth was so marred by the deluge, that we retain scarcely a moderate portion of the original benediction. Even immediately after the fall of man, it had already begun to bring forth degenerate and noxious fruits, but at the deluge, the change became still greater. Yet, however this may be, God certainly did not intend that man should be slenderly and sparingly sustained; but rather, by these words, He promises a liberal abundance, which should leave nothing wanting to a sweet and pleasant life. For Moses relates how beneficent the Lord had been to them, in bestowing on them all things which they could desire, that their ingratitude might have the less excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Gen. 1, verse 28</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

olasquotes.github.io%2Fquote%2F8a312a8286.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a312a8286.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=Some%20infer%20from%20this%20passage%20that,ingratitude%20might%20have%20the%20less%20excuse." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f82f7b4c56" data-kw="">
<blockquote><p>Of this intellectual treasure house [the conscience], we are to know these [things]: 1. That in the inner cabinet, the natural habit of moral principles lodges, the register of the common notions left in us by nature, the ancient records and chronicles which were in Adam’s time, the Law of Nature of two volumes [corresponding to both Tables of the Law]… All these are written in the soul, in deep letters, yet the ink is dim and old, and therefore this light is like the moon swimming through watery clouds, often under a shadow, and yet still in the firmament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation Against Pretended Liberty of Conscience, ch. 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-1b7a7012b6" data-kw="">
<blockquote><p>[3.] If parents, by refusing to comply with the desire of their children [in desiring to marry someone], plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

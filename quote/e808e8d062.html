<main class="wrap"><figure class="quote" id="q-e808e8d062" data-kw="">
<blockquote><p>Messiah’s subjects are his, because he gave himself for them, that being bought with a price, they might be to him a peculiar people. Man, forsaking God, became the slave of sin, and was led captive by Satan. Satan’s was indeed an usurped authority, of which by mere power he might have been dispossessed; but in this case the justice of God sanctioned the accusations of Satan. When the accuser of the human race declared that man was a rebel, and as such deserving of death, in this the father of lies only stated the truth. Die then man, or justice must, unless some one should be found of power sufficient to sustain and pay the wages of sin, and of love so unparalleled as to make him submit to so costly a sacrifice to retrieve our ruined cause. In vain would we have cast our despairing eyes around; throughout the whole universe of God, Christ alone was to be found at once able and willing to undertake our cause.

On me, said he, let the sword of divine justice fall—let these my people go free. Punishment was exacted, and he became answerable; and, by the once offering up of himself, accomplished what the blood of bulls and of goats could never have effected, making an end of sin, and bringing in an everlasting righteousness. The sins of his people lay heavy on him in the garden of Gethsemane, and on the cross of Calvary. This armed his enemies with power against him. Had it not been for thee O Christian! scribes and Pharisees, rulers and priests had in vain cried out, crucify him, crucify him. Had it not been for thee, Herod with all his men of might durst not have set him at nought, nor Pilate dared to lift up a scourge against him. Your sins nailed him to the cross—they pierced his hands and his sides.

By thus dying, he accomplished the deliverance of his people—delivered them from the curse of the law, and destroyed him that had the power of death, that is the devil. Is it not equitable that the lives which he had thus rescued from sin and Satan, from death and hell, should be devoted to his service? He gave himself for them with the express view that he might redeem them from all their iniquity, and purify them unto himself, a peculiar people, zealous of good works. Paul urges on the Corinthians this strong and powerful claim, that they were bought with a price, a costly price, and should not, therefore, henceforward live to sin or to self, to the world or the flesh, but remembering whose they are, to him who died for them, and rose again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-greig.html">Christopher Greig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Subdues a People to Himself in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a002a9e32" data-kw="">
<blockquote><p>Regarding the first , the Arminians think that the death of Christ was not necessary for procuring salvation for men, and they believe that God could have pardoned sins without any satisfaction. The Orthodox [Reformed], indeed, believe that that way of saving the human race was the most fitting of all, since God was pleased to use it; yet most of them readily concede to the Arminians that it was not absolutely necessary, and they do not contend that God’s justice was to that extent inexorable. Amyraut believes that God’s justice is so inflexible, and the majesty of his laws so holy and inviolable, that it could not suffer sins to be pardoned without satisfaction. In this matter, he has surrounded the orthodox doctrine with a defense by which it is stripped by many others. He has, moreover, proved his opinion on this matter with arguments in his Theses on the Necessity of Satisfaction for Grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Declaration of the Faith of Moses Amyraut concerning the Errors of the Arminians</cite>, trans. AI by Onku (Salmur: Lesnerius, 1646), p. 5 Latin</span></figcaption>

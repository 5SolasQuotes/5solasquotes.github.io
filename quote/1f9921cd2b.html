<blockquote><p>3. Elect infants, dying in infancy, are regenerated and saved by Christ through the Spirit,[m] who worketh when, and where, and how He pleaseth.[n] So also are all other elect persons, who are incapable of being outwardly called by the ministry of the word.[o] [m] Luke 18:15,16 and Acts 2:38,39 and John 3:3,5 and 1 John 5:12 and Rom. 8:9. (Compared together) [n] John 3:8. [o] 1 John 5:12. Acts 4:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, 10.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10590f5402" data-kw="">
<blockquote><p>3. We must know that there is no salvation out of this Church; such as never become members of it, must eternally perish: they that are true members, shall be saved. If they had been of us, they would have continued with us: but they went out from us, that it might be manifest they were not of us. Without are dogs and scorners, etc. All out of the ark perished in the waters. ‘The Lord added to the Church daily such as should bee saved.’ First, because there is no means of salvation out of it; no word to teach, no sacraments to confirm. And especially because out of the Church there is no Christ, and out of Christ no salvation. Who have not the Church their mother, cannot have God their Father… ‘The general assembly’ [Heb. 12:23]: this is the property of the Church; ‘General’. It is catholic in three respects; of Time, of Persons, of Place… Thus we see the property of this Church, catholic or general. It is one, but not tied to one time, nor one place, nor one person: it is catholic to all times, to all places, to all persons… …I desire to express two things: one for distinction, the other for instruction. First for distinction betwixt this Generall assembly and particular churches: then for instruction, to show who be true members of this catholic Church. 1. The main difference between them consists in this: that the catholic Church is always invisible, the members thereof only known to God: particular churches are sometimes invisible, and lying hid; other times manifest in the open profession of Christ’s name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Happiness of the Church, or a Description of those Spiritual Prerogatives wherewith Christ has endowed her, considered in some Contemplations upon part of the 12th Chapter of the Hebrews</cite>, … together with certain other Meditations… (London: Grismand, 1619), ‘The Happiness of the Church’, ‘To the General Assembly…’, pp. 56-58</span></figcaption>

</figure><figure class="quote" id="q-955ba2332e" data-kw="marks word sacraments duty join true church">
<blockquote><p>Is the truth of doctrine which is held in any assembly, or its conformity with the word of God by the pure preaching and profession of the word, and the lawful administration and use of the sacraments, a mark of the true visible church? We affirm against the Romanists. After having treated of the nature, properties and adjuncts of the church, the order demands that we discuss its marks. This question pertains to its external state and is of the highest importance in religion. For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.12.1</span></figcaption>

</figure><figure class="quote" id="q-820cf352cf" data-kw="">
<blockquote><p>What now will you say to these things, that your Church is not the catholic Church, but a part of it only; and is only catholic, because of the catholic doctrine that she professes? But if this be true, wherefore then did your general council condemn it in John Hus, and burn him for that doctrine, which both yourself must confess to be true, and is agreeable to Scripture, Fathers, and your own Popes? …yet for all this, not only call ye [Romanists] your Church Catholic, because of the soundness of doctrine which ye suppose she professes, but also and specially to make the simple believe that there is no salvation out of her… Therefore ye call it the only true Church, and the Catholic Church: for out of the particular Church there is salvation, but out of the catholic Church there is no salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-welch.html">John Welch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Popery Anatomized</cite>, ... (d. 1622; Glasgow: Sanders, 1672), Section 2, ‘Whether the Church of Rome is the Catholic Church?’, p. 9</span></figcaption>

</figure><figure class="quote" id="q-77ed91956b" data-kw="">
<blockquote><p>Q. May one be saved out of the Church’s communion? A. There is no salvation out of the universal Church; but there is no particular church out of which one may not be saved, and there is such particular church, the communion whereof must one renounce than to be saved. Q. What difference is there between the particular churches? A. Some are pure and true in their doctrine, and others are impure and untrue.</p></blockquote>

<blockquote><p>True faith in the least degree, gives the soul a share in the first resurrection. It is of the vital principle which we receive when we are quickened. Now, be it never so weak a life we have, yet it is a life that shall never fail. It is of the seed of God, which abideth,—incorruptible seed, that dieth not. A believer is spirit,—is quickened from the dead; be he never so young, never so sick, never so weak, he is still alive, and the second death shall have no power over him. A little faith gives a whole Christ. He that hath the least faith hath as true an interest, though not so clear an interest, in the righteousness of Christ as the most steadfast believer. Others may be more holy than he, but not one in the world is more righteous than he; for he is righteous with the righteousness of Christ. He cannot but be low in sanctification, for a little faith will bring forth but little or low obedience; if the root be weak, the fruit will not be great. But he is beneath none in justification. The most imperfect faith will give present justification, because it interests the soul in a present Christ. The lowest degree of true faith gives the highest completeness of righteousness, Col. 2:10. You, who have but a weak faith, have yet a strong Christ. So that, though all the world should set itself against your little faith, it should not prevail. Sin cannot do it; Satan cannot do it;—hell cannot do it. Though you take but weak and faint hold on Christ, he takes sure, strong, and unconquerable hold on you. Have you not often wondered, that this spark of heavenly fire should be kept alive in the midst of the sea? It is everlasting; a spark that cannot be quenched,—a drop of that fountain that can never be wholly dried up. Jesus Christ takes special care of them that are weak in faith, Isa. 40:11. On what account soever they are sick, and weak, and unable, this good Shepherd takes care of them. He shall rule, and they shall abide, Mic. 5:4.</p></blockquote>

<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.

4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ.

5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

<blockquote><p>X. The making of the charge is described by the metaphor of books or records in which the actions of the person who are being judged are written down. Revelation 20:12 ‘And the books were opened.’ By the word ‘books’ is to be understood both God’s omniscience and man’s conscience. XI.The wicked will be judged in accordance with their works and on account of their works; the righteousness according to the works of faith but not on account of their works. Thus in Revelation 20:12 it is said the that another book, the book of life, was opened, so that we may know that the salvation of the righteous depends not on works but on the eternal grace of God, through which they have been entered into the book of life.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“X. The making of the charge is described by the metaphor of books or records in which the actions of the person who are being judged are written down. Revelation 20:12 ‘And the books were opened.’ By the word ‘books’ is to be understood both God’s omniscience and man’s conscience. XI.The wicked will be judged in accordance with their works and on account of their works; the righteousness according to the works of faith but not on account of their works. Thus in Revelation 20:12 it is said the that another book, the book of life, was opened, so that we may know that the salvation of the righteous depends not on works but on the eternal grace of God, through which they have been entered into the book of life.”

<main class="wrap"><figure class="quote" id="q-28f4e5723f" data-kw="">
<blockquote><p>[T]he wisdom of God authorized and employed his sacred Penmen and Secretaries to enrol and register up the several passages of the Church, and to transmit them to posterity, in particular, besides those sacred Annals of his Church contained in the Historical books of Scripture, the holy Ghost hath purposely framed, some more summary and compendious, but your full and perfect relations of the affairs of his Church, and this likewise composed and framed into songs and psalms, to make them more fit carriage for memory, and that by the pleasantness of them they might sink more deeply into their hearts, &amp; more strongly affect them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-brownrigg.html">Ralph Brownrigg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Repentance and prayer or, the two fundamental pillars of the nation. Being the substance of four sermons preached at St. Peter’s Poor, London. By that famous and reverend divine Ralph Brownrigg, formerly vice-chancellor of Cambridge, and lately Lord Bishop of Exeter</cite>, (London: Thomas Riland, 1660), p. 43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-0374cb9c06" data-kw="">
<blockquote><p>In the point of excellency, no other form of psalmody can bear a comparison with the songs of inspiration. Imperfection is stamped upon all the works of man; the most highly finished pieces of sacred poetry frequently discover weakness of sentiment, or are marred by improper figures and allusion. Of the Psalms alone, it can be truly declared that they are perfect. The Holy Spirit has transcribed his own character of purity, wisdom and love, in these unrivalled compositions. This excellence they claim above every rival, that, as the words of God, they are of tried power to enlighten the mind, purify the affections, subjugate the will, and transform the whole inner man. It accords with the experience of the saints in every age to believe that the Spirit’s hallowed influences descend most copiously upon his own words: the most sensible relief, encouraging counsel, and abounding comfort are experienced in calling them to remembrance, and by faith applying them. As the design of singing praise is evidently to elevate the affections, and to excite the hope and peace and joy, the believer has reason to expect that, in using the inspired Psalms, which are the immediate productions of the Holy Spirit, these spiritual emotions will be awakened, and the enjoyment of their appropriate objects realized; the same confidence, in an equal measure, he has no ground to entertain from the use of uninspired psalmody.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1835, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-ff57609447" data-kw="">
<blockquote><p>Though the “Book of Praises” was gathered during the OT era and used in the Temple’s worship, its full intent as a canon of praise could not be fully grasped until Christ came. Its intent was to reveal and praise the Savior-King who would fulfill all the promises of God’s covenant with Israel. Jesus Christ must therefore be understood as the Sovereign of the Psalter, but also as the source of and the purpose for the development of the canon of the Psalter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rpcna-synodical-study-committee-on-worship.html">RPCNA Synodical Study Committee on Worship</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms in the Worship of the Church</cite>, “The Psalms in the Worship of the Church.” Submitted to the Synod of the RPCNA, June 2004</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

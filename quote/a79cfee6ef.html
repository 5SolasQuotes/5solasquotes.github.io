<main class="wrap"><figure class="quote" id="q-a79cfee6ef" data-kw="">
<blockquote><p>Is the moral law of perpetual obligation? Then it follows that, as a covenant of works, it retains and will continue throughout eternity to retain its whole authority and obligation over every sinner of mankind who lives and dies under it. In its covenant form, it stands in full force and can never be repealed. It will continue throughout all eternity to hold the finally impenitent under both its commanding and its condemning power. They shall remain forever under an infinite obligation both to yield perfect obedience to its righteous precepts and to give infinite satisfaction for their disobedience of them. There is no possible way in which a sinner can be freed from the perpetual obligation of the law as a covenant but by presenting, in the hand of faith to it, the infinitely perfect and meritorious righteousness of the second Adam as a full answer to all its high demands. When this glorious righteousness is received by faith and graciously imputed to a man, the law in its covenant form is fully satisfied with respect to him, and in that form it has nothing more to demand from him. He now passes from the obligation of the covenant of works and comes under the perpetual obligation of the law as a rule of duty in the covenant of grace, and he will remain under its infinite obligation through all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 76–77.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db33a0351c" data-kw="">
<blockquote><p>The Sinai covenant-administration was no bargain for sinners, and I pity the poor Israelites who suffered under its administration, just as I understand perfectly well why seventy-three (nearly half) of their psalms were laments. I would have resisted this covenant also, had I been there, because such a legal covenant, whose conditions require strict obedience (and threaten severe curse-sanctions), is bound to fail if one of the parties to it is a sinful people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/t-david-gordon.html">T. David Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law is Not of Faith</cite>, (2009), p. 251</span></figcaption>

</figure><figure class="quote" id="q-5481a13ede" data-kw="fifth commandment parents">
<blockquote><p>Among others in relation to the fifth precept, this question concerning the honoring of parents is agitated between us and the papists. In many ways, the latter weaken this precept, maintaining that children, against the consent of their parents, may not only contract marriage, but even adopt a monastic life. May children withdraw themselves from the power of their parents and marry without their consent? We deny against the papists.</p></blockquote>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

<main class="wrap"><figure class="quote" id="q-86a8512fe1" data-kw="">
<blockquote><p>In Dr. [Alexander] Whyte’s opinion, at no time has any land for its size, save Palestine, produced “so many men and women of a profoundly spiritual experience, and of an adoring and heavenly mind, as Scotland possessed in the sixteenth and seventeenth centuries”.

In his ecstasy he exclaims, “What minds and what hearts those men and women had! And how they gave up their whole mind and heart to the life of godliness in the land, and to the life of God in their own hearts! How thin and poor our religious life appears beside theirs!”

To the causes which he suggests for this superiority — the persecution, the new Reformation doctrines, the masculine and Pauline preaching — other two at least may be added, the solid and serious books then in favour, and the place assigned to the inspired psalms, now too often usurped by frothy hymns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dr Whyte and Samuel Rutherford (1894) in Critical Reviews Relating Chiefly to Scotland</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-740a1e495c" data-kw="">
<blockquote><p>It is good to sing psalms, especially if they are sung to the Lord and with reverence, but it is not good if the psalms are used without any reverence either at dinner parties with drinking or in the churches for profit. Likewise, an oath made under the name of God is good if it is done in a trial and reverently with the fear of the Lord. It is not good if it is done rashly and lightly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Righteousness, Oaths, and Usury: A Commentary on Psalm 15</cite>, trans. Todd M. Rester (1573; Grand Rapids MI: Christian’s Library Press, 2013), p. 68.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-6da3c2a772" data-kw="">
<blockquote><p>We observed with much regret that the Psalms of David, which is the divinely authorized Hymn Book of the Christian Church, are seldom used. Not content with a supplement of hymns, for occasionally use, one collection has followed another, each more bulky and copious than its predecessor, until the Psalms of David are in no small danger of being thrust wholly out of sight and mind.

The Hymn Books, which all denominations have formed, each one to please its own taste for poetry, and its own views of orthodoxy, like the traditions of the scribes of old, are making void the oracles of God, and estranging the church from those inspired compositions in which the sweet-singer of Israel celebrates the fortunes of the Church and her glorious Head, in strains adapted to every age, until the Son of God shall appear to take the kingdom to himself, and terminate the mediatorial work.

The Psalms, as a natural consequence, seem less read in private, and less understood and relished – treated as if they were the hymns of a bygone dispensation, having little nourishment for a gospel church. Christians who will not take the trouble of penetrating beneath the antique veil and drapery of these noble compositions, pronounce them Jewish grapes, fit only for the infancy of the church and the ritual service of Judaism; yet good Bishop Horne, by his piety, and Bishop Horsley by his perspicacity – two minds as differently constituted as ever two minds were – have both attained the same convictions, and spread before us in their expositions, not the unripe grapes of Judaism, but the ripe clusters of Zion, discerning themselves, and making visible to others Christ and his church, its joys and sorrows, sufferings and triumphs, until time shall be no more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lewis.html">George Lewis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Impressions of</cite>, America and the American churches (Edinburgh, 1845), pp 100-01.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-6a8daa9d23" data-kw="">
<blockquote><p>We knew that these psalms, and hymns and spiritual songs, though in other languages (and consequently so in other poetical measures) were inspired by the Holy-Ghost, to holy men of old for the edification and comfort of the Church and people of God in all ensuing ages to the end of the world. And for these holy ends we have with special care &amp; diligence translated them into such meters as are most usual and suitable for such holy poems, in our own language, having a special eye to the gravity of the phrase of sacred writ and sweetness of the verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-dunster.html">Henry Dunster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms Hymns and Spiritual Songs of the Old and New Testament, faithfully translated into English metre</cite>, ([Cambridge, Mass.], 1651), ‘To the Godly Reader’, no page number. This 3rd edition of the Bay Psalm Book psalter has the 150 psalms and other inspired Bible songs in it (the original Bay Psalm Book did not have the other Bible-Songs). On the title page is 2 Tim. 3:16-17; Col. 3:16; Eph. 5:18-19; James 5:13. This same psalter and preface were reprinted in Boston in 1698 with Cotton Mather’s name on it.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

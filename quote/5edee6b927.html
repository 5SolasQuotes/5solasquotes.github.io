<main class="wrap"><figure class="quote" id="q-5edee6b927" data-kw="">
<blockquote><p>…all know that it was the fewest number of the United Societies, that was led off with Robert Hamilton to the disowning of King William [III] as King of Britain and his Government; the greater part reckoned it their duty to take a legal unite[d] way of witnessing, by humble pleadings, representations, and protestations, pleading for and with their mother to put away her whoredoms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant: Peden, Semple, Welwood, Cameron, Cargill, Smith, ed. D. Hay Fleming (London: Hodder and Stoughton, 1901; rep. Edinburgh: Blue Banner Productions, 1999), 1.147</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c70f018ea" data-kw="">
<blockquote><p>Beware of division yourselves, and give your help to recover, in all tenderness, these that have withdrawn, and encourage them not in their way. I’m persuaded that if they were not so much countenanced and encouraged by these that are hearers, the number of such would not be so great as it is. Let not that itching ear get place with you, so as to run away to their meetings whenever you have opportunity, and so to cast yourselves into a snare, and to do what in you lies to strengthen the division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-383f9aeb5e" data-kw="">
<blockquote><p>That, seeing they were convened by the warrant of Christ and his Kirk, to see that it suffered no detriment in so needful and dangerous a time, they should obey God rather than man; and, notwithstanding of any charge, remain at his work so long as it should be found expedient for the well of the Kirk so to do.” (Calderwood, History, p. 340) Now, it seems, those eminent pastors, Mr. Robert Rollock, Mr. James Melville, who with others were members of that commission, thought it was a court of Christ, seeing ’tis affirmed by them, they were met by warrant from him: And the learned Principal Forrester, in Answers to Queries put to the Presbyterians in Scotland, says (pp. 177-78): “Commissions have the same warrant with synods and Assemblies.” And Rutherford, in Preface to his Lex Rex, p. 13, says, “The Commissioners of General Assemblies have the same warrant of God’s Word that messengers of the Synod have, Acts 15:22, 27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-8e797b9129" data-kw="">
<blockquote><p>That though a person has been thrust in upon a people in an undue manner, yet their after acceptance, approbation and submission to his ministry, makes him a pstor to them, supplying the want of election at first; as Jacob’s after-consent and acceptance of Leah made her to be his wife, though he was far from choosing her at first. And though it be a sin in ministers of the gospel to settle any pastor contrary to the inclinations of a people, yet in my opinion, though the people are not obliged, they may submit to the ministry of such without sin, declaring their non-approbation of the procedure, and testifying against the manner of settlement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-fe0b4d24e5" data-kw="">
<blockquote><p>Indeed it was the divisions and heights run into by some who joined in that rising, contrary to the inclinations of the better and greater part, with the indiscretion rashness, and ill conduct, not to say cowardice of Robert Hamilton, who took the command upon him, which ruined that design, and effectually broke all their measures, much more than any opposition which was or could he made by the king’s troops. And the terrible handle made of this rising by the bishops and violent party in the government, in severities, circuits, aud oppression of all presbyterians for many years after it was over…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3</cite>, pp. 51-52</span></figcaption>

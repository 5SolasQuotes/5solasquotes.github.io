<blockquote><p>But the special and principal Covenant which is especially called the Old, and is distinguished from the New Covenant of the Gospel, is God’s making and renewing of the Covenant with Israel, partly by his own mouth, and partly by the ministry of Moses on Mount Horeb, which is mentioned Exod. 19. 20. For that Covenant is a mixt Covenant, partly of the Covenant of Works, which is the Old Covenant, partly of the Covenant of Grace, which was made after the fall.

First, God sent Moses to the people to ask whether they would obey the Lord’s voice, and keep all his Commandments, that they might thereby live and be blessed. They answered all together, and said, All that the Lord hath spoken we will do. Thereupon the Lord came down upon Mount Sinai, in fire and smoke and with terrible Thunders and Lightnings, and the sound of a Trumpet, and spake unto them the words of the Law immediately with his own mouth, promising life to them that kept it, and threatening death to the breakers thereof,

Now this was but a repeating, and renewing of the first Covenant of Works, to be performed by every man in his own person, for the obtaining of life. In this therefore there was no Mediator between God and the people.

The Reasons why the Lord thus began with Israel, and first renewed the Old Covenant, were divers.

The first, was their pride, presumption, and hardness of heart; they presumed that they could do all that the Lord would command them, and therefore he gave them his Law to shew them their duty; that they assaying to fulfil it, and finding their own insufficiency, might be humbled and brought down from vain confidence in their own Works.

Here the Lord did deal with them, as wise fathers deal with their foolish &amp; vain boasting sons, who do promise largely that they will do any thing which their fathers will command them, and that by their merits they will bind their fathers to love them, and to give them the inheritance. In such a case, a wise father will put such a boasting son to the trial, and will put him to a task which he knoweth that he is unable to go through; not because he believes, or hopes that his son can perform it (being through his own intemperance disabled) but for this end, to make him see his own folly and insufficiency. And so the Lord did deal with Israel.

Secondly, the Lord gave the Law, which is the rule of righteousness, and withal shewed the punishment due to the transgressors of it; that it might be as the rod of a Schoolmaster, to drive them to Christ, to learn the saving knowledge, and way of life in him, as the Apostle speaks, Gal. 3. and to make them out of fear renounce themselves, and seek mercy in him.

Thirdly, to teach them and us, that howsoever it is impossible for us to be saved by the Law, by reason of our sinful flesh, and our corruption which hath utterly disabled us, that we cannot obey it; yet the Law is still in force, and requires perfect righteousness; and without the righteousness of the Law fulfilled by Christ for us, we cannot be justified nor saved, according to that saying of the Apostle, Christ is the end of the Law for righteousness to every one that believeth, Rom. 10. 4. For these and such like reasons God gave the Law.

But when the people of Israel heard the Law, which was the Covenant of Works to be performed in their own persons, and that immediately from God himself, it is said that they were sore afraid, and being not able to abide the sight of God’s glory, nor the sound of his voice, they cried out, Why should we die? and hereupon they began to desire a Mediator, even Moses, saying, Go thou &amp; hear the Lord, &amp; speak thou to us, Exod. 20. 19. and Deut. 5. 25, 26, 27. This was some good beginning; the Law began to take effect, and to drive them towards a Mediator.

And therefore the Lord said, They have well spoken all that they have said, to wit, in desiring a Mediator; &amp; added withal, O that there were in them such an heart, that they would fear me, and keep my Commandments always: that it might be well with them and their children! Which words shew the Will and Mind of God, wishing after a sort their increase and continuance in this good mind and fear of him, and seeking to keep his Commandments, in, and by a Mediator. Whereupon he proceeds to deal with them by a Mediator, and to renew the Covenant with them, by appointing divers figures of Christ, as Sacrifices, Rites, Ceremonies, the Tabernacle, the Ark of the Covenant, and the Mercy Seat; in all which, as in Types, he did reveal Christ, though obscurely, unto them, and shewed that sin was to be expiated and purged away by his Death.

Afterward, also when they came into the land of Moab, he did renew the Covenant of Grace in more plain terms, than he did on Mount Horeb; insomuch that by reason of the greater plainness, it is called another Covenant, Deut. 29. 2. There he told them, that Christ should be their Rock, Deut. 32. 4. and that the Word, his Gospel, was among them.

Now because of the first part of this Covenant, to wit, the ten Commandments which God spake first, and after gave them written in two Tables, which are called by the name of Covenant, Deu. 4. 13. and 9. 9. and indeed are the sum of the Old Covenant which God made with men in the Creation;

This Covenant, which God made with Israel, is called the Old Covenant, and the Covenant of the Law, and is opposed to the Covenant of the Gospel, that is, to the Covenant, as it is now revealed in the writings of the Evangelists and Apostles, and plainly preached and published over all the world.

Thus much for the Old Covenant.</p></blockquote>

<blockquote><p>A difference exists between a furnished and destitute state. The one is of the law considered in itself and its own nature; the other, in relation to us. The law was given to man in the beginning (before the fall) for life and by itself also led to life according to the sanction “do this and thou shalt live” (cf. Rom. 2:13). But after the fall, being destitute of strength through the flesh, it is not given for life, but for a mirror of sin and misery to render the sinner inexcusable (Rom. 3:19, 20). [1.4.15] …So God seriously wills (i.e., commands man to obey the law that he may live, according to the brief clause of the covenant of works: “Do this and thou shalt live”). [4.17.45] IV. (2) If Adam was righteous, he ought to have been immortal because there is a necessary connection between righteousness and life. (a) From the order of God who has joined righteousness and life in the law by an indissoluble bond (as he joined closely together sin and death: “Do this and thou shalt live; the soul that sinneth it shall die”). [5.12.4] XVII. There is not the same relation of justification and of the covenant through all things. To the former, faith alone concurs, but to the observance of the latter other virtues also are required besides faith. These conduce not only to the acceptance of the covenant, but also to its observance. For these two things ought always to be connected—the acceptance of the covenant and the keeping of it when accepted. Faith accepts by a reception of the promises; obedience keeps by a fulfillment of the commands. “Be ye holy, for I am holy.” And yet in this way legal and evangelical obedience are not confounded because the legal is prescribed for the meriting of life, the evangelical, however, only for the possession of it. The former precedes as the cause of life (“Do this and thou shalt live”); the latter follows as its fruit, not that you may live but because you live. The former is not admitted unless it is perfect and absolute; the latter is admitted even if imperfect, provided it be sincere. That is only commanded as man’s duty; this is also promised and given as the gift of God. [12.3.17]</p></blockquote>

<blockquote><p>VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)</p></blockquote>

</figure><figure class="quote" id="q-94c18d479f" data-kw="">
<blockquote><p>The second main difference is this, namely, that the Covenant of works is made without a Mediator, to mediate between God and man. But in the Covenant of grace there is a Mediator coming between, to unite God and man together, and make them one. Hence Heb. 9.15. Christ is called the Mediator of the new Testament; so also Heb. 12.24. but the first Covenant of works had no Mediator. The reason of this difference is, because when God came to make a covenant of works with Adam, then there was no disagreement between God and man, man was yet righteous, persisting in that innocency and righteousness in which he was created, there was yet no breach made, the heart and mind of man answering to the mind of God, and therefore there was no need of a Mediator to bring them together;

But when the Covenant of grace is made with man, there is a former breach between God and him, and so there is need of a third party, of a Mediator to make them one. Hence is that in Gal. 3.20. A Mediator is not a Mediator of one; whiles we are one with God, there is no need of a Mediator, no more then there is need for one to mediate between a man and himself, (this is the ordinary interpretation of that place, though it may probably bear another sense) and so it was betwixt God and man in the beginning, there was no variance then between them by sin, then God made a Covenant with man, as with his friend, as Abraham is called the friend of God, but when sin had made a breach between God and man, then strangeness and enmity followed, God is estranged from us, and we are enemies unto God, so that without a Mediator, we can never come to be united into Covenant again.

Now man fears and trembles to come before God, and God being offended, cannot be at peace, unless his Justice be satisfied; Therefore when Adam had once sinned, he feared to come into the presence of God, and hid himself, till God revealed and made known to him the Mediator of the Covenant, that the Seed of the woman should break the Serpent’s head.</p></blockquote>

<blockquote><p>Vers. 14. Blotting out the hand-writing of Ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his Cross.

Argum. 9. In which also he explains how Christ obtained remission of sins for us, viz. by taking away the hand-writing, in this sense. The Covenant of works is an hand-writing, established partly in threatnings, partly in appointed positive Ceremonials (excluding the Gentiles from the Church) was against us, and contrary to us. But Christ hath blotted out this hand-writing, taking it out of the way, and nailing it to his Cross: Therefore you must not look back to the legal Covenant or ceremonial appointments in them, to seek for any thing, neither must ye depart in the least from the death of Christ (by which ye are delivered from that hand-writing.)

He compares this Covenant of works, with its appurtenances, to an hand-writing, by which any one binds himself for the paying of a debt; for whosoever are convicted of sin by the light of nature, are also by the force of the Covenant of Works, obnoxious to wrath, and as often as we are convinced of sin, so often also by nature we confirm the punishment of sin, or the condition of the legal Covenant, by the judgement of our consciences against our selves, as by an hand-writing: The conscience of every one performs this much more, which hath received the written Law, and daily bears the punishment of the Law, for the breaking of it.

But chiefly all justiciaries are compelled to subscribe to this hand-writing, who acknowledge no righteousness besides inherent, or that which is by works: Of which number were those that Judaized, and observers of Ceremonies, who adhered to this Covenant, seeking Righteousness by works, and the appointed Ceremonies: For by how much they did endeavour by this means more manifestly to establish their own Righteousness, by so much the more openly they did derive the punishment of the Law broken, by the force of the Covenant, upon themselves: For no man enters a Covenant, but he also admits all the conditions of the Covenant.

The hand-writing is said to be in Ordinances, or rather subscribed to Ordinances, so far as they took upon them those commands, or Legal Ordinances, that they might be perfected in themselves, they did withal oblige themselves to bear the punishment of the breach of those commands.

He calls it the hand-writing against us, or contrary to us, partly because it separated the Jews from the Gentiles, and the Gentiles from the Jews; Partly because it was a yoke, which neither they nor their Fathers could bear; Partly because as often as they did any work of the Law, either moral or ceremonial to be justified thereby, so often by the imperfection of their work, and the profession of their imperfection in the use of the Levitical Ceremonies, they did argue themselves guilty, or rather did acknowledge themselves guilty of death.

As for example, when they offered Sacrifices, and did repeat them, they not only acknowledged themselves sinners against the Moral Law, but did also really confess that their frequent Sacrifices could not purge their consciences from sin, and so the hand-writing of the Covenant of works was always contrary to them: But Christ hath blotted out this hand-writing, and took it out of the way, nailing it to his Cross, insomuch as he for the sake of them that were his, hath paid for the redeemed the penalty due upon the hand-writing by the death of his Cross, and hath completed and abolished the positive Ordinances concerning those vanishing Ceremonies, by the real Sacrifice of his own body once offered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 139-40.</span></figcaption>

He calls it the hand-writing against us, or contrary to us, partly because it separated the Jews from the Gentiles, and the Gentiles from the Jews; Partly because it was a yoke, which neither they nor their Fathers could bear; Partly because as often as they did any work of the Law, either moral or ceremonial to be justified thereby, so often by the imperfection of their work, and the profession of their imperfection in the use of the Levitical Ceremonies, they did argue themselves guilty, or rather did acknowledge themselves guilty of death.

— David Dickson, An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened, (London: Francis Eglesfield, 1659), pp 139-40.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVers.+14.+Blotting+out+the+hand-writing+of+Ordinances+that+was+against+us%2C+which+was+contrary+to+us%2C+and+took+it+out+of+the+way%2C+nailing+it+to+his+Cross.%0A%0AArgum.+9.+In+which+also+he+explains+how+Christ+obtained+remission+of+sins+for+us%2C+viz.+by+taking+away+the+hand-writing%2C+in+this+sense.+The+Covenant+of+works+is+an+hand-writing%2C+established+partly+in+threatnings%2C+partly+in+appointed+positive+Ceremonials+%28excluding+the+Gentiles+from+the+Church%29+was+against+us%2C+and+contrary+to+us.+But+Christ+hath+blotted+out+this+hand-writing%2C+taking+it+out+of+the+way%2C+and+nailing+it+to+his+Cross%3A+Therefore+you+must+not+look+back+to+the+legal+Covenant+or+ceremonial+appointments+in+them%2C+to+seek+for+any+thing%2C+neither+must+ye+depart+in+the+least+from+the+death+of+Christ+%28by+which+ye+are+delivered+from+that+hand-writing.%29%0A%0AHe+compares+this+Covenant+of+works%2C+with+its+appurtenances%2C+to+an+hand-writing%2C+by+which+any+one+binds+himself+for+the+paying+of+a+debt%3B+for+whosoever+are+convicted+of+sin+by+the+light+of+nature%2C+are+also+by+the+force+of+the+Covenant+of+Works%2C+obnoxious+to+wrath%2C+and+as+often+as+we+are+convinced+of+sin%2C+so+often+also+by+nature+we+confirm+the+punishment+of+sin%2C+or+the+condition+of+the+legal+Covenant%2C+by+the+judgement+of+our+consciences+against+our+selves%2C+as+by+an+hand-writing%3A+The+conscience+of+every+one+performs+this+much+more%2C+which+hath+received+the+written+Law%2C+and+daily+bears+the+punishment+of+the+Law%2C+for+the+breaking+of+it.%0A%0ABut+chiefly+all+justiciaries+are+compelled+to+subscribe+to+this+hand-writing%2C+who+acknowledge+no+righteousness+besides+inherent%2C+or+that+which+is+by+works%3A+Of+which+number+were+those+that+Judaized%2C+and+observers+of+Ceremonies%2C+who+adhered+to+this+Covenant%2C+seeking+Righteousness+by+works%2C+and+the+appointed+Ceremonies%3A+For+by+how+much+they+did+endeavour+by+this+means+more+manifestly+to+establish+their+own+Righteousness%2C+by+so+much+the+more+openly+they+did+derive+the+punishment+of+the+Law+broken%2C+by+the+force+of+the+Covenant%2C+upon+themselves%3A+For+no+man+enters+a+Covenant%2C+but+he+also+admits+all+the+conditions+of+the+Covenant.%0A%0AThe+hand-writing+is+said+to+be+in+Ordinances%2C+or+rather+subscribed+to+Ordinances%2C+so+far+as+they+took+upon+them+those+commands%2C+or+Legal+Ordinances%2C+that+they+might+be+perfected+in+themselves%2C+they+did+withal+oblige+themselves+to+bear+the+punishment+of+the+breach+of+those+commands.%0A%0AHe+calls+it+the+hand-writing+against+us%2C+or+contrary+to+us%2C+partly+because+it+separated+the+Jews+from+the+Gentiles%2C+and+the+Gentiles+from+the+Jews%3B+Partly+because+it+was+a+yoke%2C+which+neither+they+nor+their+Fathers+could+bear%3B+Partly+because+as+often+as+they+did+any+work+of+the+Law%2C+either+moral+or+ceremonial+to+be+justified+thereby%2C+so+often+by+the+imperfection+of+their+work%2C+and+the+profession+of+their+imperfection+in+the+use+of+the+Levitical+Ceremonies%2C+they+did+argue+themselves+guilty%2C+or+rather+did+acknowledge+themselves+guilty+of+death.%0A%0AAs+for+example%2C+when+they+offered+Sacrifices%2C+and+did+repeat+them%2C+they+not+only+acknowledged+themselves+sinners+against+the+Moral+Law%2C+but+did+also+really+confess+that+their+frequent+Sacrifices+could+not+purge+their+consciences+from+sin%2C+and+so+the+hand-writing+of+the+Covenant+of+works+was+always+contrary+to+them%3A+But+Christ+hath+blotted+out+this+hand-writing%2C+and+took+it+out+of+the+way%2C+nailing+it+to+his+Cross%2C+insomuch+as+he+for+the+sake+of+them+that+were+his%2C+hath+paid+for+the+redeemed+the+penalty+due+upon+the+hand-writing+by+the+death+of+his+Cross%2C+and+hath+completed+and+abolished+the+positive+Ordinances+concerning+those+vanishing+Ceremonies%2C+by+the+real+Sacrifice+of+his+own+body+once+offered.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+An+exposition+of+all+St.+Paul%E2%80%99s+epistles+together+with+an+explanation+of+those+other+epistles+of+the+apostles+St.+James%2C+Peter%2C+John+%26+Jude%3A+wherein+the+sense+of+every+chapter+and+verse+is+analytically+unfolded+and+the+text+enlightened%2C+%28London%3A+Francis+Eglesfield%2C+1659%29%2C+pp+139-40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7879149db4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7879149db4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/04/david-dickson-on-christ-blotting-out-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

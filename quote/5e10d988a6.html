<blockquote><p>I distinguish between the Church and her external polity: That which is essential to the Church’s being never ceases, but that which is essential to her outward polity may, because polity itself is not essential. The Church, for being, like Christ as God, never dies; but in her external order, like Christ as man, she dies and rises again.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-677425ee04" data-kw="">
<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, p. 24</span></figcaption>

e-visible-church/#:~:text=Externally%20this%20covenant%20is%20made%20with,and%20the%20people%20is%20made%20up&amp;text=Externally%20this%20covenant%20is%20made%20with%20every%20member&amp;text=of%20God%20and%20the%20people%20is%20made%20up" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a185c24136" data-kw="">
<blockquote><p>Thus on the basis of the ecumenical Creeds the Reformers outline a doctrine of the ecumenical Church, laying stress on the avoidance of schism where the Word and scriptural sacraments are honored. In all this they were profoundly indebted to the Church Fathes. They were also in a large sense the heirs of the Conciliarists, who demanded that ecclesiastical authority be representative. Conciliarism was a frustrated revolution; but its principle remained in many minds, both as a potential danger to papal claims and as a potential influence in doctrine and polity in an age of reform. The Conciliarist emphasis upon the Headship of Christ was renewed in the Reformation. It was, of course, a doctrine derived from Scripture and employed by the Fathers. (Tota ecclesia ejus, quae ubique diffusa est, cujus est ipse caput. Augustine, Enarratio in Psalmos, lii, Sermo 2. CF. lxv, Sermo 1) But the doctrine is rather assumed than strongly emphasized by the Fathers, while it is frequently stressed by the Conciliarists, and constantly affirmed in Reformation statements. It was a doctrinal basis of attack upon the headship claimed by the Pope. The word-wide Church of which Christ is Head could, said the Conciliarists, through its representatives in a council, restrain or depose a Pope. No human monarch of the Church, said the Reformers, was either necessary for government or authorized in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/medieval-precedent.html">Medieval Precedent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967)</cite>, pp. 32-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-73a9ff7cc5" data-kw="invisible church">
<blockquote><p>That the statement of this most vexed question may be rightly exhibited, the origin of the controversy must be inquired into. The Romanists suppose that the church was called invisible by us in order to satisfy the question asked of us by them—where our church was before Luther. Since we could not show that our church was perpetually visible in the world, we excogitated this distinction—that the visible church is one thing, the invisible another. But they interpret our opinion falsely. For even if our church had been as large and conspicuous formerly as it is now, still we would say that the catholic church is nonetheless invisible. Is the true church rightly said to be invisible? We affirm against the Romanists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.7.1</span></figcaption>

</figure><figure class="quote" id="q-d76c64c47c" data-kw="catholic invisible">
<blockquote><p>Even if our church had been as large and conspicuous formerly as it is now, still we would say that the catholic church is nonetheless invisible. This question truly belongs to another controversy, concerning the perpetual appearance and conspicuousness of the church as to external state. Is the true church rightly said to be invisible? We affirm against the Romanists.</p></blockquote>

<blockquote><p>Vers. 3. For I testify again to every man that is circumcised, that he is a debtor to do the whole Law.

Argum. 3. Is established by the same obtestation. The Covenant of Works being abrogated, and the Ceremonial Law now abolished, if any one returns to Circumcision, the Sacrament of initiation to this Legal Covenant, he by this means makes himself a debtor to the whole Law, and consequently obliges himself to the curse, unless he perfectly with his whole strength fulfil the Law, which is the condition of the Covenant of Works. The matter is clear.

Because, although Circumcision by the purpose of God to the faithful, expecting the Messias, until Christ, was a Sacrament of the Righteousness of Faith (as Abraham was circumcised) and although in the time of toleration till the clear manifestation of Christian Liberty to them that were born Jews, Circumcision was accounted amongst things indifferent (so Timothy born of a Jewish Mother is circumcised, and Titus is not) yet to all the Jews and Proselytes of the Gentiles seeking Righteousness by Works, or by the Law, Circumcision is made part of the Legal Righteousness, or of the Obedience of the Covenant of Works, yea, and the Sacrament of that Covenant.

And after this manner the false Apostles did urge Circumcision amongst the Galatians, to whom religious Circumcision was every way unlawful. No wonder then if he said Christ will not profit them, if they bee circumcised, because they that were circumcised, by that very fact did embrace the Covenant of Works.

Vers. 4. Christ is become of no effect unto you, whosoever of you are justified by the Law: yee are fallen from Grace.

Argum. 4. Confirming the former, whosoever of you return to Circumcision, and Legal Customs abolished, seeking Justification by the Law, yet by that same fact renounce Christ, and the Covenant of Grace, because the Covenant of Works, and the Covenant of Grace in Christ, do mutually exclude one another, neither can they consist. For if Justification is by Works, it is not by Grace, and on the contrary: Therefore ye must stand in your liberty, except you would be separated from Grace and Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 103.</span></figcaption>

<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promiseth to men some good, &amp; requireth of them again, that they perform those things which he commandeth. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promiseth men eternal life. And that is two fold, the covenant of works, or the covenant of grace.

The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, &amp; also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2.17.

The repetition of the covenant of works is made by God, Exod. 19.5. Deut. 5.2. 1. King. 8.21. Heb. 8.9. and that chiefly for four causes.</p></blockquote>

<blockquote><p>1. The distance between God and the creature is so great, that although reasonable creatures do owe obedience unto him as their Creator, yet they could never have any fruition of him as their blessedness and reward, but by some voluntary condescension on God’s part, which he hath been pleased to express by way of covenant.

2. The first covenant made with man was a covenant of works, wherein life was promised to Adam; and in him to his posterity, upon condition of perfect and personal obedience.

<blockquote><p>Although the law in its covenant form requires of all who are under it since the fall perfect obedience as the condition of life and full satisfaction for sin their own persons, and at the same time, upon the revelation and offer of Christ in the gospel as Jehovah Our Righteousness, commands them to believe in Him as such; yet as is the case in various other instances of duty, it requires the one of these only on supposition that the other is not performed. The law as a covenant of works requires that all who are under it do present to it as the conditions of eternal life perfect obedience and complete satisfaction for sin, either in their own persons or in that of a responsible surety. So long, then, as a sinner, unwilling to be convinced of his sin and his want of righteousness, cleaves to the law as a covenant and refuses to accept and present in the hand of faith the spotless righteousness of the adorable Surety, that sinner continues “a debtor to do the whole law” (Gal. 5:3). He keeps himself under an obligation to do, in his own person, all that the law in that form requires and also to suffer all that it threatens. The righteous law, accordingly, goes on to use him as he deserves. It continues to proceed against him without the smallest abatement of its high demands, requiring of him the complete payment of his debt both of perfect obedience and of infinite satisfaction for his disobedience. As it accepts no obedience but that which is absolutely perfect or fully answerable to all its demands (Gal. 3:10–11), so the acceptance of a man’s person as righteous according to it will depend on the acceptance of [Christ’s] obedience (Matt. 5:18; Rom. 10:5).</p></blockquote>

<blockquote><p>1. This contract between God and the first Adam, is in sacred writ, expressly styled a covenant. “These are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” Here are two covenants mentioned, the one of which, genders to bondage, and the other, to liberty or freedom. The covenant of grace, or “The law of the Spirit of life in Christ Jesus,” is the one which genders to liberty, or which makes free from the law of sin and death. The one, therefore, which genders to bondage, must be that law or covenant of works, which was republished to the Israelites, from mount Sinai; which required perfect obedience to the ten commandments, on pain of death, and contained a promise of life, to the man who should do, or perform such obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Covenant of Works</cite>, 5</span></figcaption>

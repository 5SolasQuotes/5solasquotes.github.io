<blockquote><p>Secondly I answer that we do acknowledge with glad minds that Christ died for all (the scripture averring so much): but we utterly deny that He died for all and everyone alike in respect of God, or, as well for the damned as elect, and that effectually on God’s part. For first lets weigh well the words of Christ: ‘I never knew you: depart from Me ye workers of iniquity.’ (Mt. 7:25) Now to know with God is to acknowledge; and therefore, whom Christ never knew, He never acknowledged for his. And those whom He has not sometime acknowledged, He never bought or redeemed with the price of his blood. And therefore well says Gregory: ‘Not to know with God is to reject.’ Again, if all and every one be effectually redeemed, all and every one are reconciled unto God, because that the forgiveness of sins and the satisfaction for the same are inseparably joined together. Yea and Paul places redemption in the remission of sins where he says: ‘By whom we have redemption through his blood, even the forgiveness of sins.’ (Eph. 1:7 &amp; Col. 1:14) Very well therefore says Prosper (bk. 1, Response for Augustine, Objection 9): ‘As it is not sufficient for the renewing of men, that Christ Jesus was born man, unless they be renewed also in the same spirit, whereof He was born: so it is not sufficient for man’s redemption that Christ Jesus was crucified, unless we die together and be buried with Him in baptism.’ Of these premises therefore I frame this assumption: But all are not reconciled unto God, neither do all receive remission of sins: for then all men were blessed (Ps. 32:1); and it were not possible for them to perish: which thing to affirm of all and every one, is very gross. Thirdly, Christ gave Himself that He might sanctify unto Himself a people peculiar (Tit. 2:14), that is, as a precious treasure and his own gotten good selected and chosen from among other: therefore it was not Christ’s purpose to give Himself for a ransom for all and every one alike. Fourthly, for whom redemption it [was] ordained, to them all is given on God’s part the making of them sons by Christ: but the making of sons, or adoption is not granted to all and every one, even on God’s part… Fifthly: None are truly redeemed on God’s part, but they who are freed from sin, both according to the power that it has to cause damnation, and also according to the power that it has to reign in them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace (d. 1602: London: Welby &amp; Clarke, 1606) | 4th Crimination</cite>, pp. 82-83</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-90d8795383" data-kw="">
<blockquote><p>John Cameron [the teacher of Amyraut] set the tendency in motion which in different lands has tried to mediate between the consistent scheme of the Reformed Faith and the Arminianism which was set aside by the findings of the Synod of Dordt… The issues of his mongrel compromising teaching were far reaching. The church of his adoption felt the effects of his teaching to such an extent as that the Theology of the later Huguenots was to a large extent revolutionised. Their influence in turn told on Richard Baxter and on all the varieties of teaching that can be traced back to his type of doctrine. It affected the thinking of New England; and as a return tide on its way back over the Atlantic it determined the teaching of the English Edwardians, both Independent and Baptist. The force of the current that was thus changing the older Calvinism beat at last on the Reformed teaching of Scotland in circles other than those of the Neonomians. It found more channels than one in which to flow. New England Revivalism did its share of the work; and the influence of modern Calvinism in English Nonconformity also contributed its quota. Along with the disintegrating work of the New Light movement, which was of home [i.e., Scottish] growth and which spoke of an uneasy spirit of dissatisfaction with long accepted truth and of a restlessness that was in quest of something new, the various streams of influence that derived remotely from Cameron are responsible for the collapse of the Confessional orthodoxy which had for ages found a home in his native country.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macleod.html">John Macleod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scottish Theology</cite>, pp. 61-62</span></figcaption>

<blockquote><p>For the finding out of this middle course… the former [satisfaction of Christ] was once done for all, the other [application thereof] is still in doing: the former brings with it sufficiency, abundant to discharge the whole debt; the other adds to it efficacy. The satisfaction of Christ only makes the sins of mankind fit for pardon, which without it could not well be; the injury done to God’s majesty being so great, that it could not stand with his honour to put it up without amends made. The particular application makes the sins of those to whom that mercy is vouchsafed to be actually pardoned… Hence, we infer against the first extremity, that by the virtue of this blessed oblation, God is made placable unto our nature (which He never will be unto the angelical nature offending) but not actually appeased with any, until He has received his Son, and put on the Lord Jesus. As also against the latter extremity, that all men may be truly said to have interest in the merits of Christ, as in a common, though all do not enjoy the benefit thereof, because they have no will to take it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60</cite>, pp. 554-55</span></figcaption>

<blockquote><p>…the natural sense of the clause is clearly that no one of the transactions here brought together is to be affirmed of the non-elect. And this impression is increased by the broader context, not to speak of the parallel passages in 8.3 and 5. It might seem somewhat more to the point, possibly, to recall that in this section the language is so ordered as to seem to deal with the actual ordo salutis rather than directly with the ordo decretorum. It is asserted that the ordo salutis is the result of the decreeing of the means by which the elect are brought to glory. But what is subsequently asserted is that none but the elect are (actually) redeemed by Christ, effectually called, etc…</p></blockquote>

— Benjamin B. Warfield, ‘The Westminster Assembly and Its Work’ in The Works of Benjamin B. Warfield, 6:142 &amp; 143), examining the historical debate surrounding WCF 3.6, “Neither are any other redeemed by Christ, effectually called, justified, adopted, sanctified, and saved, but the elect only:”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+natural+sense+of+the+clause+is+clearly+that+no+one+of+the+transactions+here+brought+together+is+to+be+affirmed+of+the+non-elect.+And+this+impression+is+increased+by+the+broader+context%2C+not+to+speak+of+the+parallel+passages+in+8.3+and+5.+It+might+seem+somewhat+more+to+the+point%2C+possibly%2C+to+recall+that+in+this+section+the+language+is+so+ordered+as+to+seem+to+deal+with+the+actual+ordo+salutis+rather+than+directly+with+the+ordo+decretorum.+It+is+asserted+that+the+ordo+salutis+is+the+result+of+the+decreeing+of+the+means+by+which+the+elect+are+brought+to+glory.+But+what+is+subsequently+asserted+is+that+none+but+the+elect+are+%28actually%29+redeemed+by+Christ%2C+effectually+called%2C+etc%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+%E2%80%98The+Westminster+Assembly+and+Its+Work%E2%80%99+in+The+Works+of+Benjamin+B.+Warfield%2C+6%3A142+%26+143%29%2C+examining+the+historical+debate+surrounding+WCF+3.6%2C+%E2%80%9CNeither+are+any+other+redeemed+by+Christ%2C+effectually+called%2C+justified%2C+adopted%2C+sanctified%2C+and+saved%2C+but+the+elect+only%3A%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F656c77625b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/656c77625b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=the%20natural%20sense%20of%20the%20clause,redeemed%20by%20Christ%2C%20effectually%20called%2C%20etc&amp;text=the%20natural%20sense%20of%20the%20clause%20is%20clearly&amp;text=are%20%28actually%29%20redeemed%20by%20Christ%2C%20effectually%20called%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

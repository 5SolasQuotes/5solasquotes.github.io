<main class="wrap"><figure class="quote" id="q-19034cd159" data-kw="">
<blockquote><p>Christ spake by saint Paul and the rest of the apostles in their time (2 Cor. 13:3), and He speaks by us, which are His ambassadors at this day: therefore harden not your hearts against his preaching, lest He shut you out of his rest, but reverently embrace his preaching; let Christ enter into your hearts by his Word and Spirit, that ye may have rest and peace of conscience in this life; and be received up into his everlasting rest where ye shall never be molested any more, in the life to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jones.html">William Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Philemon and Hebrews</cite>, (London, R.B., 1635), on Heb. 3:11, p. 133</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“Christ spake by saint Paul and the rest of the apostles in their time (2 Cor. 13:3), and He speaks by us, which are His ambassadors at this day: therefore harden not your hearts against his preaching, lest He shut you out of his rest, but reverently embrace his preaching; let Christ enter into your hearts by his Word and Spirit, that ye may have rest and peace of conscience in this life; and be received up into his everlasting rest where ye shall never be molested any more, in the life to come.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e976162133" data-kw="">
<blockquote><p>If the door of thine heart be opened by this key, to give admission to the King of Glory, God’s hand must turn the key. The Lord opened the heart of Lydia, that she attended to the words of Paul, Acts 16. Paul might have preached his heart out before Lydia’s heart would have opened to let the Word in, if God had not undertaken the work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, … (London: T.P., 1662), ch. 15, ‘How a Christian may exercise himself to godliness in hearing and reading the Word, and of preparation for hearing’, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“If the door of thine heart be opened by this key, to give admission to the King of Glory, God’s hand must turn the key. The Lord opened the heart of Lydia, that she attended to the words of Paul, Acts 16. Paul might have preached his heart out before Lydia’s heart would have opened to let the Word in, if God had not undertaken the work.”

</figure><figure class="quote" id="q-fccad8979c" data-kw="word and Spirit means">

</figure><figure class="quote" id="q-9268fb1e60" data-kw="">
<blockquote><p>The mighty God who fills all space and reigns in majesty over all worlds, standing at the door of the sinner’s heart, humbling Himself to the language of entreaty, beseeching the sinner to come and be reconciled to Him, begging for admittance, and protesting that if you only come unto Him through Christ, He is willing to forgive all, and to forget all. Oh! my brethren, ought not this to encourage you? Yes! and if you refuse the encouragement, it ought also to fill you with terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Embassy of Reconciliation” in Sermons &amp; Discourses by Thomas Chalmers</cite>, (NY: Robert Carter &amp; Brothers, 1877), p. 549</span></figcaption>

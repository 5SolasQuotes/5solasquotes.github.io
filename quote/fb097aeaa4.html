<blockquote><p>Nor is it the restraining of him [a spiritual seducer] from personal liberty because of it [his false opinion]; but, because he doth not, nor will not use his personal liberty without prejudice to the whole body, which is to be preferred to him: even as a man, infected with the pestilence, ought justly to be restrained, though against his will; yet cannot that be accounted a restraint of just liberty; for, it is no just liberty to have liberty to hurt others.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76a8711059" data-kw="">
<blockquote><p>So when God layeth sin to the charge of the sinner, in punishing it, He is said to lay a burden on the sinner, 2 Kings 9:25. And to remove this burden, is to pardon the sin. 2 Chron. 7:14, “If my people humble themselves, then will I hear from heaven, and will forgive their sin, and will heal their land;” by removing the locusts and the pestilence. See, the pardoning of their sin is exponed [expounded] to be the removing of the locusts and pestilence [2 Chron. 7:13].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, ... (London, 1647), p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-612767d253" data-kw="">
<blockquote><p>It is their [the magistrates’] duty therefore to remove all such things for which, as is before showed, the Lord sends the pestilence and other grievous diseases; they must follow the example of David in this place who humbled himself before the Lord, who prayed for himself and for the people, and built an altar and offered up sacrifice; that is, they must maintain God’s truth to the uttermost of their power; they must set forward the preaching of the Word; they must with good Hezekiah and Josiah remove all idolatry and superstition (2 Kings 18:4; 23:4); they must also with David labor to find out the cause of God’s punishment, and remove it as he did when famine was in his land (2 Sam. 21:1,9): for it is greatly to be feared that there be many which never consider what are, or may be, the causes of any calamity, nor seek any means how to pacify God. The magistrates also at such times must make good laws and see them faithfully executed. They must remove all disorders whereby God has been offended, they must punish and suppress the wicked which are indeed the very botches and sores, and contagion of the commonwealth. They must as David speaks of himself ‘destroy betimes all the workers of iniquity, and cut off the wicked from the city of the Lord’ (Ps. 101:8). They must also have a diligent care to remove such things which impoverish the country, as wicked gaming, luxuriousness in meat, drink and apparel, and such like. Such [consuming] caterpillars must be looked unto before all be consumed, for then it will be too late to spare when such devourers have swallowed up all after such manner, and then must men be put to many very wicked shifts to maintain their [immoral] bravery and to feed their greedy paunch, whereof we have lamentable experience at this day. For what is the cause of such robbing and spoiling both by land and sea, and of such horrible oppression and extortion everywhere but only this, that men having been long acquainted with bravery and dainty morsels, can hardly forego it, they had rather put a thousand wicked shifts in practice, yea they had rather hazard their lives everyday than that they would abate anything of their stately port, which under a show of wealth and great substance (although but being beggars indeed) they have long maintained, and from hence has sprung all kind[s] of cousonage and devilish deceit, whereby men overreach one another daily in their bargains and contracts. In times past they had good laws, even among the heathen people, to bridle all idle expenses and such as lavished their goods willfully. It were to be wished that such laws were now in use to take away the wonderful prodigality of this time. Usurers also, brokers, badgers and hucksters, and such like locusts that eat up the poor and cause the markets to be inhaunted [infrequented] should be bridled to the end [that] the poor may have things better cheap, and to the end [that] magistrates may perform these things and all other duties that belong unto them in time of war, pestilence and famine. … …The common treasure of cities also must sometimes serve for the relieving of the poor, which thing has been done in many famous cities, etc., it were far better that it should be so employed, than as it is many times upon feasting and vain shows… These things, therefore, if magistrates carefully perform, they shall offer an acceptable sacrifice to God, as David did at this time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cupper.html">William Cupper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 341-47 of Sermon 10 in Certain Sermons Concerning God’s Late Visitation in the City of London and other parts of the land, teaching all men to make use thereof, that mean to profit by God’s fatherly chastisements… (London, 1592)</span></figcaption>

</figure><figure class="quote" id="q-d9109a0038" data-kw="">
<blockquote><p>There has to be a system of government regulation, up to and including quarantine, in order to stop the spread of dangerous pathogens. These should be regarded as invaders. If a society has the right to create a military defense system against invading armies, then it has the right to do the same with respect to invading armies of pathogens. Only the civil government can do this. This cannot be done on a profit-seeking basis. This is not a matter for the free market to solve. The free market can solve certain issues, such as the development of anti-pathogen chemicals or techniques. There can be profit in this. But the taxpayer is going to have to provide the money that civil governments use to develop systematic pathogen defense strategies, and then implement these strategies. In terms of the total cost of government, these are minor expenditures. Societies have used them throughout history. Most people accept them. There is no well-organized opposition to their use. Compared to the massive expenditures of the modern state on projects that are clearly banned by the Bible, these exceptions do not constitute a threat to the freedom of covenant-keeping people. Furthermore, those free market economists who would deny any of these expenditures have not developed comprehensive monographs on how the free market could attain these goals. They are legitimate goals. Free-market economists need to come to grips with this fact: they cannot beat something with nothing.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“There has to be a system of government regulation, up to and including quarantine, in order to stop the spread of dangerous pathogens. These should be regarded as invaders. If a society has the right to create a military defense system against invading armies, then it has the right to do the same with respect to invading armies of pathogens. Only the civil government can do this. This cannot be done on a profit-seeking basis. This is not a matter for the free market to solve. The free market can solve certain issues, such as the development of anti-pathogen chemicals or techniques. There can be profit in this. But the taxpayer is going to have to provide the money that civil governments use to develop systematic pathogen defense strategies, and then implement these strategies. In terms of the total cost of government, these are minor expenditures. Societies have used them throughout history. Most people accept them. There is no well-organized opposition to their use. Compared to the massive expenditures of the modern state on projects that are clearly banned by the Bible, these exceptions do not constitute a threat to the freedom of covenant-keeping people. Furthermore, those free market economists who would deny any of these expenditures have not developed comprehensive monographs on how the free market could attain these goals. They are legitimate goals. Free-market economists need to come to grips with this fact: they cannot beat something with nothing.”

<blockquote><p>7th Doctrine: That Jesus Christ will not refuse to come in to the soul of the vilest sinner, when once it is made heartily willing to open to Him. ‘If any man open, I will come in to him.’ [Rev. 3:20] It is not unworthiness, but unwillingness that bars any man from Christ: thousands have missed of Christ by their unwillingness, but Christ never put off one soul upon account of its unworthiness; Christ is not the sale, but the gift of God; you come not to make a bargain, but to receive a free gift: Faith is a marriage with Christ, wherein nothing but your hearty consent is expected; so runs the strain of the whole Scriptures, Isa. 55:1, ‘Ho, every one that thirsteth, come ye to the waters…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Duty under the Present Gospel Liberty from Rev. 3, verse 20: wherein is opened the admirable condescension and patience of Christ in waiting upon trifling and obstinate sinners… (London: Wotton, 1689), sermon 7, doctrine 7</cite>, p. 231</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>6. The effects of this first [divine] work are these: (1) A hearty welcoming of Christ Jesus into the soul; they do not take up with comfort on this side [of] Christ; Men’s troubles are known by their satisfaction… But if we see the necessity of a Savior, receive Him into our hearts and believe in Him with all our hearts, desire and delight and all is carried after Christ, and after the refreshings of his grace and are satisfied with none but Christ, and our hearts pant for Him, as the hart pants after the water brooks, you ought to bless God that He has left the impression of the effect, though He has not left the impression of the way; Ps. 42:1.</p></blockquote>

</figure><figure class="quote" id="q-cfac26bf9a" data-kw="">
<blockquote><p>I told you but now that they of the King’s army had this winter sent three times to Mansoul to submit herself. The first time the trumpeter went, he went with words of peace, telling them that the captains, the noble captains of Shaddai, did pity and bewail the misery of the now perishing town of Mansoul, and were troubled to see them so much to stand in the way of their own deliverance. He said, moreover, that the captains bid him tell them, that if now poor Mansoul would humble herself and turn, her former rebellions and most notorious treasons should by their merciful King be forgiven them, yea, and forgotten too. And having bid them beware that they stood not in their own way, that they opposed not themselves, nor made themselves their own losers, he returned again into the camp. The second time the trumpeter went, he did treat them a little more roughly; for, after sound of trumpet, he told them that their continuing in their rebellion did but chafe and heat the spirit of the captains, and that they were resolved to make a conquest of Mansoul, or to lay their bones before the town walls. He went again the third time, and dealt with them yet more roughly; telling them that now, since they had been so horribly profane, he did not know, not certainly know, whether the captains were inclining to mercy or judgment. ‘Only,’ said he, ‘they commanded me to give you a summons to open the gates unto them.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Holy War: the Battle For Mansoul (1682; Monergism) 245 pp.</cite>, pp. 58-59</span></figcaption>

</figure><figure class="quote" id="q-a871f27cea" data-kw="">
<blockquote><p>‘I stand.’ Christ expresses his mind by borrowed speeches: for in this verse [Rev. 3:20] He compares every man to a house or householder, and our hearts to doors by which an entrance is made: and Himself to a guest or stranger which comes to the house, and desires to be let in and entertained: yet not so much to look for kindness to be shown [to] Him, as to show favor to us. By this similitude Christ purposes to show this Church, what his mind is toward it: and He expresses it by two signs here set down: first, a desire of their conversion, which He heartily seeks and looks for, ‘I stand and knock.’ Secondly, his promise after their conversion, ‘If any, etc.’ He will have fellowship, even mutual fellowship with them. Now of the words in order as they lie. The scope and substance of them being thus first thus generally propounded, I here note two things. First, that this Church (if we regard the greater part of it) had no true fellowship with Christ as yet, nor Christ with them: because He was not yet received into their houses, but stood at their doors which were shut. This may seem strange: but the cause is evident; the truth is, there were many good things in them: for they knew the Gospel and liked it, and professed it, and were partakers of the seals of the covenant: and yet they were tainted with one great sin of lukewarmness, which closed up the door of their hearts, so that though they had many good things, yet this one sin kept out Christ. By which we see, that one sin, in a man endued with many good graces, keeps out Christ, and bars Him from all fellowship and society with Him… … Seeing then Christ standing at the door of men’s hearts knocks so earnestly to save men’s souls, we again ought to be earnest to receive and embrace the Gospel. He knocks in good earnest, and we must accordingly by God’s grace be as earnest. So much for the first token of Christs love, his desire of their conversion, which He shows by two signs; first his waiting, secondly his knocking, and that joined with crying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures Upon the Three First Chapters of the Revelation… (1595; London: Field, 1604)</cite>, pp. 331–34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

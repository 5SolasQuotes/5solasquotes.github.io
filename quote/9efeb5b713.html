</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ec5135b3b" data-kw="">
<blockquote><p>But if it be inquired what it is whereby we immediately concur in a way of duty unto the continuation of our justified estate, that is, the pardon of our sins and acceptance with God, we say it is such [faith] alone. ‘For the just shall live by faith,’ Rom. 1.17. And as the apostle applies this divine testimony to prove our first or absolute justification to be by faith alone, so does he also apply it unto the continuation of our justification, as that which is by the same means only, Heb. 10:38-39, ‘Now the just shall live by faith: but if any man draw back, my soul shall have no pleasure in him. But we are not of them that draw back unto perdition: but of them that believe, unto the saving of the soul.’ The drawing back to perdition includes the loss of a justified estate really so or in profession. In opposition thereunto the apostle places believing unto the saving of the soul; that is, unto the continuation of justification unto the end. And herein it is, that the just live by faith, and the loss of this life can only be by unbelief. ‘So the life which we now live in the flesh, is by the faith of the Son of God, who loved us and gave Himself for us,’ Gal. 2:20. The life which we now lead in the flesh is the continuation of our justification, a life of righteousness and acceptation with God, in opposition unto a life by the works of the Law, as the next words declare, v. 21, ‘I do not frustrate the Grace of God; for if righteousness came by the Law, then is Christ dead in vain; and this life is by faith in Christ as He loved us, and gave Himself for us, that is, as he was a propitiation for our sins.’ This then is the only way, means and cause on our part of the preservation of this life, of the continuance of our justification; and herein are we kept by the power of God through faith unto salvation [1 Pet. 1:5]. … …the apostle gives us another account hereof; Rom. 5:1-3. For he distinguishes three things: our access into the grace of God, (2) our standing in that grace, (3) our glorying in that station against all opposition. By the first he expresses our absolute justification. By the second our continuation in the state whereinto we are admitted thereby; and by the third, the assurance of that continuation, notwithstanding all the oppositions we meet withal. And all these he ascribes equally unto faith, without the intermixture of any other cause or condition. And other places express to the same purpose might be pleaded. 3. The examples of them that did believe and were justified which are recorded in the Scripture, do all bear witness unto the same truth. The continuation of the justification of Abraham before God is declared to have been by faith only, Rom. 4:3. For the instance of his justification given by the apostle from Gen. 15:6 was long after he was justified absolutely. And if our first justification and the continuation of it, did not depend absolutely on the same cause, the instance of the one could not be produced for a proof, of the way and means of the other, as here they are. And David when a justified believer, not only places the blessedness of man in the free remission of sins, in opposition unto his own works in general, Rom. 4:6-7, but in his own particular case, ascribes the continuation of his justification and acceptation before God, unto grace, mercy, and forgiveness alone, which are no otherwise received but by faith, Ps. 130:3-5; 143:2. All other works and duties of obedience do accompany faith in the continuation of our justified estate as necessary effects and fruits of it, but not as causes, means, or conditions whereon that effect is suspended. It is patient waiting by faith, that brings in the full accomplishment of the promises, Heb. 6:12, 16… And the continuation of our justification depends solely on the same causes with our justification itself.</p></blockquote>

<blockquote><p>§VI. Thirdly, when we say it [justification] is an action of God imputing to a believing sinner, etc. we consider it not as a sudden and momentary action which is of no continuance, as if all our sins both past, present and to come are remitted in an instant, but as an act of God continued from our vocation [calling], wherein the grace of faith is begotten in us, to our glorification, which is the end of our faith. For as this action of God is called the justification of a sinner, so while we continue sinners, we have still need to be justified. And as we always have sin in this life, so that it may not be imputed, we have need, that Christ’s righteousness should be imputed unto us; and that as we sin daily, so Christ our advocate should continually make intercession for us: that notwithstanding our manifold slips, whereinto through human frailty we fall, and notwithstanding those manifold infirmities and corruptions which remain in us as the relics of original sin, we may be continued in the grace and favor of God by the continued imputation of Christ’s righteousness obtained by his continual intercession for us. For therefore does he continue his intercession for us that our justification may be continued to us, and that as we sin daily, so we may daily seek and obtain pardon. But if justification should so be wrought once and at once, as that after that act wrought in an instance, we should no more be justified, nor no more need remission of sin, then must we erroneously conceive that the sins which after the first moment of our justification we do commit, are actually remitted before they be committed; whereas God forgives only sins past, Rom. 3:25. So shall we not only set open a gap to all licentiousness (for who will so fear to commit sin as he ought, or when he has committed it so sue for the pardon thereof who is persuaded beforehand that it is already remitted), but also shall open the mouths of our adversaries, who will be ready to say, that we Protestants ought not to pray for remission of sin, because in our opinion (as they say) we need it not: but to this calumniation of the Papist I have elsewhere answered. §. VII. If it be said that it is a received opinion among many that justificatio simul et semel sit, that ‘justification is wrought at once, and but once,’ I answer that that assertion is not to be admitted without distinction, nor without good caution. The distinction is this, that there is a justification of a sinner before God in foro coelesti, which properly is called justification, and is that which here I have defined: and there is a justification whereby a man already justified before God is justified in foro conscientiae, in the court of his own conscience: which is not properly justification itself, but the assurance of it. To this latter that assertion of but once and at once cannot in any good sense be applied. For neither is the full assurance of our justification attained at once, but by degrees, wherein we are to labor and to give diligence to make, as our election and calling, so also our justification more and more sure unto us. Neither is it given but once. For by committing of any crime or any grievous sin, by spiritual desertions, by the forcible temptations of Satan, this act of spiritual faith, which we call assurance, may be interrupted or lost for a time; and yet by repentance, by prayer and practice of piety it may be recovered again, and therefore not given but once. To the former indeed it may be applied in both parts, but with a twofold caution: first, in respect of simul, at once, if it be understood as excluding degrees, and not continuance. Namely, that we are not justified by degrees, and as it were by little and little, as though our justification were not perfect at the first. For no sooner does a man truly believe in Christ, but the righteousness of Christ is imputed to him, and in and by that righteousness he stands righteous before God, as well at the first, as at the last; that righteousness of Christ by which he is justified, whether first or last, being most perfect. Therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men: howsoever the assurance of justification, and the work of sanctification, whereby we are to be renewed in the inner man day by day have degrees, according to the degrees of our faith, and according to the measure of grace received. Secondly, when it is said that we are justified before God semel, but once, that also may be admitted, if by once be meant one continual act. For as we are regenerated but once, because ut semel nascimur, ita semel renascimur, [‘as we have been born once, so we have been reborn once,’] so faith, which is wrought in our regeneration is given but once. For that which saint Jude says, verse 3, of faith once given, is no less true of the habit [abiding principle] than of the doctrine of faith; which habit, being once had, is never utterly lost. For all they who have true faith, are born of God, 1 Jn. 5:1; Jn. 1:12-13. And those who are once born of God are never unborn again; but being made sons by faith, as all the faithful are, Gal. 3:26, they are also made heirs of God and coheirs with Christ, Rom. 8:17. As faith therefore is never utterly lost, no more is justification. For so long as we have faith, so long we are justified. But the habit of faith we never lose, though perhaps some act of faith may sometimes be interrupted. Therefore our justification is but one continued act, and in that sense we are justified but once. §VIII. Now whereas we have defined and defended according to the Scriptures that justification is an action of God, and such an action as is without us and a continued act: hence we may conclude against the Papists: First, that neither their first, nor second justification is that justification which is taught in the Scriptures… Not, that we deny, that inherent righteousness is by practice of good works increased; but that we hold that justification is not our own act, neither that we are justified by any righteousness inherent in ourselves, or performed by ourselves, nor that the righteousness of justification (which is indeed the righteousness of Christ) can be increased, and therefore no degrees of justification. … Thirdly, they do not hold justification to be one continued act from our vocation to our glorification, but such an act as may not only be interrupted oftentimes and lost for a time, as they say it is, by every mortal sin and again be renewed so oft as they go to shrift; but also that it may totally and finally be lost. Which error I have confuted at large in my treatise of Perseverance.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§VI. Thirdly, when we say it [justification] is an action of God imputing to a believing sinner, etc. we consider it not as a sudden and momentary action which is of no continuance, as if all our sins both past, present and to come are remitted in an instant, but as an act of God continued from our vocation [calling], wherein the grace of faith is begotten in us, to our glorification, which is the end of our faith. For as this action of God is called the justification of a sinner, so while we continue sinners, we have still need to be justified. And as we always have sin in this life, so that it may not be imputed, we have need, that Christ’s righteousness should be imputed unto us; and that as we sin daily, so Christ our advocate should continually make intercession for us: that notwithstanding our manifold slips, whereinto through human frailty we fall, and notwithstanding those manifold infirmities and corruptions which remain in us as the relics of original sin, we may be continued in the grace and favor of God by the continued imputation of Christ’s righteousness obtained by his continual intercession for us. For therefore does he continue his intercession for us that our justification may be continued to us, and that as we sin daily, so we may daily seek and obtain pardon. But if justification should so be wrought once and at once, as that after that act wrought in an instance, we should no more be justified, nor no more need remission of sin, then must we erroneously conceive that the sins which after the first moment of our justification we do commit, are actually remitted before they be committed; whereas God forgives only sins past, Rom. 3:25. So shall we not only set open a gap to all licentiousness (for who will so fear to commit sin as he ought, or when he has committed it so sue for the pardon thereof who is persuaded beforehand that it is already remitted), but also shall open the mouths of our adversaries, who will be ready to say, that we Protestants ought not to pray for remission of sin, because in our opinion (as they say) we need it not: but to this calumniation of the Papist I have elsewhere answered. §. VII. If it be said that it is a received opinion among many that justificatio simul et semel sit, that ‘justification is wrought at once, and but once,’ I answer that that assertion is not to be admitted without distinction, nor without good caution. The distinction is this, that there is a justification of a sinner before God in foro coelesti, which properly is called justification, and is that which here I have defined: and there is a justification whereby a man already justified before God is justified in foro conscientiae, in the court of his own conscience: which is not properly justification itself, but the assurance of it. To this latter that assertion of but once and at once cannot in any good sense be applied. For neither is the full assurance of our justification attained at once, but by degrees, wherein we are to labor and to give diligence to make, as our election and calling, so also our justification more and more sure unto us. Neither is it given but once. For by committing of any crime or any grievous sin, by spiritual desertions, by the forcible temptations of Satan, this act of spiritual faith, which we call assurance, may be interrupted or lost for a time; and yet by repentance, by prayer and practice of piety it may be recovered again, and therefore not given but once. To the former indeed it may be applied in both parts, but with a twofold caution: first, in respect of simul, at once, if it be understood as excluding degrees, and not continuance. Namely, that we are not justified by degrees, and as it were by little and little, as though our justification were not perfect at the first. For no sooner does a man truly believe in Christ, but the righteousness of Christ is imputed to him, and in and by that righteousness he stands righteous before God, as well at the first, as at the last; that righteousness of Christ by which he is justified, whether first or last, being most perfect. Therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men: howsoever the assurance of justification, and the work of sanctification, whereby we are to be renewed in the inner man day by day have degrees, according to the degrees of our faith, and according to the measure of grace received. Secondly, when it is said that we are justified before God semel, but once, that also may be admitted, if by once be meant one continual act. For as we are regenerated but once, because ut semel nascimur, ita semel renascimur, [‘as we have been born once, so we have been reborn once,’] so faith, which is wrought in our regeneration is given but once. For that which saint Jude says, verse 3, of faith once given, is no less true of the habit [abiding principle] than of the doctrine of faith; which habit, being once had, is never utterly lost. For all they who have true faith, are born of God, 1 Jn. 5:1; Jn. 1:12-13. And those who are once born of God are never unborn again; but being made sons by faith, as all the faithful are, Gal. 3:26, they are also made heirs of God and coheirs with Christ, Rom. 8:17. As faith therefore is never utterly lost, no more is justification. For so long as we have faith, so long we are justified. But the habit of faith we never lose, though perhaps some act of faith may sometimes be interrupted. Therefore our justification is but one continued act, and in that sense we are justified but once. §VIII. Now whereas we have defined and defended according to the Scriptures that justification is an action of God, and such an action as is without us and a continued act: hence we may conclude against the Papists: First, that neither their first, nor second justification is that justification which is taught in the Scriptures… Not, that we deny, that inherent righteousness is by practice of good works increased; but that we hold that justification is not our own act, neither that we are justified by any righteousness inherent in ourselves, or performed by ourselves, nor that the righteousness of justification (which is indeed the righteousness of Christ) can be increased, and therefore no degrees of justification. … Thirdly, they do not hold justification to be one continued act from our vocation to our glorification, but such an act as may not only be interrupted oftentimes and lost for a time, as they say it is, by every mortal sin and again be renewed so oft as they go to shrift; but also that it may totally and finally be lost. Which error I have confuted at large in my treatise of Perseverance.”

— George Downame, A Treatise of Justification (London: 1633), ch. 1, pp. 5-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7VI.+Thirdly%2C+when+we+say+it+%5Bjustification%5D+is+an+action+of+God+imputing+to+a+believing+sinner%2C+etc.+we+consider+it+not+as+a+sudden+and+momentary+action+which+is+of+no+continuance%2C+as+if+all+our+sins+both+past%2C+present+and+to+come+are+remitted+in+an+instant%2C+but+as+an+act+of+God+continued+from+our+vocation+%5Bcalling%5D%2C+wherein+the+grace+of+faith+is+begotten+in+us%2C+to+our+glorification%2C+which+is+the+end+of+our+faith.+For+as+this+action+of+God+is+called+the+justification+of+a+sinner%2C+so+while+we+continue+sinners%2C+we+have+still+need+to+be+justified.+And+as+we+always+have+sin+in+this+life%2C+so+that+it+may+not+be+imputed%2C+we+have+need%2C+that+Christ%E2%80%99s+righteousness+should+be+imputed+unto+us%3B+and+that+as+we+sin+daily%2C+so+Christ+our+advocate+should+continually+make+intercession+for+us%3A+that+notwithstanding+our+manifold+slips%2C+whereinto+through+human+frailty+we+fall%2C+and+notwithstanding+those+manifold+infirmities+and+corruptions+which+remain+in+us+as+the+relics+of+original+sin%2C+we+may+be+continued+in+the+grace+and+favor+of+God+by+the+continued+imputation+of+Christ%E2%80%99s+righteousness+obtained+by+his+continual+intercession+for+us.+For+therefore+does+he+continue+his+intercession+for+us+that+our+justification+may+be+continued+to+us%2C+and+that+as+we+sin+daily%2C+so+we+may+daily+seek+and+obtain+pardon.+But+if+justification+should+so+be+wrought+once+and+at+once%2C+as+that+after+that+act+wrought+in+an+instance%2C+we+should+no+more+be+justified%2C+nor+no+more+need+remission+of+sin%2C+then+must+we+erroneously+conceive+that+the+sins+which+after+the+first+moment+of+our+justification+we+do+commit%2C+are+actually+remitted+before+they+be+committed%3B+whereas+God+forgives+only+sins+past%2C+Rom.+3%3A25.+So+shall+we+not+only+set+open+a+gap+to+all+licentiousness+%28for+who+will+so+fear+to+commit+sin+as+he+ought%2C+or+when+he+has+committed+it+so+sue+for+the+pardon+thereof+who+is+persuaded+beforehand+that+it+is+already+remitted%29%2C+but+also+shall+open+the+mouths+of+our+adversaries%2C+who+will+be+ready+to+say%2C+that+we+Protestants+ought+not+to+pray+for+remission+of+sin%2C+because+in+our+opinion+%28as+they+say%29+we+need+it+not%3A+but+to+this+calumniation+of+the+Papist+I+have+elsewhere+answered.+%C2%A7.+VII.+If+it+be+said+that+it+is+a+received+opinion+among+many+that+justificatio+simul+et+semel+sit%2C+that+%E2%80%98justification+is+wrought+at+once%2C+and+but+once%2C%E2%80%99+I+answer+that+that+assertion+is+not+to+be+admitted+without+distinction%2C+nor+without+good+caution.+The+distinction+is+this%2C+that+there+is+a+justification+of+a+sinner+before+God+in+foro+coelesti%2C+which+properly+is+called+justification%2C+and+is+that+which+here+I+have+defined%3A+and+there+is+a+justification+whereby+a+man+already+justified+before+God+is+justified+in+foro+conscientiae%2C+in+the+court+of+his+own+conscience%3A+which+is+not+properly+justification+itself%2C+but+the+assurance+of+it.+To+this+latter+that+assertion+of+but+once+and+at+once+cannot+in+any+good+sense+be+applied.+For+neither+is+the+full+assurance+of+our+justification+attained+at+once%2C+but+by+degrees%2C+wherein+we+are+to+labor+and+to+give+diligence+to+make%2C+as+our+election+and+calling%2C+so+also+our+justification+more+and+more+sure+unto+us.+Neither+is+it+given+but+once.+For+by+committing+of+any+crime+or+any+grievous+sin%2C+by+spiritual+desertions%2C+by+the+forcible+temptations+of+Satan%2C+this+act+of+spiritual+faith%2C+which+we+call+assurance%2C+may+be+interrupted+or+lost+for+a+time%3B+and+yet+by+repentance%2C+by+prayer+and+practice+of+piety+it+may+be+recovered+again%2C+and+therefore+not+given+but+once.+To+the+former+indeed+it+may+be+applied+in+both+parts%2C+but+with+a+twofold+caution%3A+first%2C+in+respect+of+simul%2C+at+once%2C+if+it+be+understood+as+excluding+degrees%2C+and+not+continuance.+Namely%2C+that+we+are+not+justified+by+degrees%2C+and+as+it+were+by+little+and+little%2C+as+though+our+justification+were+not+perfect+at+the+first.+For+no+sooner+does+a+man+truly+believe+in+Christ%2C+but+the+righteousness+of+Christ+is+imputed+to+him%2C+and+in+and+by+that+righteousness+he+stands+righteous+before+God%2C+as+well+at+the+first%2C+as+at+the+last%3B+that+righteousness+of+Christ+by+which+he+is+justified%2C+whether+first+or+last%2C+being+most+perfect.+Therefore+the+righteousness+of+justification+cannot+be+increased%2C+neither+does+our+justification+before+God+admit+degrees%2C+either+in+one+and+the+same+person%2C+or+yet+in+diverse+men%3A+howsoever+the+assurance+of+justification%2C+and+the+work+of+sanctification%2C+whereby+we+are+to+be+renewed+in+the+inner+man+day+by+day+have+degrees%2C+according+to+the+degrees+of+our+faith%2C+and+according+to+the+measure+of+grace+received.+Secondly%2C+when+it+is+said+that+we+are+justified+before+God+semel%2C+but+once%2C+that+also+may+be+admitted%2C+if+by+once+be+meant+one+continual+act.+For+as+we+are+regenerated+but+once%2C+because+ut+semel+nascimur%2C+ita+semel+renascimur%2C+%5B%E2%80%98as+we+have+been+born+once%2C+so+we+have+been+reborn+once%2C%E2%80%99%5D+so+faith%2C+which+is+wrought+in+our+regeneration+is+given+but+once.+For+that+which+saint+Jude+says%2C+verse+3%2C+of+faith+once+given%2C+is+no+less+true+of+the+habit+%5Babiding+principle%5D+than+of+the+doctrine+of+faith%3B+which+habit%2C+being+once+had%2C+is+never+utterly+lost.+For+all+they+who+have+true+faith%2C+are+born+of+God%2C+1+Jn.+5%3A1%3B+Jn.+1%3A12-13.+And+those+who+are+once+born+of+God+are+never+unborn+again%3B+but+being+made+sons+by+faith%2C+as+all+the+faithful+are%2C+Gal.+3%3A26%2C+they+are+also+made+heirs+of+God+and+coheirs+with+Christ%2C+Rom.+8%3A17.+As+faith+therefore+is+never+utterly+lost%2C+no+more+is+justification.+For+so+long+as+we+have+faith%2C+so+long+we+are+justified.+But+the+habit+of+faith+we+never+lose%2C+though+perhaps+some+act+of+faith+may+sometimes+be+interrupted.+Therefore+our+justification+is+but+one+continued+act%2C+and+in+that+sense+we+are+justified+but+once.+%C2%A7VIII.+Now+whereas+we+have+defined+and+defended+according+to+the+Scriptures+that+justification+is+an+action+of+God%2C+and+such+an+action+as+is+without+us+and+a+continued+act%3A+hence+we+may+conclude+against+the+Papists%3A+First%2C+that+neither+their+first%2C+nor+second+justification+is+that+justification+which+is+taught+in+the+Scriptures%E2%80%A6+Not%2C+that+we+deny%2C+that+inherent+righteousness+is+by+practice+of+good+works+increased%3B+but+that+we+hold+that+justification+is+not+our+own+act%2C+neither+that+we+are+justified+by+any+righteousness+inherent+in+ourselves%2C+or+performed+by+ourselves%2C+nor+that+the+righteousness+of+justification+%28which+is+indeed+the+righteousness+of+Christ%29+can+be+increased%2C+and+therefore+no+degrees+of+justification.+%E2%80%A6+Thirdly%2C+they+do+not+hold+justification+to+be+one+continued+act+from+our+vocation+to+our+glorification%2C+but+such+an+act+as+may+not+only+be+interrupted+oftentimes+and+lost+for+a+time%2C+as+they+say+it+is%2C+by+every+mortal+sin+and+again+be+renewed+so+oft+as+they+go+to+shrift%3B+but+also+that+it+may+totally+and+finally+be+lost.+Which+error+I+have+confuted+at+large+in+my+treatise+of+Perseverance.%E2%80%9D%0A%0A%E2%80%94+George+Downame%2C+A+Treatise+of+Justification+%28London%3A+1633%29%2C+ch.+1%2C+pp.+5-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F87e306e19e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/87e306e19e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=VI.%20Thirdly%2C%20when%20we%20say%20it,large%20in%20my%20treatise%20of%20Perseverance&amp;text=VI.%20Thirdly%2C%20when%20we%20say%20it%20%5Bjustification%5D%20is&amp;text=confuted%20at%20large%20in%20my%20treatise%20of%20Perseverance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Neither have we departed from the doctrine of the Church, in that we teach that faith only justifies. For many of the ancient have used this form of words [though they also affirmed justification involves an inherent righteousness], as: Origen on Rom. 3: Dicit apostolus sufficere solius fidei justificationem, ita ut credens quis tantummodo justificetur, etiamsi nihil ab eo operis fuerit expletum. [The apostle says that the justification of faith alone is sufficient, so that a man is justified by believing alone, even if no work has been performed by him.] Hilary, can. 8. in Matthew: Fides sola justificat. [Faith alone justifies.] Basil, Homily on Humility: Haec est perfecta &amp; integra gloriatio in Deo, quando neque ob justitiam suam quis se iactat, sed novit quidem seipsum verae justitiae indigum, solâ autem fide in Christum justificatum. [This is perfect and complete boasting in God: when a person does not boast on account of his own righteousness, but knows himself indeed to be lacking true righteousness, and is justified by faith alone in Christ.] Ambrose on Rom. 3: Iustificati sunt gratis, quia nihil operantes, neque vicem reddentes, sola fide justificati sunt dono Dei. [They are justified freely, because, doing nothing and rendering nothing in return, they are justified by faith alone, by the gift of God.] Chrysostom, Homily on Faith and the Law of Nature: Eum qui operatur opera iustitiae sine fide non potes probare vivum esse, fidem absque operibus possum monstrare, et vixisse, et regnum coelorum assecutam, nullus sine fide vitam habuit, latro autem credidit tantum, et iustificatus est. [You cannot prove that one who performs works of righteousness without faith is alive; but I can show that faith without works has both lived and attained the kingdom of Heaven. No one has had life without faith; but the thief believed only, and was justified.] Augustine bk. 1, Contra the Two Epistles of Pelagius, ch. 21 Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works. 3. The power of nature without illumination and grace. 4. The power of the Law. 5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

e without a true profession. [2] Sometimes the necessity of good works in act or external good works. 3. The power of nature without illumination and grace. 4. The power of the Law. 5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.”

h+without+works+has+both+lived+and+attained+the+kingdom+of+Heaven.+No+one+has+had+life+without+faith%3B+but+the+thief+believed+only%2C+and+was+justified.%5D+Augustine+bk.+1%2C+Contra+the+Two+Epistles+of+Pelagius%2C+ch.+21+Quantaelibet+fuisse+virtutis+antiquos+praedices+justos%2C+non+eos+salvos+fecit+nisi+fides+mediatoris.+%5BHowever+great+you+may+proclaim+the+virtue+of+the+righteous+of+old+to+have+been%2C+it+did+not+save+them+except+the+faith+of+the+Mediator.%5D+83+Questions%2C+q.+76+Si+quis+cum+crediderit+mox+de+hac+vita+decesserit%2C+iustificatio+fidei+manet+cum+illo%3A+nec+praecedentibus+bonis+operibus%2C+quia+non+merito+ad+illam%2C+sed+gratia+pervenit%2C+nec+consequentibus%2C+quia+in+hac+vita+esse+non+sinitur.+%5BIf+anyone%2C+after+he+has+believed%2C+immediately+departs+from+this+life%2C+the+justification+of+faith+remains+with+him%3A+not+by+preceding+good+works%2C+because+he+attained+to+it+not+by+merit+but+by+grace%3B+nor+by+subsequent+works%2C+because+he+is+not+permitted+to+remain+in+this+life.%5D+Theophylact%2C+on+Gal.+3%3A+Nunc+plane+ostendit+apostolus%2C+fidem+vel+solam%2C+iustificandi+habere+in+se+virtutem.+%5BNow+the+apostle+plainly+shows+that+faith+alone+has+within+itself+the+power+of+justifying.%5D+Bernard+Sermon+22+on+Canticles%3A+Quisquis+pro+peccatis+compunctus%2C+esurit+et+sitit+iustitiam%2C+credat+in+te+qui+iustificas+impium%2C+at+solam+iustificatus+per+fidem%2C+pacem+habebitad+te.+%5BWhoever%2C+pierced+with+sorrow+for+sins%2C+hungers+and+thirsts+for+righteousness%2C+let+him+believe+in+you+who+justifies+the+ungodly%3B+and+thus%2C+justified+by+faith+alone%2C+he+will+have+peace+with+you.%5D+Epistle+77%3A+Qui+crediderit+et+baptizatus+fuerit+salvus+erit.+Caute%2C+inquit%2C+non+repetiit%2C+qui+vero+baptizatus+non+fuerit%2C+condenabitur%2C+sed+tantum+qui+vero+non+crediderit%2C+innuens+nimirum+solam+fidem+interdum+sufficere+ad+salutem%2C+et+sine+illa+sufficere+nihil.+%5BHe+who+has+believed+and+has+been+baptized+shall+be+saved.+He+carefully+did+not+repeat%2C+%E2%80%98but+he+who+has+not+been+baptized+shall+be+condemned%2C%E2%80%99+but+only%2C+%E2%80%98he+who+has+not+believed%2C%E2%80%99+clearly+indicating+that+faith+alone+sometimes+suffices+for+salvation%2C+and+that+without+it+nothing+suffices.%5D+Sometimes+by+these+phrases+of+speech+they+exclude%3A+%5B1%5D+All+that+may+be+without+supernatural+knowledge%2C+all+that+may+be+without+a+true+profession.+%5B2%5D+Sometimes+the+necessity+of+good+works+in+act+or+external+good+works.+3.+The+power+of+nature+without+illumination+and+grace.+4.+The+power+of+the+Law.+5.+The+sufficiency+of+anything+found+in+us+to+make+us+stand+in+judgment%2C+to+abide+the+trial%2C+and+not+to+fear+condemnation.+And+in+this+sense+faith+only+is+said+to+justify%2C+that+is%2C+the+only+mercy+of+God+and+merit+of+Christ+apprehended+by+faith%3A+and+then+the+meaning+of+their+speech+is+that+only+the+persuasion+and+assured+trust+that+they+have%2C+to+be+accepted+of+God+for+Christ%E2%80%99s+sake%2C+is+that+that+makes+them+stand+in+judgment%2C+without+fear+of+condemnation.+And+in+this+sense+all+the+divines+formerly+alleged+for+proof+of+the+insufficiency+of+all+our+inherent+righteousness%2C+and+the+trust+which+we+should+have+in+the+only+mercy+of+God%2C+and+merit+of+Christ%2C+do+teach+as+we+do%2C+that+faith+only+justifies.+For+neither+they+nor+we+exclude+from+the+work+of+justification%2C+%5B1%5D+the+action+of+God+as+the+supreme+and+highest+cause+of+our+justification%3A+for+it+is+He+that+remits+sin%2C+and+receives+us+to+grace%3A+%5B2%5D+nor+the+merit+of+Christ%2C+as+that+for+which+God+inclines+to+show+mercy+to+us%2C+and+to+respect+us%3A+%5B3%5D+nor+the+remission+of+sins%2C+gracious+acceptation%2C+and+grant+of+the+gift+of+righteousness%2C+as+that+by+which+we+are+formally+justified%3A+%5B4%5D+nor+those+works+of+preventing+grace%2C+whereby+out+of+the+general+apprehension+of+faith%2C+God+works+in+us+dislike+of+our+former+condition%2C+desire+to+be+reconciled+to+God%2C+to+have+remission+of+that+%5Bwhich%5D+is+past%2C+and+grace+hereafter+to+decline+the+like+evils%2C+and+to+do+contrary+good+things.+For+by+these+we+are+prepared%2C+disposed+and+fitted+for+justification%3B+without+these+none+are+justified.+And+in+this+sense%2C+and+to+imply+a+necessity+of+these+to+be+found+in+us%2C+sometimes+the+Fathers+and+others+say+that+we+are+not+justified+by+faith+only.+And+we+all+agree%2C+that+it+is+not+our+conversion+to+God%2C+nor+the+change+we+find+in+ourselves%2C+that+can+any+way+make+us+stand+in+judgment+without+fear%2C+and+look+for+any+good+from+God%2C+otherwise+than+in+that+we+find+ourselves+so+disposed+and+fitted%2C+as+is+necessary+for+justification%2C+whence+we+assure+ourselves+God+will+in+mercy+accept+us+for+Christ%E2%80%99s+sake.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Of+the+Church...+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+appendix%2C+ch.+11%2C+pp.+323-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16a6aa85d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16a6aa85d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Neither%20have%20we%20departed%20from%20the,mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake&amp;text=Neither%20have%20we%20departed%20from%20the%20doctrine%20of&amp;text=will%20in%20mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

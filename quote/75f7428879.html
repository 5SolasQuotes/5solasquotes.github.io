<blockquote><p>SIMO[N].

Thou hast not yet told why the ancient fathers did baptise them again, that had been baptized by heretics.

JOIADA.

They were not baptized again, but they were baptized as they that had not been baptized. For heretics did deny the trinity, the god head of Christ, and the holy ghost. Besides that, they were not of the church: Ergo, they had no baptism, nor did baptise in the name of Jesus, whom they did deny.

Moreover, the custom of rebaptising, or baptizing again, was not commonly used in the church. For they that had been baptized in the name of the father, of the son, and of the holy ghost, were not baptized again, but were received by the imposition of hands, and also were admonished to persist and abide in the sincerity of faith. This therefore helpeth you nothing, but rather doth make against you. Among the true Christians, ye have no example at all of your rebaptization, but among these ancient heretics, that have been already condemned of the church. For ye do renew the heresies of Aupentius, Novatius &amp; Pelagius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most sure and strong defence of the baptism of children, against [the] pestiferous sect of the Anabaptists</cite>, trans. John Heron (Worcester: John Oswen, 1551), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>4. The Fathers erred not so much as many suppose in their ascribing [salvific effects] to baptism. For:

1. Sometime by baptism they mean not only the external ordinance, but the whole work therein to be done; viz. the accepting Christ solemnly in Covenant, and giving up ourselves as a sanctified people to Him, renouncing the flesh, the world and the Devil, and so becoming fully Christians. This is baptism with them, and not the outward sign alone. And what says Peter less, when he says, ‘Baptism saves us,’ and thus expounds himself when he has done? And what say the Fathers more?

2. When they speak of these effects of baptism, they suppose a due recipient or subject, that is, a true believer, or the seed of such: and therefore they oft speak of the inefficacy of the outward baptism to hypocrites.

3. When they speak of the outward ordinance only, the collation which they ascribe to it and all the great effects, are to be understood but by way of obsignation and solemnization, and not solely excluding the internal faith and the Covenant: as actual solemnized marriage gives a woman right to her husband and all that he has, when yet she had a right by secret covenant and contract before. Now common reason and the nature of the thing and many of the contexts showing that the Fathers and Councils must be thus expounded according to these rules, I would fain know how they deserve that heavy accusation that we commonly lay upon them for their judgement in this, or what ground the Papists have to plead them generally for their efficacy ex opere operato [from the work working]? And yet I will not excuse each particular person of them thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Disputations of Right to Sacraments</cite>, ... (London: Simmons, 1658), 2nd Disputation, pp. 200-201</span></figcaption>

<blockquote><p>8th Distinction… yet will it not follow that these few fundamentals [such as in the Apostles’ Creed] received by all Christians, Papists, Lutherans, Arians, Verstians, Sabellians, Macedonians, Nestorians, Eutychanes, Socinians, Anabaptists, Treithitae, Antitrinitarii (for all these be Christians and validly baptized) do essentially constitute a true Church, and a true Religion. Because all Christians agree that the Old and New Testament is the truth and Word of God, and the whole faith of Christian Religion is to be found in the Old Testament, acknowledged both by Jews and Christians; for that is not the Word of God indeed in the Old Testament which the Jews say is the Word of God in the Old Testament. Yea the Old and New Testament, and these few uncontroverted points received universally by all Christians, are not God’s Word as all these Christians expone them, but [rather are] the dreams and fancies of the Jews saying that the Old Testament teaches that Christ the Messiah is not yet come in the flesh, the Treithitae [Tritheists] say there be three Gods, yet are the Treithitae Christians in the sense of Doctor [Christopher] Potter [a Laudian Anglican]: So that one principal as that, There is one God, and Christ is God and man, and God is only to be adored, not one of these are uncontraverted, in [the] respect [that] every society of sectaries have contrary expositions upon these common fundamentals, and so [they have] contrary religions. Who doubts but all Christians will subscribe and swear with us Protestants the Apostolic Creed, but will it follow that all Christians are of one true Religion, and do believe the same fundamentals? [2.] Now these fundamentals are the object of faith according as they signify things. To us and to the Treithitae this first article, ‘I believe in God’, as I conceive, does not signify one and the same thing; now join this, ‘I believe in God’ with holy obedience, as we expone it, and as the Treithitae expone it: it could never be a step to everlasting salvation; for it should have this meaning: ‘I believe there is one only true God, and that there be also three Gods,’ and what kind of obedience joined with a faith made up of contradictions can be available to salvation? 3. One general catechism and confession of faith made up of the commonly received and agreed upon fundamentals would not make us nearer peace, though all Christians should swear and subscribe this common Christian catechism, no more than if they should swear and subscribe the Old and New Testament, as all Christians will do, and this day do.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-89407a0c72" data-kw="">
<blockquote><p>Hence, so soon as you are ingrafted into Christ by faith, you are made a son of God, an heir of heaven, a partaker of righteousness, a possessor of life, and (the better to manifest the false tenets of these men) you have not obtained an opportunity of meriting, but all the merits of Christ, since they are communicated to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.6</span></figcaption>

<blockquote><p>But while our inherent depravity renders every kind of work which proceeds from us vicious in the sight of God, the only thing left for our works is to recover the grace which they have not in themselves, by a gratuitous acceptance. This is done when works acknowledged to have no value in themselves borrow, and, as it were, beg their value from Christ.</p></blockquote>

</figure><figure class="quote" id="q-c9dddd0cc7" data-kw="merit obedience under law life the">

</figure><figure class="quote" id="q-eaed42d1dd" data-kw="">
<blockquote><p>What then is our foundation in Christ? Is it that he begins salvation and leaves us to complete it? Is it that he only opened up the way, and left us to follow it in our own strength? By no means, but as Paul had a little before declared, it is to acknowledge that he has been given us for righteousness. … in short, all things of his are ours, we have all things in him, he nothing in us.</p></blockquote>

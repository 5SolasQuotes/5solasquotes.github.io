<main class="wrap"><figure class="quote" id="q-69e49f7459" data-kw="">
<blockquote><p>For seeing that Christ is the rock (Petra), Peter is the Christian people. For the rock (Petra) is the original name. Therefore Peter is so called from the rock; not the rock from Peter; as Christ is not called Christ from the Christian, but the Christian from Christ. Therefore, he says, You are Peter; and upon this Rock which you have confessed, upon this Rock which you have acknowledged, saying, You are the Christ, the Son of the living God, will I build My Church; that is upon Myself, the Son of the living God, will I build My Church. I will build you upon Myself, not Myself upon you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the New Testament</cite>, serm. 26 (Ben. 76), §1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dd6fbda734" data-kw="">
<blockquote><p>It is not the case that there is one church at Rome and another in all the world beside. Gaul and Britain, Africa and Persia, India and the East worship one Christ and observe one rule of truth. If you ask for authority, the world outweighs its capital. Wherever there is a bishop, whether it be at Rome or at Engubium, whether it be at Constantinople or at Rhegium, whether it be at Alexandria or at Zoan, his dignity is one and his priesthood is one. Neither the command of wealth nor the lowliness of poverty makes him more a bishop or less a bishop. All alike are successors of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146 (to Evangelus)</cite>, §1</span></figcaption>

</figure><figure class="quote" id="q-817e1ef5ee" data-kw="">
<blockquote><p>And I say unto you, You are Peter, and upon this rock will I build my Church; that is, on the faith of his confession.</p></blockquote>

</figure><figure class="quote" id="q-cd1dc35099" data-kw="Equality of apostles">
<blockquote><p>If Peter was constituted an ecumenical pontiff, he was greater and superior to the others. But we read of no such superiority having been bestowed upon Peter above the others by Christ or usurped by Peter himself or acknowledged by the apostles. Christ sends them equally: “As the Father sent me, so send I you” (Jn. 20:21). He equally breathes his Spirit into them (v. 22) and gives them the power to remit and to retain sins: “Whose soever sins ye remit, they are remitted unto them; and whose soever sins ye retain, they are retained” (v. 23). He equally gives to all the command to preach and to baptize: “Go ye therefore, and teach all nations” (Mt. 28:19). Hence, he promises them an equality of thrones: “In the regeneration” (i.e., in the renovation of the church caused by the gospel) “ye shall sit upon twelve thrones, judging the twelve tribes of Israel” (Mt. 19:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.5</span></figcaption>

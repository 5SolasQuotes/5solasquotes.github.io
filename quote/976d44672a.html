<main class="wrap"><figure class="quote" id="q-976d44672a" data-kw="">
<blockquote><p>The eternal Sonship of Christ, or that he is the Son of God by eternal generation, or that he was the Son of God before he was the son of Mary, even from all eternity, which is denied by the Socinians, and others akin to them, was known by the saints under the Old Testament; by David (Ps. 2:7, 12); by Solomon (Prov. 8:22, 30), by the prophet Micah, chapter 5, verse 2.

His Sonship was known by Daniel, from whom it is probable Nebuchadnezzar had it (Dan. 3:25), from which it appears he was, and was known to be, the Son of God before he was born of the virgin, or before his incarnation, and therefore not called so on that account. This truth is written as with a sun-beam in the New Testament …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissertation</cite>, Concerning the Eternal Sonship of Christ; Shewing by whom it has been denied and opposed, and by whom asserted and defended, in all ages of Christianity in A Collection of Sermons and Tracts: In Two Volumes (2 vols, London: George Keith, 1773), 2: 534.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

His Sonship was known by Daniel, from whom it is probable Nebuchadnezzar had it (Dan. 3:25), from which it appears he was, and was known to be, the Son of God before he was born of the virgin, or before his incarnation, and therefore not called so on that account. This truth is written as with a sun-beam in the New Testament …”

</figure><figure class="quote" id="q-32dae4c0c5" data-kw="">
<blockquote><p>The words Father, Son, and Holy Spirit, certainly indicate a real distinction, not allowing us to suppose that they are merely epithets by which God is variously designated from his works. Still they indicate distinction only, not division. The passages we have already quoted show that the Son has a distinct subsistence from the Father, because the Word could not have been with God unless he were distinct from the Father; nor but for this could he have had his glory with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.17</span></figcaption>

</figure><figure class="quote" id="q-f934e890f5" data-kw="">
<blockquote><p>That man’s glorification shifts [the Christian’s] participation [in grace] towards perichoresis, or theosis, seals the Eastern Orthodox emphasis… In this paper I will argue that, from a Reformed perspective, man’s glorification through his communion and participation in the Trinity does lead to a oneness that is not perichoretic but is still advanced and fuller than earthly communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/taylor-wright.html">Taylor Wright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Glorification: Perichoresis or Participation’</cite>, (2019) 19 pp. This is a seminary paper for Reformed Theological Seminary. The bibliography has 43 sources, many of which are reformed., p. 1</span></figcaption>

</figure><figure class="quote" id="q-2dd84b7c30" data-kw="">
<blockquote><p>XX… For the Father is called God [in Col. 1:2] by way of distinction, not in an absolute sense, but in terms of order, because He is the first person of the Godhead who begot the Son from Himself, as the source and principle of the Deity. This is known as the simple essence of the divine unity, which cannot be conceived unless it begins from the Father. The mention of ‘our Lord Jesus Christ’ is expressly added to the Father, both for the purpose of distinction because He is the Mediator, and to refute the Arians, both the ancient and recent ones, who wrongly deduce from this passage of Paul that the name of God belongs exclusively and properly to the Father alone. It is certain that it is used relatively here because the mention of our Lord Jesus Christ is explicitly joined to the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

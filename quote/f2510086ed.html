<main class="wrap"><figure class="quote" id="q-f2510086ed" data-kw="">
<blockquote><p>The connection between this mention of the promise and the command to repent and be baptized in the preceding verses: “For the promise,” etc. Baptism is here treated as having the same relation to the promise as circumcision hitherto had; and this implies that no fundamental or organic change was about to take place in the church as it was passing from its Jewish to its Christian form, much less that the old church had ceased to exist and a new one was about to begin.

The apostle proceeds on the supposition that the Abrahamic covenant continues in full force, that as it had not been repealed or superseded by the Sinaitic covenant, so it was not repealed or superseded by the Christian dispensation. He takes the same fact for granted in his discourse in the next chapter (verses 22-26), and Paul argues the same point in Gal. iii. and Rom. xi.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Briefs and Sermons on the Acts of the Apostles</cite>, (1875) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia, ed. T. C. Johnson (3 vols, Richmond VA: The Presbyterian Committee of Publication, 1895-97), 3: 220-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>What Mr. [Thomas] Bedford [d. 1653] has produced for the efficacy of baptism has been answered by Mr. [Richard] Baxter in his Appendix to his Plain Scripture, etc. [1651-1656]… Dr. [Cornelius] Burges, his Treatise of Baptismal Regeneration [1629], has been freely censured by many… And therefore I deny baptism to be the remedy of original sin, or the cause of regeneration, or that Christ intended to assign the use to baptism to heal original sin, or to testify the freedom from it without actual [sin]. These things have been delivered by Augustine and taught by the Romanists and Lutherans, but by many other Protestants disclaimed and refuted; and therefore Mr. Stephens, Mr. [James?] Cranford [d. 1657], Mr. Bedford, etc. in using this argument do but symbolize with the Papists, and revive what many Protestants of best note have exploded. ([Errata, p. 341:] What Dr. [Samuel] Ward and Dr. [John] Davenant have said for regeneration and justification of infants by baptism has been accurately examined and enervated by Mr. Gataker in Latin.)</p></blockquote>

</figure><figure class="quote" id="q-2fa1212585" data-kw="">
<blockquote><p>But the cause why our adversaries are so loathe to allow of this opinion is for that they attribute unto the Sacraments more than they ought to do. For they think that by the power and efficacy of the work of baptism, sin is forgiven. Neither do they acknowledge [that] by the Sacraments, forgiveness is rather sealed, which they of perfect age obtain by believing, and the young children of the faithful, which belong unto election, have it already by the Holy Ghost and by grace. … And that it may the better appear that young children which are baptized (and not only they which have been baptized) do pertain unto the Church, we will declare it evidently enough by the epistle to the Ephesians where it is said (5:25), ‘Ye men love your wives, even as Christ loved the Church and gave Himself for it, that He might sanctify it, being cleansed by the washing of water through the Word, etc.’ By this place thou seest, that it is the Church which is washed and baptized. So then, so long as young children be baptized, it is manifest that they belong unto the Church, and they cannot truly be parts of the Church unless they be adorned with the Spirit of Christ. Wherefore young children which verily belong unto the election of God, before they can be baptized are instructed by the Spirit of the Lord…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, II.2.26, Book 4, ch. 8, ‘Of baptism, baptizing of infants and the holiness of them’, p. 120</span></figcaption>

<blockquote><p>XII. There was no need that a particular precept concerning the baptism of infants should be given because it was known to the disciples that infants were circumcised. It therefore sufficed that there was a general command to baptize all nations, under which the particular is contained.

XIII. The baptism of Christ (performed when he was in his thirtieth year) cannot overthrow infant baptism. All the acts of Christ (which do not pertain to doctrine) are not forthwith to be imitated; otherwise baptism would have to be received only in the thirtieth year (which however our opponents do not say). There was a peculiar reason for his waiting until that time; not only because only in the preceding year was the baptism of John instituted, but also on account of the type of the Levitical priests (who although received in their twenty-fifth year into the priestly college, before their thirtieth year were not admitted to the exercise of their office). Christ (not needing baptism) could safely put it off. But our case is different, we being conceived and born in sin.

XIV. John admitted no one to baptism unless he confessed his sins because he was dealing with the baptism of adults and those called to the Christian church. But it does not follow that the same should be done with infants who are already in the church.

XV. A sign whose virtue depends on the disposition of the receiving subject differs from one whose virtue depends on the promise of the institutor. The former sign is to no purpose applied to one not understanding it; but it is not so with the latter (such as baptism and circumcision). Again, a subject receptive of the sign differs from one perceptive of it also; infants can be the former, although not the latter. Third, a sign is useless applied to one not understanding, or about to understand (which cannot be said of an infant). XVI. Baptism is called the sacrament of repentance; not because it requires that beforehand in everyone to be baptized, but because it binds the baptized to the desire of it, whether in the present (when they are capable of it) or in the future. XVII. Sacraments without faith in the user are said to be empty ceremonies with regard to adults; not with regard to infants, in whom (for a salutary use of baptism) the promise is sufficient and the grace of the covenant (which is sealed on the part of God), even though as yet there is not an answer and restipulation on the part of the baptized (as is evident in circumcision, Gen. 17:7).</p></blockquote>

XV. A sign whose virtue depends on the disposition of the receiving subject differs from one whose virtue depends on the promise of the institutor. The former sign is to no purpose applied to one not understanding it; but it is not so with the latter (such as baptism and circumcision). Again, a subject receptive of the sign differs from one perceptive of it also; infants can be the former, although not the latter. Third, a sign is useless applied to one not understanding, or about to understand (which cannot be said of an infant). XVI. Baptism is called the sacrament of repentance; not because it requires that beforehand in everyone to be baptized, but because it binds the baptized to the desire of it, whether in the present (when they are capable of it) or in the future. XVII. Sacraments without faith in the user are said to be empty ceremonies with regard to adults; not with regard to infants, in whom (for a salutary use of baptism) the promise is sufficient and the grace of the covenant (which is sealed on the part of God), even though as yet there is not an answer and restipulation on the part of the baptized (as is evident in circumcision, Gen. 17:7).”

B+infants+can+be+the+former%2C+although+not+the+latter.+Third%2C+a+sign+is+useless+applied+to+one+not+understanding%2C+or+about+to+understand+%28which+cannot+be+said+of+an+infant%29.+XVI.+Baptism+is+called+the+sacrament+of+repentance%3B+not+because+it+requires+that+beforehand+in+everyone+to+be+baptized%2C+but+because+it+binds+the+baptized+to+the+desire+of+it%2C+whether+in+the+present+%28when+they+are+capable+of+it%29+or+in+the+future.+XVII.+Sacraments+without+faith+in+the+user+are+said+to+be+empty+ceremonies+with+regard+to+adults%3B+not+with+regard+to+infants%2C+in+whom+%28for+a+salutary+use+of+baptism%29+the+promise+is+sufficient+and+the+grace+of+the+covenant+%28which+is+sealed+on+the+part+of+God%29%2C+even+though+as+yet+there+is+not+an+answer+and+restipulation+on+the+part+of+the+baptized+%28as+is+evident+in+circumcision%2C+Gen.+17%3A7%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+3+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+19.20.12%E2%80%9317+%28p.+418%E2%80%9319%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41222c9eb2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41222c9eb2.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/12/turretin-answers-objections-to-infant-baptism-6/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>1. Circumcision of the flesh was a seal of the Circumcision of the heart promised in the Covenant of Grace, Deuteronomy 30:6, and of the cutting of the foreskin thereof, Jeremiah 4:4; Jeremiah 9:26; Ezekiel 36:26, 27, and baptism is the same, Colossians 2:11, 12; Titus 3:5.

2. Circumcision is a seal of the righteousness of faith, Romans 4:11, so is baptism, as 1 Peter 3:21; Romans 4:24.

3. Circumcision is a seal of the Covenant, and by a metonymy called the Covenant of God in the flesh, Genesis 17:7, 13, so is baptism a solemn installing of all Samaria, Acts 8, in the Christian Covenant, and so Acts 2:39.

4. Circumcision is a solemn way of instituting any in the Church of Israel, so we are by one Spirit baptized into one body, 1 Corinthians 12:12, 13.

5. The command of Circumcising is as large as Covenanting, but that is with Abraham the father, and his seed, Acts 2:39, make the command of being Baptized, ekasos every one of you be Baptized, as large as the promise of the Christian Covenant, and call: For the promise is to you and to your children, and to as many as the Lord shall call.

6. The command supposes that all Circumcised, the males of eight days old understand not the promise of the Covenant, the nature, use, signification, and end of the seal and the command to be baptized, supposeth that the children to whom the Covenant promise is made do not understand the same as touching baptism and the Covenant promise, Acts 2:39.

7. If the positive command be general that all these in Covenant should be marked with the initiatory seal of the Covenant: As Genesis 17:7-8, I am thy God and the God of thy seed: Therefore old and young be circumcised, then there was no other command in particular, to baptize old or young, but the institution of Baptism in place of Circumcision needful. […]</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7bfee4083f" data-kw="">
<blockquote><p>33. That, as it is the duty of every man to worship God in such a manner as he thinks most acceptable to Him; all persons, professing the Christian religion, are equally entitled to protection in their religions liberty… the Legislature may, in their discretion, lay a general and equal tax, for the support of the Christian religion… And all acts of Assembly, lately passed, for collecting monies for building or repairing particular churches or chapels of ease, shall continue in force, and be executed… …and every encumbent of the church of England, who has remained in his parish, and performed his duty, shall be entitled to receive the provision and support established by the act, entitled ‘An act for the support of the clergy of the church of England, in this Province,’… … 35. That no other test or qualification ought to be required on admission to any office of trust or profit, than such oath of support and fidelity to this State, and such such oath of office, as shall be directed by this Convention, or the Legislature of this State, and a declaration of a belief in the Christian religion. 36. That the manner of administering an oath to any person, ought to be such, as those of the religious persuasion, profession, or denomination, of which such person is one, generally esteem the most effectual confirmation, by the attestation of the Divine Being…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maryland.html">Maryland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of Maryland</cite>, 1776 (Thorpe, 3.1689-90)</span></figcaption>

-principle-in-the-american-westminster-standards-and-early-american-states/#:~:text=33.%20That%2C%20as%20it%20is%20the,the%20attestation%20of%20the%20Divine%20Being&amp;text=33.%20That%2C%20as%20it%20is%20the%20duty%20of&amp;text=confirmation%2C%20by%20the%20attestation%20of%20the%20Divine%20Being" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-95271cf080" data-kw="">
<blockquote><p>6. The object of the king’s power is not simply a peaceable life, and external peace of human societies, but also honesty and godliness, but to be procured by a civil, politic, regal and coactive way, by the sword of the secular arm, as the object of the Church power is honesty and godliness to be procured by a ministerial, ecclesiastical, and spiritual power, without any forcing of men by external power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, Appendix, p. 388</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

— Samuel Rutherford, Due Right of Presbyteries (1644), pt. 2, Appendix, p. 388">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+The+object+of+the+king%E2%80%99s+power+is+not+simply+a+peaceable+life%2C+and+external+peace+of+human+societies%2C+but+also+honesty+and+godliness%2C+but+to+be+procured+by+a+civil%2C+politic%2C+regal+and+coactive+way%2C+by+the+sword+of+the+secular+arm%2C+as+the+object+of+the+Church+power+is+honesty+and+godliness+to+be+procured+by+a+ministerial%2C+ecclesiastical%2C+and+spiritual+power%2C+without+any+forcing+of+men+by+external+power.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Due+Right+of+Presbyteries+%281644%29%2C+pt.+2%2C+Appendix%2C+p.+388&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F95271cf080.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/95271cf080.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=6.%20The%20object%20of%20the%20king%E2%80%99s,forcing%20of%20men%20by%20external%20power&amp;text=6.%20The%20object%20of%20the%20king%E2%80%99s%20power%20is&amp;text=without%20any%20forcing%20of%20men%20by%20external%20power" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1d7699be7b" data-kw="">
<blockquote><p>1st Assertion: The magistrate as the magistrate is to procure that there be preachers and Church-officers to dispense Word, sacraments and discipline, for: 1. His end is, that people under him may lead a quiet and a peaceable life in godliness and honesty, 1 Tim. 2:2. And the Magistrate attains his end as a Magistrate, if there be simple exercise of religion in the quiet and peaceable way, that may consist with the subjects indemnity, and immunity, from rapine, injuries, and violence. … 4th Assertion. The magistrate de jure is obliged not only to permit, but also to procure the free exercise of the ministry in dispensing Word, sacraments and discipline, and owe his accumulative power, to convene synods, to add his sanction to the lawful and necessary constitutions and ordination of worthy, and to the deposition of unworthy officers in the Church, because: 1. He is a nurse-father in the Church, Isa. 49:23. 2. And by office, as a public father, to procure the good of the souls of the subjects in his coactive [coercive] way, that we may lead a quiet and peaceable life in all godliness and honesty, 1 Tim. 2:2. 3. He is not only to permit, but also positively to procure all peace, in the exercise of all lawful and profitable trades and arts; therefore, far more that glory may dwell in the land, and that the peace thereof may be as a river, Isa. 48:18, by the presence of Christ walking in the midst of the golden candlesticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 24, pp. 543 &amp; 552</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-9e6ae97590" data-kw="">
<blockquote><p>Of the promises it is evident, that to lawful powers is given the sword for punishment of malefactors, for maintenance of innocents, and for the profit and utility of their subjects. Now let us consider, whether the reformation of religion fallen in decay, and punishment of false teachers, do pertain to the Civil Magistrate and Nobility of any realm. I am not ignorant that Satan of old time, for maintenance of his darkness, has obtained of the blind world two chief points: Former, he has persuaded to Princes, Rulers, and Magistrates, that the feeding of Christ’s flock appertains nothing to their charge, but that it is rejected [i.e., devolved] upon the bishops and estate ecclesiastical: and secondarily, that the reformation of religion, be it never so corrupt, and the punishment of such as be sworn soldiers in their kingdom, are exempted from all civil power [per Romanism, for the clergy], and are reserved to themselves and to their own cognition. But that no offender can justly be exempted from punishment, and that the ordering and reformation of religion, with the instruction of subjects, does especially pertain to the Civil Magistrate, shall God’s perfect ordinance, his plain Word, and the facts and examples of those that of God are highly praised, most evidently declare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Appellation, to the Nobility and Estates of Scotland</cite>, …’ (1558)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

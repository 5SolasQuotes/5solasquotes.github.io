<main class="wrap"><figure class="quote" id="q-bf4fefa239" data-kw="">
<blockquote><p>Q. Hitherto of the sorts of Prayer: what principal rule are we to follow for our direction in the matter and manner of our prayers?

A. We are herein (for help of our weakness) to look unto the prayers of the holy men of God set down in Scripture, according as the estate wherein they were at the time of those prayers, may best sort with the special cases and conditions that we are in when we pray. But especially and above any other, yea above all of them, we are to look unto that most absolute prayer, which our Saviour Christ hath taught us in the Gospel.

Q. Do you call that a prayer, which of some is thought only a for me to direct our prayers by?

A. It is both a prayer, which we may and ought to use; and also a form of prayer, whereunto we are to conform, and by which we ought to square all our prayers by; and therefore as Christ biddeth us pray after this sort; so in Luke he biddeth us say, Our Father; &amp;c.

Q. May there not, besides this prayer of the Lord, be now under the Gospel a set form of prayer in the Church?

A. Yes verily; and it is convenient it should be so, so that it be left to the liberty of the Church to alter it.

Q. Wherefore is it convenient that there be a set form of prayer?

A. First, for testifying the consent of all true Churches, in the things that concern the worship and service of God, which may appear by such books. Secondly, for direction of the Ministers to keep in their administration (for substance) like soundness in doctrine and prayer. Thirdly, to help the weaker and ruder sort of people especially; and yet so, as the set form make not men sluggish in stirring up the gift of prayer in themselves, according to divers occurrents; it being incident to the children of God to have some gift of prayer in some measure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 255-56.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a71d56be65" data-kw="">
<blockquote><p>Prayer is not a smooth expression, or a well-contrived form of words; not the product of a ready memory, or of a rich invention exerting itself in the performance. These may draw a neat picture of it, but still, the life is wanting. The motion of the heart God-wards, holy and divine affection, makes prayer real, and lively, and acceptable to the Living God, to whom it is presented; the pouring out of thy heart to Him who made it, and therefore hears it, and understands what it speaks, and how it is moved and affected in calling on Him.

It is not the gilded paper and good writing of a petition, that prevails with a king, but the moving sense of it. And to that King who discerns the heart, heart-sense is the sense of all, and that which only He regards: He listens to hear what that speaks, and takes all as nothing where that is silent. All other excellence in Prayer, is but the outside and fashion of it; this is the life of it.

Though prayer, precisely taken, is only petition, yet, in its fuller and usual sense, it comprehends the venting of our humble sense of vileness and sin, in sincere confession, and the extolling and praising of the holy name of our God, His excellency and goodness, with thankful acknowledgment of received mercies. Of these sweet ingredient perfumes is the incense of Prayer composed, and by the Divine fire of love it ascends unto God, the heart and all with it; and when the hearts of the saints unite in joint prayer, the pillar of sweet smoke goes up the greater and the fuller. …

And, indeed, the sincerity and unfeignedness of prayer, makes it go up as a straight pillar, no crookedness in it, tending straight towards heaven, and bowing to no side by the way. Oh ! the single and fixed viewing of God, as it, in other ways, is the thing which makes all holy and sweet, so particularly does it in this Divine work of prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary Upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 512.</span></figcaption>

<blockquote><p>Prayer consists in calling upon the true God, and arises from an acknowledgment and sense of our want, and from a desire of sharing in the divine bounty, in true conversion of heart and confidence in the promise of grace for the sake of Christ the mediator, asking at the hands of God such temporal and spiritual blessings as are necessary for us; or in giving thanks to God for the benefits received. The genus or general character of prayer consists invocation or adoration. Adoration is often used in the sense of the whole worship of God, since we regard him as the true God, whom we worship. Prayer is a species or part of invocation, for to call upon the true God is to ask of him such things as are necessary both for soul and body, and to render thanks to him for benefits received. It is here used in the sense of the general character of pray. There are, therefore, two species or parts comprehended in prayer—petition and thanksgiving. Petition is a prayer asking of God those blessings necessary both for the soul and body. Thanksgiving is prayer acknowledging and magnifying the benefits received from God, and binding those who receive these gifts to such gratitude as is pleasing to God. Thankfulness in general consists in acknowledging and professing what and how great is the benefit received, and in binding those who are the recipients thereof to the performance of such duties as are mutual, possible and becoming. It comprehends, therefore, truth and justice. The apostle Paul, in his first Epistle to Timothy, 2:1, enumerates four species of prayer, saying, “I exhort, therefore, that first of all supplication, prayers, intercessions, and giving of thanks, be made for all men.” The first includes prayers against evil things; the second, petitions for good things; the third, intercession for others; and the fourth, thanksgiving for benefits received and evils warded off. This distinction is drawn from the end or design of prayer. Prayer is also distinguished into public and private prayer, from the circumstances of person and place. Private prayer is the intercourse which a faithful soul has with God, asking, alone and apart from others, certain blessings for himself, or for others; or giving thanks for benefits received. This form of prayer is not restricted to any particular words or places, for oftentimes the heart, when burdened and distressed, gives utterance to nothing more than sighs and groans; and the Apostle commands “that men pray every where, lifting up holy hands.” (1 Tim. 2:8.) Public prayer is that which, by the use of certain words, is offered up to God by the whole church in the congregation, the minister leading, as it is right and proper that he should in the public gatherings of the church. Language, or the use of the tongue, is necessary for this form of prayer. Hence Christ said: When ye pray, say, Our Father, &amp;c. It was also chiefly for this that the tongue was made, that God might be praised and magnified by it; and it is out of the abundance of the heart that the mouth speaketh. Lastly, by this others are also invited to praise and worship God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, (Cincinnati, OH: Elm Street Printing Company, 1888), 619–20.</span></figcaption>

— Zacharias Ursinus, The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism, (Cincinnati, OH: Elm Street Printing Company, 1888), 619–20.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPrayer+consists+in+calling+upon+the+true+God%2C+and+arises+from+an+acknowledgment+and+sense+of+our+want%2C+and+from+a+desire+of+sharing+in+the+divine+bounty%2C+in+true+conversion+of+heart+and+confidence+in+the+promise+of+grace+for+the+sake+of+Christ+the+mediator%2C+asking+at+the+hands+of+God+such+temporal+and+spiritual+blessings+as+are+necessary+for+us%3B+or+in+giving+thanks+to+God+for+the+benefits+received.+The+genus+or+general+character+of+prayer+consists+invocation+or+adoration.+Adoration+is+often+used+in+the+sense+of+the+whole+worship+of+God%2C+since+we+regard+him+as+the+true+God%2C+whom+we+worship.+Prayer+is+a+species+or+part+of+invocation%2C+for+to+call+upon+the+true+God+is+to+ask+of+him+such+things+as+are+necessary+both+for+soul+and+body%2C+and+to+render+thanks+to+him+for+benefits+received.+It+is+here+used+in+the+sense+of+the+general+character+of+pray.+There+are%2C+therefore%2C+two+species+or+parts+comprehended+in+prayer%E2%80%94petition+and+thanksgiving.+Petition+is+a+prayer+asking+of+God+those+blessings+necessary+both+for+the+soul+and+body.+Thanksgiving+is+prayer+acknowledging+and+magnifying+the+benefits+received+from+God%2C+and+binding+those+who+receive+these+gifts+to+such+gratitude+as+is+pleasing+to+God.+Thankfulness+in+general+consists+in+acknowledging+and+professing+what+and+how+great+is+the+benefit+received%2C+and+in+binding+those+who+are+the+recipients+thereof+to+the+performance+of+such+duties+as+are+mutual%2C+possible+and+becoming.+It+comprehends%2C+therefore%2C+truth+and+justice.+The+apostle+Paul%2C+in+his+first+Epistle+to+Timothy%2C+2%3A1%2C+enumerates+four+species+of+prayer%2C+saying%2C+%E2%80%9CI+exhort%2C+therefore%2C+that+first+of+all+supplication%2C+prayers%2C+intercessions%2C+and+giving+of+thanks%2C+be+made+for+all+men.%E2%80%9D+The+first+includes+prayers+against+evil+things%3B+the+second%2C+petitions+for+good+things%3B+the+third%2C+intercession+for+others%3B+and+the+fourth%2C+thanksgiving+for+benefits+received+and+evils+warded+off.+This+distinction+is+drawn+from+the+end+or+design+of+prayer.+Prayer+is+also+distinguished+into+public+and+private+prayer%2C+from+the+circumstances+of+person+and+place.+Private+prayer+is+the+intercourse+which+a+faithful+soul+has+with+God%2C+asking%2C+alone+and+apart+from+others%2C+certain+blessings+for+himself%2C+or+for+others%3B+or+giving+thanks+for+benefits+received.+This+form+of+prayer+is+not+restricted+to+any+particular+words+or+places%2C+for+oftentimes+the+heart%2C+when+burdened+and+distressed%2C+gives+utterance+to+nothing+more+than+sighs+and+groans%3B+and+the+Apostle+commands+%E2%80%9Cthat+men+pray+every+where%2C+lifting+up+holy+hands.%E2%80%9D+%281+Tim.+2%3A8.%29+Public+prayer+is+that+which%2C+by+the+use+of+certain+words%2C+is+offered+up+to+God+by+the+whole+church+in+the+congregation%2C+the+minister+leading%2C+as+it+is+right+and+proper+that+he+should+in+the+public+gatherings+of+the+church.+Language%2C+or+the+use+of+the+tongue%2C+is+necessary+for+this+form+of+prayer.+Hence+Christ+said%3A+When+ye+pray%2C+say%2C+Our+Father%2C+%26c.+It+was+also+chiefly+for+this+that+the+tongue+was+made%2C+that+God+might+be+praised+and+magnified+by+it%3B+and+it+is+out+of+the+abundance+of+the+heart+that+the+mouth+speaketh.+Lastly%2C+by+this+others+are+also+invited+to+praise+and+worship+God.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Commentary+of+Dr.+Zacharias+Ursinus+on+the+Heidelberg+Catechism%2C+%28Cincinnati%2C+OH%3A+Elm+Street+Printing+Company%2C+1888%29%2C+619%E2%80%9320.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5619110d65.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5619110d65.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/06/what-is-prayer/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-38c81dd10b" data-kw="">
<blockquote><p>The first petition is that God&#x27;s name be hallowed [Matt. 6:9]; the need for it is associated with our great shame. For what is more unworthy than for God&#x27;s glory to be obscured partly by our ungratefulness, partly by our ill will, and so far as lies in our power, destroyed by our presumption and insane impudence? Though all ungodly men should break out with their sacrilegious license, the holiness of God&#x27;s name still shines. The prophet justifiably proclaims: &quot;As thy name, O God, so thy praise unto all the ends of the earth&quot; [Ps. 48:10]. For wherever God becomes known, his powers cannot fail to be manifested; might, goodness, wisdom, righteousness, mercy, truth—these should captivate us with wonderment for him, and impel us to celebrate his praise. Because, therefore, God&#x27;s holiness is so unworthily snatched from him on earth, if it is not in our power to assert it, at least we are bidden to be concerned for it in our prayers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.41</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ef42a8d959" data-kw="">
<blockquote><p>Is this rational, that where two commands of the magistrate are joined, the one undoubtedly lawful to be obeyed, the other doubted of, that subjects should disobey the magistrate in that which is clearly lawful, because they have a doubt or unclearness anent obeying him in the other command? Does it not become subjects to go as far on in obedience to lawful authority as they see they may without sin against God? Then it is time to stop when anything is put to them by virtue of the king’s command which they clearly see they cannot do without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-honyman.html">Andrew Honyman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seasonable Case of Submission to the Church-Government as now Re-established by Law, briefly stated and determined by a Lover of the Peace of this Church &amp; Kingdom</cite>, (Edinburgh: Tyler, 1662), p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>§50. And whereas the king’s party usually say that it was the seditious preachers that stirred up the people, and were the cause of all this, I answer:

1. It is partly true and partly not: It is not true that they stirred them up to war (except an inconsiderable number of them, one perhaps in a county, if so much). But it is true that they discovered their dislike of the Book of Sports and bowing to altars, and diminishing preaching, and silencing ministers and such like; and were glad that the parliament attempted a reformation of them.

2. But then it is as true that almost all these were conformable ministers, the laws and bishops having cast out the nonconformists long enough before; insomuch that I know not of two nonconformists in a county. But those that made up the Assembly at Westminster, and that through the land were the honor of the parliament’s party, were almost all such as had till then conformed and took those things to be lawful in case of necessity, but longed to have that necessity removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ: or, Mr. Richard Baxter’s Narrative of the most Memorable Passages of his Life &amp; Times</cite>, (London: Parkhurst, 1696), bk. 1, pt. 1, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>We require not of necessity an artificial table of timber: a bull-hide or a plot of ground may serve in time of necessity, and answers analogically to a standing table, as the plot of ground did whereabout the multitude sat in rows by fifties and fifties, Mark 6. Neither do we stand upon the fashion, whether it be long or round; but we require that the communicants always sit table-ways [like at a table], so that they may observe the form of a feast or banquet: For in that this holy action is called a ‘supper’, it is imported that it was celebrated in the form of a feast or banquet, as [Johannes] Piscator observes in his observations upon Mt. 26. We do not require all the forms used at common feasts, but these which Christ the institutor, and Master of the feast thought sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Re-Examination of Two of the Articles Abridged: to wit, of the Communicants’ Gesture in the Act of Receiving, Eating &amp; Drinking</cite>, … ([Holland?] 1636), ‘Of the Communicants’ Gesture in the Act of Receiving’, p. 14 Calderwood was an arch-Scottish presbyterian minister and theologian, who was the major mouthpiece for them between 1618-1637.</span></figcaption>

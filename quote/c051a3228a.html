<blockquote><p>As I ever abhorred division and faction in the Church, as that which tends to its utter ruin if the Lord prevent it not;” he adds (and here I join with him), “I would, in the bowels of my Lord and Master, if such a feckless one as I may presume to persuade and exhort both ministers and professors: ‘If therre by any consolation in Christ, if any comfort in love, if any fellowship of the Spirit, if any bowels and mercies, that ye be like-minded, having the same love, being of one accord, of one mind. In lowliness of mind let each esteem other better than themselves.’ (Phil. 2:2-3)</p></blockquote>

</figure><figure class="quote" id="q-47760b2053" data-kw="">
<blockquote><p>The question of separation is often one of perspective. It is not hard to list out all the defects and deficiencies of a Church from the Word, as Separatists are keen on doing. Yet doing so takes one’s eyes off the positive Christian principles and virtues the Church yet has in it, which one would find more profit in making into a list. Both lists, with opposite parties’ eyes on either, could be equally true, yet positive Christian principles are more foundational and binding grounds for union by the Word than superadded defects and errors. Likewise, a plethora of seemingly conclusive criticisms may be heaped up against a controversial practice without persons ever knowing, or caring to find out, the original or best reasons for it, which, when known, may not only be tolerable, but one may find the practice able to be accommodated and performed under those reasons (or others) without hindering unity. Separation presupposes and is founded on unity. Unity, of its nature, is not built on separation or dependent on it. The errors and deficiencies one materially tolerates and accommodates for the time and circumstances under necessity, for the higher good in love, overlooking a multitude of sins (1 Pet. 4:8), without approving them, versus what one believes and the standard one seeks to reform unto, namely the spotless Word of God, are two different things which may consist with each other. Answer this question: Over matters less than tending to overturn fundamentals or the power of godliness, between (1) those who condemn, won’t materially conform for nearly anything and separate out of principle upon perceived necessity to set up their own church, outward government, worship and ministry as perfect as they can, versus (2) those who over the long-haul sacrificially bear under what they are able to defer to, act as salt, strengthen and build up Christ’s people in the main things and seek to reform Christ’s Body to the Word, while maintaining her unity: Who is most faithful to the most important, fundamental and weightiest, and hence binding, Christian principles, exercising the greater love to God and man (Mt. 22:36–39)? If denominationalism, or sectarianism, is ever to be healed, as Jesus prays (Mt. 6:10; Jn. 17:20–23), it must be along the latter lines; our ministers’ book contains essential principles towards that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025) | 1. “Background”, “Perspective”, pp. 13-14</span></figcaption>

</figure><figure class="quote" id="q-c384fd05e1" data-kw="">
<blockquote><p>It was the laubable practice in reforming times to condemn all steps of defection, and duly to censure such as were guilty of public backslidings. Accordingly, by the Assembly that met anno 1638, all the prelates, being ringleaders in the apostasy, were deposed, and some of them excommunicated: Also, in the said reforming period, they returned to the Lord by a particular acknowledgment and confession of the sins of the ministry and of the whole land. But the General Assembly that met in the year 1690 made no particular acknowledgement of the many heinous backslidings of the former period: But on the contrary when many lamentable steps of defection and apostasy were complained of in a Large Paper offered to the foresaid Assembly 1690 by Mr. Alexander Shields, etc.</p></blockquote>

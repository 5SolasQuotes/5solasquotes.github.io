<blockquote><p>Now the will has a natural tendency towards good. Consequently there alone are essence and will identified where all good is contained within the essence of him who wills; that is to say, in God, Who wills nothing beyond Himself except on account of His goodness.</p></blockquote>

<blockquote><p>III. God tells us, that sinners will their death, ‘Why will ye die,’ saith God, — The way which sinners take is the way of death, and it is their voluntary choice, they are not force’t to it by God, and neither are they drag’d to by the Devil — but it is their free will &amp; act— Adam acted voluntarily in what he did — IV. God expressly tells us in our text and context, that He has no pleasure in the death of a sinner, but yt [that] he turn and live — God wills the life and eternal salvation of poor sinners turn ye turn ye for why will ye die — God is sincere, hearty, and earnest in his will, it is plainly to be seen and understood by word, which is his revealed will to the children,— in particular his amazing will to save sinners is to be discovered in his sending his dearly beloved and only begotten Son into this world in amazing manner as He did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samson-occom.html">Samson Occom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Sermon on Ezekiel 33:11’</cite>, (1765)</span></figcaption>

<blockquote><p>3. In the moral providence of God, is there a place for an ineffective wish? XIII. It is asked, third, whether in the moral providence of God, there is a place for some ineffective wish or desire of God. The Pelagians and Pelagianizers—Socinians, Jesuits, Arminians, and others—because they argue for a self-determined free choice that God cannot determine, and because likewise they argue for a conditioned antecedent will in God, by which God wills if a person wills, and likewise by which he wills that each and every person be saved, if only they will it, say that there is in God a wish properly so-called, by which God desires that this or that duty be done by man, but he desires it in vain. The Reformed acknowledge no sort of wish and desire in God, except that which coincides with his commandment, different from it in this alone, that whereas a commandment urges a duty only by the authority of the lawgiver, a wish urges it by a motive drawn from a certain eminent advantage which is certainly set to fall from that duty upon him who obeys. We examined the reasons on both sides in book 2, chapter 15, §XXXII.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 11, section 13</span></figcaption>

<blockquote><p>And now, before we close, let us once more entreat you who are unconverted to turn to Jesus. Could ministers but give you some faint idea of Christ’s willingness to save you! If any soul here can declare that it is willing to receive Christ, let it know that Christ is yet more willing to save and to bless. He does not wish you to remain an hour longer a stranger to his love. Why did He suffer? Why did He die? Oh! not merely that He might be glorified in your destruction.</p></blockquote>

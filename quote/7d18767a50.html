<main class="wrap"><figure class="quote" id="q-7d18767a50" data-kw="">
<blockquote><p>The law of the Sabbath is not only of universal and perpetual obligation, but it is a most benignant provision for man and the lower animals. It was instituted in paradise, immediate after the appointment of marriage, – the foundation of families and social relations. “The Sabbath was made for man,” designed for universal man, for his benefit in the fullest sense, and secured to him by divine authority and prescription, so as that no inferior power should dare to infringe the sacred enactment, or rob man of its beneficent provision. The Sabbath is God’s great and all-pervading means of giving efficiency to his moral government, and holds a similar relation to general morality that marriage does to social purity and happiness. It was intended to commemorate and enforce the rights of God, as the Creator, Preserver, and Redeemer of man. It was in every way designed for man’s welfare, bodily, mental, and spiritual; and its due observance contributes to his health, peace, and happiness, both as an individual, and as placed in various social relations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The races: the evils connected with horse-racing and the steeple-chase and their demoralizing effects</cite>, (1853) in Works doctrinal and practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh, 1876), iv, 361.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b6e183838" data-kw="">
<blockquote><p>I confess that there have been wise men, that there have been philosophers of the ancients very eminently distinguished; there were also among them princes and legislators of most respectable genius and celebrated fame. But the principles of their philosophy were deficient, and besides, is there any one who can point out their influence or their efficacy? Can a single country be mentioned, a single city, a village, nay a single man, whom they have taught the true knowledge of God and the pure worship acceptable in his sight?</p></blockquote>

<blockquote><p>We act against God, when we act against his Covenant; a Covenant is a serious thing. Suppose the matter of it Civil, (though ours is more) the making of it is Divine. We read of a Covenant made with an Heathen King, which being broken, saith God, shall he prosper, shall he escape that doth such things? what, when lo he had given his hand, ver. 18. He shall not escape; let us look upon our solemn League and Covenant, I tremble when I read it; we covenanted not only against Prelacy, but Popery; not only Hierarchy, but Heresy; not only Sin, but Schism; and have we not gone against the letter of it? how is the Covenant slighted, as an Almanack out of date?

Those that did once lift up their hand to it, do now lift up their heal against it. Indeed at first the Covenant was looked upon as sacred; the drunkard would be sober that day, the unclean person chaste; but within a while it is laid aside; we begin to play fast and loose with God, and for a trifle will venture the curse of the Covenant; But they like men have transgressed the Covenant, or as in Hebrew, They like Adam, how is that? for a poor apple; so for a trifle, a Penny in the shop, or the bushel, men will set their Covenant and their conscience to sale. God sees this, and hear what he saith, I will bring a sword, which shall avenge the quarrel of my Covenant: Covenant violation is an high affronting sin, and an affront will make God draw his sword; to set our hand and seal to the Covenant, and then to tear off the Seal, if the Covenant will not hold us, God hath Chains that will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation</cite>, (London: Ralph Smith, 1654), pp 25-27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-119f955e06" data-kw="">
<blockquote><p>Because there is explicit mention of children, servants, and sojourners, one gathers from this that parents, heads of households, and magistrates are not only required to hallow the Sabbath themselves but also to see to it that the children, servants, and sojourners entrusted to their hospitality and care hallow it as well. As far as the sharing of religion [religionis communicatio] is concerned, there is no difference between parents and children, masters and servants, rulers and subjects, “for there is one Lord of all, one faith for all, one hope and inheritance for all” (Eph. 4:4–5).

Finally, because foreigners were commanded to rest from working on the seventh day, it is clear that even though they were not forced to assume Israel’s religion, those foreigners were still required to submit themselves to God’s Law in external matters. This has been set before the Christian ruler to be imitated in its own way. Had sojourners been allowed to work on the Sabbath, not only would their example have been a source of offense to the Israelites, but also their own servile tasks could have resulted in a fraudulent evasion of the Law through them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Commonplaces: On the Law of God, on the Ceremonial and Forensic Laws</cite>, trans. Richard J. Dinda, ed. Benjamin T. G. Mayes and Joshua J. Hayes (1613; St Louis MO: Concordia Publishing House, 2015), XV.4.9.3. § 133.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

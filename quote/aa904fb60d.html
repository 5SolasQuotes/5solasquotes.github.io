<blockquote><p>The mind, let us suppose, first awakened perhaps to the special questions of theology, is further awakened to the wider questions of philosophy. What then is the transition effectively in effect, though only potentially or intensively in relation to time? It does not mean importation of the dogmas of philosophy into theology, so as to displace, or to conceal, the proper matter of theology,—that given in supernatural revelation of God. In every age there has been a process of this sort, always to the detriment both of theology and of philosophy, especially of the former: one might venture to say that in every age the sorest calamities of theology have been occasioned by her adoption of dogmas from the then prevailing philosophy or science.

The legitimate transition here means a man’s bringing to the contemplation of matters properly of theology that refinement which natively results from philosophical culture,—a philosophical manner of looking at every matter, and even of speaking of every matter, such as to give corresponding form to the matter in hand. This philosophical manner, of contemplation and representation, of research and exposition, may, though the philosophy be chronologically after the theology in origin, yet, in effect, continue throughout a theological lifetime to be as a logical or psychological antecedent, a disciplined habit of mind conditioning thought and even utterance, about theology as about everything else.

It thus appears that the transition does not necessarily and ought not to involve abandonment of philosophy. Justin Martyr, when he entered the Christian Church, brought his philosopher’s cloak along with him. So in effect do we all, who have had the cloak, unless we leave an important talent unfruitful of interest. We may not wear it ostentatiously, or even openly: some of us may have it and wear it only, so to speak, as lining for the Geneva gown. But if we ever have had it, we are bound to have it and wear it always.

Thus the theological system of the Church, while the matter of it is or ought to be drawn exclusively from positive revelation, is for its form indebted to Aristotle, and in a higher sense to Plato. The ideal of theological study, a philosophically trained and gifted mind seeking truth only in that revelation, has rarely been realised, perhaps not least rarely in our day, when multitudes are professedly Biblical in their study and philosophical in their preparation for the study. And one reason for the rarity is, that men really either do not attain to the philosopher’s cloak, or cease to have it and to wear it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-macgregor.html">James MacGregor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Transition from Philosophy to Theology in British and Foreign Evangelical Review</cite></span></figcaption>

<blockquote><p>A controversy respecting the atonement sprang up between Duns Scotus and the followers of Aquinas, which involved fundamental principles in ethics and religion, and divided the Romish Church into two great parties of Thomists and Scotists. Duns Scotus denied the Anselmic doctrine that sin is of infinite demerit, and consequently denied that the suffering of Christ is of infinite value. The relation of the atonement of the Son of God to the sin of mankind, he maintained, is merely an arbitrary and constituted one. The principle upon which he founded his theory was: “Tantum valet omne creatum oblatum, pro quanto acceptat Deus illud, et non plus.” There is no interior fitness and adaptation between Christ’s atonement and man’s sin. God was pleased to accept this particular sacrifice as an offset and equivalent for human transgression, not from any intrinsic value in it, but because he so pleased. He might have accepted any other substitute, or he might have dispensed with accepting any substitute at all. In opposition to this view, the followers of Aquinas maintained the old Anselmic theory of the infinite demerit of sin, and the infinite and objective value of Christ’s satisfaction. In this controversy, the soteriology of the adherents of Aquinas is more in harmony with the Protestant view and feeling; so that we might reverse what Melanchthon remarks of Augustine, and say, that “the opinion of Aquinas is more pertinent, fit and convenient when he disputed than it was when not disputing.” And yet it would be difficult to see how the followers of Aquinas could in the end avoid the conclusions of Duns Scotus, if they started from that doctrine of a relative necessity of satisfying justice which we have seen Aquinas held, in common with all the Schoolmen excepting Anselm. If omnipotence and bare will are more ultimate in the Divine Nature than justice and truth are, then it is difficult to see how Scotus can be censured for holding, that in the last analysis God can dispense with an atonement altogether, and that whatever value the existing judicial provision possesses in the divine plan, it possesses not in itself, but solely by virtue of its optional acceptance by the Omnipotent One who is not limited by anything, not even by his own moral attributes. The controversy, however, ran high between the adherents of Aquinas and Scotus,—the Dominican order generally siding with the former, and the Franciscan with the latter. The Nominalists in philosophy also naturally favoured the views of Scotus, as his theory was that of a nominal and putative satisfaction, in distinction from a real and objective one. The extravagantly speculative minds of the age, those who have given the reputation of hair-splitting and excessive dialectics to Scholasticism, also adopted the positions of Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Theology</cite>, (New York: Scribners) 2.315</span></figcaption>

<blockquote><p>The overall chain of argument, then, goes something like this: Pure reason proves through philosophical arguments that there is a God and that we have immortal souls. This by itself entails that a miracle like a resurrection from the dead is possible. Now the historical evidence that Jesus Christ was in fact resurrected from the dead is overwhelming when in interpreted in light of that background knowledge. Hence pure reason also shows that Jesus really was raised from the dead. But Jesus claimed to be divine, and claimed that the authority of his teachings would be confirmed by His being resurrected. So the fact that He was resurrected provides divine authentication of His claims. Hence reason shows that He really was divine… Of course some of those teachings [of Christ] are taken on the basis of authority, but the point is that the trustworthiness of that authority is something that, it is claimed, can be established by reason.. We can know such-and-such a teaching was true because Christ taught it… and a divine being cannot be in error… Every link in the chain is supported by argument… All I am interested in doing here is sketching out the general strategy that Christian theology has traditionally used in justifying its doctrinal claims, and the point of doing so is to understand where faith fits into the picture… So how does it come into play? This way… suppose that the general strategy just sketched can be successfully fleshed out. Then it follows that if you are rational you will believe anything Christ taught; indeed, if you are rational you will believe it even if it is something that you could not possibly have come to know in any other way, and even if it is something highly counterintuitive and difficult to understand. For reason will have told you that Christ is infallible, and therefore cannot be wrong in anything He teaches. In short, reason tells you to have faith in what Christ teaches, because He is divine. And that is at bottom what faith is from the point of view of traditional Christian theology: belief in what God has revealed because if God has revealed it it cannot be in error; but where the claim that He revealed it is itself something that is known on the basis of reason. Faith doesn’t conflict with reason, then; it is founded on reason and completes reason.</p></blockquote>

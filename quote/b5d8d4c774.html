<main class="wrap"><figure class="quote" id="q-b5d8d4c774" data-kw="">
<blockquote><p>§13. He that does not nullify or unchurch a church, may lawfully remove from one church to another and make choice of the best and purest, or that which is most suited to his own edification, if he be a free-man. §14. But in case of such choice or personal removal, the interest of the whole church, or of religion in common, must be first taken into consideration by him that would rightly judge of the lawfulness of the fact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons of the Christian Religion</cite>, … (London: White, 1667), pt. 2, ch. 13, pp. 465-66 Baxter was a congregationalist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-89397af287" data-kw="">
<blockquote><p>Whatever have been the effects and fruit of meetings of persons of diverse families in times of corruption or trouble (in which cases many things are commendable which otherwise are not tolerable) yet, when God has blessed us with peace and purity of the Gospel, such meetings of persons of diverse families (except in cases mentioned in these Directions)¹ are to be disapproved, as tending to the hindrance of the religious exercise of each family by itself, to the prejudice of the public ministry, to the renting of the families of particular congregations, and (in process of time) of the whole Kirk, besides many offenses which might come thereby, to the hardening ofthe hearts of carnal men, and grief of the godly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-3542fa7ff7" data-kw="">
<blockquote><p>This separation in Corinth was in a Church from the idolatry in it; which separation we allow, but not a separation out of a Church, else the words would bear that Paul will have them to forsake the Church of Corinth for idolatrous tables in it and set up a new Church of their own, which the Separatists dare not say, and is contrary to other places, 1 Cor. 5:4; chs. 11 &amp; 14, where he commands and allows their meetings and public Church-communion: Therefore this place proves not their point. What logic is this? Separate from idols, therefore separate from a Church where the true worship of God is professed and taught.</p></blockquote>

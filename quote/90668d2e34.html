<main class="wrap"><figure class="quote" id="q-90668d2e34" data-kw="">
<blockquote><p>The doctrine of grace, as diabolically perverted through Mr. Whitefield, is versant about such a Christ as is merely a Savior; and it hurries men off in quest of such spiritual influences, convictions, conversions, consolations and assurance as are unconcerned with and hostile unto the Mediator’s visible glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>of the Church of Scotland, contra the Seceders’ Covenant, &amp; that as a Term of Communion, 1744</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>The embracing of refusing the Oath of Abjuration, affords not the least ground for separation. This proposition,” adds he, “shines with such a bright and convincing light of truth, that none who can allow themselves, without prejudice, to reflect upon its evidence, will refuse to admit of it as undeniable.</p></blockquote>

</figure><figure class="quote" id="q-5a539df8b1" data-kw="">
<blockquote><p>…or else they [Christians] must [on congregationalist principles] be fetched from places so far distant as must force them either to travel far from their several abodes to the same meeting place for worship winter and summer, or else many of them to be without all church-ordinances, or to enjoy them rarely: The former of which is oppressive to their bodies, the later injurious to their souls; neither of them seems suitable to the goodness and wisdom of God, who (as ’tis said of the Sabbath [Mk. 2:27]) has made Church-ordinances for man, not man for Church-ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their own Printed Papers… (London, 1644), ch. 2, p. 3, margin note. Rathband was an English puritan and Westminster divine.</cite></span></figcaption>

</figure><figure class="quote" id="q-f2de4a259d" data-kw="">
<blockquote><p>…and every party pretending to be the only Anti’s [anti-Erastian, anti-Popish, etc. persons] in the kingdom, against all evil things, and for all good; maintaining and transmitting the testimony, as it was handed down to the [Glorious] Revolution [1689]: yet they all agree in these two Anti-Presbyterian principles in such a period: [1.] In a positive proclaiming their disowning of the State, and separation from the Church and [from] all ministers and members that dare not go up with them in every jot in their over-stretched consequences. 2. They all agree against paying of all Crown-dues, even under this peaceable [civil] government under which we enjoy religion, life, and liberty. Which never any of our ministers, martyrs, did preach or witness against… It is a piece of demented infatuation to make little or no difference betwixt that period and this, and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols., ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript</cite>, pp. 142-43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6e123c82f1" data-kw="">
<blockquote><p>I A.B. do bind and oblige me to keep the public peace, and if I fail that I shall pay a year’s rent; likewise, that my tenants and men-servants shall keep the public peace, and in case they fail, I oblige myself to pay for every tenant his year’s rent, and for every servant his year’s fee. And, for the more security, I’m content their presents be registrate in the books of Council.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

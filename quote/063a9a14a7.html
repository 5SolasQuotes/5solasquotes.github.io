<main class="wrap"><figure class="quote" id="q-063a9a14a7" data-kw="">
<blockquote><p>The old father Epiphanius saith:--&quot;It is a horrible wickedness, and a sin not to be suffered, for any man to set up any picture in the Church of the Christians, yea, though it were the picture of Christ Himself.&quot; Yet, these men store all their temples, and each corner of them, with painted and carved images, as though without them religion were nothing worth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/images.html">Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1710e393eb" data-kw="">
<blockquote><p>The old Council Gangrense commandeth that none should make such difference between an unmarried priest and a married priest, as he ought to think the one more holy than the other for single life&#x27;s sake. These men put such a difference between them, that they straightway think all their holy service to be defiled if it be done by a good and honest man that hath a wife.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 5</span></figcaption>

</figure><figure class="quote" id="q-fa950a99bd" data-kw="Vernacular">
<blockquote><p>Because these original tongues are not known to all the people of God, who have a right unto, and interest in the Scriptures, and are commanded in the fear of God to read, and search them, therefore they are to be translated into the vulgar language of every nation unto which they come, that the Word of God dwelling plentifully in all, they may worship Him in an acceptable manner, and through patience and comfort of the Scriptures may have hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.8</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Because these original tongues are not known to all the people of God, who have a right unto, and interest in the Scriptures, and are commanded in the fear of God to read, and search them, therefore they are to be translated into the vulgar language of every nation unto which they come, that the Word of God dwelling plentifully in all, they may worship Him in an acceptable manner, and through patience and comfort of the Scriptures may have hope.”

</figure><figure class="quote" id="q-da795d9398" data-kw="">
<blockquote><p>From all this it appears that the Romanists worship images in the same way that the heathen of old did, and pagans of our own day still do. They &quot;bow down to them and serve them.&quot; They pay them all the external homage which they render to the persons they are intended to represent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, p. 1946</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a> › <a href="../topics/worship/idolatry-and-images/images-icons-and-crucifixes.html">Images, icons and crucifixes</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“From all this it appears that the Romanists worship images in the same way that the heathen of old did, and pagans of our own day still do. They &quot;bow down to them and serve them.&quot; They pay them all the external homage which they render to the persons they are intended to represent.”

— Charles Hodge, Systematic Theology, p. 1946">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+all+this+it+appears+that+the+Romanists+worship+images+in+the+same+way+that+the+heathen+of+old+did%2C+and+pagans+of+our+own+day+still+do.+They+%22bow+down+to+them+and+serve+them.%22+They+pay+them+all+the+external+homage+which+they+render+to+the+persons+they+are+intended+to+represent.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+p.+1946&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda795d9398.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da795d9398.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-fe5f29ba12" data-kw="">
<blockquote><p>We complain that the whole doctrine of godliness is adulterated by impious dogmas; that the whole worship of God is vitiated by foul and disgraceful superstitions; that the pure institution of the sacraments has been supplanted by horrible sacrilege; that their use has been converted into a profane trafficking; that poor souls, which ought to have been ruled by the doctrine of Christ, are oppressed by cruel bondage; that nothing is seen in the Christian Church that is not deformed and debased; that the grace of Christ not only lies half-buried, but is partly torn to pieces, partly altogether extinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a> › <a href="../topics/worship/nature-of-worship/will-worship.html">Will-worship</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a></span></div>

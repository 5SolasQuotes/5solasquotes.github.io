<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. … Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

<blockquote><p>Whether Jews should be tolerated in the society of Christians? The horrendous judgments of God exercised upon the Jews on account of their ingratitude and incredulity were not only set forth long ago in the destruction of the city of Jerusalem, the slaughter of the whole nation and the destruction of the Mosaic Polity: but they also remain before our eyes to this very day. For we see them living dispersed among all nations throughout almost the entire world, subject to the empires of others hard and unjust, to be objects of contempt and scorn to all, and to be treated no otherwise than as slaves or chattels, as much by Christians as by Mahometans and other infidels: finally, not to be received by some and to be expelled by others who had already received them and tolerated them for a long time: in some places, they even barely redeem passage or safe conduct through provinces for the sake of making a journey with a great sum of money. Certainly, in previous centuries, they were excluded from all of France at once and together, no less than the Templars. Similarly, they are exiled from all of Britain. Rupert the Elder, Count Palatine, for I know not what reason, expelled the Jews not only from Heidelberg, but also from the entire Palatinate: and he donated their synagogue, which has now been converted into a Medical Auditorium, and most of the buildings to the Academy, which he founded not long after. And it is known what has been plotted against them in these recent years, partly in Frankfurt, partly in Worms. Nor are there lacking specious reasons by which it is usually persuaded that they are not to be tolerated: They are, they say, enemies of God and Christ, blasphemers. They are enemies of Christians, usurers, money-lenders, who afflict and suck dry the poor. They are also traitors who betray the secrets of Christians to the Turks and others of this kind. On the contrary, there are also found those who undertake the patronage of the Jews, and either tolerate them or receive them anew, or even persuade that they ought to be received and tolerated: but some are led by the hope of profit or gain which they receive from the Jews: others are impelled by a zeal for charity and their conversion. Therefore, so that it may be clear what ought to be decided or followed here, I shall submit an explanation of the problem constructed from the Word of God. I premise, however, two theorems, necessary to be observed. One, that the Jews ought to be considered by us in four ways. They are to be viewed: I. as men, participants of the same flesh and blood as we are, and sprung from the same parent, Adam. II. as descendants of Abraham, as the firstborn of the family of God. In which respect the apostle does not hesitate to call the Jews of his time, although senseless, rebellious and unbelieving, nevertheless ‘saints’: by reason of the fathers, that is, of the firstfruits and the root, from which the lump and the branches are considered sanctified. (Rom. 9:3-5; 11:16) III. as enemies of Christ and the true Church, blasphemers, infidels, money-lenders, usurers: for which reasons they are the offscourings [καθάρματα] of the world, and the public hatred of the whole orb. IV. That they are to be converted to the faith of Christ, according to the grace of predestination and the promise of the eternal Covenant, initiated with Abraham: and indeed [they are to be converted] in great number and multitude. Which conversion, as a mystery divinely revealed to him, the apostle proposes in Rom. 11, verse 25 and following, and confirms it clearly, partly by reasons, partly by the testimonies of the prophets. The other point: That those four modes of consideration ought to be viewed by us not separately, or individually one by one, but all of them conjunctively. When therefore it is asked, whether the Jews are to be tolerated among Christians, one must not judge separately from the third mode, in which they are said to be enemies of Christ, infidels, usurers, but one must pronounce simultaneously also from the others, and especially from the second and fourth: in which they are called the seed of Abraham, to be converted to Christ and to be brought back to the society of the Covenant. This is the reason: because the apostle speaks and judges of them in that way and no other. Rom. 11, verse 16, ‘For if the firstfruits are holy, the lump is also holy; and if the root is holy, so are the branches.’ Likewise verse 28: ‘they are enemies for your sake, but beloved for the sake of the fathers.’ According to these things we now answer affirmatively: namely, that the Jews are to be tolerated in the society of Christians. These are the reasons: First: Although God imposed upon them the punishment of dispersion, so that without a king, scepter and civil law they live scattered among other nations throughout almost the whole world: yet He preserves them wonderfully, nay even miraculously, so that they are not destroyed, nor can they be destroyed, although it has been attempted by many: nor are they even confounded with other nations, in rites, ceremonies, marriages, and the custom of their whole life. And as Cain was marked divinely with a sign, lest he should be killed by those he met on account of fratricide: so the Jews seem to be marked by God on their faces and foreheads, on account of the slaughter of Christ the firstborn, so that they can be recognized almost at first glance, lest they be killed. Therefore, those who do not wish to tolerate the Jews seem to oppose the counsel of God. Second: The dispersion of the Jews throughout the Christian world is useful to us Christians: and that in two ways: I. On account of the spectacle of the severity and wrath of God, which ought to be kept perpetually before our eyes. For they are shown to us as branches broken off on account of unbelief, so that through faith we may learn to remain in the true olive tree, Rom. 11:22 ff. II. On account of the testimony of sound doctrine, which they carry about in the Scriptures of the O.T.: so that the Church may everywhere find witnesses of the Christian religion, as Augustine teaches, Of the City of God, bk. 18, ch. 46. And this testimony is so much the firmer because it is borne to the doctrine by the very enemies, and indeed sworn ones, of it. Therefore the fathers called the Jews the librarians of the Christians, enemies in their hearts, witnesses in their books. Hence, lest we be an obstacle to ourselves, we ought to bear with the Jews in our society. Third, from the examples of the apostles: Peter and Paul showed the highest charity to those very Jews who had driven the Lord Jesus to the cross although they had heard his doctrine with their own ears and had beheld his miracles with their own eyes; and who, having corrupted the witnesses of his glorious resurrection with money, were even much more detestable than the Jews of today; and they did not hesitate to seek and procure their conversion by all means, even at the expense of their own safety: so far were they from being unwilling to tolerate them, Acts 2-3; Rom. 9. Therefore it is much more fitting for us to do the same regarding the Jews of today. Fourth: The Jews, according to the doctrine of the apostle, Rom. 11, are again to be converted to Christ and to faith in Him. But since this cannot be done by infidels, who themselves are ignorant of Christ and do not receive Him, but must be done by the ministry of Christians and the faithful, they certainly ought to dwell and converse among them. Fifth: The Apostle teaches that not only are the Jews to be converted in the greatest number, but also the manner of conversion: which he establishes in this, that they be provoked to emulation, Rom. 11:11, that is, that by the example of the faithful from the gentiles, they themselves also may desire and embrace the grace of Christ. If the Jews are to be provoked to emulation by us, by our example, they certainly ought to be tolerated by us and to dwell among us. From this, however, we further gather two things: I. That the Jews ought to dwell among Evangelicals and Orthodox rather than among Papists. Reason: because the latter are less fit to excite emulation in them: since they are idolaters, whom they [the Jews] turn away from and execrate with their whole heart. II. That conversion of all Israel, or of the Jews in the greatest number, of which the apostle prophesies in Rom. 11, will without doubt follow immediately upon the ruin of the Papacy, and the destruction of the city of Rome, since Papism is the chief obstacle and greatest impediment to the conversion of the Jews to Christianity, which they almost measure by that idolatrous Papism. Sixth. If all Christian magistrates were to exclude the Jews from the society of Christians, and would no longer tolerate them; they would certainly have to be relegated to the Garamantes and Indians, to the Caribs and Cannibals, so that they might spend their lives among them. But in that way, it would surely be poorly provided for them regarding teachers, who might show them the way to find the Messiah whom they seek. We conclude, therefore, that the Jews are to be tolerated among Christians. Furthermore, since it is acknowledged that the Jews, according to the third consideration are not only infidels, but also blasphemers against Christ, enemies of Christians, and most iniquitous usurers, their toleration must be circumscribed by certain conditions as if by certain laws. Here, therefore, some things must be avoided and shunned by Christian magistrates, and other things, on the contrary, must be done: Those things must be avoided which, on account of usury and participation in it, [countries] either admit or tolerate Jews—which, alas, is excessively common today in Germany and elsewhere. Furthermore, these things must be done and cared for by Christian magistrates: I. That the Jews in their synagogues and sacred assemblies should only read the Holy books of the Old Testament and call upon the God of their fathers, the God of Abraham, Isaac, and Jacob according to the Scripture of the Old Testament. II. That they should take care that they be instructed in the Christian religion and taught about it: indeed, that they even compel them to attend the sacred sermons of the Christians from time to time. For otherwise they can neither be provoked to emulation nor converted to the faith of Christ. And the neglect of this admonition is perhaps the primary reason why so few Jews are converted today. III. That they also accustom and lead them to honest labors and honest crafts: so that they may thus be able to sustain life honestly, even without usury. IV. That they provide them with the security and defense due to all citizens living according to the Laws: and that they do not allow them to be vexed with impunity by the injuries of private individuals, whether publicly or privately. Which is also, alas, too much in use! It is, however, against the apostle, who gravely forbids us Christians from injuries, insults and contempt of the Jews. V. That they ensure that the Jews are distinguished from Christians by their dress or by some certain sign, so that no one through ignorance may associate with them just as they would with Christians. In sum, Christian princes and magistrates who have received or are receiving Jews into their protection, shall show, both in these and in all other things, that they are moved to that [protection] by nothing other than holy charity and a desire to procure their salvation: and therefore they will permit them nothing that is in itself illicit: they will take care that they be instructed in the Christian faith and truth: so that they may thus be able to be salutary instruments in that work which God promised He would do through the prophet Isaiah and the apostle Paul. This much concerning the problem itself.</p></blockquote>

— Henry Alting, The Scriptural Theology of Heidelberg, vol. 2, containing Theological Problems… (Amsterdam: Janssonius, 1646), Practical Problems, Problem 21, ‘Whether Jews in the society of Christians ought to be tolerated? [Yes]’, pp. 340-48 tr. AI by The Faith Received Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+Jews+should+be+tolerated+in+the+society+of+Christians%3F+The+horrendous+judgments+of+God+exercised+upon+the+Jews+on+account+of+their+ingratitude+and+incredulity+were+not+only+set+forth+long+ago+in+the+destruction+of+the+city+of+Jerusalem%2C+the+slaughter+of+the+whole+nation+and+the+destruction+of+the+Mosaic+Polity%3A+but+they+also+remain+before+our+eyes+to+this+very+day.+For+we+see+them+living+dispersed+among+all+nations+throughout+almost+the+entire+world%2C+subject+to+the+empires+of+others+hard+and+unjust%2C+to+be+objects+of+contempt+and+scorn+to+all%2C+and+to+be+treated+no+otherwise+than+as+slaves+or+chattels%2C+as+much+by+Christians+as+by+Mahometans+and+other+infidels%3A+finally%2C+not+to+be+received+by+some+and+to+be+expelled+by+others+who+had+already+received+them+and+tolerated+them+for+a+long+time%3A+in+some+places%2C+they+even+barely+redeem+passage+or+safe+conduct+through+provinces+for+the+sake+of+making+a+journey+with+a+great+sum+of+money.+Certainly%2C+in+previous+centuries%2C+they+were+excluded+from+all+of+France+at+once+and+together%2C+no+less+than+the+Templars.+Similarly%2C+they+are+exiled+from+all+of+Britain.+Rupert+the+Elder%2C+Count+Palatine%2C+for+I+know+not+what+reason%2C+expelled+the+Jews+not+only+from+Heidelberg%2C+but+also+from+the+entire+Palatinate%3A+and+he+donated+their+synagogue%2C+which+has+now+been+converted+into+a+Medical+Auditorium%2C+and+most+of+the+buildings+to+the+Academy%2C+which+he+founded+not+long+after.+And+it+is+known+what+has+been+plotted+against+them+in+these+recent+years%2C+partly+in+Frankfurt%2C+partly+in+Worms.+Nor+are+there+lacking+specious+reasons+by+which+it+is+usually+persuaded+that+they+are+not+to+be+tolerated%3A+They+are%2C+they+say%2C+enemies+of+God+and+Christ%2C+blasphemers.+They+are+enemies+of+Christians%2C+usurers%2C+money-lenders%2C+who+afflict+and+suck+dry+the+poor.+They+are+also+traitors+who+betray+the+secrets+of+Christians+to+the+Turks+and+others+of+this+kind.+On+the+contrary%2C+there+are+also+found+those+who+undertake+the+patronage+of+the+Jews%2C+and+either+tolerate+them+or+receive+them+anew%2C+or+even+persuade+that+they+ought+to+be+received+and+tolerated%3A+but+some+are+led+by+the+hope+of+profit+or+gain+which+they+receive+from+the+Jews%3A+others+are+impelled+by+a+zeal+for+charity+and+their+conversion.+Therefore%2C+so+that+it+may+be+clear+what+ought+to+be+decided+or+followed+here%2C+I+shall+submit+an+explanation+of+the+problem+constructed+from+the+Word+of+God.+I+premise%2C+however%2C+two+theorems%2C+necessary+to+be+observed.+One%2C+that+the+Jews+ought+to+be+considered+by+us+in+four+ways.+They+are+to+be+viewed%3A+I.+as+men%2C+participants+of+the+same+flesh+and+blood+as+we+are%2C+and+sprung+from+the+same+parent%2C+Adam.+II.+as+descendants+of+Abraham%2C+as+the+firstborn+of+the+family+of+God.+In+which+respect+the+apostle+does+not+hesitate+to+call+the+Jews+of+his+time%2C+although+senseless%2C+rebellious+and+unbelieving%2C+nevertheless+%E2%80%98saints%E2%80%99%3A+by+reason+of+the+fathers%2C+that+is%2C+of+the+firstfruits+and+the+root%2C+from+which+the+lump+and+the+branches+are+considered+sanctified.+%28Rom.+9%3A3-5%3B+11%3A16%29+III.+as+enemies+of+Christ+and+the+true+Church%2C+blasphemers%2C+infidels%2C+money-lenders%2C+usurers%3A+for+which+reasons+they+are+the+offscourings+%5B%CE%BA%CE%B1%CE%B8%CE%AC%CF%81%CE%BC%CE%B1%CF%84%CE%B1%5D+of+the+world%2C+and+the+public+hatred+of+the+whole+orb.+IV.+That+they+are+to+be+converted+to+the+faith+of+Christ%2C+according+to+the+grace+of+predestination+and+the+promise+of+the+eternal+Covenant%2C+initiated+with+Abraham%3A+and+indeed+%5Bthey+are+to+be+converted%5D+in+great+number+and+multitude.+Which+conversion%2C+as+a+mystery+divinely+revealed+to+him%2C+the+apostle+proposes+in+Rom.+11%2C+verse+25+and+following%2C+and+confirms+it+clearly%2C+partly+by+reasons%2C+partly+by+the+testimonies+of+the+prophets.+The+other+point%3A+That+those+four+modes+of+consideration+ought+to+be+viewed+by+us+not+separately%2C+or+individually+one+by+one%2C+but+all+of+them+conjunctively.+When+therefore+it+is+asked%2C+whether+the+Jews+are+to+be+tolerated+among+Christians%2C+one+must+not+judge+separately+from+the+third+mode%2C+in+which+they+are+said+to+be+enemies+of+Christ%2C+infidels%2C+usurers%2C+but+one+must+pronounce+simultaneously+also+from+the+others%2C+and+especially+from+the+second+and+fourth%3A+in+which+they+are+called+the+seed+of+Abraham%2C+to+be+converted+to+Christ+and+to+be+brought+back+to+the+society+of+the+Covenant.+This+is+the+reason%3A+because+the+apostle+speaks+and+judges+of+them+in+that+way+and+no+other.+Rom.+11%2C+verse+16%2C+%E2%80%98For+if+the+firstfruits+are+holy%2C+the+lump+is+also+holy%3B+and+if+the+root+is+holy%2C+so+are+the+branches.%E2%80%99+Likewise+verse+28%3A+%E2%80%98they+are+enemies+for+your+sake%2C+but+beloved+for+the+sake+of+the+fathers.%E2%80%99+According+to+these+things+we+now+answer+affirmatively%3A+namely%2C+that+the+Jews+are+to+be+tolerated+in+the+society+of+Christians.+These+are+the+reasons%3A+First%3A+Although+God+imposed+upon+them+the+punishment+of+dispersion%2C+so+that+without+a+king%2C+scepter+and+civil+law+they+live+scattered+among+other+nations+throughout+almost+the+whole+world%3A+yet+He+preserves+them+wonderfully%2C+nay+even+miraculously%2C+so+that+they+are+not+destroyed%2C+nor+can+they+be+destroyed%2C+although+it+has+been+attempted+by+many%3A+nor+are+they+even+confounded+with+other+nations%2C+in+rites%2C+ceremonies%2C+marriages%2C+and+the+custom+of+their+whole+life.+And+as+Cain+was+marked+divinely+with+a+sign%2C+lest+he+should+be+killed+by+those+he+met+on+account+of+fratricide%3A+so+the+Jews+seem+to+be+marked+by+God+on+their+faces+and+foreheads%2C+on+account+of+the+slaughter+of+Christ+the+firstborn%2C+so+that+they+can+be+recognized+almost+at+first+glance%2C+lest+they+be+killed.+Therefore%2C+those+who+do+not+wish+to+tolerate+the+Jews+seem+to+oppose+the+counsel+of+God.+Second%3A+The+dispersion+of+the+Jews+throughout+the+Christian+world+is+useful+to+us+Christians%3A+and+that+in+two+ways%3A+I.+On+account+of+the+spectacle+of+the+severity+and+wrath+of+God%2C+which+ought+to+be+kept+perpetually+before+our+eyes.+For+they+are+shown+to+us+as+branches+broken+off+on+account+of+unbelief%2C+so+that+through+faith+we+may+learn+to+remain+in+the+true+olive+tree%2C+Rom.+11%3A22+ff.+II.+On+account+of+the+testimony+of+sound+doctrine%2C+which+they+carry+about+in+the+Scriptures+of+the+O.T.%3A+so+that+the+Church+may+everywhere+find+witnesses+of+the+Christian+religion%2C+as+Augustine+teaches%2C+Of+the+City+of+God%2C+bk.+18%2C+ch.+46.+And+this+testimony+is+so+much+the+firmer+because+it+is+borne+to+the+doctrine+by+the+very+enemies%2C+and+indeed+sworn+ones%2C+of+it.+Therefore+the+fathers+called+the+Jews+the+librarians+of+the+Christians%2C+enemies+in+their+hearts%2C+witnesses+in+their+books.+Hence%2C+lest+we+be+an+obstacle+to+ourselves%2C+we+ought+to+bear+with+the+Jews+in+our+society.+Third%2C+from+the+examples+of+the+apostles%3A+Peter+and+Paul+showed+the+highest+charity+to+those+very+Jews+who+had+driven+the+Lord+Jesus+to+the+cross+although+they+had+heard+his+doctrine+with+their+own+ears+and+had+beheld+his+miracles+with+their+own+eyes%3B+and+who%2C+having+corrupted+the+witnesses+of+his+glorious+resurrection+with+money%2C+were+even+much+more+detestable+than+the+Jews+of+today%3B+and+they+did+not+hesitate+to+seek+and+procure+their+conversion+by+all+means%2C+even+at+the+expense+of+their+own+safety%3A+so+far+were+they+from+being+unwilling+to+tolerate+them%2C+Acts+2-3%3B+Rom.+9.+Therefore+it+is+much+more+fitting+for+us+to+do+the+same+regarding+the+Jews+of+today.+Fourth%3A+The+Jews%2C+according+to+the+doctrine+of+the+apostle%2C+Rom.+11%2C+are+again+to+be+converted+to+Christ+and+to+faith+in+Him.+But+since+this+cannot+be+done+by+infidels%2C+who+themselves+are+ignorant+of+Christ+and+do+not+receive+Him%2C+but+must+be+done+by+the+ministry+of+Christians+and+the+faithful%2C+they+certainly+ought+to+dwell+and+converse+among+them.+Fifth%3A+The+Apostle+teaches+that+not+only+are+the+Jews+to+be+converted+in+the+greatest+number%2C+but+also+the+manner+of+conversion%3A+which+he+establishes+in+this%2C+that+they+be+provoked+to+emulation%2C+Rom.+11%3A11%2C+that+is%2C+that+by+the+example+of+the+faithful+from+the+gentiles%2C+they+themselves+also+may+desire+and+embrace+the+grace+of+Christ.+If+the+Jews+are+to+be+provoked+to+emulation+by+us%2C+by+our+example%2C+they+certainly+ought+to+be+tolerated+by+us+and+to+dwell+among+us.+From+this%2C+however%2C+we+further+gather+two+things%3A+I.+That+the+Jews+ought+to+dwell+among+Evangelicals+and+Orthodox+rather+than+among+Papists.+Reason%3A+because+the+latter+are+less+fit+to+excite+emulation+in+them%3A+since+they+are+idolaters%2C+whom+they+%5Bthe+Jews%5D+turn+away+from+and+execrate+with+their+whole+heart.+II.+That+conversion+of+all+Israel%2C+or+of+the+Jews+in+the+greatest+number%2C+of+which+the+apostle+prophesies+in+Rom.+11%2C+will+without+doubt+follow+immediately+upon+the+ruin+of+the+Papacy%2C+and+the+destruction+of+the+city+of+Rome%2C+since+Papism+is+the+chief+obstacle+and+greatest+impediment+to+the+conversion+of+the+Jews+to+Christianity%2C+which+they+almost+measure+by+that+idolatrous+Papism.+Sixth.+If+all+Christian+magistrates+were+to+exclude+the+Jews+from+the+society+of+Christians%2C+and+would+no+longer+tolerate+them%3B+they+would+certainly+have+to+be+relegated+to+the+Garamantes+and+Indians%2C+to+the+Caribs+and+Cannibals%2C+so+that+they+might+spend+their+lives+among+them.+But+in+that+way%2C+it+would+surely+be+poorly+provided+for+them+regarding+teachers%2C+who+might+show+them+the+way+to+find+the+Messiah+whom+they+seek.+We+conclude%2C+therefore%2C+that+the+Jews+are+to+be+tolerated+among+Christians.+Furthermore%2C+since+it+is+acknowledged+that+the+Jews%2C+according+to+the+third+consideration+are+not+only+infidels%2C+but+also+blasphemers+against+Christ%2C+enemies+of+Christians%2C+and+most+iniquitous+usurers%2C+their+toleration+must+be+circumscribed+by+certain+conditions+as+if+by+certain+laws.+Here%2C+therefore%2C+some+things+must+be+avoided+and+shunned+by+Christian+magistrates%2C+and+other+things%2C+on+the+contrary%2C+must+be+done%3A+Those+things+must+be+avoided+which%2C+on+account+of+usury+and+participation+in+it%2C+%5Bcountries%5D+either+admit+or+tolerate+Jews%E2%80%94which%2C+alas%2C+is+excessively+common+today+in+Germany+and+elsewhere.+Furthermore%2C+these+things+must+be+done+and+cared+for+by+Christian+magistrates%3A+I.+That+the+Jews+in+their+synagogues+and+sacred+assemblies+should+only+read+the+Holy+books+of+the+Old+Testament+and+call+upon+the+God+of+their+fathers%2C+the+God+of+Abraham%2C+Isaac%2C+and+Jacob+according+to+the+Scripture+of+the+Old+Testament.+II.+That+they+should+take+care+that+they+be+instructed+in+the+Christian+religion+and+taught+about+it%3A+indeed%2C+that+they+even+compel+them+to+attend+the+sacred+sermons+of+the+Christians+from+time+to+time.+For+otherwise+they+can+neither+be+provoked+to+emulation+nor+converted+to+the+faith+of+Christ.+And+the+neglect+of+this+admonition+is+perhaps+the+primary+reason+why+so+few+Jews+are+converted+today.+III.+That+they+also+accustom+and+lead+them+to+honest+labors+and+honest+crafts%3A+so+that+they+may+thus+be+able+to+sustain+life+honestly%2C+even+without+usury.+IV.+That+they+provide+them+with+the+security+and+defense+due+to+all+citizens+living+according+to+the+Laws%3A+and+that+they+do+not+allow+them+to+be+vexed+with+impunity+by+the+injuries+of+private+individuals%2C+whether+publicly+or+privately.+Which+is+also%2C+alas%2C+too+much+in+use%21+It+is%2C+however%2C+against+the+apostle%2C+who+gravely+forbids+us+Christians+from+injuries%2C+insults+and+contempt+of+the+Jews.+V.+That+they+ensure+that+the+Jews+are+distinguished+from+Christians+by+their+dress+or+by+some+certain+sign%2C+so+that+no+one+through+ignorance+may+associate+with+them+just+as+they+would+with+Christians.+In+sum%2C+Christian+princes+and+magistrates+who+have+received+or+are+receiving+Jews+into+their+protection%2C+shall+show%2C+both+in+these+and+in+all+other+things%2C+that+they+are+moved+to+that+%5Bprotection%5D+by+nothing+other+than+holy+charity+and+a+desire+to+procure+their+salvation%3A+and+therefore+they+will+permit+them+nothing+that+is+in+itself+illicit%3A+they+will+take+care+that+they+be+instructed+in+the+Christian+faith+and+truth%3A+so+that+they+may+thus+be+able+to+be+salutary+instruments+in+that+work+which+God+promised+He+would+do+through+the+prophet+Isaiah+and+the+apostle+Paul.+This+much+concerning+the+problem+itself.%E2%80%9D%0A%0A%E2%80%94+Henry+Alting%2C+The+Scriptural+Theology+of+Heidelberg%2C+vol.+2%2C+containing+Theological+Problems%E2%80%A6+%28Amsterdam%3A+Janssonius%2C+1646%29%2C+Practical+Problems%2C+Problem+21%2C+%E2%80%98Whether+Jews+in+the+society+of+Christians+ought+to+be+tolerated%3F+%5BYes%5D%E2%80%99%2C+pp.+340-48+tr.+AI+by+The+Faith+Received+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdfc42680f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dfc42680f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Whether%20Jews%20should%20be%20tolerated%20in,This%20much%20concerning%20the%20problem%20itself&amp;text=Whether%20Jews%20should%20be%20tolerated%20in%20the%20society&amp;text=apostle%20Paul.%20This%20much%20concerning%20the%20problem%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is reported, as some write, that up to a hundred thousand men and women of both sexes migrated to the Turks in those times. Moreover, it is handed down to memory that the Turkish Emperor was accustomed to say that he marveled at the stupidity of Christian kings, in that they preferred to expel such a great multitude—whom, if they did not wish to kill, they could nevertheless have retained in the place of slaves to perform useful and suitable services—rather than retain them for their own profit, according to the Horatian precept: When you can sell a captive, do not kill him; he will serve usefully.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/balthasar-meisner.html">Balthasar Meisner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober Philosophy, that is, a Pious Consideration of Philosophical Questions occasionally arising in theological controversies, which the Calvinists have raised against the Orthodox</cite>, (1623), pt. 3, sect. 2, Political Questions, ch. 2, On the Magistrate &amp; his Office, Question 4, Should Jews be tolerated in a Christian Republic, and how? tr. AI by The Faith Received | “Whether and how Jews are to be tolerated in a Christian republic? When a deliberation is instituted concerning the Jews, two extremes in particular must be studiously avoided: The one is rash expulsion; the other is licentious toleration. For they are neither to be expelled indiscriminately, nor are they to be tolerated without limit; both of which must be declared further in a few words: | 1. That they are not to be universally and indiscriminately proscribed and driven out from the Christian world, some suppose can be persuaded by the following arguments: | 6. On account of the inconvenience; because if the Jews find no hospitality among us, they will flock in crowds to the Turks, and will assist our enemies partly with money, and partly with their counsels and artifices. Philippus Camerarius treats this question in Century 1, Medit. Histor., ch. 89, where, among other things, he writes thus:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is reported, as some write, that up to a hundred thousand men and women of both sexes migrated to the Turks in those times. Moreover, it is handed down to memory that the Turkish Emperor was accustomed to say that he marveled at the stupidity of Christian kings, in that they preferred to expel such a great multitude—whom, if they did not wish to kill, they could nevertheless have retained in the place of slaves to perform useful and suitable services—rather than retain them for their own profit, according to the Horatian precept: When you can sell a captive, do not kill him; he will serve usefully.”

<blockquote><p>I piously and gladly believe the perpetual virginity of Mary unto death (hear, impostor); yet this pertains nothing to our mystery of salvation. It suffices for us to believe what is, and is narrated by the evangelists, that our Savior was conceived by the Holy Spirit and born of the Virgin Mary.” ‘Preface’ to the New Testament to the most illustrious Prince of Condé, etc. If one who speaks thus dared to thrust his most unclean snout into Mary’s virginity, what shall I say of the great Basil, who in the homily on the Nativity of the Lord says, whether after the mystery of the incarnation the Virgin bore children or not, παρὰ ταῦτα δὲ οὐδὲν δοξάζομεν πᾶσι, it in no wise injures the business of piety. For so long as it was necessary to serve the dispensation, virginity was necessary. “But what afterwards followed,” he says, “σιωπῇ παραδοτέον τοῖς λόγῳ οὐ μυστήρια καταλείψομεν [we shall leave in silence to those who speak the mysteries which cannot be expressed in words], nor is it necessary to inquire anxiously into what pertains to the nature of this mystery.</p></blockquote>

<blockquote><p>Whether a prince or magistrate may tolerate Jews in his city or province? Three things may be considered in the Jews. First, the sect and Jewish exercise. Second, usury. Third, hatred toward Christians. All these are evil and prohibited. The question is therefore whether a prince or magistrate may permit or tolerate these evils; and what may be a legitimate cause for permitting and tolerating them? I answer through the following conclusions: First Conclusion. A magistrate may permit the rites and exercises of the Jews if a sufficient cause is present. The Pope of Rome does this, as do many princes in their provinces. The cause may be threefold. First, that through Jewish rites the Christian truth may be shadowed forth and confirmed: St. Augustine, Of the City of God, bk. 18, ch. 46 and St. Thomas in pt. 2 of 2, quest. 10, art. 11, approve this cause. Second, that Jews who practice their rites and understand from the Christians among whom they dwell that those rites were merely shadows and figures of the Christian religion may more easily be converted to the Faith of Christ. St. Thomas, in the cited place, also approves this. Third, that Christian princes or magistrates, under the pretext of permission, may receive money and other gifts from the Jews to whom they permit the exercise. This is not lawful. For public sins, by which God is offended, cannot be permitted for the sake of temporal gain alone, which is hoped for from the permission. Second Conclusion. A magistrate may permit the usuries of the Jews if a sufficient cause is present. The Pope and other Christian princes also do this. The cause may be twofold. One, to prevent a greater evil. For if, as I said above, usuries were not permitted, many thefts, robberies, oppressions of the poor and similar inconveniences would occur. Therefore, to avoid these evils, usuries may be permitted as a lesser evil. The other, that Christian princes and magistrates who permit the usuries of the Jews may be participants in the profit. This is not lawful. For it is certain that usury is prohibited by natural and divine law; and the profit that is acquired through usury is mere theft. Just as, therefore, the Jews sin against justice by receiving usurious profit, so do the Christians who are participants in that profit. They are considered to be participants, however, when they permit usuries for the purpose of being able to receive profit therefrom. This conclusion must be limited in two ways: First, that common usuries may be permitted which do not exceed the profit permitted by law and custom, but not exorbitant usuries, of which I shall speak shortly. Second, that a Christian magistrate may not receive profit from usuries on account of the mere permission of usuries: although they may receive it under another title. And indeed under a double title: First, the title of punishment; because he may punish the Jews on account of usuries; and the profit that has been unjustly acquired from usuries he may either restore to its owners or convert to public utility. Then, the title of exaction; because he may exact an annual tribute or tax from the Jews, not by reason of the permission of usuries, but by reason of the granted habitation in a Christian place. Third Conclusion. A Christian magistrate or prince cannot with a good conscience permit or leave unpunished the hatred of Jews toward Christians. Note: Hatred is twofold: The one is internal; because since it is hidden, the magistrate cannot punish it. The other is external, which breaks out into open injury. This ought to be coerced by the magistrate. We say, therefore, that such hatred, when it is exercised by Jews against Christians, can in no way be permitted or tolerated, but must be severely punished: and the prince sins gravely if he does not punish those who commit offenses. The reason is that a prince is bound by his office to punish every public injury, if he is able, so that justice may be preserved: therefore, he is also bound to punish the injury which the Jews commit against Christians. This is, indeed, manifold: First, because they exact immoderate and intolerable usury from citizens, country folk, and the poor. Whatever they exact beyond the principal is theft. Therefore, they commit intolerable theft. Second, by exacting such usury, they harm the republic or the community greatly. For a republic cannot stand or flourish when the people are oppressed and exhausted by usury. Third, besides usury, another injury is added. For whatever is for sale in the market, the Jews snatch away from the Christians by offering a higher price to the sellers than other buyers are accustomed to offer; and afterwards, which is most iniquitous, Christians are forced to pay double the price to the Jews if they wish to buy what is necessary for feeding their families. Fourth, so that they may do all these things with impunity, they distribute gifts to the officials of princes so that they may be protected by them. Fifth, from this it happens that the people, who bear such injuries with difficulty, become prone to inciting sedition, both against the Jews themselves and against their defenders and patrons. Against the Jews, indeed, because they are thieves and plunderers; against the patrons, because they are partners of thieves and plunderers. If a prince or magistrate does not prevent or punish these great evils (to say nothing of the rest), he is a participant in the crime and is bound to restitution. He can, however, prevent them in three ways. First, if he expels the Jews entirely from his province or city. Second, if he does not indeed expel them, but forces them to agriculture, or to mechanical arts, or to exercise other works; and does not allow them to live in idleness and luxury, as they now live. Third, if he deprives them of all the money and wealth which they have received through usury. Would that these things were brought into practice. You will say, if the Jews are either expelled or do not accept usury, two inconveniences will follow: First, because Christian princes in time of necessity will not have money for war. For they are accustomed to seek this from the Jews. Then, the subjects of the princes, who are in need of money, will not be able to borrow. I respond: The contrary follows: First, because once the Jews are expelled, the citizens will be able to contribute more support than the Jews are accustomed to. For whatever the Jews contribute, they receive from the citizens through unjust usury. And not only this, but also whatever is necessary for them to sustain their lives. Therefore, they take two portions from the citizens: one, which they give to the prince; the other, by which they live. Certainly, if the Jews were expelled, the citizens would be prepared to give either both portions to their prince, or at least no less than they give to the Jews. Next, the subjects of princes are in greater need of money when the Jews are present than when they are absent. For when they are present and demanding intolerable usury, they are completely drained. If they were absent, or at least did not demand such immoderate usury, the subjects would be less drained, and consequently would be in less need of money. Our Adam Contzen has written extensively on this subject in his Politics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-becanus.html">Martin Becanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Manual of Controversies of this Time</cite>, (Wurzburg, 1623), bk. 5, ch. 18, ‘Is a prince or magistrate able to tolerate Jews in his city or province?’ tr. AI by The Faith Received Becanus (1563–1624) was a Dutch-born, Roman Catholic, Jesuit priest, known as a theologian and controversialist.</span></figcaption>

ill say, if the Jews are either expelled or do not accept usury, two inconveniences will follow: First, because Christian princes in time of necessity will not have money for war. For they are accustomed to seek this from the Jews. Then, the subjects of the princes, who are in need of money, will not be able to borrow. I respond: The contrary follows: First, because once the Jews are expelled, the citizens will be able to contribute more support than the Jews are accustomed to. For whatever the Jews contribute, they receive from the citizens through unjust usury. And not only this, but also whatever is necessary for them to sustain their lives. Therefore, they take two portions from the citizens: one, which they give to the prince; the other, by which they live. Certainly, if the Jews were expelled, the citizens would be prepared to give either both portions to their prince, or at least no less than they give to the Jews. Next, the subjects of princes are in greater need of money when the Jews are present than when they are absent. For when they are present and demanding intolerable usury, they are completely drained. If they were absent, or at least did not demand such immoderate usury, the subjects would be less drained, and consequently would be in less need of money. Our Adam Contzen has written extensively on this subject in his Politics.”

— Martin Becanus, Manual of Controversies of this Time (Wurzburg, 1623), bk. 5, ch. 18, ‘Is a prince or magistrate able to tolerate Jews in his city or province?’ tr. AI by The Faith Received Becanus (1563–1624) was a Dutch-born, Roman Catholic, Jesuit priest, known as a theologian and controversialist.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+a+prince+or+magistrate+may+tolerate+Jews+in+his+city+or+province%3F+Three+things+may+be+considered+in+the+Jews.+First%2C+the+sect+and+Jewish+exercise.+Second%2C+usury.+Third%2C+hatred+toward+Christians.+All+these+are+evil+and+prohibited.+The+question+is+therefore+whether+a+prince+or+magistrate+may+permit+or+tolerate+these+evils%3B+and+what+may+be+a+legitimate+cause+for+permitting+and+tolerating+them%3F+I+answer+through+the+following+conclusions%3A+First+Conclusion.+A+magistrate+may+permit+the+rites+and+exercises+of+the+Jews+if+a+sufficient+cause+is+present.+The+Pope+of+Rome+does+this%2C+as+do+many+princes+in+their+provinces.+The+cause+may+be+threefold.+First%2C+that+through+Jewish+rites+the+Christian+truth+may+be+shadowed+forth+and+confirmed%3A+St.+Augustine%2C+Of+the+City+of+God%2C+bk.+18%2C+ch.+46+and+St.+Thomas+in+pt.+2+of+2%2C+quest.+10%2C+art.+11%2C+approve+this+cause.+Second%2C+that+Jews+who+practice+their+rites+and+understand+from+the+Christians+among+whom+they+dwell+that+those+rites+were+merely+shadows+and+figures+of+the+Christian+religion+may+more+easily+be+converted+to+the+Faith+of+Christ.+St.+Thomas%2C+in+the+cited+place%2C+also+approves+this.+Third%2C+that+Christian+princes+or+magistrates%2C+under+the+pretext+of+permission%2C+may+receive+money+and+other+gifts+from+the+Jews+to+whom+they+permit+the+exercise.+This+is+not+lawful.+For+public+sins%2C+by+which+God+is+offended%2C+cannot+be+permitted+for+the+sake+of+temporal+gain+alone%2C+which+is+hoped+for+from+the+permission.+Second+Conclusion.+A+magistrate+may+permit+the+usuries+of+the+Jews+if+a+sufficient+cause+is+present.+The+Pope+and+other+Christian+princes+also+do+this.+The+cause+may+be+twofold.+One%2C+to+prevent+a+greater+evil.+For+if%2C+as+I+said+above%2C+usuries+were+not+permitted%2C+many+thefts%2C+robberies%2C+oppressions+of+the+poor+and+similar+inconveniences+would+occur.+Therefore%2C+to+avoid+these+evils%2C+usuries+may+be+permitted+as+a+lesser+evil.+The+other%2C+that+Christian+princes+and+magistrates+who+permit+the+usuries+of+the+Jews+may+be+participants+in+the+profit.+This+is+not+lawful.+For+it+is+certain+that+usury+is+prohibited+by+natural+and+divine+law%3B+and+the+profit+that+is+acquired+through+usury+is+mere+theft.+Just+as%2C+therefore%2C+the+Jews+sin+against+justice+by+receiving+usurious+profit%2C+so+do+the+Christians+who+are+participants+in+that+profit.+They+are+considered+to+be+participants%2C+however%2C+when+they+permit+usuries+for+the+purpose+of+being+able+to+receive+profit+therefrom.+This+conclusion+must+be+limited+in+two+ways%3A+First%2C+that+common+usuries+may+be+permitted+which+do+not+exceed+the+profit+permitted+by+law+and+custom%2C+but+not+exorbitant+usuries%2C+of+which+I+shall+speak+shortly.+Second%2C+that+a+Christian+magistrate+may+not+receive+profit+from+usuries+on+account+of+the+mere+permission+of+usuries%3A+although+they+may+receive+it+under+another+title.+And+indeed+under+a+double+title%3A+First%2C+the+title+of+punishment%3B+because+he+may+punish+the+Jews+on+account+of+usuries%3B+and+the+profit+that+has+been+unjustly+acquired+from+usuries+he+may+either+restore+to+its+owners+or+convert+to+public+utility.+Then%2C+the+title+of+exaction%3B+because+he+may+exact+an+annual+tribute+or+tax+from+the+Jews%2C+not+by+reason+of+the+permission+of+usuries%2C+but+by+reason+of+the+granted+habitation+in+a+Christian+place.+Third+Conclusion.+A+Christian+magistrate+or+prince+cannot+with+a+good+conscience+permit+or+leave+unpunished+the+hatred+of+Jews+toward+Christians.+Note%3A+Hatred+is+twofold%3A+The+one+is+internal%3B+because+since+it+is+hidden%2C+the+magistrate+cannot+punish+it.+The+other+is+external%2C+which+breaks+out+into+open+injury.+This+ought+to+be+coerced+by+the+magistrate.+We+say%2C+therefore%2C+that+such+hatred%2C+when+it+is+exercised+by+Jews+against+Christians%2C+can+in+no+way+be+permitted+or+tolerated%2C+but+must+be+severely+punished%3A+and+the+prince+sins+gravely+if+he+does+not+punish+those+who+commit+offenses.+The+reason+is+that+a+prince+is+bound+by+his+office+to+punish+every+public+injury%2C+if+he+is+able%2C+so+that+justice+may+be+preserved%3A+therefore%2C+he+is+also+bound+to+punish+the+injury+which+the+Jews+commit+against+Christians.+This+is%2C+indeed%2C+manifold%3A+First%2C+because+they+exact+immoderate+and+intolerable+usury+from+citizens%2C+country+folk%2C+and+the+poor.+Whatever+they+exact+beyond+the+principal+is+theft.+Therefore%2C+they+commit+intolerable+theft.+Second%2C+by+exacting+such+usury%2C+they+harm+the+republic+or+the+community+greatly.+For+a+republic+cannot+stand+or+flourish+when+the+people+are+oppressed+and+exhausted+by+usury.+Third%2C+besides+usury%2C+another+injury+is+added.+For+whatever+is+for+sale+in+the+market%2C+the+Jews+snatch+away+from+the+Christians+by+offering+a+higher+price+to+the+sellers+than+other+buyers+are+accustomed+to+offer%3B+and+afterwards%2C+which+is+most+iniquitous%2C+Christians+are+forced+to+pay+double+the+price+to+the+Jews+if+they+wish+to+buy+what+is+necessary+for+feeding+their+families.+Fourth%2C+so+that+they+may+do+all+these+things+with+impunity%2C+they+distribute+gifts+to+the+officials+of+princes+so+that+they+may+be+protected+by+them.+Fifth%2C+from+this+it+happens+that+the+people%2C+who+bear+such+injuries+with+difficulty%2C+become+prone+to+inciting+sedition%2C+both+against+the+Jews+themselves+and+against+their+defenders+and+patrons.+Against+the+Jews%2C+indeed%2C+because+they+are+thieves+and+plunderers%3B+against+the+patrons%2C+because+they+are+partners+of+thieves+and+plunderers.+If+a+prince+or+magistrate+does+not+prevent+or+punish+these+great+evils+%28to+say+nothing+of+the+rest%29%2C+he+is+a+participant+in+the+crime+and+is+bound+to+restitution.+He+can%2C+however%2C+prevent+them+in+three+ways.+First%2C+if+he+expels+the+Jews+entirely+from+his+province+or+city.+Second%2C+if+he+does+not+indeed+expel+them%2C+but+forces+them+to+agriculture%2C+or+to+mechanical+arts%2C+or+to+exercise+other+works%3B+and+does+not+allow+them+to+live+in+idleness+and+luxury%2C+as+they+now+live.+Third%2C+if+he+deprives+them+of+all+the+money+and+wealth+which+they+have+received+through+usury.+Would+that+these+things+were+brought+into+practice.+You+will+say%2C+if+the+Jews+are+either+expelled+or+do+not+accept+usury%2C+two+inconveniences+will+follow%3A+First%2C+because+Christian+princes+in+time+of+necessity+will+not+have+money+for+war.+For+they+are+accustomed+to+seek+this+from+the+Jews.+Then%2C+the+subjects+of+the+princes%2C+who+are+in+need+of+money%2C+will+not+be+able+to+borrow.+I+respond%3A+The+contrary+follows%3A+First%2C+because+once+the+Jews+are+expelled%2C+the+citizens+will+be+able+to+contribute+more+support+than+the+Jews+are+accustomed+to.+For+whatever+the+Jews+contribute%2C+they+receive+from+the+citizens+through+unjust+usury.+And+not+only+this%2C+but+also+whatever+is+necessary+for+them+to+sustain+their+lives.+Therefore%2C+they+take+two+portions+from+the+citizens%3A+one%2C+which+they+give+to+the+prince%3B+the+other%2C+by+which+they+live.+Certainly%2C+if+the+Jews+were+expelled%2C+the+citizens+would+be+prepared+to+give+either+both+portions+to+their+prince%2C+or+at+least+no+less+than+they+give+to+the+Jews.+Next%2C+the+subjects+of+princes+are+in+greater+need+of+money+when+the+Jews+are+present+than+when+they+are+absent.+For+when+they+are+present+and+demanding+intolerable+usury%2C+they+are+completely+drained.+If+they+were+absent%2C+or+at+least+did+not+demand+such+immoderate+usury%2C+the+subjects+would+be+less+drained%2C+and+consequently+would+be+in+less+need+of+money.+Our+Adam+Contzen+has+written+extensively+on+this+subject+in+his+Politics.%E2%80%9D%0A%0A%E2%80%94+Martin+Becanus%2C+Manual+of+Controversies+of+this+Time+%28Wurzburg%2C+1623%29%2C+bk.+5%2C+ch.+18%2C+%E2%80%98Is+a+prince+or+magistrate+able+to+tolerate+Jews+in+his+city+or+province%3F%E2%80%99+tr.+AI+by+The+Faith+Received+Becanus+%281563%E2%80%931624%29+was+a+Dutch-born%2C+Roman+Catholic%2C+Jesuit+priest%2C+known+as+a+theologian+and+controversialist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ca8f987c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ca8f987c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Whether%20a%20prince%20or%20magistrate%20may,on%20this%20subject%20in%20his%20Politics&amp;text=Whether%20a%20prince%20or%20magistrate%20may%20tolerate%20Jews&amp;text=written%20extensively%20on%20this%20subject%20in%20his%20Politics" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

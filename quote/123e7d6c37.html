</figure><figure class="quote" id="q-ea9285199b" data-kw="">
<blockquote><p>Put such books into people’s hands as plead best the cause of love and peace. Among others, get men to read these: Bishop Ussher’s Sermon on Eph. 4:13 at Wansted before King James [‘A Brief Declaration of the Universality of the Church of Christ’, 1624 / 1629], Bishop Hall’s [sermon, ‘The True] Peacemaker’ [1624]: Mr. Jeremiah Burroughs’s of Heart-Divisions, and Mr. Stillingfleet’s Irenicon, and all Mr. [John] Durie’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 60, ‘When the love-killing spirit, either cruel or dividing is abroad among Christians, be not idle nor discouraged spectators, nor betray the Churches’ peace by a few lazy wishes, but make it a great part of your labor and religion to revive love and peace, and to destroy their contraries: And let not censures or contempt of any sect or party take you off: But account it an honor to be a martyr for love and peace, as well as for the Faith’ in The Cure of Church Divisions</cite>, Direction 60, ‘When the love-killing spirit, either cruel or dividing is abroad among Christians, be not idle nor discouraged spectators, nor betray the Churches’ peace by a few lazy wishes, but make it a great part of your labor and religion to revive love and peace, and to destroy their contraries: And let not censures or contempt of any sect or party take you off: But account it an honor to be a martyr for love and peace, as well as for the Faith’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 300-4, p. 304</span></figcaption>

</figure><figure class="quote" id="q-93c6663cc1" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind… so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible, on Mt</cite>, 5:44-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

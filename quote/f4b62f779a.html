<main class="wrap"><figure class="quote" id="q-f4b62f779a" data-kw="">
<blockquote><p>Justifying faith is properly that which is defined in the catechism; according to which definition, the general nature of saving faith consists in knowledge and an assured confidence; for there can be no faith in a doctrine that is wholly unknown. … The difference, or formal character of saving faith, is the confidence and application which every one makes to himself, of the free remission of sins by and for the sake of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2100113f80" data-kw="">
<blockquote><p>By this faith a Christian believeth to be true whatsoever is revealed in the Word for the authority of God himself … but the principal acts of saving faith have immediate relation to Christ, accepting, receiving, and resting upon him alone for justification, sanctification, and eternal life, by virtue of the covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 14.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“By this faith a Christian believeth to be true whatsoever is revealed in the Word for the authority of God himself … but the principal acts of saving faith have immediate relation to Christ, accepting, receiving, and resting upon him alone for justification, sanctification, and eternal life, by virtue of the covenant of grace.”

— Particular Baptists, Second London Baptist Confession of Faith, 1689, 14.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy%20this%20faith%20a%20Christian%20believeth%20to%20be%20true%20whatsoever%20is%20revealed%20in%20the%20Word%20for%20the%20authority%20of%20God%20himself%20%E2%80%A6%20but%20the%20principal%20acts%20of%20saving%20faith%20have%20immediate%20relation%20to%20Christ%2C%20accepting%2C%20receiving%2C%20and%20resting%20upon%20him%20alone%20for%20justification%2C%20sanctification%2C%20and%20eternal%20life%2C%20by%20virtue%20of%20the%20covenant%20of%20grace.%E2%80%9D%0A%0A%E2%80%94%20Particular%20Baptists%2C%20Second%20London%20Baptist%20Confession%20of%20Faith%2C%2014.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2100113f80.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2100113f80.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" rel="noopener" target="_blank">Read it online · Founders Ministries</a></div>
</figure><figure class="quote" id="q-06a25dc631" data-kw="">
<blockquote><p>Christian faith, therefore, is personal reliance upon Christ for salvation because of belief of God&#x27;s testimony as to our sinful and ruined condition, and as to what Christ has assuredly done to save us. It is based, therefore, upon the knowledge of this testimony as given by our own consciences and the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-petigru-boyce.html">James Petigru Boyce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abstract of Systematic Theology</cite>, ch. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span></div>
<div class="actions"><button class="copy" data-copy="“Christian faith, therefore, is personal reliance upon Christ for salvation because of belief of God&#x27;s testimony as to our sinful and ruined condition, and as to what Christ has assuredly done to save us. It is based, therefore, upon the knowledge of this testimony as given by our own consciences and the word of God.”

— James Petigru Boyce, Abstract of Systematic Theology, ch. 34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChristian%20faith%2C%20therefore%2C%20is%20personal%20reliance%20upon%20Christ%20for%20salvation%20because%20of%20belief%20of%20God%27s%20testimony%20as%20to%20our%20sinful%20and%20ruined%20condition%2C%20and%20as%20to%20what%20Christ%20has%20assuredly%20done%20to%20save%20us.%20It%20is%20based%2C%20therefore%2C%20upon%20the%20knowledge%20of%20this%20testimony%20as%20given%20by%20our%20own%20consciences%20and%20the%20word%20of%20God.%E2%80%9D%0A%0A%E2%80%94%20James%20Petigru%20Boyce%2C%20Abstract%20of%20Systematic%20Theology%2C%20ch.%2034&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06a25dc631.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/06a25dc631.html">Permalink</a><a class="src" href="https://ccel.org/ccel/boyce/theology" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-57fc8840e2" data-kw="">
<blockquote><p>The first is the act of knowledge (notitia)—of all things to be believed by us, whether pertaining to our misery or to the grace of God. For as truth is the object of faith (and indeed not any truth, but the divine and supernatural truth revealed in the word of God), it requires above all knowledge for its apprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span></div>
<div class="actions"><button class="copy" data-copy="“The first is the act of knowledge (notitia)—of all things to be believed by us, whether pertaining to our misery or to the grace of God. For as truth is the object of faith (and indeed not any truth, but the divine and supernatural truth revealed in the word of God), it requires above all knowledge for its apprehension.”

— Francis Turretin, Institutes of Elenctic Theology, 15.8.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20first%20is%20the%20act%20of%20knowledge%20%28notitia%29%E2%80%94of%20all%20things%20to%20be%20believed%20by%20us%2C%20whether%20pertaining%20to%20our%20misery%20or%20to%20the%20grace%20of%20God.%20For%20as%20truth%20is%20the%20object%20of%20faith%20%28and%20indeed%20not%20any%20truth%2C%20but%20the%20divine%20and%20supernatural%20truth%20revealed%20in%20the%20word%20of%20God%29%2C%20it%20requires%20above%20all%20knowledge%20for%20its%20apprehension.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2015.8.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57fc8840e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57fc8840e2.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c1abb94772" data-kw="">
<blockquote><p>To this knowledge must be joined assent, which is the second act of faith, whereby a person receives and acknowledges as truths, those things which he knows, &quot;receiving the testimony of God, and thus setting to his seal that God is true,&quot; John 3:33. This assent is principally founded on the infallible veracity of God, who testifies of himself and of his Son, 1 John 5:9, 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, 3.7.11</span></figcaption>

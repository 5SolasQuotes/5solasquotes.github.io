<main class="wrap"><figure class="quote" id="q-4c5030f757" data-kw="">
<blockquote><p>III. Unto this catholick visible church Christ hath given the ministry, oracles, and ordinances of God, for the gathering and perfecting of the saints in this life, to the end of the world; and doth by his own presence and Spirit, according to his promise, make them effectual thereunto.[g] [g] 1 Cor. 12:28. Eph. 4:11-13. Matt. 28:19,20. Isa. 59:21. IV. This catholick church hath been sometimes more, sometimes less visible.[h] And particular churches, which are members thereof, are more or less pure, according as the doctrine of the gospel is taught and embraced, ordinances administered, and publick worship performed more or less purely in them.[i] [h] Rom. 11:3,4. Rev. 12:6,14. [i] Rev. 2-3. 1 Cor. 5:6,7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 25, ‘Of the Church’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bc0b141c28" data-kw="">
<blockquote><p>To bring the lawfulness of known ordinances under dispute for some circumstances affixed has ever been of great advantage to Satan, whether in such disputes he prevails or not: For men are either beaten wholly off from the duty, or perform it with a more remiss and unsuitable spirit, which lies more directly in the way to prevent a blessing than the evils of others we ordinarily object… If for substance the duty be so evident as not to be liable to a dispute in itself (as this of hearing [preaching] is): then Satan fastens scruples about circumstances, which prevailing, we have as little benefit from the ordinance or duty as if it were not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use: Whether we may Lawfully Hear the now Conforming Ministers who are Re-ordained &amp; have Renounced the</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3, p. 25 Nye was a covenanting Independent, English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

%20or%20duty%20as%20if%20it%20were%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7f048ab8cd" data-kw="">
<blockquote><p>Objection [of Separatists]: They [wicked people] mix with us in our [congregational] singing; mixed worship we cannot join in. Answer: I cannot conceive what harm this can do to you; is the mixing of your own corruption in your service less prejudicial to the acceptance of it with God, than the presence of wicked men joining in the service?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Separation Examined: or, a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are Weighed &amp; Found too Light</cite>, … (London: 1652), pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Objection [of Separatists]: They [wicked people] mix with us in our [congregational] singing; mixed worship we cannot join in. Answer: I cannot conceive what harm this can do to you; is the mixing of your own corruption in your service less prejudicial to the acceptance of it with God, than the presence of wicked men joining in the service?”

</figure><figure class="quote" id="q-ea0bc6aae3" data-kw="">
<blockquote><p>To acknowledge and confess, that, as we are convinced of our guilt, so, out of a deep sense thereof, we judge ourselves unworthy of the smallest benefits, most worthy of God’s fiercest wrath, and of all the curses of the law, and heaviest judgments inflicted upon the most rebellious sinners… Notwithstanding all which, to draw near to the throne of grace, encouraging ourselves with hope of a gracious answer of our prayers, in the riches and all-sufficiency of that only one oblation, the satisfaction and intercession of the Lord Jesus Christ… and humbly and earnestly to supplicate for mercy… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed… And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for the Public Worship of God</cite>, Of Public Prayer before the Sermon</span></figcaption>

</figure><figure class="quote" id="q-2e0d54db80" data-kw="">
<blockquote><p>And that David might not think this motion of building God an house displeasing unto Him, although he was not permitted so to do, it is said, 1 King: 8:18, ‘Whereas it was in thy mind to build Me an house, thou didst well,’ which is here omitted, the Lord approved it expressly as a pious intention in David. And lastly because he bent his mind to the building of an house for God, the Lord promises to requite him with the like, and to build him an house, as it is said He did for the midwives of Egypt, He built them houses…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, ... (London: 1653), on 2 Samuel, ch. 7, p. 390</span></figcaption>

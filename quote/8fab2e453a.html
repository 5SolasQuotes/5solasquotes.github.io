<main class="wrap"><figure class="quote" id="q-8fab2e453a" data-kw="">
<blockquote><p>It is a great dispute with the Schoolmen: Whether God’s power be anything but his intellect and will, that is, a necessary, distinct, conceptus inadaequatus [inadequate concept] of God (for He is one simple essence). Durandus, bk. 1, dist. 38, quest. 1, justly affirms it. Vasquez, in I. Thom. quest. 23, dist. 102, c. 2, says, Haec sententia nonnullis recentioribus mirum in modum probatur [This opinion is approved in a remarkable manner by several more recent authors]; yet he is against it, though Suarez be for it. But it is partly by misconceiving of the potentia vitalis in man, as if it were only executive ad extra [unto external things], or in the inferior faculties, and partly on such frivolous reasons as tend also to a denial of his intellection and volition. Methinks, they that acknowledge God’s understanding and will to be analogically so called (man’s being the first which the word signifies, though God’s infinitely more excellent) should on the same reason grant, that vita and potentia activa are terms as applicable to God: for which denomination many reasons and cogent may be given. And I am sure the language of the Scripture and our [Apostles’] Creed will warrant this conception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675), sect. 3, ‘The several inadequate conceptions which in order make up our knowledge of God’ | p. 4, margin note Baxter is arguing that the life of God is more fundamental than his intellect and will.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d874f8adcc" data-kw="attributes not accidental">
<blockquote><p>Attributes are not ascribed to God properly as something superadded to his essence (something accidental to the subject), making it perfect and really distinct from himself; but improperly and transumptively inasmuch as they indicate perfections essential to the divine nature conceived by us as properties.</p></blockquote>

</figure><figure class="quote" id="q-6a395b140e" data-kw="">
<blockquote><p>Holiness is God conformable to Himself, 1 Sam. 2:2; Hab. 1:13. As created holiness (which some call moral goodness or perfection of manners) is the conformity of the reasonable creature to the rule, so (God being his own rule and the fountain of all created perfection) we may conceive of increated holiness as of God’s conformity unto Himself. God is holy essentially, and so is none but He, 1 Sam. 2. There is none holy as the Lord; the creature is holy only by participation. He is the Author of all created holiness, both of the Moral Law, which is the rule of holiness, and of the infused grace of holiness, whence the reasonable creature is made conformable to that rule, and of all other holiness whatsoever: therefore [He is] justly called, ‘the Holy One of Israel,’ Isa. 41:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

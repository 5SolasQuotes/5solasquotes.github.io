<blockquote><p>Excess of passion in opposing evil, though not to be justified, yet shows a better spirit than a calm temper when there is just cause of being moved. It is better that the water should run somewhat muddily than not run at all. Job had more grace in his ill temper than his friends in their seemingly wise demeanour. Actions stained with some defects are more acceptable than empty compliments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed, in Works, vol. 1</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-709e1f272f" data-kw="">
<blockquote><p>1. Consider many things are darkly laid down in the Scriptures, and the scope of God and Christ therein, is not to cause contention, difference, and censuring: but to unite us more strongly in those things are clear, and to cause a forbearance of one another in things are dark and doubtful: Phil. 3:15-16: ‘If in anything you be otherwise minded, God shall reveal even this unto you: Nevertheless whereto we have already attained, let us walke by the same rule, and let us minde the same thing.’ Says Paul: ‘I confide not in my own works or righteousness, but look at Christ alone; I labour to win Christ, and be found in Him; I press after Him and none but Him, and mind nothing else as a means of salvation; if any be otherwise minded through ignorance, or weakness of Faith (as many were, who affected Mosaical rites and ceremonies) God shall reveal even this unto you; he will make known the truth unto you; nevertheless, though there be differences, let us forbear one another therein, and whereto we have attained, let us walk harmoniously and peaceably together, minding the same things.’ What is clear held out unto us in the Gospel, let us consent in, and walk answerably; in what is dark, doubtful, let us forbear each other, and stay till God reveal more. If we cannot unite in all, let us unite in what is clear. Things fundamental, and absolutely necessary, are clearliest laid down in the Word; they are expressly commanded, or held forth in Scripture, whether they be matters of Faith or practice, they are not things drawn out by remote consequences, and strength of men’s parts, but immediatly from, or in, the Word, and in these most may, or do agree, not being many in number; so far as we have attained in these, let us walk; and as King James says, in other things, place may be given to Christian liberty; and let us take heed how we charge men to hold fundamental errors, when fundamentals are few, Rom. 10:9; 1 Jn. 4:2, and men’s errors are extra-fundamentals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition continued upon the Sixth, Seventh, Eighth, Ninth, Tenth, Eleventh, Twelfth &amp; Thirteenth Chapters of the prophet Ezekiel (London: 1649), on 11:19, ‘Helps to Unite our Hearts, or Uniting Directions,’</cite>, pp. 411-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-e7427f35bb" data-kw="">
<blockquote><p>And indeed there is no possibility of making an actual agreement in those lesser points, because of the different capacities and degrees of faith: And God in the Scripture has not promised such an actual agreement to all the members of the Church in all lesser points of doctrine; for He has not promised a full and uniform discovery of them to all: Yea, it has been showed out of your own great Doctor Stapleton (Ex. pacif. ch. 3), by a Roman Catholic, that in the discovery of small points the Church is not infallibly directed… And thus may we come to a sight of the unity of faith in the Church; For in the explicits, that is, in fundamentals of absolute necessity which knit unto Christ the foundation, there is and ought to be an unity; and this substantial unity may cover the incurable differences in the lesser implicit points being held by infirmity, and not with contention, scandal, and schism: For unity in fundamentals does take away the damning censure of differences in lesser points when there is a will of believing right in these points, but a want of power to attain this belief. And so these differences in lesser points not being put upon account for the will of unity in them, and for the real unity in fundamentals, this real unity in fundamentals is accounted an entire, or at least a solid and saving unity: So that the unity is not to be reckoned from this, that all do actually agree in this belief of all lesser points (for in diverse of these points diverse do necessarily differ) but because their unity in fundamentals, and a will of unity in these lesser points wherein they differ (the imputation of smaller differences being thus taken away) are accounted to them for an entire, or at least for a sufficient unity. And this truth is in not much unlike terms to be seen in Tertullian (Of the Veiling of Virgins, ch. 1): Regula quidem fidei una omninò est, sola immobilis, et irreformabilis, credendi scilicet in unicum Deum, omnipotentem mundi conditorem, et Filium ejus Jesum Christum, etc. ‘The rule of faith is only unmoveable.’ And De Praes., ch. 12: Quaeramus ergò in nostro et à nostris et de nostro, id(que) duntaxat quod salva regula fidei potest in quaestionem devenire. ‘Let us inquire or dispute of that which may come into question without hurting the rule of faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rous.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Charity Complaining &amp; Maintaining that Rome is Uncharitable to sundry eminent parts of the catholic Church, and especially to Protestants, and is therefore Uncatholic (London: 1641), ch. 9, sect. 3, pp. 231-34 Rous was a Westminster divine.</cite></span></figcaption>

</figure><figure class="quote" id="q-abd2d967b8" data-kw="">
<blockquote><p>If ye state yourselves into parties, as the Corinthians did, how will ye avoid being puffed up for one against another? and what one says be taken as an oracle and what another says cried down according to interest and affection? Cum res transit in affectum, perit judicium [When a thing turns to affection, judgment perishes]. Beware of a wrong bias upon your affection, for that will bias and bribe your judgment, and forbear rash judgings and spurning at ministers, 1 Cor. 4:5. Censure only what the Scripture censures and approve only what it approves; else ye may soon take light for darkness, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681)</cite>, p. 170</span></figcaption>

<blockquote><p>Rutherford, Brown, Gillespie, Durham, and generally all the best men of that school seek to multiply reasons against separation, and show themselves willing to bear the heaviest burdens and submit to the severest strain rather than take what to them is the most painful step in separation from communion with any body with which they had previously held church fellowship.</p></blockquote>

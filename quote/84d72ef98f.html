<main class="wrap"><figure class="quote" id="q-84d72ef98f" data-kw="">
<blockquote><p>[Scotus:] ‘God does not operate for that operation except with the will freely acting and determining itself to operate; then God operates with it. Yet there the first liberty and dominion is not in it but in the divine will, which has no cause operating with it for its own act; yet as much liberty as can be in a creature is there.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Scotus, p. 392</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Scotus, p. 392">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BScotus%3A%5D+%E2%80%98God+does+not+operate+for+that+operation+except+with+the+will+freely+acting+and+determining+itself+to+operate%3B+then+God+operates+with+it.+Yet+there+the+first+liberty+and+dominion+is+not+in+it+but+in+the+divine+will%2C+which+has+no+cause+operating+with+it+for+its+own+act%3B+yet+as+much+liberty+as+can+be+in+a+creature+is+there.%27%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Scotus%2C+p.+392&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84d72ef98f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/84d72ef98f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=Scotus%3A%5D%20%E2%80%98God%20does%20not%20operate%20for,be%20in%20a%20creature%20is%20there&amp;text=Scotus%3A%5D%20%E2%80%98God%20does%20not%20operate%20for%20that%20operation&amp;text=as%20can%20be%20in%20a%20creature%20is%20there" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4f7b0edf2" data-kw="Author of sin Depravity">
<blockquote><p>The power of action is from God, but the viciousness of that action from our own nature. As when a clock or watch hath some fault in any of the wheels, the man that winds it up, or putting his hand upon the wheels moves them, he is the cause of the motion, but it is the flaw in it, or deficiency of something, is the cause of its erroneous motion. … Our motion is from God,—Acts 17:28, &#x27;In him we move&#x27;,—but not the disorder of that motion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>

</figure><figure class="quote" id="q-ee4a4b51ea" data-kw="">
<blockquote><p>Regarding the nature of free will; it suffices that from the previous judgment of the practical intellect, it chooses one of the opposites, while still being able to choose the other from a different judgment of the same intellect; because, namely, the root and foundation of free will lie in the intellect, insofar as it can consider various aspects of good in opposites and propose them to the will. But the nature of free will does not include that while the free agent chooses from previous judgment, it is not moved by a superior cause to judge and choose so. Therefore, since the divine motion predetermining the will does not hinder a person from having full and perfect judgment of reason and judging that one means is contingent and the other is necessarily connected to the end, and could also choose otherwise from a different judgment, it follows that such a motion does not harm the freedom of our will. For it is proper to the uncreated will to have its choice from no prior cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXIII. To this, he responds:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-7086ee12f9" data-kw="">
<blockquote><p>Nevertheless, regarding the mode of concurring by determining, Scotus does not agree with the position of the Thomists positing a prior quality or positive influx in the secondary cause through which it is constituted in first act and proximately capable of operating. This is apparent from nearly all the cited places, where he excepts antecedent motion of the first cause from being done through an intermediate other created power — which exception establishes the rule of the impossibility of determining from a created cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Scotus, pp. 394-95</span></figcaption>

oks Online</a></div>
</figure><figure class="quote" id="q-2a8d824de9" data-kw="">

<main class="wrap"><figure class="quote" id="q-d75588582f" data-kw="">
<blockquote><p>Worship is as large as the Commandment, nay as the whole Word of God. For so it is ordinarily defined, a work commanded, done in faith, and then it must needs extend itself as far as the Commandment. And if to obey God in conscience of his Commandment, in all actions, civil and sacred, of piety, justice or mercy, be to worship Him, then to believe whatsoever the Lord has taught, relying upon the truth and credit of the Revealer, is worship also. And hence it is, that the worship of God is usually divided into immediate and mediate worship: which comprehends all duties which we owe to God or Man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam… (London: R.B., 1642), ch. 1, section 4</cite>, p. 48</span></figcaption>

</figure><figure class="quote" id="q-4179e7598d" data-kw="">
<blockquote><p>The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or signification. … Ceremonies are external rites and sacred accidents of the worship of God. They are not of themselves the worship of God, but concomitant adjuncts and assistants by signification, exercise, exercise, work and decorum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology (P&amp;R, 1994), vol. 2, 11th Topic, ‘On the Law of God’, Question 24, ‘What was the end and use of the ceremonial law under the Old Testament?’, section 4 &amp; 6</cite>, pp. 146-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-6b1f4111a2" data-kw="prescribed by law regulative">
<blockquote><p>Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it; and whatsoever is not commanded nor forbidden by it is to be considered in its own nature indifferent and left to the freedom of man, unless this freedom has been restricted by some positive law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.2b</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it; and whatsoever is not commanded nor forbidden by it is to be considered in its own nature indifferent and left to the freedom of man, unless this freedom has been restricted by some positive law.”

— Francis Turretin, Institutes of Elenctic Theology, 11.22.2b">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus%20there%20is%20no%20work%20truly%20and%20properly%20good%20and%20acceptable%20to%20God%20which%20does%20not%20agree%20with%20the%20law%20and%20is%20not%20prescribed%20by%20it%3B%20and%20whatsoever%20is%20not%20commanded%20nor%20forbidden%20by%20it%20is%20to%20be%20considered%20in%20its%20own%20nature%20indifferent%20and%20left%20to%20the%20freedom%20of%20man%2C%20unless%20this%20freedom%20has%20been%20restricted%20by%20some%20positive%20law.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2011.22.2b&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6b1f4111a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6b1f4111a2.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-d342678c42" data-kw="">
<blockquote><p>The things set down under the former head as forbidden are such new ordinances of worship as are coordinate with the divine ordinances and are in a proper sense additions, pretending or in themselves expressing the same nature, reason, end and use that the divine ordinances have and consequently importing an insufficiency in them. But there are such institutions of men in subordination to the divine institutions as serve for the more convenient modifying and ordering of the same; and they are not proper additions because they are not of the same nature and use: and these are unlawful. All such modes of a duty as are necessary in genere, and not determined in specie (as when there must be a practice one way or other, but whether this way or that way, is not determined of God) are left free to human determination. This human determination must be regulated by the general rules of God’s Word, of which there be these two chief: First, that all determinations be made for edification and not for destruction. Secondly, that all things be done decently and in order. These two rules we find expressly in Scripture, and they are also of the law of nature. These things are neither the essential nor integral parts of divine worship; but if any of them be called “parts” thereof, as being direct expressions of honor to God, they are but accidental parts, as the putting off the hat in divine worship is a worshipping of God so far as it is an expression of honor to God. … Whatsoever nature or custom has so made decent or reverent that the negation of it is indecent or irreverent, is doubtless commanded of God in his worship, though not by any particular, yet by general laws. And the institution and observation of such things is no addition to God’s Law, but merely an application of the general Law in particular cases, as the Law itself does warrant. All these are such mutable things as are not fit to be in particular the matter of a universal law because they are fit in one place and at one time, and not another. Note that things not determined of God and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 5, What things of or belonging to Divine Worship may be Devised or Instituted by Man</cite></span></figcaption>

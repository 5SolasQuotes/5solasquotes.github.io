<main class="wrap"><figure class="quote" id="q-00fb97cdc5" data-kw="">
<blockquote><p>15. Now rests it to see whether it be lawful for godly men to desire miracles of God… I say when men are in this perplexity, the will being ready bent, yea very desirous to obey the commandment of God, godly men cannot be accused either of tempting of God or of rashness if so be they desire to be confirmed by some sign. For whosoever in those cases desires such things as God has been accustomed to offer, he does not amiss. No man is ignorant but that to Ahaz was offered a sign to the intent he might be assured of the promises offered him by Isaiah; wherefore to desire those things which God Himself sometime gives and freely offers, ought not to be forbidden as unlawful, wherof there is no want of examples. … For these things [in Mk. 16:17-18] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers wherby the gospel was commended. For even as the Law of Moses procured to itself credit, through the manifold miracles showed upon Mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner, miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark, belonged not to all times; whereof it is not our part either to complain or find any fault; because that we hear that the Holy Ghost distributes to every one as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether it be lawful for the godly to desire miracles, and why there be none in this our age’ in ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’ in The Common Places</cite>, … (London: Henrie Denham et al., 1583), pt. 1, ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’, pp. 69-72, pp. 69, 71-72</span></figcaption>

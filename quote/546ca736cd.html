<main class="wrap"><figure class="quote" id="q-546ca736cd" data-kw="">
<blockquote><p>Second it is useful and necessary that in our invocation of God we know what God we are invoking—that true God with whom we have entered into a covenant of faith, who has testified to us in an eternal covenant that He will be our God, and who has sealed that to us with the seal of baptism. This is so that the we might distinguish our invocation from that o f the pagans, the Turks, and such like, who invoke gods that are really not gods at all but fabrications by the father of lies. For it is in no way tolerable to God that any fellowship with false deities hinder His covenant partners in their invocation and worship, s the Holy Spirit eloquently proclaims in 2 Corinthians 6:14–15. The apostle also sets before our eyes the magnitude of this danger—unless we cling to the living God, whose covenant partners we are, by the true of obedience of faith, and wholly abstain from all idolatrous worship and invocation—in 1 Corinthians 10: [20–21]: “The things which the Gentiles sacrifice they sacrifice to demons and not to God, and I do not want you to have fellowship with demons. You cannot drink the cup of the Lord and the cup of demons; you cannot partake of the Lord’s Table and the table of demons.” For κοινωνιαν with the table demons with be followed also by κοινωνια in eternal punishment (Rev. 14:9–12; Luke 11:49–52).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Apostles’ Creed</cite>, trans. Lyle D. Bierma, Classic Reformed Theology, ed. R. Scott Clark (Grand Rapids: Reformation Heritage Books, 2009), 38–39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-adc2d5bc08" data-kw="">
<blockquote><p>So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, ‘The Causes &amp; Cures of Mental Errors’, p. 476</span></figcaption>

<blockquote><p>The foregoing opinion [that the knowledge of God is self-evident] arose from their being accustomed from the beginning to hear and call upon the name of God. Now custom, especially if it dates from our childhood, acquires the force of nature, from which it happens that the mind holds those things with which it was imbued from childhood as firmly as though they were self-evident.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b06c3fbaea" data-kw="">
<blockquote><p>We are further told, he made them coats or garments of skins to cover their nakedness. They were naked in paradise, and were not ashamed lo long as they were innocent; but so soon as sin entered, shame came along with it: A fair intimation that their nakedness lay in their fouls. It is natural to put the question. What skins were these? Supposing, what yet is denied by most, that they fed on flesh, could so many be killed for Adam and Eve?

But if we suppose, what indeed must be admitted, that God revealed to them his grant of eternal life, and the conduct required on their part; which is what our translators call making a covenant; of which solemnity a sacrifice was an absolutely necessary part, as is clear from the case of Noah, Abraham, and the Israelites, not to mention the more private and particular ones; then covering their nakedness with the skins of the sacrifice, was a fair emblem and representation of that covering for sin which God had provided for them, and all who would be prevailed with to renounce their fig-leaf coverings, and put on the Lord Jesus.

It was on this great foundation that the constitution of grace, and the grant of eternal life, were then established, and ever since have stood. Nor is it conceivable how the butchering of beats, shedding their blood, and formally burning their flesh in a fire prepared for the purpose, could ever have been set up as a piece of divine worship, on any lower authority than that of God; nor even on that, without explaining the design of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Several of the Doctrines of Revelation</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 262-63.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-265e68f485" data-kw="">
<blockquote><p>Mercy and truth are met together, righteousness and peace have kissed each other. When God made heaven and earth out of nothing, he made them by a word, without any other ceremony; but, when he made man, there was some particular solemnity, a grand council, as it were, of the glorious Trinity called; Come, let us make man after our image. But now man having unmade himself, if God hath a mind for the praise of his own glorious grace to make him up again, by a new creation in Christ Jesus, there must be a more glorious solemnity yet; not only a council of the adorable Trinity, but a grand meeting of all the attributes of God, to consult their own glory that was marred, and reconcile their own interests, and seemingly contradictory claims:

For the sin of man had brought real confusion among all the creatures of God on earth, yea, and seeming war among all the attributes of God in heaven, concerning the execution of the sentence of the law upon mankind, the transgressor thereof; some of these attributes, such as Mercy, saying, if the sentence of death be executed upon them, how shall I be glorified? Others, such as Truth, saying, if the sentence be not executed, how shall I be glorified? Is it to be expected that such opposites can meet together? Or, if they meet, that they will agree together cordially? Yea, tho’ it be beyond the expectation of men and angels, yet behold, it is here celebrated with a song? Mercy and truth are met together, righteousness and peace have kissed each other. …

But now, if we would know what sort of glory it is that appears when Christ is revealed, why it is even the glorious harmony of all the divine attributes illustriously shining in him, who is both our salvation and our glory; Mercy and truth are met together; righteousness and peace have kissed each other. Now, tho’ these words may be applied to the happy meeting of graces in men, upon the revelation of Christ in the soul, which I may afterwards observe in the sequel, and in which sense some interpreters understand it, yet I take it mainly to import the happy meeting of perfections in God to be glorified in the sinner’s salvation by Jesus Christ, which is a gloss that no interpreter I have had occasion to consult does neglect or omit; and, if any of them should miss it, I think they would miss the very ground-work and foundation of all other happy meetings: Mercy and truth are met together, righteousness and peace have kissed each other.</p></blockquote>

</figure><figure class="quote" id="q-67ba3cedeb" data-kw="">
<blockquote><p>Singing of psalms must be used in thy family. The Lord Jesus and his family did practise this duty: Mat. xxvi. 30, ‘And when they sang a hymn, they went out into the Mount of Olives.’ David in that psalm, at the dedication of his house, speaketh that his glory should sing praise to God, and not be silent, Ps. xxx. title, ver. 4 and 12. Our tongues are called our glory, not only because by our speech we excel beasts, but chiefly because therewith we should glorify God. It is observable that most of those places which prophesy the Gentiles’ conversion, do mention their worshipping the true God by singing, Ps. cviii. 3, c., and lxiv. 4; Isa. liv. 1, and lii. 8.

The Holy Ghost when he commandeth that the word should keep house with us, doth also enjoin us to ‘teach and admonish one another in psalms, and hymns, and spiritual songs,’ (which are the titles of David’s psalms, and the known division of them, expressly answering to the Hebrew words, Shurim, Telhillim, and Mizinurim, by which his psalms are distinguished and entitled, as the learned observe,) ‘singing and making melody with grace in our hearts to the Lord,’ Col. iii. 16; Eph. v. 19; James v. 13. Basil speaks high in the praise of praising God by this holy exercise. Chrysostom speaketh of some in his time who always concluded their suppers with singing a psalm, and, saith he, they lived like angels.

This ordinance will much quicken holy affections, and help a Christian to serve God with more cheerfulness. When the Israelites were singing the 136th psalm at the bringing in the ark, the glory of the Lord filled the house, 2 Chron. xx. 22. The sweet singer in Israel was the man after God’s own heart.

Only, reader, be careful to sing David’s psalms with David’s spirit, and not like a nightingale to sing by rote: ‘I will sing with my spirit, and I will sing with the understanding also.’ Making melody with grace in the heart, is the best tune to set all David’s psalms with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 341-42.</span></figcaption>

</figure><figure class="quote" id="q-70b30ae758" data-kw="">
<blockquote><p>But who can endure the day of His coming? And who can stand when He appears? For He is like a refiner’s fire and like launderers’ soap. (Malachi 3:2)

Preaching on the above text before the House of Lords, George Gillespie instructed his hearers that references to the coming of Christ do not always refer to the incarnation or to the Lord’s visible return. Instead, when the Bible refers to the coming of Christ, it is often talking about the advance of his kingdom prior to his second coming:

We look for a more glorious coming of Jesus Christ before the end; for the Redeemer shall come to Zion (Isa. 59:20), and shall turn away ungodliness from Jacob (Rom. 11:26) and he shall destroy Antichrist with the brightness of his coming (2 Thess. 2:8); in which place the apostle has respect to Isaiah 11:4, where it is said of Christ, the rod of Jesse, with the breath of his lips shall he slay the wicked. There, withal, you have the church’s tranquillity, the filling of the earth with the knowledge of the Lord, and the restoring of the dispersed Jews …</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cfde23bc92" data-kw="">
<blockquote><p>But because prayers are after two manner of sorts, that is, either in words only, or else with song joined thereunto; and this latter part… is called by many into doubt, whether it may be used in a reformed church; it is expedient that we note briefly a few things pertaining thereunto. S[t]. Paul giving a rule how men should sing… in another place, showing what songs should be sung, exhorteth the Ephesians to “edify one another with psalms, songs of praise, and such as are spiritual…”… … and confirmed by all Antiquity. As, besides other places, is most manifest by the words of Pliny, called the younger, who, when he was depute in Asia unto the Emperor Trajan, and had received charge to inquire out the Christians to put them to death, writ among other things, touching the Christians, “That their manners were to sing verses or psalms early in the morning to Christ their God.”… And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost hath framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appeareth by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their commune speech and prose, gave thanks to God for such comfort as he sent them. Here it were to[o] long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just caesuras [rhythmical pauses], but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he factioned [fashioned] many Psalms according to the letters of the alphabet; so that every verse beginneth with the letters thereof in order. Sometimes A. beginneth the half verse, and B. the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whittingham.html">William Whittingham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Form of Prayers and Ministration of the Sacraments, &amp;c., used in the English Congregation at Geneva: and Approved by the Famous and Godly Learned Man, John Calvin</cite>, (1556; Imprinted at Edinburgh, by Robert Lekprewik and are to be should at his house at the neither bow. Cum priuilegio. 1562), ‘To our Brethren in England…’, pp. 165-6 “This Preface, or Address, is usually ascribed to [William] Whittingham…”, David Laing, Knox’s Works, 4.157.</span></figcaption>

<blockquote><p>The matter is here three ways to be considered: First, in the ground, foundation, or authority of the Psalms we use, viz. they must be the word of Christ, that is contained in the Scriptures. Secondly in the kinds of Psalms, there are many sort of Psalms in Scripture. The Psalms of Moses, David, Solomon, and other prophets: but all are here referred to three heads; they are either Psalms, specially so called, or hymns, or songs. Great ado there is among interpreters to find a difference in these: some would have Psalms to be the songs of men, and Hymns of angels: some think they differ, especially in the manner of music. Some are sung by voice, some played upon instruments; but the plausiblest opinion is not to distinguish them by the persons that use them, or by the kind of music, but by the matter, and so they say Psalms contain exhortation to manners or holy life. Hymns contain praises to God in the commemoration of his benefits. Songs contain doctrine of the chief good, or man’s eternal felicity. But I think there needs not any curious distinction: it may suffice us that there is variety of Psalms in Scripture and God allows us the use of every kind. Thirdly, the property of the Psalms, they are Spiritual, both because they are indited by the spirit, and because they make us more spiritual in the due use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (London, 1615), commentary on ch. 3, v. 16, p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

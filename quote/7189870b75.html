<main class="wrap"><figure class="quote" id="q-7189870b75" data-kw="">
<blockquote><p>The first is, that as they say I am not lawfully called to the function of the ministry, nor allowed to preach according to the laws of this Church of England. For answer to this, I had need to divide the points, &amp; first to make answer to the former, wherein leaving to shew what by the holy Scriptures is required in a lawful calling and that all that is to be found in mine, that I bee not too long for your other weighty affaires, I rest.

I this answer, my calling to the ministry was such as in the calling of any thereunto is appointed to bee used by the orders agreed upon in the National Synods of the Low Countries, for the direction and guidance of their Churches, which orders are the same with those whereby the French &amp; Scottish Churches are governed, whereof I have shewed such sufficient testimonial to my L[ord]. the Archbishop of Canterbury, as is requisite in such a matter: whereby it must needs fall out if any man be lawfully called to the ministry in those Churches then is my calling, being the same with theirs, also lawful.

But I suppose notwithstanding they use this general speech, they mean only my calling is not sufficient to deal in the ministry within this land, because I was not made minister according to that order which in this cause is ordained by our laws. Whereunto I beseech your Honours to consider thoroughly of mine answer, because exception now again is taken to my ministry whereas having been heretofore called in question for it, I so answered the matter, as I continued my ministry, and for any thing I discerned, looked to hear that no more objected unto me.

The communion of Saints (which every Christian man professeth to believe) is such, as that the acts which are done in any true Church of Christ’s according to his word, are held as lawful being done in one Church, as in another. Which as it holdeth in other acts of ministry, as baptism, marriage, and such like, so doth it in the calling to the ministry; by reason whereof all Churches doe acknowledge and receive him for a minister of the word, who hath been lawfully called thereunto in any Church of the same profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-travers.html">Walter Travers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Supplication made to the Privy Counsel</cite>, (Oxford: John Barnes, 1612), pp 5-6.</span></figcaption>

<blockquote><p>From this the opinion of the Romanists is evident without any further investigation. Ours is wholly contrary. In fact, we think that the communion under both kinds instituted by Christ should necessarily be retained; so that it is not only free to each one to use it, but from the command of Christ they are individually bound to it, unless they are prevented by some insuperable hindrance. Not without the highest sacrilege can the cup be taken away from the people against the express law of God. The state of the question therefore (1) is not Was communion under both kinds instituted by Christ? (which our opponents do not dispute); but Ought it to be instituted in like manner by believers, so that it is not only a thing indifferent and accidental, but necessary and essential to the perfection of the sacrament? (2) The question is not Is the believer so bound to communion under both kinds that he cannot in any case without sin commune under one kind only? For we confess if any unavoidable impediment interposes, either internal (arising from the disposition of the receiver) or external from other causes, by which he is prohibited from taking one kind, such an one is worthy of commiseration rather than of reprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.25.5</span></figcaption>

<blockquote><p>The terms of Communion in the Reformed Presbyterian Church are certainly more comprehensive than those in force in any other denomination. It is necessary that all who become members acknowledge the inspiration and infallibility of the Old and New Testaments; the agreeableness of the Confession of Faith and Catechisms (Larger and Shorter) with the Word of God; the divine right of Presbyterianism; the perpetual obligation of the National Covenant and Solemn League and Covenant; practical dissent from all national constitutions that ignore the Lord Jesus Christ as King of nations, and the duty of adorning the doctrine of God our Saviour by a life of godliness. No Church in the world has a larger creed for membership. […]

The popular cry now is for a brief creed, and the avowed object of this cry is that larger numbers may be led into the membership of the Church. The more comprehensive and intensive the creed the fewer must the members of the Church be; the fewer and less explicit the articles of the creed the more numerous will be the members. A creed with many articles is said to be a stumbling-block in the way of those without, to burden the Church and diminish her influence. It is true, doubtless, that a large creed is the occasion of much unpopularity meanwhile, but the adoption of the policy implied in the objection would abolish all creeds, however brief and narrow. […] To remove any truth from the creed of a Church is to strip her of part of the armour with which she is to gird herself for the duty required of her by her great Commander-in-chief. It is to limit and narrow the area on which she stands, and so bind her arms – her powers and influence. “The faith which was once for all delivered unto the saints” is one body; it is a perfect unity; and the Church that attempts to mutilate that perfect body incurs a dread responsibility. Her offence against the Lord is aggravated when this deed is perpetuated under the profession of breadth and enlargement. When the policies of ecclesiastical procedure have the peacock feathers of liberality and charity, with which they have been adorned, plucked off, they stand revealed as vultures which, with unrestrained appetite, would devour the whole body of revealed truth, and reduce the Christian and the Church to a condition of lamentable leanness – the mere skeletons of Christians and Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-kerr.html">James Kerr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterianism: its special claims</cite>, (Belfast, 1895), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

<blockquote><p>Secondly, it was not of the substance of the institution [of the Lord’s Supper] to eat unleavened bread, no more than to eat it at night… we are not more bound to the one, than to the other. Again, Christ used unleavened bread because it was the usual bread at that time: so we do use that which is the usual bread in our time. And St. Paul speaketh of such bread as was usual among the gentiles, when he saith, ‘The bread which we break’, 1. Cor. 10:17. Ergo, ordinary bread and leavened [is] to be used, not unleavened.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fe1ca3704d" data-kw="">
<blockquote><p>The conclusion reached in this paper is that there are more similarities than disparities between Aquinas and Calvin on the doctrine of predestination. Some degree of continuity ought to be expected given that both men interpret the Apostle Paul’s teaching on predestination through the lens of Augustine to one degree or another. In some respects, Thomas reflects a more faithful reading of Augustine than Calvin since he recognizes the role of merit in the soteric process and leans in the direction of a single predestinarian view. However, Calvin does more justice to Augustine’s emphasis on human depravity and the necessity of saving grace to rescue man from destruction. As it pertains to this doctrine, the theology of Thomas… It would be a serious misrepresentation to classify his position as Semi-Pelagian… A comparison of views between these theological titans reveals several notable areas of incongruity. First, Thomas sees predestination as a part of God’s providence and focuses on causality while Calvin posits predestination, not providence, as determinative of our final end and approaches it soteriologically. Second, Thomas follows Augustine and argues that the attainment of glory is realized in conjunction with acquired merit through grace and the gift of perseverance. Calvin, on the other hand, is irreconcilably opposed to the role of human merit both prior to and subsequent to justification. Third, our election in Christ is vital for Calvin while Thomas hardly speaks to this at all. Fourth, Thomas by and large embraces a doctrine of negative or passive reprobation whereby God permits the reprobate to fall away leading to damnation. Calvin advocates double predestination, arguing that God actively wills the destruction of the reprobate irrespective of works. Fifth, while Thomas identifies no practical end for this doctrine, it serves as a ground of assurance in Calvin’s theology. While these differences are not inconsequential, areas of agreement should be given greater weight. Both share the same outlook on the cause, extent, and end of election, namely, God’s unmerited favor toward a select number of individuals freely chosen for eternal life for the purpose of manifesting his goodness in their redemption. Thomas and Calvin mutually affirm the total inability of man to please God without special grace, unconditional election, the limited efficacy of Christ’s atonement, efficacious grace, and the perseverance of the elect. One might deduce from these propositions a Thomistic version of TULIP. In the final analysis, Thomas and Calvin locate the source and means of salvation squarely in God’s sovereign grace. Man can neither initiate his salvation nor realize its consummation apart from grace. Individuals possess eternal life only because God has foreordained them to this end according to his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-b-cavalli.html">Francis B. Cavalli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Aquinas &amp; Calvin on Predestination: Is There Any Common Ground?</cite>, [Yes]’ in Reformed Faith &amp; Practice, vol. 1, issue 2 (2016)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a29a73f9ec" data-kw="predestination definition Calvin all not created equal">
<blockquote><p>By predestination we mean the eternal decree of God, by which he determined with himself whatever he wished to happen with regard to every man. All are not created on equal terms, but some are preordained to eternal life, others to eternal damnation; and, accordingly, as each has been created for one or other of these ends, we say that he has been predestinated to life or to death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.21.5</span></figcaption>

</figure><figure class="quote" id="q-89e695a2a9" data-kw="">
<blockquote><p>Either you will distinguish God’s decrees by the objects, or not. If not, you must not distinguish between election and rejection, willing and nilling, loving Peter and hating Judas, etc. If yea, then you must not take up with the unexplained words, ‘reprobation’ and ‘election’. 1. By reprobation is meant either God’s will to punish men. 2. Or his will to give them no special saving grace. 3. Or his not-willing to give it them. For the first, I told you before that the object of God’s will to punish men in Hell is a sinner foreseen finally rejecting mercy. 2. The object of his will to punish men with positive temporal punishments is the sinner foreseen in his immediate capacity for them. 3. Whether punishment by not giving that Spirit for faith, repentance and holiness, be decreed (being nothing but a not-giving) is before discussed. But if it could be proved, yet the object of God’s denying further mercy and help, is evermore one that has abused former mercy, or refuses that as offered to him. (idem, d. 95, 1 Ferrariensis plane indicat Deum neminem damnare, aut rejicere a regno suo voluisse, quod ipse appellat deserere, nisi pravisa culpa [Ferrariensis plainly indicates that God willed to damn no one or to reject anyone from his kingdom, which he calls ‘to desert,’ except on account of foreseen sin.].) 4. But God’s non-volition to give grace is no act and has no object. But we judge that all mankind are now from under the mere Covenant of Innocency, and that none perish but for the abuse of mercy, which had a tendency to their recovery (the case of infants must be spoke to in its place once for all). But all this belongs to the case of grace and free-will. And 2. As for election, we say that: (How Augustine distinguished election to justification and [election] to glory, see him, bk. 1, to Simplicius, quest. 2 and that which about this Vasquez has on Thomas, pt. 1, disp. 89, ch. 6) 1. The object of God’s will to glorify men, is man sanctifying and persevering in an immediate capacity for glory in esse cognito [known being]. 2. The object of God’s will to give the grace of perseverance, is a foreseen sanctified person in the next capacity. 3. The object of God’s will to justify, sanctify and adopt, is a foreseen believer. 4. The object of God’s will to give special grace, which shall effectually cause men to repent and believe, is ordinarily a foreseen disposed sinner prepared by his common grace, but sometimes an unprepared sinner, whom, of his free will, he will suddenly convert, as it pleases him freely to distribute his benefits (all being unworthy). 5. The object of God’s will, to give the highest degrees of common grace, external (in the purest preaching of the Gospel, and other mercies) and internal (in greater helps of the Spirit) is sometimes a sinner in esse cognito, who has not grossly rejected lower helps, and sometimes freely the worser sort of sinners who have abused former mercies. 6. The object of God’s will to give the first common mercy which has a tendency in its use to men’s recovery and salvation, is all mankind fallen in Adam: For all are under the New Covenant of Grace made with Adam, Gen. 3:15, in some degree (and with Noah) and all have much mercy tending to repentance; and none are left as the devils in despair, without any offered remedy or help. 7. The object of God’s will to give man the Covenant of Innocency, was Adam foreseen as mere man. 8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that: 1. God’s power makes it possible for all things to be. 2. Next God knows them possible. 3. He knows what is convenient or fit to be made to his unsearchable ends. 4. He wills that they shall be, and man among the rest, and so on. If you will needs have the order of decrees, this is all that we can say of them. Arminian: All this pleases us well: but it will not please your own [moderate] party or the Calvinists that you make so many acts of election, which they tell you is but one entire thing, as mentioned in Scripture: Nor yet that you lay every decree or will upon foresight. Baxter: You are mistaken. No moderate, considerate man of them will deny anything that I have said, for: 1. As to the Scripture use of the word ‘election’, it is not the mere name that we are now opening, but the matter in question. Nor is it the expounding of particular texts that I am upon; and if I were, no man will deny but that the word ‘election’ is variously used in the Scripture: sometime for God’s eternal will to make us Christians of infidels, and to save us by Christ; and sometime for actual choosing us by converting grace in time; and sometime for actual choosing men in time by vocation to some office or special work, etc. And as to the distinguishing of all these volitions of God, no man will deny the effects to be distinct. Undoubtedly these are various effects of God: 1. To make man. 2. To give him the Covenant of Innocency. 3. To give him the Covenant of Grace, with all the common mercies of it. 4. To give some persons and nations the gospel and other mercies above the greatest part of the world, with answerable helps of the Spirit. 5. To give men special grace, effectual for faith and repentance. 6. To give men pardon, adoption and sanctification. 7. To give men perseverance. 8. To give them glory. And if these are various works, either you will distinguish of God’s will by his various works, or not. (Sive secundum nostram rationem distinguamus illud decretum in plura, sive dicamus esse unicum, non est multum curandum: Certum enim est apud omnes, Deum omnia et singula voluisse unico simplicissimo acta suae voluntatis: Est enim ipsius voluntas, et voluntatis operatio idem quod sua essentia simplex et individua si aliquis contenderet esse etiam nostro modo intelligendi esse unicum actum simplicissimum voluntatis, ego non curabo. [Whether, according to our manner of conceiving, we distinguish that decree into several [acts], or whether we say that it is one [act], it is not much to be concerned about. For it is certain among all, that God willed all things and each individual thing by one most simple act of His will. For His will, and the operation of His will, is the same as his simple and undivided essence. If someone were to contend that even according to our manner of understanding, there is one single most simple act of the will, I would not be concerned.] Vasquez on Thomas, pt. 1, quest. 14, art. 13, disp. 65; and is not this a short end of many controversies?) If you do not, our whole controversy about the order of the decrees is quickly at an end (and I am content with the abbreviation): For where there is no distinction, there is no order. And when I distinguish them never so much, I say, as well as any, that they are all one in regard of the one will or essence of God that wills them. In God there is no real diversity; but his will is thus variously denominated extrinsically from its respect to the various objects to which it does trans[p]ire, and of the various effects which it produces. And thus do all men talk of God. Else they could not distinguish his saving will from his damning will; nor election from rejection, in his decree. So that no man can tell how to differ here. And as to foresight, you as much mistake. For: 1. I say not that God foresees any good in any man, but what He gives him and wills to give him. But we speak of the order of those volitions in the way of execution. (Alexander Alesius is noted by Vasquez and others as singular for holding that predestination to the first grace was upon foresight of the future good use of that grace as the cause: But he denies that the first grace is actually given on the same cause: Therefore Vasquez thinks he changed his mind.) 2. And all men that ascribe intentions, volitions or purposes to God, do and must make the object of them as such to be quid cognitum [what is known], or something which some call an idea in the mind of God; It is not a prius volitum qua tale [first volition as such] that is the object of a volition, but bonum intellectum [the intellectual good]. And therefore nothing but foresight or apprehension of the thing needs to be put in the description of the object. Nor do I deny but that we must in our ordinary discourse speak comprehensively, and denominate ‘election’ eminently from the noblest parts: For as our full salvation includes all, or almost all, so our conversion and glorification presupposes all that antecedes. And therefore as we may and must talk of salvation in general, and not always stand to mention all the parts of it, so must we eminently talk of election to salvation as comprehending the rest, and not always stand to distinguish of the parts. But when you will make a controversy of the order and the object of these acts or parts, we must distinguish.</p></blockquote>

 glorify men, is man sanctifying and persevering in an immediate capacity for glory in esse cognito [known being]. 2. The object of God’s will to give the grace of perseverance, is a foreseen sanctified person in the next capacity. 3. The object of God’s will to justify, sanctify and adopt, is a foreseen believer. 4. The object of God’s will to give special grace, which shall effectually cause men to repent and believe, is ordinarily a foreseen disposed sinner prepared by his common grace, but sometimes an unprepared sinner, whom, of his free will, he will suddenly convert, as it pleases him freely to distribute his benefits (all being unworthy). 5. The object of God’s will, to give the highest degrees of common grace, external (in the purest preaching of the Gospel, and other mercies) and internal (in greater helps of the Spirit) is sometimes a sinner in esse cognito, who has not grossly rejected lower helps, and sometimes freely the worser sort of sinners who have abused former mercies. 6. The object of God’s will to give the first common mercy which has a tendency in its use to men’s recovery and salvation, is all mankind fallen in Adam: For all are under the New Covenant of Grace made with Adam, Gen. 3:15, in some degree (and with Noah) and all have much mercy tending to repentance; and none are left as the devils in despair, without any offered remedy or help. 7. The object of God’s will to give man the Covenant of Innocency, was Adam foreseen as mere man. 8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that: 1. God’s power makes it possible for all things to be. 2. Next God knows them possible. 3. He knows what is convenient or fit to be made to his unsearchable ends. 4. He wills that they shall be, and man among the rest, and so on. If you will needs have the order of decrees, this is all that we can say of them. Arminian: All this pleases us well: but it will not please your own [moderate] party or the Calvinists that you make so many acts of election, which they tell you is but one entire thing, as mentioned in Scripture: Nor yet that you lay every decree or will upon foresight. Baxter: You are mistaken. No moderate, considerate man of them will deny anything that I have said, for: 1. As to the Scripture use of the word ‘election’, it is not the mere name that we are now opening, but the matter in question. Nor is it the expounding of particular texts that I am upon; and if I were, no man will deny but that the word ‘election’ is variously used in the Scripture: sometime for God’s eternal will to make us Christians of infidels, and to save us by Christ; and sometime for actual choosing us by converting grace in time; and sometime for actual choosing men in time by vocation to some office or special work, etc. And as to the distinguishing of all these volitions of God, no man will deny the effects to be distinct. Undoubtedly these are various effects of God: 1. To make man. 2. To give him the Covenant of Innocency. 3. To give him the Covenant of Grace, with all the common mercies of it. 4. To give some persons and nations the gospel and other mercies above the greatest part of the world, with answerable helps of the Spirit. 5. To give men special grace, effectual for faith and repentance. 6. To give men pardon, adoption and sanctification. 7. To give men perseverance. 8. To give them glory. And if these are various works, either you will distinguish of God’s will by his various works, or not. (Sive secundum nostram rationem distinguamus illud decretum in plura, sive dicamus esse unicum, non est multum curandum: Certum enim est apud omnes, Deum omnia et singula voluisse unico simplicissimo acta suae voluntatis: Est enim ipsius voluntas, et voluntatis operatio idem quod sua essentia simplex et individua si aliquis contenderet esse etiam nostro modo intelligendi esse unicum actum simplicissimum voluntatis, ego non curabo. [Whether, according to our manner of conceiving, we distinguish that decree into several [acts], or whether we say that it is one [act], it is not much to be concerned about. For it is certain among all, that God willed all things and each individual thing by one most simple act of His will. For His will, and the operation of His will, is the same as his simple and undivided essence. If someone were to contend that even according to our manner of understanding, there is one single most simple act of the will, I would not be concerned.] Vasquez on Thomas, pt. 1, quest. 14, art. 13, disp. 65; and is not this a short end of many controversies?) If you do not, our whole controversy about the order of the decrees is quickly at an end (and I am content with the abbreviation): For where there is no distinction, there is no order. And when I distinguish them never so much, I say, as well as any, that they are all one in regard of the one will or essence of God that wills them. In God there is no real diversity; but his will is thus variously denominated extrinsically from its respect to the various objects to which it does trans[p]ire, and of the various effects which it produces. And thus do all men talk of God. Else they could not distinguish his saving will from his damning will; nor election from rejection, in his decree. So that no man can tell how to differ here. And as to foresight, you as much mistake. For: 1. I say not that God foresees any good in any man, but what He gives him and wills to give him. But we speak of the order of those volitions in the way of execution. (Alexander Alesius is noted by Vasquez and others as singular for holding that predestination to the first grace was upon foresight of the future good use of that grace as the cause: But he denies that the first grace is actually given on the same cause: Therefore Vasquez thinks he changed his mind.) 2. And all men that ascribe intentions, volitions or purposes to God, do and must make the object of them as such to be quid cognitum [what is known], or something which some call an idea in the mind of God; It is not a prius volitum qua tale [first volition as such] that is the object of a volition, but bonum intellectum [the intellectual good]. And therefore nothing but foresight or apprehension of the thing needs to be put in the description of the object. Nor do I deny but that we must in our ordinary discourse speak comprehensively, and denominate ‘election’ eminently from the noblest parts: For as our full salvation includes all, or almost all, so our conversion and glorification presupposes all that antecedes. And therefore as we may and must talk of salvation in general, and not always stand to mention all the parts of it, so must we eminently talk of election to salvation as comprehending the rest, and not always stand to distinguish of the parts. But when you will make a controversy of the order and the object of these acts or parts, we must distinguish.”

— Richard Baxter, Catholic Theology (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, pp. 12-14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEither+you+will+distinguish+God%E2%80%99s+decrees+by+the+objects%2C+or+not.+If+not%2C+you+must+not+distinguish+between+election+and+rejection%2C+willing+and+nilling%2C+loving+Peter+and+hating+Judas%2C+etc.+If+yea%2C+then+you+must+not+take+up+with+the+unexplained+words%2C+%E2%80%98reprobation%E2%80%99+and+%E2%80%98election%E2%80%99.+1.+By+reprobation+is+meant+either+God%E2%80%99s+will+to+punish+men.+2.+Or+his+will+to+give+them+no+special+saving+grace.+3.+Or+his+not-willing+to+give+it+them.+For+the+first%2C+I+told+you+before+that+the+object+of+God%E2%80%99s+will+to+punish+men+in+Hell+is+a+sinner+foreseen+finally+rejecting+mercy.+2.+The+object+of+his+will+to+punish+men+with+positive+temporal+punishments+is+the+sinner+foreseen+in+his+immediate+capacity+for+them.+3.+Whether+punishment+by+not+giving+that+Spirit+for+faith%2C+repentance+and+holiness%2C+be+decreed+%28being+nothing+but+a+not-giving%29+is+before+discussed.+But+if+it+could+be+proved%2C+yet+the+object+of+God%E2%80%99s+denying+further+mercy+and+help%2C+is+evermore+one+that+has+abused+former+mercy%2C+or+refuses+that+as+offered+to+him.+%28idem%2C+d.+95%2C+1+Ferrariensis+plane+indicat+Deum+neminem+damnare%2C+aut+rejicere+a+regno+suo+voluisse%2C+quod+ipse+appellat+deserere%2C+nisi+pravisa+culpa+%5BFerrariensis+plainly+indicates+that+God+willed+to+damn+no+one+or+to+reject+anyone+from+his+kingdom%2C+which+he+calls+%E2%80%98to+desert%2C%E2%80%99+except+on+account+of+foreseen+sin.%5D.%29+4.+But+God%E2%80%99s+non-volition+to+give+grace+is+no+act+and+has+no+object.+But+we+judge+that+all+mankind+are+now+from+under+the+mere+Covenant+of+Innocency%2C+and+that+none+perish+but+for+the+abuse+of+mercy%2C+which+had+a+tendency+to+their+recovery+%28the+case+of+infants+must+be+spoke+to+in+its+place+once+for+all%29.+But+all+this+belongs+to+the+case+of+grace+and+free-will.+And+2.+As+for+election%2C+we+say+that%3A+%28How+Augustine+distinguished+election+to+justification+and+%5Belection%5D+to+glory%2C+see+him%2C+bk.+1%2C+to+Simplicius%2C+quest.+2+and+that+which+about+this+Vasquez+has+on+Thomas%2C+pt.+1%2C+disp.+89%2C+ch.+6%29+1.+The+object+of+God%E2%80%99s+will+to+glorify+men%2C+is+man+sanctifying+and+persevering+in+an+immediate+capacity+for+glory+in+esse+cognito+%5Bknown+being%5D.+2.+The+object+of+God%E2%80%99s+will+to+give+the+grace+of+perseverance%2C+is+a+foreseen+sanctified+person+in+the+next+capacity.+3.+The+object+of+God%E2%80%99s+will+to+justify%2C+sanctify+and+adopt%2C+is+a+foreseen+believer.+4.+The+object+of+God%E2%80%99s+will+to+give+special+grace%2C+which+shall+effectually+cause+men+to+repent+and+believe%2C+is+ordinarily+a+foreseen+disposed+sinner+prepared+by+his+common+grace%2C+but+sometimes+an+unprepared+sinner%2C+whom%2C+of+his+free+will%2C+he+will+suddenly+convert%2C+as+it+pleases+him+freely+to+distribute+his+benefits+%28all+being+unworthy%29.+5.+The+object+of+God%E2%80%99s+will%2C+to+give+the+highest+degrees+of+common+grace%2C+external+%28in+the+purest+preaching+of+the+Gospel%2C+and+other+mercies%29+and+internal+%28in+greater+helps+of+the+Spirit%29+is+sometimes+a+sinner+in+esse+cognito%2C+who+has+not+grossly+rejected+lower+helps%2C+and+sometimes+freely+the+worser+sort+of+sinners+who+have+abused+former+mercies.+6.+The+object+of+God%E2%80%99s+will+to+give+the+first+common+mercy+which+has+a+tendency+in+its+use+to+men%E2%80%99s+recovery+and+salvation%2C+is+all+mankind+fallen+in+Adam%3A+For+all+are+under+the+New+Covenant+of+Grace+made+with+Adam%2C+Gen.+3%3A15%2C+in+some+degree+%28and+with+Noah%29+and+all+have+much+mercy+tending+to+repentance%3B+and+none+are+left+as+the+devils+in+despair%2C+without+any+offered+remedy+or+help.+7.+The+object+of+God%E2%80%99s+will+to+give+man+the+Covenant+of+Innocency%2C+was+Adam+foreseen+as+mere+man.+8.+The+object+of+God%E2%80%99s+will+to+create+man+was+nothing%2C+in+the+sense+that+we+now+take+an+object+in%2C+that+is%2C+for+the+materia+circa+quam+%5Bmatter+around+which%5D.+But+if+you+will+call+the+intended+effect+the+object%2C+then+the+object+of+God%E2%80%99s+will+here+%28and+in+the+rest%29+is+the+thing+willed.+But+if+you+will+needs+presume+to+seek+one+higher+in+the+mind+of+God+%28man+knows+by+reception+and+so+has+ideas%2C+but+God+can+be+no+recipient%29%2C+you+must+say+that+it+was+man+as+conceived+fit+to+be%2C+as+well+as+possible.+For+we+can+think+no+otherwise+of+the+divine+conceptions+and+volitions+but+as+we+are+led+by+the+analogy+of+human+acts.+And+so+we+must+say+that%3A+1.+God%E2%80%99s+power+makes+it+possible+for+all+things+to+be.+2.+Next+God+knows+them+possible.+3.+He+knows+what+is+convenient+or+fit+to+be+made+to+his+unsearchable+ends.+4.+He+wills+that+they+shall+be%2C+and+man+among+the+rest%2C+and+so+on.+If+you+will+needs+have+the+order+of+decrees%2C+this+is+all+that+we+can+say+of+them.+Arminian%3A+All+this+pleases+us+well%3A+but+it+will+not+please+your+own+%5Bmoderate%5D+party+or+the+Calvinists+that+you+make+so+many+acts+of+election%2C+which+they+tell+you+is+but+one+entire+thing%2C+as+mentioned+in+Scripture%3A+Nor+yet+that+you+lay+every+decree+or+will+upon+foresight.+Baxter%3A+You+are+mistaken.+No+moderate%2C+considerate+man+of+them+will+deny+anything+that+I+have+said%2C+for%3A+1.+As+to+the+Scripture+use+of+the+word+%E2%80%98election%E2%80%99%2C+it+is+not+the+mere+name+that+we+are+now+opening%2C+but+the+matter+in+question.+Nor+is+it+the+expounding+of+particular+texts+that+I+am+upon%3B+and+if+I+were%2C+no+man+will+deny+but+that+the+word+%E2%80%98election%E2%80%99+is+variously+used+in+the+Scripture%3A+sometime+for+God%E2%80%99s+eternal+will+to+make+us+Christians+of+infidels%2C+and+to+save+us+by+Christ%3B+and+sometime+for+actual+choosing+us+by+converting+grace+in+time%3B+and+sometime+for+actual+choosing+men+in+time+by+vocation+to+some+office+or+special+work%2C+etc.+And+as+to+the+distinguishing+of+all+these+volitions+of+God%2C+no+man+will+deny+the+effects+to+be+distinct.+Undoubtedly+these+are+various+effects+of+God%3A+1.+To+make+man.+2.+To+give+him+the+Covenant+of+Innocency.+3.+To+give+him+the+Covenant+of+Grace%2C+with+all+the+common+mercies+of+it.+4.+To+give+some+persons+and+nations+the+gospel+and+other+mercies+above+the+greatest+part+of+the+world%2C+with+answerable+helps+of+the+Spirit.+5.+To+give+men+special+grace%2C+effectual+for+faith+and+repentance.+6.+To+give+men+pardon%2C+adoption+and+sanctification.+7.+To+give+men+perseverance.+8.+To+give+them+glory.+And+if+these+are+various+works%2C+either+you+will+distinguish+of+God%E2%80%99s+will+by+his+various+works%2C+or+not.+%28Sive+secundum+nostram+rationem+distinguamus+illud+decretum+in+plura%2C+sive+dicamus+esse+unicum%2C+non+est+multum+curandum%3A+Certum+enim+est+apud+omnes%2C+Deum+omnia+et+singula+voluisse+unico+simplicissimo+acta+suae+voluntatis%3A+Est+enim+ipsius+voluntas%2C+et+voluntatis+operatio+idem+quod+sua+essentia+simplex+et+individua+si+aliquis+contenderet+esse+etiam+nostro+modo+intelligendi+esse+unicum+actum+simplicissimum+voluntatis%2C+ego+non+curabo.+%5BWhether%2C+according+to+our+manner+of+conceiving%2C+we+distinguish+that+decree+into+several+%5Bacts%5D%2C+or+whether+we+say+that+it+is+one+%5Bact%5D%2C+it+is+not+much+to+be+concerned+about.+For+it+is+certain+among+all%2C+that+God+willed+all+things+and+each+individual+thing+by+one+most+simple+act+of+His+will.+For+His+will%2C+and+the+operation+of+His+will%2C+is+the+same+as+his+simple+and+undivided+essence.+If+someone+were+to+contend+that+even+according+to+our+manner+of+understanding%2C+there+is+one+single+most+simple+act+of+the+will%2C+I+would+not+be+concerned.%5D+Vasquez+on+Thomas%2C+pt.+1%2C+quest.+14%2C+art.+13%2C+disp.+65%3B+and+is+not+this+a+short+end+of+many+controversies%3F%29+If+you+do+not%2C+our+whole+controversy+about+the+order+of+the+decrees+is+quickly+at+an+end+%28and+I+am+content+with+the+abbreviation%29%3A+For+where+there+is+no+distinction%2C+there+is+no+order.+And+when+I+distinguish+them+never+so+much%2C+I+say%2C+as+well+as+any%2C+that+they+are+all+one+in+regard+of+the+one+will+or+essence+of+God+that+wills+them.+In+God+there+is+no+real+diversity%3B+but+his+will+is+thus+variously+denominated+extrinsically+from+its+respect+to+the+various+objects+to+which+it+does+trans%5Bp%5Dire%2C+and+of+the+various+effects+which+it+produces.+And+thus+do+all+men+talk+of+God.+Else+they+could+not+distinguish+his+saving+will+from+his+damning+will%3B+nor+election+from+rejection%2C+in+his+decree.+So+that+no+man+can+tell+how+to+differ+here.+And+as+to+foresight%2C+you+as+much+mistake.+For%3A+1.+I+say+not+that+God+foresees+any+good+in+any+man%2C+but+what+He+gives+him+and+wills+to+give+him.+But+we+speak+of+the+order+of+those+volitions+in+the+way+of+execution.+%28Alexander+Alesius+is+noted+by+Vasquez+and+others+as+singular+for+holding+that+predestination+to+the+first+grace+was+upon+foresight+of+the+future+good+use+of+that+grace+as+the+cause%3A+But+he+denies+that+the+first+grace+is+actually+given+on+the+same+cause%3A+Therefore+Vasquez+thinks+he+changed+his+mind.%29+2.+And+all+men+that+ascribe+intentions%2C+volitions+or+purposes+to+God%2C+do+and+must+make+the+object+of+them+as+such+to+be+quid+cognitum+%5Bwhat+is+known%5D%2C+or+something+which+some+call+an+idea+in+the+mind+of+God%3B+It+is+not+a+prius+volitum+qua+tale+%5Bfirst+volition+as+such%5D+that+is+the+object+of+a+volition%2C+but+bonum+intellectum+%5Bthe+intellectual+good%5D.+And+therefore+nothing+but+foresight+or+apprehension+of+the+thing+needs+to+be+put+in+the+description+of+the+object.+Nor+do+I+deny+but+that+we+must+in+our+ordinary+discourse+speak+comprehensively%2C+and+denominate+%E2%80%98election%E2%80%99+eminently+from+the+noblest+parts%3A+For+as+our+full+salvation+includes+all%2C+or+almost+all%2C+so+our+conversion+and+glorification+presupposes+all+that+antecedes.+And+therefore+as+we+may+and+must+talk+of+salvation+in+general%2C+and+not+always+stand+to+mention+all+the+parts+of+it%2C+so+must+we+eminently+talk+of+election+to+salvation+as+comprehending+the+rest%2C+and+not+always+stand+to+distinguish+of+the+parts.+But+when+you+will+make+a+controversy+of+the+order+and+the+object+of+these+acts+or+parts%2C+we+must+distinguish.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology+%28London%3A+White%2C+1675%29%2C+pt.+2%2C+1st+Day%E2%80%99s+Conference%2C+about+Predestination%2C+pp.+12-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89e695a2a9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89e695a2a9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=Either%20you%20will%20distinguish%20God%E2%80%99s%20decrees,acts%20or%20parts%2C%20we%20must%20distinguish&amp;text=Either%20you%20will%20distinguish%20God%E2%80%99s%20decrees%20by%20the&amp;text=of%20these%20acts%20or%20parts%2C%20we%20must%20distinguish" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>135. Should I proceed to explain to you all or half of the questions about which the sharpest-witted Schoolmen merely dream concerning the knowledge and decrees of God, I would tire myself and the reader to little purpose; such as, An scientia actualis aliorum sit de Essentia Dei? (Is the actual knowledge of other things part of God’s essence?), An Essentia Dei sit Motivum adaequatum ejus scientiae? (Is God’s essence the adequate motive for His knowledge?), An Deus cognoscat creaturas ex seipso, aut ex alio per discursum? (Does God know creatures from Himself, or from something else through reasoning?), An &amp; quomodo scientia Dei possit dividi in plures? (If and how can God’s knowledge be divided into multiple parts?), An &amp; quomodo Deus cognoscat Mala? (If and how does God know evil?), An &amp; quomodo Deus cognoscat negationes &amp; privationes? (If and how does God know negations and privations?), An Deus cognoscat Entia rationis? (Does God know beings of reason?), An habeat in se Entia Rationis? (Does He have beings of reason within Himself?), De scientia Media (On middle knowledge), An scientia Visionis sit causa futurorum? (Is the knowledge of vision the cause of future things?), An futura causa scientiae? (Are future things the cause of knowledge?), An scientia simplicis intelligentiae sit causa futurorum &amp; practica? (Is the knowledge of simple intelligence the cause of future things and practical?), An Deus cognoscat futura compenendo &amp; dividendo? (Does God know the future by composing and dividing?), An Deus cognoscat praesentia eadem indivisibili cognitione, qua ipsa praenovit futura? (Does God know present things with the same indivisible cognition with which He foresaw the future?), An Deus noverit Infinita scientia simplicis intelligentiae? (Does God know infinite things with the knowledge of simple intelligence?), An eadem cognitione se &amp; creaturas cognoscat? (Does He know Himself and creatures with the same cognition?), An existente objecto pro solo imperio Voluntatis Divinae possit non esse in Deo aliquis actus scientiae divino intellectui possibilis? (If an object exists solely by the empire of the Divine Will, is it possible that there is no act of knowledge in God, possible to the Divine intellect?), etc., with a multitude of lesser questions that arise from dealing with these; and with as many more about predestination, God’s decrees or volitions, predetermination, etc. I think your patience has already been sufficiently tested. 136. If you say that by reciting these difficulties, I am only confusing people’s understanding rather than clarifying the matters at hand, I answer: If you get lost in them, I achieve my goal, which is to make you aware of how inappropriate it is that the peace of the Church and the concord and communion among brethren should be based on such a multitude of difficult and unsearchable things—some of which are vain, and others beyond human understanding. Should we call one another by sect names and reproach our brethren as if it were for God’s truth and glory until all these controversies are cleared up for everyone? I, who admit that they are beyond my reach and acknowledge my ignorance of many of them, am still censured by my brethren for being too scholastically curious for merely mentioning or engaging with them; yes, even for deciding cases that can and must be decided. And of all our present ministers, I am confident that not one in fifty (if even one in a hundred) has thoroughly studied them or ever will. Now, if the Church is to have love and concord, how will it be achieved? Of those few (one in a hundred who studied them thoroughly), six men will likely hold three different opinions. And what will the other ninety-nine do who have never studied them? Either they must know what they have never studied and be right where they do not understand what they are saying, or else they must unite by implicit faith. And in whom should that be? In the Church? Which Church is it? Are not many churches of many minds? If in the Papal Church, it has more sense than to decide such controversies, so that their doctors are still almost sectarian, divided to this day. 137. And if anyone dreams that the controversies between Calvinists and Lutherans (or Arminians) and between Dominicans and Jesuits can be resolved for either side without engaging with these questions, that person is too ignorant to be fit to speak confidently on the matter. Let them try to engage in a dispute with any capable adversary, and they will be led to these issues whether they want to or not. 138. But if it is someone so confident in either position that they believe their side or opinions are so great and clear that the contrary positions are unworthy of our tolerance and communion, I must be frank enough to say that they exhibit such ignorance and pride as to make their own fitness for communion much more questionable. For is it not the most odious ignorance for a person not to recognize their own ignorance of so many mysteries that no mortals know? And is it not loathsome pride for people to be so confident in these false notions and arrogate to themselves a knowledge that human existence is incapable of attaining? 139. And I am filled with shame to see that, although there has been some recent turmoil against the Jansenists, all these sects (Dominicans, Jesuits, Scotists, Nominals, etc.) manage to live in communion despite their differences, while Protestants have pursued the same differences with all the bitterness you can find in German historians and theologians (such as Schlusselburgius, Calovius, and many others), in the sad history of the Low Countries, and in Heylin’s Life of Archbishop Laud. You can still hear it in all parties today, in their ignorant censures of one another, using the names of Calvinists and Arminians. And yet, we rightly condemn the Church of Rome for its uncharitable cruelty against dissenters, while in doing so, we condemn ourselves.</p></blockquote>

<blockquote><p>But instead of attending to the true state of the controversy, and instead of referring the decision of it to the divine oracles, tradition and corruption has carried them into the way which this writer pursues, of representing our doctrine to be, that God decrees some men to misery in the same manner that he does others to happiness; yea this slanderer, in imitation of those who have gone before him, sets reprobation foremost, and would have people believe that we hold, God’s first design to be the damnation of multitudes, and then secondly, the irresistible salvation of a number!</p></blockquote>

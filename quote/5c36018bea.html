<blockquote><p>After some overtures of a Match in the Reign of King Henry the Eighth, the Reformed Church in this Kingdom was solemnly married to Jesus Christ, when the Sceptre was swayed by Edward the Sixth: that godly young Prince (as became the Bridegroom’s friend) rejoicing greatly because of the Bridegroom’s voice.

The famous nine and thirty Articles of her Confession then framed, were an evident sign of her being with child, and that a thorough Reformation was then conceived, though but conceived. Many and fore were the breeding fits she conflicted with in Queen Mary’s days, and such as gave occasion to fear that she would have miscarried.

But God sent her ease from heaven under the succeeding Princes: in which condition she went on for a long while, drawing still nearer and nearer her time. Six years ago, after this Parliament had sate a while it was generally believed that she was false into her travel. And, in the midst of all those sorrows which have befallen England since, her friends encouraged themselves with this hope, that the quicker and sharper her pains grew, the liker she was to be speedily delivered of that man-child, which was by them so greedily expected.

But, behold, as if all these had been but fore-runners of her labour, not bearing-throws, she continues still in pain: insomuch as they now begin to think she has not gone her full time, and earnestly to desire she may; because they fear nothing more than an abortive Reformation. However, evident it is, not only that her pains are multiplied, but that they are caused, partly by the malignity of her enemies, who have embroiled her in a bloody Civil War …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), pp 35-36.</span></figcaption>

<blockquote><p>I. The first thing is, to take notice of some of those pernicious winds wherewith the church of Christ is infested while here in a militant state.

1. Then, There is the wind of open violence, persecution, and bloodshed. The roaring lion he delights in blood, especially the blood of the saints, who are the true seed of the woman, and therefore commonly this is the first thing that he essays in order to ruin the church of Christ. Hence he instigated Cain to slay his brother Abel. He instigated the Jews to crucify the Lord of glory, and to persecute his apostles: and the Romans, by ten several persecutions, to raze the Christian church if possible from the face of the earth.

And it is well known how he did instigate malignant men in power under some reigns before the late revolution, to essay, by persecution and bloodshed, to raze a covenanted reformation, and all that owned it, from off the face of the earth. And we see the same spirit of enmity at this day raging against that same work and cause under another denomination; only the great Angel of the covenant does not allow as yet that wind to blow; but how soon the permission is given, I make no doubt but we may see the Grassmarket, and other places through Scotland, reeking as fast as ever with the blood of the saints.</p></blockquote>

<blockquote><p>Objection II. Believers are governed by God’s Spirit, and therefore outward government by magistrates is needless. Answer. In the visible church, hypocrites are mingled with true believers, and they are not governed by God’s Spirit, but by the spirit of the devil. And therefore in respect of them, civil authority is requisite. Again, true believers are but in part governed by the Spirit for the time of this life. And for this cause, civil government is requisite for the ordering of the outward man and for the protection of the church.</p></blockquote>

<blockquote><p>These groups and crowds of men, besides the general evils of guilt and depravity derived from the first Adam, are still farther entangled in the snare of the devil by the old inventions of Hindoo heathenism, and by the mischievous delusions of Mahomedanism. How affecting is the degree of their miserable estrangement from God, and from righteousness, which is disclosed by this fact, that to the extent of several thousands every year, female infants were barbarously murdered by their parents in these quarters; till, by the humane interference of some agents of the British Government at Bombay, a few years ago, the horrible practice was in some places laid aside. Pitiable indeed, must be the condition of those who rest satisfied with a religion which permits human beings in such lamentable forms to gratify the malice of the devil, “and to be taken captive by him at his will.” 2 Tim. ii. 26.</p></blockquote>

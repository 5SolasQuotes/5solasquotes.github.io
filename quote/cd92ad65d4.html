<blockquote><p>2. All representing of the Persons as distinct, as to set out the Father (personally considered) by the image of an old man, as if He were a creature, the Son under the image of a lamb or young man, the Holy Ghost under the image of a dove, all which wrongs the Godhead exceedingly… Again, as to what may be objected from the Lord’s appearing sometimes in the likeness of a man, or the Spirit’s descending as a dove, or as cloven tongues of fire: It is answered: 1. There is a great difference betwixt a sign of the Spirit’s presence, and a representation of the Spirit. 2. Betwixt what represents the Spirit, as He is one of the Persons of the Blessed Trinity, and what resembles some gift of his: The similitude of a dove descending upon Christ was to show his taking up his residence in Him, and furnishing Him with gifts and graces, and particularly holy simplicity and meekness without measure, and so his appearing in cloven tongues was to show his communicating the gift of tongues to the apostles. 3. Neither is there any warrant for drawing Him in these shapes, more than to look on every living dove, as representing Him: and the like may be said of God’s appearing sometimes in human likeness, it was but that men might have some visible help to discern something of God’s presence, but not to give any representation of Him, and these bodies were but for a time assumed, as a praelude and forerunning evidence of the Son’s being to become man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, … (London, 1675), 1st Commandment, p. 56</span></figcaption>

<blockquote><p>And indeed it [the Exodus] was the greatest typ of Christ’s redemption of any providential event whatsoever. This was by Jesus Christ, for it was wrought by Him who appeared to Moses to redeem that people. But that was Christ, as is evident, because He is called ‘the angel of the Lord,’ Ed. 3:2-3. The bush represented the human nature of Christ, who is called the ‘branch.’ This bush grew on mount Sinai or Horeb, a word that signifies a dry place, as the human nature of Christ was a root out of dry ground. The bush burning with fire, represented the sufferings of Christ, in the fire of God’s wrath. It burned, and was not consumed; so Christ, though He suffered extremely, yet perished not; but overcame at last, and rose from his sufferings. Because this great mystery of the incarnation and sufferings of Christ was here represented, therefore Moses says, ‘I will turn aside, and behold this great sight.’ A great sight he might well call it, when there was represented, ‘God manifest in the flesh,’ suffering a dreadful death, and rising from the dead.</p></blockquote>

<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>

</figure><figure class="quote" id="q-5f6717e9f4" data-kw="">
<blockquote><p>The worst men and the most superstitious will yet pretend the honoring of God. So it is again in regard of those days that men have set apart for God, and it is that which has settled men in the superstitious observation of them, that it is for the honor of Christ. ‘What’ (say they) ‘shall we not honor the birth of our blessed Savior?’ What a profaness, what a disrespect is this unto Jesus Christ? ‘Well let others do what they will, for our parts we will do it, for hereby we shall do honor unto our blessed Savior.’ So the Papists for the adoration of images, say they, ‘What not regard, not to reverence the image the picture of our blessed Savior and of the holy saints?’ And the truth is if it be duly weighed, there is the same reason of images of Christ and the saints, and of days set apart for the honor of Christ by man’s invention; and there is as fair a pretence of honoring Christ by setting up his image before me to put me in mind of Him as of honoring of Him by keeping a day of mine own appointment. There is (I say) the same reason of both, and whatsoever argument any man shall bring me against the one, I dare undertake to make it good to be against the other. As now, is not natural reason as strong to set up the picture of the King to honor him (and you do it for that end) is not this as much as to keep a day once a year to remember him? So the reason may be as strong to honor Christ by way of picture as to honor Him by observing any day set apart for that end by the inventions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea</cite>, … (London: Cole, 1650), on Hos. 5:6, pp. 408-9</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The worst men and the most superstitious will yet pretend the honoring of God. So it is again in regard of those days that men have set apart for God, and it is that which has settled men in the superstitious observation of them, that it is for the honor of Christ. ‘What’ (say they) ‘shall we not honor the birth of our blessed Savior?’ What a profaness, what a disrespect is this unto Jesus Christ? ‘Well let others do what they will, for our parts we will do it, for hereby we shall do honor unto our blessed Savior.’ So the Papists for the adoration of images, say they, ‘What not regard, not to reverence the image the picture of our blessed Savior and of the holy saints?’ And the truth is if it be duly weighed, there is the same reason of images of Christ and the saints, and of days set apart for the honor of Christ by man’s invention; and there is as fair a pretence of honoring Christ by setting up his image before me to put me in mind of Him as of honoring of Him by keeping a day of mine own appointment. There is (I say) the same reason of both, and whatsoever argument any man shall bring me against the one, I dare undertake to make it good to be against the other. As now, is not natural reason as strong to set up the picture of the King to honor him (and you do it for that end) is not this as much as to keep a day once a year to remember him? So the reason may be as strong to honor Christ by way of picture as to honor Him by observing any day set apart for that end by the inventions of men.”

— Jeremiah Burroughs, An Exposition with Practical Observations continued upon the Fourth, Fifth, Sixth &amp; Seventh Chapters of the Prophesy of Hosea… (London: Cole, 1650), on Hos. 5:6, pp. 408-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+worst+men+and+the+most+superstitious+will+yet+pretend+the+honoring+of+God.+So+it+is+again+in+regard+of+those+days+that+men+have+set+apart+for+God%2C+and+it+is+that+which+has+settled+men+in+the+superstitious+observation+of+them%2C+that+it+is+for+the+honor+of+Christ.+%E2%80%98What%E2%80%99+%28say+they%29+%E2%80%98shall+we+not+honor+the+birth+of+our+blessed+Savior%3F%E2%80%99+What+a+profaness%2C+what+a+disrespect+is+this+unto+Jesus+Christ%3F+%E2%80%98Well+let+others+do+what+they+will%2C+for+our+parts+we+will+do+it%2C+for+hereby+we+shall+do+honor+unto+our+blessed+Savior.%E2%80%99+So+the+Papists+for+the+adoration+of+images%2C+say+they%2C+%E2%80%98What+not+regard%2C+not+to+reverence+the+image+the+picture+of+our+blessed+Savior+and+of+the+holy+saints%3F%E2%80%99+And+the+truth+is+if+it+be+duly+weighed%2C+there+is+the+same+reason+of+images+of+Christ+and+the+saints%2C+and+of+days+set+apart+for+the+honor+of+Christ+by+man%E2%80%99s+invention%3B+and+there+is+as+fair+a+pretence+of+honoring+Christ+by+setting+up+his+image+before+me+to+put+me+in+mind+of+Him+as+of+honoring+of+Him+by+keeping+a+day+of+mine+own+appointment.+There+is+%28I+say%29+the+same+reason+of+both%2C+and+whatsoever+argument+any+man+shall+bring+me+against+the+one%2C+I+dare+undertake+to+make+it+good+to+be+against+the+other.+As+now%2C+is+not+natural+reason+as+strong+to+set+up+the+picture+of+the+King+to+honor+him+%28and+you+do+it+for+that+end%29+is+not+this+as+much+as+to+keep+a+day+once+a+year+to+remember+him%3F+So+the+reason+may+be+as+strong+to+honor+Christ+by+way+of+picture+as+to+honor+Him+by+observing+any+day+set+apart+for+that+end+by+the+inventions+of+men.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+An+Exposition+with+Practical+Observations+continued+upon+the+Fourth%2C+Fifth%2C+Sixth+%26+Seventh+Chapters+of+the+Prophesy+of+Hosea%E2%80%A6+%28London%3A+Cole%2C+1650%29%2C+on+Hos.+5%3A6%2C+pp.+408-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5f6717e9f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5f6717e9f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=The%20worst%20men%20and%20the%20most,end%20by%20the%20inventions%20of%20men&amp;text=The%20worst%20men%20and%20the%20most%20superstitious%20will&amp;text=for%20that%20end%20by%20the%20inventions%20of%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

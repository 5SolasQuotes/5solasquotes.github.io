<main class="wrap"><figure class="quote" id="q-32f00b7ae9" data-kw="">
<blockquote><p>Doctrine. Christ did not of his own swing and Counsel leap into the Office of Reconciliation, but by the Authority and Ordination of God and the Holy Spirit. So that whatsoever was done by Christ in that Office, was done by the will and common consent of the Trinity. Heb. 5. chap. 4, and 5. verses.

So that whosoever embraces Christ, he doth by the same means and at the same time come into favour with the whole Trinity, who committed this Office to Christ; as on the contrary, they that despise Christ the Anointed of God, in vain do they boast of God; when as together with Christ, they reject the Father and the Spirit. And hence appears the miserable Condition of the Jews, Turks, and all Infidels, who refuse to hearken to the Anointed of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brightman.html">Thomas Brightman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brightman redivivus: or The post-humian of-spring of Mr. Thomas Brightman, in IIII. sermons. Viz. 1. Of the two covenants. 2. The danger of scandals. 3. God’s commission to Christ to preach the Gospel. 4. The saint’s security</cite>, (London: John Rothwell, 1647), p. 50.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

So that whosoever embraces Christ, he doth by the same means and at the same time come into favour with the whole Trinity, who committed this Office to Christ; as on the contrary, they that despise Christ the Anointed of God, in vain do they boast of God; when as together with Christ, they reject the Father and the Spirit. And hence appears the miserable Condition of the Jews, Turks, and all Infidels, who refuse to hearken to the Anointed of God.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74f7b69b0b" data-kw="">
<blockquote><p>God. This refers to one eternal, infinite, unchangeable, spiritual being who is distinguished in three separate persons: Father, Son, and Holy Ghost. Deuteronomy 6:4 says, “Hear, O Israel, the LORD our God is one LORD.” “There is one God, and one mediator,” says 1 Timothy 2:5. But Isaiah 61:1 refers to God as more than one person, saying, “The Spirit of the Lord GOD is upon me, because the LORD hath anointed me.” One person anoints, another is being anointed, and the object of the anointing is still another person. One person of the Godhead prays, He prays to another person, and still another person is sent; yet there is only one God. Therefore, we apply the word God to the Father, the Son, and the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/godefridus-udemans.html">Godefridus Udemans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Faith, Hope, and Love</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke (1621; Grand Rapids MI: Reformation Heritage Books, 2012), p. 51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-4e4c463168" data-kw="Sabellius Arius Socinus">
<blockquote><p>Thus Sabellius did not deny that they were three—the Father, the Son and the Holy Spirit—because Scripture says this; but he made one person of those three, calling them by various names by reason of diverse operation. Arius did not deny that Christ was God, but he understood him to be a factitious and dependent God. Socinus confesses Christ to be the Son of God, but with respect to office and power, not with respect to nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.23.20</span></figcaption>

</figure><figure class="quote" id="q-11c5b7239b" data-kw="Father God only begotten">
<blockquote><p>Secondly, It is proposed as the object of our faith, that the Father is God. … For the Father, as he whom we worship, is often called so only with reference unto his Son; as the Son is so with reference to the Father. He is the “only begotten of the Father,” John 1:14.</p></blockquote>

</figure><figure class="quote" id="q-7b986718c5" data-kw="">
<blockquote><p>The point of the Trinity it is a speculative point, and it tends to practice. First, to be a foundation of our worship, that we worship one God in three persons. And then it tends to shew the unity among Christians, that God will work among Christians at length, that they shall be all one in some sort, as the Father, Son, and Holy Ghost are one: which, though it be a point of high and deep speculation, yet it tends to practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Contentment</cite>, (London, 1637) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), v, 183.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

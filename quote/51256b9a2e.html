<main class="wrap"><figure class="quote" id="q-51256b9a2e" data-kw="">
<blockquote><p>It follows not, because, though I say every thing may defend it self by nature, yet I say also it must do it modo suo &amp; naturae suae convenienti; we say that all creatures do defend themselves, and it is natural so to do; yet we do not therefore say that a beast defends himself in the same manner as a man doth, or a man as a beast, but in a way suitable to every nature.

Now if a private person be in danger to be oppressed by a Prince, flying is more fit defence for him, and therefore saith our Saviour, If they persecute thee in one City, flee to another: but if the State be wronged and oppressed, which is a public grievance, then the State, and those that represent them are more fit to take up Arms for its preservation.

For Nature in general teacheth self-preservation; Nature specificated teacheth this or that preservation: now the nature of a community, and of a particular person are distinct, and therefore though I say a community is to defend it self because sui tutela is natural to every thing; yet I do not say, that a particular private person may ordinarily defend himself in that way which is most suitable to the community as the taking up of Arms is, yet I suppose no moderate man will deny this that the Subjects (though) not invested with authority have a power to keep out an enemy from landing in case of foreign invasion, yea though the King’s Officers should be negligent therein; or so malicious and treacherous as to forbid them to defend themselves and their Country.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), p. 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd794d0d80" data-kw="">
<blockquote><p>Ingrossers; that hoard up commodities, and by stopping their propagation raise the price; these are thieves. Many Block-houses in the city, monopolies in the court, garners in the country, can testify, there are now such thieves abroad: we complain of a dearth; sure the heavens are too merciful to us, that are so unmerciful one to another: scarcity comes without God’s sending: who brings it then? even the Devil and his brokers, engrossing misers.

The Common-wealth may often blow her nails, unless she sit by an engrossers fire: her limbs may be faint with hunger, unless she buy graine at an engrosses price. I confess, this is a sin, which the Law takes notice of, but not in the full nature, as theft. The pick-purse (in my opinion) doth not so much hurt, as this general robber; for they rob millions.

These do not with Joseph, buy up the superfluity of plenty, to prevent a dearth; but hoard up the store of plenty, to procure a dearth. Rebels to God, trespassers to nature, thieves to the Common-wealth: if these were apprehended and punished, neither City nor Country should complain as they do. Mean time, the people’s curse is upon them, and I doubt not but God’s plague will follow it; if repentance turn it not away: till when, they are private thieves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The white devil, or The hypocrite uncased: In a sermon preached at Paul’s Cross, March 7. 1612</cite>, (London: Melchisedech Bradwood, 1613), p. 46.</span></figcaption>

</figure><figure class="quote" id="q-43d9e0e19c" data-kw="">
<blockquote><p>From this it follows, that subjects are no farther bound to obey the magistrate because of conscience, than in as far as he himself presides and enjoins with a good conscience, and on the authority of the Word of God: and besides, it is worthy of observation, that the wrath of the magistrate, unless directed against the disobedient, refusing to do their duty according to the injunction of Jehovah, is neither just, nor lawful, nor to be feared by his subjects, but Christians, in the Christian warfare, must pass through the midst of it to victory in Christ, by the power of the Spirit of God; as we see in the case of Daniel, who rose to victory through the lions’ den, with his three friends, who esteemed the wrath of the king as nothing in comparison with their duty to God, although the disobedient were threatened with a fiery furnace, the heat of which had been increased seven times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-ferme.html">Charles Ferme</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Logical Analysis of Romans</cite>, (†1617) on Rom. 13:5, p. 293. Ferme (1565-1617) was a reformed Scottish divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-b9fc14b721" data-kw="">
<blockquote><p>From that line and order of subordination wherein both magistrates and people are placed. The magistrate is placed under God the great Superior: and the subjects are placed under God the great, and under the magistrate the less superior. When the magistrate commandeth contrary to God, and goeth out of his order and line, especially so far as to invade by arms if they obey not, the subjects keeping their own line and order, and defending themselves, is no disobedience to the magistrate, but obedience to God, who in this point, so long as the magistrate walketh in this course, becometh their immediate superior; and as under the magistrate they ought to defend themselves against all violence from without, so in this abuse of God’s ordinance, from all violence from within, otherwise they sin against God and their own souls.

An inferior officer ought to keep his own station in the army, even when his captain goes out of his line and order, and taketh part with his enemy: and in this case he is bound no less than when he was under his general, to fight for himself, and for the safety of the whole army against him. It were against sense and reason to say, that he must give his neck to the sword of his captain, without regard to his general, the whole army, and his own life; yea, every soldier ought to defend the whole army against the general himself, if he turn an enemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instructions for Defensive Arms (1639) in Andrew Stevenson, The History of the Church and State of Scotland, from the Accession of King Charles I. to the year 1649. To which is prefixed, An Abstract of the State of Religion in Scotland, from the Earliest Ages of Christianity, to the year 1625</cite></span></figcaption>

</figure><figure class="quote" id="q-5a1e33509c" data-kw="">
<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 1</span></figcaption>

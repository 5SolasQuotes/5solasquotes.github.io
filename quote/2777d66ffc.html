<main class="wrap"><figure class="quote" id="q-2777d66ffc" data-kw="">
<blockquote><p>Concl. The former considerations being clear, we hold that such a Church-covenant is a conceit destitute of all authority of God’s Word, Old or New Testament, and therefore to be rejected as a way of men’s devising,

1. Argum. All will-worship laying a band on the Conscience, where God hath laid none, is damnable; but to tie the oath of God to one particular duty rather then another, so as you cannot, without such an oath, enter into such a state, nor have title and right to the seals of grace and God’s Ordinances, is will-worship, and that by virtue of a divine Law, and is a binding of the Conscience where God hath not bound it. …

I prove the assumption; for a Minister to swear the oath of fidelity to his flock, is lawful; but to tie an oath so to his Ministry, as to say the Apostles teach, he cannot be a minister who sweareth not that oath, is to lay a bond on the Conscience, where God hath laid none. That a father swear to perform the duties of a father, a master the duties of a master towards his servant, is lawful; but to lay a bond on him, that he is in Conscience, and before God no father, no master, except he swear to perform those duties, is to lay a bond on the Conscience where God hath laid none.

So to swear subjection to such a Ministry and visible Church, is lawful; but to tie by an Apostolic Law and practice the oath of God so to such duties, as to make this Church-oath the essential form of such membership, so as you cannot enter into Church-state, nor have right to the Seals of the Covenant without such an oath, is to bind where God hath not bound; for there is no Law of God, putting upon any Church-oath such a state, as that it is the essential form of Church-membership, without the which a man is no Church-member, and the Church visible, not swearing this oath is no Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland</cite>, (London: Richard Whittaker and Andrew Crook, 1644), pp 88, 89.</span></figcaption>

<blockquote><p>…as Papists say, their unwritten traditions are agreeable to the Word, and though beside Scripture, yet not against it: and [are] the very will of God no less than the written Word; and let Formalists assure us that their positive additaments of surplice and cross are the same which God commands in the Scriptures by the prophets and apostles, and though beside, yet not contrary to the Word: But I pray you what better is the distinction of beside the Word, not contrary to the Word of God, out of the mouth of Papists, to maintain unwritten traditions, which to them is the express Word of God, than out of the mouth of Formalists, for their unwritten positives, which are worse than Popish traditions in that they are not the express Word of God, by their own grant?</p></blockquote>

<blockquote><p>VI. If at the first it were lawful, and afterward become impossible and unlawful. For such oaths God Himself may be said to reverse. Thus if a man bind himself by oath to live in single life without marriage, and after finds that God-has not given him the gift of continency; in this case, his oath becomes impossible to be kept, and therefore, being reversed by God and becoming unlawful, it may be broken without impiety.</p></blockquote>

<blockquote><p>Though God is pleased to stoop to our weak capacities, and set himself out in scripture by eyes, to signify his omnisciency; and hands to signify his power; yet it is very absurd, from metaphors and figurative expressions, to bring an argument for images and pictures; for, by that rule, God may be pictured by the sun and the element of fire, and by a rock; for God is set forth by these metaphors in scripture; and sure the papists themselves would not like to have such images made of God.</p></blockquote>

</figure><figure class="quote" id="q-7241c527d9" data-kw="">
<blockquote><p>Magistrates certainly have a power to appoint public days, yea, annual days of thanksgivings, for mercies never to be forgotten. Indeed they cannot make a day holy, so as it shall be a sin against God to labor in it, or to use any pleasures (as in the case of the sabbath); but they may command the public worship of God to be performed on particular days, and men ought to attend it when with convenience they can; only they ought to take care that such days be not spent in luxury and profaneness, and that they be for signal providences, and not so multiplied, and frequently renewing, as that the service of them degenerate into mere matter of form. Whether Christ went up in order to the feast [of dedication], or because of the great concourse of people he knew would be there at that time, cannot be determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 22</span></figcaption>

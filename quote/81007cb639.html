<main class="wrap"><figure class="quote" id="q-81007cb639" data-kw="">
<blockquote><p>4. It is from the unsuitableness that is betwixt the things of Christ and the temper of a sinner. Christ’s yoke does no way fit a carnal heart… It is the base love of this present world that makes the call of the Gospel so unsuccessful and ineffectual; you may see it in that parable, Mt. 22:5: They make light of the tenders of Christ, and what is the reason? why the farm and the oxen, and the merchandise were in the case; these must not be left for Christ where lust has the casting voice. O how sad is this! if Christ should offer you riches and honors, you would come; and yet for heaven and glory you will not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mathew-mead.html">Mathew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good of Early Obedience, or the Advantage of Bearing the Yoke of Christ Betimes... (London: Ponder, 1683), ch. 10</cite>, pp. 264-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-099f204dae" data-kw="">
<blockquote><p>As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Heads 3–4, Art. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a> › <a href="../topics/effectual-calling/external-and-internal-call/outward-call-by-the-word.html">Outward call by the Word</a></span><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a> › <a href="../topics/the-covenant-of-grace/the-gospel-offer/the-sincere-call-to-all.html">The sincere call to all</a></span></div>

</figure><figure class="quote" id="q-acc6479fcb" data-kw="">
<blockquote><p>Calling is made (Romans 8:30) the middle link of the golden chain of salvation. It is placed between predestination and glorification; and if we have this middle link fast, we are sure of the two other ends of the chain.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a> › <a href="../topics/assurance-peace-and-joy/assurance-of-salvation/the-practical-syllogism.html">The practical syllogism</a></span><span class="t"><a href="../topics/application-of-redemption-in-general/order-of-salvation.html">Order of Salvation</a> › <a href="../topics/application-of-redemption-in-general/order-of-salvation/the-golden-chain-romans-8-30.html">The golden chain (Romans 8:30)</a></span></div>

— Thomas Watson, A Divine Cordial, p. 88">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCalling+is+made+%28Romans+8%3A30%29+the+middle+link+of+the+golden+chain+of+salvation.+It+is+placed+between+predestination+and+glorification%3B+and+if+we+have+this+middle+link+fast%2C+we+are+sure+of+the+two+other+ends+of+the+chain.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+A+Divine+Cordial%2C+p.+88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Facc6479fcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/acc6479fcb.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-b114ded39c" data-kw="">
<blockquote><p>Oh! it is a grievous thing for Christ to call and we to refuse his gracious calling… And thus we see how all under the gospel are called by the Word: Secondly, all under the gospel are called by the Spirit working within as well as by the Word preached without… Question 3. Whether the call of the Spirit be ineffectual or not?… Answer. All this [unquoted here, including Bible verses] is true of the effectual operation of the Holy Spirit, because that is certain and eternal; but there is a general work of the Spirit, which ends in perdition; that is, many may and do fall finally and totally into sin, and consequently into eternal destruction, in whom sometimes there has been some good motions, and general operations of the blessed Spirit; this is clear from these places, to wit, Mt. 7:22; 13:20; Heb. 6:4; 10:26; 2 Pet. 2:20. Now this general call and operation of the Holy Spirit has these degrees following: viz. First, an understanding of the Word, for the mere natural man cannot understand it, Mt. 16:23 &amp; 1 Cor. 2:14. Here observe two things, to wit, First, there are many in the places of the Gospel who hear the Word preached all the days of their lives and yet understand nothing, but remain children in understanding; now these never were made partakers so much as of common or general grace: Secondly, there are some who live under the Word, and do dogmatically understand the Word; now these must remember that knowledge is not enough, God having given them knowledge for practice’s sake, yea to know and not to obey will aggravate their punishment. Secondly, a taste of spiritual things and the heavenly gift, Heb. 6:4: this is to receive the Word with joy. Mt. 13:20, and there are few ordinary hearers, but at some time or other have these affecting motions, although for the most part the reprobate rather rejoices in the newness than in the trueness of that which he hears. Thirdly, obedience in part, forsaking some sins and doing God some service, Mk. 6:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>73. ‘Passages razed out concerning our effectual vocation’ in Canterbury’s Doom, or the first part of a complete history of the commitment, charge, trial, condemnation, execution of William Laud... (London: Macock, 1646)</cite>, pp. 344-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

</figure><figure class="quote" id="q-0f42ee50a7" data-kw="">
<blockquote><p>Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter... (London: E.G., 1641), on 2 Pet. 1:10-11</cite>, p. 164</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

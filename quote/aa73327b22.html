<main class="wrap"><figure class="quote" id="q-aa73327b22" data-kw="">
<blockquote><p>We know well that God created each and every man, and that of the whole human race some will be reprobate with devil, others will reign with Christ. But the Creator is not to be blamed because He created those who will fail to attain to eternal life, for He is the author of nature but not of the sin which nature has contracted.

Who is so dull as not to understand that the creation of the reprobate also serves for the beauty and variety of the present world, when he sees how the endeavours and exertions of unbelievers make for the convenience of this present life by the invention of the arts, the building of towns, by legislation, by the federation of the nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/prosper-of-aquitaine.html">Prosper of Aquitaine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Objections of the Gauls (c. 431-32), Art. 8 in Defense of St. Augustine: Ancient Christian Writers, no. 32, trans. P. De Letter (Westminster MD: Newman Press, 1963), pp 153-54.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-54fedc6566" data-kw="">
<blockquote><p>It is therefore clear from the foregoing, that if there be an intellect which knows all things by its essence, then its essence must needs have all things in itself immaterially; thus the early philosophers held that the essence of the soul, that it may know all things, must be actually composed of the principles of all material things. Now this is proper to God, that His Essence comprise all things immaterially as effects pre-exist virtually in their cause. God alone, therefore, understands all things through His Essence: but neither the human soul nor the angels can do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 84, art. 2, I answer that</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

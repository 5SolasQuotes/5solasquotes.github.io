<main class="wrap"><figure class="quote" id="q-05927b811b" data-kw="">
<blockquote><p>It is the same with the idea of substance, which is but a determination of the idea of being. Substance is being capable of existing in itself and not in something else. The intellect, which at once perceives being underneath the phenomena (something which is), observes that these phenomena are many and variable, while being, on the contrary, is one and the same, and that it exists in itself, and not as an attribute in another. Being considered as such is called substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God: his Existence &amp; his Nature</cite>, vol. 1 (B. Herder: 1945), p. 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>[see p. 75 of Wolter’s Summary] 68. When being is divided through contradictory attributes opposite to each other with respect to being, one of the dividing attributes belongs to a perfection in being and the other to imperfection. The reason is that one extreme of the disjunction formally involves the negation of the other. But both perfections cannot formally be perfections simply or pure perfections, because, from conclusion 62, pure perfections cannot formally exclude each other. Likewise, both extremes cannot formally be imperfections or mixed perfections, otherwise no being could be infinite (against conclusion 65). But a true disjunctive should include under one or other extreme every actual or potential being. Therefore one extreme is a perfection (a pure perfection) and the other an imperfection (a mixed perfection). 69. From this follows a general law of disjunction, namely that in disjunct properties of being, when the extreme that is less noble is posited of any being, the other more noble extreme can be deduced about some other being (see Scotus, Oxon. 1, d. 39, q. un, n. 13). The reason is that the one extreme involves imperfection and is therefore finite, while the other involves perfection simply, or pure perfection. But from conclusion 65, if something is finite, something else is infinite and has all pure perfections in the highest degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’, ‘Conclusions respecting Reality’</cite></span></figcaption>

<blockquote><p>As domestic society is by nature’s instinct, so is civil society natural, in radice, ‘in the root’, and voluntary, in modo, ‘in the manner’ of coalescing. Politic power of government agrees not to man, singly, as one man, except in that root of reasonable nature; but supposing that men be combined in societies, or that one family cannot contain a society, it is natural that they join in a civil society, though the manner of union in a politic body, as Bodine says, be voluntary, Gen. 10:10; 15:7 and Suarez says (tome 1, On Laws, bk. 3, ch. 3), That a power of making laws is given by God as a property flowing from nature, Qui dat formam, dat consequentia ad formam, Not by any special action or grant different from creation; nor will he have it to result from nature while men be united into one politic body: which union being made, that power follows without any new action of the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (London: Field, 1644), Question 2, ‘Whether or not government be warranted by the Law of nature’, p. 2</span></figcaption>

<blockquote><p>…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aquinas: a Beginner’s Guide</cite>, (OneWorld, 2010), ch. 4, ‘Psychology’ | ‘The Soul’, pp. 114-22 ‘Hylemorphic Dualism’, pp. 138-47, pp. 141-42</span></figcaption>

<blockquote><p>50. Being is divided into substance and accident. … About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. … Relative Being to Absolute Being [see pp. 69-72 of the Summary] 52. If there is relative being, absolute being must exist. For once the existence of a purely relative being has been admitted, some other beings must exist, namely subject, term and foundation [p. 69]. But all these are as it were the matter of relation and so are not formally the relation, nor formally ‘existing-to’; therefore they are absolute beings. But even on the other opinion, this proposition can in some way be saved. For if relative being is formally a being of reason with a foundation in the thing, something truly real and therefore absolute is required, namely the foundation itself. 53. From the nature of relation, it is plain that relation cannot be found, nor be known, unless subject, term, and foundation are present and known respectively at the same time. And in this sense can the Aristotelian-Scholastic dictum be understood: ‘relatives are simultaneous in nature and in understanding’. … Proof of God … 7. God knows all individuals, not only as absolute beings and in themselves, but also knows them according to all the relations that one has to all the others. This conclusion too is plain from the perfection of God’s knowledge. … Conclusions Respecting Reality … 29. Every being is good, or being and good convert. Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty, or the will…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Conclusions respecting Reality’</span></figcaption>

nd foundation are present and known respectively at the same time. And in this sense can the Aristotelian-Scholastic dictum be understood: ‘relatives are simultaneous in nature and in understanding’. … Proof of God … 7. God knows all individuals, not only as absolute beings and in themselves, but also knows them according to all the relations that one has to all the others. This conclusion too is plain from the perfection of God’s knowledge. … Conclusions Respecting Reality … 29. Every being is good, or being and good convert. Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty, or the will…”

— Allan B. Wolter, ‘Allan Wolter’s Conclusions respecting Reality, Proving God’ (1958), ‘Conclusions respecting Reality’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C50.+Being+is+divided+into+substance+and+accident.+%E2%80%A6+About+knowledge+of+the+formal+idea+of+accident+one+must+note+that+%E2%80%98in+another%E2%80%99+or+%E2%80%98in-anotherness%E2%80%99+is+correlative%2C+for+it+involves+something+in+which+it+is.+But+to+perceive+some+relation%2C+there+is+need+of+knowledge+of+the+terms+of+the+relation+in+themselves.+Our+first+knowledge+of+reality%2C+therefore%2C+seems+to+be+knowledge+of+things+as+absolute+objects+and+not+in+their+relation+to+other+beings.+But+when+we+say+that+accidents+are+immediately+experienced+as+beings+in+another+the+sense+is%3A+this+knowledge+is+not+by+way+of+reasoning+out+but%2C+from+phenomenological+analysis+of+the+givens+of+experience%2C+we+perceive+through+simple+apprehension+this+relation+of+%E2%80%98in-anotherness%E2%80%99.+Shape%2C+for+instance%2C+is+not+only+perceived+in+itself+and+as+something+absolute+but+also+in+its+relation+to+extension+and+color%2C+namely+as+the+limit+of+a+colored+expanse.+But+in+other+cases+it+seems+we+do+not+immediately+perceive+the+idea+of+%E2%80%98in-anotherness%E2%80%99%2C+but+rather+we+infer+it+by+reasoning+out.+This+happens%2C+for+example%2C+with+quantity.+No+wonder+then+that+some%2C+as+Descartes%2C+identified+extension+with+material+substance+as+such.+%E2%80%A6+Relative+Being+to+Absolute+Being+%5Bsee+pp.+69-72+of+the+Summary%5D+52.+If+there+is+relative+being%2C+absolute+being+must+exist.+For+once+the+existence+of+a+purely+relative+being+has+been+admitted%2C+some+other+beings+must+exist%2C+namely+subject%2C+term+and+foundation+%5Bp.+69%5D.+But+all+these+are+as+it+were+the+matter+of+relation+and+so+are+not+formally+the+relation%2C+nor+formally+%E2%80%98existing-to%E2%80%99%3B+therefore+they+are+absolute+beings.+But+even+on+the+other+opinion%2C+this+proposition+can+in+some+way+be+saved.+For+if+relative+being+is+formally+a+being+of+reason+with+a+foundation+in+the+thing%2C+something+truly+real+and+therefore+absolute+is+required%2C+namely+the+foundation+itself.+53.+From+the+nature+of+relation%2C+it+is+plain+that+relation+cannot+be+found%2C+nor+be+known%2C+unless+subject%2C+term%2C+and+foundation+are+present+and+known+respectively+at+the+same+time.+And+in+this+sense+can+the+Aristotelian-Scholastic+dictum+be+understood%3A+%E2%80%98relatives+are+simultaneous+in+nature+and+in+understanding%E2%80%99.+%E2%80%A6+Proof+of+God+%E2%80%A6+7.+God+knows+all+individuals%2C+not+only+as+absolute+beings+and+in+themselves%2C+but+also+knows+them+according+to+all+the+relations+that+one+has+to+all+the+others.+This+conclusion+too+is+plain+from+the+perfection+of+God%E2%80%99s+knowledge.+%E2%80%A6+Conclusions+Respecting+Reality+%E2%80%A6+29.+Every+being+is+good%2C+or+being+and+good+convert.+Just+as+ontological+truth+states+the+relation+of+being+to+the+cognitive+faculty%2C+so+goodness+involves+a+relation+to+the+appetitive+faculty%2C+or+the+will%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44e5959ce1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44e5959ce1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=50.%20Being%20is%20divided%20into%20substance,the%20appetitive%20faculty%2C%20or%20the%20will&amp;text=50.%20Being%20is%20divided%20into%20substance%20and%20accident&amp;text=relation%20to%20the%20appetitive%20faculty%2C%20or%20the%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>From the conformity of our church to the primitive apostolic Church. For since no one can deny that the primitive church was instituted by Christ and the apostles neither can it be denied that our church, if it is conformed that both in faith and in worship, was even then in it. Now it is easy to prove that it is conformed if we approach the examination of doctrine, as we so often desire. From this it will appear that nothing is received by us to be believed or done which was not delivered by Christ and the apostles; and whatever is rejected by us has no foundation in the writings, but is beyond what is written (par ho gegraphtai) And beyond that gospel which they preached (Gal 1:8). Nor is it to be said here that the ancient church cannot be said to be the same with ours because it did not reject the papacy, as we have done. (a) Faith and religion by themselves (and essentially) are not negative, but positive, since a negation or a rejection of error is by accident and positive faith suffices for the essential unity of the church. (b) if it did not reject explicitly (because the papacy had not yet sprung up), it rejected it implicitly and virtually by teaching such things as are incompatible (asystata) with it (in which way the scripture is said by the positing of the truth to reject errors not yet arisen, but only about to arise in the in the progress of time).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.10.19.</span></figcaption>

d it online · Heidelblog</a></div>

<blockquote><p>7. We must distinguish betwixt a dependance ‘absolute’, and ‘in some respect’; a congregation does absolutely depend upon the holy Scriptures alone, as the perfect rule of faith, and manners, of worship and of Church-Government; for we accurse the tyranny of prelates, who claimed to themselves autocratoric power over congregations to whom they gave their naked-will for a law: one of themselves told a whole synod that they ought to esteem that best which seems so to superiors; and that this is a sufficient ground to the conscience for obeying, though the thing be inconvenient. We say that congregations ought indeed to be subject to presbyteries and synods, yet not absolutely, but in the Lord, and in things lawful: and to this purpose the constitutions of presbyteries and synods are to be examined by the judgement of Christian discretion; for a synod is judex judicandus [a judge which ought to be judged], and regula regulata [a rule having been regulated], so that it ought not to be blindly obeyed, whether the ordinances be convenient or inconvenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (1641), pt. 2, ch. 2, p. 44</span></figcaption>

<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land, or delegates in a sort from them, they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>

</figure><figure class="quote" id="q-a29675f5a3" data-kw="">
<blockquote><p>I confess, when persons are entered into a visible Church-society by baptism, if they will own that profession they were baptized into, and are not guilty either of plain ignorance of it, or manifest scandal, and demand as their right the other ordinances of the Gospel, I see not by what power they may be excluded. If we fix not in a serious visible profession as the ground of giving right, but require positive evidences of grace in every one to be admitted to ordinances as the only thing giving right, for my part, setting aside the many inconveniences besides which attend that in reference to the persons to be admitted, I see not how with a safe and good conscience ordinances can be administered by any. My reason is this: Every one, especially a minister, in that case ought to proceed upon certain grounds that the person admitted has right to the ordinance to be administered; but if positive signs of grace be required, a man’s conscience cannot proceed upon any certainty, without infallible knowledge of another’s spiritual state, which I suppose none will pretend to. My meaning is, that which gives right, must be something evident to the person admitting into it, if it be his duty to enquire after it; but if only positive signs of grace be looked on as giving right, the ground of right can never be so evident to another person, as to proceed with a good conscience, i.e. with a full persuasion of another’s right to the administration of any ordinance to him. If it be said that these are required only as tokens of a true visible profession, and it is that which gives the right, I reply, Our knowledge of, and assent to the conclusion can be no stronger, nor more certain than to the premises from whence it is inferred; if therefore true profession gives right, and our knowledge of that proceeds upon our knowledge of the work of grace, we are left at the same uncertainty we were at before. But if we say, that an outward profession of the Gospel (where there is nothing rendering men uncapable of owning it, which is ignorance, nor declaring they do not own it, which is scandal) is that which gives a visible right to the ordinances of the Church as visible, we have something to fix ourselves upon, and to bottom a persuasion of the right of persons to ordinances. Christ when He instituted Churches, did institute them as visible societies, that is, to have marks whereby to be known and distinguished, as other societies in the world are; now that which puts a difference between this and other societies, is an open profession of Christianity, which profession is looked upon as the outward expression of the internal consent of the soul to the doctrine and laws of the Gospel. Which outward evidence of consent, where there is nothing evidently and directly oppugning it, is that which the Church of God in admission of visible members is to proceed upon. I nowhere find that ever Christ or his apostles in making disciples, or admitting to Church-membership, did exact anymore than a professed willingness to adhere to the doctrine which they preached; nor that they refused any who did declare their desire to join with them. An owning Christianity is all we read of antecedent to admission of Church-members. And if anything else be further required as necessary, we must either say the Word of God is defective in institutions of necessity to the Church, which I suppose the assertors of it will not be so inconsistent to their own principles as to do; or else must produce where anything further is required by the Word of God. … 3. The reality of consent may be sufficiently manifested without an explicit [man-composed Church-] covenant, as in the joining with those who are under the same profession in the common acts of the society and acceptance of, and submission to the rulers of that society, which implicitly is that covenant which they would have expressed; and actions in this case, are as declarative and significative as words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, a Weapon-Salve for the Church’s Wounds</cite>, ... (London: Mortlock, 1662), pt. 1, ch. 7, pp. 137-39</span></figcaption>

C+and+assent+to+the+conclusion+can+be+no+stronger%2C+nor+more+certain+than+to+the+premises+from+whence+it+is+inferred%3B+if+therefore+true+profession+gives+right%2C+and+our+knowledge+of+that+proceeds+upon+our+knowledge+of+the+work+of+grace%2C+we+are+left+at+the+same+uncertainty+we+were+at+before.+But+if+we+say%2C+that+an+outward+profession+of+the+Gospel+%28where+there+is+nothing+rendering+men+uncapable+of+owning+it%2C+which+is+ignorance%2C+nor+declaring+they+do+not+own+it%2C+which+is+scandal%29+is+that+which+gives+a+visible+right+to+the+ordinances+of+the+Church+as+visible%2C+we+have+something+to+fix+ourselves+upon%2C+and+to+bottom+a+persuasion+of+the+right+of+persons+to+ordinances.+Christ+when+He+instituted+Churches%2C+did+institute+them+as+visible+societies%2C+that+is%2C+to+have+marks+whereby+to+be+known+and+distinguished%2C+as+other+societies+in+the+world+are%3B+now+that+which+puts+a+difference+between+this+and+other+societies%2C+is+an+open+profession+of+Christianity%2C+which+profession+is+looked+upon+as+the+outward+expression+of+the+internal+consent+of+the+soul+to+the+doctrine+and+laws+of+the+Gospel.+Which+outward+evidence+of+consent%2C+where+there+is+nothing+evidently+and+directly+oppugning+it%2C+is+that+which+the+Church+of+God+in+admission+of+visible+members+is+to+proceed+upon.+I+nowhere+find+that+ever+Christ+or+his+apostles+in+making+disciples%2C+or+admitting+to+Church-membership%2C+did+exact+anymore+than+a+professed+willingness+to+adhere+to+the+doctrine+which+they+preached%3B+nor+that+they+refused+any+who+did+declare+their+desire+to+join+with+them.+An+owning+Christianity+is+all+we+read+of+antecedent+to+admission+of+Church-members.+And+if+anything+else+be+further+required+as+necessary%2C+we+must+either+say+the+Word+of+God+is+defective+in+institutions+of+necessity+to+the+Church%2C+which+I+suppose+the+assertors+of+it+will+not+be+so+inconsistent+to+their+own+principles+as+to+do%3B+or+else+must+produce+where+anything+further+is+required+by+the+Word+of+God.+%E2%80%A6+3.+The+reality+of+consent+may+be+sufficiently+manifested+without+an+explicit+%5Bman-composed+Church-%5D+covenant%2C+as+in+the+joining+with+those+who+are+under+the+same+profession+in+the+common+acts+of+the+society+and+acceptance+of%2C+and+submission+to+the+rulers+of+that+society%2C+which+implicitly+is+that+covenant+which+they+would+have+expressed%3B+and+actions+in+this+case%2C+are+as+declarative+and+significative+as+words.%E2%80%9D%0A%0A%E2%80%94+Edward+Stillingfleet%2C+Irenicum%2C+a+Weapon-Salve+for+the+Church%E2%80%99s+Wounds%2C+or+the+Divine+Right+of+Particular+Forms+of+Church-Government+Discussed+%26+Examined...+%28London%3A+Mortlock%2C+1662%29%2C+pt.+1%2C+ch.+7%2C+pp.+137-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa29675f5a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a29675f5a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=I%20confess%2C%20when%20persons%20are%20entered,as%20declarative%20and%20significative%20as%20words&amp;text=I%20confess%2C%20when%20persons%20are%20entered%20into%20a&amp;text=case%2C%20are%20as%20declarative%20and%20significative%20as%20words" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5th Consideration. The essential ingredients and reasons of a lawful divorce [from Romanism] are here:

1. We could not lie in one bed with that sometime sister Church of Rome, but our skin behoved to rub upon her botch-boil, and therfore we did separate from nothing but corruption.

2. There was there persecutions, and in that we are patients and ejected rather then departers on foot and horse.

3. A professed dominion over our consciences.

4. Necessity of receiving the mark of the beast, and so the plagues of the beast, to worship images, and the work of men’s hands, a necessity of professing fundamental errors that subvert the foundation of faith, did all necessitate our seperation.</p></blockquote>

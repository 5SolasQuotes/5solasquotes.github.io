<main class="wrap"><figure class="quote" id="q-9e48332a2f" data-kw="">
<blockquote><p>[W]e do affirm that Christ fulfilled the law for us submitting to the obedience of it, and performing all that righteousness which of us it requires, that we might have a complete righteousness wherewith to appear before God. And this is that which is intended by the active and passive righteousness of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, (1655), The Works of John Owen, 12:77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c60b48b53a" data-kw="">
<blockquote><p>Question: You say then that we be justified before God, that is to say that we be covered and denounced rightuous, because Christ’s obedience is imputed unto us, which consists chiefly of two parts: namely of satisfaction for our sins, and of full performance of all rightuousness of the law. Answer: I say so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Book of Christian Questions &amp; Answers</cite>, … (London: How, 1574), p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“Question: You say then that we be justified before God, that is to say that we be covered and denounced rightuous, because Christ’s obedience is imputed unto us, which consists chiefly of two parts: namely of satisfaction for our sins, and of full performance of all rightuousness of the law. Answer: I say so.”

— Theodore Beza, A Book of Christian Questions &amp; Answers… (London: How, 1574), p. 43">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion%3A+You+say+then+that+we+be+justified+before+God%2C+that+is+to+say+that+we+be+covered+and+denounced+rightuous%2C+because+Christ%E2%80%99s+obedience+is+imputed+unto+us%2C+which+consists+chiefly+of+two+parts%3A+namely+of+satisfaction+for+our+sins%2C+and+of+full+performance+of+all+rightuousness+of+the+law.+Answer%3A+I+say+so.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Book+of+Christian+Questions+%26+Answers%E2%80%A6+%28London%3A+How%2C+1574%29%2C+p.+43&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc60b48b53a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c60b48b53a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Question%3A%20You%20say%20then%20that%20we,the%20law.%20Answer%3A%20I%20say%20so&amp;text=Question%3A%20You%20say%20then%20that%20we%20be%20justified&amp;text=rightuousness%20of%20the%20law.%20Answer%3A%20I%20say%20so" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-89aeb62812" data-kw="">
<blockquote><p>[Margin Note:] It’s false that Christ so died for us, that is, in our stead, as that in our stead He fulfilled the Law and performed all active obedience and passive by doing and dying that God can require of us. 2. Christ may be said to die for us, as if we had substituted Him in our place, in so rigid a sense as if He had been made our surety to fulfill both the preceptive and active, and also the satisfying and suffering part of the Law in our room. This may please Antinomians, but a doubt it is, if it stand with the truth: For then whatever we, yea all mortal men be (for Christ died for them all, as many teach) most wicked, yet Christ’s active and surety, and cautionary righteousness should be ours; and though we should never believe, yet Christ who fulfilled the Law, and preceptive as well as the threatening part, must have believed for all that He died for, and what need we then in our persons either [to] believe or repent? It’s true, we need not perform any active obedience, as a part of active fulfilling of that Covenant of Works, which either must have all or no obedience. If it be said that alio titulo, ‘upon another account’ of thankfulness to our ransom-payer we owe active obedience: Yet all [persons] that Christ died for, both actively and passively, must be perfectly righteous and justified, [He] having paid the most perfect active and passive obedience that the Law required, though we never believe, and Christ must have paid the active part of justifying faith for us. And why, but we should be formally justified in Him without faith also? As also, God, not we, laid our sins upon Christ, Isa. 53:6; 2 Cor. 5:21, and therefore we did commissionate and substitute Christ to die in our room.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 3, pp. 246-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

e+Christ+to+die+in+our+room.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+%281655%29%2C+pt.+2%2C+ch.+3%2C+pp.+246-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89aeb62812.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89aeb62812.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Margin%20Note%3A%5D%20It%E2%80%99s%20false%20that%20Christ,Christ%20to%20die%20in%20our%20room&amp;text=Margin%20Note%3A%5D%20It%E2%80%99s%20false%20that%20Christ%20so%20died&amp;text=and%20substitute%20Christ%20to%20die%20in%20our%20room" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-766b45942f" data-kw="">
<blockquote><p>From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-05ca7b0d67" data-kw="">
<blockquote><p>Therefore, we always hold fast this foundation, ascribing all the glory to God, humbling ourselves before Him, and acknowledging ourselves to be such as we really are, without presuming to trust in any thing in ourselves, or in any merit of ours, relying and resting upon the obedience of Christ crucified alone, which becomes ours when we believe in Him. This is sufficient to cover all our iniquities, and to give us confidence in approaching to God; freeing the conscience of fear, terror, and dread, without following the example of our first father, Adam, who, trembling, attempted to cover himself with fig leaves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, Art. 23</span></figcaption>

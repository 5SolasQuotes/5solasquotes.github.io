<main class="wrap"><figure class="quote" id="q-ca7db8ecf7" data-kw="">
<blockquote><p>But here arises a doubt: Are we not to pray for wicked men, yea, the impenitent, the persecutors of the Church, contemners of the Word? I answer: 1. Yea, partly because we know not the secret purposes of God’s grace. Christ in the light of his divinity, knew the elect and the reprobate, but we know not, therefore we are to pray for them that persecute, Mt. 5:44. Paul once breathed out threatenings against the Church; Christ received gifts for the rebellious; partly because many wicked men are considerable in their station, therefore, at least, we pray for temporal blessings for them, though we have little hopes that ever they shall be gained to the knowledge of the truth. Thus we are to pray for wicked rulers, for the conservation of human society, they may serve as a thorn hedge about a garden of roses. Thus it is said, Ezra 6:10, that in the Temple they should pray for the life of the king and of his sons, meaning the King of Babylon, Darius, at least for temporal favors. 2. We have not such encouragement to pray for them as for the saints: For the saints we pray out of the unity of the Spirit, for wicked men, out of common charity: for the saints we pray out of a delight in their graces; for wicked men, out of a loose possible hope. Heb. 13:18, ‘Pray for us, for we trust that we have a good conscience in all things, willing to live honestly.’ These should have the greatest share of our prayers; we have the more encouragements and hopes of them, which should be an engagement to us to pray for them. 3. Conditionally we may pray against the obstinate and them that sin of malicious wickedness. There are many imprecations in Ps. 109 which are not to serve our private revenge, but by us to be conceived conditionally: Those curses are uttered against Judas in a prophetical spirit, and therefore not to be drawn into example, to justify any heats of revenge and private passion. 1 Jn. 5:16: ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death; I do not say that he shall pray for it.’ It is a tempting of God to intercede for that sin, seeing He has declared his will; the irremissible sin, is that sin, though it be hard to be found out. Therefore it is good to keep to the conditional form when a man, after the profession of religion, falls to an utter revolt and deadly hatred of it: it is a shrewd presumption they have committed that sin. 4. We feel sometimes a restraint upon our prayers. God by oracle forbade the prophet to pray for the people; Jer. 7:16: ‘Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to Me, for I will not hear thee.’ When He was resolved to put his wrath in execution, He would not have his people’s prayers lost; and still the same Spirit that stirs up to prayer searches out the deep counsels of God. So that there is a kind of prophetical light in prayers; God [at times] suspends the servency and actual assistance, by which we are carried on at other times. I would not justify every private passionate conceit, but yet we must look upon the Spirit of God as the interpreter of God’s counsel, and that He will not stir up prayers to no purpose. Yea, sometimes we feel that after much striving, we have no heart to pray for them, which is a very great mark of God’s displeasure upon any person, when God’s people, yea, even after much struggling with themselves, have no heart to pray for him.</p></blockquote>

</figure><figure class="quote" id="q-3c5bbff1a1" data-kw="">
<blockquote><p>The faithless are the enemies of God and some of them the enemies of our Church and country, and some enemies to ourselves; and shall we pray for such? Although now they be the enemies of God, yet hereafter they may become friends and be reconciled unto Him: whereof our prayer may be a means: And therefore howsoever we are to pray against their wicked practices, we are to pray for their persons, that they of enemies may become friends; of infidels, faithful; of heretics and schismatics, sound Christians; of wicked and profane, religious and holy: ‘for this is good and acceptable in the sight of God our Savior, who wills that all men should be saved and come unto the knowledge of the truth.’ (1 Tim. 2:4) Examples of them who have prayed for the wicked are very many in the Word of God: As of Abraham, for the Sodomites, Gen. 18, Moses, for the rebellious Israelites, Ex. 32, yea, for Pharaoh and the Egyptians; Samuel, for Saul, the man of God for Jerdboam, 1 Kn. 13. But why seek [????] examples? We have a commandment to pray for such as have sinned not unto death, and a promise to procure mercy for them, 1 Jn. 5:16, and a complaint of God when this is not performed, Eze. 22:30. Prayers made for the wicked are many times without fruit. If they be without fruit, though they be to them idle, yet not to thee: Thy prayer shall return into thine own bosom, Ps. 35:13, according to that, Mt. 10:13, ‘When ye come into an house, salute it, or wish peace unto it: if the house be worthy, let your peace come upon it; but if it be not worthy, let your peace return to you.’ As for those that be our enemies, though the Schoolmen teach that we are not, or at least need not, specially to pray for them, yet our Savior Christ has commanded us to love our enemies, to bless them that curse us and to pray for them who despitefully use us and persecute us. So Jer. 29:7; Rom. 12:14. And this was practiced by our Savior, Lk. 13:34, by Stephen, Acts 7:60.</p></blockquote>

gh+the+Schoolmen+teach+that+we+are+not%2C+or+at+least+need+not%2C+specially+to+pray+for+them%2C+yet+our+Savior+Christ+has+commanded+us+to+love+our+enemies%2C+to+bless+them+that+curse+us+and+to+pray+for+them+who+despitefully+use+us+and+persecute+us.+So+Jer.+29%3A7%3B+Rom.+12%3A14.+And+this+was+practiced+by+our+Savior%2C+Lk.+13%3A34%2C+by+Stephen%2C+Acts+7%3A60.%E2%80%9D%0A%0A%E2%80%94+George+Downame%2C+A+Godly+%26+Learned+Treatise+of+Prayer...+%28Cambridge%3A+1640%29%2C+ch.+32%2C+%E2%80%98Distinctions+of+Prayer+in+regard+of+the+Object%2C%E2%80%99%2C+pp.+186-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3c5bbff1a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3c5bbff1a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=The%20faithless%20are%20the%20enemies%20of,Lk.%2013%3A34%2C%20by%20Stephen%2C%20Acts%207%3A60&amp;text=The%20faithless%20are%20the%20enemies%20of%20God%20and&amp;text=our%20Savior%2C%20Lk.%2013%3A34%2C%20by%20Stephen%2C%20Acts%207%3A60" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e445dc279b" data-kw="">
<blockquote><p>‘To bind’ is to denounce God’s wrath against impenitent sinners. ‘To loose’ is to pronounce remission of sins to repentant sinners; both which have certain degrees. The degrees of binding are: 1. A severe exhortation and commination, after private admonitions have been rejected; this must be done by the presbytery. (Mt. 18:15-17) 2. A keeping off from the Lord’s Supper. (Mt. 7:6) 3. The greater excommunication, by which the sinner is cast out of the Church, yet not without hope of pardon and return, if he repent. (1 Cor. 5:5) 4. Anathema, or in the Syriac word, Maran-atha, when he is cast out without hope. (1 Cor. 16:22; 1 Jn. 5:16)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity... (d. 1629; London: Mab, 1650), bk. 1, ch. 26, ‘Of the outward administration of the Church,’</cite>, p. 177</span></figcaption>

</figure><figure class="quote" id="q-3d3b7daf0e" data-kw="">
<blockquote><p>The sin against the Holy Ghost indeed is distinct and something different from this sin unto death that our apostle speaks of… It is true indeed that a sin in which a man continues unrepenting until his death and in which he dies, may very justly be called ‘a sin to death,’ that is, ‘a sin until his death,’ and it will prove a sin to death eternal, but that the apostle means here a particular sin, and that he estimates it not by its length but by its weight, not by how long the party continues in it, but by how grievous the sin is in itself, will appear as we go along, partly by discovery of the reason of the title he puts upon it, and partly by discovery of the very sin itself that is here intended…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-420a2ccbe6" data-kw="">
<blockquote><p>It is very strange, that the works of our calling should not be permitted on any part of the Sabbath day, and sports and pastimes should; And shall not the spending of our time in God’s Service, not public only, but private also, far better fit us to serve God in the works of our calling, and make us more capable of his blessing upon our labours, then the exercising of our selves in sports and pastimes?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment, as still in force to bind Christians</cite>, (London, 1641), p. 244.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.”

</figure><figure class="quote" id="q-4993fb7e8a" data-kw="">
<blockquote><p>With regard to “removing… monuments of idolatry,” establishment Anglicans had long affirmed and practiced this, interpreting the phrase as referring (only) to such Romanist monuments and not to the Anglican ceremonies, the latter being held to be not inherently unlawful.¹ ¹ So bishop Richard Cox (c. 1500–1581), who opposed John Knox at Frankfurt regarding the Anglican Liturgy, was a zealous and firm remover of Romanist monuments of superstition and idolatry: Wenig, “Reformation during the Episcopate of Richard Cox,” pp. 167 &amp; 170.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction”, “Larger Catechism</cite>, Question 108” in A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025), p. 73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-2b9c299fc6" data-kw="">
<blockquote><p>All these acts are not able to be exercised at the same time: yet they ought not to be separated from each other in True Religion, since God requires both the one and the other: although the elicited and internal acts are primary, and the interal acts alone are generally able to be exercised at any time, even in a time of persecution…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-19f44e6044" data-kw="">
<blockquote><p>Some make a mockery of the holy things of God. One part of the year they will be holy; a rotten, foolish affection of people that are popish. In Lent they will use a little austerity, oh! they will please God wondrously! but before and after they are devils incarnate. So they make that part of the year as a good parenthesis, in an unlearned and unwitty speech. A good parenthesis is unseemly in a wicked speech, and a good piece is unseemly in a ragged garment; so their lives that make a good show then (and there are few that do so, they are scarce among us; men are such atheists that there is not outward reformation, but if there be), if they give themselves leave to be civil, and to respect holy things a little time, afterward they return to their looseness again. Doth this patching out of a holy life please God? No, no! ‘I have sworn, and I will perform it, that I will keep thy righteous statutes,’ saith David, Ps. 119:106. And St Paul, ‘I have resolved to be so to the end;’ I will be myself still. So where grace is, there is a resolution against all sin for the time to come. If you entertain not this resolution, to walk ‘in holiness and righteousness all the days of your life,’ Luke 1:75, acknowledge no benefit by Christ’s redemption, and come not near the holy things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, vol. 3 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1862), 313.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

<blockquote><p>And so, the Mediator, the Son of God, took upon His shoulders not only that first defection but also all our other defections and transgressions, and at the same time diverted to Himself the wrath of God the Father justly pursuing our sins. He also, by His passion and cross, fully and perfectly satisfied for us. And by His passion He not only satisfied fatherly wrath and righteousness, but in addition by that same passion (which was the dignity of that person who suffered, namely the Son of God in human nature), by that same passion, I say, He merited for us new grace, but especially the recalling of the covenant of God, without which first in the beginning no grace comes to us from God. For not unless we have first been called are we justified or glorified. Calling, moreover, is seen in cutting the new covenant with us. This covenant is what we call the covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey Carmichael, Classic Reformed Theology Series vol. 5 (Reformation Heritage Books, 2021), 166.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e2c309fd8" data-kw="">
<blockquote><p>We shall now be prepared to understand how the recognition, that the two worlds exist and have existed side by side from the beginning, enables the author of Hebrews to solve the chief problem of the history of redemption and revelation. For it is in Hebrews that the first age and the first world are identified with the first covenant. When, therefore, the question is raised, how the Old Covenant can be identical in substance with the New, what is the common essence, that notwithstanding the great progress from one to the other, makes them two coherent stages in the expression and conveyance of the same spiritual reality, the answer is immediately forthcoming: the same world of heavenly spiritual realities, which has now come to light in the Person and work of Christ, already existed during the course of the Old Covenant, and in a provisional typical way through revelation reflected itself in and through redemption projected itself into the religious experience of the ancient people of God, so that they in their own partial manner and measure had access to and communion with and enjoyment of the higher world, which has now been let down and thrown open to our full knowledge and possession. In other words, the bond that links the Old and the New Covenant together is not a purely evolutionary one, inasmuch as the one has grown out of the other; it is, if we may so call it, a transcendental bond: the New Covenant in its preexistent, heavenly state reaches back and stretches its eternal wings over the Old, and the Old Testament people of God were one with us in religious dignity and privilege; they were, to speak in a Pauline figure, sons of the Jerusalem above, which is the mother of all. This is a profounder solution than is offered in the well-known formula of Augustine: “The New Testament is latent in the Old, the Old Testament lies open in the New.” More profound because, together with the statement of the fact, it gives the reason for the fact. The latent existence of the verities and potencies of the Christian religion in the old dispensation are due to no other cause than that the Christian religion lived even at that time as redemptive truth and redemptive power in the heavenly world and from there created for itself an embryonic form of existence in the life of Israel. The writer of Hebrews would have subscribed to the belief that Christianity is as old as Abraham and as old as Moses, nay as old as Paradise, because it is heaven-born and not the child of earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Redemptive History and Biblical Interpretation</cite>, ed. Richard B. Gaffin Jr. (Phillipsburg, NJ: P&amp;R Publishing, 2001), 199–200.</span></figcaption>

</figure><figure class="quote" id="q-0480249b8d" data-kw="">
<blockquote><p>I was standing on the 10th of December, 1846, at the end of my Father’s house, and meditating on that precious word that has brought peace to countless weary ones: ‘God so loved the world, that He gave his only begotten Son, that whosoever believeth in Him, should not perish, but have eternal life’ (John 3:16). I saw the proof of his love in the giving of his Son Jesus. I saw that ‘whosoever’ meant anybody and everybody, and therefore me, even me. I saw the result of believing—that I would not perish, but have everlasting life. I was enabled to take God at his word. I saw no one, but Jesus only, all in all in redemption. My burden fell from my back, and I was saved. Yes, saved!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/duncan-matheson.html">Duncan Matheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life and Labors of Duncan Matheson</cite>, (Kilmarnock: Ritchie, n.d.), p. 26, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love, n.d., p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

ooks Online</a></div>

<blockquote><p>Besides, the text [2 Cor. 5:13] only says, ‘God is reconciling the world to Himself;’ now there is a great difference between God reconciling and reconciled: The former supposes in God a propensity to bring about the way of reconciliation; not that He is already reconciled, but this flows from a general love and pity He bears to mankind, whereby He procures a way that actual reconciliation may be obtained between man and God; yea Eph. 2:16 compared with Col. 1:20…</p></blockquote>

<blockquote><p>Question 13. But how may it appear that He is willing to receive me? Answer: Make trial of Him thyself. If thou didst but know his heart to poor sinners, you would not question it. Believe what He says in the gospel; there thou shalt find that He is a willing Savior; for therein thou hast: First, his most serious invitations, Mt. 11:28, “Come unto Me, ye that are weary and heavy laden.” Isa. 55:1, “Ho! every one that thirsteth come ye to the waters.</p></blockquote>

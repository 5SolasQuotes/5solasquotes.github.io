<main class="wrap"><figure class="quote" id="q-db9ced9cfe" data-kw="">
<blockquote><p>2nd Rule: If we compare a greater moral necessity with a less moral necessity, the less necessity must yield to the greater. [If] a necessity of mercy must yield to a necessity of sacrificing: If David then should not have eaten the showbread in his providential necessity of famine, [then] he should have been guilty both of [the] active scandalizing [of] the souls of others in killing himself, and should have killed himself; and the less moral necessity ceases and is no necessity when a greater moral necessity intervenes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Appendix, p. 82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd99261633" data-kw="">
<blockquote><p>To put forward a more refined and true principle in alternative to [George] Gillespie’s: Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them. [John] Sprint essentially affirmed this principle, while Gillespie essentially denied it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<blockquote><p>[George] Gillespie nowhere in his tome speaks of or argues the “greater good”. He does address personal, “greater duties,” but this allows him to confine the issues to immediate circumstances. Yet the relevance of a larger view of the greater good and its affecting our ethical obligations (especially with inconvenient actions, but also regarding scandal) cannot be denied.</p></blockquote>

</figure><figure class="quote" id="q-94e343035f" data-kw="">
<blockquote><p>The errors and deficiencies one materially tolerates and accommodates for the time and circumstances under necessity, for the higher good in love, overlooking a multitude of sins (1 Pet. 4:8), without approving them, versus what one believes and the standard one seeks to reform unto, namely the spotless Word of God, are two different things which may consist with each other.</p></blockquote>

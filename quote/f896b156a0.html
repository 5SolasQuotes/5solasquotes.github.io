<main class="wrap"><figure class="quote" id="q-f896b156a0" data-kw="">
<blockquote><p>Of all conceptions of the human mind, the idea of God is the most sublime. It is not only sublime, but awful. Every thing else appears diminutive while the mind is occupied with this thought. Though the idea of an eternal and infinite being is too great for the grasp of the human intellect, yet it is suited to the human mind. It fills it, and produces a feeling of reverence, which is felt to be a right emotion. If there is no such being, this is the grandest illusion which ever possessed the imagination of man.

If it be an error, then error is preferable to truth; for on this supposition, truth in its whole compass has nothing in grandeur to compare with illusion. Remove this idea, and the mind is confounded with an infinite blank. Deprived of this, the intellect has no object to fill it: it is confounded and distressed with the retrospect of the past, and prospect of the future. But it cannot be, that this noblest of all conceptions of the human mind should be false: the capacity of the soul of man to form such a conception is a proof of the existence of a great and good and intelligent First Cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Compend of Bible Truth</cite>, (Philadelphia: Presbyterian Board of Publication, 1846), p. 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology.html">Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f578b23f90" data-kw="">
<blockquote><p>These movements are named as English Methodism and above all in our day the so-called Sanctification-movement. The language in which they are introduced is very carefully guarded, but what is meant is simply that in these two movements, Methodism and what we know as the Higher Life Movement, with its continuations, we have “reactions” from the Reformation doctrine of the “miserable sinner.” And accordingly we are told clearly a page or two later, where the problem of sin in the Christian life is spoken of, that “Methodism and the Sanctification-movement present therefore a reaction from the solution of Christian miserable-sinnerism which is fostered in Lutheran circles.” This representation is true.

The perfectionist teaching of these several movements, whether in its crasser or in its more guarded forms, is a revolt against the Reformation doctrine not only of the continued imperfection of the Christian in this life where he enjoys only the first fruits of salvation, but of sin and grace in general, which constitutes the pivot on which the whole system of Reformation teaching turns.

And we may count it among the most beneficent results of the discussion of the Biblical teaching on the sins of Christians which we have been reviewing, if we can learn from it this fact; and with it this other fact, that the appeal of these movements to the Scripture in behalf of their teaching has, in the most elaborate effort which has yet been made to validate it, completely failed. The most striking thing about the long continued attempt which has been made to prove that to Paul the Christian is a sinless man is the clearness with which it has come out that Paul knows nothing of a sinless man in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Miserable-Sinner Christianity in the Hands of the Rationalists. Article III: Windisch and the End’, Princeton Theological Review</cite></span></figcaption>

</figure><figure class="quote" id="q-05b2cfc69c" data-kw="">
<blockquote><p>115. But man is capable of knowing God from such creatures in three ways, as Denis [Pseudo-Dionysius] says in The Divine Names.

He knows him, first of all, through causality. For since these creatures are subject to change and decay, it is necessary to trace them back to some unchangeable and unfailing principle. In this way, it can be known that God exists.

Second, he can be known by the way of excellence. For all things are not traced back to the first principle as to a proper and univocal cause, as when man produces man, but to a common and exceeding cause. From this it is known that God is above all things.

Third, he can be known by the way of negation. For if God is a cause exceeding his effects, nothing in creatures can belong to him, just as a heavenly body is not properly called heavy or light or hot or cold. And in this way, we say that God is unchangeable and infinite; and we use other negative expressions to describe him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Romanos lectura</cite>, (c. 1259-65), C. 1, L. 6, 115.</span></figcaption>

<blockquote><p>1041. But it should be noted that although he says that taxes are owed to rulers as a wage for their labours, rulers can sin in two ways by accepting taxes.

First, if they do not procure the people’s welfare but are intent only on seizing their goods. Hence it says in Ezekiel: you eat the fat, you clothe yourselves with the wool, you slaughter the fatlings, but you do not feed the sheep (Ezek 34:3).

Second, if they violently take more than the law permits and more than the people can bear. Hence it says in Micah: hear, you heads of Jacob and rulers of the house of Israel! Is it not you who tear the skin from my people, and their flesh from their bones? (Mic 3:1).</p></blockquote>

<blockquote><p>Do magistrates seriously perform their work? Are they zealous for God? Do they build up his house? Are they tender of his honour? Do they second the word? and fly in the face of sin and sinners, as the disturbers of our peace, and the only cause of all our miseries? Do they improve all their power, wealth, and honour, and all their influence, for the greatest advantage to the kingdom of Christ, as men that must shortly give an account of their stewardship?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c472c9be6" data-kw="">
<blockquote><p>Finally, they [the prophets] foresaw that after the full expiration of this exile and banishment, a prince should come, and a son should be given in the fullness of time, which should possess the throne of his father David, and take upon him the government of the Kingdom, and should establish the same in a permanent and unperishable course of continuance, peace and tranquillity for ever.

And this also was performed even then accordingly, when as the son of God was borne in the city of David: that wonderful counsellor, the mighty God, the prince of peace: who albeit died once according to the flesh, &amp; seemed to be vanquished, yet was he not holden of death above three days, but survived of his own power, and liveth for ever and ever: and in dying hath obtained an endless conquest of death, and triumpheth now (not much unlike unto Sampson) victoriously over death, hath rent in sunder the iron gates of sin, hath crushed the tyranny of the devil in pieces, and purchased everlasting life for his elect, not perishable by any assault of haughty adversary, nor vanquishable by any power of worldly policy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans</cite>, trans. James Bell (London: Christopher Barker, 1578), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-8f08e5695a" data-kw="">
<blockquote><p>Rutherford states quite explicitly that it was Bradwardine who provided him with the solution to the philosophical conundrum of the ground of ethics… Bradwardine offered a subtler threefold division… Bradwardine’s basic distinction was between things which are reasonable naturally prior to the divine will, things which are reasonable naturally posterior to the divine will, and things which are said to be mixed. Within the first category are contained necessary truths about God, such as his being and goodness, which obtain prior to any act of his will… they are able to move the divine will. Within the second category are contained things which are reasonable posterior to God’s will, and which depend on God’s will for their reasonable status. These are therefore said to be caused by the divine will and can in no way move or determine it… Bradward likens it to the situation of someone choosing between two equal alternatives. For when someone chooses one of these, we say that this was a rational choice even though he could have also chosen the other. Within the third category are included reasonable things which are said to be conditionally rather than absolutely necessary. Thus while they do not themselves obtain naturally prior to the divine will, their reasonable status is crucially founded on truths which do obtain in this way… the creature’s duty to love and obey God. For althought the creature’s existence is dependent on the divine will, with the supposition that this creature is in existence it is absolutely reasonable that he should love and obey God and indeed this reasonable status cannot be changed even by God himself… Rutherford therefore had no difficulty transposing this into his own theory of moral complexes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simon-j-g-burton.html">Simon J.G. Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40, pp. 134-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-59450087e5" data-kw="">
<blockquote><p>…and the soul of Christ, from the first moment of its infusion, was a subject capable of a fulness of grace, as unto its habitual residence and in-being, though the actual exercise of it was suspended for a while, until the organs of the body were fitted for it. This, therefore, it received by this first unction of the Spirit. Hence, from his conception, he was “holy,” as well as “harmless” and “undefiled,” Heb. 7:26; a “holy thing,” Luke 1:35; radically filled with a perfection of grace and wisdom, inasmuch as the Father “gave Him not the Spirit by measure,” John 3:34.</p></blockquote>

<blockquote><p>…hereafter provision must be made for spiritual ministers, who may instruct the sick in faith towards God, and comfort them up with hope of salvation, and take care of their souls, whom the Preservers [specially appointed civil officials for the plague] shall so choose in every parish, that they take not to so weighty a matter, whosoever comes first to hand, but such as they shall have known to be singularly given unto godliness, holiness, sobriety, and chastity… But if, peradventure, there can no such be found among the ordinary ministers, out of the rest of the people there must be chosen such, which come unto the next degrees of the foresaid virtues. For in this miserable time the things of most perfection come not always to be had. Therefore, as they say, ‘As we can, when as we would we may not.’ When such at length are chosen, whom the Preservers shall have judged meet and sufficient for every parish, it may not by any means be suffered that they go to any other than such as being taken with the plague, require their help. For I have said before, and say still, that not only the outward and common infectious air, but also contagious breaths and infectious breathings, or blowings, which are gathered and afterwards imparted to the whole: and others that are sick by the keepers, by such as sit by them, by the ministers of the church going hither and thither and standing by the infected, yea many times also by them that are dead, ought specially to be avoided. Which thing, when as by daily experience we are taught, and have proved also unto us to be true, by all means we have to take heed, lest that we leave the cause of this so great a disease in others, whom with all diligence we have, for fear of infection, put apart. Hereunto you may add, which we have oftentimes no less experience of, that many sick persons also (I speak not of such as are infected with the plague), albeit they be not infected with the company of such ministers, yet they will nevertheless refuse their presence for fear of the infection. Whereupon also this inconvenience will arise, yet they had rather receive never so simple comfort at the hands either of some of their own household, who for the most part are unmeet for this purpose, or else die alone than to undergo a double mischief…</p></blockquote>

any of such ministers, yet they will nevertheless refuse their presence for fear of the infection. Whereupon also this inconvenience will arise, yet they had rather receive never so simple comfort at the hands either of some of their own household, who for the most part are unmeet for this purpose, or else die alone than to undergo a double mischief…”

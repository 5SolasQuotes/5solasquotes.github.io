<main class="wrap"><figure class="quote" id="q-6668ee5356" data-kw="">
<blockquote><p>Nor do we put that necessity on the sacraments, but where the man is excluded from the sacraments, for such a sin as if he repent not, he is excluded from salvation; it concerns him much to think it a weighty judgment to be excluded from the seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 9, p. 343 irregular numbering</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3fbf2cbbd5" data-kw="">
<blockquote><p>The O. S. [Old School] Assembly in 1853 decided that in some cases the Session may dismiss a member without specifying the church with which he is to unite. But the reunited Church in 1871 urged upon Sessions the importance of giving to members who remove from them either letters of dismission and recommendation to a particular church, or, in case of uncertain destination, letters of credence. The O. S. Assembly in 1869 recommended that the Session should furnish any member removing from their bounds, whether in full communion or member by baptism only, with testimonials of his standing, which should be presented as soon as possible to some church of our connection, and that such person be advised to transfer his relation at the earliest opportunity… … May a member connect himself with another church on profession of faith? If the church with which he unites [by profession of faith] be one of another denomination, the Session may order his name to be struck from the roll of communicants, or may, by process of discipline, suspend him from church privileges. The N. S. [New School] Assembly in 1839 recommended that no other action should be taken than to strike his name from the roll. This action was reaffirmed by the Assemblies of 1879 and 1882, and was in 1884 embodied in the revised Book of Discipline. How are absent members to be treated? … When one has been absent for years and his residence unknown, the Session should make record of the fact, and declare that he has forfeited his good standing until he returns and accounts for his absence. The O. S. As- sembly in 1865 passed a similar order. That body had in 1856 required that the names of absentees, whose whereabouts are unknown, be placed on a reserved list, and not be reported among the communicants until they return and satisfy the Session. The Assembly of the reunited Church ratified the above in 1872 by declaring, “It may nevertheless be well for each church to record on a separate list the names of those who have been absent for more than two years from their church relations, and whose residence is unknown; and the names thus recorded may be omitted in the statistical returns of the church. The ‘Book of Discipline’ adopted in 1884 authorized the Session to erase the names of absentees after three years and place them on the reserved list.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-aspinwall-hodge.html">J. Aspinwall Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What is Presbyterian Law as Defined by the Church Courts?</cite>, (1882; 1899), pp. 147, 151-52, 152-54 | “May a certificate of dismission be indefinite?</span></figcaption>

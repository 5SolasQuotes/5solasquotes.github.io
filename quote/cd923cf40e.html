<main class="wrap"><figure class="quote" id="q-cd923cf40e" data-kw="">
<blockquote><p>But they that have taken it [the Oath of Supremacy], or conceive they may take it, if imposed, do it, as being satisfied in their consciences by the foregoing arguments, or such like, that they do but what they may do lawfully without offence, and hope that it will fall out as it did in the business of the Altar of Ed, Josh. 22, that a right intelligence of their fact will prevent any breach between them and others, and unite them more closely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Consideration of the Oath of the King’s Supremacy</cite>, (London: Hills, 1660), p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e902daaad4" data-kw="">
<blockquote><p>Thirdly, to introduce significant sacred ceremonies into the New testament, other than the holy sacraments of God’s own institution, were to reduce Judaism and to impose upon us again the yoke of a ceremonial Law, which Christ has taken off. … Upon this ground also does Perkins condemn all human significant ceremonies. ‘Ceremonies,’ says he, ‘are either of figure and signification, or of order.’ (Com. On Gal. 3:24) The first are abrogated at the coming of Christ, etc. Upon the same ground does Chemnitius condemn them, Quod vero praetenditur, etc. ‘But whereas,’ says he, ‘it is pretended that by those rites of men’s addition, many things are profitably signified, admonished, and taught: Hereto it may be answered that figures do properly belong to the Old Testament: but those things which Christ would have to be taught in the New Testament, he would have them delivered and propounded, not by shadows, but by the light of the Word. And we have a promise of the efficacy of the Word, but not of figures invented by men. (Exam., part 2, de rit. in admin. sacram., p. 32)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-51d687d320" data-kw="">
<blockquote><p>‘Why then’ (say they) ‘have we cast out all the significant ceremonies of Popery?’ Not for their significancy barely, but for their weight and measure. They are not to them only as outward garnishments of worship, but as proper worship, efficacious and meritorious. Their number stifles devotion and fills it with shows without substance. A cup of water refreshes, but a whole well of water chokes. Yea, an hundred sermons weekly would not edify; they would eat out our conscience in our particular callings. Much more would an hundred ceremonies eat out the substance of our general callings, when a few may much refresh and profit, if judgment overpower fancy and affection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639), sect. 15, p. 207 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-cb89063a1f" data-kw="">
<blockquote><p>§37. It seems to me that mystical signs stated by man in God’s public worship, directly to work grace on his soul from God, and that as instituted, and also to oblige man to God again, are unlawfully brought into the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 409</span></figcaption>

</figure><figure class="quote" id="q-8a9f82966d" data-kw="">
<blockquote><p>Now those first ceremonial observations [of the Early Church with evangelical feasts] are guilty of opening that gate for all the human presumptions to enter into God’s house which pressed in after them: which gate could never be shut from that day to this. 2. Those very feasts made a composition or mixture of human institutions with divine, and therefore did not preserve simplicity. They also were from their first rise not only equalled unto, but also extolled above the Lord’s Day. Easter brought in a superstitious Lent to attend upon it, made baptism wait for her moon: and conformed our Lord’s Supper unto the Jewish Passover in unleavened bread, etc. [3.] It was the first apple of contention among Christians, the first weapon wherewith the Bishop of Rome played his prises [prices?] against other Churches, and after slew so many Britons with by Austin the monk. Holy-days in honor of Christ invited unto them saints’ holy days, etc. 4. It is presumtion to make men’s inventions as guiltless of evil consequences as God’s holy ordinances. They are active efficacious occasions given of evil: these [ordinances of God] are only passive occasions taken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), ch. 1, section 17, pp. 84-85</span></figcaption>

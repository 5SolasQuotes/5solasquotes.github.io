<main class="wrap"><figure class="quote" id="q-f0a7b4c3b5" data-kw="">
<blockquote><p>I would fain leave every one of you upon a good bottom, built upon the rock, that ‘sure foundation,’ Isa. xxviii. 16, which will stand firm and steady in all winds and weather, having that anchor-hold which will abide under all storms. And therefore let me prevail with you to cast off all legal confidence, and to rely, trust, rest upon nothing short of Christ and his righteousness. Duties, graces, holiness, obedience, good works—all, in their proper places, are excellent things; but it is the alone merit, righteousness, satisfaction of Christ that must justify and save you. Would you have that righteousness which will bear the test at the great day?—that righteousness in which you may be able to stand before the disquisition of the righteous God? Oh, then, fly to Christ, to his imputed righteousness, and there let all your trust and reliance be placed!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-jacomb.html">Thomas Jacomb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on the Eighth Chapter of the Epistle to the Romans verses 1–4</cite>, (Carlisle: Banner of Truth, repr. 1996), 175–76</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea26cac1d4" data-kw="">
<blockquote><p>Neither does the renewed confidence of perseverance produce immorality or lack of concern for godliness in those put back on their feet after a fall, but it produces a much greater concern to observe carefully the ways which the Lord prepared in advance. They observe these ways in order that by walking in them they may maintain the assurance of their perseverance, lest, by their abuse of God’s fatherly goodness, the face of the gracious God (for the godly, looking upon that face is sweeter than life, but its withdrawal is bitterer than death) turn away from them again, with the result that they fall into greater anguish of spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 13</span></figcaption>

</figure><figure class="quote" id="q-21abc6618b" data-kw="">
<blockquote><p>Now he gave us that sure communion with himself, when he testified through the preaching of the gospel that he had been given to us by the Father to be ours with all his benefits [Rom. 8:32]. We are said to put on him [Rom. 13:14], to grow together into him [Eph. 4:15], that we may live because he lives. Frequently this doctrine is repeated: that the Father did not spare his only-begotten Son [cf. Rom. 8:32; John 3:15] “that whoever believes in him may not perish” [John 3:16]. But “he who believes in him” is said to have “passed out of death into life” [John 5:24]. In this sense, he calls himself “the bread of life” [John 6:35]; he who eats this bread will never die [John 6:51, 58]. He, I say, was our witness that the Heavenly Father will count as his sons all those who have received him in faith. If we desire anything more than to be reckoned among God’s sons and heirs, we have to rise above Christ. If this is our ultimate goal, how insane are we to seek outside him what we have already obtained in him, and can find in him alone? Moreover, since he is the eternal wisdom of the Father, his unchangeable truth, his firm counsel, we ought not to be afraid of what he tells us in his Word varying in the slightest from that will of the Father which we seek. Rather, he faithfully reveals to us that will as it was from the beginning and ever shall be. The practice of this doctrine ought also to flourish in our prayers. For even though faith in election prompts us to call upon God, still, when we frame our prayers, it would be preposterous to thrust this upon God or to bargain upon this condition: “O Lord, if I have been chosen, hear me.” For it is his will that we be content with his promises, and not inquire elsewhere whether he will be disposed to hear us. This prudence will free us from many traps if we know how to apply to a right use what has been rightly written; but let us not inconsiderately draw out hither and thither what ought to be kept within limits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles, vol. 1 &amp; 2, The Library of Christian Classics (Westminster John Knox Press, 2011), 3.24.5.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5278abd0d3" data-kw="">
<blockquote><p>Take out the Fourth, or any other of the Commandments, and you mar the completeness of God’s revealed will, admit that Christ failed to act up to the strict letter of that, or any of the rest, and you represent God as accepting of less than a perfect obedience to his holy law—truth did not meet with mercy, nor righteousness with peace, in the mighty plan of redemption.

The law contained in these Ten Commandments is that which Christ came not to destroy, but to fulfil. They are one complete whole, and must stand or fall together. There is not one of them repealed, and the rest left standing in their original force.

As the covenant through which life was to be attained, they are all abolished; because the covenant has been fulfilled by the obedience and death of Jesus, and eternal life is brought in as God’s free gift in him. In that respect, therefore, the believer has nothing to do with the law, nor the law with him. But have we, then, no concern with the law? Unquestionably we have. We have to do with it in a most important respect, and with every part of it alike; for, being the expression of God’s holiness, it must ever be the rule and pattern of man’s obedience.

And when fulfilled by Christ as the bond and condition of the covenant, it was of necessity taken up by him, and made the law of his kingdom; a law, indeed, in the hand of a Mediator, and issuing from beneath the mercy-seat, not requiring obedience that we might live, but because we do live — yet still requiring a uniform and complete obedience; abrogated as to none of its demands, and calling to deep humiliation and sorrow of heart as often as we come short of any thing it enjoins.

So that, whatever truth there is in the pattern shown to Moses as a representation of spiritual things under the Gospel, it proclaims the perpetual obligation of the Fourth, as well as of the other nine Commandments; we have no more ground for considering the law of the Sabbath, than for considering the law of chastity, abolished; not one of the Ten is either cancelled or relaxed, but they continue all as before, though in another relation, binding upon the consciences of God’s people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath. Part III. in Christian Miscellany</cite></span></figcaption>

<blockquote><p>I am not, however, so superstitious as to think that all visible representations of every kind are unlawful. But as sculpture and paintings are gifts of God, what I insist for is, that both shall be used purely and lawfully, that gifts which the Lord has bestowed upon us, for his glory and our good, shall not be preposterously abused, nay, shall not be perverted to our destruction. We think it unlawful to give a visible shape to God, because God Himself has forbidden it… Visible representations are of two classes, viz., historical, which give a representation of events, and pictorial, which merely exhibit bodily shapes and figures. The former are of some use for instruction or admonition…</p></blockquote>

</figure><figure class="quote" id="q-792cfe5dde" data-kw="">
<blockquote><p>What shall it profit a man, if he gain the whole world, and lose his own soul? said our Saviour, who was to lay down a ransom for it, and knew well that it would cost infinitely more than the world was worth. Yet, the most of men value their own souls at a far lower rate than the whole world, losing them for broken morsels of it: yea, many times for vain hopes that are never accomplished. And as these men make a miserable bargain, so on the contrary, they that lose the world, or any thing worldly, yea, though it were the whole, to save their souls, make a profitable loss of it.

Nature teaches men to hazard and lose all for the life of the body rather than lose it, (although it proves many times very uncomfortable by the loss of these outward things,) and yet, the most part of men pass their whole life-time without one serious thought of the excellency and importance of their souls, whose life and happiness is of a higher nature, and neither consists in, nor depends upon, any thing here below. Hence it is, that while they use the helps of this present life, and the defences of it when it is in danger, and use them with so much diligence and attention, the means of that better life of their better part, their souls, they either use not at all, or so slightly and coldly that they never find salvation in them.

You may find it some way in yourselves: the threatenings and preparations of men against you, have awakened and roused you more to think upon means of your temporal safety; but how few are sensible and afraid of the wrath of God, who, as our Saviour tells us, can kill both body and soul, and cast them into hell! You want not frequent advertisement from the word of God, so plentifully preached, that many are perishing, one part in gross ignorance of God, another in profane and licentious living, and the greatest part in a formal and lifeless profession of religion, without the power of it; and yet, where are they who lay it to heart, and bestir themselves to rescue their souls from destruction?

Certainly, whatsoever men profess, it is unbelief that is the cause of impenitence. Men are not convinced of the purity of God’s nature, nor sensible of the impurity of their own; therefore they apply not themselves in good earnest to the work of repentance, and to reformation, the liveliest part of it. Labour, then, for a more active and practical knowledge of God and Divine truths, such as may humble and renew your souls; not only that you may be delivered from outward troubles that threaten you, but much more, that you may escape the wrath to come.

And because neither the word preached, nor judgments, nor mercies that are set before you, are sufficient to quicken a dead soul, or soften a hard heart, without the effectual concurrence of the Spirit of God, let us have recour.se to the throne of grace, by humble and earnest prayer, in the name and mediation of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 93-94.</span></figcaption>

<blockquote><p>The sting of Death is Sin, and the strength of Sin is the Law; but thanks be to God, which giveth us the victory, through our Lord Jesus Christ. [1 Cor. 15:56-57] This indeed is our David, who cut off the head of this Goliath with his own sword, killed Death by falling dead upon it; he unstung this Serpent by receiving its sting into his own blessed body. He overcame this great Conqueror, by submitting himself for a time to be conquered by it; when Christ lost his life, then his whole Army of Saints won the day.

Death now to them is no death, that which was their punishment as Sinners, is now their privilege as Saints. That which stood amongst the threatnings of the Law, and was the most formidable of them all, hath now changed its place, and is got amongst the promises of the Gospel. All things are yours, or Life or Death. 1 Cor. 3.21. So precious an oil doth our Apostle extract from this slain Scorpion; so sweet an honey comb doth he find in this dead Lion’s breast, and gives it into the hand of the Saints, to go eating of it, to their unspeakable joy and comfort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Labour and Reward, or, A Sermon, part of which was Preached at the Funeral of the Right Honourable the Lady Mary Vere, relict of Sir Horace Vere, Baron of Tilbury, on the 10th of January, 1671, at Castle Heviningham in Essex</cite>, (London: Ralph Smith, 1672), pp 4-5.</span></figcaption>

Death now to them is no death, that which was their punishment as Sinners, is now their privilege as Saints. That which stood amongst the threatnings of the Law, and was the most formidable of them all, hath now changed its place, and is got amongst the promises of the Gospel. All things are yours, or Life or Death. 1 Cor. 3.21. So precious an oil doth our Apostle extract from this slain Scorpion; so sweet an honey comb doth he find in this dead Lion’s breast, and gives it into the hand of the Saints, to go eating of it, to their unspeakable joy and comfort.”

n X</a><a class="perma" href="../quote/bd51f81db5.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/11/william-gurnall-on-the-death-of-death-in-the-death-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>There is a twofold intention in worship, one formal and properlly religious, and is expounded moral, ex natura rei [out of the nature of the thing], to be religious, it being such an intention, as can have no other state in worship, but a religious state… an intrinsical intention, ex natura et conditione operis [out of the nature and condition of the work], to worship… But there is another intention not religious: if a child read a chapter of the Bible, that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, Signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’, and here the object not being religious, the intrinsical operation cannot raise up any religious intention of the child… the latter intention of the worker, is so far extraneous to worship, as whether it be, or be not, the nature of worship is not impaired nor violated. Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:</p></blockquote>

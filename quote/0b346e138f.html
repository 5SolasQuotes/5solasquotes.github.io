<main class="wrap"><figure class="quote" id="q-0b346e138f" data-kw="">
<blockquote><p>Objection 1. Yet our [Romanist] adversaries quarrel against this most rich and plentiful treasure of the holy Scriptures, alleging that we receive many things by tradition which are not in Scriptures, and yet we believe them; as Mary’s perpetual virginity and the baptism of infants? We make not Mary’s perpetual virginity any matter of religion, but a likely opinion so far as it can be maintained; that it were an unseemly and unfitting thing for a sinful man to use to the act of generation the vessel which was chosen and consecrated by the holy Ghost to so high an use as was the bringing forth of the Savior of the world; it has warrant from the apostle’s charge, Phil. 4:8, of doing whatsoever is honest, whatsoever is of good report, whatsoever is praise-worthy, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity... (1645), ‘A Large Explication of the Body of Christian Religion’</cite>, p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03e5a05929" data-kw="Mary Queen of Heaven Mediator Idolatry">
<blockquote><p>Thirdly, It is a standing testimony against that idolatry which he foresaw his church would in after-ages sink into, in giving undue honours to the virgin Mary, a crime which the Roman catholics, as they call themselves, are notoriously guilty of, when they call her the queen of heaven, the salvation of the world, their mediatrix, their life and hope; … The Son of God is appointed our Advocate with the Father; but the mother of our Lord was never designed to be our advocate with the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, John 2:4</span></figcaption>

</figure><figure class="quote" id="q-1b78151012" data-kw="">
<blockquote><p>8. Question: Since she was ordained by God to be the mother of our Savior, and was thus to remain a pure virgin, why then must she be married to Joseph according to God’s providence? Answer: So that she would have in him a carer and a guardian, who would partly shield her pregnant body from evil suspicion and the strictness of the Mosaic law, and partly protect her and her future son’s holy persons from all violence and inconvenience, and would be helpful to them with advice and deed. … 15th Question: Was the holy Virgin before, during &amp; after the birth, &amp; herewith an ever-pure virgin? Answer: That she was before and during the birth a pure virgin Holy Writ testifies clearly (Isa. 7:14 &amp; Mt. 1:23). Thus, we also do not doubt that after the birth and herewith she was an ever-pure virgin, partly because Holy Writ, if it had been otherwise, would not have concealed such; partly since otherwise the Lord Christ at the cross would not have entrusted her to John, if she had borne other more children. 16th Question: But why is the Lord Christ called (Mt. 1:25) the firstborn son of Mary; and why are the brothers of Christ mentioned (Mk. 6:3)? Answer: He is called the firstborn son of Mary the Lord not because others were after Him, but because no other was born before Him. And those who are named brothers of Christ were not his biological brothers, but according to the manner of speaking common in God’s Word, they were his closest friends and relatives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-heidegger.html">Johann H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Short Instruction on the holy and highly lauded Virgin Mary, for a better understanding of the simple-minded, set up in a question and answer format’ tr. by AI by dvinb150 (Zurich: Gessner, 1673), pp. 5 &amp; 9 German in Schriftmässiger Bericht von der Jungfrauen Maria (Zürich: Gessner, 1673)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-35ce0d0765" data-kw="">
<blockquote><p>Moreover, if you mean by this word expressed that which in scripture is clearly showed out, and appears evidently to every reader or hearer that has but a mean understanding, so do I affirm that there are some things which a man ought to believe, although they be not of him expressly understand [understood]: As I have ever believed that the virgin Mary was and is a perpetual virgin, and that the same might be gathered by the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lambert.html">John Lambert</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Foxe, John, Acts and Monuments of Matters Most Special and Memorable... (London, 1583), The 8th Book, ‘The Answer of John Lambert to the First Article’, p. 1,107. Lambert (d. 1538) was an English protestant martyr who was burned to death. He was a friend of William Tyndale and a member of the humanist theologians which met at White Horse Tavern.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

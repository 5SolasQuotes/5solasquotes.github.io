<blockquote><p>Though all men be equal by nature, in regard of the essential perfection of the soul, yet, in respect of accidental perfections, we find the contrary; for some are by nature blind, some deaf, some dumb, some lame and deformed, some dull, foolish and stupid. I would know then, whether a fool whose body is strong &amp; judgment weak be naturally apter to command, or to serve? And whether he who is of a weak body, and of a strong judgment, is not fitted by nature rather to command then to serve? …

Doubtless, in the state of innocency, there should have been naturally a subordination and subjection, as of children to their parents, of wives to their husbands, and of inferiors to their superiors; for there should have been no more equality then among men, on earth than there was, and is in heaven among Angels, and in hell among Devils; yea, there is naturally subjection among beasts, rex unus apibus, dux unus gregibus. To say then that there is no inequality by nature, is to say, that there is no order in nature which cannot be without subordination; surely, in the state of corrupted nature, to say that all are equal, is to say, that none have sinned, for sin brought in servitude and subjection, so that the effect is no less natural then the cause.

Again, whatsoever is necessary, is also natural; but inequality and subordination among men, who will live together is necessary, and therefore natural; we see also, that the body is naturally subject and subordinate to the soul; animae imperio corporis, servitio utimur. To be brief, seeing among men, there are many defects and imperfections, wants and infirmities, and that naturally; there must be also naturally an inequality and subjection, by which these defects may be supplied; which could not be if all men were equal by nature: Therefore, not Aristotle, but Mr. Hobbs speaks against reason and experience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), pp 19-20.</span></figcaption>

<blockquote><p>Let us now see what theory of political society is deduced by [Thomas] Hobbes from his metaphysics, in his treatises of the Citizen, and “Leviathan.” We must remember that, according to him, there is no supreme uniform standard of moral obligation, and no conscience in man. The only motive of rational conduct is self- interest. Hence, Hobbes naturally infers that the original conception of right which the human being has, is of a natural right to appropriate whatever he sees will contribute to his pleasure, and to avoid whatever produces pain. By the same reason one man feels this right, every other feels the same. The natural state, then, is one in which each man tends to claim all things, and to resist the similar claims of all others.

But by the same natural right, each man is also resisted. Hence, the state of nature is “a war of all against all.” But self-interest cannot become enlightened by experience, without perceiving that this war of all against all tends, on the whole, to the reduction of natural enjoyments to a minimum, and to the universal destruction of persons. Hence, the first acquired desire of nature is for repose from this endless strife of warring wills. How shall that repose be sought? Obviously, only in some force strong enough to suppress the strife; for there is no moral principle in man which can become a regulative standard. The competing wills of individuals being all naturally equal, and all properly exorbitant, there is no reasonable umpire between them but the strong hand. Might makes right.

He who is able to overpower the assailant of his natural good, in the competition, if he chooses not to destroy him, has thereby a perfect property in the spared enemy. Slavery and violent conquest are legitimate; and in this way was actually originated the controlling force which calmed the universal warfare into political society. When a conqueror had compelled a sufficient number of subjugated persons to work and fight for him, to show himself practically superior to all others, he was recognized as the suitable ruler, by all the others whose self-interest taught them to desire repose. Hence in order to secure the peaceable enjoyment of some natural good, they submitted their claims to the remainder to the powerful man, and became willingly a part of his subjugated train.

The essence of political power, then, is force; and in order to gain the end of government, repose, it must be an irresistible force. Government, then, should be absolutely despotic. And it is much more consistent that it should be an absolute monarchy in the hands of one man. The ruler is absolute proprietor of the persons and property of all the citizens; he is wholly irresponsible to them, as to all earthly authority. For, in passing from the state of nature into the political state, each person surrendered his individual independence absolutely to the Ruler, and a surrender of this kind is final and beyond recall.

For, by this act, right of resistance is for the people annihilated; and they have reduced themselves, as holders of such a franchise, to non-existence. The entrance of the integer into political society is, as to his separate rights, final suicide. The Ruler is master, and the citizens are property: property has no appeal against its own proprietor. Any right of conscience against the Ruler’s fiat is, of course, out of the question: for Hobbes does not believe in any conscience that can have rights.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sensualistic Philosophy of the Nineteenth Century, Considered</cite>, (New York: Anson D. F. Randolph &amp; Company, 1875), pp 11-13.</span></figcaption>

<blockquote><p>XVIII. The natural law cannot be said to have undergone a change… XIX. Nor by the introduction of slavery; while before, by the primeval law [Gen. 1], all were free. They were not otherwise free than inasmuch as they were free from criminality. When this entered [with the Fall of Adam], slavery passed upon all. For he who assails another’s liberty deservedly loses his own. Nor if the law of nature makes all men equal with regard to nature does it follow that they are equal with regard to qualities and external condition.</p></blockquote>

<blockquote><p>§13. Question 8: May I give money to a judge or justice or court-officer to hire him to do me justice or to keep him from doing me wrong or to avoid persecution? Answer: You may not, in case your cause be bad, give anything to procure injustice against another; no nor speak a word for it nor desire it: This I take as presupposed. You may not give money to procure justice when the law of the land forbids it and when it will do more hurt accidentally to others than good to you: when it will harden men in the sin of bribery and cause them to expect the like from others. But except it be when some such accidental greater hurt does make it evil, it is as lawful as to hire a thief not to kill me; when you cannot have your right by other means, you may part with a smaller matter for a greater. §14. Question 9. But if I make such a contract, may the other lawfully take it of me? Answer: No: for it is now supposed that it is unlawful on his part. §15. Question 10. But if under necessity or force I promise money to a robber or a judge or officer, am I bound to perform it when necessity is over? Answer: You have lost your own propriety by your covenant and therefore must not retain it. But he can acquire no right by his sin; and therefore some say that in point of justice you are not bound to give it him, but to give it to the magistrate for the poor. But yet prudence may tell you of other reasons a fine to give it the man himself, though justice bind you not to it: as in case that else he may be revenged and do you some greater hurt, or some greater hurt is any other way likely to be the consequent, which it is lawful by money to prevent. But many think that you are bound to deliver the money to the thief or officer himself, because it is a lawful thing to do it, though he have no just title to it; and because it was your meaning, or the signification of your words in your covenant with him. And if it were not lawful to do it, it could not be lawful to promise to do it: otherwise your promise is a lie. To this, those of the other opinion say that as a man who is discharged of his promise by him that it was made to is not to be accounted false if he perform it not, so is it as to the thief or officer in question, because he having no right, is to you as the other that has quit his right. And this answer indeed will prove that it is not strict injustice not to pay the money promised: but it will not prove that it is not a lie to make such a promise with an intent of not-performing it, or that it is not a lie to make it with an intent of performing it, and not to do it when you may. Though here a Jesuit will tell you that you may say the words of a promise with an equivocation or mental reservation, to a thief or persecuting magistrate (of which see more in the chapters of lying, vows and perjury). I am therefore of opinion that your promise must be sincerely made and according to the true intent of it, you must offer the money to the thief or officer; except in case the magistrate forbid you, or some greater reason lie against it, which you foresaw not when you made the promise. But the offender is undoubtedly obliged not to take the money. §16. The same determination holds as to all contracts and promises made to such persons who by injurious force constrained us to make them. There is on us an obligation to veracity, though none to them in point of justice, because they have no proper right; nor may they lawfully take our payment or service promised them. And in case that the public good unexpectedly cross our performance, we must not perform it: Such like is the case of conquerors, and those that upon conquest become their vassals or subjects upon unrighteous terms. But still remember, that if it be not only a covenant with man, but a vow to God, which makes him a party, the case is altered, and we remain obliged. §17. Question 11. But may I promise the thief or bribe-taker to conceal his fault? and am I obliged to the performance of such a promise? Answer: This is a promise of omitting that which else would be a duty. It is ordinarily a duty to reveal a thief and bribe-taker that he may be punished. But affirmatives bind not ad semper [to all times]: no act (especially external) is a duty at all times: therefore not this of revealing an offender’s fault. And if it be not always a duty, then it must be none when it is inconsistent with some greater benefit or duty: For when two goods come together, the greater is to be preferred. Therefore in case that you see in just probability that the concealment of the sinner will do more hurt to the commonwealth or the souls of men than the saving of your life is like to do good, you may not promise to conceal him: or if you sinfully promise it, you may not perform it. But in case that your life is likely to be a greater good than the not promising to conceal him, then such a promise is no fault; because the disclosing him is no duty. But to judge rightly of this is a matter of great difficulty. If it be less than life which you save by such a promise, it oft falls out that it is a lesser good than the detecting of the offence. §18. But it will here be said, ‘If I promise not to conceal a robber, I must conceal him nevertheless; for when he has killed me, I cannot reveal him; and I must conceal the bribe-taker, for till I have promised secrecy, I cannot prove him guilty. And he that promises to forbear a particular good action whilst he lives, does yet reserve his life for all other good works: whereas if he die, he will neither do that nor any other.’ But this case is not so easily determined: If Daniel die, he can neither pray nor do any other good on earth. And if he live, he may do much other good though he never pray: and yet he might not promise to give over praying to save his life. I conceive that we must distinguish of duties essential to the outward part of Christianity, or of constant indispensable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.</p></blockquote>

<blockquote><p>Princes therefore may not suffer bishops to usurp the power of suspending and depriving at their pleasure [as that belongs to presbyteries], and whensoever they commit any such tyranny in smiting of their fellow servants, it is the part of princes to cause these things to be redressed, and for this end graciously to receive the grievances of oppressed ministers. The Arians of old beeing assembled in a Council at Antioch [A.D. 341] (Canon 11), decreed that if any ecclesiastical person should, without the advice and the letters of the bishops of the province, and chiefly of the Metropolitan, go to the emperour to put up any grievance unto him, he should be cast out, not only from the holy communion, but from his proper dignity which he had in the Church. Whereupon Osiander has this observation (Hist. Eccl., Century 4, bk. 2, ch. 48, p. 242): ‘This canon also was composed against holy Athanasius: for Athanasius being expelled by the Arians, had fled to the Emperour Constantine the younger, and had from him obtained a return to his own Church. Now this canon is very unjust, which forbids that a bishop or any other minister of the Church, being unjustly oppressed, flee to his godly civil magistrate: since it was lawful to the apostle paul to appeal to the Roman Emperor, wicked Nero, as the acts of the apostles witness. But it may be seen in this place, that bishops were very soon seeking dominion, yea tyranny over the Church and over their colleges [ecclesiastical assemblies].&#x27;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Princes therefore may not suffer bishops to usurp the power of suspending and depriving at their pleasure [as that belongs to presbyteries], and whensoever they commit any such tyranny in smiting of their fellow servants, it is the part of princes to cause these things to be redressed, and for this end graciously to receive the grievances of oppressed ministers. The Arians of old beeing assembled in a Council at Antioch [A.D. 341] (Canon 11), decreed that if any ecclesiastical person should, without the advice and the letters of the bishops of the province, and chiefly of the Metropolitan, go to the emperour to put up any grievance unto him, he should be cast out, not only from the holy communion, but from his proper dignity which he had in the Church. Whereupon Osiander has this observation (Hist. Eccl., Century 4, bk. 2, ch. 48, p. 242): ‘This canon also was composed against holy Athanasius: for Athanasius being expelled by the Arians, had fled to the Emperour Constantine the younger, and had from him obtained a return to his own Church. Now this canon is very unjust, which forbids that a bishop or any other minister of the Church, being unjustly oppressed, flee to his godly civil magistrate: since it was lawful to the apostle paul to appeal to the Roman Emperor, wicked Nero, as the acts of the apostles witness. But it may be seen in this place, that bishops were very soon seeking dominion, yea tyranny over the Church and over their colleges [ecclesiastical assemblies].&#x27;”

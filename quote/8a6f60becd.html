<main class="wrap"><figure class="quote" id="q-8a6f60becd" data-kw="">
<blockquote><p>The divines who composed the Formula Consensus Helvetica (Johann Heinrich Heidegger, Francis Turretin, and Lucas Gernler) had much to say about the vital Reformed doctrine of the covenant of works. They even condemned the view, held by the likes of Thomas Goodwin and John Cameron, that the promised reward of the covenant of works was eternal earthly life as opposed to eternal heavenly life. They also held that the covenant of grace was only made with the elect in Christ:

Canon VII: As all his works were known unto God from eternity, (Acts 15:18), so in time, according to his infinite power, wisdom, and goodness, he made man, the glory and end of his works, in his own image, and, therefore, upright, wise, and just. Having created man in this manner, he put him under the Covenant of Works, and in this Covenant freely promised him communion with God, favour and life, if indeed he acted in obedience to his will.

Canon VIII: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death.

Canon IX: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself.

Canon X: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head and root with the whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12, 19) and “in Adam all die” (I Cor 15:21-22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty. …

Canon XXIII: There are two ways in which God, the just Judge, has promised justification: either by one’s own works or deeds in the law, or by the obedience or righteousness of another, even of Christ our Guarantor. [This justification] is imputed by grace to those who believe in the Gospel. The former is the method of justifying man because of perfection; but the latter, of justifying man who is a corrupt sinner. In accordance with these two ways of justification the Scripture establishes these two covenants: the Covenant of Works, entered into with Adam and with each one of his descendants in him, but made void by sin; and the Covenant of Grace, made with only the elect in Christ, the second Adam, eternal. [This covenant] cannot be broken while [the Covenant of Works] can be abrogated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-james-t-dennison.html">James T. Dennison Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th and 17th Centuries in English Translation</cite>, (Grand Rapids MI: Reformation Heritage Books, 2014), 4: 522-23, 528.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f56fe54d25" data-kw="">
<blockquote><p>There is still another area in which the Reformed view of the law is influenced by the idea of the covenant. Even after the fall, the law retains something of its covenantal form. The law was not included in the federal relationship without having been affected by it. Even today the call of the law sounds in our ears: such a life I would give you, if only you could fulfil me! God could have wholly eradicated that relation and have taken away the last traces of it from our minds, after the covenant of works was broken. However, He kept its memory alive in us. He has repeated that promise hypothetically and consequently has held up before us constantly the ideal of eternal life to be obtained by keeping the law, a lost ideal though it be. Thus the essential content of the concept of covenant has been kept in our consciousness. When the work of the Spirit by means of the law and the gospel leads to true conversion, in this conversion the longing for this lost ideal of the covenant appears as an essential part. From the above we can also explain why the older theologians did not always clearly distinguish between the covenant of works and the Sinaitic covenant. At Sinai it was not the “bare” law that was given, but a reflection of the covenant of works revived, as it were, in the interests of the covenant of grace continued at Sinai</p></blockquote>

</figure><figure class="quote" id="q-d25d2c5fd9" data-kw="">
<blockquote><p>But, whether that covenant [of works] was also entered into with the second Adam is more difficult to determine. Certainly from one perspective, as a creature and as man, it seems that He cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs). Thus that this moral government was brought upon Him just as upon the rest of Adam’s posterity, according to the intention of God, we do not believe, because: (1) He had been designated by the eternal decree to be the second Adam (1 Peter 1:20; Rom. 5:12ff.), and it is unfitting that the second Adam should have been included with the first Adam in the same covenant, indeed included in him. I need not add that: (2) none were included except those that were to exist from the order of second causes; but the Savior, before sin, was not to exist from the order of second causes. Nor also: (3) can one for whom it is absolutely repugnant to sin be considered to have sinned in another, since it is entirely impossible for the God-man to become a sinner.</p></blockquote>

— Petrus van Mastricht, Theoretical Practical Theology, (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%2C+whether+that+covenant+%5Bof+works%5D+was+also+entered+into+with+the+second+Adam+is+more+difficult+to+determine.+Certainly+from+one+perspective%2C+as+a+creature+and+as+man%2C+it+seems+that+He+cannot+be+exempted+from+the+moral+government+of+God%2C+nor+otherwise+could+He+as+a+man+have+merited+anything+for+Himself.+From+another+perspective%2C+if+He+were+in+Adam+under+the+covenant+of+nature%2C+then+it+would+seem+that+in+and+with+Adam+who+sinned%2C+He+violated+that+same+covenant%2C+which+is+beyond+absurd.+Therefore+it+seems+most+safe+to+state%3A+although+as+a+rational+creature+He+cannot+be+exempted+from+moral+government+with+respect+to+his+natural+duties%2C+yet+He+could+have+been+withdrawn+by+God+from+the+same+moral+governance+in+the+positive+duties%2C+such+as+the+commandment+not+to+eat+of+the+forbidden+fruit+%28upon+the+transgression+of+which+the+sin+of+the+human+race+hangs%29.+Thus+that+this+moral+government+was+brought+upon+Him+just+as+upon+the+rest+of+Adam%E2%80%99s+posterity%2C+according+to+the+intention+of+God%2C+we+do+not+believe%2C+because%3A+%281%29+He+had+been+designated+by+the+eternal+decree+to+be+the+second+Adam+%281+Peter+1%3A20%3B+Rom.+5%3A12ff.%29%2C+and+it+is+unfitting+that+the+second+Adam+should+have+been+included+with+the+first+Adam+in+the+same+covenant%2C+indeed+included+in+him.+I+need+not+add+that%3A+%282%29+none+were+included+except+those+that+were+to+exist+from+the+order+of+second+causes%3B+but+the+Savior%2C+before+sin%2C+was+not+to+exist+from+the+order+of+second+causes.+Nor+also%3A+%283%29+can+one+for+whom+it+is+absolutely+repugnant+to+sin+be+considered+to+have+sinned+in+another%2C+since+it+is+entirely+impossible+for+the+God-man+to+become+a+sinner.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology%2C+%28RHB%29%2C+vol.+3%2C+bk.+3%2C+ch.+12%2C+section+9%2C+%E2%80%98Was+it+%5Bthe+CoW%5D+also+entered+into+with+the+second+Adam%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd25d2c5fd9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d25d2c5fd9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=But%2C%20whether%20that%20covenant%20%5Bof%20works,the%20God%2Dman%20to%20become%20a%20sinner&amp;text=But%2C%20whether%20that%20covenant%20%5Bof%20works%5D%20was%20also&amp;text=impossible%20for%20the%20God%2Dman%20to%20become%20a%20sinner" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eeee457770" data-kw="">
<blockquote><p>Thus have I shown you the nature of the promise of the covenant of works, and the life therein made over conditionally to man. If we consider the life Adam could have expected from God, in a course of obedience, though there had been no covenant, we say, Adam performing obedience, according to the natural law written in his heart, would have had a prosperous life and being, while he had a being; this Adam might conclude from the good and bountiful nature of God. But still it would have been consistent with the nature of God, to have withdrawn his supporting hand from man, so as he might have ceased to be any more. And this would have been but taking away freely what ho gave freely, being under no obligation to continue it; for even Adam’s innocent works could not have properly merited at God’s hand, Rom. xi. 35, “Who hath first given to him, and it shall be recompensed unto him again?” They could have only merited improperly, by virtue of compact, not by the intrinsic worth of the thing. Here,

[1.] The continuation of life to Adam, even while he continued obedient, was entirely due to the covenant God was pleased to make with him. And here was grace even in the covenant of works, that God was pleased by promise to secure the continuance of man’s being, while he continued obedient.

[2.] The right that Adam could have pled to eternal life in heaven, by virtue of his obedience, was entirely founded on the covenant. If God had not revealed to him the promise of it, he could not have known that he should have had it, nor could he have demanded it. The natural law had no such promise. And here was more grace in the covenant of works. And therefore it is no wonder, that though men overturn the gospel-doctrine of free grace, yet they will not take with it. The Pharisees of old, Luke xviii. 11, and the Papists to this day, own free grace in their profession; and what wonder, since innocent Adam, pleading life upon his works, could not have denied but he was debtor to free grace? But here lies the matter; they pat in their own works, their repentance, holiness, and obedience, (turning faith into a work, that it may go in with the rest), between free grace and them, making themselves but debtors to it at second hand for life and salvation.

And if one shall tell sinners, Here you are to do or work nothing for life and salvation, but only receive the free grace gift of life and salvation from Christ by faith, and be debtors at first hand; though withal we tell them, that repentance, holiness, obedience, and good works, are the inseparable attendants of faith; they cry out, Error, Antinomianism, Licentious doctrine! Yet it is the doctrine of the gospel, Tit. iii. 5; Eph. ii. 8. And it is not the doctrine of the gospel, nor does the apostle say, “By grace ye are saved, through works;” for so would Adam have been saved according to the covenant of works, being debtor to free grace at the second hand, which the proud Pharisee was content to be. It is true, Adam’s obedience was perfect, ours is not; but buying is buying still, though one buy ten times below the worth, as well as when he buys at the full value.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Works, from the Sacred Records</cite>, (1772) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 206-07.</span></figcaption>

asquotes.github.io%2Fquote%2Feeee457770.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eeee457770.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/21/thomas-boston-on-merit-and-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>§124. XII. Man, therefore, by the very fact that he was made according to God’s image, has been constituted as in a covenant with God. I call this covenant or pact a firm agreement in mutual obligation because God bound Adam by oath unto loving and seeking him as his God, that is being examined also in an ardent attachment to God together with obedience throughout the examination period, performed to God’s eternal glory in him who will be revealed in beatific life. And in turn he offered to Adam the assurance of what must be expected for standing in uprightness and rectitude, and for observing the law of examination, and from him, as his God, for striving after that revelation of God’s glory in himself, and the blessing in the multiplication of his posterity with God’s image. This is already clearly evident from what has been said.

§125. XIII. In this pact, heavenly life is considered as the reward that must be reckoned according to what is owed. This is usually called merit. But what the nature of this merit would be must be considered. It is not condign. Man is able to pay nothing to God, God accepts nothing from his hands, it is not profitable or beautiful according to man’s work. Man owes everything to God. See Luke 17:10. It, therefore, remains that merit is by the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentarius in Pentateuchum, Josuam, et Librum Judicum</cite>, (Amsterdam, 1669), p. 38. Quoted in Harrison Perkins, ‘Meritum ex Pacto in the Reformed Tradition: Covenantal Merit in Theological Polemics’, Mid-American Journal of Theology, 31 (2020), p. 71.</span></figcaption>

<blockquote><p>Obs. II. God hath filled the Scripture with truth. Whence one said well, “Adoro plenitudinem Scripturarum,” — “I reverence the fullness of the Scriptures.” Ps. cxxxviii. 2, “He hath magnified his word above all his name;” or made it more instructive than any other way or means whereby he hath revealed himself.

For not only doth the whole Scripture contain the whole counsel of God, concerning his own glory and worship, our faith, obedience, and salvation, but also every parcel of it hath in it such a depth of truth as cannot by us be perfectly searched into. Ps. cxix. 18, “Open thou mine eyes,” saith the psalmist, “that I may behold wondrous things out of thy law.”

There are wonderful things in the word, if God be pleased to give us light to see it. It is like a cabinet of jewels, that when you pull out one box or drawer and search into it, you find it full; pull out another, it is full; and when you think you have pulled out all, yet still there are some secret recesses in the cabinet, so that if you search further you will find more. Our apostle seems to have drawn out all the boxes of this cabinet, but making a second search into the words, he finds all these things treasured up, which he had not before intimated nor touched upon. It was said by some of old, that the “Scripture hath fords where a lamb may wade, and depths where an elephant may swim.” And it is true in respect of the perspicuity of some places, and the difficulty of others.

But the truth is also, that God hath in his grace and wisdom so ordered its concernments, that, — 1. What from the nature of the things themselves, which are suited unto the various states, conditions, and apprehensions of the minds of men; 2. What from the manner of their expression, on which a character of divine wisdom is impressed; 3. What from the authority of God putting itself forth in the whole and every particular; 4. What from its being not only “propositio veritatis,” but “vehiculum gratiae;” many, most, yea, all the particular places of it and passages in it, are such as through which a lamb may wade safely, and an elephant swim without danger of striking against the bottom.

Let any lamb of Christ come, in that order, with that reverence unto the reading or hearing the word of God (the Scripture itself I mean) which is required, and he will find no place so dark or difficult but that it will yield him that refreshment which is suited unto him and safe for him, and something of God he will obtain; for either he will find his graces excited, or his mind enlightened, or his conscience peculiarly brought into a reverence of God.

And let the wisest, the most learned and experienced person, that seems like an elephant in spiritual skill and strength amongst the flock, come to the plainest place, to search out the mind and will of God in it, if he be humble as well as learned, — which if he be not he is not wise, — he will scarce boast that he hath been at the bottom of it, and hath perfectly comprehended all that is in it, seeing whatever we know, “we know but in part.” And they may all of them, elephants and lambs, meet at the same passages of this river that makes glad the city of God, these waters of rest and quietness, Ps. xxiii. 2, where the lambs may wade safely, and the elephants swim together.

The poorest of the flock, in the right use of means, may take enough for themselves, even suitable direction and refreshment, from those very places of Scripture whose depths the learnedest guides of the church are not able to sound or fathom. Not only in several places, but in the same place, text, or testimony of Scripture, there is food meet for the several ages of Christians, whether babes and children or strong men; with light and direction for all sorts of believers, according to the degrees of their own inward light and grace. It is like manna, which, though men gathered variously according to their strength and appetite, yet every one had that proportion which suited his own eating.

When a learned man, and one mighty in the Scriptures, undertakes the consideration of a place of Scripture, and finds, it may be, in the issue, that with all his skill and industry, with all his helps and advantages, though attended in the use of them with fervent prayer and holy meditation, he is not able to search it out unto perfection, let him not suppose that such a place will be of no advantage unto them who are not sharers in his advantages, but rather are mean and unlearned; for they may obtain a useful portion for themselves where he cannot take down all.

If any one look on this river of God like behemoth on Jordan, “trusting that he can draw it up into his mouth,” or take up the whole sense of God in it, he of all others seems to know nothing of its worth and excellency. And this ariseth, as was observed, principally from the things themselves treated of in the Scripture. For, divine and spiritual truths having God not only as their immediate fountain and spring, but also as their proper and adequate object, there is still somewhat in them that cannot be searched out unto perfection.

As he said, “Canst thou by searching find out God? canst thou find out the Almighty unto perfection?” Job xi. 7, עַד־תַּכְלִ֖ית שַׁדַּ֣י תִּמְצָֽא, — “find him out to a perfect comprehension,” or “to a consummation of knowledge,” that it should be perfect. This neither the nature of God nor our condition will admit of. We do at best but “follow after,” that we may in our measure “apprehend that for which we also are apprehended of Christ Jesus,” Phil. iii. 12.

And these things are so tempered by divine wisdom unto the faith and light of believers, and therein unto the uses of their consolation and obedience, that something hereof is plainly exhibited to every spiritual eye: always provided that their search and inquiry be regulated according to the will of God, in a due use of the means; for to this purpose not only the private endeavours of men are required, but the use also of the public ministry, which is ordained of God to lead men gradually into continual further acquaintance with the will of God in the Scripture.</p></blockquote>

<blockquote><p>WHAT ought you to believe concerning the Scriptures, the fountain of all Divine knowledge.

A. That the whole Scriptures were given by the inspiration of God, and so are the very word of God.

Proofs.

2 Tim. 3. 16. All Scripture is given by inspiration of God, &amp;c.

2 Pet. 1. 21. For the Prophecy came not in old time, by the will of man, but holy Men of God, spake as they were moved by the holy Ghost.

Q. What else?

A. That they are perfect every way sufficient of themselves, to direct us in all things needful to holiness or salvation.

Proofs.

Psal. 19. 7. The Law of the Lord is perfect, &amp;c.

2 Tim. 3. 16. 17. And is profitable for doctrine, for reproof, &amp;c. That the man of God may be perfect, &amp;c.</p></blockquote>

<blockquote><p>It is written. I where? Ans. Nowhere in express words, but it is gathered out of the 16 Chap. and 21 Chap. of Genesis: as if he had said, by conference of Scripture, it may be gathered. Whence ariseth this observation: That the sense and collection of the Scripture, is rightly called Scripture; although the sense is not in express &amp; entire terms, anywhere: and this is oft used in the Epistle to the Hebrews: This is to be noted against Arius Sabellius and such Heretics, who when they did impugn the Divinity of CHRIST, and the distinction of Persons in the unity of Essence in the blessed Trinity, they did condemn the names and words of Essence, Consubstantial, Subsistence, Unity, Trinity, which were used of the ancient Fathers; to open these mysteries, they I say, accused them of Novelty and falsehood; because not found expressly in the Scripture. But by this place of Paul we learn that there is no need that every word and syllable be found in the Scripture, so that if the reason thereof be manifest out of the true sense of the Scripture, it is all one; as if it had been written:

Secondly, hence we learn, what we are to judge of the Sermons of Ministers. It must needs be, that in Preaching, while they open the Doctrine and exhort, that they utter many words and sentences, which in every syllable are not found in Scripture; yet while they speak out of the true sense of Scripture, all their words are the words of God: Neither is there hereby any way made for the Papists, to establish their smoky and reasty traditions, who when they hear those terms of Consubstantial, Coessential, &amp;c. Think that they may by the like right, obtrude upon us their foolish Superstitions as authorized by Scripture; for herein as in all other things, they err fondly; for though is be lawful to devise new words, the ground and meaning whereof is manifest out of the Scripture, yet to coin names repugnant to Piety, or such as through their ambiguity may bring the same in danger, is wicked and not to be attempted.</p></blockquote>

<blockquote><p>The same reasons which do urge, that the holy Scriptures should be written in a known tongue, do likewise proportionally enforce, that divine and godly Treatises upon several passages and places of Scripture, should be made familiar unto the unlearned and common people, as whereby they may be the better enabled to understand the Scriptures, and so to be furthered in their Salvation.

So that if thou censure the translating of such Authors, thou wilt very easily draw upon thee the blemish and suspicion of Popery itself. Thou must not think, gentle Reader, that the Lord would have it to be amongst us now, as he himself caused it to be amongst them which built the tower of Babel, whose language was so confounded, that they perceived not one another’s speech, but that God would have it so to be in his Church now, as that every man should say, We heard them speak, in our own language, the wonderful works of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-allibond.html">Peter Allibond</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the gentle reader in Herman Renecher, The golden chain of salvation</cite></span></figcaption>

</figure><figure class="quote" id="q-7f085aca17" data-kw="">
<blockquote><p>16. The greater light I have said, that Moses does not here subtilely descant, as a philosopher, on the secrets of nature, as may be seen in these words. First, he assigns a place in the expanse of heaven to the planets and stars; but astronomers make a distinction of spheres, and, at the same time, teach that the fixed stars have their proper place in the firmament. Moses makes two great luminaries; but astronomers prove, by conclusive reasons that the star of Saturn, which on account of its great distance, appears the least of all, is greater than the moon. Here lies the difference: Moses wrote in a popular style things which without instruction, all ordinary persons, endued with common sense, are able to understand; but astronomers investigate with great labor whatever the sagacity of the human mind can comprehend. Nevertheless, this study is not to be reprobated, nor this science to be condemned, because some frantic persons are wont boldly to reject whatever is unknown to them. For astronomy is not only pleasant, but also very useful to be known: it cannot be denied that this art unfolds the admirable wisdom of God. Wherefore, as ingenious men are to be honored who have expended useful labor on this subject, so they who have leisure and capacity ought not to neglect this kind of exercise. Nor did Moses truly wish to withdraw us from this pursuit in omitting such things as are peculiar to the art; but because he was ordained a teacher as well of the unlearned and rude as of the learned, he could not otherwise fulfill his office than by descending to this grosser method of instruction. Had he spoken of things generally unknown, the uneducated might have pleaded in excuse that such subjects were beyond their capacity. Lastly since the Spirit of God here opens a common school for all, it is not surprising that he should chiefly choose those subjects which would be intelligible to all. If the astronomer inquires respecting the actual dimensions of the stars, he will find the moon to be less than Saturn; but this is something abstruse, for to the sight it appears differently. Moses, therefore, rather adapts his discourse to common usage. For since the Lord stretches forth, as it were, his hand to us in causing us to enjoy the brightness of the sun and moon, how great would be our ingratitude were we to close our eyes against our own experience? There is therefore no reason why janglers should deride the unskilfulness of Moses in making the moon the second luminary; for he does not call us up into heaven, he only proposes things which lie open before our eyes. Let the astronomers possess their more exalted knowledge; but, in the meantime, they who perceive by the moon the splendor of night, are convicted by its use of perverse ingratitude unless they acknowledge the beneficence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1:16</span></figcaption>

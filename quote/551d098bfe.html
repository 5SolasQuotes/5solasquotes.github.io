<main class="wrap"><figure class="quote" id="q-551d098bfe" data-kw="">
<blockquote><p>We leave our duty but half-performed, if we do not follow missionaries and bibles with prayer — unceasing, earnest prayer. God may, indeed, in his sovereign grace, send forth the Spirit in converting efficacy, irrespective of our prayerlessness, and he may make the bibles and the missionaries that have been sent forth by prayerless men, “the savour of life unto life;” but, besides that this does not alter the obligation under which he has laid us, — it is an expectation which we are not warranted to entertain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-lumsden.html">James Lumsden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Nations to the Church, and their Danger in Neglecting it in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>why does Moses in this place [Dt. 33:16] set Him in the bush? It is because God had there showed Himself unto Him… God considers how it is for our benefit to have some familiarity with Him: and thereupon He yields to our rudeness, and takes upon Him as it were a new shape, howbeit not which is contrary (as I said afore), but to the intent that we should not be scared, nor take occasion to shrink from Him. Now then, He allures us gently, and therewithal He stops to us and makes Himself as it were mean [lowly] unto us…. But we see how He showed Himself to the fathers of old-time under certain shapes. As for example when He talked with Jacob in Bethel, it was because Jacob needed such confirmation (Gen. 28:13)… …as if he should say, ‘…he appeared to me in the bush, and there I knew his majesty…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 196, pp. 1215-16</span></figcaption>

ne</a></div>
</figure><figure class="quote" id="q-eb993231c9" data-kw="">
<blockquote><p>We do not mean, however, properly speaking, that it is faith itself that justifies us — for faith is only the instrument by which we embrace Christ, our righteousness. But Jesus Christ is our righteousness in making available to us all his merits and all the holy works he has done for us and in our place. And faith is the instrument that keeps us in communion with him and with all his benefits. When those benefits are made ours they are more than enough to absolve us of our sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belgic-confession.html">Belgic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 22</span></figcaption>

</figure><figure class="quote" id="q-5916053771" data-kw="">
<blockquote><p>If it be here replied that the actions which make up mediate worship, must be actions of the Second Table, not of the First… I answer: It is the verdict of the Word and the common consent of all divines that all the actions and duties which concern our brother as the next object and end, and so determine upon him are required, and regulated by the Second Table: since therefore these things of comliness and order are of this nature, by the Rejoinder’s grant, I do not see how it can be avoided with any colour of reason but they must be commanded in the Second Table, and so come under the definition of mediate worship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), Manuduction, ch. 12, ‘Concerning Worship’, p. 137</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

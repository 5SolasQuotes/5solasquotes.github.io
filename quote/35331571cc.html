<main class="wrap"><figure class="quote" id="q-35331571cc" data-kw="natural knowledge Romans 1">
<blockquote><p>The Scripture ascribes a knowledge of God to all nations in the world, Rom. 1:19; not only a faculty of knowing, but an actual knowledge: “manifest in them”; “they knew God”—not they might know him, they knew him when they did not care for knowing him. The notices of God are as intelligible to us by reason as any object in the world is visible; he is written in every letter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Existence of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a> › <a href="../topics/existence-and-knowledge-of-god/existence-of-god/testimony-of-conscience-creation-and-the-spirit.html">Testimony of conscience, creation, and the Spirit</a></span></div>

</figure><figure class="quote" id="q-246d1243ea" data-kw="existence revelation incomprehensible">
<blockquote><p>Although the Deity is unbounded and incomprehensible, yet because God has condescended to reveal himself to us both in nature and in the Scriptures (and it is incumbent upon the one who approaches God to believe that he is and is a rewarder of those who seek him, Heb. 11:6), the discussion concerning God holds the first place in theology and embraces the sum of all saving knowledge.</p></blockquote>

</figure><figure class="quote" id="q-acf12c4772" data-kw="revelation nature Scripture">
<blockquote><p>God has condescended to reveal himself to us both in nature and in the Scriptures. First, that we may know that he is (with respect to existence) against the atheist. Second, that we may know what he is (with respect to his nature and attributes) against the heathen. Third, that we may know who he is (with respect to the persons) against the Jews and heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.1.1–2</span></figcaption>

</figure><figure class="quote" id="q-976da217e1" data-kw="atheism speculative practical">
<blockquote><p>While we admit there are many practical atheists, we deny that there are any speculative. A speculative atheist is either direct and express or indirect and interpretative. The direct is one who shakes off all knowledge and sense of deity; but such, properly speaking, there are none, because the sense of deity can never be wholly erased from the mind of man.</p></blockquote>

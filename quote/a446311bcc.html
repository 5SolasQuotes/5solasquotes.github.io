<main class="wrap"><figure class="quote" id="q-a446311bcc" data-kw="">
<blockquote><p>When therefore you meet with those that fear God, make improvement of the communion of saints, not only by communicating in natural, and temporal good things as you are able, and as there is need; but especially in the communion of things spiritual, edifying yourselves in your most holy faith, by holy speech and conference, and in due time and place) in reading the holy Scriptures &amp; good books, and by prayer, and singing of Psalms together (Col. 3:16, Rules of singing). That your singing may please God, and edify yourself and others, observe these: Sing as in Gods sight, and, in matter of prayer &amp; praise speak of God in singing. The matter of your song must be spiritual, either indited by the Spirit, or composed of matter agreeing thereunto (Col. 3:16). You must sing with understanding. You must sing with judgement, being able in private to make choice of Psalms befitting the present times and occasions; And both in private and public to apply the Psalm sung to your own particular, as when and how to pray and praise in the words of the Psalm, taking heed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace… (London, 1631), ch. 9, ‘Of keeping Company, as in the sight of God’, section 3, p. 236-7. While Scudder in the passage immediately below allows Col. 3:16 to speak of uninspired compositions in the context of private or social conference, yet the only reference in the book to the content of the Church’s public praise is to ‘psalms’ simply, as is documented below.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-cbe38a60ce" data-kw="">
<blockquote><p>I gave account of their express words [that of the Quakers], ‘We are against all your David’s praises and prophecies in meter’, contrary to Eph. 5:19; Col. 3:16 and other Scriptures. R.F. makes me this return, ‘Singing of psalms, and hymns and spiritual songs, we are not against, but own; but your poetry we deny.’ Response: He might as well say, your translation of them into English meter we deny: but if psalms, hymns and spiritual songs be owned, they are either David’s, and other of saints’ penning, and the Spirit’s inditing [composing] in the Scripture, or of their [the Quakers’] own composing. If they own none but of their own composing, they reject David’s, and what was left for our use in Scripture… And what better poetry than that in the Scripture? which is translated and ordered as suiteth best to our own mother tongue, for singing, and teaching others to sing David’s words and praises, with David’s spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-stalham.html">John Stalham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reviler Rebuked: or, A Re-Enforcement of the charge against the Quakers: so called for their contradictions to the Scriptures of God, and to their own scriblings (London, 1657), 15th Head, ‘Concerning Singing’, Section 42, p. 205. Stalham (d. 1677) was a reformed puritan.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>[The Objection of Quakers:] But our Psalms are not the same in meter, nor the same tunes which the Jews had. [Answer:] That seeing the singing of Psalms is a duty commanded, and amongst others, those of David, and has hid from us the Hebrew tunes, wherewith the Psalms of David were wont to be sung, it must needs follow that the Lord has left it to the liberty of the Church to sing them in such plain, grave tunes as may fit the solemnity of God’s worship, and that because that tunes are but circumstantial and not the substance; and the Church now in the days of the Gospel is not in her minority or young age, but in her man-age, or full grown age, as the apostle speaketh (Gal. 4:1-6), and therefore fitter to appoint circumstantial things in God’s worship than the Jews, being in their non-age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gaskin.html">John Gaskin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Just Defence &amp; Vindication of Gospel Ministers &amp; Gospel Ordinances Against the Quakers’ many False Accusations, Slanders &amp; Reproaches. In answer to John Horwood, his Letter, &amp; E.B. his Book… (London, 1660)</cite>, pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

e" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The apostle names three sorts of them [i.e. ‘divine canticles’], psalms, hymns, or praises, and odes, or songs… You have various examples of them all in the book of Psalms… It is with these sacred lyres, of which the word of Christ affords us both the matter and the form, that the apostle would have us solace ourselves. St. James gives us orders for it: ‘Is any among you merry? let him sings psalms,’ James 5:13. The apostle calls all these sonnets spiritual, both on account of their author, who is the Holy Spirit, and also of their matter, which concerns only divine and heavenly things, the glory of God, and our salvation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-daille.html">John Daille</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Daille (1594-1670) was a French Huguenot. Commentary on Col.</cite>, 3:16</span></figcaption>

<main class="wrap"><figure class="quote" id="q-6c4c0825ad" data-kw="">
<blockquote><p>This excellency of the subject notwithstanding ought not to dull the edge of our most diligent search into it, but sharpen it rather, to endeavour so to define justification, that we may justify our definition. Which we cannot do, without distinguishing of a three-fold righteousness: first, a perfect righteousness, but not inherent; of which, 2 Cor. 5.21. secondly, inherent, but not perfect; of which, Luke 1.75. and Apoc. 22.11. thirdly, perfect and inherent, of which, Heb. 12.23. The first, is the righteousness by which we are justified; the second, by which we are sanctified; and the third, by which we are glorified.

The first consisteth as well of Christ’s active as his passive obedience, and in the imputation thereof by faith consisteth the essence of our justification, which may be thus defined: an act of God, whereby he acquitteth every penitent and believing sinner, by not imputing to him his sins, and imputing to him the perfect satisfaction and righteousness of Christ.

Every part of this definition may be proved by clear testimonies of Scripture; and besides, it hath that … certain mark or touch-stone of a true definition, that it meeteth with all doubts, and confronteth all errors broached against the nature of justification: first, the error of the Libertines, by that clause, every penitent: secondly, of the Antinomians, in the clause, not imputing their sin: thirdly, the Socinians, in the clause, perfect satisfaction: and lastly, the Arminians and Papists, in the last clause, imputing Christ’s righteousness, no habit or act of ours, no, not the act of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacra nemesis, The Levite’s scourge, or, Mercurius disciplined. Also diverse remarkable disputes and resolved in the Assembly of Divines related, episcopacy asserted, truth righted, innocency vindicated against detraction</cite>, (Oxford: Leonard Lichfield, 1644), p. 20.</span></figcaption>

<blockquote><p>I have therefore found in your [Beza’s] published letters two, namely Epistles 35 and 45, in the former of which you touch briefly upon this controversy, but in the latter you discuss it more fully and at greater length. In Epistle 35, then, you say: ‘What is more absurd than to reckon that man just who has not fulfilled the Law?’ But I reply: the righteousness of the Gospel must be carefully distinguished from the righteousness of the Law. That righteousness by which we are accounted righteous by God, and therefore justified or absolved by Him, is not the righteousness of the Law; for God does not justify us on the ground that either we ourselves have fulfilled the Law, or that Christ has fulfilled it for us. Rather, it is the righteousness of the Gospel, that is, that which God bestows upon us through the Gospel—namely, the remission of sins obtained by the blood of Christ. Therefore we seek life from God not by the right of a fulfilled Law or of obedience rendered to the Law, but by the right of adoption, which Christ has procured for us by his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Examen sententiae Domini Theodori Bezae, De justificatione Hominis coram Deo, quae habetur in annotatione ad Rom. 8</cite>, v. 2’ in Correspondance de Théodore de Bèze (1586), eds. Dufour, Genton &amp; Nicollier-de Weck, vol. 27, Travaux d’humanisme et Renaissance 401 (Geneva: Librairie Droz, 2005), p. 59, trans. ChatGPT-5 For a discussion of the import of the below, see Brink, The Transfer of Sin (Brill, 2024), pp. 219-20 ff.</span></figcaption>

<blockquote><p>Howbeit this exposition of the term justification seems faulty as well as the former: and that two ways: … 2. With them all, it presumes in the matter of justification a needles twofold act, the not-imputation of sin, and the imputation of righteousness, as two distinct things; whereas not to impute sin in consideration of satisfaction made for it, is no other thing than to impute righteousness to the party therein concerned. Since that a man cannot be deemed or doomed guiltless or faultless, but he must of necessity be deemed or doomed just or righteous; there being no medium or middle state between a delinquent or a guilty person and one guiltless or just. He that can prove himself no delinquent, but free from fault, must of necessity be justified, acquitted and assoiled as just. See Dt. 25:1. If nothing but sin can make a man unjust, then surely the utter absence of sin must necessarily make a man just. See Paul’s plea, Acts 25:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), pp. 19-20</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Howbeit this exposition of the term justification seems faulty as well as the former: and that two ways: … 2. With them all, it presumes in the matter of justification a needles twofold act, the not-imputation of sin, and the imputation of righteousness, as two distinct things; whereas not to impute sin in consideration of satisfaction made for it, is no other thing than to impute righteousness to the party therein concerned. Since that a man cannot be deemed or doomed guiltless or faultless, but he must of necessity be deemed or doomed just or righteous; there being no medium or middle state between a delinquent or a guilty person and one guiltless or just. He that can prove himself no delinquent, but free from fault, must of necessity be justified, acquitted and assoiled as just. See Dt. 25:1. If nothing but sin can make a man unjust, then surely the utter absence of sin must necessarily make a man just. See Paul’s plea, Acts 25:8.”

— Thomas Gataker, An Antidote Against Error Concerning Justification, … (d. 1654; London: Brome, 1670), pp. 19-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowbeit+this+exposition+of+the+term+justification+seems+faulty+as+well+as+the+former%3A+and+that+two+ways%3A+%E2%80%A6+2.+With+them+all%2C+it+presumes+in+the+matter+of+justification+a+needles+twofold+act%2C+the+not-imputation+of+sin%2C+and+the+imputation+of+righteousness%2C+as+two+distinct+things%3B+whereas+not+to+impute+sin+in+consideration+of+satisfaction+made+for+it%2C+is+no+other+thing+than+to+impute+righteousness+to+the+party+therein+concerned.+Since+that+a+man+cannot+be+deemed+or+doomed+guiltless+or+faultless%2C+but+he+must+of+necessity+be+deemed+or+doomed+just+or+righteous%3B+there+being+no+medium+or+middle+state+between+a+delinquent+or+a+guilty+person+and+one+guiltless+or+just.+He+that+can+prove+himself+no+delinquent%2C+but+free+from+fault%2C+must+of+necessity+be+justified%2C+acquitted+and+assoiled+as+just.+See+Dt.+25%3A1.+If+nothing+but+sin+can+make+a+man+unjust%2C+then+surely+the+utter+absence+of+sin+must+necessarily+make+a+man+just.+See+Paul%E2%80%99s+plea%2C+Acts+25%3A8.%E2%80%9D%0A%0A%E2%80%94+Thomas+Gataker%2C+An+Antidote+Against+Error+Concerning+Justification%2C+%E2%80%A6+%28d.+1654%3B+London%3A+Brome%2C+1670%29%2C+pp.+19-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F488385444a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/488385444a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Howbeit%20this%20exposition%20of%20the%20term,just.%20See%20Paul%E2%80%99s%20plea%2C%20Acts%2025%3A8&amp;text=Howbeit%20this%20exposition%20of%20the%20term%20justification%20seems&amp;text=a%20man%20just.%20See%20Paul%E2%80%99s%20plea%2C%20Acts%2025%3A8" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

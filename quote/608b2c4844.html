<blockquote><p>…In Hos. 6:7 we read: “But they like Adam have transgressed the covenant.” Attempts have been made to discredit this reading. Some have suggested the reading “at Adam,” which would imply that some well-known transgression occurred at a place called Adam. But the preposition forbids this rendering. Moreover, the Bible makes no mention whatever of such a well-known historical transgression at Adam. The Authorized Version renders “like men,” which would then mean, in human fashion. To this it may be objected that there is no plural in the original, and that such a statement would be rather inane, since man could hardly transgress in any other way. The rendering “like Adam” is after all the best. It is favored by the parallel passage in Job 31:33; and is adopted by the American Revised Version.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids: Wm. B. Eerdmans publishing co., 1938), 214–15.</span></figcaption>

<blockquote><p>God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfill it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 93</span></figcaption>

</figure><figure class="quote" id="q-7457ef94db" data-kw="">
<blockquote><p>1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law.

2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it.

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.</p></blockquote>

s+for+them%3B+like+Adam%2C+they+have+transgressed+the+covenant.%E2%80%9D+Our+translators+set+the+word+Adam+on+the+margin.+But+in+Job+31%3A33%2C+they+translate+the+very+same+word%2C+%E2%80%9Cas+Adam.%E2%80%9D+This+word+occurs+but+three+times+in+scripture%2C+and+still+in+the+same+sense.+Job+31%3A33%2C+%E2%80%9CIf+I+covered+my+transgressions%2C+as+Adam%2C%E2%80%9D+Psalm+82%3A7%2C+%E2%80%9CBut+ye+shall+die+like+Adam.%E2%80%9D+Compare+ver.+6%2C+%E2%80%9CI+have+said%2C+Ye+are+gods%3B+and+all+of+you+are+children+of+the+Most+High%3B%E2%80%9D+compared+with+Luke+3%3A38%2C+%E2%80%9CAdam%2C+which+was+the+son+of+God.%E2%80%9D+And+also+here%2C+Hos.+6%3A7.+While+Adam%E2%80%99s+hiding+his+sin%2C+and+his+death+are+made+an+example%2C+how+natural+is+it+that+his+transgression%2C+that+led+the+way+to+all%2C+be+made+so+too%3F+This+is+the+proper+and+literal+sense+of+the+words%3B+it+is+so+read+by+several%2C+and+is+certainly+the+meaning+of+it.+3.+We+find+a+law+of+works+opposed+to+the+law+of+faith%2C+Rom.+3%3A27.+%E2%80%9CWhere+is+boasting+then%3F+It+is+excluded.+By+what+law%3F+of+works%3F+Nay%3B+but+by+the+law+of+faith.%E2%80%9D+This+law+of+works+is+the+covenant+of+works%2C+requiring+works%2C+or+obedience%2C+as+the+condition+pleadable+for+life%3B+for+otherwise+the+law+as+a+rule+of+life+requires+works+too.+Again%2C+it+is+a+law+that+does+not+exclude+boasting%2C+which+is+the+very+nature+of+the+covenant+of+works%2C+that+makes+the+reward+to+be+of+debt.+And+further%2C+the+law+of+faith+is+the+covenant+of+grace%3B+therefore+the+law+of+works+is+the+covenant+of+works.+So+Rom.+6%3A14%2C+%E2%80%9CYe+are+not+under+the+law%2C+but+under+grace.%E2%80%9D+And+this+was+the+way+of+life+without+question%2C+which+was+given+to+Adam+at+first.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Discourses+on+Prayer%2C+ed.+Samuel+M%E2%80%98Millan+%28Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+11.180%E2%80%9382.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7457ef94db.html&amp;vi <blockquote><p>Jer. chap. 31:31 Behold, the days come, says the Lord, that I will make a new covenant with the house of Israel, with the house of Judah, 32 Not according to the covenant that I made with their fathers, when I took them by the hand to bring them out of the land of Egypt, the which my covenant they broke, although I was a husband unto them, says the Lord. 33 But this shall be the covenant that I will make with the house of Israel, After those days, says the Lord, I will put my Law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people. 34 And they shall teach no more every man his neighbor, and every man his brother, saying, ‘Know the Lord:’ for they shall all know me from the least of them to the greatest of them, says the Lord: for I will forgive their iniquity, and will remember their sins no more. What follows to be spoken of? The covenant of grace. Seeing by the covenant of works life everlasting is propounded, what need is there that the covenant of grace should be set before us? Because, as has been said, the covenant of works cannot through the infirmity of our flesh give life to any: And therefore if God should justify any by it, he should be unjust, as one that should give the kingdom of heaven to wicked men. Seeing the nature of a covenant is to reconcile and join those together which are at variance; as we see in the example of Abraham, and Abimelech, Laban and Jacob: why is this called the covenant that can make no reconciliation between God and us? Although it be not able to reconcile us, yet it does make way to reconciliation by another covenant: neither is it meet strictly to bind God’s covenant with men, to the laws or covenants of one man with another; for among men the weaker seeks reconciliation at the hand of the mightier: but God neither able to be hurt or benefited by us, seeks unto us for peace. What is the covenant of grace? That God will give us life everlasting through Christ, if we believe in him. How are they convinced by the giving of this covenant, which seek righteousness in the law or old covenant? Because thereby they make God unwise, that would enter into a new and second covenant, if the former had been sufficient. Of how many sorts is this? It is either the old or new Testament. What is the old Testament? It is the covenant of God, under shadows to give life everlasting by faith in Christ that was to come. What is the new Testament? It is the covenant of God, without shadows to give life everlasting by faith in Christ that is come. Are these Testaments divers? They be in substance the same, but in manner they differ. What are the parts of this covenant of God? Two: the one is the covenant that God makes with us; the other is the covenant that we make with God. What is the sum of that covenant God makes with us.? That he will be our God.</p></blockquote>

<blockquote><p>From that which has been said two things may be gathered:

1. How the Covenant made with Adam, called by some divines the Covenant of Nature, agrees and differs from the Covenant of Grace. They agree in a general consideration of: [1] The author, which is God only wise, most holy, our supreme and absolute sovereign.

2. The matter of the covenant, which is a commandment and promise of reward.

3. The persons contracting or covenanting, which are God and man.

4. The subject not differenced by special respects, for the Law was given and [the] Gospel [was] revealed to man.

5. The form of administration, because to both covenants is annexed a restipulation.

6. The end, viz. the blessedness of man, and the glory of God manifested in his wisdom, bounty and goodness.

7. As Adam in the state of Innocency was made able to fulfill the Covenant made with him: so is the Covenant of Grace written in the hearts of them that are heirs of the promise in Christ. They differ:

1. In the special consideration of the author, cause and foundation of the Covenants. God gave his Law to Adam as bountiful and gracious to his creature entire and perfect, but in strict justice requiring obedience, promising a reward and denouncing punishment. But the Covenant of Grace he made as a loving Father in Jesus Christ, of his mere grace promising to receive them into favor, that sincerely and unfeignedly turn unto Him. The creation of man and integrity of human nature is the foundation of the former Covenant: but the redemption of man by Christ is the foundation of the Covenant of Grace.

2. In the form of sanction. In the Covenant of Nature there is no mediator: but the Covenant of Grace is made in Christ, in whom God has made us accepted. The Covenant of Nature was not promised before it was promulgated: but the Covenant of Grace was first promised, and long after promulgated and established or ratified in the blood of his Son.

3. In the special matter of the Covenants, and that both in respect of the promise and stipulation. For the Covenant of Nature promised life, but not righteousness: but in the Covenant of Grace God promises to tread Satan under the feet, and to write his Law in the hearts of them that are heirs of salvation. That Covenant promises life to them that perfectly obey, but not remission or forgiveness of any, even the least iniquity. But this promises forgiveness of sins and life eternal to the penitent sinner believing in Christ, and embracing the free promise of mercy. In that, life eternal is promised as the reward of justice: in this, life and glory as the reward of free and rich grace and mercy. To him that works, the wages is of debt; but to him that believes the reward is of grace. In that God as a Creator does exact his right of man pure: but in this as a loving Father He does offer Himself to the sinner smitten with the conscience of his sin. In that, life eternal and most blessed is promised, but only animal, to be enjoyed in Paradise, or continuance in that good estate wherein he was set at first of the rich bounty of God: but in the other, translation out of ignominy and death into eternal happiness and glory in Heaven. In the Covenant of Nature perfect obedience is exacted, so that if there be but the least failing in any jot or tittle, and that but once, a man can never be justified thereby, nor can the breach be made up by any repentance: but in the Covenant of Grace obedience is required, repentance admitted, and sincerity accepted. If a man sin and go astray, if he return unfeignedly, he shall be received into favor. In the Covenant of Nature obedience and works were commanded as the cause of life and justification: in the Covenant of Grace, faith is required as the instrumental cause of remission and salvation, obedience as the qualification of the party justified, and the way leading to everlasting blessedness. The object of obedience in the Covenant of Nature was God: in the Covenant of Grace, God in Christ.

4. They differ in the special consideration of the subject. The first Covenant was given to man pure, perfect, entire and sound, able to do what God required: but the Covenant following was made with man a sinner, miserable and by nature the child of wrath. And so that was a Covenant of friendship, this of firm reconciliation.

5. In the special and peculiar respect of the end. For the former Covenant was made for the praise of God’s wisdom, goodness, bounty and justice. But the Covenant of Grace was made to declare and set forth the riches of God’s grace and mercy. In it the wisdom, goodness, power and justice of God is more illustrious than in the former: and the mercy, long-suffering and rich grace of God is greatly magnified, which did not appear or shine forth at all in the former.

6. And in their effects and properties. For not the Covenant of Nature, but of Grace does exclude boasting. By the Covenant of Nature Adam was not advanced above the condition of an honorable servant. In the Covenant of Grace, man by nature the child of wrath is made the child of God by grace and adoption. The Covenant of Nature was neither the last nor everlasting, but being first made way for a better, and being broken was antiquated or disannulled to our singular comfort: but the Covenant of Grace shall continue firm and immovable forevermore.</p></blockquote>

1. In the special consideration of the author, cause and foundation of the Covenants. God gave his Law to Adam as bountiful and gracious to his creature entire and perfect, but in strict justice requiring obedience, promising a reward and denouncing punishment. But the Covenant of Grace he made as a loving Father in Jesus Christ, of his mere grace promising to receive them into favor, that sincerely and unfeignedly turn unto Him. The creation of man and integrity of human nature is the foundation of the former Covenant: but the redemption of man by Christ is the foundation of the Covenant of Grace.

2. In the form of sanction. In the Covenant of Nature there is no mediator: but the Covenant of Grace is made in Christ, in whom God has made us accepted. The Covenant of Nature was not promised before it was promulgated: but the Covenant of Grace was first promised, and long after promulgated and established or ratified in the blood of his Son.

3. In the special matter of the Covenants, and that both in respect of the promise and stipulation. For the Covenant of Nature promised life, but not righteousness: but in the Covenant of Grace God promises to tread Satan under the feet, and to write his Law in the hearts of them that are heirs of salvation. That Covenant promises life to them that perfectly obey, but not remission or forgiveness of any, even the least iniquity. But this promises forgiveness of sins and life eternal to the penitent sinner believing in Christ, and embracing the free promise of mercy. In that, life eternal is promised as the reward of justice: in this, life and glory as the reward of free and rich grace and mercy. To him that works, the wages is of debt; but to him that believes the reward is of grace. In that God as a Creator does exact his right of man pure: but in this as a loving Father He does offer Himself to the sinner smitten with the conscience of his sin. In that, life eternal and most blessed is promised, but only animal, to be enjoyed in Paradise, or continuance in that good estate wherein he was set at first of the rich bounty of God: but in the other, translation out of ignominy and death into eternal happiness and glory in Heaven. In the Covenant of Nature perfect obedience is exacted, so that if there be but the least failing in any jot or tittle, and that but once, a man can never be justified thereby, nor can the breach be made up by any repentance: but in the Covenant of Grace obedience is required, repentance admitted, and sincerity accepted. If a man sin and go astray, if he return unfeignedly, he shall be received into favor. In the Covenant of Nature obedience and works were commanded as the cause of life and justification: in the Covenant of Grace, faith is required as the instrumental cause of remission and salvation, obedience as the qualification of the party justified, and the way leading to everlasting blessedness. The object of obedience in the Covenant of Nature was God: in the Covenant of Grace, God in Christ.

4. They differ in the special consideration of the subject. The first Covenant was given to man pure, perfect, entire and sound, able to do what God required: but the Covenant following was made with man a sinner, miserable and by nature the child of wrath. And so that was a Covenant of friendship, this of firm reconciliation.

5. In the special and peculiar respect of the end. For the former Covenant was made for the praise of God’s wisdom, goodness, bounty and justice. But the Covenant of Grace was made to declare and set forth the riches of God’s grace and mercy. In it the wisdom, goodness, power and justice of God is more illustrious than in the former: and the mercy, long-suffering and rich grace of God is greatly magnified, which did not appear or shine forth at all in the former.

6. And in their effects and properties. For not the Covenant of Nature, but of Grace does exclude boasting. By the Covenant of Nature Adam was not advanced above the condition of an honorable servant. In the Covenant of Grace, man by nature the child of wrath is made the child of God by grace and adoption. The Covenant of Nature was neither the last nor everlasting, but being first made way for a better, and being broken was antiquated or disannulled to our singular comfort: but the Covenant of Grace shall continue firm and immovable forevermore.”

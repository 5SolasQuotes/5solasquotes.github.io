<blockquote><p>Although I, by divine testimony, and by the truth and merit of the thing itself, and by invincible reasons am persuaded that God exists, and I think it to be a most grievous and destructive sin to suspend judgment concerning it; yet because you suspend judgment concerning the existence of God, you hold in contempt all the authority of divine testimony, in which you certainly sin most grievously: yet, about to deal with you according to your capacity; having set aside divine testimony, likewise also the merit of the truth, I will convince you with invincible natural reasons; then what you can allege to the contrary, I will dispatch: You assent, for example, that you exist, he will grant it; nor will he be able, if he wished ever so much, to suspend judgment on this with the Cartesians. You assent that you are not from yourself, but from another, and this one similarly; he will grant it, and this willy-nilly. I will proceed therefore: One of these therefore will have to be chosen by you: [1] That in this series of causes one must ascend either to infinity; [2] Or that things in this series are mutually causes and effects of each other, with circular efficacy; by which e.g. the father produced you; the grandfather the father; the great-grandfather the grandfather; the great-great-grandfather the great-grandfather, etc. and you finally the great-great-grandfather: [3] Or that at some point in this series one must stop at some first, which is that very thing, which we wish to be designated by the Word God. If he chooses the first; I will say that he contradicts himself in this reasoning, inasmuch as thus, he himself cannot exist, which however he has already acknowledged before, willy-nilly: he cannot, I say, exist; because that infinite series of causes, which is presupposed to have to precede his production, and existence, would never have been completed, so that the next to produce, could have succeeded: If he chooses the second, the circular series, by which e.g. the great-great-grandfather through the great-grandfather, the grandfather, the father produced himself; but he himself the great-great-grandfather; I will say that he also thus contradicts himself, inasmuch as by this reasoning he states, that he is at the same time and is not, for inasmuch as he was produced by the great-great-grandfather, he certainly was not: but inasmuch as he produced the great-great-grandfather; he certainly was: Therefore there remains nothing, but that the third be acknowledged in this subordination, that there is some first, which produced all things, and was produced by none, and that this is infinitely perfect, hence I will proceed to demonstrate, that nothing is believed to finish or limit its own perfection; nor is there anything else for this first which may finish it: necessarily that thing remains infinite.</p></blockquote>

<blockquote><p>Conviction [of atheists] involves assertion and confutation. Here only the method or titles and classes of arguments of the former are to be indicated. Leaving all others aside, I will exhibit here only those of [Marin] Mersenne [d. 1648, a Romanist] (who embraces all): One is that all creatures in some way affirm the existence of deity;

2. That all men have that thought;

3. Because it is necessary that something be from itself;

4. From the eternity of truth;

5. From the best entity and goodness;

6. From the axiom ‘Whatever has the power of moving has it from another’;

7. From the grades of beings;

8. Because God is the light manifesting the rest, and it is known through itself that God exists;

9. Because a creature is a being produced by another from nothing;

10. From the beauty of each creature;

11. From the immutable natural law;

12. From our appetite [desire for something greater, best and satisfying];

13. From the concord of dissonant things;

14. From the government of things;

15. From metaphysical science, its object, etc.;

16. From arithmetic and algebra, namely from the monad, the principle of number, and other admirable things of numbers;

17. From geometry, namely from the abstruse and admirable things of figures and dimensions;

18. From music, where he discusses the harmony of the macrocosm and microcosm and the comparison of mundane music with human;

19. From astrology, namely from the ordered revolution of the stars, especially the swiftness of the diurnal motion from east to west;

20. From mechanics, especially the crane which lifts the greatest weight by the least force;

21. From any sciences and arts;

22. From other inferior sciences;

23. From all species of divinations;

24. From the six determinations of things which are indeterminate by their own nature–they are of (1) quantity, (2) disposition and parts, (3) duration, (4) figure, (5) multitude of individuals and species, (6) intension of grades, and existence;

25. From moral matters;

26. From all artifacts and from the stars;

27. From the collection of all beings;

28. From geography and hydrography;

29. From poverty, from the diversity of faces, voice, writing, states, gaits;

30. From the end to which all things tend;

31. From this, that an object ought to be assigned which can terminate and satiate our love;

32. From various absurdities and disadvantages and from the advantages which follow from the opposite or varying opinion;

33. From optics;

34. From gnomonics [using dials];

35. From architecture;

36. From nautical science. And this is a most diffuse assertion. Its confutation occupied in the solution and attack of atheistic exceptions, twenty-six in number, I do not exhibit here because the reason of the theses does not bear refuting them. Let Mersenne himself be consulted, p. 234, and Valesius, Mornay, and others cited above in part 1. You have the marrow of them in Mornay and those who defend the Providence of God. In the course and repetition of the common topics which we complete in this Academy about every year and a half, we have hitherto set forth those classes of arguments to our students and to the best of our ability deduced and defended them. The arguments [against atheists] are either intrinsic or extrinsic. The former are more as if a priori [from first things] or more a posteriori [from things following]. The former are drawn from certain principles and axioms of the light of nature:

1. There is not given an infinite regress in causes;

2. Nothing is from itself, or nothing is the cause of itself;

3. Whatever is moved is moved by another, and so finally one must come to an unmoved mover;

4. In order there is something first. The latter arguments are drawn:

1. From the adornment, perfection, order, actions, powers of the creatures or universe, Ps. 8 &amp; 19; Isa. 40; Rom. 1;

2. From the intellectual nature of angels, devils and their appearances, operations, ἐνεργήματα;

3. From man, the microcosm, considered both in his nature and essential, integral parts, etc., and in the symbiotic, economic, political, ecclesiastical, scholastic order, with the changes and rewards and punishments in this life: Ps. 8 collated with Isa. 40 and the Ecclesiastes of Solomon;

4. From miracles and prophecies, Isa. 64. The extrinsic arguments or testimonies are:

1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions;

2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian. But if anyone having been advised persists in playing the fool and involving himself and the truth in mere begging of the question or obscure or uncertain consequences, such as [Descartes’s] ‘I think, therefore I am’, and ‘That of which the idea is in me, that very thing, etc.’–skepticism having first been inducted and all natural, innate and acquired knowledge having been erased or sequestered by doubt, and also all principles and demonstrations hitherto customary to all of Christendom, and indeed agreeably to the Scriptures, having been denied and snatched away, certainly to those proud betrayers or corrupters of the cause it must be suggested what Tertullian said, “Evidently the truth was waiting to be liberated by the Valentinians and Marcionites.” To the same men and their favorers all students and masters of all sciences, especially of theology, could say, “Render the legions. For easy is the descent to Avernus, but to retrace one’s steps, etc.</p></blockquote>

s%3B+23.+From+all+species+of+divinations%3B+24.+From+the+six+determinations+of+things+which+are+indeterminate+by+their+own+nature%E2%80%93they+are+of+%281%29+quantity%2C+%282%29+disposition+and+parts%2C+%283%29+duration%2C+%284%29+figure%2C+%285%29+multitude+of+individuals+and+species%2C+%286%29+intension+of+grades%2C+and+existence%3B+25.+From+moral+matters%3B+26.+From+all+artifacts+and+from+the+stars%3B+27.+From+the+collection+of+all+beings%3B+28.+From+geography+and+hydrography%3B+29.+From+poverty%2C+from+the+diversity+of+faces%2C+voice%2C+writing%2C+states%2C+gaits%3B+30.+From+the+end+to+which+all+things+tend%3B+31.+From+this%2C+that+an+object+ought+to+be+assigned+which+can+terminate+and+satiate+our+love%3B+32.+From+various+absurdities+and+disadvantages+and+from+the+advantages+which+follow+from+the+opposite+or+varying+opinion%3B+33.+From+optics%3B+34.+From+gnomonics+%5Busing+dials%5D%3B+35.+From+architecture%3B+36.+From+nautical+science.+And+this+is+a+most+diffuse+assertion.+Its+confutation+occupied+in+the+solution+and+attack+of+atheistic+exceptions%2C+twenty-six+in+number%2C+I+do+not+exhibit+here+because+the+reason+of+the+theses+does+not+bear+refuting+them.+Let+Mersenne+himself+be+consulted%2C+p.+234%2C+and+Valesius%2C+Mornay%2C+and+others+cited+above+in+part+1.+You+have+the+marrow+of+them+in+Mornay+and+those+who+defend+the+Providence+of+God.+In+the+course+and+repetition+of+the+common+topics+which+we+complete+in+this+Academy+about+every+year+and+a+half%2C+we+have+hitherto+set+forth+those+classes+of+arguments+to+our+students+and+to+the+best+of+our+ability+deduced+and+defended+them.+The+arguments+%5Bagainst+atheists%5D+are+either+intrinsic+or+extrinsic.+The+former+are+more+as+if+a+priori+%5Bfrom+first+things%5D+or+more+a+posteriori+%5Bfrom+things+following%5D.+The+former+are+drawn+from+certain+principles+and+axioms+of+the+light+of+nature%3A+1.+There+is+not+given+an+infinite+regress+in+causes%3B+2.+Nothing+is+from+itself%2C+or+nothing+is+the+cause+of+itself%3B+3.+Whatever+is+moved+is+moved+by+another%2C+and+so+finally+one+must+come+to+an+unmoved+mover%3B+4.+In+order+there+is+something+first.+The+latter+arguments+are+drawn%3A+1.+From+the+adornment%2C+perfection%2C+order%2C+actions%2C+powers+of+the+creatures+or+universe%2C+Ps.+8+%26+19%3B+Isa.+40%3B+Rom.+1%3B+2.+From+the+intellectual+nature+of+angels%2C+devils+and+their+appearances%2C+operations%2C+%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%CE%AE%CE%BC%CE%B1%CF%84%CE%B1%3B+3.+From+man%2C+the+microcosm%2C+considered+both+in+his+nature+and+essential%2C+integral+parts%2C+etc.%2C+and+in+the+symbiotic%2C+economic%2C+political%2C+ecclesiastical%2C+scholastic+order%2C+with+the+changes+and+rewards+and+punishments+in+this+life%3A+Ps.+8+collated+with+Isa.+40+and+the+Ecclesiastes+of+Solomon%3B+4.+From+miracles+and+prophecies%2C+Isa.+64.+The+extrinsic+arguments+or+testimonies+are%3A+1.+Internal%2C+of+synteresis+and+conscience%2C+Rom.+2%2C+and+here+about+the+common+notions%3B+2.+External%2C+the+consensus+of+all+nations%2C+and+the+doctrine+of+all+sages.+But+with+all+reasons+having+been+subtracted+and+repeated+thoughts+more+often+recurring%2C+we+have+found+that+the+order+both+of+nature+and+of+our+better+knowledge+is+rather+to+be+observed+and+more+safely+served+in+this+way%2C+that+the+demonstration+from+effects+to+cause%2C+from+works+to+maker+and+governor%2C+be+put+first+as+preeminent+and+universal%2C+which+embraces+all+others+in+itself+since+indeed+all+others+depend+on+it+and+are+derived+from+it%2C+and+all+presuppose+it.+For+no+one+doubts+that+the+law+of+nature+and+of+implanted+common+notion%2C+and+hence+the+acknowledgment+and+profession+of+deity%2C+in+addition+miracles%2C+prophecies+and+political+order%2C+are+to+be+referred+to+the+works+of+God.+As+for+those+axioms+about+causes%2C+about+motion%2C+about+order%2C+those+complex+principles+would+not+exist+unless+those+things+from+which+induction+and+finally+complex+theses+and+principles+arise+had+been+observed+in+the+works+of+God+or+creatures%3B+there+would+not+be+observation+nor+induction+about+and+from+creatures+unless+there+were+creatures.+But+that+this+method+is+safest%2C+most+expeditious%2C+and+most+evident%2C+the+doctrine+and+example+of+the+Holy+Spirit+persuade+Christians%2C+Rom.+1%2C+Ps.+19%2C+Acts+17%2C+Isa.+40%2C+etc.+To+accuse+Him+of+ignorance+or+pseudography+is+atheism+lurking+under+the+cloak+of+a+Christian.+But+if+anyone+having+been+advised+persists+in+playing+the+fool+and+involving+himself+and+the+truth+in+mere+begging+of+the+question+or+obscure+or+uncertain+consequences%2C+such+as+%5BDescartes%E2%80%99s%5D+%E2%80%98I+think%2C+therefore+I+am%E2%80%99%2C+and+%E2%80%98That+of+which+the+idea+is+in+me%2C+that+very+thing%2C+etc.%E2%80%99%E2%80%93skepticism+having+first+been+inducted+and+all+natural%2C+innate+and+acquired+knowledge+having+been+erased+or+sequestered+by+doubt%2C+and+also+all+principles+and+demonstrations+hitherto+customary+to+all+of+Christendom%2C+and+indeed+agreeably+to+the+Scriptures%2C+having+been+denied+and+snatched+away%2C+certainly+to+those+proud+betrayers+or+corrupters+of+the+cause+it+must+be+suggested+what+Tertullian+said%2C+%E2%80%9CEvidently+the+truth+was+waiting+to+be+liberated+by+the+Valentinians+and+Marcionites.%E2%80%9D+To+the+same+men+and+their+favorers+all+students+and+masters+of+all+sciences%2C+especially+of+theology%2C+could+say%2C+%E2%80%9CRender+the+legions.+For+easy+is+the+descent+to+Avernus%2C+but+to+retrace+one%E2%80%99s+steps%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+1%2C+pp.+206-9+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F26a3d50a53.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/26a3d50a53.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=Conviction%20%5Bof%20atheists%5D%20involves%20assertion%20and,but%20to%20retrace%20one%E2%80%99s%20steps%2C%20etc&amp;text=Conviction%20%5Bof%20atheists%5D%20involves%20assertion%20and%20confutation.%20Here&amp;text=to%20Avernus%2C%20but%20to%20retrace%20one%E2%80%99s%20steps%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-334c77873e" data-kw="">
<blockquote><p>…there is more than one way in which a thing is said in the heart or conceived. For, in one sense, an object is conceived, when the word signifying it is conceived; and in another, when the very entity, which the object is, is understood. In the former sense, then, God can be conceived not to exist; but in the latter, not at all. For no one who understands what fire and water are can conceived fire to be water, in accordance with the nature of the facts themselves, although this is possible according to the words. So then, no one who understands what God is can conceive that God does not exist; although he says these words in his heart, either without any or with some foreign signification. For, God is that than which a greater cannot be conceived. And he who thoroughly understands this, assuredly understands that this being so truly exists, that not even in concept can it be non-existent. Therefore, he who understans that God so exists, cannot conceive that he does not exist. I thank thee, gracious Lord, I thank thee; because what I formerly believed by thy bounty, I now so understand by thine illumination, that if I were unwilling to believe that thou does exist, I should not be able not to understand this to be true.</p></blockquote>

<blockquote><p>Another argument in support of this conclusion is adduced by Damascene (On the Orthodox Faith 1, 3) from the government of things, and the same reasoning is indicated by the Commentator in 2 Physics. It runs as follows: It is impossible for contrary and discordant things to accord in one order always or frequently except by someone’s governance, through which each and all are made to tend to a definite end. Now we see that in the world things of different natures accord in one order, not seldom and fortuitously, but always or for the most part. Therefore, it follows that there is someone by whose providence the world is governed. And this we call God.</p></blockquote>

</figure><figure class="quote" id="q-f604592be6" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The fifth way is taken from the governance of the world. We see that things which lack intelligence, such as natural bodies, act for an end, and this is evident from their acting always, or nearly always, in the same way, so as to obtain the best result. Hence it is plain that not fortuitously, but designedly, do they achieve their end. Now whatever lacks intelligence cannot move towards an end, unless it be directed by some being endowed with knowledge and intelligence; as the arrow is shot to its mark by the archer. Therefore some intelligent being exists by whom all natural things are directed to their end; and this being we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-b6acb3a8f5" data-kw="">
<blockquote><p>…consider the three main approaches in the history of theology to understanding God’s causal relationship to the world, as Alfred Freddoso has usefully classified them. Occasionalism holds that God alone is the cause of everything that happens, so that there are no true secondary causes in nature. For example, on this view, one billiard ball which makes contact with another during a game of pool does not in any way cause the other to move. Rather, God causes the second ball to move on the occasion when the first makes contact with it. Mere conservationism holds that while God maintains natural objects and their causal powers in existence at every moment, they alone are the immediate causes of their effects. On this view, the one billiard ball really does cause the other one to move, and God has nothing to do with it other than keeping the ball and its causal powers in being. He is not in any direct way the cause of the second ball’s motion. Finally, concurrentism is a middle ground position which holds on the one hand (and contrary to occasionalism) that natural objects are true causes, but on the other hand (and contrary to mere conservationism) that God not only maintains natural objects and their causal powers in being, but also cooperates with them in immediately causing their effects. On this view, the one billiard ball really does cause the other ball to move, but only together with God, Who acts as a concurrent cause. Concurrentism became the standard view within the Scholastic tradition, because the other views are philosophically and theologically problematic. For example, occasionalism veers in the direction of pantheism, while mere conservationism veers in the direction of deism. We can understand how if we recall the Scholastic dictum that “a thing operates according as it is” If, as occasionalism holds, only God alone ever operates or brings about effects, and natural objects operate not at all, then it is difficult to see how they exist at all, at least in any robust way. God alone would seem to be real; natural objects would be like mere fictional characters in the mind of a divine Author. By contrast, if, as mere conservationism holds, natural objects can at least operate or bring about effects apart from God’s immediate causal action, then it seems that they could also exist apart from his immediate causal action. The world would in that case not depend for its continued existence on God’s conserving action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 4, ‘Natural Theology Must Be Grounded in the Philosophy of Nature, Not in Natural Science’, pp. 76-77</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-963508f7c6" data-kw="">
<blockquote><p>…the opposite case of the right and meritorious act, toward which God concurs by producing everything in the act — both the moral and the physical — because He decreed both from eternity and foresaw them by intending, predefining, and indeed commanding them. And so He concurs in time by placing the cause in the first act through the auxiliaries of grace, so that it would be in the proximate power toward right acting in the second act; then by determining it through the concurrence of assisting grace toward eliciting the right and meritorious act. This is the proper and connate concurrence owed by the first cause to the secondary cause that is going to operate — just as the determination as to the individual is also connected inseparably with exercise…</p></blockquote>

</figure><figure class="quote" id="q-7097c0b5ee" data-kw="">
<blockquote><p>…it remains to consider what third, middle path he [Scotus] appears to have chosen. Namely, that God concurs with free secondary causes in such a way that He does not await their free consent before concurring… nor does He merely accompany them by offering concurrence if they wish to act… nor does He predetermine them to act by means of some prior quality or physical motion impressed antecedently upon the will… Rather, God determines them in such a way that through the very same act or concurrence which He provides with certainty and determination toward the free act — by virtue of the essential subordination and dependence which the secondary cause has with respect to the first — He determines them antecedently, yet contingently and freely. And this mode of determining is such that it is not contrary to created freedom; indeed, it is fitting and necessary, and through this determination the proper subordination and dependence of the creature upon the Creator is established.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…it remains to consider what third, middle path he [Scotus] appears to have chosen. Namely, that God concurs with free secondary causes in such a way that He does not await their free consent before concurring… nor does He merely accompany them by offering concurrence if they wish to act… nor does He predetermine them to act by means of some prior quality or physical motion impressed antecedently upon the will… Rather, God determines them in such a way that through the very same act or concurrence which He provides with certainty and determination toward the free act — by virtue of the essential subordination and dependence which the secondary cause has with respect to the first — He determines them antecedently, yet contingently and freely. And this mode of determining is such that it is not contrary to created freedom; indeed, it is fitting and necessary, and through this determination the proper subordination and dependence of the creature upon the Creator is established.”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, p. 396">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6it+remains+to+consider+what+third%2C+middle+path+he+%5BScotus%5D+appears+to+have+chosen.+Namely%2C+that+God+concurs+with+free+secondary+causes+in+such+a+way+that+He+does+not+await+their+free+consent+before+concurring%E2%80%A6+nor+does+He+merely+accompany+them+by+offering+concurrence+if+they+wish+to+act%E2%80%A6+nor+does+He+predetermine+them+to+act+by+means+of+some+prior+quality+or+physical+motion+impressed+antecedently+upon+the+will%E2%80%A6+Rather%2C+God+determines+them+in+such+a+way+that+through+the+very+same+act+or+concurrence+which+He+provides+with+certainty+and+determination+toward+the+free+act+%E2%80%94+by+virtue+of+the+essential+subordination+and+dependence+which+the+secondary+cause+has+with+respect+to+the+first+%E2%80%94+He+determines+them+antecedently%2C+yet+contingently+and+freely.+And+this+mode+of+determining+is+such+that+it+is+not+contrary+to+created+freedom%3B+indeed%2C+it+is+fitting+and+necessary%2C+and+through+this+determination+the+proper+subordination+and+dependence+of+the+creature+upon+the+Creator+is+established.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Macedo+%26+Scotus%E2%80%99s+View%2C+p.+396&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7097c0b5ee.html&amp;via=5Solas

<main class="wrap"><figure class="quote" id="q-58229dc0f0" data-kw="">
<blockquote><p>The question is, ‘Whether it be advisable for one who has devoted himself to the work of the ministry, but is by no means satisfied with the terms of conformity, to choose ordination by episcopal hands (if it may be had without any oaths or subscriptions according to the forms prescribed) rather than ordination by presbyters, as some time practiced by those of that persuasion?’ The doubt is, not whether episcopal ordination be lawful, especially considering that the bishop may be looked upon therein as a presbyter, in conjunction with his com-presbyters (and the validity of such ordination is sufficiently vindicated by the presbyterians in their Jus Divinum), but whether it be advisable or no?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 44-47 (1687) of ch. 4 in Memoirs of the Life, Character &amp; Writings of the Rev. Matthew Henry, ed. J.B. Williams (1828) in The Lives of Philip &amp; Matthew Henry, ed. J.B. Williams, 2 vols. in 1 (Banner of Truth, 1974), p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>Because these places [of Scripture] do not only apply the titles indifferently, but do indifferently apply the duties, qualifications and every other thing that belongs to such officers and offices; and there is nothing spoken of the one in Scripture, but it is also spoken of the other, neither anything required as a qualification in, or duty from the one, but is also done in reference to the other, and that expressly.</p></blockquote>

</figure><figure class="quote" id="q-ce19e13208" data-kw="">
<blockquote><p>Episcopal government, managed in conjunction with presbyters, presbyteries, and synods, is not contrary to the rule of Scripture, or the example of the primitive Church, but most agreeable to both. Yea, it is not contrary to that new [Solemn League and] Covenant [1643]… it is certainly most pertinent… to declare the consistence of the present [Church] government even with that obligation… As for our present model in Scotland, and the way of managing it, whatsoever is amiss (and it can be no wrong to make that supposition concerning any church on earth), the brethren that are dissatisfied had possibly better acquitted their duty by free admonitions and significations of their own sense in all things than by leaving their stations, which is the only thing that has made the breach… But there is much charity due to those following their own consciences; and they owe, and I hope they pay, the same back again to those that do the same in another way… That this difference should arise to a great height may seem somewhat strange to any man that calmly considers that there is in this Church no change at all, neither in the doctrine nor worship; no, nor in the substance of the discipline itself. But when it falls on matter easily inflammable, a little sparkle, how great a fire will it kindle!… After the same author saith, As we have Prelacy to be aware of, so we have the contrary extreme to avoid; and the Church’s peace, if it may be so procured; and as we must not take down the ministry lest it prepare men for Episcopacy, so neither must we be against any profitable use and exercise of the ministry, or desirable order amongst them, for fear of introducing Prelacy, etc… And unless they can make it appear that the Episcopacy now in question with us in Scotland, is either contrary to the word of God, or to that mitigated sense of their own oath, it would seem more suitable to Christian charity and moderation, rather to yield to it, as tolerable at least, than to continue so inflexibly to their first mistakes, and excessive zeal for love of it, as to divide from the Church, and break the bond of peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Modest Defence of Moderate Episcopacy, as Established in Scotland at the Restoration of King Charles II</cite>, [1660]’ in The Whole Works new ed.(London: Duncan, 1830), vol. 4, pp. 386-93</span></figcaption>

</figure><figure class="quote" id="q-7071370bd4" data-kw="">
<blockquote><p>As regards eutaxia [good-order] in matters naturally outward and indifferent she [the Church] sets up those she thinks most likely to further edification, not in order that, as is the vicious way in the Papacy, they may become an essential part of divine worship, the norm of which is to be sought in God’s Word alone; but in order that they may be its supports and instruments suited to persons, times and places, as things concerned solely with the determination of outward circumstances, which may be altered in various ways to meet the exigencies of public edification.</p></blockquote>

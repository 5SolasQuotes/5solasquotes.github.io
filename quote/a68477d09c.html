<main class="wrap"><figure class="quote" id="q-a68477d09c" data-kw="">
<blockquote><p>Finally, you may see the growing danger of indifference which I speak of in the painful increase of Sabbath-breaking in the land. In town and in country, in Belgravia and Bethnal Green, the state of things is the same. Full Churches are the exception on Sunday, and half-empty Churches are the rule. A religious census of any large population tells the same story. The Fourth Commandment of the Decalogue seems to be left out in the cold and ready to die.

Partly from the spread of infidelity, that old enemy of the Lord’s Day; partly from the morbid love of liberty, and letting everyone do as he likes; partly from the exaggerated love of pleasure which marks this age; partly from the facilities afforded by railways for Sabbath travelling, of which our fathers knew nothing, and got on well enough without them; partly from one cause and partly from another, the devil is just now getting more help in his favourite campaign against the Lord’s Day than he has done since the Reformation. You may see what I mean, in the persistent attempts now made to throw open places of amusement, aquariums, museums, picture galleries, and such-like places, under the plausible pretence of ‘affording recreation to the working classes.’

I have no hesitation in saying that this unmistakable increase of Sabbath neglect is one of the worst symptoms of the increase of indifference to vital religion in our days. There is an inseparable connection between the observance of the Lord’s Day and the prosperity of to true religion. Voltaire was quite right when he said he could never succeed in destroying Christianity unless he destroyed Sunday. Whether Englishmen know it or not, their Sabbath has been one of their richest possessions, and the grand secret of their position in the world. Of it the famous words may be truly used, that ‘it is the cheap defence of a nation.’ [Edmund Burke] It is a simple fact that wherever spiritual religion in a Church is strong and vigorous, the honour of Sunday goes up, and wherever it decays, Sunday ceases to be well observed. In a word, Sunday is the barometer of every so-called Christian nation. Tell me how Sunday is kept in a land, and I will tell you what the Church of the land is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts for Thinkers: An Address given to the Sixteenth Liverpool Diocesan Conference, in St George s Hall, November 2, 1897’ in Charges and Addresses</cite></span></figcaption>

<blockquote><p>Singing of psalms must be used in thy family. The Lord Jesus and his family did practise this duty: Mat. xxvi. 30, ‘And when they sang a hymn, they went out into the Mount of Olives.’ David in that psalm, at the dedication of his house, speaketh that his glory should sing praise to God, and not be silent, Ps. xxx. title, ver. 4 and 12. Our tongues are called our glory, not only because by our speech we excel beasts, but chiefly because therewith we should glorify God. It is observable that most of those places which prophesy the Gentiles’ conversion, do mention their worshipping the true God by singing, Ps. cviii. 3, c., and lxiv. 4; Isa. liv. 1, and lii. 8.

The Holy Ghost when he commandeth that the word should keep house with us, doth also enjoin us to ‘teach and admonish one another in psalms, and hymns, and spiritual songs,’ (which are the titles of David’s psalms, and the known division of them, expressly answering to the Hebrew words, Shurim, Telhillim, and Mizinurim, by which his psalms are distinguished and entitled, as the learned observe,) ‘singing and making melody with grace in our hearts to the Lord,’ Col. iii. 16; Eph. v. 19; James v. 13. Basil speaks high in the praise of praising God by this holy exercise. Chrysostom speaketh of some in his time who always concluded their suppers with singing a psalm, and, saith he, they lived like angels.

This ordinance will much quicken holy affections, and help a Christian to serve God with more cheerfulness. When the Israelites were singing the 136th psalm at the bringing in the ark, the glory of the Lord filled the house, 2 Chron. xx. 22. The sweet singer in Israel was the man after God’s own heart.

Only, reader, be careful to sing David’s psalms with David’s spirit, and not like a nightingale to sing by rote: ‘I will sing with my spirit, and I will sing with the understanding also.’ Making melody with grace in the heart, is the best tune to set all David’s psalms with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 341-42.</span></figcaption>

<blockquote><p>…in 1 Cor. 11:6, ‘if the woman be not covered, let her also be shorn’: If she lays her vail aside and appears in the public assemblies without a covering, then I say, ‘let her also be shorn or shaved’, let her hair be cut close to the skin, let her go like some of the cropped philosophers among the Stoics. Not that he would have her do so, but only by this sarcastic way of speaking he signifies that one is as decent as the other. It is as disgraceful to be uncovered as to be shaved: for ’twas the laudable custom then in the Christian churches for the women to be vailed, and it was disgraceful and reproachful for any of that sex to appear bare-faced in the time of worship.</p></blockquote>

<blockquote><p>§35. And 2. No man may of his own head command anything in or belonging to the worship of God: but he must have either a special or general warrant and command from God Himself to do it. God’s Law must either make the thing necessary in specie, and so leave man nothing about it but to second it by his Law, and see it executed: or else God’s Law must make the thing necessary in genere, and so leave man to determine of the species (as is oft said). But where neither of these are done by God, man has no power for the imposing of that thing.</p></blockquote>

<blockquote><p>First Argument [of Rutherford]: In the first receiving of members by the apostles, there was but a professed willingness to receive the Gospel, howbeit some received it not from the heart. Mr. Hooker answereth: ‘There was not only a professed willingness, but a practical reformation, that in the judgement of charity giveth grounds of hope that there is something real, before the contrary appear; Therefore, Peter who received Magus upon his approbation of the truth and outward conformity thereunto in the course of his life, rejected him as one in the gall of bitterness, who had no share in Christ, and therefore certainly would not suffer him in the privileges of communion, so persisting without repentance.’ [Rutherford’s] Answer 1: [Hooker says:] ‘Not professed willingness, but also practical reformation is required.’ But is not professed willingness in murderers of Christ, who said, ‘What shall we doe to be saved?’ some practical reformation? There is nothing but conjectures that the apostles did not admit all and every one of the three thousand until they had experience of their state of grace and judicially determined so of them all. ([Margin note:] Mr. Hooker neither proves, nor can prove that the apostles had habitual experience in so few hours, all and every one of the 3,000 (Acts 2) gave evidence of real conversion to the apostles.) (2). This practical reformation was not an experience of their practice of savory walking, required by Mr. Hooker (p. 1. ch. 2, pp. 14-15) in visible saints before admission, except some four or five hours time may create an habitual experience, for the same very day they were baptized (Acts 2:41). (3) Mr. Hooker should prove that the apostles found this practical reformation in all, Ananias, Saphira, and the whole 3000; and that the apostles tried and smelled the savouriness of saving grace in all; in Saphira; the text giveth not the least jot of this, we must take it upon the naked assertion of Mr. Hooker (4) That this practical reformation gave to the apostles’ judgement of charity ground of hope that there was something real, that is, the whole number, about three thousand (none excepted, for all were made Church-saints visible) gave grounds of hope that they were all really (otherwise their speaking and hearing the word was real, that is, not imaginary) internally and effectually called, and born over again of the spirit, and so chosen to life eternal from eternity, before the apostles durst, without the offending of God, admit them to Church-fellowship and visible communion; those [things] (I say) must be proven. If I durst [dare], I am not far from judging the godly and judicious in cold-blood, free of heat of dispute, dare not so judge of the text, Acts 2 or Acts 8. (5) There is no shadow, Acts 8, that Peter (Mr. Hooker should say Philip) admitted not Magus while he saw such grounds of the sorcerer’s real conversion and real predestination to glory. (6) Peter said that Magus had no share in Christ. True, but said he that he was an unbaptized man who had no share in the visible Church? No. (7) But he would not suffer Magus to share in the privileges of communion, he persisting without repentance. True, but it is no answer to the argument from the manner of receiving in, this is something to the casting out, (8) that Peter reproveth him in the gall of bitterness [and] 2. Exhorts him to repent, to pray for pardon, [these last two things] were great privileges of Church-communion bestowed upon Magus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the churches of N. England is now re-examined (London, 1658), Book 1, ch. 14</cite>, pp. 56-57</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-916cd650fe" data-kw="">
<blockquote><p>Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645)</cite>, pp. 16-17</span></figcaption>

<blockquote><p>Doctrine: We must if occasion require commend good Christians to others. So does Paul Phoebe here, and many others in his epistles. So did the brethren at Lystra and Iconium commend Timothy to Paul, Acts 16:2. So did the Brethren commend Gaius to John, 3 Jn. v. 3, and John, Demetrius, 3 Jn. 12. And in the primative Church it was so ordinary to give Christians letters of commendations, that he which acknowledged them not, was taxed as if he had denyed the faith. And there is great reason for it: For first it concerns them which are requested to commend, that they may show their charity: Secondly, the commended, that they may bee holpen. Thirdly, them to whom, that they may do good to the worthy, and not be deceived by the unworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Exposition upon the Whole Thirteenth, Fourteenth, Fifteenth &amp; Sixteenth Chapters of the Epistle of Saint Paul to the Romans… (London: Eld, 1622), on Rom. 16:1-2, p. 314 Parr makes letters of commendation a duty of common Christian charity.</cite></span></figcaption>

<blockquote><p>…when the Gospel is come to a people, if the question be, what gives to this man, not to this man true real right to membership, and ordinances, and seals, so as he may claim them before God and not sin: the meritorious right is Christ’s death, the condition upon his part is faith; hence visible profession as such cannot give right… Profession is in order to the rulers and members of the Church, which have hand according to their place, either formal or tacit consent, to receive in members… the question is, what profession is required in such as the rulers may without sin admit to membership and ordinances; we say a profession morally true, not real conversion judged to be real by men. Now this confession or profession doth not make a Church-member, but declare a Church-member, and it only declares him to the conscience of the rulers, that they sin not in admitting such: but declares him neither to have right before God nor to his own conscience. Yea, for all this profession [Simon] Magus sinned in being baptized, Magus usurped, and hath no true and real right, no not ecclesiastic, except in a most unproper sense; [yet] the Church hath right and command to receive him to member membership and seals…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 1, ch. 22, ‘Whether profession makes a member of the Church visible?’ in A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658)</cite>, p. 123</span></figcaption>

quote/d9f8a261cc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=when%20the%20Gospel%20is%20come%20to,him%20to%20member%20membership%20and%20seals&amp;text=when%20the%20Gospel%20is%20come%20to%20a%20people&amp;text=to%20receive%20him%20to%20member%20membership%20and%20seals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fdd471083f" data-kw="">
<blockquote><p>I confess there might be in some towns no greater number of Christians than did meet together in one place, notwithstanding whereof the pastor or pastors and elders of that congregation, might and did manage the government of the same, and exercise jurisdiction therein. I confess also that in those cities wherein there was a greater number of Christians than could meet together into one place for the worship of God, the presbytery did consist of the pastors and elders within such a city: For it cannot be proved that there were at that time any Christian congregations in landward villages (the persecution forcing Christians to choose the shelter of cities, for which reason many are of opinion that the infidels in those days were called pagani, because they alone dwelt in pagis [districts]) and if there had been any such adjacent to cities, we must think the same should have been subject to the common presbytery, their own pastors and elders being a part thereof. Howsoever it cannot be called in question that the presbytery in the apostolic Churches was made up of as many as could conveniently meet together, for managing the ordinary matters of jurisdiction and Church-government. The pastors and elders of diverse cities could not conveniently have such ordinary meetings, especially in the time of persecution; only the pastors and elders within one city had such conveniency. And so to conclude, we do not forsake, but follow the patern, when we join together a number of pastors and elders out of the congregations in a convenient circuit, to make up a common presbytery, which has power and authority to govern those congregations; for if the presbytery which we find in those cities wherein the apostles planted churches, be a sure pattern for our classical presbyteries (as we have proved it to be)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland... (Edinburgh: 1641), pt. 2</cite>, ch. 3, pp. 146-47</span></figcaption>

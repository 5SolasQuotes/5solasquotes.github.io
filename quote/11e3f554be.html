<main class="wrap"><figure class="quote" id="q-11e3f554be" data-kw="">
<blockquote><p>Meanwhile, we believe and confess the force of this union of the natures in the person of Christ to be so great: that first, whatsoever Christ is or does, according to the divine nature, that same, whole Christ, the Son of man, may be said to be, or to do: and again, whatsoever Christ does or suffers according to his human nature, that same, whole Christ the Son of God, God Himself, is said in the holy Scriptures, to be, to do, and to suffer. As that: God (that is Christ, man and God) redeemed the Church with his blood: Acts 20:28, whenas the force of the redemption pertained to the Godhead, the shedding of his blood only to the manhood. Yet both these actions are joined in one, and each of them may be spoken alike of whole Christ: although they were and are distinct, because the natures, although distinct yet are coupled together in Christ’s one Person. Yea Christ the Mediator, according to his humanity never did or does anything, wherein his divinity did not or does not work together: and He never performed anything according to his divinity, whereunto his humanity was not assisting or consenting: that the Fathers very fitly called all the works of Christ the Mediator [theandric?], that is performed both by God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (1599), ch. 11, ‘Of Christ the Redeemer’; pp. 65-66</span></figcaption>

<blockquote><p>9. Third, out of this union depends the conjunction or collation of the operations, since one nature with the other is conjoined, its energies, that is, actions, [work] to one effect, or work of redemption: by the deity working those things which are required of immensity, humanity things human, which is a proper instrument for the deity, it subserving it and with the deity it works things henomenos ou dieremenos, that is ‘unitedly, not separately’. Thus it is called theandrikon apotelesma, so Damascus, bk. 3, ch. 19 terms it, ‘a theandric energy’.</p></blockquote>

</figure><figure class="quote" id="q-9541e39dd5" data-kw="">
<blockquote><p>The ancients† insist much upon that proof John 16:15, ‘All things that the Father hath are mine’, compared with John 10:30, ‘I and my Father are one’, and John 10:37, ‘If I do not the works of my Father, believe me not; for from hence they do conclude, that Christ has the same divine nature and Godhead with the Father; they both have the same divine and essential titles and attributes, and perform the same inward operations in reference to all creatures whatsoever; † Epiphanius, contra Apostolicos, see Cyril in John, ch. 3 &amp; 8; Jerome on Zech. 2; Ambrose, bk. 5, Of Faith, ch. 4; Augustine, contra Pascen tium: ‘nemo igitur jam calumnia turde verbo; et si enim verbum ipsum in Lege scriptum non reperitur, res tamen reperitur, ego et Pater unum sumus’, Epistle 174. and therefore they did farther infer that they had reason to use the word ‘Consubstantial’ [one substance]; for though the word is not in Scripture, yet the sense and meaning of it is orthodox and canonical, because evidently deduced from these texts and some other Scriptures.</p></blockquote>

<blockquote><p>§XVIII. A completed work (apotelesma) is one work proceeding from both natures. In this completed work (apotelesma) the divine has a divine energy and the human nature a human energy, such as justification and glorification. §XIX. An energy is a power and operation of a particular nature. The divine energy in its mode is divine; the human nature only has human energy. Thus, the actions are two, but the work is one. “By the spirit He offered Himself” (Heb. 9:14). §XX. Each nature exerts these powers in the office of Christ the Mediator. But the Mediator is: 1. Unique (1 Tim. 2:5), 2. Perfect (Heb. 7:25), 3. And acting as surety and making payment (spondens et solvens) (Mt. 26:28) 4. For all believers of the Old and New Testament and all their sins (Rom. 3:25) 5. According to both natures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, p. 123</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

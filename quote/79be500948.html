<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>

<blockquote><p>LIII… 2… without holiness none shall see God, Heb. 12:14… It is not then easy to think of a greater hurt than to forbid men such means, without which experience assures us that few comparatively are thus enlightened and renewed to God, and with which more comparatively are renewed. To say that God can bless to us an ignorant heartless, carnal teacher, is no answer while experience certifies us that comparatively He does not do it… 3. For who knows where to bound his obedience to such silencers as aforesaid… if 1,000 or 2,000 or 3,000 parishes must choose the apparent hazard of their souls and refuse such helps as experience certifies us they greatly need, in obedience to man, why must not the rest of the parishes do so also? May I give away the needful helps to my salvation because others have them, as if their salvation might satisfy me instead of my own? … LX… He is not the physician whom we can trust that does not cure men… … LXII. If the people, conscious of their great necessity of pastoral oversight and help, and of Christ’s command to use it, do live in a parish or country where they cannot have it from those that the magistrate allows, either because they cannot perform it for them or because they will not: it is no schism for such to seek and use it from worthy, though prohibited men. We before spake of the schisms of teachers, and now [we will speak] of hearers… In several cases the people may possibly be [unfortunately] deprived of this [pastoral oversight]… 1. When public pastors are at so great a distance from them as that such pastors cannot come to them, nor they and their families go so far without such inconvenience and trouble as will frustrate the end of their endeavors: As in France where the Protestants must go twenty miles or ten to a church, which the weak, children and aged cannot do, nor the rest of the family without such cost and pains, and loss of time as will deprive them of the benefit… 2. Where parishes are so great that the allowed pastors cannot preach to half or a fourth or tenth part of the people, and cannot visit half the sick, and baptize, and administer the Lord’s Supper as is necessary, and have not time if the ignorant and doubting, and troubled persons should come to them for counsel, resolution or comfort… 3. Where the allowed pastors are so slothful or proud that they will not condescend to these offices of personal help to many thousands, especially of the poor. 4. Where they are young raw men, or ignorant of such matters, unable to counsel people as their necessities require, in order to their salvation… 5. Where they are so profane and malignant that if poor people come to them with cases of conscience, or for counsel what they must do to be saved, they will but deride them as scrupulous and precise, and make them believe that to be solicitous about salvation and afraid of sinning, and seriously godly, is but to be hypocrites, melancholy or mad… 6. When they are heretical and not to be trusted in point of faith. 7. And when they are so factious and schismatical as that their preaching and conference tends to render other good Christians odious, and stir up men to hate, persecute or separate from them, and so to destroy true love and concord. In any of these cases when the people or part of them are deprived of those pastoral helps which their necessity requires, and God commands, they may seek it where they can best have it. LXIII. In all these cases it is an unsatisfactory answer to tell them that religion is kept up in the land and that other persons or parishes have what they want, or that order and obedience must be preferred to their supply, or that God can save them without a pastor, etc. For so God can save the heathen world without the Gospel preached if He please: And so you might persuade the poor to famish rather than [go] against law to beg, because if thousands of them die of famine, yet other people are supplied and have plenty: Or you might tell men that they must use no physician, though they die for it, if they have no tolerable one allowed them by the magistrate, because others have physicians… What if the parish priest could baptize but one of many (or not all)? Must the rest be content to be unbaptized? If not, why must they be content without all public preaching and worshipping of God, and the Lord’s Supper, and personal helps of pastors which they need? LXIV. Yet here we must declare: 1. That in such necessity people must, caeteris paribus [‘other things being equal’], first seek their supply in that way that is most for peace and most for public good, and least scandalous or dividing, and that is most agreable to the ruler’s will and honour. 2. That for some short season in which his soul is not apparently hazarded, as also in the tolerable loss of some measures of pastoral help, a man must submit his own personal advantage to public interest and may hope that God will make it up. As also when it tends to his probable greater advantage afterward by putting by some present storm: But not statedly, to be without Christ’s instituted ordinances and helps. For example, parish order is desireable and is the ruler’s will: If therefore supply can be had in a neighbor parish for them that want [lack] it in their own, and by an allowed minister rather than a disallowed, it should be chosen, unless the disparity be so great as to weigh down the contrary inconveniences. And if for a time any be constrained to another way, they should do it but as an extraordinary necessity for the present time till they can be supplied in the allowed parochial way; and avoid as much as possibly they can all ways, though lawful, that encourage true schisms. 3. And we must profess that if any preachers or people shall out of self conceitedness pretend necessity when there is none, their pretence is no justification of their disorder or disobedience. Magistrates may regulate us in the circumstances of those duties which the Law of Nature or the Gospel [in an established Christian nation] do command: But if on such pretence of regulating circumstances, they will violate or contradict either the Law of Nature or the Gospel, and destroy the duty itself or its end, we are not bound in such cases to obey them, but must pariently suffer. … LXVI… 4. Cyprian’s conclusion before mentioned is known, inviting the people to forsake a bad pastor, Plebs maximam habet potestatem [‘The people have the greatest power’], etc. And he convinces the people that if they forsake not such they are guilty. … LXVII… God will have mercy rather than sacrifice [Hos. 6:6], and prefers men’s salvation to ceremony or Church laws.</p></blockquote>

r+they+and+their+families+go+so+far+without+such+inconvenience+and+trouble+as+will+frustrate+the+end+of+their+endeavors%3A+As+in+France+where+the+Protestants+must+go+twenty+miles+or+ten+to+a+church%2C+which+the+weak%2C+children+and+aged+cannot+do%2C+nor+the+rest+of+the+family+without+such+cost+and+pains%2C+and+loss+of+time+as+will+deprive+them+of+the+benefit%E2%80%A6+2.+Where+parishes+are+so+great+that+the+allowed+pastors+cannot+preach+to+half+or+a+fourth+or+tenth+part+of+the+people%2C+and+cannot+visit+half+the+sick%2C+and+baptize%2C+and+administer+the+Lord%E2%80%99s+Supper+as+is+necessary%2C+and+have+not+time+if+the+ignorant+and+doubting%2C+and+troubled+persons+should+come+to+them+for+counsel%2C+resolution+or+comfort%E2%80%A6+3.+Where+the+allowed+pastors+are+so+slothful+or+proud+that+they+will+not+condescend+to+these+offices+of+personal+help+to+many+thousands%2C+especially+of+the+poor.+4.+Where+they+are+young+raw+men%2C+or+ignorant+of+such+matters%2C+unable+to+counsel+people+as+their+necessities+require%2C+in+order+to+their+salvation%E2%80%A6+5.+Where+they+are+so+profane+and+malignant+that+if+poor+people+come+to+them+with+cases+of+conscience%2C+or+for+counsel+what+they+must+do+to+be+saved%2C+they+will+but+deride+them+as+scrupulous+and+precise%2C+and+make+them+believe+that+to+be+solicitous+about+salvation+and+afraid+of+sinning%2C+and+seriously+godly%2C+is+but+to+be+hypocrites%2C+melancholy+or+mad%E2%80%A6+6.+When+they+are+heretical+and+not+to+be+trusted+in+point+of+faith.+7.+And+when+they+are+so+factious+and+schismatical+as+that+their+preaching+and+conference+tends+to+render+other+good+Christians+odious%2C+and+stir+up+men+to+hate%2C+persecute+or+separate+from+them%2C+and+so+to+destroy+true+love+and+concord.+In+any+of+these+cases+when+the+people+or+part+of+them+are+deprived+of+those+pastoral+helps+which+their+necessity+requires%2C+and+God+commands%2C+they+may+seek+it+where+they+can+best+have+it.+LXIII.+In+all+these+cases+it+is+an+unsatisfactory+answer+to+tell+them+th </figure><figure class="quote" id="q-9ab316be07" data-kw="">
<blockquote><p>1. Where persons are esteemed members of churches by external causes without their own consent, or by parochial cohabitation, they may remove from one church unto another by the removal of their habitation according unto their own discretion. For such cohabitation being the only formal cause of any relation to such a church in particular, upon the ceasing of that cause, the relation ceases of its own accord. 2. Where persons are members of churches by mutual confederation, or express personal consent, causeless departure from them is an evil liable unto many aggravations. 3. But whereas the principal end of all particular churches is edification, there may be many just and sufficient reasons why a person may remove himself from the constant communion of one church unto that of another. And of these reasons he himself is judge on whom it is incumbent to take care of his own edification above all other things. Nor ought the church to deny unto any such persons their liberty desired, peaceably and according unto order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church &amp; its Government… (London, 1689), ch. 10, pp. 225-26 Owen was a congregationalist puritan.</cite></span></figcaption>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-83bee89ed8" data-kw="">
<blockquote><p>And when the diet of the General Assembly came, having first done what they could for incapacitating all Brethren of differing judgment from these Resolutions, to sit in the Assembly, by citing them to the Assembly as guilty persons… did also make acts appointing and ordaining censures against all persons in this Church, whether Ministers or professors [professing Christians], that did not acknowledge the authority, and submit to the acts and constitutions of that Assembly concerning those Resolutions, and barring all such expectants [those training for the ministry] from entrance to the Ministry as should not acknowledge that authority, and submit to those constitutions; And in their Assembly of the next year at Edinburgh, do provide and ordain presbyteries to take special care, that upon the calling of any expectant to a particular charge of the ministry, before they admit him to his trials, they require him under his hand to pass from the Protestations and Declinators against this and the preceding General Assembly, if he has been accessory to the same; and to promise and give assurance that he shall abstain from holding up debates and controversies about matters of differences in this Kirk since the Assembly, 1650, in preaching, writing, or otherwise; upon the performance whereof, the presbytery shall proceed to his trials; If not, in that case the presbytery shall forbear to proceed, until the next General Assembly; leaving liberty to the presbytery or congregation for planting of the place otherwise: …By these proceedings and practices, the most unjust and irregular that we have known in this Church since we did begin to look at reformation in the year 1638, and which were indeed the great cause of the distempers and distractions that have since followed, malignant and disaffected men in congregations and presbyteries have got up the head, and having the advantage of the acts already mentioned, they do make a bar thereof to shut the door against the calling of able and godly men to the work of the Ministry, who cannot bring their consciences in bondage to these things;… …though yet the protesting Brethren have been tender even of these things [of order in due process], and have made conscience as to do nothing evil and sinful in itself, so to do nothing from contempt or disrespect to the least point of order; yea, they have been careful to keep within the bounds, warranted and allowed unto them of God; And, if it be fit to compare, we may truly say, that for all the noise our Brethren make against them, for the violation of order, and taking irregular courses, they have been more careful than themselves have been, and that they have more just and weighty grievance against them, even upon this accompt [account], than they have against the protesting Brethren:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658)</cite>, pp. 20-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

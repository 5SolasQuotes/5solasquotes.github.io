<main class="wrap"><figure class="quote" id="q-e3840a983d" data-kw="">
<blockquote><p>I. God has planted two principles in the mind of man: the avoidance of evil and the desire of good; the irascible (to thymikon) and concupiscible appetite (to epithymetikon). Viewed in the genus of being and physically, these are neither good nor bad, but mean and indifferent, drawing all their moral goodness and evil from the quality of the objects about which they are exercised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, The Reformed View | Institutes (P&amp;R) | vol. 2, 11th Topic, Q. 21, ‘The 10th Commandment… Are the Incipient Motions Sins? We Affirm’, p. 134</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41388c7879" data-kw="">
<blockquote><p>Man truly begets man, although the soul is created by God, not because he only bestows him a body, nor because he prepares the body for receiving the soul… but because from the man who begets comes the very action by which the rational soul is substantially united to the body, and begins to inform, inhabit, and fill the whole material of the body. Thus in our opinion, the begetting of man is located in that action by which, through prolific virtue, the soul is joined by an essential bond to the body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Exercise, on the Origin of the Soul &amp; the Propagation of Sin, in which the Common View is Explained &amp; Defended, &amp; All the Ways in which Others Explain the Passing Down</cite>, [Traductionem] of Souls &amp; the Propagation of Sin are Confuted in Philosophy Serving Theology, that is, a Pius &amp; Sober Explication of Philosophical Questions Occurring Occassionally in Theological Disputations (Oxford, 1641) ToC, p. 84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Man truly begets man, although the soul is created by God, not because he only bestows him a body, nor because he prepares the body for receiving the soul… but because from the man who begets comes the very action by which the rational soul is substantially united to the body, and begins to inform, inhabit, and fill the whole material of the body. Thus in our opinion, the begetting of man is located in that action by which, through prolific virtue, the soul is joined by an essential bond to the body.”

</figure><figure class="quote" id="q-29cde56673" data-kw="">
<blockquote><p>117. A significant part of that dominion and subjection [Gen. 1:28] is that humans could feed not only on herbs and tree fruits, but also on animals for food. After the Pythagoreans and Hebrews, other ancient and modern Christians considered this unlawful, deceived by παρερμηνείᾳ [a misinterpretation] of Moses’ words, which when correctly explained declare the opposite. For God speaks thus [Gen. 1:29-30]: “Behold, I have given you every herb bearing seed, which is upon the face of the earth, and every tree which is in it, the fruit of the tree bearing seed shall be yours for food; ולכל חית הארץ [and for all living things of the earth], or together with all animals of the earth, indeed and every bird of יeaven and every creeping thing upon the earth, with every green herb of the earth for food.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-heidegger.html">Johann H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Christian Theology</cite>, tr. by AI by Onku (Zurich: Bodmer, 1700), vol. 1, locus 6, ‘On the Creation of the World’, sect. 117, pp. 235-36</span></figcaption>

</figure><figure class="quote" id="q-f32404dc04" data-kw="">
<blockquote><p>Man’s intellect, to go no further, since it attains universal and necessary truth, is not limited by material conditions and material organs. Hence man’s soul, the source of his intellect, is independent of matter, and hence survives the corruption of the human organism.</p></blockquote>

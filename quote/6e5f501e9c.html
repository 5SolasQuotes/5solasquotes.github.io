<main class="wrap"><figure class="quote" id="q-6e5f501e9c" data-kw="">
<blockquote><p>Our Worship is more spiritual than their worship was. As that known place in Joh. 4. 23. where Christ saith to the woman of Samaria, You serve God in this place: But the time shall come that they shall serve him every where, for God is a Spirit, and will be worshiped in spirit and in truth. There is more spiritual worship in the time of the Gospel than was in the time of the Law: The Lord carried them on in a carnal and a sensitive way: and indeed this hath been a great design of Antichrist to bring men to a carnal way of worship, To carnal Ordinances, for so they are called in Scripture, the Commandments of God by Moses, are called carnal, Heb. 9. 10.

For their worship was in comparison of the worship in the Gospel but carnal; (I say) it hath bin the design of Antichrist to darken the glory of Jesus Christ in the Gospel, by bringing the Church to a carnal way of worship, and to take away spiritual, and therefore they are altogether about carnal Institutions, whereas Jesus Christ hath instituted but only two Sacraments, wherein there are outward carnal things, wherein we worship God through the Creature, otherwise His worship is altogether spiritual; but now Antichrist he would bring in altogether carnal things, he would and a hundred inventions of his own, as building sumptuous Temples, railing in of the Communion Tables, and then turning them into Altars; with such kind of apish gestures, foolish garments, and Heathenish music, all which was carnal worship, the devices of men to please children and fools with: exceedingly much against the very life and soul of Godliness, and the only rule of worship in the Word of God.

Besides this ridiculous and carnal way of worship, made the worshipers twofold more the children of Satan than they were before. But now the more spiritual any worship of God is, the more spiritual it makes the heart, the less we stick to the creature while we are worshipping of God, the more communion we come to have with Christ, and so it doth raise holiness to a more higher pitch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 49-50.</span></figcaption>

</figure><figure class="quote" id="q-c193d03d76" data-kw="">
<blockquote><p>I don’t believe that churches have to resurrect the custom of head coverings. Were the custom still dominant, it would be pious to respect and retain it, but a lost custom is somewhat different. When a custom is lost, the public meaning of that custom changes, and enforcing it anew can send a new and different (and, yes, mistaken) meaning… Yet 1 Corinthians 11:2–16 teaches us that godly customs in practice should be retained, and it teaches us to investigate our customs to see what message they are sending. Intelligible customs that signify male headship or the glory of godly femininity should be respected and promoted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-wedgeworth.html">Steven Wedgeworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Going on a Bear Hunt</cite>, (2021) 26 paragraphs</span></figcaption>

</figure><figure class="quote" id="q-afadbdd95b" data-kw="">
<blockquote><p>The human understanding is the ear to which the Word of God speaks, and if it be but so spoken as that that ear may plainly hear it, it is enough. God is sovereign as to the manner of revealing his mind, whether he will reveal it by saying it in express terms or whether we can perceive it by laying several things that he has said together. If his mind be but revealed, it is sufficient for us if there be but sufficient means for the communication of his mind to our minds, whether we hear so many express words with our ears or see them with our eyes or see by the eye of reason and understanding the thing that he would signify to us.

Who can say that if that had been the mind of God that we should keep the first day of the week, he would have commanded it in express terms, as he did the keeping the seventh day of old? Indeed, if God had so made our faculties that we were not capable of receiving a revelation of God’s mind in any other way, then there would be some reason to say so. But God has given such understanding that we are capable of receiving a revelation when made in another manner. And if God deals with [us] agreeably to our natures and in a way proportionable to our capacities, it is enough.

And if God any way whatsoever discovers his mind in a way proportionable to our faculties, we are obliged to obedience, and God may expect our notice and observance [of] his revelation in the same manner as if he had revealed it in express terms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 224.</span></figcaption>

</figure><figure class="quote" id="q-f3022809f5" data-kw="">
<blockquote><p>In the third place he comes on to the chief Organ, that is, the in­strument wherewith they should sing. It is not with the Or­gans of the Papists, no not with thy tongue; but it is with the heart, and with the affection of a well ruled heart. Therefore as a fiddler, or any that plays on an Instrument tempers his Simile. Instrument, that a sweet harmony may be heard of it: Even so before thou sing, temper thou thy heart; and let thy song rise, not from thy throat, but from the depth of thine heart, that is, from thine affections set upon God.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“In the third place he comes on to the chief Organ, that is, the in­strument wherewith they should sing. It is not with the Or­gans of the Papists, no not with thy tongue; but it is with the heart, and with the affection of a well ruled heart. Therefore as a fiddler, or any that plays on an Instrument tempers his Simile. Instrument, that a sweet harmony may be heard of it: Even so before thou sing, temper thou thy heart; and let thy song rise, not from thy throat, but from the depth of thine heart, that is, from thine affections set upon God.”

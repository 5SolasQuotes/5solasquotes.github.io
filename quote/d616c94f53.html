<main class="wrap"><figure class="quote" id="q-d616c94f53" data-kw="">
<blockquote><p>Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David B. MacKinnon</cite>, ed., Refreshment for the Soul: A Year of Daily Readings From ‘The Heavenly Doctor’ Richard Sibbes (The Banner of Truth, 2022), 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-16aaad586b" data-kw="">
<blockquote><p>In fact we assert from Scripture that the pious who have died under either of both testaments are not enjoying some heavenly joy apart from the presence of God, as some of the great men used to think [such as Justin Martyr, Dialogue with Trypho 5 and Irenaeus, Against Heresies 2.34.1 &amp; 5.31.2], but that they are fully enjoying true and unbroken blessedness in God’s very presence. Even so we do not deny that some degree of happiness is kept aside for them until the last day, when [their souls] will be joined to their bodies. This is demonstrated by very many places of Scripture, for also David locates the place of their true blessedness as the presence of God (Psalm 26:23 and [Ps.] 84). And Paul desires ‘to depart and to be with Christ’ (Philippians 1:23); and 2 Corinthians 5:8: ‘And so we choose rather to depart from the body and go to dwell with the Lord.’ The apostle testifies that Christ is with the Father, and on the Father’s throne (Revelation 3:21; John 17:5; Hebrews 9:24). Therefore also throughout Revelation the deceased saints are placed together with the angels before the throne of God and the Lamb, so that they sing constant praises and give thanks to Him, as can be seen in Revelation 4:8, 5:8, and 7:9.</p></blockquote>

e.com/on-the-beatific-vision/#:~:text=In%20fact%20we%20assert%20from%20Scripture,in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9&amp;text=In%20fact%20we%20assert%20from%20Scripture%20that%20the&amp;text=be%20seen%20in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5dd7c3879c" data-kw="">
<blockquote><p>Now in all dwelling in Christ there is a continual acting of life by believing, joying, resting in God. As Phillip says, Jn. 14:8, ‘Lord, show us the Father and it sufficeth us.’ Here life seeks a soul-satisfying union with life, for life is only a satisfactory object to life. Living things seek no dead things as such to be their happiness if reason do rightly act them, and God as revealed in Jesus Christ is that in which the saints find a soul-sufficiency for themselves; and the act of seeing God in Christ, whether in this life or in the life to come, is an act of life, for the soul lives in the ocean, sea, and bosom of a fair eternal truth. But does it act there? yea, it does, and the Scripture expresses its acting by seeing God, drinking the fountain of life. Then the soul, thus in Christ, drinks in love and milks, and sucks in the soul-rejoicing irradiations of Christ, and Christ letting out the breathings of the sweetness of his excellency on the face of the soul draws and sucks in reciprocally acts of admiration and wondering, Cant. 2:8, ‘The voice of my beloved, behold he cometh leaping upon the mountaines, and skipping on the hills;’ ‘behold’ is a word of wonder, 1 Jn. 3:1, ‘Behold what manner of love the Father hath bestowed on us.’ Not love only, but the manner and the kind of the Father’s love in Christ, is a world’s wonder, and 2 Thess. 1:10, Christ when he comes shall be wondered in them that believe. 2. Then again when we see and enjoy the drawing loveliness of Christ, He as the fountain and well of life pours in, in our intellectuall love and in the glancings and rays of our understanding, acts of divine light, lumps of fresh love from the spring of heaven’s love, and the soul opens its mouth wide and takes in the streams of Christ’s nectar, honey and milk, his consolations and love-breathings; and in his light we seeing light, and in his love, feeling love, He makes out light and love (as it were) coeternal with borrowed eternity; and we go along with the out-shinings of Christ’s bright countenance, to shine in borrowed light, to flame in borrowed coals of love; and as Christ is said to feed his flock among the lilies, the garden of Christ, his Church being the common pasture for the lambs of the flock; so He feeds the souls of the saints that enjoy Him, with the marrow, fatness and dainties of his light and love that shine in his face, even as the oil feeds the lamp; but with this difference, Christ’s dainties are not lessened because we feed upon them, as the oil is consumed with burning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 360-61</span></figcaption>

love+from+the+spring+of+heaven%E2%80%99s+love%2C+and+the+soul+opens+its+mouth+wide+and+takes+in+the+streams+of+Christ%E2%80%99s+nectar%2C+honey+and+milk%2C+his+consolations+and+love-breathings%3B+and+in+his+light+we+seeing+light%2C+and+in+his+love%2C+feeling+love%2C+He+makes+out+light+and+love+%28as+it+were%29+coeternal+with+borrowed+eternity%3B+and+we+go+along+with+the+out-shinings+of+Christ%E2%80%99s+bright+countenance%2C+to+shine+in+borrowed+light%2C+to+flame+in+borrowed+coals+of+love%3B+and+as+Christ+is+said+to+feed+his+flock+among+the+lilies%2C+the+garden+of+Christ%2C+his+Church+being+the+common+pasture+for+the+lambs+of+the+flock%3B+so+He+feeds+the+souls+of+the+saints+that+enjoy+Him%2C+with+the+marrow%2C+fatness+and+dainties+of+his+light+and+love+that+shine+in+his+face%2C+even+as+the+oil+feeds+the+lamp%3B+but+with+this+difference%2C+Christ%E2%80%99s+dainties+are+not+lessened+because+we+feed+upon+them%2C+as+the+oil+is+consumed+with+burning.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+pp.+360-61&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5dd7c3879c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5dd7c3879c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=Now%20in%20all%20dwelling%20in%20Christ,the%20oil%20is%20consumed%20with%20burning&amp;text=Now%20in%20all%20dwelling%20in%20Christ%20there%20is&amp;text=them%2C%20as%20the%20oil%20is%20consumed%20with%20burning" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Controversy XVI: Is it lawful to do good for the sake of the eternal reward? [Romanist] Position of Bellarmine: It is lawful and useful to do good for the sake of the eternal reward as a meritorious work. The saints were moved to true piety in this way, like Moses (Hebrews 11), David (Psalm 119), and Paul (Philippians 3). And the apostles use this argument to exhort to piety (1 Corinthians 9; Galatians 6; Colossians 3). Orthodox Position: In doing good, we should primarily seek God and His glory as the ultimate end (Colossians 3) and secondarily our salvation. Subordinate ends are not incompatible. And our salvation is closely linked to God’s glory. Moreover, this is done to stir our zeal. And this is what is proved by the cited passages. Care must always be taken to love God for Himself, not for our own benefit, with the love of friendship, not of concupiscence, so that it is not a mercenary friendship. Therefore, Bernard says: ‘God is not loved without reward, though He should be loved without the intention of reward.&#x27;</p></blockquote>

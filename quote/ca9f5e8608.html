<blockquote><p>10. And the sons of the stranger shall build thy walls. He continues the same subject. As he formerly said that foreigners shall submit to his authority, in order to build the temple; so he now says that “the sons of the stranger” shall bestow their labour in building the walls. Various are the comparisons by which he promises the restoration of the Church.

It is customary in Scripture, when the Church is spoken of, to exhibit sometimes the temple, and sometimes Jerusalem. He promises that foreigners and strangers shall assist in rearing this building, that the Jews may not be terrified by their poverty or their small number, and consequently lose heart; for they might be tempted to distrust during the captivity, so that, though they hoped to return to their native country, still they might think that this could not be accomplished by them.

Now, Cyrus accomplished it, when he supplied them with a large amount of gold and silver. But in him these things were merely shadowed out. They were actually fulfilled in Christ, to whose reign they must entirely relate; for, first, Christ employed a few apostles, (Matthew 10:1) who could not be sufficient for so great a work; but afterwards he raised up strangers, from among whom he chose pastors, and wished that their foreign princes should be nursing ­fathers of the Church.

With aggravated wickedness do the Papists pervert and corrupt this passage, by torturing it to uphold the tyranny of the Pope, whom they wish to possess supreme power over kings and princes. They speak impudent falsehood when they say that he is Christ’s deputy; for Christ’s “kingdom” is not of this world. (John 18:36) The Pope rules barbarously and tyrannically, and claims the power of changing and disposing of kingdoms. But kings submit to Christ in such a manner that they do not cease to be kings, but exercise all their power for preserving the worship of God and administering righteous government.

Hence we see how much those persons are opposed to the kingdom of Christ who wish to snatch authority and power from kings, that they themselves may possess it. Hence also the Anabaptists may be refuted, who overturn political order so far as to imagine that kings cannot be Christians in any other way than by renouncing their own authority, since even in the royal rank God shows that he wishes to hold the highest place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Fourth</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 8a: 286-87.</span></figcaption>

<blockquote><p>Question 3. Whether indifferent actions differ nothing among themselves, but are all equally distant from good and evil? 7th Answer. In their own intrinsic nature they differ nothing at all; but yet there are some which for the most part have evil circumstances annexed to them, and so bend more toward evil, and have an evil name, as to do the work of an accuser, the office of an hangman, etc. Some there be also which for the most part have good circumstances, and so bend toward good, and have a good name, as, to till the ground, to follow our study diligently, etc. Question 4. Whether do things indifferent make any thing for order and comeliness? 8th Answer. Whatsoever it is that of its own nature serves for order or comeliness, or edification, is not indifferent: for when they do participate [in] the nature of goodness, they are not in the middle betwixt good and bad. And when they produce good, they must needs have some good force and efficacy in them: every thing brings forth its like. Question 5. Whether do indifferent things cease to be indifferent when any certain thing is set down concerning them, by such as are in authority? 9th Answer. Nothing ought to be commanded, but that which is good, nor to be forbidden, but what is evil; That which is indifferent cannot simply, absolutely, and forever be either enjoined or forbidden; but commanded, as it draws near to good, forbidden, as it approaches to evil.</p></blockquote>

<blockquote><p>1. that the claim and title that a people has to Christ is not the ground why the keys are given to that people, as to the original subject, because they may have the Word, sacraments and keys a long time, and yet want [lack] faith in Christ, and so all title and claim to Christ: All which time they have the keys, discipline, and sacraments; and I believe their acts of discipline, censures, and sacraments are valid, therefore the Church redeemed and builded on the rock Christ, is not the kindly subject of the keys. 2. The keys are given to professors clothed with a ministerial calling, whether they be believers or unbelievers, howbeit God gives them for the salvation and edification of believers.</p></blockquote>

<blockquote><p>…ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.”

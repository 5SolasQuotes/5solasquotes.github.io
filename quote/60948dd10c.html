<main class="wrap"><figure class="quote" id="q-60948dd10c" data-kw="">
<blockquote><p>Of these natures, the necessity, and verity whereof hath been declared, there are divers operations; for there are two natures in Christ, as it were two inward, and effectual beginnings; out of which formally, Actions, and their manners, are deduced: wherefore, as all things in Christ, (his subsisting only excepted,) are two-fold, (or of two sorts) to wit, his Nature, Properties, Will, Knowledge: so are there two-fold operations; some divine, some humane, distinguished by their beginnings, manners of doing, and the particular Actions of each of them. By their beginnings: because, look how many Natures there are; so many formal beginnings of actions there are. By the manners of doing: for every beginning works according to it own manner, and condition: the God-head, after a supernatural, and divine manner: the man-hood after a Natural and Human manner. By particular Actions; for the Word works that, which is of the Word, and the Flesh, that, which is of the Flesh, without any confusion of Natures, in the unity of Person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, … (London, 1610), ‘Of the Person of Christ’, Part Confirmative, ch. 6, pp. 152-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b48546fda" data-kw="">
<blockquote><p>5. Christ, God and man, indeed forgives sins, but in a diverse manner: as He is God, and as He is man. Whereon it also follows, that Christ, God and man (which we also confess) together with the Father and the Holy Ghost, forgives sins: but He does it in one sort, as He is God, and in another, as He is man. For as He is God, He does effect the same properly and of his authority: but as He is man, He does it, and did it in the flesh, as being a fellow-worker with the deity: in his human will consenting to the divine, and pronouncing the words ‘Thy sins are forgiven thee’: as also Leo the First, Epistle 10 [28], ch. 4, so expounds it to Flavianus, saying, each form (namely of God and man) works with communion of the other, that which is proper to itself: as, the Word working that which is proper to the Word, and the flesh performing that which belongs to the flesh. To forgive sins was the proper action of the divine nature: and to say, ‘Thy sins are forgiven thee’, of the human. Thus far he.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (1599) | Ch. 27, ‘Of Perpetual Remission of Sins in the Church of Christ’, pp. 253-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-dfa428a757" data-kw="">
<blockquote><p>Christ’s flesh, that is, his humanity, should not be worshipped, since it is not Deity, that is, God. Nothing should be worshipped which is not God. This honor is proper to God alone, as it is written: You will worship the Lord your God and serve Him only (Matthew 4[:10]). We do not deny that the man Christ is to be worshipped, but we do not concede that the humanity of Christ should be worshipped in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586</cite>, ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), p. 419</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-c5080ce246" data-kw="">
<blockquote><p>We do not adore a creature; by no means. For such errors belong to the heathen and the Arians; but we adore the Lord of the creature, the incarnate Word of God. For although the flesh itself by itself is a part of created things, still it has become the body of God. Nor do we pay adoration to this body as separately distinguished from the Word, nor, when about to adore the Word, do we separate the Word far from the flesh, but since we know, as it is said, ‘The Word was made flesh,’ we acknowledge Him as God even in the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 60, ‘To Adelphius’ against the Arians NPNF2</cite>, 4:575; PG 26.1074-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-2b8233a23e" data-kw="">
<blockquote><p>Although the efficient cause of the operations of Christ is one alone [that of the divine nature], still the exciting cause is twofold–the divinity and humanity. The work upon which both exciting (egergema) causes exert their power is one, but the action (energeia) is twofold.</p></blockquote>

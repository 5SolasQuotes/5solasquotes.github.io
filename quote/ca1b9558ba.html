<blockquote><p>Question 3. Whether indifferent actions differ nothing among themselves, but are all equally distant from good and evil? 7th Answer. In their own intrinsic nature they differ nothing at all; but yet there are some which for the most part have evil circumstances annexed to them, and so bend more toward evil, and have an evil name, as to do the work of an accuser, the office of an hangman, etc. Some there be also which for the most part have good circumstances, and so bend toward good, and have a good name, as, to till the ground, to follow our study diligently, etc. Question 4. Whether do things indifferent make any thing for order and comeliness? 8th Answer. Whatsoever it is that of its own nature serves for order or comeliness, or edification, is not indifferent: for when they do participate [in] the nature of goodness, they are not in the middle betwixt good and bad. And when they produce good, they must needs have some good force and efficacy in them: every thing brings forth its like. Question 5. Whether do indifferent things cease to be indifferent when any certain thing is set down concerning them, by such as are in authority? 9th Answer. Nothing ought to be commanded, but that which is good, nor to be forbidden, but what is evil; That which is indifferent cannot simply, absolutely, and forever be either enjoined or forbidden; but commanded, as it draws near to good, forbidden, as it approaches to evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, ([Leiden &amp; London] 1639), bk. 3, ch. 18, ‘Of Things Indifferent’, p. 89</span></figcaption>

ead it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-59e476181b" data-kw="">
<blockquote><p>…there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.</p></blockquote>

et="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…we do not deny that faith can be called in a certain sense implicit, both in children and the uninstructed (who have only an obscure knowledge) and in the more advanced (in whom the light is always mixed with darkness…)… But the question is whether faith in its conception includes knowledge; if not a full, still a true and certain knowledge in its own order. …the question is whether that assent is blind, destitute of all knowledge, so that it may be better defined by ignorance and to believe is to assent to things unknown [or not].” – Institutes 3.565 Even children are to ‘obey’ their ‘parents in the Lord’ (Eph. 6:1), that is, in consistency with their knowledge of right and wrong and in faith to God. It should be apparent that if subordinates have, or should have, a rational trust in their superiors, the less the superiors need to pedantically instruct their subordinates in the reasons for their rules. However, if a subordinate has a grounded case of conscience against the command of the superior, and it is not an emergency (where the superior must act for the subordinate’s good regardless), then the superior(s) ought to make clear sufficient reasons as to the moral necessity of the command so as to persuade their conscience if at all possible. A rule (such as that of this webpage) may often be gone without as long as it may be appealed to and bind when necessary. To put it another way, it is not wrong to serve authorities or men, even though we do not have a full and explicit persuasion of the complete moral bindingness of their dictates from God’s natural and moral laws, if we are able, perhaps for other reasons, to serve them in the Lord. That is to say, passive obedience, where one is not fully convinced of the inherent bindingness of the precept itself, is acceptable if one is able to do it for other godly reasons. Paul said, for instance: 1 Cor. 9:19 “For though I be free from all men, yet have I made myself servant unto all, that I might gain the more.</p></blockquote>

<blockquote><p>1. A fault may be light and small in its rise, so long as it is private, which deserves not excommunication, but if contumacy shall come to the fault, as it is here [in Mt. 18] in its growth and tendency to scandalize many, it is not small.</p></blockquote>

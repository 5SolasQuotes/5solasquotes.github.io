<main class="wrap"><figure class="quote" id="q-5bdb92f8f8" data-kw="">
<blockquote><p>I. This doctrine which doth place in an infidel and unregenerate man grace, which either mediately or immediately may suffice to the obtaining of faith or salvation, without any knowledge of the Gospel and faith in Christ, doth pull up Christian Religion by the roots, and is contrary to Scripture and experience.

II. First of all, it must needs be that all doctrine in matter of our salvation, which doth not rest it self on the testimony of the scripture, must fall to the ground: But the Scripture doth no where say, that God is bound to give increases of grace to them who have rightly used natural light and understanding. It doth no where say that a man without faith can rightly worship God. It doth no where say that God is bound to give to all men, mediately or immediately, power to believe and fulfil those things which are commanded in the Gospel: It doth no where say that supernatural grace is given to all men, by which they may rightly use natural light: It doth no where say, that the Gentiles who are ignorant of Christ, are led by the holy Ghost. These are the forgeries of idle men, whom an evil itching of wit, and a bad custom of disputing hath ceased on.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-568cf10111" data-kw="">
<blockquote><p>The Law holdeth forth a perfect righteousness, and will not admit of any other; but the Gospel, that condescends, and brings pardon through Christ. And this is the main difference, and in which they can never be made one. Now the Papists, Arminian, Socinian, and others do overthrow this grand and main difference holding justification by works under some notion, or other: whereas the Apostle maketh an immediate opposition, If of faith, then not of works. The Apostle doth not distinguish of works of nature, and works of grace, or of works of grace perfect imperfect: but speaketh absolutely, &amp; so doth also exclude that subtle opinion, of making faith to justify as a work; for the Apostle, making an opposition between faith and works, must necessarily take faith under such a notion, as cannot be a work. And this truth is that which is the pillar of the Church of God, and that which differenceth us from Jews, Turks, Papists, and many Hereticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), p. 258.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Law holdeth forth a perfect righteousness, and will not admit of any other; but the Gospel, that condescends, and brings pardon through Christ. And this is the main difference, and in which they can never be made one. Now the Papists, Arminian, Socinian, and others do overthrow this grand and main difference holding justification by works under some notion, or other: whereas the Apostle maketh an immediate opposition, If of faith, then not of works. The Apostle doth not distinguish of works of nature, and works of grace, or of works of grace perfect imperfect: but speaketh absolutely, &amp; so doth also exclude that subtle opinion, of making faith to justify as a work; for the Apostle, making an opposition between faith and works, must necessarily take faith under such a notion, as cannot be a work. And this truth is that which is the pillar of the Church of God, and that which differenceth us from Jews, Turks, Papists, and many Hereticks.”

l-distinction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7cd0d7428e" data-kw="">
<blockquote><p>Now for to seek the Original of this evil any further back then the time of Arminius Professor at Leyden, were to disguise the fact. Some others before him it may be have had the same scruples, and the same troubles in their consciences upon those high points of Predestination and the Dependences of it; But the Church hath still continued in her peace and quiet; in such sort that the fountain and spring of the alteration which since his time some have endeavoured to introduce into the true and ancient Doctrine which you have always professed, and is received and authorized by the common consent of all the reformed Churches (howsoever some particular men have had an opinion a part touching the said points) ought to be attributed to Arminius and to none other. …

Contraria inter se posita magis elucescunt, we see then, before the time of Arminius what was the estate of these Provinces: union in the Church and Estate; good correspondence between the Magistrates; Christian love and charity among the people; the Sovereign Courts of Justice respected; the soldiers (the servants of your Lordships) in peace with all the world except your Enemies; all cheerfulness, all rejoicing, all acknowledgement of the blessing of GOD, which hath appeared miraculously in the defence of his cause, in the sight and notice of all the world in your prosperity; whereat the Enemies of this estate, have remained dismayed and amazed, and the friends of it greatly comforted.

For the present now that every one sees so clearly quantum dimiss a petitis praestant, let the Remonstrant take in good part the Remonstrance that followeth, and let him (if he please) serve himself thereof, Mature redeat repetatque relicta. But if the Doctrine of Arminius be so far spread and multiplied as there be no more time to give back, but that it behoveth to passe further to a decision, which of the two opinions is more conform and agreeing to the truth of the Word of God; or at the least what sort of Christian toleration may be permitted without scandal in the Church, who shall be a competent Judge in this matter?

To carry this authority to the temporal Magistrate, giving to Caesar that which belongs to Caesar, were to lean and incline too much of that side, and to take from God that which is God’s.

Wherefore to proceed with due regard as well towards them to whom God hath given authority over our bodies, as of those that have the cure and charge of our souls, that which in such occurrences is always practised, and whereunto within Christendom at all times men have had recourse. It is a National Synod; I say National, because the evil being passed from Province to Province, a Provincial Synod is not sufficient, but only for so much as it serveth for a preparative to the National Synod. This is the Remedy which is found good by the greatest part of the Provinces, and that which is recommended to you by the King my Master.

As for the Provinces, I will not play the busybody in aliena Republica, therein to Judge how much every Province in particular ought in such occasions to yield to the public. But whilst in this business men stand to dispute the right of Sovereignty of every Province apart, let them not forget the Oath by which they are consolidated and closed up into one body which is the Union of Utrecht grounded upon Religion.

And although they seek to evade and escape by shew of one Article which is, That every Province hath its power a part in matter of Religion, This ought to be understood soundly for the maintenance of the pure &amp; sincere Religion, and not for the authorisation and allowance of new and strange opinions; And principally in this Province where we are at this present, in the contemplation whereof it is to be presumed that Article was inserted for the better upholding of the Reformed Religion in his purity without being exposed to the will and pleasure of the other Provinces which at that time were not reduced to such an Union of the Church as they enjoy at this present.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-carleton.html">Dudley Carleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The speech of Sir Dudley Carlton Lord Ambassador for the King of Great Britain made in the Assembly of the Lords the Estates General of the United Provinces of the Low Countries. Being assembled at the Hague. Touching the discord and troubles of the Church and policy, caused by the schismatical doct</cite>, (London: Nathaniel Browne, 1618), pp 2-3, 5-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

2C+That+every+Province+hath+its+power+a+part+in+matter+of+Religion%2C+This+ought+to+be+understood+soundly+for+the+maintenance+of+the+pure+%26+sincere+Religion%2C+and+not+for+the+authorisation+and+allowance+of+new+and+strange+opinions%3B+And+principally+in+this+Province+where+we+are+at+this+present%2C+in+the+contemplation+whereof+it+is+to+be+presumed+that+Article+was+inserted+for+the+better+upholding+of+the+Reformed+Religion+in+his+purity+without+being+exposed+to+the+will+and+pleasure+of+the+other+Provinces+which+at+that+time+were+not+reduced+to+such+an+Union+of+the+Church+as+they+enjoy+at+this+present.%E2%80%9D%0A%0A%E2%80%94+Dudley+Carleton%2C+The+speech+of+Sir+Dudley+Carlton+Lord+Ambassador+for+the+King+of+Great+Britain+made+in+the+Assembly+of+the+Lords+the+Estates+General+of+the+United+Provinces+of+the+Low+Countries.+Being+assembled+at+the+Hague.+Touching+the+discord+and+troubles+of+the+Church+and+policy%2C+caused+by+the+schismatical+doct%2C+%28London%3A+Nathaniel+Browne%2C+1618%29%2C+pp+2-3%2C+5-7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7cd0d7428e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7cd0d7428e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/05/dudley-carleton-on-arminianism-and-discord-in-the-dutch-republic/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-23fccf8c36" data-kw="">
<blockquote><p>The hopes of the Arminians in England were but small so long as K[ing]. James did live, for that good Prince both in word and writing did threaten to burn these Hereticks if any of them should appear in his Dominions; see his Declaration against Vorstius: yea, so long as [George] Abbot was in grace at Court, the Arminians kept a low sail, but after that his Successor even in his own time had come in favour, that unhappy Sect under the patronage of Mountagu and White’s learning began to spread far and near, yea, at last silence in a public Edict was enjoined to their opposers, and all favours conferred on those who had skill and will to promote that Cause, &amp; many evident disgraces poured on well-deserving men for no other reason but their Anti-Arminian spirit.

All this time our Church [the Church of Scotland] was free of these evils; but so soon as the advancers of Arminianism at the English Court, began to intermeddle with the affairs of our Kingdom, at once these men were eyed, who inclined that way, prime places were put into their hands for no other virtue the World could discern in them, but their boldness to let out their inclination towards the Arminian Error.</p></blockquote>

</figure><figure class="quote" id="q-9a60b3960c" data-kw="">
<blockquote><p>We also renounce Arminianism, which is a System containing many gross Errors; such as, notwithstanding of the Fall, Man retains a Freedom of Will to that which is spiritually good; that the Grace of God is not irresistible and efficacious of itself; that Believers in Christ may fall totally and finally away from a State of Grace; that Election depends upon foreseen good Works; and that Christ merited Grace to all Mankind; that the Reason why some are chose to Salvation, and others rejected, is for the foreseen Faith and good Works of the one, and for the foreseen Unbelief and evil Works of the other …</p></blockquote>

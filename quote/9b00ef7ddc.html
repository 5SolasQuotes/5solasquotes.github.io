<main class="wrap"><figure class="quote" id="q-9b00ef7ddc" data-kw="">
<blockquote><p>Since true believers are already irrevocably interested in the covenant of grace, in the righteousness of Christ, and in the favor of God; and since they have in Christ and on the ground of His righteousness imputed to them a complete security against eternal death and a full title to eternal life, the law as the law of Christ has no sanction of judicial rewards or punishments. It has no promise of eternal life or threatening of eternal death annexed to it. The form of the covenant of works, indeed, is eternally binding on all who live and die under that violated covenant, but because Christ, as last Adam, has answered all the demands of it for believers, they are delivered from the law in that form (Rom. 7:4–6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 35.</span></figcaption>

<blockquote><p>XXVIII. From these things, however, it is now sufficiently clear that that vindicatory justice is not a free and arbitrary act that depends solely upon the will of God, but an essential property to the exercise of which the will, once sin is posited, is necessarily impelled. And indeed, if it befits the nature of God that He does not suffer him who repents of sin to perish, because He is good and clement, it will no less befit Him that He does not allow sin to go unpunished, because He is just; for as the former arises from a certain natural ῥοπῇ [inclination] and propensity of goodness and mercy toward repentance, so the latter also flows from a certain natural hatred and detestation of sin. Indeed, if we consider the matter accurately, the latter seems to be somewhat more fitting. For when He pardons sin, He does so out of a certain abundance of goodness, but He is bound by no right, by no law, to perform this; therefore, in that, He follows only the lead of his nature, while the creature has no merit. But in administering justice, besides that ῥοπῇ [inclination] of nature by which He inclines toward the hatred of sin, He also has regard for the order of which He is the guardian and avenger, and whose law, once enacted, He can by no means abrogate. Regarding the former, He sees no quality in the subject by which He could be moved to benefit it, or if He sees any, He sees one contrary to his holiness, and of such a kind that He could justly refrain from every benefit; but with respect to the latter, the subject, He sees it clothed in that quality which incites justice to exercise and propels it by a certain inevitable necessity, whence the act of mercy is plainly arbitrary if you abstract it from the decree, because it has no foundation in the subject concerning which it is exercised, whereas the act of justice is necessary, because it depends not only on the will, but on the very nature of God who punishes and the thing to be punished.</p></blockquote>

<blockquote><p>3. This goodness is communicative. [There is] None so communicatively good as God. As the notion of God includes goodness, so the notion of goodness includes diffusiveness; without goodness He would cease to be a Deity, and without diffusiveness He would cease to be Good. The being good is necessary to the being God: For goodness is nothing else in the notion of it, but a strong inclination to do good; either to find or make an object wherein to exercise itself according to the propension of its own nature; and it is an inclination of communicating itself not for its own interest, but the good of the object it pitches upon. Thus God is good by nature and his nature is not without activity; He acts conveniently to his own nature. Ps. 119:68, ‘Thou art good and dost good.’ And nothing accrues to Him by the communications of Himself to others, since his blessedness was as great before the frame of any creature as ever it was since the erecting of the world; so that the goodness of Christ Himself increases not the luster of his happiness: Ps. 16:2, ‘My goodness extends not to Thee.’ He is not of a niggardly and envious nature; He is too rich to have any cause to envy, and too good to have any will to envy: He is as liberal as he is rich, according to the capacity of the object about which his goodness is exercised. The divine goodness being the supreme goodness, is goodness in the highest degree of activity; Not an idle, enclosed, pent up goodness, as a spring shut up or a fountain sealed, bubbling up within itself, but bubbling out of itself. A fountain of gardens to water every part of his creation; He is an ointment poured forth (Cant. 1:5). Nothing spreads itself more than oil and takes up a larger space, wheresoever it drops. It may be no less said of the goodness of God, as it is of the fulness of Christ, Eph. 1:23, ‘He fills all in all‘: He fills rational creatures with understanding, sensitive nature with vigor and motion, the whole world with beauty and sweetness. Every taste, every touch of a creature is a taste and touch of divine goodness. Divine goodness offers itself in one spark in this creature, in another spark in the other creature, and altogether make up a goodness inconceivable by any creature. The whole mass and extracted spirit of it is infinitely short of the goodness of the divine nature, imperfect shadows of that goodness which is in Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, p. 588</span></figcaption>

<blockquote><p>(2) There is more goodwill in his heart than is visible in his dealings. The merciful nature of God should be a support to us, though we see nothing of the effects of it in his providence. Job 10:13, ‘These things hast Thou hid in thine heart; I know that it is with Thee.’ He speaks of his favourable inclination to show pity to distressed creatures. We are not able always to reconcile his present dispensations with his gracious nature, yet faith must not quit its holdfast: We must see what is hid in God’s heart and comfort ourselves with that favor and mercy which we know to be essential to Him: Though the mercy and pity be not visible and obvious to sense, the disposition and inclination abides in God unchangeable and sure. God is a merciful God still, and Christ a compassionate Savior, though the effects be suspended to try and sharpen our faith.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“(2) There is more goodwill in his heart than is visible in his dealings. The merciful nature of God should be a support to us, though we see nothing of the effects of it in his providence. Job 10:13, ‘These things hast Thou hid in thine heart; I know that it is with Thee.’ He speaks of his favourable inclination to show pity to distressed creatures. We are not able always to reconcile his present dispensations with his gracious nature, yet faith must not quit its holdfast: We must see what is hid in God’s heart and comfort ourselves with that favor and mercy which we know to be essential to Him: Though the mercy and pity be not visible and obvious to sense, the disposition and inclination abides in God unchangeable and sure. God is a merciful God still, and Christ a compassionate Savior, though the effects be suspended to try and sharpen our faith.”

<blockquote><p>II. As soon as a principle of new life is infused into the adult person by the Spirit of Grace, immediately spiritual acting of every kind springs up from that principle, actions so pervading and exciting one another, and so mingled in their exercise that they can scarcely be distinguished in practice; and as difficult is it to determine which is first in time, which last. Surely it is not possible but that the soul, quickened by the Spirit, should in that supernatural light wherewith it is illuminated, both see itself defiled and undone with innumerable sins, and see Christ full of grace, truth and salvation. Such a view cannot but cause both, that with shame and sorrow it be displeased with itself, and with ardent desire be carried out unto Christ. Hence arises the receiving and accepting of Christ, that it may be delivered from the fiithiness and guilt of its sins. Now it cannot receive Him for justification except at the same time it receive him for sanctification: nor receive Him as a Priest to expiate sin, unless it also receive him as a King to whom it may submit in order to obedience. Hence it follows that that act of faith whereby we receive Christ for righteousness cannot be exercised without either a previous, or at least a concomitant repentance, and a purpose of a new life. If therefore faith go before justification, as we have lately asserted; the same must be said of repentance, springing up together with it from the same principle of spiritual life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain: under the Unhappy Names of Antinomians &amp; Neonomians</cite>, (1696; Glasgow, 1807), ch. 11, ‘Whether repentance precedes the remission of sins? [Yes]’, pp. 119-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e54df171fc" data-kw="">
<blockquote><p>Repentance goes before justification, even as faith and hope; for of the Baptist it is said, that he preached the baptism of repentance for the remission of sins, Mk. 1:4; Lk. 3:3. But regeneration follows justification; for, being justified, we receive the Spirit of sanctification, whereby we are renewed, and, as it were, find a new creature begun even in this life. Repentance is the cause, regeneration is the effect; for therefore God does renew us in Christ, and make us new men, because we repent us of our old life, and begin to be wise after sin committed. Notwithstanding in the middle place, betwixt repentance and regeneration, comes in justification, when as God does of his mere mercy account and repute us as just. The name of repentance implies sorrow, but the name of regeneration gladness. To conclude, the points of repentance, as whence it proceeds and whereunto it tends, they are deeds, the evil or sin committed, and the good which ought to be practised; but the bounds of regeneration are qualities — inherent corruption, and sanctity or holiness, which is wrought in us; the old man and new man renewed in Christ. …For every change of the mind is not to be deemed forthwith regeneration, but there are certain changes of man’s mind which go before regeneration, and which prepare the mind, and so the whole man, unto regeneration, and to that new creation; in which kind repentance is a special grace. These things are to be distinguished not in time but in nature; for at that very same instant, we believe, and be effectually called, and do repent, and be justified, and be regenerate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 34, ‘Of Repentance’, p. 245</span></figcaption>

</figure><figure class="quote" id="q-d54f60b6ea" data-kw="">
<blockquote><p>Therefore secondly, we say that there are other graces coexistent with faith in the person justified. A solitary faith is not a saving and justifying faith: Faith, if it has not works, is dead, being alone. Faith that is alone saves not, though faith alone save. As the act of seeing is by the eye only, without the ear, or other senses; the eye only sees; the ear sees not, nor the taste, nor the smell, nor the feeling; yet the eye could not see if you should take away the other senses from the body. So it’s faith only that justifies without other graces or good works; yet faith without them, or separated from them, cannot justify: because indeed it cannot be without them in the person or subject where it is. So that faith is without other graces and works in its office, but not in its existence. And you may as soon part light and heat in the sun, as sanctification from justification in a believer. For faith is not only a fruit of the Spirit with other graces, but also the seed and nursery of other graces, because faith in Christ is the root-grace… It would be a strange soul that should give a faculty of seeing and no other faculty or sense: as strange a state of grace would that be that should give an act of saving and justifying faith and give no other grace besides.</p></blockquote>

</figure><figure class="quote" id="q-758c05857d" data-kw="">
<blockquote><p>Because repentance from sin is frequently in the holy Scripture made a condition going before remission and a cause without which we shall not have it, it so orders its exhortations that it may drive us to true repentance and true sanctity that so we may obtain remission. So the prophets, John Baptist, etc.</p></blockquote>

<blockquote><p>True it is, that without faith and repentance, there is no salvation; and a man dying impenitent, is damned. But, we must know that as faith and repentance are conditions, which God has ordained, and so requires on our part, though Himself give them, and work them in us; so they are a part of those means which God has appointed to attain the end of our salvation. And the meanes are such, so fixed and established of God, as they shall always attend upon his purpose and pleasure in our election to grace and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea to an Appeal traversed Dialogue-wise</cite>, (London: W. Jones, 1626), p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

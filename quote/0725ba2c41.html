<blockquote><p>CANON 18. That grace is not preceded by merit. Recompense is due to good works if they are performed; but grace, to which we have no claim, precedes them, to enable them to be done. CANON 19. That a man can be saved only when God shows mercy. Human nature, even though it remained in that sound state in which it was created, could be no means save itself, without the assistance of the Creator; hence since man cannot safe-guard his salvation without the grace of God, which is a gift, how will he be able to restore what he has lost without the grace of God? CANON 20. That a man can do no good without God. God does much that is good in a man that the man does not do; but a man does nothing good for which God is not responsible, so as to let him do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange</cite>, (AD 529)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability.html">Free Will and Inability</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6428ca8b93" data-kw="">
<blockquote><p>As for all other sins which we call actual, they are, as I said, natural only, and not supernatural; and therefore no man wants [lacks] liberty, as to do them, so to abstain from them; Only he wants a moral and spiritual liberty to abstain from them in a gracious manner, according to that of Aquinas (Summa, pt. 1, q. 23, art. 7, to the 3rd): Licet aliquis non possit gratiam adipisci qui reprobatur a Deo, tamen quod in hoc peccatum vel illud labatur, ex ejus libero arbitrio contingit. Though a man who is reprobated of God cannot obtain grace, yet that he falls into this or that sin, it comes to pass of his own free will. It is true also even in God’s providence concerning acts natural, there is a great mystery. For as God foretold David that his neighbor should lie with his wives (2 Sam. 12:11-12); and though he sinned secretly, yet the Lord would do this openly. So he foretold that upon that altar which Jeroboam erected, a child that should be born of the house of David, Josiah by name, should burn the prophets’ bones. And that Cyrus also should build him a city and let go his captives. (1 Kn. 13:2; Isa. 45:13; Ezra 1; 2 Kn. 23:16; 2 Sam. 16:22) Yet who doubts but that Cyrus did freely deliver the Jews out of Babylon? and Josiah did as freely burn the prophets’ bones upon the altar in Bethel, as ever they did [any] action in their lives? So Absalom did as freely defile his father’s concubines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind</cite>, … (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, sect. 7, p. 101</span></figcaption>

</figure><figure class="quote" id="q-4941084f95" data-kw="">
<blockquote><p>Today, the doctors of the Roman Church accuse the Protestants of denying free will; where, however, it should be noted that the question is not about the state of Integrity… But when they deal with the state of sin, they attribute to Luther, Calvin and other reformers that they teach that free will was utterly extinguished and lost through the Lapse of Adam, and therefore that man after the Lapse does not have free will. But it never came into the mind of the Protestants to simply deny free will, even after the lapse, neither with respect to natural works, nor civil, nor moral works of the natural order; but they only denied the rectitude and sanity of free will, and its natural powers for spiritual good, in which matter they followed Augustine, Enchiridion, ch. 30, ‘Man, by making bad use of free will, destroyed both himself and it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), p. 5 Latin</span></figcaption>

</figure><figure class="quote" id="q-85072453aa" data-kw="civil vs spiritual inability">
<blockquote><p>The question is not about civil and externally moral good. We do not deny that some strength still remains in man after the fall as to those external and civil good works; but the question is about spiritual and supernatural good: whether man in the state of sin is so corrupt that the powers of his free will as to the latter good are not only weakened, but wholly lost.</p></blockquote>

</figure><figure class="quote" id="q-043c8e6af6" data-kw="">
<blockquote><p>And the change which is absolutely necessary, is a change which God alone can effect. It is by his drawing men that they are induced to come to Christ. By the “drawing” of the Father we are to understand, as is evident form the following verse, the influence of the Holy Spirit, and the cogency of divine truth, understood and believed. It is by being made to hear and learn of the Father, that men are drawn to Christ. It is because men do not understand and believe the truth, that they cannot come to the Savior, and depraved men never will understand and believe that truth, till the Spirit so fix their minds on its meaning and evidence, that they cannot help understanding and believing it, and when men understand and believe the truth, coming to the Savior follows as a matter of course—they can no longer help coming to Him; and when any man, whomsoever he be, Jew or Gentile, however guilty and depraved, drawn by the Father, by his word and Spirit, comes to the Son, our Savior declares that the final salvation of that person is secure. He is one of those who are given to him of the Father, and he shall not be lost, nothing of him shall be lost. He shall be ‘raised up at the last day.’ It is plain from this passage [John 6:44], that the inability of coming to Christ, under which men labor, is not physical, but moral. It does not originate at all in a want [lack] of those intellectual and active faculties which are necessary to come to Christ, but entirely in an indisposition arising out of willful ignorance, and the love of sin, and of the world. It is like the inability of Joseph’s brethren to speak peaceably to him [Gen. 37:4]. If men cannot come to Christ, it is just because they will not come to Him. They who under the gospel dispensation ‘are untaught of God,’ are so, because they refuse to learn of Him. The appropriate means of removing this kind of inability, is the statement of the truth and its evidence. This is all men can do. Divine influence is necessary, absolutely necessary, to fix the mind on the truth and its evidence, so as to produce faith, and the native consequences of that faith; and that influence never was, never will be, refused to him who honestly desires it. What would men have more? Would they have men left to themselves? Then all must perish. Would they have God to compel men to salvation? This would be to do violence to man’s nature, God’s work! Would they have men saved as they are—in sin? This were to require an impossibility, and to do violence at once to the constitution of man, and the nature of God, to disgrace the Divine character, and overturn the Divine throne. The sum of the whole matter is, no man perishes under the gospel dispensation, but in consequence of his own willful obstinacy: no man is saved, but in consequence of a divine influence originating in free sovereign mercy. Man is his own destroyer, God is man’s only Savior. If we perish, our damnation is entirely of ourselves. If we are saved, our salvation is entirely of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-edinburgh.html">John Brown of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses &amp; Sayings of our Lord</cite>, (1852; Banner of Truth, 1990), vol. 1, pp. 459-60</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And the change which is absolutely necessary, is a change which God alone can effect. It is by his drawing men that they are induced to come to Christ. By the “drawing” of the Father we are to understand, as is evident form the following verse, the influence of the Holy Spirit, and the cogency of divine truth, understood and believed. It is by being made to hear and learn of the Father, that men are drawn to Christ. It is because men do not understand and believe the truth, that they cannot come to the Savior, and depraved men never will understand and believe that truth, till the Spirit so fix their minds on its meaning and evidence, that they cannot help understanding and believing it, and when men understand and believe the truth, coming to the Savior follows as a matter of course—they can no longer help coming to Him; and when any man, whomsoever he be, Jew or Gentile, however guilty and depraved, drawn by the Father, by his word and Spirit, comes to the Son, our Savior declares that the final salvation of that person is secure. He is one of those who are given to him of the Father, and he shall not be lost, nothing of him shall be lost. He shall be ‘raised up at the last day.’ It is plain from this passage [John 6:44], that the inability of coming to Christ, under which men labor, is not physical, but moral. It does not originate at all in a want [lack] of those intellectual and active faculties which are necessary to come to Christ, but entirely in an indisposition arising out of willful ignorance, and the love of sin, and of the world. It is like the inability of Joseph’s brethren to speak peaceably to him [Gen. 37:4]. If men cannot come to Christ, it is just because they will not come to Him. They who under the gospel dispensation ‘are untaught of God,’ are so, because they refuse to learn of Him. The appropriate means of removing this kind of inability, is the statement of the truth and its evidence. This is all men can do. Divine influence is necessary, absolutely necessary, to fix the mind on the truth and its evidence, so as to produce faith, and the native consequences of that faith; and that influence never was, never will be, refused to him who honestly desires it. What would men have more? Would they have men left to themselves? Then all must perish. Would they have God to compel men to salvation? This would be to do violence to man’s nature, God’s work! Would they have men saved as they are—in sin? This were to require an impossibility, and to do violence at once to the constitution of man, and the nature of God, to disgrace the Divine character, and overturn the Divine throne. The sum of the whole matter is, no man perishes under the gospel dispensation, but in consequence of his own willful obstinacy: no man is saved, but in consequence of a divine influence originating in free sovereign mercy. Man is his own destroyer, God is man’s only Savior. If we perish, our damnation is entirely of ourselves. If we are saved, our salvation is entirely of God.”

— John Brown of Edinburgh, Discourses &amp; Sayings of our Lord (1852; Banner of Truth, 1990), vol. 1, pp. 459-60">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+the+change+which+is+absolutely+necessary%2C+is+a+change+which+God+alone+can+effect.+It+is+by+his+drawing+men+that+they+are+induced+to+come+to+Christ.+By+the+%E2%80%9Cdrawing%E2%80%9D+of+the+Father+we+are+to+understand%2C+as+is+evident+form+the+following+verse%2C+the+influence+of+the+Holy+Spirit%2C+and+the+cogency+of+divine+truth%2C+understood+and+believed.+It+is+by+being+made+to+hear+and+learn+of+the+Father%2C+that+men+are+drawn+to+Christ.+It+is+because+men+do+not+understand+and+believe+the+truth%2C+that+they+cannot+come+to+the+Savior%2C+and+depraved+men+never+will+understand+and+believe+that+truth%2C+till+the+Spirit+so+fix+their+minds+on+its+meaning+and+evidence%2C+that+they+cannot+help+understanding+and+believing+it%2C+and+when+men+understand+and+believe+the+truth%2C+coming+to+the+Savior+follows+as+a+matter+of+course%E2%80%94they+can+no+longer+help+coming+to+Him%3B+and+when+any+man%2C+whomsoever+he+be%2C+Jew+or+Gentile%2C+however+guilty+and+depraved%2C+drawn+by+the+Father%2C+by+his+word+and+Spirit%2C+comes+to+the+Son%2C+our+Savior+declares+that+the+final+salvation+of+that+person+is+secure.+He+is+one+of+those+who+are+given+to+him+of+the+Father%2C+and+he+shall+not+be+lost%2C+nothing+of+him+shall+be+lost.+He+shall+be+%E2%80%98raised+up+at+the+last+day.%E2%80%99+It+is+plain+from+this+passage+%5BJohn+6%3A44%5D%2C+that+the+inability+of+coming+to+Christ%2C+under+which+men+labor%2C+is+not+physical%2C+but+moral.+It+does+not+originate+at+all+in+a+want+%5Black%5D+of+those+intellectual+and+active+faculties+which+are+necessary+to+come+to+Christ%2C+but+entirely+in+an+indisposition+arising+out+of+willful+ignorance%2C+and+the+love+of+sin%2C+and+of+the+world.+It+is+like+the+inability+of+Joseph%E2%80%99s+brethren+to+speak+peaceably+to+him+%5BGen.+37%3A4%5D.+If+men+cannot+come+to+Christ%2C+it+is+just+because+they+will+not+come+to+Him.+They+who+under+the+gospel+dispensation+%E2%80%98are+untaught+of+God%2C%E2%80%99+are+so%2C+because+they+refuse+to+learn+of+Him.+The+appropriate+means+of+removing+this+kind+of+inability%2C+is+the+statement+of+the+truth+and+its+evidence.+This+is+all+men+can+do.+Divine+influence+is+necessary%2C+absolutely+necessary%2C+to+fix+the+mind+on+the+truth+and+its+evidence%2C+so+as+to+produce+faith%2C+and+the+native+consequences+of+that+faith%3B+and+that+influence+never+was%2C+never+will+be%2C+refused+to+him+who+honestly+desires+it.+What+would+men+have+more%3F+Would+they+have+men+left+to+themselves%3F+Then+all+must+perish.+Would+they+have+God+to+compel+men+to+salvation%3F+This+would+be+to+do+violence+to+man%E2%80%99s+nature%2C+God%E2%80%99s+work%21+Would+they+have+men+saved+as+they+are%E2%80%94in+sin%3F+This+were+to+require+an+impossibility%2C+and+to+do+violence+at+once+to+the+constitution+of+man%2C+and+the+nature+of+God%2C+to+disgrace+the+Divine+character%2C+and+overturn+the+Divine+throne.+The+sum+of+the+whole+matter+is%2C+no+man+perishes+under+the+gospel+dispensation%2C+but+in+consequence+of+his+own+willful+obstinacy%3A+no+man+is+saved%2C+but+in+consequence+of+a+divine+influence+originating+in+free+sovereign+mercy.+Man+is+his+own+destroyer%2C+God+is+man%E2%80%99s+only+Savior.+If+we+perish%2C+our+damnation+is+entirely+of+ourselves.+If+we+are+saved%2C+our+salvation+is+entirely+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Brown+of+Edinburgh%2C+Discourses+%26+Sayings+of+our+Lord+%281852%3B+Banner+of+Truth%2C+1990%29%2C+vol.+1%2C+pp.+459-60&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F043c8e6af6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/043c8e6af6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=And%20the%20change%20which%20is%20absolutely,our%20salvation%20is%20entirely%20

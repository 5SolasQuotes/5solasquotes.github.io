<main class="wrap"><figure class="quote" id="q-f23d618857" data-kw="">
<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Right Institution, Administration &amp; Receiving of the Sacrament of the Lord’s Supper… (London, 1657), Ch. 6, ‘Of the Outwards of this Ordinance of the Supper’, section 3, ‘Of the Elements of Bread &amp; Wine’, pp. 72 &amp; 75 bound after Sermons Preached upon Several Public &amp; Eminent Occasions… (London, 1656) Vines was a presbyterian and Westminster divine.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1576e2223" data-kw="">
<blockquote><p>Wheras the Rejoinder makes sitting at a table in the Lord’s Supper and kneeling at prayer to be such things as the Lord could not command, but as snares, because sometime a table may be wanting [lacking], or something to sit on, or ability to sit, and so of kneeling: this is as poor a snare to catch any man of understanding in, as one shall lightly see made. For 1. many affirmative commandments of God there are, which in extraordinary cases cannot be fullfilled and cease to bind: as praying unto and praising of God with our voice: which is no snare, to him that cannot speak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship… (Amsterdam: Thorp, 1633), ch. 1, section 16, ‘Concerning an Argument Against our Ceremonies, out of 1 Cor. 14’</cite>, pp. 68-69</span></figcaption>

<blockquote><p>Worship is an action, or performance, or thing, by which we tender our immediate honor to God from the nature of the thing itself: 1. I call it an action because the passion of dying or suffering is not formally worship, but only dying comparatively: rather than denying of Christ or dying so and so qualified: [in a comparative way] dying with patience and faith may be called a worship [2 Tim. 4:6]. 2. I call it not an action only, but a performance or thing, because an office, as the priesthood, the ministry, is a worship and yet not an action; sometime[s], time itself, as the Sabbath Day is a worship; yet it is not an action: So the Lord calls it his Holy Day: and undeniably the Jewish days, the High Priest’s garment, and many things of that kind, were divine or religious performances, things or adjuncts of divine worship, but so as they are not merely adjuncts of worship, but also worship: For the High Priest’s ephod was not only a civil ornament, nor was it a mere physical or natural means to fence off the injuries of sun and heaven; we do not think that the Lord in all, or any place of the Old or New Testament sets down any laws concerning garments simply, as they do fence off cold or heat; that belongs to art: only He speaks of garments, as contrary to gravity [being sober-minded], as signs of vanity and lightness, Isa. 3:16, etc.; Zeph. 1:8; 1 Pet. 3:3-4. And of garments as religious observances, of which sort was the attire and garments of the priests and High Priests in their service, in which consideration the religious times, holy places, and Mosaical garments were divine worship, by which God was immediately honored; but [they were] not adjuncts only, or actions, but religious things or performances. 3. It is such a performance, as from thence honor does immediately redound to God. But that this may be the clearer, I conceive that there is a twofold, immediate honoring of God in the worship of God: 1. An honoring of God less immediate, as hearing of the Word, is an immediate honoring of God, because honor flows immediately from God, both ex conditione operis, and ex conditione operantis; ‘from the nature of the work’, and ‘[from the] intention of the worker’: yet it is a less immediate honoring of God, in regard that I may also hear the Word even from the condition of the work, and so from the intrinsic end of the worker that I may learn to know God and believe; for thus far I am led to honor God immediately in hearing the Word, that action of its own nature conveying honor to God; there intervenes also a medium amidst between me and honoring of God, to wit, the preacher or the Bible (to which no external adoration is due): [2.] There is another more immediate worship, to wit, praising of God, from which, by an immediate result, God is honored, and in worship especially, strictly, immediate, God is immediately honored both in the intention of the work and the intrinsic end of it, and the intention of the worker; though no other thing be done, and others be not edified either in knowledge, increase of faith or any other ways: And in this, duties of the Second Table, of mercy and justice, differ from worship in that such acts of love and mercy, as to give alms to save the life of my brother or of his beast, are not acts of worshipping God; their intrinsic end, and the nature of the work being to do good to the creature, principally, ex natura et conditione operis, though God also thereby be honored, yet in a more secondary consideration: For I praying to God, do immediately, from the nature of the action, honor God, though no good should either redound to myself or to the creature; thereby it is true, God, by acts of love and mercy to our neighbor, is honored two ways: 1. In that men seeing our good works do thence take occasion to glorify our heavenly Father, whose truth teaches us by the grace of God to do these works, but the intrinsic and proper use of these is to do good to ourselves, as in works of sobriety, and to our neighbor, as in works of righteous dealing, but not immediately, and in the first and primary consideration to honor God, as in works of piety, holiness and worship, the honoring of God by secondary resultance, does issue also from these duties of righteousness, but not as from the acts of praying, praising, sacramental eating, drinking. 2. The doer of these acts of mercy may, and is to intend, the honoring of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, pp. 86-88</span></figcaption>

— Samuel Rutherford, The Divine Right of Church Government… (1646), pp. 86-88">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWorship+is+an+action%2C+or+performance%2C+or+thing%2C+by+which+we+tender+our+immediate+honor+to+God+from+the+nature+of+the+thing+itself%3A+1.+I+call+it+an+action+because+the+passion+of+dying+or+suffering+is+not+formally+worship%2C+but+only+dying+comparatively%3A+rather+than+denying+of+Christ+or+dying+so+and+so+qualified%3A+%5Bin+a+comparative+way%5D+dying+with+patience+and+faith+may+be+called+a+worship+%5B2+Tim.+4%3A6%5D.+2.+I+call+it+not+an+action+only%2C+but+a+performance+or+thing%2C+because+an+office%2C+as+the+priesthood%2C+the+ministry%2C+is+a+worship+and+yet+not+an+action%3B+sometime%5Bs%5D%2C+time+itself%2C+as+the+Sabbath+Day+is+a+worship%3B+yet+it+is+not+an+action%3A+So+the+Lord+calls+it+his+Holy+Day%3A+and+undeniably+the+Jewish+days%2C+the+High+Priest%E2%80%99s+garment%2C+and+many+things+of+that+kind%2C+were+divine+or+religious+performances%2C+things+or+adjuncts+of+divine+worship%2C+but+so+as+they+are+not+merely+adjuncts+of+worship%2C+but+also+worship%3A+For+the+High+Priest%E2%80%99s+ephod+was+not+only+a+civil+ornament%2C+nor+was+it+a+mere+physical+or+natural+means+to+fence+off+the+injuries+of+sun+and+heaven%3B+we+do+not+think+that+the+Lord+in+all%2C+or+any+place+of+the+Old+or+New+Testament+sets+down+any+laws+concerning+garments+simply%2C+as+they+do+fence+off+cold+or+heat%3B+that+belongs+to+art%3A+only+He+speaks+of+garments%2C+as+contrary+to+gravity+%5Bbeing+sober-minded%5D%2C+as+signs+of+vanity+and+lightness%2C+Isa.+3%3A16%2C+etc.%3B+Zeph.+1%3A8%3B+1+Pet.+3%3A3-4.+And+of+garments+as+religious+observances%2C+of+which+sort+was+the+attire+and+garments+of+the+priests+and+High+Priests+in+their+service%2C+in+which+consideration+the+religious+times%2C+holy+places%2C+and+Mosaical+garments+were+divine+worship%2C+by+which+God+was+immediately+honored%3B+but+%5Bthey+were%5D+not+adjuncts+only%2C+or+actions%2C+but+religious+things+or+performances.+3.+It+is+such+a+performance%2C+as+from+thence+honor+does+immediately+redound+to+God.+But+that+this+may+be+the+clearer%2C+I+conceive+that+there+is+a+twofold%2C+immediate+honoring+of+God+in+the+worship+of+God%3A+1.+An+honoring+of+God+less+immediate%2C+as+hearing+of+the+Word%2C+is+an+immediate+honoring+of+God%2C+because+honor+flows+immediately+from+God%2C+both+ex+conditione+operis%2C+and+ex+conditione+operantis%3B+%E2%80%98from+the+nature+of+the+work%E2%80%99%2C+and+%E2%80%98%5Bfrom+the%5D+intention+of+the+worker%E2%80%99%3A+yet+it+is+a+less+immediate+honoring+of+God%2C+in+regard+that+I+may+also+hear+the+Word+even+from+the+condition+of+the+work%2C+and+so+from+the+intrinsic+end+of+the+worker+that+I+may+learn+to+know+God+and+believe%3B+for+thus+far+I+am+led+to+honor+God+immediately+in+hearing+the+Word%2C+that+action+of+its+own+nature+conveying+honor+to+God%3B+there+intervenes+also+a+medium+amidst+between+me+and+honoring+of+God%2C+to+wit%2C+the+preacher+or+the+Bible+%28to+which+no+external+adoration+is+due%29%3A+%5B2.%5D+There+is+another+more+immediate+worship%2C+to+wit%2C+praising+of+God%2C+from+which%2C+by+an+immediate+result%2C+God+is+honored%2C+and+in+worship+especially%2C+strictly%2C+immediate%2C+God+is+immediately+honored+both+in+the+intention+of+the+work+and+the+intrinsic+end+of+it%2C+and+the+intention+of+the+worker%3B+though+no+other+thing+be+done%2C+and+others+be+not+edified+either+in+knowledge%2C+increase+of+faith+or+any+other+ways%3A+And+in+this%2C+duties+of+the+Second+Table%2C+of+mercy+and+justice%2C+differ+from+worship+in+that+such+acts+of+love+and+mercy%2C+as+to+give+alms+to+save+the+life+of+my+brother+or+of+his+beast%2C+are+not+acts+of+worshipping+God%3B+their+intrinsic+end%2C+and+the+nature+of+the+work+being+to+do+good+to+the+creature%2C+principally%2C+ex+natura+et+conditione+operis%2C+though+God+also+thereby+be+honored%2C+yet+in+a+more+secondary+consideration%3A+For+I+praying+to+God%2C+do+immediately%2C+from+the+nature+of+the+action%2C+honor+God%2C+though+no+good+should+either+redound+to+myself+or+to+the+creature%3B+thereby+it+is+true%2C+God%2C+by+acts+of+love+and+mercy+to+our+neighbor%2C+is+honored+two+ways%3A+1.+In+that+men+seeing+our+good+works+do+thence+take+occasion+to+glorify+our+heavenly+Father%2C+whose+truth+teaches+us+by+the+grace+of+God+to+do+these+works%2C+but+the+intrinsic+and+proper+use+of+these+is+to+do+good+to+ourselves%2C+as+in+works+of+sobriety%2C+and+to+our+neighbor%2C+as+in+works+of+righteous+dealing%2C+but+not+immediately%2C+and+in+the+first+and+primary+consideration+to+honor+God%2C+as+in+works+of+piety%2C+holiness+and+worship%2C+the+honoring+of+God+by+secondary+resultance%2C+does+issue+also+from+these+duties+of+righteousness%2C+but+not+as+from+the+acts+of+praying%2C+praising%2C+sacramental+eating%2C+drinking.+2.+The+doer+of+these+acts+of+mercy+may%2C+and+is+to+intend%2C+the+honoring+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+pp.+86-88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F94e44db38d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/94e44db38d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=Worship%20is%20an%20action%2C%20or%20performance%2C,to%20intend%2C%20the%20honoring%20of%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And these temporal circumstances, whether of evening or night-time, or of the sixth day of the week [i.e. Thursday night] or that particular day of the year (i.e., of the third day before Christ’s resurrection), and also of the place (i.e. a private place), do not have any force of prescribed necessity or of observance. Nor do the following facts have any force of being required or observed: that the supper was given to them after they had eaten a meal, after their feet had been washed, when they were lying at table, and even that there were twelve in number (some of which were observed for some time in the early church).</p></blockquote>

</figure><figure class="quote" id="q-6a58cb5668" data-kw="">
<blockquote><p>…judge now whether all the ill effects have come from one extreme [side of the parties, and not the other]. The truth is, having impartially observed the mischiefs of the age in which I have lived, I have found that both the extremes have been the chief causes and the peacemakers both the most understanding and the most innocent; and the nearer any of the several parties have come to them, the more innocent they have been. It is not mere episcopacy or liturgies that have done the mischief, for such excellent men as Cranmer, Ridley, Hooper, Farrar, Parker, Jewel, Grindal, Davenant, Ussher, etc. could use both profitably. It’s not mere presbytery, for such as Calvin, Beza, Daneau, Sadeel, Rivet, Chamier, Daille, Blondel have been excellent lights in the Church. It is not mere Independency, for Ramus, Ames, Henry Jacob, Jeremiah Burroughs and many others of that mind have been excellent, peaceable men. It is not mere Anabaptistry [baptists], for there have been many peaceable worthy men against infant baptism (and some bishops thought it not of divine institution); and when they were rebaptized, continued in love and communion with others. But it is proud ignorance and lack of Christian love causing excommunicating, persecuting, Separation or schism in some, and withdrawing censorious Separation in others, who (neither party) understand the truth nor ever loved their neighbors as themselves, nor learned to do as they would be done by. The worldly PR. IGs.¹ and the unruly PR. IGs. by persecution and by causeless Separation and alienation have done the hurt. ¹ [This may likely mean “Proud Ignorants”, as a contemporary critic of Baxter, who was unsure, so inferred… This is confirmed by Baxter’s anti-party spirit and morally adjudged perspective in the immediate context. Another option is “Presbyterians and Independents” as “G” may stand for “Gatherers”, as Independents were sometimes called; yet much of the persecution was done by bishops, prelates and Formalists, as Baxter notes, so this alternative seems less likely. Baxter though may have meant both, or left his meaning ambiguous so as not to be able to be blamed for it by the named parties (note that he was reckoned an Independent by some, though he called himself a presbyterian at times). It is not to be missed that the abbreviations spell “prigs”, which word was current in that era with its current meaning.]</p></blockquote>

<blockquote><p>This toleration of drunkards and swearers in the Lord’s Church and at his Table infects and is apt to leaven all with their evil conversation, but does not leaven the worship to the fellow-worshippers, nor is the sin of private persons, yea nor of our ministers, who have not power to help it (but it is the fault of the Church), except you make no separation from a Church where a scandalous person is tolerated (for suffering more or fewer does not vary the species) to be a sin publicly to be repented, before any can be members of your Church, which is prodigious to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644), pt. 2, ch. 4, section 5, pp. 193-94</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dfd7898b8f" data-kw="">
<blockquote><p>7. The seventh distinction (which is ordinary) is of the commandments into affirmative and negative… … 2. Though the positive commandment, or (the positive part of the commandment) be of alike force and authority with the negative, as to the obligation it lays on us to duty, yet it does not tie us to all occasions and times, as negatives do: Hence is that common maxim, that affirmative commands tie and oblige semper, ever, that is, they never want their authority, and we are never absolved from their obedience, but they do not oblige and tie ad semper, that is, in all differences of time we are not tied to the exercise of the duties enjoined; negatives again oblige both semper and ad semper, that is, always, and in all differences of time: For instance, in the Third Commandment, the affirmative part is to use the Lord’s Name, and ordinances holily and reverently in prayer, reading and hearing, etc. So in the Fourth Commandment we are required to sanctify the Sabbath, by waiting on ordinances, etc. This makes these still duties, so as to pray, hear, etc. are still duties, but we are not to be, and should not be always exercised in these duties, for we must abound in other duties also of necessity, and mercy, we must eat, and sleep, etc. and when we sleep, we can neither act love, nor fear. Again, the negative part is, not to profane the Lord’s Name in his ordinances; this may not be done at any time: The reason of the difference is this, because in affirmatives we are not always tied to the acts of duties and graces, but to the disposition and habit. Habits are a spiritual quality, a (vis) or power sitting and enabling for bringing forth these acts; and for the bringing them forth in the due time and season, when they shall be called for; but in sinful things we are prohibited, not only the habits, but the acts also: the one is always and ever a sin, but the other is not always called for as duty. If any desire rules to know when a duty is called for; as for instance, when we are to pray, hear, etc. it is hardly possible to be particular in this, yet we may try it by these generals: 1. Any affirmative precept binds to present practise, when the duty required tends to Gods glory, unto which every thing should be done (as 1 Cor. 10:31) and when the omission of the duty may dishonor him. 2. When it tends to others edification, and omitting will some way stumble and offend. 3. When some special providences meet and concur, to give opportunity for such a duty; as for instance, the giving of aims when we have it, and some indigent person offers, whose necessity calls for it, Gal. 6:10. So when secrecy for prayer is offered (and no other more necessary duty at that time is called for), which we are to watch unto, Col. 4:2, or when we meet with some special occasion or dispensation, pointing out to us this or that as a duty called for, such a providence invites us to the practice of that duty: for though providences will not make these things to become duties which are not duties, yet they will serve to time and circumstantiate duties that lie on us, by virtue of affirmative precepts. 4. Some special occasions and times are set down in the Word, as for praying morning and evening, for hearing the Word on Sabbath days; and in these, and other the like duties, the examples of the saints, so recorded for imitation in Scripture, would be observed as a copy and pattern. 5. When they have not such inconveniences with them, as cross and hinder other moral duties of edification, love, etc. for if they do that, they must yield and give place to these; but if no other duty be called for, then they ought to be done, for we should be in some duty. And though such duties be in themselves moral, suppose praying, hearing, and such others, which might be instanced, yet the timing of them, or going about them at such a time, and in such a manner, is not moral simply, but as these are by circumstances called for. 6. When without sin such a duty cannot be omitted; and although there be not any inward exercise of mind, or frame of spirit suitable thereto, yet the conscience calls for it, or there is some on special occasion or other that puts us to it. 3. Observe, that this rule of negatives tying ad semper, or obliging in all circumstances of time, is not to be understood, but where the matter is moral; therefore we would distinguish again betwixt negative morals, and negative positives, for positives, whether negative or affirmative, give still place to morals. As for instance, that part of the fourth Commandment is negative. In it (that is, on the seventh day) ‘Thou shalt do no manner of work,’ yet sometimes, when necessity calls for it, some manner of works is lawful on that day, because it is only a negative positive, and not a negative moral: And so David’s eating of Show-bread, was against a negative command, though not against a negative moral, but a negative positive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments</cite>, … (Glasgow, 1676), First Sermon, on the Preface of the Decalogue, Ex., 20:1-2</span></figcaption>

ing+and+enabling+for+bringing+forth+these+acts%3B+and+for+the+bringing+them+forth+in+the+due+time+and+season%2C+when+they+shall+be+called+for%3B+but+in+sinful+things+we+are+prohibited%2C+not+only+the+habits%2C+but+the+acts+also%3A+the+one+is+always+and+ever+a+sin%2C+but+the+other+is+not+always+called+for+as+duty.+If+any+desire+rules+to+know+when+a+duty+is+called+for%3B+as+for+instance%2C+when+we+are+to+pray%2C+hear%2C+etc.+it+is+hardly+possible+to+be+particular+in+this%2C+yet+we+may+try+it+by+these+generals%3A+1.+Any+affirmative+precept+binds+to+present+practise%2C+when+the+duty+required+tends+to+Gods+glory%2C+unto+which+every+thing+should+be+done+%28as+1+Cor.+10%3A31%29+and+when+the+omission+of+the+duty+may+dishonor+him.+2.+When+it+tends+to+others+edification%2C+and+omitting+will+some+way+stumble+and+offend.+3.+When+some+special+providences+meet+and+concur%2C+to+give+opportunity+for+such+a+duty%3B+as+for+instance%2C+the+giving+of+aims+when+we+have+it%2C+and+some+indigent+person+offers%2C+whose+necessity+calls+for+it%2C+Gal.+6%3A10.+So+when+secrecy+for+prayer+is+offered+%28and+no+other+more+necessary+duty+at+that+time+is+called+for%29%2C+which+we+are+to+watch+unto%2C+Col.+4%3A2%2C+or+when+we+meet+with+some+special+occasion+or+dispensation%2C+pointing+out+to+us+this+or+that+as+a+duty+called+for%2C+such+a+providence+invites+us+to+the+practice+of+that+duty%3A+for+though+providences+will+not+make+these+things+to+become+duties+which+are+not+duties%2C+yet+they+will+serve+to+time+and+circumstantiate+duties+that+lie+on+us%2C+by+virtue+of+affirmative+precepts.+4.+Some+special+occasions+and+times+are+set+down+in+the+Word%2C+as+for+praying+morning+and+evening%2C+for+hearing+the+Word+on+Sabbath+days%3B+and+in+these%2C+and+other+the+like+duties%2C+the+examples+of+the+saints%2C+so+recorded+for+imitation+in+Scripture%2C+would+be+observed+as+a+copy+and+pattern.+5.+When+they+have+not+such+inconveniences+with+them%2C+as+cross+and+hinder+other+moral+duties+of+edification%2C+love%2C+etc.+for+if+they+do+that%2C+they+must+yield+and+give+place+to+these%3B+but+if+no+other+duty+be+called+for%2C+then+they+ought+to+be+done%2C+for+we+should+be+in+some+duty.+And+though+such+duties+be+in+themselves+moral%2C+suppose+praying%2C+hearing%2C+and+such+others%2C+which+might+be+instanced%2C+yet+the+timing+of+them%2C+or+going+about+them+at+such+a+time%2C+and+in+such+a+manner%2C+is+not+moral+simply%2C+but+as+these+are+by+circumstances+called+for.+6.+When+without+sin+such+a+duty+cannot+be+omitted%3B+and+although+there+be+not+any+inward+exercise+of+mind%2C+or+frame+of+spirit+suitable+thereto%2C+yet+the+conscience+calls+for+it%2C+or+there+is+some+on+special+occasion+or+other+that+puts+us+to+it.+3.+Observe%2C+that+this+rule+of+negatives+tying+ad+semper%2C+or+obliging+in+all+circumstances+of+time%2C+is+not+to+be+understood%2C+but+where+the+matter+is+moral%3B+therefore+we+would+distinguish+again+betwixt+negative+morals%2C+and+negative+positives%2C+for+positives%2C+whether+negative+or+affirmative%2C+give+still+place+to+morals.+As+for+instance%2C+that+part+of+the+fourth+Commandment+is+negative.+In+it+%28that+is%2C+on+the+seventh+day%29+%E2%80%98Thou+shalt+do+no+manner+of+work%2C%E2%80%99+yet+sometimes%2C+when+necessity+calls+for+it%2C+some+manner+of+works+is+lawful+on+that+day%2C+because+it+is+only+a+negative+positive%2C+and+not+a+negative+moral%3A+And+so+David%E2%80%99s+eating+of+Show-bread%2C+was+against+a+negative+command%2C+though+not+against+a+negative+moral%2C+but+a+negative+positive.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+The+Law+Unsealed%3A+or%2C+a+Practical+Exposition+of+the+Ten+Commandments%E2%80%A6+%28Glasgow%2C+1676%29%2C+First+Sermon%2C+on+the+Preface+of+the+Decalogue%2C+Ex.%2C+20%3A1-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdfd7898b8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dfd7898b8f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relations-between-the-1s <blockquote><p>The apostle says, ‘If meat make my brother to offend, I will eat no flesh while the world standeth.’ (1 Cor. 8:13) Now put the case the apostle had been hindered from preaching the Gospel for his precise abstaining from those meats whereat his brother would be offended, would he in that case have eaten? Nay, he says peremptorily that whiles the world stands, he would not eat.</p></blockquote>

</figure><figure class="quote" id="q-7dc555aaa8" data-kw="">
<blockquote><p>Now besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us, signifies veneration or reverence, sitting at table signifies familiarity and fellowship. ‘For which of you,’ says our Master, ‘having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat.’ [Lk. 17:7] All these signs have their significations from nature. And if it be said that howbeit sitting at our common-tables be a sign natural, to signify familiarity amongst us, yet nature has not given such a signification to sitting at the Lord’s Table, I answer that sitting is a natural sign of familiarity at what table soever it be used. At the heavenly table in the Kingdome of Glory familiarly is expressed and signified by sitting, Mt. 8:11, ‘Many shall come from the east and west, and shall sit down with Abraham, etc.’ Much more then at the spiritual table in the Kingdom of Grace. The difference betwixt other common tables and the Lord’s Table can infer no more but that with great humility we ought to addresse ourselves unto it: yet still we are to make use of our familiarity with Christ ut tanquam in eodem toro accumbentes, as says Chrysostom. Wherefore we do not there so look to Christ in his princely throne and glorious majesty, exalted far above all principalities and powers, as to forget that He is our loving and kind banqueter, who has admitted us to that familiar fellowship with Him, which is signified by our sitting at his table.</p></blockquote>

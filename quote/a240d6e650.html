<blockquote><p>There must also an order be set down [by the magistrates] among the citizens, to avoid public assemblies, games, feasts, drinkings, marriages, dancings, fairs, schools, churches, and public baths; for… there is also no small danger of getting and scattering the infection. Wherefore, wise men give counsel that at such times we should very seldom come into great companies of men.</p></blockquote>

</figure><figure class="quote" id="q-305c9484c3" data-kw="">
<blockquote><p>Neither in this case ought the authority of certain worthy and most learned men to move us, who seem too indiscreetly for to deny that this care appertains unto the Magistrate, whose office (say they) it is not to rid men from diseases, but only to maintain the safety and peace of our life and goods. For it may even out of their own words be proved sufficiently, that albeit the magistrate ought not to cure the diseases of every several man, or preserve them from such as do not openly ravage, nor have common causes (for this is the proper duty of the physicians), yet when as they hold it to be belonging to their charge, by their service and authority to perform, that their subjects may live commodiously: who sees not that this commodiousness does also appertain unto the health of the body? Which thing he that believes not, the same has never seen how miserably all the duties of men are cumbered, the order of the churches, the exercises of godliness, the instruction of youth, the traffic of citizens, whereupon must needs ensue a most grievous destruction of particular persons, when the plague troubles a city or country. Wherefore, I appeal unto thyself, whosoever thou art that art of this opinion, that thou thinkest not it to be the duty of the Magistrate to preserve the commonwealth from diseases (and especially common diseases) do not such sicknesses seem unto thee to be numbered amongst other incommodities? And can men live together commodiously when as these diseases do rage? Doubtless this canst thou not affirm if ever thou hast had experience before what the plague is, or what it may work, where it once has prevailed? Why then, say I, doest thou think it a thing not appertaining unto the duty of the magistrate, to deliver men from such diseases, that is with public care to defend? I pray thee, hast thou not seen that which is usual in all well ordered commonwealths, how diligently in cities the Magistrate provides and stores up such things as serve for the use of war? How carefully he prepares weapons? How busily he retains garrisons set in a readiness? Especially when he is in fear of some hurt to ensue? and to what end? but that men should live commodiously. Wherefore are horses kept; ships built; walls repaired, trenches dug, towers set up and banks cast: but that the citizens should live more commodiously in safety against the invasions or assaults of the enemies? Dogs are maintained for the like cause, nets are pitched, hunters are hired and troops of country people draw together if at any time wolves or such like beasts do trouble a country. I remember in the kingdom of France that certain leopards, which the king uses to keep, did break out of ward, and in every place slew the countrymen. The whole country was mustered and neither cost nor labor spared until they had rid the land from that fear. How much more justly then in this calamity and misery also ought there some provident course to be taken whereby this so mighty an enemy and cruel beast may be kept away from our throats, which in a very short time is wont to ravage very far, and as it were a canker, eat up every thing that is next [to] it? To the end that the clean in the Old Testament should not keep company with the unclean lepers, by the authority of the Magistrate, there was made a separation, neither were they received among the other people before that they were by the priests appointed to this office, judged cleansed after they were viewed naked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 1, ch. 1, p. 4-5. von Ewich was a reformed German reformer, physician and city health official.</span></figcaption>

<blockquote><p>There has to be a system of government regulation, up to and including quarantine, in order to stop the spread of dangerous pathogens. These should be regarded as invaders. If a society has the right to create a military defense system against invading armies, then it has the right to do the same with respect to invading armies of pathogens. Only the civil government can do this. This cannot be done on a profit-seeking basis. This is not a matter for the free market to solve. The free market can solve certain issues, such as the development of anti-pathogen chemicals or techniques. There can be profit in this. But the taxpayer is going to have to provide the money that civil governments use to develop systematic pathogen defense strategies, and then implement these strategies. In terms of the total cost of government, these are minor expenditures. Societies have used them throughout history. Most people accept them. There is no well-organized opposition to their use. Compared to the massive expenditures of the modern state on projects that are clearly banned by the Bible, these exceptions do not constitute a threat to the freedom of covenant-keeping people. Furthermore, those free market economists who would deny any of these expenditures have not developed comprehensive monographs on how the free market could attain these goals. They are legitimate goals. Free-market economists need to come to grips with this fact: they cannot beat something with nothing.</p></blockquote>

l=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd9109a0038.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d9109a0038.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=There%20has%20to%20be%20a%20system,they%20cannot%20beat%20something%20with%20nothing&amp;text=There%20has%20to%20be%20a%20system%20of%20government&amp;text=this%20fact%3A%20they%20cannot%20beat%20something%20with%20nothing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>One of the best known and most esteemed of John Owen’s works. It is unnecessary to say that he is the prince of divines. to master his works is to be a profound theologian. Owen is said to be prolix, but it would be truer to say that he is condensed. His style is heavy because he gives notes of what he might have said, and passes on without fully developing the great thoughts of his capacious mind. He requires hard study, and none of us ought to grudge it.” – Spurgeon Allen, James – Serious Advice to delivered ones from sickness or any other dangers threatening death, how they ought to carry it that their mercies may be continued, and other misery prevented, or, The healed ones prophulacticon, or healthful diet, delivered in several sermons on John 5:14 (Boston, 1679) Allen (1632-1710) appears to have been a faithful, New England minister. Here are about 15 or so other works of his. Sibbes, Richard – ‘A Rescue from Death, with a Return of Praise’ Works, 6.133-57 on Ps. 107:17 ff. Mather, Cotton – ‘Mens Sana in Corpore Sano. A Discourse upon Recovery from Sickness. Directing how Natural Health, may be Improved into Spiritual: especially by them that have Lately Recovered it’ (Boston, 1698) . 1700’s Wadsworth, Benjamin – ‘Christian Advice to the Sick and Well. In Answer to these Questions:

I. What should Christians do, when under bodily sickness?

II. How should Christians in health, improve the sickness of others; and how should they carry it towards the sick?

III. How should Christians behave themselves, when recovered from sickness? And, None but the Righteous Saved: a Sermon on 1 Cor. 6:9’ Ref (Boston, 1714) Newton, John – Letter 36, ‘To a Gay [Merry] Friend, on his Recovery from Illness’ Works (London, 1808), vol. 1 (of 6), pp. 353-7 . . On Visiting the Sick, especially Church Officers Articles 1500’s Calvin, John – ‘Visitation of the Sick’ in Calvin’s Tracts: containing Treatises on the Sacraments… vol. 2, trans. Beveridge (Edinburgh, 1849), pp. 127-8 . 1600’s Westminster Assembly pp. 84-95 of Journal of the Proceedings of the Assembly of Divines… in The Whole Works of the Rev. John Lightfoot, vol. 13 This is on whether it is a function of the pastoral office to visit the sick. Taylor, Jeremy – ch. 5, ‘Of Visitation of the Sick’ in The Rules &amp; Exercises of Holy Dying: together with prayers &amp; acts of virtue to be used by sick and dying persons, or by others standing in their attendance; to which are added rules for the visitation of the sick &amp; offices proper for that ministry new ed. (Oxford: 1857), pp. 73-229 Taylor (1613-1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He is sometimes known as the “Shakespeare of Divines” for his poetic style of expression, and he is frequently cited as one of the greatest prose writers in the English language. Swinnock, George – ‘A Good Wish about the Visitation of the Sick’ in Works, 3:24-37 (d. 1673) This is a prayer that we, pastors specifically, may be more dutiful in visiting the sick, etc. Poole, Matthew – ‘How Ministers or Christian Friends may and ought to apply themselves to Sick Persons, for their Good, and the Discharge of their Own Conscience’ in Puritan Sermons, vol. 1 on Job 23:23-24 Stearne, John – The Curate’s Manual, with Reference to the Sick &amp; Dying, from the Latin of John Stearne, Vicar of Trim in the 17th Century, with Additions, Original &amp; Selected by the Rev. Kirby Trimmer… (1697; London, 1840) ToC Stearne (1660-1745) was an Anglican bishop. His original work was Tractatus de Visitatione Infirmorum (Dublin, 1697; London, 1700, several editions). . 1800’s Ely, Ezra Stiles – Visits of Mercy, being the Journal of the Stated Preacher to the Hospital and Alms House in the City of New York, 1811, vols. 1, 2 (New York, 1813) Ely (1786-1861) was an American presbyterian minister during the Second Great Awakening. Wells, John D. – The Pastor in the Sick-Room, Three Lectures delivered at Princeton Theological Seminary, March, 1892 (Philadelphia: Pres. Board of Publication, 1893) 130 pp. Wells (1815-1903) was a graduate of Old Princeton in 1844 and learned “at the feet of Dr. Archibald Alexander, Dr. Samuel Miller, Dr. Charles Hodge and Dr. Joseph Addison Alexander, all of blessed memory.</p></blockquote>

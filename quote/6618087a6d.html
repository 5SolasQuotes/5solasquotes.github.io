<main class="wrap"><figure class="quote" id="q-6618087a6d" data-kw="">
<blockquote><p>And yet Holy Scripture is not so tied to those [original] languages that it cannot, and also ought not, be translated into other languages for the common use of the church. Likewise, all versions in those languages are considered authentic to the extent that they express the sources, according to which they must always be measured.

For this reason, the providence of God was always so illustrious and praiseworthy in preserving the sources, not only that they might not completely pass away but also that they might not be mutilated by the loss of any of the books, or that they might be deformed by any grave defect, while in the meantime not even one of the more ancient translations has come down to us whole and intact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.2, XI, p. 124.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-47ac56c75b" data-kw="perspicuity">
<blockquote><p>The question is not whether things essential to salvation are everywhere in the Scriptures perspicuously revealed. We acknowledge that there are some things hard to be understood (dysnoēta) and intended by God to exercise our attention and mental powers. The question is whether things essential to salvation are anywhere revealed, at least so that the believer can by close meditation ascertain their truth (because nothing can be drawn out of the more obscure passages which may not be found elsewhere in the plainest terms). As Augustine remarks: “Admirable and healthily the Spirit has so arranged the Scriptures that by the plainer passages he might meet our desires and by the obscurer remove our contempt” (CI 2.6 [FC 2:66; PL 34.39]); and, “We feed in the open places, we are exercised by the obscure; there hunger is driven away, here contempt” (Sermon 71, “De Verbis Domini,” 7.11 [PL 38.450]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-93620a8346" data-kw="">
<blockquote><p>Vers. 7. But we speak the wisdom of God in a mystery, even the hidden wisdom which God ordained, before the world, unto our glory.

The other part of the Comparison; The Wisdom of the Gospel, is the wisdom of the Living and Eternal God, because it was wisely contrived of God, and because in it the wonderful Wisdom of God is revealed, touching the Salvation and Redemption of men.

In a mystery] Comparison 4. Human Philosophy is common and obvious to every one that is indued with the gifts of Nature; but the Wisdom of the Gospel is a Mystery, or hidden wisdom, because it is not understood by natural reason, as Human Philosophy, but by Supernatural Revelation.

Before the world] Comparison 5. In the antiquity of it, the Wisdom of the Gospel is not of yesterday, but ordained of God before the world: But Human Philosophy is an invention lately found out, and not yet perfected or finished.

Glory] Comparison 6. The Wisdom of the Gospel appertains to Glory and Salvation, especially of us who live under grace: But Human Wisdom, compared with this, appertains not to salvation, but vain speculation.

Vers. 8. Which none of the Princes of this world knew: for had they known it, they would not have crucified the Lord of Glory.

Comparison 7. Human Wisdom may consist with the not knowing of Christ, but Divine Wisdom cannot. This comparison is confirmed by experience, because the chief heads of the Jews, and the Rulers of the Gentiles, (who in respect to their wisdom, seemed to get a name in the world) understood nothing of the Wisdom of the Gospel, which he proves by this instance, because had they known any thing of the Gospel, they had either out of reverence to the Divine Power, or out of fear been wary of Crucifying the Lord of Glory so ignominiously.

Vers. 9. But as it is written, Eye hath not seen, nor ear heard, neither hath entered into the heart of man, the things which God hath prepared for them that love him.

Comparison 8. By which he confirms and illustrates the fourth and sixth comparison: The object of Human Wisdom, is apprehended by the external senses, and the understanding, or the natural light of reason; but the object of that Wisdom which is unfolded in the Gospel, containing those things which Christ hath procured for us, (to be enjoyed in this present, and in the world to come) cannot be apprehended, either by the outward senses, or the understanding, founded in sensible things, or by the discourse of reason, without revelation, because the knowledge of it, (as Isaiah speaks, Chap. 64.4.) cannot come into the heart of man naturally. From all the parts of this comparison arises

Argum. 6. The Wisdom of the Gospel, which the plain way of preaching it, best opens, far excels all human wisdom, which only the wisdom of words (used for preaching) opens, and that with obscuring the wisdom of the Gospel: Therefore the preaching of the Gospel in simplicity, is for the best. The sum of all is, plainness of speech shews to the hearers the depth of the wisdom of God; but wisdome of words, shews how learned the Preacher is in human wisdome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 42.</span></figcaption>

<blockquote><p>The purpose of this paper is to explain Descartes’ views on Metaphysics. It is my thesis that one of the ways in which he influenced not only modern philosophy, but the way in which we do philosophy even today, is by turning metaphysical inquiry into an epistemological enterprise. That is to say, he made the critique of knowledge necessary prior to any consideration of existence, and what may or may not have it… I will attempt to show that Descartes’ view of Metaphysics, in spite of the fact that he used familiar scholastic metaphysical terminology, actually turned Metaphysics into what is today termed Epistemology. Descartes, not Kant, was the first to perform a true critique of knowledge, and to make that critique a necessary preliminary to all questions about what exists outside our minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Epistemological Metaphysics’</cite></span></figcaption>

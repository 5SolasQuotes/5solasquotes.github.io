<main class="wrap"><figure class="quote" id="q-a00299d99b" data-kw="">
<blockquote><p>Espouse sober principles; for men are, as their principles are. In these avoid extremes; and in the less weighty matters of the law, keep the mean, that you may reserve your zeal for the great things of God, the things that belong to your everlasting peace. Take heed on the one hand of bigotry in the circumstantials of religion, and on the other hand of lukewarmness and indifferency in the essentials of it.

Fix such principles as these to yourselves with reference to the main matter:—that God’s favour is better than life, and his displeasure worse than death; that sin is the greatest evil; that the soul is the man, and that is best for us that is best for our souls; that Jesus Christ is all in all to us, and we are undone without an interest in him; that it is as much our wisdom, as it is our duty, to be religious; that the world has not that in it, which will make us happy; that time, and the things of time, are nothing in comparison with eternity, and the things of eternity.

These, and such as these, are principles of eternal truth, and our firm belief of them, and adherence to them, will be to us of eternal consequence. And as to other things, let your principle be, that “God is no respecter of persons, but in every nation, he that fears God, and works righteousness, is accepted of him;” and therefore ought to be so of us: “that the kingdom of God is not meat and drink, but righteousness and peace, and joy in the Holy Ghost; and he that in these things serveth Christ, is acceptable to God, and approved of men.” By such principles as these, keep up moderation and sober-mindedness in your profession of religion, which will contribute much to the promoting of it in everything else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober-Mindedness Pressed upon Young People, in a Discourse on Titus II.6</cite>, (1712) in The Complete Works of the Rev. Matthew Henry; Being a Collection of all his Treatises, Sermons, and Tracts, as Published by Himself: And a Memoir of his Life (2 vols, Edinburgh: A. Fullarton and Co., 1853), 1: 80-81.</span></figcaption>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>

</figure><figure class="quote" id="q-d897e7cab1" data-kw="">
<blockquote><p>We are told by hymnologers that there is no mention in such psalms of the “sweet name of Jesus.” But is there in the hymns in question? But what Christian minister what Christian elder, nay, what Christian child, who has had a godly father or mother, does not know who the Refuge of the believer is? Does any soul ever sing such a psalm without rejoicing in that name as “ointment poured forth,” as the way into this Refuge, and in the Holy Spirit, who, in God’s infinite grace, has guided him into it? It is very shallow piety indeed that needs all this to be put in words in a song of praise.

It is not the nature of truly lifting up of the soul to God in trust, and hope, and joy, to do it in the details of a doctrinal and theological discussion, whether in thanksgiving, in penitence, or prayer. So the psalms express the essence of them all. What Christian congregation in this land does not know the Redeemer, the name of Jesus, and the Holy Spirit? Did David not know it when he sang Psalm Ixxxviii. 1 — “Lord God, my Saviour,” (my Jesus) “day and night, Before thee cried have I,”- etc.

Nay, did Abraham not know it when he “saw his day afar off, and was glad”? Our Lord himself hath amply taught us, both personally, and by His inspired apostles, that they did; and are we not to know it when we sing Psalms il., xvi., xxii., xxiii., xlv., cx., cxviii., and many others?

To sing these psalms with our gospel light, is to enjoy the communion of saints from the beginning of the church on earth even until now — a communion in praise, at least, which sectarian hymns from their very nature completely destroy, and raise the spirit of controversy rather than kindle the lofty flame of pure devotion. Who does not know what is the child’s true hymn — “The Lord’s my Shepherd?” What child does not know who He was — the great and the good Shepherd, who giveth His life for the sheep, and who “carrieth the lambs in His bosom;” and who said, “Suffer the little children to come unto me”?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We are told by hymnologers that there is no mention in such psalms of the “sweet name of Jesus.” But is there in the hymns in question? But what Christian minister what Christian elder, nay, what Christian child, who has had a godly father or mother, does not know who the Refuge of the believer is? Does any soul ever sing such a psalm without rejoicing in that name as “ointment poured forth,” as the way into this Refuge, and in the Holy Spirit, who, in God’s infinite grace, has guided him into it? It is very shallow piety indeed that needs all this to be put in words in a song of praise.

It is not the nature of truly lifting up of the soul to God in trust, and hope, and joy, to do it in the details of a doctrinal and theological discussion, whether in thanksgiving, in penitence, or prayer. So the psalms express the essence of them all. What Christian congregation in this land does not know the Redeemer, the name of Jesus, and the Holy Spirit? Did David not know it when he sang Psalm Ixxxviii. 1 — “Lord God, my Saviour,” (my Jesus) “day and night, Before thee cried have I,”- etc.

Nay, did Abraham not know it when he “saw his day afar off, and was glad”? Our Lord himself hath amply taught us, both personally, and by His inspired apostles, that they did; and are we not to know it when we sing Psalms il., xvi., xxii., xxiii., xlv., cx., cxviii., and many others?

To sing these psalms with our gospel light, is to enjoy the communion of saints from the beginning of the church on earth even until now — a communion in praise, at least, which sectarian hymns from their very nature completely destroy, and raise the spirit of controversy rather than kindle the lofty flame of pure devotion. Who does not know what is the child’s true hymn — “The Lord’s my Shepherd?” What child does not know who He was — the great and the good Shepherd, who giveth His life for the sheep, and who “carrieth the lambs in His bosom;” and who said, “Suffer the little children to come unto me”?”

<blockquote><p>Object. 1. It will be said, We are prohibited by the Magistrate.

Sol. 1. Was not this the Apostles case again and again? were not they commanded, yea strictly charged, not to preach any more? But did they give over? Why should not we answer with them, It is better to obey God than man? Doth God charge us so deeply, so dreadfully, and shall we think our selves discharged if man contradict it?

If the Magistrate should be thought indeed to have such a power of Dispensations, will not here be a fine easy way for idle Drones to shift the Yoke, and leave the Plow? for ‘twil but be to get an Order from above for not Preaching; and then when the Chief Shepherd shall appear, to pluck out his Indulgence, and no more can be said. But we fear God will not be so put off. Are not God’s forbidden Messengers, yet charged by Him to speak without fear, and that under a dreadful penalty, and shall we fear man’s wrath for preaching, more than God’s WO if we preach not?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-alleine.html">Joseph Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A call to Archippus, or, An humble and earnest motion to some ejected ministers (by way of letter). To take heed to their ministry, that they fulfil it</cite>, ([London], 1664), p. 20.</span></figcaption>

<blockquote><p>I might trace a little the time of faith’s first infusion and first operation in the heart, which is undoubtedly at the new birth, when ever it is. But how to prescribe, and when precisely to determine that, in the soul of a believer is more difficult than to state the quickening or animation of an embryo in the womb of her that is with child, or for any naturallist so set the moment of the first separation of night from day at the initiating crepusculum or ascent of the first atom of the morning rays of the sun’s body, or the primogenial fermentation of the vegetative soul in the seed-corn in the earth… It’s much more difficult to set down the first punctual workings of the Spirit in our hearts.</p></blockquote>

<blockquote><p>The second cause [for marriage] is to avoid fornication. This Paul signifieth when he saith, ‘For the avoiding of fornication, let every man have his own wife,’ 1 Cor. vii. 8. He saith not for avoiding of adultery, but for avoiding of fornication, showing that fornication is unlawful, too, which the papists make lawful, in maintaining their stews [brothels], as a stage for fornicators to play upon, and a sanctuary to defend them; like Absalom’s tent, which was spread upon the top of the house, that all Israel might see how he defiled his father’s concubines, 2 Sam. xvi. 22.

For this cause Malachi saith that God did create but one woman for the man. He had power to create more, but to show that he would have him to stick to one, therefore he created of one rib but one wife for one husband, Mal. ii. 15. And in the ark there were no more women than men, but four wives for four husbands, although it was otherwise in the beginning of the world, when many wives might seem necessary to multiply mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 9.</span></figcaption>

<blockquote><p>When answering the objection that Christian magistrates were not bound to enforce the Old Testament’s laws against idolatry because they were not Jews, John Knox pointed out that the commandments given under Moses remained valid for civil rulers in the new covenant era:

For it is a thing more certain that whatsoever God required of the civil magistrate in Israel or Judah concerning the observation of true religion during the time of the Law, the same doth he require of lawful magistrates professing Christ Jesus in the time of the Gospel, as the Holy Ghost hath taught us by the mouth of David, saying (Psalm 2): ‘Be learned, you that judge the earth, kiss the Son, lest that the Lord wax angry and that ye perish from the way.’ This admonition did not extend to the judges under the Law only, but doth also include such as be promoted to honours in the time of the Gospel, when Christ Jesus doth reign and fight in His spiritual kingdom, whose enemies in that Psalm be most sharply taxed, their fury expressed and vanity mocked. And then are kings and judges, who think themselves free from all law and obedience, commanded to repent their former blind rage, and judges are charged to be learned. And last are all commanded to serve the Eternal in fear, to rejoice before Him in trembling, to kiss the Son, that is, to give unto Him most humble obedience. Whereof it is evident that the rulers, magistrates and judges now in Christ’s kingdom are no less bound to obedience unto God than were those under the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The appellation of John Knox from the cruel and most injust sentence pronounced against him by the false bishops and clergy of Scotland, with his supplication and exhortation to the nobility, estates and commonality of the same realm</cite>, (Geneva, 1558) in idem, On rebellion, ed. R. A. Mason (Cambridge, 1994), pp 91-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

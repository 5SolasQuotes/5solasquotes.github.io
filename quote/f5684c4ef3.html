<main class="wrap"><figure class="quote" id="q-f5684c4ef3" data-kw="">
<blockquote><p>She once of her own accord spake of her unsuccessfulness, in that she could not find God, or to that purpose. But on Thursday, the last day of July, about the middle of the day, the child being in the closet, where it used to retire, its mother heard it speaking aloud; which was unusual, and never had been observed before. And her voice seemed to be as of one exceedingly importunate and engaged; but her mother could distinctly hear only these words, spoken in a childish manner, but with extraordinary earnestness, and out of distress of soul, pray, blessed Lord, give me salvation! I pray, beg, pardon all my sins! When the child had done prayer, she came out of the closet, sat down by her mother, and cried out aloud. Her mother very earnestly asked her several times what the matter was, before she would make any answer; but she continued crying, and writhing her body to and fro, like one in anguish of spirit. Her mother then asked her, whether she was afraid that God would not give her salvation. She then answered, Yes, I am afraid I shall go to hell! Her mother then endeavored to quiet her, and told her she would not have her cry, she must be a good girl, and pray every day, and she hoped God would give her salvation. But this did not quiet her at all; she continued thus earnestly crying, and taking on for some time, till at length she suddenly ceased crying, and began to smile, and presently said with a smiling countenance, Mother, the kingdom of heaven is come to me! Her mother was surprised at the sudden alteration, and at the speech; and knew not what to make of it; but at first said nothing to her. The child presently spake again, and said, There is another come to me, and there is another, there is three; and being asked what she meant, she answered, One is, Thy will be done, and there is another, Enjoy Him for ever; by which it seems, that when the child said, There is three come to me; she meant three passages of her catechism that came to her mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Conversion of Phebe Bartlet”</cite>, (1740–42)</span></figcaption>

</figure><figure class="quote" id="q-90f0823318" data-kw="">
<blockquote><p>Relationships and behaviors are manipulated by very powerful unspoken rules. These rules are seldom, if ever, said out loud. In fact, when spoken out loud many of them sound ridiculous. No one says out loud, ‘What people think about us is more important than what is really happening.’ Yet the unspoken rules communicate these and other shaming messages. The ‘can’t-talk’ rule keeps people quiet by labeling them as the problem if they notice and confront a problem. Because people feel they cannot talk about an unspoken rule, they learn to talk in ‘code’ to convey what they mean. Coding is an example of verbal manipulation… Messages are sent through a verbal code that others are supposed to decode… ‘Don’t you think it would be better this way?’ means, ‘I want you to do it this way.’ People also code non-verbally with body language–by giving dirty looks, becoming loud or quiet, or leaving the room in a sullen or disconnected attitude. Triangling is another way to act manipulative in relationships. This simply means to send a message to someone through another person instead of delivering it directly. The effects [are]: Great ‘radar’–the ability to pick up tensions in situations and relationships; ability to decode the crooked messages of others; saying things in code instead of saying them straight; talking about people instead of to them; message-carrying for people; expecting others to know your code; difficulty trusting people; reading other meanings into what people say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/unwritten-rules.html">Unwritten Rules</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johnson and VanVonderen write in The Subtle Power of Spiritual Abuse</cite>, pp. 56-57:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>There was a certain man in Caesarea called Cornelius… A devout man, and one that feared God with all his house, which gave much alms to the people, and prayed to God alway… And he said unto him, ‘Thy prayers and thine alms are come up for a memorial before God… And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped him. But Peter took him up, saying, ‘Stand up; I myself also am a man.’… ‘…Now therefore are we all here present before God, to hear all things that are commanded thee of God.’ Then Peter opened his mouth, and said, ‘Of a truth I perceive that God is no respecter of persons: But in every nation he that feareth Him, and worketh righteousness, is accepted with Him….’ While Peter yet spake these words, the Holy Ghost fell on all them which heard the word.</p></blockquote>

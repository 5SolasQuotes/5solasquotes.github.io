<blockquote><p>The relation of the law to the Gospel is one of the most important questions of theology. To misunderstand it, is to misunderstand the whole theory of the Divine government, and the whole plan of redemption. It needs not to add that it is, in a very marked and special sense, one of the questions of the day.

Views regarding it have been recently, and ostentatiously promulgated, which cut far deeper into the foundations of both morality and religion, than is at all perceived by multitudes of those who favourably listen to them, or even by some of those who adopt and teach them. …

In bringing out the relation of the law to the mission and work of Christ, the first thing to which attention must be turned, is the great and fundamental fact, that it was the existence of the law, and the necessity which had arisen for upholding it in all its integrity and honour, which brought Christ into this world. As saith the Apostle Paul, “Where no law is, there is no transgression.” In the absence of law there could have been no sinner, and, therefore, no saviour. The proper and scriptural definition of sin is this, — “it is the transgression of the law.” The object of law is to express the will and to assert the authority of the Ruler. The law declares this to be right and that to be wrong — this to be duty and that to be disobedience — this to be required and that to be forbidden.

Where no law is, therefore, it follows of necessity that there is, and can be, no such thing as sin; for, as already has been said, — “sin is the transgression of the law.” It is a contempt of the authority and disregard of the will of God. But that will cannot be disregarded where there is no law to express it; and that authority cannot be contemned, where there is no law to assert it. The fact that law did not begin, for the first time, to exist in this world when it was given on the two tables of stone to the people of Israel, was made conclusively manifest from this, — that there was sin in the world for ages before.

Sin, as Paul tells us (Rom. v. 12), “is not imputed” — is not held to exist; that is, “where there is no law.” But as death, which is the wages of sin, reigned universally among men, “from Adam to Moses,” the conclusion is inevitable that law existed, and was in full force all the while. And I again repeat, it was the existence of this law, as a law, which man had broken, and under whose awful curse and penalty he had consequently fallen, which created the necessity for Christ’s coming into the world, if man was to be saved.

It is this very truth which is explicitly proclaimed in those well-known words of the Epistle to the Galatians (iv. 4-5), “When the fulness of the time was come, God sent forth His Son, made of a woman, made under the law, to redeem them that were under the law” (or more strictly and literally “those under the law;” those, that is, that were, and those that are and those that are to be, under the law), “that we might receive the adoption of sons.”

In His pre-existent state, as the eternal and only begotten Son of God, Christ was not under the law. He was then in the form of God, and thought it not robbery to be equal with God. As such, He was not a member or subject of the kingdom of Heaven, but its Sovereign Head and Lord. He possessed, indeed, in that condition, the most absolute and perfect holiness; but it was not the holiness which consists in obedience. The law which is holy, and the commandment which is holy, and just, and good, was conformed to Him; not He to the law. His holiness was exercised as the lawgiver, in making the law, and in governing the world by it.

But in undertaking, and entering on the blessed mission which brought Him down from heaven to earth, He “took upon Him the form of a servant, and was made in the likeness of men.” (Phil. ii. 7). By so doing, He placed himself “under the law;” the very law to which those were subject, whom He had come to redeem. Had they — that is, the human race — kept that law, His interposition in their behalf would not have been required. The law itself would have secured them eternal life. But having broken that law, they had both forfeited the rewards of obedience, and incurred the tremendous penalty of transgression. It was in this extremity that Christ came to seek and to save that which was lost: and this He did, by meeting, in the room and stead of His people — and as their substitute and surety — all the law’s demands.

We have thus seen, as the first result of our inquiry into the subject before us, that the law stands, to the mission and work of Christ, in a relation of the closest and most fundamental kind. Take away the law, and you take away the gospel; for, in taking away the law, you take away the only adequate ground, or necessity, for such a work as Christ came into this world to accomplish.</p></blockquote>

<blockquote><p>When we pursue worldly wealth or worldly reputation with more vehemence than the riches of grace or the favor of God; when we have a foolish imagination that our happiness consists in them, we prefer earth before heaven, broken cisterns that can hold no water before an ever-springing fountain of glory and bliss, and, as though there were a defect in God, cannot be content with him as our portion without an addition of something inferior to him; when we make it our hopes to say to the wedge, “You are my confidence,” and rejoice more because it is great and because our hand has gotten much than in the privilege of communion with God and the promise of an everlasting fruition of him (Job 31:24–25)—this is so gross that Job joins it with the idolatry of the sun and moon.… And the apostle, when he mentions covetousness or covetous men, passes it not over without the title of idolatry to the vice and idolater to the person (Col. 3:5), in that it is a preferring of clay and dirt as an end more desirable than the original of all goodness, in regard of affection and dependence.</p></blockquote>

<blockquote><p>For the reason why the law inculcates all these precepts is, that when a man has failed in fulfilling them, he may not be swollen with pride, and so exalt himself, but may in very weariness betake himself to grace. Thus the law fulfils its office as “schoolmaster,” so terrifying the man as “to lead him to Christ,” to give Him his love.</p></blockquote>

— Augustine of Hippo, A Treatise Concerning Man’s Perfection in Righteousness: Addressed to Eutropius and Paulus, (415) in NPNF1, 5: 162.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+reason+why+the+law+inculcates+all+these+precepts+is%2C+that+when+a+man+has+failed+in+fulfilling+them%2C+he+may+not+be+swollen+with+pride%2C+and+so+exalt+himself%2C+but+may+in+very+weariness+betake+himself+to+grace.+Thus+the+law+fulfils+its+office+as+%E2%80%9Cschoolmaster%2C%E2%80%9D+so+terrifying+the+man+as+%E2%80%9Cto+lead+him+to+Christ%2C%E2%80%9D+to+give+Him+his+love.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+A+Treatise+Concerning+Man%E2%80%99s+Perfection+in+Righteousness%3A+Addressed+to+Eutropius+and+Paulus%2C+%28415%29+in+NPNF1%2C+5%3A+162.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F55e1ecd4fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55e1ecd4fb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/07/augustine-of-hippo-on-the-pedagogical-use-of-the-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-6b796f8cf5" data-kw="">
<blockquote><p>That which we most love we worship as our God; for love is an act of soul-worship.… This is undoubtedly true, if we intend hereby that love which is superlative and transcendent; for to be loved above all things is an act of honour, worship, which the Lord challenges as his due in peculiar, Deut. 6:5.… Other things may be loved, but he will be loved above all other things.… He looks upon us as not worshipping him at all, not taking him for a God, when we love other things more, or as much as himself, 1 John 2:15.… Those that love their riches, the things of the world, more than, or equally with, God, they make these their gods.… Love, whenever it is inordinate, it is an idolatrous affection.… That which we most trust we make our god; for confidence and dependence is an act of worship which the Lord calls for as due only to himself.… Trust in the creature is always idolatrous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (love and trust as soul worship)</span></figcaption>

<blockquote><p>The law was once our foe when it came to our justification. But now the law is our friend when it comes to our sanctification.</p></blockquote>

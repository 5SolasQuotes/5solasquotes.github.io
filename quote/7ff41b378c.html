<main class="wrap"><figure class="quote" id="q-7ff41b378c" data-kw="">
<blockquote><p>XIV. The law, which God in this manner published, consists of ten words or commandments, Exod. 34:28, Deut. 4:13. Wherefore the Greeks also called it δεκάλογος, the decalogue. Moreover the contents of those ten words are various. 1st, There is the prescription of certain duties; and in this, the nature of a law, as such, properly consists. 2dly, The threatening of divine vengeance against the transgressors thereof, as in the second and third commandments; and this is the sanction of the covenant of works, from which all threatenings are derived, as we explained at large, book iii. chap. i sect. 22. 3dly, The proposal of divine grace and favour; and as this is made to sinners, and that under a condition, not of perfect, but of sincere obedience, so far it flows from the covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, 2.175</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-91a5d408e3" data-kw="">
<blockquote><p>The Word is differentiated into law and gospel. The law finds its end in Christ, who sets believers free from the curse of the law so that they may walk according to the Spirit and delight in God’s law in their inner selves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 1 (Grand Rapids, MI: Baker Academic, 2003), 441.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Word is differentiated into law and gospel. The law finds its end in Christ, who sets believers free from the curse of the law so that they may walk according to the Spirit and delight in God’s law in their inner selves.”

— Herman Bavinck, Reformed Dogmatics: Prolegomena, vol. 1 (Grand Rapids, MI: Baker Academic, 2003), 441.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Word+is+differentiated+into+law+and+gospel.+The+law+finds+its+end+in+Christ%2C+who+sets+believers+free+from+the+curse+of+the+law+so+that+they+may+walk+according+to+the+Spirit+and+delight+in+God%E2%80%99s+law+in+their+inner+selves.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+Prolegomena%2C+vol.+1+%28Grand+Rapids%2C+MI%3A+Baker+Academic%2C+2003%29%2C+441.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F91a5d408e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91a5d408e3.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/07/bavinck-distinguished-between-law-and-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ab91f47669" data-kw="">
<blockquote><p>There be some which divide the holy Scriptures into four parts, and describe some books as well of the Old Testament as of the New to laws, some to histories, some to prophecies, and other some again to wisdom. But it is not meet to divide the books of the holy Scriptures from one another, because that in the books of Exodus, Leviticus, Numbers, and Deuteronomy, in which they appoint laws to be contained, are found almost as many histories as laws. Besides that in the books which they assign to prophets, laws of living uprightly are sometimes written and clearly expounded. Neither can we properly separate the books of Solomon and other of the kind (which they will have proper to wisdom) from laws and prophecies. For there are in them sentences here and there written, which serving for the instruction of life, have also without controversy the nature of laws. Further for the that in them are very many secrets opened unto the church by the inspiration of the Spirit of God, they pour undoubtedly into the attentive hearers, oracles of things to come, It may easily be granted, that all these things which they make mention of, are found in the holy books: I mean the precepts of living, notable histories, prophecies of things to come, and also most wise sentences and sayings: but in such […], that in manner in every book they are set forth unto us dispersedly, neither yet would I that these holy books should be divided from one another by these ends and limits. I would rather think as the learned […] do also judge, that whatsoever things are contained in the holy scriptures should be referred unto to principal heads, the law I mean and the gospel. For everywhere are declared unto us either the precepts of God of upright living, as when we are reproved to have strayed from them by reason of weakness or else of malice, gospel is lay forth before us, wherein by Christ that thing wherein we have offended is pardoned and the strength and power of the Holy Spirit promises us, to restore us again to the image of God, which we had lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Master Peter Martyr Vermigli upon the Book of Judges</cite>, ….(London, 1564), fol. 1.. Spelling modernized.</span></figcaption>

</figure><figure class="quote" id="q-af9d98cc39" data-kw="">
<blockquote><p>Objection: But does not the apostle say, Rom. 6:14. ‘Ye are not under the law but under grace?’ and Gal. 5:22, 23. ‘But the fruit of the Spirit is love, joy, peace, &amp;c.—against such there is no law?’ Answer: Believers are not under the law as a covenant of works, to be either justified or condemned thereby. For the apostle says, ‘Christ hath redeemed us from the curse of the law, being made a curse for us,’ Gal. 3:13; and that there is no condemnation to them which are in Christ Jesus.’ They are neither under the commanding nor the condemning power of that law, seeing Christ has given perfect obedience to it as a covenant of works, so that under that character it can have nothing to demand of them; and has fully satisfied all its demands in point of punishment, having suffered the very penalty threatened therein. So that as a covenant of works they are entirely delivered from it. And as to the fruits of the Spirit in them, they are the product of the Spirit, agreeable to the will and law of God; and no law can be against them, seeing they are agreeable to the very letter and spirit thereof. But believers are still under the law as a rule of life, according to which they are to regulate their hearts and lives. It is the pole star that must direct their course to heaven, and is of singular use to provoke and excite them to gratitude to Christ, who hath perfectly fulfilled it in their room and stead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Thomas Boston: An Illustration of the Doctrines of the Christian Religion</cite>, Part 2, ed. Samuel M‘Millan, vol. 2 (Aberdeen: George and Robert King, 1848), 64.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

%28Aberdeen%3A+George+and+Robert+King%2C+1848%29%2C+64.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf9d98cc39.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af9d98cc39.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/02/boston-believers-are-not-under-the-moral-law-as-a-covenant-of-works-but-as-a-rule-of-life/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-fb6074cb57" data-kw="">
<blockquote><p>If awakened sinners are ignorant of the leading points of difference between the law and the gospel, this will discourage them much from attempting to come to Christ for salvation. If they cannot distinguish aright between the law and the gospel, they will mingle the works of the one with the grace of the other, and the consequence will be that they will form confused, false, and discouraging notions of the compassionate Savior. And so instead of being drawn to Him, they will be deterred from trusting in Him for salvation. They will allow themselves to apprehend that they must have something to bring with them to the Savior in order to recommend them to Him, some good qualifications to entitle them to His favor. Although it is declared in the gospel that all things are already given to Christ by the Father, yet when the thoughts of convinced sinners about the law and the gospel are indistinct, they imagine that they must still have something of their own to bring and present to Him. They conceive that they must, in some measure, have that which is commanded in the law before they can have a right to receive that which is offered in the gospel or that they must have those holy dispositions to bring to Christ which He only can bestow and for which they ought as sinners to come to Him. Thus, having the righteousness required of them in the law, and not the infinitely perfect righteousness freely offered to them in the gospel, before their eyes, their consciences are brought into trouble and perplexity; and instead of coming as sinners to Christ for righteousness and strength, they are ready to harden themselves in despair of His mercy and in aversion from Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 130.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“If awakened sinners are ignorant of the leading points of difference between the law and the gospel, this will discourage them much from attempting to come to Christ for salvation. If they cannot distinguish aright between the law and the gospel, they will mingle the works of the one with the grace of the other, and the consequence will be that they will form confused, false, and discouraging notions of the compassionate Savior. And so instead of being drawn to Him, they will be deterred from trusting in Him for salvation. They will allow themselves to apprehend that they must have something to bring with them to the Savior in order to recommend them to Him, some good qualifications to entitle them to His favor. Although it is declared in the gospel that all things are already given to Christ by the Father, yet when the thoughts of convinced sinners about the law and the gospel are indistinct, they imagine that they must still have something of their own to bring and present to Him. They conceive that they must, in some measure, have that which is commanded in the law before they can have a right to receive that which is offered in the gospel or that they must have those holy dispositions to bring to Christ which He only can bestow and for which they ought as sinners to come to Him. Thus, having the righteousness required of them in the law, and not the infinitely perfect righteousness freely offered to them in the gospel, before their eyes, their consciences are brought into trouble and perplexity; and instead of coming as sinners to Christ for righteousness and strength, they are ready to harden themselves in despair of His mercy and in aversion from Him.”

— John Colquhoun, A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 130.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+awakened+sinners+are+ignorant+of+the+leading+points+of+difference+between+the+law+and+the+gospel%2C+this+will+discourage+them+much+from+attempting+to+come+to+Christ+for+salvation.+If+they+cannot+distinguish+aright+between+the+law+and+the+gospel%2C+they+will+mingle+the+works+of+the+one+with+the+grace+of+the+other%2C+and+the+consequence+will+be+that+they+will+form+confused%2C+false%2C+and+discouraging+notions+of+the+compassionate+Savior.+And+so+instead+of+being+drawn+to+Him%2C+they+will+be+deterred+from+trusting+in+Him+for+salvation.+They+will+allow+themselves+to+apprehend+that+they+must+have+something+to+bring+with+them+to+the+Savior+in+order+to+recommend+them+to+Him%2C+some+good+qualifications+to+entitle+them+to+His+favor.+Although+it+is+declared+in+the+gospel+that+all+things+are+already+given+to+Christ+by+the+Father%2C+yet+when+the+thoughts+of+convinced+sinners+about+the+law+and+the+gospel+are+indistinct%2C+they+imagine+that+they+must+still+have+something+of+their+own+to+bring+and+present+to+Him.+They+conceive+that+they+must%2C+in+some+measure%2C+have+that+which+is+commanded+in+the+law+before+they+can+have+a+right+to+receive+that+which+is+offered+in+the+gospel+or+that+they+must+have+those+holy+dispositions+to+bring+to+Christ+which+He+only+can+bestow+and+for+which+they+ought+as+sinners+to+come+to+Him.+Thus%2C+having+the+righteousness+required+of+them+in+the+law%2C+and+not+the+infinitely+perfect+righteousness+freely+offered+to+them+in+the+gospel%2C+before+their+eyes%2C+their+consciences+are+brought+into+trouble+and+perplexity%3B+and+instead+of+coming+as+sinners+to+Christ+for+righteousness+and+strength%2C+they+are+ready+to+harden+themselves+in+despair+of+His+mercy+and+in+aversion+from+Him.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+on+the+Law+and+Gospel+%28Grand+Rapids%3A+Reformati

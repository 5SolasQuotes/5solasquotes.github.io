<main class="wrap"><figure class="quote" id="q-2afd31f9c9" data-kw="">
<blockquote><p>Neither need ye (Right reverend) to be afraid of them, who by their vile lies and calumnies labour to stir up against you the hatred of your most excellent King, as if ye were enemies to His Honour, and Royal Highness, or envied His greater Honour and Glory: For the King out of His deep Wisdom knoweth, that He hath not any more loyal Subjects, then these who are devoted to the reformed Religion: He knoweth that there is nothing can establish more His Throne, that can enlarge His Royal Honour and Magnificence more, or can better preserve His Royal Person, then if with His whole Power He defend the reformed Religion, against all the adversaries thereof:

For the King’s most excellent Majesty knoweth, that such flatterers carry the shew of good-will, but in effect are the most deadly enemies of His Honour. Let not therefore such vain shadows of fear scare you, but go on constantly, and courageously in helping the afflicted Kirks. God shall abundantly bless your endeavours, and shall grant unto you that the whole Antichristian crew, in vain shewing their teeth, and opposing you, ye having obtained your desires, shall have large matter of giving thanks to his divine Majesty.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-931f7e9954" data-kw="">
<blockquote><p>Again, I reason thus; That which moved not Christ and his Apostles to separate from the Church of their time, is no cause to us of separation; but, want of satisfaction by convincing signs of the true grace of every member of the Church, was to them no cause of separation from the Churches of their times, Ergo.

The major is clear, except we desire a better pattern for our practices then Christ and his Apostles; what ever carrieth us beyond their line, must be high presumption and deep hypocrisy.

The minor is clear, by many Scriptures; the Scribes and Pharisees were a generation of vipers; Jerusalem worse then Sodom and Gomorrah; Corasin and Bethsaida was worse then Tyrus and Sidon, and to be cast lower in Hell then these: yet the Lord did not give over to preach, to pray, to go to the Temple with them. Judas when a declared Traitor, did not scare him, nor any of his company from the Sacrament. After he went from the Table, when his wickedness was revealed that a Devil was in him; yet none of the Apostles offered to cast themselves out of the body because this wicked member was not cut off.

Many members of the Apostolic Churches were so far from convincing signs of true grace, that the works of the flesh were most evident in their life. In the Corinthians, fundamental errors, open Idolatry, grievous scandal, bitter contentions, profanation of the Lords Table. In the Galatians, such errors as destroyed grace, and made Christ of none effect. In the Church of Ephesus, of Laodicea, and the other golden Candlesticks, divers members were so evidently faulty, that the Candlestick is threatened to be removed; yet from none of these Churches did any of the Apostles ever separate, nor gave they the least warrant to any of their Disciples to make a separation from any of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), pp 158-59.</span></figcaption>

</figure><figure class="quote" id="q-051045ced0" data-kw="">
<blockquote><p>It plainly appears to such as read the Scriptures with a humble mind, and consider the doctrine therein delivered, and take notice of the Lord’s way of dealing with his own, that the grand design of God in the contrivance of the elect’s salvation, is, to evoke the riches of the free grace of God in Christ … I say, not simply to exalt grace, (which is always here to be understood of the free favour of God, or the grace of God without us); for even by the first covenant, the grace of God was exalted, and manifestly appeared in God’s condescending to enter into a covenant with Adam, and to require obedience of him by virtue of a covenant, and that with a promise of so great a reward, to which his best works could bear no proportion; when, by virtue of his sovereignty merely, he might have exacted all obedience; here was grace, though, as [Paul] Bayn[e] calls it, a more common and inferior grace: But I say the riches of grace, in respect of which the former was but a small scantling of grace. Thus the apostle holds it forth, Eph. i. 7. “According to the riches of his grace.” Chap. ii. 4. “But God, who is rich in mercy;” and ver. 7. “That in the ages to come he might show the exceeding riches of his grace.”

This then is clearly the great design of God in the contrivance of man’s salvation. Now the heart of a child of God is (if I may so term it) shapen out in breadth and length to this design: for what is faith bat an hearty acquiescing in the way of salvation held forth in the gospel, as suited both to man’s necessity, and the divine perfections, and particularly tending unto the manifestation of the riches of grace whereby Christ is made all, and the creature nothing?

Here then I apprehend, we may find the great reason of the Lord’s dispensation in the matter of the believer’s sanctification, the knowledge and consideration whereof is most likely to give satisfaction to the soul thus exercised. And it is briefly this: The exalting of Christ, and of the free grace of God in him, is the great design and end of the contrivance of man’s salvation, as held forth in the gospel; but God’s leaving of sin to be, and to be active in the regenerate while they are in this world, yea and keeping of them for a while in that case in the world, does contribute more to the advancement of that design, than the making of them sinless immediately upon their closing with Christ. Therefore may we already not only believe, but see, that in this matter he hath done all things well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous Questions</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 120-21.</span></figcaption>

This then is clearly the great design of God in the contrivance of man’s salvation. Now the heart of a child of God is (if I may so term it) shapen out in breadth and length to this design: for what is faith bat an hearty acquiescing in the way of salvation held forth in the gospel, as suited both to man’s necessity, and the divine perfections, and particularly tending unto the manifestation of the riches of grace whereby Christ is made all, and the creature nothing?

Here then I apprehend, we may find the great reason of the Lord’s dispensation in the matter of the believer’s sanctification, the knowledge and consideration whereof is most likely to give satisfaction to the soul thus exercised. And it is briefly this: The exalting of Christ, and of the free grace of God in him, is the great design and end of the contrivance of man’s salvation, as held forth in the gospel; but God’s leaving of sin to be, and to be active in the regenerate while they are in this world, yea and keeping of them for a while in that case in the world, does contribute more to the advancement of that design, than the making of them sinless immediately upon their closing with Christ. Therefore may we already not only believe, but see, that in this matter he hath done all things well.”

— Thomas Boston, Miscellaneous Questions, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 120-21.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+plainly+appears+to+such+as+read+the+Scriptures+with+a+humble+mind%2C+and+consider+the+doctrine+therein+delivered%2C+and+take+notice+of+the+Lord%E2%80%99s+way+of+dealing+with+his+own%2C+that+the+grand+design+of+God+in+the+contrivance+of+the+elect%E2%80%99s+salvation%2C+is%2C+to+evoke+the+riches+of+the+free+grace+of+God+in+Christ+%E2%80%A6+I+say%2C+not+simply+to+exalt+grace%2C+%28which+is+always+here+to+be+understood+of+the+free+favour+of+God%2C+or+the+grace+of+God+without+us%29%3B+for+even+by+the+first+covenant%2C+the+grace+of+God+was+exalted%2C+and+manifestly+appeared+in+God%E2%80%99s+condescending+to+enter+into+a+covenant+with+Adam%2C+and+to+require+obedience+of+him+by+virtue+of+a+covenant%2C+and+that+with+a+promise+of+so+great+a+reward%2C+to+which+his+best+works+could+bear+no+proportion%3B+when%2C+by+virtue+of+his+sovereignty+merely%2C+he+might+have+exacted+all+obedience%3B+here+was+grace%2C+though%2C+as+%5BPaul%5D+Bayn%5Be%5D+calls+it%2C+a+more+common+and+inferior+grace%3A+But+I+say+the+riches+of+grace%2C+in+respect+of+which+the+former+was+but+a+small+scantling+of+grace.+Thus+the+apostle+holds+it+forth%2C+Eph.+i.+7.+%E2%80%9CAccording+to+the+riches+of+his+grace.%E2%80%9D+Chap.+ii.+4.+%E2%80%9CBut+God%2C+who+is+rich+in+mercy%3B%E2%80%9D+and+ver.+7.+%E2%80%9CThat+in+the+ages+to+come+he+might+show+the+exceeding+riches+of+his+grace.%E2%80%9D%0A%0AThis+then+is+clearly+the+great+design+of+God+in+the+contrivance+of+man%E2%80%99s+salvation.+Now+the+heart+of+a+child+of+God+is+%28if+I+may+so+term+it%29+shapen+out+in+breadth+and+length+to+this+design%3A+for+what+is+faith+bat+an+hearty+acquiescing+in+the+way+of+salvation+held+forth+in+the+gospel%2C+as+suited+both+to+man%E2%80%99s+necessity%2C+and+the+divine+perfections%2C+and+particularly+tending+unto+the+manifestation+of+the+riches+of+grace+whereby+Christ+is+made+all%2C+and+the+creature+nothing%3F%0A%0AHere+then+I+apprehend%2C+we+may+find+the+great+reason+of+the+Lord%E2%80%99s+dispensation+in+the+matter+of+the+believer%E2%80%99s+sanctification%2C+the+knowledge+and+consideration+whereof+is+most+likely+to+give+satisfaction+to+the+soul+thus+exercised.+And+it+is+briefly+this%3A+The+exalting+of+Christ%2C+and+of+the+free+grace+of+God+in+him%2C+is+the+great+design+and+end+of+the+contrivance+of+man%E2%80%99s+salvation%2C+as+held+forth+in+the+gospel%3B+but+God%E2%80%99s+leaving+of+sin+to+be%2C+and+to+be+active+in+the+regenerate+while+they+are+in+this+world%2C+yea+and+keeping+of+them+for+a+while+in+that+case+in+the+world%2C+does+contribute+more+to+the+advancement+of+that+design%2C+than+the+making+of+them+sinless+immediately+upon+their+closing+with+Christ.+Therefore+may+we+already+not+only+believe%2C+but+see%2C+that+in+this+matter+he+hath+done+all+things+well.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+Miscellaneous+Questions%2C+in+The+Complete+Works+of+the+Late+Rev.+Thomas+Boston%2C+Ettrick%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+6%3A+120-21.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F051045ced0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/051045ced0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/06/thomas-boston-on-contrasting-grace-in-the-two-covenants/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

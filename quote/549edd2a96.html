<main class="wrap"><figure class="quote" id="q-549edd2a96" data-kw="">
<blockquote><p>Delight not to be in bad places and company; to delight in such argues you are bad yourself. We are to hate the garment spotted with the flesh. Some expound this, “to avoid the occasions of sin,” but Mr [William] Perkins gives this sense: “to hate bad company.” He alludes to the ceremonial law that said that if a man had a leprous garment, or a garment otherwise made unclean, his company was to be avoided. God therefore gave that command not to plough with an ox and an ass together; the ass was an unclean creature, and the ox was one of the clean beasts, and they must not be in the same yoke. This notes (say divines) that God’s people and profane persons must not be yoked together. Though they may occasionally meet together, yet they must not be yoked together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: the truth, growth, and different degrees in fifteen sermons</cite>, ed. Don Kistler (Morgan, 1997), pp 12-13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The wisdom of God is truly infinite. He seeth “the end from the beginning, and from ancient times the things that are not yet done.” — (Isa. xlvi. 10.) He unerringly adapts all agencies, whether material or mental, to their work, and overrules them to the accomplishment of his eternal purposes at the time and in the way he had foreseen and appointed.

Consequently the means which he employs for attaining any proposed end can never fail. His dispensations always fulfil their mission. His institutions unfailingly effect the precise purposes for which they were established; though we may not be able in all cases to discern what these purposes were, nor how they have been accomplished. Nay more: divine ordinances do not merely fulfil their special and primary objects, but, while realizing these, they are designed and calculated to promote many other beneficial ends.

The highest effort of human wisdom is to devise means which may, with certainty, accomplish some single purpose; and all experience testifies how seldom this measure of success is attained. But such are the inexhaustible resources of divine wisdom, that His appointed means. His institutions, never fail to confer almost countless blessings on those who reverently observe them; so that, amid this multiplicity of attendant blessings, it is often difficult to distinguish between those which were primarily, and those which were indirectly, designed to be bestowed.

Thus it is with the Sabbath. Tried by this test, it approves itself to be truly a divine ordinance. It has not only answered the special purposes of heavenly wisdom and love to man in its appointment; it has at the same time been attended with so many other beneficent results, that one often feels at a loss to determine which of these are the special blessings its divine Founder intended it primarily to confer, and which are the supplementary ones that follow in their train.

How numerous, varied, and precious are the objects which the Sabbath, from the day of its institution, was designed to accomplish! Under the PATRIARCHAL dispensation it was a mute but eloquent witness for the existence of God, his unity, his creative power, his sovereignty over his creatures, and their responsibility to him. Under the MOSAIC economy, the Sabbath bore continued testimony not only to these truths, but also to the providential and moral government of God in its preservation and re-enactment, and his supreme light to the homage and worship of his people; it bore testimony to his beneficent regard for their temporal and eternal welfare; it taught them to look, through its hallowed use, for blessings on themselves and their nation; and it indicated a future period which would be pregnant with richer blessings and ennobled with a purer worship.

Under the Christian dispensation, while all these fundamental truths are still emphatically inculcated by the Sabbath, it has moreover become a memorial of redeeming love — a witness for the completion of that “better covenant” which was ratified by the resurrection of its Surety — a remembrance of Him “who died for our sins, and rose again for our justification” — an attestation to the deity of Him who had “power to lay down his life, and power to take it again” on this day — and a manifestation of His kingly prerogatives when he proclaimed himself to be the “Lord of the Sabbath.”

It has become a source of still more precious blessings to the people of God, refreshing, edifying, sanctifying them; a season for meditating on past sin and present infirmity, and for rejoicing in a finished salvation and a purchased inheritance. And it still continues to be a type of that heavenly “Sabbath that remaineth to the people of God,” and one of the most efficient means of preparing them for its enjoyment.

These are some of the primary and special ends which the Lord of the Sabbath had in view when he instituted it, and which it has never failed to answer. But, true to its divine origin, a long train of attendant blessings, corporeal and mental, intellectual and moral, personal and domestic, social and national, temporal and eternal, flow from its sanctified observance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-seaton-reid.html">James Seaton Reid</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Indirect Influence of the Sabbath on the General Prosperity of Nations; and Especially on their Intelligence, Trade and Commerce, Social Order and Liberties in The Christian Sabbath, Considered in its Various Aspects by Ministers of Different Denominations. With Preface by the Hon. and Rev. Baptist </cite></span></figcaption>

<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.”

— French Reformed Churches, Synodicon in Gallia Reformata (John Quick, London, 1692), ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren, p. 297">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+The+Province+of+Burgundy+demanding%2C+Whether+the+faithful+of+the+Augustane+%5BAugsburg%5D+Confession+might+be+permitted+to+contract+marriages+in+our+Churches%2C+and+to+present+children+in+our+churches+unto+baptism%2C+without+a+precedaneous+abjuration+of+those+opinions+held+by+them%2C+contrary+to+the+belief+of+our+churches%3F+This+synod+declares+that+inasmuch+as+the+Churches+of+the+Confession+of+Ausbourg+do+agree+with+the+other+Reformed+Churches+in+the+principal+and+fundamental+Points+of+the+True+Religion%2C+and+that+there+is+neither+superstition+nor+idolatry+in+their+worship%2C+the+faithful+of+the+said+Confession%2C+who+with+a+spirit+of+love+and+peaceableness+do+join+themselves+to+the+communion+of+our+churches+in+this+kingdom%2C+may+be%2C+without+any+abjuration+at+all+made+by+them%2C+admitted+unto+the+Lord%E2%80%99s+Table+with+us%3B+and+as+sureties+may+present+children+unto+baptism%2C+they+promising+the+consistory+that+they+will+never+solicit+them%2C+either+directly+or+indirectly%2C+to+transgress+the+doctrine+believed+and+professed+in+our+Churches%2C+but+will+be+content+to+instruct+and+educate+them+in+those+points+and+articles+which+are+in+common+between+us+and+them%2C+and+wherein+both+the+Lutherans+and+we+are+unanimously+agreed.%E2%80%9D%0A%0A%E2%80%94+French+Reformed+Churches%2C+Synodicon+in+Gallia+Reformata+%28John+Quick%2C+London%2C+1692%29%2C+ed.+John+Quick%2CSynodicon+in+Gallia+reformata%2C+or%2C+The+Acts%2C+Decisions%2C+Decrees+%26+Canons+of+those+Famous+National+Councils+of+the+Reformed+Churches+in+France+%28London%3A+Parkhurst%2C+1692%29%2C+Ch.+22%2C+An+Act+in+favor+of+the+Lutheran+Brethren%2C+p.+297&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe627d178b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e627d178b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=4.%20The%20Province%20of%20Burgundy%20demanding,Lutherans%20and%20we%20are%20unanimously%20agreed&amp;text=4.%20The%20Province%20of%20Burgundy%20demanding%2C%20Whether%20the&amp;text=both%20the%20Lutherans%20and%20we%20are%20unanimously%20agreed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

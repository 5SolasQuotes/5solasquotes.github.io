<main class="wrap"><figure class="quote" id="q-d87622f9f0" data-kw="">
<blockquote><p>Q. What is Baptism?

A. A Sacrament of Regeneration, wherein by the outward washing of the body with water in the name of the Father, the Son, and the Holy Ghost, the inward cleansing of our souls by the blood of Christ is represented and sealed up unto us.

Q. Who are to be baptized?

A. They who in charity may be thought to be in the Covenant.

[Q.] Who are they?

A. Both all that profess themselves to be of the Christian faith, and also their children.

Q. What ground have we to judge the children of Christians to be in the Covenant?

A. The extent of God’s promise which reacheth even to them.

Q. How oft may one be baptized?

A. Only once: for once only we are born again and engrafted into Christ.</p></blockquote>

<blockquote><p>That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.</p></blockquote>

</figure><figure class="quote" id="q-d42412a951" data-kw="baptism of heretics">
<blockquote><p>What has been said in general of the baptism of heretics ought to be applied in particular to the baptism of the Romanists. Although we think it ought to be retained in those who come from them to us because the essentials of baptism remain with them; still we deny that it can rightly be sought or received from them, as will be proved more fully when we come to that subject. Sixteenth Question Was John’s baptism essentially the same as Christ’s baptism? We affirm against the Romanists I. Although this question appears to be less necessary in our day, when no one is baptized except with that baptism which the apostles administered; yet because it is wont to be fiercely agitated by the Romanists, we must speak briefly concerning it, in order that the truth of the orthodox doctrine concerning baptism may be the better illustrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19</span></figcaption>

</figure><figure class="quote" id="q-1946aa0d79" data-kw="">
<blockquote><p>But if anyone either on the testimony of the church, or parents, or witnesses, or of others cannot be sure about the baptism that he had received in infancy, or if it happened that he was moistened by no other baptism than that of the midwives or private individuals, we are of the opinion that such a man may be baptized without any scruple. For the baptism applied by the last-mentioned people is not baptism at all, and the baptism of the first mentioned people is worthless, as the Council of Carthage [AD 418] has rightly decided (5.3): ‘Concerning infants it has been decided that whenever no very certain witnesses are found who testify without a doubt that they were baptized, and whenever they themselves are not, on account of their age, in a position to give an answer about the sacraments that were given to them, they should be baptized without any scruple, lest that doubt should cause them to be bereft of the cleansing of the sacraments.’ For as Leo [AD 400-461] rightly added, ‘what is not known to have been done cannot be said to have been repeated.’ And consequently we should not approve of a conditional baptism that the papal teachers are used to observing in such cases, according to this formula: ‘If you have not been baptized, then I baptize you.’ For a baptism of this kind lacks any precedent in Scripture and changes the form for baptism that Christ had taught, and it also leaves the one who has been baptized in doubt as to which baptism is the real one–which goes against the purpose of baptism that does not make the promises of God ambiguous but establishes and seals them.</p></blockquote>

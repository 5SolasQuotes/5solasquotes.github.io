<blockquote><p>IX. Thus, besides the Schoolmen, the orthodox fathers also teach: so Prosper Aquitanicus, in the year of Christ 460, Response to the Objections of Vincent., Objection 1: Whereas it is rightly said that our Savior was crucified for the redemption of all the world, for undertaking the affairs of human nature, and for the common loss in Adam: yet it may be said that He died only for these to whom his death was profitable. And Cyril on John l. 11, ch. 19, says, That Christ is an advocate for the sins of all the world: that is, not only for the Jews, but also for other nations; or, for all who, being called by faith, attain to righteousness and sanctification; so that the benefit of a mediator, not without cause, belongs only to them whose mediator and high-priest He is. X. But, of all men, Augustine speaks most clearly, whose opinion (because it is altogether ours) I thought to set in opposition to some sycophants. Thus he speaks (tome 1, ad Art. falso imp., article 1): If we consider the greatness and power of the price, and that it belongs to the only cause of mankind, the blood of Christ is the redemption of the whole world; but they that pass out of this life without faith and the sacrament of regeneration, they are not partakers of redemption. Whereas then by reason of that one nature of all, and the one cause of all, undertaken by our Lord truly, all are said to be redeemed, and yet not all are delivered from captivity, doubtless the property of redemption is in them out of whom the prince of this world is ejected: and now they are no more the vessels of Satan, but the members of Christ. Whose death is not so spent upon mankind that they also who are not regenerated should appertain to his redemption; but so, that what by one example is done for all, by a particular sacrament should be celebrated in each one: for that cup of immortality, which was composed of our infirmity, and of our verity, and of divine verity, it has in itself that which may benefit all, but if it be not drunk, it does not cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645)</cite>, pp. 694-98</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f271ecd378" data-kw="">
<blockquote><p>As early as 1595 Piscator, the longtime professor of theology at Herborn whose commentaries on Scripture were generally admired by the Reformed, argued that Christ in no way died for the reprobate. In England, the controversial Peter Baro picked up on this teaching and publicly rejected it in his sermon on the Lambeth Articles in January 1596. Baro had good reason to be alarmed for, in 1594, a Church of England minister named William Burton similarly denied that the death of Christ was sufficient for the nonelect.</p></blockquote>

<blockquote><p>3. The kingdom of the Son of God is twofold: universal and singular. 4. The universal kingdom of the Son of God is the kingdom that, by nature, God Himself truly possesses in common with the Father and the Holy Spirit throughout the universe, from eternity to eternity, and this by nature or by natural right, as the Only Begotten Son of God the Father. Hence, it is also called the divine kingdom by Athanasius in his work De Incarnatione Verbi Contra Arianos (On the Incarnation of the Word Against the Arians), Volume 1, Page 476. This same natural kingdom of His is accustomed to be called. 5. He has never relinquished nor will He ever relinquish this kingdom. 6. The singular kingdom of the Son of God is His special possession within the Church, which is His mystical body. It is often called the kingdom of gift and acquisition. 7. It encompasses both grace and glory. 8. The kingdom of grace is the governance of the Church in this life, in which Christ exhibits His grace to His elect for the attainment of their eternal salvation. This kingdom is called “human” by Athanasius in the aforementioned passage because it is administered by the Son of God in His capacity as the Word made flesh, voluntarily and graciously undertaking the role of Mediator. Hence, it is also appropriately called the “Economical” or “Mediatorial” kingdom, as it pertains specifically to us humans. 9. Christ will deliver this kingdom to God the Father, as stated in 1 Corinthians 15:24. As Athanasius noted in the previously mentioned passage, the Lord of heaven assumed the likeness of our humanity and took upon Himself the human throne of David, who is His Father according to the flesh, in order to rebuild and restore it. Through this restoration, we all reign in Him, and He will deliver the restored human kingdom to His Father. … 13. That God may be all in all [1 Cor. 15:28], that is, that God the Father may reign through the Son, through His own Word, after He has reigned here through Him as the Savior, as the same Athanasius piously declares. 14. The kingdom of glory is the governance of the Son of God, which will accompany the universal resurrection of all the dead. When the restoration and glorification of God’s elect are completed, they will contemplate the glory of God the Father in the Only Begotten Son through the Holy Spirit for eternity, and they will be blessed without end in the present vision of God and will reign gloriously with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 2 $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601) | section XIV, Consequences</cite></span></figcaption>

<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-w-pink.html">A.W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.”

— A.W. Pink, Exposition of the Gospel of John (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+transgression+of+my+people+was+he+stricken%E2%80%9D+%28lsa.+53%3A8%29.+%E2%80%9CThou+shalt+call+his+name+JESUS%3A+for+he+shall+save+his+people+from+their+sins%E2%80%9D+%28Matt.+1%3A21%29.+%E2%80%9CThe+Son+of+man+came+not+to+be+ministered+unto%2C+but+to+minister%2C+and+to+give+his+life+a+ransom+for+many%E2%80%9D+%28Matt.+20%3A28%29.+%E2%80%9CThe+good+Shepherd+giveth+his+life+for+the+sheep%E2%80%9D+%28John%E2%80%99+10%3A11%29.+%E2%80%9CChrist+also+loved+the+church+and+gave+himself+for+it%E2%80%9D+%28Eph.+5%3A+25%29.+%E2%80%9CWho+gave+himself+for+us%2C+that+he+might+redeem+us+from+all+iniquity%2C+and+purify+unto+himself+a+peculiar+people%E2%80%9D+%28Titus+2%3A+14%29.+%E2%80%9CTo+make+propitiation+for+the+sins+of+the+people%E2%80%9D+%28Heb.+2%3A+17%29.+Here+are+seven+passages+which+gave+a+clear+and+simple+answer+to+our+question%2C+and+their+testimony%2C+both+singly+and+collectively%2C+declare+plainly+that+the+death+of+Christ+was+not+an+atonement+for+sin+abstractedly%2C+nor+a+mere+expression+of+Divine+displeasure+against+iniquity%2C+nor+an+indefinite+satisfaction+of+Divine+justice%2C+but+instead%2C+a+ransom-price+paid+for+the+eternal+redemption+of+a+certain+number+of+sinners%2C+and+a+plenary+satisfaction+for+their+particular+sins.+It+is+the+glory+of+redemption+that+it+does+not+merely+render+God+placable+and+man+pardonable%2C+but+that+it+has+reconciled+sinners+to+God%2C+put+away+their+sins%2C+and+forever+perfected+His+set-apart+ones.%E2%80%9D%0A%0A%E2%80%94+A.W.+Pink%2C+Exposition+of+the+Gospel+of+John+%28Zondervan%2C+1962%29%2C+2.219-22+This+is+early+Pink%2C+at+his+worst.+HT%3A+David+Ponter+%7C+Whenever+the+Holy+Scriptures+speak+of+the+sufficiency+of+redemption%2C+they+always+place+it+in+the+certain+efficacy+of+redemption.+The+atonement+of+Christ+is+sufficient+because+it+is+absolutely+efficacious%2C+and+because+it+effects+the+salvation+of+all+for+whom+it+was+made.+Its+sufficiency+lies+not+in+affording+man+a+possibility+of+salvation%2C+but+in+accomplishing+their+salvation+with+invincible+power.+Hence+the+Word+of+God+never+represents+the+sufficiency+of+the+atonement+as+wider+than+the+design+of+the+atonement.+How+different+is+the+salvation+of+God+from+the+ideas+now+popularly+entertained+of+it%21+%E2%80%9CAs+for+thee+also%2C+by+the+blood+of+thy+covenant+I+have+sent+forth+thy+prisoners+out+of+the+pit+wherein+is+no+water%E2%80%9D+%28Zech.+9%3A11%29.+Christ%2C+by+his+death+paid+the+ransom%2C+and+made+sin%E2%80%99s+captives+his+own.+He+has+a+legal+right+to+all+of+the+persons+for+whom+He+paid+that+ransom+price%2C+and+therefore+with+God%E2%80%99s+own+right+arm+they+are+brought+forth.+For+whom+did+Christ+die%3F&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2382ecf531.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2382ecf531. <blockquote><p>Not all those who are called are predestined. For Christ said: ‘Many are called, but few are chosen’ (Mt. 22:14). But they contend that the calling is universal and that God would wish everyone saved. If it is understood as universal calling because it is offered to all and no one is excluded by name, it is true. If it is also called universal because the death of Christ and his redemption is sufficient for the whole world; that also is most true. But if this universality is meant so that He it is in everyone’s hand to receive the promises, I deny it: because to some it is given, to others it is not given. As if we did not see also that for a long time the very preaching of the Gospel was not given to many places, ages, and nations. God would have all to be saved, provided they believe. He gives faith to whom it seems good to Him. For He may justly do with his own what he will.</p></blockquote>

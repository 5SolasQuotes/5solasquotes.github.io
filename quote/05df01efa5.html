<main class="wrap"><figure class="quote" id="q-05df01efa5" data-kw="">
<blockquote><p>We may be reminded that the [Westminster] Confession declares God to be ‘without passions.’ So the theologians tell us that we must ascribe to Him no ‘passive powers’; for then He would not be immutable. He acts on everything, but is acted on by none. He is the source, but not the recipient of effects. This is indisputable. But we should not so overstrain the truth as to reject two other truths. One is, that while God has no passions, while He has no mere susceptibility such that his creature can cause an effect upon it irrespective to God’s own will and freedom, yet He has active principles. These are not passions, in the sense of fluctuations or agitations, but none the less are they affections of his will, actively distinguished from the cognitions in his intelligence. They are true optative functions of the divine Spirit. However anthropopathic may be the statements made concerning God’s repentings, wrath, pity, pleasure, love, jealousy, hatred, in the Scriptures, we should do violence to them if we denied that He here meant to ascribe to Himself active affections in some mode suitable to his nature. And it is impossible for us to suppose an agent without active principles, as well as cognitive, as we could not believe that the compass could move the ship without any motive power. The other truth is, that objective beings and events are the real occasions, though not efficient causes, of the action both of the divine affections and will. Are not many divines so much afraid of ascribing to God any ‘passive powers,’ or any phase of dependence on the creature, that they hesitate even to admit that scriptural fact? But why should they recoil from the simple statements of his Word on this point, unless they were confused or misled by the old sensualistic view, which regarded the objective impression as somehow the efficient, instead of the mere occasion, of the following activities of the percipient soul: “God is angry with the wicked every day” (Ps. 7:11); “But the thing that David had done displeased the Lord;” “My delight is in her” (Is. 62:4); “In these things I delight, saith the Lord” (Jer. 9:24). Is all this so anthropopathic as not even to mean that God’s active principles here have an objective? Why not let the Scriptures mean what they so plainly strive to declare? But some seem so afraid of recognizing in God any susceptibility of a passive nature that they virtually set Scripture aside, and paint a God whose whole activities of intelligence and will are so exclusively from Himself that even the relation of objective occasion to Him is made unreal, and no other is allowed than a species of coincidence or preëstablished harmony. They are chary of conceding (what the Bible seems so plainly to say) that God is angry because men sin; and would go no farther than to admit that somehow He is angry when men sin, yet, because absolutely independent, angry only of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions</cite>, vol 1, ‘God’s Indiscriminate Proposals of Mercy’</span></figcaption>

</figure><figure class="quote" id="q-5f2f93fce0" data-kw="">
<blockquote><p>We must needs assert that in God there is love: because love is the first movement of the will and of every appetitive faculty. For since the acts of the will and of every appetitive faculty tend towards good and evil, as to their proper objects: and since good is essentially and especially the object of the will and the appetite, whereas evil is only the object secondarily and indirectly, as opposed to good; it follows that the acts of the will and appetite that regard good must naturally be prior to those that regard evil; thus, for instance, joy is prior to sorrow, love to hate: because what exists of itself is always prior to that which exists through another. Again, the more universal is naturally prior to what is less so. Hence the intellect is first directed to universal truth; and in the second place to particular and special truths. Now there are certain acts of the will and appetite that regard good under some special condition, as joy and delight regard good present and possessed; whereas desire and hope regard good not as yet possessed. Love, however, regards good universally, whether possessed or not. Hence love is naturally the first act of the will and appetite; for which reason all the other appetite movements presuppose love, as their root and origin. For nobody desires anything nor rejoices in anything, except as a good that is loved: nor is anything an object of hate except as opposed to the object of love. Similarly, it is clear that sorrow, and other things like to it, must be referred to love as to their first principle. Hence, in whomsoever there is will and appetite, there must also be love: since if the first is wanting, all that follows is also wanting. Now it has been shown that will is in God (Q[19], A[1]), and hence we must attribute love to Him.</p></blockquote>

</figure><figure class="quote" id="q-6f12ebe81a" data-kw="">
<blockquote><p>First, in general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that He is God. He that is not perfect in Himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and has no farther desire for supply. He who is blessed in Himself is all-sufficient for Himself. If God want or desire any thing for Himself, He is neither perfect nor blessed. To ascribe, then, affections to God properly [as his Socinian opponent does]… is to deprive Him of his perfection and blessedness. 1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose.^ The proper actings of affections lie between these two ; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. ‘He worketh all things after the counsel of his own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12, p. 109</span></figcaption>

<div class="actions"><button class="copy" data-copy="“First, in general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that He is God. He that is not perfect in Himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and has no farther desire for supply. He who is blessed in Himself is all-sufficient for Himself. If God want or desire any thing for Himself, He is neither perfect nor blessed. To ascribe, then, affections to God properly [as his Socinian opponent does]… is to deprive Him of his perfection and blessedness. 1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose.^ The proper actings of affections lie between these two ; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. ‘He worketh all things after the counsel of his own will.&#x27;”

— John Owen, Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12, p. 109">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+in+general%2C+that+God+is+perfect+and+perfectly+blessed%2C+I+suppose+will+not+be+denied%3B+it+cannot+be+but+by+denying+that+He+is+God.+He+that+is+not+perfect+in+Himself+and+perfectly+blessed+is+not+God.+To+that+which+is+perfect+in+any+kind+nothing+is+wanting+in+that+kind.+To+that+which+is+absolutely+perfect+nothing+is+wanting+at+all.+He+who+is+blessed+is+perfectly+satisfied+and+filled%2C+and+has+no+farther+desire+for+supply.+He+who+is+blessed+in+Himself+is+all-sufficient+for+Himself.+If+God+want+or+desire+any+thing+for+Himself%2C+He+is+neither+perfect+nor+blessed.+To+ascribe%2C+then%2C+affections+to+God+properly+%5Bas+his+Socinian+opponent+does%5D%E2%80%A6+is+to+deprive+Him+of+his+perfection+and+blessedness.+1.+Affections%2C+considered+in+themselves%2C+have+always+an+incomplete%2C+imperfect+act+of+the+will+or+volition+joined+with+them.+They+are+something+that+lies+between+the+firm+purpose+of+the+soul+and+the+execution+of+that+purpose.%5E+The+proper+actings+of+affections+lie+between+these+two+%3B+that+is%2C+in+an+incomplete%2C+tumultuary+volition.+That+God+is+not+obnoxious+to+such+volitions+and+incomplete+actings+of+the+will%2C+besides+the+general+consideration+of+his+perfections+and+blessedness+premised%2C+is+evident+from+that+manner+of+procedure+which+is+ascribed+to+him.+His+purposes+and+his+works+comprise+all+his+actings.+As+the+Lord+hath+purposed%2C+so+hath+he+done.+%E2%80%98He+worketh+all+things+after+the+counsel+of+his+own+will.%27%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Ch.+4%2C+%E2%80%98Of+the+Attribution+of+Passions+%26+Affections%2C+Anger%2C+Fear%2C+Repentance+unto+God%E2%80%99+of+Vindiciae+Evangelicae%3B+Or+the+Mystery+of+the+Gospel+Vindicated+%26+Socinianism+Examined+in+Works%2C+vol.+12%2C+p.+109&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f12ebe81a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f12ebe81a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-affections-of-god/#:~:text=First%2C%20in%20general%2C%20that%20God%20is,the%20counsel%20of%20his%20own%20will&amp;text=First%2C%20in%20general%2C%20that%20God%20is%20perfect%20and&amp;text=things%20after%20the%20counsel%20of%20his%20own%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

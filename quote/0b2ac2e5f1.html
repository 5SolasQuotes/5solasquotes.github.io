<main class="wrap"><figure class="quote" id="q-0b2ac2e5f1" data-kw="">
<blockquote><p>…in a man regenerate, there are two contrary qualities inherent in every faculty: 1. Grace, in a rectified holy inclination to goodness, infused into it. 2. Corruption in a vitious quality disposing it to evil. These two qualities abide in the regenerate, and oppose one another… let us proceed to declare what is a regenerate man’s resistance that he makes against the working of grace in hindering the performance of any good work: which you shall perceive by these two conclusions: 1. A man regenerate so far forth as he is Spiritual, never resists the work of grace, but is constantly most willing and forward to the performance of all holy actions. … 2. That a man regenerate, so far forth as he is carnal, does always resist the work of grace, being unwilling and backward to perform any holy action. … To conclude this point, there is in every regenerate man a possibility or power of resistence always remaining so long as any corruption abides in him, which will perpetually make some opposition more or less in the performance of every good work. But for the prevailing act of resistency whereby such good works might be quite hindered, we affirm that by the power of assisting grace effectually aiding the regenerate faculties, that act is taken away. The flesh may strive, but the Spirit does overcome… a victory indeed certain in regard of the event, but with some uncertainty in the combat, wherein Israel is sometime put unto the worst. For you are to note that albeit in the general as touching those main and principal acts of beleeving, repenting, persevering in obedience, etc. grace does work so effectually with man’s regenerate will that corruption cannot hinder it in the exercise of those acts: nevertheless, in many particular actions after his first conversion in the continued practice of sanctification, he may obey the enticings of his corrupt concupiscence, against the motions of the Spirit of grace. For many times in sundry particulars of Christian practice God is pleased to deny that effectual assistance which at other times He affords, and then He leaves us unto our own strength, for experiment to try what is in us, for humiliation in discovery of our weakness unto us, for exercise of Christian watchfulness in making diligent use of all gracious helps, and the like good purposes. … But these desertions are not perpetual: corruption may for a time let [prevent] the exercise of some particular graces, but in all and always it shall never hinder: God who has given unto a regenerate man a power to believe by the changing of his will through the infusion of a constant inclination to all spiritual good, will also cause the act of believing infallibly to ensue, by the assistance of cooperating grace, so powerfully strengthening the regenerate will, and so effectually restraining the rebellious motions of corruption that the will shall not choose but do that which above all things in the world it most desires to do, namely, believe and obey the Gospel.</p></blockquote>

<blockquote><p>4. Although regeneration is the work of God, yet in this life it is imperfect while we are in the state of grace. 5. And so it admits degrees of further perfection. 6. But by no means the defect of a full and final falling away. 7. The concupiscence and stain which remain in the regenerate are properly called sin. 8. Because these are the inseparable companions of any wayfarer, hence falls the dream of Papist perfection in this life.</p></blockquote>

<blockquote><p>3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christs blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.</p></blockquote>

tores+first+our+holiness+and+then+our+happiness%3A+%E2%80%99tis+not+consistent+with+God%E2%80%99s+holiness+to+give+us+pardon+and+let+us+alone+in+our+sins.+A+man+would+not+put+a+toad+in+his+bosom.+But+more+fully+to+give+you+a+prospect+into+this+matter%2C+let+us+take+notice+of+the+several+things+which+are+mentioned+in+Scripture%2C+as+belonging+to+our+justification%3A+as+for+instance%3A+Sometimes+we+are+said+to+be+justified+by+grace%2C+as+Rom.+3%3A24%2C+%E2%80%98Being+justified+freely+by+his+grace%E2%80%99%3A+sometimes+by+the+blood+of+Christ%2C+as+Rom.+5%3A9%2C+%E2%80%98Being+justified+by+his+blood%2C+we+shall+be+saved+from+wrath+through+Him%E2%80%99%3A+sometimes+by+faith%2C+as+Rom.+5%3A1%2C+%E2%80%98Being+justified+by+faith%2C+we+have+peace+with+God+through+our+Lord+Jesus+Christ%E2%80%99%3A+sometimes+by+works%2C+James+2%3A24%2C+%E2%80%98Ye+see+then+how+that+by+works+a+man+is+justified%2C+and+not+by+faith+only.%E2%80%99+All+these+things+concur+to+our+justification+and+do+not+contradict%2C+but+imply+one+another%3A+The+first+moving+cause+of+all+is+grace%3B+the+meritorious+cause%2C+is+Christs+blood%3A+the+means+of+applying%2C+or+the+condition+on+our+part+upon+which+we+are+capable+at+first+of+receiving+so+great+a+privilege%2C+is+faith%3A+and+the+means+of+continuing+in+our+justified+estate%2C+is+by+good+works%2C+or+new+obedience.+I+say%2C+our+first+actual+pardon%2C+justification%2C+and+right+to+life%2C+is+given+upon+condition+of+our+first+faith+and+repentance%3B+but+this+estate+is+continued+to+us+both+by+faith%2C+Rom.+1%3A17+and+new+obedience%3B+these+fairly+accord.+The+grace+of+God+will+do+nothing+without+the+intervention+of+Christ%E2%80%99s+merits%3B+and+Christ%E2%80%99s+merits+do+not+profit+us+%E2%80%99till+it+be+applied+by+faith%3B+and+sound+believers+will+live+in+a+course+of+new+obedience.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons%E2%80%A6+%28London%3A+Astwood%2C+1684%29%2C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+pp.+334-35&amp;url <blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>

<blockquote><p>8. Likewise, every Christian should learn that this grace and this regeneration have not been given to us so that we might remain idle in that stage of our renewal which we at first obtained, but so that we may grow in everything into him who is the head. Therefore, the people must be taught to devote effort to this growth which indeed happens through good works, both internal and external, which are commanded and commended by God. To these works God has, in many passages from the Gospels, clearly and manifestly promised on account of Christ a reward – good things in this life, as much for the body as for the soul (as much as seems right to divine providence) and after this life in heaven. Therefore, although the inheritance of eternal life is due to the regenerate on account of the promise, as soon as they are reborn in Christ, nevertheless God also renders a reward to good works, not according to the substance of the works, nor because they come from us, but to the extent that they are performed in faith and proceed from the Holy Spirit, who dwells in us, free choice concurring as a partial agent.</p></blockquote>

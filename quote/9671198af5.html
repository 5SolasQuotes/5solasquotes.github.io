<blockquote><p>IV. First proposition. “A multiple right concerning sacred things belongs to the magistrate.” It is proved (1) from the divine command. To him was committed the custody of the divine law; on this account he ought to care for the piety and worship of God, which is commanded by the first, no less than for justice and love, which is commanded by the second table: “And it shall be, when he sitteth upon the throne of his kingdom, that he shall write him a copy of this law in a book out of that which is before the priests and the Levites. And it shall be with him, and he shall read therein all the days of his life: that he may learn to fear the Lord his God, to keep all the words of this law and these statutes” (Dt. 17:18, 19). This is repeated in Jos. 1:8, and in the solemn inauguration of Jehoash the book of the law is given to him by Jehoiada that he may understand that the guardianship of it has been committed to him (2 K. 11:12). The same command is confirmed from other passages where kings and princes are ordered to be instructed to serve the Lord with fear and to kiss the Son (Ps. 2:11, 12); where it is said that they will come to Christ and shall fall down before him (Ps. 72:10, 11); where they are said to be set up for this purpose that we may lead a quiet and peaceable life in all godliness and honesty (1 Tim. 2:2), which could not be secured without a special care for religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), iii, 316-17.</span></figcaption>

<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>

<blockquote><p>Although the service which secular authorities owe to the community does not consist in preaching the divine Word and Law, yet civil officials must govern according to the Word of God and, in the measure of their power, help the success of the divine Word. For as there is no power? which is not from God, and everywhere the present powers are established by Him (Romans 13:1), it certainly follows that this power must be exercised according to the order and will of God.

Only so will this power at last procure the real welfare of its subjects and thus stimulate them to recognize, praise, and glorify God as the Lord of all lords and the King of all kings. But the citizens are not governed for their good and for the true glory of the supreme King when the secular authorities do not rule according to the divine Law and are not set to observe it themselves. For where God is not recognized and obedience to Him is not required before all things, there peace is not peace, justice is not justice, and that which should be profitable brings injury instead.

God therefore forbade the people of Israel to get from foreign people a king who would not be a brother, and commanded the people to accept as king him whom the Lord would elect from their brethren. The king was to write God’s Law and to read it all the days of his life so that he might learn to fear God his Lord, to keep His word and the injunctions of the Law, neither to raise his heart in pride above his brethren nor to deviate either to the right or to the left (Deuteronomy 17:15-20).

If a man, therefore, is to govern beneficially and not to be a tyrant, it is necessary that he be elected by God and from among the people of God. That is to say, he must be a true believer who has not himself stepped forward for the office but has been called to it. The Christian official, recognizing himself as undershepherd of sheep which are not his own but God’s, thinks to govern them not as it seems good to him but according to the Law of God to whom the sheep belong. Consequently a civil officer should day by day govern and treat the people of God according to the divine Law. In great humility and constant awe, he stands before God in order to avoid the least mistake in executing such a great commission.

This Solomon observed. He asked God to give him a teachable heart before all things, so that he might judge his people and know the difference between good and evil (I Kings 3:9). In this prayer he professes that he had been placed above God’s people and not above a people belonging to Solomon himself (I Kings 3:8), to judge it, to lead it to good, and to keep it from evil. He also confesses that human reason has not the power of distinguishing between evil and the true good, of judging rightly, but needs to learn such things from God. Thus enlightened, we can well recognize the heavy divine plague with which God has plagued us and which comes from the fact that we call ourselves Christians and consider ourselves the people of God, and yet our officials who have the power have fallen into the error of believing that the divine Law does not concern them, that they must judge and make regulations more according to the pagan imperial law and other human sentences than according to the sentence of God.

In this they show themselves bailiffs of men and not of God, since they govern their subjects according to the sentences of men and not according to the divine pronouncement. Now, anywhere a man whose law is observed is recognized as lord. No one on earth would consider as belonging to the German emperor a city which would direct all its affairs and regime according to the commands and prohibitions of the French king, and completely ignore the imperial law. Consequently, we cannot pride ourselves on being communities of God and the people of God, if we respect, accept, and keep all sorts of laws, ordinances, and regulations other than God’s. Only His Law can make us live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instruction in Christian Love</cite>, trans. Paul T. Fuhrmann (1523; Richmond VA: John Knox Press, 1952), pp 35-37.</span></figcaption>

<blockquote><p>Quest. 1. You profess yourselves, to be the genuine successors of our worthy Covenanters; but can you mention any one of these who, in the persecuting period, refused to obey the king as supreme, in things lawful, till he became an absolute tyrant?

Q.2. Doth God require Christians to profess principles, which they must of absolute necessity contradict in practice?

Q.3. Is it not evident, even yourselves being judges, that you cannot reduce to practice a single jot of your political principles, except your refusing to pray for government?

Q.4. Were the precepts delivered by Paul, Rom. xiii. 1-7. of any use to Christians, before Christianity became the established religion in the Roman empire?

Q.5. Do you believe, that Paul, in the passage above quoted, commanded the Christians at Rome to render tribute, custom, fear, honour, to magistracy in the abstract …?

Q.6. Do you believe, that Christ gave the Jews an allowance to kill Caesar, as your Testimony very plainly insinuates, p. 150. line tenth, and downwards?

Q.7. Do you think, that the accusers of Christ spake the truth, as your Testimony insinuates, p. 150. “It is violence done to the text to say, that it contains a command to pay tribute to Caesar; and it would appear from Luke xxiii. 2. that the Jews themselves did not understand it so.” The words in Luke xxiii. 2. are, We found this fellow perverting the nation, and forbidding to give tribute to Caesar. Do you really believe, that Christ forbade to give tribute to Caesar, as his false accusers said he did?

Q.8. Hath not the approven example of saints in Scripture, the force of a Scripture-precept, for directing the practice of Christians? But you have rejected said example, as appears from Mr. [John] Thorburn’s Vindiciæ, p. 104. … That is our duty to civil rulers must not be regulated, by the approven examples of saints in Scripture, but by Scripture precepts. If this be sound doctrine, we must no more go forth by the footsteps of the flock of Christ, nor be followers of Paul, even as he was of Christ. When the Reformed [Presbyterian] Brethren rejected the example of saints in Scripture, I think, they should have excepted the example of the King of saints, who was a servant of rulers.

Q.9. Do you believe, that our blessed Lord, in the days of his humiliation, was subject to the powers, which then were, or to Heathen magistrate? Is not this the name whereby he was called, A servant of rulers, Isa. xlix. 7.

Q.10. Is magistracy an ordinance of God, as the God of nature, and common to all men; or is it an ordinance of Christ as Mediator, and peculiar only to Christians? If magistracy is as much a gospel ordinance, as the preaching of the word, Baptism and the Lord’s Supper, &amp;c. Christians should observe it, however few in number, and wherever they are, tho’ it should be at the peril of their lives. “Teaching them, said Christ to his apostles, to observe all things, whatsoever I have commanded you.”

Q.11. Did not the most part of the kings of Israel, and of Judah, want the good qualifications, which you make absolutely necessary to the office of the magistrate? Did God ever command the people to disown their authority, because they wanted such and such good qualifications?

Q.12. Why do you endeavour to support your political principles, so much by Acts of Parliament, and so little by the word of God? “To the law and to the testimony: if they speak not according to this word, it is because there is no light in them.” Isa. viii. 20.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ecb7bf3700" data-kw="">
<blockquote><p>Whether in all matters of doctrine all of you [Independents] be as orthodox in your judgments as your brethren themselves, I question it (though in the most doctrines and in the main I grant it)… however though you do not nourish any monsters or serpents of opinions in your bosoms, yet I fear you have running worms in your heads, and together with the gold, silver and ivory of orthodox truths, you have store of apes and peacocks, conceits and toys, as strange coined distinctions, new strained expositions of Scriptures, odd opinions about the personal reign of Christ on earth, and I ask you what the anointing with oil of sick persons as an ordinance for church-members, and what the bringing in of hymns composed by the gift of a church-member, cum multis aliis [with many others], are? Whether are not these strange conceits?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644)</cite>, pp. 261-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cade01efb4" data-kw="">

</figure><figure class="quote" id="q-47ac56c75b" data-kw="perspicuity">
<blockquote><p>The question is not whether things essential to salvation are everywhere in the Scriptures perspicuously revealed. We acknowledge that there are some things hard to be understood (dysnoēta) and intended by God to exercise our attention and mental powers. The question is whether things essential to salvation are anywhere revealed, at least so that the believer can by close meditation ascertain their truth (because nothing can be drawn out of the more obscure passages which may not be found elsewhere in the plainest terms). As Augustine remarks: “Admirable and healthily the Spirit has so arranged the Scriptures that by the plainer passages he might meet our desires and by the obscurer remove our contempt” (CI 2.6 [FC 2:66; PL 34.39]); and, “We feed in the open places, we are exercised by the obscure; there hunger is driven away, here contempt” (Sermon 71, “De Verbis Domini,” 7.11 [PL 38.450]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.5</span></figcaption>

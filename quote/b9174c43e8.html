<blockquote><p>That there should be a mutual amity and forbearance amongst those who differ in matters of Church-government or the like, but agree in the fundamentals is most reasonable.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-097263c6db" data-kw="">
<blockquote><p>Schismatical is such as was the schisms of the Donatists [in the Early Church], which separated themselves from the true Church of God under the pretense of a more absolute life and a more perfect holiness… But none of these [kinds of schisms] can be justly imputed unto us declining from the Romish Church, for that departing is without all blame, which is not from a true Church, but from a false Church: not from the people of God, but from the persecuters of the people of God, not from the articles of the Faith and sound doctrine of the church, but from errors which darken the articles of the Faith and from the wicked traditions of men, which specially is not done by any lightness but by necessity, not for the desire of innovation but for true religion’s sake, and to recover the true Faith according to the testimony of the eternal verity, that leaving the fellowship of darkness, we may be gathered again in true light, placed with Christ and all his members. So we at this day have forsaken that Romish Sea full of false doctrine and idolatry, and flowing with the innocent blood of martyrs, and have embraced the evangelic and apostolic doctrine, and so Christ Himself being head of the Church, which is the commmunion of all saints believing in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-alley.html">William Alley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Poor Man’s Library Rapsodiæ G.A. Bishop of Exeter upon the First Epistle of Saint Peter</cite>, ... (1560; London: Day, 1565), Lecture 7, Now to the Romish Church, Response, 3. Schismatical, p. 246 Alley was the Anglican bishop of Exeter during the reign of Queen Elizabeth I.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-e518acecc7" data-kw="">
<blockquote><p>I deny that want [lack] of future obedience in personal transgessions does argue that no Covenant has been made, or then to be disanulled: if so be, first, that the fundamental points of the Covenant be held by us, that is, that we do profess Him our God and no other; hold his Word to be our rule and none other; his sacraments to be the seals and none other: for in these three is the foundation of the Covenant, the persons one and the same, the writings one and the same, the seals one and the same: this binds each party to [the] other to perform the particulars of the Covenant thus made, and the party offending in some things for matter of fact, not disanulling any of these three, is only liable to reproof and punishment, but yet the Covenant does stand firm. A man and a woman do covenant together lawfully in marriage, the word of mutual promise passes solemnly between them to performe mutual duties, and the man gives a token to confirm the profession of his love and truth therein, which she receives: now she after is a very disobedient wife, and breaks the particulars of the covenant; but herein is she just, she holds none other [than] her husband; she stands unto the general covenant, and she keeps the token thereof: Though she be disobedient otherwise in many things, yet is there a covenant made and remains, so as yet there is true man and wife. And thus is it with his Church, as the example of the Israelites does show; of whom it is said that they were a stiff-necked people, Dt. 9:6, who often provoked God to anger, Ps. 95, and always resisted the Holy Ghost: Acts 7:51, yet had they covenanted with God, as Dt. 26:17, Moses tells them. Secondly, if the Lord on his part break not, the Covenant holds: for though the Lord complain that Israel had broken Covenant, yet were they for all that his people, until He cast them off and chose another to serve Him. It cannot be proved therefore that a people have not covenanted with God because of their personal evils in the Church; nor that therefore they be none of the Lord’s people, except it can be also proved that God has cast them off and chosen others. Now also I assume the latter part of the consequence, which is this: We have visibly covenanted with God to have Him for our God. We do hear the Word preached, we do profess faith to that Word, we entertain it as God’s Word; and we do receive the sacraments; our words, writings, and practice show this to be true. And therefore if these have made other people to be in Covenant with God, then the same do so make us in Covenant with God. And therefore also have we the form of a true Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical</cite>, ... (London: 1610) | 8th Error of the Brownists, pp. 279-81</span></figcaption>

<blockquote><p>2. Whether a separation may be iustly made from our Church for some errors or corruptions of life. I know that diverse who were once among us, never of us, have put out their own lights, indeed excommunicated themselves. What’s their plea? That our assemblies are full of enormities. I answer: That the defects and corruptions of a Church must be distinguished: they are either in doctrine or in manners. For doctrine, some errors are Citra fundamentum, some Circa fundamentum, others Contra fundamentum. Errors beside the foundation trouble, errors about the foundation shake, errors against the foundation ouerturn all. So long then as no foundation is harmed, it is not lawful depart until the Church separates from Christ, we must not separate from it. In two cases there is warrant of separation: First, when the substance of God’s worship is quite corrupted. What agreement has the Temple of God with idols? (2 Cor. 6:16) When this is, verse 17, ‘Come out from among them, and be ye separate, says the Lord,’ When Jeroboam had set up idols in Israel, the priests and the Levites left their suburbs and possession and came to Judah and Jerusalem. (2 Chron. 11:14) Secondly, when the substance of doctrine is quite corrupted. If any man consent not to the words of our Lord Jesus Christ, and to the doctrine which is according to godliness, etc. (1 Tim. 6:3) ‘From such,’ verse 5, ‘withdraw thyself.’ Paul in the synagogue at Ephesus preached for the space of three months together. (Acts 19:9) But when diverse were hardened, and believed not, but spake evil of that way, he departed from them, and separated the disciples. In these two cases lawful, not else.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. Whether a separation may be iustly made from our Church for some errors or corruptions of life. I know that diverse who were once among us, never of us, have put out their own lights, indeed excommunicated themselves. What’s their plea? That our assemblies are full of enormities. I answer: That the defects and corruptions of a Church must be distinguished: they are either in doctrine or in manners. For doctrine, some errors are Citra fundamentum, some Circa fundamentum, others Contra fundamentum. Errors beside the foundation trouble, errors about the foundation shake, errors against the foundation ouerturn all. So long then as no foundation is harmed, it is not lawful depart until the Church separates from Christ, we must not separate from it. In two cases there is warrant of separation: First, when the substance of God’s worship is quite corrupted. What agreement has the Temple of God with idols? (2 Cor. 6:16) When this is, verse 17, ‘Come out from among them, and be ye separate, says the Lord,’ When Jeroboam had set up idols in Israel, the priests and the Levites left their suburbs and possession and came to Judah and Jerusalem. (2 Chron. 11:14) Secondly, when the substance of doctrine is quite corrupted. If any man consent not to the words of our Lord Jesus Christ, and to the doctrine which is according to godliness, etc. (1 Tim. 6:3) ‘From such,’ verse 5, ‘withdraw thyself.’ Paul in the synagogue at Ephesus preached for the space of three months together. (Acts 19:9) But when diverse were hardened, and believed not, but spake evil of that way, he departed from them, and separated the disciples. In these two cases lawful, not else.”

— Thomas Adams, The Happiness of the Church, or a Description of those Spiritual Prerogatives wherewith Christ has endowed her, considered in some Contemplations upon part of the 12th Chapter of the Hebrews (London, 1619), ‘To the General Assembly, and Church of the Firstborn which are Written in Heaven,’, pp. 66-67">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+Whether+a+separation+may+be+iustly+made+from+our+Church+for+some+errors+or+corruptions+of+life.+I+know+that+diverse+who+were+once+among+us%2C+never+of+us%2C+have+put+out+their+own+lights%2C+indeed+excommunicated+themselves.+What%E2%80%99s+their+plea%3F+That+our+assemblies+are+full+of+enormities.+I+answer%3A+That+the+defects+and+corruptions+of+a+Church+must+be+distinguished%3A+they+are+either+in+doctrine+or+in+manners.+For+doctrine%2C+some+errors+are+Citra+fundamentum%2C+some+Circa+fundamentum%2C+others+Contra+fundamentum.+Errors+beside+the+foundation+trouble%2C+errors+about+the+foundation+shake%2C+errors+against+the+foundation+ouerturn+all.+So+long+then+as+no+foundation+is+harmed%2C+it+is+not+lawful+depart+until+the+Church+separates+from+Christ%2C+we+must+not+separate+from+it.+In+two+cases+there+is+warrant+of+separation%3A+First%2C+when+the+substance+of+God%E2%80%99s+worship+is+quite+corrupted.+What+agreement+has+the+Temple+of+God+with+idols%3F+%282+Cor.+6%3A16%29+When+this+is%2C+verse+17%2C+%E2%80%98Come+out+from+among+them%2C+and+be+ye+separate%2C+says+the+Lord%2C%E2%80%99+When+Jeroboam+had+set+up+idols+in+Israel%2C+the+priests+and+the+Levites+left+their+suburbs+and+possession+and+came+to+Judah+and+Jerusalem.+%282+Chron.+11%3A14%29+Secondly%2C+when+the+substance+of+doctrine+is+quite+corrupted.+If+any+man+consent+not+to+the+words+of+our+Lord+Jesus+Christ%2C+and+to+the+doctrine+which+is+according+to+godliness%2C+etc.+%281+Tim.+6%3A3%29+%E2%80%98From+such%2C%E2%80%99+verse+5%2C+%E2%80%98withdraw+thyself.%E2%80%99+Paul+in+the+synagogue+at+Ephesus+preached+for+the+space+of+three+months+together.+%28Acts+19%3A9%29+But+when+diverse+were+hardened%2C+and+believed+not%2C+but+spake+evil+of+that+way%2C+he+departed+from+them%2C+and+separated+the+disciples.+In+these+two+cases+lawful%2C+not+else.%E2%80%9D%0A%0A%E2%80%94+Thomas+Adams%2C+The+Happiness+of+the+Church%2C+or+a+Description+of+those+Spiritual+Prerogatives+wherewith+Christ+has+endowed+her%2C+considered+in+some+Contemplations+upon+part+of+the+12th+Chapter+of+the+Hebrews+%28London%2C+1619%29%2C+%E2%80%98To+the+General+Assembly%2C+and+Church+of+the+Firstborn+which+are+Written+in+Heaven%2C%E2%80%99%2C+pp.+66-67&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaba72d093.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eaba72d093.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=2.%20Whether%20a%20separation%20may%20be,these%20two%20cases%20lawful%2C%20not%20else&amp;text=2.%20Whether%20a%20separation%20may%20be%20iustly%20made&amp;text=disciples.%20In%20these%20two%20cases%20lawful%2C%20not%20else" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

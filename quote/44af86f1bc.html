<blockquote><p>What is the Magistrate’s part?

To see that all within his Gates keep the Lord’s Day (Jos. 24. 15) even Strangers, though Turks and infidels (Nehem. 13. 15) causing them to cease from Labor, and restraining them from all open and public idolatry, or false Worship of God; much more all his own Subjects, whom he ought to force to hear the Word, 2 Chron. 34. 33.</p></blockquote>

<blockquote><p>…the spiritual worship of the inward man, and [that is] the very ground and foundation of all true worship of God: for God is a spirit and therfore must be worshipped in spirit [Jn. 4:24], that is, in the the mind, conscience, will, and affections. Indeed all the worship of God is spiritual, even that which we call outward; yet not of itself, but by virtue of the inward, from which it proceeds. The heads of inward worship are two: adoration of God and cleaving to God… The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22… Now we cleave unto God by four things: by faith, hope, love and inward invocation… we are to lift up our hearts unto God, upon every occasion, that by inward and holy motions and affections they may be (as it were) knit unto Him. Now to conclude this point touching inward worship, we must remember that it alone is properly, simply, and of itself the worship of God; and the outward is not simply the worship of God, but only so far forth as it is quickened by the inward, and grounded upon it. For God is a Spirit, and therefore the true worship that is done unto Him must be performed in spirit and truth, Jn. 4:24.</p></blockquote>

<blockquote><p>Prejudice against color! To the writer it always seemed not only cruel and mean but also unaccountable. And here I leave my record that, as far as I can remember, from my early life and on through all these years I was a stranger to the feeling. To God be all the praise, for he gave me anti-slavery parents and these gave me anti-slavery books to read; and I so early was trained in an anti-slavery school that I can not remember when I became an Abolitionist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/n-r-johnston.html">N. R. Johnston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking back from the sunset land or people worth knowing</cite>, (Oakland, 1898), p. 70.</span></figcaption>

</figure><figure class="quote" id="q-71ec75c516" data-kw="">
<blockquote><p>Your Argument is, A most successful and allowable Method of preventing Death, and many other grievous Miseries, by the Small Pox, is not only lawful but a Duty, to be used by those who apprehend their Lives endangered by the terrible Distemper. But, The managing and governing the Small Pox, in the way of Inoculation, is a most successful and allowable Method of preventing Death, and many other grievous Miseries by this dreadful Distemper. Therefore, it is not only lawful, but also a Duty to make use of it.

Sir, You tell me, None but very foolish and very wicked People will deny the Proposition. How can you tell that? Are you only capable to tell a Man what he must not do, and if he doth that which you think not good, must you enter into Judgment, and pronounce him very foolish and very wicked.

Sir, Whatever you think of your Proposition, I think it a poor and a beggarly thing, to take that for granted which is denied, to put into your Proposition.

I shall first tell you, that the Word Allowable is ambiguous, and shall distinguish and enquire what you mean by it: If you mean human Authority, I shall take no Notice of it. To the law and to the Testimony, and if they speak not according unto that, it is because there is no Light in them. But if you mean an allowable Way by the Law of Physick, then I deny your Proposition. And now let us see who is the Fool. Your Proposition is, That it is a most successful and allowable Method of preventing Death. Now we fear there are many in the Grave the More for it; therefore we cannot believe that it is a successful Way of preventing Death.

And now I deny the Consequence of your Minor Proposition, and say, that cannot be accounted a safe way, which hath an evil Tendency, and a bad end, (eventually Death) of more than it hath saved alive; not to be allowed, except God says Amen to it. You go on to say, The Testimonies that our People have been frighted with, are not worth a Straw; no Man of Sense that confiners them, can lay weight upon them. Answer: If you are a man of sense, if you consider my Arguments, they will bring you upon the Careen [?].

Again you bid us ask you not why you say so: But I hope you will not take it amiss, if I ask you, why you bid us not ask you, &amp; if you will not answer me, suffer me to draw natural Conclusions; as first, because you could not. 2. because you affect a Despotic Power, and would have us pin our Faith upon your sleeve. But hold, Sir, you are not so high now, but that there is more ways than one to come at you; and our Faith cannot be swallowed up in your belief, unless you tell us a reason why you say so. In the next place you say, Experience will tell us that there was never a more unfailable method amongst the Children of Men. Hold Sir, suppose I tell you of two as successful, to wit, to cure Agues. The first is to wear a Spell about the Neck, next to the Skin; I can tell you too how to make it, and what Words are used in it.

2dly, The writing the Person’s Name that hath the Ague, by the hand of a Seventh Son, and he slitting the Rine of an Elder-Tree, and opening it, and putting the Piece of Paper in, will cure the Ague: And they tell you of much Virtue in the Seventh Son, and also of the Elder Tree; and they, do not say ask them not, but tell us the Reason why they say so, to wit, because Judas hanged himself on it. I could tell you of many more such Things, with respect to the Event, which are good to a Person or People; but that does not prove it to be lawful, which you should have done, if you understand your Argument.

I will load Success a little further, it may be you may think too far. It was good that Satan should be dispossessed of his Habitation which he had taken up in Men in our Lord’s Day; but it was not lawful that the Children of the Pharisees should cast them out by the help of Beelzebub: We must always have an Eye to the Matter of what we do as well as to the Result, if we intend to keep a good Conscience towards God.

From the Means and End of effecting the Action, it is well or ill disposed. ‘Tis a Duty to go to hear God’s Word preached, but ’tis unlawful to steal a Horse to ride to hear it. ‘Tis lawful to preserve Life, but it must be in a lawful way. All Circumstances must concur to make the Action good: The failing but in one Circumstance doth make the Action evil. See Hag. 2. 11, 12, 13, 14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-williams.html">John Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several arguments, proving, that inoculating the small pox is not contained in the law of physick, either natural or Divine, and therefore unlawful. Together with a reply to two short pieces, one by the Rev. Dr. Increase Mather, and another by an anonymous author, intituled, Sentiments on the small </cite>, (Boston MA: J. Franklin, 1721), pp 10-12.</span></figcaption>

e+many+in+the+Grave+the+More+for+it%3B+therefore+we+cannot+believe+that+it+is+a+successful+Way+of+preventing+Death.%0A%0AAnd+now+I+deny+the+Consequence+of+your+Minor+Proposition%2C+and+say%2C+that+cannot+be+accounted+a+safe+way%2C+which+hath+an+evil+Tendency%2C+and+a+bad+end%2C+%28eventually+Death%29+of+more+than+it+hath+saved+alive%3B+not+to+be+allowed%2C+except+God+says+Amen+to+it.+You+go+on+to+say%2C+The+Testimonies+that+our+People+have+been+frighted+with%2C+are+not+worth+a+Straw%3B+no+Man+of+Sense+that+confiners+them%2C+can+lay+weight+upon+them.+Answer%3A+If+you+are+a+man+of+sense%2C+if+you+consider+my+Arguments%2C+they+will+bring+you+upon+the+Careen+%5B%3F%5D.%0A%0AAgain+you+bid+us+ask+you+not+why+you+say+so%3A+But+I+hope+you+will+not+take+it+amiss%2C+if+I+ask+you%2C+why+you+bid+us+not+ask+you%2C+%26+if+you+will+not+answer+me%2C+suffer+me+to+draw+natural+Conclusions%3B+as+first%2C+because+you+could+not.+2.+because+you+affect+a+Despotic+Power%2C+and+would+have+us+pin+our+Faith+upon+your+sleeve.+But+hold%2C+Sir%2C+you+are+not+so+high+now%2C+but+that+there+is+more+ways+than+one+to+come+at+you%3B+and+our+Faith+cannot+be+swallowed+up+in+your+belief%2C+unless+you+tell+us+a+reason+why+you+say+so.+In+the+next+place+you+say%2C+Experience+will+tell+us+that+there+was+never+a+more+unfailable+method+amongst+the+Children+of+Men.+Hold+Sir%2C+suppose+I+tell+you+of+two+as+successful%2C+to+wit%2C+to+cure+Agues.+The+first+is+to+wear+a+Spell+about+the+Neck%2C+next+to+the+Skin%3B+I+can+tell+you+too+how+to+make+it%2C+and+what+Words+are+used+in+it.%0A%0A2dly%2C+The+writing+the+Person%E2%80%99s+Name+that+hath+the+Ague%2C+by+the+hand+of+a+Seventh+Son%2C+and+he+slitting+the+Rine+of+an+Elder-Tree%2C+and+opening+it%2C+and+putting+the+Piece+of+Paper+in%2C+will+cure+the+Ague%3A+And+they+tell+you+of+much+Virtue+in+the+Seventh+Son%2C+and+also+of+the+Elder+Tree%3B+and+they%2C+do+not+say+ask+them+not%2C+but+tell+us+the+Reason+why+they+say+so%2C+to+wit%2C+because+Judas+hanged+himself+on+it.+I+could+tell+you+of+many+more+such+Things%2C+with+respect+to+the+Event%2C+which+are+good+to+a+Person+or+People%3B+but+that+does+not+prove+it+to+be+lawful%2C+which+you+should+have+done%2C+if+you+understand+your+Argument.%0A%0AI+will+load+Success+a+little+further%2C+it+may+be+you+may+think+too+far.+It+was+good+that+Satan+should+be+dispossessed+of+his+Habitation+which+he+had+taken+up+in+Men+in+our+Lord%E2%80%99s+Day%3B+but+it+was+not+lawful+that+the+Children+of+the+Pharisees+should+cast+them+out+by+the+help+of+Beelzebub%3A+We+must+always+have+an+Eye+to+the+Matter+of+what+we+do+as+well+as+to+the+Result%2C+if+we+intend+to+keep+a+good+Conscience+towards+God.%0A%0AFrom+the+Means+and+End+of+effecting+the+Action%2C+it+is+well+or+ill+disposed.+%E2%80%98Tis+a+Duty+to+go+to+hear+God%E2%80%99s+Word+preached%2C+but+%E2%80%99tis+unlawful+to+steal+a+Horse+to+ride+to+hear+it.+%E2%80%98Tis+lawful+to+preserve+Life%2C+but+it+must+be+in+a+lawful+way.+All+Circumstances+must+concur+to+make+the+Action+good%3A+The+failing+but+in+one+Circumstance+doth+make+the+Action+evil.+See+Hag.+2.+11%2C+12%2C+13%2C+14.%E2%80%9D%0A%0A%E2%80%94+John+Williams%2C+Several+arguments%2C+proving%2C+that+inoculating+the+small+pox+is+not+contained+in+the+law+of+physick%2C+either+natural+or+Divine%2C+and+therefore+unlawful.+Together+with+a+reply+to+two+short+pieces%2C+one+by+the+Rev.+Dr.+Increase+Mather%2C+and+another+by+an+anonymous+author%2C+intituled%2C+Sentiments+on+the+small+%2C+%28Boston+MA%3A+J.+Franklin%2C+1721%29%2C+pp+10-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F71ec75c516.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/71ec75c516.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/11/23/john-williams-do-the-ends-justify-the-medical-means/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

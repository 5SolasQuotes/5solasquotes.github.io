<blockquote><p>7. A calling to the ministry is either such as wants the essentials, as gifts in any messenger, and the Churches’ consent, or these who occupy the room of the Church, the Church consenting, such a minister is to be reputed for no minister. Or. 2. An entry to a calling, or a calling, where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas who entered by favor and money, and contrary to the Law was High-Priest but for a year: yet was a true High-Priest, and prophesied as the High-Priest.

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud, the ordinance of God is conferred upon him and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165 | pt. 2, p. 228</span></figcaption>

<blockquote><p>19. But the election of Paul [who was likely unmarried at the time] and such other[s] ought not to move us but that in choosing the ministers of the Church we must follow the doctrine of the same apostle taught us in the epistle unto Timothy, where he will that those which be novices in religion should not be chosen, but they which have a good testimony. But it must be considered that the rules described unto Timothy were given unto men, from whom, seeing other men’s minds be hidden and that they be utterly ignorant what is in them, it behoves that they use the cautions described by the apostle, lest they err in their elections. But God rightly chooses his without those rules (Ps. 7:11; Jer. 11:20; Apoc. 2:23), “For He trieth the reigns and the hearts, and changeth the wills of men at his own pleasure.” Albeit some have said, that Paul in Judaism was of very honest conversation, as he himself testifies unto the Philippians (Phil. 2:6). And in the latter epistle to Timothy he writes that he had served God from his forefathers with a pure conscience. But I hold not with these men. For I will not diminish his fault in persecuting of the Church, seeing Paul did so greatly after a sort reproach himself with the same. Wherefore when I allow of the solution now brought, this comes to mind that the canons which the apostle delivered unto Timothy are not always kept even as touching men. For Ambrose, the Bishop of Milan, when he was yet a novice, and youngling in the faith, was placed in the See of the Church. For he was sent from the emperor to execute the office of Praetor. (Margin Note: The commandments of God so far as sometime one gives place to another) Here the adversaries vaunt against us, that it is lawful sometimes to deal against the holy Scriptures, and that the words of God are not most steadfast. But we must note that the precepts of God sometime have not their own strength, neither in very deed be precepts. For when two precepts meet together so as they cross one another, whereof the one is more excellent than the other, and God would have that chiefly to be done than the other which is of less excellency, and as touching the will of God, inferior, gives place unto the first and has not the [obliging] authority of a commandment [in that situation]: because God would not have it to be done in that place and at that time. Even as Christ taught as touching the drawing of an ox and an ass out of a pit on the Sabboth day (Lk. 14:5). By which means He excused his disciples who had plucked off the ears of the corn on the Sabboth day (Matt 12:1) and had rubbed out the grain. And He often times testified that He would have mercy and not sacrifice. (Ibid., v. 7). The Church of Milan therefore was greatly molested by the Arians: it had need of a bishop and specially of a teacher that should be of great authority. These things were perceived to be in Ambrose. Neither was there any other fit man presented. Whereby that Church was quit from the other precept which was of less excellency, wherein it was commanded to beware of novices, or those which were not fully instructed. And of this matter it seems to be enough to have spoken somewhat by the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, (1583), 4th Part, ch. 1, ‘Of Calling, and Especially unto the Ministry’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>III. Whether there can be regeneration of adults without antecedent or conjoined external calling through the Word externally set forth; and whether de facto there has been such? Response: The former is not to be denied. To the latter we say that ordinarily it does not happen, according to Rom. 10:15, 17; 1 Cor. 1 [1:21]; 2 [2:4-5], 21 [This should be different], compared with Ps. 147 [vv. 19-20]; Eph. 2:11–12. Nor do I see any example adduced after the new covenant was established. Concerning Abraham, it can be said that he had in his paternal family the external Word handed down from hand to hand through the patriarchs. Concerning Adam and Eve, it can be said that they were the first in whom God established the church after the fall, from whom thenceforth the church was propagated through the external Word. Nor is it certain that their first conversion was accomplished without some Word sounding externally (although in an extraordinary manner, because it was necessary first to establish the order and to begin from them).</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“III. Whether there can be regeneration of adults without antecedent or conjoined external calling through the Word externally set forth; and whether de facto there has been such? Response: The former is not to be denied. To the latter we say that ordinarily it does not happen, according to Rom. 10:15, 17; 1 Cor. 1 [1:21]; 2 [2:4-5], 21 [This should be different], compared with Ps. 147 [vv. 19-20]; Eph. 2:11–12. Nor do I see any example adduced after the new covenant was established. Concerning Abraham, it can be said that he had in his paternal family the external Word handed down from hand to hand through the patriarchs. Concerning Adam and Eve, it can be said that they were the first in whom God established the church after the fall, from whom thenceforth the church was propagated through the external Word. Nor is it certain that their first conversion was accomplished without some Word sounding externally (although in an extraordinary manner, because it was necessary first to establish the order and to begin from them).”

— Gisbertus Voetius, Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+Whether+there+can+be+regeneration+of+adults+without+antecedent+or+conjoined+external+calling+through+the+Word+externally+set+forth%3B+and+whether+de+facto+there+has+been+such%3F+Response%3A+The+former+is+not+to+be+denied.+To+the+latter+we+say+that+ordinarily+it+does+not+happen%2C+according+to+Rom.+10%3A15%2C+17%3B+1+Cor.+1+%5B1%3A21%5D%3B+2+%5B2%3A4-5%5D%2C+21+%5BThis+should+be+different%5D%2C+compared+with+Ps.+147+%5Bvv.+19-20%5D%3B+Eph.+2%3A11%E2%80%9312.+Nor+do+I+see+any+example+adduced+after+the+new+covenant+was+established.+Concerning+Abraham%2C+it+can+be+said+that+he+had+in+his+paternal+family+the+external+Word+handed+down+from+hand+to+hand+through+the+patriarchs.+Concerning+Adam+and+Eve%2C+it+can+be+said+that+they+were+the+first+in+whom+God+established+the+church+after+the+fall%2C+from+whom+thenceforth+the+church+was+propagated+through+the+external+Word.+Nor+is+it+certain+that+their+first+conversion+was+accomplished+without+some+Word+sounding+externally+%28although+in+an+extraordinary+manner%2C+because+it+was+necessary+first+to+establish+the+order+and+to+begin+from+them%29.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6ac434a282.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6ac434a282.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-calling/#:~:text=III.%20Whether%20there%20can%20be%20regeneration,order%20and%20to%20begin%20from%20them&amp;text=II

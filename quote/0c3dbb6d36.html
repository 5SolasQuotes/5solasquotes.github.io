<blockquote><p>It is asked, sixth, whether original sin consists only in the privation of original righteousness… The papists certainly acknowledge an original righteousness, but one which was not natural to man, but a supernatural gift, like a certain golden bridle, conferred upon natural man to restrain the conflict between the flesh and the spirit. So that they may obtain that the things natural to man, among which is free choice, have remained unwounded by the fall of our first parents, and likewise so that they may hold to this conflict between the flesh and the spirit, or the concupiscence of the flesh against the spirit, and thus that, such conflict notwithstanding, in this life man can be morally perfect, they state that original sin does not consist in anything but the privation of original righteousness, through which the spirit, in the conflict with the flesh, devoid of the assistance of original righteousness, contracted a languor through which it cannot as promptly and successfully repress the attacks of the flesh. The opinion of the Reformed with their reasons. The Reformed on the contrary, because they believe that original righteousness was natural, that is, owed to a morally intact nature, state that not only was original righteousness taken away on account of the fall, but by the same stroke the entire nature of man was so morally corrupted as regards the intellect, the will, the affections, that by nature he is blind in respect to all spiritual truth, likewise incompetent for any spiritual good, and prone to all evil in respect to his will.</p></blockquote>

<blockquote><p>§XVII. The ultimate judgment of the practical intellect is indeed a condition without which the will does not ordinarily operate; In the meantime, however, the will is not determined by the practical judgment of the intellect. Which, against the Thomists and certain of the Reformed, to whom Bellarmine accedes here in bk. 3 of On Grace &amp; Free Will, ch. 8, the Scotists and others rightly deny, who teach that the ultimate judgment of the practical intellect does not necessarily determine the will, for: (1) Scripture teaches that men often act, or choose something against the light of the intellect, or the dictate of right reason and grace, as in: Job 21:14, ‘They said to God, depart from us, we do not want the knowledge of thy ways.’ Ch. 24:13, ‘They were rebellious to the light.’ Lk. 12:47, ‘The servant who knew the will of his Lord, and did not prepare himself, nor did according to his will, will be beaten with many stripes.’ Jm. 4:17, ‘To him who knows to do good and does it not, to him it is sin.’ (2) Whence they are damned who have acted against the dictate of the intellect or of right reason. Jn. 3:19, ‘This is the judgment, because men loved darkness more than the light: for their works were evil.’ Rom. 2:1-2, ‘Thou art inexcusable, O man, whosoever thou art that judgest. For wherein thou judgest another, thou condemnest thyself: for thou dost the same things which thou judgest.’ vv. 17-18 ff., ‘If thou art called a Jew, and restest in the law, and makest thy boast of God, and knowest his will, and approvest the more profitable things, being instructed by the law, art confident that thou thyself art a guide of the blind, a light of them that are in darkness, an instructor of the foolish, a teacher of infants, having the form of knowledge and of truth in the law. Thou therefore that teachest another, teachest not thyself? thou that preachest that men should not steal, stealest? Thou that sayest, men should not commit adultery, dost thou commit adultery? thou that abhorrest idols, dost thou commit sacrilege? Thou that makest thy boast of the law, by transgression of the law dishonourest God.’ Eze. 12:2, ‘They have eyes to see, and see not: and ears to hear, and hear not: for they are a provoking house.’ cf. Eze. 33:31-32; Zech. 7:11-12; Jer. 6:16-17; Jn. 5:40; ch. 8:46; ch. 15:22; Acts 7:51; ch. 13:46; Mt. 11:21. (3) If the will were necessarily determined by the ultimate judgment of the practical intellect, it would follow that the will acts not freely but naturally. (4) This opinion being admitted, the will would not be an active faculty that moves and determines, but a passive one, moved and determined; which should rather be said of the intellect. (5) It would follow that the will could never prefer a lesser good to a greater good; and (6) from two equal goods it could choose neither. But experience teaches the contrary. (7) There would be no voluntary, deliberate sins against conscience; against the passages cited in n. 2; for to sin voluntarily and against conscience is to cry out against the ultimate judgment of the practical intellect. (8) There would be no blasphemy against the Holy Spirit, against Mt. 12:31-32; Mk. 3:28-29; Heb. 6:4-6; 10:29. The intellect therefore moves the will indeed, but not physically, but morally, as a guide, not as a master; and the will depends on the intellect, but not as from an effective principle of volition, but as from a condition without which it would not be. In agreement are: Peter Molinæus, Enodatio Gravissimarum Quaestionum, Tract 6, quest. 2, p. 192; Ames, On Conscience &amp; its Law or Cases, bk. 1, ch. 7, §6-7; Robert Baron, Metaphysica Generalis, sect. 12, disp. 1, n. 20, 29 ff., pp. 325, 335 ff.; G.J. Voss, On Idolatry, §3, ch. 43; Dn. D. Samuel Strimesius, Praxiologia Apodictica, ch. 3, subsect. 3, art. 1, §10 ff.; Baxter, Method of Theology, pt. 1, ch. 5, n. 35-37, p. 160; ch. 8, n. 106, p. 208; ch. 14, n. 68-70, pp. 276-77; and from the Cartesian hypothesis, Burmann, Synopsis, bk. 2, ch. 11, §5; Wittich, Pacific Theology, ch. 11, §126-27. Compare also Hornejus, Moral Philosophy, bk. 2, ch. 5-6, 10 ff.; and from the Scholastics, Suarez, Metaphysical Disputations, 19, sect. 6, n. 2; Becanus, Scholastic Theology, pt. 2, tract 1, ch. 2, quest. 5; Arriaga, Disputations on Physics, 8, sect. 2; Fonseca, etc.; also Boyvin, Philosophy of Scotus, pt. 4, pt. 1, disp. 2, quest. 1 and Theology of Scotus, pt. 2, Tract on the Grace of Christ, ch. 2, quest. 4.</p></blockquote>

ion%2C+but+as+from+a+condition+without+which+it+would+not+be.+In+agreement+are%3A+Peter+Molin%C3%A6us%2C+Enodatio+Gravissimarum+Quaestionum%2C+Tract+6%2C+quest.+2%2C+p.+192%3B+Ames%2C+On+Conscience+%26+its+Law+or+Cases%2C+bk.+1%2C+ch.+7%2C+%C2%A76-7%3B+Robert+Baron%2C+Metaphysica+Generalis%2C+sect.+12%2C+disp.+1%2C+n.+20%2C+29+ff.%2C+pp.+325%2C+335+ff.%3B+G.J.+Voss%2C+On+Idolatry%2C+%C2%A73%2C+ch.+43%3B+Dn.+D.+Samuel+Strimesius%2C+Praxiologia+Apodictica%2C+ch.+3%2C+subsect.+3%2C+art.+1%2C+%C2%A710+ff.%3B+Baxter%2C+Method+of+Theology%2C+pt.+1%2C+ch.+5%2C+n.+35-37%2C+p.+160%3B+ch.+8%2C+n.+106%2C+p.+208%3B+ch.+14%2C+n.+68-70%2C+pp.+276-77%3B+and+from+the+Cartesian+hypothesis%2C+Burmann%2C+Synopsis%2C+bk.+2%2C+ch.+11%2C+%C2%A75%3B+Wittich%2C+Pacific+Theology%2C+ch.+11%2C+%C2%A7126-27.+Compare+also+Hornejus%2C+Moral+Philosophy%2C+bk.+2%2C+ch.+5-6%2C+10+ff.%3B+and+from+the+Scholastics%2C+Suarez%2C+Metaphysical+Disputations%2C+19%2C+sect.+6%2C+n.+2%3B+Becanus%2C+Scholastic+Theology%2C+pt.+2%2C+tract+1%2C+ch.+2%2C+quest.+5%3B+Arriaga%2C+Disputations+on+Physics%2C+8%2C+sect.+2%3B+Fonseca%2C+etc.%3B+also+Boyvin%2C+Philosophy+of+Scotus%2C+pt.+4%2C+pt.+1%2C+disp.+2%2C+quest.+1+and+Theology+of+Scotus%2C+pt.+2%2C+Tract+on+the+Grace+of+Christ%2C+ch.+2%2C+quest.+4.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfuz%2C+%E2%80%98Theological+Dissertation+on+the+Free+Will+of+Man%E2%80%99+trans.+AI+by+Nosferatu+%28Frankfurt%3A+Zeitler%2C+1707%29%2C+pp.+9-11+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F775d6d6784.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/775d6d6784.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=XVII.%20The%20ultimate%20judgment%20of%20the,of%20Christ%2C%20ch.%202%2C%20quest.%204&amp;text=XVII.%20The%20ultimate%20judgment%20of%20the%20practical%20intellect&amp;text=the%20Grace%20of%20Christ%2C%20ch.%202%2C%20quest.%204" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a541fa9b54" data-kw="">
<blockquote><p>It is true that people, through corruption of nature, are averse to submit to governors ‘for conscience sake, as unto the Lord,’ because the natural man, remaining in the state of nature, can do nothing that is truly good, but it is false that men have no active moral power to submit to superiors, but only a passive capacity to be governed. He [John Maxwell] quite contradicts himself; for he said before (ch. 4, p. 49) that there is an ‘innate fear and reverence in the hearts of all men naturally, even in heathens, toward their sovereign;’ yea, as we have a natural moral active power to love our parents and superiors (though it be not evangelically, or legally in God’s court, good) and so to obey their commandments, only we are averse to penal laws of superiors. But this proves no way that we have only by nature a passive capacity to government; for heathens have, by instinct of nature, both made laws morally good, submitted to them, and set kings and judges over them, which clearly proves that men have an active power of government by nature. Yea, what difference makes the Prelate betwixt men and beasts? for beasts have a capacity to be governed, even lions and tigers; but here is the matter, if men have any natural power of government, the Popish Prelate would have it, with his brethren the Jesuits and Arminians, to be not natural, but done by the help of universal grace; for so do they confound nature and grace. But it is certain our power to submit to rulers and kings, as to rectors, and guides, and fathers, is natural;</p></blockquote>

<blockquote><p>5. In what sense is this inability absolute, and in what sense natural, and in what sense moral? … 4th. It is not natural in another sense, because it does not result in the least from any constitutional deficiency in human nature as it now exists as to its rational and moral faculties of soul. 5th. This inability is purely moral, because while every responsible man possess all moral as well as intellectual faculties requisite for right action, the moral state of his faculties is such that right action is impossible. Its essence is in the inability of the soul to know, love, or choose spiritual good, and its ground exists in that moral corruption of soul whereby it is blind, insensible, and totally averse to all that is spiritually good.</p></blockquote>

</figure><figure class="quote" id="q-d00bd64bf3" data-kw="">
<blockquote><p>Although the human will [according to the Roman Catholic Thomist, Domingo Banez] necessarily follows the divine will to attain the good, it does not do so with an absolute necessity (called “necessity of the consequent”) but only with a hypothetical and relative necessity (called “necessity of the consequence”). For example, the fact that the sun shines is an absolute necessity, provoked by the very nature of the sun; however, here we speak of a certain conditional or hypothetical necessity, such as the one the proposition “Peter is seated” has, while Peter is effectively seated. It is not absolutely necessary for Peter to be seated, but, if he is seated, then it is necessary for him (with necessity of consequence) to be seated. Likewise, if God, with his efficacious grace, moves a man here and now to conversion, it is necessary that he performs his conversion, but he will do so freely, because he possesses the intrinsic capacity to do it or not. Moreover, God does not concur in the human act as a partial cause, as Molina thought, but as a principal total cause, while the created free will is also a total but subordinate cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kinds-of-necessity.html">David Torrijos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘De Auxiliis Controversy’, ‘Bañezianism’ in eds. Mário Santiago de Carvalho &amp; Simone Guidi, Conimbricenses.org Encyclopedia</cite></span></figcaption>

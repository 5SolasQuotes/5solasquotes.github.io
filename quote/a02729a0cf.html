<main class="wrap"><figure class="quote" id="q-a02729a0cf" data-kw="">
<blockquote><p>If princes do right and keep promise with you, then do you owe to them all humble obedience: if not, ye are discharged, and your study ought to be in this case how ye may depose and punish according to the law such rebels against God and oppressors of their country.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-goodman.html">Christopher Goodman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Obedience, p. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d2531b3c4" data-kw="">
<blockquote><p>1 Pet. 2:13 ‘Submit yourselves to every ordinance of man for the Lord’s sake: whether it be to the king, as supreme…’ …But this creature, or ordinance, here is to be understood of the magistrate; (as appears by the following words), which is called human, not as if magistracy were not an ordinance of God, (for, Romans 13:1, ‘the powers that are are said to be ordained of God’) but either because it is only among men, and proper to them; or because it is of man secondarily and instrumentally, though of God primarily and originally, God making use of the ministry of men in bringing them into the magistracy… ‘For the Lord’s sake’; for God’s sake, who commands this obedience; and gave them the authority, and is represented by them, and honored by that obedience which is yielded to them in all things agreeable to his will. The phrase seems to be of the same import with that of being obedient in the Lord, Ephesians 6:1. ‘To the king’; to Caesar, the then supreme magistrate, under whose jurisdiction the Jewish Christians were; and this being a general command extending to all Christians, it follows, that obedience is due from them to those chief magistrates whose subjects respectively they are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations on the Holy Bible</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-c467d0fb58" data-kw="">

</figure><figure class="quote" id="q-9a966c6390" data-kw="">
<blockquote><p>And these were the Halcionian days which Ambrose himself declares and magnifies, even when Maximus had suppressed the Arrians, En tempus acceptabile! quo non hiemalibus perfidiae caligantis pruinas annus riget, nec altis nivis, etc. ibid. Reader was not that time more strange than ours? that Ambrose must be so loyal as to save his prince and country from a usurper; and yet so pious as to be persecuted by his prince, and he and his brethren saved by that same usurper, and openly give praise to God for the great felicity of the Church which it received by that same usurper whom he so resisted?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Episcopacy</cite>, … (London: Simmons, 1681) | pt. 2, ch. 22, p. 210</span></figcaption>

</figure><figure class="quote" id="q-c4e8300ca3" data-kw="">
<blockquote><p>Absolute censorship of the Nazi data does not seem proper, especially when the secrets of saving lives may lie solely in its contents… When the value of the Nazi data is of great value to humanity, then the morally appropriate policy would be to utilize the data, while explicitly condemning the atrocities… To further justify its use, the scientific validity of the experiment must be clear; there must be no other alternative source from which to gain that information, and the capacity to save lives must be evident. …it must not be included as ordinary scientific research, just to be cited and placed in a medical journal… citation of the data must contain a thorough expose’ of exactly what tortures and atrocities were committed for that experiment… [and it] must be accompanied with the author’s condemnation of the data… as medical evil, never to be repeated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/baruch-c-cohen.html">Baruch C. Cohen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Nazi Medical Experimentation</cite>, (n.d.) 115 paragraphs | It is clear that good can be, and has been brought out of the Nazis’ preserved data (which can’t be obtained in any other way), but should it? The main cost involved in doing so, besides the sheer revoltingness of it all, is the very scandal of the knowledge of these things becoming known. The article concludes:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“Absolute censorship of the Nazi data does not seem proper, especially when the secrets of saving lives may lie solely in its contents… When the value of the Nazi data is of great value to humanity, then the morally appropriate policy would be to utilize the data, while explicitly condemning the atrocities… To further justify its use, the scientific validity of the experiment must be clear; there must be no other alternative source from which to gain that information, and the capacity to save lives must be evident. …it must not be included as ordinary scientific research, just to be cited and placed in a medical journal… citation of the data must contain a thorough expose’ of exactly what tortures and atrocities were committed for that experiment… [and it] must be accompanied with the author’s condemnation of the data… as medical evil, never to be repeated.”

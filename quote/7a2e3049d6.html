<blockquote><p>Grace and Peace, two words, which comprehend all good: Grace, is the fountain of Gods free love; and Peace, the effect of that free love: which being here put together, is love, vented in its precious effects. The Persons from whom, are Three, or, the Three Persons of the Trinity, 1. From the Father, which is, which was, and which is to come, that is, from God the Father, described from His eternal being, without all beginning or ending.

And this description of the Father, relates to that of Exod. 3.14. I AM THAT I AM, hath sent me unto you: and it is a name that God often taketh to Himself, The first and the last, the beginning and the ending: and the Title JEHOVAH taketh up these three; JE, the future time; HO, the time present; VAH, the time past. In a word, it’s the paraphrase of the word JEHOVAH: and this title is attributed to the Father, not secluding the Son and Holy Ghost; but the Father, being the fountain of the Godhead, when He is joined with the Son and Spirit, those things that are essential to God, are ordinarily attributed to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), p. 4.</span></figcaption>

<blockquote><p>Great indeed is He Who deserves to be called the Son of the Most High. Is not He great whose immensity knows no limitation? Who is great as the Lord our God? It is He Who is as great as He is high yea, Who is Most High. As “Son of the Most High,” He thought it not robbery to equal Himself to the Most High. Satan, indeed, meditated robbery. Though made out of nothing in angelic form, he compared himself with his Maker, and arrogated to himself what belonged of right to the Son of the Most High, the Son not made by God, but begotten of Him.

For the Most High God the Father, though Omnipotent, could not make a creature equal to Himself, nor beget a Son who was not His equal. He made the angel great, but not as Himself, therefore not Most High. In one alone did He think it no robbery that He should equal Himself with Him in all things; the only-begotten Son, Who was not made, but begotten, by the Omnipotent, Omnipotent; by the Most High, Most High; by the Eternal, Co-eternal. Rightly, then, shall He be great Who shall be called the Son of the Most High.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of St. Bernard on Advent &amp; Christmas including the Famous Treatise on the Incarnation called “Missus Est”</cite>, ed. J. C. Hedley (1508; London: Paternoster, 1909), pp 57-58.</span></figcaption>

<blockquote><p>c. The eternal generation of the Son. The personal property of the Son is that He is eternally begotten of the Father (briefly called “filiation”), and shares with the Father in the spiration of the Spirit. The doctrine of the generation of the Son is suggested by the Biblical representation of the first and second persons of the Trinity as standing in the relation of Father and Son to each other. Not only do the names “Father” and “Son” suggest the generation of the latter by the former, but the Son is also repeatedly called “the only-begotten,” John 1:14, 18; 3:16, 18; Heb. 11:17; 1 John 4:9. Several particulars deserve emphasis in connection with the generation of the Son: (1) It is a necessary act of God. Origen, one of the very first to speak of the generation of the Son, regarded it as an act dependent on the Father’s will and therefore free. Others at various times expressed the same opinion. But it was clearly seen by Athanasius and others that a generation dependent on the optional will of the Father would make the existence of the Son contingent and thus rob Him of His deity. Then the Son would not be equal to and homoousios with the Father, for the Father exists necessarily, and cannot be conceived of as non-existent. The generation of the Son must be regarded as a necessary and perfectly natural act of God. This does not mean that it is not related to the Father’s will in any sense of the word. It is an act of the Father’s necessary will, which merely means that His concomitant will takes perfect delight in it. (2) It is an eternal act of the Father. This naturally follows from the preceding. If the generation of the Son is a necessary act of the Father, so that it is impossible to conceive of Him as not generating, it naturally shares in the eternity of the Father. This does not mean, however, that it is an act that was completed in the far distant past, but rather that it is a timeless act, the act of an eternal present, an act always continuing and yet ever completed. Its eternity follows not only from the eternity of God, but also from the divine immutability and from the true deity of the Son. In addition to this it can be inferred from all those passages of Scripture which teach either the pre-existence of the Son or His equality with the Father, Mic. 5:2; John 1:14, 18; 3:16; 5:17, 18, 30, 36; Acts 13:33; John 17:5; Col. 1:16; Heb. 1:3. The statement of Ps. 2:7, “Thou art my Son; this day have I begotten thee,” is generally quoted to prove the generation of the Son, but, according to some, with rather doubtful propriety, cf. Acts 13:33; Heb. 1:5. They surmise that these words refer to the raising up of Jesus as Messianic King, and to the recognition of Him as Son of God in an official sense, and should probably be linked up with the promise found in 2 Sam. 7:14, just as they are in Heb. 1:5. (3) It is a generation of the personal subsistence rather than of the divine essence of the Son. Some have spoken as if the Father generated the essence of the Son, but this is equivalent to saying that He generated His own essence, for the essence of both the Father and the Son is exactly the same. It is better to say that the Father generates the personal subsistence of the Son, but thereby also communicates to Him the divine essence in its entirety. But in doing this we should guard against the idea that the Father first generated a second person, and then communicated the divine essence to this person, for that would lead to the conclusion that the Son was not generated out of the divine essence, but created out of nothing. In the work of generation there was a communication of essence; it was one indivisible act. And in virtue of this communication the Son also has life in Himself. This is in agreement with the statement of Jesus, “For as the Father hath life in Himself, even so gave He to the Son also to have life in Himself,” John 5:26. (4) It is a generation that must be conceived of as spiritual and divine. In opposition to the Arians, who insisted that the generation of the Son necessarily implied separation or division in the divine Being, the Church Fathers stressed the fact that this generation must not be conceived in a physical and creaturely way, but should be regarded as spiritual and divine, excluding all idea of division or change. It brings distinctio and distributio, but no diversitas and divisio in the divine Being. (Bavinck) The most striking analogy of it is found in man’s thinking and speaking, and the Bible itself seems to point to this, when it speaks of the Son as the Logos. (5) The following definition may be given of the generation of the Son: It is that eternal and necessary act of the first person in the Trinity, whereby He, within the divine Being, is the ground of a second personal subsistence like His own, and puts this second person in possession of the whole divine essence, without any division, alienation, or change</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids, MI: Wm. B. Eerdmans publishing co., 1938), 93–94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

hat must be conceived of as spiritual and divine. In opposition to the Arians, who insisted that the generation of the Son necessarily implied separation or division in the divine Being, the Church Fathers stressed the fact that this generation must not be conceived in a physical and creaturely way, but should be regarded as spiritual and divine, excluding all idea of division or change. It brings distinctio and distributio, but no diversitas and divisio in the divine Being. (Bavinck) The most striking analogy of it is found in man’s thinking and speaking, and the Bible itself seems to point to this, when it speaks of the Son as the Logos. (5) The following definition may be given of the generation of the Son: It is that eternal and necessary act of the first person in the Trinity, whereby He, within the divine Being, is the ground of a second personal subsistence like His own, and puts this second person in possession of the whole divine essence, without any division, alienation, or change”

e+Father%2C+so+that+it+is+impossible+to+conceive+of+Him+as+not+generating%2C+it+naturally+shares+in+the+eternity+of+the+Father.+This+does+not+mean%2C+however%2C+that+it+is+an+act+that+was+completed+in+the+far+distant+past%2C+but+rather+that+it+is+a+timeless+act%2C+the+act+of+an+eternal+present%2C+an+act+always+continuing+and+yet+ever+completed.+Its+eternity+follows+not+only+from+the+eternity+of+God%2C+but+also+from+the+divine+immutability+and+from+the+true+deity+of+the+Son.+In+addition+to+this+it+can+be+inferred+from+all+those+passages+of+Scripture+which+teach+either+the+pre-existence+of+the+Son+or+His+equality+with+the+Father%2C+Mic.+5%3A2%3B+John+1%3A14%2C+18%3B+3%3A16%3B+5%3A17%2C+18%2C+30%2C+36%3B+Acts+13%3A33%3B+John+17%3A5%3B+Col.+1%3A16%3B+Heb.+1%3A3.+The+statement+of+Ps.+2%3A7%2C+%E2%80%9CThou+art+my+Son%3B+this+day+have+I+begotten+thee%2C%E2%80%9D+is+generally+quoted+to+prove+the+generation+of+the+Son%2C+but%2C+according+to+some%2C+with+rather+doubtful+propriety%2C+cf.+Acts+13%3A33%3B+Heb.+1%3A5.+They+surmise+that+these+words+refer+to+the+raising+up+of+Jesus+as+Messianic+King%2C+and+to+the+recognition+of+Him+as+Son+of+God+in+an+official+sense%2C+and+should+probably+be+linked+up+with+the+promise+found+in+2+Sam.+7%3A14%2C+just+as+they+are+in+Heb.+1%3A5.+%283%29+It+is+a+generation+of+the+personal+subsistence+rather+than+of+the+divine+essence+of+the+Son.+Some+have+spoken+as+if+the+Father+generated+the+essence+of+the+Son%2C+but+this+is+equivalent+to+saying+that+He+generated+His+own+essence%2C+for+the+essence+of+both+the+Father+and+the+Son+is+exactly+the+same.+It+is+better+to+say+that+the+Father+generates+the+personal+subsistence+of+the+Son%2C+but+thereby+also+communicates+to+Him+the+divine+essence+in+its+entirety.+But+in+doing+this+we+should+guard+against+the+idea+that+the+Father+first+generated+a+second+person%2C+and+then+communicated+the+divine+essence+to+this+person%2C+for+that+would+lead+to+the+conclusion+that+the+Son+was+not+generated+out+of+the+divine+essence%2C+but+created+out+of+nothing.+In+the+work+of+generation+there+was+a+communication+of+essence%3B+it+was+one+indivisible+act.+And+in+virtue+of+this+communication+the+Son+also+has+life+in+Himself.+This+is+in+agreement+with+the+statement+of+Jesus%2C+%E2%80%9CFor+as+the+Father+hath+life+in+Himself%2C+even+so+gave+He+to+the+Son+also+to+have+life+in+Himself%2C%E2%80%9D+John+5%3A26.+%284%29+It+is+a+generation+that+must+be+conceived+of+as+spiritual+and+divine.+In+opposition+to+the+Arians%2C+who+insisted+that+the+generation+of+the+Son+necessarily+implied+separation+or+division+in+the+divine+Being%2C+the+Church+Fathers+stressed+the+fact+that+this+generation+must+not+be+conceived+in+a+physical+and+creaturely+way%2C+but+should+be+regarded+as+spiritual+and+divine%2C+excluding+all+idea+of+division+or+change.+It+brings+distinctio+and+distributio%2C+but+no+diversitas+and+divisio+in+the+divine+Being.+%28Bavinck%29+The+most+striking+analogy+of+it+is+found+in+man%E2%80%99s+thinking+and+speaking%2C+and+the+Bible+itself+seems+to+point+to+this%2C+when+it+speaks+of+the+Son+as+the+Logos.+%285%29+The+following+definition+may+be+given+of+the+generation+of+the+Son%3A+It+is+that+eternal+and+necessary+act+of+the+first+person+in+the+Trinity%2C+whereby+He%2C+within+the+divine+Being%2C+is+the+ground+of+a+second+personal+subsistence+like+His+own%2C+and+puts+this+second+person+in+possession+of+the+whole+divine+essence%2C+without+any+division%2C+alienation%2C+or+change%E2%80%9D%0A%0A%E2%80%94+Louis+Berkhof%2C+Systematic+Theology%2C+%28Grand+Rapids%2C+MI%3A+Wm.+B.+Eerdmans+publishing+co.%2C+1938%29%2C+93%E2%80%9394&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F710c8b7e2a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/710c8b7e2a.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/06/berkhof-on-the-eternal-generation-of-the-son/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<main class="wrap"><figure class="quote" id="q-113e4d4b8c" data-kw="">
<blockquote><p>But if ye take it [“calling”] to be meant of the other calling which has a much larger scope, namely of the beholding (Rom. 1:19) of nature whereby is understood that which may be known of God: not even this other is so universally true as that it comprehends every several person. For how many have died and daily do die in such age as is utterly unfit for that contemplation? There cannot, nor may not, any calling, and much less any election, be warranted to be universal, but only to be indefinite: and that must also be only with an exclusion of these certain circumstances aforesaid.</p></blockquote>

<blockquote><p>It is very true, that things subordinate are not at variance. There is a natural end. As nature is subordinate to God, so natural ends are subordinate to those which are supernatural and divine. The end of our nature, so far as it is natural, is this, that it should approach very near to the Divine; so far as it is supernatural, it is that man may be united to God.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>The means for the knowledge of God: The more general means XIX. Now, concerning the supports by which we arrive at the knowledge of God, they are observed to be of two kinds. In the first more general kind are enumerated three ways to arrive at the knowledge of God, namely: (1) the way of causality, whereby having moved through various second causes as if by Jacob’s ladder, we finally arrive at the highest step, where God is, according to the mode which we described above in §VI. And this knowledge is what the apostle seems to indicate in Romans 1:19. (2) The way of eminence, by which whatever there is of absolute perfection in creatures we attribute with the highest eminence to the Creator, because of the fact that no one can confer on another what he does not have either formally or eminently, nor can an effect be conceived such that it is on the whole more excellent than its own cause. The psalmist seems to use this way in Psalm 94:9. Indeed, it is fitting by this support to interpret all anthropopathic and metaphorical expressions. (3) The way of negation, by which we entirely remove from him any imperfection that occurs in the creatures, for example, corporality, mortality, finitude, and the like. Scripture seems to follow this way in Numbers 23:19 and Psalm 90:2–3. And indeed in this manner, we arrive by this threefold way at the knowledge of God, such that (1) the first way chiefly leads to his relative attributes, through which he is called Creator, preserver, governor, and mover; (2) the second way leads to his communicable and affirmative attributes, for example, wisdom, righteousness, and so forth, which we will discuss in their own place; and (3) the third leads to his incommunicable and negative attributes, such as infinity, immutability, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 2, bk. 2, ch. 2, sect. 19, p. 56 The more specific means Mastricht lists as: (1) the divine names in Scripture, (2) the divine attributes in Scripture, (3) the works of God, (4) the Word of God.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>Paley’s argument presupposes that teleology is extrinsic; Aquinas follows Aristotle in holding that it is immanent to the natural order. Paley therefore focuses on complex phenomena, especially biological phenomena, as uniquely indicative of teleology; Aquinas takes all natural phenomena, however simple or complex and whether organic or inorganic, to manifest teleology. Paley is presenting a cumulative and probabilistic “argument to the best explanation”; Aquinas is putting forward a metaphysical demonstration… But Paley is at least seriously threatened by it [Darwinian evolution], while the Fifth Way is not threatened by it at all.</p></blockquote>

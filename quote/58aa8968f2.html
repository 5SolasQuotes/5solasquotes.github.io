<main class="wrap"><figure class="quote" id="q-58aa8968f2" data-kw="">
<blockquote><p>The act of Perth [1618] about kneeling would draw some commendation to this ceremony [of kneeling before the sacrament], from those words of the Psalm, ‘O come let us worship and bow down. let us kneel before the Lord our maker.’ [Ps. 95:6] Which is as if one should argue thus: We may worship before the lord. Therefore, before a creature. We may kneel in an immediate worship of God, Therefore in a mediate. For who sees not, that the kneeling there spoken of is a kneeling in the action of solemn praise and joyful noise of singing unto the Lord?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 6, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-5c9449eabd" data-kw="">
<blockquote><p>‘Worship,’ in our English tongue, and as it is used to express the original scriptures, is diversely taken. Sometime largely, as when it expresses the Greek word latreuo, as Phil. 3:3, ‘we are the circumcision which worship God in the spirit:’ and Acts 24:14, ‘so worship I the God of my fathers.’ And thus both the English &amp; Greek answers to the Hebrew ghnabad [עָבַד], which properly signifies to serve, Ex. 3:12; Dt. 10:12; 2 Sam. 15:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Holy Scriptures, Worship &amp; Ministery, used</cite>, ... (Amsterdam: Thorp, 1609), ‘Of Worship’, p. 5</span></figcaption>

</figure><figure class="quote" id="q-f72a8a70fc" data-kw="">
<blockquote><p>The scope, end and sum of this [2nd] Commandment is to order us in the solemn worship of God, called Heb. 9:1, ‘Ordinances of divine service,’ and usually termed ‘religious exercises.’ For the constituting of a solemn worship of God three things are required:

1. That it be done with immediate reference to God, and that Himself or something in his stead be made the object thereof, and so therein we draw near to Him, and He to us.

2. That it tend in the doer’s intention directly and of itself to the honoring of God and pleasing Him, and getting of grace from him, by exercising of some or all the virtues required in the First Commandment.

3. That there be a separating of ourselves from all other businesses to be wholly and altogether employed about such acts in which the difference between common and solemn worship does seem to stand. Worship consists in three things:

1. There must be a right knowledge and high apprehension of God, the person to be worshipped.

2. A reflexion of this knowledge.

3. An abasement of the creature under the reflexion of this knowledge, Rev. 5: Christ is represented as sitting on a throne. The people of God are there brought in as compassing Him about, they have high apprehensions of the person of Christ, his glory and holiness.

2. They reflect these excellencies.

3. They abase themselves, fall on their faces, vers. ult. Every religious exercise or ordinance of divine service has usually divers particular acts, that be as parts of the whole, and in the orderly uniting of which the whole is accomplished. And whatsoever is done in any such exercise of religion, for the end and purpose of pleasing God and getting grace from him with respect of conscience to Him (as esteeming that He must and will have it so, or else the service shall not be well-pleasing and acceptable to Him) this is a part of worship, or of divine service. For example: a man brought an ox or a ram, a lamb or such like thing, and presented it to the priest, he did offer it unto God, and that directly with intention of exercising obedience and faith to God. Likewise this offering was to be made by a certain person in a certain place, at a certain time, with certain garments and rites: So all those observations became parts of this worship; for in these also the intention of the doer was directly carried to God, hoping and purposing by them to please God and exercise faith and obedience, and other graces, as well and as much as by the very offering itself, and accounting the service not to be acceptable to God without them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: Lee, 1654), bk. 9, ch. 3, ‘2nd Commandment,’ pp. 769-70</span></figcaption>

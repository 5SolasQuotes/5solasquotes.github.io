<blockquote><p>The division of tongues [(Genesis) 11:1–9]

The building of a city and tower [of Babel] was inspired first by the desire to obtain a centre of unity, such as would keep the human race together. But the securing of this unity was by no means the ultimate purpose of the effort. Unity was to afford the possibility for founding a gigantic empire, glorifying man in his independence of God. The latest criticism finds here two myths woven together, one describing the building of a tower for preserving unity, the other relating to the building of a city for gaining renown. But this, while resembling the explanation just given, misses the inner connection between the two projects.

The tower was for the sake of the city, and there is no need of dissection. God interferes with the execution of this plan, not so much, or at least not only, from opposition to its impious spirit, but chiefly from fidelity to His promise, that the sinful development of humanity will not again issue into a repeated catastrophe on the scale of the deluge. If this were not to happen, the progress of sin had to be checked. If the whole of humanity had remained concentrated, the power of sin would likewise have remained united, and doubtless soon again have reached stupendous proportions. Hence it was next necessary to break up the unity of the race. As Delitzsch has observed: ‘the immoral and irreligious products of one nation are not equally destructive as those of an undivided humanity’, and ‘many false religions are better than one, since they paralyse one another’.

It is true that in the abstract the unity of the race, unbroken by national distinctions, is the ideal. Had sin not entered, this would undoubtedly have been the actual state of things, as it will become so in the final eschatological dispensation [cp. Gal. 3:28]. But for the present intervening period this is not the will of God. Nationalism, within proper limits, has the divine sanction; an imperialism that would, in the interest of one people, obliterate all lines of distinction is everywhere condemned as contrary to the divine will. Later prophecy raises its voice against the attempt at world-power, and that not only, as is sometimes assumed, because it threatens Israel, but for the far more principal reason, that the whole idea is pagan and immoral.

Now it is through maintaining the national diversities, as these express themselves in the difference of language, and are in turn upheld by this difference, that God prevents realization of the attempted scheme. Besides this, however, a twofold positive divine purpose may be discerned in this occurrence. In the first place there was a positive intent that concerned the natural life of humanity. Under the providence of God each race or nation has a positive purpose to serve, fulfilment of which depends on relative seclusion from others. And secondly, the events at this stage were closely interwoven with the carrying out of the plan of redemption. They led to the election and separate training of one race and one people. Election from its very nature presupposes the existence of a larger number from among which the choice can be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblical Theology: Old and New Testaments</cite>, (1948; Edinburgh: Banner of Truth, 1975), pp 59-60.</span></figcaption>

m/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c36018bea" data-kw="">
<blockquote><p>After some overtures of a Match in the Reign of King Henry the Eighth, the Reformed Church in this Kingdom was solemnly married to Jesus Christ, when the Sceptre was swayed by Edward the Sixth: that godly young Prince (as became the Bridegroom’s friend) rejoicing greatly because of the Bridegroom’s voice.

The famous nine and thirty Articles of her Confession then framed, were an evident sign of her being with child, and that a thorough Reformation was then conceived, though but conceived. Many and fore were the breeding fits she conflicted with in Queen Mary’s days, and such as gave occasion to fear that she would have miscarried.

But God sent her ease from heaven under the succeeding Princes: in which condition she went on for a long while, drawing still nearer and nearer her time. Six years ago, after this Parliament had sate a while it was generally believed that she was false into her travel. And, in the midst of all those sorrows which have befallen England since, her friends encouraged themselves with this hope, that the quicker and sharper her pains grew, the liker she was to be speedily delivered of that man-child, which was by them so greedily expected.

But, behold, as if all these had been but fore-runners of her labour, not bearing-throws, she continues still in pain: insomuch as they now begin to think she has not gone her full time, and earnestly to desire she may; because they fear nothing more than an abortive Reformation. However, evident it is, not only that her pains are multiplied, but that they are caused, partly by the malignity of her enemies, who have embroiled her in a bloody Civil War …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), pp 35-36.</span></figcaption>

<blockquote><p>And they two shall be one flesh. They shall be one man, or, to use a common phrase, they shall constitute one person; which certainly would not hold true with regard to any other kind of relationship. All depends on this, that the wife was formed of the flesh and bones of her husband. Such is the union between us and Christ, who in some sort makes us partakers of his substance. “We are bone of his bone, and flesh of his flesh,” (Gen. 2:23;) not because, like ourselves, he has a human nature, but because, by the power of his Spirit, he makes us a part of his body, so that from him we derive our life.</p></blockquote>

</figure><figure class="quote" id="q-6c1d14f854" data-kw="">
<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>

</figure><figure class="quote" id="q-3252b463f8" data-kw="">
<blockquote><p>12. There was in the primitive times an ecclesiastical order of widows, which St. Paul mentions, 1 Tim. 5, whose whole ministry was devoted to charity. They were indeed of the poorer sort, fit rather to receive than give alms; yet the less they could do with their purses, the more was required of their persons: the humbler offices of washing the saints feet, the careful task of bringing up children, and a diligent attendance on every good work. And sure there is parity of reason that those who upon the score of their wealth, exempt themselves from those laborious services should commute for it by more liberal alms. In the warmth and zeal of Christianity, women of the higest quality performed both sorts of charity, forgot their greatness in their condescensions, yet assumed it again in their bounty; founded hospitals, and yet with a labor of love, as the apostle styles it, Heb. 6:10, disdained not sometimes to serve in them. But these are examples not like[ly] to be transcribed in our days: greatness is now grown to such an unwieldiness that it cannot stoop though to the most Christian offices, and yet can as little soar up in any munificent charities: it stands like Nebuchadnezzar’s golden image: a vast bulk only to be adored.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-allestree.html">Richard Allestree</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lady’s Calling</cite>, ... (Oxford, 1673), pt. 2, section 3, ‘Of Widows’, p. 219 Allestree (1619-1681) was an Anglican.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<blockquote><p>2. Do not women covenant to gain the younger women in their way, by rebuking, by Mt. 18:15; Lev. 19:17; 1 Sam. 25:25-27; Tit. 2:3-4, both men and women? and do they for that rule [by the power of the Keys], as the male-Church? [No they don’t, contra congregationalists] and by what oracle? am I not to rebuke a trespassing offender of another congregation dwelling within twenty cubits to my door, and being my beloved brother in Christ?</p></blockquote>

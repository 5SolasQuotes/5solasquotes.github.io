<blockquote><p>1. It were a great unthankfulness to God, if, after sacred and solemn vows made in time of our greatest dangers, and when, after our vows, God hath begun to deliver us, and hath dissipated our enemies, we should now grow weary of paying and performing those vows. We may say of the covenant as the prophet said of the laying of the foundation of the second temple, Consider whether from that very day God did not sensibly bless us, and give a testimony from heaven to his own cause and covenant. And now shall the covenant, which was our glory and ornament before God and men, be laid aside as a worn or moth-eaten garment? God forbid.

2. If the taking of the solemn league and covenant be not enjoined by the authority of parliaments, under a penalty, but left arbitrary, this were an opening instead of shutting the door unto as many as are apt and inclinable to refuse and oppose the covenant, yea, to as many as write or speak against it, and maintain opinions or practices contrary to it. The impiety and obstinacy of such persons, if not punished, but connived at, or tacitly permitted by the parliaments, involveth them and the nation as partakers of the sin, and so consequently of the judgment.

Although the oath which Joshua and the princes of Israel made to the Gibeonites was made unadvisedly, and without asking counsel from the mouth of the Lord, yet, some hundred years after, being broken, that breach brought a national judgment, till justice was done upon the offenders. How much more may a national judgment be feared, if even in our days the contempt and violation of a most lawful and sacred oath be winked at? Surely God will not wink at their sin who wink at his dishonour. Better not to have vowed than not to pay and perform.

3. When King Josiah made a solemn covenant (the effect whereof was a thorough reformation, the taking away of the ancient and long-continued high places, the destroying of Baal’s vessels, altars, priests, &amp;c. 2 Kings 23, throughout), he did not leave his covenant arbitrary; but he caused all that were present in Jerusalem and Benjamin to stand to it, 2 Chron. 34.32. In all which he is set forth as a precedent to Christian reformers, that they may know their duty in like cases.

4. All who did take the solemn league and covenant are thereby obliged in their several places and callings (and so the houses of parliament in their place and calling) to endeavour the extirpation of Popery, prelacy, heresy, schism, superstition and profaneness. How is this part of the oath of God fulfilled, if the covenant itself, made for the extirpation of all these, be left arbitrary?

5. The vow and protestation was not left arbitrary; for by the vote, July 30, 1641, it was resolved upon the question, that whosoever would not take that protestation are declared to be unfit to bear any office in the church or state, which was accordingly published. But the solemn league and covenant must be at least more effectual than the protestation, for the narrative, or preface of the covenant, holdeth forth the necessity of the same as a more effectual means to be used after other means of supplication, remonstrance, and protestation.

6. This same solemn league and covenant was not in the beginning left arbitrary, for some members were suspended from the house for not taking it. And in the ordinance, Feb. 2, 1643, it is ordained and enjoined, that it be solemnly taken in all places throughout the kingdom of England, and dominion of Wales. And withal, in the instructions and orders of parliament then sent into the committees, it was appointed that the names of such as refuse it should be returned to the parliament, that they may take such further course with them as they might think fit. In the ordinance of parliament for ordination of ministers (both the first and the last ordinance), the person to be ordained is appointed and obliged to address himself to the presbytery, and bring with him a testimony of his taking the covenant of the three kingdoms. Again, by the ordinance for election of elders, dated the 19th of August 1645, no member of any congregation may concur or have voice in the choosing of elders but such as have taken the national covenant.

7. In the first article of the treaty between the kingdoms, signed Nov. 29, 1643, it is agreed and concluded, that the covenant be sworn and subscribed by both kingdoms, not that it shall be taken by as many as will in both kingdoms, but that it shall be taken by both kingdoms. How shall this be performed if it be still left arbitrary?

8. In the propositions of peace it is plainly supposed and intimated, that the taking of the covenant shall be enjoined under some penalty, otherwise we have not dealt faithfully, neither with God nor man, in tendering that second proposition to the king concerning his consent to an act of parliament in both kingdoms respectively for the enjoining the taking of the covenant by all the subjects of the three kingdoms, with such penalties as, by mutual advice of both kingdoms, shall be agreed upon.

9. If other propositions of peace be turned into ordinances, and this of the covenant not so, it will strengthen the calumnies cast upon the parliament by the malignant party, that they have had no intention to settle religion according to the covenant, but that they entered into the covenant for bringing in the Scots to their assistance, and for gaining the good opinion of the reformed churches.

10. It will also be a dangerous precedent to separate between the legislative power and the corrective or punitive power. For if after the ordinance of parliament enjoining and ordaining that the covenant be taken universally throughout the whole kingdom there be no sanction nor penalty upon those who shall refuse it, let wise men judge whether this may not expose the authority of parliament to contempt.

11. I shall conclude with this syllogism, That which is not only sinful in itself, but a great dishonour to God, a great scandal to the church, and withal a disobedience to the lawful ordinance of authority, may and ought to be punished by this Christian and reforming parliament. But their offence which still refuse to take the covenant is not only sinful in itself, but a great dishonour to God, a great scandal to the church, and withal a disobedience to the lawful ordinance of authority.

Therefore the offence of those who still refuse to take the covenant, may and ought to be punished by this Christian and reforming parliament.</p></blockquote>

<blockquote><p>XXVI. …Yet the case may be, and often has been (and whither or no it be ours now [referring to Scotland in 1681], is not mine to determine) that a people may and ought to submit themselves to the government even of such a magistrate who either has injuriously usurped that office, or has so maleversed in the exercise thereof (by violating the main and most of the conditions upon which he was admitted to it) that his government is degenerat[ed] into a manifest tyranny and irreligion, and so has (de jure) fore-faulted his right to rule as a magistrate: I say the case of a people may be so circumstantiate [bound by circumstances], that they ought to subject themselves even to such a tyrant till the Lord clearly point forth to them a way, either from his written Word, or some extraordinary impulse and influence upon their spirits, or from indubitable grounds and persuasives of sound moral principles, or such like, whereby they may emerge from under that yoke. Hereby I do not yield, nor assert, that it is lawful to give obedience to any unlawful commands, or that it is no ways lawful for a people to shake off the yoke of an unlawful and tyrannical government: but only that there may be some cases wherein it is lawful for a people to yield subjection to a lawless tyrant, and wherein it may be unlawful for them to perpetrate or attempt their own liberation by external force (which abstractly from those circumstances might be both lawful, laudable and a necessary duty), viz. when the thing attempted is either altogether impracticable, the means or manner of effectuating it dubious or unwarrantable, the timing of it inexpedient and unseasonable, or the necessary concomitants or consequents of the cure more hurtful or dangerous than the disease; or the like: Neither do I affirm that under a tyrannical government it is always or absolutely lawful for the people to give passive obedience (if such a form of phrase may be admitted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXVI. …Yet the case may be, and often has been (and whither or no it be ours now [referring to Scotland in 1681], is not mine to determine) that a people may and ought to submit themselves to the government even of such a magistrate who either has injuriously usurped that office, or has so maleversed in the exercise thereof (by violating the main and most of the conditions upon which he was admitted to it) that his government is degenerat[ed] into a manifest tyranny and irreligion, and so has (de jure) fore-faulted his right to rule as a magistrate: I say the case of a people may be so circumstantiate [bound by circumstances], that they ought to subject themselves even to such a tyrant till the Lord clearly point forth to them a way, either from his written Word, or some extraordinary impulse and influence upon their spirits, or from indubitable grounds and persuasives of sound moral principles, or such like, whereby they may emerge from under that yoke. Hereby I do not yield, nor assert, that it is lawful to give obedience to any unlawful commands, or that it is no ways lawful for a people to shake off the yoke of an unlawful and tyrannical government: but only that there may be some cases wherein it is lawful for a people to yield subjection to a lawless tyrant, and wherein it may be unlawful for them to perpetrate or attempt their own liberation by external force (which abstractly from those circumstances might be both lawful, laudable and a necessary duty), viz. when the thing attempted is either altogether impracticable, the means or manner of effectuating it dubious or unwarrantable, the timing of it inexpedient and unseasonable, or the necessary concomitants or consequents of the cure more hurtful or dangerous than the disease; or the like: Neither do I affirm that under a tyrannical government it is always or absolutely lawful for the people to give passive obedience (if such a form of phrase may be admitted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.”

— Robert MacWard, The Banders Disbanded, (1681), pp. 47-48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXVI.+%E2%80%A6Yet+the+case+may+be%2C+and+often+has+been+%28and+whither+or+no+it+be+ours+now+%5Breferring+to+Scotland+in+1681%5D%2C+is+not+mine+to+determine%29+that+a+people+may+and+ought+to+submit+themselves+to+the+government+even+of+such+a+magistrate+who+either+has+injuriously+usurped+that+office%2C+or+has+so+maleversed+in+the+exercise+thereof+%28by+violating+the+main+and+most+of+the+conditions+upon+which+he+was+admitted+to+it%29+that+his+government+is+degenerat%5Bed%5D+into+a+manifest+tyranny+and+irreligion%2C+and+so+has+%28de+jure%29+fore-faulted+his+right+to+rule+as+a+magistrate%3A+I+say+the+case+of+a+people+may+be+so+circumstantiate+%5Bbound+by+circumstances%5D%2C+that+they+ought+to+subject+themselves+even+to+such+a+tyrant+till+the+Lord+clearly+point+forth+to+them+a+way%2C+either+from+his+written+Word%2C+or+some+extraordinary+impulse+and+influence+upon+their+spirits%2C+or+from+indubitable+grounds+and+persuasives+of+sound+moral+principles%2C+or+such+like%2C+whereby+they+may+emerge+from+under+that+yoke.+Hereby+I+do+not+yield%2C+nor+assert%2C+that+it+is+lawful+to+give+obedience+to+any+unlawful+commands%2C+or+that+it+is+no+ways+lawful+for+a+people+to+shake+off+the+yoke+of+an+unlawful+and+tyrannical+government%3A+but+only+that+there+may+be+some+cases+wherein+it+is+lawful+for+a+people+to+yield+subjection+to+a+lawless+tyrant%2C+and+wherein+it+may+be+unlawful+for+them+to+perpetrate+or+attempt+their+own+liberation+by+external+force+%28which+abstractly+from+those+circumstances+might+be+both+lawful%2C+laudable+and+a+necessary+duty%29%2C+viz.+when+the+thing+attempted+is+either+altogether+impracticable%2C+the+means+or+manner+of+effectuating+it+dubious+or+unwarrantable%2C+the+timing+of+it+inexpedient+and+unseasonable%2C+or+the+necessary+concomitants+or+consequents+of+the+cure+more+hurtful+or+dangerous+than+the+disease%3B+or+the+like%3A+Neit Sovereign%20Lord%20of%20both" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2f32087deb" data-kw="">
<blockquote><p>XIII. The glory of God, the good of souls, the happiness of Christian societies, are irresistible motives to quicken the magistrate to act (against such dangerous persons as we have described according to the law of judgement, and their different demerits) in Faith and Love:

      1. In Faith; for the Christian magistrate does not act like himself, if he does not perform acts of civil-justice in faith. And it is clear that if there be no moral equity in any of the judicial laws in the Old Testament (and there are none at all extant in the New) [then] the Christian magistrate cannot perform any act of Civil-justice in faith. But it is indeed too evident to be denied that all divine laws which concern the punishment of moral transgressions are of perpetual obligation, and therefore still remain in force according to their substance and general equity, abstracted from special circumstances, typical accessories and the old forms of Mosaical polity, for:

      1. These divine laws are not expired in their own nature.

      2. They are not repealed by God.

      3. The authority of the Lawgiver is the same under both administrations, old and new; the consciences of Christians as well as Jews are subject to his sovereign and perpetual jurisdiction.

      4. The matter of the laws is moral, and very agreeable to the dictates of nature, as does appear by the several laws and decrees of heathens: Dan. 3:29; Ezra. 7:23,25-27; Ezra 10:3,5,8 compared with Num. 15:30-31; Lev. 24:15-16; Deut. 13:8-9; Zech. 13:3,6. Seducing, poisoning, slaying of souls is by the law of Nature and Nations the worst of injuries.

      5. The reason of these divine laws is immutable, and that reason is sometimes expressed and declared: But it is not necessary that there should be any express ratification of every moral law in the New Testament which is plainly delivered in the Old.

      6. These divine laws are independent on the will of man, and therefore indispensable man’s authority.</p></blockquote>

</figure><figure class="quote" id="q-a9aceb5085" data-kw="">
<blockquote><p>Nay suppose some should so extol the fullness and sufficiency of the Scriptures that they should hold them so perfect and sufficient for all Christians as to be a perfect rule for all civil government, and that Chrstian commonwealths ought to be governed by laws only there recorded and by no other (which opinion in substance Carolostadius held; that in courts of justice judges should not proceed according to humane laws, but according to the law of Moses; and so for military practices, should hold all the way of war must be founded upon the Scriptures, and thereupon should clamor against any other art and way of war than what was practised there. What would you reply to these men, or what strength were there in such principles? Would not you answer them in what sense the Scriptures were perfect, and how they must understand it?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6a7c24d1c8" data-kw="">
<blockquote><p>It is plain enough that this passage was unknown anciently to the Greek Churches; and some conjecture that it has been brought from some other place and inserted here. But as it has always been received by the Latin Churches, and is found in many old Greek manuscripts, and contains nothing unworthy of an Apostolic Spirit, there is no reason why we should refuse to apply it to our advantage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospel According to John</cite>, trans. William Pringle (Geneva, 1553) in Calvin’s Commentaries (22 vols, Grand Rapids MI: Baker, 1993), 17: 319.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-4bc153b4ac" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water [Lk. 13:16], which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears [Mt. 12:1], and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now;</p></blockquote>

</figure><figure class="quote" id="q-734c224297" data-kw="">
<blockquote><p>For this Book passeth All Books that ever were or shall be, I mean, the Book of God’s holy Bible: which Book, saith Hierome, shall remain with us till we be as the Angels in Heaven. Go we forward, and consider how also to this Book he hath added Prophets, Apostles, Evangelists, Pastors, and Doctors in all times, to open and expound the same unto us, that by all means we might be induced with light, love light, live in light, and die in light.

Add again the appointing of the Sabaoth day, wherein men should rest from their labours, and hearken to this Book together with the many precepts given to hear, to read, to search, to know, and understand, &amp; not to be as children, perceiving nothing. Think with your self often, how the little Infant groweth to strength, able to go by it self: is it not by sucking and plucking his Mother’s breasts? even so doth the Childe of God grow to strength of grace, and from grace to grace, by hanging continually upon these two Breasts, the old and new Testament.</p></blockquote>

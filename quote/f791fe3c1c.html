<main class="wrap"><figure class="quote" id="q-f791fe3c1c" data-kw="">
<blockquote><p>Indeed there is what is called natural religion. There are many truths concerning God, and our duty to him, which are evident by the light of nature. But christian divinity, properly so called, is not evident by the light of nature; it depends on revelation. Such are our circumstances now in our fallen state, that nothing which it is needful for us to know concerning God, is manifest by the light of nature, in the manner in which it is necessary for us to know.

For the knowledge of no truth in divinity is of significance to us, any otherwise than as it some way or other belongs to the gospel-scheme, or as it relates to a Mediator. But the light of nature teaches us no truth in this matter. Therefore it cannot be said, that we come to the knowledge of any part of christian truth by the light of nature. It is only the word of God, contained in the Old and New Testament, which teaches us christian divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Knowledge in Jonathan Edwards on Knowing Christ</cite></span></figcaption>

<blockquote><p>The holy scripture therefore, designing by revealed religion to maintain and improve natural religion, to repair the decays of it and supply the defects of it, since the fall, for the reviving of the precepts of the law of nature, lays down, at first, this principle of the unclouded light of nature, That this world was, in the beginning of time, created by a Being of infinite wisdom and power, who was himself before all time and all worlds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, (Hendrickson, 1994), p. 3</span></figcaption>

</figure><figure class="quote" id="q-eaf88a4b2d" data-kw="">
<blockquote><p>Mattson challenged us to answer Richard Gaffin’s exegetical defense of Van Til and presuppositionalism from 1 Corinthians 2:6-16: “The natural man does not accept the things of the Spirit of God.”… In summary, Gaffin argues that “the things of the Spirit of God” which “the natural man does not accept” include all things, not only the content of special revelation but also knowledge of the whole creation which falls under the influence of the inaugurated and coming kingdom of God. Gaffin concludes: “1 Cor 2:6-16 (1:18-3:23) is the death blow to all natural theology” (123)… Gaffin, in order to extract his desired exegetical conclusion, assumes a controversial philosophical doctrine: The British idealist doctrine of holism. Holism is the doctrine that all truths are connected such that a difference at one point affects all points. Only by assuming this doctrine can Gaffin, and Mattson, argue that the natural man’s inability to understand the things of the Spirit of God obviates the possibility of natural law and natural theology. On the contrary, 1 Corinthians 2 was a favorite passage of Thomas Aquinas’s, which provided an exegetical basis for a distinction between the realm of nature and that of grace. Radically non-speculative exegesis of 1 Corinthians 2:6-16, I argue, leaves open all possible orthodox positions on this matter, from Van Til’s to Aquinas’s to my own… Gaffin, noting that verse 22 speaks of “all things” as having been “committed to me by the Father,” argues that “these things” – apparently limited in scope – now include our knowledge of all things. Everything is hidden from the unbeliever; knowledge of anything requires revelation and belief… Their method is the theological method I was taught at Westminster Seminary, what John Murray called, “radically non-speculative theology.” It is the idea that the content of systematic theology can be read directly off the pages of Scripture, redemptive-historically interpreted… an idea like “there is nothing in the entire creation that is irrelevant to the kingdom” is not one of the positions on Christ and culture, a distinctively presuppositionalist one. That is all of the positions… Gaffin infers that, if all things are impacted by the “hidden things,” then our knowledge of anything must begin from knowledge of the “hidden things.” But this inference only follows, given the truth of epistemological holism: The doctrine that the content of truths or facts are not separable but a unified, systematic whole. The authors of Classical Apologetics put it this way: “To know the flower in the wall, you have to know the world and all.” Holism was a central doctrine of the British Idealist philosophers. Cornelius Van Til’s philosophy Ph.D. at Princeton University was on the Idealists (“God and the Absolute”)… Van Til held that, if the Christian faith is true, then no truth is unaffected, truths of logic, mathematics, and scientific observation not excepted. Accordingly, no natural human knowledge, no science or philosophy, is fully true. (It might be “true so far as it goes.”) No natural theology or natural law can be built up from below, because all is affected by the content of special revelation. The question of the legitimacy of this logical leap is a philosophical question, and it is one that divides presuppositionalists from classical apologists… Epistemological holists, by contrast, hold that if thinkers have a difference at one point, then they effectively differ at all points. There are no individual truths, only holistic worldviews. Likewise, you cannot accurately perceive some of the world, some of the truth, but misunderstand other parts. The failure to understand the whole undermines apparent success in analyzing the parts… And on philosophical grounds, I would argue that holism is false. While the world is a unity and one part affects another, our knowledge of the world is separable and incomplete. Some people are masters of international finance and failures at emotional intelligence. Some people know every jot and tittle of Reformed theology but are ignorant of philosophy, economics, and politics. It happens… The incompleteness of this knowledge of morality and God is no knock against it. In fact, on biblical grounds, I would claim that it is such incomplete knowledge that renders people accountable to God (Rom 1:19-20). Often, it is such incomplete knowledge that leads people toward a more complete knowledge of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-carini.html">Joel Carini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The Natural Man does Not Accept the Things of the Spirit of God’ – But He Can Accept Natural Theology</cite>, (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

gists%E2%80%A6+Epistemological+holists%2C+by+contrast%2C+hold+that+if+thinkers+have+a+difference+at+one+point%2C+then+they+effectively+differ+at+all+points.+There+are+no+individual+truths%2C+only+holistic+worldviews.+Likewise%2C+you+cannot+accurately+perceive+some+of+the+world%2C+some+of+the+truth%2C+but+misunderstand+other+parts.+The+failure+to+understand+the+whole+undermines+apparent+success+in+analyzing+the+parts%E2%80%A6+And+on+philosophical+grounds%2C+I+would+argue+that+holism+is+false.+While+the+world+is+a+unity+and+one+part+affects+another%2C+our+knowledge+of+the+world+is+separable+and+incomplete.+Some+people+are+masters+of+international+finance+and+failures+at+emotional+intelligence.+Some+people+know+every+jot+and+tittle+of+Reformed+theology+but+are+ignorant+of+philosophy%2C+economics%2C+and+politics.+It+happens%E2%80%A6+The+incompleteness+of+this+knowledge+of+morality+and+God+is+no+knock+against+it.+In+fact%2C+on+biblical+grounds%2C+I+would+claim+that+it+is+such+incomplete+knowledge+that+renders+people+accountable+to+God+%28Rom+1%3A19-20%29.+Often%2C+it+is+such+incomplete+knowledge+that+leads+people+toward+a+more+complete+knowledge+of+God.%E2%80%9D%0A%0A%E2%80%94+Joel+Carini%2C+%E2%80%9DThe+Natural+Man+does+Not+Accept+the+Things+of+the+Spirit+of+God%E2%80%99+%E2%80%93+But+He+Can+Accept+Natural+Theology%2C+%282024%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaf88a4b2d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eaf88a4b2d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-theology/#:~:text=Mattson%20challenged%20us%20to%20answer%20Richard,a%20more%20complete%20knowledge%20of%20God&amp;text=Mattson%20challenged%20us%20to%20answer%20Richard%20Gaffin%E2%80%99s%20exegetical&amp;text=people%20toward%20a%20more%20complete%20knowledge%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-77b89dd3e3" data-kw="">
<blockquote><p>XII. Moreover, (1) not only does the universal consensus of all nations (Rom. 2:15) declare that a certain theology is given, but (2) nature itself teaches that God exists and that he must be glorified (Ps. 19:1; Rom. 1:19-21), and that he in turn will be a rewarder of those who seek him (Heb. 11:6), the method of whose worship we proclaim in theology. (3) Nature teaches that the soul is immortal, burning to have its immortal desire for perpetual beatitude satisfied, and theology is believed to open the path to this satisfaction. (4) Nature also teaches that the rational creature, having been created by God strives toward God, so that he is satisfied in God alone, to whom theology leads.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-37f7de4951" data-kw="">
<blockquote><p>Fourthly a confusion of gestures lawful, and unlawful is brought into the Lord’s table, some sitting like guests at a feast, as Christ, and his apostles sat, others like supplicants kneeling, and adoring upon their knees. This confusion is not like that variety of gesture in time of prayer, when some sit, some stand, some kneel. For all the three gestures are there indifferent. But not so here; this confusion of gestures at the Lord’s table now is permitted only for a snare to bring thy feet within the grin. For when all are brought in, then will the formalists cry out, ‘Confusion of gestures is intolerable, uniformity and conformity is necessary,’ as Doctor Sparke does in his persuasion to uniformity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute upon Communicating at our Confused Communions (Amsterdam, 1624), ch. 5, ‘Of Kneeling in the Act of Receiving the Sacramental Elements’</cite>, pp. 70-71</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f63f38128e" data-kw="">
<blockquote><p>4. As in serious prayer, specially in secret, the affections of the heart do utter themselves in the answerable gestures of the body, as well as in the voice and words of the mouth: so those gestures have their own speech unto God, no less than the words of the mouth have; as here, ‘I have stretched out my hands unto Thee,’ is brought forth to express his submissive rendering up of himself unto God and his dependance upon him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Other Fifty Psalms, from Ps. 50 to Ps. 100 (London, 1653), on Ps.</cite>, 88:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-a916fff20e" data-kw="">
<blockquote><p>What ought to be the gesture of him that prays? A diverse gesture is not prescribed, but yet is described in the Scriptures: 1. The Jews in time past did pray somtimes standing, but sometimes with bowed knees, as Solomon and Christ Himself kneeled down and prayed, as also Peter and Stephen; Paul also used bowing of the knees, Eph. 3:14, “For this cause (says he) I bow my knees unto the Father of our Lord Jesus Christ,” by which gesture a lowly subjection, and an emptying of ourselves before God is signified. 2. Moses lifts up his hands towards Heaven, and Paul wills, 1 Tim. 2:8, that pure hands should be lifted up unto God: which gesture belongs unto children who do reach their hand to the parents when they will obtain anything or are suppliant to them. But this ceremony of lifting up of hands does admonish us, that the heart and senses are to be lifted upon high, least they which desire to be heard of God should abide in their dregs, as David interprets Ps. 86:4; 25:1, “Unto Thee O Lord I lift up my soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion (1606)</cite>, p. 416</span></figcaption>

</figure><figure class="quote" id="q-c270919e61" data-kw="">
<blockquote><p>XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by [Against] Dr. Owen’s Vindicator… (London: Parkhurst, 1684), section 2</cite>, p. 11</span></figcaption>

+such.+God+has+commanded+men+to+choose+such+things+as+these+by+the+rules+of+edification%2C+love%2C+peace%2C+concord%2C+order%2C+decency%2C+winning+those+without%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Communion+Doubly+Defended+by+%5BAgainst%5D+Dr.+Owen%E2%80%99s+Vindicator%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29%2C+section+2%2C+p.+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc270919e61.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c270919e61.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=XIV.%20God%20has%20by%20Nature%20and,order%2C%20decency%2C%20winning%20those%20without%2C%20etc." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0ce027ab35" data-kw="">
<blockquote><p>There is a twofold intention in worship, one formal and properlly religious, and is expounded moral, ex natura rei [out of the nature of the thing], to be religious, it being such an intention, as can have no other state in worship, but a religious state… an intrinsical intention, ex natura et conditione operis [out of the nature and condition of the work], to worship… But there is another intention not religious: if a child read a chapter of the Bible, that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, Signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’, and here the object not being religious, the intrinsical operation cannot raise up any religious intention of the child… the latter intention of the worker, is so far extraneous to worship, as whether it be, or be not, the nature of worship is not impaired nor violated. Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646) | Introduction</cite>, pp. 88-89</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There is a twofold intention in worship, one formal and properlly religious, and is expounded moral, ex natura rei [out of the nature of the thing], to be religious, it being such an intention, as can have no other state in worship, but a religious state… an intrinsical intention, ex natura et conditione operis [out of the nature and condition of the work], to worship… But there is another intention not religious: if a child read a chapter of the Bible, that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, Signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’, and here the object not being religious, the intrinsical operation cannot raise up any religious intention of the child… the latter intention of the worker, is so far extraneous to worship, as whether it be, or be not, the nature of worship is not impaired nor violated. Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:”

— Samuel Rutherford, The Divine Right of Church Government (London, 1646) | Introduction, pp. 88-89">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+a+twofold+intention+in+worship%2C+one+formal+and+properlly+religious%2C+and+is+expounded+moral%2C+ex+natura+rei+%5Bout+of+the+nature+of+the+thing%5D%2C+to+be+religious%2C+it+being+such+an+intention%2C+as+can+have+no+other+state+in+worship%2C+but+a+religious+state%E2%80%A6+an+intrinsical+intention%2C+ex+natura+et+conditione+operis+%5Bout+of+the+nature+and+condition+of+the+work%5D%2C+to+worship%E2%80%A6+But+there+is+another+intention+not+religious%3A+if+a+child+read+a+chapter+of+the+Bible%2C+that+he+may+learn+to+read+and+spell%2C+that+is+an+action+of+art%2C+not+of+worship%3B+because+the+object+of+the+child%E2%80%99s+reading+is+not+Scripture+as+Scripture%2C+but+only+the+printed+characters+as+they+are%2C+Signa+rerum+ut+rerum%2C+non+ut+rerum+sacrarum%2C+%E2%80%98signs+of+things%2C+not+of+holy+things%E2%80%99%2C+and+here+the+object+not+being+religious%2C+the+intrinsical+operation+cannot+raise+up+any+religious+intention+of+the+child%E2%80%A6+the+latter+intention+of+the+worker%2C+is+so+far+extraneous+to+worship%2C+as+whether+it+be%2C+or+be+not%2C+the+nature+of+worship+is+not+impaired+nor+violated.+Hence%2C+adoration+is+worship%2C+but+every+worship+is+not+adoration%E2%80%A6+all+bodily+worship+or+expression+of+our+affection+to+the+means+of+graces+%28though+these+means+be+but+creatures%29+is+not+adoration+properly%2C+either+of+God%2C+or+of+these+means%3B+it+is+lawful+to+tremble+at+the+Word%2C+and+for+Josiah+to+weep+before+the+Book+of+the+Law+read%2C+and+for+the+martyrs+to+kiss+the+stake+as+the+instrument+by+which+they+glorified+God+in+dying+for+the+truth%3B+all+these+being+objectam+quo%2C+and+%E2%80%98means+by+the+which%E2%80%99+they+conveyed+their+worship+to+the+true+God%2C+and+natural+and+lawful+expressions+of+their+affection+to+God%3A%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29+%7C+Introduction%2C+pp.+88-89&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0ce027ab35.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0ce027ab35.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-veneration-as-distinguished-from-the-worship-of-adoration/#:~:text=There%20is%20a%20twofold%20intention%20in,expressions%20of%20their%20affection%20to%20God%3A" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

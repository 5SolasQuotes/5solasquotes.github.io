<main class="wrap"><figure class="quote" id="q-a555e1e481" data-kw="">
<blockquote><p>The principal cause of justification is the triune God (2 Cor. 5:19). The internal moving cause is the grace of God (Rom. 3:24). The external cause is the righteousness of Christ (2 Cor. 5:21). The material cause, or that which is imputed to us, is the same righteousness of Christ (Phil. 3:9). The formal cause is the judicial acquittal from punishment and the judicial granting of life (Rom. 8:33). The instrumental cause is faith (Rom. 5:1). The final cause is the glory of God and our salvation (Rom. 3:25).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-van-rijssen.html">Leonard van Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologia Elencticae Completa. Et didaticae quantum sufficit</cite>, (Edinburgh, 1692), Chapter XIV, trans. J. Wesley White in Mid-American Journal of Theology, 16 (2005), p. 121.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

— Leonard van Rijssen, Summa Theologia Elencticae Completa. Et didaticae quantum sufficit, (Edinburgh, 1692), Chapter XIV, trans. J. Wesley White in Mid-American Journal of Theology, 16 (2005), p. 121.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+principal+cause+of+justification+is+the+triune+God+%282+Cor.+5%3A19%29.+The+internal+moving+cause+is+the+grace+of+God+%28Rom.+3%3A24%29.+The+external+cause+is+the+righteousness+of+Christ+%282+Cor.+5%3A21%29.+The+material+cause%2C+or+that+which+is+imputed+to+us%2C+is+the+same+righteousness+of+Christ+%28Phil.+3%3A9%29.+The+formal+cause+is+the+judicial+acquittal+from+punishment+and+the+judicial+granting+of+life+%28Rom.+8%3A33%29.+The+instrumental+cause+is+faith+%28Rom.+5%3A1%29.+The+final+cause+is+the+glory+of+God+and+our+salvation+%28Rom.+3%3A25%29.%E2%80%9D%0A%0A%E2%80%94+Leonard+van+Rijssen%2C+Summa+Theologia+Elencticae+Completa.+Et+didaticae+quantum+sufficit%2C+%28Edinburgh%2C+1692%29%2C+Chapter+XIV%2C+trans.+J.+Wesley+White+in+Mid-American+Journal+of+Theology%2C+16+%282005%29%2C+p.+121.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa555e1e481.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a555e1e481.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/03/leonard-van-rijssen-on-the-causes-of-justification/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d163ded14a" data-kw="">
<blockquote><p>But if we attend to the four kinds of causes which philosophers bring under our view in regard to effects, we shall find that not one of them is applicable to works as a cause of salvation. The efficient cause of our eternal salvation the Scripture uniformly proclaims to be the mercy and free love of the heavenly Father towards us; the material cause to be Christ, with the obedience by which he purchased righteousness for us; and what can the formal or instrumental cause be but faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.17</span></figcaption>

</figure><figure class="quote" id="q-1dbe28966f" data-kw="">

</figure><figure class="quote" id="q-d975b1fe9f" data-kw="">
<blockquote><p>Absolutely, man cannot exact anything from God, since all things are his; yet, given his will and pact, by which he wills not to require our works of us gratis but to render a reward according to the proportion of the works, we can truly exact the reward from him: just as a slave cannot absolutely ask any reward of his master, since all that the slave acquires he acquires for his master; yet if it please the master to give him his works as his own, and to promise a reward for them as though they were not owed to him, he will by right ask a reward for his works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-a56619ff23" data-kw="">
<blockquote><p>For 2. I add, it is by the satisfaction of Christ the Redeemer, wherein are contained both the matter and form of the justification of a sinner. The matter is Christ’s satisfaction, his obedience in his life, in his death; in fulfilling the law, and in suffering for our not fulfilling it; and the merit of all manifested in his resurrection and glorious ascension. The form is the imputing of that obedience whereby the righteousness of Christ does now become the believer’s as truly and really by imputation as it was Christ’s own in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, (Cambridge: Greene, 1612), on chapter 3, v. 7, p. 666 Taylor (1576-1632) was partially conforming English puritan.</span></figcaption>

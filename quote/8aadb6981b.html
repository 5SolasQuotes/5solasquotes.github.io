<main class="wrap"><figure class="quote" id="q-8aadb6981b" data-kw="">
<blockquote><p>v. 13, ‘Let no man’ Now he goes on to the other kind of temptation, which is the inducement and allurement to sin, which does not proceed from God, as the other of afflictions does. ‘For God’, as He has no inclination, nor takes no delight in evil, so can He not induce others unto it, as the Devil does.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-diodati.html">John Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pious Annotations, upon the Holy Bible</cite>, … (London: T.B., 1643), on James, ch. 1, verse. 13, “Let no man say when he is tempted, I am tempted of God: for God cannot be tempted with evil, neither tempteth he any man:”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>5. That we must not dote upon sensible consolation. The merciful nature of God should be a support to us though we see nothing of the effects of it in the course of his dealings with us; and we should believe his love when we do not actually feel it. Job 10:13, ‘And these things hast Thou hid in thine heart; I know that this is with Thee.’ He speaks of his favorable inclination to show pity to his creatures. We are not able always to reconcile his present dispensations with his gracious nature, nor our former experience of his goodnessת yet faith must not quit its holdfast but we must see what is hid in God’s heart and comfort ourselves with concealed favor and mercy, when we cannot comfort ourselves with felt favor and mercy. Though mercies be not visible and obvious to sense, yet the disposition and inclination is ever in God unchangeable and sure. A withdrawn God is a merciful God still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fourth Volume containing One Hundred &amp; Fifty Sermons on Several Texts of Scripture</cite>, … (London: J.D., 1693) | A Sermon on Isa. 50:10, p. 813</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-c358548691" data-kw="">
<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</span></figcaption>

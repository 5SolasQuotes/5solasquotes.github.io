<blockquote><p>5. Here is added great and gracious encouragement to this sinful [unconverted, as is made clear by the larger context] people to take the admonition and advice well that Christ had given them, v. 19, v. 20. He tells them, (1.) It was given them in true and tender affection: “Whom I love, I rebuke and chasten. You may think I have given you hard words and severe reproofs; it is all out of love to your souls. I would not have thus openly rebuked and corrected your sinful lukewarmness and vain confidence, if I had not been a lover of your souls; had I hated you, I would have let you alone, to go on in sin till it had been your ruin.’’ Sinners ought to take the rebukes of God’s word and rod as tokens of his good-will to their souls, and should accordingly repent in good earnest, and turn to him that smites them; better are the frowns and wounds of a friend than the flattering smiles of an enemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tong.html">William Tong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Matthew Henry’s Commentary, on Rev., 3:19</span></figcaption>

</figure><figure class="quote" id="q-8b80c52ba5" data-kw="">
<blockquote><p>Doctrine Two. We may consider Christ’s sufferings and death in the fruits of it, either as they respect common favors, and mercies, common gifts, and means of grace, which are not peculiar and saving, but common to believers with others, being bestowed upon professors in the visible Church; or as they are peculiar and saving, such as faith, justification, adoption, etc. Now when we say that Christ’s sufferings and death are a price for the sins of his people, we exclude not the reprobate simply from temporal and common favors and mercies that come by his death; they may have, and actually have, common gifts and works of the Spirit, the means of grace, which are some way effects and fruits of the same covenant. But we say, that the reprobate partake not of saving mercy and that Christ’s death is a satisfaction only for the elect, and that none others get pardon of sin, faith, repentance, etc. by it, but they only; it was intended for none others. And this we clear and confirm from, and by, these following grounds and arguments, which we will shortly hint at.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Crucified: Seventy-Two Sermons on Isaiah</cite>, (Dallas, TX: Naphtali Press, 2001), pp. 343-44</span></figcaption>

<blockquote><p>5. God calls upon sinners to turn to Him by the internal voice and motions of His Spirit… There is a twofold call of the Spirit: more common and more special.

1. More common, and so many are called which never are thoroughly converted. It was the common work of the Spirit which made Felix tremble, which brought Agrippa within a step of Christianity and caused Herod to do many things. Multitudes of unregenerate ones have felt the waters stirred, the Holy Ghost moving them to conversion, and have readily proffered His aid and assistance, and perhaps, for awhile, they have been led by Him. But then they have refused to let go of some lust or vanity which He has bid them abandon. They would not turn their spiritual sloth into serious diligence about the concerns of their immortal souls, and so by disregarding His motions, and by slighting His help, they have made the Spirit to go away in grief who came in love to work upon them.

2. There is a call of the Spirit which is more special and efficacious…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Conversion of a Sinner, Explained and Applied, a sermon on Eze. 33:11</cite>, 1669, in The Puritans on Conversion (Soli Deo Gloria, 1990), pp. 105-7</span></figcaption>

ener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Dr. Preston answered that Christ was in himself sufficient to save all; and might be said to be provided for that end and use; as a medicine is to cure infected poison, though it cures none actually but those that drink it. “Habet in se quod omnibus prosit, sed, si non bibitur, non,” as in 1 John 5:11-12. But many did not thus apply Christ, because they had him not so offered and exhibited as others had, Matt 11:21; Luke 10:13, for God gave some faith and repentance, as I have showed. The serpent (Moses was commanded to make), was in itself sufficient to cure those that were bitten, Num. 21:8-9, yet cured none but only those who looked on it. “So, as Moses lifted up the Serpent in the wilderness, shall the Son of Man be lifted up, that whosoever believed in Him should not perish but have everlasting life,” John 3:14-15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This is John Ball’s</cite>, (1590-1659) narrative of Preston’s debate with the Arminian Francis White (1564-1638). From Ball’s, The Life of the Renowned Doctor Preston, ed. by E. W. Harcourt (London: Parker &amp; Co., 1885), p. 135. This quote was compiled by Tony Byrne.</span></figcaption>

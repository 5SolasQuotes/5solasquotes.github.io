<main class="wrap"><figure class="quote" id="q-f71754469e" data-kw="">
<blockquote><p>If it be necessary to baptism that the baptizer know the mind of the person to be baptized, how can you baptize men of years? You will say that they express their minds, and so we baptize them. I grant you may know their words, their minds you cannot; because they may dissemble. If you say you are in charity to believe the best; once more we say, Be but as charitable towards infants, of whom you can know no actual evil, nor shew any just cause why you should suspect if for the future. And I pray how could the Priest under the Law know the minds of children to be circumcised? To conclude, ‘tis nothing material whether we know the infant’s mind, ‘tis behoofull that we know his privilege, as being born within the Church and Covenant of God, which giveth him a sufficient right to the seal thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anabaptism Routed: Or, A Survey of the Controverted Points</cite>, (London: Thomas Johnson, 1655), pp 64-65.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-02ee90a545" data-kw="">
<blockquote><p>We teach not that baptism constitutes the Church simply, as the Church, but that it is a seal of a visible membership; and all baptized by John Baptist and the disciples of Christ were thereby entered in a visible profession that they believed in Christ already come, and so were made members and citizens by that public symbol and seal that they were members of the Christian Church, though as yet it received not that name of a Christian Church, and they were members both of the Jewish and Christian Church: For these are not contrary incorporations, and they needed not to be baptized again when they were added to the Christian Church, for they were never added to the visible Christian Church, nor needed they to be added, seeing they were members of that Church before.</p></blockquote>

<blockquote><p>The religious observance of this institution was required under a very severe penalty, Gen. 17:14. The contempt of circumcision was a contempt of the covenant; if the parents did not circumcise their children, it was at their peril, as in the case of Moses, Ex. 4:24–25. With respect to those that were not circumcised in their infancy, if, when they grew up, they did not themselves come under this ordinance, God would surely reckon with them. If they cut not off the flesh of their foreskin, God would cut them off from their people. It is a dangerous thing to make light of divine institutions, and to live in the neglect of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 17, verse 14</span></figcaption>

<blockquote><p>VI. To no purpose is the reply: (1) “Hence it would follow that the Lord’s Supper should also be administered to infants because the thing signified belongs to them.” Although the same thing is signified in both, still there is a difference in the manner of signifying. In the Supper, the grace of Christ is sealed by way of solid food, which infants are not capable of receiving; but in baptism, it is signified by way of the washing of regeneration, which they are (Jn. 3:5). Again, the Supper demands a twofold condition: a preceding in examination; a concomitant in a commemoration of the death of Christ, both of which presuppose the use of reason. Neither is required in baptism; thus formerly the Passover was distinguished from circumcision—that the latter was administered to infants and the former to adults alone. (2) “It is added that infants are not capacious of the grace of regeneration, nor of the other blessings of the covenant which are accustomed to be conferred by the Spirit through the word.” But it is gratuitously supposed that they are not capacious of the blessing of the covenant. For who denies that they are capacious of the remission of sins and of Christ’s redemption, and of the other benefits which depend upon the covenant into which infants are received? Who can doubt that baptism (with respect to these) is able to be a distinctive sign (introducing into the visible church) and a seal both of the divine truth in the federal promises and of our obligation to mutual duty? For if they are not capable of obligation in the present, they can be in the future. As to regeneration, however, why should infants not be capable of regeneration as they are of sin (unless we say that guilt has more power than grace)? And as they are rational (although they do not put forth an act of reason), what hinders them from being called holy and believers by the Holy Spirit given to them, although they cannot as yet exert an act of faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 19.20.6 (p. 416).</span></figcaption>

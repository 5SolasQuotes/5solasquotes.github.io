<main class="wrap"><figure class="quote" id="q-c782dce734" data-kw="">
<blockquote><p>He [Christ] declared (Mark 2:27) that “the Sabbath was made for man,” the genus homo, and consequently is both binding on all men for all time and adapted to the nature and wants of all men under all historical conditions. On the other hand, it is evident that the particular day set apart is not in the least of the essence of the institution, and that it must depend upon the positive will of God, which of course may substitute one day instead of another on suitable occasions for adequate reasons. …

The introduction of a new dispensation. in which a preparatory and particularistic national system is to be replaced by a permanent and universal one, embracing all nations to the end of time, is certainly such a suitable occasion. The moral law, expressed in the ten commandments written by the finger of God on stone, and made the foundation of his throne between the cherubim and the condition of his covenant, must remain, while the types, the special municipal laws of the Jews, and whatever is unessential in Sabbath or other permanent institutions, must be changed. …

The amazing fact of the resurrection of the Lord Jesus on the first day of the week constitutes an evidently adequate reason for appointing that in the stead of the seventh day to be the Christian Sabbath. The Old Testament is introduced with an account of the genesis of the heaven and earth, and the old dispensation first grounds itself upon the relation of God as Creator of the universe and of man. The New Testament is introduced with an account of the genesis of Jesus Christ, and reveals the incarnate Creator as our champion, victorious over sin and death. The recognition of God as Creator is common to every theistic system; the recognition of the resurrection of the incarnate God is peculiar to Christianity.

The recognition of God as Creator is involved and conserved in the recognition of the resurrection of Christ, while the latter article of faith carries with it also the entire body of Christian faith and hope and life. The fact of the resurrection consummates the process of redemption as far as it is objective to the Church. It is the reason of our faith, the ground of our hope, the pledge of our personal salvation and of the ultimate triumph of our Lord as the Saviour of the world. It is the keystone of historical Christianity, and consequently of all living theism in the civilized world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Day Changed and the Sabbath Preserved</cite>, (n.p., 1877), pp 5-7.</span></figcaption>

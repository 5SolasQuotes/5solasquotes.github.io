<blockquote><p>For this properly means to die for another: to liberate another from death by one’s own death, that he may live. Thus David in his lamentation exclaims: “My son Absalom: who shall give me to die for thee?” meaning, would that by my death I could redeem thy life, or liberate thee from death (2 Sam. 18:33). In the same way Christ is said to have” died for us when we were enemies” and “ungodly”: that is, to have liberated us, being enemies and ungodly, from death by his own death (Rom. 5:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Concerning the Death of Christ for All’ in ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’ trans. AI (1619; Monergism, 2026), pp. 24-27</cite>, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43abe76116" data-kw="">
<blockquote><p>Though I yield some degree of eﬃcacy in Christ’s death unto all; yet I conceive it far short, both of impetration [legal undertaking and payment of sins] and application of that gracious atonement, which is thereby wrought to the elect of God; whence also it is that I dare not preach the Gospel indifferently unto all, before the Law; nor the worth of Christ, before the need of Christ. Children’s bread is not meet for whelps; and full souls will despise honey-combs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Cotton to James Ussher, 31 May 1626 in Sargent Bush, Jr. (ed.), The Correspondence of John Cotton (Chapel Hill: University of North Carolina Press, 2001)</cite>, pp. 111-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-2382ecf531" data-kw="">
<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-w-pink.html">A.W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=For%20the%20transgression%20of%20my%20people,and%20forever%20perfected%20His%20set%2Dapart%20ones." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-12e38d3156" data-kw="">
<blockquote><p>The state of this controversy agitated is not principally turned on this hinge, Whether for all and every person Christ died? but, To which ends, and what fruit of Christ is in them, for whom He died?</p></blockquote>

</figure><figure class="quote" id="q-947bf1611f" data-kw="">
<blockquote><p>Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures (London: Miller, 1651), Lecture 29, on Acts 3:19</cite>, p. 258</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’.”

— Anthony Burgess, The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures (London: Miller, 1651), Lecture 29, on Acts 3:19, p. 258">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+howsoever+an+absolution+shall+be+completed+at+the+Day+of+Judgment%2C+yet+our+justification+shall+not+abide+in+such+a+way+as+it+is+in+this+life.+Now+our+justification+is+by+pardon+of+sin%2C+and+a+righteousness+without+us+imputed+to+us%2C+which+is+instrumentally+applied+by+faith%3B+but+this+way+shall+then+cease%2C+for+having+perfect+righteousness+inherent+in+ourselves%2C+we+shall+need+no+covering.+It+is+true%2C+the+glory+and+honour+of+all+this+will+redound+upon+Christ%2C+and+He+shall+not+be+the+less+glorified+because+He+has+then+brought+us+to+the+full+end+of+all+his+sufferings.+I+know+some+may+doubt+whether+any+righteousness+but+that+which+is+infinite+can+please+God%2C+and+therefore%2C+as+some+think%2C+the+angels+were+accepted+of+God+through+Christ%2C+though+perfect%3B+so+it+may+be+of+the+saints+in+heaven.+But+I+see+no+ground+for+this.+This+seems+to+be+undoubted%2C+that+the+way+of+justification+by+faith+in+Christ+arises+because+of+our+imperfection+and+sinfulness+remaining+in+us%2C+and+therefore+is+justificatio+viae%2C+not+patriae%E2%80%94%E2%80%99a+justification%E2%80%99+of+us+%E2%80%98in+our+way%2C%E2%80%99+not+when+we+come+to+%E2%80%98our+home%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+from+the+Errours+of+Papists%2C+Arminians%2C+Socinians+%26+more+especially+Antinomians+in+30+Lectures+%28London%3A+Miller%2C+1651%29%2C+Lecture+29%2C+on+Acts+3%3A19%2C+p.+258&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F947bf1611f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/947bf1611f.html">Permalink</a><a class="src" href="https://r

<main class="wrap"><figure class="quote" id="q-ae789c31cd" data-kw="">
<blockquote><p>Beside publick reading of the holy scriptures, every person that can read, is to be exhorted to read the scriptures privately, (and all others that cannot read, if not disabled by age, or otherwise, are likewise to be exhorted to learn to read,) and to have a Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship</cite>, Of Public Reading of the Holy Scriptures</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>That which hinders the Church’s edification by the ruler’s fault, it may be the people’s duty to obey for a greater good. For instance, it is less edifying to use our old singing psalms than a better version. And yet for concord, if the ruler appoint them, the people must use them because concord with that imperfection is better than to sing everyone a several better version or diverse versions at once. So a faulty translation of Scripture, a weak sermon, an inconvenient hour and place, when concord is necessary and cannot be had in the more edifying circumstances, it must be had in the best way we can. If the sheriff appoint an unfit time and place to meet to choose parliament-men, it’s a duty to comply rather than not to meet at all. Every evil so far excludes good, and yet we must not renounce communion in all good where men mix any evil lest we also give over all good ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-4bf48a1049" data-kw="">
<blockquote><p>(2) There is dignitas convenientiae [worthiness of fitness], which consists, though not in a perfect and exact proportion, yet in some fitness and meetness unto that which is required. Thus, in scripture, are we commanded ‘to walk worthy of the Lord,’ worthy of our profession, worthy of the gospel… And thus must we come worthily: that is, so fitted and prepared as may bear some resemblance and agreement to the solemnity of the work that we go about. And in this sense, this worthiness follows that worthiness which is called by divines dignitas dignationis — ‘a worth of acceptance’, or a desiring of God to take our actions in good part for Christ’s sake, and to pardon the many failings that accompany them.</p></blockquote>

</figure><figure class="quote" id="q-5b9b83fe3d" data-kw="">
<blockquote><p>…hereafter at the great Day of Judgment it will be a part of the glory of God to manifest before men and angels how He did accept of those holy services that thou didst tender up to Him; when hypocrites shall be cast away and abhorred, and thou who hadst an upright, sincere heart shall be owned before God, and before men and angels at that great Day; and God shall say, ‘Well, it is a part of the glory of my holiness to make it appear that I have accepted of these holy things that these my poor servants have tendered up to Me.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 7, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”, p. 120</span></figcaption>

</figure><figure class="quote" id="q-d4fd6b8c0f" data-kw="">
<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

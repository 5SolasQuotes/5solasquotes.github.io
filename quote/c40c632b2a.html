<blockquote><p>The third innovation is that the word of promise, ‘This is my body,’ ‘This cup is the new testament, etc.’ is not uttered demonstratively when the elements are delivered to every communicant. It is not enough that the words of the institution were rehearsed before by way of history narratively, or materially. This sacrament is an imitation of Christ, not a recital of his words and actions; it is to do as He did, and not to report what He did, says Pierre du Moulin.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ba6d64e02" data-kw="">
<blockquote><p>3. That God required not moral preparation in them for eating the Passover as he does in us before we eat the Lord’s Supper [as the congregationalists claimed], I conceive to be an untruth. 1. Because not to profane the holy things of God, and not to take God’s Law in their mouth and to hate to be reformed, Ps. 50:16, not to sacrifice with bloody hands, Isa. 1:11-12, etc. Ps. 50:8-10; Isa. 66:1, was moral, and did bind and oblige the Jews as they do us, and 2 Chron. 30:6, the posts are sent to gather the people to the Passover, charging them to turn to the Lord God of their fathers, not to be like their fathers; and it is clear by Hezekiah’s prayer, verses 18-19, ‘Good Lord pardon him that prepares his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary,’ verse 20, ‘And the Lord hearkened, and healed the people.’ Therefore, there was required a preparation of the heart for the right eating of the Passover, besides the typical and ceremonial preparation. Yea God counted the ceremonial preparation void of the moral preparation but abomination, as Isa. 66:1; Isa. 58:3-6 and Josiah’s Passover is commended from this, 2 Kings 23:22 (as Junius well observes) that none did with such care and zeal, as Josiah did prepare the priests, the people and himself for the passover, in removing all idolatry and abomination, and in renewing their covenant and resolution, verse 3, ‘to walk after the Lord and to keep his commandments with all their heart and with all their soul.’ 4. The unclean and uncircumcised in heart were no more members of the true and invisible Church of the Jews, and of Christ’s mystical body, his spouse, his royal generation, than Sodom and Gomorrah, Isa. 1:10, than the Ethiopians, Amos 9:7, than Ammon and Moah, Jer. 9:25-26, as in the New Testament, and the true invisible Church amongst them, as amongst us were kings and priests unto God, Ex. 19:5,9; Ps. 149:1, as we are, 1 Pet. 2:9-10; Rev. 1:5. 5. Amongst them no man could invade the priest’s office, or run unsent, no more than under the New Testament, Heb. 5:4; 1 Tim. 4:22, though they were to rebuke one another, Lev. 19, and they had sacrifices for sins of ignorance, Lev. 4:27… And a third step was excommunication and casting out of the synagogue after the captivity, which are the very degrees of our Church censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 2</cite>, pp. 190-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<blockquote><p>II. Who Should be Admitted to the Lord’s Table? Second Conclusion: These only are to be admitted to the Supper of the Lord, whom in charity we judge, can and do try and examine themselves, rightly discern the Lord’s body, and who in faith can enunciate the Lord’s death unto his second coming again. And therefore children, infants, ignorants, scandalously flagitious persons, and mad [mentally insane] persons are to be debarred.</p></blockquote>

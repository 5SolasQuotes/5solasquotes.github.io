</figure><figure class="quote" id="q-b51e8b1a95" data-kw="">
<blockquote><p>Philo Judaeus, Origen, Athanasius, Hilary, Augustine, Procopius of Gaza, Arnold of Chartres, R. Moses ben Maimonides in Moreh Nebuchim, bk. 2, ch. 30, 72, Cajetan, Bodin and Melchior Canus willed that the work of creation was accomplished in a moment, not in six days, and they thought that the six-day period of Moses should be understood allegorically. To whom we oppose: 1. The history of Creation in Gen. 1:5 ff., which relates in clear words what things were created on each day. 2. The sanctification of the Sabbath, for which this reason is given, because God created the heaven and the earth in six days and rested on the seventh day; which could not be said if the work of creation had been accomplished in a moment. Nor is the contrary opinion proved from Sirach 18:1, “He that lives for ever created all things at once (κοινῇ)”; for the little word κοινῇ refers not to “created,” but to “all things,” so that the sense is that God created all things without exception, and it is a collective of all created species, not, however, of time to a moment, and is to be taken not chronologically (χρονικῶς), but as a summary (συναγωγικῶς). Whence 3. Other fathers rightly defend the six-day creation with us, e.g., Chrysostom, Basil, Nazianzen, Ambrose, Gregory; to whom 4. Almost all the Scholastics subscribe. See Becanus, Theologia Scholastica, pt. 1, tract 4, ch. 1; Boyvin, Philosophia Scoti, pt. 1, Physics, pt. 2, disp. 1, ch. 3, sect. 1, quest. 6, p. 460-61. To the question, however: “Could not at least the works of individual days have been produced in a single moment?” we respond: The works of the first creation, or the first and immediate creation, were made in a single moment and a very brief space of time. In the mediate and second creation also [through the rest of the week], the command itself or the fiat of God was accomplished in a single moment, to which the works of the subsequent days, conformably to the nature of things, some were made without delay, at least a protracted one, some with some delay, in such a way, however, that the work of each day was completed on each day. What was disputed concerning this question between Maresius and Wittich, read in Wittich, Theologia Pacifica, ch. 7, §71-73, pp. 52-53; cf. also Burmann, Synopsis Theologiae, bk. 1, ch. 42, §6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706) Latin</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-bf60db601c" data-kw="">
<blockquote><p>The State, considered in its corporate character, is a MORAL PERSON, with a moral standing and responsibility. It is not the creation of the so-called social compact or of the popular will, but a divine institution based on natural religion. It coheres by a moral and religious bond; and its rulers are the lieutenants of God. If the State is a moral person, capable of performing duty, of committing sin, and suffering punishment, which everyone must own who traces the fate of nations according to the divine word, it follows that a nation, acting by its rulers, can accept Christianity and make a public profession of it as the national rule and guide. It had been held together previous to the recognition of Christianity by some form of religion however impure, without which it could not have existed. And the first duty of the civil ruler when brought in contact with Christianity and persuaded of its divine origin is to RECEIVE THE BIBLE AS A REVELATION in a national way. The immediate effect of this is that it constitutes the State a Christian State, and pledges it to purge out its previous religion in the same way as Pagan and Mahommedan nations constituted themselves, according to their false religions, or as the atheistic state was constituted, or rather attempted to be constituted, by the French Convention. A nation must have a religion, and the only question is, which it will adopt. And when Christianity comes to the nation, or to the family, it does not frown on either of these institutions, which also are divine in origin, but enters into them with an elevating purifying power, and sweetly coalesces with all that is purely human in both. These ordinances of God now became vessels by which Christianity is diffused. The national recognition of the Bible as a revelation subjecting the nation to its authority, though a great step gained, does not exhaust the nation’s duty, as widely diverging views prevail upon the right interpretation of the Bible. The State must by the necessity of the case ADOPT A CREED which will commonly be prepared by the Church. The same duty that devolves upon an individual Christian confronts a Christian State, and it naturally appends the civil sanction to the Church’s creed. It must distinguish between scripture truth and its perversion. The State, by the adoption of a creed, gives utterance to the self-consciousness of a Christian community. It confesses the Christianity it has adopted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scottish Theory of Ecclesiastical Establishments and How Far the Theory is Realised</cite>, (1875), pp. 4-5</span></figcaption>

<blockquote><p>33. That, as it is the duty of every man to worship God in such a manner as he thinks most acceptable to Him; all persons, professing the Christian religion, are equally entitled to protection in their religions liberty… the Legislature may, in their discretion, lay a general and equal tax, for the support of the Christian religion… And all acts of Assembly, lately passed, for collecting monies for building or repairing particular churches or chapels of ease, shall continue in force, and be executed… …and every encumbent of the church of England, who has remained in his parish, and performed his duty, shall be entitled to receive the provision and support established by the act, entitled ‘An act for the support of the clergy of the church of England, in this Province,’… … 35. That no other test or qualification ought to be required on admission to any office of trust or profit, than such oath of support and fidelity to this State, and such such oath of office, as shall be directed by this Convention, or the Legislature of this State, and a declaration of a belief in the Christian religion. 36. That the manner of administering an oath to any person, ought to be such, as those of the religious persuasion, profession, or denomination, of which such person is one, generally esteem the most effectual confirmation, by the attestation of the Divine Being…</p></blockquote>

-principle-in-the-american-westminster-standards-and-early-american-states/#:~:text=33.%20That%2C%20as%20it%20is%20the,the%20attestation%20of%20the%20Divine%20Being&amp;text=33.%20That%2C%20as%20it%20is%20the%20duty%20of&amp;text=confirmation%2C%20by%20the%20attestation%20of%20the%20Divine%20Being" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience (1649), ch. 4, pp. 46-47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+the+question+is+concerning+the+imperated+%5Bcommanded%5D+acts+and+these+external%2C+that+is+not+touching+opinions+and+acts+of+the+mind%2C+but+that+which+is+visible+and+audible+in+these+opinions%2C+to+wit%2C+the+speaking%2C+professed+holding+of+them%2C+publishing%2C+teaching%2C+printing%2C+and+known+external+persuading+of+others+to+be+of+our+mind.+So+that+the+question+will+come+to+this%2C+whether+the+Magistrate%E2%80%99s+sword+be+to+regulate+our+words+that+concerns+our+neighbor%2C+as+that+we+lie+not%2C+we+forswear+not%2C+to+the+hurt+of+the+life+and+credit+of+our+neighbor%2C+that+we+slander+not%2C+rail+upon+no+man%2C+far+less+against+the+prince+and+ruler+of+the+people%2C+but+whether+the+words+we+utter+or+publish+of+God+though+never+such+blasphemies%2C+and+lies%2C+because+they+come+from+the+conscience+%28as+is+truths+or+words+we+speak+for+or+against+our+neighbor+did+not+flow+from+a+conscience+either+good+or+ill%29+be+above+or+beyond+all+swords+or+coercive+power+of+men.+It+is+clear+the+question+must+be+thus+stated%2C+for+all+the+laws+of+the+Old+Testament+%28which+we+hold+in+their+moral+equity+to+be+perpetual%29+that+are+touching+blasphemies%2C+heresies%2C+solicitation+to+worship+false+gods+and+the+breach+of+which+the+godly+magistrate+was+to+punish%2C+command+or+forbid+only+such+things+as+may+be+proved+by+two+or+three+witnesses%2C+and+which+husband+and+wife+are+not+to+conceal%2C+and+from+which+all+Israel+must+abstain+for+fear+of+the+like+punishment%2C+Dt.+13%3A8-11%3B+17%3A5-6%3B+Lev.+20%3A1-5.+But+opinions+in+the+mind%2C+acts+of+the+understanding%2C+can+never+be+proved+by+witnesses+and+such+as+neither+Magistrate+nor+Church+can+censure.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience+%281649%29%2C+ch.+4%2C+pp.+46-47&amp;url=https%3A%

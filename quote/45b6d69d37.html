<main class="wrap"><figure class="quote" id="q-45b6d69d37" data-kw="">
<blockquote><p>42nd Question, How Moses was contented with Aaron’s Answer. 1. He did not absolutely approve of his reason, as though he had done it intuita divino, by divine direction, as Cajetan: for Moses was better acquainted with God’s mind than Aaron, and there was a direct commandment, which should not have been omitted. 2. But Moses rather in human commiseration bears with Aaron’s infirmity: 1. because he saw him forced by a kind of necessity… 2. and afflication was not to be added to affliction, Osiander: and Moses found it to be of less fault than he supposed, Calvin: he did it not willingly, but of human frailty and of perplexity through grief, and therefore was to be pitied. 3. And it may be Moses deferred his further admonishing of Aaron till another time because he saw now he was in grief…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Leviticum, that is, A Sixfold Commentary upon the Third Book of Moses, called Leviticus… (London, 1631), on Lev. 10</cite>, pp. 197-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>…ye are full Donatists [early Church heretics]… you do agree with them in the sum and substance of all the fowlest things…: … 2. That ye condemn all the Churches in Europe which profess the Gospel… that their worship is blasphemous idolatry, in as much as they have liturgies… … 3. That ye confound errors and heresies, as to make all errors heresies… … 5. That ye deny the distinction of errors fundamental and not fundamental… … 13. That ye deny men are to join in that worship where any errors whatsoever do appear, and are not reformed, and so open a most wide gap unto all schisms… … 28. That ye maintain that no fault is to be tolerated in the church: but if any private man do espy a fault and reprove it, if they will not amend it, he is to forsake that church.</p></blockquote>

</figure><figure class="quote" id="q-d6862f053c" data-kw="">
<blockquote><p>26. In most countries of England, many hundred persons to one must have Church communion in the parish churches, or have none at all: And to renounce all Church worship and communion rather than join in the parish churches and with the liturgy, and to persuade all to do so, is almost to draw the land to live like atheists and is so pernicious to souls that no good Christian should favour it. And it is a gross breach of the [Solemn League and] Covenant [1643] which renounces profaneness, schism and all that is contrary to godliness. 27. So much are Papists angry at Protestant ministers that keep them [non-conformists] out of the parish churches, [Papists] reviling them [such Protestant ministers] as trimmers, [Papists] supposing that conventicles [worship assemblies of non-conformists] can do them less harm, that all that love the Protestant religion should do their best to encourage† all such orthodox men and to strengthen the Protestant interest in the parish churches, and not join against them with the Papists (however it be with other intents and minds).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | We need Popular Religion Strengthened</cite></span></figcaption>

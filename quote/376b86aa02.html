<blockquote><p>for when we prove the disjunctive properties of being we by that fact demonstrate the existence and nature of the first being, namely God… God, in whom indeed is verified the perfect member of each disjunction, namely permanent, pure act, uncaused, substance, absolute etc.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84833c67e1" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The fourth way is taken from the gradation to be found in things. Among beings there are some more and some less good, true, noble and the like. But more and less are predicated of different things, according as they resemble in their different ways something which is the maximum, as a thing is said to be hotter according as it more nearly resembles that which is hottest; so that there is something which is truest, something best, something noblest and, consequently, something which is uttermost being; for those things that are greatest in truth are greatest in being, as it is written [by Aristotle] in Metaphysics, 2[.1]. Now the maximum in any genus is the cause of all in that genus; as fire, which is the maximum heat, is the cause of all hot things. Therefore there must also be something which is to all beings the cause of their being, goodness, and every other perfection; and this we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>

</figure><figure class="quote" id="q-f604592be6" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The fifth way is taken from the governance of the world. We see that things which lack intelligence, such as natural bodies, act for an end, and this is evident from their acting always, or nearly always, in the same way, so as to obtain the best result. Hence it is plain that not fortuitously, but designedly, do they achieve their end. Now whatever lacks intelligence cannot move towards an end, unless it be directed by some being endowed with knowledge and intelligence; as the arrow is shot to its mark by the archer. Therefore some intelligent being exists by whom all natural things are directed to their end; and this being we call God.</p></blockquote>

</figure><figure class="quote" id="q-77dd121d1c" data-kw="">
<blockquote><p>It also teaches things existing in the world, all of which are from another, to another, or on account of another. For bodies are not sufficient to exist in themselves and lack the power of motion, and those that consist without support and that are born from things unaware of themselves must be astonishing. Nor can spirits, differing entirely from bodies, be produced by either bodies or other finite spirits, and they cannot be satisfied in any created thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Theology</cite>, tr. Casey Carmichael in Classic Reformed Theology, vol. 4 (RHB, 2019), Locus 3, ‘On the Existence &amp; Divinity of God’, sect. 1, ‘The Existence of God’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-2bde2e5eac" data-kw="">
<blockquote><p>We can briefly recapitulate the essentials of the preceding proofs and complete them in the following demonstration of the existence of one God. Beginning from the necessary and evident proposition that ‘it is possible that something exists’, we lay down three conclusions: first, that some being from-itself actually exists; second, that such a being is infinitely perfect; third, that only a single being infinitely perfect can exist. Conclusion 1: Some being from-itself actually exists. I prove this conclusion summarily as follows: if something can exist, this something is either a being from-itself altogether independent or a being from another and so dependent with respect to its continued existence. If it is from another there is required at the same time a cause conserving it in existence. If this cause is not a being from-itself there is either a) an infinite regress in conserving causes, or b) a circle in such causes, or c) there is an ultimate stand in some being simply first, namely in a first conserver that is not conserved by anything because it is a being from-itself.¹ ¹ [Wolter speaks on p. 81 of ‘Ockham’s proof from conservation (see Boehner, ‘Zu Ockhams Beweis der Existenz Gottes’, Franz. Stud. 32, 1950, 50ff)’.] But an infinite regress in conserving causes is impossible, for such causes must be simultaneous.¹ The like must be said of a circle in conserving causes. Therefore in either case, in order that something be able to exist, there is required as a condition sine qua non some other being that exists from-itself. But if a being from-itself did not actually exist, it could not exist. ¹ [“But what of the reason that a being persists? Either it is something that depends on another with respect to its existence and permanence or it is not… An infinite series of things existing simultaneously is impossible, because such a series would be simultaneously dependent and independent: dependent because it would be indifferent to existing and would not have in itself a reason for existing; independent because nothing would exist outside the series for it to depend on, otherwise it would not be an infinite series since limited and brought to an end in the being on which it depends. By such a series then cannot be explained why something exists. This argument is confirmed by an example. Who would say that a sufficient reason for the suspension of the whole of a chain could be found in the length itself of the chain even though it could not be found in any ring of the chain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, ch. 1, article 1, ‘On the Existence of a Single God’, pp. 77-81 Wolter (d. 2006) was a Scotus scholar. The below continues from Wolter’s section in ‘From ‘Something is Finite”., pp. 34-35]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

on+some+other+being+that+exists+from-itself.+But+if+a+being+from-itself+did+not+actually+exist%2C+it+could+not+exist.+%C2%B9+%5B%E2%80%9CBut+what+of+the+reason+that+a+being+persists%3F+Either+it+is+something+that+depends+on+another+with+respect+to+its+existence+and+permanence+or+it+is+not%E2%80%A6+An+infinite+series+of+things+existing+simultaneously+is+impossible%2C+because+such+a+series+would+be+simultaneously+dependent+and+independent%3A+dependent+because+it+would+be+indifferent+to+existing+and+would+not+have+in+itself+a+reason+for+existing%3B+independent+because+nothing+would+exist+outside+the+series+for+it+to+depend+on%2C+otherwise+it+would+not+be+an+infinite+series+since+limited+and+brought+to+an+end+in+the+being+on+which+it+depends.+By+such+a+series+then+cannot+be+explained+why+something+exists.+This+argument+is+confirmed+by+an+example.+Who+would+say+that+a+sufficient+reason+for+the+suspension+of+the+whole+of+a+chain+could+be+found+in+the+length+itself+of+the+chain+even+though+it+could+not+be+found+in+any+ring+of+the+chain%3F%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+Little+Summary+of+Metaphysics+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29%2C+pt.+3%2C+ch.+1%2C+article+1%2C+%E2%80%98On+the+Existence+of+a+Single+God%E2%80%99%2C+pp.+77-81+Wolter+%28d.+2006%29+was+a+Scotus+scholar.+The+below+continues+from+Wolter%E2%80%99s+section+in+%E2%80%98From+%E2%80%98Something+is+Finite%E2%80%9D.%2C+pp.+34-35%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2bde2e5eac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2bde2e5eac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=We%20can%20briefly%20recapitulate%20the%20essentials,in%20any%20ring%20of%20the%20chain&amp;text=We%20can%20briefly%20recapitulate%20the%20essentials%20of%20the&amp;text=be%20found%20in%20any%20ring%20of%20the%20chain" rel="noopener" target="_blank">Read it online · Reformed Books Onlin

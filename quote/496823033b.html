<main class="wrap"><figure class="quote" id="q-496823033b" data-kw="">
<blockquote><p>A multitude may be one Church, though they do not meet together into one place for the worship of God: for example, it may fall forth, that a congregation cannot meet together into one, but into diverse places, and this may continue so for some years together, either by reason of persecution, or by means of the plague, or because they have not such a large parish-Church as may contain them all, so that a part of them must meet in some other place: but a multitude cannot be one Church, unless they communicate in the same Church government, and under the same governors (by one Church I mean one Ecclesiastical Republic) even as the like union under civil government and governors maketh one corporation:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, … (Edinburgh, 1641), 2nd pt., ch. 3, p. 145. Gillespie is arguing against congregationalism.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-292947d1fe" data-kw="">
<blockquote><p>From the Council Registers we see that the plague made its appearance at Geneva in 1542, and that during several years it made great ravages in the town and throughout the whole territory of Savoy. The number of sick was immense. It was almost certain death to visit them. Three ministers offered spontaneously to discharge that duty: Calvin, Sebastian Castalio, and Blanchet. Castalio, who was the first person designated by lot, appears to have declined that perilous honour. Banchet generously made the sacrifice of his life; and the urgent solicitations of the Seigneury of Geneva, who were afraid to expose the valuable life of the Reformer, could alone determine Calvin to desist from undertaking the charge which he bad himself solicited.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geneva.html">Jules Bonnet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of John Calvin</cite>, ed. Jules Bonnet</span></figcaption>

</figure><figure class="quote" id="q-4f2cfd9477" data-kw="">
<blockquote><p>…we are unworthy to lift up our eyes unto heaven and appear in thy presence, and that we ought not to presume to hope that thou wilt listen to our prayers if thou takest account of the things which we lay before thee; for we are accused by our own consciences, and our sins bear witness against us, while we know thee to be a just Judge, who justifiest not sinners and wicked men, but inflictest punishment on those who have broken thy commands. Hence it is, Lord, that when we reflect on the state of our whole life, we are ashamed of ourselves, and can do nothing but despond, just as if we were plunged into the abyss of death. And yet, Lord, since thou hast deigned, of thy boundless mercy, to command us to call upon thee, and that from the lowest hell, and the more devoid of strength we see ourselves to be to flee the more to thy supreme goodness ; since, moreover, thou hast promised that thou wilt listen to our prayers in the name of the Lord Jesus Christ, (whom thou hast appointed to be our advocate and intercessor,) and for his merit, without looking to what we have deserved, we here, renouncing all human confidence, and trusting solely to thy goodness, hesitate not to come into thy sight, and call upon thy holy name, in order to obtain mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, ‘Almighty God, heavenly Father, we acknowledge and humbly confess…’ in Forms of Prayer for the Church in ‘Forms of Prayer’ in Tracts, vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-e6f79cad8b" data-kw="">
<blockquote><p>…neither can he [an opponent] be ignorant of that which he has so often read and learned of your most godly writings, that it pertains not to the prince either to prescribe religion to the kirk or discipline to the pastors thereof, but by his authority to confirm both the one and the other, appointed by God, and sincerely declared out of his Word by the ministry of his servants; to revenge and punish all corrupting of clean doctrine, contempt of holy discipline, and perturbation of lawful order (for which use and purpose he has received the sword), to decore the Assemblies, if need be, with his presence; to arm the innocency of the ministry by his safe-guard and defense; if there arise controversies among the pastors, sometimes to compose and agree the same by his authority interpouned; to promove, by good laws made for that effect these things which are lawfully constituted by the Assemblies, and to do many other things for the weale of the kirk which were long to rehearse, and unneedful. But far otherwise does he sit in the synods among the pastors than he does in the throne of the kingdom among the estates: here to make laws for subjects and command, but there to receive laws from God and to obey. And albeit that some things be called ecclesiastical, and other things civil, and the civil appertain to the commonweal, and the other to the kirk; yet it is not so much to be considered what things are handled, as how, seeing the knowledge of one and the self-same thing one way, and in some respect, appertains to the magistrate, and another way to the senate ecclesiastical. And yet such a matter neither does the kirk civilly, nor the counsel or parliament ecclesiastically entreat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-melville.html">Andrew Melville</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘To Pastors of the Kirk of Geneva &amp; Zurich’</cite>, pp. 165-66 in David Calderwood, History of the Kirk of Scotland, vol. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

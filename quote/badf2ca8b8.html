<main class="wrap"><figure class="quote" id="q-badf2ca8b8" data-kw="">
<blockquote><p>Spiritual substance is distinguished from matter by the characteristic of self-motion, or motion ab intra [from inside]. Matter must be moved from without, by another material substance impinging upon it. But mind moves from within. Its motion is not from external impact, but is self-motion. Adam was created a spirit. The instant, therefore, that he was created, he had all the characteristics that distinguish spirit from matter. One of these, and one of the most important, is self-motion. But self-motion is self-determination, and self-determination is inclination. The Scripture asserts that Adam was created a ‘living soul.’ Life implies motion; and the motion in this case was not mechanical or material, but the motion of mind. Thus in creating a rational spirit, God creates a self-moving essence, and this is a self-determining will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (NY: Charles Scribner’s Sons, 1888), vol. 2, ch. 2, ‘Man’s Primitive State’, p. 100</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de4599187b" data-kw="">
<blockquote><p>1. Theology is usually divided into the Theology of the Laity and the Theology of the Doctors, which they call argumentative and Scholastic. The former is a bare knowledge of the credibilia (as they call them) necessary for salvation. The latter is not a bare knowledge of the credibilia, but is the faculty by which we are able to explain, defend, and confirm the articles of faith, and to instruct others concerning their truth. 2. Argumentative or Scholastic Theology is said to exceed the Theology of the Laity in a twofold respect: first, because it extends itself to more credibilia; for learned men in spiritual matters understand more than the Laity and the simple. Secondly, because it is able to explain to others those things which are to be believed, and to defend and confirm them against Atheists, Jews, Mohammedans, and Pagans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Philosophy, the Handmaiden of Theology 2nd</cite>, ed. trans. AI (1621; Robinson &amp; Davis, 1658), 3rd Exercise, art. 7, p. 91 Latin</span></figcaption>

</figure><figure class="quote" id="q-23cb3ef646" data-kw="">
<blockquote><p>A guiding presupposition [of Matthew Barrett’s The Reformation as Renewal] is that the intellectual life of the second half of the thirteenth century was ‘characterized by a Thomistic atmosphere’ and that the later medieval theologians progressively fell away from the classical positions affirmed by Aquinas. Indeed, according to Barrett it was this degeneration away from Thomism in the later middle ages that was a significant catalyst for the Reformation. As soon as this presupposition is outlined, however, it is possible to see that Barrett’s account has, at the very best, an outdated view of later medieval thought. This kind of ‘decline’ narrative has not been maintained by experts in the thought of the period for many years, despite its persistence among historians whose direct acquaintance with scholastic texts ends with the death of Aquinas. The reason is that, outside the Dominican order (and, for that matter, inside it too at least until the middle of the fifteenth century), there never was a ‘Thomistic atmosphere.’ Why it was ever believed that there was one is not clear to me. But it is true to say that we do not pervasively find the kind of narrative Barrett reproduces until after Leo XIII’s Aeterni patris of 1879, and it is hard to avoid the conclusion that this encyclical itself had something to do with bringing about the anachronistic centering of Aquinas in our medieval intellectual history. This was no doubt an unintended consequence of Leo’s action, since it is clear enough that Leo’s motivation had to do with an appraisal of Aquinas’s intellectual weight, not of his influence on later medieval theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Accidental Reformation?’ in Hanover Review</cite>, 3.1 (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

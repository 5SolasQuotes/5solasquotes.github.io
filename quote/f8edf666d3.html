</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2b293669f" data-kw="">
<blockquote><p>(1) The natural life supposes generation; so does the spiritual, which is therefore expressed by ‘regeneration’, or by ‘being born again’, Jn. 3:3 and 1 Jn. 2:27. Now look, as in natural generation we are first begotten, and then born, so here there is an act qua regeneramur, ‘by which we are begotten again’, and qua renascimur, ‘by which we are born again’. There is an act of God, by which we are begotten again, viz. by the powerful influence of grace upon our hearts, accompanying in the Word, Jm. 1:18; and there is an act of God, by which we are born again, viz. when the new creature is formed in us, and begins to discover itself (“being born again, not of corruptible seed, but of incorruptible”). Effectual calling and sanctification are these two [respective] acts: by the one we are begotten, by the other born; the one may be called our passive, the other our active regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (d. 1677; London: Astwood, 1684), Sermons on 2 Cor. 5, Sermon 30, on 2 Cor. 5:15</cite>, p. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-672d41dcda" data-kw="">
<blockquote><p>This former doctrine is of great use. In that the new birth and regeneration of a sinner is not without the motion of his own will, we are taught that we must, if we desire our own salvation, use the good means and strive against our own corruptions and endeavour earnestly by asking, seeking, knocking. It will be said that faith, repentance and the rest, are all gifts of God. I answer, there is no virtue or gift of God in us, without our wills: and in every good act, God’s grace and man’s will concur: God’s grace as the principal cause: man’s will renewed as the instrument of God. And therefore in all good things industry and labour, and invocation on our parts is required. Secondly, this doctrine ministers true comfort to all true servants of God. For, if when they use the good means of salvation, the Word, prayer, sacraments, the will lie not dead but begin to oppose itself against unbelief and other corruptions, and withal do but so much as will to believe, will to repent, will to be turned to God, they have begun to turn unto God, and God has begun to regenerate them, so be it this will in them to do the good they ought to do be in good earnest unfeigned and they withal be careful to cherish this little grain till it come to a bigger quantity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, pp. 129-30</span></figcaption>

</figure><figure class="quote" id="q-2575e114d8" data-kw="">
<blockquote><p>IV. Problem: Whether the will, both in the first and in the second moment of conversion, is determined by grace immediately, or indeed mediately through the ultimate judgment of the practical intellect? Response: See concerning this question the Appendix to the Disputations on Creation. V. Problem: Whether the affirmative opinion [that the will is determined in conversion only mediately] does not favor Pelagianism, and deny the necessity and efficacy of grace in the will? Response: Negative, because they can nevertheless defend special grace, and that efficaciously prevailing and conquering, which is never rejected or can be rejected by any hard heart, in the composite sense; moreover they attribute nothing of faculty or cooperation for spiritual life to man in the first moment of conversion—as can be seen in [John] Cameron’s disputation with Tilenus, and his apology against the epistle of the anonymous Remonstrant (entitled “The Epistle of a Learned Man,” etc.) afterwards published. VI. Problem: Whether the truth can be more easily, evidently, and solidly explained and defended against the Pelagians by this reasoning? Response: So indeed Cameron, just praised, seems to think, and with him Dr. Maccovius in his Academic Disputations recently published. Yet the ancient and received opinion is not obscurely preferred by Molinaeus in his Disputation on Free Will; Walaeus in his Disputation on the Conversion of the Will, in the year 1622, on the 17th day of March; Ames in his Medulla, and passim in his Anti-Remonstrant writings; and Spanheim, who appeared after the first edition of the present disputation, in his latest writing against Universal Grace. The Dominicans and other genuine Thomists, who today plead the cause of God in this matter against the Jesuits and other more recent Pelagians, do not think alike here—concerning which elsewhere. We touch on this question in the Disputations and Problems on Creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology</cite></span></figcaption>

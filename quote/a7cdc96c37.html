<main class="wrap"><figure class="quote" id="q-a7cdc96c37" data-kw="">
<blockquote><p>‘Who has made us fit.’ Doctrine: We are neither naturally happy, nor universally so; not naturally, for we are made fit; not born so, not universally; for He has made [us] fit, not all men. Christ died for his sheep only (Jn. 10), for his Church only (Eph. 1), not for the world (Jn. 17). And therefore when the Scripture says Christ died for all men, we must understand it: First, in respect of the sufficiency of his death, not in respect of the efficiency of it. Secondly, in respect of the common oblation of the benefits of his death externally in the Gospel unto all. Thirdly, as his death extends to all the elect: for all, that is, for the elect. Fourthly, for all, that is, for all that are saved, so that none that are justified and saved, are so, but by the virtue of his death. Fifthly, for all, that is for all indefinitely, for all sorts of men, not for every man of every sort. Lastly, He died for all, that is not for the Jews only, but for the gentiles also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians (1617), on Col. 1:12</cite>, p. 99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd89f9854c" data-kw="">
<blockquote><p>This proves, therefore — (1.) That Christ did not die simply to make the salvation of those for whom he died possible — i.e., to remove legal obstructions to their salvation — but that he died with the design and effect of actually securing their salvation and of endowing them gratuitously with an inalienable title to heaven. (2.) It proves, in the second place, that the vicarious sufferings of Christ must have been, in design and effect, personal and definite as to their object. Salvation must be applied to all those for whom it was purchased. Since not the possibility or opportunity for reconciliation, but actual reconciliation itself was purchased: since not only reconciliation, but a title to an eternal inheritance was purchased, it follows (a.) That “to all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same.” Conf. Faith, ch. 8 § 8. And (b.) That he who never receives the inheritance, and to whom the purchased grace is never applied, is not one of the persons for whom it was purchased.</p></blockquote>

<blockquote><p>§VII… To gather the matter into a few words, according to this position God, being about to illustrate his glory, decreed: 1. To create the world and man in it with original justice and with the gifts necessary for persevering in the State of Innocence. 2. To permit the Fall of man. 3. To send a Mediator, who for the universal fault, would pay a universal and most sufficient ransom. 4. To call all seriously and sufficiently to embrace this Mediator. 5. Of the called and relapsed to elect some, through and on account of Christ, to give them a living and rooted faith, through this faith to justify, sanctify and glorify them; The rest, by their own fault, on account of their sins, original and actual, and therefore avoidable, especially on account of contempt of the Mediator, to reprobate and damn. §VIII. This position the divine John Sigismund, Elector of Brandenburg, professed in his Confession of Faith, heroically-Christianly; This the divine George William, Elector of Brandenburg, by sending the same Confession of Faith to the Synod of Dort, made his own, and testified to be his own, and at the Colloquy of Leipzig in the year 1631, he took care to have it expounded by the theologians, of Brandenburg, D. Johann Bergius, and of Hesse, D. Johann Crocius and Theophilus Neuberger; This the divine Frederick William the Great not only took care to have it more broadly explained and defended by his theologians in the year 1645 in the Declaration of Thorn at the Charitable Colloquy, but also gloriously asserted it in the Electoral Edicts of the year 1662 and the year 1664, and augmented them. This the August and Most Potent Lord Frederick, King of Prussia and Elector of Brandenburg, for his piety towards God, today asserts and defends. §IX. To this we also subscribe on account of the following reasons: … II. And that is proven by the philanthropy of God so often and so emphatically praised in Holy Scripture… To John 3:16, however, we note that by the word ‘world’ only the elect cannot be understood, is clear from the circumstances of the text itself. … Whence not only the doctors of the primitive Church, and among them Augustine, but also the most outstanding doctors of the Reformed Church, Bullinger, Musculus, Gualther, Calvin, Zanchi, Pezel, the Palatines, Johann Bergius, Conrad Bergius, Steinius, Johann and Ludwig Crocius, Hildebrand, Davenant, Ward, Cameron, Amyrald, Dallaeus, Hammond, Bartholomaeus Stoschius, Antonius Brunsenius, Johann Claude, and our own, of pious memory, teachers and predecessors D. Elias Grebenitz, D. Johann Simonis, D. Phil. Buchius, and he who today, with the highest praise, teaches in this our academy and Church, Dn. D. Samuel Strimesius, and others have accepted this word for the human race. … XIII… Then, it is to be observed that Augustine posits certain dogmas which necessarily require this series of ours, such as are: 1. That God has embraced the entire world, i.e., all men, with philanthropy (φιλανθρωπίᾳ, philanthrōpia). 2. That Christ died most sufficiently for all men. 3. That it was in the free power of the called men to come. 4. That the predestination or election of men was made after the exemplar of Christ. 5. That Esau and Judas could have been saved. 6. That all the baptized are regenerated. All of which, even taken separately, sufficiently evince this order of divine decrees. And all these things today—all the Thomists, Augustinians, Dominicans, and other doctors and monks of the Pontificals who are followers of Augustine—confess, approve and defend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Treatise on Predestination, Election &amp; Reprobation of Men, for Promoting Ecclesiastical Concord 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), pp. 41-44 &amp; 57 Latin Holtzfus (1659-1717) was a reformed professor of philosophy and theology at Frankfurt.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“§VII… To gather the matter into a few words, according to this position God, being about to illustrate his glory, decreed: 1. To create the world and man in it with original justice and with the gifts necessary for persevering in the State of Innocence. 2. To permit the Fall of man. 3. To send a Mediator, who for the universal fault, would pay a universal and most sufficient ransom. 4. To call all seriously and sufficiently to embrace this Mediator. 5. Of the called and relapsed to elect some, through and on account of Christ, to give them a living and rooted faith, through this faith to justify, sanctify and glorify them; The rest, by their own fault, on account of their sins, original and actual, and therefore avoidable, especially on account of contempt of the Mediator, to reprobate and damn. §VIII. This position the divine John Sigismund, Elector of Brandenburg, professed in his Confession of Faith, heroically-Christianly; This the divine George William, Elector of Brandenburg, by sending the same Confession of Faith to the Synod of Dort, made his own, and testified to be his own, and at the Colloquy of Leipzig in the year 1631, he took care to have it expounded by the theologians, of Brandenburg, D. Johann Bergius, and of Hesse, D. Johann Crocius and Theophilus Neuberger; This the divine Frederick William the Great not only took care to have it more broadly explained and defended by his theologians in the year 1645 in the Declaration of Thorn at the Charitable Colloquy, but also gloriously asserted it in the Electoral Edicts of the year 1662 and the year 1664, and augmented them. This the August and Most Potent Lord Frederick, King of Prussia and Elector of Brandenburg, for his piety towards God, today asserts and defends. §IX. To this we also subscribe on account of the following reasons: … II. And that is proven by the philanthropy of God so often and so emphatically praised in Holy Scripture… To John 3:16 — Barthold Holtzfus, Theological Treatise on Predestination, Election &amp; Reprobation of Men, for Promoting Ecclesiastical Concord 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), pp. 41-44 &amp; 57 Latin Holtzfus (1659-1717) was a reformed professor of philosophy and theology at Frankfurt.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7VII%E2%80%A6+To+gather+the+matter+into+a+few+words%2C+according+to+this+position+God%2C+being+about+to+illustrate+his+glory%2C+decreed%3A+1.+To+create+the+world+and+man+in+it+with+original+justice+and+with+the+gifts+necessary+for+persevering+in+the+State+of+Innocence.+2.+To+permit+the+Fall+of+man.+3.+To+send+a+Mediator%2C+who+for+the+universal+fault%2C+would+pay+a+universal+and+most+sufficient+ransom.+4.+To+call+all+seriously+and+sufficiently+to+embrace+this+Mediator.+5.+Of+the+called+and+relapsed+to+elect+some%2C+through+and+on+account+of+Christ%2C+to+give+them+a+living+and+rooted+faith%2C+through+this+faith+to+justify%2C+sanctify+and+glorify+them%3B+The+rest%2C+by+their+own+fault%2C+on+account+of+their+sins%2C+original+and+actual%2C+and+therefore+avoidable%2C+especially+on+account+of+contempt+of+the+Mediator%2C+to+reprobate+and+damn.+%C2%A7VIII.+This+position+the+divine+John+Sigismund%2C+Elector+of+Brandenburg%2C+professed+in+his+Confession+of+Faith%2C+heroically-Christianly%3B+This+the+divine+George+William%2C+Elector+of+Brandenburg%2C+by+sending+the+same+Confession+of+Faith+to+the+Synod+of+Dort%2C+made+his+own%2C+and+testified+to+be+his+own%2C+and+at+the+Colloquy+of+Leipzig+in+the+year+1631%2C+he+took+care+to+have+it+expounded+by+the+theologians%2C+of+Brandenburg%2C+D.+Johann+Bergius%2C+and+of+Hesse%2C+D.+Johann+Crocius+and+Theophilus+Neuberger%3B+This+the+divine+Frederick+William+the+Great+not+only+took+care+to+have+it+more+broadly+explained+and+defended+by+his+theologians+in+the+year+1645+in+the+Declaration+of+Thorn+at+the+Charitable+Colloquy%2C+but+also+gloriously+asserted+it+in+the+Electoral+Edicts+of+the+year+1662+and+the+year+1664%2C+and+augmented+them.+This+the+August+and+Most+Potent+Lord+Frederick%2C+King+of+Prussia+and+Elector+of+Brandenburg%2C+for+his+piety+towards+God%2C+today+asserts+and+defends.+%C2%A7IX.+To+this+we+also+subscribe+on+account+of+the+following+reasons%3A+%E2%80%A6+II.+And+that+is+proven+by+the+philanthropy+of+God+so+often+and+so+emphatically+praised+in+Holy+Scripture%E2%80%A6+To+John+3%3A16%2C+however%2C+we+note+that+by+the+word+%E2%80%98world%E2%80%99+only+the+elect+cannot+be+understood%2C+is+clear+from+the+circumstances+of+the+text+itself.+%E2%80%A6+Whence+not+only+the+doctors+of+the+primitive+Church%2C+and+among+them+Augustine%2C+but+also+the+most+outstanding+doctors+of+the+Reformed+Church%2C+Bullinger%2C+Musculus%2C+Gualther%2C+Calvin%2C+Zanchi%2C+Pezel%2C+the+Palatines%2C+Johann+Bergius%2C+Conrad+Bergius%2C+Steinius%2C+Johann+and+Ludwig+Crocius%2C+Hildebrand%2C+Davenant%2C+Ward%2C+Cameron%2C+Amyrald%2C+Dallaeus%2C+Hammond%2C+Bartholomaeus+Stoschius%2C+Antonius+Brunsenius%2C+Johann+Claude%2C+and+our+own%2C+of+pious+memory%2C+teachers+and+predecessors+D.+Elias+Grebenitz%2C+D.+Johann+Simonis%2C+D.+Phil.+Buchius%2C+and+he+who+today%2C+with+the+highest+praise%2C+teaches+in+this+our+academy+and+Church%2C+Dn.+D.+Samuel+Strimesius%2C+and+others+have+accepted+this+word+for+the+human+race.+%E2%80%A6+XIII%E2%80%A6+Then%2C+it+is+to+be+observed+that+Augustine+posits+certain+dogmas+which+necessarily+require+this+series+of+ours%2C+such+as+are%3A+1.+That+God+has+embraced+the+entire+world%2C+i.e.%2C+all+men%2C+with+philanthropy+%28%CF%86%CE%B9%CE%BB%CE%B1%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%AF%E1%BE%B3%2C+philanthr%C5%8Dpia%29.+2.+That+Christ+died+most+sufficiently+for+all+men.+3.+That+it+was+in+the+free+power+of+the+called+men+to+come.+4.+That+the+predestination+or+election+of+men+was+made+after+the+exemplar+of+Christ.+5.+That+Esau+and+Judas+could+have+been+saved.+6.+That+all+the+baptized+are+regenerated.+All+of+which%2C+even+taken+separatel

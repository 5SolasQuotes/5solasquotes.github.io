<main class="wrap"><figure class="quote" id="q-726573c8f3" data-kw="">
<blockquote><p>In order that we may arrive at even the most faint and remote conception of the indescribable sorrow and heaviness of the Saviour, it is necessary for us to have our mind impressed with the doctrine of Scripture regarding the constitution of his person. We are too apt ignorantly to conclude, that to him in whom dwelt all the fulness of the godhead bodily, nothing could be a difficulty, nothing could cost a struggle — that his omnipotence must have borne him onward above the power of pain, and grief, and distress — and that, if his apparent sufferings were not altogether unreal, they must to him at least have been trifling and contemptible.

Now, it is to be remembered that, while he was truly God, co-eternal and co-essential with the father, he was at the same time complete and perfect man, possessed of a true body and a reasonable soul — a soul of the most exquisite sensibility, and susceptible of the most painful impressions from every form of evil. The union of the two natures in his one person was without confusion of their properties.

Notwithstanding the union, the natures remained distinct, and their operations distinct. Neither his original dignity as the Son of God, nor the union of the Divine nature with the human, nor the sacred distinction attending his birth, furnished the slightest ground to doubt his absolute participation of our nature and actual communion with us in all our sufferings. In the body, he was liable to hunger, and thirst, and weariness, as much as any of us. He was capable of being bruised with stripes, torn with scourges, pricked with thorns, pierced with nails, transfixed with a spear.

So also his soul was endued with the same faculties and affections as ours. He was moved with pity and compassion. He was stung with reproach and ingratitude. He was susceptible of affliction, and disturbance, and agony. He was devoid of no property that belongs to us. He was free only from the contamination that adheres to our corrupted nature. Such was the depth of humiliation, such the capacity of suffering, to which he stooped who was the Lord of nature and fountain of life, the eternal partaker of the Father’s happiness, the brightness of his glory the express image of his person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-roxburgh.html">John Roxburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saviour s sufferings, and his satisfaction in the fruit of them’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dac24ced2c" data-kw="Affliction">
<blockquote><p>The truth is, the crook in the lot is the great engine of Providence for making men appear in their true colours, discovering both their ill and their good. And if the grace of God is in them, it will bring it out, and cause it to display itself. It so puts the Christian to his shifts, that however it makes him stagger for awhile, yet it will at length evidence both the reality and the strength of grace in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite>, Doct. I, head III (why God makes a crook)</span></figcaption>

</figure><figure class="quote" id="q-7be8fd49ca" data-kw="">
<blockquote><p>It cannot be concluded, they do not suffer for Christ, who have some sin mixed with that which is made the cause of their sufferings, if it be the cause of God indeed, for the substance of it, and they sincere in it for the main. When the people of God are ready to offer up themselves, and what they have for him, he will not reject such a sacrifice for every blemish. Christ had something against the church of Ephesus, something to charge her with as matter of provocation, even when he is speaking of her sufferings, Rev. ii. 4. And yet he owns her as one that had suffered and laboured for his name’s sake, verse 3.

Nor can this be concluded, because of some miscarriage under their sufferings. David, while he was persecuted by Saul, miscarried divers ways, as you may see 1 Sam. xxi. 2, 12, 13, and elsewhere; yet this did not hinder him from being a sufferer for righteousness.

As the Lord has provided a way, that what his people do for him may be accepted as done for him, though there be too many sinful mixtures therein, so he has provided an expedient, that what they suffer for him may be accepted as suffered for him, though there be many flaws therein, both for matter and manner. The Lord Jesus, the advocate of and sacrifice for his people, is effectual for both. When they apply themselves to him, in the exercise of faith and repentance, through his mediation, that which is therein evil shall not be remembered, that which is good therein will be accepted, Rom. xii. 1. How acceptable, see Eph. i. 6, 7.

Licinius, as you may read, Eusebius De vita Constantini, makes an edict, that whosoever did relieve the imprisoned and distressed Christians should suffer the same things that were inflicted upon them. Now, suppose some, out of love to Christ and his afflicted members, should have ventured (as many did indeed) to have relieved them, and yet should have done it too sparingly, or too fearfully, or with some selfish reflections, and should, according to the edict, have suffered for relieving them, here had been some sin mixed with the cause of their sufferings. And yet in this case, since their cause was good, and the cause of Christ, for the substance of it, who would deny but they suffered for Christ?

Or suppose one should suffer because he would not leave praying (which was Daniel’s case, Dan. 6), and yet in his prayer should have some mixture of unbelief, and lukewarmness, and other distempers, which the best cannot always escape, here would be some sin mixed with the cause of sufferings; yet who would deny but that, suffering for doing his duty, he is a sufferer for God?

To proceed a little further: suppose some godly Lutherans should suffer for those great truths of the gospel, which they maintain against the papists, and together with them should suffer for consubstantiation, which indeed is an error, here would be a sin mixed with the cause of their suffering; yet I suppose their laying down their lives for those other great truths of Christ, notwithstanding this sinful mixture, would be accounted a suffering for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Taking up the Cross in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>

<blockquote><p>In the Sufferings of Christ. Here is a Glass, O Criminals, wherein you may fee your own Face. You think it a little Thing that you have sinned; nay, it may be, you roll Sin at a sweet Morsel under your Tongues. But come here, and see what a Thing it is which you thus dreadfully mistake! Come see it holding the Sword; O strange! Nay more, thrusting it into Christ’s Side! Here, Sinners, is a Sight that made the Earth to tremble, and the Sun to hide his Face, as we see Matth. xxvii. ix. Luke xxiii. 45.

In this Glass you may see, (1.) What GOD’s Thoughts of Sin are. So highly opposite to his Nature is it, that the Bowels of Affection he had to the Son of his Love, whom he so highly honoured, when the Voice came from the excellent Glory, saying, This is my beloved Son in whom I am well pleased, were not able to hold up the Hand of inexorable Justice from striking at him, nay, striking him dead for the Sin of the elect World. Would hot that be a great Proof, think ye, of the Aversion of a Parent to any Thing, if he would rather choose to slay his Son, nay, his only Son, his Son whom he loved most tenderly, than it should escape a Mark of his Displeasure?

(2.) Here you may see more of the Pollution of Sin than any where else. Never was there anything that gave so just Apprehensions of the Stain of Sin, as the Death of Christ. An ingrained Pollution it must indeed be, if no less will wash it out than the Blood of GOD. (3.) Here is a dreadful Evidence of the Power of Sin. Never did this more appear, than when it blinded the Eyes of the degenerate Sons of Men so far, that they could not discern the Glory of the only begotten of the Father, who was so full of Grace and of Truth, whose divine Nature daily beamed, as it were, through that of his human, in miraculous Operations, Works, and Words, which none but GOD could do, none but GOD could speak. And no less was the Power of Sin seen, when it hurried Men headlong into that Heaven-daring Pitch of Impiety, to imbrue their Hands in the Blood of GOD. O Sinners, would you fee what Sin is? look at it with its Hands reeking in the Gore and Blood of GOD, and tell what you think of it.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f2f9ef2aec" data-kw="">
<blockquote><p>Another feature of the book [of Common Order, 1564] was that it was so framed as to make responsive worship impossible. The worshipper was to follow the continuous prayers with silent accord… At Frankfort [Germany] the signal for the outbreak of hostilities between the two parties was the loud responses of the Anglicans when a liturgy of compromise was read. The ground which Knox had taken up there, he was not likely to abandon in Scotland. His position would be that the people’s vocal part in divine service was the singing of Psalms; for the preface to the original Geneva Book says: ‘Prayers are after two manner of sorts, that is, either in words only or else with song joined thereunto.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-leishman.html">Thomas Leishman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ritual of the Church’ in</cite>, ed. Story, Robert, The Church of Scotland, Past and Present (1890 ff.), vol. 5, p. 327</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-9ace4a6900" data-kw="">
<blockquote><p>Further, this power of the keys… The key of the ministry of the Word is set down and established by Christ, Mt. 16:19, ‘I will give unto thee the keys of the kingdom of heaven,’ etc. This ministry of the Word is a key, because it opens and shuts heaven; this it does… Secondly: by applying the promises of the Gospel and the threatening of the Law: For when in the ministry of the Word the promises of remission of sins and life everlasting, are applied to believers that repent, then the kingdom of heaven is opened; and when as in the same ministry of the Word, the curses of the law are denounced against impenitent sinners, then is the kingdom of heaven shut. Yet touching the ministry of the Word, this distinction must be remembered; that otherwhiles the church is certain of the faith and repentance of some men, or some congregation; and then they may pronounce remission of sins absolutely. But otherwhiles they are uncertain of their faith and repentance, or of their impenitency; and then they must accordingly remit or retain men’s sins, that is, conditionally; pronouncing the remission of sins to all that repent: and denouncing damnation to all that repent not. And thus is the word to be publicly handled in God’s Church at this day, because our congregations are mixed companies, consisting of some that repent and believe, and of others that do not truly repent nor believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation</cite>, … (London: Islip, 1606), 3rd Chapter, p. 180</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-904755a747" data-kw="">
<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London, 1649), pp. 372-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-74f5aabfd7" data-kw="">
<blockquote><p>Back in the days of the Arian controversy in the Synod of Ulster, there were some orthodox people who argued that Trinitarians should tolerate Unitarians and Arians in their midst in the hope that this destructive heresy would just quietly die out. Dr John Paul of Loughmourne, on the other hand, argued that this was irrational nonsense:

For the Antitrinitarians and the orthodox to “agree to differ,” is quite preposterous. To say:- “We do not worship the same God – we regard each other as idolaters or blasphemers; and yet, to show our liberality, we will still continue to worship together, we will hold communion with each other.” This is monstrously absurd. What communion hath the temple of God with idols? To sit down at the same holy table of the Lord with those whom we regard as blasphemers or idolaters, is surely a great absurdity; nor is it less absurd to join with them in discipline. What! join in the acts of discipline with blasphemers or idolaters! Join, as a Presbytery, in laying hands on blasphemers or idolaters! Ordain to the work of the holy ministry blasphemers or idolaters! Could any thing be more inconsistent, absurd, or impious? Surely not.</p></blockquote>

<blockquote><p>But if once the government of Christ were set up among us, we know not what would impede it by the sword of God alone [i.e. the Word of God], without any secular violence, to banish out of the land those spirits of error, in all meekness, humility and love, by the force of truth convincing and satisfying the minds of the seduced. Episcopal courts were never fitted for the reclaiming of minds. Their prisons, their fines, their pillories, their nose-slitting, ear-croppings and cheek-burnings did but hold down the flame to break out in season with the greater rage. But the reformed presbytery does proceed in a spiritual method eminently fitted for the gaining of hearts; they go on with the offending party with all respect: they deal with him in all gentleness from weeks to months, from months sometimes to years, before they come near to any censure.</p></blockquote>

</figure><figure class="quote" id="q-7810b67d81" data-kw="">
<blockquote><p>But far be it from me to argue with Bellarmme (de poenit. bk. 3, ch. 2) from Uzziah’s bodily leprosy to infer that any prince who is spiritually leprous and turned heretical, is presently to be dethroned. Nothing can dethrone a king but such tyranny as is inconsistent with his royal office. Nor durst I infer that kings, now a-days, may be removed from actual government for one single transgression. It is true, eighty priests, and the whole kingdom, so serving king Uzziah (their motives, I know, were divine) proves well that the subjects may punish the transgression of God’s express law in the king, in some cases even to remove him from the throne;</p></blockquote>

</figure><figure class="quote" id="q-a299d3c350" data-kw="">
<blockquote><p>Conclusion 1: This civil coercive power is not only unnecessary, but unlawful to be exercised in the planting of the Church, and bringing men to the faith of Christ. Churches are not to be planted by weapons, but by doctrines (Lactantius, Institutes, bk. 5, ch. 20); not by the power of the sword, but by the efficacy of the Word; not by carnal weapons, but by spiritual means. The commission that Christ gave his apostles for the spreading and planting of the Gospel was only this, ‘Go and teach all nations, baptizing them in the name of the Father, and of the Son and of the Holy Ghost,’ Mt. 28:19-20, the like, in Mk. 16:15. And Christ tells us his kingdom is not of this world, for then his servants would fight for him, Jn. 18:36, but that was not the way to plant or advance his kingdom. Christ has no need of such carnal weapons for the planting of his Church, or the settling Him in his kingdom: the apostles had a warfare to fight, but the weapons of their warfare were not carnal, but spiritual, and yet strong to pull down the strongest holds of sin and Satan, and to bring every thought in obedience to Christ, 2 Cor. 10:3-4. They had a sword to wield, but that sword was no other but the Word of God, the sword of the Spirit, Eph. 6:17; Rev. 19:15. Here were armies to subdue even nations to Christ, but these were armies of teachers, not of soldiers, as the Psalmist alludes, Ps. 68:11. External force is not the way of Christ for the spreading his Gospel, and planting of his kingdom: It is true here, Religio suaderi potest, cogi non potest, ‘Men may be persuaded into a religion, but they can never be compelled.’ All externall acts of power are not able to beget internal acts of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, (London: Miller, 1646), p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

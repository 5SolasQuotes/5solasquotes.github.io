<main class="wrap"><figure class="quote" id="q-3cdade0ee1" data-kw="">
<blockquote><p>Accordingly, when the Scripture speaks of &quot;a crown of righteousness which God the righteous Judge shall give&quot; &quot;at that day,&quot; (2 Tim. 4:8), I not only say with Augustine, … but I also add, how could he impute righteousness to our works, did not his indulgence hide the unrighteousness that is in them? How could he deem them worthy of reward, did he not with boundless goodness destroy what is unworthy in them? Augustine is wont to give the name of grace to eternal life, because, while it is the recompense of works, it is bestowed by the gratuitous gifts of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“Accordingly, when the Scripture speaks of &quot;a crown of righteousness which God the righteous Judge shall give&quot; &quot;at that day,&quot; (2 Tim. 4:8), I not only say with Augustine, … but I also add, how could he impute righteousness to our works, did not his indulgence hide the unrighteousness that is in them? How could he deem them worthy of reward, did he not with boundless goodness destroy what is unworthy in them? Augustine is wont to give the name of grace to eternal life, because, while it is the recompense of works, it is bestowed by the gratuitous gifts of God.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f9e1d8e3fb" data-kw="">
<blockquote><p>First, he asserts, that the salvation of the Ephesians was entirely the work, the gracious work of God. But then they had obtained this grace by faith. On one side, we must look at God; and, on the other, at man. God declares, that he owes us nothing; so that salvation is not a reward or recompense, but unmixed grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/efficient-cause.html">Efficient Cause: The Free Grace of God</a> › <a href="../topics/justification/efficient-cause/gods-free-grace.html">God’s free grace</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-is-by-grace.html">Justification is by grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“First, he asserts, that the salvation of the Ephesians was entirely the work, the gracious work of God. But then they had obtained this grace by faith. On one side, we must look at God; and, on the other, at man. God declares, that he owes us nothing; so that salvation is not a reward or recompense, but unmixed grace.”

</figure><figure class="quote" id="q-63e5ff40c5" data-kw="">
<blockquote><p>Hence we see, that the apostle leaves nothing to men in procuring salvation. In these three phrases, -- not of yourselves, -- it is the gift of God, -- not of works, -- he embraces the substance of his long argument in the Epistles to the Romans and to the Galatians, that righteousness comes to us from the mercy of God alone, -- is offered to us in Christ by the gospel, -- and is received by faith alone, without the merit of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/efficient-cause.html">Efficient Cause: The Free Grace of God</a> › <a href="../topics/justification/efficient-cause/gods-free-grace.html">God’s free grace</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-is-by-grace.html">Justification is by grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hence we see, that the apostle leaves nothing to men in procuring salvation. In these three phrases, -- not of yourselves, -- it is the gift of God, -- not of works, -- he embraces the substance of his long argument in the Epistles to the Romans and to the Galatians, that righteousness comes to us from the mercy of God alone, -- is offered to us in Christ by the gospel, -- and is received by faith alone, without the merit of works.”

</figure><figure class="quote" id="q-86e2524294" data-kw="">
<blockquote><p>Though we do good works, we do not found our salvation upon them; for we can do no work but what is polluted by our flesh, and also punishable; and although we could perform such works, still the remembrance of one sin is sufficient to make God reject them. Thus, then, we would always be in doubt, tossed to and fro without any certainty, and our poor consciences would be continually vexed if they relied not on the merits of the suffering and death of our Savior.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 24</span></figcaption>

</figure><figure class="quote" id="q-b8e4f9d6ce" data-kw="">
<blockquote><p>What have these most pestilential Sophists left to Christ on which to exert his virtue? They say that he merited for us the first grace, that is, the occasion of meriting, and that it is our part not to let slip the occasion thus offered. O the daring effrontery of impiety! Who would have thought that men professing the name of Christ would thus strip him of his power, and all but trample him under foot?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.6</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b472dcc2f0" data-kw="">
<blockquote><p>VIII. Though it be the surest way to peace and concord to take up with these necessary things, and we cannot approve of the narrow dividing principles of those men that will impose things unnecessary, to the excluding of the necessary, yet if our lawful rulers shall command it, or the peace of the Church through the distempers of the brethren shall require it, we shall obey, and consent in things that God has not forbidden; and if we suffer for well-doing, and for obeying God rather than men, we shall endeavor to imitate our Lord, who being reviled, reviled not again, and when he suffered, threatened not; but committed all to Him that judges righteously, 1 Pet. 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief</cite>, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Agreement of the Associated Pastors</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a03a02f258" data-kw="">
<blockquote><p>I confess their Common-Prayer is my burden, by reason of its defects and disorder, and the rudeness of the ministerial method. I stand convinced it ought to be altered; yea, abolished… yet I must confess I find in it no matter to which (on a charitable interpretation) a sober serious Christian may not say, nay, can deny his ‘Amen’. And though I distaste the ministerial method, I cannot disown in it the essential form of prayer, (viz.) A calling upon God in the Name of Christ… nor do I see on what ground I can deny, or refuse my ‘Amen’ to what is prayed for… because they are rudely and unfittingly expressed, whilst the irregularity of that common order is no bar to God’s acceptance of my more regular ‘Amen’ thereunto given.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church</cite>, … in a Letter, written July 20, 1661… (1662), p. 25 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

20given" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a63c0c2f96" data-kw="">
<blockquote><p>Q. 154. What are the outward means whereby Christ communicates to us the benefits of his mediation? A. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation.[l] [l] Matt. 28:19,20. Acts 2:42,46,47. Q. 155. How is the word made effectual to salvation? A. The Spirit of God maketh the reading, but especially the preaching of the word, an effectual means of enlightening,[m] convincing, and humbling sinners;[n] of driving them out of themselves, and drawing them unto Christ;[o] of conforming them to his image,[p] and subduing them to his will;[q] of strengthening them against temptations and corruptions;[r] of building them up in grace,[s] and establishing their hearts in holiness and comfort through faith unto salvation.[t] [m] Neh. 8:8. Acts 26:18. Ps. 19:8. [n] 1 Cor. 14:24,25. 2 Chron. 34:18,19,26-28. [o] Acts 2:37,41. Acts 8:27-39. [p] 2 Cor. 3:18. [q] 2 Cor. 10:4-6. Rom. 6:17. [r] Matt. 4:4,7,10. Eph. 6:16,17. Ps. 19:11. 1 Cor. 10:11. [s] Acts 20:32. 2 Tim. 3:15-17. [t] Rom. 16:25. 1 Thess. 3:2,10,11,13. Rom. 15:4. Rom. 10:13-17. Rom. 1:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

<blockquote><p>There was a certain man in Caesarea called Cornelius… A devout man, and one that feared God with all his house, which gave much alms to the people, and prayed to God alway… And he said unto him, ‘Thy prayers and thine alms are come up for a memorial before God… And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped him. But Peter took him up, saying, ‘Stand up; I myself also am a man.’… ‘…Now therefore are we all here present before God, to hear all things that are commanded thee of God.’ Then Peter opened his mouth, and said, ‘Of a truth I perceive that God is no respecter of persons: But in every nation he that feareth Him, and worketh righteousness, is accepted with Him….’ While Peter yet spake these words, the Holy Ghost fell on all them which heard the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts 10:1-4 25-26, 33-35, 44</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-8d86a60b7d" data-kw="">
<blockquote><p>We protest and promise with our hearts, under the same oath, hand-writ and pains, that we shall defend his person and authority, with our goods, bodies and lives, in the defense of Christ his Evangel, liberties of our country, ministration of justice, and punishment of iniquity, against all enemies within this realm or without, as we desire our god to be a strongand merciful defender to us in the day of our death, and coming of our Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, of the Church of Scotland, contra the Seceders’ Covenant, &amp; that as a Term of Communion, 1744</span></figcaption>

</figure><figure class="quote" id="q-7cf0da91e1" data-kw="">
<blockquote><p>The Scripture gives us no precedent for testifying against a Church, whose received and enacted standards as to doctrine and discipline are pure, by separating from it, and setting up another Church within its bosom and in opposition to it: Nor were these the footsteps of the flock in other Churches, or in our own, until these last and perilous days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-8ce7ded970" data-kw="">
<blockquote><p>The committee of the Assembly of Westminster, in their Reply to the Independents, said, If the Church impose anything that is sinful, we must forbear to comply, yet without separation, as was the practice of the puritans in the late times. As to the charge of schism, they admit that difference in judgment, in some particular points, is not schism; nor does an inconformity to some things enjoined deserve that name. But our [Independent] Brethren desire further to set up separate communions, which is a manifest rupture of our societies into others; and is therefore a schism in the Body. This is a setting up altar against altar, allowing our churches, as Independents do, to be true churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

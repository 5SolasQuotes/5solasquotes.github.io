<blockquote><p>…but by the grace of God sin is remitted to him who would seriously grieve that he is subject to such [sinful] thoughts. For by grace it happens that sin is not imputed, and gradually also infirmity is healed, although not instantly…</p></blockquote>

<blockquote><p>1. Because in a question of law all ignorance is moral and culpably evil to any who undertakes actions upon conscience of obedience to others; for to all within the visible Church the Word of God is exactly perfect for faith and manners, and everyone is obliged to know all conclusions of law that are determinable by God’s Word.

2. Every one in his actions is to do out of a plerophory, and a full persuasion, of heart, that what he does pleases God, Rom. 14:14, ‘I know and am persuaded by the Lord Jesus that nothing is unclean of itself.’

3. We are to do nothing but what is lawful and what in our consciences we are persuaded is lawful, and are to know what is sin and what is no sin… because every one is obliged to know morally what concerns his conscience, that he be not guilty before God…</p></blockquote>

</figure><figure class="quote" id="q-a89034af7e" data-kw="">
<blockquote><p>it’s a sin in an Indian prince, and he sins against his magistratical office in that he punishes not an Indian false-teacher who teacheth against the Law of nature [which is universally known], because an Indian should not worship the Devil; but the Indian ruler invincibly ignorant of the Gospel sins not against his office as a magistrate because he punishes not a Gospel-heretic, for he is not obliged to every magistratical act as a magistrate, not to those of which he is invincibly and faultlessly ignorant, as an Indian husband and master invincibly ignorant of the Gospel sins not against the duty of a husband and head of a family, though he teach not wife, children and servants, the principles of the Gospel, which a Christian husband and head of a family is obliged to do, not as a husband and head of a family simply, but as such a husband and head as hears the Gospel, and so either hears and knows, or may hear these Gospel principles if he were not thereof ignorant through his own sinful neglect.</p></blockquote>

</figure><figure class="quote" id="q-7cacec2ae2" data-kw="">
<blockquote><p>Despite that we must we differ with some biased interpretations of this work, it is a unique and greatly erudite work that offers a great quantity of Augustinian sources and exhaustive analysis from the Latin. This work will lead the Reformed Christian to question why it has been taken for granted that Augustine upholds the distinction between mortal and venial sin in the Romanist way. It will also lead to a reflection upon the few secondary sources, Romanist, Lutheran and Reformed, that present an exhaustive study of their distinction and terminology. In fact, perhaps this work from year 1952 is the only one that exhaustively face the topic in Augustine. At the beginning of this work, the methodology with which the author approaches this academic study is presented and an introductory treatment of the predecessors of the pre-Augustinian distinction is made, where they consider themselves fathers, like Saint Cyprian of Carthage. Then, although the author recognizes that Augustine did not use the term peccatum mortale, he addresses the question of deadly sins as mortal sin and speaks of the examples in his works, their nature and consequence. Then he talks about the inevitability of sin and the weakness of human nature. And finally, he talks about the examples, nature and consequences of daily sins in Augustine. The author mentions it as venial sin, but recognizes that venialia was used in an ordinary way by Augustine to refer to both mortifying and daily sins. It is interesting that throughout the book it is extremely noticeable the difference of emphasis and attitude of Saint Augustine with the points of view of medieval theologians, of the counter-reform and current ones on this distinction, especially when speaking of venial sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eugene-francis-durkin.html">Eugene Francis Durkin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Theological Distinction of Sins</cite>, (St. Mary of the Lake Seminary, 1952) 161 pp. This work is not easy to find. | A review by Andrés E. Garcia G. of AugustinismoProtestante.com</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

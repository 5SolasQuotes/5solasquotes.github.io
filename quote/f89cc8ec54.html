</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e6ca3df15" data-kw="">
<blockquote><p>From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Infants are members of the Church of Christ; and, therefore, to be baptized.’</cite>, pp. 303-304 in The Doctrine of the Two Sacraments in Works, vol. 2 ed. Quick (Philadelphia, 1874)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.”

</figure><figure class="quote" id="q-5fe0fc1c30" data-kw="">
<blockquote><p>As for infants, their case is of a peculiar consideration, God by his Spirit supplying what is wanting [lacking] through the imbecility of their age; and hence the Spirit working semen fidei [a seed of faith], and apprehending them, though they cannot apprehend Christ; I question not their union to Christ, and the imputation of his righteousnesse to their justification; but we speak now de adultis [of adults], that none that are of years sufficient are justified without actual faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-warren.html">Thomas Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unbelievers No Subjects of Justification</cite>, … (London: Browne, 1654), p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>3. …But must we separate from all sinners? or from all that sin in their entrance into the ministry? And why not as well from all other sins of equal greatness? Do you warn all others not to hear yourself? Or do you yet take yourself to be no sinner? or no great sinner? What if the presbyterians think the Independents’ way of entrance to be undue? And the Independents think so of the presbyterians? And both of the Anabaptists [baptists]? and the Anabaptists of them both, etc. Must they all therefore warn all men not to hear each other? Mr. [Philip] Nye [an Independent] thought not so, when he wrote for such hearing public ministers. Is it fit for the author [Edward Bagshaw] of two books of calumnies and bold untruths, besides false doctrines and other crimes, to say ‘Their sin is great, etc. and therefore we both forbear ourselves and warn all others not to hear them?’ 4. Most that I speak of did enter into the ministry in the presbyterian or Independent way heretofore, and do but continue on the terms which I dissent from as well as you. How then can you say they unduly enter into the ministry? 5… 4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London, 1671), sect. 41, pp. 102-3</span></figcaption>

<blockquote><p>The analogy which I understand is to hold between the Jewish and Christian Church is this: As profane persons were forbidden to enter into the Temple because of the sacramental and typical holiness thereof (for the Temple was a type of Christ), so profane persons are now much more to be kept back from the sacrament of the Lord’s Supper, which has more of sacramental signification, mystery and holiness in it than the temple of Jerusalem had, and whereby more ample evangelical promises are set forth and sealed unto us. And as profane persons might of old come into the court of the gentiles, and there hear the Word preached in Solomon’s porch (where both Christ and his apostles did preach, Jn. 10:23; Acts 3:11; 5:12, which porch was in the utmost court, that is, the court of the gentiles: of which elsewhere out of Josephus), but might not come into the court of Israel, nor have communion in the sacrifices: so profane, obstinate sinners are to be excluded for their impiety from the Church-communion of saints, though they may hear the Word, as heathens also may do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, bk. 1 ToC of Aaron’s Rod Blossoming, or the Divine Ordinance of Church Government Vindicated… (Edinburgh: Ogle, Oliver &amp; Boyd, 1844), | 9. Whether in the Jewish Church there was any suspension or exclusion of profane, scandalous, notorious sinners, from partaking in the public ordinances with the rest of the children of Israel in the temple 41, pp. 46-47</span></figcaption>

<blockquote><p>Because bishop and presbyter are everywhere in Scripture taken for one and the same (so that the difference is only in the name, not in the thing—bishop, with regard to his office and function; presbyter, with regard to his age and dignity), the same characters and the same functions are ascribed to both.</p></blockquote>

</figure><figure class="quote" id="q-d9cdcfb5f4" data-kw="">
<blockquote><p>Thirdly, the Scripture intimates this difference between ministry and magistracy, that the work of the ministry and the administrations thereof are performed in the name of Jesus Christ, as Mediator and King of the Church: the work of the magistracy not so… Now let our opposites show (if they can) where they find in Scripture that the Christian magistrate is to rule in the name of Christ, to judge in the name of Christ, to make laws in the name of Christ, to make war or peace in the name of Christ, to punish evil-doers with the temporal sword in the name of Christ. Of the ministry I did show that in the name of the Lord Jesus Christ we do assemble ourselves together, Mt. 18:20, in his name do we preach, Lk. 24:47; Acts 4:17-18; 5:28,44; 9:27, in his name do we baptize, Acts 2:38, 8:16; 19:5, in his name do we excommunicate, 1 Cor. 5:5… … A minister of Christ does both preach and baptize in the name of Christ, as Mediator, that is, vice Christi [in the place of Christ], in Christ’s stead, and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our comission to preach and baptize… So that to preach and baptize epi to onomati Iesou Christou (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38) comprehends a formal commission, power and auhority, given and derived from Christ. … The ministers of Christ do act in the name of Christ, that is, in the name, authority, room and place of Christ: We are ambassadors for Christ, and we preach in Christ’s stead, 2 Cor. 5:20. This… makes good my argument. Why did he [Mr. Hussey, an Erastian] not show us the like concerning magistracy? I suppose he would, if he could…</p></blockquote>

— George Gillespie, Aaron’s Rod Blossoming (1646), bk. 2, ch. 7, pp. 109-112">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+the+Scripture+intimates+this+difference+between+ministry+and+magistracy%2C+that+the+work+of+the+ministry+and+the+administrations+thereof+are+performed+in+the+name+of+Jesus+Christ%2C+as+Mediator+and+King+of+the+Church%3A+the+work+of+the+magistracy+not+so%E2%80%A6+Now+let+our+opposites+show+%28if+they+can%29+where+they+find+in+Scripture+that+the+Christian+magistrate+is+to+rule+in+the+name+of+Christ%2C+to+judge+in+the+name+of+Christ%2C+to+make+laws+in+the+name+of+Christ%2C+to+make+war+or+peace+in+the+name+of+Christ%2C+to+punish+evil-doers+with+the+temporal+sword+in+the+name+of+Christ.+Of+the+ministry+I+did+show+that+in+the+name+of+the+Lord+Jesus+Christ+we+do+assemble+ourselves+together%2C+Mt.+18%3A20%2C+in+his+name+do+we+preach%2C+Lk.+24%3A47%3B+Acts+4%3A17-18%3B+5%3A28%2C44%3B+9%3A27%2C+in+his+name+do+we+baptize%2C+Acts+2%3A38%2C+8%3A16%3B+19%3A5%2C+in+his+name+do+we+excommunicate%2C+1+Cor.+5%3A5%E2%80%A6+%E2%80%A6+A+minister+of+Christ+does+both+preach+and+baptize+in+the+name+of+Christ%2C+as+Mediator%2C+that+is%2C+vice+Christi+%5Bin+the+place+of+Christ%5D%2C+in+Christ%E2%80%99s+stead%2C+and+having+authority+for+that+effect+from+Christ%2C+as+Mediator%3B+for+Christ%2C+as+Mediator%2C+gave+us+our+comission+to+preach+and+baptize%E2%80%A6+So+that+to+preach+and+baptize+epi+to+onomati+Iesou+Christou+%28which+we+find+both+of+preaching%2C+Lk.+24%3A47%2C+and+of+baptizing%2C+Acts+2%3A38%29+comprehends+a+formal+commission%2C+power+and+auhority%2C+given+and+derived+from+Christ.+%E2%80%A6+The+ministers+of+Christ+do+act+in+the+name+of+Christ%2C+that+is%2C+in+the+name%2C+authority%2C+room+and+place+of+Christ%3A+We+are+ambassadors+for+Christ%2C+and+we+preach+in+Christ%E2%80%99s+stead%2C+2+Cor.+5%3A20.+This%E2%80%A6+makes+good+my+argument.+Why+did+he+%5BMr.+Hussey%2C+an+Erastian%5D+not+show+us+the+like+concerning+magistracy%

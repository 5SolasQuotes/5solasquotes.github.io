<blockquote><p>1. that the claim and title that a people has to Christ is not the ground why the keys are given to that people, as to the original subject, because they may have the Word, sacraments and keys a long time, and yet want [lack] faith in Christ, and so all title and claim to Christ: All which time they have the keys, discipline, and sacraments; and I believe their acts of discipline, censures, and sacraments are valid, therefore the Church redeemed and builded on the rock Christ, is not the kindly subject of the keys. 2. The keys are given to professors clothed with a ministerial calling, whether they be believers or unbelievers, howbeit God gives them for the salvation and edification of believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, p. 73</span></figcaption>

<blockquote><p>3. …But must we separate from all sinners? or from all that sin in their entrance into the ministry? And why not as well from all other sins of equal greatness? Do you warn all others not to hear yourself? Or do you yet take yourself to be no sinner? or no great sinner? What if the presbyterians think the Independents’ way of entrance to be undue? And the Independents think so of the presbyterians? And both of the Anabaptists [baptists]? and the Anabaptists of them both, etc. Must they all therefore warn all men not to hear each other? Mr. [Philip] Nye [an Independent] thought not so, when he wrote for such hearing public ministers. Is it fit for the author [Edward Bagshaw] of two books of calumnies and bold untruths, besides false doctrines and other crimes, to say ‘Their sin is great, etc. and therefore we both forbear ourselves and warn all others not to hear them?’ 4. Most that I speak of did enter into the ministry in the presbyterian or Independent way heretofore, and do but continue on the terms which I dissent from as well as you. How then can you say they unduly enter into the ministry? 5… 4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London, 1671), sect. 41, pp. 102-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-17d7cab950" data-kw="">
<blockquote><p>Our English [partially conforming] authors below will make the case for, under necessity, material cooperation with bishops, taking the oath of canonical obedience and yielding to civil patrons in the presentation of ministers to congregations (or patronage). Note that conferring with a bishop and getting the consent and recognition of a civil officer to one’s ministry¹ are not inherently sinful actions. To give further perspective to this, and what is to come, it will be proven in the next section that Church government (albeit of divine law) is not moral law, but is secondary. ¹ Note that having the recognition and approval of the civil government, though it ought to be secondary and consequential rather than primary and immediate, is involved in the Biblical doctrine of circa sacra and of itself is a good thing. On the proper order see Fentiman, Circa Sacra, pp. 49–51. [The book written by Scottish indulged ministers, associated with John] Bairdie poses the question: “Whether it be altogether heterogeneous and incompetent, as well as it may be inconvenient, for the ruler to make civil laws and constitutions about the circumstances, order, and exercise of matters of religion, without the previous cognizance and pre-determination of the Church thereupon, and that even in the most broken and ruined state of the Church when there is no governing-Church existent that can be owned.” Balm from Gilead, pp. 76–77. The answer, at least in the abstract, must be that such an exercise of civil power, however inconvenient and defective in some cases, is not always incompetent and invalid in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 106</span></figcaption>

</figure><figure class="quote" id="q-b0fa663103" data-kw="">
<blockquote><p>All the power to be owned in bishops, is derived to them from the King; and, in those things wherein the King has power in church matters, in those things we may obey the bishops, as his delegates and substitutes… the law calls the King patron-general of England. His appointing me to preach [in the second indulgence], supposes I must have hearers, and those, of necessity, out of some parish or other. What we do is to serve the present necessity, and not of choice.</p></blockquote>

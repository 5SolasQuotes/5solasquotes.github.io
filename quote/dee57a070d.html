<main class="wrap"><figure class="quote" id="q-dee57a070d" data-kw="">
<blockquote><p>Some [attributes] are said absolutely concerning God, as all the preceding attributes. Others relatively, which relation is two-fold: either with respect to the persons among themselves, as the Father, the Son, and the Holy Spirit, or with respect of the creatures to God, as Creator, Savior, Lord, King, etc. Here it is asked, whether all these things were in God from eternity past. Response: All those things that are attributed to God absolutely are eternal, even those that are spoken relative to the very persons, as shall be proven afterwards against the heretics – Arians, Samosatensians, etc. The difficulty, therefore, remains only in those which are spoken concerning God with respect to the creatures, concerning which we respond, if we consider the foundation of the relation, such as the power to create, to conserve, to reign, etc, this also is eternal, because it is referred to the absolute: but if we consider the formal relation, that is added in time: for God was not an actual creator until he had created things. Objection: But then it is stated that something was added to God; and therefore, some change was also done in Him. Response: That relation, with respect to God, is not real; but it is only so with respect to the creature. For to the creature, something real is added, and not to God; but only some notional concept. Augustine compares it to a coin: when it becomes a pledge, nothing is really added to the coin; but to the man who accepts it, something is really added. Thomas compares it to a column, which is to my right: when I turn to that side, still nothing is really added to the column; but only to the man, who turns himself toward it in this or that way, does any change take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Johannes Hornbeek, Institutes</cite>, 3.9 trans. Charles Johnson</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-baff700da8" data-kw="">
<blockquote><p>Now, since power is proper to God in relation to His effects, and since power, as was said, has the character of a principle, and since principle expresses relationship to that which proceeds from it, it is evident that something can be said of God relatively, with regard to His effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contra Gentiles</cite>, Bk. 2, On Creation | 11. ‘That Something is Said of God in Relation to Creatures’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-973f800a2f" data-kw="">
<blockquote><p>The will of God is also to be viewed in the light of the various ‘affections’ attributed to God. these ‘affections’ are, in man, termed emotions or passions and are associated with human weakness and mutability. In relation to God, however, the ‘affections’: ‘do not designate any passions or emotions, nor are to be understood as diverse divine wills, for this would imply mutation in God, but as acts of the same will, indicating its different relations.’ (Pictet, Theol. chr. I.vii.1) Of course, the immutability of God, like his being unmoved, describes a God who is also actus purus [pure act]: thus neither concept indicates a divine immobility or quiescence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (Baker, 2003), vol. 3, pt. 2, ch. 5.4, D. The ad intra Distinctions, p. 454</span></figcaption>

</figure><figure class="quote" id="q-b7df78fc1c" data-kw="">
<blockquote><p>Helm (1990) urged the coining of an entirely new term, ‘theomotions’, to express divine affect in contradistinction to human varieties [Helm, ‘The Impossibility of Divine Passibility’ in ed. N.M. de S. Cameron, The Power &amp; Weakness of God (Edinburgh: Rutherford House, 1990), pp. 119-140]. And Scrutton (2005) suggested that differentiating ‘passions’ from ‘affections’, a la Augustine and Aquinas, would move the conversation forward.</p></blockquote>

<blockquote><p>[4] Having proved that these relations have no real existence in God, and yet are predicated of Him, it follows that they are attributed to Him solely in accordance with our manner of understanding, from the fact that other things are referred to Him. For in understanding one thing to be referred to another, our intellect simultaneously grasps the relation of the latter to it, although sometimes that thing is not really related. [5] And so it is evident, also, that such relations are not said of God in the same way as other things predicated of Him. For all other things, such as wisdom and will, express His essence; the aforesaid relations by no means do so really, but only as regards our way of understanding. Nevertheless, our understanding is not fallacious. For, from the very fact that our intellect understands that the relations of the divine effects are terminated in God Himself, it predicates certain things of Him relatively; so also do we understand and express the knowable relatively, from the fact that knowledge is referred to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contra Gentiles</cite>, Bk. 2, On Creation | 13-14. ‘How the aforesaid relations are predicated of God’</span></figcaption>

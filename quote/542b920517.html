<main class="wrap"><figure class="quote" id="q-542b920517" data-kw="bosom of Abraham immediate heaven">
<blockquote><p>The ancients immediately after death were received into the bosom of Abraham, as appears from the example of Lazarus (Lk. 16:22, 23). Therefore they were also received into heavenly joy. For “the bosom of Abraham” can be referred to no other thing than to eternal life. Nothing is more natural than that Lazarus was to Abraham what John was to the Lord in the heavenly feast; especially since Christ says, “Many shall come from the east and the west, and shall sit down with Abraham, and Isaac, and Jacob, in the kingdom of heaven” (Mt. 8:11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.11.5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b5846db12" data-kw="">
<blockquote><p>We prove the vanity of this fiction in this way. First, because scripture teaches that the faithful (for whom they want Purgatory to be constructed) pass from here through death into eternal life. John 5:24 — &quot;Whoever hears my word and believes him who sent me has eternal life and will not come under judgment but has passed from death to life.&quot; Therefore they do not come into the judgment of Purgatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis on Purgatory</cite>, p. 1</span></figcaption>

<blockquote><p>The foundation of the popish purgatory (namely, that the guilt being abolished, some penal satisfaction is to be undergone) was never received by the learned teachers of the church for at least 1,100 years after Christ.</p></blockquote>

</figure><figure class="quote" id="q-5089754c45" data-kw="">
<blockquote><p>We deny that such a Purgatory exists or truly exists with this argument: That neither wholly nor in part does Scripture teach it, but rather openly rejects and condemns it: Scripture denies its truth or existence itself. Pontifical Purgatory is neither wholly nor in part taught by Scripture, but rather openly rejects and condemns it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-alting.html">Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Purgatory</cite>, p. 2, Theses VIII–IX</span></figcaption>

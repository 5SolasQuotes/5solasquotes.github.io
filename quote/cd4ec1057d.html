<main class="wrap"><figure class="quote" id="q-cd4ec1057d" data-kw="">
<blockquote><p>But now the nature of Gospel-righteousness is not to put us upon anything that is impossible for us to do, but only to believe and confess, v. 9. Don’t entertain such vile thoughts, as if God required anything of you in order to your Justification, that you could not perform, though never so desirous to do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clark.html">Samuel Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on the New Testament</cite>, On Rom., 10:6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>…the similarities and differences between the conclusions reached by Scotus and Aquinas. Though Scotus became the standard reference point for discussions of intuitive versus abstractive cognition, this does not mean his account of the beatific vision fundamentally differed from Thomas’s regarding the vision of the divine essence. Both affirmed that the intelligible species could not be creaturely or a created similitude to see the divine essence, both affirmed the necessity of the supernatural agent to elevate the created intellect, and both affirmed a sense in which the beatific vision is ‘natural’ in the creature. They disagreed on how to define such a natural desire (with Aquinas claiming it is elicited and Scotus it is innate), the status of obediential potency (Aquinas distinguishing it from natural potency and Scotus conflating the two), the necessity of the light of glory, and whether what is natural should be measured merely by passive potencies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-seals.html">Zachary Seals</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beatific Vision</cite>, vol. 82, no. 1 (April 2023), pp. 3-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“…the similarities and differences between the conclusions reached by Scotus and Aquinas. Though Scotus became the standard reference point for discussions of intuitive versus abstractive cognition, this does not mean his account of the beatific vision fundamentally differed from Thomas’s regarding the vision of the divine essence. Both affirmed that the intelligible species could not be creaturely or a created similitude to see the divine essence, both affirmed the necessity of the supernatural agent to elevate the created intellect, and both affirmed a sense in which the beatific vision is ‘natural’ in the creature. They disagreed on how to define such a natural desire (with Aquinas claiming it is elicited and Scotus it is innate), the status of obediential potency (Aquinas distinguishing it from natural potency and Scotus conflating the two), the necessity of the light of glory, and whether what is natural should be measured merely by passive potencies.”

ncies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7e9ce0bb64" data-kw="">
<blockquote><p>The language of synchronic contingency [something can be contingent in different ways at the same time, and that alternatives can be contingent possibilities at the same time]… What makes the language interesting is its application to the particular case of the concurrent willing of two rational beings [God and a human person] involved in the actualization of one effect–a case in which both of the beings could will otherwise, but given that both wills taken together are the necessary and sufficient conditions for the actualization of the effect, both must be understood as freely concurrring to a single effect. That is interesting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Will &amp; Human Choice</cite>, pp. 314-315</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-0e41903d87" data-kw="">
<blockquote><p>The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination</cite>, The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination, wherein the Nature of Divine Predetermination is fully explicated &amp; demonstrated, both in the general, as also more particularly, as to the substrate mater or entitative act of sin (1678) 217 pp., pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.”

y/#:~:text=The%20sum%20of%20all%20is%20this,the%20radical%20power%20to%20that%20act&amp;text=The%20sum%20of%20all%20is%20this%2C%20that%20the&amp;text=act%2C%20not%20the%20radical%20power%20to%20that%20act" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a9b5a185f1" data-kw="">
<blockquote><p>I willingly grant that the determination of the end does necessarily involve the means, that not only precede but procure the end. But I will utterly deny that sin is the means of damnation; we say rather that permission of sin is the means, whence notwithstanding it follows not that sin shall come to pass unavoidably, but rather avoidably, whether we consider the free will of man or the decree of God; for every particular sinful act is a natural thing, and undoubtedly man has free will as to do, so to abstain from doing, any particular act. And albeit God has determined that these particular sinful acts (instance the particular outrages committed against the holy Son of God by Herod, Pontius Pilate, together with the Gentiles and people of Israel) shall come to pass by his permission; yet seeing withal He has ordained them to come to pass contingently, that follows that they shall come to pass in such a manner as joined with a possibility of not coming to pass; otherwise they should come to pass not contingently but necessarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, (Oxford, 1653), bk. 1, p. 69</span></figcaption>

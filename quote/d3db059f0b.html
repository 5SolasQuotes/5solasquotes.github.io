<blockquote><p>The motive (so to speak) of God in sending his Son is not, as this theory assumes, general benevolence or that love of which all men are equally the objects, but that peculiar, mysterious, infinite love in which God, in giving his Son, gives Himself and all conceivable and possible good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, pt. 3, ch. 1, “The Plan of Salvation,” § 4, “Hypothetical Redemption”</span></figcaption>

</figure><figure class="quote" id="q-347ef5d07d" data-kw="">
<blockquote><p>Love of necessity involves feeling, and if there be no feeling in God, there can be no love. That He produces happiness is no proof of love. The earth does that unconsciously and without design. … He may be cold, insensible, indifferent, or even unconscious; He ceases to be God in the sense of the Bible, and in the sense in which we need a God, unless He can love as well as know and act. … We must adhere to the truth in its Scriptural form, or we lose it altogether. We must believe that God is love in the sense in which that word comes home to every human heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 5, § 13, “The Goodness of God” (“Love”)</span></figcaption>

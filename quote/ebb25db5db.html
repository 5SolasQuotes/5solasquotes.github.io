<blockquote><p>Fifthly, they tempt God, that refuse or neglect the ordinary and necessary means of their preservation, either for body or soul: as he that being to go over a water, will leave the bridge which is the ordinary way, and adventure dangerously through the water: for herein he seeks a needless experience of God’s power: so do they also that neglect or contemn God’s holy ordinance for the saving of men’s souls in the ministry of the word.

Now to this kind of tempting God doth Christ apply this commandment in this place; as if he should say, when God hath afforded unto men an ordinary means for their help and safety, they are not to refuse the same, and seek for safety from God extraordinarily. I am now in a dangerous place I confess, upon this pinnacle, yet there is some ordinary way to get down as stairs or ladder; and therefore unless I would tempt the Lord my God, I may not cast my self down and thereby seek for extraordinary preservation, as thou persuadest me. Thus also they sin that go into places of great danger without a calling: so Peter sinned in thrusting himself into Caiaphas’ hall, a place of temptation, as by lamentable experience he found too true.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f557d905bd" data-kw="">
<blockquote><p>These prophets [in 1 Cor. 14] were prophets by office, and so beside that they were gifted, they were sent with official authority to preach:

1. They are such as Paul speaks of, 1 Cor. 12:28, ‘God hath set some in the Church, first apostles, secondarily prophets,’ therefore, they were officers set in the body, as apostles were at that time, Eph. 4:11.

2. They are called prophets, 1 Cor. 14:29, 32. But in all the Old or New Testament, prophets signify over these that are in office, as the places in the margin clear, and a place cannot be brought where the word prophet signifies a man who publicly preaches, and yet is no prophet by office, but possibly a fashioner, a ploughman, a shoemaker.

3. The formal effects of public edifying, comforting, convincing, converting souls are ascribed to these prophets, vv. 1, 3-5, 12, 24-25, 31, which are ascribed to preaching pastors, Rom 10:14-15; 1 Cor. 14:1-3.

4. In this chapter, and in ch. 13, Paul does set down canons anent the right use of the offices that he spake of, 1 Cor. 12:28-29.

5. Paul must think them prophets by office, while as he compares himself who was an apostle and prophet with these prophets, v. 37, ‘If any man think himself to be a prophet, or spiritual, let him acknowledge that the things that I write to you are the commandments of the Lord.’ Also these prophets were extraordinary and temporary, as were the gifts of tongues and miracles; and therefore none out of office now are to prophesy publicly. Mr. Robinson says, they cannot be extraordinary, because extraordinary prophets are infallible, and cannot err, else the Scriptures should have been written by prophets who could err; but these prophets, 1 Cor. 14, could err and were not infallible because their doctrine was to be judged, v. 29. Answer: This is a silly reason, Pareus, Bulling, Calvin, Beza say all spirits are to be tried by the Word, and all prophets, even Samuel and Nathan may err, and look beside the book, and may speak of their own spirit. How then were the penmen of Scripture infallible, says Robinson? I answer, there are none simply infallible but God; every man is a liar: The penmen of the Scripture were infallible, because when they were actually inspired by the Holy-Ghost, they could not err: and the spirits of all prophets are to be tried by the Word, even of Paul preaching at Berea: But it follows not that Paul then could err. To this they answer that false prophets, as Balaam, could not err when they were actually inspired, no more than canonic writers. Answer: In the case of infallibility all are alike, none are infallible by any infused habit of a prophetical spirit; but false prophets were inspired with an habitual spirit of lying, which spirit is not in canonic writers. Robinson and others of his side think them not extraordinarily inspired:

1. Because these prophets might have been interrupted and put to silence, that another to whom choicer things were revealed, might prophesy, v. 3.

2. Because Paul exhorts to pray for the gift of interpretation, and to covet (say others) to prophesy. Now we cannot seek in faith from God an extraordinary and miraculous gift.

3. Others add, this prophesying was subject to the free-will of the prophets, for they might prophesy, or keep silence, as they pleased; but the acts of extraordinary prophesying are not subjected to the free-will of the prophets; therefore this was but ordinary prophesying, to the which all gifted professors even out of office are obliged for the edifying of the Church of Christ to the world’s end. Answer: All these three come to one, to wit, acts of extraordinary prophesying are under the determination of free-will. A little of this. 1st Conclusion: Pareus observes well that there be two kinds of prophets.

1. Some who foretold things to come, of these the text in hand speaks not.

2. Some extraordinarily inspired with an extraordinary grace of interpreting Scripture: The former were prophets in the Old Testament, the latter especially prophets of the New Testament; knowledge of both were given without study or pains. So there was a prophetical spirit in Paul, Gal. 1:12, ‘I received it not of man, neither was I taught it, but by the revelation of Jesus Christ.’ 2nd Conclusion: The act of foretelling things to come, especially things merely contingent, which are determined only in the free decree of God, is not so under our free-will, as the acts of preaching and interpreting Scripture out of a prophetical infused habit: For prophesying things to come seemed to have come on the prophets of old, as a fire-flash appears to a man’s eye in the dark air, he cannot choose but see it, Eze. 2:14, ‘So the spirit lifted me up, and took me away, and I went in bitterness, in the heat of my spirit, but the hand of the Lord was strong upon me,’ Jer. 20:9, ‘And I said, I will not make mention of him, nor speak any more in his name, but his word was in my heart, as a burning fire shut up in my bones, and I was weary with forbearing, and I could not stay,’ 2 Kings 3:15, ‘The hand of the Lord came upon Elisha, and he prophesied.’ See Jerome, Oecumenius, Gregory and Thomas. The prophetical spirit in the New Testament seems to be more swayed with free-will, and moral threatnings, 1 Cor. 9:16, ‘Woe unto me if I preach not the Gospel; yet the habit from whence he preached was a prophetical principle, Gal. 1:12; 1 Cor. 14:32. 3rd Conclusion: Hence prophesying is not a habit and it is a habit. It is not a habit:

1. Because no prophet can simply prophecy when he will, except the man Christ, especially of things to come by contingent causes (the presence of which things (says Suarez) is only connatural to God, and to no moral man) coming on men by a transient irradiation, while as the candle of God’s prophetical light glances upon the fancy, and from thence to the mind, that the man may see and read the species and images, and when this light shines not Nathan and Samuel read beside the Bible and are widely out. Prophecy also is a habit for: 1. something remains in Isaiah and Jeremiah while they sleep and prophesy not, from whence they are named prophets and really are prophets; for when God has once revealed himself to one as to his own prophet, even from by-past revelation:

1. There remains a disposition to prophecy, 1 Sam. 3:20, All Israel knew, even from Dan to Beersheba, that Samuel was established to be a prophet of the Lord.

2. Because there remains a prophetical light, whereby the man gave assent to the last prophetical revelation, and so the species and prophetical images must remain in the fantasy, and with these a prophetical memory of by past predictions, and so some experimental certainty, that what he foretells shall come to pass: See Thomas and Cajetan. …

4. Conclusion: Hence Separatists may see that extraordinary acts of prophecy may well be subjected to the determination of the Church, and yet be extraordinary inspirations, and that diverse ways:

1. Because they were prophets of the New Testament, and so grace being more abundant now nor under the Old Testament, it can bow and facilitate free-will to acts of prophesying, and Paul from more grace labored more abundantly than they all.

2. Prophesying at that time in Corinth might well be obtained by prayer upon the extraordinary impulsion of the spirit, as Daniel obtained by prayer the interpretation of a dream; neither can it be proved from 1 Cor. 14 that Paul wills them all without exception to covet to speak with tongues and to prophesy, but only these that were extraordinarily moved to pray, except these [words] (v. 31, ‘ye may all prophecy’) be contrary to these words (1 Cor. 12:29, ‘are all prophets?’) which we cannot say.

3. Because it was of old in the power of prophets to use some means to dispose themselves to prophecy, for when the passion of anger overclouded the fancy and the species therein, then Elisha calls for a minstrel to play, and dispose the mind better, as Cajetan says: Howbeit for all that the text says the hand of the Lord only actuated these species and caused him to prophesy.</p></blockquote>

end.+Answer%3A+All+these+three+come+to+one%2C+to+wit%2C+acts+of+extraordinary+prophesying+are+under+the+determination+of+free-will.+A+little+of+this.+1st+Conclusion%3A+Pareus+observes+well+that+there+be+two+kinds+of+prophets.+1.+Some+who+foretold+things+to+come%2C+of+these+the+text+in+hand+speaks+not.+2.+Some+extraordinarily+inspired+with+an+extraordinary+grace+of+interpreting+Scripture%3A+The+former+were+prophets+in+the+Old+Testament%2C+the+latter+especially+prophets+of+the+New+Testament%3B+knowledge+of+both+were+given+without+study+or+pains.+So+there+was+a+prophetical+spirit+in+Paul%2C+Gal.+1%3A12%2C+%E2%80%98I+received+it+not+of+man%2C+neither+was+I+taught+it%2C+but+by+the+revelation+of+Jesus+Christ.%E2%80%99+2nd+Conclusion%3A+The+act+of+foretelling+things+to+come%2C+especially+things+merely+contingent%2C+which+are+determined+only+in+the+free+decree+of+God%2C+is+not+so+under+our+free-will%2C+as+the+acts+of+preaching+and+interpreting+Scripture+out+of+a+prophetical+infused+habit%3A+For+prophesying+things+to+come+seemed+to+have+come+on+the+prophets+of+old%2C+as+a+fire-flash+appears+to+a+man%E2%80%99s+eye+in+the+dark+air%2C+he+cannot+choose+but+see+it%2C+Eze.+2%3A14%2C+%E2%80%98So+the+spirit+lifted+me+up%2C+and+took+me+away%2C+and+I+went+in+bitterness%2C+in+the+heat+of+my+spirit%2C+but+the+hand+of+the+Lord+was+strong+upon+me%2C%E2%80%99+Jer.+20%3A9%2C+%E2%80%98And+I+said%2C+I+will+not+make+mention+of+him%2C+nor+speak+any+more+in+his+name%2C+but+his+word+was+in+my+heart%2C+as+a+burning+fire+shut+up+in+my+bones%2C+and+I+was+weary+with+forbearing%2C+and+I+could+not+stay%2C%E2%80%99+2+Kings+3%3A15%2C+%E2%80%98The+hand+of+the+Lord+came+upon+Elisha%2C+and+he+prophesied.%E2%80%99+See+Jerome%2C+Oecumenius%2C+Gregory+and+Thomas.+The+prophetical+spirit+in+the+New+Testament+seems+to+be+more+swayed+with+free-will%2C+and+moral+threatnings%2C+1+Cor.+9%3A16%2C+%E2%80%98Woe+unto+me+if+I+preach+not+the+Gospel%3B+yet+the+habit+from+whence+he+preached+was+a+prophetical+principle%2C+Gal.+1%3A12%3B+1+Cor.+14%3A32.+3rd+Conclusion%3A+Hence+prophesying+is+not+a+habit+and+it+is+a+habit.+It+is+not+a+habit%3A+1.+Because+no+prophet+can+simply+prophecy+when+he+will%2C+except+the+man+Christ%2C+especially+of+things+to+come+by+contingent+causes+%28the+presence+of+which+things+%28says+Suarez%29+is+only+connatural+to+God%2C+and+to+no+moral+man%29+coming+on+men+by+a+transient+irradiation%2C+while+as+the+candle+of+God%E2%80%99s+prophetical+light+glances+upon+the+fancy%2C+and+from+thence+to+the+mind%2C+that+the+man+may+see+and+read+the+species+and+images%2C+and+when+this+light+shines+not+Nathan+and+Samuel+read+beside+the+Bible+and+are+widely+out.+Prophecy+also+is+a+habit+for%3A+1.+something+remains+in+Isaiah+and+Jeremiah+while+they+sleep+and+prophesy+not%2C+from+whence+they+are+named+prophets+and+really+are+prophets%3B+for+when+God+has+once+revealed+himself+to+one+as+to+his+own+prophet%2C+even+from+by-past+revelation%3A+1.+There+remains+a+disposition+to+prophecy%2C+1+Sam.+3%3A20%2C+All+Israel+knew%2C+even+from+Dan+to+Beersheba%2C+that+Samuel+was+established+to+be+a+prophet+of+the+Lord.+2.+Because+there+remains+a+prophetical+light%2C+whereby+the+man+gave+assent+to+the+last+prophetical+revelation%2C+and+so+the+species+and+prophetical+images+must+remain+in+the+fantasy%2C+and+with+these+a+prophetical+memory+of+by+past+predictions%2C+and+so+some+experimental+certainty%2C+that+what+he+foretells+shall+come+to+pass%3A+See+Thomas+and+Cajetan.+%E2%80%A6+4.+Conclusion%3A+Hence+Separatists+may+see+that+extraordinary+acts+of+prophecy+may+well+be+subjected+to+the+determination+of+the+Church%2C+and+yet+be+extraordinary+inspirations%2C+and+that+diverse+ways%3A+1.+Because+they+were+prophets+of+the+New+Testament%2C+and+so+grace+being+more+abundant+now+nor+under+the+Old+Testament%2C+it+can+bow+and+facilitate+free-will+to+acts+of+prophesying%2C+and+Paul+from+more+grace+labored+more+abundantly+than+they+all.+2.+Prophesying+at+that+time+in+Corinth+might+well+be+obtained+by+prayer+upon+the+extraordinary+impulsion+of+the+spirit%2C+as+Daniel+obtained+by+prayer+the+interpretation+of+a+dream%3B+neither+can+it+be+proved+from+1+Cor.+14+that+Paul+wills+them+all+without+exception+to+covet+to+speak+with+tongues+and+to+prophesy%2C+but+only+these+that+were+extraordinarily+moved+to+pray%2C+except+these+%5Bwords%5D+%28v.+31%2C+%E2%80%98ye+may+all+prophecy%E2%80%99%29+be+contrary+to+these+words+%281+Cor.+12%3A29%2C+%E2%80%98are+all+prophets%3F%E2%80%99%29+which+we+cannot+say.+3.+Because+it+was+of+old+in+the+power+of+prophets+to+use+some+means+to+dispose+themselves+to+prophecy%2C+for+when+the+passion+of+anger+overclouded+the+fancy+and+the+species+therein%2C+then+Elisha+calls+for+a+minstrel+to+play%2C+and+dispose+the+mind+better%2C+as+Cajetan+says%3A+Howbeit+for+all+that+the+text+says+the+hand+of+the+Lord+only+actuated+these+species+and+caused+him+to+prophesy.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Other+citations+%28work+not+named%29%2C+pp.+249-57+in+ch.+16+of+A+Peaceable+%26+Temperate+Plea%E2%80%A6+%28London%2C+1642%29%2C+pp.+249-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff557d905bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f557d905bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-biblical-prophecy-as-including-expositing-the-scriptures/#:~:text=These%20prophets%20%5Bin%201%20Cor.%2014,species%20and%20caused%20him%20to%20prophesy&amp;text=These%20prophets%20%5Bin%201%20Cor.%2014%5D%20were%20prophets&amp;text=actuated%20these%20species%20and%20caused%20him%20to%20prophesy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But some one will ask, How is it then, that certain excellent persons, and of position in the Church, are often permitted by God to preach novel doctrines to Catholics? A proper question, certainly, and one which ought to be very carefully and fully dealt with, but answered at the same time, not in reliance upon one’s own ability, but by the authority of the divine Law, and by appeal to the Church’s determination.

Let us listen, then, to Holy Moses, and let him teach us why learned men, and such as because of their knowledge are even called Prophets by the apostle, are sometimes permitted to put forth novel doctrines, which the Old Testament is wont, by way of allegory, to call “strange gods,” forasmuch as heretics pay the same sort of reverence to their notions that the Gentiles do to their gods.

Blessed Moses, then, writes thus in Deuteronomy: “If there arise among you a prophet or a dreamer of dreams,” that is, one holding office as a Doctor in the Church, who is believed by his disciples or auditors to teach by revelation: well,—what follows? “and giveth thee a sign or a wonder, and the sign or the wonder come to pass whereof he spake,”—he is pointing to some eminent doctor, whose learning is such that his followers believe him not only to know things human, but, moreover, to foreknow things superhuman, such as, their disciples commonly boast, were Valentinus, Donatus, Photinus, Apollinaris, and the rest of that sort!

What next? “And shall say to thee, Let us go after other gods, whom thou knowest not, and serve them.” What are those other gods but strange errors which thou knowest not, that is, new and such as were never heard of before? “And let us serve them;” that is, “Let us believe them, follow them.” What last? “Thou shalt not hearken to the words of that prophet or dreamer of dreams.” And why, I pray thee, does not God forbid to be taught what God forbids to be heard? “For the Lord, your God, trieth you, to know whether you love Him with all your heart and with all your soul.”

The reason is clearer than day why Divine Providence sometimes permits certain doctors of the Churches to preach new doctrines—“That the Lord your God may try you;” he says. And assuredly it is a great trial when one whom thou believest to be a prophet, a disciple of prophets, a doctor and defender of the truth, whom thou hast folded to thy breast with the utmost veneration and love, when such a one of a sudden secretly and furtively brings in noxious errors, which thou canst neither quickly detect, being held by the prestige of former authority, nor lightly think it right to condemn, being prevented by affection for thine old master.</p></blockquote>

<blockquote><p>Qu. What reason have we to think that the Pope about that time began to be the great Antichrist.

Ans. For answer: We are to know that there are two particular characters of the Beast, as some Divines have observed out of the text, the former the cause of the later, viz. 1. Blasphemy; for he is full of names of blasphemy, Rev. 17.3. by which understand heresy and Idolatry. 2. cruelty, for he is a scarlet-coloured beast, and makes war with the Saints, ibid. &amp; ch. 13.7. But both these flow from an higher principle, which is (as I may say) proprium quarti modi, and a more convertible character of the beast, and that is his primacy or supremacy: This supremacy hath in it two things that make it up; one is a claiming of authority over the consciences of men, and so over their faith and worship; secondly the extending of this power to all Churches in all Nations.

I will not say that these two are the same thing, nor that they issue both from one and the same root; but surely this I may say, they are near a kin &amp; have their roots not far asunder, because they are generally still found in one and the self same person.

That both these meet in the grand Antichrist will appear.

First, he arrogates authority over the soul; so much I take to be intimated in those words of Daniel speaking of him, Dan. 7.25 He shall speak great words against the most high, and think to change times and laws; that he shall arrogate power to himself to change Gods laws, as in coining and altering Articles of Faith, appointing worship for God, &amp;c. high words, great words against God; so the Apostle, 2 Thes. 2.4. He as God sits in the Temple of God, shewing himself that he is God. How does he that? viz. by Lording it over the consciences of Gods people as if he were God, and thereby he deprives Christ of one of the principal Flowers of his Crown, which is to have dominion over the Faith: see more for this. Rev. 13.5 6.15, 16.

Secondly, the great Antichrist is to extend this power, at least, presumptively and intentionally where he cannot do it actually over all Kindreds, Tongues and Nations, Rev. 13.7.

It is Antichristian to claim such authority, though but over one man, or one Church; It is more Antichristian to claim such authority over many Churches, as the Hierarchical Bishop useth to do; it is yet more Antichristian to claim this authority over whole Provinces as the Hierarchical Archbishop useth to do; it is yet still more Antichristian to claim it over many Provinces &amp; Kingdoms, as the Hierarchical Patriarch useth to do; but yet all these do not amount to the grand Antichrist, why? because there may be a greater; but now he that claims such sovereignty over all the Churches of the world is the grand Antichrist indeed, for there can be no greater.</p></blockquote>

<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that… 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word going before or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>

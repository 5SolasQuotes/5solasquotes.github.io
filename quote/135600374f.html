<main class="wrap"><figure class="quote" id="q-135600374f" data-kw="">
<blockquote><p>6. …Some [apostolic traditions] are concerning the rites and the good order of the Church; as that touching the blood of things that were strangled, the covering of women’s heads, that men should not be covered in the time of prayer, and such like. 7. Those things, which are concerning the substance of doctrine [e.g. Lord’s Supper], are to be perpetually observed in the Church: but as for the things which appertain to outward rites, they in consideration of diverse circumstances, as of time, place and person, may be changed: yet so, as regard be always had (which must be generally observed in all indifferent things) unto that which makes most for the glory of God and the edification of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/swiss-reformed.html">Theodore Beza &amp; Anthony Faius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded &amp; Defended in the University of Geneva</cite>, (Edinburgh, 1591), pp. 251-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“6. …Some [apostolic traditions] are concerning the rites and the good order of the Church; as that touching the blood of things that were strangled, the covering of women’s heads, that men should not be covered in the time of prayer, and such like. 7. Those things, which are concerning the substance of doctrine [e.g. Lord’s Supper], are to be perpetually observed in the Church: but as for the things which appertain to outward rites, they in consideration of diverse circumstances, as of time, place and person, may be changed: yet so, as regard be always had (which must be generally observed in all indifferent things) unto that which makes most for the glory of God and the edification of the Church.”

— Swiss Reformed, Theodore Beza &amp; Anthony Faius | Propositions &amp; Principles of Divinity Propounded &amp; Defended in the University of Geneva by certain students of divinity there, under Mr. Theodore Beza &amp; Anthonis Faius, professors of divinity (Edinburgh, 1591), pp. 251-2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+%E2%80%A6Some+%5Bapostolic+traditions%5D+are+concerning+the+rites+and+the+good+order+of+the+Church%3B+as+that+touching+the+blood+of+things+that+were+strangled%2C+the+covering+of+women%E2%80%99s+heads%2C+that+men+should+not+be+covered+in+the+time+of+prayer%2C+and+such+like.+7.+Those+things%2C+which+are+concerning+the+substance+of+doctrine+%5Be.g.+Lord%E2%80%99s+Supper%5D%2C+are+to+be+perpetually+observed+in+the+Church%3A+but+as+for+the+things+which+appertain+to+outward+rites%2C+they+in+consideration+of+diverse+circumstances%2C+as+of+time%2C+place+and+person%2C+may+be+changed%3A+yet+so%2C+as+regard+be+always+had+%28which+must+be+generally+observed+in+all+indifferent+things%29+unto+that+which+makes+most+for+the+glory+of+God+and+the+edification+of+the+Church.%E2%80%9D%0A%0A%E2%80%94+Swiss+Reformed%2C+Theodore+Beza+%26+Anthony+Faius+%7C+Propositions+%26+Principles+of+Divinity+Propounded+%26+Defended+in+the+University+of+Geneva+by+certain+students+of+divinity+there%2C+under+Mr.+Theodore+Beza+%26+Anthonis+Faius%2C+professors+of+divinity+%28Edinburgh%2C+1591%29%2C+pp.+251-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F135600374f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/135600374f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Some%20%5Bapostolic%20traditions%5D%20are%20concerning%20the,and%20the%20edification%20of%20the%20Church&amp;text=Some%20%5Bapostolic%20traditions%5D%20are%20concerning%20the%20rites%20and&amp;text=of%20God%20and%20the%20 </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c59517b541" data-kw="">

</figure><figure class="quote" id="q-a376e8e896" data-kw="">
<blockquote><p>…Tertullian wanted all females veiled from the time of puberty (1.1; 16.3). Some virgins, to the contrary, were attending the church gatherings unveiled, and some married women made only a token covering of the head (17.1, 4). Both sides, it seems, assumed that married women would be veiled in public. It is not clear whether Tertullian, who was under the influence of the Montanist movement on the basis of a revelation by the Paraclete (1.7) is an innovator or is trying to restore a practice being neglected or abandoned. His description of varied hairstyles (On the Apparel of Women 2.7) indicates not many women were in fact veiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/everett-ferguson.html">Everett Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Veils &amp; Virgins: Greek, Roman, Jewish &amp; Early Christian Practice’ Restoration Quarterly</cite>, 56, no. 4 (2014), pp. 223-43, p. 223</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-1dd061a1b1" data-kw="">
<blockquote><p>I answer: that for men to pray or prophesy with their heads covered, or with long hair, and women uncovered, were things in their own nature indifferent (unless you make it necessary, as a moral duty for men to pray or prophesy uncovered, and women contra; which no interpreters upon that text do) and yet the apostle enjoins the Corinthians so to do… …in the use of things indifferent; whereas there are at least five [rules] to that purpose: And by the same reason, that the apostle enjoins men to keep decency, he enjoins to keep order; and so other rules, concerning things indifferent. Does not the apostle complain of disorder in the Corinthians preaching covered? yet the contrary order was not necessary, but in itself indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners. Being some Animadversions upon a Tract of Mr. John Cotton’s Called, ‘The Keys of the Kingdom of Heaven’. As also upon Another Tract of his Called, ‘The Way of the Churches of New England’. Manifesting: 1. The Weakness of his Proofs. 2. The Contradictions to Himself &amp; Others. 3. The Middle-Way</cite>, ... (London, 1645), ch. 6, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

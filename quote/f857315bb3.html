<main class="wrap"><figure class="quote" id="q-f857315bb3" data-kw="">
<blockquote><p>Whether it is rightly said by Johannes Piscator on Rom. 8:4 [“That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit.”]: ‘Here he indicates the end for which God, in the flesh of his Son, condemned our sin—namely, that the righteousness (or justification) of the Law might be fulfilled in us; that is, that we might be justified, being endowed with that righteousness which the Law requires of us. For the Law requires of us either perfect obedience or punishment. But we have not rendered perfect obedience; yet we have paid the penalty in Christ, for he paid it on our behalf. Therefore we have satisfied the Law in Christ; and consequently the Law cannot condemn us, but is bound to justify us.’ We deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomar.html">Francis Gomar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Opera omnia</cite>, vol. 2, p. 91, trans. ChatGPT-5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86ce0050dd" data-kw="">
<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.3</span></figcaption>

</figure><figure class="quote" id="q-2b18c6ea1b" data-kw="">
<blockquote><p>Here the preceding cause [in Rom. 3:24] is Christ constituted a propitiation in his blood. In this impulsive cause, two things are noted: First, Christ’s justice or obedience is the meritorious cause of our salvation; Second, this justice and obedience consists in full satisfaction for our sins and complete fulfillment of the Law for us. Concerning the first, that Christ’s justice is the meritorious cause of our salvation: since it seems to conflict that we are saved by free grace and by merit, that is, a price paid, it must be thus understood. Christ’s merit opposes not God’s judgment simply or in itself, for Christ, as man and Son of God by the union of divine and human natures, has this of grace, not having earned it. As Augustine testifies, in Him the predestination of grace most clearly shines, so His merit opposes not God’s grace but is subordinate to it, depending thereon. But both God’s grace and Christ’s merit oppose our works, each in its order. Thus, grace, from which merit flows, and merit, whereby we are saved, stand together. This is proved by texts conjoining God’s love, Christ’s propitiation, reconciliation, redemption, and ransom, and by the same and like texts proving that Christ by His obedience truly merited salvation for us. For if He fully satisfied for our sins, paid the penalties due, appeased God’s wrath, and acquired eternal life, He rightly merited salvation for us. Merit here we call the most sufficient price to satisfy God’s judgment for sins and penalties and to acquire eternal life. In sum, respecting God, all is free; respecting God’s appeased wrath through the Son, there is merit, yet freely given to you. Concerning the second, that Christ’s justice consists in full satisfaction for our sins and complete fulfillment of the Law: Christ’s most full and perfect obedience or justice, whereby we are justified when imputed, includes both complete satisfaction for all sins and fulfillment of all the Law requires of us. For He was made under the Law for us, which demands two things: that we commit nothing against it, and omit nothing of it. Otherwise, it thunders woe against both him that does not what he ought and him that does what he ought not. But Christ is the fulfilling of the Law unto salvation for all that believe (Rom. 10). The righteousness of the Law is fulfilled in us, not by us, but in our Head, Christ, for us. Thus, chiefly, Christ by His obedience satisfied for our sins, bearing most sufficient penalties, whence Scripture greatly commends the benefit of Christ’s death, for by it we are redeemed from death. But He also perfectly fulfilled the Law for us, not only by suffering but by doing—yea, in suffering He acts, for He offers Himself as priest and is offered as victim (Rom. 4). Not only are sins not imputed, being remitted, but Christ’s justice is imputed, He who was made justice for us (1 Cor. 1:30). Yet to understand this rightly, note that Christ’s justice is threefold: First, essential, common to the three Persons, which is God Himself, for whatsoever is in God is God; Second, habitual justice, adorning His human nature from conception with purity far beyond angelic, yet created; Third, actual justice, whereby throughout His life, especially in suffering that death, He rendered obedience to the Father. This third alone enters the account of the merit of our justification, whereby we are not only redeemed from death but obtain eternal life through this perfect obedience perfectly rendered to the Law by Christ for us. … The matter of justification, as the term is variously taken, is considered by theologians not in one way, but it reduces to this: the matter is either the subject in which and from which this benefit arises, namely, Christ’s imputed justice, as taught above, which imputation includes both absolution from injustice through remission of sins (by which term Scripture often synecdochically comprehends the whole benefit of salvation) and the adjudication of Christ’s justice (Dan. 9, Rom. 4, 8, mentioning not only remission but the gift of justice); or the subject receiving this benefit, which is all and only the elect (Rom. 8, proved first a priori, because they are elect, then a posteriori, because they are justified). The form of justification is this application of Christ’s justice through faith, or that free imputation whereof we spoke (Rom. 4, Phil. 3, 2 Cor. 5), where the phrase ‘in Him’ notes two things: first, our justice is not inherent in us but Christ’s, existing outside us, yet ours by right of donation; second, we have Christ’s justice as Christ has our sin—not subjectively but relatively, by imputation, as shall be said in explicating the effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-lucas-trelcatius.html">Sr. Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commonplaces of Holy Theology, “Of Justification”, “Part Constructive”</cite>, p. 137 in Trelcatius Sr. &amp; Jr., Opuscula Theologica Omnia (d. 1602; Leiden: Orlers &amp; Maire, 1614), trans. AI at Confessionally Reformed Theology. Trelctius Sr. (1542–1602) was a reformed theologian and professer at Leiden, Netherlands.</span></figcaption>

l+the+most+sufficient+price+to+satisfy+God%E2%80%99s+judgment+for+sins+and+penalties+and+to+acquire+eternal+life.+In+sum%2C+respecting+God%2C+all+is+free%3B+respecting+God%E2%80%99s+appeased+wrath+through+the+Son%2C+there+is+merit%2C+yet+freely+given+to+you.+Concerning+the+second%2C+that+Christ%E2%80%99s+justice+consists+in+full+satisfaction+for+our+sins+and+complete+fulfillment+of+the+Law%3A+Christ%E2%80%99s+most+full+and+perfect+obedience+or+justice%2C+whereby+we+are+justified+when+imputed%2C+includes+both+complete+satisfaction+for+all+sins+and+fulfillment+of+all+the+Law+requires+of+us.+For+He+was+made+under+the+Law+for+us%2C+which+demands+two+things%3A+that+we+commit+nothing+against+it%2C+and+omit+nothing+of+it.+Otherwise%2C+it+thunders+woe+against+both+him+that+does+not+what+he+ought+and+him+that+does+what+he+ought+not.+But+Christ+is+the+fulfilling+of+the+Law+unto+salvation+for+all+that+believe+%28Rom.+10%29.+The+righteousness+of+the+Law+is+fulfilled+in+us%2C+not+by+us%2C+but+in+our+Head%2C+Christ%2C+for+us.+Thus%2C+chiefly%2C+Christ+by+His+obedience+satisfied+for+our+sins%2C+bearing+most+sufficient+penalties%2C+whence+Scripture+greatly+commends+the+benefit+of+Christ%E2%80%99s+death%2C+for+by+it+we+are+redeemed+from+death.+But+He+also+perfectly+fulfilled+the+Law+for+us%2C+not+only+by+suffering+but+by+doing%E2%80%94yea%2C+in+suffering+He+acts%2C+for+He+offers+Himself+as+priest+and+is+offered+as+victim+%28Rom.+4%29.+Not+only+are+sins+not+imputed%2C+being+remitted%2C+but+Christ%E2%80%99s+justice+is+imputed%2C+He+who+was+made+justice+for+us+%281+Cor.+1%3A30%29.+Yet+to+understand+this+rightly%2C+note+that+Christ%E2%80%99s+justice+is+threefold%3A+First%2C+essential%2C+common+to+the+three+Persons%2C+which+is+God+Himself%2C+for+whatsoever+is+in+God+is+God%3B+Second%2C+habitual+justice%2C+adorning+His+human+nature+from+conception+with+purity+far+beyond+angelic%2C+yet+created%3B+Third%2C+actual+justice%2C+whereby+throughout+His+life%2C+especially+in+suffering+that+death%2C+He+rendered+obedience+to+the+Father.+This+third+alone+enters+the+account+of+the+merit+of+our+justification%2C+whereby+we+are+not+only+redeemed+from+death+but+obtain+eternal+life+through+this+perfect+obedience+perfectly+rendered+to+the+Law+by+Christ+for+us.+%E2%80%A6+The+matter+of+justification%2C+as+the+term+is+variously+taken%2C+is+considered+by+theologians+not+in+one+way%2C+but+it+reduces+to+this%3A+the+matter+is+either+the+subject+in+which+and+from+which+this+benefit+arises%2C+namely%2C+Christ%E2%80%99s+imputed+justice%2C+as+taught+above%2C+which+imputation+includes+both+absolution+from+injustice+through+remission+of+sins+%28by+which+term+Scripture+often+synecdochically+comprehends+the+whole+benefit+of+salvation%29+and+the+adjudication+of+Christ%E2%80%99s+justice+%28Dan.+9%2C+Rom.+4%2C+8%2C+mentioning+not+only+remission+but+the+gift+of+justice%29%3B+or+the+subject+receiving+this+benefit%2C+which+is+all+and+only+the+elect+%28Rom.+8%2C+proved+first+a+priori%2C+because+they+are+elect%2C+then+a+posteriori%2C+because+they+are+justified%29.+The+form+of+justification+is+this+application+of+Christ%E2%80%99s+justice+through+faith%2C+or+that+free+imputation+whereof+we+spoke+%28Rom.+4%2C+Phil.+3%2C+2+Cor.+5%29%2C+where+the+phrase+%E2%80%98in+Him%E2%80%99+notes+two+things%3A+first%2C+our+justice+is+not+inherent+in+us+but+Christ%E2%80%99s%2C+existing+outside+us%2C+yet+ours+by+right+of+donation%3B+second%2C+we+have+Christ%E2%80%99s+justice+as+Christ+has+our+sin%E2%80%94not+subjectively+but+relatively%2C+by+imputation%2C+as+shall+be+said+in+explicating+the+effects.%E2%80%9D%0A%0A%E2%80%94+Sr.+Lucas+Trelcatius%2C+Commonplaces+of+Holy+Theology%2C+%E2%80%9COf+Justification%E2%80%9D%2C+%E2%80%9CPart+Constructive%E2%80%9D%2C+p.+137+in+Trelcatius+Sr.+%26+Jr.%2C+Opuscula+Theologica+Omnia+%28d.+1602%3B+Leiden%3A+Orlers+%26+Maire%2C+1614%29%2C+trans.+AI+at+Confessionally+Reformed+Theology.+Trelctius+Sr.+%281542%E2%80%931602%29+was+a+reformed+theologian+and+professer+at+Leiden%2C+Netherlands.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b18c6ea1b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2b18c6ea1b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Here%20the%20preceding%20cause%20%5Bin%20Rom,be%20said%20in%20explicating%20the%20effects&amp;text=Here%20the%20preceding%20cause%20%5Bin%20Rom.%203%3A24%5D%20is&amp;text=as%20shall%20be%20said%20in%20explicating%20the%20effects" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The great question is, of which sort is our righteousness whereby we are justified? I answer, of the second sort [Christ’s passive righteousness], which yet is no derogation from it: for though it be not a righteousness so honoring ourselves, yet is it as excellent in Christ, and honorable to Him. And this first kind of righteousness [Christ’s active righteousness] as it is in Christ, cannot, retaining its own form, be made ours. And to that the Papists arguments will hold good. The Law commanded our own personal obedience, and not another for us; We did not so personally obey, we did not really obey in Christ: and God does not judge us to do what we did not; If we had, yet it would not have made us just: for one sin will make us unjust, though we were never so obedient before and after; Therefore if we had obeyed in Christ, and yet sinned in ourselves, we are breakers of the Law still. And so our righteousness cannot be of the first sort. This breach therefore must be satisfied for, and consequently, our righteousness must be of the second sort: seeing both cannot stand in one person as before said. Christ indeed had both these kinds of righteousness, viz. the righteousness of perfect obedience; and the righteousness of satisfaction for disobedience. But the former only was his own personal righteousnes, not communicable to another under that notion, and in that form of ‘a righteousness by obeying’. The latter, was his righteousness, as he stood in our room, and was by imputation a sinner: and so is also our righteousness in and through Him. Yet the former [Christ’s active righteousness] (as I have proved before etc.) is ours too, and our righteousness too (though many divines think otherwise), but how? Not as retaining its form, in the former sense: but as it is also in a further consideration, a part of the righteousness by satisfaction: seeing that Christ’s very personal obediential righteousness was also in a further respect satisfactory.</p></blockquote>

<blockquote><p>For 2. I add, it is by the satisfaction of Christ the Redeemer, wherein are contained both the matter and form of the justification of a sinner. The matter is Christ’s satisfaction, his obedience in his life, in his death; in fulfilling the law, and in suffering for our not fulfilling it; and the merit of all manifested in his resurrection and glorious ascension. The form is the imputing of that obedience whereby the righteousness of Christ does now become the believer’s as truly and really by imputation as it was Christ’s own in action.</p></blockquote>

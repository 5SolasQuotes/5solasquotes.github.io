<blockquote><p>For even if the Word in his immeasurable essence united with the nature of man into one person, we do not imagine that he was confined therein. Here is something marvelous: the Son of God descended from heaven in such a way that, without leaving heaven, He willed to be borne in the virgin’s womb, to go about the earth, and to hang upon the cross; yet He continuously filled the world even as He had done from the beginning!</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13496562b0" data-kw="">
<blockquote><p>In 1650 many ministers in the episcopal Church of England were presbyterian in outlook and sought for reform unto this end. While some progress had been made following the Westminster Assembly, the work was still very incomplete. Oliver Cromwell, the self appointed ‘Protector’ of England, arose to civil power at this time; he was an Independent as far as Church government. Hence, Independent churches were arising all around, sometimes with presbyterian ministers. The Church of England’s theology was Erastian. It did not have local church membership as we do, nor allowed for ruling elders in the churches, nor for the ecclesiastical ministry to have the right of excommunication from the Lord’s Supper. These conditions made it difficult, if at all possible, for ministers to have adequate oversight of their parish, and to adequately bar (beyond verbal warnings) scandalous, professing Christians from disgracing the Lord’s Supper. In Independent churches without ruling elders, especially in large congregations, the conditions were similar. A minister, under regular order, does not have, nor should have, of himself, the power of jurisdiction to bar persons from the Lord’s Supper. Hence, among conscientious presbyterian ministers in these situations, there was a very real question of whether they should administer the Lord’s Supper at all, especially in light of their obligation to maintain the integrity of the Supper and their attendant responsibility, in some respect, to keep persons from scandalously abusing it. Many ministers had determined in the negative, at least for the time, till further presbyterian reform could be made. Such systematic reform never occured thereafter. Henry Jeanes (1611–1662) was an English presbyterian minister that had administered the Supper, with certain qualifications, in such conditions. A group of presbyterian ministers hence asked him to write out his reasons for this, in the hopes that he might be able to shed more light on the question for them. The article above is Jeanes’s answer. It is excellent. He gives the same answer as Thomas Cartwright, an earlier father of presbyterianism (as seen here). Answering the question stated in the title of the article, of whether the Supper may be administered without ruling elders or a presbyterian church government, is quite simple: At the end of Acts 2, the apostles, who were ministers, administered the Supper to the large and growing Church in Jerusalem from house to house. Commentators, presbyterian included, nearly universally agree that they had no ruling elders, or sessions, or presbyteries. Why an affirmative answer to the question is right, though, is a much trickier thing to explicate. And this is the primary value of the article: It clearly, carefully and in a balanced fashion, according to right, detailed, classic presbyterian principles shows how these things consist with each other in their right relations, this giving us an exponentially greater understanding of the Lord’s things. See especially pp. 30-32 &amp; 34 that the Lord’s Supper is more (1) properly and immediately worship, and (2) life-giving, and is therefore of greater import and necessity than having an eldership and exercising a negative discipline so as to exclude the scandalous beyond the verbal guarding of the Table by the minister. A modern application of the question today is: Whether a minister, persuaded that weekly communion is too frequent for the adequate self-preparation of the people, in how it actually plays out, and for the elders to maintain adequate circumspection of the people’s right partaking of the Supper, and yet this church practice is not going to be reformed anytime soon, whether that minister may yet in good conscience administer the Supper in these conditions for the time? The principles discussed in the article would appear to be for the affirmative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regarding a minister administering the Lord’s Supper with a deficient frequency: | Contextual notes on the work of Henry Jeanes, The Want [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650)</cite></span></figcaption>

<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>

<blockquote><p>Mr. Sprint [an opponent] himself lays down one ground which proves the refusing of inconvenient ceremonies to be a greater duty than the preaching of the Word: for he holds that the substantials of the Second Table do overrule the ceremonials of the First Table, according to that which God says, ‘I will have mercy and not sacrifice,’ (Mt. 12:7). And elsewhere he teaches that to tend a sick person ready to die is a greater duty than the hearing of the Word. Now to practice inconvenient and scandalous ceremonies is to commit soul-murder, and so to break one of the most substantial duties of the Second Table. Therefore, according to Mr. Sprint’s own ground, the refusing of inconvenient and scandalous ceremonies is a greater duty than the preaching of the Word, which is but a ceremonial of the First Table, and if the neglect of tending a sick person’s body be a greater sin than to omit the hearing of many sermons, much more to murder the souls of men by practicing inconvenient and scandalous ceremonies, is a greater sin than to omit the preaching of many sermons, which is all the omission (if there be any) of those who suffer deprivation for refuising to conform unto inconvenient ceremonies.</p></blockquote>

— George Gillespie, English Popish Ceremonies (1637), pt. 2, ch. 1, p. 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMr.+Sprint+%5Ban+opponent%5D+himself+lays+down+one+ground+which+proves+the+refusing+of+inconvenient+ceremonies+to+be+a+greater+duty+than+the+preaching+of+the+Word%3A+for+he+holds+that+the+substantials+of+the+Second+Table+do+overrule+the+ceremonials+of+the+First+Table%2C+according+to+that+which+God+says%2C+%E2%80%98I+will+have+mercy+and+not+sacrifice%2C%E2%80%99+%28Mt.+12%3A7%29.+And+elsewhere+he+teaches+that+to+tend+a+sick+person+ready+to+die+is+a+greater+duty+than+the+hearing+of+the+Word.+Now+to+practice+inconvenient+and+scandalous+ceremonies+is+to+commit+soul-murder%2C+and+so+to+break+one+of+the+most+substantial+duties+of+the+Second+Table.+Therefore%2C+according+to+Mr.+Sprint%E2%80%99s+own+ground%2C+the+refusing+of+inconvenient+and+scandalous+ceremonies+is+a+greater+duty+than+the+preaching+of+the+Word%2C+which+is+but+a+ceremonial+of+the+First+Table%2C+and+if+the+neglect+of+tending+a+sick+person%E2%80%99s+body+be+a+greater+sin+than+to+omit+the+hearing+of+many+sermons%2C+much+more+to+murder+the+souls+of+men+by+practicing+inconvenient+and+scandalous+ceremonies%2C+is+a+greater+sin+than+to+omit+the+preaching+of+many+sermons%2C+which+is+all+the+omission+%28if+there+be+any%29+of+those+who+suffer+deprivation+for+refuising+to+conform+unto+inconvenient+ceremonies.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+2%2C+ch.+1%2C+p.+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fffa696fb07.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ffa696fb07.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relations-between-the-1st-2nd-tables-of-the-law/#:~:text=Mr.%20Sprint%20%5Ban%20opponent%5D%20himself%20lays,refuising%20to%20conform%20unto%20inconvenient%20ceremonies&amp;text=Mr.%20Sprint%20%5Ban%20opponent%5D <blockquote><p>Q. What are the outward signs of this sacrament? A. Sacramental elements and actions. Q. What are the sacramental actions of the minister? A. The taking, blessing, and breaking the bread, and giving it, with the wine, to the communicants. Q. What is signified by the breaking of the bread? A. God’s breaking and bruising Christ for our sin.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2d7fb2af14" data-kw="">
<blockquote><p>7th Question: Is it necessary in essence for the Church, or at least as a requirement, that all its members be closely united in terms of locality? Response: Conclusion: It is very convenient, so this should generally be observed, that members are constituted from a common locality, such as from a neighborhood or city. Because such is suggested by the practice of the Apostolic Church. For we do not read that the inhabitants of Cenchreae were included in the Church of the Corinthians, or vice versa. Because if they can observe one another more easily, they can stimulate love and good works, Hebrews 10, and give and receive examples. Because in this way they can best encourage, comfort, and build each other up, 1 Thess. 5:11,14, and indeed as mentioned in Heb. 3:13. Conclusion: Therefore, it should not be proven that without a just necessity, citizens, for example, of our city should be enrolled in the Church of a neighboring city or village, and vice versa. Because this inconvenience exists and affects many looking towards ecclesiastical communion; for the enjoyment of which God primarily instituted gatherings and ecclesiastical societies: See the statements of the preceding problem. Because it breeds confusion, contentions, and divisions among members and churches; it removes harmony and weakens the vigor of ecclesiastical discipline. Hence, ancient canons have prohibited transitions and appeals to other churches for both private believers and clergy. See the Canons of the African Church, especially Canons 23, 28, 54, 105, 125, and notably the Canons and Acts of the Council of Carthage in the year 419, where a synodical letter to Boniface, Bishop of the Roman Church, shows that one should not be summoned from Africa across the sea to the See of Rome. The constitutions, decrees, and practices of the Belgian Churches absolutely prohibit any transfer from one church to another, whether of the same language or a different one, without good permission and dismissal, or written testimony from the church of which one is a member. This especially applies to those transient members around whom the office of correction or even censorship is exercised. Because it smacks of schismatic and factious behavior or carnal curiosity, i.e., factionalism, pride, and disdain; similarly as in the Church of Corinth, 1 Cor. 1:12 &amp; 3:3. Conclusion: If in any case, due to urgent reasons, it is granted to someone or some people to be enrolled in a church outside their place of residence, or to remain in the same church after moving to a nearby city or village, this must be done with the advice and consent of both churches. Conclusion: Another reason is far different when churches are not of the same confession or at least differ to the extent that the advantages of local presence and cohabitation are postponed for the tranquility of conscience and safer and much greater edification. This must be dealt with elsewhere in detail, and we may touch on it below. Conclusion: Where faithful cannot enjoy the benefits of close cohabitation, they should not be circumscribed by the boundaries of that church and excluded from it, just as those who live outside the parish, city, or village should not be forced to join it any more than those who live there. Because the circumstance of location and civil cohabitation is external and accidental to the church; therefore, it is not of its nature or essence. Because it is not a necessary requirement. Ecclesiastical communion acts can be carried out among those members, although not as promptly, abundantly, easily, and excellently. For more and less do not alter the species. Because the status of a clandestine and troubled church often requires such a thing due to persecutions, heresies, schisms, and similar disturbances. Because the defects of other faithful, churches, and ministers in many places leave nothing else for the faithful but to resort to this last refuge, especially since they cannot use the first ship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 59-60 (PDF pp. 62-64)</span></figcaption>

<blockquote><p>[John Owen:] ‘To make men members of any particular churches, their own consent is required.’ If he mean this of an explicit consent (as I suppose he does, or he says nothing) it is fully disproved above; and implicit confessed [consent is] sufficient. A man that removes his habitation (as both he and we grant, it’s free for him to do) may, by setting down in another congregation and submitting himself to all the ordinances of Christ there, with performance of all offices of love to the members of that congregation, implicitly and yet sufficiently consent[s] to be a member thereof. And on the other hand, a man may not remove his habitation from a congregation wherein he has long consented to communicate, and yet remove his consent to be a member of another, as we see too much, in this loose and wandering age.</p></blockquote>

</figure><figure class="quote" id="q-fdd471083f" data-kw="">
<blockquote><p>I confess there might be in some towns no greater number of Christians than did meet together in one place, notwithstanding whereof the pastor or pastors and elders of that congregation, might and did manage the government of the same, and exercise jurisdiction therein. I confess also that in those cities wherein there was a greater number of Christians than could meet together into one place for the worship of God, the presbytery did consist of the pastors and elders within such a city: For it cannot be proved that there were at that time any Christian congregations in landward villages (the persecution forcing Christians to choose the shelter of cities, for which reason many are of opinion that the infidels in those days were called pagani, because they alone dwelt in pagis [districts]) and if there had been any such adjacent to cities, we must think the same should have been subject to the common presbytery, their own pastors and elders being a part thereof. Howsoever it cannot be called in question that the presbytery in the apostolic Churches was made up of as many as could conveniently meet together, for managing the ordinary matters of jurisdiction and Church-government. The pastors and elders of diverse cities could not conveniently have such ordinary meetings, especially in the time of persecution; only the pastors and elders within one city had such conveniency. And so to conclude, we do not forsake, but follow the patern, when we join together a number of pastors and elders out of the congregations in a convenient circuit, to make up a common presbytery, which has power and authority to govern those congregations; for if the presbytery which we find in those cities wherein the apostles planted churches, be a sure pattern for our classical presbyteries (as we have proved it to be)…</p></blockquote>

<blockquote><p>There are many cases in which local separation may be lawful: First, as if our callings justly remove us to another place or country. Secondly, if our spiritual advantage bind us to remove to a better minister and more suitable society when we are free. Thirdly, if our lawful pastors be turned out of the place, and we follow them, and turn away but from usurpers. Fourthly, if the pastors turn heretics or wolves. Fifthly, if the public good of the churches require my removal. Sixthly, if any sin be imposed on me, and I be refused by the Church unless I will commit it. In these and some other such cases a remove is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 59, p. 238</span></figcaption>

</figure><figure class="quote" id="q-cdf7358961" data-kw="">
<blockquote><p>Only we observe that the Independents here go farther from the Reformed Churches, both in the strictness and in the loosness of their satisfactions. The Brownists [separatists] are satisfied with the signs of personal grace, but the Independents require more: they proceed to a trial by a long conversation of the sociable and complying disposition of the person to be admitted with the spirits of the whole Church whereof he is to be a member; without this suitableness of spirit they will reject them whom otherwise they find to be saints. But their chief excess here is in looseness. The Brownists will not dispense with known errors and sins in the members; they will not admit of Anabaptists, of proud, luxurious, contentious people. If they find any such to have crept in among them, they profess their judgement is for their casting out by censures. But the Independents will here be more wise for the increase of their party: and however they will have nothing to do with presbyterians, nor with such people who can live in their confused congregations, yet they make it their rule to hold out none for any error that is not fundamental, nor for any sin that is not continued in against conscience; walking according to this rule they swallow down without trouble the small gnats of Anabaptism and all other sects, who err not fundamentally and obstinately, and against conscience: How many sectaries are thus far guilty, who can determine? The little spot of luxury in apparel, in diet, and many fleshly delights, of strife, of disdainful railing, and such other faults (as are too common in their members) are of easy digestion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), p. 106</span></figcaption>

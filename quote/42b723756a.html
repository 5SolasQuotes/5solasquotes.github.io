<main class="wrap"><figure class="quote" id="q-42b723756a" data-kw="">
<blockquote><p>That Christ is Deus de Deo, God of God, is thus clearly proved out of Scripture; whosoever is God and the Son of God, must needs be God of God; but Christ is God and the Son of God, ergo &amp;c. But it hath been objected, if he be God of God, then he must have his essence communicated to him from the Father, and so be essentiatus a patre, essentiated, or natured from the Father: this will not follow, no more then that Socrates is essentiatus a Sophronisco, but only that he is genitus a patre, begotten of his Father, and so is recipiens essentiam, or habens essentiam communicatam a patre; which manner of speech is approved of by Beza, filius est a patre per ineffabilem totius essentiae communicationem ab aeterno: the Son is from the Father by an unspeakable communication of his whole essence from eternity: and Symlerus, non negamus silium haberea essentiam a Deo patre, sed essentiam genitam negamus: we do not deny that the Son hath his essence from God the Father, but we deny that the essence is begotten, and why should we boggle at this phrase, when our Lord himself acknowledgeth, Ioh. 5.26. omnia mihi data sunt a patre meo, &amp; pater dedit filio habere vitam in se, all things are given me of my Father?

Neither doth this any way contradict Calvin his autotheos, God of himself; which form of expression, though some protestants as well as papists have excepted against, yet I am of [William] Whitaker’s mind, in his answer to the 7th reason of Campian, that it is verissime &amp; sanstissime dictum, most truly and religiously spoken; nam si ex se Deus non est, omnino Deus non est: for if he be not God of himself, he is not God at all: let St Augustine be the umpire, and reconcile both, Christus ad se Deus, dicitur ad patrem filius; Christ may be considered two ways, either absolutely, and so he is Deus ex se, God of himself, as the Father is and the holy Spirit; or relatively, as filius, and so he is Deus de Deo, as he is the Son, so he is God of God: yea but these phrases may be taken in an ill sense, and so may all the Articles of the Creed, as you may see in the Parisian censure set out by the Jesuits; nay so may the whole Scripture, as St Peter teacheth us, which … the ignorant &amp; unstable pervert: what then, must we weed up all the flowers of Paradise, because heretics, like spiders, suck such juice out of them which they turn into poison?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacra nemesis, The Levite’s scourge, or, Mercurius disciplined. Also diverse remarkable disputes and resolved in the Assembly of Divines related, episcopacy asserted, truth righted, innocency vindicated against detraction</cite>, (Oxford: Leonard Lichfield, 1644), pp 17-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd4ab28589" data-kw="against Sabellius">
<blockquote><p>The passages that the Apostle to the Hebrews applies to Christ are not obscure praises of the supreme God: &quot;You, Lord, laid the foundation of the earth in the beginning, and the heavens are the work of your hands.&quot; Also, &quot;Let all God&#x27;s angels worship him.&quot; John begins his Gospel with a splendid proclamation of Christ&#x27;s divinity: &quot;In the beginning was the Word, and the Word was with God, and the Word was God.&quot; This phrase, &quot;the Word was God, and was with God,&quot; clearly argues both the divinity of Christ and the distinction of persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XV</span></figcaption>

</figure><figure class="quote" id="q-83ef30fcf6" data-kw="">
<blockquote><p>Now, the Son is able to be called the Word of God metonymically: whether by metonymy of the adjunct in place of the subject, because He is the principal argument/subject of the divine Word, both the prophetic Word formerly, and also the evangelical Word afterward under the New Testament; or by metonymy of the effect in the place of the cause, because God sets forth unto men His entire Word through the Son as the supreme and divine Prophet, not only under the New Testament, Hebrews 1:1, but also under the Old, 1 Peter 1:11.

Yet far more preferably by the name of the Λόγου/Logos/Word the person of the Son and His eternal subsistence is declared to us metaphorically, as we hold against the Socinians who deny it: for, α. this name is attributed to the Son, when mention is made, on the one side of Jehovah or the Father, on the other side of the Spirit, as of divine persons distinguished among themselves by these names; whence the middle name of the Word shall be of the same, rather than of a different, order.

β. This name is also substituted for the name of the Son, which is in Matthew 28:19, just as also John attributed to the incarnate Word the glory as of the Only Begotten of the Father, John 1:14, and he adds that God set forth to us, not the Word, but the Only Begotten Son of God, τὸν ὄντα εἰς τὸν κόλπον τοῦ πατρός, which is in the bosom of the Father, John 1:18. γ. This name is attributed to Christ, when there is regard, not to the Gospel, which was proclaimed after the Fall, but to the first Creation: whence also then it is evident that it is actually applicable to Him with respect to His eternal subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, §3, p. 56.</span></figcaption>

</figure><figure class="quote" id="q-9c5edb9e5b" data-kw="">
<blockquote><p>Thesis XIV… For because divine essence is infinite, most simple, and eternal, therefore the three hypostases subsisting in it—although they are truly three in number—because these individual hypostases are distinguished by their own incommunicable properties, they are nevertheless not three gods nor are they said to be three gods in the same way that there are three men… But instead, in the divine this happens by an indescribable communication of the whole essence from eternity, in which no point of beginning, middle, or end can be stated.† † dari, i.e., cannot be stated or supplied because it does not exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beza on the Trinity</cite>, 21 Theses’ from Tractationes Theologicae Bezae, Volumen I (Geneva: Jean Crespin, 1570), p. 651 tr. David Noe</span></figcaption>

<blockquote><p>He is not only called “the Son” (ho hyios) by way of eminence (Heb. 1:5) and “thou art the Christ, the Son of the living God” (Mt. 16:16), but also his own Son—“he that spared not his own Son” (Rom. 8:32); who has his own Father (Jn. 5:18); who begot the Son even from his essence—“the only begotten Son.”</p></blockquote>

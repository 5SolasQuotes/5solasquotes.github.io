<main class="wrap"><figure class="quote" id="q-d689e4674a" data-kw="">
<blockquote><p>We are assembled at this present, fathers and brethren beloved in the Lord, to give him most humble and most hearty thanks for his great &amp; singular goodness shewed unto us in discovering the traitorous intent of graceless wretches, who villainously conspired to take away the life of our gracious Queen (whom God long preserve,) and to kindle flames of uproars through the realm, to the utter wasting of her faithful subjects. O that we had the hearts to praise him for it with the like religious affection of spirit in zeal and sincerity, as Melchisedeck did for Lot recovered by Abram, as Moses &amp; the Israelites for the Egyptian yoke broken, as the Jews for their safety and the destruction of their enemies. Sure we have greater causes so to do, then any of them had.

For Lot was but one, and that a mean [lowly] man: nor much endangered more than of loss of liberty. Here a most excellent Princesses was in hazard, not of liberty, but of life: with God knoweth how many righteous Lots besides. And the bodily coils which the Israelites endured in Egypt under the task-masters that Pharaoh placed over them, were nothing in comparison of the spiritual bondage of the Antichristian tyrants, to whom, might these Egyptian imps have had their wills, we should (it is likely) have been most lamentably enthralled. Neither hath the Lord so mercifully delivered us out of the Lion’s mouth at this time only, but at sundry other heretofore often: that the Jews could not be so much beholding to him for that of Haman, who did not live to put them more then once in danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon upon part of the eighteenth Psalm preached to the public assembly of scholars in the University of Oxford the last day of August, 1586. by John Rainolds: upon occasion of their meeting to give thanks to God for the late detection and apprehension of traitors, who wickedly conspired against </cite>, (Oxford: Joseph Barnes, 1586), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f50ac8ff78" data-kw="">
<blockquote><p>Richard Cameron believed that those who trust in Christ alone for societal salvation will only vote for those whom Christ has designated in his word as fit for magisterial office; to vote for anyone else is trusting in unlawful means, and thus making a messiah out of a politician. Listen carefully to his reasoning:

Ye will not look to Christ, and yet there is no other ye can have help from but from Him. There is none to help you at all, except you acknowledge Him as your King and Head, and except you acknowledge no other magistrate but according to what He ordains in His word. See what David says, “He that ruleth over men must be just, ruling in the fear of God.” Compare this with “Moreover, thou shalt provide out of all the people, able men, such as fear God, men of truth hating covetousness. Therefore let the fear of God be upon you, take heed, and do it, for there is no iniquity with the Lord your God.” Ye see such should be men that fear God, and men of truth. Oh, take heed and consider what you are doing! Cry unto the Lord, and let us fight against these wicked rulers with the weapons of the spiritual warfare, the arms of secret prayer. Let us pray unto the Lord to cut them off, and the Lord will raise up those that will condemn and despise them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Hosea 13:9-10 (1680)′ in Sermons in times of persecution in Scotland, by sufferers for the royal prerogatives of Jesus Christ</cite>, ed. James Kerr (Edinburgh, 1880), p. 417.</span></figcaption>

</figure><figure class="quote" id="q-b6aed6f86e" data-kw="">
<blockquote><p>Labour to be more and more humble, and sensible of your own vileness. Self-abasing is the lifting up of Christ. The spirit that stoopeth lowest is best prepared to become a throne for Christ. For thus saith the High and lofty one that inhabiteth eternity, whose Name is holy; I dwell in the high and holy place, with him also that is of a contrite and humble spirit. This may seem strange that the highest place in heaven, and the lowest hearts on earth should be the fittest thrones for Christ.

And why? the heart that is lowest in humility, is highest in excellency in his esteem: the spirit that is lifted up to the greatest height of pride, is lowest for vileness and baseness in his account, God resisteth the proud, because they lift up themselves against His royal Majesty, and giveth grace to the humble, because they yield him subjection. Humility maketh way for more grace, and so for more full subjection unto Christ. They that delight to lie at the footstool of Christ in humility, shall see Christ sitting in the throne of their hearts, &amp; shall be exalted to sit with Christ in his throne of glory.</p></blockquote>

</figure><figure class="quote" id="q-c1b3157d47" data-kw="">
<blockquote><p>All the other precepts of this [moral] Law remaining in full force in their proper sense, it cannot but be an injury done to this Command, either flatly to refuse it that privilege, or, which is little better, to evaporate it into allegories.

Nor was the day abolished as a typical ceremony, but that seventh only changed to a seventh still, and the very next to it; He who is Lord of the Sabbath, either himself immediately, or by his authority in his apostles, appointing that day of his resurrection for our sabbath, adding to the remembrance of the first creation, the memorial of accomplishing the new creation, the work of our redemption, which appeared then manifestly to be perfected, when our Redeemer broke the chains of death, and arose from the grave; he who is the light of the new world, shining forth anew the same day that light was made in the former creation.

This day was St. John, in the Spirit, taken up with those extraordinary revelations. Rev. i. 10. They were extraordinary indeed. And certainly, every Christian ought to be in the Spirit, in holy meditations and exercises on this day, more than the rest; winding up his soul, which the body poises downwards, to a higher degree of heavenliness;—ought to be particularly careful to bring a humble heart to speak to God in prayer, and hear Him in His word, a heart breathing after Him, longing to meet with Himself in His ordinances. And certainly, it is safer and sweeter to be thus affected towards the Lord’s day, than to be much busied about the debate of the change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 382.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

ommandments%2C+%281701%29+in+The+Whole+Works+of+the+Most+Reverend+Father+in+God%2C+Robert+Leighton%2C+D.D.%2C+Archbishop+of+Glasgow+%282+vols%2C+London%3A+James+Duncan%2C+1828%29%2C+2%3A+382.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc1b3157d47.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c1b3157d47.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/05/15/robert-leighton-on-the-lords-day-sabbath/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-fac1d9e67d" data-kw="">
<blockquote><p>I have arranged the book into fifty-two Meditations, adapted for each Lord’s Day, not merely because it is not intended to read them continuously through, but because the subject is, so to speak, specially identified with the risen Saviour. For the truth lying at the foundation of the Psalms, and which makes them the Hymnal of the Church, is the identification of Christ with the Church.

All the sorrows of the believer run up into the sorrow of Christ; and all the joys of the believer flow from the joy of Christ. And around these three truths — helpless misery, glorious salvation, and faith, with its exponent, prayer — move all the Psalms. Any seeming repetitions may therefore in part perhaps be due to the constant recurrence of these three elements throughout the Psalms.

Had the volume been suitable for it, I would fain have inscribed it, such as it is, to those loved friends to whom it is my privilege to minister in the gospel of His Son. Any mark of affection, however slender, to those who are themselves so earnest and loving, would have been peculiarly grateful.

And now I would send it forth with the earnest prayer that the Lord the Spirit who indited the Psalms, would give us all increasingly, the spiritual understanding and the spiritual joy of them in Christ; and so bless the effort to open this alabaster-box, that the savour of His name may be as ointment poured forth.</p></blockquote>

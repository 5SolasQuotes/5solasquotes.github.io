<main class="wrap"><figure class="quote" id="q-799cf93f69" data-kw="">
<blockquote><p>If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Substantia Foederis Gratuiti inter Deum et Electos (Geneva, 1585), pp. 67-72 as translated in G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997)</cite>, p. 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.”

— Caspar Olevianus, De Substantia Foederis Gratuiti inter Deum et Electos (Geneva, 1585), pp. 67-72 as translated in G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997), p. 114">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+He+had+made+intercession+and+sacrifice+for+reprobates+too%2C+then+clearly%2C+their+sins+having+been+paid+for+by+the+sacrifice+of+the+Son+of+God%2C+the+justice+of+God+would+not+allow+Him+to+require+a+debt+already+paid+by+the+Son%2C+nor+would+the+justice+of+God+be+able+to+punish+them+with+eternal+death+for+their+sins+inasmuch+as+satisfaction+has+been+made+by+Him.%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+De+Substantia+Foederis+Gratuiti+inter+Deum+et+Electos+%28Geneva%2C+1585%29%2C+pp.+67-72+as+translated+in+G.+Michael+Thomas%2C+The+Extent+of+the+Atonement%E2%80%A6+%28Paternoster%2FWipf+%26+Stock%2C+1997%29%2C+p.+114&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F799cf93f69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/799cf93f69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=If%20He%20had%20made%20intercession%20and,satisfaction%20has%20been%20made%20by%20Him&amp;text=If%20He%20had%20made%20intercession%20and%20sacrifice%20for&amp;text=inasmuch%20as%20satisfaction%20has%20been%20made%20by%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed in the Everlasting Covenant... (London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, sect. 8, Whether Jesus Christ as Mediator died for all and every man?</cite>, p. 305</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-67cb1ff92e" data-kw="">
<blockquote><p>For this properly means to die for another: to liberate another from death by one’s own death, that he may live. Thus David in his lamentation exclaims: “My son Absalom: who shall give me to die for thee?” meaning, would that by my death I could redeem thy life, or liberate thee from death (2 Sam. 18:33). In the same way Christ is said to have” died for us when we were enemies” and “ungodly”: that is, to have liberated us, being enemies and ungodly, from death by his own death (Rom. 5:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Concerning the Death of Christ for All’ in ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’ trans. AI (1619; Monergism, 2026), pp. 24-27</cite>, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“For this properly means to die for another: to liberate another from death by one’s own death, that he may live. Thus David in his lamentation exclaims: “My son Absalom: who shall give me to die for thee?” meaning, would that by my death I could redeem thy life, or liberate thee from death (2 Sam. 18:33). In the same way Christ is said to have” died for us when we were enemies” and “ungodly”: that is, to have liberated us, being enemies and ungodly, from death by his own death (Rom. 5:6).”

— David Pareus, Article 2, ‘Concerning the Death of Christ for All’ in ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’ trans. AI (1619; Monergism, 2026), pp. 24-27, p. 25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+this+properly+means+to+die+for+another%3A+to+liberate+another+from+death+by+one%E2%80%99s+own+death%2C+that+he+may+live.+Thus+David+in+his+lamentation+exclaims%3A+%E2%80%9CMy+son+Absalom%3A+who+shall+give+me+to+die+for+thee%3F%E2%80%9D+meaning%2C+would+that+by+my+death+I+could+redeem+thy+life%2C+or+liberate+thee+from+death+%282+Sam.+18%3A33%29.+In+the+same+way+Christ+is+said+to+have%E2%80%9D+died+for+us+when+we+were+enemies%E2%80%9D+and+%E2%80%9Cungodly%E2%80%9D%3A+that+is%2C+to+have+liberated+us%2C+being+enemies+and+ungodly%2C+from+death+by+his+own+death+%28Rom.+5%3A6%29.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+Article+2%2C+%E2%80%98Concerning+the+Death+of+Christ+for+All%E2%80%99+in+%E2%80%98Oration+on+the+Synod+of+Dort+%26+the+Remonstrants%E2%80%99+Articles%E2%80%99+trans.+AI+%281619%3B+Monergism%2C+2026%29%2C+pp.+24-27%2C+p.+25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67cb1ff92e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67cb1ff92e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=For%20this%20properly%20means%20to%20die,by%20his%20own%20death%20%28Rom.%205%3A6&amp;text=For%20this%20properly%20means%20to%20die%20for%20another&amp;text=from%20death%20by%20his%20own%20death%20%28Rom.%205%3A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-51a55c384d" data-kw="">
<blockquote><p>31. But the sense of these places [1 Jn. 2 and 2 Pet. 2] is that Christ gave Himself (which we easily acknowledge) as a sufficient price for the whole world and for the false teachers themselves. Even so, those alone are effectually redeemed who acknowledge this grace; not those who delight themselves in their own captivity, and are rejecters of Christ, such as are the reprobate. 32. We have already warned above about those universal passages that they ought to be, in certain places, restricted to all the elect, whom the Lord has [as his own], not only in Judea but also in all parts of the world, in which sense it may also be said that “the blood of Christ is a propitiation for the whole world”—although this text we freely acknowledge to be about sufficiency. … 37. However, it is incredible shamelessness of those critics which drives them to write that our church doctrine about the death of Christ, and its efficacy being limited to the elect and believers alone, leads people to despair, because one cannot deduce anything certain from mere particular propositions. … 9. We accordingly conclude with the Scriptures that all the elect or believers in Christ are saved by Christ… 10. But as one error begets another, our adversaries claiming that God equally loves all and that Christ died effectually for all, although they nominally admit there to be a certain number of the elect, nevertheless they undermine the whole force of divine election, and instead they move into the military camp of the Pelagians, who make foreseen faith and [foreseen] unbelief the cause of salvation and death, of election and reprobation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on the place of the divine Paul, 1 Cor 15:22, ‘For as in Adam all die, so also in Christ shall all be made alive; and on the question: Whether Christ died for all? trans. Michael Lynch (Heidelberg: Smesmann, 1589) Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

— Daniel Tossanus, Theological Disputation on the place of the divine Paul, 1 Cor 15:22, ‘For as in Adam all die, so also in Christ shall all be made alive; and on the question: Whether Christ died for all? trans. Michael Lynch (Heidelberg: Smesmann, 1589) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C31.+But+the+sense+of+these+places+%5B1+Jn.+2+and+2+Pet.+2%5D+is+that+Christ+gave+Himself+%28which+we+easily+acknowledge%29+as+a+sufficient+price+for+the+whole+world+and+for+the+false+teachers+themselves.+Even+so%2C+those+alone+are+effectually+redeemed+who+acknowledge+this+grace%3B+not+those+who+delight+themselves+in+their+own+captivity%2C+and+are+rejecters+of+Christ%2C+such+as+are+the+reprobate.+32.+We+have+already+warned+above+about+those+universal+passages+that+they+ought+to+be%2C+in+certain+places%2C+restricted+to+all+the+elect%2C+whom+the+Lord+has+%5Bas+his+own%5D%2C+not+only+in+Judea+but+also+in+all+parts+of+the+world%2C+in+which+sense+it+may+also+be+said+that+%E2%80%9Cthe+blood+of+Christ+is+a+propitiation+for+the+whole+world%E2%80%9D%E2%80%94although+this+text+we+freely+acknowledge+to+be+about+sufficiency.+%E2%80%A6+37.+However%2C+it+is+incredible+shamelessness+of+those+critics+which+drives+them+to+write+that+our+church+doctrine+about+the+death+of+Christ%2C+and+its+efficacy+being+limited+to+the+elect+and+believers+alone%2C+leads+people+to+despair%2C+because+one+cannot+deduce+anything+certain+from+mere+particular+propositions.+%E2%80%A6+9.+We+accordingly+conclude+with+the+Scriptures+that+all+the+elect+or+believers+in+Christ+are+saved+by+Christ%E2%80%A6+10.+But+as+one+error+begets+another%2C+our+adversaries+claiming+that+God+equally+loves+all+and+that+Christ+died+effectually+for+all%2C+although+they+nominally+admit+there+to+be+a+certain+number+of+the+elect%2C+nevertheless+they+undermine+the+whole+force+of+divine+election%2C+and+instead+they+move+into+the+military+camp+of+the+Pelagians%2C+who+make+foreseen+faith+and+%5Bforeseen%5

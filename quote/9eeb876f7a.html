<main class="wrap"><figure class="quote" id="q-9eeb876f7a" data-kw="">
<blockquote><p>That Christ the second Adam, should become a sacrificing Priest in the covenant, was absolutely necessary. The necessity of it will appear, by considering,—That they, whom he represented in the covenant, were sinners; that their sin, could not be expiated, but by a sacrifice of sufficient value; that no sacrifice for sin, could be accepted by God, but on such an altar, as should sanctify the gift; and, that such a sacrifice, could not be offered on such an altar, but by a Priest, called by God for that purpose.

1. The necessity of Christ’s becoming, in the covenant of grace, a sacrificing Priest, will appear evident, when we consider that, they whom he therein represented, were sinners. They were sinners against the “High and Holy One;” and such a covenant, as should be a covenant of grace to them, could not be established, without provision made for removing their sin; which necessarily implied a Priest. The covenant of works, was made without a priest; because the persons who were represented in it, were without sin: there, there was no sin to take away. But the covenant of grace, was a covenant of peace, between an offended God and sinners; and therefore could not be made, but by the intervention of a Priest, who should be able to repair the injury, done to the honour of God, and so to take away sin.

Hence, are these words of the prophet Zechariah; “He shall he a Priest upon his throne; and the counsel of peace, shall be between them both.” None of the elect Angels, could be a Priest of that covenant; for they are finite creatures: none of the sons of Adam, could be qualified to support that character; for they are not only finite, but sinful creatures; and “such an High Priest became us, as was holy, harmless, undefiled, and separate from sinners.” Christ himself, then, was the only one, who was qualified to support that high and endearing character. For

2. The sin of his spiritual seed, could not be taken away, but by a sacrifice of infinite value, which, they themselves could not afford to offer, was necessary, that a covenant of grace for guilty sinners, should be “a covenant by sacrifice”, a covenant written with blood; for “without shedding of blood, is no remission.” The covenant, therefore, with Abraham of old, was made with the solemnity of a typical sacrifice; in order that, he might know it to be a covenant of reconciliation, in which, a righteous God, was not to manifest his mercy to sinners, but in a manner fully consistent with the honour of his glorious justice. Such a sacrifice as that, however, was infinitely below the requisite value: it could not take away sin.

But the Lord Jesus, called to be a Priest, gave himself, “an offering and a sacrifice to God,” for confirming the covenant: and that inestimably precious sacrifice, was “for a sweet smelling savour” or, according to the style of the Old Testament, “for a savour of rest.” The persons whom he represented, being sinners, were corrupt and abominable, in the sight of the holy Lord God; who smelled, as it were, a savour of disquiet, from them and their performances. “They were a smoke in his nose, a fire that burneth all the day.” Their disobedience stirred up his avenging justice, his tremendous fury. But, the sacrifice of Christ offered in the room of elect sinners, sent forth such a sweet smelling savour to God, as completely overcame the offensive savour, arising from their sin; and gave his avenging justice and wrath, the calmest and profoundest rest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 101-03.</span></figcaption>

<blockquote><p>All they which are the sons of the promise are the seed of Abraham or the sons of God: but Isaac is a son of promise and not Ismael: therefore Isaac is the seed of Abraham and heir of the blessing, and not Ismael. The proposition is in the 8. Verse [of Romans 9], the assumption in the 9. vers. the conclusion in the 7. verse. Here mark, I. how he makes a double seed, one according to the flesh, the other spiritual: and two kind of sons, one of the flesh, the other son of the promise or the son of God: for he puts the one for the other. II. that the distinction between Isaac and Ismael, whereby one is in the covenant of grace, the other not; stands not in their foreseen saith and unbelief, and the fruits of them: but in the purpose and will of God itself.

For Isaac is called the child of promise, because by the virtue of it he was born, and believed, and was adopted the child of God, and made heir of the covenant given to Abraham: and therefore consequently the right of adoption befell him by the mere good pleasure of God, which is the first cause of our salvation, without respect of any thing in the person of Isaac. For what God by his promise brings to pass in time, that he most freely decreed before all times.

Now considering the Jews might say that Ismael was rejected, because he was borne of the hand-maid Hagar, whereas they, for their parts descend of Abraham and Sarai; by Isaac the lawful son, Paul adds a third example of the distinction between man and man out of the family of Isaac, in which Jacob was a true son and heir of the promise, and Esau was not. Now the distinction of these two persons is propounded in the 10. vers. and confirmed verse 11, 12, 13. in which are set down three things: I. the time of this distinction, yer the children were borne, and therefore when they had neither done good nor evil. And this circumstance is noted, to show, that God was not moved by any persuasion or preconsideration of Jacob’s godliness and Esau’s profaneness to prefer the one before the other.

II. the end why the distinction was made at this time and not afterward when they were born is, that the purpose of God which is according to his election might remain sure, not of works but by him that calleth: that is, that by this means it might appear, that when God receives any man into the covenant of eternal life, it proceeds not of any dignity in the man whom God calleth, but from his mercy and alone good pleasure, that his decree of saving the elect might remain firm and sure forever.

Hence it is manifest that there is an unchangeable decree of election of some men (for he that takes all and accepts none can not be said to choose) to salvation, depending upon the alone will of God; and therefore necessarily by the law of contraries, there is an opposite decree of reprobation: for in that God ordaineth some to eternal salvation, he testifies thereby, that his purpose is to pass by some without shewing of mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), pp 453-54.</span></figcaption>

v>
</figure><figure class="quote" id="q-34d0605ec9" data-kw="">
<blockquote><p>Conditions in contracts or covenant, we observe, are of two kinds, which I think good to distinguish by names, though perhaps less proper: some are precedent, others consequent. [1] I call those precedent which cause the contract, ex formula, do ut des [‘according to the formula: I give that you may give’]; as when a man sells land for a certain sum of money. So in contracting matrimony, there is a mutual donation of bodies. Such conditions as these do not only, by the defect of them, destroy (or rescind) the contract, but also do constitute (or lay) the foundation of it, and, as I may say, the essence. [2] But the consequent are added to the precedent as depending on them. They are truly mutual between both parties, but they oblige but one party only; so that because of them the other is bound to do no more (or is no further obliged). As if one, upon the giving or selling of land, do impose an annual pension of money to be distributed to the poor. So daily in contracting marriages, the condition of a dowry is added. Now such kind of conditions as these are wont to make void the contract by their absence, but yet not to effect the contract; yea, unless the sale were already full and perfect, there would be no yearly pension (or payment) of money; and before this can be, it is requisite that the buyer have not only the right of propriety, but also that he have taken possession of the land; that is, that the seller have performed his part. Thus the Law of Works exacts the fulfilling of the Law as the antecedent condition, without which not only cannot man have possession of life-eternal, but not so much as right to life-eternal. But in this sense of a condition, the Law of Faith admits not works, but only in the other, that is, that by virtue of the life already given because of faith, works should be necessary, so that he that performs (or exhibits) no works should lose (or fall from) all that right which he had, or seemed to have, by external vocation; though otherwise works are not the cause of giving life.</p></blockquote>

</figure><figure class="quote" id="q-645ce6a9aa" data-kw="">
<blockquote><p>But the Lord is not slack, or, delays not. He checks extreme and unreasonable haste by another reason, that is, that the Lord defers his coming that he might invite all mankind to repentance. For our minds are always prurient, and a doubt often creeps in, why he does not come sooner. But when we hear that the Lord, in delaying, shews a concern for our salvation, and that he defers the time because he has a care for us, there is no reason why we should any longer complain of tardiness. He is tardy who allows an occasion to pass by through slothfulness: there is nothing like this in God, who in the best manner regulates time to promote our salvation. And as to the duration of the whole world, we must think exactly the same as of the life of every individual; for God by prolonging time to each, sustains him that he may repent. In the like manner he does not hasten the end of the world, in order to give to all time to repent.

This is a very necessary admonition, so that we may learn to employ time aright, as we shall otherwise suffer a just punishment for our idleness.

Not willing that any should perish. So wonderful is his love towards mankind, that he would have them all to be saved, and is of his own self prepared to bestow salvation on the lost. But the order is to be noticed, that God is ready to receive all to repentance, so that none may perish; for in these words the way and manner of obtaining salvation is pointed out. Every one of us, therefore, who is desirous of salvation, must learn to enter in by this way.

But it may be asked, If God wishes none to perish, why is it that so many do perish? To this my answer is, that no mention is here made of the hidden purpose of God, according to which the reprobate are doomed to their own ruin, but only of his will as made known to us in the gospel. For God there stretches forth his hand without a difference to all, but lays hold only of those, to lead them to himself, whom he has chosen before the foundation of the world.

But as the verb χωρὢσαι is often taken passively by the Greeks, no less suitable to this passage is the verb which I have put in the margin, that God would have all, who had been before wandering and scattered, to be gathered or come together to repentance.</p></blockquote>

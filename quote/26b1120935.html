<main class="wrap"><figure class="quote" id="q-26b1120935" data-kw="">
<blockquote><p>For such persons are not recalled by Disputations, Discourses, or Human Reasonings. That they may be healed and converted, God himself must speak, must scourge, and terrify them, with his revengeful Judgements. The sin of such Persons is like that of Sodom and Gomorrah, viz, Pride, Fulness of Bread, and Abundance of Idleness. (Ezech. xvi. 49.) They most especially are troubled with this Disease, who live in this World, according to their own desires, who abound with the Goods of this present World, who are overwhelmed with the Wealth, Honours, Sweets, and Pleasures of this Life: For the turning away of the Simple shall slay them, and the Prosperity of Fools shall destroy them; Prov. i. 32.

Whilst they enjoy this Prosperity, and have their ease and quiet, they avert their thoughts from God; the Remembrance of whom would but make them sad, and would much trouble their Repose, since they cannot promise to themselves any good from him, who loveth Virtue, Justice, and Holiness, which in no ways is consistent with that kind of Life, which they have chosen, to pass it in Pleasure, Delicateness, and Effeminacy.

Then do they stop their Ears, as the Serpent against the Charms of the Charmer, they leave off to be wise, and to do good; therefore they are not capable of receiving Instruction, and they would be very angry to acknowledge their Error; because, if so, they must be bound to amend their Lives, which is that they will not do, finding it wonderfully sweet and delicious.

But when they are met with by Death, and that they be a grappling with her, when she doth over-power them, or when by some notorious, wonderful, and exemplary Judgement of God, they are fallen from their Greatness, Wealth, Goods, &amp; Pleasures, and are reduced to the State of Job, or the Prodigal Son in the Gospel: then sometimes they may be healed, then their affrighted Conscience doth awake them from their deep slumber; then at sometimes they open their eyes to the acknowledgement, and detestation of their Error. Without this, they are like those, who, being sick of a Lethargy, may be pinched, spoken to, &amp;c. yet never budge, nor will not awake; because they take more pleasure in their sleep, and drowsiness, which at last lays them in their Grave.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-cappel.html">Louis Cappel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The hinge of faith and religion: or, a proof of the deity against atheists and profane persons, by reason, and the testimony of Holy Scripture: the divinity of which is demonstrated</cite>, trans. Philip Marinel (London: Thomas Dring, 1660), preface.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d375e15221" data-kw="">
<blockquote><p>Here is Movens. The party longing desiring to depart; and that is Paul a chosen vessel, a faithful servant of God a living member of Christ. None can truly desire to be dissolved but he that is sure to be saved. No man willingly leaveth his present habitation, but he that is assured of a better dwelling. No wise man willingly to cast of his present garment, but he that hath another, a better to put on: No man can be upon right grounds willing to be dissolved, but only that man who is truly sanctified: he who is not thoroughly interested in Christ, cannot willingly leave all for Christ:

Eleazar Abraham’s servant, put a jewel upon Rebecca’s face, and bracelets upon her hands, and gave her jewels of silver and jewels of gold and raiment, and then she was willing to go with him, willing to leave all, and enjoy Isaac for her husband. That soul alone which Christ beautifieth with the saving gifts of his spirit, the love tokens of Christ, better gifts then jewels of silver, and gold. Is the soul, the only soul, that can forsake the dearest things of this life, that can readily leave its habitation in this mortal flesh, and take up its everlasting abode with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-grosse.html">Alexander Grosse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Christian’s choice. Or A sermon preached at the funeral of Mr John Cavvs one of the magistrates of the famous corporation of Plymouth. March the 29. Anno Dom. 1645</cite>, (London: John Bartlet, 1645), p. 4.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-31b20949f7" data-kw="">
<blockquote><p>The Reformed churches observe the same order in admitting to the Lord’s table, either the children of Christians, or strangers from other parts: they admit them not but with prayers and after due examination of their knowledge, and personal profession of the known truth. The Church of Scotland at the first reformation ordained that children should be examined for the first time at the ninth year of their age; for the second, at the twelfth, for the third at the fourteenth, and since has practiced continual examination in the catechetical doctrine with prayers reiterate, for their growth in knowledge and sanctification; and without sufficient trial they were not admitted to the Lord’s Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, … (1619), p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>For we do not see it necessary to posit, or even possible to posit, actual faith in those infants (which some conjecture, others strongly assert), unless it is solidly proved from Scripture. For that extraordinary and miraculous motion of John the Baptist, Lk. 1:44, seems to contribute nothing to this matter. Since from a miracle no consequence is valid to the ordinary force, causality, disposition, act, or effect of any thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-a9e9bee965" data-kw="">
<blockquote><p>2. There is no such moral necessity of the sacraments as there is of the ministry of the Word, and consequently of some use of the keys where a scandalous person may infect the Lord’s flock. For where vision ceases the people perish, but it is never said, where baptism ceases the people perish; and therefore uncalled ministers in case of necessity, without ordination or calling from a presbytery, may preach and take on them the holy ministry and exercise power of jurisdiction, because the necessity of the souls of a congregation in a remote island requires so, but I hope no necessity in any [of] the most extraordinary case requires that a midwife may baptize, or that a private man remaining a private man may celebrate the Lord’s Supper to the Church without any calling from the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, pp. 454-455</span></figcaption>

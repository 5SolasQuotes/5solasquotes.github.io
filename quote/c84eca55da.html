<blockquote><p>I had read the writings of those excellent men of God against Brownists, or Separation heretofore, who then were the Non-Conformists that did suffer so much for Reformation: He that will read what is written by Mr. John Paget, Mr. William Bradshaw, Mr. Gifford, Mr. Hildersham, Mr. Brightman, Mr. John Ball, Mr. Rathband, Dr. Ames, First and Second Manuduction, etc. and lately Mr. John Tombes, the pillar of the Anabaptists, and for [occasional] hearing by Mr. Philip Nye may see enough for just satisfaction, especially in Mr. Ball’s Trial of Separation.</p></blockquote>

<blockquote><p>2. The greatest charge… appears [to be] that the Church of Scotland does not press the renewing of the Covenants, National [1638] and Solemn League [1643]. But there are several things as to this that they take no notice of, which, if noticed, might, in a great measure, allay their clamour: (1) That the National Covenant is, indeed, a confession of our faith, very praiseworthy in its time, but I conceive, for variety and perspicuity, not to be compared with the Westminster Confession, which we own and press. (2) That the Westminster Confession is ratified in King William’s Parliament, and the other [the National Covenant] was approven [implicitly, not explicitly] by the last Parliament of King Charles the Second [in 1681], where I think [James] the Duke of York presided, and included [it] in the bosom of the Test [for civil office] as a point thereof; which honour I believe that Parliament would not have given to the Westminster Confession. (3) As to the Solemn League, they would do well to consider, more seriously, what that answer does overly take notice of, p. 13, near the beginning, viz. that the [General] Assembly [of the Church of Scotland] appoints its being subscribed by all the true professors of the Reformed religion, only after its reception and approbation in the kingdom of England. But they should have considered further, that the Assembly, for aught I can find, by their act, do not appoint even that it be subscribed, only they recommend to the honorable Convention of Estates, that, being examined and approved by them, it may be sent to England, to be received and approven there, that after that it may be, with all religious solemnity, sworn, etc. (4) They would consider whether it be practicable to get England to consent to renew that Covenant, and if it be, whether they themselves will undertake to gain their consent. (5.) Whether we can renew it without their consent, and whether, in that case, it would be a league and covenant. (6) Whether that league and covenant obliges us by open force to constrain them to extirpate prelacy, when they are not willing and do not consent to it. (7) Whether it be in our power to do it. And, (8) Whether it were lawful for us to do it if it were in our power; and whether ever our blessed Lord gave any such commandment to his followers by the power of the sword to reform nations, as it is said Mahomet gave to his followers, and Romish antichrist has too much practiced. Another heavy charge against the Church of Scotland, on which these people ground their schism and separation, is, that the breaches of these covenants, and other such sins of public defection, are not, or have not been, publicly acknowledged. But this is very uncharitable, for, 1690, there was a very full acknowledgment and enumeration of those sins, and of defection in the causes of the fast emitted by that Assembly… For breach of covenant is really among the causes of that fast [in 1706], seeing the act expressly requires ministers both to warn of and confess the national sins enumerated in causes of fast 1690, 1700, and 1701, in all which breach of covenant is very particularly acknowledged… And now, if that be a sufficient ground of separation from the Church of Scotland, I could appeal to all the Protestant Churches in Europe… Another charge against mhiisters, wherefore they are to be separated from, is because our civil rulers have only asserted as the ground of their re-establishing Presbytery, that it was more agreeable to the people’s inclinations, etc.; ergo [therefore], ministers must be disowned. But have any ministers ever asserted that this is the only ground; have they not, do they not plead its divine right? Yea, if I mistake not, even the Parliament, in one of the acts, have asserted its being agreeable to and founded upon the Word of God. But I am weary of these things, and therefore will not go furder, nor meddle with that which seems to be also a great prejudice against ministers, their subjecting to the Government and our present Queen, who is of the communion of the Church of England. But, would ever our worthy Reformers, of whom they so much boast, have refused subjection to King James the Sixth and his son King Charles [I], because of that communion? Would they not have been well satisfied, if they had but suffered the Church of Scotland to enjoy her privileges? But I must now forbear, and remember I am not writing an answer to that paper, nor do I design it… I had forgot to signify, that though the author of the Modest Reply greatly quarrels [with] our Church constitution, yet, from what appears through his discourse, there is too much ground to apprehend that the great eye-sore is the civil constitution, and hinc illae lacrymae [hence those tears]!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 39, ‘Vindication of the Church of Scotland in Answer to a Cameronian Pamphlet’</cite>, (1710) in The Correspondence of the Rev. Robert Wodrow, 3 vols. (Edinburgh: Wodrow Society, 1842), vol. 1, pp. 122-27</span></figcaption>

<blockquote><p>but their hearts are much estranged from those from whom they separate; for religious ties, being once broken, are hardly made up again. Civil ruptures are not carried on with such vehemency, and are sooner closed again; But religion, being and ligament, when it is once violated, the breach is the more irreconcilable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“but their hearts are much estranged from those from whom they separate; for religious ties, being once broken, are hardly made up again. Civil ruptures are not carried on with such vehemency, and are sooner closed again; But religion, being and ligament, when it is once violated, the breach is the more irreconcilable.”

<blockquote><p>It is observed by the learned and reverend [Edward] Stillingfleet, Irenic, p. 108, that the word ‘schism’ (though it sound harsh, it being often taken in an ill sense) as it imports a separation from a Church, is not a thing intrinsically evil in itself, but is capable of the differences of good and evil, according to the ground, reasons, ends, and circumstances inducing to such a separation; the withdrawing from a society is but the materiality of schism; the formality of it must be fetched from the grounds on which that is built. He cites also another author, observing that heresy and schism as they are commonly used, are two theological scarecrows with which they who would uphold a party in religion use to fright away such, as making enquiry into it, are ready to relinquish and oppose it, if it appear either erroneous or suspicious. §2…. it is needful to premise a few things: 1. Schism is a breach of unity; and therefore, there can be no schism where there ought to be no unity; yea, where there need be no unity, or where there can be no unity. Wherefore that we may understand what schism is, it is needful to consider what unity should, and must be among Churches, and among Christians. There are several sorts of unity, that we cannot have with all Churches, as local communion: some that we need not have, as identity of rites: some that we ought not to have with some Churches, as communion in false doctrine, or impure worship. 2. The unity of the Church may be considered in all the notions in which the Church is considered, or in all the sorts of Churches: In the catholic Church, visible and invisible, in all the combinations of Churches among themselves, national, provincial, classical and in particular congregations. It is an undue notion of unity and schism that Independents have, that they are only to be considered as in a particular congregation. 3. Unity consists in joining with and cleaving to the Church in all these acts of communions with her that the Lord has made our duty, so that it is not only schism to depart from a Church (without just cause) that we have been joined to, but not to join with some society of Christians when it is possible for us and when we can do it without sin; the former may be called a positive, this a negative separation. 4. Schism may be also called positive or negative in another sense; the former [negative] when a party in a Church, does not join with the Church, yet sets up no Church in a separated way from that Church whereof they were members: the latter [positive], when they set up such a distinct society; there may be just causes for both: The first, when I cannot join with the congregation I belong to because of some corruption that I must partake of if I join, but I partake with some other more pure society; The second, when a body of people cannot join without sin, nor can they have the occasion of a society where they might join; they must either live without ordinances or set up another religious society; on this ground Protestants did thus separate from the Popish Churches. 5. There may be a partial separation when one ordinance is so corrupted that we cannot join in it, and yet can join with the Church in all other acts of communion: and a total separation, when either the Church will not suffer us to join with her in any part of her service unless we join in all; or she is so corrupt that we can join with her in nothing that is religous. The former by most wise and sober men is not reckoned such a schism as that any are to be blamed as schismatics on that account; but the author I now debate with aggravates that even to a very high degree of schism, as also do many of his partizans, driving many consciencious and good men from them for the sake of some usages which themselves count indifferent and the others apprehend to be unlawful. 6. The differences in opinion about religious matters, especially when managed with heat and animosities may be called schism, according to the import of the word; yet in the usual ecclesiastical notion of schism, they are not to be so reputed unless some kind of separation or shuning the ordinary Church communion one with another follow upon them. Diversity of opinion and of affection are sinful evils, but it is diversity of religious practice, following on these, that makes Church-schism. 7. When a separation falls out in a Church, the guilt of it does certainly lie on the one side or the other, and often neither side is wholly innocent. They who have cause to separate may manage their good cause by evil methods and in a way that is not wholly commendable: now to know on which side the blame of the schism lies, we must not always conclude that they are in the fault: 1. Who are the fewer number; otherwise most reformations of the Church were sinful: Nor, 2. Who separate from the Church rulers, themselves being in possession of Church authority: for this should condemn our Reformation from Popery; Nor, 3. Who separate from that party that has the countenance of civil authority, and has the law on its side; not only because it is the Gospel, not the law of the land, that is the rule of our religion, and Church practice, but also because that is variable, and by that rule, they who were the sound party one year, may be schismatics the other; without any change in their principles or practice, which is absurd. Wherefore the blame of schism, in that case, lies only on them who has the wrong side of that controverted matter about which they divide; or who, though their opinion be better than that of the opposite party, yet depart from the communion of their brethren without sufficient cause, everything that we may justly blame, not being sufficient for making a rent in the Church. Hence it plainly follows that men’s assuming to themselves the name of the Church is not sufficient ground for them to brand such as schismatics who depart from their communion: Where truth and Gospel purity is, there is the Church, and they who have most of these are the soundest Church. §3. Having laid this foundation for discerning what is truly schism, and where the blame of it lies: I shall next enquire into the opinion of the ancient Church about schism:</p></blockquote>

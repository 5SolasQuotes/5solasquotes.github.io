<blockquote><p>Schism has ever proven exceeding hurtful to the Church, and has been an inlet and nursery to the greatest errors: It is most pressingly condemned in the Scriptures, even with as great weight as corrupt doctrine and heresy are; and it is attributed to that same original, to wit, the flesh, with witchcraft, idolatry, heresy, etc. Gal. 5:20. It has also proven most dangerous to those who have been engaged therein, and often has been a snare to bring on spiritual desertion, deadness of spirit, security, self-confidence, or some other spiritual evils of that kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>3. Every man (especially experienced Christians) have more sense and knowledge of what is profitable and congruous to them than standers-by have, how learned soever: As ignorance makes a few, short, plain, oft repeated words in a familiar style more profitable to low-bred persons than an accurate learned discourse would be, so men’s several tempers and vices makes that matter and manner of preaching profitable to them which to others seems otherwise; And as a nice lady must not tie her family of laboring persons to the matter and measure of her diet, nor revile them as gluttons or fools if they like it not. No more must learned men confine plain people to wordy orations (whether learned or pedantic) and say, ‘This is best for them’. Much less must they silence causlessly such teachers as truly profit them, or tie them to homilies or liturgies only and say, ‘Here is as much as is necessary to salvation.’ Nor is it any schism in the people if they refuse to be so confined by them and denied such helps to their salvation as God has sent them and made their due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6</cite>, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-93c99b2fc5" data-kw="">
<blockquote><p>When men may unite without personal guilt or accession to the defects or guilt of others, there may and ought to be union, even though there be failings and defects of several kinds in a Church; because men are to reckon not for other men’s carriages, but their own: And no such Church-state is to be expected as is free of defects. Beside, can it warrand a man to abstain from his duty because others do not theirs, while as there is no sinful impediment lying in the way of his access thereto?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-19848667e1" data-kw="">
<blockquote><p>3. Nor does it belong to the essence of Presbyterial Government, that all members of this Church, and inferior judicatures, should so submit to the superior respective judicatures, that if they be grieved with the sentence, they ought to acquiesce thereunto, and not to contra-act, but only appeal, until there shall be a general assembly to determine the matter. This never was, and I trust, nor shall ever be their mind who are for presbyterial government; nor do our brethren justly father it upon the general Assembly, 1648, Session 30. For our Church acknowledges no subjection nor subordination of inferior judicatures unto superiors, but in the Lord, and so to submit to any sentence, and to forbear a duty of preaching the Gospel, praying, visiting, exhorting, catechizing pastorally in families, to abstain from the Lord’s Supper, and from acts of due censure necessary for the flock upon the known unjust sentence of a synod, until a general Assembly (which possibly cannot be convened in an age to determine) is to: 1. Obey men unjustly forbidding a called minister of Christ to preach in season, and out of season, rather than God; for they unjustly forbid, and the Lord justly commands; therefore the called minister must act and contra-act to their unjust sentence, and not forbear for an hour, as the Scripture clears, 2 Tim. 4:1-2; Acts 20:17-20; 1 Cor. 9:16; Isa. 58:1; Jer. 1:17; Eze. 2:3-5 &amp; 3:10,17; Acts 5:28-29; and so this is unjust. 2. It is to make synods and ecclesiastical judicatures lords of our faith, which the Reformed Churches detest in popish councils; for all men and councils most lawful can challenge only limited obedience and submission in the Lord to their determinations, if they speak and command ‘according to the Law and the Testimony’, Isa. 8:20, ‘otherwise there is no sight in them.’ And so it is popish. 3. We conceive in performing acts of that government which Christ owns in his Word, we do not sin; for no authority of a judicature can make that to be the word of God, and obedience to God, which was not, as to the matter, obedience to God before that authority, nor on the contrary. Now to abstain from preaching, praying, eating and drinking as the Lord’s Supper in a called minister, and in a visible professor, duly called and fitted, is sin; then cannot the authority of the Church, far less their known unjust sentence make it lawful. 4. Suppose the general Assembly should ratify and confirm the unjust sentence of the inferior judicature, or annul their just sentence, the people of God are not obliged to stand to either the one or the other. So we disown the point which our Brethren delivered to us in their papers for union sought by us, as nothing belonging to the essence of presbyterial government, but reject it as unsound, tyrannical and popish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker (1658), Epistle to the Reader</cite></span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>of the Church of Scotland, contra the Seceders’ Covenant, &amp; that as a Term of Communion, 1744</cite></span></figcaption>

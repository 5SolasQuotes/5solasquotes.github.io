<main class="wrap"><figure class="quote" id="q-37de2859da" data-kw="">
<blockquote><p>Such as is the substance of everything, such also is the manner of being: but there is but one substance of Christ’s body: therefore but one manner of being, which is proper to bodies; that is, circumscriptive: not definitive, which is proper to the spirits, nor repletive, which is proper unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places… (London, 1610), 2nd bk., ‘Of the Person of Christ’</cite>, p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ba75fe427" data-kw="">
<blockquote><p>But this communication of the subsistence of the second Person unto the humanity is not (as [Robert] Baron,Philosophia. Theol. Ancil., Article 12, and after him Mr. Barlow in the forementioned place, very excellently show) by way of real inhesion, or denomination, but only by way of sustentation: And this is no advantage unto the Lutherans’ communication of divine properties. Look as when a subject does communicate itself unto its accidents by way of support, it does not hereupon follow that it inheres in them, or does denominate them. So though the person of the Son do assume, receive, and sustain the humanity of Christ, yet it does not hereupon follow that the subsistence of the Son is formally in the manhood, or that the manhood is a person, as is proved at large by those two mentioned authors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity… (Oxford, 1656) Jeanes (1611-1662) was an English, clergyman and puritan minister.</cite>, p. 33</span></figcaption>

</figure><figure class="quote" id="q-de9c7888de" data-kw="">
<blockquote><p>By the Understanding, Will, and Affection, the Soul doth (as it were) enter into God, and God into the Soul; whence followeth (as it were) a mutual in-being of one in another, and an intimate vital union between God and the Soul. Either the vision, fruition, and love of God, is Blessednesse, or there is no Blessednesse; God is not God, Heaven is not Heaven; the Creature, according to the best, namely, the Gospel-dispensation of God, is capable of no more, needs no more, can have no more; God in Christ doth no more for Man, man needs no more from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, London, 1654, ch. 15, p. 335</span></figcaption>

<main class="wrap"><figure class="quote" id="q-741ec88ede" data-kw="">
<blockquote><p>No one presumes to teach an art till he has first, with intent meditation, learned it. What rashness is it, then, for the unskilful to assume pastoral authority, since the government of souls is the art of arts! For who can be ignorant that the sores of the thoughts of men are more occult than the sores of the bowels? And yet how often do men who have no knowledge whatever of spiritual precepts fearlessly profess themselves physicians of the heart, though those who are ignorant of the effect of drugs blush to appear as physicians of the flesh!</p></blockquote>

<blockquote><p>…for in the ordinary course, nature proceeds in this manner: first, there is the mass of blood or seed received in the womb, but there is no parts of a body framed at the first: after a certain number of weeks, nature forms that substance into the parts of the body distinctly, but yet it is without life: then is the soul infused, when the body is organical, and so it is quickened and a true man; it is not before a man, but embryo as they call it… Now in the course of nature: first, that which is material is formed, as it were the house of the soul, and then the soul is infused, not only as the guest of it, but as the form and life of it:</p></blockquote>

<blockquote><p>4. Personal power in man is the first; family power is the next; city and kingdom power supposes these and cannot destroy them. Hence subjects that are not mere slaves stand up to plead for their personal and domestic property, liberty and power, if my money, and limbs and life be not at the patron’s or the prince’s will, much less my soul. He is trusted with my estate and life; but I am first and more trusted with them. He may keep out ill physicians from the land, and encourage the good, but he has no power to tie me to an ill physician, nor to an ill diet, nor to ill servants, etc. The choice of these belongs to myself… I will not believe that the patron loves me and all the parish better than we love ourselves.</p></blockquote>

</figure><figure class="quote" id="q-ea3a1566e5" data-kw="">
<blockquote><p>In this sense God as Creator, as revealed in the light of nature, has established civil government among men from the beginning, and among all peoples and nations, of all ages and generations. But in the development of the plan of redemption the God-man as mediatorial King has assumed the government of the universe. Matt. xxviii. 18; Phil. ii. 9–11; Eph. i. 17–23.

As the universe constitutes one physical and moral system, it was necessary that his headship as Mediator should extend to the whole and to every department thereof, in order that all things should work together for good to his people and for his glory, that all his enemies should be subdued and finally judged and punished, and that all creatures should worship him, as his Father had determined. Rom. viii. 28; 1 Cor. xv. 25; Heb. x. 13; i. 6; Rev. v. 9–13.

Hence the present providential Governor of the physical universe and “Ruler among the nations” is Jesus of Nazareth, the King of the Jews, to whose will all laws should be conformed, and whom all nations and all rulers of men should acknowledge and serve. “He hath on his vesture and on his thigh a name written, KING OF KINGS, AND LORD OF LORDS. Rev. xix. 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ed. William H. Goold (British edn, London: T. Nelson and Sons, 1870), pp 294-95.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

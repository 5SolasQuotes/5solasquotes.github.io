<main class="wrap"><figure class="quote" id="q-d562dd76f8" data-kw="">
<blockquote><p>Whether we can Resist the Grace of God, or No? But now arises an other doubt as touching our nature as it is now fallen and corrupt, whether it can resist the grace of God and his Spirit being present, or no? (There are sundry degrees of grace of God) I think we must consider that there are, as it were, sundry degrees of the help or grace of God: for his might and abundance is sometimes so great that He wholly bows the will of man and does not only counsel, but also persuade. And when it so comes to pass, we cannot depart from the right way, but we are of God’s side and obey his sentence. Wherefore it was said unto Paul: “It is hard for thee to kick against the pricks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Judges</cite>, ch. 9, pp. 167-68</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-df7761f9a2" data-kw="">
<blockquote><p>The bestowment of common grace upon the non-elect shows that non-election does not exclude from the kingdom of heaven by Divine efficiency, because common grace is not only an invitation to believe and repent, but an actual help towards it; and a help that is nullified solely by the resistance of the non-elect, and not by anything in the nature of common grace, or by any preventive action of God. The fault of the failure of common grace to save the sinner, is chargeable to the sinner alone; and he has no right to plead a fault of his own as the reason why he is entitled to special grace. It is absurd for him to contend that God has no right to refuse him regenerating grace, because he has defeated the Divine mercy in common grace. The true way out of the difficulty for the sinner is, not to demand regenerating grace as a debt by denying that God has the right to withhold it, but to confess the sinful abuse and frustration of common grace, and to cry with the leper: ‘Lord, if thou wilt, thou canst make me clean.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 5, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-205b15d455" data-kw="">

</figure><figure class="quote" id="q-afc27d8b3a" data-kw="">
<blockquote><p>II. Secondly, there is a conviction of conscience that brings with it some overpowering, some more, some less, some for one end, some for another. I say, some overpowering. In that dispute about the resistibility or irresistibility of grace, as far as I can see into the dispute, this distinction might be useful and advantageous toward the determining of it, viz. to consider what the Spirit of God does to the heart by way of trying it, and what it does with intent and resolution to overpower it. The former part of the distinction you have in Ex. 20:20, ‘Fear not, for the Lord is come to prove,’ or try, ‘you.’ The latter in Isa. 26:11, ‘They will not see, but they shall see and be ashamed.’ The former in Rev. 3:17, Christ stands at the door and knocks, to try whether He shall be entertained. The latter in Eze. 22:14, ‘How can thy heart endure and thy hands be strong in the day that I shall deal with thee, when I break in resolved to overpower thee?’ As in that blasted conviction I spake of before, there was a trying but no overpowering, so there is some overpowering conviction also, that is but for trial…. So that was a very overpowering conviction upon the conscience of Herod, that made him reverence John Baptist, and to hear him gladly and to do many things according to his doctrine; but it was far from attaining the utmost end of conviction: it was only by way of trial, whether he would come up to the utmost end or no. This conviction neither they in the text, nor Herod could resist, for conviction brake in, whether they would or no; but the ultimate operation of conviction they resisted; because in this conviction the Spirit of God did only try them, not resolved to overpower them to the utmost fruit and effect of conviction… For the first, it is well known how God tried the hearts and consciences of Pharaoh and the Egyptians, by Moses’ words and miracles, and how again and again He in some degree did overpower them; but still they resisted and came not up to the proper and ultimate effect of conviction, to own and to do their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of the Reverend &amp; Learned John Lightfoot</cite>, … (London: Scot, 1684), ‘A Sermon preached at Hertford Assize, March 17, 1664’, on Jn. 8:9, pp. 1083-84</span></figcaption>

<blockquote><p>In withstanding the doctrinal assaults of Infidel opposers, the Sabbath has only resisted one of its double dangers. The more fearful hazard of obliteration through the covetousness of men, it must perpetually incur. The mountain crag which has bared its head to the storms of forty centuries, may yet be undermined at its base, and sweeping downward with the avalanche, spread ruin in its path.

So the Sabbath which, from the birth of time, has lifted its testimonial spire, pointing to the heavens amidst the bowlings of Atheism, may yet be washed from its base, by the unchecked currents of worldliness and vanity. We allege that this danger increases with the advance of science, and the progress of art. Occasional breaches of the Sabbatic rest, may always be expected to occur; but the very circumstance, that they are exceptional and not stated, carries along with them a check upon the evil. The very departure from one’s ordinary policy will suggest an inquiry as to its propriety.

The man is immediately sisted at the bar of his own conscience, compelled either to repudiate the settled policy of his life in keeping the Lord’s day, or else to justify this occasional violation of its sacred rest. In the same way, the apparent inconsistency between the two, brings up the whole subject for adjudication before the Christian public, who are compelled to render a decision. Thus the usual observance of the day will be a standing protest against its occasional breaches. But in those employments where there is a foreseen and fore-pledged violation of the Sabbath, in which the din of labour is unremittingly heard, it may easily fall into desuetude, and, in course of years, be forgotten.

In the march of civilization, and in the consequent multiplication of the mechanical arts, those occupations become more and more numerous. It would perhaps astonish those, who have paid little attention to this matter, to know how large the catalogue of such is already swelled. In the blowing of glass, the smelting of iron, the boiling of sugar, the printing of daily newspapers, the publication of legislative records, the postal arrangements of the country, the plying of steam vessels between contiguous ports, the working of rail-roads, and the operation of the telegraph, we have sufficient examples of a large class of employments, in which, upon the plea of a coercive necessity, the Sabbath is habitually violated.

The momentous question now arises, how shall the Christian world aet in regard to these occupations? Can any broad principles be stated, which shall guide Christian men in their individual conduct, and direct the Church in the exercise of salutary discipline? God’s reservation of the Sabbath to his own use is so clear, and his propriety in it so indefeasible, that the whole question must be remitted to his decision. According to the Scriptures, there are but two grounds upon which the Sabbath can be vacated, either the law of necessity, or the plea of mercy. These pursuits will scarcely be covered by the mantle of the latter, nor be successfully advocated upon the authority of the former. Grant, for example, that by the intermission of the Sabbath, the furnaces of glass and iron cool down to such a temperature, that an entire day will be consumed in heating them again to the working point; nothing more is proved than the disadvantage arising from the loss of one-sixth of time, during which labour and capital are unproductive.

All kinds of business lie under peculiar disadvantages, of one kind or another, which are taken into account in estimating the value of their productions. If a Christian man, labouring productively five-sixths of his time, cannot compete with those who labour seven-sixths, there is perhaps no alternative but to exchange his calling for another, in which he may have less profits, and a sounder conscience. In other words, we uncover an important distinction, that to make out a sacrifice is not to prove a necessity.

We greatly fear that a large proportion of Sabbath breaking, especially on the part of professing Christians, is traceable to the neglect of this distinction. A man, for instance, is unexpectedly delayed upon a journey, perhaps almost within sight of his home—to tarry by the way will involve much inconvenience and discomfort, and perhaps pecuniary risk or loss—then add the anxieties he may feel about wife and children, and he is at once flattered into the belief of a stringent necessity upon him to violate God’s law.

Beloved brethren! How often must it be repeated, that a Christian profession, from first to last, involves sacrifices frequent and severe! Whoever assumes it, does in act and in form place himself on God’s altar, a whole burnt-offering. He is “bought with a price” and the vow is taken with awful solemnity, as in the court of Heaven to “glorify God in his body and his spirit, which are God’s.” And surely we are inattentive observers of Divine Providence, if we do not discover many circumstances in our life ordered expressly to test the sincerity and value of this profession.

We have offered all in sacrifice to God, our time and life and being, and when an emergency shall arrive, putting our religion to the proof, shall we plead against the claims of God upon His own day, the sacrifice involved in some partial loss of interest or comfort? Shall we not rather feel that God affords us a fit opportunity of practically renewing our covenant, and fulfilling our vows of self-consecration; and that ample compensation is e joyed in the privilege of bearing an honorable testimony in behalf of all religion, in the testimony which we bear for the Sabbath?</p></blockquote>

<blockquote><p>§45. 5. And for organs or other instruments of music in God’s worship, they being a help partly natural and partly artificial, to the exhilarating of the spirits for the praise of God, I know no argument to prove them simply unlawful, but what would prove a cup of wine unlawful, or the tune and meter, and melody of singing unlawful. But yet if any would abuse it, by turning God’s worship into carnal pomp, and levity, especially by such non-intelligible singing, or bleating as some of our choristers used, the common people would have very great reason to be weary of it as accidentally evil.</p></blockquote>

<blockquote><p>Although we acknowledge the necessity of good works against the Epicureans, we do not on this account confound the law and the gospel and interfere with gratuitous justification by faith alone. Good works are required not for living according to the law, but because we live by the gospel; not as the causes on account of which life is given to us, but as effects which testify that life has been given to us.</p></blockquote>

</figure><figure class="quote" id="q-267606c00b" data-kw="">
<blockquote><p>6. The Word is God’s mean to work supernatural effects, to convert the soul, Ps. 19:7, to work faith, Jn. 20:3, to edify, Acts 20:32, to save, Rom. 1:16. The obedience to God’s Word, brings peace, Ps. 119:165, comfort, v. 50; Gen. 49:18; Isa. 38:3. But ceremonies, being apt to stir up the dull mind, must be apt to remove natural dullness, which is a supernatural effect, and so to bring, peace, joy, comfort: Organs are now holden by the same right, that they were in Moses’ Law, then they must stir up supernatural joy: There must be peace and comfort in practicing them. Hear how this sounds: ‘This is my comfort, O Lord, in my affliction, that thy surplice, organs, and holy-days have quickened my dull heart.’ Now what comfort [is there], except comfort in the Scriptures? Rom. 15:4. Ceremonies be innocent of all Scriptures [have nothing of the Scriptures in them]. What joy (a proper fruit of the Kingdom of Heaven, Rom. 14:17) can be in sapless ceremonies? Yea, observe:

1. Who truly converted from Popery, who [is] inwardly humbled in soul, does not abhor ceremonies by the instinct of the new birth?

2. What slave of hell and profane person call not for ceremonies?

3. Who has peace in dying that ceremonies were their joy?

7. All lawful ordinances may by prayer be recommended to God for a blessed success as all the means of salvation, Ps. 119:18; Mt. 26:26; Acts 4:29-30.

2. We may thank God for a blessed success, which they have by the working of the spirit of Grace, 2 Cor. 2:24; 1 Cor. 1:4-5; 2 Thess. 1:2-3; Eph. 1:3.

3. We are to have heat of zeal against profaning of Word, sacraments, prayer, or other ordinances of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, p. 132</span></figcaption>

<blockquote><p>To worship God sometimes with those with whom we do not always is oft a duty and a special means to prevent, remove or greatly to lessen the sin of schism, and to promote that which is so desirable, catholic communion.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cab4783fca" data-kw="">
<blockquote><p>Apostles and members-dissolved are not fixed members of a single congregation, and yet members they must be of the visible, Church-catholic: sure it is no paradox, that the Apostles are such members, for they had right to all the seals in all congregations; Therefore, they must by this reason be members and no members: the like may be said of godly professors-sojourners [travellers], of these baptized by John Baptist, Mt. 3, by Peter, Acts 10, by Paul, Acts 16. For if we say that professors are only members of a particular congregation, then we confine a brother to be gained only to one congregation: ‘let all the rest perish: they are not my brethren.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, ... (1658), bk. 1, ch. 25; p. 159</span></figcaption>

</figure><figure class="quote" id="q-6cbd577fcb" data-kw="">
<blockquote><p>That all the members of the catholic Church should meet together to hear one sermon, to partake of one sacrament, etc. as it was possible once, when their number was but an 120, Acts 1, so they are bound still, but that the multitude makes it impossible. That the particular congregations should join together in the same specifical ordinances, and have officers over them alike, is certainly an institution of Jesus Christ, as well, as to make the same profession of faith, and hope. Indeed, that, being so numerous, they should have one officer over them all, and join to hear one sermon, or receive the same sacrament numerical (as he [Owen] speaks) is a ridiculous fancy; and not only false, but impossible. But I would gladly know a reason why 40 or more members of no particular church, but only of the catholic, meeting together, and having a minister among them, may not join together to worship God in prayer, preaching and partaking of the sacrament, as well as the members of several particular churches, and himself [Owen] among them, may do the same; as they do often at London and Oxford when he preaches, unless he will count those ordinances then and there administered no acts of instituted worship; And if he grant them to be worship, how can he deny [on his principles] that assembly to be a particular church, though it be not fixed nor gathered and united by any explicit covenant, or consent to live and die together [as congregationalists held]. I shall only note again, that herein he deserts his [congregationalist] friends in New England…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved Against Dr</cite>, [John] Owen… (London, 1657), ch. 5, pp. 89-90</span></figcaption>

</figure><figure class="quote" id="q-7304caa200" data-kw="">
<blockquote><p>7. When any member of any of the churches of their own way go from one church to another only as travelers or sojourners for the time, they are admitted to sacraments, only bringing with them letters of recommendation from their own church. Ans. to 32. q., p. 29. But when any such member comes from one of their churches to another to be admitted as a fixed member there, then he is not admitted (notwithstanding any letters of recommendation or any other testimonial or evidence whatsoever) without such a new examination as aforesaid, and as if he had never been examined nor admitted into church-society before. Ans. to 32. q. pp. 29-30; Ans. to 9. Pos., p. 62; Apology, p. 2, 7, 9, 35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers</cite>, … (London, 1644) Rathband was a Westminster divine., Ch. 3; p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-75d2a177d0" data-kw="">
<blockquote><p>Now not to be in membership of such a particular congregation is not a sin, nor a just ground of Paul’s estrangement of his ministerial power from them [as the congregationalists would have it], it may be caused by persecution when the flock are scattered by wolves.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-74c3c909a4" data-kw="">
<blockquote><p>Our divines, Bucer, Calvin, Bucanus, Tilenus, Beza, Virttut [Viret?], give consenting, and in some cases correcting, not judicial, power sure, but which is great enough, a negative consent for eschewing of a schism. And the professors of Leiden, Ursinus, Pareus, Junius, give the people a vote, a consent in excommunication, and this cannot exclude women who are offended when the whole Church is offended. The times of Ambrose did witness more pride in the clergy, who began to do all without the people. Chemnitz, Daneus, the Confession of Bohemia, of Helvetia, the Synod of Middleburgh, the Synod of Tylleburgh in Nassovia, anno 1582, teach that the whole Church with consent of all did excommunicate, but the judging authority is in the eldership.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 277</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6982e00e09" data-kw="">
<blockquote><p>Because bishop and presbyter are everywhere in Scripture taken for one and the same (so that the difference is only in the name, not in the thing—bishop, with regard to his office and function; presbyter, with regard to his age and dignity), the same characters and the same functions are ascribed to both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.21.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a> › <a href="../topics/church-government-and-the-ministry/forms-of-government/episcopal-presbyterian-congregational.html">Episcopal, presbyterian, congregational</a></span></div>
<div class="actions"><button class="copy" data-copy="“Because bishop and presbyter are everywhere in Scripture taken for one and the same (so that the difference is only in the name, not in the thing—bishop, with regard to his office and function; presbyter, with regard to his age and dignity), the same characters and the same functions are ascribed to both.”

— Francis Turretin, Institutes of Elenctic Theology, 18.21.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause%20bishop%20and%20presbyter%20are%20everywhere%20in%20Scripture%20taken%20for%20one%20and%20the%20same%20%28so%20that%20the%20difference%20is%20only%20in%20the%20name%2C%20not%20in%20the%20thing%E2%80%94bishop%2C%20with%20regard%20to%20his%20office%20and%20function%3B%20presbyter%2C%20with%20regard%20to%20his%20age%20and%20dignity%29%2C%20the%20same%20characters%20and%20the%20same%20functions%20are%20ascribed%20to%20both.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2018.21.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6982e00e09.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6982e00e09.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c9aad96bec" data-kw="">
<blockquote><p>2. By ‘ministry’, called [Greek]… thereby generally are understood such offices as concerned the discipline of the Church: specially conversant about the body and temporal things, either to relieve their poverty, which was the office of deacons in the distribution of alms, or to cherish them in sickness, which was the charge of widows, whose office St. Paul describes, 1 Tim. 5, or to watch over their manners, which belonged unto the spiritual governors. … 6. ‘He that shows mercy’. 1. Some do understand this generally of all Christians, that they should give chearfully: as Chrysostom will have it the same with that precept, 2 Cor. 9:7, ‘he that soweth sparingly, shall reap sparingly:’ Theodoret, Haymo: but the apostle here speaks of the special offices of the Church. … 5. But their opinion is rather here to be approved which in the first place take the office of deacons to be described, such as were elected by the apostles, Acts 6, and here the office of such, as were assigned to have a care of strangers, exiles, the sick, such were the widows, whom St. Paul would not have chosen under 60 years, 1 Tim. 5. Thus Calvin, Beza, Martyr, Gualter, Faius, Pareus, with others. Now this showing of mercy: …3. such special works of mercy then are here understood, which belonged to the curing and attending upon the sick, aged, impotent, strangers, exiles, orphans, Pareus. 4. ‘with chearefulnes of heart’, gentleness in words, pleasantness of countenance: for all those are signified by hilarity or cheerfulness, Tolet: so Chrysostom… 3. again, such as were employed in these services, as old men and widows, are naturally given to morosity, and therefore they have need of this precept to dispose themselves to cheerfulness, Pareus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … (Cambridge, 1611), Biblical Exegesis, ch. 12, 3. ‘The Questions &amp; Doubts Discussed’, 16th Question, ‘Of these several offices here rehearsed by the apostle in particular’, pp. 546 &amp; 548-9 on Rom., 12:7-8</span></figcaption>

</figure><figure class="quote" id="q-8012655f8e" data-kw="">
<blockquote><p>To my mind the whole subject is to be decided not by the exegesis of any difficult passage in St. Paul’s letters, but by common sense, by expediency, and by a regard for the law of nature and by what the Church has found to be good in the past. Now, you may interpret those passages as you please, but is not this the fact, that the principle there laid down has been accepted as sound by the Church in all generations? Take even those Churches that have long admitted women to ordination on the same footing as men. Why is it that there is no tendency to increase the number of women as ministers? There must be some great and almost indefinable law of nature that is against the thing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clarence-e-mccartney.html">Clarence Macartney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Place of Woman in the Church’ in</cite>, ed. J.R. Fleming, Proceedings of the Eleventh General Council of the Alliance of Reformed Churches holding the Presbyterian System, held at Pittsburgh, 1921 (Edinburgh: Office of the Alliance, 1922), pp. 157-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-160069d067" data-kw="">
<blockquote><p>Paul gives rules and directions to Timothy (1 Tim. 5:1,19 and Titus 2) as to pastors, not as to believers, concerning the manner of receiving [Church] complaints, nor is there in Scripture precept, promise or practice of believers to receive complaints, we are surer than our Brethren [the congregationalists]; and it’s safer to expound this [phrase], ‘Tell the Church’ [Mt. 18:17], that is, ‘Tell Timothy and the Elders’ than, ‘Tell the church, that is, tell any member of the church at Corinth,’ i.e. tell any woman or servant [your formal complaint], for they are as essentially members as Timothy or any of the Elders, [Point] 2. and [these laypersons] must join their consent to censures because members must hear the scandals because they must tacitly consent before censures be dispensed; it follows not [however] that members must be told [of such formal complaints as an authoritative court, in the sense of Mt. 18:17], for [only] the tacit consent of women [to such Church censures of others] is requisite, for they may be scandalized or edified by the good or evil dispensing of censures as well as men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 259</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Paul gives rules and directions to Timothy (1 Tim. 5:1,19 and Titus 2) as to pastors, not as to believers, concerning the manner of receiving [Church] complaints, nor is there in Scripture precept, promise or practice of believers to receive complaints, we are surer than our Brethren [the congregationalists]; and it’s safer to expound this [phrase], ‘Tell the Church’ [Mt. 18:17], that is, ‘Tell Timothy and the Elders’ than, ‘Tell the church, that is, tell any member of the church at Corinth,’ i.e. tell any woman or servant [your formal complaint], for they are as essentially members as Timothy or any of the Elders, [Point] 2. and [these laypersons] must join their consent to censures because members must hear the scandals because they must tacitly consent before censures be dispensed; it follows not [however] that members must be told [of such formal complaints as an authoritative court, in the sense of Mt. 18:17], for [only] the tacit consent of women [to such Church censures of others] is requisite, for they may be scandalized or edified by the good or evil dispensing of censures as well as men.”

<blockquote><p>The preaching of the gospel to the poor of this world … is at once an evidence of its divine origin and a glorious illustration of its nature and design. It is a remedy for sin, and all the evils which have followed in its train, personal, social, temporal and eternal evils. …

By the preaching of the word, and especially to the poor, Christ is come to change the face of society. Jesus Christ was, indeed, the discoverer of these two great truths, that all reformations must begin with the lower classes, and that preaching is the grand instrument of changing the opinions of a nation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Preached to the Poor (1855) in Miscellanies of Rev. Thomas E. Peck</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4978fea938" data-kw="">
<blockquote><p>All times are naturally equal, as being distinguished by the same constant and uniform motion of the heavens: yet notwithstanding, when God shall, by any notable and extraordinary work of his, honour and sanctify some certain days, as he did the Jewish sabbath with respect to the creation, and our Lord’s day, by raising up Christ from the dead; as they are, by this wonderful work of his, severed from the rank of common times;–so are we, ever when we come unto them, not to pass them over without the memory of that work which had so advanced them: otherwise to solemnize a day, without reference unto the cause of its solemnization, is but a blind observance. And for this cause, when God commands reverence to places, and sanctification of days, he annexeth the ground of both, and leads us to a sight of those works, from which they receive both their dignity and institution.

So likewise in Sacraments, to eat bread and drink wine are naked, common, simple actions, and in themselves always alike: but when Christ shall, by that great work of his death, set them apart unto a holy use, and make them representations of his own sacred body, as they are by this divine relation hallowed, so to partake of them, without commemorating that great work which hath so sanctified them, is not only impious, in that it perverteth the divine institution, but absurd likewise; it being all one, as if a man should, with much ceremony and solemnity, receive parchment and wax, never so much as thinking on the land it conveys; or look on a picture, without any reflection on the pattern and original which it resembleth, – which is indeed to look on the wood, and not on the picture; it being naturally impossible to separate things in notion, whose being do consist in relation to each other.

So then, the Sacrament being a typical service, is not, nor can be, celebrated without a remembrance of the substance which it resembleth: which thing, according as the preciousness, value, and importance of it doth proportionably impose on us a greater necessity of this duty; which is then rightly performed, when there is a deep impression of Christ crucified made on the soul, by these seals of his death; than which there is not any thing in the world more fit to fasten a stamp of itself in the minds of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 88-89.</span></figcaption>

</figure><figure class="quote" id="q-f8498633c4" data-kw="">
<blockquote><p>1. Is the Sabbath commandment a moral law or a ceremonial law? The commandment to observe the weekly Sabbath is a moral law of God.

2. How can it be shown that the Sabbath commandment is a moral rather than a ceremonial law? (a) The fourth commandment itself mentions the fact that the Sabbath originated not at the time of Moses but at the creation of the world. Thus the Sabbath existed thousands of years before God gave the ceremonial laws in the time of Moses. (b) The Sabbath commandment is a part of the Ten commandments, and thus, being found in a context of moral laws, it too must be regarded as a moral Iaw: it would be very strange if the Ten Commandments were composed of nine moral precepts and one ceremonial precept, nine permanent laws and one law of only temporary validity. The Ten form a unity as a summary of God’s moral law, and if the Sabbath commandment were not a moral law, this unity would be broken. (c) Like the rest of the Ten commandments, the Sabbath commandment was not written on perishable material but upon tablets of stone, indicating its permanent validity. All parts of the ceremonial law passed away at the time of the crucifixion of Christ, and if the Sabbath commandment is a ceremonial law, then it too passed away, and was not permanent, but only of temporary validity. But the fact that it was written on stone by God himself indicates that it was intended to be permanent.

3. On whom is the Sabbath commandment binding? Upon all men without exception. As Jesus said, “the Sabbath was made for man”; he did not say that the Sabbath was made for Israel, but that it was made for man, and not man for the Sabbath. Thus it is not limited to any particular class of men, but is binding upon the human race.

4. What attempts have been made to limit the obligation to observe the Sabbath to certain classes of people? (a) Some have held that the obligation to keep the Sabbath is binding only on the people of Israel or the Jews. (b) Others have maintained that the obligation to observe the Sabbath is binding only on Christians, and that those who do not profess to be Christians need not observe the Sabbath.

5. How can these claims be answered? (a) It has been shown above that the Sabbath commandment is a moral law. But if it is a moral law, it must be binding on all people without exception. (b) If we say that the fourth commandment applies only to Jews, or only to Christians, why not go on and say that the fifth, sixth, and seventh commandments, for example, apply only to Jews, or only to Christians? We must always remember that the Ten Commandments form a unity and may not be arbitrarily broken up. We may not single out one commandment and say that it applies only to a limited group of people, while the rest apply to all mankind. The Ten Commandments must be taken together, and we should realize that while they were originally revealed by God to the people of Israel, they form a summary of God’s moral law which is binding on all mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), pp 321-22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

of+men%2C+but+is+binding+upon+the+human+race.%0A%0A4.+What+attempts+have+been+made+to+limit+the+obligation+to+observe+the+Sabbath+to+certain+classes+of+people%3F+%28a%29+Some+have+held+that+the+obligation+to+keep+the+Sabbath+is+binding+only+on+the+people+of+Israel+or+the+Jews.+%28b%29+Others+have+maintained+that+the+obligation+to+observe+the+Sabbath+is+binding+only+on+Christians%2C+and+that+those+who+do+not+profess+to+be+Christians+need+not+observe+the+Sabbath.%0A%0A5.+How+can+these+claims+be+answered%3F+%28a%29+It+has+been+shown+above+that+the+Sabbath+commandment+is+a+moral+law.+But+if+it+is+a+moral+law%2C+it+must+be+binding+on+all+people+without+exception.+%28b%29+If+we+say+that+the+fourth+commandment+applies+only+to+Jews%2C+or+only+to+Christians%2C+why+not+go+on+and+say+that+the+fifth%2C+sixth%2C+and+seventh+commandments%2C+for+example%2C+apply+only+to+Jews%2C+or+only+to+Christians%3F+We+must+always+remember+that+the+Ten+Commandments+form+a+unity+and+may+not+be+arbitrarily+broken+up.+We+may+not+single+out+one+commandment+and+say+that+it+applies+only+to+a+limited+group+of+people%2C+while+the+rest+apply+to+all+mankind.+The+Ten+Commandments+must+be+taken+together%2C+and+we+should+realize+that+while+they+were+originally+revealed+by+God+to+the+people+of+Israel%2C+they+form+a+summary+of+God%E2%80%99s+moral+law+which+is+binding+on+all+mankind.%E2%80%9D%0A%0A%E2%80%94+Johannes+G.+Vos%2C+The+Westminster+Larger+Catechism%3A+A+Commentary%2C+ed.+G.+I.+Williamson+%28Phillipsburg+NJ%3A+P%26R%2C+2002%29%2C+pp+321-22.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff8498633c4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f8498633c4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/12/10/j-g-vos-on-the-sabbath-as-a-moral-commandment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

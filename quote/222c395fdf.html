<blockquote><p>I. They who are effectually called and regenerated, having a new heart and a new spirit created in them, are further sanctified, really and personally, through the virtue of Christ’s death and resurrection,a by his Word and Spirit dwelling in them, the dominion of the whole body of sin is destroyed, and the several lusts thereof are more and more weakened and mortified…</p></blockquote>

<blockquote><p>Q. 75. What is sanctification? A. Sanctification is a work of God’s grace, whereby they whom God hath, before the foundation of the world, chosen to be holy, are in time, through the powerful operation of his Spirit[b] applying the death and resurrection of Christ unto them,[c] renewed in their whole man after the image of God;[d] having the seeds of repentance unto life, and all other saving graces, put into their hearts,[e] and those graces so stirred up, increased, and strengthened,[f] as that they more and more die unto sin, and rise unto newness of life.[g] [b] Eph. 1:4. 1 Cor. 6:11. 2 Thess. 2:13. [c] Rom. 6:4-6. [d] Eph. 4:23,24. [e] Acts 11:18. 1 John 3:9. [f] Jude 20. Heb. 6:11,12. Eph. 3:16-19. Col. 1:10,11. [g] Rom. 6:4,6,14. Gal. 5:24.</p></blockquote>

<blockquote><p>Controversy XI: Can the justified men fulfill God’s law? Orthodox Position: None of the justified can perfectly keep God’s law, as Scripture teaches (Romans 8; Galatians 3), experience, and the Church Fathers. The perfection of the righteous, mentioned in Matthew 5:48 and Genesis 6:9, 17:1, Philippians 3:15, consists in the imputation of Christ’s justice and in sincerity and uprightness, which consist in acknowledging one’s own imperfection and firmly resolving to obey all of God’s commandments. [Romanist] Position of [Robert] Bellarmine: The justified men can keep God’s law, not by the forces of free will, but by the aid of God’s grace, that is, by the spirit of faith and charity infused in justification. The reasons are:

1. Christ’s yoke is easy, and His commandments are not burdensome (Matthew 11; 1 John 5).

2. God gives us His Spirit, who makes us walk in His ways (Ezekiel 36). That is why the apostle says in Philippians 4:13 that he can do all things.

3. The elect are endowed with charity (John 13, 15; 1 John 3, 4). Charity is the fulfillment of the law (John 14; Romans 13).

4. We read about many saints who kept God’s commandments blamelessly and were perfect and truly righteous (Genesis 6, 17; 1 Samuel 14, 15; 2 Samuel 23; Luke 1).

5. God is not like a tyrant who demands impossible tributes from His friends. Therefore, the Church Fathers teach that no one is obligated to do the impossible.

6. Christ died so that the justice of the law might be fulfilled in us (Romans 8:4).

7. Man can do more than is commanded (Matthew 19:21). [The Reformed] Censure: 1.2. God’s commandments are not only possible but also easy for the elect, not by their own strength but by God’s grace. Furthermore, the defects found in their works are graciously forgiven by God. 3.4. Perfection of parts and sincerity are attributed to the elect, not absolute and supreme perfection, which is called perfection of degrees. Though the elect love God, the mode of this love in this life is imperfect.

5. Not every obligation to do the impossible is unjust, especially when one has incurred a debt by one’s own fault. Moreover, God requires from His own what is possible through Christ.

6. The substance of God’s law is fulfilled in us when we are justified in Christ according to the perfect formula of the law.

7. The conditional is not categorical. Christ is not saying here what the arrogant young man could do but refuting him for his false hope of justice. Moreover, it is true that there are works of supererogation, but in Christ. . Controversy XII: Are the good works of the justified truly pure? Orthodox Position: The good works of the justified, considered in themselves, are wrapped in many defects and are therefore not absolutely pure but only relatively, considering the justified person, who is pure in Christ. Scripture teaches this (Psalm 130; Romans 7; 1 Corinthians 13; James 3). Experience also confirms this, as we experience various temptations in thoughts, words, and deeds. The Church Fathers, like Bernard, also approve this: “If there is any justice in us, it is humble, perhaps upright, but not pure.</p></blockquote>

<blockquote><p>4. [God justifies] By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. [God justifies] By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness.”

— Thomas Manton, A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 334">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+%5BGod+justifies%5D+By+way+of+Execution%2C+when+the+sentence+is+executed.+This+is+in+part+done+here%2C+as+God+takes+off+the+penalties+and+fruits+of+sin%2C+either+in+the+way+of+his+internal+or+external+government%2C+and+gives+us+many+blessings%2C+as+the+pledge+of+his+love%2C+and+above+all%2C+the+gift+of+the+Holy+Spirit%2C+whereby+He+sanctifies+us+more+thoroughly%2C+and+works+in+us+that+which+is+pleasing+in+his+sight%3A+This+He+gives+as+the+God+of+peace%2C+as+reconciled+to+us+in+Christ%2C+Heb.+13%3A20-21%3A+%E2%80%98Now+the+God+of+peace+that+brought+again+from+the+dead+our+Lord+Jesus%2C+that+great+shepherd+of+the+sheep%2C+through+the+blood+of+the+everlasting+Covenant%2C+make+you+perfect+in+every+good+work%2C+to+do+his+will%2C+working+in+you+that+which+is+pleasing+in+his+sight%2C+through+Jesus+Christ.%E2%80%99+1+Thess.+5%3A23%3A+%E2%80%98And+the+very+God+of+peace+sanctify+you+wholly%3A+and+I+pray+God+your+whole+spirit%2C+and+soul%2C+and+body%2C+be+preserved+blameless+unto+the+coming+of+our+Lord+Jesus+Christ%3B%E2%80%99+Faithful+is+he+that+calls+you%2C+who+will+do+it%3A+but+more+fully+at+the+Last+Day%2C+when+we+enter+into+everlasting+glory%3B+and+the+wicked+are+turned+into+Hell+with+the+Devil+and+his+angels%2C+Mt.+25%3A46%2C+%E2%80%98And+these+shall+go+into+everlasting+punishment%3B+but+the+righteous+into+life+eternal%E2%80%99%3A+then+is+the+full+and+final+execution%2C+a+perfect+freedom+from+all+misery%2C+and+a+possession+of+all+happiness.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons%E2%80%A6+%28London%3A+Astwood%2C+1684%29%2C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+p.+334&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39a2584e2a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39a2

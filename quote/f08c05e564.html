<blockquote><p>[5.] We on all accounts stand in need of a surety for us, or on our behalf. Neither without the interposition of such a surety could any covenant between God and us be firm and stable, or “an everlasting covenant, ordered in all things, and sure.” In the first covenant, made with Adam, there was no surety, but God and man were the immediate covenanters. And although we were then in a state and condition able to perform and answer all the terms of that covenant, yet was it broken and disannulled. If this came to pass by the failure of the promise of God, it was necessary that, on the making of a new covenant, he should have a surety to undertake for him, that the covenant might be stable and everlasting. But this is false, and blasphemous to imagine. It was man alone who failed and brake that covenant. Wherefore it was necessary that, upon the making of the new covenant, and that with a design and purpose that it should never be disannulled as the former was, we should have a surety and undertaker for us; for if that first covenant was not firm and stable, because there was no surety to undertake for us, notwithstanding all that ability which we had to answer the terms of it, how much less can any other be so, now our natures are become depraved and sinful! Wherefore we alone are capable of a surety, properly so called, for us; we alone stood in need of him; and without him the covenant could not be firm and inviolable on our part: the surety, therefore, of this covenant is so with God for us. [6.] It is the priesthood of Christ that the apostle treats of in this place, and that alone. Wherefore he is a surety as he is a priest, and in the discharge of that office; and is therefore so with God on our behalf. … (3.) It remaineth that we inquire positively how the Lord Christ was the surety of the new covenant, and what is the benefit we receive thereby. And unto this purpose we must first consider that opinion of some that the whole end of the mediation of Christ was only to procure the new covenant: although at first view it be irreconcilable unto the nature and notion of a surety; for a surety is not the procurer of that whereof he is the surety, but only the undertaker for its accomplishment. But we must more distinctly consider this assertion, and in what sense Christ may be said to procure the new covenant by his death and mediation. And to this end we must observe, that the new covenant may be considered divers ways, in various respects:— [1.] In the designation and preparation of its terms and benefits in the counsel of God. And this, although it have the nature of an eternal decree, yet is it distinguished from the decree of election, which first and properly respects the subjects or persons for whom grace and glory are prepared; for this respects the preparation only of that grace and glory, as to the way and manner of their communication. It is true, this purpose, or counsel of God’s will, is not called the covenant of grace, which is the express declared exemplification of it. The covenant of grace, I say, is only the declaration of this counsel of God’s will, accompanied with the means and power of its accomplishment, and the prescription of the ways whereby we are to be interested in it, and made partakers of the benefits of it. But in the inquiry after the procuring cause of the new covenant, it is the first thing that ought to come under consideration; for nothing can be the procuring cause of this covenant which is not so of this spring and fountain of it,—of this idea of it in the mind of God. But this is nowhere in the Scripture affirmed to be the effect of the death or mediation of Christ; and so to ascribe it, is to overthrow the whole freedom of eternal grace and love. Neither can any thing that is absolutely eternal, as is this decree and counsel of God, be the effect of, or be procured by, any thing that is external and temporal. And besides, it is expressly assigned unto absolute love and grace: see Eph. 1:4–6, with all those places where the love of God is assigned as the sole cause of the designation of Christ unto his office, and the sending of him. [2.] It may be considered with respect unto the federal transactions between the Father and Son concerning the accomplishment of this counsel of his will. What these were, wherein they did consist, I have declared at large in my exercitations. Neither do I call this the covenant of grace absolutely, nor is it so called in the Scripture: but it is that wherein it had its establishment, as unto all the ways, means, and ends of its accomplishment; and by it were all things so disposed, as that it might be effectual unto the glory of the wisdom, grace, righteousness, and power of God. Wherefore the covenant of grace could not be procured by any means or cause but that which was the cause of this covenant of the mediator, or of God the Father with the Son as undertaking the work of mediation. And as this is nowhere ascribed unto the death of Christ in the Scripture, so to assert it is contrary unto all spiritual reason and understanding. Who can conceive that Christ, by his death, should procure the agreement between God and him that he should die? [3.] With respect unto the declaration of it. This you may call God’s making or establishing of it with us, if you please; though making of the covenant in the Scripture is applied only unto its execution or actual application unto persons. But this declaration of the grace of God, and the provision in the covenant of the mediator for the making of it effectual unto his glory, is most usually called the covenant of grace. And this is twofold:— 1st. In the way of a singular and absolute promise; as it was first declared unto and thereby established with Adam, and afterwards with Abraham. This is the declaration of the purpose of God, or the free determination of his will as to his dealing with sinners, on the supposition of the fall and the forfeiture of their first covenant state. Hereof the grace and will of God were the only cause, Heb. 8:8. And the death of Christ could not be the means of its procurement; for he himself, and all that he was to do for us, were the substance of that promise wherein this declaration of God’s grace and purpose was made, or of this covenant of grace, which was introduced and established in the room of that which was broken and disannulled, as unto the ends and benefits of a covenant. The substance of the first promise, wherein the whole covenant of grace was virtually comprised, directly respected and expressed the giving of him for the recovery of mankind from sin and misery, by his death, Gen. 3:15. Wherefore if he, and all the benefits of his mediation, his death and all the effects of it, be contained in the promise of the covenant, that is, in the covenant itself, then was not his death the procuring cause of that covenant, nor do we owe it thereunto.</p></blockquote>

s+nowhere+in+the+Scripture+affirmed+to+be+the+effect+of+the+death+or+mediation+of+Christ%3B+and+so+to+ascribe+it%2C+is+to+overthrow+the+whole+freedom+of+eternal+grace+and+love.+Neither+can+any+thing+that+is+absolutely+eternal%2C+as+is+this+decree+and+counsel+of+God%2C+be+the+effect+of%2C+or+be+procured+by%2C+any+thing+that+is+external+and+temporal.+And+besides%2C+it+is+expressly+assigned+unto+absolute+love+and+grace%3A+see+Eph.+1%3A4%E2%80%936%2C+with+all+those+places+where+the+love+of+God+is+assigned+as+the+sole+cause+of+the+designation+of+Christ+unto+his+office%2C+and+the+sending+of+him.+%5B2.%5D+It+may+be+considered+with+respect+unto+the+federal+transactions+between+the+Father+and+Son+concerning+the+accomplishment+of+this+counsel+of+his+will.+What+these+were%2C+wherein+they+did+consist%2C+I+have+declared+at+large+in+my+exercitations.+Neither+do+I+call+this+the+covenant+of+grace+absolutely%2C+nor+is+it+so+called+in+the+Scripture%3A+but+it+is+that+wherein+it+had+its+establishment%2C+as+unto+all+the+ways%2C+means%2C+and+ends+of+its+accomplishment%3B+and+by+it+were+all+things+so+disposed%2C+as+that+it+might+be+effectual+unto+the+glory+of+the+wisdom%2C+grace%2C+righteousness%2C+and+power+of+God.+Wherefore+the+covenant+of+grace+could+not+be+procured+by+any+means+or+cause+but+that+which+was+the+cause+of+this+covenant+of+the+mediator%2C+or+of+God+the+Father+with+the+Son+as+undertaking+the+work+of+mediation.+And+as+this+is+nowhere+ascribed+unto+the+death+of+Christ+in+the+Scripture%2C+so+to+assert+it+is+contrary+unto+all+spiritual+reason+and+understanding.+Who+can+conceive+that+Christ%2C+by+his+death%2C+should+procure+the+agreement+between+God+and+him+that+he+should+die%3F+%5B3.%5D+With+respect+unto+the+declaration+of+it.+This+you+may+call+God%E2%80%99s+making+or+establishing+of+it+with+us%2C+if+you+please%3B+though+making+of+the+covenant+in+the+Scripture+is+applied+only+unto+its+execution+or+actual+application+unto+persons.+But+this+declaration+of+the+grace+of+God%2C+and+ <blockquote><p>2. Under the new covenant or testament, however, these promised blessings are not given to all men, because God is true, thus the covenant is necessarily discriminate. These blessings are given, however, doubly when the covenant is received. In the first place, by the substance of the covenant itself or by the promised blessings from God themselves, then by their administration in the visible assembly. In the first sense (learned from Jeremiah in the place already cited), which substance also is peculiar to the elect. For to all the elect and to them alone, this part, the remission of sins, renewal to the image of God, and the knowledge of God itself is therefor promised, or which embraces God’s favor which they would never have had from themselves (John 6:44,45; 64,65; 10:26; 11:52; Acts 13:47,48; Romans 8:29,30; 9:7,8,9,11,15,16; Titus 1:1).</p></blockquote>

— Caspar Olevianus, De substantia, 1.1.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+Under+the+new+covenant+or+testament%2C+however%2C+these+promised+blessings+are+not+given+to+all+men%2C+because+God+is+true%2C+thus+the+covenant+is+necessarily+discriminate.+These+blessings+are+given%2C+however%2C+doubly+when+the+covenant+is+received.+In+the+first+place%2C+by+the+substance+of+the+covenant+itself+or+by+the+promised+blessings+from+God+themselves%2C+then+by+their+administration+in+the+visible+assembly.+In+the+first+sense+%28learned+from+Jeremiah+in+the+place+already+cited%29%2C+which+substance+also+is+peculiar+to+the+elect.+For+to+all+the+elect+and+to+them+alone%2C+this+part%2C+the+remission+of+sins%2C+renewal+to+the+image+of+God%2C+and+the+knowledge+of+God+itself+is+therefor+promised%2C+or+which+embraces+God%E2%80%99s+favor+which+they+would+never+have+had+from+themselves+%28John+6%3A44%2C45%3B+64%2C65%3B+10%3A26%3B+11%3A52%3B+Acts+13%3A47%2C48%3B+Romans+8%3A29%2C30%3B+9%3A7%2C8%2C9%2C11%2C15%2C16%3B+Titus+1%3A1%29.%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+De+substantia%2C+1.1.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ced619327.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ced619327.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/01/substance-administration-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-cfae9ab62b" data-kw="">
<blockquote><p>And this is clear by all covenants in the Word of God: even the covenant between God and man is in like manner mutual — “I will be your God, and ye shall be my people.” The covenant is so mutual, that if the people break the covenant, God is loosed from his part of the covenant, Zech. 11:10. The covenant gives to the believer ‘a sort of action of law,’ and jus quoddam, to plead with God in respect of his fidelity to stand to that covenant that binds him by reason of his fidelity, Isa. 43:26; 63:16; Dan. 9:4-5;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 54</span></figcaption>

</figure><figure class="quote" id="q-9a21d7ce66" data-kw="">
<blockquote><p>The covenant of grace partakes both of a testament and of a covenant. Hence it is not improperly called “a covenant by a testament,” “a testamentary covenant” and a “federal testament.” It is a covenant because after the manner of a covenant there was an agreement between parties and conditions were laid down on both sides, both on the part of God and on the part of man, and there was a mediator to reconcile the discordant parties. But it is also a “testament” (1) because it is a covenant in which an inheritance is promised (which necessarily demands the antecedent death of the testator, since he only then is reckoned an heir who obtains the goods by an intervention of the will of the disposer). Since therefore the covenant (diathēkē) is a promise (epangelia) of this kind (in virtue of which the inheritance is discerned), it must necessarily be testamentary. On this account, the apostle adds, “For where a diathēkē is [to wit, by which an inheritance is promised, i.e., a testament], there must also of necessity be the death of the testator.” (2) Because for our advantage only was this covenant made, as in a testament the advantage not of the testator but of the heirs is regarded; nor is God reconciled concerning mutual benefits, but concerning his own alone. (3) Because although conditions are set forth on both sides, they are entrusted for execution to the virtue and fidelity of only one party (namely, of God). Hence it is founded upon the mere grace of God and upon no disposition and merit of man (as will be fully proved in the proper place).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 12.1.3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-b40dbb55ac" data-kw="">
<blockquote><p>The law, as it has a promise of life, is very unlike the gospel. The former promises eternal life to a man on condition of his own perfect obedience and of the obedience of no other, whereas the latter promises it on condition of the perfect obedience of Christ received by faith, and of that of no other. The promise of the law as a covenant is the promise of God as an absolute God, but the promise of the gospel is the promise of God as a God of grace in Christ. The promise of the former was to have been performed after obedience, whereas the promise of the latter begins to be performed to the true believer before, and in order to, his obedience. In the law of works the promise of privilege is grounded on the performance of duty, but in the gospel the performance of duty is founded on the promise, and even on the enjoyment, of privilege. The promise of the law is strictly conditional, but the leading promises of the gospel are, to us, entirely absolute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 134.</span></figcaption>

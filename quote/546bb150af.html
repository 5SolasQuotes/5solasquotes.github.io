<main class="wrap"><figure class="quote" id="q-546bb150af" data-kw="">
<blockquote><p>Presbyterians, while repudiating the principle which has been so much abused by Papists, and even by prelatists, of the authority of the church to decree rites and ceremonies, do not run into the opposite extreme, as some have done, of throwing aside all regard to the light of nature and Christian prudence in regulating some circumstances concerning the worship of God and the government of the church, which are common to human actions and societies, and which a regard to decency and order, to general comfort and convenience, may require to be regulated.

The principles of Presbyterians upon this subject have been much misunderstood and misrepresented, and have been assailed from two opposite sides. The defenders of rites and ceremonies, and of the church’s authority to decree them, have endeavoured to pour contempt upon the principles of Presbyterians in this matter, by representing them as seeking an express warrant in the word for every circumstance connected in any way with the government and worship of the church, and allowing nothing whatever to be regulated by the light of nature and Christian prudence.

The second book of [Richard] Hooker’s Ecclesiastical Polity is entirely directed against this erroneous and exaggerated view of the Presbyterian principle; and though Thomas Cartwright, against whom chiefly the Ecclesiastical Polity was written, and who is there usually designated as “T. C.,” may have laid himself open to Hooker’s attack by some rash and unqualified statements upon this point, yet I am persuaded that, upon the whole, Hooker did not represent with perfect fairness the sentiments of his opponents upon this subject; and at any rate it is manifest that the great general principle, with the limitation and modification contained in the clause of the [Westminster] Confession we are at present considering, and introduced no doubt for this very purpose, escapes entirely from the range of Hooker’s argument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XL, pp 494-95.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c72dbed8e3" data-kw="">
<blockquote><p>The learned [John] Selden [an Erastian] in his discourse of the Civil Right of Tithes, has endeavoured to prove this [that tithes are not by any Divine Law due to the ministers of the Gospel]. There has been a war in the Romish Church about this question, between the canonists and the scholastics; the former hotly maintaining that tithes are due to the Church jure divino [by divine right]; the latter, that they are due only by ecclesiastical constitution: so says [Robert] Bellarmine, and other of their learned men. Yet some of their theologues, agree with the canonists: So does Baronius (Annals, tome 1, anno. 57, s. 74)… Among Protestant writers, prelates, and prelatical men plead hard for the divine right of tithes as the ministers’ due. Bishop [Lancelot] Andrews and Bishop [George] Carleton have said as much for it as any that I have seen. But most of our reformed divines maintain the negative. So Peter Martyr (Common Places, pt. 4, ch. 13), Zanchy (Of Redemption, book 1, ch. 16), Daneus (Ethic., book 2, ch. 10 [also in 4th Precept, p. 810]), Rivet (in Genesis, exercitation 80), Voetius (Eccle. 1, book 4, p. 824): And to this we adhere.</p></blockquote>

</figure><figure class="quote" id="q-210141a3e0" data-kw="">
<blockquote><p>Therefore, if the activity is conducive to worship, then it is lawful. We cannot ignore the human conscience here either, since an activity that might be conducive for worship to one person may not be conducive to worship for someone else. To take one example, it is certainly wise to let small children let loose some of their excess energy on the Sabbath (contrary to Laura Ingalls Wilder’s Farmer Boy! [below]). Otherwise, they will not be able to sit still and pay attention in worship. One does not have to take the attitude of Almanzo Wilder’s father [in Farmer Boy] in order to have a Puritan view of what is acceptable on the Sabbath! It is certainly a work of necessity to do something about the energy of small children. We must avoid both extremes of legalism and antinomianism here, as well as everywhere in our treatment of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lane-keister.html">Lane Keister</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath Day &amp; Recreations on the Sabbath</cite>, …’ in Confessional Presbyterian, #5 (2009), p. 323</span></figcaption>

</figure><figure class="quote" id="q-3232404889" data-kw="">
<blockquote><p>God, indeed, from time to time showed the presence of his divine majesty by definite signs, so that he might be said to be looked upon face to face. But all the signs that he ever gave forth aptly conformed to his plan of teaching and at the same time clearly told men of his incomprehensible essence. For clouds and smoke and flame [Deuteronomy 4:11], although they were symbols of heavenly glory, restrained the minds of all, like a bridle placed on them, from attempting to penetrate too deeply. Therefore Moses, to whom, nevertheless, God revealed himself more intimately than to the others [Exodus 33:11], did not succeed by prayers in beholding that face; but he received the answer that man is not able to bear such great brightness [Exodus 33:20]. The Holy Spirit appeared under the likeness of a dove [Matthew 3:16]. Since, however, he vanished at once, who does not see that by one moment’s symbol the faithful were admonished to believe the Spirit to be invisible in order that, content with his power and grace, they might seek no outward representation for themselves? For the fact that God from time to time appeared in the form of a man was the prelude to his future revelation in Christ. Therefore the Jews were absolutely forbidden so to abuse this pretext as to set up for themselves a symbol of deity in human form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559; Battles edition), 1.11.3.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“God, indeed, from time to time showed the presence of his divine majesty by definite signs, so that he might be said to be looked upon face to face. But all the signs that he ever gave forth aptly conformed to his plan of teaching and at the same time clearly told men of his incomprehensible essence. For clouds and smoke and flame [Deuteronomy 4:11], although they were symbols of heavenly glory, restrained the minds of all, like a bridle placed on them, from attempting to penetrate too deeply. Therefore Moses, to whom, nevertheless, God revealed himself more intimately than to the others [Exodus 33:11], did not succeed by prayers in beholding that face; but he received the answer that man is not able to bear such great brightness [Exodus 33:20]. The Holy Spirit appeared under the likeness of a dove [Matthew 3:16]. Since, however, he vanished at once, who does not see that by one moment’s symbol the faithful were admonished to believe the Spirit to be invisible in order that, content with his power and grace, they might seek no outward representation for themselves? For the fact that God from time to time appeared in the form of a man was the prelude to his future revelation in Christ. Therefore the Jews were absolutely forbidden so to abuse this pretext as to set up for themselves a symbol of deity in human form.”

— John Calvin, Institutes of the Christian Religion, (1559; Battles edition), 1.11.3.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod%2C+indeed%2C+from+time+to+time+showed+the+presence+of+his+divine+majesty+by+definite+signs%2C+so+that+he+might+be+said+to+be+looked+upon+face+to+face.+But+all+the+signs+that+he+ever+gave+forth+aptly+conformed+to+his+plan+of+teaching+and+at+the+same+time+clearly+told+men+of+his+incomprehensible+essence.+For+clouds+and+smoke+and+flame+%5BDeuteronomy+4%3A11%5D%2C+although+they+were+symbols+of+heavenly+glory%2C+restrained+the+minds+of+all%2C+like+a+bridle+placed+on+them%2C+from+attempting+to+penetrate+too+deeply.+Therefore+Moses%2C+to+whom%2C+nevertheless%2C+God+revealed+himself+more+intimately+than+to+the+others+%5BExodus+33%3A11%5D%2C+did+not+succeed+by+prayers+in+beholding+that+face%3B+but+he+received+the+answer+that+man+is+not+able+to+bear+such+great+brightness+%5BExodus+33%3A20%5D.+The+Holy+Spirit+appeared+under+the+likeness+of+a+dove+%5BMatthew+3%3A16%5D.+Since%2C+however%2C+he+vanished+at+once%2C+who+does+not+see+that+by+one+moment%E2%80%99s+symbol+the+faithful+were+admonished+to+believe+the+Spirit+to+be+invisible+in+order+that%2C+content+with+his+power+and+grace%2C+they+might+seek+no+outward+representation+for+themselves%3F+For+the+fact+that+God+from+time+to+time+appeared+in+the+form+of+a+man+was+the+prelude+to+his+future+revelation+in+Christ.+Therefore+the+Jews+were+absolutely+forbidden+so+to+abuse+this+pretext+as+to+set+up+for+themselves+a+symbol+of+deity+in+human+form.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+%281559%3B+Battles+edition%29%2C+1.11.3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3232404889.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3232404889.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/04/calvin-gods-accommodation-no-license-for-images/" rel="noopener" tar

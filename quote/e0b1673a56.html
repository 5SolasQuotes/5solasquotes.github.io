<main class="wrap"><figure class="quote" id="q-e0b1673a56" data-kw="">
<blockquote><p>Nothing begets so great an aptness in men to receive errors as this sinful admiration. Affection commonly makes men take down falsities; and error is easily received from them whom we much admire; and God does often leave admired teachers to err, for trial of the people, and the punishing of their vanity, in making God’s truth to stand at the devotion of the teacher for its acceptance, and trampling upon the holy, and (perhaps) learned labors of those who are more seeing and faithful than the admired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>That thereby, instead of reformation, they shall have deformation; instead of the power of godliness, they shall have vain janglings; instead of love, bitter heart-burnings and jealousies; instead of union, schism and division; instead of peace, contention and strife; instead of order and government, anarchy and confusion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-a572ba3041" data-kw="">
<blockquote><p>Yet notwithstanding, I allow their constancy which strive for a just cause, being forced against their wills unto contention. I do worthily condemn frowardness which does hinder and stay the holy carefulness of reforming the Church. And as I behave myself gentle and tractable in mean [lowly] things (as external ceremonies), so do I not always judge it profitable to give place to their foolish stoutness which will forsake nothing of their old wonted [accustomed] custom.</p></blockquote>

rmed Books Online</a></div>
</figure><figure class="quote" id="q-9170246cd4" data-kw="">
<blockquote><p>...it is a dreadful sin to depart from the church for the purpose of establishing one which is better, for the church is one, being the body of Christ. To separate ourselves from the church is to separate from the people of Christ and thus from His body, thereby withdrawing from the confession of Christ and departing from the fellowship of the saints. If we indeed deem the church to be what she really is, we shall then cause schism in the body of Christ, grieve the godly, offend others, give cause for the blaspheming of God‟s Name, and cause the common church member to err. By maintaining that the church is no church, we thereby deny the church of Christ, and therefore are also guilty of the sins just mentioned. We thereby displease God, who will not leave this unavenged, regardless of how much we please and flatter ourselves. Such activity the apostle opposes when he refers to such individuals as being carnal in 1 Cor 3:1, 3. He warns against this when he writes, “Now I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all speak the same thing, and that there be no divisions among you” (1 Cor 1:10); “I hear that there be divisions among you” (1 Cor 11:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, pp. 61-62</span></figcaption>

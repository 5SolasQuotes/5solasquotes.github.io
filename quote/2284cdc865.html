<blockquote><p>Speaking at a Belfast Anti-Slavery Society meeting for the visit of the Revd Henry Highland Garnet in April 1849, the Revd Isaac Nelson (PCI minister) predicted that history would favourably judge William Wilberforce for his exertions in the cause of emancipation:

The exertions of Wilberforce in the cause of slavery were lightly regarded for a time: such men as George Canning, William Pitt, and Charles James Fox were wont to look on him as a good-natured, simple, rather dogmatic, and perservering enthusiast; but history, which would judge more accurately, would give to the name a high niche in the temple of moral truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/northern-whig.html">Northern Whig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Northern Whig</cite>, 5 Apr. 1849</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ff29c0ec7" data-kw="">
<blockquote><p>How this Worship is Correspondent to the Nature of God. The Lord does show it in the fourth of John, verses 23 and 24, saying, the true worshippers, shall worship God in spirit and truth, that is in the Spirit of sanctification dwelling in the mind, helping our infirmities with sighs and groans, which cannot be expressed; and in the truth of his Word dwelling in us in all wisdom and spiritual understanding, such as these the Father requires should worship Him, because God is a Spirit, and they that worship Him, must worship Him in spirit and truth, and not in the ignorance of the mind, nor in the invention and will-worship of man; For this cause the Psalmist says in the 51:6, ‘Thou O Lord lovest truth in the inward affections’; and in the 50th Psalm he says, ‘Offer to God the sacrifice of praise, and pay the vows of the Most High, and call upon God; for the Lord loves truth in the inward parts.’ This is the pure and simple worship of God, without the glory and beauty of outward ceremonies, agreeing with the simple pure essence and nature of God Himself. Consider well Paul’s caveat in the Col. 2:8,18,20-23, warning all men to beware of human wisdom, and deceitful inventions and traditions, according to the rudiments of the world, and not after Christ; the outward show of holiness which puffs up men’s hearts with self-conceit, being burdened with traditions, which having a glorious show of holiness, of wisdom and voluntary religion, wherein men are out of measure superstitious in zeal, not sparing their bodily labor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenwick.html">William Fenwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Enquiry After Ancient Truths, both in Scripture &amp; Fathers, Touching the Subsistence of the Church of God</cite>, … (London, 1643), pp. 2-3</span></figcaption>

<blockquote><p>First, I require the B[ishop] to shew us a difference betwixt the keeping of holy days by formalists, &amp; their keeping of the Lord’s day: for upon holy days they enjoin a cessation from work, and a dedicating of the day to Divine worship, even as upon the Lord’s day. The Bishop alledgeth five respects of difference, but they are not true. First, he saith, that the Lord’s day is commanded to be observed of necessity, for conscience of the Divine ordinance, as a day sanctified and blessed by God himself.

Answ. 1. so have we heard from [Richard] Hooker, that holy days are sanctified by God’s extraordinary works, but because the B[ishop] dare not say so much, therefore I say. 2. This difference cannot shew us, that they observe holy days only for order and policy, and that they place no worship in the observing of them, as in the observing of the Lord’s day, (which is the point that we require) for worship is placed in the observing of human, as well as of Divine ordinances; otherwise worship hath never been placed in the keeping of Pharisaical and Popish traditions. This way is worship placed in the keeping of holy days, when for conscience of an human ordinance, they are both kept as holy, and thought necessary to be so kept. 3. The B[ishop] contradicteth himself, for elsewhere he defendeth, that the Church hath power to change the Lord’s day.

Secondly, he giveth us this difference, that the Lord’s day is observed, as the Sabbath of Jehovah, and as a day whereon God himself did rest after the creation. Ans. 1. This is false of the Lord’s day, for after the creation, God rested upon the seventh day, not upon the first. 2. Dr [George] Downame saith, that festival days also are to be consecrated as Sabbaths to the Lord. Thirdly, the B[ishop] tells us, that the Lord’s day is observed in memory of the Lord’s Resurrection.

Ans. 1. He shall never make this good, for, we observe the Lord’s day in memory of the whole work of Redemption. 2. If it were so, this could make no difference, for just so Christmass is observed in memory of the Lord’s Nativity, Good-Friday, in memory of his Passion, &amp;c. His fourth &amp; fifth respects of difference, are certain mysteries in the Lord’s day. But we shall see by and by, how his fellow Formalists who are more ingenuous then himself, shew us mysteries in the Festival days also. Lastly, albeit the B[ishop] have told us that there is no worship appropriated unto the Festival days, which may not be performed at any other time, yet this cannot with him make a difference betwixt them and the Lord’s day: for in his Epistle which I have quoted, he declareth his judgment to be the same of the Lord’s day, and teacheth us, that the worship performed on it, is not so appropriated to that time, but lawfully the same may be performed at any other convenient time, as the Church shall think fit. Now as the worship performed on the Lord’s day, is appropriated (in his judgment) to that time, so long as the Church altereth it not, and no longer, just as much thinks he, of the appropriating to Festival days, the worship performed on the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), Part III, pp 10-11.</span></figcaption>

<blockquote><p>The preaching of the gospel to the poor of this world … is at once an evidence of its divine origin and a glorious illustration of its nature and design. It is a remedy for sin, and all the evils which have followed in its train, personal, social, temporal and eternal evils. …

By the preaching of the word, and especially to the poor, Christ is come to change the face of society. Jesus Christ was, indeed, the discoverer of these two great truths, that all reformations must begin with the lower classes, and that preaching is the grand instrument of changing the opinions of a nation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Preached to the Poor (1855) in Miscellanies of Rev. Thomas E. Peck</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The preaching of the gospel to the poor of this world … is at once an evidence of its divine origin and a glorious illustration of its nature and design. It is a remedy for sin, and all the evils which have followed in its train, personal, social, temporal and eternal evils. …

</figure><figure class="quote" id="q-5816cdc836" data-kw="">
<blockquote><p>One of Scotland’s noblest distinctions — her well-spent Sabbaths — is now on the eve of being lost. The old landmarks, which have so long guarded the day of rest, as within a sacred enclosure, and which were commonly understood to have been set up by the hand of God himself, are in progress of being taken down and cast aside as useless incumbrances.

Not only has a corrupt practice, in various places, been encroaching on its devout observance, but, what is unspeakably worse, a change of sentiment regarding its nature and obligation is fast loosening its hold of the national conscience, and opening the way for its unscrupulous desecration.

Indeed the Sabbath, properly so-called, that is, a day in every week hallowed and set apart, by the special appointment of God, for bodily and spiritual rest, and allowing no interruption except what may arise from the works, which either cannot or should not be deferred, of necessity and mercy — such a day no longer exists in the opinion of a large and influential portion of the community.

The only thing they acknowledge is what is more fitly called Sunday, a day which requires, and that by common consent, rather than by express precept, the consecration of a few hours to the public worship of God, but leaves men free to spend all its other hours according to their taste or circumstances, either in pleasant recreations, or in pressing business.

If our readers have watched any of the discussions, regarding the Sabbath, which within the last few years have taken place in the town-councils or other public bodies, and observed how often this lighter notion of a Sunday, or a first day of the week, is made to supplant the notion of a proper Sabbath, now reputed old, Jewish, or Puritanical, even by men who have a name in the religious world, they will be satisfied that what we say is not without foundation.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8803cdc02b" data-kw="">
<blockquote><p>The Westminster divine, Stephen Marshall, helpfully distinguishes between what a civil magistrate may and may not do in coercing his subjects to support true religion. He argues that while the magistrate cannot convert anyone with the sword, nevertheless, he can compel his subjects to attend public worship:

Nor do I find a warrant for Magistrates to compel any to profession of truth, Psal. 110. His people a willing people. To Order what men shall believe, is to exercise Dominion over men’s Consciences: It is One thing to cause the people to attend the means, and another to make them believe the truth, the first they must do, but not the second: Faith is God’s gift. It is one thing to hinder Idolatry and blasphemy spreading, another thing to make people renounce an opinion, and embrace the truth. …

They may Command and Order the people to come and attend upon the Ministry of the Word, as the means instituted by Christ for their instruction to salvation. It is one thing to order them what they shall believe, another thing to order them to wait upon the means. All grant the civil Magistrate may call public Assemblies, to hear their Proclamations, and Statutes, &amp;c. read: if they may call a whole Town to hear a Law, then much more may they call them to hear God’s Laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The power of the magistrate in matters of religion, vindicated. The extent of his power determined. In a sermon preached before parliament on a monthly fast day</cite>, (London, 1657), pp 5, 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a343b68abd" data-kw="">
<blockquote><p>As a result of the influence of Libertarian Theology on most modern theonomists, they have generally shunned the establishment principle and rejected the idea that the civil magistrate is to financially endow the external observance of true religion. The irony of this is that it violates a central principle of theonomic hermeneutics: that whatever is commanded in the Old Testament, and was not repealed in the New Testament, remains binding. It is clear that true religion was nationally endowed in the Old Testament, yet the majority of contemporary theonomists argue that the state should not endow the church in the New Testament. David Scott corrects this muddled thinking in the extract below:

It is objected that the New Testament contains no appointment of such provision. The answer to this objection is brief but most satisfactory. The Old Testament is of divine authority as well as the New, and as obligatory in its precepts for our direction in doctrine and practice as the New Testament, in every thing except the peculiarities of the former dispensation. To provide for the maintenance of religion is peculiar to no administration of religion, but common to all. It is a moral principle which is in no ways affected by any change in its outward dispensation. The provision made for the Old Testament church is an example having all the force of a command, for the command though given to the Jewish people, regarded a moral duty, and therefore not peculiar to them, but common to them and us. It is not necessary then that there should be any precept in the New Testament; that which was given in a former dispensation continues in full force. The friends of a public provision for religion, have a right to ask those who are opposed to it, to furnish New Testament authority for the rescinding of the precept which was formerly given. Nothing short of this can affect the argument or form an objection to the duty of a national provision for religion. A merely positive appointment remains in force till it is abrogated. Does the New Testament contain any such rescinding act? Had it been only a positive appointment if not rescinded it would have remained in force; how much more being a moral duty?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), p. 292.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>For we nowhere teach that the sword is a means of converting, but the just vengeance that is inflicted by the minister of God upon false teachers, as upon other evil-doers, so it is not destinated by God for spiritual gaining and reducing of heretics that may repent, but for judicial expiation of wrongs done to the flock and Christian society.</p></blockquote>

</figure><figure class="quote" id="q-6c56e7c541" data-kw="">
<blockquote><p>Now there was brought forth in Scotland, anno 1610, a certain amphibian brood, sprung out of the stem of Neronian tyranny and in manners like to his nearest kinsman, the Spanish Inquisition. It is armed with a transcendent power and called by the dreadful name of the High Commission. Among other things, it arrogates to itself the power of deposing ministers. But how unjustly, thus it appears:

1. If those commissioners have any power at all to depose ministers, they have it from the king whose commissioners they are. But from him they have it not. Therefore they have none at all. The proposition is most certain: For they sit not in that commission to judge in their own name, nor by their own authority quum nihil exerceat delegatus nomine proprio, as Panormitan says (apud Forb. Iren, bk. 2, ch. 11, p. 177), but by virtue only of the commission and delegation which they have of the king. Yea, bishops themselves exerce not any jurisdiction in the High Commission as bishops, but only as the king’s commissioners, as Dr. Downame aknowledges (Defens., bk. 1, p. 8). The assumption is grounded upon this reason: The king has not power to depose ministers. Therefore he cannot give this power to others. For Nemo potest plus juris transferre in alium quam sibi competere dignoscatur (Boniface, 8, De Regul. Juris Reg., 79). The king may sometimes inflict such a civil punishment upon ministers, whereupon secondarily and accidentally will follow their falling away from their ecclesiastical office and function, (in which sense it is said that Solomon deposed Abiathar, as we heard before), but to depose them directly and formally (which the High Commission usurps to do), he has no power, and that because this deposition is an act of ecclesiastical jurisdiction: Whereas the power of Ecclesiastical jurisdiction does no more agree to the king than the power of ecclesiastical order: his power is civil and temporal, not spiritual and ecclesiastical. Dr. Field also confesses that none may judicially degrade or put anyone lawfully admitted from his degree and order but the spiritual guides of the Church alone (Of the Church, bk. 5, ch. 53, p. 682).

2. The deposing of ministers pertains to classical presbyteries, or (if the matter be doubtful and difficille) to synods, as has been showed. And who then can give the High Commission such authority as to take this power from them, and to assume it unto itself. These Commissioners profess that they have authority to discharge other ecclesiastical judicatories within the kingdom from meddling with the judging of anything which they shall think impertinent for them, and which they shall think good to judge and decide by themselves in their commission. Which, if it be so, then (when it pleases them) they may make other ecclesiastical judicatories to be altogether useless and of no effect in the Church.

3. In this commission, ecclesiastical and temporal men are joined together, and both armed with the same power. Therefore it is not right nor regular, nor in any wise allowable. For even as when a minister has offended in a civil matter, his fault is to be judged by civil judges according to the civil laws, and by no other: so when he offends in an ecclesiastical matter, his fault is to be judged only by ecclesiastical persons according to ecclesiastical laws: and in such a case Justinian forbids civil men to be joined with ecclesiastical men in judgment (Novell., 83, ch. 1). They are ecclesiastical things or causes which are handled and examined by the High Commission in the process of deposing ministers: and a shame it is to ecclesiastical men if they can, without the help and joining of temporal men, judge and decide things of this quality.

4. As in the matters to be judged, so in the censures and punishments to be inflicted; ecclesiastical and civil men have in this Commission alike power and authority: for ecclesiastical men therein have power of fining, confining, warding, etc. common to them with the temporal men: and again, the temporal men have power of excommunication, suspension, deprivation, etc. common to them with the ecclesiastical men. For they all sit there as the king’s commissioners, and so nomine [by name] they exerce this jurisdiction: which Commission being alike discharged by them all, it is manifest that both temporal men take hold of the keys and ecclesiastical men take hold of the civil sword. And this monstruous confusion and mixture gives sufficient demonstration that such a form of judgement is not from the God of order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, bk. 8, Digression 4, pp. 195-97</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now there was brought forth in Scotland, anno 1610, a certain amphibian brood, sprung out of the stem of Neronian tyranny and in manners like to his nearest kinsman, the Spanish Inquisition. It is armed with a transcendent power and called by the dreadful name of the High Commission. Among other things, it arrogates to itself the power of deposing ministers. But how unjustly, thus it appears:

1. If those commissioners have any power at all to depose ministers, they have it from the king whose commissioners they are. But from him they have it not. Therefore they have none at all. The proposition is most certain: For they sit not in that commission to judge in their own name, nor by their own authority quum nihil exerceat delegatus nomine proprio, as Panormitan says (apud Forb. Iren, bk. 2, ch. 11, p. 177), but by virtue only of the commission and delegation which they have of the king. Yea, bishops themselves exerce not any jurisdiction in the High Commission as bishops, but only as the king’s commissioners, as Dr. Downame aknowledges (Defens., bk. 1, p. 8). The assumption is grounded upon this reason: The king has not power to depose ministers. Therefore he cannot give this power to others. For Nemo potest plus juris transferre in alium quam sibi competere dignoscatur (Boniface, 8, De Regul. Juris Reg., 79). The king may sometimes inflict such a civil punishment upon ministers, whereupon secondarily and accidentally will follow their falling away from their ecclesiastical office and function, (in which sense it is said that Solomon deposed Abiathar, as we heard before), but to depose them directly and formally (which the High Commission usurps to do), he has no power, and that because this deposition is an act of ecclesiastical jurisdiction: Whereas the power of Ecclesiastical jurisdiction does no more agree to the king than the power of ecclesiastical order: his power is civil and temporal, not spiritual and ecclesiastical. Dr. Field also confesses that none may judicially degrade or put anyone lawfully admitted from his degree and order but the spiritual guides of the Church alone (Of the Church, bk. 5, ch. 53, p. 682).

2. The deposing of ministers pertains to classical presbyteries, or (if the matter be doubtful and difficille) to synods, as has been showed. And who then can give the High Commission such authority as to take this power from them, and to assume it unto itself. These Commissioners profess that they have authority to discharge other ecclesiastical judicatories within the kingdom from meddling with the judging of anything which they shall think impertinent for them, and which they shall think good to judge and decide by themselves in their commission. Which, if it be so, then (when it pleases them) they may make other ecclesiastical judicatories to be altogether useless and of no effect in the Church.

3. In this commission, ecclesiastical and temporal men are joined together, and both armed with the same power. Therefore it is not right nor regular, nor in any wise allowable. For even as when a minister has offended in a civil matter, his fault is to be judged by civil judges according to the civil laws, and by no other: so when he offends in an ecclesiastical matter, his fault is to be judged only by ecclesiastical persons according to ecclesiastical laws: and in such a case Justinian forbids civil men to be joined with ecclesiastical men in judgment (Novell., 83, ch. 1). They are ecclesiastical things or causes which are handled and examined by the High Commission in the process of deposing ministers: and a shame it is to ecclesiastical men if they can, without the help and joining of temporal men, judge and decide things of this quality.

4. As in the matters to be judged, so in the censures and punishments to be inflicted; ecclesiastical and civil men have in this Commission alike power and authority: for ecclesiastical men therein have power of fining, confining, warding, etc. common to them with the temporal men: and again, the temporal men have power of excommunication, suspension, deprivation, etc. common to them with the ecclesiastical men. For they all sit there as the king’s commissioners, and so nomine [by name] they exerce this jurisdiction: which Commission being alike discharged by them all, it is manifest that both temporal men take hold of the keys and ecclesiastical men take hold of the civil sword. And this monstruous confusion and mixture gives sufficient demonstration that such a form of judgement is not from the God of order.”

— George Gillespie, English Popish Ceremonies, (1637), pt. 3, bk. 8, Digression 4, pp. 195-97">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+there+was+brought+forth+in+Scotland%2C+anno+1610%2C+a+certain+amphibian+brood%2C+sprung+out+of+the+stem+of+Neronian+tyranny+and+in+manners+like+to+his+nearest+kinsman%2C+the+Spanish+Inquisition.+It+is+armed+with+a+transcendent+power+and+called+by+the+dreadful+name+of+the+High+Commission.+Among+other+things%2C+it+arrogates+to+itself+the+power+of+deposing+ministers.+But+how+unjustly%2C+thus+it+appears%3A+1.+If+those+commissioners+have+any+power+at+all+to+depose+ministers%2C+they+have+it+from+the+king+whose+commissioners+they+are.+But+from+him+they+have+it+not.+Therefore+they+have+none+at+all.+The+proposition+is+most+certain%3A+For+they+sit+not+in+that+commission+to+judge+in+their+own+name%2C+nor+by+their+own+authority+quum+nihil+exerceat+delegatus+nomine+proprio%2C+as+Panormitan+says+%28apud+Forb.+Iren%2C+bk.+2%2C+ch.+11%2C+p.+177%29%2C+but+by+virtue+only+of+the+commission+and+delegation+which+they+have+of+the+king.+Yea%2C+bishops+themselves+exerce+not+any+jurisdiction+in+the+High+Commission+as+bishops%2C+but+only+as+the+king%E2%80%99s+commissioners%2C+as+Dr.+Downame+aknowledges+%28Defens.%2C+bk.+1%2C+p.+8%29.+The+assumption+is+grounded+upon+this+reason%3A+The+king+has+not+power+to+depose+ministers.+Therefore+he+cannot+give+this+power+to+others.+For+Nemo+potest+plus+juris+transferre+in+alium+quam+sibi+competere+dignoscatur+%28Boniface%2C+8%2C+De+Regul.+Juris+Reg.%2C+79%29.+The+king+may+sometimes+inflict+such+a+civil+punishment+upon+ministers%2C+whereupon+secondarily+and+accidentally+will+follow+their+falling+away+from+their+ecclesiastical+office+and+function%2C+%28in+which+sense+it+is+said+that+Solomon+deposed+Abiathar%2C+as+we+heard+before%29%2C+but+to+depose+them+directly+and+formally+%28which+the+High+Commission+usurps+to+do%29%2C+he+has+no+power%2C+and+that+because+this+deposition+is+an+act+of+ecclesiastical+jurisdiction%3A+Whereas+the+power+of+Ecclesiastical+jurisdiction+does+no+more+agree+to+the+king+than+the+power+of+ecclesiastical+order%3A+his+power+is+civil+and+temporal%2C+not+spiritual+and+ecclesiastical.+Dr.+Field+also+confesses+that+none+may+judicially+degrade+or+put+anyone+lawfully+admitted+from+his+degree+and+order+but+the+spiritual+guides+of+the+Church+alone+%28Of+the+Church%2C+bk.+5%2C+ch.+53%2C+p.+682%29.+2.+The+deposing+of+ministers+pertains+to+classical+presbyteries%2C+or+%28if+the+matter+be+doubtful+and+difficille%29+to+synods%2C+as+has+been+showed.+And+who+then+can+give+the+High+Commission+such+authority+as+to+take+this+power+from+them%2C+and+to+assume+it+unto+itself.+These+Commissioners+profess+that+they+have+authority+to+discharge+other+ecclesiastical+judicatories+within+the+kingdom+from+meddling+with+the+judging+of+anything+which+they+shall+think+impertinent+for+them%2C+and+which+they+shall+think+good+to+judge+and+decide+by+themselves+in+their+commission.+Which%2C+if+it+be+so%2C+then+%28when+it+pleases+them%29+they+may+make+other+ecclesiastical+judicatories+to+be+altogether+useless+and+of+no+effect+in+the+Church.+3.+In+this+commission%2C+ecclesiastical+and+temporal+men+are+joined+together%2C+and+both+armed+with+the+same+power.+Therefore+it+is+not+right+nor+regular%2C+nor+in+any+wise+allowable.+For+even+as+when+a+minister+has+offended+in+a+civil+matter%2C+his+fault+is+to+be+judged+by+civil+judges+according+to+the+civil+laws%2C+and+by+no+other%3A+so+when+he+offends+in+an+ecclesiastical+matter%2C+his+fault+is+to+be+judged+only+by+ecclesiastical+persons+according+to+ecclesiastical+laws%3A+and+in+such+a+case+Justinian+forbids+civil+men+to+be+joined+with+ecclesiastical+men+in+judgment+%28Novell.%2C+83%2C+ch.+1%29.+They+are+ecclesiastical+things+or+causes+which+are+handled+and+examined+by+the+High+Commission+in+the+process+of+deposing+ministers%3A+and+a+shame+it+is+to+ecclesiastical+men+if+they+can%2C+without+the+help+and+joining+of+temporal+men%2C+judge+and+decide+things+of+this+quality.+4.+As+in+the+matters+to+be+judged%2C+so+in+the+censures+and+punishments+to+be+inflicted%3B+ecclesiastical+and+civil+men+have+in+this+Commission+alike+power+and+authority%3A+for+ecclesiastical+men+therein+have+power+of+fining%2C+confining%2C+warding%2C+etc.+common+to+them+with+the+temporal+men%3A+and+again%2C+the+temporal+men+have+power+of+excommunication%2C+suspension%2C+deprivation%2C+etc.+common+to+them+with+the+ecclesiastical+men.+For+they+all+sit+there+as+the+king%E2%80%99s+commissioners%2C+and+so+nomine+%5Bby+name%5D+they+exerce+this+jurisdiction%3A+which+Commission+being+alike+discharged+by+them+all%2C+it+is+manifest+that+both+temporal+men+take+hold+of+the+keys+and+ecclesiastical+men+take+hold+of+the+civil+sword.+And+this+monstruous+confusion+and+mixture+gives+sufficient+demonstration+that+such+a+form+of+judgement+is+not+from+the+God+of+order.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29%2C+pt.+3%2C+bk.+8%2C+Digression+4%2C+pp.+195-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c56e7c541.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6c56e7c541.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=Now%20there%20was%20brought%20forth%20in,not%20from%20the%20God%20of%20order&amp;text=Now%20there%20was%20brought%20forth%20in%20Scotland%2C%20anno&amp;text=judgement%20is%20not%20from%20the%20God%20of%20order" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

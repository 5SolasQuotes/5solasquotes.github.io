<main class="wrap"><figure class="quote" id="q-96635466a4" data-kw="">
<blockquote><p>Hence it is true that if a man shall keep the whole law, and yet offend in one point, he becomes guilty of all, because he does what is contrary to the love on which hangs the whole law. A man, therefore, becomes guilty of all by doing what is contrary to that on which all hang.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter</cite>, 167.5,16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

— Augustine of Hippo, Letter 167.5,16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+it+is+true+that+if+a+man+shall+keep+the+whole+law%2C+and+yet+offend+in+one+point%2C+he+becomes+guilty+of+all%2C+because+he+does+what+is+contrary+to+the+love+on+which+hangs+the+whole+law.+A+man%2C+therefore%2C+becomes+guilty+of+all+by+doing+what+is+contrary+to+that+on+which+all+hang.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+Letter+167.5%2C16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F96635466a4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/96635466a4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-distinction-of-venial-mortal-sin/#:~:text=Hence%20it%20is%20true%20that%20if,to%20that%20on%20which%20all%20hang&amp;text=Hence%20it%20is%20true%20that%20if%20a%20man&amp;text=is%20contrary%20to%20that%20on%20which%20all%20hang" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d7c656a53b" data-kw="">
<blockquote><p>V. (3) The question is not whether a distinction relative to the administration of divine providence in the covenant of grace in punishing the sins of believers can be admitted; whether certain sins in believers can be called mortal because they are grievous and atrocious, which more deeply wound and injure conscience, hinder the act of justifying faith and take away present fitness for the kingdom of heaven (upon which therefore he denounces wrath and indignation; yea, threatens exclusion from the kingdom of heaven and eternal death, like those treated of in 1 Cor, 6:10 and Col. 3:5); whether others, however, may be called venial, which are lighter and of daily commission, not hindering the rule and operation of grace, nor taking away the sense of God’s favor or the confidence of the pardon of sin (such as the rebellious motions of concupiscence, of which Paul complains in Rom. 7–defects and blemishes adhering even to the best works of the renewed). There are some of our party who think the distinction of mortal and venial sin can be retained in this sense, as Robert Baron, following the theologians of Great Britain, in his Judicio de Perseverantia, although it does not seem sufficiently appropriate on account of our opponents; the distinction of heavy and light sins is better. The question simply concerns the nature of sins in themselves according to the strictness of the law. We think all are mortal, none truly venial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

estion%20is%20not,all%20are%20mortal%2C%20none%20truly%20venial&amp;text=V.%20%283%29%20The%20question%20is%20not%20whether%20a&amp;text=We%20think%20all%20are%20mortal%2C%20none%20truly%20venial" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1b3756b939" data-kw="">
<blockquote><p>The Reformed on the contrary state that all the acts of concupiscence, even the primary-first, are sins, because the contrary opinion is: (1) contrary to the express words of the apostle (Rom. 7:7); (2) contrary to the express demand of the law (Ex. 20:17); (3) contrary to the force and strictness of the law, which under the penalty of an eternal curse demands the most exact obedience (Matt. 22:37; Deut. 27:26; Gal. 3:10), and therefore condemns all concupiscence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, 4.3.21</span></figcaption>

</figure><figure class="quote" id="q-89592e8220" data-kw="">
<blockquote><p>They [Romanists] disannul the last Commandment [of the Ten Commandments] by holding concupiscence before consent to be no sin, when as we know by God’s Word that the first evil motions in us are sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, (RHB), vol. 4, pp. 484-485</span></figcaption>

<blockquote><p>That which lusts against the spirit, and by lusting tempts, and in tempting entices and draws the heart to sin, is for nature sin itself: but concupiscence in the regenerate lusts against the spirit, Gal. 5. 17. … And therefore it is sin properly: such as the fruit is, such is the tree.</p></blockquote>

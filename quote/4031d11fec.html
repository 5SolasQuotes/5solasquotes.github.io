<main class="wrap"><figure class="quote" id="q-4031d11fec" data-kw="">
<blockquote><p>3. But the word [‘to justify’] is used with that specialized meaning when it concerns the judgment of God as He absolves the sinner who stands before his judgment seat (Ps. 143:2; Rom. 5:16 and 8:33-34). And so this entire act of justification is depicted as a forensic process. Yet we still grant that justification sometimes appears also to include sanctification as its consequence because of the very strong, close connection between the two (Rom. 8:30; Titus 3:7, etc.).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (1625; Brill, 2016), vol. 2, Disputation 33. ‘On the Justification of Man in the Sight of God’, pp. 305-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-443db5b103" data-kw="">
<blockquote><p>How have we used the mercies which are taken from us? Yea God Himself will judge us according to our works! He will not justify us, if we have been unfaithful in our little, and have been such as Satan and his instruments, the accusers of the brethren, do report us. But if we have been faithful we may expect his double justification: 1 By pardon He will justify us from our sins. 2. By plea and righteous sentence He will justify us against the false accusations of our enemies. And that’s enough. How small a thing should it seem to us, to be judged of man, who must stand or fall to the final sentence of the Almighty God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Farewell Sermon prepared to have been preached to his hearers at Kidderminster at his Departure, but Forbidden</cite>, (1660; London: 1683), pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-4e82b1b8ef" data-kw="">
<blockquote><p>…once vile sinners, now washed, sanctified and justified: as soon as they believe, they are put into a state of acceptation [Greek], that is, justifying, He continues to justify them unto the death, and He keeps them in that estate wherein they have exemption from the punishment of sin and a right to eternal life… All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christ’s blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, pp. 334-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

%20obedience&amp;text=once%20vile%20sinners%2C%20now%20washed%2C%20sanctified%20and%20justified&amp;text=will%20live%20in%20a%20course%20of%20new%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a8da22ef85" data-kw="">
<blockquote><p>For the beginning of justification is the knowledge of sin and the fear of divine judgment. The consummation of justification is faith and peace of conscience which the Holy Spirit alone has sown in the heart, as I have said above in the section that deals with the law and Gospel.</p></blockquote>

</figure><figure class="quote" id="q-8d2d2850a6" data-kw="">
<blockquote><p>Neither does faith justify as the beginning of justification only: first, because there are no degrees of justification before God; for in the first act it is perfect: and to that act continued throughout this life, faith, as I showed before out of diverse of the Fathers, suffices. I say, suffices to justification: and therefore is not the beginning only, but also the continuance and consummation thereof: for as in the first act it justifies, so also in the continuance of justification: for by it we stand, and by it we live, and so long as we have faith, it is imputed unto us for righteousness even from faith to faith, as it was to Abraham, after he had long continued in the faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 10, ‘Bellarmine’s Arguments…’, p. 391</span></figcaption>

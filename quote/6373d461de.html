</figure><figure class="quote" id="q-67937c6a69" data-kw="">
<blockquote><p>In regard of the justness and necessity of some things which may be the subject or matter of the usurpers’ command and the arbitrariness of others, and the lawfulness of either, not depending upon the command or warrant of a superior, but resulting out of the nature of the action itself; so that a private man might do it, were there no magistrate to command it, or no command from the magistrate for it. We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend:

1. Taking up arms for the preservation of ourselves and the country against a common enemy, upon the usurpers’ summons; the which we might do of ourselves, were there no authority; or if a just authority were in being, yet if it could not, or did not, maturely enough call us forth to it.

2. Payment of taxes and bearing other impositions for the usurping power, where, and while we are under his compulsive power, because such contributions may, and will be taken whether I will pay them or not; and I yield them under his enforcement, as a ransom for my life, or liberty, or somewhat else that is better to me than the payment; and consequently I am to choose the parting with it as the less evil, rather than with that which is better, which to loose is to incur a greater evil for the avoidance of a less…

3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me… But, in granting liberty of concurrence with some commands of an usurped authority, we neither yield any obedience at all to be due, or performable to it; nor can we allow a correspondence with it in diverse things, and therefore we are to put a difference: First, betwixt things that are in themselves necessary, and those that are of a middle or an indifferent nature in themselves considered… 2. Betwixt moral, or prudential acts competible [competent] to private men or subjects, and political acts or judicial proceedings that flow from power and authority inherent in the person that acts them, or are the issues of distributive justice, and either come forth from a person clothed with government, or unto which is requisite a stamp of authority to make them lawful, and justifiable: as to bear the office of a magistrate, or commander in civil or military affairs, or to be any under agent, or servant in carrying on, or assisting the government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers</cite>, An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC, pp. 22-25</span></figcaption>

are%E2%80%A6+%5Bpp.+411-12%5D%29+In+thus+doing%2C+I+seek+my+necessary+self-preservation%3B+neither+do+I+yield+or+ascribe+to+them+to+whom+I+have+recourse+any+just+power+of+judicature+or+participate+in+their+sin+of+usurping+it%3B+only+I+acknowledge+they+have+might+and+ability+in+their+hand+to+right+me%3B+which%2C+though+they+ought+not+to+assume%2C+yet+I+may+take+the+benefit+of+their+unjust+use+of+it%3B+as+a+poor+man+may+receive+relief+at+the+hands+of+him+that+has+gotten+those+goods+he+distributes+unjustly%3B+and+I+may+receive+my+money%2C+with+a+good+conscience%2C+from+the+hands+of+a+thief+that+is+willing+to+return+it+to+me+though+he+took+it+by+robbery+from+another+thief+that+robbed+me+of+it%3B+and+if+the+party%2C+with+whom+I+have+a+controversy+for+my+right+will+agree+to+refer+the+matter+betwixt+us+to+a+private+person+as+an+arbitrator%2C+and+stand+to+his+arbitrement%3B+that+is+a+lawful+means+of+coming+by+my+own%2C+though+by+his+help+and+award+that+has+not+claim+of+authority+over+me%E2%80%A6+But%2C+in+granting+liberty+of+concurrence+with+some+commands+of+an+usurped+authority%2C+we+neither+yield+any+obedience+at+all+to+be+due%2C+or+performable+to+it%3B+nor+can+we+allow+a+correspondence+with+it+in+diverse+things%2C+and+therefore+we+are+to+put+a+difference%3A+First%2C+betwixt+things+that+are+in+themselves+necessary%2C+and+those+that+are+of+a+middle+or+an+indifferent+nature+in+themselves+considered%E2%80%A6+2.+Betwixt+moral%2C+or+prudential+acts+competible+%5Bcompetent%5D+to+private+men+or+subjects%2C+and+political+acts+or+judicial+proceedings+that+flow+from+power+and+authority+inherent+in+the+person+that+acts+them%2C+or+are+the+issues+of+distributive+justice%2C+and+either+come+forth+from+a+person+clothed+with+government%2C+or+unto+which+is+requisite+a+stamp+of+authority+to+make+them+lawful%2C+and+justifiable%3A+as+to+bear+the+office+of+a+magistrate%2C+or+commander+in+civil+or+military+affairs%2C+or+to+be+any+under+agent%2C+or+servant+in+carrying+on%2C+or+assisting+the+government.%E2%80%9D%0A%0A%E2%80%94+Edward+Gee%2C+An+Exercitation+concerning+Usurped+Powers%3A+wherein+the+Difference+betwixt+Civil+Authority+%26+Usurpation+is+Stated.+That+the+obedience+due+to+lawful+magistrates%2C+is+not+owing%2C+or+payable%2C+to+usurped+powers%2C+is+maintained.+The+obligation+of+oaths+and+other+sanctions+to+the+former%2C+notwithstanding+the+antipolity+of+the+latter+is+asserted.+And+the+arguments+urged+on+the+contrary+part+in+diverse+late+printed+discourses+are+answered%2C+An+Exercitation+concerning+Usurped+Powers%3A+wherein+the+Difference+betwixt+Civil+Authority+%26+Usurpation+is+Stated.+That+the+obedience+due+to+lawful+magistrates%2C+is+not+owing%2C+or+payable%2C+to+usurped+powers%2C+is+maintained.+The+obligation+of+oaths+and+other+sanctions+to+the+former%2C+notwithstanding+the+antipolity+of+the+latter+is+asserted.+And+the+arguments+urged+on+the+contrary+part+in+diverse+late+printed+discourses+are+answered%E2%80%A6+%28London%2C+1650%29+88+pp.+ToC%2C+pp.+22-25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67937c6a69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67937c6a69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=In%20regard%20of%20the%20justness%20and,carrying%20on%2C%20or%20assisting%20the%20government&amp;text=In%20regard%20of%20the%20justness%20and%20necessity%20of&amp;text=servant%20in%20carrying%20on%2C%20or%20assisting%20the%20government" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Some that live in countries where none in twenty miles openly use the New [translation of Scripture, the KJV] one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that:

1. They should keep up the New Translation as far as they can in God’s public worship, while the hurt will not be greater than the benefit.

2. That when they have no public church or worship to join with, but what uses the Old [faulty] one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit.

3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says:

1. That it is a cursed thing to offer God a worse [worship] while we have better.

2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.]

3. That it is false worship and obeying man before God.

4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them.

5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers:

I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice.

II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C.]</p></blockquote>

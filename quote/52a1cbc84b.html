<main class="wrap"><figure class="quote" id="q-52a1cbc84b" data-kw="">
<blockquote><p>4. A change from the offers of Grace, to the Revelations of Wrath: Shall thy loving kindness be declared in the grave, or thy faithfulness in destruction (says the Psalmist) in Psalm 88:11. True in the 1 Pet. 3:19-20, we read of Christ’s preaching by his Spirit to the Spirits in Prison, that is, to souls in Hell: But mark, when was it that he preach’d to them? not when in prison, but in the days of Noah, when they lived in the world. There is never an offer of grace and love made to souls in the Grave; while life lasts, the soul hears the joyful sound: And O the sweet offers, the gracious tenders, the loving invitations, that are made to him of Christ, of Grace, of Eternal Life and Love! O the wooings, the meltings, the entreatings, the allurings of Divine Love to and over the soul! but when death comes, farewell all these, farewell all the sweet offers of Christ, and all the blessed motions of the Spirit; then there’s nothing but wrath revealed, and wrath shall come on the neglecting soul to the uttermost. 5. A Change from fair probabilities to utter Impossibilities of Life and Salvation; a sad change still: Now is the accepted time, now is the day of Salvation; now, and not hereafter, 2 Cor. 6:2. Now there is a fair probability of the worst of Sinners to be saved, if they will look after Salvation, and mind their eternal Concerns; Christ is both able and willing to save: To save was the end of his coming into the World, and of all he did and suffered here, 1 Tim. 1:15. Now they are besought and entreated to be reconciled to God, 2 Cor. 5:19,20, but when Death comes, that changes these fair probabilities into utter Impossibilities of Life and Salvation. Therefore mark: Now (says the Apostle) is the day of Salvation; that is, now whilst Life lasts, and while the Gospel is preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1674(?) | The Great Concern, or A Serious Warning to a Timely and Thorough Preparation for Death (London: Printed for J. Robinson, at the Golden Lyon in St. Paul’s Church-Yard; and B. Aylmer at the three Pigeons in Cornhill, 1674), 73–75. The two quotes below were compiled by Tony Byrne</cite></span></figcaption>

<blockquote><p>Q. What difference is there betwixt the combat which is to be found in the temporary [believer], and that which is proper to the regenerate? A. Besides the remainders of God’s image, the temporary believer is endued with the common graces of the Spirit, for substance not counterfeit, though ineffectual to sanctification. He is illightened with the knowledge of divine mysteries grounded upon the Scripture, which is not altogether idle and ineffectual: He is drawn to believe in some sort and with confidence to receive the Word of the Kingdom both as true and good. He may reform himself in such sort, that it may be said Satan is cast out of him: and all this not in hypocrisy or for fear of punishment, but freely and according to the Word of grace, whereby he is moved to affect things that are above. From whence follows a combat in him far greater and of another nature than that betwixt reason and appetite, conscience and affection, or the relics of God’s image with the power of sin; even of the common graces of the Spirit with the power of corruption repressed, not mortified or killed. But the graces of the Spirit are not soundly planted, the Word of the Kingdom is not kindly received into the heart so as to rule with universal sovereignty, and to season throughout the powers of the soul. Temporary Christians make some account of God’s favor and the joys of heaven in an inferior place: but their desire of happiness is subordinate to the things of this world; in particular estimation, which is joined with choice of heart, they prefer their special delights before Christ, and will rather leave Him than leave the world, if the one of necessity must be parted with. Wherefore the will of the best unregenerate man, is still in captivity under the dominion of sin, and his heart of an earthly temper, though it be somewhat changed by the superficial receipt of the Word of Life, which it tastes, but digests not. In which respect the motions of the unregenerate in the ways of godliness may be said to be dead and accidental; because the soul is not enlivened by the Spirit of grace: but the motion of the regenerate is lively and natural, proceeding from the Spirit of grace that dwells in them, whereby they are quickened in the inner man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Power of Godliness both Doctrinally &amp; Practically handled… (London: Miller, 1657), ch. 3</cite>, p. 299</span></figcaption>

man%2C+is+still+in+captivity+under+the+dominion+of+sin%2C+and+his+heart+of+an+earthly+temper%2C+though+it+be+somewhat+changed+by+the+superficial+receipt+of+the+Word+of+Life%2C+which+it+tastes%2C+but+digests+not.+In+which+respect+the+motions+of+the+unregenerate+in+the+ways+of+godliness+may+be+said+to+be+dead+and+accidental%3B+because+the+soul+is+not+enlivened+by+the+Spirit+of+grace%3A+but+the+motion+of+the+regenerate+is+lively+and+natural%2C+proceeding+from+the+Spirit+of+grace+that+dwells+in+them%2C+whereby+they+are+quickened+in+the+inner+man.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+The+Power+of+Godliness+both+Doctrinally+%26+Practically+handled%E2%80%A6+%28London%3A+Miller%2C+1657%29%2C+ch.+3%2C+p.+299&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa820c2eadb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a820c2eadb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/common-grace/historic-reformed-quotes-on-common-grace/#:~:text=Q.%20What%20difference%20is%20there%20betwixt,are%20quickened%20in%20the%20inner%20man&amp;text=Q.%20What%20difference%20is%20there%20betwixt%20the%20combat&amp;text=whereby%20they%20are%20quickened%20in%20the%20inner%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

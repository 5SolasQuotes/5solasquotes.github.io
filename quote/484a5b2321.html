<main class="wrap"><figure class="quote" id="q-484a5b2321" data-kw="">
<blockquote><p>We distinguish of admission: It is either negative or positive; negative, is nothing else but a non-hinderance; and though there be no eldership, the minister may not hinder those whom he has no power, I mean no lawful authority to hinder. Now the minister singly by himself has no authority to hinder, keep back, or cast out scandalous persons: for so the power of jurisdiction would be seated in him alone. But now secondly, there is an admission that is positive, judicial, and implies a previous forensical examination by the eldership, as of the parties admitted, so sometimes of witnesses, and authoritative declaration of fitness: And this is to be only in collegio presbyteriali, in the college of presbyters, and properly as they are in court, but not seperatim [separated], and out of court. Now I conceive that this juridical and authoritative admission is not of absolute necessity unto administration of the Lord’s Supper. By baptism the baptized are admitted or entered into the Church-visible, 1 Cor. 12:13, ‘By one Spirit we are all baptized into one body.’ See Rutherford in his Due Right of Presbyteries, [pt. 1, ch. 9, section 9, point 7] p. 254[-55]. Now in some cases the Lord’s Supper may be administered unto those of years that are baptized without any new authoritative judicial admission of the eldership. First, this may be gathered from Acts 2:41-42. Those three thousand souls whose baptism is mentioned, verse 41, have their receiving of the Lord’s Supper recorded, verse 42, and there is not a word of any juridical admission of them by the eldership coming between their baptism and their receiving of the Lord’s Supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government… (London, 1650), p. 28 Jeanes was an English presbyterian.</cite></span></figcaption>

<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation… 3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty… 4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice… 5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful… 6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>

</figure><figure class="quote" id="q-0d733f2d51" data-kw="">
<blockquote><p>We may consider a visible Church either metaphysically or politically. It is one thing to consider men as living creatures endued with reason; another thing to consider them as magistrates, masters, fathers, children, servants, etc. So is it one thing to consider a visible Church as a society of men and women separated from the blind world by divine vocation [calling], and professing together the gospel of Jesus Christ; and another thing to consider it as a political body, in which the power of spiritual government and jurisdiction is exercised–some governing and some governed. These are very different considerations; for first, a visible Church being taken entitatively or metaphysically, her members do ordinarily communicate together in those holy things which fall under the power of order, which I may call sacra mystica [sacred, mystical rites]; but being taken politically, her members communicate together in such holy things as fall within the compass of the power of jurisdiction, which I may call sacra politica [sacred politics]. Secondly, infants under age, being initiated in baptism, are actually members of the Church in the former consideration, but potentially only in the latter; for they neither govern, nor yet have the use of reason to be subject and obedient to those that do govern.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland… (1641; Edinburgh, 1646), 2nd part, ch. 11</cite>, p. 62</span></figcaption>

</figure><figure class="quote" id="q-e7eebfd8b2" data-kw="">
<blockquote><p>1st Conclusion. An adjoining to a visible Church either formally to be a member thereof, or materially, confessing the Faith of the true visible Church, God offering occasion, is necessary to all: 1. Because we are to be ready to give a confession of the hope that is in us, to every one who asks, 1 Pet. 3:15. 2 Because he who denies Christ before men, him also will Christ deny before the Father and before the holy angels, Mt. 10:33. 3. Yet if some die without the Church, having faith in Christ, and want opportunity to confess Him before men, as repenting in the hour of death, their salvation is sure, and they are within the invisible Church: so is that to be taken, extra Ecclesiam nulla salus, none can be saved who are every way without the Church, both visible and invisible; as all perished who were not in Noah’s Ark. 2nd Conclusion. When God offers opportunity, all are obliged to join themselves to a true visible Church: 1. Because God has promised his presence to the Churches as his Son walks in the midst of the golden candlesticks, Rev. 2:2. 2. Because faith comes by hearing a sent preacher, Rom. 10:4. 3. Separation from the true visible Church is condemned, Heb. 10:24; Jude v. 19; 1 Jn. 2:19. 4. Good men esteem it a rich favour of God to lay hold on the skirt of a Jew, Zech. 8:23, and to have any communion, even as a door keeper in God’s House, and have desired it exceedingly and complained of the want thereof, Ps. 84:10. v. 1-2; Ps. 27:4; Ps. 42:1-4; Ps. 63:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries... (London: 1644), pt. 1</cite>, p. 79</span></figcaption>

<blockquote><p>Profession of Christianity is every man’s Church-title. No man is to prove the sincerity of his own profession; nor may the Church require such proof at his hands; For how can a man prove to another the sincerity of his own heart? But the fuller testimony he gives of it, the better it is: And therefore none should refuse to make his own profession, as fully credible to the church as he is able; nor is the church to be blamed for enquiring after the fullest credibility, so be it they do it but ad melius esse [to the better existence], and not ad esse [to the existence of it]; not laying his title upon it, nor refusing him for want [lack] of it. But every profession as such is credible in some degree, which is not disproved. Because men are, under God, the only competent judges of their own hearts: and the belief of one another is the ground of human converse: And it is an injury to any man to account him a liar, without sufficient proof. He that will disprove a man’s profession must prove first that he does not tolerably understand what he says; secondly, or that he speaks not seriously, but in jest; or not voluntarily, but in hypocrisy by constraint, or for some by end: Thirdly, or that he contradicts his own words by some more credible words or deeds. And if you never yet thus disproved men’s profession of Christianity before the pastors of the church and yet cry out against the pastors for admitting them, you are not true reformers, but disorderly mutineers and peevish censurers in the Church of Christ. Christ’s orders and men’s right, and all church-justice, must not be trodden down and sacrificed to your humor and arbitrary way.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9294436715" data-kw="">
<blockquote><p>Controversy V: Are good works necessary? Position of [the Romanist Robert] Bellarmine: Good works are necessary not only by necessity of presence but also of efficiency, as Scripture, the Church Fathers, and sound reason teach. Orthodox Position: Good works do not precede the justified but necessarily follow him and precede the one who will be saved. They are necessary for adults in an orderly manner, by hypothesis or necessity:

1. Of presence, as signs and effects of faith.

2. Of divine commandment.

3. Of means, for they are the way to salvation, condition, and sine qua non cause. Therefore, if Bellarmine does not understand efficiency as some merit or inherent force and dignity of good works in obtaining salvation, this phrase can be admitted. Good works contribute to attaining eternal life, but not by merit. Therefore, the apparatus of arguments reported here is useless.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-555fb85697" data-kw="">
<blockquote><p>When therefore, we say that the faithful are esteemed just even in their deeds this is not stated as a cause of their salvation, and we must diligently notice that the cause of salvation is excluded from this doctrine; for, when we discuss the cause, we must look nowhere else but to the mercy of God, and there we must stop. But although works tend in no way to the cause of justification, yet, when the elect sons of God were justified freely by faith, at the same time their works are esteemed righteous by the same gratuitous liberality. Thus it still remains true, that faith without works justifies, although this needs prudence and a sound interpretation; for this proposition, that faith without works justifies is true and yet false, according to the different senses which it bears. The proposition, that faith without works justifies by itself, is false, because faith without works is void. But if the clause “without works” is joined with the word “justifies,” the proposition will be true. Therefore faith cannot justify when it is without works, because it is dead, and a mere fiction. He who is born of God is just, as John says. (1 John v. 18.) Thus faith can be no more separated from works than the sun from his heat: yet faith justifies without works, because works form no reason for our justification; but faith alone reconciles us to God, and causes him to love us, not in ourselves, but in his only-begotten Son.</p></blockquote>

<blockquote><p>(6) They [good works] are necessary to the attainment of salvation, not in any sense as a prerequisite to justification, nor in any stage of the believer’s progress meriting the divine favor, but as essential elements of that salvation, the consubstantial fruits and means of sanctification and glorification. A saved soul is a holy soul, and a holy soul is one whose faculties are all engaged in works of loving obedience. Grace in the heart cannot exist without good works as their consequent. Good works cannot exist without the increase of the graces which are exercised in them. Heaven could not exist except as a society of holy souls mutually obeying the law of love in all the good works that law requires. Eph. v. 25 — 27; 1 Thess. iv. 6, 7; Rev. xxi. 27.</p></blockquote>

<blockquote><p>‘Blessed are they that do his commandments, that they may have right to the tree of life, and may enter in through the gates into the city.’ And lest we should think the commands are all but one only precept of believing, he addeth “for without are dogs and sorcerers, and whoremongers, and murderers, etc.” “He that hath my commandments, and keepeth them, he it is that loveth me, and he that loveth me shall be loved of my Father, and I will love him and manifest myself to him.</p></blockquote>

<blockquote><p>But if we attend to the four kinds of causes which philosophers bring under our view in regard to effects, we shall find that not one of them is applicable to works as a cause of salvation. The efficient cause of our eternal salvation the Scripture uniformly proclaims to be the mercy and free love of the heavenly Father towards us; the material cause to be Christ, with the obedience by which he purchased righteousness for us; and what can the formal or instrumental cause be but faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.17</span></figcaption>

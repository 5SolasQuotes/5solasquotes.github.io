<main class="wrap"><figure class="quote" id="q-02c9b8703e" data-kw="">
<blockquote><p>The nature of man since the fall is so corrupt and depraved, that even when Christ is made known and preached to him, he will not come to Him and believe in Him, without the special grace of God inclining his will and giving him a disposition to come. Moral suasion and advice alone will not bring him. He must be “drawn.” This is no doubt a very humbling truth, and one which in every age has called forth the hatred and opposition of man. …

The doctrine of human impotence, whether man likes it or not, is the uniform teaching of the Bible. The natural man is dead, and must be born again, and brought to life. (Ephesians ii. 1.) He had neither knowledge, nor faith, nor inclination toward Christ, until grace comes into his heart. Man never of himself begins with God. God must first begin with man. And this beginning is just the “drawing” of the text.

The more the holiest Christians are examined, the more general is their testimony found that without grace they never would have been converted, and that God “drew” them, or else they never would have come to Christ. And it is a curious fact moreover, that many who profess to deny man’s impotence in theory, often confess it in their prayers and praises, almost in spite of themselves. Many people are very low Arminians in print or in the pulpit, but excellent Calvinists on their knees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels: John, Volume One</cite>, (1869; Edinburgh: Banner of Truth, 1987), pp 388-89.</span></figcaption>

<blockquote><p>God, by way of an agreement [pacto], willed our salvation by a simple love [affectu] and that salvation is pleasing to him, so that unless sins hinder it, he effectually wills it… therefore because of this mixed [implicitae] will under a condition, we say that God has a conditional will, or as they say, willingness [velleitatem].</p></blockquote>

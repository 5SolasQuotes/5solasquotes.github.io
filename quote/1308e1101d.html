<blockquote><p>29. Furthermore, we do not say that the Gospel and the New Testament demand no condition at all, for the condition of faith and new obedience (which is everywhere impressed on us) is demanded. But God provides these conditions freely, and their imperfect quality forms no hinderance to salvation (which flows from another source), so long as they are genuine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, ed. te Velde, Dolf – Synopsis of a Purer Theology (1625; Brill, 2015), vol. 1, Disputation 23, §29, p. 597 “New obedience” is likely being referred to as a condition, not of justification, but of final salvation.</span></figcaption>

<blockquote><p>36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical. 37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in an identical sense. 38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>

</figure><figure class="quote" id="q-e4fedbc9a0" data-kw="">
<blockquote><p>It will be said by such a believer that my change of view was too rationalistic, too cerebral, too bloodless, too focused on a theoretical knowledge of the God of the philosophers rather than a personal response to the God of Abraham, Isaac, and Jacob. But the dichotomy is a false one, and the implied conception of the relationship between faith and reason not only foolish but heterodox. As to the heterodoxy and foolishness of fideism, and the correct understanding of the relationship of faith and reason, I have addressed that set of issues elsewhere. As to the ‘heart versus head’ stuff, it seems to me to rest on an erroneous bifurcation of human nature. Man is a unity, his rationality and animality, intellect and passions, theoretical and moral lives all ultimately oriented toward the same end… …that does not mean that the will does not have a role to play. But that is true wherever reason leads us to a conclusion we might not like, not merely in matters of religion. And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real. If you find yourself intellectually convinced that there is a divine Uncaused Cause who sustains the world and you in being at every instant, and don’t find this conclusion extremely strange and moving, something that leads you to a kind of reverence, then I dare say you haven’t understood it. Of course, there are those whose heads and hearts are so out of sync that they cannot follow both at the same time. But we shouldn’t mistake this pathology for an insight into human nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 9, ‘The Road from Atheism’, pp. 213-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>Controversy II: What is justifying faith? Thesis: Faith is general or special. General faith is common to both the reprobate and the elect, being historical, miraculous, and temporary. Special faith, called justifying, is a confident acceptance that depends on the mercy of God in Jesus Christ. Its subject or seat, according to some orthodox theologians, is the intellect (like Perkins); others say it is the intellect and will together or the soul (like Polanus, Tilenus, etc.). These opinions can be reconciled by saying that justifying faith resides formally and properly in the practical intellect. It is a certain and firm knowledge of the grace of God, by which the elect man applies to himself the promise of grace in Christ. As for the confidence with which we rest in God as gracious to us, it arises from faith, that is, from this special knowledge. Thus, popularly, it can be said that faith is a light in the intellect, and confidence is in the will or the heart. The common object of faith is the written word of God; the proper object is the Gospel, or Christ. Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure: 1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed. 2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent. 3. The Church Fathers also describe saving faith in this way and recognize the special and infallible certainty of faith; as Augustine says: “There is a way of glorying in the conscience, and you shall know that your faith is sincere, your hope certain, and your charity without simulation.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“Controversy II: What is justifying faith? Thesis: Faith is general or special. General faith is common to both the reprobate and the elect, being historical, miraculous, and temporary. Special faith, called justifying, is a confident acceptance that depends on the mercy of God in Jesus Christ. Its subject or seat, according to some orthodox theologians, is the intellect (like Perkins); others say it is the intellect and will together or the soul (like Polanus, Tilenus, etc.). These opinions can be reconciled by saying that justifying faith resides formally and properly in the practical intellect. It is a certain and firm knowledge of the grace of God, by which the elect man applies to himself the promise of grace in Christ. As for the confidence with which we rest in God as gracious to us, it arises from faith, that is, from this special knowledge. Thus, popularly, it can be said that faith is a light in the intellect, and confidence is in the will or the heart. The common object of faith is the written word of God; the proper object is the Gospel, or Christ. Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure: 1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed. 2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent. 3. The Church Fathers also describe saving faith in this way and recognize the special and infallible certainty of faith; as Augustine says: “There is a way of glorying in the conscience, and you shall know that your faith is sincere, your hope certain, and your charity without simulation.”

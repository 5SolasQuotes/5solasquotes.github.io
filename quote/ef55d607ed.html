<main class="wrap"><figure class="quote" id="q-ef55d607ed" data-kw="">
<blockquote><p>Accordingly, Rivet rejected the medieval quadriga [four-fold interpretation] and argued that the source of all theological conclusions was the literal sense of the text ([Isagogue] chap. 14[:1; C.f. 15:20]). At the same time, he recognized that the literal sense of Holy Scripture included various figures and types; yet allegories, tropes, and anagogy he understood as false readings when they were imposed on the text rather than being identified as integral to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/about-andrew-rivet.html">About Andrew Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Willem van Asselt in Theology of the French Reformed Churches</cite>, (RHB, 2014), p. 261</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-721cb5dffe" data-kw="">
<blockquote><p>We believe that Holy Scripture has one true and authentic meaning, but this meaning can be twofold, either simple or composite. … That there is a single meaning to Scripture is evident (1) from the unity of truth, because truth is single (unicus) and simple (simplex), and for that reason does not admit of several meanings, which would make it uncertain and ambiguous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.19.2</span></figcaption>

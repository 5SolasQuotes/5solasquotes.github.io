<blockquote><p>And he, loving your persons, and hating only the sin, his hatred shall all fall, and that only upon the sin, to free you of it by its ruin and destruction, but his affections shall be the more drawn out to you; and this as much when you lie under sin as under any other affliction.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c1d14f854" data-kw="">
<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, … (1637), | ‘To All &amp; Every One in the Reformed Churches…’, no page number</span></figcaption>

<blockquote><p>‘Complying’ also is an ambiguous word: if it mean an approbation of any sin, so no man must comply. If it mean communicating in good where there is a faulty mixture of some evil, so he that will not comply must join with no Church and with no man living.</p></blockquote>

</figure><figure class="quote" id="q-32aa7ad0f8" data-kw="">
<blockquote><p>Princes therefore may not suffer bishops to usurp the power of suspending and depriving at their pleasure [as that belongs to presbyteries], and whensoever they commit any such tyranny in smiting of their fellow servants, it is the part of princes to cause these things to be redressed, and for this end graciously to receive the grievances of oppressed ministers. The Arians of old beeing assembled in a Council at Antioch [A.D. 341] (Canon 11), decreed that if any ecclesiastical person should, without the advice and the letters of the bishops of the province, and chiefly of the Metropolitan, go to the emperour to put up any grievance unto him, he should be cast out, not only from the holy communion, but from his proper dignity which he had in the Church. Whereupon Osiander has this observation (Hist. Eccl., Century 4, bk. 2, ch. 48, p. 242): ‘This canon also was composed against holy Athanasius: for Athanasius being expelled by the Arians, had fled to the Emperour Constantine the younger, and had from him obtained a return to his own Church. Now this canon is very unjust, which forbids that a bishop or any other minister of the Church, being unjustly oppressed, flee to his godly civil magistrate: since it was lawful to the apostle paul to appeal to the Roman Emperor, wicked Nero, as the acts of the apostles witness. But it may be seen in this place, that bishops were very soon seeking dominion, yea tyranny over the Church and over their colleges [ecclesiastical assemblies].&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, bk. 8, Digression 4, pp. 194-5</span></figcaption>

</figure><figure class="quote" id="q-b57ddc9abb" data-kw="">
<blockquote><p>[T]he purity and power of religion alone, doth truly honour all honours, dignify all dignities, actuate with acceptation and life all moral virtues and endowments of art, sweeten all government, strengthen all states, settle fast all imperial crowns upon princes’ heads. It is no humorous conceit, but a matter of sound consequence, that all, either personal duties, or employments of state, are by so much the better performed, by how much the men are more religious from whose abilities the same proceed. When heaven is made too much to yield to earth, piety to policy, public good to private ends, there authority is embittered, inferiors plagued, and, too often, law and justice turned into wormwood and rapine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>General Directions for a Comfortable Walking with God</cite>, (1626; Ligonier PA: Soli Deo Gloria, 1991), xv-xvi.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-77047bdab6" data-kw="">
<blockquote><p>…the Lutherans could not speak of any reward and exaltation for Christ. For according to them, the human nature of Christ shared in the divine attributes of omnipresence, omniscience, and omnipotence already from the moment of the incarnation. It therefore first received these attributes not as a reward for the mediatorial work done in the state of humiliation but already before hand, in virtue or its union with the divine nature, and also kept them throughout, be it that in his humiliation Christ did not make use of them, at least no public use. The exaltation was not a true and real exaltation, but only a matter of using, or publicly using, that which He already possessed from the beginning. It was not the outcome of an antecedent human development but merely a glorious manifestation of what He already was and possessed in secret.ª ª J. Gerhard, Loci theologici, ed. E. Preuss, 9 vols. (Berlin: G. Schlawitz, 1863-75), IV, 329; J. Quenstedt, Theologia, III, 324; D. Hollaz, Examen, 748; J.F. Buddeus, Inst. theol., 787.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 3.433</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9713d497d0" data-kw="">
<blockquote><p>Nor ought it to be doubted that condign merit can vary in these three ways. For if some work were much inferior to the reward promised by agreement—as if the lord of a vineyard hired laborers and promised as wages, not a denarius a day, but a hundred gold pieces—such merit would be ex condigno by reason of the pact, not by reason of the work. Conversely, if the work were really equal to the reward, or perhaps even greater, but no agreement had intervened, then if such merit ought to be called ex condigno, it would have to be called ex condigno by reason of the work, not by reason of the pact. … Finally, if a pact both intervenes and the work is truly equal to the reward, as when laborers are hired for the vineyard for a denarius a day according to the Gospel, that merit will be ex condigno by reason of the work and by reason of the pact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-7ee8450474" data-kw="">
<blockquote><p>If any one saith, that the good works of one that is justified are in such manner the gifts of God, as that they are not also the good merits of him that is justified; or, that the said justified, by the good works which he performs through the grace of God and the merit of Jesus Christ, whose living member he is, does not truly merit increase of grace, eternal life, and the attainment of that eternal life,-if so be, however, that he depart in grace,-and also an increase of glory; let him be anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, can. 32</span></figcaption>

</figure><figure class="quote" id="q-652eea1381" data-kw="">
<blockquote><p>The eighth question is, whether Christ by his obedience merited anything for Himself. Here Quenstedt attacks Lombard, Thomas, Socinus, and others, That Christ merited only for us follows not only from the dignity of his Person, but from the communicatio idiomatum, whereby his human nature (except so far as our redemption required) lacked nothing. Besides, if He merited worship for Himself, how then could He have been worshipped in his earthly life? Moreover, as his merit and satisfaction are really one, if He merited for Himself, then He also satisfied for Himself. As to the name above every name, He had it already by right. Quenstedt repeats against the Romanists the argument of Calvin, that they confound the relation of antecedent and consequent with that of cause and effect. To the Socinian argument, that if Christ did not merit for Himself He could not merit for us, he replies that He could do this, just because He was not mere man, but God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english.html">Robert Franks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of the Doctrine of the Work of Christ</cite>, On Quenstedt</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-e7e46bfbc0" data-kw="">
<blockquote><p>But it does not follow that God owes anything to us, because he renders righteously what he renders; for he is righteous even in those acts of kindness which are of free grace. And he &quot;renders the reward&quot; which he has promised, not because we take the lead by any act of obedience, but because, in the same course of liberality in which he has begun to act toward us, he follows up his former gifts by those which are afterwards bestowed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Timothy, Titus, and Philemon</cite>, 2 Timothy 4:8</span></figcaption>

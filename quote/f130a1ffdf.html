<main class="wrap"><figure class="quote" id="q-f130a1ffdf" data-kw="">
<blockquote><p>One hopes that reviews like this will become a thing of the past, as neo-Calvinist anxieties about the Protestant retrieval of 17th century Reformed thought subside. Retrieval has increasingly revealed that, despite the diversity in the doctrinal development of the 17th century, the distinctives of neo-Calvinism have no place in that diversity, nor could they arise logically from that diversity. Reformed theology, from Calvin to the 19th century, was thoroughly “dualistic” – affirming distinctions between natural/supernatural, nature/grace, reason/faith, temporal/eternal, earth/heaven, and secular/sacred. Reformed theology did not reject these medieval categories as popish errors, let alone as paganistic. They incorporated them in their theological systems, modifying them as they saw fit, and these became essential to their system’s coherence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-wolfe.html">Stephen Wolfe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Correcting Theologians: A Response to Brian Mattson’</cite>, (2023)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

<blockquote><p>Wherefore there remaineth two rules for to judge of spirits. One is, if the opinions, as touching faith be retained perfect and pure. And this meant John when he said: ‘If any man confess the Lord Jesus,’ etc. And this confession of opinions must be examined by the holy Scriptures: the which seeing they had not in the Church at the beginning, as concerning the New Testament, they were examined by the words and doctrine of the apostles. Therefore John a little after says: ‘He that is of God heareth us, and he that heareth not us is not of God.’ Then he adds, that thus we do prove the spirit. Another rule is of manners and life: This did Christ express when he said: ‘By their fruits ye shall know them.‘ And as opinions are known by examining of them with the Scriptures, so life and manners should be tried by the discipline of the Church… In the primative Church a gift was extant whereby it might easily be known with what spirit they which did speak were led. By these means Satan was resisted when he transformed himself into an angel of light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Discerning of Spirits’ in The Common Places</cite>, … (London: Henrie Denham et al., 1583), pt. 4, ch. 4, ‘Of Ecclesiastical Laws’, pp. 45-46, p. 46</span></figcaption>

<blockquote><p>But in the letter to the Romans [12:7-8] and in the first letter to the Corinthians [12:28], he lists others [other offices besides those of the Word], as powers [miracles], the gift of healing, interpretation, government, and caring for the poor. Two of these I omit as being temporary, for it is not worthwhile to tarry over them. But two of them are permanent: government [ruling elders] and caring for the poor [deacons].</p></blockquote>

</figure><figure class="quote" id="q-b57b819614" data-kw="">
<blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: … 144. That there are revelations and visions in these times, yea to some they are more ordinary, and shall be to the people of God, generally within a while. 145. That the gift of miracles is not ceased in these times, but that some of the sectaries have wrought miracles, and miracles have accompanied them in their baptism, etc. and the people of God shall have power of miracles shortly. 146. That anointing the sick with oil by the Elders praying over them, with laying on of hands [James 5], is a Church-ordinance for Church-members that are sick, for their recovery. 147. ‘Tis ordinary for Christians now in these days, with Paul to be rapt up to the third Heavens, and to hear words unutterable, and they cannot well have assurance of being Christians, that have not found and had experience of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna, or a Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time, Vented &amp; Acted in England in these Four Last Years</cite>, … (London, 1646), pp. 15, 28</span></figcaption>

f%20this" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-20c8220a8a" data-kw="">
<blockquote><p>There is no more ground for such a ministration in this life [of the Spirit without Church ordinances] than there is for no death, no crying, no sorrow, no pain in this life, Rev. 21:4, no sun, nor moon, v. 23, no unclean thing, no sin, v. 27 and no more warrant for delivering up the Kingdom, in this life, 1 Cor. 15, than for the Resurrection of the Dead, 23:37, and the blowing of the Last Trumpet, [v.] 52, and the swallowing up of death in victory, 55-57, as if all these should come to pass in this life agreeable to this, says H. Nicholas, Evangel. ch. 35. sec. 9. In which Resurrection of the Dead, God shows unto us that the time is now fulfilled, that his dead, or the dead which are fallen asleep in the Lord, rise up in this day of his judgement and appear unto us in godly glory, which shall also henceforth live in us everlastingly with Christ, and reign upon the earth, wherein the Scripture comes to be fulfilled in this present day. And Saltmarsh wills these that are as spiritual as himself and his Familists, to believe this and receive it, that is, except, we make shipwreck of faith and say the Resurrection is past in this life, as did Hymeneus and Philetus, we are all legal, literal men and void of the Spirit. 2. Saltmarsh is unwilling to contradict the truth of God, 1 Cor. 15:24, too openly, to wit, that in the end the Kingdom shall be delivered up: Now whether this be meant of Christ’s reigning no more in his Church in this life by ordidinances, or as Chrysostom does expound the place, it be the rendering up to the Father his conquished and purchased people, as it is most agreeable to Eph. 5:27, I dispute not now, but Saltmarsh says faintly, This is not only done on the whole body of Christ at the last, but also here. He dares not say this rendering up is not only at the Last Day, but also in this life; yet the apostle is clear, he thought of no rendering up of the Kingdome in this life, as Saltmarsh by this new spirit supposes, for the text is clear, v. 22-23, every man shall rise again from the dead, Christ first and then his members [Greek], ‘Then is the end when He shall deliver up the Kingdom to the Father.’ Then: [1.] there is no rendering up till the dead in Christ be raised, vv. 23-24, but the dead in Christ in their bodies (of which undoubtedly the apostle speaks, 1 Cor. 15:1-4, etc. do not rise in this life. 2. This rendering up is not till the end, then shall the end be. 3. It is when all rule and authority shall be put down, v. 27; this is not in this life. 4. It is when the last enemy shall be subdued, v. 26. 5. When God shall be all in all, v. 28. These are not in this life, therefore Saltmarsh dreams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 34, ‘A taste of the wild allegoric interpretations of Scripture that are in this piece of Saltmarsh, which he fathers upon the pure immediate actings of the Spirit beyond Law and Gospel’, pp. 287-88</span></figcaption>

is new spirit supposes, for the text is clear, v. 22-23, every man shall rise again from the dead, Christ first and then his members [Greek], ‘Then is the end when He shall deliver up the Kingdom to the Father.’ Then: [1.] there is no rendering up till the dead in Christ be raised, vv. 23-24, but the dead in Christ in their bodies (of which undoubtedly the apostle speaks, 1 Cor. 15:1-4, etc. do not rise in this life. 2. This rendering up is not till the end, then shall the end be. 3. It is when all rule and authority shall be put down, v. 27; this is not in this life. 4. It is when the last enemy shall be subdued, v. 26. 5. When God shall be all in all, v. 28. These are not in this life, therefore Saltmarsh dreams.”

— Samuel Rutherford, A Survey of the Spiritual Antichrist... (London, 1648) | pt. 1 | ch. 34, ‘A taste of the wild allegoric interpretations of Scripture that are in this piece of Saltmarsh, which he fathers upon the pure immediate actings of the Spirit beyond Law and Gospel’, pp. 287-88">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+no+more+ground+for+such+a+ministration+in+this+life+%5Bof+the+Spirit+without+Church+ordinances%5D+than+there+is+for+no+death%2C+no+crying%2C+no+sorrow%2C+no+pain+in+this+life%2C+Rev.+21%3A4%2C+no+sun%2C+nor+moon%2C+v.+23%2C+no+unclean+thing%2C+no+sin%2C+v.+27+and+no+more+warrant+for+delivering+up+the+Kingdom%2C+in+this+life%2C+1+Cor.+15%2C+than+for+the+Resurrection+of+the+Dead%2C+23%3A37%2C+and+the+blowing+of+the+Last+Trumpet%2C+%5Bv.%5D+52%2C+and+the+swallowing+up+of+death+in+victory%2C+55-57%2C+as+if+all+these+should+come+to+pass+in+this+life+agreeable+to+this%2C+says+H.+Nicholas%2C+Evangel.+ch.+35.+sec.+9.+In+which+Resurrection+of+the+Dead%2C+God+shows+unto+us+that+the+time+is+now+fulfilled%2C+that+his+dead%2C+or+the+dead+which+are+fallen+asleep+in+the+Lord%2C+rise+up+in+this+day+of+his+judgement+and+appear+unto+us+in+godly+glory%2C+which+shall+also+henceforth+live+in+us+everlastingly+with+Christ%2C+and+reign+upon+the+earth%2C+wherein+the+Scripture+comes+to+be+fulfilled+in+this+present+day.+And+Saltmarsh+wills+these+that+are+as+spiritual+as+himself+and+his+Familists%2C+to+believe+this+and+receive+it%2C+that+is%2C+except%2C+we+make+shipwreck+of+faith+and+say+the+Resurrection+is+past+in+this+life%2C+as+did+Hymeneus+and+Philetus%2C+we+are+all+legal%2C+literal+men+and+void+of+the+Spirit.+2.+Saltmarsh+is+unwilling+to+contradict+the+truth+of+God%2C+1+Cor.+15%3A24%2C+too+openly%2C+to+wit%2C+that+in+the+end+the+Kingdom+shall+be+delivered+up%3A+Now+whether+this+be+meant+of+Christ%E2%80%99s+reigning+no+more+in+his+Church+in+this+life+by+ordidinances%2C+or+as+Chrysostom+does+expound+the+place%2C+it+be+the+

<main class="wrap"><figure class="quote" id="q-60059685a9" data-kw="">
<blockquote><p>However, from the fact that the apostle assigns death to consummated sin, the Romanists wrongly infer that non-consummated sin is not worthy of death, but only of temporal punishments, that is, so that they may hold to venial sin, and from that, their purgatory. They attend too little to the fact that the apostle does not say that only sin consummated by the full consent of the will gives birth to death, since elsewhere Paul assigns death to concupiscence (Rom. 7:5), namely that concupiscence which he did not know was sin (v. 7). Accordingly, he intends only that consummated sin gives birth preeminently to death, insofar as it includes two degrees of sin, internal as well as external.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 2, pp. 490-91</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41214a3615" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, 4.3.21</span></figcaption>

</figure><figure class="quote" id="q-9843bb9a1a" data-kw="">
<blockquote><p>VII. It [sin] is a deviation of human action (Mic. 6:8), whereas although their own law of nature is prescribed for brute beasts and inanimate objects (Jer. 8:7; Deut. 32:11; Isa. 1:3; Prov. 6:6), from which they can in some sense fall short, yet whenever this happens, there is not committed by them sin in the proper sense, as in the case when the earth does not produce its fruits, or when the digestion of the stomach or liver fails; yet because they do not have the moral law, and do not acknowledge their own natural law, nor can they order themselves to it, but rather are ordered and determined by another, properly speaking they neither deviate nor sin. Nor is it any hindrance to this that now and then they are said to be punished (Gen. 3:15; 9:5; Lev. 20:15–16; Ex. 21:28). For that penalty, pronounced thus catechrestically, in detestation of the material fact itself, through the body of that beast assails its owner. Nor also does their demise argue for sin, but for a fragile nature, enlarged by the occasion of human sin (Gen. 3:17; Rom. 8:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 7, pp. 492-93</span></figcaption>

<blockquote><p>The devil begins and disputes thus. “You, O wretched man, are a most grievous sinner. Therefore, you are but a damned wretch.” The conscience answers and says, “I know that Christ has made a satisfaction for my sins, and freed me from damnation.” The devil replies again thus: “Though Christ has freed you from death by His death, yet you are quite barred from heaven because you never did fulfill the law.” The conscience answers, “I know that Christ is my righteousness and has fulfilled the law for me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience</cite>, 8:81.</span></figcaption>

</figure><figure class="quote" id="q-86ce0050dd" data-kw="">
<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.3</span></figcaption>

</figure><figure class="quote" id="q-127407a87b" data-kw="">
<blockquote><p>CHAP. XXXVII. CONCERNING THE SECOND DEGREE OF THE DECLARATION OF GODS LOVE. The second degree, is Justification, whereby such as believe, are accounted just before God, through the obedience of Christ Jesus. 2. Cor. 5. 21. He has made him to be sin for us, who knew no sin: that we should be made the righteousness of God in him. 1. Cor. 1. 30. Rom. 5. 19. As by one man’s disobedience many were made sinners, so by the obedience of one (that is, Jesus Christ) shall many also be made righteous. Quest. Whether did Christ perform full obedience to the Law, for us men alone, or for himself also? Answ. I. Not for himself, as some not rightly would have him: for the flesh of Christ being hypostatically united to the Word, and so in it self fully sanctified, was even from the first moment of conception, most worthy to be blessed with eternal life. Therefore, by all that obedience which he performed after his conception, Christ merited nothing for himself. II. For us, namely, for the faithful, he fulfilled all the righteoussness of the law and hence it is, that he is called the end of the law unto righteousness, to every one who believes, Rom. 10. 4. Here may be objected: I. Christ as he is man, is bound to perform obedience to the law for himself. Answ. He is not bound by nature, but of his own accord: for he was not a mere man, but God and man. And albeit Christ did never suffer nor fulfill the law, but in that flesh which he took upon him; yet by reason of the hypostatical union, this his passion and obedience has respect unto the whole person, considered as God and man, and therefore his obedience was not due on his part, and so was without merit to himself yea, in that the flesh of Christ is united to the person of the Word, and so exalted in dignity and sanctity, above all angels, it may seem to be exempted from this natural obligation of performing the law. II. Object. If then Christ performed the law for us, we are no more bound to the observance of the same: as we do not undergo eternal punishments for our sins, the which Christ in his person did bear upon the cross. Answer. If we keep the same respect of performing obedience to the law, the consequence is very true, otherwise it is not so: for Christ performed obedience to the law for us, as it is the satisfaction of the law: but the faithful they are bound to obedience, not as it is satisfactory, but as it is a document of faith, and a testimony of their gratitude towards God, or a means to edify their neighbours: even as Christ suffering eternal punishments for our sins, we also suffer punishments, as they are either trials, or chastisments unto us. III. Object. The law and justice of God do not togither exact both, namely obedience, and punishment. Answ. In man’s perfect estate, the justice of God requires only obedience: but in his estate corrupted, he requires both obedience, and punishment. Punishment, as the law is violated: Obedience, that legal justice may be performed. Gal. 3. 10. It is therefore plain, that not only Christ’s passion, but also his legal obedience, is our righteousness before God. Justification hath two parts: Remission of sins, and imputation of Christs righteoussness. Remission of sins, is that part of justification, whereby he that believeth, is freed from the guilt and punishment of sin, by the passion of Christ. Col. 1. 21, 22. You has he now reconciled in the body of his flesh thorough death, to make you holy and blameless, and without fault in his sight. 1. Pet. 2. 24. Who, in his own flesh, bore our sins in his body, on the tree, that we being delivered from sin, should live in righteousness, by whose stripes you are healed. Imputation of righteousness, is the other part of justification, whereby such as believe, having the guilt of their sins covered, are accounted just in the sight of God, through Christ’s righteousness. 2. Cor. 5. 21. Psal. 32. 1. Blessed is he, whose wickedness is forgiven, and whose sin is covered. Rom. 4. the whole chapter, where the Apostle repeats imputation eleven times. Phil. 3. 8, 9. I have counted all things loss, and do judge them to be dung, that I might win Christ, and might be found in him, that is, not having my own righteousness that is by the law, but that which is through the faith of Christ, even the righteousness [note] which is of faith. The form of justification, is, as it were, a kind of translation of the believer’s sins to Christ, and again Christ’s righteousness unto the believer, by a reciprocal or mutual imputation. As is apparent in this picture following.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Golden Chaine</cite>, (1590; 1616 edition) (spelling and punctuation modernized; emphasis added).</span></figcaption>

rson+of+the+Word%2C+and+so+exalted+in+dignity+and+sanctity%2C+above+all+angels%2C+it+may+seem+to+be+exempted+from+this+natural+obligation+of+performing+the+law.+II.+Object.+If+then+Christ+performed+the+law+for+us%2C+we+are+no+more+bound+to+the+observance+of+the+same%3A+as+we+do+not+undergo+eternal+punishments+for+our+sins%2C+the+which+Christ+in+his+person+did+bear+upon+the+cross.+Answer.+If+we+keep+the+same+respect+of+performing+obedience+to+the+law%2C+the+consequence+is+very+true%2C+otherwise+it+is+not+so%3A+for+Christ+performed+obedience+to+the+law+for+us%2C+as+it+is+the+satisfaction+of+the+law%3A+but+the+faithful+they+are+bound+to+obedience%2C+not+as+it+is+satisfactory%2C+but+as+it+is+a+document+of+faith%2C+and+a+testimony+of+their+gratitude+towards+God%2C+or+a+means+to+edify+their+neighbours%3A+even+as+Christ+suffering+eternal+punishments+for+our+sins%2C+we+also+suffer+punishments%2C+as+they+are+either+trials%2C+or+chastisments+unto+us.+III.+Object.+The+law+and+justice+of+God+do+not+togither+exact+both%2C+namely+obedience%2C+and+punishment.+Answ.+In+man%E2%80%99s+perfect+estate%2C+the+justice+of+God+requires+only+obedience%3A+but+in+his+estate+corrupted%2C+he+requires+both+obedience%2C+and+punishment.+Punishment%2C+as+the+law+is+violated%3A+Obedience%2C+that+legal+justice+may+be+performed.+Gal.+3.+10.+It+is+therefore+plain%2C+that+not+only+Christ%E2%80%99s+passion%2C+but+also+his+legal+obedience%2C+is+our+righteousness+before+God.+Justification+hath+two+parts%3A+Remission+of+sins%2C+and+imputation+of+Christs+righteoussness.+Remission+of+sins%2C+is+that+part+of+justification%2C+whereby+he+that+believeth%2C+is+freed+from+the+guilt+and+punishment+of+sin%2C+by+the+passion+of+Christ.+Col.+1.+21%2C+22.+You+has+he+now+reconciled+in+the+body+of+his+flesh+thorough+death%2C+to+make+you+holy+and+blameless%2C+and+without+fault+in+his+sight.+1.+Pet.+2.+24.+Who%2C+in+his+own+flesh%2C+bore+our+sins+in+his+body%2C+on+the+tree%2C+that+we+being+delivered+from+sin%2C+should+live+in+righteousness%2C+by+whose+stripes+you+are+healed.+Imputation+of+righteousness%2C+is+the+other+part+of+justification%2C+whereby+such+as+believe%2C+having+the+guilt+of+their+sins+covered%2C+are+accounted+just+in+the+sight+of+God%2C+through+Christ%E2%80%99s+righteousness.+2.+Cor.+5.+21.+Psal.+32.+1.+Blessed+is+he%2C+whose+wickedness+is+forgiven%2C+and+whose+sin+is+covered.+Rom.+4.+the+whole+chapter%2C+where+the+Apostle+repeats+imputation+eleven+times.+Phil.+3.+8%2C+9.+I+have+counted+all+things+loss%2C+and+do+judge+them+to+be+dung%2C+that+I+might+win+Christ%2C+and+might+be+found+in+him%2C+that+is%2C+not+having+my+own+righteousness+that+is+by+the+law%2C+but+that+which+is+through+the+faith+of+Christ%2C+even+the+righteousness+%5Bnote%5D+which+is+of+faith.+The+form+of+justification%2C+is%2C+as+it+were%2C+a+kind+of+translation+of+the+believer%E2%80%99s+sins+to+Christ%2C+and+again+Christ%E2%80%99s+righteousness+unto+the+believer%2C+by+a+reciprocal+or+mutual+imputation.+As+is+apparent+in+this+picture+following.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+Golden+Chain+%281590%3B+1616+edition%29+%28spelling+and+punctuation+modernized%3B+emphasis+added%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F127407a87b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/127407a87b.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/11/perkins-on-christs-active-obedience-and-our-gratitude/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-9e48332a2f" data-kw="">

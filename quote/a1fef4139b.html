<main class="wrap"><figure class="quote" id="q-a1fef4139b" data-kw="">
<blockquote><p>Though sin be forgiven, yet there may be the sense of God’s displeasure still; for, as though God doth forgive, there are many calamities and pressures upon the godly: so though Christ hath born the agonies that do belong unto sin, yet some scalding drops of them do fall upon the godly; not that the godly is by these to satisfy the justice of God, but that hereby we might feel the bitterness of sin, what wormwood and gall is in it, that so we may take heed for the future, and that we may by some proportion think on, and admire the great love of Christ to us, in undergoing such wrath.

Didst thou not judge the least of his anger falling upon thee more terrible, then all the pains and miseries that ever thou wast plunged into? And by this then, thou mayest stand amazed, and wondering at this infinite love of Christ to stand under this burden for thee. David is a pregnant instance for the truth of this. As when Saul was angry with Jonathan, and run a Javelin at him, he escaped, and that run into the wall; so the wrath of God, which was violently to fall upon thee, missed thee, and ran into Christ. But the sense of God’s displeasure for sin, may be retained in us two ways;

1. Servilely and slavishly whereby we run from the promise and Christ, and have secret grudgings and repinings against God: this is sinful for us to do.

2. There is a filial apprehending of God’s displeasure, though we are persuaded of the pardon; this is good and necessary, as we see in David, who made that Psalm of Repentance, Psal. 51. though he had his absolution from his sin. Tears in the soul by the former way, are like the water of the Sea, salt and brackish; but those in the latter are sweet, like the rain of the Clouds falling down on the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 22.</span></figcaption>

</figure><figure class="quote" id="q-fbaca9017f" data-kw="">
<blockquote><p>But I answer, the place 2 Cor. 2:10 is controverted, and we doubt not, but [that it is] of that same nature with the power of excommunicating, 1 Cor. 5:4. But for private forgiving, it is not the Church-forgiving here meant, because:

1. The private forgiving is a duty of charity commanded in the Law of Nature to all, even out[side] of [a] Church-state, and obliges the excommunicate[d], who, though they be cast out of the Church, are not exempted from the Law that binds all, Mt. 6:12,14-15; Mt. 5:44-45, but the Church-forgiving is an act of obedience to a positive Church-Law of Christ.

2. Private Christians are to forgive their enemies whether they repent or not, even as Christ forgave those who crucified Him, Col. 3:13; Lk. 23:34; and when the party repents not, this forgiveness is not ratified in Heaven, yet are we obliged to forgive and to commit vengeance to God; But the authoritative forgiving is a thing that the Church is not obliged unto, absolutely; nor may they, or can they forgive, except the offender repent: and if they see that he repents not, they cannot lawfully forgive; but, being in God’s room, must take vengeance on all disobedience, and their retaining of sin and forgiving is valid in Heaven, because they are in God’s place. Now any forgiving or retaining of sin but these two, together with God’s forgiving and retaining, we know not. But Peter’s forgiving his offending brother seventy times seven times, is common to all private Christians, even out[side] of [a] Church-state…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1642), pt. 1, ch. 1, section 1, p. 16</span></figcaption>

<main class="wrap"><figure class="quote" id="q-993c3a2447" data-kw="">
<blockquote><p>I was a hearty Revolutioner, and a great adorer of God’s goodness to these lands in sending that great man, King William, to overthrow our enemies and redeem us from slavery. Yet the aforesaid nine grievances [on pp. 232-33] stuck close with me, and stumbled me greatly; whereupon I had thoughts to go off the country. But alas, alas! before that project was ripe, I met with some, who otherwise were good men, but they had stated a separation from church and state, after the Revolution, because of the aforesaid nine grievances, to which they added many more. I at least was overcome with their arguments, joined with them, in the inadvertent simplicity of my heart, and being influenced with a zeal not altogether according to knowlege, I continued embarked in communion with them for some time, which laid a foundation for a train of many after trials to me; for I quickly found that I was out of the frying-pan into the heart of the fire: for, though Isaw great reason for these grievances on the government side, yet, amongst the dissenters, I found many grievances, some of which were intolerable unto me…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters (Edinburgh: Oliphant, 1827)</cite>, p. 234</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ecb794e643" data-kw="">
<blockquote><p>While that act stands unrepealed, or not annulled, it remains an act and rule of this Church still, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature.’ Now, as to the Brethren: [1] I cannot see any ground to say the sentenced anent them are not materially rescinded, seeing as the Assembly 1733 and their commission did cast them out from this Church, so the Assembly 1734 gave the synod of Perth power and full authority to restore and unite them again to the communion thereof, and to their ministerial charges, which accordingly was done by that synod: And this, in my opinion, was a material condemning of the sentences of the former Assembly and commission that had been pronounced against them. (2) But, whereas ’tis said the act of Assembly 1733 against them, while unrepealed, ‘It still remains an act and rule of this Church, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature,’ and therefore they cannot accede to the judicatories till that act is rescinded, lest they homologate that sinful deed or sentence. Now if this argument prove anything, it proves too much; for it says we are never to join with a Church which has made any unjust or sinful act till repealed: And so the Brethren could never be justified for joining formerly with the Church of Scotland when such unaccountable acts as that of the Assembly 1638, sessions 23-24, was unrepealed: which discharges all persons of whatever quality, ministers or others, to speak or write against that Assembly, or any act of that Assembly, under pain of the censures of the Church: A very bad precedent! And so the Assembly 1642, session 7, enjoins that every presbytery proceed against non-communicants, whether Papists or others, according to the act of parliament, which looks too like the English Sacramental Test: And also the above-cited act of Assembly 1648, anent deposing all suspended ministers who do not submit to the sentences of Church judicatories, and so of other bad acts of Assembly from 1638 to 1649 inclusive. And, if an act in a particular case is a rule in a way of precedent in similar cases, or cases of the like nature, then the instance of overturning the settlement made by the Commission at Auchtermuchty, and the repeated instances of our late General Assemblies in allowing the people of Stow, Troqueir, Dennie, etc. the privilege of sealing ordinances, are good precedents to plead in like cases where ministers are intruded upon Christian congregations. 4thly, They say: “Seeing an accession to a Church cannot be made but in the situation in which that Church is when the accession is made unto her; therefore any accession to her in that situation so far approves of her, as to submit it to her authority what is to be counted defections, and what not; and, if that Church maintain not that testimony which they that accede to her maintain, then they fall from their testimony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-102ae20223" data-kw="">
<blockquote><p>Usually we find the weakest spirits are most violent, there being nothing of judgment to counterbalance affliction. Men are all flame and rage. Liquors, when they run low, and are upon the dregs, they grow more tart and sour: So ’tis usually with the dregs of men; for, when they are weak and run low in parts, their opposition is most troublesome. What ado in the ministry have we with young heady professors, that have more heat than light?</p></blockquote>

</figure><figure class="quote" id="q-05764539d7" data-kw="">
<blockquote><p>In our Assemblies we were more to set up a state opposite to a state, more upon forms, citations, leading of witnesses, suspensions from benefices, than spiritually to persuade and work upon the conscience, with the meekness and gentleness of Christ; the glory and royalty of our princely Redeemer and King, was trampled on, as any might have seen in our Assemblies. What way the army and the sword, and the countenance of nobles and officers seemed to sway, that way were the censures carried: It had been better had there been more days of humiliation and fastings in Assemblies, synods, presbyteries, congregations, families, and far lass adjourning commissions, new peremptory summonses, and new drawn-up processes, and if the meekness and gentleness of our Master had got so much place in our hearts that we might have waited on gainsayers and parties contrary-minded, and we might have driven gently, as our Master Christ who loves not to overdrive, but carries the lambs in his bosom.</p></blockquote>

</figure><figure class="quote" id="q-8fbaefbd32" data-kw="">
<blockquote><p>If any faction of men require the assent and consent of other men to a vast number of disputable and uninstituted things, and it may be a mathematical falsehood among the first of them, and utterly renounce all Christian communion with all that shall not give that assent and consent, we look upon these to be separatists, we dare not be so narrow spirited: The churches of New England profess to make only the substantials of the Christian religion to be the terms of our sacred fellowship.</p></blockquote>

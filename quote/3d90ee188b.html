<main class="wrap"><figure class="quote" id="q-3d90ee188b" data-kw="">
<blockquote><p>…there remains a necessary distinction to be attended unto of God’s call, that it is twofold: either external only, or external and internal also; or an effectual and ineffectual calling. For though this distinction be hated by some men, yet the Scripture is very clear that there are many called, who yet are not chosen: and when he says called, it is not meant only actively on God’s part, as some were called, but yet refused and would not so much as outwardly profess obedience, but ‘called’ is to be understood passively on man’s part, so that he gives some outward conformity to Gods call. There is an external reception and submission to it, but yet there is no true inward sanctification: Insomuch that some who are called the children of the Kingdom shall be cast forth; and they are said not to be all Israel who are of Israel. In the Old Testament we read of many who outwardly submitted to the profession of God’s commands, who yet were not found at heart; and therefore our Savior in the course of his ministry did not direct his preaching more to any subject almost than this, viz. to have the internals of grace as well as externals; so that we may say, There is a called and elected Church, and a called Church only, not elected; and this is to take off all Churches from idolizing and doting upon the ordinances and external administrations which are in a Church, as the Jews did, and as most Christians do. We are to go further and to see whether we be indeed and really Christ’s body, as well as seemingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Expository Comment, Doctrinal, Controversial &amp; Practical upon the Whole First Chapter to the Second Epistle of St. Paul to the Corinthians</cite>, (London: A.M., 1661), sermon 13, p. 54</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72ef6304b8" data-kw="">
<blockquote><p>The persons called by God, who yet are not chosen, are of two sorts, as you heard: First, those, who, though so graciously invited, do yet obstinately and peremptorily refuse, and these are actively only called on God’s part. The second sort is of those who do give consent, and yield to their call, but because they do not rise up fully to all that is required, therefore they are cast away. In this [latter] rank is the man, who being invited, made no opposition or excuse, but went in and sat down at the feast, was as confident as the other guests, seems to be conscious to himself of no fault, but having no wedding garment, the master is so wroth and displeased with him, that he is adjudged to everlasting torments; and from this instance our Savior gathers this conclusion in the text [circa Mt. 22:14]; so that the meaning is: Of those many that are called , and give a general acceptance of it, yet few are chosen to eternal glory: Those enjoy the feast of the ordinances here, who are to be tormented for ever hereafter; those are admitted to eat in God’s presence here, who shall be commanded to depart from Him hereafter, He knows them not: Many are admitted into the temple that may not enter into the holiest of holies… That men did receive the truth as to some particulars and some degrees, but not wholly and thoroughly… Thou receivest Christ and his ways but in parcels, though thou hast baptism, the title of a Christian, sittest down at the ordinances, yet where is the wedding-garment! where is the conversation that does agree and belong to so holy a matter? To open this doctrine, let us consider: First, Wherein lies this outward obedience to God’s call, which yet is ineffectual; for can anything more concern you than that you should not be Christians in vain? that all thy praying and frequenting of holy duties may not be in vain? that God may not take thee from this feast, as Haman was from his in which he so much boasted, to be put into confusion and everlasting fear?</p></blockquote>

</figure><figure class="quote" id="q-305f240a48" data-kw="">
<blockquote><p>For the first: the calling of God is either particular or general. The particular is to serve God in some set function of outward life, and so is the 〈…〉. The general calling is to the service of 〈…〉 with promise of eternal reward through the 〈…〉 Christ. This general calling is likewise of three sorts: 1. External. 2. Internal: or both 3. external and internal. 1. The external alone is called common and ineffectual: the 2nd and 3rd is called singular and effectual. 1. The outward calling is the work of God’s grace in his Word, offering Christ and calling upon all sorts of men to reform their ways and receive Christ, and yield obedience to God’s holy will to their salvation, if they will obey. 2. The inward calling is the work of God’s Spirit, effectually stirring up and persuading the elect to hear and obey, and receive Christ unto salvation. 3. The calling that is both inward and outward is the action of God both by his Word and Spirit, calling out his elect by name particularly and persuading them to separate from the world and receive the covenant of God’s grace in Christ, and to devote themselves to holiness of life;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London: Miles, 1637) | on 1 Pet. 1:15, pp. 119-20</span></figcaption>

st%3A%20the%20calling%20of,devote%20themselves%20to%20holiness%20of%20life&amp;text=For%20the%20first%3A%20the%20calling%20of%20God%20is&amp;text=and%20to%20devote%20themselves%20to%20holiness%20of%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eac67bac82" data-kw="">
<blockquote><p>And here is the instrument which Christ makes use of for the drawing of his elect to Himself: the preaching, plain and simple preaching of the Gospel, seemingly a weak and unlikely instrument; thence called the foolishness of preaching (1 Cor. 1:21); Yet by this weak means does Christ effect this great work: Hereby drawing men out of darkness from under the power of Satan. Paul was sent to the gentiles (Acts 26:18) to turn them from darkness to light, and from the power of Satan to God: But how was he to do it? Why, by preaching of the Gospel, by bearing the name of Christ before them (Acts 9:15), hereby drawing them out of the world as fishes out of the sea; hereby drawing them out of themselves, convincing them of their insufficiency and Christs all sufficiency; and so drawing them to Himself; first as to a Savior to believe on Him, working faith in them by this means, ‘Faith comes by hearing, hearing the Word, the word of the Gospel (Rom. 10): Then as to a Lord, to be governed by Him, which is also wrought by the same instrument. (2 Cor. 12:4-5) Here is the outward means, but this often proves ineffectual. Many there are who hear the Word, and hear it powerfully dispensed, who yet are never the better for it; so says the apostle of the Jews: The Word preached did not profit them, not being mixed with faith in them that heard it, Heb. 4:2. And so ineffectual it often proves to many that sit under the sound of it: They are not thereby brought home to Christ. Even as many of the Jews saw Christ lift up, beheld Him crucified, who yet believed not on Him, nay thereby they were hardened-against Him. Even so it is now in the preaching of the Gospel: Many there are before whose eyes Christ is lift up, crucified in the Word and sacraments, who yet are not brought to believe on Him or submit unto Him. 2. To this therefore (in the second place) is joined the Spirit, the Spirit of Christ which He sends forth to accompany his Word and to make it effectual in the hearts of his elect; and by this means He draws men effectually;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And here is the instrument which Christ makes use of for the drawing of his elect to Himself: the preaching, plain and simple preaching of the Gospel, seemingly a weak and unlikely instrument; thence called the foolishness of preaching (1 Cor. 1:21); Yet by this weak means does Christ effect this great work: Hereby drawing men out of darkness from under the power of Satan. Paul was sent to the gentiles (Acts 26:18) to turn them from darkness to light, and from the power of Satan to God: But how was he to do it? Why, by preaching of the Gospel, by bearing the name of Christ before them (Acts 9:15), hereby drawing them out of the world as fishes out of the sea; hereby drawing them out of themselves, convincing them of their insufficiency and Christs all sufficiency; and so drawing them to Himself; first as to a Savior to believe on Him, working faith in them by this means, ‘Faith comes by hearing, hearing the Word, the word of the Gospel (Rom. 10): Then as to a Lord, to be governed by Him, which is also wrought by the same instrument. (2 Cor. 12:4-5) Here is the outward means, but this often proves ineffectual. Many there are who hear the Word, and hear it powerfully dispensed, who yet are never the better for it; so says the apostle of the Jews: The Word preached did not profit them, not being mixed with faith in them that heard it, Heb. 4:2. And so ineffectual it often proves to many that sit under the sound of it: They are not thereby brought home to Christ. Even as many of the Jews saw Christ lift up, beheld Him crucified, who yet believed not on Him, nay thereby they were hardened-against Him. Even so it is now in the preaching of the Gospel: Many there are before whose eyes Christ is lift up, crucified in the Word and sacraments, who yet are not brought to believe on Him or submit unto Him. 2. To this therefore (in the second place) is joined the Spirit, the Spirit of Christ which He sends forth to accompany his Word and to make it effectual in the hearts of his elect; and by this means He draws men effectually;”

<blockquote><p>Q. 1. What makes the difference between effectual and ineffectual calling? A. Ineffectual calling is when men have nothing but the external sound of the Gospel. Mt. 20:16, ‘For many be called, and few chosen.’ Effectual is, when the Spirit works in conjunction with the Word. Jn. 6:45: ‘It is written in the prophets, ‘And they shall be all taught of God;’ every man therefore that has heard, and has learned of the Father, comes unto Me.’ … Q. 11. What is the third instruction? A. It is dangerous to refuse God’s call. Prov. 1:24, ‘Because I have called, and ye refused; I have stretched out my hand and no man regarded.&#x27;</p></blockquote>

<blockquote><p>It was justice, not cruelty, yea mercy to the Church of God, to take away the life of Servetus, who used such spiritual and diabolic cruelty to many thousand souls, whom he did pervert, and by his Book, does yet lead into perdition.</p></blockquote>

</figure><figure class="quote" id="q-47926c9091" data-kw="">
<blockquote><p>And what further authority, or proceedings purely ecclesiastical, of one, or many sister Churches towards another whole Church, or Churches offending, either the Scriptures do hold forth, or can rationally be put in execution (without the magistrates interposing a power of another nature, unto which we upon his particular cognizance, and examination of such causes, profess ever to submit, and also to be most willing to have recourse unto) for our parts we saw not then, nor do yet see… And if the magistrate’s power (to which we give as much, and (as we think) more, than the principles of the presbyterial government will suffer them to yield) do but assist and back the sentence of other Churches denouncing this non-communion [of Independent churches] against Churches miscarrying, according to the nature of the crime, as they judge meet…</p></blockquote>

</div>
</figure><figure class="quote" id="q-f5a59ae39d" data-kw="">
<blockquote><p>…Lewis Du Moulin… a son of the famous Molinaeus, who took so active a part in the Arminian controversy, and was long the leading divine in the Protestant Church of France. Lewis settled in England, and obtained a chair in Oxford during the Commonwealth. He adopted Independent, or Congregational, views on church government, chiefly, it would appear, because he thought them more favorable to Erastianism than Presbyterian principles, a notion for which he could plead the authority of Congregational divines of the highest eminence–namely, the five dissenting brethren, as they were called, in the Westminster Assembly. They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/congregationalists.html">Congregationalists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>William Cunningham, HT</cite>, 2.580</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-c843576050" data-kw="">
<blockquote><p>7. They [civil magistrates] might and ought to give their countenance unto, and join their authority with, such ecclesiastic statutes, overtures, or means, as Church-judicatories or officers might be about to make use of for this end in their places; and this can be no more prejudice to liberty, to countenance with their authority the ordinance of discipline, than to confirm by their authority the ordinance of preaching the Gospel. … 9. In recovering a people, in a reeling and staggering time, a magistrate may engage them to formerly received truth, and interpose his authority for this end, as is recorded of Josiah, 2 Chron. 34:31-33. Also, 10. He may and ought to remove all false worships, and endure no corrupt preaching, or writing, or meetings for that end, or administrating of corrupted sacraments, or any ordinance other than what is allowed; for, Josiah did cause the people stand to the Covenant that was made, and having removed all idolatrous worship, he made Israel to serve the Lord, that is, he made them abandon corrupt worship, and wait on pure ordinances, as keeping of the sabbaths, offering of sacrifices, etc. and that according to the manner prescribed by the Lord. Neither was it a wronging of their liberty, to do so, because: 1. It was the preservation of their liberty, to keep them from the abominable bondage of these evils. 2. It was their duty to abstain from these, and to follow the ordinances purely, and the magistrate may well put people to that. 3. It is one thing by force to keep folks from dishonouring God in a corrupt religion, (as Josiah did) another to force them to a religion; the one belongs to the ordering of the outward man, the other to the inward. 4. He might order them to keep the ordinances, and in going about them to keep the rule, because that is but a constraining of them to the means whereby religion works, and a making them, as it were, to give God a hearing, leaving their yielding and consenting to Him, when they have heard Him, to their own wills, which cannot be forced; yet it is reason that when God comes by His ordinances to treat with a people, that a magistrate should so far respect His glory and their good as to interpose His authority to make them hear. 5. Also, there is a difference between the constraining of a circumcised or baptized people, to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized, which were not formerly engaged; because, actual members of a Church have not even that liberty as others have, to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements, and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things, and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (1659), pt. 3, ch. 4, pp. 252-4</span></figcaption>

elding and consenting to Him, when they have heard Him, to their own wills, which cannot be forced; yet it is reason that when God comes by His ordinances to treat with a people, that a magistrate should so far respect His glory and their good as to interpose His authority to make them hear. 5. Also, there is a difference between the constraining of a circumcised or baptized people, to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized, which were not formerly engaged; because, actual members of a Church have not even that liberty as others have, to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements, and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things, and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.”

o+the+inward.+4.+He+might+order+them+to+keep+the+ordinances%2C+and+in+going+about+them+to+keep+the+rule%2C+because+that+is+but+a+constraining+of+them+to+the+means+whereby+religion+works%2C+and+a+making+them%2C+as+it+were%2C+to+give+God+a+hearing%2C+leaving+their+yielding+and+consenting+to+Him%2C+when+they+have+heard+Him%2C+to+their+own+wills%2C+which+cannot+be+forced%3B+yet+it+is+reason+that+when+God+comes+by+His+ordinances+to+treat+with+a+people%2C+that+a+magistrate+should+so+far+respect+His+glory+and+their+good+as+to+interpose+His+authority+to+make+them+hear.+5.+Also%2C+there+is+a+difference+between+the+constraining+of+a+circumcised+or+baptized+people%2C+to+worship+God+in+the+purity+of+ordinances%2C+as+they+have+been+engaged+thereto%2C+which+was+Josiah%E2%80%99s+practice%2C+and+the+constraining+of+a+people+to+engage+and+be+baptized%2C+which+were+not+formerly+engaged%3B+because%2C+actual+members+of+a+Church+have+not+even+that+liberty+as+others+have%2C+to+abandon+ordinances%3A+and+this+puts+them+to+no+new+engagement+in+religion%2C+but+presses+them+to+continue+under+former+engagements%2C+and+accordingly+to+perform%3A+Hence+we+see%2C+that+both+in+the+Old+and+New+Testament%2C+Church-members+have+been+put+to+many+things%2C+and+restrained+from+many+things%2C+which+had+not+been+pertinent+in+the+case+of+others.+See%2C+2+Chron.+15%3A13.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+The+Dying+Man%E2%80%99s+Testament+to+the+Church+of+Scotland%2C+or%2C+A+Treatise+Concerning+Scandal%E2%80%A6+%281659%29%2C+pt.+3%2C+ch.+4%2C+pp.+252-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc843576050.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c843576050.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=7.%20They%20%5Bcivil%20magistrates%5D%20might%20and,of%20others.%20See%2C%202%20Chron.%2015%3A13&amp;text=7.%20They%20%5Bcivil%20magistrates%5D%20might%20and%20ought%20to&amp;text=the%20case%20of%20others.%20See%2C%202%20Chron.%2015%3A13" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

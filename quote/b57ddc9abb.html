<blockquote><p>[T]he purity and power of religion alone, doth truly honour all honours, dignify all dignities, actuate with acceptation and life all moral virtues and endowments of art, sweeten all government, strengthen all states, settle fast all imperial crowns upon princes’ heads. It is no humorous conceit, but a matter of sound consequence, that all, either personal duties, or employments of state, are by so much the better performed, by how much the men are more religious from whose abilities the same proceed. When heaven is made too much to yield to earth, piety to policy, public good to private ends, there authority is embittered, inferiors plagued, and, too often, law and justice turned into wormwood and rapine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>General Directions for a Comfortable Walking with God</cite>, (1626; Ligonier PA: Soli Deo Gloria, 1991), xv-xvi.</span></figcaption>

<blockquote><p>A number of proclamations issued in the relation of the visitation [of the plague in 1665] pertained to the concourse of the people. Under most circumstances the concourse of people was vehemently prohibited in political plague texts, upholding an understanding of material protection against the threat of contagion. However, the persistent belief in the moral dimension of illness manifested in proclamations that gestured to instances when gatherings could be justified, in the interest of providential salvation. On 6 July [1665], measures for designated fast days and the severity of the growing outbreak were proclaimed in a text entitled ‘By the King. A Proclamation for a Generall Fast Throughout the Realm of England’. Fast days during plague had been enacted first during an outbreak in 1563 under Elizabeth I, who, alongside her council and the church, scheduled prayer and fasting, with fasting on Wednesdays… The proclamation [in 1665] requested that citizens not only maintain the request, ‘And that the solemnization of these days may be with such Order and Decency as is requisite’… Meetings in churches continued through the outbreak, though the circumstances changed once many pulpits were left abandoned by their Anglican ministers. The flight of ministers meant nonconformist ministers took up the task of preaching at some of the vacant pulpits. Writing of the height of the epidemic, nonconformist Thomas Vincent described the scene at a church in God’s Terrible Voice in the City: ‘Now there is such a vast concourse of people in the Churches, where these ministers are to be found, that they cannot many times come near the Pulpit doors [in order to enter the pulpit to preach] for the press [of the people]’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-examples.html">Kathleen Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Literary Culture of Plague in Early Modern England Pre</cite>, (Palgrave, 2016), p. 36</span></figcaption>

<blockquote><p>XXVI. …Yet the case may be, and often has been (and whither or no it be ours now [referring to Scotland in 1681], is not mine to determine) that a people may and ought to submit themselves to the government even of such a magistrate who either has injuriously usurped that office, or has so maleversed in the exercise thereof (by violating the main and most of the conditions upon which he was admitted to it) that his government is degenerat[ed] into a manifest tyranny and irreligion, and so has (de jure) fore-faulted his right to rule as a magistrate: I say the case of a people may be so circumstantiate [bound by circumstances], that they ought to subject themselves even to such a tyrant till the Lord clearly point forth to them a way, either from his written Word, or some extraordinary impulse and influence upon their spirits, or from indubitable grounds and persuasives of sound moral principles, or such like, whereby they may emerge from under that yoke. Hereby I do not yield, nor assert, that it is lawful to give obedience to any unlawful commands, or that it is no ways lawful for a people to shake off the yoke of an unlawful and tyrannical government: but only that there may be some cases wherein it is lawful for a people to yield subjection to a lawless tyrant, and wherein it may be unlawful for them to perpetrate or attempt their own liberation by external force (which abstractly from those circumstances might be both lawful, laudable and a necessary duty), viz. when the thing attempted is either altogether impracticable, the means or manner of effectuating it dubious or unwarrantable, the timing of it inexpedient and unseasonable, or the necessary concomitants or consequents of the cure more hurtful or dangerous than the disease; or the like: Neither do I affirm that under a tyrannical government it is always or absolutely lawful for the people to give passive obedience (if such a form of phrase may be admitted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, (1681), pp. 47-48</span></figcaption>

<blockquote><p>Aquinas holdeth with Isidore, that a human Law (among other conditions of it) must both be necessary for removing of some evil, and likewise profitable for guiding us to some good. … Human Laws (in Mr. [Richard] Hooker’s judgment) must teach what is good, and be made for the benefit of men. Demosthenes describeth a Law, to be such a thing cui convenit omnibus parere, which it is convenient for every one to obey. Camero [John Cameron] not only alloweth us to seek a reason of the Church’s Laws (non enim (saith he) verae Ecclesiae libet leges ferre quarum non reddat rationem. It pleaseth not the true Church to make and publish Laws whereof she giveth not a reason:) but he will likewise have us, in such things as concern the glory and honour of God, not to obey the Laws of any Magistrate, blindly and without a reason. …

From Scripture we learn that neither hath the Magistrate any power, but for our good only [Romans 13:4], nor yet hath the Church any power, but for our edification only [Ephesians 4:12]. Law-makers therefore may not enjoin quod-libet, that which liketh them, nay nor always quod licet, that which is in itself lawful, but only quod expedit, that which is expedient and good for edifying.</p></blockquote>

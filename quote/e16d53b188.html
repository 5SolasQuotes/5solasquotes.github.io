<main class="wrap"><figure class="quote" id="q-e16d53b188" data-kw="">
<blockquote><p>Testimonies for the Lord are necessary, lovely and singularly useful, when according to the rule: But, when these prescribed bounds are exceeded, and our misguided zeal for a pretended respect to the Lord’s honor hurries to a taxing the commissions of his choicest ambassadors, and trampling such as are eminently beautified with Christ’s image, who can tell how far this gangrene may reach? My heart trembles at the mischiefs which any one unsound and unsafe position does lead to, especially in matters of this nature; and have often admired the judicious observe of a great man, against whom our friends, especially the more exercised, are not much, if at all, prejudiced, viz. ‘He that sheds man’s blood, by man shall his blood be shed; but whoso sheds the blood of Churches, his blood shall be shed by the Lord.’ (These are said to be the words of Mr. Shepherd.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-517115a095" data-kw="">
<blockquote><p>3. Some object the heinousness of the sins of ministers’ conformity as being deliberate covenanting to (I am loath to name them), and so the command, “from such turn away” [2 Tim. 3:5], with such “not to eat” [1 Cor. 5:11]… But these sins were never so surely proved as great as alleged:

1. Every minister cannot be proved guilty of the worst part.

2. And the matter of a sin may be heinous, and yet ignorance take off much of the guilt, as it did of Paul ‘s persecution [1 Tim. 1:13]. An unlawful war in which thousands were murdered and countries ruined is materially one of the greatest sins in the world; and yet woe to the abundance of princes and people if ignorance excuse it not and if we must renounce communion with all countries and persons that are guilty of it.

3. And when whole countries and Churches are in sin which we cannot cure and have no government of, the case of commanded communion much differs from that which is with single offenders, and that which is in our power to choose or refuse.

4. Some object that the fifth, sixth, seventh and eighth canons have excommunicated us already. Therefore we separate not, but they cast us out. Answer: Let them that are concerned in those canons defend them if they can and justify themselves, for it’s past my skill; but we are not bound (though excommunicated) to execute them on ourselves: Let others do it if it must be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 86-87</span></figcaption>

</figure><figure class="quote" id="q-e4304c57e2" data-kw="">
<blockquote><p>I know what dreadful consequences would attend a needless separation from the established Church, however I am treated by the corrupt members and ministers of it; for I judge of the state of a Church, not from the practice of its members, but its primitive and public constitution; and so long as I think the articles of the Church of England are agreeable to Scripture, I’m resolved to preach them up, without either bigotry or party-zeal; for I love all that love the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

</figure><figure class="quote" id="q-8e797b9129" data-kw="">
<blockquote><p>That though a person has been thrust in upon a people in an undue manner, yet their after acceptance, approbation and submission to his ministry, makes him a pstor to them, supplying the want of election at first; as Jacob’s after-consent and acceptance of Leah made her to be his wife, though he was far from choosing her at first. And though it be a sin in ministers of the gospel to settle any pastor contrary to the inclinations of a people, yet in my opinion, though the people are not obliged, they may submit to the ministry of such without sin, declaring their non-approbation of the procedure, and testifying against the manner of settlement.</p></blockquote>

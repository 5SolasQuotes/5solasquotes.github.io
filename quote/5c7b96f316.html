<blockquote><p>When comparing the worship of the early church with that of the synagogue, we labour under this disadvantage, that, if the primitive church had any liturgy, it has not been handed down to us; still, as far as we can ascertain anything of its modes of worship, we find many traces of similitude between it and that of the synagogue….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synagogue and the Church</cite>, translated and condensed by Joshua L. Bernard (London, 1842).</span></figcaption>

</figure><figure class="quote" id="q-634c57d18f" data-kw="">
<blockquote><p>Modest women were supposed to keep their heads covered when out of doors, but this generally took the form of draping their mantle over their head rather than wearing a hat, since the elaborate hairstyles frequently made hats impossible. In the first centuries BC and AD, there are some references to the turban (mitra) being worn by rich women, and it is possible this is the cloth wrapped round the head like a headscarf seen on women in Hellenistic paintings. Catacomb paintings of Christian women praying sometimes show them with a veil covering their head and hanging down their back or over their shoulders, but rarely crossed over like a shawl round the neck… The freedman’s cap could also be worn by women on occasion;</p></blockquote>

</figure><figure class="quote" id="q-f85c9e6781" data-kw="">
<blockquote><p>But what is that good and honest heart which they are commended for? it is a heart that does fully purpose to do well, though it fail much in that which it performs: that resolves beforehand to avoid the evil that shall be reproved, and to do the good duties that shall be commanded, and to believe and rest upon the promises that shall be pronounced, as far as God shall give ability, etc. Now wheresoever there is such a ready inclination unto goodness, there will be a bringing forth of fruit; though not in all alike, yet every one will do somewhat: and God will acknowledge them for good ground, and honest-hearted Christians, that yield Him but a thirty-fold, as well as those that yield Him sixty-fold,or an hundred-fold: for a less measure of fruitfulness is an argument of truth, as well as a greater measure, and therefore shall be respected and rewarded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

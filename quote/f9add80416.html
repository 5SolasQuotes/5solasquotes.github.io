<main class="wrap"><figure class="quote" id="q-f9add80416" data-kw="">
<blockquote><p>God could have created them all at once, but He made them in the space of six days,¹ that He might show… ¹ That opinion of Augustine, that God made all things in a moment and distributed them into days because of our better understanding, is exploded by all. Although Creation was done in a moment, in respect of the particular bodies severally considered, yet in respect of all, it was not perfected in an instant, but in the space of six days; which spaces of days, note not a temporal succession of the same, but the order of diverse works. Some allege [against this the singular word ‘day’ in] Gen. 2:4, but it is not unusual in the Scripture to comprehend many days under the name of one. See Aquinas, [Summa] pt. 1, quest. 74, art. 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: 1654), bk. 3, ch. 2, p. 229</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6781960e7" data-kw="">
<blockquote><p>Intellection can exist (as is plain from our own inner experience); but God, as supreme cause of everything outside himself, must have the perfection of his effects either formally or at least virtually. He does not have intellection merely virtually, because a being that is formally unknowing cannot be the sufficient reason of anything formally knowing, otherwise the effect would be more perfect than its cause; therefore he has intellection formally, which is [the] proposed conclusion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pp. 93-95; p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-e06284c3e4" data-kw="">
<blockquote><p>They are not, however, called ‘works of nature’ as if God works them by nature, seeing that outside Himself He acts not by necessity of nature but by the liberty of His will, Ps. 115:3; Eph. 1:11. … The moving cause of God unto creating was not any necessity or indigence, for He is in need of nothing, Acts 17:25, but His most free will, Ps. 115:3, by which He willed to communicate and manifest Himself to creatures, Gen. 1:27, 31, and thereby to be glorified by them, Ps. 8:1; 19:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

— Johann H. Alting, The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+are+not%2C+however%2C+called+%E2%80%98works+of+nature%E2%80%99+as+if+God+works+them+by+nature%2C+seeing+that+outside+Himself+He+acts+not+by+necessity+of+nature+but+by+the+liberty+of+His+will%2C+Ps.+115%3A3%3B+Eph.+1%3A11.+%E2%80%A6+The+moving+cause+of+God+unto+creating+was+not+any+necessity+or+indigence%2C+for+He+is+in+need+of+nothing%2C+Acts+17%3A25%2C+but+His+most+free+will%2C+Ps.+115%3A3%2C+by+which+He+willed+to+communicate+and+manifest+Himself+to+creatures%2C+Gen.+1%3A27%2C+31%2C+and+thereby+to+be+glorified+by+them%2C+Ps.+8%3A1%3B+19%3A1.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Alting%2C+The+Scriptural+Theology+of+Heidelberg%2C+vol.+1+%28d.+1644%3B+Amsterdam%3A+Jansson%2C+1646%29%2C+Locus+5%2C+%E2%80%98On+Creation%E2%80%99%2C+trans.+AI+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe06284c3e4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e06284c3e4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/creation#:~:text=They%20are%20not%2C%20however%2C%20called%20%E2%80%98works,glorified%20by%20them%2C%20Ps.%208%3A1%3B%2019%3A1&amp;text=They%20are%20not%2C%20however%2C%20called%20%E2%80%98works%20of%20nature&amp;text=to%20be%20glorified%20by%20them%2C%20Ps.%208%3A1%3B%2019%3A1" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d9be3d7a32" data-kw="">
<blockquote><p>I. What is Creation, the second special work of God (as you affirmed) that we are to inform ourselves of out of the Scriptures? B. It is a most powerful work of God the Father, the Son, and the Holy Ghost, by which in the beginning, in the space of six days, by his Word only, out of nothing, He made the heavens and the earth, with all things in them visible and invisible; to the praise of his infinite power, wisdom and goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-broughton.html">John Broughton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God &amp; Man, or a Treatise Catechistical, wherein the saving knowledge of God and man is plainly and briefly declared</cite>, … (London, 1623), pp. 31-32</span></figcaption>

</figure><figure class="quote" id="q-35ced3f6a9" data-kw="">
<blockquote><p>In his comprehensive series of disputations on creation that were originally held in 1638-1639, Voetius does not omit a discussion on how creation took place. In this context not much attention is given to the issue of the six days as such (although the work of creation is explained in its six days order), but Voetius maintains that creation took place in six days. He therefore rejects the ancient theory that the world was created at once (in instanti).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 3.1 ‘Creation in 6 Days’ in ch. 2, ‘Creation, Mosaic Physics, Copernicanism &amp; Divine Accommodation’ in Reformed Orthodoxy and Philosophy, 1625-1750: Gisbertus Voetius, Petrus Van Mastricht, and Anthonius Driessen Pre (Boston: Brill, 2006), pp. 105-13, p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“In his comprehensive series of disputations on creation that were originally held in 1638-1639, Voetius does not omit a discussion on how creation took place. In this context not much attention is given to the issue of the six days as such (although the work of creation is explained in its six days order), but Voetius maintains that creation took place in six days. He therefore rejects the ancient theory that the world was created at once (in instanti).”

— Aza Goudriaan, 3.1 ‘Creation in 6 Days’ in ch. 2, ‘Creation, Mosaic Physics, Copernicanism &amp; Divine Accommodation’ in Reformed Orthodoxy and Philosophy, 1625-1750: Gisbertus Voetius, Petrus Van Mastricht, and Anthonius Driessen Pre (Boston: Brill, 2006), pp. 105-13, p. 105">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+his+comprehensive+series+of+disputations+on+creation+that+were+originally+held+in+1638-1639%2C+Voetius+does+not+omit+a+discussion+on+how+creation+took+place.+In+this+context+not+much+attention+is+given+to+the+issue+of+the+six+days+as+such+%28although+the+work+of+creation+is+explained+in+its+six+days+order%29%2C+but+Voetius+maintains+that+creation+took+place+in+six+days.+He+therefore+rejects+the+ancient+theory+that+the+world+was+created+at+once+%28in+instanti%29.%E2%80%9D%0A%0A%E2%80%94+Aza+Goudriaan%2C+3.1+%E2%80%98Creation+in+6+Days%E2%80%99+in+ch.+2%2C+%E2%80%98Creation%2C+Mosaic+Physics%2C+Copernicanism+%26+Divine+Accommodation%E2%80%99+in+Reformed+Orthodoxy+and+Philosophy%2C+1625-1750%3A+Gisbertus+Voetius%2C+Petrus+Van+Mastricht%2C+and+Anthonius+Driessen+Pre+%28Boston%3A+Brill%2C+2006%29%2C+pp.+105-13%2C+p.+105&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F35ced3f6a9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/35ced3f6a9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-long-god-took-in-creating/#:~:text=In%20his%20comprehensive%20series%20of%20disputations,was%20created%20at%20once%20%28in%20instanti&amp;text=In%20his%20comprehensive%20series%20of%20disputations%20on%20creation&amp;text=the%20world%20was%20created%20at%20once%20%28in%20instanti" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

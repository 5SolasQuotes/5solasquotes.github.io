<main class="wrap"><figure class="quote" id="q-f4332c6c70" data-kw="">
<blockquote><p>That faithfulness implies, in its very nature, an undivided heart. The spirit of obedience is a spirit which makes no distinction among the commandments. Its language is not, “This is great and important, and must be done; this is small and insignificant, and may be slighted or omitted.” No! Its language is,” Then shall I not be ashamed when I have respect unto all thy commandments.” (Psalm cxix. 6; and compare Matt. iii. 19; James ii. 8-11.)

Indeed, a man’s conduct in little things is a sure test of his spirit and character, and, therefore, of what he is likely to do in great things. If he is unfaithful in small matters we do not expect him to be faithful in great ones; for it is in the so-called small matters that the authority of the Master is most nakedly, and, therefore, most emphatically, expressed; and so obedience is exhibited more emphatically in such matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Take Heed to Thyself (1889) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>6. Above all, see that you be followers of peace and unity, both in the Church and among your selves. Remember what I taught you on Heb. 12:14, he that is not a son of peace is not a son of God. All other sins destroy the Church consequentially, but division and separation demolish it directly. Building the Church is but an orderly joining of the materials; and what then is disjoining, but pulling down? Many doctrinal differences must be tolerated in a Church: And why? but for unity and peace? Therefore disunion and separation is utterly intolerable. Believe not those to be the Church’s friends that would cure and reform her by cutting her throat. Those that say, ‘No truth must be concealed for peace,’ have usually as little of the one as the other. Study Gal. 2:2; Rom. 14:1, etc. Acts 21:24, 26; 1 Tim 1:4 and 6:4; Tit. 3:8-9. I hope sad experience speaks this lesson to your very hearts, if I should say nothing. Do not your hearts bleed to look upon the state of England? and to think how few towns or cities there be (where is any forwardness in religion) that are not cut into shreds and crumbled as to dust by separations and divisions? To think what a wound we have hereby given to the very Christian name? How we have hardened the ignorant? Confirmed the Papists? And are ourselves become the scorn of our enemies and the grief of our friends? And how many of our dearest, best esteemed friends are fain to notorious pride or impiety? yea, some to be worse then open infidels? These are pillars of salt; see that you remember them. You are yet eminent for your unity, steadfastness, and godliness; hold fast that you have, that no man take your crown from you… If there be erroneous practices in the Church, keep yourselves innocent with moderation and peace: Do your best to reform them and rather remove your dwellings if you cannot live innocently, than rend the Church. It must be no small error that must force a separation… You know I never conformed to the use of mystical, symbolical rites myself (but only to the determination of circumstantials necessary in genere) and yet I ever loved a godly, peaceable Conformist better than a turbulent, non-conformist. I yet differ from many in several doctrines of greater moment than baptism… and yet if I should zealously press my judgment on others, and seek to make a party for it, and disturb the peace of the Church, and separate from my brethren, I should fear lest I should prove a firebrand in Hell for being a firebrand in the Church. And for all the interest I have in your judgments and affections, I here charge you that if God should give me up to any factious Church-rending course (against which I daily pray) that you forsake me and follow me not a step.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Everlasting Rest</cite>, (London: White, 1650), ‘To my dearly beloved friends’</span></figcaption>

</figure><figure class="quote" id="q-79ac24fe26" data-kw="">
<blockquote><p>The Papists have often endeavoured to overthrow the Reformation by secret plots and conspiracies. So there were many plots against the life of Luther. The Papists were engaged in contriving to dispatch him, and to put him out of their way; and he, as he was a very bold man, often very much exposed himself in the cause of Christ: but yet they were wonderfully prevented from hurting him, and he at last died in his bed in peace.

And so there have been from time to time innumerable schemes secretly laid for the overthrow of the Protestant religion; among which, that which seem to be most considerable, and which seemed to be the most likely to have taken effect, was that which was in the time of King James II. of England, which is within the memory of many of us. There was at that time a strong conspiracy between the King of England and Lewis XIV. of France, who were both Papists, to extirpate the Northern heresy, as they called the Protestant religion, not only out of England, but out of all Europe; and had laid their schemes so, that they seemed to be almost sure of their purpose.

They looked upon it, that if the Reformed religion were suppressed in the British realms, and in the Netherlands, which were the strongest part, and chief defence of the Protestant interest, they should have easy work with the rest. And just as their matters seemed to become to a head, and their enterprise ripe for execution, God, in his providence, suddenly dashed all their schemes in pieces by the Revolution, at the coming in of King William and Queen Mary; by which all their designs were at an end; and the Protestant interest was more strongly established, by the crown of England’s being established in the Protestant house of Hanover, and a Papist being, by the constitution of the nation, for ever rendered incapable of wearing the crown of England. Thus they groped in darkness at noon day as in the night, and their hands could not perform their enterprise, and their kingdom was full of darkness, and they gnawed their tongues for pain. …

There was also a terrible persecution in England in Queen Mary’s time, wherein great numbers in all parts of the kingdom were burnt alive. After this, though the Protestant religion has been for the most part established by law in England, yet there have been very severe persecutions by the high church men, who symbolize in many things with the Papists. Such a persecution was that which occasioned our forefathers to flee from their native country, and to come and settle in this land, which was then an hideous howling wilderness. These persecutions were continued with little intermission till King William come to the throne.

Scotland also has been the scene, for many years together, of cruelties and blood by the hands of high churchmen, such as came very little short of the Popish persecution in Queen Mary’s days, and in many things much exceed it, which continued till they were delivered by King William. …

So since, when the Popish powers have plotted the overthrow of the Reformed church, and have seemed just about to bring their matters to a conclusion, and to finish their design, then God has wonderfully appeared for the deliverance of his church, as it was in the time of the Revolution by King William.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), pp 225, 228, 242.</span></figcaption>

the+crown+of+England%E2%80%99s+being+established+in+the+Protestant+house+of+Hanover%2C+and+a+Papist+being%2C+by+the+constitution+of+the+nation%2C+for+ever+rendered+incapable+of+wearing+the+crown+of+England.+Thus+they+groped+in+darkness+at+noon+day+as+in+the+night%2C+and+their+hands+could+not+perform+their+enterprise%2C+and+their+kingdom+was+full+of+darkness%2C+and+they+gnawed+their+tongues+for+pain.+%E2%80%A6%0A%0AThere+was+also+a+terrible+persecution+in+England+in+Queen+Mary%E2%80%99s+time%2C+wherein+great+numbers+in+all+parts+of+the+kingdom+were+burnt+alive.+After+this%2C+though+the+Protestant+religion+has+been+for+the+most+part+established+by+law+in+England%2C+yet+there+have+been+very+severe+persecutions+by+the+high+church+men%2C+who+symbolize+in+many+things+with+the+Papists.+Such+a+persecution+was+that+which+occasioned+our+forefathers+to+flee+from+their+native+country%2C+and+to+come+and+settle+in+this+land%2C+which+was+then+an+hideous+howling+wilderness.+These+persecutions+were+continued+with+little+intermission+till+King+William+come+to+the+throne.%0A%0AScotland+also+has+been+the+scene%2C+for+many+years+together%2C+of+cruelties+and+blood+by+the+hands+of+high+churchmen%2C+such+as+came+very+little+short+of+the+Popish+persecution+in+Queen+Mary%E2%80%99s+days%2C+and+in+many+things+much+exceed+it%2C+which+continued+till+they+were+delivered+by+King+William.+%E2%80%A6%0A%0ASo+since%2C+when+the+Popish+powers+have+plotted+the+overthrow+of+the+Reformed+church%2C+and+have+seemed+just+about+to+bring+their+matters+to+a+conclusion%2C+and+to+finish+their+design%2C+then+God+has+wonderfully+appeared+for+the+deliverance+of+his+church%2C+as+it+was+in+the+time+of+the+Revolution+by+King+William.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+A+history+of+the+work+of+redemption.+Containing+the+outlines+of+a+body+of+divinity%2C+in+a+method+entirely+new%2C+ed.+John+Erskine+%281774%3B+Boston%2C+1782%29%2C+pp+225%2C+228%2C+242.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F79ac24fe26.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/79ac24fe26.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/20/jonathan-edwards-on-king-william-iii-and-the-defeat-of-popish-plots-against-the-reformed-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>

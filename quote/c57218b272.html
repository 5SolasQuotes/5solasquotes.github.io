<blockquote><p>1. This whole matter of sanctification and holiness is peculiarly joined with and limited unto the doctrine, truth, and grace of the gospel; for holiness is nothing but the implanting, writing, and realizing of the gospel in our souls. Hence it is termed Ὁσιότης τῆς ἀληθείας, Eph. 4:24,—“The holiness of truth;” which the truth of the gospel ingenerates, and which consists in a conformity thereunto. And the gospel itself is ἀληθείας τῆς κατ᾿ εὐσέβειαν, Tit. 1:1,—“The truth which is according unto godliness;” which declares that godliness and holiness which God requireth. The prayer, also, of our Saviour for our sanctification is conformed thereunto: John 17:17, “Sanctify them in” (or by) “thy truth: thy word is truth.” And he sanctified himself for us to be a sacrifice, that “we might be sanctified in the truth.” This alone is that truth which makes us free, John 8:32,—that is, from sin and the law, unto righteousness in holiness. It belongs neither to nature nor the law, so as to proceed from them or to be effected by them. Nature is wholly corrupted and contrary unto it. The “law,” indeed, for certain ends, “was given by Moses,” but all “grace and truth came by Jesus Christ.” There neither is, nor ever was, in the world, nor ever shall be, the least dram of holiness, but what, flowing from Jesus Christ, is communicated by the Spirit, according to the truth and promise of the gospel. There may be something like it as to its outward acts and effects (at least some of them), something that may wear its livery in the world, that is but the fruit of men’s own endeavours in compliance with their convictions; but holiness it is not, nor of the same kind or nature with it. And this men are very apt to deceive themselves withal. It is the design of corrupted reason to debase all the glorious mysteries of the gospel, and all the concernments of them. There is nothing in the whole mystery of godliness, from the highest crown of it, which is the person of Christ, “God manifested in the flesh,” unto the lowest and nearest effect of this grace, but it labours to deprave, dishonour, and debase. The Lord Christ, it would have in his whole person to be but a mere man, in his obedience and suffering to be but an example, in his doctrine to be confined unto the capacity and comprehension of carnal reason, and the holiness which he communicates by the sanctification of his Spirit to be but that moral virtue which is common among men as the fruit of their own endeavours. Herein some will acknowledge that men are guided and directed to a great advantage by the doctrine of the gospel, and thereunto excited by motions of the Holy Ghost himself, put forth in the dispensation of that truth; but any thing else in it more excellent, more mysterious, they will not allow. But these low and carnal imaginations are exceedingly unworthy of the grace of Christ, the glory of the gospel, the mystery of the recovery of our nature, and healing of the wound it received by the entrance of sin, with the whole design of God in our restoration unto a state of communion with himself. Moral virtue is, indeed, the best thing amongst men that is of them. It far exceeds in worth, use, and satisfaction, all that the honours, powers, profits, and pleasures of the world can extend unto. And it is admirable to consider what instructions are given concerning it, what expressions are made of its excellency, what encomiums of its use and beauty, by learned contemplative men among the heathen; the wisest of whom did acknowledge that there was yet something in it which they could only admire, and not comprehend. And very eminent instances of the practice of it were given in the lives and conversations of some of them; and as the examples of their righteousness, moderation, temperance, equanimity, in all conditions, rise up at present unto the shame and reproach of many that are called Christians, so they will be called over at the last day as an aggravation of their condemnation. But to suppose that this moral virtue, whatever it be really in its own nature, or however advanced in the imaginations of men, is that holiness of truth which believers receive by the Spirit of Christ, is to debase it, to overthrow it, and to drive the souls of men from seeking an interest in it. And hence it is that some, pretending highly a friendship and respect unto it, do yet hate, despise, and reproach what is really so, pleasing themselves with the empty name or withered carcass of virtue, every way inferior, as interpreted in their practice, to the righteousness of heathens. And this, in the first place, should stir up our diligence in our inquiries after its true and real nature, that we deceive not ourselves with a false appearance of it, and that unto our ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen, ed. William H. Goold, vol. 3 (Edinburgh: T&amp;T Clark, n.d.), 370.</cite></span></figcaption>

<blockquote><p>The great question is, What constitutes a Christian? It is being so constrained by a sense of the love of our divine Lord to us, that we consecrate our lives to him. Hence, faith in his divinity, faith in his love, faith in his having died for us, is the principle or source of the Christian life. And this is the only form in which true religion can now exist. That is, the only true religion now possible is, the worship, love, and service of the Lord Jesus Christ.</p></blockquote>

<blockquote><p>3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christs blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33</cite>, pp. 334-35</span></figcaption>

<blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>

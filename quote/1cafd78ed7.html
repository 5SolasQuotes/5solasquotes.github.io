<main class="wrap"><figure class="quote" id="q-1cafd78ed7" data-kw="">
<blockquote><p>George Whitefield is often thought of as the archetypal “evangelical Calvinist”, hence we find his picture on the spine of Banner of Truth books. Moreover, one denomination, which attempts to marry revivalism and Calvinism, even named their theological hall after him. However, it is worth keeping in mind that both the early Reformed Presbyterians and the early Seceders regarded his brand of revivalism as deeply injurious to the covenanted reformation, due to its latitudinarianism and physical manifestations. In other words, they released that evangelicalism and covenanting principles were wholly incompatible. Here is what the Associate Presbytery, when renewing the covenants in 1763, thought of Whitefield’s religious movement:

The sins and provocations of this land are further increased, by the kind of reception that many, both ministers and people, have given to Mr George Whitefield, a professed member and priest of the superstitious church of England, and by the great entertainment that has been given to Latitudinarian Tenets, as further propagated by him and others; whereby any particular form of church-government is denied to be of divine institution, and, under a pretence of catholic love, a scheme is laid for uniting parties of all denominations in church communion, in a way destructive of any testimony for the declarative glory of Immanuel, as Head and King of Zion, and for the covenanted reformation of this church and land: for which a righteous God hath justly chosen their delusions, and sent forth a spirit of delusion among them, in the present awful work upon the bodies and spirits of men. And, tho’ the Lord has been pleased, in his sovereign goodness, to preserve a remnant from being carried off by the above dangerous scheme and awful delusion; yet, while endeavouring to testify against the same before the world, we have not be suitably exercised thereanent before the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-seceders.html">Scottish Seceders</a></span><span class="wk"><span class="lbl">Work:</span> <cite>for renewing the National Covenant of Scotland, and the Solemn League and Covenant of the three kingdoms in a way and manner agreeable to our present situation and circumstances in this period</cite>, (Glasgow, 1763), pp 34-5.</span></figcaption>

<blockquote><p>The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, section 18, ‘They Separate Themselves from the True Churches of Christ’ in ch. 7, ‘Of the Peculiar Manner &amp; Form of Speech used by the Quintinists (i.e. a pack of Libertines then living)’ in A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy… (London, 1658), on 2 Tim. 3:8, pp. 166-67</span></figcaption>

%20piece%20from%20another" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f93f5805cc" data-kw="">
<blockquote><p>Sixteen of these [field] ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church</cite>, (London: Blackie &amp; Son, 1875), pp. 328-331</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-8f801482aa" data-kw="">
<blockquote><p>Is it not the same Christians whom you then derided, and now revile at, and condemn as Children of the devil: O miserable man! Is all your hearing and praying come to this? Dare you meet the Messengers of Christ in the face, and tell them they are Liars and deceivers?

Dare you cast out the holy worship of Christ as false worship, and seek to draw people into the contempt of it? Dare you damn those Churches and millions of Saints that Christ hath bought with his precious blood? Dare you seek to draw men to hate their Teachers whom Christ hath set over them, and to hate his people as if they were the Children of the Devil, and to hate his worship and holy ways?

Alas that ever a man in his wits should look upon such abominations as amiable, and much more that any man should be so mad as to do this under the Name and profession of a Christian! That you can imagine that the furious opposition to the whole Army of Christ, his Officers, Church and Ordinances, can yet be a work that Christ accepteth: That you should no better know Christ’s work from Satan’s, nor know that it is the Dragon whose warfare these men do manage?

I must needs profess that it is a very grievous thing in mine eyes, that after all our pains with men’s souls, and after the rejoicings which we had in their seeming conversion, and zealous lives, we should yet see so much ignorance, levity, and giddiness of professors, as that they are ready to entertain the most horrid abominations!

That the devil can no sooner bait his hook, but they greedily catch at it, and swallow it without chewing; yea, nothing seems too gross for them, but so it seems Novelty all goes down. I am afraid if they go a little further, they will believe him that shall say, The Devil is God, and to be worshipped and obeyed. Shall I freely tell you whence all this comes? Even from hellish pride of heart: You see it not (it’s like) in your self or in them, but I shall endeavour to make you see it both in your selves and them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), unpaginated.</span></figcaption>

— Richard Baxter, The Quakers catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction, (London: Thomas Underhill and Francis Tyton, 1655), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs+it+not+the+same+Christians+whom+you+then+derided%2C+and+now+revile+at%2C+and+condemn+as+Children+of+the+devil%3A+O+miserable+man%21+Is+all+your+hearing+and+praying+come+to+this%3F+Dare+you+meet+the+Messengers+of+Christ+in+the+face%2C+and+tell+them+they+are+Liars+and+deceivers%3F%0A%0ADare+you+cast+out+the+holy+worship+of+Christ+as+false+worship%2C+and+seek+to+draw+people+into+the+contempt+of+it%3F+Dare+you+damn+those+Churches+and+millions+of+Saints+that+Christ+hath+bought+with+his+precious+blood%3F+Dare+you+seek+to+draw+men+to+hate+their+Teachers+whom+Christ+hath+set+over+them%2C+and+to+hate+his+people+as+if+they+were+the+Children+of+the+Devil%2C+and+to+hate+his+worship+and+holy+ways%3F%0A%0AAlas+that+ever+a+man+in+his+wits+should+look+upon+such+abominations+as+amiable%2C+and+much+more+that+any+man+should+be+so+mad+as+to+do+this+under+the+Name+and+profession+of+a+Christian%21+That+you+can+imagine+that+the+furious+opposition+to+the+whole+Army+of+Christ%2C+his+Officers%2C+Church+and+Ordinances%2C+can+yet+be+a+work+that+Christ+accepteth%3A+That+you+should+no+better+know+Christ%E2%80%99s+work+from+Satan%E2%80%99s%2C+nor+know+that+it+is+the+Dragon+whose+warfare+these+men+do+manage%3F%0A%0AI+must+needs+profess+that+it+is+a+very+grievous+thing+in+mine+eyes%2C+that+after+all+our+pains+with+men%E2%80%99s+souls%2C+and+after+the+rejoicings+which+we+had+in+their+seeming+conversion%2C+and+zealous+lives%2C+we+should+yet+see+so+much+ignorance%2C+levity%2C+and+giddiness+of+professors%2C+as+that+they+are+ready+to+entertain+the+most+horrid+abominations%21%0A%0AThat+the+devil+can+no+sooner+b

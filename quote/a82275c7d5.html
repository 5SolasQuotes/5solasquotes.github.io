</figure><figure class="quote" id="q-666c16c43d" data-kw="">
<blockquote><p>They who truly fear the name of God are indeed scandalized by the Prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified… Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will, provoked Pharaoh the more to oppress them; or than Christ’s preaching of the truth, and his abstaining from the superstitious ceremonies of the Pharisees, provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-2dbf753d25" data-kw="">
<blockquote><p>For the subject of royal power, we affirm, the first and ultimate, and native subject of all power is the community, as reasonable men naturally inclining to a society; but the ethical and political subject, or the legal and positive receptacle of this power is various, according to the various constitutions of the policy. In Scotland and England, it is the three estates of parliament; in other nations, some other judges or peers of the land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8e381f417c" data-kw="">
<blockquote><p>But a king, by a sort of contingency, succeeds to kings; for nature does not ascertain us there must be kings to the world’s end, because the essence of governors is kept safe in aristocracy and democracy, though there were no kings; and that kings should necessarily have been in the world, if man had never fallen in sin, I am not, by any cogent argument, induced to believe. I conceive there should have been no government but those of fathers and children, husband and wife, and (which is improperly government) some more gifted with supervenient additions to nature, as gifts and excellencies of engines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 79 lt col top</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-031e75f6c4" data-kw="">
<blockquote><p>I conceive kings are conceived to have a threefold supreme power:

1. Strictly absolute to do what they please, their will being simply a law. This is tyrannical. Some kings have it, de facto, ex consuetudine [by custom], but by a divine law none have it…

2. There is another power limited to God’s law, the due proper right of kings. (Dt. 17:18-20)

3. There is, a potestas intermedia, a middle power, not so vast as that which is absolute and tyrannical, which yet is some way human. This I take what jurists call jus regium, lex regia, jura regalia regis; Cicero, jura majestatis; Livius, jura imperii, and these royal privileges are such common and high dignities as no one particular magistrate can have [inherently, or to himself alone], seeing they are common to all the kingdom… so the magazine and armory for the safety of the kingdom is in the king’s hand. The king has the like of these privileges, because he is the common, supreme, public officer and minister of God for the good of all the kingdom; and, amongst these royal privileges, I reckon that power that is given to the king, when he is made king, to do many things without warrant of the letter of the law, without the express consent of his council, which he cannot always carry about with him, as the law says. The king shall not raise armies without consent of the parliament; but if an army of Irish, or Danes, or Spaniards, should suddenly land in Scotland, he has a power, without a formally-convened parliament, to command them all to rise in arms against these invaders and defend themselves — this power no inferior magistrate has as he is, but [only] such a magistrate [as the king]. And in many such exigencies, when the necessity of justice or grace requires an ex-temporal [out of the moment] exposition of laws, pro re nata, ‘for present necessary execution’, some say only the emperor, — others, all kings have these pleasures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), Question 39, ‘Whether or No any Prerogative at All Above the Law be Due to the King, or if Jura Magestatis [the Rights of Majesty] be any Such Prerogative Royal?’, p. 193</span></figcaption>

</figure><figure class="quote" id="q-15291052f3" data-kw="">
<blockquote><p>…the Magistrate indeed forbids speaking of blasphemy and teaching of lies in the name of the Lord, but he forbids not teaching of lies, or abstinence from blaspheming, in a spiritual, but in a carnal, co-active, by force of the sword and external way, because he cannot punish the spiritual and internal ways and manner of external obedience, and therefore he cannot under pain of bodily censure command and forbid these ways of obedience; so the Magistrate forbids murder, but God, not the Magistrate, forbids murder, or commands abstinence from killing, out of mercy and love to our neighbor; for the Magistrate cannot punish heart-hatred of our neighbor, or rash anger, but insofar as it comes out to his senses, in striking, maiming, or opprobrious speeches; and these he can forbid and censure and punish. So we say [that] the Magistrate is but a piece, or a bit of an ordinance (though both lawful and necessary, Rom. 13, for our good [v. 4]) to reform the outside and to work outward reformation; and when he commands the outward man and says, ‘Swear not, blaspheme not, speak not lies in the name of the Lord, kill not, steal not under the pain of feeling the stroke of the sword’: he commands not sinning. For though he forbid only external abstinence from sins that troubles the outward man, without any spiritual and internal right way of abstaining, he commands not sin and hypocrisy, per se, and kindly [in its kind], and properly.

1. Because the Magistrate, as the Magistrate, should and ought, as the Minister of God, give commandments to the outward man under pain of corporal punishment, not to the soul or to the inward man.

2. Because that external obedience, not to kill, not to steal, not to speak lies, is good, lawful external obedience, to man, and profitable in the State for the end that God has appointed it, which is the peaceable conversing one with another; that same abstinence from killing in an unrenewed man, who abstains not from killing for fear of God and love to his brethren, is a sinful abstinence and carnal repentance, by accident, and in relation to the Law of God; but the Magistrate neither commands abstinence from killing from an inward spiritual principle, nor forbids he the contrary: he commands not abstinence from false doctrine out of the love that the messenger owes to him who purchased the flock with his blood, nor forbids he such abstinence, but only he commands abstinence from speaking lies to the people of God.

3. If we distinguish obedience, there is first a necessary and good and lawful obedience. 2. There is an obedience complete and entire, and full, and sincere. Outward obedience, which the Magistrate commands, is good and lawful and [is] necessary obedience, and is, in the kind of external and necessary obedience (I mean) necessary for its end, [namely] the safety of the society, not hypocritical, unlawful or sinful. In this notion only it is commanded by the Magistrate, and the omission of it [is] unlawful and punishable by the sword of the deputy and Minister of God. But if we speak of an obedience complete, full and sincere, which is required from the whole man in order to the Law of God, then the outward obedience that the Magistrate demands is not complete, entire, nor sincere, but in relation to the Law of God, which requires entire obedience from the whole man, soul and body, it is not full, not entire, not sincere obedience, but an outside of obedience; but in this sense the Magistrate does not demand obedience to the Law of God, for he has to do with the outward man only and as a Magistrate has nothing to do with the soul and conscience: so then, though the Magistrate command to preach sound doctrine, forbid to preach lies in the name of the Lord, yet he commands not hypocrisy and sin; for this argument may as well prove [that] the Magistrate should neither forbid nor punish murder, nor command abstinence from murder to an unrenewed man, for an unrenewed man cannot but abstain from murder in a sinful way, and his abstinence from murder, in order to the spiritual Law of God, is no better ‘than the oblation of swine’s blood, and the cutting off of a dog’s head to God,’ Isa. 66. 1:2, as is all external obedience of either Tables of the Law, First or Second, without faith and spiritual, inward, moral principles and heart-obedience; and Mr. Williams cannot answer this argument but by the principles of Anabaptists, Familists and Enthusiasts, who say [that] all outward ordinances, ministry, preaching, sacraments, yea preachers and magistrates who command outward obedience to God are unlawful now under the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649) | Ch. 27, ‘Whether our Darkness &amp; Incapacity to Believe…’, p. 323-5 (356-8)</span></figcaption>

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience, … (1649) | Ch. 27, ‘Whether our Darkness &amp; Incapacity to Believe…’, p. 323-5 (356-8)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Magistrate+indeed+forbids+speaking+of+blasphemy+and+teaching+of+lies+in+the+name+of+the+Lord%2C+but+he+forbids+not+teaching+of+lies%2C+or+abstinence+from+blaspheming%2C+in+a+spiritual%2C+but+in+a+carnal%2C+co-active%2C+by+force+of+the+sword+and+external+way%2C+because+he+cannot+punish+the+spiritual+and+internal+ways+and+manner+of+external+obedience%2C+and+therefore+he+cannot+under+pain+of+bodily+censure+command+and+forbid+these+ways+of+obedience%3B+so+the+Magistrate+forbids+murder%2C+but+God%2C+not+the+Magistrate%2C+forbids+murder%2C+or+commands+abstinence+from+killing%2C+out+of+mercy+and+love+to+our+neighbor%3B+for+the+Magistrate+cannot+punish+heart-hatred+of+our+neighbor%2C+or+rash+anger%2C+but+insofar+as+it+comes+out+to+his+senses%2C+in+striking%2C+maiming%2C+or+opprobrious+speeches%3B+and+these+he+can+forbid+and+censure+and+punish.+So+we+say+%5Bthat%5D+the+Magistrate+is+but+a+piece%2C+or+a+bit+of+an+ordinance+%28though+both+lawful+and+necessary%2C+Rom.+13%2C+for+our+good+%5Bv.+4%5D%29+to+reform+the+outside+and+to+work+outward+reformation%3B+and+when+he+commands+the+outward+man+and+says%2C+%E2%80%98Swear+not%2C+blaspheme+not%2C+speak+not+lies+in+the+name+of+the+Lord%2C+kill+not%2C+steal+not+under+the+pain+of+feeling+the+stroke+of+the+sword%E2%80%99%3A+he+commands+not+sinning.+For+though+he+forbid+only+external+abstinence+from+sins+that+troubles+the+outward+man%2C+without+any+spiritual+and+internal+right+way+of+abstaining%2C+he+commands+not+sin+and+hypocrisy%2C+per+se%2C+and+kindly+%5Bin+its+kind%5D%2C+and+properly.+1.+Because+the+Magistrate%2C+as+the+Magistrate%2C+should+and+ought%2C+as+the+Minister+of+God%2C+give+commandments+to+the+outward+man+under+pain+of+corporal+punishment%2C+not+to+the+soul+or+to+the+inward+man.+2.+Because+that+external+obedience%2C+not+to+kill%2C+not+to+steal%2C+not+to+speak+lies%2C+is+good%2C+lawful+external+obedience%2C+to+man%2C+and+profitable+in+the+State+for+the+end+that+God+has+appointed+it%2C+which+is+the+peaceable+conversing+one+with+another%3B+that+same+abstinence+from+killing+in+an+unrenewed+man%2C+who+abstains+not+from+killing+for+fear+of+God+and+love+to+his+brethren%2C+is+a+sinful+abstinence+and+carnal+repentance%2C+by+accident%2C+and+in+relation+to+the+Law+of+God%3B+but+the+Magistrate+neither+commands+abstinence+from+killing+from+an+inward+spiritual+principle%2C+nor+forbids+he+the+contrary%3A+he+commands+not+abstinence+from+false+doctrine+out+of+the+love+that+the+messenger+owes+to+him+who+purchased+the+flock+with+his+blood%2C+nor+forbids+he+such+abstinence%2C+but+only+he+commands+abstinence+from+speaking+lies+to+the+people+of+God.+3.+If+we+distinguish+obedience%2C+there+is+first+a+necessary+and+good+and+lawful+obedience.+2.+There+is+an+obedience+complete+and+entire%2C+and+full%2C+and+sincere.+Outward+obedience%2C+which+the+Magistrate+commands%2C+is+good+and+lawful+and+%5Bis%5D+necessary+obedience%2C+and+is%2C+in+the+kind+of+external+and+necessary+obedience+%28I+mean%29+necessary+for+its+end%2C+%5Bnamely%5D+the+safety+of+the+society%2C+not+hypocritical%2C+unlawful+or+sinful.+In+this+notion+only+it+is+commanded+by+the+Magistrate%2C+and+the+omission+of+it+%5Bis%5D+unlawful+and+punishable+by+the+sword+of+the+deputy+and+Minister+of+God.+But+if+we+speak+of+an+obedience+complete%2C+full+and+sincere%2C+which+is+required+from+the+whole+man+in+order+to+the+Law+of+God%2C+then+the+outward+obedience+that+the+Magistrate+demands+is+not+complete%2C+entire%2C+nor+sincere%2C+but+in+relation+to+the+Law+of+God%2C+which+requires+entire+obedience+from+the+whole+man%2C+soul+and+body%2C+it+is+not+full%2C+not+entire%2C+not+sincere+obedience%2C+but+an+outside+of+obedience%3B+but+in+this+sense+the+Magistrate+does+not+demand+obedience+to+the+Law+of+God%2C+for+he+has+to+do+with+the+outward+man+only+and+as+a+Magistrate+has+nothing+to+do+with+the+soul+and+conscience%3A+so+then%2C+though+the+Magistrate+command+to+preach+sound+doctrine%2C+forbid+to+preach+lies+in+the+name+of+the+Lord%2C+yet+he+commands+not+hypocrisy+and+sin%3B+for+this+argument+may+as+well+prove+%5Bthat%5D+the+Magistrate+should+neither+forbid+nor+punish+murder%2C+nor+command+abstinence+from+murder+to+an+unrenewed+man%2C+for+an+unrenewed+man+cannot+but+abstain+from+murder+in+a+sinful+way%2C+and+his+abstinence+from+murder%2C+in+order+to+the+spiritual+Law+of+God%2C+is+no+better+%E2%80%98than+the+oblation+of+swine%E2%80%99s+blood%2C+and+the+cutting+off+of+a+dog%E2%80%99s+head+to+God%2C%E2%80%99+Isa.+66.+1%3A2%2C+as+is+all+external+obedience+of+either+Tables+of+the+Law%2C+First+or+Second%2C+without+faith+and+spiritual%2C+inward%2C+moral+principles+and+heart-obedience%3B+and+Mr.+Williams+cannot+answer+this+argument+but+by+the+principles+of+Anabaptists%2C+Familists+and+Enthusiasts%2C+who+say+%5Bthat%5D+all+outward+ordinances%2C+ministry%2C+preaching%2C+sacraments%2C+yea+preachers+and+magistrates+who+command+outward+obedience+to+God+are+unlawful+now+under+the+New+Testament.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%2C+%E2%80%A6+%281649%29+%7C+Ch.+27%2C+%E2%80%98Whether+our+Darkness+%26+Incapacity+to+Believe%E2%80%A6%E2%80%99%2C+p.+323-5+%28356-8%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F15291052f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/15291052f3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=the%20Magistrate%20indeed%20forbids%20speaking%20of,unlawful%20now%20under%20the%20New%20Testament&amp;text=the%20Magistrate%20indeed%20forbids%20speaking%20of%20blasphemy%20and&amp;text=God%20are%20unlawful%20now%20under%20the%20New%20Testament" rel="noopener" target="_blank">Read it o

<main class="wrap"><figure class="quote" id="q-e8cbde0749" data-kw="">
<blockquote><p>The time of their [the devils’] standing in their primitive state is conceived to be very short; for their creation (though the Socinians hold it was long before) must fall within the compass of six days, for in that space the Scripture tells us God made heaven and earth, and all things therein: and therefore within the space of six days He created the angels also. Some refer their creation to the first day’s work, others to the fourth day: and it’s probably thought that Adam’s continuance in innocency was not much above one day, and yet even then there were fallen Angels to tempt him: so that their glorious and blessed state could not, according to the computation, last above six or seven days, such a speedy issue did God make with them upon their very first sin…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Discourses or Sermons</cite>, … (London: 1693), Of Pardon &amp; Forgiveness of Sin, etc. bk. 5, pp. 29-30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-f207c9e0fe" data-kw="">
<blockquote><p>…those dreamers who have a spirit of bitterness and contradiction, who reprove everything and prevent the order of nature. We will see some who are so deranged, not only in religion but who in all things reveal their monstrous nature, that they will say that the sun does not move, and that it is the earth which shifts and turns. When we see such minds we must indeed confess that the devil posses them, and that God sets them before us as mirrors, in order to keep us in his fear. So it is with all who argue out of pure malice, and who happily make a show of their imprudence. When they are told: “That is hot,” they will reply: “No, it is plainly cold.” When they are shown an object that is black, they will say that it is white, or vice versa. Just like the man who said that snow is black; for although it is perceived and known by all to be white, yet he clearly wished to contradict the fact. And so it is that they are madmen who would try to change the natural order, and even to dazzle eyes and benumb their senses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Sermon on 1 Corinthians 10:19-24’ in Calvini Opera Selecta, Corpus Refomatorum</cite>, Vol 49, p. 677, tr. Robert White in ‘Calvin &amp; Copernicus: the Problem Reconsidered’ in Calvin Theological Journal 15 (1980), pp. 236-237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-6ac0ce38d8" data-kw="">
<blockquote><p>But that this world should be made at such a time, and at first of no pre-existent matter, and in the space of six days, and in that order one part after another, and by the Word of God as the sole efficient, and so many years ago, is far above reason.</p></blockquote>

<blockquote><p>4. Newness of being is essential to it [created being], or of its notion… 5. As also assiduous dependence on the First Being and containment or inexistence in it. But its being in God is threefold: eminent, ideal, intelligible. In that way it is in his power as in an efficient cause, conserving and governing: in that [ideal way] in the idea as in an exemplary cause: in this [intelligible way] in knowledge as in the knower, the most beautiful Himself bearing the beautiful world in mind, etc., Boethius sings. And divinely the apostle, Acts 17: ‘In Him we live, and move, and are:’ and, τοῦ γὰρ καὶ γένος ἐσμέν, as the apostle [cites] there from Aratus. [This is] Against Durandus and those of whom Augustine makes mention, bk. 5, On the Literal Meaning of Genesis, who denied concourse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, pt. 2, On Creation, pt. 2, p. 118, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-475cd4b38b" data-kw="">
<blockquote><p>One of the tasks which the Westminster Assembly initially hoped to perform was a revision of the 39 Articles of the Church of England. This idea, however, was later abandoned as they decided to frame a new confession of faith (new in form, rather than wholly new in substance) for the three kingdoms in accordance with the Solemn League and Covenant. Nonetheless, they did make alterations to the first fifteen articles. One notable alteration was made to Article VII on the Old Testament law. Before looking at the Westminster divines’ revision, let us read the original:

Article VII. Of the Old Testament

The Old Testament is not contrary to the New: for both in the Old and New Testament everlasting life is offered to Mankind by Christ, who is the only Mediator between God and Man, being both God and Man. Wherefore they are not to be heard, which feign that the old Fathers did look for transitory promises. Although the Law given from God by Moses, as touching Ceremonies and Rites, do not bind Christian men, nor the Civil precepts thereof ought of necessity to be received in any commonwealth; yet notwithstanding no Christian man whatsoever is free from the obedience of the Commandments which are called Moral.[1]

The 39 Articles appeared to deny that the Mosaic judicials were in any sense binding upon Christian nations, though that conclusion is debatable as we would need to determine what is meant by “the Civil precepts thereof”? Does that statement refer to the judicial law simpliciter or to what was uniquely Mosaic in the Old Testament judicial law. Regardless of which answer is correct, the Westminster divines took great care to avoid excesses on this subject. Although their revision indicates that they repudiated the view that the entire judicial law of Moses remained valid, nevertheless, the revision is carefully worded in order to exclude the judicial laws of common equity from the category of laws which no longer bind Christian commonwealths:

ART. 7. Of the Old Testament

The Old Testament is not contrary to the New, in the doctrine contained in them, for both in the Old and New Testament everlasting life is offered to mankind by Christ, who is the only Mediator between God and man, being both God and Man. Wherefore they are not to be heard, which feign, that the old fathers did look only for temporary promises.

Although the Law given from God by Moses, as touching Ceremonies and Rites, do not bind Christians, nor the Civil precepts given by Moses, such as were peculiarly fitted to the Common-wealth of the Jews, are of necessity to be received in any Common-wealth: yet notwithstanding no Christian man whatsoever is free from the obedience of the Commandments which are called Moral. By the Moral Law we understand all the ten Commandments taken in their full extent.[2]

Observe the slight divergence with the 39 Articles: whereas the Articles may give the impression that we are free from the Mosaic judicial law as a whole, the Westminster divines made it clear that we are only released from observing those laws given to Israel which were of particular right. Yet by arguing that such laws are not ‘of necessity’ to be received by Christian commonwealths, the revision perhaps implies that some laws of particular right may contain a general equity which requires obedience in parallel cases (cf. Westminster Confession 19:4). So while it is not necessary for modern nations to observe the law about leaving fields un-gleaned for the poor, nevertheless, the general equity of making legal provision for the needy remains.

Moreover, the divines’ revision to Article VII implies that those judicial laws that were not peculiarly fitted to the Jewish commonwealth remain valid in the New Testament. These are the laws of common equity, which are part of the law of nature. Being part of the law of nature, such judicial laws are moral commands that can never expire. They are thus part of the ‘ten Commandments taken in their full extent’ and remain binding as they have not been abrogated in the New Testament.

[1] Articles agreed upon by the Archbishops and bishops of both provinces and the whole clergy, in the Convocation Holden at London in the year 1562, for the avoiding of diversities of opinions, and for the establishing of consent touching true religion: reprinted by command of his Majesty King Charles I with his royal declaration prefixed thereunto repr. in The Book of Common Prayer and the administration of the sacraments and other rites and ceremonies of the church according to the use of the Church of England (Oxford,n.d.), p. 679.</p></blockquote>

<blockquote><p>Omitting many other passages that might be cited from the New Testament, in favour of capital punishment, I shall notice only two. “But we know that the law is good, if a man use it lawfully.” 1 Tim. i. 8. The law to which the apostle refers, is evidently what we call the judicial law; for it was not made for a righteous man, but for the lawless and disobedient. But this is not true of either the moral or ceremonial law, for they were made for righteous men: the Lord Jesus Christ obeyed them both. Now when we call a law good, we mean that the penalty is just. When the law of England hung people for stealing we called it a bad law, because the penalty was too severe; we call the law which hangs men for murder a good law, because the penalty is exactly proportioned to the crime. We see, then, that those laws which our modern illuminati call bloody laws, Paul calls good laws. In Hebrews ii. 2, it is said, “If the word spoken by angels* was steadfast, and every transgression and disobedience received a just recompense of reward.” The penalty inflicted on criminals by the Mosaic law, is called a just recompense of reward: it was neither too light, nor too severe – just such as infinite wisdom and goodness saw fit to appoint.

* Angels, (Messengers,) including Moses and the prophets.</p></blockquote>

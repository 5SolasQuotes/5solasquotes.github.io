<main class="wrap"><figure class="quote" id="q-779ef8841e" data-kw="">
<blockquote><p>Although Christ assumed human nature, yet he did not on that account assume it in order to provide a model for carvers and painters. He denied that he had come “to abolish the law and the prophets” (Matt. 5:17). But images are forbidden by the law and the prophets” (Deut. 4:15; Isa. 44:9). He denied that his bodily presence would be profitable for the Church, and promised that he would be near us by his Spirit forever (John 16:7). Who, therefore, would believe that a shadow or likeness of his body would contribute any benefit to the pious? (II Cor. 5:5). Since he abides in us by his Spirit, we are therefore the temple of God (I Cor. 3:16). But “what agreement has the temple of God with idols?” (II Cor. 6:16)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Helvetic Confession(1566)</cite>, ch. 4.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51d687d320" data-kw="">
<blockquote><p>‘Why then’ (say they) ‘have we cast out all the significant ceremonies of Popery?’ Not for their significancy barely, but for their weight and measure. They are not to them only as outward garnishments of worship, but as proper worship, efficacious and meritorious. Their number stifles devotion and fills it with shows without substance. A cup of water refreshes, but a whole well of water chokes. Yea, an hundred sermons weekly would not edify; they would eat out our conscience in our particular callings. Much more would an hundred ceremonies eat out the substance of our general callings, when a few may much refresh and profit, if judgment overpower fancy and affection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639), sect. 15, p. 207 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>(4) …1 Tim. 2:9. And therefore the leaving the breasts naked, in whole or in part, is a transgression of this rule; they uncover their nakedness which they should vail and hide, especially in God’s presence: as the apostle says, 1 Cor. 11:10, ‘The woman ought to have power on her head, because of the angels.’ In the assembly there you meet with angels and devils; angels to observe your garb and carriage, and devils to tempt you; therefore be covered because of the angels. Yet usually women come hither with a shameless impudence into the presence of God, men and angels. This is a practice that neither suits with modesty nor conveniency; nothing can be alleged for it but reasons of pride and wantonness; it feeds your own pride and provokes lust in others. You would think they were wicked women that should offer others poison to drink; they do that which is worse, lay a snare for the soul, uncover that which should be covered; lest you provoke others of your rank to imitate your vanity, if they should not by the fear of God be guarded from unclean thoughts and filthy desires.</p></blockquote>

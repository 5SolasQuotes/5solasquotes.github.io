<blockquote><p>Because power of life and death is by a positive law, presupposing sin and the fall of man; and if Adam, standing in innocency, could lawfully kill his son, though the son should be a malefactor, without any positive law of God, I much doubt.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46b0f1e685" data-kw="">
<blockquote><p>From that which has been said two things may be gathered:

1. How the Covenant made with Adam, called by some divines the Covenant of Nature, agrees and differs from the Covenant of Grace. They agree in a general consideration of: [1] The author, which is God only wise, most holy, our supreme and absolute sovereign.

2. The matter of the covenant, which is a commandment and promise of reward.

3. The persons contracting or covenanting, which are God and man.

4. The subject not differenced by special respects, for the Law was given and [the] Gospel [was] revealed to man.

5. The form of administration, because to both covenants is annexed a restipulation.

6. The end, viz. the blessedness of man, and the glory of God manifested in his wisdom, bounty and goodness.

7. As Adam in the state of Innocency was made able to fulfill the Covenant made with him: so is the Covenant of Grace written in the hearts of them that are heirs of the promise in Christ. They differ:

1. In the special consideration of the author, cause and foundation of the Covenants. God gave his Law to Adam as bountiful and gracious to his creature entire and perfect, but in strict justice requiring obedience, promising a reward and denouncing punishment. But the Covenant of Grace he made as a loving Father in Jesus Christ, of his mere grace promising to receive them into favor, that sincerely and unfeignedly turn unto Him. The creation of man and integrity of human nature is the foundation of the former Covenant: but the redemption of man by Christ is the foundation of the Covenant of Grace.

2. In the form of sanction. In the Covenant of Nature there is no mediator: but the Covenant of Grace is made in Christ, in whom God has made us accepted. The Covenant of Nature was not promised before it was promulgated: but the Covenant of Grace was first promised, and long after promulgated and established or ratified in the blood of his Son.

3. In the special matter of the Covenants, and that both in respect of the promise and stipulation. For the Covenant of Nature promised life, but not righteousness: but in the Covenant of Grace God promises to tread Satan under the feet, and to write his Law in the hearts of them that are heirs of salvation. That Covenant promises life to them that perfectly obey, but not remission or forgiveness of any, even the least iniquity. But this promises forgiveness of sins and life eternal to the penitent sinner believing in Christ, and embracing the free promise of mercy. In that, life eternal is promised as the reward of justice: in this, life and glory as the reward of free and rich grace and mercy. To him that works, the wages is of debt; but to him that believes the reward is of grace. In that God as a Creator does exact his right of man pure: but in this as a loving Father He does offer Himself to the sinner smitten with the conscience of his sin. In that, life eternal and most blessed is promised, but only animal, to be enjoyed in Paradise, or continuance in that good estate wherein he was set at first of the rich bounty of God: but in the other, translation out of ignominy and death into eternal happiness and glory in Heaven. In the Covenant of Nature perfect obedience is exacted, so that if there be but the least failing in any jot or tittle, and that but once, a man can never be justified thereby, nor can the breach be made up by any repentance: but in the Covenant of Grace obedience is required, repentance admitted, and sincerity accepted. If a man sin and go astray, if he return unfeignedly, he shall be received into favor. In the Covenant of Nature obedience and works were commanded as the cause of life and justification: in the Covenant of Grace, faith is required as the instrumental cause of remission and salvation, obedience as the qualification of the party justified, and the way leading to everlasting blessedness. The object of obedience in the Covenant of Nature was God: in the Covenant of Grace, God in Christ.

4. They differ in the special consideration of the subject. The first Covenant was given to man pure, perfect, entire and sound, able to do what God required: but the Covenant following was made with man a sinner, miserable and by nature the child of wrath. And so that was a Covenant of friendship, this of firm reconciliation.

5. In the special and peculiar respect of the end. For the former Covenant was made for the praise of God’s wisdom, goodness, bounty and justice. But the Covenant of Grace was made to declare and set forth the riches of God’s grace and mercy. In it the wisdom, goodness, power and justice of God is more illustrious than in the former: and the mercy, long-suffering and rich grace of God is greatly magnified, which did not appear or shine forth at all in the former.

6. And in their effects and properties. For not the Covenant of Nature, but of Grace does exclude boasting. By the Covenant of Nature Adam was not advanced above the condition of an honorable servant. In the Covenant of Grace, man by nature the child of wrath is made the child of God by grace and adoption. The Covenant of Nature was neither the last nor everlasting, but being first made way for a better, and being broken was antiquated or disannulled to our singular comfort: but the Covenant of Grace shall continue firm and immovable forevermore.</p></blockquote>

<blockquote><p>…the problem of the promises given under the covenant of works and the meaning of the “life” promised to Adam in return for obedience – perpetual, yes, but would it be heavenly or earthly? The[re was a] fairly radical disagreement on the issue between such eminent thinkers as Thomas Goodwin, John Cameron, Moise Amyraut, John Ball, and Johannes Marckius on the side of an earthly reward, and Francis Turretin, J.H. Heidegger, the Formula Consensus Helvetica, Thomas Boston and Thomas Ridgley on the side of a heavenly reward.</p></blockquote>

— Richard Muller, ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011), p. 25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+problem+of+the+promises+given+under+the+covenant+of+works+and+the+meaning+of+the+%E2%80%9Clife%E2%80%9D+promised+to+Adam+in+return+for+obedience+%E2%80%93+perpetual%2C+yes%2C+but+would+it+be+heavenly+or+earthly%3F+The%5Bre+was+a%5D+fairly+radical+disagreement+on+the+issue+between+such+eminent+thinkers+as+Thomas+Goodwin%2C+John+Cameron%2C+Moise+Amyraut%2C+John+Ball%2C+and+Johannes+Marckius+on+the+side+of+an+earthly+reward%2C+and+Francis+Turretin%2C+J.H.+Heidegger%2C+the+Formula+Consensus+Helvetica%2C+Thomas+Boston+and+Thomas+Ridgley+on+the+side+of+a+heavenly+reward.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+ch.+1%2C+%E2%80%9CDiversity+in+the+Reformed+Tradition%3A+a+Historiographical+Introduction%E2%80%9D+in+eds.+Haykin+%26+Jones%2C+Drawn+into+Controversie%3A+Reformed+Theological+Diversity+%26+Debates+within+Seventeenth-Century+British+Puritanism+%28V%26R%2C+2011%29%2C+p.+25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F61efd706e1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/61efd706e1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=the%20problem%20of%20the%20promises%20given,the%20side%20of%20a%20heavenly%20reward&amp;text=the%20problem%20of%20the%20promises%20given%20under%20the&amp;text=Ridgley%20on%20the%20side%20of%20a%20heavenly%20reward" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … (d. 1595; Legat, 1600), bk. 1, ch. 7, pp. 25-26 trans. AI Latin</span></figcaption>

</figure><figure class="quote" id="q-86a6f25ed5" data-kw="covenant reward">
<blockquote><p>By his own right, God could indeed have prescribed obedience to man (created by him) without any promise of reward. But in order to temper that supreme dominion with his goodness, he added a covenant consisting in the promise of a reward and the stipulation of obedience. As he wished to assert more strongly his own right over man, so he demonstrated the highest benignity in this—that he (himself in need of nothing) willed to invite to a nearer communion with him the creature already subject to him by right of creation.</p></blockquote>

<blockquote><p>Pestilence is a disease spreading widely and infecting by its contagion whatever it touches. This sickness does not have a period of time during which either life or death may be expected, but a sudden faintness comes followed immediately by death. Some have stated what the cause of this pestilence is: when plague [plaga] smites the earth because of mankind’s sins, then from some cause, that is, either the force of drought or of heat or an excess of rain, the air is corrupted. And thus, with the tempered balance of the natural order disturbed, the elements are infected, and a corruption of the air and a pestilential breeze occurs, and a ruinous defect of corruption takes place in men and other living things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isidore-of-seville.html">Isidore of Seville</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Nature of Things</cite>, trans. Calvin B. Kendall and Faith Wallis, Translated Texts for Historians, Volume 66 (c. 611-12; Liverpool: Liverpool University Press, 2016), 39.1, p. 167.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc598bbe26" data-kw="">
<blockquote><p>One of the best known and most esteemed of John Owen’s works. It is unnecessary to say that he is the prince of divines. to master his works is to be a profound theologian. Owen is said to be prolix, but it would be truer to say that he is condensed. His style is heavy because he gives notes of what he might have said, and passes on without fully developing the great thoughts of his capacious mind. He requires hard study, and none of us ought to grudge it.” – Spurgeon Allen, James – Serious Advice to delivered ones from sickness or any other dangers threatening death, how they ought to carry it that their mercies may be continued, and other misery prevented, or, The healed ones prophulacticon, or healthful diet, delivered in several sermons on John 5:14 (Boston, 1679) Allen (1632-1710) appears to have been a faithful, New England minister. Here are about 15 or so other works of his. Sibbes, Richard – ‘A Rescue from Death, with a Return of Praise’ Works, 6.133-57 on Ps. 107:17 ff. Mather, Cotton – ‘Mens Sana in Corpore Sano. A Discourse upon Recovery from Sickness. Directing how Natural Health, may be Improved into Spiritual: especially by them that have Lately Recovered it’ (Boston, 1698) . 1700’s Wadsworth, Benjamin – ‘Christian Advice to the Sick and Well. In Answer to these Questions:

I. What should Christians do, when under bodily sickness?

II. How should Christians in health, improve the sickness of others; and how should they carry it towards the sick?

III. How should Christians behave themselves, when recovered from sickness? And, None but the Righteous Saved: a Sermon on 1 Cor. 6:9’ Ref (Boston, 1714) Newton, John – Letter 36, ‘To a Gay [Merry] Friend, on his Recovery from Illness’ Works (London, 1808), vol. 1 (of 6), pp. 353-7 . . On Visiting the Sick, especially Church Officers Articles 1500’s Calvin, John – ‘Visitation of the Sick’ in Calvin’s Tracts: containing Treatises on the Sacraments… vol. 2, trans. Beveridge (Edinburgh, 1849), pp. 127-8 . 1600’s Westminster Assembly pp. 84-95 of Journal of the Proceedings of the Assembly of Divines… in The Whole Works of the Rev. John Lightfoot, vol. 13 This is on whether it is a function of the pastoral office to visit the sick. Taylor, Jeremy – ch. 5, ‘Of Visitation of the Sick’ in The Rules &amp; Exercises of Holy Dying: together with prayers &amp; acts of virtue to be used by sick and dying persons, or by others standing in their attendance; to which are added rules for the visitation of the sick &amp; offices proper for that ministry new ed. (Oxford: 1857), pp. 73-229 Taylor (1613-1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He is sometimes known as the “Shakespeare of Divines” for his poetic style of expression, and he is frequently cited as one of the greatest prose writers in the English language. Swinnock, George – ‘A Good Wish about the Visitation of the Sick’ in Works, 3:24-37 (d. 1673) This is a prayer that we, pastors specifically, may be more dutiful in visiting the sick, etc. Poole, Matthew – ‘How Ministers or Christian Friends may and ought to apply themselves to Sick Persons, for their Good, and the Discharge of their Own Conscience’ in Puritan Sermons, vol. 1 on Job 23:23-24 Stearne, John – The Curate’s Manual, with Reference to the Sick &amp; Dying, from the Latin of John Stearne, Vicar of Trim in the 17th Century, with Additions, Original &amp; Selected by the Rev. Kirby Trimmer… (1697; London, 1840) ToC Stearne (1660-1745) was an Anglican bishop. His original work was Tractatus de Visitatione Infirmorum (Dublin, 1697; London, 1700, several editions). . 1800’s Ely, Ezra Stiles – Visits of Mercy, being the Journal of the Stated Preacher to the Hospital and Alms House in the City of New York, 1811, vols. 1, 2 (New York, 1813) Ely (1786-1861) was an American presbyterian minister during the Second Great Awakening. Wells, John D. – The Pastor in the Sick-Room, Three Lectures delivered at Princeton Theological Seminary, March, 1892 (Philadelphia: Pres. Board of Publication, 1893) 130 pp. Wells (1815-1903) was a graduate of Old Princeton in 1844 and learned “at the feet of Dr. Archibald Alexander, Dr. Samuel Miller, Dr. Charles Hodge and Dr. Joseph Addison Alexander, all of blessed memory.</p></blockquote>

<blockquote><p>…for they teach, that a man may publish that which by consequence destroys the faith of fundamentals, and so subvert the faith of others, which to do is a sin; but because the man follows the indictment [conviction] of his erroneous conscience, it is no sin to the man that so teaches; yea, he may innocently suffer persecution for his conscience, thus erroneous; yea, and die a martyr for it. Therefore, if the following of an erroneous conscience shall make a less sin to be no sin but innocency, it shall make a greater sin, to wit, killing of his son to his heavenly father [as an erroneous sacrifice, modeled off of Gen. 22], no sin, and so he may lawfully do it [though this is murder]. Nor will it suffice to say, to offer a man to God and kill him, is against the light of nature, and [in]vincibly a sin; what then? if the man believe he is commanded to kill him, his erroneous conscience must bind, as the offering of whole burnt offerings to God, to us is a sin, against the light of nature, in regard the law of nature can no more warrant it, than it can warrant Christ to offer up himself to God [Christ needed the positive command from his Father]. But upon the supposition of Libertines, its no murder; nor is it punishable at all, because the father may, yea, and lawfully, ought to worship God according to the indictment of his conscience, whither the conscience be right or bloody and erroneous, and yet he is not punishable for blood-shed, by their way for merely, and simply, without any malignancy or hatred to the child; he believes, he ought to prefer his Maker to his dearest child’s life as well as Abraham, and the conscience does naturally, and as under no Law, simply believe it is the like service, and worship that Abraham would have gratefully performed unto God, if God in reward of that love, had not forbidden him again to kill his Son. And this answer presupposes also, that it is impossible for a father to have such a conscience, as may stimulate, and command to kill his son, and that in the authority, and name of God, as he erroneously, yea, and as he invincibly holds, as Socinians, Familists, Papists, believe purgatory, merits, justification by works, who yet are not to be punished for their conscience, according to Libertines. Again, there is no intrinsic malignancy [in intention] in the act of naticide, or son-sacrificing, but what it has from the Lord’s Law forbidding to kill, now those that killed their sons to Molech, yea, to God, as they thought, strongly, yea, invincibly believed God commanded them, to do Him such bodily service, as is clear from Jer. 7:31; 15:5. And that this is invincible ignorance (I take the word invincible in the Libertines’ sense) Libertines grant, for in our condemning son-sacrificing, they will say we are not infallible. Yea, the understanding, being spiritual, cannot be restrained, says Dr. [Jeremy] Taylor, sect. 13, n. 6, and no man can change his opinion when he will, says he, ibid., n. 7, and so should not be punished for it, and n. 13, there is nothing under God Almighty that has power over the soul of man, so as to command a persuasion. If he be then persuaded, that he ought to kill his son, he ought unpunishably so to do.</p></blockquote>

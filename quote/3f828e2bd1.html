<blockquote><p>At the end of the 17th century, in the so-called Third Antinomian Controversy English and Dutch Reformed theologians discussed the concept of imputation in its interrelationship with forgiveness, punishment, and justice… these same themes had already been extensively discussed in the preceding century in the context of debates against Socinianism, the Antinomian Controversy is framed within an interconfessional and international context, highlighting the significance of Socinians and Hugo Grotius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-a-van-den-brink.html">G.A. van den Brink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Transfer of Sin</cite>, (1690–1700) in Its International and Interconfessional Context (Brill, 2024) 490 pp.</span></figcaption>

<blockquote><p>In his larger Concerning the Redemption of Mankind, Kimedoncius… appealed again to the sufficient-efficient distinction. ‘The blood of Christ was shed for those only that are predestinated, as touching efficacy: but for all men as touching sufficiency.’ Kimedoncius was sensitive to Huber’s charge that limited redemption was a novelty introduced by Beza at Montbeliard, and cited fathers and schoolmen to ‘prove’ the antiquity of the position. Calvin, Beza Grynaeus and other Reformed leaders were also cited as favoring the sufficient-efficient distinction. According to Kimedoncius, when the Reformed have said that Christ did not die for all, and Beza is specially singled out for this ‘defence’, they are not to be taken ‘absolutely and without restraint’ but as following ‘the old distinction’. The Reformed, Kimedoncius maintained, agree that if all would believe, all would be saved… As well as acknowledging universal sufficiency, Kimedoncius indicated other legitimate understandings of universal redemption. It is universal in the sense that the whole church is redeemed, and that all who are saved are saved only through Christ, and that Christ is a ransom for all classes.” – G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997), pp. 117-8 . 1600’s Stalham, John – Vindiciæ Redemptionis: In the Fanning &amp; Sifting of Samuel Oates’ Exposition upon Mt. 13:44. With a Faithful Search After Our Lord’s Meaning in His Two Parables, the Treasure &amp; the Pearl. Endeavored in Several Sermons upon Mt. 13.:44-45. Where in the Former Part, Universal Redemption is Discovered to be a Particular Error. (Something Here is Inserted in Answer to Paulus Testardus, Touching that Tenet) And in the Later Part, Christ the Peculiar Treasure &amp; Pearl of God’s Elect is Laid as the Sole Foundation; and the Christian’s Faith &amp; Joy in Him &amp; Self-Denial for Him, is Raised as a Sweet &amp; Sure Superstructure (1647) 182 pp. Stalham (d. 1681) was a puritan clergyman, minister and divine who was ejected in 1662. He then pastored a congregationalist church till his death. According to Calamy, he was ‘of strict congregational principles.’ He dedicated one work of his to the Westminster Assembly. He wrote numerous works against the Quakers. This work is commended by John Owen in his preface to The Death of Death. Howe, Obadiah – The Universalist Examined &amp; Convicted, Destitute of Plain Sayings of Scripture or evidence of Reason, in Answer to a treatise entitled, The University of God’s Free Grace in Christ to Mankind (London: Rothwell, 1648) 223 pp. ToC Howe (1616?–1683) was an English clergyman who sided with Parliament, but conformed in 1662. This treatise about the extent of Christ’s atonement, against Arminians, is learned. Chapter 1 gives a full survey of the many varying views on the extent of the atonement in that era, via the words of Howe’s opponent. Howe: “But the full state of the question arises out of these particulars thus: Whether Christ by his death did intend or purpose to procure remission of sins, and eternal life for every man either absolutely, or upon any condition. The affirmative is the judgment of Arminius and his followers; the negative of the contra-Remonstrants and their followers.</p></blockquote>

<blockquote><p>We believe it can be proved to be the clear and certain teaching of Scripture, that Christ, having become our surety and substitute, took our place and assumed our responsibilities as transgressors of God’s law, and in consequence, endured the penalty we had incurred, and thereby rendered satisfaction to the Divine Justice and Law for our sins,—a satisfaction which was the true and adequate ground of all subsequent procedure on God’s part towards us, in bestowing forgiveness and spiritual blessings. Christ’s death, according to this view, was not merely penal in its general character, but it was on His part the endurance of the penalty we had merited,—the same penalty we had incurred;—the same, not, of course, in its circumstances or its external aspects, but in its legal value,—its moral worth, its real significance, as a compliance with the requirements of law, which denounced punishment and demanded satisfaction. It is true, indeed, that all orthodox divines have not attached quite so much importance as Dr. Owen does, to the distinction between the idem and the tantundem,—‘the same,’ and ‘the as much,’—a distinction which he presses so strongly in the exposition of this subject. Some divines of the highest eminence and orthodoxy have admitted that the substance of what Scripture teaches on this subject might be held to be declared by asserting that Christ suffered as much as sinners had deserved,—the tantundem and not the idem,—provided due care was taken to guard against the loose and vague generality of representing Christ’s death merely as a substitute for the penalty,—a phrase which may mean almost anything or almost nothing,—and to keep up distinctly and prominently the idea of substantial identity, or sameness as really attaching to it, when viewed as a judicial infliction in accordance with the provisions of law. But though some difference of phraseology has been sanctioned by high authority on this subject, there has been a very general concurrence of opinion among orthodox divines, that it is no real declaration of the scriptural doctrine of the Atonement to say that Christ’s death was a substitute for the penalty which men had incurred, or even to say that it was an equivalent for the penalty, unless the idea of substantial identity, or sameness,—sameness in worth and value, in import and significance,—be kept up, by its being represented as a full equivalent and an adequate compensation. This, at least, seems necessary in order to embody the sum and substance of what Scripture teaches upon the subject; and nothing short of this can be fairly held to be implied in the position that Christ suffered as a substitute for us, and thereby rendered satisfaction for our sins to God’s Justice and Law. Our [Westminster] Confession of Faith says (ch. 11, section 5) that both ‘the exact justice and the rich grace of God are glorified in the justification of sinners.’ And we are persuaded that it may be regarded as a general test of the soundness of men’s views upon this whole subject, that they not only assent honestly and intelligently to this statement of our Confession…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons: from 1828-1860</cite>, (1872; rep. Still Waters Revival, 1991), Sermon 28, ‘The Atonement: Scripture Doctrine &amp; Current Theories’, on Gal. 4:4-5, pp. 408-9</span></figcaption>

s+death+merely+as+a+substitute+for+the+penalty%2C%E2%80%94a+phrase+which+may+mean+almost+anything+or+almost+nothing%2C%E2%80%94and+to+keep+up+distinctly+and+prominently+the+idea+of+substantial+identity%2C+or+sameness+as+really+attaching+to+it%2C+when+viewed+as+a+judicial+infliction+in+accordance+with+the+provisions+of+law.+But+though+some+difference+of+phraseology+has+been+sanctioned+by+high+authority+on+this+subject%2C+there+has+been+a+very+general+concurrence+of+opinion+among+orthodox+divines%2C+that+it+is+no+real+declaration+of+the+scriptural+doctrine+of+the+Atonement+to+say+that+Christ%E2%80%99s+death+was+a+substitute+for+the+penalty+which+men+had+incurred%2C+or+even+to+say+that+it+was+an+equivalent+for+the+penalty%2C+unless+the+idea+of+substantial+identity%2C+or+sameness%2C%E2%80%94sameness+in+worth+and+value%2C+in+import+and+significance%2C%E2%80%94be+kept+up%2C+by+its+being+represented+as+a+full+equivalent+and+an+adequate+compensation.+This%2C+at+least%2C+seems+necessary+in+order+to+embody+the+sum+and+substance+of+what+Scripture+teaches+upon+the+subject%3B+and+nothing+short+of+this+can+be+fairly+held+to+be+implied+in+the+position+that+Christ+suffered+as+a+substitute+for+us%2C+and+thereby+rendered+satisfaction+for+our+sins+to+God%E2%80%99s+Justice+and+Law.+Our+%5BWestminster%5D+Confession+of+Faith+says+%28ch.+11%2C+section+5%29+that+both+%E2%80%98the+exact+justice+and+the+rich+grace+of+God+are+glorified+in+the+justification+of+sinners.%E2%80%99+And+we+are+persuaded+that+it+may+be+regarded+as+a+general+test+of+the+soundness+of+men%E2%80%99s+views+upon+this+whole+subject%2C+that+they+not+only+assent+honestly+and+intelligently+to+this+statement+of+our+Confession%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Sermons%3A+from+1828-1860+%281872%3B+rep.+Still+Waters+Revival%2C+1991%29%2C+Sermon+28%2C+%E2%80%98The+Atonement%3A+Scripture+Doctrine+%26+Current+Theories%E2%80%99%2C+on+Gal.+4%3A4-5%2C+pp.+408-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F642723a004.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/642723a004.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=We%20believe%20it%20can%20be%20proved,to%20this%20statement%20of%20our%20Confession&amp;text=We%20believe%20it%20can%20be%20proved%20to%20be&amp;text=and%20intelligently%20to%20this%20statement%20of%20our%20Confession" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-2bc5f8aba5" data-kw="">
<blockquote><p>The godly inwardly will be horribly hemmed in with sorrows; and sore vexed with dreadful desertions, having their wounded hearts all bleeding, under the lashes of the Law, so that they would give their first-born for their transgression; the very grief of hell will lay hold on their souls; in a manner with their Master Christ they will description descend into hell; but after many painful wrestlings, they having received a Certificate of mercy, at last, by his Spirit, they victoriously ascend into heaven, and so triumph over all their troubles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-boyd.html">Zachary Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The sword of the Lord and of Gideon: To this is subjoined a prayer for an army going to battle, and a thanksgiving after the victory</cite>, (Glasgow: George Anderson, 1643), pp 18-19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e89aa0b540" data-kw="">
<blockquote><p>…what is meant by the Law of Nature. To wit, that Law which God writes and imprints in the nature of man, so that it is as it were connatural and born together with man (Zanchi, bk. 1, Of the Law of God, thesis 8, col. 190). Now if we consider what law was written in the nature of man in his first creation, it was no other than the Decalogue or the Moral Law (Amandus Polanus, System, bk. 6, ch. 9, col. 49; D. Pau. Explic. Catech., pt. 3, question 92, p. 503). But the Law which we are here to enquire of is that law, which after the Fall, God still writes in the heart of every man: which (we all know) comes far short and wants much of that which was written in the heart of man before his Fall… For that law which is simply called jus naturale is innatum, and lays before the minds of men that way, wherein by the guidance and conduct of nature, they may be led to that good which is in the end proportionate to nature (Francis Junius, On the Mosaic Polity).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), Part 3, ch. 9, ‘That the lawfulness of the [English-Popish] ceremonies, cannot be warranted by the Law of Nature’, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>For 1. The very ground and reason wherefore we ought to obey the magistrate, is, for that he is the minister of God, or a deputy set in God’s stead to us. Now, he is the minister of God only for our good, Rom. 13:4. Neither were he God’s minister, but his owne master, if he should rule at his pleasure and command things which serve not for the good of the subjects. Since therefore the commandments of princes bind only so far as they are the ministers of God for our good: and God’s ministers they are not, in commanding such things as are either in their nature unlawful, or in their use inconvenient: it follows that such commandments of theirs cannot bind. (Pareus, on Rom. 13:4)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (Edinburgh, 1637) | 3rd Part, pp. 134-138, 142 &amp; 155-57 of ch. 8, ‘That the Lawfulness of the Ceremonies cannot be Warranted by any Ordinance of the Civil Magistrate…’ This is the best., p. 134</span></figcaption>

<blockquote><p>‘Whether to the King.’ It may be questioned, whom the apostle means by the word King? Such as understand the epistle to be written to the Jews, may perhaps conceive that the kings that ruled by deputation in Judea should be meant, such as were Herod and Agrippa. But in as much as the Jews were scattered through the provinces, and those provincial Jews were most in quiet: and in as much as for the reasons afore given, it is likely that the epistle was written to all Christians, both Jews and Gentiles; therefore by the King he meant Caesar.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (d. 1622; 1637), on 1 Tim., 2:13</span></figcaption>

</figure><figure class="quote" id="q-fb6fa0c07c" data-kw="">
<blockquote><p>The obligation which all are under individually, to maintain the honour, and support the worship of God, attaches in an especial manner to nations and those who are in public authority over them. “Let us begin with God,” is a maxim applicable to the formation of civil society and laws, as well as to other important undertakings. Men are not to herd together like a number of cattle, making provision merely for their external protection, accommodation and order, forgetting the God that is above. A constitution which did not recognize religion, nor make any provision for its maintenance and defence, would be, in so far, an atheistical constitution. – As magistracy is an ordinance of God, and those invested with it, though chosen by men, are “the ministers of God,” such persons must be under special obligations to maintain his honour. This they are bound to do, not merely by the preservation of justice and peace, but by promoting his worship in their official station, and by resenting open indignities and contempt offered to the Majesty of heaven, by whom they rule, and decree justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

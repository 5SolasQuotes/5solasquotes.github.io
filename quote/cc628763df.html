<blockquote><p>Change, as we saw in chapter 1, is the actualization of potential.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Immutability’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-79f7667f22" data-kw="">
<blockquote><p>Is there any other way the end or goal might exist already [as it must]? There would seem to be only four possibilities: It might exist in the natural object itself; it might exist in a Platonic “third realm”; it might exist in some human intellect, or in another intellect within the natural world; or it might exist in an intellect outside the natural world altogether. But it obviously doesn’t exist in the natural object itself; if the form of an oak were already in the acorn itself, it would be an oak, and it’s not. It cannot exist in a Platonic “third realm” either, at least not if one endorses (as the Scholastic teleological realist does) the Aristotelian realist critique of Platonic realism about universals. Nor can it exist in some human or other intellect within the natural order, at least not without a vicious regress. Humans obviously are not the ones directing acorns and other natural objects (including human beings themselves) to their natural ends… The only possibility remaining, then, is the last one: Final causation in the natural world is intelligible because there is an intelligence altogether outside the natural order that directs natural objects to their ends. To the “How can something non-existent be a cause?” objection to final causation, then, the Thomist’s reply is to say “It can’t. That’s why the final cause of a natural object must exist already as an idea or form in an intellect existing altogether outside the natural order.”</p></blockquote>

</figure><figure class="quote" id="q-021583a31f" data-kw="">
<blockquote><p>Let your theologians [O Stapleton] dispute as much as they will that it is the least of all sins, and less than any venial one: what else do they reveal to all but their singular ignorance? If it is so minimal that it ought to be considered less than even any venial sin, then it cannot even be a sin, because what is less than venial is not to be placed among sins, since no sin is less than venial. Do you think Thomas felt this, when he writes that original sin is greater extensively than actual sin, but intensively less, because the actual has more of the nature of the voluntary (Thomas, in pt. 1 of 2, q. 82, art. 2)? If that reason does not deceive, they did rightly who placed it below any venial sin whatsoever, since in the slightest sin there is more of the voluntary than in the original, unless we are understood to have willed in Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin, pp. 6-7</span></figcaption>

l="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Nineteenth-century Thomists like Joseph Kleutgen (1811-83) sought to revive the Aristotelian-Thomistic tradition in the face of these modern developments, and their efforts were massively aided by Pope Leo XIII’s encyclical Aeterni Patris (1879), which called for a renewal of Thomism, and of Scholastic philosophy in general. The result was a Neo-Thomistic and Neo-Scholastic movement which marked a third phase in the history of Thomism, dominated Roman Catholic thought until the Second Vatican Council (1962-65), and has dramatically influenced the modern understanding of Aquinas’s thought down to the present day. Several schools of thought describing themselves as ‘Thomistic’ have developed over the course of the last century or so, each representing a different response to the characteristic themes and assumptions of modern philosophy. Since they have had such a profound influence on the contemporary debate over Aquinas’s thought, it will be worthwhile briefly to describe the main positions:

1. Neo-Scholastic Thomism: The dominant tendency within Thomism in the first decades after the revival sparked by Leo’s encyclical, this approach is reflected in many of the manuals and textbooks widely in use in Roman Catholic colleges and seminaries before Vatican II. Due to its emphasis on following the interpretative tradition of the great commentators on Aquinas (such as Capreolus, Cajetan, and John of St. Thomas) and associated suspicion of attempts to synthesize Thomism with non-Thomistic categories and assumptions, it has also sometimes been labeled “Strict Observance Thomism.” Still, its focus was less on exegesis of the historical Aquinas’s own texts than on carrying out the program of deploying a rigorously worked out system of Thomistic metaphysics in a wholesale critique of modern philosophy. Its core philosophical commitments are summarized in the famous “Twenty-Four Thomistic Theses” approved by Pope Pius X. Reginald Garrigou-Lagrange (1877-1964) is perhaps its greatest representative.

2. Existential Thomism: Etienne Gilson (1884-1978), the key proponent of this approach to Thomism, tended to emphasize the importance of historical exegesis but also to deemphasize Aquinas’s continuity with the Aristotelian tradition, highlighting instead the originality of Aquinas’s doctrine of being or existence. He was also critical of the Neo-Scholastics’ focus on the tradition of the commentators, and given what he regarded as their insufficient emphasis on being or existence accused them of ‘essentialism’ (to allude to the other half of Aquinas’s distinction between being and essence). Gilson’s reading of Aquinas as putting forward a distinctively ‘Christian philosophy’ tended, at least in the view of his critics, to blur Aquinas’s distinction between philosophy and theology. Jacques Maritain (1882-1973) introduced into Thomistic metaphysics the notion that philosophical reflection begins with an ‘intuition of being,’ and in ethics and social philosophy sought to harmonize Thomism with personalism and pluralistic democracy. Though “existential Thomism” was sometimes presented as a counterpoint to modern existentialism, the main reason for the label is the emphasis this approach puts on Aquinas’s doctrine of existence. Contemporary proponents include Joseph Owens and John F.

X. Knasas.

      3. Laval or River Forest Thomism: This approach emphasizes the Aristotelian foundations of Aquinas’s philosophy, and in particular the idea that the construction of a sound metaphysics must be preceded by a sound understanding of natural science, as interpreted in light of an Aristotelian philosophy of nature. Accordingly, it is keen to show that modern physical science can and should be given such an interpretation. Charles De Koninck (1906-1965), James A. Weisheipl (1923-1984), William A. Wallace, and Benedict Ashley are among its representatives. It is sometimes called “Laval Thomism” after the University of Laval in Quebec, where De Koninck was a professor. The alternative label “River Forest Thomism” derives from a suburb of Chicago, the location of the Albertus Magnus Lyceum for Natural Science, whose members are associated with this approach. It is also sometimes called ‘Aristotelian Thomism’ (to highlight its contrast with Gilson’s brand of existential Thomism) though since Neo-Scholastic Thomism also emphasizes Aquinas’s continuity with Aristotle, this label seems a bit too proprietary. (There are writers, like the contemporary Thomist Ralph McInerny, who exhibit both Neo-Scholastic and Laval/River Forest influences, and the approaches are not necessarily incompatible.)

      4. Transcendental Thomism: Unlike the first three schools mentioned, this approach, associated with Joseph Marechal (1878-1944), Karl Rahner (1904-84), and Bernard Lonergan (1904-84), does not oppose modern philosophy wholesale, but seeks to reconcile Thomism with a Cartesian subjectivist approach to knowledge in general, and Kantian epistemology in particular. It seems fair to say that most Thomists otherwise tolerant of diverse approaches to Aquinas’s thought tend to regard transcendental Thomism as having conceded too much to modern philosophy genuinely to count as a variety of Thomism, strictly speaking, and this school of thought has in any event been far more influential among theologians than among philosophers.

      5. Lublin Thomism: This approach, which derives its name from the University of Lublin in Poland where it was centered, is also sometimes called “phenomenological Thomism.” Like transcendental Thomism, it seeks to combine Thomism with certain elements of modern philosophy, though in a way that is less radically revisionist. In particular, it seeks to make use of the phenomenological method of philosophical analysis associated with Edmund Husserl and the personalism of writers like Max Scheler in articulating the Thomist conception of the human person. Its best-known proponent is Karol Wojtyla (1920-2005), who went on to become Pope John Paul II.

      6. Analytical Thomism: This newest approach to Thomism is described by John Haldane… its key proponent, as ‘a broad philosophical approach that brings into mutual relationship the styles and preoccupations of recent English-speaking philosophy and the concepts and concerns shared by Aquinas and his followers’ (from the article on ‘analytical Thomism’ in The Oxford Companion to Philosophy, edited by Ted Honderich). By ‘recent English-speaking philosophy’ Haldane means the analytical tradition founded by thinkers like Gottlob Frege, Bertrand Russell, G. E. Moore, and Ludwig Wittgenstein, which tends to dominate academic philosophy in the English-speaking world. Elizabeth Anscombe (1919-2001) and her husband Peter Geach are sometimes considered the first ‘analytical Thomists,’ though (like most writers to whom this label has been applied) they did not describe themselves in these terms, and as Haldane’s somewhat vague expression ‘mutual relationship’ indicates, there does not seem to be any set of doctrines held in common by all so-called analytical Thomists. What they do have in common seems to be that they are philosophers trained in the analytic tradition who happen to be interested in Aquinas in some way; and the character of their ‘analytical Thomism’ is determined by whether it tends to stress the ‘analytical’ side of analytical Thomism, or the ‘Thomism’ side, or, alternatively, attempts to emphasize both sides equally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009)</span></figcaption>

— Edward Feser, ‘The Thomistic tradition, Part I’, (2009)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNineteenth-century+Thomists+like+Joseph+Kleutgen+%281811-83%29+sought+to+revive+the+Aristotelian-Thomistic+tradition+in+the+face+of+these+modern+developments%2C+and+their+efforts+were+massively+aided+by+Pope+Leo+XIII%E2%80%99s+encyclical+Aeterni+Patris+%281879%29%2C+which+called+for+a+renewal+of+Thomism%2C+and+of+Scholastic+philosophy+in+general.+The+result+was+a+Neo-Thomistic+and+Neo-Scholastic+movement+which+marked+a+third+phase+in+the+history+of+Thomism%2C+dominated+Roman+Catholic+thought+until+the+Second+Vatican+Council+%281962-65%29%2C+and+has+dramatically+influenced+the+modern+understanding+of+Aquinas%E2%80%99s+thought+down+to+the+present+day.+Several+schools+of+thought+describing+themselves+as+%E2%80%98Thomistic%E2%80%99+have+developed+over+the+course+of+the+last+century+or+so%2C+each+representing+a+different+response+to+the+characteristic+themes+and+assumptions+of+modern+philosophy.+Since+they+have+had+such+a+profound+influence+on+the+contemporary+debate+over+Aquinas%E2%80%99s+thought%2C+it+will+be+worthwhile+briefly+to+describe+the+main+positions%3A+1.+Neo-Scholastic+Thomism%3A+The+dominant+tendency+within+Thomism+in+the+first+decades+after+the+revival+sparked+by+Leo%E2%80%99s+encyclical%2C+this+approach+is+reflected+in+many+of+the+manuals+and+textbooks+widely+in+use+in+Roman+Catholic+colleges+and+seminaries+before+Vatican+II.+Due+to+its+emphasis+on+following+the+interpretative+tradition+of+the+great+commentators+on+Aquinas+%28such+as+Capreolus%2C+Cajetan%2C+and+John+of+St.+Thomas%29+and+associated+suspicion+of+attempts+to+synthesize+Thomism+with+non-Thomistic+categories+and+assumptions%2C+it+has+also+sometimes+been+labeled+%E2%80%9CStrict+Observance+Thomism.%E2%80%9D+Still%2C+its+focus+was+less+on+exegesis+of+the+historical+Aquinas%E2%80%99s+own+texts+than+on+carrying+out+the+program+of+deploying+a+rigorously+worked+out+system+of+Thomistic+metaphysics+in+a+wholesale+critique+of+modern+philosophy.+Its+core+philosophical+commitments+are+summarized+in+the+famous+%E2%80%9CTwenty-Four+Thomistic+Theses%E2%80%9D+approved+by+Pope+Pius+X.+Reginald+Garrigou-Lagrange+%281877-1964%29+is+perhaps+its+greatest+representative.+2.+Existential+Thomism%3A+Etienne+Gilson+%281884-1978%29%2C+the+key+proponent+of+this+approach+to+Thomism%2C+tended+to+emphasize+the+importance+of+historical+exegesis+but+also+to+deemphasize+Aquinas%E2%80%99s+continuity+with+the+Aristotelian+tradition%2C+highlighting+instead+the+originality+of+Aquinas%E2%80%99s+doctrine+of+being+or+existence.+He+was+also+critical+of+the+Neo-Scholastics%E2%80%99+focus+on+the+tradition+of+the+commentators%2C+and+given+what+he+regarded+as+their+insufficient+emphasis+on+being+or+existence+accused+them+of+%E2%80%98essentialism%E2%80%99+%28to+allude+to+the+other+half+of+Aquinas%E2%80%99s+distinction+between+being+and+essence%29.+Gilson%E2%80%99s+reading+of+Aquinas+as+putting+forward+a+distinctively+%E2%80%98Christian+philosophy%E2%80%99+tended%2C+at+least+in+the+view+of+his+critics%2C+to+blur+Aquinas%E2%80%99s+distinction+between+philosophy+and+theology.+Jacques+Maritain+%281882-1973%29+introduced+into+Thomistic+metaphysics+the+notion+that+philosophical+reflection+begins+with+an+%E2%80%98intuition+of+being%2C%E2%80%99+and+in+ethics+and+social+philosophy+sought+to+harmonize+Thomism+with+personalism+and+pluralistic+democracy.+Though+%E2%80%9Cexistential+Thomism%E2%80%9D+was+sometimes+presented+as+a+counterpoint+to+modern+existentialism%2C+the+main+reason+for+the+label+is+the+emphasis+this+approach+puts+on+Aquinas%E2%80%99s+doctrine+of+existence.+Contemporary+proponents+include+Joseph+Owens+and+John+F.+X.+Knasas.+3.+Laval+or+River+Forest+Thomism%3A+This+approach+emphasizes+the+Aristotelian+foundations+of+Aquinas%E2%80%99s+philosophy%2C+and+in+particular+the+idea+that+the+construction+of+a+sound+metaphysics+must+be+preceded+by+a+sound+understanding+of+natural+science%2C+as+interpreted+in+light+of+an+Aristotelian+philosophy+of+nature.+Accordingly%2C+it+is+keen+to+show+that+modern+physical+science+can+and+should+be+given+such+an+interpretation.+Charles+De+Koninck+%281906-1965%29%2C+James+A.+Weisheipl+%281923-1984%29%2C+William+A.+Wallace%2C+and+Benedict+Ashley+are+among+its+representatives.+It+is+sometimes+called+%E2%80%9CLaval+Thomism%E2%80%9D+after+the+University+of+Laval+in+Quebec%2C+where+De+Koninck+was+a+professor.+The+alternative+label+%E2%80%9CRiver+Forest+Thomism%E2%80%9D+derives+from+a+suburb+of+Chicago%2C+the+location+of+the+Albertus+Magnus+Lyceum+for+Natural+Science%2C+whose+members+are+associated+with+this+approach.+It+is+also+sometimes+called+%E2%80%98Aristotelian+Thomism%E2%80%99+%28to+highlight+its+contrast+with+Gilson%E2%80%99s+brand+of+existential+Thomism%29+though+since+Neo-Scholastic+Thomism+also+emphasizes+Aquinas%E2%80%99s+continuity+with+Aristotle%2C+this+label+seems+a+bit+too+proprietary.+%28There+are+writers%2C+like+the+contemporary+Thomist+Ralph+McInerny%2C+who+exhibit+both+Neo-Scholastic+and+Laval%2FRiver+Forest+influences%2C+and+the+approaches+are+not+necessarily+incompatible.%29+4.+Transcendental+Thomism%3A+Unlike+the+first+three+schools+mentioned%2C+this+approach%2C+associated+with+Joseph+Marechal+%281878-1944%29%2C+Karl+Rahner+%281904-84%29%2C+and+Bernard+Lonergan+%281904-84%29%2C+does+not+oppose+modern+philosophy+wholesale%2C+but+seeks+to+reconcile+Thomism+with+a+Cartesian+subjectivist+approach+to+knowledge+in+general%2C+and+Kantian+epistemology+in+particular.+It+seems+fair+to+say+that+most+Thomists+otherwise+tolerant+of+diverse+approaches+to+Aquinas%E2%80%99s+thought+tend+to+regard+transcendental+Thomism+as+having+conceded+too+much+to+modern+philosophy+genuinely+to+count+as+a+variety+of+Thomism%2C+strictly+speaking%2C+and+this+school+of+thought+has+in+any+event+been+far+more+influential+among+theologians+than+among+philosophers.+5.+Lublin+Thomism%3A+This+approach%2C+which+derives+its+name+from+the+University+of+Lublin+in+Poland+where+it+was+centered%2C+is+also+sometimes+called+%E2%80%9Cphenomenological+Thomism.%E2%80%9D+Like+transcendental+Thomism%2C+it+seeks+to+combine+Thomism+with+certain+elements+of+modern+philosophy%2C+though+in+a+way+that+is+less+radically+revisionist.+In+particular%2C+it+seeks+to+make+use+of+the+phenomenological+method+of+philosophical+analysis+associated+with+Edmund+Husserl+and+the+personalism+of+writers+like+Max+Scheler+in+articulating+the+Thomist+conception+of+the+human+person.+Its+best-known+proponent+is+Karol+Wojtyla+%281920-2005%29%2C+who+went+on+to+become+Pope+John+Paul+II.+6.+Analytical+Thomism%3A+This+newest+approach+to+Thomism+is+described+by+John+Haldane%E2%80%A6+its+key+proponent%2C+as+%E2%80%98a+broad+philosophical+approach+that+brings+into+mutual+relationship+the+styles+and+preoccupations+of+recent+English-speaking+philosophy+and+the+concepts+and+concerns+shared+by+Aquinas+and+his+followers%E2%80%99+%28from+the+article+on+%E2%80%98analytical+Thomism%E2%80%99+in+The+Oxford+Companion+to+Philosophy%2C+edited+by+Ted+Honderich%29.+By+%E2%80%98recent+English-speaking+philosophy%E2%80%99+Haldane+means+the+analytical+tradition+founded+by+thinkers+like+Gottlob+Frege%2C+Bertrand+Russell%2C+G.+E.+Moore%2C+and+Ludwig+Wittgenstein%2C+which+tends+to+dominate+academic+philosophy+in+the+English-speaking+world.+Elizabeth+Anscombe+%281919-2001%29+and+her+husband+Peter+Geach+are+sometimes+considered+the+first+%E2%80%98analytical+Thomists%2C%E2%80%99+though+%28like+most+writers+to+whom+this+label+has+been+applied%29+they+did+not+describe+themselves+in+these+terms%2C+and+as+Haldane%E2%80%99s+somewhat+vague+expression+%E2%80%98mutual+relationship%E2%80%99+indicates%2C+there+does+not+seem+to+be+any+set+of+doctrines+held+in+common+by+all+so-called+analytical+Thomists.+What+they+do+have+in+common+seems+to+be+that+they+are+philosophers+trained+in+the+analytic+tradition+who+happen+to+be+interested+in+Aquinas+in+some+way%3B+and+the+character+of+their+%E2%80%98analytical+Thomism%E2%80%99+is+determined+by+whether+it+tends+to+stress+the+%E2%80%98analytical%E2%80%99+side+of+analytical+Thomism%2C+or+the+%E2%80%98Thomism%E2%80%99+side%2C+or%2C+alternatively%2C+attempts+to+emphasize+both+sides+equally.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+%E2%80%98The+Thomistic+tradition%2C+Part+I%E2%80%99%2C+%282009%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9eddc0741b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9eddc0741b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-historys-reception-of-aquinas/#:~:text=Nineteenth%2Dcentury%20Thomists%20like%20Joseph%20Kleutgen%20%281811%2D83,attempts%20to%20emphasize%20both%20sides%20equally&amp;text=Nineteenth%2Dcentury%20Thomists%20like%20Joseph%20Kleutgen%20%281811%2D83%29%20sought%20to&amp;text=or%2C%20alternatively%2C%20attempts%20to%20emphasize%20both%20sides%20equally" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Man is a personal body created in God’s image. The Bible makes quite clear that man’s hope is in resurrection of the body, not release from the body (John 2:19-22; Lk. 24:40; Rom. 8:23; 1 Cor; 15:3-4, 44, 48-49; 2 Cor. 5:1-5; Isa. 26:19; 66:22-23; Dan. 12:2). Moreover, it is embodied existence which is the criterion of future judgment (2 Cor. 5:10; Heb. 9:27). We may not know all the answers with respect to the intermediate state…</p></blockquote>

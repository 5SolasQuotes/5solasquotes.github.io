</figure><figure class="quote" id="q-00de4c06dd" data-kw="">
<blockquote><p>And what needs it also that we should speak of the power of prayer, by which we, with the publican, and all other pious persons, do humbly beg from God pardon of our sins, in order to obtain the same, having been so taught by our Savior Himself, ‘Forgive us our sins,’ or of that of other previous acts–since the matter is clearer than the noon-day sun. Nor does this interfere with our being justified gratis, as the Scripture teaches, for in these we put nothing at all of merit, any more than in faith itself… Amandus Polanus, a writer rigid in other respects, yet compelled by the force of truth, lays down this thesis, as the universal opinion of all Protestants, and very agreeable to the teaching of the Fathers. ‘By repentance, confession, prayers, and tears, proceeding from faith, we obtain forgiveness of sins, but we do not, properly speaking, merit it; and therefore we obtain forgiveness of sins, not by the merit of our penitence and prayer, but by the mercy and benignity of God.’ (Catholic Symphony, ch. 27, On the Remission of Sins, p. 951 ff., thesis 2) Which thesis, after a sufficiently sound elucidation, he confirms by some very clear testimonies of the Fathers, to which we could add numberless others, were not the thing itself most clear and certain. Would that all Protestants constantly professed this opinion, thus enunciated by Polanus: for there would remain scarce any matter for controversy regarding this article among the more right-thinking of both sides.</p></blockquote>

</figure><figure class="quote" id="q-d54f60b6ea" data-kw="">
<blockquote><p>Therefore secondly, we say that there are other graces coexistent with faith in the person justified. A solitary faith is not a saving and justifying faith: Faith, if it has not works, is dead, being alone. Faith that is alone saves not, though faith alone save. As the act of seeing is by the eye only, without the ear, or other senses; the eye only sees; the ear sees not, nor the taste, nor the smell, nor the feeling; yet the eye could not see if you should take away the other senses from the body. So it’s faith only that justifies without other graces or good works; yet faith without them, or separated from them, cannot justify: because indeed it cannot be without them in the person or subject where it is. So that faith is without other graces and works in its office, but not in its existence. And you may as soon part light and heat in the sun, as sanctification from justification in a believer. For faith is not only a fruit of the Spirit with other graces, but also the seed and nursery of other graces, because faith in Christ is the root-grace… It would be a strange soul that should give a faculty of seeing and no other faculty or sense: as strange a state of grace would that be that should give an act of saving and justifying faith and give no other grace besides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord Jesus Christ the Lord our Righteousness</cite>, … (London, 1669), pp. 155-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-0b63c82837" data-kw="">
<blockquote><p>First, the word [justificare] does imply an accounting just: And this is acknowledged by the Papists themselves as more frequent though they plead much for such a sense as to make just. Now the truth is there needs not much quarrel even about that signification, though the Scripture does not manifest it: For we confess that he is made just, who is justified, and that not only in respect of the inward renovation of a man, but also in respect of justification; for God does not account him just who is not so, and certainly to esteem a man just without righteousness, is as absurd as to account a man learned without learning, or the wall white without whiteness; only we say this righteousness that does to make a man just, is not inherent in him, but reckoned to him by the satisfaction of another: for a man is accounted righteous two ways, either when he is not guilty of the crime charged upon him, or when he does make satisfaction; and in this latter sense by Christ we become righteous. 2. So that if the word should signify as much as to make righteous, as to sanctify does signify to make holy, still we could grant it, though not in the Popish way; and indeed the apostle, Rom. 5, says many are made righteous by the second Adam, which if not meant of inherent holiness, does imply that the righteousness we have by Christ is not merely declarative, but also constitutive; and indeed one is in order before the other, for a man must be righteous before he can be pronounced or declared so to be. But the Hebrew word does not signify this sense primarily; for whereas the Hebrew word in [the tense] qal does signify to be righteous by a positive quality; The word in hiphil, according to that rule in grammar, signifies to attribute and account this righteousness unto a man by some words, or other testimony, even as the word that in qal signifies to be wicked, does in hiphil signify to condemn and judge a man as wicked, so that there are these two things in justifying, whereof one is the ground of the other, first to make righteous, and then to pronounce or declare so. From these two follows a third, which is to deal with a man so justified as a just man, so that condemnation, crimes, reproach and fear shall be taken away from him. This declares the admirable benefit of being justified before God, for when this is done, Rom. 5:1, we have peace with God, Eph. 3, we come with boldness into his presence, and open face; so that unbelief and slavish fears in the godly are great enemies to this grace of justification; yea, they are a reproach and dishonor to it. Thou thinkest if thy heart were not conscious to sin, if nothing but holiness were in thee, thou wouldest be bold, thou wouldst not fear or be troubled, but thou dost not consider that God walks towards thee as a righteous man, looks upon thee as so, so that if Christ be bold thou mayst, if God will not reject Christ, or thy sins cannot condemn Him, so neither will God reject thee, or shall thy sins overwhelm thee; this is the sweet consolation of the Gospel, to a sinner broken-hearted, who would give a world for a perfect righteousness to make him accepted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, ... (London: Miller, 1651), Lecture 1, pp. 6-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

ignifies+to+attribute+and+account+this+righteousness+unto+a+man+by+some+words%2C+or+other+testimony%2C+even+as+the+word+that+in+qal+signifies+to+be+wicked%2C+does+in+hiphil+signify+to+condemn+and+judge+a+man+as+wicked%2C+so+that+there+are+these+two+things+in+justifying%2C+whereof+one+is+the+ground+of+the+other%2C+first+to+make+righteous%2C+and+then+to+pronounce+or+declare+so.+From+these+two+follows+a+third%2C+which+is+to+deal+with+a+man+so+justified+as+a+just+man%2C+so+that+condemnation%2C+crimes%2C+reproach+and+fear+shall+be+taken+away+from+him.+This+declares+the+admirable+benefit+of+being+justified+before+God%2C+for+when+this+is+done%2C+Rom.+5%3A1%2C+we+have+peace+with+God%2C+Eph.+3%2C+we+come+with+boldness+into+his+presence%2C+and+open+face%3B+so+that+unbelief+and+slavish+fears+in+the+godly+are+great+enemies+to+this+grace+of+justification%3B+yea%2C+they+are+a+reproach+and+dishonor+to+it.+Thou+thinkest+if+thy+heart+were+not+conscious+to+sin%2C+if+nothing+but+holiness+were+in+thee%2C+thou+wouldest+be+bold%2C+thou+wouldst+not+fear+or+be+troubled%2C+but+thou+dost+not+consider+that+God+walks+towards+thee+as+a+righteous+man%2C+looks+upon+thee+as+so%2C+so+that+if+Christ+be+bold+thou+mayst%2C+if+God+will+not+reject+Christ%2C+or+thy+sins+cannot+condemn+Him%2C+so+neither+will+God+reject+thee%2C+or+shall+thy+sins+overwhelm+thee%3B+this+is+the+sweet+consolation+of+the+Gospel%2C+to+a+sinner+broken-hearted%2C+who+would+give+a+world+for+a+perfect+righteousness+to+make+him+accepted.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated...+%28London%3A+Miller%2C+1651%29%2C+Lecture+1%2C+pp.+6-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b63c82837.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b63c82837.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=First%2C%20the%20word%20%5Bjustificare%5D%20does%20imply,perfe

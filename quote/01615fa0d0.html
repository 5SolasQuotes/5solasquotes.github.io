<main class="wrap"><figure class="quote" id="q-01615fa0d0" data-kw="">
<blockquote><p>…it is a great consideration also: I know that Jesus Christ has given his people light in matters of this nature by degrees. Thousands of good souls that have been bred up and born in our assemblies, and enjoy the ordinances of God, and have done it comfortably, cannot suddenly take in other principles, you must wait upon Christ to do it. In this case, men are not to be wrought off by falsehoods [in exaggerations and extreme speaking and positions], God has no need of them. No, rather till men do take in light, you should give them all that is comfortable in the condition they are in; we should acknowledge every good thing in every man, in every church, in every thing, and that is a way to work upon men, and to prevail with them; as it is Philemon, verse 6: ‘That the communication of thy faith may become effectual by the acknowledgment of every good thing, which is in you in Christ Jesus.’ It is that which builds men up, by acknowledgment of every good thing that is in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, pp. 558-59</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-00823314c2" data-kw="">
<blockquote><p>Such as the worship is in Popery, where they teach and do many things contrary to the principles of faith, placing holiness and the worship of God in their own inventions, and seeking remission of sins, and the merit of eternal life in every beggarly superstitious observation and ceremony. But if by false manner of worship you understand every error, fault and corruption in matters of religion, which though they be evil and to be condemned, yet overthrow not the faith, nor the very essence of God’s true worship, but be in circumstances, or in parts that may be maimed, and yet the life remain: then I deny the proposition as most erroneous, false and heretical…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists</cite>, ... (London, 1590) Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher. | ‘Brownist Position’, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-72239b2dfd" data-kw="">
<blockquote><p>Superstition is an offering somewhat as pleasing to God, which is not pleasing to Him. All Christians have some degree of this in matter or manner; for we know but in part, and prophesy in part, etc. And so [it is the logical consequence of separatistic principles that] no Christians must join with others. But must they not give over all religious duty themselves, seeing their own defects more defile them than other men’s [defects]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, p. 9</span></figcaption>

</figure><figure class="quote" id="q-a79e38bdde" data-kw="">
<blockquote><p>If head-coverings were by a sovereign, positive, religious appointment, Paul might be expected to condemn their misuse as disobedience, lawlessness, a transgression, sin, iniquity or idolatry, possibly on par with… Saul’s religious treason (1 Sam. 15), Nadab and Abihu’s debacle (Lev. 10) or some of the Colossians’ and Galatians’ will-worship (Col. 2:16–23; Gal. 4:8–11). Instead his language is far different: Paul speaks of dishonor ([1 Cor. 11] v. 4), shame (vv. 6, 14), custom (v. 16), comeliness (v. 13), glory (v. 15) (also “becometh” in 1 Tim. 2:9–10), appeals for persons to judge within themselves (v. 13), and speaks of disagreements herein involving contention (v. 16). Peter associates women’s modest hair with an “ornament” and being “chaste” (1 Pet. 3:2–4). All these factors are common to nature’s light and society, arising therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Corinthians – Head Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022), pt. 1, ch. 5, ‘1 Corinthians 11’, ‘A Matter of Decorum, Not Necessarily Sin’, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“If head-coverings were by a sovereign, positive, religious appointment, Paul might be expected to condemn their misuse as disobedience, lawlessness, a transgression, sin, iniquity or idolatry, possibly on par with… Saul’s religious treason (1 Sam. 15), Nadab and Abihu’s debacle (Lev. 10) or some of the Colossians’ and Galatians’ will-worship (Col. 2:16–23; Gal. 4:8–11). Instead his language is far different: Paul speaks of dishonor ([1 Cor. 11] v. 4), shame (vv. 6, 14), custom (v. 16), comeliness (v. 13), glory (v. 15) (also “becometh” in 1 Tim. 2:9–10), appeals for persons to judge within themselves (v. 13), and speaks of disagreements herein involving contention (v. 16). Peter associates women’s modest hair with an “ornament” and being “chaste” (1 Pet. 3:2–4). All these factors are common to nature’s light and society, arising therefrom.”

</figure><figure class="quote" id="q-98709b5b6d" data-kw="">
<blockquote><p>That the Word and sacraments are not administered rightly and exactly, secundum [in Latin], as altogether agreeing with the prescript of the Lord, no not in all the world; yet albeit they be not administred according to that exact rule, and by reason of our frailty cannot be suddenly reformed, yet may they be so performed that they may be pleasing unto God and healthfull to the Church, yet so as the defect should be lamented and acknowledged; which point if it be not granted, there will be no pure or true Church in all the world; Zachary Ursinus, Catechism, pt. 2, to question 84, fol. 620. That albeit many evil things do go along and be done, yet these things are done by such as hinder reformation, and by the disobedient; not by such as wish and sue for amendment: For ‘blessed are they who hunger and thirst after righteousness,’ Mt. 5:6, (that is) which do desire good things to be done in the Church, which if they be not done it is not their fault: they may in that case retain a good conscience; Ursinus, ibid., fol. 618.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 119-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

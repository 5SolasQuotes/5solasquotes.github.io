<main class="wrap"><figure class="quote" id="q-8c39e5d64b" data-kw="">
<blockquote><p>…the acknowledging of sins does not of itself obtain grace or forgiveness of sins, even as the bare acknowledging of a disease is not the remedy for the same: for even damned men also do acknowledge their sins, and yet are not therefore healed. The acknowledging of sin is a certain preparative unto faith, as the acknowledging of a disease does minister occasion to think upon a remedy. To this at this present we add that not the very fear of God, how sincere soever it be, not the very sorrow conceived for our sins, how great soever it be, nor the very humiliation, how submiss soever it be, do of themselves make us acceptable to God: but rather that they prepare an entrance and make a way for us unto the knowledge of Christ, and so consequently do lead us to Christ Himself being incarnate and crucified for us and our redemption, and lay us upon Christ alone, by Him to be quickened and purely cleansed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades ed. Thomas Harding (1549; Cambridge: Parker Society, 1850), vol. 3, 4th Decade, 2nd Sermon, ‘Of Repentance &amp; the Causes thereof…’</cite>, pp. 62-63</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24b8ee6b33" data-kw="">
<blockquote><p>Assertion 2. The soul or its faculties are not destroyed in conversion: Peter’s will which he had when he was young, was the same when converted, but renewed, Jn. 21:18; the saints that Peter writes to are not to run to the same excess of riot as of old they wrought the will of the gentiles, 1 Pet. 4:3-4. Paul and Titus were the same men, when disobedient and serving diverse lusts, and when converted, and now washen, regenerated and justified heirs, Tit. 3:1-4. Paul: the same man, a persecuter and an apostle, but grace made a change, 1 Cor. 15:9-10, the same mind and spirit remains in nature, but they are renewed in the spirit of the mind, Rom. 12:2; Eph. 4:23. It is the same heart, but turned to the Lord, 2 Cor. 3:15-16. Christ but removes the scum and the dross, and the false metal, and frames the man a new vessel of mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself… (London, 1647)</cite>, p. 464</span></figcaption>

</figure><figure class="quote" id="q-220fd0f8ce" data-kw="">
<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>

</figure><figure class="quote" id="q-17afc6fb4a" data-kw="">
<blockquote><p>Repentance is a detestation of wicked life, and a turn to the better. Whence the parts of repentance are two: withdrawal from evil, and approach to the good, Psalm 34:14, depart from evil, and do good. It is evident that this repentance, insofar as it is saving conversion to God, that is, Sanctification begun or continued, pertains to the Gospel: (1.) Because it is an effect of evangelical doctrine. (2.) Because the baptism of repentance, which John preached, Mk. 1:4, is not a sacrament of the Law, but of the Gospel. (3.) Because the Gospel alone works that sorrow that is according to God, 2 Cor. 7:10. But the Law works wrath, Rom. 4:15. (4.) Because it immediately flows from the remission of sins, insofar as the Gospel is the preaching of the remission of sins and of repentance, Mk. 6:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-wendelin.html">Marcus Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634). ‘Gospel-Offer &amp; Covenant of Grace’ Wendelin (1584-1652)</cite></span></figcaption>

<blockquote><p>For Aquinas, a necessary condition for repentance is the recognition of a higher good the realization of which is frustrated by the action of which one repents (Of Evil, quest. 3, art. 13). He compares this to correcting an intellectual error by reasoning back to first principles (an example of which would be the law of non-contradiction). If one is correct about which principles are truly first, then rectifying the error is possible. But if one is incorrect about that, rectifying an error is far more difficult, because one will not have anything more fundamental to appeal to in order to correct one’s mistake about which principles are truly first. Similarly, if one correctly understands which ultimate end will conduce to human happiness, repentance of sin will be much easier than if one is wrong about the ultimate end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 10</cite>, p. 481</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>
<div class="actions"><button class="copy" data-copy="“For Aquinas, a necessary condition for repentance is the recognition of a higher good the realization of which is frustrated by the action of which one repents (Of Evil, quest. 3, art. 13). He compares this to correcting an intellectual error by reasoning back to first principles (an example of which would be the law of non-contradiction). If one is correct about which principles are truly first, then rectifying the error is possible. But if one is incorrect about that, rectifying an error is far more difficult, because one will not have anything more fundamental to appeal to in order to correct one’s mistake about which principles are truly first. Similarly, if one correctly understands which ultimate end will conduce to human happiness, repentance of sin will be much easier than if one is wrong about the ultimate end.”

<main class="wrap"><figure class="quote" id="q-b7e1411027" data-kw="">
<blockquote><p>All your thoughts are busied about civil liberty, but you do not consider that you are in bondage while you are free, and that to worse masters than you fear. We are under a law of sin and death, that hath the dominion and sway in all men’s affections and conversations; and when the glorious liberty of the Sons of God is offered unto us in the Gospel, when the Son hath come to make us free, we love our own chains, and will not suffer them to be loosed: therefore it is that a Nation that hath despised such a gracious offer of peace and freedom in Jesus Christ, is robbed and spoiled of peace and freedom.

When this Law of the Spirit of life in Christ is published and proclaimed openly unto congregations, unto judicatories, and unto persons, yet few do regard it; the generality are in bondage to a contrary law of sin, and this they serve in the lusts thereof. Yea, which most of all aggravates and heightens the offence, even after we have all of us professed a subjection to the Law of God, and to Jesus Christ, the King, and Law-giver, we are in an extraordinary way engaged to the Lord, by many oaths and covenants to be his people; we did consent that he should be our King, and that we should be ruled in our profession and practice by his Word and will, as the fundamental Laws of this his Kingdom; we did solemnly renounce all strange lords, that had tyrannized over us; and did swear against them, never to yield willing obedience unto them; namely, the lusts of the world, ignorance of God, unbelief, and disobedience.

Now what became of all this work, you may know, the generality of all ranks have rebelled against that Lord, and Prince, and withdrawn from his allegiance, and revolted unto the same lusts and ways, these same courses against which we had both by our profession of Christianity, and solemn oaths engaged ourselves; and so men have voluntarily and heartily subjected themselves unto the laws of sin, and desires of the flesh. Hence is the beginning of our ruin, because we would not serve our own God and Lord in our own land, therefore are so many led away captive to serve strangers in another land, therefore we are like to be captives in our own land; because we refused homage to our God, and obeyed strange lords within; therefore are we given up to the lust of strangers without.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary, or, A discovery made of those glorious privileges offered unto the penitent and faithful under the Gospel unfolding their freedom from death, condemnation, and the law, in forty sermons upon Romans, Chap. 8</cite>, (1670) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 332-33.</span></figcaption>

<blockquote><p>[James] Renwick, he was told, would have to subscribe the Confession and Catechisms of the Dutch church, as was mandatory in all ordinations; otherwise there was no prospect of the Presbytery ordaining him. Hamilton asked to see a copy of the Confession, and found his worst fears confirmed… there were vestiges of pre-Reformation practices–ceremonial, liturgy, and the role of the civil power in the church–which were reflected all too plainly in the [Belgic] Confession. Hamilton on seeing this, urgently consulted Renwick. Together they had to accept that Renwick could not subscribe the [Belgic] Confession, since to do so would be to compromise the basic principles of the Scottish Reformation and Covenants… …he [Hamilton] went round the ministers of the Presbytery and pleaded with them that, if Renwick was to subscribe anything, ti should be the Confession and Catechisms of the Church of Scotland… they eventually assented.</p></blockquote>

</figure><figure class="quote" id="q-1ae29449dc" data-kw="">
<blockquote><p>I have perused this ensuing Dialogue, and find it tending to peace and holiness; the author endeavouring to reconcile and heal those unhappy differences, which have lately broken out afresh amongst us, about the points therein handled and cleared: for which cause I allow it to be printed, and recommend it to the reader, as a discourse stored with many necessary and seasonable truths, confirmed by Scripture, and avowed by many approved writers; all composed in a familiar, plain, moderate style, without bitterness against, or uncomely reflections upon, others: which flies have lately corrupted many boxes of (otherwise precious) ointment.</p></blockquote>

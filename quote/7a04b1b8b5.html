<main class="wrap"><figure class="quote" id="q-7a04b1b8b5" data-kw="">
<blockquote><p>By the diatactic [Teaching] power a Synod may institute, restore, or change, according to the condition and exigence of the Church, the external circumstances in the worship of God, and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion, it is fit that National Synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratorke power, but being always tied to follow the rules foresaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland… (Edinburgh, 1641)</cite>, p. 150-1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

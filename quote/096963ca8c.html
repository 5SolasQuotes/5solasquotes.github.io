<blockquote><p>In this context researchers differentiate the colloquies on inaugurating reform in the early years of the Reformation (which were to prepare for the secular government’s decision to introduce new teaching and ecclesiastical practice or to legitimize such a decision) from the later religious dialogues that ideally aimed at a convergence of two religious parties. Contemporaries hardly noticed this difference… Despite all the parallels with the medieval process of disputation, sixteenth-century religious colloquies differed from the academic model at essential points… The representatives of the Reformation decisively rejected the syllogism of Scholasticism as a relevant structure for argumentation for determining theological truth and untruth. A hermeneutic based upon and drawn from Holy Scripture was to govern the establishing of the truth, not arguments based on major and minor premises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irene-dingel.html">Irene Dingel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 19, ‘Christian Ecumenical Efforts’ in eds. Appold &amp; Minnich, The Cambridge History of Reformation Era Theology (Cambridge University Press, 2023), pp. 372-84, p. 373</span></figcaption>

<blockquote><p>4. They, who truly fear the name of God [and refuse the ceremonies], are indeed scandalized by the prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified. But fiftly saith Mr. [John] Sprint, it offends the magistrate, by provoking him (persuaded and resolved as he is [as to the lawfulness of the ceremonies]) to disgrace these otherwise well deserving ministers, and to strike them with the sword of authority. Answer: Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will provoked Pharaoh the more to oppress them, or than Christ’s preaching of the truth and his abstaining from the superstitious ceremonies of the Pharisees provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed, and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 7</span></figcaption>

<blockquote><p>That right means be used with speed and diligence for the healing of our divisions and the uniting of all the true Churches of Christ (at least in these nations; and O that your endeavors might be extended much further) to which end I shall mention but these two means of most evident necessity: 1. That there be one Scripture-creed, or confession of Faith, agreed on by a general assembly of able ministers duly and freely chosen hereunto, which shall contain nothing but matter of evident necessity and verity. This will serve: 1. For a test to the Churches, to discern the sound professors from the unsound (as to their doctrine) and to know them with whom they may close as brethren, and whom they must reject. 2. For a test to the magistrate, of the orthodox to be encouraged, and of the intollerably heterodox, which it seems is intended in the 37th Article [of the 39 Articles] of the late formed government, where all that will have liberty must profess (faith in God by Jesus Christ), which in a Christian sense must comprehend every true fundamental or article of our Faith: And, no doubt, it is not the bare speaking of those words in an unchristian sense that is intended (As if a Ranter should say that himself is God, and his mate is Jesus Christ). 2. That there be a public establishment of the necessary liberty of the Churches to meet by their officers and delegates on all just occasions, in assemblies smaller or greater (even national when it is necessary), seeing without such associations and communion in assemblies, the unity and concord of the Churches is not like to be maintained. I exclude not the magistrate’s interest or oversight, to see that they do not transgress their bounds. As you love Christ and his Church and Gospel, and men’s souls, neglect not these unquestionable points of his interest, and make them your first and chiefest business, and let none be preferred before Him till you know them to be of more authority over you and better friends to you than Christ is…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Treatises tending to Awaken Secure Sinners</cite>, … (London: Rothwell, 1656), ‘To the Right, Honorable Serjeant Glyn’, n.p.</span></figcaption>

</figure><figure class="quote" id="q-f3cf654479" data-kw="">
<blockquote><p>The ignorance of fundamentals condemns, which is to be understood [in] two ways: 1. The ignorance of fundamentals such as are supernatural fundamentals, condemns all within the visible church as a sin, but it does not formally condemn those who are [outside] the visible church (John 15:22). It only makes those who are without the church incurable, but does not formally condemn them, as medicine not known, and so not refused, makes sick men incurable, as a loss, but does not kill them as a sin. 2. Superstructures, which by consequence arise from fundamentals, are fundamental by consequence, and secondarily, as the second rank of stones that are immediately laid upon the foundation, are a foundation in respect of the higher parts of the wall, and therefore are materially fundamental. And the ignorance of these virtually condemns, and the denying of such, by consequence, is a denying of the foundation.</p></blockquote>

<blockquote><p>if this Christian prince do err in some matters of doctrine, or touching the rules of discipline, yet holding and maintaining all the fundamental points of the Christian faith, so that there be abuses and corruptions in the Church, every private godly man is to keep a good conscience, not breaking the unity and peace of the faithful, but not to take public authority to reform.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3385a4cbfc" data-kw="">
<blockquote><p>The Law-Giving Of The Covenant; Its Twofold χεσις In the covenant that God made with the people of Israel from Mount Sinai, God stipulated the law from the people, first immediately in the ten words promulgated (Ex. 20:1–8), then mediately, from the darkness of the mountain and from the constructed tabernacle, through Moses as a go-between (Ex. 20:21, etc.). This law was distinct from the mere law of faith and is called law, because it had something legal mixed, which flowing from the covenant of works, led to Christ. The χεσις of that law was twofold, legal in open, first in the approach and the skin of the words, which was by itself nothing except the letter, and evangelical in secret, in a hidden and interior sense and kernel of the thing, which was also the promise and Christ, “the end of the law” (Rom. 10:4). For the Decalogue both had strictures of grace and the whole laws in the terms agreed upon were “shadows of things to come, but the body belongs to Christ” (Col. 2:17). (VI–XI).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, (1697), trans. Casey Carmichael. Locus 13.3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-205b15d455" data-kw="">

<blockquote><p>For manner of administration this covenant [of grace] is diverse, as it pleased God in sundry ways to dispense it; but for substance it is one—the last, unchangeable, and everlasting. One, for Jesus Christ is the same yesterday, and today, and forever. The last, for it succeeded the covenant of works, but none shall succeed it. (Heb. 13:8) In it God has revealed his whole pleasure concerning the salvation of man, and has manifested his principal properties, the riches of his grace, wherein he delights to be magnified. He who is not saved by the covenant of grace must and shall perish everlastingly. Unchangeable and everlasting, for therein God has revealed Himself, with respect to the things He wills concerning man’s salvation, to be one and the same forever. There is no other relation or respect that might give occasion to another covenant. It was the pleasure of God to show mercy to miserable man; but he will not extend compassion to him who obstinately and willfully contemns the riches of his grace. The covenant made with Adam in the state of innocence is altered for our great good and comfort; but this covenant is like the covenant of the day and of the night—it stands fast forever and ever. (Isa. 24:5; Ps. 111:9) Though men are unfaithful, God continues faithful; he waits for the conversion of those who go astray, and if they return, he will receive them into favor. (1 Sam. 7:3; Dt. 4:31; Jer. 3:1-2; Rom. •:6 &amp; 11:1, •9) The Lord will not utterly cast off that people whom he has once chosen and received unto mercy. And with respect to the life to come, the covenant is eternal; for after this life the people effectually in covenant shall live with the Lord forever. (Hos. 13:14; Mt. 22:32)</p></blockquote>

<blockquote><p>The perfect desire of the saints cannot be in vain; but nothing prevents their conditional desire from being in vain, and that is the kind of desire by which we do not wish to be stripped but clothed [2 Cor. 5:4] about, namely, if that ‘were possible’. And this desire is called a willingness, ‘velleity’, by some.</p></blockquote>

<blockquote><p>IV. This double covenant is proposed to us in Scripture: of nature and of grace; of works and of faith; legal and evangelical. The foundation of this distinction rests both on the different relation (σχέσει) of God contracting (who can be considered now as Creator and Lord, then as Redeemer and Father) and on the diverse condition of man (who may be viewed either as a perfect or as a fallen creature); also on the diverse mode of obtaining life and happiness (either by proper obedience or by another’s imputed); finally on the diverse duties prescribed to man (to wit, works or faith). For in the former, God as Creator demands perfect obedience from innocent man with the promise of life and eternal happiness; but in the latter, God as Father promises salvation in Christ to the fallen man under the condition of faith. The former rests upon the work of man; the latter upon the grace of God alone. The former upon a just Creator; the latter upon a merciful Redeemer. The former was made with innocent man without a mediator; the latter was made with fallen man by the intervention of a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.4 (p. 575, modified according to the 1679 edition).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

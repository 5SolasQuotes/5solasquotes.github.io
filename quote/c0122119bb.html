<main class="wrap"><figure class="quote" id="q-c0122119bb" data-kw="Indulgences Treasury of merits">
<blockquote><p>From this dogma of satisfaction that of indulgences takes its rise. For the pretence is, that what is wanting to our own ability is hereby supplied; and they go the insane length of defining them to be a dispensation of the merits of Christ, and the martyrs which the Pope makes by his bulls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.5.1</span></figcaption>

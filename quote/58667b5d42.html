<blockquote><p>Amongst the rest of our common sins we may account Covetousness, together with all the discoveries, effects and branches of it; Such as Oppression, Extortion, Bribery, Injustice, either in judgment or mutual traffic, over-reaching each other, Uncharitableness, and grinding the faces of the Poor.

I put all these together, as having some relation to each other, and being all neglects of duty betwixt man and man. If Idolatry so often brought the Plague, or other Sufferings upon the Israelites, why may not Covetousness which is Idolatry, by the same reason bring it upon us: Is it not as displeasing to God to have men adore an heap of Gold and Silver, or their Houses and Lands, as an Image of Gold made up into humane shape? And is it not as great a sin, for the heart to run a whoring after these things, as to bow the body to an Idol?

And how are men almost every where set with all their might and main to thrive, and rise in the world, to lade themselves with thick clay, and here to lay up their Treasures? Was it not time for us then to be told, and told to the quick what we were doing? That we were not yet at home, and must not therefore think of settling here? Single deaths of men when there died now one, then another, had but little effect on us, to make us sensible of our own Mortality, and therefore multitudes are swept away before our eyes, to see if that will have any more influence upon us. With what unwearied, and uninterrupted pains and diligence did the most drudge about their earthly affairs, from morning to night, weeks end to weeks end, without any serious regard to the business they came into the world for? but were so deeply fallen in love with present things, that they dream not of a Removal?

And withal were so plunged over head &amp; ears in their cares and businesses, that they could not find a time, for any serious Consideration of the matters of their souls? How just is it then that God should take them off by his hand, if they knew not how to disengage themselves? And snatch them away from those Estates which they knew no better how to improve, but were even nestling themselves in them, as their durable possessions. And I hope all who are engaged in such affairs, will call themselves to a strict account whether there have been no such unjust sentences pronounced either in condemning the innocent, or acquitting the guilty, that may have provoked the just God to anger against us. And let all merciless rich men, cruel Extortioners, oppressive Landlords lay to heart their mercifulness, rigour or injustice to the Poor, to the Fatherless and Widow, whose cries may have reached the ears of the Lord of Sabboth, Jam. 5. 4. and caused him to rise and plead their cause, by sending his Judgments upon an hard-hearted Generation.

And doubtless that great want of Charity, and Christian compassion which ought to be in us, towards our Brethren in their necessities and miseries, may very justly have hardened God himself against us, and caused him to be deaf, to our Cries and Prayers. How many have had their money and precious things which they had hoarded, left to strangers, or rifled by thievish hands, which they might in their life-time so well employed for Gods honour, and their own good? But alas, amongst the many that profess the Faith, how few are there who will take a Promise from God as good security? And amongst so many that say they love God, how few have manifested it by their love to their Brother?

And hath the matter been mended, since we have been under this sore Visitation? Nay, rather hath it been worse? Oh how men shut up their bowels against their poor, necessitous, Visited Brethren? And suffered (’tis sadly to be feared) thousands to starve for want of needful supplies, whilst they have had enough for their Lusts, and to spare; and need not (which yet in such a day especially is our duty) have pinched their own back or belly to have afforded them relief.

And this cruelty have men been guilty of whilst many of them had reason every day to expect their own Death; but they have seemed resolved to hold, and grasp all as long as possibly they can, and to cleave closer, if they knew how, to their dear Mammon, of which shortly they must take their sad, and last farewell, Oh! who but Infidels would not have sent their Treasures before them thither, where they expect shortly to be themselves Translated. But the Sin I chiefly intended under this head, is the common dishonesty in Buying and Selling, men’s Defrauding and Overreaching each other. A practise which I fear, London hath been more guilty of than Corinth which yet was charged with it, 1 Cor. 6. 8.

And it concerns Citizens and Tradesmen especially, to enquire into themselves upon this account, as being most exposed to temptations to it. Thou who yet survivest, examine thy heart, look back on thy former course of Life, in thy following the world. Does not thy conscience accuse thee for having grown rich by Lying, Cheating, and Deceitful ways? Hath not thy Conscience many times flows in thy face, for thy notorious Falsehoods, and crafty projects, and unlawful devices, to put off thy wares, and enrich thy self? Alas men are ready to plead a kind of necessity for their sin; and say, If they should always be upright, and plain, and true, they should never know how to live. Is not the world then come to a brave pass?

What a matter of course is it with Tradesmen to tell multitudes of Lies to every Customer almost, and never make matter of them, so they but help off their Commodities? They can go their ways, and wipe their mouths, and there’s an end; But hold, God will not put it up so. So they can but now get a Pound or a Shilling, how little do they regard the time of reckoning for all again? They know not how to keep up such serious thoughts in the midst of their noise and bustle, in buying and selling. But if they can’t, God will take them off their hot trading, and give them leisure enough to consider what they have been doing. And hath he not done thus? ‘Tis well for those who so improve their breathing space here, that they have not this work to do in the other world. All that men could think of, was, that money was to be got, which way it mattered not so much.

And well had it been for them, if God had made no more matter of it: But believe it he hath taken a strict notice of all thy ways, and recordeth them with greater exactness, than thou wast wont to do thy debts in thy Shop-book. See thy sin described and threatened. Micah 6. 10, 11, 12, 13. After he had spoke of the Lord’s voice crying to the City by his Rod, ver. 9. then follows, Are there yet the treasures of wickedness in the house of the wicked, and the scant measure which is abominable? Shall I count them pure with the wicked balances, and with the bag of deceitful weights? For the rich men thereof are full of violence, and the Inhabitants have spoken lies, and their tongue is deceitful in their mouths; Therefore also will I make thee sick in smiting thee, in making thee desolate because of thy sin.

Oh how many are there that will be Religious, as far as coming to Church, and being devout there, and making some outside Profession, who yet in their dealings are stark naught, and will be dishonest for a small gain? In the Church, and perhaps a little in their Closets, they can afford to do, that they call serving of God, but in their Shops nothing at all. Oh by that time all’s reckoned for, when the money’s gone, but the sin in getting it must be answered for, how will men wish, and wish again they had been clear from this guilt, though they had been the meanest beggars in the Land? now how just is it man should be snatched from those estates, to which they never had a true title? And if indeed they cannot drive a trade without so great miscarriages, Is it not time that their Houses and Shops should be shut up?</p></blockquote>

le+in+their+Closets%2C+they+can+afford+to+do%2C+that+they+call+serving+of+God%2C+but+in+their+Shops+nothing+at+all.+Oh+by+that+time+all%E2%80%99s+reckoned+for%2C+when+the+money%E2%80%99s+gone%2C+but+the+sin+in+getting+it+must+be+answered+for%2C+how+will+men+wish%2C+and+wish+again+they+had+been+clear+from+this+guilt%2C+though+they+had+been+the+meanest+beggars+in+the+Land%3F+now+how+just+is+it+man+should+be+snatched+from+those+estates%2C+to+which+they+never+had+a+true+title%3F+And+if+indeed+they+cannot+drive+a+trade+without+so+great+miscarriages%2C+Is+it+not+time+that+their+Houses+and+Shops+should+be+shut+up%3F%E2%80%9D%0A%0A%E2%80%94+Matthew+Mead%2C+Solomon%E2%80%99s+prescription+for+the+removal+of+the+pestilence%2C+or%2C+The+discovery+of+the+plague+of+our+hearts%2C+in+order+to+the+healing+of+that+in+our+flesh%2C+%28London%2C+1665%29%2C+pp+28-30.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F58667b5d42.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/58667b5d42.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/12/matthew-mead-on-gods-judgment-against-covetousness-and-unmercifulness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Friday, Oct. 12. — Kept a family fast this day, that we might afflict ourselves before our God; to seek of Him a right way for us and for our little ones, and for all our substance: I trust it was such a fast as the Lord would choose: His divine presence was amongst us, and we had good reason to hope and believe, that the Lord was entreated of us, Oh that we may find more and more reason to say so, when we come on shore. I dread going into the world. But wherefore do I fear? Lord, I believe, O help my unbelief, that Thou wilt keep me unspotted from it.</p></blockquote>

</figure><figure class="quote" id="q-4309390be5" data-kw="">
<blockquote><p>The word “remember,” in the fourth commandment, implied that there was a previous and existing knowledge of the Sabbath as a day of sacred rest. It cannot be contended that because it is not mentioned from the time of its institution up till the period of the giving of the commandments, that it did not exist; for carrying out of the argument we would be obliged to admit that, because there is no mention of sacrifices having been offered for a period of 1,500 years, no sacrifices were offered – that because there is not mention made of circumcision, from the settlement of Israel in Canaan till the circumcision of our Redeemer, the rite of circumcision was abolished; and, as well might it be said that adultery, theft, and blasphemy were not sins before the giving of the law at Mount Sinai, because they are not previously mentioned as such, as to say that there was no Sabbath, and that its violators would not be punished. Considering the limited account given of the history of the world, both before and after the flood, there are in the Sacred Volume quite as many traces of the Sabbath as, under the circumstances, might be expected.

Mr Nelson then mentioned the peculiar circumstance of Noah sending the dove out of the ark at periods of seven days, the stated periods at which the patriarchs engaged in religious worship – the injunctions as to the gathering of manna upon the seventh day of the week, and several other incidents which took place before the delivery of the law at Mount Sinai, as traces of the existence of a Sabbath of sacred rest. […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-nelson.html">Isaac Nelson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 17 Mar. 1848</span></figcaption>

<main class="wrap"><figure class="quote" id="q-258f167564" data-kw="">
<blockquote><p>…the question is, Why the bread is called Christ’s body and the cup Christ’s blood: that is, why the things signified are attributed to the signs, and the signs called by their name. There are two causes alleged hereof:

1. For the natural analogy or likeness, which Christs body and the bread have between themselves.

2. For the certainty or confirmation of the joint-exhibition of the sign, and the thing signified in the true use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … (London, 1645), 2nd Part, ‘Of the Lord’s Supper’, Question 79, ‘Why then does Christ call bread his body…’, p. 456</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-f3d2fda4ac" data-kw="">
<blockquote><p>23rd Question. After the ministry of the Word and the seals thereof, how is the collection for the saints to be administered? Answer. The collection for the saints was by the apostles’ ordinance, to be made: for the time, every Lord’s Day; for the measure, as God has prospered every man; for the manner, not of constraint, but freely and willingly, brought by the givers as an offering to the Lord, and laid down, as at first before the apostles, so afterwards by their appointment before the deacons of the Church as into a common treasury, by them to be distributed to the supply of the ministry, and of the poor saints, according to their need, and of outward service of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Church</cite>, … (London, 1644), p. 8</span></figcaption>

</figure><figure class="quote" id="q-120724e25c" data-kw="">
<blockquote><p>Question 6. Whether absolute and unlimited power of royalty be a ray and beam of divine majesty immediately derived from God? Answer. Not at all. Such a creature is not in the world of God’s creation. Royalists and flatterers of kings are parents to this prodigious birth. There is no shadow of power to do ill in God. An absolute power is essentially a power to do without or above law, and a power to do ill, to destroy; and so it cannot come from God as a moral power by institution, though it come from God by a flux of permissive providence; but so things unlawful and sinful come from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644), p. 228</span></figcaption>

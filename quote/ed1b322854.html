<main class="wrap"><figure class="quote" id="q-ed1b322854" data-kw="">
<blockquote><p>What an effect would be produced on an unbelieving world if a better spirit were more prevalent; if Churches, though distinguished by trivial peculiarities, regarded each other with brotherly affection; if one form of polity, admitting of fraternal correspondence, were embraced by all true Christians; and if the soldiers of the cross presented the appearance of one great army, all trained in the discipline of integrity and truth, all animated by the same spirit, and all displaying a united front to the common foe!

Now the Church is split up into countless sections; her divisions are fitted to make a most unfavourable impression on all who are without; her visible appearance, instead of being an inviting, and instructive, and edifying spectacle, is rather fitted to discourage, to puzzle, and to repel. She is now as a house divided against itself; her most valiant men of war, instead of bearing down with all their might on the enemy, often turn their arms against each other; and thus her energies are frequently expended in the strife of internal discord. No wonder, under these circumstances, that Christianity, in relation to the world lying in wickedness, has been so little aggressive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-d-killen.html">W. D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Framework of the Church. A Treatise on Church Government</cite>, (Edinburgh: T &amp; T Clark, 1890), pp 28-29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

v>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-097263c6db" data-kw="">
<blockquote><p>Schismatical is such as was the schisms of the Donatists [in the Early Church], which separated themselves from the true Church of God under the pretense of a more absolute life and a more perfect holiness… But none of these [kinds of schisms] can be justly imputed unto us declining from the Romish Church, for that departing is without all blame, which is not from a true Church, but from a false Church: not from the people of God, but from the persecuters of the people of God, not from the articles of the Faith and sound doctrine of the church, but from errors which darken the articles of the Faith and from the wicked traditions of men, which specially is not done by any lightness but by necessity, not for the desire of innovation but for true religion’s sake, and to recover the true Faith according to the testimony of the eternal verity, that leaving the fellowship of darkness, we may be gathered again in true light, placed with Christ and all his members. So we at this day have forsaken that Romish Sea full of false doctrine and idolatry, and flowing with the innocent blood of martyrs, and have embraced the evangelic and apostolic doctrine, and so Christ Himself being head of the Church, which is the commmunion of all saints believing in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-alley.html">William Alley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Poor Man’s Library Rapsodiæ G.A. Bishop of Exeter upon the First Epistle of Saint Peter</cite>, ... (1560; London: Day, 1565), Lecture 7, Now to the Romish Church, Response, 3. Schismatical, p. 246 Alley was the Anglican bishop of Exeter during the reign of Queen Elizabeth I.</span></figcaption>

<blockquote><p>…a man may be a schismatic, forsaking communion with a true Church, and yet not be an heretic, in as much as he may rightly believe all the articles of the Faith. … Other divisions there are which are with separation, when men shall withdraw themselves from fellowship and communion with a true Church, so breaking themselves off from the body. And this (says our judicious [William] Ames)¹ by way of special appropriation, deserves most rightly to be called by the name of ‘schism’: in as much as heresy in this division is perfected and brought to a head, as also most clearly manifested, and declared, viz. in refusing of due Church-communion. ¹ Quia autem haec scissio maxime perficitur et apparet in debita communione Ecclesiastica recusanda, idcirco illa separatio per appropriationem singularium recte vocatur Schisma [But because this division is chiefly brought about and becomes evident in the refusing of due ecclesiastical communion, therefore that separation, by the appropriating of things to oneself, is rightly called ‘schism’]. Ames, Cases of Conscience on Schism Which refusal may be either partial, or total. Partial, in some particular acts and exercises, wherein a man cannot (or at least conceives he cannot) communicate without sin. Total, a rejecting, and renouncing of all religious communion. This latter all divines look upon as a schism, and that most properly so called. Which (again) may be either from the Church, or from a Church. From the Church catholic, the whole Church. That was properly Donatism (the direct error of the Seekers at this day): Or from a particular Church; and that is properly Separatism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of the Present Schism of New Separation in old England</cite>, (London: Field, 1646), pp. 14-15</span></figcaption>

<blockquote><p>It is true indeed, the apostle in his epistle to the Galatians, is very severe against some false teachers; which yet does not weaken, but really confirm the necessity of this forbearance and toleration. For those teachers were themselves against tolerating others, and would have the ceremonies of the Law imposed upon all Christians, as things necessary to salvation; by which means the Christian faith would have been greatly corrupted. And at the same time that he so sharply inveighs against these teachers, he is very large in recommending charity and forbearance, even in so freat a diversity of opinions as this was; and commands that “they who were overtaken in a fault, should be restored in the spirit of meekness;” (Gal. 5:13-15) and that “they should bear one another’s burdens.” (Gal. 6:1-2) And at last, when he had told them that the essence of Christianity did not consist in circumcision, or uncircumcision, i.e. in observing or omitting the ceremonies of the Law, but “in the new creature,” i.e. in true and real holiness; he adds these words, wherein he most affectionately desires, as well as commands, a mutual forbearance among persons who differ in things not fundamental; “and as many as walk according to this rule,” i.e. that agree in the essentials of Christianity, and form their lives according to this rule, “Peace be upon them, and mercy, and upon the Israel of God.” (Gal. 6:15-16)… And if we turn out thoughts to the following circumstances, we shall plainly perceive of how great weight these things are to recommend the like forbearance among Christians in these days:

1. The apostles were infallible, and if they would not attempt to compose these differences by exerting their authority, but chose to recommend forbearance on both sides, how much more should we take the like course, who have not the least pretences to infallibility?

2. The dispute was not about a trifle, but a very weighty affair, even the difference between the Law and the Gospel; a thing that did not consist in mere speculation, but had a great influence both upon practice and worship. Alas! How many trivial controversies in comparison of this do sour the minds of Christians in these days?

3. Both sides were furnished with very considerable arguments, the one a Law given by God, the other the defense of Christian liberty.

4. St. Paul himself, who so strenuously urged this forbearance, had before such a flaming zeal for the Law, that he was even mad for it.

5. Lastly, these precepts of forbearance were given after the vision from Heaven to Peter, and after the apostolic synod; so that these controversies had been sufficiently determined already, by this vision, and by the decree of the apostles. Whoever therefore shall seriously consider these circumstances, and weigh them impartially, can’t surely but conclude that these apostolical precepts of forbearance, if they had any weight in their times, ought to have much more in our times, and in the present controversies.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is true indeed, the apostle in his epistle to the Galatians, is very severe against some false teachers; which yet does not weaken, but really confirm the necessity of this forbearance and toleration. For those teachers were themselves against tolerating others, and would have the ceremonies of the Law imposed upon all Christians, as things necessary to salvation; by which means the Christian faith would have been greatly corrupted. And at the same time that he so sharply inveighs against these teachers, he is very large in recommending charity and forbearance, even in so freat a diversity of opinions as this was; and commands that “they who were overtaken in a fault, should be restored in the spirit of meekness;” (Gal. 5:13-15) and that “they should bear one another’s burdens.” (Gal. 6:1-2) And at last, when he had told them that the essence of Christianity did not consist in circumcision, or uncircumcision, i.e. in observing or omitting the ceremonies of the Law, but “in the new creature,” i.e. in true and real holiness; he adds these words, wherein he most affectionately desires, as well as commands, a mutual forbearance among persons who differ in things not fundamental; “and as many as walk according to this rule,” i.e. that agree in the essentials of Christianity, and form their lives according to this rule, “Peace be upon them, and mercy, and upon the Israel of God.” (Gal. 6:15-16)… And if we turn out thoughts to the following circumstances, we shall plainly perceive of how great weight these things are to recommend the like forbearance among Christians in these days:

1. The apostles were infallible, and if they would not attempt to compose these differences by exerting their authority, but chose to recommend forbearance on both sides, how much more should we take the like course, who have not the least pretences to infallibility?

2. The dispute was not about a trifle, but a very weighty affair, even the difference between the Law and the Gospel; a thing that did not consist in mere speculation, but had a great influence both upon practice and worship. Alas! How many trivial controversies in comparison of this do sour the minds of Christians in these days?

3. Both sides were furnished with very considerable arguments, the one a Law given by God, the other the defense of Christian liberty.

4. St. Paul himself, who so strenuously urged this forbearance, had before such a flaming zeal for the Law, that he was even mad for it.

5. Lastly, these precepts of forbearance were given after the vision from Heaven to Peter, and after the apostolic synod; so that these controversies had been sufficiently determined already, by this vision, and by the decree of the apostles. Whoever therefore shall seriously consider these circumstances, and weigh them impartially, can’t surely but conclude that these apostolical precepts of forbearance, if they had any weight in their times, ought to have much more in our times, and in the present controversies.”

<main class="wrap"><figure class="quote" id="q-c1cc431ab4" data-kw="">
<blockquote><p>As we nor no man of common sense can justify your unrivaled and hateful schism,” a little after says, “A detestable neutrality and indifferency, now-a-days ignorantly called ‘moderation,’ grafted on carnal prudence, and supported by sinful politics, on the one hand, and a scandalous schism on the other, are equally abjured by our covenants, and are two extremes we should equally guard and pray against.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>Andrew Willet, who is thought to have been the author of this critique of Richard Hooker, believed that Hooker’s purported defence of the Church of England, while well-intentioned, had served to undermine the English Church’s doctrine:

WHEN men dream they are asleep, and while men sleep the enemy soweth tares, and tares take root and hinder the good corn of the Church, before it be espied. Therefore Wise men through silence permit nothing loosely to pass away as in a dream. Your offer then, Maist. Hoo[ker]. is godly and laudable, to inform men of the estate of the church of God established among us. For the Teachers of righteous things, are highly to be commended. And he that leadeth men rightly to judge of the church of God, is to be beloved of all men.

Howbeit sometimes goodly promises are mere formal, and great offers serve only to hoodwink such as mean well. And as by a fair shew of wishing well, our first parents were foully deceived: so is there a cunning framed method, by excellence of words, &amp; enticing speeches of man’s wisdom, to beguile and bewitch the very Church of GOD. And such as are used for this purpose come in sheep’s clothing. For he translateth him self into an Angel of light, who blindeth all men with utter darkness.

When we therefore, your loving countrymen (unfeignedly favouring the present state, and embracing from our hearts the Gospel of Christ, as it is preached and professed in England, being ready every hour to give up our lives for God’s glory: and the honour of our Queen [Elizabeth I]) having so goodly a champion to offer combat in our defence, were made very secure, and by the sweet sound of your melodious style, almost cast into a dreaming sleep:

We happily remembering your Preface that there might be some other cause, opened at the length our heavy eyes, and casting some more earnest and intensive sight into your manner of fight, it seemed unto us that covertly and underhand you did bend all your skill and force against the present state of our English church: and by colour of defending the discipline and government thereof, to make questionable and bring in contempt the doctrine and faith it self.

For we saw the theme and the cause you have in hand, to be notable simples, whereof a skilful popish Apoticarie can readily make some fine potion or sweet smelling ointment, to bring heedless men into the pleasant dream of well-weening: while they closely set on fire the house of God. And may we not truly say, that under the shew of inveighing against Puritans, the chiefest points of popish blasphemy, are many times and in many places, by divers men not obscurely broached; both in Sermons and in Writing: to the great grief of many faithful subjects, who pray for the blessed and peaceable continuance of her most gracious Majesty, and of the estate of the Church of JESUS Christ; as it is now established among us.

And verily such a thing offered it self unto our eyes, in reading your books, and we had not skill how to judge otherwise; of the handling of your penne and of the scope of your matter. Notwithstanding because rash judgement may prejudice honest travails, and faithful labourers may have their unadvised slips, and we could not tell how zeal, love, or glory might carry a man of such towardly and excellent gifts, in the first shewing of him self to the world; or that an earnest striving &amp; bending your self in heat of disputation against the one side, might dazzle your eyes, and draw your hand at unawares too far and too favourable to the other side; or else peradventure we might mistake your meaning, and so we should do you wrong against our wills.

We thought it therefore our part, in regard of our duty to the Church; and most agreeing to charity, both for your credit and our ease; in all Christian love to intreat you, that as you tender the good estate of Christ’s church among us, and of thousands converted to the gospel, you would in like public manner (but plainly and directly) shew unto us and all English Protestants, your own true meaning, and how your words in divers things do agree with the doctrine established among us.

And that not only for avoiding of offence given to many godly and religious Christians: but also that the Atheists, Papists, and other hereticques, be not encouraged by your so hard and so harsh stile (beating as it were, as we verily think, against the very heart of all true Christian doctrine, professed by her Majesty and the whole state of this Realm) to despise and set light, by her sacred Majesty, the reverend Fathers of our Church and the whole cause of our religion.

We have made choice therefore of a few principal things, which trouble many godly minded Christians, who advisedly read over your books, that by the sincere answering and upright clearing of them, you might satisfy us all, both in them and in all the rest, and free your self from all suspicion of falsehood or treachery, and make us able to give a reason of defence unto all such as stumble at your writings. And for your better ease herein, and our more ready satisfaction, we have compared your positions and assertions in your long discourses, unto the articles of religion set forth An̄. Dn̄i 1562. and confirmed by Parliament the 13. of her Majesty’s most blessed &amp; joyful reign, and unto the Apologies of such Reverend Fathers and chief pillars of our church, as from time to time since the Gospel began to shine among us, have written and preached, and every way laboured to advance and defend the same, with the Liturgy &amp; church government established among us.

If you therefore good Ma. Hoo[ker]. will make it to appear to the world, that in these points you are all one in judgement with the church of England, and that your such speeches wherewith your godly brethren are grieved, may bear such sense and meaning: or else (as every humble Christian will do) freely and ingenuously acknowledge your unwilling oversight, or at the least (which we undoubtedly believe you will never bee able) shew plainly and by good demonstration, that all our Reverend Fathers have hitherto been deceived; then shall we hold our selves very well contented and satisfied. Hoping therefore of your charitable, direct, plain, sincere, and speedy answer, we tender here our doubts unto your Christian consideration, and crave your brotherly resolution in manner and form following.</p></blockquote>

<blockquote><p>Objection 3: If kings be governors in all causes over all persons, then may they dissolve churches and their government, and mold and order them as they will. Answer: So far as Church constitution, government and ordering is by Christ’s appointment, or such example which has the force of an institution of Christ, it may not be altered by a king; But in such things as are left to human prudence, and there is a concernment of the weal-public, kings have authority to order them so, as that they tend to the real good and advantage of the churches of Christ and the glory of God, which is the highest and ultimate end of all. Objection 4: This will make the use of synods and assemblies of pastors to determine things of religion and to order government unnecessary, since the determination of all will lie in the king’s breast. Answer: Though statute-laws require the king’s assent, and the government is to be exercised in his name, by his commission, yet are not debates in parliament and passing bills by both Houses, nor consultations with judges, nor their decisions of cases unnecessary [but assumed in the oath]: The like is to be said of the use of synods and assemblies of Pastors and learned men, though the calling of them, and validity of their canons, that is rules, in respect of the imposing them on others with civil penalties, require the king’s concurrence. Objection 5. This has occasioned great evils in so much that persecution has been raised against godly persons as heretiques and schismatics, when princes have been misled so as to burn, banish, imprison and otherwise to afflict persons judged by prelates and others to be such. Answer: ‘Tis true this has fallen out when princes ignorant of the true religion, corrupted in their education, perverted by seducers and ungodly guides in their judgments have yielded too much to the misinformation of others, and so have been unhappy in the abuse of their government to the great hurt in life, liberty and estate of innocent persons: And the like has been in mal-administration of civil affairs through the like causes: yet the power and authority in neither is to be denied for some abuse: for that would introduce a worse evil of anarchy and mischievous confusions. On the other side when princes have been good, and have used such good counselors, as Jehoiada was to Joash, their government in religion has been of great advantage to the Church of Christ. And as things have stood in England, it was the means under God whereby Popery was expelled and the protestant Reformation was established. … Objection 8: The acknowledgement of this supremacy of the king has been opposed by sundry godly protestants who have in their writings excepted against it, as Calvin and the Century writers of Magdeburg. Answer: Tis true they excepted against the title of Head of the Church given to King Henry VIII, as Stephen Gardiner [a Papist] and such like persons misreported it, as if it gave to the king an uncontrollable authentic power, to determine of faith and worship of God: but when those learned protestants better understood what was meant by it, they withdrew their exceptions, as doctor Rainold shows in his Conference with Hart in the Tower [1584], ch. 10 [pp. 673-74]. Objection 9: Many godly persons are offended with the taking and defending the lawfulness of the taking of this oath as fearing it many tend to the taking away those liberties of their consciences in religion, which are dearer to them then their lives: and being jealous of those who take it, lest they betray those liberties. Answer: It is to be considered by those conscientious persons who make this objection that the takers, and defenders of the taking of this oath do apprehend that the imposing this oath was for the excluding the Pope’s jurisdiction and other foreign power, as the admonition of Queen Elizabeth here prefixed shows… But they that have taken it, or conceive they may take it if imposed, do it, as being satisfied in their consciences by the foregoing arguments or such like that they do but what they may do lawfully without offence, and hope that it will fall out as it did in the business of the altar of Ed, Josh. 22, that a right intelligence of their fact will prevent any breach between them and others and unite them more closely.</p></blockquote>

<blockquote><p>The principle of Church Establishments, properly understood, and apart from adventitious circumstances, is just the principle of national religion. It has many ramifications all springing from an acknowledgment of the universal supremacy of Christ, and bearing upon the duty of nations and their rulers to promote the advancement of true religion, and the prosperity of Christ’s cause and kingdom.

It is connected with the protection of the Sabbath, the promotion of scriptural education in the public schools, the conservation of the purity of the Scriptures, and the sacredness of the law of marriage. It assumes that nations are moral and responsible creatures, accountable to God in their corporate capacity, and the proper subjects of rewards and punishments.

It implies that wherever God’s Word exists, its existence and influence ought to be nationally acknowledged as the only supreme authority and the foundation of law. “There is no power but of God; the powers that be are ordained of God.” The civil magistrate is “a minister of God,” and therefore bound to honour and serve Him, whilst “he that ruleth over men must be just, ruling in the fear of God.</p></blockquote>

.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/12/13/james-begg-on-the-importance-of-the-establishment-principle/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-87f1be735e" data-kw="">
<blockquote><p>This is clear in all the governments and commonwealths that the Lord did immediately model Himself, magistrates had this for a special part of their task, to keep His ordinances pure, and to restrain the corrupters of them: This is expressed in the Moral Law, where Masters are no less to oversee their servants, that they work not on the Sabbath, from respect to the Lord, than to direct their work all the week from respect to themselves [Ex. 20:8-11]; and by the rules of interpreting of these commands, what belongs to a master to be done by him as a master, in reference to these over whom he has power according to his station, that does belong to all magistrates in reference to these under their charge, according to their stations. Also, where one instance is named, all of that kind are comprehended. And therefore as this ordinance of sanctifying the Sabbath is to be overseen by superiors, so also are all others: yea, it is acknowledged also, that what is expressed in one command, in respect of the extent thereof, is to be understood in all. And therefore this obligation lies on superiors, to make inferiors observant of God’s ordinances in reference to all the commands; this is not doubted of the duties in the Second Table: yet there is no expression in it inferring the same so express as is in the First; and this is a common assertion, magistrates have both Tables of the Law committed to their keeping. This is fully made out by many godly and learned men, and we need not to insist upon it…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This is clear in all the governments and commonwealths that the Lord did immediately model Himself, magistrates had this for a special part of their task, to keep His ordinances pure, and to restrain the corrupters of them: This is expressed in the Moral Law, where Masters are no less to oversee their servants, that they work not on the Sabbath, from respect to the Lord, than to direct their work all the week from respect to themselves [Ex. 20:8-11]; and by the rules of interpreting of these commands, what belongs to a master to be done by him as a master, in reference to these over whom he has power according to his station, that does belong to all magistrates in reference to these under their charge, according to their stations. Also, where one instance is named, all of that kind are comprehended. And therefore as this ordinance of sanctifying the Sabbath is to be overseen by superiors, so also are all others: yea, it is acknowledged also, that what is expressed in one command, in respect of the extent thereof, is to be understood in all. And therefore this obligation lies on superiors, to make inferiors observant of God’s ordinances in reference to all the commands; this is not doubted of the duties in the Second Table: yet there is no expression in it inferring the same so express as is in the First; and this is a common assertion, magistrates have both Tables of the Law committed to their keeping. This is fully made out by many godly and learned men, and we need not to insist upon it…”

— James Durham, A Treatise Concerning Scandal, On how Circa Sacra flows out of the 4th Commandment: | The Dying Man’s Testament to the Church of Scotland, or, A Treatise Concerning Scandal… (1659), pt. 3, ch. 13, pp. 241-2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+is+clear+in+all+the+governments+and+commonwealths+that+the+Lord+did+immediately+model+Himself%2C+magistrates+had+this+for+a+special+part+of+their+task%2C+to+keep+His+ordinances+pure%2C+and+to+restrain+the+corrupters+of+them%3A+This+is+expressed+in+the+Moral+Law%2C+where+Masters+are+no+less+to+oversee+their+servants%2C+that+they+work+not+on+the+Sabbath%2C+from+respect+to+the+Lord%2C+than+to+direct+their+work+all+the+week+from+respect+to+themselves+%5BEx.+20%3A8-11%5D%3B+and+by+the+rules+of+interpreting+of+these+commands%2C+what+belongs+to+a+master+to+be+done+by+him+as+a+master%2C+in+reference+to+these+over+whom+he+has+power+according+to+his+station%2C+that+does+belong+to+all+magistrates+in+reference+to+these+under+their+charge%2C+according+to+their+stations.+Also%2C+where+one+instance+is+named%2C+all+of+that+kind+are+comprehended.+And+therefore+as+this+ordinance+of+sanctifying+the+Sabbath+is+to+be+overseen+by+superiors%2C+so+also+are+all+others%3A+yea%2C+it+is+acknowledged+also%2C+that+what+is+expressed+in+one+command%2C+in+respect+of+the+extent+thereof%2C+is+to+be+understood+in+all.+And+therefore+this+obligation+lies+on+superiors%2C+to+make+inferiors+observant+of+God%E2%80%99s+ordinances+in+reference+to+all+the+commands%3B+this+is+not+doubted+of+the+duties+in+the+Second+Table%3A+yet+there+is+no+expression+in+it+inferring+the+same+so+express+as+is+in+the+First%3B+and+this+is+a+common+assertion%2C+magistrates+have+both+Tables+of+the+Law+committed+to+their+keeping.+This+is+fully+made+out+by+many+godly+and+learned+men%2C+and+we+need+not+to+insist+upon+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+A+Treatise+Concerning+Scandal%2C+On+how+Circa+Sacra+flows+out+of+the+

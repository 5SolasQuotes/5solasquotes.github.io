<main class="wrap"><figure class="quote" id="q-26f0cde098" data-kw="">
<blockquote><p>Among the Scottish Commissioners at the Westminster Assembly, Samuel Rutherford was the foremost representative of this type of piety, and in the Assembly debate on fixed congregations, he supported the Independents to some degree. He said that being in the vicinity was not an adequate basis for determining church membership, but that the consent of the people was also necessary. While he rejected the necessity of a church covenant on the local level, he did advocate a “voluntary agreement” on the part of church members in order to form a congregation.1 It may be that his views had something to do with the mildness with which the Assembly treated the gathering of churches. 1. MS, II, fol. 30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-spear.html">Wayne Spear</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanted Uniformity in Religion: The Influence of the Scottish Commissioners Upon the Ecclesiology of the Westminster Assembly</cite>, p. 217.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-585edc577b" data-kw="">
<blockquote><p>As for schismatics who only for schism are out of the Church, and do hold no erroneous point of doctrine, and are not yet convinced [convicted by a church court], they are yet members of the visible Church, as Morton says from Gerson (Morton, Apologia de no•is R•cl., ch. 2, •at. 1, p. 7), as also Glorianus (lib. de schismat., p. 181); but he who is casten out as a schismatic, is in the same case with an excommunicate[d] person.</p></blockquote>

</figure><figure class="quote" id="q-7304caa200" data-kw="">
<blockquote><p>7. When any member of any of the churches of their own way go from one church to another only as travelers or sojourners for the time, they are admitted to sacraments, only bringing with them letters of recommendation from their own church. Ans. to 32. q., p. 29. But when any such member comes from one of their churches to another to be admitted as a fixed member there, then he is not admitted (notwithstanding any letters of recommendation or any other testimonial or evidence whatsoever) without such a new examination as aforesaid, and as if he had never been examined nor admitted into church-society before. Ans. to 32. q. pp. 29-30; Ans. to 9. Pos., p. 62; Apology, p. 2, 7, 9, 35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers</cite>, … (London, 1644) Rathband was a Westminster divine., Ch. 3; p. 10</span></figcaption>

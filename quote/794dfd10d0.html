<main class="wrap"><figure class="quote" id="q-794dfd10d0" data-kw="">
<blockquote><p>‘That knocketh.’ moving my heart by secret inspirations, to give full admittance and entrance to his grace and virtues, Rev. 3:20. ‘Open to me.’ receive Me in thine heart, by a lively act of faith, for it is mine only place of refuge and abode upon earth, out of which I find nothing but annoyance and displeasure in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-diodati.html">Jean Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pious Annotations, upon the Holy Bible (London: T.B., 1643), on Song 5, verse 2</cite>, p. 201</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘That knocketh.’ moving my heart by secret inspirations, to give full admittance and entrance to his grace and virtues, Rev. 3:20. ‘Open to me.’ receive Me in thine heart, by a lively act of faith, for it is mine only place of refuge and abode upon earth, out of which I find nothing but annoyance and displeasure in the world.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c2d83d2e37" data-kw="">
<blockquote><p>Oh believe it, God has not one drop of mercy for the finally obstinate and rebellious sinner. In this world, God’s mercy (as it were) goes a begging to them, ‘tis brought to their very doors and offered to them; Christ stands at the door and knocks for entrance. They actually enjoy many outward mercies, and spiritual eternal mercies are offered to them and urged on them; but when God’s patience is ended, let them cry and pray as long as they will, not the least drop of mercy shall be obtained for them. And as they shall not have the least drop of mercy, so they shall have wrath and misery without mixture; pain without mitigation or intermission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-wadsworth.html">Benjamin Wadsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twelve Single Sermons on Various Subjects (Boston: B. Green, 1717), Sermon 9, ‘God’s Bow Bent &amp; Sword Drawn against the Wicked’, pp. 183–85 Wadsworth (1670–1737) was an American Congregational minister and president of Harvard.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-161db8e3b5" data-kw="">
<blockquote><p>I beseech you, once know and consider your estate, that you may open your hearts to this Redeemer, that you may be willing to be stripped naked of all your imaginary righteousness, to put on this, which will satisfy the Law fully. Will you die in your sins, because you will not come to Him to have life? Will you rather be condemned with sin, than saved with Christ’s righteousness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary… (d. 1653; Edinburgh: Swintown, 1670) | sermon 14, on Rom. 8:4</cite>, p. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-0221660955" data-kw="">
<blockquote><p>3… Oh, how little will they have to say for themselves upon whom grace waited so many years, knocking hard at the door of their hearts for acceptance, and they refused to open to it [Rev. 3:20], or bid it come in. How justly will they suffer long in the other world, to whom God was so long-suffering to no purpose in this world, Rom. 4:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling, in The Works (d. 1673; Banner of Truth), 2.478-79</cite></span></figcaption>

— George Swinnock, The Christian Man’s Calling, in The Works (d. 1673; Banner of Truth), 2.478-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3%E2%80%A6+Oh%2C+how+little+will+they+have+to+say+for+themselves+upon+whom+grace+waited+so+many+years%2C+knocking+hard+at+the+door+of+their+hearts+for+acceptance%2C+and+they+refused+to+open+to+it+%5BRev.+3%3A20%5D%2C+or+bid+it+come+in.+How+justly+will+they+suffer+long+in+the+other+world%2C+to+whom+God+was+so+long-suffering+to+no+purpose+in+this+world%2C+Rom.+4%3A2.%E2%80%9D%0A%0A%E2%80%94+George+Swinnock%2C+The+Christian+Man%E2%80%99s+Calling%2C+in+The+Works+%28d.+1673%3B+Banner+of+Truth%29%2C+2.478-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0221660955.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0221660955.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=3%E2%80%A6%20Oh%2C%20how%20little%20will%20they,purpose%20in%20this%20world%2C%20Rom.%204%3A2." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7287d3d095" data-kw="">
<blockquote><p>…Under which two excuses [in the text] are comprehended all others of like sort, which flesh and blood does minister, for hindering to rise and open to Christ, and obey his calling, such as we see, Mt. 22, and are usually suggested by our corruption, as the quitting of our pleasure, or profit, our ease, credit, or companions, if we do so; and that we shall fall in disgust, hatred, and obloquy, and other like inconveniences: Neither is it a fit time as yet (but as Felix said to Paul, Acts 24:25) we may take a more convenient season for that, or the like purposes, etc. Such excuses do absenters of themselves from public exercises of divine worship, make, and profaners of the Lord’s Sabbath; such also do covetous extortioners, revengeful oppressors: unclean whoremongers, riotous, drunkards and the like, frame to themselves, and obtrude, and all for this end, to keep Christ out, though He frequently call and knock at their door to enter in. Observations: 1. We see hereby, that it is not an easy matter, but a very hard and difficult one to bring the soul and Christ together, into a near and constant fellowship… but take heed to his voice who calls and knocks, and, as the Father spake at Christ’s baptism from heaven, hear Him and obey. 2. We see, how strong is carnal corruption, and remnants of sin in the regenerate, to hold Christ at the door, and to sleight his voice, calling on the•… to open; and therefore, how much more stronger is the same in the unregenerate, and it is no marvel that they open not unto Him and disobey his voice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guild.html">William Guild</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Love’s intercourse between the Lamb &amp; his Bride, Christ and his Church, or a clear explication and application of the Song of Solomon (London: Wilson, 1657), on Song 5:3</cite>, p. 210</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

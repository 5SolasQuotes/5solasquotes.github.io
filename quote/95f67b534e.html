<main class="wrap"><figure class="quote" id="q-95f67b534e" data-kw="">
<blockquote><p>Our justice or righteousness, that is, the justice or righteousness of the Gospel, whereby we are just in the sight of God, is not our conformity with the Law: but it is Christ’s satisfaction performed unto the Law for us, or the punishment, which He sustained for us, and so his whole humiliation (that is, his taking of flesh, his undertaking of servitude, penury, ignominy, and infirmity: his suffering of that bitter passion and death: all which He did undergo for us, but willingly) and that humiliation and satisfaction freely of God imputed unto us his faithful and believers. 1 Cor. 2:2, ‘I esteemed not to know anything among you, save Jesus Christ and Him crucified.’ Col. 2:10, ‘Ye are complete in Him.’ Rom. 5:19, ‘By the obedience of one shall many be made righteous.’ Isa. 53:5-6, ‘With his stripes we are healed. The Lord hath laid upon him the iniquity of us all.’ Now that Christ might perform obedience and satisfy for us, it behoved Him to be our Mediator, being by Himself just and holy, Heb. 7:26, ‘For such an High-Priest it became us to have, holy, harmeless, undefiled, separate from sinners, and made higher than the heavens.’ All these things are true perfectly and wholly in Christ. For He has perfectly fulfilled the Law for us: 1. by the holiness of his human nature. 2.by his obedience: for He became obedient unto the death, even the death of the cross: And the former fulfilling of the law, namely, the holiness of Christ’s human nature, was requisite for the other, even for his obedience. This obedience and satisfaction of Christ is our satisfaction, and our proper iustice, for which we please God, for which we are received into favor with God the Father, and which is imputed unto us. That former fulfilling of the Law is indeed imputed also unto us, namely the humiliation and justice or righteousness of Christ’s human nature, that we may be reputed holy before God: but this holiness of Christ is imputed unto us for his obedience or satisfaction sake: because He satisfied for us God’s justice, in sustaining eternal punishment and pains, which we should have sustained everlastingly. Hence is it, that the effusion of Christ’s blood (as being the complement and consummation of Christ’s satisfaction) is only said to be our justice and righteousness. 1 Jn. 1:7, ‘The blood of Jesus Christ cleanseth us from all sin,’ that is, not only from that which is past, but also from that which is to come. … 5. How Christ’s satisfaction is made our justice and righteousness: This question is adjoined because it seems absurd that we should be justified by that which is another man’s, and not ours. The satisfaction or justice of Christ is made ours, or applied unto us, two ways, that is, by a double application. The former application is God’s, who in respect of that fulfilling of the Law performed by Christ, accepts us, and applies the same unto us; that is, He imputes it, no less than if we had never sinned, or at least had paid and suffered sufficient punishment for our sins. For albeit to justify signifies to make just, yet in the Church it signifies another thing, and is taken in another sense. Or God does apply it, when He imputes the fulfilling of the Law performed by Christ unto us, even as if it were performed by us, neither will at all punish us. But to impute, is, to accept Christ’s satisfaction, performed to this end, that it might be our justice and righteousness. We then also apply unto us the fulfilling of the Law performed by Christ, when we are steadfastly persuaded, that God does impute, apply and give it unto us, and for it reputes us for just, absolving us from all guilt… That which we have now spoken of both applications, both God’s, and ours, does manifestly show what is meant in this place by justifying: Which is, that, to justify, is not to make one just who is uniust: but to repute him for just and righteous who is uniust, and to absolve the unjust and unrighteous from all guilt, and not to punish him, and this for another’s justice and righteousness imputed by faith unto us.</p></blockquote>

<blockquote><p>2. That which is exhibited whither by doing or suffering, or both in way of satisfaction and so accepted, being such as makes a plenary compensation for an offence formerly committed; because it utterly extinguishes and abolishes the wrong, so takes it away, as if it never had been; it justly procures a guiltlessness, a blamelessness unto the delinqent, in whose behalf it is performed; and makes him therefore to be reputed in the eye of law and justice, as now no delinqent, but as guiltless, faultless and just: there being no medium between these two just and unjust, nor between guiltless and just. See Dt. 25:1. This guiltlessness therefore is justly termed justice; and the party conseqently by plea thereof upon any emergent occasion may be truly justified, and such guiltlessness achieved by Christ’s satisfaction made to God’s Law and his justice, makes the party unto whom the same is imputed, and who has interest therein, truly named and justly deemed just, and to be in the state of justification, or in a justifiable condition, 2 Cor. 5:21; and this is that, not the satisfaction itself, but the guiltlessness thereby procured, that is so oft in his argument termed ‘justice’ or ‘righteousness’, called the ‘Justice of God’, Rom. 1:17, and 3:21-22, and 2 Cor. 5:21, not, as some, for that the satisfaction was made by Christ, who is God, but because contrived, prepared, propounded and appointed us by God, for God as the party wronged, and Christ as the party satisfying, for the wrong, are in this argument distinguished, Rom. 3:24-25 and 2 Cor. 5:19, 21.</p></blockquote>

<blockquote><p>Here the preceding cause [in Rom. 3:24] is Christ constituted a propitiation in his blood. In this impulsive cause, two things are noted: First, Christ’s justice or obedience is the meritorious cause of our salvation; Second, this justice and obedience consists in full satisfaction for our sins and complete fulfillment of the Law for us. Concerning the first, that Christ’s justice is the meritorious cause of our salvation: since it seems to conflict that we are saved by free grace and by merit, that is, a price paid, it must be thus understood. Christ’s merit opposes not God’s judgment simply or in itself, for Christ, as man and Son of God by the union of divine and human natures, has this of grace, not having earned it. As Augustine testifies, in Him the predestination of grace most clearly shines, so His merit opposes not God’s grace but is subordinate to it, depending thereon. But both God’s grace and Christ’s merit oppose our works, each in its order. Thus, grace, from which merit flows, and merit, whereby we are saved, stand together. This is proved by texts conjoining God’s love, Christ’s propitiation, reconciliation, redemption, and ransom, and by the same and like texts proving that Christ by His obedience truly merited salvation for us. For if He fully satisfied for our sins, paid the penalties due, appeased God’s wrath, and acquired eternal life, He rightly merited salvation for us. Merit here we call the most sufficient price to satisfy God’s judgment for sins and penalties and to acquire eternal life. In sum, respecting God, all is free; respecting God’s appeased wrath through the Son, there is merit, yet freely given to you. Concerning the second, that Christ’s justice consists in full satisfaction for our sins and complete fulfillment of the Law: Christ’s most full and perfect obedience or justice, whereby we are justified when imputed, includes both complete satisfaction for all sins and fulfillment of all the Law requires of us. For He was made under the Law for us, which demands two things: that we commit nothing against it, and omit nothing of it. Otherwise, it thunders woe against both him that does not what he ought and him that does what he ought not. But Christ is the fulfilling of the Law unto salvation for all that believe (Rom. 10). The righteousness of the Law is fulfilled in us, not by us, but in our Head, Christ, for us. Thus, chiefly, Christ by His obedience satisfied for our sins, bearing most sufficient penalties, whence Scripture greatly commends the benefit of Christ’s death, for by it we are redeemed from death. But He also perfectly fulfilled the Law for us, not only by suffering but by doing—yea, in suffering He acts, for He offers Himself as priest and is offered as victim (Rom. 4). Not only are sins not imputed, being remitted, but Christ’s justice is imputed, He who was made justice for us (1 Cor. 1:30). Yet to understand this rightly, note that Christ’s justice is threefold: First, essential, common to the three Persons, which is God Himself, for whatsoever is in God is God; Second, habitual justice, adorning His human nature from conception with purity far beyond angelic, yet created; Third, actual justice, whereby throughout His life, especially in suffering that death, He rendered obedience to the Father. This third alone enters the account of the merit of our justification, whereby we are not only redeemed from death but obtain eternal life through this perfect obedience perfectly rendered to the Law by Christ for us. … The matter of justification, as the term is variously taken, is considered by theologians not in one way, but it reduces to this: the matter is either the subject in which and from which this benefit arises, namely, Christ’s imputed justice, as taught above, which imputation includes both absolution from injustice through remission of sins (by which term Scripture often synecdochically comprehends the whole benefit of salvation) and the adjudication of Christ’s justice (Dan. 9, Rom. 4, 8, mentioning not only remission but the gift of justice); or the subject receiving this benefit, which is all and only the elect (Rom. 8, proved first a priori, because they are elect, then a posteriori, because they are justified). The form of justification is this application of Christ’s justice through faith, or that free imputation whereof we spoke (Rom. 4, Phil. 3, 2 Cor. 5), where the phrase ‘in Him’ notes two things: first, our justice is not inherent in us but Christ’s, existing outside us, yet ours by right of donation; second, we have Christ’s justice as Christ has our sin—not subjectively but relatively, by imputation, as shall be said in explicating the effects.</p></blockquote>

<blockquote><p>Christ was subject to the law in two different senses. The first was the active sense, in that he perfectly fulfilled everything that was prescribed in the ceremonial or moral law. He was circumcised on the eighth day according to the law, being presented in the temple in order to fulfill the law of purification, to which, however, he was not himself subject. Likewise, he kept the feasts and rituals commanded in the law and fulfilled the moral law to such a degree that … he did not commit any sin, nor was any falsehood found in his mouth. He performed this perfect obedience to the law so that he could pass it on to us. The result is that his fulfilling of the law is imputed to us, who have not kept it perfectly, as if we had done so. He was also subject to the law in a passive sense, when he took on himself the punishment and offence of the law in order to deflect the wrath of the eternal Father from us.</p></blockquote>

<blockquote><p>Justification goes beyond forgiveness. Not only are we forgiven because of Christ, but God also declares us righteous because of Christ. God requires two things of us: punishment for our sins and perfection in our lives. Our sins must be punished, and our lives must be righteous. But we cannot bear our own punishment (Ps. 49:7-8), and we cannot provide our own righteousness. “None is righteous; no, not one” (Rom. 3:10). Therefore, God, out of His immeasurable love for us, provided His own Son to do both. Christ bears our punishment, and Christ performs our righteousness. And when we receive Christ (John 1:12), all of His punishment and all of His righteousness is counted as ours (Rom. 4:4-6; 5:1, 19; 8:1; 10:4; 2 Cor. 5:21; Phil. 3:8-9).</p></blockquote>

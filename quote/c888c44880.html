<main class="wrap"><figure class="quote" id="q-c888c44880" data-kw="">
<blockquote><p>The author with the Scriptures makes a pastor, a bishop, a preaching elder, to be altogether one and in nothing to differ, but as three synonymous names of one and the same officer, which by divine right is indeed superior to a ruling elder, or presbyter; this no man ever did question, but no way superior to a preaching elder [as presbyterians hold], of whom alone is all the present question [with episcopacy].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness &amp; Danger of Limited Episcopacy</cite>, (1641), p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-947e6d6c05" data-kw="">
<blockquote><p>Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, 1.39.28–29</span></figcaption>

— William Ames, The Marrow of Theology, 1.39.28–29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COrdinary%20Ministers%20follow%20the%20form%20of%20the%20Church%20that%20is%20instituted%3B%20they%20are%20not%20Ecumenical%2C%20National%2C%20Provincial%2C%20or%20Diocesan%20Bishops%2C%20but%20Elders%20of%20one%20Congregation%2C%20who%20in%20the%20same%20sense%20are%20also%20called%20Bishops%20in%20the%20Scriptures.%2029.%20Those%20transcendent%20members%20of%20the%20Hierarchy%20were%20merely%20human%20creations%2C%20brought%20into%20the%20Church%20without%20any%20Divine%20precept%20or%20example.%E2%80%9D%0A%0A%E2%80%94%20William%20Ames%2C%20The%20Marrow%20of%20Theology%2C%201.39.28%E2%80%9329&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F947e6d6c05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/947e6d6c05.html">Permalink</a><a class="src" href="https://archive.org/details/marrowsacdi00ames" rel="noopener" target="_blank">Read it online · Internet Archive (1639 ed.)</a></div>
</figure><figure class="quote" id="q-31516a1658" data-kw="">
<blockquote><p>Why does Mr. [Thomas] Hooker [a congregationalist] give this new [type of] Church [a congregationalist church,] a Latin name, ‘The Fraternity’, that is, a Church of redeemed ones built on the Rock, made up of brethren and no sisters? Ah! are women, servants, aged children, nor redeemed, not built on the Rock? So is there a Gospel-instituted Church described. The word [in Greek], as Stephanus tells us, is only twice in the New Testament: 1 Pet. 2:17, ‘Love the brotherhood’, that is, the company of the brethren, say Mr. Leigh, Beza, Calvin, English Annotators. ‘The company of the brethren’, Lorinus; ‘The Church’, Esthius; the brethren by regeneration, and new birth. So Piscator, the brethren that are regenerated; as ‘the nobility’ is put for the nobles. Let any man judge, if name or thing [as signifying only males] be so much as hinted at, when Paul and the rest of the apostles exhort the brethren, Jam. 5:12, ‘My brethren, swear not’, does he not forbid women to swear?… Yea, and when Paul determined to come to the brethren at Rome, Rom. 1:13-14, to whom he was debtor to preach the Gospel, came he only as such a debtor to brethren of a single congregation [as in congregationalism]? or only such brethren of a single congregation justified by faith? are they only no debtors to the flesh? Rom. 8:12 &amp; 7:1 &amp; 10:1 &amp; 7:4, ‘Wherefore my brethren, ye are become dead to the law by the body of Christ’: are not women dead to the law through Christ? See Rom. 8:12; 1 Cor. 1:10,26, and in many places of the Old and New Testament, if the Scripture mean only unofficed men by ‘the Fraternity’ and ‘Brethren’. Cyprian hath the word ‘Fraternity’, the whole Fraternity: but all that read him know, he means most ordinarily the whole Church and flock of men and women. And when it is taken for only men, it is brethren in office, Acts 10:23 &amp; 15:23, never for brethren of this new devised Church. Augustine useth it sometime for brethren in the Ministry, and so doth Basil and the Fathers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), pp. 285-86</span></figcaption>

</figure><figure class="quote" id="q-160069d067" data-kw="">
<blockquote><p>Paul gives rules and directions to Timothy (1 Tim. 5:1,19 and Titus 2) as to pastors, not as to believers, concerning the manner of receiving [Church] complaints, nor is there in Scripture precept, promise or practice of believers to receive complaints, we are surer than our Brethren [the congregationalists]; and it’s safer to expound this [phrase], ‘Tell the Church’ [Mt. 18:17], that is, ‘Tell Timothy and the Elders’ than, ‘Tell the church, that is, tell any member of the church at Corinth,’ i.e. tell any woman or servant [your formal complaint], for they are as essentially members as Timothy or any of the Elders, [Point] 2. and [these laypersons] must join their consent to censures because members must hear the scandals because they must tacitly consent before censures be dispensed; it follows not [however] that members must be told [of such formal complaints as an authoritative court, in the sense of Mt. 18:17], for [only] the tacit consent of women [to such Church censures of others] is requisite, for they may be scandalized or edified by the good or evil dispensing of censures as well as men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 259</span></figcaption>

<blockquote><p>The question that remains to be answered is: are these widows placed on a list in order to receive aid or in order to serve the church? All the evidence indicates that what Paul clearly had in mind was an order of widows set apart in order to serve the church. There are a number of reasons why this interpretation is superior.</p></blockquote>

<blockquote><p>Your Argument is, A most successful and allowable Method of preventing Death, and many other grievous Miseries, by the Small Pox, is not only lawful but a Duty, to be used by those who apprehend their Lives endangered by the terrible Distemper. But, The managing and governing the Small Pox, in the way of Inoculation, is a most successful and allowable Method of preventing Death, and many other grievous Miseries by this dreadful Distemper. Therefore, it is not only lawful, but also a Duty to make use of it.

Sir, You tell me, None but very foolish and very wicked People will deny the Proposition. How can you tell that? Are you only capable to tell a Man what he must not do, and if he doth that which you think not good, must you enter into Judgment, and pronounce him very foolish and very wicked.

Sir, Whatever you think of your Proposition, I think it a poor and a beggarly thing, to take that for granted which is denied, to put into your Proposition.

I shall first tell you, that the Word Allowable is ambiguous, and shall distinguish and enquire what you mean by it: If you mean human Authority, I shall take no Notice of it. To the law and to the Testimony, and if they speak not according unto that, it is because there is no Light in them. But if you mean an allowable Way by the Law of Physick, then I deny your Proposition. And now let us see who is the Fool. Your Proposition is, That it is a most successful and allowable Method of preventing Death. Now we fear there are many in the Grave the More for it; therefore we cannot believe that it is a successful Way of preventing Death.

And now I deny the Consequence of your Minor Proposition, and say, that cannot be accounted a safe way, which hath an evil Tendency, and a bad end, (eventually Death) of more than it hath saved alive; not to be allowed, except God says Amen to it. You go on to say, The Testimonies that our People have been frighted with, are not worth a Straw; no Man of Sense that confiners them, can lay weight upon them. Answer: If you are a man of sense, if you consider my Arguments, they will bring you upon the Careen [?].

Again you bid us ask you not why you say so: But I hope you will not take it amiss, if I ask you, why you bid us not ask you, &amp; if you will not answer me, suffer me to draw natural Conclusions; as first, because you could not. 2. because you affect a Despotic Power, and would have us pin our Faith upon your sleeve. But hold, Sir, you are not so high now, but that there is more ways than one to come at you; and our Faith cannot be swallowed up in your belief, unless you tell us a reason why you say so. In the next place you say, Experience will tell us that there was never a more unfailable method amongst the Children of Men. Hold Sir, suppose I tell you of two as successful, to wit, to cure Agues. The first is to wear a Spell about the Neck, next to the Skin; I can tell you too how to make it, and what Words are used in it.

2dly, The writing the Person’s Name that hath the Ague, by the hand of a Seventh Son, and he slitting the Rine of an Elder-Tree, and opening it, and putting the Piece of Paper in, will cure the Ague: And they tell you of much Virtue in the Seventh Son, and also of the Elder Tree; and they, do not say ask them not, but tell us the Reason why they say so, to wit, because Judas hanged himself on it. I could tell you of many more such Things, with respect to the Event, which are good to a Person or People; but that does not prove it to be lawful, which you should have done, if you understand your Argument.

I will load Success a little further, it may be you may think too far. It was good that Satan should be dispossessed of his Habitation which he had taken up in Men in our Lord’s Day; but it was not lawful that the Children of the Pharisees should cast them out by the help of Beelzebub: We must always have an Eye to the Matter of what we do as well as to the Result, if we intend to keep a good Conscience towards God.

From the Means and End of effecting the Action, it is well or ill disposed. ‘Tis a Duty to go to hear God’s Word preached, but ’tis unlawful to steal a Horse to ride to hear it. ‘Tis lawful to preserve Life, but it must be in a lawful way. All Circumstances must concur to make the Action good: The failing but in one Circumstance doth make the Action evil. See Hag. 2. 11, 12, 13, 14.</p></blockquote>

<blockquote><p>Do not imagine that no one can please God while he is engaged in military service. Among such was holy David to whom the Lord gave such high testimony. Among such were many just men of that time. Among such, also, was that centurion who said to the Lord: ‘I am not worthy that thou shouldst enter under my roof, but only say the word and my servant shall be healed. For I also am a man, subject to authority, having under me soldiers, and I say to this one: Go, and he goeth, and to another: Come, and he cometh; and to my servant: Do this, and he doth it’; of him the Lord said: ‘Amen I say to you I have not found so great faith in Israel.’ Among such, also, was that Cornelius to whom the angel was sent, who said: ‘Cornelius, thy prayer is heard and thy alms are accepted,’ when he advised him to send to the blessed Apostle Peter, to hear from him what he ought to do. And to summon the Apostle to him he sent a religious soldier.

Among such, also, were those who came for baptism to John, the holy precursor of the Lord and friend of the bridegroom, of whom the Lord said: ‘There hath not arisen among them that are born of women a greater one than John the Baptist.’ When they asked him what they ought to do, he answered them: ‘Do violence to no man, neither calumniate any man, and be content with your pay.’ Obviously, he did not forbid them to serve in the army when he commanded them to be satisfied with their pay.</p></blockquote>

<blockquote><p>That as the Jews were wont to shut up the solemnity of the Passover by singing some of David’s Psalms; so our Saviour, after the celebration of the Sacrament of his body and blood, went out with his disciples to the mount of Olives, […] having sung the Hymn, which Hymn (say the best expositors) was the same that the Jews did ordinarily sing after the Passover, and is called by them the great Hallel, which, as Paulus Brugensis says, consisted of six Psalms, from Ps. 113 to Ps. 118, and he adds (verisimile est hos à Domino decantatos) it is most like that these were sung by our Saviour. And Drusius says, hunc hymnum hodieque canunt in nocte Paschatis; The Jews sing this Hymn in the evening of the Passover to this day. The learned Scaliger having largely described the forms and rites of celebrating the Passover, concludes thus; This was the true rite of celebrating the Passover in the times of the Messiah…</p></blockquote>

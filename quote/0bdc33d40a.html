<main class="wrap"><figure class="quote" id="q-0bdc33d40a" data-kw="">
<blockquote><p>For convincing a man of sin, righteousness, and judgment, by the gospel. As for convincing a man of sin, and righteousness, and judgment, by the gospel, or covenant of grace, he must understand three things:

1. That not believing in Jesus Christ, or refusing of the covenant of grace offered in him, is a greater and more dangerous sin than all other sins against the law; because the hearers of the gospel, not believing in Christ, do reject God’s mercy in Christ, the only way of freedom from sin and wrath, and will not yield to be reconciled to God.

2. Next, he must understand, that perfect remission of sin, and true righteousness, is to be had only by faith in Jesus; but God requires no other conditions but faith; and testifies from heaven, that he is well pleased to justify sinners upon this condition.

3. He must understand, that upon righteousness received by faith, judgment shall follow, on the one hand, to the destroying of the works of the devil in the believer, and to the perfecting of the work of sanctification in him, with power: and that, upon refusing to take righteousness by faith in Jesus Christ, judgment shall follow, on the other hand, to the condemnation of the unbeliever, and destroying of him with Satan and his servants for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson-james-durham.html">David Dickson &amp; James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Saving Knowledge</cite>, (Edinburgh, 1650; repr. Crown &amp; Covenant Publications, 2022), 20–21.</span></figcaption>

<blockquote><p>X. The making of the charge is described by the metaphor of books or records in which the actions of the person who are being judged are written down. Revelation 20:12 ‘And the books were opened.’ By the word ‘books’ is to be understood both God’s omniscience and man’s conscience. XI.The wicked will be judged in accordance with their works and on account of their works; the righteousness according to the works of faith but not on account of their works. Thus in Revelation 20:12 it is said the that another book, the book of life, was opened, so that we may know that the salvation of the righteous depends not on works but on the eternal grace of God, through which they have been entered into the book of life.</p></blockquote>

</figure><figure class="quote" id="q-3024f40bc6" data-kw="">
<blockquote><p>From this, also, we infer, that we cannot be justified freely through faith alone without at the same time living holily. For these fruits of grace are connected together, as it were, by an indissoluble tie, so that he who attempts to sever them does in a manner tear Christ in pieces. Let therefore the man who seeks to be justified through Christ, by God&#x27;s unmerited goodness, consider that this cannot be attained without his taking him at the same time for sanctification, or, in other words, being renewed to innocence and purity of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Corinthians</cite>, 1 Corinthians 1:30</span></figcaption>

</figure><figure class="quote" id="q-51637e0443" data-kw="">
<blockquote><p>We affirm on the other side [from the Papists], that the testimony of the Spirit of God in the Word itself–witnessing it to be of God, by that stamp and impress, or, which comes to the same, by those notes and marks of divinity, which everywhere appear in it–is the immediate and principal, and a sufficient, reason of our believing it to be the Word of God, and the medium [which] the Spirit, working inwardly in our hearts, moves as the efficient of our faith, so the Scripture itself, in its own intrinsical beauty, luster, power and excellency, is that which moves us, in the way of an object or medium, to yield our assent to its being of God. By this the Spirit of God; and, by an internal application of this to our minds, induceth us to assent to its so being…. This they [the Papists] deny; and this we shall first, though more briefly prove…</p></blockquote>

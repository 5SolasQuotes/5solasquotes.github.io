<main class="wrap"><figure class="quote" id="q-dbc05a79dd" data-kw="">
<blockquote><p>In the second member [of the verse] he betrays an evil conscience, or, at least, he shows that he handled rather a private business than any public cause, for he complains that the apostles will cause the priests and the scribes to be hated for the death of Christ. … Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests… But the chief priest does not consider what is his duty towards God and the Church; he abuses his authority tyrannously, as if the same were not under any laws, as the Pope deals with us at this day; for seeing that he takes to himself an unbridled authority and government, he fears not to condemn us for schismatics, so soon as he sees us refuse his decrees; for he catches at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludes that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ. Now, forasmuch as he does manifestly play the minister of Satan, he borrows authority, without shame and color, of the name of Christ; yea, the very form of speech which the chief priest uses doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the Word of God, dare grant liberty to themselves to attempt whatsoever pleases them. With a commandment (says he) have we commanded. Whence comes such strait rigor, save only because they think that all that must be received without exception which they shall command?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 5:28</span></figcaption>

bc05a79dd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=In%20the%20second%20member%20%5Bof%20the,without%20exception%20which%20they%20shall%20command&amp;text=In%20the%20second%20member%20%5Bof%20the%20verse%5D%20he&amp;text=be%20received%20without%20exception%20which%20they%20shall%20command" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-c270919e61" data-kw="">
<blockquote><p>XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, [Against] Dr. Owen’s Vindicator… (London: Parkhurst, 1684), section 2, p. 11</span></figcaption>

</figure><figure class="quote" id="q-4c57a2c187" data-kw="">
<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 112</span></figcaption>

</figure><figure class="quote" id="q-8af35392ec" data-kw="">
<blockquote><p>And here, that we may not be drawn aside by the prevalence of vulgar error, it should be understood that ceremonies are not, therefore, unlawful, because they are significant. For the holy kiss, respecting which mention is made in Rom. 16:16, was a sign by which they wished to signify the fraternal love and union of all Christians. And even the learned Peter Martyr, is so far from rejecting ceremonies because they are significant, that he says, ‘they are the more laudable, if, in the way of sermons, they admonish us of some duty.’ (on 1 Cor. 11)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge</cite>, tr. Josiah Allport (1634; 1846), Determination 20, ‘The English Church is fully competent to bind to the observance of ceremonies’, p. 331 bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“And here, that we may not be drawn aside by the prevalence of vulgar error, it should be understood that ceremonies are not, therefore, unlawful, because they are significant. For the holy kiss, respecting which mention is made in Rom. 16:16, was a sign by which they wished to signify the fraternal love and union of all Christians. And even the learned Peter Martyr, is so far from rejecting ceremonies because they are significant, that he says, ‘they are the more laudable, if, in the way of sermons, they admonish us of some duty.’ (on 1 Cor. 11)”

— John Davenant, The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge, tr. Josiah Allport (1634; 1846), Determination 20, ‘The English Church is fully competent to bind to the observance of ceremonies’, p. 331 bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+here%2C+that+we+may+not+be+drawn+aside+by+the+prevalence+of+vulgar+error%2C+it+should+be+understood+that+ceremonies+are+not%2C+therefore%2C+unlawful%2C+because+they+are+significant.+For+the+holy+kiss%2C+respecting+which+mention+is+made+in+Rom.+16%3A16%2C+was+a+sign+by+which+they+wished+to+signify+the+fraternal+love+and+union+of+all+Christians.+And+even+the+learned+Peter+Martyr%2C+is+so+far+from+rejecting+ceremonies+because+they+are+significant%2C+that+he+says%2C+%E2%80%98they+are+the+more+laudable%2C+if%2C+in+the+way+of+sermons%2C+they+admonish+us+of+some+duty.%E2%80%99+%28on+1+Cor.+11%29%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+The+Determinations%2C+or+Resolutions+of+Certain+Theological+Questions%2C+Publicly+Discussed+in+the+University+of+Cambridge%2C+tr.+Josiah+Allport+%281634%3B+1846%29%2C+Determination+20%2C+%E2%80%98The+English+Church+is+fully+competent+to+bind+to+the+observance+of+ceremonies%E2%80%99%2C+p.+331+bound+at+the+end+of+John+Davenant%2C+A+Treatise+on+Justification%2C+or+the+Disputatio+de+Justitia...+trans.+Josiah+Allport+%281631%3B+London%2C+1846%29%2C+vol.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8af35392ec.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8af35392ec.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=And%20here%2C%20that%20we%20may%20not,some%20duty.%E2%80%99%20%28on%201%20Cor.%2011&amp;text=And%20here%2C%20that%20we%20may%20not%20

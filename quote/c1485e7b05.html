</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2744cc85f0" data-kw="">
<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology</cite>, (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Heinrich Bullinger on Natural Reason, Theology &amp; Law’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>…the Fifth Way, at least as developed by later Thomists, does indeed plausibly get us to a divine intelligence. By contrast, Paley’s argument is often acknowledged to get us at best to a designer who is extremely powerful and and intelligent, but who for all we know may yet be finite and, thus non-divine. But it is not just that Paley’ s designer may be something other than God as Aquinas understands Him. There is reason to think that Paley’s designer could not be God as Aquinas understands Him. For Aquinas, when we predicate attributes of God, we necessarily do so analogously rather than univocally. But Paley is evidently predicating attributes to his designer and to us in a univocal way, which (for the Thomist at least) entails a radically deficient conception of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147, p. 83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-f1d8e2c61a" data-kw="">
<blockquote><p>[1.] A twofold revelation of God is given to wayfarers [persons in this life], one in the sphere of nature, another in the sphere of grace.

2. Revelation in the sphere of nature is either Objective in the works of creation, or Subjective in the consciences of men.

3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led.

4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving.

5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel and doctrine concerning Christ the Savior and faith in Him, who, without knowledge of Him who alone is the way, can come to life?

6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>

</figure><figure class="quote" id="q-b4f52f4f03" data-kw="">
<blockquote><p>The extrinsic arguments or testimonies are:

1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions;

2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin, pp. 206-9</span></figcaption>

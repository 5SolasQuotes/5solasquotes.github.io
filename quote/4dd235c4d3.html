<blockquote><p>Remember that whatever duty you seem obliged to perform, the obligation still supposes that it is not naturally impossible to you, and therefore you are bound to do it as well as you can. And when other men’s force or your natural disability hinders you from doing it as you would, you are not therefore disobliged from doing it at all: but the total omission is worse than the defective performance of it, as the defective performance is worse than doing it more perfectly.ª And in such a case the defects which are utterly involuntary are none of yours imputatively at all, but his that hinders you (unless as some other sin might cause that). ª See Mr. [Joseph] Truman’s book of Natural and Moral Impotency. As if I were in a country where I could have liberty to read and pray, but not to preach, or to preach only once a month and no more: It is my duty to do so much as I can do, as being much better than nothing, and not to forbear all because I cannot do all. Objection: But you must forbear no part of your duty. Answer: True, but nothing is my duty which is naturally impossible for me to do. Either I can do it, or I cannot: If I can, I must (supposing it a duty in all other respects); but if I cannot, I am not bound to it. … Direction 14. Remember that no material duty is formally a duty at all times: that which is a duty in its season is no duty out of season. Affirmative precepts bind not to all times (except only to habits [inward dispositions] or the secret intention of our ultimate end, so far as is sufficient to animate and actuate the means while we are waking and have the use of reason.. Praying and preaching, that are very great duties, may be so unseasonably performed as to be sins: If forbearing a prayer or sermon or sacrament one day or month be rationally like to procure your help or liberty to do it afterward, when that once or few times doing it were like to hinder you from doing it anymore, it would be your duty then to forbear it for that time (unless in some extraordinary case): For even for the life of an ox or an ass, and for mercy to men’s bodies, the rest and holy work of a Sabbath might be interrupted: much more for the souls of many. Again I warn you, as you must not pretend the interest of the end against a peremptory absolute command of God, so must you not easily conclude a command to be absolute and peremptory to that which certainly contradicts the end: nor easily take that for a duty which certainly is no means to that good which is the end of duty or which is against it. Though yet no seeming aptitude as a means must make that seem a duty which the prohibition of God has made a sin.</p></blockquote>

</figure><figure class="quote" id="q-c00382ea43" data-kw="">
<blockquote><p>14th Objection: They object: To be present at a mass is to countenance an idol worship; so to be present in a church worship where there is any error in the worship is to countenance the error. For what worship we countenance to that we say, ‘Amen,’ and so we must consent to the wrong constitution of a church where are profane people? Answer: To countenance a worship professedly idolatrous, where the name of the worship imports the worshipping of a false god, is unlawful, for others do interpret our presence [as] a joint worshipping with them. But our presence at every lawful worship that is acknowledged lawful, does not give so much as interpretatively signification of our consent to every particular in the worship, because hearing, discerning, choosing or refusing, believing or not believing, according as you find the points agreeable to God’s Word, or dissonant therefrom, intervenes between your presence at the worship, and your consent to the worship. Now the act of consenting, approving and receiving the point of worship is formally to partake of the worship, else we could not obey the precept (1 Thess. 5:21) ‘Try all things.’ Some things in the preacher are to be borne with; The preachers of the Separation have not an apostolic and infallible spirit; if any of them preach unsound doctrine, the presence of the hearers does not involve them in the guilt of the preacher’s erroneous worship. The Pharisees corrupting of the Law was known and rebuked by Christ, but yet Christ forbade Separation. ‘Hear them’ (Matt. 23) ‘they sit in Moses’ chair.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 11, pp. 162-63</span></figcaption>

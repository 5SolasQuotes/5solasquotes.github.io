<blockquote><p>… for I think neither ancient nor modern divines will call them schismatics who cordially join with the Church where they live in all of her worship, except this [singing of a human-composed doxology]… It is false also that all the Churches abroad have human ceremonies so twisted with their solemn worship that presbyterians cannot join with them. We have often (and do when occasion serves) very cordially, and to our edification, joined with them, and yet partake in none of these: nor is so much of these among them as he [the episcopal opponent] would make us believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., pp. 258-59</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3801e70079" data-kw="">
<blockquote><p>Must not he who will forbear communion with a Church till it be altogether freed from mixtures, tarry till the day of Judgment, till when we have no promise that Christ will gather out of his Church whatsoever does offend? This was it that amongst other reasons conquered the prejudices of that good man Mr. J. Allen and kept him from separation, of which we have this account. He knew of how great moment it was that the public worship of God should be maintained, and that its assemblies should not be relinquished, though some of its administrations did not clearly approve themselves unto him; because upon the account of some imperfections and pollutions in them, supposed, or real, to withdraw communion, is evidently to suppose ourselves joined before our time to the heavenly Assembly, or to have found such an one upon earth exempt from all mixtures and imperfections of worshippers and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jude</cite>, verse 19 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

%20who%20will%20forbear,and%20imperfections%20of%20worshippers%20and%20worship&amp;text=Must%20not%20he%20who%20will%20forbear%20communion%20with&amp;text=all%20mixtures%20and%20imperfections%20of%20worshippers%20and%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7cc0ca3135" data-kw="">
<blockquote><p>What assemblies of Christians we behold visibly worshiping God in Christ, we take for granted to be true visible churches. And when we judge of our own communion with them, it is not upon this question, whether they are true churches or no, as though the determination of our practice did depend solely thereon: For as we are not called to judge of the being of their constitution, as to the substance of it, unless they are openly judged in the Scripture, as in the case of idolatry and persecution persisted in, so a determination of the truth of their constitution, or that they are true churches, will not presently resolve us in our duty as to communion with them, for the reasons before given. But in such a case, two things are by us principally to be considered:

1. That nothing sinful in it self, or unto us, be required of us as the condition of communion.

2. That we may in such churches obtain the immediate end of their institution, and our conjunction with them, which is our edification in faith, love and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious</cite>, (1672), ch. 3, pp. 82-83</span></figcaption>

<blockquote><p>[Job 15:15] ‘For God finds not steadfastness in his saints (that is to say in his angels), neither are the heavens clean in his sight:’… For first and foremost they [men] had need to be cleaner and purer than the angels, and they had need to surmount the brightness of the sun and the stars, seeing that the heavens themselves are infected before God, if comparison should be made between them and Him… But there is another higher righteousness in God, which surmounts all creatures, insomuch as no angel is able to satisfy it. And no wonder at all: for what comparison is there between an infinite thing and a thing that has bounds? Behold, although the angels have great glory in them: yet are they but creatures. And what is God? He is an infinite thing, insomuch that when we think upon Him, we ought to be ravished into astonishment. So then let us not think it strange, that God’s righteousness should be so high that when all creatures come to that point, all that is to be found in them shall be nothing at all, but they shall deserve to be utterly wiped out… And so far are we unable to stand upright that the very angels of heaven are confounded there. And why? Because the very heavens themselves are not clean. For whereas God has created the sun to give light to the world, and given some brightness to the stars also: it follows not therefore that they have a divine perfection. We must remember what has been said afore: namely that all the creatures that God made do keep still some marks of his grace. But if a man would compare that which is in the creatures with that which is in God: he shall find that the one is all and the other is nothing. Thus ye see how the heavens are not clean, that is to say, that there is always some imperfection in the creatures, so as they have not the power to stand before God, as in respect of the infinite glory that is in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Job</cite>, … upon the Book of Job (London: 1574), 2nd sermon on ch. 15, 58th Sermon, pp. 298-99</span></figcaption>

<blockquote><p>First, if we tender up to God all that we have. Though we be never so poor and mean, yet if God has the strength of our souls, God accepts it. For we are to know that God does not stand in need of what we have, or of what we do; but that we might show our respect to Him: Therefore if we give all that we have, God accepts it. As a child, if it puts forth all its strength that it has to do a business which the father bids him, whether the business be done or no, the father looks upon it and accepts it as suitable to the child’s strength; and it shows the respect that the child has to his father. And as it is storied of an emperor that when a poor man had nothing to offer him but a little water that he had taken up with his hand, he having nothing else, the emperor accepts of it. So that’s that which God looks for, that the creature should lift Him above all. If therefore when thou comest to worship God, God has more of thy heart then ever any creature in the world had, God accepts of that, and that you must look unto; Can you say so, when you go to worship God: Lord it is true there is much weakness in my spirit, but Thou that knowest all things knowest that thou hast more of my heart than ever any creature in the world had. This is suitable to God: God will account this (in the Covenant of Grace) to be a present suitable to Himself. As in the Law, when they offered to the building of the Temple, every one could not offer gold and silver and precious stones, but some came and offered badgers-skins, and some women did spin and offered coats-hair to the building of the Temple, and so God accepted of that being the most they could do.

2. In the second place, when we do not only offer unto God the most we can, but when we add to this the grief of our souls that we can do no more, when the soul shall strive to the uttermost it can, and when it has done all, says, ‘I am an unprofitable servant; Oh that I could do more!’ This is suitable to God.

3. Thirdly, the people of God though they be weak, yet the weakest servant of God is able to offer up to God somewhat that is suitable to the infinite majesty of God, upon this third ground, because that there is a kind of impression of God’s infiniteness in those services that a gracious heart does tender unto God, and therefore [it is] suitable unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 4, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”, pp. 63-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“First, if we tender up to God all that we have. Though we be never so poor and mean, yet if God has the strength of our souls, God accepts it. For we are to know that God does not stand in need of what we have, or of what we do; but that we might show our respect to Him: Therefore if we give all that we have, God accepts it. As a child, if it puts forth all its strength that it has to do a business which the father bids him, whether the business be done or no, the father looks upon it and accepts it as suitable to the child’s strength; and it shows the respect that the child has to his father. And as it is storied of an emperor that when a poor man had nothing to offer him but a little water that he had taken up with his hand, he having nothing else, the emperor accepts of it. So that’s that which God looks for, that the creature should lift Him above all. If therefore when thou comest to worship God, God has more of thy heart then ever any creature in the world had, God accepts of that, and that you must look unto; Can you say so, when you go to worship God: Lord it is true there is much weakness in my spirit, but Thou that knowest all things knowest that thou hast more of my heart than ever any creature in the world had. This is suitable to God: God will account this (in the Covenant of Grace) to be a present suitable to Himself. As in the Law, when they offered to the building of the Temple, every one could not offer gold and silver and precious stones, but some came and offered badgers-skins, and some women did spin and offered coats-hair to the building of the Temple, and so God accepted of that being the most they could do.

2. In the second place, when we do not only offer unto God the most we can, but when we add to this the grief of our souls that we can do no more, when the soul shall strive to the uttermost it can, and when it has done all, says, ‘I am an unprofitable servant; Oh that I could do more!’ This is suitable to God.

3. Thirdly, the people of God though they be weak, yet the weakest servant of God is able to offer up to God somewhat that is suitable to the infinite majesty of God, upon this third ground, because that there is a kind of impression of God’s infiniteness in those services that a gracious heart does tender unto God, and therefore [it is] suitable unto God.”

— Jeremiah Burroughs, Gospel Worship, ... (London: 1647) | Sermon 4, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”, pp. 63-64">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+if+we+tender+up+to+God+all+that+we+have.+Though+we+be+never+so+poor+and+mean%2C+yet+if+God+has+the+strength+of+our+souls%2C+God+accepts+it.+For+we+are+to+know+that+God+does+not+stand+in+need+of+what+we+have%2C+or+of+what+we+do%3B+but+that+we+might+show+our+respect+to+Him%3A+Therefore+if+we+give+all+that+we+have%2C+God+accepts+it.+As+a+child%2C+if+it+puts+forth+all+its+strength+that+it+has+to+do+a+business+which+the+father+bids+him%2C+whether+the+business+be+done+or+no%2C+the+father+looks+upon+it+and+accepts+it+as+suitable+to+the+child%E2%80%99s+strength%3B+and+it+shows+the+respect+that+the+child+has+to+his+father.+And+as+it+is+storied+of+an+emperor+that+when+a+poor+man+had+nothing+to+offer+him+but+a+little+water+that+he+had+taken+up+with+his+hand%2C+he+having+nothing+else%2C+the+emperor+accepts+of+it.+So+that%E2%80%99s+that+which+God+looks+for%2C+that+the+creature+should+lift+Him+above+all.+If+therefore+when+thou+comest+to+worship+God%2C+God+has+more+of+thy+heart+then+ever+any+creature+in+the+world+had%2C+God+accepts+of+that%2C+and+that+you+must+look+unto%3B+Can+you+say+so%2C+when+you+go+to+worship+God%3A+Lord+it+is+true+there+is+much+weakness+in+my+spirit%2C+but+Thou+that+knowest+all+things+knowest+that+thou+hast+more+of+my+heart+than+ever+any+creature+in+the+world+had.+This+is+suitable+to+God%3A+God+will+account+this+%28in+the+Covenant+of+Grace%29+to+be+a+present+suitable+to+Himself.+As+in+the+Law%2C+when+they+offered+to+the+building+of+the+Temple%2C+every+one+could+not+offer+gold+and+silver+and+precious+stones%2C+but+some+came+and+offered+badgers-skins%2C+and+some+women+did+spin+and+offered+coats-hair+to+the+building+of+the+Temple%2C+and+so+God+accepted+of+that+being+the+most+they+could+do.+2.+In+the+second+place%2C+when+we+do+not+only+o

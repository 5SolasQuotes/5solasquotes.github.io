<main class="wrap"><figure class="quote" id="q-4b93237d7c" data-kw="">
<blockquote><p>[We reject the errors of those] Who teach: That Christ by His satisfaction merited neither salvation itself for any one, nor faith, whereby this satisfaction of Christ unto salvation is effectually appropriated; but that He merited for the Father only the authority or the perfect will to deal again with man, and to prescribe new conditions as He might desire, obedience to which, however, depended on the free will of man, so that it therefore might have come to pass that either none or all should fulfill these conditions. For these adjudge too contemptuously the death of Christ, in no way acknowledge that most important fruit or benefit thereby gained, and bring again out of hell the Pelagian error. Paragraph 4 [We reject the errors of those] Who teach: That the new covenant of grace, which God the Father, through the mediation of the death of Christ, made with man, does not herein consist that we by faith, in as much as it accepts the merits of Christ, are justified before God and saved, but in the fact that God, having revoked the demand of perfect obedience of faith, regards faith itself and the obedience of faith, although imperfect, as the perfect obedience of the law, and does esteem it worthy of the reward of eternal life through grace. For these contradict the Scriptures, “being justified freely by His grace through the redemption that is in Christ Jesus, whom God set forth as a propitiation by His blood, through faith” (Rom 3:24-25). And these proclaim, as did the wicked Socinius, a new and strange justification of man before God, against the consensus of the whole church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons, 2nd Head of Doctrine, Rejection of Errors, 9 May, 1619.</cite></span></figcaption>

</figure><figure class="quote" id="q-f5e879f068" data-kw="">
<blockquote><p>A conclusion certain enough: God loves himself.” p. 100 Proof: 1) A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) If love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was [not] formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection. 2) Blessedness seems to be a pure perfection, and therefore it belongs to God in supreme degree. But love seems to be either the principal element in blessedness, or at any rate intimately connected with the blessedness of an intellectual being. That blessedness is a pure perfection is clear from the notion of it; for blessedness is nothing other than an intellectual being pleased, that follows upon possession of one’s proper perfection. But God knows himself as infinitely perfect; he seems, therefore, to be blessed; therefore blessedness seems to be a pure perfection. That this blessedness is not simply intellection, but includes an act of will or love, seems to follow from the fact that there is in God some operation besides what is formally called intellection, for God is formally willing, at least in respect of creatures. (See the next chapter [Part 3] about the proof of free volition in God.) For if God freely creates things outside himself and so has volition, it seems that he also has some act of volition, namely love, toward himself. 3) God is the first cause of all love in us. Hence he has this perfection either formally or virtually. If you concede that the love is better than not to love, God cannot have love only virtually, because the more imperfect does not include the more perfect virtually. Therefore God has love formally. As was said above about divine intellection, this divine love is not something really distinct from God’s essence. It extends, therefore, to everything that is really identified with the same essence. Hence it can be said that God loves his essence, his decrees, his knowledge, etc. This love is also eternal, unchangeable, non-contingent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’ (1958), ‘Proof of God’</cite></span></figcaption>

o+be+blessed%3B+therefore+blessedness+seems+to+be+a+pure+perfection.+That+this+blessedness+is+not+simply+intellection%2C+but+includes+an+act+of+will+or+love%2C+seems+to+follow+from+the+fact+that+there+is+in+God+some+operation+besides+what+is+formally+called+intellection%2C+for+God+is+formally+willing%2C+at+least+in+respect+of+creatures.+%28See+the+next+chapter+%5BPart+3%5D+about+the+proof+of+free+volition+in+God.%29+For+if+God+freely+creates+things+outside+himself+and+so+has+volition%2C+it+seems+that+he+also+has+some+act+of+volition%2C+namely+love%2C+toward+himself.+3%29+God+is+the+first+cause+of+all+love+in+us.+Hence+he+has+this+perfection+either+formally+or+virtually.+If+you+concede+that+the+love+is+better+than+not+to+love%2C+God+cannot+have+love+only+virtually%2C+because+the+more+imperfect+does+not+include+the+more+perfect+virtually.+Therefore+God+has+love+formally.+As+was+said+above+about+divine+intellection%2C+this+divine+love+is+not+something+really+distinct+from+God%E2%80%99s+essence.+It+extends%2C+therefore%2C+to+everything+that+is+really+identified+with+the+same+essence.+Hence+it+can+be+said+that+God+loves+his+essence%2C+his+decrees%2C+his+knowledge%2C+etc.+This+love+is+also+eternal%2C+unchangeable%2C+non-contingent.%E2%80%9D%0A%0A%E2%80%94+Allan+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99+%281958%29%2C+%E2%80%98Proof+of+God%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff5e879f068.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f5e879f068.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/of-blessedness/#:~:text=A%20conclusion%20certain%20enough%3A%20God%20loves,love%20is%20also%20eternal%2C%20unchangeable%2C%20non%2Dcontingent&amp;text=A%20conclusion%20certain%20enough%3A%20God%20loves%20himself.%E2%80%9D%20p&amp;text=etc.%20This%20love%20is%20also%20eternal%2C%20unchangeable%2C%20non%2Dcontingent" rel="noopener" tar

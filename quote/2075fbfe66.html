<main class="wrap"><figure class="quote" id="q-2075fbfe66" data-kw="">
<blockquote><p>Here we are reminded to make sure that we are not cut off from the truth of the gospel of God. There are two ways in which we can be cut off, one on the left and the other on the right. This is because the truth of the gospel has two parts to it. The right-hand one is justification, which comes only by faith in Christ and is for the salvation of everyone who believes, whether Jew or Gentile. The left-hand side is the new creation, or newness of life or renewal of the mind.

Those who teach that justification is freely imputed on the basis of faith in Christ alone and who do not confuse it with the doctrine of merits and self-righteousness that comes from works, and who also teach that faith is not dead and useless but active in love, and in the renewal of the mind that comes by the Spirit of Christ are on the right track toward the truth of the gospel.

Those who teach self-righteousness and human merits cut people off from it on the right, and those who preach faith in such a way as to make worldly people feel secure without having to change their lives and allow them to live according to the desires of the flesh without repenting of them, cut them off on the left. In other words, the papists cut people off on the right and the pseudo-evangelicals cut them off on the left.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii</cite>, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 69.</span></figcaption>

</figure><figure class="quote" id="q-079141024f" data-kw="">
<blockquote><p>[You must distinguish:]

20. Betwixt pardon and justification conditional, which is an immediate effect of Christ’s death and resurrection, or rather of the making of the new Covenant. 2. And pardon and justification absolute, when we have performed all the conditions.

21. Betwixt conditional pardon and justification, which is only potential (such is that which immediately follows the enacting of the new Covenant to men before faith, or before they have sinned). 2. And conditional justification, which is actual, and of which the person has true possession, such is our justification after faith, till the Last Judgment, which is ours actually, but yet upon condition of perseverance in faith and sincere obedience. … 25. Betwixt the accusation of the Law (from [which] Christ does justify believers). 2. And the accusation of the Gospel or new Covenant, for not performing its conditions at all (from which no man can be justified, and for which there is no sacrifice). … 27. Betwixt our first possession of justification, which is upon our contract with Christ or mere faith. 2. And the confirmation, continuation and accomplishment of it (whose condition is also sincere obedience and perseverance).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), Guide to the Reader</span></figcaption>

<blockquote><p>That popish device of a second justification is a satanical delusion for the Word of God does acknowledge no more but one justification at all, and that absolute and complete of itself. There is but one justice, but one satisfaction of God being offended. Therefore, there cannot be a manifold justification.</p></blockquote>

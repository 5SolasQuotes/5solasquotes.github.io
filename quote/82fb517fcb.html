<main class="wrap"><figure class="quote" id="q-82fb517fcb" data-kw="">
<blockquote><p>Since not only the complete finishing of this treatise under my hand, which is now about five months ago, but also the printing of some part of it, the two dissertations of Dr Davenant, of the Death of Christ, and of Predestination and Reprobation, were set forth; in both which, especially the former, there are sundry assertions, positions, and theses, differing from what is delivered in the ensuing treatise, and, as I suppose, repugnant unto truth itself. The whole of those persuasions, I confess, which he endeavoureth in them to maintain, is suited to the expressions of sundry learned men, as Austin, Hilary, Fulgentius, Prosper, who in their generations deserved exceeding well of the church of God; but that it is free from opposition to the Scripture, or indeed self-contradiction, is not so apparent. Yea, through the patience and goodness of God, I undertake to demonstrate that the main foundation of his whole dissertation about the death of Christ, with many inferences from thence, are neither found in, nor founded on the word; but that the several parts thereof are mutually conflicting and destructive of each other, to the great prejudice of the truth therein contained. It is a thing of the saddest consideration possible, that wise and learned men should once suppose, by tempering the truths of God so that they may be suited to the self-indulgency of unsubdued carnal affections, to give any lustre to them, or in the least to remove that scandal and offence which the fleshly-minded doth take continually at those ways of God which are far above out of his sight. That this is the grand design of such undertakings as that of the learned bishop now mentioned, even to force the mysteries of the gospel to a condescension and suitableness unto the unpurged relics of the wisdom of nature, when all other thoughts ought to be captivated to the obedience thereof, is to me most apparent. Whence else should it proceed that so many unscriptural distinctions of the various intentions of God in the business of redemption, with the holding out, for the confirmation of one part of their opinion,—namely, “That Christ died for all and every one in such a sense,”—those very arguments which the most that own the truth of their inferences do employ merely against the latter part of their opinion,—namely, “In some sense he died only for the elect,”—with sundry inextricable entanglements, should fill up both the pages of their discourses? It is no way clear to me what glory redoundeth to the grace of God, what exaltation is given to the death of Christ, what encouragement to sinners in the things of God, by maintaining that our Saviour, in the intention and the designment of his Father, died for the redemption of millions for whom he purchased not one dram of saving grace, and concerning whom it was the purpose of God from eternity not to make out unto them effectually any of those means for a participation in the fruits of his death, without which it is impossible but it should be useless and unprofitable unto them; and yet this is the main design of that Dissertation concerning the Death of Christ. What in that and the ensuing discourse is argued and contended for according to the mind of God we thankfully accept; and had it not been condited with the unsavoury salt of human wisdom, it had been exceeding acceptable, especially at this time: for that there are some more than ordinary endeavours for the supportment and re-enforcing of the almost conclamated cause of Arminianism ready to be handed unto public view is commonly reported and believed; concerning which, also, many swelling words (of which there lies great abundance on every side) are daily vented, as of some unparalleled product of truth and industry, as though “Nil oriturum alias, nil ortum tale,” [nothing like it has arisen, nothing like it will arise again] for the most part by such as are utterly ignorant how far these controversies have been sifted, and to what issue they have been driven long ago.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold (T&amp;T Clark, n.d.), 10:432–33. Emphasis added. NB: the translation of the Latin is supplied by the HB. It is a quotation from book 2, epistle 1, line 16 of the Epistles of Horace.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-744bc248cd" data-kw="">
<blockquote><p>The truth is, we deny that Christ died for all, in as much as he died not to procure the grace of faith and regeneration for all, but only for Gods elect; and consequently neither shall any but God’s elect have any such interest in Christ’s death, as to obtain thereby pardon of sin and salvation, for Arminians themselves confess that this is the portion only of believers. But seeing pardon of sin and salvation are benefits merited by Christ, not to be conferred absolutely but conditionally, to wit, upon condition of faith; we may be bold to say that Christ in some sense died for all and every one, that is, he died to procure remission of sins and salvation unto all and every one in case they believe; and as this is true, so may we well say, and the Council of Dort might well say, that every one who hears the Gospel is bound to believe that Christ died for him in this sense, namely, to obtain salvation for him in case he believe. But what think Arminians; are we bound to believe that Christ died for us in such a sense, as to purchase faith and regeneration for us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice</cite>, … (Amsterdam, 1631), 3rd Part | 3rd Section, p. 165</span></figcaption>

</figure><figure class="quote" id="q-9268f81703" data-kw="">
<blockquote><p>In fact it seems much more accurate to say that Amyraut was the real Reformed “scholastic,” and “Reformed Thomas Aquinas,” the balancer, the synthesizer, the creator of new categories, and structures. And Reformed orthodoxy, with its insistence on limited redemption, was actually a primitive throwback to the rigorous and markedly non-rationalistic particularism of Augustine and Gottschalk. Under whatever label, John Calvin, as a limited redemptionist, belongs historically with Augustine, Gottschalk, Bucer, Beza and Reformed orthodoxy–not with Amyraut.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-rainbow.html">Jonathan Rainbow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Will of God and the Cross</cite>, (Allison Park, PA: Pickwick Publications, 1990), p. 62</span></figcaption>

</figure><figure class="quote" id="q-2c726bebc9" data-kw="">
<blockquote><p>“There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.</p></blockquote>

<div class="actions"><button class="copy" data-copy="““There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.”

— André Rivet, Works (d. 1651), vol. 2, Thirteen Disputations on the Just &amp; Gracious Dispensation of God concerning the Salvation of the Human Race, Disputation 6, Theses 9-11 in Barthold Holtzfus, Theological Treatise on Predestination, Election &amp; Reprobation of Men 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), p. 121 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%9CThere+are+others%2C+who%2C+rejecting+that+first+absolute+decree%2C+and+rightly+so%2C+make+the+conditional+decree+so+common+to+all+men+that+they+assert+that+the+counsel+of+God+the+Father+in+delivering+the+Son+to+death+and+of+the+Son+in+undergoing+the+same%2C+and+their+intention+and+scope%2C+was+to+acquire%2C+impetrate+and+merit+for+all+and+every+sinful+man+by+that+most+precious+death+and+passion%2C+that%2C+if+they+repent%2C+when+they+are+capable+of+doctrine+and+believe+in+Christ%2C+they+might+be+able+to+be+reconciled+with+God+and+receive+the+remission+of+sins.+They+deny%2C+however%2C+that+actual+reconciliation+with+God+or+the+remission+of+sins+or+eternal+life+was+actually+acquired+or+impetrated+for+those+who+remain+in+impenitence.+11.+Since+these+deny+that+Christ+died+equally+for+the+impious+and+the+pious%2C+and+affirm+that+only+the+pious+may+glory+in+the+satisfaction+of+Christ%2C+because+the+principal+fruit+and+efficacy+of+the+satisfaction+comes+to+them%2C+they+agree+in+sense+with+all+other+Orthodox+on+that+point%2C+even+if+they+differ+in+their+mode+of+speaking%3B+especially+since+they+acknowledge+a+certain+special+decree%2C+according+to+which+He+died+specially+for+the+elect+alone%2C+by+which+they+are+brought+not+only+to+the+common%2C+but+also+to+the+singular+benefits%2C+namely+the+grace+of+regeneration+and+of+efficacious+calling%2C+of+justification+and+of+glorification%3B+and+to+the+merit+of+Christ%E2%80%99s+death+they+assign+the+true+and+efficacious+communion%2C+bestowal+and+application+of+saving+grace%2C+and+the+donation+of+faith+itself%2C+by+which+the+application+is+made.%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Works+%28d.+1651%29%2C+vol.+2%2C+Thirteen+Disputations+on+the+Just+%26+Gracious+Dispensation+of+God+concerning+the+Salvation+of+the+Human+Race%2C+Disputation+6%2C+Theses+9-11+in+Barthold+Holtzfus%2C+Theological+Treatise+on+Predestination%2C+Election+%26+Reprobation+of+Men+3rd+ed.+tr.+by+AI+by+Nosferatu+%28Leiden%2C+1705%29%2C+p.+121+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c726bebc9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c726bebc9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=There%20are%20others%2C%20who%2C%20rejecting%20that,by%20which%20the%20application%20is%20made&amp;text=There%20are%20others%2C%20who%2C%20rejecting%20that%20first%20absolute&amp;text=faith%20itself%2C%20by%20which%20the%20application%20is%20made" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

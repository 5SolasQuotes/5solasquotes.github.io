<blockquote><p>To be justified by faith, which is the first and vital justification, James has interpreted as being called a friend of God, that is, with sins forgiven, to be reconciled with God and to be received by Him into grace and friendship, who before was an enemy of God and a son of wrath. But to be justified by works, he taught is the same as to receive from God, on account of good works, which Abraham and Rahab received from Him, that is, approbation, praise and remuneration.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dabe8366b1" data-kw="">
<blockquote><p>Both kinds therefore of justice are contained in justification, and neither is separated from the other; and thus in the definition of justification, the merit of the blood of Christ is included with forgiveness of sins and the gift of the Holy Ghost, the Justifier and Regenerator. Concerning which gift of justice the apostle speaks in these words, ‘For if by the offence of one, etc.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-3eaa37cff6" data-kw="">
<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

<blockquote><p>Proposition 3: Many of our learned [Romish] adversaries destroy that which is principal and most essential in remission of sinnes, to wit, condonation. Vasques the Jesuit says [denying condonation]… The said author confirms his opinion by these two arguments especially: … Argument 2: If a condonation be admitted for the merit of Christ, then the merit of Christ imputed is the formal cause of that condonation: and granting this, the justification of a sinner must have two forms: one of remission of sins; the other of inward cleansing and sanctification. But this is contrary to the Trident Council affirming that justification has but one form. (Bellarmine, On Justification, bk. 2, ch. 2; Concil of Trent, sess. 6, ch. 7) And it differs very little from the doctrine of the Protestants. For in the principal, it is one with it, to wit, in that it holds that a justified person does next and immediatly receive the remission of sins for the merit of Christ imputed. And the smaller difference between the sides, to wit, whether inherent justice may be admitted a part of justification, might be qualified by some such modification as Vega propounds to Calvin (For the Council of Trent, bk. 15, ch. 5), saying, ‘If at all times when one is iustified, he is also sanctified, what offence is it to allow one common word (namely ‘justification’ [citing Beza on Tit. 3:7 &amp; Rom. 8:30]) to express and contain both these parts?’ I am not ignorant that many other Papists admit condonation; but Vasquez charges that opinion with having affinity with ours, and affirms and proves that it is repugnant to the Trident Councel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-white.html">Francis White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Faith &amp; Way to the Church Explaned &amp; Justified in Answer to a Popish Treatise</cite>, ... (London: Field, 1617), pt. 1, ch. 1, Observation 1, ‘Touching remission of sins in justification’, pp. 18-19 White (c. 1564 – 1638) was an Anglican bishop.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Proposition 3: Many of our learned [Romish] adversaries destroy that which is principal and most essential in remission of sinnes, to wit, condonation. Vasques the Jesuit says [denying condonation]… The said author confirms his opinion by these two arguments especially: … Argument 2: If a condonation be admitted for the merit of Christ, then the merit of Christ imputed is the formal cause of that condonation: and granting this, the justification of a sinner must have two forms: one of remission of sins; the other of inward cleansing and sanctification. But this is contrary to the Trident Council affirming that justification has but one form. (Bellarmine, On Justification, bk. 2, ch. 2; Concil of Trent, sess. 6, ch. 7) And it differs very little from the doctrine of the Protestants. For in the principal, it is one with it, to wit, in that it holds that a justified person does next and immediatly receive the remission of sins for the merit of Christ imputed. And the smaller difference between the sides, to wit, whether inherent justice may be admitted a part of justification, might be qualified by some such modification as Vega propounds to Calvin (For the Council of Trent, bk. 15, ch. 5), saying, ‘If at all times when one is iustified, he is also sanctified, what offence is it to allow one common word (namely ‘justification’ [citing Beza on Tit. 3:7 &amp; Rom. 8:30]) to express and contain both these parts?’ I am not ignorant that many other Papists admit condonation; but Vasquez charges that opinion with having affinity with ours, and affirms and proves that it is repugnant to the Trident Councel.”

— Francis White, The Orthodox Faith &amp; Way to the Church Explaned &amp; Justified in Answer to a Popish Treatise... (London: Field, 1617), pt. 1, ch. 1, Observation 1, ‘Touching remission of sins in justification’, pp. 18-19 White (c. 1564 – 1638) was an Anglican bishop.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProposition+3%3A+Many+of+our+learned+%5BRomish%5D+adversaries+destroy+that+which+is+principal+and+most+essential+in+remission+of+sinnes%2C+to+wit%2C+condonation.+Vasques+the+Jesuit+says+%5Bdenying+condonation%5D%E2%80%A6+The+said+author+confirms+his+opinion+by+these+two+arguments+especially%3A+%E2%80%A6+Argument+2%3A+If+a+condonation+be+admitted+for+the+merit+of+Christ%2C+then+the+merit+of+Christ+imputed+is+the+formal+cause+of+that+condonation%3A+and+granting+this%2C+the+justification+of+a+sinner+must+have+two+forms%3A+one+of+remission+of+sins%3B+the+other+of+inward+cleansing+and+sanctification.+But+this+is+contrary+to+the+Trident+Council+affirming+that+justification+has+but+one+form.+%28Bellarmine%2C+On+Justification%2C+bk.+2%2C+ch.+2%3B+Concil+of+Trent%2C+sess.+6%2C+ch.+7%29+And+it+differs+very+little+from+the+doctrine+of+the+Protestants.+For+in+the+principal%2C+it+is+one+with+it%2C+to+wit%2C+in+that+it+holds+that+a+justified+person+does+next+and+immediatly+receive+the+remission+of+sins+for+the+merit+of+Christ+imputed.+And+the+smaller+difference+between+the+sides%2C+to+wit%2C+whether+inherent+justice+may+be+admitted+a+part+of+justification%2C+might+be+qualified+by+some+such+modification+as+Vega+propounds+to+Calvin+%28For+the+Council+of+Trent%2C+bk.+15%2C+ch.+5%29%2C+saying%2C+%E2%80%98If+at+all+times+when+one+is+iustified%2C+he+is+also+sanctified%2C+what+offence+is+it+to+allow+one+common+word+%28namely+%E2%80%98justification%E2%80%99+%5Bciting+Beza+on+Tit.+3%3A7+%26+Rom.+8%3A30%5D%29+to+express+and+contain+both+these+parts%3F%E2%80%99+I+am+not+ignorant+that+many+other+Papists+admit+condonation%3B+but+Vasquez+charges+th

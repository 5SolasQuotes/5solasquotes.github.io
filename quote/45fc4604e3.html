<blockquote><p>6. But as fewer that have leprosies, or plagues, or that take poison escape, than of other men, so we have great cause to believe, that much fewer Papists are saved, than such as escape their errors. And therefore all that love their souls should avoid them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology… (London, 1673)</cite>, p. 778</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>…but some greater kingly power is due to the king in the case of the Churches aberring, than in the case of the Churches’ right administration; and as our divines do justly give to the prince an extraordinary kingly power in the case of universal apostasy of the Church, as Jehoshaphat, Hezekiah, Josiah, and other worthy reformers in the Church of the Jews did warrantably use their kingly power, when the Church-men were corrupted and negligent in their duty; so in a particular case of a particular error of the synod, the king as king, may use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which is extraordinary], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only (for he that is not with Christ is against Him), but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644)</cite>, pp. 413-4</span></figcaption>

<blockquote><p>1. Thou shalt not hurt thy own body. One may be guilty of self-murder… (1.) Indirectly and occasionally, as: First, When a man thrusts himself into danger which he might prevent; as if a company of archers were shooting, and one should go and stand in the place where the arrows fly, if the arrow did kill him, he is accessory to his own death. In the law, God would have the leper shut up, to keep others from being infected. Lev. 23:4. Now, if any would be so presumptuous as to go in to the leper, and get the plague of leprosy, he might thank himself; he occasioned his own death. Secondly, A person may be in some sense guilty of his own death, by neglecting the use of means. If sick, and use no physic, if he has received a wound and will not apply balsam, he hastens his own death. God appointed Hezekiah to lay a ” lump of figs upon the boil,” Isa. 38:21. If he had not used the lump of figs, he had been the cause of his own death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity | on the 6th Commandment</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-0350d090e9" data-kw="">
<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27, 1643’ (London, 1644)</cite></span></figcaption>

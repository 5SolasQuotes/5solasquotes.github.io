<main class="wrap"><figure class="quote" id="q-163b6233b2" data-kw="">
<blockquote><p>God therefore displayed on Mount Sinai the law of the Ten Commandments as a covenant of works in subservience to the covenant of grace. He displayed it in that form in order that the people might, by contemplating it, see what kind and degree of righteousness it required as the condition of eternal life, and that by means of it, finding themselves utterly destitute of perfect righteousness, they might be impelled to take hold of the covenant of grace in which the perfect righteousness of the second Adam is provided and exhibited for the justification of all who believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 54.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d30a5a5b6" data-kw="">
<blockquote><p>XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), vol. 1. 162 (2.3.33).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-4df24fc1d8" data-kw="">
<blockquote><p>It therefore now appears, that as the law or dictates of pure nature, comprehended together with other fit additionals, became at first one entire constitution aptly suited to the government of man in his innocent state, unto which the title did well agree of the law or covenant of works: so the same natural dictates, transcribed and made express (because now sullied, and not so legible in the corrupted nature of man) do, with such allays [alleviation] and additions as the case required, compose and make up the constitution which bears the title of the law or covenant of grace, or the law of faith, or the gospel of Christ; and is only suitable to the state of man lapsed and fallen, as the measure of that righteousness which he is now to aim at, and aspire unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessedness Of The Righteous Opened</cite>, (London, 1668), 26–27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-762b7e58fd" data-kw="">
<blockquote><p>We can never state our thoughts aright in this matter, unless we have a clear apprehension of, and satisfaction in, the introduction of grace by Jesus Christ into the whole of our relation unto God, with its respect unto all parts of our obedience. There was no such thing, nothing of that nature or kind, in the first constitution of that relation and obedience by the law of our creation. We were made in a state of immediate relation unto God in our own persons, as our creator, preserver, and rewarder. There was no mystery of grace in the covenant of works. No more was required unto the consummation of that state but what was given us in our creation, enabling us unto rewardable obedience. “Do this, and live,” was the sole rule of our relation unto God. There was nothing in religion originally of that which the gospel celebrates under the name of the grace, kindness, and love of God, whence all our favourable relation unto God doth now proceed, and whereinto it is resolved; nothing of the interposition of a mediator with respect unto our righteousness before God, and acceptance with him;—which is at present the life and soul of religion, the substance of the gospel, and the centre of all the truths revealed in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 5 (Edinburgh: T&amp;T Clark, n.d.), 44–45.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-762291d26b" data-kw="">
<blockquote><p>How hath the Moral Law been delivered since the Fall? The Sum thereof was comprised in ten Words, (Exod. 34:28; Deut. 4:13.) commonly called the Decalogue or Ten Commandments; solemnly published and engraved in Table of Stone by God himself, (Deut. 4:14 &amp; 10:4.) Afterwards the same was more fully delivered in the Books of Holy Scripture, and so committed to the Church for all Ages, as the Royal Law for Direction of our Obedience to God our King, (James 1:8.) and for the Discovery of Sin, and the Punishment due thereto, Deut. 27:26; Rom. 1:31 &amp; 3:20. What then doth the Law now require of us? All such Duties as were required of Adam in his Innocency, (Levit. 18:5.) and all such as are required since by reason of his Fall, (Deut. 17:2–6.) binding us to eternal Death for our least defect therein. Declare now out of that which hath been said, what the Covenant of Works is? It is a Conditional Covenant between God and Man, whereby on the one side God commandeth the Perfection of Godliness and Righteousness, and promiseth that he will be our God, if we keep all his Commandments; and on the other side, Man bindeth himself to perform intire and perfect Obedience to God’s Law, by that Strength wherewith God hath indued him by the Nature of his first Creation. What was done in this Covenant on God’s part? There was his Law, backed with Promises and Threatnings; and unto them were added outward Seals. What was the Sum of this Law? Do this, and thou shalt live: If thou dost it not, thou shalt die the Death. What is meant by, Do this? Keep all my Commandments in Thought, Word, and Deed. What is meant by Life, promised to those that should keep all the Commandments? The Reward of Blessedness and Everlasting Life, Levit. 18:5; Luk. 10:28. What is meant by Death threatned to those that should transgress? In this World the Curse of God, and Death, with manifold Miseries both of Body and Soul: And (where this Curse is not taken away) Everlasting Death both of Body and Soul in the World to come, Deut. 27:26 &amp; 29:19, 20 &amp; 32:22; Levit. 26; Deut. 28. What were the outward Seals added hereunto? The two Trees, planted by God for that purpose in the midst of the Garden, Gen. 2:9 &amp; 3:3. that Adam before and in the sight of them might resort to some special place to serve God in, and might by the Sight of them be put in mind of those things whereof they were Signs and Seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: Or, the Sum and Substance of Christian Religion, Eighth Edition</cite>, (London: R. J.; Jonathan Robinson; A. and J. Churchill; J. Taylor; J. Wyatt, 1702), 170–71.</span></figcaption>

ed.+What+is+meant+by+Life%2C+promised+to+those+that+should+keep+all+the+Commandments%3F+The+Reward+of+Blessedness+and+Everlasting+Life%2C+Levit.+18%3A5%3B+Luk.+10%3A28.+What+is+meant+by+Death+threatned+to+those+that+should+transgress%3F+In+this+World+the+Curse+of+God%2C+and+Death%2C+with+manifold+Miseries+both+of+Body+and+Soul%3A+And+%28where+this+Curse+is+not+taken+away%29+Everlasting+Death+both+of+Body+and+Soul+in+the+World+to+come%2C+Deut.+27%3A26+%26+29%3A19%2C+20+%26+32%3A22%3B+Levit.+26%3B+Deut.+28.+What+were+the+outward+Seals+added+hereunto%3F+The+two+Trees%2C+planted+by+God+for+that+purpose+in+the+midst+of+the+Garden%2C+Gen.+2%3A9+%26+3%3A3.+that+Adam+before+and+in+the+sight+of+them+might+resort+to+some+special+place+to+serve+God+in%2C+and+might+by+the+Sight+of+them+be+put+in+mind+of+those+things+whereof+they+were+Signs+and+Seals.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+A+Body+of+Divinity%3A+Or%2C+the+Sum+and+Substance+of+Christian+Religion%2C+Eighth+Edition.+%28London%3A+R.+J.%3B+Jonathan+Robinson%3B+A.+and+J.+Churchill%3B+J.+Taylor%3B+J.+Wyatt%2C+1702%29%2C+170%E2%80%9371.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F762291d26b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/762291d26b.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/09/usher-the-covenant-of-works-is-the-sum-of-the-law/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

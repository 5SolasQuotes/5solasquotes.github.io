<main class="wrap"><figure class="quote" id="q-20d871875e" data-kw="">
<blockquote><p>The enemy is made the more dangerous because it is found within, rather than without, the Church. Definite opponents of the Christian religion could have been more easily met; but now as in ancient times Satan has preferred to labor for the most part in the dark. The change has come very quietly and very gradually. There have been few open breaks; there have been comparatively few open denials; good men, in their ignorance, have often become emissaries of unbelief. The Gospel has not been openly contradicted, but it has been quietly pushed aside. It has quietly faded away, as one picture fades away before another on the screen; and another gospel has assumed its place. Many men are quite unconscious of the change; they are made very angry by being told the truth. Others are not so completely blind; they know in their heart of hearts that all is not well. But they will do nothing unpleasant to preserve the purity of the Church; they preach the true Gospel themselves, they say, but let others in the same church preach what they will. God will ultimately honor the truth, they tell us; God will ultimately destroy error; but meanwhile let us above all have peace. Thus is Gamaliel cited as though he were a Christian saint; thus does a worldly urbanity masquerade under the name of love; thus has a polite optimism been substituted for the dread solemnity and exclusiveness of the Gospel of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Present Situation in the [Mainline] Presbyterian Church,” Christianity Today 1.1 (1930), 5.</cite></span></figcaption>

<blockquote><p>2. All instruction is either about things or about signs; but things are learnt by means of signs. I now use the word “thing” in a strict sense, to signify that which is never employed as a sign of anything else: for example, wood, stone, cattle, and other things of that kind. Not, however, the wood which we read Moses cast into the bitter waters to make them sweet, nor the stone which Jacob used as a pillow, nor the ram which Abraham offered up instead of his son; for these, though they are things, are also signs of other things. There are signs of another kind, those which are never employed except as signs: for example, words. No one uses words except as signs of something else; and hence may be understood what I call signs: those things, to wit, which are used to indicate something else. Accordingly, every sign is also a thing; for what is not a thing is nothing at all. Every thing, however, is not also a sign. And so, in regard to this distinction between things and signs, I shall, when I speak of things, speak in such a way that even if some of them may be used as signs also, that will not interfere with the division of the subject according to which I am to discuss things first and signs afterwards. But we must carefully remember that what we have now to consider about things is what they are in themselves, not what other things they are signs of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Doctrina 1.2.</cite></span></figcaption>

</figure><figure class="quote" id="q-b55a47f3a4" data-kw="">
<blockquote><p>Of the Church of the New Testament, it was prophesied that God would give them one way, as well as one heart, Jer. 32:39, that there shall not only be one Lord, but his Name one, Zech. 14:9. We are exhorted to walk by the same rule, so far as we have attained, that is, to study uniformity, not diversity in those things which are agreed upon to be good and right, Phil. 3:16. Does not the apostle plainly intimate and commend a uniformity in the worship of God, 1 Cor. 14:27… verse 33, for God is not the author of confusion, but of peace, as in all the Churches of the saints, verse 40, ‘Let all things be done decently and in order.’ He limits the prophets to that same number, of two or three, even as he limits those that had the gift of tongues, verse 29. And was it not a great uniformity that he would have every man who prayed or prophesied, to have his head uncovered, and every woman covered, 1 Cor. 11? Does not the same apostle, besides the doctrine of faith and practical duties of a Christian life, deliver several canons to be observed in the ordination and admission of elders and deacons, concerning widows, concerning accusations, admonitions, censures and other things belonging to Church policy, as appears especially from the epistles to Timothy and Titus?… In the ancient Church, although there was not an uniformity in all particulars among all the churches, for instance in the point of fasting: some fasting on the Sabbath, some not, some taking the Lord’s Supper fasting, some after meals, which differences in fasting, gave occasion to the old rule: dissonantia jejunii non dissolvit consonantiam fidei [The dissonance of fasting does not dissolve the concord of the faith]. Although likewise, there was a great difference between the custom of one church and another in the time and manner of celebrating the Lords Supper and in other particulars, as Augustine, Socrates and the author of the Tripartite History record unto us. Yet the Centuries and other ecclesiastical historians show us in every century, a great uniformity in those ancient times, even in very many things belonging to Church government and form of worship.</p></blockquote>

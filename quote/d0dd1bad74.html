</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c42abdb17f" data-kw="">
<blockquote><p>‘It comes sometime to pass’ (says St. Augustine) ‘that the children of bond-slaves are brought to baptism by their Lord; sometime the parents being dead, the friends alive undertake that office, sometime stangers or virgins consecrated unto God, which neither have, nor can have children of their own, take up infants in the open streets, and so offer them unto baptism, whom the cruelty of unnatural parents casts out, and leaves to the adventure of uncertain pity.’ As therefore he which did the part of a neighbor, was a neighbor to that wounded man whom the parable of the Gospel describes, so they are fathers, although strangers, that bring infants to him which makes them the sons of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker</cite>, (that learned and judicious divine), in Eight Books of Ecclesiastical Polity… (London, 1666), bk.5, section 64, p. 244 Hooker (1554–1600) was a prominent Anglican apologist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘It comes sometime to pass’ (says St. Augustine) ‘that the children of bond-slaves are brought to baptism by their Lord; sometime the parents being dead, the friends alive undertake that office, sometime stangers or virgins consecrated unto God, which neither have, nor can have children of their own, take up infants in the open streets, and so offer them unto baptism, whom the cruelty of unnatural parents casts out, and leaves to the adventure of uncertain pity.’ As therefore he which did the part of a neighbor, was a neighbor to that wounded man whom the parable of the Gospel describes, so they are fathers, although strangers, that bring infants to him which makes them the sons of God.”

</figure><figure class="quote" id="q-3087bd07b3" data-kw="">
<blockquote><p>The Reformation was united in seeking the essence of the church in the invisible, in union with Christ, and not in an external, visible bond, as Rome does… In order to check this danger [of losing the historical progress of the Church through individualism] Luther moved a long way back to Rome. In a certain sense he again imprisoned the supernatural, invisible grace which maintained the church within something external… Where the church is found with the ministry of the Word and sacraments, it is self-sustaining. God, as it were, has let go of the grace which sustains the church and placed it in the means of grace. The Reformed believer cannot be satisfied with this presentation. Certainly he believes in the continuity of the church, but he believes in it and therefore does not need to support it by instruments of salvation, into which grace is poured. For him that continuity is assured by the faithful promise of God. Hence, in back of Word and sacrament he places the covenant as the strongest expression of how the unbroken work of grace from generation to generation rests, as all grace, on the sovereign pleasure of God. The church does not abide because we baptize or work regeneration by baptism; rather because God establishes his covenant from generation to generation, therefore the church remains and we baptize. Since it is God’s covenant an not man’s, it is appropriate for the Christian to recognize this goodness of God in quiet gratitude and in faith and to be strengthened by its sealing. Here again the concept of the covenant requires that faith will react freely and actively to this pronouncement of God… It is evident how strongly the idea of the covenant makes itself felt here, and how it elevates itself above all idolatrous worship of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation</cite>, pp. 261-2 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

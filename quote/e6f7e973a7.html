<main class="wrap"><figure class="quote" id="q-e6f7e973a7" data-kw="">
<blockquote><p>In our national and social affairs a wholesome, timely, and needed reaction has begun to set in against the false catholicity that was undermining the public welfare. Patriotism and statesmanship have begun to deal at various points with the question whether we have not swung open somewhat too widely the doors of our national hospitality.

Our loud invitation—”Ho, every one!”—has gone beyond the limits of public safety. We are watching somewhat more closely the immigrants across the two great oceans. We begin to question whether we are equal to the entertainment, government and assimilation of such a mixed multitude, who fall a-lusting so soon and so grossly after liberties and indulgences that are so strange, intolerable and abhorrent to us.

We object to the emptying upon our shores of the poorhouses and prisons and slums and lazarettos of the Old World; we send back the imported refuse, and hold the importers responsible. Economists, and not demagogues of labour only, are writing on our statute-books restrictions upon the unlimited importation of foreign labour. Propositions are pending, or are awaiting introduction in our national Senate, against the free admission of anarchists and the deluded converts of Mormon emissaries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-augustus-aiken.html">Charles Augustus Aiken</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Valiant for the Truth in Princeton Sermons: Chiefly by the Professors in Princeton Theological Seminary</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05426fba33" data-kw="both kinds">
<blockquote><p>From this the opinion of the Romanists is evident without any further investigation. Ours is wholly contrary. In fact, we think that the communion under both kinds instituted by Christ should necessarily be retained; so that it is not only free to each one to use it, but from the command of Christ they are individually bound to it, unless they are prevented by some insuperable hindrance. Not without the highest sacrilege can the cup be taken away from the people against the express law of God. The state of the question therefore (1) is not Was communion under both kinds instituted by Christ? (which our opponents do not dispute); but Ought it to be instituted in like manner by believers, so that it is not only a thing indifferent and accidental, but necessary and essential to the perfection of the sacrament? (2) The question is not Is the believer so bound to communion under both kinds that he cannot in any case without sin commune under one kind only? For we confess if any unavoidable impediment interposes, either internal (arising from the disposition of the receiver) or external from other causes, by which he is prohibited from taking one kind, such an one is worthy of commiseration rather than of reprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.25.5</span></figcaption>

</figure><figure class="quote" id="q-89510b8bf5" data-kw="">
<blockquote><p>So with respect to the Antichrist, it is most appropriate he be traced back to the idolatry of Rome, for he honors and worships the wafer-God of the Mass, who was truly unknown to the Fathers. Indeed, he worships the Angels and the Saints as protectors, helpers, and defenders, honoring them magnificently with gold, silver and precious things, in ornate external displays, and by building immense shrines for their veneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 59</span></figcaption>

</figure><figure class="quote" id="q-c204f63b4a" data-kw="">
<blockquote><p>The Papists restrict or bind the worship of Christ to a thing, to which Christ has not restricted it by any express command; and in this way they declare themselves idolaters, no less than if they were to worship Christ at a wall, or if they were to adore him falling down before a pillar. From what has now been said, it is evident that the mass is an idol, formed by Anti-Christ out of various accursed errors and blasphemies, and substituted in the place of the Lord&#x27;s supper, which, for his reason, is properly and necessarily abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, On the Lord&#x27;s Supper (the Mass)</span></figcaption>

</figure><figure class="quote" id="q-8a3eedb42d" data-kw="">
<blockquote><p>Christianity proclaims the one sacrifice of Christ to be the great atonement, the only propitiation for sin, and that, being infinitely precious, it needs never to be repeated; but the Church of Rome affirms that this sacrifice does need to be repeated, and is repeated in the celebration of the mass, which service she declares to be the offering up of a “true propitiatory sacrifice, not merely for the living, but also for the dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The character and prospects of the Church of Rome: in two discourses</cite>, (Stirling, 1830), p. 11.</span></figcaption>

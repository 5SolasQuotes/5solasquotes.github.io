</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8de93cabef" data-kw="">
<blockquote><p>Whether will these [Separatist] men allow one Christian to sing a psalm alone by himself, methinks the texts and examples mentioned, together with Jam. 5:13… are so plain as no rational man can deny it; But if one may, then the Church may. There is no act of worship which any member of the Church is bound to perform, but the Church is bound to perform; but on the contrary it is not true that what worship the Church does perform, a member of Church can, or may; For instance for the first part, meditation needs no organ of the body, and therefore I leave that. But does a member of the Church pray, so does the whole Church: does he read the Scriptures? so they are read in the Church; does he fast and pray? so does the Church; does he sing a psalm? so does the Church; But it is not true on the contrary, as appears in the sacraments, preaching, discipline, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Separation Examined</cite>, … (London: 1652), pp. 35-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3cab06c2d2" data-kw="">
<blockquote><p>Religion needs not any such ornaments, except men would make the worship of God, when naked [as Adam &amp; Eve were in the Garden in purity], under shame, and so under sin (for Justice married shame and sin once). But as roses, lillies, the sun, and other glorious creatures, are most beautiful without garments, and not capable of shame; so is the worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), ‘To the Reader’, no page number</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-6201f5bc82" data-kw="">
<blockquote><p>It is an untruth which Raphael de la Torres [a Dominican Romanist], with other schoolmen say, that with the same religion by which we honor holy men, we honor God; upon this reason, because holiness in them is a participation of the divine nature, therefore God must be the intrinsical end, and formal reason for which we honor the saints. [1.] For holiness in saints is a participation of the divine nature; but it is a temporary and a created participation, it is not the same very holiness that is in God; but the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature; and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God, commanded in the First Table of the Law. 2. When I bow to the gray-haired, and to the king, I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man, that I am then bowing to the God of heaven and Worshipping God: No acts terminated upon saints living or dead are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in or trembling at the Word, are not properly acts of adoring God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Introduction, section 6, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-9c0a7ab7f1" data-kw="">
<blockquote><p>And besides, all such as enjoy the means of grace, and yet have not felt this visitation of God, should be much allured to the care of attending upon the means, and be made desirous to receive the grace of God, and that effectually: it should much move them that God has now sent them the means, and keeps his public visitation; and that God stands not upon desert, nor does He make exception of them, but offers his grace unto all, and desires not the death of any sinner, yea beseeches them to be reconciled [see 2 Cor. 5:20]; and to that end has committed the Word of reconciliation to his servants, with express commandment that they should be instant, and with all patience instruct men, and call upon them, and persuade them to save their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (1637), p. 420</span></figcaption>

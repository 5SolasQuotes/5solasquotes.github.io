<main class="wrap"><figure class="quote" id="q-709cf6ada5" data-kw="">
<blockquote><p>Ancient and medieval philosophy in general, and Thomism in particular, emphasized metaphysics over epistemology, and objective reality over our subjective awareness of it. The right order of inquiry, from this point of view, is first to determine the nature of the world and the place of human beings within it, and then on that basis to investigate how human beings come to acquire knowledge of the world. Modern philosophy, beginning with Rene Descartes (1596-1650), reverses this approach, tending as it does to start with questions about how we can come to have knowledge of the world and only then going on to consider what the world must be like, based on an account of our knowledge of it. In particular, both Descartes’ rationalism and the empiricism of writers like Locke, Berkeley, and Hume begin with the individual conscious subject or self, develop a theory about how that self can know anything, and then determine what reality in general must be like in line with their respective theories of knowledge. One result of this subjectivist method was to make objective reality and common sense problematic in a way they had not been for Aristotle and Aquinas; skepticism thus came to seem a serious threat, and idealism (the view that the material world is an illusion and that mind alone is real) came to seem a serious option. Another consequence was that even when some sort of objective reality was acknowledged, doubts were raised about the possibility of knowing much about it beyond what the senses could tell us directly. Accordingly, grand metaphysical systems of the sort presented by Plato, Aristotle, and Aquinas were called into question. The philosophy of Immanuel Kant (1724-1804) was an especially influential expression of hostility to traditional metaphysics, distinguishing as it does between ‘phenomena’ (the world as it appears to us, of which we can have knowledge) and ‘noumena’ (the world as it exists in itself, which we cannot know).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009) Feser is an Analytical Thomist.</span></figcaption>

<blockquote><p>The many ethical gradations of common life arise from the intermix of the natural teleologies of our variegated and shuffling circumstances, according to their qualities, weights and proportions, mixed with the same in positive laws. Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved² (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. ² An example is posing a hypothetical situation for moral judgment. Usually the moral judgment is made quickly based on one’s moral sensibilities, and rationalizations are then come up with to justify the moral judgment. This article has constantly posed such scenarios, appealing to persons’ upright common sense, leaving the principles of why such is right to be worked out (as has been done). It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>

<blockquote><p>V. Next, we must examine those aspects that primarily and chiefly pertain here (πρώτως καὶ κυρίως, “primarily and chiefly”) [in man as unfallen]: namely, the infused and inherent habits (habitus infusi &amp; concreati), for considering only acquired habits, as the Socinians and Remonstrants do, is sheer nonsense. These habits perfected and adorned these faculties excellently, such as the clarity and rectitude of the mind, not only regarding that innate (ὑπάρχον) aspect of the divine (τὸ τοῦ θεοῦ), whether it is innate through common notions (κοιναὶ ἐννοίαι) and the subjective light of the mind, or acquired through the objective light of being, as Socinus vainly objects (Romans 1; Isaiah 40; Psalm 19; Acts 14; Romans 2).</p></blockquote>

eformed Books Online</a></div>

<blockquote><p>…in the case of a rational substance, an end toward which it is directed can be known intellectually, and that the will or rational appetite just is that power by virtue of which such a subtance can aim at an end qua grasped by the intellect.ª ª We can, of course, also aim at ends that are not grasped by the intellect. For example, any human being aims at the end of circulating blood through his body, just by virtue of having a heart and blood vessels, and does so even if he is completely unaware of the existence of this circulatory system. It is precisely because we can iam at such ends without the intellect being cognizent of them that their pursuit is not the subject of the will. A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>

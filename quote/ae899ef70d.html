<blockquote><p>1. Homeostasis: living things regulate themselves internally and thereby preserve themselves. 2. Metabolism: the living being takes in external matter/energy and uses it to sustain itself. 3. Adaptation: the organism changes its internal condition so as to maintain itself in its environment.</p></blockquote>

<blockquote><p>3. We neither have, nor can have here in flesh, any one proper formal conception of the Divine nature that is formally suited to the truth in the object, but only metaphorical or analogical conceptions borrowed from things better known. 4. Yet nothing beyond sense (at least) is so certainly known as God, so far as we can reach, though nothing be less perfectly or more defectively known, or less comprehended. Even as we know nothing visible more certainly than the sun, and yet comprehend nothing visible less. … 7. God is here seen in the glass of His works, with the revelation of His Word and Spirit. And from these works we must borrow our conceptions. 8. Therefore, though the thing intended when we speak of God be transcendently and only in Him, and not in the creature, yet the first use of the words is to signify something in the creature. And therefore the creature is the famosius analogatum, though nothing to God.</p></blockquote>

</figure><figure class="quote" id="q-0edcc5e7a1" data-kw="">
<blockquote><p>It was a common practise amongst the young students of our universities in the time of the Dunses [after John Duns Scotus] (and is yet amongst too many, whom spots of Dunsery have stained), that if in disputation they were brought to an inconvenience, were it never so absurd, they would haue a distinction, though void of brain and sense, yet a distinction to maintain it. If a man will be perverse, it is no mastery to do it. But as a wise and learned man does say of them, that they are base wits which are so affected, whereas ingenuous minds and natures well-given will rather seek how true that is which they hold than how they may defend it, making greater price of verity than victory: so I may say (yea much more in matters of religion, of faith, of life eternal) a Christian wit and godly mind will search and weigh rather what should be said truly than what may be said probably or colourably at the least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds &amp; John Hart touching the Head &amp; the Faith of the Church… (London: Bishop, 1584)</cite>, p. 44</span></figcaption>

</figure><figure class="quote" id="q-e59b32ddfd" data-kw="">
<blockquote><p>Metaphysics is defined as the science of being qua [as] being… Metaphysics can, therefore, be described as the first real speculative science. It is a science because it is a body of demonstrated truths about a single formal object… Insofar as it is a science, metaphysics differs from sacred theology because the latter is not a science in the strict Aristotelian sense for its principles are not evident but revealed. Metaphysics is a real science, as is plain from its definition. For being signifies the same as thing or what actually exists or is at least capable of such existence. Therefore metaphysical notions are first intentions, or concepts that are predicated immediately of things themselves. So metaphysics differs from the logical sciences which deal with second intentions, that is, with concepts that are predicated immediately of other concepts or of beings of reason. Metaphysics indeed is the first or supreme real science, and so differs from other less universal real things, as physics, cosmology, psychology; for it does not just consider one or other part of reality, as these sciences do, but with the totality of things. Therefore, by reason of its material object, metaphysics is equivalent to all the real sciences taken together. Further, it is first by reason of its formal object; for the other sciences consider real things in some narrower respect, as physics considers things as changeable, cosmology things as bodily, etc. But metaphysics considers them precisely as they are real. Hence other real sciences, as cosmology, philosophy of man, presuppose metaphysics and use its conclusions as their principles. But metaphysics does not use the conclusions of any other real science, physics or natural philosophy, as principles. Metaphysics is a speculative and not practical science, because it does not tend toward any other operation but speculation. Hence it differs from ethics, which is practical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), Intro</cite>, pp. 7-8</span></figcaption>

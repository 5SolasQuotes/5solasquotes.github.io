<main class="wrap"><figure class="quote" id="q-2613988208" data-kw="">
<blockquote><p>But we earnestly request, that their pretences may not be taken upon their words, that our reasons may be pondered ere we be condemned of novelty upon a bare accusation: yea although there were some likelihood of truth in it. So long as the accuser speaketh, it is hard if the defendant be not injured. But the laws, but nature, but God willeth, that both parties, the plaintiff and defendant, be heard with equal attention and equity. Otherwise, where is the innocent that could shroud himself from the fraud and violence of calumny: always malicious, but then confident and peremptory, when she perceiveth herself handsomely trimmed, and to be favoured something like the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An examination of those plausible appearances which seem most to commend the Romish Church, and to prejudice the Reformed. Discovering them to be but mere shifts, purposely invented, to hinder an exact trial of doctrine by the Scriptures</cite>, trans. William Pinke (Oxford: Edward Forrest, 1626), p. 59.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d22d3196dc" data-kw="">
<blockquote><p>When error is admitted into the Church, it will be found that the stages of its progress are always three. It begins by asking toleration. Its friends say to the majority: You need not be afraid of us; we are few, and weak; only let us alone; we shall not disturb the faith of the others. The Church has her standards of doctrine; of course we shall never interfere with them; we only ask for ourselves to be spared interference with our private opinions. Indulged in this for a time, error goes on to assert equal rights. Truth and error are two balancing forces. The Church shall do nothing which looks like deciding between them; that would be partiality. It is bigotry to assert any superior right for the truth. We are to agree to differ, and any favoring of the truth, because it is truth, is partisanship. What the friends of truth and error hold in common is fundamental. Anything on which they differ is ipso facto non-essential. Anybody who makes account of such a thing is a disturber of the peace of the church. Truth and error are two co-ordinate powers, and the great secret of church-statesmanship is to preserve the balance between them. From this point error soon goes on to its natural end, which is to assert supremacy. Truth started with tolerating; it comes to be merely tolerated, and then only for a time. Error claims a preference for its judgments on all disputed points. It puts men into positions, not as at first in spite of their departure from the Church’s faith, but in consequence of it. Their recommendation is that they repudiate the faith, and position is given them to teach others to repudiate it, and to make them skillful in combating it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-porterfield-krauth.html">Charles Porterfield Krauth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Conservative Reformation and Its Theology As Represented</cite>, (Philadelphia: J. B. Lippincott, 1871), 195–96..</span></figcaption>

</figure><figure class="quote" id="q-0b44dcca6e" data-kw="">
<blockquote><p>I answer, recommendatory letters can never give a Church-right to the Church-privileges of the seals of the Covenant: they do but only notify, manifest and declare the Church-right which the man had before. Therefore, either he cannot in any sort be capable of the seals of the Covenant in another congregation than his own whereof he is an inchurched member [as upon a congregationalist view], which destroys all communion of sister Churches, or if he be capable of the seals in another congregation [which be the case], he was capable and had a Church-right in himself before he received recommendatory letters: yea, these whom we recommend by letters as fit to partake of the sacraments in another congregation, we presuppose they have Church-right to the seals in another congregation-visible than in their own whereof they are members, except our testimony be false. Therefore, before our recommendatory letters, the person of approved piety was a member of all the visible Churches about, hoc ipso, and ‘by that same reason,’ that he is a member of one visible congregation: Yea Peter clearly insinuates that all who have received the Holy Ghost, are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the Eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals, and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer when he goes to another visible congregation than his own, that faith gives him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does as a condition notify this faith and Church-right in all congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, pp. 195-96 Rutherford (c. 1600–1661) was a Scottish presbyterian Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-a2e4d76cca" data-kw="">
<blockquote><p>Walk in the ways of God, in his fear and love—keep communion with him and he will direct you: Ps. 25:13, ‘The secret of the Lord is with them that fear him; he will show them his covenant.’ God discovereth himself particularly to his own people. They are his friends, and you know friends reveal themselves mutually to one another in the greatest secrets; as Christ giveth the reason: John 15:15, ‘I have called you friends, for all things that I have heard of my Father, I have revealed to you.’ Those that keep up a continual acquaintance with God, by manifesting their love and fear of him, shall have divine mysteries manifested to them: Col. 1:26, ‘The mystery that was hid from ages is made manifest to the saints.’

Truths that have long lain hid through many successions and revolutions of ages, are at length made known to holy persons. Where there is purity, there is revelation: ‘The pure in heart shall see God,’ Mat. 5:8. They shall see more of his truth and mind in those things which if they should judge if by their own reason, they would contemn. So also it is said, Prov. 3:32, ‘His secret is with the righteous.’ They have not only other kinds of knowledge, but knowledge of the secret of such a way as is veiled with contempt, reproach, and unlikelihood to the world. Blind and carnal men sometimes stumble upon the despised ways of Christ; but they do but plough with the saints’ heifer, and light their torch at the altar. Their selfends and by-interests make them borrow from truth; but it is with them as it is with parrots, they speak the words of men not of reason but custom; they learn a truth when it is delivered, they have been used to such notions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 226.</span></figcaption>

— Thomas Manton, A Practical Exposition upon the Fifty-Third Chapter of Isaiah, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 226.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWalk+in+the+ways+of+God%2C+in+his+fear+and+love%E2%80%94keep+communion+with+him+and+he+will+direct+you%3A+Ps.+25%3A13%2C+%E2%80%98The+secret+of+the+Lord+is+with+them+that+fear+him%3B+he+will+show+them+his+covenant.%E2%80%99+God+discovereth+himself+particularly+to+his+own+people.+They+are+his+friends%2C+and+you+know+friends+reveal+themselves+mutually+to+one+another+in+the+greatest+secrets%3B+as+Christ+giveth+the+reason%3A+John+15%3A15%2C+%E2%80%98I+have+called+you+friends%2C+for+all+things+that+I+have+heard+of+my+Father%2C+I+have+revealed+to+you.%E2%80%99+Those+that+keep+up+a+continual+acquaintance+with+God%2C+by+manifesting+their+love+and+fear+of+him%2C+shall+have+divine+mysteries+manifested+to+them%3A+Col.+1%3A26%2C+%E2%80%98The+mystery+that+was+hid+from+ages+is+made+manifest+to+the+saints.%E2%80%99%0A%0ATruths+that+have+long+lain+hid+through+many+successions+and+revolutions+of+ages%2C+are+at+length+made+known+to+holy+persons.+Where+there+is+purity%2C+there+is+revelation%3A+%E2%80%98The+pure+in+heart+shall+see+God%2C%E2%80%99+Mat.+5%3A8.+They+shall+see+more+of+his+truth+and+mind+in+those+things+which+if+they+should+judge+if+by+their+own+reason%2C+they+would+contemn.+So+also+it+is+said%2C+Prov.+3%3A32%2C+%E2%80%98His+secret+is+with+the+righteous.%E2%80%99+They+have+not+only+other+kinds+of+knowledge%2C+but+knowledge+of+the+secret+of+such+a+way+as+is+veiled+with+contempt%2C+reproach%2C+and+unlikelihood+to+the+world.+Blind+and+carnal+men+sometimes+stumble+upon+the+despised+ways+of+Christ%3B+but+they+do+but+plough+with+the+saints%E2%80%99+heifer%2C+and+light+their+torch+at+the+altar.+Their+selfends+and+by-interests+make+them+borrow+from+truth%3B+but+it+is+with+them+as+it+is+with+parrots%2C+they+speak+the+words+of+men+not+of+reason+but+custom%3B+they+learn+a+truth+when+it+is+delivered%2C+they+have+been+used+to+such+notions.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Practical+Exposition+upon+the+Fifty-Third+Chapter+of+Isaiah%2C+%281703%29+in+The+Complete+Works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%3A+James+Nisbet+%26+Co.%2C+1871%29%2C+3%3A+226.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa2e4d76cca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a2e4d76cca.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/06/thomas-manton-on-walking-in-friendship-with-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The recognition that there may be true Christians within the bounds of the Church of Rome is something that most Reformed theologians have granted. The Scottish Covenanter, Samuel Rutherford, for example, refused to countenance the dogmatic notion that there were no Christians within the Romish communion:

[F]or even the whole Romish Church in all its members deserveth not excommunication, in respect we are sure God hath thousands in the bosom of that Church, who believe in Christ, and do not defend popery with obstinacie …</p></blockquote>

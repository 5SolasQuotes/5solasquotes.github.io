<main class="wrap"><figure class="quote" id="q-755531d41b" data-kw="">
<blockquote><p>Richard A. Muller, in his article, “Grace, Election and Contingent Choice…” deals with the historical myth that the classic reformed theology leads to metaphysical determinism. Quite the contrary to the charge, by analyzing the teachings of the major Reformed thinkers and confessions, Muller shows that the Reformed view of divine sovereignty and grace neither denies human free choice and future contingents nor undermines human responsibility.” – Jeongmo Yoo, John Edwards, p. 28 Mylius, R.A. [Richard Muller] – ‘In the Steps of Voetius: Synchronic Contingency &amp; the Significance of Cornelius Elleboogius’ Disputationes de Tetragrammato to the Analysis of his Life &amp; Work’ (2010) 10 pp. in ed. M. Wisse, M. Sarot &amp; W. Otten, Scholasticism Reformed: Essays in Honour of Willem J. Van Asselt Buy pp. 92-102 ‘God as Absolute &amp; Relative, Necessary, Free, &amp; Contingent: The Ad Intra-Ad Extra Movement of Seventeenth-Century Reformed Language About God’ in Always Reformed: Essays in Honor of W. Robert Godfrey Buy ed. R. Scott Clark &amp; Joel E. Kim, 2010, pp. 56-73 Sytsma, David – ‘The Specter of Necessitarianism’ in ch. 7, ‘From ‘Epicurean’ Physics to Ethics’ in Richard Baxter &amp; the Mechanical Philosophers (Oxford, 2017), pp. 233-39 . . Books 1600’s Strong, William – A Treatise Showing the Subordination of the Will of Man Unto the Will of God ToC (London, 1657) 335 pp. on Acts 21:14 This was recommended by Thomas Manton. Pages 197-278, especially, treat of the permissive will of God. Strong was an Independent puritan and Westminster divine. Sterry, Peter – A Discourse of the Freedom of the Will (London, 1675) 245 pp. Sterry (1613–1672) was an Independent, a Westminster divine and a chaplain to Cromwell. Sterry associated with the Cambridge Platonists prominent during the English Civil War era. Sterry had a mystical streak and was a millenarian; he expected the second advent of Christ, with the millennium on earth following, in the early 1650’s, and 1656 at the latest. This book has three parts. The first argues against “those arguments… in opposition to that liberty of the will, which [liberty] is placed in the determining of its power, received from the First Cause, unto a contrariety or contradiction in its actings, with an independency upon the First Cause, the order and connection of causes, and the understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Grace, Election &amp; Contingent Choice: Arminius’s Gambit &amp; the Reformed Response’</cite>, (1995) 27 pp. in ed. Thomas Schreiner &amp; Bruce Ware, The Grace of God, the Bondage of the Will, vol. 2, Historical &amp; Theological Perspectives on Calvinism, pp. 251-78</span></figcaption>

ormed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e41903d87" data-kw="">
<blockquote><p>The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination, wherein the Nature of Divine Predetermination is fully explicated &amp; demonstrated, both in the general, as also more particularly, as to the substrate mater or entitative act of sin</cite>, The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination, wherein the Nature of Divine Predetermination is fully explicated &amp; demonstrated, both in the general, as also more particularly, as to the substrate mater or entitative act of sin (1678) 217 pp., pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-418b349beb" data-kw="">
<blockquote><p>One of the most difficult questions which the seeker after souls has to meet arises out of the doctrine of Inability. “What, then, must I do to be saved?” He cannot be put off, and he ought not to be put off, with a mere “You can do nothing.” This is not the Scripture answer… Such a response [by the seeker] may doubtless be nothing more than a theoretical difficulty raised by the sinner as an excuse for not obeying the command of God. In such a case it is enough, in reply to it, to point out that at bottom it is a cavil. The command to believe is explicit. And the object of faith is most winningly presented to the mind and heart. Our obvious duty is to believe: and if we do not do so the responsibility rests upon us. That we cannot do so is the result and index of our sinfulness. Inability is a sinful condition of the will, and the sole reason why a man cannot believe is that he is so exceedingly sinful that such a one as he cannot use his will for believing. He cannot will to do it because he loves sin too much. For such a “cannot” he is certainly responsible. … 1. Something may be done toward removing the difficulty by pointing out the nature of the puzzle into which the mind has fallen. The puzzle is a logical one, and concerns doctrine, not action; and it must not be permitted to stand as an obstacle to action. Regeneration is not a fact of experience [not self-consciously experienced], but an inference from experience; and inability is not a ground of quiescence [not acting], but an inference from quiescence [not acting]. It passes away in regeneration; and no one can know that it is gone save by the change in activity. We reason back from our experience and call in the doctrine of inability to explain our actual conduct, and that of regeneration to explain the gulf between our conduct of yesterday and today. But that gulf is revealed in consciousness only by action. No man can know, then, whether he is unable save [except] by striving to act. We may point out, therefore, that the doctrine of inability does not affirm that we cannot believe, but only that we cannot believe in our own strength within us by which we may attain to belief. But this is far from asserting that on making the effort we shall find it impossible to believe. We may believe, in God’s strength…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“One of the most difficult questions which the seeker after souls has to meet arises out of the doctrine of Inability. “What, then, must I do to be saved?” He cannot be put off, and he ought not to be put off, with a mere “You can do nothing.” This is not the Scripture answer… Such a response [by the seeker] may doubtless be nothing more than a theoretical difficulty raised by the sinner as an excuse for not obeying the command of God. In such a case it is enough, in reply to it, to point out that at bottom it is a cavil. The command to believe is explicit. And the object of faith is most winningly presented to the mind and heart. Our obvious duty is to believe: and if we do not do so the responsibility rests upon us. That we cannot do so is the result and index of our sinfulness. Inability is a sinful condition of the will, and the sole reason why a man cannot believe is that he is so exceedingly sinful that such a one as he cannot use his will for believing. He cannot will to do it because he loves sin too much. For such a “cannot” he is certainly responsible. … 1. Something may be done toward removing the difficulty by pointing out the nature of the puzzle into which the mind has fallen. The puzzle is a logical one, and concerns doctrine, not action; and it must not be permitted to stand as an obstacle to action. Regeneration is not a fact of experience [not self-consciously experienced], but an inference from experience; and inability is not a ground of quiescence [not acting], but an inference from quiescence [not acting]. It passes away in regeneration; and no one can know that it is gone save by the change in activity. We reason back from our experience and call in the doctrine of inability to explain our actual conduct, and that of regeneration to explain the gulf between our conduct of yesterday and today. But that gulf is revealed in consciousness only by action. No man can know, then, whether he is unable save [except] by striving to act. We may point out, therefore, that the doctrine of inability does not affirm that we cannot believe, but only that we cannot believe in our own strength within us by which we may attain to belief. But this is far from asserting that on making the effort we shall find it impossible to believe. We may believe, in God’s strength…”

— B. B. Warfield, ‘Inability &amp; the Demand of Faith’ in Selected Shorter Writings, ed. John Meeter, vol. 2, pp. 725-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COne+of+the+most+difficult+questions+which+the+seeker+after+souls+has+to+meet+arises+out+of+the+doctrine+of+Inability.+%E2%80%9CWhat%2C+then%2C+must+I+do+to+be+saved%3F%E2%80%9D+He+cannot+be+put+off%2C+and+he+ought+not+to+be+put+off%2C+with+a+mere+%E2%80%9CYou+can+do+nothing.%E2%80%9D+This+is+not+the+Scripture+answer%E2%80%A6+Such+a+response+%5Bby+the+seeker%5D+may+doubtless+be+nothing+more+than+a+theoretical+difficulty+raised+by+the+sinner+as+an+excuse+for+not+obeying+the+command+of+God.+In+such+a+case+it+is+enough%2C+in+reply+to+it%2C+to+point+out+that+at+bottom+it+is+a+cavil.+The+command+to+believe+is+explicit.+And+the+object+of+faith+is+most+winningly+presented+to+the+mind+and+heart.+Our+obvious+duty+is+to+believe%3A+and+if+we+do+not+do+so+the+responsibility+rests+upon+us.+That+we+cannot+do+so+is+the+result+and+index+of+our+sinfulness.+Inability+is+a+sinful+condition+of+the+will%2C+and+the+sole+reason+why+a+man+cannot+believe+is+that+he+is+so+exceedingly+sinful+that+such+a+one+as+he+cannot+use+his+will+for+believing.+He+cannot+will+to+do+it+because+he+loves+sin+too+much.+For+such+a+%E2%80%9Ccannot%E2%80%9D+he+is+certainly+responsible.+%E2%80%A6+1.+Something+may+be+done+toward+removing+the+difficulty+by+pointing+out+the+nature+of+the+puzzle+into+which+the+mind+has+fallen.+The+puzzle+is+a+logical+one%2C+and+concerns+doctrine%2C+not+action%3B+and+it+must+not+be+permitted+to+stand+as+an+obstacle+to+action.+Regeneration+is+not+a+fact+of+experience+%5Bnot+self-consciously+experienced%5D%2C+but+an+inference+from+experience%3B+and+inability+is+not+a+ground+of+quiescence+%5Bnot+acting%5D%2C+but+an+inference+from+quiescence+%5Bnot+acting%5D.+It+passes+away+in+regeneration%3B+and+no+one+can+know+that+it+is+gone+save+by+the+change+in+activity.+We+reason+back+from+our+experience+and+call+in+the+doctrine+of+inability+to+explain+our+actual+conduct%2C+and+that+of+regeneration+to+explain+the+gulf+between+our+conduct+of+yesterday+and+today.+But+that+gulf+is+revealed+in+consciousness+only+by+action.+No+man+can+know%2C+then%2C+whether+he+is+unable+save+%5Bexcept%5D+by+striving+to+act.+We+may+point+out%2C+therefore%2C+that+the+doctrine+of+inability+does+not+affirm+that+we+cannot+believe%2C+but+only+that+we+cannot+believe+in+our+own+strength+within+us+by+which+we+may+attain+to+belief.+But+this+is+far+from+asserting+that+on+making+the+effort+we+shall+find+it+impossible+to+believe.+We+may+believe%2C+in+God%E2%80%99s+strength%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+B.+B.+Warfield%2C+%E2%80%98Inability+%26+the+Demand+of+Faith%E2%80%99+in+Selected+Shorter+Writings%2C+ed.+John+Meeter%2C+vol.+2%2C+pp.+725-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F418b349beb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/418b349beb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=One%20of%20the%20most%20difficult%20questions,We%20may%20believe%2C%20in%20God%E2%80%99s%20strength&amp;text=One%20of%20the%20most%20difficult%20questions%20which%20the&amp;text=to%20believe.%20We%20may%20believe%2C%20in%20God%E2%80%99s%20strength" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

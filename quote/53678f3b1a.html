<main class="wrap"><figure class="quote" id="q-53678f3b1a" data-kw="">
<blockquote><p>You naturally dwell on the joy of the Sabbath. This is the day of gladness and triumph, on which the Lord broke the bonds of the grave, abolishing death and bringing life and immortality to light.

As naturally you dwell on the value of the Sabbath. This is the day on which the tired body rests from its appointed labour; on which the worn spirit finds opportunity for recuperation; an oasis in the desert of earthly cares, when we can escape for a moment from the treadmill toil of daily life and, at leisure from ourselves, refresh our souls in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Foundations of the Sabbath in the Word of God in Duncan J. McMillan, et al</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bcef8abf1" data-kw="">
<blockquote><p>Whenever someone has a serious problem and they look to other people for help, they often get told that “everything is going to be fine.” The Church of Ireland theologian, George Salmon (1819-1904) notes that to do so is to heal the wounds of others lightly:

Such comforting assurances are often easily given because they cost so little. They relieve him who makes them from the burden of a painful demand on him for sympathy. One is not always in the mood to mourn with those who mourn, or even to seem to mourn, and so it is pleasant to be able to persuade oneself that the need for such an effort has not arisen and may never arise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cathedral and University Sermons</cite>, (2nd edn, London: John Murray, 1901), p. 137.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-b26669486a" data-kw="Mary">
<blockquote><p>As at other times, he put a comparative neglect upon his mother, which seemed purposely designed to obviate the extravagant respect which men in aftertimes would be apt to pay her. Our respect ought to be guided and governed by Christ&#x27;s; now the virgin Mary, or Christ&#x27;s mother, is not equalled with, but postponed to, ordinary believers, on whom Christ here puts a superlative honour.</p></blockquote>

</figure><figure class="quote" id="q-160d84e036" data-kw="">
<blockquote><p>Concerning the Worship of God We call upon God in Spirit and in truth, in true faith, in accordance with the Word of the Lord in Christ Jesus, and worship Him inwardly and outwardly with the deeds commanded by God. For God is not worshipped by human doctrines, mandates, and works, but only by those which He Himself commands and effects by His Holy Spirit through faith and the Word (John 4; Matt. 5; Isa. 29; Rom. 14). We, therefore, confess that the worship of God is the work commanded by God, performed by the Holy Spirit in the elect, with confidence in the Mediator, in Spirit and in truth that we should obey God, celebrate, and acknowledge God (Rom. 12). So the fathers and the councils teach (Ex. 34; Matt. 4; Deut. 6).</p></blockquote>

</figure><figure class="quote" id="q-eac74c1668" data-kw="">
<blockquote><p>The difference between Augustine and Pelagius, Calvin or Castellio, Gomarus and Arminius is not that the latter were that much more gentle, loving, and tenderhearted than the former. On the contrary, it arises from the fact that the former accepted Scripture in its entirety, also including this doctrine; that they were and always wanted to be theistic and recognize the will and hand of the Lord also in these disturbing facts of life; that they were not afraid to look reality in the eye even when it was appalling. Pelagianism scatters flowers over graves, turns death into an angel, regards sin as mere weakness, lectures on the uses of adversity, and considers this the best possible world. Calvinism has no use for such drivel. It refuses to be hoodwinked. It tolerates no such delusion, takes full account of the seriousness of life, champions the rights of the Lord of lords, and humbly bows in adoration before the inexplicable sovereign will of God Almighty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 2, trans. John Bolt and John Vriend (Grand Rapids: Baker Academic, 2004), 394.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>For the Kirk ought to be no more severe than God declares Himself to be, who witnesses that in whatsoever hour a sinner unfeignedly repents, and turns from his wicked way, that he will not remember one of his iniquities: And therefore ought the Kirk diligently to advert that it excommunicate not those whom God absolves.</p></blockquote>

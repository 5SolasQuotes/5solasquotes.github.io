<main class="wrap"><figure class="quote" id="q-230f143a6a" data-kw="debt enmity crime">
<blockquote><p>Sin, which renders us guilty and hated of God and binds us over as debtors to punishment, may be viewed under a threefold relation either as a debt, which we are bound to pay to divine justice; or as enmity, inasmuch as it makes us enemies to God and God to us; or as a crime, on account of which we are exposed to condemnation and death. Corresponding to these, satisfaction ought to be a payment of debt, a reconciliation with God, and a propitiatory covering of the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.6b</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9efed039d" data-kw="debt enmity crime satisfaction">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.6</span></figcaption>

</figure><figure class="quote" id="q-d5bb7e8c5d" data-kw="">
<blockquote><p>In the past, God had left sins unpunished. He could conceivably be accused of overlooking sin since He had not required punishment for it. Now, however, He has put forth Jesus. This proves that God is just (His wrath required the sacrifice) and that He is the justifier of those who have faith in Jesus (His love provided the sacrifice for them).</p></blockquote>

</figure><figure class="quote" id="q-98ebf40a4f" data-kw="">
<blockquote><p>In reference to grateful love, nothing so much tends to fill the heart with this emotion as the believing realization of Christ’s redemption work—nothing so melts the heart; and no purer love to God can be imbibed. … There is no motive to a holy life so powerful and efficacious as that which is drawn from the propitiatory work of Christ, who, after meeting the demands of the law and bearing its curse, makes that same law a rule to direct our steps; and Christians learn to take it from the Mediator’s hand.</p></blockquote>

</figure><figure class="quote" id="q-336b7d6c39" data-kw="true priest on earth against Socinians">

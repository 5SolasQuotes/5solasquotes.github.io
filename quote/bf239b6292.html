<main class="wrap"><figure class="quote" id="q-bf239b6292" data-kw="Mary|Queen of Heaven|Mediator|Idolatry|Invocation of saints" data-pol="mary|images-and-idolatry|saints">
<blockquote><p>Yes, they transform some of them into detestable idols, making them in truth mediators of redemption, especially the virgin Mary, whom they call &quot;a Lady, a Goddess, a Queen, whom Christ her Son obeys in heaven, a mediatress: or life, hope, the medicine of the diseased.&quot;</p></blockquote>
<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, An Advertisement to all Favorers of the Roman Religion</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fecc17f84e" data-kw="Mary|Mediator|Invocation of saints|Idolatry" data-pol="mary|saints|images-and-idolatry">
<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>
<figcaption>— <a href="../authors/albert-barnes.html">Albert Barnes</a>, <cite>Notes on the Bible</cite>, 1 Timothy 2:5</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../topics/christian-life/prayer.html">Prayer</a><a class="tag" href="../topics/worship/public-worship.html">Public Worship</a><a class="tag" href="../topics/polemics/rome-saints.html">Rome: Saints</a><a class="tag" href="../topics/polemics/rome-images.html">Rome: Images &amp; Idolatry</a><a class="tag" href="../topics/worship/idolatry.html">Idolatry</a><a class="tag" href="../topics/person-of-christ/mediator.html">The Mediator</a></div>

</figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary|Mediator|Invocation of saints" data-pol="mary|saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption>— <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ (1558)</cite></figcaption>

</figure><figure class="quote" id="q-b48112252c" data-kw="Mary|Queen of Heaven|Mediator" data-pol="mary">
<blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote>
<figcaption>— <a href="../authors/theodore-beza.html">Theodore Beza</a>, <cite>A Brief and Pithy Sum of Christian Faith (Confession, 1560)</cite>, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</figcaption>

</figure><figure class="quote" id="q-4b4b91c99a" data-kw="Mary|Invocation of saints|Mediator" data-pol="mary|saints">

<main class="wrap"><figure class="quote" id="q-3812c4716e" data-kw="">
<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land… they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-sharp.html">James Sharp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Representation of the Rise, Progress &amp; State of the Present Divisions of the Church of Scotland</cite>, (London, 1657), p. 33</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-be9a039965" data-kw="">
<blockquote><p>…distinguishing the Church from Antichrist and his worship brought into the Church, and added to the ordinances thereof for obscuring the worship of Christ… yet is the Temple and Church now different from his additions, as the Temple of the Jews was from the corruptions that were accidentally brought in upon it in the times of corruption. Thus, the Word of God, sacraments, prayer, ordination, etc. are continued, which are as the material worship of God, and, as such, are not Antichristian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh: Higgins, 1658), Lecture 5, on ch., 11:15-19</span></figcaption>

</figure><figure class="quote" id="q-1160723795" data-kw="">
<blockquote><p>Some worship God with their good meaning, some with their good dealing, some with the babbling of a few words, as namely, of the Apostles Creed, and Ten Commandments for prayers. This service of God is very common, but alas, it is poor service. For the rule of divine honor is not the will of him that honors, but the will of Him which is honored. Secondly, here we learn to detest the service and worship which is performed to God in the Church of Rome. For it contains many parts and points of will-worship, having no warrant from God, either by commandment or promise. . . . For these and many other practices, let them bring forth the Word of God, if they can. They plead for many things, that they have the word of traditions. I answer, that traditions ecclesiastical are no word of God, but the word of man. And traditions which are called apostolical, are either of no moment, or doubtful. For how shall we know certainly, that they were the traditions of the apostles, considering none has said so, but some of the Fathers, whose testimonies are not sufficient, because they are subject to error?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (1626), vol. 1, p. 699.</span></figcaption>

subject%20to%20error&amp;text=Some%20worship%20God%20with%20their%20good%20meaning%2C%20some&amp;text=not%20sufficient%2C%20because%20they%20are%20subject%20to%20error" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…but it [instituted worship] concerns those outward ways and means whereby God has appointed that faith, and love, and fear of Him to be exercised and expressed unto his glory. And this kind of worship, though it depend not upon the nature of God, but upon his free and arbitrary disposal, and so was of old liable unto alterations, yet God did ever strictly require in the several states and conditions that his Church has gone through in the world. And this is that, which most commonly in the Scripture is called by the name of the worship of God; as that whereby all the acceptable actings of the souls of men towards him are expressed, and the only way of owning and acknowledging Him in the world, as also of entertaining a visible intercourse with Him. This therefore He calls for, and requires indispensibly of all that draw nigh to Him, and that because He is the Lord our God, Rev. 14:6-7; Mt. 4:10; Dt. 10:12-13. For his observance hereof does He so approve of Abraham, Gen. 18:19, and sets it down as an everlasting Law unto all others that in a holy observation thereof He will be sanctified in all that draw nigh unto Him, Lev. 10:1-3. His commands also concerning it are multiplyed in the Scripture, with the approbation of all those that attend unto them. We may not think to find acceptance with God or to inherit the promises, if supposing ourselves to adhere unto Him in worship internal and natural, we neglect that which is external and of his free appointment: for besides, that we renounce thereby our inward dependance on Him also in not observing his commands, as Adam did in transgressing an institution, we become wholly useless unto all the ends of his glory in the world, which is not the way to come to an enjoyment of Him. Neither do we only express and profess our inward moral, natural worship of God hereby, by which means it becomes the principal way and instrument of faith and trust exerting themselves in our obedience, but also it is a most effectual help and assistance unto the principle of that natural worship, strengthening the habit of it, and exciting it unto all suitable actings, unto its increase and growth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667) | Question 1, pp. 2-4</span></figcaption>

<blockquote><p>But the sun has the highest, best and most burningly glorious characteristics of all.” But there are a whole lotta good things it can’t do, which others can; the moon is more elegant, the stars sparkling, the cool wind refreshing and waddling baby skunks are really cute. When there’s no Christian liberty judgmentalism is the norm. Hypocrisies become glaring; straining at gnats is glorified while camels get swallowed. One can’t use the sacred lingo except in approving ways (otherwise it hurts the group’s ideals, image and cause, which is tantamount to sacrilege). With a bit of time the ideals of the leader are basically the ideals of the group. The very epitomy of the most desirable balance of this best spiritual life is the leader; his godly characteristics are not just a pattern in the church, but the mold. If the leaders don’t see it this way, most of the people do. He doesn’t seem to have any faults; he never mentions any (except for petty faults hardly considered sins). Any other balance than his is seen as less godly or good. The reason why the expectations never end is because he (or they) are trying to mold you to be like him, or them. The rising leaders are replicas of him, or try to be; you notice similar lingo, mannerisms, choices, imaging, etc. He is pleased they are following the best way (his). The elders always support his ideas. He has persuaded his closer colleagues of his same principles (distinctives). They are either his adoring fans or the same indistinguishable front with him. If you’re not fully on board with all these choices you probably feel like a bit of a second class citizen, passed over, inferior or a sandbag. What do you make of the Holy Spirit’s words in Eccl. 7:16: “Be not righteous over much; neither make thyself over wise: why shouldest thou destroy thyself?” They have only ever referenced this verse in a diminuitive way. . Pressure to do what You’re Not Comfortable with Manipulation is a near-universal characteristic of cultic groups, but it’s not most basic. Why do persons manipulate? To get you to do something you’re not comfortable with. You see all the fronted reasons they put forth, but they don’t add up. Why all the pressure? They won’t reveal their real reasons, but why not? If you knew them, you wouldn’t do it. They don’t see natural boundaries (Lk. 11:5-7) themselves and their view of you doesn’t take natural boundaries or your conscience into account (otherwise known as ‘respect’), because they are blinded by their principles. Hence they don’t believe you have a right to these boundaries. That is why the teeth of the bear-trap only dig deeper and further in. The only justification you need is, “I’m not comfortable with that.” You are not to do things apart from your faith that it’s right and with a sure conscience before the Lord: “Whatsoever is not of faith is sin,” (Rom. 14:23). For them to pressure you, or counsel, instruct or command you to do it anyway, without satisfying your reasons and conscience to your satisfaction, is to pressure you to sin, which is sinful of them. If you give your reasons and they minimize or dismiss them without satisfying them, and still pressure you, whatever they want you to do (especially if it means stepping into what may be a bear-trap), do not do it. If this is a pattern of their behavior, you are talking to a cultic person or cult leaders. If they won’t listen to you but give you the most spiritual reasons for doing what you’re not comfortable with, quoting Scriptures, citing Church authority, the elders’ great wisdom, etc. etc. you are being brainwashed and now know how and why most people around you can go along with this. The likely reason they won’t give you straight-forward satisfying reasons is because they are keeping from you not only the real reasons, but what will occur if you comply (which you can be sure you will not be comfortable with). They may speak softly, humbly and seek your agreement beforehand; if you backout, you had agreed to it, and their proceedings are legitimized. Don’t trust people that won’t tell you what they’re doing (especially when they won’t send you ahead of time an outline of what is to be “discussed” at the meeting). If they can have witnesses, but you can’t (“We just want to visit with you alone;” “Sorry but that’s not how we do things;” “There’s no need for that”), you already have years of psychological friendship with abusers, and your default inclination is to stay with them. If they are always asking you to accommodate and compromise with them, but they never accomodate you, you are already cooperating with and on the path of “equity rescuing” (see the Intro above). If you provide terms upon which you can safely communicate and interact with them, and they dismiss this, still claiming you are obliged to do something you are not comfortable with, they are telling you expressly: “We are a cult.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But the sun has the highest, best and most burningly glorious characteristics of all.” But there are a whole lotta good things it can’t do, which others can; the moon is more elegant, the stars sparkling, the cool wind refreshing and waddling baby skunks are really cute. When there’s no Christian liberty judgmentalism is the norm. Hypocrisies become glaring; straining at gnats is glorified while camels get swallowed. One can’t use the sacred lingo except in approving ways (otherwise it hurts the group’s ideals, image and cause, which is tantamount to sacrilege). With a bit of time the ideals of the leader are basically the ideals of the group. The very epitomy of the most desirable balance of this best spiritual life is the leader; his godly characteristics are not just a pattern in the church, but the mold. If the leaders don’t see it this way, most of the people do. He doesn’t seem to have any faults; he never mentions any (except for petty faults hardly considered sins). Any other balance than his is seen as less godly or good. The reason why the expectations never end is because he (or they) are trying to mold you to be like him, or them. The rising leaders are replicas of him, or try to be; you notice similar lingo, mannerisms, choices, imaging, etc. He is pleased they are following the best way (his). The elders always support his ideas. He has persuaded his closer colleagues of his same principles (distinctives). They are either his adoring fans or the same indistinguishable front with him. If you’re not fully on board with all these choices you probably feel like a bit of a second class citizen, passed over, inferior or a sandbag. What do you make of the Holy Spirit’s words in Eccl. 7:16: “Be not righteous over much; neither make thyself over wise: why shouldest thou destroy thyself?” They have only ever referenced this verse in a diminuitive way. . Pressure to do what You’re Not Comfortable with Manipulation is a near-universal characteristic of cultic groups, but it’s not most basic. Why do persons manipulate? To get you to do something you’re not comfortable with. You see all the fronted reasons they put forth, but they don’t add up. Why all the pressure? They won’t reveal their real reasons, but why not? If you knew them, you wouldn’t do it. They don’t see natural boundaries (Lk. 11:5-7) themselves and their view of you doesn’t take natural boundaries or your conscience into account (otherwise known as ‘respect’), because they are blinded by their principles. Hence they don’t believe you have a right to these boundaries. That is why the teeth of the bear-trap only dig deeper and further in. The only justification you need is, “I’m not comfortable with that.” You are not to do things apart from your faith that it’s right and with a sure conscience before the Lord: “Whatsoever is not of faith is sin,” (Rom. 14:23). For them to pressure you, or counsel, instruct or command you to do it anyway, without satisfying your reasons and conscience to your satisfaction, is to pressure you to sin, which is sinful of them. If you give your reasons and they minimize or dismiss them without satisfying them, and still pressure you, whatever they want you to do (especially if it means stepping into what may be a bear-trap), do not do it. If this is a pattern of their behavior, you are talking to a cultic person or cult leaders. If they won’t listen to you but give you the most spiritual reasons for doing what you’re not comfortable with, quoting Scriptures, citing Church authority, the elders’ great wisdom, etc. etc. you are being brainwashed and now know how and why most people around you can go along with this. The likely reason they won’t give you straight-forward satisfying reasons is because they are keeping from you not only the real reasons, but what will occur if you comply (which you can be sure you will not be comfortable with). They may speak softly, humbly and seek your agreement beforehand; if you backout, you had agreed to it, and their proceedings are legitimized. Don’t trust people that won’t tell you what they’re doing (especially when they won’t send you ahead of time an outline of what is to be “discussed” at the meeting). If they can have witnesses, but you can’t (“We just want to visit with you alone;” “Sorry but that’s not how we do things;” “There’s no need for that”), you already have years of psychological friendship with abusers, and your default inclination is to stay with them. If they are always asking you to accommodate and compromise with them, but they never accomodate you, you are already cooperating with and on the path of “equity rescuing” (see the Intro above). If you provide terms upon which you can safely communicate and interact with them, and they dismiss this, still claiming you are obliged to do something you are not comfortable with, they are telling you expressly: “We are a cult.”

— Cultic Characteristics, Spiritual Legalism">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+sun+has+the+highest%2C+best+and+most+burningly+glorious+characteristics+of+all.%E2%80%9D+But+there+are+a+whole+lotta+good+things+it+can%E2%80%99t+do%2C+which+others+can%3B+the+moon+is+more+elegant%2C+the+stars+sparkling%2C+the+cool+wind+refreshing+and+waddling+baby+skunks+are+really+cute.+When+there%E2%80%99s+no+Christian+liberty+judgmentalism+is+the+norm.+Hypocrisies+become+glaring%3B+straining+at+gnats+is+glorified+while+camels+get+swallowed.+One+can%E2%80%99t+use+the+sacred+lingo+except+in+approving+ways+%28otherwise+it+hurts+the+group%E2%80%99s+ideals%2C+image+and+cause%2C+which+is+tantamount+to+sacrilege%29.+With+a+bit+of+time+the+ideals+of+the+leader+are+basically+the+ideals+of+the+group.+The+very+epitomy+of+the+most+desirable+balance+of+this+best+spiritual+life+is+the+leader%3B+his+godly+characteristics+are+not+just+a+pattern+in+the+church%2C+but+the+mold.+If+the+leaders+don%E2%80%99t+see+it+this+way%2C+most+of+the+people+do.+He+doesn%E2%80%99t+seem+to+have+any+faults%3B+he+never+mentions+any+%28except+for+petty+faults+hardly+considered+sins%29.+Any+other+balance+than+his+is+seen+as+less+godly+or+good.+The+reason+why+the+expectations+never+end+is+because+he+%28or+they%29+are+trying+to+mold+you+to+be+like+him%2C+or+them.+The+rising+leaders+are+replicas+of+him%2C+or+try+to+be%3B+you+notice+similar+lingo%2C+mannerisms%2C+choices%2C+imaging%2C+etc.+He+is+pleased+they+are+following+the+best+way+%28his%29.+The+elders+always+support+his+ideas.+He+has+persuaded+his+closer+colleagues+of+his+same+principles+%28distinctives%29.+They+are+either+his+adoring+fans+or+the+same+indistinguishable+front+with+him.+If+you%E2%80%99re+not+fully+on+board+with+all+these+choices+you+probably+feel+like+a+bit+of+a+second+class+citizen%2C+passed+over%2C+inferior+or+a+sandbag.+What+do+you+make+of+the+Holy+Spirit%E2%80%99s+words+in+Eccl.+7%3A16%3A+%E2%80%9CBe+not+righteous+over+much%3B+neither+make+thyself+over+wise%3A+why+shouldest+thou+destroy+thyself%3F%E2%80%9D+They+have+only+ever+referenced+this+verse+in+a+diminuitive+way.+.+Pressure+to+do+what+You%E2%80%99re+Not+Comfortable+with+Manipulation+is+a+near-universal+characteristic+of+cultic+groups%2C+but+it%E2%80%99s+not+most+basic.+Why+do+persons+manipulate%3F+To+get+you+to+do+something+you%E2%80%99re+not+comfortable+with.+You+see+all+the+fronted+reasons+they+put+forth%2C+but+they+don%E2%80%99t+add+up.+Why+all+the+pressure%3F+They+won%E2%80%99t+reveal+their+real+reasons%2C+but+why+not%3F+If+you+knew+them%2C+you+wouldn%E2%80%99t+do+it.+They+don%E2%80%99t+see+natural+boundaries+%28Lk.+11%3A5-7%29+themselves+and+their+view+of+you+doesn%E2%80%99t+take+natural+boundaries+or+your+conscience+into+account+%28otherwise+known+as+%E2%80%98respect%E2%80%99%29%2C+because+they+are+blinded+by+their+principles.+Hence+they+don%E2%80%99t+believe+you+have+a+right+to+these+boundaries.+That+is+why+the+teeth+of+the+bear-trap+only+dig+deeper+and+further+in.+The+only+justification+you+need+is%2C+%E2%80%9CI%E2%80%99m+not+comfortable+with+that.%E2%80%9D+You+are+not+to+do+things+apart+from+your+faith+that+it%E2%80%99s+right+and+with+a+sure+conscience+before+the+Lord%3A+%E2%80%9CWhatsoever+is+not+of+faith+is+sin%2C%E2%80%9D+%28Rom.+14%3A23%29.+For+them+to+pressure+you%2C+or+counsel%2C+instruct+or+command+you+to+do+it+anyway%2C+without+satisfying+your+reasons+and+conscience+to+your+satisfaction%2C+is+to+pressure+you+to+sin%2C+which+is+sinful+of+them.+If+you+give+your+reasons+and+they+minimize+or+dismiss+them+without+satisfying+them%2C+and+still+pressure+you%2C+whatever+they+want+you+to+do+%28especially+if+it+means+stepping+into+what+may+be+a+bear-trap%29%2C+do+not+do+it.+If+this+is+a+pattern+of+their+behavior%2C+you+are+talking+to+a+cultic+person+or+cult+leaders.+If+they+won%E2%80%99t+listen+to+you+but+give+you+the+most+spiritual+reasons+for+doing+what+you%E2%80%99re+not+comfortable+with%2C+quoting+Scriptures%2C+citing+Church+authority%2C+the+elders%E2%80%99+great+wisdom%2C+etc.+etc.+you+are+being+brainwashed+and+now+know+how+and+why+most+people+around+you+can+go+along+with+this.+The+likely+reason+they+won%E2%80%99t+give+you+straight-forward+satisfying+reasons+is+because+they+are+keeping+from+you+not+only+the+real+reasons%2C+but+what+will+occur+if+you+comply+%28which+you+can+be+sure+you+will+not+be+comfortable+with%29.+They+may+speak+softly%2C+humbly+and+seek+your+agreement+beforehand%3B+if+you+backout%2C+you+had+agreed+to+it%2C+and+their+proceedings+are+legitimized.+Don%E2%80%99t+trust+people+that+won%E2%80%99t+tell+you+what+they%E2%80%99re+doing+%28especially+when+they+won%E2%80%99t+send+you+ahead+of+time+an+outline+of+what+is+to+be+%E2%80%9Cdiscussed%E2%80%9D+at+the+meeting%29.+If+they+can+have+witnesses%2C+but+you+can%E2%80%99t+%28%E2%80%9CWe+just+want+to+visit+with+you+alone%3B%E2%80%9D+%E2%80%9CSorry+but+that%E2%80%99s+not+how+we+do+things%3B%E2%80%9D+%E2%80%9CThere%E2%80%99s+no+need+for+that%E2%80%9D%29%2C+you+already+have+years+of+psychological+friendship+with+abusers%2C+and+your+default+inclination+is+to+stay+with+them.+If+they+are+always+asking+you+to+accommodate+and+compromise+with+them%2C+but+they+never+accomodate+you%2C+you+are+already+cooperating+with+and+on+the+path+of+%E2%80%9Cequity+rescuing%E2%80%9D+%28see+the+Intro+above%29.+If+you+provide+terms+upon+which+you+can+safely+communicate+and+interact+with+them%2C+and+they+dismiss+this%2C+still+claiming+you+are+obliged+to+do+something+you+are+not+comfortable+with%2C+they+are+telling+you+expressly%3A+%E2%80%9CWe+are+a+cult.%E2%80%9D%0A%0A%E2%80%94+Cultic+Characteristics%2C+Spiritual+Legalism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F815a30f56e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/815a30f56e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cults/#:~:text=But%20the%20sun%20has%20the%20highest,you%20expressly%3A%20%E2%80%9CWe%20are%20a%20cult&amp;text=But%20the%20sun%20has%20the%20highest%2C%20best%20and&amp;text=are%20telling%20you%20expressly%3A%20%E2%80%9CWe%20are%20a%20cult" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

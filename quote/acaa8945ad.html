<main class="wrap"><figure class="quote" id="q-acaa8945ad" data-kw="">
<blockquote><p>Strange as it may sound, it is true, that many—perhaps the majority—of those who feed their souls on this great declaration, seem to have trained themselves to think, when it falls upon their ears, in the first instance at least, not so much of how great, how immeasurably great, God’s love is, as rather of how great the world is. It is the world that God loves, they say,—the world: and forthwith they fall to thinking how great the world is, and how, nevertheless, God loves it all. Think, they cry, of the multitudes of men that swarm over the face of the earth; and have swarmed over it through all the countless generations from the beginning; and will swarm over it in ever-increasing numbers through perhaps even more countless generations yet to come, until the end: and God loves them all, each and every one of them, from the least to the greatest; so loves them that He has given His only begotten Son to die for them, for each and every one of them—and for each and every one of them with the same intent,—the intent, namely, that he may be saved. oh how great the love of God must be to embrace in its compass these uncounted multitudes of men; and so to embrace them that every individual that enters as a constituent unit into the mass of mankind receives his full share of it, or rather is inundated by its undivided and undiminished flood! Certainly this is a great conception. But it is just as certainly not a great enough conception to meet the requirements of our text . . . . . . We discover, then, that the distribution of the term “world” in our text into “each and every man” in the world not only begins with the obvious misstep of directing our attention at once rather to the greatness of the world than to the greatness of God’s love and only infers the latter from the former; but ends by positively belittling the love of God, as if it could content itself with half-measures,—nay, in numerous instances, with what is practically no measure at all. For if it is satisfied with merely opening a way of salvation and leaving men to walk in this way or not as they list, the hard facts of life force us to add that it is satisfied with merely opening a way of salvation for multitudes to whom it should never be made known that a way of salvation lay open before them, although their sole hope lies in their walking in it. The text is given to enhance in our hearts the conception of the love of God to sinners: to make us to know somewhat of the height and depth and length and breadth of it, though truly is passes knowledge. It will not do, then, as we read it to throw limitations around this love, as if it could not accomplish that whereto it is set.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saviour of the World</cite>, (Bellingham, WA: Logos Bible Software, 2008), 103–105, 108, 111.</span></figcaption>

<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject. I think that the word world, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>

<blockquote><p>[Margin:] (What mercy is in God: Miseri cordia est voluntas Dei qua ad succurrendum miseris et propensus [Mercy is the will of God by which He is inclined to succor the miserable.]; [Johannes] Sharpius. The mercy of God some call the property or attribute of his nature, inclining Him to relieve the misery of his creature; some the essence of God showing mercy. [William] Sclater on the 117th Psalm: Ira dicitur esse in Deo non ut turbidus motus animi sed simplex voluntas ad ultionem.) But mercy in God is his very essence whereby He is infinitely disposed to help succour and comfort such as be in any miserable condition. Those expressions in Scripture: ‘In their afflictions He was afflicted’; and ‘Mine heart is turned within Me, my repentings are kindled together,’ are borrowed phrases, as from the turning of the bowels in men at the sight of an object of pity. And yet in men this is not mercy itself but a companion of pity. Yet because by it our mercy is made known, we call it by the name of ‘mercy’. We call rolling of bowels mercy, and mercy rolling of bowels, which yet is but a companion of it, and that in men only and not in God. Mercy may be without it, and in God always is; because God has no bowels to be turned, God is one most simple essence, and has no qualities. And therefore when we say God is merciful, we speak of Him metaphorically, as when we say God is angry. Anger is a turbulency of spirit, but there is no such thing in God. The effects of that which is called anger in God are often put for anger: as when we see the punishment and scourges on the backs of wicked men we conclude that God is angry. In like manner when we see the [hurtful] rod taken of and cast into the fire (which is an effect of mercy) we say God is merciful. But mercy in God signifies two things: First, an inclination in his heavenly Majesty to show mercy. Secondly, the effects of his supposed affection, which is his helping of the miserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Margin:] (What mercy is in God: Miseri cordia est voluntas Dei qua ad succurrendum miseris et propensus [Mercy is the will of God by which He is inclined to succor the miserable.]; [Johannes] Sharpius. The mercy of God some call the property or attribute of his nature, inclining Him to relieve the misery of his creature; some the essence of God showing mercy. [William] Sclater on the 117th Psalm: Ira dicitur esse in Deo non ut turbidus motus animi sed simplex voluntas ad ultionem.) But mercy in God is his very essence whereby He is infinitely disposed to help succour and comfort such as be in any miserable condition. Those expressions in Scripture: ‘In their afflictions He was afflicted’; and ‘Mine heart is turned within Me, my repentings are kindled together,’ are borrowed phrases, as from the turning of the bowels in men at the sight of an object of pity. And yet in men this is not mercy itself but a companion of pity. Yet because by it our mercy is made known, we call it by the name of ‘mercy’. We call rolling of bowels mercy, and mercy rolling of bowels, which yet is but a companion of it, and that in men only and not in God. Mercy may be without it, and in God always is; because God has no bowels to be turned, God is one most simple essence, and has no qualities. And therefore when we say God is merciful, we speak of Him metaphorically, as when we say God is angry. Anger is a turbulency of spirit, but there is no such thing in God. The effects of that which is called anger in God are often put for anger: as when we see the punishment and scourges on the backs of wicked men we conclude that God is angry. In like manner when we see the [hurtful] rod taken of and cast into the fire (which is an effect of mercy) we say God is merciful. But mercy in God signifies two things: First, an inclination in his heavenly Majesty to show mercy. Secondly, the effects of his supposed affection, which is his helping of the miserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.”

— Thomas Larkham, The Attributes of God Unfolded &amp; Applied... (London: Eglesfield, 1656) Larkham (1602–1669) was an English puritan clergyman and settler in New England., pp. 103-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BMargin%3A%5D+%28What+mercy+is+in+God%3A+Miseri+cordia+est+voluntas+Dei+qua+ad+succurrendum+miseris+et+propensus+%5BMercy+is+the+will+of+God+by+which+He+is+inclined+to+succor+the+miserable.%5D%3B+%5BJohannes%5D+Sharpius.+The+mercy+of+God+some+call+the+property+or+attribute+of+his+nature%2C+inclining+Him+to+relieve+the+misery+of+his+creature%3B+some+the+essence+of+God+showing+mercy.+%5BWilliam%5D+Sclater+on+the+117th+Psalm%3A+Ira+dicitur+esse+in+Deo+non+ut+turbidus+motus+animi+sed+simplex+voluntas+ad+ultionem.%29+But+mercy+in+God+is+his+very+essence+whereby+He+is+infinitely+disposed+to+help+succour+and+comfort+such+as+be+in+any+miserable+condition.+Those+expressions+in+Scripture%3A+%E2%80%98In+their+afflictions+He+was+afflicted%E2%80%99%3B+and+%E2%80%98Mine+heart+is+turned+within+Me%2C+my+repentings+are+kindled+together%2C%E2%80%99+are+borrowed+phrases%2C+as+from+the+turning+of+the+bowels+in+men+at+the+sight+of+an+object+of+pity.+And+yet+in+men+this+is+not+mercy+itself+but+a+companion+of+pity.+Yet+because+by+it+our+mercy+is+made+known%2C+we+call+it+by+the+name+of+%E2%80%98mercy%E2%80%99.+We+call+rolling+of+bowels+mercy%2C+and+mercy+rolling+of+bowels%2C+which+yet+is+but+a+companion+of+it%2C+and+that+in+men+only+and+not+in+God.+Mercy+may+be+without+it%2C+and+in+God+always+is%3B+because+God+has+no+bowels+to+be+turned%2C+God+is+one+most+simple+essence%2C+and+has+no+qualities.+And+therefore+when+we+say+God+is+merciful%2C+we+speak+of+Him+metaphorically%2C+as+when+we+say+God+is+angry.+Anger+is+a+turbulency+of+spirit%2C+but+there+is+no+such+thing+in+God.+The+effects+of+that+which+is+called+anger+in+God+are+often+put+for+anger%3A+as+when+we+see+the+punishment+and+scourges+on+the+backs+of+wicked+men+we+conclude+that+God+is+angry.+In+like+manner+when+we+see+the+%5Bhurtful%5D+rod+taken+of+and+cast+into+the+fire+%28which+is+an+effect+of+mercy%29+we+say+God+is+merciful.+But+mercy+in+God+signifies+two+things%3A+First%2C+an+inclination+in+his+heavenly+Majesty+to+show+mercy.+Secondly%2C+the+effects+of+his+supposed+affection%2C+which+is+his+helping+of+the+miserable+creature%2C+or+a+making+out+of+God+to+such+as+have+need+of+help+and+pity.+The+affection+of+mercy+in+men+is+known+by+that+grief+that+accompanies+it+%28Tanquam+a+nobis+notiori+vertus+ipsa+nomen+traxit%29%2C+but+such+a+companion+of+mercy+cannot+be+in+God.+O+mercy+is+a+glorious+attribute+of+God%2C+He+is+a+very+sea+of+mercy%2C+He+is+never+dry.+Amongst+men+he+that+is+fullest+of+pity+is+but+a+drop+of+it.+Their+pity+falls+infinitely+short+of+what+is+in+God.+And+this+mercy+of+God+is+either+general+to+all+his+creatures+or+special+unto+mankind+or+more+special+and+peculiar%3A+that+whereby+He+is+said+to+be+merciful+to+his+elect+unto+eternal+life+and+%5Bgives%5D+freedom+from+the+wrath+to+come.%E2%80%9D%0A%0A%E2%80%94+Thomas+Larkham%2C+The+Attributes+of+God+Unfolded+%26+Applied...+%28London%3A+Eglesfield%2C+1656%29+Larkham+%281602%E2%80%931669%29+was+an+English+puritan+clergyman+and+settler+in+New+England.%2C+pp.+103-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57dee6ee5a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57dee6ee5a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Margin%3A%5D%20%28What%20mercy%20is%20in%20God,freedom%20from%20the%20wrath%20to%20come&amp;text=Margin%3A%5D%20%28What%20mercy%20is%20in%20God%3A%20Miseri%20cordia&amp;text=and%20%5Bgives%5D%20freedom%20from%20the%20wrath%20to%20come" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

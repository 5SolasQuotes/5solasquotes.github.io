<blockquote><p>Question 11. What duties are done by the people? … (4.) Saying “amen” audibly to the blessing. … As for an audible pronouncing of “amen,” if the minds of them that pronounce it have been upon that which the minister uttered, and their hearts have given consent thereto, it comprises altogether as much as the minister has uttered. This is the only warrantable means for people to utter their minds in a congregation. It must, therefore, be uttered by everyone, altogether, so loud, as the minister may hear their consent, as well as they hear what he has uttered in their name. For the one is as requisite as the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification, 1641</cite>, pp. 3-4.</span></figcaption>

<blockquote><p>Virtually all of the orthodox systems cite a wide variety of texts–dicta probantia [proving texts]–which are intended for use, not crassly as proof texts for citation without exegesis, but as points of reference to the long-established results of the church’s exegetical tradition. The dicta probantia or proving texts serve not to circumvent study of the text but to indicate received interpretation leading from exegesis to doctrine.</p></blockquote>

<blockquote><p>While they [the Jews] had the tenth of their goods consecrated, these [Christians] on the other hand who have received freedom [from the Mosaic Law] assign all that they have to the uses of the Lord, cheerfully and freely giving them, and not in lesser portions only, as becomes men professing the hope of greater things.’ . . Start Here: Articles &amp; Book Articles Smyth, Thomas – The Parsimony of Professing Christians being Note A to The Rule &amp; Measure of Christian Charity in Works, vol. 7 American, southern presbyterian. Parsimony means an extreme unwillingness to spend money. Peck, Thomas – Moral Obligation of the Tithe (1890) in Miscellanies, vol. 1, pp. 146-57 Peck was an American, southern presbyterian.. He argues that while natural and Biblical principles morally obligate us to return a portion of our income to the service of the Lord, this does not obligate an exact amount of, or at least, 10% in the New Testament era. While this article is very valuable, yet throughout it Peck argues for Voluntaryism, which is contrary to the Establishment Principle of the Reformation.. This aspect of Peck’s article is not recommended. Balfour, William – The Establishment Principle Defended, pp. 126-34 (1873) Balfour was a minister in the Free Church of Scotland.. He here defends from Scripture the Reformation’s view of the Establishment Principle with regards to tithing. Balfour is here arguing against the Voluntary position of the Scottish United Presbyterian Church, with which Church the Free Church was considering union with in his time. The teaching of Scripture is clear. . Book Croteau, David – A Biblical &amp; Theological Analysis of Tithing: Toward a Theology of Giving in the New Covenant Era PhD dissertation (2005) 339 pp. Croteau brings out numerous, enlightening Biblical insights.. His historical survey on pp. 6-68 is very helpful, especially in documenting the tithing renewal that occurred in America during the late-1800’s and following.. Indispensable for further digging into the subject, especially for his citations of literature on the subject. . . Dictionary &amp; Encyclopedia Articles on the Biblical tithes 1800’s Smith, William – ‘Tithe’ in Dr. William Smith’s Dictionary of the Bible, Comprising its Antiquities, Biography, Geography &amp; Natural History, vol. 4 ed. H.B. Hackett &amp; Ezra Abbot (1871) ** ed. McClintock &amp; Strong – ‘Tithe’ in Cyclopedia of Biblical, Theological and Ecclesiastical Literature (1880) Davis, John D. – ‘Tithe’ in A Dictionary of the Bible (1898) . 1900’s Jewish Encyclopedia – ‘Tithe’ (1901-1906) ed. Orr, James – ‘Tithe’ in International Standard Bible Encyclopedia (1915 / 1939) . . Articles Theological &amp; Political 1500’s Bullinger, Henry – Tenth Sermon, pp. 486-500 in the Fifth Decade of The Decades 1550’s Bullinger (1504–1575) was a Swiss reformer, the successor of Zwingli as the head of the Zurich Church. ** Ursinus, Zacharias – p. 570 (bottom) of ‘The Fourth Commandment’ in Commentary on the Heidelberg Catechism trans. Williard, 3rd American ed. (1851) Ursinus (1534–1583) was a prominent German Reformed theologian. ** Vermigli, Peter Martyr – Pt. 4, ch. 13, ‘Of a Magistrate, &amp; of the Difference between Civil &amp; Ecclesiastical Power’, section 18-32 in Common Places (1583), pp. 235-45 Quote: “First we must understand that tithes in the old time pertained unto ceremonies, and that as well in Melchisedek as in the Levites: Because in either priesthood they were referred unto Christ, and either priesthood was in very deed a figure of Christ… But what signified the tenths in either priesthood? Truly they signified nothing else but that it behoved the old fathers to acknowledge that whatsoever they had came from Christ. By that ceremony, the people worshipped Christ Himself… Boniface says: “We receive the tithes of all laymen.” Ye take them indeed, but now that Christ is come, the paying of tithes is no more a ceremony as it was before the coming of Christ when by tithes men worshipped Christ which was to come in the flesh, and confessed that they ought unto Him, both themselves, and all that they had. After the very which manner they paid the first fruits of all that they had. Nevertheless our men in these days receive tithes: but by what law? Truly not by the ceremonial law, but by a moral Law: since it is requisite that the minister should be sustained by the people: (Mt. 10:10) For the laborer is worthy of his reward: And he which serves the Gospel ought to live by it. So then, whether stipends be paid unto ministers out of lands or out of houses, either in ready money or in tithes, it makes no matter so that they be not maintained dishonestly, but honestly. Indeed these rewards in some places do retain the old manner of tithes. Howbeit in many places they are not called tithes, but stipends or wages. And doubtless they be rather rewards which are due to the labors of ministers than tithes.</p></blockquote>

ime.+The+teaching+of+Scripture+is+clear.+.+Book+Croteau%2C+David+%E2%80%93+A+Biblical+%26+Theological+Analysis+of+Tithing%3A+Toward+a+Theology+of+Giving+in+the+New+Covenant+Era+PhD+dissertation+%282005%29+339+pp.+Croteau+brings+out+numerous%2C+enlightening+Biblical+insights..+His+historical+survey+on+pp.+6-68+is+very+helpful%2C+especially+in+documenting+the+tithing+renewal+that+occurred+in+America+during+the+late-1800%E2%80%99s+and+following..+Indispensable+for+further+digging+into+the+subject%2C+especially+for+his+citations+of+literature+on+the+subject.+.+.+Dictionary+%26+Encyclopedia+Articles+on+the+Biblical+tithes+1800%E2%80%99s+Smith%2C+William+%E2%80%93+%E2%80%98Tithe%E2%80%99+in+Dr.+William+Smith%E2%80%99s+Dictionary+of+the+Bible%2C+Comprising+its+Antiquities%2C+Biography%2C+Geography+%26+Natural+History%2C+vol.+4+ed.+H.B.+Hackett+%26+Ezra+Abbot+%281871%29+%2A%2A+ed.+McClintock+%26+Strong+%E2%80%93+%E2%80%98Tithe%E2%80%99+in+Cyclopedia+of+Biblical%2C+Theological+and+Ecclesiastical+Literature+%281880%29+Davis%2C+John+D.+%E2%80%93+%E2%80%98Tithe%E2%80%99+in+A+Dictionary+of+the+Bible+%281898%29+.+1900%E2%80%99s+Jewish+Encyclopedia+%E2%80%93+%E2%80%98Tithe%E2%80%99+%281901-1906%29+ed.+Orr%2C+James+%E2%80%93+%E2%80%98Tithe%E2%80%99+in+International+Standard+Bible+Encyclopedia+%281915+%2F+1939%29+.+.+Articles+Theological+%26+Political+1500%E2%80%99s+Bullinger%2C+Henry+%E2%80%93+Tenth+Sermon%2C+pp.+486-500+in+the+Fifth+Decade+of+The+Decades+1550%E2%80%99s+Bullinger+%281504%E2%80%931575%29+was+a+Swiss+reformer%2C+the+successor+of+Zwingli+as+the+head+of+the+Zurich+Church.+%2A%2A+Ursinus%2C+Zacharias+%E2%80%93+p.+570+%28bottom%29+of+%E2%80%98The+Fourth+Commandment%E2%80%99+in+Commentary+on+the+Heidelberg+Catechism+trans.+Williard%2C+3rd+American+ed.+%281851%29+Ursinus+%281534%E2%80%931583%29+was+a+prominent+German+Reformed+theologian.+%2A%2A+Vermigli%2C+Peter+Martyr+%E2%80%93+Pt.+4%2C+ch.+13%2C+%E2%80%98Of+a+Magistrate%2C+%26+of+the+Difference+between+Civil+%26+Ecclesiastical+Power%E2%80%99%2C+section+18-32+in+Common+Places+%281583%29%2C+pp.+235-45+Quote%3A+%E2%80%9CFirst+we+must+understand+that+tithes+in+the+old+time+pertained+unto+ceremonies%2C+and+that+as+well+in+Melchisedek+as+in+the+Levites%3A+Because+in+either+priesthood+they+were+referred+unto+Christ%2C+and+either+priesthood+was+in+very+deed+a+figure+of+Christ%E2%80%A6+But+what+signified+the+tenths+in+either+priesthood%3F+Truly+they+signified+nothing+else+but+that+it+behoved+the+old+fathers+to+acknowledge+that+whatsoever+they+had+came+from+Christ.+By+that+ceremony%2C+the+people+worshipped+Christ+Himself%E2%80%A6+Boniface+says%3A+%E2%80%9CWe+receive+the+tithes+of+all+laymen.%E2%80%9D+Ye+take+them+indeed%2C+but+now+that+Christ+is+come%2C+the+paying+of+tithes+is+no+more+a+ceremony+as+it+was+before+the+coming+of+Christ+when+by+tithes+men+worshipped+Christ+which+was+to+come+in+the+flesh%2C+and+confessed+that+they+ought+unto+Him%2C+both+themselves%2C+and+all+that+they+had.+After+the+very+which+manner+they+paid+the+first+fruits+of+all+that+they+had.+Nevertheless+our+men+in+these+days+receive+tithes%3A+but+by+what+law%3F+Truly+not+by+the+ceremonial+law%2C+but+by+a+moral+Law%3A+since+it+is+requisite+that+the+minister+should+be+sustained+by+the+people%3A+%28Mt.+10%3A10%29+For+the+laborer+is+worthy+of+his+reward%3A+And+he+which+serves+the+Gospel+ought+to+live+by+it.+So+then%2C+whether+stipends+be+paid+unto+ministers+out+of+lands+or+out+of+houses%2C+either+in+ready+money+or+in+tithes%2C+it+makes+no+matter+so+that+they+be+not+maintained+dishonestly%2C+but+honestly.+Indeed+these+rewards+in+some+places+do+retain+the+old+manner+of+tithes.+Howbeit+in+many+places+they+are+not+called+tithes%2C+but+stipends+or+wages.+And+doubtless+they+be+rather+rewards+which+are+due+to+the+labors+of+ministers+than+tithes.%E2%80%9D%0A%0A%E2%80%94+Start+Here%2C+There+are+higher+rewards+in+the+promises+of+God+for+sacrificing+the+things+of+this+life+than+we+can+conceive+of+%28Mk.+10%3A29-30%29.+Lord+increase+our+faith%21+and+may+we+be+like+the+Christians+of+the+Early+Church+whom+Irenaeus+spoke+of+%28Her.%2C+iv.2%29%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F950e8982db.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/950e8982db.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings#:~:text=While%20they%20%5Bthe%20Jews%5D%20had%20the,the%20labors%20of%20ministers%20than%20tithes&amp;text=While%20they%20%5Bthe%20Jews%5D%20had%20the%20tenth%20of&amp;text=due%20to%20the%20labors%20of%20ministers%20than%20tithes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XIV… Now follows the third section [of the beginning of Colossians], namely, the Salutation. ‘Grace be to you, and peace from God our Father and the Lord Jesus Christ.’ With this greeting, Paul prays for the greatest and necessary blessings for the Christians, and the salutation contains two parts: 1. The blessings he prays for, 2. From whom. The blessings he wishes are Grace and Peace… XV… 1. As the holy blessing, whose formula is found in Numbers 6, is an invocation of God, from whom all good things are desired for those who receive the blessing, so too is the Christian salutation a prayer, a form of invocation, through which, by faith and charity, we earnestly pray for the best things for others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1 (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</cite></span></figcaption>

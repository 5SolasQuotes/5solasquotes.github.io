<blockquote><p>74. From this is plain how there is freedom in the will. For I am said ‘to see freely’ because I can freely use the visual power for seeing; so in the matter at hand, however much any cause be natural and always uniformly acting (as far as is on its own part), yet because it does not determine nor necessitate the will to willing, but the will of its own liberty can concur with it for willing or not willing and so can freely use it, therefore is it said that ‘to will and to refuse freely’ is in our power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>25th Distinction, Question: ‘Whether an act of will is caused in the will by the object moving it, or by the will moving itself’ in Ordinatio, bk. 2, dist. 15-25 tr. Peter Simpson (2025), pp. 58-71</cite>, p. 67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>…divine providence is occupied not only with respect to necessary things, which have a natural connection with their own causes (Jer. 33:20, 25), but also, first, with respect to contingent things, which have an uncertain, fortuitous, and casual connection: either with the existence and nature of God, in which sense all things except God exist contingently, inasmuch as in themselves they are able not to exist; or with their own proximate causes operating accidentally and contingently; or with man’s free choice. That contingent things of this sort are subject to divine governance is taught throughout Scripture (Ex. 21:12–13; Deut. 19:5; Prov. 21:31; Ps. 127:1–2; 46:8–10; Dan. 11:21), even to the smallest things, such as the falling of a hair (Matt. 10:30), the operations of locusts and lice (Ex. 8:17; 10:12; Joel 1:4; Acts 12:23). In these things, accordingly, their own natural contingency does not perish, because they are certainly and infallibly directed, and come to pass, by the first cause. This appears specifically in the lot (Prov. 16:33), by which God decides cases through merely contingent events (Judges 6:37; Josh. 7:14), and likewise in his deciding the end of human life (Ex. 21:12–13; Isa. 38:5). 5. With free actions XVII. It is also occupied, second, with respect to free things that result from choice or counsel. For that these are subject to divine determination (and that certainly physical, not only moral), is evident both by the Scriptures (Prov. 16:1; 19:21; 21:1; Gen. 43:14; Ex. 11:1–3; 4:11; Phil. 2:12), and by reasons, because otherwise free choice would be independent, at least with respect to the act of determining itself. Yet notwithstanding, that these things remain free, is likewise, according to Scripture (1 Peter 5:2; Heb. 10:26) and experience, an indubitable fact. Moreover, by what reckoning the liberty of our choice is consistent with divine predestination is not so difficult to understand (as many think), if we consider that the divine influence and its predetermination does not hinder man from acting from counsel and rational complacency, or from determining himself while remaining otherwise undetermined and indeterminable by any created cause. I will add that if God, by determining the will and therefore producing a volition, deprived the will of liberty, then also the will, by determining itself and procuring its own volition, would deprive itself of liberty, which is contradictory; conversely, if the will, by determining itself, does not destroy its own liberty, then neither does God by doing the same. Wherefore the providence of God, in determining our choice, in no way either takes away or injures the liberty of choice. 6. With moral operations XVIII. It is occupied, namely, third, with respect to moral actions, both good and evil, which, just as from this determination of divine providence they are not any less free, likewise they are not any less ours: for although God is their efficient cause insofar as they are existing things (Acts 17:25, 28), nevertheless man remains their formal cause. God certainly produces faith in man, yet it is not God who believes, but man.</p></blockquote>

<blockquote><p>3. I easily acknowledge that grace gives such a power as is commonly called Moral, distinct from the natural faculties, as our corrupt estate contains an opposite impotency. But this is but an applying of the terms [‘can’] and [‘cannot’] [‘power’] and [‘impotency’] to dispositions and undisposedness, to habits and their privations. 4. A new heart and spirit, I easily confess necessary. But those words do commonly signify in Scripture, only new inclinations, dispositions, qualifications. It is a new heart, though only the old faculties and substance. I hope you will not follow Illyricus.¹ ¹ [Matthias Illyricus (1520–1575), a Lutheran reformer. Wiki says, “Affirming the natural inability of man, he adopted a position on sin as not being an accident of human nature, but involved in its substance, since The Fall of Man.”] 5. Where you say that [without faith a man can no more receive Christ, nor do ought towards it, than a dead man can walk or speak.], I Reply 1. That proves not faith to be equivalent to a potentia vel facultas [power or capacity], any otherwise than that it is of as absolute necessity, but not that it is of the same nature. If you show an illiterate man a Greek or Hebrew book, he can no more read in it then a dead man, that is, both are truly in sensu composito [in a combined sense] impossible: But yet it is but a habit that is wanting to one, and a power or faculty natural, to the other. And so it may truly be said that a sinner cannot do well that has accustomed to do evil, no more than a leopard can change his spots, or a blackmoore [a black person] his skin. Yet if you mean that such are equally distant from actual change as a dead man, it is but a dead comparison. A dead man wants both natural faculties, and an inclination or moral power. An unbeliever wants but one.</p></blockquote>

<blockquote><p>7. Is original corruption seated only in the lower part of our soul?… The papists, especially the Jesuits, so that they might hold that the higher part of the soul, as they say, in which is the free choice, was unwounded by corruption, and also so that they might obtain that concupiscence is not sin, and accordingly, that notwithstanding concupiscence, a person can be perfect in this life, state that original corruption is only in the lower part of the soul, that is, in sensuality, in concupiscence, in the rebellion of the lower forces. And of the Reformed with their reasons The Reformed on the contrary refer original corruption not only to the lower faculties of the soul, but also to the higher faculties, and indeed more so to the higher than to the lower. … (1) the apostle expressly refers corruption to the mind in 1 Timothy 6:5, “the mind of corrupt men,” and in Colossians 2:18, “puffed up by the mind of his flesh.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4a2d1718e9" data-kw="">
<blockquote><p>Therefore we ought gratefully and reverently to embrace and kiss this blessing of the Holy Spirit, that He condescended to our infirmity and did not want to burden it too much but selected and assigned for writing that of the doctrine and miracles of Christ which He judged to be sufficient and necessary for true faith and eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Concerning Sacred Scripture</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/necessity-of-scripture.html">Necessity of Scripture</a> › <a href="../topics/holy-scripture/necessity-of-scripture/necessity-of-a-written-word.html">Necessity of a written word</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6165730314" data-kw="">
<blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned; at least, we take it for granted in this inquiry that infallible inspirations in the discovery of things not before revealed are ceased in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned; at least, we take it for granted in this inquiry that infallible inspirations in the discovery of things not before revealed are ceased in the church.”

</figure><figure class="quote" id="q-d8c754bfe5" data-kw="">
<blockquote><p>We receive and embrace all the canonical Scriptures, both of the Old and New Testament, giving thanks to our God, who hath raised up unto us that light which we might ever have before our eyes, lest either by the subtlety of man, or by the snares of the devil, we should be carried away to errors and lies. Also that these be the heavenly voices, whereby God hath opened unto us His will: and that only in them man&#x27;s heart can have settled rest; that in them be abundantly and fully comprehended all things, whatsoever be needful for our salvation, as Origen, Augustine, Chrysostom, and Cyrillus have taught: that they be the very might and strength of God to attain to salvation: that they be the foundations of the Prophets and Apostles, whereupon is built the Church of God: that they be the very sure and infallible rule, whereby may be tried, whether the Church do stagger, or err, and whereunto all ecclesiastical doctrine ought to be called to account: and that against these Scriptures neither law, nor ordinance, nor any custom ought to be heard: no, though Paul his own self, or an angel from heaven, should come and teach the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><figure class="quote" id="q-dae7932649" data-kw="Tradition Unwritten traditions">
<blockquote><p>If they were guided by the Spirit of truth unto all truth when they published their writings, what prevented them from embracing a full knowledge of the Gospel, and consigning it therein? … Every child knows that in the writings of the apostles, which these men represent as mutilated and incomplete, is contained the result of that revelation which the Lord then promised to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.14</span></figcaption>

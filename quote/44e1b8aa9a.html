<main class="wrap"><figure class="quote" id="q-44e1b8aa9a" data-kw="">
<blockquote><p>Furthermore, we must receive God’s promises in such wise, as they be generally set forth to us in Holy Scripture: and, in our doings that will of God is to be followed, which we have expressly declared unto us in the Word of God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a34880204e" data-kw="">
<blockquote><p>We, therefore, condemn those who seek other than in Christ, whether they are chosen from all eternity, and what God has decreed of them before all beginning. For men must hear the gospel preached and believe it. If you believe and are in Christ, you may undoubtedly reckon that you are elected. For the Father has revealed unto us in Christ His eternal sentence of predestination, as we even now showed out of the apostle in 2 Timothy 1:9–10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/election-in-christ.html">Election in Christ</a> › <a href="../topics/election/election-in-christ/christ-as-head-and-mirror-of-election.html">Christ as head and mirror of election</a></span><span class="t"><a href="../topics/election/election-and-the-gospel-offer.html">Election and the Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-68e1533d1d" data-kw="">
<blockquote><p>The doctrine of the high mystery of predestination is to be handled with special prudence and care, that men attending the will of God revealed in His Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election; so shall this doctrine afford matter of praise, reverence, and admiration of God, and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 3.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/use-of-the-doctrine.html">Use of the Doctrine</a> › <a href="../topics/the-decrees-of-god/use-of-the-doctrine/how-to-preach-it.html">How to preach it</a></span><span class="t"><a href="../topics/election/assurance-and-comfort-in-election.html">Assurance and Comfort in Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“The doctrine of the high mystery of predestination is to be handled with special prudence and care, that men attending the will of God revealed in His Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election; so shall this doctrine afford matter of praise, reverence, and admiration of God, and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.”

— Particular Baptists, Second London Baptist Confession of Faith, 1689, 3.7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+doctrine+of+the+high+mystery+of+predestination+is+to+be+handled+with+special+prudence+and+care%2C+that+men+attending+the+will+of+God+revealed+in+His+Word%2C+and+yielding+obedience+thereunto%2C+may%2C+from+the+certainty+of+their+effectual+vocation%2C+be+assured+of+their+eternal+election%3B+so+shall+this+doctrine+afford+matter+of+praise%2C+reverence%2C+and+admiration+of+God%2C+and+of+humility%2C+diligence%2C+and+abundant+consolation+to+all+that+sincerely+obey+the+gospel.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith%2C+1689%2C+3.7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F68e1533d1d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/68e1533d1d.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" rel="noopener" target="_blank">Read it online · Founders Ministries</a></div>
</figure><figure class="quote" id="q-da5636a070" data-kw="">
<blockquote><p>That Christ Jesus by His death did bring forth salvation and reconciliation only for the elect (John 15:13; Rom. 8:32–34; 5:11; 3:25), which were those which God the Father gave Him (Job 17:2; 6; 37); and that the gospel which is to be preached to all men as the ground of faith, is, that Jesus is the Christ, the Son of the ever-blessed God (Matt. 16:16; Luke 2:26; John 6:9; 7:3; 20:31; 1 John 5:11), filled with the perfection of all heavenly and spiritual excellencies, and that salvation is only and alone to be had through believing in His name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First London Baptist Confession</cite>, 1644, Art. 21</span></figcaption>

</figure><figure class="quote" id="q-6e0adc620a" data-kw="Love Wisdom Election">
<blockquote><p>That the great God purposed and designed an union with himself of those whom in a special manner he had set himself to love; and that this union is the deepest and furthest design of his heart, of any he hath toward them, or the whole creation. The full demonstration of his manifold wisdom and power moved him to make a variety of persons, things, yea, of worlds; but then his goodness and his love moved him to reduce out of that variety an all out of every sort, as a pledge of his respect to all, unto an unity again, and that with himself; and this union is the top perfection of all his works, as that, John 17:23, ‘I in them, and they in me, that they may be made perfect in one.’ It is the perfection of the creature, whereof the unity of the three Persons is the pattern, and the perfection of God’s design.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon X (Eph. 1:10)</span></figcaption>

<blockquote><p>The virtues of those making progress are in a certain sense fragrant with a sweet odour when other people come to know them. Paul spoke in this way: We are the good odour of Christ for God [2 Cor 2:15]. Similarly, the holy Church, being fragrant with a kind of sweet odour in her elect, spoke in this way in the Song of Songs, saying: While the king was on his couch, my nard gave its odour.

It is as if she were saying in plain speech: “As long as the king is hidden from my sight, secluded by himself in his heavenly repose, the conduct of the elect is occupied with giving forth the wonderful odours of the virtues. Hence even though it still does not see him whom it seeks, it may burn all the more ardently with desire.” And so “nard gives off its odour while the king is settled upon his couch” because the virtue of the saints in the Church supplies us with the pleasantness of great sweetness while the Lord is at rest in his blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Excerpts from the Works of Gregory the Great on the Song of Songs. Compiled by Paterius and Bede</cite>, (1705) in Gregory the Great on the Song of Songs (594-98), trans. Mark DelCogliano (Collegeville MN: Liturgical Press, 2012), p. 153.</span></figcaption>

<blockquote><p>Now let us fall down before the Majesty of our good God with acknowledgment of our faults, praying him to make us perceive them more and more, so as we may mislike of them, and not only confess them with our mouth, but also lay open our hearts before him, and submit ourselves wholly to his holy word, and that in such wise we may be comforted by his free goodness, as it is showed us in our Lord Jesus Christ, and he reform us also by his holy spirit, to the end that whereas we of ourselves be full of rebelliousness, we may by his governing become teachable and ready to follow his holy will, and to give ourselves over all wholly unto him.</p></blockquote>

<blockquote><p>5. God calls upon sinners to turn to Him by the internal voice and motions of His Spirit… There is a twofold call of the Spirit: more common and more special.

1. More common, and so many are called which never are thoroughly converted. It was the common work of the Spirit which made Felix tremble, which brought Agrippa within a step of Christianity and caused Herod to do many things. Multitudes of unregenerate ones have felt the waters stirred, the Holy Ghost moving them to conversion, and have readily proffered His aid and assistance, and perhaps, for awhile, they have been led by Him. But then they have refused to let go of some lust or vanity which He has bid them abandon. They would not turn their spiritual sloth into serious diligence about the concerns of their immortal souls, and so by disregarding His motions, and by slighting His help, they have made the Spirit to go away in grief who came in love to work upon them.

2. There is a call of the Spirit which is more special and efficacious…</p></blockquote>

ener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…Under which two excuses [in the text] are comprehended all others of like sort, which flesh and blood does minister, for hindering to rise and open to Christ, and obey his calling, such as we see, Mt. 22, and are usually suggested by our corruption, as the quitting of our pleasure, or profit, our ease, credit, or companions, if we do so; and that we shall fall in disgust, hatred, and obloquy, and other like inconveniences: Neither is it a fit time as yet (but as Felix said to Paul, Acts 24:25) we may take a more convenient season for that, or the like purposes, etc. Such excuses do absenters of themselves from public exercises of divine worship, make, and profaners of the Lord’s Sabbath; such also do covetous extortioners, revengeful oppressors: unclean whoremongers, riotous, drunkards and the like, frame to themselves, and obtrude, and all for this end, to keep Christ out, though He frequently call and knock at their door to enter in. Observations:

1. We see hereby, that it is not an easy matter, but a very hard and difficult one to bring the soul and Christ together, into a near and constant fellowship… but take heed to his voice who calls and knocks, and, as the Father spake at Christ’s baptism from heaven, hear Him and obey.

2. We see, how strong is carnal corruption, and remnants of sin in the regenerate, to hold Christ at the door, and to sleight his voice, calling on the•… to open; and therefore, how much more stronger is the same in the unregenerate, and it is no marvel that they open not unto Him and disobey his voice.</p></blockquote>

<blockquote><p>What is added in the last place, concerning the general intention of God, by which He wills that all men individually should be saved through the death of his Son, needs explanation. It must be observed, therefore, that according to the custom of the Scriptures, the Divine will or intention sometimes denotes merely the appointment of means to an end, although there is no determinate will in God of producing that end by those means. And the Schoolmen refer this intention or will of God to the common order of providence. In this sense He willed and intended the obedience and salvation of the angels who apostatized, inasmuch as He furnished them with gifts, fit in themselves and suitable, to perform obedience and obtain salvation. And in this sense God, with a general intention, wills life to all men, inasmuch as he willed the death of Christ to be the fountain and cause of life to all men individually, according to the tenor of the evangelical covenant.¹ ¹ [Davenant calls the gospel offer, that whosoever believes in Christ will be saved (Jn. 3:16), established with all men as men, a “covenant,” and the “evangelical covenant”. While this call and offer does not reach all persons, yet, according to some, it potentially could save all persons if it were not for the sin of persons after Adam and Eve not continuing in their responsibility and for persons not obeying the command to preach the gospel to every creature. This potential power of providential means, designed unto the end of salvation, however varied or inaccessible through human history, yet reflects, for some theologians, God’s gracious will of providence in some way for the life and salvation of every human individual, especially in contrast to the demons which receive no such favors.] But we must observe, that the Scriptures mention another will or intention of God, and that properly so called, which never fails in producing the good intended, and which the Schoolmen refer to the order of special predestination… But if by this general intention they mean nothing more than a general aptitude and sufficiency in the death of Christ to effect the salvation of all men individually in the mode of an universal cause, or a general appointment of God concerning the salvation of all men individually, who, through the grace of God, duly apply to themselves this universal cause, then there is no need to reject this form of speaking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tract on the Gallican Controversy, pt. 1</cite>, pp. 564-65 appended to Davenant, An Exposition of Colossians, vol. 2 ed. Josiah Allport (London, 1832)</span></figcaption>

e Schoolmen refer to the order of special predestination… But if by this general intention they mean nothing more than a general aptitude and sufficiency in the death of Christ to effect the salvation of all men individually in the mode of an universal cause, or a general appointment of God concerning the salvation of all men individually, who, through the grace of God, duly apply to themselves this universal cause, then there is no need to reject this form of speaking.”

— John Davenant, Tract on the Gallican Controversy, pt. 1, pp. 564-65 appended to Davenant, An Exposition of Colossians, vol. 2 ed. Josiah Allport (London, 1832)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+is+added+in+the+last+place%2C+concerning+the+general+intention+of+God%2C+by+which+He+wills+that+all+men+individually+should+be+saved+through+the+death+of+his+Son%2C+needs+explanation.+It+must+be+observed%2C+therefore%2C+that+according+to+the+custom+of+the+Scriptures%2C+the+Divine+will+or+intention+sometimes+denotes+merely+the+appointment+of+means+to+an+end%2C+although+there+is+no+determinate+will+in+God+of+producing+that+end+by+those+means.+And+the+Schoolmen+refer+this+intention+or+will+of+God+to+the+common+order+of+providence.+In+this+sense+He+willed+and+intended+the+obedience+and+salvation+of+the+angels+who+apostatized%2C+inasmuch+as+He+furnished+them+with+gifts%2C+fit+in+themselves+and+suitable%2C+to+perform+obedience+and+obtain+salvation.+And+in+this+sense+God%2C+with+a+general+intention%2C+wills+life+to+all+men%2C+inasmuch+as+he+willed+the+death+of+Christ+to+be+the+fountain+and+cause+of+life+to+all+men+individually%2C+according+to+the+tenor+of+the+evangelical+covenant.%C2%B9+%C2%B9+%5BDavenant+calls+the+gospel+offer%2C+that+whosoever+believes+in+Christ+will+be+saved+%28Jn.+3%3A16%29%2C+established+with+all+men+as+men%2C+a+%E2%80%9Ccovenant%2C%E2%80%9D+and+the+%E2%80%9Cevangelical+covenant%E2%80%9D.+While+this+call+and+offer+does+not+reach+all+persons%2C+yet%2C+according+to+some%2C+it+potentially+could+save+all+persons+if+it+were+not+for+the+sin+of+persons+after+Adam+and+Eve+not+continuing+in+their+responsibility+and+for+persons+not+obeying+the+command+to+preach+the+gospel+to+every+creature.+This+potential+power+of+providential+means%2C+designed+unto+the+end+of+salvation%2C+however+varied+or+inaccessible+through+human+history%2C+yet+reflects%2C+for+some+theologians%2C+God%E2%80%99s+gracious+will+of+providence+in+some+way+f

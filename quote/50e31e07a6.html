<main class="wrap"><figure class="quote" id="q-50e31e07a6" data-kw="">
<blockquote><p>At the time of the Reformation the doctrine of the millennium was rejected by the Protestant Churches, but revived in some of the sects, such as that of the more fanatical Anabaptists, and that of the Fifth Monarchy Men. Luther scornfully rejected “the dream” that there would be an earthly kingdom of Christ preceding the day of judgment. The Augsburg Confession condemns those “who now scatter Jewish opinions, that, before the resurrection of the dead, the godly shall occupy the kingdom of the world, the wicked being everywhere suppressed.” Art. XVII. And the Second Helvetic Confession says: “Moreover, we condemn the Jewish dreams, that before the day of judgment there shall be a golden age in the earth, and the godly shall possess the kingdoms of the world, their wicked enemies being trodden under foot.” Chapter XI. A certain form of Millenarianism made its appearance, however, in the seventeenth century. There were several Lutheran and Reformed theologians who, while rejecting the idea of a visible reign of Christ on earth for a thousand years, advocated a more spiritual conception of the millennium. Their view of the matter was that, before the end of the world and the return of Jesus Christ, there will be a period in which the spiritual presence of Christ in the Church will be experienced in an unusual measure and a universal religious awakening will ensue. The Kingdom of Jesus Christ will then stand out as a kingdom of peace and righteousness. This was the early form of Post- as distinguished from Premillennialism. During the eighteenth and nineteenth centuries the doctrine of the millennium again met with great favor in some circles. It was advocated by the school of Bengel and more recently by that of Erlangen, and numbered among its adherents such men as Hofmann, Delitzsch, Auberlen, Rothe, Elliott, Cumming, Bickersteth, the Bonars, Alford, Zahn, and others. There is great diversity of opinion among these Premillenarians as to the order of the final events and the actual condition of things during the millennium. Repeated attempts have been made to fix the time of Christ’s return, which is with great assurance declared to be imminent, but up to the present all these calculations have failed. Though there is a widespread belief to-day, especially in our country, that the return of Christ will be followed by a temporary visible reign of Christ on earth, yet the weight of theological opinion is against it. In liberal circles a new form of Post-millennialism has made its appearance. The expected kingdom will consist of a new social order “in which the law of Christ shall prevail, and in which its prevalence shall result in peace, justice and a glorious blossoming of present spiritual forces.” This is what Rauschenbusch has in mind when he says, “We need a restoration of the millennial hope.” A Theology for the Social Gospel, p. 224. Up to the present time, however, the doctrine of the millennium has never yet been embodied in a single Confession, and therefore cannot be regarded as a dogma of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of Christian Doctrines</cite>, (Grand Rapids: Eerdmans, 1937), 271–72</span></figcaption>

</figure><figure class="quote" id="q-392f85a1af" data-kw="">
<blockquote><p>First, before we enter into the matter itself, we must keep in mind that distinction which we previously laid down so that we do not (as commonly happens) unwisely mingle these two, which have a completely different nature. For certain men, when they hear that the gospel promises a freedom that acknowledges no king and no magistrate among men, but looks to Christ alone, think that they cannot benefit by their freedom so long as they see any power set up over them. They therefore think that nothing will be safe unless the whole world is reshaped to a new form, where there are neither courts, nor laws, nor magistrates, nor anything which in their opinion restricts their freedom. But whoever knows how to distinguish between body and soul, between this present fleeting life and that future eternal life, will without difficulty know that Christ’s spiritual Kingdom and the civil jurisdiction are things completely distinct. Since, then, it is a Jewish vanity to seek and enclose Christ’s Kingdom within the elements of this world, let us rather ponder that what Scripture clearly teaches is a spiritual fruit, which we gather from Christ’s grace; and let us remember to keep within its own limits all that freedom which is promised and offered to us in him. For why is it that the same apostle who bids us stand and not submit to the “yoke of bondage” [Gal. 5:1] elsewhere forbids slaves to be anxious about their state [1 Cor. 7:21], unless it be that spiritual freedom can perfectly well exist along with civil bondage? These statements of his must also be taken in the same sense: In the Kingdom of God “there is neither Jew nor Greek, neither male nor female, neither slave nor free” [Gal. 3:28, Vg.; order changed]. And again, “there is not Jew nor Greek, uncircumcised and circumcised, barbarian, Scythian, slave, freeman; but Christ is all in all” [Col. 3:11 p.]. By these statements he means that it makes no difference what your condition among men may be or under what nation’s laws you live, since the Kingdom of Christ does not at all consist in these things.</p></blockquote>

<blockquote><p>Therefore, having been persuaded that the Pope is the Antichrist, and since truly it is clear from the words of Scripture that this be so, we must conclude that our secession from his communion is consummately necessary and that it is quite impossible that there be a reconciliation between us, if things so remain as they are.</p></blockquote>

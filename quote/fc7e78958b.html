<main class="wrap"><figure class="quote" id="q-fc7e78958b" data-kw="">
<blockquote><p>Diverse resolve that text [Rom. 12:6-7] thus, that first the apostle makes a general division of ecclesiastical offices, ‘prophesy’, comprehending these that labour in the Word and doctrine; ‘ministry’ comprehending those that labor not in the Word and doctrine… Ministry, he subdivides into the office of the ruling elder, deacon, and the other of showing mercy, which was committed sometimes to old men, sometimes to widows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), ch. 5, p. 83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“Diverse resolve that text [Rom. 12:6-7] thus, that first the apostle makes a general division of ecclesiastical offices, ‘prophesy’, comprehending these that labour in the Word and doctrine; ‘ministry’ comprehending those that labor not in the Word and doctrine… Ministry, he subdivides into the office of the ruling elder, deacon, and the other of showing mercy, which was committed sometimes to old men, sometimes to widows.”

— George Gillespie, A Treatise of Miscellany Questions… (Edinburgh, 1649), ch. 5, p. 83">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDiverse+resolve+that+text+%5BRom.+12%3A6-7%5D+thus%2C+that+first+the+apostle+makes+a+general+division+of+ecclesiastical+offices%2C+%E2%80%98prophesy%E2%80%99%2C+comprehending+these+that+labour+in+the+Word+and+doctrine%3B+%E2%80%98ministry%E2%80%99+comprehending+those+that+labor+not+in+the+Word+and+doctrine%E2%80%A6+Ministry%2C+he+subdivides+into+the+office+of+the+ruling+elder%2C+deacon%2C+and+the+other+of+showing+mercy%2C+which+was+committed+sometimes+to+old+men%2C+sometimes+to+widows.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Treatise+of+Miscellany+Questions%E2%80%A6+%28Edinburgh%2C+1649%29%2C+ch.+5%2C+p.+83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffc7e78958b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fc7e78958b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-office-of-widows-the-churchs-ministry-to-the-needy/#:~:text=Diverse%20resolve%20that%20text%20%5BRom.%2012%3A6%2D7,to%20old%20men%2C%20sometimes%20to%20widows&amp;text=Diverse%20resolve%20that%20text%20%5BRom.%2012%3A6%2D7%5D%20thus%2C%20that&amp;text=committed%20sometimes%20to%20old%20men%2C%20sometimes%20to%20widows" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b84dda9a4" data-kw="">
<blockquote><p>For the choosing of widows that are poor to take care of the poor and sick in hospitals, we think it just as necessary now as then, though no ways if there be none sick and poor in the Church: But that widows were Church-officers ordained, as were deacons, Acts 6:6, we never thought, and therefore we do not see that the wanting [lacking] of such widows, is the want of a positive institution of Church-policy; for other positive things of policy that should be of perpetual use, and not all of the same kind, and of equal necessity: I see no reason (which I speak for apostles) which were necessary then, and not now;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (London, 1646), Introduction, p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-1a4b24394f" data-kw="">
<blockquote><p>…though it be ordinarily most convenient that the office of attending the sick be committed to women, yet it is not essentially necessary to the office: And as Aretius notes upon the place (Common Places, class 4, ch. 1, p. 746), we may under [Greek] comprehend not only widows appointed to attend the sick, but old men appointed to receive and entertain strangers: Which is also judiciously observed by [Peter] Martyr. Besides, when the apostle, 1 Tim. 5, teaches what is required in widows, who should be made diaconesses, this he requires among other things, that they be not such as live in pleasures and idleness, and take not care to provide for their own houses, verse 6,8, [Greek], which though Erasmus and Beza turn in the feminine, quod si qua, yet our English translators, and many good interpreters, turn it in the masculine. And surely it shall have more weight if it agree to men as well as women, says Calvin upon that place. Now they who read in the masculine, that which the apostle says there of widows, will not, we suppose, blame us for reading, Rom. 12:8 in the masculine also, ‘He that sheweth mercie’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, … (Edinburgh, 1641), pt. 1, ch. 5, on Rom. 12:8, pp. 38-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-51961f7872" data-kw="">
<blockquote><p>Deacons are distinguished from elders, Rom. 12; 1 Cor. 12; 1 Tim. 3, and by all antiquity. If we make deacons to be elders, and the care of the poor to be an act of ruling, then let us [arbitrarily] make what you will of the plainest Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geroge-gillespie.html">Geroge Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, …. (Edinburgh: Bryson, 1641), ch. 7, ‘Argument 5, from 1 Tim. 5:17’, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-636237e129" data-kw="">
<blockquote><p>If &quot;elders&quot; and &quot;bishops&quot; be not the same persons, having the same office, the same function, and the same duties, and the same names, it is impossible, So far as I understand, how it should be expressed: for these elders are they whom the Holy Ghost made bishops, they were many of them in the same church, their duty it was to attend unto the flock and to feed the church, which comprise all the duties, the whole function of elders and bishops; which must therefore be the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, ch. 4 (Works 16)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9ccef4524a" data-kw="">
<blockquote><p>Whereas the will of God is most simple; therefore, 1. In him there are not either two, or more, or contrary Wills. There are in deed divers distinctions of his Will, as shall be seen in the Doctrine of God’s Decrees: but these distinctions are nominal, rather than real.

2. The primary object of God’s will, is God himself.

3. The will of God is most free.

4. Nothing is done against the Will of God.

5. The Will of God, according to its divers objects hath divers names, to wit, of holiness, goodness, love, grace, mercy, wrath, justice, and such like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), p. 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10c6b7e1b6" data-kw="">
<blockquote><p>I answer: For the understanding of the aforesaid, it must be noted that, according to John Damascene, the will of good pleasure is twofold, namely, antecedent and consequent: antecedent or conditional, by which He wills, as far as is in Him, the salvation of all, and absolute, by which He determinately wills something that He knows with certainty will happen. It must be understood, therefore, that it is not possible for any will of God to be overcome; it is not possible for any to be rendered void; yet it is possible for some, such as the antecedent, not to be fulfilled; and it is necessary for some, such as the consequent, to be fulfilled, and it is impossible for it to be hindered. None, I say, is possible to be overcome. For if a man does not do what God wills, as far as is in him, by the antecedent will, God does with him what He wills by the consequent will; and thus it is always fulfilled either of the man or by the man, and thus it is never vanquished or overcome. Nor is it possible for the will of God to be rendered void. For something is said to be void when it is deprived of its proper effect, for which it is: but no will is deprived of the effect for which it is properly. For what is said, that God wills all men to be saved, as far as is in Him, this will does not connote salvation, nor is it properly for the effect of salvation, but it connotes the ordination of nature or a nature ordainable to salvation. Hence it is nothing more to say: God wills this person to be saved, as far as is in Him, than that it pleased God to give this person a nature through which he could arrive at salvation, and that God was prepared to help, so that salvation does not fail because of a defect on the part of God. Hence it is not rendered void, because it has its proper effect. But concerning the absolute will, it is plain that it cannot be rendered void, because it posits all its effect and never remains unfulfilled. Since, therefore, it is true that the will of God can in no way be overcome or rendered void, yet it is necessary that the absolute will be fulfilled, but the conditional will not at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 47 | Treatment of the Questions</span></figcaption>

</figure><figure class="quote" id="q-0af89f62e1" data-kw="veracity faithfulness">
<blockquote><p>God is not a man, that he should lie; neither the son of man, that he should repent; hath he said, and shall he not do it? Or hath he spoken, and shall he not make it good? (Num. 23:19). The immutability of the divine will and counsel is often asserted: “My counsel shall stand, and I will do all my pleasure” (Is. 46:10). His faithfulness to his promises cannot fail, because his veracity is essential to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.11.3</span></figcaption>

<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</span></figcaption>

<blockquote><p>Question 13: Whether God wills Himself as the end, and creatures as means? Distinguished. Answer: As the ultimate end He always wills Himself, Prov. 16:4. Creatures, and their actions, He sometimes wills as means in respect of others, sometimes as ends; but those ends are always subordinated, in respect of God, who is the universal and ultimate end of all things, Rom. 11, last verse.</p></blockquote>

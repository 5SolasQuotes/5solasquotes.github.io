<main class="wrap"><figure class="quote" id="q-b878dca577" data-kw="">
<blockquote><p>8. The Church can fail in respect of its faith or its morals. Regarding morals there is no doubt and regarding faith it is certain. The apostles erred in the doctrine of Christ’s resurrection and Christ’s kingdom, which are both articles of faith. 9. It is also possible that the Church errs in its foundation, but it does not err tenaciously or until the end. This is evident in the apostles, who erred in the fundamental doctrine concerning the resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“8. The Church can fail in respect of its faith or its morals. Regarding morals there is no doubt and regarding faith it is certain. The apostles erred in the doctrine of Christ’s resurrection and Christ’s kingdom, which are both articles of faith. 9. It is also possible that the Church errs in its foundation, but it does not err tenaciously or until the end. This is evident in the apostles, who erred in the fundamental doctrine concerning the resurrection.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-abd2d967b8" data-kw="">
<blockquote><p>If ye state yourselves into parties, as the Corinthians did, how will ye avoid being puffed up for one against another? and what one says be taken as an oracle and what another says cried down according to interest and affection? Cum res transit in affectum, perit judicium [When a thing turns to affection, judgment perishes]. Beware of a wrong bias upon your affection, for that will bias and bribe your judgment, and forbear rash judgings and spurning at ministers, 1 Cor. 4:5. Censure only what the Scripture censures and approve only what it approves; else ye may soon take light for darkness, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), p. 170</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“If ye state yourselves into parties, as the Corinthians did, how will ye avoid being puffed up for one against another? and what one says be taken as an oracle and what another says cried down according to interest and affection? Cum res transit in affectum, perit judicium [When a thing turns to affection, judgment perishes]. Beware of a wrong bias upon your affection, for that will bias and bribe your judgment, and forbear rash judgings and spurning at ministers, 1 Cor. 4:5. Censure only what the Scripture censures and approve only what it approves; else ye may soon take light for darkness, etc.”

</figure><figure class="quote" id="q-2258402bd8" data-kw="">
<blockquote><p>The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew</cite>, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697), pp. 33-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce.”

malink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=The%20divisions%20among%20Protestant%20Churches%20are,their%20heats%20and%20passions%20do%20produce&amp;text=The%20divisions%20among%20Protestant%20Churches%20are%20to%20be&amp;text=dreadful%20effects%20their%20heats%20and%20passions%20do%20produce" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1878dea24a" data-kw="">
<blockquote><p>If he [the opponent] judge the terms of our communion lawful [in the Church of Scotland], then he must either join and keep communion with us, or maintain that a Church, the terms of whose communion are lawful, or, to keep to our these [thesis], in which there are no sinful terms of communion imposed, is yet to be separated from. This is a new tenet, never known before among men that called themselves presbyterians. I think they had reason, who, when these [separatist] men began to call themselves ‘the true presbyterians of the Chuch of Scotland’ [after the Glorious Revolution of 1689], they called them ‘the new presbyterians’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([London] 1712), p. 36</span></figcaption>

</figure><figure class="quote" id="q-ac8747e292" data-kw="">
<blockquote><p>Why truly, after all other means have been used, and costly experiments tried, I believe none will be found more successful, than to maintain the established [Anglican] Church in all its rights, privileges and revenues, keeping close to the constitution which has been so long settled and naturalized to us, supporting it on its ancient basis, without making any material alteration, and hereby sapping the foundation on which ’tis built; but taking care that those who differ from it really on principle, they shall be easy, by granting them such a limited toleration and liberty that they may rest secure [that] they shall not suffer merely for conscience sake, whilst they behave themselves peaceably under the government, and do not make use of any pretended difference in opinion to disturb the peace of the State or the established Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-d-huisseau.html">Isaac D’Huisseau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Re-Union of Christians: or, The Means to Re-Unite All Christians in One Confession of Faith</cite>, (1670; London : Henry Mortlock, 1708) 148 pp. ToC | A further significant qualifier is that the English translator and publisher, in 1708, stated his view and goal in this way (Appendix, p. 14):</span></figcaption>

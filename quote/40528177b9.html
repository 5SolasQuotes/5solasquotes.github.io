<main class="wrap"><figure class="quote" id="q-40528177b9" data-kw="">
<blockquote><p>As touching ceremonies, &amp; outward rites, the Apostles thought it unlawful to charge the Churches with any thing, upon their private authority. Baptism, the order whereof, they received of Christ the Lord, they have most sincerely delivered. The use and manner of the Lord’s Supper, as Christ did institute it, they thought good to retain. In other matters of the Church, this was their chief care, to have a Discipline, wherewith Christ would the naughty [wicked] disposed to be kept under, and that the poor should be honestly provided for, whose case and condition, the Lord did vouchsafe so earnestly to commend unto us.

The things which besides these nowadays, under the name of the Apostles, and Canons of the Apostles are obtruded, we cannot acknowledge for Apostolic: neither can any good man blame us therefore, forasmuch as Luke maketh no mention of them, whose diligence and labour, the holy Ghost thought good to use, in writing the Sermons and Acts of the Apostles. Surely, I will never think, the holy Ghost either so unwise, as to take a negligent writer of so high matters, or else so forgetful, as to let pass any of those things, the knowledge and observation whereof, was so necessary in his Church.

I would speak of everything more at large, but that they recourse in the treatise of the History, where they will be more commodiously handled. Let it suffice for this time to have showed the great utility of this book, in that it ministreth to us, a true and an infallible rule of reforming the Church, which except they observe, which will be called and counted reformers, they may well rejoice in their reformations in the judgement of the flesh, but they shall never give us Churches, that any man, but meanly trained in the holy Scriptures, shall acknowledge in all points, for sincere, and true Apostolic Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An hundred, threescore and fifteen Homilies or Sermons, upon the Acts of the Apostles, written by Saint Luke</cite>, trans. John Bridges (London: Henry Denham, 1572), pp 3-4.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44afb1d0a7" data-kw="">
<blockquote><p>Yet there was in those rites some manner of difference, not only between the first Passover celebrated in Egypt and the subsequent ones, but also between the primary Passover, which was ordinarily eaten in the month of Nisan on the fourteenth day, and the secondary one, which was celebrated in the second month on the fourteenth day, for the sake of those who were either unclean or absent in the prior month, because in the latter, the communicants were not bound to such an exact purging of all leaven, and also they conducted this feast for not but one day [instead of seven].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (1698; RHB), bk. 7, ch. 5, sect. 5</span></figcaption>

<blockquote><p>3 Q. Of how many hours does the Sabbath day consist? A. Of four and twenty. Gen. 2:3 The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day. 4 Q. Are all those hours to be sanctified? A. Yes. Exod. 20:11 The Lord rested the whole seventh day: and all the time wherein He rested He sanctified. Gen. 2:2,3 5 Q. How can all that time be sanctified? A. 1. By observing things commanded. Jer. 17:22 2. By observing things permitted. Exod. 12:16.</p></blockquote>

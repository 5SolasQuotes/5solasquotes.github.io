<main class="wrap"><figure class="quote" id="q-0dc7cc87b1" data-kw="">
<blockquote><p>This gospel holiness respects Jesus Christ as its pattern. It proposeth no lower pattern for imitation, then to be conform to his image; he that is begotten again unto a lively hope, by the resurrection of Christ from the dead, girds up the loins of his mind (which are the affections of his soul, lest by falling flat upon the earth he be hindered in running the race set before him, as looking to the forerunner his pattern) in this girdle of hope, that he may be holy in all manner of conversation, keeping his eye upon the precept and pattern, that his practice may be conform[ed].

It is written, saith he, Be ye holy for I am holy, the hope of seeing God, and being ever with him imposeth a necessity upon him who hath it, to look no lower, then at him, who is glorious in holiness; and therefore he is said to purify himself, even as he is pure; and knowing that this is the end of their being quickened together with Christ, that they may walk even as he walked; they, in their working and walking, aim at no less then to be like him; and therefore never sit down upon any attained measure, as if they were already perfect: the spotless purity of God expressed in his laws, is that whereto they study assimilation; therefore they are still in motion towards this mark, and are changed from one degree of glorious grace into another, into the same image, even as by the Spirit of the Lord, who never gives over his putting them to cleanse from all filthiness of the flesh and of the Spirit, till that be true in the truest sense, thou art all fair, my love, there is no spot in thee.

And knowing that perfect fruition of him cannot be without perfect conformity to him, herein do they exercise themselves, to grow in grace, and to be still advancing towards some more likeness to his image, forgetting all their attainments, as things that are behind, and by their reachings forth unto that which is before, make it evident, that they make every begun degree of grace and conformity to God, a prevenient capacity for a new degree, which yet they have not attained.

I know, our moralists look upon themselves as matchless, in talking of following his steps, as he hath left us an example: in this they make a flourish with flaunting effrontery, but for all their boasting of wisdom, such a poor simple man as I, am made to wonder at their folly, who proposing, as they say, the purity of Christ for their pattern, are not even thence convinced, that in order to a conformity thereto, there is a simple &amp; absolute necessity of the mighty operations of that Spirit of God, whereby this end can be reached; but while they flout at the Spirit’s working, as a melancholy fancy, whereby the soul is garnished with the beauty of holiness, and made an habitation for God, I doubt not to say of these great sayers, that they understand neither what they say, nor whereof they affirm: nay doth not their talking of the one, not only without seeing the necessity of the other, but speaking against it, say in the heart of every one, (who hath not the heart of a beast) that they have never yet got a sight of the holiness of that pattern, nor of their own pollutions and impotency; for if they had, they would give themselves up to Jesus Christ to be washed by him, without which they can have no part with him.

O there will be a vast difference, at the latter day, betwixt them who have given their black souls to Jesus Christ to bleach, when he shall present them without spot, not only clothed with wrought gold, but all glorious within, and these who have never dipped, yea who have despised to dip their defiled souls in any other fountain, save in the impure puddle of their own performances: this will make them loathsome in his sight, and cause his soul abhor those, who have done this despite unto the Spirit of grace, as to slight that blessed fountain, opened for sin &amp; for uncleanness, let them pretend as high as they will, to look to him, as a pattern, while (because the plague sore is got up in their eye) they look not to him as a price, not to the grace of Jesus Christ, as that which can only principle any acceptable performance of duty, he will plunge them in the ditch, and it Will cost them their souls, for rejecting the counsel of God against themselves, in not making use of him who came by water, as well as by blood.</p></blockquote>

<blockquote><p>And after all this, if it should please God [that] any person of the blessed and most holy Trinity should appear in any visible shape, that shape might be depicted; of that shape an image might be made; I mean, it might naturally; it might if it were done for lawful ends, and unless a commandment were to the contrary; and therefore so long as God keeps himself within the secret recesses of his sanctuary, and the majesty of his invisibility, so long it is plain he intends the very first sense and words of his [Second] Commandement: but if he should cancel the great reason [Dt. 4, end] of his Commandement, and make that by an act of his own to become possible which in the nature of things is impossible, that is, that an image can be made of God; I should believe that God did intend to dispense in that part of the Commandement, and declare that he intended it only for a temporary band: For if the reason of the commandement were taken away; either the commandement also ceases to oblige; or must be bound upon us by another reason, or a new sanction, or at lest a new declaration; or else it would follow that then his visible appearance would become a snare to mankind. But because yet he has not yet appeared visibly and has by no figure or idea represented the Godhead; and that it is a truth which must last as long as Christian religion lasts, that no man can see God, therefore it follows that it is at no hand lawful to make an image of God or relating to the divinity. If a dove be made it must not be intended to represent the Holy Ghost, for besides that no dove did appear, nor shape of a dove, yet if it did, it related not to the person of the Holy Ghost, but to the impression made upon the person on whom the light descended: and if the figure of the crucifix be made, or of Jesus in the flesh, it is wholly relative to the creature, not to him as God; for that is impious, and unreasonable and impossible to be done in any natural proportion.</p></blockquote>

<blockquote><p>Espouse sober principles; for men are, as their principles are. In these avoid extremes; and in the less weighty matters of the law, keep the mean, that you may reserve your zeal for the great things of God, the things that belong to your everlasting peace. Take heed on the one hand of bigotry in the circumstantials of religion, and on the other hand of lukewarmness and indifferency in the essentials of it.

Fix such principles as these to yourselves with reference to the main matter:—that God’s favour is better than life, and his displeasure worse than death; that sin is the greatest evil; that the soul is the man, and that is best for us that is best for our souls; that Jesus Christ is all in all to us, and we are undone without an interest in him; that it is as much our wisdom, as it is our duty, to be religious; that the world has not that in it, which will make us happy; that time, and the things of time, are nothing in comparison with eternity, and the things of eternity.

These, and such as these, are principles of eternal truth, and our firm belief of them, and adherence to them, will be to us of eternal consequence. And as to other things, let your principle be, that “God is no respecter of persons, but in every nation, he that fears God, and works righteousness, is accepted of him;” and therefore ought to be so of us: “that the kingdom of God is not meat and drink, but righteousness and peace, and joy in the Holy Ghost; and he that in these things serveth Christ, is acceptable to God, and approved of men.” By such principles as these, keep up moderation and sober-mindedness in your profession of religion, which will contribute much to the promoting of it in everything else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober-Mindedness Pressed upon Young People, in a Discourse on Titus II.6</cite>, (1712) in The Complete Works of the Rev. Matthew Henry; Being a Collection of all his Treatises, Sermons, and Tracts, as Published by Himself: And a Memoir of his Life (2 vols, Edinburgh: A. Fullarton and Co., 1853), 1: 80-81.</span></figcaption>

</figure><figure class="quote" id="q-4d7b72c231" data-kw="">
<blockquote><p>But the church of God is in God the Father, and in the Lord Jesus Christ; it is the company of the faithful, whom God hath gathered together in Christ by his word and by the Holy Ghost, to honour him, as he himself hath appointed. This church heareth the voice of the Shepherd; it will not follow a stranger, but flieth from him; for it knoweth not the voice of strangers. Of this church St. Jerome saith, “The church of Christ, which containeth the churches through all the world, is joined together in the unity of the spirit, and hath the cities of the law, of the Prophets, of the Gospel, and of the Apostles. This church goeth not forth, or beyond her bounds, that is, the holy Scriptures.”

It is the pillar of the truth, the body, the fulness, and the spouse of Christ; it is the vine, the house, the city, and the kingdom of God; they which dwell in it, are no more strangers and foreigners, but citizens with the saints, and of the household of God, and are built upon the foundation of the Apostles and Prophets; Jesus Christ himself being the head corner-stone, in whom all the building coupled together, groweth into an holy temple in the Lord. This church Christ loved, and gave himself for it, that he might sanctify it, and cleanse it by the washing of water through the word; that he might make it unto himself a glorious church, not having spot or wrinkle, or any such thing, but that it should be holy, and without blame. (Eph. v.)

Such a church was the church of God at Thessalonica; such a church are they, whosoever in any place of the world fear the Lord, and call upon his name; their names are written in the book of life; they have received the spirit of adoption, by which they cry Abba, Father; they grow from grace to grace, and abound more and more in knowledge and in judgment; they cast away the works of darkness, and put on the armour of light; they are made absolute and perfect unto all good works; they are evermore comforted in the mercies of God, both by the holy Scriptures, wherein God declareth his gracious goodness towards them, and by the sacraments, which are left unto the church to be witnesses and assured pledges for performance of the promises of God’s good will and favour towards them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 10-11.</span></figcaption>

</figure><figure class="quote" id="q-2e9436ec60" data-kw="">
<blockquote><p>By the worship of God inquired after [in this treatise], not that which is natural or moral, which is required in the First Commandment is intended. Such is our faith and confidence in Him, our fear of Him, our subjection of soul and conscience unto Him as the great Soveraign Lord, first cause, last end, Judge and Rewarder of all men; the Law whereof was originally written in the heart of man, and has been variously improved and directed by new revelations and institutions. And this worship is called natural upon a double account. First, because it depends on the nature of God, a due perception and understanding whereof makes all this worship indispensibly necessary: for none can know God but it is his duty to glorify Him as God, that is, to believe in Him, love Him, trust Him, and call upon Him, which all are therefore cursed that do not, Ps. 79:6; 2 Thess. 1:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667) | Question 1, pp. 1-2</span></figcaption>

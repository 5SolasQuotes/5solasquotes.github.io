<main class="wrap"><figure class="quote" id="q-ed78a83018" data-kw="">
<blockquote><p>What should the old Creature do in Heaven? Heaven would be no Heaven to him: the Heavenly Jerusalem is another kind of thing then most take it to be. What wild, bald Conceptions have sensual Sots of Heaven? as though it were Mahomet‘s Paradise, or Heathens Elysian Fields, wherein Men may only gratify their Senses, or wallow in Pleasures: Alas, a Man may say to these ignorant Souls, as our Lord to Zebedee‘s Children, You know not what you ask. You would go to Heaven, yes, fain you would be saved, but do you know what Heaven is? I will tell you briefly, Heaven consists in a freedom from all Sin, a perfection of Grace, enjoyment of God, employment in divine Praises, love, delight in God, meditation on God, Ecstasies and Ravishment of all the Soul’s Faculties in immediate communion with him:

And what awkward Conceptions hath a carnal Heart of these blessed Privileges? They would be no advantage to him at all, but a torment, to him that hates God, runs from him, cannot abide to come near him in any Duty, likes not the Society of God’s Saints, delights in sinful Practices, dallies with Satan’s Temptations: Can men imagine they shall take Cards and Dice, Cups and Queens with them to Heaven? Nay, can Men take fair Houses, full Bags, or worldly Business into another world? Can men make great Purchases, gather great Rents, or break Jests with their Companions in a future state?

Alas, a poor carnal heart is weary of Duties, much more will he be in Heaven; Sermon is too long, Prayer is tedious, when will the Sabbath be gone? Can these be fit to enjoy God in an eternal Sabbath of rest? nay, the poor guilty Sinner cares not for coming near to God, the Sight of God is terrible to him, as it was to fallen Adam: indeed without converting Grace, introducing this New Creature and Divine Nature, the Soul would be altogether strange to God, and any converse with an holy, glorious God; yea, even the sanctified themselves, by reason of the Remainders of Corruption in them, have much ado to bring their Hearts to converse with God, especially when they lie under the sense of Guilt, even a Godly Peter then crys out, Depart from me, for I am a sinful man, O Lord, Luk. 5.8.

Much more will a graceless Soul not dare to come near to God; an Hypocrite shall not come before him Job 13.16. He will not, and God will not suffer him: but a gracious Heart can truly say, It is good for me to draw nigh to God, Psal. 73.28. Communion with God is his Heaven upon Earth: Therefore this God will be his Salvation, himself is his best Heaven: but a carnal Heart knows not what this means, and is therefore uncapable of Heaven.</p></blockquote>

</figure><figure class="quote" id="q-fc149ce3ee" data-kw="">
<blockquote><p>And although there be many curious persons which think those times to be most happy, in the which God by so many ways spake unto the fathers, and doe affirm that they would more willingly believe the word of God, if so be it would please him to talk with them after that fashion. Notwithstanding, if we well consider of the matter, now that Christ is come, and hath published his Gospel throughout the whole world, we must needs confess, that the times are much more happy, than they were in times past. For God hath spoken with us, not by Angel, not by dreams, or visions, but by his own son our Lord, and Saviour Jesus Christ, who by his divine majesty excelleth all Angels. Whereupon in the Epistle to the Hebrews it is written. In these last days God hath spoken unto us by his son, whom he hath appointed heir of all things.

And Christ himself saith: Blessed are the eyes which see those things that ye see. And straight after he addeth saying: many have desired to see those things that ye see, and have not seen them. And the Apostle Paul saith: Now salvation is nearer unto us than it was then. For seeing that the son of God is commended unto us by the voice of God from heaven, saying: This is my beloved son, hear him. He is most happy which so heareth him by his Gospel, that by faith he comprehendeth the same, &amp; obeyeth his calling. For whosoever he be that believeth not this son of God, he will not believe, though all the Angels in heaven, all the Patriarchs, all the Prophets and fathers stood before him to testify of the word of God. Wherefore, let us not neglect the felicity and happiness of our time, but let us attend and give ear to the voice of the son of God, whereby we may obtain everlasting salvation.</p></blockquote>

<blockquote><p>It is a vain speculation, contrary to the analogy of faith, and destructive or the true nature of the oblation of Christ, and inconsistent with the dignity of his person, that he should carry with him into heaven a part of that material blood which was shed for us on the earth. This some have invented, to maintain a comparison in that wherein is none intended.

The design of the apostle is only to declare by virtue of what he entered as a priest into the holy place. And this was by virtue of his own blood when it was shed, when he offered himself unto God. This was that which the foundation of, and gave him right unto the administration of his priestly office in heaven. And hereby were all those good things procured which he effectually communicates unto us in and by that administration.</p></blockquote>

<blockquote><p>The love of friendship is so called (not as if it were the habit of friendship it self, but) because it is that kind, or act of love, whereby we prosecute or follow one, whom we look upon, and love as a friend; and to whom we wish good. Now this kind (or rather degree) of love, is in the love of Christ to believers; Christ looks upon, and loves all believers as friends; hence it is, that he counts, and calls them all by that name, ye are my friends, Joh. 15.14. And that this is real, appears by his dealing with them.

Therefore it is added, Henceforth I call you not servants; for the servant knoweth not what his Lord doth: but I have called you friends; for all things that I have heard of the Father, I have made known unto you, ver. 15. Those whom we love as friends, we open our minds unto; and it is their privilege, we communicate to them secrets which we have heard. Christ dealeth thus with believers, and thus dealing, doth not he declare to them the love of friendship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-durant.html">John Durant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A discovery of glorious love, or, The love of Christ to believers opened, in the truth, transcendency, and sweetness thereof together with the necessity that lies upon every believer, to strive after the spiritual and experimental knowledge of it: being the sum of VI sermons preached upon Ephesians </cite>, (London: W. Gilbertson, 1655), p. 49.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3ea2fb135" data-kw="">
<blockquote><p>The true aim of the Holy profession is, to shew forth unto this evil world, the life and virtues of him who hath called us unto his Kingdom and glory. The Truth which we know, and which by the Gospel is revealed unto us, is the testimony of Jesus; that in him alone there is Redemption from all sins; that by him alone there is all sufficiency of Grace to be received through Faith; that for his sake alone we have free access by the Spirit unto the Father; that the titles and names of King, Captain, and Forerunner, of Apostle, Prophet and High Priest, of Author and Finisher of our salvation, do belong to him alone: and that he being alone the Way, the Truth and the Life, no man can come to the Father but by him; this we do know and acknowledge; this wee doe maintain and profess as the Truth: but who can say that the true aim of this profession, is taken up and followed as it ought to be? this aim is to follow him as dear children, expressing him in his life, that is, in his lowly, just, holy, and unblameable conversation amongst men; and in his death; that is, in his mortified, his self-denying, his afflicted, his meek and humble condition in this world.

I say, this aim is not taken up and maintained in this profession of the Truth; yet we know that this should be our whole aim; and because we know it, and doe it not, therefore our sin is heavy upon us; therefore these judgements do overtake us, and God doth revenge the quarrel of his Covenant against us; The Covenant is, that we being in Christ shall bear his Cross, and follow him; that we shall suffer together, and be separate from the world with him; and if we touch not the unclean things thereof, we have a promise that the Father will receive us.

But who is it that doth truly aim at a full separation from the world, and doth not intend to uphold the high things and full enjoyments thereof together with the profession of the Truth? are we not content, and have we not a desire to enjoy the fashion of things present, although we know that we are called to seek and apprehend only the things to come? we are called to be conformable unto the image of the Son of God; that is, to be no ways conformable unto this world: but if we mind no such thing, how can we be said to maintain the true aim of our holy profession?

The Socinians who have cast off the Truth which is in Christ Jesus concerning our Justification before God, and have made the acknowledgement of his Person in the Truth, void, by their Heresies; these uphold still the aim of the profession, namely, that we must follow his foot-steps: but wee who are convicted of the truth which they have denied, seem to deny (at least in our practice) that which they uphold; and consequently make the truth it self which we acknowledge, ineffectual, by our profession thereof; because our aim is not in simplicity answerable, but rather cross in all appearance unto the tenor of the new Covenant, and the end of our heavenly calling.

Now if the main and principal aim be lost in our walking with God; how can he be at peace with us, or we with him? can two walk together except they be agreed? and are those agreed whose aims are different? doth not he know the secrets of all hearts, that he may reward every one according to his works? what then can we expect from him other, then to reap the fruit of the seed which we sow? for we sow to the flesh worldly aims in the field of a religious profession; and can we expect any other harvest from thence but trouble and confusion? This then is the first and main cause of all our distractions, that the true aim of our Profession is for the most part lost amongst us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A model of church-government: or, The grounds of the spiritual frame and government of the house of God. Shewing, what the holy Scriptures have therein delivered; what the best Reformed Churches do practise; what the tender consciences may rest in. For the better satisfaction of such as scruple at t</cite>, (London: John Bellamy, 1647), preface to the reader.</span></figcaption>

</figure><figure class="quote" id="q-93c6663cc1" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind… so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible, on Mt</cite>, 5:44-45</span></figcaption>

<blockquote><p>As we expect our Lord shortly to come, and to put down the blasphemous usurpers who have arrogated his prerogatives, and oppressed his faithful subjects, we should everywhere loudly and boldly proclaim, as did the remnant of Scotland’s martyred children, “Let King Jesus reign.” We should seek to bring the King back; and claim that not only in his Church, his blood-bought inheritance, but throughout the nations, and in every department of the State, He should be acknowledged as supreme – his sceptre submitted to, and his laws obeyed.</p></blockquote>

<blockquote><p>Remedy (2). Seriously to consider, That the giving way to a less sin makes way for the committing of a greater. He that, to avoid a greater sin, will yield to a lesser, ten thousand to one but God in justice will leave that soul to fall into a greater. If we commit one sin to avoid another, it is just we should avoid neither, we having not law nor power in our own hands to keep off sin as we please; and we, by yielding to the lesser, do tempt the tempter to tempt us to the greater. Sin is of an encroaching nature; it creeps on the soul by degrees, step by step, till it hath the soul to the very height of sin.

David gives way to his wandering eye, and this led him to those foul sins that caused God to break his bones, and to turn his day into night, and to leave his soul in great darkness. Jacob and Peter, and other saints, have found this true by woful experience, that the yielding to a lesser sin hath been the ushering in of a greater. The little thief will open the door, and make way for the greater, and the little wedge knocked in will make way for the greater. Satan will first draw thee to sit with the drunkard, and then to sip with the drunkard, and then at last to be drunk with the drunkard. He will first draw thee to be unclean in thy thoughts, and then to be unclean in thy looks, and then to be unclean in thy words, and at last to be unclean in thy practices.

He will first draw thee to look upon the golden wedge, and then to like the golden wedge, and then to handle the golden wedge, and then at last by wicked ways to gain the golden wedge, though thou runnest the hazard of losing God and thy soul for ever; as you may see in Gehazi, Achan, and Judas, and many in these our days. Sin is never at a stand: Ps. i. 1, first ungodly, then sinners, then scorners. Here they go on from sin to sin, till they come to the top of sin, viz. to sit in the seat of scorners, or as it is in the Septuagint … to affect the honour of the chair of pestilence.

Austin [Augustine of Hippo], writing upon John, tells a story of a certain man, that was of an opinion that the devil did make the fly, and not God. Saith one to him, If the devil made flies, then the devil made worms, and God did not make them, for they are living creatures as well as flies. True, said he, the devil did make worms. But, said the other, if the devil did make worms, then he made birds, beasts, and man. He granted all. Thus, saith Austin, by denying God in the fly, became to deny God in man, and to deny the whole creation.

By all this we see, that the yielding to lesser sins, draws the soul to the committing of greater. Ah! how many in these days have fallen, first to have low thoughts of Scripture and ordinances, and then to slight Scripture and ordinances, and then to make a nose of wax of Scripture and ordinances, and then to cast off Scripture and ordinances, and then at last to advance and lift up themselves, and their Christ-dishonouring and soul-damning opinions, above Scripture and ordinances. Sin gains upon man’s soul by insensible degrees: Eccles. x. 13, ‘The beginning of the words of his mouth is foolishness, and the end of his talking is mischievous madness.’

Corruption in the heart, when it breaks forth, is like a breach in the sea, which begins in a narrow passage, till it eat through, and cast down all before it. The debates of the soul are quick, and soon ended, and that may be done in a moment that may undo a man for ever. When a man hath begun to sin, he knows not where, or when, or how he shall make a stop of sin. Usually the soul goes on from evil to evil, from folly to folly, till it be ripe for eternal misery. Men usually grow from being naught to be very naught, and from very naught to be stark naught, and then God sets them at nought for ever.</p></blockquote>

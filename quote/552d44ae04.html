<blockquote><p>The violated covenant of works, as I observed above, was not, and could not be, made or renewed with the Israelites at Sinai: for it was a broken covenant, and besides, it was a covenant between God and man as friends, whereas now, man is become the enemy of God. But though it was not renewed with them, yet it was, on that solemn occasion, repeated and displayed to them. It was not proposed to them, in order that they might consent, by their own works, to fulfil the condition of it; but it was displayed before them, in subservience to the covenant of grace, that they might see how impossible it was for them as condemned sinners, to perform that perfect obedience, which is the immutable condition of life in it. Although the Lord knew well, that they were far from being able to yield perfect obedience; yet he saw proper, to set forth eternal life to them upon these terms; and so, to speak to them, in a strain adapted to their self-righteous temper. For, previous to the giving of the law to them at Sinai, they were so ignorant of the perfection, and vast extent of that holy law, as well as of their own utter inability, to perform the smallest acceptable obedience to it; and at the same time, they were so full of self-confidence, as to say to Moses, “All that the Lord hath spoken, we will do.” God, therefore, displayed on mount Sinai, the law of the ten commandments as a covenant of works, in subservience to the covenant of grace. He displayed it in that form, in order that the people might, by contemplating it, see what kind and degree of righteousness it required, as the condition of eternal life; and that by means of it, finding themselves utterly destitute of perfect righteousness, they might be impelled to take hold of the covenant of grace, in which, the perfect righteousness of the second Adam, is provided and exhibited, for the justification of all who believe. Now, that the law of the ten commandments as a covenant of works, was repeated and displayed on mount Sinai, in subservience to the covenant of grace, appears evident, 1. From the thunderings and lightnings, the noise of the trumpet, and the mountain smoking, the thick darkness, and the voice of the living God, speaking out of the midst of the fire, on that awful occasional. These terrible emblems, signified the vindictive and tremendous wrath of God, which is due to all the race of Adam, for their breach of the covenant of works, by transgressing the law of that covenant. They represented also the extreme danger, to which, every sinner who continues under the law in its covenant form, is exposed; as being liable, every moment, to the eternal execution of its dreadful curse. This awful display of the law as a covenant of works, though it was not the principal, yet was the most conspicuous part of the Sinai transaction: for “the people saw the thunderings and the lightnings, and the noise of the trumpet, and the mountain smoking.” “And so terrible was the sight, that Moses said, I exceedingly fear and quake.” Now, the covenant of works was displayed, in this tremendous form, before the Israelites; in order that self-righteous and secure sinners among them, might be alarmed, and deterred from expecting justification in the sight of God, by the works of the law; and that, convinced of their sinfulness and misery, they might be persuaded, to flee speedily to the blessed Mediator, and to trust in Him for righteousness and salvation. That terrible display, accordingly, contributed in some measure, to humble them, to lessen that self-confidence which they had formerly discovered, and to show them their need of the Divine Redeemer, and of union with him by faith, in order to their being qualified for performing acceptable obedience. This appears from their own words to Moses, after the dreadful sight which they beheld: “Speak thou unto us,” said they, “all that the Lord our God shall speak unto thee, and we will hear and do.” Standing afar off, they do not say, as they did, before the publication of the law at Sinai, “All that the Lord hath spoken, we will do;” but,—” We will hear and do:” “We will first hear or believe, and then do.” For speaking in this strain, the Lord commended them thus: “They have well said all that they have spoken. O that there were such an heart in them!” They said well, in that they made hearing or believing, the principle of acceptable obedience. The law then, as it is the covenant of works, entered at Sinai, “that the offence might abound,” not in the life by the commission of it, but in the conscience by conviction: it entered, that it might be their “school-master to bring them unto Christ, that they might be justified by faith.”

2. That the law as a covenant of works, was displayed on mount Sinai, appears also from this: That the ten commandments, written on tables of stone, and so given to Moses on Sinai, are, by the apostle Paul, styled, “the ministration of death, written and engraven in stones.” Now it is manifest, that these commandments are no otherwise the ministration of death, than as they are in the form of the covenant of works. In this form, they were delivered to Moses, to be deposited in the ark; in order to prefigure, the fulfilling of them by Messiah, “the Surety of a better covenant,” and the concealing of that form, or the removal of it from them, to all who should believe in Him.

3. The moral law, as it was delivered from mount Sinai, is, in Scripture, expressly styled a covenant. These are the two covenants; the one from the mount Sinai. The law, in that promulgation of it, was such a covenant, as had the appearance through misapprehension of its design, of disannulling the covenant of grace, made with Abraham. “The covenant,” says the apostle Paul, “that was confirmed before of God in Christ, the law, which was four hundred and thirty years after, cannot disannul, that it should make the promise of none effect.” The law, included a way of obtaining a title to the heavenly inheritance, typified by that of Canaan, so very different from that of the promise made to Abraham, as to be incompatible with it. “For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.” The covenant of the law from mount Sinai, then, was the covenant of works; which contains a method of obtaining the inheritance, inconsistent with that of the promise; but which cannot disannul the promise, or covenant of grace. Besides, Moses, speaking of that law under the denomination of a covenant, affirms that, it was not made with the Patriarchs, or displayed publicly before them. “The Lord our God, says he, made a covenant with us in Horeb: the Lord made not this covenant, with our fathers, but with us.” This covenant displayed on Sinai, then, was not the covenant of promise, made with the fathers of the Israelitish people.

4. The covenant of works is, in the New Testament, introduced, and illustrated from the law as given by Moses. Our blessed Lord, in replying to one who asked him, What good thing he should do, that he might have eternal life, said, “If thou wilt enter into life, keep the commandments; namely, Thou shalt do no murder, Thou shalt not commit adultery, Thou shalt not steal, Thou shalt not bear false witness, Honour thy father and thy mother, &amp;c.” These being some of the commandments, promulgated from mount Sinai, our Lord repeats them to him, in the form of the covenant of works. And the apostle Paul, when mentioning the promise of the covenant of works, says, “Moses describeth the righteousness which is of the law, That the man which doeth those things, shall live by them.” In expressing also the penal sanction of that covenant, he says, “As many as are of the works of the law, are under the curse: for it is written, Cursed is every one that continueth not in all things, which are written in the book of the law, to do them.” That a conditional promise, then, and a dreadful curse, as well as the ten commandments, were published to the Israelites, is plain; and it is no less evident, that, according to our Apostle in the passages cited above, they are the form of the covenant of works.

5. That the law in the form of a covenant of works, was displayed on mount Sinai, appears likewise, from the opposition between the law and grace, often mentioned and inculcated in the New Testament. We there read that, “The law was given by Moses, but grace and truth came by Jesus Christ;” and that, “The law is not of faith; but, The man that doeth them shall live in them.” But it is, in its covenant form only, that the law in Scripture, is contrasted with grace.

6. In the Sinaitic transaction, the hewing of the latter tables of stone by Moses, before God wrote the ten commandments on them, might be intended to teach sinners, that they must be convinced of their sin and misery, by the law as a covenant of works, before it can be written legibly on their hearts, as a rule of life.

7. Lastly, The same also appears, from these words of the apostle Paul, cited above, “These are the two covenants; the one from the mount Sinai, which gendereth to bondage.” The covenant which gendereth to bondage, is, the covenant of works made with Adam, as the head and representative of all its natural posterity, and displayed on mount Sinai to the Israelites. This covenant gendereth to bondage; for, according to the Apostle, the children of it, or they who are under it, are excluded from the heavenly inheritance, as Ishmael was, from Canaan the typical and earthly inheritance. “Cast out the bond-woman and her son: for the son of the bondwoman, shall not be heir with the son of the free woman.” The generating of bond-children, excluded from the heavenly inheritance, is a distinguishing property of the covenant of works; and it cannot be a property of the covenant of grace, under any of its dispensations. It is the covenant of works only, that has a tendency, to beget a servile and slavish frame of spirit. It is evident, then, that the covenant of works was displayed on mount Sinai. It was there displayed, together with the covenant of grace, in order to subserve the latter; and particularly, to represent to the Israelitish church, that the discharging of the principal and penalty of the covenant of works, was to be required of Messiah, the Surety of elect sinners, as the proper condition of the covenant of grace. Although the Sinaitic transaction, was a mixed dispensation; yet the covenant of grace and the covenant of works, were not blended together in it. The latter as well as the ceremonial law, was added to the former; and was added to it, in order that, the Israelites might be so convinced of their sinfulness and misery, as to see their extreme need of embracing the promise, or covenant of grace. God, says the apostle Paul, “gave the inheritance to Abraham by promise. Wherefore then serveth the law? It was added because of transgressions, till the seed should come to whom the promise was made.” The promise, made to Abraham and to his seed, we have found in the preface to the ten commandments. To this promise or covenant of grace, then, was the law or subservient covenant of works, added. It formed no part of the covenant of grace, which had been a covenant entire to the Patriarchs, before that was added to it at Sinai; and it is a covenant entire to believers under the gospel, after that is removed from it: for our Apostle says, “It was added till the seed should come.” Accordingly, the ten commandments as promulgated from mount Sinai, must be considered at least, in a two-fold point of view: namely, as the law of Christ, or the law as a rule of life to believers, and, as the law as it is the matter of a covenant of works, to unregenerate sinners. This I humbly apprehend, is intimated to us, by their having been twice written on tables of stone, by God himself, and, by the double accentuation of them, in the sacred Original. In the Sinai transaction, then, the promise or covenant of grace, was published to the Israelites, and the law or covenant of works also, as subservient to it. The former was and still is, a covenant to be believed or embraced by faith; the latter, a covenant to be done or fulfilled. The apostle Paul, accordingly, contrasts the one with the other, thus; “The law is not of faith: but the man that doeth them, shall live in them.” The-covenant to be embraced by faith, was given to the fathers of the Israelites, as well as to themselves; but concerning the covenant to be done, Moses said to them, “The Lord made not this covenant with our fathers, but with us.” And again, “The Lord spake unto you out of the midst of the fire;—and he declared unto you his covenant, which he commanded you to perform, even ten commandments.” Although the same covenant of works, that was made with Adam, was displayed from mount Sinai; yet it was, for a very different purpose. God’s design, in making this covenant with Adam, was, to have that righteousness which was due to him, from man: but his great design, in displaying it to Israel at Sinai, was, that they, by contemplating it, might see what kind and degree of righteousness, it was, by which they could be justified before God; and that, finding themselves wholly destitute of that righteousness, they might be excited to take hold of the covenant of grace, in which, a perfect righteousness for justification, is graciously provided. Should the attentive reader now ask, Seeing the covenant of grace, and also that of works, were both repeated from mount Sinai, were not the Israelites under both these covenants, at one and the same time? I would answer; They could not be under both, at the same time, and in the same respects. The believers among them, as I hinted above, were internally and really, under the covenant of grace, and only externally, under that terrible display of the covenant of works, as it was subservient to that of grace; whereas, the unbelievers, were externally and by profession only, under that dispensation of the covenant of grace, but were internally and really, under the covenant of works.</p></blockquote>

hey+might+be+impelled+to+take+hold+of+the+covenant+of+grace%2C+in+which%2C+the+perfect+righteousness+of+the+second+Adam%2C+is+provided+and+exhibited%2C+for+the+justification+of+all+who+believe.+Now%2C+that+the+law+of+the+ten+commandments+as+a+covenant+of+works%2C+was+repeated+and+displayed+on+mount+Sinai%2C+in+subservience+to+the+covenant+of+grace%2C+appears+evident%2C+1.+From+the+thunderings+and+lightnings%2C+the+noise+of+the+trumpet%2C+and+the+mountain+smoking%2C+the+thick+darkness%2C+and+the+voice+of+the+living+God%2C+speaking+out+of+the+midst+of+the+fire%2C+on+that+awful+occasional.+These+terrible+emblems%2C+signified+the+vindictive+and+tremendous+wrath+of+God%2C+which+is+due+to+all+the+race+of+Adam%2C+for+their+breach+of+the+covenant+of+works%2C+by+transgressing+the+law+of+that+covenant.+They+represented+also+the+extreme+danger%2C+to+which%2C+every+sinner+who+continues+under+the+law+in+its+covenant+form%2C+is+exposed%3B+as+being+liable%2C+every+moment%2C+to+the+eternal+execution+of+its+dreadful+curse.+This+awful+display+of+the+law+as+a+covenant+of+works%2C+though+it+was+not+the+principal%2C+yet+was+the+most+conspicuous+part+of+the+Sinai+transaction%3A+for+%E2%80%9Cthe+people+saw+the+thunderings+and+the+lightnings%2C+and+the+noise+of+the+trumpet%2C+and+the+mountain+smoking.%E2%80%9D+%E2%80%9CAnd+so+terrible+was+the+sight%2C+that+Moses+said%2C+I+exceedingly+fear+and+quake.%E2%80%9D+Now%2C+the+covenant+of+works+was+displayed%2C+in+this+tremendous+form%2C+before+the+Israelites%3B+in+order+that+self-righteous+and+secure+sinners+among+them%2C+might+be+alarmed%2C+and+deterred+from+expecting+justification+in+the+sight+of+God%2C+by+the+works+of+the+law%3B+and+that%2C+convinced+of+their+sinfulness+and+misery%2C+they+might+be+persuaded%2C+to+flee+speedily+to+the+blessed+Mediator%2C+and+to+trust+in+Him+for+righteousness+and+salvation.+That+terrible+display%2C+accordingly%2C+contributed+in+some+measure%2C+to+humble+them%2C+to+lessen+that+self-confidence+which+they+had+formerly+discovered%2C+and+to+show+them+their+need+of+the+Divine+Redeemer%2C+and+of+union+with+him+by+faith%2C+in+order+to+their+being+qualified+for+performing+acceptable+obedience.+This+appears+from+their+own+words+to+Moses%2C+after+the+dreadful+sight+which+they+beheld%3A+%E2%80%9CSpeak+thou+unto+us%2C%E2%80%9D+said+they%2C+%E2%80%9Call+that+the+Lord+our+God+shall+speak+unto+thee%2C+and+we+will+hear+and+do.%E2%80%9D+Standing+afar+off%2C+they+do+not+say%2C+as+they+did%2C+before+the+publication+of+the+law+at+Sinai%2C+%E2%80%9CAll+that+the+Lord+hath+spoken%2C+we+will+do%3B%E2%80%9D+but%2C%E2%80%94%E2%80%9D+We+will+hear+and+do%3A%E2%80%9D+%E2%80%9CWe+will+first+hear+or+believe%2C+and+then+do.%E2%80%9D+For+speaking+in+this+strain%2C+the+Lord+commended+them+thus%3A+%E2%80%9CThey+have+well+said+all+that+they+have+spoken.+O+that+there+were+such+an+heart+in+them%21%E2%80%9D+They+said+well%2C+in+that+they+made+hearing+or+believing%2C+the+principle+of+acceptable+obedience.+The+law+then%2C+as+it+is+the+covenant+of+works%2C+entered+at+Sinai%2C+%E2%80%9Cthat+the+offence+might+abound%2C%E2%80%9D+not+in+the+life+by+the+commission+of+it%2C+but+in+the+conscience+by+conviction%3A+it+entered%2C+that+it+might+be+their+%E2%80%9Cschool-master+to+bring+them+unto+Christ%2C+that+they+might+be+justified+by+faith.%E2%80%9D+2.+That+the+law+as+a+covenant+of+works%2C+was+displayed+on+mount+Sinai%2C+appears+also+from+this%3A+That+the+ten+commandments%2C+written+on+tables+of+stone%2C+and+so+given+to+Moses+on+Sinai%2C+are%2C+by+the+apostle+Paul%2C+styled%2C+%E2%80%9Cthe+ministration+of+death%2C+written+and+engraven+in+stones.%E2%80%9D+Now+it+is+manifest%2C+that+these+commandments+are+no+otherwise+the+ministration+of+death%2C+than+as+they+are+in+the+form+of+the+covenant+of+works.+In+this+form%2C+they+were+delivered+to+Moses%2C+to+be+deposited+in+the+ark%3B+in+order+to+prefigure%2C+the+fulfilling+of+them+by+Messiah%2C+%E2%80%9Cthe+Surety+of+a+better+covenant%2C%E2%80%9D+and+the+concealing+of+that+form%2C+or+the+removal+of+it+from+them%2C+to+all+who+should+believe+in+Him.+3.+The+moral+law%2C+as+it+was+delivered+from+mount+Sinai%2C+is%2C+in+Scripture%2C+expressly+styled+a+covenant.+These+are+the+two+covenants%3B+the+one+from+the+mount+Sinai.+The+law%2C+in+that+promulgation+of+it%2C+was+such+a+covenant%2C+as+had+the+appearance+through+misapprehension+of+its+design%2C+of+disannulling+the+covenant+of+grace%2C+made+with+Abraham.+%E2%80%9CThe+covenant%2C%E2%80%9D+says+the+apostle+Paul%2C+%E2%80%9Cthat+was+confirmed+before+of+God+in+Christ%2C+the+law%2C+which+was+four+hundred+and+thirty+years+after%2C+cannot+disannul%2C+that+it+should+make+the+promise+of+none+effect.%E2%80%9D+The+law%2C+included+a+way+of+obtaining+a+title+to+the+heavenly+inheritance%2C+typified+by+that+of+Canaan%2C+so+very+different+from+that+of+the+promise+made+to+Abraham%2C+as+to+be+incompatible+with+it.+%E2%80%9CFor+if+the+inheritance+be+of+the+law%2C+it+is+no+more+of+promise%3A+but+God+gave+it+to+Abraham+by+promise.%E2%80%9D+The+covenant+of+the+law+from+mount+Sinai%2C+then%2C+was+the+covenant+of+works%3B+which+contains+a+method+of+obtaining+the+inheritance%2C+inconsistent+with+that+of+the+promise%3B+but+which+cannot+disannul+the+promise%2C+or+covenant+of+grace.+Besides%2C+Moses%2C+speaking+of+that+law+under+the+denomination+of+a+covenant%2C+affirms+that%2C+it+was+not+made+with+the+Patriarchs%2C+or+displayed+publicly+before+them.+%E2%80%9CThe+Lord+our+God%2C+says+he%2C+made+a+covenant+with+us+in+Horeb%3A+the+Lord+made+not+this+covenant%2C+with+our+fathers%2C+but+with+us.%E2%80%9D+This+covenant+displayed+on+Sinai%2C+then%2C+was+not+the+covenant+of+promise%2C+made+with+the+fathers+of+the+Israelitish+people.+4.+The+covenant+of+works+is%2C+in+the+New+Testament%2C+introduced%2C+and+illustrated+from+the+law+as+given+by+Moses.+Our+blessed+Lord%2C+in+replying+to+one+who+asked+him%2C+What+good+thing+he+should+do%2C+that+he+might+have+eternal+life%2C+said%2C+%E2%80%9CIf+thou+wilt+enter+into+life%2C+keep+the+commandments%3B+namely%2C+Thou+shalt+do+no+murder%2C+Thou+shalt+not+commit+adultery%2C+Thou+shalt+not+steal%2C+Thou+shalt+not+bear+false+witness%2C+Honour+thy+father+and+thy+mother%2C+%26c.%E2%80%9D+These+being+some+of+the+commandments%2C+promulgated+from+mount+Sinai%2C+our+Lord+repeats+them+to+him%2C+in+the+form+of+the+covenant+of+works.+And+the+apostle+Paul%2C+when+mentioning+the+promise+of+the+covenant+of+works%2C+says%2C+%E2%80%9CMoses+describeth+the+righteousness+which+is+of+the+law%2C+That+the+man+which+doeth+those+things%2C+shall+live+by+them.%E2%80%9D+In+expressing+also+the+penal+sanction+of+that+covenant%2C+he+says%2C+%E2%80%9CAs+many+as+are+of+the+works+of+the+law%2C+are+under+the+curse%3A+for+it+is+written%2C+Cursed+is+every+one+that+continueth+not+in+all+things%2C+which+are+written+in+the+book+of+the+law%2C+to+do+them.%E2%80%9D+That+a+conditional+promise%2C+then%2C+and+a+dreadful+curse%2C+as+well+as+the+ten+commandments%2C+were+published+to+the+Israelites%2C+is+plain%3B+and+it+is+no+less+evident%2C+that%2C+according+to+our+Apostle+in+the+passages+cited+above%2C+they+are+the+form+of+the+covenant+of+works.+5.+That+the+law+in+the+form+of+a+covenant+of+works%2C+was+displayed+on+mount+Sinai%2C+appears+likewise%2C+from+the+opposition+between+the+law+and+grace%2C+often+mentioned+and+inculcated+in+the+New+Testament.+We+there+read+that%2C+%E2%80%9CThe+law+was+given+by+Moses%2C+but+grace+and+truth+came+by+Jesus+Christ%3B%E2%80%9D+and+that%2C+%E2%80%9CThe+law+is+not+of+faith%3B+but%2C+The+man+that+doeth+them+shall+live+in+them.%E2%80%9D+But+it+is%2C+in+its+covenant+form+only%2C+that+the+law+in+Scripture%2C+is+contrasted+with+grace.+6.+In+the+Sinaitic+transaction%2C+the+hewing+of+the+latter+tables+of+stone+by+Moses%2C+before+God+wrote+the+ten+commandments+on+them%2C+might+be+intended+to+teach+sinners%2C+that+they+must+be+convinced+of+their+sin+and+misery%2C+by+the+law+as+a+covenant+of+works%2C+before+it+can+be+written+legibly+on+their+hearts%2C+as+a+rule+of+life.+7.+Lastly%2C+The+same+also+appears%2C+from+these+words+of+the+apostle+Paul%2C+cited+above%2C+%E2%80%9CThese+are+the+two+covenants%3B+the+one+from+the+mount+Sinai%2C+which+gendereth+to+bondage.%E2%80%9D+The+covenant+which+gendereth+to+bondage%2C+is%2C+the+covenant+of+works+made+with+Adam%2C+as+the+head+and+representative+of+all+its+natural+posterity%2C+and+displayed+on+mount+Sinai+to+the+Israelites.+This+covenant+gendereth+to+bondage%3B+for%2C+according+to+the+Apostle%2C+the+children+of+it%2C+or+they+who+are+under+it%2C+are+excluded+from+the+heavenly+inheritance%2C+as+Ishmael+was%2C+from+Canaan+the+typical+and+earthly+inheritance.+%E2%80%9CCast+out+the+bond-woman+and+her+son%3A+for+the+son+of+the+bondwoman%2C+shall+not+be+heir+with+the+son+of+the+free+woman.%E2%80%9D+The+generating+of+bond-children%2C+excluded+from+the+heavenly+inheritance%2C+is+a+distinguishing+property+of+the+covenant+of+works%3B+and+it+cannot+be+a+property+of+the+covenant+of+grace%2C+under+any+of+its+dispensations.+It+is+the+covenant+of+works+only%2C+that+has+a+tendency%2C+to+beget+a+servile+and+slavish+frame+of+spirit.+It+is+evident%2C+then%2C+that+the+covenant+of+works+was+displayed+on+mount+Sinai.+It+was+there+displayed%2C+together+with+the+covenant+of+grace%2C+in+order+to+subserve+the+latter%3B+and+particularly%2C+to+represent+to+the+Israelitish+church%2C+that+the+discharging+of+the+principal+and+penalty+of+the+covenant+of+works%2C+was+to+be+required+of+Messiah%2C+the+Surety+of+elect+sinners%2C+as+the+proper+condition+of+the+covenant+of+grace.+Although+the+Sinaitic+transaction%2C+was+a+mixed+dispensation%3B+yet+the+covenant+of+grace+and+the+covenant+of+works%2C+were+not+blended+together+in+it.+The+latter+as+well+as+the+ceremonial+law%2C+was+added+to+the+former%3B+and+was+added+to+it%2C+in+order+that%2C+the+Israelites+might+be+so+convinced+of+their+sinfulness+and+misery%2C+as+to+see+their+extreme+need+of+embracing+the+promise%2C+or+covenant+of+grace.+God%2C+says+the+apostle+Paul%2C+%E2%80%9Cgave+the+inheritance+to+Abraham+by+promise.+Wherefore+then+serveth+the+law%3F+It+was+added+because+of+transgressions%2C+till+the+seed+should+come+to+whom+the+promise+was+made.%E2%80%9D+The+promise%2C+made+to+Abraham+and+to+his+seed%2C+we+have+found+in+the+preface+to+the+ten+commandments.+To+this+promise+or+covenant+of+grace%2C+then%2C+was+the+law+or+subservient+covenant+of+works%2C+added.+It+formed+no+part+of+the+covenant+of+grace%2C+which+had+been+a+covenant+entire+to+the+Patriarchs%2C+before+that+was+added+to+it+at+Sinai%3B+and+it+is+a+covenant+entire+to+believers+under+the+gospel%2C+after+that+is+removed+from+it%3A+for+our+Apostle+says%2C+%E2%80%9CIt+was+added+till+the+seed+should+come.%E2%80%9D+Accordingly%2C+the+ten+commandments+as+promulgated+from+mount+Sinai%2C+must+be+considered+at+least%2C+in+a+two-fold+point+of+view%3A+namely%2C+as+the+law+of+Christ%2C+or+the+law+as+a+rule+of+life+to+believers%2C+and%2C+as+the+law+as+it+is+the+matter+of+a+covenant+of+works%2C+to+unregenerate+sinners.+This+I+humbly+apprehend%2C+is+intimated+to+us%2C+by+their+having+been+twice+written+on+tables+of+stone%2C+by+God+himself%2C+and%2C+by+the+double+accentuation+of+them%2C+in+the+sacred+Original.+In+the+Sinai+transaction%2C+then%2C+the+promise+or+covenant+of+grace%2C+was+published+to+the+Israelites%2C+and+the+law+or+covenant+of+works+also%2C+as+subservient+to+it.+The+former+was+and+still+is%2C+a+covenant+to+be+believed+or+embraced+by+faith%3B+the+latter%2C+a+covenant+to+be+done+or+fulfilled.+The+apostle+Paul%2C+accordingly%2C+contrasts+the+one+with+the+other%2C+thus%3B+%E2%80%9CThe+law+is+not+of+faith%3A+but+the+man+that+doeth+them%2C+shall+live+in+them.%E2%80%9D+The-covenant+to+be+embraced+by+faith%2C+was+given+to+the+fathers+of+the+Israelites%2C+as+well+as+to+themselves%3B+but+concerning+the+covenant+to+be+done%2C+Moses+said+to+them%2C+%E2%80%9CThe+Lord+made+not+this+covenant+with+our+fathers%2C+but+with+us.%E2%80%9D+And+again%2C+%E2%80%9CThe+Lord+spake+unto+you+out+of+the+midst+of+the+fire%3B%E2%80%94and+he+declared+unto+you+his+covenant%2C+which+he+commanded+you+to+perform%2C+even+ten+commandments.%E2%80%9D+Although+the+same+covenant+of+works%2C+that+was+made+with+Adam%2C+was+displayed+from+mount+Sinai%3B+yet+it+was%2C+for+a+very+different+purpose.+God%E2%80%99s+design%2C+in+making+this+covenant+with+Adam%2C+was%2C+to+have+that+righteousness+which+was+due+to+him%2C+from+man%3A+but+his+great+design%2C+in+displaying+it+to+Israel+at+Sinai%2C+was%2C+that+they%2C+by+contemplating+it%2C+might+see+what+kind+and+degree+of+righteousness%2C+it+was%2C+by+which+they+could+be+justified+before+God%3B+and+that%2C+finding+themselves+wholly+destitute+of+that+righteousness%2C+they+might+be+excited+to+take+hold+of+the+covenant+of+grace%2C+in+which%2C+a+perfect+righteousness+for+justification%2C+is+graciously+provided.+Should+the+attentive+reader+now+ask%2C+Seeing+the+covenant+of+grace%2C+and+also+that+of+works%2C+were+both+repeated+from+mount+Sinai%2C+were+not+the+Israelites+under+both+these+covenants%2C+at+one+and+the+same+time%3F+I+would+answer%3B+They+could+not+be+under+both%2C+at+the+same+time%2C+and+in+the+same+respects.+The+believers+among+them%2C+as+I+hinted+above%2C+were+internally+and+really%2C+under+the+covenant+of+grace%2C+and+only+externally%2C+under+that+terrible+display+of+the+covenant+of+works%2C+as+it+was+subservient+to+that+of+grace%3B+whereas%2C+the+unbelievers%2C+were+externally+and+by+profession+only%2C+under+that+dispensation+of+the+covenant+of+grace%2C+but+were+internally+and+really%2C+under+the+covenant+of+works.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+on+the+Law+and+Gospel%2C+%28Grand+Rapids%3A+Reformation+Heritage+Books%29%2C+55ff&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F552d44ae04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/552d44ae04.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/12/colquhoun-on-the-twofold-nature-of-the-mosaic-covenant/" <blockquote><p>Because his treatise appeared during the sitting of the Westminster Assembly, just at the time when it set itself to framing the confession, and because it moreover borrowed from Ball in the standards, one naturally supposes that his influence can be detected in its formulation of the doctrine of the covenant.</p></blockquote>

</figure><figure class="quote" id="q-faff82bb91" data-kw="ceremonial abrogation">
<blockquote><p>The ceremonial law can be viewed in two ways: either with regard to doctrine and signification; or with regard to obligation and observance. The question is not whether it was abrogated as to doctrine. We confess that it still remains and is useful in many ways among Christians; and that the mystical truth, hidden under this shell, is always the same and of perpetual necessity. Rather the question is whether it was abrogated as to obligation and obedience and whether believers are still in subjection to the ceremonial law. This was the opinion not only of the Jews of old, but also of the Judaizing false apostles in the time of the apostles. However we, with the apostles and the whole church, deny it.</p></blockquote>

</figure><figure class="quote" id="q-e0985778de" data-kw="">
<blockquote><p>The difference between us here is not: (1) Whether both these [the Covenant of Works with Adam and the Mosaic Covenant] be called covenants in Scripture? Nor (2) Whether there was no grace at all in both, or either of them; for we are agreed , it is grace in God to enter into covenant with man, whatever that covenant be. Nor (3) Whether the Sinai law be not a covenant of works to some men, by their own fault and occasion? Nor (4) Whether the Scriptures do not many times speak of it in that very sense and notion wherein carnal justiciaries apprehend and take it; and by rejecting Christ, make it so to themselves? Nor (5) Whether the very matter of the law of nature be not revived and represented in the Sinai law? These are not the points we contend about. But the question is: Whether the Sinai law do in its own nature, and according to God’s purpose and design in the promulgation of it, revive the law of nature, to the same ends and uses it served to in Adam’s covenant; and so be properly and truly a covenant of works? Or whether God had not gracious and evangelical ends and purposes, viz. by such a dreadful representation of the severe and impracticable terms of the first covenant, instead of obliging them to the personal and punctual observance observance of them for righteousness and life, He did not rather design to convince them of the impossibility of legal righteousness, humble proud nature, and show them the necessity of betaking themselves to Christ, now exhibited in the new covenant, as the only refuge to fallen sinners?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2ec24cdd2c" data-kw="">
<blockquote><p>Others (Immanuel Tremellius &amp; Thomas Wilcox) interpret this of the doors of our heart, according to that Apoc. 3:20, ‘Behold I stand at the doors and knock, if any man hear my voice and open the door, I will come in unto him, etc.’ In the Gospel’s history we find that Christ had a fourfold entertainment among men. Some received Him into house, not into heart, as Simon the Pharisee (Lk. 7:44), who gave Him no kiss, nor water to his feet: some into heart, but not into house, as the faithful centurion, esteeming himself unworthy that Christ (Mt. 8:8) shouId come under his roof: some neither into soul nor heart, as the graceIess Gergesites, Mt. 8:54; some both into house and heart, as Lazarus (Jn. 11:11, 15), Mary (Lk. 10:38), Martha. Now that Christ may dwell in our hearts by faith (Eph. 3:17), and that our bodies may be temples of his Holy Spirit (1 Cor. 6:19); we must as our prophet exhorts here, ‘lift up our souls,’ that is, in the words of St. Paul, Col. 3:2, our affections must be set on things which are above, and not on things which are on earth, if we desire to lift up our heart unto Christ’s verity, we may not lift it up unto the world’s vanity (Augustine in location), that is, we must not fasten our love too much upon the things of this life, but on those pleasures at God’s right hand, which are evermore… O Lord, which art the God of my salvation (Ps. 18:47), I lift my heart to Thee (Ps. 25:1), desirous to seek Thee, both in the right ubi, ‘where’ Thou mayst be found, and in the right quando, ‘while’ Thou mayst be found: Open my dull ears and hard heart, that thy Son my Savior may come in and dwell with me: Grant me grace that I may still hear while He calls, open while He knocks, and hold Him also when I have Him, that I may both ascend thine hill, and stand in thine holy place, that I may not only sojourn in thy tabernacle, but also rest and dwell upon the mountain of thine holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | Ascension Day Evening Prayer, Psalm 24</cite>, p. 912</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cfac26bf9a" data-kw="">
<blockquote><p>I told you but now that they of the King’s army had this winter sent three times to Mansoul to submit herself. The first time the trumpeter went, he went with words of peace, telling them that the captains, the noble captains of Shaddai, did pity and bewail the misery of the now perishing town of Mansoul, and were troubled to see them so much to stand in the way of their own deliverance. He said, moreover, that the captains bid him tell them, that if now poor Mansoul would humble herself and turn, her former rebellions and most notorious treasons should by their merciful King be forgiven them, yea, and forgotten too. And having bid them beware that they stood not in their own way, that they opposed not themselves, nor made themselves their own losers, he returned again into the camp. The second time the trumpeter went, he did treat them a little more roughly; for, after sound of trumpet, he told them that their continuing in their rebellion did but chafe and heat the spirit of the captains, and that they were resolved to make a conquest of Mansoul, or to lay their bones before the town walls. He went again the third time, and dealt with them yet more roughly; telling them that now, since they had been so horribly profane, he did not know, not certainly know, whether the captains were inclining to mercy or judgment. ‘Only,’ said he, ‘they commanded me to give you a summons to open the gates unto them.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Holy War: the Battle For Mansoul (1682; Monergism) 245 pp.</cite>, pp. 58-59</span></figcaption>

</figure><figure class="quote" id="q-1aa5655632" data-kw="">
<blockquote><p>He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his Word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, Sermon 1, pp. 463-79</span></figcaption>

<blockquote><p>Question 2: Why must we continue thus long knocking? Why may we not give over if the gate be not speedily opened unto us? First, because the Lord stands long knocking at the door of our hearts before He can get entrance, and calls long before we will hear Him; And therefore there is great reason that we should continue long calling and crying unto Him and knocking at the door of mercy. Read Cant. 5:2 etc. and Apoc. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-ward.html">Richard Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Questions, Dogmatical Observations &amp; Evangelical Essays upon the Gospel of Jesus Christ according to St. Matthew... (London: Cole, 1640), on Mt. 7-8 Ward (c.1601-1684) was a covenanting, London minister on the side of Parliament. | on 7:7-8</cite>, p. 401</span></figcaption>

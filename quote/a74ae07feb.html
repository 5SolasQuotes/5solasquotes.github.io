<main class="wrap"><figure class="quote" id="q-a74ae07feb" data-kw="">
<blockquote><p>…and [they the Resolutioners] judge it a matter to be lamented before the Lord, that they should so far mistake their old friends [the Protesters] (who strive, though in much weakness, to keep the good old way wherein both were wont [accustomed] to walk for carrying-on of the work of Reformation) as to accompt them the wasters and destroyers of the Lord’s Vine, and [they the Resolutioners] become so kindly companions and patrons to men of another stamp [the malignants] that they judge themselves wounded if their sore be touched.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (Edinburgh, 1658), p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-c384fd05e1" data-kw="">
<blockquote><p>It was the laubable practice in reforming times to condemn all steps of defection, and duly to censure such as were guilty of public backslidings. Accordingly, by the Assembly that met anno 1638, all the prelates, being ringleaders in the apostasy, were deposed, and some of them excommunicated: Also, in the said reforming period, they returned to the Lord by a particular acknowledgment and confession of the sins of the ministry and of the whole land. But the General Assembly that met in the year 1690 made no particular acknowledgement of the many heinous backslidings of the former period: But on the contrary when many lamentable steps of defection and apostasy were complained of in a Large Paper offered to the foresaid Assembly 1690 by Mr. Alexander Shields, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-b2e7348499" data-kw="">
<blockquote><p>Peter cannot be called the foundation of the church, since no other foundation can be laid besides Christ (1 Cor. 3:11), and he himself is a member of the church, who ought to be built on Christ with the others as he himself teaches (1 Pet. 2:5, 6). Nor if the church is said to be built upon the foundation of the apostles, is this to be understood with respect to their persons, but with respect to their doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-788f2fe55a" data-kw="Papal infallibility">
<blockquote><p>Thirdly, if Christ asked this for all the Roman pontiffs, that they should be exempt from error, then he did not obtain what he asked. For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies; as Alphonsus asserts, Contra Hæres. Lib. I. c. 4, where he affirms that the pope not only may err, but even be a heretic. The same is written and held by other papists also. Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-865aebf26e" data-kw="">
<blockquote><p>Could they more grossly insult the expectation of the good, than when they deliver thus distinctly, and with barbarian haughtiness, that they will set no bounds to the unbridled tyranny of the Pope?</p></blockquote>

</figure><figure class="quote" id="q-f40671079e" data-kw="Councils and the pope">
<blockquote><p>Although the Levitical high priest had the right to convoke councils and to gain for them infallible authority, it does not follow that the same belongs to the Roman pontiff, because no other besides Christ succeeded the ancient high priest (Heb. 7, 8, 9). Besides, the right of extraordinary conventions was with the supreme magistrate (as we have said) and if they had any authority, that flowed entirely from the word, not from the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.17</span></figcaption>

</figure><figure class="quote" id="q-82d33e112a" data-kw="Pope as interpreter">
<blockquote><p>The cardinals attend the pope only in the way of ornament and pomp, and have no place in the settling of any definition. Yea, although all the cardinals were to say nay, yet the pope can define what he will. Therefore, although the Jesuit puts a council of pastors along with the pope, yet in reality this authority of interpretation is lodged with the pope alone; because, however much the rest oppose, yet his opinion shall always stand and prevail.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 3</span></figcaption>

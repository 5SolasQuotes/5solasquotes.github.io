<blockquote><p>Creatures considered through individual species are usually divided among physicists either according to the species of natural body, which is simple and mixed, etc. or according to the parts of the world, which are containers and contents, celestial and elemental, etc. We, presently omitting those things, will follow the division by the works of the six days’ creation frequented by all theologians and chronologers; and we will explain some things about the system of the world from Mosaic physics in the manner and method of theologians. For to want to call that into doubt, and to reduce it to absurdity belongs to those who, being unwise, refuse to submit their wisdom to the most Holy Spirit, and pave the way for themselves and others to Libertinism or atheism: while the system of the world described by Moses to them does not seem dissimilar to the fables and absurdities of Muhammad about the earth being founded on the horn of an ox (in the book Sunna), about the sun when it sets, immersing itself in a bubbling spring of water (Quran, chapter on the Cave). Objections and exceptions against the sacred Mosaic physics which are usually brought forward are not so subtle that they cannot be resolved. As among others Francis Junius shows against the 22 arguments of Simplicius, and of today’s antinomians, at the end of the explanation of the first three chapters of Genesis: with whom Scipio Claromontius, On the Universe, should be compared, and other philosophers to be cited below, who do not allow anti-Mosaic systems of the moderns to be foisted upon them…. …Heaven and the angels were created on the First Day. The reasons are: … 2. Because nowhere in the Hexaemeron is mention made of the creation of that heaven and the angels: but God completed in six days all things that were created, Gen. 2:1, and that heaven is among things created, Heb. 11:10.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf82981ed3" data-kw="">
<blockquote><p>VII. II. An adjunct of the world is its goodness and perfection, by which the world is conformable to the divine will, and consists of all its parts. It is therefore perfect, not simply and absolutely, in which sense only God is good and perfect, Mk. 1018; but in a certain respect and in its own kind, because nothing is wanting in it which belongs to the world from the intention of the Creator. Gen. 1:31, “all things that God had made were very good.” Ps. 104:24 “how magnificent are your works, O Lord, you have made all things in wisdom: the earth is full of your possessions.” 1 Tim. 4:4, “Every creature of God is good.” cf. Ps. 8. And this is shown both by the order of the parts of the world, and by their varieties and integrity: which David praises in the whole of Ps. 104. Those things which seem viler and more imperfect are only such separately from the whole and comparatively, since they too were wisely and well made, and contribute to the perfection of the universe. To that which is wont to be asked: Whether God could have made the world more perfect; it must be said: The species of beings could indeed have been made accidentally more perfect, because their qualities and endowments can be increased, and they admit of more and less; yet they could not have been made essentially more perfect, their essences remaining safe and unchanged, because species are like numbers, to which if a unit is added or subtracted, the numbers are changed. If, therefore, God were to add an essential perfection to a certain species, that species would be changed, and would not remain such a species. Meanwhile, God could have produced other species, more perfect than those which He actually produced; since the power of God is infinite, and not exhausted by the production of the creatures actually existing in the world. It can also be said that God can make something better, not adverbially, because He made all things in the best way, but adjectivally, because He can make good things better and increase their accidental goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, On Creation, p. 20 trans. AI Latin</span></figcaption>

</figure><figure class="quote" id="q-69e2f1a75b" data-kw="">
<blockquote><p>3rd Problem. Whether God is universally perfect, as it were having in Himself the perfection of all things? Answer: Affirmed—provided you distinguish the “having,” or the “containing,” into the virtual or eminent and the formal. For certain perfections are in God formally, as life, goodness, intellect, will, etc. But certain others only virtually or causally, as in a producing and conserving cause, but not formally—as, e.g., sensitive life, corporeal perfections, and all the other specific perfections of the stars, elements, minerals, plants, animals, etc. According to this distinction, the Enthusiastic frenzies are to be refuted; and rightly are to be explained the texts which say that all things are, or subsist, in God. By this same distinction is determined another Problem, which occurs a little later in my syllabus: Whether created perfections can be in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin, vol. 5 (1669)</span></figcaption>

<blockquote><p>…the Israelites agreed with the Egyptians in the long and curious ceremony of embalming for forty days, which were days of sadness, because they were spent in applications to the dead; and the Egyptians agreed with the Hebrews in their thirty days of mourning, in the places fore-mentioned. There is afterward mention made of a mourning by the space of seven days, verse 10….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ley.html">John Ley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the books of the Old &amp; New Testament</cite>, (London: Legatt, 1645), On Genesis | on Gen., 50:3</span></figcaption>

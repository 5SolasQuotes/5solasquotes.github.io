<main class="wrap"><figure class="quote" id="q-5fa2c267d6" data-kw="">
<blockquote><p>I choose to make the obligation which we are under of obeying civil laws, and the commands of our governors, to depend on the will of God, because the other foundations on which it is wont to be built do not appear of sufficient strength and solidity.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5111f482c3" data-kw="">
<blockquote><p>The Law of Nature, as it is impressed upon our hearts, so in the goodness of God, it is expressed in his Word, wherein He has not only holden forth these Sacred Mysteries, which could only be known by Revelation, as having no principles in Nature from whence they are deducible, but also, because through sin and evil custom, the Natural Law in man’s heart was much defaced, disordered and erroneously deduced: He has therefore reprinted the Law of Nature in a viver [more vivid and lively] character, in the Scripture, not only having the moral principles, but many conclusions thence flowing particularly set forth. This analogy of the Law of Nature even in the heats of heathens and as it is set down in the Law of God evidences sufficiently, that both of them proceed from the same Omniscient Author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">Viscount of Stair James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland</cite>, vol. 1, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-65f336f864" data-kw="">
<blockquote><p>Again, in the next place, take also this general observation, That although the Judicial and Ceremonial Laws were given at the same time with the Moral Law, yet there is a difference between them. And this is to be taken notice of, lest any should think, what will this discourse make for the honor of the Moral Law, more than the other laws? It’s true, these three kinds of laws agree in the common efficient cause, which was God; and in the minister, or mediator, which was Moses; in the subject, which was the people of Israel; and all and every one of them; as also in the common effects, of binding and obliging them to obedience, and to punish the bold offenders against them. But herein the Moral Law is preeminent: 1. In that it is a foundation of the other laws, and they are reducible to it. 2. This was to abide always, not the other. 3. This was immediately written by God, and commanded to be kept in the Ark, which the other were not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-1d6bfb58f2" data-kw="">
<blockquote><p>This is a received maxim also: Quod tangit omnes, ab omnibus, suo more, tractari debet. ‘What concerns all, should be agitated by all, according to their degrees of concernment’; but excommunication of a person, in a consociated Church, concerns all the consociated Churches in a presbytery: all are scandalized; all may be, and are in danger to be leavened with the infectious lump.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, ch. 10, section 10, p. 303</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

— Samuel Rutherford, The Due Right of Presbyteries (1644), pt. 1, ch. 10, section 10, p. 303">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+is+a+received+maxim+also%3A+Quod+tangit+omnes%2C+ab+omnibus%2C+suo+more%2C+tractari+debet.+%E2%80%98What+concerns+all%2C+should+be+agitated+by+all%2C+according+to+their+degrees+of+concernment%E2%80%99%3B+but+excommunication+of+a+person%2C+in+a+consociated+Church%2C+concerns+all+the+consociated+Churches+in+a+presbytery%3A+all+are+scandalized%3B+all+may+be%2C+and+are+in+danger+to+be+leavened+with+the+infectious+lump.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries+%281644%29%2C+pt.+1%2C+ch.+10%2C+section+10%2C+p.+303&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d6bfb58f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d6bfb58f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=This%20is%20a%20received%20maxim%20also,be%20leavened%20with%20the%20infectious%20lump&amp;text=This%20is%20a%20received%20maxim%20also%3A%20Quod%20tangit&amp;text=danger%20to%20be%20leavened%20with%20the%20infectious%20lump" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9b6f2c952e" data-kw="">
<blockquote><p>With respect to the particular laws by which the Jews were governed, the common sentiment of sound divines, and the best writers on the laws of nations, is, that although the judicial law is not binding as such upon Christian nations, so that they should be bound to regulate all their laws according unto it, yet it demands distinguished attention, and is to be regarded, as a pattern, in those laws which proceeded upon moral grounds. In it there was nothing inconsistent with the principles of equity and religion. God give unto Israel ‘right judgments and true laws, good statutes and commandments.’ All just laws among men are deductions from the moral law, applied to human affairs. But in the judicial law, the conclusions were deduced and applied, not by the fallible and corrupt reason of man (as in ordinary laws) but by unerring wisdom. These respected either the first or second table of the moral law, duties which immediately related to God or man. It is a radical mistake, on this subject, to suppose that the peculiarity of the judicial law did lie solely and properly in its reference to matters of religion, or the first table. It is to be observed also in those laws which related to things civil, or the duties of the second table. There is no more propriety in representing all the judicial laws respecting the first table as peculiar, than there is in representing all those which related to the second table as peculiar. Peculiarities there were in both; but after allowances are made for these, there remain moral grounds for both; and whatever proceeded upon moral grounds in the judicial law, whether it respected things immediately connected with religion, or with justice and civil order, is exemplary, and must be obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Difference</cite>, (Edinburgh: George Caw, 1807), pp. 125-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

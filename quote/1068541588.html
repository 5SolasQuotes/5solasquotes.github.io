<blockquote><p>To what extent has Christ abrogated the Law, and to what extent is it still in force? The ordinary and correct answer to this question is, that the ceremonial and judicial law, as given by Moses, has been abrogated in as far as it relates to obedience; and that the moral law has also been abrogated as it respects the curse, but not as it respects obedience. That the ceremonial and judicial laws have been so abrogated by the coming of Christ, that they no longer bind any to obedience, and that they have not the appearance and force of laws in respect to the present time, is proven, 1. From the fact that the prophets even declared and foretold this abrogation in the Old Testament. “Christ shall confirm the covenant with many for one week, and in the midst of the week he shall cause the sacrifice and the oblation to cease.” “Thou art a priest forever after the order of Melchisedek. (Dan. 9:27. Ps. 110:4.)

2. Christ and his Apostles, in different places in the New Testament, expressly assert this abrogation. (See Acts 7:8. Heb. 7:11–18; 8:8–13.) Instead of adducing a number of testimonies in confirmation of this point, we shall merely cite the decree passed by the Apostles when assembled in Jerusalem: “For it seemed good to the Holy Ghost and to us to lay upon you no greater burden, than these necessary things,” etc. (Acts 15:28, 29.)

3. When certain causes are once changed, the laws which are based upon these causes are also changed. One cause now of the ceremonial and judicial law was that the form of worship and civil polity which existed among the Jews, from whom the Messiah was to be born, might distinguish them from all other nations until the Messiah would come. Another cause was that they might be types of the Messiah and of his benefits. These causes now since the coming of the Messiah, have been done away with: for the Apostle declares that the middle wall of partition between the Jews and other nations has been broken down: “He is our Peace, who hath made both one, and hath broken down the middle wall of partition between us,” “For in Christ Jesus, neither circumcision availeth any thing, nor uncircumcision, but a new creature. (Eph. 2:14. Gal. 6:15.) It is also every where taught in the New Testament Scriptures that the rites and ceremonies of the old dispensation have been fulfilled in Christ. “The Holy Spirit, this signifying that the way into the holiest of all was not yet made manifest, while the first tabernacle was yet standing.” “The law and the prophets were until John.” “Let no man judge you in meat or in drink,” etc. (Heb. 9:8. Luke 10:16. Col. 2:16.) … Objection 3: The best and most wholesome form of government is always to be retained. The form of government established among the Jews was the best and most wholesome, for the reason that it was instituted by God. Therefore it is to be retained. Answer: There is here a fallacy in taking that to be absolutely true, which is true only in a certain respect. The form of government established among the Jews was the best, not absolutely, but only for that time, that country and nation: for there were many things in it adapted to the state and condition of that nation, country, time, and ceremonial worship, the observance of which would now neither be proper nor profitable, because the causes on account of which those laws were given to the Jews are now changed or removed; as giving a writing or bill of divorcement, marrying the widow of one’s kindred, etc. God did not, for this reason, institute this form of government that all nations and ages might be bound by it; but only that his own people might, by this discipline, be separated for a time from the surrounding nations. If any one should object and say, that if Christians are permitted to observe and conform to the laws of other nations, such as the Greeks or Romans, etc., much more ought we to observe those which were given by Moses, the servant of God; we readily grant the argument, if this observance is rendered without attaching to it the idea of necessity; or if these laws are observed, not because Moses commanded and enjoined them upon the Jewish nation, but because there are good reasons why we should now comply with them; and if these reasons should be changed, to retain the liberty of changing these enactments by public authority.</p></blockquote>

<blockquote><p>October 31, 1798… I have just passed through the most awful scene of epidemic sickness and mortality that I ever witnessed. The Yellow Fever has been raging in the city for more than two months past. From the middle to the 25th of this month was the most mortal time. Though the city was deserted by, perhaps, two-thirds of its regular inhabitants, more than two thousand persons fell victim to the disease. I remained with a brother — a beloved brother — a practitioner of medicine — a bachelor as well as myself. We were both mercifully borne through the raging epidemic without any serious attack. Our housekeeper died of it, and I attended her funeral between midnight and day. To attempt to describe the scenes of mourning and horror which this epidemic presented — I dare it. The task transcends my power of expression. I preached every Sabbath; but only a few attended public worship; and I know not that any sensible — certainly no conspicuous — good was done.</p></blockquote>

<blockquote><p>Now it should be noted that the Holy Spirit insults the people of the Law and of works here by calling them “sons of the slave woman.” It is as though He were to say: “Why do you boast about the righteousness of the Law and of works and brag that on its account you are the people and the children of God? If you do not know whence you have your birth, I will tell you. You were born as slaves and of a slave woman. What sort of slaves? Of the Law, sin, death, and eternal damnation. A slave is not an heir but is cast out of the house.” Therefore the pope, with all his regime and whatever other self-righteous people there are, regardless of how saintly they may be in appearance, who trust they will obtain grace and salvation through laws human or divine—all of them are sons of the slave woman who will not inherit with the sons of the free woman but will be cast out of the house. And I am not speaking now about the ungodly monks, who worshiped their belly as god (Phil. 3:19) and committed horrible sins that I would just as soon not mention, but about the best of them, to whom I and many others belonged, who lived holy lives and tried with might and main to appease the wrath of God and to merit the forgiveness of sins and eternal life by the observances of their religious order. These men must now hear the sentence that the sons of the slave woman are to be cast out of the house together with the slave woman, their mother. When they are carefully considered, such sentences provide us with certainty and reassurance regarding the doctrine and the righteousness of faith, in opposition to the doctrine and the righteousness of works. The world embraces and praises the latter, and it despises and condemns the former.</p></blockquote>

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 457–58.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+it+should+be+noted+that+the+Holy+Spirit+insults+the+people+of+the+Law+and+of+works+here+by+calling+them+%E2%80%9Csons+of+the+slave+woman.%E2%80%9D+It+is+as+though+He+were+to+say%3A+%E2%80%9CWhy+do+you+boast+about+the+righteousness+of+the+Law+and+of+works+and+brag+that+on+its+account+you+are+the+people+and+the+children+of+God%3F+If+you+do+not+know+whence+you+have+your+birth%2C+I+will+tell+you.+You+were+born+as+slaves+and+of+a+slave+woman.+What+sort+of+slaves%3F+Of+the+Law%2C+sin%2C+death%2C+and+eternal+damnation.+A+slave+is+not+an+heir+but+is+cast+out+of+the+house.%E2%80%9D+Therefore+the+pope%2C+with+all+his+regime+and+whatever+other+self-righteous+people+there+are%2C+regardless+of+how+saintly+they+may+be+in+appearance%2C+who+trust+they+will+obtain+grace+and+salvation+through+laws+human+or+divine%E2%80%94all+of+them+are+sons+of+the+slave+woman+who+will+not+inherit+with+the+sons+of+the+free+woman+but+will+be+cast+out+of+the+house.+And+I+am+not+speaking+now+about+the+ungodly+monks%2C+who+worshiped+their+belly+as+god+%28Phil.+3%3A19%29+and+committed+horrible+sins+that+I+would+just+as+soon+not+mention%2C+but+about+the+best+of+them%2C+to+whom+I+and+many+others+belonged%2C+who+lived+holy+lives+and+tried+with+might+and+main+to+appease+the+wrath+of+God+and+to+merit+the+forgiveness+of+sins+and+eternal+life+by+the+observances+of+their+religious+order.+These+men+must+now+hear+the+sentence+that+the+sons+of+the+slave+woman+are+to+be+cast+out+of+the+house+together+with+the+slave+woman%2C+their+mother.+When+they+are+carefully+considered%2C+such+sentences+provide+us+with+certainty+and+reassurance+regarding+the+doctrine+and+the+righteousness+of+faith%2C+in+opposition+to+the+doctrine+and+the+righteousness+of+works.+The+world+embraces+and+praises+the+latter%2C+and+it+despises+and+condemns+the+former.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1%E2%80%934%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%29%2C+457%E2%80%9358.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1c78fe855.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e1c78fe855.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/07/luther-if-you-are-under-the-law-you-are-a-slave/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>

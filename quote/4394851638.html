<main class="wrap"><figure class="quote" id="q-4394851638" data-kw="">
<blockquote><p>But the Lord has given to all believers as believers of the same or of another flock, whether in Churches this way, or not, to women, as to males, in some measure, the anointing grace to know Christ’s voice [in a shepherd, in order unto ecclesiastical election].</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74c3c909a4" data-kw="">
<blockquote><p>Our divines, Bucer, Calvin, Bucanus, Tilenus, Beza, Virttut [Viret?], give consenting, and in some cases correcting, not judicial, power sure, but which is great enough, a negative consent for eschewing of a schism. And the professors of Leiden, Ursinus, Pareus, Junius, give the people a vote, a consent in excommunication, and this cannot exclude women who are offended when the whole Church is offended. The times of Ambrose did witness more pride in the clergy, who began to do all without the people. Chemnitz, Daneus, the Confession of Bohemia, of Helvetia, the Synod of Middleburgh, the Synod of Tylleburgh in Nassovia, anno 1582, teach that the whole Church with consent of all did excommunicate, but the judging authority is in the eldership.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 277</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-4ded594794" data-kw="">
<blockquote><p>In giving the name of bishops, presbyters, and pastors, indiscriminately to those who govern churches, I have done it on the authority of Scripture, which uses the words as synonymous. To all who discharge the ministry of the word it gives the name of bishops. Thus Paul, after enjoining Titus to ordain elders in every city, immediately adds, &quot;A bishop must be blameless,&quot; &amp;c., (Tit. 1: 5, 7.) So in another place he salutes several bishops in one church, (Phil. 1: 1.) And in the Acts, the elders of Ephesus, whom he is said to have called together, he, in the course of his address, designates as bishops, (Acts 20: 17.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.3.8</span></figcaption>

</figure><figure class="quote" id="q-a8bb6cc804" data-kw="">
<blockquote><p>This question we have handled above, [vol. 2,] part 1, bk. 3, tract 1, section 3, ch. 3, [‘Of Repudiations &amp; Divorces, by which things the Bond of Matrimony itself is Loosed’, Question 11, ‘Whether it may be allowed in marriage, or convenient, to chastise the wife with strikes?’, pp. 185-6] nor are we repeating it here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, pt. 2, bk. 1, tract 4, ‘On Women’, pp. 179-212 in Ecclesiastical Politics, vol. 3 (Amsterdam, 1663-1676) | Ch. 2. Of Those Things which Pertain to the Secular &amp; Political State of Women, p. 198 | Section 1, p. 198 | 3rd Question, ‘Whether the superiority of a man over a wife may extend to striking [verbera] her?’, p. 199</span></figcaption>

</figure><figure class="quote" id="q-4653df553c" data-kw="">
<blockquote><p>…those against whom we now dispute [congregationalists], brethren, reverend, learned and holy, do confound and take for one and the same the power of electing or choosing officers and the power of ordination. And they make election of elders (which by God’s Word is due to all the faithful) an act of jurisdiction, whereas it is a private and popular act, flowing from that spirit of grace in believers and from the light of saving faith, and a grace that they call, gratia gratum faciens, grace whereby we are accepted to God, as Aquinas speaks, for it is that heavenly instinct of believers, whereby they try all things and keep that which is good, and whereby they try the spirits (even of office bearers) whether they be of God or not, and know the voice of the Shepherd from the voice of a stranger, and have their senses exercised to discern good and evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 1, p. 4 This quote shows choosing officers is not an act of jurisdiction, or of ruling.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fe58df6214" data-kw="">
<blockquote><p>‘Blessed are they that do his commandments, that they may have right to the tree of life, and may enter in through the gates into the city.’ And lest we should think the commands are all but one only precept of believing, he addeth “for without are dogs and sorcerers, and whoremongers, and murderers, etc.” “He that hath my commandments, and keepeth them, he it is that loveth me, and he that loveth me shall be loved of my Father, and I will love him and manifest myself to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, (London, 1648), pt. 2, ch. 37, ‘How Good Works are Necessary’, pp. 37-39</span></figcaption>

</figure><figure class="quote" id="q-f5c0d454a2" data-kw="">
<blockquote><p>He shews for what purpose the faithful were to strive, that is, that they might have faith adorned with good morals, wisdom, patience, and love. Then he intimates that faith ought not to be naked or empty, but that these are its inseparable companions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, 2 Peter 1:5</span></figcaption>

</figure><figure class="quote" id="q-24a4706bdb" data-kw="">
<blockquote><p>From this come three periods of justification that should be diligently observed here, namely 1: The period of establishment, by which man is first justified: in this occasion not only is efficacy of works excluded for acquiring justification, but so is the very presence of these works in so far as God justifies the sinner and the wicked. 2: The period of continuation: in this occasion, although no efficacy of good works is granted for justification, the presence of these same works, nevertheless, is required. And it is probably in this sense that James denies that we are justified by faith along but he requires works in addition. And lastly 3: The period of consummation in which the right unto eternal life, granted under the first period and continued under the second, is advanced even to the possession of eternal life: in this occasion not only is the presence of good works required, but also, in a certain sense, their efficacy, in so far as God, whose law we attain just now through the merit alone of Christ, does not want to grant possession of eternal life, unless [it is] beyond faith with good works previously performed. We received once before the right unto eternal life through the merit of Christ alone. But God does not want to grant possession of eternal life, unless there are, next to faith, also good works which precede this possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As given in Mark Jones, Antinomianism: Reformed Theology’s Unwelcome Guest</cite>, (P&amp;R, 2013)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

edbooksonline.com/good-works/#:~:text=From%20this%20come%20three%20periods%20of,good%20works%20which%20precede%20this%20possession&amp;text=From%20this%20come%20three%20periods%20of%20justification%20that&amp;text=faith%2C%20also%20good%20works%20which%20precede%20this%20possession" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

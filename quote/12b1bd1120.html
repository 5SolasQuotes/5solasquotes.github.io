<main class="wrap"><figure class="quote" id="q-12b1bd1120" data-kw="">
<blockquote><p>It is obvious, that the reason why king Henry, the Eight of England, made such free enquiry into the illegality of his marriage with queen Catharine, was his greater love to Ann of Bullin [sic]. He divorced his queen, and married Ann. These who impugn any of the doctrines in our subordinate standards, give reason to suspect, that they are in love with some other religious profession, more suited to the taste of modern times, than the principles of the covenanted Presbyterian church of Scotland.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-willis.html">William Willis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A smooth stone from the brook. Or, An humble attempt to prevent backsliding from the principles of the covenanted Church of Scotland, in some letters to the Rev. George Lawson</cite>, (Glasgow: M. Ogle, 1799), p. 26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>As I ever abhorred division and faction in the Church, as that which tends to its utter ruin if the Lord prevent it not;” he adds (and here I join with him), “I would, in the bowels of my Lord and Master, if such a feckless one as I may presume to persuade and exhort both ministers and professors: ‘If therre by any consolation in Christ, if any comfort in love, if any fellowship of the Spirit, if any bowels and mercies, that ye be like-minded, having the same love, being of one accord, of one mind. In lowliness of mind let each esteem other better than themselves.’ (Phil. 2:2-3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>…these questions were proponed to him that was to be elected. … Question. ‘Believe ye not, that the doctrine of the prophets and apostles, contained in the books of the New and Old Testament, is the only true and most absolute foundation of the universal church of Christ Jesus, in so much, that in the same Scripture are contained all things necessary to be believed for the salvation of mankind?’ Answer. ‘I verily believe the same; and do abhor and utterly refuse all doctrine alleged necessary to salvation, that is not expressedly contained in the same.’ Question. ‘Is not Christ Jesus, man of man according to the flesh, to wit, the son of David, the seed of Abraham, conceived of the Holy Ghost, born of the Virgin Mary his mother, the only Head and Mediator of his church?’ Answer. ‘He is, and without him there is neither salvation to man, nor life to angel.’ Question. ‘Is not the same Lord Jesus the only true God, the eternal Son of the eternal Father, in whom all that shall be saved were elected before the foundation of the world was laid?’ Answer. ‘I acknowledge and confess Him in the unity of his Godhead to be God above all things, blessed forever.’ Question. ‘Shall not they whom God, in his eternal counsel, has elected, be called to the knowledge of his Son, our Lord Jesus; and shall not they who of purpose are called, in this life, be justified; and where justification and free remission of sins is obtained in this life by free grace, shall not the glory of the Son of God follow in the general resurrection, when the Son of God shall appear in his glorious majesty?’ Answer. ‘This I acknowledge to be the doctrine of the apostles, and the most singular comfort of God’s children.’ Question. ‘Will ye not then contain yourself in all doctrine within the bounds of this foundation? Will ye not study to promove the same, as welll by your life as by your doctrine? Will ye not, according to the graces and utterance that God shall grant unto you, profess, instruct, and maintain the purity of the doctrine contained in the sacred Word of God; and to the uttermost of your power will ye not gainstand, and convince the gainsayers, and the teachers of men’s inventions?’ Answer. ‘That do I promise in the presence of God, and of his congregation, here assembled.&#x27;</p></blockquote>

· Reformed Books Online</a></div>
</figure><figure class="quote" id="q-decc2e47d3" data-kw="">
<blockquote><p>In this world the church, which is sometimes called the kingdom of God in Scripture, contains both godly and ungodly, good and bad, all mixed up together. Satan sows his weeds in the happy cornfields of the Lord, and both good and bad fish are got in the net of the gospel.

But on the last day, when Christ comes in judgment, there will be a separation when the godly will be called to inherit heavenly and eternal life and the ungodly will be consigned to eternal hellfire along with Satan, whom they serve.

No one should be deceived by the fact that for the time being God puts up with many things in the visible church that he does not accept as his will. In a great house there are many vessels, among which some are designed for ignoble use. God puts up with them for the sake of his elect, so that they may be revealed and so that the whole church will not be destroyed by a sudden ejection of the ungodly. But there will come a time when they will be thrown out without any problem.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 197.</span></figcaption>

-of-the-visible-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-be69b5645a" data-kw="">
<blockquote><p>Well spake Tertullian of this matter, Idolatry is the principal crime of Mankind, and the highest guilt of any age. God therefore so severely commanding, that we should fly from Idols and all Idolatry, though shadowed over with what fair pretences soever, that is to be counted morally impossible which cannot be done without some stain of Idolatry, &amp; grievous offending of God’s Majesty.

See here the grand and horrible hindrance, whereby the Reformed Churches are compelled, not without great grief, and horror of mind to remain out of the Communion of the Romish Church. For they so dote on their Idols, and enforce them on others to be adored, that none can come, at least abide in Communion with them, except with the same deed he will become a most manifest Idolater.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exhortation to brotherly communion betwixt the Protestant churches</cite>, (London: Richard Badger, 1641), p. 10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

See here the grand and horrible hindrance, whereby the Reformed Churches are compelled, not without great grief, and horror of mind to remain out of the Communion of the Romish Church. For they so dote on their Idols, and enforce them on others to be adored, that none can come, at least abide in Communion with them, except with the same deed he will become a most manifest Idolater.”

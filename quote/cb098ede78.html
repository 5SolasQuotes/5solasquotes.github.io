<main class="wrap"><figure class="quote" id="q-cb098ede78" data-kw="">
<blockquote><p>True faith is not only a sure knowledge, whereby I hold for truth all that God has revealed to us in His Word (James 1:6), but also a hearty trust (Rom. 4:16–18; Rom. 5:1), which the Holy Ghost (2 Cor. 4:13; Phil. 1:19, 29) works in me by the Gospel (Rom. 1:16; 10:17), that not only to others, but to me also, forgiveness of sins, everlasting righteousness, and salvation are freely given by God (Heb. 11:1–2; Rom. 1:17), merely of grace, only for the sake of Christ’s merits…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 21</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2957ad874d" data-kw="">
<blockquote><p>Endeavour diligently to perform the great work of believing on Christ in a right manner without any delay, and then also to continue and increase in your most holy Faith, that so your enjoyment of Christ, Vnion and Fellowship with him, and all holiness by him, may be begun, continued, and increased in you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, London, 1692, Direction 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span><span class="t"><a href="../topics/sanctification/means-of-sanctification.html">Means of Sanctification</a></span></div>

</figure><figure class="quote" id="q-2f9aeee0f2" data-kw="">
<blockquote><p>A.H. Strong uses the analogy of the coupling. The coupling joins a train of cars to a locomotive. The coupling has no power in itself. It cannot move a single car an inch. All the power is in the locomotive. But the coupling is the link by which the power of the locomotive is transmitted to the cars. Faith has no power in itself; it is not a ground of salvation; it is not a good work. It is merely that by which all the goodness and grace and glory of Christ comes to the sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

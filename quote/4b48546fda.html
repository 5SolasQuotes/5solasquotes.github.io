<main class="wrap"><figure class="quote" id="q-4b48546fda" data-kw="">
<blockquote><p>5. Christ, God and man, indeed forgives sins, but in a diverse manner: as He is God, and as He is man. Whereon it also follows, that Christ, God and man (which we also confess) together with the Father and the Holy Ghost, forgives sins: but He does it in one sort, as He is God, and in another, as He is man. For as He is God, He does effect the same properly and of his authority: but as He is man, He does it, and did it in the flesh, as being a fellow-worker with the deity: in his human will consenting to the divine, and pronouncing the words ‘Thy sins are forgiven thee’: as also Leo the First, Epistle 10 [28], ch. 4, so expounds it to Flavianus, saying, each form (namely of God and man) works with communion of the other, that which is proper to itself: as, the Word working that which is proper to the Word, and the flesh performing that which belongs to the flesh. To forgive sins was the proper action of the divine nature: and to say, ‘Thy sins are forgiven thee’, of the human. Thus far he.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion… (1599) | Ch. 27, ‘Of Perpetual Remission of Sins in the Church of Christ’</cite>, pp. 253-4</span></figcaption>

<blockquote><p>The human nature of Christ is not the formal object of worship; it is a creature, and not to be worshipped as such; nor is worship given for the sake of it, or as singly considered; but then the divine Person of Christ having that nature in union with Him, is the object of worship; the flesh of Christ is not worshipped, but the incarnate God is; a whole Christ is worshipped, but not the whole of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Doctrinal &amp; Practical Divinity (Baptist Standard Bearer)</cite>, p. 387</span></figcaption>

</figure><figure class="quote" id="q-9541e39dd5" data-kw="">
<blockquote><p>The ancients† insist much upon that proof John 16:15, ‘All things that the Father hath are mine’, compared with John 10:30, ‘I and my Father are one’, and John 10:37, ‘If I do not the works of my Father, believe me not; for from hence they do conclude, that Christ has the same divine nature and Godhead with the Father; they both have the same divine and essential titles and attributes, and perform the same inward operations in reference to all creatures whatsoever; † Epiphanius, contra Apostolicos, see Cyril in John, ch. 3 &amp; 8; Jerome on Zech. 2; Ambrose, bk. 5, Of Faith, ch. 4; Augustine, contra Pascen tium: ‘nemo igitur jam calumnia turde verbo; et si enim verbum ipsum in Lege scriptum non reperitur, res tamen reperitur, ego et Pater unum sumus’, Epistle 174. and therefore they did farther infer that they had reason to use the word ‘Consubstantial’ [one substance]; for though the word is not in Scripture, yet the sense and meaning of it is orthodox and canonical, because evidently deduced from these texts and some other Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity… (London, 1650)</cite>, ch. 4, p. 26</span></figcaption>

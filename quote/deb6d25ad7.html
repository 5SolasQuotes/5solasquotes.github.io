<main class="wrap"><figure class="quote" id="q-deb6d25ad7" data-kw="">
<blockquote><p>Neither can it be ground enough to plead for such decisions in preaching, that the thing they preach-for is truth, and the thing they condemn is error. Because: 1. It is not the lawfulness of the thing simply that is in question, but the necessity and expediency thereof in such a case: Now, many things are lawful that are not expedient, 1 Cor. 10:23. 2. In these differences that were in the primitive times concerning meats, days, genealogies, etc. there was a truth or an error upon one of the sides, as there is a right and a wrong in every contradiction of such a kind, yet the apostle thinks fitter, for the Church’s peace, that such be altogether refrained, rather than any way (at least in public) insisted upon or decided. 3. Because no minister can bring forth every truth at all times, he must then make choice; And I suppose some ministers may die, and all do so, who have not preached every truth, even which they knew, unto the people. Beside, there are (no question) many truths hid to the most learned. Neither can this be thought inconsistent with a minister’s fidelity, who is to reveal the whole counsel of God; because, that counsel is to be understood of things necessary to men’s salvation, and is not to be extended to all things whatsoever; for, we find the great apostle expounding this in that same sermon, Acts 20, verse 20, ‘I have keeped back nothing that was profitable unto you;’ which evidenceth that ‘the whole counsel of God,’ or the things which he showed unto them, is the whole, and all that was profitable for them, and that for no by-respect or fear whatsoever he shunned to reveal that unto them. [4.] Also, it is clear, that there are many truths which are not decided by any judicial act; and amongst other things, sparingness to decide truths that are not fundamental judicially has been ever thought no little mean[s] of the Church’s peace, as the contrary has been of division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal</cite>, pp. 358-359</span></figcaption>

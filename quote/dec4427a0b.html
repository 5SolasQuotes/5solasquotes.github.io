<blockquote><p>At a public meeting held at Edinburgh in February 1840 on the church’s spiritual independence, Dr Thomas Chalmers claimed that the principles of the non-intrusionists during the Ten Years’ Conflict were those of their covenanting forefathers:

It is, in a season of unexampled difficulty, to declare what we hold to be clear and incumbent duty. It is to rally and reassure the Church’s friends, in this hour of danger and menace to the Church’s liberties. It is to tell the country that, though perplexed, we are not in despair; and that whatever the threats, or whatever the demonstrations of power may be, we are resolved to abide by the good old principles which we believe to be in the Word of God – (Cheers) – principles bequeathed to us by the founders of Scottish Presbytery, and sealed by the martyrdom of our Scottish forefathers. …

Persecution may change its forms from one age to another – from the boots, and the thumb-screws, and the scaffolds of the seventeenth, to the fines and imprisonments of the nineteenth century. May the spirit of our ancestors descend to their children, that if the contest must be entered on between the Church’s subjugation and the Church’s spiritual independence, we, on the glorious retrospect of their sufferings and their triumphs, may give back to our adversaries their own watchword, return their own battle cry that “what firmness has done before, it will do again.” …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 26 February 1840.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<blockquote><p>IV. (3) We must observe that the right of God (as far as regards creatures) is either of dominion (which includes the right of possessing, disposing and using creatures, as a lord or proprietor, who is able to use and enjoy his own property at pleasure); or of government (which properly refers to rational creatures whom He governs as ruler and legislator; to whom belong legislation, judgment and execution…)… … XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist). … XXXII. …(3) Nor assuredly can the Egyptians [at the Exodus, with reference to them giving their belongings to the Israelites] themselves be considered the lawful owners in the court of heaven with God, but only usurpers (as also other wicked men, although in the forum of earth and with men they are esteemed such)… XXXIII. Although it was not lawful to move a sickle into a neighbor’s standing corn, still the liberty was formerly lawfully granted to a passing traveller, either to pluck ears of corn from the field or grapes from a vineyard for the sake of satisfying hunger (Dt. 23:24,25). This was done not by dispensing with the law of theft, but by its true interpretation for it was a work of necessity, permitted by the supreme Lord for the purpose of binding men more closely in the bonds of love. If these acts have any indecency in themselves, they cease to be such when the divine command (or instinct or vocation) intervenes, imposing such a necessity or conceding liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, sections 4, 18, 32-33, pp. 8, 12 &amp; 18</span></figcaption>

</figure><figure class="quote" id="q-f4ce369237" data-kw="">
<blockquote><p>But when, in this corrupt disordered State of Things, where the Lusts of Men are perpetually embroiling the World with Wars and Fightings, and throwing all into Confusion; when Ambition and Avarice would rob us of our Property, for which we have toiled, and on which we subsist; when they would enslave the free-born Mind, and compel us meanly to cringe to Usurpation and Arbitrary Power; when they would tear from our eager Grasp the most valuable Blessing of Heaven, I mean our RELIGION: when they invade our Country, formerly the Region of Tranquillity, ravage our Frontiers, butcher our Fellow-Subjects, or confine them in a barbarous Captivity in the Dens of Savages; when our earthly All is ready to be seized by rapacious Hands, and even our Eternal All is in Danger by the Loss of our Religion: when this is the Case, what is then the Will of God?

Must Peace then be maintained? maintained with our perfidious and cruel Invaders? maintained at the Expense of Property, Liberty, Life, and every Thing dear and valuable? maintained, when it is in our Power to vindicate our Right, and do ourselves Justice? Is the Work of Peace then our only Business? No; in such a Time even the God of Peace proclaims by his Providence, “To ARMS!” Then the Sword is, as it were, consecrated to God; and the Art of WAR becomes a Part of our Religion. Then happy is he that shall reward our Enemies, as they have served us. Blessed is the brave Soldier: blessed is the Defender of his Country, and the Destroyer of its Enemies. Blessed are they who offer themselves willingly in this Service, and who faithfully discharge it.</p></blockquote>

<blockquote><p>[R]eligion and liberty are inseparably connected. They may be compared to twin trees, growing on the same root, and nourished by the same soil. Religion is the best nurse of freedom, and freedom is the natural defender of the faith. In all periods, as has often been observed, they have flourished or decayed together. And they have generally had common friends, and common foes.

To maintain religious liberty, we must secure civil freedom, because religious liberty, though descended immediately from God, depends, for the outward enjoyment of it, on civil laws. And, in like manner, to maintain our civil rights, we must maintain the gospel in its purity and power; otherwise, in course of time, a growing immorality will corrupt and endanger the noblest constitution ever devised by the wisdom of man. Civil liberty is mortal. She will soon decay, she will certainly die, when she ceases to be animated by religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Covenant the best Defence of Christ’s crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation</cite>, (Edinburgh: W. P. Kennedy, 1844), p. 46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“[R]eligion and liberty are inseparably connected. They may be compared to twin trees, growing on the same root, and nourished by the same soil. Religion is the best nurse of freedom, and freedom is the natural defender of the faith. In all periods, as has often been observed, they have flourished or decayed together. And they have generally had common friends, and common foes.

To maintain religious liberty, we must secure civil freedom, because religious liberty, though descended immediately from God, depends, for the outward enjoyment of it, on civil laws. And, in like manner, to maintain our civil rights, we must maintain the gospel in its purity and power; otherwise, in course of time, a growing immorality will corrupt and endanger the noblest constitution ever devised by the wisdom of man. Civil liberty is mortal. She will soon decay, she will certainly die, when she ceases to be animated by religion.”

— William White, Christ’s Covenant the best Defence of Christ’s crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation, (Edinburgh: W. P. Kennedy, 1844), p. 46.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BR%5Deligion+and+liberty+are+inseparably+connected.+They+may+be+compared+to+twin+trees%2C+growing+on+the+same+root%2C+and+nourished+by+the+same+soil.+Religion+is+the+best+nurse+of+freedom%2C+and+freedom+is+the+natural+defender+of+the+faith.+In+all+periods%2C+as+has+often+been+observed%2C+they+have+flourished+or+decayed+together.+And+they+have+generally+had+common+friends%2C+and+common+foes.%0A%0ATo+maintain+religious+liberty%2C+we+must+secure+civil+freedom%2C+because+religious+liberty%2C+though+descended+immediately+from+God%2C+depends%2C+for+the+outward+enjoyment+of+it%2C+on+civil+laws.+And%2C+in+like+manner%2C+to+maintain+our+civil+rights%2C+we+must+maintain+the+gospel+in+its+purity+and+power%3B+otherwise%2C+in+course+of+time%2C+a+growing+immorality+will+corrupt+and+endanger+the+noblest+constitution+ever+devised+by+the+wisdom+of+man.+Civil+liberty+is+mortal.+She+will+soon+decay%2C+she+will+certainly+die%2C+when+she+ceases+to+be+animated+by+religion.%E2%80%9D%0A%0A%E2%80%94+William+White%2C+Christ%E2%80%99s+Covenant+the+best+Defence+of+Christ%E2%80%99s+crown%3B+or+our+National+Covenants+Scriptural%2C+Catholic%2C+and+of+Permanent+Obligation%2C+%28Edinburgh%3A+W.+P.+Kennedy%2C+1844%29%2C+p.+46.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F91617f369c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91617f369c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/10/24/william-white-on-religion-and-civil-liberty/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Question 2. What are those things which make an action to become not voluntary. 4th Answer. Nothing at all but either absolute violence of constraint, or chance which could not be foreseen or prevented. And for such things as are done through absolute violence or mere chance, they have neither the nature of obedience or sin. As if one should be forced to offer incense or bow the knee before an idol, or should merely by chance kill another, Deut. 19:5-10. Question 3. What are we to think of those actions which are done through ignorance? 5th Answer. First, that ignorance which is in some sort a cause of the action (so that if a man knew what he did, he would not do it), if it be involuntary, both in itself and in its cause, that is, not affected nor procured, nor tolerated, does make the action merely casual and involuntary, and so excuses from sin.

6. Secondly, ignorance of the Law does never wholly excuse, because all men are bound to know the Will of God: but yet it does somewhat lessen the fault if it be not affected, 1 Tim. 1:13; John 4:41; Acts 3:17. But if it be affected, it is of itself a sin and so does not diminish, but rather increase the guilt of other sins, 2 Pet. 3:5.

7. Thirdly, an ignorance of the fact, if a man has used such diligence as he ought, does excuse him, because by such an ignorance the fact is made casual. So Jacob being deceived lay with Leah, whom he took to be Rachel, Gen. 29. But if due diligence have not been used, ignorance of the fact does not altogether excuse, although it do somewhat lessen the fault. And this seems to have been the case of Abimelech, Gen. 20:5. Question 4. What are we to judge of those actions which are done through fear? 8th Answer. First, fear does not simply make an action involuntary: but does, considering the circumstances of time and place, etc., impel a man to will this or that. As appears in that known instance of the merchant, who is induced through fear of death to throw away his merchandise into the sea. Fear therefore does never wholly excuse from sin: yea more, fear itself is oft a sin forbidden, and a cause too of most grievous sins, Mt. 10:26; Phil. 1:28; 1 Pet. 3:14; Apoc. 21:8. Although therefore, a great fear or terror, such as is wont sometimes to trouble even a man of good courage before men, be accounted for a good excuse, and is of force to make contracts done through fear void, yet before God such an excuse will not be taken. 9. Secondly, yet that sin which is committed through some strong terror, is not so grievous (if other things be alike) as that which is committed of the voluntary inclination of the will without any such fear of danger, because in fear the temptation is stronger: and such a fall, if repentance follow, does proceed not so much from malice, as from infirmity and perturbation. And this was Peter’s case when he denied Christ.</p></blockquote>

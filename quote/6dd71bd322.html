<main class="wrap"><figure class="quote" id="q-6dd71bd322" data-kw="">
<blockquote><p>He certainly did not suspect the Corinthians of such a degree of ignorance or carelessness as to think that they worshipped idols in their heart. But as they made no scruple of frequenting the assemblies of the wicked, and observing along with them certain rites instituted in honor of idols, he condemns this liberty taken by them, as being a very bad example. It is certain, then, that when he here makes mention of idolatry, he, speaks of what is outward, or, if you prefer it, of the profession of idolatry. For as God is said to be worshipped by the bending of the knee, and other tokens of reverence, while the principal and genuine worship of Him is inward, so is it also as to idols, for the case holds the same in things opposite. It is to no purpose that very many in the present day endeavor to excuse outward actions on this pretext, that the heart is not in them, while Paul convicts of idolatry those very acts, and assuredly with good reason. For, as we owe to God not merely the secret affection of the heart, but also outward adoration, the man who offers to an idol an appearance of adoration takes away so much of the honor due to God. Let him allege as he may that his heart is quite away from it. The action itself is to be seen, in which the honor that is due to God is transferred to an idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 10, verse 14</span></figcaption>

<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>

</figure><figure class="quote" id="q-e0036c79c8" data-kw="">
<blockquote><p>An institution is that which is merely founded upon God’s will, raising up a thing beyond its own natural or moral efficacy, with an efficacy beyond it… Institutions are not only express commands in the letter of them; for examples and promises, hints and implicit intimations may hold forth the will of Christ. Neither is everything that is the will and command of Christ an institution… So also there are means of edification which are providential, and so occasionally will serve… So as the constant setting apart of such a thing, for such an end (though providentially and occasionally, it may serve for such an end) rises up to an institution also. …Institutions are but the will of Christ, declared concerning such things as are exercised above the common nature of them, to a further spiritual end. Therefore the declaring the will of God about them, holds in common with the declaration of God’s will in other commands… We do not make everything a promise is made to an institution… promises are the declaration of God’s will, be they made to what things soever; and if they fall upon such things as are raised up above natural and common efficacy, with promise of a supernatural power to accompany them, then they are institutions…. When there is a commission of power given, there is a declared institution.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“An institution is that which is merely founded upon God’s will, raising up a thing beyond its own natural or moral efficacy, with an efficacy beyond it… Institutions are not only express commands in the letter of them; for examples and promises, hints and implicit intimations may hold forth the will of Christ. Neither is everything that is the will and command of Christ an institution… So also there are means of edification which are providential, and so occasionally will serve… So as the constant setting apart of such a thing, for such an end (though providentially and occasionally, it may serve for such an end) rises up to an institution also. …Institutions are but the will of Christ, declared concerning such things as are exercised above the common nature of them, to a further spiritual end. Therefore the declaring the will of God about them, holds in common with the declaration of God’s will in other commands… We do not make everything a promise is made to an institution… promises are the declaration of God’s will, be they made to what things soever; and if they fall upon such things as are raised up above natural and common efficacy, with promise of a supernatural power to accompany them, then they are institutions…. When there is a commission of power given, there is a declared institution.”

— Thomas Goodwin, Of the Constitution, Right, Order &amp; Government of the Churches of Christ (London: Snowden, 1696), ch. 4, pp. 17-19 in The Works of Thomas Goodwin… the Fourth Volume (London: Darby, 1697)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAn+institution+is+that+which+is+merely+founded+upon+God%E2%80%99s+will%2C+raising+up+a+thing+beyond+its+own+natural+or+moral+efficacy%2C+with+an+efficacy+beyond+it%E2%80%A6+Institutions+are+not+only+express+commands+in+the+letter+of+them%3B+for+examples+and+promises%2C+hints+and+implicit+intimations+may+hold+forth+the+will+of+Christ.+Neither+is+everything+that+is+the+will+and+command+of+Christ+an+institution%E2%80%A6+So+also+there+are+means+of+edification+which+are+providential%2C+and+so+occasionally+will+serve%E2%80%A6+So+as+the+constant+setting+apart+of+such+a+thing%2C+for+such+an+end+%28though+providentially+and+occasionally%2C+it+may+serve+for+such+an+end%29+rises+up+to+an+institution+also.+%E2%80%A6Institutions+are+but+the+will+of+Christ%2C+declared+concerning+such+things+as+are+exercised+above+the+common+nature+of+them%2C+to+a+further+spiritual+end.+Therefore+the+declaring+the+will+of+God+about+them%2C+holds+in+common+with+the+declaration+of+God%E2%80%99s+will+in+other+commands%E2%80%A6+We+do+not+make+everything+a+promise+is+made+to+an+institution%E2%80%A6+promises+are+the+declaration+of+God%E2%80%99s+will%2C+be+they+made+to+what+things+soever%3B+and+if+they+fall+upon+such+things+as+are+raised+up+above+natural+and+common+efficacy%2C+with+promise+of+a+supernatural+power+to+accompany+them%2C+then+they+are+institutions%E2%80%A6.+When+there+is+a+commission+of+power+given%2C+there+is+a+declared+institution.%E2%80%9D%0A%0A%E2%80%94+Thomas+Goodwin%2C+Of+the+Constitution%2C+Right%2C+Order+%26+Government+of+the+Churches+of+Christ+%28London%3A+Snowden%2C+1696%29%2C+ch.+4%2C+pp.+17-19+in+The+Works+of+Thomas+Goodwin%E2%80%A6+the+Fourth+Volume+%28London%3A+Darby%2C+1697%29&amp;url=https%3A%2F

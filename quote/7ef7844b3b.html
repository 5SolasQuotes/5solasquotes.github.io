<blockquote><p>But as for us, we have been taught that to expose newly-born children is the part of wicked men; and this we have been taught lest we should do any one an injury, and lest we should sin against God, first, because we see that almost all so exposed (not only the girls, but also the males) are brought up to prostitution. … And there are some who prostitute even their own children and wives, and some are openly mutilated for the purpose of sodomy; and they refer these mysteries to the mother of the gods, and along with each of those whom you esteem gods there is painted a serpent, a great symbol and mystery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Apology</cite>, (c. 155-57), 27 in Ante-Nicene Fathers, 1: 172.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b5eaa6e95" data-kw="">
<blockquote><p>Seventhly, are any of the Reformed Churches or any Churches or persons of the whole world so injurious to Magistrates as their principles force them to be, who spoil Christian Kings and Parliaments of their whole Legislative power? they will have us to believe, as good Divinity, that it is not only unlawful for Church-assemblies to make Ecclesiastick Canons, but that it is alike unlawful for any Prince or State to make a Civil Law,

That the placing of a Legislative power in Kings or Parliaments, is to usurp the property and prerogative of God.

These Principles cannot be very favourable to the State, which at one stroke annihilate all the Acts of Parliament that now are in force, either in this or any other Kingdom, and make it impossible (if they were believed) to have any more in any place of the earth, to the world’s end. Look back upon what I have cited from the chief of the Brownists writings.

I grant the New English polishers of Brownism do not express their Tenets in terms so hugely gross; yet see how near they come to them in substance, when they tell us that no Magistrate may make any Laws about the Bodies, Lands, Goods, Liberties of the Subject, which are not according to the Laws and Rules of Scripture, Scripture being given to men for a perfect rule, as well in matters of Civil Justice, as of devotion and holiness; and if so, then they must make it as unlawful and contrary to the Scriptures perfection, for any man to make Lawes in matters of Righteousness and of the State, as in matters of Holiness and of the Church.

That beside things in themselves good or evil, which Scripture determines by its Laws expressly, things of an indifferent nature, whereupon the most of civil Laws are made, must be regulated according to the Scripture rules of Piety, Charity, and Conscience, so far that the expediency and reason of the Law must ever carry and convince the conscience of the Subject: that no man is obliged to the obedience of a civil Law in a thing never so indifferent by the authority of the Law-giver, but every man whose conscience is not convinced of the piety and charity of that Law, is free from all obedience and subjection thereto: Thus far Mr Cotton.

Eightly, what men besides them have made so bold with Kings and Parliaments, as not only to break in pieces their old Lawes, and to divest them of all power to make new ones; but also under the pretext of a divine right, to put upon their necks that unsupportable yoke of the Judicial Law of the Jews, for peace and for war, without any power to dispense either in addition or subtraction? I grant this principle of Barrow is limited by Mr Cotton to such Judicials as do contain in them a moral equity; but this moral equity is extended by him to so many particulars, as Williams confesses the whole Judicial Law to be brought back again thereby, no less then by the plain simple and unlimited Tenet of the rigidest Brownists.

Ninthly, doth any Reformed Church appoint their Ministers to be members of the highest civil Courts, with power of voicing in the election of the supreme Magistrate?

Do any Divines but theirs, since the Bishops were abolished, join themselves as companions with the Magistrates, to draw out of Scripture a body of civil Lawes for the Government of the State?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), pp 127-28.</span></figcaption>

<blockquote><p>Augustine: … First of all, I think there should be a discussion whether a charging enemy or a murderer attacking from ambush may be killed without lust, but for the sake of one’s life, freedom, or chastity.

Evodius: How can I think that people are free of lust if they fight ferociously for things that can be lost against their will? On the other hand, if such things cannot be lost, what need is there to resort to killing someone for their sake?

Augustine: Therefore, the law is unjust which grants permission (a) to a traveller to kill a highway robber, so as not to be killed himself; (b) to any man or woman to slay a rapist in his onslaught, if possible, before enduring rape. Indeed, the law bids a soldier to kill the enemy, and if he holds back from this bloodshed he pays the penalties from his commander. Surely we will not dream of calling these laws unjust – or rather, not to call them “laws” at all, for a law that is not just does not seem to me to be a law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Free Choice of the Will</cite>, (c. 387-95), ed. and trans. Peter King (Cambridge: Cambridge University Press, 2010), 1.5.11.32-33.</span></figcaption>

<blockquote><p>Assertion 4. There may be some cases in which it is expedient to admit an accuser, and not to admit a process without one. As suppose one were under no ill report and yet some gross scandal were imputed to him, which were not of such fame, or had not such presumptions as to give ground for a Church-judicatory immediately to interpose, and the scandal being of such a nature as the trial thereof could neither be omitted, nor closed in private; in that case, suppose one should complain of the Church’s negligence in the same, asserting the evidences to be clear, and offering to make them out; In such a case, I say, the Church can hardly refuse to hear him, lest they be thought partial; nor is there ground, nor is it fit for them immediately to pursue it: Therefore an accuser is expedient, that so, upon the one side, the Church’s impartiality may be vindicated in refusing the complaint of no sober man, nor the uttermost of any trial, that in well grounded reason they may expect; And, on the other side, that the mouths of some needless and too importunate complainers may be stopped, and they themselves found censurable, if either without cause they traduce the Church-officers as negligent and partial, while there is access to make out before them such a truth if it be truth; or if precipitantly and inconsiderately (if not maliciously) they have tabled a scandal against another as a public scandal which they cannot make out, and so have needlessly troubled a Church-judicatory in such a matter and sinfully wronged their neighbor. For, a process in such cases where it cannot be made out, is scandalous: therefore if a person rest not satisfied so as to abstain till he have trial put to the utmost, he is to be dealt with as a scandalous person, lest men take liberty, under the pretext of pursuing offences, to defame others and abuse the ordinance of Christ. And though it be just in such a case, that he be materially dealt with as unjust accusers use to be in civil courts, yet this does not only flow from the consideration of such a persons being a formal accuser, but from the nature of the deed which is scandalous in such a measure, and that publicly, and therefore is to be restrained, whether the person take on him that formal consideration or not, lest yet, upon the matter, he continue publicly and importunately to press the pursuit. And we conceive, the imposing the title of accuser in such a case, or the making of it necessary, that one take on him that formal notion, is rather for conveniency to restrain men’s inordinateness and stop their mouths, and to add weight to the matter of the sentence if they fail, than as being simply necessary for making such a person to be accounted scandalous, if he come short.</p></blockquote>

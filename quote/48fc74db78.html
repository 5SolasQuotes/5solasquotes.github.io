<blockquote><p>II. These general laws are that all things be done to edification (the circumstances fitted to the end, the glory of God and the public good, the promoting of truth and godliness), that all be done in love, to the promoting of love and unity; and that all be done in order and decently, and as may avoid offense or scandal to all, both those without and those within. Gal. 6:15-16; Phil. 3:15-16; 1 Cor. 14:3, 5, 12, 26-27; Rom. 14:19; 15:2; 1 Cor. 10:23; Eph. 4:12, 16, 19; 2 Cor. 12:19; 6:3 &amp; 11:7; 1 Cor. 8:13. III. Therefore no rulers, civil or ecclesiastical, have their power to scandalize and destroy, but only to edify, being the ministers of God for good: Rom. 13:3-5; 2 Cor. 10:8; 13:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 4, p. 19</span></figcaption>

<blockquote><p>My arguments against the derivation of magistracy from Jesus Christ as Mediator, and against the magistrate’s holding of his office of and under Christ as Mediator, are these: First, this doctrine does evacuate and nullify the civil authority and government of all heathen or pagan magistrates; for which way was the authority of government derived from Christ, and from Him as Mediator, to a pagan magistrate or emperor? If he has not his power from Christ, as Mediator, then He is but a usurper, and has no just title to reign, according to their principles, who hold that all government, even civil, is given to Christ, and to Him as Mediator. Mr. Hussey, forsooth, does learnedly yield the argument, and answers, p. 20, that not only it is a sin to be a heathen, but the government of a heathen is sinful and unlawful; for which he gives this reason, ‘Whatsoever is not of faith is sin.’ He might as well conclude, in that sense, that the best virtues of the heathen were sin, because not of faith; that is, accidentally sin, in respect of the end, or manner of doing, not materially, or in their own nature. Upon the same reason he must conclude, that the government of a heathen magistrate per se [in of itself], simpliciter [essentially], et ex natura sua [out of its nature], unlawful and sinful? Whether has he any just right or title to government and magistracy? If his title to civil magistracy be just, and if his government be in itself materially and substantially lawful, then he must have a commission from Christ, and from him as Mediator. This I suppose cannot be Mr. Hussey’s sense, for he has not answered one syllable to the argument, tending that way. But if the government of a heathen magistrate be in itself materially, substantially, and in the nature of the tenure, sinful and unlawful, so that, as long as he remains a heathen, he has no real right or true title to government, but only a pretended and usurped title (which must needs be Mr. Hussey’s sense, if he has answered anything at all to my argument), then he goes cross not only to the holy men of God in the Old Testament, who honored heathen princes, and were subject to them as to lawful magistrates, but also to the doctrine of Jesus Christ, who taught his disciples to give unto Caesar what is Caesar’s; and of the apostles, who in their time, exhorted the churches to be subject even to the heathen magistrates (for they had no other at that time), to obey them, to pray for them, Rom. 13; Titus 3:1; 1 Tim. 2:1-2; 1 Pet. 2:13-17. It is justly condemned as one of the errors of the Anabaptists, that a heathen magistrate is not to be acknowledged as a lawful magistrate, or as being from God. See Gerhard, Loc. Com., tom. 6, p. 498-9; P. Hinkelmannus, de Anabaptismo, disp. 13, cap. 1 The Scriptures now cited are so clear, that when Mr. Hussey says of the heathen magistrate, ‘Let Baal plead for himself,’ he might as well have said, that Christ and his apostles pleaded for Baal. They that plead for the authority of a heathen magistrate do not plead for Baal, but for God, and for his ordinance; ‘For the powers that be are ordained of God,’ says Paul, speaking even of the heathen magistrates, Rom. 13:1. But what will Mr. Hussey say, if his great master Erastus be found a pleader for Baal as much as I am? Confirm. Thes., lib. 3, cap. 2, p. 184, speaking of the heathen and unbelieving magistrates, before whom the Corinthians went to law one against another, he says, [contains Latin], Is not the ungodly magistrate also preferred by God, that he may defend any of his subjects from injury and violence. Yea, the Scriptures afore touched are so clear in this point, that Gamachaeus, in Primam Secundae, quest. 4-5, cap. 33, though he hold that by human and ecclesiastical right, pagan princes lose their dominion and authority over their subjects when their subjects turn Christians, yet he acknowledges that they still retain their former jurisdiction over those subjects by the law of God and nature. Surely one might as well say, that heathen parents are unlawful, and heathen husbands are unlawful (all which were contrary to the Word of God), as to say that heathen magistrates are unlawful. Take the instance in parents; for all lawful magistrates are fathers by the fifth commandment: Does the paternity of a heathen father differre specie [differ in kind] from the paternity of a Christian father? are they not both lawful parents, being made such by God and nature? are not their children bound to honor them, and be subject to them, and obey them in things lawful? The paternity is the same in se [in principle], but different modaliter [in way], that I may borrow a distinction from Mr. Hussey. The Christian father is sanctified, and qualified to do service to Jesus Christ, as a father, in educating his children Christianly, which a heathen father cannot do. The heathen magistrate and the Christian magistrate are both lawful magistrates, being made such by God and nature, or by election of people. They are both of them to be honored, submitted unto, and obeyed; they are both of them the ministers of God for the good to their people; their power is the same in actu signato [the intent of power], though not in actu exercito [in how the power is actually exercised in specific acts]. The heathen magistrate may do, and ought to do, what the Christian magistrate does; but the Christian magistrate is fitted, qualified, enabled, and sanctified to glorify and serve Jesus Christ as a magistrate, which the heathen magistrate is not.</p></blockquote>

<blockquote><p>After the Restoration of the English monarchy in the person of Charles II in 1660, the new king and his first Parliament declared the anniversary of the beheading of his father Charles I (January 30, 1649) a religious holiday with a special commemoration in the Book of Common Prayer, naming the late monarch a saint and martyr. This holiday was not generally celebrated in Massachusetts until the emergence of several Anglican churches there in the early eighteenth century. In 1750, Jonathan Mayhew, the twenty-nine-year old pastor of the West (Congregational) Church in Boston, took occasion to dispute the first Charles’ credentials to saintship, martyrdom, and even his kingship as well. Mayhew’s Discourse is an extremely interesting bridge between the radical Puritan past and the American Revolutionary future. His sermon contains the language, rhetoric, symbolism, typology, and religious and philosophical arguments that would be used extensively in the agitation for American independence twenty-five years later. Mayhew (1720-1766) would subsequently take a leading role in the resistance to the Stamp Act of 1765, and his sermons and writings had an enormous impact on the evolution of New England Puritanism into American republican ideology.</p></blockquote>

<blockquote><p>§13. Question 8: May I give money to a judge or justice or court-officer to hire him to do me justice or to keep him from doing me wrong or to avoid persecution? Answer: You may not, in case your cause be bad, give anything to procure injustice against another; no nor speak a word for it nor desire it: This I take as presupposed. You may not give money to procure justice when the law of the land forbids it and when it will do more hurt accidentally to others than good to you: when it will harden men in the sin of bribery and cause them to expect the like from others. But except it be when some such accidental greater hurt does make it evil, it is as lawful as to hire a thief not to kill me; when you cannot have your right by other means, you may part with a smaller matter for a greater. §14. Question 9. But if I make such a contract, may the other lawfully take it of me? Answer: No: for it is now supposed that it is unlawful on his part. §15. Question 10. But if under necessity or force I promise money to a robber or a judge or officer, am I bound to perform it when necessity is over? Answer: You have lost your own propriety by your covenant and therefore must not retain it. But he can acquire no right by his sin; and therefore some say that in point of justice you are not bound to give it him, but to give it to the magistrate for the poor. But yet prudence may tell you of other reasons a fine to give it the man himself, though justice bind you not to it: as in case that else he may be revenged and do you some greater hurt, or some greater hurt is any other way likely to be the consequent, which it is lawful by money to prevent. But many think that you are bound to deliver the money to the thief or officer himself, because it is a lawful thing to do it, though he have no just title to it; and because it was your meaning, or the signification of your words in your covenant with him. And if it were not lawful to do it, it could not be lawful to promise to do it: otherwise your promise is a lie. To this, those of the other opinion say that as a man who is discharged of his promise by him that it was made to is not to be accounted false if he perform it not, so is it as to the thief or officer in question, because he having no right, is to you as the other that has quit his right. And this answer indeed will prove that it is not strict injustice not to pay the money promised: but it will not prove that it is not a lie to make such a promise with an intent of not-performing it, or that it is not a lie to make it with an intent of performing it, and not to do it when you may. Though here a Jesuit will tell you that you may say the words of a promise with an equivocation or mental reservation, to a thief or persecuting magistrate (of which see more in the chapters of lying, vows and perjury). I am therefore of opinion that your promise must be sincerely made and according to the true intent of it, you must offer the money to the thief or officer; except in case the magistrate forbid you, or some greater reason lie against it, which you foresaw not when you made the promise. But the offender is undoubtedly obliged not to take the money. §16. The same determination holds as to all contracts and promises made to such persons who by injurious force constrained us to make them. There is on us an obligation to veracity, though none to them in point of justice, because they have no proper right; nor may they lawfully take our payment or service promised them. And in case that the public good unexpectedly cross our performance, we must not perform it: Such like is the case of conquerors, and those that upon conquest become their vassals or subjects upon unrighteous terms. But still remember, that if it be not only a covenant with man, but a vow to God, which makes him a party, the case is altered, and we remain obliged. §17. Question 11. But may I promise the thief or bribe-taker to conceal his fault? and am I obliged to the performance of such a promise? Answer: This is a promise of omitting that which else would be a duty. It is ordinarily a duty to reveal a thief and bribe-taker that he may be punished. But affirmatives bind not ad semper [to all times]: no act (especially external) is a duty at all times: therefore not this of revealing an offender’s fault. And if it be not always a duty, then it must be none when it is inconsistent with some greater benefit or duty: For when two goods come together, the greater is to be preferred. Therefore in case that you see in just probability that the concealment of the sinner will do more hurt to the commonwealth or the souls of men than the saving of your life is like to do good, you may not promise to conceal him: or if you sinfully promise it, you may not perform it. But in case that your life is likely to be a greater good than the not promising to conceal him, then such a promise is no fault; because the disclosing him is no duty. But to judge rightly of this is a matter of great difficulty. If it be less than life which you save by such a promise, it oft falls out that it is a lesser good than the detecting of the offence. §18. But it will here be said, ‘If I promise not to conceal a robber, I must conceal him nevertheless; for when he has killed me, I cannot reveal him; and I must conceal the bribe-taker, for till I have promised secrecy, I cannot prove him guilty. And he that promises to forbear a particular good action whilst he lives, does yet reserve his life for all other good works: whereas if he die, he will neither do that nor any other.’ But this case is not so easily determined: If Daniel die, he can neither pray nor do any other good on earth. And if he live, he may do much other good though he never pray: and yet he might not promise to give over praying to save his life. I conceive that we must distinguish of duties essential to the outward part of Christianity, or of constant indispensable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.</p></blockquote>

— Richard Baxter, Christian Directory (London, 1673), pt. 4, ch. 19, title 2, p. 116-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A713.+Question+8%3A+May+I+give+money+to+a+judge+or+justice+or+court-officer+to+hire+him+to+do+me+justice+or+to+keep+him+from+doing+me+wrong+or+to+avoid+persecution%3F+Answer%3A+You+may+not%2C+in+case+your+cause+be+bad%2C+give+anything+to+procure+injustice+against+another%3B+no+nor+speak+a+word+for+it+nor+desire+it%3A+This+I+take+as+presupposed.+You+may+not+give+money+to+procure+justice+when+the+law+of+the+land+forbids+it+and+when+it+will+do+more+hurt+accidentally+to+others+than+good+to+you%3A+when+it+will+harden+men+in+the+sin+of+bribery+and+cause+them+to+expect+the+like+from+others.+But+except+it+be+when+some+such+accidental+greater+hurt+does+make+it+evil%2C+it+is+as+lawful+as+to+hire+a+thief+not+to+kill+me%3B+when+you+cannot+have+your+right+by+other+means%2C+you+may+part+with+a+smaller+matter+for+a+greater.+%C2%A714.+Question+9.+But+if+I+make+such+a+contract%2C+may+the+other+lawfully+take+it+of+me%3F+Answer%3A+No%3A+for+it+is+now+supposed+that+it+is+unlawful+on+his+part.+%C2%A715.+Question+10.+But+if+under+necessity+or+force+I+promise+money+to+a+robber+or+a+judge+or+officer%2C+am+I+bound+to+perform+it+when+necessity+is+over%3F+Answer%3A+You+have+lost+your+own+propriety+by+your+covenant+and+therefore+must+not+retain+it.+But+he+can+acquire+no+right+by+his+sin%3B+and+therefore+some+say+that+in+point+of+justice+you+are+not+bound+to+give+it+him%2C+but+to+give+it+to+the+magistrate+for+the+poor.+But+yet+prudence+may+tell+you+of+other+reasons+a+fine+to+give+it+the+man+himself%2C+though+justice+bind+you+not+to+it%3A+as+in+case+that+else+he+may+be+revenged+and+do+you+some+greater+hurt%2C+or+some+greater+hurt+is+any+other+way+likely+to+be+the+consequent%2C+which+it+is+lawful+by+money+to+prevent.+But+many+think+that+you+are+bound+to+deliver+the+money+to+the+thief+or+officer+himself%2C+because+it+is+a+lawful+thing+to+do+it%2C+though+he+have+no+just+title+to+it%3B+and+because+it+was+your+meaning%2C+or+the+signification+of+your+words+in+your+covenant+with+him.+And+if+it+were+not+lawful+to+do+it%2C+it+could+not+be+lawful+to+promise+to+do+it%3A+otherwise+your+promise+is+a+lie.+To+this%2C+those+of+the+other+opinion+say+that+as+a+man+who+is+discharged+of+his+promise+by+him+that+it+was+made+to+is+not+to+be+accounted+false+if+he+perform+it+not%2C+so+is+it+as+to+the+thief+or+officer+in+question%2C+because+he+having+no+right%2C+is+to+you+as+the+other+that+has+quit+his+right.+And+this+answer+indeed+will+prove+that+it+is+not+strict+injustice+not+to+pay+the+money+promised%3A+but+it+will+not+prove+that+it+is+not+a+lie+to+make+such+a+promise+with+an+intent+of+not-performing+it%2C+or+that+it+is+not+a+lie+to+make+it+with+an+intent+of+performing+it%2C+and+not+to+do+it+when+you+may.+Though+here+a+Jesuit+will+tell+you+that+you+may+say+the+words+of+a+promise+with+an+equivocation+or+mental+reservation%2C+to+a+thief+or+persecuting+magistrate+%28of+which+see+more+in+the+chapters+of+lying%2C+vows+and+perjury%29.+I+am+therefore+of+opinion+that+your+promise+must+be+sincerely+made+and+according+to+the+true+intent+of+it%2C+you+must+offer+the+money+to+the+thief+or+officer%3B+except+in+case+the+magistrate+forbid+you%2C+or+some+greater+reason+lie+against+it%2C+which+you+foresaw+not+when+you+made+the+promise.+But+the+offender+is+undoubtedly+obliged+not+to+take+the+money.+%C2%A716.+The+same+determination+holds+as+to+all+contracts+and+promises+made+to+such+persons+who+by+injurious+force+constrained+us+to+make+them.+There+is+on+us+an+obligation+to+veracity%2C+though+none+to+them+in+point+of+justice%2C+because+they+have+no+proper+right%3B+nor+may+they+lawfully+take+our+payment+or+service+promised+them.+And+in+case+that+the+public+good+unexpectedly+cross+our+performance%2C+we+must+not+perform+it%3A+Such+like+is+the+case+of+conquerors%2C+and+those+that+upon+conquest+become+their+vassals+or+subjects+upon+unrighteous+terms.+But+still+remember%2C+that+if+it+be+not+only+a+covenant+with+man%2C+but+a+vow+to+God%2C+which+makes+him+a+party%2C+the+case+is+altered%2C+and+we+remain+obliged.+%C2%A717.+Question+11.+But+may+I+promise+the+thief+or+bribe-taker+to+conceal+his+fault%3F+and+am+I+obliged+to+the+performance+of+such+a+promise%3F+Answer%3A+This+is+a+promise+of+omitting+that+which+else+would+be+a+duty.+It+is+ordinarily+a+duty+to+reveal+a+thief+and+bribe-taker+that+he+may+be+punished.+But+affirmatives+bind+not+ad+semper+%5Bto+all+times%5D%3A+no+act+%28especially+external%29+is+a+duty+at+all+times%3A+therefore+not+this+of+revealing+an+offender%E2%80%99s+fault.+And+if+it+be+not+always+a+duty%2C+then+it+must+be+none+when+it+is+inconsistent+with+some+greater+benefit+or+duty%3A+For+when+two+goods+come+together%2C+the+greater+is+to+be+preferred.+Therefore+in+case+that+you+see+in+just+probability+that+the+concealment+of+the+sinner+will+do+more+hurt+to+the+commonwealth+or+the+souls+of+men+than+the+saving+of+your+life+is+like+to+do+good%2C+you+may+not+promise+to+conceal+him%3A+or+if+you+sinfully+promise+it%2C+you+may+not+perform+it.+But+in+case+that+your+life+is+likely+to+be+a+greater+good+than+the+not+promising+to+conceal+him%2C+then+such+a+promise+is+no+fault%3B+because+the+disclosing+him+is+no+duty.+But+to+judge+rightly+of+this+is+a+matter+of+great+difficulty.+If+it+be+less+than+life+which+you+save+by+such+a+promise%2C+it+oft+falls+out+that+it+is+a+lesser+good+than+the+detecting+of+the+offence.+%C2%A718.+But+it+will+here+be+said%2C+%E2%80%98If+I+promise+not+to+conceal+a+robber%2C+I+must+conceal+him+nevertheless%3B+for+when+he+has+killed+me%2C+I+cannot+reveal+him%3B+and+I+must+conceal+the+bribe-taker%2C+for+till+I+have+promised+secrecy%2C+I+cannot+prove+him+guilty.+And+he+that+promises+to+forbear+a+particular+good+action+whilst+he+lives%2C+does+yet+reserve+his+life+for+all+other+good+works%3A+whereas+if+he+die%2C+he+will+neither+do+that+nor+any+other.%E2%80%99+But+this+case+is+not+so+easily+determined%3A+If+Daniel+die%2C+he+can+neither+pray+nor+do+any+other+good+on+earth.+And+if+he+live%2C+he+may+do+much+other+good+though+he+never+pray%3A+and+yet+he+might+not+promise+to+give+over+praying+to+save+his+life.+I+conceive+that+we+must+distinguish+of+duties+essential+to+the+outward+part+of+Christianity%2C+or+of+constant+indispensable+necessity%2C+and+duties+which+are+alterable+and+belong+only+to+some+persons%2C+times+and+places%3A+Also+between+the+various+consequents+of+omissions.+And+I+conceive+that+ordinarily+a+man+may+promise+for+the+saving+of+his+life+that+he+will+forbear+a+particular+alterable+duty+or+relation%3A+as+to+read+such+a+commentary%2C+to+speak+with+such+a+minister%2C+to+be+a+magistrate+or+a+minister%2C+etc.+in+case+we+have+not+before+bound+ourselves+never+to+give+over+our+calling+till+death%3A+and+in+case+that+the+good+which+will+follow+our+forbearance+is+likely+%28to+a+judicious+person%29+to+be+greater+than+the+evil.+But+no+man+may+promise+to+omit+such+a+duty+as+God+has+made+necessary+during+life%3A+as+not+to+love+God+or+fear+or+trust+Him%3A+not+to+worship+Him+and+call+upon+Him+and+praise+Him%3A+nor+to+do+good+to+men%E2%80%99s+souls+or+bodies+in+the+general%3A+or+not+to+preach+or+pray+while+I+am+a+minister+of+Christ%2C+or+not+at+all+to+govern+while+you+are+a+governor.+For+all+these+contradict+some+former+and+greater+promises+or+duties.+Nor+may+you+omit+the+smallest+duty+to+save+your+life+at+such+a+time+when+your+death+is+likely+to+do+more+good+than+your+life+would+do+without+that+one+duty.+Apply+this+to+the+present+case.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Directory+%28London%2C+1673%29%2C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+116-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca12e1cddd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca12e1cddd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=13.%20Question%208%3A%20May%20I%20give,Apply%20this%20to%20the%20present%20case&amp;text=13.%20Question%208%3A%20May%20I%20give%20money%20to&amp;text=one%20duty.%20Apply%20this%20to%20the%20present%20case" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9942965d15" data-kw="">
<blockquote><p>The elements being now sanctified by the word and prayer, the minister, being at the table, is to take the bread in his hand, and say, in these expressions, (or other the like, used by Christ or his apostle upon this occasion): ‘According to the holy institution, command, and example of our blessed Saviour Jesus Christ, I take this bread, and, having given thanks, break it, and give it unto you; (there the minister, who is also himself to communicate, is to break the bread, and give it to the communicants;) Take ye, eat ye; this is the body of Christ which is broken for you: do this in remembrance of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for the Public Worship of God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

</figure><figure class="quote" id="q-752dfaf3c6" data-kw="">
<blockquote><p>Secondly, it was not of the substance of the institution [of the Lord’s Supper] to eat unleavened bread, no more than to eat it at night… we are not more bound to the one, than to the other. Again, Christ used unleavened bread because it was the usual bread at that time: so we do use that which is the usual bread in our time. And St. Paul speaketh of such bread as was usual among the gentiles, when he saith, ‘The bread which we break’, 1. Cor. 10:17. Ergo, ordinary bread and leavened [is] to be used, not unleavened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Concerning the Elements, or the Material Part of the Sacrament, namely Bread and Wine’ in Synopsis Papismi</cite>, (London, 1592), Controversies Concerning the Church Triumphant, 13th Controversy, of the Sacrament of the Lord’s Supper, First Part: of the Sacrament of the Eucharist, 4th Question, p. 462</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1c273677ba" data-kw="">
<blockquote><p>…the Rejoinder [in opposition to Ames] answers that sopping of bread in wine is worse than the cross: 1. Because the cross makes no alteration, of what Christ did ordain, saying ‘Do this.’ 2. It is not substituted in the place of baptism, as sops in wine were by those heretics in place of the [Lord’s] Supper. 3. It is not esteemed an instrumental sign of any grace given by the use of it, as they took their sops to be. 4. Their sopping destroyed the very sacrament. …But [Ames answers]: 1. Addition is as evil as alteration. For when Christ said, ‘Do this,’ He meant as well, do this only, as do this all. Fac hoc totum: fac hoc tantum: as [Jerome] Zanchi expounds it. Addition also is some alteration, if not of the things instituted, yet of the institution, as making it insufficient or incomplete by itself alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 36-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

</figure><figure class="quote" id="q-a019d5253b" data-kw="">
<blockquote><p>In the mean while Satan, using every exertion to subvert entirely the church erected at Geneva, which had been shaken to its very foundation, found in a short time some idle characters, who, for the purpose of concealing the great iniquity of the decree under the pretext of religion, determined that unleavened bread should be substituted for common, formerly used at the Lord’s table, with a view to afford an opportunity for fomenting new dissensions. And the great enemy of the Church would have succeeded in this plan, had not Calvin seriously admonished some good men, so displeased with the change as to consider it their duty to refrain from taking the Lord’s Supper, not to contend about a subject in itself indifferent. The use of unleavened bread commenced in the manner now stated, nor did Calvin on his future restoration think it worth while to make any opposition to the practice, though he [Calvin] did not attempt to conceal his approval of the use of common bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>

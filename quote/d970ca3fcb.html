<main class="wrap"><figure class="quote" id="q-d970ca3fcb" data-kw="">
<blockquote><p>It is a great sin to think any sin little; but it is a greater sin to think the righteousness of Christ is not above all sin. Our disobedience is the disobedience of man; but Christ’s obedience is the obedience of God: therefore, our believing in Christ doth please God better than if we had continued innocency, and never sinned. The least sin is unpardonable without this obedience and righteousness of Christ; and the greatest is pardonable by it. Therefore, O seek in to Christ, to be clothed upon with this righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“And Walking in Him, Opened”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f73420d41d" data-kw="">
<blockquote><p>We think that even the adversaries acknowledge that, in justification, the remission of sins is necessary first. For we all are under sin. Wherefore we reason thus: To attain the remission of sins is to be justified, according to Ps. 32:1, ‘Blessed is he whose transgression is forgiven.’ By faith alone in Christ, not through love, not because of love or works, do we acquire the remission of sins, although love follows faith. Therefore by faith alone we are justified, understanding justification as the making of a righteous man out of an unrighteous, or that he be regenerated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology of the Augsburg Confession</cite>, Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004), pt. 2 | pt. 5, That we obtain remission of sins by faith alone in Christ</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

— Philip Melanchthon, Apology of the Augsburg Confession Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004), pt. 2 | pt. 5, That we obtain remission of sins by faith alone in Christ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+think+that+even+the+adversaries+acknowledge+that%2C+in+justification%2C+the+remission+of+sins+is+necessary+first.+For+we+all+are+under+sin.+Wherefore+we+reason+thus%3A+To+attain+the+remission+of+sins+is+to+be+justified%2C+according+to+Ps.+32%3A1%2C+%E2%80%98Blessed+is+he+whose+transgression+is+forgiven.%E2%80%99+By+faith+alone+in+Christ%2C+not+through+love%2C+not+because+of+love+or+works%2C+do+we+acquire+the+remission+of+sins%2C+although+love+follows+faith.+Therefore+by+faith+alone+we+are+justified%2C+understanding+justification+as+the+making+of+a+righteous+man+out+of+an+unrighteous%2C+or+that+he+be+regenerated.%E2%80%9D%0A%0A%E2%80%94+Philip+Melanchthon%2C+Apology+of+the+Augsburg+Confession+Trans.+F.+Bente+%26+W.+H.+T.+Dau+%281531%3B+Project+Gutenberg%2C+2004%29%2C+pt.+2+%7C+pt.+5%2C+That+we+obtain+remission+of+sins+by+faith+alone+in+Christ&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff73420d41d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f73420d41d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=We%20think%20that%20even%20the%20adversaries,unrighteous%2C%20or%20that%20he%20be%20regenerated&amp;text=We%20think%20that%20even%20the%20adversaries%20acknowledge%20that&amp;text=of%20an%20unrighteous%2C%20or%20that%20he%20be%20regenerated" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-685f4674f0" data-kw="">
<blockquote><p>These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith; and by them believers manifest their thankfulness, strengthen their assurance, edify their brethren, adorn the profession of the gospel, stop the mouths of the adversaries, and glorify God, whose workmanship they are, created in Christ Jesus thereunto, that having their fruit unto holiness they may have the end eternal life.</p></blockquote>

</figure><figure class="quote" id="q-e52f9a1a92" data-kw="">
<blockquote><p>Rule II. That justification stands in two things: First in the remission of sins by the merit of Christ’s death: Secondly in the imputation of Christ’s righteousness; which is another action of God whereby He accounts and esteems that righteousness which is in Christ, as the righteousness of that sinner which believes in Him. By Christ’s righteousness we are to understand two things: First his sufferings, specially in his death and passion; Secondly his obedience in fulfilling the Law: both which go together: for Christ in suffering obeyed, and obeying suffered. And the very shedding of his blood to which our salvation is ascribed, must not only be considered as it is passive, that is a suffering, but also as it is active, that is, an obedience, in which He showed his exceeding love both to his Father and us, and thus fulfilled the law for us. This point, if some had well thought on, they would not have placed all justification in remission of sins as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... ([Cambridge] 1598), ch. 4, ‘The Justification of a Sinner’, p. 925</span></figcaption>

</figure><figure class="quote" id="q-4a638b46e5" data-kw="">
<blockquote><p>Justification takes place once for all. It is not repeated, neither is it a process; it is complete at once and for all time. There is no more or less in justification; man is either fully justified, or he is not justified at all. In distinction from it sanctification is a continuous process, which is never completed in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids, MI: Wm. B. Eerdmans Publishing Co., 1938), 513–14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<main class="wrap"><figure class="quote" id="q-2c7a8de1d6" data-kw="">
<blockquote><p>L… The indispensible Law of Nature obliges every man according to his place and calling, his ability, and his opportunities, to do his best to propagate Christ’s gospel and to save mens souls, as much and more than to feed men’s bodies and save their lives… And we did not receive this calling to be altered or forborn at the will of man, but to be performed according to the Word of God: Men being not the makers of the office, nor of God’s Law under which we execute it, nor the donors or limiters of the power, but only… the governors of us in the exercise of it, according to God’s laws, by which they may punish us for mal-administration, but cannot dissolve the Law’s obligation to those that are indeed commanded by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, pp. 84-85</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f48c2aab2" data-kw="">
<blockquote><p>As the king is obliged to God for the maintenance of true religion, so are the people and princes no less in their place obliged to maintain true religion; for the people are rebuked because they burn incense in all high places, 2 Kings 17:11; 2 Chron. 33:17; Hos. 4:13. And the reason why the high places are not taken away is given in 2 Chron. 20:33, for as yet the people “had not prepared their heart unto the God of their fathers;</p></blockquote>

</figure><figure class="quote" id="q-d4cffed88b" data-kw="">
<blockquote><p>1. That by Divine as well as by human right the supreme Magistrate himself is appointed for managing business of this kind. In the Scriptures, 1 Kings 15 and 17, it is the express eulogy of the good kings that they “took away” the high places and removed the “idols”; on the contrary it is the perpetual stigma of the bad ones that they did not take away, did not remove them; 2 Kings 18 and 23… Hence it is evident from whom God expects the Reformation of the Church and of Religion… 2. Secondly, as the authority of reforming the Church is imposed upon kings, so it is removed from the people. For where a vocation is wanting [lacking], although the thing which is done, considered in itself, be laudable, yet there i blame attaching to the agent, on account of the defect of a lawful power. To offer sacrifices to God was in itself pious and religious; but in Saul, who had no call to this office, it was impious and sacrilegious; (1 Sam. 13:13)… Search the sacred Scriptures, you will find the people of God everywhere blamed because they worshipped the golden calves… but never censured by any prophet becaue they did not remove idolatry by force of arms, against the will of their kings. That this work, consequently, does not belong to the people, the prophets have taught by this their silence on the subject… Thirdly… 1… But what then [it may be asked] are those duties?… To beware of bowing down before idols; to avoid heresies, not to extirpate them by force of arms; to bewail the corruptions of the Church, not to remove them; in one word, to endure the severest punishments inflicted by the Magistrate rather than to desert the true religion; not to force the Magistrate to introduce true religion (1 Kings 19; Eze. 9)… ‘Religion certainly should be defended by all private individuals, though not by slaying, but by dying; not by severity, but by patience; not by wickedness, but by faith,’ as Lactantius has admirably said, Institutes 5.20. 2. Moreover, it is not allowable in the people when the magistrate refuses it, to put their hand to this business… For he who undertakes to reform religion when the magistrate is reluctant, first dethrones the magistrate himelf, tramples upon him, and must necessarily reduce him to the common level… cursed are they who stir up rebellion under the cloak of these things. It is a maxim of lawyers… ‘an equal has no power over his equal’: how much less inferior over superior… I thus sum up all: Equity does not allow it; necessity does not require it; utility does not advise it: therefore, it is unlawful for the people, againt the consent of the Magistrate, to attempt the Reformation of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification</cite>, Question 12, ‘The People may not Attempt a Reformation in the Church Against the Consent of the Magistrate’ in The Determinations, or Resolutions of Certain Theological Questions tr. Josiah Allport (1634; 1846) bound after Davenant, A Treatise on Justification, or the Disputatio de Justitia... tr. Allport (1631; London, 1846), vol. 2, pp. 279-83</span></figcaption>

<blockquote><p>6. Above all, see that you be followers of peace and unity, both in the Church and among your selves. Remember what I taught you on Heb. 12:14, he that is not a son of peace is not a son of God. All other sins destroy the Church consequentially, but division and separation demolish it directly. Building the Church is but an orderly joining of the materials; and what then is disjoining, but pulling down? Many doctrinal differences must be tolerated in a Church: And why? but for unity and peace? Therefore disunion and separation is utterly intolerable. Believe not those to be the Church’s friends that would cure and reform her by cutting her throat. Those that say, ‘No truth must be concealed for peace,’ have usually as little of the one as the other. Study Gal. 2:2; Rom. 14:1, etc. Acts 21:24, 26; 1 Tim 1:4 and 6:4; Tit. 3:8-9. I hope sad experience speaks this lesson to your very hearts, if I should say nothing. Do not your hearts bleed to look upon the state of England? and to think how few towns or cities there be (where is any forwardness in religion) that are not cut into shreds and crumbled as to dust by separations and divisions? To think what a wound we have hereby given to the very Christian name? How we have hardened the ignorant? Confirmed the Papists? And are ourselves become the scorn of our enemies and the grief of our friends? And how many of our dearest, best esteemed friends are fain to notorious pride or impiety? yea, some to be worse then open infidels? These are pillars of salt; see that you remember them. You are yet eminent for your unity, steadfastness, and godliness; hold fast that you have, that no man take your crown from you… If there be erroneous practices in the Church, keep yourselves innocent with moderation and peace: Do your best to reform them and rather remove your dwellings if you cannot live innocently, than rend the Church. It must be no small error that must force a separation… You know I never conformed to the use of mystical, symbolical rites myself (but only to the determination of circumstantials necessary in genere) and yet I ever loved a godly, peaceable Conformist better than a turbulent, non-conformist. I yet differ from many in several doctrines of greater moment than baptism… and yet if I should zealously press my judgment on others, and seek to make a party for it, and disturb the peace of the Church, and separate from my brethren, I should fear lest I should prove a firebrand in Hell for being a firebrand in the Church. And for all the interest I have in your judgments and affections, I here charge you that if God should give me up to any factious Church-rending course (against which I daily pray) that you forsake me and follow me not a step.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Everlasting Rest</cite>, (London: White, 1650), ‘To my dearly beloved friends’</span></figcaption>

n… You know I never conformed to the use of mystical, symbolical rites myself (but only to the determination of circumstantials necessary in genere) and yet I ever loved a godly, peaceable Conformist better than a turbulent, non-conformist. I yet differ from many in several doctrines of greater moment than baptism… and yet if I should zealously press my judgment on others, and seek to make a party for it, and disturb the peace of the Church, and separate from my brethren, I should fear lest I should prove a firebrand in Hell for being a firebrand in the Church. And for all the interest I have in your judgments and affections, I here charge you that if God should give me up to any factious Church-rending course (against which I daily pray) that you forsake me and follow me not a step.”

— Richard Baxter, The Saints’ Everlasting Rest (London: White, 1650), ‘To my dearly beloved friends’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+Above+all%2C+see+that+you+be+followers+of+peace+and+unity%2C+both+in+the+Church+and+among+your+selves.+Remember+what+I+taught+you+on+Heb.+12%3A14%2C+he+that+is+not+a+son+of+peace+is+not+a+son+of+God.+All+other+sins+destroy+the+Church+consequentially%2C+but+division+and+separation+demolish+it+directly.+Building+the+Church+is+but+an+orderly+joining+of+the+materials%3B+and+what+then+is+disjoining%2C+but+pulling+down%3F+Many+doctrinal+differences+must+be+tolerated+in+a+Church%3A+And+why%3F+but+for+unity+and+peace%3F+Therefore+disunion+and+separation+is+utterly+intolerable.+Believe+not+those+to+be+the+Church%E2%80%99s+friends+that+would+cure+and+reform+her+by+cutting+her+throat.+Those+that+say%2C+%E2%80%98No+truth+must+be+concealed+for+peace%2C%E2%80%99+have+usually+as+little+of+the+one+as+the+other.+Study+Gal.+2%3A2%3B+Rom.+14%3A1%2C+etc.+Acts+21%3A24%2C+26%3B+1+Tim+1%3A4+and+6%3A4%3B+Tit.+3%3A8-9.+I+hope+sad+experience+speaks+this+lesson+to+your+very+hearts%2C+if+I+should+say+nothing.+Do+not+your+hearts+bleed+to+look+upon+the+state+of+England%3F+and+to+think+how+few+towns+or+cities+there+be+%28where+is+any+forwardness+in+religion%29+that+are+not+cut+into+shreds+and+crumbled+as+to+dust+by+separations+and+divisions%3F+To+think+what+a+wound+we+have+hereby+given+to+the+very+Christian+name%3F+How+we+have+hardened+the+ignorant%3F+Confirmed+the+Papists%3F+And+are+ourselves+become+the+scorn+of+our+enemies+and+the+grief+of+our+friends%3F+And+how+many+of+our+dearest%2C+best+esteemed+friends+are+fain+to+notorious+pride+or+impiety%3F+yea%2C+some+to+be+worse+then+open+infidels%3F+These+are+pillars+of+salt%3B+see+that+you+remember+them.+You+are+yet+eminent+for+your+unity%2C+steadfastness%2C+and+godliness%3B+hold+fast+that+you+have%2C+that+no+man+take+your+crown+from+you%E2%80%A6+If+there+be+erroneous+practices+in+the+Church%2C+keep+yourselves+innocent+with+moderation+and+peace%3A+Do+your+best+to+reform+them+and+rather+remove+your+dwellings+if+you+cannot+live+innocently%2C+than+rend+the+Church.+It+must+be+no+small+error+that+must+force+a+separation%E2%80%A6+You+know+I+never+conformed+to+the+use+of+mystical%2C+symbolical+rites+myself+%28but+only+to+the+determination+of+circumstantials+necessary+in+genere%29+and+yet+I+ever+loved+a+godly%2C+peaceable+Conformist+better+than+a+turbulent%2C+non-conformist.+I+yet+differ+from+many+in+several+doctrines+of+greater+moment+than+baptism%E2%80%A6+and+yet+if+I+should+zealously+press+my+judgment+on+others%2C+and+seek+to+make+a+party+for+it%2C+and+disturb+the+peace+of+the+Church%2C+and+separate+from+my+brethren%2C+I+should+fear+lest+I+should+prove+a+firebrand+in+Hell+for+being+a+firebrand+in+the+Church.+And+for+all+the+interest+I+have+in+your+judgments+and+affections%2C+I+here+charge+you+that+if+God+should+give+me+up+to+any+factious+Church-rending+course+%28against+which+I+daily+pray%29+that+you+forsake+me+and+follow+me+not+a+step.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Saints%E2%80%99+Everlasting+Rest+%28London%3A+White%2C+1650%29%2C+%E2%80%98To+my+dearly+beloved+friends%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1aa6a1c835.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1aa6a1c835.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-reformation/#:~:text=6.%20Above%20all%2C%20see%20that%20you,and%20follow%20me%20not%20a%20step&amp;text=6.%20Above%20all%2C%20see%20that%20you%20be%20followers&amp;text=forsake%20me%20and%20follow%20me%20not%20a%20step" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We have no new calves, new altars, new feasts, but profess, and really do hazard life and estate to put away the Prelate’s calves, images, tree-worship, altar-worship, saints, feast-days, idolatry, masses; and nothing is said here but Jesuits, and Canaanites, and Baalites, might say (though falsely) against the reformation of Josiah. Truth and purity of worship this year is new in relation to idolatry last year, but it is simpliciter older.</p></blockquote>

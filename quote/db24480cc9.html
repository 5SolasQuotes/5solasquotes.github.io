<blockquote><p>[F]or this mutability or Potential indetermination, is an imperfection; and so that same potest as peccandi, power to sin, which some make necessary to liberty, and which they call a perfection though they grant the action of sin it self to be an imperfection (though this should be granted, which must not) yet neither could this be found in God’s liberty, and no marvel, seeing that it is not in the liberty of Christ’s human will, for though Christ’s obedience was truly and properly so, being under a command of God, yet not only as he was God, but as he was man, he was … impeccablo, or free from the temptation of sin. Therefore its detestable blasphemy of Durand and other Schoolmen, saying, Christ might have sinned, lib. 3. Sentent. dist. 12. quae. 2. as also of the Remonstrants who say, Christ after he had taken this Office of a mediatorship, might have forsaken it, and given it over,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 95.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-641785839b" data-kw="">
<blockquote><p>Christ, as God, sanctified Himself in His humanity: (1) By appointing His humanity as a sacrifice for sins. (2) By conferring merit and efficacy to His sacrifice, in order to acquire the remission of sins. Some of the Lutherans say that the person, according to both natures, was the subject of the passion. Whence that horrible assertion: the Deity also suffered: which most moderns disapprove, and that rightly. At the same time, being impatient of our animadversion, they strike at us with something else, itself erroneous, concerning the subject of the passion: namely, that, according to the opinion of the Calvinists, only the human nature of Christ suffered: which they then refute with many arguments, but in vain. They invent for themselves an enemy: they do not have us in this role, who orthodoxly and according to Scripture teach, that Christ, according to the flesh, suffered, 1 Pet. 4:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Species of the Office of Christ, pt. 2</span></figcaption>

</figure><figure class="quote" id="q-248867e842" data-kw="">
<blockquote><p>That he ceased to be God when he became man, he did not, and could not. There was no cessation of the Godhead, in the stooping to the manhood. The human did not become Divine, nor did the Divine become human. There was no coalescing, no blending together of these two extremes of being. Mysteriously, closely, and indissolubly one, they yet were separate and distinct, the peculiar properties of each unaffected and unchanged by its union with the other. This constituted one of the essential wonders in the “great mystery of godliness, God manifest in the flesh.”

The deity of Christ was incapable of change, else deity it could not be. It was incapable, too, of any sympathy or participation in the humiliation and suffering through which the humanity passed. Upholding and strengthening the manhood, it yet remained free from all the pains which it endured. Towering far above the storms which swept over the human soul of Christ — above the sea of suffering and blood through which he waded — above the infirmities, weaknesses, and tears which pressed upon the “incarnate mystery,” the Godhead of Jesus rose untouched, unaffected, and unmoved. The shock which convulsed to its centre his human frame, agitated not for an instant, his essential deity. Here all was calm, serene, and tranquil. The dark clouds which gathered around his inferior nature threw not a shadow athwart the sun of his superior nature.</p></blockquote>

<blockquote><p>Here observe what grace there is in Christ. The schools tell us, that in him there is a threefold grace. 1. The grace of union. The human nature of Christ, hath received the high grace or favour to be personally united to the second person of the godhead; by virtue of which union the fulness of the godhead is said to dwell in him bodily—bodily, that is, personally, or substantially, in opposition to the types and shadows of the Old Testament, in which God is said to dwell in a figure.

God was said to dwell in the tabernacle, in the ark of the covenant, in the temple; but in these he dwelt only as figures and shadows of the human nature of Christ. In Christ he dwells not in a figure, but personally and substantially. As Christ, Col. 2:17, is called the body, in opposition to the types of old, which were but the shadow; so bodily here denotes not a figurative, but a personal inhabitation. Christ is the body, not a shadow; and God dwells in him bodily, that is, substantially, and not in a shadow.

2. Habitual grace. All those moral perfections wherein stands the holiness of his nature: the love and fear of God; his humility, meekness, patience; in sum, Ins perfect conformity to the image and whole will of God. “Such a High-priest became us, who is holy, harmless, undefiled, separate from sinners.” Heb. 7:26.

3. The honour which is given to him to be Head of the church. Also observe how Christ is said to be full of grace. There is a twofold fullness of grace. In respect to grace itself: thus he is said to be full of grace, that hath all grace, and hath it in the greatest excellency and perfection. Also, in respect to the person that hath it; and thus a person is said to be full of grace, that hath as much grace as he is capable of. Christ is full of grace in both respects: the grace which is in him, is grace in the highest perfection of it, and in infinite fulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven Opened; or, A Brief and Plain Discovery of the Riches of God’s Covenant of Grace</cite>, (1665; New York: American Tract Society, 1838), pp 39-40.</span></figcaption>

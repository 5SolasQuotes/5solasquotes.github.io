<main class="wrap"><figure class="quote" id="q-ebe86ae8b9" data-kw="">
<blockquote><p>That making of pictures of creatures, which are visible or may be comprehended, or historical fancies (to speak so) such as the senses and elements use to be holden forth by (which are rather hieroglyphics than real pictures) these I say, are not simply unlawful, but are so when they are abused (so Solomon made images of lions for his use, and thus the gift of engraving and painting as well as others which God has given to men, may be made use of, when (as has been said) it is not abused)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, … (London, 1675), 1st Commandment, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 100</span></figcaption>

</figure><figure class="quote" id="q-f156f200bc" data-kw="">
<blockquote><p>I think all will-worship is not idolatry: Our Lord, who accused the Pharisees of will-worship, did not accuse them of idolatry… his accusing ministers of idolatry, for using a Service-book in the main right in respect of the worship, and a gesture [kneeling in receiving the Supper] avowed to be only to the true God, in a Church, holding in the main, the right Faith, under a prince that professes the same Faith and worship, and to be a defender of it. As for such relics of pagan customs, or Popish, as yet remain, though it were to be wished they were quite left [off], since they are not used in any honor to the pagan idols, but the original and reason of them at first [such as honor and decency], being almost if not quite forgotten by those that use them, and are become but as civil customs that have no state in [or condition of being] religious worship, experience shows that they are more easily reformed by neglect than by earnest declamations against them. Nor do I think the course this author takes, of seeking reformation by invectives and separations, likely to promote it, but to exasperate rulers and make opposites more violent in their way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667) | Sect. 16. The Crimination of the Ministers, as Idolaters, is not excusable, Ch. 7; pp. 263-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-1adee36587" data-kw="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, p. 197</span></figcaption>

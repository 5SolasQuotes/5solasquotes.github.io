<blockquote><p>Three hundred and eighteen bishops; yet did, for concord’s sake, return and join with these who did condemn them, and by them were, without all loss or diminution of their honor, received into fellowship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d28a27931b" data-kw="">
<blockquote><p>Robert Hamilton sent out for me to sup with him. When I came, there was none with him but Mr. Douglas, and Gredden came in afterward. He was extraordinary kind to me; he inquired many things at me, but the drift of all was to see if he could have gotten me brought over. He told me how unanimous they were [in the army camp] before the ministers came to them, and that they would do no good until they were removed, and that they [Hamilton’s crew] were for not owning of the king, who had deprived us of the gospel and was seeking our destruction both of soul and body. I gave him no answer at all, but heard all, and afterward returned to my men, who were lying in the close, where were Mr. [John] Welsh and the rest of the brethren for penning of the declaration. I went to him and told him all that had passed, and I desired him to put forth a declaration that would give satisfaction to the multitude; for if we meddled with the king or with the indulgence, it would hinder many [persons] to come [to the covenanter army] who would be as willing as we [to protest, supplicate and defensively fight] and were waiting till they saw it, and would make friends to become enemies; and no fear what Robert Hamilton and his party could do: that if he was clear therein as in the sight of God, I should stand by him as long as my life was in me, and so would most part of the army; and if he yielded to them, I would leave them all and go home. He told me my advice was very refreshing to them at that nick of time. With that they were resolved to do so— they desired me to come to them tomorrow and I should see what they had done [in writing up such a declaration]; and so I came, and it gave me and the army all satisfaction, except Robert Hamilton and his faction… Also we told them, they were more taken up with other men’s sins than they were with their own, and that it were our duty first to begin with ourselves. They spake likewise of putting off of officers [who were not on Hamilton’s side], and did put off him who was captain to the men who came from the east end of Stirlingshire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., pp. 462-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-06015b364f" data-kw="">
<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-119d2928e9" data-kw="">
<blockquote><p>And though there may be many and just causes for a separation, there can be no cause to justify a schism: For schism is in its nature: A studious separation (or state-separate) against Christian charity, upon no sufficient cause or grounds.</p></blockquote>

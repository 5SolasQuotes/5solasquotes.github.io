<main class="wrap"><figure class="quote" id="q-4b8e43d32b" data-kw="">
<blockquote><p>These things I have written to you concerning those who try to deceive you.” 1 John 2:26

In his commentary on the above text, John Calvin reminds us that the Christian minister not only has the duty of gathering a flock, but he must also protect the flock from those that would seduce them into heresy:

When we hear that he wrote concerning seducers, we ought always to bear in mind, that it is the duty of a good and diligent pastor not only to gather a flock, but also to drive away wolves for what will it avail to proclaim the pure gospel, if we connive at the impostures of Satan? No one, then, can faithfully teach the Church, except he is diligent in banishing errors whenever he finds them spread by seducers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, trans. and ed. John Owen (1551; 1855) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 199.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-041718e193" data-kw="">
<blockquote><p>It has been held that the example and teaching of the Saviour Himself while on earth, were tantamount to a repeal of the Sabbath law. Did he not walk through the fields with his disciples on the Sabbath day, and work miracles, and in other ways discountenance the Jewish strictness of observance, by doing things which were then deemed violations of the law? Did he not say “The Sabbath was made for man, and not man for the Sabbath?”

This is a point in regard to which there has been much misconception. It has been said that if still bound by the Sabbath, law, we must be bound also rigidly to adhere to the Pharisaic mode of observance—to keep it with all the minute and punctilious strictness by which they were distinguished; and yet it was from that yoke of bondage that Christ came to set us free. But it is altogether a mistake to confound the ancient Sabbath as revealed by God in His word, and kept with joy and gladness of heart by His faithful people, who could enter into the spirit of His commandments, with the Sabbath as actually observed by the corrupt and formal Scribes and Pharisees of Christ’s day.

It is altogether erroneous to ascribe to the Sabbath of the Fourth Commandment a character of gloom and harshness and severity, utterly uncongenial to the free and joyous spirit of Christianity, and to suppose that we cannot submit to its authority or attempt to obey it without involving ourselves in degrading bondage. Such seems to be the notion entertained by many, and which lies at the root of their ill-disguised or undisguised aversion to this precept of the Decalogue. It is taken for granted that if we consider ourselves bound by the Fourth Commandment, to be consistent, we must be out-and-out Pharisees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath; The Grounds of its Obligation, and its Proper Place in Relation to Christian Life and Duty in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

</figure><figure class="quote" id="q-995c43f615" data-kw="">
<blockquote><p>You will say, Hath Christ need of us? Yea; for He is the Head of the Body; and if He will be a King, He must have his Subjects; for this is the Glory of a King, and serveth much to his Supply. Tho’ CHRIST would be happy without us; yet if He will be the Head of the Church, as every Member receiveth something from him, so it adds something to him, to the Beauty of the Body: Eph. i. 23. The Church is the Fullness of him that filleth All in All. CHRIST were empty were it not for the Church, as the Head without the Body. When you have a Church, then you have a fill Saviour and Advocate; the Church fills up his Mystical Body, his Divine and Human Nature need it not, but the Mystical Body needs it:

Therefore the Apostle calleth the Church CHRIST, because Christ and the Church are one Body, I Cor. xii. 12. CHRIST is pleased to say, He Stands in need of us, yea, of his poorest Servants to receive Grace from him, and that He may pour it out upon them: as a Woman with full Breasts stands in need of a Child to suck them; so CHRIST is so full of Grace and Comfort, that if He have not his weak Ones to suck Grace from him, his Bowels ache within him; therefore He called to the Weak and Thirsty, Matth. xi. 28. Isa. lv.1, 2.</p></blockquote>

<blockquote><p>…consider, that this [second] command [of the 10 Commandments] is… broken… When something is added to his service, which He has not commanded; and this is superstition and will-worship largely so taken. Of this kind are… [6] More holy days than God has instituted… Again, this command is practically broken… When worship or service under the gospel… is without a divine warrant tied to such a time only; as Christmas (commonly called Yule), Easter, Pasch [Passover], etc. which is an observing of times that God has not appointed. [Gal. 4:9-11]</p></blockquote>

<blockquote><p>Early in the Reformation the liturgy of Strasbourg [Germany] eliminated the offertory. No collection was taken in the service of worship itself. Nevertheless a chest was put in each of the churches so that on leaving the church worshippers could deposit their alms. The collection of alms as people left worship became characteristic of Reformed churches. We hear of this being the practice of the Reformed Church of Augsburg [Germany]. In Basel [Switzerland], after the minister had given the Benediction, he was to remind the congregation to contribute to the care of the poor, and as the people left the service they put their alms in one of the alms chests which stood near the door.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hughes-oliphant-old.html">Hughes Oliphant Old</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship in Guides to the Reformed Tradition</cite>, (John Knox Press, 1984), p. 153</span></figcaption>

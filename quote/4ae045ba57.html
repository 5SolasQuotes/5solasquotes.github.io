<main class="wrap"><figure class="quote" id="q-4ae045ba57" data-kw="chosen that we might be holy">
<blockquote><p>Not, then, because we were to be so, but that we might be so. Assuredly it is certain, —assuredly it is manifest. Certainly we were to be such for the reason that He has chosen us, predestinating us to be such by His grace. Therefore &quot;He blessed us with spiritual blessing in the heavens in Christ Jesus, even as He chose us in Him before the foundation of the world, that we should be holy and immaculate in His sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Predestination of the Saints</cite>, ch. 36</span></figcaption>

</figure><figure class="quote" id="q-0d00db3376" data-kw="persons not class Arminian">

<blockquote><p>It is absurd for the Creator to depend upon the creature, God upon man and the will of God (the first cause of all things) upon the things themselves. But this must be the case if the decrees of God are suspended on any condition in man.</p></blockquote>

</figure><figure class="quote" id="q-0e430d2cf9" data-kw="conditional thing not decree">
<blockquote><p>It is one thing for the thing decreed to be conditional; another for the decree itself. The former we grant, but not the latter. There can be granted an antecedent cause or condition of the thing willed, but not immediately of the volition itself. Thus God wills salvation to have the annexed condition of faith and repentance in the execution, but faith and repentance are not the condition or cause of the act of willing in God, nor of the decree to save in the intention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.9</span></figcaption>

<main class="wrap"><figure class="quote" id="q-6091e6f612" data-kw="">
<blockquote><p>In disputes upon moral or scientific points, ever let your aim be to come at truth, not to conquer your opponent. So you never shall be at a loss in losing the argument, and gaining a new discovery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-martine.html">Arthur Martine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Martine’s Hand-book of Etiquette, and Guide to True Politeness</cite>, (New York: Dick and Fitzgerald, 1866; repr. Kindle Locations 456—58).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dcd0422f7c" data-kw="">
<blockquote><p>I may say as Augustine did, though a good conscience be sufficient for myself, yet a good name is necessary for others; a good name is as precious ointment, yet there will not be wanting many flying reports to corrupt it; many are the obloquies and reproaches which by the sons of slander are cast upon me, they would fain have my name to be buried and rot above ground, before my friends can bury my body under it, yet herein is my comfort: there will be a resurrection of names as well as of bodies at the Last Day; I am assured that God will not only wipe off all tears from mine eyes, but all reproaches from my name also; I am, as says the apostle, counted a deceiver, yet true; as an apostate, yet firm to my first principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Necessary Vindication of the Principles &amp; Practices of me, Christopher Love, since my trial before, and condemnation by the High Court of Justice</cite>, (London, 1651), p. 1</span></figcaption>

</figure><figure class="quote" id="q-2e809cbdf1" data-kw="">
<blockquote><p>But because there is no hope that most should be judicious, there is no other remedy for such but this of Christ’s prescript which I have here set down: First, happy is he that chooses a judicious faithful guide and learns of him till his own understanding be better illuminated; and that escapes the conduct of ignorant, erroneous, self-seeking, proud, dividing teachers. Secondly, continue in the communion of the generality of agreeing Christians: The generality of the godly are more unlikely to be forsaken of Christ than a few odd self-conceited singular professors. This is the way of peace to yourselves and to the Church of Christ.</p></blockquote>

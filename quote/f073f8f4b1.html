<main class="wrap"><figure class="quote" id="q-f073f8f4b1" data-kw="">
<blockquote><p>Swearing by appeal to God is a most solemn act of worship: but the sign of taking an oath is left free to convenient choice. Abraham‘s servant did it by putting his hand under his thigh: Was this a common law or institution? Others did it otherwise: We do it by laying our hand on the Book and kissing it. These are neither sinful additions or idolatry. The memorial of God’s works and men’s covenants were kept, sometime by pitching stones, sometime by pillars, sometime by set days (as the Feast of Purim), sometime by laying up the ensigns (as Goliah‘s sword, etc.). And all these lawful and no idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, pp. 13-14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-567618cbef" data-kw="">
<blockquote><p>1. Bowing of the knee, physically or civilly, is indifferent and is not adoration: for we bow to kings, and artificers may bow the knee to drive a nail in a bed, and yet are not adoring; but religious adoration, whether ye will or not, by nature’s impression, is a religious note of religious submission.

2. I consider four acts of the soul that may convey external adoration:

1. One of the mind, a consideration of the excellency of what we adore;

2. A will to submit to this excellency;

3. The judgments diting this to be honest to submit;

4. A purpose or intention habitual or actual of adoring; many of these may be where there is no adoring: and the religious external bowing of the body is essentially adoring, when that bowing is in a state of worship: kneeling before consecrated elements for reverence of either God or the elements, must be adoration, though we should wash it with foul water and say that there is no intention to tender God’s glory to these elements.

3. Let it be considered what is said by the Jesuit Joannes de Lugo, the Pope’s professor at Rome, which I propound with some change:

1. There is a purpose of external adoring, with an inward submission of the heart; whether this be an habitual or actual intention, it is sure it is an adoration when it comes forth in a gesture of adoring.

2. A will to bow the body in scorn and derision, as the soldiers bowed the knee before Jesus; and this being not in a state of worshipping, but in a state and case of disgracing, is not religious bowing or adoration: This is not a natural expression of inward submission, but rather of disgrace.

3. There is a willed or voluntary religious bowing for fear, for gain, or for glory; yet without any internal estimation of the excellency of the thing adored. This Suarez denies to be worshipping, it being only a feigning of worship, not a worshipping.

4. If religious kneeling require that we intend to worship everything before which, as an object, we do religiously kneel, then religious kneeling should not signify internal submission of the heart by nature’s impression or divine institution, but by the voluntary and the free institution of him that kneels: But this latter is absurd, for if kneeling should signify what it does signify by our free and voluntary appointment, then we might:

1. Put upon natural gestures what signification we pleased, and were not to stand to the signification which God and nature have put upon kneeling.

2. So it were in man’s power to impose upon religious kneeling to God civil courtesy, such as a subject expresses to his prince, or a son to his father; and it were free to us to kneel to a stock, and that religiously, and yet put upon kneeling the negative reverence that we give to the Bible; and it were in the three children’s will to kneel to Nebuchadnezzar’s image, and impose this signification on the gesture, that they were kneeling to God only, all which are manifestly false: so Field says kneeling has institution from the instinct of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jus Divinum, or The Divine Right of Church Government (London, 1646)</cite>, The Divine Right of Church Government, (London, 1646), ch. 1, question 5, section 1, pp. 145-47</span></figcaption>

</figure><figure class="quote" id="q-60e895d05e" data-kw="">
<blockquote><p>Paybody [a Formalist] thinks kneeling in the act of receiving the communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it; But I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with fear and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>

</figure><figure class="quote" id="q-7003ce0543" data-kw="">
<blockquote><p>One can observe a variety of physical bearing in the prayers of the saints. Moses fell upon his face (Deuteronomy 9:18); David was stretched upon the ground and clothed in sackcloth when he prayed for his infant son (2 Samuel 12:16). Job was seated in ashes and dust (Job 42:6); the Israelites were standing (Nehemiah 9:5); Ezra and Paul were kneeling down (Ezra 9:5 and Acts 20:36). Solomon prayed on bended knees and with hands outstretched (2 Chronicles 6:13); Christ with eyes lifted up towards heaven (John 17:1), while the tex-collector prayed with his eyes cast down to the earth (Luke 18:13). And while men pray with their heads uncovered, women do so with covered head, according to the apostle’s instruction (1 Corinthians 11:4).† † The annotation on the verse in the Dutch Statenvertaling, of which Walaeus possibly was the author, states that the uncovering of the head at that time was a sign of power and sovereignty, whereas today those who are in authority shall keep their heads covered and those who are subject to them shall uncover their heads: ‘But in this matter one must always regard the use in different times and countries and what is correct and build up… A comparison of all these things with each other makes it clear that a certain amount of freedom was given for various gestures, but that at the same time we should adopt the kind of postures that are best suited to every nation’s own customs and that promote rather than hinder the attentiveness of our soul. We should avoid every form of vanity in those postures, but also carelessness and pride; and the gestures should convey, without pretense and in a most suitable manner, the inner disposition and ardent longing of those who are praying. Yet the saints most frequently employed the bending of the knees,‡ and so that gesture was sometimes used in the absolute sense for the prayer itself, as one can see from Romans 11:4 and 14:11, and likewise in Ephesians 3:14. And in the same vein the apsotle links the stretching forth of lifting up of hands to the injunction that they should prayer everywhere (1 Timothy 2:8). ‡ In 1610 the consistory of Middelburg–where Walaeus served as a pastor from 1605 to 1619–admonished the people to humble themselves bodily during the public prayers by kneeling and folding their hands… According to Van Deursen that was rather common at the time…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synopsis of True Theology</cite>, (1625; Brill, 2016), vol. 2, Disputation 36, ‘On the Religious Practice of Invocation’, pp. 431, 433</span></figcaption>

<div class="actions"><button class="copy" data-copy="“One can observe a variety of physical bearing in the prayers of the saints. Moses fell upon his face (Deuteronomy 9:18); David was stretched upon the ground and clothed in sackcloth when he prayed for his infant son (2 Samuel 12:16). Job was seated in ashes and dust (Job 42:6); the Israelites were standing (Nehemiah 9:5); Ezra and Paul were kneeling down (Ezra 9:5 and Acts 20:36). Solomon prayed on bended knees and with hands outstretched (2 Chronicles 6:13); Christ with eyes lifted up towards heaven (John 17:1), while the tex-collector prayed with his eyes cast down to the earth (Luke 18:13). And while men pray with their heads uncovered, women do so with covered head, according to the apostle’s instruction (1 Corinthians 11:4).† † The annotation on the verse in the Dutch Statenvertaling, of which Walaeus possibly was the author, states that the uncovering of the head at that time was a sign of power and sovereignty, whereas today those who are in authority shall keep their heads covered and those who are subject to them shall uncover their heads: ‘But in this matter one must always regard the use in different times and countries and what is correct and build up… A comparison of all these things with each other makes it clear that a certain amount of freedom was given for various gestures, but that at the same time we should adopt the kind of postures that are best suited to every nation’s own customs and that promote rather than hinder the attentiveness of our soul. We should avoid every form of vanity in those postures, but also carelessness and pride; and the gestures should convey, without pretense and in a most suitable manner, the inner disposition and ardent longing of those who are praying. Yet the saints most frequently employed the bending of the knees,‡ and so that gesture was sometimes used in the absolute sense for the prayer itself, as one can see from Romans 11:4 and 14:11, and likewise in Ephesians 3:14. And in the same vein the apsotle links the stretching forth of lifting up of hands to the injunction that they should prayer everywhere (1 Timothy 2:8). ‡ In 1610 the consistory of Middelburg–where Walaeus served as a pastor from 1605 to 1619–admonished the people to humble themselves bodily during the public prayers by kneeling and folding their hands… According to Van Deursen that was rather common at the time…”

<blockquote><p>Fourthly a confusion of gestures lawful, and unlawful is brought into the Lord’s table, some sitting like guests at a feast, as Christ, and his apostles sat, others like supplicants kneeling, and adoring upon their knees. This confusion is not like that variety of gesture in time of prayer, when some sit, some stand, some kneel. For all the three gestures are there indifferent. But not so here; this confusion of gestures at the Lord’s table now is permitted only for a snare to bring thy feet within the grin. For when all are brought in, then will the formalists cry out, ‘Confusion of gestures is intolerable, uniformity and conformity is necessary,’ as Doctor Sparke does in his persuasion to uniformity.</p></blockquote>

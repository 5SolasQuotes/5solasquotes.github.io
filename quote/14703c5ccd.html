<main class="wrap"><figure class="quote" id="q-14703c5ccd" data-kw="">
<blockquote><p>It is no accident, therefore, that the Reformers presented the Christian life as a life of continuous dissatisfaction with self and of continuous looking afresh to Christ as the ground of all our hope. The effort of [Albrecht] Ritschl to present the Christian life rather as a life of complete satisfaction with self tends not only altogether to undermine the entire evangelical system, but to strike a direct blow at that peace and joy of the Christian which it is his professed object to secure.

For the Christian’s peace and joy are not and cannot be grounded in himself, but in Christ alone. He rejoices in the sufficiency of Christ’s saving work for him; his exultation is in a salvation made his despite his unworthiness of it. This joy obtains its peculiarity precisely from the coexistence of dissatisfaction with self and satisfaction with Christ. The dissatisfaction with self does not mar it; it enhances it rather — because the more dissatisfaction we feel with ourselves the more the greatness of Christ’s salvation is manifest to us, and the more our delight in it waxes.

Transfer the ground of our satisfaction from Christ to ourselves, and all satisfaction becomes at once impossible — except for the shallow souls who can find satisfaction in their own hearts and in the works which proceed from them. We have returned to medieval work-salvation: the very essence of Luther’s revolt turned on his inability to find satisfaction in self. We are not preaching, and Luther did not preach, a lugubrious Christianity, which is always and only preoccupied with shortcomings and failures. Of course the Christian delights in his salvation. Of course he has no impulse to depreciate what he has already received.

Of course his joy is unbounded, and his peace supreme. But this only because — and only on the condition that he understands that — he has not yet “attained”; that what he has received is but the earnest of what is to come; that what he has already done or is now doing is not the ground, and what he already is is not the extent, of his hope. It belongs to the very essence of Christianity that we have not “attained”; and that is the same as saying that sanctification is in progress and there is more to come. The Christian who has stopped growing is dead; or to put it better, the Christian does not stop growing because he is not dead Luther rightly says the Christian is not made but is in the making.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Albrecht Ritschl and his Doctrine of Christian Perfection. Article II: Ritschl the Perfectionist in Princeton Theological Review</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e31ad5f0b9" data-kw="">

<blockquote><p>Seeing that by one man, sin entered into the world, and death by sin, and all men, without exception, are born guilty of the curse; it is certain, that no man can be freed from the curse, but by the mere grace and favour of God: This grace he hath revealed to us in Christ, without whom there is no salvation:

</figure><figure class="quote" id="q-9d0147f246" data-kw="">
<blockquote><p>Without holiness no man shall see the Lord.” God’s priest is one who sanctifies all for whom he acts; he is exalted at the right hand of the Father to give repentance as well as remission of sins. These two things cannot be separated in his glorious ministrations. That they cannot be is a matter of thankfulness and joy to all who desire to be saved from sin, and not merely from its penal doom.

But it is very different with those who dread the tribunal of God, and yet are in love with sin. They admire a priesthood which shall not by the life of its members remind them of the inexorable demands of holiness, which shall usurp the kingly as well as the priestly office of God’s king and priest, and claim the prerogative of dispensing with the precept of the law as well as that of remitting its penalty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Two Professions in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>

<blockquote><p>Secondly I answer that we do acknowledge with glad minds that Christ died for all (the scripture averring so much): but we utterly deny that He died for all and everyone alike in respect of God, or, as well for the damned as elect, and that effectually on God’s part. … Again, if all and every one be effectually redeemed, all and every one are reconciled unto God, because that the forgiveness of sins and the satisfaction for the same are inseparably joined together. Yea and Paul places redemption in the remission of sins where he says: ‘By whom we have redemption through his blood, even the forgiveness of sins.’ (Eph. 1:7 &amp; Col. 1:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606), 4th Crimination, pp. 82-83</span></figcaption>

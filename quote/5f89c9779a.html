<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or a Vindication of our Lawful Submission to the Present Government… (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse.</cite>, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b92d4c2781" data-kw="">
<blockquote><p>XXVI. …Yet the case may be, and often has been (and whither or no it be ours now [referring to Scotland in 1681], is not mine to determine) that a people may and ought to submit themselves to the government even of such a magistrate who either has injuriously usurped that office, or has so maleversed in the exercise thereof (by violating the main and most of the conditions upon which he was admitted to it) that his government is degenerat[ed] into a manifest tyranny and irreligion, and so has (de jure) fore-faulted his right to rule as a magistrate: I say the case of a people may be so circumstantiate [bound by circumstances], that they ought to subject themselves even to such a tyrant till the Lord clearly point forth to them a way, either from his written Word, or some extraordinary impulse and influence upon their spirits, or from indubitable grounds and persuasives of sound moral principles, or such like, whereby they may emerge from under that yoke. Hereby I do not yield, nor assert, that it is lawful to give obedience to any unlawful commands, or that it is no ways lawful for a people to shake off the yoke of an unlawful and tyrannical government: but only that there may be some cases wherein it is lawful for a people to yield subjection to a lawless tyrant, and wherein it may be unlawful for them to perpetrate or attempt their own liberation by external force (which abstractly from those circumstances might be both lawful, laudable and a necessary duty), viz. when the thing attempted is either altogether impracticable, the means or manner of effectuating it dubious or unwarrantable, the timing of it inexpedient and unseasonable, or the necessary concomitants or consequents of the cure more hurtful or dangerous than the disease; or the like: Neither do I affirm that under a tyrannical government it is always or absolutely lawful for the people to give passive obedience (if such a form of phrase may be admitted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded (1681)</cite>, pp. 47-48</span></figcaption>

<blockquote><p>But he that will join in no good that is mixed by men with faultiness and evil must separate from all the world, and all from him: But how will he separate from himself?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, p. 14</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But he that will join in no good that is mixed by men with faultiness and evil must separate from all the world, and all from him: But how will he separate from himself?”

— Richard Baxter, Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024), p. 14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+he+that+will+join+in+no+good+that+is+mixed+by+men+with+faultiness+and+evil+must+separate+from+all+the+world%2C+and+all+from+him%3A+But+how+will+he+separate+from+himself%3F%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter+on+Worship+%26+Catholicity+against+Separatism+%26+John+Owen+%281684%3B+RBO%2C+2024%29%2C+p.+14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F00ee579bd8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/00ee579bd8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cooperation-with-evil/#:~:text=But%20he%20that%20will%20join%20in,how%20will%20he%20separate%20from%20himself%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-49c8841963" data-kw="">
<blockquote><p>And hereupon the question is wont to be demanded: Whether an evil, that is, a tyrannical magistrate be of God or no? To this I answer, that God is the author of good and not of evil. For God by nature is good, and all his purposes are good, being directed to the health and preservation, not to the destruction, of us men. Therefore the good and healthful ordaining of the magistrate, without all doubt, is of God Himself, who is the author of all goodness. But here it is requisite, that we make a difference between the office which is the good ordinance of God, and the evil person that does not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that comes of other causes, and the fault thereof is in the men and persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupts the ways of God, and by his own fault and naughtiness transgresses God’s ordinance, so far, that he does worthily deserve the name of devilish power, and not divine authority;-(we have an example hereof in the magistrate of Jerusalem: for although he were able to refer the beginning of his power by degrees unto Moses, and so unto God Himself who did ordain it; yet, for because he takes the Savior in the garden and binds Him, to his servants it is said, ‘Ye are come out as it were to a thief with swords and staves; when I was daily with you in the temple, ye stretched not forth your hands against me; but this is even your hour, and the power of darkness.’ Lo, here he calls the ordinary magistrate the power of the devil, when he abuses his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office. Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades, 1570’s-1580’s, as quoted in, ed. Edmund Morgan, Puritan Political Ideas, 1558-1794</cite>, pp. 18-19</span></figcaption>

— Heinrich Bullinger, The Decades, 1570’s-1580’s, as quoted in, ed. Edmund Morgan, Puritan Political Ideas, 1558-1794, pp. 18-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+hereupon+the+question+is+wont+to+be+demanded%3A+Whether+an+evil%2C+that+is%2C+a+tyrannical+magistrate+be+of+God+or+no%3F+To+this+I+answer%2C+that+God+is+the+author+of+good+and+not+of+evil.+For+God+by+nature+is+good%2C+and+all+his+purposes+are+good%2C+being+directed+to+the+health+and+preservation%2C+not+to+the+destruction%2C+of+us+men.+Therefore+the+good+and+healthful+ordaining+of+the+magistrate%2C+without+all+doubt%2C+is+of+God+Himself%2C+who+is+the+author+of+all+goodness.+But+here+it+is+requisite%2C+that+we+make+a+difference+between+the+office+which+is+the+good+ordinance+of+God%2C+and+the+evil+person+that+does+not+rightly+execute+that+good+office.+If+therefore+in+the+magistrate+evil+be+found%2C+and+not+the+good+for+which+he+was+ordained%2C+that+comes+of+other+causes%2C+and+the+fault+thereof+is+in+the+men+and+persons%2C+which+neglect+God+and+corrupt+the+ordinance+of+God%2C+and+not+in+God%2C+nor+in+his+ordinance%3A+for+either+the+evil+prince%2C+seduced+by+the+devil%2C+corrupts+the+ways+of+God%2C+and+by+his+own+fault+and+naughtiness+transgresses+God%E2%80%99s+ordinance%2C+so+far%2C+that+he+does+worthily+deserve+the+name+of+devilish+power%2C+and+not+divine+authority%3B-%28we+have+an+example+hereof+in+the+magistrate+of+Jerusalem%3A+for+although+he+were+able+to+refer+the+beginning+of+his+power+by+degrees+unto+Moses%2C+and+so+unto+God+Himself+who+did+ordain+it%3B+yet%2C+for+because+he+takes+the+Savior+in+the+garden+and+binds+Him%2C+to+his+servants+it+is+said%2C+%E2%80%98Ye+are+come+out+as+it+were+to+a+thief+with+swords+and+staves%3B+when+I+was+daily+with+you+in+the+temple%2C+ye+stretched+not+forth+your+hands+against+me%3B+but+this+is+even+your+hour%2C+and+the+power+of+darkness.%E2%80%99+Lo%2C+here+he+calls+the+ordinary+magistrate+the+power+of+the+devil%2C+when+he+abuses+his+power.+What+could+be+more+evidently+spoken%3F+But+here+ye+must+mark%2C+that+the+reproach+was+in+the+person%2C+and+not+in+the+office.+Likewise+also+the+Roman+empire+was+ordained+by+God%2C+as+by+the+visions+of+Daniel+it+is+clearly+evident%3A+and+yet%2C+when+Nero%2C+not+without+God%E2%80%99s+ordinance%2C+bare+the+sway+in+the+empire%2C+whatsoever+he+did+as+king+and+emperor%2C+contrary+to+the+office+of+a+good+king%2C+that+did+he+not+of+God%2C+but+of+the+devil%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Decades%2C+1570%E2%80%99s-1580%E2%80%99s%2C+as+quoted+in%2C+ed.+Edmund+Morgan%2C+Puritan+Political+Ideas%2C+1558-1794%2C+pp.+18-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F49c8841963.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49c8841963.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separation-from-impure-civil-governments/#:~:text=And%20hereupon%20the%20question%20is%20wont,of%20God%2C%20but%20of%20the%20devil%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3… Yet I intend not to handle the case of invasion, to show in what cases only an invasion of another nation in a hostile manner is lawful: I am from all my books, that I cannot consult with casuists in that point… Had God given me life, I intended a large Treatise concerning the Usurpation of the Government of England, and the unlawfulness of the invasion of Scotland [by Cromwell]; but my collections being lost and taken away, they must die with me; I hope more able hands will write against the invasion, though they cannot fight against the invaders.</p></blockquote>

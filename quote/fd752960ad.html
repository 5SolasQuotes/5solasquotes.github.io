<main class="wrap"><figure class="quote" id="q-fd752960ad" data-kw="">
<blockquote><p>It [the Sabbath] has ever been dear to Christians. Many of them have owed to it their conversion. To all of them it is the occasion of spiritual improvement. Tempted to excessive labour on other days, they feel that, but for this command to restrict their thoughts on one day in seven to the exercises of religion, they would soon be almost wholly absorbed in worldly occupations. Now, on the contrary, their Sabbath occupations restore to religion its ascendency over their minds, and lend them new spiritual strength for the engagements of the week.

On this day they feel the comfort of a spiritual rest, in which they may examine their religious progress, reflect upon their duty, meditate on the great truths of revelation, and prepare for eternity. If I am not greatly mistaken, Christians in general feel that they owe much of their growth in godliness, and even of their consistency, to the Sabbath. God can do all things, but he acts by means in his government of the world; and among means, the Sabbath ranks with those which are the most necessary to our welfare.

It is likewise important to consider what an amount of benevolent Christian effort has been created by the institution of the Sabbath. If all those who have to secure their livelihood by bodily or mental exertion, were obliged to labour through seven days of the week as they now labour through six of them, how few would have time or strength to visit the poor, to teach the young, or to speak of Christ to the ungodly!

But through the ordinance of the Sabbath, hundreds of thousands of persons in this country, who devote six days to hard labour, bodily or mental, give a part of their Sabbath to the religious instruction of the young and ignorant. Without the Sabbath, nearly all the inappreciable good which is now done by Sabbath schools, and much of that which attends the visiting of the sick and the distressed in cities, would vanish from the land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/baptist-w-noel.html">Baptist W. Noel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface in The Christian Sabbath, Considered in its Various Aspects by Ministers of Different Denominations. With Preface by the Hon. and Rev. Baptist W. Noel</cite></span></figcaption>

<blockquote><p>That they [Romanists] cry up a private, unproved, unwritten tradition of their own, as of equal authority with this safe and full rule, which is contained in this written Word of God. Their crime and fault may be considered, partly with respect to the object and matter; that these traditions are not indifferent customs, but essential points necessary to faith and christian practice. And so though a Christian be never so through and sound in his obedience to the Word of God, and true to the baptismal covenant, yet if he submits not to these unwritten traditions, he wants [lacks] some point necessary to faith and practice, and so to life eternal: which is contrary to Mark 16:16. “He that believes and is baptized, shall be saved; and he that believes not, shall be damned.” And John 17:3.” This is life eternal, to know you the only true God, and Jesus Christ whom you have sent.” Partly as to the subject, as they make their own faction to be the only keepers of these things; and that nothing is to be owned as apostolic tradition, but what is delivered as such by their authority; which is to leave the church to the tyranny and usurpation of a corrupt faction; to declare for apostolic tradition any thing which serves their end and interest, and for which no true historical evidence is produced. Now the unjust and fraudulent practices which they have used, to promote this usurpation over the churches of Christ, render them false men, most unfit to be trusted in this kind. Partly with respect to the manner, they will have these things to be received, pari reverentia et pietatis affectu, with the same reverence and pious affection with which we receive the Holy Scriptures; and so man’s post is set by God’s, and unproved traditions equaled with doctrines of faith. Their opinion is bad enough, but their practice is worse. For there they show they value these things more than the Scriptures. As superstition always abounds in its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XVIII Sermons on the Second Chapter of the 2nd Epistle to the Thessalonians</cite>, … (London, 1679), 340–42 [Spelling and punctuation modernized].</span></figcaption>

<blockquote><p>I respond: It was a common rite, in species and form, from custom or practice then and there received; it was accustomed to be used as a sign of love, friendship, familiarity, even of subjection, etc. On this rite: the Philology &amp; Antiquary of [John de] Pineda [1558–1637, a Jesuit] on Job 31:27 has informed. Out of theologians other than Pineda: Aretius, pt. 3, [Jean de] Lorinus [1559-1634, a Jesuit] and [Andrew] Rivet on Ps. 2; and Lorinus in the same has cited Joseph Stephanus in the Tractate on Kissing the Feet of the Pontiff.”, p. 466 Gyongyosi, Paul – Kisses of Love &amp; Hate, on Song 1:2 &amp; 6:3 &amp; Prov. 27:6; a Dissertation on the Holy Kiss (Rom. 16:17) &amp; its Opposite, the Kiss of Jude (Lk. 22:48) &amp; of the Mysteries of them Illustrated by the Sacred Scriptures, by Christ the Lord of Love, Grace &amp; Eternal Wrath… (Frankfurt, 1738) 18 pp. Gyongyosi (1668-1743) was a German reformed professor of theology at Frankfurt, Germany. . Lutheran Willemer, Johann Helvicus – Out of the Words of Ps. 2:12, ‘Kiss the Son’, Against Some of the Borne Distortions of the Jews (Wittenburg, 1704) 35 pp. Mayer, Johann Friedrich – A Tract on Kissing the Feet of the Roman Pointiff 2nd ed. (Leipzig, 1714) Mayer (1650-1712) was a German, Lutheran professor of theology at Wittenberg, Kiel and Greifswald. . . On Foot Washing &amp; Shaking the Dust Off of One’s Feet Bible Verses Dust of the Feet Isa. 49:23 “And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow down to thee with their face toward the earth, and lick up the dust of thy feet;</p></blockquote>

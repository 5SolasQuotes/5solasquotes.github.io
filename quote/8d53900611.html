<main class="wrap"><figure class="quote" id="q-8d53900611" data-kw="">
<blockquote><p>It is also a great comfort to have the faith of this Providence constantly impressed upon the mind, so as to have recourse to it in the midst of all confusions, whether public or private, and all calamities from without or from within; to be able to say, the great King, who is also my father, is the supreme ruler of all things, and with him all my interests are secure; to stand firm, with Moses, when no relief appears, and to look for the salvation of God from on high, and, finally, in every distress, when all hope of human assistance is swallowed up in despair, to have the remarkable saying of the Father of the faithful stamped upon the mind, and to silence all fears with these comfortable words, “God will provide.”

In a word, there is nothing that can so effectually conform the heart of man, and his inmost thoughts, and consequently the whole tenor of his life, to the most perfect rule of religion and piety, than a firm belief, and frequent meditation on this divine Providence, that superintends and governs the world. He, who is firmly persuaded, that an exalted God of infinite wisdom and purity is constantly present with him, and sees all that he thinks or acts, will, to be sure, have no occasion to over-awe his mind with the imaginary presence of a Lælius or a Cato.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts</cite>, (London: Plato’s Head, 1763), Lect. VIII, pp 86-87.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47c06a0653" data-kw="">
<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 139</span></figcaption>

</figure><figure class="quote" id="q-061a365aa6" data-kw="upholds continual">
<blockquote><p>God upholds the world, and causes all those laws which he hath impressed upon every creature, to be put in execution: not as a man that makes a watch, and winds it up, and then suffers it to go of itself; but there is a continual concurrence of God to this goodly frame. For they do not only live, but move in him, or by him; his living and omnipotent power runs through every vein of the creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on Divine Providence</span></figcaption>

</figure><figure class="quote" id="q-e2c0347ac9" data-kw="">
<blockquote><p>I first note that Thomas in this matter taught exactly the same as Scotus with regard to premotion and the determination of the secondary cause by the first, in general. In particular, however, Scotus expressly rejected that physical predetermining quality and a similar influence through something else impressed antecedently in the free will — which many Thomists posited, because Thomas manifestly neither posited nor rejected it, from which they took occasion to introduce it. But Thomas, if my judgment carries any weight, never required it; nor could I find a place in him where he would admit it. And this I have often publicly affirmed in the very presence of Thomists. Therefore I hold that Thomas and Scotus are in agreement on excluding that quality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo’s Judgment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>2. The contret [contract?] of a lecturer that preacheth the word to diverse professors from sundry Churches, if: 1. He have no warrant to administer the seals, or to exercise discipline over them; he seemeth to me some catholick doctor I read not of in scripture, not unlike the Popish and prelatical deacon, who may preach and baptize (as a midwife to them in case of necessity may baptize) but not to administer the other seal. 2. If he be a lawfully called Pastor, I shall say, the meeting is a true visible Church of visible members met from sundry churches, and is not a fixed, but a transient church, and it is no more absurd to say [that] these [auditors] are members of four visible churches, to wit, transient members, than to say they are members of the whole catholic, visible Church, and baptized. Whether Jews or gentiles, all, by one spirit, unto one body, 1 Cor. 12:13., being all one body, having one spirit, one faith, one Lord, one baptism. Eph. 4:4-5, though they belong to diverse particular churches:</p></blockquote>

<blockquote><p>There are too few in the world of peaceable principles: some lay all peace, as is said, on the opinions of their own parties, and some lay it on a multitude of such low opinions and such doubtful things that they might know can never be the matter of universal consent: some think they must not silence anything which they conceive to be a truth for the peace of the Church, or [for] the promoting of greater undoubted truths. Some think they ought to reproach and disgrace all that are not of their mind, and some think they ought to destroy them or cast them out, and think this a part of their faithfulness to the truth of Christ, and that this is but to help him against his enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Catholic, &amp; Catholic Church Described</cite>, … (London: A.M., 1660), p. 183</span></figcaption>

<blockquote><p>2. No man may take this honour to himself, unless he be called of God, and sent to preach his Word in the Name of God, Rom. 10:14-15. But all who have the gifts of preaching the Word are not called and sent of God. For those who are sent of God are sent either by an immediate and extraordinary call, or by a mediate call by the Church: but whereas now an extraordinary mission or sending is ceased in the Church, those are therefore by the ordinary ecclesiastical call separated to the office of preaching, who may lawfully undertake it. 1 Tim. 4:14 &amp; 5:22; 2 Tim. 2:2-3. … We reject therefore the contrary assertion of those [congregationalists] who affirm this to be an ordinance perpetual and ordinary in the Church, that a private Christian endued with gifts, either ordinarily or upon occasion, being thought fit in the judgment of those to whom it belongs, may (by the Word of God) preach publicly in the church-assembly with all authority, though he bear no Church office. But to us it’s certain that even under the Old Testament in the Jewish Church, every one was not admitted to speak publicly in the synagogues, but that it was the ordinary function of those that are called scribes and lawyers (the Levites being also for this cause distributed into many places), whereupon they are said to sit on Moses’s chair. If any were endued with extraordinary gifts of prophecy, as the prophets in Israel, this was permitted and enjoyned him by the Word of God, publicly to preach in God’s Name. When the prophet Amos was forbidden by the Chief Priest to prophecy at Bethel, he does not challenge this liberty to the Israelites, that they might publicly preach the Word of God in God’s Name in the holy assemblies, but pleads his extraordinary mission, whereby he was sent of God to preach this word, Amos 7:14-15. And so perhaps was it permitted to the sons of the prophets, who were fitted, educated, and set apart for the ecclesiastical ministry, 1 Sam. 19:20. In the synagogues, after the reading of Moses and the prophets was ended, there were exhortations added; which exhortations if at any time occasion required, and it so seemed good to the rulers of the synagogue, in corrupt times especially, it was indeed permitted to some, out of order, to teach and exhort; but they were always such as had testimony of their gifts, and of whom there was a general opinion of their mission extraordinary or ordinary, by reason of the doctrine they preached, and the works they did. Thus at Nazareth Christ was permitted in the synagogue to read and explain the writings of the prophets, Lk. 4:16, as one who by reason of his majesty and miracles did everywhere obtain audience, as reverend Beza here notes; by which right he taught both in the Temple and everywhere: wherefore also the ordinary doctors demanded of him by what authority he did it, Mt. 21:23. So we find that Paul and Barnabas were allowed, Acts 13:15, publicly to speak and exhort in the synagogue at Antioch; as being such whose fame was already known to those of Antioch: for they had, before this time, for a whole year preached the Word of God to many there, and brought many to the faith of Christ; and Agabus who was joined with them, did by an extraordinary gift of prophesy foretell to those of Antioch the famine approaching; where were also many other prophets and doctors, who preached the Word of God both to Jews and Greeks: See Acts 11:19-21, 25-28, and 13:1-2, etc. But in the practice of the New Testament, none but prophets by gift and office, either extraordinary or ordinary, were permitted publicly in the assembly of believers to preach the Word of God in Christ’s Name, as appears, 1 Cor. 14:29-31, etc. The apostle speaks not of any in the congregation promiscuously, but of prophets lawfully called to instruct the Church of God (says Beza on this place) and therefore they are not to be hearkened to [namely the congregationalists], who from hence gather that any of the assembly may speak in the Church, and who reprehend the custom of having only a sermon preached by one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, p. 79, 80-83</span></figcaption>

actice+of+the+New+Testament%2C+none+but+prophets+by+gift+and+office%2C+either+extraordinary+or+ordinary%2C+were+permitted+publicly+in+the+assembly+of+believers+to+preach+the+Word+of+God+in+Christ%E2%80%99s+Name%2C+as+appears%2C+1+Cor.+14%3A29-31%2C+etc.+The+apostle+speaks+not+of+any+in+the+congregation+promiscuously%2C+but+of+prophets+lawfully+called+to+instruct+the+Church+of+God+%28says+Beza+on+this+place%29+and+therefore+they+are+not+to+be+hearkened+to+%5Bnamely+the+congregationalists%5D%2C+who+from+hence+gather+that+any+of+the+assembly+may+speak+in+the+Church%2C+and+who+reprehend+the+custom+of+having+only+a+sermon+preached+by+one.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England%2C+Concerning+the+Government+of+the+Church+of+God+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+p.+79%2C+80-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2ebf57220.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2ebf57220.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=2.%20No%20man%20may%20take%20this,only%20a%20sermon%20preached%20by%20one&amp;text=2.%20No%20man%20may%20take%20this%20honour%20to&amp;text=of%20having%20only%20a%20sermon%20preached%20by%20one" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d646d04a74" data-kw="">
<blockquote><p>3. Neither Mr. Rutherford [contra what Hooker said] nor any judicious man can teach that either a gift to write books, or of eminent preaching, praying, exhorting, proceeds out of a power of office; it is a sanctified gift which the Church sees and judges to be in any before they call him to office; and any gift is by order of nature and time before the office, and so proceeds not from the office; and therefore it is not required that every pastor should have a gift of writing books; But if the Lord have given it to any, they exercise it as such [additionally] gifted officers as the prophets and apostles, as such prophets so gifted did write canonic Scriptures; so are pastors, if gifted, to write and preach in their way, and both to write and preach by their office. Nor is it good logic that all in office should write books because some by virtue of their office write books; for a minister gifted with four talents is obliged to gain with these four talents, and that as a minister by virtue of his office; but it is weak logic to infer, therefore, all ministers by virtue of their office are obliged to gain with four talents, for many are obliged by virtue of their office to gain with only two [talents, not including with writing books] to their Lord, and with only one [talent]. 4. It was needless to Mr. Hooker to prove writing of books does not belong to the power of office because a learned man out of office may do it with more authority, for Mr. Rutherford had no such intention [of teaching to the contrary]. For sure, if such a thing agreed to the office-power as the office-power, then all officers, pastors [and] elders were obliged to write books, and yet Mr. Hooker does not very happily prove it, because many learned men, unofficed, may with more authority of truth write books than officed men. It is only some officed men he must mean, or it is not true. [emphasis added below] And then I retort it thus: Many officed men may write books with more authority both of truth and of office (and two are better than one) than some unofficed men less learned [Rutherford affirms this]. Therefore [according to Hooker’s logic, it would seem], some gifted pastors do not as pastors so gifted, and by virtue of their office relating both to the presbyterian Church and their own congregation, edify all the Churches about by writing books. It follows not. [Rutherford is affirming that some gifted pastors do write books with the virtue of their office in relation to the churches, though a calling to write books does not derive simply from their office]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 2, ch. 4, pp. 210-11</span></figcaption>

</figure><figure class="quote" id="q-ce33b11915" data-kw="">
<blockquote><p>Therefore, though it is to be wished and endeavored that all elders may have due qualifications for all these things and though special care is to be taken everywhere to choose the most qualified, yet in particular congregations men may be chosen elders who have not such a measure of all these qualifications, they being otherwise men of a blameless and Christian conversation and having such a measure of knowledge and prudence as is fit for governing that congregation and judging of the things that are handled in the session thereof, which for the most part are matters of scandal and trying and admitting of penitents; but if there be any who are not of a blameless and Christian conversation and have not some measure of these qualifications required by the Word of God in a ruling elder, no congregation ought to choose any such, nor any session or presbytery to admit them to the charge…</p></blockquote>

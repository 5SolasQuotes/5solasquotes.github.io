<main class="wrap"><figure class="quote" id="q-4385f208ce" data-kw="Sufficiency">
<blockquote><p>Scripture is not only one of those means which relate to salvation, but the entire and sole medium, the perfect and complete medium, because it produces a perfect faith. For that faith which brings salvation is perfect; and consequently the medium whereby that faith is produced is also perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 6, ch. 14</span></figcaption>

<blockquote><p>I must turn to the Word of God. In questions of this kind it matters nothing what the world thinks right or wrong. There is only one sure test of truth. What says the Scripture? What is written in the Bible? What is the mind of the Holy Spirit? If we cannot submit our judgments to this infallible umpire, it is useless to pretend that we have any religion at all.</p></blockquote>

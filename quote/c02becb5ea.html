<blockquote><p>It is a very mean apology for them, to tell the world, that the grievance of patronage (that is, the civil law, establishing patronages) has led them to counteract the laws of the only Lord and Lawgiver of Zion. If our author had dealt faithfully with his brethren, and according to the great zeal that he professes, he ought plainly to have told, they ought ‘rather to suffer than sin.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>

</figure><figure class="quote" id="q-208206c415" data-kw="">
<blockquote><p>News of the ordination of Cameron [by Robert M’Ward and John Brown of Wamphray in the Netherlands in late-July or early-August 1679] and [Thomas] Hog was swiftly carried back to Scotland, where it caused a predictable outburst of indignation amon the older nonconforming ministers. John Carstairs, one of the most senior among them, wrote bitterly to M’Ward on 20 August: ‘I somewhat wonder you have there ordained those two young men–not so very acceptable, to say no more, to the Church of Scotland. I fear it offends many; nor do I see, especially at this time, how it can be so well justified. Do you think that there is no ministerial church amongst the nonconforming ministers in Scotland to ordain whom they think fit to be ordained? And is it suitable to that Christian correspondence and deference that the churches of Christ ought to have with and to one another that a few ministers of the church in Holland should ordain ministers for the Church of Scotland without their desire, consent , allowance or knowledge?’ Carstairs’ view was certainly typical of many of the older and more influential of the ministers, and his letter clearly reflected their resentment at what they saw as a usurpation of their ministerial functions by M’Ward and Brown. It also gave an indication of the sort of reception Cameron could expect on his return to Scotland [in late-1679]. A further hint of the welcome that awaited him was given in a letter from John Dickson to M’Ward on 16 July: ‘As for Mr Cameron, the prejudice against him is screwed up so high that no vindication will allay the feverish spirits of some persons who are maddened against him.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron (Durham: Evangelical Press, 1997)</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-823f45241a" data-kw="">
<blockquote><p>18. And if the unsoundness, badness or weakness of the pastors and the faultiness of the worship, order or discipline be not so great as to make communion with the church simply unlawful, yet any free man whose edification is greatly hindered by it, and can elsewhere have far greater helps for his salvation and join with a church which walks more conformably to the Christian rule, may lawfully remove himself to such a ministry and church, when it is not to the greater hurt of others than his own good. Especially such whose ignorance, weakness and deadness makes a lively and convincing ministry more needful to their safety and welfare than it is to others: For it is a sin, caeteris paribus [other things being equal], to prefer the worse before the better, and a sin to neglect the best means for our souls which we can lawfully enjoy: And the soul is more precious than to be hazarded or left in sin and darkness for an unnecessary circumstance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord, containing: I. a Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians… (London: Parkhurst, 1691), pt. 2, Question 2</cite>, pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

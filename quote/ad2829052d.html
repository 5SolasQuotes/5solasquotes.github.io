<main class="wrap"><figure class="quote" id="q-ad2829052d" data-kw="death tree of life">
<blockquote><p>A law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life and from the threatening of death (which by reason of contraries had the implied promise of life).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.7</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b7c17ab77" data-kw="merit">
<blockquote><p>The natural covenant is not so called because it conferred nothing above nature and condition (which man had from creation), but because it depended on the powers of nature and the obedience which according to them he ought to render. Nor, if a proportion is not granted between the prescribed duty and the blessing of heavenly life, does it follow that such a promise cannot have a place. It is gratuitously and falsely supposed that the promises of God are regulated according to the proportion of our merit. On the contrary, they depend upon God’s will and goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.6.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/promise-and-reward.html">Promise and Reward</a> › <a href="../topics/the-covenant-of-works/promise-and-reward/merit-before-the-fall-merit-of-condignity-and-of-congruity.html">Merit before the fall (merit of condignity and of congruity)</a></span><span class="t"><a href="../topics/the-covenant-of-works/promise-and-reward.html">Promise and Reward</a> › <a href="../topics/the-covenant-of-works/promise-and-reward/eternal-life.html">Eternal life</a></span></div>

</figure><figure class="quote" id="q-b72020f7f1" data-kw="eternal life">
<blockquote><p>However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run). The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.6.3-4</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 8.6.3-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C%20the%20received%20opinion%20among%20the%20orthodox%20is%20that%20the%20promise%20given%20to%20Adam%20was%20not%20only%20of%20a%20happy%20life%20to%20be%20continued%20in%20paradise%2C%20but%20of%20a%20heavenly%20and%20eternal%20life%20%28to%20which%20he%20was%20to%20be%20carried%20after%20the%20course%20of%20perfect%20obedience%20and%20perseverance%20had%20been%20run%29.%20The%20law%20of%20works%20had%20the%20promise%20of%20heavenly%20and%20eternal%20life%3B%20therefore%20also%20the%20law%20prescribed%20to%20Adam.%20In%20each%20instance%2C%20it%20is%20the%20same%20law%20as%20to%20substance.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%208.6.3-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb72020f7f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b72020f7f1.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-242b7b10a2" data-kw="natural symbolic law">
<blockquote><p>The duty was partly general, partly special (according to the twofold law given to him: the moral or natural and the symbolic). The general was the knowledge and worship of God, justice towards his neighbor and every kind of holiness; the special was abstinence from the forbidden fruit (in which obedience to the whole law was contained as in a compendium and specimen). The former was founded on the law of nature not written in a book, but engraven and stamped upon the heart of man; the latter upon a symbolic and positive law, added to the natural for the trial of his obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.12</span></figcaption>

</figure><figure class="quote" id="q-86a6f25ed5" data-kw="covenant reward">
<blockquote><p>By his own right, God could indeed have prescribed obedience to man (created by him) without any promise of reward. But in order to temper that supreme dominion with his goodness, he added a covenant consisting in the promise of a reward and the stipulation of obedience. As he wished to assert more strongly his own right over man, so he demonstrated the highest benignity in this—that he (himself in need of nothing) willed to invite to a nearer communion with him the creature already subject to him by right of creation.</p></blockquote>

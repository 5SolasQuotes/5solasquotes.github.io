<blockquote><p>Immutability is God without any alteration in respect of being, will or any accidents, Ps. 102:27-28; Mal. 3:6; Jam. 1:17, ‘With whom is no variableness, nor shadow of turning.’ Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: The liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see Smising, [Tract on the One God] tract 2, disp. 3, quest. 1, num. 23) If He were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest than that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed forever, though the creature had never been. Objection 2: God’s will in his decree and his will in the command are often contrary one unto another; therefore He is not immutable. Answer: No such thing. The decree determines what shall be; the command shows what ought to be. God’s willing the futurition of the betraying of Christ by Judas, and yet willing it to be Judas’s duty not to betray Christ, have not the least appearance of two wills in God. Objection 3: God sometime[s] promises and performs not: threatens and executes not; therefore He may seem not to be immutable. Answer: Such promises and threatnings are to be understood conditionally, not absolutely. See Jer. 18:7, 10. Objection 4: God in Scripture is often said to repent; He that repents is not immutable. Answer: Such speeches, though spoken after the manner of men for the help of our understanding, yet are to be understood as becomes the nature of God. God is therefore said to repent because He does as men do when they repent, that is, He changes his deeds: yet without any change of his will. Nay, those changes of his deeds are the executions of his unchangeable will.</p></blockquote>

<blockquote><p>Still, a critic might object that anything that actualizes another thing must be undergoing change itself in the course of doing so, and thus must have potentialities which need to be actualized. Thus (so the objection might go) the very notion of a purely actual actualizer is incoherent. [1.] But one problem with this objection is that it simply begs the question. The Aristotelian argument for God’s existence claims to prove that no potential could be actualized at all unless there is a first actualizer, which is purely actual and thus devoid of potentiality. So, given that the premises of this argument are true and that the conclusion follows logically from them, it follows that the conclusion is true and therefore coherent. Accordingly, it won’t do simply to insist that the conclusion must be false; one has to show specifically either that one of the premises is false or that the conclusion does not follow. Otherwise, one ought to admit that the argument shows precisely that a purely actual actualizer really is possible (since actual) after all. [2.] Another problem is that the objection seems to be grounded in what logicians call a fallacy of accident. In our experience, when a thing changes another thing, it undergoes change itself; for instance, when your arm moves a stick, that is because your arm is itself moving in the process. Things in our experience thus actualize other things precisely by going from potential to actual themselves. But it doesn’t follow that absolutely anything that actualizes another thing must itself go from potential to actual. That is like reasoning from the premise that every president of the United States has in fact been under seven feet tall to the conclusion that absolutely anyone who could ever become president must be under seven feet tall. That does not follow, because there is no essential connection between being president and being under seven feet tall, but only an accidental or contingent connection. And the connection would remain contingent even if the facts of biology make it extremely unlikely that there will ever be a president taller than seven feet. Similarly, even if the actualizers of our experience are themselves mixtures of actual and potential, it simply doesn’t follow (for all the critic has shown) that there is an essential, as opposed to merely contingent, connection between being an actualizer and being a mixture of actual and potential. [3.] Besides, it is hardly as if the notion of a purely actual actualizer were somehow paradoxical, as (say) the notion of an “immortal mortal” would be. An “immortal mortal” would be something that both dies and does not die, which is self-contradictory. But a purely actual actualizer is something that actualizes other things without itself being actualized, and there is no self-contradiction in that idea. Furthermore, the reason the actualizers of our experience are themselves being actualized even as they actualize other things is precisely because they are limited in the various ways entailed by being mixtures of actual and potential. For example, because an arm which moves a stick is actually at one point in space and only potentially at another, its potential to be at the other point in space has to be actualized by something else if it is to get the stick to that other point in space. But something which is pure actuality, devoid of all potentiality, would have no such limitations, and thus not need to be actualized itself as it is actualizing other things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (San Francisco: Ignatius Press, 2017), end of ch. 1</span></figcaption>

<blockquote><p>24. III. And the existence of this divine essence must be known by us in this gradual threefold conception: 1. In virtute (vel potentia) [in virtue or power], 2. In actu immanente [in an immanent act], 3. In actione transeunte [in a transitive action]. Of the first I shall say no more than what is said before. By the second I mean God’s own most perfect essence as active in itself, without extrinsic effect or object. By the third, I mean not the creature, or the divine action ut recipitur in passo [as it is received in the patient], or the effect, but the divine essence itself in the state of agency ad extra [toward what is outside]; which the schools conclude to be eternal, though the effect is but in time. Yet if any will call this a free and not a necessary state of the divine essence, I contend not.

25. IV. The essential immanent acts of God are three:

1. Sibi vivere [to live to Himself], or to be essential active life in Himself;

2. Se intelligere [to understand Himself], to know Himself;

3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“24. III. And the existence of this divine essence must be known by us in this gradual threefold conception: 1. In virtute (vel potentia) [in virtue or power], 2. In actu immanente [in an immanent act], 3. In actione transeunte [in a transitive action]. Of the first I shall say no more than what is said before. By the second I mean God’s own most perfect essence as active in itself, without extrinsic effect or object. By the third, I mean not the creature, or the divine action ut recipitur in passo [as it is received in the patient], or the effect, but the divine essence itself in the state of agency ad extra [toward what is outside]; which the schools conclude to be eternal, though the effect is but in time. Yet if any will call this a free and not a necessary state of the divine essence, I contend not.

25. IV. The essential immanent acts of God are three:

1. Sibi vivere [to live to Himself], or to be essential active life in Himself;

2. Se intelligere [to understand Himself], to know Himself;

3. Se amare [to love Himself], or to be amor sui [self-love].”

<blockquote><p>In respect of the object and effects, for God does never so many and so great works, but He can do more and greater; although we must hold that God cannot make a creature of infinite perfection simply, or creatures indeed infinite in number, for so they should be gods; for the divine power is so far exercised on the object as the passive power of the object extends itself, but infinite perfection imports a pure act.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0bb30d911a" data-kw="">
<blockquote><p>Sundry religious ordinances are appointed in the New Testament: that there should be every Lord’s Day a collection for the poor: that the man being after a more excellent manner the image of God should pray bare-headed, not being ashamed to show his head, but having a kind of headship over the woman; and the woman should cover her head, when she prays… no Christian Church can consist without some external rites and ceremonies, which if they be not repugnant to the Word of God, are to be observed by us, as these ordinances of religion were by the Jews. …In these indifferent things which in their own nature are neither good, nor evil, we must not contend, breaking the peace and unity of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jones.html">William Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Epistles of Saint Paul to Philemon, &amp; to the Hebrews... (London, 1635), on Heb. 9:1</cite>, pp. 327-28</span></figcaption>

</figure><figure class="quote" id="q-d353662d30" data-kw="">
<blockquote><p>…whereat Paybody [a Formalist] starts and replies that the gestures which the people of God used in circumcision and baptism, the renting of the garment used in humiliation and prayer, Ezra 9:5; 2 Kings 22:19; Jer. 36:24, lifting up the hands, kneeling with the knees, uncovering the head in the sacrament, standing and sitting at the sacrament, were and are significant in worshipping, yet are not forbidden by the 2nd Commandment. Answer: There are three sorts of signs here to be distinguished: 1. Natural signs: so smoke is a sign of fire, and the dawning of the day a sign of the rising of the sun. 2. Customable signs, and so the uncovering of the head, which of old [in the OT, exampled by the priests] was a sign of preeminence, has through custom become a sign of subjection [such as in 1 Cor. 11]. 3. Voluntary signs, which are called signa instituta; these are either sacred or civil. To appoint sacred signs of heavenly mysteries or spiritual graces, is God’s own peculiar, and of this kind are the holy sacraments. Civil signes for civil and moral uses, may be and are commendably appointed by men, both in Church and commonwealth, and thus the tolling of a bell is a sign given for assembling, and has the same signification both in ecclesiastical and secular assemblings. Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For which of you, says our Master [Lk. 17:7], having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat. All these signs have their significations from nature. … Secondly, customable signs have likewise place in divine service, for so a man coming into one of our churches, in time of public worship, if he see the hearers covered, he knows by this customable sign that [the] sermon is begun. Thirdly, civil or moral signs instituted by men, for that common order and decency, which is respect both in civil and sacred actions, have also place in the acts of God’s worship. Thus a basen and a laver set before a pulpit are signs of baptism to be ministered: but common decency teaches us to make the same use of basin and a laver in civility which a minister makes of them in the action of baptizing. All our question [with the Formalists, on the other hand] is about sacred mystical signs. Every sign of this kind, which is not ordained of God, we refer to the imagery forbidden in the 2nd Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’ | ch. 5, ‘5th Argument… taken from the mystical &amp; significant nature of them’</cite>, pp. 85-86</span></figcaption>

n%20the%202nd%20Commandment." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3dcf8eb3d7" data-kw="">
<blockquote><p>We may… try to conceive the landscape, and the parish features generally, as the new incumbent [John Macmillan of Balmaghie] saw them in 1701… The dress of the people was on a par with their homes and fare. A Galloway man wore constantly, even in church, his broad blue bonnet, made in Kilmarnock… Young girls at home wore no head-covering, but snooded their locks with a piece of string or ribbon. At fair or church, they wore white linen mutches [linen caps], slightly plaited above the brow. The farmers’ wives covered their heads with coarse white linen toys [linen or wool headdresses that hang down over the shoulders] when they went a-visiting.¹ ¹ For all the above, I have drawn on Nicholson’s History, II. 332-339.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-m-reid.html">Henry M. Reid</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cameronian Apostle: being Some Account of John Macmillan of Balmaghie (London: Gardner, 1896)</cite>, pp. 50, 52</span></figcaption>

<blockquote><p>Paul, when writing to the Corinthians who were Greeks, gives the preference to that [Greek] custom [of men having an uncovered head in worship]. In doing so, he did not intend to lay down a universal law which should be everywhere observed. He merely accommodated himself to a custom of civil life observed, at that time, by those to whom he was writing. This is admirably, I think, explained by [Johann H.] Altingius in a discourse already quoted… It must not be supposed that the same rule which he had given to the Corinthians from a regard to their customs would have been invariably given to Jews dwelling in their own country, or to Egyptians or Arabians, who followed a different custom. The usages of civil life are endlessly varied by place and time. Consequently what, at one place and time, is sufficiently becoming, would be, at anotlier place and time highly unbecoming. Yet the apostolic rule has been in force, since that time, among almost all Christians. Is it because keeping the head uncovered is universally regarded by them as a token of reverence? I hardly think so. It has spread widely in the north, through the nations of France and Germany. But among the Jews, the Greeks, ancient Italy, and the whole of the East, the custom is wholly unknown. It appears, therefore, to belong to the liberty of the New Testament. ‘With uncovered head,’ says Tertullian, ‘because we are not ashamed.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 84-90 of Dissertation 4, ‘On Gestures in Prayer’ in Sacred Dissertations on the Lord’s Prayer (1689; Edinburgh: Thomas Clark, 1708)</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Paul, when writing to the Corinthians who were Greeks, gives the preference to that [Greek] custom [of men having an uncovered head in worship]. In doing so, he did not intend to lay down a universal law which should be everywhere observed. He merely accommodated himself to a custom of civil life observed, at that time, by those to whom he was writing. This is admirably, I think, explained by [Johann H.] Altingius in a discourse already quoted… It must not be supposed that the same rule which he had given to the Corinthians from a regard to their customs would have been invariably given to Jews dwelling in their own country, or to Egyptians or Arabians, who followed a different custom. The usages of civil life are endlessly varied by place and time. Consequently what, at one place and time, is sufficiently becoming, would be, at anotlier place and time highly unbecoming. Yet the apostolic rule has been in force, since that time, among almost all Christians. Is it because keeping the head uncovered is universally regarded by them as a token of reverence? I hardly think so. It has spread widely in the north, through the nations of France and Germany. But among the Jews, the Greeks, ancient Italy, and the whole of the East, the custom is wholly unknown. It appears, therefore, to belong to the liberty of the New Testament. ‘With uncovered head,’ says Tertullian, ‘because we are not ashamed.&#x27;”

— Herman Witsius, pp. 84-90 of Dissertation 4, ‘On Gestures in Prayer’ in Sacred Dissertations on the Lord’s Prayer (1689; Edinburgh: Thomas Clark, 1708)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPaul%2C+when+writing+to+the+Corinthians+who+were+Greeks%2C+gives+the+preference+to+that+%5BGreek%5D+custom+%5Bof+men+having+an+uncovered+head+in+worship%5D.+In+doing+so%2C+he+did+not+intend+to+lay+down+a+universal+law+which+should+be+everywhere+observed.+He+merely+accommodated+himself+to+a+custom+of+civil+life+observed%2C+at+that+time%2C+by+those+to+whom+he+was+writing.+This+is+admirably%2C+I+think%2C+explained+by+%5BJohann+H.%5D+Altingius+in+a+discourse+already+quoted%E2%80%A6+It+must+not+be+supposed+that+the+same+rule+which+he+had+given+to+the+Corinthians+from+a+regard+to+their+customs+would+have+been+invariably+given+to+Jews+dwelling+in+their+own+country%2C+or+to+Egyptians+or+Arabians%2C+who+followed+a+different+custom.+The+usages+of+civil+life+are+endlessly+varied+by+place+and+time.+Consequently+what%2C+at+one+place+and+time%2C+is+sufficiently+becoming%2C+would+be%2C+at+anotlier+place+and+time+highly+unbecoming.+Yet+the+apostolic+rule+has+been+in+force%2C+since+that+time%2C+among+almost+all+Christians.+Is+it+because+keeping+the+head+uncovered+is+universally+regarded+by+them+as+a+token+of+reverence%3F+I+hardly+think+so.+It+has+spread+widely+in+the+north%2C+through+the+nations+of+France+and+Germany.+But+among+the+Jews%2C+the+Greeks%2C+ancient+Italy%2C+and+the+whole+of+the+East%2C+the+custom+is+wholly+unknown.+It+appears%2C+therefore%2C+to+belong+to+the+liberty+of+the+New+Testament.+%E2%80%98With+uncovered+head%2C%E2%80%99+says+Tertullian%2C+%E2%80%98because+we+are+not+ashamed.%27%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+pp.+84-90+of+Dissertation+4%2C+%E2%80%98On+Gestures+in+Prayer%E2%80%99+in+Sacred+Dissertations+on+the+Lord%E2%80%99s+Prayer+%281689%3B+Edinburgh%3A+Thomas+Clark%2C+1708%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fq

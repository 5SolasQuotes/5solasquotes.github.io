<blockquote><p>Among many evil, &amp; naughty affections which follow the nature of man, corrupted by sin (right honourable and beloved in Christ) few or none bring greater inconveniences with them, then doth the inordinate hope and expectation of long life. And this affection is so much the more hurtful and perilous, for that it is grounded so deeply, and sticketh so firmly in our nature, that it cannot easily be remedied or removed: which thing, beside common experience, hath of old time been noted, by divers and sundry proverbs, as this for one. Nemo est tam senex, qui non putet annum se posse viuere. There is no man so old, but that be thinketh he may live yet one year longer, and when that is done, yet an other, and an other yet after that, and so in infinitum, until all years &amp; days be clean past and expired.

The like hope of long life is expressed by this proverb, Aegroto anima dum est, spes est. The sick man, as long as he hath life &amp; breath, so long hath he hope: signifying that even in the greatest &amp; most dangerous diseases, the sick parties ever hope to live, and to escape, so that neither old age, which by natural course foresheweth death at hand, neither yet extremity of sickness, be it never so grievous, can remove from us this inordinate expectation, and vain hope of long life, so long as this body hath any breath abiding or life left in it.

Out of this evil root spring many branches of great inconveniences: For when men be in expectation of long life, and promise unto them selves continuance of many years: they fall by little and little into carnal security, they grow remiss in all godly exercises, delight altogether in pleasures of this world, little or nothing thinking of the world to come, or of any amendment or correction of life, but deferring it to a longer time, and so often times prevented with unlooked for death, &amp; found a sleep in their wicked security, they tumble headlong or they beware, into the pit of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-grindal.html">Edmund Grindal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon, at the funeral solemnity of the most high and mighty Prince Ferdinandus, the late Emperor of most famous memory holden in the Cathedral Church of saint Paul in London, the third of October, 1564</cite>, (London, 1564), unpaginated.</span></figcaption>

<blockquote><p>In short, our Reformers [of the Scottish Church, specifically John Knox, c. 1560] maintained: That the doctrine of defensive arms was necessary: that passive obedience or non-resistance was sinful when people had means for resistance (Knox, History, pp. 389, 396, Append. p. 25, 107, Passim.) That Daniel and his fellows did not resist by the sword because God had not given them the power and the means (Ibid., p. 317) That the primitive Christians assisted their preachers, even against the rulers and magistrates, and suppressed idolatry wheresoever God gave them force (Ibid., p. 393). (d) They maintained that the Judicial Laws of Moses (though not adopted into the Christian system) in many considerable instances continued still obligatory; particularly that the laws punishing adultery, murder, idolatry with death, were binding; that in obedience to these laws, that sentence was to be executed not only on subjects, but on sovereigns (Ibid., pp. 391-393; Passim.) That whosoever executes God’s Law, on such criminals, is not only innocent, but in his duty…</p></blockquote>

<blockquote><p>What is the “kingdom of God”? It is the dominion of God, his reign in the soul by his law written upon the heart; his reign in that community of souls which is called the church; his reign in the souls of all men in the end, except those in hell. The kingdom of God is opposed to the kingdom of the devil, and to the kingdom of man undertaking to reign without God, and to the kingdom of man, who, as a civil magistrate and swordbearer, can only restrain evil-doers and protect those who do well by force.

We see its beginning in Genesis iii. 15 in opposition to the kingdom of the devil and the beastly nature of fallen man (now become the image of the devil). Here it is the kingdom of God in man, or in the woman’s seed; the kingdom of man in God or God in man in opposition to the kingdom of man without God or against God. We see it again in the family of Abraham: in Israel after the flesh (theocracy), especially in the typical kingdoms of David and Solomon. Again in opposition to the kingdom of the beasts in Daniel, as the kingdom of the “Son of man.” Then again in Revelation in opposition to the kingdom of the beast, and finally prevailing and absorbing the kingdom of the world (the sovereignty of the world which had lasted for centuries becoming the sovereignty of our Lord and of his Christ) in Rev. xi. 15.

The kingdom of God, therefore, is the theocracy (the only kind of government which would have existed in the world if man had not apostatized from his Maker); sometimes the theocracy in its laws and principles of administration; sometimes, in its personnel, when it is equivalent to church (during the present militant condition of the kingdom); sometimes as to its internal growth; sometimes as to its external growth; sometimes in its militant, sometimes in its triumphant, state; but the fundamental idea always is that of a theocracy, of a government of God which is consented to (either in reality or pretence) by man; and always a government of God administered by man; and in the New Testament (when the incarnation has become plainly revealed) by the God-man, the “Son of man” (the special sense of which phrase is “the King” and “Head of the kingdom”); hence the association in the Gospels of the “kingdom of God” or “heaven” with the “Son of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on the Acts of the Apostles</cite>, in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia, ed. T. C. Johnson (3 vols, Richmond VA: The Presbyterian Committee of Publication, 1895-97), 3: 44-45.</span></figcaption>

<blockquote><p>In 1849, a cholera epidemic was raging throughout the United States. Not long after former President James K. Polk died of the disease in June, President Zachary Taylor declared a national day of fasting and prayer to be observed on August 3, 1849. E.D. McMaster, in his final days as President of Miami University in Ohio, preached a sermon that day titled Impending Judgments Averted by Repentance.” – Andrew Myers, ‘National Judgments Call for National Repentance: E.D. McMaster’; see here for more background info. Henry, Symmes C. – The Pestilence, a Divine Visitation: a Sermon preached August the Third, 1849, the Day of the National Fast Ref (1849) Symmes was a presbyterian minister in New Jersey. On the 1855 epidemic of Yellow Fever in America Armstrong, George D. – ‘The Lesson of the Pestilence’ (1855) on Heb. 12:10 About the yellow-fever epidemic in 1855 in Norfolk, Virginia, and in America generally. Armstrong was a presbyterian pastor. Cummins, George David – ‘The Pestilence: God’s Messenger and Teacher’ (1855) on Num. 16:46 About the yellow-fever epidemic in Norfolk, Virginia. Cummins (1822-1876) was an American Anglican Bishop and founder of the Reformed Episcopal Church. He was a staunch evangelical of reformed doctrine and he opposed the influences of ritualism and the Anglo-Catholic Oxford Movement. Storrs, Richard S. – ‘Terrors of the Pestilence’ (1855) on Eccl. 9:12 Storrs (1821-1900) was a conservative, congregational minister of the Church of the Pilgrims in Brooklyn, NY. Handy, Isaac W.K. – ‘The Terrible Doings of God’ (1855) Handy was a confederate, presbyterian pastor who was a graduate of Princeton Theological Seminary. He preached this sermon in a baptist church upon the occasion of 28 members of a Masonic Lodge dying in the recent epidemic in Virginia. A book of his, about his being imprisoned by the Union in the North, has been reprinted by Sprinkle Publications. . Breed, William P. – II. ‘The Great Plague’ in Under the Oak (Phila <blockquote><p>XXVI. …Yet the case may be, and often has been (and whither or no it be ours now [referring to Scotland in 1681], is not mine to determine) that a people may and ought to submit themselves to the government even of such a magistrate who either has injuriously usurped that office, or has so maleversed in the exercise thereof (by violating the main and most of the conditions upon which he was admitted to it) that his government is degenerat[ed] into a manifest tyranny and irreligion, and so has (de jure) fore-faulted his right to rule as a magistrate: I say the case of a people may be so circumstantiate [bound by circumstances], that they ought to subject themselves even to such a tyrant till the Lord clearly point forth to them a way, either from his written Word, or some extraordinary impulse and influence upon their spirits, or from indubitable grounds and persuasives of sound moral principles, or such like, whereby they may emerge from under that yoke. Hereby I do not yield, nor assert, that it is lawful to give obedience to any unlawful commands, or that it is no ways lawful for a people to shake off the yoke of an unlawful and tyrannical government: but only that there may be some cases wherein it is lawful for a people to yield subjection to a lawless tyrant, and wherein it may be unlawful for them to perpetrate or attempt their own liberation by external force (which abstractly from those circumstances might be both lawful, laudable and a necessary duty), viz. when the thing attempted is either altogether impracticable, the means or manner of effectuating it dubious or unwarrantable, the timing of it inexpedient and unseasonable, or the necessary concomitants or consequents of the cure more hurtful or dangerous than the disease; or the like: Neither do I affirm that under a tyrannical government it is always or absolutely lawful for the people to give passive obedience (if such a form of phrase may be admitted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.</p></blockquote>

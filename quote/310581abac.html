<main class="wrap"><figure class="quote" id="q-310581abac" data-kw="">
<blockquote><p>[George] Gillespie nowhere in his tome speaks of or argues the “greater good”. He does address personal, “greater duties,” but this allows him to confine the issues to immediate circumstances. Yet the relevance of a larger view of the greater good and its affecting our ethical obligations (especially with inconvenient actions, but also regarding scandal) cannot be denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-559bf1690e" data-kw="">
<blockquote><p>6th Rule. There is a principal obligation, a less principal, a least principal. Hence these three degrees issue from love: 1. God, 2. ourselves, 3. our neighbor. The love of God is most principal, and is the measure of the love of ourselves: the love of ourself is less principal than the love of God, and so the obligation [is] less. I am to make away, life and all things, yea, eternal glory as divided from holiness, and as it includes only happiness, rather ere I sin against God. The obligation to care for my own salvation is more principal than my obligation to care for the salvation of my brother: for the love of myself is the measure and rule of the love of my neighbor. Now because the obligation of caring for the soul of my brother is only secondary, in compare[ison] of the obligation of caring for my own salvation, I am not to sin myself, or sinfully to omit anything that is commanded me in a positive precept, to prevent the sin of my brother. Yet hence it does not follow that a positive precept is more excellent than the law of Nature, which is, ‘Thou shalt not murder,’ nor ‘scandalize him for whom Christ died.’ Because though to care for the soul of my brother be of the law of nature simpliciter, yet [it] is a secondary obligation, and may cease and yield to a stronger obligation that ties me more principally to care for my own soul; for though the command be positive, yet knowingly to sin by a sinful omission, is no less a destroying of my own soul, and so of the law of nature, in a higher obligation, than the other is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Appendix, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

e%2F559bf1690e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/559bf1690e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=6th%20Rule.%20There%20is%20a%20principal,higher%20obligation%2C%20than%20the%20other%20is&amp;text=6th%20Rule.%20There%20is%20a%20principal%20obligation%2C%20a&amp;text=in%20a%20higher%20obligation%2C%20than%20the%20other%20is" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-78607ed934" data-kw="">
<blockquote><p>Yet if the miscarriage be so great in the [authorities’] ordering even of these circumstances or in the manner of duties, as shall overthrow the duty itself and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey… then… we are not bound to follow… in such a case, but otherwise we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), 5th Disputation, ch. 12,; p. 461</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-b50da99f93" data-kw="">
<blockquote><p>To be precise, if we may consider frankly the actual system of virtue which Aristotle proposes, by which alone access to happiness is acquired, we will see that it is an arrogant supposition peddling the mere shadow of virtue, rather than that disposition of mind which comports with the human condition and its dependency on the most high God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologoumena Pantodapa</cite>, tr. Dr. David C. Noe</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

— John Owen, Theologoumena Pantodapa, tr. Dr. David C. Noe">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+be+precise%2C+if+we+may+consider+frankly+the+actual+system+of+virtue+which+Aristotle+proposes%2C+by+which+alone+access+to+happiness+is+acquired%2C+we+will+see+that+it+is+an+arrogant+supposition+peddling+the+mere+shadow+of+virtue%2C+rather+than+that+disposition+of+mind+which+comports+with+the+human+condition+and+its+dependency+on+the+most+high+God.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Theologoumena+Pantodapa%2C+tr.+Dr.+David+C.+Noe&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb50da99f93.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b50da99f93.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=To%20be%20precise%2C%20if%20we%20may,dependency%20on%20the%20most%20high%20God&amp;text=To%20be%20precise%2C%20if%20we%20may%20consider%20frankly&amp;text=and%20its%20dependency%20on%20the%20most%20high%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-798a5a79a7" data-kw="">
<blockquote><p>Thus, to return to the Scriptural example in Acts 21:20–26 (with 16:3 &amp; 18:21), when new Christians with serious misconceptions about what God required for public worship thought that Paul (a mature Christian teacher) taught against their way of worship, which was seriously defective, Paul, without a fuss, at the instigation of other Christian leaders, publicly led and performed that defective worship to prevent scandal to the erring, for the sake of visible Christian unity. Rather than dissent and abstain, Paul publicly led and participated in that defective, burdensome worship for the greater good. If that was true for inferior, carnal ordinances with no spiritual efficacy (2 Cor. 3:6–17; Heb. 7:18–19; 8:13; 9:10; 10:1–4), how much more does it pertain to impurities in the greater, spiritual, efficacious and enduring ordinances of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

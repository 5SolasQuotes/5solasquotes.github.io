<main class="wrap"><figure class="quote" id="q-700f6f7af7" data-kw="">
<blockquote><p>Labour to preserve the holiness of God’s true Institutions; those things that are of divine consecration. For human consecration, alas what is it? But for the Sabbath, the Lord’s day, labour to keep it holy. We talk much of Holy days, this is so indeed.

The Lord’s Supper, that’s of Divine Institution, labour for a holy participation thereof. If any thing in the world would drive me to a Passion, this would, to hear men plead for the holiness of places, and live unholy Lives; to stand up for human, and not regard Divine institutions.

Oh that our King and Parliament might do something more than is done for keeping the Sabbath holy! oh that we could mourn for that we cannot mend! The Sacraments are Holy: it is the duty of Ministers to labour to keep them holy. The Lord’s Word that’s Holy. Ministry, and the Ordinances of Jesus Christ, labour to keep in High esteem. We ought to hear with the same reverence, as if Jesus Christ himself was here to preach. Live like walking Temples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The burning yet un-consumed bush, or, The holiness of places discussed held forth in two farewell-sermons at Christ-Church London, August 17th, 1662</cite>, (London, 1662), p. 35.</span></figcaption>

</figure><figure class="quote" id="q-440f771606" data-kw="">
<blockquote><p>There is no end of books, and yet we seem to need more every day. There was such a darkness brought in by the fall, as will not thoroughly be dispelled till we come to heaven; where the sun shineth without either cloud or night. For the present, all should contribute their help according to the rate and measure of their abilities. Some can only hold up a candle, others a torch; but all are useful.

The press is an excellent means to scatter knowledge, were it not so often abused. All complain there is enough written, and think that now there should be a stop. Indeed, it were well if in this scribbling age there were some restraint. Useless pamphlets are grown almost as great a mischief as the erroneous and profane. Yet ’tis not good to shut the door upon industry and diligence. There is yet room left to discover more, above all that hath been said, of the wisdom of God and the riches of his grace in the gospel; yea, more of the stratagems of Satan and the deceitfulness of man’s heart.

Means need to be increased every day to weaken sin and strengthen trust, and quicken us to holiness. Fundamentals are the same in all ages, but the constant necessities of the church and private Christians, will continually enforce a further explication. As the arts and slights of besieging and battering increase, so doth skill in the foundation. If we have no other benefit by the multitude of books that are written, we shall have this benefit: an opportunity to observe the various workings of the same Spirit about the same truths, and indeed the speculation is neither idle nor unfruitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Richard Sibbes, A Learned Commentary or Exposition upon the First Chapter of the Second Epistle of S. Paul to the Corinthians</cite></span></figcaption>

</figure><figure class="quote" id="q-53506d0d61" data-kw="">
<blockquote><p>There is no rational creature which doth not set some one thing or other before its eyes as its main end and chief good; and according to the various predominants in sensual and mad men, are their various main ends. Hence is that there did result so many different opinions among heathen philosophers about man’s chief good. But here is the great mistake with foolish vain men, that whatever they seek after, it is but few who bend toward the true chief good, which is God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Honourable Societies of Strangers at Lewarden, in Friesland, 18 February 1686 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh</cite></span></figcaption>

</figure><figure class="quote" id="q-6ceaa3133c" data-kw="">
<blockquote><p>Objection: These gracious effects and fruits of singing Psalms, do plead as much for singing and playing with instruments, as for singing with voices. Answer 1: This last effect of singing to the glory of God with our glory is peculiar only to singing with our tongues. Answer 2: Suppose it were true that these effects of singing Psalms did plead as much for singing and playing with instruments, as singing with voices; yet evident it is that singing with voices had the preeminence, as that which uttering the Word of God did chiefly utter the Spirit of God breathing in it. And withal evident likewise it is that it is no impeachment to an ordinance that the outward dispensing of it may be performed by Nature and Art; but notwithstanding that it may be accompanied of God with a spiritual blessing. Answer 3: Singing with instruments was typical, and so a ceremonial worship and therefore is ceased. But singing with heart and voice is a moral worship such as it written in the hearts of all men by Nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms: a Gospel Ordinance</cite>, p. 5</span></figcaption>

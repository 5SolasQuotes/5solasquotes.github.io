<main class="wrap"><figure class="quote" id="q-5e965e2a11" data-kw="">
<blockquote><p>‘Private interpretation,’ [2 Pet. 1] is either Praeter fundamentum veritatis, ‘by the ground of verity,’ or Praeter fundamentum salutis, ‘by the ground of salvation;’ circa fundamentum salutis, ‘about the ground of salvation;’ or contra fundamentum salutis, or ‘contrary to the foundation of salvation’. 1. Praeter fundamentum veritatis, is when an interpretation agrees not with the place intreated, although it be not contra fundamentum salutis: these the Greeks called [Greek] aliena a proposito, out of purpose: as those who seek gold in the earth, if they miss the vein, they lose the gold (Chrysostom): so these who interpret Scripture, besides the meaning of the place intreated, they miss the sense of the Scripture. 2. Praeter fundamentum salutis, is that interpretation which is not only besides the verity, but also besides the foundation, Christ: this by the apostle is called hay and stubble, it shall burn, but the builder may be safe. (1 Cor. 3:15) 3. Circa fundamentum salutis, is that interpretation, which weakens the foundation, although it raze it not directly. 4. Contra fundamentum salutis, is that interpretation, which razes the foundation, ‘not holding the head Christ’. (Col. 2:19) … True interpretation is that interpretation which is super fundamentum, upon the foundation, and gives the true interpretation of the place intreated. The doctors of the Jews were called bonim, aedificantes, ‘builders,’ because they were bound to build upon the foundation. (Mk. 12:10)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Synagogue</cite>, … (London, 1623), bk. 1, ch. 1, paragraph 5, pp. 30-31</span></figcaption>

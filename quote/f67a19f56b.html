<blockquote><p>[George] Gillespie here glosses over the difference between miserable and moral evil, and assumes all practice of inconvenient ceremonies is to “take well” with them in an approving sense and is a voluntary “cleaving unto” them, rather than a permissive, tolerating reception of them as imposed burdens without moral approval.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

<blockquote><p>The Reformed certainly acknowledge that there is some substrate present under sin, namely a faculty or action in which inheres wickedness, although it is not a substance subsisting through itself; likewise they acknowledge that sin is not something negative; but they deny that it is something real, something substantial or positive; they affirm rather that it is something privative, which consists only in lawlessness, or the absence of moral uprightness in a capable subject. They do so because: (1) John in his first epistle (3:4) defines sin as precisely as possible, by only ἀνομία, lawlessness: ἡ ἁμαρτία ἐστὶν ἡ ἀνομία, “sin is lawlessness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, vol. 3, bk. 4, ch. 2 | section 21, p. 457</span></figcaption>

</figure><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin">
<blockquote><p>Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a> › <a href="../topics/providence/providence-and-evil/the-problem-of-evil.html">The problem of evil</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.”

— Johannes Piscator, Aphorisms of Christian Doctrine, Locus 6, aph. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+God+by+his+providence+governs+even+sins%2C+yet+he+is+not+the+cause+or+author+of+sin%3A+because+he+takes+no+delight+in+sin%2C+but+rather+abhors+it%3B+nor+does+he+himself+sin%2C+or+can+he+sin%3B+likewise+because+he+neither+commands+nor+persuades+sin%3B+nor+does+he+pour+malice+into+those+who+sin%2C+nor+compel+them+to+sin%3B+and+moreover+he+directs+all+things+to+a+good+end.%E2%80%9D%0A%0A%E2%80%94+Johannes+Piscator%2C+Aphorisms+of+Christian+Doctrine%2C+Locus+6%2C+aph.+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4b8c25085e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4b8c25085e.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-bc72ee2b84" data-kw="Permission Author of sin">
<blockquote><p>Not by permitting the evil action, because he is bound by no law to hinder sin. Not by determining it; for as he who puts out a fire so that it may not spread further is not the cause of the fire, so he who fixes bounds to sin is not the cause of sin. Not by directing it to a good end; for as it is the highest art to prepare a wholesome medicine from venomous animals, so it is glorious for God to draw light even out of darkness, and something good out of evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/permission-of-sin.html">Permission of sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a> › <a href="../topics/providence/providence-and-evil/permission-of-sin.html">Permission of sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Not by permitting the evil action, because he is bound by no law to hinder sin. Not by determining it; for as he who puts out a fire so that it may not spread further is not the cause of the fire, so he who fixes bounds to sin is not the cause of sin. Not by directing it to a good end; for as it is the highest art to prepare a wholesome medicine from venomous animals, so it is glorious for God to draw light even out of darkness, and something good out of evils.”

— Johannes Wollebius, Compendium of Christian Theology, bk. 1, ch. 6 (providence), canon 11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNot+by+permitting+the+evil+action%2C+because+he+is+bound+by+no+law+to+hinder+sin.+Not+by+determining+it%3B+for+as+he+who+puts+out+a+fire+so+that+it+may+not+spread+further+is+not+the+cause+of+the+fire%2C+so+he+who+fixes+bounds+to+sin+is+not+the+cause+of+sin.+Not+by+directing+it+to+a+good+end%3B+for+as+it+is+the+highest+art+to+prepare+a+wholesome+medicine+from+venomous+animals%2C+so+it+is+glorious+for+God+to+draw+light+even+out+of+darkness%2C+and+something+good+out+of+evils.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology%2C+bk.+1%2C+ch.+6+%28providence%29%2C+canon+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbc72ee2b84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bc72ee2b84.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-164bb5a624" data-kw="">
<blockquote><p>Since every being, insofar as it is being, is good, it is plain that evil cannot be anything real or positive, nor can it exist in itself. For it is the lack of good in something good. Insofar as it is opposed to the good for oneself it is lack of due perfection, as blindness in a man or animal. Insofar as it is opposed to the good for another it is the lack of relative appetibility, namely with respect to a certain appetite, as unripe fruit, poisonous plants. Evil cannot have a material or formal cause, namely constitutive principles. If material cause is taken in the sense of the subject-in-which, good is this cause. Evil cannot exist in itself but in some good. But can it have a final cause? Physical evil can be intended as a means to some end and licitly so, provided the end is good or indifferent or proportionate to the evil. Moral evil can be intended only illicitly and only by a finite will. But no evil can be desired for its own sake or as an end save under the appearance of good. For evil as such has no appetibility in itself or because of itself. But every evil can be permitted, that is, not impeded either by God or by man, given what needs to be given. Evil does have an efficient cause but only indirectly, namely in the producing of some good when the production is, for some reason, imperfect or defective whether on the part of the efficient cause or on the part of the matter, or even when a good is badly done, for example blindness from [the accidental] destruction of an eye [while pursuing another good]. Some Corollaries about Evil Conclusion 30: Evil involves good, or evil exists in a good, for from what was said evil is privation of good in something good. Conclusion 31: Evil corrupts the good that it harms. Insofar as evil is a privation of goodness in a good, it corrupts the good. And when evil is measured according to the good of which it is the lack, the greater the good that is missed the greater the corresponding evil. Hence the phrase: ‘corruptio optimi pessima’ or ‘the best is worst when corrupted’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pp. 108-9 Wolter (1913-2006) was an American, Franciscan, John Duns Scotus (d. 1308) scholar and professor of philosophy.</span></figcaption>

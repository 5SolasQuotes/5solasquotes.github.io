<main class="wrap"><figure class="quote" id="q-d9e023300a" data-kw="">
<blockquote><p>Archetypal Theology is not simply to be described as God’s Knowledge concerning Himself; but, if we wish to consider the Infinite Theology of God as a τύπον/type and πρωτότυπον/prototypical exemplar, according to which our Theology ought to be formed, it is to be added, which He decreed to manifest to the creature. And thus the Theology of the Creatures shall be a true Ectype, or the Image of the Archetype expressed in Creatures. It does not appear that this distinction is controverted very much:

1. for it is evident that God knows Himself most completely, and so no one is a more perfect θεολόγον/theologian, Matthew 11:27, neither in this particular is the Holy Spirit inferior to the Father or the Son, 1 Corinthians 2:10, 11.

2. It is no less certain that God has decreed to communicate some knowledge of Himself with Creatures, 1 Corinthians 2:7.

3. Neither will any of our Theology be able to be described as true, which does not correspond to that Knowledge of God concerning Himself and divine things, which Knowledge He decreed to be manifested to us in one way or another.

4. If the Knowledge of God also has regard to the Image of God, should not that Knowledge be called Ectypal, of which that Knowledge of God in God shall be the archetypal exemplar? yes, indeed, Colossians 3:10, ἐνδυσάμενοι τὸν νέον (ἄνθρωπον), τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ᾽ εἰκόνα τοῦ κτίσαντος αὐτόν, having put on the new (man), which is renewed in knowledge after the image of Him that created him.

5. The Sacred Scripture is said to deliver to us τύπον διδαχῆς, the form/type of doctrine, Romans 6:17, ὑποτύπωσιν ὑγιαινόντων λόγων, the pattern/prototype of sound words, 2 Timothy 1:13; but this is that knowledge of divine things revealed to us by the decree of God, in accordance with which our subjective Theology ought to be formed: so that to this extent this division of Theology also agrees quite well with the expression of Scripture.

6. Finally, this distinction shall be useful for this, that a Theologian might piously learn how to engage in the meditation of divine things, and thus from God to have an understanding in those things which have regard unto God, so that in his knowledge of God he might not deviate from that which of God and by God has been revealed to the creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 7, pp 86-87.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ca5ddc7651" data-kw="">
<blockquote><p>The purpose of this paper is to explain Descartes’ views on Metaphysics. It is my thesis that one of the ways in which he influenced not only modern philosophy, but the way in which we do philosophy even today, is by turning metaphysical inquiry into an epistemological enterprise. That is to say, he made the critique of knowledge necessary prior to any consideration of existence, and what may or may not have it… I will attempt to show that Descartes’ view of Metaphysics, in spite of the fact that he used familiar scholastic metaphysical terminology, actually turned Metaphysics into what is today termed Epistemology. Descartes, not Kant, was the first to perform a true critique of knowledge, and to make that critique a necessary preliminary to all questions about what exists outside our minds.</p></blockquote>

<blockquote><p>V. The faculties of the soul are really [realiter] distinct from the soul itself, as qualities or a peculiar accident [proprium accidens] differ from the subject. The reason is to be found in the result; when faculties of the soul are injured its essence remains.

VI. The faculties of the soul are either purely organic, as are the vegetative and sensitive faculties, or they are so partially and temporarily, as are intelligence and will. The former do not operate after the death of the body; the latter both can operate without the help of the body, and continue to operate after the body has been destroyed.</p></blockquote>

<blockquote><p>The theology of Christians approves the teachings of philosophy if they are true, correct, and salutary. It uses them by its own right and makes them catholic. If they are too unclear, it sheds light on them; if they are mixed with harmful errors, it separates the precious from the cheap and keeps the one and destroys the other.</p></blockquote>

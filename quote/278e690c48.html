<blockquote><p>7. Is original corruption seated only in the lower part of our soul?… The papists, especially the Jesuits, so that they might hold that the higher part of the soul, as they say, in which is the free choice, was unwounded by corruption, and also so that they might obtain that concupiscence is not sin, and accordingly, that notwithstanding concupiscence, a person can be perfect in this life, state that original corruption is only in the lower part of the soul, that is, in sensuality, in concupiscence, in the rebellion of the lower forces. And of the Reformed with their reasons The Reformed on the contrary refer original corruption not only to the lower faculties of the soul, but also to the higher faculties, and indeed more so to the higher than to the lower. … (1) the apostle expressly refers corruption to the mind in 1 Timothy 6:5, “the mind of corrupt men,” and in Colossians 2:18, “puffed up by the mind of his flesh.</p></blockquote>

<blockquote><p>4. Another expression of this arrogant ignorance is, when men will not believe the several truths of God, because they are not able to reconcile them, and place each one in its own order, and see the method and body of truth in its true locations and proportion: Nay, perhaps they will believe none, because they cannot discern the harmony. …These self-conceited ignorant souls, do imagine all to be impossible which exceeds their knowledge; and because they cannot see[?] the sweet consent of Scripture, and how those places do suit, and fortify each other, which to them seemed to contradict each other, therefore they think that no one else can see it; no not God Himself… And upon this account many cast away particular truths, though they will not cast away all. Some cannot reconcile the efficiency of the Spirit, with that of the Word, in the Conversion and Confirmation of sinners; and therefore some exclude one, and some the other, or own by the empty names; some cannot reconcile the Law, and the Gospel: And too great a part of the teachers, in the Christian world, have been so troubled to reconcile God’s grace, with man’s free-will, that of old, many did too much exclude the natural liberty of the will, upon a supposition of the inconsistency; only the names of both were still owned.</p></blockquote>

<blockquote><p>Nevertheless, it [death as a penalty] is not just any impotence, but a spiritual impotence. For in spiritual death, man retains his natural power of understanding, willing, and operating, though he becomes devoid of spiritual power. Furthermore, it is a spiritual impotence not for every kind of good, natural, civil, and moral, but for spiritual and saving good, good that accompanies salvation (Heb. 6:9), at least that he might do it spiritually (1 Cor. 2:14).</p></blockquote>

<blockquote><p>Suppose an apparently strong and healthy man should apply to you for relief, and, when asked why he did not labor for his subsistence, should reply, Because I can find no one to employ me. If you wished to know whether this or indolence were the true reason, you would offer him employment; and if he then refused to labor, you would feel satisfied that he was slothful and undeserving of your charity. So, when God puts into the hands of sinners a price to get wisdom, and they do not improve it, it becomes evident that they do not wish, that they are not willing, to become religious.</p></blockquote>

<blockquote><p>VIII. Third, as to moral necessity arising from habits. For as the will can be called “free” if it is devoid of habit, so it can rightly be called “slavish” if by habit it has been determined to a certain manner of acting. Still this servitude by no means overthrows the true and essential nature of liberty. Otherwise it would follow that habits destroy the will (which they rather perfect and facilitate to operation). Hence moral habits are twofold: good and evil. A twofold servitude also is thence born: the one of righteousness in good; the other of sin in evil and misery. This belongs to man in a state of sin, of which John says, “Whosoever committeth sin is the servant of sin” (8:34); and “Ye were the servants of sin” (Rom. 6:17)… IX. Hence it is evident that the adversaries falsely charge our men with saying the will is a slave in the state of sin, as if its liberty were destroyed by that very thing. Scripture beforehand so calls it and indeed with a twofold limitation: (1) that “servant” should be understood not absolutely and physically, but relatively, after the fall in a state of sin; (2) not simply about every natural, civil, or externally moral object, but especially about a spiritual object good per se (in which manner inability to good is more strongly asserted, but the essence of liberty is not destroyed). Although the sinner is so enslaved by evil that he cannot but sin, still he does not cease to sin most freely and with the highest liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Institutes, Tenth Topic, ‘The Free Will of Man in a State of Sin’, Question 2. The reader is encouraged to see Turretin’s numerous discussions relating to the related issues throughout his Institutes, as he has a lot more to say., p. 663</span></figcaption>

<div class="actions"><button class="copy" data-copy="“VIII. Third, as to moral necessity arising from habits. For as the will can be called “free” if it is devoid of habit, so it can rightly be called “slavish” if by habit it has been determined to a certain manner of acting. Still this servitude by no means overthrows the true and essential nature of liberty. Otherwise it would follow that habits destroy the will (which they rather perfect and facilitate to operation). Hence moral habits are twofold: good and evil. A twofold servitude also is thence born: the one of righteousness in good; the other of sin in evil and misery. This belongs to man in a state of sin, of which John says, “Whosoever committeth sin is the servant of sin” (8:34); and “Ye were the servants of sin” (Rom. 6:17)… IX. Hence it is evident that the adversaries falsely charge our men with saying the will is a slave in the state of sin, as if its liberty were destroyed by that very thing. Scripture beforehand so calls it and indeed with a twofold limitation: (1) that “servant” should be understood not absolutely and physically, but relatively, after the fall in a state of sin; (2) not simply about every natural, civil, or externally moral object, but especially about a spiritual object good per se (in which manner inability to good is more strongly asserted, but the essence of liberty is not destroyed). Although the sinner is so enslaved by evil that he cannot but sin, still he does not cease to sin most freely and with the highest liberty.”

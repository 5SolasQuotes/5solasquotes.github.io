<main class="wrap"><figure class="quote" id="q-3b7b87c1db" data-kw="">
<blockquote><p>God does all things in all things (Eph. 1:23). For this reason, all things are said to be from him, through him, and to him (Rom. 11:36), and the Saviour says that the Father is working, and he is working (John 5:17).

Nor is anything more evident to all than this, because he is the first cause of all things, without whom there could not be any action in the world: for if the first cause does not act, then how would a second cause act? I need not add that it is undoubtedly more perfect to act than not to act, and for this reason it cannot but be suitable for the most perfect one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology. Volume 3: The Works of God and the Fall of Man</cite>, trans. Todd M. Rester, eds Joel R. Beeke and Michael T. Spangler (1682; Grand Rapids MI: Reformation Heritage Books, 2021), Book 3.1.3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence.html">Providence</a></span></div>

Nor is anything more evident to all than this, because he is the first cause of all things, without whom there could not be any action in the world: for if the first cause does not act, then how would a second cause act? I need not add that it is undoubtedly more perfect to act than not to act, and for this reason it cannot but be suitable for the most perfect one.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b0f36fcd4e" data-kw="">
<blockquote><p>Many things are ascribed to God only, by reason of a special and admirable act of providence — as the saving of the world by Christ, the giving of Canaan to Israel, the bringing his people out from Egypt and from Chaldee, the sending of the gospel to both Jew and Gentile, etc.; but, shall we say that God did none of these things by the ministry of men, and weak and frail men?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

— Samuel Rutherford, Lex Rex, ... (1644; Edinburgh: Ogle, 1843), p. 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMany+things+are+ascribed+to+God+only%2C+by+reason+of+a+special+and+admirable+act+of+providence+%E2%80%94+as+the+saving+of+the+world+by+Christ%2C+the+giving+of+Canaan+to+Israel%2C+the+bringing+his+people+out+from+Egypt+and+from+Chaldee%2C+the+sending+of+the+gospel+to+both+Jew+and+Gentile%2C+etc.%3B+but%2C+shall+we+say+that+God+did+none+of+these+things+by+the+ministry+of+men%2C+and+weak+and+frail+men%3F%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb0f36fcd4e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b0f36fcd4e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/providence#:~:text=Many%20things%20are%20ascribed%20to%20God,men%2C%20and%20weak%20and%20frail%20men&amp;text=Many%20things%20are%20ascribed%20to%20God%20only%2C%20by&amp;text=ministry%20of%20men%2C%20and%20weak%20and%20frail%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d46fa14858" data-kw="">
<blockquote><p>XV. Furthermore, although God by his concurrence, doth give his influence into human actions, sustaining the agent, and directing the actions, setting bounds to them, ordering the events, and drawing good out of evil; yet must it not therefore be thought that God doth instigate to evil actions, or to have forced Eve to the eating of the forbidden tree. To the clearing of which assertion, we say that God doth not only work by the creature, but also work with the creature; both God and the creature are concurrent causes to one ἀποτελέσμα, to the bringing forth of one effect; and these two taken together, are the total cause of any action; which creature, if it doth work voluntary, may be his concurrence pollute the action wherein there is the concurrence of God, and determinate it to evil: By this means the whole fault doth remain with the creature.

For God effectually infusing into the creature, doth not take away from it the free contribution of its own power. If man sinneth any thing in an human action, the concurrence of God is natural: whatsoever was natural in the eating of the forbidden Apple was from God; whatsoever was moral and straying from the path of justice, was from man. As God doth give to a lame living creature the power of going, yet is not his lameness from God; so though God doth give to man the faculty of willing, and doth sustain the natural motion of the will and the act of willing; yet if any evil come which doth defile that act, it must not be said to be from God: Man is the effector of sin, God the permitter. That act in which there is deformity, is naturally good, in as much as it is from God: but morally evil, in as much as it is from man. The action in which the sin is, is one thing, the deformity of the action in which formally the sin is, is another thing. To the action it self God doth concur with man, but not to the sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 3.15, pp 13-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence.html">Providence</a></span></div>

<blockquote><p>Quest. Whether must we repent of that original sin, which is inherent; that natural corruption, the loss of original holiness; and that innate propensity to evil? It may seem not to be any just occasion of sorrow, because it is not voluntary, but natural; having, without our consent, seized upon us unavoidably.

Ans. This is principally to be repented of, as that which is the mother sin, the cause of all actual sins. Nor should the supposed involuntariness of it hinder us from making it the object of our sorrow.

For, 1, every sin is to be repented of. But this is a sin exceeding sinful, indeed, all sins in one. For, what is sin, who can better determine than the Lord himself? And he in Scripture determines, that whatever is a transgression of the law is sin, whether it be voluntary or no; not only that which we actually consent to, but that which he peremptorily forbids. The apostle’s definition of sin is unquestionable, 1 John iii. 4, ἁμαρτία ἐστιν ἡ ἀνομία; but no greater transgression than this, since it transgresses all at once.

We are commanded to be holy; so the want of holiness is forbidden, which is the privative part of this sin. We are commanded to love the Lord with all our hearts; so the heart’s inclination to hate God is forbidden, which is the positive part. Was not the apostle Paul more able to judge what is sin, than any papist, Socinian, &amp;c.? He calls it sin five times, Rom. vi., six times, Rom. vii., three times, Rom. viii., yea and his sin, though he then consented not to it.

2. Suppose (that which is false) no evil is to be repented of, but what is consented to, this should not hinder any from repenting of this sin; for all that are capable of repentance have actually consented to their natural corruption, have been pleased with it, have cherished it by occasions of sin, have strengthened it by acts of sin, have resisted the means whereby it should be mortified and subdued, which are all infallible evidences of actual consent. That which was only natural, is to us become voluntary; and so, by consent of all, sinful; and therefore necessarily to be repented of.

3. The necessity of it is grounded upon unquestionable examples of saints, both in the Old and New Testament. Instance in two of the holiest men that the Scripture mentions. David, in that psalm, which is left as a public testimony of his repentance, to the world, he bewails, acknowledges this, Ps. li. 5. Paul does acknowledge, aggravate, bewail it, as one heavily afflicted with it, Rom. vii. His description of it is very observable: as that which is not good, ver. 18; in me, i. e., in the unregenerate part, that which is not good, that which is evil, ver. 20, sin, six times; the greatest evil, a condemned forbidden evil, ver. 7; a sinful evil, ver. 13, καθʼ ὑπερβολὴν ἁμαρτωλὸς; a private evil, ver. 20, hinders him from doing good; a positive evil, ver. 17, no more I that do it, but sin; perverse evil, grows worse by that which should make it better, ver. 8; debasing evil, made and denominates him carnal, ver. 14; intimate, inherent evil, sin in him, ver. 17, in his members; a permanent evil, οἰκοῦσα ἐν ἐμοι, ver. 17; a fruitful evil, ver. 8, all manner of lust; a deceitful evil, ver. 11, ἐξηπάτησέ; an imperious evil, a law, ver. 23, gives law, commands as by authority; a tyrannical evil, αἰχμαλωτίζοντά, ver. 23; sold, ver. 14; a rebellious conflicting, war-like evil, ἀντιστρατευόμενον, ver. 23; an importunate, unreasonable evil, ver. 15, forces him to do that which he hates; a watchful evil, ver. 21, is present, παράκειται; a powerful evil, ver. 24, ‘who shall deliver?’ &amp;c.; a complete evil, ver. 24, a body furnished with all members of unrighteousness; a deadly evil, ver. 24, body of death, θανατώδες, ver. 11; slew me, ver. 9, I died; a miserable evil, ver. 24, above all things made him wretched.

Paul suffered as many calamities in the world, as any we read of in it; see a catalogue, 2 Cor. xi. 23–28. But all these sufferings could never extort such a passionate complaint from him, as this corruption. He could glory in those; but sighs, complains, exclaims, in the sense of this. You see how large he is in aggravating this. Here is above twenty aggravations of this. His sorrow was proportionable. No sin, no suffering, for which he expressed so much soul-affliction. And if he saw so much reason to bewail it, it is our blindness if we see it not. The more holy any man is, the more sensible of natural corruption. The more they get out of this corrupt element, the more heavy it is. Those who feel it not, are drowned in it. Elementum non gravitat in proprio loco. Sin is their proper element, who are not burdened with natural sinfulness.

If it was such an intolerable evil in him who was regenerate, how much more in the unregenerate! If it made him account himself wretched who was so happy, how much more miserable does it make those who have no title to happiness! If it was such an impetuous evil in him who had extraordinary powers of grace to weaken it, how prevailing in us, in whom grace is so weak! If he had cause to complain, bewail, repent of it, much more we!</p></blockquote>

</figure><figure class="quote" id="q-5cf0052172" data-kw="">
<blockquote><p>If sin is taken for an action conflicting with the law, original sin is the first disobedience of Adam, committed by Adam himself, not as he was a singular person, but as he bore the person of the whole human race. But if sin is taken for that which remains in a man after the action, and whence the same man is named not sinning but a sinner, original sin is the lack of original justice, together with a habitual aversion and deordination of the will, which can also be called a stain rendering the will hateful to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Original Sin in Works of Samuel Ward: Theological Determinations, a Treatise on Justification, Lectures on Original Sin</cite>, ed. Seth Ward (d. 1643; London: Gallibrand, 1658), pp. 392-656 trans. AI Latin | Thus, therefore, if it is asked of us what original sin properly is, we respond with Bellarmine:, ch. 13, pp. 537-39</span></figcaption>

</figure><figure class="quote" id="q-27682b7137" data-kw="">
<blockquote><p>It is not very just to chastise men for the offenses of their natural ancestors, but to take the fiction of ancestry in a corporate succession as a ground for punishing men who have no relation to guilty acts, except in names and general descriptions, is a sort of refinement in injustice belonging to the philosophy of this enlightened age… [they punish] men, many, if not most, of whom abhor the violent conduct of… former times as much as their present persecutors can do, and who would be as loud and as strong in the expression of that sense, if they were not well aware of the purposes for which all this declamation is employed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reflections on the Revolution in France</cite>, … (1790)</span></figcaption>

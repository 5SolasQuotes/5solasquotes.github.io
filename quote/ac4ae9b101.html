<blockquote><p>God’s increasing goodness may give some satisfaction to such as make question of Church Governors, proper and peculiar to the Church.

Of such I demand, whether it be a good, useful, and needful thing, for the Church to have Governors of its own; and secondly, whether the Church of the Jews had such Governors, or no. Surely, me thinks neither of these should be denied.

Have not families, schools of learning, Colleges, Universities, Cities, Towns, all manner of Corporations, Companies and Societies, Governors proper and peculiar to themselves: besides the public Magistrates, who are also over them? Is it not by experience found, that such proper and peculiar Governors are needful and useful, and so good in their several spheres? And shall the best Society on earth, the militant Church, be without Ecclesiastical Governors, proper and peculiar to it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), p. 24.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50e7148f16" data-kw="">
<blockquote><p>Again I conceive that there be two sort of positives in the externals of [Church] government or worship:

1. Some divine, as that there be in the public worship, prayers, praising, preaching, sacraments, and these are substantials; that there be such officers, pastors, teachers, elders and deacons; that there be such censures, as rebuking, excommunication and the like, are morally divine, or divinely moral: and when the Church forms a directory for worship and government, the directory itself is in the form not simply divine….

2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal; in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture as was the [Anglican] Service-Book [which was sought to be imposed on Scotland in 1637]; and the pastor or people in these are not properly moral agents [working things in themselves moral or religious], nor do we press that Scripture should regulate men in these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro | Section 5, pp. 80-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>Question. And if it be questioned how can any truth be kept [back], or any duty forborne? Should not all sin be reproved and can we be truthful to God and the people and not reprove sin or in forbearing any necessary duty, suppose it be to censure and maintaining authority of adjudications? Answer. The question is not wither duty should be forborne or if all sin should be reproved, but of the right means how to get such a sin taken with and how to get such duty done rightly. [2.] The speaking of all truth and doing of all duty is not a duty simply lying on ministers at all times, for that which may not edify is not a duty. Besides that, all ministers know not all truth; therefore speaking of truth and doing of duty must be so gone about as they preach such and such a particular truth, to convince of this or that sin, or bring to the doing of such a duty, principally to edify the body of Christ, [and for] the saving of people’s souls. And if the forbearing of such a truth or the not pressing such a duty for a time gain the soul sooner, is he not bound to make his practice subservient to that end? To clear it in a similitude: a man gets a commission to take in a strong city, but he is not obliged to take it in at such a strong port that is strongly fortified and at no other, but he is left to skill how to go about it or where to assault it. Will not wisdom say it were better to go to a part that is weaker or a part where either is more easy access and entry to be had, his commission being principally to take in the town and not that port now? A minister’s work is to cast out Satan, and all lusts out of the soul, and to bring every thought in subjection to Christ, and whither is it wisdom to batter at one door of the soul that is strongly fortified against such a truth, or to look to win in by another that is less controverted, wisdom would say it is best to labor to win in on the soul by a truth that is less controverted and then it is far more easy to win that sort the sinner, keeps and gains the city. This was the way Paul took, and directs ministers to use this holy wisdom and prudence, not stinting them to one gate [way] of pressing to duty or proponing [setting forth] truths, or convincing of sin, but leaving room to them to follow that way which may most edify, and to choose matter and method of proceeding as may be most subservient to that end. For when folks are confirmed in a thing and have a prejudice at that [which] may be spoken against it, it is a double work to a minister to set on a sin that is both in the affection and judgment. It is far better going in at another port than were the prejudice is fixed. Hence Paul leaves controverted questions of the law and is less preaching down those, but is more in positive truths and sins unquestioned, [and on] principles acknowledged by those he dealt with, and with idolaters and superstitious Samaritans beginning with preaching Christ, and not first falling on their idols, which might mar the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Sermons of James Durham</cite>, pp. 921-2 of 7. ‘A Sermon on Ephesians 4:11-12’ in Collected Sermons of James Durham…, vol. 1 (Naphtali &amp; RHB, 2017)</span></figcaption>

0it%20be%20questioned%20how%20can&amp;text=on%20their%20idols%2C%20which%20might%20mar%20the%20other" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Scriptures warrant us to look forward to a period when it [the church] shall resume the appearance of a united and peaceful community. Then shall it be fulfilled as it is written: “The earth shall be full of the knowledge of the Lord, as the waters cover the sea.” [Isaiah 11:9; Habakkuk 2:14] “The Lord shall be King over all the earth; in that day shall there be one Lord, and His name one.” [Zechariah 14:9] But before this consummation can be attained there must be some agreement as to the proper form of ecclesiastical government. And doubtless the Church shall then, in all its arrangements, be a model of symmetry and beauty. There will be no provision made for useless drones or meretricious ornamentations; but all will be taught to look for life and sustentation to the Head; all will be prepared, in some way, to conduce to the promulgation of His glory; all will be encouraged to endeavour to promote the general well-being; and thus all will be builded together for an habitation of God through the Spirit. The framework of the Church throughout will reveal the hand of Him who is excellent in counsel and wonderful in working.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-d-killen.html">W. D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>framework of the church. A treatise on church government</cite>, (Edinburgh, 1890), pp 4-5.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Scriptures warrant us to look forward to a period when it [the church] shall resume the appearance of a united and peaceful community. Then shall it be fulfilled as it is written: “The earth shall be full of the knowledge of the Lord, as the waters cover the sea.” [Isaiah 11:9; Habakkuk 2:14] “The Lord shall be King over all the earth; in that day shall there be one Lord, and His name one.” [Zechariah 14:9] But before this consummation can be attained there must be some agreement as to the proper form of ecclesiastical government. And doubtless the Church shall then, in all its arrangements, be a model of symmetry and beauty. There will be no provision made for useless drones or meretricious ornamentations; but all will be taught to look for life and sustentation to the Head; all will be prepared, in some way, to conduce to the promulgation of His glory; all will be encouraged to endeavour to promote the general well-being; and thus all will be builded together for an habitation of God through the Spirit. The framework of the Church throughout will reveal the hand of Him who is excellent in counsel and wonderful in working.”

— W. D. Killen, framework of the church. A treatise on church government, (Edinburgh, 1890), pp 4-5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Scriptures+warrant+us+to+look+forward+to+a+period+when+it+%5Bthe+church%5D+shall+resume+the+appearance+of+a+united+and+peaceful+community.+Then+shall+it+be+fulfilled+as+it+is+written%3A+%E2%80%9CThe+earth+shall+be+full+of+the+knowledge+of+the+Lord%2C+as+the+waters+cover+the+sea.%E2%80%9D+%5BIsaiah+11%3A9%3B+Habakkuk+2%3A14%5D+%E2%80%9CThe+Lord+shall+be+King+over+all+the+earth%3B+in+that+day+shall+there+be+one+Lord%2C+and+His+name+one.%E2%80%9D+%5BZechariah+14%3A9%5D+But+before+this+consummation+can+be+attained+there+must+be+some+agreement+as+to+the+proper+form+of+ecclesiastical+government.+And+doubtless+the+Church+shall+then%2C+in+all+its+arrangements%2C+be+a+model+of+symmetry+and+beauty.+There+will+be+no+provision+made+for+useless+drones+or+meretricious+ornamentations%3B+but+all+will+be+taught+to+look+for+life+and+sustentation+to+the+Head%3B+all+will+be+prepared%2C+in+some+way%2C+to+conduce+to+the+promulgation+of+His+glory%3B+all+will+be+encouraged+to+endeavour+to+promote+the+general+well-being%3B+and+thus+all+will+be+builded+together+for+an+habitation+of+God+through+the+Spirit.+The+framework+of+the+Church+throughout+will+reveal+the+hand+of+Him+who+is+excellent+in+counsel+and+wonderful+in+working.%E2%80%9D%0A%0A%E2%80%94+W.+D.+Killen%2C+framework+of+the+church.+A+treatise+on+church+government%2C+%28Edinburgh%2C+1890%29%2C+pp+4-5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67a90d231a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67a90d231a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2014/04/29/w-d-killen-on-post-millennialism-and-church-government/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Lord’s Supper is justly considered as peculiarly solemn. All the ordinances of God are holy, as they have a holy God for their author, are to be observed in a holy manner, and are appointed means of promoting holiness. Yet an ordinance may be said to be more solemn in respect of the more sensible manifestation which God makes therein of his glory, in respect of the peculiarly awful warning which He gives against a rash and inconsiderate manner of intermeddling with it, in respect of the variety of holy exercises which concur in the right observation of it, and, lastly, in respect of the more full and public representation of the communion which the people of God have with his whole Church. That the Lord’s Supper has a greater solemnity in these respects than some other ordinances, seems to have been hitherto the sense of the whole New Testament Church. This is expressed by the judicious Mr. Durham, in the first of his communion sermons [The Unsearchable Riches of Christ (1685), A Preparation Sermon, pp. 4-5], where, speaking of the words of institution, he says: ‘Every circumstance speaks out a solemnity in this ordinance, as the night in which it was instituted, the same night in which He was betrayed, and his jealousy of and threatening for the abuse of this ordinance. The Lord’s Supper seems dignified with an eminence above all other gospel ordinances: 1st, in reference to what it exhibits. They all set forth love, but this sets forth love in an eminent degree, for it sets forth the Lord’s death, wherein the most eminent degree of his love shines. It sets forth the great masterpiece of his love, his actual dying. 2ndly, in respect of the excellent benefits communicated in it. It is true there is no other thing, on the matter, communicated in it, than in the Word and baptism; yet if ye look to the words, ‘Take, eat, this is my body’, they hold forth Christ Jesus not so much giving any particular gift, as actually conferring Himself in his death and suffering. 3rdly, in respect of the manner in which our Lord Jesus makes over Himself: For there is herein not only a most clear view of the slain Savior, and of covenanting with God, but also a clear glance of heaven upon earth, Jesus Christ and his people mixing (so to speak) and being familiar together; He condescending not only to keep company with them, but to be their food and refreshment, and giving not only the Word to their faith, but Himself (as it were) to their sense! Insofar as the mean, whereby He communicates Himself, is more sensible; it is by his Spirit that the mean is made effectual. There is not only a fixedness of faith on our part, but a sort of divineness in the ordinance itself, as it were, to the very senses of the believer. ‘I say unto you,’ says our Lord, ‘I will not drink henceforth of the fruit of the vine, until the day when I shall drink it new with you in my Father’s kingdom,’ where He seems to point out, that in this ordinance, He has a more special way of keeping communion with his people, bearing a resemblance to that which He will have with them in Heaven.’ That there is a peculliar solemnity in the partaking of the Lord’s Supper, appears from the concurrence of duties requisite to the right performance of it. ‘If it be a great and difficult work,’ adds the same eminent divine: ‘to carry rightly on an ordinary Sabbath, or in prayer, or in meditation, how difficult must communicating be, in which we ought to have all these joined together/’ If all religious duties were equally solemn, then they would all alike require preparation. An ejaculatory prayer, for example, would require another duty to prepare for it; and that duty would require another, and so on without end. The Old Testament Church had more solemn days, such as that on which the children of Israel stood before the Lord in Horeb. And there were to be such days under the New Testament dispensation also. Hence, in the vision, which we have in the latter part of the prophecy of Ezekiel, and which judicious interpreters allow to be an emblematical representation of the New Testament Church, we have an account of the observation of such solemnities as the Passover and the Feast of Tabernacles, Eze. 45:21,25. And surely sacramental occasions may be said to be such times. A person that duly consideres these things, will not be easily persuaded, that there ought to be no more solemnity in the breaking of the sacramental bread, than in asking a blessing at our ordinary meals.</p></blockquote>

<blockquote><p>3. By forgetting the difference between their private familiarity, where they are choosers of their company themselves, and their Church-communion, where the pastors are the rulers and judges of the fitness of the members. Or else not understanding that this use of the keys, and judging of the fitness of the members, is indeed the pastor’s office and not theirs. 4. By not considering that nothing must be done by discipline upon offenders but in a course of Church-justice, upon due accusations, summons, audience, proof and patient admonition: And not by casting out any irregularly upon the expectation of every one that will say that they are ungodly and scandalous. … 8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>

<blockquote><p>VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VI &amp; VIII, pp. 35-37</span></figcaption>

</figure><figure class="quote" id="q-816ed4b644" data-kw="">
<blockquote><p>5. We know the Tabernacle and Temple were corporal things made with hands and that they are things different from the spiritual things that they signify, as the sign and the thing signified; as therefore the Lord is express in the elements and rites of the Supper of the Lord, because all of them, bread, wine, taking, eating, breaking, pouring out the wine, drinking, are teaching and edifying signs; and our Lord never left it to the wisdom of men to devise signes to teach themselves: So in like manner, should the Lord expressly specify all the teaching and signifying signs in the Old Testament; and as Moses might devise none of his own, but was tied to follow the pattern which the Lord Himself showed to him in the mount: So are we now under the New Testament tied to the pattern of that same will revealed in the Word; and it is laid on us not to be wise above that which was written; and it is of perpetual equity: The supreme Lawgiver never left it to the wisdom of angels, or men, or prophet, apostle or Church, to serve and worship God as they thought good: But He Himself particularly prescribed the way, signs, and means: And because God has not been pleased in the New Testament to specify types of Christ incarnate, and come in the flesh already; therefore are we obliged in conscience to believe, and practise no more, either in doctrinals, or teaching types, or positives of Church-policy, than our pattern in the mount, the Scripture has warranted to us, to be the will of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), pp. 49-50</span></figcaption>

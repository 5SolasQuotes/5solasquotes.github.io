<main class="wrap"><figure class="quote" id="q-5f474b95c3" data-kw="">
<blockquote><p>Some see the abolition of the sabbath in Jesus’ words, “the Son of man is lord even of the sabbath” (Mark 2:28). This is certainly a strong assertion of the greatness of his own person, but it is perverse to see in it any disparagement of the Old Testament. The right observance of the sabbath was certainly a point of controversy between Jesus and his opponents. But it is important to see what was at issue. On one occasion Jesus drew the attention of the Jews to the fact that they practised the Mosaic ordinance of circumcision on the sabbath if necessary (John 7:22f.) and used this as a justification of his sabbath healings. As I have written elsewhere:

He was not arguing simply that a repressive law be liberalised. Not did he adopt an anti-sabbatarian attitude, opposing the whole institution. He pointed out that his action fulfilled the purpose of the original institution. Had they understood the implication of the Mosaic provision for circumcision on the sabbath they would have seen that deeds of mercy such as he had just done were not merely permissible but obligatory. [Leon Morris, The Gospel according to John (Grand Rapids, 1971), p. 409.]

Jesus was not repudiating the Old Testament but asserting its true meaning. There is no more force in the contention that Jesus’ quotation of Hosea 6:6, “I desire steadfast love and not sacrifice” (see Matt. 9:13), means abolishing sacrifice, a divinely ordained institution. This is the intention neither of Hosea nor of Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leon-morris.html">Leon Morris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I Believe in Revelation</cite>, (London: Hodder and Stoughton, 1976), p. 55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f2f815566" data-kw="">
<blockquote><p>Now the Galatians had been forced by the false apostles to observe these same rites as something necessary for righteousness. This is why he says that they have lost grace and Christian liberty, and have turned back to the slavery of the weak and beggarly elements. They had been persuaded by the false apostles that these laws had to be observed; that when they were observed, they granted righteousness; but that when they were neglected, they brought damnation. But Paul does not permit consciences to be bound by the Mosaic Law in any way, but everywhere he sets them free from the Law. “Now I, Paul,” he says later on, in chapter five (v. 2), “say to you that if you receive circumcision, Christ will be of no advantage to you.” In Col. 2:16 he says: “Let no one pass judgment on you in questions of food and drink or with regard to a festival or a new moon or a Sabbath.” Thus Christ says (Luke 17:20): “The kingdom of God does not come by observance.” Much less should consciences be burdened and ensnared by human traditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 411.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

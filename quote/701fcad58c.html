<main class="wrap"><figure class="quote" id="q-701fcad58c" data-kw="">
<blockquote><p>Therefore, though we grant that the Apostles of the Lord handed down to posterity some customs which they never committed to writing; still, first, this has nothing to do with the doctrine of faith, (as to it we cannot extract one iota from them,) but only with external rites subservient to decency or discipline; and secondly, it is still necessary for them to prove that everything to which they give the name is truly an apostolical tradition. … We especially repudiate their desire to make certainty of doctrine depend not less on what they call agrafa, (unwritten,) than on the Scriptures. We must ever adhere to Augustine&#x27;s rule, &quot;Faith is conceived from the Scriptures.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session IV</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da71c1ee94" data-kw="">
<blockquote><p>That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ch. 1, §§ 9–10</span></figcaption>

</figure><figure class="quote" id="q-3f70548235" data-kw="">
<blockquote><p>In other words, if faith depends upon the word of God alone, if it regards and reclines on it alone, what place is left for any word of man? … God deprives man of the power of producing any new doctrine, in order that he alone may be our master in spiritual teaching, as he alone is true, and can neither lie nor deceive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.9</span></figcaption>

</figure><figure class="quote" id="q-1cb88c976c" data-kw="">
<blockquote><p>Sundry other branches there are of the abominations of these men … which may be reduced to these three corrupt and bloody fountains: — 1. That the Scripture at best, as given out from God, and as it is to us continued, was and is but a partial revelation of the will of God, the other part of it … being reserved in their magazine of traditions. 2. That the Scripture is not able to evince or manifest itself to be the Word of God … without an accession of testimony from that combination of politic, worldly-minded men that call themselves the Church of Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Divine Original of the Scriptures</cite>, Works (Goold), vol. 16</span></figcaption>

</figure><figure class="quote" id="q-0df9e898c7" data-kw="">
<blockquote><p>I must turn to the Word of God. In questions of this kind it matters nothing what the world thinks right or wrong. There is only one sure test of truth. What says the Scripture? What is written in the Bible? What is the mind of the Holy Spirit? If we cannot submit our judgments to this infallible umpire, it is useless to pretend that we have any religion at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, ch. on The Heart, p. 322</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8297e99054" data-kw="">
<blockquote><p>The [ministerial] candidate who is not ready to swear in truth, judgment, and in righteousness, that he believes the whole doctrine contained in our Confession of Faith, and Catechisms, to be founded upon the word of God, cannot be received by us into the holy ministry, without a most sinful violation of our ordination vows and engagements. He must also declare that he believes the binding obligation of our solemn covenants upon posterity. …

We impose our Formula upon no man; but we must endeavour, in the strength of promised grace, to be faithful to our glorious Master, and to all with whom we are connected in church-fellowship. We are commanded to commit the things of God to faithful men, who shall be able to teach others also. It is not tyranny to exclude from the holy ministry candidates who do not believe all the truths contained in the sacred oracles. Such persons will shun to make known the whole counsel of God to perishing sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-willis.html">William Willis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A smooth stone from the brook. Or, An humble attempt to prevent backsliding from the principles of the covenanted Church of Scotland, in some letters to the Rev. George Lawson</cite>, (Glasgow: M. Ogle, 1799), pp 5, 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe9e827b1c" data-kw="">
<blockquote><p>The short [of your inquiring letter] whereof is: The receiving without public repentance of those which come from the Churches of England [to separate assemblies in England]: where because in the outward profession, that the laws of the land do justify the dumb [non-preaching] ministry, there appear unto you no lawful assemblies of the Church of Christ; your fear is, lest in uniting yourselves with such [by allowing them into the good graces of the separate assemblies], you should be unequally yoked [with them], and made fellow members of some other than of that whereof Christ Jesus is the Head. First therefore, if it be showed that the ordinary assemblies of those that profess the Gospel in England be the Churches of Christ, it seems that the way will be paved and planed for mutual intercourse between us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’</cite>, Separation’ 15, pp. (1584) in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-0823b12c19" data-kw="">
<blockquote><p>You must distinguish between: …

II. Between those parish-churches which have godly or tolerable pastors and those that have not.

III. Between ministry and lay-communion.

IV. Between stated and occasional communion.

V. Between preferring their churches before better, and not avoiding them as null, or as unlawful to be communicated with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, p. 224</span></figcaption>

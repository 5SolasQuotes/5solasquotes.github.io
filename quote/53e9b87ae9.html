<main class="wrap"><figure class="quote" id="q-53e9b87ae9" data-kw="">
<blockquote><p>§. 44. Direction 5. Make haste away from the occasions of thy sin, and the company which ensnares thee in it. If thou knewest that they were robbers that intended to murder thee, thou wouldst be gone: If thou knewest that they had plague sores running on them thou wouldst be gone: And wilt thou not be gone when thou knowest that they are the servants of the Devil, that would infect thee with sin, and cheat thee of thy salvation? Say not, Is not this company lawful, and that pleasure lawful? etc. If it be like to entice thy heart to sin, it is unlawful to thee, whatever it is to others: It is not lawful to undo thy soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 623</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ab9361c37" data-kw="">
<blockquote><p>10. That all such Magistrates, or other persons that shall be trusted with this service [about the plague], may be enabled to do all other things necessary in pursuing the execution of these orders as occasion shall require, and be out of the danger of misconstruction, seeing they hazard their particular safeties to provide for the public.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-example.html">Long Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Orders about the Plague</cite>, 1641</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“10. That all such Magistrates, or other persons that shall be trusted with this service [about the plague], may be enabled to do all other things necessary in pursuing the execution of these orders as occasion shall require, and be out of the danger of misconstruction, seeing they hazard their particular safeties to provide for the public.”

</figure><figure class="quote" id="q-cb0fbf9de6" data-kw="">
<blockquote><p>And albeit the vocation of a pastor, his commission and instructions relating thereto, be all of a spiritual nature, and of divine original, yet their persons, estates and behavior, considered in a civil capacity, are, according to Scripture and reason, subject to the civil government.</p></blockquote>

</figure><figure class="quote" id="q-5a4fe470af" data-kw="">
<blockquote><p>1. Thou shalt not hurt thy own body. One may be guilty of self-murder… (1.) Indirectly and occasionally, as: First, When a man thrusts himself into danger which he might prevent; as if a company of archers were shooting, and one should go and stand in the place where the arrows fly, if the arrow did kill him, he is accessory to his own death. In the law, God would have the leper shut up, to keep others from being infected. Lev. 23:4. Now, if any would be so presumptuous as to go in to the leper, and get the plague of leprosy, he might thank himself; he occasioned his own death. Secondly, A person may be in some sense guilty of his own death, by neglecting the use of means. If sick, and use no physic, if he has received a wound and will not apply balsam, he hastens his own death. God appointed Hezekiah to lay a ” lump of figs upon the boil,” Isa. 38:21. If he had not used the lump of figs, he had been the cause of his own death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, ‘Of Sanctification’</cite>, on the 6th Commandment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-36c2bc95f2" data-kw="">
<blockquote><p>If in the Old Testament God himself ordered lepers to be banished from the community and compelled to live outside the city to prevent contamination [Leviticus 13–14], we must do the same with this dangerous pestilence so that anyone who becomes infected will stay away from other persons, or allow himself to be taken away and given speedy help with medicine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether one may Flee from a Deadly Plague’</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“If in the Old Testament God himself ordered lepers to be banished from the community and compelled to live outside the city to prevent contamination [Leviticus 13–14], we must do the same with this dangerous pestilence so that anyone who becomes infected will stay away from other persons, or allow himself to be taken away and given speedy help with medicine.”

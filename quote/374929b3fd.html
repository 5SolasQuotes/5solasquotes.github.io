<main class="wrap"><figure class="quote" id="q-374929b3fd" data-kw="">
<blockquote><p>God’s Word is pre-eminently a blessed word. It makes known most gracious views of the divine character, and draws by the most blessed persuasion, the hearts of God’s people to find ever increasing interest and delight in the divine ways and perfections. The more that we take our instruction regarding the divine character from the Bible, the more shall we be convinced, that, during our day of grace, God would allure our affections to himself, and would prevail upon us to receive in faith and love the most gracious manifestations of his divine excellencies. …

He that is addressing unto you truths of such marvellous condescension, is the high and lofty One that inhabiteth eternity. There is infinitely more embodied in that declaration, than it is possible for any one adequately to express. He, whose glory is infinite, whose perfections are divine, whose essence is unsullied holiness, is announcing from his abode of unutterable purity and splendour, truths of unsearchable grace and condescension.

No created being can approach his glory and excellence. In the simple grandeur of Scriptural expression, it is affirmed, that he is the “high and lofty One that inhabiteth eternity.” His inconceivable perfections, and excellence, and glory, are represented in the designation, that he is “the high and lofty One.” His abode is with unequalled sublimity brought before the believing admiration of the people of the Lord, “He inhabiteth eternity.” His immediate dwelling-place, in its undefined immensity, is eternity. The glory and the honour of the heavens encircle Jehovah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mungo-fairlie-parker.html">Mungo Fairlie Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Dwelling with the Humble and Contrite, the Source of their Revival’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c0b3c83338" data-kw="">
<blockquote><p>8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that:

1. God’s power makes it possible for all things to be.

2. Next God knows them possible.

3. He knows what is convenient or fit to be made to his unsearchable ends.

4. He wills that they shall be, and man among the rest, and so on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 13</span></figcaption>

</figure><figure class="quote" id="q-c3fc0b348f" data-kw="">
<blockquote><p>Among other arguments, they say that matter is ingenerable [i.e., cannot arise from nothing]. But who among Christians could accept this? They insist that Aristotle proves it. But Scripture clearly shows that God made the heavens without any change to himself. Even if creation commenced with the beginning of the world, still the creation itself caused no change in God. What God decreed at some point within himself, this he began at some time to carry out. Not that God himself had a new operation, but that the things he had previously decreed within himself began to exist by his own will, for he had that purpose from eternity. Moreover [the idea] that there is any ungenerated motion is also rejected by us. He who is the originator of heaven and of earth is also the originator of motion and time. Besides, we do not make God liable to time or created things. As he is incorporeal, so he is above all things. It is suitable for Christians to think worthily about God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Genesis</cite>, trans. Mickey Mattox, Reformation Texts with Translation, no. 13 (1531; Milwaukee WI: Marquette University Press, 2013), p. 55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1d83a2433e" data-kw="">
<blockquote><p>The stability of the earth is very useful to plants, beasts, and men, that abide thereon. The damages and mischiefs that fall out upon earthquakes give further proof hereof. It is a gross error of Aristarchus, Samius, Copernicus, and other philosophers, who imagine that the earth continually moveth, and that the heaven and the host thereof do but seem to our sight to move, as the banks and trees thereon do to such as are in a boat rowed with oars, or in a ship under sail. This conceit cannot stand with the metaphor of a foundation, here and in other places applied to the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, ch. 1, verse 10, section 131</span></figcaption>

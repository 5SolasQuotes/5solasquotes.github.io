<blockquote><p>That in endeavoring union and healing men would not straiten it to an universal union in everything, in judgement and practice, but would resolve to have it with many things defective that need forbearance in persons that are united, which men may take up in these particulars: 1. There may be difference of judgement in many things, I mean in such things that are consistent with the foundation and edification; and such a forbearance would be resolved upon, and to do otherways were to think that either men had no reason at all, or that their understandings were perfect, or at least of equal reach. 2… certainly, if people ought to carry even to corrupt ministers who yet destroy not the foundation, as ministers, in the duties that becomes them to ministers in communion with them, while they continue such, then certainly ministers ought to keep that communion with ministers, that becomes their relations, seeing they are still ministers in that respect, as well as in the other. And if this corruption will not warrant separation in other ordinances, as was said in the close of the second part, then neither will it warrant division in the ordinance of government.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f8269055c4" data-kw="">
<blockquote><p>Yet with these heretics and schismatics [the Donatists], our Jacobites, Brownists and Barrowsts symbolize; for, as the Donatists refused communion with the catholic Church in regard of some scandals they observed in it, so do these separate from the true Church of England in regard of some abuses, and, as they term them, popish corruptions in it. As they excluded all from hope of salvation who were not of their pure precise sect, so these go not much behind them in their uncharitable censures of all those who are not of their fraternity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged</cite>, … (London: Bourne, 1645), ch. 1, p. 27 Featley was a Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-48449acda9" data-kw="">
<blockquote><p>O bear with your brethren’s differing from you and judge charitably of them, as to the most part at least. Construct it [a] want [lack] of light, not sinistrousness of intention or affection. ‘He that keeps a day, keeps it to the Lord; and he that keeps it not to the Lord, he keeps it not.’ [Rom. 14] In problematic questions not defined by the Church, allow others a latitude and continue your brotherly forbearance. If even with infidels and heretics the servant of the Lord must not strive, but be gentle, etc. (as 2 Tim. 2:24-25), how much less with sick and feverish brethren? If any man’s inconsiderate and opinionative zeal carry them unto any unbrotherly word or deed toward you, be not ye overcome of their evil, but overcome their evil with your good. Pack up their reproachings and say, ‘Father, forgive them, they know not what they are doing.’ Let not their vexing you fret you into a wearying of your work (Ps. 55:6-8), nor unto any disaffection or lessening of your respect unto them. Love them as brethren, notwithstanding all injuries (as Joseph did his), and honor their zeal in the Lord, and pray He may channel it right and set its bounds, for so it might do Him excellent service. Tolerate also good people’s infirmities; let none of their capricious humors (which these reeling times tempt them unto) diminish your tender care of them. Seek that which strays, heal the diseased, and by gentle dealing convince them that ye walk in the Spirit of Jesus, whom ye serve. Hard things (we confess) are cut out for you; but put on patience and holy resolution, stand your ground notwithstanding all batteries and do your work over the belly of all discouragements (Heb. 12:2-3). What though ye be the witnesses prophesying in sackcloth (Rev. 11:3); your crown will be the massier. Serve the Lord through good report and ill report, honor and dishonor; and make full proof of your ministry, which is thought so considerable by Satan, else he would not oppugne and oppose it so upon the right hand and the left. You are the eye-sore of the Prelates and their party, and the butt of those your brethren’s mistaken zeal. Be strong therefore in the Lord, etc. Our soul pities you, being as the speckled bird among the birds of the field, laid at upon all hands and grinded as betwixt two mill-stones, viz. the Prelatic party’s enmity upon the one hand and the fierceness of these malcontented friends upon the other (and who may stand before envy? (Prov. 27:4) But learn of your Master to endure contradiction and to be set for a sign to be spoken against, that the thoughts of many hearts may be revealed (Lk. 2:34-35). Endure the cross and despise the shame. Wounds in the house of friends as well as of foes must be born till He arise and plead your cause and bring forth your righteousness as the light, etc. This is the day of your trial, and these are the instruments chosen of the Lord for that end; acquit yourselves like men, like Christians, like ministers in it. Bear the indignation of the Lord patiently, because perhaps ye have sinned. If Shimei rail, he may be a good monitor, though a bad judge. Take your vexations as so many whetstones, to keep you in an holy edge, that ye blunt not in these up-sitting times, and as spurs in your sides to prick you up to diligence in duty; and so may you get meat out of the eater, etc. Stoop to your lot, there may be a blessing in it (2 Sam. 16:10-12). But bitter though your life and labor be, yet faint not, O faint not! but approve yourselves to God and man in your Master’s service; and by piety, painfulness and powerfulness in the Gospel, convince gain-sayers, stop the mouths of those that speak evil of you falsely, and preach home again all the respect and affection which these times of difference has derogated from you. What? have ye not the seal of your ministry (a witness of Gods approbation) upon the hearts of many? even of some who perhaps are now alienated from you, who once spake of a blessedness in your ministry, and received you as angels, though now in the hour of tentation, they are become as an enemy? Gal. 4:15-16. Though conversion of sinners be not so frequent (and yet some there is), yet has not God been evidently with you for confirmation and building up of the saints, and for conviction upon all, who, whether they be better of you or not, yet are forced to say, ‘God is in you and with you,’ and ‘A prophet has been among them?’ as Eze. 2:4-5. Now, may not these eminent divine assistances, successes and proofs of acceptance, abundantly compense all your tears, sufferings and sorrows? and answer the questioning of your being sent of God, being proofs of Christ speaking in you? Consider, the privilege of your liberty, and think, is not service to God and his people (which hereby ye get done) well worth the enduring much contradiction, obloquy and heart-breaking reproach? Remember also your brethren’s sufferings are sad at others’ hands, though none at yours; and let your sympathizing with them sweeten your own at their hands. And Oh! be stirred up to make good use of your liberty which costs you so dear. Let your people find through Gods help, that it has been their mercy that ever ye were sent among them; or whether they hear or forbear, that there has been a prophet among them. Keep in good terms with your Master, stand in his counsel, know the times, and tell what of the night, and what Israel ought to do; be faithful in all his house as servants and good stewards of the mysteries of God. Bear burden with your brethren in their tedious sufferings constantly. And pray for a blessing upon their preaching of the Gospel, albeit some of them would ruin yours: And whosoever of them may preach Christ out of contention, or fast for strife and debate, supposing to add affliction to your griefs and to detract from your esteem, yet rejoice ye that Christ is preached, and that sincerely by the most, Phil. 1:15-18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), pp. 148-152</span></figcaption>

m you, who once spake of a blessedness in your ministry, and received you as angels, though now in the hour of tentation, they are become as an enemy? Gal. 4:15-16. Though conversion of sinners be not so frequent (and yet some there is), yet has not God been evidently with you for confirmation and building up of the saints, and for conviction upon all, who, whether they be better of you or not, yet are forced to say, ‘God is in you and with you,’ and ‘A prophet has been among them?’ as Eze. 2:4-5. Now, may not these eminent divine assistances, successes and proofs of acceptance, abundantly compense all your tears, sufferings and sorrows? and answer the questioning of your being sent of God, being proofs of Christ speaking in you? Consider, the privilege of your liberty, and think, is not service to God and his people (which hereby ye get done) well worth the enduring much contradiction, obloquy and heart-breaking reproach? Remember also your brethren’s sufferings are sad at others’ hands, though none at yours; and let your sympathizing with them sweeten your own at their hands. And Oh! be stirred up to make good use of your liberty which costs you so dear. Let your people find through Gods help, that it has been their mercy that ever ye were sent among them; or whether they hear or forbear, that there has been a prophet among them. Keep in good terms with your Master, stand in his counsel, know the times, and tell what of the night, and what Israel ought to do; be faithful in all his house as servants and good stewards of the mysteries of God. Bear burden with your brethren in their tedious sufferings constantly. And pray for a blessing upon their preaching of the Gospel, albeit some of them would ruin yours: And whosoever of them may preach Christ out of contention, or fast for strife and debate, supposing to add affliction to your griefs and to detract from your esteem, yet rejoice ye that Christ is preached, and that sincerely by the most, Phil. 1:15-18.”

2C+stand+your+ground+notwithstanding+all+batteries+and+do+your+work+over+the+belly+of+all+discouragements+%28Heb.+12%3A2-3%29.+What+though+ye+be+the+witnesses+prophesying+in+sackcloth+%28Rev.+11%3A3%29%3B+your+crown+will+be+the+massier.+Serve+the+Lord+through+good+report+and+ill+report%2C+honor+and+dishonor%3B+and+make+full+proof+of+your+ministry%2C+which+is+thought+so+considerable+by+Satan%2C+else+he+would+not+oppugne+and+oppose+it+so+upon+the+right+hand+and+the+left.+You+are+the+eye-sore+of+the+Prelates+and+their+party%2C+and+the+butt+of+those+your+brethren%E2%80%99s+mistaken+zeal.+Be+strong+therefore+in+the+Lord%2C+etc.+Our+soul+pities+you%2C+being+as+the+speckled+bird+among+the+birds+of+the+field%2C+laid+at+upon+all+hands+and+grinded+as+betwixt+two+mill-stones%2C+viz.+the+Prelatic+party%E2%80%99s+enmity+upon+the+one+hand+and+the+fierceness+of+these+malcontented+friends+upon+the+other+%28and+who+may+stand+before+envy%3F+%28Prov.+27%3A4%29+But+learn+of+your+Master+to+endure+contradiction+and+to+be+set+for+a+sign+to+be+spoken+against%2C+that+the+thoughts+of+many+hearts+may+be+revealed+%28Lk.+2%3A34-35%29.+Endure+the+cross+and+despise+the+shame.+Wounds+in+the+house+of+friends+as+well+as+of+foes+must+be+born+till+He+arise+and+plead+your+cause+and+bring+forth+your+righteousness+as+the+light%2C+etc.+This+is+the+day+of+your+trial%2C+and+these+are+the+instruments+chosen+of+the+Lord+for+that+end%3B+acquit+yourselves+like+men%2C+like+Christians%2C+like+ministers+in+it.+Bear+the+indignation+of+the+Lord+patiently%2C+because+perhaps+ye+have+sinned.+If+Shimei+rail%2C+he+may+be+a+good+monitor%2C+though+a+bad+judge.+Take+your+vexations+as+so+many+whetstones%2C+to+keep+you+in+an+holy+edge%2C+that+ye+blunt+not+in+these+up-sitting+times%2C+and+as+spurs+in+your+sides+to+prick+you+up+to+diligence+in+duty%3B+and+so+may+you+get+meat+out+of+the+eater%2C+etc.+Stoop+to+your+lot%2C+there+may+be+a+blessing+in+it+%282+Sam.+16%3A10-12%29.+But+bitter+though+your+life+and+labor+be%2C+yet+faint+not%2C+O+faint+not%21+but+approve+yourselves+to+God+and+man+in+your+Master%E2%80%99s+service%3B+and+by+piety%2C+painfulness+and+powerfulness+in+the+Gospel%2C+convince+gain-sayers%2C+stop+the+mouths+of+those+that+speak+evil+of+you+falsely%2C+and+preach+home+again+all+the+respect+and+affection+which+these+times+of+difference+has+derogated+from+you.+What%3F+have+ye+not+the+seal+of+your+ministry+%28a+witness+of+Gods+approbation%29+upon+the+hearts+of+many%3F+even+of+some+who+perhaps+are+now+alienated+from+you%2C+who+once+spake+of+a+blessedness+in+your+ministry%2C+and+received+you+as+angels%2C+though+now+in+the+hour+of+tentation%2C+they+are+become+as+an+enemy%3F+Gal.+4%3A15-16.+Though+conversion+of+sinners+be+not+so+frequent+%28and+yet+some+there+is%29%2C+yet+has+not+God+been+evidently+with+you+for+confirmation+and+building+up+of+the+saints%2C+and+for+conviction+upon+all%2C+who%2C+whether+they+be+better+of+you+or+not%2C+yet+are+forced+to+say%2C+%E2%80%98God+is+in+you+and+with+you%2C%E2%80%99+and+%E2%80%98A+prophet+has+been+among+them%3F%E2%80%99+as+Eze.+2%3A4-5.+Now%2C+may+not+these+eminent+divine+assistances%2C+successes+and+proofs+of+acceptance%2C+abundantly+compense+all+your+tears%2C+sufferings+and+sorrows%3F+and+answer+the+questioning+of+your+being+sent+of+God%2C+being+proofs+of+Christ+speaking+in+you%3F+Consider%2C+the+privilege+of+your+liberty%2C+and+think%2C+is+not+service+to+God+and+his+people+%28which+hereby+ye+get+done%29+well+worth+the+enduring+much+contradiction%2C+obloquy+and+heart-breaking+reproach%3F+Remember+also+your+brethren%E2%80%99s+sufferings+are+sad+at+others%E2%80%99+hands%2C+though+none+at+yours%3B+and+let+your+sympathizing+with+them+sweeten+your+own+at+their+hands.+And+Oh%21+be+stirred+up+to+make+good+use+of+your+liberty+which+costs+you+so+dear.+Let+your+people+find+through+Gods+help%2C+that+it+has+been+their+mercy+that+ever+ye+were+sent+among+them%3B+or+whether+they+hear+or+forbear%2C+that+there+has+been+a+prophet+among+them.+Keep+in+good+terms+w <blockquote><p>The Lutherans on the contrary, by defect, decline fraternal fellowship with the Reformed, who by no means differ from them in the foundation. The Reformed pursue a middle way: (1) they reject the Socinians’ Samaritanism, that is, fraternal fellowship with those who err in the foundation, and render it useless to us (1 Cor. 3:12 with Rom. 10:3–4; Gal. 5:4), being adduced: (1)… (c) by reasons, because the fellowship of the mystical body rests upon the unity of the fundamental faith (Eph. 4:4–5). (2) With churches that err concerning the foundation, that is, which teach such things whereby, through necessary consequence, the foundation is made to fail, they do not want to rashly break church fellowship, unless perhaps they exclude us (1 Cor. 3:12; Eph. 4:4–5; Col. 2:19), after the example of Paul, who due to errors of this sort, by no means separated from the churches of Corinth, Galatia, and Colossae.</p></blockquote>

<blockquote><p>The catholic or universal visible Church is the assembly of all those which make profession of the Gospel of Jesus Christ throughout the whole world, distinguished (as we have said) into many particular Churches, all which do make but one body. Of all these particular, as members and parts of one and the self-same body, some are pure, other some are impure, some more, and some less sound, and some at this day are sick even unto death… Those that are of the purer and sounder Churches, we call them sound and true Churches, consenting to the true doctrine, which is the name, that for the most part, the ancient fathers have given them. The others we call the erring, heretical or schismatical Churches, according as they err, either in faith or in charity, against the square and right rule of Christ, or against the rule of his Church, either in the one or in the other, notwithstanding every one in his degree.</p></blockquote>

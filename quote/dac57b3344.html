<main class="wrap"><figure class="quote" id="q-dac57b3344" data-kw="">
<blockquote><p>Sixthly, in this that Christ bare the curse of the law upon the cross; we learn that those that be the children of God, when they suffer any judgement, cross, or calamity, either in body or in mind or both, do not bear them as the curses of God, but as the chastisements of a loving father.

For it doth not stand with the justice of God to punish one fault twice: and therefore when any man that putteth his whole confidence in God, shall either in his own person, in his good name, or in his goods feel the heavy hand of God, God doth not as a judge curse him, but as a father correct him.

Here then is condemned the opinion of the Church of Rome, which hold, that we by our sufferings do in some part satisfy the justice of God: but this can not stand, because Christ did make a perfect satisfaction to the justice of his father for all punishment. And therefore satisfaction to God made by man for temporal punishment is needless, and much derogates from Christ’s passion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 335.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c22edc0d1" data-kw="">
<blockquote><p>He had undergone, for our sakes, though innocent, the sentence of death. For, in His own Person, He bore the sentence righteously pronounced against sinners by the Law. For He became ‘a curse for us’, according to the Scripture: ‘For cursed is everyone’, it is said, ‘that hangeth on a tree.’ And accursed are we all, for we are not able to fulfil the Law of God: ‘For in many things we all stumble’; and very prone to sin is the nature of man. And since, too, the Law of God says: ‘Cursed is he which continueth not in all things that are written in the book of this Law, to do them,’ the curse, then, belongeth unto us, and not to others. For those against whom the transgression of the Law may be charged, and who are very prone to err from its commandments, surely deserve chastisement. Therefore, He That knew no sin was accursed for our sakes, that He might deliver us from the old curse. For all-sufficient was the God Who is above all, so dying for all; and by the death of His own Body, purchasing the redemption of all mankind. The Cross, then, that Christ bore, was not for His own deserts, but was the cross that awaited us, and was our due, through our condemnation by the Law. For as He was numbered among the dead, not for Himself, but for our sakes, that we might find in Him, the Author of everlasting life, subduing of Himself the power of death; so also, He took upon Himself the Cross that was our due, passing on Himself the condemnation of the Law, that the mouth of all lawlessness might henceforth be stopped, according to the saying of the Psalmist; the Sinless having suffered condemnation for the sin of all.” (commenting on John 19:16–18) “And the title contained a handwriting against us—the curse that, by the Divine Law, impends over the transgressors, and the sentence that went forth against all who erred against those ancient ordinances of the Law, like unto Adam’s curse, which went forth against all mankind, in that all alike broke God’s decrees. For God’s anger did not cease with Adam’s fall, but He was also provoked by those who after him dishonoured the Creator’s decree; and the denunciation of the Law against transgressors was extended continuously over all. We were, then, accursed and condemned, by the sentence of God, through Adam’s transgression, and through breach of the Law laid down after him; but the Savior wiped out the hand- writing against us, by nailing the title to His Cross, which very clearly pointed to the death upon the Cross which He underwent for the salvation of men, who lay under condemnation. For our sake He paid the penalty for our sins. For though He was One that suffered, yet was He far above any creature, as God, and more precious than the life of all.” (commenting on John 19:19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-cyril-of-alexandria.html">Cyril of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-97ee38d870" data-kw="">
<blockquote><p>Q What remedy or redemption is there against sin and death?

A. Jesus Christ the eternal Son of God, who in man’s nature suffered the death of the cross and perfectly fulfilled that Law for all them that do receive him.

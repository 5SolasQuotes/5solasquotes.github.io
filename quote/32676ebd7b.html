<blockquote><p>Peter had confessed in his own name, and that of his brethren, that Christ was the Son of God, (Matth. 16: 16.) On this rock Christ builds his Church, because it is the only foundation; as Paul says, &quot;Other foundation than this can no man lay,&quot; (1 Cor. 3: 11.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.6</span></figcaption>

</figure><figure class="quote" id="q-4b07a0e66a" data-kw="">
<blockquote><p>And not only Peter but also all the apostles, by making this confession—which they would soon proclaim in the midst of the world—laid the foundation of the church of Christ. Accordingly, figuratively speaking, along with Peter they were all of them the rock on which Christ built his church; or, in another application of the same image, Christ is the rock that the apostles by their preaching laid as the foundation of the church (Acts 4:11; Rom. 9:33; 1 Cor. 3:10–11; Eph. 2:20; 1 Pet. 2:5–6; Rev. 21:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

</figure><figure class="quote" id="q-49003e754d" data-kw="">
<blockquote><p>Certain it is that many popes have been notorious heretics, as Liberius and Felix, who were Arians; Honorius, a Monothelite; and John XXIII, who denied the immortality of the soul. In the papal see, several schisms have been, and divers times many popes together, excommunicating one another and reciprocally calling one another Antichrist; and of those Antichrists, the worst commonly overcame. So according to the very canons of the Roman Church, factions and corruptions in the creation of the popes have several times made their election void and therefore have broken the thread of that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, bk. 1, ch. 32</span></figcaption>

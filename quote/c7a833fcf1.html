<main class="wrap"><figure class="quote" id="q-c7a833fcf1" data-kw="">
<blockquote><p>Note the words “let him be silent in the church” in verse 30, and compare them with “let them he silent in the churches” in [1 Corinthians 14] verse 34. The prohibition of women speaking covers thus all public church meetings – it is the publicity, not the formality of it, which is the point. And he tells us repeatedly that this is the universal law of the church. He does more than that. He tells us that it is the commandment of the Lord, and emphasizes the word “Lord” (verse 37).

The passage in 1 Timothy 2:11ff. is just as strong, although it is more particularly directed to the specific case of public teaching or ruling in the church. The apostle had already in this context (verse 8, “the men,” in contrast with “women” of verse 9) pointedly confined public praying to men, and now continues: “Let a woman learn in silence in all subjection; but I do not permit the woman to teach, neither to rule over the man, but to be in silence.” Neither the teaching nor the ruling function is permitted to woman. The apostle says here, “I do not permit,” instead of as in 1 Corinthians 14:33ff., “it is not permitted,” because he is here giving his personal instructions to Timothy, his subordinate, while there he was announcing to the Corinthians the general law of the church. What he instructs Timothy, however, is the general law of the church. And so he goes on and grounds his prohibition in a universal reason which affects the entire race equally.

In the face of these two absolutely plain and emphatic passages, what is said in 1 Corinthians 11:5 cannot be appealed to in mitigation or modification. Precisely what is meant in 1 Corinthians 11:5, nobody quite knows. What is said there is that every woman praying or prophesying unveiled dishonors her head. It seems fair to infer that if she prays or prophesies veiled she does not dishonor her head. And it seems fair still further to infer that she may properly pray or prophesy if only she does it veiled. We are piling up a chain of inferences. And they have not carried us very far. We cannot infer that it would be proper for her to pray or prophesy in church if only she were veiled.

There is nothing said about church in the passage or in the context. The word “church” does not occur until the 16th verse, and then not as ruling the reference of the passage, but only as supplying support for the injunction of the passage. There is no reason whatever for believing that “praying and prophesying” in church is meant. Neither was an exercise confined to the church. If, as in 1 Corinthians 14:14, the “praying” spoken of was an ecstatic exercise – as its place by “prophesying” may suggest – then there would be the divine inspiration superceding all ordinary laws to be reckoned with. And there has already been occasion to observe that prayer in public is forbidden to women in 1 Timothy 2:8, 9 – unless mere attendance at prayer is meant, in which case this passage is a close parallel of 1 Timothy 2:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Paul on Women Speaking in Church in The Presbyterian</cite></span></figcaption>

<blockquote><p>…Which, as I take it, is to be understood of any time of her coming abroad. But this kind of covering is not used in these cold countries, but instead thereof hats, or other dresses, a difference being yet still retained, in that the woman’s cover upon her head is fixed, but the man moves his in salutation and for reverence at any time… But this as has been already touched out of Beza, holds not but in such countries where to sit with the hat off argues authority, and to be covered, subjection; In these parts it is contrariwise, and therefore our preaching uncovered does not seem to be grounded upon this, but rather to have been taken up in reverence to God… And upon the like reason men are appointed to hear the Word of God read being uncovered, and to follow the same order at the preaching of the Word is most commendable in all, that are not constrained by their bodily infirmity to cover. Only I say it is altogether from the purpose of this place to teach a necessity of so doing.</p></blockquote>

<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>

<blockquote><p>1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way.

2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years.

3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way.

2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years.

3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.”

— Wilhelm Zepperus, Other citations (work not named), On the Sacraments (Herborn, 1606), ch. 13, fol. 324-26, 328, as trans. by John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’, pp. 173-74 Zepper (1550-1607) was a German reformer.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+The+furious+clamors+and+persecutions+of+the+Papists+did+not+permit+this+reformation+of+ceremonies+at+the+first%3A+which+were+so+violent+and+bloody%2C+that+it+gave+small+or+no+leisure+to+the+teachers+and+lights+of+the+Church%2C+neither+was+it+safe+for+them+to+bend+their+care+or+cogitations+this+way.+2.+The+people+were+so+drowned+in+the+deep+darkeness+and+idolatry+of+the+Papacy+that+the+amendment+of+ceremonies%2C+and+of+external+worship+could+not+in+those+beginnings+be+undertaken.+It+was+necessary+to+use+doctrine%2C+and+to+instruct+the+people+of+sundry+and+horrible+errors%2C+idolatry%2C+superstitions+and+abuses%2C+which+the+whole+Papacy+and+Popish+ceremonies+have+in+their+departure%2C+that+so+all+those+ugly+things+might+first+be+removed+out+of+their+minds%2C+before+they+were+removed+from+their+sight.+That+which+is+not+the+work+of+one+year%2C+but+a+task+of+long+season%3A+For+as+ceremonies+which+are+visible+things+and+apprehended+by+the+eyes+do+more+affect+and+move+than+the+invisible+doctrine%3B+So+the+people+did+closely+stick+to+their+accustomed+ceremonies%2C+and+opposed+themselves+vehemently+against+the+reformation+of+them%3A+Even+as+we+see+at+this+day+to+come+to+pass%2C+when+as+yet+sound+doctrine+has+prevailed+and+flourished+for+above+these+80+years.+3.+The+Church+in+Popery+was+nothing+else+but+a+sick+body%3A+In+which+from+the+sole+of+the+foot+to+the+crown+of+the+head%2C+there+was+nothing+sound+and+entire%3A+Wherefore+at+the+first+beginning+of+reformation+that+whole+chaos+and+abomination+of+error%2C+and+of+Popish+idolatry+could+not+suddenly+be+perceived%2C+but+use+and+experience+did+daily+manifest+and+teach+every+day+more%2C+than+at+the+first.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Zepperus%2C+Other+citations+%28work+not+named%29%2C+On+the+Sacraments+%28Herborn%2C+1606%29%2C+ch.+13%2C+fol.+324-26%2C+328%2C+as+trans.+by+John+Sprint%2C+Cassander+Anglicanus%2C+showing+the+Necessity+of+Conformity+to+the+Prescribed+Ceremonies+of+our+Church+in+Case+of+Deprivation+%28London%3A+Bill%2C+1623%29%2C+%E2%80%98Reformed+Practices%E2%80%99%2C+pp.+173-74+Zepper+%281550-1607%29+was+a+German+reformer.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F429dcffa50.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/429dcffa50.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=1.%20The%20furious%20clamors%20and%20persecutions,day%20more%2C%20than%20at%20the%20first&amp;text=1.%20The%20furious%20clamors%20and%20persecutions%20of%20the&amp;text=teach%20every%20day%20more%2C%20than%20at%20the%20first" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But above all else, I beg the sincere reader, and I beg for the sake of our Lord Jesus Christ himself, to read those things judiciously, yes, with great commiseration. May he be mindful of the fact that I was once a monk and a most enthusiastic papist when I began that cause. I was so drunk, yes, submerged in the pope’s dogmas, that I would have been ready to murder all, if I could have, or to co-operate willingly with the murderers of all who would take but a syllable from obedience to the pope. So great a Saul was I, as are many to this day. I was not such a lump of frigid ice in defending the papacy as Eck and his like were, who appeared to me actually to defend the pope more for their own belly’s sake than to pursue the matter seriously. To me, indeed, they seem to laugh at the pope to this day, like Epicureans! I pursued the matter with all seriousness, as one, who in dread of the last day, nevertheless from the depth of my heart wanted to be saved. So you will find how much and what important matters I humbly conceded to the pope in my earlier writings, which I later and now hold and execrate as the worst blasphemies and abomination. You will, therefore, sincere reader, ascribe this error, or, as they slander, contradiction to the time and my inexperience. At first I was all alone and certainly very inept and unskilled in conducting such great affairs. For I got into these turmoils by accident and not by will or intention. I call upon God himself as witness. Hence, when in the year 1517 indulgences were sold (I wanted to say promoted) in these regions for most shameful gain—I was then a preacher, a young doctor of theology, so to speak—and I began to dissuade the people and to urge them not to listen to the clamors of the indulgence hawkers; they had better things to do. I certainly thought that in this case I should have a protector in the pope, on whose trustworthiness I then leaned strongly, for in his decrees9 he most clearly damned the immoderation of the quaestors [revenue officials], as he called the indulgence preachers.</p></blockquote>

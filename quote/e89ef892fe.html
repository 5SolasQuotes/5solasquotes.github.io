<main class="wrap"><figure class="quote" id="q-e89ef892fe" data-kw="">
<blockquote><p>We will Enquire, First, What is the Believing, that will secure Salvation?

And that Enquiry shall be thus Answered. It is a Looking to, and Trusting in, the Lord Jesus Christ, for Salvation. Faith cannot be better described, than in that Call to Faith which our Lord has given us, Isa. 45.22. Look unto me, &amp; be ye Saved. A man must see himself plunged into doleful circumstances of Sinfulness &amp; Wretchedness, by his Fall from God, &amp; see himself unable to help himself out of those doleful circumstances. A man must see God manifest in Flesh, and the Son of God become Incarnate, in our Lord Jesus Christ, and the Lord Jesus Christ become the only Mediator between God and man.

A man must see the Lord Jesus Christ making Satisfaction for the Sins of His Chosen by His Obedience to the Death, and now Ever living to make Intercession for us, and able to Save unto the uttermost all that come to God by Him. A Sight of these things, &amp; a Flight unto the Lord Jesus Christ upon what we see, This is Faith. Faith is an Addressing to, &amp; a Depending on the Lord Jesus Christ, as the only One, that shall Recover us to Everlasting Happiness. Faith is a Repairing to the Lord Jesus Christ for Salvation. It saith, Psal. 116.4. I beseech thee, O Lord, to deliver my Soul. And Faith is a Relying on the Lord Jesus Christ for Salvation. It saith, Psal 62.5, 6. My Soul, wait thou only upon God, for my Expectation is from Him, He only is my Salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace triumphant. Or, A notable example of a great sinner, becoming a great saint. Improved for the direction and encouragement, of them that have sinned exceedingly, to seek salvation from all their sins</cite>, (Boston: T. Green, 1700), pp 19-21.</span></figcaption>

<blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote>

</figure><figure class="quote" id="q-e5a8eeba0e" data-kw="">
<blockquote><p>XX. Moreover, it is necessary that those things which pertain to the principal object of faith be believed distinctly; but the rest it is enough if they are believed confusedly. Those things are believed distinctly which faith apprehends separately and one by one. And this is the faith which is called explicit. Confusedly, those things which are not apprehended in particular, but only in some common principle in which they are contained: and this is the faith which they call implicit. For example, he who believes that the book of Judges is divinely inspired, yet has not read it nor heard anything recited about it: he indeed believes that the histories contained there are true, but implicitly and confusedly. But he who reads those histories and knows one by one the things narrated in that book about Samson and Gideon and the rest of the leaders of the Israelite people, he has explicit and distinct faith of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on Faith’ in Theological Theses put forth at Various Times at the Academy of Sedan 3rd</cite>, ed. tr. Onku with AI (1645; London: Moses Pitt, 1683), p. 4 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

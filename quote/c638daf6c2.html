<blockquote><p>3. [As Rutherford’s adversary said,] There is no government where sovereignty is not kept inviolable. [Rutherford:] It is true; where there is a king, sovereignty must be inviolable; What then? Arbitrary government is not sovereignty… 3. Arbitrary governing has no alliance with God;</p></blockquote>

<blockquote><p>22. They that think that conforming ministers are guilty of great sin must consider what diversity of education, company and interest may do, even on men of conscience, and that we have all our sins. And it’s sinful uncharitableness to think and speak worse of them than they deserve and to talk against all for the faults of some. … 24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not. ¹ [The Anglican parish churches tended to have a simpler and more plain and Scriptural worship than the cathedral churches of the cities, which had many more human and showy additions. Many of the older non-conformist ministers that separated from the cathedral worship yet would not separate in principle from the parish churches. Baxter was of this mind.] 25. They that say conformists convert no souls take on them to know that of thousands which they know not: and forget that before 1640 there were few but conformists to convert them in the land, and that all the Westminster Assembly, save eight, were such.† And that the parliament kept near 7,000 in the ministry that all conformed on Aug. 24, 1662.²</p></blockquote>

<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 9</cite>, pp. 46-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>‘Yea but’ (say they) ‘our significant ceremonies were taken from idolaters and limbs of [the Roman] Antichrist who have abused them.’ Were this true, yet take the dross from the silver and make a vessel for the finer (Prov. 25:4); but it is false. Though they have had such as ours and have still, yet ours are our own and were never theirs in special. Fire and water are contrary, yet they agree in their kind: they are both elements. So ours are ceremonies and so are theirs, but otherwise they differ as fire and water; they scorn therefore ours and we deride theirs. We read of sacrifices offered to devils, yet some of this was sold in shambles and some the heathens made feasts of [such]. It was all the same flesh in kind, but not in use. The Christians did damnably if they went to it when it was sacrificed, yea and if they went to their idol feasts when they blessed an idol, it was idolatry; but if they bought part of that flesh in the shambles and ate it, or went to their private feasts when they ate of it (for aught they knew) without reference to the idol, then, says Paul, ‘Eat, making no question for conscience sake.’ So say we of our cross, surplice, kneeling: they were ordinances before idolaters abused them. If they take them and bless an idol with them, be it upon their own pates; but if we be invited to them in a better use (and not know, nor have just cause to suspect any lurking idolatry), why should we make so many needless questions about the use of them? Put [the] case, such as they are pertained to idolaters. So did Goliath’s sword, yet David laid it up in a holy place for better use. So did bowing belong to Baal, prostrating the whole body to idols, kissing to the calves, kissing the hand to the host of heaven, lifting up the eyes, stretching forth both hands, shouting for joy, sitting or lying along upon the ground or on a carpet to idols; yet all these we may use in the worship of the true God. So for our ceremonies, such as they are pertained to idolaters, but were not idolatrous of themselves. The cross was used as a sign of profession before idolatry prevailed. The white garment was ordained as a cover-sloven in the poverty of the Church; kneeling was used as an act of reverence before the breaden god was hatched. And may not we lawfully use them now, to show that we are in communion and fellowship with that blessed and persecuted Church, without such noises and schisms?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers... (London: Payne, 1639), sect. 15 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine.</cite>, pp. 207-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Circumstances are either such as follow actions as actions, or such as are arbitrarily superadded and adjoined by command unto actions, which do not of their own accord, nor naturally nor necessarily attend them. Now religious actions in the worship of God are actions still. Their religious relation does not destroy their natural being. Those circumstances then which do attend such actions as actions, not determined by divine institution may be ordered, disposed of, and regulated by the prudence of men. For instance, prayer is a part of God’s worship. Public prayer is so, as appointed by Him. This as it is an action to be performed by man cannot be done without the assignment of time, and place, and sundry other things, if order and conveniency be attended. These are circumstances that attend all actions of that nature to be performed by a community, whether they relate to the worship of God or no. These men may according as they see good regulate and change as there is occasion: I mean they may do so who are acknowledged to have power in such things. As the action cannot be without them, so their regulation is arbitrary if they come not under some divine disposition and order, as that of time in general does. There are also some things which some men call circumstances also, that no way belong of themselves to the actions whereof they are said to be the circumstances, nor do attend them, but are imposed on them, or annexed unto them, by the arbitrary authority of those who take upon them to give order and rules in such cases. Such is to pray before an image, or towards the East, or to use this or that form of prayer in such Gospel administrations and no other. These are not circumstances attending the nature of the thing itself, but are arbitrarily superadded to the things that they are appointed to accompany.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d46b7af116" data-kw="">
<blockquote><p>So that God’s decree is the cause of their necessity, contingency, spontaneity, and freedom. All these different qualities which are in second causes or effects, are derived from the will of God, who appointed them to be of that nature. It is He that fits necessary causes to necessary effects, and contingent ones to those that are contingent, and so on. Whatever comes to pass necessarily, so comes to pass by virtue of the divine decrees; and whatever happens contingently, and etc. so happens because of the same decree. The second causes do always retain their own particular nature and property, and their effects accordingly are necessary or causal, or proceed from mere sense or spontaneous motion, or from reason and will: but the first cause is immutable, and with respect to his foreknowledge and decree all effects and events are immutable, necessary, fix’d and stable, and cannot be otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Veritas Redux: Evangelical Truths Restored: Namely, Those Concerning God’s Eternal Decrees, The Liberty of Man’s Will, Grace &amp; Conversion, The Extent &amp; Efficacy of Christ’s Redemption, &amp; Perseverance in Grace</cite>, pp. 265-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>We ought to take care, on the other hand, lest, by proving that it is not the lack of members, senses, or faculties that accounts for man’s inability to act in a spiritual manner, we should set forth that weakness as something small, and that man may remove it by some endeavor of his own…</p></blockquote>

</figure><figure class="quote" id="q-2e40be86f2" data-kw="">
<blockquote><p>3. I easily acknowledge that grace gives such a power as is commonly called Moral, distinct from the natural faculties, as our corrupt estate contains an opposite impotency. But this is but an applying of the terms [‘can’] and [‘cannot’] [‘power’] and [‘impotency’] to dispositions and undisposedness, to habits and their privations. 4. A new heart and spirit, I easily confess necessary. But those words do commonly signify in Scripture, only new inclinations, dispositions, qualifications. It is a new heart, though only the old faculties and substance. I hope you will not follow Illyricus.¹ ¹ [Matthias Illyricus (1520–1575), a Lutheran reformer. Wiki says, “Affirming the natural inability of man, he adopted a position on sin as not being an accident of human nature, but involved in its substance, since The Fall of Man.”] 5. Where you say that [without faith a man can no more receive Christ, nor do ought towards it, than a dead man can walk or speak.], I Reply 1. That proves not faith to be equivalent to a potentia vel facultas [power or capacity], any otherwise than that it is of as absolute necessity, but not that it is of the same nature. If you show an illiterate man a Greek or Hebrew book, he can no more read in it then a dead man, that is, both are truly in sensu composito [in a combined sense] impossible: But yet it is but a habit that is wanting to one, and a power or faculty natural, to the other. And so it may truly be said that a sinner cannot do well that has accustomed to do evil, no more than a leopard can change his spots, or a blackmoore [a black person] his skin. Yet if you mean that such are equally distant from actual change as a dead man, it is but a dead comparison. A dead man wants both natural faculties, and an inclination or moral power. An unbeliever wants but one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reduction of a Digressor</cite>, (1654), p. 131</span></figcaption>

</figure><figure class="quote" id="q-a4c588ba16" data-kw="">
<blockquote><p>Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-hampton.html">Stephen Hampton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1. ‘Free Choice’ in ‘Sin, Grace &amp; Free Choice in Post-Reformation Reformed Theology’ in Lehner, Muller &amp; Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016), pp. 229-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

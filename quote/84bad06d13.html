<blockquote><p>Paul Stein, one of Landgrave Maurice’s chaplains at Kassel, made his debut as an irenicist when he published a sermon on Lutheran-Reformed unity which he had earlier delivered before the landgrave and Duke Frederick-Ulrich of Brunswick-Luneburg. He also authored a three-volume treatise entitled Evangelical Church Unity, printed in 1622/23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-stein.html">Paul Stein</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelischer Kirchen Briiderschaft</cite>, [Evangelical Church Unity], das ist: Ausfuhrlicher sonnenklarer Beweis, das beiderseits Evangelische im Grund der Seligkeit einig und ungeachtet deren zwischen ihnen noch schwebenden Streitigkeiten und Irrungen einander gar wohl mit gutem Gewissenfur Briider in Christo erkennen konnen, auch billig dafiir erkennen und halten sollen, vol. 1, 2, 3 (1622/1623)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

<blockquote><p>My design is to indicate how slowly the process ran out its course, by which a Lutheran and a Reformed Church arose in Germany in the sixteenth century… These [Lutheran and Reformed] reformations are then [popularly] thought of as like two circles, which merely touch each other; or, according to others, which really intersect, and have large segments in common, but which yetnever cover exactly the same space, or were drawn from one center… It is easy to refute this false opinion…</p></blockquote>

<blockquote><p>3. We do not in the least doubt to affirm that some of these are empty quibbles, and that in most of them the disagreement arises, not from a real dissent of the Churches themselves, but partly from the preposterous zeal of certain ministers indulging too much in their own affections and genius, partly from not observing the pattern (ὑποτυπώσιν) of sound words, partly from not correctly understanding the mutual opinions of the dissenting parties, partly from a different mode of explaining, when there is consent in the thing explained. So that it is probable, if the matters themselves are more diligently weighed by pious, learned, candid, and moderate men of both parties, either in a synod or otherwise in friendly conference, a not insignificant, nay, a very great hope (with divine favor) may rightly be conceived, that these controversies will be settled, and a perfect concord in matters of faith may be entered into.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Determinations, ‘The Reformed Churches do not Dissent in the Fundamentals of the Faith’ in Works of Samuel Ward</cite>, pp. 149-53 in Theological Determinations, ‘The Reformed Churches do not Dissent in the Fundamentals of the Faith’ in Works of Samuel Ward… ed. Seth Ward (d. 1643; Gallibrand, 1658), p. 150</span></figcaption>

<blockquote><p>§6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, (Edinburgh: Anderson, 1697), sect. 10, ‘Of Schism’ Rule was a Scottish, divine-right presbyterian minister., pp. 251-52</span></figcaption>

<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession, the former, known specifically as the Reformed, have always tried to reconcile with those of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups.

II. Although these latter ones [the Lutherans] have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues.

III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book “Northern Olive Branch,” and George Calixtus, professor of theology at the University of Helmstedt, in his book “Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

+George+Calixtus%2C+professor+of+theology+at+the+University+of+Helmstedt%2C+in+his+book+%E2%80%9CJudgment+on+Theological+Controversies+between+the+Reformed+and+Lutherans.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+%E2%80%98Whether+from+the+proposed+Reformed+and+Lutheran+union%2C+union+with+the+Roman+Church+follows%E2%80%99+in+Theological+Theses+Published+at+Various+Times+in+the+Academy+of+Sedan+3rd%2C+ed.+tr.+by+AI+by+Colloquia+Scholastica+%281675%3B+London%2C+1683%29%2C+pp.+950-57+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf725b8991.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af725b8991.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-lutheranism/#:~:text=I.%20Since%20a%20division%20arose%20among,Controversies%20between%20the%20Reformed%20and%20Lutherans&amp;text=I.%20Since%20a%20division%20arose%20among%20Protestants%20regarding&amp;text=on%20Theological%20Controversies%20between%20the%20Reformed%20and%20Lutherans" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-ac1eb270d2" data-kw="">
<blockquote><p>1. Observe, It’s a good thing to be studying the Scripture: it’s a mark of the blessed man, Psal. 1. It makes the man of God wise to salvation; and it’s good that those who want the use of reading themselves, make up that want by hearing others: and particularly, it is good to be reading, and hearing this Book read; those that are fitted for reading, let them use it well; and those that have not this benefit, let them take and improve other opportunities that may bring them to the knowledge of Christ’s mind; and the more, that blessedness is given but to six or seven sores in this Book, and twice or thrice over, to those that study it, Rev. 22.7, 14.

2. Observe, That it’s not enough to be given to reading and hearing of the Word: neither would folks rest on it; but join practise with both, Luk. 11.28. Blessed are they that hear the Word of God, and keep it. It is not the reader, or hearer, but the doer, that is the blessed man. Yea, though ye were able to open and unfold all the Mysteries that are in this Book, if ye be not suitable and conform thereto in your practice, ye are but like that man spoken of, Jam. 1.23, 24. who, beholding his natural face in a glass, goeth his way, and forgetteth what manner of man he was. He that is a hearer, and not a doer, deceives his own soul: as much hearing and reading doth you good, as is improven in practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Book of the Revelation</cite>, (1658; Willow Street PA: Old Paths Publications, 2000), p. 4.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee65977391" data-kw="">
<blockquote><p>To the proposition, ‘What things are done for the glory of God,’ to wit, of themselves; that is, such things as are commanded by God to this special end and purpose, that by those works we might declare our obedience towards Him: they are the worship of God. And not such [things] as serve for the glory of God accidentally, that is, such as do sometimes serve for the performance of those things which are commanded by God for accidental causes and circumstances, which if they concur not, yet God may be honored as well by such as omit them as by those that perform them, so they be omitted or performed of faith, which causes the person to be reconciled unto God and makes the doing or omission of all indifferent actions to agree and stand with the Will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, pp. 74-75 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-01615fa0d0" data-kw="">
<blockquote><p>…it is a great consideration also: I know that Jesus Christ has given his people light in matters of this nature by degrees. Thousands of good souls that have been bred up and born in our assemblies, and enjoy the ordinances of God, and have done it comfortably, cannot suddenly take in other principles, you must wait upon Christ to do it. In this case, men are not to be wrought off by falsehoods [in exaggerations and extreme speaking and positions], God has no need of them. No, rather till men do take in light, you should give them all that is comfortable in the condition they are in; we should acknowledge every good thing in every man, in every church, in every thing, and that is a way to work upon men, and to prevail with them; as it is Philemon, verse 6: ‘That the communication of thy faith may become effectual by the acknowledgment of every good thing, which is in you in Christ Jesus.’ It is that which builds men up, by acknowledgment of every good thing that is in them.</p></blockquote>

<blockquote><p>I ASK for a few minutes of the reader’s time, while I reason with him concerning one of the laws of the world in which he lives. That law is found in Exodus, chapter 20, and reads thus: “Remember the Sabbath-day to keep it holy. Six days shalt thou labour, and do all thy work; but the seventh day is the Sabbath of the Lord thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy man-servant, nor thy maidservant, nor thy cattle, nor thy stranger that is within thy gates: for in six days the Lord made heaven and earth, the sea and all that in them is, and rested the seventh day: wherefore the Lord blessed the Sabbath-day, and hallowed it.”

Here is a law claiming to regulate a seventh portion of human life. If a man lives twenty-one years, this law claims the entire control of three of them; if he lives fifty years, it disposes of more than seven of them. It is therefore important. But it also devotes this portion of time to religious purposes; and these are the highest ends of life. All other time is secular. This is holy. That may be occupied with things which perish in the using. This must be given to things which take hold on eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), p. 1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>4. For your ‘Amen’, as I am certain, that the Apostle’s words may be understood of a consentient, though silent, ‘Amen’; so it is evident that even in the point of order, your so frequently repeated ‘Amen’ is superfluous and vain: but if you will reduce your practice to a decent use, seeing the matter appears to be indifferent, if you love to express it, use your liberty, only permit us the like favor of ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, (1671), p. 287. Against the English Liturgy’s over use of a congregational ‘Amen’:</span></figcaption>

<main class="wrap"><figure class="quote" id="q-14938ce19a" data-kw="">
<blockquote><p>Verse 17, ‘And be ye separate’. For gross idolatry and for fundamental errors only must we separate. Corruptions grew so great in the Church of Rome that it justly occasioned first the separation of the Greek Churches from the Latin, and then of the Reformed Churches from the Roman.</p></blockquote>

</figure><figure class="quote" id="q-bee4d8906f" data-kw="">
<blockquote><p>Those, though otherwise never so godly, that separate from true Churches, like Novatus and Lucifer, for a stricter course of discipline; like Donatus for some bad ones in the Church, as they supposed; like Andius for some lesser corruptions and abuses, they be schismatics. This is the judgment of ancient Churches, for which see at large, Mornay, On the Church, p. 35. But our late Separatists do divide themselves from us upon like grounds: for a more strict discipline with Novatus and Lucifer; for that good and bad are mixed together, with Donatus; and from lesser corruptions among us with Andius. Therefore are these also schismatics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical</cite>, ... (London: 1610) | 2nd Likelihood, p. 48</span></figcaption>

</figure><figure class="quote" id="q-6cd5f142fb" data-kw="">
<blockquote><p>Yea, and although difference in judgment about smaller matters ought not to cause that alienation of affection, and strangeness either among ministers or people, as with many it does; to the great hindrance of the growth of the Gospel; yet towards such as oppose themselves against the truth in main and fundamental articles thereof, Christians are bound to show themselves strange, to shun all voluntary and unnecessary familiarity with them, to show them no countenance. If we shall receive such into our houses, or bid them Godspeed, we make ourselves partakers of their sins, 2 Jn. 10-11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 152 Lectures upon Psalm 51… (London: 1635), Lecture 48, on Ps. 51:4 (1626), p. 243</span></figcaption>

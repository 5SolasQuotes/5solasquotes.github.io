<main class="wrap"><figure class="quote" id="q-a0b36048de" data-kw="">
<blockquote><p>According to their Lord’s mind and commandment, and the direction of the Holy Ghost, which always assisted them in their ministerial office, the apostles, in all the Christian churches which they planted, ordained that the Christians should keep the holy Sabbath upon that seventh day, which is the first day of the week: “Concerning the gathering for the saints, as I have ordained in the churches of Galatia, so do ye also. Every first day of the week,” &amp;c. (1 Cor. xvi. 1, 2.) “When ye come together in the church (being the Lord’s day) to eat the Lord’s Supper, to remember and shew the Lord’s death till he come,” &amp;c. (1 Cor. xi. 20, 25, 26.) In which words note—

(1.) That the apostle ordained this day to be kept holy: therefore a divine institution.

(2.) That the day is named the first day of the week: therefore not the Jewish seventh, or any other.

(3.) Every first day of the week, which shews a perpetuity.

(4.) That it was ordained in the churches of Galatia, as well as of Corinth, and he settled one uniform order in all the churches of the saints: therefore it was universal.

(5.) That the exercises of this day were collections for the poor (which appears by Acts ii. 42, and Justin Martyr’s testimony, Apolog. ii.), which were gathered in the holy assembly after prayer, preaching of the word, and administration of the sacraments: therefore it was spiritual.

(6.) That he will have the collection, though necessary, removed against his coming; lest it should hinder his preaching; but not their holy meeting on the Lord’s day, for it was the time ordained for the public worship of the Lord, which argues a necessity.

And in the same Epistle St. Paul protests, that he delivered them none other ordinance or doctrine but what he hath received of the Lord (1 Cor. xi. 23.) Insomuch that he charges them, that “if any man think himself to be a prophet, or spiritual, let him acknowledge that the things that I write unto you are the commandments of the Lord.” (1 Cor. xiv. 37.)

But he wrote unto them, and ordained among them to keep their Sabbath on the first day of the week: therefore to keep the Sabbath on that day is the very commandment of the Lord; and how can he be either a true prophet, or have any grace of God’s Spirit in his heart, who, seeing so clearly the Lord’s day to have been instituted and ordained by the apostles, will not acknowledge the keeping holy of the Lord’s day to be a commandment of the Lord?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 166-68.</span></figcaption>

<blockquote><p>Dr. Thornwell exhibited through life one mark of extravagance, in always having the best of everything in its kind. Indeed, it was his doctrine that the best was always the cheapest. He always concurred with [Thomas] Carlyle in his denunciation of “the cheap and nasty;” which, like Carlyle, he pushed in many directions, and made it the measure of men and principles, as well as of things. Still, it was with him very much a matter of taste. He always bought the best editions of books; wore clothing of the finest texture; was fond of fine horses; and smoked always the best brands.

To illustrate his epicurianism [sic] as to the last named, the writer once offered him a cigar, such as he was himself smoking at the time, and as good in quality as he felt he could afford. After drawing two or three whiffs, it was pitched impatiently through the window, with the exclamation, “Any man who will smoke such cigars will steal!” The anecdote will be excused its want of dignity, if it shows the freedom and dash of his raillery towards those whom he loved.</p></blockquote>

<blockquote><p>And what pitiful arguments have they to prove this charge of idolatry: ‘False worship of the true God is idolatry as well as worshipping a false God: But such is the [Anglican] Liturgy: therefore—’ This is all that these rash preachers must trouble the Church and seduce men into a hating factious zeal with. But what mean these men by ‘false worship’? Do they mean worship contrary to God’s Word? That is, which is sinful? And do they mean all such sinful worship or some only? If they mean all such sinful worship, then these words of theirs are idolatry: for they are part of their preaching, which is part of God’s worship, in their own sense: And it is false doctrine and tends to men’s perdition. And so they and all false teachers should be idolaters. By this they would turn all sins in worship into one: It is all idolatry. Is not every confused prayer sinful which has unmeet expressions and disordered, and has wandering thoughts and dull affections? Is there any of these love-killers that dare say they pray without sin? And must we not separate from them then as idolaters? Yea and every man from himself; that is, he must give over praying because it’s all idolatry? But perhaps they will say: ‘This sin is but in the manner and not in the matter.’ Answer: Very good; it seems then that sin in the manner of worship is not idolatry… Will you find some words which you can call false in the matter? Suppose it were so? When an Antinomian, an Anabaptist, a Separatist or anyone that errs does drop some of his errors in his prayers (as I think none will deny that they use to do), must we needs believe that his prayer is idolatry therefore, as being false worship? And is it unlawful to join with such? Then we shall have more separation than you yet plead for or practice yourselves. No two men in the world must join together if all sinful worship, or worship false sometime in the very matter does necessitate a separation… … But what text of Scripture is it that ever told these men that all false worship is idolatry? what text do they name but such as if they did it on purpose to show their boldness in adding to God’s Word? The Second Commandment is the chief which they insist on. But whatever expositions they may forge, there is no such word, nor sense in the Commandment. We all hold that as the gross, direct idolatry is the worshipping of a false God, against the First Commandment; so to make any such false representation of the true God, by words or deeds, as makes Him like an idol, and contradicts his nature, and so to worship Him, this is also a secondary kind of idolatry: Because God is none such as they represent Him, and therefore it is not God indeed but an idol which they worship. And because God is not like to anything corporeal in heaven or earth, therefore he that makes an image of any thing in heaven or earth as like to God, or to represent Him, he makes an idol of God by blasphemy. ‘To what will you liken Me, that I should be like unto it, saith the Holy One?’ This is the idolatry forbidden in the Second Commandment: It is not all false worship, but one sort of false worship, which is idolatry: what else that Commandment forbids is neither called idolatry, nor can so be proved. It is an odious sound, to hear an ignorant, rash, self-conceited person, especially a preacher, to cry out, ‘Idolatry, Idolatry,’ against his brethren’s prayers to God because they have something in them to be amended, while perhaps his own prayers have so much false doctrine in them or false fire of carnal passions and uncharitableness, as makes it a much harder question whether it be lawful to join with such as he is, while he abhors so much to join with others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 33, p. 190-93</span></figcaption>

— Richard Baxter, The Cure of Church Divisions, (London: Symmons, 1670), pt. 1 | Direction 33, p. 190-93">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+what+pitiful+arguments+have+they+to+prove+this+charge+of+idolatry%3A+%E2%80%98False+worship+of+the+true+God+is+idolatry+as+well+as+worshipping+a+false+God%3A+But+such+is+the+%5BAnglican%5D+Liturgy%3A+therefore%E2%80%94%E2%80%99+This+is+all+that+these+rash+preachers+must+trouble+the+Church+and+seduce+men+into+a+hating+factious+zeal+with.+But+what+mean+these+men+by+%E2%80%98false+worship%E2%80%99%3F+Do+they+mean+worship+contrary+to+God%E2%80%99s+Word%3F+That+is%2C+which+is+sinful%3F+And+do+they+mean+all+such+sinful+worship+or+some+only%3F+If+they+mean+all+such+sinful+worship%2C+then+these+words+of+theirs+are+idolatry%3A+for+they+are+part+of+their+preaching%2C+which+is+part+of+God%E2%80%99s+worship%2C+in+their+own+sense%3A+And+it+is+false+doctrine+and+tends+to+men%E2%80%99s+perdition.+And+so+they+and+all+false+teachers+should+be+idolaters.+By+this+they+would+turn+all+sins+in+worship+into+one%3A+It+is+all+idolatry.+Is+not+every+confused+prayer+sinful+which+has+unmeet+expressions+and+disordered%2C+and+has+wandering+thoughts+and+dull+affections%3F+Is+there+any+of+these+love-killers+that+dare+say+they+pray+without+sin%3F+And+must+we+not+separate+from+them+then+as+idolaters%3F+Yea+and+every+man+from+himself%3B+that+is%2C+he+must+give+over+praying+because+it%E2%80%99s+all+idolatry%3F+But+perhaps+they+will+say%3A+%E2%80%98This+sin+is+but+in+the+manner+and+not+in+the+matter.%E2%80%99+Answer%3A+Very+good%3B+it+seems+then+that+sin+in+the+manner+of+worship+is+not+idolatry%E2%80%A6+Will+you+find+some+words+which+you+can+call+false+in+the+matter%3F+Suppose+it+were+so%3F+When+an+Antinomian%2C+an+Anabaptist%2C+a+Separatist+or+anyone+that+errs+does+drop+some+of+his+errors+in+his+prayers+%28as+I+think+none+will+deny+that+they+use+to+do%29%2C+must+we+needs+believe+that+his+prayer+is+idolatry+therefore%2C+as+being+false+worship%3F+And+is+it+unlawful+to+join+with+such%3F+Then+we+shall+have+more+separation+than+you+yet+plead+for+or+practice+yourselves.+No+two+men+in+the+world+must+join+together+if+all+sinful+worship%2C+or+worship+false+sometime+in+the+very+matter+does+necessitate+a+separation%E2%80%A6+%E2%80%A6+But+what+text+of+Scripture+is+it+that+ever+told+these+men+that+all+false+worship+is+idolatry%3F+what+text+do+they+name+but+such+as+if+they+did+it+on+purpose+to+show+their+boldness+in+adding+to+God%E2%80%99s+Word%3F+The+Second+Commandment+is+the+chief+which+they+insist+on.+But+whatever+expositions+they+may+forge%2C+there+is+no+such+word%2C+nor+sense+in+the+Commandment.+We+all+hold+that+as+the+gross%2C+direct+idolatry+is+the+worshipping+of+a+false+God%2C+against+the+First+Commandment%3B+so+to+make+any+such+false+representation+of+the+true+God%2C+by+words+or+deeds%2C+as+makes+Him+like+an+idol%2C+and+contradicts+his+nature%2C+and+so+to+worship+Him%2C+this+is+also+a+secondary+kind+of+idolatry%3A+Because+God+is+none+such+as+they+represent+Him%2C+and+therefore+it+is+not+God+indeed+but+an+idol+which+they+worship.+And+because+God+is+not+like+to+anything+corporeal+in+heaven+or+earth%2C+therefore+he+that+makes+an+image+of+any+thing+in+heaven+or+earth+as+like+to+God%2C+or+to+represent+Him%2C+he+makes+an+idol+of+God+by+blasphemy.+%E2%80%98To+what+will+you+liken+Me%2C+that+I+should+be+like+unto+it%2C+saith+the+Holy+One%3F%E2%80%99+This+is+the+idolatry+forbidden+in+the+Second+Commandment%3A+It+is+not+all+false+worship%2C+but+one+sort+of+false+worship%2C+which+is+idolatry%3A+what+else+that+Commandment+forbids+is+neither+called+idolatry%2C+nor+can+so+be+proved.+It+is+an+odious+sound%2C+to+hear+an+ignorant%2C+rash%2C+self-conceited+person%2C+especially+a+preacher%2C+to+cry+out%2C+%E2%80%98Idolatry%2C+Idolatry%2C%E2%80%99+against+his+brethren%E2%80%99s+prayers+to+God+because+they+have+something+in+them+to+be+amended%2C+while+perhaps+his+own+prayers+have+so+much+false+doctrine+in+ <blockquote><p>Step Five: Analysis Becomes Myth At this stage, the explanation stops needing actual proof. Not because the evidence is overwhelming, but because the story has become self-sustaining. It can explain everything if you just try hard enough. … The belief now no longer functions as an explanation of reality, instead it’s a closed or “self-sealing” system. It can’t be tested, corrected, or falsified. And most importantly, it can’t be escaped without significant psychological cost. It’s a bit like a prison. Because at this point, abandoning it would mean admitting that the soothing clarity you felt was an illusion. This allows anxiety back in the front door, often holding hands with public humiliation. For many “disaffected” and isolated young men, this is an intolerable duo to entertain. But once a belief can’t be falsified, it’s no longer analysis. It’s a mythology. And mythology has a dangerous advantage: it feels deeper than facts, like a soul-level insight. You’ve finally seen behind the curtain to where the puppet masters pull the strings. You don’t have to guess or speculate, you know. … Step Six: Myth Becomes Moral Signal This is when conspiracy thinking stops being a private explanation held by an individual, and instead becomes a public signal to others. You can hear it in the language: … ”If you don’t see it, you’re asleep.” ”Once you see it, you can’t unsee it.</p></blockquote>

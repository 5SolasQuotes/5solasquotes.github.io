<blockquote><p>…seeing therefore there is such variety of God’s ordinances, such convenient time of rest and refreshing between the forenoon and afternoon [public] exercise, and due and timely finishing of the afternoon exercise, what but wearines does keep men from it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-angier.html">John Angier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Help to better Hearts for better Times endeavoured in Several Sermons</cite>, … (London: Meredith, 1647), ch. 4, pp. 373-74</span></figcaption>

<blockquote><p>Direction 13. Remember that whatever duty you seem obliged to perform, the obligation still supposes that it is not naturally impossible to you, and therefore you are bound to do it as well as you can. And when other men’s force or your natural disability hinders you from doing it as you would, you are not therefore disobliged from doing it at all: but the total omission is worse than the defective performance of it, as the defective performance is worse than doing it more perfectly.ª And in such a case the defects which are utterly involuntary are none of yours imputatively at all, but his that hinders you (unless as some other sin might cause that). ª See Mr. Truman’s book of Natural and Moral Imptency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (1673; SDG, 2008), pt. 3, ch. 2, p. 558</span></figcaption>

<blockquote><p>This position has been also handled and proved abundantly by others, chiefly by Mr. Cawdrey and Mr. Pynchon, whose arguments I judge unanswerable. ‘Tis to me an unquestionable conclusion that the Sabbath, being a natural day consisting of 24 hours, it must begin and end as the natural day itself does.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-warren.html">Edmund Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Position 6, ‘That the Sabbath Begins in the Morning’ in The Jew’s Sabbath Antiquated &amp; the Lord’s Day Instituted by Divine Authority</cite>, ... (London: Maxwel, 1659), pp. 242-45, p. 242</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-375ecdb9c1" data-kw="">
<blockquote><p>6. Works of comliness, tending to honest or decent walking… By all which believers have allowance: 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord has not straightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will he have their consciences to be fettered with inextricable scruples: He leaveth it to men on other days how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but [that] men would look: 1. to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments</cite>, ... (Glasgow, 1676), 4th Commandment, p. 171</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-8d5fdcb5fd" data-kw="">
<blockquote><p>…we conceive therefore these to be permitted. 1. All duties of piety, as was sacrificing under the Old Testament, or preaching, hearing or going about the sacraments under the New Testament: In which sense, Mt. 12, our Lord says the priests profaned the Sabbath and were blameless, not that formally they prophaned the Sabbath, or did indeed break that command, but materially they wrought in killing beasts, etc. which had been unlawful, had it not been in the exercises of piety. 2. All things that have a tendency, as necessary helps and means to the performance of the former works of piety, are lawful, as going to the congregation to hear the Law, calling the assembly for worship by trumpets, or bells, or by a voice, journeying, going or riding to Church, etc. because the duties of the Sabbath cannot well be done without some of these, nor at all without others of them. If it should be asked here, what that, which is called a Sabbaths day journey, Acts 1:12, was among the Jews? and whence it came, and what way may it be stinted or limited among Christians? Answer: It was to them 2000 cubits… It arose to be reckoned so from these grounds: 1. From their expounding Ex. 16:29, ‘Let none go out of his place;’ thus, Let none go without the bounds of the city, which with its suburbs was 2000 cubits, or a mile about. 2. That the Tabernacle of the congregation was so far from the tents of these who pitched about it in the wilderness, Num. 2, as they supposed; and that the priests kept that distance from the people in entering with the ark into Jordan, Josh. 3:4, whence they gathered that a man might still go to the ark or place of worship, as it was then in these cases at a distance from them, and no further on the Sabbath day. But we say whatever superstitiously or on custom they took up (for that is but their tradition) we cannot stint a Sabbath day’s journey to so many miles, fewer or more, but it must be as the man is in providence cast to reside further from, or nearer to the place where the ordinances are dispensed; for one may go many miles and not profane the Sabbath, if he cannot have the public ordinances nearer, whereas another may break the Sabbath by going but to his neighbor’s door, yea by walking in his own house, or to his door, if either it be done idly, or with respect to another civil or worldly end, which agrees not to that day; it is not here remoteness or nearness, but what sways us, and what is our end, that we are to try by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments</cite>, … (d. 1658; London: 1675), 4th Commandment, Sanctification of the Sabbath, p. 277</span></figcaption>

+it+was+then+in+these+cases+at+a+distance+from+them%2C+and+no+further+on+the+Sabbath+day.+But+we+say+whatever+superstitiously+or+on+custom+they+took+up+%28for+that+is+but+their+tradition%29+we+cannot+stint+a+Sabbath+day%E2%80%99s+journey+to+so+many+miles%2C+fewer+or+more%2C+but+it+must+be+as+the+man+is+in+providence+cast+to+reside+further+from%2C+or+nearer+to+the+place+where+the+ordinances+are+dispensed%3B+for+one+may+go+many+miles+and+not+profane+the+Sabbath%2C+if+he+cannot+have+the+public+ordinances+nearer%2C+whereas+another+may+break+the+Sabbath+by+going+but+to+his+neighbor%E2%80%99s+door%2C+yea+by+walking+in+his+own+house%2C+or+to+his+door%2C+if+either+it+be+done+idly%2C+or+with+respect+to+another+civil+or+worldly+end%2C+which+agrees+not+to+that+day%3B+it+is+not+here+remoteness+or+nearness%2C+but+what+sways+us%2C+and+what+is+our+end%2C+that+we+are+to+try+by.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+A+Practical+Exposition+of+the+Ten+Commandments%E2%80%A6+%28d.+1658%3B+London%3A+1675%29%2C+4th+Commandment%2C+Sanctification+of+the+Sabbath%2C+p.+277&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8d5fdcb5fd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8d5fdcb5fd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=we%20conceive%20therefore%20these%20to%20be,that%20we%20are%20to%20try%20by&amp;text=we%20conceive%20therefore%20these%20to%20be%20permitted.%201&amp;text=our%20end%2C%20that%20we%20are%20to%20try%20by" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-3c3edaba07" data-kw="">
<blockquote><p>Both can be explained in one word. The covenant made with all the patriarchs is so much like ours in substance and reality that the two are actually one and the same. Yet they differ in the mode of dispensation. But because no one can gain a clear understanding from such a short statement, a fuller explanation is required if we wish to make any progress. Now, in showing their similarity—or rather, unity—it would be superfluous to examine afresh the details that have already been reviewed; and it would be inappropriate here to mingle matters to be discussed elsewhere. Here we must take our stand on three main points. First, we hold that carnal prosperity and happiness did not constitute the goal set before the Jews to which they were to aspire. Rather, they were adopted into the hope of immortality; and assurance of this adoption was certified to them by oracles, by the law, and by the prophets. Secondly, the covenant by which they were bound to the Lord was supported, not by their own merits, but solely by the mercy of the God who called them. Thirdly, they had and knew Christ as Mediator, through whom they were joined to God and were to share in his promises. The second of these, because perhaps we do not yet sufficiently understand it, will be explained at length in its place. For by numerous clear testimonies of the prophets we shall confirm the truth that all those blessings which the Lord has ever given or promised to his people arose solely out of his goodness and kindness. Here and there we have also given clear proofs of the third point; and we have not left even the first point untouched.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles, vol. 1, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 2.10.2.</span></figcaption>

<blockquote><p>First, What is this love of God in Christ? Here I take it actively for the love wherewith He loves us. Love may be considered: First, as an attribute or a perfection in God; so it is said, 1 John 4:8, ‘God is love.’ Which notes his readiness, self-propension or inclination to do good. Secondly, as it relates and passes out to the creature; so there is a common love and a special love. His common love is set forth: Ps. 145:9, ‘The Lord is good to all, and his tender mercies are over all his works.’…</p></blockquote>

</figure><figure class="quote" id="q-9e96acf3b2" data-kw="">
<blockquote><p>‘And it shall come to pass, that as the Lord rejoiced over you.’ The wonderful and inestimable love of God towards his people is here set forth, via, that He had rejoiced in heaping blessings upon them; wherefore their depravity was all the more base and intolerable, in that God, though voluntarily disposed to be bountiful, was obliged by it to lay aside His affection for them. But although it is only by a metaphor that God is said to rejoice in destroying the wicked, yet it is not without good reason that this expression is applied to Him; that we may know that He can no more fail to be the defender of His Law, and the Avenger of its contempt, than deny Himself. He complains, indeed, by Isaiah, (Isa. 10:24) that He is unwillingly forced to punish the Jews; but these two things are quite consistent, that He rejoices in His just judgment and at the same time is mindful of His clemency and indulgence, so that He would rather pardon, if the wickedness of men would allow Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 28, verse 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-8710ddaec7" data-kw="">
<blockquote><p>When you feel doubts about being God’s child because you have not shown God that obedience that you owe to him, know that the devil is very near you. He will attempt to falsify the gospel by convincing you that you must be saved by your works. Or he will attempt to seduce you to blaspheme the Lord Jesus by causing you to think that you can be or deserve to be your own savior, at least in part. Respond to this temptation by saying that you are a poor sinner, that Jesus Christ has come to save sinners, and that there is salvation only in him.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-67d3f536c8" data-kw="">
<blockquote><p>Some of the interpreters refer these words [1 Cor. 11:16] to the question in hand, and think that the apostle is here opposing the custom of the Churches to these that contended for men covering their heads in public meetings: but the better sort take this to be spoken against the study of contention, and think the apostle his meaning here is only to show that it is not his fashion, nor the fashion of the Churches of God, to be contentious for matters of such indifferency as those were of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-lindsay.html">David Lindsay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ceremonies of the Church… (London, 1625), p. 23 Lindsay was a prominent bishop and defender of the Articles of Perth (1618).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee80ccc32f" data-kw="">
<blockquote><p>Plato (5th-4th cent. B.C.), describing the parts of the human body, wrote of ‘the head which is the most divine part and which reigns (δεσποτέω) over all the parts within us’ (Timaeus 44.D). Plutarch (A.D. 46-120), one of the most prominent Greek authors from the New Testament period (and one who reflected secular thinking independent of Jewish or Christian influence), explained why the words soul (ψυχη) and head (κεφαλή) can be used to speak of the whole person: ‘We affectionately call a person ‘soul’ or ‘head’ from his ruling parts…’ (Table-Talk 692.D.11). Philo (Jewish philosopher, c. 30 B.C.—c. A.D. 45), representing one aspect of first century Judaism, had a similar understanding: ‘As the head in the living body is the ruling place… so Ptolemy became head among kings’ (Life of Moses 2.30). ‘The mind is the head and ruler… of the sense-perception in us’ (Life of Moses 2.82); ‘’Head’ we interpret allegorically to be the ruling… mind of the soul’ (On Dreams 2.207).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59</cite>, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>What command have they [Owen &amp; Baxter, etc.] for… the ministers preaching with their hats off, and the people’s hearing with their hats on?… (for religious institutions must not vary with the custom of the countries).</p></blockquote>

</figure><figure class="quote" id="q-6970d673bb" data-kw="">
<blockquote><p>To cover or uncover the head in these places in the time of divine service is a ceremony; and therefore if the observation or non-observation of ceremonies be a superstition, he that uncovers not his head may be as superstitious as he who is bare-headed… …the other looks upon those plain words of the apostle, ‘Every man praying or prophesying, having his head covered, dishonours his head:’ and thinks he is obliged to it, as indeed he is, till the meaning of the text be otherwise cleared to him. The question then ought to be this, whether a man ought to be covered in the service of God? If uncovered, why do you jear at our bare-heads? If covered, why do you [Independents] not keep your own rule, but sit covered at one part of service, and uncovered at another? covered when a chapter is read and expounded; covered all the time of sermon… and yet uncovered again, at the singing of a psalm, at your extemporary prayers before and after sermon, at the administration of the sacraments. Tell me what privilege you have to dispense with this ceremony in one part of divine service more than another; Let it then be but considered who it is that speaks from heaven unto us, that in voce hominis tuba Dei, that it is God that speaks by man’s mouth, that the message is his, and man only the ambassador to deliver it; and then I think no man deserves a scoff that hears it with a bare head. When some of your party [of the Independents] were pressed with this argument, at last they came to this result that there was a necessity for all men to keep on their hats all the time of divine actions, more particularly at the time of the celebration of the sacrament. For this act was a right significant to the communicants of their table-honor and fellowship with Christ; also, that the minister at the celebration must be uncovered, and that in sign of his service to the communicants as the Lord’s much honored children, sitting covered when they eat of their father’s meat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-nicholson.html">William Nicholson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Discipline of the Ancient Church: intended especially for that of our Mother, the Church of England: in Answer to the Admonitory Letter lately published (London, 1659), 3rd Part, section 6</cite>, pp. 187-8</span></figcaption>

</figure><figure class="quote" id="q-fdb471fcca" data-kw="">
<blockquote><p>Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-richardson.html">John Richardson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Choice Observations &amp; Explanations upon the Old Testament… which are Additionals to the Large Annotations made by some of the Assembly of Divines… (d. 1654; London, 1655), on Lamentations, p. 425 Richardson (1580-1654) was an English bishop of the Church of Ireland.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.”

— John Richardson, Choice Observations &amp; Explanations upon the Old Testament… which are Additionals to the Large Annotations made by some of the Assembly of Divines… (d. 1654; London, 1655), on Lamentations, p. 425 Richardson (1580-1654) was an English bishop of the Church of Ireland.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMany+signs+of+lamentations+are+expressed+here.+Which+from+hence+and+other+Scriptures+may+more+fully+be+gathered+thus%3A+Sighing%2C+mourning%2C+mournful+songs%2C+weeping%2C+howling%2C+fasting%2C+changing+of+the+garments%2C+mourning+women%2C+Jer.+9%3A17%3B+2+Chron.+35%3A25%3B+Amos+5%3A16%2C+rending+of+the+clothes%2C+wearing+black+and+sackcloth%2C+sitting+on+the+ground+and+keeping+silence%2C+lying+prostrate+upon+the+ground%2C+sitting%2C+lying%2C+covering%2C+rolling%2C+wallowing+in+ashes%2C+in+dust+and+ashes%2C+casting+up+dust%2C+ashes%2C+earth+upon+them+and+their+heads%2C+spreading+and+wringing+the+hands%2C+laying+the+hands+upon+the+head%2C+smiting+with+the+hand%2C+stamping+with+the+feet%2C+hanging+down+the+head%2C+uncovering+the+head+and+bare%2C+and+again+in+some+ages%2C+the+covering+the+head%2C+covering+head+and+face+too%2C+as+our+close+mourners%2C+covering+the+upper+lip%2C+bare-foot%2C+shaving+the+head+and+beard%2C+making+baldness%2C+plucking+off+the+hair%2C+beating+the+breast%2C+printing+marks+upon+the+flesh%2C+tearing+it%2C+cutting+it.%E2%80%9D%0A%0A%E2%80%94+John+Richardson%2C+Choice+Observations+%26+Explanations+upon+the+Old+Testament%E2%80%A6+which+are+Additionals+to+the+Large+Annotations+made+by+some+of+the+Assembly+of+Divines%E2%80%A6+%28d.+1654%3B+London%2C+1655%29%2C+on+Lamentations%2C+p.+425+Richardson+%281580-1654%29+was+an+English+bishop+of+the+Church+of+Ireland.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffdb471fcca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fdb471fcca.html">Permalink</a><a class="src" href="https://reformedbook

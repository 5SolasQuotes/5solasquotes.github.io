<main class="wrap"><figure class="quote" id="q-d7af0bea8a" data-kw="">
<blockquote><p>Here Owen appears to waver. On the one hand he allows that punishments may vary provided that the end of satisfying justice is met. On the other hand he seems to make an exception of the atonement, arguing or rather implying that there could not be another mode of satisfaction for sin than atonement by the God-man, the surety who has substituted himself in the room of sinners. Yet he seems to allow the possibility (though one that we are not in a position to know about) that the manner, time etc. of punishment belongs entirely to God, whose counsel we do not know. Which raises the question of why, if punishments in general, in respect of their nature and circumstances, are in the hand of God, why the punishment for sin may not similarly be. And if it may similarly be, even if we have not a clue about what an alternative mode of punishment may be in this case, then the atonement by Christ is not necessary in even the restricted sense that Owen has argued for earlier.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-helm.html">Paul Helm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analysis 13 – Owen’s Option’</cite>, (2008) 17 paragrpahs at Helm’s Deep</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

<blockquote><p>XXI. However, it is not possible for God to grant grace without a satisfaction corresponding to justice. For since He has given a law to man, denounced penalties for transgressors, and appointed judgment—and since He is, by nature, a judge—it cannot happen that in judging, He would act against the office of a just judge. But it would violate justice to justify and release the guilty without satisfaction, even if the guilty party repented. … XXVIII. From all this it is understood that there is no remission of sins without satisfaction, and no satisfaction except that which Christ, God manifested in the flesh, has perfectly rendered for us—being made sin and a curse for us (2 Cor. 5:21; Gal. 3:13), and then justified by the Father through His resurrection and glorification, receiving thereby the full acquittal (or apoche).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, (1634), pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-06ffb72494" data-kw="">
<blockquote><p>…Socinus in the very entrance into his Treatise of Christ the Saviour affirms that God might if He had pleased, without breach of his justice, have pardoned man’s sin freely, without any satisfaction required: and the same he after again presses and prosecutes in his ensuing discourses. Whether this be an error or no, I stand not now to discuss. Vorstius herein concurred with Socinus; and is for the same reproved by Tossanus; Grotius likewise for affirming the same is taxed by Ravenspergerus; defended by Vossius, who cites divines not a few, both old and new, saying the same: And it is maintained to pass by all others, by Calvin, Musculus, Zanchi, Grinaeus, Faius, Casman, Tilenus, Franzius, Smiglesius and our reverend Dr. Twisse; yet I am persuaded that no wise or discreet man at least will hence conclude any of these to be therefore Socinian heretics.</p></blockquote>

<blockquote><p>God, by his absolute power, could have saved man without a mediator: He is omnipotent, and could have done what He pleased.</p></blockquote>

</figure><figure class="quote" id="q-2c37b5eb0e" data-kw="">
<blockquote><p>§3. God’s actual continuance of forfeited life, liberty, health, and other comforts, and his actual collation of many great mercies by the course of Nature, to such as by sin have deserved present damnation, is a degree of signification of his pardoning will and mercy by these natural signs (which they were not before sin and forfeiture). §4. Man being after guilt of death, thus reprieved and enriched with manifold mercies, and his life and faculties continued with many instructing providential helps and means, the very Law of Nature now obliges him to love and thankfulness to God that shows him so great kindness. §5. And the same Law of Nature obliges him to take that God still for a God of love and mercy, and to believe, that what mercy He has already showed the world and us, is on terms which he knows to be very well consistent with his holiness, truth and justice: And it obliges us therefore to seek to Him for mercy, and to use all possible means for further hope and pardon and recovery, and not to sit down in despair. §6. The common sense of all mankind from Adam to this day, acquaints us by that experience, that these hopes and duties are found in the Law of lapsed Nature: For all the world that never heard the Gospel, do yet take God to be a merciful, forgiving God, and take themselves to be under some duty for the obtaining of further mercy, recovery and felicity. §7. Though want of the sense of sin, and its desert, and man’s misery may be thought by some to be the only cause of this, and so that it is but sinful presumption, and no part of Nature’s obligation; yet this upon trial will prove false (though what they allege be one part of the cause). For:

1. These men do acknowledge themselves sinners, and to deserve punishment from God.

2. They find some misery and fear more.

3. It is not presumption to judge God to be merciful, when they and all the world do find Him so.

4. It is not presumption to judge, that he can and will pardon sin, when full experience assures us, that He has already pardoned much. To remit the sin, is (as we now speak of it) to remit the deserved punishment. And He that gives man forfeited life, health, time, and all the abundant mercies which the world is full of, does thereby so far actually forgive sin: Says Christ, ‘Whether is it easier to say thy sins be forgiven thee, or to say arise, take up thy Bed and walk,’ that is, Executively to forgive them, which is the full forgiveness, by taking away the punishment.

5. It is no presumption to believe such duty to be incumbent on us, as the remaining Law of Nature does oblige us to.

6. Nor yet to take God’s own encouragements to seek our own recovery and felicity. §8. The Light and Law of lapsed Nature does convince men of the duty of repenting and returning to God, and oblige them to it. So that as perfect obedience was the duty of entire Nature, so repentance is the duty of lapsed Nature: And I think few will say that all men are not hereby obliged to repent, and that in hope of mercy. §9. Hence it is that it is found among the communes notitiae [common notions], and all the world as well as Christians acknowledge it and plead for it. §10. They that by God’s patience and mercy are invited to repentance, which is a return from sin to God, and are by Nature obliged to it, ought to believe that it is not made their duty in vain, nor shall they lose by it if they perform it; for that were to accuse God of making man’s duty in vain, or to his loss, which is not to be suspected. §11. Therefore they are bound not to despair of pardon and salvation; for an obligation to use means as tending to recovery, is inconsistent with an obligation to despair. Therefore hope of mercy and use of some means mankind is obliged to by the Law of lapsed Nature. §12. This is not the obligation of the Law or Covenant of Innocency; for that Law bound us only as innocent to keep our innocency and perfectly therein obey: But it gives no pardon, nor appoints man any duty in order to pardon and recovery: Whatever does this, is a Law of Grace. §13. The sum of that duty which the Law of Nature now obliges man to, is, to consider of all the mercies which God vouchsafes sinners, and thankfully to improve them; to repent of sin, and turn to this God, who shows Himself a merciful pardoning God; To resign themselves to Him as their Owner, to obey Him as their Ruler, and to love and seek Him as their ultimate end; and to believe that his mercy will not let us be losers in so doing, nor to do it in vain. §14. But the supernatural revelation tells us much more than all this, of the promised Seed, the means of our salvation, and of our duty in believing them, and of the certainty and nature of the pardon, deliverance, and blessedness which we shall attain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An End of Doctrinal Controversies</cite>, … (London: Salusbury, 1691), ch. 12, Of the Several Laws or Covenants of God, sect. 3, ‘Of the Law or Covenant of Grace in the First Edition’, pp. 127-30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

6. Nor yet to take God’s own encouragements to seek our own recovery and felicity. §8. The Light and Law of lapsed Nature does convince men of the duty of repenting and returning to God, and oblige them to it. So that as perfect obedience was the duty of entire Nature, so repentance is the duty of lapsed Nature: And I think few will say that all men are not hereby obliged to repent, and that in hope of mercy. §9. Hence it is that it is found among the communes notitiae [common notions], and all the world as well as Christians acknowledge it and plead for it. §10. They that by God’s patience and mercy are invited to repentance, which is a return from sin to God, and are by Nature obliged to it, ought to believe that it is not made their duty in vain, nor shall they lose by it if they perform it; for that were to accuse God of making man’s duty in vain, or to his loss, which is not to be suspected. §11. Therefore they are bound not to despair of pardon and salvation; for an obligation to use means as tending to recovery, is inconsistent with an obligation to despair. Therefore hope of mercy and use of some means mankind is obliged to by the Law of lapsed Nature. §12. This is not the obligation of the Law or Covenant of Innocency; for that Law bound us only as innocent to keep our innocency and perfectly therein obey: But it gives no pardon, nor appoints man any duty in order to pardon and recovery: Whatever does this, is a Law of Grace. §13. The sum of that duty which the Law of Nature now obliges man to, is, to consider of all the mercies which God vouchsafes sinners, and thankfully to improve them; to repent of sin, and turn to this God, who shows Himself a merciful pardoning God; To resign themselves to Him as their Owner, to obey Him as their Ruler, and to love and seek Him as their ultimate end; and to believe that his mercy will not let us be losers in so doing, nor to do it in vain. §14. But the supernatural revelation tells us much more than all this, of the promised Seed, the means of our salvation, and of our duty in believing them, and of the certainty and nature of the pardon, deliverance, and blessedness which we shall attain.”

— Richard Baxter, An End of Doctrinal Controversies, … (London: Salusbury, 1691), ch. 12, Of the Several Laws or Covenants of God, sect. 3, ‘Of the Law or Covenant of Grace in the First Edition’, pp. 127-30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A73.+God%E2%80%99s+actual+continuance+of+forfeited+life%2C+liberty%2C+health%2C+and+other+comforts%2C+and+his+actual+collation+of+many+great+mercies+by+the+course+of+Nature%2C+to+such+as+by+sin+have+deserved+present+damnation%2C+is+a+degree+of+signification+of+his+pardoning+will+and+mercy+by+these+natural+signs+%28which+they+were+not+before+sin+and+forfeiture%29.+%C2%A74.+Man+being+after+guilt+of+death%2C+thus+reprieved+and+enriched+with+manifold+mercies%2C+and+his+life+and+faculties+continued+with+many+instructing+providential+helps+and+means%2C+the+very+Law+of+Nature+now+obliges+him+to+love+and+thankfulness+to+God+that+shows+him+so+great+kindness.+%C2%A75.+And+the+same+Law+of+Nature+obliges+him+to+take+that+God+still+for+a+God+of+love+and+mercy%2C+and+to+believe%2C+that+what+mercy+He+has+already+showed+the+world+and+us%2C+is+on+terms+which+he+knows+to+be+very+well+consistent+with+his+holiness%2C+truth+and+justice%3A+And+it+obliges+us+therefore+to+seek+to+Him+for+mercy%2C+and+to+use+all+possible+means+for+further+hope+and+pardon+and+recovery%2C+and+not+to+sit+down+in+despair.+%C2%A76.+The+common+sense+of+all+mankind+from+Adam+to+this+day%2C+acquaints+us+by+that+experience%2C+that+these+hopes+and+duties+are+found+in+the+Law+of+lapsed+Nature%3A+For+all+the+world+that+never+heard+the+Gospel%2C+do+yet+take+God+to+be+a+merciful%2C+forgiving+God%2C+and+take+themselves+to+be+under+some+duty+for+the+obtaining+of+further+mercy%2C+recovery+and+felicity.+%C2%A77.+Though+want+of+the+sense+of+sin%2C+and+its+desert%2C+and+man%E2%80%99s+misery+may+be+thought+by+some+to+be+the+only+cause+of+this%2C+and+so+that+it+is+but+sinful+presumption%2C+and+no+part+of+Nature%E2%80%99s+obligation%3B+yet+this+upon+trial+will+prove+false+%28though+what+they+allege+be+one+part+of+the+cause%29.+For%3A+1.+These+men+do+acknowledge+themselves+sinners%2C+and+to+deserve+punishment+from+God.+2.+They+find+some+misery+and+fear+more.+3.+It+is+not+presumption+to+judge+God+to+be+merciful%2C+when+they+and+all+the+world+do+find+Him+so.+4.+It+is+not+presumption+to+judge%2C+that+he+can+and+will+pardon+sin%2C+when+full+experience+assures+us%2C+that+He+has+already+pardoned+much.+To+remit+the+sin%2C+is+%28as+we+now+speak+of+it%29+to+remit+the+deserved+punishment.+And+He+that+gives+man+forfeited+life%2C+health%2C+time%2C+and+all+the+abundant+mercies+which+the+world+is+full+of%2C+does+thereby+so+far+actually+forgive+sin%3A+Says+Christ%2C+%E2%80%98Whether+is+it+easier+to+say+thy+sins+be+forgiven+thee%2C+or+to+say+arise%2C+take+up+thy+Bed+and+walk%2C%E2%80%99+that+is%2C+Executively+to+forgive+them%2C+which+is+the+full+forgiveness%2C+by+taking+away+the+punishment.+5.+It+is+no+presumption+to+believe+such+duty+to+be+incumbent+on+us%2C+as+the+remaining+Law+of+Nature+does+oblige+us+to.+6.+Nor+yet+to+take+God%E2%80%99s+own+encouragements+to+seek+our+own+recovery+and+felicity.+%C2%A78.+The+Light+and+Law+of+lapsed+Nature+does+convince+men+of+the+duty+of+repenting+and+returning+to+God%2C+and+oblige+them+to+it.+So+that+as+perfect+obedience+was+the+duty+of+entire+Nature%2C+so+repentance+is+the+duty+of+lapsed+Nature%3A+And+I+think+few+will+say+that+all+men+are+not+hereby+obliged+to+repent%2C+and+that+in+hope+of+mercy.+%C2%A79.+Hence+it+is+that+it+is+found+among+the+communes+notitiae+%5Bcommon+notions%5D%2C+and+all+the+world+as+well+as+Christians+acknowledge+it+and+plead+for+it.+%C2%A710.+They+that+by+God%E2%80%99s+patience+and+mercy+are+invited+to+repentance%2C+which+is+a+return+from+sin+to+God%2C+and+are+by+Nature+obliged+to+it%2C+ought+to+believe+that+it+is+not+made+their+duty+in+vain%2C+nor+shall+they+lose+by+it+if+they+perform+it%3B+for+that+were+to+accuse+God+of+making+man%E2%80%99s+duty+in+vain%2C+or+to+his+loss%2C+which+is+not+to+be+suspected.+%C2%A711.+Therefore+they+are+bound+not+to+despair+of+pardon+and+salvation%3B+for+an+obligation+to+use+means+as+tending+to+recovery%2C+is+inconsistent+with+an+obligation+to+despair.+Therefore+hope+of+mercy+and+use+of+some+means+mankind+is+obliged+to+by+the+Law+of+lapsed+Nature.+%C2%A712.+This+is+not+the+obligation+of+the+Law+or+Covenant+of+Innocency%3B+for+that+Law+bound+us+only+as+innocent+to+keep+our+innocency+and+perfectly+therein+obey%3A+But+it+gives+no+pardon%2C+nor+appoints+man+any+duty+in+order+to+pardon+and+recovery%3A+Whatever+does+this%2C+is+a+Law+of+Grace.+%C2%A713.+The+sum+of+that+duty+which+the+Law+of+Nature+now+obliges+man+to%2C+is%2C+to+consider+of+all+the+mercies+which+God+vouchsafes+sinners%2C+and+thankfully+to+improve+them%3B+to+repent+of+sin%2C+and+turn+to+this+God%2C+who+shows+Himself+a+merciful+pardoning+God%3B+To+resign+themselves+to+Him+as+their+Owner%2C+to+obey+Him+as+their+Ruler%2C+and+to+love+and+seek+Him+as+their+ultimate+end%3B+and+to+believe+that+his+mercy+will+not+let+us+be+losers+in+so+doing%2C+nor+to+do+it+in+vain.+%C2%A714.+But+the+supernatural+revelation+tells+us+much+more+than+all+this%2C+of+the+promised+Seed%2C+the+means+of+our+salvation%2C+and+of+our+duty+in+believing+them%2C+and+of+the+certainty+and+nature+of+the+pardon%2C+deliverance%2C+and+blessedness+which+we+shall+attain.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+An+End+of+Doctrinal+Controversies%2C+%E2%80%A6+%28London%3A+Salusbury%2C+1691%29%2C+ch.+12%2C+Of+the+Several+Laws+or+Covenants+of+God%2C+sect.+3%2C+%E2%80%98Of+the+Law+or+Covenant+of+Grace+in+the+First+Edition%E2%80%99%2C+pp.+127-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c37b5eb0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c37b5eb0e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-necessity-of-the-atonement/#:~:text=3.%20God%E2%80%99s%20actual%20continuance%20of%20forfeited,and%20blessedness%20which%20we%20shall%20attain&amp;text=3.%20God%E2%80%99s%20actual%20continuance%20of%20forfeited%20life%2C%20liberty&amp;text=pardon%2C%20deliverance%2C%20and%20blessedness%20which%20we%20shall%20attain" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
